# ---------------------------------------------------------------------------
# PRD-Bench scaffold — Drum Corps Tour & Member Housing
# Difficulty target: ABOVE Expert (§0.4) — 13 entities, 59 endpoints,
# 10 state machines, 10 calculations, 50 error codes.
# ---------------------------------------------------------------------------
scenario: |
  Generate task harder than expert level!

  2733. Drum Corps Tour & Member Housing (competitive drum corps organization): member audition,
  contract signing and tuition payment plan administration, spring training housing at host schools
  with facility agreements and sleeping arrangements, tour routing with show dates, travel distance
  and rehearsal site booking between performances, food service on tour with dietary needs and
  volunteer cook staff, equipment and truck logistics including uniforms, instruments and props,
  member health and safety with athletic trainer coverage, heat protocols and minor supervision
  requirements, show fee and prize money reconciliation with the touring circuit, volunteer staffing
  across drivers, cooks and chaperones with background screening

domain_name: drum-corps-tour-member-housing

# Flat topology (§0.3): peer collections live at the root, so the effective
# top-level path prefix is "/" and every entity is addressed by its own
# collection (`/members`, `/tour-stops`, `/facility-agreements`, ...).
# Cross-entity links are foreign keys in request bodies, never URL nesting.
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities joined by FK fields in bodies; no nested URL paths anywhere.

  state_machine_shape: cyclic
  # MemberContract cycles ISSUED -> REVISION_REQUESTED -> ISSUED (revision rounds),
  # FacilityAgreement cycles SUBMITTED -> COUNTERED -> SUBMITTED (counter rounds),
  # PaymentPlan cycles ACTIVE -> DELINQUENT -> ACTIVE (delinquency / cure),
  # Member carries two INDEPENDENT parallel dimensions (membership_status x medical_status),
  # TourStop and FacilityAgreement branch (CONFIRMED -> {COMPLETED, CANCELLED} /
  # SUBMITTED -> {SIGNED, COUNTERED}) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Season -> Member, TourStop -> SiteBooking, ...
    - many_to_many         # Member <-> HostSchool via HousingAssignment; Volunteer <-> TourStop via StaffAssignment
    - self_referential     # TourStop.previous_stop_id -> TourStop.id (tour route chain)
    - cross_aggregate      # SiteBooking spans TourStop + HostSchool + FacilityAgreement

  role_model: segregation_of_duties
  # The user who recorded a Volunteer's background screening may not approve that
  # Volunteer's StaffAssignment; the user who prepared a ShowSettlement may not
  # finalize it. Enforced on X-User-ID, not on X-User-Role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: season label, e.g. "2027 Tour"
      - name: year
        type: integer
        source: input
        description: competitive season year
        constraints: 2020 <= year <= 2100
      - name: tuition_base_cents
        type: integer
        source: input
        description: published per-member season tuition in cents; the reference figure quoted on contracts
        constraints: ">= 0"
      - name: spring_training_start_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) on which spring training housing begins
      - name: spring_training_end_date
        type: string
        source: input
        description: ISO date on which spring training ends; must be > spring_training_start_date
      - name: tour_departure_date
        type: string
        source: input
        description: ISO date the corps leaves for tour; minor age and withdrawal-variant selection both key off this date
      - name: billing_epoch
        type: integer
        source: computed
        description: count of completed run-billing-cycle sweeps; incremented by exactly 1 per sweep
        default: 0
      - name: tuition_charged_cents
        type: integer
        source: computed
        description: "sum of Member.tuition_charged_cents over Members of this Season whose membership_status IN {CONTRACTED, ON_TOUR, WITHDRAWN}"
        default: 0
      - name: tuition_collected_cents
        type: integer
        source: computed
        description: "sum of TuitionPayment.allocated_to_principal_cents over payments with status == POSTED whose PaymentPlan belongs to a Member of this Season"
        default: 0
      - name: late_fee_collected_cents
        type: integer
        source: computed
        description: "sum of TuitionPayment.allocated_to_late_fee_cents over payments with status == POSTED whose PaymentPlan belongs to a Member of this Season"
        default: 0
      - name: housing_cost_cents
        type: integer
        source: computed
        description: "sum of FacilityAgreement.billable_cents over agreements of this Season whose status == SIGNED"
        default: 0
      - name: tour_revenue_cents
        type: integer
        source: computed
        description: "sum of ShowSettlement.final_net_cents over settlements whose status == FINALIZED and whose TourStop belongs to this Season"
        default: 0
      - name: ledger_status
        type: enum
        source: computed
        description: "OPEN until a run-billing-cycle sweep observes every TourStop of the Season in {COMPLETED, CANCELLED} and every ShowSettlement of those stops FINALIZED, at which point it becomes RECONCILED"
        default: OPEN
        constraints: "OPEN | RECONCILED"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this member auditioned for"
      - name: full_name
        type: string
        source: input
        description: member legal name
      - name: email
        type: string
        source: input
        description: contact email; unique per season
        constraints: unique within (season_id, email)
      - name: date_of_birth
        type: string
        source: input
        description: ISO date of birth; drives is_minor
      - name: section
        type: enum
        source: input
        description: performing section
        constraints: "BRASS | PERCUSSION | COLOR_GUARD"
      - name: dietary_flag
        type: enum
        source: input
        description: dietary requirement used by the tour food-service cost calculation
        default: NONE
        constraints: "NONE | VEGETARIAN | GLUTEN_FREE | SEVERE_ALLERGEN"
      - name: is_minor
        type: boolean
        source: computed
        description: "true iff the member has NOT reached their 18th birthday on or before Season.tour_departure_date (i.e. date_of_birth > tour_departure_date minus 18 years)"
      - name: audition_score
        type: number
        source: input
        description: score recorded with the audition decision; null until an audition decision exists
        constraints: 0 <= audition_score <= 100
      - name: membership_status
        type: enum
        source: computed
        description: "membership dimension of the parallel state machine; independent of medical_status"
        default: APPLICANT
        constraints: "APPLICANT | OFFERED | DECLINED | CONTRACTED | ON_TOUR | WITHDRAWN"
      - name: medical_status
        type: enum
        source: computed
        description: "health dimension of the parallel state machine; independent of membership_status"
        default: CLEARED
        constraints: "CLEARED | RESTRICTED | SIDELINED"
      - name: tuition_charged_cents
        type: integer
        source: computed
        description: 0 until the member's contract is EXECUTED, then MemberContract.tuition_amount_cents; replaced by withdrawal_obligation_cents when the member withdraws
        default: 0
      - name: tuition_paid_cents
        type: integer
        source: computed
        description: "sum of TuitionPayment.allocated_to_principal_cents over POSTED payments against this member's PaymentPlans (late-fee allocations are excluded)"
        default: 0
      - name: tuition_balance_cents
        type: integer
        source: computed
        description: max(0, tuition_charged_cents - tuition_paid_cents)
        default: 0
      - name: refund_due_cents
        type: integer
        source: computed
        description: max(0, tuition_paid_cents - tuition_charged_cents)
        default: 0
      - name: withdrawal_date
        type: string
        source: input
        description: ISO date the withdrawal takes effect; null while the member has not withdrawn
      - name: withdrawal_obligation_cents
        type: integer
        source: computed
        description: outcome of the member_withdrawal_obligation calculation; null while the member has not withdrawn
      - name: withdrawal_obligation_basis
        type: enum
        source: computed
        description: which variant of member_withdrawal_obligation produced withdrawal_obligation_cents
        default: NONE
        constraints: "NONE | PRORATED_SPRING | LIQUIDATED_LADDER"

  - name: MemberContract
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the contracted member"
      - name: tuition_amount_cents
        type: integer
        source: input
        description: contracted tuition principal in cents for this member
        constraints: ">= 0"
      - name: payment_plan_type
        type: enum
        source: input
        description: plan shape the member contracted for; a PaymentPlan must be created with this exact type
        constraints: "STANDARD_3 | EXTENDED_6"
      - name: status
        type: enum
        source: computed
        description: cyclic contract lifecycle
        default: ISSUED
        constraints: "ISSUED | REVISION_REQUESTED | SIGNED_BY_MEMBER | EXECUTED | VOIDED"
      - name: revision_round
        type: integer
        source: computed
        description: number of completed reissues; incremented by 1 on every reissue; a 4th reissue attempt is rejected
        default: 0
      - name: revision_note
        type: string
        source: input
        description: note supplied by the member with the most recent revision request; null before the first request
      - name: signature_name
        type: string
        source: input
        description: name typed by the member when signing; null until signed
      - name: signed_at
        type: datetime
        source: system
        description: logical-clock instant of the member signature; null until signed
      - name: executed_at
        type: datetime
        source: system
        description: logical-clock instant of countersignature/execution; null until executed

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; denormalised from the contract for filtering"
      - name: member_contract_id
        type: string
        source: input
        description: "FK -> MemberContract.id; the EXECUTED contract this plan finances"
      - name: plan_type
        type: enum
        source: computed
        description: copied from MemberContract.payment_plan_type at creation
        constraints: "STANDARD_3 | EXTENDED_6"
      - name: first_due_date
        type: string
        source: input
        description: ISO date of installment 1; installment k is due first_due_date + 30*(k-1) days
      - name: installment_count
        type: integer
        source: computed
        description: 3 when plan_type == STANDARD_3, 6 when plan_type == EXTENDED_6
      - name: principal_cents
        type: integer
        source: computed
        description: copied from MemberContract.tuition_amount_cents at creation
      - name: surcharge_cents
        type: integer
        source: computed
        description: financing surcharge from the installment_schedule calculation (0 for STANDARD_3)
      - name: financed_total_cents
        type: integer
        source: computed
        description: principal_cents + surcharge_cents
      - name: installment_base_cents
        type: integer
        source: computed
        description: floor(financed_total_cents / installment_count)
      - name: installment_remainder_cents
        type: integer
        source: computed
        description: financed_total_cents - installment_base_cents * installment_count; distributed one cent each to installments 1..installment_remainder_cents
      - name: principal_paid_cents
        type: integer
        source: computed
        description: "sum of TuitionPayment.allocated_to_principal_cents over POSTED payments on this plan"
        default: 0
      - name: late_fee_accrued_cents
        type: integer
        source: computed
        description: cumulative late fees charged by run-billing-cycle sweeps on this plan
        default: 0
      - name: late_fee_paid_cents
        type: integer
        source: computed
        description: "sum of TuitionPayment.allocated_to_late_fee_cents over POSTED payments on this plan"
        default: 0
      - name: installments_due_count
        type: integer
        source: computed
        description: number of installment due dates <= the logical clock date, capped at installment_count; recomputed on every run-billing-cycle sweep and on every payment
        default: 0
      - name: due_amount_cents
        type: integer
        source: computed
        description: sum of installment amounts for k = 1..installments_due_count
        default: 0
      - name: arrears_cents
        type: integer
        source: computed
        description: max(0, due_amount_cents - principal_paid_cents)
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: (financed_total_cents - principal_paid_cents) + (late_fee_accrued_cents - late_fee_paid_cents)
      - name: delinquency_strikes
        type: integer
        source: computed
        description: number of run-billing-cycle sweeps that observed arrears_cents > 0 on this plan; at 3 the plan closes
        default: 0
      - name: status
        type: enum
        source: computed
        description: cyclic plan lifecycle (ACTIVE <-> DELINQUENT), terminal at SETTLED / CLOSED_WITH_BALANCE / SUPERSEDED
        default: ACTIVE
        constraints: "ACTIVE | DELINQUENT | SETTLED | CLOSED_WITH_BALANCE | SUPERSEDED"

  - name: TuitionPayment
    parent: null
    common_fields: true
    fields:
      - name: payment_plan_id
        type: string
        source: input
        description: "FK -> PaymentPlan.id; the plan this payment is applied to"
      - name: amount_cents
        type: integer
        source: input
        description: gross amount tendered in cents
        constraints: ">= 1"
      - name: received_on
        type: string
        source: input
        description: ISO business date the funds were received; may not be after the logical clock date
      - name: method
        type: enum
        source: input
        description: tender type
        constraints: "CHECK | ACH | CARD"
      - name: allocated_to_late_fee_cents
        type: integer
        source: computed
        description: first bucket of the payment_waterfall_allocation calculation
      - name: allocated_to_principal_cents
        type: integer
        source: computed
        description: second bucket of the payment_waterfall_allocation calculation
      - name: status
        type: enum
        source: computed
        description: POSTED on creation; REVERSED after a reversal
        default: POSTED
        constraints: "POSTED | REVERSED"
      - name: reversal_reason
        type: string
        source: input
        description: reason recorded on reversal; null while POSTED
      - name: reversed_at
        type: datetime
        source: system
        description: logical-clock instant of reversal; null while POSTED

  - name: HostSchool
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: host school name
      - name: city
        type: string
        source: input
        description: city
      - name: state_code
        type: string
        source: input
        description: two-letter US state code
        constraints: exactly 2 uppercase letters
      - name: sleeping_space_count
        type: integer
        source: input
        description: number of distinct sleeping spaces (gyms, classrooms) offered; HousingAssignment.space_index must be in 1..sleeping_space_count
        constraints: ">= 1"
      - name: capacity_per_space
        type: integer
        source: input
        description: nominal bunk capacity of each sleeping space before the minor chaperone-bunk reservation
        constraints: ">= 1"
      - name: rehearsal_field_count
        type: integer
        source: input
        description: rehearsal fields available; a SiteBooking requires >= 1
        constraints: ">= 0"
      - name: has_air_conditioning
        type: boolean
        source: input
        description: whether indoor spaces are air conditioned; relaxes the extreme-heat rehearsal prohibition
      - name: booked_block_count
        type: integer
        source: computed
        description: "count of SiteBookings on this school whose status IN {HELD, CONFIRMED}"
        default: 0
      - name: reserved_bed_nights
        type: integer
        source: computed
        description: "sum of HousingAssignment.nights over ACTIVE assignments whose FacilityAgreement.host_school_id == this school"
        default: 0

  - name: FacilityAgreement
    parent: null
    common_fields: true
    fields:
      - name: host_school_id
        type: string
        source: input
        description: "FK -> HostSchool.id; the school being contracted"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season the agreement belongs to"
      - name: usage_type
        type: enum
        source: input
        description: "what the facility is contracted for; SPRING_TRAINING agreements carry sleeping arrangements (HousingAssignments), TOUR_REHEARSAL agreements carry rehearsal blocks (SiteBookings)"
        constraints: "SPRING_TRAINING | TOUR_REHEARSAL"
      - name: start_date
        type: string
        source: input
        description: ISO first date of the agreement window (inclusive)
      - name: end_date
        type: string
        source: input
        description: ISO exclusive end date of the agreement window; agreement_nights = end_date - start_date in days
      - name: nightly_rate_cents
        type: integer
        source: input
        description: corps-proposed per-bed-night rate in cents
        constraints: ">= 0"
      - name: minimum_billable_beds
        type: integer
        source: input
        description: floor the school bills against, in beds per night
        constraints: ">= 0"
      - name: countered_nightly_rate_cents
        type: integer
        source: input
        description: rate the school countered with on the most recent counter; null while counter_round == 0
      - name: counter_round
        type: integer
        source: computed
        description: number of counters recorded; incremented by 1 per counter; a 3rd counter is rejected
        default: 0
      - name: effective_nightly_rate_cents
        type: integer
        source: computed
        description: pinned at signing — countered_nightly_rate_cents when counter_round > 0, else nightly_rate_cents; null until SIGNED
      - name: occupied_bed_nights
        type: integer
        source: computed
        description: "sum of HousingAssignment.nights over assignments on this agreement whose status == ACTIVE"
        default: 0
      - name: billable_bed_nights
        type: integer
        source: computed
        description: max(occupied_bed_nights, minimum_billable_beds * agreement_nights)
        default: 0
      - name: billable_cents
        type: integer
        source: computed
        description: billable_bed_nights * effective_nightly_rate_cents; 0 while the agreement is not SIGNED
        default: 0
      - name: status
        type: enum
        source: computed
        description: negotiation lifecycle with a SUBMITTED <-> COUNTERED cycle and a SUBMITTED -> {SIGNED, COUNTERED} branch
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | COUNTERED | SIGNED | CANCELLED"
      - name: cancel_reason
        type: string
        source: input
        description: reason recorded on cancellation; null otherwise

  - name: HousingAssignment
    parent: null
    common_fields: true
    fields:
      - name: facility_agreement_id
        type: string
        source: input
        description: "FK -> FacilityAgreement.id; the SIGNED agreement whose beds are consumed"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the housed member"
      - name: space_index
        type: integer
        source: input
        description: 1-based sleeping space number within the host school
        constraints: 1 <= space_index <= HostSchool.sleeping_space_count
      - name: check_in_date
        type: string
        source: input
        description: ISO first night occupied (inclusive)
      - name: check_out_date
        type: string
        source: input
        description: ISO departure date (exclusive) — the check-out date itself is NOT occupied
      - name: nights
        type: integer
        source: computed
        description: check_out_date - check_in_date in days
      - name: occupant_is_minor
        type: boolean
        source: computed
        description: snapshot of Member.is_minor at assignment creation; drives the minor-mix rule and the chaperone-bunk capacity reservation
      - name: status
        type: enum
        source: computed
        description: ACTIVE until released
        default: ACTIVE
        constraints: "ACTIVE | RELEASED"
      - name: released_reason
        type: enum
        source: computed
        description: why the assignment stopped consuming beds; null while ACTIVE
        constraints: "MANUAL | MEMBER_WITHDRAWN | AGREEMENT_CANCELLED"

  - name: TourStop
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season being toured"
      - name: previous_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; self-referential route link to the stop the convoy departs from; null for the first stop of a leg"
      - name: stop_type
        type: enum
        source: input
        description: whether the corps competes at this stop
        constraints: "SHOW | REHEARSAL_ONLY"
      - name: venue_name
        type: string
        source: input
        description: stadium or school name
      - name: city
        type: string
        source: input
        description: city
      - name: state_code
        type: string
        source: input
        description: two-letter US state code
      - name: arrive_at
        type: datetime
        source: input
        description: ISO8601 UTC convoy arrival instant
      - name: depart_at
        type: datetime
        source: input
        description: ISO8601 UTC convoy departure instant; must be > arrive_at
      - name: show_start_at
        type: datetime
        source: input
        description: ISO8601 UTC competition start; required when stop_type == SHOW, must be null when stop_type == REHEARSAL_ONLY
      - name: travel_miles_from_previous
        type: integer
        source: input
        description: convoy road miles from previous_stop_id; must be 0 when previous_stop_id is null
        constraints: ">= 0"
      - name: uniform_trunks
        type: integer
        source: input
        description: uniform trunks to be trucked to this stop
        constraints: ">= 0"
      - name: instrument_cases
        type: integer
        source: input
        description: instrument cases to be trucked to this stop
        constraints: ">= 0"
      - name: prop_units
        type: integer
        source: input
        description: prop units (floor sections, towers) to be trucked to this stop
        constraints: ">= 0"
      - name: truck_count
        type: integer
        source: input
        description: tractor-trailers actually available for this move
        constraints: ">= 0"
      - name: rehearsal_minutes
        type: integer
        source: input
        description: planned on-site rehearsal minutes at this stop
        constraints: ">= 0"
      - name: heat_index_f
        type: integer
        source: input
        description: forecast heat index in degrees Fahrenheit governing heat protocols at this stop
        constraints: 0 <= heat_index_f <= 140
      - name: total_load_cuft
        type: integer
        source: computed
        description: cubic-foot output of the transport_plan calculation
      - name: total_load_lbs
        type: integer
        source: computed
        description: pound output of the transport_plan calculation
      - name: trucks_required
        type: integer
        source: computed
        description: truck output of the transport_plan calculation
      - name: required_travel_minutes
        type: integer
        source: computed
        description: output of the travel_feasibility calculation; 0 when previous_stop_id is null
      - name: roster_head_count
        type: integer
        source: computed
        description: "count of Members of this Season with membership_status == ON_TOUR, snapshotted at confirm; 0 before confirm"
        default: 0
      - name: minor_head_count
        type: integer
        source: computed
        description: "count of Members of this Season with membership_status == ON_TOUR AND is_minor == true, snapshotted at confirm"
        default: 0
      - name: required_chaperone_count
        type: integer
        source: computed
        description: ceil(minor_head_count / 10), snapshotted at confirm
        default: 0
      - name: required_cook_count
        type: integer
        source: computed
        description: ceil(roster_head_count / 40), snapshotted at confirm
        default: 0
      - name: meal_cost_cents
        type: integer
        source: computed
        description: output of the stop_meal_cost calculation, snapshotted at confirm; 0 before confirm
        default: 0
      - name: status
        type: enum
        source: computed
        description: route lifecycle; CONFIRMED branches to COMPLETED or CANCELLED with divergent side effects
        default: PLANNED
        constraints: "PLANNED | CONFIRMED | COMPLETED | CANCELLED"
      - name: settlement_state
        type: enum
        source: computed
        description: circuit-reconciliation posture bubbled up from the stop's ShowSettlement
        default: NONE
        constraints: "NONE | PENDING | SETTLED"
      - name: cancel_reason
        type: string
        source: input
        description: reason recorded on cancellation; null otherwise

  - name: SiteBooking
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the stop this rehearsal block belongs to"
      - name: host_school_id
        type: string
        source: input
        description: "FK -> HostSchool.id; the site being occupied"
      - name: facility_agreement_id
        type: string
        source: input
        description: "FK -> FacilityAgreement.id; the SIGNED agreement authorising the occupation"
      - name: block_start_at
        type: datetime
        source: input
        description: ISO8601 UTC start of the rehearsal block (inclusive)
      - name: block_end_at
        type: datetime
        source: input
        description: ISO8601 UTC end of the rehearsal block (exclusive); must be > block_start_at
      - name: indoor
        type: boolean
        source: input
        description: whether the block is held indoors; combined with HostSchool.has_air_conditioning it relaxes the extreme-heat prohibition
      - name: status
        type: enum
        source: computed
        description: HELD on creation, CONFIRMED when the parent stop is confirmed, RELEASED when freed
        default: HELD
        constraints: "HELD | CONFIRMED | RELEASED"
      - name: released_reason
        type: enum
        source: computed
        description: why the block was freed; null unless RELEASED
        constraints: "MANUAL | STOP_CANCELLED | AGREEMENT_CANCELLED"

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: volunteer legal name
      - name: email
        type: string
        source: input
        description: contact email; unique across volunteers
        constraints: unique
      - name: role_type
        type: enum
        source: input
        description: volunteer corps role
        constraints: "DRIVER | COOK | CHAPERONE | ATHLETIC_TRAINER"
      - name: cdl_number
        type: string
        source: input
        description: commercial driver licence number; required when role_type == DRIVER, must be null otherwise
      - name: credential_id
        type: string
        source: input
        description: athletic-training credential id; required when role_type == ATHLETIC_TRAINER, must be null otherwise
      - name: screening_status
        type: enum
        source: computed
        description: background-screening posture; EXPIRED is written by a run-billing-cycle sweep
        default: PENDING
        constraints: "PENDING | CLEARED | REJECTED | EXPIRED"
      - name: screening_decided_on
        type: string
        source: input
        description: ISO date the screening decision was recorded; null while PENDING
      - name: screening_expires_on
        type: string
        source: computed
        description: screening_decided_on + 365 days; null unless screening_status == CLEARED or EXPIRED
      - name: screened_by_user_id
        type: string
        source: system
        description: X-User-ID of the VolunteerScreener who recorded the decision; the segregation-of-duties comparison key
      - name: assignment_count
        type: integer
        source: computed
        description: "count of StaffAssignments on this volunteer whose status == APPROVED"
        default: 0

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the staffed volunteer"
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the stop being staffed"
      - name: duty
        type: enum
        source: input
        description: duty performed; must match the volunteer's role_type (DRIVE<->DRIVER, COOK<->COOK, CHAPERONE<->CHAPERONE, TRAINER<->ATHLETIC_TRAINER)
        constraints: "DRIVE | COOK | CHAPERONE | TRAINER"
      - name: shift_start_at
        type: datetime
        source: input
        description: ISO8601 UTC shift start (inclusive); must be >= TourStop.arrive_at
      - name: shift_end_at
        type: datetime
        source: input
        description: ISO8601 UTC shift end (exclusive); must be <= TourStop.depart_at and > shift_start_at
      - name: status
        type: enum
        source: computed
        description: three-party approval chain then release
        default: PROPOSED
        constraints: "PROPOSED | ACCEPTED | APPROVED | RELEASED"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the TourManager who approved; must differ from Volunteer.screened_by_user_id
      - name: released_reason
        type: enum
        source: computed
        description: why the assignment was released; null unless RELEASED
        constraints: "STOP_CANCELLED | SCREENING_EXPIRED"

  - name: ShowSettlement
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the COMPLETED show being reconciled; at most one settlement per stop"
        constraints: unique per tour_stop_id
      - name: appearance_fee_cents
        type: integer
        source: input
        description: contracted appearance fee the circuit owes for the show
        constraints: ">= 0"
      - name: prize_pool_cents
        type: integer
        source: input
        description: total prize pool the circuit posted for the show
        constraints: ">= 0"
      - name: projected_placement
        type: integer
        source: input
        description: placement the corps registered as its projection; drives the provisional variant
        constraints: 1 <= projected_placement <= 12
      - name: final_placement
        type: integer
        source: input
        description: placement the circuit certified; supplied at finalize, null before
        constraints: 1 <= final_placement <= 12
      - name: provisional_prize_cents
        type: integer
        source: computed
        description: prize component of the provisional_forward variant
      - name: provisional_gross_cents
        type: integer
        source: computed
        description: appearance_fee_cents + provisional_prize_cents
      - name: provisional_circuit_fee_cents
        type: integer
        source: computed
        description: circuit fee under the provisional_forward variant
      - name: provisional_net_cents
        type: integer
        source: computed
        description: provisional_gross_cents - provisional_circuit_fee_cents
      - name: final_prize_cents
        type: integer
        source: computed
        description: prize component of the circuit_final variant; null until FINALIZED
      - name: final_gross_cents
        type: integer
        source: computed
        description: appearance_fee_cents + final_prize_cents + sum of PRIZE_ADJUSTMENT remittance amounts; null until FINALIZED
      - name: final_circuit_fee_cents
        type: integer
        source: computed
        description: circuit fee under the circuit_final variant; null until FINALIZED
      - name: sanctions_charged_cents
        type: integer
        source: computed
        description: total sanction fees actually charged by the chronological replay; null until FINALIZED
      - name: rebate_applied_cents
        type: integer
        source: computed
        description: total fee rebate actually applied by the chronological replay; null until FINALIZED
      - name: final_net_cents
        type: integer
        source: computed
        description: running net after the chronological remittance replay; null until FINALIZED
      - name: variance_cents
        type: integer
        source: computed
        description: final_net_cents - provisional_net_cents; null until FINALIZED
      - name: remittance_line_count
        type: integer
        source: computed
        description: "number of remittance lines submitted with the finalize call, counting PRIZE_ADJUSTMENT lines as well as the replayed sanction and rebate lines"
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID that created the draft; the segregation-of-duties comparison key for finalize
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID that finalized; null while DRAFT
      - name: status
        type: enum
        source: computed
        description: draft then finalized
        default: DRAFT
        constraints: "DRAFT | FINALIZED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# Member carries TWO independent dimensions on the same row (parallel shape);
# MemberContract, FacilityAgreement and PaymentPlan are cyclic; TourStop and
# FacilityAgreement branch with divergent side-effect sets.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Member
    dimension: membership_status
    initial_state: APPLICANT
    terminal_states: [DECLINED, WITHDRAWN]
    note: "This dimension evolves independently of medical_status; neither dimension constrains the other's transitions, but MemberContract execution reads medical_status."
    transitions:
      - from: APPLICANT
        to: OFFERED
        trigger: "POST /members/{member_id}/audition-decision with decision == OFFER"
        actor: MembershipCoordinator
        preconditions: ["membership_status == APPLICANT"]
        side_effects: ["audition_score set from the request", "version += 1"]
      - from: APPLICANT
        to: DECLINED
        trigger: "POST /members/{member_id}/audition-decision with decision == DECLINE"
        actor: MembershipCoordinator
        preconditions: ["membership_status == APPLICANT"]
        side_effects: ["audition_score set from the request", "version += 1"]
      - from: OFFERED
        to: CONTRACTED
        trigger: "POST /member-contracts/{member_contract_id}/execute"
        actor: CorpsDirector
        preconditions: ["the member's contract is SIGNED_BY_MEMBER", "Member.medical_status == CLEARED"]
        side_effects:
          - "Member.tuition_charged_cents = MemberContract.tuition_amount_cents"
          - "Member.tuition_balance_cents recomputed as max(0, tuition_charged_cents - tuition_paid_cents)"
          - "Season.tuition_charged_cents recomputed"
          - "Member.version += 1"
      - from: CONTRACTED
        to: ON_TOUR
        trigger: "system: POST /seasons/{season_id}/run-billing-cycle when the logical clock date >= Season.tour_departure_date"
        actor: system
        preconditions: ["membership_status == CONTRACTED", "the member has no PaymentPlan with status == CLOSED_WITH_BALANCE"]
        side_effects: ["Member.version += 1"]
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /members/{member_id}/withdraw"
        actor: MembershipCoordinator
        preconditions: ["membership_status == OFFERED", "withdrawal_date <= logical clock date"]
        side_effects:
          - "withdrawal_obligation_cents = 0 and withdrawal_obligation_basis = NONE (no executed contract, so no obligation arises)"
          - "the member's MemberContract, if in {ISSUED, REVISION_REQUESTED, SIGNED_BY_MEMBER}, transitions to VOIDED"
          - "Member.version += 1"
      - from: CONTRACTED
        to: WITHDRAWN
        trigger: "POST /members/{member_id}/withdraw"
        actor: MembershipCoordinator
        preconditions: ["membership_status == CONTRACTED", "withdrawal_date <= logical clock date"]
        side_effects:
          - "member_withdrawal_obligation runs; withdrawal_obligation_cents / withdrawal_obligation_basis written; Member.tuition_charged_cents = withdrawal_obligation_cents"
          - "Member.tuition_balance_cents and Member.refund_due_cents recomputed; Season.tuition_charged_cents recomputed"
          - "CASCADE link 2: because the member is now WITHDRAWN, every PaymentPlan of this member with status IN {ACTIVE, DELINQUENT} moves to SETTLED when outstanding_cents <= 0 after the recharge, else to CLOSED_WITH_BALANCE"
          - "CASCADE link 3: because the member is now WITHDRAWN, every HousingAssignment of this member with status == ACTIVE moves to RELEASED with released_reason = MEMBER_WITHDRAWN"
          - "CASCADE link 4: because those assignments were released, each affected FacilityAgreement recomputes occupied_bed_nights / billable_bed_nights / billable_cents, each affected HostSchool recomputes reserved_bed_nights, and Season.housing_cost_cents is recomputed"
          - "Member.version += 1"
      - from: ON_TOUR
        to: WITHDRAWN
        trigger: "POST /members/{member_id}/withdraw"
        actor: MembershipCoordinator
        preconditions: ["membership_status == ON_TOUR", "withdrawal_date <= logical clock date"]
        side_effects: ["identical to the CONTRACTED -> WITHDRAWN transition, including cascade links 2, 3 and 4"]
      - from: CONTRACTED
        to: WITHDRAWN
        trigger: "system: POST /seasons/{season_id}/run-billing-cycle when a PaymentPlan reaches delinquency_strikes == 3"
        actor: system
        preconditions: ["membership_status == CONTRACTED", "the sweep just set that PaymentPlan.status = CLOSED_WITH_BALANCE"]
        side_effects:
          - "CASCADE link 2 (caused by link 1, the plan closure): withdrawal_date = logical clock date, member_withdrawal_obligation runs, Member.tuition_charged_cents = withdrawal_obligation_cents, refund_due_cents / tuition_balance_cents recomputed"
          - "CASCADE link 3 (caused by link 2): every ACTIVE HousingAssignment of this member -> RELEASED with released_reason = MEMBER_WITHDRAWN"
          - "CASCADE link 4 (caused by link 3): affected FacilityAgreement occupancy and billing recomputed, affected HostSchool.reserved_bed_nights recomputed, Season.housing_cost_cents recomputed"
          - "the member's PaymentPlan status is NOT re-derived after link 2 — CLOSED_WITH_BALANCE is terminal"
          - "Member.version += 1"

  - entity: Member
    dimension: medical_status
    initial_state: CLEARED
    terminal_states: []
    note: "Cyclic and fully independent of membership_status; a SIDELINED member keeps their membership_status and their housing."
    transitions:
      - from: CLEARED
        to: RESTRICTED
        trigger: "POST /members/{member_id}/medical-status with medical_status == RESTRICTED"
        actor: MembershipCoordinator
        preconditions: ["medical_status == CLEARED"]
        side_effects: ["version += 1"]
      - from: RESTRICTED
        to: CLEARED
        trigger: "POST /members/{member_id}/medical-status with medical_status == CLEARED"
        actor: MembershipCoordinator
        preconditions: ["medical_status == RESTRICTED"]
        side_effects: ["version += 1"]
      - from: CLEARED
        to: SIDELINED
        trigger: "POST /members/{member_id}/medical-status with medical_status == SIDELINED"
        actor: MembershipCoordinator
        preconditions: ["medical_status == CLEARED"]
        side_effects: ["version += 1"]
      - from: RESTRICTED
        to: SIDELINED
        trigger: "POST /members/{member_id}/medical-status with medical_status == SIDELINED"
        actor: MembershipCoordinator
        preconditions: ["medical_status == RESTRICTED"]
        side_effects: ["version += 1"]
      - from: SIDELINED
        to: RESTRICTED
        trigger: "POST /members/{member_id}/medical-status with medical_status == RESTRICTED"
        actor: MembershipCoordinator
        preconditions: ["medical_status == SIDELINED"]
        side_effects: ["version += 1"]
      - from: SIDELINED
        to: CLEARED
        trigger: "POST /members/{member_id}/medical-status with medical_status == CLEARED"
        actor: MembershipCoordinator
        preconditions: ["medical_status == SIDELINED"]
        side_effects: ["version += 1"]

  - entity: MemberContract
    initial_state: ISSUED
    terminal_states: [EXECUTED, VOIDED]
    note: "Cyclic: ISSUED -> REVISION_REQUESTED -> ISSUED, at most 3 completed revision rounds."
    transitions:
      - from: ISSUED
        to: REVISION_REQUESTED
        trigger: "POST /member-contracts/{member_contract_id}/request-revision"
        actor: Member
        preconditions: ["status == ISSUED", "X-User-ID == MemberContract.member_id"]
        side_effects: ["revision_note stored", "version += 1"]
        note: "A revision may always be requested from ISSUED; the round cap is enforced on the reissue that would close the round, so a 4th request-revision succeeds and leaves the contract stuck in REVISION_REQUESTED."
      - from: REVISION_REQUESTED
        to: ISSUED
        trigger: "POST /member-contracts/{member_contract_id}/reissue"
        actor: MembershipCoordinator
        preconditions: ["status == REVISION_REQUESTED", "revision_round < 3"]
        side_effects: ["tuition_amount_cents and payment_plan_type replaced from the request", "revision_round += 1", "version += 1"]
      - from: ISSUED
        to: SIGNED_BY_MEMBER
        trigger: "POST /member-contracts/{member_contract_id}/sign"
        actor: Member
        preconditions: ["status == ISSUED", "X-User-ID == MemberContract.member_id"]
        side_effects: ["signature_name stored", "signed_at = logical clock instant", "version += 1"]
      - from: SIGNED_BY_MEMBER
        to: EXECUTED
        trigger: "POST /member-contracts/{member_contract_id}/execute"
        actor: CorpsDirector
        preconditions: ["status == SIGNED_BY_MEMBER", "Member.medical_status == CLEARED", "Member.membership_status == OFFERED"]
        side_effects:
          - "executed_at = logical clock instant"
          - "Member.membership_status OFFERED -> CONTRACTED with the ledger side effects listed on that transition"
          - "version += 1"
      - from: ISSUED
        to: VOIDED
        trigger: "system: POST /members/{member_id}/withdraw from membership_status == OFFERED"
        actor: system
        preconditions: ["status == ISSUED"]
        side_effects: ["version += 1"]
      - from: REVISION_REQUESTED
        to: VOIDED
        trigger: "system: POST /members/{member_id}/withdraw from membership_status == OFFERED"
        actor: system
        preconditions: ["status == REVISION_REQUESTED"]
        side_effects: ["version += 1"]
      - from: SIGNED_BY_MEMBER
        to: VOIDED
        trigger: "system: POST /members/{member_id}/withdraw from membership_status == OFFERED"
        actor: system
        preconditions: ["status == SIGNED_BY_MEMBER"]
        side_effects: ["version += 1"]

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [SETTLED, CLOSED_WITH_BALANCE, SUPERSEDED]
    note: "Cyclic: ACTIVE -> DELINQUENT -> ACTIVE. A payment reversal can push a cured plan back to DELINQUENT."
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system: POST /seasons/{season_id}/run-billing-cycle observing arrears_cents > 0"
        actor: system
        preconditions: ["status == ACTIVE", "arrears_cents > 0 after installments_due_count is refreshed against the logical clock"]
        side_effects: ["late_fee_accrued_cents increased per the late_fee_assessment calculation", "delinquency_strikes += 1", "outstanding_cents recomputed", "version += 1"]
      - from: DELINQUENT
        to: DELINQUENT
        trigger: "system: POST /seasons/{season_id}/run-billing-cycle observing arrears_cents > 0 with delinquency_strikes < 2"
        actor: system
        preconditions: ["status == DELINQUENT", "arrears_cents > 0", "delinquency_strikes < 2 before the sweep"]
        side_effects: ["late_fee_accrued_cents increased per the late_fee_assessment calculation", "delinquency_strikes += 1", "version += 1"]
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /tuition-payments that clears arrears (cure)"
        actor: BusinessManager
        preconditions: ["status == DELINQUENT", "arrears_cents == 0 after the payment_waterfall_allocation side effects", "outstanding_cents > 0 after allocation"]
        side_effects: ["delinquency_strikes left unchanged (strikes never decrease)", "version += 1"]
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /tuition-payments whose allocation drives outstanding_cents to 0"
        actor: BusinessManager
        preconditions: ["status == ACTIVE", "outstanding_cents == 0 after allocation"]
        side_effects: ["version += 1"]
      - from: DELINQUENT
        to: SETTLED
        trigger: "POST /tuition-payments whose allocation drives outstanding_cents to 0"
        actor: BusinessManager
        preconditions: ["status == DELINQUENT", "outstanding_cents == 0 after allocation"]
        side_effects: ["version += 1"]
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /tuition-payments/{tuition_payment_id}/reverse that re-opens arrears (compensating action)"
        actor: BusinessManager
        preconditions: ["status == ACTIVE", "arrears_cents > 0 after the reversal restores principal_paid_cents and late_fee_paid_cents"]
        side_effects: ["version += 1"]
      - from: DELINQUENT
        to: CLOSED_WITH_BALANCE
        trigger: "system: POST /seasons/{season_id}/run-billing-cycle observing arrears_cents > 0 with delinquency_strikes == 2 before the sweep"
        actor: system
        preconditions: ["status == DELINQUENT", "arrears_cents > 0", "delinquency_strikes == 2 before the sweep"]
        side_effects:
          - "CASCADE link 1: delinquency_strikes += 1 (now 3), late_fee_accrued_cents increased per late_fee_assessment, status = CLOSED_WITH_BALANCE"
          - "CASCADE link 2 (caused by link 1): the plan's Member moves CONTRACTED -> WITHDRAWN, which itself triggers links 3 and 4 documented on that Member transition"
          - "version += 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /payment-plans creating a replacement plan for the same member"
        actor: BusinessManager
        preconditions: ["status == ACTIVE", "the new plan passes the expected_member_version OCC check"]
        side_effects: ["version += 1"]
      - from: DELINQUENT
        to: SUPERSEDED
        trigger: "POST /payment-plans creating a replacement plan for the same member"
        actor: BusinessManager
        preconditions: ["status == DELINQUENT", "the new plan passes the expected_member_version OCC check"]
        side_effects: ["late_fee_accrued_cents and late_fee_paid_cents stay on the superseded plan; the replacement starts with late_fee_accrued_cents = 0", "version += 1"]
      - from: ACTIVE
        to: CLOSED_WITH_BALANCE
        trigger: "system: POST /members/{member_id}/withdraw leaving outstanding_cents > 0"
        actor: system
        preconditions: ["status == ACTIVE", "outstanding_cents > 0 after the withdrawal obligation recharge"]
        side_effects: ["version += 1"]
      - from: DELINQUENT
        to: CLOSED_WITH_BALANCE
        trigger: "system: POST /members/{member_id}/withdraw leaving outstanding_cents > 0"
        actor: system
        preconditions: ["status == DELINQUENT", "outstanding_cents > 0 after the withdrawal obligation recharge"]
        side_effects: ["version += 1"]
      - from: ACTIVE
        to: SETTLED
        trigger: "system: POST /members/{member_id}/withdraw leaving outstanding_cents <= 0"
        actor: system
        preconditions: ["status == ACTIVE", "outstanding_cents <= 0 after the withdrawal obligation recharge"]
        side_effects: ["Member.refund_due_cents carries any overpayment", "version += 1"]

  - entity: TuitionPayment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /tuition-payments/{tuition_payment_id}/reverse"
        actor: BusinessManager
        preconditions: ["status == POSTED", "the payment's PaymentPlan.status != SUPERSEDED"]
        side_effects:
          - "reversal_reason stored, reversed_at = logical clock instant"
          - "PaymentPlan.principal_paid_cents -= allocated_to_principal_cents and PaymentPlan.late_fee_paid_cents -= allocated_to_late_fee_cents"
          - "Member.tuition_paid_cents / tuition_balance_cents / refund_due_cents recomputed"
          - "Season.tuition_collected_cents and Season.late_fee_collected_cents recomputed"
          - "PaymentPlan re-evaluated: ACTIVE -> DELINQUENT when arrears reappear, SETTLED is never re-opened"
          - "version += 1"

  - entity: FacilityAgreement
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    note: "Branching + cyclic: SUBMITTED forks to {SIGNED, COUNTERED} with divergent side-effect sets, and COUNTERED loops back to SUBMITTED for at most 2 counter rounds."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /facility-agreements/{facility_agreement_id}/submit"
        actor: TourManager
        preconditions: ["status == DRAFT"]
        side_effects: ["version += 1"]
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /facility-agreements/{facility_agreement_id}/submit"
        actor: TourManager
        preconditions: ["status == COUNTERED"]
        side_effects: ["version += 1"]
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /facility-agreements/{facility_agreement_id}/counter"
        actor: TourManager
        preconditions: ["status == SUBMITTED", "counter_round < 2"]
        side_effects: ["countered_nightly_rate_cents replaced from the request", "counter_round += 1", "version += 1"]
        note: "COUNTERED branch: no rate is pinned and no billing is computed — this is what distinguishes it from the SIGNED branch."
      - from: SUBMITTED
        to: SIGNED
        trigger: "POST /facility-agreements/{facility_agreement_id}/sign"
        actor: CorpsDirector
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "effective_nightly_rate_cents pinned: countered_nightly_rate_cents when counter_round > 0, else nightly_rate_cents"
          - "billable_bed_nights = max(occupied_bed_nights, minimum_billable_beds * agreement_nights) and billable_cents = billable_bed_nights * effective_nightly_rate_cents"
          - "Season.housing_cost_cents recomputed"
          - "version += 1"
        note: "SIGNED branch: pins the rate and starts billing — the divergent side-effect set relative to COUNTERED."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /facility-agreements/{facility_agreement_id}/cancel"
        actor: CorpsDirector
        preconditions: ["status == DRAFT"]
        side_effects: ["cancel_reason stored", "version += 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /facility-agreements/{facility_agreement_id}/cancel"
        actor: CorpsDirector
        preconditions: ["status == SUBMITTED"]
        side_effects: ["cancel_reason stored", "version += 1"]
      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /facility-agreements/{facility_agreement_id}/cancel"
        actor: CorpsDirector
        preconditions: ["status == COUNTERED"]
        side_effects: ["cancel_reason stored", "version += 1"]
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /facility-agreements/{facility_agreement_id}/cancel"
        actor: CorpsDirector
        preconditions: ["status == SIGNED"]
        side_effects:
          - "cancel_reason stored"
          - "every HousingAssignment on this agreement with status == ACTIVE -> RELEASED with released_reason = AGREEMENT_CANCELLED"
          - "every SiteBooking on this agreement with status IN {HELD, CONFIRMED} -> RELEASED with released_reason = AGREEMENT_CANCELLED, decrementing HostSchool.booked_block_count once per released booking"
          - "occupied_bed_nights = 0, billable_bed_nights = max(0, minimum_billable_beds * agreement_nights), billable_cents = 0 (a cancelled agreement bills nothing)"
          - "HostSchool.reserved_bed_nights recomputed and Season.housing_cost_cents recomputed"
          - "version += 1"

  - entity: HousingAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /housing-assignments/{housing_assignment_id}/release"
        actor: MembershipCoordinator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "released_reason = MANUAL"
          - "FacilityAgreement.occupied_bed_nights -= nights, then billable_bed_nights and billable_cents recomputed"
          - "HostSchool.reserved_bed_nights -= nights"
          - "Season.housing_cost_cents recomputed"
          - "version += 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system: Member membership_status -> WITHDRAWN"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["released_reason = MEMBER_WITHDRAWN", "the same occupancy / billing / season recomputes as the manual release"]
      - from: ACTIVE
        to: RELEASED
        trigger: "system: FacilityAgreement SIGNED -> CANCELLED"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["released_reason = AGREEMENT_CANCELLED", "the same occupancy / billing / season recomputes as the manual release"]

  - entity: TourStop
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching: CONFIRMED forks to {COMPLETED, CANCELLED} with completely different side-effect sets (settlement opening vs. resource release cascade)."
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /tour-stops/{tour_stop_id}/confirm"
        actor: TourManager
        preconditions:
          - "status == PLANNED"
          - "previous_stop_id is null OR the previous TourStop.status IN {CONFIRMED, COMPLETED}"
          - "previous_stop_id is null OR previous.depart_at + required_travel_minutes <= arrive_at"
          - "truck_count >= trucks_required"
          - "count of StaffAssignments on this stop with duty == CHAPERONE and status == APPROVED >= required_chaperone_count"
          - "count of StaffAssignments on this stop with duty == COOK and status == APPROVED >= required_cook_count"
          - "when rehearsal_minutes >= 240 OR heat_index_f >= 95: at least one StaffAssignment on this stop with duty == TRAINER and status == APPROVED"
        side_effects:
          - "roster_head_count / minor_head_count snapshotted from Members of the Season with membership_status == ON_TOUR"
          - "required_chaperone_count = ceil(minor_head_count / 10) and required_cook_count = ceil(roster_head_count / 40) snapshotted"
          - "meal_cost_cents computed by stop_meal_cost"
          - "total_load_cuft / total_load_lbs / trucks_required recomputed by transport_plan"
          - "every SiteBooking on this stop with status == HELD -> CONFIRMED"
          - "version += 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /tour-stops/{tour_stop_id}/complete"
        actor: TourManager
        preconditions: ["status == CONFIRMED", "logical clock instant >= depart_at"]
        side_effects:
          - "settlement_state = PENDING when stop_type == SHOW, unchanged (NONE) when stop_type == REHEARSAL_ONLY"
          - "Season.ledger_status re-evaluated on the next run-billing-cycle sweep, never here"
          - "version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /tour-stops/{tour_stop_id}/cancel"
        actor: CorpsDirector
        preconditions: ["status == PLANNED"]
        side_effects:
          - "cancel_reason stored"
          - "CASCADE link 2: every SiteBooking on this stop with status IN {HELD, CONFIRMED} -> RELEASED with released_reason = STOP_CANCELLED"
          - "CASCADE link 3 (caused by link 2): each affected HostSchool.booked_block_count is decremented once per released booking"
          - "every StaffAssignment on this stop with status IN {PROPOSED, ACCEPTED, APPROVED} -> RELEASED with released_reason = STOP_CANCELLED, decrementing Volunteer.assignment_count for each assignment that was APPROVED"
          - "version += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /tour-stops/{tour_stop_id}/cancel"
        actor: CorpsDirector
        preconditions: ["status == CONFIRMED"]
        side_effects: ["identical to the PLANNED -> CANCELLED transition, including cascade links 2 and 3"]

  - entity: SiteBooking
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "system: parent TourStop PLANNED -> CONFIRMED"
        actor: system
        preconditions: ["status == HELD"]
        side_effects: ["version += 1"]
      - from: HELD
        to: RELEASED
        trigger: "POST /site-bookings/{site_booking_id}/release"
        actor: TourManager
        preconditions: ["status == HELD"]
        side_effects: ["released_reason = MANUAL", "HostSchool.booked_block_count -= 1", "version += 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /site-bookings/{site_booking_id}/release"
        actor: TourManager
        preconditions: ["status == CONFIRMED"]
        side_effects: ["released_reason = MANUAL", "HostSchool.booked_block_count -= 1", "version += 1"]
      - from: HELD
        to: RELEASED
        trigger: "system: parent TourStop -> CANCELLED, or FacilityAgreement SIGNED -> CANCELLED"
        actor: system
        preconditions: ["status == HELD"]
        side_effects: ["released_reason = STOP_CANCELLED or AGREEMENT_CANCELLED respectively", "HostSchool.booked_block_count -= 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "system: parent TourStop -> CANCELLED, or FacilityAgreement SIGNED -> CANCELLED"
        actor: system
        preconditions: ["status == CONFIRMED"]
        side_effects: ["released_reason = STOP_CANCELLED or AGREEMENT_CANCELLED respectively", "HostSchool.booked_block_count -= 1"]

  - entity: Volunteer
    dimension: screening_status
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /volunteers/{volunteer_id}/screening-decision with decision == CLEAR"
        actor: VolunteerScreener
        preconditions: ["screening_status == PENDING", "decided_on <= logical clock date"]
        side_effects: ["screening_decided_on stored", "screening_expires_on = screening_decided_on + 365 days", "screened_by_user_id = X-User-ID", "version += 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /volunteers/{volunteer_id}/screening-decision with decision == REJECT"
        actor: VolunteerScreener
        preconditions: ["screening_status == PENDING", "decided_on <= logical clock date"]
        side_effects: ["screening_decided_on stored", "screening_expires_on stays null", "screened_by_user_id = X-User-ID", "version += 1"]
      - from: CLEARED
        to: EXPIRED
        trigger: "system: POST /seasons/{season_id}/run-billing-cycle observing screening_expires_on < logical clock date"
        actor: system
        preconditions: ["screening_status == CLEARED", "screening_expires_on < logical clock date"]
        side_effects:
          - "every StaffAssignment of this volunteer with status IN {PROPOSED, ACCEPTED, APPROVED} whose shift_end_at > logical clock instant -> RELEASED with released_reason = SCREENING_EXPIRED"
          - "Volunteer.assignment_count recomputed"
          - "version += 1"

  - entity: StaffAssignment
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /staff-assignments/{staff_assignment_id}/accept"
        actor: Volunteer
        preconditions: ["status == PROPOSED", "X-User-ID == StaffAssignment.volunteer_id"]
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: APPROVED
        trigger: "POST /staff-assignments/{staff_assignment_id}/approve"
        actor: TourManager
        preconditions:
          - "status == ACCEPTED"
          - "Volunteer.screening_status == CLEARED"
          - "X-User-ID != Volunteer.screened_by_user_id (segregation of duties)"
        side_effects: ["approved_by_user_id = X-User-ID", "Volunteer.assignment_count += 1", "version += 1"]
      - from: PROPOSED
        to: RELEASED
        trigger: "system: parent TourStop -> CANCELLED"
        actor: system
        preconditions: ["status == PROPOSED"]
        side_effects: ["released_reason = STOP_CANCELLED"]
      - from: ACCEPTED
        to: RELEASED
        trigger: "system: parent TourStop -> CANCELLED"
        actor: system
        preconditions: ["status == ACCEPTED"]
        side_effects: ["released_reason = STOP_CANCELLED"]
      - from: APPROVED
        to: RELEASED
        trigger: "system: parent TourStop -> CANCELLED, or Volunteer screening CLEARED -> EXPIRED"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects: ["released_reason = STOP_CANCELLED or SCREENING_EXPIRED respectively", "Volunteer.assignment_count -= 1"]

  - entity: ShowSettlement
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /show-settlements/{show_settlement_id}/finalize"
        actor: BusinessManager
        preconditions:
          - "status == DRAFT"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
          - "the parent TourStop.status == COMPLETED"
        side_effects:
          - "final_placement stored; the circuit_final variant of show_settlement_payout runs over the submitted remittance lines"
          - "final_prize_cents / final_gross_cents / final_circuit_fee_cents / sanctions_charged_cents / rebate_applied_cents / final_net_cents / variance_cents / remittance_line_count written"
          - "finalized_by_user_id = X-User-ID"
          - "CASCADE link 2: the parent TourStop.settlement_state PENDING -> SETTLED"
          - "CASCADE link 3 (caused by link 2): Season.tour_revenue_cents recomputed over FINALIZED settlements of the Season's stops"
          - "version += 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# Only true races (a strictly-later sequential request that would otherwise
# legitimately succeed) appear here, and each is resolved by OCC on the parent
# entity's `version`.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /payment-plans"
    occ_field: "expected_member_version"
    description: |
      Creating a PaymentPlan for a Member whose version has advanced since the
      client last read it is rejected. A second plan creation is legitimate
      under the product semantics — a newly created plan supersedes the prior
      one (PaymentPlan ACTIVE -> SUPERSEDED) — so the state machine alone
      cannot reject a writer working from a stale view of the member. The OCC
      check on Member.version does: the first successful creation advances
      Member.version, so the second request still carrying the old value is
      rejected with 412 instead of silently superseding a plan the writer
      never saw.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  - rule_id: housing-assign-stale-agreement
    parent_entity: FacilityAgreement
    write_endpoint: "POST /housing-assignments"
    occ_field: "expected_facility_agreement_version"
    description: |
      Creating a HousingAssignment against a FacilityAgreement whose version
      has advanced since the client last read it is rejected. Adding another
      occupant to a SIGNED agreement is always legitimate on its own terms —
      the agreement stays SIGNED and only its derived occupancy fields move —
      so no state precondition can reject a writer whose bed-availability view
      is stale. The OCC check on FacilityAgreement.version does: every
      assignment or release advances the agreement version, so a request
      carrying a pre-occupancy version is rejected with 412 rather than
      overfilling a sleeping space the writer believed was empty.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
# All money is integer cents. Every rounding step is ROUND_HALF_UP and every
# rounding ORDER is pinned explicitly, because the alternative order produces a
# different, wrong total for the fixtures listed in SCAFFOLD_DIFFICULTY_DESIGN.
# ---------------------------------------------------------------------------
calculations:
  - name: installment_schedule
    trigger: "POST /payment-plans (creation), and re-read on every GET of the plan"
    algorithm: aggregation
    formula: |
      n = 3 when plan_type == STANDARD_3, 6 when plan_type == EXTENDED_6
      surcharge_pct = 0.000 for STANDARD_3, 0.025 for EXTENDED_6

      # STEP 1 - surcharge on the WHOLE principal, rounded ONCE (pinned order).
      surcharge_cents  = round_half_up(principal_cents * surcharge_pct)
      financed_total_cents = principal_cents + surcharge_cents

      # STEP 2 - split the financed total, never the principal.
      installment_base_cents      = floor(financed_total_cents / n)
      installment_remainder_cents = financed_total_cents - installment_base_cents * n

      # STEP 3 - the remainder is spread one cent each onto the EARLIEST
      # installments, in due-date order (k = 1, 2, 3, ...).
      amount(k) = installment_base_cents + (1 if k <= installment_remainder_cents else 0)
      due_date(k) = first_due_date + 30 * (k - 1) days       # calendar days

      # The sum of amount(k) over k = 1..n equals financed_total_cents exactly.
      # FORBIDDEN alternative order: round_half_up(principal/n * (1+pct)) per
      # line and multiply by n. For principal 399900 / EXTENDED_6 that yields
      # 68316 * 6 = 409896, two cents short of the correct 409898.
    input_set: "the single PaymentPlan being created; principal_cents is copied from the EXECUTED MemberContract.tuition_amount_cents"
    constants:
      STANDARD_3_INSTALLMENTS: 3
      EXTENDED_6_INSTALLMENTS: 6
      EXTENDED_6_SURCHARGE_PCT: 0.025
      DAYS_BETWEEN_INSTALLMENTS: 30
    precision: "integer cents; round_half_up applied exactly once, to the whole-principal surcharge; the per-installment split is pure integer floor + remainder distribution"

  - name: payment_waterfall_allocation
    trigger: "POST /tuition-payments"
    algorithm: waterfall_allocation
    formula: |
      # Bucket 1 - unpaid late fees, oldest money first.
      late_fee_outstanding = plan.late_fee_accrued_cents - plan.late_fee_paid_cents
      allocated_to_late_fee_cents  = min(amount_cents, late_fee_outstanding)

      # Bucket 2 - tuition principal, only what bucket 1 did not absorb.
      principal_outstanding = plan.financed_total_cents - plan.principal_paid_cents
      allocated_to_principal_cents = min(amount_cents - allocated_to_late_fee_cents,
                                        principal_outstanding)

      # There is no third bucket: a payment may never exceed
      # late_fee_outstanding + principal_outstanding (validation
      # ERR_PAYMENT_EXCEEDS_BALANCE, priority 57), so
      # allocated_to_late_fee_cents + allocated_to_principal_cents == amount_cents
      # for every accepted payment.

      # Post-allocation plan re-evaluation:
      #   arrears_cents == 0 and principal_paid_cents == financed_total_cents
      #     and late_fee_paid_cents == late_fee_accrued_cents  -> SETTLED
      #   else arrears_cents == 0 and status == DELINQUENT      -> ACTIVE (cured)
      #   else status unchanged
    input_set: "the target PaymentPlan and its POSTED payments; REVERSED payments contribute nothing to either bucket"
    constants: {}
    precision: "integer cents; no rounding occurs — the waterfall is pure integer subtraction"

  - name: late_fee_assessment
    trigger: "POST /seasons/{season_id}/run-billing-cycle, once per ACTIVE or DELINQUENT PaymentPlan of the season"
    algorithm: threshold
    formula: |
      installments_due_count = count of k in 1..installment_count
                               where due_date(k) <= logical_clock_date
      due_amount_cents       = sum of amount(k) for k = 1..installments_due_count
      arrears_cents          = max(0, due_amount_cents - principal_paid_cents)

      if arrears_cents == 0:
          # no fee, no strike; a DELINQUENT plan returns to ACTIVE
          fee = 0
      else:
          raw_fee = round_half_up(arrears_cents * LATE_FEE_PCT)
          fee     = min(max(raw_fee, LATE_FEE_MIN_CENTS), LATE_FEE_CAP_CENTS)
          plan.late_fee_accrued_cents += fee
          plan.delinquency_strikes    += 1
          plan.status = DELINQUENT
          if plan.delinquency_strikes == 3: plan.status = CLOSED_WITH_BALANCE

      # The floor bites well before the cap: arrears of 68317 gives raw_fee
      # 1025, so the charged fee is the 2500 floor. The cap bites only above
      # 1000000 cents of arrears.
    input_set: "PaymentPlans of the season whose status IN {ACTIVE, DELINQUENT}; SETTLED, SUPERSEDED and CLOSED_WITH_BALANCE plans are skipped entirely and accrue no further fees"
    constants:
      LATE_FEE_PCT: 0.015
      LATE_FEE_MIN_CENTS: 2500
      LATE_FEE_CAP_CENTS: 15000
      STRIKES_TO_CLOSE: 3
    precision: "integer cents; round_half_up on the percentage, then floor/cap clamping in that order"

  - name: member_withdrawal_obligation
    trigger: "POST /members/{member_id}/withdraw"
    algorithm: threshold
    formula: |
      season       = the member's Season
      spring_start = season.spring_training_start_date
      departure    = season.tour_departure_date
      spring_days  = departure - spring_start            # in days, > 0 by validation
      tuition      = member.tuition_charged_cents        # 0 when no contract was EXECUTED

      if tuition == 0:
          # nothing was ever charged: no basis applies
          obligation = 0 ; basis = NONE
      elif withdrawal_date < departure:
          basis = PRORATED_SPRING
          days_completed = clamp(withdrawal_date - spring_start, 0, spring_days)
          obligation = round_half_up(tuition * days_completed / spring_days)
                       + WITHDRAWAL_ADMIN_FEE_CENTS
      else:
          basis = LIQUIDATED_LADDER
          weeks_on_tour = floor((withdrawal_date - departure) / 7)
          pct = LIQUIDATED_LADDER_PCT[min(weeks_on_tour, 4)]
          obligation = round_half_up(tuition * pct) + WITHDRAWAL_ADMIN_FEE_CENTS

      member.tuition_charged_cents = obligation      # replaces the contracted figure
      member.tuition_balance_cents = max(0, obligation - tuition_paid_cents)
      member.refund_due_cents      = max(0, tuition_paid_cents - obligation)
    input_set: "the withdrawing Member, its Season dates and its own tuition_charged_cents; other members are untouched"
    constants:
      WITHDRAWAL_ADMIN_FEE_CENTS: 15000
      LIQUIDATED_LADDER_PCT: [0.75, 0.85, 0.92, 0.97, 1.00]
      LADDER_WEEK_CAP: 4
    precision: "integer cents, round_half_up; the admin fee is added AFTER rounding the tuition component, never before"
    variants:
      - name: prorated_spring
        when: "withdrawal_date is strictly before Season.tour_departure_date"
        difference: "charges only the fraction of spring training actually completed (days_completed / spring_days), so a withdrawal on the day before departure charges 32/33 of tuition"
      - name: liquidated_ladder
        when: "withdrawal_date is on or after Season.tour_departure_date"
        difference: "abandons proration for a step ladder keyed on completed tour weeks starting at 75%, so the SAME contract that owes 402782 cents on 2027-06-11 owes only 314925 cents on 2027-06-12"

  - name: transport_plan
    trigger: "POST /tour-stops (creation) and re-snapshotted on POST /tour-stops/{tour_stop_id}/confirm"
    algorithm: threshold
    formula: |
      total_load_cuft = uniform_trunks * TRUNK_CUFT
                      + instrument_cases * CASE_CUFT
                      + prop_units * PROP_CUFT
      total_load_lbs  = uniform_trunks * TRUNK_LBS
                      + instrument_cases * CASE_LBS
                      + prop_units * PROP_LBS

      # Four independent dimensions, combined in this pinned order:
      volume_trucks = ceil(total_load_cuft / TRUCK_CUFT)
      weight_trucks = ceil(total_load_lbs  / TRUCK_LBS)
      trucks_required = max(volume_trucks, weight_trucks, 1)
      if prop_units > OVERSIZE_PROP_THRESHOLD: trucks_required += 1   # oversize escort trailer
      if travel_miles_from_previous >= LONG_HAUL_MILES: trucks_required += 1  # relief tractor

      # The two additive surcharges are applied to the max(), never folded into
      # the ceilings, so (40, 95, 25, 352) needs 2 + 1 + 1 = 4 trucks while
      # (40, 95, 24, 349) - one prop unit and three miles less - needs only 2.
    input_set: "the single TourStop's declared load and its travel_miles_from_previous; sibling stops are irrelevant"
    constants:
      TRUNK_CUFT: 22
      TRUNK_LBS: 180
      CASE_CUFT: 14
      CASE_LBS: 95
      PROP_CUFT: 46
      PROP_LBS: 260
      TRUCK_CUFT: 1800
      TRUCK_LBS: 26000
      OVERSIZE_PROP_THRESHOLD: 24
      LONG_HAUL_MILES: 350
    precision: "integers throughout; every division is a ceiling, and the minimum fleet is 1 truck even for an empty load"

  - name: stop_meal_cost
    trigger: "POST /tour-stops/{tour_stop_id}/confirm"
    algorithm: aggregation
    formula: |
      # STEP 1 - round the per-member unit cost ONCE PER DIETARY CLASS.
      unit(flag) = round_half_up(BASE_MEAL_CENTS * DIET_MULTIPLIER[flag])
        -> NONE 1175, VEGETARIAN 1269, GLUTEN_FREE 1434, SEVERE_ALLERGEN 1704

      # STEP 2 - multiply the ROUNDED unit by head count and meals per stop.
      meal_cost_cents = sum over dietary classes of
                        unit(flag) * head_count(flag) * MEALS_PER_STOP

      # FORBIDDEN alternative order: sum the unrounded products and round the
      # grand total. For a roster of {NONE:1, GLUTEN_FREE:1, SEVERE_ALLERGEN:1}
      # that yields 12937 instead of the correct 12939; for
      # {NONE:2, GLUTEN_FREE:1, SEVERE_ALLERGEN:1} it yields 16462 instead of
      # 16464.
    input_set: "Members of the stop's Season whose membership_status == ON_TOUR, grouped by dietary_flag; APPLICANT / OFFERED / CONTRACTED / WITHDRAWN members are excluded"
    constants:
      BASE_MEAL_CENTS: 1175
      MEALS_PER_STOP: 3
      DIET_MULTIPLIER_NONE: 1.00
      DIET_MULTIPLIER_VEGETARIAN: 1.08
      DIET_MULTIPLIER_GLUTEN_FREE: 1.22
      DIET_MULTIPLIER_SEVERE_ALLERGEN: 1.45
    precision: "integer cents; round_half_up applied per dietary class BEFORE any multiplication or summation"

  - name: travel_feasibility
    trigger: "POST /tour-stops (creation) and re-checked on POST /tour-stops/{tour_stop_id}/confirm"
    algorithm: threshold
    formula: |
      if previous_stop_id is null:
          required_travel_minutes = 0
      else:
          drive_minutes = ceil(travel_miles_from_previous / AVG_CONVOY_MPH * 60)
          fuel_stops    = floor(travel_miles_from_previous / FUEL_STOP_MILES)
          required_travel_minutes = drive_minutes + fuel_stops * FUEL_STOP_MINUTES

      # Feasibility, enforced at confirm:
      #   previous.depart_at + required_travel_minutes <= this.arrive_at
      # 420 miles -> ceil(560) + 2*30 = 620 minutes (10h20m).
      # 200 miles -> ceil(266.67) = 267 + 1*30 = 297 minutes: the fuel stop
      # appears exactly AT 200 miles, not after it.
    input_set: "this TourStop and the TourStop referenced by previous_stop_id; the chain is walked one link at a time, never transitively"
    constants:
      AVG_CONVOY_MPH: 45
      FUEL_STOP_MILES: 200
      FUEL_STOP_MINUTES: 30
    precision: "integer minutes; the drive component is a ceiling, the fuel-stop component is a floor"

  - name: housing_bed_night_capacity
    trigger: "POST /housing-assignments, and recomputed on POST /housing-assignments/{housing_assignment_id}/release"
    algorithm: interval_merge
    formula: |
      nights = check_out_date - check_in_date          # half-open: check-out night is NOT occupied

      # Aggregate day-granular overlap within one sleeping space.
      overlapping = ACTIVE HousingAssignments with the same
                    facility_agreement_id AND the same space_index AND
                    check_in_date < candidate.check_out_date AND
                    check_out_date > candidate.check_in_date
      # Two stays that merely touch (A checks out on the day B checks in) do
      # NOT overlap - the half-open comparison makes the gap exactly zero.

      minors_present    = candidate.occupant_is_minor OR any(overlapping is minor)
      effective_capacity = capacity_per_space - (1 if minors_present else 0)
        # one bunk in every minor-occupied space is reserved for the
        # chaperone, so a 12-bunk gym holds 12 adults but only 11 minors.
      occupancy_check   = count(overlapping) + 1 <= effective_capacity

      # Derived ledger fields, recomputed on every assign and release:
      agreement.occupied_bed_nights = sum(nights) over ACTIVE assignments
      agreement.billable_bed_nights = max(occupied_bed_nights,
                                          minimum_billable_beds * agreement_nights)
      agreement.billable_cents      = billable_bed_nights * effective_nightly_rate_cents
      host_school.reserved_bed_nights = sum(nights) over ACTIVE assignments of all
                                        its agreements
      season.housing_cost_cents     = sum(billable_cents) over SIGNED agreements
    input_set: "ACTIVE HousingAssignments of the same (facility_agreement_id, space_index); RELEASED assignments free their beds immediately and are excluded from both the overlap count and the bed-night sums"
    constants:
      MINOR_CHAPERONE_BUNK_RESERVATION: 1
    precision: "integer nights and integer cents; day granularity, half-open [check_in_date, check_out_date)"

  - name: site_booking_exclusivity
    trigger: "POST /site-bookings"
    algorithm: interval_merge
    formula: |
      # A host school can host exactly one rehearsal block at a time, plus a
      # load-in/load-out buffer on BOTH sides of every block.
      conflict if there exists a SiteBooking B at the same host_school_id with
        B.status IN {HELD, CONFIRMED} and
        candidate.block_start_at < B.block_end_at   + LOAD_BUFFER_MINUTES and
        candidate.block_end_at   > B.block_start_at - LOAD_BUFFER_MINUTES

      # Equivalently: the required clear gap between two blocks at one school is
      # 2 * LOAD_BUFFER_MINUTES = 180 minutes. A gap of exactly 180 minutes is
      # ACCEPTED (the comparison is strict); 179 minutes is rejected.
      # RELEASED bookings impose no buffer at all.
    input_set: "SiteBookings of the same HostSchool whose status IN {HELD, CONFIRMED}; RELEASED bookings are ignored, which is what makes a release immediately re-bookable"
    constants:
      LOAD_BUFFER_MINUTES: 90
      REQUIRED_CLEAR_GAP_MINUTES: 180
    precision: "whole minutes on ISO8601 UTC instants; comparisons are strict (<, >) so a touching boundary is legal"

  - name: show_settlement_payout
    trigger: "POST /show-settlements (provisional_forward) and POST /show-settlements/{show_settlement_id}/finalize (circuit_final)"
    algorithm: chronological
    formula: |
      PLACEMENT_PRIZE_PCT = {1: 0.30, 2: 0.22, 3: 0.16, 4: 0.12, 5: 0.09}
      pct(p) = PLACEMENT_PRIZE_PCT[p] if p <= 5 else 0.05

      circuit_fee_pct(gross) =            # tiered on the FULL gross, not marginal
          0.040 if gross <  1500000
          0.055 if gross <  3000000
          0.070 otherwise

      # ---- variant provisional_forward (at DRAFT creation) ----
      provisional_prize_cents      = round_half_up(prize_pool_cents * pct(projected_placement))
      provisional_gross_cents      = appearance_fee_cents + provisional_prize_cents
      provisional_circuit_fee_cents = round_half_up(provisional_gross_cents
                                                    * circuit_fee_pct(provisional_gross_cents))
      provisional_net_cents        = provisional_gross_cents - provisional_circuit_fee_cents
      # No remittance lines exist yet, so no sanctions and no rebates.

      # ---- variant circuit_final (at finalize) ----
      final_prize_cents = round_half_up(prize_pool_cents * pct(final_placement))
      final_gross_cents = appearance_fee_cents + final_prize_cents
                          + sum(amount_cents of PRIZE_ADJUSTMENT lines)
      # PINNED EVALUATION ORDER: build the gross FIRST, then read the fee tier
      # off that gross, then compute the fee. Reading the tier off
      # appearance_fee_cents alone, or applying the fee before the adjustments,
      # gives a different number.
      final_circuit_fee_cents = round_half_up(final_gross_cents
                                              * circuit_fee_pct(final_gross_cents))

      # ---- chronological replay of the remaining remittance lines ----
      running_net  = final_gross_cents - final_circuit_fee_cents
      rebate_room  = final_circuit_fee_cents      # a rebate can never exceed the fee charged
      sanctions_charged_cents = 0 ; rebate_applied_cents = 0
      for line in lines sorted by (recorded_at ascending, submitted array index ascending)
          excluding PRIZE_ADJUSTMENT lines:
          if line.kind == SANCTION_FEE:
              cap     = round_half_up(running_net * SANCTION_LINE_PCT)
              charged = min(line.amount_cents, cap)      # per-line cap on the CURRENT net
              running_net -= charged
              sanctions_charged_cents += charged
          elif line.kind == FEE_REBATE:
              applied = min(line.amount_cents, rebate_room)
              rebate_room -= applied
              running_net += applied
              rebate_applied_cents += applied
      final_net_cents = running_net
      variance_cents  = final_net_cents - provisional_net_cents

      # ORDER SENSITIVITY (the point of the chronological algorithm): because
      # each sanction cap is 15% of the net AT THAT MOMENT, replaying
      # [250000, 200000] gives final_net 1038778 while [200000, 250000] gives
      # 1042096 on identical data.
    input_set: "the single ShowSettlement, its parent TourStop (which must be COMPLETED) and the remittance lines submitted with the finalize call; lines are never carried over between settlements"
    constants:
      PLACEMENT_PRIZE_PCT_1: 0.30
      PLACEMENT_PRIZE_PCT_2: 0.22
      PLACEMENT_PRIZE_PCT_3: 0.16
      PLACEMENT_PRIZE_PCT_4: 0.12
      PLACEMENT_PRIZE_PCT_5: 0.09
      PLACEMENT_PRIZE_PCT_TAIL: 0.05
      CIRCUIT_FEE_TIER_1_MAX_CENTS: 1500000
      CIRCUIT_FEE_TIER_2_MAX_CENTS: 3000000
      CIRCUIT_FEE_PCT_TIER_1: 0.040
      CIRCUIT_FEE_PCT_TIER_2: 0.055
      CIRCUIT_FEE_PCT_TIER_3: 0.070
      SANCTION_LINE_PCT: 0.15
    precision: "integer cents, round_half_up at each of the four rounding points (prize, circuit fee, and every sanction cap); replay order is (recorded_at, submitted array index) and never depends on any id"
    variants:
      - name: provisional_forward
        when: "POST /show-settlements creates the DRAFT, using projected_placement and no remittance lines"
        difference: "prizes are projected from the corps' own registered placement and no sanctions or rebates exist, so the net is the optimistic figure the tour budget carries"
      - name: circuit_final
        when: "POST /show-settlements/{show_settlement_id}/finalize supplies final_placement and the circuit's remittance lines"
        difference: "prizes are re-struck on the certified placement, PRIZE_ADJUSTMENT lines move the gross (and can therefore move the fee tier), and the sanction/rebate replay runs; for the canonical fixture the provisional net 1274880 becomes a final net of 1038778, a variance of -236102 cents"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (evaluated in ascending priority; the FIRST violated
# rule decides the response, and no side effect of the request is applied)
#
# Domain ordering of the business band, pinned once and for all:
#   referential integrity -> member safety / compliance -> temporal feasibility
#   -> capacity & uniqueness constraints -> money.
# Safety outranks money because a corps that overfills a minor's sleeping space
# or rehearses at a 107-degree heat index has a child-welfare problem, not a
# budgeting problem.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: schema
    check: "every required body field is present, of the declared JSON type, and every enum-typed field carries a declared enum member; unknown fields are ignored; integer cent fields must be integers, never decimal strings"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: schema
    check: "ordered date/instant pairs are strictly increasing: Season.spring_training_end_date > spring_training_start_date and tour_departure_date > spring_training_start_date; FacilityAgreement.end_date > start_date; TourStop.depart_at > arrive_at; SiteBooking.block_end_at > block_start_at; StaffAssignment.shift_end_at > shift_start_at; HousingAssignment.check_out_date > check_in_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /seasons, POST /facility-agreements, POST /tour-stops, POST /site-bookings, POST /staff-assignments, POST /housing-assignments"

  - priority: 5
    category: schema
    check: "conditionally required fields obey their condition: cdl_number is required iff role_type == DRIVER; credential_id is required iff role_type == ATHLETIC_TRAINER; TourStop.show_start_at is required iff stop_type == SHOW; travel_miles_from_previous must be 0 when previous_stop_id is null and > 0 otherwise; FacilityAgreement.countered_nightly_rate_cents is required on counter"
    error_id: ERR_CONDITIONAL_FIELD_MISMATCH
    http_status: 400
    applies_to: "POST /volunteers, POST /tour-stops, POST /facility-agreements/{facility_agreement_id}/counter"

  - priority: 6
    category: schema
    check: "monetary and count inputs are strictly positive where the domain requires it: TuitionPayment.amount_cents > 0, MemberContract.tuition_amount_cents > 0, FacilityAgreement.nightly_rate_cents > 0, ShowSettlement.appearance_fee_cents >= 0 and prize_pool_cents >= 0, projected_placement >= 1, final_placement >= 1, HostSchool.sleeping_space_count >= 1, capacity_per_space >= 1"
    error_id: ERR_AMOUNT_NOT_POSITIVE
    http_status: 400
    applies_to: "POST /tuition-payments, POST /member-contracts, POST /facility-agreements, POST /show-settlements, POST /show-settlements/{show_settlement_id}/finalize, POST /host-schools"

  - priority: 7
    category: existence
    check: "every id in the request PATH resolves, validated left to right; the matching per-entity not-found error is returned (ERR_SEASON_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_PAYMENT_PLAN_NOT_FOUND, ERR_TUITION_PAYMENT_NOT_FOUND, ERR_HOST_SCHOOL_NOT_FOUND, ERR_FACILITY_AGREEMENT_NOT_FOUND, ERR_HOUSING_ASSIGNMENT_NOT_FOUND, ERR_TOUR_STOP_NOT_FOUND, ERR_SITE_BOOKING_NOT_FOUND, ERR_VOLUNTEER_NOT_FOUND, ERR_STAFF_ASSIGNMENT_NOT_FOUND, ERR_SHOW_SETTLEMENT_NOT_FOUND)"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 8
    category: existence
    check: "every foreign key in the request BODY resolves, validated in the order the fields are declared in §1.1; the same per-entity not-found error family is used"
    error_id: ERR_FACILITY_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /members, POST /member-contracts, POST /payment-plans, POST /tuition-payments, POST /facility-agreements, POST /housing-assignments, POST /tour-stops, POST /site-bookings, POST /staff-assignments, POST /show-settlements"

  - priority: 9
    category: auth
    check: "for entity_backed roles, X-User-ID equals the id of the entity that owns the target resource: a Member may only sign / request revision on a MemberContract whose member_id == X-User-ID, and a Volunteer may only accept a StaffAssignment whose volunteer_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /member-contracts/{member_contract_id}/sign, POST /member-contracts/{member_contract_id}/request-revision, POST /staff-assignments/{staff_assignment_id}/accept"

  - priority: 10
    category: state
    check: "expected_member_version equals the current Member.version (concurrency_rules[plan-create-stale-member])"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /payment-plans"

  - priority: 11
    category: state
    check: "expected_facility_agreement_version equals the current FacilityAgreement.version (concurrency_rules[housing-assign-stale-agreement])"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /housing-assignments"

  - priority: 12
    category: state
    check: "the Member's membership_status permits the operation: audition-decision requires APPLICANT; withdraw requires membership_status IN {OFFERED, CONTRACTED, ON_TOUR}; a housing assignment requires membership_status IN {CONTRACTED, ON_TOUR}"
    error_id: ERR_INVALID_MEMBER_STATE
    http_status: 409
    applies_to: "POST /members/{member_id}/audition-decision, POST /members/{member_id}/withdraw, POST /housing-assignments"

  - priority: 13
    category: state
    check: "the MemberContract status permits the operation: sign requires ISSUED; request-revision requires ISSUED; reissue requires REVISION_REQUESTED; execute requires SIGNED_BY_MEMBER"
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /member-contracts/{member_contract_id}/sign, /request-revision, /reissue, /execute"

  - priority: 14
    category: state
    check: "POST /payment-plans requires the referenced MemberContract.status == EXECUTED"
    error_id: ERR_CONTRACT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /payment-plans"

  - priority: 15
    category: state
    check: "POST /tuition-payments requires the PaymentPlan.status IN {ACTIVE, DELINQUENT}; SETTLED, SUPERSEDED and CLOSED_WITH_BALANCE plans accept no further money"
    error_id: ERR_PLAN_NOT_ACCEPTING_PAYMENTS
    http_status: 409
    applies_to: "POST /tuition-payments"
    note: "Outranks the fiscal over-payment check at priority 57 — a payment that is BOTH oversized AND aimed at a closed plan reports the closed plan."

  - priority: 16
    category: state
    check: "POST /tuition-payments/{tuition_payment_id}/reverse requires the payment status == POSTED and its plan status != SUPERSEDED"
    error_id: ERR_INVALID_PAYMENT_STATE
    http_status: 409
    applies_to: "POST /tuition-payments/{tuition_payment_id}/reverse"

  - priority: 17
    category: state
    check: "the FacilityAgreement status permits the operation: submit requires DRAFT or COUNTERED; counter requires SUBMITTED; sign requires SUBMITTED; cancel requires status != CANCELLED"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to: "POST /facility-agreements/{facility_agreement_id}/submit, /counter, /sign, /cancel"

  - priority: 18
    category: state
    check: "creating a HousingAssignment or a SiteBooking requires the referenced FacilityAgreement.status == SIGNED, and its usage_type must cover the requested use: a HousingAssignment requires usage_type == SPRING_TRAINING, a SiteBooking requires usage_type == TOUR_REHEARSAL"
    error_id: ERR_AGREEMENT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /housing-assignments, POST /site-bookings"

  - priority: 19
    category: state
    check: "POST /housing-assignments/{housing_assignment_id}/release requires status == ACTIVE"
    error_id: ERR_INVALID_HOUSING_STATE
    http_status: 409
    applies_to: "POST /housing-assignments/{housing_assignment_id}/release"

  - priority: 20
    category: state
    check: "the TourStop status permits the operation: confirm requires PLANNED; complete requires CONFIRMED; cancel requires status IN {PLANNED, CONFIRMED}; creating a SiteBooking or a StaffAssignment requires the parent stop status IN {PLANNED, CONFIRMED}"
    error_id: ERR_INVALID_STOP_STATE
    http_status: 409
    applies_to: "POST /tour-stops/{tour_stop_id}/confirm, /complete, /cancel, POST /site-bookings, POST /staff-assignments"

  - priority: 21
    category: state
    check: "POST /site-bookings/{site_booking_id}/release requires status IN {HELD, CONFIRMED}"
    error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    applies_to: "POST /site-bookings/{site_booking_id}/release"

  - priority: 22
    category: state
    check: "POST /volunteers/{volunteer_id}/screening-decision requires screening_status == PENDING; a second decision on an already-decided volunteer is rejected"
    error_id: ERR_INVALID_SCREENING_STATE
    http_status: 409
    applies_to: "POST /volunteers/{volunteer_id}/screening-decision"

  - priority: 23
    category: state
    check: "the StaffAssignment status permits the operation: accept requires PROPOSED; approve requires ACCEPTED"
    error_id: ERR_INVALID_STAFF_ASSIGNMENT_STATE
    http_status: 409
    applies_to: "POST /staff-assignments/{staff_assignment_id}/accept, /approve"

  - priority: 24
    category: state
    check: "POST /show-settlements/{show_settlement_id}/finalize requires status == DRAFT"
    error_id: ERR_INVALID_SETTLEMENT_STATE
    http_status: 409
    applies_to: "POST /show-settlements/{show_settlement_id}/finalize"

  - priority: 25
    category: state
    check: "creating or finalizing a ShowSettlement requires the parent TourStop.status == COMPLETED and stop_type == SHOW"
    error_id: ERR_STOP_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /show-settlements, POST /show-settlements/{show_settlement_id}/finalize"

  - priority: 26
    category: business_referential
    check: "cross-aggregate season coherence: HousingAssignment.member_id's Member.season_id == the FacilityAgreement.season_id; SiteBooking's TourStop.season_id == the FacilityAgreement.season_id; StaffAssignment and ShowSettlement inherit their season from their TourStop and need no separate check"
    error_id: ERR_SEASON_MISMATCH
    http_status: 409
    applies_to: "POST /housing-assignments, POST /site-bookings"

  - priority: 27
    category: business_referential
    check: "POST /payment-plans requires member_id == the referenced MemberContract.member_id"
    error_id: ERR_CONTRACT_MEMBER_MISMATCH
    http_status: 409
    applies_to: "POST /payment-plans"

  - priority: 28
    category: business_referential
    check: "POST /site-bookings requires host_school_id == the referenced FacilityAgreement.host_school_id"
    error_id: ERR_AGREEMENT_SCHOOL_MISMATCH
    http_status: 409
    applies_to: "POST /site-bookings"

  - priority: 29
    category: business_referential
    check: "POST /staff-assignments requires duty to match the Volunteer.role_type exactly: DRIVE<->DRIVER, COOK<->COOK, CHAPERONE<->CHAPERONE, TRAINER<->ATHLETIC_TRAINER"
    error_id: ERR_DUTY_ROLE_MISMATCH
    http_status: 409
    applies_to: "POST /staff-assignments"

  - priority: 30
    category: business_safety
    check: "POST /member-contracts/{member_contract_id}/execute requires the Member.medical_status == CLEARED; a RESTRICTED or SIDELINED member may hold a signed contract but may not be executed onto the roster"
    error_id: ERR_MEDICAL_NOT_CLEARED
    http_status: 409
    applies_to: "POST /member-contracts/{member_contract_id}/execute"

  - priority: 31
    category: business_safety
    check: "minor supervision: a sleeping space may not mix minors and adults on overlapping nights — if any overlapping ACTIVE HousingAssignment in the same (facility_agreement_id, space_index) has occupant_is_minor different from the candidate's, the assignment is refused"
    error_id: ERR_MINOR_ROOM_MIX
    http_status: 409
    applies_to: "POST /housing-assignments"
    note: "Outranks the capacity check at priority 53 — an assignment that is BOTH a minor/adult mix AND over capacity reports the mix."

  - priority: 32
    category: business_safety
    check: "POST /tour-stops/{tour_stop_id}/confirm requires APPROVED CHAPERONE StaffAssignments >= ceil(minor_head_count / 10)"
    error_id: ERR_CHAPERONE_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /tour-stops/{tour_stop_id}/confirm"

  - priority: 33
    category: business_safety
    check: "POST /tour-stops/{tour_stop_id}/confirm requires APPROVED COOK StaffAssignments >= ceil(roster_head_count / 40)"
    error_id: ERR_COOK_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /tour-stops/{tour_stop_id}/confirm"

  - priority: 34
    category: business_safety
    check: "POST /tour-stops/{tour_stop_id}/confirm requires at least one APPROVED TRAINER StaffAssignment when heat_index_f >= 95 OR rehearsal_minutes >= 240"
    error_id: ERR_TRAINER_COVERAGE_REQUIRED
    http_status: 409
    applies_to: "POST /tour-stops/{tour_stop_id}/confirm"

  - priority: 35
    category: business_safety
    check: "extreme-heat protocol: when the parent TourStop.heat_index_f >= 105, a SiteBooking may only be created with indoor == true AND the HostSchool.has_air_conditioning == true; an outdoor block, or an indoor block at a school without air conditioning, is prohibited"
    error_id: ERR_EXTREME_HEAT_OUTDOOR_PROHIBITED
    http_status: 409
    applies_to: "POST /site-bookings"

  - priority: 36
    category: business_safety
    check: "POST /staff-assignments/{staff_assignment_id}/approve requires the Volunteer.screening_status == CLEARED (PENDING, REJECTED and EXPIRED are all refused)"
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 409
    applies_to: "POST /staff-assignments/{staff_assignment_id}/approve"

  - priority: 37
    category: business_safety
    check: "segregation of duties: the X-User-ID approving a StaffAssignment must differ from the Volunteer.screened_by_user_id, and the X-User-ID finalizing a ShowSettlement must differ from its prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /staff-assignments/{staff_assignment_id}/approve, POST /show-settlements/{show_settlement_id}/finalize"

  - priority: 38
    category: business_temporal
    check: "POST /tour-stops/{tour_stop_id}/confirm requires previous_stop_id is null OR previous.depart_at + required_travel_minutes <= this.arrive_at"
    error_id: ERR_TRAVEL_TIME_INFEASIBLE
    http_status: 409
    applies_to: "POST /tour-stops/{tour_stop_id}/confirm"

  - priority: 39
    category: business_temporal
    check: "site_booking_exclusivity: the candidate block must clear every HELD or CONFIRMED block at the same HostSchool by at least 180 minutes; a gap of exactly 180 minutes passes"
    error_id: ERR_SITE_BLOCK_CONFLICT
    http_status: 409
    applies_to: "POST /site-bookings"

  - priority: 40
    category: business_temporal
    check: "a SiteBooking's [block_start_at, block_end_at) must fall inside the FacilityAgreement window [start_date T00:00:00Z, end_date T00:00:00Z)"
    error_id: ERR_BLOCK_OUTSIDE_AGREEMENT_WINDOW
    http_status: 409
    applies_to: "POST /site-bookings"

  - priority: 41
    category: business_temporal
    check: "a HousingAssignment's [check_in_date, check_out_date) must fall inside the FacilityAgreement window [start_date, end_date)"
    error_id: ERR_STAY_OUTSIDE_AGREEMENT_WINDOW
    http_status: 409
    applies_to: "POST /housing-assignments"

  - priority: 42
    category: business_temporal
    check: "a StaffAssignment shift must fall inside its TourStop window: shift_start_at >= arrive_at AND shift_end_at <= depart_at"
    error_id: ERR_SHIFT_OUTSIDE_STOP_WINDOW
    http_status: 409
    applies_to: "POST /staff-assignments"

  - priority: 43
    category: business_temporal
    check: "one volunteer cannot hold two overlapping shifts: for the same volunteer_id, no StaffAssignment with status IN {PROPOSED, ACCEPTED, APPROVED} may satisfy existing.shift_start_at < candidate.shift_end_at AND existing.shift_end_at > candidate.shift_start_at (touching shifts are legal)"
    error_id: ERR_VOLUNTEER_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /staff-assignments"

  - priority: 44
    category: business_temporal
    check: "no business date may be in the future relative to the logical clock: TuitionPayment.received_on <= clock date, Volunteer screening decided_on <= clock date, Member.withdrawal_date <= clock date"
    error_id: ERR_FUTURE_DATED_INPUT
    http_status: 409
    applies_to: "POST /tuition-payments, POST /volunteers/{volunteer_id}/screening-decision, POST /members/{member_id}/withdraw"

  - priority: 45
    category: business_temporal
    check: "Member.withdrawal_date must be >= Season.spring_training_start_date; a withdrawal cannot be back-dated before the season's spring training began"
    error_id: ERR_WITHDRAWAL_DATE_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /members/{member_id}/withdraw"

  - priority: 46
    category: business_temporal
    check: "POST /tour-stops/{tour_stop_id}/complete requires the logical clock instant >= depart_at"
    error_id: ERR_STOP_NOT_DEPARTED
    http_status: 409
    applies_to: "POST /tour-stops/{tour_stop_id}/complete"

  - priority: 47
    category: business_constraint
    check: "email uniqueness: Member.email is unique within its Season, Volunteer.email is unique across all volunteers"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /members, POST /volunteers"

  - priority: 48
    category: business_constraint
    check: "a Member may hold at most one MemberContract whose status != VOIDED"
    error_id: ERR_CONTRACT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /member-contracts"

  - priority: 49
    category: business_constraint
    check: "a TourStop may hold at most one ShowSettlement"
    error_id: ERR_SETTLEMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /show-settlements"

  - priority: 50
    category: business_constraint
    check: "POST /member-contracts/{member_contract_id}/reissue requires revision_round < 3; the 4th reissue is refused and the contract stays REVISION_REQUESTED"
    error_id: ERR_MAX_REVISION_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /member-contracts/{member_contract_id}/reissue"

  - priority: 51
    category: business_constraint
    check: "POST /facility-agreements/{facility_agreement_id}/counter requires counter_round < 2; the 3rd counter is refused and the agreement stays SUBMITTED"
    error_id: ERR_MAX_COUNTER_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /facility-agreements/{facility_agreement_id}/counter"

  - priority: 52
    category: business_constraint
    check: "HousingAssignment.space_index must satisfy 1 <= space_index <= the HostSchool.sleeping_space_count of the agreement's school"
    error_id: ERR_SPACE_INDEX_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /housing-assignments"

  - priority: 53
    category: business_constraint
    check: "housing_bed_night_capacity: overlapping ACTIVE assignments in the same (facility_agreement_id, space_index) plus the candidate must not exceed capacity_per_space, reduced by 1 whenever a minor occupies the space on an overlapping night"
    error_id: ERR_SPACE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /housing-assignments"

  - priority: 54
    category: business_constraint
    check: "a Member may not hold two ACTIVE HousingAssignments whose date ranges overlap, in any space or agreement"
    error_id: ERR_MEMBER_ALREADY_HOUSED
    http_status: 409
    applies_to: "POST /housing-assignments"

  - priority: 55
    category: business_constraint
    check: "POST /tour-stops/{tour_stop_id}/confirm requires truck_count >= trucks_required as computed by transport_plan"
    error_id: ERR_INSUFFICIENT_TRUCKS
    http_status: 409
    applies_to: "POST /tour-stops/{tour_stop_id}/confirm"

  - priority: 56
    category: business_fiscal
    check: "FacilityAgreement.nightly_rate_cents and countered_nightly_rate_cents must each be <= HOUSING_NIGHTLY_RATE_CAP_CENTS (1500); the corps' board caps per-bed-night spend"
    error_id: ERR_RATE_ABOVE_CAP
    http_status: 409
    applies_to: "POST /facility-agreements, POST /facility-agreements/{facility_agreement_id}/counter"

  - priority: 57
    category: business_fiscal
    check: "TuitionPayment.amount_cents must not exceed (plan.late_fee_accrued_cents - plan.late_fee_paid_cents) + (plan.financed_total_cents - plan.principal_paid_cents); the ledger never holds unallocated money"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 409
    applies_to: "POST /tuition-payments"

# ---------------------------------------------------------------------------
# 1.5 API Endpoints — flat, root-level collections. Every entity exposes
# GET /<collection>/{id} plus a filtered GET /<collection> carrying every FK as
# an optional filter, which is what makes each FK in §1.1 reverse-reachable.
# ---------------------------------------------------------------------------
endpoints:
  # ---- Season -------------------------------------------------------------
  - method: POST
    path: "/seasons"
    description: "Open a competitive season and pin its spring-training and departure dates."
    roles: [CorpsDirector]
    code: 201
    input: [name, year, tuition_base_cents, spring_training_start_date, spring_training_end_date, tour_departure_date]
    output: Season
    side_effects: ["billing_epoch = 0", "all ledger totals initialised to 0", "ledger_status = OPEN", "version = 1"]

  - method: GET
    path: "/seasons/{season_id}"
    description: "Read a season with its live ledger rollups."
    roles: [CorpsDirector, MembershipCoordinator, TourManager, BusinessManager]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: POST
    path: "/seasons/{season_id}/run-billing-cycle"
    description: "Run one billing sweep over the season: assesses late fees on every ACTIVE or DELINQUENT PaymentPlan, closes plans at the 3rd strike (cascading to member withdrawal and housing release), expires stale volunteer screenings, promotes CONTRACTED members to ON_TOUR once the clock reaches tour_departure_date, and re-evaluates ledger_status."
    roles: [BusinessManager]
    code: 200
    input: []
    output: Season
    side_effects:
      - "billing_epoch += 1"
      - "late_fee_assessment runs per plan; late_fee_accrued_cents and delinquency_strikes updated"
      - "PaymentPlan ACTIVE <-> DELINQUENT transitions; CLOSED_WITH_BALANCE at the 3rd strike"
      - "cascade: closed plan -> Member WITHDRAWN -> HousingAssignment RELEASED -> FacilityAgreement / HostSchool / Season recomputes"
      - "Member CONTRACTED -> ON_TOUR when the clock date >= Season.tour_departure_date and medical_status == CLEARED"
      - "Volunteer CLEARED -> EXPIRED when screening_expires_on < clock date, releasing that volunteer's open StaffAssignments"
      - "Season ledger totals and ledger_status recomputed"
      - "version += 1"

  # ---- Member -------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Register an auditionee for a season."
    roles: [MembershipCoordinator]
    code: 201
    input: [season_id, full_name, email, date_of_birth, section, dietary_flag]
    output: Member
    side_effects: ["membership_status = APPLICANT", "medical_status = CLEARED", "is_minor computed against Season.tour_departure_date", "all money fields 0", "version = 1"]

  - method: GET
    path: "/members/{member_id}"
    description: "Read one member, including tuition ledger and withdrawal outcome."
    roles: [CorpsDirector, MembershipCoordinator, TourManager, BusinessManager, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members, filterable by season and by either state dimension."
    roles: [CorpsDirector, MembershipCoordinator, TourManager, BusinessManager]
    code: 200
    input: ["season_id?", "membership_status?", "medical_status?", "is_minor?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{member_id}/audition-decision"
    description: "Record the audition outcome for an APPLICANT."
    roles: [MembershipCoordinator]
    code: 200
    input: [decision, audition_score]
    output: Member
    side_effects: ["membership_status -> OFFERED when decision == OFFER, DECLINED when decision == DECLINE", "audition_score stored", "version += 1"]

  - method: POST
    path: "/members/{member_id}/medical-status"
    description: "Move the member's independent medical dimension; may be called repeatedly in either direction."
    roles: [MembershipCoordinator]
    code: 200
    input: [to_medical_status, "note?"]
    output: Member
    side_effects: ["medical_status set to to_medical_status", "membership_status untouched", "version += 1"]

  - method: POST
    path: "/members/{member_id}/withdraw"
    description: "Withdraw a member and strike the withdrawal obligation with the variant selected by withdrawal_date."
    roles: [MembershipCoordinator]
    code: 200
    input: [withdrawal_date, "reason?"]
    output: Member
    side_effects:
      - "membership_status -> WITHDRAWN"
      - "member_withdrawal_obligation runs; withdrawal_obligation_cents, withdrawal_obligation_basis, tuition_charged_cents, tuition_balance_cents, refund_due_cents written"
      - "the member's non-VOIDED MemberContract -> VOIDED when it was never EXECUTED"
      - "the member's ACTIVE PaymentPlan -> SETTLED when nothing is outstanding, otherwise CLOSED_WITH_BALANCE"
      - "every ACTIVE HousingAssignment of the member -> RELEASED (released_reason = MEMBER_WITHDRAWN), recomputing agreement occupancy, HostSchool.reserved_bed_nights and Season.housing_cost_cents"
      - "Season.tuition_charged_cents recomputed"
      - "version += 1"

  # ---- MemberContract -----------------------------------------------------
  - method: POST
    path: "/member-contracts"
    description: "Issue a contract to an OFFERED member."
    roles: [MembershipCoordinator]
    code: 201
    input: [member_id, tuition_amount_cents, payment_plan_type]
    output: MemberContract
    side_effects: ["status = ISSUED", "revision_round = 0", "version = 1"]

  - method: GET
    path: "/member-contracts/{member_contract_id}"
    description: "Read one contract."
    roles: [CorpsDirector, MembershipCoordinator, BusinessManager, Member]
    code: 200
    input: []
    output: MemberContract
    side_effects: []

  - method: GET
    path: "/member-contracts"
    description: "List contracts, filterable by member and status."
    roles: [CorpsDirector, MembershipCoordinator, BusinessManager]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: MemberContract[]
    side_effects: []

  - method: POST
    path: "/member-contracts/{member_contract_id}/request-revision"
    description: "The contracted member asks for a revision, sending an ISSUED contract back into the negotiation loop."
    roles: [Member]
    code: 200
    input: [revision_note]
    output: MemberContract
    side_effects: ["status ISSUED -> REVISION_REQUESTED", "revision_note stored", "version += 1"]

  - method: POST
    path: "/member-contracts/{member_contract_id}/reissue"
    description: "Reissue a revised contract, closing one negotiation round."
    roles: [MembershipCoordinator]
    code: 200
    input: ["tuition_amount_cents?", "payment_plan_type?"]
    output: MemberContract
    side_effects: ["status REVISION_REQUESTED -> ISSUED", "revision_round += 1", "supplied terms replace the prior ones; omitted terms are retained", "version += 1"]

  - method: POST
    path: "/member-contracts/{member_contract_id}/sign"
    description: "The member signs their own ISSUED contract."
    roles: [Member]
    code: 200
    input: [signature_name]
    output: MemberContract
    side_effects: ["status ISSUED -> SIGNED_BY_MEMBER", "signature_name and signed_at stored", "version += 1"]

  - method: POST
    path: "/member-contracts/{member_contract_id}/execute"
    description: "The corps countersigns, putting the member on the roster and charging tuition."
    roles: [CorpsDirector]
    code: 200
    input: []
    output: MemberContract
    side_effects:
      - "status SIGNED_BY_MEMBER -> EXECUTED"
      - "executed_at stored"
      - "Member.membership_status OFFERED -> CONTRACTED"
      - "Member.tuition_charged_cents = tuition_amount_cents; tuition_balance_cents recomputed"
      - "Season.tuition_charged_cents recomputed"
      - "version += 1"

  # ---- PaymentPlan --------------------------------------------------------
  - method: POST
    path: "/payment-plans"
    description: "Create the installment plan financing an EXECUTED contract. Creating a second plan for the same member legitimately supersedes the first, so the write is guarded by OCC on the member's version (concurrency_rules[plan-create-stale-member])."
    roles: [BusinessManager]
    code: 201
    input: [member_id, member_contract_id, first_due_date, expected_member_version]
    output: PaymentPlan
    side_effects:
      - "installment_schedule runs: plan_type, installment_count, principal_cents, surcharge_cents, financed_total_cents, installment_base_cents, installment_remainder_cents written"
      - "status = ACTIVE, delinquency_strikes = 0"
      - "any prior PaymentPlan of this member with status IN {ACTIVE, DELINQUENT} -> SUPERSEDED"
      - "increments Member.version by 1"
      - "version = 1"

  - method: GET
    path: "/payment-plans/{payment_plan_id}"
    description: "Read a plan with its live arrears figures re-derived against the logical clock."
    roles: [CorpsDirector, BusinessManager, Member]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: GET
    path: "/payment-plans"
    description: "List plans, filterable by member, contract and status."
    roles: [CorpsDirector, BusinessManager]
    code: 200
    input: ["member_id?", "member_contract_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  # ---- TuitionPayment -----------------------------------------------------
  - method: POST
    path: "/tuition-payments"
    description: "Post a payment against a plan, allocating late fees before principal."
    roles: [BusinessManager]
    code: 201
    input: [payment_plan_id, amount_cents, received_on, method]
    output: TuitionPayment
    side_effects:
      - "payment_waterfall_allocation runs: allocated_to_late_fee_cents then allocated_to_principal_cents"
      - "status = POSTED"
      - "PaymentPlan.principal_paid_cents / late_fee_paid_cents / arrears_cents / outstanding_cents recomputed; DELINQUENT -> ACTIVE when arrears clear; -> SETTLED when nothing is outstanding"
      - "Member.tuition_paid_cents / tuition_balance_cents / refund_due_cents recomputed"
      - "Season.tuition_collected_cents and late_fee_collected_cents recomputed"
      - "version = 1"

  - method: GET
    path: "/tuition-payments/{tuition_payment_id}"
    description: "Read one payment with its allocation split."
    roles: [CorpsDirector, BusinessManager, Member]
    code: 200
    input: []
    output: TuitionPayment
    side_effects: []

  - method: GET
    path: "/tuition-payments"
    description: "List payments, filterable by plan and status."
    roles: [CorpsDirector, BusinessManager]
    code: 200
    input: ["payment_plan_id?", "status?", "limit?", "offset?"]
    output: TuitionPayment[]
    side_effects: []

  - method: POST
    path: "/tuition-payments/{tuition_payment_id}/reverse"
    description: "Reverse a posted payment (returned check, disputed card) and unwind every ledger effect it had."
    roles: [BusinessManager]
    code: 200
    input: [reversal_reason]
    output: TuitionPayment
    side_effects:
      - "status POSTED -> REVERSED; reversal_reason and reversed_at stored"
      - "PaymentPlan.principal_paid_cents -= allocated_to_principal_cents; late_fee_paid_cents -= allocated_to_late_fee_cents"
      - "PaymentPlan re-evaluated: ACTIVE -> DELINQUENT when arrears reappear"
      - "Member and Season ledger totals recomputed to their pre-payment values"
      - "version += 1"

  # ---- HostSchool ---------------------------------------------------------
  - method: POST
    path: "/host-schools"
    description: "Register a host school with its sleeping spaces, per-space bunk capacity, rehearsal fields and air-conditioning posture."
    roles: [TourManager]
    code: 201
    input: [name, city, state_code, sleeping_space_count, capacity_per_space, rehearsal_field_count, has_air_conditioning]
    output: HostSchool
    side_effects: ["booked_block_count = 0", "reserved_bed_nights = 0", "version = 1"]

  - method: GET
    path: "/host-schools/{host_school_id}"
    description: "Read a host school with its live booking and bed-night counters."
    roles: [CorpsDirector, TourManager, MembershipCoordinator, BusinessManager]
    code: 200
    input: []
    output: HostSchool
    side_effects: []

  - method: GET
    path: "/host-schools"
    description: "List host schools."
    roles: [CorpsDirector, TourManager, MembershipCoordinator, BusinessManager]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: HostSchool[]
    side_effects: []

  # ---- FacilityAgreement --------------------------------------------------
  - method: POST
    path: "/facility-agreements"
    description: "Draft a facility agreement with a host school for a season window."
    roles: [TourManager]
    code: 201
    input: [host_school_id, season_id, usage_type, start_date, end_date, nightly_rate_cents, minimum_billable_beds]
    output: FacilityAgreement
    side_effects: ["status = DRAFT", "counter_round = 0", "occupied_bed_nights = 0", "billable_cents = 0", "version = 1"]

  - method: GET
    path: "/facility-agreements/{facility_agreement_id}"
    description: "Read an agreement with its pinned rate and bed-night billing."
    roles: [CorpsDirector, TourManager, MembershipCoordinator, BusinessManager]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects: []

  - method: GET
    path: "/facility-agreements"
    description: "List agreements, filterable by host school, season and status."
    roles: [CorpsDirector, TourManager, MembershipCoordinator, BusinessManager]
    code: 200
    input: ["host_school_id?", "season_id?", "status?", "usage_type?", "limit?", "offset?"]
    output: FacilityAgreement[]
    side_effects: []

  - method: POST
    path: "/facility-agreements/{facility_agreement_id}/submit"
    description: "Send a DRAFT or COUNTERED agreement to the school for signature."
    roles: [TourManager]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects: ["status -> SUBMITTED", "version += 1"]

  - method: POST
    path: "/facility-agreements/{facility_agreement_id}/counter"
    description: "Record the school's counter-offer on the nightly rate, looping the agreement back for re-submission."
    roles: [TourManager]
    code: 200
    input: [countered_nightly_rate_cents]
    output: FacilityAgreement
    side_effects: ["status SUBMITTED -> COUNTERED", "countered_nightly_rate_cents replaced", "counter_round += 1", "no rate is pinned and no billing is computed", "version += 1"]

  - method: POST
    path: "/facility-agreements/{facility_agreement_id}/sign"
    description: "Sign the agreement, pinning the effective nightly rate and opening the bed-night billing."
    roles: [CorpsDirector]
    code: 200
    input: []
    output: FacilityAgreement
    side_effects:
      - "status SUBMITTED -> SIGNED"
      - "effective_nightly_rate_cents pinned (countered rate when counter_round > 0, else the proposed rate)"
      - "billable_bed_nights and billable_cents computed by housing_bed_night_capacity"
      - "Season.housing_cost_cents recomputed"
      - "version += 1"

  - method: POST
    path: "/facility-agreements/{facility_agreement_id}/cancel"
    description: "Cancel an agreement at any point before termination; a SIGNED agreement releases every assignment and booking hanging off it."
    roles: [CorpsDirector]
    code: 200
    input: [cancel_reason]
    output: FacilityAgreement
    side_effects:
      - "status -> CANCELLED; cancel_reason stored"
      - "every ACTIVE HousingAssignment -> RELEASED (released_reason = AGREEMENT_CANCELLED)"
      - "every HELD or CONFIRMED SiteBooking -> RELEASED (released_reason = AGREEMENT_CANCELLED), decrementing HostSchool.booked_block_count per booking"
      - "occupied_bed_nights = 0 and billable_cents = 0"
      - "HostSchool.reserved_bed_nights and Season.housing_cost_cents recomputed"
      - "version += 1"

  # ---- HousingAssignment --------------------------------------------------
  - method: POST
    path: "/housing-assignments"
    description: "Bed a member down in a numbered sleeping space for a date range. Guarded by OCC on the agreement's version (concurrency_rules[housing-assign-stale-agreement]) because adding an occupant is always legitimate on its own terms."
    roles: [MembershipCoordinator]
    code: 201
    input: [facility_agreement_id, member_id, space_index, check_in_date, check_out_date, expected_facility_agreement_version]
    output: HousingAssignment
    side_effects:
      - "nights computed as check_out_date - check_in_date; occupant_is_minor snapshotted from Member.is_minor"
      - "status = ACTIVE"
      - "FacilityAgreement.occupied_bed_nights / billable_bed_nights / billable_cents recomputed"
      - "HostSchool.reserved_bed_nights recomputed"
      - "Season.housing_cost_cents recomputed"
      - "increments FacilityAgreement.version by 1"
      - "version = 1"

  - method: GET
    path: "/housing-assignments/{housing_assignment_id}"
    description: "Read one housing assignment."
    roles: [CorpsDirector, TourManager, MembershipCoordinator, Member]
    code: 200
    input: []
    output: HousingAssignment
    side_effects: []

  - method: GET
    path: "/housing-assignments"
    description: "List housing assignments, filterable by agreement, member, space and status."
    roles: [CorpsDirector, TourManager, MembershipCoordinator]
    code: 200
    input: ["facility_agreement_id?", "member_id?", "space_index?", "status?", "limit?", "offset?"]
    output: HousingAssignment[]
    side_effects: []

  - method: POST
    path: "/housing-assignments/{housing_assignment_id}/release"
    description: "Release the beds an assignment consumed, reversing every bed-night side effect it caused."
    roles: [MembershipCoordinator]
    code: 200
    input: []
    output: HousingAssignment
    side_effects:
      - "status ACTIVE -> RELEASED; released_reason = MANUAL"
      - "FacilityAgreement.occupied_bed_nights / billable_bed_nights / billable_cents recomputed"
      - "HostSchool.reserved_bed_nights recomputed"
      - "Season.housing_cost_cents recomputed"
      - "version += 1"

  # ---- TourStop -----------------------------------------------------------
  - method: POST
    path: "/tour-stops"
    description: "Plan a stop on the route, chained to its predecessor by previous_stop_id, with its truck load and heat forecast."
    roles: [TourManager]
    code: 201
    input: [season_id, "previous_stop_id?", stop_type, venue_name, city, state_code, arrive_at, depart_at, "show_start_at?", travel_miles_from_previous, uniform_trunks, instrument_cases, prop_units, truck_count, rehearsal_minutes, heat_index_f]
    output: TourStop
    side_effects:
      - "transport_plan runs: total_load_cuft, total_load_lbs, trucks_required written"
      - "travel_feasibility runs: required_travel_minutes written"
      - "status = PLANNED, settlement_state = NONE, meal_cost_cents = 0"
      - "version = 1"

  - method: GET
    path: "/tour-stops/{tour_stop_id}"
    description: "Read one stop with its transport, travel, staffing and meal snapshots."
    roles: [CorpsDirector, TourManager, MembershipCoordinator, BusinessManager]
    code: 200
    input: []
    output: TourStop
    side_effects: []

  - method: GET
    path: "/tour-stops"
    description: "List stops, filterable by season, predecessor, type and status."
    roles: [CorpsDirector, TourManager, MembershipCoordinator, BusinessManager]
    code: 200
    input: ["season_id?", "previous_stop_id?", "stop_type?", "status?", "limit?", "offset?"]
    output: TourStop[]
    side_effects: []

  - method: POST
    path: "/tour-stops/{tour_stop_id}/confirm"
    description: "Confirm the stop once trucks, travel time, staffing coverage and heat protocols all check out; snapshots head counts and meal cost and promotes held rehearsal blocks."
    roles: [TourManager]
    code: 200
    input: []
    output: TourStop
    side_effects:
      - "roster_head_count / minor_head_count / required_chaperone_count / required_cook_count snapshotted"
      - "stop_meal_cost runs; meal_cost_cents written"
      - "transport_plan and travel_feasibility re-run"
      - "status PLANNED -> CONFIRMED"
      - "every HELD SiteBooking on this stop -> CONFIRMED"
      - "version += 1"

  - method: POST
    path: "/tour-stops/{tour_stop_id}/complete"
    description: "Close out a stop the convoy has departed; a SHOW stop opens for circuit settlement."
    roles: [TourManager]
    code: 200
    input: []
    output: TourStop
    side_effects: ["status CONFIRMED -> COMPLETED", "settlement_state -> PENDING when stop_type == SHOW", "version += 1"]

  - method: POST
    path: "/tour-stops/{tour_stop_id}/cancel"
    description: "Cancel a stop, releasing every rehearsal block and volunteer shift attached to it."
    roles: [CorpsDirector]
    code: 200
    input: [cancel_reason]
    output: TourStop
    side_effects:
      - "status -> CANCELLED; cancel_reason stored"
      - "every HELD or CONFIRMED SiteBooking -> RELEASED (released_reason = STOP_CANCELLED)"
      - "each affected HostSchool.booked_block_count decremented once per released booking"
      - "every PROPOSED / ACCEPTED / APPROVED StaffAssignment -> RELEASED (released_reason = STOP_CANCELLED), decrementing Volunteer.assignment_count for each formerly APPROVED assignment"
      - "version += 1"

  # ---- SiteBooking --------------------------------------------------------
  - method: POST
    path: "/site-bookings"
    description: "Book a rehearsal block at a host school between performances, under a SIGNED agreement, subject to the 90-minute load buffers and the extreme-heat protocol."
    roles: [TourManager]
    code: 201
    input: [tour_stop_id, host_school_id, facility_agreement_id, block_start_at, block_end_at, indoor]
    output: SiteBooking
    side_effects: ["status = HELD", "HostSchool.booked_block_count += 1", "version = 1"]

  - method: GET
    path: "/site-bookings/{site_booking_id}"
    description: "Read one rehearsal block."
    roles: [CorpsDirector, TourManager, MembershipCoordinator]
    code: 200
    input: []
    output: SiteBooking
    side_effects: []

  - method: GET
    path: "/site-bookings"
    description: "List rehearsal blocks, filterable by stop, school, agreement and status."
    roles: [CorpsDirector, TourManager, MembershipCoordinator]
    code: 200
    input: ["tour_stop_id?", "host_school_id?", "facility_agreement_id?", "status?", "limit?", "offset?"]
    output: SiteBooking[]
    side_effects: []

  - method: POST
    path: "/site-bookings/{site_booking_id}/release"
    description: "Give a rehearsal block back to the school, freeing the slot and its buffers immediately."
    roles: [TourManager]
    code: 200
    input: []
    output: SiteBooking
    side_effects: ["status -> RELEASED; released_reason = MANUAL", "HostSchool.booked_block_count -= 1", "version += 1"]

  # ---- Volunteer ----------------------------------------------------------
  - method: POST
    path: "/volunteers"
    description: "Register a volunteer (driver, cook, chaperone or athletic trainer) for background screening."
    roles: [VolunteerScreener]
    code: 201
    input: [full_name, email, role_type, "cdl_number?", "credential_id?"]
    output: Volunteer
    side_effects: ["screening_status = PENDING", "assignment_count = 0", "version = 1"]

  - method: GET
    path: "/volunteers/{volunteer_id}"
    description: "Read one volunteer with screening posture and expiry."
    roles: [CorpsDirector, TourManager, VolunteerScreener, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: GET
    path: "/volunteers"
    description: "List volunteers, filterable by role type and screening posture."
    roles: [CorpsDirector, TourManager, VolunteerScreener]
    code: 200
    input: ["role_type?", "screening_status?", "limit?", "offset?"]
    output: Volunteer[]
    side_effects: []

  - method: POST
    path: "/volunteers/{volunteer_id}/screening-decision"
    description: "Record the background-screening outcome; a clearance is stamped with the deciding user and expires 365 days later."
    roles: [VolunteerScreener]
    code: 200
    input: [decision, decided_on]
    output: Volunteer
    side_effects: ["screening_status -> CLEARED or REJECTED", "screening_decided_on stored", "screening_expires_on = decided_on + 365 days on clearance", "screened_by_user_id = X-User-ID", "version += 1"]

  # ---- StaffAssignment ----------------------------------------------------
  - method: POST
    path: "/staff-assignments"
    description: "Propose a volunteer shift on a stop; duty must match the volunteer's role type and the shift must sit inside the stop window."
    roles: [TourManager]
    code: 201
    input: [volunteer_id, tour_stop_id, duty, shift_start_at, shift_end_at]
    output: StaffAssignment
    side_effects: ["status = PROPOSED", "version = 1"]

  - method: GET
    path: "/staff-assignments/{staff_assignment_id}"
    description: "Read one volunteer shift."
    roles: [CorpsDirector, TourManager, VolunteerScreener, Volunteer]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

  - method: GET
    path: "/staff-assignments"
    description: "List volunteer shifts, filterable by volunteer, stop, duty and status."
    roles: [CorpsDirector, TourManager, VolunteerScreener]
    code: 200
    input: ["volunteer_id?", "tour_stop_id?", "duty?", "status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: POST
    path: "/staff-assignments/{staff_assignment_id}/accept"
    description: "The volunteer accepts their own proposed shift."
    roles: [Volunteer]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["status PROPOSED -> ACCEPTED", "version += 1"]

  - method: POST
    path: "/staff-assignments/{staff_assignment_id}/approve"
    description: "The tour manager approves an accepted shift; requires a CLEARED screening and an approver who is not the screener."
    roles: [TourManager]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["status ACCEPTED -> APPROVED", "approved_by_user_id = X-User-ID", "Volunteer.assignment_count += 1", "version += 1"]

  # ---- ShowSettlement -----------------------------------------------------
  - method: POST
    path: "/show-settlements"
    description: "Open the settlement for a COMPLETED show, striking the provisional payout from the corps' projected placement."
    roles: [BusinessManager]
    code: 201
    input: [tour_stop_id, appearance_fee_cents, prize_pool_cents, projected_placement]
    output: ShowSettlement
    side_effects:
      - "show_settlement_payout / provisional_forward runs: provisional_prize_cents, provisional_gross_cents, provisional_circuit_fee_cents, provisional_net_cents written"
      - "status = DRAFT; prepared_by_user_id = X-User-ID"
      - "version = 1"

  - method: GET
    path: "/show-settlements/{show_settlement_id}"
    description: "Read a settlement with both the provisional and (once finalized) the final figures."
    roles: [CorpsDirector, BusinessManager, TourManager]
    code: 200
    input: []
    output: ShowSettlement
    side_effects: []

  - method: GET
    path: "/show-settlements"
    description: "List settlements, filterable by stop and status."
    roles: [CorpsDirector, BusinessManager, TourManager]
    code: 200
    input: ["tour_stop_id?", "status?", "limit?", "offset?"]
    output: ShowSettlement[]
    side_effects: []

  - method: POST
    path: "/show-settlements/{show_settlement_id}/finalize"
    description: "Finalize against the circuit's certified placement and remittance advice. remittance_lines is an array of objects { kind: PRIZE_ADJUSTMENT | SANCTION_FEE | FEE_REBATE, amount_cents: integer, recorded_at: ISO8601 UTC } replayed in (recorded_at, array index) order."
    roles: [BusinessManager]
    code: 200
    input: [final_placement, remittance_lines]
    output: ShowSettlement
    side_effects:
      - "show_settlement_payout / circuit_final runs: final_prize_cents, final_gross_cents, final_circuit_fee_cents, sanctions_charged_cents, rebate_applied_cents, final_net_cents, variance_cents, remittance_line_count written"
      - "status DRAFT -> FINALIZED; finalized_by_user_id = X-User-ID"
      - "parent TourStop.settlement_state PENDING -> SETTLED"
      - "Season.tour_revenue_cents recomputed"
      - "version += 1"

  # ---- test-driving surface ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, expiry, due-date and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [CorpsDirector, MembershipCoordinator, TourManager, BusinessManager, VolunteerScreener]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock advances or rewinds to to_iso8601; no entity is mutated and no sweep is triggered"]

# ---------------------------------------------------------------------------
# 1.6 Error Catalog — every id is produced by at least one §1.4 row or §1.2
# transition precondition.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, of the wrong JSON type, or carries a value outside its declared enum"
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "an ordered date or instant pair is not strictly increasing"
  - id: ERR_CONDITIONAL_FIELD_MISMATCH
    http: 400
    condition: "a conditionally required field is absent when its condition holds, or present when it does not (cdl_number, credential_id, show_start_at, travel_miles_from_previous, countered_nightly_rate_cents)"
  - id: ERR_AMOUNT_NOT_POSITIVE
    http: 400
    condition: "a monetary, count or placement input violates its positivity floor"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "a season id in the path or body does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "a member id in the path or body does not resolve"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "a member_contract id in the path or body does not resolve"
  - id: ERR_PAYMENT_PLAN_NOT_FOUND
    http: 404
    condition: "a payment_plan id in the path or body does not resolve"
  - id: ERR_TUITION_PAYMENT_NOT_FOUND
    http: 404
    condition: "a tuition_payment id in the path does not resolve"
  - id: ERR_HOST_SCHOOL_NOT_FOUND
    http: 404
    condition: "a host_school id in the path or body does not resolve"
  - id: ERR_FACILITY_AGREEMENT_NOT_FOUND
    http: 404
    condition: "a facility_agreement id in the path or body does not resolve"
  - id: ERR_HOUSING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "a housing_assignment id in the path does not resolve"
  - id: ERR_TOUR_STOP_NOT_FOUND
    http: 404
    condition: "a tour_stop id in the path or body (including previous_stop_id) does not resolve"
  - id: ERR_SITE_BOOKING_NOT_FOUND
    http: 404
    condition: "a site_booking id in the path does not resolve"
  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "a volunteer id in the path or body does not resolve"
  - id: ERR_STAFF_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "a staff_assignment id in the path does not resolve"
  - id: ERR_SHOW_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "a show_settlement id in the path does not resolve"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (X-User-ID != the resource's owning foreign key)"
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version does not equal the current Member.version on POST /payment-plans"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_facility_agreement_version does not equal the current FacilityAgreement.version on POST /housing-assignments"
  - id: ERR_INVALID_MEMBER_STATE
    http: 409
    condition: "the member's membership_status does not permit the requested operation"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "the contract's status does not permit sign / request-revision / reissue / execute"
  - id: ERR_CONTRACT_NOT_EXECUTED
    http: 409
    condition: "a payment plan is requested against a contract whose status != EXECUTED"
  - id: ERR_PLAN_NOT_ACCEPTING_PAYMENTS
    http: 409
    condition: "a payment targets a plan whose status is SETTLED, SUPERSEDED or CLOSED_WITH_BALANCE"
  - id: ERR_INVALID_PAYMENT_STATE
    http: 409
    condition: "a reversal targets a payment that is already REVERSED, or whose plan has been SUPERSEDED"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "the agreement's status does not permit submit / counter / sign / cancel"
  - id: ERR_AGREEMENT_NOT_SIGNED
    http: 409
    condition: "a housing assignment references an agreement that is not SIGNED or whose usage_type != SPRING_TRAINING, or a rehearsal block references an agreement that is not SIGNED or whose usage_type != TOUR_REHEARSAL"
  - id: ERR_INVALID_HOUSING_STATE
    http: 409
    condition: "a release targets a housing assignment that is already RELEASED"
  - id: ERR_INVALID_STOP_STATE
    http: 409
    condition: "the stop's status does not permit confirm / complete / cancel, or a child booking or shift is created against a COMPLETED or CANCELLED stop"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "a release targets a rehearsal block that is already RELEASED"
  - id: ERR_INVALID_SCREENING_STATE
    http: 409
    condition: "a screening decision targets a volunteer whose screening_status is not PENDING"
  - id: ERR_INVALID_STAFF_ASSIGNMENT_STATE
    http: 409
    condition: "accept is called on a shift that is not PROPOSED, or approve on a shift that is not ACCEPTED"
  - id: ERR_INVALID_SETTLEMENT_STATE
    http: 409
    condition: "finalize targets a settlement that is already FINALIZED"
  - id: ERR_STOP_NOT_COMPLETED
    http: 409
    condition: "a settlement is opened or finalized against a stop that is not COMPLETED, or against a REHEARSAL_ONLY stop"
  - id: ERR_SEASON_MISMATCH
    http: 409
    condition: "a housing assignment or rehearsal block crosses seasons (member's or stop's season != the agreement's season)"
  - id: ERR_CONTRACT_MEMBER_MISMATCH
    http: 409
    condition: "POST /payment-plans supplies a member_id that is not the contract's member_id"
  - id: ERR_AGREEMENT_SCHOOL_MISMATCH
    http: 409
    condition: "POST /site-bookings supplies a host_school_id that is not the agreement's host_school_id"
  - id: ERR_DUTY_ROLE_MISMATCH
    http: 409
    condition: "the requested duty does not correspond to the volunteer's role_type"
  - id: ERR_MEDICAL_NOT_CLEARED
    http: 409
    condition: "a contract is executed for a member whose medical_status is RESTRICTED or SIDELINED"
  - id: ERR_MINOR_ROOM_MIX
    http: 409
    condition: "a sleeping space would hold both minors and adults on overlapping nights"
  - id: ERR_CHAPERONE_COVERAGE_INSUFFICIENT
    http: 409
    condition: "confirming a stop with fewer APPROVED chaperones than ceil(minor_head_count / 10)"
  - id: ERR_COOK_COVERAGE_INSUFFICIENT
    http: 409
    condition: "confirming a stop with fewer APPROVED cooks than ceil(roster_head_count / 40)"
  - id: ERR_TRAINER_COVERAGE_REQUIRED
    http: 409
    condition: "confirming a stop with heat_index_f >= 95 or rehearsal_minutes >= 240 and no APPROVED athletic trainer"
  - id: ERR_EXTREME_HEAT_OUTDOOR_PROHIBITED
    http: 409
    condition: "booking a rehearsal block for a stop whose heat_index_f >= 105 outdoors, or indoors at a school without air conditioning"
  - id: ERR_SCREENING_NOT_CLEARED
    http: 409
    condition: "approving a shift for a volunteer whose screening_status is PENDING, REJECTED or EXPIRED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving user also recorded the volunteer's screening, or the finalizing user also prepared the settlement draft"
  - id: ERR_TRAVEL_TIME_INFEASIBLE
    http: 409
    condition: "confirming a stop the convoy cannot reach in time from its predecessor"
  - id: ERR_SITE_BLOCK_CONFLICT
    http: 409
    condition: "a rehearsal block leaves less than 180 minutes of clearance from another HELD or CONFIRMED block at the same school"
  - id: ERR_BLOCK_OUTSIDE_AGREEMENT_WINDOW
    http: 409
    condition: "a rehearsal block falls outside its agreement's date window"
  - id: ERR_STAY_OUTSIDE_AGREEMENT_WINDOW
    http: 409
    condition: "a housing stay falls outside its agreement's date window"
  - id: ERR_SHIFT_OUTSIDE_STOP_WINDOW
    http: 409
    condition: "a volunteer shift starts before the stop's arrive_at or ends after its depart_at"
  - id: ERR_VOLUNTEER_SHIFT_OVERLAP
    http: 409
    condition: "a volunteer would hold two open shifts whose windows overlap"
  - id: ERR_FUTURE_DATED_INPUT
    http: 409
    condition: "a business date (received_on, decided_on, withdrawal_date) is after the logical clock date"
  - id: ERR_WITHDRAWAL_DATE_OUT_OF_RANGE
    http: 409
    condition: "a withdrawal is back-dated before the season's spring_training_start_date"
  - id: ERR_STOP_NOT_DEPARTED
    http: 409
    condition: "completing a stop before the logical clock reaches its depart_at"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "a member email repeats within its season, or a volunteer email repeats across volunteers"
  - id: ERR_CONTRACT_ALREADY_EXISTS
    http: 409
    condition: "a member already holds a contract whose status != VOIDED"
  - id: ERR_SETTLEMENT_ALREADY_EXISTS
    http: 409
    condition: "a stop already has a settlement"
  - id: ERR_MAX_REVISION_ROUNDS_EXCEEDED
    http: 409
    condition: "a 4th reissue is attempted on a contract whose revision_round is already 3"
  - id: ERR_MAX_COUNTER_ROUNDS_EXCEEDED
    http: 409
    condition: "a 3rd counter is attempted on an agreement whose counter_round is already 2"
  - id: ERR_SPACE_INDEX_OUT_OF_RANGE
    http: 409
    condition: "space_index is below 1 or above the host school's sleeping_space_count"
  - id: ERR_SPACE_CAPACITY_EXCEEDED
    http: 409
    condition: "the sleeping space's effective capacity (reduced by one bunk whenever a minor occupies it) would be exceeded on overlapping nights"
  - id: ERR_MEMBER_ALREADY_HOUSED
    http: 409
    condition: "the member already holds an ACTIVE housing assignment overlapping the requested dates"
  - id: ERR_INSUFFICIENT_TRUCKS
    http: 409
    condition: "confirming a stop whose truck_count is below the computed trucks_required"
  - id: ERR_RATE_ABOVE_CAP
    http: 409
    condition: "a proposed or countered nightly rate exceeds 1500 cents per bed-night"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 409
    condition: "a payment exceeds the plan's outstanding late fees plus outstanding principal"

# ---------------------------------------------------------------------------
# 1.7 RBAC — segregation of duties. The screener/approver split and the
# preparer/finalizer split are both enforced on X-User-ID, not on role.
# ---------------------------------------------------------------------------
roles:
  - name: CorpsDirector
    description: "Executive authority: opens seasons, countersigns member contracts and facility agreements, and cancels stops and agreements."
    identity: "opaque"
    exclusive_operations:
      - "POST /seasons"
      - "POST /member-contracts/{member_contract_id}/execute"
      - "POST /facility-agreements/{facility_agreement_id}/sign"
      - "POST /facility-agreements/{facility_agreement_id}/cancel"
      - "POST /tour-stops/{tour_stop_id}/cancel"
    shared_operations:
      - "GET on every collection and entity except the volunteer-shift accept path"
      - "POST /_clock/set_current_utc"

  - name: MembershipCoordinator
    description: "Owns the membership pipeline: auditions, contract issuance and reissue, medical postures, withdrawals and housing assignments."
    identity: "opaque"
    exclusive_operations:
      - "POST /members"
      - "POST /members/{member_id}/audition-decision"
      - "POST /members/{member_id}/medical-status"
      - "POST /members/{member_id}/withdraw"
      - "POST /member-contracts"
      - "POST /member-contracts/{member_contract_id}/reissue"
      - "POST /housing-assignments"
      - "POST /housing-assignments/{housing_assignment_id}/release"
    shared_operations:
      - "GET /members, GET /member-contracts, GET /host-schools, GET /facility-agreements, GET /housing-assignments, GET /tour-stops, GET /site-bookings"
      - "POST /_clock/set_current_utc"

  - name: TourManager
    description: "Owns the route and its resources: host schools, facility negotiation, tour stops, rehearsal blocks and volunteer shift staffing."
    identity: "opaque"
    exclusive_operations:
      - "POST /host-schools"
      - "POST /facility-agreements"
      - "POST /facility-agreements/{facility_agreement_id}/submit"
      - "POST /facility-agreements/{facility_agreement_id}/counter"
      - "POST /tour-stops"
      - "POST /tour-stops/{tour_stop_id}/confirm"
      - "POST /tour-stops/{tour_stop_id}/complete"
      - "POST /site-bookings"
      - "POST /site-bookings/{site_booking_id}/release"
      - "POST /staff-assignments"
      - "POST /staff-assignments/{staff_assignment_id}/approve"
    shared_operations:
      - "GET /members, GET /host-schools, GET /facility-agreements, GET /housing-assignments, GET /tour-stops, GET /site-bookings, GET /volunteers, GET /staff-assignments, GET /show-settlements"
      - "POST /_clock/set_current_utc"

  - name: BusinessManager
    description: "Owns money: payment plans, tuition posting and reversal, the billing sweep and circuit settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /seasons/{season_id}/run-billing-cycle"
      - "POST /payment-plans"
      - "POST /tuition-payments"
      - "POST /tuition-payments/{tuition_payment_id}/reverse"
      - "POST /show-settlements"
      - "POST /show-settlements/{show_settlement_id}/finalize"
    shared_operations:
      - "GET /members, GET /member-contracts, GET /payment-plans, GET /tuition-payments, GET /seasons/{season_id}, GET /tour-stops, GET /show-settlements"
      - "POST /_clock/set_current_utc"
    note: "A single BusinessManager user id may prepare a settlement OR finalize it, never both (ERR_SEGREGATION_OF_DUTIES); two distinct BusinessManager user ids are required to close a show."

  - name: VolunteerScreener
    description: "Runs background screening on volunteers; deliberately cannot approve the shifts of anyone it screened."
    identity: "opaque"
    exclusive_operations:
      - "POST /volunteers"
      - "POST /volunteers/{volunteer_id}/screening-decision"
    shared_operations:
      - "GET /volunteers, GET /staff-assignments"
      - "POST /_clock/set_current_utc"
    note: "Screening and shift approval are split across roles AND across user ids: StaffAssignment.approved_by_user_id must differ from Volunteer.screened_by_user_id."

  - name: Member
    description: "A performing member acting on their own contract and reading their own ledger."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /member-contracts/{member_contract_id}/sign"
      - "POST /member-contracts/{member_contract_id}/request-revision"
    shared_operations:
      - "GET /members/{member_id}, GET /member-contracts/{member_contract_id}, GET /payment-plans/{payment_plan_id}, GET /tuition-payments/{tuition_payment_id}, GET /housing-assignments/{housing_assignment_id}"
    note: "X-User-ID must equal the MemberContract.member_id being signed or revised, else ERR_NOT_RESOURCE_OWNER."

  - name: Volunteer
    description: "A volunteer accepting their own proposed shift."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /staff-assignments/{staff_assignment_id}/accept"
    shared_operations:
      - "GET /volunteers/{volunteer_id}, GET /staff-assignments/{staff_assignment_id}"
    note: "X-User-ID must equal the StaffAssignment.volunteer_id being accepted, else ERR_NOT_RESOURCE_OWNER."
