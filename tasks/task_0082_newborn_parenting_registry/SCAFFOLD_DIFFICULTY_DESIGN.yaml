scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sep_deadline_calendar_vs_business_roll_diverges
        grounds:
          - calculations.compute_sep_deadline
          - entities.InsurancePolicy.fields.plan_type
          - entities.DependentEnrollment.fields.sep_deadline
        distinguishing_aspect: |
          For an identical birth_datetime (2026-03-05T10:00:00Z, whose birth+30d lands
          on Saturday 2026-04-04), a MARKETPLACE policy (CALENDAR variant) yields
          sep_deadline 2026-04-04T10:00:00Z while an EMPLOYER_GROUP policy
          (BUSINESS_ROLL variant) rolls forward to 2026-04-06T23:59:59.999Z — the two
          valid approaches produce different deadlines for the same newborn.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
            - "Two policies: MARKETPLACE and EMPLOYER_GROUP, each with dependent_slots_max 3."
            - "One admitted PreRegistration with one BORN newborn whose birth_datetime is 2026-03-05T10:00:00Z."
            - "Two PENDING DependentEnrollments for that newborn, one per policy."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "MktCo", subscriber_name: "Pat Doe", plan_type: "MARKETPLACE", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { mkt_policy_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { emp_policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${mkt_policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /dependent-enrollments"
              payload: { newborn_id: "${nb_id}", policy_id: "${mkt_policy_id}", requested_at: "2026-03-05T12:00:00Z" }
              as: BenefitsCoordinator
              captures: { enr_mkt_id: $.data.id, sep_mkt: $.data.sep_deadline }
            - call: "POST /dependent-enrollments"
              payload: { newborn_id: "${nb_id}", policy_id: "${emp_policy_id}", requested_at: "2026-03-05T12:00:00Z" }
              as: BenefitsCoordinator
              captures: { enr_emp_id: $.data.id, sep_emp: $.data.sep_deadline }
          trigger:
            - call: "GET /dependent-enrollments/${enr_mkt_id}"
              payload: {}
              as: BenefitsCoordinator
              captures: { sep_mkt_read: $.data.sep_deadline }
            - call: "GET /dependent-enrollments/${enr_emp_id}"
              payload: {}
              as: BenefitsCoordinator
              captures: { sep_emp_read: $.data.sep_deadline }
          assert:
            - "DependentEnrollment.${enr_mkt_id}.sep_deadline == 2026-04-04T10:00:00.000Z"
            - "DependentEnrollment.${enr_emp_id}.sep_deadline == 2026-04-06T23:59:59.999Z"
            - "DependentEnrollment.${enr_mkt_id}.sep_deadline != DependentEnrollment.${enr_emp_id}.sep_deadline"

      - name: bag_value_round_then_sum_vs_sum_then_round_diverges
        grounds:
          - calculations.compute_bag_value
          - entities.DischargeBag.fields.line_items
          - entities.DischargeBag.fields.total_value_cents
        distinguishing_aspect: |
          A bag of three MEDICATION lines (1*1499, 1*2510, 1*310 cents, each *1.05): the
          ROUND_THEN_SUM order the system uses yields 4536 cents (1574+2636+326), whereas the
          rejected SUM_THEN_ROUND order yields 4535 (round(1573.95+2635.50+325.50)=round(4534.95)=4535).
          The DischargeBag domain (not the DependentEnrollment SEP domain) carries this second
          dual-variant, distinct from the SEP-deadline instance above.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
            - "An admitted PreRegistration with one BORN newborn."
            - "A DRAFT DischargeBag for that newborn with three MEDICATION line items: qty1@1499, qty1@2510, qty1@310 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /discharge-bags"
              payload: { newborn_id: "${nb_id}", line_items: [ { sku: "MED-A", category: "MEDICATION", qty: 1, unit_value_cents: 1499 }, { sku: "MED-B", category: "MEDICATION", qty: 1, unit_value_cents: 2510 }, { sku: "MED-C", category: "MEDICATION", qty: 1, unit_value_cents: 310 } ] }
              as: AttendingNurse
              captures: { bag_id: $.data.id }
          trigger:
            - call: "POST /discharge-bags/${bag_id}/assemble"
              payload: {}
              as: AttendingNurse
              captures: { total: $.data.total_value_cents, pharm: $.data.requires_pharmacy_signoff }
          assert:
            - "DischargeBag.${bag_id}.total_value_cents == 4536"
            - "DischargeBag.${bag_id}.requires_pharmacy_signoff == true"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: discharge_readiness_nonlinear_four_input_score
        grounds:
          - calculations.compute_discharge_readiness
          - entities.Newborn.fields.discharge_readiness_score
          - entities.LactationConsult.fields.feeding_adequate
        distinguishing_aspect: |
          MODE (a): discharge_readiness_score is a >=3-input non-linear formula — a tiered
          step in weight_grams (40/25/10/0) plus three conditional 0-or-N branches keyed on
          sibling-entity state (feeding-adequate consult exists, no open NICU stay,
          birth-cert filing SUBMITTED/ACCEPTED), capped at 100. Inputs: weight 2100 (25) +
          feeding adequate (30) + no open NICU (20) + no birth-cert filing (0) = 75.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
            - "A ROOMING_IN newborn weight 2100g, with one COMPLETED feeding-adequate LactationConsult (latch 8), no NICU stay, no birth-cert filing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 2100, gestational_age_weeks: 37, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
            - call: "POST /lactation-consults"
              payload: { newborn_id: "${nb_id}", consult_datetime: "2026-03-05T11:00:00Z" }
              as: AttendingNurse
              captures: { lc_id: $.data.id }
            - call: "POST /lactation-consults/${lc_id}/complete"
              payload: { latch_score: 8 }
              as: AttendingNurse
          trigger:
            - call: "GET /newborns/${nb_id}"
              payload: {}
              as: AttendingNurse
              captures: { score: $.data.discharge_readiness_score }
          assert:
            - "Newborn.${nb_id}.discharge_readiness_score == 75"

      - name: bag_value_round_order_pinned_round_then_sum
        grounds:
          - calculations.compute_bag_value
          - entities.DischargeBag.fields.total_value_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters — the scaffold pins ROUND_THEN_SUM
          (round each line to integer cents, then sum). For three half-cent MEDICATION lines
          (1499,2510,310 *1.05) the pinned order yields 4536; the unpinned SUM_THEN_ROUND
          would yield 4535. This is a distinct mode from the MODE (a) discharge-readiness
          instance above.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
            - "A DRAFT DischargeBag with two FORMULA lines that each produce a non-half-cent value plus one half-cent MEDICATION line, demonstrating per-line rounding before summation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /discharge-bags"
              payload: { newborn_id: "${nb_id}", line_items: [ { sku: "MED-X", category: "MEDICATION", qty: 1, unit_value_cents: 2510 }, { sku: "FORM-Y", category: "FORMULA", qty: 2, unit_value_cents: 1299 } ] }
              as: AttendingNurse
              captures: { bag_id: $.data.id }
          trigger:
            - call: "POST /discharge-bags/${bag_id}/assemble"
              payload: {}
              as: AttendingNurse
              captures: { total: $.data.total_value_cents }
          assert:
            - "DischargeBag.${bag_id}.total_value_cents == 5234"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: followup_task_cyclic_record_attempt_then_escalate
        grounds:
          - state_machines.FollowUpTask.OPEN_to_ATTEMPTED
          - state_machines.FollowUpTask.ATTEMPTED_to_ATTEMPTED
          - state_machines.FollowUpTask.ATTEMPTED_to_ESCALATED
        distinguishing_aspect: |
          FollowUpTask exhibits a cyclic self-loop (ATTEMPTED -> ATTEMPTED) that terminates by
          escalation: the 1st record-attempt OPEN->ATTEMPTED, the 2nd loops ATTEMPTED->ATTEMPTED,
          the 3rd flips ATTEMPTED->ESCALATED. attempt_count reaches 3 and status becomes ESCALATED.
        test_recipe:
          setup:
            - "Clock at 2026-03-10T08:00:00Z."
            - "A DISCHARGED newborn (full happy-path) so its four FollowUpTasks exist in OPEN; pick the WEIGHT_CHECK task."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9, legal_name: "Baby Doe" }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /newborns/${nb_id}/room-in"
              payload: {}
              as: AttendingNurse
            - call: "POST /lactation-consults"
              payload: { newborn_id: "${nb_id}", consult_datetime: "2026-03-05T11:00:00Z" }
              as: AttendingNurse
              captures: { lc_id: $.data.id }
            - call: "POST /lactation-consults/${lc_id}/complete"
              payload: { latch_score: 8 }
              as: AttendingNurse
            - call: "POST /discharge-bags"
              payload: { newborn_id: "${nb_id}", line_items: [ { sku: "FORM-A", category: "FORMULA", qty: 2, unit_value_cents: 1299 } ] }
              as: AttendingNurse
              captures: { bag_id: $.data.id }
            - call: "POST /discharge-bags/${bag_id}/assemble"
              payload: {}
              as: AttendingNurse
            - call: "POST /discharge-bags/${bag_id}/issue"
              payload: {}
              as: AttendingNurse
            - call: "POST /government-filings"
              payload: { newborn_id: "${nb_id}", filing_type: "BIRTH_CERTIFICATE" }
              as: VitalRecordsOfficer
              captures: { bc_id: $.data.id }
            - call: "POST /government-filings/${bc_id}/submit"
              payload: {}
              as: VitalRecordsOfficer
            - call: "POST /newborns/${nb_id}/mark-discharge-ready"
              payload: {}
              as: AttendingNurse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /newborns/${nb_id}/discharge"
              payload: {}
              as: AttendingNurse
            - call: "GET /follow-up-tasks"
              payload: {}
              as: AttendingNurse
              captures: { wc_task_id: "$.data[0].id" }
          trigger:
            - call: "POST /follow-up-tasks/${wc_task_id}/record-attempt"
              payload: { scheduled_at: "2026-03-11T09:00:00Z" }
              as: AttendingNurse
            - call: "POST /follow-up-tasks/${wc_task_id}/record-attempt"
              payload: { scheduled_at: "2026-03-12T09:00:00Z" }
              as: AttendingNurse
            - call: "POST /follow-up-tasks/${wc_task_id}/record-attempt"
              payload: { scheduled_at: "2026-03-13T09:00:00Z" }
              as: AttendingNurse
              captures: { st: $.data.status, ac: $.data.attempt_count }
          assert:
            - "FollowUpTask.${wc_task_id}.attempt_count == 3"
            - "FollowUpTask.${wc_task_id}.status == ESCALATED"

      - name: government_filing_rejected_resubmit_revision_loop
        grounds:
          - state_machines.GovernmentFiling.SUBMITTED_to_REJECTED
          - state_machines.GovernmentFiling.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          GovernmentFiling (a different entity from FollowUpTask) is cyclic via a revision loop:
          PENDING -> SUBMITTED -> REJECTED -> SUBMITTED. After resubmit the status returns to
          SUBMITTED and submitted_at advances, proving the loop is reachable.
        test_recipe:
          setup:
            - "Clock at 2026-03-06T08:00:00Z."
            - "A BORN newborn with legal_name 'Baby Doe' and a PENDING BIRTH_CERTIFICATE filing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T08:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 1, weight_grams: 3200, gestational_age_weeks: 39, apgar_5min: 9, legal_name: "Baby Doe" }
              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /government-filings"
              payload: { newborn_id: "${nb_id}", filing_type: "BIRTH_CERTIFICATE" }
              as: VitalRecordsOfficer
              captures: { bc_id: $.data.id }
            - call: "POST /government-filings/${bc_id}/submit"
              payload: {}
              as: VitalRecordsOfficer
            - call: "POST /government-filings/${bc_id}/acknowledge"
              payload: { outcome: "REJECTED" }
              as: VitalRecordsOfficer
              captures: { st_after_reject: $.data.status }
          trigger:
            - call: "POST /government-filings/${bc_id}/submit"
              payload: {}
              as: VitalRecordsOfficer
              captures: { st_after_resubmit: $.data.status }
          assert:
            - "GovernmentFiling.${bc_id}.status == SUBMITTED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: step_down_frees_bed_promotes_waiting_stay_depth3
        grounds:
          - state_machines.Newborn.NICU_ADMITTED_to_STEP_DOWN
          - state_machines.NicuStay.ACTIVE_to_STEPPED_DOWN
          - state_machines.NicuStay.PENDING_BED_to_ACTIVE
          - entities.NicuBed.fields.current_stay_id
        distinguishing_aspect: |
          Depth-3 cascade from the step-down trigger: step-down(NewbornA) -> close NicuStayA
          (ACTIVE->STEPPED_DOWN) -> free the single LEVEL_3 NicuBed -> that freeing promotes the
          earliest-admitted waiting NicuStayB (PENDING_BED->ACTIVE), which re-occupies the bed.
          Each hop is caused by the previous, not by the original action.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
            - "Exactly one LEVEL_3 NicuBed in the pool."
            - "NewbornA escalated and ACTIVE on the only bed (admitted_at 2026-03-05T09:00:00Z)."
            - "NewbornB escalated, required_level LEVEL_3, left PENDING_BED because the pool was full (admitted_at 2026-03-05T10:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T12:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /nicu-beds"
              payload: { bed_label: "NICU-1", acuity_level: "LEVEL_3" }
              as: Neonatologist
              captures: { bed_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { carrier_name: "EmpCo", subscriber_name: "Pat Doe", plan_type: "EMPLOYER_GROUP", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
            - call: "POST /registrations"
              payload: { mother_full_name: "Pat Doe", mother_dob: "1992-05-01", due_date: "2026-03-12", payer_policy_id: "${policy_id}", planned_delivery_facility: "Mercy" }
              as: IntakeClerk
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/admit"
              payload: {}
              as: IntakeClerk
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T09:00:00Z", birth_sequence: 1, weight_grams: 1500, gestational_age_weeks: 31, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_a: $.data.id }
            - call: "POST /registrations/${reg_id}/newborns"
              payload: { birth_datetime: "2026-03-05T10:00:00Z", birth_sequence: 2, weight_grams: 1600, gestational_age_weeks: 32, apgar_5min: 9 }
              as: AttendingNurse
              captures: { nb_b: $.data.id }
            - call: "GET /newborns/${nb_a}"
              payload: {}
              as: Neonatologist
              captures: { nb_a_v: $.data.version }
            - call: "POST /newborns/${nb_a}/nicu-escalate"
              payload: { required_level: "LEVEL_3", admitted_at: "2026-03-05T09:00:00Z", expected_newborn_version: "${nb_a_v}" }
              as: Neonatologist
              captures: { stay_a: $.data.id }
            - call: "GET /newborns/${nb_b}"
              payload: {}
              as: Neonatologist
              captures: { nb_b_v: $.data.version }
            - call: "POST /newborns/${nb_b}/nicu-escalate"
