            - "first trigger call: NOT 409 ERR_POLLS_NOT_YET_OPEN (the clock is exactly at polls_open_at, which is allowed)"
            - "after the first failure: ElectionRound.${rnd_id}.status == SCHEDULED (nothing written)"
            - "second trigger call: VoterList.${vl_id}.status == ACCEPTED"
            - "third trigger call: 200 and ElectionRound.${rnd_id}.status == POLLS_OPEN with the identical empty body"
            - "VoterList.${vl_id}.completeness_pct == 100.00 and is_late == false throughout"

      - name: meeting_submission_requires_trained_presenter
        grounds:
          - validations[priority=13]
          - errors.ERR_PRESENTER_NOT_TRAINED
          - state_machines.Supervisor.UNTRAINED_to_UNTRAINED
          - state_machines.CampaignCommunication.DRAFT_to_PENDING_LEGAL_REVIEW
        dependency: "CampaignCommunication.DRAFT -> PENDING_LEGAL_REVIEW depends on Supervisor.training_status == TRAINED"
        distinguishing_aspect: |
          The dependency crosses from a child message to a person record, and it is channel-conditional:
          the very same submit request that fails for a SMALL_GROUP_MEETING succeeds for an EMAIL on
          the same untrained supervisor's petition. A failed training attempt still increments
          training_attempt_count without unlocking the message, so the gate reads the status field and
          not the attempt counter.
        test_recipe:
          setup:
            - "petition SCOPE_ANALYSIS with one supervisor who failed the quiz with 74 (UNTRAINED, training_attempt_count 1)"
            - "a SMALL_GROUP_MEETING message naming that supervisor as presenter, accuracy-reviewed (risk 20)"
            - "an EMAIL message on the same petition with no presenter, accuracy-reviewed (risk 10)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330072", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
