        distinguishing_aspect: "Each declared foreign key is discoverable from its parent: operator_id on /facilities, triggering_reading_id on /closure-orders, permit_id on /fee-ledger-entries and prior_inspection_id on /inspections each return exactly the child rows that point at the given parent."
        test_recipe:
          setup:
