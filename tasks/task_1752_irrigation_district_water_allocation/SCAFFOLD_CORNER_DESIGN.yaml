        grounds: [state_machines.TransferRequest.PENDING_to_APPROVED, "errors[ERR_INSUFFICIENT_ALLOCATION]", calculations.available_balance]
        distinguishing_aspect: "Approval re-evaluates the source balance at approve time: a transfer (5.00 af) created while available was 10.00 is rejected with ERR_INSUFFICIENT_ALLOCATION after an order commits 8.26 af."
        test_recipe:
