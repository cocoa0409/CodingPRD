            - { call: "POST /plant/operators", payload: { operator_name: "QI S11", badge_no: "B-QI-S11" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager, captures: { ct1: $.data.id } }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-S11", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO S11", badge_no: "B-LO-S11" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /plant/operator-certifications/${ct1}/revoke", payload: {}, as: QualityManager }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}", captures: { err: $.data.error_id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager, captures: { ct2: $.data.id } }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}", captures: { ok_res: $.data.result } }
          assert:
            - "captured err == ERR_OPERATOR_NOT_CERTIFIED   # revoked cert no longer counts"
            - "OperatorCertification.${ct2}.status == ACTIVE   # overlap with a REVOKED cert is allowed"
            - "captured ok_res == PASS   # testing resumes after reissue"

