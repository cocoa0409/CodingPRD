            - "Rider.${r1_id}.fare_counter_date == 2026-08-03 and fare_counter_week_start == 2026-08-03 (Monday)"
            - "${pa1_final_state} == COMPLETED"
            - "GET /fare-transactions?trip_request_id=${t1_id} returns exactly 1 CHARGE row of 325"

      - name: trip_fare_variant_divergence_is_covered_by_the_difficulty_probe
        claim_type: variant_divergence
        grounds: [calculations.trip_fare]
        excluded_because:
          difficulty_instance: trip_fare_provisional_quote_vs_settled_charge_band_shift
          rationale: "Divergence needs the same trip to cross a band edge between quote and settlement; that instance drives variant_minutes 12 -> 22 (MEDIUM -> LONG) and asserts both 325 and 400 plus the lost transfer waiver, which a second recipe could only duplicate."

      - name: subsidy_variant_divergence_is_covered_by_the_difficulty_probe
        claim_type: variant_divergence
        grounds: [calculations.subsidy_per_trip]
        excluded_because:
          difficulty_instance: subsidy_per_trip_provisional_vs_final_scope_and_hours_diverge
          rationale: "The PROVISIONAL/FINAL split changes three things at once (block scope, revenue-hour source, trip scope); that instance files both variants over identical data and asserts 32178 against 13535."

      - name: variant_reconciliation_on_settlement_is_covered_by_the_difficulty_probe
        claim_type: reconciliation
        grounds: [calculations.trip_fare, entities.FareTransaction]
        excluded_because:
          difficulty_instance: settlement_cascade_caps_a_second_quoted_trip_of_the_same_rider
          rationale: "Reconciliation here is the quote -> settle delta landing in the rider counters and the FareTransaction ledger while a sibling quote is re-capped; that instance asserts the resulting CHARGE and CAP_REBATE rows and the shrunken headroom."

      - name: subsidy_cost_rounding_order_is_covered_by_the_difficulty_probe
        claim_type: precision
        grounds: [calculations.subsidy_per_trip]
        excluded_because:
          difficulty_instance: operating_cost_rounds_per_block_before_summing
          rationale: "The round-per-block-then-sum rule only shows up when at least two blocks each carry a half-cent remainder; that instance pins 27904 against the naive 27905 and the resulting subsidy 27579."

      - name: subsidy_zero_trip_denominator_is_covered_by_the_difficulty_probe
        claim_type: correct_result
        grounds: [calculations.subsidy_per_trip]
        excluded_because:
          difficulty_instance: zero_trip_denominator_and_half_up_revenue_hours_boundary
          rationale: "The total_trips == 0 guard and the 2.005 -> 2.01 revenue-hour rounding boundary are both asserted there (cost 18572, subsidy 0)."

      - name: fleet_sizing_ceilings_and_surge_threshold_are_covered_by_the_difficulty_probe
        claim_type: constants_applied
        grounds: [calculations.fleet_sizing]
        excluded_because:
          difficulty_instance: surge_threshold_inclusive_at_peak_factor_one_point_five_zero
          rationale: "TRIPS_PER_BLOCK_HOUR 4, the two ceil() divisions, the inclusive SURGE_THRESHOLD_PEAK_FACTOR 1.5 and MAX_SURGE_BLOCKS 6 are all exercised there across peak_factor 1.50 (surge 0) and 1.51 (surge 2)."

      - name: pool_match_score_weighting_is_covered_by_the_difficulty_probe
        claim_type: correct_result
        grounds: [calculations.pool_match_selection]
        excluded_because:
          difficulty_instance: pool_match_score_seat_slack_saturation_forces_tiebreak
          rationale: "The four-term score with SEAT_SLACK_CAP saturation producing an exact tie at 24 and the start_utc tie-break is the whole point of that instance."

      - name: detour_allowance_ceiling_and_floor_are_covered_by_the_difficulty_probe
        claim_type: constants_applied
        grounds: [calculations.corridor_travel_geometry]
        excluded_because:
          difficulty_instance: detour_allowance_inclusive_equality_accepted_next_step_rejected
          rationale: "corridor_travel_geometry's ceil() on the percentage and the max() against detour_tolerance_floor_minutes are asserted there at the inclusive boundary and one minute past it."

      - name: transfer_credit_ordering_is_covered_by_the_difficulty_probe
        claim_type: correct_result
        grounds: [calculations.trip_fare, entities.TransitConnection.fields.transfer_credit_cents]
        excluded_because:
          difficulty_instance: transfer_credit_waiver_and_multiplier_order_pinned
          rationale: "Steps 2 through 6 of trip_fare are order-sensitive; that instance pins the single correct answer 45 against the 85 and 163 that wrong orderings produce."

  - section: validations
    instances:
      - name: duplicate_zone_code_is_rejected_across_the_whole_fleet
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_DUPLICATE_ZONE_CODE
        distinguishing_aspect: "zone_code uniqueness is global, not per-name: a second zone with a different name but the same code RBM returns 409 ERR_DUPLICATE_ZONE_CODE, while code RBM2 succeeds."
        test_recipe:
          setup:
            - "Zone RBM exists in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Riverbend North", zone_code: "RBM", max_walk_meters: 800, detour_tolerance_pct: 0.30, detour_tolerance_floor_minutes: 8, base_fare_cents: 300, fare_cap_cents_daily: 900, fare_cap_cents_weekly: 3000, on_time_window_minutes: 5, curb_capacity_per_bucket: 3 }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend North", zone_code: "RBM2", max_walk_meters: 800, detour_tolerance_pct: 0.30, detour_tolerance_floor_minutes: 8, base_fare_cents: 300, fare_cap_cents_daily: 900, fare_cap_cents_weekly: 3000, on_time_window_minutes: 5, curb_capacity_per_bucket: 3 }
              as: ZoneAdmin
              captures: { z2_id: $.data.id }
          assert:
            - "the duplicate-code create returns HTTP 409 with data.error_id == ERR_DUPLICATE_ZONE_CODE"
            - "the RBM2 create returns HTTP 201 with a name identical to the existing zone"
            - "GET /service-zones returns total_count == 2"
            - "ServiceZone.${z_id}.zone_code == RBM and ServiceZone.${z2_id}.zone_code == RBM2"

      - name: paired_stop_must_be_a_live_stop_in_the_same_zone
        claim_type: violation_to_error
        grounds:
          - validations.priority_9
          - errors.ERR_PAIRED_STOP_INVALID
        distinguishing_aspect: "Three ways to break the pairing are separated: a RETIRED partner in the same zone, a partner in another zone, and a partner id that does not exist at all — the first two are 422 ERR_PAIRED_STOP_INVALID while the third is the priority-5 404, and a partner that is merely PROPOSED is accepted."
        test_recipe:
          setup:
            - "Zones RBM-A and RBM-B are ACTIVE."
            - "Zone A holds stop A1 (APPROVED) and stop A9 (RETIRED); zone B holds stop B1 (APPROVED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend A", zone_code: "RBM-A", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { za_id: $.data.id }
            - call: "POST /service-zones/${za_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend B", zone_code: "RBM-B", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { zb_id: $.data.id }
            - call: "POST /service-zones/${zb_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${za_id}", stop_code: "A1", corridor_index: 1, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /virtual-stops/${a1_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${za_id}", stop_code: "A9", corridor_index: 9, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { a9_id: $.data.id }
            - call: "POST /virtual-stops/${a9_id}/retire"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${zb_id}", stop_code: "B1", corridor_index: 1, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { b1_stop_id: $.data.id }
            - call: "POST /virtual-stops/${b1_stop_id}/approve"
              payload: {}
              as: ZoneAdmin
          trigger:
            - call: "POST /virtual-stops"
              payload: { zone_id: "${za_id}", stop_code: "A2", corridor_index: 2, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH", paired_stop_id: "${a9_id}" }
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${za_id}", stop_code: "A2", corridor_index: 2, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH", paired_stop_id: "${b1_stop_id}" }
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${za_id}", stop_code: "A2", corridor_index: 2, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH", paired_stop_id: "00000000-0000-4000-8000-000000000009" }
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${za_id}", stop_code: "A2", corridor_index: 2, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH", paired_stop_id: "${a1_id}" }
              as: ZoneAdmin
              captures: { a2_id: $.data.id }
          assert:
            - "the RETIRED-partner create returns HTTP 422 with data.error_id == ERR_PAIRED_STOP_INVALID"
            - "the cross-zone-partner create returns HTTP 422 with data.error_id == ERR_PAIRED_STOP_INVALID"
            - "the unknown-partner create returns HTTP 404 with data.error_id == ERR_VIRTUAL_STOP_NOT_FOUND (priority 5 runs before priority 9)"
            - "the A1-partner create returns HTTP 201 and VirtualStop.${a2_id}.paired_stop_id == ${a1_id}"
            - "GET /virtual-stops?zone_id=${za_id} returns total_count == 3"

      - name: report_period_end_before_start_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_10
          - errors.ERR_REPORT_PERIOD_INVALID
        distinguishing_aspect: "period_end_date must be greater than or equal to period_start_date, so a reversed range is 422 while a single-day range where end equals start is accepted — the comparison is inclusive."
        test_recipe:
          setup:
            - "Zone RBM is ACTIVE with no blocks and no trips."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
          trigger:
            - call: "POST /subsidy-reports"
              payload: { zone_id: "${z_id}", period_start_date: "2026-08-05", period_end_date: "2026-08-04", variant: "PROVISIONAL" }
              as: FinanceAnalyst
              as_user_id: "fa-1"
            - call: "POST /subsidy-reports"
              payload: { zone_id: "${z_id}", period_start_date: "2026-08-05", period_end_date: "2026-08-05", variant: "PROVISIONAL" }
              as: FinanceAnalyst
              as_user_id: "fa-1"
              captures: { rp_id: $.data.id }
          assert:
            - "the reversed-range create returns HTTP 422 with data.error_id == ERR_REPORT_PERIOD_INVALID"
            - "the single-day create returns HTTP 201 with state == DRAFT"
            - "SubsidyReport.${rp_id}.period_start_date == 2026-08-05 and period_end_date == 2026-08-05"
            - "SubsidyReport.${rp_id}.submitted_by_user_id == null before submission"
            - "GET /subsidy-reports?zone_id=${z_id} returns total_count == 1"

      - name: reports_of_different_variants_may_share_a_period_but_same_variant_may_not
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_42
          - errors.ERR_REPORT_PERIOD_OVERLAP
        distinguishing_aspect: "The overlap key is (zone_id, variant), so a FINAL report over exactly the same dates as a live PROVISIONAL one is accepted, and only a second PROVISIONAL touching those dates by a single day is 409 — while a PROVISIONAL report whose live states no longer include REJECTED frees the range again."
        test_recipe:
          setup:
            - "Zone RBM is ACTIVE with no blocks and no trips."
            - "A PROVISIONAL report RP1 covers 2026-08-03..2026-08-05 in DRAFT."
          setup_api_calls:
