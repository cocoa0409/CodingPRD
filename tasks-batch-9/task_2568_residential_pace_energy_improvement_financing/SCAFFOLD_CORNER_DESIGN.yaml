  # ===========================================================================
  - section: errors
    instances:
      - name: request_missing_auth_headers_rejected_with_401
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MISSING_AUTH_HEADER]
          - roles
        distinguishing_aspect: |
          401 has two distinct triggers that must not collapse into 403: an absent/empty X-Role on ANY
          endpoint, and an absent X-User-ID on an endpoint whose roles include an entity_backed role
          (PropertyOwner / Contractor). A supplied-but-unknown X-Role is a different failure (403
          ERR_UNAUTHORIZED, covered in the rbac section), so authentication must be resolved before
          authorization.
        test_recipe:
          setup:
            - "Clock 2026-08-12; one ACTIVE product, one enrolled contractor and parcel P1 exist so that every referenced row is real and only the headers are at fault."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /pace/products"
              payload: {}
              as: "(no X-Role header sent)"
              captures: { err_norole: $.data.error_id }
            - call: "GET /pace/products"
              payload: {}
              as: "(X-Role sent as an empty string)"
              captures: { err_empty: $.data.error_id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              captures: { err_nouser: $.data.error_id }
          assert:
            - "Absent X-Role on a plain read: 401 err_norole == 'ERR_MISSING_AUTH_HEADER' — not 403, because there is no role to authorize"
            - "An empty X-Role is treated as absent, not as an unknown role: 401 err_empty == 'ERR_MISSING_AUTH_HEADER'"
            - "X-Role PropertyOwner with NO X-User-ID on an entity_backed endpoint: 401 err_nouser == 'ERR_MISSING_AUTH_HEADER' (the ownership check at priority 6 never runs)"
            - "Nothing was created: GET /pace/applications?property_id=${p1} (as ProgramAdmin) returns total_count == 0"
            - "The envelope shape is still honoured on a 401: the response carries error_id and a message and no data payload"

      - name: supersede_target_on_another_parcel_is_invalid_even_when_declined
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_SUPERSEDE_TARGET]
          - validations[priority=10]
        distinguishing_aspect: |
          Priority 10 has two conjuncts and the parcel conjunct is the one usually forgotten: a target
          whose status IS DECLINED still fails when it belongs to a DIFFERENT property, so the rule
          cannot be implemented as a pure status check. The same request with a same-parcel DECLINED
          target then succeeds, proving the failure was the parcel and not the status.
        test_recipe:
          setup:
            - "Clock 2026-08-12; parcels P1 and P2, one enrolled contractor, one ACTIVE solar product."
            - "P2's application A2 is submitted and DECLINED (decline_reason_code SIR_FLOOR); P1's application A1 is submitted and DECLINED too."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
