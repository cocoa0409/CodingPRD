# =============================================================================
# PRD Benchmark Seed Tables — Rail Demurrage & Detention Billing Dispute
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines · §1.2.1 Concurrency
# §1.3 Calculations · §1.4 Validations · §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================

scenario: |
  Rail Demurrage & Detention Billing Dispute (Class I railroad car management):
  free time calculation from constructive placement with actual placement and
  notification timing rules, private versus railroad-owned car charge structures
  and daily rate schedules, bunching claim analysis when deliveries arrive in
  clusters beyond customer control, dispute submission with evidence of
  railroad-caused delay and adjudication timelines, average agreement programs
  allowing credits for early releases, storage charges at yards and intermodal
  facilities with different clocks, customer notification systems and gate/track
  access constraints affecting release, regulatory complaint escalation and rule
  reasonableness challenges

domain_name: rail-demurrage-billing
api_prefix: /demurrage

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Peer collections under a single domain prefix; every relationship is an
  # explicit foreign key carried in the request body, never a nested URL id.

  state_machine_shape: cyclic
  # DemurrageDispute loops UNDER_REVIEW->INFO_REQUESTED->SUBMITTED->UNDER_REVIEW
  # and DECIDED->APPEALED->UNDER_REVIEW; PlacementCycle loops
  # ACTUALLY_PLACED->CONSTRUCTIVELY_PLACED on customer refusal; PlacementCycle
  # additionally carries two independent state dimensions (movement_status x
  # billing_status); Invoice is compound (derived from its charges' statuses).

  relationship_patterns:
    - one_to_many
    - self_referential      # DemurrageDispute.supersedes_dispute_id -> DemurrageDispute.id
    - cross_aggregate       # DemurrageDispute spans Invoice, DemurrageCharge and BunchingClaim

  role_model: segregation_of_duties
  # The DemurrageAdjudicator who issued the first-level decision on a dispute is
  # barred from touching that dispute's appeal round.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Calibration target requested for this task: above the §0.4 Expert band.
  # 13 entities / 51 endpoints / 47 error codes / 9 calculations / 9 state
  # machines. Density, not volume, carries the difficulty: every calculation
  # reads fields written by another entity's transition.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: customer_code, type: string, source: input, description: "Shipper/receiver billing code, unique across Customers", constraints: "1-16 chars, uppercase A-Z0-9 and hyphen only, unique" }
      - { name: name, type: string, source: input, description: "Legal name of the consignee" }
      - { name: serving_station_code, type: string, source: input, description: "Railroad station code that serves this customer", constraints: "1-8 chars" }
      - { name: notification_method, type: enum, source: input, default: "EDI", description: "Channel the railroad must use for car-arrival notice; FAX requires positive acknowledgement before the constructive clock can start", constraints: "EDI | EMAIL | FAX" }
      - { name: normal_daily_placement_capacity, type: integer, source: input, default: 2, description: "Cars per UTC day this customer can normally absorb; the ORDERED_VS_CAPACITY bunching baseline", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE at creation; SUSPENDED is never written by this API and the member is reserved", constraints: "ACTIVE | SUSPENDED" }
      - { name: billing_posture, type: enum, source: system, default: "CURRENT", description: "CURRENT or CREDIT_HOLD; set only by POST /demurrage/customers/{id}/credit-hold. CREDIT_HOLD blocks car release", constraints: "CURRENT | CREDIT_HOLD" }
      - { name: credit_hold_reason, type: string, source: system, default: null, description: "Reason recorded by the last credit-hold call; null when billing_posture is CURRENT" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Read-only = SUM of DemurrageCharge.credit_applied_cents over every charge whose placement cycle belongs to this Customer and whose status IN {FINAL, ADJUSTED}" }
      - { name: dispute_posture, type: enum, source: computed, default: "CLEAR", description: "Read-only = ESCALATED when any of this Customer's DemurrageDispute rows has status ESCALATED; else UNDER_REVIEW when any has status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPEALED}; else CLEAR", constraints: "CLEAR | UNDER_REVIEW | ESCALATED" }

  - name: TariffRuleSet
    parent: null
    common_fields: true
    fields:
      - { name: tariff_code, type: string, source: input, description: "Publication code of the demurrage tariff, e.g. 6004-C. Multiple versions may share a tariff_code; publishing a new one supersedes the prior PUBLISHED version", constraints: "1-16 chars" }
      - { name: car_ownership_scope, type: enum, source: input, default: "ANY", description: "Which car ownerships this rule set may be applied to; PRIVATE also covers PRIVATE_ASSIGNED", constraints: "RAILROAD_OWNED | PRIVATE | ANY" }
      - { name: free_time_hours_railroad, type: integer, source: input, default: 48, description: "Free time granted to RAILROAD_OWNED and PRIVATE_ASSIGNED cars", constraints: "multiple of 24, 0-240" }
      - { name: free_time_hours_private, type: integer, source: input, default: 24, description: "Free time granted to PRIVATE cars", constraints: "multiple of 24, 0-240" }
      - { name: tier1_day_count, type: integer, source: input, default: 2, description: "Number of chargeable days billed at the tier-1 rate", constraints: ">= 0" }
      - { name: tier1_rate_cents_railroad, type: integer, source: input, default: 12550, description: "Tier-1 per-diem cents for the railroad-owned rate ladder", constraints: ">= 0" }
      - { name: tier1_rate_cents_private, type: integer, source: input, default: 8150, description: "Tier-1 per-diem cents for the private rate ladder", constraints: ">= 0" }
      - { name: tier2_day_count, type: integer, source: input, default: 3, description: "Number of chargeable days billed at the tier-2 rate, immediately after tier 1", constraints: ">= 0" }
      - { name: tier2_rate_cents_railroad, type: integer, source: input, default: 22450, description: "Tier-2 per-diem cents, railroad-owned ladder", constraints: ">= 0" }
      - { name: tier2_rate_cents_private, type: integer, source: input, default: 14950, description: "Tier-2 per-diem cents, private ladder", constraints: ">= 0" }
      - { name: tier3_rate_cents_railroad, type: integer, source: input, default: 35050, description: "Per-diem cents for every chargeable day beyond tier 1 + tier 2, railroad-owned ladder", constraints: ">= 0" }
      - { name: tier3_rate_cents_private, type: integer, source: input, default: 24050, description: "Per-diem cents beyond tier 1 + tier 2, private ladder", constraints: ">= 0" }
      - { name: weekend_excluded, type: boolean, source: input, default: false, description: "When true, UTC Saturdays and Sundays are neither counted as free days nor charged as demurrage days" }
      - { name: notification_grace_hours, type: integer, source: input, default: 4, description: "Hours added to a non-FAX notification's sent_at before the constructive clock may start", constraints: "0-48" }
      - { name: adjudication_days_base, type: integer, source: input, default: 20, description: "Base business-day allowance for adjudicating a dispute filed under this tariff", constraints: "5-90" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> PUBLISHED -> {SUPERSEDED | CHALLENGED}; CHALLENGED -> {PUBLISHED | WITHDRAWN}", constraints: "DRAFT | PUBLISHED | CHALLENGED | SUPERSEDED | WITHDRAWN" }
      - { name: challenge_count, type: integer, source: system, default: 0, description: "Number of RULE_REASONABLENESS regulatory complaints that have cited this rule set" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: facility_code, type: string, source: input, description: "Track, yard or terminal code, unique across Facilities", constraints: "1-16 chars, unique" }
      - { name: kind, type: enum, source: input, default: "INDUSTRY_TRACK", description: "INDUSTRY_TRACK produces DEMURRAGE/DETENTION charges from the placement clock; RAIL_YARD and INTERMODAL_TERMINAL produce STORAGE charges from the dwell clock", constraints: "INDUSTRY_TRACK | RAIL_YARD | INTERMODAL_TERMINAL" }
      - { name: storage_clock_mode, type: enum, source: input, default: "CALENDAR_DAY_MIDNIGHT", description: "Which storage clock this facility runs; ignored when kind is INDUSTRY_TRACK", constraints: "CALENDAR_DAY_MIDNIGHT | HOURLY_FROM_ARRIVAL" }
      - { name: gate_open_hour, type: integer, source: input, default: 7, description: "UTC hour the gate opens", constraints: "0-23" }
      - { name: gate_close_hour, type: integer, source: input, default: 16, description: "UTC hour the gate closes; a release at or after this hour makes the release date itself a chargeable day", constraints: "0-23" }
      - { name: car_spot_capacity, type: integer, source: input, default: 3, description: "Maximum number of PlacementCycles that may be in movement_status ACTUALLY_PLACED at this facility at one instant", constraints: ">= 1" }
      - { name: switch_buffer_minutes, type: integer, source: input, default: 120, description: "Minimum minutes that must elapse after the facility's most recent switch event before another car may be actually placed", constraints: ">= 0" }
      - { name: storage_free_hours, type: integer, source: input, default: 48, description: "Free storage hours granted at this facility", constraints: "multiple of 24, 0-240" }
      - { name: storage_daily_rate_cents, type: integer, source: input, default: 9000, description: "Flat per-diem cents for each chargeable storage day", constraints: ">= 0" }
      - { name: operates_weekends, type: boolean, source: input, default: false, description: "When false, UTC Saturdays and Sundays are not chargeable storage days under CALENDAR_DAY_MIDNIGHT" }
      - { name: access_mode, type: enum, source: system, default: "OPEN", description: "OPEN allows actual placement and release; GATE_CONTROLLED blocks actual placement but allows release; EMBARGOED blocks both", constraints: "OPEN | GATE_CONTROLLED | EMBARGOED" }
      - { name: access_mode_reason, type: string, source: system, default: null, description: "Reason recorded by the last access-mode change; null until first changed" }
      - { name: occupied_spot_count, type: integer, source: computed, default: 0, description: "Read-only = COUNT of PlacementCycle rows with facility_id == this Facility.id and movement_status == ACTUALLY_PLACED" }
      - { name: last_switch_at, type: datetime, source: computed, default: null, description: "Read-only = MAX over PlacementCycle rows with facility_id == this Facility.id of the greatest non-null value among {actual_placement_at, released_at}; null when the facility has no such row" }

  - name: RailCar
    parent: null
    common_fields: true
    fields:
      - { name: car_mark, type: string, source: input, description: "Reporting mark plus number, e.g. BNSF-712344, unique across RailCars", constraints: "1-16 chars, unique" }
      - { name: ownership, type: enum, source: input, description: "RAILROAD_OWNED bills on the railroad ladder with railroad free time; PRIVATE bills on the private ladder with private free time; PRIVATE_ASSIGNED bills on the private ladder with railroad free time", constraints: "RAILROAD_OWNED | PRIVATE | PRIVATE_ASSIGNED" }
      - { name: car_type, type: string, source: input, default: "BOXCAR", description: "Equipment type description" }
      - { name: capacity_tons, type: integer, source: input, default: 100, description: "Nominal load limit in tons", constraints: "1-200" }
      - { name: active_cycle_count, type: integer, source: computed, default: 0, description: "Read-only = COUNT of PlacementCycle rows with rail_car_id == this RailCar.id and movement_status NOT IN {RELEASED, VOIDED}" }

  - name: PlacementCycle
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the consignee billed for this cycle" }
      - { name: rail_car_id, type: string, source: input, description: "FK -> RailCar.id; the car whose occupation interval this cycle owns" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the track, yard or terminal the car is destined for" }
      - { name: tariff_rule_set_id, type: string, source: input, description: "FK -> TariffRuleSet.id; pinned at creation and never re-read from a newer version" }
      - { name: waybill_number, type: string, source: input, description: "Waybill reference for this movement", constraints: "1-24 chars" }
      - { name: movement_status, type: enum, source: system, default: "ORDERED", description: "Physical dimension: ORDERED -> CONSTRUCTIVELY_PLACED -> {ACTUALLY_PLACED | RELEASED}; ACTUALLY_PLACED -> CONSTRUCTIVELY_PLACED on refusal; ACTUALLY_PLACED -> RELEASED; {ORDERED, RELEASED} -> VOIDED", constraints: "ORDERED | CONSTRUCTIVELY_PLACED | ACTUALLY_PLACED | RELEASED | VOIDED" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "Billing dimension, evolving independently of movement_status: UNBILLED -> INVOICED -> DISPUTED -> {ADJUSTED | INVOICED}; ADJUSTED -> DISPUTED on appeal; {INVOICED, ADJUSTED} -> SETTLED", constraints: "UNBILLED | INVOICED | DISPUTED | ADJUSTED | SETTLED" }
      - { name: constructive_placement_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC instant the car was constructively placed (held because the customer could not receive it); null until the constructive-placement call" }
      - { name: constructive_reason_code, type: enum, source: input, default: null, description: "Why the car could not be actually placed", constraints: "TRACK_FULL | GATE_CLOSED | CUSTOMER_HOLD | EMBARGO | YARD_ARRIVAL" }
      - { name: notification_sent_at, type: datetime, source: computed, default: null, description: "Read-only = sent_at of the FIRST CarNotification on this cycle whose delivery_status IN {SENT, DELIVERED, ACKNOWLEDGED}, ordered by sent_at ASC then created_at ASC; null when no such notification exists" }
      - { name: notification_acknowledged_at, type: datetime, source: computed, default: null, description: "Read-only = acknowledged_at of the CarNotification most recently moved to ACKNOWLEDGED on this cycle; null when none" }
      - { name: actual_placement_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC instant the car was spotted at the customer's spot; reset to null by a refusal" }
      - { name: released_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC instant the empty/loaded car was released back to the railroad" }
      - { name: refusal_count, type: integer, source: system, default: 0, description: "Number of times the customer has refused the spot on this cycle; a third refusal is rejected" }
      - { name: clock_basis, type: enum, source: computed, default: "NONE", description: "Read-only, output of the demurrage_clock_basis_resolution calculation: CONSTRUCTIVE, ACTUAL, or NONE when no clock can start", constraints: "NONE | CONSTRUCTIVE | ACTUAL" }
      - { name: clock_start_at, type: datetime, source: computed, default: null, description: "Read-only instant the free-time clock starts, per the elected clock_basis; null when clock_basis is NONE" }
      - { name: free_days, type: integer, source: computed, default: 0, description: "Read-only = free_time_hours for this car's ownership divided by 24 (integer division)" }
      - { name: free_time_expires_at, type: datetime, source: computed, default: null, description: "Read-only end-of-free-time instant, always at 23:59:59.999Z of an eligible UTC date; null when clock_basis is NONE" }
      - { name: chargeable_days, type: integer, source: computed, default: 0, description: "Read-only count of eligible chargeable UTC dates after free_time_expires_at, per the demurrage_chargeable_days calculation" }
      - { name: early_release_days, type: integer, source: computed, default: 0, description: "Read-only count of eligible UTC dates strictly after the release date and up to and including the free-time expiry date; the free days the customer gave back" }

  - name: CarNotification
    parent: null
    common_fields: false
    fields:
      - { name: placement_cycle_id, type: string, source: system, description: "FK -> PlacementCycle.id; the cycle this arrival notice belongs to" }
      - { name: channel, type: enum, source: input, description: "Channel the notice was actually transmitted on", constraints: "EDI | EMAIL | FAX" }
      - { name: sent_at, type: datetime, source: input, description: "ISO 8601 UTC instant the notice left the railroad" }
      - { name: delivery_status, type: enum, source: computed, description: "FAILED when channel != Customer.notification_method; else DELIVERED when channel is EDI; else SENT. Moves to ACKNOWLEDGED when the customer acknowledges it", constraints: "SENT | DELIVERED | FAILED | ACKNOWLEDGED" }
      - { name: acknowledged_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC instant the customer acknowledged the notice; null until acknowledged" }
      - { name: sequence_number, type: integer, source: computed, description: "1-based position of this notice among the cycle's notifications ordered by created_at ASC" }

  - name: DemurrageCharge
    parent: null
    common_fields: true
    fields:
      - { name: placement_cycle_id, type: string, source: system, description: "FK -> PlacementCycle.id; the cycle that produced this charge line" }
      - { name: invoice_id, type: string, source: system, default: null, description: "FK -> Invoice.id; null until the charge is attached by an invoice creation" }
      - { name: charge_kind, type: enum, source: computed, description: "DEMURRAGE for RAILROAD_OWNED cars on an INDUSTRY_TRACK; DETENTION for PRIVATE and PRIVATE_ASSIGNED cars on an INDUSTRY_TRACK; STORAGE at a RAIL_YARD or INTERMODAL_TERMINAL", constraints: "DEMURRAGE | DETENTION | STORAGE" }
      - { name: computation_basis, type: enum, source: computed, description: "Which clock produced chargeable_days: the cycle's clock_basis for DEMURRAGE/DETENTION, or the facility's storage clock for STORAGE", constraints: "CONSTRUCTIVE | ACTUAL | STORAGE_CALENDAR | STORAGE_HOURLY" }
      - { name: chargeable_days, type: integer, source: computed, default: 0, description: "Read-only day count this line accrued before any bunching exemption" }
      - { name: bunching_exempt_days, type: integer, source: computed, default: 0, description: "Read-only days removed from the front of the accrual sequence by a GRANTED or PARTIALLY_GRANTED BunchingClaim" }
      - { name: billable_days, type: integer, source: computed, default: 0, description: "Read-only = MAX(0, chargeable_days - bunching_exempt_days)" }
      - { name: gross_amount_cents, type: integer, source: computed, default: 0, description: "Read-only tiered amount for billable_days, re-laddered from tier 1, per the tiered_charge_amount calculation" }
      - { name: credit_applied_cents, type: integer, source: computed, default: 0, description: "Read-only = dispute credit plus average-agreement credit landed on this line; never exceeds gross_amount_cents" }
      - { name: net_amount_cents, type: integer, source: computed, default: 0, description: "Read-only = gross_amount_cents - credit_applied_cents" }
      - { name: status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL -> FINAL -> DISPUTED -> {ADJUSTED | FINAL}; ADJUSTED -> DISPUTED on appeal; any -> VOIDED when the cycle is voided", constraints: "PROVISIONAL | FINAL | DISPUTED | ADJUSTED | VOIDED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the billed consignee" }
      - { name: billing_period_start, type: datetime, source: input, description: "ISO 8601 UTC start of the billing period, inclusive" }
      - { name: billing_period_end, type: datetime, source: input, description: "ISO 8601 UTC end of the billing period, inclusive" }
      - { name: attached_charge_count, type: integer, source: computed, default: 0, description: "Read-only = COUNT of DemurrageCharge rows with invoice_id == this Invoice.id and status != VOIDED" }
      - { name: dispute_count, type: integer, source: computed, default: 0, description: "Read-only = COUNT of DemurrageDispute rows with invoice_id == this Invoice.id" }
      - { name: total_gross_cents, type: integer, source: computed, default: 0, description: "Read-only = SUM of gross_amount_cents over attached charges with status != VOIDED" }
      - { name: total_credit_cents, type: integer, source: computed, default: 0, description: "Read-only = SUM of credit_applied_cents over attached charges with status != VOIDED" }
      - { name: total_net_cents, type: integer, source: computed, default: 0, description: "Read-only = total_gross_cents - total_credit_cents" }
      - { name: agreement_credit_cents, type: integer, source: computed, default: 0, description: "Read-only portion of total_credit_cents contributed by the average agreement at issue time" }
      - { name: dispute_deadline_at, type: datetime, source: computed, default: null, description: "Read-only = the logical-clock date at issue time plus DISPUTE_WINDOW_DAYS calendar days, at 23:59:59.999Z; null while DRAFT" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> ISSUED; then derived from the attached charges: PARTIALLY_DISPUTED | ADJUSTED | ISSUED; -> CLOSED by the close call", constraints: "DRAFT | ISSUED | PARTIALLY_DISPUTED | ADJUSTED | CLOSED" }

  - name: BunchingClaim
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the claimant" }
      - { name: cluster_window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the alleged cluster window, inclusive" }
      - { name: cluster_window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the alleged cluster window, inclusive" }
      - { name: method, type: enum, source: input, description: "Which attribution algorithm the adjudicator must run", constraints: "ORDERED_VS_CAPACITY | ROLLING_AVERAGE_BASELINE" }
      - { name: baseline_per_day, type: integer, source: computed, default: 0, description: "Read-only baseline used by the elected method: Customer.normal_daily_placement_capacity for ORDERED_VS_CAPACITY, or the floor of the prior seven days' arrivals divided by 7 for ROLLING_AVERAGE_BASELINE" }
      - { name: delivered_car_count, type: integer, source: computed, default: 0, description: "Read-only size of the cluster set: PlacementCycle rows for this customer whose constructive_placement_at falls inside the closed window and whose movement_status != VOIDED" }
      - { name: exempted_cycle_ids, type: array, source: computed, default: [], description: "Read-only ordered list of PlacementCycle.id values granted exemption, dates ascending then constructive_placement_at ascending" }
      - { name: exempt_days_granted, type: integer, source: computed, default: 0, description: "Read-only total exempt days written across the exempted cycles' charges" }
      - { name: cluster_chargeable_days, type: integer, source: computed, default: 0, description: "Read-only = SUM of chargeable_days over the charges of every cycle in the cluster set" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED -> ANALYZED -> {GRANTED | PARTIALLY_GRANTED | DENIED}", constraints: "SUBMITTED | ANALYZED | GRANTED | PARTIALLY_GRANTED | DENIED" }

  - name: DemurrageDispute
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; copied from the disputed Invoice.customer_id at creation" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; the invoice under dispute" }
      - { name: demurrage_charge_id, type: string, source: input, default: null, description: "FK -> DemurrageCharge.id; required when scope is SINGLE_CHARGE, must be omitted when scope is WHOLE_INVOICE" }
      - { name: bunching_claim_id, type: string, source: input, default: null, description: "FK -> BunchingClaim.id; the granted claim relied on as evidence, required when grounds is BUNCHING" }
      - { name: supersedes_dispute_id, type: string, source: input, default: null, description: "FK -> DemurrageDispute.id; the earlier DECIDED dispute on the same invoice this refiling replaces" }
      - { name: scope, type: enum, source: input, description: "SINGLE_CHARGE targets one line; WHOLE_INVOICE targets every FINAL charge on the invoice", constraints: "SINGLE_CHARGE | WHOLE_INVOICE" }
      - { name: grounds, type: enum, source: input, description: "Legal theory of the dispute; drives the adjudication-timeline multiplier", constraints: "RAILROAD_CAUSED_DELAY | BUNCHING | NOTIFICATION_FAILURE | RATE_UNREASONABLE | CLOCK_BASIS_ERROR" }
      - { name: narrative, type: string, source: input, description: "Customer's written statement", constraints: "1-2000 chars" }
      - { name: claimed_credit_cents, type: integer, source: input, description: "Credit the customer asks for; caps the allowed credit", constraints: ">= 1" }
      - { name: target_charge_count, type: integer, source: computed, default: 0, description: "Read-only size of the target line set resolved at submit time" }
      - { name: evidence_weight, type: integer, source: computed, default: 0, description: "Read-only = SUM of DisputeEvidence.weight_points over this dispute's evidence rows" }
      - { name: allowance_pct, type: number, source: system, default: null, description: "Fraction of gross the adjudicator allowed on the current round; null until a decision" }
      - { name: allowed_credit_cents, type: integer, source: computed, default: 0, description: "Read-only credit actually granted on the current round, per the dispute_credit_allocation calculation" }
      - { name: decision, type: enum, source: system, default: "PENDING", description: "PENDING until a round is decided; reset to PENDING when an appeal is filed", constraints: "PENDING | ALLOWED | PARTIALLY_ALLOWED | DENIED" }
      - { name: decision_rationale, type: string, source: system, default: null, description: "Adjudicator's written reason for the current decision" }
      - { name: round_number, type: integer, source: system, default: 1, description: "1 for the first-level review, 2 after an appeal; a second appeal is rejected" }
      - { name: info_request_count, type: integer, source: system, default: 0, description: "Number of information requests issued on this dispute; a third is rejected" }
      - { name: submitted_at, type: datetime, source: computed, default: null, description: "Read-only logical-clock instant of the most recent submit or resubmit" }
      - { name: adjudication_due_at, type: datetime, source: computed, default: null, description: "Read-only deadline for the current round, always at 23:59:59.999Z of a Mon-Fri UTC date" }
      - { name: first_level_adjudicator_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the adjudicator who began the round-1 review; barred from the appeal round" }
      - { name: appeal_adjudicator_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the adjudicator who began the round-2 review" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> SUBMITTED -> UNDER_REVIEW -> {INFO_REQUESTED -> SUBMITTED | DECIDED}; DECIDED -> APPEALED -> UNDER_REVIEW; DECIDED -> {ESCALATED | CLOSED}", constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | DECIDED | APPEALED | ESCALATED | CLOSED" }

  - name: DisputeEvidence
    parent: null
    common_fields: false
    fields:
      - { name: demurrage_dispute_id, type: string, source: system, description: "FK -> DemurrageDispute.id; the dispute this exhibit supports" }
      - { name: evidence_type, type: enum, source: input, description: "Exhibit class; each class carries a fixed weight in the adjudication-timeline formula", constraints: "SWITCH_LIST | GATE_LOG | EMAIL_NOTICE | TRACK_EMBARGO_NOTICE | WEIGHT_CERTIFICATE" }
      - { name: observed_at, type: datetime, source: input, description: "ISO 8601 UTC instant the exhibit documents" }
      - { name: description, type: string, source: input, description: "Free-text caption", constraints: "1-500 chars" }
      - { name: weight_points, type: integer, source: computed, description: "Read-only fixed weight for evidence_type: SWITCH_LIST 3, GATE_LOG 3, EMAIL_NOTICE 1, TRACK_EMBARGO_NOTICE 4, WEIGHT_CERTIFICATE 2" }

  - name: AverageAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the enrolled consignee" }
      - { name: agreement_month, type: string, source: input, description: "Month the agreement covers, YYYY-MM; at most one OPEN agreement per customer per month", constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$" }
      - { name: credit_cap_ratio, type: number, source: input, default: 0.30, description: "Maximum fraction of the month's invoice gross that agreement credit may absorb", constraints: "0 < value <= 1, at most 2 decimal places" }
      - { name: credit_days_earned, type: integer, source: computed, default: 0, description: "Read-only = SUM of PlacementCycle.early_release_days over the customer's cycles released inside agreement_month" }
      - { name: debit_days_incurred, type: integer, source: computed, default: 0, description: "Read-only = SUM of DemurrageCharge.chargeable_days over the customer's charges with status IN {FINAL, ADJUSTED} whose cycle released inside agreement_month" }
      - { name: net_days, type: integer, source: computed, default: 0, description: "Read-only = credit_days_earned - debit_days_incurred" }
      - { name: agreement_credit_cents, type: integer, source: computed, default: 0, description: "Read-only credit cents this agreement contributed, after the cap; zeroed on FORFEITED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> RECONCILED when net_days >= 0 at reconcile time; OPEN -> FORFEITED when net_days < 0", constraints: "OPEN | RECONCILED | FORFEITED" }

  - name: RegulatoryComplaint
    parent: null
    common_fields: true
    fields:
      - { name: demurrage_dispute_id, type: string, source: input, description: "FK -> DemurrageDispute.id; the exhausted dispute being escalated" }
      - { name: tariff_rule_set_id, type: string, source: input, default: null, description: "FK -> TariffRuleSet.id; required when complaint_type is RULE_REASONABLENESS, must be omitted otherwise" }
      - { name: complaint_type, type: enum, source: input, description: "RULE_REASONABLENESS challenges the tariff itself; BILLING_PRACTICE challenges the railroad's conduct", constraints: "RULE_REASONABLENESS | BILLING_PRACTICE" }
      - { name: docket_narrative, type: string, source: input, description: "Statement filed with the regulator", constraints: "1-2000 chars" }
      - { name: docket_number, type: string, source: computed, description: "Read-only, deterministic: 'D-' followed by the 5-digit zero-padded 1-based position of this complaint among all RegulatoryComplaint rows ordered by created_at ASC" }
      - { name: filed_at, type: datetime, source: computed, description: "Read-only logical-clock instant of filing" }
      - { name: response_due_at, type: datetime, source: computed, description: "Read-only = the 15th Mon-Fri UTC date strictly after the filing date, at 23:59:59.999Z" }
      - { name: answer_narrative, type: string, source: system, default: null, description: "Railroad's answer; null until answered" }
      - { name: ordered_credit_cents, type: integer, source: system, default: 0, description: "Credit the regulator ordered; only non-zero on DECIDED_FOR_CUSTOMER" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED -> RAILROAD_ANSWERED -> {DECIDED_FOR_CUSTOMER | DECIDED_FOR_RAILROAD | DISMISSED}", constraints: "FILED | RAILROAD_ANSWERED | DECIDED_FOR_CUSTOMER | DECIDED_FOR_RAILROAD | DISMISSED" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # --- PlacementCycle, dimension 1 of 2: physical movement -------------------
  - entity: PlacementCycle
    state_field: movement_status
    initial_state: ORDERED
    terminal_states: [VOIDED]
    transitions:
      - from: ORDERED
        to: CONSTRUCTIVELY_PLACED
        trigger: "POST /demurrage/placement-cycles/{id}/constructive-placement"
        actor_role: RailroadAgent
        preconditions:
          - "movement_status == ORDERED"
          - "the cycle's TariffRuleSet.status IN {PUBLISHED, CHALLENGED} (a CHALLENGED tariff is still in force)"
          - "TariffRuleSet.car_ownership_scope covers RailCar.ownership (ANY covers all; PRIVATE covers PRIVATE and PRIVATE_ASSIGNED; RAILROAD_OWNED covers RAILROAD_OWNED)"
          - "Facility.access_mode != EMBARGOED"
        side_effects:
          - "sets constructive_placement_at and constructive_reason_code from the request"
          - "re-runs demurrage_clock_basis_resolution; clock_basis stays NONE until a notification lands"
          - "when Facility.kind IN {RAIL_YARD, INTERMODAL_TERMINAL}, creates a DemurrageCharge with charge_kind STORAGE, status PROVISIONAL, chargeable_days 0 and gross_amount_cents 0"
          - "when Facility.kind == INDUSTRY_TRACK, creates a DemurrageCharge with charge_kind DEMURRAGE or DETENTION per RailCar.ownership, status PROVISIONAL"
          - "increments PlacementCycle.version by 1"

      - from: CONSTRUCTIVELY_PLACED
        to: CONSTRUCTIVELY_PLACED
        trigger: "POST /demurrage/placement-cycles/{id}/notify"
        actor_role: RailroadAgent
        preconditions:
          - "movement_status IN {CONSTRUCTIVELY_PLACED, ACTUALLY_PLACED}"
          - "sent_at >= constructive_placement_at, else ERR_NON_CHRONOLOGICAL_EVENT"
        side_effects:
          - "creates a CarNotification whose delivery_status is FAILED when channel != Customer.notification_method, DELIVERED when channel == notification_method == EDI, else SENT"
          - "re-derives PlacementCycle.notification_sent_at from the cycle's notifications"
          - "re-runs demurrage_clock_basis_resolution; for a non-FAX customer this is what moves clock_basis off NONE"
          - "re-runs the PROVISIONAL charge recomputation"
          - "increments PlacementCycle.version by 1"

      - from: CONSTRUCTIVELY_PLACED
        to: ACTUALLY_PLACED
        trigger: "POST /demurrage/placement-cycles/{id}/actual-placement"
        actor_role: RailroadAgent
        preconditions:
          - "movement_status == CONSTRUCTIVELY_PLACED"
          - "Facility.access_mode == OPEN, else ERR_FACILITY_NOT_OPEN"
          - "Facility.occupied_spot_count < Facility.car_spot_capacity, else ERR_FACILITY_SPOT_UNAVAILABLE"
          - "Facility.last_switch_at IS NULL OR actual_placement_at >= last_switch_at + switch_buffer_minutes, else ERR_FACILITY_SWITCH_BUFFER"
          - "actual_placement_at >= constructive_placement_at, else ERR_NON_CHRONOLOGICAL_EVENT"
        side_effects:
          - "sets actual_placement_at from the request"
          - "re-runs demurrage_clock_basis_resolution; clock_basis flips to ACTUAL when actual_placement_at <= the constructive free-time expiry"
          - "Facility.occupied_spot_count and Facility.last_switch_at are re-derived"
          - "re-runs the PROVISIONAL charge recomputation on the cycle's charge"
          - "increments PlacementCycle.version by 1"

      - from: ACTUALLY_PLACED
        to: CONSTRUCTIVELY_PLACED
        trigger: "POST /demurrage/placement-cycles/{id}/refuse"
        actor_role: Customer
        preconditions:
          - "movement_status == ACTUALLY_PLACED"
          - "refusal_count < 2, else ERR_REFUSAL_LIMIT"
        side_effects:
          - "sets actual_placement_at back to null"
          - "increments refusal_count by 1"
          - "Facility.occupied_spot_count is re-derived downward"
          - "re-runs demurrage_clock_basis_resolution; clock_basis reverts to CONSTRUCTIVE and clock_start_at moves back to the constructive instant"
          - "re-runs the PROVISIONAL charge recomputation"
          - "increments PlacementCycle.version by 1"

      - from: ACTUALLY_PLACED
        to: RELEASED
        trigger: "POST /demurrage/placement-cycles/{id}/release"
        actor_role: Customer
        preconditions:
          - "movement_status == ACTUALLY_PLACED"
          - "Facility.access_mode IN {OPEN, GATE_CONTROLLED}, else ERR_FACILITY_EMBARGOED"
          - "Customer.billing_posture == CURRENT, else ERR_CUSTOMER_CREDIT_HOLD"
          - "notification_sent_at IS NOT NULL, else ERR_NOTIFICATION_NOT_SENT"
          - "released_at >= actual_placement_at, else ERR_NON_CHRONOLOGICAL_EVENT"
        side_effects:
          - "sets released_at; finalises chargeable_days and early_release_days on the cycle"
          - "the cycle's DemurrageCharge moves PROVISIONAL -> FINAL with chargeable_days and gross_amount_cents recomputed from released_at"
          - "the Customer's OPEN AverageAgreement for the release month, if any, has credit_days_earned, debit_days_incurred and net_days re-derived"
          - "Facility.last_switch_at is re-derived"
          - "increments PlacementCycle.version by 1"

      - from: CONSTRUCTIVELY_PLACED
        to: RELEASED
        trigger: "POST /demurrage/placement-cycles/{id}/release"
        actor_role: Customer
        preconditions:
          - "movement_status == CONSTRUCTIVELY_PLACED"
          - "Facility.kind IN {RAIL_YARD, INTERMODAL_TERMINAL} (a car on an INDUSTRY_TRACK must be actually placed before it can be released)"
          - "Facility.access_mode IN {OPEN, GATE_CONTROLLED}, else ERR_FACILITY_EMBARGOED"
          - "Customer.billing_posture == CURRENT, else ERR_CUSTOMER_CREDIT_HOLD"
          - "released_at >= constructive_placement_at, else ERR_NON_CHRONOLOGICAL_EVENT"
        side_effects:
          - "sets released_at"
          - "the cycle's STORAGE DemurrageCharge moves PROVISIONAL -> FINAL with chargeable_days from storage_dwell_charge (the facility's own clock, not the demurrage clock)"
          - "the Customer's OPEN AverageAgreement for the release month, if any, is re-derived"
          - "increments PlacementCycle.version by 1"

      - from: RELEASED
        to: VOIDED
        trigger: "POST /demurrage/placement-cycles/{id}/void"
        actor_role: BillingAdmin
        preconditions:
          - "movement_status IN {ORDERED, RELEASED}"
          - "the cycle's charge has invoice_id IS NULL OR that Invoice.status != CLOSED, else ERR_INVOICE_INVALID_STATE"
        side_effects:
          - "the cycle's DemurrageCharge moves to VOIDED and drops out of every aggregate"
          - "the charge's Invoice, if any, has attached_charge_count, total_gross_cents, total_credit_cents, total_net_cents and status re-derived"
          - "the Customer's OPEN AverageAgreement for the release month has debit_days_incurred and net_days re-derived downward"
          - "Customer.credit_balance_cents is re-derived"
          - "increments PlacementCycle.version by 1"

      - from: ORDERED
        to: VOIDED
        trigger: "POST /demurrage/placement-cycles/{id}/void"
        actor_role: BillingAdmin
        preconditions:
          - "movement_status == ORDERED"
        side_effects:
          - "no charge exists yet, so nothing cascades"
          - "RailCar.active_cycle_count is re-derived downward, freeing the car for a new cycle"
          - "increments PlacementCycle.version by 1"

  # --- PlacementCycle, dimension 2 of 2: billing ----------------------------
  - entity: PlacementCycle
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: [SETTLED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /demurrage/invoices (system side effect, no direct trigger)"
        actor_role: BillingAdmin
        preconditions:
          - "the cycle's DemurrageCharge has status FINAL and invoice_id IS NULL"
        side_effects:
          - "the charge's invoice_id is set to the new Invoice.id"
          - "movement_status is untouched: a cycle may be INVOICED while still RELEASED, and VOIDED while INVOICED"

      - from: INVOICED
        to: DISPUTED
        trigger: "POST /demurrage/disputes/{id}/submit (system side effect)"
        actor_role: Customer
        preconditions:
          - "the cycle's charge is in the submitted dispute's target set"
        side_effects:
          - "the cycle's charge moves FINAL -> DISPUTED"

      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /demurrage/disputes/{id}/decide (system side effect)"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "the decision landed a per-line credit greater than 0 on this cycle's charge"
        side_effects:
          - "the cycle's charge moves DISPUTED -> ADJUSTED with credit_applied_cents and net_amount_cents rewritten"

      - from: DISPUTED
        to: INVOICED
        trigger: "POST /demurrage/disputes/{id}/decide (system side effect, decision DENIED)"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "the decision landed a per-line credit of exactly 0 on this cycle's charge"
        side_effects:
          - "the cycle's charge moves DISPUTED -> FINAL with credit_applied_cents unchanged at 0"

      - from: ADJUSTED
        to: DISPUTED
        trigger: "POST /demurrage/disputes/{id}/appeal (system side effect)"
        actor_role: Customer
        preconditions:
          - "the appealed dispute's target set contains this cycle's charge"
        side_effects:
          - "the first-level credit is reversed: the charge moves ADJUSTED -> DISPUTED and credit_applied_cents returns to its pre-decision value"

      - from: INVOICED
        to: SETTLED
        trigger: "POST /demurrage/invoices/{id}/close (system side effect)"
        actor_role: BillingAdmin
        preconditions:
          - "no charge on the invoice has status DISPUTED"
        side_effects:
          - "the cycle's billing dimension is frozen; the movement dimension may still be VOIDED only while the invoice is not CLOSED"

      - from: ADJUSTED
        to: SETTLED
        trigger: "POST /demurrage/invoices/{id}/close (system side effect)"
        actor_role: BillingAdmin
        preconditions:
          - "no charge on the invoice has status DISPUTED"
        side_effects:
          - "the credited amount becomes permanent"

  # --- DemurrageCharge ------------------------------------------------------
  - entity: DemurrageCharge
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: PROVISIONAL
        trigger: "POST /demurrage/placement-cycles/{id}/notify | .../actual-placement | .../refuse"
        actor_role: RailroadAgent
        preconditions:
          - "status == PROVISIONAL"
        side_effects:
          - "chargeable_days is recomputed under the provisional variant (the logical clock stands in for released_at and the release date is never charged)"
          - "gross_amount_cents, billable_days and net_amount_cents are recomputed"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /demurrage/placement-cycles/{id}/release"
        actor_role: Customer
        preconditions:
          - "the owning cycle moved to RELEASED"
        side_effects:
          - "chargeable_days is recomputed under the final variant from released_at"
          - "computation_basis is frozen to the cycle's clock_basis or the facility's storage clock"
      - from: FINAL
        to: DISPUTED
        trigger: "POST /demurrage/disputes/{id}/submit"
        actor_role: Customer
        preconditions:
          - "status == FINAL"
          - "invoice_id IS NOT NULL and equals the dispute's invoice_id, else ERR_CHARGE_INVOICE_MISMATCH"
        side_effects:
          - "the owning cycle's billing_status moves to DISPUTED"
          - "the Invoice status is re-derived to PARTIALLY_DISPUTED"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /demurrage/disputes/{id}/decide"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "the per-line credit for this charge is greater than 0"
        side_effects:
          - "credit_applied_cents and net_amount_cents rewritten; the Invoice and the Customer's derived money fields re-derived"
      - from: DISPUTED
        to: FINAL
        trigger: "POST /demurrage/disputes/{id}/decide"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "the per-line credit for this charge is exactly 0"
        side_effects:
          - "credit_applied_cents stays 0; the Invoice status re-derives back to ISSUED when no other charge is DISPUTED or credited"
      - from: ADJUSTED
        to: DISPUTED
        trigger: "POST /demurrage/disputes/{id}/appeal"
        actor_role: Customer
        preconditions:
          - "status == ADJUSTED and the dispute is DECIDED with round_number == 1"
        side_effects:
          - "credit_applied_cents is reversed to its pre-decision value; the Invoice totals and the Customer's credit_balance_cents are re-derived"
      - from: FINAL
        to: VOIDED
        trigger: "POST /demurrage/placement-cycles/{id}/void"
        actor_role: BillingAdmin
        preconditions:
          - "the owning cycle moved to VOIDED"
        side_effects:
          - "the charge leaves every aggregate: Invoice totals, Customer.credit_balance_cents and AverageAgreement day counts are re-derived"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "POST /demurrage/placement-cycles/{id}/void"
        actor_role: BillingAdmin
        preconditions:
          - "the owning cycle moved to VOIDED from ORDERED or RELEASED"
        side_effects:
          - "no invoice is attached, so nothing rolls up"
      - from: ADJUSTED
        to: VOIDED
        trigger: "POST /demurrage/placement-cycles/{id}/void"
        actor_role: BillingAdmin
        preconditions:
          - "the owning cycle moved to VOIDED and the attached Invoice.status != CLOSED"
        side_effects:
          - "both gross and credit leave the Invoice totals; total_net_cents stays equal to total_gross_cents - total_credit_cents"

  # --- DemurrageDispute (cyclic, twice over) --------------------------------
  - entity: DemurrageDispute
    state_field: status
    initial_state: DRAFT
    terminal_states: [ESCALATED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /demurrage/disputes/{id}/submit"
        actor_role: Customer
        preconditions:
          - "status == DRAFT"
          - "at least one DisputeEvidence row exists on this dispute, else ERR_DISPUTE_NO_EVIDENCE"
          - "Invoice.status IN {ISSUED, PARTIALLY_DISPUTED, ADJUSTED}, else ERR_INVOICE_NOT_DISPUTABLE"
          - "the logical clock is at or before Invoice.dispute_deadline_at, else ERR_DISPUTE_WINDOW_CLOSED"
          - "every target charge has status FINAL, else ERR_CHARGE_INVALID_STATE"
          - "when grounds == BUNCHING, the referenced BunchingClaim.status IN {GRANTED, PARTIALLY_GRANTED}, else ERR_BUNCHING_CLAIM_NOT_GRANTED"
        side_effects:
          - "submitted_at is set to the current logical clock"
          - "target_charge_count and evidence_weight are frozen for this round"
          - "adjudication_due_at is computed by adjudication_timeline"
          - "every target charge moves FINAL -> DISPUTED and its cycle's billing_status moves to DISPUTED"
          - "Invoice.dispute_count and Invoice.status are re-derived; status becomes PARTIALLY_DISPUTED"
          - "Customer.dispute_posture is re-derived to UNDER_REVIEW"
          - "increments DemurrageDispute.version by 1"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /demurrage/disputes/{id}/begin-review"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "first_level_adjudicator_id is set to the caller's X-User-ID when round_number == 1 and it is still null"
          - "increments DemurrageDispute.version by 1"

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /demurrage/disputes/{id}/request-info"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "status == UNDER_REVIEW"
          - "info_request_count < 2, else ERR_INFO_REQUEST_LIMIT"
        side_effects:
          - "increments info_request_count by 1"
          - "adjudication_due_at is pushed out to the 10th Mon-Fri UTC date strictly after the current logical-clock date, at 23:59:59.999Z"
          - "the target charges stay DISPUTED and the Invoice stays PARTIALLY_DISPUTED"

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /demurrage/disputes/{id}/resubmit"
        actor_role: Customer
        preconditions:
          - "status == INFO_REQUESTED"
          - "at least one DisputeEvidence row was added after the information request, else ERR_DISPUTE_NO_EVIDENCE"
        side_effects:
          - "submitted_at is refreshed to the current logical clock"
          - "adjudication_due_at is NOT recomputed: the extension granted by the information request stands"
          - "evidence_weight is re-derived from the enlarged evidence set"

      - from: UNDER_REVIEW
        to: DECIDED
        trigger: "POST /demurrage/disputes/{id}/decide"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "status == UNDER_REVIEW"
          - "when round_number >= 2, the caller's X-User-ID != first_level_adjudicator_id, else ERR_SEGREGATION_OF_DUTIES"
          - "allowance_pct is consistent with decision (ALLOWED requires exactly 1, DENIED requires exactly 0, PARTIALLY_ALLOWED requires strictly between 0 and 1), else ERR_ALLOWANCE_PCT_MISMATCH"
        side_effects:
          - "decision, allowance_pct and decision_rationale are stored; allowed_credit_cents is computed by dispute_credit_allocation"
          - "each target charge receives its per-line credit and moves DISPUTED -> ADJUSTED, or DISPUTED -> FINAL when its credit is 0"
          - "the Invoice's total_credit_cents, total_net_cents and derived status are rewritten and Invoice.version increments by 1"
          - "Customer.credit_balance_cents and Customer.dispute_posture are re-derived and Customer.version increments by 1"

      - from: DECIDED
        to: APPEALED
        trigger: "POST /demurrage/disputes/{id}/appeal"
        actor_role: Customer
        preconditions:
          - "status == DECIDED"
          - "round_number < 2, else ERR_APPEAL_LIMIT"
        side_effects:
          - "round_number increments to 2; decision returns to PENDING; allowance_pct returns to null; allowed_credit_cents returns to 0"
          - "every target charge's first-level credit is reversed and the charge moves back to DISPUTED"
          - "the Invoice totals and derived status return to their pre-decision values and Invoice.version increments by 1"
          - "Customer.credit_balance_cents returns to its pre-decision value and dispute_posture re-derives to UNDER_REVIEW"
          - "adjudication_due_at is recomputed with the appeal multiplier, ignoring evidence weight"

      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /demurrage/disputes/{id}/begin-review"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "status == APPEALED"
          - "the caller's X-User-ID != first_level_adjudicator_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "appeal_adjudicator_id is set to the caller's X-User-ID"
          - "first_level_adjudicator_id is left untouched so the bar survives the round change"

      - from: DECIDED
        to: ESCALATED
        trigger: "POST /demurrage/regulatory-complaints (system side effect)"
        actor_role: Customer
        preconditions:
          - "status == DECIDED and round_number >= 2, else ERR_APPEAL_NOT_EXHAUSTED"
        side_effects:
          - "Customer.dispute_posture is re-derived to ESCALATED"
          - "when complaint_type == RULE_REASONABLENESS, the cited TariffRuleSet moves PUBLISHED -> CHALLENGED and its challenge_count increments"

      - from: DECIDED
        to: CLOSED
        trigger: "POST /demurrage/invoices/{id}/close (system side effect)"
        actor_role: BillingAdmin
        preconditions:
          - "status == DECIDED (an ESCALATED dispute blocks nothing but never closes)"
        side_effects:
          - "Customer.dispute_posture is re-derived to CLEAR when no other dispute is open"

  # --- Invoice (compound: status derived from its charges) -------------------
  - entity: Invoice
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /demurrage/invoices/{id}/issue"
        actor_role: BillingAdmin
        preconditions:
          - "status == DRAFT"
          - "attached_charge_count >= 1, else ERR_INVOICE_NO_CHARGES"
        side_effects:
          - "total_gross_cents is rolled up from the attached charges"
          - "average_agreement_credit runs: the Customer's OPEN AverageAgreement for the billing month, if any, lands agreement_credit_cents on the most expensive tier days first"
          - "total_credit_cents, total_net_cents and agreement_credit_cents are written"
          - "dispute_deadline_at is set to the logical-clock date plus DISPUTE_WINDOW_DAYS calendar days at 23:59:59.999Z"
          - "each attached cycle's billing_status moves UNBILLED -> INVOICED"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PARTIALLY_DISPUTED
        trigger: "POST /demurrage/disputes/{id}/submit (derived, no direct trigger)"
        actor_role: Customer
        preconditions:
          - "at least one attached charge has status DISPUTED"
        side_effects:
          - "status is re-derived, not assigned: the rule is evaluated after every charge-status change"
      - from: PARTIALLY_DISPUTED
        to: ADJUSTED
        trigger: "POST /demurrage/disputes/{id}/decide (derived)"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "no attached charge has status DISPUTED and at least one attached charge has credit_applied_cents > 0"
        side_effects:
          - "total_credit_cents and total_net_cents already rewritten by the decide cascade"
      - from: PARTIALLY_DISPUTED
        to: ISSUED
        trigger: "POST /demurrage/disputes/{id}/decide with decision DENIED (derived)"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "no attached charge has status DISPUTED and no attached charge has credit_applied_cents > 0"
        side_effects:
          - "the invoice returns to plain ISSUED, closing the derivation loop"
      - from: ADJUSTED
        to: PARTIALLY_DISPUTED
        trigger: "POST /demurrage/disputes/{id}/appeal (derived)"
        actor_role: Customer
        preconditions:
          - "an attached charge returned to status DISPUTED"
        side_effects:
          - "total_credit_cents returns to its pre-decision value"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /demurrage/invoices/{id}/close"
        actor_role: BillingAdmin
        preconditions:
          - "status IN {ISSUED, ADJUSTED}"
          - "no attached charge has status DISPUTED, else ERR_INVOICE_INVALID_STATE"
        side_effects:
          - "every attached cycle's billing_status moves to SETTLED"
          - "every DECIDED dispute on this invoice moves to CLOSED"
          - "increments Invoice.version by 1"
      - from: ADJUSTED
        to: CLOSED
        trigger: "POST /demurrage/invoices/{id}/close"
        actor_role: BillingAdmin
        preconditions:
          - "no attached charge has status DISPUTED, else ERR_INVOICE_INVALID_STATE"
        side_effects:
          - "the credits become permanent and the cycles move to SETTLED"

  # --- BunchingClaim (fork with divergent side effects) ----------------------
  - entity: BunchingClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: ANALYZED
        trigger: "POST /demurrage/bunching-claims/{id}/analyze"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "status == SUBMITTED"
          - "delivered_car_count >= 1, else ERR_CLAIM_NO_DELIVERIES"
        side_effects:
          - "bunching_attribution runs under the claim's method; baseline_per_day, delivered_car_count, cluster_chargeable_days, exempted_cycle_ids and exempt_days_granted are written"
      - from: ANALYZED
        to: GRANTED
        trigger: "POST /demurrage/bunching-claims/{id}/analyze (same request, fork)"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "exempt_days_granted == cluster_chargeable_days and cluster_chargeable_days > 0"
        side_effects:
          - "every exempted cycle's charge has bunching_exempt_days written, billable_days and gross_amount_cents recomputed from tier 1"
      - from: ANALYZED
        to: PARTIALLY_GRANTED
        trigger: "POST /demurrage/bunching-claims/{id}/analyze (same request, fork)"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "0 < exempt_days_granted < cluster_chargeable_days"
        side_effects:
          - "only the exempted cycles' charges are rewritten; the non-exempted cycles keep their full gross"
      - from: ANALYZED
        to: DENIED
        trigger: "POST /demurrage/bunching-claims/{id}/analyze (same request, fork)"
        actor_role: DemurrageAdjudicator
        preconditions:
          - "exempt_days_granted == 0"
        side_effects:
          - "no charge is touched: exempted_cycle_ids stays empty and every gross_amount_cents is left exactly as it was"

  # --- TariffRuleSet (cyclic via the regulatory challenge) ------------------
  - entity: TariffRuleSet
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /demurrage/tariff-rule-sets/{id}/publish"
        actor_role: RegulatoryOfficer
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "any other TariffRuleSet with the same tariff_code and status PUBLISHED moves to SUPERSEDED"
          - "PlacementCycles already pinned to the superseded rule set keep using it: no cycle is re-rated"
          - "increments TariffRuleSet.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /demurrage/tariff-rule-sets/{id}/publish on a sibling (system side effect)"
        actor_role: RegulatoryOfficer
        preconditions:
          - "another rule set with the same tariff_code was just published"
        side_effects:
          - "the superseded rule set can no longer back a new PlacementCycle, but existing cycles are unaffected"
      - from: PUBLISHED
        to: CHALLENGED
        trigger: "POST /demurrage/regulatory-complaints with complaint_type RULE_REASONABLENESS (system side effect)"
        actor_role: Customer
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "challenge_count increments by 1; the rule set stays in force and may still back new cycles"
      - from: CHALLENGED
        to: PUBLISHED
        trigger: "POST /demurrage/regulatory-complaints/{id}/decide with outcome DECIDED_FOR_RAILROAD or DISMISSED (system side effect)"
        actor_role: RegulatoryOfficer
        preconditions:
          - "status == CHALLENGED and no other complaint still cites this rule set"
        side_effects:
          - "the rule set returns to PUBLISHED with challenge_count preserved, closing the loop"
      - from: CHALLENGED
        to: WITHDRAWN
        trigger: "POST /demurrage/regulatory-complaints/{id}/decide with outcome DECIDED_FOR_CUSTOMER (system side effect)"
        actor_role: RegulatoryOfficer
        preconditions:
          - "status == CHALLENGED"
        side_effects:
          - "the rule set can no longer back a new PlacementCycle, else ERR_TARIFF_WITHDRAWN"
          - "cycles already pinned to it keep their rates: the withdrawal is not retroactive"

  # --- RegulatoryComplaint --------------------------------------------------
  - entity: RegulatoryComplaint
    state_field: status
    initial_state: FILED
    terminal_states: [DECIDED_FOR_CUSTOMER, DECIDED_FOR_RAILROAD, DISMISSED]
    transitions:
      - from: FILED
        to: RAILROAD_ANSWERED
        trigger: "POST /demurrage/regulatory-complaints/{id}/answer"
        actor_role: RailroadAgent
        preconditions:
          - "status == FILED"
        side_effects:
          - "answer_narrative is stored; increments RegulatoryComplaint.version by 1"
      - from: RAILROAD_ANSWERED
        to: DECIDED_FOR_CUSTOMER
        trigger: "POST /demurrage/regulatory-complaints/{id}/decide"
        actor_role: RegulatoryOfficer
        preconditions:
          - "status == RAILROAD_ANSWERED"
          - "ordered_credit_cents <= the escalated dispute's claimed_credit_cents, else ERR_ORDERED_CREDIT_EXCEEDS_CLAIM"
        side_effects:
          - "when complaint_type == RULE_REASONABLENESS, the cited TariffRuleSet moves CHALLENGED -> WITHDRAWN"
          - "the escalated DemurrageDispute stays ESCALATED: the regulator's order does not reopen the railroad's own adjudication"
      - from: RAILROAD_ANSWERED
        to: DECIDED_FOR_RAILROAD
        trigger: "POST /demurrage/regulatory-complaints/{id}/decide"
        actor_role: RegulatoryOfficer
        preconditions:
          - "status == RAILROAD_ANSWERED"
          - "ordered_credit_cents == 0, else ERR_ORDERED_CREDIT_EXCEEDS_CLAIM"
        side_effects:
          - "when complaint_type == RULE_REASONABLENESS, the cited TariffRuleSet moves CHALLENGED -> PUBLISHED"
      - from: RAILROAD_ANSWERED
        to: DISMISSED
        trigger: "POST /demurrage/regulatory-complaints/{id}/decide"
        actor_role: RegulatoryOfficer
        preconditions:
          - "status == RAILROAD_ANSWERED"
          - "ordered_credit_cents == 0, else ERR_ORDERED_CREDIT_EXCEEDS_CLAIM"
        side_effects:
          - "when complaint_type == RULE_REASONABLENESS, the cited TariffRuleSet moves CHALLENGED -> PUBLISHED"

  # --- AverageAgreement (fork with divergent side effects) -------------------
  - entity: AverageAgreement
    state_field: status
    initial_state: OPEN
    terminal_states: [RECONCILED, FORFEITED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /demurrage/average-agreements/{id}/reconcile"
        actor_role: BillingAdmin
        preconditions:
          - "status == OPEN"
          - "net_days >= 0"
        side_effects:
          - "agreement_credit_cents is frozen at the value applied at invoice issue"
          - "increments AverageAgreement.version by 1"
      - from: OPEN
        to: FORFEITED
        trigger: "POST /demurrage/average-agreements/{id}/reconcile"
        actor_role: BillingAdmin
        preconditions:
          - "status == OPEN"
          - "net_days < 0"
        side_effects:
          - "agreement_credit_cents is zeroed and the credit already landed on the month's charges is reversed"
          - "every touched Invoice has agreement_credit_cents, total_credit_cents, total_net_cents and derived status re-derived and version incremented"
          - "Customer.credit_balance_cents is re-derived downward"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Control Table
# -----------------------------------------------------------------------------
concurrency_rules:
  - name: dispute-create-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /demurrage/disputes"
    occ_field: expected_invoice_version
    error_id: ERR_INVOICE_VERSION_STALE
    status_code: 412
    notes: |
      Creating a dispute mutates the parent Invoice's dispute roster, so the
      caller must present the Invoice.version it read. Every successful create
      increments Invoice.version and Invoice.dispute_count by 1, so a second
      create replaying the first request's expected_invoice_version fails with
      412. This is the ONLY sanctioned way to resolve a create race on an
      invoice: there is no locking endpoint and no retry token.

  - name: cycle-create-stale-car
    parent_entity: RailCar
    write_endpoint: "POST /demurrage/placement-cycles"
    occ_field: expected_rail_car_version
    error_id: ERR_RAIL_CAR_VERSION_STALE
    status_code: 412
    notes: |
      A rail car can host only one non-terminal PlacementCycle at a time, so the
      cycle create is a write against the car. The caller presents the
      RailCar.version it read; a successful create increments RailCar.version and
      re-derives RailCar.active_cycle_count. Two agents racing to order the same
      car therefore serialise: the loser gets 412, not a duplicate cycle.
      Note the priority ordering — ERR_RAIL_CAR_VERSION_STALE (priority 44) is
      checked BEFORE the ERR_CAR_CYCLE_OVERLAP interval check (priority 58), so a
      stale reader learns its read is stale rather than being told about the
      overlap it cannot see.

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
# Shared vocabulary used by every rule below:
#   DATE(t)        the UTC calendar date of instant t
#   EOD(d)         the instant d @ 23:59:59.999Z
#   ELIGIBLE(d)    NOT tariff.weekend_excluded OR weekday(d) NOT IN {Sat, Sun}
#   NTH_ELIGIBLE(d0, n)   for n == 0 -> d0; else walk forward one calendar day
#                         at a time from d0, counting only ELIGIBLE dates, and
#                         return the nth one. The result is strictly after d0.
#   BUSINESS(d)    weekday(d) NOT IN {Sat, Sun}   (never tariff-dependent)
#   NTH_BUSINESS(d0, n)   same walk, counting only BUSINESS dates.
# All money is integer cents. All instants are ISO 8601 UTC with exactly three
# fractional digits.
# -----------------------------------------------------------------------------
calculations:

  - name: demurrage_clock_basis_resolution
    algorithm_type: chronological
    trigger: "POST /demurrage/placement-cycles/{id}/constructive-placement, .../notify, .../acknowledge-notification, .../actual-placement, .../refuse"
    inputs:
      - "PlacementCycle.constructive_placement_at (CP)"
      - "PlacementCycle.notification_sent_at (NS), re-derived as the sent_at of the FIRST CarNotification with delivery_status IN {SENT, DELIVERED, ACKNOWLEDGED} ordered by sent_at ASC then created_at ASC"
      - "PlacementCycle.notification_acknowledged_at (ACK)"
      - "PlacementCycle.actual_placement_at (AP)"
      - "RailCar.ownership"
      - "TariffRuleSet.notification_grace_hours (G), free_time_hours_railroad, free_time_hours_private, weekend_excluded"
    formula: |
      # STEP 1 — when the notification becomes legally effective.
      IF Customer.notification_method == FAX:
          NEFF = ACK                       # a fax is effective only on positive acknowledgement
      ELSE:
          NEFF = (NS IS NULL) ? NULL : NS + G hours
      # STEP 2 — the constructive clock cannot start before BOTH the car was
      # held AND the notice was effective.
      CSTART = (NEFF IS NULL) ? NULL : MAX(CP, NEFF)
      # STEP 3 — free days for this car's ownership.
      FREE_DAYS = (RailCar.ownership == PRIVATE)
                  ? free_time_hours_private  / 24        # integer division
                  : free_time_hours_railroad / 24        # RAILROAD_OWNED and PRIVATE_ASSIGNED
      # STEP 4 — the expiry helper.
      EXPIRY(t) = EOD( NTH_ELIGIBLE( DATE(t), FREE_DAYS ) )
      # STEP 5 — elect the basis.
      IF AP IS NULL:
          IF CSTART IS NULL:  RETURN (clock_basis=NONE, clock_start_at=NULL, free_time_expires_at=NULL)
          RETURN (CONSTRUCTIVE, CSTART, EXPIRY(CSTART))
      IF CSTART IS NULL:
          RETURN (ACTUAL, AP, EXPIRY(AP))
      CEXP = EXPIRY(CSTART)
      IF AP <= CEXP:
          # The railroad got the car spotted inside the constructive free time,
          # so the customer is entitled to a fresh clock from actual placement.
          RETURN (ACTUAL, AP, EXPIRY(AP))
      # The railroad blew through the constructive free time; the constructive
      # clock stands and the late spot buys the customer nothing.
      RETURN (CONSTRUCTIVE, CSTART, CEXP)
    constants:
      FREE_DAYS_DIVISOR: 24
    edge_cases:
      - "A FAILED notification never contributes to NS, so a wrong-channel notice leaves clock_basis at NONE."
      - "AP exactly equal to CEXP elects ACTUAL (the comparison is <=, not <)."
      - "AP one millisecond after CEXP elects CONSTRUCTIVE."
      - "A refusal sets AP back to NULL, which flips an ACTUAL basis back to CONSTRUCTIVE and moves free_time_expires_at backwards."
      - "PRIVATE_ASSIGNED takes railroad free time but the private rate ladder: free time and rate ladder are selected by DIFFERENT predicates and must not be collapsed into one branch."
      - "When weekend_excluded is true, NTH_ELIGIBLE skips Saturdays and Sundays, so a Friday clock start with FREE_DAYS 2 expires on the following Tuesday."

  - name: demurrage_chargeable_days
    algorithm_type: chronological
    variants:
      - name: provisional
        when: "the cycle has not been released yet (movement_status IN {CONSTRUCTIVELY_PLACED, ACTUALLY_PLACED}); recomputed on every notify, actual-placement and refuse"
        formula: |
          R = the current logical clock instant
          RELEASE_DAY_CHARGED = FALSE          # today is still running, never charge it
      - name: final
        when: "the cycle has been released (movement_status == RELEASED)"
        formula: |
          R = PlacementCycle.released_at
          RELEASE_DAY_CHARGED = ( TIME_OF_DAY(R) >= Facility.gate_close_hour:00:00.000 )
    trigger: "recomputed on every PlacementCycle transition that changes clock_basis, clock_start_at, free_time_expires_at or released_at"
    inputs:
      - "PlacementCycle.free_time_expires_at (F)"
      - "R and RELEASE_DAY_CHARGED, per the elected variant"
      - "Facility.gate_close_hour"
      - "TariffRuleSet.weekend_excluded"
    formula: |
      IF F IS NULL OR R IS NULL: RETURN chargeable_days = 0
      chargeable_days = 0
      FOR each calendar date d from DATE(F) + 1 day through DATE(R) inclusive:
          IF NOT ELIGIBLE(d): CONTINUE
          IF d < DATE(R):                      chargeable_days += 1
          ELSE IF RELEASE_DAY_CHARGED:         chargeable_days += 1    # d == DATE(R)
      RETURN chargeable_days
      # --- early_release_days, the mirror image, feeds the average agreement ---
      early_release_days = COUNT of dates d with DATE(R) < d <= DATE(F) and ELIGIBLE(d)
      # Exactly one of chargeable_days and early_release_days can be non-zero.
    edge_cases:
      - "A release at gate_close_hour minus one millisecond does NOT charge the release date; a release at exactly gate_close_hour:00:00.000 DOES."
      - "A release on or before DATE(F) yields chargeable_days 0 and a positive early_release_days."
      - "The provisional variant never charges the current logical-clock date, so a provisional charge is always at least one day lighter than a same-instant final charge would be at a late gate hour."
      - "chargeable_days counts DATES, not 24-hour blocks: a car released 30 minutes after midnight on the day after expiry accrues one full day."

  - name: storage_dwell_charge
    algorithm_type: threshold
    variants:
      - name: calendar_midnight
        when: "Facility.storage_clock_mode == CALENDAR_DAY_MIDNIGHT"
        formula: |
          D_FREE = DATE(constructive_placement_at) + (Facility.storage_free_hours / 24) days
          storage_days = COUNT of calendar dates d with D_FREE <= d <= DATE(released_at)
                         AND ( Facility.operates_weekends OR BUSINESS(d) )
      - name: hourly_from_arrival
        when: "Facility.storage_clock_mode == HOURLY_FROM_ARRIVAL"
        formula: |
          DWELL_MS      = released_at - constructive_placement_at, in whole milliseconds
          BILLABLE_MS   = MAX(0, DWELL_MS - Facility.storage_free_hours * 3600000)
          storage_days  = CEIL( BILLABLE_MS / 86400000 )
          # operates_weekends is IGNORED by this variant: the hourly clock never stops.
    trigger: "POST /demurrage/placement-cycles/{id}/release when Facility.kind IN {RAIL_YARD, INTERMODAL_TERMINAL}"
    inputs:
      - "PlacementCycle.constructive_placement_at, PlacementCycle.released_at"
      - "Facility.storage_clock_mode, storage_free_hours, storage_daily_rate_cents, operates_weekends"
    formula: |
      storage_days = per the elected variant
      DemurrageCharge.chargeable_days      = storage_days
      DemurrageCharge.billable_days        = MAX(0, storage_days - bunching_exempt_days)
      DemurrageCharge.gross_amount_cents   = billable_days * Facility.storage_daily_rate_cents
      DemurrageCharge.computation_basis    = STORAGE_CALENDAR or STORAGE_HOURLY
      # STORAGE charges are FLAT-RATE: the tariff's tiered ladder is never applied.
    constants:
      MS_PER_DAY: 86400000
      MS_PER_HOUR: 3600000
    edge_cases:
      - "A dwell of exactly storage_free_hours yields 0 hourly days; one millisecond more yields 1."
      - "The same dwell interval yields a DIFFERENT day count under the two clocks whenever the free period ends mid-week and the interval spans a weekend: CALENDAR skips the weekend when operates_weekends is false, HOURLY never does."
      - "storage_days uses constructive_placement_at as the arrival instant, not clock_start_at: notification timing is irrelevant at a yard."
      - "Under CALENDAR_DAY_MIDNIGHT the free period is measured in whole DATES from the arrival date, so an arrival at 23:59Z burns the same free date as an arrival at 00:01Z the same day."

  - name: tiered_charge_amount
    algorithm_type: tiered_pricing
    trigger: "recomputed whenever DemurrageCharge.chargeable_days or bunching_exempt_days changes"
    inputs:
      - "DemurrageCharge.chargeable_days, DemurrageCharge.bunching_exempt_days"
      - "RailCar.ownership"
      - "TariffRuleSet.tier1_day_count (N1), tier2_day_count (N2) and the six rate fields"
    formula: |
      billable_days = MAX(0, chargeable_days - bunching_exempt_days)
      # Rate ladder is selected by ownership, and PRIVATE_ASSIGNED rides the
      # PRIVATE ladder even though it received RAILROAD free time.
      IF RailCar.ownership == RAILROAD_OWNED:
          (R1, R2, R3) = (tier1_rate_cents_railroad, tier2_rate_cents_railroad, tier3_rate_cents_railroad)
      ELSE:
          (R1, R2, R3) = (tier1_rate_cents_private,  tier2_rate_cents_private,  tier3_rate_cents_private)
      # THE LADDER IS RE-WALKED FROM TIER 1 AFTER THE BUNCHING EXEMPTION.
      # Exempting the first k days does NOT leave the remaining days on the
      # tiers they originally occupied; the survivors slide down the ladder.
      T1 = MIN(billable_days, N1)
      T2 = MIN(MAX(billable_days - N1, 0), N2)
      T3 = MAX(billable_days - N1 - N2, 0)
      gross_amount_cents = T1 * R1 + T2 * R2 + T3 * R3
      net_amount_cents   = gross_amount_cents - credit_applied_cents
      # PER-DAY RATE VECTOR, needed by average_agreement_credit's waterfall:
      RATE_OF_DAY(k) for k in 1..billable_days =
          R1 when k <= N1;  R2 when N1 < k <= N1 + N2;  R3 otherwise
    constants:
      DEFAULT_N1: 2
      DEFAULT_N2: 3
    edge_cases:
      - "billable_days exactly N1 bills entirely at R1; N1 + 1 straddles into R2 for one day only."
      - "billable_days exactly N1 + N2 bills nothing at R3; one more day adds exactly one R3 day."
      - "billable_days 0 yields gross 0 and must not produce a negative amount even when bunching_exempt_days exceeds chargeable_days."
      - "The marginal rate at the tier-3 boundary is roughly 2.8x the tier-1 rate, so the average rate per day is never a usable shortcut."
      - "STORAGE charges bypass this rule entirely and use the facility's flat rate."

  - name: dispute_credit_allocation
    algorithm_type: waterfall_allocation
    trigger: "POST /demurrage/disputes/{id}/decide"
    inputs:
      - "DemurrageDispute.allowance_pct (P), claimed_credit_cents (CAP), scope, demurrage_charge_id, invoice_id"
      - "the target charge set and each target's gross_amount_cents"
    formula: |
      # STEP 1 — resolve the target set, in a DETERMINISTIC order.
      IF scope == SINGLE_CHARGE:
          LINES = [ the charge identified by demurrage_charge_id ]
      ELSE:  # WHOLE_INVOICE
          LINES = every DemurrageCharge with invoice_id == dispute.invoice_id and status == DISPUTED,
                  ordered by its PlacementCycle.released_at ASC, then DemurrageCharge.created_at ASC
      # STEP 2 — round PER LINE, then sum. This is NOT the same number as
      # rounding the sum, and the difference is the point:
      #     CORRECT  : SUM over lines of ROUND_HALF_UP(gross_i * P)
      #     WRONG    : ROUND_HALF_UP( SUM(gross_i) * P )
      # With grosses 47550 and 12550 at P = 0.65 the correct total is 39066 and
      # the naive total is 39065.
      FOR each line i in LINES, in order:
          credit_i = ROUND_HALF_UP( gross_i * P )
          credit_i = MIN(credit_i, gross_i)          # a line can never be over-credited
      TOTAL = SUM(credit_i)
      # STEP 3 — enforce the customer's own claim ceiling with a BACKWARDS
      # waterfall: the excess is scraped off the LAST line first, then the
      # second-to-last, and so on. The earliest-released line keeps its credit.
      IF TOTAL > CAP:
          OVER = TOTAL - CAP
          FOR i from LAST(LINES) down to FIRST(LINES):
              TAKE = MIN(OVER, credit_i)
              credit_i -= TAKE
              OVER -= TAKE
              IF OVER == 0: BREAK
          TOTAL = CAP
      allowed_credit_cents = TOTAL
      # STEP 4 — land the credits.
      FOR each line i: credit_applied_cents = credit_i
                       net_amount_cents     = gross_i - credit_i
                       status = (credit_i > 0) ? ADJUSTED : FINAL
    constants:
      ROUNDING_MODE: ROUND_HALF_UP
      MONEY_UNIT: cents
    edge_cases:
      - "P == 1 (decision ALLOWED) credits each line its full gross and the cap may still bind."
      - "P == 0 (decision DENIED) credits nothing and every line returns to FINAL, not ADJUSTED."
      - "The cap waterfall runs backwards, so which line loses money depends on release order; creating the charges in the opposite order must not change the result."
      - "A single-charge dispute still runs the per-line rounding path, so the two rounding modes agree only by coincidence at one line."
      - "The per-line MIN against gross is applied BEFORE the cap waterfall, so a P above 1 can never manufacture a credit above gross."

  - name: average_agreement_credit
    algorithm_type: aggregation
    trigger: "POST /demurrage/invoices/{id}/issue"
    inputs:
      - "the Invoice's attached charges and their per-day rate vectors"
      - "the Customer's AverageAgreement with status OPEN whose agreement_month equals the YYYY-MM of Invoice.billing_period_start"
      - "PlacementCycle.early_release_days and DemurrageCharge.chargeable_days for the month"
    formula: |
      # STEP 1 — the month's gross.
      TOTAL_GROSS = SUM of gross_amount_cents over the invoice's attached charges with status != VOIDED
      # STEP 2 — find the agreement. No OPEN agreement for the month means no
      # credit at all and agreement_credit_cents stays 0.
      AG = the Customer's OPEN AverageAgreement for the month, or NULL
      IF AG IS NULL: RETURN agreement_credit_cents = 0
      # STEP 3 — the day ledger. Both sides are recomputed from scratch, never
      # incremented, so a voided cycle silently disappears from both.
      AG.credit_days_earned   = SUM of PlacementCycle.early_release_days over the customer's cycles released inside the month
      AG.debit_days_incurred  = SUM of DemurrageCharge.chargeable_days over the customer's charges with status IN {FINAL, ADJUSTED} whose cycle released inside the month
      AG.net_days             = AG.credit_days_earned - AG.debit_days_incurred
      # STEP 4 — you can only spend credit days against days you actually owe.
      CREDIT_DAYS_AVAILABLE = MIN(AG.credit_days_earned, AG.debit_days_incurred)
      # STEP 5 — spend them on the MOST EXPENSIVE days first. Build one entry
      # per billable day across every attached charge, take RATE_OF_DAY(k) from
      # tiered_charge_amount, sort DESC by rate then by DemurrageCharge.created_at
      # ASC then by day index k ASC, and take the first CREDIT_DAYS_AVAILABLE.
      UNCAPPED_CREDIT = SUM of the rates of the taken day-entries
      # STEP 6 — the contractual ceiling, FLOOR not round.
      CREDIT_CAP = FLOOR( TOTAL_GROSS * AG.credit_cap_ratio )
      # STEP 7 — apply.
      AG.agreement_credit_cents        = MIN(UNCAPPED_CREDIT, CREDIT_CAP)
      Invoice.agreement_credit_cents   = AG.agreement_credit_cents
      # STEP 8 — roll up. total_credit_cents also carries dispute credit, which
      # is always 0 at issue time because no charge can be DISPUTED yet.
      Invoice.total_gross_cents  = TOTAL_GROSS
      Invoice.total_credit_cents = SUM of credit_applied_cents over the attached charges
      Invoice.total_net_cents    = Invoice.total_gross_cents - Invoice.total_credit_cents
    constants:
      DEFAULT_CREDIT_CAP_RATIO: 0.30
      CAP_ROUNDING_MODE: FLOOR
    edge_cases:
      - "STEP 4's MIN means a customer who earned 5 credit days but owes only 3 debit days spends 3, and net_days stays positive at 2."
      - "STEP 5's most-expensive-first ordering makes the credit larger than a naive first-day-first waterfall would: it must be sorted DESC by rate, not by day index."
      - "STEP 6 uses FLOOR, so a cap of 14265.0 from 47550 * 0.30 is exact but a cap from 47551 * 0.30 truncates to 14265 rather than rounding to 14265."
      - "A FORFEITED reconcile (net_days < 0) reverses everything this rule applied, which is why agreement_credit_cents is stored on both the agreement and the invoice."
      - "The rule reads chargeable_days, not billable_days, so a bunching exemption reduces the money owed without reducing the debit days incurred."

  - name: bunching_attribution
    algorithm_type: threshold
    variants:
      - name: ordered_vs_capacity
        when: "BunchingClaim.method == ORDERED_VS_CAPACITY"
        formula: |
          baseline_per_day = Customer.normal_daily_placement_capacity
      - name: rolling_average_baseline
        when: "BunchingClaim.method == ROLLING_AVERAGE_BASELINE"
        formula: |
          PRIOR = COUNT of the customer's PlacementCycles with movement_status != VOIDED whose
                  DATE(constructive_placement_at) falls in the 7 calendar dates immediately
                  before DATE(cluster_window_start)
          baseline_per_day = FLOOR( PRIOR / 7 )
          # A customer with no history gets a baseline of 0, so EVERY car in the
          # window is excess. The two variants therefore diverge maximally on a
          # fresh customer.
    trigger: "POST /demurrage/bunching-claims/{id}/analyze"
    inputs:
      - "BunchingClaim.cluster_window_start, cluster_window_end, method"
      - "the customer's PlacementCycles with constructive_placement_at inside the closed window and movement_status != VOIDED"
      - "each such cycle's DemurrageCharge.chargeable_days"
    formula: |
      CLUSTER = the customer's PlacementCycles with movement_status != VOIDED and
                cluster_window_start <= constructive_placement_at <= cluster_window_end
      delivered_car_count    = COUNT(CLUSTER)
      cluster_chargeable_days = SUM of chargeable_days over the CLUSTER's charges
      baseline_per_day        = per the elected variant
      exempted = []            # ordered
      FOR each UTC date d in DATE(cluster_window_start) .. DATE(cluster_window_end), ascending:
          ARRIVALS_d = the CLUSTER cycles with DATE(constructive_placement_at) == d,
                       ordered by constructive_placement_at ASC then created_at ASC
          EXCESS_d   = MAX(0, COUNT(ARRIVALS_d) - baseline_per_day)
          # The customer is presumed able to absorb the FIRST baseline_per_day
          # cars of the day, so the exempted cars are the LAST EXCESS_d arrivals.
          APPEND the last EXCESS_d entries of ARRIVALS_d to exempted
      exempted_cycle_ids = the ids of exempted, in that order
      # Exemption grows with position in the cluster: the kth exempted car
      # (1-based over exempted_cycle_ids) is forgiven k days, capped by what it
      # actually accrued.
      exempt_days_granted = 0
      FOR k, cycle in ENUMERATE(exempted, starting at 1):
          E = MIN(k, cycle.charge.chargeable_days)
          cycle.charge.bunching_exempt_days = E
          re-run tiered_charge_amount on cycle.charge
          exempt_days_granted += E
      status = (exempt_days_granted == 0)                     ? DENIED
             : (exempt_days_granted == cluster_chargeable_days) ? GRANTED
             :                                                   PARTIALLY_GRANTED
    constants:
      ROLLING_WINDOW_DAYS: 7
      BASELINE_ROUNDING_MODE: FLOOR
    edge_cases:
      - "Three cars arriving on one date against a capacity of exactly 3 yields EXCESS 0, exempted_cycle_ids empty and status DENIED — the claim is analysed and refused, and no charge is touched."
      - "The same three cars under ROLLING_AVERAGE_BASELINE with no prior history yield baseline 0, all three exempted, and 1 + 2 + 3 = 6 exempt days."
      - "Exemption is applied to the LAST arrivals of each date, so the ordering inside a date is load-bearing and a tie on constructive_placement_at falls back to created_at."
      - "Re-laddering means forgiving one day off a 14-day charge removes a tier-3 day, not a tier-1 day, so the money removed per exempt day shrinks as more days are exempted."
      - "A cycle whose charge accrued fewer days than its rank k is capped at what it accrued, so exempt_days_granted can be less than 1 + 2 + ... + n."

  - name: adjudication_timeline
    algorithm_type: weighted_scoring
    trigger: "POST /demurrage/disputes/{id}/submit, .../request-info, .../appeal"
    inputs:
      - "DemurrageDispute.submitted_at, grounds, round_number"
      - "DemurrageDispute.evidence_weight = SUM of DisputeEvidence.weight_points"
      - "TariffRuleSet.adjudication_days_base (BASE) from the disputed charges' pinned rule set"
    formula: |
      EVIDENCE_WEIGHT = { SWITCH_LIST: 3, GATE_LOG: 3, EMAIL_NOTICE: 1,
                          TRACK_EMBARGO_NOTICE: 4, WEIGHT_CERTIFICATE: 2 }
      GROUNDS_MULTIPLIER = { RAILROAD_CAUSED_DELAY: 1.00, BUNCHING: 1.25,
                             NOTIFICATION_FAILURE: 0.75, RATE_UNREASONABLE: 1.50,
                             CLOCK_BASIS_ERROR: 1.00 }
      W = SUM of EVIDENCE_WEIGHT over this dispute's evidence rows
      # Better-evidenced disputes are decided FASTER: the weight is a
      # SUBTRACTION, capped at 5 days, and it is floor-halved first.
      IF round_number == 1:
          DAYS = MAX(5, CEIL(BASE * GROUNDS_MULTIPLIER[grounds]) - MIN(5, FLOOR(W / 2)))
      ELSE:   # the appeal round is fixed and ignores evidence entirely
          DAYS = MAX(5, CEIL(BASE * APPEAL_MULTIPLIER))
      adjudication_due_at = EOD( NTH_BUSINESS( DATE(submitted_at), DAYS ) )
      # An information request REPLACES the deadline outright rather than
      # extending the original one:
      ON request-info:  adjudication_due_at = EOD( NTH_BUSINESS( DATE(current logical clock), INFO_REQUEST_DAYS ) )
    constants:
      APPEAL_MULTIPLIER: 0.50
      INFO_REQUEST_DAYS: 10
      MIN_ADJUDICATION_DAYS: 5
      WEIGHT_CREDIT_CAP_DAYS: 5
      WEIGHT_HALVING_MODE: FLOOR
    edge_cases:
      - "NTH_BUSINESS uses Mon-Fri unconditionally and is NOT affected by TariffRuleSet.weekend_excluded; the two calendars must not be conflated."
      - "W == 10 gives FLOOR(10/2) == 5, exactly hitting the credit cap; W == 12 gives 6 but is still capped at 5, so more evidence past that point buys nothing."
      - "W == 1 gives FLOOR(1/2) == 0, so a single EMAIL_NOTICE buys no time at all."
      - "NOTIFICATION_FAILURE with BASE 20 gives CEIL(15.0) == 15 before any weight credit; the multiplier is applied before the subtraction, never after."
      - "The MAX(5, ...) floor binds only for a very low BASE, but it must still be implemented: BASE 5 with weight 10 would otherwise yield 0 days."
      - "The appeal recomputation starts from the APPEAL date, not the original submitted_at, because appeal refreshes submitted_at."

  - name: invoice_rollup_and_status_derivation
    algorithm_type: aggregation
    trigger: "POST /demurrage/invoices/{id}/issue, .../close, POST /demurrage/disputes/{id}/submit|decide|appeal, POST /demurrage/placement-cycles/{id}/void, POST /demurrage/average-agreements/{id}/reconcile"
    inputs:
      - "every DemurrageCharge with invoice_id == this Invoice.id"
      - "Invoice.status, the logical clock at issue time"
    formula: |
      LIVE = the invoice's charges with status != VOIDED
      attached_charge_count = COUNT(LIVE)
      total_gross_cents     = SUM of gross_amount_cents  over LIVE
      total_credit_cents    = SUM of credit_applied_cents over LIVE
      total_net_cents       = total_gross_cents - total_credit_cents
      dispute_count         = COUNT of DemurrageDispute rows with invoice_id == this Invoice.id
      # THE MONEY INVARIANT, which must hold after EVERY transition above:
      #     total_net_cents + total_credit_cents == total_gross_cents
      # --- compound status derivation, evaluated in this exact order ---
      IF status == DRAFT:   status stays DRAFT
      ELSE IF status == CLOSED: status stays CLOSED
      ELSE IF any charge in LIVE has status == DISPUTED:            status = PARTIALLY_DISPUTED
      ELSE IF any charge in LIVE has credit_applied_cents > 0:      status = ADJUSTED
      ELSE:                                                        status = ISSUED
      # --- the dispute window, set once at issue and never moved ---
      ON issue: dispute_deadline_at = EOD( DATE(current logical clock) + DISPUTE_WINDOW_DAYS calendar days )
      # DISPUTE_WINDOW_DAYS is CALENDAR days, not business days and not eligible
      # days: three different day calendars coexist in this domain.
    constants:
      DISPUTE_WINDOW_DAYS: 30
    edge_cases:
      - "The derivation is re-run, never patched: a DENIED decision on the only disputed charge takes the invoice from PARTIALLY_DISPUTED all the way back to ISSUED."
      - "A partially credited invoice whose remaining charge is appealed goes ADJUSTED -> PARTIALLY_DISPUTED even though a credit is still recorded, because the DISPUTED check comes first."
      - "Voiding the only credited charge drops total_credit_cents to 0 and re-derives ISSUED from ADJUSTED."
      - "dispute_deadline_at is derived from the logical clock at issue time, not from billing_period_end, so re-issuing at a different clock would move it — which is why issue is one-way."
      - "total_gross_cents is an INVARIANT of the dispute lifecycle: submit, decide, appeal and re-decide must all leave it untouched."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table
# -----------------------------------------------------------------------------
# Every endpoint evaluates these in ascending `priority`. The FIRST rule whose
# condition holds wins and short-circuits the rest; no endpoint ever reports two
# violations. Ties inside one priority cannot occur because no two rules at the
# same priority are reachable from the same request.
# -----------------------------------------------------------------------------
validations:

  # --- 10-19 authentication -------------------------------------------------
  - rule: "X-Role-Name header present and one of Customer, RailroadAgent, DemurrageAdjudicator, RegulatoryOfficer, BillingAdmin"
    applies_to: "all endpoints"
    category: auth
    priority: 10
    error_id: ERR_UNAUTHENTICATED
    status_code: 401
    notes: "A missing, empty-string or unrecognised role name fails here, BEFORE any path parameter is resolved, so an unauthenticated request to a non-existent id returns 401 and not 404."
  - rule: "X-User-ID header present and non-empty on every endpoint whose actor role is Customer or DemurrageAdjudicator"
    applies_to: "all Customer-role and DemurrageAdjudicator-role endpoints"
    category: auth
    priority: 12
    error_id: ERR_UNAUTHENTICATED
    status_code: 401
    notes: "Customer identity resolution and segregation of duties both need the user id, so its absence is an authentication failure rather than a schema failure."

  # --- 20-29 authorization --------------------------------------------------
  - rule: "the caller's X-Role-Name is listed in the endpoint's roles"
    applies_to: "all endpoints"
    category: role
    priority: 20
    error_id: ERR_ROLE_FORBIDDEN
    status_code: 403
    notes: "Checked before existence, so a RailroadAgent hitting POST /demurrage/invoices with a bogus customer_id gets 403 and learns nothing about the id."
  - rule: "when X-Role-Name is Customer, X-User-ID resolves to a Customer whose id owns the addressed resource"
    applies_to: "every endpoint reachable by the Customer role that addresses a resource"
    category: ownership
    priority: 22
    error_id: ERR_NOT_RESOURCE_OWNER
    status_code: 403
    notes: |
      Ownership resolution path per resource: PlacementCycle -> customer_id;
      CarNotification -> its cycle's customer_id; DemurrageCharge -> its cycle's
      customer_id; Invoice -> customer_id; DemurrageDispute -> customer_id;
      DisputeEvidence -> its dispute's customer_id; BunchingClaim -> customer_id;
      AverageAgreement -> customer_id; RegulatoryComplaint -> its dispute's
      customer_id. Customer-role LIST endpoints are silently scoped to the
      caller instead of erroring.
  - rule: "on a round-2 dispute action the caller's X-User-ID differs from DemurrageDispute.first_level_adjudicator_id"
    applies_to: "POST /demurrage/disputes/{id}/begin-review, POST /demurrage/disputes/{id}/decide"
    category: ownership
    priority: 24
    error_id: ERR_SEGREGATION_OF_DUTIES
    status_code: 403
    notes: "The bar is on the FIRST-LEVEL adjudicator only; a third adjudicator who never touched round 1 may take the appeal, and the round-1 adjudicator is free to work any other dispute."

  # --- 30-39 existence and schema ------------------------------------------
  - rule: "every id in the path resolves to an existing row"
    applies_to: "all endpoints with a path parameter"
    category: existence
    priority: 30
    error_id: "the addressed entity's *_NOT_FOUND code"
    status_code: 404
    notes: "Resolved left to right along the path."
  - rule: "every foreign key in the request body resolves to an existing row"
    applies_to: "POST /demurrage/placement-cycles, POST /demurrage/invoices, POST /demurrage/average-agreements, POST /demurrage/bunching-claims, POST /demurrage/disputes, POST /demurrage/regulatory-complaints"
    category: existence
    priority: 32
    error_id: "the referenced entity's *_NOT_FOUND code"
    status_code: 404
    notes: "Body foreign keys are resolved in declaration order, so a request with two bad ids reports the first one declared in §1.5's input list."
  - rule: "request body satisfies the endpoint's declared field types, enum members, string lengths, numeric ranges and required-field set"
    applies_to: "all endpoints with a request body"
    category: schema
    priority: 34
    error_id: ERR_INVALID_REQUEST
    status_code: 400
    notes: "Includes: unknown enum members; a non-integer where cents are expected; an ISO 8601 instant without a Z suffix; agreement_month not matching ^[0-9]{4}-(0[1-9]|1[0-2])$; credit_cap_ratio outside (0, 1]; a hyphen-free customer_code is fine but a lowercase one is not."
  - rule: "limit is an integer in 1..100 and offset is an integer >= 0"
    applies_to: "all list endpoints"
    category: schema
    priority: 36
    error_id: ERR_INVALID_PAGINATION
    status_code: 400
    notes: "limit 0, limit 101 and offset -1 each fail here; omitting both applies limit 10 / offset 0."

  # --- 40-49 state and concurrency -----------------------------------------
  - rule: "the addressed entity is in a state from which the requested transition exists"
    applies_to: "all action endpoints"
    category: state
    priority: 40
    error_id: "the addressed entity's *_INVALID_STATE code, or ERR_INVALID_MOVEMENT_STATE for a PlacementCycle movement action"
    status_code: 409
    notes: "This sits ABOVE the temporal and fiscal bands, so a CLOSED invoice reports ERR_INVOICE_NOT_DISPUTABLE even when the dispute window has also expired."
  - rule: "the presented expected_<parent>_version equals the parent's current version"
    applies_to: "POST /demurrage/disputes, POST /demurrage/placement-cycles"
    category: concurrency
    priority: 44
    error_id: "the rule's error_id from §1.2.1"
    status_code: 412
    notes: "Deliberately below existence and state and above every business rule: a stale reader is told its read is stale before being told about a conflict it could not have seen."

  # --- 50-59 business safety, referential integrity and constraints --------
  - rule: "Facility.access_mode is not EMBARGOED"
    applies_to: "POST /demurrage/placement-cycles/{id}/release, POST /demurrage/placement-cycles/{id}/constructive-placement"
    category: business_safety
    priority: 50
    error_id: ERR_FACILITY_EMBARGOED
    status_code: 409
    notes: "Physical safety outranks money: an embargoed track blocks release even when the customer is also on credit hold."
  - rule: "Facility.access_mode is OPEN"
    applies_to: "POST /demurrage/placement-cycles/{id}/actual-placement"
    category: business_safety
    priority: 52
    error_id: ERR_FACILITY_NOT_OPEN
    status_code: 409
    notes: "GATE_CONTROLLED permits release but not a new spot, so this rule is strictly narrower than the EMBARGOED rule above it."
  - rule: "the cycle's TariffRuleSet.status is not WITHDRAWN and its car_ownership_scope covers the car's ownership"
    applies_to: "POST /demurrage/placement-cycles, POST /demurrage/placement-cycles/{id}/constructive-placement"
    category: business_referential
    priority: 54
    error_id: "ERR_TARIFF_WITHDRAWN, else ERR_TARIFF_SCOPE_MISMATCH, else ERR_TARIFF_NOT_PUBLISHED"
    status_code: 422
    notes: "Evaluated in that order. A DRAFT or SUPERSEDED rule set yields ERR_TARIFF_NOT_PUBLISHED; a CHALLENGED one passes because a challenge does not suspend the tariff."
  - rule: "the disputed charge belongs to the disputed invoice, and the dispute's scope matches the presence of demurrage_charge_id"
    applies_to: "POST /demurrage/disputes"
    category: business_referential
    priority: 56
    error_id: "ERR_DISPUTE_SCOPE_MISMATCH when scope and demurrage_charge_id disagree, else ERR_CHARGE_INVOICE_MISMATCH"
    status_code: 422
    notes: "SINGLE_CHARGE requires demurrage_charge_id; WHOLE_INVOICE requires its absence. Also covers the RULE_REASONABLENESS / tariff_rule_set_id pairing on regulatory complaints and the BUNCHING / bunching_claim_id pairing."
  - rule: "the rail car has no other PlacementCycle whose half-open occupation interval [clock reference, released_at) overlaps this one"
    applies_to: "POST /demurrage/placement-cycles"
    category: business_constraint
    priority: 58
    error_id: ERR_CAR_CYCLE_OVERLAP
    status_code: 409
    notes: |
      A cycle's occupation interval is [created_at, released_at) for a RELEASED
      cycle and [created_at, +infinity) for any other non-VOIDED cycle, where
      created_at is the logical clock at creation. The interval is HALF-OPEN at
      the upper end: creating a new cycle for the same car with the clock set to
      exactly the prior cycle's released_at succeeds, and one millisecond earlier
      fails. A VOIDED cycle occupies no interval at all.
  - rule: "the facility has spare capacity and its switch buffer has elapsed"
    applies_to: "POST /demurrage/placement-cycles/{id}/actual-placement"
    category: business_constraint
    priority: 60
    error_id: "ERR_FACILITY_SPOT_UNAVAILABLE when occupied_spot_count >= car_spot_capacity, else ERR_FACILITY_SWITCH_BUFFER"
    status_code: 409
    notes: "An AGGREGATE check: each car is individually placeable but the collective exceeds car_spot_capacity. Capacity is tested first because a full track makes the buffer moot."
  - rule: "the per-entity attempt counters have not been exhausted"
    applies_to: "POST /demurrage/placement-cycles/{id}/refuse, POST /demurrage/disputes/{id}/request-info, POST /demurrage/disputes/{id}/appeal"
    category: business_constraint
    priority: 61
    error_id: "ERR_REFUSAL_LIMIT, ERR_INFO_REQUEST_LIMIT, ERR_APPEAL_LIMIT respectively"
    status_code: 409
    notes: "Each limit is 2 attempts, so the third refusal, the third information request and the second appeal are the failing calls."

  # --- 62-69 temporal ------------------------------------------------------
  - rule: "the current logical clock is at or before Invoice.dispute_deadline_at"
    applies_to: "POST /demurrage/disputes/{id}/submit"
    category: business_temporal
    priority: 62
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    status_code: 422
    notes: "Sits below the state band, so a CLOSED invoice past its deadline reports the state error, not this one."
  - rule: "event instants are chronologically consistent with the instants already recorded on the cycle"
    applies_to: "POST /demurrage/placement-cycles/{id}/constructive-placement, .../notify, .../acknowledge-notification, .../actual-placement, .../release"
    category: business_temporal
    priority: 64
    error_id: ERR_NON_CHRONOLOGICAL_EVENT
    status_code: 422
    notes: |
      actual_placement_at >= constructive_placement_at; released_at >=
      actual_placement_at at an INDUSTRY_TRACK and >= constructive_placement_at
      at a yard or terminal; a notification's sent_at >= constructive_placement_at;
      an acknowledgement's ack_at >= the selected notification's sent_at. These
      compare recorded instants to each other and NEVER to the logical clock, so
      back-dating a whole cycle is legal.
  - rule: "cluster_window_start <= cluster_window_end, the window spans at most 14 calendar dates, and billing_period_start <= billing_period_end"
    applies_to: "POST /demurrage/bunching-claims, POST /demurrage/invoices"
    category: business_temporal
    priority: 65
    error_id: ERR_INVALID_CLUSTER_WINDOW
    status_code: 422
    notes: "Also used for the invoice period; an inverted period reports the same code."
  - rule: "the customer has no other BunchingClaim in status GRANTED or PARTIALLY_GRANTED whose window overlaps this one"
    applies_to: "POST /demurrage/bunching-claims"
    category: business_temporal
    priority: 66
    error_id: ERR_CLUSTER_WINDOW_OVERLAP
    status_code: 409
    notes: "A DENIED or still-SUBMITTED claim does not block a fresh window, so a customer may re-file after a denial. Windows are CLOSED intervals, so sharing a single endpoint date is an overlap."
  - rule: "the customer has no other AverageAgreement in status OPEN for the same agreement_month"
    applies_to: "POST /demurrage/average-agreements"
    category: business_temporal
    priority: 68
    error_id: ERR_DUPLICATE_AGREEMENT_MONTH
    status_code: 409
    notes: "A RECONCILED or FORFEITED agreement for the month does not block a new one."

  # --- 70-79 fiscal --------------------------------------------------------
  - rule: "Customer.billing_posture is CURRENT"
    applies_to: "POST /demurrage/placement-cycles/{id}/release"
    category: business_fiscal
    priority: 70
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    status_code: 402
    notes: "The lowest band in the ladder, so it only ever surfaces when the facility is releasable and every other check has passed."
  - rule: "the invoice has at least one non-voided attached charge, and the dispute's evidence set is non-empty"
    applies_to: "POST /demurrage/invoices/{id}/issue, POST /demurrage/disputes/{id}/submit, POST /demurrage/disputes/{id}/resubmit"
    category: business_fiscal
    priority: 72
    error_id: "ERR_INVOICE_NO_CHARGES, else ERR_DISPUTE_NO_EVIDENCE"
    status_code: 422
    notes: "A resubmit needs at least one evidence row created after the information request, not merely one row overall."
  - rule: "claimed_credit_cents does not exceed the gross of the dispute's target set, and ordered_credit_cents does not exceed the escalated dispute's claimed_credit_cents"
    applies_to: "POST /demurrage/disputes, POST /demurrage/regulatory-complaints/{id}/decide"
    category: business_fiscal
    priority: 74
    error_id: "ERR_CLAIM_EXCEEDS_CHARGE, else ERR_ORDERED_CREDIT_EXCEEDS_CLAIM"
    status_code: 422
    notes: "At create time the target set is resolved from scope: SINGLE_CHARGE compares against that one charge's gross, WHOLE_INVOICE against Invoice.total_gross_cents."
  - rule: "allowance_pct agrees with decision, and the dispute's grounds prerequisites are satisfied"
    applies_to: "POST /demurrage/disputes/{id}/decide, POST /demurrage/disputes/{id}/submit"
    category: business_fiscal
    priority: 76
    error_id: "ERR_ALLOWANCE_PCT_MISMATCH, else ERR_BUNCHING_CLAIM_NOT_GRANTED"
    status_code: 422
    notes: "ALLOWED demands allowance_pct exactly 1, DENIED exactly 0, PARTIALLY_ALLOWED strictly between. A BUNCHING dispute demands a GRANTED or PARTIALLY_GRANTED claim at submit time, not at create time."
  - rule: "the escalated dispute is DECIDED with round_number >= 2, and at least one delivery exists in an analysed cluster"
    applies_to: "POST /demurrage/regulatory-complaints, POST /demurrage/bunching-claims/{id}/analyze"
    category: business_fiscal
    priority: 78
    error_id: "ERR_APPEAL_NOT_EXHAUSTED, else ERR_CLAIM_NO_DELIVERIES"
    status_code: 422
    notes: "ERR_DISPUTE_INVALID_STATE at priority 40 fires first when the dispute is not DECIDED at all; ERR_APPEAL_NOT_EXHAUSTED is reserved for a DECIDED dispute that never went to appeal."
  - rule: "a notification is available to acknowledge"
    applies_to: "POST /demurrage/placement-cycles/{id}/acknowledge-notification"
    category: business_fiscal
    priority: 79
    error_id: ERR_NO_PENDING_NOTIFICATION
    status_code: 422
    notes: "The acknowledgement selector takes the notification with delivery_status IN {SENT, DELIVERED} and the greatest sent_at, tie-broken by the greatest created_at; a cycle whose only notice is FAILED or already ACKNOWLEDGED has nothing to acknowledge."

# -----------------------------------------------------------------------------
# §1.5 Endpoint Table
# -----------------------------------------------------------------------------
# Conventions honoured throughout:
#   * every single-resource path parameter is literally {id};
#   * a `?` suffix in `input` marks an optional field;
#   * list endpoints accept limit? and offset? and return the four pagination
#     fields alongside the array;
#   * no PATCH or DELETE exists anywhere: every mutation is a named action.
# -----------------------------------------------------------------------------
endpoints:

  # --- test-driving logical clock ------------------------------------------
  - method: POST
    path: /demurrage/_clock/set_current_utc
    roles: [BillingAdmin]
    input: [to_iso8601]
    output: { current_utc: string }
    status: 200
    side_effects:
      - "sets the server's logical clock, which every subsequent request reads as 'now'"
      - "the clock defaults to 2026-08-01T00:00:00Z on a cold start and moves only through this endpoint"
      - "moving the clock never recomputes anything retroactively"

  # --- Customer -------------------------------------------------------------
  - method: POST
    path: /demurrage/customers
    roles: [BillingAdmin]
    input: ["customer_code", "name", "serving_station_code", "notification_method?", "normal_daily_placement_capacity?"]
    output: Customer
    status: 201
    side_effects:
      - "status ACTIVE, billing_posture CURRENT, dispute_posture CLEAR, credit_balance_cents 0"
  - method: GET
    path: /demurrage/customers/{id}
    roles: [Customer, RailroadAgent, DemurrageAdjudicator, RegulatoryOfficer, BillingAdmin]
    input: []
    output: Customer
    status: 200
    side_effects: []
  - method: POST
    path: /demurrage/customers/{id}/credit-hold
    roles: [BillingAdmin]
    input: [on_hold, reason]
    output: Customer
    status: 200
    side_effects:
      - "sets billing_posture to CREDIT_HOLD when on_hold is true, else back to CURRENT"
      - "sets credit_hold_reason, or clears it to null when released"
      - "increments Customer.version by 1"
      - "does NOT touch any cycle already RELEASED: the hold is prospective only"
  - method: GET
    path: /demurrage/customers/{id}/average-agreements
    roles: [Customer, BillingAdmin]
    input: ["status?", "limit?", "offset?"]
    output: AverageAgreement[]
    status: 200
    side_effects: []
  - method: GET
    path: /demurrage/customers/{id}/bunching-claims
    roles: [Customer, DemurrageAdjudicator, BillingAdmin]
    input: ["status?", "limit?", "offset?"]
    output: BunchingClaim[]
    status: 200
    side_effects: []

  # --- TariffRuleSet --------------------------------------------------------
  - method: POST
    path: /demurrage/tariff-rule-sets
    roles: [RegulatoryOfficer]
    input: ["tariff_code", "car_ownership_scope?", "free_time_hours_railroad?", "free_time_hours_private?", "tier1_day_count?", "tier1_rate_cents_railroad?", "tier1_rate_cents_private?", "tier2_day_count?", "tier2_rate_cents_railroad?", "tier2_rate_cents_private?", "tier3_rate_cents_railroad?", "tier3_rate_cents_private?", "weekend_excluded?", "notification_grace_hours?", "adjudication_days_base?"]
    output: TariffRuleSet
    status: 201
    side_effects:
      - "status DRAFT; every omitted rate or threshold takes its §1.1 default"
  - method: GET
    path: /demurrage/tariff-rule-sets/{id}
    roles: [Customer, RailroadAgent, DemurrageAdjudicator, RegulatoryOfficer, BillingAdmin]
    input: []
    output: TariffRuleSet
    status: 200
    side_effects: []
  - method: POST
    path: /demurrage/tariff-rule-sets/{id}/publish
    roles: [RegulatoryOfficer]
    input: []
    output: TariffRuleSet
    status: 200
    side_effects:
      - "status DRAFT -> PUBLISHED"
      - "any sibling rule set with the same tariff_code and status PUBLISHED moves to SUPERSEDED and its version increments by 1"
      - "already-created PlacementCycles keep their pinned rule set and are never re-rated"
      - "increments TariffRuleSet.version by 1"

  # --- Facility -------------------------------------------------------------
  - method: POST
    path: /demurrage/facilities
    roles: [BillingAdmin]
    input: ["facility_code", "kind?", "storage_clock_mode?", "gate_open_hour?", "gate_close_hour?", "car_spot_capacity?", "switch_buffer_minutes?", "storage_free_hours?", "storage_daily_rate_cents?", "operates_weekends?"]
    output: Facility
    status: 201
    side_effects:
      - "access_mode OPEN, occupied_spot_count 0, last_switch_at null"
  - method: POST
    path: /demurrage/facilities/{id}/access-mode
    roles: [RailroadAgent]
    input: [access_mode, reason]
    output: Facility
    status: 200
    side_effects:
      - "sets access_mode and access_mode_reason"
      - "increments Facility.version by 1"
      - "cars already ACTUALLY_PLACED stay placed: an embargo blocks new movements, it does not evict"

  # --- RailCar --------------------------------------------------------------
  - method: POST
    path: /demurrage/rail-cars
    roles: [RailroadAgent]
    input: ["car_mark", "ownership", "car_type?", "capacity_tons?"]
    output: RailCar
    status: 201
    side_effects:
      - "active_cycle_count 0, version 1"
  - method: GET
    path: /demurrage/rail-cars/{id}
    roles: [Customer, RailroadAgent, BillingAdmin]
    input: []
    output: RailCar
    status: 200
    side_effects: []

  # --- PlacementCycle -------------------------------------------------------
  - method: POST
    path: /demurrage/placement-cycles
    roles: [RailroadAgent]
    input: [customer_id, rail_car_id, facility_id, tariff_rule_set_id, waybill_number, expected_rail_car_version]
    output: PlacementCycle
    status: 201
    side_effects:
      - "movement_status ORDERED, billing_status UNBILLED, clock_basis NONE, refusal_count 0"
      - "OCC: expected_rail_car_version must equal the current RailCar.version, else ERR_RAIL_CAR_VERSION_STALE (412)"
      - "increments RailCar.version by 1 and re-derives RailCar.active_cycle_count"
      - "no DemurrageCharge exists yet: the charge is born at constructive placement"
  - method: GET
    path: /demurrage/placement-cycles/{id}
    roles: [Customer, RailroadAgent, DemurrageAdjudicator, BillingAdmin]
    input: []
    output: PlacementCycle
    status: 200
    side_effects: []
  - method: GET
    path: /demurrage/placement-cycles
    roles: [Customer, RailroadAgent, DemurrageAdjudicator, BillingAdmin]
    input: ["customer_id?", "rail_car_id?", "facility_id?", "tariff_rule_set_id?", "movement_status?", "billing_status?", "limit?", "offset?"]
    output: PlacementCycle[]
    status: 200
    side_effects:
      - "a Customer-role caller is silently scoped to its own cycles regardless of the customer_id filter"
      - "ordered by created_at ASC then id ASC so offset paging is stable"
  - method: POST
    path: /demurrage/placement-cycles/{id}/constructive-placement
    roles: [RailroadAgent]
    input: [constructive_placement_at, reason_code]
    output: PlacementCycle
    status: 200
    side_effects:
      - "movement_status ORDERED -> CONSTRUCTIVELY_PLACED"
      - "creates the cycle's DemurrageCharge in status PROVISIONAL with charge_kind DEMURRAGE, DETENTION or STORAGE per facility kind and car ownership"
      - "re-runs demurrage_clock_basis_resolution (clock_basis stays NONE until a notice lands)"
      - "increments PlacementCycle.version by 1"
  - method: POST
    path: /demurrage/placement-cycles/{id}/notify
    roles: [RailroadAgent]
    input: [channel, sent_at]
    output: CarNotification
    status: 201
    side_effects:
      - "creates a CarNotification with sequence_number and a derived delivery_status of FAILED, SENT or DELIVERED"
      - "re-derives PlacementCycle.notification_sent_at, then re-runs demurrage_clock_basis_resolution"
      - "recomputes the PROVISIONAL charge under the provisional variant"
      - "increments PlacementCycle.version by 1"
  - method: GET
    path: /demurrage/placement-cycles/{id}/notifications
    roles: [Customer, RailroadAgent, DemurrageAdjudicator]
    input: ["delivery_status?", "limit?", "offset?"]
    output: CarNotification[]
    status: 200
    side_effects: []
  - method: POST
    path: /demurrage/placement-cycles/{id}/acknowledge-notification
    roles: [Customer]
    input: [ack_at]
    output: CarNotification
    status: 200
    side_effects:
      - "selects the notification with delivery_status IN {SENT, DELIVERED} and the greatest sent_at, tie-broken by the greatest created_at"
      - "moves it to ACKNOWLEDGED and sets acknowledged_at"
      - "re-derives PlacementCycle.notification_acknowledged_at, then re-runs demurrage_clock_basis_resolution — which is what finally starts a FAX customer's clock"
      - "increments PlacementCycle.version by 1"
  - method: POST
    path: /demurrage/placement-cycles/{id}/actual-placement
    roles: [RailroadAgent]
    input: [actual_placement_at]
    output: PlacementCycle
    status: 200
    side_effects:
      - "movement_status CONSTRUCTIVELY_PLACED -> ACTUALLY_PLACED"
      - "re-runs demurrage_clock_basis_resolution, which may flip clock_basis from CONSTRUCTIVE to ACTUAL and move free_time_expires_at forward"
      - "re-derives Facility.occupied_spot_count and Facility.last_switch_at"
      - "recomputes the PROVISIONAL charge"
      - "increments PlacementCycle.version by 1"
  - method: POST
    path: /demurrage/placement-cycles/{id}/refuse
    roles: [Customer]
    input: [refusal_reason]
    output: PlacementCycle
    status: 200
    side_effects:
      - "movement_status ACTUALLY_PLACED -> CONSTRUCTIVELY_PLACED and actual_placement_at back to null"
      - "increments refusal_count by 1; the third refusal is refused with ERR_REFUSAL_LIMIT"
      - "re-runs demurrage_clock_basis_resolution, reverting clock_basis to CONSTRUCTIVE"
      - "re-derives Facility.occupied_spot_count downward"
      - "increments PlacementCycle.version by 1"
  - method: POST
    path: /demurrage/placement-cycles/{id}/release
    roles: [Customer]
    input: [released_at]
    output: PlacementCycle
    status: 200
    side_effects:
      - "movement_status -> RELEASED from either ACTUALLY_PLACED or, at a yard or terminal, CONSTRUCTIVELY_PLACED"
      - "finalises chargeable_days and early_release_days on the cycle"
      - "the cycle's DemurrageCharge moves PROVISIONAL -> FINAL, recomputed by tiered_charge_amount or storage_dwell_charge"
      - "the Customer's OPEN AverageAgreement for the release month has credit_days_earned, debit_days_incurred and net_days re-derived and its version incremented"
      - "re-derives Facility.occupied_spot_count and Facility.last_switch_at"
      - "increments PlacementCycle.version by 1"
  - method: POST
    path: /demurrage/placement-cycles/{id}/void
    roles: [BillingAdmin]
    input: [void_reason]
    output: PlacementCycle
    status: 200
    side_effects:
      - "movement_status -> VOIDED from ORDERED or RELEASED only"
      - "the cycle's DemurrageCharge moves to VOIDED and leaves every aggregate"
      - "the attached Invoice's attached_charge_count, total_gross_cents, total_credit_cents, total_net_cents and derived status are re-derived and its version incremented"
      - "the Customer's OPEN AverageAgreement day counts and Customer.credit_balance_cents are re-derived"
      - "re-derives RailCar.active_cycle_count, freeing the car"
      - "increments PlacementCycle.version by 1"

  # --- DemurrageCharge (read-only; charges are never created directly) ------
  - method: GET
    path: /demurrage/charges/{id}
    roles: [Customer, DemurrageAdjudicator, RegulatoryOfficer, BillingAdmin]
    input: []
    output: DemurrageCharge
    status: 200
    side_effects: []
  - method: GET
    path: /demurrage/charges
    roles: [Customer, DemurrageAdjudicator, BillingAdmin]
    input: ["placement_cycle_id?", "invoice_id?", "charge_kind?", "status?", "limit?", "offset?"]
    output: DemurrageCharge[]
    status: 200
    side_effects:
      - "a Customer-role caller is silently scoped to charges whose cycle belongs to it"
      - "ordered by created_at ASC then id ASC"

  # --- Invoice --------------------------------------------------------------
  - method: POST
    path: /demurrage/invoices
    roles: [BillingAdmin]
    input: [customer_id, billing_period_start, billing_period_end]
    output: Invoice
    status: 201
    side_effects:
      - "status DRAFT, every total 0, dispute_deadline_at null"
      - "ATTACHES every DemurrageCharge with status FINAL and invoice_id NULL whose cycle belongs to this customer and whose released_at falls inside the closed billing period"
      - "each attached cycle's billing_status moves UNBILLED -> INVOICED"
      - "attached_charge_count is derived; the money totals stay 0 until issue"
  - method: GET
    path: /demurrage/invoices/{id}
    roles: [Customer, DemurrageAdjudicator, RegulatoryOfficer, BillingAdmin]
    input: []
    output: Invoice
    status: 200
    side_effects: []
  - method: GET
    path: /demurrage/invoices
    roles: [Customer, BillingAdmin]
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    status: 200
    side_effects:
      - "a Customer-role caller is silently scoped to its own invoices"
  - method: POST
    path: /demurrage/invoices/{id}/issue
    roles: [BillingAdmin]
    input: []
    output: Invoice
    status: 200
    side_effects:
      - "status DRAFT -> ISSUED"
      - "runs invoice_rollup_and_status_derivation and then average_agreement_credit"
      - "writes total_gross_cents, total_credit_cents, total_net_cents and agreement_credit_cents"
      - "sets dispute_deadline_at to the logical-clock date plus 30 calendar days at 23:59:59.999Z"
      - "the Customer's OPEN AverageAgreement receives agreement_credit_cents and has its version incremented"
      - "increments Invoice.version by 1"
  - method: POST
    path: /demurrage/invoices/{id}/close
    roles: [BillingAdmin]
    input: []
    output: Invoice
    status: 200
    side_effects:
      - "status ISSUED or ADJUSTED -> CLOSED; a PARTIALLY_DISPUTED invoice is refused with ERR_INVOICE_INVALID_STATE"
      - "every attached cycle's billing_status moves to SETTLED"
      - "every DECIDED dispute on this invoice moves to CLOSED and the Customer's dispute_posture is re-derived"
      - "increments Invoice.version by 1"

  # --- AverageAgreement -----------------------------------------------------
  - method: POST
    path: /demurrage/average-agreements
    roles: [BillingAdmin]
    input: ["customer_id", "agreement_month", "credit_cap_ratio?"]
    output: AverageAgreement
    status: 201
    side_effects:
      - "status OPEN; all day counts and agreement_credit_cents 0"
      - "at most one OPEN agreement per customer per agreement_month"
  - method: POST
    path: /demurrage/average-agreements/{id}/reconcile
    roles: [BillingAdmin]
    input: []
    output: AverageAgreement
    status: 200
    side_effects:
      - "re-derives credit_days_earned, debit_days_incurred and net_days from scratch"
      - "status OPEN -> RECONCILED when net_days >= 0, otherwise OPEN -> FORFEITED"
      - "on FORFEITED: agreement_credit_cents is zeroed, the credit already landed on the month's charges is reversed, each touched Invoice is re-derived and version-incremented, and Customer.credit_balance_cents is re-derived"
      - "increments AverageAgreement.version by 1"

  # --- BunchingClaim --------------------------------------------------------
  - method: POST
    path: /demurrage/bunching-claims
    roles: [Customer]
    input: [customer_id, cluster_window_start, cluster_window_end, method]
    output: BunchingClaim
    status: 201
    side_effects:
      - "status SUBMITTED; every computed field 0 or empty until the claim is analysed"
      - "rejected when an overlapping window is already GRANTED or PARTIALLY_GRANTED for this customer"
  - method: POST
    path: /demurrage/bunching-claims/{id}/analyze
    roles: [DemurrageAdjudicator]
    input: []
    output: BunchingClaim
    status: 200
    side_effects:
      - "runs bunching_attribution under the claim's method"
      - "writes baseline_per_day, delivered_car_count, cluster_chargeable_days, exempted_cycle_ids and exempt_days_granted"
      - "status forks in the SAME request to GRANTED, PARTIALLY_GRANTED or DENIED"
      - "on GRANTED or PARTIALLY_GRANTED, each exempted cycle's charge has bunching_exempt_days written and gross_amount_cents re-laddered from tier 1; on DENIED no charge is touched at all"
      - "increments BunchingClaim.version by 1"

  # --- DemurrageDispute -----------------------------------------------------
  - method: POST
    path: /demurrage/disputes
    roles: [Customer]
    input: ["invoice_id", "scope", "grounds", "narrative", "claimed_credit_cents", "expected_invoice_version", "demurrage_charge_id?", "bunching_claim_id?", "supersedes_dispute_id?"]
    output: DemurrageDispute
    status: 201
    side_effects:
      - "status DRAFT, decision PENDING, round_number 1, info_request_count 0"
      - "customer_id is copied from the disputed Invoice.customer_id and any value supplied by the caller is ignored"
      - "OCC: expected_invoice_version must equal the current Invoice.version, else ERR_INVOICE_VERSION_STALE (412)"
      - "increments Invoice.version by 1 and re-derives Invoice.dispute_count"
      - "no charge changes status yet: nothing happens to the money until submit"
  - method: GET
    path: /demurrage/disputes/{id}
    roles: [Customer, DemurrageAdjudicator, RegulatoryOfficer, BillingAdmin]
    input: []
    output: DemurrageDispute
    status: 200
    side_effects: []
  - method: GET
    path: /demurrage/disputes
    roles: [Customer, DemurrageAdjudicator, RegulatoryOfficer, BillingAdmin]
    input: ["customer_id?", "invoice_id?", "demurrage_charge_id?", "bunching_claim_id?", "supersedes_dispute_id?", "status?", "limit?", "offset?"]
    output: DemurrageDispute[]
    status: 200
    side_effects:
      - "a Customer-role caller is silently scoped to its own disputes"
  - method: POST
    path: /demurrage/disputes/{id}/evidence
    roles: [Customer]
    input: [evidence_type, observed_at, description]
    output: DisputeEvidence
    status: 201
    side_effects:
      - "weight_points is derived from evidence_type and any caller-supplied value is ignored"
      - "re-derives DemurrageDispute.evidence_weight"
      - "allowed while the dispute is DRAFT or INFO_REQUESTED only"
  - method: GET
    path: /demurrage/disputes/{id}/evidence
    roles: [Customer, DemurrageAdjudicator, RegulatoryOfficer]
    input: ["limit?", "offset?"]
    output: DisputeEvidence[]
    status: 200
    side_effects: []
  - method: POST
    path: /demurrage/disputes/{id}/submit
    roles: [Customer]
    input: []
    output: DemurrageDispute
    status: 200
    side_effects:
      - "status DRAFT -> SUBMITTED"
      - "submitted_at is set to the logical clock; target_charge_count and evidence_weight are frozen"
      - "adjudication_due_at is computed by adjudication_timeline"
      - "each target charge moves FINAL -> DISPUTED and its cycle's billing_status moves to DISPUTED"
      - "the Invoice's derived status becomes PARTIALLY_DISPUTED and its version increments by 1"
      - "Customer.dispute_posture is re-derived to UNDER_REVIEW and its version increments by 1"
  - method: POST
    path: /demurrage/disputes/{id}/begin-review
    roles: [DemurrageAdjudicator]
    input: []
    output: DemurrageDispute
    status: 200
    side_effects:
      - "status SUBMITTED -> UNDER_REVIEW, or APPEALED -> UNDER_REVIEW"
      - "sets first_level_adjudicator_id on the round-1 entry and appeal_adjudicator_id on the round-2 entry"
      - "the round-2 entry is barred to first_level_adjudicator_id with ERR_SEGREGATION_OF_DUTIES"
      - "increments DemurrageDispute.version by 1"
  - method: POST
    path: /demurrage/disputes/{id}/request-info
    roles: [DemurrageAdjudicator]
    input: [requested_items]
    output: DemurrageDispute
    status: 200
    side_effects:
      - "status UNDER_REVIEW -> INFO_REQUESTED"
      - "increments info_request_count by 1; the third request fails with ERR_INFO_REQUEST_LIMIT"
      - "REPLACES adjudication_due_at with the 10th Mon-Fri date strictly after the current logical-clock date at 23:59:59.999Z"
      - "the target charges stay DISPUTED and the money is untouched"
  - method: POST
    path: /demurrage/disputes/{id}/resubmit
    roles: [Customer]
    input: []
    output: DemurrageDispute
    status: 200
    side_effects:
      - "status INFO_REQUESTED -> SUBMITTED"
      - "refreshes submitted_at to the logical clock but LEAVES adjudication_due_at exactly where request-info put it"
      - "re-derives evidence_weight over the enlarged evidence set"
  - method: POST
    path: /demurrage/disputes/{id}/decide
    roles: [DemurrageAdjudicator]
    input: [decision, allowance_pct, decision_rationale]
    output: DemurrageDispute
    status: 200
    side_effects:
      - "status UNDER_REVIEW -> DECIDED"
      - "runs dispute_credit_allocation and writes allowed_credit_cents"
      - "each target charge receives its per-line credit and moves to ADJUSTED, or back to FINAL when its credit is 0"
      - "each target cycle's billing_status moves to ADJUSTED, or back to INVOICED on a zero credit"
      - "the Invoice's total_credit_cents, total_net_cents and derived status are rewritten and its version increments by 1"
      - "Customer.credit_balance_cents and dispute_posture are re-derived and Customer.version increments by 1"
      - "on a round-2 decision the caller must not be first_level_adjudicator_id"
  - method: POST
    path: /demurrage/disputes/{id}/appeal
    roles: [Customer]
    input: [appeal_narrative]
    output: DemurrageDispute
    status: 200
    side_effects:
      - "status DECIDED -> APPEALED; round_number 1 -> 2; decision back to PENDING; allowance_pct back to null; allowed_credit_cents back to 0"
      - "FULLY REVERSES the first-level credit: every target charge returns to DISPUTED with its pre-decision credit_applied_cents"
      - "the Invoice's totals and derived status return to their pre-decision values and its version increments by 1"
      - "Customer.credit_balance_cents returns to its pre-decision value and dispute_posture re-derives to UNDER_REVIEW"
      - "adjudication_due_at is recomputed with the appeal multiplier from the appeal date, ignoring evidence weight"
      - "a second appeal fails with ERR_APPEAL_LIMIT"

  # --- RegulatoryComplaint --------------------------------------------------
  - method: POST
    path: /demurrage/regulatory-complaints
    roles: [Customer]
    input: ["demurrage_dispute_id", "complaint_type", "docket_narrative", "tariff_rule_set_id?"]
    output: RegulatoryComplaint
    status: 201
    side_effects:
      - "status FILED; docket_number is the deterministic 'D-' plus 5-digit creation sequence; filed_at is the logical clock"
      - "response_due_at is the 15th Mon-Fri date strictly after the filing date at 23:59:59.999Z"
      - "the escalated DemurrageDispute moves DECIDED -> ESCALATED and the Customer's dispute_posture re-derives to ESCALATED"
      - "on complaint_type RULE_REASONABLENESS the cited TariffRuleSet moves PUBLISHED -> CHALLENGED and challenge_count increments"
      - "requires the dispute to be DECIDED with round_number >= 2, else ERR_APPEAL_NOT_EXHAUSTED"
  - method: GET
    path: /demurrage/regulatory-complaints/{id}
    roles: [Customer, RailroadAgent, RegulatoryOfficer, BillingAdmin]
    input: []
    output: RegulatoryComplaint
    status: 200
    side_effects: []
  - method: GET
    path: /demurrage/regulatory-complaints
    roles: [Customer, RailroadAgent, RegulatoryOfficer, BillingAdmin]
    input: ["demurrage_dispute_id?", "tariff_rule_set_id?", "status?", "limit?", "offset?"]
    output: RegulatoryComplaint[]
    status: 200
    side_effects:
      - "a Customer-role caller is silently scoped to complaints on its own disputes"
  - method: POST
    path: /demurrage/regulatory-complaints/{id}/answer
    roles: [RailroadAgent]
    input: [answer_narrative]
    output: RegulatoryComplaint
    status: 200
    side_effects:
      - "status FILED -> RAILROAD_ANSWERED; stores answer_narrative"
      - "increments RegulatoryComplaint.version by 1"
  - method: POST
    path: /demurrage/regulatory-complaints/{id}/decide
    roles: [RegulatoryOfficer]
    input: [outcome, ordered_credit_cents]
    output: RegulatoryComplaint
    status: 200
    side_effects:
      - "status RAILROAD_ANSWERED -> DECIDED_FOR_CUSTOMER, DECIDED_FOR_RAILROAD or DISMISSED"
      - "ordered_credit_cents must be 0 unless the outcome is DECIDED_FOR_CUSTOMER, and may never exceed the escalated dispute's claimed_credit_cents"
      - "on RULE_REASONABLENESS: the cited TariffRuleSet moves CHALLENGED -> WITHDRAWN on DECIDED_FOR_CUSTOMER, or CHALLENGED -> PUBLISHED otherwise, and its version increments by 1"
      - "the escalated DemurrageDispute stays ESCALATED and no DemurrageCharge is rewritten: the regulator's order is recorded, not posted"
      - "increments RegulatoryComplaint.version by 1"

# -----------------------------------------------------------------------------
# §1.6 Error Catalog
# -----------------------------------------------------------------------------
# Every code below is reachable from at least one request against §1.5. Codes
# for CarNotification and DisputeEvidence lookups are deliberately absent
# because neither entity has a single-resource endpoint.
# -----------------------------------------------------------------------------
errors:

  # --- authentication and authorization ------------------------------------
  - { error_id: ERR_UNAUTHENTICATED,        status_code: 401, when: "X-Role-Name is missing, empty or not one of the five declared roles; or X-User-ID is missing on a Customer-role or DemurrageAdjudicator-role endpoint" }
  - { error_id: ERR_ROLE_FORBIDDEN,         status_code: 403, when: "the caller's role is not in the endpoint's roles list" }
  - { error_id: ERR_NOT_RESOURCE_OWNER,     status_code: 403, when: "a Customer-role caller addresses a resource that resolves to a different Customer" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES,  status_code: 403, when: "the round-1 adjudicator tries to begin-review or decide the appeal round of the same dispute" }

  # --- existence ------------------------------------------------------------
  - { error_id: ERR_CUSTOMER_NOT_FOUND,              status_code: 404, when: "a path or body customer_id matches no Customer" }
  - { error_id: ERR_TARIFF_RULE_SET_NOT_FOUND,       status_code: 404, when: "a path or body tariff_rule_set_id matches no TariffRuleSet" }
  - { error_id: ERR_FACILITY_NOT_FOUND,              status_code: 404, when: "a path or body facility_id matches no Facility" }
  - { error_id: ERR_RAIL_CAR_NOT_FOUND,              status_code: 404, when: "a path or body rail_car_id matches no RailCar" }
  - { error_id: ERR_PLACEMENT_CYCLE_NOT_FOUND,       status_code: 404, when: "a path placement cycle id matches no PlacementCycle" }
  - { error_id: ERR_DEMURRAGE_CHARGE_NOT_FOUND,      status_code: 404, when: "a path or body demurrage_charge_id matches no DemurrageCharge" }
  - { error_id: ERR_INVOICE_NOT_FOUND,               status_code: 404, when: "a path or body invoice_id matches no Invoice" }
  - { error_id: ERR_BUNCHING_CLAIM_NOT_FOUND,        status_code: 404, when: "a path or body bunching_claim_id matches no BunchingClaim" }
  - { error_id: ERR_DEMURRAGE_DISPUTE_NOT_FOUND,     status_code: 404, when: "a path or body demurrage_dispute_id or supersedes_dispute_id matches no DemurrageDispute" }
  - { error_id: ERR_AVERAGE_AGREEMENT_NOT_FOUND,     status_code: 404, when: "a path average agreement id matches no AverageAgreement" }
  - { error_id: ERR_REGULATORY_COMPLAINT_NOT_FOUND,  status_code: 404, when: "a path regulatory complaint id matches no RegulatoryComplaint" }

  # --- schema ---------------------------------------------------------------
  - { error_id: ERR_INVALID_REQUEST,        status_code: 400, when: "a required field is missing, an enum member is unrecognised, a string breaks its length or charset constraint, a number breaks its range, an instant is not ISO 8601 UTC with a Z suffix, or agreement_month does not match ^[0-9]{4}-(0[1-9]|1[0-2])$" }
  - { error_id: ERR_INVALID_PAGINATION,     status_code: 400, when: "limit is not an integer in 1..100 or offset is not an integer >= 0" }

  # --- state ----------------------------------------------------------------
  - { error_id: ERR_INVALID_MOVEMENT_STATE, status_code: 409, when: "a PlacementCycle movement action has no transition from the cycle's current movement_status, e.g. actual-placement on an ORDERED cycle or refuse on a RELEASED one" }
  - { error_id: ERR_INVOICE_NOT_DISPUTABLE, status_code: 409, when: "a dispute is submitted against an Invoice whose status is DRAFT or CLOSED" }
  - { error_id: ERR_INVOICE_INVALID_STATE,  status_code: 409, when: "issue is called on a non-DRAFT invoice, close is called on a DRAFT or PARTIALLY_DISPUTED invoice, or a cycle void would touch a CLOSED invoice" }
  - { error_id: ERR_DISPUTE_INVALID_STATE,  status_code: 409, when: "a dispute action has no transition from the dispute's current status, e.g. decide on a SUBMITTED dispute, resubmit on an UNDER_REVIEW dispute, evidence added to a DECIDED dispute, or a complaint filed against a dispute that is not DECIDED" }
  - { error_id: ERR_CHARGE_INVALID_STATE,   status_code: 409, when: "a dispute's target charge is not FINAL at submit time, typically because another dispute already moved it to DISPUTED" }
  - { error_id: ERR_CLAIM_INVALID_STATE,    status_code: 409, when: "analyze is called on a BunchingClaim that is not SUBMITTED" }
  - { error_id: ERR_AGREEMENT_INVALID_STATE, status_code: 409, when: "reconcile is called on an AverageAgreement that is not OPEN" }
  - { error_id: ERR_COMPLAINT_INVALID_STATE, status_code: 409, when: "answer is called on a complaint that is not FILED, or decide is called on a complaint that is not RAILROAD_ANSWERED" }
  - { error_id: ERR_TARIFF_INVALID_STATE,   status_code: 409, when: "publish is called on a TariffRuleSet that is not DRAFT" }

  # --- optimistic concurrency ----------------------------------------------
  - { error_id: ERR_INVOICE_VERSION_STALE,  status_code: 412, when: "expected_invoice_version does not equal the current Invoice.version on POST /demurrage/disputes" }
  - { error_id: ERR_RAIL_CAR_VERSION_STALE, status_code: 412, when: "expected_rail_car_version does not equal the current RailCar.version on POST /demurrage/placement-cycles" }

  # --- business safety ------------------------------------------------------
  - { error_id: ERR_FACILITY_EMBARGOED,     status_code: 409, when: "constructive placement or release is attempted at a Facility whose access_mode is EMBARGOED" }
  - { error_id: ERR_FACILITY_NOT_OPEN,      status_code: 409, when: "actual placement is attempted at a Facility whose access_mode is GATE_CONTROLLED or EMBARGOED" }

  # --- referential integrity -----------------------------------------------
  - { error_id: ERR_TARIFF_WITHDRAWN,       status_code: 422, when: "a new PlacementCycle cites a TariffRuleSet whose status is WITHDRAWN" }
  - { error_id: ERR_TARIFF_NOT_PUBLISHED,   status_code: 422, when: "a new PlacementCycle or a constructive placement cites a TariffRuleSet whose status is DRAFT or SUPERSEDED" }
  - { error_id: ERR_TARIFF_SCOPE_MISMATCH,  status_code: 422, when: "the cited TariffRuleSet.car_ownership_scope does not cover the RailCar.ownership, e.g. a RAILROAD_OWNED-scoped tariff on a PRIVATE car" }
  - { error_id: ERR_DISPUTE_SCOPE_MISMATCH, status_code: 422, when: "scope is SINGLE_CHARGE with no demurrage_charge_id, scope is WHOLE_INVOICE with one supplied, complaint_type is RULE_REASONABLENESS with no tariff_rule_set_id (or the converse), or grounds is BUNCHING with no bunching_claim_id" }
  - { error_id: ERR_CHARGE_INVOICE_MISMATCH, status_code: 422, when: "the disputed demurrage_charge_id belongs to a different Invoice than invoice_id" }
  - { error_id: ERR_SUPERSEDE_TARGET_INVALID, status_code: 422, when: "supersedes_dispute_id points at a dispute on a different invoice, or at one whose status is not DECIDED" }

  # --- business constraints -------------------------------------------------
  - { error_id: ERR_CAR_CYCLE_OVERLAP,      status_code: 409, when: "a new PlacementCycle would overlap the half-open occupation interval of an existing non-VOIDED cycle on the same RailCar" }
  - { error_id: ERR_FACILITY_SPOT_UNAVAILABLE, status_code: 409, when: "actual placement would push Facility.occupied_spot_count past car_spot_capacity" }
  - { error_id: ERR_FACILITY_SWITCH_BUFFER, status_code: 409, when: "actual_placement_at is earlier than Facility.last_switch_at plus switch_buffer_minutes" }
  - { error_id: ERR_REFUSAL_LIMIT,          status_code: 409, when: "a third refusal is attempted on one PlacementCycle" }
  - { error_id: ERR_INFO_REQUEST_LIMIT,     status_code: 409, when: "a third information request is attempted on one DemurrageDispute" }
  - { error_id: ERR_APPEAL_LIMIT,           status_code: 409, when: "a second appeal is attempted on one DemurrageDispute" }

  # --- temporal -------------------------------------------------------------
  - { error_id: ERR_DISPUTE_WINDOW_CLOSED,  status_code: 422, when: "the logical clock is past Invoice.dispute_deadline_at when a dispute is submitted" }
  - { error_id: ERR_NON_CHRONOLOGICAL_EVENT, status_code: 422, when: "a recorded instant precedes an instant it must follow: actual_placement_at before constructive_placement_at, released_at before actual_placement_at, a notification's sent_at before constructive_placement_at, or an ack_at before the selected notification's sent_at" }
  - { error_id: ERR_INVALID_CLUSTER_WINDOW, status_code: 422, when: "cluster_window_start is after cluster_window_end, the window spans more than 14 calendar dates, or billing_period_start is after billing_period_end" }
  - { error_id: ERR_CLUSTER_WINDOW_OVERLAP, status_code: 409, when: "the customer already has a GRANTED or PARTIALLY_GRANTED BunchingClaim whose closed window shares at least one date with the new one" }
  - { error_id: ERR_DUPLICATE_AGREEMENT_MONTH, status_code: 409, when: "the customer already has an OPEN AverageAgreement for the same agreement_month" }

  # --- fiscal ---------------------------------------------------------------
  - { error_id: ERR_CUSTOMER_CREDIT_HOLD,   status_code: 402, when: "release is attempted while Customer.billing_posture is CREDIT_HOLD" }
  - { error_id: ERR_INVOICE_NO_CHARGES,     status_code: 422, when: "issue is called on an Invoice with attached_charge_count 0" }
  - { error_id: ERR_DISPUTE_NO_EVIDENCE,    status_code: 422, when: "submit is called with no DisputeEvidence rows, or resubmit is called with no evidence row created after the information request" }
  - { error_id: ERR_CLAIM_EXCEEDS_CHARGE,   status_code: 422, when: "claimed_credit_cents exceeds the gross of the dispute's resolved target set" }
  - { error_id: ERR_ALLOWANCE_PCT_MISMATCH, status_code: 422, when: "decision ALLOWED with allowance_pct != 1, DENIED with allowance_pct != 0, or PARTIALLY_ALLOWED with allowance_pct 0 or 1" }
  - { error_id: ERR_BUNCHING_CLAIM_NOT_GRANTED, status_code: 422, when: "a dispute with grounds BUNCHING is submitted while its BunchingClaim is SUBMITTED, ANALYZED or DENIED" }
  - { error_id: ERR_APPEAL_NOT_EXHAUSTED,   status_code: 422, when: "a RegulatoryComplaint is filed against a DECIDED dispute whose round_number is still 1" }
  - { error_id: ERR_ORDERED_CREDIT_EXCEEDS_CLAIM, status_code: 422, when: "ordered_credit_cents exceeds the escalated dispute's claimed_credit_cents, or is non-zero on a DECIDED_FOR_RAILROAD or DISMISSED outcome" }
  - { error_id: ERR_CLAIM_NO_DELIVERIES,    status_code: 422, when: "analyze is called on a BunchingClaim whose cluster window contains no non-VOIDED PlacementCycle for the customer" }
  - { error_id: ERR_NO_PENDING_NOTIFICATION, status_code: 422, when: "acknowledge-notification finds no CarNotification with delivery_status SENT or DELIVERED on the cycle" }
  - { error_id: ERR_NOTIFICATION_NOT_SENT,  status_code: 422, when: "release is attempted on an INDUSTRY_TRACK cycle whose notification_sent_at is still null, including the case where the only notice FAILED on the wrong channel" }

# -----------------------------------------------------------------------------
# §1.7 RBAC Table
# -----------------------------------------------------------------------------
rbac:
  roles:

    - name: Customer
      identity: entity_backed:Customer
      identity_notes: |
        X-User-ID carries a Customer.id. Every addressed resource is resolved to
        its owning Customer through the chain declared at validation priority 22;
        a mismatch is ERR_NOT_RESOURCE_OWNER (403). List endpoints are silently
        scoped to the caller rather than erroring, so a Customer can never
        enumerate another shipper's cars, charges, invoices or disputes.
      exclusive_operations:
        - "POST /demurrage/placement-cycles/{id}/acknowledge-notification"
        - "POST /demurrage/placement-cycles/{id}/refuse"
        - "POST /demurrage/placement-cycles/{id}/release"
        - "POST /demurrage/bunching-claims"
        - "POST /demurrage/disputes"
        - "POST /demurrage/disputes/{id}/evidence"
        - "POST /demurrage/disputes/{id}/submit"
        - "POST /demurrage/disputes/{id}/resubmit"
        - "POST /demurrage/disputes/{id}/appeal"
        - "POST /demurrage/regulatory-complaints"
      shared_operations:
        - "GET /demurrage/customers/{id}"
        - "GET /demurrage/customers/{id}/average-agreements"
        - "GET /demurrage/customers/{id}/bunching-claims"
        - "GET /demurrage/tariff-rule-sets/{id}"
        - "GET /demurrage/rail-cars/{id}"
        - "GET /demurrage/placement-cycles/{id}"
        - "GET /demurrage/placement-cycles"
        - "GET /demurrage/placement-cycles/{id}/notifications"
        - "GET /demurrage/charges/{id}"
        - "GET /demurrage/charges"
        - "GET /demurrage/invoices/{id}"
        - "GET /demurrage/invoices"
        - "GET /demurrage/disputes/{id}"
        - "GET /demurrage/disputes"
        - "GET /demurrage/disputes/{id}/evidence"
        - "GET /demurrage/regulatory-complaints/{id}"
        - "GET /demurrage/regulatory-complaints"

    - name: RailroadAgent
      identity: opaque
      identity_notes: |
        X-User-ID is an opaque operating-employee identifier. It is never
        resolved to an entity and never restricts which cars or facilities the
        agent may touch: the railroad side of this API is not tenant-scoped.
      exclusive_operations:
        - "POST /demurrage/rail-cars"
        - "POST /demurrage/placement-cycles"
        - "POST /demurrage/placement-cycles/{id}/constructive-placement"
        - "POST /demurrage/placement-cycles/{id}/notify"
        - "POST /demurrage/placement-cycles/{id}/actual-placement"
        - "POST /demurrage/facilities/{id}/access-mode"
        - "POST /demurrage/regulatory-complaints/{id}/answer"
      shared_operations:
        - "GET /demurrage/customers/{id}"
        - "GET /demurrage/tariff-rule-sets/{id}"
        - "GET /demurrage/rail-cars/{id}"
        - "GET /demurrage/placement-cycles/{id}"
        - "GET /demurrage/placement-cycles"
        - "GET /demurrage/placement-cycles/{id}/notifications"
        - "GET /demurrage/regulatory-complaints/{id}"
        - "GET /demurrage/regulatory-complaints"

    - name: DemurrageAdjudicator
      identity: opaque
      identity_notes: |
        X-User-ID is an opaque adjudicator identifier, and it is the ONLY role
        whose user id is persisted: begin-review stamps it into
        first_level_adjudicator_id or appeal_adjudicator_id. Segregation of
        duties is enforced against that stored value at validation priority 24,
        so the bar follows the dispute and not the session.
      exclusive_operations:
        - "POST /demurrage/bunching-claims/{id}/analyze"
        - "POST /demurrage/disputes/{id}/begin-review"
        - "POST /demurrage/disputes/{id}/request-info"
        - "POST /demurrage/disputes/{id}/decide"
      shared_operations:
        - "GET /demurrage/customers/{id}"
        - "GET /demurrage/customers/{id}/bunching-claims"
        - "GET /demurrage/tariff-rule-sets/{id}"
        - "GET /demurrage/placement-cycles/{id}"
        - "GET /demurrage/placement-cycles"
        - "GET /demurrage/placement-cycles/{id}/notifications"
        - "GET /demurrage/charges/{id}"
        - "GET /demurrage/charges"
        - "GET /demurrage/invoices/{id}"
        - "GET /demurrage/disputes/{id}"
        - "GET /demurrage/disputes"
        - "GET /demurrage/disputes/{id}/evidence"

    - name: RegulatoryOfficer
      identity: opaque
      identity_notes: |
        X-User-ID is an opaque regulator identifier and is not persisted. The
        officer owns the tariff lifecycle and the complaint outcome but has no
        write access to cars, cycles, invoices or disputes: the regulator orders
        credit, it never posts credit.
      exclusive_operations:
        - "POST /demurrage/tariff-rule-sets"
        - "POST /demurrage/tariff-rule-sets/{id}/publish"
        - "POST /demurrage/regulatory-complaints/{id}/decide"
      shared_operations:
        - "GET /demurrage/customers/{id}"
        - "GET /demurrage/tariff-rule-sets/{id}"
        - "GET /demurrage/charges/{id}"
        - "GET /demurrage/invoices/{id}"
        - "GET /demurrage/disputes/{id}"
        - "GET /demurrage/disputes"
        - "GET /demurrage/disputes/{id}/evidence"
        - "GET /demurrage/regulatory-complaints/{id}"
        - "GET /demurrage/regulatory-complaints"

    - name: BillingAdmin
      identity: opaque
      identity_notes: |
        X-User-ID is an opaque back-office identifier and is not persisted.
        BillingAdmin owns the money-side lifecycle and the test-driving clock,
        but is deliberately barred from every adjudication action: it cannot
        begin-review, decide or appeal, so no single role can both raise a
        charge and forgive it.
      exclusive_operations:
        - "POST /demurrage/_clock/set_current_utc"
        - "POST /demurrage/customers"
        - "POST /demurrage/customers/{id}/credit-hold"
        - "POST /demurrage/facilities"
        - "POST /demurrage/invoices"
        - "POST /demurrage/invoices/{id}/issue"
        - "POST /demurrage/invoices/{id}/close"
        - "POST /demurrage/average-agreements"
        - "POST /demurrage/average-agreements/{id}/reconcile"
        - "POST /demurrage/placement-cycles/{id}/void"
      shared_operations:
        - "GET /demurrage/customers/{id}"
        - "GET /demurrage/customers/{id}/average-agreements"
        - "GET /demurrage/customers/{id}/bunching-claims"
        - "GET /demurrage/tariff-rule-sets/{id}"
        - "GET /demurrage/rail-cars/{id}"
        - "GET /demurrage/placement-cycles/{id}"
        - "GET /demurrage/placement-cycles"
        - "GET /demurrage/charges/{id}"
        - "GET /demurrage/charges"
        - "GET /demurrage/invoices/{id}"
        - "GET /demurrage/invoices"
        - "GET /demurrage/disputes/{id}"
        - "GET /demurrage/disputes"
        - "GET /demurrage/regulatory-complaints/{id}"
        - "GET /demurrage/regulatory-complaints"

  notes: |
    Role-model interaction worth spelling out, because it is where a naive
    implementation collapses two roles into one:
      * The money ladder is BillingAdmin's: create, issue, close, void, average
        agreements, credit hold. The adjudication ladder is
        DemurrageAdjudicator's: begin-review, request-info, decide, analyze.
        No role appears on both, so a BillingAdmin cannot forgive a charge it
        raised and an adjudicator cannot void the cycle it just credited.
      * The physical ladder is RailroadAgent's, and the customer holds exactly
        the three levers that a real consignee holds: acknowledge, refuse,
        release. Actual placement is the railroad's; release is the customer's.
      * RegulatoryOfficer both writes the tariff and decides challenges to it,
        which is intentional: the regulator is the tariff's author of record.
      * Only DemurrageAdjudicator's X-User-ID is persisted, so segregation of
        duties is testable with exactly two distinct user ids and does not
        require any user-management endpoint.
