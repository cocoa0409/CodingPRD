          - errors[ERR_DATA_SHARING_NOT_SIGNED]
          - state_machines.School.data_sharing_status
        distinguishing_aspect: "A report created while data sharing was SIGNED cannot be submitted after the agreement lapses — expiry also auto-suspends the school agreement as a conditional cascade."
        test_recipe:
          setup:
            - "Site ACTIVE, school ACTIVE with data sharing SIGNED. DRAFT report created (agreement ACTIVE at creation). Data sharing then EXPIRED by the liaison."
          setup_api_calls:
            - *c_clock
            - *c_site
            - *c_site_on
            - *c_school
            - *c_ds_sign
            - *c_agr_sign
