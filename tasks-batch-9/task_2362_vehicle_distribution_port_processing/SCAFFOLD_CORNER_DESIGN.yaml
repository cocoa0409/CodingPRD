            - "Vehicle.${veh_id}.blocked_credit_days == 0 (damage_opened_at is null)"

      - name: corner_threshold_repair_escalation_boundary
        claim_type: threshold
        grounds:
          - calculations.repair_authorization_tier
          - errors.ERR_INVALID_STATE
        excluded_because:
          difficulty_instance: boundary_precision_check / repair_estimate_exactly_at_escalation_threshold_escalates
          rationale: "That §1.8 instance pins estimate_cents at 149999 / 150000 / 150001 around REPAIR_ESCALATION_THRESHOLD_CENTS and asserts the AUTO vs ESCALATED split at the inclusive boundary."

      - name: corner_threshold_yard_posture_ratio_boundaries
        claim_type: threshold
        grounds:
          - calculations.yard_posture
          - entities.ProcessingCenter.fields.yard_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / yard_occupancy_exactly_at_constrained_ratio_still_admits_a_unit
          rationale: "That §1.8 instance walks a 5-slot yard through 3/5 OPEN, 4/5 == 0.80 CONSTRAINED and 5/5 GRIDLOCK, covering both ratio thresholds exactly."

      - name: corner_tiered_pricing_accessory_markup_rounding
        claim_type: tiered_pricing
        grounds:
          - calculations.accessory_program_billing
        excluded_because:
          difficulty_instance: combinatorial_formula / accessory_billing_rounds_per_unit_then_multiplies_by_qty
          rationale: "That §1.8 instance pins the per-unit-then-multiply order (52449 vs the 52448 produced by the wrong order) including the PARTS_MARKUP_PCT and labour components."

      - name: corner_waterfall_freight_discount_tier_boundaries
        claim_type: waterfall_allocation
        grounds:
          - calculations.release_freight_settlement
        excluded_because:
          difficulty_instance: combinatorial_formula / freight_discount_tier_keyed_on_gross_not_on_post_discount_total
          rationale: "That §1.8 instance proves the tier key is gross_freight_cents (7508 discount, 117621 total) rather than the post-discount total (3754 / 121375)."

      - name: corner_interval_merge_berth_window_adjacency
        claim_type: interval_merge
        grounds:
          - calculations.berth_window_conflict
        excluded_because:
          difficulty_instance: resource_temporal_overlap / berth_window_requires_turnaround_buffer_clearance_on_both_sides
          rationale: "That §1.8 instance tests the exclusive half-open interval plus symmetric 120-minute buffer, where adjacency is forbidden (19:00 rejected, 20:00 accepted)."

      - name: corner_interval_merge_carrier_window_aggregate
        claim_type: interval_merge
        grounds:
          - calculations.carrier_window_capacity_conflict
        excluded_because:
          difficulty_instance: resource_temporal_overlap / carrier_concurrent_pickup_windows_aggregate_with_adjacency_allowed
          rationale: "That §1.8 instance tests the aggregate half-open semantics with zero buffer where adjacency is allowed ([08,12) + [12,16) pass, [11,13) exceeds concurrent_load_capacity)."

      - name: corner_weighted_scoring_severity_index_composition
        claim_type: weighted_scoring
        grounds:
          - calculations.damage_severity_index
        excluded_because:
          difficulty_instance: combinatorial_formula / damage_severity_index_nested_max_zone_weight_and_line_spread
          rationale: "That §1.8 instance asserts 66 from max-of-weighted-zones plus line spread, versus 106 if the weighted points were summed instead."

      - name: corner_aggregation_kit_counters_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.kit_inventory_reconciliation
          - entities.AccessoryKit.fields.on_hand_qty
        excluded_because:
          difficulty_instance: compensating_invariant / kit_units_conserved_across_install_and_void
          rationale: "That §1.8 instance asserts the running counters after the add and after the reversal, which is exactly this row's aggregation claim."

      - name: corner_chronological_storage_dwell_day_counting
        claim_type: chronological
        grounds:
          - calculations.vehicle_storage_charge
        excluded_because:
          difficulty_instance: dual_variant_calc / storage_charge_provisional_vs_final_diverge_on_same_unit
          rationale: "That §1.8 instance pins the ceil-over-86400-second dwell counting and the one-day floor on the same yard_in_at for both variants (13050 vs 8700)."

      - name: corner_constraint_propagation_carrier_slot_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.carrier_selection
          - calculations.carrier_slot_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / carrier_slots_conserved_across_allocate_cancel_and_supersede
          rationale: "That §1.8 instance propagates slot changes through allocate, cancel and supersede and asserts INVARIANT S holds at every fixed point."

      - name: corner_variant_divergence_claim_recoverable_basis
        claim_type: Variant Divergence
        grounds:
          - calculations.carrier_claim_recoverable_amount
          - entities.CarrierClaim.fields.recoverable_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_recoverable_survey_based_vs_repair_actual_basis_switch
          rationale: "That §1.8 instance produces 87000 under SURVEY_BASED and 36500 under REPAIR_ACTUAL from the same damage, with the 50500 delta asserted."

  # ========================================================= 4. Validations
  - section: validations
    instances:
      - name: corner_start_discharge_before_the_berth_window_opens_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_16
          - errors.ERR_BERTH_WINDOW_NOT_OPEN
          - state_machines.Vessel.transitions.SCHEDULED_to_DISCHARGING
        distinguishing_aspect: "At clock 2026-08-01T05:59:00Z, one minute before berth_window_start, start-discharge returns ERR_BERTH_WINDOW_NOT_OPEN 409 and the vessel stays SCHEDULED; at exactly 06:00:00Z the same call succeeds."
        test_recipe:
          setup:
            - "One center, one berth, one SCHEDULED vessel with berth_window_start 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 4 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T05:59:00Z" }
              as: PortOperationsPlanner
          trigger:
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
              captures: { early_error: $.data.error_id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
              captures: { on_time_status: $.data.discharge_status }
          assert:
            - "${early_error} == ERR_BERTH_WINDOW_NOT_OPEN with HTTP 409"
            - "Vessel.${vessel_id}.discharge_status == SCHEDULED immediately after the rejected call"
            - "${on_time_status} == DISCHARGING — the boundary instant is inclusive"

      - name: corner_complete_discharge_with_zero_units_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_24
          - errors.ERR_NO_UNITS_DISCHARGED
          - state_machines.Vessel.transitions.DISCHARGING_to_DISCHARGE_COMPLETE
        distinguishing_aspect: "complete-discharge on a DISCHARGING vessel with discharged_unit_count 0 returns ERR_NO_UNITS_DISCHARGED 409; after one unit is discharged the same call moves the vessel to DISCHARGE_COMPLETE."
        test_recipe:
          setup:
            - "One vessel DISCHARGING with no units discharged yet."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 4 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
              captures: { count_before: $.data.discharged_unit_count }
          trigger:
            - call: "POST /vpc/vessels/${vessel_id}/complete-discharge"
              payload: {}
              as: PortOperationsPlanner
              captures: { empty_error: $.data.error_id }
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000401", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vessels/${vessel_id}/complete-discharge"
              payload: {}
              as: PortOperationsPlanner
              captures: { final_status: $.data.discharge_status, count_after: $.data.discharged_unit_count }
          assert:
            - "${count_before} == 0 and ${empty_error} == ERR_NO_UNITS_DISCHARGED with HTTP 409"
            - "Vessel.${vessel_id}.discharge_status stays DISCHARGING after the rejected call"
            - "${final_status} == DISCHARGE_COMPLETE and ${count_after} == 1"
            - "Vehicle.${veh_id}.processing_status == DISCHARGED"

      - name: corner_duplicate_vin_and_duplicate_port_code_return_duplicate_key
        claim_type: Violation → Error
        grounds:
          - validations.priority_6
