              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link1: $.data.id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A02", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link2: $.data.id }
          trigger:
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link1}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { route1: $.data.id }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link2}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { err: $.data.error_id }
            - call: "GET /cabling/pathway-segments/${seg_a}"
              payload: {}
              as: DesignEngineer
              captures: { seg_a_v2: $.data.version }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link2}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v2}" }
              as: DesignEngineer
              captures: { route2: $.data.id }
          assert:
            - "the first route returns 201 and GET /cabling/pathway-segments/${seg_a} then reports version == 2 with occupying_route_count == 1"
            - "the replayed stale version returns 412 with data.error_id == \"ERR_STALE_PATHWAY_VERSION\""
            - "immediately after the 412 the segment still reports occupying_route_count == 1, fill_area_used_sq_mm == 49.02 and version == 2, so the refused write left no trace"
            - "the re-read version is 2 and the resubmitted route returns 201 with consumed_area_sq_mm == 49.02"
            - "GET /cabling/pathway-segments/${seg_a} finally returns version == 3, occupying_route_count == 2 and fill_area_used_sq_mm == 98.04"

      - name: a_stale_rack_version_blocks_the_second_assignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rack-assignment-stale-rack]
          - validations[priority=60]
          - errors[ERR_STALE_RACK_VERSION]
        distinguishing_aspect: "The rack elevation is written twice from the same observed version: the second write is refused with 412 rather than being graded against the shifted occupied_ru, and the refusal leaves the rack ledger and the room power ledger exactly as the first write left them."
        test_recipe:
          setup: ["Project RVT1 with room TR01 (ups_capacity_va 3000) and rack RK-A of 42 RU at version 1"]
          setup_api_calls:
            - call: "POST /cabling/projects"
