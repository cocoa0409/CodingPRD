            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "n"}, as: Guardian, as_user_id: "guardian-1", captures: {cfb: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfb}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfc}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg}/submit", as: Guardian, as_user_id: "guardian-1" }
