              captures: { score_now: $.data.integrity_score, status_now: $.data.status }
          assert:
            - "ProctoringSession.${sess_id}.integrity_score == 50.00"
            - "ProctoringSession.${sess_id}.status == ACTIVE (50 is not < 50, so no auto-void)"

      - name: empty_report_session_ids_rejected
        grounds:
          - validations[priority=12]
          - entities.IntegrityReport.fields.session_ids
          - errors[ERR_EMPTY_REPORT]
        distinguishing_aspect: |
          Empty-collection edge on a DIFFERENT metric and endpoint (POST /integrity-reports): supplying an empty
          session_ids array is rejected with ERR_EMPTY_REPORT (422) — an empty-set boundary, distinct from the
          numeric < 50 threshold above.
        test_recipe:
          setup:
            - "Institution + candidate + exam exist; no sessions bundled."
          setup_api_calls:
