      - name: issue_approve_requires_order_delivered_issue_to_order
        grounds:
          - state_machines.OrderIssue.OPEN_to_APPROVED
          - entities.Order.fields.fulfillment_status
          - errors[ERR_ORDER_NOT_DELIVERED]
        distinguishing_aspect: |
          Entity pair = OrderIssue->Order (a DIFFERENT pair than Order->Dasher). An issue can
          be FILED while the order is not yet delivered, but APPROVE is gated on the parent
          Order being DELIVERED; approving against a PICKED_UP order fails with
          ERR_ORDER_NOT_DELIVERED.
        test_recipe:
          setup:
            - "Zone DT (service_fee_bps 0), open restaurant, $5 item x2, online dasher."
            - "Order placed, dispatched, accepted, picked-up (NOT delivered)."
            - "An issue filed for missing_quantity 1 while order is PICKED_UP."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 0 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Taco", price_cents: 500, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 2 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "GET /orders/${order_id}/line-items"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /deliveries/${delivery_id}/picked-up"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /orders/${order_id}/issues"
              payload: { line_item_id: "${line_id}", missing_quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { issue_id: $.data.id }
          trigger:
            - call: "POST /order-issues/${issue_id}/approve"
              payload: {}
              as: Support
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_DELIVERED"
            - "OrderIssue.${issue_id}.status == OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: Restaurant prep-slot half-open interval overlap ----
      - name: prep_slot_half_open_overlap_on_restaurant
        grounds:
          - calculations.prep_slot_overlap_check
          - validations[priority=9]
          - entities.Restaurant.fields.max_concurrent_prep
          - errors[ERR_PREP_SLOT_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN time-interval overlap on the Restaurant resource.
          With max_concurrent_prep=1 and prep_minutes=30, a scheduled order at 12:15 overlaps
          the existing 12:00 order ([12:00,12:30) intersect [12:15,12:45)) -> conflict; a
          12:30 order would only touch the endpoint (half-open, no overlap).
        test_recipe:
          setup:
            - "Zone DT, open restaurant prep_minutes=30, max_concurrent_prep=1, $20 item. Clock set to 2026-06-07T10:00:00Z."
            - "One scheduled order at 2026-06-07T12:00:00Z already placed (SCHEDULED, interval [12:00,12:30))."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-07T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true, prep_minutes: 30, max_concurrent_prep: 1 }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], scheduled_for: "2026-06-07T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order1_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], scheduled_for: "2026-06-07T12:15:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PREP_SLOT_CONFLICT"

      # ---- Instance 2: Dasher batch aggregate-capacity overlap ----
      - name: dasher_batch_aggregate_capacity_overlap
        grounds:
          - state_machines.Delivery.OFFERED_to_ACCEPTED
          - validations[priority=11]
          - entities.Dasher.fields.max_batch_size
          - entities.Dasher.fields.active_delivery_count
          - errors[ERR_BATCH_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics = AGGREGATE-COUNT capacity on the Dasher resource (not a time
          interval): a dasher with max_batch_size=1 already holds one ACCEPTED delivery, so
          accepting a second OFFERED delivery would push active_delivery_count above 1 ->
          ERR_BATCH_LIMIT_EXCEEDED. Different geometry from the half-open time overlap above.
        test_recipe:
          setup:
            - "Zone DT, open restaurant, $20 item, one online dasher with max_batch_size=1."
            - "Order A dispatched to the dasher and accepted (dasher active_delivery_count=1)."
            - "Order B dispatched to the same dasher (the only candidate) and now OFFERED."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", max_batch_size: 1, availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id, ver_a: $.data.version }
            - call: "POST /orders/${order_a}/dispatch"
              payload: { expected_order_version: "${ver_a}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_a: $.data.id }
            - call: "POST /deliveries/${delivery_a}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: $.data.id, ver_b: $.data.version }
            - call: "POST /orders/${order_b}/dispatch"
              payload: { expected_order_version: "${ver_b}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_b: $.data.id }
          trigger:
            - call: "POST /deliveries/${delivery_b}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BATCH_LIMIT_EXCEEDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: cancel refund conserves CUSTOMER money charged ----
      - name: cancel_refund_conserves_customer_charge
        grounds:
          - state_machines.Order.ROUTED_to_CANCELLED
          - entities.Order.fields.refunded_cents
          - entities.Order.fields.order_subtotal_cents
          - entities.Order.fields.service_fee_cents
          - entities.Order.fields.delivery_fee_quote_cents
        distinguishing_aspect: |
          Conserved quantity = total money charged to the customer. Forward (place: charge
          subtotal + service_fee + delivery_fee_quote + tip) paired with compensation
          (cancel: refund) MUST leave net charge zero, pinned as refunded_cents ==
          order_subtotal_cents + service_fee_cents + delivery_fee_quote_cents + tip_cents =
          1500 + 128 + 780 + 100 = 2508.
        test_recipe:
          setup:
            - "Zone DT, open restaurant route 4, $5 item x3 (subtotal 1500, service_fee 128 per-line, demand 1 -> fee 780 no small-order), tip 100."
            - "Order placed and dispatched (ROUTED), not yet delivered."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850, surge_tier_1_demand: 5, surge_tier_2_demand: 10 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Taco", price_cents: 500, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 3 } ], tip_cents: 100 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version, fee_q: $.data.delivery_fee_quote_cents, sf: $.data.service_fee_cents, sub: $.data.order_subtotal_cents }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { refunded: $.data.refunded_cents, bs: $.data.billing_status }
          assert:
            - "Order.${order_id}.order_subtotal_cents == 1500"
            - "Order.${order_id}.service_fee_cents == 128"
            - "Order.${order_id}.delivery_fee_quote_cents == 780"
            - "Order.${order_id}.refunded_cents == 2508"
            - "Order.${order_id}.billing_status == REFUNDED"

      # ---- Instance 2: decline reversal conserves DASHER lifetime earnings ----
      - name: decline_reversal_conserves_dasher_earnings
        grounds:
          - state_machines.Delivery.OFFERED_to_REASSIGNED
          - state_machines.EarningsRecord.ACCRUED_to_REVERSED
          - entities.Dasher.fields.lifetime_earnings_cents
        distinguishing_aspect: |
          Conserved quantity = dasher lifetime (countable) earnings - a DIFFERENT conserved
          quantity than customer money. Forward (dispatch accrues an EarningsRecord) paired
          with compensation (decline -> REVERSE) MUST leave Dasher.lifetime_earnings_cents
          unchanged at 0, because lifetime sums only SETTLED records and the reversed
          accrual never settles.
        test_recipe:
          setup:
            - "Zone DT, open restaurant, $20 item, one online dasher (lifetime 0)."
            - "Order placed and dispatched to the dasher (Delivery OFFERED, EarningsRecord ACCRUED)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
          trigger:
            - call: "POST /deliveries/${delivery_id}/decline"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "GET /dashers/${dasher_id}"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
              captures: { lifetime: $.data.lifetime_earnings_cents }
          assert:
            - "Dasher.${dasher_id}.lifetime_earnings_cents == 0"
            - "Delivery.${delivery_id}.fulfillment_status == REASSIGNED"
