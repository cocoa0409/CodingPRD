          - endpoints.PUT_/baggage/bags/{id}
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A PUT carrying a version one behind the bag's current one is refused with 412 ERR_STALE_VERSION, while the same PUT carrying the current version succeeds — the two requests are strictly sequential, so the rejection is a stale-version observation, not a timing artifact."
        test_recipe:
