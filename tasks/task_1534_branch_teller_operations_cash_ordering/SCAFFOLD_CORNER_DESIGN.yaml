              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SOD_VIOLATION"

      - name: dual_control_attest_by_counting_teller_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_DUAL_CONTROL_VIOLATION]"]
        distinguishing_aspect: "An attest call whose X-User-ID equals the drawer's teller_id violates dual control -> ERR_DUAL_CONTROL_VIOLATION, even under the BranchManager role."
