              as: Agent
              captures: { talent_id: $.data.id }
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/h.jpg", height_cm: 168, skills: ["sing"] }
              as: Agent
            - call: "POST /talents/${talent_id}/roster"
              payload: {}
              as: Agent
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-10T00:00:00Z", end_date: "2026-03-12T00:00:00Z", hold_kind: "FIRST_REFUSAL" }
              as: Agent
              captures: { hold1_id: $.data.id }
          trigger:
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-12T00:00:00Z", end_date: "2026-03-14T00:00:00Z", hold_kind: "FIRST_REFUSAL" }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_HOLD_OVERLAP"

