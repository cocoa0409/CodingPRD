scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_pricing_estimate_vs_change_order_revised
        grounds:
          - calculations.quote_estimate_pricing
          - state_machines.Quote.DRAFT_to_ISSUED
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
        distinguishing_aspect: |
          Subject is pricing on the Quote/ChangeOrder domain: identical line items priced as the ISSUED
          estimate (variant=estimate, with promo) diverge from the change_order_revised variant (no promo
          carry-over, different material grade) — the two variants produce different total_cents.
        test_recipe:
          setup:
            - "Customer registered, zip 90001 -> install_region WEST"
            - "Project (WALK_IN_CLOSET) in DESIGNING with a SpaceMeasure"
            - "ComponentConfig A FINALIZED: WOOD, line_items SHELF x30@5000 + DRAWER x10@12000 + ACCESSORY x4@2000, total_units 40"
            - "Quote QA issued for config A -> total_cents 403941"
            - "Quote QA accepted; deposit captured; ManufactureOrder started"
            - "ComponentConfig C FINALIZED on a second measure: PREMIUM_WOOD, SHELF x30@5000 + DRAWER x10@12000, total_units 40"
            - "ChangeOrder CONFIG_REVISION submitted & approved against QA referencing config C"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", zip_code: "90001" }
              as: Anonymous
              captures: { cust_a: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_a}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj_a: $.data.id, proj_a_v: $.data.version }
            - call: "POST /projects/${proj_a}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj_a}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas_a: $.data.id }
            - call: "POST /projects/${proj_a}/component-configs"
              payload: { space_measure_id: "${meas_a}", material_grade: "WOOD", line_items: [ { component_type: "SHELF", quantity: 30, unit_price_cents: 5000 }, { component_type: "DRAWER", quantity: 10, unit_price_cents: 12000 }, { component_type: "ACCESSORY", quantity: 4, unit_price_cents: 2000 } ] }
              as: Designer
              captures: { cfg_a: $.data.id }
            - call: "POST /component-configs/${cfg_a}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj_a}/quotes"
              payload: { component_config_id: "${cfg_a}" }
              as: Designer
              captures: { quote_a: $.data.id }
            - call: "POST /quotes/${quote_a}/issue"
              payload: {}
              as: Designer
              captures: { quote_a_total: $.data.total_cents }
            - call: "POST /quotes/${quote_a}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_a}"
              captures: { quote_a_v: $.data.version }
            - call: "POST /deposits"
              payload: { project_id: "${proj_a}", quote_id: "${quote_a}", amount_cents: 141379 }
              as: PlatformAdmin
              captures: { dep_a: $.data.id }
            - call: "POST /deposits/${dep_a}/capture"
              payload: { expected_quote_version: "${quote_a_v}" }
              as: PlatformAdmin
            - call: "POST /projects/${proj_a}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas_c: $.data.id }
            - call: "POST /projects/${proj_a}/component-configs"
              payload: { space_measure_id: "${meas_c}", material_grade: "PREMIUM_WOOD", line_items: [ { component_type: "SHELF", quantity: 30, unit_price_cents: 5000 }, { component_type: "DRAWER", quantity: 10, unit_price_cents: 12000 } ] }
              as: Designer
              captures: { cfg_c: $.data.id }
            - call: "POST /component-configs/${cfg_c}/finalize"
              payload: {}
              as: Designer
            - call: "POST /change-orders"
              payload: { project_id: "${proj_a}", base_quote_id: "${quote_a}", change_type: "CONFIG_REVISION", revised_config_id: "${cfg_c}" }
              as: Designer
              captures: { co_a: $.data.id }
            - call: "POST /change-orders/${co_a}/approve"
              payload: {}
              as: Designer
              captures: { co_delta: $.data.delta_cents }
          trigger:
            - call: "GET /projects/${proj_a}/quotes"
              payload: {}
              as: Designer
          assert:
            - "Quote.${quote_a}.total_cents == 403941"
            - "ChangeOrder.${co_a}.delta_cents == 100466"
            - "the revised price (403941 + 100466 == 504407) != estimate price 403941"

      - name: balance_provisional_at_deposit_vs_final_after_financing
        grounds:
          - calculations.balance_reconciliation
          - state_machines.Deposit.PENDING_to_CAPTURED
          - state_machines.FinancingApplication.APPROVED_to_FUNDED
        distinguishing_aspect: |
          Subject is balance accounting on the Project domain (distinct from quote pricing): the
          provisional_at_deposit variant (financed term 0) yields a higher balance_due_cents than the
          final_post_financing variant (financed amount subtracted) for the same captured deposit.
        test_recipe:
          setup:
            - "Customer (zip 50000 -> EAST), Project (GARAGE) progressed to DEPOSIT_PAID"
            - "ComponentConfig B FINALIZED: MELAMINE, SHELF x12@4000 + PANEL x6@3000, total_units 18"
            - "Quote QB issued total_cents 71280, accepted, deposit 17820 captured -> balance 53460 (provisional)"
            - "FinancingApplication submitted requesting 57024, approved (approved_amount 57024), funded"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "b@x.com", full_name: "Cust B", zip_code: "50000" }
              as: Anonymous
              captures: { cust_b: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_b}", room_type: "GARAGE" }
              as: Designer
              captures: { proj_b: $.data.id }
            - call: "POST /projects/${proj_b}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj_b}/space-measures"
              payload: { wall_count: 1, linear_feet: 20, ceiling_height_in: 108 }
              as: Designer
              captures: { meas_b: $.data.id }
            - call: "POST /projects/${proj_b}/component-configs"
              payload: { space_measure_id: "${meas_b}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 12, unit_price_cents: 4000 }, { component_type: "PANEL", quantity: 6, unit_price_cents: 3000 } ] }
              as: Designer
              captures: { cfg_b: $.data.id }
            - call: "POST /component-configs/${cfg_b}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj_b}/quotes"
              payload: { component_config_id: "${cfg_b}" }
              as: Designer
              captures: { quote_b: $.data.id }
            - call: "POST /quotes/${quote_b}/issue"
              payload: {}
              as: Designer
            - call: "POST /quotes/${quote_b}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { quote_b_v: $.data.version }
            - call: "POST /deposits"
              payload: { project_id: "${proj_b}", quote_id: "${quote_b}", amount_cents: 17820 }
              as: PlatformAdmin
              captures: { dep_b: $.data.id }
            - call: "POST /deposits/${dep_b}/capture"
              payload: { expected_quote_version: "${quote_b_v}" }
              as: PlatformAdmin
            - call: "GET /projects/${proj_b}/balance"
              payload: {}
              as: PlatformAdmin
              captures: { bal_provisional: $.data.balance_due_cents }
            - call: "POST /financing-applications"
              payload: { project_id: "${proj_b}", quote_id: "${quote_b}", requested_amount_cents: 57024, term_months: 12 }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { fin_b: $.data.id }
            - call: "POST /financing-applications/${fin_b}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
            - call: "POST /_financing/decision"
              payload: { financing_application_id: "${fin_b}", decision: "APPROVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /financing-applications/${fin_b}/fund"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Project.${proj_b}.balance_due_cents == 71280 - 17820 - 57024 == -3564 floored to 0"
            - "GET balance bal_provisional captured before funding == 53460"
            - "final balance_due_cents (after fund) == 0 (max(53460-57024,0))"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_pricing_tiered_material_volume_promo_mode_a
        grounds:
          - calculations.quote_estimate_pricing
          - entities.ComponentConfig.fields.material_grade
          - entities.ComponentConfig.fields.total_units
        distinguishing_aspect: |
          Mode (a): >=3 inputs (material_grade multiplier, volume tier on total_units, promo rate) with
          non-linear interaction (promo applied to post-volume subtotal, then min-capped) — a tiered
          selection plus conditional branch, not a flat linear sum.
        test_recipe:
          setup:
            - "Customer (zip 90001 -> WEST), Project WALK_IN_CLOSET in DESIGNING with measure"
            - "ComponentConfig FINALIZED: WOOD, SHELF x30@5000 + DRAWER x10@12000 + ACCESSORY x4@2000, total_units 40 (tier2 5%)"
            - "Quote DRAFT created with promo_code SPRING10"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "a2@x.com", full_name: "Cust A2", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "WOOD", line_items: [ { component_type: "SHELF", quantity: 30, unit_price_cents: 5000 }, { component_type: "DRAWER", quantity: 10, unit_price_cents: 12000 }, { component_type: "ACCESSORY", quantity: 4, unit_price_cents: 2000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}", promo_code: "SPRING10" }
              as: Designer
              captures: { quote: $.data.id }
          trigger:
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
          assert:
            - "Quote.${quote}.subtotal_cents == 389200"
            - "Quote.${quote}.discount_cents == 56434"
            - "Quote.${quote}.tax_cents == 30781"
            - "Quote.${quote}.total_cents == 363547"

      - name: deposit_requirement_round_after_multiply_mode_b
        grounds:
          - calculations.deposit_requirement
          - entities.Project.fields.room_type
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — required_deposit = round_half_up(total_cents *
          pct) computed from the already-rounded quote total, not from a re-summed pre-tax base; the pinned
          order produces 141379, distinct from any sum-then-round alternative.
        test_recipe:
          setup:
            - "Customer (zip 90001 -> WEST), Project WALK_IN_CLOSET, config WOOD 40 units"
            - "Quote total_cents 403941, ACCEPTED (deposit pct WALK_IN = 0.35 -> required 141379)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "a3@x.com", full_name: "Cust A3", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "WOOD", line_items: [ { component_type: "SHELF", quantity: 30, unit_price_cents: 5000 }, { component_type: "DRAWER", quantity: 10, unit_price_cents: 12000 }, { component_type: "ACCESSORY", quantity: 4, unit_price_cents: 2000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /quotes/${quote}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /deposits"
              payload: { project_id: "${proj}", quote_id: "${quote}", amount_cents: 141378 }
              as: PlatformAdmin
          assert:
            - "response.error_id == ERR_DEPOSIT_BELOW_MINIMUM"
            - "required_deposit_cents == round_half_up(403941 * 0.35) == 141379; 141378 is exactly one cent below"

      - name: financing_amortization_circular_dependency_mode_c
        grounds:
          - calculations.financing_approval
          - state_machines.FinancingApplication.SUBMITTED_to_APPROVED
          - entities.FinancingApplication.fields.term_months
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — approved_amount depends on
          quote total (LTV cap), monthly_payment depends on approved_amount, APR depends on term; the
          scaffold pins compute-approved-then-payment so the values are well-defined (term24 -> 2527).
        test_recipe:
          setup:
            - "Customer (zip 50000 -> EAST), Project GARAGE, config MELAMINE 18 units, Quote total 71280 ACCEPTED"
            - "FinancingApplication requesting 57024 (== 0.80 LTV cap), term 24, SUBMITTED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "b2@x.com", full_name: "Cust B2", zip_code: "50000" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "GARAGE" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 1, linear_feet: 20, ceiling_height_in: 108 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 12, unit_price_cents: 4000 }, { component_type: "PANEL", quantity: 6, unit_price_cents: 3000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /quotes/${quote}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /financing-applications"
              payload: { project_id: "${proj}", quote_id: "${quote}", requested_amount_cents: 57024, term_months: 24 }
              as: Customer
              as_user_id: "${cust}"
              captures: { fin: $.data.id }
            - call: "POST /financing-applications/${fin}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /_financing/decision"
              payload: { financing_application_id: "${fin}", decision: "APPROVE" }
              as: PlatformAdmin
          assert:
            - "FinancingApplication.${fin}.approved_amount_cents == 57024"
            - "FinancingApplication.${fin}.monthly_payment_cents == 2527"
            - "FinancingApplication.${fin}.status == APPROVED"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: install_job_parallel_sched_and_completion_dimensions
        grounds:
          - state_machines.InstallJob.BOOKED_to_RESCHEDULING
          - state_machines.InstallJob.NOT_STARTED_to_IN_PROGRESS
          - entities.InstallJob.fields.sched_status
          - entities.InstallJob.fields.completion_status
        distinguishing_aspect: |
          InstallJob carries two independent state axes: sched_status (PROPOSED->BOOKED->RESCHEDULING->BOOKED,
          cyclic) and completion_status (NOT_STARTED->IN_PROGRESS->DONE); booking a job leaves
          completion_status==NOT_STARTED, proving the axes evolve independently on one row.
        test_recipe:
          setup:
            - "Project READY_TO_INSTALL with ManufactureOrder READY (promised_ready_date 2026-05-05)"
            - "Crew WEST capacity 100; InstallJob proposed window 2026-05-10 then BOOKED"
            - "clock at 2026-05-10T08:00:00Z (>= window_start) so completion start is allowed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "p3@x.com", full_name: "P3", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 10, unit_price_cents: 5000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /quotes/${quote}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { quote_v: $.data.version }
            - call: "POST /deposits"
              payload: { project_id: "${proj}", quote_id: "${quote}", amount_cents: 5000000 }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/capture"
              payload: { expected_quote_version: "${quote_v}" }
              as: PlatformAdmin
            - call: "GET /manufacture-orders"
              payload: { project_id: "${proj}" }
              as: ManufacturingOps
              captures: { mo: "$.data[0].id" }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: ManufacturingOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacture-orders/${mo}/complete"
              payload: {}
              as: ManufacturingOps
            - call: "POST /crews"
              payload: { crew_name: "West-1", region: "WEST", daily_capacity_units: 100 }
              as: Scheduler
              captures: { crew: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${proj}", manufacture_order_id: "${mo}", crew_id: "${crew}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T16:00:00Z" }
              as: Scheduler
              captures: { job: $.data.id }
            - call: "POST /install-jobs/${job}/book"
              payload: {}
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /install-jobs/${job}/start"
              payload: {}
              as: Scheduler
          assert:
            - "InstallJob.${job}.sched_status == BOOKED"
            - "InstallJob.${job}.completion_status == IN_PROGRESS"
            - "Project.${proj}.status == INSTALLING"

      - name: warranty_claim_branch_fork_adjustment_vs_replacement
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_ADJUSTMENT_SCHEDULED
          - state_machines.WarrantyClaim.APPROVED_to_REPLACEMENT_ORDERED
          - entities.WarrantyClaim.fields.defect_type
        distinguishing_aspect: |
          WarrantyClaim forks at APPROVED into two branches with divergent side-effect sets:
          FIT/FINISH -> ADJUSTMENT_SCHEDULED, HARDWARE/STRUCTURAL -> REPLACEMENT_ORDERED; a FIT claim
          taking the adjustment branch lands ADJUSTMENT_SCHEDULED, on a different entity than instance 1.
        test_recipe:
          setup:
            - "Project COMPLETED with a DONE InstallJob (install done at 2026-05-10)"
            - "WarrantyClaim filed within 365 days for defect_type FIT (covered==true), then APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "p4@x.com", full_name: "P4", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
