      - name: version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.Supplier.fields.version
          - endpoints[POST /mfg/suppliers]
          - endpoints[POST /mfg/suppliers/{id}/qualify]
          - endpoints[POST /mfg/suppliers/{id}/disqualify]
          - endpoints[POST /mfg/suppliers/{id}/requalify]
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: >
          The invariant the two OCC rules rest on, isolated on the entity with the longest write cycle: version
          starts at 1 on create and advances by exactly 1 on each of qualify, disqualify, requalify and re-qualify,
          while the reads interleaved between them - including the collection read - leave it untouched. A supplier
          with no lots is used deliberately so no cascade contributes extra bumps and the count stays exact.
        test_recipe:
          setup:
            - "The clock reads 2026-08-01T00:00:00Z."
            - "Supplier Northline Valves has no component lots at all, so the disqualification cascade is a no-op and blocked_lot_count stays 0."
            - "Because blocked_lot_count is 0 the requalified supplier may be scored again immediately."
          setup_api_calls:

          trigger:
            - call: "POST /mfg/suppliers"
              payload: { name: "Northline Valves", component_category: "GAS_VALVE", audit_score: 94, defect_ppm: 1200, open_capa_count: 0 }
              as: SupplierQualityManager
              captures: { s3_id: $.data.id }
            - call: "GET /mfg/suppliers/${s3_id}"
              payload: {}
              as: SupplierQualityManager
            - call: "GET /mfg/suppliers"
              payload: {}
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${s3_id}/qualify"
              payload: { audit_score: 94, defect_ppm: 1200, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "GET /mfg/suppliers/${s3_id}"
              payload: {}
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${s3_id}/disqualify"
              payload: { reason_code: "AUDIT_FAILURE" }
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${s3_id}/requalify"
              payload: { reason_code: "CAPA_CLOSED" }
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${s3_id}/qualify"
              payload: { audit_score: 94, defect_ppm: 1200, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "GET /mfg/suppliers/${s3_id}"
              payload: {}
              as: SupplierQualityManager
          assert:
            - "the create response carries version == 1 and qualification_status == 'PENDING'"
            - "both reads before the first qualify still report version == 1"
            - "the qualify response carries version == 2 with qualification_status == 'QUALIFIED'"
            - "the read after the qualify still reports version == 2"
            - "the disqualify response carries version == 3 with qualification_status == 'DISQUALIFIED', qualified_until null and blocked_lot_count 0"
            - "the requalify response carries version == 4 with qualification_status == 'PENDING' and qualification_score null"
            - "the second qualify response carries version == 5 with qualification_status == 'QUALIFIED' and qualification_score == 91.40"
            - "the final read reports version == 5, so the four reads in the sequence contributed no increment"
      - name: held_unit_count_reconciles_across_hold_release_and_scrap
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ProductModel.fields.held_unit_count
          - state_machines.HeaterUnit.HELD_to_ASSEMBLED
          - state_machines.HeaterUnit.HELD_to_SCRAPPED
          - state_machines.ProductModel.RELEASED_to_RESTRICTED
          - state_machines.ProductModel.RESTRICTED_to_RELEASED
          - validations[priority 11]
          - validations[priority 32]
          - errors[ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED]
          - errors[ERR_HELD_UNITS_REMAIN]
          - complexity_profile.complexity_layers.derived_field_reconciliation
        distinguishing_aspect: >
          held_unit_count is a recomputed field, not a counter, and this walks it up and back down by two DIFFERENT
          exits - one unit leaves the hold by release-hold, the other by being scrapped - to prove the recomputation
          never drifts. It also pins the ordering the layer depends on: the containment must be dispositioned before
          the hold can be released at all, and reaching zero does NOT auto-release the model; only the explicit
          lift-restriction does, and it is refused while the count is still 1.
