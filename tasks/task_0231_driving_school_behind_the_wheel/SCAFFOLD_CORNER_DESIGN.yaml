              payload: { permit_number: "P-AGAIN" }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Student.${stu_id}.status == LICENSED (unchanged)"

      - name: cancel_lesson_inside_cutoff_window_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Lesson.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Student cancel within CANCEL_CUTOFF_HOURS of start returns ERR_INVALID_STATE (409); lesson stays SCHEDULED."
        test_recipe:
          setup: ["PERMITTED student with one SCHEDULED ROAD lesson starting at 2026-06-10T10:00; clock 2026-06-10T09:30 (inside the cutoff)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "CUT_PKG", name: "Cut Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 0, included_online_hours: 0, included_road_hours: 6, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Cut Inst", email: "cutinst@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "CUT-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Cur Cut", email: "curcut@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-CUT" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-06-10T10:00:00.000Z", end_at: "2026-06-10T12:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { les_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:30:00.000Z" }
