scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_expected_reimbursement_provisional_vs_realized
        grounds:
          - calculations.claim_patient_responsibility
          - calculations.claim_ledger_reconciliation
          - entities.Claim.fields.expected_reimbursement_cents
          - entities.Claim.fields.insurance_paid_cents
        distinguishing_aspect: "On the Claim reimbursement domain, the provisional expected_reimbursement_cents (7600, frozen at scrub) diverges from the realized insurance_paid_cents (7000) once the final ERA variant posts."
        test_recipe:
          setup:
            - "Practice (fee_pct 0.06), COMMERCIAL payer (timely 90, appeal 60), APPROVED provider, ACTIVE enrollment, ACTIVE fee schedule pricing 99213=10000 and 93000=5000; clock 2026-06-01."
            - "Claim service 2026-05-15, deductible 3000, coinsurance 0.20, copay 2000, lines 99213 charge 15000 and 93000 charge 8000; scrubbed then accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Alpha Clinic", npi: "1111111111", tax_id: "22-3333333", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222222", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/providers/${prov_id}/credentialing/submit"
              payload: {}
              as: CredentialingSpecialist
            - call: "POST /rcm/providers/${prov_id}/credentialing/decision"
              payload: { decision: "APPROVE", expiration_date: "2027-01-01T00:00:00Z" }
              as: CredentialingSpecialist
            - call: "POST /rcm/payer-enrollments"
              payload: { provider_id: "${prov_id}", payer_id: "${payer_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: CredentialingSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /rcm/payer-enrollments/${enr_id}/activate"
              payload: {}
              as: CredentialingSpecialist
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: AccountManager
              captures: { fs_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 10000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "93000", allowed_amount_cents: 5000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 3000, coinsurance_pct: 0.20, copay_cents: 2000 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 15000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "93000", units: 1, charge_amount_cents: 8000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-1"
              captures: { er_after_scrub: $.data.expected_reimbursement_cents }
            - call: "POST /rcm/claims/${claim_id}/submit"
              payload: {}
              as: Biller
              as_user_id: "biller-1"
            - call: "POST /rcm/claims/${claim_id}/accept"
              payload: {}
              as: Biller
              captures: { claim_v: $.data.version }
            - call: "POST /rcm/remittances"
              payload: { payer_id: "${payer_id}", remittance_ref: "RA-1", total_amount_cents: 7000 }
              as: PaymentPoster
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /rcm/remittances/${rem_id}/postings"
              payload: { claim_id: "${claim_id}", insurance_paid_cents: 7000, patient_responsibility_cents: 8000, adjustment_cents: 8000, expected_claim_version: "${claim_v}" }
              as: PaymentPoster
              captures: { posted_claim_status: $.data.status }
          assert:
            - "Claim.${claim_id}.expected_reimbursement_cents == 7600"
            - "Claim.${claim_id}.insurance_paid_cents == 7000"
            - "Claim.${claim_id}.expected_reimbursement_cents != Claim.${claim_id}.insurance_paid_cents"
            - "Claim.${claim_id}.status == PAID"
      - name: practice_billing_fee_charge_based_vs_collection_based
        grounds:
          - calculations.practice_billing_fee
          - entities.Practice.fields.billing_fee_pct
          - entities.Claim.fields.billed_amount_cents
          - entities.Claim.fields.insurance_paid_cents
        distinguishing_aspect: "On the Practice commission domain (different entity from claim reimbursement), charge_based_fee_cents (1380 = 6% of billed 23000) diverges from collection_based_fee_cents (420 = 6% of collected 7000) for the same PAID claim."
        test_recipe:
          setup:
            - "Same practice/payer/provider/fee-schedule as the reimbursement instance; one claim scrubbed, accepted, and paid with insurance_paid 7000 so it is PAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Alpha Clinic", npi: "1111111111", tax_id: "22-3333333", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222222", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/providers/${prov_id}/credentialing/submit"
              payload: {}
              as: CredentialingSpecialist
            - call: "POST /rcm/providers/${prov_id}/credentialing/decision"
              payload: { decision: "APPROVE", expiration_date: "2027-01-01T00:00:00Z" }
              as: CredentialingSpecialist
            - call: "POST /rcm/payer-enrollments"
              payload: { provider_id: "${prov_id}", payer_id: "${payer_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: CredentialingSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /rcm/payer-enrollments/${enr_id}/activate"
              payload: {}
              as: CredentialingSpecialist
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: AccountManager
              captures: { fs_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 10000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "93000", allowed_amount_cents: 5000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 3000, coinsurance_pct: 0.20, copay_cents: 2000 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 15000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "93000", units: 1, charge_amount_cents: 8000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-1"
            - call: "POST /rcm/claims/${claim_id}/submit"
              payload: {}
              as: Biller
              as_user_id: "biller-1"
            - call: "POST /rcm/claims/${claim_id}/accept"
              payload: {}
              as: Biller
              captures: { claim_v: $.data.version }
            - call: "POST /rcm/remittances"
              payload: { payer_id: "${payer_id}", remittance_ref: "RA-1", total_amount_cents: 7000 }
              as: PaymentPoster
              captures: { rem_id: $.data.id }
            - call: "POST /rcm/remittances/${rem_id}/postings"
              payload: { claim_id: "${claim_id}", insurance_paid_cents: 7000, patient_responsibility_cents: 8000, adjustment_cents: 8000, expected_claim_version: "${claim_v}" }
              as: PaymentPoster
          trigger:
            - call: "GET /rcm/practices/${prac_id}/billing-fee"
              payload: {}
              as: AccountManager
              captures: { charge_fee: $.data.charge_based_fee_cents, coll_fee: $.data.collection_based_fee_cents }
          assert:
            - "response.data.charge_based_fee_cents == 1380"
            - "response.data.collection_based_fee_cents == 420"
            - "response.data.charge_based_fee_cents != response.data.collection_based_fee_cents"
  - rule_id: combinatorial_formula
    instances:
      - name: patient_responsibility_min_cap_binds
        grounds:
          - calculations.claim_patient_responsibility
          - entities.Claim.fields.patient_responsibility_cents
          - entities.Claim.fields.expected_reimbursement_cents
          - entities.Claim.fields.contractual_adjustment_cents
        distinguishing_aspect: "Mode (a): the 4-input nested min/max binds the outer cap — deductible_applied(5000)+coinsurance(0)+copay(2000)=7000 exceeds allowed 5000, so patient_responsibility_cents is capped to 5000 and expected_reimbursement_cents is 0."
        test_recipe:
          setup:
            - "ACTIVE fee schedule prices 99213=5000; claim has deductible 10000 (>= allowed), coinsurance 0.20, copay 2000, one line 99213 charge 9000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Beta Clinic", npi: "1111111112", tax_id: "22-3333334", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: AccountManager
              captures: { fs_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 5000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222223", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 10000, coinsurance_pct: 0.20, copay_cents: 2000 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 9000 }
              as: Coder
          trigger:
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-2"
              captures: { pr: $.data.patient_responsibility_cents }
          assert:
            - "Claim.${claim_id}.patient_responsibility_cents == 5000"
            - "Claim.${claim_id}.expected_reimbursement_cents == 0"
            - "Claim.${claim_id}.contractual_adjustment_cents == 4000"
            - "Claim.${claim_id}.outstanding_balance_cents == 0"
      - name: billing_fee_round_per_claim_then_sum
        grounds:
          - calculations.practice_billing_fee
          - entities.Practice.fields.billing_fee_pct
          - entities.Claim.fields.billed_amount_cents
        distinguishing_aspect: "Mode (b): two claims each billed 1250 at fee_pct 0.05 give round(62.5)=63 per claim summed to 126 (round-per-claim-then-sum), NOT the 125 that sum-then-round (round(2500*0.05)=125) would yield."
        test_recipe:
