# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3012_white_label_delivery_as_service_fulfillment
# Two instances per Difficulty Rule (§0.5), grounded in SCAFFOLD.yaml §1.1–§1.7.
# Shared fixture policy "P1" (literal payload, merchant-scoped):
#   distance_bands: [{max_m:3000,base_cents:500,per_100m_cents:0},
#                    {max_m:8000,base_cents:500,per_100m_cents:25},
#                    {max_m:15000,base_cents:1750,per_100m_cents:40}]
#   value_tiers: [{min_order_value_cents:10000,surcharge_cents:200},
#                 {min_order_value_cents:50000,surcharge_cents:500}]
#   peak_windows: [{start_local_hhmm:"11:00",end_local_hhmm:"14:00"},
#                  {start_local_hhmm:"17:00",end_local_hhmm:"21:00"}]
#   peak_uplift_pct: 0.25, surge_passthrough_pct: 0.5
#   effective_from: 2026-01-01T00:00:00Z, effective_until: 2027-01-01T00:00:00Z
# Distance anchors (store lat 0.0 lng 0.0, timezone "UTC"):
#   dropoff (0.02,0) -> 2226m (band A); (0.05,0) -> 5566m (band B);
#   (0.072,0) -> 8015m (band C); (0.01,0) -> 1113m (band A).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: delivery_fee_quoted_vs_final_surge_divergence
        grounds:
          - calculations.delivery_fee
          - entities.DeliveryOrder.fields.quoted_fee_cents
          - entities.DeliveryOrder.fields.merchant_invoice_cents
        distinguishing_aspect: "Same quote inputs price differently under the two surge variants: quoted uses quote-time surge 1.5 (quoted_fee_cents 2532) while the final variant recomputes the surge component at dispatch-time surge 2.0 and passes only 50% of the surge delta through, producing merchant_invoice_cents 2954 — a different number for identical order data."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Merchant ACTIVE with billing 100000, store at (0,0) UTC radius 20000, policy P1 ACTIVE. Platform surge 1.5 at quote time and 2.0 at dispatch time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { name: "DV Merchant", billing_balance_cents: 100000, default_refund_split_merchant_pct: 50, late_credit_enabled: true }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /merchants/${m_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /merchants/${m_id}/stores"
              payload: { name: "DV Store", address_text: "1 Origin Way", lat: 0.0, lng: 0.0, delivery_radius_m: 20000, timezone: "UTC" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /merchants/${m_id}/pricing-policies"
              payload: { distance_bands: [{max_m: 3000, base_cents: 500, per_100m_cents: 0}, {max_m: 8000, base_cents: 500, per_100m_cents: 25}, {max_m: 15000, base_cents: 1750, per_100m_cents: 40}], value_tiers: [{min_order_value_cents: 10000, surcharge_cents: 200}, {min_order_value_cents: 50000, surcharge_cents: 500}], peak_windows: [{start_local_hhmm: "11:00", end_local_hhmm: "14:00"}, {start_local_hhmm: "17:00", end_local_hhmm: "21:00"}], peak_uplift_pct: 0.25, surge_passthrough_pct: 0.5, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformAdmin
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/pricing-policies/${p_id}/activate"
              payload: { expected_merchant_version: "${m_v}" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /couriers"
              payload: { name: "DV Courier", max_active_deliveries: 4 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /_surge/set_current"
              payload: { multiplier: 1.5 }
              as: PlatformAdmin
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.05, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 12000, pickup_ready_at: "2026-09-01T12:30:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q_id: $.data.id, q_fee: $.data.quoted_fee_cents }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q_id}", customer_reference: "DV-1", idempotency_key: "dv-1" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /delivery-orders/${o_id}/accept"
              payload: { promised_at: "2026-09-01T13:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o_id}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "GET /couriers/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c_v_now: $.data.version }
            - call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "${c_id}", order_ids: ["${o_id}"], dispatch_window_start: "2026-09-01T12:00:00Z", dispatch_window_end: "2026-09-01T13:00:00Z", expected_courier_version: "${c_v_now}" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_surge/set_current"
              payload: { multiplier: 2.0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /delivery-batches/${b_id}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "GET /delivery-orders/${o_id}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
          assert:
            - "DeliveryOrder.${o_id}.quoted_fee_cents == 2532"
            - "DeliveryOrder.${o_id}.final_fee_cents == 3376"
            - "DeliveryOrder.${o_id}.merchant_invoice_cents == 2954"
            - "DeliveryOrder.${o_id}.merchant_invoice_cents != DeliveryOrder.${o_id}.quoted_fee_cents"
            - "DeliveryOrder.${o_id}.batch_fee_share_cents == 550"

      - name: sla_attainment_gross_vs_fault_adjusted
        grounds:
          - calculations.sla_attainment
          - entities.SlaReport.fields.attainment_rate_gross
          - entities.SlaReport.fields.attainment_rate_fault_adjusted
        distinguishing_aspect: "Two attainment variants over the same report window on SlaReport: GROSS counts both late orders (2/3 late -> 0.3333, below the 0.97 credit trigger), while FAULT_ADJUSTED excludes the late order whose settled claim is MERCHANT_FULFILLMENT fault (1/2 late -> 0.5) — different rates from identical delivery data, and credits are keyed to the GROSS variant only."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Merchant (split 50, late_credit_enabled false) with store at (0,0) and policy P1 ACTIVE. Three orders delivered in-window: o1 late 700s (courier fault), o2 late 700s (later settled as MERCHANT_FULFILLMENT), o3 on time. o2's claim settled before finalize."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { name: "SLA Merchant", billing_balance_cents: 100000, default_refund_split_merchant_pct: 50, late_credit_enabled: false }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /merchants/${m_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /merchants/${m_id}/stores"
              payload: { name: "SLA Store", address_text: "1 Origin Way", lat: 0.0, lng: 0.0, delivery_radius_m: 20000, timezone: "UTC" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /merchants/${m_id}/pricing-policies"
              payload: { distance_bands: [{max_m: 3000, base_cents: 500, per_100m_cents: 0}, {max_m: 8000, base_cents: 500, per_100m_cents: 25}, {max_m: 15000, base_cents: 1750, per_100m_cents: 40}], value_tiers: [{min_order_value_cents: 10000, surcharge_cents: 200}, {min_order_value_cents: 50000, surcharge_cents: 500}], peak_windows: [{start_local_hhmm: "11:00", end_local_hhmm: "14:00"}, {start_local_hhmm: "17:00", end_local_hhmm: "21:00"}], peak_uplift_pct: 0.25, surge_passthrough_pct: 0.5, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformAdmin
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/pricing-policies/${p_id}/activate"
              payload: { expected_merchant_version: "${m_v}" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /couriers"
              payload: { name: "SLA Courier", max_active_deliveries: 4 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            # order 1 (late, courier fault)
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q1: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q1}", customer_reference: "SLA-1", idempotency_key: "sla-1" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o1: $.data.id }
            - call: "POST /delivery-orders/${o1}/accept"
              payload: { promised_at: "2026-09-01T01:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o1}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            # order 2 (late, merchant fault later settled)
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "11 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q2: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q2}", customer_reference: "SLA-2", idempotency_key: "sla-2" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o2: $.data.id }
            - call: "POST /delivery-orders/${o2}/accept"
              payload: { promised_at: "2026-09-01T01:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o2}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            # order 3 (on time)
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "12 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q3: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q3}", customer_reference: "SLA-3", idempotency_key: "sla-3" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o3: $.data.id }
            - call: "POST /delivery-orders/${o3}/accept"
              payload: { promised_at: "2026-09-01T02:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o3}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            # batch o1+o2 with courier, dispatch at default surge 1.0
            - call: "GET /couriers/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c_v: $.data.version }
            - call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "${c_id}", order_ids: ["${o1}", "${o2}"], dispatch_window_start: "2026-09-01T00:30:00Z", dispatch_window_end: "2026-09-01T01:30:00Z", expected_courier_version: "${c_v}" }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /delivery-batches/${b1}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o1}/confirm-pickup"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o1}/start-transit"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o2}/confirm-pickup"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o2}/start-transit"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:11:40Z" }
              as: PlatformAdmin
            - call: "POST /delivery-orders/${o1}/complete-delivery"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o2}/complete-delivery"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            # order 3 solo batch, delivered on time
            - call: "POST /couriers"
              payload: { name: "SLA Courier 2", max_active_deliveries: 4 }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "GET /couriers/${c2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c2_v: $.data.version }
            - call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "${c2_id}", order_ids: ["${o3}"], dispatch_window_start: "2026-09-01T01:00:00Z", dispatch_window_end: "2026-09-01T02:00:00Z", expected_courier_version: "${c2_v}" }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /delivery-batches/${b2}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c2_id}"
            - call: "POST /delivery-orders/${o3}/confirm-pickup"
              payload: {}
              as: Courier
              as_user_id: "${c2_id}"
            - call: "POST /delivery-orders/${o3}/start-transit"
              payload: {}
              as: Courier
              as_user_id: "${c2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:40:00Z" }
              as: PlatformAdmin
            - call: "POST /delivery-orders/${o3}/complete-delivery"
              payload: {}
              as: Courier
              as_user_id: "${c2_id}"
            # settle MERCHANT_FULFILLMENT claim on o2 (billing SETTLED)
            - call: "POST /refund-claims"
              payload: { delivery_order_id: "${o2}", fault_code: "MERCHANT_FULFILLMENT", claimed_amount_cents: 500 }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { cl2: $.data.id }
            - call: "POST /refund-claims/${cl2}/start-review"
              payload: {}
              as: SupportAgent
            - call: "POST /refund-claims/${cl2}/decide"
              payload: { decision: "APPROVE" }
              as: SupportAgent
            - call: "POST /refund-claims/${cl2}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /merchants/${m_id}/sla-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /sla-reports/${r_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sla-reports/${r_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SlaReport.${r_id}.total_deliveries == 3"
            - "SlaReport.${r_id}.late_deliveries_gross == 2"
            - "SlaReport.${r_id}.attainment_rate_gross == 0.3333"
            - "SlaReport.${r_id}.attainment_rate_fault_adjusted == 0.5"
            - "SlaReport.${r_id}.attainment_rate_gross != SlaReport.${r_id}.attainment_rate_fault_adjusted"
            - "GET /sla-reports/${r_id}/service-credits returns exactly 2 rows of amount_cents 125 each (credits keyed to GROSS late population)"
            - "Merchant.${m_id}.credit_balance_cents == 0 (late_credit_enabled false — no auto-apply)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: delivery_fee_four_input_nonlinear_assembly
        grounds:
          - calculations.delivery_fee
          - entities.DeliveryQuote.fields.peak_uplift_cents
          - entities.DeliveryQuote.fields.surge_component_cents
        distinguishing_aspect: "Mode (a): the fee combines four inputs (distance band, order-value tier, peak window, surge) with non-linear interaction — the peak uplift compounds into the base the surge multiplier is applied to: 5566m band fee 1150 + value 200 -> base 1350, peak uplift round_half_up(1350*0.25) == 338, surge component round_half_up(1688*0.5) == 844, total 2532."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Merchant ACTIVE with store (0,0) UTC radius 20000 and policy P1 ACTIVE; platform surge 1.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { name: "CF Merchant", billing_balance_cents: 100000, default_refund_split_merchant_pct: 50, late_credit_enabled: true }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /merchants/${m_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /merchants/${m_id}/stores"
              payload: { name: "CF Store", address_text: "1 Origin Way", lat: 0.0, lng: 0.0, delivery_radius_m: 20000, timezone: "UTC" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /merchants/${m_id}/pricing-policies"
              payload: { distance_bands: [{max_m: 3000, base_cents: 500, per_100m_cents: 0}, {max_m: 8000, base_cents: 500, per_100m_cents: 25}, {max_m: 15000, base_cents: 1750, per_100m_cents: 40}], value_tiers: [{min_order_value_cents: 10000, surcharge_cents: 200}, {min_order_value_cents: 50000, surcharge_cents: 500}], peak_windows: [{start_local_hhmm: "11:00", end_local_hhmm: "14:00"}, {start_local_hhmm: "17:00", end_local_hhmm: "21:00"}], peak_uplift_pct: 0.25, surge_passthrough_pct: 0.5, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformAdmin
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/pricing-policies/${p_id}/activate"
              payload: { expected_merchant_version: "${m_v}" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /_surge/set_current"
              payload: { multiplier: 1.5 }
              as: PlatformAdmin
          trigger:
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.05, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 12000, pickup_ready_at: "2026-09-01T12:30:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q_id: $.data.id }
          assert:
            - "DeliveryQuote.${q_id}.distance_m == 5566"
            - "DeliveryQuote.${q_id}.band_fee_cents == 1150"
            - "DeliveryQuote.${q_id}.value_surcharge_cents == 200"
            - "DeliveryQuote.${q_id}.peak_uplift_cents == 338"
            - "DeliveryQuote.${q_id}.surge_component_cents == 844"
            - "DeliveryQuote.${q_id}.quoted_fee_cents == 2532"

      - name: batch_fee_allocation_per_order_floor_with_remainder
        grounds:
          - calculations.batch_fee_allocation
          - entities.DeliveryOrder.fields.batch_fee_share_cents
          - entities.DeliveryBatch.fields.courier_cost_cents
        distinguishing_aspect: "Mode (b): nested rounding with pinned order — courier cost 700 (400 + 150*2) is floored PER ORDER (540 and 159) and the 1-cent remainder goes to the earliest-created order (541), so sum(shares) == 700 exactly; sum-then-round would give a different allocation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Merchant ACTIVE, store (0,0) UTC radius 20000, policy P1 ACTIVE, surge fixed at 2.0 from before either quote. o1 created first (12:30 peak pickup, value 12000, d 5566 -> invoice 3376); o2 created second (09:00 off-peak, value 5000, d 2226 -> invoice 1000). Both READY_FOR_PICKUP in one batch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_surge/set_current"
              payload: { multiplier: 2.0 }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { name: "BA Merchant", billing_balance_cents: 100000, default_refund_split_merchant_pct: 50, late_credit_enabled: true }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /merchants/${m_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /merchants/${m_id}/stores"
              payload: { name: "BA Store", address_text: "1 Origin Way", lat: 0.0, lng: 0.0, delivery_radius_m: 20000, timezone: "UTC" }
              as: Merchant
              as_user_id: "${m_id}"
