# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3115_out_network_claim_repricing_negotiated_discount_network
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1-§1.7 and drives empty-DB -> precondition via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contracted_network_vs_medicare_schedule_same_lines
        grounds:
          - calculations.repricing_allowability
          - calculations.repricing_allowability.variants.contracted_vs_schedule
          - state_machines.Claim.PENDING_LINES_to_PRICED
          - entities.Claim.fields.allowed_amount_cents
        distinguishing_aspect: |
          Two valid pricing algorithms applied to identical line data produce
          different allowed amounts: the CONTRACTED_NETWORK variant bases the price
          on billed charges (round(60000 * (1 - 0.40)) = 36000) while the
          PERCENT_OF_MEDICARE variant bases it on the Medicare schedule
          (round(10000 * 1.10 * 2) = 22000, then round(22000 * 1.50) = 33000) —
          a 3000-cent divergence for the same claim line.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (server default)."
            - "Payer P1 with fee config; Provider PR1 with an ACTIVE NetworkAgreement (discount 0.40, interval covering 2026-09-10)."
            - "MedicareFeeScheduleEntry for 99283/R1: base_rate_cents 10000, geographic_adjustment_factor 1.10."
            - "Two OON PROFESSIONAL policies for P1 on different claim types: ANCILLARY -> CONTRACTED_NETWORK, PROFESSIONAL -> PERCENT_OF_MEDICARE x1.50."
            - "Claim A (ANCILLARY, OUT_OF_NETWORK) and Claim B (PROFESSIONAL, OUT_OF_NETWORK), each with ONE line: 99283, qty 2, unit 30000, region R1 (billed 60000)."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000, transparency_reporting_enabled: true }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000001", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /network-agreements"
              payload: { network_name: "N1", provider_id: "${pr1_id}", discount_percent: 0.40, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "ANCILLARY", network_status: "OUT_OF_NETWORK", methodology: "CONTRACTED_NETWORK", priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "A1", claim_type: "ANCILLARY", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 5000 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_a_id: $.data.id, claim_a_v: $.data.version }
            - call: "POST /claims/${claim_a_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "B1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 5000 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_b_id: $.data.id, claim_b_v: $.data.version }
            - call: "POST /claims/${claim_b_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_a_id}/reprice"
              payload: { expected_claim_version: "${claim_a_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_b_id}/reprice"
              payload: { expected_claim_version: "${claim_b_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "GET /claims/${claim_a_id}"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "GET /claims/${claim_b_id}"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "Claim.${claim_a_id}.allowed_amount_cents == 36000"
            - "Claim.${claim_a_id}.methodology_used == CONTRACTED_NETWORK"
            - "Claim.${claim_b_id}.allowed_amount_cents == 33000"
            - "Claim.${claim_b_id}.methodology_used == PERCENT_OF_MEDICARE"
            - "Claim.${claim_a_id}.allowed_amount_cents != Claim.${claim_b_id}.allowed_amount_cents despite identical line data"

      - name: provisional_price_vs_executed_settlement_divergence
        grounds:
          - calculations.repricing_allowability
          - state_machines.SettlementAgreement.PENDING_SIGNATURES_to_EXECUTED
          - state_machines.Claim.PRICED_to_SETTLED
          - entities.SettlementAgreement.fields.settled_amount_cents
        distinguishing_aspect: |
          The same claim carries two valid valuations on different entity domains:
          the policy-computed price on the Claim (33000) versus the negotiated
          settlement amount on the SettlementAgreement (40000); when the second
          signature executes, the claim's financials flip from the provisional
          policy price to the negotiated price and the savings shrink by 7000.
        test_recipe:
          setup:
            - "Payer P1, Provider PR1 (no network agreement), Medicare entry 99283/R1 (10000, 1.10), policy PROFESSIONAL/OON PERCENT_OF_MEDICARE x1.50."
            - "Claim C (billed 60000, one line 99283 qty 2 unit 30000, patient 5000) PRICED at allowed 33000, savings 32000."
            - "NegotiationCase on C: payer offer 40000 accepted by provider; SettlementAgreement S created PENDING_SIGNATURES with settled_amount_cents 40000."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000002", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "C1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 5000 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_c_id: $.data.id, claim_c_v: $.data.version }
            - call: "POST /claims/${claim_c_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_c_id}/reprice"
              payload: { expected_claim_version: "${claim_c_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_c_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /negotiation-cases/${case_id}/offer"
              payload: { offer_cents: 40000, expected_case_version: "${case_v}" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases/${case_id}/accept"
              payload: {}
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "GET /settlement-agreements"
              payload: { negotiation_case_id: "${case_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { sa_id: "$.data[0].id" }
            - call: "POST /settlement-agreements/${sa_id}/sign"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /settlement-agreements/${sa_id}/sign"
              payload: {}
              as: ProviderRep
              as_user_id: "${pr1_id}"
          assert:
            - "SettlementAgreement.${sa_id}.status == EXECUTED"
            - "Claim.${claim_c_id}.status == SETTLED"
            - "Claim.${claim_c_id}.allowed_amount_cents == 40000 (was 33000 under the policy price)"
            - "Claim.${claim_c_id}.payer_liability_cents == 35000"
            - "Claim.${claim_c_id}.savings_cents == 25000 (was 32000 before execution)"
            - "GET /claims/${claim_c_id}/determinations returns 2 rows; exactly 1 has status ACTIVE and methodology NEGOTIATED; the other is SUPERSEDED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rbp_circular_dependency_pinned_evaluation_order
        grounds:
          - calculations.rbp_amount
          - calculations.repricing_allowability
          - entities.Claim.fields.rbp_amount_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: rbp_amount_cents is defined in
          terms of allowed_amount_cents while the UCR benchmark is defined relative
          to billed charges; the pinned order (allowed first, then gap term
          max(0, benchmark - allowed) x markup 1.20) yields rbp 33000 when the
          benchmark (25000) sits below the allowed (33000) and 43600 when the
          benchmark (40000) exceeds a lower allowed (22000) — an implementation
          that clamps the benchmark or evaluates in the other order gets a
          different number.
        test_recipe:
          setup:
            - "Payer P1, Provider PR1. Medicare entry 99283/R1 (10000, 1.10)."
            - "UCR row 99283/R1: p50 18000, p80 25000; second UCR row 99284/R1: p50 30000, p80 40000."
            - "Policy PROFESSIONAL/OON: REFERENCE_BASED, rbp_markup_percent 1.20, percent_of_medicare 1.50 (used for the allowed base)."
            - "Claim D: one line 99283 qty 2 unit 30000 (billed 60000), patient 0 -> allowed 33000, benchmark 25000 (below allowed)."
            - "Claim E: one line 99284 qty 1 unit 60000 (billed 60000), patient 0 -> allowed round(22000*1.5)=33000 for 99283 analog; here Medicare entry 99284/R1 (10000, 1.10) gives allowed 16500... see pinned values: base = round(10000*1.10*1) = 11000; allowed = round(11000*1.5) = 16500; benchmark 40000 -> rbp = 16500 + round(1.2 * (40000-16500)) = 16500 + 28200 = 44700."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000003", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99284", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /ucr-rates"
              payload: { procedure_code: "99283", region_code: "R1", percentile_50_cents: 18000, percentile_80_cents: 25000 }
              as: NetworkAdmin
            - call: "POST /ucr-rates"
              payload: { procedure_code: "99284", region_code: "R1", percentile_50_cents: 30000, percentile_80_cents: 40000 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "REFERENCE_BASED", percent_of_medicare: 1.50, rbp_markup_percent: 1.20, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "D1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_d_id: $.data.id, claim_d_v: $.data.version }
            - call: "POST /claims/${claim_d_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "E1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_e_id: $.data.id, claim_e_v: $.data.version }
            - call: "POST /claims/${claim_e_id}/lines"
              payload: { procedure_code: "99284", quantity_units: 1, unit_charge_cents: 60000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /claims/${claim_d_id}/reprice"
              payload: { expected_claim_version: "${claim_d_v} + 1", defensibility_notes: "RBP defensibility: benchmark p80 UCR, markup 1.20, allowed floor from Medicare x1.50" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_e_id}/reprice"
              payload: { expected_claim_version: "${claim_e_v} + 1", defensibility_notes: "RBP defensibility: benchmark p80 UCR, markup 1.20, allowed floor from Medicare x1.50" }
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "Claim.${claim_d_id}.allowed_amount_cents == 33000"
            - "Claim.${claim_d_id}.rbp_amount_cents == 33000 (benchmark 25000 below allowed: gap term is 0)"
            - "Claim.${claim_e_id}.allowed_amount_cents == 16500"
            - "Claim.${claim_e_id}.rbp_amount_cents == 44700 (16500 + round(1.20 * 23500))"
            - "Claim.${claim_e_id}.methodology_used == REFERENCE_BASED"

      - name: per_line_then_sum_rounding_order_is_pinned
        grounds:
          - calculations.repricing_allowability
          - entities.RepricingPolicy.fields.rounding_order
          - entities.ClaimLine.fields.allowed_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with two lines whose Medicare base is 9779
          cents each, the pinned PER_LINE_THEN_SUM order yields
          round(9779*1.5) + round(9779*1.5) = 14669 + 14669 = 29338, while the
          forbidden AGGREGATE_THEN_ROUND order yields round(19558*1.5) = 29337 —
          a one-cent divergence that exposes implementations summing before
          rounding.
        test_recipe:
          setup:
            - "Payer P1, Provider PR1. Medicare entry 97110/R2: base_rate_cents 9779, gaf 1.00."
            - "Policy ANCILLARY/OON: PERCENT_OF_MEDICARE x1.50."
            - "Claim F: two lines, each 97110 qty 1 unit 9779 region R2 (billed 19558), patient 0."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000004", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "97110", region_code: "R2", base_rate_cents: 9779, geographic_adjustment_factor: 1.00, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "ANCILLARY", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "F1", claim_type: "ANCILLARY", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_f_id: $.data.id, claim_f_v: $.data.version }
            - call: "POST /claims/${claim_f_id}/lines"
              payload: { procedure_code: "97110", quantity_units: 1, unit_charge_cents: 9779, region_code: "R2" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_f_id}/lines"
              payload: { procedure_code: "97110", quantity_units: 1, unit_charge_cents: 9779, region_code: "R2" }
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /claims/${claim_f_id}/reprice"
              payload: { expected_claim_version: "${claim_f_v} + 2" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "GET /claims/${claim_f_id}/lines"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "each ClaimLine of Claim.${claim_f_id} has allowed_amount_cents == 14669 (round_half_up(9779 * 1.5) per line)"
            - "Claim.${claim_f_id}.allowed_amount_cents == 29338 (per-line-then-sum), not 29337 (aggregate-then-round)"
            - "Claim.${claim_f_id}.billed_amount_cents == 19558 and Claim.${claim_f_id}.allowed_amount_cents == 29338 (allowed exceeds billed on this synthetic rate fixture; savings_cents == -9780 follows from the pinned formula)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_offer_counter_cycle_rounds
        grounds:
          - state_machines.NegotiationCase
          - entities.NegotiationCase.fields.round_count
          - state_machines.NegotiationCase.COUNTERED_to_OFFER_PENDING
        distinguishing_aspect: |
          Cyclic machine on NegotiationCase: OPEN -> OFFER_PENDING -> COUNTERED ->
          OFFER_PENDING -> COUNTERED loops; round_count increments only on the
          provider counter edge, and the fifth counter ejects the cycle into
          terminal EXPIRED — a linear-pipeline implementation cannot express the
          loop or the round-count exit.
        test_recipe:
          setup:
            - "Payer P1, Provider PR1, claim G PRICED (billed 60000, allowed 33000 via Medicare x1.50 on 99283 qty 2 unit 30000, patient 0)."
            - "NegotiationCase on G, payer offer 30000."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000005", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "G1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_g_id: $.data.id, claim_g_v: $.data.version }
            - call: "POST /claims/${claim_g_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_g_id}/reprice"
              payload: { expected_claim_version: "${claim_g_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_g_id}" }
              as: ProviderRep
              as_user_id: "${pr1_id}"
              captures: { case_g_id: $.data.id, case_g_v: $.data.version }
            - call: "POST /negotiation-cases/${case_g_id}/offer"
              payload: { offer_cents: 30000, expected_case_version: "${case_g_v}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_g_v2: $.data.version }
            - call: "POST /negotiation-cases/${case_g_id}/counter"
              payload: { counter_cents: 50000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
          trigger:
            - call: "POST /negotiation-cases/${case_g_id}/offer"
              payload: { offer_cents: 40000, expected_case_version: "${case_g_v2}" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases/${case_g_id}/counter"
              payload: { counter_cents: 45000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
          assert:
            - "NegotiationCase.${case_g_id}.status == COUNTERED after the second cycle (cycle OPEN->OFFER_PENDING->COUNTERED->OFFER_PENDING->COUNTERED completed)"
            - "NegotiationCase.${case_g_id}.round_count == 2 (only provider counters increment)"
            - "NegotiationCase.${case_g_id}.current_offer_cents == 45000"

      - name: settlement_void_compensates_case_back_to_countered
        grounds:
          - state_machines.SettlementAgreement.PENDING_SIGNATURES_to_VOIDED
          - state_machines.NegotiationCase
          - entities.SettlementAgreement.fields.status
        distinguishing_aspect: |
          Branching with revert on SettlementAgreement x NegotiationCase: the
          ACCEPTED branch creates a PENDING_SIGNATURES settlement, and voiding it
          before any signature reverts the negotiation case from ACCEPTED back to
          COUNTERED with current_offer_cents preserved — a different entity than
          the negotiation cycle instance, exercising the revert branch rather
          than the loop.
        test_recipe:
          setup:
            - "Claim H PRICED (same fixture shape as G: billed 60000, allowed 33000, patient 0)."
            - "NegotiationCase: payer offer 30000, provider counter 50000 (case COUNTERED, round_count 1), payer accepts -> ACCEPTED, SettlementAgreement created with settled_amount_cents 50000."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
