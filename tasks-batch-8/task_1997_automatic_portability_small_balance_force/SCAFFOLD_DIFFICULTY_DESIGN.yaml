            - { call: "POST /distribution-cases/${c_b}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_b_v}" }, as: Participant, as_user_id: "${p_b}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /safe-harbor-iras", payload: { distribution_case_id: "${c_a}" }, as: ProviderOps, captures: { ira1: $.data.id } }
