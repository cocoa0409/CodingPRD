      - name: adverse_event_fork_join_regulator_track
        grounds:
          - state_machines.AdverseEvent.REPORTED_to_REPORTED
          - state_machines.AdverseEvent.REVIEW_SIGNED_OFF_to_CLOSED
          - validations[priority=73]
          - errors.ERR_REGULATOR_NOTIFICATION_REQUIRED
        distinguishing_aspect: |
          Entity AdverseEvent, shape fork_join: two tracks leave REPORTED. The review track advances
          status, while the regulator track is a self-loop that flips regulator_notified and
          deliberately leaves status alone (only version moves). CLOSED is the join: a SEVERE event
          signed off but not notified is refused, and the same call succeeds once the second track
          has completed - so the terminal state depends on a flag that no status transition carries.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice, one operating surgeon, one second surgeon acting as morbidity reviewer"
            - "one DRAFT LOCAL_ONLY case for the event to hang off"
            - "one SEVERE adverse event reported at 2026-09-11T09:00:00Z (deadline occurred_at + 72h, so late_report is false)"
