  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ced_credit_batch_claim_blocked_until_parent_pathway_reaches_certified
        grounds:
          - "validations[priority=100]"
          - state_machines.CreditBatch.DRAFT_to_CLAIMED
          - state_machines.CreditPathway.PROVISIONAL_to_CERTIFIED
          - calculations.credit_quantity
          - errors.ERR_PATHWAY_NOT_CERTIFIED
        distinguishing_aspect: |
          Entity pair CreditBatch -> CreditPathway: the batch's own state is a legal DRAFT
          and its delivered volume is non-zero, yet the claim is refused with
          ERR_PATHWAY_NOT_CERTIFIED purely because the parent pathway is still PROVISIONAL;
          the identical claim succeeds once the pathway is certified, and only then does
          credit_quantity_provisional become 36.111 from the certified score -236.67.
        test_recipe:
          setup:
            - "One facility with two ACTIVE agreements, one CLOSED PIPELINE_SPEC day 2026-08-03 delivering 120.280 MMBtu, and one DELIVERED injection nomination."
            - "One LCFS pathway left in PROVISIONAL with certified_ci_score still null."
            - "One DRAFT credit batch for 2026-08-01..2026-08-31 created against pathway version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3000, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 18000.000 }
