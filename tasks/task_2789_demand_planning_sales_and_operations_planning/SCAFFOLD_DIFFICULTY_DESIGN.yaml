  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_phase_actor_beats_adjustment_swing_exceeded
        grounds:
          - validations[priority=60]
          - validations[priority=170]
          - errors.ERR_UNAUTHORIZED_PHASE_ACTOR
          - errors.ERR_ADJUSTMENT_SWING_EXCEEDED
          - calculations.calc_consensus_units
        distinguishing_aspect: |
          Category pair: auth (priority 60) versus business_fiscal (priority 170). The identical
          request body violates both rules, and the ONLY difference between the two triggers is
          the cycle's phase, so the test proves 60 pre-empts 170 rather than merely proving that
          each rule fires somewhere. The winning error is 403 ERR_UNAUTHORIZED_PHASE_ACTOR, and
          the losing 422 ERR_ADJUSTMENT_SWING_EXCEEDED is shown to be genuinely armed by the
          control call issued one phase earlier.
        test_recipe:
          setup:
            - "One ProductFamily, one MATURE Item, one Customer."
            - "One PlanningCycle in DEMAND_REVIEW over 2026-09..2026-09 holding one BASELINE forecast line with baseline_units == 333, whose MAX_SWING_PCT limit is therefore round_half_up(333 * 25 / 100) = 83 units."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-CANDY", name: "Confections", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BAR-9", family_id: "${fam_id}", unit_price_cents: 500, unit_cost_cents: 200, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-CONF-09", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 333, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
          trigger:
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 5000, rationale: "control call: only the fiscal guardrail is violated", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 5000, rationale: "conflict call: fiscal guardrail AND phase actor both violated", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
          assert:
            - "Control call (cycle still DEMAND_REVIEW) returns 422 with error_id ERR_ADJUSTMENT_SWING_EXCEEDED because |5000| > 83"
            - "Conflict call (cycle now SUPPLY_REVIEW) returns 403 with error_id ERR_UNAUTHORIZED_PHASE_ACTOR — priority 60 wins over priority 170 even though the swing violation is unchanged"
            - "The conflict response error_id is NOT ERR_ADJUSTMENT_SWING_EXCEEDED and NOT ERR_CYCLE_PHASE_CLOSED"
            - "No ConsensusAdjustment row exists: GET /sop/consensus-adjustments?demand_forecast_id=${fc_id} returns total_count == 0"
            - "DemandForecast.${fc_id}.status == \"BASELINE\", consensus_units == 333 and version == ${fc_v1} — neither rejected call mutated the parent"

      - name: item_not_promotable_beats_promotion_window_overlap
        grounds:
          - validations[priority=130]
          - validations[priority=140]
          - errors.ERR_ITEM_NOT_PROMOTABLE
          - errors.ERR_PROMOTION_WINDOW_OVERLAP
          - state_machines.Item.MATURE_to_RUNOUT
        distinguishing_aspect: |
          Category pair: business_referential (priority 130) versus business_temporal
          (priority 140) — a different pair from the auth/business_fiscal instance. The control
          call proves the temporal overlap rule fires on its own while the item is still MATURE;
          the conflict call then violates BOTH by approving an overlapping window on an item that
          has since gone to RUNOUT, and the referential error must win. Note the ordering is not
          alphabetical or numerical luck: 130 asks "are these operands eligible at all" before
          140 does any calendar arithmetic.
        test_recipe:
          setup:
            - "One ProductFamily, one MATURE Item, one Customer."
            - "One APPROVED Promotion for that (item, customer) covering the closed-inclusive window 2026-10..2026-12."
            - "One DRAFT Promotion for the same (item, customer) covering 2026-11..2027-01, which overlaps the approved one at 2026-11 and 2026-12."
            - "Logical clock at its 2026-08-01T00:00:00Z default so no window is in the frozen horizon."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-SAUCE", name: "Sauces", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-KETCH-1", family_id: "${fam_id}", unit_price_cents: 400, unit_cost_cents: 150, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-10", end_month: "2026-12", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_base_id: $.data.id }
            - call: "POST /sop/promotions/${promo_base_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-11", end_month: "2027-01", lift_pct: 15, cannibalization_pct: 3 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_conflict_id: $.data.id }
          trigger:
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-11", end_month: "2026-11", lift_pct: 5, cannibalization_pct: 1 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_control_id: $.data.id }
            - call: "POST /sop/promotions/${promo_control_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "RUNOUT", runout_end_month: "2026-12" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/promotions/${promo_conflict_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
          assert:
            - "Control approve of ${promo_control_id} returns 409 with error_id ERR_PROMOTION_WINDOW_OVERLAP — the item was still MATURE, so only the temporal rule was violated"
            - "Item.${item_id}.lifecycle_state == \"RUNOUT\" and Promotion.${promo_base_id}.status is still \"APPROVED\" because its window ends exactly at runout_end_month 2026-12 and so is not truncated"
            - "Conflict approve of ${promo_conflict_id} returns 422 with error_id ERR_ITEM_NOT_PROMOTABLE — priority 130 wins over priority 140"
            - "The conflict response error_id is NOT ERR_PROMOTION_WINDOW_OVERLAP even though 2026-11 and 2026-12 are still doubly covered"
            - "Promotion.${promo_conflict_id}.status == \"DRAFT\" and Promotion.${promo_control_id}.status == \"DRAFT\" — neither rejected approval mutated its row"

  - rule_id: boundary_precision_check
    instances:
      - name: demand_cv_exactly_at_intermittent_threshold_selects_croston
        grounds:
          - calculations.calc_statistical_baseline
          - entities.Item.fields.demand_cv
          - entities.DemandForecast.fields.method
          - entities.DemandForecast.fields.baseline_units
        distinguishing_aspect: |
          Metric under test: the demand coefficient of variation against
          INTERMITTENT_CV_THRESHOLD = 0.75, on endpoint POST /sop/demand-forecasts. The comparison
          is `>=`, so 0.75 exactly is intermittent and 0.74 is not. Crossing the boundary does not
          nudge a number, it swaps the whole formula: CROSTON_FLAT drops both the trend and the
          seasonal index, producing 1100 where HOLT_WINTERS produces 1452 from identical level,
          trend, seasonality and causal inputs.
        test_recipe:
          setup:
            - "One ProductFamily, one Customer, one PlanningCycle over 2026-09..2026-12 in DEMAND_REVIEW."
            - "Item AT: demand_cv exactly 0.75. Item BELOW: demand_cv 0.74. Everything else identical, both MATURE."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-SPICE", name: "Spices", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-AT-075", family_id: "${fam_id}", unit_price_cents: 600, unit_cost_cents: 200, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.75, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_at_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BELOW-074", family_id: "${fam_id}", unit_price_cents: 600, unit_cost_cents: 200, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.74, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_below_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-A", name: "Alpha Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "SOP-CV-Q4", horizon_start_month: "2026-09", horizon_end_month: "2026-12", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_at_id}", customer_id: "${cust_id}", month: "2026-11", level_units: 1000, trend_units_per_month: 50, seasonal_index: 1.20, causal_uplift_pct: 10 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_at_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_below_id}", customer_id: "${cust_id}", month: "2026-11", level_units: 1000, trend_units_per_month: 50, seasonal_index: 1.20, causal_uplift_pct: 10 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_below_id: $.data.id }
          assert:
            - "DemandForecast.${fc_at_id}.method == \"CROSTON_FLAT\" — demand_cv 0.75 satisfies >= INTERMITTENT_CV_THRESHOLD"
            - "DemandForecast.${fc_at_id}.baseline_units == 1100 — raw is the bare level 1000 (trend and seasonal_index suppressed), then round_half_up(1000 * 1.10)"
            - "DemandForecast.${fc_below_id}.method == \"HOLT_WINTERS\" — demand_cv 0.74 is below the threshold"
            - "DemandForecast.${fc_below_id}.baseline_units == 1452 — (1000 + 50 * 2) * 1.20 = 1320, then round_half_up(1320 * 1.10)"
            - "Both lines share month 2026-11 at horizon offset 2 and both start in status BASELINE with consensus_units equal to their own baseline_units (1100 and 1452)"

      - name: zero_request_customer_gets_full_fill_rate_on_ration
        grounds:
          - calculations.calc_rationing_waterfall
          - entities.Allocation.fields.fill_rate_pct
          - entities.Allocation.fields.allocation_pass
          - entities.Customer.fields.credit_hold
          - entities.SupplyPlan.fields.unallocated_units
        distinguishing_aspect: |
          Metric under test: the fill-rate percentage at a ZERO DENOMINATOR, on the different
          endpoint POST /sop/supply-plans/{supply_plan_id}/ration. requested_units == 0 is not a
          division-by-zero error and not 0.00 percent — it is defined as 100.00 with the customer
          excluded from the pro-rata denominator, which is why the pool total is 800 rather than
          800 + 0 and the two pro-rata customers receive 313 and 187 rather than something
          smaller. A credit-held customer with a positive request is the contrasting zero: 0.00.
        test_recipe:
          setup:
            - "The five-customer rationing fixture: family at 100 units/hour with a 9-hour CapacityBlock in the 2026-09 window (900 available units); one MATURE Item with on_hand_units 0, safety_stock_units 330, material_supply_cap_units 100000, unit_price_cents 1000."
            - "Customers C1 rank 1 (protected), C2 rank 3, C3 rank 4, C4 rank 5 with credit_hold true, C5 rank 6."
            - "One PlanningCycle over 2026-09..2026-09 with all five lines CONSENSUS_LOCKED at 400, 500, 300, 200 and 0 units, advanced to SUPPLY_REVIEW, with a PLANNED SupplyPlan whose constrained_units == 900."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BAKE", name: "Bakery", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
