              as_user_id: "fin-v19-a"
          assert:
            - "response code == 409 with data.error_id == ERR_REFUND_SUPERSEDE_INVALID"
            - "GET /refund-authorizations?return_case_id=${rc_id} returns total_count == 1 with the single row ${refund1}"
            - "RefundAuthorization.${refund1}.status == AUTHORIZED and net_refund_cents == 114000"
            - "ReturnCase.${rc_id}.financial_status == AUTHORIZED and version == ${rc_v2}"

      - name: abuse_block_outranks_the_break_in_window_on_an_exchange_request
        claim_type: Priority conflict
        grounds:
          - validations[priority=15]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / abuse_block_p15_outranks_break_in_not_elapsed_p17_on_exchange_request
          rationale: "Both rules are violated by one request there and the lower-priority error is shown to disappear once the block is lifted."

      - name: open_quality_claim_outranks_the_zero_balance_check_on_refund_creation
        claim_type: Priority Ordering
        grounds:
          - validations[priority=36]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / open_quality_claim_p36_outranks_no_refundable_balance_p40_on_refund_creation
          rationale: "That instance violates both rules at once and then withdraws the claim to expose ERR_NO_REFUNDABLE_BALANCE underneath."

      - name: break_in_window_boundary_on_return_case_creation
        claim_type: Temporal validation
        grounds:
          - validations[priority=17]
          - errors.ERR_BREAK_IN_NOT_ELAPSED
        excluded_because:
          difficulty_instance: boundary_precision_check / break_in_window_inclusive_to_the_second_on_return_case_creation
          rationale: "One second before, exactly at, and one second after break_in_ends_at are all asserted there."

      - name: route_capacity_aggregate_at_and_over_the_limit
        claim_type: Aggregate validation
        grounds:
          - validations[priority=39]
          - errors.ERR_ROUTE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: boundary_precision_check / route_capacity_allows_exact_equality_and_rejects_one_unit_over
          rationale: "Exact equality accepted and one unit over rejected are both asserted there on the same route."

      - name: appointment_booking_requires_a_published_route
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=9]
          - errors.ERR_ROUTE_NOT_PUBLISHED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / appointment_booking_gated_on_pickup_route_publication_state
          rationale: "The DRAFT rejection and the identical request succeeding after publication are both asserted there."

      - name: refund_creation_requires_confirmed_disposition_intake
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=11]
          - errors.ERR_DISPOSITION_NOT_CONFIRMED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / refund_authorization_gated_on_disposition_assignment_intake_confirmation
          rationale: "ASSIGNED-then-DELIVERED gating on the sibling entity is asserted there."

      - name: pickup_slot_overlap_including_the_buffer
        claim_type: Temporal validation
        grounds:
          - validations[priority=33]
          - errors.ERR_SLOT_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pickup_slot_point_adjacency_collides_until_the_30_minute_buffer_clears
          rationale: "Zero-gap adjacency colliding and the first buffer-clearing slot succeeding are both asserted there."

      - name: partner_intake_day_bucket_aggregate
        claim_type: Aggregate validation
        grounds:
          - validations[priority=38]
          - errors.ERR_PARTNER_INTAKE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / disposition_partner_day_bucket_collides_only_within_the_same_intake_date
          rationale: "The same-day rejection and the adjacent-day acceptance are asserted there."

  - section: endpoints
    instances:
      - name: refund_summary_reports_the_provisional_variant_and_the_delta_before_authorization
        claim_type: Computed read
        grounds:
          - endpoints[GET /return-cases/{id}/refund-summary]
          - calculations.refund_settlement.variants
        distinguishing_aspect: "Read straight after inspection the summary is in the PROVISIONAL regime: proration_deduction_cents is the 13500 usage figure, provisional_refund_cents is 106500, yet final_refund_cents is already computed as 114000 and variant_delta_cents is +7500 (final minus provisional) even though no RefundAuthorization exists."
        test_recipe:
          setup:
            - "One QUEEN MattressModel at 120000 with no bundle (paid_amount_cents 120000, trial_nights 100)."
            - "One Customer with a DTC order delivered 2026-08-01, returned 2026-09-10, collected 2026-09-15 (nights_used 45), inspected grade A unsoiled - nothing dispositioned or authorized yet."
