  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: defect_pareto_ordering_tiebreak_vitalfew
        claim_type: correct_result
        grounds:
          - calculations.defect_pareto
        distinguishing_aspect: "Pareto over [2026-08-01, 2026-08-02): OPEN 12, SHORT 8, DRILL_BREAKOUT 8 (tie broken by code ASC before SHORT), SPACING 4; total 32; cumulative 37.50/62.50/87.50/100.00; vital-few flags T,T,T,F; a COSMETIC record (99 boards) and a record at exactly to_iso are excluded."
        test_recipe:
          setup:
            - "Order IN_PRODUCTION with RELEASED array; 6 defect records posted as pinned below"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Pareto Co", contact_email: "pareto@co.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-PA1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/defects", payload: { panel_array_id: "${arr}", defect_code: "OPEN", severity: "MAJOR", boards_affected: 12, detected_at: "2026-08-01T00:00:00Z", source: "AOI" }, as: QualityInspector }
            - { call: "POST /pcb/fab-orders/${ord}/defects", payload: { panel_array_id: "${arr}", defect_code: "SHORT", severity: "MAJOR", boards_affected: 8, detected_at: "2026-08-01T10:00:00Z", source: "AOI" }, as: QualityInspector }
            - { call: "POST /pcb/fab-orders/${ord}/defects", payload: { panel_array_id: "${arr}", defect_code: "DRILL_BREAKOUT", severity: "SCRAP", boards_affected: 8, detected_at: "2026-08-01T11:00:00Z", source: "MANUAL" }, as: QualityInspector }
            - { call: "POST /pcb/fab-orders/${ord}/defects", payload: { panel_array_id: "${arr}", defect_code: "SPACING", severity: "MAJOR", boards_affected: 4, detected_at: "2026-08-01T12:00:00Z", source: "AOI" }, as: QualityInspector }
            - { call: "POST /pcb/fab-orders/${ord}/defects", payload: { panel_array_id: "${arr}", defect_code: "OVERETCH", severity: "COSMETIC", boards_affected: 99, detected_at: "2026-08-01T13:00:00Z", source: "AOI" }, as: QualityInspector }
