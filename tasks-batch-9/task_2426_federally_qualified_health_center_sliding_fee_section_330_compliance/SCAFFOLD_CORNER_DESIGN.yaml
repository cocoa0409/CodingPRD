              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_pg: $.data.error_id }
            - call: "GET /board-members/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_bm: $.data.error_id }
            - call: "GET /service-sites/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { nf_site: $.data.error_id }
            - call: "GET /service-definitions/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ComplianceOfficer
