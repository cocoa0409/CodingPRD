        distinguishing_aspect: "REMEDIATED is terminal: a second MARK_REMEDIATED on the same row returns 409 ERR_INVALID_IMPACT_STATE instead of re-stamping remediated_at."
        test_recipe:
          setup:
            - "The impact assessment has already reached REMEDIATED at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
