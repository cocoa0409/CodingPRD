        distinguishing_aspect: "Stale expected_booking_version returns 412; fresh version succeeds."
        test_recipe:
          setup: ["Booking in SCHEDULING; client captured version V before another action bumped it"]
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 100, travel_included_miles: 15, setup_buffer_minutes: 15, teardown_buffer_minutes: 15 }, as: PlatformAdmin, captures: { rid: "$.data.id" } }
