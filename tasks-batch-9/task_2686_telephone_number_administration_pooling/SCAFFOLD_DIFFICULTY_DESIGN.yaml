scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: carrier_utilization_strict_vs_claimed_divergence
        grounds:
          - calculations.filing_utilization_pct
          - calculations.audit_penalty_action
          - entities.UtilizationFiling.fields.claimed_utilization_pct
          - entities.UtilizationFiling.fields.strict_utilization_pct
          - entities.AuditFinding.fields.adjusted_utilization_pct
        distinguishing_aspect: |
          One stored UtilizationFiling row yields two different utilization
          figures because carrier_claimed counts numbers_intermediate and
          numbers_reserved in the numerator while strict_assigned_only counts
          only numbers_assigned: 68.89 versus 55.56 over identical inputs, a
          13.33-point gap that then drives penalty_action to PROBATION.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Carrier A (OCN 1234, home state OH) licensed GRANTED and facilities VERIFIED, so eligibility_status is ELIGIBLE."
            - "NPA 614 in OH with rate center COLUMBUS (LATA 324)."
            - "Carrier A holds five activated blocks 614-555-0 through 614-555-4 in that rate center."
            - "Carrier A has one SUBMITTED filing for 2026H1 reporting assigned 2500, intermediate 400, reserved 200, aging 200, administrative 300 over 5 blocks held."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { carrier_a_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 0, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 1, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 2, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 3, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 4, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2500, numbers_intermediate: 400, numbers_reserved: 200, numbers_aging: 200, numbers_administrative: 300, blocks_held_at_period_end: 5, forecast_quarters: [1800, 1200, 900, 600] }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { filing_a_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_a_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
          trigger:
            - call: "POST /numbering/utilization-filings/${filing_a_id}/audit-findings"
              payload: { finding_type: "OVERSTATED_UTILIZATION", adjusted_numbers_assigned: 2500, adjusted_numbers_administrative: 300 }
              as: NumberingAdministrator
              as_user_id: "auditor-1"
              captures: { finding_a_id: $.data.id }
          assert:
            - "UtilizationFiling.${filing_a_id}.claimed_utilization_pct == 68.89"
            - "UtilizationFiling.${filing_a_id}.strict_utilization_pct == 55.56"
            - "AuditFinding.${finding_a_id}.adjusted_utilization_pct == 55.56"
            - "AuditFinding.${finding_a_id}.penalty_action == PROBATION"
            - "UtilizationFiling.${filing_a_id}.status == UNDER_AUDIT"
            - "Both figures share the denominator 4500 (5 * 1000 - 300 - 200); only the numerator differs (3100 versus 2500)"

      - name: rate_center_exhaust_forward_vs_chronological_divergence
        grounds:
          - calculations.rate_center_months_to_exhaust
          - entities.AllocationRequest.fields.months_to_exhaust_at_submission
          - entities.RateCenter.fields.available_block_count
          - concurrency_rules[allocation-request-create-stale-rate-center]
        distinguishing_aspect: |
          With available_block_count fixed at 2 (2000 numbers), the
          forward_looking variant divides by forecast-derived demand
          (3000 / 6 = 500 per month) and returns 4.00, which clears
          MONTHS_TO_EXHAUST_MAX, while the chronological variant divides by
          the historical delta (900 / 6 = 150 per month) and returns 13.33,
          which does not - identical inventory reads as four months or as
          thirteen months of runway purely from which variant the newest
          filing selects.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier B (OCN 5678, OH) ELIGIBLE; NPA 614 with rate center COLUMBUS holding exactly two POOL_AVAILABLE blocks 614-557-0 and 614-557-1."
            - "Carrier B filed and submitted 2025H2 reporting numbers_assigned 1500 with an all-zero forecast, then 2026H1 reporting numbers_assigned 2400 with forecast [1800, 1200, 900, 600]."
            - "A third filing for 2026H2 reports numbers_assigned 3300 with an all-zero forecast, which selects the chronological variant (delta 3300 - 2400 = 900)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "5678", legal_name: "Buckeye Comm Inc", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 36 }
              as: NumberingAdministrator
              captures: { carrier_b_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_b_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_b_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH02DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
            - call: "POST /numbering/carriers/${carrier_b_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "557", thousands_digit: 0, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "557", thousands_digit: 1, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 0, contaminated_count: 0, holder_carrier_id: "${carrier_b_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_b_id}", rate_center_id: "${rc_id}", reporting_period: "2025H2", numbers_assigned: 1500, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [0, 0, 0, 0] }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { filing_b1_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_b1_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_b_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2400, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [1800, 1200, 900, 600] }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { filing_b2_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_b2_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { rc_v_before_r1: $.data.version }
          trigger:
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${carrier_b_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "forward-looking demand", expected_rate_center_version: "${rc_v_before_r1}" }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { req_forward_id: $.data.id }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_b_id}", rate_center_id: "${rc_id}", reporting_period: "2026H2", numbers_assigned: 3300, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [0, 0, 0, 0] }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { filing_b3_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_b3_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { rc_v_before_r2: $.data.version }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${carrier_b_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "history-based demand", expected_rate_center_version: "${rc_v_before_r2}" }
              as: CarrierRepresentative
              as_user_id: "${carrier_b_id}"
              captures: { req_chrono_id: $.data.id }
          assert:
            - "RateCenter.${rc_id}.available_block_count == 2 both before and after the two filings"
            - "AllocationRequest.${req_forward_id}.months_to_exhaust_at_submission == 4.00"
            - "AllocationRequest.${req_chrono_id}.months_to_exhaust_at_submission == 13.33"
            - "AllocationRequest.${req_forward_id}.status == SUPERSEDED"
            - "AllocationRequest.${req_forward_id}.superseded_by_request_id == ${req_chrono_id}"
            - "4.00 is at or under MONTHS_TO_EXHAUST_MAX (6) while 13.33 exceeds it, so the same inventory qualifies under one variant and not the other"
  - rule_id: combinatorial_formula
    instances:
      - name: growth_grant_size_nested_min_with_tier_cap
        grounds:
          - calculations.growth_grant_size
          - calculations.block_pool_selection
          - validations[priority=30]
          - validations[priority=34]
          - entities.AllocationRequest.fields.granted_block_count
        distinguishing_aspect: |
          The grant is the minimum of four independently derived ceilings -
          requested_block_count, forecast demand_blocks (6), the
          utilization tier_cap, and pool_available - so two carriers filing
          against the SAME pool with the SAME forecast receive 1 block and 2
          blocks respectively: the first is bound by tier_cap 1 (utilization
          68.89) and the second by requested_block_count 2 (utilization 93.33
          lifts its tier_cap to 3).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carriers A (OCN 1234) and C (OCN 9012) both ELIGIBLE in OH."
            - "NPA 614 / rate center COLUMBUS with six POOL_AVAILABLE blocks 614-556-0 through 614-556-5, so available_block_count is 6."
            - "Carrier A submitted a 2026H1 filing computing to claimed_utilization_pct 68.89 with forecast [3600, 2400, 1200, 600]."
            - "Carrier C submitted a 2026H1 filing computing to claimed_utilization_pct 93.33 with the same forecast."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { carrier_a_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "9012", legal_name: "Scarlet Networks LLC", carrier_type: "WIRELESS", home_state_code: "OH", months_in_operation: 60 }
              as: NumberingAdministrator
              captures: { carrier_c_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_c_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_c_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH03DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_c_id}"
            - call: "POST /numbering/carriers/${carrier_c_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 0, contaminated_count: 0 }
              as: NumberingAdministrator
              captures: { pool0_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 1, contaminated_count: 0 }
              as: NumberingAdministrator
              captures: { pool1_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 2, contaminated_count: 0 }
              as: NumberingAdministrator
              captures: { pool2_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 3, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 4, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 5, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 0, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0, contaminated_count: 0, holder_carrier_id: "${carrier_c_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2500, numbers_intermediate: 400, numbers_reserved: 200, numbers_aging: 200, numbers_administrative: 300, blocks_held_at_period_end: 5, forecast_quarters: [3600, 2400, 1200, 600] }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { filing_a_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_a_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_c_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2800, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [3600, 2400, 1200, 600] }
              as: CarrierRepresentative
              as_user_id: "${carrier_c_id}"
              captures: { filing_c_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_c_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_c_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { rc_v_a: $.data.version }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 4, justification: "four blocks requested", expected_rate_center_version: "${rc_v_a}" }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { req_a_id: $.data.id }
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_c_id}"
              captures: { rc_v_c: $.data.version }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${carrier_c_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 2, justification: "two blocks requested", expected_rate_center_version: "${rc_v_c}" }
              as: CarrierRepresentative
              as_user_id: "${carrier_c_id}"
              captures: { req_c_id: $.data.id }
          trigger:
            - call: "POST /numbering/allocation-requests/${req_a_id}/reviews"
              payload: { action: "APPROVE" }
              as: RegulatoryApprover
              as_user_id: "approver-1"
            - call: "POST /numbering/allocation-requests/${req_c_id}/reviews"
              payload: { action: "APPROVE" }
              as: RegulatoryApprover
              as_user_id: "approver-1"
          assert:
            - "AllocationRequest.${req_a_id}.granted_block_count == 1"
            - "AllocationRequest.${req_a_id}.utilization_pct_at_submission == 68.89"
            - "AllocationRequest.${req_c_id}.granted_block_count == 2"
            - "AllocationRequest.${req_c_id}.utilization_pct_at_submission == 93.33"
            - "AllocationRequest.${req_a_id}.assigned_block_ids == [${pool0_id}]"
            - "AllocationRequest.${req_c_id}.assigned_block_ids == [${pool1_id}, ${pool2_id}]"
            - "RateCenter.${rc_id}.available_block_count == 3"
            - "Neither grant equals requested_block_count for carrier A (4) nor demand_blocks (6), proving the minimum is taken across all four terms"

      - name: pooled_aggregate_utilization_sum_then_round
        grounds:
          - calculations.rate_center_aggregate_utilization_pct
          - calculations.filing_utilization_pct
          - entities.RateCenter.fields.aggregate_utilization_pct
        distinguishing_aspect: |
          The rate center's aggregate pools numerators and denominators across
          the two effective filings and rounds exactly once, producing 58.09
          from 3195 / 5500; averaging the already-rounded per-filing figures
          (68.89 and 9.50) would produce 39.20, so the assertion falsifies any
          average-of-rounded implementation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carriers A (OCN 1234) and B (OCN 5678) both ELIGIBLE, each holding one activated block in NPA 614 rate center COLUMBUS."
            - "Carrier A submitted a 2026H1 filing (assigned 2500, intermediate 400, reserved 200, aging 200, administrative 300, blocks held 5) computing to 68.89."
            - "Carrier B has a DRAFT 2026H1 filing (assigned 95, blocks held 1) that will compute to 9.50 on submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { carrier_a_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
