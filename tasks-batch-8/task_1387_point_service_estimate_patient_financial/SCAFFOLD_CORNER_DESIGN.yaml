              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNKNOWN_CPT_CODE, http 422; no estimate persisted (case estimate list stays empty)"

      - name: snapshot_patient_mismatch_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_SNAPSHOT_PATIENT_MISMATCH]"]
        distinguishing_aspect: "An INSURED estimate must reference a snapshot of the case's own patient; patient B's snapshot on patient A's case is rejected."
        test_recipe:
          setup: ["Patients A and B; snapshot for B (payer ACME); case for A (service 2026-08-20)"]
          setup_api_calls:
