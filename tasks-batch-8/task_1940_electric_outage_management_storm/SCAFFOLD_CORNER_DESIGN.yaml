            - "${st} == AVAILABLE at exactly window_start (inclusive boundary); arrived_at == \"2026-08-11T00:00:00Z\""

      - name: priority_customer_cert_expiry_sweep_and_recompute
        claim_type: valid_transition
        grounds:
          - state_machines.PriorityCustomer.CERTIFIED_to_SUSPENDED
          - entities.Feeder.fields.certified_priority_count
        distinguishing_aspect: "Advancing the logical clock past certified_through system-suspends the customer and recomputes the feeder count and the outage's has_priority_customers."
        test_recipe:
