              captures: { escrowed_to_rejected: $.data.error_id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "RESCINDED", rejection_reason: "changed mind" }
              as: TransferAgent
              captures: { escrowed_to_rescinded: $.data.error_id }
          assert:
            - "pending_to_rescinded == \"ERR_INVALID_STATE_TRANSITION\" with http status 409"
            - "pending_to_refunded == \"ERR_INVALID_STATE_TRANSITION\""
            - "escrowed_status == \"ESCROWED\" and escrowed_version == 2"
            - "escrowed_to_rejected == \"ERR_INVALID_STATE_TRANSITION\""
            - "escrowed_to_rescinded == \"ERR_INVALID_STATE_TRANSITION\""
            - "Subscription.${sub_id}.status == \"ESCROWED\" and version == 2 after all four rejections"
            - "Offering.${off_id}.escrow_balance_cents == 250000 (unchanged by the failed attempts)"

      - name: newly_created_rows_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
