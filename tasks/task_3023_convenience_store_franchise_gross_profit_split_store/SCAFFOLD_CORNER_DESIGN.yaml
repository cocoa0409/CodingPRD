              as: FranchisorAdmin
              captures: { stZ_id: $.data.id, stZ_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frZ_id}", store_id: "${stZ_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
