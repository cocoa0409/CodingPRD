  - rule_id: compensating_invariant
    instances:
      - name: retro_compute_void_conserves_paid_ledger
        grounds:
          - state_machines.RetroAdjustmentRun.CREATED_to_COMPUTED
          - state_machines.RetroAdjustmentRun.COMPUTED_to_VOID
          - calculations.retro_repricing_sweep
        distinguishing_aspect: |
          Conserved quantity = the contract paid-claim ledger (money): the forward
          action (compute: sweeps and proposes adjustments totalling underpaid
          2000 / overpaid 3000) paired with its compensating action (void) leaves
          SUM(PaidClaimSnapshot.paid_cents) == 25000 and every snapshot_status ==
          OPEN exactly as before compute — zero ledger drift.
        test_recipe:
          setup:
            - "Contract ACTIVE with v1 SUPERSEDED by v2 EFFECTIVE (entry 99213 pct 12000); retro run CREATED with window [2026-08-01, 2026-09-01)"
            - "OPEN paid claims: CLM-1 service 2026-08-10 paid 10000 (reprices to 12000, delta +2000 UNDERPAID); CLM-2 service 2026-08-20 paid 15000 (delta -3000 OVERPAID); CLM-3 service 2026-07-15 paid 10000 (outside window, untouched)"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /medicare-benchmarks", payload: { benchmark_year: 2026, locality_code: "L01", hcpcs_code: "99213", benchmark_amount_cents: 10000 }, as: PlanAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /medicare-benchmarks/${b_id}/publish", as: PlanAdmin }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ct_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ct_v: $.data.version } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${ct_v}" }, as: ContractManager, captures: { v1_id: $.data.id } }
            - { call: "POST /contract-versions/${v1_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 10000 }, as: ConfigurationAnalyst, captures: { e1_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${e1_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ct_id}/begin-testing", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/simulation-batches", payload: { label: "B1" }, as: ConfigurationAnalyst, captures: { bt_id: $.data.id } }
            - { call: "POST /simulation-batches/${bt_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-07-15", billed_cents: 15000, expected_allowed_cents: 10000 }, as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${bt_id}/price", as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${bt_id}/score", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ct_id}/mark-ready", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ct_id}/approve-go-live", as: PlanAdmin }
            - { call: "POST /contracts/${ct_id}/paid-claims", payload: { claim_number: "CLM-1", hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-08-10", billed_cents: 15000, paid_cents: 10000 }, as: PaymentIntegrityAnalyst, captures: { pc1: $.data.id } }
            - { call: "POST /contracts/${ct_id}/paid-claims", payload: { claim_number: "CLM-2", hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-08-20", billed_cents: 20000, paid_cents: 15000 }, as: PaymentIntegrityAnalyst, captures: { pc2: $.data.id } }
            - { call: "POST /contracts/${ct_id}/paid-claims", payload: { claim_number: "CLM-3", hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-07-15", billed_cents: 15000, paid_cents: 10000 }, as: PaymentIntegrityAnalyst, captures: { pc3: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ct_v2: $.data.version } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 2, effective_date: "2026-09-01", retro_effective_date: "2026-08-01", expected_contract_version: "${ct_v2}" }, as: ContractManager, captures: { v2_id: $.data.id } }
            - { call: "POST /contract-versions/${v2_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 12000 }, as: ConfigurationAnalyst, captures: { e2_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${e2_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v2_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v2_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ct_id}/begin-testing", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v2_id}/simulation-batches", payload: { label: "B2" }, as: ConfigurationAnalyst, captures: { bt2_id: $.data.id } }
            - { call: "POST /simulation-batches/${bt2_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-09-15", billed_cents: 20000, expected_allowed_cents: 12000 }, as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${bt2_id}/price", as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${bt2_id}/score", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ct_id}/mark-ready", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ct_id}/approve-go-live", as: PlanAdmin }
            - { call: "GET /contract-versions/${v2_id}/retro-adjustment-runs", as: PlanAdmin, captures: { run_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /retro-adjustment-runs/${run_id}/compute", as: PaymentIntegrityAnalyst, captures: { r_under: $.data.total_underpaid_cents, r_over: $.data.total_overpaid_cents, r_net: $.data.net_delta_cents, r_cnt: $.data.adjustment_count } }
            - { call: "POST /retro-adjustment-runs/${run_id}/void", as: PaymentIntegrityAnalyst, captures: { v_st: $.data.run_status, v_under: $.data.total_underpaid_cents, v_over: $.data.total_overpaid_cents, v_net: $.data.net_delta_cents, v_cnt: $.data.adjustment_count } }
            - { call: "GET /paid-claims/${pc1}", as: PlanAdmin, captures: { pc1_st: $.data.snapshot_status } }
            - { call: "GET /paid-claims/${pc2}", as: PlanAdmin, captures: { pc2_st: $.data.snapshot_status } }
          assert:
            - "After compute: r_under == 2000 and r_over == 3000 and r_net == -1000 and r_cnt == 2 (CLM-3 excluded: 2026-07-15 is outside [2026-08-01, 2026-09-01))"
            - "After compute, pc1_st == OPEN and pc2_st == OPEN (compute never mutates snapshots)"
            - "After void: v_st == VOID and v_under == 0 and v_over == 0 and v_net == 0 and v_cnt == 0 (all PROPOSED adjustments VOIDED)"
            - "INVARIANT: SUM(paid_cents) over the contract's PaidClaimSnapshot rows == 25000 before compute and after void; all three snapshot_status == OPEN (no drift)"
      - name: batch_price_reopen_conserves_claim_counts
        grounds:
          - state_machines.SimulationBatch.OPEN_to_PRICED
          - state_machines.SimulationBatch.FAILED_to_OPEN
          - entities.SimulationBatch.fields.total_claims
        distinguishing_aspect: |
          Conserved quantity = batch claim-count partition (counts, not money —
          different quantity type from the retro instance): at every point,
          total_claims == matched_claims + mismatched_claims + excluded_claims +
          pending_claims; the forward price plus compensating reopen restores
          pending == total with all other counters at 0.
        test_recipe:
          setup:
            - "Contract in IN_CONFIGURATION with VALIDATED version effective 2026-07-01, entry 99213 pct 10000 on benchmark 10000"
            - "Batch with 3 claims: two expected 10000, one expected 9999"
          setup_api_calls:
