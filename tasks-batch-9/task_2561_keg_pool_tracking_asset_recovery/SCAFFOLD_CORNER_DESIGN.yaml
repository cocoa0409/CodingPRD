  # ==========================================================================
  # STATE MACHINES — Table 2 rows, shape rows and cascade patterns
  # ==========================================================================
  - section: state_machines
    instances:
      - name: float_agreement_activation_sets_active_and_computes_the_first_posture
        claim_type: Valid Transition
        grounds:
          - state_machines.FloatAgreement.transitions.DRAFT_to_ACTIVE
          - calculations.float_posture
          - endpoints[POST /float-agreements/{agreement_id}/activate]
        distinguishing_aspect: "Activation computes float_posture for the very first time, and a brand-new agreement is TIGHT rather than HEALTHY because kegs_at_brewer_count 0 <= floor(4 x 20 / 100) = 0; an identical agreement on an empty (FROZEN) pool activates straight to SUSPENDED with pending_replenishment_kegs 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480."
            - "Brewer RDG; pool HB-50L stocked with two kegs (posture OPEN) and pool HB-30L left empty (posture FROZEN)."
            - "One DRAFT agreement per pool, both float_size_kegs 4 with the default replenishment_threshold_pct 20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
