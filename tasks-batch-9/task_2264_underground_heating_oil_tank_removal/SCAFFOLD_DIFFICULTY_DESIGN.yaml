              as: LicensedSiteProfessional
              captures: { pv1: $.data.version }
            - call: "POST /change-orders"
              payload: { tank_project_id: "${proj_id}", additional_cubic_yards: 3.5, unit_rate_cents: 1001, disposal_class: "NON_HAZARDOUS", expected_project_version: "${pv1}" }
              as: LicensedSiteProfessional
              as_user_id: "lsp-1"
              captures: { co1_id: $.data.id }
            - call: "POST /change-orders/${co1_id}/submit"
              as: LicensedSiteProfessional
              as_user_id: "lsp-1"
            - call: "POST /change-orders/${co1_id}/decision"
              payload: { decision: "APPROVED", decision_note: "grid extension east" }
              as: ComplianceOfficer
              captures: { co1_line: $.data.line_amount_cents }
            - call: "GET /tank-projects/${proj_id}"
              as: LicensedSiteProfessional
              captures: { pv2: $.data.version }
            - call: "POST /change-orders"
              payload: { tank_project_id: "${proj_id}", additional_cubic_yards: 2.5, unit_rate_cents: 1001, disposal_class: "NON_HAZARDOUS", expected_project_version: "${pv2}" }
              as: LicensedSiteProfessional
              as_user_id: "lsp-1"
              captures: { co2_id: $.data.id }
            - call: "POST /change-orders/${co2_id}/submit"
              as: LicensedSiteProfessional
              as_user_id: "lsp-1"
            - call: "POST /change-orders/${co2_id}/decision"
              payload: { decision: "APPROVED", decision_note: "grid extension south" }
              as: ComplianceOfficer
              captures: { co2_line: $.data.line_amount_cents }
          assert:
            - "${co1_line} == 3504"
            - "${co2_line} == 2503"
            - "TankProject.${proj_id}.remediation_cost_cents == 191007"
            - "TankProject.${proj_id}.remediation_cost_cents != 191006"
            - "TankProject.${proj_id}.approved_scope_cubic_yards == 14.0"

      - name: trust_fund_mode_c_cap_tier_keyed_on_gross_before_deductible
        grounds:
          - calculations.trust_fund_eligible_amount
          - entities.TrustFundClaim.fields.cap_cents
          - entities.TrustFundClaim.fields.admin_fee_cents
          - entities.TrustFundClaim.fields.eligible_amount_cents
        distinguishing_aspect: |
          Mode (c): cap_cents is keyed on the gross claim, admin_fee_cents on the capped amount, and
