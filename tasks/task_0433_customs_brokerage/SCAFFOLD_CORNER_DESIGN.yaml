      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.CustomsEntry.fields.version
          - state_machines.CustomsEntry.DRAFT_to_FILED
        distinguishing_aspect: "An entry's version starts at 1 on creation and increments by exactly 1 on a mutating transition (file): version reads 2 after POST /entries/{id}/file."
        test_recipe:
          setup:
            - "A DRAFT entry (version 1) with one line and a FILED ISF; clock 2026-06-05; bond high limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
