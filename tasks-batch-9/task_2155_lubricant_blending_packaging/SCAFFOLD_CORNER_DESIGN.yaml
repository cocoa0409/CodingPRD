scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: customer_creation_returns_system_and_default_fields
        claim_type: Creation
        grounds:
          - entities.Customer.fields.takeback_credit_balance_cents
          - entities.Customer.fields.takeback_agreement_status
          - endpoints[POST /customers]
        distinguishing_aspect: "POST /customers with the four required fields returns 201 with a server-minted UUID id, version 1, takeback_credit_balance_cents 0 and takeback_agreement_status NONE."
        test_recipe:
          setup: ["Empty database; logical clock left at its 2026-08-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Delta Lubricants", customer_type: "DISTRIBUTOR", contract_tier: "TIER_C", credit_limit_cents: 250000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Customer.${cust1}.version == 1"
            - "Customer.${cust1}.takeback_credit_balance_cents == 0"
            - "Customer.${cust1}.takeback_agreement_status == NONE"
            - "Customer.${cust1}.last_credit_event_at is null"
            - "Customer.${cust1}.id is a bare UUID with no type prefix"
            - "Customer.${cust1}.created_at == 2026-08-01T00:00:00.000Z (the fixed logical-clock default)"

      - name: component_lot_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.ComponentLot.fields.additive_family
          - entities.ComponentLot.fields.coa_viscosity_verified
          - entities.ComponentLot.fields.status
          - entities.ComponentLot.fields.available_kg
        distinguishing_aspect: "Omitting additive_family and coa_viscosity_verified yields NONE and true respectively, status AVAILABLE, and available_kg equal to received_kg."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 400.0, unit_cost_cents_per_kg: 210, kv100_cst: 5.200, density_kg_per_l: 0.855 }
              as: PlatformAdmin
              captures: { lot1: $.data.id }
          assert:
            - "ComponentLot.${lot1}.additive_family == NONE"
            - "ComponentLot.${lot1}.coa_viscosity_verified == true"
            - "ComponentLot.${lot1}.status == AVAILABLE"
            - "ComponentLot.${lot1}.available_kg == 400.000"
            - "ComponentLot.${lot1}.quarantine_reason is null"

      - name: product_spec_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.ProductSpec.fields.target_kv100_cst
        distinguishing_aspect: "POST /product-specs without target_kv100_cst is rejected with HTTP 400 and ERR_INVALID_REQUEST, and no ProductSpec row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /product-specs returns total_count 0"

      - name: blend_tank_not_found_returns_404
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_BLEND_TANK_NOT_FOUND]
        distinguishing_aspect: "GET /blend-tanks/{unknown-uuid} returns HTTP 404 with ERR_BLEND_TANK_NOT_FOUND rather than an empty 200 envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /blend-tanks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BlendOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "data.error_id == ERR_BLEND_TANK_NOT_FOUND"

      - name: component_lot_listing_paginates_with_limit_and_offset
        claim_type: Listing
        grounds:
          - endpoints[GET /component-lots]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three lots on file, GET /component-lots at limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and at limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; exactly three ComponentLot rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 400.0, unit_cost_cents_per_kg: 210, kv100_cst: 5.200, density_kg_per_l: 0.855 }
              as: PlatformAdmin
              captures: { lot1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "VI_IMPROVER", component_code: "OCP-VII", received_kg: 300.0, unit_cost_cents_per_kg: 940, kv100_cst: 850.000, density_kg_per_l: 0.900 }
              as: PlatformAdmin
              captures: { lot2: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "ADDITIVE_PACKAGE", component_code: "ADD-SN-PLUS", received_kg: 400.0, unit_cost_cents_per_kg: 620, kv100_cst: 105.000, density_kg_per_l: 0.960, additive_family: "ZDDP_PCMO" }
              as: PlatformAdmin
              captures: { lot3: $.data.id }
          trigger:
            - call: "GET /component-lots"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /component-lots"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /component-lots"
              payload: { component_type: "BASE_OIL" }
              as: PlatformAdmin
          assert:
            - "the first list returns 2 rows with meta pagination total_count 3 and has_more true"
            - "the second list returns 1 row with total_count 3 and has_more false"
            - "the filtered list returns exactly 1 row whose id == ${lot1}"
            - "response_type == array on all three responses"

      - name: recipe_component_rows_are_immutable_children
        claim_type: Immutability
        grounds:
          - entities.RecipeComponent
          - endpoints[GET /blend-recipes/{id}/components]
        distinguishing_aspect: "RecipeComponent is declared common_fields false: the three rows returned by GET /blend-recipes/{id}/components carry id and created_at only, and no endpoint in the table mutates them."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; ProductSpec LUBE-0W20-SP is ACTIVE with a three-component DRAFT recipe."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe1: $.data.id }
          trigger:
            - call: "GET /blend-recipes/${recipe1}/components"
              payload: {}
              as: ProductManager
          assert:
            - "exactly 3 rows are returned"
            - "each row carries blend_recipe_id == ${recipe1}"
            - "the mass_fraction_pct values are 84.00, 6.00 and 10.00"
            - "no row exposes a version field, because RecipeComponent is common_fields false"

      - name: package_type_enum_rejects_unknown_member
        claim_type: Type Constraints
        grounds:
          - entities.PackageConfiguration.fields.package_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /package-configurations with package_type 'TOTE_500L' - not a declared enum member - returns HTTP 400 with ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; ProductSpec LUBE-0W20-SP is ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
          trigger:
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "TOTE_500L", label_brand: "House Tote", fill_volume_l: 500.0 }
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /package-configurations?product_spec_id=${spec1} returns total_count 0"

      - name: blend_recipe_requires_existing_product_spec_parent
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PRODUCT_SPEC_NOT_FOUND]
          - entities.BlendRecipe.fields.product_spec_id
        distinguishing_aspect: "POST /blend-recipes whose product_spec_id names no ProductSpec returns HTTP 404 with ERR_PRODUCT_SPEC_NOT_FOUND, proving the body foreign key is resolved before any recipe arithmetic runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "00000000-0000-4000-8000-000000000000", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 100.00, nominal_kv100_cst: 5.200, additive_family: "NONE" } ] }
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "data.error_id == ERR_PRODUCT_SPEC_NOT_FOUND"
            - "data.error_id is NOT ERR_RECIPE_FRACTION_SUM even though a single 100.00 component would also be arithmetically valid"

      - name: package_configuration_self_reference_records_supersession
        claim_type: Creation
        grounds:
          - entities.PackageConfiguration.fields.superseded_by_id
          - state_machines.PackageConfiguration.ACTIVE_to_SUPERSEDED
          - endpoints[GET /package-configurations]
        distinguishing_aspect: "Activating a second PAIL_20L house configuration on the same spec supersedes the first, writes the new configuration's id into the old row's superseded_by_id, and makes the old row discoverable via GET /package-configurations filtered on superseded_by_id."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; ProductSpec LUBE-0W20-SP is ACTIVE; one PAIL_20L house configuration is ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "PAIL_20L", label_brand: "House Pail v1", fill_volume_l: 20.0, private_label: false, claim_codes: [] }
              as: ProductManager
              captures: { cfg_a: $.data.id }
            - call: "POST /package-configurations/${cfg_a}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "PAIL_20L", label_brand: "House Pail v2", fill_volume_l: 20.0, private_label: false, claim_codes: [] }
              as: ProductManager
              captures: { cfg_b: $.data.id }
          trigger:
            - call: "POST /package-configurations/${cfg_b}/activate"
              payload: {}
              as: ProductManager
          assert:
            - "PackageConfiguration.${cfg_b}.status == ACTIVE"
            - "PackageConfiguration.${cfg_a}.status == SUPERSEDED"
            - "PackageConfiguration.${cfg_a}.superseded_by_id == ${cfg_b}"
            - "PackageConfiguration.${cfg_b}.superseded_by_id is null"
            - "GET /package-configurations?superseded_by_id=${cfg_b} returns exactly 1 row whose id == ${cfg_a}"

      - name: blend_batch_computed_fields_snapshot_recipe_prediction
        claim_type: Computed Fields
        grounds:
          - entities.BlendBatch.fields.predicted_kv100_cst
          - entities.BlendBatch.fields.claim_eligible
          - calculations.recipe_predicted_kv100
        distinguishing_aspect: "A newly created BlendBatch copies predicted_kv100_cst 7.614 from its recipe and starts with claim_eligible false, retain_count 0 and both cost fields 0, none of which the client can supply."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; ProductSpec ACTIVE and its three-component recipe ACTIVE with predicted_kv100_cst 7.614."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe1: $.data.id }
            - call: "POST /blend-recipes/${recipe1}/activate"
              payload: {}
              as: ProductManager
          trigger:
            - call: "POST /blend-batches"
              payload: { blend_recipe_id: "${recipe1}", batch_code: "B-0001", planned_volume_l: 2000.0 }
              as: BlendOperator
              captures: { batch1: $.data.id }
          assert:
            - "BlendBatch.${batch1}.predicted_kv100_cst == 7.614"
            - "BlendBatch.${batch1}.production_status == PLANNED and qc_status == PENDING"
            - "BlendBatch.${batch1}.claim_eligible == false"
            - "BlendBatch.${batch1}.retain_count == 0"
            - "BlendBatch.${batch1}.estimated_component_cost_cents == 0 and component_cost_cents == 0"
            - "BlendBatch.${batch1}.blend_tank_id, charge_volume_l, window_start, window_end and heel_ratio_actual are all null"

      - name: component_lot_available_kg_is_derived_not_supplied
        claim_type: Computed Fields
        grounds:
          - entities.ComponentLot.fields.available_kg
          - calculations.component_lot_availability
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_charge_conserves_component_lot_mass
          rationale: "That instance already asserts available_kg before the charge, after the charge and after the compensating cancel-charge on all four lots."

  # =========================================================================
  - section: state_machines
    instances:

      - name: charge_from_charging_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - state_machines.BlendBatch.PLANNED_to_CHARGING
        distinguishing_aspect: "A second POST /blend-batches/{id}/charge on a batch already in CHARGING returns HTTP 409 with ERR_INVALID_STATE and leaves the ComponentDraw set untouched at 4 rows."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; BlendBatch B-0001 is CHARGING in TK-01 after a 1990.0 L charge."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 400.0, unit_cost_cents_per_kg: 210, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 1500.0, unit_cost_cents_per_kg: 250, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b2: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "VI_IMPROVER", component_code: "OCP-VII", received_kg: 300.0, unit_cost_cents_per_kg: 940, kv100_cst: 850.000, density_kg_per_l: 0.900, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_v1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "ADDITIVE_PACKAGE", component_code: "ADD-SN-PLUS", received_kg: 400.0, unit_cost_cents_per_kg: 620, kv100_cst: 105.000, density_kg_per_l: 0.960, additive_family: "ZDDP_PCMO", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_a1: $.data.id }
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe1: $.data.id }
            - call: "POST /blend-recipes/${recipe1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-tanks"
              payload: { tank_code: "TK-01", capacity_l: 5000.0, heel_volume_l: 10.0, heel_additive_family: "HDEO_API_CK4", heel_product_code: "HDEO-15W40" }
              as: PlatformAdmin
              captures: { tank1: $.data.id }
            - call: "POST /blend-tanks"
              payload: { tank_code: "TK-02", capacity_l: 5000.0, heel_volume_l: 0.0, heel_additive_family: "NONE" }
              as: PlatformAdmin
              captures: { tank2: $.data.id }
            - call: "POST /blend-batches"
              payload: { blend_recipe_id: "${recipe1}", batch_code: "B-0001", planned_volume_l: 2000.0 }
              as: BlendOperator
              captures: { batch1: $.data.id }
            - call: "POST /blend-batches/${batch1}/charge"
              payload: { blend_tank_id: "${tank1}", charge_volume_l: 1990.0, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: BlendOperator
          trigger:
            - call: "POST /blend-batches/${batch1}/charge"
              payload: { blend_tank_id: "${tank2}", charge_volume_l: 100.0, window_start: "2026-08-02T14:00:00Z", window_end: "2026-08-02T16:00:00Z" }
              as: BlendOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "BlendBatch.${batch1}.blend_tank_id == ${tank1} and charge_volume_l == 1990.0"
            - "BlendTank.${tank2}.status == AVAILABLE"
            - "GET /blend-batches/${batch1}/component-draws returns exactly 4 rows"

      - name: release_from_planned_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - state_machines.BlendBatch.BLENDED_to_RELEASED
        distinguishing_aspect: "Releasing a batch still in PLANNED returns ERR_INVALID_STATE (409) and is decided before the retain-count and segregation-of-duties gates ever run."
        test_recipe:
          setup: ["Logical clock at 2026-08-02T06:00:00Z; ProductSpec ACTIVE, recipe ACTIVE, BlendBatch B-0001 PLANNED with retain_count 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-recipes"
