        grounds: ["errors[ERR_FIELD_TIME_CONFLICT]", "errors[ERR_APPLICATOR_TIME_CONFLICT]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_beats_fiscal_on_schedule
          rationale: "Priority conflicts (state>safety, temporal>fiscal) and both overlap errors are asserted in the Rule-5/Rule-8 instances."

  # ========================================================== endpoints =====
  - section: endpoints
    instances:
      - name: response_envelope_shape_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type and data; error responses carry response_type == 'error' and data.error_id + data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "Env Farm", billing_email: "e@farm.test", rate_per_acre_cents: 100, credit_limit_cents: 1000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "GET /api/work-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "trigger[0] envelope: meta.api_request_id present, response_type == object, data holds the Customer"
            - "trigger[1] envelope: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

