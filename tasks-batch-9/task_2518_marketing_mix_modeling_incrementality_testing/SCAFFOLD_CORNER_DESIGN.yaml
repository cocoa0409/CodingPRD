      - name: adstock_transform_lag_truncation_series
        claim_type: decay_function
        grounds:
          - "calculations.adstock_transform formula variant EFFECT_PERIOD - adstocked[t] = round(spend[t] + SUM over k in 1..min(L, t) of d**k * spend[t-k], 0)"
          - "calculations.adstock_transform - mean_adstocked_spend_cents = round(SUM(adstocked) / T, 0)"
          - "entities.ChannelContribution.adstocked_spend_series and mean_adstocked_spend_cents"
          - "calculations.adstock_transform input_set - periods with no observation contribute spend 0"
        distinguishing_aspect: |
          The min(L, t) term truncates the carryover at the START of the window instead of imputing
          pre-window spend, so period 0 equals its raw spend exactly while later periods accumulate one or
          two decayed lags; a channel with L=1 (B_SOCIAL) therefore never picks up a k=2 term even though
          its window is four periods long.
          
