          - state_machines.PublicNotification.transitions.DRAFT_to_SUBMITTED
          - state_machines.PublicNotification.transitions.APPROVED_to_DISTRIBUTED
        distinguishing_aspect: "A submission that is short exactly one mandatory content element and a submission that is short exactly one tier-required delivery method are refused with different codes, the content gate winning when both are wrong; the accepted submission then proves the same endpoint is single-use, and the on-time certification lands DISTRIBUTED with late_by_hours 0 rather than LATE_DISTRIBUTED."
        test_recipe:
          setup:
            - "PFOA at MCL 4.00 on EPTDS-01 (population 45000) has one accepted 2026Q2 result at 4.50 ng/L, so the LRAA ratio is 1.1250 and the determination is an MCL_VIOLATION."
            - "The determination is issued while the logical clock reads its 2026-08-01T00:00:00.000Z default; population 45000 is above ACUTE_MIN_POPULATION but the ratio is under the acute multiple, so violation_severity is NON_ACUTE and the auto-created notification is TIER_2 with required_by_at 2026-08-31T00:00:00.000Z (720 hours later)."
            - "TIER_2 requires MAIL and POSTING; all six MANDATORY_CONTENT_ELEMENTS are required regardless of tier."
