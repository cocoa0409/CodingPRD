            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-B1-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
