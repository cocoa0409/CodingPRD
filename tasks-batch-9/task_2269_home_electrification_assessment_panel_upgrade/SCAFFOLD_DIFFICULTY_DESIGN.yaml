            - "The second trigger call returns 200 with RebateProject.${proj_id}.status == APPROVED"
            - "The third trigger call (submit from APPROVED) returns 409 ERR_INVALID_STATE_TRANSITION — no submit edge leaves APPROVED, so the loop cannot be re-entered after approval"
            - "RebateProject.${proj_id}.submission_count is still 2 after the rejected third submit"

      - name: project_measure_parallel_install_and_verification_dimensions
        grounds:
