            - { call: "POST /endowment/policies/${pd_pol}/adopt", payload: { expected_pool_version: "${pd_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${pd_pool}", manager_name: "M PD", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { pd_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${pd_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${pd_pool}", fund_code: "FPD", fund_name: "Fund PD", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { pd_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D PD", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { pd_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${pd_fund}", donor_id: "${pd_donor}", external_ref: "PD1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { pd_g1: $.data.id } }
            - { call: "POST /endowment/funds/${pd_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${pd_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${pd_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${pd_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { pd_v1: $.data.id } }
            - { call: "GET /endowment/pools/${pd_pool}", as: InvestmentOfficer, captures: { pd_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${pd_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${pd_pv1}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/funds/${pd_fund}", as: InvestmentOfficer, captures: { pd_status_q1: $.data.fund_status, pd_posture_q1: $.data.spending_posture } }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${pd_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 4000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${pd_pool}", estimated_pool_market_value_cents: 4000000 }, as: InvestmentOfficer, captures: { pd_v2: $.data.id } }
            - { call: "GET /endowment/pools/${pd_pool}", as: InvestmentOfficer, captures: { pd_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${pd_v2}/finalize", payload: { final_pool_market_value_cents: 4000000, expected_pool_version: "${pd_pv2}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/funds/${pd_fund}", as: InvestmentOfficer, captures: { pd_status_q2: $.data.fund_status, pd_posture_q2: $.data.spending_posture } }
            - { call: "POST /endowment/exceptions", payload: { fund_id: "${pd_fund}", fiscal_year: 2026, requested_amount_cents: 300000, justification: "bridge funding" }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { pd_ex: $.data.id } }
            - { call: "POST /endowment/exceptions/${pd_ex}/endorse", payload: {}, as: InvestmentOfficer, as_user_id: "io-2" }
          trigger:
