          - calculations.challenge_deposit_requirement.constants.CHALLENGE_DEPOSIT_MAX_CENTS
          - errors[ERR_CHALLENGE_DEPOSIT_INSUFFICIENT]
        distinguishing_aspect: "On an appraisal reported at 300000000 the raw 1% figure is 3000000, above CHALLENGE_DEPOSIT_MAX_CENTS, so required_deposit_cents clamps DOWN to exactly 2500000 and a deposit of 2500000 is admissible - an implementation that skipped the min() ceiling would reject this same payload with ERR_CHALLENGE_DEPOSIT_INSUFFICIENT. The delta floor scales with the value instead (round_half_up(300000000 * 0.05) == 15000000), which the asserted 280000000 clears by 20000000."
