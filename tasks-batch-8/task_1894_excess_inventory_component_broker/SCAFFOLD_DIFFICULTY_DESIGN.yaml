      - name: return_approve_requires_order_delivered
        grounds:
          - state_machines.ReturnCase.UNDER_REVIEW_to_APPROVED
          - state_machines.SalesOrder
        distinguishing_aspect: |
          Pair ReturnCase -> SalesOrder: approving a return case whose order is only
          SHIPPED (not DELIVERED) is rejected ERR_ORDER_NOT_DELIVERED; after the order
          is delivered the same approve call succeeds and moves the order to
          REFUND_PENDING — the ReturnCase transition is gated by the SalesOrder's state.
        test_recipe:
