  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_listing_blocked_while_generating_project_sits_in_pending_reverification
        grounds:
          - state_machines.CreditBatch.ISSUED_to_LISTED
          - state_machines.PracticeProject.CERTIFIED_to_PENDING_REVERIFICATION
          - state_machines.PracticeProject.PENDING_REVERIFICATION_to_CERTIFIED
          - validations[priority=20]
          - errors[ERR_PROJECT_NOT_CERTIFIED]
        distinguishing_aspect: |
          The CreditBatch is in ISSUED — a perfectly legal from-state for the LISTED
          transition — and nothing about the batch row changes, yet the call is rejected
          because a DIFFERENT entity (the generating PracticeProject) slipped from CERTIFIED
          to PENDING_REVERIFICATION after a PARTIAL reverification. Closing the reverification
          loop with a PASS event restores CERTIFIED and the identical listing call then
          succeeds, so the gate is purely the foreign entity's state, not the batch's.
        test_recipe:
          setup:
            - "Watershed SCR is ACTIVE via an APPROVED TMDL."
            - "PracticeProject PP-A on tract T-101 (COVER_CROP, R_UP, enrolled 100.00, pre 950.50, post 300.00, vintage 2026) is CERTIFIED with verified_acres 80.00, producing CreditBatch A with issued_lbs 520 and verified_ratio 1.0000 in status ISSUED."
            - "The batch has deliberately NOT been listed yet."
            - "A REVERIFICATION event with outcome PARTIAL and verified_acres 60.00 then drives PP-A to PENDING_REVERIFICATION and rewrites the batch's verified_ratio to 0.7500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
