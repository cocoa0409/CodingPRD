scenario: |
  Wish Grant Eligibility, Volunteer Wish Teams & In-Kind Sourcing (Make-A-Wish): child eligibility determination through medical provider certification of a qualifying condition with age criteria, referral intake from families, medical professionals and self-referral with duplicate detection, wish determination visits by trained volunteer teams capturing the child's true wish with age-appropriate methods, wish type categorization across travel, meeting a person, receiving an item and being something with different fulfillment paths, in-kind sourcing from airlines, resorts, retailers and sponsors with donation valuation and availability constraints, medical clearance and travel accommodation for children with complex needs, wish scheduling around treatment cycles with rapid fulfillment for urgent cases, chapter territory assignment and cost-per-wish accountability

domain_name: "wish-grant-inkind-sourcing"
api_prefix: "/wish-grant"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Chapter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Chapter display name."
      - name: territory_zip_prefixes
        type: array
        source: input
        description: "Array of non-empty zip-code prefix strings this chapter covers; used by the territory_assignment selector."
        constraints: "at least one prefix; each prefix 1-5 digits"
      - name: fiscal_year_budget_cents
        type: integer
        source: input
        description: "Total chapter wish budget for the fiscal year, in cents."
        constraints: "> 0"
      - name: target_avg_cost_per_wish_cents
        type: integer
        source: input
        description: "Cost-per-wish accountability ceiling; projected averages strictly above this trigger escalation."
        constraints: "> 0"
      - name: committed_cost_cents
        type: integer
        source: computed
        description: "Sum of total_cost_cents over FulfillmentPlan status == APPROVED for wishes of this chapter. See calculations.chapter_budget_posture."
        default: 0
      - name: granted_wish_count
        type: integer
        source: computed
        description: "Count of wishes status == GRANTED with granted_at inside the current calendar year (logical clock) belonging to this chapter."
        default: 0
      - name: granted_cost_total_cents
        type: integer
        source: computed
        description: "Sum of the completed plan's total_cost_cents over the granted-wish set of granted_wish_count."
        default: 0
      - name: granted_cash_total_cents
        type: integer
        source: computed
        description: "Sum of the completed plan's cash_cost_cents over the same granted-wish set (cash-only accounting variant)."
        default: 0
      - name: avg_cost_blended_cents
        type: integer
        source: computed
        description: "round_half_up(granted_cost_total_cents / granted_wish_count); 0 when count is 0. BLENDED variant of cost-per-wish."
        default: 0
      - name: avg_cost_cash_cents
        type: integer
        source: computed
        description: "round_half_up(granted_cash_total_cents / granted_wish_count); 0 when count is 0. CASH_ONLY variant of cost-per-wish."
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "Derived gate: FROZEN when committed_cost_cents >= floor(fiscal_year_budget_cents * 95 / 100), else OPEN. FROZEN blocks all plan approvals."
        constraints: "one of {OPEN, FROZEN}"

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; chapter this volunteer belongs to."
      - name: full_name
        type: string
        source: input
        description: "Volunteer legal name."
      - name: email
        type: string
        source: input
        description: "Contact email."
      - name: status
        type: enum
        source: system
        description: "Lifecycle: APPLIED on create; TRAINED after training step; ACTIVE after activation; INACTIVE terminal."
        default: APPLIED
        constraints: "one of {APPLIED, TRAINED, ACTIVE, INACTIVE}"

  - name: Child
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Child legal name as given at intake."
      - name: normalized_full_name
        type: string
        source: computed
        description: "lowercase(trim(collapse_whitespace(full_name))); used by duplicate_referral_detection."
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD."
      - name: zip_code
        type: string
        source: input
        description: "Residential zip code; drives chapter_id via territory_assignment."
      - name: parent_email
        type: string
        source: input
        description: "Parent or guardian contact email."
      - name: diagnosis_summary
        type: string
        source: input
        description: "Free-text diagnosis summary captured at intake."
      - name: chapter_id
        type: string
        source: computed
        description: "FK -> Chapter.id; assigned at creation by calculations.territory_assignment (longest matching zip prefix, tie-break created_at ASC)."
      - name: treatment_windows
        type: array
        source: input
        description: "Array of {start_date, end_date} objects (YYYY-MM-DD, CLOSED interval both ends inclusive) during which the child is in active treatment and wishes cannot be scheduled. Replaced wholesale by PATCH /wish-grant/children/{id}."
        default: []

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: system
        description: "FK -> Child.id; the child record created (or reused on re-referral) by POST /wish-grant/referrals."
      - name: source_type
        type: enum
        source: input
        description: "Intake channel."
        constraints: "one of {FAMILY, MEDICAL_PROFESSIONAL, SELF}"
      - name: prognosis_months
        type: integer
        source: input
        description: "Expected prognosis horizon in whole months; <= 6 classifies the derived wish as RAPID. Null allowed (treated as STANDARD)."
        constraints: ">= 0 or null"
      - name: status
        type: enum
        source: system
        description: "Eligibility lifecycle state."
        default: PENDING_CERTIFICATION
        constraints: "one of {PENDING_CERTIFICATION, CERTIFIED, APPROVED, DENIED}"
      - name: qualifying_condition
        type: enum
        source: input
        description: "Set by certify. NON_QUALIFYING auto-denies the referral."
        constraints: "one of {ONCOLOGY, CARDIAC, NEUROLOGIC, GENETIC, OTHER_PROGRESSIVE, NON_QUALIFYING}; null until certified"
      - name: certification_note
        type: string
        source: input
        description: "Optional provider note captured at certify."
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of certification; null until certified."
      - name: age_months_at_intake
        type: integer
        source: computed
        description: "Complete calendar months from child.date_of_birth to the logical-clock date at referral creation (see calculations.age_months)."
      - name: denial_reason
        type: string
        source: input
        description: "Required when determine decision == DENIED; system-set to CONDITION_NOT_QUALIFYING on auto-denial."
      - name: determined_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of determination or auto-denial; null until then."
      - name: wish_id
        type: string
        source: computed
        description: "FK -> Wish.id; the wish created by an APPROVED determination; null otherwise."

  - name: Wish
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: system
        description: "FK -> Child.id; copied from the approved referral."
      - name: chapter_id
        type: string
        source: system
        description: "FK -> Chapter.id; copied from the child at wish creation."
      - name: referral_id
        type: string
        source: system
        description: "FK -> Referral.id; the referral that produced this wish."
      - name: wish_type
        type: enum
        source: input
        description: "Captured at the determination visit; null until the wish is DETERMINED."
        constraints: "one of {TRAVEL, MEET_PERSON, RECEIVE_ITEM, BE_SOMETHING} or null"
      - name: urgency
        type: enum
        source: computed
        description: "RAPID when the referral's prognosis_months <= 6, else STANDARD. Frozen at wish creation."
        constraints: "one of {STANDARD, RAPID}"
      - name: status
        type: enum
        source: system
        description: "Fulfillment lifecycle; see state_machines.Wish."
        default: CREATED
        constraints: "one of {CREATED, DETERMINATION_PENDING, DETERMINED, PLANNING, PLAN_APPROVED, READY_TO_SCHEDULE, SCHEDULED, MEDICAL_HOLD, GRANTED}"
      - name: true_wish_description
        type: string
        source: input
        description: "The child's true wish narrative captured by the volunteer team at visit completion; null until DETERMINED."
      - name: determined_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the determination visit completed; null until DETERMINED. Basis of the RAPID SLA deadline."
      - name: hold_return_state
        type: enum
        source: system
        description: "State to restore when a medical hold lifts; PLAN_APPROVED or READY_TO_SCHEDULE (SCHEDULED wishes collapse to READY_TO_SCHEDULE because their event is cancelled)."
        constraints: "one of {PLAN_APPROVED, READY_TO_SCHEDULE} or null"
      - name: granted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of grant completion; null until GRANTED."

  - name: WishTeam
    parent: null
    common_fields: true
    fields:
      - name: wish_id
        type: string
        source: input
        description: "FK -> Wish.id; wish this team is determining."
      - name: lead_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; team lead. Must differ from second_volunteer_id."
      - name: second_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; second team member. Must differ from lead_volunteer_id."
      - name: status
        type: enum
        source: system
        description: "ACTIVE while determining; DISBANDED when superseded by a replacement team; COMPLETED when its visit completes the determination."
        default: ACTIVE
        constraints: "one of {ACTIVE, DISBANDED, COMPLETED}"

  - name: WishVisit
    parent: null
    common_fields: true
    fields:
      - name: wish_team_id
        type: string
        source: input
        description: "FK -> WishTeam.id; team performing the visit."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Visit window start, ISO 8601 UTC. Windows are HALF-OPEN [scheduled_start, scheduled_end) for overlap checks."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Visit window end, ISO 8601 UTC; must be strictly after scheduled_start."
      - name: visit_method
        type: enum
        source: input
        description: "Age-appropriate elicitation method; validated against the child's age at scheduled_start (see calculations.visit_method_eligibility)."
        constraints: "one of {PLAY_BASED, DRAWING, INTERVIEW}"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED on creation; COMPLETED or NO_SHOW via conclude; CANCELLED when its team is superseded or completes another visit."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}"
      - name: captured_true_wish
        type: string
        source: input
        description: "True-wish narrative; required iff conclude outcome == COMPLETED; null otherwise."
      - name: captured_wish_type
        type: enum
        source: input
        description: "Wish type captured at completion; required iff conclude outcome == COMPLETED; null otherwise."
        constraints: "one of {TRAVEL, MEET_PERSON, RECEIVE_ITEM, BE_SOMETHING} or null"

  - name: DonationOffer
    parent: null
    common_fields: true
    fields:
      - name: partner_name
        type: string
        source: input
        description: "In-kind partner display name (airline, resort, retailer, or sponsor)."
      - name: category
        type: enum
        source: input
        description: "Partner category; gates which wish types may reserve this offer (see validations on category mapping)."
        constraints: "one of {AIRLINE, RESORT, RETAILER, SPONSOR}"
      - name: valuation_method
        type: enum
        source: input
        description: "Selects the fair-market-value variant in calculations.donation_fmv_unit."
        constraints: "one of {RETAIL_BASIS, PARTNER_DECLARED}"
      - name: description
        type: string
        source: input
        description: "What is being donated (e.g. '2 round-trip domestic tickets')."
      - name: quantity_total
        type: integer
        source: input
        description: "Total units donated. Decremented together with quantity_reserved when units are CONSUMED so quantity_available is unchanged by consumption."
        constraints: ">= 1 at creation"
      - name: quantity_reserved
        type: integer
        source: computed
        description: "Units currently held by PlanLineItems in status RESERVED or COMMITTED. Conservation: quantity_reserved + quantity_available == quantity_total except that consumption decrements reserved and total together."
        default: 0
      - name: quantity_available
        type: integer
        source: computed
        description: "quantity_total - quantity_reserved."
        default: 0
      - name: unit_retail_cents
        type: integer
        source: input
        description: "Published retail value per unit, in cents."
        constraints: ">= 1"
      - name: partner_declared_unit_cents
        type: integer
        source: input
        description: "Partner-declared value per unit; required iff valuation_method == PARTNER_DECLARED, ignored otherwise."
        constraints: ">= 1 or null"
      - name: fmv_unit_cents
        type: integer
        source: computed
        description: "Fair market value per unit per calculations.donation_fmv_unit (variant selected by valuation_method); integer cents, round_half_up at the unit level before any multiplication."
      - name: valid_from
        type: string
        source: input
        description: "First date (YYYY-MM-DD) the offer may be reserved."
      - name: valid_until
        type: string
        source: input
        description: "Last date (YYYY-MM-DD) the offer may be reserved; must be >= valid_from."
      - name: status
        type: enum
        source: system
        description: "AVAILABLE while reservable; FULLY_RESERVED when quantity_available hits 0; back to AVAILABLE on release; EXPIRED via clock sweep when unreserved and past valid_until; DEPLETED when fully consumed."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, FULLY_RESERVED, EXPIRED, DEPLETED}"

  - name: FulfillmentPlan
    parent: null
    common_fields: true
    fields:
      - name: wish_id
        type: string
        source: input
        description: "FK -> Wish.id; wish this plan funds."
      - name: cash_cost_cents
        type: integer
        source: input
        description: "Cash (purchased) portion of the plan, in cents."
        constraints: ">= 0"
      - name: notes
        type: string
        source: input
        description: "Optional planner notes."
      - name: in_kind_value_cents
        type: integer
        source: computed
        description: "Sum of line_fmv_cents over the plan's PlanLineItems with status in {RESERVED, COMMITTED, CONSUMED} (RELEASED excluded). See calculations.plan_cost_totals."
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: "cash_cost_cents + in_kind_value_cents. All integer cents; no rounding at line or total level (unit-level rounding happens in donation_fmv_unit)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "DRAFT -> PENDING_APPROVAL -> APPROVED -> COMPLETED; APPROVED or PENDING_APPROVAL -> CANCELLED via abort; DRAFT or PENDING_APPROVAL -> SUPERSEDED when a replacement plan is created."
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, APPROVED, CANCELLED, SUPERSEDED, COMPLETED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the creator; used by the segregation-of-duties check on approve."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approver; null until APPROVED."
      - name: escalation_required
        type: boolean
        source: computed
        description: "True when, at approval time, the projected chapter average including this plan strictly exceeds target_avg_cost_per_wish_cents (see calculations.cost_per_wish_escalation)."
        default: false

  - name: PlanLineItem
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> FulfillmentPlan.id; owning plan."
      - name: donation_offer_id
        type: string
        source: input
        description: "FK -> DonationOffer.id; reserved offer."
      - name: quantity
        type: integer
        source: input
        description: "Units reserved."
        constraints: ">= 1"
      - name: line_fmv_cents
        type: integer
        source: computed
        description: "quantity * DonationOffer.fmv_unit_cents, pinned at reservation time (offer fmv already rounded at unit level)."
      - name: status
        type: enum
        source: system
        description: "RESERVED on create; COMMITTED on plan approval; CONSUMED on grant completion; RELEASED on abort or supersede."
        default: RESERVED
        constraints: "one of {RESERVED, COMMITTED, CONSUMED, RELEASED}"

  - name: MedicalClearance
    parent: null
    common_fields: true
    fields:
      - name: wish_id
        type: string
        source: input
        description: "FK -> Wish.id; TRAVEL wishes only."
      - name: status
        type: enum
        source: system
        description: "PENDING on request; CLEARED, CONDITIONAL, or DENIED via decide; REVOKED via decide from CLEARED or CONDITIONAL."
        default: PENDING
        constraints: "one of {PENDING, CLEARED, CONDITIONAL, DENIED, REVOKED}"
      - name: accommodations
        type: array
        source: input
        description: "Array of accommodation strings (e.g. 'wheelchair', 'oxygen', 'ground-transport-only'); required non-empty iff decision == CONDITIONAL."
        default: []
      - name: valid_until
        type: string
        source: input
        description: "YYYY-MM-DD; last date the clearance covers travel; required iff decision is CLEARED or CONDITIONAL; null otherwise."
      - name: decision_note
        type: string
        source: input
        description: "Optional provider note at decide time."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent decide; null while PENDING."

  - name: WishEvent
    parent: null
    common_fields: true
    fields:
      - name: wish_id
        type: string
        source: input
        description: "FK -> Wish.id; the scheduled wish."
      - name: event_start_date
        type: string
        source: input
        description: "YYYY-MM-DD first day of the wish event. CLOSED interval [event_start_date, event_end_date] for blackout overlap checks."
      - name: event_end_date
        type: string
        source: input
        description: "YYYY-MM-DD last day of the wish event; must be >= event_start_date."
      - name: status
        type: enum
        source: system
        description: "SCHEDULED on creation; COMPLETED via complete; CANCELLED when a medical clearance revocation holds the wish."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of completion; null until COMPLETED."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Volunteer
    initial_state: APPLIED
    terminal_states: [INACTIVE]
    transitions:
      - from: APPLIED
        to: TRAINED
        trigger: "POST /wish-grant/volunteers/{id}/transition with target_state == TRAINED"
        actor: WishCoordinator
        preconditions: ["volunteer.status == APPLIED"]
        side_effects: ["volunteer.version += 1"]
      - from: TRAINED
        to: ACTIVE
        trigger: "POST /wish-grant/volunteers/{id}/transition with target_state == ACTIVE"
        actor: WishCoordinator
        preconditions: ["volunteer.status == TRAINED"]
        side_effects: ["volunteer.version += 1"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /wish-grant/volunteers/{id}/transition with target_state == INACTIVE"
        actor: WishCoordinator
        preconditions: ["volunteer.status == ACTIVE"]
        side_effects: ["volunteer.version += 1"]
        note: "Deactivation does not alter existing teams or visits; team composition is frozen at team creation."

  - entity: Referral
    initial_state: PENDING_CERTIFICATION
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING_CERTIFICATION
        to: CERTIFIED
        trigger: "POST /wish-grant/referrals/{id}/certify with qualifying_condition != NON_QUALIFYING"
        actor: MedicalProvider
        preconditions: ["referral.status == PENDING_CERTIFICATION", "qualifying_condition in {ONCOLOGY, CARDIAC, NEUROLOGIC, GENETIC, OTHER_PROGRESSIVE}"]
        side_effects: ["referral.certified_at = current logical clock", "referral.version += 1"]
      - from: PENDING_CERTIFICATION
        to: DENIED
        trigger: "POST /wish-grant/referrals/{id}/certify with qualifying_condition == NON_QUALIFYING (auto-denial)"
        actor: MedicalProvider
        preconditions: ["referral.status == PENDING_CERTIFICATION"]
        side_effects: ["referral.certified_at = current logical clock", "referral.determined_at = current logical clock", "referral.denial_reason = 'CONDITION_NOT_QUALIFYING'", "referral.version += 1"]
      - from: CERTIFIED
        to: APPROVED
        trigger: "POST /wish-grant/referrals/{id}/determine with decision == APPROVED"
        actor: EligibilityReviewer
        preconditions:
          - "referral.status == CERTIFIED"
          - "age_months(child.date_of_birth, current logical clock date) < 216 (child must still be under 18 at determination)"
        side_effects:
          - "create Wish: status CREATED, child_id/chapter_id copied from child, referral_id set, urgency per calculations.urgency_classification, version 1"
          - "referral.wish_id = new wish id"
          - "referral.determined_at = current logical clock"
          - "referral.version += 1"
      - from: CERTIFIED
        to: DENIED
        trigger: "POST /wish-grant/referrals/{id}/determine with decision == DENIED"
        actor: EligibilityReviewer
        preconditions: ["referral.status == CERTIFIED", "denial_reason present"]
        side_effects: ["referral.determined_at = current logical clock", "referral.version += 1"]
        note: "The under-18 age re-check applies to APPROVED only; a reviewer may always DENY."

  - entity: Wish
    initial_state: CREATED
    terminal_states: [GRANTED]
    transitions:
      - from: CREATED
        to: DETERMINATION_PENDING
        trigger: "POST /wish-grant/wish-teams"
        actor: WishCoordinator
        preconditions:
          - "wish.status == CREATED"
          - "expected_wish_version == wish.version (OCC)"
          - "lead_volunteer_id != second_volunteer_id"
          - "both volunteers status == ACTIVE"
          - "both volunteers' chapter_id == wish.chapter_id"
        side_effects: ["create WishTeam status ACTIVE", "wish.version += 1"]
      - from: DETERMINATION_PENDING
        to: DETERMINATION_PENDING
        trigger: "POST /wish-grant/wish-teams (team replacement / supersede)"
        actor: WishCoordinator
        preconditions: ["wish.status == DETERMINATION_PENDING", "expected_wish_version == wish.version (OCC)", "same team-composition checks as creation"]
        side_effects:
          - "existing ACTIVE WishTeam for this wish -> DISBANDED (team.version += 1)"
          - "that team's WishVisits with status == SCHEDULED -> CANCELLED (visit.version += 1 each)"
          - "create new WishTeam status ACTIVE"
          - "wish.version += 1"
        note: "Self-loop: state label unchanged but version advances and the old team is disbanded."
      - from: DETERMINATION_PENDING
        to: DETERMINED
        trigger: "POST /wish-grant/wish-visits/{id}/conclude with outcome == COMPLETED"
        actor: Volunteer
        preconditions: ["visit.status == SCHEDULED", "visit's team status == ACTIVE", "acting volunteer is lead or second on the team", "wish.status == DETERMINATION_PENDING"]
        side_effects:
          - "visit -> COMPLETED; captured_true_wish/captured_wish_type recorded"
          - "wish.wish_type = captured_wish_type; wish.true_wish_description = captured_true_wish; wish.determined_at = current logical clock"
          - "team -> COMPLETED (team.version += 1)"
          - "the team's OTHER WishVisits with status == SCHEDULED -> CANCELLED (visit.version += 1 each)"
          - "wish.version += 1"
      - from: DETERMINED
        to: PLANNING
        trigger: "POST /wish-grant/fulfillment-plans"
        actor: WishCoordinator | ChapterDirector
        preconditions: ["wish.status in {DETERMINED, PLANNING}", "expected_wish_version == wish.version (OCC)", "no FulfillmentPlan with status == APPROVED exists for this wish"]
        side_effects:
          - "any existing plan in {DRAFT, PENDING_APPROVAL} -> SUPERSEDED; its RESERVED PlanLineItems -> RELEASED; each affected DonationOffer.quantity_reserved -= line quantity (FULLY_RESERVED -> AVAILABLE when quantity_available > 0 again)"
          - "create FulfillmentPlan status DRAFT, created_by_user_id = X-User-ID"
          - "wish.version += 1"
      - from: PLANNING
        to: PLANNING
        trigger: "POST /wish-grant/fulfillment-plans (plan replacement / supersede)"
        actor: WishCoordinator | ChapterDirector
        preconditions: ["same as DETERMINED -> PLANNING"]
        side_effects: ["same supersede cascade as DETERMINED -> PLANNING", "wish.version += 1"]
      - from: PLANNING
        to: PLAN_APPROVED
        trigger: "POST /wish-grant/fulfillment-plans/{id}/approve"
        actor: ChapterDirector | NationalDirector
        preconditions:
          - "plan.status == PENDING_APPROVAL"
          - "plan.created_by_user_id != approver X-User-ID (segregation of duties)"
          - "chapter.posture == OPEN (committed_cost_cents < 95% threshold)"
          - "chapter.committed_cost_cents + plan.total_cost_cents <= chapter.fiscal_year_budget_cents"
          - "if calculations.cost_per_wish_escalation says escalation_required, actor role must be NationalDirector"
        side_effects:
          - "plan -> APPROVED; plan.approved_by_user_id = X-User-ID; plan.escalation_required recorded; plan.version += 1"
          - "plan's RESERVED PlanLineItems -> COMMITTED (line.version += 1 each)"
          - "chapter.committed_cost_cents += plan.total_cost_cents; chapter.posture recomputed; chapter.version += 1"
          - "wish -> PLAN_APPROVED, wish.version += 1"
          - "immediately evaluate calculations.wish_ready_gate: for MEET_PERSON / RECEIVE_ITEM / BE_SOMETHING the gate is satisfied by approval itself, so wish continues to READY_TO_SCHEDULE in the same request"
      - from: PLAN_APPROVED
        to: READY_TO_SCHEDULE
        trigger: "auto: wish_ready_gate satisfied (plan approval for non-TRAVEL types; POST /wish-grant/medical-clearances/{id}/decide with CLEARED or CONDITIONAL for TRAVEL)"
        actor: system
        preconditions: ["wish.status == PLAN_APPROVED", "type gate per calculations.wish_ready_gate holds"]
        side_effects: ["wish.version += 1"]
      - from: PLAN_APPROVED
        to: PLANNING
        trigger: "POST /wish-grant/fulfillment-plans/{id}/abort from APPROVED"
        actor: ChapterDirector
        preconditions: ["plan.status == APPROVED", "wish.status != SCHEDULED"]
        side_effects: ["abort cascade A1-A5 (see transitive_cascade instances)", "wish.version += 1"]
      - from: READY_TO_SCHEDULE
        to: PLANNING
        trigger: "POST /wish-grant/fulfillment-plans/{id}/abort from APPROVED"
        actor: ChapterDirector
        preconditions: ["plan.status == APPROVED"]
        side_effects: ["abort cascade A1-A5", "wish.version += 1"]
      - from: READY_TO_SCHEDULE
        to: SCHEDULED
        trigger: "POST /wish-grant/wish-events"
        actor: WishCoordinator
        preconditions:
          - "wish.status == READY_TO_SCHEDULE"
          - "TRAVEL wishes: a MedicalClearance in {CLEARED, CONDITIONAL} exists with valid_until >= event_end_date"
          - "no treatment_windows entry [ws, we] (closed) intersects [event_start_date, event_end_date] (closed)"
          - "urgency == RAPID: event_start_date <= date(determined_at) + 14 days (inclusive)"
        side_effects: ["create WishEvent status SCHEDULED", "wish.version += 1"]
      - from: SCHEDULED
        to: GRANTED
        trigger: "POST /wish-grant/wish-events/{id}/complete"
        actor: WishCoordinator
        preconditions: ["event.status == SCHEDULED", "wish.status == SCHEDULED"]
        side_effects: ["grant cascade E1-E6 (see transitive_cascade instances)", "wish.granted_at = current logical clock", "wish.version += 1"]
      - from: PLAN_APPROVED
        to: MEDICAL_HOLD
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == REVOKED (TRAVEL wishes only)"
        actor: MedicalProvider
        preconditions: ["wish.wish_type == TRAVEL", "revoked clearance belongs to this wish"]
        side_effects: ["wish.hold_return_state = PLAN_APPROVED", "wish.version += 1"]
      - from: READY_TO_SCHEDULE
        to: MEDICAL_HOLD
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == REVOKED (TRAVEL wishes only)"
        actor: MedicalProvider
        preconditions: ["wish.wish_type == TRAVEL", "revoked clearance belongs to this wish"]
        side_effects: ["wish.hold_return_state = READY_TO_SCHEDULE", "wish.version += 1"]
      - from: SCHEDULED
        to: MEDICAL_HOLD
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == REVOKED (TRAVEL wishes only)"
        actor: MedicalProvider
        preconditions: ["wish.wish_type == TRAVEL", "revoked clearance belongs to this wish"]
        side_effects: ["wish.hold_return_state = READY_TO_SCHEDULE (event is lost)", "wish's WishEvents with status == SCHEDULED -> CANCELLED (event.version += 1 each)", "wish.version += 1"]
      - from: MEDICAL_HOLD
        to: PLAN_APPROVED
        trigger: "auto on POST /wish-grant/medical-clearances/{id}/decide with decision in {CLEARED, CONDITIONAL} when hold_return_state == PLAN_APPROVED"
        actor: system
        preconditions: ["wish.status == MEDICAL_HOLD", "wish.hold_return_state == PLAN_APPROVED"]
        side_effects: ["wish.hold_return_state = null", "wish.version += 1"]
      - from: MEDICAL_HOLD
        to: READY_TO_SCHEDULE
        trigger: "auto on POST /wish-grant/medical-clearances/{id}/decide with decision in {CLEARED, CONDITIONAL} when hold_return_state == READY_TO_SCHEDULE"
        actor: system
        preconditions: ["wish.status == MEDICAL_HOLD", "wish.hold_return_state == READY_TO_SCHEDULE"]
        side_effects: ["wish.hold_return_state = null", "wish.version += 1"]

  - entity: WishTeam
    initial_state: ACTIVE
    terminal_states: [DISBANDED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: DISBANDED
        trigger: "auto: superseded by a new POST /wish-grant/wish-teams for the same wish"
        actor: system
        preconditions: ["team.status == ACTIVE"]
        side_effects: ["team's SCHEDULED WishVisits -> CANCELLED (visit.version += 1 each)", "team.version += 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "auto: one of its visits concludes with outcome == COMPLETED"
        actor: system
        preconditions: ["team.status == ACTIVE"]
        side_effects: ["team's OTHER SCHEDULED WishVisits -> CANCELLED (visit.version += 1 each)", "team.version += 1"]

  - entity: WishVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /wish-grant/wish-visits/{id}/conclude with outcome == COMPLETED"
        actor: Volunteer
        preconditions: ["visit.status == SCHEDULED", "visit's team status == ACTIVE", "acting volunteer is lead or second on the team", "captured_true_wish and captured_wish_type present"]
        side_effects: ["wish determination cascade (see state_machines.Wish DETERMINATION_PENDING -> DETERMINED)", "visit.version += 1"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /wish-grant/wish-visits/{id}/conclude with outcome == NO_SHOW"
        actor: Volunteer
        preconditions: ["visit.status == SCHEDULED", "visit's team status == ACTIVE", "acting volunteer is lead or second on the team"]
        side_effects: ["visit.version += 1; wish and team unchanged (team stays ACTIVE, wish stays DETERMINATION_PENDING)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "auto: team superseded, or team completed by another visit"
        actor: system
        preconditions: ["visit.status == SCHEDULED"]
        side_effects: ["visit.version += 1"]

  - entity: DonationOffer
    initial_state: AVAILABLE
    terminal_states: [EXPIRED, DEPLETED]
    transitions:
      - from: AVAILABLE
        to: FULLY_RESERVED
        trigger: "auto: POST /wish-grant/fulfillment-plans/{id}/line-items reserves the last available unit"
        actor: system
        preconditions: ["after the reservation, quantity_available == 0"]
        side_effects: ["offer.version += 1"]
      - from: FULLY_RESERVED
        to: AVAILABLE
        trigger: "auto: a RESERVED/COMMITTED line is RELEASED (plan abort or supersede) and quantity_available > 0 again"
        actor: system
        preconditions: ["after the release, quantity_available > 0"]
        side_effects: ["offer.version += 1"]
      - from: AVAILABLE
        to: EXPIRED
        trigger: "auto: POST /wish-grant/_clock/set_current_utc advances the clock past valid_until"
        actor: system
        preconditions: ["offer.status == AVAILABLE", "quantity_reserved == 0", "current logical clock date > valid_until"]
        side_effects: ["offer.version += 1"]
        note: "Reserved offers are partner commitments and are never auto-expired. Independently of the sweep, reserving an offer whose valid_until is already in the past fails with ERR_DONATION_EXPIRED."
      - from: AVAILABLE
        to: DEPLETED
        trigger: "auto: consumption at grant completion reduces quantity_total to 0"
        actor: system
        preconditions: ["after consumption, quantity_total == 0 (and quantity_reserved == 0)"]
        side_effects: ["offer.version += 1"]
      - from: FULLY_RESERVED
        to: DEPLETED
        trigger: "auto: consumption at grant completion reduces quantity_total to 0"
        actor: system
        preconditions: ["after consumption, quantity_total == 0 (and quantity_reserved == 0)"]
        side_effects: ["offer.version += 1"]

  - entity: FulfillmentPlan
    initial_state: DRAFT
    terminal_states: [CANCELLED, SUPERSEDED, COMPLETED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /wish-grant/fulfillment-plans/{id}/submit"
        actor: WishCoordinator | ChapterDirector
        preconditions: ["plan.status == DRAFT", "plan has >= 1 PlanLineItem with status == RESERVED OR plan.cash_cost_cents > 0"]
        side_effects: ["plan.version += 1"]
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /wish-grant/fulfillment-plans/{id}/approve"
        actor: ChapterDirector | NationalDirector
        preconditions: ["see state_machines.Wish PLANNING -> PLAN_APPROVED (state, SoD, fiscal, escalation)"]
        side_effects: ["lines -> COMMITTED", "chapter.committed_cost_cents += plan.total_cost_cents", "wish -> PLAN_APPROVED (+ ready gate)", "plan.version += 1"]
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /wish-grant/fulfillment-plans/{id}/abort"
        actor: ChapterDirector
        preconditions: ["plan.status == PENDING_APPROVAL"]
        side_effects: ["plan's RESERVED lines -> RELEASED; offers released (quantity_reserved -= quantity; FULLY_RESERVED -> AVAILABLE when quantity_available > 0)", "plan.in_kind_value_cents recomputed (excludes RELEASED)", "wish unchanged (stays PLANNING)", "plan.version += 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /wish-grant/fulfillment-plans/{id}/abort"
        actor: ChapterDirector
        preconditions: ["plan.status == APPROVED", "wish.status != SCHEDULED"]
        side_effects: ["abort cascade A1-A5: lines COMMITTED -> RELEASED, offers released, chapter.committed_cost_cents -= plan.total_cost_cents (posture recomputed), wish PLAN_APPROVED|READY_TO_SCHEDULE -> PLANNING", "plan.version += 1"]
      - from: APPROVED
        to: COMPLETED
        trigger: "auto: POST /wish-grant/wish-events/{id}/complete on the wish's event"
        actor: system
        preconditions: ["plan.status == APPROVED"]
        side_effects: ["plan's COMMITTED lines -> CONSUMED; per line offer.quantity_reserved -= quantity AND offer.quantity_total -= quantity (quantity_available unchanged); offer -> DEPLETED when quantity_total hits 0", "plan.version += 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "auto: replacement POST /wish-grant/fulfillment-plans for the same wish"
        actor: system
        preconditions: ["plan.status == DRAFT"]
        side_effects: ["plan's RESERVED lines -> RELEASED; offers released", "plan.version += 1"]
      - from: PENDING_APPROVAL
        to: SUPERSEDED
        trigger: "auto: replacement POST /wish-grant/fulfillment-plans for the same wish"
        actor: system
        preconditions: ["plan.status == PENDING_APPROVAL"]
        side_effects: ["plan's RESERVED lines -> RELEASED; offers released", "plan.version += 1"]

  - entity: PlanLineItem
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "auto: plan approved"
        actor: system
        preconditions: ["line.status == RESERVED"]
        side_effects: ["line.version += 1"]
      - from: COMMITTED
        to: CONSUMED
        trigger: "auto: wish event completed"
        actor: system
        preconditions: ["line.status == COMMITTED"]
        side_effects: ["offer.quantity_reserved -= quantity", "offer.quantity_total -= quantity (quantity_available unchanged)", "offer -> DEPLETED when quantity_total hits 0", "line.version += 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "auto: plan aborted or superseded"
        actor: system
        preconditions: ["line.status == RESERVED"]
        side_effects: ["offer.quantity_reserved -= quantity", "offer FULLY_RESERVED -> AVAILABLE when quantity_available > 0", "line.version += 1"]
      - from: COMMITTED
        to: RELEASED
        trigger: "auto: plan aborted from APPROVED"
        actor: system
        preconditions: ["line.status == COMMITTED"]
        side_effects: ["offer.quantity_reserved -= quantity", "offer FULLY_RESERVED -> AVAILABLE when quantity_available > 0", "line.version += 1"]

  - entity: MedicalClearance
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == CLEARED"
        actor: MedicalProvider
        preconditions: ["clearance.status == PENDING", "valid_until present"]
        side_effects: ["decided_at = current logical clock", "TRAVEL wish gate re-evaluated: wish PLAN_APPROVED -> READY_TO_SCHEDULE, or MEDICAL_HOLD -> hold_return_state", "clearance.version += 1"]
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == CONDITIONAL"
        actor: MedicalProvider
        preconditions: ["clearance.status == PENDING", "valid_until present", "accommodations non-empty"]
        side_effects: ["same wish gate effects as CLEARED", "clearance.version += 1"]
      - from: PENDING
        to: DENIED
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == DENIED"
        actor: MedicalProvider
        preconditions: ["clearance.status == PENDING"]
        side_effects: ["decided_at = current logical clock", "wish unchanged (TRAVEL wish without clearance stays PLAN_APPROVED)", "clearance.version += 1"]
      - from: CLEARED
        to: REVOKED
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == REVOKED"
        actor: MedicalProvider
        preconditions: ["clearance.status == CLEARED"]
        side_effects: ["TRAVEL wish hold cascade: wish in {PLAN_APPROVED, READY_TO_SCHEDULE, SCHEDULED} -> MEDICAL_HOLD; SCHEDULED events -> CANCELLED", "clearance.version += 1"]
      - from: CONDITIONAL
        to: REVOKED
        trigger: "POST /wish-grant/medical-clearances/{id}/decide with decision == REVOKED"
        actor: MedicalProvider
        preconditions: ["clearance.status == CONDITIONAL"]
        side_effects: ["same hold cascade as from CLEARED", "clearance.version += 1"]

  - entity: WishEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /wish-grant/wish-events/{id}/complete"
        actor: WishCoordinator
        preconditions: ["event.status == SCHEDULED", "wish.status == SCHEDULED"]
        side_effects: ["grant cascade E1-E6 (see transitive_cascade instances)", "event.completed_at = current logical clock", "event.version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "auto: medical clearance revocation puts the TRAVEL wish on MEDICAL_HOLD"
        actor: system
        preconditions: ["event.status == SCHEDULED"]
        side_effects: ["event.version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: team-create-stale-wish
    parent_entity: Wish
    write_endpoint: "POST /wish-grant/wish-teams"
    occ_field: "expected_wish_version"
    description: |
      Creating a WishTeam for a wish whose version has advanced since the
      client last read it is rejected. Replacing a determination team is a
      legitimate supersede under product semantics (the old team is disbanded),
      so a second create issued after the first one fully completed would also
      legitimately succeed; the OCC check on Wish.version is the mechanism that
      detects the writer's stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-create-stale-wish
    parent_entity: Wish
    write_endpoint: "POST /wish-grant/fulfillment-plans"
    occ_field: "expected_wish_version"
    description: |
      Creating a FulfillmentPlan for a wish whose version has advanced since
      the client last read it is rejected. A new plan legitimately supersedes
      the prior DRAFT or PENDING_APPROVAL plan under product semantics, so a
      second create issued after the first one fully completed would also
      legitimately succeed; the OCC check on Wish.version is the mechanism that
      detects the writer's stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: age_months
    trigger: "referral creation (intake bounds + SELF minimum), determination approval re-check, visit method eligibility"
    algorithm: threshold
    formula: |
      age_months(dob, ref_date) =
        (ref_date.year - dob.year) * 12 + (ref_date.month - dob.month)
        - (1 if ref_date.day < dob.day else 0)
      All dates come from the logical clock (POST /wish-grant/_clock/set_current_utc;
      default 2026-09-01T00:00:00Z). Boundaries are inclusive/exclusive exactly as:
      intake eligible iff 30 <= age_months < 216;
      SELF referrals additionally require age_months >= 156;
      determination APPROVED requires age_months < 216 at determination date.
    input_set: "the child attached to the referral / visit; reference date = current logical clock date"
    constants:
      MIN_INTAKE_AGE_MONTHS: 30
      MAX_INTAKE_AGE_MONTHS_EXCLUSIVE: 216
      SELF_REFERRAL_MIN_AGE_MONTHS: 156
    precision: "whole calendar months, integer"
    variants: []

  - name: urgency_classification
    trigger: "wish creation (referral determination APPROVED)"
    algorithm: threshold
    formula: |
      urgency = RAPID if referral.prognosis_months is not null and referral.prognosis_months <= URGENT_PROGNOSIS_MONTHS
                else STANDARD
      Frozen on the Wish at creation; later referral edits do not change it.
    input_set: "the referral being approved"
    constants:
      URGENT_PROGNOSIS_MONTHS: 6
    precision: "integer months, boundary inclusive (6 -> RAPID)"
    variants: []

  - name: rapid_sla_deadline
    trigger: "POST /wish-grant/wish-events validation for urgency == RAPID wishes"
    algorithm: threshold
    formula: |
      deadline_date = date(wish.determined_at) + RAPID_SLA_DAYS
      scheduling valid iff event.event_start_date <= deadline_date   (inclusive)
    input_set: "the wish being scheduled"
    constants:
      RAPID_SLA_DAYS: 14
    precision: "whole days, date arithmetic"
    variants: []

  - name: donation_fmv_unit
    trigger: "DonationOffer creation (and conceptually whenever valuation inputs change)"
    algorithm: weighted_scoring
    formula: |
      if valuation_method == RETAIL_BASIS:
          fmv_unit_cents = unit_retail_cents
      if valuation_method == PARTNER_DECLARED:
          cap = round_half_up(unit_retail_cents * PARTNER_DECLARED_CAP_PCT / 100)
          fmv_unit_cents = min(partner_declared_unit_cents, cap)
      partner_declared_unit_cents is required iff valuation_method == PARTNER_DECLARED.
      Rounding happens HERE, at the unit level, to integer cents; no later rounding.
    input_set: "the DonationOffer being created"
    constants:
      PARTNER_DECLARED_CAP_PCT: 80
    precision: "integer cents, round_half_up applied once at the unit level"
    variants:
      - name: retail_basis
        when: "valuation_method == RETAIL_BASIS"
        difference: "fmv equals full unit_retail_cents; partner_declared_unit_cents ignored even if provided"
      - name: partner_declared
        when: "valuation_method == PARTNER_DECLARED"
        difference: "fmv = min(partner_declared_unit_cents, round_half_up(0.8 * unit_retail_cents)); for identical (unit_retail_cents, partner_declared_unit_cents) inputs this is strictly less than retail_basis whenever the declared value or the cap binds below retail"

  - name: plan_cost_totals
    trigger: "PlanLineItem creation/release, plan approval reads the fixed values"
    algorithm: aggregation
    formula: |
      line_fmv_cents(line)   = line.quantity * offer.fmv_unit_cents        # pinned at reservation time; offer.fmv_unit_cents is already rounded to integer cents
      in_kind_value_cents(p) = SUM(line_fmv_cents) over p.lines with status in {RESERVED, COMMITTED, CONSUMED}
      total_cost_cents(p)    = p.cash_cost_cents + in_kind_value_cents(p)
      PINNED EVALUATION ORDER: (1) round the per-unit FMV (donation_fmv_unit), (2) multiply by
      quantity (exact integer), (3) sum across lines, (4) add cash. The alternative order
      "sum raw values then round once" yields different cents and is WRONG.
    input_set: "the plan's own PlanLineItems in {RESERVED, COMMITTED, CONSUMED}; RELEASED excluded"
    constants: {}
    precision: "integer cents; single rounding point at the unit level only"
    variants: []

  - name: chapter_budget_posture
    trigger: "plan approval, plan abort, grant completion (any change to committed_cost_cents)"
    algorithm: aggregation
    formula: |
      committed_cost_cents(ch) = SUM(plan.total_cost_cents) over plans with status == APPROVED
                                 joined via Wish.chapter_id == ch.id
      freeze_threshold = floor(ch.fiscal_year_budget_cents * BUDGET_FREEZE_THRESHOLD_PCT / 100)
      posture = FROZEN if committed_cost_cents >= freeze_threshold else OPEN
      Boundary: equality FROZEN (>= semantics).
    input_set: "FulfillmentPlans status == APPROVED only (CANCELLED, SUPERSEDED, COMPLETED excluded); scope = one chapter"
    constants:
      BUDGET_FREEZE_THRESHOLD_PCT: 95
    precision: "integer cents; floor for the threshold"
    variants: []

  - name: chapter_cost_averages
    trigger: "grant completion (recomputed and stored); read on chapter GET"
    algorithm: aggregation
    formula: |
      granted set G(ch) = wishes with status == GRANTED and granted_at inside the calendar year
                          of the current logical clock date and chapter_id == ch.id
      granted_wish_count       = |G|
      granted_cost_total_cents = SUM(completed plan total_cost_cents) over G
      granted_cash_total_cents = SUM(completed plan cash_cost_cents) over G
      avg_cost_blended_cents   = round_half_up(granted_cost_total_cents / granted_wish_count)  (0 when count == 0)
      avg_cost_cash_cents      = round_half_up(granted_cash_total_cents / granted_wish_count)  (0 when count == 0)
    input_set: "GRANTED wishes of the chapter, granted_at calendar-year filtered by logical clock"
    constants: {}
    precision: "integer cents, round_half_up on the division"
    variants:
      - name: blended
        when: "cost-per-wish accountability reporting and the escalation check"
        difference: "cash + in-kind FMV (plan.total_cost_cents)"
      - name: cash_only
        when: "cash exposure reporting"
        difference: "cash portion only (plan.cash_cost_cents); for identical granted data with any in-kind lines, cash_only < blended"

  - name: cost_per_wish_escalation
    trigger: "POST /wish-grant/fulfillment-plans/{id}/approve, after frozen/budget checks"
    algorithm: threshold
    formula: |
      Let ch = chapter of the wish, read BEFORE this approval mutates anything:
        projected_avg = round_half_up((ch.granted_cost_total_cents + plan.total_cost_cents)
                                       / (ch.granted_wish_count + 1))
      escalation_required = (projected_avg > ch.target_avg_cost_per_wish_cents)
      PINNED EVALUATION ORDER (circular-looking dependency resolved): use the chapter's
      pre-approval aggregates; add the pending plan exactly once to the numerator and
      exactly one to the denominator; divide; round; compare with strict >.
      When escalation_required, role ChapterDirector is rejected (ERR_COST_ESCALATION_REQUIRED);
      NationalDirector may approve.
    input_set: "chapter granted aggregates (current calendar year) + the pending plan"
    constants: {}
    precision: "integer cents, round_half_up; strict greater-than comparison"
    variants: []

  - name: territory_assignment
    trigger: "Child creation inside POST /wish-grant/referrals"
    algorithm: constraint_propagation
    formula: |
      candidates = chapters ch where exists prefix p in ch.territory_zip_prefixes
                   such that child_zip_code starts with p
      ranking: longest matching prefix length DESC
      tie-break: chapter.created_at ASC (never id)
      empty candidate set -> ERR_NO_TERRITORY_CHAPTER (the whole referral creation fails)
    input_set: "all chapters"
    constants: {}
    precision: "string prefix match on zip codes"
    variants: []

  - name: duplicate_referral_detection
    trigger: "POST /wish-grant/referrals, after age checks, before territory assignment"
    algorithm: aggregation
    formula: |
      norm = lowercase(trim(collapse_whitespace(child_full_name)))
      duplicate exists iff there is a referral r whose child's normalized_full_name == norm
        AND r.child.date_of_birth == child_date_of_birth
        AND r.status in {PENDING_CERTIFICATION, CERTIFIED}
      If duplicate -> ERR_DUPLICATE_REFERRAL (409). A prior DENIED/APPROVED referral does NOT
      block a new referral; the existing child record (matched by norm + dob) is reused and
      linked to the new referral.
    input_set: "all referrals of the matched child identity"
    constants: {}
    precision: "exact string/date match after normalization"
    variants: []

  - name: visit_method_eligibility
    trigger: "POST /wish-grant/wish-visits"
    algorithm: threshold
    formula: |
      m = age_months(child.date_of_birth, date(visit.scheduled_start))
      allowed_methods =
        {PLAY_BASED}            if m < 72
        {PLAY_BASED, DRAWING}   if 72 <= m < 156
        {INTERVIEW}             if m >= 156
      visit_method not in allowed_methods -> ERR_AGE_INAPPROPRIATE_METHOD
    input_set: "the child behind the visit's team's wish"
    constants:
      PLAY_ONLY_BELOW_MONTHS: 72
      INTERVIEW_FROM_MONTHS: 156
    precision: "integer months, inclusive lower bounds"
    variants: []

  - name: wish_ready_gate
    trigger: "plan approval; medical clearance decide (CLEARED/CONDITIONAL)"
    algorithm: constraint_propagation
    formula: |
      gate(wish) per wish_type, evaluated when wish.status == PLAN_APPROVED:
        TRAVEL:        exists MedicalClearance of this wish with status in {CLEARED, CONDITIONAL}
        RECEIVE_ITEM:  every PlanLineItem of the APPROVED plan has status == COMMITTED
                       (vacuously true for a cash-only plan) AND plan.status == APPROVED
        MEET_PERSON:   plan.status == APPROVED
        BE_SOMETHING:  plan.status == APPROVED
      gate satisfied -> wish PLAN_APPROVED -> READY_TO_SCHEDULE (same request that satisfied it)
    input_set: "the wish, its APPROVED plan, its clearances"
    constants: {}
    precision: "boolean gate"
    variants: []

  - name: team_visit_overlap
    trigger: "POST /wish-grant/wish-visits"
    algorithm: interval_merge
    formula: |
      Windows are HALF-OPEN [scheduled_start, scheduled_end).
      new visit [s, e) conflicts with an existing SCHEDULED visit [s2, e2) of the SAME team
      iff s < e2 AND s2 < e.
      Adjacency is allowed: s == e2 or e == s2 is NOT a conflict.
    input_set: "WishVisits status == SCHEDULED of the same WishTeam only"
    constants: {}
    precision: "ISO 8601 datetimes, half-open comparison"
    variants: []

  - name: blackout_overlap
    trigger: "POST /wish-grant/wish-events"
    algorithm: interval_merge
    formula: |
      Treatment windows are CLOSED [start_date, end_date] (both ends inclusive);
      event windows are CLOSED [event_start_date, event_end_date].
      conflict iff event_start_date <= w.end_date AND w.start_date <= event_end_date
      An event whose start_date equals a window's end_date CONFLICTS (closed semantics).
    input_set: "child.treatment_windows (every entry blocks; there is no per-window status)"
    constants: {}
    precision: "date granularity, closed-interval comparison"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is allowed for this endpoint per its roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path parameters reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, types correct, enum values in their declared sets, dates parseable, quantity >= 1, event_end_date >= event_start_date, valid_from <= valid_until, scheduled_start < scheduled_end, deny requires denial_reason, CONDITIONAL clearance requires non-empty accommodations, CLEARED/CONDITIONAL requires valid_until"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: state
    check: "entity state-machine preconditions for the requested transition (from-state membership)"
    error_id: ERR_INVALID_VOLUNTEER_STATE
    http_status: 409
    applies_to: "POST /wish-grant/volunteers/{id}/transition"
  - priority: 6
    category: state
    check: "referral in the required from-state for certify/determine"
    error_id: ERR_INVALID_REFERRAL_STATE
    http_status: 409
    applies_to: "POST /wish-grant/referrals/{id}/certify, POST /wish-grant/referrals/{id}/determine"
  - priority: 7
    category: state
    check: "wish in a state that accepts team creation (CREATED or DETERMINATION_PENDING), plan creation (DETERMINED or PLANNING), event creation (READY_TO_SCHEDULE), clearance request (DETERMINED, PLANNING, PLAN_APPROVED, READY_TO_SCHEDULE, SCHEDULED, or MEDICAL_HOLD for TRAVEL wishes)"
    error_id: ERR_INVALID_WISH_STATE
    http_status: 409
    applies_to: "POST /wish-grant/wish-teams, POST /wish-grant/fulfillment-plans, POST /wish-grant/wish-events, POST /wish-grant/medical-clearances"
  - priority: 8
    category: state
    check: "team status == ACTIVE when creating or concluding visits"
    error_id: ERR_INVALID_TEAM_STATE
    http_status: 409
    applies_to: "POST /wish-grant/wish-visits, POST /wish-grant/wish-visits/{id}/conclude"
  - priority: 9
    category: state
    check: "visit status == SCHEDULED when concluding"
    error_id: ERR_INVALID_VISIT_STATE
    http_status: 409
    applies_to: "POST /wish-grant/wish-visits/{id}/conclude"
  - priority: 10
    category: state
    check: "plan in required from-state: DRAFT for line-item add and submit; PENDING_APPROVAL for approve; PENDING_APPROVAL or APPROVED for abort"
    error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/line-items, POST /wish-grant/fulfillment-plans/{id}/submit, POST /wish-grant/fulfillment-plans/{id}/approve, POST /wish-grant/fulfillment-plans/{id}/abort"
  - priority: 11
    category: state
    check: "offer status == AVAILABLE when reserving a line item"
    error_id: ERR_INVALID_OFFER_STATE
    http_status: 409
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/line-items"
  - priority: 12
    category: state
    check: "clearance in required from-state for the requested decision (PENDING for CLEARED/CONDITIONAL/DENIED; CLEARED or CONDITIONAL for REVOKED)"
    error_id: ERR_INVALID_CLEARANCE_STATE
    http_status: 409
    applies_to: "POST /wish-grant/medical-clearances/{id}/decide"
  - priority: 13
    category: state
    check: "event status == SCHEDULED when completing"
    error_id: ERR_INVALID_EVENT_STATE
    http_status: 409
    applies_to: "POST /wish-grant/wish-events/{id}/complete"
  - priority: 14
    category: state
    check: "OCC: expected_wish_version equals the wish's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wish-grant/wish-teams, POST /wish-grant/fulfillment-plans"
  - priority: 15
    category: business_safety
    check: "segregation of duties on approve: plan.created_by_user_id != approver's X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/approve"
  - priority: 16
    category: business_safety
    check: "TRAVEL wish event scheduling requires a clearance in {CLEARED, CONDITIONAL} with valid_until >= event_end_date"
    error_id: ERR_MEDICAL_CLEARANCE_INVALID
    http_status: 422
    applies_to: "POST /wish-grant/wish-events"
  - priority: 17
    category: business_temporal
    check: "team visit half-open overlap: new [start, end) must not overlap another SCHEDULED visit of the same team; adjacency allowed"
    error_id: ERR_TEAM_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /wish-grant/wish-visits"
  - priority: 18
    category: business_temporal
    check: "treatment blackout closed-interval overlap: event window must be disjoint from every child.treatment_windows entry"
    error_id: ERR_TREATMENT_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /wish-grant/wish-events"
  - priority: 19
    category: business_temporal
    check: "RAPID urgency SLA: event_start_date <= date(wish.determined_at) + 14 days (inclusive)"
    error_id: ERR_URGENT_SLA_VIOLATION
    http_status: 422
    applies_to: "POST /wish-grant/wish-events"
  - priority: 20
    category: business_temporal
    check: "offer reservable window: current logical clock date <= offer.valid_until (independent of the EXPIRED sweep)"
    error_id: ERR_DONATION_EXPIRED
    http_status: 409
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/line-items"
  - priority: 21
    category: business_constraint
    check: "child age at intake: 30 <= age_months < 216; re-checked (< 216) on determination APPROVED at the determination date"
    error_id: ERR_CHILD_AGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /wish-grant/referrals, POST /wish-grant/referrals/{id}/determine"
  - priority: 22
    category: business_constraint
    check: "SELF source_type requires age_months >= 156 at intake"
    error_id: ERR_SELF_REFERRAL_TOO_YOUNG
    http_status: 422
    applies_to: "POST /wish-grant/referrals"
  - priority: 23
    category: business_constraint
    check: "duplicate referral detection per calculations.duplicate_referral_detection"
    error_id: ERR_DUPLICATE_REFERRAL
    http_status: 409
    applies_to: "POST /wish-grant/referrals"
  - priority: 24
    category: business_constraint
    check: "territory assignment: exactly one chapter chosen per calculations.territory_assignment; empty candidate set fails"
    error_id: ERR_NO_TERRITORY_CHAPTER
    http_status: 422
    applies_to: "POST /wish-grant/referrals"
  - priority: 25
    category: business_constraint
    check: "team composition: lead_volunteer_id != second_volunteer_id"
    error_id: ERR_TEAM_DUPLICATE_MEMBER
    http_status: 422
    applies_to: "POST /wish-grant/wish-teams"
  - priority: 26
    category: business_constraint
    check: "both team volunteers have status == ACTIVE"
    error_id: ERR_VOLUNTEER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /wish-grant/wish-teams"
  - priority: 27
    category: business_constraint
    check: "both team volunteers' chapter_id == wish.chapter_id"
    error_id: ERR_TEAM_CHAPTER_MISMATCH
    http_status: 422
    applies_to: "POST /wish-grant/wish-teams"
  - priority: 28
    category: business_constraint
    check: "visit create/conclude: acting volunteer's X-User-ID equals the team's lead_volunteer_id or second_volunteer_id"
    error_id: ERR_NOT_TEAM_MEMBER
    http_status: 403
    applies_to: "POST /wish-grant/wish-visits, POST /wish-grant/wish-visits/{id}/conclude"
  - priority: 29
    category: business_constraint
    check: "visit_method allowed for the child's age at scheduled_start per calculations.visit_method_eligibility"
    error_id: ERR_AGE_INAPPROPRIATE_METHOD
    http_status: 422
    applies_to: "POST /wish-grant/wish-visits"
  - priority: 30
    category: business_constraint
    check: "donation category vs wish type: TRAVEL -> {AIRLINE, RESORT}; RECEIVE_ITEM -> {RETAILER}; MEET_PERSON -> {SPONSOR}; BE_SOMETHING -> {SPONSOR, RETAILER}"
    error_id: ERR_CATEGORY_WISH_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/line-items"
  - priority: 31
    category: business_constraint
    check: "medical clearance may only be requested for wishes with wish_type == TRAVEL"
    error_id: ERR_WISH_TYPE_NO_CLEARANCE
    http_status: 422
    applies_to: "POST /wish-grant/medical-clearances"
  - priority: 32
    category: business_constraint
    check: "at most one clearance per wish in status {PENDING, CLEARED, CONDITIONAL}"
    error_id: ERR_CLEARANCE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /wish-grant/medical-clearances"
  - priority: 33
    category: business_constraint
    check: "plan submit requires >= 1 RESERVED line item OR cash_cost_cents > 0"
    error_id: ERR_EMPTY_PLAN
    http_status: 422
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/submit"
  - priority: 34
    category: business_constraint
    check: "plan creation rejected while the wish already has a plan with status == APPROVED"
    error_id: ERR_PLAN_ALREADY_APPROVED
    http_status: 409
    applies_to: "POST /wish-grant/fulfillment-plans"
  - priority: 35
    category: business_constraint
    check: "every treatment_windows entry has start_date <= end_date and valid dates"
    error_id: ERR_TREATMENT_WINDOW_INVALID
    http_status: 422
    applies_to: "PATCH /wish-grant/children/{id}"
  - priority: 36
    category: business_fiscal
    check: "reserve quantity <= offer.quantity_available (boundary: exactly the remaining quantity succeeds)"
    error_id: ERR_INSUFFICIENT_DONATION_QTY
    http_status: 409
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/line-items"
  - priority: 37
    category: business_fiscal
    check: "chapter.posture == OPEN at approval time (current committed below the 95% freeze threshold)"
    error_id: ERR_CHAPTER_BUDGET_FROZEN
    http_status: 409
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/approve"
  - priority: 38
    category: business_fiscal
    check: "chapter.committed_cost_cents + plan.total_cost_cents <= chapter.fiscal_year_budget_cents"
    error_id: ERR_CHAPTER_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/approve"
  - priority: 39
    category: business_fiscal
    check: "escalation: projected average cost per wish (including this plan) strictly above target requires NationalDirector"
    error_id: ERR_COST_ESCALATION_REQUIRED
    http_status: 422
    applies_to: "POST /wish-grant/fulfillment-plans/{id}/approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/wish-grant/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock to the given ISO 8601 UTC instant. STARTUP DEFAULT: before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Side effect: sweeps DonationOffers (status == AVAILABLE and quantity_reserved == 0 and valid_until before the new date) to EXPIRED."
    roles: [NationalAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["offer expiry sweep (AVAILABLE, unreserved, past valid_until -> EXPIRED)"]

  - method: POST
    path: "/wish-grant/chapters"
    description: "Create a chapter with territory prefixes, budget, and cost-per-wish target."
    roles: [NationalAdmin]
    code: 201
    input: [name, territory_zip_prefixes, fiscal_year_budget_cents, target_avg_cost_per_wish_cents]
    output: Chapter
    side_effects: []

  - method: GET
    path: "/wish-grant/chapters/{id}"
    description: "Read a chapter including computed aggregates (committed_cost_cents, granted counts/totals, both cost averages, posture)."
    roles: [NationalAdmin, WishCoordinator, ChapterDirector, NationalDirector, InKindOfficer, EligibilityReviewer]
    code: 200
    input: []
    output: Chapter
    side_effects: []

  - method: POST
    path: "/wish-grant/volunteers"
    description: "Create a volunteer in APPLIED status for a chapter."
    roles: [WishCoordinator]
    code: 201
    input: [chapter_id, full_name, email]
    output: Volunteer
    side_effects: []

  - method: GET
    path: "/wish-grant/volunteers"
    description: "List volunteers with optional filters."
    roles: [WishCoordinator, ChapterDirector, NationalDirector]
    code: 200
    input: ["chapter_id?", "status?", "limit?", "offset?"]
    output: Volunteer[]
    side_effects: []

  - method: GET
    path: "/wish-grant/volunteers/{id}"
    description: "Read one volunteer."
    roles: [WishCoordinator, ChapterDirector, NationalDirector, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: POST
    path: "/wish-grant/volunteers/{id}/transition"
    description: "Advance a volunteer exactly one step: APPLIED -> TRAINED -> ACTIVE -> INACTIVE via target_state. Skipping a step or targeting a non-next state fails with ERR_INVALID_VOLUNTEER_STATE."
    roles: [WishCoordinator]
    code: 200
    input: [target_state]
    output: Volunteer
    side_effects: ["volunteer.version += 1"]

  - method: POST
    path: "/wish-grant/referrals"
    description: "Intake a referral; atomically creates (or, on re-referral after a terminal referral, reuses) the Child with territory-based chapter assignment. Runs age bounds, SELF minimum age, duplicate detection, and territory selection in validation-priority order."
    roles: [ReferralSource]
    code: 201
    input: [child_full_name, child_date_of_birth, child_zip_code, parent_email, diagnosis_summary, source_type, "prognosis_months?"]
    output: Referral
    side_effects: ["create or reuse Child (chapter_id via calculations.territory_assignment)", "referral.age_months_at_intake computed from the logical clock"]

  - method: GET
    path: "/wish-grant/referrals"
    description: "List referrals with optional filters."
    roles: [ReferralSource, EligibilityReviewer, MedicalProvider, WishCoordinator]
    code: 200
    input: ["child_id?", "wish_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/wish-grant/referrals/{id}"
    description: "Read one referral."
    roles: [ReferralSource, EligibilityReviewer, MedicalProvider, WishCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/wish-grant/referrals/{id}/certify"
    description: "Medical provider certifies a qualifying condition. NON_QUALIFYING auto-denies the referral (denial_reason CONDITION_NOT_QUALIFYING)."
    roles: [MedicalProvider]
    code: 200
    input: [qualifying_condition, "certification_note?"]
    output: Referral
    side_effects: ["referral -> CERTIFIED or auto-DENIED", "certified_at set"]

  - method: POST
    path: "/wish-grant/referrals/{id}/determine"
    description: "Eligibility determination. APPROVED re-checks the under-18 age bound at the current logical date, then creates the Wish (status CREATED, urgency from prognosis). DENIED requires denial_reason; denial is never age-blocked."
    roles: [EligibilityReviewer]
    code: 200
    input: [decision, "denial_reason?"]
    output: Referral
    side_effects: ["APPROVED: create Wish, set referral.wish_id, determined_at", "DENIED: determined_at set"]

  - method: GET
    path: "/wish-grant/children"
    description: "List children with optional chapter filter."
    roles: [WishCoordinator, EligibilityReviewer, MedicalProvider, ChapterDirector]
    code: 200
    input: ["chapter_id?", "limit?", "offset?"]
    output: Child[]
    side_effects: []

  - method: GET
    path: "/wish-grant/children/{id}"
    description: "Read one child including treatment_windows."
    roles: [WishCoordinator, EligibilityReviewer, MedicalProvider, ChapterDirector, Volunteer]
    code: 200
    input: []
    output: Child
    side_effects: []

  - method: PATCH
    path: "/wish-grant/children/{id}"
    description: "Replace the child's treatment_windows array wholesale (treatment-cycle blackout windows, closed intervals)."
    roles: [MedicalProvider]
    code: 200
    input: [treatment_windows]
    output: Child
    side_effects: ["child.updated_at refreshed"]

  - method: POST
    path: "/wish-grant/wish-teams"
    description: "Create (or, from DETERMINATION_PENDING, replace) the two-volunteer determination team for a wish. OCC-guarded on the wish version; replacement disbands the ACTIVE team and cancels its SCHEDULED visits."
    roles: [WishCoordinator]
    code: 201
    input: [wish_id, lead_volunteer_id, second_volunteer_id, expected_wish_version]
    output: WishTeam
    side_effects: ["wish CREATED -> DETERMINATION_PENDING (or self-loop on replace)", "superseded team -> DISBANDED, its SCHEDULED visits -> CANCELLED", "increments Wish.version by 1"]

  - method: GET
    path: "/wish-grant/wish-teams"
    description: "List wish teams with optional filters."
    roles: [WishCoordinator, ChapterDirector, Volunteer]
    code: 200
    input: ["wish_id?", "lead_volunteer_id?", "second_volunteer_id?", "status?", "limit?", "offset?"]
    output: WishTeam[]
    side_effects: []

  - method: GET
    path: "/wish-grant/wish-teams/{id}"
    description: "Read one wish team."
    roles: [WishCoordinator, ChapterDirector, Volunteer]
    code: 200
    input: []
    output: WishTeam
    side_effects: []

  - method: POST
    path: "/wish-grant/wish-visits"
    description: "Schedule a determination visit for a team. Acting volunteer must be a team member; half-open overlap rules apply per team; visit_method must be age-appropriate at scheduled_start."
    roles: [Volunteer]
    code: 201
    input: [wish_team_id, scheduled_start, scheduled_end, visit_method]
    output: WishVisit
    side_effects: []

  - method: GET
    path: "/wish-grant/wish-teams/{id}/visits"
    description: "List visits of a team."
    roles: [WishCoordinator, Volunteer, ChapterDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WishVisit[]
    side_effects: []

  - method: POST
    path: "/wish-grant/wish-visits/{id}/conclude"
    description: "Conclude a visit. outcome COMPLETED requires captured_true_wish + captured_wish_type and drives the wish to DETERMINED (team COMPLETED, sibling SCHEDULED visits CANCELLED). outcome NO_SHOW leaves wish and team unchanged."
    roles: [Volunteer]
    code: 200
    input: [outcome, "captured_true_wish?", "captured_wish_type?"]
    output: WishVisit
    side_effects: ["COMPLETED: visit -> COMPLETED; wish -> DETERMINED (wish_type, true_wish_description, determined_at set); team -> COMPLETED; other SCHEDULED visits of the team -> CANCELLED", "NO_SHOW: visit -> NO_SHOW only"]

  - method: GET
    path: "/wish-grant/wishes"
    description: "List wishes with optional filters."
    roles: [WishCoordinator, ChapterDirector, NationalDirector, EligibilityReviewer, Volunteer]
    code: 200
    input: ["child_id?", "chapter_id?", "referral_id?", "status?", "wish_type?", "urgency?", "limit?", "offset?"]
    output: Wish[]
    side_effects: []

  - method: GET
    path: "/wish-grant/wishes/{id}"
    description: "Read one wish."
    roles: [WishCoordinator, ChapterDirector, NationalDirector, EligibilityReviewer, Volunteer]
    code: 200
    input: []
    output: Wish
    side_effects: []

  - method: POST
    path: "/wish-grant/donation-offers"
    description: "Create an in-kind donation offer; computes fmv_unit_cents per the partner's valuation method."
    roles: [InKindOfficer]
    code: 201
    input: [partner_name, category, valuation_method, description, quantity_total, unit_retail_cents, "partner_declared_unit_cents?", valid_from, valid_until]
    output: DonationOffer
    side_effects: ["fmv_unit_cents computed per calculations.donation_fmv_unit"]

  - method: GET
    path: "/wish-grant/donation-offers/{id}"
    description: "Read one donation offer including computed quantities and fmv."
    roles: [InKindOfficer, WishCoordinator, ChapterDirector]
    code: 200
    input: []
    output: DonationOffer
    side_effects: []

  - method: POST
    path: "/wish-grant/fulfillment-plans"
    description: "Create a fulfillment plan for a wish (DRAFT). OCC-guarded on the wish version. Supersedes an existing DRAFT or PENDING_APPROVAL plan (releasing its reservations); rejected when an APPROVED plan exists."
    roles: [WishCoordinator, ChapterDirector]
    code: 201
    input: [wish_id, cash_cost_cents, expected_wish_version, "notes?"]
    output: FulfillmentPlan
    side_effects: ["wish DETERMINED|PLANNING -> PLANNING", "prior plan supersede cascade (plan -> SUPERSEDED, lines -> RELEASED, offers released)", "increments Wish.version by 1", "created_by_user_id = X-User-ID"]

  - method: GET
    path: "/wish-grant/wishes/{id}/fulfillment-plans"
    description: "List fulfillment plans of a wish."
    roles: [WishCoordinator, ChapterDirector, NationalDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FulfillmentPlan[]
    side_effects: []

  - method: GET
    path: "/wish-grant/fulfillment-plans/{id}"
    description: "Read one fulfillment plan including computed totals."
    roles: [WishCoordinator, ChapterDirector, NationalDirector]
    code: 200
    input: []
    output: FulfillmentPlan
    side_effects: []

  - method: POST
    path: "/wish-grant/fulfillment-plans/{id}/line-items"
    description: "Reserve units of a donation offer into a DRAFT plan. Pins line_fmv_cents at reservation; enforces offer state, availability window, quantity, and category-vs-wish-type mapping."
    roles: [WishCoordinator, ChapterDirector]
    code: 201
    input: [donation_offer_id, quantity]
    output: PlanLineItem
    side_effects: ["offer.quantity_reserved += quantity", "offer AVAILABLE -> FULLY_RESERVED when quantity_available reaches 0", "plan.in_kind_value_cents and plan.total_cost_cents recomputed", "offer.version += 1", "plan.version += 1"]

  - method: GET
    path: "/wish-grant/fulfillment-plans/{id}/line-items"
    description: "List line items of a plan."
    roles: [WishCoordinator, ChapterDirector, NationalDirector, InKindOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanLineItem[]
    side_effects: []

  - method: POST
    path: "/wish-grant/fulfillment-plans/{id}/submit"
    description: "Submit a DRAFT plan for approval (requires >= 1 RESERVED line or cash_cost_cents > 0)."
    roles: [WishCoordinator, ChapterDirector]
    code: 200
    input: []
    output: FulfillmentPlan
    side_effects: ["plan DRAFT -> PENDING_APPROVAL"]

  - method: POST
    path: "/wish-grant/fulfillment-plans/{id}/approve"
    description: "Approve a PENDING_APPROVAL plan. Enforces segregation of duties, chapter posture freeze, hard budget cap, and cost-per-wish escalation (NationalDirector) in validation-priority order. Commits lines, debits the chapter commitment, advances the wish and evaluates the ready gate."
    roles: [ChapterDirector, NationalDirector]
    code: 200
    input: []
    output: FulfillmentPlan
    side_effects: ["plan -> APPROVED, approved_by_user_id and escalation_required recorded", "lines RESERVED -> COMMITTED", "chapter.committed_cost_cents += plan.total_cost_cents; posture recomputed; chapter.version += 1", "wish -> PLAN_APPROVED (+ auto READY_TO_SCHEDULE when the type gate is satisfied); wish.version += 1"]

  - method: POST
    path: "/wish-grant/fulfillment-plans/{id}/abort"
    description: "Cancel a PENDING_APPROVAL or APPROVED plan. From APPROVED additionally releases the chapter commitment and reverts the wish to PLANNING. Never allowed while the wish is SCHEDULED."
    roles: [ChapterDirector]
    code: 200
    input: ["reason?"]
    output: FulfillmentPlan
    side_effects: ["plan -> CANCELLED", "lines RESERVED|COMMITTED -> RELEASED; offers released (FULLY_RESERVED -> AVAILABLE when reopened)", "from APPROVED: chapter.committed_cost_cents -= plan.total_cost_cents; posture recomputed; chapter.version += 1; wish PLAN_APPROVED|READY_TO_SCHEDULE -> PLANNING (wish.version += 1)"]

  - method: GET
    path: "/wish-grant/donation-offers/{id}/line-items"
    description: "List line items reserving a given donation offer."
    roles: [InKindOfficer, WishCoordinator, ChapterDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanLineItem[]
    side_effects: []

  - method: POST
    path: "/wish-grant/medical-clearances"
    description: "Request a medical clearance for a TRAVEL wish. At most one clearance per wish may be active (PENDING, CLEARED, or CONDITIONAL)."
    roles: [WishCoordinator]
    code: 201
    input: [wish_id]
    output: MedicalClearance
    side_effects: []

  - method: GET
    path: "/wish-grant/wishes/{id}/medical-clearances"
    description: "List medical clearances of a wish."
    roles: [WishCoordinator, MedicalProvider, ChapterDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MedicalClearance[]
    side_effects: []

  - method: POST
    path: "/wish-grant/medical-clearances/{id}/decide"
    description: "Medical provider decision. CLEARED/CONDITIONAL require valid_until; CONDITIONAL additionally requires non-empty accommodations; REVOKED only from CLEARED/CONDITIONAL and triggers the TRAVEL wish hold cascade; a new CLEARED/CONDITIONAL lifts a MEDICAL_HOLD back to its hold_return_state."
    roles: [MedicalProvider]
    code: 200
    input: [decision, "accommodations?", "valid_until?", "decision_note?"]
    output: MedicalClearance
    side_effects: ["CLEARED/CONDITIONAL: wish gate re-evaluation (PLAN_APPROVED -> READY_TO_SCHEDULE; MEDICAL_HOLD -> hold_return_state)", "REVOKED: TRAVEL wish -> MEDICAL_HOLD; its SCHEDULED events -> CANCELLED"]

  - method: POST
    path: "/wish-grant/wish-events"
    description: "Schedule the wish event. Requires READY_TO_SCHEDULE; enforces (in priority order) clearance validity for TRAVEL, treatment-blackout closed-interval overlap, and the RAPID 14-day SLA."
    roles: [WishCoordinator]
    code: 201
    input: [wish_id, event_start_date, event_end_date]
    output: WishEvent
    side_effects: ["wish READY_TO_SCHEDULE -> SCHEDULED; wish.version += 1"]

  - method: GET
    path: "/wish-grant/wishes/{id}/wish-events"
    description: "List events of a wish."
    roles: [WishCoordinator, ChapterDirector, MedicalProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WishEvent[]
    side_effects: []

  - method: POST
    path: "/wish-grant/wish-events/{id}/complete"
    description: "Complete a SCHEDULED event; grants the wish and runs the full grant cascade (plan COMPLETED, lines CONSUMED, offer quantities consumed, chapter aggregates and posture recomputed)."
    roles: [WishCoordinator]
    code: 200
    input: []
    output: WishEvent
    side_effects: ["grant cascade E1-E6: event -> COMPLETED; wish -> GRANTED (granted_at set); plan APPROVED -> COMPLETED; lines COMMITTED -> CONSUMED; per line offer.quantity_reserved -= qty AND offer.quantity_total -= qty (offer -> DEPLETED at 0); chapter.committed_cost_cents -= plan.total, granted_wish_count += 1, granted_cost_total_cents += plan.total, granted_cash_total_cents += plan.cash, both averages recomputed, posture recomputed; chapter.version += 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role is not in the endpoint's roles list."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path parameter references a non-existent resource (checked left-to-right)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad type, unknown enum value, bad date, quantity < 1, end before start, missing conditional fields (denial_reason, valid_until, accommodations)."
  - id: ERR_INVALID_VOLUNTEER_STATE
    http: 409
    condition: "Volunteer transition target is not the exact next state."
  - id: ERR_INVALID_REFERRAL_STATE
    http: 409
    condition: "certify requires PENDING_CERTIFICATION; determine requires CERTIFIED."
  - id: ERR_INVALID_WISH_STATE
    http: 409
    condition: "Wish not in a state that accepts the requested team/plan/event/clearance operation."
  - id: ERR_INVALID_TEAM_STATE
    http: 409
    condition: "Team is not ACTIVE for visit creation or conclusion."
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "Visit is not SCHEDULED when concluding."
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "Plan not in the from-state required by line-items/submit/approve/abort."
  - id: ERR_INVALID_OFFER_STATE
    http: 409
    condition: "Donation offer is not AVAILABLE (FULLY_RESERVED, EXPIRED, or DEPLETED) when reserving."
  - id: ERR_INVALID_CLEARANCE_STATE
    http: 409
    condition: "Clearance not in the from-state required by the requested decision."
  - id: ERR_INVALID_EVENT_STATE
    http: 409
    condition: "Event is not SCHEDULED when completing."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_wish_version does not match the wish's current version (OCC on team/plan creation)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Plan creator attempted to approve their own plan."
  - id: ERR_MEDICAL_CLEARANCE_INVALID
    http: 422
    condition: "TRAVEL wish event lacks a CLEARED/CONDITIONAL clearance covering event_end_date."
  - id: ERR_TEAM_SCHEDULE_OVERLAP
    http: 409
    condition: "New visit window overlaps (half-open) another SCHEDULED visit of the same team."
  - id: ERR_TREATMENT_BLACKOUT_CONFLICT
    http: 409
    condition: "Event window intersects (closed intervals) a child treatment window."
  - id: ERR_URGENT_SLA_VIOLATION
    http: 422
    condition: "RAPID wish event_start_date is after determined_at + 14 days."
  - id: ERR_DONATION_EXPIRED
    http: 409
    condition: "Offer's valid_until is before the current logical date at reservation time."
  - id: ERR_CHILD_AGE_OUT_OF_RANGE
    http: 422
    condition: "Age outside [30, 216) months at intake, or >= 216 months at determination approval."
  - id: ERR_SELF_REFERRAL_TOO_YOUNG
    http: 422
    condition: "SELF referral with age < 156 months at intake."
  - id: ERR_DUPLICATE_REFERRAL
    http: 409
    condition: "Same normalized child name + date of birth already has a PENDING_CERTIFICATION or CERTIFIED referral."
  - id: ERR_NO_TERRITORY_CHAPTER
    http: 422
    condition: "No chapter's territory_zip_prefixes match the child's zip code."
  - id: ERR_TEAM_DUPLICATE_MEMBER
    http: 422
    condition: "lead_volunteer_id == second_volunteer_id."
  - id: ERR_VOLUNTEER_NOT_ACTIVE
    http: 409
    condition: "A team member volunteer is not ACTIVE."
  - id: ERR_TEAM_CHAPTER_MISMATCH
    http: 422
    condition: "A team member's chapter differs from the wish's chapter."
  - id: ERR_NOT_TEAM_MEMBER
    http: 403
    condition: "Acting volunteer is not the lead or second on the visit's team."
  - id: ERR_AGE_INAPPROPRIATE_METHOD
    http: 422
    condition: "visit_method not in the allowed set for the child's age at scheduled_start."
  - id: ERR_CATEGORY_WISH_TYPE_MISMATCH
    http: 422
    condition: "Donation category not allowed for the wish type's fulfillment path."
  - id: ERR_WISH_TYPE_NO_CLEARANCE
    http: 422
    condition: "Clearance requested for a non-TRAVEL wish."
  - id: ERR_CLEARANCE_ALREADY_ACTIVE
    http: 409
    condition: "Wish already has a clearance in PENDING, CLEARED, or CONDITIONAL."
  - id: ERR_EMPTY_PLAN
    http: 422
    condition: "Submit with no RESERVED line items and cash_cost_cents == 0."
  - id: ERR_PLAN_ALREADY_APPROVED
    http: 409
    condition: "Plan creation while the wish has an APPROVED plan."
  - id: ERR_TREATMENT_WINDOW_INVALID
    http: 422
    condition: "A treatment_windows entry has start_date > end_date or an invalid date."
  - id: ERR_INSUFFICIENT_DONATION_QTY
    http: 409
    condition: "Requested quantity exceeds offer.quantity_available."
  - id: ERR_CHAPTER_BUDGET_FROZEN
    http: 409
    condition: "Chapter posture is FROZEN (committed >= 95% of budget) at approval time."
  - id: ERR_CHAPTER_BUDGET_EXCEEDED
    http: 422
    condition: "committed_cost_cents + plan.total_cost_cents would exceed fiscal_year_budget_cents."
  - id: ERR_COST_ESCALATION_REQUIRED
    http: 422
    condition: "Projected average cost per wish including this plan exceeds the chapter target; NationalDirector required."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NationalAdmin
    description: "National office platform operator; provisions chapters and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /wish-grant/chapters"
      - "POST /wish-grant/_clock/set_current_utc"
    shared_operations:
      - "GET /wish-grant/chapters/{id}"
  - name: ReferralSource
    description: "Intake channel actor for family, medical-professional, and self referrals (the channel is recorded on source_type)."
    identity: opaque
    exclusive_operations:
      - "POST /wish-grant/referrals"
    shared_operations:
      - "GET /wish-grant/referrals"
      - "GET /wish-grant/referrals/{id}"
  - name: MedicalProvider
    description: "External certifying medical professional; certifies conditions, records treatment windows, decides medical clearances. An opaque id because providers are not persisted entities."
    identity: opaque
    exclusive_operations:
      - "POST /wish-grant/referrals/{id}/certify"
      - "PATCH /wish-grant/children/{id}"
      - "POST /wish-grant/medical-clearances/{id}/decide"
    shared_operations:
      - "GET /wish-grant/referrals"
      - "GET /wish-grant/referrals/{id}"
      - "GET /wish-grant/children"
      - "GET /wish-grant/children/{id}"
      - "GET /wish-grant/wishes/{id}/medical-clearances"
      - "GET /wish-grant/wishes/{id}/wish-events"
  - name: EligibilityReviewer
    description: "Chapter eligibility staff who render the determination after certification. Segregated from certification: the provider certifies, the reviewer determines."
    identity: opaque
    exclusive_operations:
      - "POST /wish-grant/referrals/{id}/determine"
    shared_operations:
      - "GET /wish-grant/referrals"
      - "GET /wish-grant/referrals/{id}"
      - "GET /wish-grant/children"
      - "GET /wish-grant/children/{id}"
      - "GET /wish-grant/wishes"
      - "GET /wish-grant/wishes/{id}"
      - "GET /wish-grant/chapters/{id}"
  - name: Volunteer
    description: "Trained wish-team volunteer; X-User-ID equals the Volunteer entity id. Acts only on visits of teams they belong to."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /wish-grant/wish-visits"
      - "POST /wish-grant/wish-visits/{id}/conclude"
    shared_operations:
      - "GET /wish-grant/volunteers/{id}"
      - "GET /wish-grant/wish-teams"
      - "GET /wish-grant/wish-teams/{id}"
      - "GET /wish-grant/wish-teams/{id}/visits"
      - "GET /wish-grant/wishes"
      - "GET /wish-grant/wishes/{id}"
      - "GET /wish-grant/children/{id}"
  - name: WishCoordinator
    description: "Chapter wish-granting staff; manages volunteers, teams, plans, clearances, and scheduling."
    identity: opaque
    exclusive_operations:
      - "POST /wish-grant/volunteers"
      - "POST /wish-grant/volunteers/{id}/transition"
      - "POST /wish-grant/wish-teams"
      - "POST /wish-grant/fulfillment-plans/{id}/submit"
      - "POST /wish-grant/medical-clearances"
      - "POST /wish-grant/wish-events"
      - "POST /wish-grant/wish-events/{id}/complete"
    shared_operations:
      - "POST /wish-grant/fulfillment-plans (shared with ChapterDirector)"
      - "POST /wish-grant/fulfillment-plans/{id}/line-items (shared with ChapterDirector)"
      - "GET /wish-grant/chapters/{id}"
      - "GET /wish-grant/volunteers"
      - "GET /wish-grant/volunteers/{id}"
      - "GET /wish-grant/children"
      - "GET /wish-grant/children/{id}"
      - "GET /wish-grant/referrals"
      - "GET /wish-grant/referrals/{id}"
      - "GET /wish-grant/wish-teams"
      - "GET /wish-grant/wish-teams/{id}"
      - "GET /wish-grant/wish-teams/{id}/visits"
      - "GET /wish-grant/wishes"
      - "GET /wish-grant/wishes/{id}"
      - "GET /wish-grant/donation-offers/{id}"
      - "GET /wish-grant/donation-offers/{id}/line-items"
      - "GET /wish-grant/wishes/{id}/fulfillment-plans"
      - "GET /wish-grant/fulfillment-plans/{id}"
      - "GET /wish-grant/fulfillment-plans/{id}/line-items"
      - "GET /wish-grant/wishes/{id}/medical-clearances"
      - "GET /wish-grant/wishes/{id}/wish-events"
  - name: InKindOfficer
    description: "In-kind sourcing officer; manages donation offers from airlines, resorts, retailers, and sponsors."
    identity: opaque
    exclusive_operations:
      - "POST /wish-grant/donation-offers"
    shared_operations:
      - "GET /wish-grant/donation-offers/{id}"
      - "GET /wish-grant/donation-offers/{id}/line-items"
      - "GET /wish-grant/fulfillment-plans/{id}/line-items"
      - "GET /wish-grant/chapters/{id}"
  - name: ChapterDirector
    description: "Chapter director; approves and aborts plans. May also create plans, but segregation of duties forbids approving a plan they created."
    identity: opaque
    exclusive_operations:
      - "POST /wish-grant/fulfillment-plans/{id}/abort"
    shared_operations:
      - "POST /wish-grant/fulfillment-plans/{id}/approve (shared with NationalDirector)"
      - "POST /wish-grant/fulfillment-plans (shared with WishCoordinator)"
      - "POST /wish-grant/fulfillment-plans/{id}/line-items (shared with WishCoordinator)"
      - "GET /wish-grant/chapters/{id}"
      - "GET /wish-grant/volunteers"
      - "GET /wish-grant/volunteers/{id}"
      - "GET /wish-grant/children"
      - "GET /wish-grant/children/{id}"
      - "GET /wish-grant/wish-teams"
      - "GET /wish-grant/wish-teams/{id}"
      - "GET /wish-grant/wish-teams/{id}/visits"
      - "GET /wish-grant/wishes"
      - "GET /wish-grant/wishes/{id}"
      - "GET /wish-grant/donation-offers/{id}"
      - "GET /wish-grant/donation-offers/{id}/line-items"
      - "GET /wish-grant/wishes/{id}/fulfillment-plans"
      - "GET /wish-grant/fulfillment-plans/{id}"
      - "GET /wish-grant/fulfillment-plans/{id}/line-items"
      - "GET /wish-grant/wishes/{id}/medical-clearances"
      - "GET /wish-grant/wishes/{id}/wish-events"
  - name: NationalDirector
    description: "National office director; the only role that may approve a plan whose projected cost per wish exceeds the chapter target."
    identity: opaque
    exclusive_operations:
      - "approve when escalation_required (cost-per-wish escalation override)"
    shared_operations:
      - "POST /wish-grant/fulfillment-plans/{id}/approve (shared with ChapterDirector)"
      - "GET /wish-grant/chapters/{id}"
      - "GET /wish-grant/volunteers"
      - "GET /wish-grant/volunteers/{id}"
      - "GET /wish-grant/wishes"
      - "GET /wish-grant/wishes/{id}"
      - "GET /wish-grant/wishes/{id}/fulfillment-plans"
      - "GET /wish-grant/fulfillment-plans/{id}"
      - "GET /wish-grant/fulfillment-plans/{id}/line-items"
