        excluded_because:
          difficulty_instance: cross_entity_state_dependency / refurb_scheduling_blocked_by_out_of_service_bay_state
          rationale: "Asserted as the failure path of the named §1.8 instance, which schedules into an OUT_OF_SERVICE bay and then succeeds after the bay is returned to service."

