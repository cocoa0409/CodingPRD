# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1818: Investment Policy Statement & Portfolio Rebalancing
# 24 instances across the nine §0.5 Difficulty Rules.
# All numeric literals in assert: blocks were computed by executing the
# §1.3 formulas against the pinned setup inputs (see formulas/constants).
# Logical clock default 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: withdrawal_pro_rata_vs_tax_aware_divergence
        grounds:
          - calculations.withdrawal_impact_model
          - entities.WithdrawalRequest.fields.modeled_proceeds_cents
          - entities.WithdrawalRequest.fields.modeled_tax_cost_cents
        distinguishing_aspect: |
          WithdrawalRequest domain: identical portfolio, identical amount_cents, two funding_mode
          variants (PRO_RATA vs TAX_AWARE) produce different modeled plans, different proceeds
          (51000 vs 50000) and different estimated tax (2380 vs 0).
        test_recipe:
          setup:
            - "ACTIVE client C (risk 50) with ACTIVE IPS I (targets US_EQUITY 60.00/5.00, INTL_EQUITY 20.00/5.00, CASH_EQUIVALENT 20.00/5.00)"
            - "TAXABLE portfolio P ACTIVE; cash 100000; positions in creation order: LOT1 EQA 100 @ 1000 basis 90000; LOT2 EQB 100 @ 1000 basis 40000; LOT3 EIB 200 @ 500 basis 110000; total_value 400000"
            - "two WithdrawalRequests on P, both amount_cents 150000: W_pr funding_mode PRO_RATA, W_ta funding_mode TAX_AWARE; both MODELED"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Variant Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Balanced 60/40", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 20.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 20.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqa: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQB", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqb: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqa}", quantity: 100, opening_cost_basis_cents: 90000 }, as: Advisor, captures: { lot1: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqb}", quantity: 100, opening_cost_basis_cents: 40000 }, as: Advisor, captures: { lot2: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eib}", quantity: 200, opening_cost_basis_cents: 110000 }, as: Advisor, captures: { lot3: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 150000, funding_mode: PRO_RATA }, as: Advisor, captures: { w_pr: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests/${w_pr}/model-impact", as: Advisor }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 150000, funding_mode: TAX_AWARE }, as: Advisor, captures: { w_ta: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests/${w_ta}/model-impact", as: Advisor }
          trigger:
            - { call: "GET /advisory/withdrawal-requests/${w_pr}", as: Advisor }
            - { call: "GET /advisory/withdrawal-requests/${w_ta}", as: Advisor }
          assert:
            - "WithdrawalRequest.${w_pr}.status == MODELED and WithdrawalRequest.${w_ta}.status == MODELED"
            - "WithdrawalRequest.${w_pr}.modeled_proceeds_cents == 51000 (PRO_RATA: 17000 + 17000 + 17000)"
            - "WithdrawalRequest.${w_pr}.modeled_tax_cost_cents == 2380 (per-lot tax 340 + 2040 + 0)"
            - "WithdrawalRequest.${w_pr}.modeled_cash_used_cents == 100000"
            - "WithdrawalRequest.${w_pr}.modeled_plan has 3 lots in order [LOT1 qty 17, LOT2 qty 17, LOT3 qty 34]"
            - "WithdrawalRequest.${w_ta}.modeled_proceeds_cents == 50000 (single loss lot LOT3 qty 100)"
            - "WithdrawalRequest.${w_ta}.modeled_tax_cost_cents == 0 (realized gain -5000 is not taxed)"
            - "WithdrawalRequest.${w_ta}.modeled_plan has exactly 1 lot: position ${lot3} quantity 100 est_proceeds_cents 50000 est_gain_cents -5000"
            - "modeled_proceeds_cents and modeled_tax_cost_cents differ between the two variants on identical inputs (51000 != 50000, 2380 != 0)"

      - name: performance_twr_vs_dietz_divergence
        grounds:
          - calculations.performance_return
          - entities.PerformanceReport.fields.portfolio_return_bps
          - entities.CashFlowEvent.fields.valuation_before_cents
        distinguishing_aspect: |
          PerformanceReport domain: identical flows and boundary valuations, TIME_WEIGHTED
          (geometric chaining over valuation_before snapshots) yields 413 bps while
          MONEY_WEIGHTED (Modified Dietz day-weights) yields 417 bps — a different entity
          domain than withdrawal_pro_rata_vs_tax_aware_divergence.
        test_recipe:
          setup:
            - "ACTIVE client C4 with ACTIVE IPS (single target US_EQUITY 100.00/50.00)"
            - "TAX_EXEMPT portfolio P4 with: E1 DEPOSIT 1000000 @2026-08-01; transfer-in 100 EQX @1000 basis 100000; reprice EQX 1200; E2 DEPOSIT 200000 @2026-08-11 (valuation_before 1120000); reprice EQX 1500; E3 WITHDRAWAL 100000 @2026-08-21 (valuation_before 1350000); cash 1100000; total 1250000"
            - "TAX_EXEMPT portfolio P4b (same client) cash-only with flows +1000000 @2026-08-01, +200000 @2026-08-11, -100000 @2026-08-21"
            - "R_tw on P4: period 2026-08-01..2026-08-31, TIME_WEIGHTED, beginning 1100000, ending 1250000, benchmark_return_bps 300, FINALIZED"
            - "R_mw on P4b: same period/values/method MONEY_WEIGHTED, FINALIZED"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Perf Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Perf Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/securities", payload: { ticker: "EQX", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqx: $.data.id } }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P4", tax_status: TAX_EXEMPT }, as: Advisor, captures: { p4: $.data.id } }
            - { call: "POST /advisory/portfolios/${p4}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p4}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 1000000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor, captures: { e1: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p4}", security_id: "${s_eqx}", quantity: 100, opening_cost_basis_cents: 100000 }, as: Advisor }
            - { call: "POST /advisory/securities/${s_eqx}/reprice", payload: { new_price_cents: 1200 }, as: ComplianceOfficer }
            - { call: "POST /advisory/portfolios/${p4}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 200000, occurred_at: "2026-08-11T00:00:00Z" }, as: Advisor, captures: { e2: $.data.id } }
            - { call: "POST /advisory/securities/${s_eqx}/reprice", payload: { new_price_cents: 1500 }, as: ComplianceOfficer }
            - { call: "POST /advisory/portfolios/${p4}/cash-movements", payload: { direction: WITHDRAWAL, amount_cents: 100000, occurred_at: "2026-08-21T00:00:00Z" }, as: Advisor, captures: { e3: $.data.id } }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P4b", tax_status: TAX_EXEMPT }, as: Advisor, captures: { p4b: $.data.id } }
            - { call: "POST /advisory/portfolios/${p4b}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p4b}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 1000000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/portfolios/${p4b}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 200000, occurred_at: "2026-08-11T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/portfolios/${p4b}/cash-movements", payload: { direction: WITHDRAWAL, amount_cents: 100000, occurred_at: "2026-08-21T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p4}", benchmark_id: "${b}", period_start: "2026-08-01", period_end: "2026-08-31", calculation_method: TIME_WEIGHTED, beginning_value_cents: 1100000, ending_value_cents: 1250000, benchmark_return_bps: 300 }, as: Advisor, captures: { r_tw: $.data.id } }
            - { call: "POST /advisory/performance-reports/${r_tw}/finalize", as: ComplianceOfficer }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p4b}", benchmark_id: "${b}", period_start: "2026-08-01", period_end: "2026-08-31", calculation_method: MONEY_WEIGHTED, beginning_value_cents: 1100000, ending_value_cents: 1250000, benchmark_return_bps: 300 }, as: Advisor, captures: { r_mw: $.data.id } }
            - { call: "POST /advisory/performance-reports/${r_mw}/finalize", as: ComplianceOfficer }
          trigger:
            - { call: "GET /advisory/performance-reports/${r_tw}", as: Advisor }
            - { call: "GET /advisory/performance-reports/${r_mw}", as: Advisor }
          assert:
            - "PerformanceReport.${r_tw}.portfolio_return_bps == 413 (TWR: (1120000/1100000) x (1350000/1320000) x (1250000/1250000) - 1)"
            - "PerformanceReport.${r_tw}.excess_return_bps == 113"
            - "PerformanceReport.${r_mw}.portfolio_return_bps == 417 (Dietz: 50000 / (1100000 + (2/3)*200000 - (1/3)*100000))"
            - "PerformanceReport.${r_mw}.excess_return_bps == 117"
            - "the two variants disagree on identical data: 413 != 417"
            - "CashFlowEvent.${e2}.valuation_before_cents == 1120000 and CashFlowEvent.${e3}.valuation_before_cents == 1350000"
            - "E1 (occurred exactly at period_start) is EXCLUDED from both variants' flow set: period (2026-08-01, 2026-08-31]"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes a, b, c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: withdrawal_model_mode_a_branch_interaction
        grounds:
          - calculations.withdrawal_impact_model
          - entities.Portfolio.fields.tax_status
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — funding_mode branch, tax_status
          branch, and the nested min(amount, cash) cash sleeve. CASH_FIRST with cash 100000
          accepts amount 80000 with an EMPTY plan but rejects amount 150000 with
          ERR_INSUFFICIENT_CASH; the cash sleeve consumes min(amount, cash) before any lot math.
        test_recipe:
          setup:
            - "same fixture shape as withdrawal_pro_rata_vs_tax_aware_divergence: TAXABLE portfolio, cash 100000, three lots, total 400000"
            - "W_ok: CASH_FIRST amount 80000; W_big: CASH_FIRST amount 150000"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Branch Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Balanced", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 20.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 20.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqa: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQB", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqb: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqa}", quantity: 100, opening_cost_basis_cents: 90000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqb}", quantity: 100, opening_cost_basis_cents: 40000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eib}", quantity: 200, opening_cost_basis_cents: 110000 }, as: Advisor }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 80000, funding_mode: CASH_FIRST }, as: Advisor, captures: { w_ok: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 150000, funding_mode: CASH_FIRST }, as: Advisor, captures: { w_big: $.data.id } }
          trigger:
            - { call: "POST /advisory/withdrawal-requests/${w_ok}/model-impact", as: Advisor }
            - { call: "POST /advisory/withdrawal-requests/${w_big}/model-impact", as: Advisor, captures: { err: $.data.error_id } }
          assert:
            - "WithdrawalRequest.${w_ok}.status == MODELED with modeled_plan == [] (empty plan: cash covers all)"
            - "WithdrawalRequest.${w_ok}.modeled_proceeds_cents == 0 and modeled_tax_cost_cents == 0 and modeled_cash_used_cents == 80000"
            - "second model-impact call returns ERR_INSUFFICIENT_CASH (http 422): CASH_FIRST forbids selling even though total 400000 >= 150000"
            - "WithdrawalRequest.${w_big}.status remains SUBMITTED"

      - name: rebalance_per_line_tax_rounding_mode_b
        grounds:
          - calculations.rebalance_cash_waterfall
          - calculations.rebalance_trade_generation
          - entities.TradeInstruction.fields.est_tax_impact_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line tax rounding
          (251 + 251 + 501 = 1003) differs from aggregate rounding (round(5012 * 0.2) = 1002);
          the scaffold pins per-line-then-sum, so est_tax_reserve_cents == 1003, not 1002.
        test_recipe:
          setup:
            - "ACTIVE client + ACTIVE IPS with targets US_EQUITY 10.00/0.10, CASH_EQUIVALENT 90.00/5.00"
            - "TAXABLE portfolio: cash 84964; securities EQ1/EQ2/EQ3 (US_EQUITY, price 1253, created in that order); positions 1xEQ1 basis 0, 1xEQ2 basis 0, 10xEQ3 basis 0; total 100000; US drift 504bps > 10bps band -> BREACHED"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Rounding Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Concentrated", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 10.00, band_pct: 0.10 }, { asset_class: CASH_EQUIVALENT, target_pct: 90.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 84964, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQ1", asset_class: US_EQUITY, initial_price_cents: 1253 }, as: ComplianceOfficer, captures: { s1: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQ2", asset_class: US_EQUITY, initial_price_cents: 1253 }, as: ComplianceOfficer, captures: { s2: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQ3", asset_class: US_EQUITY, initial_price_cents: 1253 }, as: ComplianceOfficer, captures: { s3: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s1}", quantity: 1, opening_cost_basis_cents: 0 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s2}", quantity: 1, opening_cost_basis_cents: 0 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s3}", quantity: 10, opening_cost_basis_cents: 0 }, as: Advisor }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { prop: $.data.id } }
            - { call: "GET /advisory/trade-instructions", payload: { proposal_id: "${prop}", security_id: "${s3}" }, as: Advisor, captures: { s3_qty: "$.data[0].quantity" } }
          assert:
            - "RebalanceProposal.${prop}.est_tax_reserve_cents == 1003 (per-line: 251 + 251 + 501; aggregate-rounding would give 1002)"
            - "RebalanceProposal.${prop}.total_sells_cents == 5012 (1x1253 + 1x1253 + 2x1253; per-line floor leaves 24 cents dust unsold)"
            - "RebalanceProposal.${prop}.total_buys_cents == 0 (CASH_EQUIVALENT shortfall is absorbed by the cash waterfall, no cash instruments exist)"
            - "RebalanceProposal.${prop}.cash_delta_cents == 4009 (5012 - 1003)"
            - "exactly 3 TradeInstructions generated; the EQ3 trade quantity == 2 (floored per line)"
            - "sell order follows gain-per-unit ASC with created_at tie-break: EQ1, EQ2, then EQ3"

      - name: rebalance_waterfall_pinned_eval_order_mode_c
        grounds:
          - calculations.rebalance_cash_waterfall
          - entities.RebalanceProposal.fields.total_buys_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency sells<->tax<->buys broken by pinned evaluation
          order — sells sized first (proceeds 37000), tax reserve computed on those sells (3700),
          buys trimmed to cash+sells-reserve (34300 -> 68 units, not 73): total_buys 34000,
          cash_delta -700. Recomputing sells after tax would change every number.
        test_recipe:
          setup:
            - "ACTIVE client + ACTIVE IPS with targets US_EQUITY 5.00/1.00, INTL_EQUITY 90.00/1.00, CASH_EQUIVALENT 5.00/1.00"
            - "TAXABLE portfolio: cash 1000; EQZ (US_EQUITY @1000) 40 units basis 20000; EIB (INTL_EQUITY @500) exists but is not held; total 41000; US 97.56% vs 5% target -> BREACHED"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Waterfall Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Global", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 5.00, band_pct: 1.00 }, { asset_class: INTL_EQUITY, target_pct: 90.00, band_pct: 1.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 5.00, band_pct: 1.00 } ] }, as: Advisor }
