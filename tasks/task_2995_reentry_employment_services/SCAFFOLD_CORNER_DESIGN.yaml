- section: consistency_model
  instances:
  - name: derived_money_is_visible_in_the_same_response_that_creates_it
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - calculations.support_request_award
    - calculations.support_request_settlement
    - calculations.grant_ledger
    distinguishing_aspect: 'Nothing may lag a request: the create response itself must already carry requested_cents,
      admin_fee_cents and total_charge_cents, and the ledger read taken immediately after the approval must already
      show the commitment. No re-read or second call may be needed to see a correct value.'
    test_recipe:
      setup:
      - FunderGrant g1 authorized_cents 100000, per_participant_cap_cents 60000, all six categories allowed, funding_posture
        OPEN
      - Participant p1 PRE_RELEASE with a stored release plan
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /grants
        payload:
          funder_name: Reentry Workforce Fund
          program_year: 2026
          authorized_cents: 100000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - DRUG_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 0
            transportation_score: 0
            health_score: 0
            work_history_score: 0
            documentation_score: 0
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_a: $.data.version
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_a}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: OWN_VEHICLE
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
      trigger:
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_b: $.data.version
      - call: POST /support-requests
        payload:
          participant_id: ${p1_id}
          grant_id: ${g1_id}
          category: ID_FEE
          expected_grant_version: ${g1_v_b}
          line_items:
          - description: State ID replacement fee
            unit_cost_cents: 8000
            quantity: 1
          justification: Replacement state identification
        as: CaseManager
        as_user_id: cm-1
        captures:
          sr1_id: $.data.id
      - call: POST /support-requests/${sr1_id}/review
        payload:
          decision: APPROVED
        as: ProgramDirector
        as_user_id: pd-1
      - call: GET /grants/${g1_id}/ledger
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          committed: $.data.committed_cents
          available: $.data.available_cents
      assert:
      - the POST /support-requests response body itself carries requested_cents == 8000, admin_fee_cents == 240 and
        total_charge_cents == 8240 — no follow-up GET is needed
      - the same response carries status == "SUBMITTED" and info_request_count == 0
      - the review response carries status == "APPROVED"
      - committed == 8240 and available == 91760 in the very next read
      - GET /grants/${g1_id} returns funding_posture == "OPEN" and restricted_floor_cents == 15000
