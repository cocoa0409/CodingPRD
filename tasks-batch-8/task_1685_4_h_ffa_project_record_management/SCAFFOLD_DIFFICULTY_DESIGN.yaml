  # =========================================================================
  # RULE 2 — combinatorial_formula: two calculations in DIFFERENT modes (a),(b),(c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: award_rubric_tiered_multi_input
        grounds:
          - calculations.award_rubric_score
          - state_machines.AwardApplication.ENDORSED_to_EVALUATED
        distinguishing_aspect: |
          Mode (a): award_rubric_score combines three inputs (record_final, participation_pct,
          leadership_pts) with a capped normalization and a tiered threshold selection
          (GOLD/SILVER/BRONZE/NONE). At record_final=80, participation=92, leadership_pts=14 the
          non-linear cap on leadership_norm (14/20*100=70) yields rubric 81.60 -> SILVER.
        test_recipe:
          setup:
            - "Member with APPROVED record book final_score==80.00 (officer, 2 days late, sections 80/90/70/85)"
            - "DEGREE-track AwardApplication advanced to ENDORSED via two distinct volunteers"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Hilltop 4-H", county_code: "HT" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol A", email: "va@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol B", email: "vb@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol2_id: $.data.id }
            - call: "POST /api/volunteers/${vol2_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem R", birth_date: "2009-01-01", club_id: "${club_id}", is_club_officer: true }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "EXPENSE", amount_cents: 15000, hours: 0, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-17T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 80, accuracy: 90, financial: 70, reflection: 85 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications"
              payload: { member_id: "${mem_id}", award_track: "DEGREE", record_book_id: "${rb_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { aa_id: $.data.id }
            - call: "GET /api/clubs/${club_id}"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { club_v: $.data.version }
            - call: "POST /api/award-applications/${aa_id}/nominate"
              payload: { expected_club_version: "${club_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications/${aa_id}/endorse"
              payload: {}
              as: Volunteer
              as_user_id: "${vol2_id}"
          trigger:
            - call: "POST /api/award-applications/${aa_id}/evaluate"
              payload: { participation_pct: 92, leadership_pts: 14 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { score: $.data.rubric_score, tier: $.data.award_tier }
          assert:
            - "AwardApplication.${aa_id}.rubric_score == 81.60"
            - "AwardApplication.${aa_id}.award_tier == SILVER"

      - name: volunteer_screening_circular_pinned_order
        grounds:
          - calculations.volunteer_screening_score
        distinguishing_aspect: |
          Mode (c): volunteer_screening_score has a circular-looking dependency (the years bonus
          uses years_service, but years_service is capped by a value derived from base_clearance).
          The scaffold pins evaluation order: cap years at floor(base/10) FIRST, then score. With
          base=50, risk=1, years=12 the cap is 5, so score == 50-10+5*2 == 50, not the 64 that an
          uncapped evaluation would produce.
        test_recipe:
          setup:
            - "A club exists"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Cedar 4-H", county_code: "CD" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol C", email: "vc@x.com", base_clearance: 50, risk_flags: 1, years_service: 12, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id, score: $.data.screening_score }
          assert:
            - "Volunteer.${vol_id}.screening_score == 50"
            - "Volunteer.${vol_id}.screening_score != 64  # uncapped years would give 50-10+12*2"

  # =========================================================================
  # RULE 3 — non_linear_state_machine on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: record_book_revision_cycle
        grounds:
          - state_machines.RecordBook.UNDER_REVIEW_to_RETURNED
          - state_machines.RecordBook.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          RecordBook has a cyclic revision loop: UNDER_REVIEW -> RETURNED -> SUBMITTED -> UNDER_REVIEW.
          After a return-and-resubmit, the book reaches UNDER_REVIEW a second time and can be approved;
          the loop is not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE member with ACTIVE project and a RecordBook that has been submitted once"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Elm 4-H", county_code: "EL" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol R", email: "vr@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem C", birth_date: "2009-02-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "CROPS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "HOURS", amount_cents: 0, hours: 12, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 70, accuracy: 70, financial: 70, reflection: 70 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_v2: $.data.version }
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/return"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { rb_v3: $.data.version }
          trigger:
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v3}", completeness: 90, accuracy: 90, financial: 90, reflection: 90 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { st: $.data.status }
          assert:
