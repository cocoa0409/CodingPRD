      - name: reopening_grant_depends_on_source_case_closed
        grounds:
          - state_machines.Reopening.UNDER_REVIEW_to_GRANTED
          - state_machines.GrievanceAppealCase.CLOSED_to_REOPENED
        distinguishing_aspect: |
          Reopening's GRANT transition is gated on the source
          GrievanceAppealCase being CLOSED — Reopening x Case pair, a third
          distinct entity pairing.
        test_recipe:
          setup:
            - "MEDICARE GRIEVANCE case still in IN_REVIEW (not closed); a reopening row is rejected at creation because the source case is not CLOSED"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CE3", full_name: "Fay Zhu", program: "MEDICARE" }
              as: PlatformAdmin
