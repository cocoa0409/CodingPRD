# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1912 Rail Grade Crossing Safety Program. Enumerative breadth coverage of
# claims in SCAFFOLD.yaml sections 1.1-1.7 not already probed by section 1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: crossing_create_applies_defaults
        claim_type: creation
        grounds: [entities.Crossing, response_envelope]
        distinguishing_aspect: "Create with only required fields applies defaults (school_bus_count 0), system fields (status ACTIVE, incident_count_5yr 0, version 1) and the fixed response envelope."
        test_recipe:
          setup: ["A registered locality"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Default City", state_code: "KS", contact_email: "pw@def.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-010001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
          assert:
            - "response envelope: meta.api_request_id present, response_type == object"
            - "Crossing.${cx_id}.school_bus_count == 0 (default applied)"
            - "Crossing.${cx_id}.status == ACTIVE (initial state), .incident_count_5yr == 0, .version == 1"
            - "Crossing.${cx_id}.exposure_index == 5.00 and .hazard_score == 5.50 (computed, not client-set)"

      - name: crossing_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.Crossing.fields.exposure_index, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied computed/unknown fields (exposure_index) are rejected with ERR_INVALID_REQUEST rather than silently accepted."
        test_recipe:
          setup: ["A registered locality"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Strict City", state_code: "KS", contact_email: "pw@strict.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-010002", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES", exposure_index: 999 }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "rejected with error_id == ERR_INVALID_REQUEST (http 400); no crossing persisted"

      - name: crossing_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CROSSING_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent crossing UUID returns ERR_CROSSING_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /crossings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CROSSING_NOT_FOUND, http 404, envelope response_type == error"

      - name: crossing_list_pagination_and_filter
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit/offset pagination reports total_count and has_more; status filter narrows the result set."
        test_recipe:
          setup: ["A locality and three ACTIVE crossings"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Page City", state_code: "KS", contact_email: "pw@page.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-010011", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-010012", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-010013", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /crossings"
              payload: { limit: 2, offset: 0 }
              as: RailSafetyOfficer
            - call: "GET /crossings"
              payload: { status: "CLOSED" }
              as: RailSafetyOfficer
          assert:
            - "page 1: 2 items returned, total_count == 3, has_more == true"
            - "filter status=CLOSED: 0 items, total_count == 0, has_more == false"

      - name: zone_member_defaults
        claim_type: defaults
        grounds: [entities.QuietZoneCrossing.fields.ssm_codes, entities.QuietZoneCrossing.fields.membership_status]
        distinguishing_aspect: "Adding a member without ssm_codes stores an empty SSM list and membership_status MEMBER."
        test_recipe:
          setup: ["A locality, an ACTIVE crossing, and a DRAFT zone owned by the locality"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Member City", state_code: "KS", contact_email: "pw@mem.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-010021", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /quiet-zone-applications"
              payload: { locality_id: "${loc_id}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { qz: $.data.id }
          trigger:
            - call: "POST /quiet-zone-applications/${qz}/members"
              payload: { crossing_id: "${cx_id}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { member: $.data.id }
          assert:
            - "QuietZoneCrossing.${member}.ssm_codes == [] (default)"
            - "QuietZoneCrossing.${member}.membership_status == MEMBER"
            - "QuietZoneCrossing.${member}.quiet_zone_application_id == ${qz}"

  - section: state_machines
    instances:
      - name: confirm_closure_from_active_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Crossing, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "confirm-closure on an ACTIVE crossing (no executed agreement) is rejected; CLOSURE_PENDING is only reachable via agreement execution."
        test_recipe:
          setup: ["A locality and an ACTIVE crossing"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "State City", state_code: "KS", contact_email: "pw@state.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
          trigger:
            - call: "POST /crossings/${cx_id}/confirm-closure"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (http 409); crossing remains ACTIVE"

      - name: review_accept_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.DiagnosticReview.RECOMMENDATIONS_ISSUED_to_ACCEPTED, state_machines.DiagnosticReview.ACCEPTED_to_SUPERSEDED]
        distinguishing_aspect: "Accepting a newer review for the same crossing auto-supersedes the prior ACCEPTED review and records superseded_by_review_id."
        test_recipe:
          setup: ["A locality, a team, and an ACTIVE crossing with review R1 already ACCEPTED and review R2 at RECOMMENDATIONS_ISSUED (team dates 2 days apart)"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Supersede City", state_code: "KS", contact_email: "pw@sup.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /diagnostic-teams"
              payload: { team_name: "Team Epsilon", lead_agency: "DOT" }
              as: ProgramAdministrator
              captures: { team_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020011", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${cx_id}", team_id: "${team_id}", scheduled_date: "2026-09-10" }
              as: ProgramAdministrator
              captures: { r1: $.data.id }
            - call: "POST /diagnostic-reviews/${r1}/transition"
              payload: { to_status: "IN_SESSION" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${r1}/issue-recommendations"
              payload: { recommendations: ["UPGRADE_DEVICES"] }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${r1}/transition"
              payload: { to_status: "ACCEPTED" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${cx_id}", team_id: "${team_id}", scheduled_date: "2026-09-12" }
              as: ProgramAdministrator
              captures: { r2: $.data.id }
            - call: "POST /diagnostic-reviews/${r2}/transition"
              payload: { to_status: "IN_SESSION" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${r2}/issue-recommendations"
              payload: { recommendations: ["INSTALL_PREEMPTION"] }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /diagnostic-reviews/${r2}/transition"
              payload: { to_status: "ACCEPTED" }
              as: RailSafetyOfficer
            - call: "GET /diagnostic-reviews/${r1}"
              as: RailSafetyOfficer
              captures: { r1_status: $.data.status, r1_sup: $.data.superseded_by_review_id }
          assert:
            - "DiagnosticReview.${r2}.status == ACCEPTED"
            - "DiagnosticReview.${r1}.status == SUPERSEDED and superseded_by_review_id == ${r2}"

      - name: project_withdrawn_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.UpgradeProject]
        distinguishing_aspect: "A WITHDRAWN project rejects every further transition (terminal lockdown)."
        test_recipe:
          setup: ["Locality, ACTIVE crossing, OPEN program, PROPOSED project"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Terminal City", state_code: "KS", contact_email: "pw@term.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020021", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2040, apportionment_cents: 1000000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_id}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 300000 }
              as: RailSafetyOfficer
              captures: { pj: $.data.id }
            - call: "POST /upgrade-projects/${pj}/transition"
              payload: { to_status: "WITHDRAWN" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /upgrade-projects/${pj}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (http 409); project remains WITHDRAWN"

      - name: incident_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IncidentReport.REPORTED_to_REJECTED]
        distinguishing_aspect: "An incident screened to REJECTED is terminal; a later close attempt is rejected."
        test_recipe:
          setup: ["Locality, ACTIVE crossing, a REPORTED incident"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Reject City", state_code: "KS", contact_email: "pw@rej.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020031", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2026-06-01T10:00:00Z", severity: "NEAR_MISS" }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { inc: $.data.id }
            - call: "POST /incident-reports/${inc}/transition"
              payload: { to_status: "REJECTED" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /incident-reports/${inc}/transition"
              payload: { to_status: "CLOSED" }
              as: RailSafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (http 409); incident remains REJECTED"

      - name: work_order_fouling_requires_flagging_confirmation
        claim_type: precondition_enforcement
        grounds: [state_machines.MaintenanceWorkOrder.PLANNED_to_IN_WORK, "errors[ERR_FLAGGING_NOT_CONFIRMED]"]
        distinguishing_aspect: "A fouls_track work order may not enter IN_WORK from PLANNED; after railroad flagging confirmation it may (window covers the default clock 2026-08-01T00:00:00Z)."
        test_recipe:
          setup: ["Locality; ACTIVE crossing (BNSF); ACTIVE SIGNAL assignment to RAILROAD; a fouls_track work order with flagging_vendor, window 2026-07-31T00:00:00Z to 2026-08-02T00:00:00Z (contains the default logical clock)"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Flag City", state_code: "KS", contact_email: "pw@flag.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020041", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /maintenance-assignments"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", responsible_party: "RAILROAD", effective_from: "2026-08-01" }
              as: ProgramAdministrator
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-02T00:00:00Z", fouls_track: true, flagging_vendor: "BNSF-flagging-desk" }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /maintenance-work-orders/${wo}/transition"
              payload: { to_status: "IN_WORK" }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { err: $.data.error_id }
            - call: "POST /maintenance-work-orders/${wo}/transition"
              payload: { to_status: "FLAGGING_CONFIRMED" }
              as: RailroadMaintainer
              as_user_id: "BNSF"
            - call: "POST /maintenance-work-orders/${wo}/transition"
              payload: { to_status: "IN_WORK" }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { st: $.data.status }
          assert:
            - "first IN_WORK attempt: error_id == ERR_FLAGGING_NOT_CONFIRMED (http 409)"
            - "after FLAGGING_CONFIRMED: IN_WORK succeeds (status == IN_WORK)"

      - name: begin_work_outside_window_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.MaintenanceWorkOrder.PLANNED_to_IN_WORK, "errors[ERR_OUTSIDE_WORK_WINDOW]"]
        distinguishing_aspect: "IN_WORK requires the logical clock inside [window_start, window_end); the default clock 2026-08-01T00:00:00Z is outside a September window, and advancing the clock makes it pass."
        test_recipe:
          setup: ["Locality; ACTIVE crossing (BNSF); ACTIVE SIGNAL assignment to RAILROAD; non-fouling work order with window 2026-09-01T08:00:00Z to 2026-09-01T12:00:00Z"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Clock City", state_code: "KS", contact_email: "pw@clock.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020051", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /maintenance-assignments"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", responsible_party: "RAILROAD", effective_from: "2026-08-01" }
              as: ProgramAdministrator
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /maintenance-work-orders/${wo}/transition"
              payload: { to_status: "IN_WORK" }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /maintenance-work-orders/${wo}/transition"
              payload: { to_status: "IN_WORK" }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { st: $.data.status }
          assert:
            - "first IN_WORK attempt (default clock 2026-08-01T00:00:00Z): error_id == ERR_OUTSIDE_WORK_WINDOW (http 409)"
            - "after clock set to 2026-09-01T09:00:00Z: IN_WORK succeeds (status == IN_WORK)"

      - name: agreement_negotiation_round_cap
        claim_type: precondition_enforcement
        grounds: [state_machines.ClosureAgreement.PROPOSED_to_COUNTERED, "errors[ERR_NEGOTIATION_ROUND_LIMIT]", calculations.closure_incentive_offer]
        distinguishing_aspect: "Counter number 6 (taking negotiation_round to 6) succeeds; the next counter at round 6 is rejected by the MAX_NEGOTIATION_ROUNDS cap."
        test_recipe:
          setup: ["Locality; ACTIVE crossing (exposure 5.00 -> CLOSURE computed incentive 275000); agreement created and proposed by officer-1 (round 1)"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Round City", state_code: "KS", contact_email: "pw@round.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020061", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cx_id}", locality_id: "${loc_id}", closure_type: "CLOSURE" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { ag: $.data.id, inc0: $.data.computed_incentive_cents }
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "PROPOSED" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /closure-agreements/${ag}/counter"
              payload: { proposed_incentive_cents: 400000 }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /closure-agreements/${ag}/counter"
              payload: { proposed_incentive_cents: 375000 }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /closure-agreements/${ag}/counter"
              payload: { proposed_incentive_cents: 390000 }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /closure-agreements/${ag}/counter"
              payload: { proposed_incentive_cents: 380000 }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /closure-agreements/${ag}/counter"
              payload: { proposed_incentive_cents: 385000 }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { r6: $.data.negotiation_round, st6: $.data.status }
          trigger:
            - call: "POST /closure-agreements/${ag}/counter"
              payload: { proposed_incentive_cents: 384000 }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "after 5 counters: negotiation_round == 6, status == COUNTERED, computed_incentive_cents == 275000"
            - "counter at round 6: error_id == ERR_NEGOTIATION_ROUND_LIMIT (http 409); state and round unchanged"

      - name: quiet_zone_supplement_cycle_to_approval
        claim_type: valid_transition
        grounds: [state_machines.QuietZoneApplication.SUPPLEMENT_REQUIRED_to_SUBMITTED, state_machines.QuietZoneApplication.UNDER_REVIEW_to_SUPPLEMENT_REQUIRED, calculations.quiet_zone_risk]
        distinguishing_aspect: "Cyclic loop: decide lands SUPPLEMENT_REQUIRED (pre 75.00, post 69.00, progress but insufficient); the locality revises SSMs (delete/re-add members) and resubmits; second decide APPROVED (post 31.00 <= 40.00)."
        test_recipe:
          setup:
            - "Locality (owner); team; crossing C (hazard 80.00: annual 3650, aadt 5000, bus 20) and crossing D (hazard 70.00: annual 3285, aadt 5000, bus 14), each with an ACCEPTED review; DRAFT zone with C (WAYSIDE_HORN) and D (no SSM)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Cycle Zone City", state_code: "KS", contact_email: "pw@cz.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /diagnostic-teams"
              payload: { team_name: "Team Zeta", lead_agency: "DOT" }
              as: ProgramAdministrator
