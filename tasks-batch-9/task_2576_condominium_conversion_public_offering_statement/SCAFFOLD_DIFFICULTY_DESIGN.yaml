          assert:
            - "read 1 (baseline, before any cash moves): ConversionProject.${proj_id}.escrow_deposits_received_cents == 0 and ConversionProject.${proj_id}.escrow_balance_cents == 0 and ConversionProject.${proj_id}.escrow_refunded_cents == 0 and ConversionProject.${proj_id}.escrow_disbursed_cents == 0"
            - "read 1: ConversionProject.${proj_id}.escrow_reconciliation_delta_cents == 0  # received - (balance + refunded + disbursed) == 0 - (0 + 0 + 0)"
            - "deposit call: HTTP 200 and PurchaseAgreement.${pa1_id}.escrow_status == FUNDED  # amount_cents 2400000 equals deposit_cents exactly, so priority 47 ERR_ESCROW_AMOUNT_MISMATCH does not fire"
            - "read 2 (cash in escrow): ConversionProject.${proj_id}.escrow_deposits_received_cents == 2400000 and ConversionProject.${proj_id}.escrow_balance_cents == 2400000 and ConversionProject.${proj_id}.escrow_refunded_cents == 0 and ConversionProject.${proj_id}.escrow_disbursed_cents == 0"
            - "read 2: ConversionProject.${proj_id}.escrow_reconciliation_delta_cents == 0  # 2400000 - (2400000 + 0 + 0); the deposit is a single credit to received matched by a single credit to balance"
            - "rescission call: HTTP 200 and PurchaseAgreement.${pa1_id}.contract_status == RESCINDED and PurchaseAgreement.${pa1_id}.escrow_status == REFUNDED and PurchaseAgreement.${pa1_id}.closed_at == null  # state_machines.PurchaseAgreement.FUNDED_to_REFUNDED, and the clock is still 2026-08-10T00:00:00Z which is strictly before rescission_deadline_at 2026-08-16T00:00:00Z so priority 36 ERR_RESCISSION_PERIOD_CLOSED does not fire"
            - "read 3 (cash refunded): ConversionProject.${proj_id}.escrow_balance_cents == 0 and ConversionProject.${proj_id}.escrow_refunded_cents == 2400000 and ConversionProject.${proj_id}.escrow_disbursed_cents == 0"
            - "read 3: ConversionProject.${proj_id}.escrow_deposits_received_cents == 2400000 - the cumulative receipts total is NEVER decremented by a refund; the refund moves 2400000 from balance to refunded, it does not reverse the receipt, so an implementation that debits received on refund breaks this line while still reporting delta 0"
            - "read 3: ConversionProject.${proj_id}.escrow_reconciliation_delta_cents == 0  # 2400000 - (0 + 2400000 + 0); the conserved quantity is escrow CASH, and it is zero in all three reads even though every individual bucket changed"
            - "invariant across all three reads: escrow_reconciliation_delta_cents == 0 at read 1, read 2 AND read 3, so the delta is restored to its pre-deposit value rather than merely ending small"
            - "end state: Unit.${u1_id}.sale_status == UNSOLD and Unit.${u1_id}.percentage_interest_bp == 10000  # the rescission releases the unit but the single-unit bp allocation is untouched"
            - "end state: ConversionProject.${proj_id}.posture == OPEN  # calculations.project_posture_derivation: suitability is PASSED with no REVISION_REQUESTED report, the DeclarationPackage is RECORDED, the PublicOfferingStatement is EFFECTIVE, there is no ClosingBatch at all so no THRESHOLD_SHORT batch exists, there are no TenantHousehold rows, and both reconciliation deltas are 0"
            - "end state: GET /conversion-projects/${proj_id}/closing-batches returns zero rows, confirming the conservation holds on a path that never touches batch or disbursement logic"

      - name: undivided_share_bp_restored_byte_identically_by_withdraw_then_reinstate
        grounds:
          - calculations.percentage_interest_reallocation
          - entities.Unit.fields.declaration_status
          - entities.Unit.fields.percentage_interest_bp
          - entities.DeclarationPackage.fields.allocated_bp_total
          - entities.ConversionProject.fields.bp_conservation_total
        distinguishing_aspect: |
          The conserved quantity is a dimensionless ownership share - the 10000 basis points of
          undivided interest - which is REDISTRIBUTED over the INCLUDED set rather than moved
          between ledger buckets: withdrawing a unit re-sweeps the survivors to 5000/5000 and
          reinstating it must restore 3333/3333/3334 byte-identically, per unit, not merely restore
          the 10000 total. Cash conservation (the sibling instance) can be satisfied without any
          per-row equality; this invariant cannot.
