      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request with no X-User-Role header fails with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-AUTH", name: "No Auth", host_state_code: "TN", service_date: "2027-06-05", doors_open_utc: "2027-06-05T10:00:00Z", total_patient_capacity: 10 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"

      - name: state_practice_forbidden_out_of_state_license
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_STATE_PRACTICE_FORBIDDEN]"]
        distinguishing_aspect: "A clinical volunteer licensed in NC cannot be authorized for a VA event (license_state_code != host_state_code) — ERR_STATE_PRACTICE_FORBIDDEN."
