# =============================================================================
# PRD Benchmark Scaffold — Charitable Gaming License (Bingo/Raffle)
# Difficulty: Expert
# =============================================================================

scenario: |
  Charitable Gaming License (Bingo/Raffle): organization eligibility (nonprofit),
  license type & game schedule, prize-limit & payout rules, financial reporting &
  proceeds-use audit, equipment/supplier registration, occasion reporting,
  violation/suspension, renewal

domain_name: charitable-gaming
# Flat, multi-collection topology: every entity is a top-level resource reachable
# at /<collection>/{id}. api_prefix is the empty root so the FK reverse-reach
# derivation (scaffold_lint check f) resolves a segment for every collection.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency        # OCC on License.version (renewal create-supersede + license update lost-update)
    - cascading_side_effects        # violation -> suspend -> occasion cancel -> allocation release
    - dual_variant_calculation      # provisional vs final occasion net; committed vs settled prize consumption
    - rate_threshold_triggers       # prize caps, charitable-minimum, suspension point threshold
    - scheduled_deferred_actions    # logical clock drives eligibility months + license expiry

  entity_topology: flat             # peer entities linked by FK; no nested ownership URLs except reverse-reach GETs
  state_machine_shape: cyclic       # License ACTIVE<->SUSPENDED; FinancialReport REJECTED->DRAFT->SUBMITTED
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # EquipmentAllocation bridges Occasion (org side) and Equipment (supplier side)
  role_model: peer_roles            # Regulator (operator) vs OrgOfficer vs Supplier own disjoint resource types
  consistency_model: immediate

  design_notes: |
    Endpoint count sits above the nominal Expert 20-32 band because the scenario
    names eight independent sub-domains (eligibility, schedule, prize rules,
    financial audit, equipment/supplier registration, occasion reporting,
    violation/suspension, renewal). Each of the 9 entities carries a create, a
    reverse-reachability GET (mandated by lint check f) and a small lifecycle,
    which is the honest floor for this breadth — the difficulty lives in how
    tightly the prize-ledger, cascade and audit mechanics couple, not in volume.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the nonprofit" }
      - { name: ein, type: string, source: input, description: "Employer Identification Number" }
      - { name: nonprofit_type, type: enum, source: input, description: "501C3 | 501C4 | 501C8 | 501C10 | 501C19 | OTHER" }
      - { name: incorporation_date, type: datetime, source: input, description: "ISO date the org was incorporated; drives months_active" }
      - { name: good_standing, type: boolean, source: input, default: true, description: "Whether the org is in good standing with the state registry" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: months_active, type: integer, source: computed, description: "Whole calendar months between incorporation_date and the current logical clock" }
      - { name: eligibility_status, type: enum, source: computed, description: "ELIGIBLE | INELIGIBLE — derived from nonprofit_type, months_active, good_standing" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: license_type, type: enum, source: input, description: "BINGO | RAFFLE | COMBINED" }
      - { name: contact_email, type: string, source: input, description: "Contact email; mutable via PATCH under OCC" }
      - { name: venue_name, type: string, source: input, description: "Primary venue name; mutable via PATCH under OCC" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | SUSPENDED | EXPIRED" }
      - { name: effective_date, type: datetime, source: system, required: false, description: "Set to the clock date at approval" }
      - { name: expiration_date, type: datetime, source: system, required: false, description: "effective_date + 12 months; extended by requested_term_months on renewal approval" }
      - { name: annual_prize_limit_cents, type: integer, source: computed, description: "From license_type via ANNUAL_PRIZE_LIMIT_CENTS" }
      - { name: prize_committed_cents, type: integer, source: computed, description: "Sum of planned_prize_pool_cents over occasions with status IN {SCHEDULED, HELD}" }
      - { name: prize_settled_cents, type: integer, source: computed, description: "Sum of prizes_paid_cents over occasions with status == REPORTED" }
      - { name: prize_allowance_remaining_cents, type: integer, source: computed, description: "annual_prize_limit_cents - prize_committed_cents - prize_settled_cents" }
      - { name: total_violation_points_active, type: integer, source: computed, description: "Sum of points over Violations for this license with status == OPEN" }

  - name: Occasion
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id" }
      - { name: occasion_type, type: enum, source: input, description: "BINGO | RAFFLE" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start [start, end) for schedule overlap" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; must be > scheduled_start" }
      - { name: venue_name, type: string, source: input, description: "Venue for this occasion" }
      - { name: planned_gross_cents, type: integer, source: input, description: "Projected gross receipts" }
      - { name: planned_prize_pool_cents, type: integer, source: input, description: "Projected total prizes; reserved into License.prize_committed_cents at creation" }
      - { name: planned_expenses_cents, type: integer, source: input, description: "Projected expenses" }
      - { name: gross_receipts_cents, type: integer, source: input, required: false, description: "Actual gross receipts, supplied on report" }
      - { name: prizes_paid_cents, type: integer, source: input, required: false, description: "Actual prizes paid, supplied on report" }
      - { name: expenses_cents, type: integer, source: input, required: false, description: "Actual expenses, supplied on report" }
      - { name: net_proceeds_cents, type: integer, source: computed, required: false, description: "Provisional (planned) at HELD, final (actual) at REPORTED — see occasion_net_proceeds" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | REPORTED | CANCELLED" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Supplier business name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: status, type: enum, source: system, description: "PENDING | REGISTERED" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: equipment_type, type: enum, source: input, description: "BINGO_BLOWER | FLASHBOARD | RAFFLE_DRUM | CARD_MINDER" }
      - { name: serial_number, type: string, source: input, description: "Serial number; unique per supplier" }
      - { name: status, type: enum, source: system, description: "REGISTERED | RETIRED" }

  - name: EquipmentAllocation
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id" }
      - { name: occasion_id, type: string, source: input, description: "FK -> Occasion.id" }
      - { name: start_date, type: datetime, source: input, description: "Closed interval start [start_date, end_date] (date granularity) for equipment overlap w/ buffer" }
      - { name: end_date, type: datetime, source: input, description: "Closed interval end; must be >= start_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }

  - name: FinancialReport
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (inclusive); must be > period_start" }
      - { name: charitable_use_cents, type: integer, source: input, description: "Amount the org reports as used for charitable purpose in the period" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: total_gross_cents, type: integer, source: computed, description: "Sum of gross_receipts_cents over REPORTED occasions with period_start <= scheduled_start <= period_end" }
      - { name: total_prizes_cents, type: integer, source: computed, description: "Sum of prizes_paid_cents over the same occasion set" }
      - { name: total_expenses_cents, type: integer, source: computed, description: "Sum of expenses_cents over the same occasion set" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "total_gross_cents - total_prizes_cents - total_expenses_cents" }
      - { name: admin_allowance_cents, type: integer, source: computed, description: "round_half_up(net_proceeds_cents * ADMIN_ALLOWANCE_PCT)" }
      - { name: regulatory_fee_cents, type: integer, source: computed, description: "round_half_up(net_proceeds_cents * REGULATORY_FEE_PCT)" }
      - { name: charitable_minimum_cents, type: integer, source: computed, description: "net_proceeds_cents - admin_allowance_cents - regulatory_fee_cents (rounding order pinned; see proceeds_distribution)" }
      - { name: charitable_use_ratio, type: number, source: computed, description: "charitable_use_cents / net_proceeds_cents, 4 dp, or 0 when net_proceeds_cents <= 0" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id" }
      - { name: violation_type, type: enum, source: input, description: "LATE_REPORT | PRIZE_LIMIT_EXCEEDED | UNREGISTERED_EQUIPMENT | PROCEEDS_MISUSE" }
      - { name: points, type: integer, source: computed, description: "Assigned from violation_type via POINTS_BY_TYPE" }
      - { name: source, type: enum, source: system, description: "MANUAL (POST /violations) | AUTO (auto-raised by a late occasion report)" }
      - { name: status, type: enum, source: system, description: "OPEN | WAIVED" }

  - name: Renewal
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id" }
      - { name: requested_term_months, type: integer, source: input, default: 12, description: "Months to extend expiration_date on approval" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | SUPERSEDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: License
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licenses/{id}/submit"
        actor: OrgOfficer
        preconditions:
          - "License.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects: []

      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /licenses/{id}/approve"
        actor: Regulator
        preconditions:
          - "License.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "Organization(license.organization_id).eligibility_status == ELIGIBLE (else ERR_ORG_NOT_ELIGIBLE)"
        side_effects:
          - "effective_date = current logical clock date"
          - "expiration_date = effective_date + 12 months"
          - "prize buckets initialized: prize_committed_cents/prize_settled_cents reflect existing occasions (0 for a fresh license)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licenses/{id}/suspend"
        actor: Regulator
        preconditions:
          - "License.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: every Occasion with license_id == this.id and status == SCHEDULED transitions to CANCELLED (which itself releases prize_committed_cents and RELEASES each of that occasion's ACTIVE EquipmentAllocations)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: a POST /violations (or auto LATE_REPORT) raises total_violation_points_active to >= SUSPENSION_POINT_THRESHOLD"
        actor: system
        preconditions:
          - "License.status == ACTIVE"
          - "total_violation_points_active >= SUSPENSION_POINT_THRESHOLD after the violation is applied"
        side_effects:
          - "CASCADE (identical to manual suspend): SCHEDULED Occasions -> CANCELLED -> release prize_committed_cents and RELEASE their ACTIVE EquipmentAllocations"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licenses/{id}/reinstate"
        actor: Regulator
        preconditions:
          - "License.status == SUSPENDED (else ERR_INVALID_STATE)"
          - "total_violation_points_active < SUSPENSION_POINT_THRESHOLD (else ERR_OUTSTANDING_VIOLATIONS)"
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the clock past expiration_date"
        actor: system
        preconditions:
          - "License.status == ACTIVE"
          - "new clock > expiration_date"
        side_effects:
          - "CASCADE: SCHEDULED Occasions -> CANCELLED -> release prize_committed_cents and RELEASE their ACTIVE EquipmentAllocations"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /renewals/{id}/approve (renewal reactivation)"
        actor: Regulator
        preconditions:
          - "License.status == EXPIRED"
          - "Renewal.status == REQUESTED"
        side_effects:
          - "expiration_date = max(expiration_date, current clock date) + requested_term_months"
          - "Renewal.status -> APPROVED"

  - entity: Occasion
    initial_state: SCHEDULED
    terminal_states: [REPORTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /occasions/{id}/hold"
        actor: OrgOfficer
        preconditions:
          - "Occasion.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "License(occasion.license_id).status == ACTIVE (else ERR_LICENSE_NOT_ACTIVE)"
        side_effects:
          - "net_proceeds_cents = PROVISIONAL variant = planned_gross_cents - planned_prize_pool_cents - planned_expenses_cents (occasion_net_proceeds)"

      - from: HELD
        to: REPORTED
        trigger: "POST /occasions/{id}/report"
        actor: OrgOfficer
        preconditions:
          - "Occasion.status == HELD (else ERR_INVALID_STATE)"
          - "License(occasion.license_id).status == ACTIVE (else ERR_LICENSE_NOT_ACTIVE)"
          - "prizes_paid_cents <= occasion_prize_allowance (else ERR_PRIZE_LIMIT_EXCEEDED)"
        side_effects:
          - "gross_receipts_cents / prizes_paid_cents / expenses_cents stored from the request body"
          - "net_proceeds_cents = FINAL variant = gross_receipts_cents - prizes_paid_cents - expenses_cents (occasion_net_proceeds)"
          - "License.prize_committed_cents -= planned_prize_pool_cents; License.prize_settled_cents += prizes_paid_cents (license_prize_consumption)"
          - "if current clock > scheduled_end + REPORT_GRACE_DAYS: CASCADE auto-create a Violation {violation_type: LATE_REPORT, source: AUTO}, which recomputes License.total_violation_points_active (transitive_cascade)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /occasions/{id}/cancel (also fired by License suspend/expire cascade)"
        actor: OrgOfficer
        preconditions:
          - "Occasion.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "License.prize_committed_cents -= planned_prize_pool_cents (releases the reservation; license_prize_consumption)"
          - "CASCADE: every EquipmentAllocation with occasion_id == this.id and status == ACTIVE transitions to RELEASED"

  - entity: Supplier
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /suppliers/{id}/register"
        actor: Regulator
        preconditions:
          - "Supplier.status == PENDING (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: Equipment
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: RETIRED
        trigger: "POST /equipment/{id}/retire"
        actor: Supplier
        preconditions:
          - "Equipment.status == REGISTERED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: EquipmentAllocation
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /equipment-allocations/{id}/release (also fired by Occasion cancel cascade)"
        actor: OrgOfficer
        preconditions:
          - "EquipmentAllocation.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: FinancialReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /financial-reports/{id}/submit"
        actor: OrgOfficer
        preconditions:
          - "FinancialReport.status == DRAFT (else ERR_INVALID_STATE)"
          - "charitable_use_cents >= charitable_minimum_cents (else ERR_CHARITABLE_MINIMUM_NOT_MET)"
        side_effects: []

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /financial-reports/{id}/accept"
        actor: Regulator
        preconditions:
          - "FinancialReport.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /financial-reports/{id}/reject"
        actor: Regulator
        preconditions:
          - "FinancialReport.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /financial-reports/{id}/revise"
        actor: OrgOfficer
        preconditions:
          - "FinancialReport.status == REJECTED (else ERR_INVALID_STATE)"
        side_effects:
          - "report returns to DRAFT so the org can amend and re-submit (cyclic revision loop)"

  - entity: Violation
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: WAIVED
        trigger: "POST /violations/{id}/waive"
        actor: Regulator
        preconditions:
          - "Violation.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "License.total_violation_points_active -= points (compensating_invariant: forward create + waive nets to zero)"

  - entity: Renewal
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /renewals/{id}/approve"
        actor: Regulator
        preconditions:
          - "Renewal.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "License.expiration_date = max(expiration_date, current clock date) + requested_term_months"
          - "if License.status == EXPIRED: License.status -> ACTIVE"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /renewals/{id}/deny"
        actor: Regulator
        preconditions:
          - "Renewal.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects: []

      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system: a new Renewal is created for the same license while this one is still REQUESTED"
        actor: system
        preconditions:
          - "a newer Renewal for the same license_id is created successfully"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on License.version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: renewal-create-stale-license
    parent_entity: License
    write_endpoint: "POST /renewals"
    occ_field: "expected_license_version"
    description: |
      Creating a Renewal against a License whose version has advanced since the
      client last observed it is rejected. A newly created Renewal legitimately
      supersedes any prior still-REQUESTED Renewal for the license (setting it to
      SUPERSEDED) and advances the license version; a create carrying a stale
      expected_license_version therefore reflects an outdated view and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-update-stale
    parent_entity: License
    write_endpoint: "PATCH /licenses/{id}"
    occ_field: "expected_license_version"
    description: |
      Updating a License's mutable contact fields (contact_email, venue_name)
      with a stale expected_license_version is rejected. This captures the
      classic lost-update case where the license version has moved on (another
      update, a renewal, or a cascade bumped it) since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: months_active
    trigger: "computed on Organization read and whenever eligibility is evaluated (license approve)"
    algorithm: decay_function
    formula: |
      months_active = whole calendar months elapsed from incorporation_date to the current logical clock
                    = (clock.year - inc.year) * 12 + (clock.month - inc.month)
                      - (1 if clock.day < inc.day else 0)
      Clamped at 0 (never negative). Uses the logical clock, never wall-clock time.
    input_set: "single Organization vs the logical clock"
    precision: "integer months, floor"

  - name: eligibility_status
    trigger: "computed on Organization read and evaluated as a precondition of POST /licenses/{id}/approve"
    algorithm: threshold
    formula: |
      ELIGIBLE if ALL of:
        (1) nonprofit_type in QUALIFYING_NONPROFIT_TYPES
        (2) months_active >= ELIGIBILITY_MIN_MONTHS
        (3) good_standing == true
      else INELIGIBLE
    input_set: "single Organization"
    constants:
      ELIGIBILITY_MIN_MONTHS: 36
      QUALIFYING_NONPROFIT_TYPES: ["501C3", "501C4", "501C8", "501C10", "501C19"]
    precision: "enum, exact"

  - name: annual_prize_limit
    trigger: "computed on License read; fixed at approval by license_type"
    algorithm: aggregation
    formula: |
      annual_prize_limit_cents = ANNUAL_PRIZE_LIMIT_CENTS[license_type]
    input_set: "single License"
    constants:
      ANNUAL_PRIZE_LIMIT_CENTS: { BINGO: 1000000, RAFFLE: 2000000, COMBINED: 3000000 }
    precision: "integer cents"

  - name: occasion_net_proceeds
    trigger: "Occasion hold (provisional) and Occasion report (final)"
    algorithm: dual_variant
    formula: |
      net_proceeds_cents is written by two DIFFERENT arithmetic variants on the SAME occasion:
      provisional (at HELD) = planned_gross_cents - planned_prize_pool_cents - planned_expenses_cents
      final       (at REPORTED) = gross_receipts_cents - prizes_paid_cents - expenses_cents
    input_set: "single Occasion; planned_* fields for provisional, actual *_cents fields for final"
    precision: "integer cents"
    variants:
      - { name: provisional, when: "occasion is HELD (actuals not yet reported)", difference: "uses planned_* projections" }
      - { name: final, when: "occasion is REPORTED", difference: "uses actual reported gross/prizes/expenses; typically diverges from provisional" }

  - name: license_prize_consumption
    trigger: "Occasion create/cancel (committed) and Occasion report (settled)"
    algorithm: dual_variant
    formula: |
      Two DIFFERENT views of how much of the annual prize allowance a License has consumed:
      committed (forward-looking) = sum(planned_prize_pool_cents) over occasions with status IN {SCHEDULED, HELD}
      settled   (chronological)   = sum(prizes_paid_cents)        over occasions with status == REPORTED
      prize_allowance_remaining_cents = annual_prize_limit_cents - prize_committed_cents - prize_settled_cents
      Bucket transfers:
        create SCHEDULED occasion: prize_committed_cents += planned_prize_pool_cents
        cancel occasion:           prize_committed_cents -= planned_prize_pool_cents
        report occasion:           prize_committed_cents -= planned_prize_pool_cents; prize_settled_cents += prizes_paid_cents
    input_set: "all non-terminal-and-reported occasions of one License, partitioned by status"
    precision: "integer cents"
    variants:
      - { name: committed, when: "occasions are SCHEDULED or HELD", difference: "forward-looking planned prize pools" }
      - { name: settled, when: "occasions are REPORTED", difference: "chronological actual prizes paid" }

  - name: occasion_prize_allowance
    trigger: "evaluated as a precondition of POST /occasions/{id}/report"
    algorithm: threshold
    formula: |
      committed_other = License.prize_committed_cents - occasion.planned_prize_pool_cents
      annual_remaining_for_this = License.annual_prize_limit_cents - License.prize_settled_cents - committed_other
      occasion_prize_allowance = min( PER_OCCASION_PRIZE_CAP_CENTS[occasion.occasion_type],
                                      annual_remaining_for_this )
      Report is rejected with ERR_PRIZE_LIMIT_EXCEEDED when prizes_paid_cents > occasion_prize_allowance.
      Three inputs (occasion_type-selected per-occasion cap, annual limit, settled/committed running totals)
      combine via a nested min with a conditional (type-selected) tier — non-linear.
    input_set: "one Occasion (HELD) plus its License running prize totals"
    constants:
      PER_OCCASION_PRIZE_CAP_CENTS: { BINGO: 800000, RAFFLE: 1500000 }
    precision: "integer cents; boundary is inclusive (prizes == allowance is allowed, allowance+1 rejected)"

  - name: proceeds_distribution
    trigger: "computed on FinancialReport create/read; charitable_minimum_cents feeds the submit gate"
    algorithm: waterfall_allocation
    formula: |
      net_proceeds_cents = total_gross_cents - total_prizes_cents - total_expenses_cents
      # Rounding ORDER is pinned: round the two component allowances FIRST, then subtract
      # from net to obtain the charitable minimum (round-components-then-subtract).
      admin_allowance_cents  = round_half_up(net_proceeds_cents * ADMIN_ALLOWANCE_PCT)
      regulatory_fee_cents   = round_half_up(net_proceeds_cents * REGULATORY_FEE_PCT)
      charitable_minimum_cents = net_proceeds_cents - admin_allowance_cents - regulatory_fee_cents
      # NOTE: this pinned order can differ by a cent from the naive
      # round_half_up(net * (1 - ADMIN_ALLOWANCE_PCT - REGULATORY_FEE_PCT)).
      charitable_use_ratio = round(charitable_use_cents / net_proceeds_cents, 4) if net_proceeds_cents > 0 else 0
    input_set: "aggregate over REPORTED occasions of the License within [period_start, period_end] inclusive"
    constants:
      ADMIN_ALLOWANCE_PCT: 0.15
      REGULATORY_FEE_PCT: 0.05
    precision: "whole cents, round_half_up; charitable_use_ratio to 4 decimal places"

  - name: violation_points_rollup
    trigger: "Violation create (MANUAL or AUTO), waive"
    algorithm: aggregation
    formula: |
      Violation.points = POINTS_BY_TYPE[violation_type]
      License.total_violation_points_active = sum(points) over Violations for the license with status == OPEN
      When total_violation_points_active >= SUSPENSION_POINT_THRESHOLD and License.status == ACTIVE,
      the License auto-transitions ACTIVE -> SUSPENDED.
    input_set: "all Violations of one License with status == OPEN"
    constants:
      POINTS_BY_TYPE: { LATE_REPORT: 3, PRIZE_LIMIT_EXCEEDED: 6, UNREGISTERED_EQUIPMENT: 5, PROCEEDS_MISUSE: 10 }
      SUSPENSION_POINT_THRESHOLD: 10
      REPORT_GRACE_DAYS: 7   # a report filed later than scheduled_end + 7 days auto-raises a LATE_REPORT Violation
    precision: "integer points"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of {Regulator, OrgOfficer, Supplier}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is authorized for the operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "Ownership: an entity_backed actor may only act on resources it owns — OrgOfficer's X-User-ID must equal the resource's License.organization_id (directly or via license_id -> organization_id); Supplier's X-User-ID must equal Equipment.supplier_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "OrgOfficer/Supplier write endpoints"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, time ranges ordered (scheduled_end > scheduled_start -> ERR_OCCASION_TIME_INVALID; period_end > period_start -> ERR_REPORT_PERIOD_INVALID; end_date >= start_date -> ERR_ALLOCATION_DATE_INVALID); other malformed input -> ERR_VALIDATION"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_license_version must equal License.version for endpoints that carry it (PATCH /licenses/{id}, POST /renewals)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /licenses/{id}, POST /renewals"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_safety
    check: "Cross-entity gate: license approval requires ELIGIBLE org (ERR_ORG_NOT_ELIGIBLE); occasion hold/report and equipment-allocation create require License.status == ACTIVE (ERR_LICENSE_NOT_ACTIVE)"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /licenses/{id}/approve, POST /occasions/{id}/hold, POST /occasions/{id}/report, POST /equipment-allocations"

  - priority: 9
    category: business_referential
    check: "Equipment/supplier registration integrity: equipment create requires Supplier.status == REGISTERED (ERR_SUPPLIER_NOT_REGISTERED); equipment-allocation create requires Equipment.status == REGISTERED (ERR_EQUIPMENT_NOT_REGISTERED)"
    error_id: ERR_EQUIPMENT_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /equipment, POST /equipment-allocations"

  - priority: 10
    category: business_temporal
    check: "Temporal overlap: an Occasion collides with a non-CANCELLED occasion on the same license (half-open [start,end), adjacency allowed) -> ERR_OCCASION_OVERLAP; an EquipmentAllocation collides with an ACTIVE allocation on the same equipment (closed [start,end] where a strictly-greater-than EQUIPMENT_BUFFER_DAYS=1 day gap is required on each side; a gap of exactly 1 day still conflicts) -> ERR_EQUIPMENT_ALLOCATION_CONFLICT"
    error_id: ERR_OCCASION_OVERLAP
    http_status: 409
    applies_to: "POST /occasions, POST /equipment-allocations"

  - priority: 11
    category: business_fiscal
    check: "Prize/charitable caps: occasion report prizes_paid_cents <= occasion_prize_allowance (ERR_PRIZE_LIMIT_EXCEEDED); financial-report submit charitable_use_cents >= charitable_minimum_cents (ERR_CHARITABLE_MINIMUM_NOT_MET)"
    error_id: ERR_PRIZE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /occasions/{id}/report, POST /financial-reports/{id}/submit"

  - priority: 12
    category: business_constraint
    check: "Reinstatement requires total_violation_points_active < SUSPENSION_POINT_THRESHOLD (ERR_OUTSTANDING_VIOLATIONS); equipment serial_number unique per supplier (ERR_DUPLICATE_SERIAL)"
    error_id: ERR_OUTSTANDING_VIOLATIONS
    http_status: 409
    applies_to: "POST /licenses/{id}/reinstate, POST /equipment"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Organization ---
  - method: POST
    path: "/organizations"
    description: "Register a nonprofit organization"
    roles: [Regulator]
    code: 201
    input: [legal_name, ein, nonprofit_type, incorporation_date, "good_standing?", state_code]
    output: Organization
    side_effects: ["months_active + eligibility_status computed from the current clock"]

  - method: GET
    path: "/organizations/{id}"
    description: "Fetch an organization (recomputes months_active + eligibility_status against the clock)"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: GET
    path: "/organizations/{id}/licenses"
    description: "List licenses belonging to an organization (reverse-reach for License.organization_id)"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: License[]
    side_effects: []

  # --- License ---
  - method: POST
    path: "/licenses"
    description: "Create a DRAFT license application for the acting org"
    roles: [OrgOfficer]
    code: 201
    input: [organization_id, license_type, contact_email, venue_name]
    output: License
    side_effects: ["status=DRAFT; annual_prize_limit_cents set from license_type; prize buckets initialized to 0"]

  - method: GET
    path: "/licenses/{id}"
    description: "Fetch a license with its computed prize buckets and violation points"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licenses/{id}/occasions"
    description: "List occasions for a license (reverse-reach for Occasion.license_id)"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: Occasion[]
    side_effects: []

  - method: GET
    path: "/licenses/{id}/financial-reports"
    description: "List financial reports for a license (reverse-reach for FinancialReport.license_id)"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: FinancialReport[]
    side_effects: []

  - method: GET
    path: "/licenses/{id}/violations"
    description: "List violations for a license (reverse-reach for Violation.license_id)"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: Violation[]
    side_effects: []

  - method: GET
    path: "/licenses/{id}/renewals"
    description: "List renewals for a license (reverse-reach for Renewal.license_id)"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: Renewal[]
    side_effects: []

  - method: PATCH
    path: "/licenses/{id}"
    description: "Update mutable license fields under optimistic concurrency"
    roles: [OrgOfficer]
    code: 200
    input: [expected_license_version, "contact_email?", "venue_name?"]
    output: License
    side_effects: ["stale expected_license_version -> ERR_STALE_VERSION (412)", "increments License.version by 1"]

  - method: POST
    path: "/licenses/{id}/submit"
    description: "Submit a DRAFT license for regulator review"
    roles: [OrgOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/licenses/{id}/approve"
    description: "Approve a SUBMITTED license (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: License
    side_effects: ["status SUBMITTED -> ACTIVE (requires ELIGIBLE org)", "sets effective_date + expiration_date"]

  - method: POST
    path: "/licenses/{id}/suspend"
    description: "Manually suspend an ACTIVE license (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: License
    side_effects: ["status ACTIVE -> SUSPENDED", "CASCADE cancel SCHEDULED occasions -> release prize commit + release their ACTIVE allocations"]

  - method: POST
    path: "/licenses/{id}/reinstate"
    description: "Reinstate a SUSPENDED license (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: License
    side_effects: ["status SUSPENDED -> ACTIVE (requires total_violation_points_active < 10)"]

  # --- Occasion ---
  - method: POST
    path: "/occasions"
    description: "Schedule a gaming occasion under a license"
    roles: [OrgOfficer]
    code: 201
    input: [license_id, occasion_type, scheduled_start, scheduled_end, venue_name, planned_gross_cents, planned_prize_pool_cents, planned_expenses_cents]
    output: Occasion
    side_effects: ["status=SCHEDULED", "License.prize_committed_cents += planned_prize_pool_cents", "rejects on schedule overlap"]

  - method: GET
    path: "/occasions/{id}"
    description: "Fetch an occasion"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: Occasion
    side_effects: []

  - method: GET
    path: "/occasions/{id}/allocations"
    description: "List equipment allocations for an occasion (reverse-reach for EquipmentAllocation.occasion_id)"
    roles: [Regulator, OrgOfficer, Supplier]
    code: 200
    input: []
    output: EquipmentAllocation[]
    side_effects: []

  - method: POST
    path: "/occasions/{id}/hold"
    description: "Mark a SCHEDULED occasion as HELD"
    roles: [OrgOfficer]
    code: 200
    input: []
    output: Occasion
    side_effects: ["status SCHEDULED -> HELD", "net_proceeds_cents = provisional variant", "requires License ACTIVE"]

  - method: POST
    path: "/occasions/{id}/report"
    description: "File the financial report for a HELD occasion"
    roles: [OrgOfficer]
    code: 200
    input: [gross_receipts_cents, prizes_paid_cents, expenses_cents]
    output: Occasion
    side_effects: ["status HELD -> REPORTED", "net_proceeds_cents = final variant", "prize buckets transfer committed->settled", "prizes over allowance -> ERR_PRIZE_LIMIT_EXCEEDED", "late report -> auto LATE_REPORT Violation"]

  - method: POST
    path: "/occasions/{id}/cancel"
    description: "Cancel a SCHEDULED occasion"
    roles: [OrgOfficer]
    code: 200
    input: []
    output: Occasion
    side_effects: ["status SCHEDULED -> CANCELLED", "release prize_committed_cents", "CASCADE release ACTIVE allocations"]

  # --- Supplier ---
  - method: POST
    path: "/suppliers"
    description: "Create a supplier registration (PENDING)"
    roles: [Regulator]
    code: 201
    input: [business_name, state_code]
    output: Supplier
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/suppliers/{id}"
    description: "Fetch a supplier"
    roles: [Regulator, Supplier]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/suppliers/{id}/equipment"
    description: "List equipment for a supplier (reverse-reach for Equipment.supplier_id)"
    roles: [Regulator, Supplier]
    code: 200
    input: []
    output: Equipment[]
    side_effects: []

  - method: POST
    path: "/suppliers/{id}/register"
    description: "Approve a PENDING supplier to REGISTERED (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status PENDING -> REGISTERED"]

  # --- Equipment ---
  - method: POST
    path: "/equipment"
    description: "Register an equipment item under a REGISTERED supplier"
    roles: [Supplier]
    code: 201
    input: [supplier_id, equipment_type, serial_number]
    output: Equipment
    side_effects: ["status=REGISTERED", "requires Supplier REGISTERED", "serial_number unique per supplier"]

  - method: GET
    path: "/equipment/{id}"
    description: "Fetch an equipment item"
    roles: [Regulator, Supplier, OrgOfficer]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: GET
    path: "/equipment/{id}/allocations"
    description: "List allocations for an equipment item (reverse-reach for EquipmentAllocation.equipment_id)"
    roles: [Regulator, Supplier, OrgOfficer]
    code: 200
    input: []
    output: EquipmentAllocation[]
    side_effects: []

  - method: POST
    path: "/equipment/{id}/retire"
    description: "Retire a REGISTERED equipment item (supplier)"
    roles: [Supplier]
    code: 200
    input: []
    output: Equipment
    side_effects: ["status REGISTERED -> RETIRED"]

  # --- EquipmentAllocation ---
  - method: POST
    path: "/equipment-allocations"
    description: "Allocate a REGISTERED equipment item to one of the org's occasions"
    roles: [OrgOfficer]
    code: 201
    input: [equipment_id, occasion_id, start_date, end_date]
    output: EquipmentAllocation
    side_effects: ["status=ACTIVE", "requires License ACTIVE + Equipment REGISTERED", "rejects on equipment buffer overlap"]

  - method: GET
    path: "/equipment-allocations/{id}"
    description: "Fetch an equipment allocation"
    roles: [Regulator, OrgOfficer, Supplier]
    code: 200
    input: []
    output: EquipmentAllocation
    side_effects: []

  - method: POST
    path: "/equipment-allocations/{id}/release"
    description: "Release an ACTIVE equipment allocation"
    roles: [OrgOfficer]
    code: 200
    input: []
    output: EquipmentAllocation
    side_effects: ["status ACTIVE -> RELEASED"]

  # --- FinancialReport ---
  - method: POST
    path: "/financial-reports"
    description: "Create a DRAFT financial report for a reporting period"
    roles: [OrgOfficer]
    code: 201
    input: [license_id, period_start, period_end, charitable_use_cents]
    output: FinancialReport
    side_effects: ["status=DRAFT", "aggregates REPORTED occasions in period; computes net/admin/regulatory/charitable_minimum/ratio"]

  - method: GET
    path: "/financial-reports/{id}"
    description: "Fetch a financial report with computed aggregates"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: FinancialReport
    side_effects: []

  - method: POST
    path: "/financial-reports/{id}/submit"
    description: "Submit a DRAFT financial report (gated on charitable minimum)"
    roles: [OrgOfficer]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status DRAFT -> SUBMITTED", "charitable_use_cents < charitable_minimum_cents -> ERR_CHARITABLE_MINIMUM_NOT_MET"]

  - method: POST
    path: "/financial-reports/{id}/accept"
    description: "Accept a SUBMITTED report after audit (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status SUBMITTED -> ACCEPTED"]

  - method: POST
    path: "/financial-reports/{id}/reject"
    description: "Reject a SUBMITTED report during audit (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status SUBMITTED -> REJECTED"]

  - method: POST
    path: "/financial-reports/{id}/revise"
    description: "Return a REJECTED report to DRAFT for amendment"
    roles: [OrgOfficer]
    code: 200
    input: []
    output: FinancialReport
    side_effects: ["status REJECTED -> DRAFT (cyclic revision loop)"]

  # --- Violation ---
  - method: POST
    path: "/violations"
    description: "Record a violation against a license (regulator)"
    roles: [Regulator]
    code: 201
    input: [license_id, violation_type]
    output: Violation
    side_effects: ["status=OPEN, source=MANUAL", "points assigned from violation_type", "recompute License.total_violation_points_active; may auto-SUSPEND the license (cascade)"]

  - method: GET
    path: "/violations/{id}"
    description: "Fetch a violation"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/violations/{id}/waive"
    description: "Waive an OPEN violation (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: Violation
    side_effects: ["status OPEN -> WAIVED", "recompute License.total_violation_points_active (compensating)"]

  # --- Renewal ---
  - method: POST
    path: "/renewals"
    description: "Request a renewal for a license under optimistic concurrency"
    roles: [OrgOfficer]
    code: 201
    input: [license_id, "requested_term_months?", expected_license_version]
    output: Renewal
    side_effects: ["status=REQUESTED", "supersedes any prior REQUESTED renewal for the license (-> SUPERSEDED)", "stale expected_license_version -> ERR_STALE_VERSION", "increments License.version by 1"]

  - method: GET
    path: "/renewals/{id}"
    description: "Fetch a renewal"
    roles: [Regulator, OrgOfficer]
    code: 200
    input: []
    output: Renewal
    side_effects: []

  - method: POST
    path: "/renewals/{id}/approve"
    description: "Approve a REQUESTED renewal (regulator); extends and may reactivate the license"
    roles: [Regulator]
    code: 200
    input: []
    output: Renewal
    side_effects: ["status REQUESTED -> APPROVED", "License.expiration_date extended by requested_term_months", "EXPIRED license -> ACTIVE"]

  - method: POST
    path: "/renewals/{id}/deny"
    description: "Deny a REQUESTED renewal (regulator)"
    roles: [Regulator]
    code: 200
    input: []
    output: Renewal
    side_effects: ["status REQUESTED -> DENIED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Advancing past a license expiration_date lazily transitions ACTIVE licenses to EXPIRED with the standard cancel cascade."
    roles: [Regulator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced", "ACTIVE licenses past expiration_date -> EXPIRED (cascade cancel SCHEDULED occasions)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not one of the declared roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed actor acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A resource id in the path does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field or invalid enum value" }
  - { id: ERR_OCCASION_TIME_INVALID, http: 422, condition: "Occasion scheduled_end is not strictly after scheduled_start" }
  - { id: ERR_REPORT_PERIOD_INVALID, http: 422, condition: "FinancialReport period_end is not strictly after period_start" }
  - { id: ERR_ALLOCATION_DATE_INVALID, http: 422, condition: "EquipmentAllocation end_date is before start_date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_license_version does not match the current License.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is defined" }
  - { id: ERR_ORG_NOT_ELIGIBLE, http: 409, condition: "License approval attempted while the organization's eligibility_status is INELIGIBLE" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "Occasion hold/report or allocation create attempted while the license is not ACTIVE" }
  - { id: ERR_SUPPLIER_NOT_REGISTERED, http: 409, condition: "Equipment create attempted under a supplier whose status is not REGISTERED" }
  - { id: ERR_EQUIPMENT_NOT_REGISTERED, http: 409, condition: "Equipment-allocation create attempted with equipment whose status is not REGISTERED" }
  - { id: ERR_OCCASION_OVERLAP, http: 409, condition: "New occasion's [start,end) overlaps a non-CANCELLED occasion on the same license" }
  - { id: ERR_EQUIPMENT_ALLOCATION_CONFLICT, http: 409, condition: "New allocation's [start,end] is within EQUIPMENT_BUFFER_DAYS of an ACTIVE allocation on the same equipment" }
  - { id: ERR_PRIZE_LIMIT_EXCEEDED, http: 409, condition: "Reported prizes_paid_cents exceeds occasion_prize_allowance" }
  - { id: ERR_CHARITABLE_MINIMUM_NOT_MET, http: 409, condition: "Financial report submit with charitable_use_cents below charitable_minimum_cents" }
  - { id: ERR_OUTSTANDING_VIOLATIONS, http: 409, condition: "Reinstatement attempted while total_violation_points_active >= SUSPENSION_POINT_THRESHOLD" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "Equipment serial_number already registered for the supplier" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Regulator
    description: "State charitable-gaming commission operator: registers organizations & suppliers, approves/suspends/reinstates licenses, audits financial reports, records/waives violations, decides renewals, controls the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations — register a nonprofit"
      - "POST /licenses/{id}/approve — approve a license"
      - "POST /licenses/{id}/suspend — suspend a license"
      - "POST /licenses/{id}/reinstate — reinstate a license"
      - "POST /suppliers — create a supplier"
      - "POST /suppliers/{id}/register — register a supplier"
      - "POST /financial-reports/{id}/accept — accept an audited report"
      - "POST /financial-reports/{id}/reject — reject an audited report"
      - "POST /violations — record a violation"
      - "POST /violations/{id}/waive — waive a violation"
      - "POST /renewals/{id}/approve — approve a renewal"
      - "POST /renewals/{id}/deny — deny a renewal"
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "GET on organizations, licenses, occasions, suppliers, equipment, allocations, financial-reports, violations, renewals"

  - name: OrgOfficer
    description: "Officer acting on behalf of one nonprofit Organization: manages the org's licenses, occasions, allocations, financial reports and renewal requests"
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /licenses — apply for a license (own org)"
      - "PATCH /licenses/{id} — update mutable license fields (OCC)"
      - "POST /licenses/{id}/submit — submit a license"
      - "POST /occasions — schedule an occasion"
      - "POST /occasions/{id}/hold — hold an occasion"
      - "POST /occasions/{id}/report — file an occasion report"
      - "POST /occasions/{id}/cancel — cancel an occasion"
      - "POST /equipment-allocations — allocate equipment to own occasion"
