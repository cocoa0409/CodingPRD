  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_disburse
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[disburse-stale-contract]"
          - "entities.Contract.fields.version"
        distinguishing_aspect: "Contract.version increments on a successful disburse; a second disburse carrying the pre-disburse version is rejected ERR_STALE_CONTRACT_VERSION (412)."
        test_recipe:
          setup: ["Two approved+authorized claims on the SAME contract so two disburses target one contract; first disburse advances version."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool OCC" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
