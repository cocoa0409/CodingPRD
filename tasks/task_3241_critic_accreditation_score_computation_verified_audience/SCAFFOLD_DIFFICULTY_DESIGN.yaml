              as: Critic
              as_user_id: "${ca}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_INVALID_STATE (state P5), not ERR_DUPLICATE_REVIEW (constraint P10)"

