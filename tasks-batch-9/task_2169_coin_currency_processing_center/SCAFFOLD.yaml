scenario: "desgin task harder than expert level.!!!!2169. Coin & Currency Processing Center (bank cash vault): deposit intake & sealed-bag chain, counting/sorting & discrepancy claim window, fitness sorting & Federal Reserve deposit, counterfeit detection & reporting, provisional credit & final settlement timing, coin order fulfillment & change order, vault inventory & cash-letter reconciliation, customer statement & adjustment dispute"
domain_name: "coin-currency-processing-center"
api_prefix: "/cash-vault"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under
  # /cash-vault; parentage is expressed exclusively through FK fields in request
  # bodies, never through nested creation paths. The only nested GETs are
  # reverse-reachability reads for append-only / cascade-created children
  # (CustodyEvent, FitnessLot, CoinOrderLine, VaultInventory).

  state_machine_shape: parallel
  # SealedBag carries two independent state axes (custody_status x count_status).
  # DiscrepancyClaim and CounterfeitReport are cyclic; DepositTicket, FedDeposit
  # and CoinOrder branch; DepositTicket also auto-transitions (compound) when its
  # last child bag finishes counting.

  relationship_patterns:
    - one_to_many        # DepositTicket -> SealedBag, CountSession -> FitnessLot, CoinOrder -> CoinOrderLine
    - cross_aggregate    # CountSession -> CountingMachine (vault aggregate), FitnessLot -> FedDeposit
    - polymorphic        # DiscrepancyClaim.claim_type selects COUNT_VARIANCE vs STATEMENT_ADJUSTMENT semantics on the same row

  role_model: segregation_of_duties
  # Dual control: the operator who opens a CountSession may not be the verifier
  # who completes it; the manager who approves a CoinOrder may not be the person
  # who releases it; the person who completed the count that produced a variance
  # may not decide the DiscrepancyClaim about it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Vault
    parent: null
    common_fields: true
    fields:
      - name: vault_code
        type: string
        source: input
        description: "Human-readable processing-center code."
        constraints: "Unique across all Vault rows; 1-32 chars."
      - name: name
        type: string
        source: input
        description: "Display name of the processing center."
      - name: posture
        type: enum
        source: system
        description: "Operating posture that gates child operations in this vault."
        default: "OPEN"
        constraints: "OPEN | RESTRICTED | FROZEN. Set at creation to OPEN; changed only by POST /vaults/{id}/posture."
      - name: pickup_concurrency_limit
        type: integer
        source: input
        description: "Maximum number of CoinOrder pickup windows whose CLOSED intervals may cover any single instant."
        default: 2
        constraints: ">= 1"
      - name: cash_letter_adjustment_cents
        type: integer
        source: computed
        description: "Running signed total of FedDeposit.adjustment_cents confirmed against this vault."
        default: 0
      - name: coin_face_value_on_hand_cents
        type: integer
        source: computed
        description: "SUM over this vault's VaultInventory rows of on_hand_boxes * BOX_FACE_VALUE_CENTS[denomination]. Recomputed on every inventory mutation."
        default: 0

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - name: account_number
        type: string
        source: input
        description: "Depositor's demand-deposit account number."
        constraints: "Unique across all CustomerAccount rows."
      - name: customer_name
        type: string
        source: input
        description: "Legal name of the depositing customer."
      - name: tier
        type: enum
        source: input
        description: "Provisional-credit tier that selects the availability haircut."
        default: "STANDARD"
        constraints: "PREMIUM | STANDARD | WATCH"
      - name: status
        type: enum
        source: input
        description: "Account standing. Written only at creation."
        default: "ACTIVE"
        constraints: "ACTIVE | SUSPENDED"
      - name: ledger_balance_cents
        type: integer
        source: computed
        description: "Collected funds. Moves only on DepositTicket settlement and CoinOrder release/return."
        default: 0
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "Uncollected funds extended against tickets currently in PROVISIONAL_CREDITED or SETTLEMENT_READY."
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: "Derived identity: always equals ledger_balance_cents + provisional_credit_cents."
        default: 0
      - name: risk_score
        type: number
        source: computed
        description: "Persisted SETTLED_ONLY variant of customer_risk_grade, 2 decimal places."
        default: 100.00
      - name: risk_grade
        type: enum
        source: computed
        description: "Letter band derived from risk_score."
        default: "A"
        constraints: "A | B | C | D"
      - name: denied_claim_count
        type: integer
        source: computed
        description: "Count of DiscrepancyClaim rows for this account with status == DENIED."
        default: 0
      - name: counterfeit_incident_count
        type: integer
        source: computed
        description: "Count of CounterfeitReport rows with status == SUBMITTED reachable from this account's bags."
        default: 0
      - name: hold_count
        type: integer
        source: computed
        description: "Count of DepositTicket rows for this account that have entered HELD at least once."
        default: 0

  - name: DepositTicket
    parent: null
    common_fields: true
    fields:
      - name: customer_account_id
        type: string
        source: input
        description: "FK -> CustomerAccount.id; the depositor being credited."
      - name: vault_id
        type: string
        source: input
        description: "FK -> Vault.id; the processing center that receives the deposit."
      - name: courier_manifest_number
        type: string
        source: input
        description: "Armored-carrier manifest number covering this drop."
        constraints: "Unique across all DepositTicket rows."
      - name: carrier_courier_user_id
        type: string
        source: system
        description: "X-User-ID of the ArmoredCarrier operator who created the ticket. Opaque operator id, not an entity id."
      - name: declared_bag_count
        type: integer
        source: input
        description: "Number of SealedBag rows the carrier claims belong to this ticket."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Ticket lifecycle state."
        default: "INTAKE"
        constraints: "INTAKE | VERIFIED | PROVISIONAL_CREDITED | HELD | SETTLEMENT_READY | SETTLED"
      - name: declared_total_cents
        type: integer
        source: computed
        description: "SUM of declared_amount_cents over all SealedBag rows with this deposit_ticket_id. Recomputed on every bag create."
        default: 0
      - name: counted_total_cents
        type: integer
        source: computed
        description: "SUM of SealedBag.settlement_amount_cents over bags with count_status IN {COUNTED, ADJUSTED}."
        default: 0
      - name: processing_fee_total_cents
        type: integer
        source: computed
        description: "SUM of already-rounded SealedBag.processing_fee_cents over bags with count_status IN {COUNTED, ADJUSTED}."
        default: 0
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "Amount extended by deposit_credit_amount variant PROVISIONAL; reset to 0 on reversal and on settlement."
        default: 0
      - name: final_settlement_cents
        type: integer
        source: computed
        description: "Amount computed by deposit_credit_amount variant FINAL at settlement."
        default: 0
      - name: settlement_delta_cents
        type: integer
        source: computed
        description: "final_settlement_cents - provisional_credit_cents captured at settlement, signed."
        default: 0
      - name: material_variance_open_count
        type: integer
        source: computed
        description: "Count of this ticket's bags with materiality_flag == true whose count_status is still COUNTED (not yet ADJUSTED by an approved claim and not yet released by a denied claim)."
        default: 0
      - name: hold_reason
        type: string
        source: system
        description: "Free text supplied on POST /deposit-tickets/{id}/hold; null until then."
        default: null

  - name: SealedBag
    parent: null
    common_fields: true
    fields:
      - name: deposit_ticket_id
        type: string
        source: input
        description: "FK -> DepositTicket.id; the intake ticket this bag belongs to."
      - name: seal_number
        type: string
        source: input
        description: "Tamper-evident seal serial applied by the carrier."
        constraints: "Unique across all SealedBag rows."
      - name: bag_type
        type: enum
        source: input
        description: "Contents class, used to select a compatible CountingMachine."
        constraints: "CURRENCY | COIN | MIXED"
      - name: declared_amount_cents
        type: integer
        source: input
        description: "Amount the customer declared on the bag manifest."
        constraints: ">= 0"
      - name: declared_note_count
        type: integer
        source: input
        description: "Notes the customer declared in the bag."
        default: 0
      - name: declared_coin_weight_grams
        type: integer
        source: input
        description: "Coin weight the customer declared in the bag."
        default: 0
      - name: custody_status
        type: enum
        source: system
        description: "Chain-of-custody axis. Advances only through POST /sealed-bags/{id}/custody-events."
        default: "SEALED"
        constraints: "SEALED | IN_TRANSIT | VAULT_RECEIVED | OPENED"
      - name: count_status
        type: enum
        source: system
        description: "Counting axis. Advances only through CountSession transitions and DiscrepancyClaim approval. Evolves independently of custody_status."
        default: "PENDING"
        constraints: "PENDING | COUNTING | COUNTED | ADJUSTED"
      - name: counted_amount_cents
        type: integer
        source: computed
        description: "Amount reported by the COMPLETED CountSession for this bag."
        default: 0
      - name: counted_note_count
        type: integer
        source: computed
        description: "Note count reported by the COMPLETED CountSession for this bag."
        default: 0
      - name: counted_coin_weight_grams
        type: integer
        source: computed
        description: "Coin weight reported by the COMPLETED CountSession for this bag."
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "counted_amount_cents - declared_amount_cents, signed. Frozen at count completion; a later claim adjustment does NOT rewrite it."
        default: 0
      - name: materiality_flag
        type: boolean
        source: computed
        description: "True when abs(variance_cents) >= VARIANCE_MATERIALITY_CENTS at count completion."
        default: false
      - name: processing_fee_cents
        type: integer
        source: computed
        description: "Per-bag fee from bag_processing_fee, already rounded half-up to whole cents."
        default: 0
      - name: seized_amount_cents
        type: integer
        source: computed
        description: "SUM of FitnessLot.face_value_cents for this bag's lots with status == SEIZED."
        default: 0
      - name: claim_adjustment_cents
        type: integer
        source: computed
        description: "Signed credit granted by an APPROVED DiscrepancyClaim on this bag."
        default: 0
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: "counted_amount_cents + claim_adjustment_cents - seized_amount_cents. Recomputed on every one of those three inputs."
        default: 0
      - name: counted_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the CountSession completed. Start of the discrepancy claim window."
        default: null

  - name: CustodyEvent
    parent: null
    common_fields: false
    fields:
      - name: sealed_bag_id
        type: string
        source: input
        description: "FK -> SealedBag.id; the bag whose custody moved."
      - name: event_type
        type: enum
        source: input
        description: "Custody hop being recorded."
        constraints: "PICKUP | TRANSFER | VAULT_RECEIPT | OPEN"
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID of the caller who recorded the hop. Opaque operator id."
      - name: location_code
        type: string
        source: input
        description: "Site code where the hop occurred."
      - name: observed_seal_number
        type: string
        source: input
        description: "Seal serial read off the bag at this hop."
      - name: sequence_no
        type: integer
        source: computed
        description: "1-based position of this event within its bag's chain, ordered by created_at ASC."
      - name: seal_intact
        type: boolean
        source: computed
        description: "True when observed_seal_number == SealedBag.seal_number."

  - name: CountingMachine
    parent: null
    common_fields: true
    fields:
      - name: vault_id
        type: string
        source: input
        description: "FK -> Vault.id; the vault floor the machine sits on."
      - name: machine_code
        type: string
        source: input
        description: "Asset code of the sorter/counter."
        constraints: "Unique across all CountingMachine rows."
      - name: machine_type
        type: enum
        source: input
        description: "Determines which SealedBag.bag_type values the machine may process."
        constraints: "CURRENCY_SORTER | COIN_COUNTER | MIXED_PROCESSOR"
      - name: status
        type: enum
        source: input
        description: "Availability of the machine."
        default: "AVAILABLE"
        constraints: "AVAILABLE | MAINTENANCE"

  - name: CountSession
    parent: null
    common_fields: true
    fields:
      - name: sealed_bag_id
        type: string
        source: input
        description: "FK -> SealedBag.id; the bag being counted."
      - name: counting_machine_id
        type: string
        source: input
        description: "FK -> CountingMachine.id; the machine occupied for the window."
      - name: operator_user_id
        type: string
        source: system
        description: "X-User-ID of the VaultTeller who created the session. Opaque operator id."
      - name: verifier_user_id
        type: string
        source: system
        description: "X-User-ID of the VaultTeller who completed the session. Opaque operator id; null until completion."
        default: null
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the machine occupation."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the declared occupation, before the cleaning buffer is appended."
      - name: status
        type: enum
        source: system
        description: "Session lifecycle state."
        default: "SCHEDULED"
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | SUPERSEDED"
      - name: counted_amount_cents
        type: integer
        source: computed
        description: "Total value read by the machine; written from the complete request body."
        default: 0
      - name: counted_note_count
        type: integer
        source: computed
        description: "Total notes read by the machine; written from the complete request body."
        default: 0
      - name: counted_coin_weight_grams
        type: integer
        source: computed
        description: "Coin weight read by the machine; written from the complete request body."
        default: 0
      - name: seized_face_value_cents
        type: integer
        source: computed
        description: "SUM of face_value_cents over this session's FitnessLot rows with status == SEIZED."
        default: 0
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant recorded when the session reached COMPLETED."
        default: null

  - name: FitnessLot
    parent: null
    common_fields: true
    fields:
      - name: count_session_id
        type: string
        source: input
        description: "FK -> CountSession.id; the session that sorted this lot."
      - name: fed_deposit_id
        type: string
        source: computed
        description: "FK -> FedDeposit.id; set when the lot is attached to a Federal Reserve cash letter, null otherwise."
        default: null
      - name: category
        type: enum
        source: system
        description: "Fitness classification assigned by the sorter."
        constraints: "FIT | UNFIT | COUNTERFEIT_SUSPECT"
      - name: denomination_cents
        type: integer
        source: system
        description: "Face value of one note in this lot, in cents."
      - name: note_count
        type: integer
        source: system
        description: "Number of notes in this lot."
        constraints: ">= 1"
      - name: face_value_cents
        type: integer
        source: computed
        description: "denomination_cents * note_count."
      - name: status
        type: enum
        source: system
        description: "Disposition of the lot. FIT and UNFIT lots start at PENDING_DEPOSIT; COUNTERFEIT_SUSPECT lots start at PENDING_REVIEW."
        constraints: "PENDING_DEPOSIT | PENDING_REVIEW | ATTACHED | DEPOSITED | SEIZED"

  - name: CounterfeitReport
    parent: null
    common_fields: true
    fields:
      - name: fitness_lot_id
        type: string
        source: input
        description: "FK -> FitnessLot.id; the COUNTERFEIT_SUSPECT lot being reported."
      - name: serial_number
        type: string
        source: input
        description: "Serial number recorded on the suspect note batch."
      - name: denomination_cents
        type: integer
        source: input
        description: "Denomination asserted by the filer; must equal FitnessLot.denomination_cents."
      - name: note_count
        type: integer
        source: input
        description: "Note count asserted by the filer; must equal FitnessLot.note_count."
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state."
        default: "DRAFT"
        constraints: "DRAFT | SUBMITTED | ACKNOWLEDGED"
      - name: seized_face_value_cents
        type: integer
        source: computed
        description: "denomination_cents * note_count; the value removed from the bag when the report is submitted."
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent submission; null while DRAFT."
        default: null
      - name: case_number
        type: string
        source: computed
        description: "Secret Service case number supplied on acknowledgement; null until then."
        default: null
      - name: correction_note
        type: string
        source: computed
        description: "Reason recorded when the report was returned for correction; null until then."
        default: null

  - name: DiscrepancyClaim
    parent: null
    common_fields: true
    fields:
      - name: sealed_bag_id
        type: string
        source: input
        description: "FK -> SealedBag.id; the counted bag being disputed."
      - name: customer_account_id
        type: string
        source: computed
        description: "FK -> CustomerAccount.id; copied from the bag's DepositTicket.customer_account_id at filing."
      - name: claim_type
        type: enum
        source: input
        description: "COUNT_VARIANCE disputes the machine count; STATEMENT_ADJUSTMENT disputes a posted settlement adjustment."
        constraints: "COUNT_VARIANCE | STATEMENT_ADJUSTMENT"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount the customer asserts is missing."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state; cycles between SUBMITTED and INFO_REQUESTED."
        default: "SUBMITTED"
        constraints: "SUBMITTED | INFO_REQUESTED | APPROVED | DENIED"
      - name: review_round
        type: integer
        source: computed
        description: "Number of times the claim has entered SUBMITTED. Starts at 1 on filing, incremented by each resubmit."
        default: 1
      - name: resolution_amount_cents
        type: integer
        source: computed
        description: "Amount granted on approval; 0 while open and 0 forever on denial."
        default: 0
      - name: filed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the original filing."
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the VaultManager who approved or denied. Opaque operator id; null while open."
        default: null
      - name: info_request_note
        type: string
        source: computed
        description: "Most recent information request text; null until the first request-info."
        default: null
      - name: denial_reason
        type: string
        source: computed
        description: "Reason recorded on denial; null otherwise."
        default: null

  - name: FedDeposit
    parent: null
    common_fields: true
    fields:
      - name: vault_id
        type: string
        source: input
        description: "FK -> Vault.id; the vault shipping the cash letter."
      - name: cash_letter_number
        type: string
        source: input
        description: "Cash-letter identifier presented to the Federal Reserve."
        constraints: "Unique across all FedDeposit rows."
      - name: deposit_date
        type: string
        source: input
        description: "Calendar date of the shipment, YYYY-MM-DD."
      - name: status
        type: enum
        source: system
        description: "Cash-letter lifecycle state."
        default: "PREPARED"
        constraints: "PREPARED | SUBMITTED | CONFIRMED | CONFIRMED_WITH_ADJUSTMENT"
      - name: declared_total_cents
        type: integer
        source: computed
        description: "SUM of face_value_cents over the FitnessLot rows attached at creation."
        default: 0
      - name: credited_total_cents
        type: integer
        source: computed
        description: "Amount the Federal Reserve confirms; 0 until confirmation."
        default: 0
      - name: adjustment_cents
        type: integer
        source: computed
        description: "credited_total_cents - declared_total_cents, signed; 0 until confirmation."
        default: 0
      - name: attached_lot_count
        type: integer
        source: computed
        description: "Number of FitnessLot rows with fed_deposit_id equal to this row's id."
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of submission; null while PREPARED."
        default: null
      - name: confirmed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of confirmation; null until confirmed."
        default: null

  - name: CoinOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_account_id
        type: string
        source: input
        description: "FK -> CustomerAccount.id; the customer placing the change order."
      - name: vault_id
        type: string
        source: input
        description: "FK -> Vault.id; the vault fulfilling the order."
      - name: pickup_window_start
        type: datetime
        source: input
        description: "Inclusive start of the armored pickup window at the vault."
      - name: pickup_window_end
        type: datetime
        source: input
        description: "Inclusive end of the armored pickup window at the vault."
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state."
        default: "REQUESTED"
        constraints: "REQUESTED | APPROVED_FULL | APPROVED_PARTIAL | REJECTED | RELEASED | RETURNED"
      - name: approved_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the VaultManager who approved. Opaque operator id; null until approval."
        default: null
      - name: released_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the caller who released. Opaque operator id; null until release."
        default: null
      - name: total_boxes_requested
        type: integer
        source: computed
        description: "SUM of boxes_requested over this order's CoinOrderLine rows."
        default: 0
      - name: total_boxes_allocated
        type: integer
        source: computed
        description: "SUM of boxes_allocated over this order's CoinOrderLine rows."
        default: 0
      - name: fill_ratio_pct
        type: number
        source: computed
        description: "100 * total_boxes_allocated / total_boxes_requested, 2 decimal places."
        default: 0
      - name: charge_cents
        type: integer
        source: computed
        description: "SUM of CoinOrderLine.line_face_value_cents; debited from the account at release and credited back at return."
        default: 0
      - name: return_reason
        type: string
        source: computed
        description: "Reason recorded on return; null otherwise."
        default: null

  - name: CoinOrderLine
    parent: null
    common_fields: false
    fields:
      - name: coin_order_id
        type: string
        source: input
        description: "FK -> CoinOrder.id; the order this line belongs to."
      - name: denomination
        type: enum
        source: input
        description: "Coin denomination requested."
        constraints: "PENNY | NICKEL | DIME | QUARTER; at most one line per denomination per order."
      - name: boxes_requested
        type: integer
        source: input
        description: "Standard boxes requested."
        constraints: ">= 1"
      - name: boxes_allocated
        type: integer
        source: computed
        description: "Boxes reserved by coin_order_allocation at approval."
        default: 0
      - name: boxes_returned
        type: integer
        source: computed
        description: "Boxes returned to the vault at return; equals boxes_allocated after a return."
        default: 0
      - name: line_face_value_cents
        type: integer
        source: computed
        description: "boxes_allocated * BOX_FACE_VALUE_CENTS[denomination]."
        default: 0

  - name: VaultInventory
    parent: null
    common_fields: true
    fields:
      - name: vault_id
        type: string
        source: input
        description: "FK -> Vault.id; the vault holding this coin position."
      - name: denomination
        type: enum
        source: input
        description: "Coin denomination of this inventory position."
        constraints: "PENNY | NICKEL | DIME | QUARTER; unique per (vault_id, denomination)."
      - name: on_hand_boxes
        type: integer
        source: computed
        description: "Physical boxes in the vault. Moved by inventory adjustments, CoinOrder release and CoinOrder return."
        default: 0
      - name: reserved_boxes
        type: integer
        source: computed
        description: "Boxes committed to approved but unreleased CoinOrder rows. Never exceeds what approvals reserved; may exceed on_hand_boxes after a shrinkage adjustment."
        default: 0
      - name: available_boxes
        type: integer
        source: computed
        description: "max(on_hand_boxes - reserved_boxes, 0)."
        default: 0

state_machines:
  - entity: Vault
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /vaults/{id}/posture with posture=RESTRICTED"
        actor: VaultManager
        preconditions: ["vault.posture == OPEN"]
        side_effects:
          - "increments Vault.version by 1"
        note: "RESTRICTED blocks CoinOrder release but still permits counting."
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /vaults/{id}/posture with posture=FROZEN"
        actor: VaultManager
        preconditions: ["vault.posture == RESTRICTED"]
        side_effects:
          - "increments Vault.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "POST /vaults/{id}/posture with posture=FROZEN"
        actor: VaultManager
        preconditions: ["vault.posture == OPEN"]
        side_effects:
          - "increments Vault.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /vaults/{id}/posture with posture=OPEN"
        actor: VaultManager
        preconditions: ["vault.posture == FROZEN"]
        side_effects:
          - "increments Vault.version by 1"
        note: "Cyclic: posture may return to OPEN without an intermediate state."
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /vaults/{id}/posture with posture=OPEN"
        actor: VaultManager
        preconditions: ["vault.posture == RESTRICTED"]
        side_effects:
          - "increments Vault.version by 1"

  - entity: DepositTicket
    initial_state: INTAKE
    terminal_states: [SETTLED]
    transitions:
      - from: INTAKE
        to: VERIFIED
        trigger: "POST /deposit-tickets/{id}/verify"
        actor: VaultTeller
        preconditions:
          - "ticket.status == INTAKE"
          - "COUNT of SealedBag rows with deposit_ticket_id == ticket.id equals ticket.declared_bag_count, else ERR_BAG_COUNT_MISMATCH"
          - "every SealedBag row with deposit_ticket_id == ticket.id has custody_status == VAULT_RECEIVED, else ERR_BAG_NOT_RECEIVED"
        side_effects:
          - "recompute DepositTicket.declared_total_cents as SUM of SealedBag.declared_amount_cents"
      - from: VERIFIED
        to: PROVISIONAL_CREDITED
        trigger: "POST /deposit-tickets/{id}/provisional-credit"
        actor: VaultTeller
        preconditions:
          - "ticket.status == VERIFIED"
          - "CustomerAccount.status == ACTIVE, else ERR_ACCOUNT_SUSPENDED"
        side_effects:
          - "run calculation deposit_credit_amount variant PROVISIONAL; write DepositTicket.provisional_credit_cents"
          - "CustomerAccount.provisional_credit_cents += DepositTicket.provisional_credit_cents"
          - "recompute CustomerAccount.available_balance_cents = ledger_balance_cents + provisional_credit_cents"
        note: "Branch A of the VERIFIED fork; branch B is HELD and extends no credit."
      - from: PROVISIONAL_CREDITED
        to: VERIFIED
        trigger: "POST /deposit-tickets/{id}/reverse-provisional-credit"
        actor: VaultManager
        preconditions:
          - "ticket.status == PROVISIONAL_CREDITED"
        side_effects:
          - "CustomerAccount.provisional_credit_cents -= DepositTicket.provisional_credit_cents"
          - "DepositTicket.provisional_credit_cents = 0"
          - "recompute CustomerAccount.available_balance_cents = ledger_balance_cents + provisional_credit_cents"
        note: "Compensating action for the PROVISIONAL credit; conserves customer_available_funds per the compensating invariant."
      - from: VERIFIED
        to: HELD
        trigger: "POST /deposit-tickets/{id}/hold"
        actor: VaultManager
        preconditions:
          - "ticket.status == VERIFIED"
        side_effects:
          - "DepositTicket.hold_reason = request hold_reason"
          - "CustomerAccount.hold_count += 1"
        note: "Branch B of the VERIFIED fork; no credit is extended and no CustomerAccount balance field moves."
      - from: VERIFIED
        to: SETTLEMENT_READY
        trigger: "system: last SealedBag on the ticket reaches count_status COUNTED via POST /count-sessions/{id}/complete"
        actor: system
        preconditions:
          - "every SealedBag row with deposit_ticket_id == ticket.id has count_status IN {COUNTED, ADJUSTED}"
        side_effects:
          - "recompute DepositTicket.counted_total_cents and DepositTicket.processing_fee_total_cents"
      - from: PROVISIONAL_CREDITED
        to: SETTLEMENT_READY
        trigger: "system: last SealedBag on the ticket reaches count_status COUNTED via POST /count-sessions/{id}/complete"
        actor: system
        preconditions:
          - "every SealedBag row with deposit_ticket_id == ticket.id has count_status IN {COUNTED, ADJUSTED}"
        side_effects:
          - "recompute DepositTicket.counted_total_cents and DepositTicket.processing_fee_total_cents"
      - from: HELD
        to: SETTLEMENT_READY
        trigger: "system: last SealedBag on the ticket reaches count_status COUNTED via POST /count-sessions/{id}/complete"
        actor: system
        preconditions:
          - "every SealedBag row with deposit_ticket_id == ticket.id has count_status IN {COUNTED, ADJUSTED}"
        side_effects:
          - "recompute DepositTicket.counted_total_cents and DepositTicket.processing_fee_total_cents"
      - from: SETTLEMENT_READY
        to: SETTLED
        trigger: "POST /deposit-tickets/{id}/settle"
        actor: VaultManager
        preconditions:
          - "ticket.status == SETTLEMENT_READY"
          - "ticket.material_variance_open_count == 0, else ERR_MATERIAL_VARIANCE_UNRESOLVED"
        side_effects:
          - "run calculation deposit_credit_amount variant FINAL; write DepositTicket.final_settlement_cents and DepositTicket.settlement_delta_cents"
          - "CustomerAccount.provisional_credit_cents -= DepositTicket.provisional_credit_cents; DepositTicket.provisional_credit_cents = 0"
          - "CustomerAccount.ledger_balance_cents += DepositTicket.final_settlement_cents"
          - "recompute CustomerAccount.available_balance_cents = ledger_balance_cents + provisional_credit_cents"
          - "run calculation customer_risk_grade variant SETTLED_ONLY; write CustomerAccount.risk_score and CustomerAccount.risk_grade"

  - entity: SealedBag
    initial_state: SEALED
    terminal_states: []
    note: "Two independent axes on one row: custody_status (SEALED->IN_TRANSIT->VAULT_RECEIVED->OPENED) and count_status (PENDING->COUNTING->COUNTED->ADJUSTED). initial_state names the custody axis; the count axis starts at PENDING. Neither axis constrains the other's ordering; only the guards listed below couple them."
    transitions:
      - from: SEALED
        to: IN_TRANSIT
        trigger: "POST /sealed-bags/{id}/custody-events with event_type=PICKUP"
        actor: ArmoredCarrier
        preconditions: ["bag.custody_status == SEALED"]
        side_effects:
          - "append CustodyEvent with sequence_no = prior chain length + 1"
          - "increments SealedBag.version by 1"
      - from: IN_TRANSIT
        to: IN_TRANSIT
        trigger: "POST /sealed-bags/{id}/custody-events with event_type=TRANSFER"
        actor: ArmoredCarrier
        preconditions: ["bag.custody_status == IN_TRANSIT"]
        side_effects:
          - "append CustodyEvent with sequence_no = prior chain length + 1"
          - "increments SealedBag.version by 1"
        note: "Self-loop: any number of TRANSFER hops may be recorded while in transit."
      - from: IN_TRANSIT
        to: VAULT_RECEIVED
        trigger: "POST /sealed-bags/{id}/custody-events with event_type=VAULT_RECEIPT"
        actor: VaultTeller
        preconditions:
          - "bag.custody_status == IN_TRANSIT"
          - "request observed_seal_number == bag.seal_number, else ERR_SEAL_TAMPERED"
        side_effects:
          - "append CustodyEvent with seal_intact = true"
          - "increments SealedBag.version by 1"
      - from: VAULT_RECEIVED
        to: OPENED
        trigger: "POST /sealed-bags/{id}/custody-events with event_type=OPEN"
        actor: VaultTeller
        preconditions:
          - "bag.custody_status == VAULT_RECEIVED"
          - "a CountSession with sealed_bag_id == bag.id exists in status SCHEDULED, else ERR_INVALID_STATE"
        side_effects:
          - "append CustodyEvent"
          - "increments SealedBag.version by 1"
        note: "count_status is untouched by this hop and remains PENDING."
      - from: PENDING
        to: COUNTING
        trigger: "POST /count-sessions/{id}/start"
        actor: VaultTeller
        preconditions:
          - "bag.count_status == PENDING"
          - "bag.custody_status == OPENED, else ERR_BAG_NOT_RECEIVED"
        side_effects:
          - "increments SealedBag.version by 1"
        note: "count axis only; custody_status stays OPENED."
      - from: COUNTING
        to: COUNTED
        trigger: "POST /count-sessions/{id}/complete"
        actor: VaultTeller
        preconditions:
          - "bag.count_status == COUNTING"
        side_effects:
          - "write counted_amount_cents, counted_note_count, counted_coin_weight_grams and counted_at from the session"
          - "variance_cents = counted_amount_cents - declared_amount_cents"
          - "materiality_flag = abs(variance_cents) >= VARIANCE_MATERIALITY_CENTS"
          - "run calculation bag_processing_fee; write SealedBag.processing_fee_cents"
          - "recompute SealedBag.settlement_amount_cents"
          - "if materiality_flag then DepositTicket.material_variance_open_count += 1"
          - "bubble up: recompute DepositTicket.counted_total_cents and DepositTicket.processing_fee_total_cents; if every sibling bag is COUNTED or ADJUSTED the ticket auto-transitions to SETTLEMENT_READY"
          - "increments SealedBag.version by 1"
      - from: COUNTED
        to: ADJUSTED
        trigger: "POST /discrepancy-claims/{id}/approve"
        actor: VaultManager
        preconditions:
          - "bag.count_status == COUNTED"
        side_effects:
          - "claim_adjustment_cents = DiscrepancyClaim.resolution_amount_cents"
          - "recompute SealedBag.settlement_amount_cents"
          - "if materiality_flag then DepositTicket.material_variance_open_count -= 1"
          - "bubble up: recompute DepositTicket.counted_total_cents"
          - "increments SealedBag.version by 1"

  - entity: CountSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /count-sessions/{id}/start"
        actor: VaultTeller
        preconditions:
          - "session.status == SCHEDULED"
          - "SealedBag.custody_status == OPENED, else ERR_BAG_NOT_RECEIVED"
          - "CountingMachine.status == AVAILABLE, else ERR_MACHINE_UNAVAILABLE"
          - "the machine's Vault.posture != FROZEN, else ERR_VAULT_FROZEN"
        side_effects:
          - "SealedBag.count_status PENDING -> COUNTING"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /count-sessions/{id}/complete"
        actor: VaultTeller
        preconditions:
          - "session.status == IN_PROGRESS"
          - "X-User-ID != session.operator_user_id, else ERR_DUAL_CONTROL_VIOLATION"
          - "SUM of request lots[].denomination_cents * lots[].note_count == request counted_amount_cents AND SUM of lots[].note_count == request counted_note_count, else ERR_LOT_TOTAL_MISMATCH"
        side_effects:
          - "verifier_user_id = X-User-ID; completed_at = logical clock now"
          - "create one FitnessLot per request lot; FIT and UNFIT lots get status PENDING_DEPOSIT, COUNTERFEIT_SUSPECT lots get status PENDING_REVIEW"
          - "cascade hop 1: SealedBag.count_status COUNTING -> COUNTED with counted_* fields, variance_cents, materiality_flag and bag_processing_fee written"
          - "cascade hop 2: because the bag became COUNTED, DepositTicket.counted_total_cents and DepositTicket.processing_fee_total_cents are recomputed and material_variance_open_count is incremented when the bag was flagged"
          - "cascade hop 3: because the ticket now has no bag outside {COUNTED, ADJUSTED}, DepositTicket auto-transitions to SETTLEMENT_READY"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system: POST /count-sessions creates a newer session for the same sealed_bag_id"
        actor: system
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "no bag or ticket field changes; the superseded session releases its CountingMachine window"

  - entity: DiscrepancyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /discrepancy-claims/{id}/request-info"
        actor: VaultManager
        preconditions: ["claim.status == SUBMITTED"]
        side_effects:
          - "info_request_note = request info_request_note"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /discrepancy-claims/{id}/resubmit"
        actor: CustomerAccountHolder
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "claim.review_round < MAX_CLAIM_ROUNDS, else ERR_CLAIM_ROUND_LIMIT"
          - "request claimed_amount_cents <= SealedBag.declared_amount_cents, else ERR_CLAIM_AMOUNT_EXCEEDS_DECLARED"
        side_effects:
          - "review_round += 1"
          - "claimed_amount_cents = request claimed_amount_cents"
        note: "Cycle SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded by MAX_CLAIM_ROUNDS."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /discrepancy-claims/{id}/approve"
        actor: VaultManager
        preconditions:
          - "claim.status == SUBMITTED"
          - "X-User-ID != the verifier_user_id of the COMPLETED CountSession whose sealed_bag_id == claim.sealed_bag_id, else ERR_SEGREGATION_OF_DUTIES"
          - "request resolution_amount_cents <= claim.claimed_amount_cents, else ERR_RESOLUTION_EXCEEDS_CLAIM"
        side_effects:
          - "resolution_amount_cents = request value; decided_by_user_id = X-User-ID"
          - "cascade hop 1: SealedBag.claim_adjustment_cents = resolution_amount_cents and count_status COUNTED -> ADJUSTED"
          - "cascade hop 2: because the bag was adjusted, SealedBag.settlement_amount_cents is recomputed and DepositTicket.counted_total_cents is recomputed"
          - "cascade hop 3: because the flagged bag left COUNTED, DepositTicket.material_variance_open_count -= 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /discrepancy-claims/{id}/deny"
        actor: VaultManager
        preconditions:
          - "claim.status == SUBMITTED"
          - "X-User-ID != the verifier_user_id of the COMPLETED CountSession whose sealed_bag_id == claim.sealed_bag_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "denial_reason = request denial_reason; decided_by_user_id = X-User-ID"
          - "CustomerAccount.denied_claim_count += 1"
          - "if the bag has materiality_flag == true then DepositTicket.material_variance_open_count -= 1"
        note: "Denial releases the settlement block without changing any money field on the bag."

  - entity: CounterfeitReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /counterfeit-reports/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "FitnessLot.status == PENDING_REVIEW, else ERR_INVALID_STATE"
          - "report.denomination_cents == FitnessLot.denomination_cents AND report.note_count == FitnessLot.note_count, else ERR_REPORT_LOT_MISMATCH"
        side_effects:
          - "submitted_at = logical clock now"
          - "cascade hop 1: FitnessLot.status PENDING_REVIEW -> SEIZED"
          - "cascade hop 2: because the lot was seized, the lot's CountSession.seized_face_value_cents and the SealedBag.seized_amount_cents both increase by FitnessLot.face_value_cents and SealedBag.settlement_amount_cents is recomputed"
          - "cascade hop 3: because the bag's settlement amount changed, DepositTicket.counted_total_cents is recomputed"
          - "cascade hop 4: because the ticket total changed, CustomerAccount.counterfeit_incident_count += 1 and calculation customer_risk_grade variant SETTLED_ONLY is re-run onto CustomerAccount.risk_score and CustomerAccount.risk_grade"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /counterfeit-reports/{id}/return-for-correction"
        actor: ComplianceOfficer
        preconditions: ["report.status == SUBMITTED"]
        side_effects:
          - "correction_note = request correction_note; submitted_at = null"
          - "FitnessLot.status SEIZED -> PENDING_REVIEW"
          - "SealedBag.seized_amount_cents -= FitnessLot.face_value_cents and CountSession.seized_face_value_cents -= FitnessLot.face_value_cents; SealedBag.settlement_amount_cents and DepositTicket.counted_total_cents recomputed"
          - "CustomerAccount.counterfeit_incident_count -= 1 and calculation customer_risk_grade variant SETTLED_ONLY is re-run"
        note: "Cycle DRAFT -> SUBMITTED -> DRAFT; the compensating side effects restore note-count conservation on the session."
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /counterfeit-reports/{id}/acknowledge"
        actor: ComplianceOfficer
        preconditions: ["report.status == SUBMITTED"]
        side_effects:
          - "case_number = request case_number"

  - entity: FedDeposit
    initial_state: PREPARED
    terminal_states: [CONFIRMED, CONFIRMED_WITH_ADJUSTMENT]
    transitions:
      - from: PREPARED
        to: SUBMITTED
        trigger: "POST /fed-deposits/{id}/submit"
        actor: VaultManager
        preconditions:
          - "deposit.status == PREPARED"
          - "no CounterfeitReport with status == DRAFT exists whose FitnessLot shares a count_session_id with any lot attached to this deposit, else ERR_COUNTERFEIT_REPORT_PENDING"
          - "the vault's posture != FROZEN, else ERR_VAULT_FROZEN"
        side_effects:
          - "submitted_at = logical clock now"
          - "every attached FitnessLot moves ATTACHED -> DEPOSITED"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /fed-deposits/{id}/confirm with credited_total_cents == declared_total_cents"
        actor: FederalReserveAgent
        preconditions: ["deposit.status == SUBMITTED"]
        side_effects:
          - "credited_total_cents = request value; adjustment_cents = 0; confirmed_at = logical clock now"
        note: "Branch with no vault ledger movement."
      - from: SUBMITTED
        to: CONFIRMED_WITH_ADJUSTMENT
        trigger: "POST /fed-deposits/{id}/confirm with credited_total_cents != declared_total_cents"
        actor: FederalReserveAgent
        preconditions: ["deposit.status == SUBMITTED"]
        side_effects:
          - "credited_total_cents = request value; adjustment_cents = credited_total_cents - declared_total_cents; confirmed_at = logical clock now"
          - "Vault.cash_letter_adjustment_cents += adjustment_cents"
        note: "Divergent branch: only this one moves Vault.cash_letter_adjustment_cents."

  - entity: CoinOrder
    initial_state: REQUESTED
    terminal_states: [REJECTED, RETURNED]
    transitions:
      - from: REQUESTED
        to: APPROVED_FULL
        trigger: "POST /coin-orders/{id}/approve when coin_order_allocation yields fill_ratio_pct == 100"
        actor: VaultManager
        preconditions:
          - "order.status == REQUESTED"
          - "CustomerAccount.status == ACTIVE, else ERR_ACCOUNT_SUSPENDED"
        side_effects:
          - "run calculation coin_order_allocation; write CoinOrderLine.boxes_allocated, line_face_value_cents, CoinOrder.total_boxes_allocated, fill_ratio_pct and charge_cents"
          - "VaultInventory.reserved_boxes += boxes_allocated per denomination; recompute available_boxes"
          - "approved_by_user_id = X-User-ID"
          - "increments Vault.version by 1"
      - from: REQUESTED
        to: APPROVED_PARTIAL
        trigger: "POST /coin-orders/{id}/approve with allow_partial=true when 0 < fill_ratio_pct < 100"
        actor: VaultManager
        preconditions:
          - "order.status == REQUESTED"
          - "CustomerAccount.status == ACTIVE, else ERR_ACCOUNT_SUSPENDED"
          - "request allow_partial == true, else ERR_INSUFFICIENT_COIN_INVENTORY"
        side_effects:
          - "run calculation coin_order_allocation; write per-line allocations and order totals"
          - "VaultInventory.reserved_boxes += boxes_allocated per denomination; recompute available_boxes"
          - "approved_by_user_id = X-User-ID"
          - "increments Vault.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /coin-orders/{id}/approve when coin_order_allocation yields total_boxes_allocated == 0"
        actor: VaultManager
        preconditions:
          - "order.status == REQUESTED"
          - "CustomerAccount.status == ACTIVE, else ERR_ACCOUNT_SUSPENDED"
        side_effects:
          - "fill_ratio_pct = 0; charge_cents = 0; no VaultInventory row is touched"
          - "approved_by_user_id = X-User-ID"
          - "increments Vault.version by 1"
        note: "Zero-allocation boundary: an empty allocation is a business outcome (REJECTED), not an error, regardless of allow_partial."
      - from: APPROVED_FULL
        to: RELEASED
        trigger: "POST /coin-orders/{id}/release"
        actor: VaultTeller
        preconditions:
          - "order.status IN {APPROVED_FULL, APPROVED_PARTIAL}"
          - "request expected_vault_version == Vault.version, else ERR_STALE_VERSION"
          - "Vault.posture == OPEN, else ERR_VAULT_RESTRICTED when RESTRICTED and ERR_VAULT_FROZEN when FROZEN"
          - "X-User-ID != order.approved_by_user_id, else ERR_DUAL_CONTROL_VIOLATION"
          - "for every line, VaultInventory.on_hand_boxes >= boxes_allocated, else ERR_INSUFFICIENT_COIN_INVENTORY"
        side_effects:
          - "VaultInventory.on_hand_boxes -= boxes_allocated and reserved_boxes -= boxes_allocated per denomination; recompute available_boxes"
          - "recompute Vault.coin_face_value_on_hand_cents"
          - "CustomerAccount.ledger_balance_cents -= CoinOrder.charge_cents; recompute available_balance_cents"
          - "released_by_user_id = X-User-ID"
          - "increments Vault.version by 1"
      - from: APPROVED_PARTIAL
        to: RELEASED
        trigger: "POST /coin-orders/{id}/release"
        actor: VaultTeller
        preconditions:
          - "order.status IN {APPROVED_FULL, APPROVED_PARTIAL}"
          - "request expected_vault_version == Vault.version, else ERR_STALE_VERSION"
          - "Vault.posture == OPEN, else ERR_VAULT_RESTRICTED when RESTRICTED and ERR_VAULT_FROZEN when FROZEN"
          - "X-User-ID != order.approved_by_user_id, else ERR_DUAL_CONTROL_VIOLATION"
          - "for every line, VaultInventory.on_hand_boxes >= boxes_allocated, else ERR_INSUFFICIENT_COIN_INVENTORY"
        side_effects:
          - "VaultInventory.on_hand_boxes -= boxes_allocated and reserved_boxes -= boxes_allocated per denomination; recompute available_boxes"
          - "recompute Vault.coin_face_value_on_hand_cents"
          - "CustomerAccount.ledger_balance_cents -= CoinOrder.charge_cents; recompute available_balance_cents"
          - "released_by_user_id = X-User-ID"
          - "increments Vault.version by 1"
      - from: RELEASED
        to: RETURNED
        trigger: "POST /coin-orders/{id}/return"
        actor: VaultTeller
        preconditions:
          - "order.status == RELEASED"
        side_effects:
          - "CoinOrderLine.boxes_returned = boxes_allocated for every line"
          - "VaultInventory.on_hand_boxes += boxes_allocated per denomination; reserved_boxes unchanged; recompute available_boxes"
          - "recompute Vault.coin_face_value_on_hand_cents"
          - "CustomerAccount.ledger_balance_cents += CoinOrder.charge_cents; recompute available_balance_cents"
          - "return_reason = request return_reason"
          - "increments Vault.version by 1"
        note: "Compensating action for release; conserves vault_coin_face_value per the compensating invariant."

concurrency_rules:
  - rule_id: count-session-create-stale-bag
    parent_entity: SealedBag
    write_endpoint: "POST /count-sessions"
    occ_field: "expected_sealed_bag_version"
    description: |
      Creating a CountSession for a SealedBag whose version has advanced since
      the client last observed it is rejected. A new session legitimately
      supersedes any prior SCHEDULED session on the same bag, so the write is
      product-valid on its own; the stale-version check is what pins which
      observed bag state the caller was scheduling against.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: coin-order-release-stale-vault
    parent_entity: Vault
    write_endpoint: "POST /coin-orders/{id}/release"
    occ_field: "expected_vault_version"
    description: |
      Releasing coin against a Vault whose version has advanced since the client
      last read it is rejected. Release is legitimate from either approved state,
      so nothing in the order's own state rejects the write; the stale version
      captures that the vault's inventory position has moved under the caller.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: bag_processing_fee
    trigger: "CountSession IN_PROGRESS -> COMPLETED (POST /count-sessions/{id}/complete); writes SealedBag.processing_fee_cents and then DepositTicket.processing_fee_total_cents"
    algorithm: aggregation
    formula: |
      # STEP 1 - per bag, in exact decimal cents (no rounding yet)
      raw_fee_cents =
          BASE_BAG_FEE_CENTS
        + (bag.counted_note_count * PER_NOTE_RATE_MILLICENTS) / 1000
        + (bag.counted_coin_weight_grams / 1000) * PER_KG_COIN_RATE_CENTS
        + (MIXED_HANDLING_SURCHARGE_CENTS if bag.bag_type == "MIXED" else 0)

      # STEP 2 - ROUND PER BAG FIRST. This order is pinned and is NOT
      # interchangeable with summing first: rounding each bag half-up and then
      # summing can exceed the sum-then-round total by one cent per pair of
      # bags whose raw fee ends in exactly .5.
      bag.processing_fee_cents = round_half_up(raw_fee_cents, 0)

      # STEP 3 - SUM THE ALREADY-ROUNDED PER-BAG VALUES
      ticket.processing_fee_total_cents =
          SUM over SealedBag rows with deposit_ticket_id == ticket.id
          AND count_status IN {COUNTED, ADJUSTED}
          of bag.processing_fee_cents
    input_set: "Only SealedBag rows whose count_status is COUNTED or ADJUSTED contribute to the ticket total; PENDING and COUNTING bags contribute nothing."
    constants:
      BASE_BAG_FEE_CENTS: 250
      PER_NOTE_RATE_MILLICENTS: 35
      PER_KG_COIN_RATE_CENTS: 180
      MIXED_HANDLING_SURCHARGE_CENTS: 125
    precision: "Per-bag: whole cents, round_half_up, applied BEFORE summation. The ticket total is an exact integer sum of already-rounded per-bag values and is never re-rounded."

  - name: deposit_credit_amount
    trigger: "variant PROVISIONAL runs on DepositTicket VERIFIED -> PROVISIONAL_CREDITED (POST /deposit-tickets/{id}/provisional-credit); variant FINAL runs on DepositTicket SETTLEMENT_READY -> SETTLED (POST /deposit-tickets/{id}/settle)"
    algorithm: forward_looking
    formula: |
      # ---- variant PROVISIONAL (declared-amount based, availability haircut) ----
      declared_total_cents =
          SUM over SealedBag rows with deposit_ticket_id == ticket.id
          AND custody_status == VAULT_RECEIVED OR custody_status == OPENED
          of bag.declared_amount_cents
      haircut_pct = HAIRCUT_PCT_BY_TIER[CustomerAccount.tier]
      ticket.provisional_credit_cents =
          min( round_half_up(declared_total_cents * (1 - haircut_pct), 0),
               PROVISIONAL_CREDIT_CAP_CENTS )

      # ---- variant FINAL (counted-amount based, tiered fee discount) ----
      # STEP 1
      gross_counted_cents =
          SUM over SealedBag rows with deposit_ticket_id == ticket.id
          AND count_status IN {COUNTED, ADJUSTED}
          of bag.settlement_amount_cents
      # STEP 2 - the volume tier is keyed on the STEP 1 gross value, NOT on the
      # post-fee net and NOT on the declared total. This pins the evaluation
      # order of the otherwise circular-looking pair (fee reduces the total, the
      # total selects the fee's discount).
      if   gross_counted_cents >= VOLUME_TIER_2_CENTS: discount_pct = VOLUME_DISCOUNT_2_PCT
      elif gross_counted_cents >= VOLUME_TIER_1_CENTS: discount_pct = VOLUME_DISCOUNT_1_PCT
      else:                                            discount_pct = 0.00
      # STEP 3
      fee_final_cents = round_half_up(ticket.processing_fee_total_cents * (1 - discount_pct), 0)
      # STEP 4
      ticket.final_settlement_cents = gross_counted_cents - fee_final_cents
      # STEP 5
      ticket.settlement_delta_cents = ticket.final_settlement_cents - ticket.provisional_credit_cents
    input_set: "PROVISIONAL reads declared_amount_cents from bags already in the vault (custody_status VAULT_RECEIVED or OPENED) and ignores every counted field. FINAL reads settlement_amount_cents (counted + claim adjustment - seizures) from bags with count_status COUNTED or ADJUSTED and ignores every declared field."
    constants:
      HAIRCUT_PCT_BY_TIER: { PREMIUM: 0.00, STANDARD: 0.02, WATCH: 0.05 }
      PROVISIONAL_CREDIT_CAP_CENTS: 5000000
      VOLUME_TIER_1_CENTS: 2500000
      VOLUME_TIER_2_CENTS: 10000000
      VOLUME_DISCOUNT_1_PCT: 0.10
      VOLUME_DISCOUNT_2_PCT: 0.20
    precision: "2 decimal places at the cents level; round_half_up applied once at STEP 3 for the fee and once for the provisional amount. Tier comparisons use >= (a gross of exactly VOLUME_TIER_1_CENTS selects VOLUME_DISCOUNT_1_PCT)."
    variants:
      - name: PROVISIONAL
        when: "Extended at POST /deposit-tickets/{id}/provisional-credit, before any bag has been counted."
        difference: "Uses declared amounts with a tier haircut and a hard cap; no fee is deducted and no seizure or claim adjustment is visible yet."
      - name: FINAL
        when: "Computed at POST /deposit-tickets/{id}/settle, after every bag is COUNTED or ADJUSTED."
        difference: "Uses counted settlement amounts, subtracts the volume-discounted processing fee, and applies no haircut or cap; for identical bag data it lands on a different number than PROVISIONAL, and the signed gap is stored as settlement_delta_cents."

  - name: customer_risk_grade
    trigger: "variant SETTLED_ONLY runs on DepositTicket SETTLEMENT_READY -> SETTLED and on CounterfeitReport DRAFT -> SUBMITTED and SUBMITTED -> DRAFT, writing CustomerAccount.risk_score and CustomerAccount.risk_grade; variant POINT_IN_TIME runs on GET /customer-accounts/{id}/statement and is never persisted"
    algorithm: weighted_scoring
    formula: |
      total_declared_cents     = SUM of DepositTicket.declared_total_cents over the input set
      total_abs_variance_cents = SUM of abs(SealedBag.variance_cents) over every bag of every
                                 ticket in the input set whose count_status IN {COUNTED, ADJUSTED}
      if total_declared_cents == 0:
          variance_ratio_pct = 0.00
      else:
          variance_ratio_pct = round_half_up(100 * total_abs_variance_cents / total_declared_cents, 2)

      raw_score = 100
                - VARIANCE_WEIGHT   * variance_ratio_pct
                - COUNTERFEIT_WEIGHT * counterfeit_count
                - CLAIM_WEIGHT       * denied_claim_count
      risk_score = round_half_up( max(SCORE_FLOOR, min(SCORE_CEILING, raw_score)), 2 )

      if   risk_score >= GRADE_A_MIN: risk_grade = "A"
      elif risk_score >= GRADE_B_MIN: risk_grade = "B"
      elif risk_score >= GRADE_C_MIN: risk_grade = "C"
      else:                           risk_grade = "D"
    input_set: "SETTLED_ONLY: the ticket input set is DepositTicket rows for this customer_account_id with status == SETTLED, and counterfeit_count = CustomerAccount.counterfeit_incident_count (SUBMITTED reports only). POINT_IN_TIME: the ticket input set is DepositTicket rows for this customer_account_id with status IN {VERIFIED, PROVISIONAL_CREDITED, HELD, SETTLEMENT_READY, SETTLED}, and counterfeit_count = CustomerAccount.counterfeit_incident_count + COUNT of CounterfeitReport rows with status == DRAFT whose FitnessLot is reachable from this account's bags. denied_claim_count is CustomerAccount.denied_claim_count in both variants."
    constants:
      VARIANCE_WEIGHT: 1.5
      COUNTERFEIT_WEIGHT: 8
      CLAIM_WEIGHT: 3
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      GRADE_A_MIN: 80
      GRADE_B_MIN: 60
      GRADE_C_MIN: 40
    precision: "risk_score to 2 decimal places, round_half_up; variance_ratio_pct rounded to 2 decimal places BEFORE it is multiplied by VARIANCE_WEIGHT."
    variants:
      - name: SETTLED_ONLY
        when: "Persisted onto CustomerAccount.risk_score / risk_grade whenever a ticket settles or a counterfeit report changes submission state."
        difference: "Chronologically closed view: only SETTLED tickets and only SUBMITTED counterfeit reports enter the input set, so in-flight variance and unsent drafts are invisible."
      - name: POINT_IN_TIME
        when: "Returned as projected_risk_score / projected_risk_grade by GET /customer-accounts/{id}/statement."
        difference: "Forward-looking view: open tickets from VERIFIED onward and DRAFT counterfeit reports are also counted, so for identical stored data it yields a lower score and can land in a different grade band than the persisted SETTLED_ONLY value."

  - name: coin_order_allocation
    trigger: "CoinOrder REQUESTED -> {APPROVED_FULL, APPROVED_PARTIAL, REJECTED} (POST /coin-orders/{id}/approve)"
    algorithm: waterfall_allocation
    formula: |
      # Lines are processed in ascending COIN_VALUE_CENTS order:
      # PENNY(1) -> NICKEL(5) -> DIME(10) -> QUARTER(25).
      # At most one line per denomination exists per order, so the sort key is
      # total and no tie-break is reachable.
      for line in order.lines sorted by COIN_VALUE_CENTS[line.denomination] ASC:
          inv = VaultInventory row with (vault_id == order.vault_id,
                                         denomination == line.denomination)
          available = 0 if inv is missing else max(inv.on_hand_boxes - inv.reserved_boxes, 0)
          line.boxes_allocated = min(line.boxes_requested, available)
          line.line_face_value_cents = line.boxes_allocated * BOX_FACE_VALUE_CENTS[line.denomination]
          if inv exists: inv.reserved_boxes += line.boxes_allocated

      order.total_boxes_requested = SUM of line.boxes_requested
      order.total_boxes_allocated = SUM of line.boxes_allocated
      order.fill_ratio_pct = round_half_up(100 * total_boxes_allocated / total_boxes_requested, 2)
      order.charge_cents   = SUM of line.line_face_value_cents

      if   total_boxes_allocated == 0                 : status = REJECTED
      elif order.fill_ratio_pct == 100.00             : status = APPROVED_FULL
      elif request.allow_partial == true              : status = APPROVED_PARTIAL
      else                                            : reject with ERR_INSUFFICIENT_COIN_INVENTORY
    input_set: "Only VaultInventory rows belonging to order.vault_id participate. A denomination with no VaultInventory row for that vault contributes available = 0 and allocates nothing; it is not an error."
    constants:
      COIN_VALUE_CENTS: { PENNY: 1, NICKEL: 5, DIME: 10, QUARTER: 25 }
      BOX_FACE_VALUE_CENTS: { PENNY: 2500, NICKEL: 10000, DIME: 25000, QUARTER: 50000 }
    precision: "Box counts are integers; fill_ratio_pct to 2 decimal places, round_half_up. Allocation is sequential and each line's reservation is visible to the next line in the same run."

  - name: fed_deposit_credit
    trigger: "FedDeposit SUBMITTED -> {CONFIRMED, CONFIRMED_WITH_ADJUSTMENT} (POST /fed-deposits/{id}/confirm)"
    algorithm: threshold
    formula: |
      # declared_total_cents was frozen at creation:
      #   deposit.declared_total_cents = SUM of FitnessLot.face_value_cents
      #   over the lots named in the create request
      deposit.adjustment_cents = request.credited_total_cents - deposit.declared_total_cents
      deposit.credited_total_cents = request.credited_total_cents
      if deposit.adjustment_cents == 0:
          deposit.status = CONFIRMED
      else:
          deposit.status = CONFIRMED_WITH_ADJUSTMENT
          Vault.cash_letter_adjustment_cents += deposit.adjustment_cents
    input_set: "Attachment eligibility at creation: FitnessLot rows with category IN {FIT, UNFIT} AND status == PENDING_DEPOSIT AND whose CountSession's CountingMachine.vault_id == deposit.vault_id. A COUNTERFEIT_SUSPECT lot, an already-ATTACHED lot, or a lot from another vault is rejected; an empty eligible list is ERR_NO_ELIGIBLE_LOTS."
    constants: {}
    precision: "Whole cents; adjustment_cents is signed and is the only value that moves Vault.cash_letter_adjustment_cents."

  - name: cash_letter_reconciliation
    trigger: "GET /vaults/{id}/cash-letter-reconciliation (read-only computed projection; persists nothing)"
    algorithm: aggregation
    formula: |
      shipped_total_cents     = SUM of FedDeposit.declared_total_cents  for rows with vault_id == vault.id
                                AND status IN {SUBMITTED, CONFIRMED, CONFIRMED_WITH_ADJUSTMENT}
      credited_total_cents    = SUM of FedDeposit.credited_total_cents  for rows with vault_id == vault.id
                                AND status IN {CONFIRMED, CONFIRMED_WITH_ADJUSTMENT}
      outstanding_cents       = SUM of FedDeposit.declared_total_cents  for rows with vault_id == vault.id
                                AND status == SUBMITTED
      net_adjustment_cents    = SUM of FedDeposit.adjustment_cents      for rows with vault_id == vault.id
                                AND status == CONFIRMED_WITH_ADJUSTMENT
      reconciled              = (outstanding_cents == 0)
                                AND (net_adjustment_cents == vault.cash_letter_adjustment_cents)
    input_set: "PREPARED cash letters are excluded from every total because nothing has left the vault yet."
    constants: {}
    precision: "Whole cents; no rounding occurs."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 10
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 15
    category: business_constraint
    check: "request body/query shape: required fields present, types correct, enum members recognized, integers non-negative where constrained, pagination limit within [1,100] and offset >= 0, window_end strictly after window_start, pickup_window_end strictly after pickup_window_start, coin-order lines array non-empty, count-complete lots array non-empty. fitness_lot_ids is exempt: an empty cash-letter lot list is ERR_NO_ELIGIBLE_LOTS at priority 70, not ERR_INVALID_REQUEST."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 20
    category: existence
    check: "every id embedded in the path resolves, evaluated left to right"
    error_id: "ERR_VAULT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_BAG_NOT_FOUND | ERR_MACHINE_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_FED_DEPOSIT_NOT_FOUND | ERR_COIN_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 25
    category: existence
    check: "every foreign-key id in the request body resolves, evaluated in the field order declared by the endpoint's input list"
    error_id: "ERR_VAULT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_BAG_NOT_FOUND | ERR_MACHINE_NOT_FOUND | ERR_LOT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /deposit-tickets, POST /sealed-bags, POST /counting-machines, POST /count-sessions, POST /counterfeit-reports, POST /discrepancy-claims, POST /fed-deposits, POST /coin-orders"
  - priority: 30
    category: auth
    check: "when the caller's role is CustomerAccountHolder, X-User-ID equals the CustomerAccount.id reachable from the target resource (CoinOrder.customer_account_id, DiscrepancyClaim.customer_account_id, DepositTicket.customer_account_id, or SealedBag -> DepositTicket.customer_account_id)"
    error_id: ERR_ACCOUNT_OWNERSHIP
    http_status: 403
    applies_to: "GET /customer-accounts/{id}, GET /customer-accounts/{id}/statement, GET /deposit-tickets/{id}, GET /sealed-bags/{id}, POST /discrepancy-claims, POST /discrepancy-claims/{id}/resubmit, GET /discrepancy-claims/{id}, POST /coin-orders, GET /coin-orders/{id}, GET /coin-orders/{id}/lines"
  - priority: 35
    category: state
    check: "the OCC field in the request body equals the parent entity's current version (expected_sealed_bag_version against SealedBag.version; expected_vault_version against Vault.version)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /count-sessions, POST /coin-orders/{id}/release"
  - priority: 40
    category: state
    check: "the target entity is in a from-state that declares this transition in the state machine table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 42
    category: state
    check: "SealedBag.custody_status satisfies the transition's custody precondition (VAULT_RECEIVED for count-session creation, OPENED for session start, and every bag on a ticket at VAULT_RECEIVED or later for ticket verification)"
    error_id: ERR_BAG_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /count-sessions, POST /count-sessions/{id}/start, POST /deposit-tickets/{id}/verify"
  - priority: 43
    category: state
    check: "the number of SealedBag rows on the ticket equals DepositTicket.declared_bag_count"
    error_id: ERR_BAG_COUNT_MISMATCH
    http_status: 409
    applies_to: "POST /deposit-tickets/{id}/verify"
  - priority: 44
    category: state
    check: "SealedBag.count_status is COUNTED or ADJUSTED before a discrepancy claim may be filed against it"
    error_id: ERR_BAG_NOT_COUNTED
    http_status: 409
    applies_to: "POST /discrepancy-claims"
  - priority: 46
    category: state
    check: "the Vault reached from the target resource has posture != FROZEN"
    error_id: ERR_VAULT_FROZEN
    http_status: 409
    applies_to: "POST /count-sessions/{id}/start, POST /fed-deposits/{id}/submit, POST /coin-orders/{id}/release"
  - priority: 47
    category: state
    check: "the Vault reached from the target resource has posture == OPEN when coin is being physically released"
    error_id: ERR_VAULT_RESTRICTED
    http_status: 409
    applies_to: "POST /coin-orders/{id}/release"
  - priority: 48
    category: state
    check: "the CountingMachine bound to the session has status == AVAILABLE"
    error_id: ERR_MACHINE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /count-sessions/{id}/start"
  - priority: 50
    category: business_safety
    check: "dual control: X-User-ID differs from the counterpart operator recorded on the resource (CountSession.operator_user_id when completing a session; CoinOrder.approved_by_user_id when releasing an order)"
    error_id: ERR_DUAL_CONTROL_VIOLATION
    http_status: 409
    applies_to: "POST /count-sessions/{id}/complete, POST /coin-orders/{id}/release"
  - priority: 52
    category: business_safety
    check: "segregation of duties: the VaultManager deciding a DiscrepancyClaim is not the verifier_user_id of the COMPLETED CountSession that produced the disputed count"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /discrepancy-claims/{id}/approve, POST /discrepancy-claims/{id}/deny"
  - priority: 54
    category: business_safety
    check: "no CounterfeitReport with status == DRAFT exists on a FitnessLot sharing a count_session_id with any lot attached to the cash letter"
    error_id: ERR_COUNTERFEIT_REPORT_PENDING
    http_status: 409
    applies_to: "POST /fed-deposits/{id}/submit"
  - priority: 56
    category: business_referential
    check: "the CountingMachine's machine_type accepts the SealedBag's bag_type (CURRENCY_SORTER accepts CURRENCY; COIN_COUNTER accepts COIN; MIXED_PROCESSOR accepts CURRENCY, COIN and MIXED)"
    error_id: ERR_MACHINE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /count-sessions"
  - priority: 57
    category: business_referential
    check: "the CounterfeitReport's denomination_cents and note_count match the referenced FitnessLot exactly"
    error_id: ERR_REPORT_LOT_MISMATCH
    http_status: 422
    applies_to: "POST /counterfeit-reports/{id}/submit"
  - priority: 58
    category: business_referential
    check: "every FitnessLot named in the cash-letter create request has category IN {FIT, UNFIT} and status == PENDING_DEPOSIT"
    error_id: ERR_LOT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /fed-deposits"
  - priority: 59
    category: business_referential
    check: "every FitnessLot named in the cash-letter create request belongs to a CountSession whose CountingMachine.vault_id equals the request vault_id"
    error_id: ERR_LOT_VAULT_MISMATCH
    http_status: 422
    applies_to: "POST /fed-deposits"
  - priority: 60
    category: business_constraint
    check: "machine occupancy: the requested window, extended by MACHINE_CLEANING_BUFFER_MINUTES on its end, must not intersect the identically extended half-open window of any CountSession on the same counting_machine_id with status IN {SCHEDULED, IN_PROGRESS}"
    error_id: ERR_MACHINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /count-sessions"
  - priority: 61
    category: business_temporal
    check: "window_start is greater than or equal to the logical clock's current instant"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /count-sessions"
  - priority: 62
    category: business_constraint
    check: "vault pickup capacity: no instant inside the requested CLOSED pickup interval may already be covered by pickup_concurrency_limit or more CoinOrder rows on the same vault with status IN {REQUESTED, APPROVED_FULL, APPROVED_PARTIAL}"
    error_id: ERR_PICKUP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /coin-orders"
  - priority: 63
    category: business_constraint
    check: "at most one CoinOrderLine per denomination within a single order"
    error_id: ERR_DUPLICATE_DENOMINATION
    http_status: 422
    applies_to: "POST /coin-orders"
  - priority: 64
    category: business_temporal
    check: "the logical clock's current instant is strictly before SealedBag.counted_at + CLAIM_WINDOW_HOURS (half-open window; filing exactly at the boundary is rejected)"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /discrepancy-claims"
  - priority: 66
    category: business_constraint
    check: "DiscrepancyClaim.review_round is strictly less than MAX_CLAIM_ROUNDS before a resubmit is accepted"
    error_id: ERR_CLAIM_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /discrepancy-claims/{id}/resubmit"
  - priority: 67
    category: business_constraint
    check: "seal_number is not already used by another SealedBag"
    error_id: ERR_DUPLICATE_SEAL
    http_status: 409
    applies_to: "POST /sealed-bags"
  - priority: 68
    category: business_constraint
    check: "unique business identifiers do not collide: Vault.vault_code, CustomerAccount.account_number, DepositTicket.courier_manifest_number, CountingMachine.machine_code, FedDeposit.cash_letter_number"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /vaults, POST /customer-accounts, POST /deposit-tickets, POST /counting-machines, POST /fed-deposits"
  - priority: 69
    category: business_constraint
    check: "the observed seal read at a VAULT_RECEIPT hop equals SealedBag.seal_number"
    error_id: ERR_SEAL_TAMPERED
    http_status: 409
    applies_to: "POST /sealed-bags/{id}/custody-events"
  - priority: 70
    category: business_constraint
    check: "the fitness_lot_ids array is non-empty after eligibility filtering"
    error_id: ERR_NO_ELIGIBLE_LOTS
    http_status: 422
    applies_to: "POST /fed-deposits"
  - priority: 71
    category: business_constraint
    check: "the lots array reconciles with the reported totals: SUM(lots[].denomination_cents * lots[].note_count) == counted_amount_cents AND SUM(lots[].note_count) == counted_note_count"
    error_id: ERR_LOT_TOTAL_MISMATCH
    http_status: 422
    applies_to: "POST /count-sessions/{id}/complete"
  - priority: 74
    category: business_fiscal
    check: "DepositTicket.material_variance_open_count is 0 before the ticket may settle"
    error_id: ERR_MATERIAL_VARIANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /deposit-tickets/{id}/settle"
  - priority: 76
    category: business_fiscal
    check: "CustomerAccount.status is ACTIVE"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /deposit-tickets/{id}/provisional-credit, POST /coin-orders/{id}/approve"
  - priority: 78
    category: business_fiscal
    check: "coin inventory sufficiency: at approval with allow_partial == false the allocation must reach fill_ratio_pct == 100 whenever total_boxes_allocated > 0; at release every line's VaultInventory.on_hand_boxes must be at least boxes_allocated"
    error_id: ERR_INSUFFICIENT_COIN_INVENTORY
    http_status: 409
    applies_to: "POST /coin-orders/{id}/approve, POST /coin-orders/{id}/release"
  - priority: 80
    category: business_fiscal
    check: "an inventory adjustment may not drive VaultInventory.on_hand_boxes below 0"
    error_id: ERR_INVENTORY_NEGATIVE
    http_status: 422
    applies_to: "POST /vaults/{id}/inventory-adjustments"
  - priority: 82
    category: business_fiscal
    check: "claimed_amount_cents does not exceed SealedBag.declared_amount_cents"
    error_id: ERR_CLAIM_AMOUNT_EXCEEDS_DECLARED
    http_status: 422
    applies_to: "POST /discrepancy-claims, POST /discrepancy-claims/{id}/resubmit"
  - priority: 84
    category: business_fiscal
    check: "resolution_amount_cents does not exceed DiscrepancyClaim.claimed_amount_cents"
    error_id: ERR_RESOLUTION_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /discrepancy-claims/{id}/approve"

global_constants:
  VARIANCE_MATERIALITY_CENTS: 2500
  CLAIM_WINDOW_HOURS: 24
  MAX_CLAIM_ROUNDS: 3
  MACHINE_CLEANING_BUFFER_MINUTES: 15
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

endpoints:
  # ---- logical clock (test-driving; §1.5 ladder rung 3) ----
  - method: POST
    path: "/cash-vault/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every deadline, window and counted_at stamp in this API reads from this clock."
    roles: [VaultManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["no entity is mutated; subsequent timestamps and window checks read the new instant"]

  # ---- Vault ----
  - method: POST
    path: "/cash-vault/vaults"
    description: "Register a processing-center vault."
    roles: [VaultManager]
    code: 201
    input: [vault_code, name, "pickup_concurrency_limit?"]
    output: Vault
    side_effects: ["Vault created with posture OPEN, version 1, cash_letter_adjustment_cents 0 and coin_face_value_on_hand_cents 0"]
  - method: GET
    path: "/cash-vault/vaults/{id}"
    description: "Read one vault, including its current posture and version."
    roles: [VaultManager, VaultTeller, ComplianceOfficer, FederalReserveAgent]
    code: 200
    input: []
    output: Vault
    side_effects: []
  - method: POST
    path: "/cash-vault/vaults/{id}/posture"
    description: "Move the vault posture between OPEN, RESTRICTED and FROZEN."
    roles: [VaultManager]
    code: 200
    input: [posture]
    output: Vault
    side_effects: ["Vault.posture updated", "increments Vault.version by 1"]
  - method: POST
    path: "/cash-vault/vaults/{id}/inventory-adjustments"
    description: "Apply a signed box delta to one coin denomination's inventory position, creating the VaultInventory row on first use. This is the operator surface used for opening balances, armored replenishment and shrinkage write-downs."
    roles: [VaultManager]
    code: 200
    input: [denomination, delta_boxes]
    output: VaultInventory
    side_effects:
      - "VaultInventory row upserted for (vault_id, denomination); on_hand_boxes += delta_boxes; available_boxes recomputed as max(on_hand_boxes - reserved_boxes, 0)"
      - "recompute Vault.coin_face_value_on_hand_cents"
      - "increments Vault.version by 1"
  - method: GET
    path: "/cash-vault/vaults/{id}/inventory"
    description: "List the coin inventory positions held by this vault."
    roles: [VaultManager, VaultTeller]
    code: 200
    input: ["denomination?", "limit?", "offset?"]
    output: VaultInventory[]
    side_effects: []
  - method: GET
    path: "/cash-vault/vaults/{id}/cash-letter-reconciliation"
    description: "Computed reconciliation of this vault's Federal Reserve cash letters against confirmed credits."
    roles: [VaultManager]
    code: 200
    input: []
    output: { vault_id: string, shipped_total_cents: integer, credited_total_cents: integer, outstanding_cents: integer, net_adjustment_cents: integer, reconciled: boolean }
    side_effects: []

  # ---- CustomerAccount ----
  - method: POST
    path: "/cash-vault/customer-accounts"
    description: "Open a depositor account."
    roles: [VaultManager]
    code: 201
    input: [account_number, customer_name, "tier?", "status?"]
    output: CustomerAccount
    side_effects: ["CustomerAccount created with all balance fields 0, risk_score 100.00 and risk_grade A"]
  - method: GET
    path: "/cash-vault/customer-accounts/{id}"
    description: "Read one depositor account with its persisted balances and SETTLED_ONLY risk grade."
    roles: [VaultManager, VaultTeller, CustomerAccountHolder]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: GET
    path: "/cash-vault/customer-accounts/{id}/statement"
    description: "Customer statement: persisted balances plus the POINT_IN_TIME variant of customer_risk_grade, which is computed on read and never stored."
    roles: [VaultManager, CustomerAccountHolder]
    code: 200
    input: []
    output: { customer_account_id: string, ledger_balance_cents: integer, provisional_credit_cents: integer, available_balance_cents: integer, risk_score: number, risk_grade: string, projected_risk_score: number, projected_risk_grade: string, open_ticket_count: integer, settled_ticket_count: integer, open_claim_count: integer }
    side_effects: []

  # ---- DepositTicket ----
  - method: POST
    path: "/cash-vault/deposit-tickets"
    description: "Open an intake ticket for an armored drop."
    roles: [ArmoredCarrier]
    code: 201
    input: [customer_account_id, vault_id, courier_manifest_number, declared_bag_count]
    output: DepositTicket
    side_effects: ["DepositTicket created in INTAKE with carrier_courier_user_id set from X-User-ID"]
  - method: GET
    path: "/cash-vault/deposit-tickets/{id}"
    description: "Read one deposit ticket."
    roles: [VaultManager, VaultTeller, ArmoredCarrier, CustomerAccountHolder]
    code: 200
    input: []
    output: DepositTicket
    side_effects: []
  - method: GET
    path: "/cash-vault/deposit-tickets"
    description: "List deposit tickets, filterable by depositor, vault and lifecycle state."
    roles: [VaultManager, VaultTeller, CustomerAccountHolder]
    code: 200
    input: ["customer_account_id?", "vault_id?", "status?", "limit?", "offset?"]
    output: DepositTicket[]
    side_effects: []
  - method: POST
    path: "/cash-vault/deposit-tickets/{id}/verify"
    description: "Verify the drop: bag count matches the manifest and every bag is physically in the vault."
    roles: [VaultTeller]
    code: 200
    input: []
    output: DepositTicket
    side_effects: ["status INTAKE -> VERIFIED", "recompute DepositTicket.declared_total_cents"]
  - method: POST
    path: "/cash-vault/deposit-tickets/{id}/provisional-credit"
    description: "Extend provisional (uncollected) credit using deposit_credit_amount variant PROVISIONAL."
    roles: [VaultTeller]
    code: 200
    input: []
    output: DepositTicket
    side_effects:
      - "status VERIFIED -> PROVISIONAL_CREDITED"
      - "write DepositTicket.provisional_credit_cents from deposit_credit_amount variant PROVISIONAL"
      - "CustomerAccount.provisional_credit_cents and available_balance_cents increase by the same amount"
  - method: POST
    path: "/cash-vault/deposit-tickets/{id}/reverse-provisional-credit"
    description: "Withdraw provisional credit already extended on this ticket. Compensating action for provisional-credit."
    roles: [VaultManager]
    code: 200
    input: [reason]
    output: DepositTicket
    side_effects:
      - "status PROVISIONAL_CREDITED -> VERIFIED"
      - "CustomerAccount.provisional_credit_cents and available_balance_cents decrease by DepositTicket.provisional_credit_cents"
      - "DepositTicket.provisional_credit_cents = 0"
  - method: POST
    path: "/cash-vault/deposit-tickets/{id}/hold"
    description: "Hold the drop instead of extending credit."
    roles: [VaultManager]
    code: 200
    input: [hold_reason]
    output: DepositTicket
    side_effects: ["status VERIFIED -> HELD", "DepositTicket.hold_reason set", "CustomerAccount.hold_count += 1"]
  - method: POST
    path: "/cash-vault/deposit-tickets/{id}/settle"
    description: "Settle the ticket using deposit_credit_amount variant FINAL and reconcile the provisional credit."
    roles: [VaultManager]
    code: 200
    input: []
    output: DepositTicket
    side_effects:
      - "status SETTLEMENT_READY -> SETTLED"
      - "write DepositTicket.final_settlement_cents and settlement_delta_cents"
      - "CustomerAccount.provisional_credit_cents reduced by the ticket's provisional amount, ledger_balance_cents increased by final_settlement_cents, available_balance_cents recomputed"
      - "run customer_risk_grade variant SETTLED_ONLY onto CustomerAccount.risk_score and risk_grade"

  # ---- SealedBag / CustodyEvent ----
  - method: POST
    path: "/cash-vault/sealed-bags"
    description: "Register a sealed bag against an intake ticket."
    roles: [ArmoredCarrier]
    code: 201
    input: [deposit_ticket_id, seal_number, bag_type, declared_amount_cents, "declared_note_count?", "declared_coin_weight_grams?"]
    output: SealedBag
    side_effects: ["SealedBag created with custody_status SEALED and count_status PENDING", "recompute DepositTicket.declared_total_cents"]
  - method: GET
    path: "/cash-vault/sealed-bags/{id}"
    description: "Read one sealed bag, including both state axes and its version."
    roles: [VaultManager, VaultTeller, ArmoredCarrier, CustomerAccountHolder]
    code: 200
    input: []
    output: SealedBag
    side_effects: []
  - method: GET
    path: "/cash-vault/sealed-bags"
    description: "List sealed bags, filterable by ticket and by either state axis."
    roles: [VaultManager, VaultTeller]
    code: 200
    input: ["deposit_ticket_id?", "custody_status?", "count_status?", "limit?", "offset?"]
    output: SealedBag[]
    side_effects: []
  - method: POST
    path: "/cash-vault/sealed-bags/{id}/custody-events"
    description: "Append one chain-of-custody hop, advancing SealedBag.custody_status."
    roles: [ArmoredCarrier, VaultTeller]
    code: 201
    input: [event_type, location_code, observed_seal_number]
    output: CustodyEvent
    side_effects: ["CustodyEvent appended with sequence_no and seal_intact computed", "SealedBag.custody_status advanced", "increments SealedBag.version by 1"]
  - method: GET
    path: "/cash-vault/sealed-bags/{id}/custody-events"
    description: "Read the ordered chain of custody for a bag."
    roles: [VaultManager, VaultTeller, ArmoredCarrier]
    code: 200
    input: ["limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  # ---- CountingMachine ----
  - method: POST
    path: "/cash-vault/counting-machines"
    description: "Commission a sorter or counter on a vault floor."
    roles: [VaultManager]
    code: 201
    input: [vault_id, machine_code, machine_type, "status?"]
    output: CountingMachine
    side_effects: ["CountingMachine created"]
  - method: GET
    path: "/cash-vault/counting-machines/{id}"
    description: "Read one counting machine."
    roles: [VaultManager, VaultTeller]
    code: 200
    input: []
    output: CountingMachine
    side_effects: []
  - method: GET
    path: "/cash-vault/counting-machines"
    description: "List counting machines, filterable by vault and availability."
    roles: [VaultManager, VaultTeller]
    code: 200
    input: ["vault_id?", "status?", "limit?", "offset?"]
    output: CountingMachine[]
    side_effects: []

  # ---- CountSession / FitnessLot ----
  - method: POST
    path: "/cash-vault/count-sessions"
    description: "Schedule a counting window for one bag on one machine. Supersedes any prior SCHEDULED session on the same bag."
    roles: [VaultTeller]
    code: 201
    input: [sealed_bag_id, counting_machine_id, window_start, window_end, expected_sealed_bag_version]
    output: CountSession
    side_effects:
      - "CountSession created in SCHEDULED with operator_user_id set from X-User-ID"
      - "any prior CountSession on the same sealed_bag_id in status SCHEDULED moves to SUPERSEDED"
      - "increments SealedBag.version by 1"
  - method: GET
    path: "/cash-vault/count-sessions/{id}"
    description: "Read one count session."
    roles: [VaultManager, VaultTeller]
    code: 200
    input: []
    output: CountSession
    side_effects: []
  - method: GET
    path: "/cash-vault/count-sessions"
    description: "List count sessions, filterable by bag, machine and state."
    roles: [VaultManager, VaultTeller]
    code: 200
    input: ["sealed_bag_id?", "counting_machine_id?", "status?", "limit?", "offset?"]
    output: CountSession[]
    side_effects: []
  - method: POST
    path: "/cash-vault/count-sessions/{id}/start"
    description: "Open the bag on the machine and begin counting."
    roles: [VaultTeller]
    code: 200
    input: []
    output: CountSession
    side_effects: ["status SCHEDULED -> IN_PROGRESS", "SealedBag.count_status PENDING -> COUNTING", "increments SealedBag.version by 1"]
  - method: POST
    path: "/cash-vault/count-sessions/{id}/complete"
    description: "Report machine totals and the fitness-sorted lot breakdown. Drives the deepest cascade in the system."
    roles: [VaultTeller]
    code: 200
    input: [counted_amount_cents, counted_note_count, counted_coin_weight_grams, lots]
    output: CountSession
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; verifier_user_id and completed_at written"
      - "one FitnessLot created per lots[] entry"
      - "SealedBag counted_* fields, variance_cents, materiality_flag, processing_fee_cents, settlement_amount_cents, counted_at written; count_status COUNTING -> COUNTED"
      - "DepositTicket.counted_total_cents, processing_fee_total_cents and material_variance_open_count recomputed"
      - "DepositTicket auto-transitions to SETTLEMENT_READY once no bag remains outside {COUNTED, ADJUSTED}"
      - "increments SealedBag.version by 1"
  - method: GET
    path: "/cash-vault/count-sessions/{id}/fitness-lots"
    description: "Read the fitness-sorted lots produced by a session. The only discovery channel for cascade-created lots."
    roles: [VaultManager, VaultTeller, ComplianceOfficer]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: FitnessLot[]
    side_effects: []

  # ---- CounterfeitReport ----
  - method: POST
    path: "/cash-vault/counterfeit-reports"
    description: "Draft a counterfeit report against a COUNTERFEIT_SUSPECT lot."
    roles: [ComplianceOfficer]
    code: 201
    input: [fitness_lot_id, serial_number, denomination_cents, note_count]
    output: CounterfeitReport
    side_effects: ["CounterfeitReport created in DRAFT with seized_face_value_cents computed"]
  - method: GET
    path: "/cash-vault/counterfeit-reports/{id}"
    description: "Read one counterfeit report."
    roles: [ComplianceOfficer, VaultManager]
    code: 200
    input: []
    output: CounterfeitReport
    side_effects: []
  - method: GET
    path: "/cash-vault/counterfeit-reports"
    description: "List counterfeit reports, filterable by lot and state."
    roles: [ComplianceOfficer, VaultManager]
    code: 200
    input: ["fitness_lot_id?", "status?", "limit?", "offset?"]
    output: CounterfeitReport[]
    side_effects: []
  - method: POST
    path: "/cash-vault/counterfeit-reports/{id}/submit"
    description: "Submit the report; seizes the lot and propagates the loss up the bag and ticket."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CounterfeitReport
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at written"
      - "FitnessLot.status PENDING_REVIEW -> SEIZED"
      - "CountSession.seized_face_value_cents and SealedBag.seized_amount_cents increase by the lot's face value; SealedBag.settlement_amount_cents recomputed"
      - "DepositTicket.counted_total_cents recomputed"
      - "CustomerAccount.counterfeit_incident_count += 1 and customer_risk_grade variant SETTLED_ONLY re-run"
  - method: POST
    path: "/cash-vault/counterfeit-reports/{id}/return-for-correction"
    description: "Return a submitted report to DRAFT and unwind every seizure side effect."
    roles: [ComplianceOfficer]
    code: 200
    input: [correction_note]
    output: CounterfeitReport
    side_effects:
      - "status SUBMITTED -> DRAFT; submitted_at cleared; correction_note written"
      - "FitnessLot.status SEIZED -> PENDING_REVIEW"
      - "CountSession.seized_face_value_cents and SealedBag.seized_amount_cents decrease by the lot's face value; SealedBag.settlement_amount_cents and DepositTicket.counted_total_cents recomputed"
      - "CustomerAccount.counterfeit_incident_count -= 1 and customer_risk_grade variant SETTLED_ONLY re-run"
  - method: POST
    path: "/cash-vault/counterfeit-reports/{id}/acknowledge"
    description: "Record the Secret Service case number and close the report."
    roles: [ComplianceOfficer]
    code: 200
    input: [case_number]
    output: CounterfeitReport
    side_effects: ["status SUBMITTED -> ACKNOWLEDGED; case_number written"]

  # ---- DiscrepancyClaim ----
  - method: POST
    path: "/cash-vault/discrepancy-claims"
    description: "File a discrepancy claim or a statement-adjustment dispute inside the claim window."
    roles: [CustomerAccountHolder]
    code: 201
    input: [sealed_bag_id, claim_type, claimed_amount_cents]
    output: DiscrepancyClaim
    side_effects: ["DiscrepancyClaim created in SUBMITTED with review_round 1, filed_at stamped from the logical clock and customer_account_id copied from the bag's ticket"]
  - method: GET
    path: "/cash-vault/discrepancy-claims/{id}"
    description: "Read one claim."
    roles: [VaultManager, CustomerAccountHolder]
    code: 200
    input: []
    output: DiscrepancyClaim
    side_effects: []
  - method: GET
    path: "/cash-vault/discrepancy-claims"
    description: "List claims, filterable by bag, depositor and state."
    roles: [VaultManager, CustomerAccountHolder]
    code: 200
    input: ["sealed_bag_id?", "customer_account_id?", "status?", "limit?", "offset?"]
    output: DiscrepancyClaim[]
    side_effects: []
  - method: POST
    path: "/cash-vault/discrepancy-claims/{id}/request-info"
    description: "Return the claim to the customer for more information."
    roles: [VaultManager]
    code: 200
    input: [info_request_note]
    output: DiscrepancyClaim
    side_effects: ["status SUBMITTED -> INFO_REQUESTED; info_request_note written"]
  - method: POST
    path: "/cash-vault/discrepancy-claims/{id}/resubmit"
    description: "Resubmit the claim with a revised amount, closing one review round."
    roles: [CustomerAccountHolder]
    code: 200
    input: [claimed_amount_cents]
    output: DiscrepancyClaim
    side_effects: ["status INFO_REQUESTED -> SUBMITTED; review_round += 1; claimed_amount_cents replaced"]
  - method: POST
    path: "/cash-vault/discrepancy-claims/{id}/approve"
    description: "Approve the claim, adjust the bag and release the settlement block."
    roles: [VaultManager]
    code: 200
    input: [resolution_amount_cents]
    output: DiscrepancyClaim
    side_effects:
      - "status SUBMITTED -> APPROVED; resolution_amount_cents and decided_by_user_id written"
      - "SealedBag.claim_adjustment_cents written and count_status COUNTED -> ADJUSTED"
      - "SealedBag.settlement_amount_cents and DepositTicket.counted_total_cents recomputed"
      - "DepositTicket.material_variance_open_count decremented when the bag was flagged"
  - method: POST
    path: "/cash-vault/discrepancy-claims/{id}/deny"
    description: "Deny the claim; the settlement block is released without moving money."
    roles: [VaultManager]
    code: 200
    input: [denial_reason]
    output: DiscrepancyClaim
    side_effects:
      - "status SUBMITTED -> DENIED; denial_reason and decided_by_user_id written"
      - "CustomerAccount.denied_claim_count += 1"
      - "DepositTicket.material_variance_open_count decremented when the bag was flagged"

  # ---- FedDeposit ----
  - method: POST
    path: "/cash-vault/fed-deposits"
    description: "Prepare a Federal Reserve cash letter over eligible fitness lots."
    roles: [VaultManager]
    code: 201
    input: [vault_id, cash_letter_number, deposit_date, fitness_lot_ids]
    output: FedDeposit
    side_effects:
      - "FedDeposit created in PREPARED with declared_total_cents and attached_lot_count frozen from the named lots"
      - "each named FitnessLot gets fed_deposit_id set and status PENDING_DEPOSIT -> ATTACHED"
  - method: GET
    path: "/cash-vault/fed-deposits/{id}"
    description: "Read one cash letter."
    roles: [VaultManager, FederalReserveAgent]
    code: 200
    input: []
    output: FedDeposit
    side_effects: []
  - method: GET
    path: "/cash-vault/fed-deposits"
    description: "List cash letters, filterable by vault and state."
    roles: [VaultManager, FederalReserveAgent]
    code: 200
    input: ["vault_id?", "status?", "limit?", "offset?"]
    output: FedDeposit[]
    side_effects: []
  - method: POST
    path: "/cash-vault/fed-deposits/{id}/submit"
    description: "Ship the cash letter to the Federal Reserve."
    roles: [VaultManager]
    code: 200
    input: []
    output: FedDeposit
    side_effects: ["status PREPARED -> SUBMITTED; submitted_at written", "every attached FitnessLot moves ATTACHED -> DEPOSITED"]
  - method: POST
    path: "/cash-vault/fed-deposits/{id}/confirm"
    description: "Record the Federal Reserve's credit advice and any cash-letter adjustment."
    roles: [FederalReserveAgent]
    code: 200
    input: [credited_total_cents]
    output: FedDeposit
    side_effects:
      - "run fed_deposit_credit; write credited_total_cents, adjustment_cents and confirmed_at"
      - "status SUBMITTED -> CONFIRMED when adjustment_cents == 0, otherwise SUBMITTED -> CONFIRMED_WITH_ADJUSTMENT"
      - "Vault.cash_letter_adjustment_cents increased by adjustment_cents only on the adjustment branch"
  - method: GET
    path: "/cash-vault/fed-deposits/{id}/fitness-lots"
    description: "Read the lots attached to a cash letter."
    roles: [VaultManager, FederalReserveAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FitnessLot[]
    side_effects: []

  # ---- CoinOrder / CoinOrderLine ----
  - method: POST
    path: "/cash-vault/coin-orders"
    description: "Place a coin/change order with a CLOSED armored pickup window at the vault."
    roles: [CustomerAccountHolder]
    code: 201
    input: [customer_account_id, vault_id, pickup_window_start, pickup_window_end, lines]
    output: CoinOrder
    side_effects: ["CoinOrder created in REQUESTED", "one CoinOrderLine created per lines[] entry", "total_boxes_requested computed"]
  - method: GET
    path: "/cash-vault/coin-orders/{id}"
    description: "Read one coin order."
    roles: [VaultManager, VaultTeller, CustomerAccountHolder]
    code: 200
    input: []
    output: CoinOrder
    side_effects: []
  - method: GET
    path: "/cash-vault/coin-orders"
    description: "List coin orders, filterable by depositor, vault and state."
    roles: [VaultManager, VaultTeller, CustomerAccountHolder]
    code: 200
    input: ["customer_account_id?", "vault_id?", "status?", "limit?", "offset?"]
    output: CoinOrder[]
    side_effects: []
  - method: POST
    path: "/cash-vault/coin-orders/{id}/approve"
    description: "Run coin_order_allocation and reserve inventory."
    roles: [VaultManager]
    code: 200
    input: [allow_partial]
    output: CoinOrder
    side_effects:
      - "per-line boxes_allocated and line_face_value_cents written; order totals, fill_ratio_pct and charge_cents written"
      - "VaultInventory.reserved_boxes increased per denomination; available_boxes recomputed"
      - "status REQUESTED -> APPROVED_FULL, APPROVED_PARTIAL or REJECTED; approved_by_user_id written"
      - "increments Vault.version by 1"
  - method: POST
    path: "/cash-vault/coin-orders/{id}/release"
    description: "Hand the coin to the carrier at pickup, moving boxes out of the vault and debiting the account."
    roles: [VaultTeller]
    code: 200
    input: [expected_vault_version]
    output: CoinOrder
    side_effects:
      - "VaultInventory.on_hand_boxes and reserved_boxes both decreased by boxes_allocated per denomination"
      - "recompute Vault.coin_face_value_on_hand_cents"
      - "CustomerAccount.ledger_balance_cents decreased by charge_cents; available_balance_cents recomputed"
      - "status -> RELEASED; released_by_user_id written"
      - "increments Vault.version by 1"
  - method: POST
    path: "/cash-vault/coin-orders/{id}/return"
    description: "Take back an entire released order. Compensating action for release."
    roles: [VaultTeller]
    code: 200
    input: [return_reason]
    output: CoinOrder
    side_effects:
      - "per-line boxes_returned set to boxes_allocated"
      - "VaultInventory.on_hand_boxes increased by boxes_allocated per denomination; reserved_boxes untouched"
      - "recompute Vault.coin_face_value_on_hand_cents"
      - "CustomerAccount.ledger_balance_cents increased by charge_cents; available_balance_cents recomputed"
      - "status RELEASED -> RETURNED; return_reason written"
      - "increments Vault.version by 1"
  - method: GET
    path: "/cash-vault/coin-orders/{id}/lines"
    description: "Read the per-denomination lines of a coin order, including allocations and returns."
    roles: [VaultManager, VaultTeller, CustomerAccountHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: CoinOrderLine[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, blank, or naming a role outside the RBAC matrix"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "authenticated role is not listed in the target endpoint's roles"
  - id: ERR_ACCOUNT_OWNERSHIP
    http: 403
    condition: "CustomerAccountHolder's X-User-ID does not match the CustomerAccount.id reachable from the target resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body or query: missing required field, wrong type, unrecognized enum member, pagination limit outside [1,100], negative offset, non-increasing time window, or an empty coin-order lines / count-complete lots array. An empty fitness_lot_ids array is ERR_NO_ELIGIBLE_LOTS instead."
  - id: ERR_VAULT_NOT_FOUND
    http: 404
    condition: "referenced Vault id does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "referenced CustomerAccount id does not exist"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "referenced DepositTicket id does not exist"
  - id: ERR_BAG_NOT_FOUND
    http: 404
    condition: "referenced SealedBag id does not exist"
  - id: ERR_MACHINE_NOT_FOUND
    http: 404
    condition: "referenced CountingMachine id does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "referenced CountSession id does not exist"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "referenced FitnessLot id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "referenced CounterfeitReport id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "referenced DiscrepancyClaim id does not exist"
  - id: ERR_FED_DEPOSIT_NOT_FOUND
    http: 404
    condition: "referenced FedDeposit id does not exist"
  - id: ERR_COIN_ORDER_NOT_FOUND
    http: 404
    condition: "referenced CoinOrder id does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_sealed_bag_version does not equal SealedBag.version, or expected_vault_version does not equal Vault.version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target entity is not in a from-state that declares the requested transition"
  - id: ERR_BAG_NOT_RECEIVED
    http: 409
    condition: "the bag's custody_status has not reached the hop the operation requires (VAULT_RECEIVED to schedule a count, OPENED to start one, VAULT_RECEIVED for every bag to verify a ticket)"
  - id: ERR_BAG_COUNT_MISMATCH
    http: 409
    condition: "the number of registered bags does not equal DepositTicket.declared_bag_count at verification"
  - id: ERR_BAG_NOT_COUNTED
    http: 409
    condition: "a discrepancy claim is filed against a bag whose count_status is still PENDING or COUNTING"
  - id: ERR_VAULT_FROZEN
    http: 409
    condition: "the vault reached from the target resource has posture FROZEN"
  - id: ERR_VAULT_RESTRICTED
    http: 409
    condition: "coin release is attempted while the vault posture is RESTRICTED"
  - id: ERR_MACHINE_UNAVAILABLE
    http: 409
    condition: "the counting machine bound to the session has status MAINTENANCE when the session is started"
  - id: ERR_DUAL_CONTROL_VIOLATION
    http: 409
    condition: "the acting X-User-ID equals CountSession.operator_user_id on completion, or equals CoinOrder.approved_by_user_id on release"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the VaultManager deciding a claim is the verifier_user_id of the COMPLETED CountSession that produced the disputed count"
  - id: ERR_COUNTERFEIT_REPORT_PENDING
    http: 409
    condition: "a DRAFT CounterfeitReport still exists on a lot sharing a count session with the cash letter being submitted"
  - id: ERR_MACHINE_TYPE_MISMATCH
    http: 422
    condition: "the machine's machine_type does not accept the bag's bag_type"
  - id: ERR_REPORT_LOT_MISMATCH
    http: 422
    condition: "the report's denomination_cents or note_count differs from the referenced FitnessLot"
  - id: ERR_LOT_NOT_ELIGIBLE
    http: 422
    condition: "a lot named on a cash letter is COUNTERFEIT_SUSPECT, or is not in status PENDING_DEPOSIT"
  - id: ERR_LOT_VAULT_MISMATCH
    http: 422
    condition: "a lot named on a cash letter was counted on a machine belonging to a different vault than the cash letter's vault_id"
  - id: ERR_MACHINE_WINDOW_CONFLICT
    http: 409
    condition: "the requested counting window, extended by the cleaning buffer, intersects the extended window of another SCHEDULED or IN_PROGRESS session on the same machine"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "window_start is earlier than the logical clock's current instant"
  - id: ERR_PICKUP_CAPACITY_EXCEEDED
    http: 409
    condition: "some instant in the requested CLOSED pickup interval is already covered by pickup_concurrency_limit or more live coin orders on the same vault"
  - id: ERR_DUPLICATE_DENOMINATION
    http: 422
    condition: "two lines of the same coin order name the same denomination"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is at or after SealedBag.counted_at + CLAIM_WINDOW_HOURS when the claim is filed"
  - id: ERR_CLAIM_ROUND_LIMIT
    http: 409
    condition: "a resubmit would push DiscrepancyClaim.review_round past MAX_CLAIM_ROUNDS"
  - id: ERR_DUPLICATE_SEAL
    http: 409
    condition: "seal_number is already registered on another SealedBag"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "vault_code, account_number, courier_manifest_number, machine_code or cash_letter_number collides with an existing row"
  - id: ERR_SEAL_TAMPERED
    http: 409
    condition: "the seal read at a VAULT_RECEIPT hop does not match the bag's registered seal_number"
  - id: ERR_NO_ELIGIBLE_LOTS
    http: 422
    condition: "the cash letter's fitness_lot_ids array is empty"
  - id: ERR_LOT_TOTAL_MISMATCH
    http: 422
    condition: "the reported lot breakdown does not reconcile with counted_amount_cents or counted_note_count"
  - id: ERR_MATERIAL_VARIANCE_UNRESOLVED
    http: 409
    condition: "settlement is attempted while DepositTicket.material_variance_open_count is greater than 0"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "credit or coin approval is attempted on a CustomerAccount whose status is SUSPENDED"
  - id: ERR_INSUFFICIENT_COIN_INVENTORY
    http: 409
    condition: "approval with allow_partial false cannot fill every requested box, or release finds fewer on-hand boxes than were allocated"
  - id: ERR_INVENTORY_NEGATIVE
    http: 422
    condition: "an inventory adjustment would drive on_hand_boxes below zero"
  - id: ERR_CLAIM_AMOUNT_EXCEEDS_DECLARED
    http: 422
    condition: "claimed_amount_cents exceeds the disputed bag's declared_amount_cents"
  - id: ERR_RESOLUTION_EXCEEDS_CLAIM
    http: 422
    condition: "resolution_amount_cents exceeds DiscrepancyClaim.claimed_amount_cents"

roles:
  - name: VaultManager
    description: "Runs the processing center: vault posture, inventory positions, holds, settlements, claim decisions, cash letters and coin-order approvals."
    identity: "opaque"
    exclusive_operations:
      - "POST /vaults"
      - "POST /vaults/{id}/posture"
      - "POST /vaults/{id}/inventory-adjustments"
      - "GET /vaults/{id}/cash-letter-reconciliation"
      - "POST /customer-accounts"
      - "POST /counting-machines"
      - "POST /deposit-tickets/{id}/hold"
      - "POST /deposit-tickets/{id}/reverse-provisional-credit"
      - "POST /deposit-tickets/{id}/settle"
      - "POST /discrepancy-claims/{id}/request-info"
      - "POST /discrepancy-claims/{id}/approve"
      - "POST /discrepancy-claims/{id}/deny"
      - "POST /fed-deposits"
      - "POST /fed-deposits/{id}/submit"
      - "POST /coin-orders/{id}/approve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /vaults/{id}, GET /vaults/{id}/inventory"
      - "GET /customer-accounts/{id}, GET /customer-accounts/{id}/statement"
      - "GET /deposit-tickets, GET /deposit-tickets/{id}"
      - "GET /sealed-bags, GET /sealed-bags/{id}, GET /sealed-bags/{id}/custody-events"
      - "GET /counting-machines, GET /counting-machines/{id}"
      - "GET /count-sessions, GET /count-sessions/{id}, GET /count-sessions/{id}/fitness-lots"
      - "GET /counterfeit-reports, GET /counterfeit-reports/{id}"
      - "GET /discrepancy-claims, GET /discrepancy-claims/{id}"
      - "GET /fed-deposits, GET /fed-deposits/{id}, GET /fed-deposits/{id}/fitness-lots"
      - "GET /coin-orders, GET /coin-orders/{id}, GET /coin-orders/{id}/lines"
  - name: VaultTeller
    description: "Works the vault floor: verifies drops, extends provisional credit, schedules and runs counting sessions, releases and takes back coin."
    identity: "opaque"
    exclusive_operations:
      - "POST /deposit-tickets/{id}/verify"
      - "POST /deposit-tickets/{id}/provisional-credit"
      - "POST /count-sessions"
      - "POST /count-sessions/{id}/start"
      - "POST /count-sessions/{id}/complete"
      - "POST /coin-orders/{id}/release"
      - "POST /coin-orders/{id}/return"
    shared_operations:
      - "POST /sealed-bags/{id}/custody-events (with ArmoredCarrier)"
      - "GET /vaults/{id}, GET /vaults/{id}/inventory"
      - "GET /customer-accounts/{id}"
      - "GET /deposit-tickets, GET /deposit-tickets/{id}"
      - "GET /sealed-bags, GET /sealed-bags/{id}, GET /sealed-bags/{id}/custody-events"
      - "GET /counting-machines, GET /counting-machines/{id}"
      - "GET /count-sessions, GET /count-sessions/{id}, GET /count-sessions/{id}/fitness-lots"
      - "GET /coin-orders, GET /coin-orders/{id}, GET /coin-orders/{id}/lines"
  - name: ArmoredCarrier
    description: "Courier crew that lodges the manifest, registers sealed bags and records custody hops up to vault receipt."
    identity: "opaque"
    exclusive_operations:
      - "POST /deposit-tickets"
      - "POST /sealed-bags"
    shared_operations:
      - "POST /sealed-bags/{id}/custody-events (with VaultTeller)"
      - "GET /deposit-tickets/{id}"
      - "GET /sealed-bags/{id}, GET /sealed-bags/{id}/custody-events"
  - name: ComplianceOfficer
    description: "Owns counterfeit detection and the reporting chain to the Secret Service."
    identity: "opaque"
    exclusive_operations:
      - "POST /counterfeit-reports"
      - "POST /counterfeit-reports/{id}/submit"
      - "POST /counterfeit-reports/{id}/return-for-correction"
      - "POST /counterfeit-reports/{id}/acknowledge"
    shared_operations:
      - "GET /vaults/{id}"
      - "GET /counterfeit-reports, GET /counterfeit-reports/{id}"
      - "GET /count-sessions/{id}/fitness-lots"
  - name: CustomerAccountHolder
    description: "The depositing customer. Files discrepancy claims and statement-adjustment disputes and places coin/change orders. X-User-ID is the CustomerAccount.id."
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /discrepancy-claims"
      - "POST /discrepancy-claims/{id}/resubmit"
      - "POST /coin-orders"
    shared_operations:
      - "GET /customer-accounts/{id}, GET /customer-accounts/{id}/statement"
      - "GET /deposit-tickets, GET /deposit-tickets/{id}"
      - "GET /sealed-bags/{id}"
      - "GET /discrepancy-claims, GET /discrepancy-claims/{id}"
      - "GET /coin-orders, GET /coin-orders/{id}, GET /coin-orders/{id}/lines"
  - name: FederalReserveAgent
    description: "Federal Reserve counterparty that confirms cash letters and posts credit advices with adjustments."
    identity: "opaque"
    exclusive_operations:
      - "POST /fed-deposits/{id}/confirm"
    shared_operations:
      - "GET /vaults/{id}"
      - "GET /fed-deposits, GET /fed-deposits/{id}, GET /fed-deposits/{id}/fitness-lots"
