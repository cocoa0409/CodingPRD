      - name: member_pmpm_constants_applied_across_age_bands_and_tiers
        claim_type: constants_applied
        grounds:
          - calculations.member_pmpm_components
          - entities.Enrollee.fields.gross_pmpm_cents
        distinguishing_aspect: |
          Three enrollees on one agreement exercise three different
          AGE_BAND_FACTOR_BPS entries and three different BENEFIT_TIER_ADD_CENTS
          entries. The tier add-on is a flat cent amount applied AFTER the single
          rounding of the risk-adjusted product and is never itself
          risk-adjusted: SENIOR/POS/10000 at base 30000 must be 43500 + 1200 =
          44700, not round(30000 * 1.45 * (10000 + 1200 scaled)).
        test_recipe:
          setup:
            - "Agreement AGR_C3 is ACTIVE with base_pmpm_cents 30000 and quality_withhold_bps 700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
