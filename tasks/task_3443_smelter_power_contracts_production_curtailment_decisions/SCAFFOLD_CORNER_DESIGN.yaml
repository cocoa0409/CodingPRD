          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: MARKET_INDEXED
            volume_mw: 100
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      trigger:
      - call: GET /smelter-ops/power-contracts/${pc}
        as: EnergyManager
        captures:
          fwd: $.data.forward_cost_per_mwh
          mtd: $.data.month_to_date_settlement_usd
      assert:
      - forward_cost_per_mwh is null and settled_cost_per_mwh is null (empty observation set)
      - month_to_date_settlement_usd is null
      - the GET still returns HTTP 200 (missing reference data is not a read error on contracts)
  - name: restart_cost_warm_class_estimate_literal
    claim_type: constants_applied
    grounds:
    - calculations.restart_cost
    distinguishing_aspect: WARM class (idle 216h, inside [24h, 720h)) applies base 350000 + 120*capacity + 2500*planned_idle_days;
      pinned literal 467500 for capacity 500 and 23 planned idle days.
    test_recipe:
      setup:
      - Smelter with ACTIVE contract; potline 500 tpd idled at the default clock; clock advanced to 2026-09-10 (idle 9 days
        = 216h -> WARM); plan targets 2026-09-24 (23 planned idle days).
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
        as: SmelterManager
        captures:
          pl: $.data.id
      - call: POST /smelter-ops/potlines/${pl}/curtail
        payload:
          depth_pct: 100
        as: SmelterManager
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /smelter-ops/restart-plans
        payload:
          potline_id: ${pl}
          planned_restart_at: '2026-09-24T00:00:00Z'
        as: SmelterManager
        captures:
          rp: $.data.id
          cls: $.data.restart_cost_class
          est: $.data.estimated_cost_usd
      assert:
      - RestartPlan.${rp}.restart_cost_class == WARM
      - RestartPlan.${rp}.estimated_cost_usd == 467500 (350000 + 120*500 + 2500*23)
  - name: product_mix_value_added_tier_boundary_25pct
    claim_type: correct_result
    grounds:
    - calculations.product_mix_margin
    distinguishing_aspect: 'The VALUE_ADDED premium tier is inclusive at 0.25 (0.10 <= share <= 0.25 -> 180): a share of exactly
      25% prices VA at premium 180, and total_margin freezes at 77775000.00.'
    test_recipe:
      setup:
      - Smelter 1000 tpd; LME 2400 and premium 380 prints; plan with BILLET 15000 / SLAB 7500 / VALUE_ADDED 7500 (share exactly
        0.25).
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
          sv: $.data.version
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: ALUMINUM_LME
          region_code: GLOBAL
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 2400.0
        as: TradingAnalyst
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: REGIONAL_PREMIUM
          region_code: NA_NORTHWEST
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 380.0
        as: TradingAnalyst
      trigger:
      - call: POST /smelter-ops/production-plans
        payload:
          smelter_id: ${sm}
          expected_smelter_version: ${sv}
          period_month: 2026-09
          allocations:
          - product_form: BILLET
            tonnes: 15000
          - product_form: SLAB
            tonnes: 7500
          - product_form: VALUE_ADDED
            tonnes: 7500
        as: Controller
        captures:
          plan: $.data.id
          tm: $.data.total_margin_usd
          tt: $.data.total_tonnes
      assert:
      - ProductionPlan.${plan}.total_tonnes == 30000
      - ProductionPlan.${plan}.total_margin_usd == 77775000.00 (15000*2600.00 + 7500*2560.00 + 7500*2610.00; VA premium 180
        because share 0.25 is inside the [0.10, 0.25] tier)
