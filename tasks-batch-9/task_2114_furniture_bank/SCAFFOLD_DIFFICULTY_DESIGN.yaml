              as: IntakeCoordinator
              captures: { off_id: "$.data.id" }
            - call: "GET /donation-offers/${off_id}/items"
              payload: {}
              as: IntakeCoordinator
              captures: { i1: "$.data[0].id", i2: "$.data[1].id", i3: "$.data[2].id", i4: "$.data[3].id" }
          trigger:
            - call: "POST /donation-offers/${off_id}/triage"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "DonationOffer.${off_id}.declared_soft_ratio == 0.5"
            - "DonationOffer.${off_id}.status == TRIAGED"
            - "DonationOffer.${off_id}.accepted_item_count == 1"
            - "DonationOffer.${off_id}.rejected_item_count == 3"
            - "DonationOffer.${off_id}.bed_bug_risk_score == 0.0"
            - "DonationItem.${i1}.decision == REJECTED and DonationItem.${i1}.reject_reason == SOFT_SURFACE_RISK"
            - "DonationItem.${i2}.decision == REJECTED and DonationItem.${i2}.reject_reason == RECALLED_CRIB"
            - "DonationItem.${i3}.decision == REJECTED and DonationItem.${i3}.reject_reason == SOFT_SURFACE_RISK"
            - "DonationItem.${i4}.decision == ACCEPTED and DonationItem.${i4}.reject_reason == null"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: referral_submitted_returned_submitted_revision_cycle
        grounds:
          - state_machines.Referral.SUBMITTED_to_RETURNED
          - state_machines.Referral.RETURNED_to_SUBMITTED
          - entities.Referral.fields.revision_count
          - entities.Referral.fields.priority_score
          - validations[priority=12]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          Referral is the cyclic machine: SUBMITTED -> RETURNED -> SUBMITTED runs twice, each lap
          raising revision_count and shaving REVISION_PENALTY_PER_ROUND off priority_score
          (30.0 -> 24.0 -> 18.0), and the third lap is refused by MAX_REVISIONS.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "PartnerAgency CENTRAL quota 5 standing GOOD; Client household_size 4, no strikes, bed_bug_status CLEAR."
            - "One Referral with urgency ROUTINE that has been submitted, returned, resubmitted, returned, resubmitted and returned again, so revision_count is 2 and status is RETURNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Lakeside Neighbors", county: "CENTRAL", quarterly_voucher_quota: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: false, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { score_lap0: "$.data.priority_score" }
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "RETURN", note: "Missing home visit" }
              as: PlatformAdmin
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { score_lap1: "$.data.priority_score", rev_lap1: "$.data.revision_count" }
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "RETURN", note: "Category list still wrong" }
              as: PlatformAdmin
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { score_lap2: "$.data.priority_score", rev_lap2: "$.data.revision_count" }
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "RETURN", note: "Final return" }
              as: PlatformAdmin
          trigger:
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${score_lap0} == 30.0"
            - "${score_lap1} == 24.0"
            - "${rev_lap1} == 1"
            - "${score_lap2} == 18.0"
            - "${rev_lap2} == 2"
            - "${err} == ERR_REVISION_LIMIT_REACHED"
            - "HTTP status of the trigger is 409"
            - "Referral.${ref_id}.status == RETURNED"
            - "Referral.${ref_id}.revision_count == 2"
            - "Referral.${ref_id}.priority_score == 18.0"

      - name: voucher_fulfilment_and_billing_axes_advance_independently
        grounds:
          - state_machines.Voucher.PARTIALLY_ALLOCATED_to_ALLOCATED
          - state_machines.Voucher.PENDING_to_WAIVED
          - entities.Voucher.fields.fee_status
          - entities.Voucher.fields.gross_fee_cents
          - calculations.voucher_delivery_fee
        distinguishing_aspect: |
          Voucher (a different entity from Referral) carries two independent state axes: the
          fulfilment axis walks PARTIALLY_ALLOCATED -> ALLOCATED while the billing axis sits in
          WAIVED, and the billing freeze keeps gross_fee_cents at the one-bed figure 5700 even
