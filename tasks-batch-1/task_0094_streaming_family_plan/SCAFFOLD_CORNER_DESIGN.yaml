scaffold_corner_design:
  # =====================================================================
  # Entities — creation, required fields, defaults, computed, system, enums
  # =====================================================================
  - section: entities
    instances:
      - name: create_subscription_plan_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.SubscriptionPlan]
        distinguishing_aspect: "POST /subscription-plans with all required fields returns 201 and echoes tier, monthly_fee_cents, caps, ad_free, hd_offline_allowed, plus a server-minted id and created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_FREE", monthly_fee_cents: 800, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 3, ad_free: true, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response status == 201"
            - "data.tier == AD_FREE and data.monthly_fee_cents == 800 and data.ad_free == true"
            - "data.id is a UUID with no type prefix"

      - name: create_account_default_status_active_billing_open
        claim_type: Defaults
        grounds: [entities.Account.fields.status, entities.Account.fields.billing_status, entities.Account.fields.wallet_credit_cents]
        distinguishing_aspect: "Omitting initial_credit_cents on POST /accounts seeds wallet_credit_cents=0; status defaults ACTIVE and billing_status defaults OPEN; version starts at 1."
        test_recipe:
          setup: ["one plan exists"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "def@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
          assert:
            - "data.status == ACTIVE"
            - "data.billing_status == OPEN"
            - "data.wallet_credit_cents == 0"
            - "data.version == 1"

      - name: title_downloadable_default_true
        claim_type: Defaults
        grounds: [entities.Title.fields.downloadable]
        distinguishing_aspect: "Omitting downloadable on POST /titles applies the default true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { name: "Def", maturity_rating: "PG", runtime_minutes: 30, license_size_mb: 200 }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          assert:
            - "data.downloadable == true"

      - name: profile_max_rating_allowed_computed_from_kind
        claim_type: Computed Fields
        grounds: [entities.Profile.fields.max_rating_allowed, calculations.rating_ceiling]
        distinguishing_aspect: "A KID profile with no ParentalControl computes max_rating_allowed == G from the kind default; an ADULT computes NC17."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "ceil@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "K", kind: "KID" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { kid_ceiling: $.data.max_rating_allowed }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "A", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { adult_ceiling: $.data.max_rating_allowed }
          assert:
            - "KID profile max_rating_allowed == G"
            - "ADULT profile max_rating_allowed == NC17"

      - name: system_fields_input_ignored_on_account_create
        claim_type: System Fields
        grounds: [entities.Account.fields.status, entities.Account.fields.wallet_credit_cents]
        distinguishing_aspect: "status is source:system and wallet_credit_cents is computed; the server seeds status ACTIVE and wallet from initial_credit_cents, ignoring any client-supplied status."
        test_recipe:
          setup: ["one plan exists"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "sys@x.com", billing_anchor_day: 1, initial_credit_cents: 500 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
          assert:
            - "data.status == ACTIVE"
            - "data.wallet_credit_cents == 500"

      - name: invalid_enum_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Profile.fields.kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /profiles with kind not in {ADULT,TEEN,KID} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "enum@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "Bad", kind: "GROWNUP" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: missing_required_field_on_plan_create_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.SubscriptionPlan", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /subscription-plans omitting concurrent_stream_cap returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_FREE", monthly_fee_cents: 800, max_profiles: 4, max_registered_devices: 4, download_quota_per_profile: 3, ad_free: true, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: account_not_found_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Account", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: list_profiles_pagination_envelope
        claim_type: Listing
        grounds: [entities.Profile]
        distinguishing_aspect: "GET /accounts/{id}/profiles returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["account with 2 profiles"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "list@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P1", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P2", kind: "TEEN" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /accounts/${acct_id}/profiles"
              as: AccountOwner
              as_user_id: "${acct_id}"
          assert:
            - "response_type == array and meta.total_count == 2 and has_more == false"

  # =====================================================================
  # State machines — initial state, invalid transitions, terminal lockdown, idempotency
  # =====================================================================
  - section: state_machines
    instances:
      - name: stream_session_initial_state_active
        claim_type: Initial State
        grounds: [state_machines.StreamSession.none_to_ACTIVE, entities.StreamSession.fields.status]
        distinguishing_aspect: "A freshly created StreamSession starts in ACTIVE (the declared initial_state)."
        test_recipe:
          setup: ["account, profile, device, title"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Show", maturity_rating: "PG", runtime_minutes: 50, downloadable: true, license_size_mb: 300 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "init@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { st: $.data.status }
          assert:
            - "data.status == ACTIVE"

      - name: stop_already_ended_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.StreamSession.ACTIVE_to_ENDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Stopping a session already in ENDED (terminal) returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["a session that has already been stopped (ENDED)"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Show", maturity_rating: "PG", runtime_minutes: 50, downloadable: true, license_size_mb: 300 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-25T10:00:00Z", run_sweeps: false }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "ended@x.com", billing_anchor_day: 25 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /stream-sessions/${sess_id}/stop"
              as: ProfileUser
              as_user_id: "${prof_id}"
          trigger:
            - call: "POST /stream-sessions/${sess_id}/stop"
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: closed_account_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Account.ACTIVE_to_CLOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From CLOSED (terminal), suspend is undefined and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a CLOSED account"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "closed@x.com", billing_anchor_day: 1, initial_credit_cents: 5000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct_id}/close"
              payload: { expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/suspend"
              payload: { expected_account_version: "${v1}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: accept_invite_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: ["state_machines.Invite.PENDING_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED invite a second time returns ERR_INVALID_STATE; no second Profile is minted."
        test_recipe:
          setup: ["an ACCEPTED invite"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "inv2@x.com", billing_anchor_day: 1, initial_credit_cents: 10000 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /invites"
              payload: { account_id: "${acct_id}", invitee_email: "x@x.com" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { inv_id: $.data.id, tok: $.data.token }
            - call: "POST /invites/${inv_id}/accept"
              payload: { token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "POST /invites/${inv_id}/accept"
              payload: { token: "${tok}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: account_suspend_reactivate_revert_loop_corner
        claim_type: Valid Transition
        grounds: [state_machines.Account.SUSPENDED_to_ACTIVE]
        excluded_because:
          difficulty_instance: account_suspend_reactivate_revert_loop
          rationale: "The SUSPENDED->ACTIVE back-edge is exercised as the named §1.8 instance."

      - name: invite_decline_branch_corner
        claim_type: Valid Transition
        grounds: [state_machines.Invite.PENDING_to_DECLINED]
        excluded_because:
          difficulty_instance: invite_pending_fork_divergent_branches
          rationale: "The PENDING->DECLINED branch and its hold release are exercised by the named §1.8 fork instance and the invite-hold invariant."

  # =====================================================================
  # Calculations — correctness, variants, precision
  # =====================================================================
  - section: calculations
    instances:
      - name: download_size_hd_doubles_sd
        claim_type: Variant Divergence
        grounds: [calculations.download_size, entities.Download.fields.size_mb]
        distinguishing_aspect: "download_size yields license_size_mb at SD and 2*license_size_mb at HD; a 700MB title yields 1400 at HD."
        test_recipe:
          setup: ["PREMIUM plan (hd allowed), HD-capable device, 700MB downloadable title"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Big", maturity_rating: "PG", runtime_minutes: 120, downloadable: true, license_size_mb: 700 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "dl@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /downloads"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}", quality: "HD" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { sz: $.data.size_mb }
          assert:
            - "data.size_mb == 1400"

      - name: ad_free_plan_zero_ads
        claim_type: Variant Selection
        grounds: [calculations.ad_break_count, entities.SubscriptionPlan.fields.ad_free]
        distinguishing_aspect: "On an ad_free plan, ad_break_count returns 0 regardless of runtime; a 120-min title yields ad_breaks_served==0."
        test_recipe:
          setup: ["ad_free plan; 120-min title; profile+device"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "AD_FREE", monthly_fee_cents: 800, max_profiles: 4, concurrent_stream_cap: 2, max_registered_devices: 4, download_quota_per_profile: 3, ad_free: true, hd_offline_allowed: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Long", maturity_rating: "PG", runtime_minutes: 120, downloadable: true, license_size_mb: 700 }
              as: PlatformAdmin
              captures: { title_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "adfree@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV", platform: "TV", supports_hd: false }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /stream-sessions"
              payload: { profile_id: "${prof_id}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${prof_id}"
              captures: { ads: $.data.ad_breaks_served }
          assert:
            - "data.ad_breaks_served == 0"

      - name: single_plan_period_charge_equals_flat_fee
        claim_type: Correct Result
        grounds: [calculations.cycle_charge, entities.Account.fields.period_charge_cents]
        distinguishing_aspect: "With no PlanChange, invoicing yields period_charge_cents == monthly_fee_cents (1000), proration_adjustment_cents == 0, and debits the wallet by 1000."
        test_recipe:
          setup: ["account on a 1000/period plan, no plan change, wallet funded 5000"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "flat@x.com", billing_anchor_day: 1, initial_credit_cents: 5000 }
              as: AccountOwner
              captures: { acct_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/invoice"
              payload: { expected_account_version: "${v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { charge: $.data.period_charge_cents, adj: $.data.proration_adjustment_cents, wallet: $.data.wallet_credit_cents }
          assert:
            - "data.period_charge_cents == 1000"
            - "data.proration_adjustment_cents == 0"
            - "data.wallet_credit_cents == 4000"
            - "data.billing_status == INVOICED"

      - name: rating_ceiling_tightened_by_control
        claim_type: Variant Divergence
        grounds: [calculations.rating_ceiling, entities.Profile.fields.max_rating_allowed]
        distinguishing_aspect: "An ADULT profile (default NC17) given a ParentalControl max_rating=PG13 recomputes max_rating_allowed to PG13 (the stricter MIN wins)."
        test_recipe:
          setup: ["ADULT profile, then a parental control with max_rating PG13"]
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 1000, max_profiles: 6, concurrent_stream_cap: 4, max_registered_devices: 8, download_quota_per_profile: 10, ad_free: true, hd_offline_allowed: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", owner_email: "tighten@x.com", billing_anchor_day: 1 }
              as: AccountOwner
              captures: { acct_id: $.data.id }
            - call: "POST /profiles"
              payload: { account_id: "${acct_id}", display_name: "P", kind: "ADULT" }
              as: AccountOwner
              as_user_id: "${acct_id}"
