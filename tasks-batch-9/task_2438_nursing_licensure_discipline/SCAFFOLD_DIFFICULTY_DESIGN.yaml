  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: renewal_submit_state_check_beats_unpaid_fee_check
        grounds:
          - validations[priority=11]
          - validations[priority=35]
          - errors.ERR_LICENSE_NOT_RENEWABLE
          - errors.ERR_RENEWAL_FEE_UNPAID
        distinguishing_aspect: |
          Two rules are violated by the same submit call: the license is INACTIVE (priority 11,
          state, 409) and the renewal fee was never paid (priority 35, business_fiscal, 402).
          The state check at priority 11 must win, so the caller sees 409
          ERR_LICENSE_NOT_RENEWABLE and never the 402. Both violations are independently
          reachable, so the ordering is the only thing under test.
        test_recipe:
          setup:
            - "The nurse holds an RN license issued 2026-08-01 expiring 2028-08-01."
            - "A DRAFT renewal is created against it while the license is still ACTIVE, and one accredited 1800-minute LIVE_CONTACT record dated 2027-06-01 is attached and VERIFIED, so the CE requirement of 30.00 hours would be satisfied and priority 34 cannot fire."
            - "No payment call is made, so fee_applied_cents and fee_paid_cents are both 0 and priority 35 is violated."
            - "The license is then moved to INACTIVE, violating priority 11 as well."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-61", program_name: "Wooster BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8300, approval_expires_on: "2032-01-01T00:00:00Z" }
