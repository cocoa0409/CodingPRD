  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: forecast_approve_correct_version_succeeds_and_supersedes
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[forecast-approve-stale-client]", "state_machines.CashFlowForecast.DRAFT_to_APPROVED", "entities.CashFlowForecast.fields.status"]
        distinguishing_aspect: "Approving forecast f2 with the CURRENT client version (after f1's approval) succeeds (200), supersedes f1 to SUPERSEDED, and bumps Client.version. Positive OCC path complementing the §1.8 stale-version rejection."
        test_recipe:
          setup: ["Client covenant_floor_cents=0 has f1 already APPROVED and f2 in DRAFT."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "OccOK Co", state_code: "CA", retainer_tier: "GROWTH", covenant_floor_cents: 0 }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 1000000 }
              as: CFO
              captures: { f1: $.data.id }
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 2000000 }
              as: CFO
              captures: { f2: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver1: $.data.version }
            - call: "POST /forecasts/${f1}/approve"
              payload: { expected_client_version: "${cver1}" }
              as: CFO
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver2: $.data.version }
          trigger:
            - call: "POST /forecasts/${f2}/approve"
              payload: { expected_client_version: "${cver2}" }
              as: CFO
          assert:
            - "response status == 200"
            - "CashFlowForecast.${f2}.status == APPROVED"
            - "CashFlowForecast.${f1}.status == SUPERSEDED"

      - name: derived_open_close_count_reconciled_on_finalize
        claim_type: derived_field_reconciliation
        grounds: [entities.Client.fields.open_close_count, state_machines.MonthlyClose.READY_FOR_REVIEW_to_FINALIZED]
        distinguishing_aspect: "open_close_count is 1 after opening a close and reconciles back to 0 after that close is FINALIZED."
        test_recipe:
          setup: ["A client opens one MonthlyClose, completes its single task, approves review, then finalizes."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Occ2 Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 3, txn_count: 10 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Reconcile", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
            - call: "POST /monthly-closes/${mc}/approve-review"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /monthly-closes/${mc}/finalize"
              payload: {}
              as: CFO
          assert:
            - "Client.${cid}.open_close_count == 0"
            - "MonthlyClose.${mc}.status == FINALIZED"

      - name: request_changes_reopens_named_done_task
        claim_type: cascading_side_effects
        grounds: [state_machines.MonthlyClose.READY_FOR_REVIEW_to_REOPENED, calculations.close_completion_pct]
        distinguishing_aspect: "request-changes on a READY_FOR_REVIEW close with changed_task_names=['Reconcile'] reopens that DONE task to PENDING, drops completion_pct below 100, sets status REOPENED and review_status CHANGES_REQUESTED."
        test_recipe:
          setup: ["A close has two DONE tasks (each weight 1) and is READY_FOR_REVIEW with review_status UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Reopen Co", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 4, txn_count: 10 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Reconcile", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Review", weight: 1 }
              as: Bookkeeper
              captures: { t2: $.data.id }
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
            - call: "POST /close-tasks/${t2}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
          trigger:
            - call: "POST /monthly-closes/${mc}/request-changes"
              payload: { changed_task_names: ["Reconcile"] }
              as: CFO
          assert:
            - "MonthlyClose.${mc}.status == REOPENED"
            - "MonthlyClose.${mc}.review_status == CHANGES_REQUESTED"
            - "MonthlyClose.${mc}.completion_pct == 50.00"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: error_invalid_state_on_double_cancel_catchup
        claim_type: invalid_transition
        grounds: [state_machines.CatchupProject.DRAFT_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / offboard_cancels_catchup_clears_active_flag
          rationale: "Catch-up cancellation and its terminal-lock behavior are exercised via the offboard cascade; double-cancel reduces to the same ERR_INVALID_STATE terminal-lock claim already realized there."
      - name: error_stale_version_retainer_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: optimistic_concurrency / retainer_issue_stale_client_version_rejected
          rationale: "ERR_STALE_VERSION on retainer issuance is asserted directly by the named §1.8 OCC instance."
      - name: error_pay_period_overlap_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAY_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / payroll_period_half_open_overlap_rejected
          rationale: "ERR_PAY_PERIOD_OVERLAP is the asserted failure of the named §1.8 overlap instance."
