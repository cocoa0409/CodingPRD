            - call: "POST /itineraries/${it_14}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0014" }
              as: SalesAssociate
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0015", nationality_code: "CN", boarding_pass_barcode: "BP-0015", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T11:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
