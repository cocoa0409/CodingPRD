            - { call: "POST /api/equipment-sales/${s2}/confirm", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/equipment-sales/${s2}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-10T10:30:00Z", window_end: "2026-08-10T11:30:00Z" }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "POST /api/equipment-sales/${s2}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T13:00:00Z" }, as: SalesRep, captures: { s2st: $.data.status } }
          assert:
            - "Both dispatches selected technician ${t1} (j1tech == j2tech == ${t1}); the 11:00-12:00 dispatch succeeded despite the adjacent 10:00-11:00 job"
            - "Install 10:30-11:30 rejected with ERR_TECHNICIAN_SCHEDULE_CONFLICT (true half-open overlap with the 10:00-11:00 job)"
            - "Install 12:00-13:00 accepted (touching the 11:00-12:00 job's end is NOT an overlap under half-open semantics); S2 status == INSTALL_SCHEDULED"

      - name: practice_install_bay_closed_interval_overlap
        grounds:
          - validations[priority=19]
          - state_machines.EquipmentSale.CONFIRMED_to_INSTALL_SCHEDULED
        distinguishing_aspect: |
          Resource = Practice install bay, interval semantics = CLOSED
          [start, end] (touching endpoints DO conflict) — a different resource
          and different interval arithmetic than the technician's half-open rule.
        test_recipe:
          setup:
            - "Practice P; EQUIPMENT product; technicians TA and TB (INSTALL, region R1)"
            - "Sale S1 CONFIRMED with install scheduled TA 2026-08-12 09:00-12:00"
            - "Sale S2 CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Bay", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-8", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "TA", region: "R1", certifications: ["INSTALL"] }, as: DistributionAdmin, captures: { ta: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "TB", region: "R1", certifications: ["INSTALL"] }, as: DistributionAdmin, captures: { tb: $.data.id } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s1: $.data.id } }
            - { call: "POST /api/equipment-sales/${s1}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s1}/schedule-install", payload: { technician_id: "${ta}", window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 800000 }, as: SalesRep, captures: { s2: $.data.id } }
            - { call: "POST /api/equipment-sales/${s2}/confirm", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/equipment-sales/${s2}/schedule-install", payload: { technician_id: "${tb}", window_start: "2026-08-12T12:00:00Z", window_end: "2026-08-12T15:00:00Z" }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "POST /api/equipment-sales/${s2}/schedule-install", payload: { technician_id: "${tb}", window_start: "2026-08-12T12:01:00Z", window_end: "2026-08-12T15:00:00Z" }, as: SalesRep, captures: { s2st: $.data.status } }
          assert:
            - "Install 12:00-15:00 rejected with ERR_INSTALL_WINDOW_CONFLICT (closed intervals share the endpoint 12:00)"
            - "Install 12:01-15:00 accepted; S2 status == INSTALL_SCHEDULED"
            - "Contrast pinned: same touching window is legal on the technician resource (half-open) but illegal on the practice bay (closed)"

  - rule_id: compensating_invariant
    instances:
      - name: credit_submit_cancel_conservation
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.Practice.fields.credit_available_cents
        distinguishing_aspect: |
          Conserved quantity = practice credit (money): invariant
          credit_available_cents + sum(total_cents of SUBMITTED orders) ==
          credit_limit_cents; submit debits 60000 and cancel restores it with
          zero drift.
        test_recipe:
          setup:
            - "Practice P credit_limit 100000 (credit_available 100000); product C price 60000"
            - "Order O = C x 1, total 60000, in DRAFT"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Inv", region: "R1", credit_limit_cents: 100000 }, as: DistributionAdmin, captures: { p: $.data.id, avail0: $.data.credit_available_cents } }
            - { call: "POST /api/products", payload: { sku: "C-5", name: "Kit", kind: "CONSUMABLE", unit_price_cents: 60000, manufacturer: "M" }, as: DistributionAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/orders", payload: { practice_id: "${p}", kind: "MANUAL", lines: [ { product_id: "${c}", quantity: 1 } ] }, as: SalesRep, captures: { o: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${o}/submit", payload: {}, as: SalesRep }
            - { call: "GET /api/practices/${p}", payload: {}, as: DistributionAdmin, captures: { avail1: $.data.credit_available_cents } }
            - { call: "POST /api/orders/${o}/cancel", payload: {}, as: SalesRep }
            - { call: "GET /api/practices/${p}", payload: {}, as: DistributionAdmin, captures: { avail2: $.data.credit_available_cents } }
          assert:
            - "credit_available_cents before == 100000, after submit == 40000, after cancel == 100000"
            - "Invariant holds at every step: credit_available_cents + sum(SUBMITTED order totals) == credit_limit_cents (100000 + 0, 40000 + 60000, 100000 + 0)"

      - name: van_stock_resolve_reopen_conservation
        grounds:
          - state_machines.ServiceTicket.DISPATCHED_to_RESOLVED
          - state_machines.ServiceTicket.RESOLVED_to_OPEN
          - entities.Technician.fields.van_stock
        distinguishing_aspect: |
          Conserved quantity = physical part units on the van (count, not
          money): quantity_on_van + sum(parts consumed by tickets currently in
          RESOLVED/CLOSED for this technician) == loaded quantity; resolve
          debits 2 and reopen restores them with zero drift.
        test_recipe:
          setup:
            - "Practice P region R1; EQUIPMENT product warranty 12; PART product PT price 15000"
            - "Technician T1 (INSTALL+REPAIR, R1) with van loaded PT x 10 (min 1)"
            - "Sale ACCEPTED; ticket assessed WARRANTY and dispatched to T1; resolved with parts [PT x 2] labor 10"
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Van", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-3", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "PT-9", name: "Valve", kind: "PART", unit_price_cents: 15000, manufacturer: "M" }, as: DistributionAdmin, captures: { pt: $.data.id } }
            - { call: "POST /api/technicians", payload: { name: "T1", region: "R1", certifications: ["INSTALL", "REPAIR"] }, as: DistributionAdmin, captures: { t1: $.data.id } }
            - { call: "PUT /api/technicians/${t1}/van-stock", payload: { product_id: "${pt}", quantity_on_van: 10, min_quantity: 1 }, as: DistributionAdmin, captures: { vs0: $.data.van_stock } }
            - { call: "POST /api/equipment-sales", payload: { practice_id: "${p}", product_id: "${eq}", sale_price_cents: 900000 }, as: SalesRep, captures: { s: $.data.id } }
            - { call: "POST /api/equipment-sales/${s}/confirm", payload: {}, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/schedule-install", payload: { technician_id: "${t1}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: SalesRep }
            - { call: "POST /api/equipment-sales/${s}/complete-install", payload: {}, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/complete-training", payload: { training_minutes: 30 }, as: FieldTechnician, as_user_id: "${t1}" }
            - { call: "POST /api/equipment-sales/${s}/accept", payload: {}, as: PracticeManager, as_user_id: "${p}" }
            - { call: "POST /api/service-tickets", payload: { practice_id: "${p}", equipment_sale_id: "${s}", issue_description: "drip" }, as: ServiceDispatcher, captures: { k: $.data.id } }
            - { call: "POST /api/service-tickets/${k}/assess-coverage", payload: {}, as: ServiceDispatcher }
            - { call: "POST /api/service-tickets/${k}/dispatch", payload: { scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:00:00Z" }, as: ServiceDispatcher, captures: { jtech: $.data.technician_id } }
            - { call: "POST /api/service-tickets/${k}/resolve", payload: { parts_used: [ { product_id: "${pt}", quantity: 2 } ], labor_minutes: 10 }, as: FieldTechnician, as_user_id: "${jtech}" }
            - { call: "GET /api/technicians/${t1}", payload: {}, as: DistributionAdmin, captures: { vs1: $.data.van_stock } }
          trigger:
            - { call: "POST /api/service-tickets/${k}/reopen", payload: {}, as: PracticeManager, as_user_id: "${p}", captures: { kst: $.data.status, kdue: $.data.customer_due_cents } }
            - { call: "GET /api/technicians/${t1}", payload: {}, as: DistributionAdmin, captures: { vs2: $.data.van_stock } }
          assert:
            - "van_stock[PT].quantity_on_van == 10 after load, == 8 after resolve, == 10 after reopen (forward + compensating action conserve the loaded count)"
            - "Ticket ${k}.status == OPEN and customer_due_cents cleared to null after reopen"
            - "Invariant: quantity_on_van (10) + parts held by RESOLVED/CLOSED tickets (0) == loaded 10"
