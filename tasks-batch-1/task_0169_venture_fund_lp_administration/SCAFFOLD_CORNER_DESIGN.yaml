              payload: { name: "Derived Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { drf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${drf_id}", lp_id: "${drlp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { drc_id: "$.data.id" }
            - call: "POST /commitments/${drc_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${drf_id}"
              payload: {}
              as: FundManager
              captures: { drf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${drf_id}", purpose: "INVESTMENT", called_amount_cents: 5000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${drf_v1}" }
              as: FundManager
              captures: { dr_call_id: "$.data.id" }
            - call: "GET /capital-calls/${dr_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { dr_alloc_id: "$.data[0].id", dr_alloc_amt: "$.data[0].allocated_amount_cents" }
          trigger:
            - call: "POST /capital-call-allocations/${dr_alloc_id}/fund"
              payload: { paid_amount_cents: "${dr_alloc_amt}" }
              as: FundAdministrator
              captures: { dr_alloc_status: "$.data.status" }
          assert:
            - "Commitment.${drc_id}.drawn_cents == 5000000"
            - "Commitment.${drc_id}.unfunded_cents == 0"

