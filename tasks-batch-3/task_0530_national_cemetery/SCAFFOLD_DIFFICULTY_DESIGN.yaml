              payload: {}
              as: SchedulingClerk
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/release-plot"
              payload: {}
              as: SchedulingClerk
            - call: "GET /registry/sections/${sec_id}"
              payload: {}
              as: SchedulingClerk
          assert:
            - "Section.${sec_id}.capacity_units == 1"
            - "Section.${sec_id}.available_units == 1"
            - "Section.${sec_id}.interred_units == 0"
            - "Gravesite.${grv_id}.status == AVAILABLE"

      - name: honors_confirm_cancel_conserves_daily_squad_count
        grounds:
          - state_machines.MilitaryHonors.REQUESTED_to_CONFIRMED
          - state_machines.MilitaryHonors.CONFIRMED_to_CANCELLED
          - calculations.honors_capacity
        distinguishing_aspect: |
          Conserved quantity #2 = the daily confirmed-honors count on a honors_date (a different global
          quantity than section inventory). confirm (forward) raises confirmed_today by 1 and cancel
          (compensating) lowers it by 1, so after confirm+cancel a fresh confirm on the SAME date with
          capacity=1 succeeds — the daily slot was fully released with no drift.
        test_recipe:
          setup:
            - "US cemetery honors_squad_capacity=1, IN_GROUND section with two STANDARD gravesites; two VETERAN cases approved, assigned, scheduled on the SAME date 2026-06-10 with honors REQUESTED on both."
            - "Honors #1 CONFIRMED then CANCELLED (releasing the single daily slot)."
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "SlotConserve National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv1: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C2", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv2: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case1: $.data.id }
            - call: "POST /registry/burial-cases/${case1}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case1}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case1}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }
              as: SchedulingClerk
              captures: { sched1: $.data.id }
            - call: "POST /registry/military-honors"
              payload: { interment_schedule_id: "${sched1}", detail_size: "TWO_PERSON" }
              as: HonorsCoordinator
              captures: { hon1: $.data.id }
            - call: "POST /registry/military-honors/${hon1}/confirm"
              payload: {}
              as: HonorsCoordinator
            - call: "POST /registry/military-honors/${hon1}/cancel"
              payload: {}
              as: HonorsCoordinator
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case2: $.data.id }
            - call: "POST /registry/burial-cases/${case2}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case2}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case2}", window_start: "2026-06-10T14:00:00Z", window_end: "2026-06-10T15:00:00Z" }
              as: SchedulingClerk
              captures: { sched2: $.data.id }
            - call: "POST /registry/military-honors"
              payload: { interment_schedule_id: "${sched2}", detail_size: "TWO_PERSON" }
              as: HonorsCoordinator
              captures: { hon2: $.data.id }
          trigger:
            - call: "POST /registry/military-honors/${hon2}/confirm"
              payload: {}
              as: HonorsCoordinator
          assert:
            - "response status == 200"
            - "MilitaryHonors.${hon2}.status == CONFIRMED"
