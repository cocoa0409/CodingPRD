      - name: response_envelope_success_shape
        claim_type: retrieval
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; object endpoints use response_type object."
        test_recipe:
          setup: ["one institution exists"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id } }
          trigger:
            - { call: "GET /api/partner-institutions/${inst_id}", payload: {}, as: CoalitionAdmin }
          assert:
            - "Envelope has meta.api_request_id (string) and meta.api_request_timestamp (ISO8601)"
            - "response_type == object; data.id == ${inst_id}; data.version == 1"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected 401 before any role, existence, or state check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/partner-institutions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401 (not ERR_NOT_FOUND: auth outranks existence)"

      - name: unauthenticated_outranks_invalid_payload
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "A request that is both unauthenticated AND malformed returns ERR_UNAUTHENTICATED (priority 1 beats priority 3)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/partner-institutions"
              payload: { legal_name: "No Charter" }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401), not ERR_VALIDATION, despite the missing charter_type"

      - name: review_against_draft_standard_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_STANDARD_NOT_EFFECTIVE]"]
        distinguishing_aspect: "Creating a certification review against a standard still in DRAFT is rejected; only EFFECTIVE standards can anchor a review (version pinning starts at creation)."
        test_recipe:
          setup: ["standard created but never activated; institution registered"]
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
          trigger:
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STANDARD_NOT_EFFECTIVE (409); no review row created (GET /api/certification-reviews?institution_id=${inst_id} -> total_count == 0)"

      - name: book_to_cancelled_event_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_NOT_BOOKABLE]", state_machines.AccountOpeningEvent]
        distinguishing_aspect: "Booking onto a CANCELLED event fails with ERR_EVENT_NOT_BOOKABLE; the referral stays DOCS_COMPLETE and booked_count stays 0."
        test_recipe:
          setup: ["CERTIFIED institution; event created then cancelled; documented participant with DOCS_COMPLETE referral"]
          setup_api_calls:
