          - errors[ERR_POSTURE_FORBIDS]
        distinguishing_aspect: "County registration is a SETUP-only operation: after CANDIDATES_LOCKED the same payload fails 409 ERR_POSTURE_FORBIDS."
        test_recipe:
          setup: ["Standard universe through CANDIDATES_LOCKED."]
          setup_api_calls:
