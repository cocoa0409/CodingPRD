  - rule_id: priority_pair_validation_conflict
    instances:
      - name: facility_safety_gate_outranks_price_floor_on_agreement_create
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_CLUB_NOT_OPERATIONAL]
          - errors[ERR_PRICE_BELOW_FLOOR]
          - endpoints[POST /franchise/agreements]
        conflict_pair:
          higher: { priority: 10, category: business_safety, error_id: ERR_CLUB_NOT_OPERATIONAL }
          lower: { priority: 15, category: business_fiscal, error_id: ERR_PRICE_BELOW_FLOOR }
        distinguishing_aspect: |
          business_safety (10) versus business_fiscal (15) on POST /franchise/agreements. One single
          request violates both: the home club is NON_COMPLIANT and SUSPENDED after a failing
          inspection, AND the quoted promotion drives gross dues to 3150 cents, below the template's
          3600-cent floor. Implementations that validate money before facility posture - the natural
          order if the pricing calculation is done first to know what to validate - return
          ERR_PRICE_BELOW_FLOOR. The second attempt, made after the remediation waiver has restored the
          club to OPEN/WATCH, proves the fiscal violation was genuinely present all along.
        test_recipe:
          setup:
            - "One franchisee, one OPEN CA club opened 2021-06-01 (standard 60-month refresh cycle) and one PUBLISHED CORE12 template with monthly_dues_cents 4500 and floor_price_cents 3600."
            - "An APPROVED 30 percent promotion for that (franchisee, plan) whose window 2026-08-01..2026-08-31 contains the logical clock date 2026-08-01. 4500 - round_half_up(4500 * 0.30) = 4500 - 1350 = 3150, which is below the 3600 floor."
            - "One member registered at that club."
            - "An inspection dated 2026-07-15 scored 60/60/60 with a 60-month equipment floor: refresh_pts 0, score 51, so the club is NON_COMPLIANT and SUSPENDED and the inspection sits in REMEDIATION_REQUIRED. The franchisee's streak is 1 and its compliance_score is 80, so it stays ACTIVE."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Crestwood Fitness LLC", contact_email: "ops@crestwoodfit.example", royalty_rate_bps: 650, national_account_eligible: false }
