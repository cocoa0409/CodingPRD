              as: Anonymous
              captures: { payer2_id: $.data.id }
          trigger:
            - call: "GET /portal/payers/${payer_id}"
              payload: {}
              as: Payer
              as_user_id: "${payer2_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /portal/payers/${payer_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "payer2's read returns 403 and err_id == ERR_NOT_RESOURCE_OWNER"
            - "PlatformAdmin's read returns 200 with email == \"pat@example.com\""

      - name: anonymous_cannot_get_agency
        claim_type: Violation → Error
        grounds:
          - roles.Anonymous
          - endpoints.GET_/portal/agencies/{id}
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "Anonymous is declared for registration only; any read endpoint denies it 403 even with a well-formed id."
        test_recipe:
          setup:
