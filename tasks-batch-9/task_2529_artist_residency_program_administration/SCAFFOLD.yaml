      - "recomputes Studio.reserved_resident_days and active_assignment_count, and sets Residency.assigned_studio_code"
      - "increments Studio.version by 1 and Residency.version by 1"
      - "rejects with ERR_STALE_VERSION (412) when expected_residency_version does not match"

  - method: GET
    path: "/studio-assignments"
    description: "Lists studio occupancies (reverse reachability for studio_id and residency_id)."
    roles: [FacilitiesManager, ProgramAdmin, Funder]
    code: 200
    input: ["studio_id?", "residency_id?", "status?", "selection_mode?", "limit?", "offset?"]
    output: StudioAssignment[]
    side_effects: []

  - method: GET
    path: "/studio-assignments/{id}"
    description: "Reads one studio occupancy record."
    roles: [FacilitiesManager, ProgramAdmin, Funder]
    code: 200
