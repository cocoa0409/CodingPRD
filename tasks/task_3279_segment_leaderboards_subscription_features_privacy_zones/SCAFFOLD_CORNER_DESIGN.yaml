  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: rank_tie_broken_by_created_at
        claim_type: correct_result
        grounds: [calculations.effort_rank_snapshot]
        distinguishing_aspect: "Two ELIGIBLE efforts with identical elapsed_time_s rank 1 and 2 in created_at order — the tie-break is created_at ASC, never id."
        test_recipe:
          setup: ["Athletes RT1 (creator) and RT2 exist; segment RT: RUN 1000m ACTIVE; two different athletes uploaded 100s efforts (RT2 first, then RT3)"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "rt1@x.com", display_name: "RT1", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rt1: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "rt2@x.com", display_name: "RT2", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rt2: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "rt3@x.com", display_name: "RT3", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rt3: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${rt1}", name: "Tie Run", sport_type: "RUN", start_lat: 53.00, start_lng: -138.00, end_lat: 53.01, end_lng: -138.00, distance_m: 1000, city: "Tieville" }
              as: Athlete
              as_user_id: "${rt1}"
              captures: { seg_rt: $.data.id }
            - call: "POST /v1/segments/${seg_rt}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${rt1}"
            - call: "POST /v1/athletes/${rt2}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 53.00, lng: -138.00, t_offset_s: 0}, {lat: 53.01, lng: -138.00, t_offset_s: 100}], start_lat: 53.00, start_lng: -138.00, end_lat: 53.01, end_lng: -138.00, idempotency_key: "rt-a", effort_hints: [{segment_id: "${seg_rt}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${rt2}"
              captures: { act_rt2: $.data.id }
            - call: "POST /v1/athletes/${rt3}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T07:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 53.00, lng: -138.00, t_offset_s: 0}, {lat: 53.01, lng: -138.00, t_offset_s: 100}], start_lat: 53.00, start_lng: -138.00, end_lat: 53.01, end_lng: -138.00, idempotency_key: "rt-b", effort_hints: [{segment_id: "${seg_rt}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${rt3}"
              captures: { act_rt3: $.data.id }
          trigger:
            - call: "GET /v1/segments/${seg_rt}/leaderboard"
              as: Athlete
              as_user_id: "${rt1}"
              captures: { rk_first: "$.data[0].rank_snapshot", rk_second: "$.data[1].rank_snapshot", ath_first: "$.data[0].athlete_id" }
          assert:
            - "Leaderboard row 0: athlete_id == ${rt2} (earlier-created effort) with rank_snapshot == 1"
            - "Leaderboard row 1: athlete_id == ${rt3} with rank_snapshot == 2"

      - name: effort_exclusion_recomputes_ranks
        claim_type: correct_result
        grounds: [calculations.effort_rank_snapshot, state_machines.SegmentEffort]
        distinguishing_aspect: "When the rank-1 effort is EXCLUDED by an upheld flag, the remaining effort's rank_snapshot recomputes from 2 to 1."
        test_recipe:
          setup: ["Segment RX RUN 1000m ACTIVE; athlete A uploaded 90s effort (rank 1), athlete B uploaded 100s effort (rank 2); athlete C flagged A's effort"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "rx_a@x.com", display_name: "RX A", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rx_a: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "rx_b@x.com", display_name: "RX B", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rx_b: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "rx_c@x.com", display_name: "RX C", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rx_c: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${rx_c}", name: "Recompute Run", sport_type: "RUN", start_lat: 54.00, start_lng: -139.00, end_lat: 54.01, end_lng: -139.00, distance_m: 1000, city: "Recompville" }
              as: Athlete
              as_user_id: "${rx_c}"
              captures: { seg_rx: $.data.id }
            - call: "POST /v1/segments/${seg_rx}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${rx_c}"
            - call: "POST /v1/athletes/${rx_a}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 90, distance_m: 1000, track_points: [{lat: 54.00, lng: -139.00, t_offset_s: 0}, {lat: 54.01, lng: -139.00, t_offset_s: 90}], start_lat: 54.00, start_lng: -139.00, end_lat: 54.01, end_lng: -139.00, idempotency_key: "rx-a", effort_hints: [{segment_id: "${seg_rx}", elapsed_time_s: 90, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${rx_a}"
              captures: { act_rx_a: $.data.id }
            - call: "POST /v1/athletes/${rx_b}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T07:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 54.00, lng: -139.00, t_offset_s: 0}, {lat: 54.01, lng: -139.00, t_offset_s: 100}], start_lat: 54.00, start_lng: -139.00, end_lat: 54.01, end_lng: -139.00, idempotency_key: "rx-b", effort_hints: [{segment_id: "${seg_rx}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${rx_b}"
              captures: { act_rx_b: $.data.id }
            - call: "GET /v1/efforts?activity_id=${act_rx_a}"
              as: Athlete
              as_user_id: "${rx_a}"
              captures: { eff_rx_a: "$.data[0].id" }
            - call: "GET /v1/efforts?activity_id=${act_rx_b}"
              as: Athlete
              as_user_id: "${rx_b}"
              captures: { eff_rx_b: "$.data[0].id", rk_b0: "$.data[0].rank_snapshot" }
            - call: "POST /v1/efforts/${eff_rx_a}/flags"
              payload: { reporter_id: "${rx_c}", reason: "VEHICLE_ASSISTED" }
              as: Athlete
              as_user_id: "${rx_c}"
              captures: { fl_rx: $.data.id }
          trigger:
            - call: "POST /v1/flags/${fl_rx}/uphold"
              payload: {}
              as: Moderator
            - call: "GET /v1/efforts/${eff_rx_b}"
              as: Athlete
              as_user_id: "${rx_b}"
              captures: { rk_b1: $.data.rank_snapshot }
          assert:
            - "Before uphold: effort B rank_snapshot == 2"
            - "After A's effort EXCLUDED: effort B rank_snapshot == 1"

      - name: category_correction_excludes_efforts
        claim_type: correct_result
        grounds: [state_machines.SegmentEffort, entities.Activity.fields.corrected_sport_type]
        distinguishing_aspect: "Correcting an activity's category from RUN to RIDE excludes its effort on a RUN segment with exclusion_reason CATEGORY_MISMATCH and drops the effort from the leaderboard."
        test_recipe:
          setup: ["Athlete CC (owner) created segment CR RUN 1000m ACTIVE; athlete CA uploaded RUN activity with 100s effort on CR (ELIGIBLE)"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "cc_c@x.com", display_name: "CC C", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { cc_c: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "ca_c@x.com", display_name: "CA C", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ca_c: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${cc_c}", name: "Correction Run", sport_type: "RUN", start_lat: 55.00, start_lng: -140.00, end_lat: 55.01, end_lng: -140.00, distance_m: 1000, city: "Correctville" }
              as: Athlete
              as_user_id: "${cc_c}"
              captures: { seg_cc: $.data.id }
            - call: "POST /v1/segments/${seg_cc}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${cc_c}"
            - call: "POST /v1/athletes/${ca_c}/activities"
              payload: { device_source: "mobile-app", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 55.00, lng: -140.00, t_offset_s: 0}, {lat: 55.01, lng: -140.00, t_offset_s: 100}], start_lat: 55.00, start_lng: -140.00, end_lat: 55.01, end_lng: -140.00, idempotency_key: "cc-1", effort_hints: [{segment_id: "${seg_cc}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${ca_c}"
              captures: { act_cc: $.data.id }
            - call: "GET /v1/efforts?activity_id=${act_cc}"
              as: Athlete
              as_user_id: "${ca_c}"
              captures: { eff_cc: "$.data[0].id", fs_cc0: "$.data[0].flag_status" }
          trigger:
            - call: "POST /v1/activities/${act_cc}/correct_category"
              payload: { corrected_sport_type: "RIDE" }
              as: Athlete
              as_user_id: "${ca_c}"
            - call: "GET /v1/efforts/${eff_cc}"
              as: Athlete
              as_user_id: "${ca_c}"
              captures: { fs_cc1: $.data.flag_status, rs_cc1: $.data.exclusion_reason }
          assert:
            - "Before correction: effort flag_status == ELIGIBLE"
            - "After correction to RIDE: effort flag_status == EXCLUDED with exclusion_reason == CATEGORY_MISMATCH (RUN segment cannot hold a RIDE effort)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: existence_beats_state_on_cancelled_event_rejoin
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Rejoin with a bogus rsvp id on a CANCELLED event violates both existence (priority 3) and state (priority 5) — ERR_NOT_FOUND must win."
        test_recipe:
          setup: ["Athlete VO owns club VC, segment VS ACTIVE, event VE created then cancelled"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "vo_v@x.com", display_name: "VO V", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { vo_v: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${vo_v}", name: "Ghost Sprint", sport_type: "RIDE", start_lat: 56.00, start_lng: -141.00, end_lat: 56.01, end_lng: -141.00, distance_m: 1000, city: "Ghostville" }
              as: Athlete
              as_user_id: "${vo_v}"
              captures: { seg_v: $.data.id }
            - call: "POST /v1/segments/${seg_v}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${vo_v}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${vo_v}", name: "Ghost Club", sport_type: "RIDE", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${vo_v}"
              captures: { club_v: $.data.id }
            - call: "POST /v1/clubs/${club_v}/events"
              payload: { name: "Ghost Race", segment_id: "${seg_v}", scheduled_at: "2026-09-06T09:00:00Z", capacity: 3 }
              as: Athlete
              as_user_id: "${vo_v}"
              captures: { ev_v: $.data.id }
            - call: "POST /v1/clubs/${club_v}/events/${ev_v}/cancel"
              payload: {}
              as: Athlete
              as_user_id: "${vo_v}"
          trigger:
            - call: "POST /v1/events/${ev_v}/rsvps/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/rejoin"
              payload: {}
              as: Athlete
              as_user_id: "${vo_v}"
              captures: { err_v: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (existence priority 3 beats state priority 5), HTTP 404"

      - name: safety_beats_fiscal_on_beacon_create
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=13]", "errors[ERR_SAFETY_VIOLATION]"]
        distinguishing_aspect: "Beacon creation by a FREE athlete with zero safety contacts violates both business_safety (7) and business_fiscal (13) — ERR_SAFETY_VIOLATION must win."
        test_recipe:
          setup: ["Athlete BF exists with no subscription and no safety contacts"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "bf_b@x.com", display_name: "BF B", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { bf_b: $.data.id }
          trigger:
            - call: "POST /v1/athletes/${bf_b}/beacon_sessions"
              payload: {}
              as: Athlete
              as_user_id: "${bf_b}"
              captures: { err_bf: $.data.error_id }
          assert:
            - "error_id == ERR_SAFETY_VIOLATION (safety priority 7 beats fiscal priority 13), HTTP 422"

      - name: leaderboard_free_tier_gated_at_limit_11
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_SUBSCRIPTION_REQUIRED]"]
        distinguishing_aspect: "FREE athlete reading a leaderboard with limit 11 is rejected with ERR_SUBSCRIPTION_REQUIRED (402); the same read with limit 10 succeeds — the gate trips on limit > 10 exactly."
        test_recipe:
          setup: ["Athlete LG owns segment LB RUN 1000m ACTIVE with one ELIGIBLE effort from athlete LH; LG has no subscription"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "lg_l@x.com", display_name: "LG L", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { lg_l: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "lh_l@x.com", display_name: "LH L", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { lh_l: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${lg_l}", name: "Gated Run", sport_type: "RUN", start_lat: 57.00, start_lng: -142.00, end_lat: 57.01, end_lng: -142.00, distance_m: 1000, city: "Gateville" }
              as: Athlete
              as_user_id: "${lg_l}"
              captures: { seg_lg: $.data.id }
            - call: "POST /v1/segments/${seg_lg}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${lg_l}"
            - call: "POST /v1/athletes/${lh_l}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 57.00, lng: -142.00, t_offset_s: 0}, {lat: 57.01, lng: -142.00, t_offset_s: 100}], start_lat: 57.00, start_lng: -142.00, end_lat: 57.01, end_lng: -142.00, idempotency_key: "lg-1", effort_hints: [{segment_id: "${seg_lg}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${lh_l}"
          trigger:
            - call: "GET /v1/segments/${seg_lg}/leaderboard?limit=10"
              as: Athlete
              as_user_id: "${lg_l}"
              captures: { lb_rows: $.data }
            - call: "GET /v1/segments/${seg_lg}/leaderboard?limit=11"
              as: Athlete
              as_user_id: "${lg_l}"
              captures: { err_lg: $.data.error_id }
          assert:
            - "limit=10 read succeeds for FREE athlete (HTTP 200)"
            - "limit=11 read rejected: error_id == ERR_SUBSCRIPTION_REQUIRED, HTTP 402"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
