  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: RentalRamp x InventoryUnit and
  # Quote x Case — different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rental_lifecycle_gated_by_inventory_unit_state
        grounds:
          - state_machines.RentalRamp.RESERVED_to_DELIVERED
          - state_machines.InventoryUnit.AVAILABLE_to_RESERVED
          - validations[priority=13]
          - errors[ERR_UNIT_UNAVAILABLE]
        distinguishing_aspect: |
          Entity pair RentalRamp x InventoryUnit: creating a RentalRamp against
          a unit that is not AVAILABLE (MAINTENANCE) is rejected, and the
          RESERVED->DELIVERED transition is only valid while the linked
          InventoryUnit sits in RESERVED — the ramp's legal moves depend on the
          unit's state, not just its own.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "InventoryUnit in MAINTENANCE state"
            - "Case in INTAKE state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-400", ramp_type: "MODULAR_ALUMINUM", length_feet: 20, width_inches: 36, weight_capacity_lbs: 750, monthly_rate_cents: 25000, purchase_price_cents: 450000 }
              as: LogisticsCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-units/${unit_id}/maintenance"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /cases"
              payload: { client_name: "Pia Quill", client_address: "43 Depend Dr", client_phone: "555-0113" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-01T00:00:00Z", rental_end: "2026-06-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /inventory-units/${unit_id}/return-to-service"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-01T00:00:00Z", rental_end: "2026-06-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ramp_id: $.data.id }
            - call: "GET /inventory-units/${unit_id}"
              as: Any
              captures: { unit_status: $.data.status }
            - call: "POST /cases/${case_id}/rental-ramps/${ramp_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /inventory-units/${unit_id}"
              as: Any
          assert:
            - "First rental create against MAINTENANCE unit: HTTP 409, error_id == ERR_UNIT_UNAVAILABLE"
            - "After return-to-service, rental create succeeds: RentalRamp.${ramp_id}.status == RESERVED"
            - "InventoryUnit.${unit_id}.status == RESERVED after ramp creation (cross-entity side effect)"
            - "After deliver: RentalRamp.${ramp_id}.status == DELIVERED and InventoryUnit.${unit_id}.status == DEPLOYED"

      - name: quote_creation_gated_by_case_assessed_state
        grounds:
          - state_machines.Case.ASSESSED_to_QUOTE_DRAFTED
          - validations[priority=4]
          - errors[ERR_CASE_NOT_ASSESSED]
        distinguishing_aspect: |
          Entity pair Quote x Case (distinct from instance 1's
          RentalRamp x InventoryUnit): POST quotes is legal only while the
          parent Case is ASSESSED; against an INTAKE case the same request is
          rejected with ERR_CASE_NOT_ASSESSED even with a current OCC version.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case in INTAKE state (no assessment)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Quinn Rhea", client_address: "54 Gate St", client_phone: "555-0114" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-110", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 2 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 2, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v2}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
          assert:
            - "Quote create on INTAKE case: HTTP 409, error_id == ERR_CASE_NOT_ASSESSED"
            - "After assessment completes: quote create returns 201"
            - "Quote.${quote_id}.status == DRAFT"
            - "Case.${case_id}.status == QUOTE_DRAFTED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: interior-intersection semantics on
  # InventoryUnit vs strict interval-precedence semantics on Inspection x
  # InstallationJob — different geometry, different resource entities.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlapping_rental_on_same_unit_rejected
        grounds:
          - validations[priority=13]
          - errors[ERR_UNIT_UNAVAILABLE]
          - entities.RentalRamp.fields.rental_start
          - entities.RentalRamp.fields.rental_end
        distinguishing_aspect: |
          Interior-intersection interval semantics on the InventoryUnit
          resource: a second rental whose [rental_start, rental_end) window
          (2026-05-15..2026-07-01) overlaps the interior of an existing active
          rental (2026-05-01..2026-06-01) on the same unit is rejected with
          ERR_UNIT_UNAVAILABLE.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "InventoryUnit AVAILABLE; case exists; rental ramp 1 RESERVED for 2026-05-01..2026-06-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-500", ramp_type: "MODULAR_ALUMINUM", length_feet: 18, width_inches: 36, weight_capacity_lbs: 700, monthly_rate_cents: 22000, purchase_price_cents: 420000 }
              as: LogisticsCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /cases"
              payload: { client_name: "Ross Sill", client_address: "65 Overlap Ave", client_phone: "555-0115" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-01T00:00:00Z", rental_end: "2026-06-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ramp1_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/rental-ramps"
              payload: { inventory_unit_id: "${unit_id}", rental_start: "2026-05-15T00:00:00Z", rental_end: "2026-07-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /cases/${case_id}/rental-ramps/${ramp1_id}"
              as: Any
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_UNIT_UNAVAILABLE"
            - "RentalRamp.${ramp1_id}.status == RESERVED (unaffected)"
            - "InventoryUnit.${unit_id}.status remains RESERVED"

      - name: final_inspection_before_job_completion_rejected
        grounds:
          - validations[priority=14]
          - errors[ERR_INSPECTION_BEFORE_COMPLETION]
          - entities.Inspection.fields.scheduled_date
          - entities.InstallationJob.fields.actual_end
        distinguishing_aspect: |
          Strict interval-precedence semantics on a different resource pair
          (Inspection x InstallationJob, vs instance 1's intersection on
          InventoryUnit): a FINAL inspection interval may not begin before the
          job's completion interval ends — while actual_end is null the
          precedence constraint is unsatisfiable and creation is rejected with
          ERR_INSPECTION_BEFORE_COMPLETION.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case FUNDING_APPROVED with quote APPROVED (total 20000 fully allocated)"
            - "InstallationJob IN_PROGRESS (started 2026-05-01, actual_end null)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Sara Trull", client_address: "76 Precedence Pl", client_phone: "555-0116" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-120", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 55, hazard_count: 2 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 55, hazard_count: 2, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", contingency_pct: 0.0, expected_case_version: "${case_v1}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Ramp kit", quantity: 1, unit: "each", unit_price_cents: 20000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "SELF_PAY", program_name: "Self", requested_cents: 20000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 20000, expected_case_version: "${case_v2}" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /cases/${case_id}/quotes/${quote_id}/start-review"
              payload: {}
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/allocations"
              payload: { quote_id: "${quote_id}", amount_cents: 20000, allocation_type: "QUOTE_LEVEL" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/approve"
              payload: {}
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/installation-jobs"
              payload: { quote_id: "${quote_id}", scheduled_start: "2026-05-01T00:00:00Z", scheduled_end: "2026-05-10T00:00:00Z", crew_lead_id: "crew-2" }
              as: ProjectManager
              captures: { job_id: $.data.id }
            - call: "POST /cases/${case_id}/installation-jobs/${job_id}/order-materials"
              payload: {}
              as: ProjectManager
            - call: "POST /cases/${case_id}/installation-jobs/${job_id}/start"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /cases/${case_id}/inspections"
              payload: { inspection_type: "FINAL", inspector_id: "insp-9", scheduled_date: "2026-05-02T00:00:00Z", installation_job_id: "${job_id}" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INSPECTION_BEFORE_COMPLETION (job.actual_end is null, so the FINAL inspection interval cannot follow the job interval)"
            - "InstallationJob.${job_id}.inspection_status == NOT_SCHEDULED (unchanged)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: funding-pool conservation vs billing-
  # ledger conservation — different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocation_commit_reverse_conserves_remaining_cents
        grounds:
          - state_machines.FundingAllocation.PENDING_to_COMMITTED
          - state_machines.FundingAllocation.COMMITTED_to_REVERSED
          - entities.FundingSource.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity = funding-source pool cents: the forward action
          (quote approve commits a 30000 allocation, remaining 50000 -> 20000)
          paired with its compensating action (allocation reverse) MUST restore
          FundingSource.remaining_cents to exactly approved_cents == 50000 —
          invariant remaining == approved - sum(COMMITTED allocations).
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case ASSESSED; quote total 30000 (contingency 0) SUBMITTED then UNDER_REVIEW"
            - "FundingSource APPROVED 50000; PENDING QUOTE_LEVEL allocation 30000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Tess Ullman", client_address: "87 Ledger Ln", client_phone: "555-0117" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-130", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 2 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 2, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", contingency_pct: 0.0, expected_case_version: "${case_v1}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Kit", quantity: 1, unit: "each", unit_price_cents: 30000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "VA_BENEFIT", program_name: "VA SAH", requested_cents: 50000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 50000, expected_case_version: "${case_v2}" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /cases/${case_id}/quotes/${quote_id}/start-review"
              payload: {}
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/allocations"
              payload: { quote_id: "${quote_id}", amount_cents: 30000, allocation_type: "QUOTE_LEVEL" }
              as: FundingCoordinator
              captures: { alloc_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/approve"
              payload: {}
              as: FundingCoordinator
            - call: "GET /cases/${case_id}/funding-sources/${fs_id}"
              as: Any
              captures: { remaining_after_commit: $.data.remaining_cents }
          trigger:
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/allocations/${alloc_id}/reverse"
              payload: {}
              as: FundingCoordinator
            - call: "GET /cases/${case_id}/funding-sources/${fs_id}"
              as: Any
          assert:
            - "After commit: FundingSource.remaining_cents == 20000 (50000 - 30000)"
            - "After reverse: FundingAllocation.${alloc_id}.status == REVERSED"
            - "After reverse: FundingSource.${fs_id}.remaining_cents == 50000 (exactly approved_cents — zero drift)"
            - "Case.${case_id}.total_funded_cents == 50000 (unchanged by commit/reverse pair)"

      - name: invoice_send_void_conserves_case_billing_ledger
        grounds:
          - state_machines.Invoice.DRAFT_to_SENT
          - state_machines.Invoice.SENT_to_VOID
          - entities.Case.fields.total_billed_cents
          - entities.Case.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity = case billing-ledger cents (distinct from
          instance 1's funding pool): send adds total_cents 20000 to
          total_billed_cents, and the compensating void MUST subtract exactly
          the same 20000, returning total_billed_cents and balance_due_cents
          to 0 with total_paid_cents untouched.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z"
            - "Case INTAKE with billing totals all zero"
            - "DRAFT invoice with one line (1 x 20000, tax 0) -> total 20000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Uma Voss", client_address: "98 Invoice Rd", client_phone: "555-0118" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/invoices"
              payload: { invoice_type: "INSTALLATION", due_date: "2026-06-01T00:00:00Z", expected_case_version: "${case_v1}" }
              as: BillingCoordinator
              captures: { inv_id: $.data.id }
            - call: "POST /cases/${case_id}/invoices/${inv_id}/line-items"
              payload: { description: "Install charge", quantity: 1, unit_price_cents: 20000, tax_rate_pct: 0.0 }
              as: BillingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/invoices/${inv_id}/send"
              payload: { expected_case_version: "${case_v2}" }
              as: BillingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { billed_after_send: $.data.total_billed_cents, balance_after_send: $.data.balance_due_cents }
          trigger:
            - call: "POST /cases/${case_id}/invoices/${inv_id}/void"
              payload: {}
              as: BillingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
            - call: "GET /cases/${case_id}/invoices/${inv_id}"
              as: Any
          assert:
            - "After send: Case.total_billed_cents == 20000 and Case.balance_due_cents == 20000"
            - "After void: Invoice.${inv_id}.status == VOID"
            - "After void: Case.${case_id}.total_billed_cents == 0 (send's +20000 exactly compensated)"
            - "After void: Case.${case_id}.balance_due_cents == 0 and Case.${case_id}.total_paid_cents == 0"
