- section: validations
  instances:
  - name: missing_role_header_rejected
    claim_type: Violation → Error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    distinguishing_aspect: A request whose X-User-Role header is empty fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER at priority 1, before role, existence, or business validation — even though the
      payload is otherwise valid.
    test_recipe:
      setup:
      - Clock 2026-09-01.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /gse/sellers
        payload:
          legal_name: No Header
          seller_number: S-NH
          net_worth_cents: 500000000
          qc_defect_rate_bps: 100
        as: null
        captures:
          e: $.data.error_id
      assert:
      - the create with an empty X-User-Role header returns e == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400) before any existence or business check runs
  - name: seller_approve_below_net_worth_rejected
    claim_type: Violation → Error
    grounds:
    - validations[priority=9]
    - errors[ERR_NET_WORTH_BELOW_MINIMUM]
    distinguishing_aspect: Seller approval requires net worth >= 2,500,000 cents; 2,499,999 fails with ERR_NET_WORTH_BELOW_MINIMUM while exactly 2,500,000 passes.
    test_recipe:
      setup:
      - 'Clock 2026-09-01. Two pending sellers: S_LOW net worth 2,499,999; S_OK net worth 2,500,000.'
      setup_api_calls:
      - *id001
      - call: POST /gse/sellers
        payload:
          legal_name: Thin Capital
          seller_number: S-LOW
          net_worth_cents: 2499999
          qc_defect_rate_bps: 100
        as: GseAdmin
        captures:
          slow: $.data.id
      - call: POST /gse/sellers
        payload:
          legal_name: Just Enough
          seller_number: S-OK
          net_worth_cents: 2500000
          qc_defect_rate_bps: 100
        as: GseAdmin
        captures:
          sok: $.data.id
      trigger:
      - call: POST /gse/sellers/${slow}/approve
        payload: {}
        as: GseAdmin
        captures:
          e: $.data.error_id
      - call: POST /gse/sellers/${sok}/approve
        payload: {}
        as: GseAdmin
        captures:
          st: $.data.status
      assert:
      - e == ERR_NET_WORTH_BELOW_MINIMUM (http 422) for the 2,499,999 seller
      - st == APPROVED for the exactly-at-minimum seller
