              payload: { station_id: "${st116}", unit_designation: "ENGINE-116", apparatus_type: "ENGINE", minimum_crew_size: 4, required_certifications: [], closure_priority: 10, closure_exempt: true }
              as: StaffingOfficer
              captures: { eng116: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st116}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh116: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh116}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh116_v: "$.data.version" }
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh115}/company-closure"
              payload: { expected_duty_shift_version: "${sh115_v}", justification: "short two riders" }
              as: StaffingOfficer
              captures: { err115: "$.data.error_id" }
            - call: "POST /fire-ops/duty-shifts/${sh116}/company-closure"
              payload: { expected_duty_shift_version: "${sh116_v}", justification: "nobody available at all" }
              as: StaffingOfficer
              captures: { err116: "$.data.error_id" }
          assert:
            - "SHORT SHIFT: HTTP 422 and error_id == \"ERR_CLOSURE_NOT_JUSTIFIED\"; DutyShift.${sh115}.staffing_posture == \"SHORT\", closed_apparatus_ids == [], version == ${sh115_v}"
            - "CRITICAL SHIFT: HTTP 422 and error_id == \"ERR_NO_CLOSURE_ELIGIBLE_COMPANY\"; DutyShift.${sh116}.staffing_posture == \"CRITICAL\", closed_apparatus_ids == [], version == ${sh116_v}"
            - "Neither station's required_staffing changes: 2 for ${st115}'s shift and 4 for ${st116}'s"

      - name: corner_priority_conflict_referential_scope_over_rotation
        claim_type: Priority conflict
        grounds:
          - validations[priority=9].rules.ERR_STATION_SCOPE_MISMATCH
          - validations[priority=10].rules.ERR_PLATOON_ROTATION_VIOLATION
        excluded_because:
          difficulty_instance: referential_scope_beats_temporal_rotation_on_cross_station_seat
          rationale: "The named §1.8 instance already seats a cross-station member on the wrong platoon and asserts that the priority-9 error is the one returned."

      - name: corner_priority_conflict_seat_capacity_over_budget_gate
        claim_type: Priority conflict
        grounds:
          - validations[priority=15].rules.ERR_APPARATUS_SEAT_CAPACITY_EXCEEDED
          - validations[priority=18].rules.ERR_OT_BUDGET_WOULD_EXCEED
        excluded_because:
          difficulty_instance: seat_capacity_safety_beats_fiscal_budget_gate_on_overtime_offer
          rationale: "The named §1.8 instance constructs an offer that violates both the seat ceiling and the budget and asserts the safety error wins."

      - name: corner_aggregate_validation_on_apparatus_seat_capacity
        claim_type: Aggregate validation
        grounds:
          - validations[priority=15].rules.ERR_APPARATUS_SEAT_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: apparatus_aggregate_seat_capacity_rejects_third_rider_on_two_seat_company
          rationale: "Individually-valid seats that only collectively breach the ceiling are exactly the named §1.8 instance's construction."

      - name: corner_cross_entity_validation_on_backfilled_leave_revocation
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=9].rules.ERR_LEAVE_ALREADY_BACKFILLED
        excluded_because:
          difficulty_instance: leave_revoke_blocked_by_filled_backfill_vacancy
          rationale: "Validity depending on another entity's state (the backfill vacancy being FILLED) is the named §1.8 instance's subject."

      - name: corner_temporal_validation_on_half_open_duty_intervals
        claim_type: Temporal validation
        grounds:
          - validations[priority=11].rules.ERR_DOUBLE_BOOKED_SHIFT
        excluded_because:
          difficulty_instance: firefighter_half_open_adjacent_tours_allowed_overlap_rejected
          rationale: "The allowed-adjacent versus rejected-overlap pair on one member is asserted in full by the named §1.8 instance."
  # ===========================================================================
  - section: endpoints
    instances:
      - name: apparatus_crud_create_read_and_filtered_list
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /fire-ops/apparatus"]
          - endpoints["GET /fire-ops/apparatus/{apparatus_id}"]
          - endpoints["GET /fire-ops/apparatus"]
          - response_envelope
        distinguishing_aspect: "The created company is readable by id and appears in a station-and-type filtered list with response_type \"array\" and total_count 1, while its sibling ladder is excluded — the filter narrows the collection rather than returning every company at the station."
        test_recipe:
          setup:
            - "Station 117 with two companies: ENGINE-117 (type ENGINE, crew 3) and LADDER-117 (type LADDER, crew 4)."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 117", battalion_code: "F6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st117: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st117}", unit_designation: "ENGINE-117", apparatus_type: "ENGINE", minimum_crew_size: 3, required_certifications: ["PARAMEDIC"], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng117: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st117}", unit_designation: "LADDER-117", apparatus_type: "LADDER", minimum_crew_size: 4, required_certifications: [], closure_priority: 30 }
              as: StaffingOfficer
              captures: { lad117: "$.data.id" }
            - call: "GET /fire-ops/apparatus/${eng117}"
              payload: {}
              as: CompanyOfficer
            - call: "GET /fire-ops/apparatus"
              payload: { station_id: "${st117}", apparatus_type: "ENGINE" }
              as: CompanyOfficer
              captures: { first117: "$.data[0].id" }
          assert:
            - "CREATE: HTTP 201 with meta.api_request_id and meta.api_request_timestamp present, response_type == \"object\""
            - "READ: HTTP 200 and the body echoes unit_designation \"ENGINE-117\", minimum_crew_size 3, required_certifications [\"PARAMEDIC\"], closure_priority 10, status \"IN_SERVICE\", closure_exempt false"
            - "LIST: response_type == \"array\", total_count == 1, has_more == false and ${first117} == ${eng117} — ${lad117} is filtered out"
            - "LIST: limit defaults to 10 and offset to 0 in the pagination fields"

      - name: trade_approval_transfers_the_seat_and_moves_the_hours_between_members
        claim_type: Action endpoint
        grounds:
          - state_machines.TradeRequest.COUNTERSIGNED_to_APPROVED
          - endpoints["POST /fire-ops/trade-requests/{trade_request_id}/decision"]
          - calculations.work_period_hour_ledger
        distinguishing_aspect: "APPROVE rewrites the existing seat in place — same ShiftAssignment id, firefighter_id now the counterparty and assignment_type TRADE — and moves exactly 24 hours from the requester's work period to the counterparty's, so assigned_headcount and certification coverage do not move at all."
        test_recipe:
          setup:
            - "Station 118 with floor 1 and one company ENGINE-118 (crew 1, no required certifications)."
            - "Three platoon C members: ff118a (Kelly 1, requester) holds the 24-hour REGULAR seat on the published 2026-08-11 shift, ff118b (Kelly 2, counterparty) holds nothing, ff118o (Kelly 3) is the deciding officer and is not a party to the trade."
            - "ff118a proposes the trade and ff118b countersigns it, both at the default clock of 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 118", battalion_code: "F6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st118: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st118}", unit_designation: "ENGINE-118", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng118: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st118}", full_name: "U Udall", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff118a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st118}", full_name: "V Voss", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff118b: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st118}", full_name: "W Wolfe", rank: "CAPTAIN", platoon: "C", seniority_rank: 9, kelly_day_cycle_position: 3, certifications: [], hourly_rate_cents: 5000 }
              as: StaffingOfficer
              captures: { ff118o: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st118}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh118: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh118}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh118_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh118}", firefighter_id: "${ff118a}", apparatus_id: "${eng118}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh118_v}" }
              as: CompanyOfficer
              as_user_id: "${ff118o}"
              captures: { asg118: "$.data.id" }
            - call: "POST /fire-ops/trade-requests"
              payload: { requesting_firefighter_id: "${ff118a}", counterparty_firefighter_id: "${ff118b}", duty_shift_id: "${sh118}" }
              as: Firefighter
              as_user_id: "${ff118a}"
              captures: { tr118: "$.data.id" }
            - call: "POST /fire-ops/trade-requests/${tr118}/countersign"
              payload: {}
              as: Firefighter
              as_user_id: "${ff118b}"
            - call: "GET /fire-ops/work-periods"
              payload: { firefighter_id: "${ff118a}" }
              as: PayrollAnalyst
              captures: { wp118a: "$.data[0].id" }
            - call: "GET /fire-ops/work-periods"
              payload: { firefighter_id: "${ff118b}" }
              as: PayrollAnalyst
              captures: { wp118b: "$.data[0].id" }
          trigger:
            - call: "POST /fire-ops/trade-requests/${tr118}/decision"
              payload: { decision: "APPROVE", note: "even swap, both qualified" }
              as: CompanyOfficer
              as_user_id: "${ff118o}"
          assert:
            - "HTTP 200, TradeRequest.${tr118}.status == \"APPROVED\", traded_assignment_id == ${asg118}, decided_by_user_id == ${ff118o}, revision_count == 0"
            - "ShiftAssignment.${asg118}.firefighter_id == ${ff118b} (same id, new occupant), assignment_type == \"TRADE\", status == \"SCHEDULED\", scheduled_hours == 24, projected_premium_cents == 0"
            - "WorkPeriod.${wp118a}.scheduled_hours == 0 and flsa_premium_cents == 0 — the requester's hours left"
            - "WorkPeriod.${wp118b}.scheduled_hours == 24 and flsa_premium_cents == 0 — the counterparty's hours arrived"
            - "DutyShift.${sh118}.assigned_headcount == 1, staffing_gap == 0, certification_gap_count == 0, status == \"STAFFED\", staffing_posture == \"FULLY_STAFFED\""
            - "Station.${st118}.ot_committed_cents == 0 — a trade is cost-neutral"

