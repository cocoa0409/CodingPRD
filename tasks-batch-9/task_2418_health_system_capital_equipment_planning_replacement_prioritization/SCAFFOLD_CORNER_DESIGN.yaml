      - name: asset_nominal_and_adjusted_variants_are_stored_side_by_side
        claim_type: variant_divergence
        grounds:
          - calculations.asset_ruls_score.variants
        excluded_because:
          difficulty_instance: asset_nominal_vs_adjusted_ruls_diverge_on_same_asset
          rationale: >-
            The §1.8 instance already pins both variants on one asset from a single service-event append
            and asserts that only the adjusted variant feeds the derate gate, the eligibility gate and the
            safety driver. There is nothing left for a corner instance to distinguish.

      - name: allocation_variant_is_selected_by_the_allocate_payload
        claim_type: variant_selection
        grounds:
          - calculations.facility_allocation_waterfall.variants
          - endpoints[POST /capital/cycles/{id}/allocate]
        excluded_because:
          difficulty_instance: allocation_pro_rata_vs_rank_ordered_diverge_on_same_score_set
          rationale: >-
            The §1.8 instance runs both variants over the identical two-facility score set, so the
            allocation_method input, the rank_order tie-breaks and the 1-cent remainder sweep are all
            already asserted with pinned literals.

      - name: five_year_tco_rounds_each_plan_year_before_summing
        claim_type: precision
        grounds:
          - calculations.five_year_tco.precision
        excluded_because:
          difficulty_instance: tco_per_year_rounding_order_pinned_on_service_escalation
          rationale: >-
            The §1.8 instance already contrasts the per-year rounding total against the round-once total
            on the escalating service stream, which is exactly the precision claim a corner instance
            would probe.

      - name: negotiated_price_steps_run_in_a_pinned_order
        claim_type: correct_result
        grounds:
          - calculations.negotiated_capital_price.formula
        excluded_because:
          difficulty_instance: quote_pricing_evaluation_order_pinned_tier_addendum_cap
          rationale: >-
            The §1.8 instance pins all six steps on one quote (tier from list price, addendum on the
            post-discount amount, trade-in cap on the subtotal), so the evaluation-order claim is covered
            with the same contract literals a corner instance would reuse.

      - name: funded_amount_reconciles_with_the_allocation_after_a_reversal
        claim_type: reconciliation
        grounds:
          - calculations.request_funded_amount
          - calculations.facility_allocation_waterfall.formula
        excluded_because:
          difficulty_instance: fund_then_withdraw_funding_conserves_allocation_capital
          rationale: >-
            The §1.8 instance already asserts the allocation invariant allocated + released ==
            committed + available across a fund / withdraw-funding round trip, which is the reconciliation
            a corner instance would restate.

  # =========================================================================
  # 4. From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_facility_code_and_duplicate_plan_year_return_duplicate_key
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - errors.ERR_DUPLICATE_KEY
        distinguishing_aspect: >-
          V09 guards three different unique keys with one error id: Facility.code and CapitalCycle.plan_year
          both return ERR_DUPLICATE_KEY at 409 (not ERR_VALIDATION at 422), and the duplicate is judged on
          the key alone — a second facility with a different code but the same name is accepted.
        test_recipe:
          setup:
            - "Facility NRH and cycle 2027 already exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.00, facility_contingency_pct: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital Annex", code: "NRH", region: "SOUTH" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_dup_code: $.data.error_id }
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-04-01T00:00:00Z", total_capital_cents: 900000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_dup_year: $.data.error_id }
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH-2", region: "NORTH" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_b_id: $.data.id }
          assert:
            - "${e_dup_code} == ERR_DUPLICATE_KEY at HTTP 409 and ${e_dup_year} == ERR_DUPLICATE_KEY at HTTP 409"
            - "Trigger step 3 returns HTTP 201: the duplicate name is irrelevant, only code is unique"
            - "GET /capital/facilities returns exactly 2 rows and GET /capital/cycles?plan_year=2027 exactly 1 row, still at total_capital_cents 500000000"

      - name: request_creation_body_rules_fire_in_priority_order_from_mismatch_to_cap_to_mandate
        claim_type: violation_to_error
        grounds:
          - validations[priority=46]
          - validations[priority=47]
          - validations[priority=48]
          - errors.ERR_ASSET_DEPARTMENT_MISMATCH
          - errors.ERR_MODIFICATION_COST_EXCEEDS_CAP
          - errors.ERR_MANDATE_DEADLINE_REQUIRED
        distinguishing_aspect: >-
          Three separate 422s on the same endpoint, each with its own error id, and the 30% modification
          cap is an integer cross-multiplication: 30000000*10 == 100000000*3 passes while 30000001*10
          exceeds it by ten cents. The mismatch rule compares the ASSET's department to the request's
          department, not to the acting requester.
        test_recipe:
