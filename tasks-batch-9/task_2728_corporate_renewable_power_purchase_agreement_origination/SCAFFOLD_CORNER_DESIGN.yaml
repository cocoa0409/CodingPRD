      - name: deal_creation_links_three_parents_and_permits_hub_settlement_off_node
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/ppa/deals
          - entities.Deal.fields.settlement_point_id
          - entities.Project.fields.node_id
          - endpoints.GET_/ppa/deals
        distinguishing_aspect: |
          A deal is a three-way link - project, anchor buyer and settlement point - and
          the settlement point is deliberately NOT required to be the project's own
          node: a virtual contract settled at a liquid hub against a project injecting
          at a node is exactly the basis exposure the product allocates. So the same
          project can carry one deal settled at its own node and one settled at the hub,
          each independently discoverable through the settlement_point_id filter, and
          the project's node_id is untouched by either.
        test_recipe:
          setup:
            - "Two pricing nodes: a NODE (the project's injection point) and a HUB; one QUALIFIED buyer; one 100.000 MW project sited on the NODE."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "PHYSICAL_DELIVERY", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "MONTHLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "BUYER" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_deal: $.data.id }
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "VIRTUAL_CFD", contracted_mw: 30.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SELLER" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { hub_deal: $.data.id }
            - call: "GET /ppa/deals?settlement_point_id=${hub_id}"
              as: Originator
