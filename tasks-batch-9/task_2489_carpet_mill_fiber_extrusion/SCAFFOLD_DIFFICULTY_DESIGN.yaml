scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dye_lot_uncommitted_yards_commitment_aware_vs_shipped_only
        grounds:
          - calculations.dye_lot_uncommitted_yards
          - entities.DyeLot.fields.uncommitted_yards
          - entities.DyeLot.fields.shipped_basis_uncommitted_yards
          - state_machines.CutOrder.SUBMITTED_to_ALLOCATED
          - state_machines.CutOrder.CUT_to_SHIPPED
        distinguishing_aspect: |
          Both variants read the same DyeLot and the same CutAllocation rows; COMMITMENT_AWARE
          subtracts RESERVED+CUT+SHIPPED yards while SHIPPED_ONLY subtracts only SHIPPED yards, so
          immediately after allocation the two persisted fields differ by exactly the 120.0 reserved
          yards (280.0 vs 400.0) and converge to 280.0 once the order ships.
        test_recipe:
          setup:
            - "A piece-dyed style ST-PD-01 at 4275 cents/linear yard, ACTIVE, with an effective DOC_FF_1_70 certificate."
            - "ProductionRun PR-01 backed, DyeLot DL-01 APPROVED in shade band A with dyed_yards 400.0 and scrapped_yards 0.0."
            - "RollGood RG-01 (200.0 yards, dye_lot_id = DL-01) qa_status PASSED, inventory_status AVAILABLE."
            - "Account AC-01 with a 100000000-cent limit and CutOrder CO-01 for 120.0 yards, shade_tolerance ANY, status SUBMITTED."
            - "Logical clock at 2026-08-06T08:00:00Z."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-PD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "PIECE_DYED", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/dye-vessels"
              payload: { vessel_code: "DV-01", vessel_type: "BECK", capacity_kg: 2000.0 }
              as: DyeHouseOperator
              captures: { dv: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/dye-lots"
              payload: { lot_code: "DL-01", production_run_id: "${pr}", vessel_id: "${dv}", color_code: "C-SANDSTONE", target_lab_l: 55.00, target_lab_a: 12.00, target_lab_b: -8.00, lot_kg: 400.0, dye_start_utc: "2026-08-06T08:00:00Z", dye_end_utc: "2026-08-06T14:00:00Z", dyed_yards: 400.0 }
              as: DyeHouseOperator
              captures: { dl: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/dye-lots/${dl}/start-dyeing"
              payload: {}
              as: DyeHouseOperator
              captures: { dl_v: $.data.version }
            - call: "POST /mill/dye-lots/${dl}/measurements"
              payload: { measured_lab_l: 55.48, measured_lab_a: 12.64, measured_lab_b: -8.00, expected_dye_lot_version: "${dl_v}" }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/disposition"
              payload: { disposition: "APPROVE" }
              as: DyeHouseOperator
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0, dye_lot_id: "${dl}" }
              as: MillPlanner
              captures: { rg: $.data.id }
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "FLAMMABILITY_PILL", result_value: 18.0 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
              captures: { cert: $.data.id }
            - call: "POST /mill/roll-goods/${rg}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 120.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders/${co}/allocate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/cut-orders/${co}/cut"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/cut-orders/${co}/ship"
              payload: {}
              as: MillPlanner
          assert:
            - "after the allocate call, DyeLot.${dl}.uncommitted_yards == 280.0"
            - "after the allocate call, DyeLot.${dl}.shipped_basis_uncommitted_yards == 400.0"
            - "after the allocate call, DyeLot.${dl}.shipped_basis_uncommitted_yards - DyeLot.${dl}.uncommitted_yards == 120.0"
            - "after the allocate call, DyeLot.${dl}.status == APPROVED"
            - "after the allocate call, RollGood.${rg}.available_yards == 80.0 and RollGood.${rg}.inventory_status == AVAILABLE"
            - "after the allocate call, CutOrder.${co}.status == ALLOCATED and CutOrder.${co}.allocated_yards == 120.0"
            - "after the allocate call, CutOrder.${co}.gross_cents == 513000 and CutOrder.${co}.freight_cents == 0 and CutOrder.${co}.net_invoice_cents == 513000"
            - "after the ship call, DyeLot.${dl}.uncommitted_yards == 280.0"
            - "after the ship call, DyeLot.${dl}.shipped_basis_uncommitted_yards == 280.0"
            - "after the ship call, DyeLot.${dl}.scrapped_yards == 0.0"
            - "after the ship call, Account.${acct}.credit_used_cents == 513000"

      - name: style_recycled_content_mass_balance_vs_physical_segregation
        grounds:
          - calculations.style_recycled_content_pct
          - entities.PolymerLot.fields.recycled_content_pct
          - entities.PolymerLot.fields.segregated
          - entities.FiberBatch.fields.blend_polymer_lot_id
          - entities.Certification.fields.accounting_basis
          - validations[priority=14]
          - errors[ERR_RECYCLED_CONTENT_INSUFFICIENT]
        distinguishing_aspect: |
          One FiberBatch blends 2000.000 kg of virgin nylon with 2000.000 kg of a non-segregated lot
          declared at 60.00 pct recycled: MASS_BALANCE credits 1200 kg and returns 30.00 pct (NSF_140
          passes), PHYSICAL_SEGREGATION credits 0 kg and returns 0.00 pct (NSF_140 fails 422) — same
          rows, same trigger, materially different verdict.
        test_recipe:
          setup:
            - "PolymerLot PL-VIRGIN-01 (NYLON_66, recycled_content_pct 0.00, segregated false) and PL-BLEND-60 (NYLON_66, recycled_content_pct 60.00, segregated false, reclaim_source POST_CONSUMER)."
            - "FiberBatch FB-01 drawing 2000.000 kg from each lot, extruded and RELEASED at denier 1200.0."
            - "Style ST-SD-01 ACTIVE, ProductionRun PR-01 in status BACKED (so its FiberBatch is inside the qualifying mass set)."
            - "RollGood RG-01 doffed and one PASS WEAR_TARR ProductTest recorded on it as evidence."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-VIRGIN-01", polymer_type: "NYLON_66", received_kg: 2500.000, melt_flow_index: 18.0, recycled_content_pct: 0.00, segregated: false, reclaim_source: "VIRGIN" }
              as: ExtrusionOperator
              captures: { pl_v: $.data.id }
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-BLEND-60", polymer_type: "NYLON_66", received_kg: 2500.000, melt_flow_index: 16.0, recycled_content_pct: 60.00, segregated: false, reclaim_source: "POST_CONSUMER" }
              as: ExtrusionOperator
              captures: { pl_b: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl_v}", input_kg: 2000.000, blend_polymer_lot_id: "${pl_b}", blend_input_kg: 2000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0 }
              as: MillPlanner
              captures: { rg: $.data.id }
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "WEAR_TARR", result_value: 4.2 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
          trigger:
            - call: "GET /mill/styles/${st}/recycled-content"
              payload: {}
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
              captures: { mb: $.data.mass_balance_pct, ps: $.data.physical_segregation_pct }
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "NSF_140", accounting_basis: "PHYSICAL_SEGREGATION", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "NSF_140", accounting_basis: "MASS_BALANCE", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
              captures: { cert_nsf: $.data.id }
          assert:
            - "the recycled-content read returns mass_balance_pct == 30.00"
            - "the recycled-content read returns physical_segregation_pct == 0.00"
            - "the recycled-content read returns qualifying_kg == 4000.000"
            - "the PHYSICAL_SEGREGATION certification attempt returns HTTP 422 with data.error_id == ERR_RECYCLED_CONTENT_INSUFFICIENT"
            - "the MASS_BALANCE certification attempt returns HTTP 201"
            - "Certification.${cert_nsf}.recorded_recycled_content_pct == 30.00"
            - "Certification.${cert_nsf}.accounting_basis == MASS_BALANCE and Certification.${cert_nsf}.status == ACTIVE"
            - "FiberBatch.${fb}.extruded_kg == 3860.000 and FiberBatch.${fb}.denier_actual == 1200.0"

  # =========================================================================
  # RULE 2 — combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: face_weight_gauge_lookup_pile_branch_product_chain
        grounds:
          - calculations.face_weight_per_square_yard
          - entities.CarpetStyle.fields.gauge_code
          - entities.CarpetStyle.fields.pile_construction
          - entities.CarpetStyle.fields.plies
          - entities.ProductionRun.fields.stitch_rate_per_inch
          - entities.ProductionRun.fields.face_weight_oz_per_sy
          - state_machines.ProductionRun.TUFTING_to_GREIGE
          - validations[priority=18]
        distinguishing_aspect: |
          Mode (a): six inputs drawn from three different entities (CarpetStyle.gauge_code,
          pile_construction, plies; ProductionRun.stitch_rate_per_inch, pile_height_set_mm;
          FiberBatch.denier_actual) feed a GAUGE_NEEDLES_PER_INCH table lookup, a CUT-vs-LOOP
          conditional allowance branch and a four-factor product chain rounded exactly once, giving
          32.04 oz/sy for the CUT branch where the LOOP branch on identical numbers gives 34.83.
        test_recipe:
          setup:
            - "Style ST-SD-01: gauge_code G_1_10, pile_construction CUT, pile_height_mm 8.0, plies 3, target_face_weight_oz 32.00."
            - "FiberBatch FB-01 RELEASED with denier_actual 1200.0."
            - "ProductionRun PR-01 in status TUFTING with stitch_rate_per_inch 10.0 and pile_height_set_mm 8.0."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
          trigger:
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
          assert:
            - "ProductionRun.${pr}.face_weight_oz_per_sy == 32.04"
            - "ProductionRun.${pr}.status == GREIGE"
            - "ProductionRun.${pr}.greige_yards == 400.0"
            - "FiberBatch.${fb}.status == CONSUMED"
            - "PolymerLot.${pl}.consumed_kg == 4000.000 and PolymerLot.${pl}.available_kg == 1000.000"

      - name: line_charges_per_line_rounding_before_sum
        grounds:
          - calculations.cut_order_line_charges
          - entities.CutAllocation.fields.line_cents
          - entities.CutOrder.fields.gross_cents
          - concurrency_rules[manual-allocation-stale-roll]
        distinguishing_aspect: |
          Mode (b): order of operations on rounding. Two manual lines of 12.5 and 7.5 yards at 4275
          cents/yard each land on an exact half-cent (53437.5 and 32062.5); rounding per line first
          gives gross_cents 85501, while the forbidden sum-then-round path gives 85500 — a
          one-cent-observable difference that also flips nothing else in the settlement.
        test_recipe:
          setup:
            - "Style ST-SD-01 (SOLUTION_DYED, 4275 cents/yard) ACTIVE with an effective DOC_FF_1_70 certificate."
            - "RollGood RG-01 with 200.0 yards, qa_status PASSED, inventory_status AVAILABLE, shade_band SOLUTION."
            - "Account AC-01 (limit 100000000) and CutOrder CO-01 for 20.0 yards, shade_tolerance ANY, status SUBMITTED."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 60, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
