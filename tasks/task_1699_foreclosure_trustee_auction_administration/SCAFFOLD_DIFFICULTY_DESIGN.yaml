            - "AuctionSale.${sale_a} remains SCHEDULED at 2026-11-23T10:00:00Z"

      - name: publication_min_gap_spacing
        grounds:
          - validations[priority=22]
          - entities.Publication.fields.run_index
        distinguishing_aspect: |
          Interval semantics: minimum point-spacing (>= 7 days between run
          dates) on the NOTS publication calendar — a 6-day gap is rejected
          even though no interval-overlap notion applies; exactly 7 days is
          accepted. Different resource (NOTS) and different semantics (spacing
          vs half-open overlap) from the venue instance.
        test_recipe:
          setup:
            - "Case LN-O2 at NOTS_RECORDED; first publication ran 2026-11-02"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Pi", reference_code: "BEN-O2", contact_email: "pi@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
