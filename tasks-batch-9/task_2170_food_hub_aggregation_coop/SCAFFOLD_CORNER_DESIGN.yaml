  - name: logical_clock_defaults_to_2026_08_01_before_any_set_call
    claim_type: action_endpoint
    grounds:
    - endpoints[POST /_clock/set_current_utc]
    - calculations.producer_compliance_evaluation
    - state_machines.ProducerDocument.SUBMITTED_to_VERIFIED
    distinguishing_aspect: 'With no clock call at all the server must read exactly 2026-08-01T00:00:00Z: a document expiring at that same instant fails verification (expires_on > now is strict) while one
      expiring one second later verifies, which is impossible under a real wall clock.'
    test_recipe:
      setup:
      - Empty database and no POST /_clock/set_current_utc call has been made in this test.
      - 'Producer P1 is in DRAFT with two GAP_AUDIT documents submitted: DOC_EQ expiring exactly 2026-08-01T00:00:00Z and DOC_LATE expiring 2026-08-01T00:00:01Z.'
      setup_api_calls:
      - call: POST /producers
