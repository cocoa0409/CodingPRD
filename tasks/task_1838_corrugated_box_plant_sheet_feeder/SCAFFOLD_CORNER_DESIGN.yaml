      - name: grade_discontinued_blocks_order_create_and_quote_accept
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_GRADE_DISCONTINUED]
          - state_machines.BoardGrade.ACTIVE_to_DISCONTINUED
        distinguishing_aspect: "Discontinuing a grade blocks both new orders referencing it and — revalidated at acceptance time — acceptance of a quote whose order's grade was discontinued after quoting."
        test_recipe:
          setup: ["Grade 32C discontinued; separately grade 44BC active with ORD-2 quoted, then 44BC discontinued before accept"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_32: $.data.id } }
            - { call: "POST /api/board-grades/${grade_32}/discontinue", payload: {}, as: PlantAdmin }
            - { call: "POST /api/board-grades", payload: { grade_code: "44BC", liner_combo: "42/26/42/26/42", flute: "BC", ect_rating_lbs_per_in: 44, burst_rating_psi: 275, basis_weight_lbs_per_msf: 120.0 }, as: PlantAdmin, captures: { grade_44: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_44}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 40 }, as: SalesRep, captures: { ord_2: $.data.id, ord_2_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_2}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_2_v}" }, as: SalesRep, captures: { quo_2: $.data.id } }
            - { call: "POST /api/board-grades/${grade_44}/discontinue", payload: {}, as: PlantAdmin }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_32}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "POST /api/price-quotes/${quo_2}/accept", payload: {}, as: SalesRep, captures: { err2: $.data.error_id } }
          assert:
            - "Create against DISCONTINUED grade: err == ERR_GRADE_DISCONTINUED, HTTP 422"
            - "Accept after mid-flight discontinuation: err2 == ERR_GRADE_DISCONTINUED; quote stays OPEN and order stays QUOTED"

      - name: sod_self_adjudication_rejected_then_other_adjuster_succeeds
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SOD_CLAIM_SELF_ADJUDICATION]
        distinguishing_aspect: "Segregation of duties: resolving with X-User-ID equal to filed_by_user_id (cs-100) fails ERR_SOD_CLAIM_SELF_ADJUDICATION even under the ClaimsAdjuster role; a different adjuster (adj-200) resolves the same claim."
        test_recipe:
          setup: ["ORD-1 invoiced; claim filed by cs-100 and under review"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
