          - rbac.UnderwritingOfficer.exclusive_operations
          - rbac.RiskCommitteeApprover.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The underwriting file and the approval signature are separate seats: the committee cannot record a verification, screen an owner or advance the file (three 403s), and the officer who built the file cannot decide it (a fourth 403) - so no single role can carry an application from SUBMITTED to APPROVED."
