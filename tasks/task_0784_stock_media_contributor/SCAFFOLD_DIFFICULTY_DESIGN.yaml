scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_locked_vs_current_level
        grounds:
          - calculations.royalty_amount
          - calculations.royalty_rate_selection
          - entities.Download.fields.royalty_rate_snapshot_pct
          - entities.Contributor.fields.royalty_level
        distinguishing_aspect: |
          Domain = Download. royalty_amount_cents is locked from the download-time snapshot rate
          (EXCLUSIVE+BRONZE = 0.25 -> 375) and stays 375 even after the contributor is bumped to
          SILVER; the at_current_level variant would recompute 0.30 -> 450. Locked != current.
        test_recipe:
          setup:
            - "License tier ENHANCED (base 1500) exists."
            - "Contributor US/W9, VERIFIED+ACTIVE, EXCLUSIVE window covering the 2026-03-01 default clock, lifetime 0 -> BRONZE."
            - "One COMMERCIAL asset ACCEPTED; one Download at ENHANCED created while contributor is EXCLUSIVE+BRONZE (rate 0.25, royalty 375)."
            - "A +25000 earning adjustment then lifts lifetime to 25000 -> SILVER."
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "ENHANCED", base_price_cents: 1500 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Ada", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-111" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${c_id}/exclusivity-windows"
              payload: { start_at: "2026-03-01T00:00:00Z", end_at: "2027-03-01T00:00:00Z" }
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Sunrise", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["nature"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "ENHANCED", buyer_reference: "buy-1" }
              as: FinanceAdmin
              captures: { dl_id: $.data.id }
            - call: "POST /contributors/${c_id}/earning-adjustments"
              payload: { amount_cents: 25000, reason: "signing bonus" }
              as: FinanceAdmin
          trigger:
            - call: "GET /downloads/${dl_id}"
              payload: {}
              as: FinanceAdmin
          assert:
            - "Download.${dl_id}.royalty_amount_cents == 375"
            - "Download.${dl_id}.royalty_rate_snapshot_pct == 0.25"
            - "Contributor.${c_id}.royalty_level == SILVER"
            - "at_current_level recomputation would be round_half_up(1500*0.30) == 450; system keeps the locked 375"

      - name: payout_gross_vs_net
        grounds:
          - calculations.payout_settlement_amount
          - calculations.payout_withholding
          - entities.Payout.fields.gross_amount_cents
          - entities.Payout.fields.net_amount_cents
        distinguishing_aspect: |
          Domain = Payout (distinct from the Download-domain instance above). provisional_gross =
          available_balance 10750; final_net = 10750 - 226 withholding = 10524. Gross != net.
        test_recipe:
          setup:
            - "License tier ENHANCED (base 1500) exists."
            - "Foreign contributor CA/W8BEN (no treaty -> 0.30), VERIFIED+ACTIVE, EXCLUSIVE+BRONZE."
            - "One ACCEPTED asset; two ENHANCED downloads (royalty 375 each) settled to AVAILABLE after the clock advances past clearing."
            - "A +10000 adjustment lifts available_balance to 10750 (750 downloads + 10000 adjustment)."
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "ENHANCED", base_price_cents: 1500 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Bo", country_code: "CA" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W8BEN", tax_id: "CA-222" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${c_id}/exclusivity-windows"
              payload: { start_at: "2026-03-01T00:00:00Z", end_at: "2027-03-01T00:00:00Z" }
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Skyline", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["city"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "ENHANCED", buyer_reference: "buy-1" }
              as: FinanceAdmin
              captures: { dl1: $.data.id }
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "ENHANCED", buyer_reference: "buy-2" }
              as: FinanceAdmin
              captures: { dl2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /downloads/${dl1}/settle"
              payload: {}
              as: FinanceAdmin
            - call: "POST /downloads/${dl2}/settle"
              payload: {}
              as: FinanceAdmin
            - call: "POST /contributors/${c_id}/earning-adjustments"
              payload: { amount_cents: 10000, reason: "referral bonus" }
              as: FinanceAdmin
            - call: "GET /contributors/${c_id}"
              payload: {}
              as: FinanceAdmin
              captures: { c_ver: $.data.version }
          trigger:
            - call: "POST /contributors/${c_id}/payouts"
              payload: { expected_contributor_version: "${c_ver}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { p_id: $.data.id }
          assert:
            - "Payout.${p_id}.gross_amount_cents == 10750"
            - "Payout.${p_id}.withholding_cents == 226"
            - "Payout.${p_id}.net_amount_cents == 10524"
            - "final_net 10524 != provisional_gross 10750; withholding applies only to the two AVAILABLE download lines, not the adjustment"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_rate_matrix_exclusive_editorial_cap
        grounds:
          - calculations.royalty_rate_selection
          - entities.Asset.fields.content_category
          - entities.Contributor.fields.exclusivity
          - entities.Contributor.fields.royalty_level
        distinguishing_aspect: |
          Mode (a): >=3 inputs (exclusivity, royalty_level, content_category) with a conditional
          editorial branch and a nested min cap. EXCLUSIVE+PLATINUM base 0.40 + EDITORIAL 0.05 =
          0.45 = min(0.45, 0.45); royalty on a STANDARD (1000) download = round_half_up(1000*0.45) = 450.
        test_recipe:
          setup:
            - "License tier STANDARD (base 1000) exists."
            - "Contributor US/W9 ACTIVE, EXCLUSIVE window covering default clock, lifetime 500000 via adjustment -> PLATINUM."
            - "One EDITORIAL asset ACCEPTED."
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 1000 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Cy", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-333" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${c_id}/exclusivity-windows"
              payload: { start_at: "2026-03-01T00:00:00Z", end_at: "2027-03-01T00:00:00Z" }
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /contributors/${c_id}/earning-adjustments"
              payload: { amount_cents: 500000, reason: "career backfill" }
              as: FinanceAdmin
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Protest", media_type: "PHOTO", content_category: "EDITORIAL", keywords: ["news"], perceptual_hash: "bbbb", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
          trigger:
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "STANDARD", buyer_reference: "buy-9" }
              as: FinanceAdmin
              captures: { dl_id: $.data.id }
          assert:
            - "Contributor.${c_id}.royalty_level == PLATINUM"
            - "Download.${dl_id}.royalty_rate_snapshot_pct == 0.45"
            - "Download.${dl_id}.royalty_amount_cents == 450"

      - name: withholding_round_per_line_then_sum
        grounds:
          - calculations.payout_withholding
          - entities.Payout.fields.withholding_cents
          - entities.TaxForm.fields.form_type
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned. Two AVAILABLE lines of 375 at 0.30 -> per-line
          round(112.5)=113 twice -> 226 (round-then-sum), whereas sum-then-round would be
          round(750*0.30)=225. Scaffold pins round-then-sum, so withholding == 226 (net 10524).
        test_recipe:
          setup:
            - "Identical to payout_gross_vs_net's end-state: foreign W8BEN (0.30), two AVAILABLE 375 downloads plus a +10000 adjustment, available 10750."
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "ENHANCED", base_price_cents: 1500 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Di", country_code: "CA" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W8BEN", tax_id: "CA-444" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${c_id}/exclusivity-windows"
              payload: { start_at: "2026-03-01T00:00:00Z", end_at: "2027-03-01T00:00:00Z" }
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Harbor", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["sea"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "ENHANCED", buyer_reference: "buy-1" }
              as: FinanceAdmin
              captures: { dl1: $.data.id }
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "ENHANCED", buyer_reference: "buy-2" }
              as: FinanceAdmin
              captures: { dl2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /downloads/${dl1}/settle"
              payload: {}
              as: FinanceAdmin
            - call: "POST /downloads/${dl2}/settle"
              payload: {}
              as: FinanceAdmin
            - call: "POST /contributors/${c_id}/earning-adjustments"
              payload: { amount_cents: 10000, reason: "bonus" }
              as: FinanceAdmin
            - call: "GET /contributors/${c_id}"
              payload: {}
              as: FinanceAdmin
              captures: { c_ver: $.data.version }
          trigger:
            - call: "POST /contributors/${c_id}/payouts"
              payload: { expected_contributor_version: "${c_ver}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { p_id: $.data.id }
          assert:
            - "Payout.${p_id}.withholding_cents == 226"
            - "Payout.${p_id}.net_amount_cents == 10524"
            - "round-then-sum (226) != the sum-then-round alternative (225); scaffold pins round-then-sum"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: asset_reject_then_resubmit_cycle
        grounds:
          - state_machines.Asset.IN_REVIEW_to_REJECTED
          - state_machines.Asset.REJECTED_to_SUBMITTED
          - entities.Asset.fields.reject_reason
        distinguishing_aspect: |
          Entity = Asset. Cyclic edge REJECTED->SUBMITTED (revision loop): after a QUALITY reject the
          contributor resubmits and the asset returns to SUBMITTED with reject_reason cleared.
        test_recipe:
          setup:
            - "Contributor exists; one asset DRAFT->SUBMITTED->IN_REVIEW->REJECTED(QUALITY)."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Ed", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Blur", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "REJECT", reject_reason: "QUALITY" }
              as: Reviewer
          trigger:
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
          assert:
            - "Asset.${a_id}.status == SUBMITTED"
            - "Asset.${a_id}.reject_reason == null"

      - name: download_available_then_reversed_branch
        grounds:
          - state_machines.Download.PENDING_to_AVAILABLE
          - state_machines.Download.AVAILABLE_to_REVERSED
          - entities.Download.fields.earning_status
        distinguishing_aspect: |
          Entity = Download (different entity from the Asset cycle). Branching machine: PENDING forks to
          AVAILABLE or REVERSED, and AVAILABLE itself branches to REVERSED with a compensating debit.
        test_recipe:
          setup:
            - "License tier STANDARD (1000) exists; contributor ACTIVE non-exclusive BRONZE; one ACCEPTED asset."
            - "One download settled to AVAILABLE (rate 0.15 -> royalty 150)."
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 1000 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Fi", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-555" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Leaf", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "STANDARD", buyer_reference: "buy-1" }
              as: FinanceAdmin
              captures: { dl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /downloads/${dl_id}/settle"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /downloads/${dl_id}/reverse"
              payload: { reason: "chargeback" }
              as: FinanceAdmin
          assert:
            - "Download.${dl_id}.earning_status == REVERSED"
            - "Contributor.${c_id}.available_balance_cents == 0"
            - "Contributor.${c_id}.lifetime_earnings_cents == 0"

  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: takedown_uphold_cascade_depth3
        grounds:
          - state_machines.TakedownRequest.OPEN_to_UPHELD
          - state_machines.Asset.ACCEPTED_to_TAKEN_DOWN
          - state_machines.Download.AVAILABLE_to_REVERSED
          - entities.Contributor.fields.lifetime_earnings_cents
        distinguishing_aspect: |
          Depth-3 chain from the takedown-uphold trigger: uphold mutates Asset (ACCEPTED->TAKEN_DOWN);
          that asset transition reverses the asset's AVAILABLE Download; the download reversal debits
          Contributor.lifetime_earnings_cents. Each link is caused by the previous, not the trigger.
        test_recipe:
          setup:
            - "License tier STANDARD (1000) exists; contributor ACTIVE non-exclusive BRONZE."
            - "One ACCEPTED asset with a settled AVAILABLE download (royalty 150, lifetime 150, count 1); one OPEN takedown filed on it."
          setup_api_calls:
            - call: "POST /license-tiers"
              payload: { code: "STANDARD", base_price_cents: 1000 }
              as: FinanceAdmin
            - call: "POST /contributors"
              payload: { display_name: "Gu", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-666" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Bridge", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "STANDARD", buyer_reference: "buy-1" }
              as: FinanceAdmin
              captures: { dl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /downloads/${dl_id}/settle"
              payload: {}
              as: FinanceAdmin
            - call: "POST /assets/${a_id}/takedowns"
              payload: { claim_type: "COPYRIGHT", claimant_name: "Acme Legal" }
              as: ComplianceOfficer
              captures: { td_id: $.data.id }
          trigger:
            - call: "POST /takedowns/${td_id}/decision"
              payload: { decision: "UPHOLD" }
              as: ComplianceOfficer
          assert:
            - "Asset.${a_id}.status == TAKEN_DOWN"
            - "Download.${dl_id}.earning_status == REVERSED"
            - "Contributor.${c_id}.lifetime_earnings_cents == 0"
            - "Contributor.${c_id}.available_balance_cents == 0"
            - "Contributor.${c_id}.accepted_asset_count == 0"
            - "Contributor.${c_id}.strike_count == 1"

      - name: taxform_verify_activates_contributor_depth2
        grounds:
          - state_machines.TaxForm.SUBMITTED_to_VERIFIED
          - state_machines.Contributor.PENDING_to_ACTIVE
          - entities.Contributor.fields.onboarding_status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (tax-form verify): verifying the TaxForm mutates it to
          VERIFIED, and that transition activates the Contributor (PENDING->ACTIVE). Second-link mutation
          is caused by the first, not by the officer's action directly on the contributor.
        test_recipe:
          setup:
            - "Contributor PENDING with a SUBMITTED W9 tax form."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Ha", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-777" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
          trigger:
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
          assert:
            - "TaxForm.${tf_id}.status == VERIFIED"
            - "Contributor.${c_id}.onboarding_status == ACTIVE"
            - "Contributor.${c_id}.tax_form_status == VERIFIED"

  # =========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: review_accept_state_beats_release
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RELEASE_NOT_VERIFIED]
        distinguishing_aspect: |
          Pair = state (priority 6) vs business_referential (priority 9). An ACCEPT on a SUBMITTED (not
          IN_REVIEW) asset that also has an unverified required release fails BOTH; state wins ->
          ERR_INVALID_STATE, not ERR_RELEASE_NOT_VERIFIED.
        test_recipe:
          setup:
            - "Contributor ACTIVE; a PENDING (unverified) model release; asset requires_release=true linked to it, in SUBMITTED (never claimed)."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Io", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-888" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /contributors/${c_id}/model-releases"
              payload: { release_type: "MODEL", releaser_name: "Jane Doe" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { rel_id: $.data.id }
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Portrait", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["face"], perceptual_hash: "aaaa", requires_release: true, model_release_id: "${rel_id}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE"
            - "ERR_RELEASE_NOT_VERIFIED is NOT returned though the release is unverified (lower priority)"

      - name: payout_suspended_beats_below_threshold
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_CONTRIBUTOR_SUSPENDED]
          - errors[ERR_BELOW_PAYOUT_THRESHOLD]
        distinguishing_aspect: |
          Pair = business_safety (priority 7) vs business_fiscal (priority 14). A SUSPENDED contributor
          with available_balance 0 requesting a payout fails BOTH; safety wins ->
          ERR_CONTRIBUTOR_SUSPENDED, not ERR_BELOW_PAYOUT_THRESHOLD.
        test_recipe:
          setup:
            - "Contributor ACTIVE with three ACCEPTED assets, each with an UPHELD takedown -> strike_count 3 -> SUSPENDED; available_balance 0."
