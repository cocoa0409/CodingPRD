            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MODERATE_SEDATION", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
              captures: { sess_v1: $.data.version }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_a}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_a: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_a}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v1}" }
              as: ReferralCoordinator
