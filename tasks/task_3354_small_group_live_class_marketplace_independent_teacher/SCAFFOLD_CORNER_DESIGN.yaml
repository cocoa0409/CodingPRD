              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada: $.data.id }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s1: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit-sample"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s2: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/review"
              payload: { stage: "SAMPLE", verdict: "PASS" }
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { app_ada_s3: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/approve"
              payload: {}
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { t_ada: $.data.id }
            - call: "POST /outschool/teachers/${t_ada}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { t_ada_status: $.data.status }
            - call: "POST /outschool/class-listings"
              payload: { teacher_id: "${t_ada}", title: "Algebra Club", format: "ONE_TIME", min_age: 8, max_age: 12, max_learners: 6, list_price_cents: 2000 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { l_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/policy-review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { l_1_review: $.data.content_review_state }
            - call: "POST /outschool/class-listings/${l_1}/publish"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
            - call: "POST /outschool/class-listings/${l_1}/sections"
              payload: { timezone: "America/New_York", start_utc: "2026-11-05T14:00:00Z", end_utc: "2026-11-05T16:00:00Z", min_learners: 2, capacity: 6 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { s_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/sections/${s_1}/open"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
            - call: "POST /outschool/learners"
              payload: { display_name: "Learner One", birth_date: "2016-05-01T00:00:00Z", parent_user_id: "p_1" }
              as: Parent
              as_user_id: "p_1"
              captures: { ln_1: $.data.id }
            - call: "POST /outschool/learners/${ln_1}/subscription"
              payload: { subscription_tier: "FAMILY" }
              as: Parent
              as_user_id: "p_1"
              captures: { ln_1_credit: $.data.confirmation_credit_cents }
            - call: "POST /outschool/class-listings/${l_1}/sections/${s_1}/enrollments"
              payload: { learner_id: "${ln_1}" }
              as: Parent
              as_user_id: "p_1"
              captures: { e_1: $.data.id }
          trigger:
            - call: "POST /outschool/enrollments/${e_1}/confirm"
              payload: {}
              as: Parent
              as_user_id: "p_1"
              captures: { err_confirm: $.data.error_id }
          assert:
            - "Section.${s_1}.status == OPEN_FOR_ENROLLMENT"
            - "Section.${s_1}.enrollment_min_met == false"
            - "The confirmation returns error_id ERR_INVALID_STATE"
            - "Enrollment.${e_1}.status == RESERVED"
            - "Learner.${ln_1}.confirmation_credit_cents == 12000, so the rejected confirmation drew down no credit"

  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: section_seat_occupancy_excludes_cancelled_enrollments
        claim_type: input_set_filtering
        grounds: [calculations.section_seat_occupancy, entities.Section.fields.enrolled_count, entities.Section.fields.seats_remaining]
        distinguishing_aspect: "An enrollment that reached CANCELLED_BY_TEACHER must be excluded from both the enrolled and reserved counts, so a capacity-2 section with one confirmed and one cancelled enrollment reports seats_remaining 1 rather than 0."
        test_recipe:
          setup:
            - "Teacher ada is ACTIVE; a PUBLISHED listing has one OPEN section with capacity 2"
            - "Learner ln_1 holds a CONFIRMED enrollment and learner ln_2 holds a CANCELLED_BY_TEACHER enrollment on that section"
            - "The logical clock reads 2026-09-01T00:00:00Z, the server default"
          setup_api_calls:
            - call: "POST /outschool/teacher-applications"
              payload: { applicant_user_id: "u_ada", applicant_email: "ada@example.com", display_name: "Ada Lovelace", teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
