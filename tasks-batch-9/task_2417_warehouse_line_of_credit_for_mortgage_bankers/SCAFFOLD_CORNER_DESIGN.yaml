      - name: corner_sm_purchased_advance_is_locked_down
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=11]
          - errors.ERR_ADVANCE_INVALID_STATE
          - state_machines.Advance.funding_status.terminal_states
          - state_machines.BaileeLetter.status.ISSUED_to_HONORED
        distinguishing_aspect: |
          PURCHASED is terminal on the funding axis and RELEASED_TO_INVESTOR is terminal on
          the custody axis, so all five remaining advance triggers — fund, ship, purchase,
          repurchase, valuation — fail from there with the same 409, and the honoured
          BaileeLetter cannot be re-honoured either.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; DRY CONFORMING advance funded to 1,960,000,000, shipped to Alpha Aggregator, then purchased at par by that investor."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - &c_ship_a1
              call: "POST /advances/${a1_id}/ship"
