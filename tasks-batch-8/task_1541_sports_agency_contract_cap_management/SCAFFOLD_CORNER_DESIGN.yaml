              captures: { cs_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "OCCA", fee_cap_pct: 0.03 }
              as: LeagueOfficer
              captures: { aid: $.data.id }
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "M", email: "m@occ.example", cert_number: "MOC", is_manager: true }
              as: AgencyManager
              captures: { m_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${m_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/agents"
              payload: { full_name: "A", email: "a@occ.example", cert_number: "AOC" }
              as: AgencyManager
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /agencies/${aid}/agents/${a_id}/certify"
              payload: {}
              as: AgencyManager
              as_user_id: "${m_id}"
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P1", position: "PG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /agencies/${aid}/clients"
              payload: { primary_agent_id: "${a_id}", full_name: "P2", position: "SG" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c1_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 10000000, guaranteed_cents: 10000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con1_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c1_id}/contracts/${con1_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 10000000, proposed_guaranteed_cents: 10000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c2_id}/contracts"
              payload: { team_id: "${team_id}", cap_season_id: "${cs_id}", start_season_year: 2026, years: 1, base_salary_cents: 20000000, guaranteed_cents: 20000000, signing_bonus_cents: 0, incentive_cents: 0, escalator_pct: 0 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { con2_id: $.data.id }
            - call: "POST /agencies/${aid}/clients/${c2_id}/contracts/${con2_id}/proposals"
              payload: { proposed_by_agent_id: "${a_id}", proposed_aav_cents: 20000000, proposed_guaranteed_cents: 20000000 }
              as: Agent
              as_user_id: "${a_id}"
              captures: { p2_id: $.data.id }
            # Observer reads cs version BEFORE p1 submit
            - call: "GET /teams/${team_id}/cap_seasons/${cs_id}"
              as: LeagueOfficer
              captures: { cs_v_early: $.data.version }
            # p1 submit advances cs version
            - call: "POST /agencies/${aid}/clients/${c1_id}/contracts/${con1_id}/proposals/${p1_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_early}" }
              as: Agent
              as_user_id: "${a_id}"
          trigger:
            # Observer tries p2 submit with the now-stale version
            - call: "POST /agencies/${aid}/clients/${c2_id}/contracts/${con2_id}/proposals/${p2_id}/submit"
              payload: { expected_cap_season_version: "${cs_v_early}" }
              as: Agent
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "http status == 412"
            - "Proposal.${p2_id}.status == DRAFT   # unchanged"
            - "CapSeason.${cs_id}.reserved_cents == 10000000  # only p1's reservation applied"

