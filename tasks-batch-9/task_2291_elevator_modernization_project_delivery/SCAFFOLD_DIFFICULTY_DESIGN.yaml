      - name: failed_reinspection_reopens_window_freezes_project_and_reverts_closeout
        grounds:
          - state_machines.InspectionAppointment.SCHEDULED_to_FAILED
          - state_machines.ElevatorCar.work_status.ACCEPTED_to_OUTAGE_ACTIVE
          - state_machines.OutageWindow.COMPLETED_to_ACTIVE
          - state_machines.ModernizationProject.CLOSEOUT_to_EXECUTION
          - calculations.project_downtime_posture
          - entities.Jurisdiction.fields.reinspection_extension_hours
        distinguishing_aspect: |
          Depth 5 from a FAILED inspection result, a regulator ruling rather than an operator
          withdrawal: the appointment FAILS and reverts the car and its code triggers (1), which
          reopens the car's latest COMPLETED outage window to ACTIVE with end_at extended by the
          jurisdiction's 24 reinspection hours (2), which drops the group below its service floor
          and raises active_outage_count (3), which recomputes the posture to FROZEN (4), which
          walks the project status CLOSEOUT -> EXECUTION (5). Its side-effect set and its trigger
          are disjoint from the rescind cascade's.
