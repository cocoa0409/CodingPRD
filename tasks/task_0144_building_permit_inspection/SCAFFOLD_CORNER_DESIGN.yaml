# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide sections. Every error in §1.6
# is triggered by at least one §1.8 or §1.9 instance. Setup chains reuse the
# same Jurisdiction config as §1.8 (rate 10, min 100, pr_pct 0.65, sqft 120).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_permit_returns_201_with_computed_fee_fields
        claim_type: Creation
        grounds:
          - endpoints[POST /permits]
          - entities.PermitApplication.fields.total_permit_fee
          - entities.PermitApplication.fields.status
        distinguishing_aspect: "POST /permits with all required fields returns 201, status SUBMITTED, work_status NOT_STARTED, and computed total_permit_fee 165.00 for declared_valuation 2000."
        test_recipe:
          setup:
            - "A Jurisdiction and a Contractor exist."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-e1", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Ce1", license_number: "E-1", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { jurisdiction_id: "${jur_id}", contractor_id: "${con_id}", work_class: "REPAIR", fee_method: "VALUATION", declared_valuation: 2000 }
              as: Applicant
              captures: { permit_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "PermitApplication.${permit_id}.status == SUBMITTED"
            - "PermitApplication.${permit_id}.work_status == NOT_STARTED"
            - "PermitApplication.${permit_id}.total_permit_fee == 165.00"

      - name: get_permit_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /permits/{id}]
          - errors[ERR_PERMIT_NOT_FOUND]
        distinguishing_aspect: "GET /permits/{id} with a non-existent UUID returns ERR_PERMIT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /permits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_NOT_FOUND"
            - "response HTTP status == 404"

      - name: get_review_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /reviews/{id}]
          - errors[ERR_REVIEW_NOT_FOUND]
        distinguishing_aspect: "GET /reviews/{id} with a non-existent UUID returns ERR_REVIEW_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /reviews/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: PlanReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REVIEW_NOT_FOUND"
            - "response HTTP status == 404"

      - name: get_correction_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /correction-notices/{id}]
          - errors[ERR_CORRECTION_NOT_FOUND]
        distinguishing_aspect: "GET /correction-notices/{id} with a non-existent UUID returns ERR_CORRECTION_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /correction-notices/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: PlanReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CORRECTION_NOT_FOUND"
            - "response HTTP status == 404"

      - name: get_inspection_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /inspections/{id}]
          - errors[ERR_INSPECTION_NOT_FOUND]
        distinguishing_aspect: "GET /inspections/{id} with a non-existent UUID returns ERR_INSPECTION_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /inspections/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSPECTION_NOT_FOUND"
            - "response HTTP status == 404"

      - name: get_slot_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /inspection-slots/{id}]
          - errors[ERR_SLOT_NOT_FOUND]
        distinguishing_aspect: "GET /inspection-slots/{id} with a non-existent UUID returns ERR_SLOT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /inspection-slots/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SLOT_NOT_FOUND"
            - "response HTTP status == 404"

      - name: get_stop_work_order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /stop-work-orders/{id}]
          - errors[ERR_SWO_NOT_FOUND]
        distinguishing_aspect: "GET /stop-work-orders/{id} with a non-existent UUID returns ERR_SWO_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /stop-work-orders/00000000-0000-4000-8000-000000000014"
              payload: {}
              as: BuildingOfficial
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SWO_NOT_FOUND"
