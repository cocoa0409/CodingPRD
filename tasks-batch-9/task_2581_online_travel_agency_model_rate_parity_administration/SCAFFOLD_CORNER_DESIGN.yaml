            - "Booking.${bk}.payment_status is still CAPTURED and fulfillment_status is still RESERVED"
            - "Booking.${bk}.charged_total_cents is still 24240 and refunded_cents is still 0"

      - name: booking_starts_in_authorized_and_reserved
        claim_type: initial_state
        grounds:
