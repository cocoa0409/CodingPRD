            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: "not-a-number" }
            as: (no X-User-Role header)
            captures: { err_id: "$.data.error_id" }
          assert:
          - "${err_id} == ERR_UNAUTHENTICATED"
          - "HTTP status == 401"
          - "${err_id} != ERR_INVALID_REQUEST"
