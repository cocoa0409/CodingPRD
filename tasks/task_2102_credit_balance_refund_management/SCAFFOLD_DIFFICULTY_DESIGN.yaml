  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_priority_8_beats_fiscal_priority_40_on_refund_request_create
        grounds:
          - validations[priority=8]
          - validations[priority=40]
          - errors[ERR_CREDIT_BALANCE_INVALID_STATE]
          - errors[ERR_REFUND_EXCEEDS_CREDIT]
        distinguishing_aspect: |
          Error-category pair `state` vs `business_fiscal`: one request violates the
          priority-8 status precondition (the credit balance is still IDENTIFIED,
          not ATTRIBUTED) AND the priority-40 capacity rule (99999 requested against
          a 12000-cent credit), and the response must be ERR_CREDIT_BALANCE_INVALID_STATE,
          never ERR_REFUND_EXCEEDS_CREDIT.
        test_recipe:
          setup:
            - "A COMMERCIAL payer and account PC1 charged +50000 on 2026-08-01 and paid -62000 by the PATIENT on 2026-08-05."
            - "A sweep on 2026-08-15 produced a CreditBalance of 12000 cents in status IDENTIFIED — start-review and attribute were deliberately NOT run, so attribution is null and both portions are 0."
