              payload: { account_name: "Imm Co" }
              as: Estimator
              captures: { c_id: $.data.id }
          trigger:
            - call: "PATCH /label-jobs/customers/${c_id}"
              payload: { credit_hold: true }
              as: Estimator
              captures: { patched_hold: $.data.credit_hold, patched_v: $.data.version }
            - call: "GET /label-jobs/customers/${c_id}"
              as: Estimator
              captures: { got_hold: $.data.credit_hold, got_v: $.data.version }
          assert:
            - "PATCH response shows credit_hold == true and version == 2"
            - "subsequent GET shows credit_hold == true and version == 2 (no eventual-consistency lag)"
