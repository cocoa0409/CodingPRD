          - endpoints[POST /academic-terms/{id}/posture-changes]
          - entities.CourseShell.fields.effective_seat_cap
        distinguishing_aspect: "One posture write must re-derive effective_seat_cap on EVERY shell of the term, and the floor is applied per shell against its own base_seat_cap: at ELEVATED a 10-seat shell gains 1 and a 25-seat shell gains 2 (floor(2.5)), at CONTINUITY_MODE they gain 2 and 5. Re-reading afterwards must return the same numbers — the propagation reaches a fixed point instead of compounding on each read."
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION at posture NORMAL with two PROVISIONED OFFICIAL shells, base_seat_cap 10 and 25."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6060", full_name: "Jean Bartik", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "EN101-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { sh_small: $.data.id }
            - call: "POST /course-shells/${sh_small}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { small_cap0: $.data.effective_seat_cap }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "EN101-02", shell_type: "OFFICIAL", base_seat_cap: 25 }
              as: LmsAdmin
              captures: { sh_big: $.data.id }
            - call: "POST /course-shells/${sh_big}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { big_cap0: $.data.effective_seat_cap }
          trigger:
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "regional power advisory" }
              as: LmsAdmin
              captures: { post1: $.data.continuity_posture, term_v1: $.data.version }
            - call: "GET /course-shells/${sh_small}"
              payload: {}
              as: LmsAdmin
              captures: { small_cap1: $.data.effective_seat_cap, small_base1: $.data.base_seat_cap }
            - call: "GET /course-shells/${sh_big}"
              payload: {}
              as: LmsAdmin
              captures: { big_cap1: $.data.effective_seat_cap }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { term_v2: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-05T00:00:00Z", expected_term_version: "${term_v2}" }
              as: LmsAdmin
              captures: { win_id: $.data.id, win_state: $.data.window_state }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "CONTINUITY_MODE" }
              as: LmsAdmin
              captures: { post2: $.data.continuity_posture }
            - call: "GET /course-shells/${sh_small}"
              payload: {}
              as: LmsAdmin
              captures: { small_cap2: $.data.effective_seat_cap }
            - call: "GET /course-shells/${sh_big}"
              payload: {}
              as: LmsAdmin
              captures: { big_cap2: $.data.effective_seat_cap }
            - call: "GET /course-shells/${sh_big}"
              payload: {}
              as: LmsAdmin
              captures: { big_cap3: $.data.effective_seat_cap }
          assert:
            - "${small_cap0} == 10 and ${big_cap0} == 25 — at NORMAL the overflow ratio is 0.00, so effective == base"
            - "${post1} == ELEVATED; ${small_cap1} == 11  # 10 + floor(10 * 0.10) = 10 + 1"
            - "${big_cap1} == 27  # 25 + floor(25 * 0.10) = 25 + floor(2.5) = 25 + 2, never 27.5 and never 28"
            - "${small_base1} == 10 — base_seat_cap is never mutated by a posture change"
            - "${win_state} == OPEN and ${post2} == CONTINUITY_MODE"
            - "${small_cap2} == 12  # 10 + floor(10 * 0.20); ${big_cap2} == 30  # 25 + floor(25 * 0.20) = 25 + 5"
            - "${big_cap3} == ${big_cap2} == 30 — a second read re-derives the same value; the allowance does not compound"
            - "${term_v1} == 4 and ${term_v2} == 4 — the posture write bumped the term once, and the window create bumps it again before it is used as expected_term_version"

      - name: revised_vendor_metadata_rescores_the_tool_without_advancing_its_approved_version
        claim_type: weighted_scoring
        grounds:
          - calculations.tool_approval_risk_score
          - endpoints[PATCH /tool-integrations/{id}]
          - entities.ToolIntegration.fields.risk_score
        distinguishing_aspect: "Each PATCH re-runs the whole weighted sum rather than nudging the stored score: a one-point VPAT improvement moves the score by exactly 0.30 (68.50 -> 68.20), and changing two weights at once (pii_tier 2 -> 0 and wcag A -> AAA, the negative-credit level) lands on 33.20. The AAA credit is the discriminator — a max(0, wcag) implementation reports 38.20."
        test_recipe:
          setup:
            - "One DRAFT tool with pii_tier 2, data_sharing_scope ROSTER_AND_GRADES, vpat_score 55.00 and wcag_level A."
          setup_api_calls:
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Gamma", tool_name: "AnalyticsPro", tool_version: "1.0.0", data_sharing_scope: "ROSTER_AND_GRADES", pii_tier: 2, vpat_score: 55.00, wcag_level: "A" }
              as: LmsAdmin
              captures: { tool_id: $.data.id, risk0: $.data.risk_score, state0: $.data.approval_state, appr0: $.data.approved_version, v0: $.data.version }
          trigger:
            - call: "PATCH /tool-integrations/${tool_id}"
              payload: { vpat_score: 56.00 }
              as: LmsAdmin
              captures: { risk1: $.data.risk_score, v1: $.data.version }
            - call: "PATCH /tool-integrations/${tool_id}"
              payload: { pii_tier: 0, wcag_level: "AAA" }
              as: LmsAdmin
              captures: { risk2: $.data.risk_score, v2: $.data.version }
            - call: "PATCH /tool-integrations/${tool_id}"
              payload: { data_sharing_scope: "FULL_PROFILE" }
              as: LmsAdmin
              captures: { risk3: $.data.risk_score, state3: $.data.approval_state, appr3: $.data.approved_version, v3: $.data.version }
          assert:
            - "${risk0} == 68.50  # pii 2*10=20, ROSTER_AND_GRADES 25, (100-55)*0.30=13.50, A 10, exposure 0"
            - "${risk1} == 68.20  # (100-56)*0.30 = 13.20 — a single VPAT point is worth exactly 0.30, so the delta is 0.30 and not 1.00"
            - "${risk2} == 33.20  # 0 + 25 + 13.20 + (-5 for AAA) — the AAA credit is negative and must not be floored to 0 before the sum"
            - "${risk3} == 48.20  # 0 + 40 + 13.20 - 5 — the scope weight swaps 25 for 40"
            - "${state0} == ${state3} == DRAFT and ${appr0} == ${appr3} == null — re-scoring never approves anything by itself"
            - "${v0} == 1, ${v1} == 2, ${v2} == 3, ${v3} == 4"

      - name: the_two_dual_variant_rules_diverge_on_identical_stored_data
        claim_type: variant_divergence
        grounds:
          - calculations.rollover_due_date_projection.variants
          - calculations.final_grade_percentage.variants
        excluded_because:
          difficulty_instance: rollover_due_date_projection_variant_divergence_on_content_item_calendar
          rationale: "Both §1.8 dual_variant_calc instances are exactly this claim and they cover both rules: rollover_due_date_projection_variant_divergence_on_content_item_calendar copies the same ContentItem calendar under ANCHOR_PROPORTIONAL and FIXED_OFFSET and asserts the four-day-twelve-hour delta, and final_grade_percentage_variant_divergence_on_enrollment_gradebook asserts 83.33 versus 62.50 from one gradebook by switching the denominator."

      - name: each_variant_is_selected_by_the_context_that_declares_it
        claim_type: variant_selection
        grounds:
          - calculations.final_grade_percentage.trigger
          - entities.GradePassback.fields.variant_applied
        excluded_because:
          difficulty_instance: final_grade_percentage_variant_divergence_on_enrollment_gradebook
          rationale: "That instance drives the selection as well as the divergence: POST /grade-passbacks stages with variant_applied PROVISIONAL and writes provisional_grade_pct, and the SUBMIT transition flips variant_applied to FINAL and writes final_grade_pct, asserting both fields afterwards. There is no third selection context to test."

      - name: switching_from_provisional_to_final_reconciles_the_passback_ledger
        claim_type: reconciliation
        grounds:
          - calculations.passback_points_ledger
          - state_machines.GradePassback.passback_state.STAGED_to_SUBMITTED
        excluded_because:
          difficulty_instance: upheld_grade_dispute_releases_the_escrow_with_a_zero_drift_two_hundred_fifty_point_ledger
          rationale: "The ledger reconciliation on every variant switch and dispute event is asserted there across the full E1/E2/E4/E5 replay, holding accepted_points_total + disputed_points_held == submitted_points_total at 250.00 with zero drift; final_grade_percentage_variant_divergence_on_enrollment_gradebook additionally asserts the seeding of submitted_points_total at the PROVISIONAL -> FINAL switch."

      - name: event_replay_projects_the_current_state_for_both_projection_rules
        claim_type: projection
        grounds:
          - calculations.rollover_due_date_projection
          - calculations.passback_points_ledger
        excluded_because:
          difficulty_instance: rollover_compensation_returns_the_source_target_pair_to_five_hundred_seventy_stored_megabytes
          rationale: "Both projection-algorithm rules are replayed to a final state in §1.8: that instance replays the rollover copy and its compensation event and asserts the resulting stored megabytes exactly, while upheld_grade_dispute_releases_the_escrow_with_a_zero_drift_two_hundred_fifty_point_ledger replays the passback ledger's E1/E2/E4/E5 event sequence. The projection claim has no residue left here."

  # ===========================================================================
  # 4. Validations  (43 rules, one priority band per rule; lowest number wins)
  # ===========================================================================
  - section: validations
    instances:

      - name: duplicate_term_codes_and_duplicate_vendor_tool_pairs_are_rejected_on_create
        claim_type: violation_to_error
        grounds:
          - validations[7]
          - validations[9]
          - errors[ERR_DUPLICATE_TERM_CODE]
          - errors[ERR_DUPLICATE_TOOL]
        distinguishing_aspect: "Two uniqueness rules with different key shapes: term_code is a single global column, while the tool key is the COMPOSITE (vendor_name, tool_name) — so a second tool from the same vendor under a different name must succeed. An implementation that keys on vendor_name alone rejects the third call."
        test_recipe:
          setup:
            - "One term 2026FA and one tool (Gamma, AnalyticsPro) already exist."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Gamma", tool_name: "AnalyticsPro", tool_version: "1.0.0", data_sharing_scope: "ROSTER_ONLY" }
              as: LmsAdmin
              captures: { tool_id: $.data.id }
          trigger:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-07T00:00:00Z" }
              as: Registrar
              captures: { err_term: $.data.error_id }
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Gamma", tool_name: "AnalyticsPro", tool_version: "2.0.0", data_sharing_scope: "NONE" }
              as: LmsAdmin
              captures: { err_tool: $.data.error_id }
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Gamma", tool_name: "AnalyticsLite", tool_version: "1.0.0", data_sharing_scope: "NONE" }
              as: LmsAdmin
              captures: { second_tool: $.data.id, second_vendor: $.data.vendor_name }
            - call: "POST /academic-terms"
              payload: { term_code: "2027SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-07T00:00:00Z" }
              as: Registrar
              captures: { second_term: $.data.id, second_code: $.data.term_code }
          assert:
            - "${err_term} == ERR_DUPLICATE_TERM_CODE at HTTP 409 — the duplicate is detected on term_code alone, even though the calendar differs"
            - "${err_tool} == ERR_DUPLICATE_TOOL at HTTP 409 — a different tool_version does not make it a different tool"
            - "${second_tool} is a fresh id with ${second_vendor} == \"Gamma\" — the key is the (vendor_name, tool_name) pair, not vendor_name"
            - "${second_term} is a fresh id with ${second_code} == \"2027SP\""
            - "GET /academic-terms returns exactly 2 rows and GET /tool-integrations exactly 2 rows — no rejected create left a partial row behind"

      - name: section_code_uniqueness_is_scoped_to_live_official_shells_of_one_term
        claim_type: satisfaction_to_pass
        grounds:
          - validations[8]
          - state_machines.CourseShell.provisioning_state.REQUESTED_to_REJECTED
          - errors[ERR_DUPLICATE_SECTION_CODE]
        distinguishing_aspect: "The rule has three escape hatches and all three must PASS: a SANDBOX shell may reuse an OFFICIAL section code, a second term may reuse it, and once the holder is REJECTED the code is free again. A naive global-unique index on sis_section_code rejects all three legitimate creates."
        test_recipe:
          setup:
            - "Terms 2026FA and 2027SP exist; one FACULTY owner holds OFFICIAL shell BI300-01 in 2026FA."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { fall_id: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "2027SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-07T00:00:00Z" }
              as: Registrar
              captures: { spring_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6070", full_name: "Shafi Goldwasser", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${fall_id}", owner_person_id: "${prof_id}", sis_section_code: "BI300-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { first_shell: $.data.id }
          trigger:
            - call: "POST /course-shells"
              payload: { term_id: "${fall_id}", owner_person_id: "${prof_id}", sis_section_code: "BI300-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { err_dup: $.data.error_id }
            - call: "POST /course-shells"
              payload: { term_id: "${fall_id}", owner_person_id: "${prof_id}", sis_section_code: "BI300-01", shell_type: "SANDBOX", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { sandbox_shell: $.data.id, sandbox_type: $.data.shell_type }
            - call: "POST /course-shells"
              payload: { term_id: "${spring_id}", owner_person_id: "${prof_id}", sis_section_code: "BI300-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { spring_shell: $.data.id }
            - call: "POST /course-shells/${first_shell}/provisioning-decisions"
              payload: { decision: "REJECT", reason: "section cancelled" }
              as: LmsAdmin
              captures: { first_state: $.data.provisioning_state }
            - call: "POST /course-shells"
              payload: { term_id: "${fall_id}", owner_person_id: "${prof_id}", sis_section_code: "BI300-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { replacement_shell: $.data.id, replacement_state: $.data.provisioning_state }
          assert:
            - "${err_dup} == ERR_DUPLICATE_SECTION_CODE at HTTP 409 — the rule does fire for a live OFFICIAL twin"
            - "${sandbox_shell} is created with ${sandbox_type} == SANDBOX — SANDBOX and DEV shells are exempt from the code"
            - "${spring_shell} is created — the uniqueness key is (term_id, sis_section_code), not sis_section_code"
            - "${first_state} == REJECTED, after which ${replacement_shell} is created with ${replacement_state} == REQUESTED — a REJECTED holder releases the code"
            - "GET /course-shells with term_id ${fall_id} returns 3 rows (REJECTED original, SANDBOX twin, replacement)"

      - name: lower_numbered_validation_bands_win_when_two_rules_fire_on_one_request
        claim_type: priority_ordering
        grounds:
          - validations[2]
          - validations[4]
          - validations[6]
          - validations[7]
        distinguishing_aspect: "Three pairs, each one band apart in the ordered table: role (2) beats not-found (4), not-found (4) beats body validation (6), and body validation (6) beats the uniqueness band (7). Any implementation that validates the body before resolving the path id leaks ERR_INVALID_REQUEST where a 404 is required."
        test_recipe:
          setup:
            - "One term 2026FA exists so the uniqueness rule at priority 7 is armed."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
          trigger:
            - call: "GET /course-shells/00000000-0000-4000-8000-000000000901"
              payload: {}
              as: PrivacyReviewer
              as_user_id: "rev-p"
              captures: { err_role: $.data.error_id }
            - call: "PATCH /academic-terms/00000000-0000-4000-8000-000000000902"
              payload: { retention_class: "PERMANENT" }
              as: Registrar
              captures: { err_missing: $.data.error_id }
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2027-05-07T00:00:00Z", term_end_at: "2027-01-11T00:00:00Z" }
              as: Registrar
              captures: { err_body: $.data.error_id }
          assert:
            - "${err_role} == ERR_ROLE_NOT_PERMITTED at HTTP 403 — PrivacyReviewer is not on GET /course-shells/{id}, and the missing shell is never looked up, so ERR_SHELL_NOT_FOUND must NOT be returned"
            - "${err_missing} == ERR_TERM_NOT_FOUND at HTTP 404 — the unknown path id outranks the invalid retention_class enum in the same request"
            - "${err_body} == ERR_INVALID_REQUEST at HTTP 400 — term_end_at before term_start_at (priority 6) outranks the duplicate term_code (priority 7), and no second term is created"
            - "GET /academic-terms returns exactly 1 row after all three rejections"

      - name: time_gated_writes_compare_the_logical_clock_at_their_exact_boundary_instants
        claim_type: temporal_validation
        grounds:
          - validations[25]
          - validations[26]
          - state_machines.ContinuityWindow.window_state.OPEN_to_CANCELLED
          - errors[ERR_WINDOW_ALREADY_STARTED]
          - errors[ERR_SANDBOX_EXPIRED]
        distinguishing_aspect: "Two temporal rules with OPPOSITE strictness on their boundary: cancelling requires `clock < window_start` (strict, so a window already under way is frozen), while sandbox content is refused only AFTER sandbox_expires_at, so a write landing exactly on 2027-02-09T00:00:00Z must still succeed. Implementing both with the same comparator breaks one of the two legs."
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION. A SANDBOX shell created against it has sandbox_expires_at 2027-02-09T00:00:00Z (term_end_at 2026-12-11 + 60 days)."
            - "The logical clock starts at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
              captures: { term_v0: $.data.version }
            - call: "POST /people"
              payload: { sis_person_id: "F-6080", full_name: "Radia Perlman", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "SBX-T1", shell_type: "SANDBOX", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { sbx_id: $.data.id, expires_at: $.data.sandbox_expires_at }
          trigger:
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "MAINTENANCE", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-12T00:00:00Z", expected_term_version: "${term_v0}" }
              as: LmsAdmin
              captures: { w1: $.data.id, w1_state: $.data.window_state }
            - call: "POST /continuity-windows/${w1}/transitions"
              payload: { action: "CANCEL" }
              as: LmsAdmin
              captures: { w1_state_after: $.data.window_state, w1_affected: $.data.affected_enrollment_count, w1_ext: $.data.extension_days_granted }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { term_v1: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "MAINTENANCE", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-20T00:00:00Z", expected_term_version: "${term_v1}" }
              as: LmsAdmin
              captures: { w2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: LmsAdmin
            - call: "POST /continuity-windows/${w2}/transitions"
              payload: { action: "CANCEL" }
              as: LmsAdmin
              captures: { err_started: $.data.error_id }
            - call: "POST /continuity-windows/${w2}/transitions"
              payload: { action: "CLOSE" }
              as: LmsAdmin
              captures: { w2_state: $.data.window_state, w2_closed_at: $.data.closed_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-09T00:00:00Z" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${sbx_id}", item_type: "PAGE", title: "syllabus draft", storage_mb: 5.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_at_boundary: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-09T00:00:01Z" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${sbx_id}", item_type: "PAGE", title: "too late", storage_mb: 5.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { err_expired: $.data.error_id }
          assert:
            - "${expires_at} == \"2027-02-09T00:00:00Z\" — term_end_at plus SANDBOX_GRACE_DAYS 60"
            - "${w1_state} == OPEN at creation, then ${w1_state_after} == CANCELLED with ${w1_affected} == 0 and ${w1_ext} == 0 — cancelled at 2026-08-01, strictly before its 2026-08-10 start"
            - "${err_started} == ERR_WINDOW_ALREADY_STARTED at HTTP 409 — at 2026-08-03 the clock is past the 2026-08-02 start, so CANCEL is frozen while CLOSE is not"
            - "${w2_state} == CLOSED with ${w2_closed_at} == \"2026-08-03T00:00:00Z\" — stamped from the logical clock, not wall time"
            - "${item_at_boundary} is created at exactly sandbox_expires_at — the rule refuses content AFTER the instant, so the instant itself is inside the window"
            - "${err_expired} == ERR_SANDBOX_EXPIRED at HTTP 409 one second later"

      - name: sandbox_shell_ceiling_counts_only_live_sandbox_and_dev_shells_per_owner
        claim_type: aggregate_validation
        grounds:
          - validations[42]
          - calculations.sandbox_storage_chargeback.constants.MAX_SANDBOX_SHELLS_PER_PERSON
          - errors[ERR_SANDBOX_QUOTA_EXCEEDED]
        distinguishing_aspect: "Every individual create is legal; only the collective breaks the ceiling, and the ceiling counts SANDBOX plus DEV together while ignoring OFFICIAL shells and REJECTED rows. The fourth create must fail, an unlimited OFFICIAL create must still succeed, and rejecting one of the three must free the slot so the same fourth create then succeeds."
        test_recipe:
          setup:
            - "One FACULTY owner and one term; the owner is given two SANDBOX shells and one DEV shell, exactly MAX_SANDBOX_SHELLS_PER_PERSON."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6090", full_name: "Sophie Wilson", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "SBX-Q1", shell_type: "SANDBOX", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { q1: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "DEV-Q2", shell_type: "DEV", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { q2: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "SBX-Q3", shell_type: "SANDBOX", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { q3: $.data.id }
          trigger:
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "DEV-Q4", shell_type: "DEV", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { err_quota: $.data.error_id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CH150-01", shell_type: "OFFICIAL", base_seat_cap: 60 }
              as: LmsAdmin
              captures: { official_id: $.data.id, official_type: $.data.shell_type }
            - call: "POST /course-shells/${q3}/provisioning-decisions"
              payload: { decision: "REJECT", reason: "not needed" }
              as: LmsAdmin
              captures: { q3_state: $.data.provisioning_state }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "DEV-Q4", shell_type: "DEV", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { q4: $.data.id, q4_type: $.data.shell_type }
          assert:
            - "${err_quota} == ERR_SANDBOX_QUOTA_EXCEEDED at HTTP 422 — the fourth SANDBOX/DEV shell breaks the aggregate even though each shell is individually valid"
            - "${official_id} is created with ${official_type} == OFFICIAL — OFFICIAL shells are outside the counted set entirely"
            - "${q3_state} == REJECTED, after which ${q4} is created with ${q4_type} == DEV — REJECTED rows leave the counted set and free a slot"
            - "GET /course-shells with owner_person_id ${prof_id} and shell_type SANDBOX returns 2 rows; the DEV filter returns 1 live row"

      - name: publish_and_student_enrollment_rules_apply_only_to_sandbox_and_dev_shell_types
        claim_type: conditional_validation
        grounds:
          - validations[32]
          - errors[ERR_SANDBOX_NOT_PUBLISHABLE]
        distinguishing_aspect: "One rule with two conditional dimensions: it fires only for shell_type IN {SANDBOX, DEV}, and inside that only for role STUDENT. So the same SANDBOX shell must refuse publish and refuse a STUDENT row while ACCEPTING a DESIGNER row, and the OFFICIAL twin must accept both operations."
        test_recipe:
          setup:
