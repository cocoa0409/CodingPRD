              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/rating-engagements"
              payload: { agency: "MOODYS" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { eng_m_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/rating-engagements"
              payload: { agency: "SP" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { eng_s_id: $.data.id }
            - call: "POST /bond-offerings/rating-engagements/${eng_m_id}/presentations"
              payload: { starts_at: "2026-08-10T14:00:00.000Z", ends_at: "2026-08-10T16:00:00.000Z", attendee_count: 6 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { pres_a1_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/rating-engagements/${eng_m_id}/presentations"
              payload: { starts_at: "2026-08-10T17:00:00.000Z", ends_at: "2026-08-10T19:00:00.000Z", attendee_count: 4 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/rating-engagements/${eng_m_id}/presentations"
              payload: { starts_at: "2026-08-10T12:00:00.000Z", ends_at: "2026-08-10T13:01:00.000Z", attendee_count: 4 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/rating-engagements/${eng_m_id}/presentations"
              payload: { starts_at: "2026-08-10T12:00:00.000Z", ends_at: "2026-08-10T13:00:00.000Z", attendee_count: 4 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/rating-engagements/${eng_s_id}/presentations"
              payload: { starts_at: "2026-08-10T14:30:00.000Z", ends_at: "2026-08-10T15:30:00.000Z", attendee_count: 26 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/rating-engagements/${eng_s_id}/presentations"
              payload: { starts_at: "2026-08-10T14:30:00.000Z", ends_at: "2026-08-10T15:30:00.000Z", attendee_count: 8 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "GET /bond-offerings/rating-engagements/${eng_m_id}/presentations"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /bond-offerings/rating-engagements/${eng_s_id}/presentations"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the 17:00-19:00 MOODYS slot returns 201: the gap from ${pres_a1_id}.ends_at 16:00 is exactly PRESENTATION_BUFFER_MINUTES"
            - "the 12:00-13:01 MOODYS slot returns 422 with error_id ERR_PRESENTATION_BUFFER_CONFLICT: the gap to 14:00 is 59 minutes"
            - "the 12:00-13:00 MOODYS slot returns 201: the gap to 14:00 is exactly 60 minutes"
            - "the SP slot with attendee_count 26 returns 422 with error_id ERR_INVALID_REQUEST because attendee_count exceeds 25"
            - "the SP slot 14:30-15:30 with attendee_count 8 returns 201 even though it lies wholly inside the MOODYS 14:00-16:00 presentation, because the buffer is scoped per agency"
