      - name: detection_with_no_matched_application_is_unknown_domain
        claim_type: Correct Result
        grounds:
          - calculations.detection_classification
          - calculations.detection_exposure_score
        distinguishing_aspect: |
          Branch 1 of the classification selector short-circuits on a null
          application_id: the row must be UNKNOWN_DOMAIN with matched_catalog_entry_id
          null, and the exposure score must use the UNKNOWN_DOMAIN base of 30, not the
          UNAUTHORIZED base of 45: 30 * 0.4 + 120 * 0.05 + 30 == 48.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no applications registered at all, so the collector cannot match the domain."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
          trigger:
