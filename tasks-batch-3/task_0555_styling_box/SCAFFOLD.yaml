# =============================================================================
# task_0555_styling_box — Personal Styling Subscription Box (Stitch Fix style)
# Seed tables §1.0–§1.7. Expert difficulty.
# =============================================================================

scenario: |
  Personal Styling Subscription Box (Stitch Fix style): style-profile quiz & size,
  stylist-curated fix & shipment cadence, try-at-home & checkout/keep, styling fee
  credit toward purchase, return label & restock, buy-the-look & direct-buy,
  feedback loop & sizing learning, pause/skip/cancel

domain_name: styling-box
api_prefix: ""   # multi-root flat topology; every collection is a top-level segment

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid           # Client→Fix→FixItem tree + cross-aggregate Product/Stylist refs
  state_machine_shape: cyclic       # Client ACTIVE↔PAUSED, Fix STYLING↔PREVIEW revision loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # FixItem→Product, Fix→Stylist
  role_model: peer_roles            # Client / Stylist own disjoint resource types; OpsAdmin operational
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique across Clients" }
      - { name: full_name, type: string, source: input, description: "Subscriber name" }
      - { name: region_code, type: enum, source: input, description: "Tax region; drives checkout tax_rate", constraints: "one of CA, NY, OR" }
      - { name: cadence, type: enum, source: input, default: MONTHLY, description: "Shipment cadence", constraints: "one of EVERY_2_WEEKS, MONTHLY, EVERY_2_MONTHS, QUARTERLY" }
      - { name: status, type: enum, source: system, description: "Subscription lifecycle", constraints: "PROSPECT, ACTIVE, PAUSED, CANCELLED" }

  - name: StyleProfile
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; one profile per client" }
      - { name: quiz_top_size, type: integer, source: input, description: "Declared top size from quiz" }
      - { name: quiz_bottom_size, type: integer, source: input, description: "Declared bottom size from quiz" }
      - { name: quiz_shoe_size, type: integer, source: input, description: "Declared shoe size from quiz" }
      - { name: price_tier, type: enum, source: input, description: "Preferred price band", constraints: "BUDGET, MID, PREMIUM" }
      - { name: style_tags, type: array, source: input, default: [], description: "Free-form style preference tags" }
      - { name: learned_top_size, type: integer, source: computed, description: "Weighted-learned top size (learned_sizing calc, weighted variant)" }
      - { name: learned_bottom_size, type: integer, source: computed, description: "Weighted-learned bottom size (learned_sizing calc, weighted variant)" }
      - { name: learned_shoe_size, type: integer, source: computed, description: "Learned shoe size (learned_sizing calc, latest variant)" }
      - { name: fit_confidence, type: integer, source: computed, description: "0-100 fit confidence (fit_confidence calc)" }
      - { name: feedback_count, type: integer, source: computed, description: "Count of FeedbackEntry rows for this client" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU", constraints: "unique across Products" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "Garment category", constraints: "TOP, BOTTOM, SHOE, ACCESSORY" }
      - { name: size, type: integer, source: input, description: "Numeric size of this SKU" }
      - { name: price_cents, type: integer, source: input, description: "List price in cents", constraints: ">= 0" }
      - { name: style_tags, type: array, source: input, default: [], description: "Style tags used for curation matching" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", constraints: "ACTIVE, DISCONTINUED" }
      - { name: total_stock, type: integer, source: input, description: "Total owned units; conserved invariant base", constraints: ">= 0" }
      - { name: available_count, type: integer, source: computed, description: "Units free to reserve; invariant: available+reserved+sold == total_stock" }
      - { name: reserved_count, type: integer, source: computed, description: "Units held by SELECTED FixItems or PLACED Purchases" }
      - { name: sold_count, type: integer, source: computed, description: "Units consumed by KEPT FixItems or CANCELLED-refunded excluded" }

  - name: Stylist
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Stylist login email", constraints: "unique across Stylists" }
      - { name: name, type: string, source: input, description: "Stylist name" }
      - { name: max_concurrent_fixes, type: integer, source: input, default: 5, description: "Aggregate capacity of concurrently active assigned fixes", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", constraints: "ACTIVE, INACTIVE" }
      - { name: active_fix_count, type: integer, source: computed, description: "Count of assigned fixes in {STYLING, PREVIEW, SHIPPED, DELIVERED} (stylist_capacity calc)" }

  - name: Fix
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: stylist_id, type: string, source: system, description: "FK -> Stylist.id; null until assigned" }
      - { name: status, type: enum, source: system, description: "REQUESTED, STYLING, PREVIEW, SHIPPED, DELIVERED, CHECKED_OUT, CLOSED, CANCELLED" }
      - { name: scheduled_ship_date, type: datetime, source: computed, description: "Planned ship instant (next_ship_date calc)" }
      - { name: shipped_at, type: datetime, source: system, description: "Set on ship; null before" }
      - { name: delivered_at, type: datetime, source: system, description: "Set on mark-delivered; null before" }
      - { name: checkout_deadline, type: datetime, source: computed, description: "delivered_at + TRY_AT_HOME_DAYS; try-at-home window end (inclusive)" }
      - { name: item_count, type: integer, source: computed, description: "Count of FixItems in {SELECTED, KEPT, RETURNED} for this fix" }
      - { name: kept_count, type: integer, source: computed, description: "Count of KEPT FixItems" }
      - { name: returned_count, type: integer, source: computed, description: "Count of RETURNED FixItems" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of price_cents of currently-priced items per active variant (fix_charge)" }
      - { name: estimated_charge_cents, type: integer, source: computed, description: "Provisional charge computed at DELIVERED assuming keep-all (fix_charge provisional variant); null before DELIVERED" }
      - { name: charge_cents, type: integer, source: computed, description: "Final charge computed at CHECKED_OUT over kept items (fix_charge final variant); null before checkout" }
      - { name: buy_the_look_applied, type: boolean, source: computed, description: "True when all items kept and item_count>=1" }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "Shipping fee on the fix charge (shipping_fee calc)" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on taxable base (fix_charge)" }
      - { name: styling_fee_charged_cents, type: integer, source: system, description: "STYLING_FEE snapshot recorded at ship; 0 before ship" }
      - { name: styling_fee_credit_cents, type: integer, source: computed, description: "Styling fee credited toward purchase at checkout (styling_fee_ledger calc)" }
      - { name: styling_fee_forfeited_cents, type: integer, source: computed, description: "Styling fee forfeited at checkout when nothing kept (styling_fee_ledger calc)" }

  - name: FixItem
    parent: Fix
    common_fields: true
    fields:
      - { name: fix_id, type: string, source: system, description: "FK -> Fix.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: price_cents, type: integer, source: system, description: "Snapshot of Product.price_cents at selection" }
      - { name: size, type: integer, source: system, description: "Snapshot of Product.size at selection (used by learned_sizing)" }
      - { name: category, type: enum, source: system, description: "Snapshot of Product.category at selection", constraints: "TOP, BOTTOM, SHOE, ACCESSORY" }
      - { name: status, type: enum, source: system, description: "SELECTED, KEPT, RETURNED, RELEASED", constraints: "SELECTED, KEPT, RETURNED, RELEASED" }

  - name: FeedbackEntry
    parent: Client
    common_fields: false   # append-only event: id + created_at only, immutable
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: fix_item_id, type: string, source: system, description: "FK -> FixItem.id" }
      - { name: product_size, type: integer, source: system, description: "FixItem.size snapshot at feedback time" }
      - { name: category, type: enum, source: system, description: "Category of the item", constraints: "TOP, BOTTOM, SHOE, ACCESSORY" }
      - { name: rating, type: enum, source: input, description: "Fit rating", constraints: "TOO_SMALL, SLIGHTLY_SMALL, PERFECT, SLIGHTLY_LARGE, TOO_LARGE" }

  - name: ReturnShipment
    parent: Fix
    common_fields: true
    fields:
      - { name: fix_id, type: string, source: system, description: "FK -> Fix.id" }
      - { name: status, type: enum, source: system, description: "LABEL_ISSUED, IN_TRANSIT, RECEIVED", constraints: "LABEL_ISSUED, IN_TRANSIT, RECEIVED" }
      - { name: item_ids, type: array, source: system, description: "FixItem ids in RETURNED status covered by this label" }
      - { name: received_at, type: datetime, source: system, description: "Set when received; null before" }

  - name: Hold
    parent: Client
    common_fields: false   # immutable vacation-hold record: id + created_at
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: start_date, type: datetime, source: input, description: "Hold window start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Hold window end (exclusive); half-open [start, end)" }

  - name: Purchase
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: quantity, type: integer, source: input, description: "Units bought directly", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of Product.price_cents at purchase" }
      - { name: total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: status, type: enum, source: system, description: "PLACED, CANCELLED", constraints: "PLACED, CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Client subscription lifecycle (cyclic: ACTIVE<->PAUSED) -----
  - entity: Client
    field: status
    initial_state: PROSPECT
    terminal_states: [CANCELLED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /clients/{id}/style-profile"
        actor: Client
        preconditions:
          - "Client has no StyleProfile yet (status == PROSPECT)"
        side_effects:
          - "Create StyleProfile; learned_top_size=quiz_top_size, learned_bottom_size=quiz_bottom_size, learned_shoe_size=quiz_shoe_size, fit_confidence=0, feedback_count=0"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /clients/{id}/pause"
        actor: Client
        preconditions: []
        side_effects:
          - "Every Fix of this client in REQUESTED status -> CANCELLED (cascade); each cascaded Fix releases its SELECTED FixItems -> RELEASED, which restocks each item's Product (reserved_count-1, available_count+1)"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /clients/{id}/resume"
        actor: Client
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /clients/{id}/cancel"
        actor: Client
        preconditions:
          - "Client has no Fix in {SHIPPED, DELIVERED} (in-flight box must complete checkout first)"
        side_effects:
          - "Every Fix of this client in {REQUESTED, STYLING, PREVIEW} -> CANCELLED (cascade); each cascaded Fix's SELECTED FixItems -> RELEASED, which restocks each Product (reserved_count-1, available_count+1); each cascaded Fix's stylist active_fix_count recomputed"

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /clients/{id}/cancel"
        actor: Client
        preconditions:
          - "Client has no Fix in {SHIPPED, DELIVERED}"
        side_effects:
          - "Same cascade as ACTIVE->CANCELLED over {REQUESTED, STYLING, PREVIEW} fixes"

  # ----- Fix lifecycle (cyclic: STYLING<->PREVIEW revision loop) -----
  - entity: Fix
    field: status
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: STYLING
        trigger: "POST /fixes/{id}/assign"
        actor: OpsAdmin
        preconditions:
          - "Owning Client.status == ACTIVE (cross-entity: Fix depends on Client)"
          - "Target Stylist.status == ACTIVE"
          - "Target Stylist.active_fix_count < Stylist.max_concurrent_fixes (aggregate capacity)"
        side_effects:
          - "Set Fix.stylist_id; recompute Stylist.active_fix_count (+1)"

      - from: STYLING
        to: PREVIEW
        trigger: "POST /fixes/{id}/submit-preview"
        actor: Stylist
        preconditions:
          - "MIN_ITEMS <= item_count <= MAX_ITEMS (item_count >= 3)"
        side_effects: []

      - from: PREVIEW
        to: STYLING
        trigger: "POST /fixes/{id}/request-changes"
        actor: Client
        preconditions: []
        side_effects:
          - "Stylist may edit items again (revision loop)"

      - from: PREVIEW
        to: SHIPPED
        trigger: "POST /fixes/{id}/ship"
        actor: OpsAdmin
        preconditions:
          - "Owning Client.status == ACTIVE"
          - "MIN_ITEMS <= item_count <= MAX_ITEMS"
        side_effects:
          - "styling_fee_charged_cents = STYLING_FEE_CENTS (2000); shipped_at = current clock"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /fixes/{id}/mark-delivered"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "delivered_at = current clock; checkout_deadline = delivered_at + TRY_AT_HOME_DAYS (3 days)"
          - "Compute estimated_charge_cents via fix_charge provisional variant (assume keep-all); also set shipping_fee_cents/tax_cents for that provisional total"

      - from: DELIVERED
        to: CHECKED_OUT
        trigger: "POST /fixes/{id}/checkout"
        actor: Client
        preconditions:
          - "Acting Client owns this Fix"
          - "current clock <= checkout_deadline (inclusive boundary)"
          - "Every id in kept_item_ids is a SELECTED FixItem of this Fix"
        side_effects:
          - "FixItems in kept_item_ids -> KEPT (each: Product reserved_count-1, sold_count+1); all other SELECTED FixItems -> RETURNED (inventory stays reserved)"
          - "Compute charge_cents via fix_charge final variant over kept items; set buy_the_look_applied, shipping_fee_cents, tax_cents"
          - "Compute styling_fee_credit_cents and styling_fee_forfeited_cents via styling_fee_ledger"
          - "For each item_feedback entry: create FeedbackEntry (cascade); then recompute owning Client's StyleProfile learned_top_size/learned_bottom_size/learned_shoe_size (learned_sizing) and fit_confidence and feedback_count"
          - "If returned_count == 0: Fix -> CLOSED immediately (no ReturnShipment). Else create ReturnShipment (LABEL_ISSUED) listing the RETURNED FixItem ids"

      - from: DELIVERED
        to: CHECKED_OUT
        trigger: "POST /_ops/run-checkout-sweep (system, deadline expired)"
        actor: system
        preconditions:
          - "current clock > checkout_deadline"
        side_effects:
          - "Auto keep-all: every SELECTED FixItem -> KEPT (Product reserved_count-1, sold_count+1); buy_the_look_applied=true"
          - "Compute charge_cents via fix_charge final variant (all kept); styling_fee_ledger applies full credit"
          - "returned_count==0 so Fix -> CLOSED immediately; no feedback created"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /clients/{id}/pause | POST /clients/{id}/cancel | POST /clients/{id}/fixes (supersede)"
        actor: system
        preconditions: []
        side_effects:
          - "SELECTED FixItems (if any) -> RELEASED, restocking each Product (reserved_count-1, available_count+1)"

      - from: STYLING
        to: CANCELLED
        trigger: "POST /clients/{id}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "SELECTED FixItems -> RELEASED, restocking each Product (reserved_count-1, available_count+1); recompute Stylist.active_fix_count"

      - from: PREVIEW
        to: CANCELLED
        trigger: "POST /clients/{id}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "SELECTED FixItems -> RELEASED, restocking each Product; recompute Stylist.active_fix_count"

      - from: CHECKED_OUT
        to: CLOSED
        trigger: "POST /fixes/{id}/returns/{return_id}/receive"
        actor: OpsAdmin
        preconditions:
          - "Fix has an outstanding ReturnShipment being received"
        side_effects:
          - "ReturnShipment -> RECEIVED; each RETURNED FixItem's Product restocked (reserved_count-1, available_count+1)"

  # ----- FixItem lifecycle -----
  - entity: FixItem
    field: status
    initial_state: SELECTED
    terminal_states: [KEPT, RETURNED, RELEASED]
    transitions:
      - from: SELECTED
        to: KEPT
        trigger: "POST /fixes/{id}/checkout (item in kept_item_ids) | POST /_ops/run-checkout-sweep"
        actor: system
        preconditions: []
        side_effects:
          - "Owning Product: reserved_count-1, sold_count+1"

      - from: SELECTED
        to: RETURNED
        trigger: "POST /fixes/{id}/checkout (item not in kept_item_ids)"
        actor: system
        preconditions: []
        side_effects:
          - "Item added to the Fix's ReturnShipment.item_ids; Product inventory unchanged (stays reserved until receive)"

      - from: RETURNED
        to: RETURNED
        trigger: "POST /fixes/{id}/returns/{return_id}/receive (restock, status unchanged)"
        actor: system
        preconditions: []
        side_effects:
          - "Owning Product: reserved_count-1, available_count+1 (restock)"

      - from: SELECTED
        to: RELEASED
        trigger: "POST /fixes/{id}/items/{item_id}/remove | fix cancellation cascade"
        actor: system
        preconditions:
          - "Fix in {STYLING, PREVIEW} when removed by stylist, or fix being cancelled"
        side_effects:
          - "Owning Product: reserved_count-1, available_count+1 (restock)"

  # ----- ReturnShipment lifecycle -----
  - entity: ReturnShipment
    field: status
    initial_state: LABEL_ISSUED
    terminal_states: [RECEIVED]
    transitions:
      - from: LABEL_ISSUED
        to: IN_TRANSIT
        trigger: "POST /fixes/{id}/returns/{return_id}/ship"
        actor: Client
        preconditions:
          - "Acting Client owns the parent Fix"
        side_effects: []

      - from: LABEL_ISSUED
        to: RECEIVED
        trigger: "POST /fixes/{id}/returns/{return_id}/receive"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "received_at = current clock; restock all RETURNED items; parent Fix -> CLOSED (bubble up)"

      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /fixes/{id}/returns/{return_id}/receive"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "received_at = current clock; restock all RETURNED items; parent Fix -> CLOSED (bubble up)"

  # ----- Stylist lifecycle -----
  - entity: Stylist
    field: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /stylists/{id}/deactivate"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["Stylist can no longer be assigned new fixes (assign rejected with ERR_STYLIST_INACTIVE)"]

  # ----- Purchase (direct-buy) lifecycle -----
  - entity: Purchase
    field: status
    initial_state: PLACED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLACED
        to: CANCELLED
        trigger: "POST /purchases/{id}/cancel"
        actor: Client
        preconditions:
          - "Acting Client owns the Purchase"
        side_effects:
          - "Owning Product: sold_count-1, available_count+1 (compensating restock)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: fix-schedule-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{id}/fixes"
    occ_field: "expected_client_version"
    description: |
      Scheduling a new Fix against a Client whose version has advanced since the
      client was last observed is rejected. The product allows a freshly scheduled
      Fix to supersede any prior REQUESTED Fix (which is auto-CANCELLED); if another
      writer has already scheduled — advancing the client's version and superseding
      the prior request — the current writer's stale view must not create a second
      superseding Fix. Reduced to a stale-version precondition check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fix_charge
    trigger: "Fix SHIPPED->DELIVERED (provisional variant) and Fix DELIVERED->CHECKED_OUT (final variant)"
    algorithm: aggregation
    formula: |
      # Evaluate over a set K of items (see variants for which set).
      subtotal = sum(item.price_cents for item in K)
      all_kept = (len(K) == item_count) and (item_count >= 1)
      discount = round_half_up(subtotal * BUY_THE_LOOK_DISCOUNT_PCT) if all_kept else 0
      credit   = STYLING_FEE_CENTS if len(K) >= 1 else 0          # styling fee credit toward purchase
      net = max(0, subtotal - discount - credit)
      # shipping_fee resolved by the shipping_fee calc (keyed on net); 0 when len(K)==0
      shipping = shipping_fee(net, len(K))
      taxable = net + shipping
      tax = round_half_up(taxable * TAX_RATE[region_code])        # single round on the aggregate base
      total = taxable + tax
      # Outputs: subtotal_cents, buy_the_look_applied=all_kept, shipping_fee_cents=shipping,
      #          tax_cents=tax, and (provisional) estimated_charge_cents OR (final) charge_cents = total
    input_set: "Items that are FixItems of the fix; K differs by variant (see below)"
    constants:
      STYLING_FEE_CENTS: 2000
      BUY_THE_LOOK_DISCOUNT_PCT: 0.25
      TAX_RATE: { CA: 0.0725, NY: 0.04, OR: 0.0 }
    precision: "cents, integer; round_half_up on discount and tax"
    variants:
      - name: provisional
        when: "Computed at SHIPPED->DELIVERED; writes estimated_charge_cents"
        difference: "K = ALL FixItems of the fix (assume the client keeps everything); all_kept is therefore true"
      - name: final
        when: "Computed at DELIVERED->CHECKED_OUT; writes charge_cents"
        difference: "K = only the FixItems in kept_item_ids (transitioned to KEPT); all_kept true only if every item kept"

  - name: shipping_fee
    trigger: "Invoked inside fix_charge for both variants"
    algorithm: threshold
    formula: |
      # Apparent circularity: total includes shipping, yet free-shipping is a tier on 'total'.
      # Pinned evaluation order resolves it: the waiver is tested on `net` (the pre-shipping
      # net-after-discounts base), NOT on any total that already includes shipping.
      if kept_count == 0: return 0
      if net >= FREE_SHIP_NET_THRESHOLD_CENTS: return 0     # waived (>= boundary)
      else: return SHIPPING_FEE_CENTS
    input_set: "net = subtotal - discount - credit for the fix's evaluated item set"
    constants:
      SHIPPING_FEE_CENTS: 795
      FREE_SHIP_NET_THRESHOLD_CENTS: 7500
    precision: "cents, integer"

  - name: learned_sizing
    trigger: "Recomputed on Fix DELIVERED->CHECKED_OUT after FeedbackEntry rows are created"
    algorithm: weighted_scoring
    formula: |
      # Per category C, over the client's FeedbackEntry rows with that category.
      # implied_ideal(f) = f.product_size + ADJUSTMENT[f.rating]
      # Order feedback by created_at DESC (most recent first); rank r = 0,1,2,...
      #   ties in created_at broken by created_at ASC of the fix_item (fallback: created_at,
      #   never id). Tests space feedback across the logical clock to keep order total.
      # weight(r) = DECAY ** r
      # WEIGHTED variant (TOP, BOTTOM):
      #   value = sum(weight(r)*implied_ideal_r) / sum(weight(r))
      #   learned = round_half_up(value)
      # LATEST variant (SHOE):
      #   learned = round_half_up(implied_ideal of the single most-recent SHOE feedback)
      # If a category has zero feedback: learned_<cat>_size stays equal to the quiz size.
    input_set: "FeedbackEntry rows of the client grouped by category"
    constants:
      DECAY: 0.5
      ADJUSTMENT: { TOO_SMALL: 1.0, SLIGHTLY_SMALL: 0.5, PERFECT: 0.0, SLIGHTLY_LARGE: -0.5, TOO_LARGE: -1.0 }
    precision: "integer sizes; round_half_up"
    variants:
      - name: weighted
        when: "learned_top_size and learned_bottom_size"
        difference: "decay-weighted mean of implied ideals over full feedback history"
      - name: latest
        when: "learned_shoe_size"
        difference: "uses only the single most-recent SHOE feedback's implied ideal — ignores older shoe feedback"

  - name: fit_confidence
    trigger: "Recomputed on Fix DELIVERED->CHECKED_OUT alongside learned_sizing"
    algorithm: aggregation
    formula: |
      # Over ALL FeedbackEntry rows of the client (every category).
      # match(rating): PERFECT=1.0, SLIGHTLY_SMALL=0.6, SLIGHTLY_LARGE=0.6, TOO_SMALL=0.0, TOO_LARGE=0.0
      # fit_confidence = round_half_up(100 * sum(match)/count) ; 0 when count == 0
    input_set: "All FeedbackEntry rows of the client"
    constants:
      MATCH: { PERFECT: 1.0, SLIGHTLY_SMALL: 0.6, SLIGHTLY_LARGE: 0.6, TOO_SMALL: 0.0, TOO_LARGE: 0.0 }
    precision: "integer 0-100, round_half_up"

  - name: inventory_counts
    trigger: "FixItem SELECTED (reserve), KEPT (sell), RETURNED->restock, RELEASED (release); Purchase PLACED (sell), CANCELLED (restock); Product restock endpoint"
    algorithm: aggregation
    formula: |
      # Conserved invariant maintained at all times for every Product:
      #   available_count + reserved_count + sold_count == total_stock
      # reserve:  available-1, reserved+1     (FixItem select, Purchase place)
      # sell:     reserved-1,  sold+1          (FixItem kept)
      # release:  reserved-1,  available+1     (FixItem released, RETURNED item received/restocked)
      # direct sell: available-1, sold+1       (Purchase place — sells immediately)
      # compensate purchase: sold-1, available+1  (Purchase cancel)
      # explicit restock: total_stock+q, available+q (invariant preserved)
    input_set: "FixItem and Purchase status transitions referencing this Product"
    precision: "integer units; counts never negative"

  - name: styling_fee_ledger
    trigger: "Fix SHIPPED->DELIVERED->CHECKED_OUT"
    algorithm: aggregation
    formula: |
      # Styling fee is charged once at ship (styling_fee_charged_cents = 2000) and then
      # fully accounted at checkout. Conserved invariant per fix once CHECKED_OUT:
      #   styling_fee_charged_cents == styling_fee_credit_cents + styling_fee_forfeited_cents
      if kept_count >= 1:
        styling_fee_credit_cents    = styling_fee_charged_cents   # credited toward purchase
        styling_fee_forfeited_cents = 0
      else:
        styling_fee_credit_cents    = 0
        styling_fee_forfeited_cents = styling_fee_charged_cents   # forfeited when nothing kept
    input_set: "The single Fix"
    precision: "cents, integer"

  - name: next_ship_date
    trigger: "POST /clients/{id}/fixes (schedule), POST /clients/{id}/resume, POST /clients/{id}/skip"
    algorithm: aggregation
    formula: |
      interval_days = CADENCE_DAYS[client.cadence]
      schedule/resume: scheduled_ship_date = current_clock + interval_days
      skip:            scheduled_ship_date = existing_scheduled_ship_date + interval_days (push one cadence)
    input_set: "Owning Client.cadence and current clock"
    constants:
      CADENCE_DAYS: { EVERY_2_WEEKS: 14, MONTHLY: 30, EVERY_2_MONTHS: 60, QUARTERLY: 90 }
    precision: "whole-day datetime arithmetic in UTC"

  - name: stylist_capacity
    trigger: "Recomputed on assign, ship-related fix state changes, and fix cancellation"
    algorithm: aggregation
    formula: |
      active_fix_count = count(Fix where stylist_id == this stylist AND status in {STYLING, PREVIEW, SHIPPED, DELIVERED})
      # assign is rejected (ERR_STYLIST_AT_CAPACITY) when active_fix_count >= max_concurrent_fixes
    input_set: "All fixes assigned to the stylist"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognizable"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /clients (Anonymous)"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in range, kept_item_ids is an array"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Every path/body-referenced resource exists (validated left-to-right in path)"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_FIX_NOT_FOUND | ERR_FIXITEM_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_STYLIST_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_PURCHASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path params or entity-ref body fields"

  - priority: 5
    category: auth
    check: "Entity-backed actor owns the target resource (Client owns Client/Fix/Hold/Purchase; Stylist owns assigned Fix)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_client_version matches current Client.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clients/{id}/fixes"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: "ERR_FIX_NOT_STYLING | ERR_FIX_NOT_PREVIEW | ERR_FIX_NOT_SHIPPED | ERR_FIX_NOT_DELIVERED | ERR_FIX_TERMINAL | ERR_CLIENT_NOT_ACTIVE | ERR_CLIENT_CANCELLED | ERR_STYLEPROFILE_EXISTS | ERR_NO_PENDING_FIX | ERR_RETURN_NOT_RECEIVABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_referential
    check: "Referenced sibling entity is in an acceptable status (Product ACTIVE, Stylist ACTIVE)"
    error_id: "ERR_PRODUCT_UNAVAILABLE | ERR_STYLIST_INACTIVE"
    http_status: 409
    applies_to: "POST /fixes/{id}/items, POST /fixes/{id}/assign, POST /clients/{id}/purchases"

  - priority: 9
    category: business_temporal
    check: "Temporal windows respected: checkout within deadline; hold windows non-overlapping"
    error_id: "ERR_CHECKOUT_WINDOW_CLOSED | ERR_HOLD_OVERLAP"
    http_status: 409
    applies_to: "POST /fixes/{id}/checkout, POST /clients/{id}/holds"

  - priority: 10
    category: business_constraint
    check: "Structural constraints: fix item_count limits, kept_item_ids membership, hold date range end>start"
    error_id: "ERR_FIX_ITEM_LIMIT | ERR_FIX_TOO_FEW_ITEMS | ERR_KEEP_ITEM_INVALID | ERR_INVALID_DATE_RANGE"
    http_status: 422
    applies_to: "POST /fixes/{id}/items, POST /fixes/{id}/submit-preview, POST /fixes/{id}/ship, POST /fixes/{id}/checkout, POST /clients/{id}/holds"

  - priority: 11
    category: business_fiscal
    check: "Capacity/quota/stock: product available_count sufficient; stylist not at concurrent capacity"
    error_id: "ERR_OUT_OF_STOCK | ERR_STYLIST_AT_CAPACITY"
    http_status: 409
    applies_to: "POST /fixes/{id}/items, POST /fixes/{id}/assign, POST /clients/{id}/purchases"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Client subscription -----
  - method: POST
    path: "/clients"
    description: "Register a new subscriber (public)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, region_code, "cadence?"]
    output: Client
    side_effects: ["status = PROSPECT; cadence defaults to MONTHLY when omitted"]

  - method: GET
    path: "/clients/{id}"
    description: "Fetch a client."
    roles: [Client, OpsAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/style-profile"
    description: "Complete the style-profile quiz; activates the subscription."
    roles: [Client]
    code: 201
    input: [quiz_top_size, quiz_bottom_size, quiz_shoe_size, price_tier, "style_tags?"]
    output: StyleProfile
    side_effects: ["Create StyleProfile with learned_*=quiz_*, fit_confidence=0; Client PROSPECT -> ACTIVE"]

  - method: GET
    path: "/clients/{id}/style-profile"
    description: "Reverse lookup: the client's style profile (array of 0..1)."
    roles: [Client, Stylist, OpsAdmin]
    code: 200
    input: []
    output: StyleProfile[]
    side_effects: []

  - method: POST
    path: "/clients/{id}/pause"
    description: "Pause the subscription."
    roles: [Client]
    code: 200
    input: []
    output: Client
    side_effects: ["ACTIVE -> PAUSED; cancel REQUESTED fixes (cascade release + restock)"]

  - method: POST
    path: "/clients/{id}/resume"
    description: "Resume a paused subscription."
    roles: [Client]
    code: 200
    input: []
    output: Client
    side_effects: ["PAUSED -> ACTIVE"]

  - method: POST
    path: "/clients/{id}/cancel"
    description: "Cancel the subscription permanently."
    roles: [Client]
    code: 200
    input: []
    output: Client
    side_effects: ["-> CANCELLED; cascade-cancel {REQUESTED,STYLING,PREVIEW} fixes; blocked if any SHIPPED/DELIVERED fix"]

  - method: POST
    path: "/clients/{id}/skip"
    description: "Skip the next box: push the pending REQUESTED fix out one cadence."
    roles: [Client]
    code: 200
    input: []
    output: Fix
    side_effects: ["Requires Client ACTIVE and exactly one REQUESTED fix; scheduled_ship_date += one cadence (next_ship_date skip mode)"]

  # ----- Fix lifecycle -----
  - method: POST
    path: "/clients/{id}/fixes"
    description: "Schedule the next fix (OCC create-with-supersede)."
    roles: [Client]
    code: 201
    input: [expected_client_version]
    output: Fix
    side_effects:
      - "Create Fix REQUESTED; scheduled_ship_date = clock + cadence (next_ship_date)"
      - "Any prior REQUESTED fix of this client -> CANCELLED (supersede cascade: release+restock its items)"
      - "increments Client.version by 1"
    note: "Requires Client.status == ACTIVE"

  - method: GET
    path: "/clients/{id}/fixes"
    description: "Reverse lookup: fixes for a client."
    roles: [Client, OpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Fix[]
    side_effects: []

  - method: GET
    path: "/fixes/{id}"
    description: "Fetch a fix."
    roles: [Client, Stylist, OpsAdmin]
    code: 200
    input: []
    output: Fix
    side_effects: []

  - method: GET
    path: "/fixes"
    description: "List/filter fixes (reverse lookup by stylist_id or client_id)."
    roles: [Stylist, OpsAdmin]
    code: 200
    input: ["stylist_id?", "client_id?", "status?", "limit?", "offset?"]
    output: Fix[]
    side_effects: []

  - method: POST
    path: "/fixes/{id}/assign"
    description: "Assign a stylist and start styling."
    roles: [OpsAdmin]
    code: 200
    input: [stylist_id]
    output: Fix
    side_effects: ["REQUESTED -> STYLING; set stylist_id; recompute Stylist.active_fix_count"]

  - method: POST
    path: "/fixes/{id}/items"
    description: "Stylist selects a catalog product into the fix."
    roles: [Stylist]
    code: 201
    input: [product_id]
    output: FixItem
    side_effects: ["Create FixItem SELECTED; snapshot price_cents/size/category; reserve inventory (available-1, reserved+1)"]

  - method: GET
    path: "/fixes/{id}/items"
    description: "Reverse lookup: items in a fix."
    roles: [Client, Stylist, OpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FixItem[]
    side_effects: []

  - method: POST
    path: "/fixes/{id}/items/{item_id}/remove"
    description: "Stylist removes a selected item (releases the reservation)."
    roles: [Stylist]
    code: 200
    input: []
    output: FixItem
    side_effects: ["SELECTED -> RELEASED; restock inventory (reserved-1, available+1); Fix must be STYLING or PREVIEW"]

  - method: POST
    path: "/fixes/{id}/submit-preview"
    description: "Stylist submits the curated fix for client preview."
    roles: [Stylist]
    code: 200
    input: []
    output: Fix
    side_effects: ["STYLING -> PREVIEW; requires item_count in [MIN_ITEMS, MAX_ITEMS]"]

  - method: POST
    path: "/fixes/{id}/request-changes"
    description: "Client sends the preview back for restyling (revision loop)."
    roles: [Client]
    code: 200
    input: []
    output: Fix
    side_effects: ["PREVIEW -> STYLING"]

  - method: POST
    path: "/fixes/{id}/ship"
    description: "Ship the fix; charges the styling fee."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Fix
    side_effects: ["PREVIEW -> SHIPPED; styling_fee_charged_cents=2000; shipped_at=clock"]

  - method: POST
    path: "/fixes/{id}/mark-delivered"
    description: "Mark the box delivered; opens the try-at-home window."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Fix
    side_effects: ["SHIPPED -> DELIVERED; delivered_at=clock; checkout_deadline=clock+3d; compute estimated_charge_cents (provisional)"]

  - method: POST
    path: "/fixes/{id}/checkout"
    description: "Client checks out: keep a subset, return the rest, leave fit feedback."
    roles: [Client]
    code: 200
    input: [kept_item_ids, "item_feedback?"]
    output: Fix
    side_effects:
      - "DELIVERED -> CHECKED_OUT; kept items -> KEPT (sell), others -> RETURNED"
      - "Compute charge_cents (final), buy_the_look_applied, shipping_fee_cents, tax_cents, styling_fee credit/forfeit"
      - "item_feedback -> FeedbackEntry rows -> recompute StyleProfile learned_sizing + fit_confidence + feedback_count"
      - "returned_count==0 -> CLOSED; else create ReturnShipment (LABEL_ISSUED)"

  - method: GET
    path: "/fixes/{id}/returns"
    description: "Reverse lookup: return shipments for a fix."
    roles: [Client, OpsAdmin]
    code: 200
    input: []
    output: ReturnShipment[]
    side_effects: []

  - method: POST
    path: "/fixes/{id}/returns/{return_id}/ship"
    description: "Client marks the return label handed to the carrier."
    roles: [Client]
    code: 200
    input: []
    output: ReturnShipment
    side_effects: ["LABEL_ISSUED -> IN_TRANSIT"]

  - method: POST
    path: "/fixes/{id}/returns/{return_id}/receive"
    description: "Warehouse receives the return; restocks items and closes the fix."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: ReturnShipment
    side_effects: ["-> RECEIVED; restock RETURNED items (reserved-1, available+1); parent Fix -> CLOSED"]

  # ----- Holds (vacation) -----
  - method: POST
    path: "/clients/{id}/holds"
    description: "Create a vacation hold window."
    roles: [Client]
    code: 201
    input: [start_date, end_date]
    output: Hold
    side_effects: ["Rejected if [start,end) overlaps an existing hold; requires end_date > start_date"]

  - method: GET
    path: "/clients/{id}/holds"
    description: "Reverse lookup: holds for a client."
    roles: [Client, OpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Hold[]
    side_effects: []

  # ----- Feedback -----
  - method: GET
    path: "/feedback/{feedback_id}"
    description: "Fetch a single feedback entry."
    roles: [Client, Stylist, OpsAdmin]
    code: 200
    input: []
    output: FeedbackEntry
    side_effects: []

  - method: GET
    path: "/feedback"
    description: "List/filter feedback (reverse lookup by client_id or fix_item_id)."
    roles: [Client, Stylist, OpsAdmin]
    code: 200
    input: ["client_id?", "fix_item_id?", "limit?", "offset?"]
    output: FeedbackEntry[]
    side_effects: []

  # ----- Catalog / inventory (OpsAdmin) -----
  - method: POST
    path: "/products"
    description: "Create a catalog product."
    roles: [OpsAdmin]
    code: 201
    input: [sku, name, category, size, price_cents, total_stock, "style_tags?"]
    output: Product
    side_effects: ["status=ACTIVE; available_count=total_stock; reserved_count=0; sold_count=0"]

  - method: GET
    path: "/products/{id}"
    description: "Fetch a product."
    roles: [Client, Stylist, OpsAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/products/{id}/discontinue"
    description: "Discontinue a product (blocks new selections/purchases)."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Product
    side_effects: ["status -> DISCONTINUED"]

  - method: POST
    path: "/products/{id}/restock"
    description: "Add units to a product's stock."
    roles: [OpsAdmin]
    code: 200
    input: [add_quantity]
    output: Product
    side_effects: ["total_stock += add_quantity; available_count += add_quantity (invariant preserved)"]

  - method: GET
    path: "/products/{id}/fix-items"
    description: "Reverse lookup: fix items that selected this product."
    roles: [OpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FixItem[]
    side_effects: []

  - method: GET
    path: "/products/{id}/purchases"
    description: "Reverse lookup: direct purchases of this product."
    roles: [OpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Purchase[]
    side_effects: []

  # ----- Stylists (OpsAdmin) -----
  - method: POST
    path: "/stylists"
    description: "Create a stylist."
    roles: [OpsAdmin]
    code: 201
    input: [email, name, "max_concurrent_fixes?"]
    output: Stylist
    side_effects: ["status=ACTIVE; active_fix_count=0"]

  - method: POST
    path: "/stylists/{id}/deactivate"
    description: "Deactivate a stylist (blocks new assignments)."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Stylist
    side_effects: ["status -> INACTIVE"]

  # ----- Direct-buy purchases -----
  - method: POST
    path: "/clients/{id}/purchases"
    description: "Direct-buy a catalog product outside a fix."
    roles: [Client]
    code: 201
    input: [product_id, quantity]
    output: Purchase
    side_effects: ["status=PLACED; snapshot unit_price_cents; sell inventory (available-quantity, sold+quantity); requires Client not CANCELLED, Product ACTIVE, available_count>=quantity"]

  - method: GET
    path: "/clients/{id}/purchases"
    description: "Reverse lookup: purchases by a client."
    roles: [Client, OpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Purchase[]
    side_effects: []

  - method: POST
    path: "/purchases/{id}/cancel"
    description: "Cancel a direct purchase (compensating restock)."
    roles: [Client]
    code: 200
    input: []
    output: Purchase
    side_effects: ["PLACED -> CANCELLED; restock inventory (sold-quantity, available+quantity)"]

  # ----- System / test-driving -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock)."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  - method: POST
    path: "/_ops/run-checkout-sweep"
    description: "Auto-checkout every DELIVERED fix past its deadline as keep-all, then close."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["For each DELIVERED fix with clock > checkout_deadline: keep-all checkout, compute charge, CLOSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed actor is not the owner of the target resource" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range integer, wrong type" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_FIX_NOT_FOUND, http: 404, condition: "Fix id does not exist or not under the given client" }
  - { id: ERR_FIXITEM_NOT_FOUND, http: 404, condition: "FixItem id does not exist under the given fix" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_STYLIST_NOT_FOUND, http: 404, condition: "Stylist id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "ReturnShipment id does not exist under the given fix" }
  - { id: ERR_PURCHASE_NOT_FOUND, http: 404, condition: "Purchase id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_client_version does not match current Client.version (OCC)" }
  - { id: ERR_STYLEPROFILE_EXISTS, http: 409, condition: "Client already completed the style-profile quiz" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Operation requires Client.status == ACTIVE" }
  - { id: ERR_CLIENT_CANCELLED, http: 409, condition: "Operation not allowed on a CANCELLED client" }
  - { id: ERR_CLIENT_HAS_INFLIGHT_FIX, http: 409, condition: "Cancel blocked: client has a Fix in SHIPPED or DELIVERED" }
  - { id: ERR_NO_PENDING_FIX, http: 409, condition: "Skip requires exactly one REQUESTED fix" }
  - { id: ERR_FIX_NOT_STYLING, http: 409, condition: "Fix is not in STYLING (required for item add/remove/submit-preview)" }
  - { id: ERR_FIX_NOT_PREVIEW, http: 409, condition: "Fix is not in PREVIEW (required for ship/request-changes)" }
  - { id: ERR_FIX_NOT_SHIPPED, http: 409, condition: "Fix is not in SHIPPED (required for mark-delivered)" }
  - { id: ERR_FIX_NOT_DELIVERED, http: 409, condition: "Fix is not in DELIVERED (required for checkout)" }
  - { id: ERR_FIX_TERMINAL, http: 409, condition: "Fix is CLOSED or CANCELLED; no further transitions" }
  - { id: ERR_RETURN_NOT_RECEIVABLE, http: 409, condition: "ReturnShipment already RECEIVED" }
  - { id: ERR_PRODUCT_UNAVAILABLE, http: 409, condition: "Referenced Product is DISCONTINUED" }
  - { id: ERR_STYLIST_INACTIVE, http: 409, condition: "Referenced Stylist is INACTIVE" }
  - { id: ERR_CHECKOUT_WINDOW_CLOSED, http: 409, condition: "Checkout attempted after checkout_deadline" }
  - { id: ERR_HOLD_OVERLAP, http: 409, condition: "New hold window overlaps an existing hold for the client" }
  - { id: ERR_FIX_ITEM_LIMIT, http: 422, condition: "Adding an item would exceed MAX_ITEMS (5)" }
  - { id: ERR_FIX_TOO_FEW_ITEMS, http: 422, condition: "submit-preview/ship with item_count < MIN_ITEMS (3)" }
  - { id: ERR_KEEP_ITEM_INVALID, http: 422, condition: "A kept_item_id is not a SELECTED FixItem of this fix" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "Hold end_date <= start_date" }
  - { id: ERR_OUT_OF_STOCK, http: 409, condition: "Product available_count insufficient for the reservation/purchase" }
  - { id: ERR_STYLIST_AT_CAPACITY, http: 409, condition: "Stylist active_fix_count >= max_concurrent_fixes" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a client."
    identity: opaque
    exclusive_operations:
      - "POST /clients (register)"
    shared_operations: []

  - name: Client
    description: "A subscriber acting on their own subscription, fixes, holds, purchases, and returns."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /clients/{id}/style-profile"
      - "POST /clients/{id}/pause"
      - "POST /clients/{id}/resume"
      - "POST /clients/{id}/cancel"
      - "POST /clients/{id}/skip"
      - "POST /clients/{id}/fixes"
      - "POST /fixes/{id}/request-changes"
      - "POST /fixes/{id}/checkout"
      - "POST /fixes/{id}/returns/{return_id}/ship"
      - "POST /clients/{id}/holds"
      - "POST /clients/{id}/purchases"
      - "POST /purchases/{id}/cancel"
    shared_operations:
      - "GET /clients/{id}, GET /clients/{id}/style-profile, GET /clients/{id}/fixes, GET /clients/{id}/holds, GET /clients/{id}/purchases"
      - "GET /fixes/{id}, GET /fixes/{id}/items, GET /fixes/{id}/returns"
      - "GET /products/{id}, GET /feedback, GET /feedback/{feedback_id}"

  - name: Stylist
    description: "A stylist curating fixes assigned to them."
    identity: "entity_backed:Stylist"
    exclusive_operations:
      - "POST /fixes/{id}/items"
      - "POST /fixes/{id}/items/{item_id}/remove"
      - "POST /fixes/{id}/submit-preview"
    shared_operations:
      - "GET /fixes, GET /fixes/{id}, GET /fixes/{id}/items"
      - "GET /clients/{id}/style-profile, GET /products/{id}, GET /feedback, GET /feedback/{feedback_id}"

  - name: OpsAdmin
    description: "Operational staff: catalog, inventory, stylists, fulfillment, and system operations."
    identity: opaque
    exclusive_operations:
      - "POST /fixes/{id}/assign"
      - "POST /fixes/{id}/ship"
      - "POST /fixes/{id}/mark-delivered"
      - "POST /fixes/{id}/returns/{return_id}/receive"
      - "POST /products, POST /products/{id}/discontinue, POST /products/{id}/restock"
      - "POST /stylists"
      - "POST /_clock/set_current_utc, POST /_ops/run-checkout-sweep"
    shared_operations:
      - "GET on all resources (clients, fixes, items, products, feedback, returns, holds, purchases)"
