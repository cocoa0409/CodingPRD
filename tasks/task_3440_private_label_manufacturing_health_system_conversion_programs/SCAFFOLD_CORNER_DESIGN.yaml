# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk of the claim-extraction guide against this scaffold's
# §1.1-§1.7 surface. excluded_because stubs cite §1.8 instances by name.
# Logical clock default: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: product_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Product.fields.availability, entities.Product.fields.order_multiple, entities.Product.fields.registration_status]
        distinguishing_aspect: "Omitting optional fields applies defaults (availability ACTIVE, order_multiple 1, lum_eligible false) and system-initializes registration_status UNREGISTERED with version 1."
        test_recipe:
          setup: ["Nothing but the ability to create a product"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/products"
              payload: { sku: "DF-1", name: "Plain gauze", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { p_id: $.data.id }
          assert:
            - "HTTP 201; Product.${p_id}.availability == ACTIVE, order_multiple == 1, lum_eligible == false"
            - "Product.${p_id}.registration_status == UNREGISTERED and version == 1"
      - name: product_create_missing_required_sku_returns_400
        claim_type: required_fields
        grounds: [entities.Product.fields.sku, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "sku is source:input with no default; omitting it yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["None"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/products"
              payload: { name: "No sku", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
      - name: product_create_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds: [entities.Product.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category is a closed enum; PHARMA is not a member and is rejected."
        test_recipe:
          setup: ["None"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/products"
              payload: { sku: "DF-2", name: "Bad cat", brand_type: "BRANDED", category: "PHARMA", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
      - name: lot_create_branded_product_rejected
        claim_type: parent_relationships
        grounds: ["validations[priority=6]", "errors[ERR_NOT_PRIVATE_LABEL]"]
        distinguishing_aspect: "Manufacturing lots exist only for PRIVATE_LABEL products; a BRANDED parent product fails the safety rule."
        test_recipe:
          setup: ["BRANDED product BP exists"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "BP-1", name: "Branded pad", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { bp_id: $.data.id }
          trigger:
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-B1", product_id: "${bp_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_NOT_PRIVATE_LABEL"
      - name: lot_create_unregistered_product_rejected
        claim_type: parent_relationships
        grounds: ["validations[priority=6.1]", "errors[ERR_PRODUCT_NOT_REGISTERED]"]
        distinguishing_aspect: "A PRIVATE_LABEL product whose registration_status is still UNREGISTERED cannot receive a manufacturing lot."
        test_recipe:
          setup: ["PRIVATE_LABEL product UP exists, never submitted for registration"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "UP-1", name: "Unregistered pad", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { up_id: $.data.id }
          trigger:
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-U1", product_id: "${up_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_PRODUCT_NOT_REGISTERED"
      - name: lot_nonsterile_product_marks_sterility_not_required
        claim_type: computed_fields
        grounds: [entities.ManufacturingLot.fields.sterility_status]
        distinguishing_aspect: "sterility_status is computed at creation: NOT_REQUIRED for a non-sterile product (no batch ever needed)."
        test_recipe:
          setup: ["REGISTERED PRIVATE_LABEL non-sterile product NP"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "NP-1", name: "Nonsterile wrap", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { np_id: $.data.id }
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
          trigger:
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-N1", product_id: "${np_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              captures: { lot_id: $.data.id, ster: $.data.sterility_status }
          assert:
            - "ManufacturingLot.${lot_id}.sterility_status == NOT_REQUIRED and status == AWAITING_QA"
      - name: lot_create_reversed_dates_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=7.3]", "errors[ERR_LOT_DATES_INVALID]"]
        distinguishing_aspect: "expiry_date must be strictly after manufacture_date; equal dates fail."
        test_recipe:
          setup: ["REGISTERED PRIVATE_LABEL non-sterile product NP"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "NP-2", name: "Nonsterile wrap 2", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { np_id: $.data.id }
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
          trigger:
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-D1", product_id: "${np_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2026-08-01" }
              as: ManufacturingPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_LOT_DATES_INVALID"
      - name: claim_create_computes_provisional_only
        claim_type: computed_fields
        grounds: [entities.RebateClaim.fields.provisional_amount_cents, entities.RebateClaim.fields.final_amount_cents]
        distinguishing_aspect: "Creation computes provisional_amount_cents (2500 on 250000 at tier 0.01) and leaves final_amount_cents null until SUBMIT."
        test_recipe:
          setup: ["Facility F"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac CL", health_system_name: "HS CL", facility_type: "CLINIC", ship_to_address: "18 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-01-01", period_end: "2026-03-31", eligible_purchase_cents: 250000, private_label_share: 0.10, compliant: true }
              as: GPOAnalyst
              captures: { cl_id: $.data.id }
          assert:
            - "RebateClaim.${cl_id}.provisional_amount_cents == 2500 (250000 x 0.01)"
            - "RebateClaim.${cl_id}.final_amount_cents is null and status == ACCRUED"
      - name: disruption_create_initializes_partition
        claim_type: creation
        grounds: [entities.SupplyDisruption.fields.remaining_pool, entities.SupplyDisruption.fields.covered_quantity]
        distinguishing_aspect: "Creation pins the partition: allocated_total 0, approved_sub_total 0, remaining_pool == disrupted_quantity, status DECLARED."
        test_recipe:
          setup: ["Product DP (any availability)"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "DP-9", name: "Disrupted item", brand_type: "BRANDED", category: "EXAM_GLOVES", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 20 }
              as: SupplyChainAdmin
              captures: { dp_id: $.data.id }
          trigger:
            - call: "POST /supply/supply-disruptions"
              payload: { product_id: "${dp_id}", disrupted_quantity: 75, reason: "DEMAND_SURGE", severity: "MEDIUM", expected_resolution_date: "2026-12-15" }
              as: SupplyChainAdmin
              captures: { dis_id: $.data.id }
          assert:
            - "SupplyDisruption.${dis_id}: status == DECLARED, allocated_total == 0, approved_sub_total == 0, remaining_pool == 75, covered_quantity == 0, version == 1"
      - name: inventory_program_create_par_violation_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8.5]", "errors[ERR_PAR_LEVEL_VIOLATION]"]
        distinguishing_aspect: "A position with reorder_point > par_level is rejected at creation."
        test_recipe:
          setup: ["Facility F; product IP1"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac PV", health_system_name: "HS PV", facility_type: "CLINIC", ship_to_address: "19 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "IP-1", name: "Inv item", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { ip_id: $.data.id }
          trigger:
            - call: "POST /supply/inventory-programs"
              payload: { facility_id: "${fac_id}", program_type: "CRASH_CART", positions: [ { product_id: "${ip_id}", par_level: 10, reorder_point: 20, on_hand: 5 } ] }
              as: SupplyChainAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_PAR_LEVEL_VIOLATION"
      - name: facility_create_success_returns_201
        claim_type: creation
        grounds: [entities.Facility]
        distinguishing_aspect: "Facility creation echoes all input fields and assigns system id/created_at/version."
        test_recipe:
          setup: ["None"]
          setup_api_calls: []
          trigger:
            - call: "POST /supply/facilities"
              payload: { name: "Fac OK", health_system_name: "HS OK", facility_type: "ACUTE_CARE", ship_to_address: "20 Vine St" }
              as: SupplyChainAdmin
              captures: { f_id: $.data.id }
          assert:
            - "HTTP 201; Facility.${f_id}.name == 'Fac OK', facility_type == ACUTE_CARE, version == 1, id is a server-minted UUID"

  - section: state_machines
    instances:
      - name: registration_approve_from_unregistered_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Product.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVE is only declared from SUBMITTED; against UNREGISTERED it must fail with ERR_INVALID_STATE and registration_status must not move."
        test_recipe:
          setup: ["Product P freshly created (UNREGISTERED)"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "RG-1", name: "Reg item", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /supply/products/${p_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "Product.${p_id}.registration_status remains UNREGISTERED (re-read via repeat APPROVE attempt error semantics or list-free: subsequent SUBMIT succeeds, proving state did not move)"
      - name: registration_resubmit_after_reject_cycles
        claim_type: valid_transition
        grounds: ["state_machines.Product.REJECTED_to_SUBMITTED"]
        distinguishing_aspect: "The registration cycle loops: SUBMIT -> REJECT -> SUBMIT -> APPROVE ends REGISTERED, proving REJECTED is not terminal."
        test_recipe:
          setup: ["Product P freshly created (UNREGISTERED)"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "RG-2", name: "Reg item 2", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { p_id: $.data.id }
            - call: "POST /supply/products/${p_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${p_id}/registration-events"
              payload: { event: "REJECT" }
              as: RegulatorySpecialist
              captures: { st_rej: $.data.registration_status }
          trigger:
            - call: "POST /supply/products/${p_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
              captures: { st_sub: $.data.registration_status }
            - call: "POST /supply/products/${p_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
              captures: { st_fin: $.data.registration_status }
          assert:
            - "After REJECT: registration_status == REJECTED"
            - "Resubmission: REJECTED -> SUBMITTED succeeds (200)"
            - "Final: registration_status == REGISTERED"
      - name: lot_disposition_from_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ManufacturingLot.AWAITING_QA_to_RELEASED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RELEASED is terminal: a subsequent REJECT attempt fails and the disposition fields stay pinned to the first decision."
        test_recipe:
          setup: ["REGISTERED PRIVATE_LABEL non-sterile product NP; lot L released by qm-1 (created by planner-1)"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "TL-1", name: "Terminal lot item", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { np_id: $.data.id }
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${np_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-T1", product_id: "${np_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              as_user_id: "planner-1"
              captures: { lot_id: $.data.id }
            - call: "POST /supply/manufacturing-lots/${lot_id}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QualityManager
              as_user_id: "qm-1"
          trigger:
            - call: "POST /supply/manufacturing-lots/${lot_id}/qa-disposition"
              payload: { disposition: "REJECT" }
              as: QualityManager
              as_user_id: "qm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "ManufacturingLot.${lot_id}.status remains RELEASED with qa_disposition_by == 'qm-1'"
      - name: sterility_result_recording_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.SterilizationBatch.SCHEDULED_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "record-sterility-result is one-shot: COMPLETED is terminal, a second recording fails."
        test_recipe:
          setup: ["REGISTERED PRIVATE_LABEL sterile product SP with lot L; batch B containing L"]
          setup_api_calls:
            - call: "POST /supply/products"
              payload: { sku: "TS-1", name: "Sterile item", brand_type: "PRIVATE_LABEL", category: "STERILIZATION_SUPPLIES", sterile: true, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-TS1", product_id: "${sp_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /supply/sterilization-batches"
              payload: { batch_code: "B-TS-1", chamber_id: "CH-2", scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", lot_ids: ["${lot_id}"] }
              as: ManufacturingPlanner
              captures: { b_id: $.data.id }
            - call: "POST /supply/sterilization-batches/${b_id}/record-sterility-result"
              payload: { result: "PASSED" }
              as: QualityManager
          trigger:
            - call: "POST /supply/sterilization-batches/${b_id}/record-sterility-result"
              payload: { result: "FAILED" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "Batch ${b_id}.sterility_result remains PASSED (second write did not land)"
      - name: program_auto_advances_to_in_review
        claim_type: side_effect_execution
        grounds: ["state_machines.ConversionProgram.IN_EVALUATION_to_IN_REVIEW"]
        distinguishing_aspect: "Bubble-up auto-transition: the evaluation that leaves zero PENDING line items flips the program to IN_REVIEW inside the same response."
        test_recipe:
          setup: ["Facility F; products INC, REP; program with 2 line items, both PENDING"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac AA", health_system_name: "HS AA", facility_type: "ACUTE_CARE", ship_to_address: "21 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "AA-I", name: "Incumbent", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { inc_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "AA-R", name: "Replacement", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 9 }
              as: SupplyChainAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /supply/conversion-programs"
              payload: { facility_id: "${fac_id}", name: "Switch", target_categories: ["WOUND_CARE"], line_items: [ { incumbent_product_id: "${inc_id}", replacement_product_id: "${rep_id}" }, { incumbent_product_id: "${rep_id}", replacement_product_id: "${inc_id}" } ] }
              as: ConversionManager
              captures: { prog_id: $.data.id, ln1: "$.data.line_items[0].line_id", ln2: "$.data.line_items[1].line_id" }
            - call: "POST /supply/conversion-programs/${prog_id}/line-item-evaluations"
              payload: { line_id: "${ln1}", outcome: "PASSED", training_completed: true }
              as: Clinician
              as_user_id: "clin-1"
              captures: { st_mid: $.data.status }
          trigger:
            - call: "POST /supply/conversion-programs/${prog_id}/line-item-evaluations"
              payload: { line_id: "${ln2}", outcome: "FAILED", training_completed: false, notes: "clinician preferred incumbent" }
              as: Clinician
              as_user_id: "clin-2"
              captures: { st_fin: $.data.status }
          assert:
            - "After first evaluation (one PENDING remains): status == IN_EVALUATION"
            - "After second evaluation (zero PENDING): status == IN_REVIEW in the same response"
      - name: program_review_decision_from_in_evaluation_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ConversionProgram.IN_REVIEW_to_CONVERTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "review-decision is only legal from IN_REVIEW; with PENDING items the program is IN_EVALUATION and the call fails."
        test_recipe:
          setup: ["Facility F; program with 1 PENDING line item"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac AB", health_system_name: "HS AB", facility_type: "CLINIC", ship_to_address: "22 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "AB-I", name: "Incumbent", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { inc_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "AB-R", name: "Replacement", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 9 }
              as: SupplyChainAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /supply/conversion-programs"
              payload: { facility_id: "${fac_id}", name: "Switch", target_categories: ["WOUND_CARE"], line_items: [ { incumbent_product_id: "${inc_id}", replacement_product_id: "${rep_id}" } ] }
              as: ConversionManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /supply/conversion-programs/${prog_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: ConversionManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "ConversionProgram.${prog_id}.status remains IN_EVALUATION"
      - name: line_item_failed_reevaluation_loop
        claim_type: valid_transition
        grounds: ["state_machines.ConversionProgram.IN_REVIEW_to_IN_EVALUATION", "endpoints.\"POST /supply/conversion-programs/{id}/line-item-evaluations\""]
        distinguishing_aspect: "REDESIGN loops the program back to IN_EVALUATION where a FAILED line item can be re-evaluated to PASSED, auto-advancing to IN_REVIEW a second time."
        test_recipe:
          setup: ["Facility F; program with 1 line item evaluated FAILED (auto-advanced to IN_REVIEW); REDESIGN returns it to IN_EVALUATION"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac AC", health_system_name: "HS AC", facility_type: "CLINIC", ship_to_address: "23 Vine St" }
              as: SupplyChainAdmin
