          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_1: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_2}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_2: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_3}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_3: $.data.id
      - call: POST /api/infection-cases
        payload:
