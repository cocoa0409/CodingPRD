              captures: { ee: $.data.expired_exceptions }
          assert:
            - "HTTP 200"
            - "${oec1} == 1"
            - "${ee} == 1"
            - "PricingException.${exc}.status == EXPIRED"
            - "Product.${prod}.open_exception_count == 0"
            - "GET /products/${prod}/effective-floor?channel=MARKETPLACE returns effective_map_floor_cents 15000 and floor_source STANDARD"

  # ===========================================================================
  # SECTION 9 — consistency_model  (complexity_profile.consistency_model = immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: consistency_evaluate_returns_every_derived_field_immediately
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints.POST /price-observations/{observation_id}/evaluate"]
        distinguishing_aspect: "The evaluate response already carries the allocated price, effective advertised price, floor, floor_source, deviation, cited policy and violation id — a follow-up GET returns byte-identical values with no settling period."
        test_recipe:
          setup: ["A CAPTURED 14000 MARKETPLACE observation matched to AUTHORIZED reseller Acme under PUBLISHED policy MAP-2026-A."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
          trigger:
            - call: "POST /price-observations/${obs}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { es: $.data.evaluation_status, eap: $.data.effective_advertised_price_cents, fl: $.data.effective_map_floor_cents, dev: $.data.deviation_cents, pct: $.data.deviation_pct, v: $.data.violation_id }
          assert:
            - "HTTP 200"
            - "${es} == 'EVALUATED_BREACH'"
            - "${eap} == 14000"
            - "${fl} == 15000"
            - "${dev} == 1000"
            - "${pct} == 0.0667"
            - "GET /price-observations/${obs} immediately afterwards returns the same evaluation_status, effective_advertised_price_cents, effective_map_floor_cents, deviation_cents and deviation_pct"
            - "GET /violations/${v} immediately afterwards returns status DETECTED and provisional_points 3"

      - name: consistency_notice_issuance_exposes_the_new_ledger_in_the_same_request
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.reseller_points_ledger"]
        distinguishing_aspect: "The ladder snapshot in the notice response and the reseller's recomputed aggregate agree at the instant of the write: cumulative_points_at_issue is 3 and the compliance summary read straight after already reports 3 with next_rung SUSPENSION."
        test_recipe:
          setup: ["Violation V1 DETECTED at 3 points against AUTHORIZED reseller Acme with the ledger at 0."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "EMAIL", expected_reseller_version: "${rv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { n: $.data.id, cum: $.data.cumulative_points_at_issue, ap: $.data.assessed_points }
          assert:
            - "HTTP 201"
            - "${cum} == 3"
            - "${ap} == 3"
            - "GET /resellers/${res}/compliance-summary immediately afterwards returns violation_points_total 3, highest_issued_rung WARNING, next_rung SUSPENSION, points_to_suspension 3 and points_to_termination 9"
            - "EnforcementNotice.${n}.status == ISSUED"

      - name: consistency_cascade_effects_are_visible_without_a_re_read_delay
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.SerialUnit.transitions.SHIPPED_TO_RESELLER_to_RECALLED"]
        distinguishing_aspect: "Even four levels deep the cascade is synchronous: the serial unit read immediately after the TERMINATION notice already shows RECALLED, and the agreement already shows TERMINATED."
        test_recipe:
          setup: ["Acme is SUSPENDED at 14 points with SN-0002 in SHIPPED_TO_RESELLER and violation V3 DETECTED at 5 points."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *DISTNW
            - *SU0002
            - *SU0002SHIP
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
            - *OBS14000C
            - *OBSEVAL3
            - *GETRESV3
            - *NOTICE3TERM
          trigger:
            - call: "GET /serial-units/${su2}"
              payload: {}
              as: Distributor
              as_user_id: "${dist}"
              captures: { st: $.data.status, dr: $.data.downstream_reseller_id }
          assert:
            - "HTTP 200"
            - "${st} == 'RECALLED'"
            - "${dr} == ${res}"
            - "GET /reseller-agreements/${agr} returns status TERMINATED and closed_reason 'SUPPLY_TERMINATED'"
            - "GET /resellers/${res} returns authorization_status TERMINATED and supply_status CUT_OFF"
