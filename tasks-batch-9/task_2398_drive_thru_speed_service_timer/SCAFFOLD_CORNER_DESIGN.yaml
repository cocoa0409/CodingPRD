              payload: { to_iso8601: "2026-08-01T11:04:10Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops/${l1}/depart"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { t1: $.data.total_seconds, adj1: $.data.adjusted_total_seconds, acc1: $.data.accuracy_state }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:05:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rv1: $.data.version }
            - call: "POST /drive-thru/throughput-reports"
              payload: { restaurant_id: "${r_id}", window_start_at: "2026-08-01T11:00:00Z", window_end_at: "2026-08-01T11:05:00Z", variant: "PROVISIONAL", expected_restaurant_version: "${rv1}" }
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { rep_p: $.data.id, avg_p: $.data.avg_metric_seconds, att_p: $.data.attainment_pct, band_p: $.data.attainment_band, pts_p: $.data.coaching_pool_points, orc_p: $.data.open_remake_incident_count }
            - call: "POST /drive-thru/throughput-reports/${rep_p}/publish"
              payload: {}
              as: MarketCoach
              as_user_id: "coach-1"
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rv2: $.data.version }
            - call: "POST /drive-thru/throughput-reports"
              payload: { restaurant_id: "${r_id}", window_start_at: "2026-08-01T11:00:00Z", window_end_at: "2026-08-01T11:05:00Z", variant: "FINAL", expected_restaurant_version: "${rv2}", supersedes_report_id: "${rep_p}" }
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { rep_f: $.data.id, avg_f: $.data.avg_metric_seconds, att_f: $.data.attainment_pct, band_f: $.data.attainment_band, pts_f: $.data.coaching_pool_points }
          trigger:
            - call: "POST /drive-thru/throughput-reports/${rep_f}/publish"
              payload: {}
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { f_state: $.data.report_state }
          assert:
            - "Fixture: ${p1} == 235, ${inc_pen} == 45, ${inc_state} == CLOSED, ${inc_settle} == CHARGED, ${t1} == 250, ${adj1} == 295, ${acc1} == VERIFIED"
            - "PROVISIONAL side: ${avg_p} == 250.0, ${att_p} == 100.40, ${band_p} == GREEN, ${pts_p} == 6, ${orc_p} == 0 (a CLOSED incident is neither LOGGED nor REMADE)"
            - "FINAL side: ${avg_f} == 295.0 (250 + 45), ${att_f} == 85.08 (round_half_up(100 * 251 / 295.0, 2)), ${band_f} == RED, ${pts_f} == 0"
            - "Both reports share window_tier TIER_3, mean_pinned_target_seconds 235 and target_total_seconds_effective 251 — the ONLY reconciled delta is the metric basis"
            - "Delta on the switch: avg +45.0 seconds, attainment_pct -15.32, band GREEN -> RED, coaching_pool_points -6"
            - "${f_state} == PUBLISHED and ThroughputReport.${rep_p}.report_state == SUPERSEDED"
            - "Restaurant.${r_id}.open_remake_count == 0 and remake_cost_accrued_cents == 750 (settlement CHARGED still counts)"

      - name: calc_variant_divergence_same_rows_two_answers
        claim_type: variant_divergence
        grounds:
          - calculations.report_attainment_metrics.variants
          - calculations.oot_requirement.variants
        excluded_because:
          difficulty_instance: report_variant_divergence_provisional_vs_final
          rationale: "Both dual-variant calculations are asserted head-to-head on identical stored rows by report_variant_divergence_provisional_vs_final and oot_requirement_variant_divergence_on_staffing_basis in §1.8."

  # ===========================================================================
  - section: validations
    instances:

      - name: val_clock_regression_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_17_ERR_CLOCK_REGRESSION
          - errors[ERR_CLOCK_REGRESSION]
          - endpoints.POST_drive-thru__clock_set_current_utc
        distinguishing_aspect: "The logical clock is monotonic: a to_iso8601 earlier than the current clock is refused with ERR_CLOCK_REGRESSION (422) and the clock keeps its old value, while an equal value is accepted."
        test_recipe:
          setup:
            - "The logical clock has been advanced to 2026-08-01T11:00:00Z."
          setup_api_calls:
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { now1: $.data.current_utc }
          trigger:
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { now2: $.data.current_utc }
          assert:
            - "${now1} == 2026-08-01T11:00:00Z"
            - "Backwards set: HTTP 422 and ${err} == ERR_CLOCK_REGRESSION"
            - "${now2} == 2026-08-01T11:00:00Z — the rejected call left the clock untouched, and an EQUAL value is accepted because the check is to_iso8601 >= current"

      - name: val_daypart_end_minute_not_after_start_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_18_ERR_WINDOW_BOUNDS_INVALID
          - errors[ERR_WINDOW_BOUNDS_INVALID]
        distinguishing_aspect: "Interval bounds must be strictly ordered, so a profile with end_minute 660 below start_minute 840 is refused with ERR_WINDOW_BOUNDS_INVALID (422) rather than being silently swapped."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store with no profiles."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Bounds Store", store_number: "C-2398-32", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 840, end_minute: 660, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and ${err} == ERR_WINDOW_BOUNDS_INVALID"
            - "GET /drive-thru/daypart-profiles?restaurant_id=${r_id} returns total_count 0"

      - name: val_loop_created_outside_daypart_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_19_ERR_DAYPART_WINDOW_MISMATCH
          - errors[ERR_DAYPART_WINDOW_MISMATCH]
          - entities.DaypartProfile.fields.start_minute
        distinguishing_aspect: "The clock's minute-of-day at loop creation must sit inside the profile's half-open window, so a 10:30Z create against LUNCH [660, 840) fails with ERR_DAYPART_WINDOW_MISMATCH even though the profile is ACTIVE."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; one StaffMember; one ACTIVE LUNCH profile [660, 840); clock at 2026-08-01T10:30:00Z (minute-of-day 630)."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Mismatch Store", store_number: "C-2398-33", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Mis Halloran", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id, prof_state_draft: $.data.profile_state }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { prof_state: $.data.profile_state }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:30:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${prof_state_draft} == DRAFT and ${prof_state} == ACTIVE, so the priority-13 ERR_PROFILE_NOT_ACTIVE gate is satisfied"
            - "HTTP 422 and ${err} == ERR_DAYPART_WINDOW_MISMATCH"
            - "${err} != ERR_PROFILE_NOT_ACTIVE — the profile IS active; only the minute-of-day 630 < start_minute 660 is wrong"
            - "GET /drive-thru/timer-loops?restaurant_id=${r_id} returns total_count 0"

      - name: val_duplicate_store_number_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_24_ERR_DUPLICATE_STORE_NUMBER
          - errors[ERR_DUPLICATE_STORE_NUMBER]
          - entities.Restaurant.fields.store_number
        distinguishing_aspect: "store_number is globally unique, so a second registration reusing C-2398-34 is refused with ERR_DUPLICATE_STORE_NUMBER (409) even though every other field differs."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one store already registered with store_number C-2398-34."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Unique Store", store_number: "C-2398-34", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Unique Store Twin", store_number: "C-2398-34", lane_config: "DUAL_PARALLEL", merge_slots_capacity: 4, labor_minutes_budget: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and ${err} == ERR_DUPLICATE_STORE_NUMBER"
            - "The store that already owns C-2398-34 is untouched: GET /drive-thru/restaurants/${r_id} still returns lane_config SINGLE, merge_slots_capacity 1 and labor_minutes_budget 300 — the twin's DUAL_PARALLEL / 4 / 900 were not applied"

      - name: val_duplicate_tier_policy_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_24_ERR_DUPLICATE_TIER_POLICY
          - errors[ERR_DUPLICATE_TIER_POLICY]
          - entities.VolumeTierPolicy.fields.tier
        distinguishing_aspect: "VolumeTierPolicy.tier is globally unique, so a second TIER_1 band is refused with ERR_DUPLICATE_TIER_POLICY (409) even when its floor and ceiling do not overlap the first."
        test_recipe:
          setup:
            - "One VolumeTierPolicy band TIER_1 with floor 0 and ceiling 6."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 40, cars_per_hour_ceiling: 60, target_relief_pct: 0.10, min_oot_count: 2, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and ${err} == ERR_DUPLICATE_TIER_POLICY"
            - "GET /drive-thru/volume-tier-policies returns total_count 1 and its id == ${p1} with cars_per_hour_floor 0 (the duplicate did not overwrite the band)"

      - name: val_duplicate_daypart_for_store_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_24_ERR_DUPLICATE_DAYPART
          - errors[ERR_DUPLICATE_DAYPART]
        distinguishing_aspect: "(restaurant_id, daypart) is unique across DRAFT and ACTIVE profiles, so a second LUNCH profile is refused with ERR_DUPLICATE_DAYPART (409) while the first is still merely DRAFT."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store holding one DRAFT LUNCH profile."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Duplicate Daypart Store", store_number: "C-2398-35", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp1: $.data.id, dp1_state: $.data.profile_state }
          trigger:
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 700, end_minute: 800, greet_target_seconds: 20, order_target_seconds: 80, pull_forward_target_seconds: 30, window_target_seconds: 60 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${dp1_state} == DRAFT — the uniqueness set covers DRAFT as well as ACTIVE"
            - "HTTP 409 and ${err} == ERR_DUPLICATE_DAYPART"
            - "${err} != ERR_DAYPART_WINDOW_OVERLAP — the overlap rule at priority 21 only fires on activation of an ACTIVE sibling"
            - "GET /drive-thru/daypart-profiles?restaurant_id=${r_id} returns total_count 1 and its id == ${dp1}"

      - name: val_deployment_exceeding_consecutive_limit_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_29_ERR_STAFF_CONSECUTIVE_LIMIT
          - errors[ERR_STAFF_CONSECUTIVE_LIMIT]
          - calculations.labor_minutes_ledger
          - entities.StaffMember.fields.max_consecutive_deployment_minutes
        distinguishing_aspect: "planned_minutes is compared against the team member's own max_consecutive_deployment_minutes, so a 90-minute OOT block for someone capped at 60 is refused with ERR_STAFF_CONSECUTIVE_LIMIT (422) before any labour minutes move."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store with labor_minutes_budget 300; one OOT-certified StaffMember with max_consecutive_deployment_minutes 60; one ACTIVE LUNCH profile; clock 11:00:00Z."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Consecutive Store", store_number: "C-2398-36", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Con Seckler", oot_certified: true, max_consecutive_deployment_minutes: 60 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sm_id: $.data.id, cap: $.data.max_consecutive_deployment_minutes }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/order-taker-deployments"
              payload: { restaurant_id: "${r_id}", staff_member_id: "${sm_id}", daypart_profile_id: "${dp_id}", position: "OOT_LANE_A", planned_start_at: "2026-08-01T11:00:00Z", planned_end_at: "2026-08-01T12:30:00Z" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${cap} == 60 (explicitly supplied, overriding the declared default of 90)"
            - "planned_minutes would be ceil(5400 / 60) == 90 > 60, so HTTP 422 and ${err} == ERR_STAFF_CONSECUTIVE_LIMIT"
            - "${err} != ERR_STAFF_NOT_OOT_CERTIFIED — the member IS oot_certified, so the priority-14 gate passes first"
            - "Restaurant.${r_id}.labor_minutes_committed == 0 and labor_minutes_available == 300 (no ledger movement)"
            - "GET /drive-thru/order-taker-deployments?restaurant_id=${r_id} returns total_count 0"

      - name: val_second_pull_forward_on_same_loop_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_26_ERR_PULL_FORWARD_ALREADY_OPEN
          - errors[ERR_PULL_FORWARD_ALREADY_OPEN]
          - state_machines.PullForwardOrder.initial_state_ISSUED
        distinguishing_aspect: "A loop may hold only one pull-forward in ISSUED or PARKED, so a second ITEM_LAG order on the same loop is refused with ERR_PULL_FORWARD_ALREADY_OPEN (409) and the original's lag_seconds are left alone."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; one StaffMember; one ACTIVE LUNCH profile."
            - "One TimerLoop in ORDERED (arrive 11:00:00Z, greet 11:00:20Z, order-complete 11:01:00Z) already carrying an ISSUED PullForwardOrder with lag_seconds 45."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner PF Duplicate Store", store_number: "C-2398-37", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Pull Fordham", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:20Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops/${l_id}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:01:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops/${l_id}/order-complete"
              payload: { order_items_count: 6 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/pull-forward-orders"
              payload: { timer_loop_id: "${l_id}", reason: "ITEM_LAG", lag_seconds: 45 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { pf1: $.data.id, pf1_state: $.data.pf_state, pf1_lag: $.data.lag_seconds }
