            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-QC1", display_name: "Quarantine Cascade Groves" }, as: PackinghouseAdmin, captures: { qc_g: "$.data.id" } }
