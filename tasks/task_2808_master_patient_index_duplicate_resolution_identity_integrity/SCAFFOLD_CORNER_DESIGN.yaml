            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/start-review"
              payload: {}
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/evidence"
              payload: { evidence_type: "PHOTO_ID", outcome: "SUPPORTS_DISTINCT", weight_points: 3.00, note: "Two different faces." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/evidence"
              payload: { evidence_type: "CLINICAL_CHART_COMPARE", outcome: "SUPPORTS_DISTINCT", weight_points: 2.00, note: "Incompatible surgical histories." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/recommend"
              payload: { recommendation: "DISTINCT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/resolve-distinct"
              payload: { resolution_note: "Confirmed two distinct patients." }
              as: IdentityStewardApprover
