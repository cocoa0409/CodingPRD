              as: IntakeSpecialist
              captures: { ref_b: $.data.id }
            - call: "POST /ei/referrals/${ref_b}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_a}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_a: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_a}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_a}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "NOT_ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_a}/complete"
              payload: { completion_date: "2026-03-19", eligibility_recommendation: "NOT_ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
          trigger:
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
