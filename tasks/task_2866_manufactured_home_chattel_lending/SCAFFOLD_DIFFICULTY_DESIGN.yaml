      - name: fund_requires_community_operator_agreement_executed
        grounds:
          - validations[priority=56]
          - entities.Community.fields.operator_agreement_status
          - state_machines.Community.operator_agreement_status
          - endpoints[POST /chattel/loans/{loan_id}/fund]
          - state_machines.Loan.underwriting_state.APPROVED_to_FUNDED
        distinguishing_aspect: "The dependency runs LOAN -> COMMUNITY: a fully approved, insured and perfected Loan cannot leave APPROVED while its unit's Community sits at operator_agreement_status PENDING, and the identical fund call succeeds once a THIRD party (the CommunityOperator, on an endpoint the lender cannot call) executes the agreement. The already-CERTIFIED valuation is not re-derived by that change, so certified_value_cents stays at the COMMUNITY_WITHOUT_AGREEMENT figure 5839859 and apr_bps stays 1275 after funding."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A Community whose operator agreement has been PROPOSED but not EXECUTED."
            - "A PERMANENT_FOUNDATION unit in wind_zone 2 placed on a lot in that community, so wind coverage is NOT required (validation priority 52 cannot fire)."
            - "A CERTIFIED ORIGINATION valuation of 5839859 cents on that unit, and an APPROVED 4600000-cent loan at ltv_bps 7877 / apr_bps 1275 / 240 months."
            - "An ACTIVE borrower policy with dwelling_coverage_cents 4800000 (>= required 4671887) and a RECORDED TITLE_LIEN filing, so priorities 50, 52, 53 and 58 are all satisfied and only priority 56 can fire."
