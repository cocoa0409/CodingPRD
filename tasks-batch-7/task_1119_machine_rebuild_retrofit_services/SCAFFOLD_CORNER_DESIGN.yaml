  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_acceptance_cascade
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.RebuildProject.AWAITING_ACCEPTANCE_to_ACCEPTED]
        distinguishing_aspect: "Immediate consistency: the PASS record's own response is terminal, and the very next reads show the project ACCEPTED and the auto-created TrainingRecord — no lag, no recompute endpoint."
        test_recipe:
          setup: ["project AWAITING_ACCEPTANCE with a SCHEDULED test"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-257", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-257", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 1 }, as: ProjectManager, captures: { line_a: $.data.id } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/send", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /api/projects/${proj}/begin-sourcing", payload: {}, as: ProjectManager }
            - { call: "POST /api/part-lines/${line_a}/fulfill", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /api/projects/${proj}/start-rebuild", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/declare-ready", payload: {}, as: RebuildEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/projects/${proj}/acceptance-tests", payload: {}, as: QualityInspector, as_user_id: "qi-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /api/acceptance-tests/${t1}/record", payload: { samples_microns: [8, -8, 8, -8, 0], repeatability_microns: 5.0 }, as: QualityInspector, as_user_id: "qi-1", captures: { t_status: $.data.status } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_ws: $.data.work_status, p_acc: $.data.accepted_positioning_microns } }
            - { call: "GET /api/training-records?project_id=${proj}", payload: {}, as: ProjectManager, captures: { tr_status: "$.data[0].status", tr_req: "$.data[0].sessions_required" } }
          assert:
            - "record response itself is terminal: test status == PASSED"
            - "immediately after: project work_status == ACCEPTED, accepted_positioning_microns == 8.0"
            - "immediately after: the cascade-created TrainingRecord is readable — status PLANNED, sessions_required == 2"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: fk_reverse_discovery_of_cascade_created_project
        claim_type: cross_reference_link
        grounds: ["endpoints.GET /api/projects", "endpoints.POST /api/assessments/{id}/accept", entities.RebuildProject.fields.assessment_id]
        distinguishing_aspect: "The accept response carries no project id; the cascade-created RebuildProject is discoverable only through the filtered list GET /api/projects?assessment_id= (reverse-reachability channel)."
        test_recipe:
          setup: ["assessment SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-258", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
          trigger:
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager, captures: { a_status: $.data.status } }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id", proj_ws: "$.data[0].work_status", proj_cs: "$.data[0].commercial_status" } }
          assert:
            - "accept returns the Assessment (status ACCEPTED) — no project payload embedded"
            - "GET /api/projects?assessment_id=${asmt} returns exactly one project: work_status SCOPED, commercial_status QUOTE_DRAFT, decision NONE"

      - name: part_lines_filtered_list_isolates_by_part
