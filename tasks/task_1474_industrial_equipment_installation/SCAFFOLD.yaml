# =============================================================================
# SCAFFOLD.yaml — Industrial Equipment Installation & Millwright Services
# =============================================================================

scenario: |
  Industrial Equipment Installation & Millwright Services (union millwright contractor): site survey & rigging plan, foundation/anchor & alignment tolerance, crane lift & road permit coordination, precision laser alignment record, commissioning checklist & sign-off, union/prevailing-wage labor classification, safety plan & lockout coordination, T&M vs lump-sum billing

domain_name: industrial-equipment-installation
api_prefix: /v1

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # T&M vs lump-sum invoicing; daily-OT vs weekly-OT labor costing
    - cascading_side_effects        # safety suspend cascade; rigging supersede cascade
    - optimistic_concurrency        # OCC on Project.version for rigging-plan create-with-supersede
    - version_pinning_on_approval   # Project pins approved rigging plan id+revision at approval
  entity_topology: flat             # peer resources under /v1, creation via FK in body; nested GETs are read views only
  state_machine_shape: cyclic       # revision loops + safety-hold cycle; Project additionally carries parallel dims
  relationship_patterns:
    - one_to_many                   # Project -> each child collection
    - cross_aggregate               # LiftPermit crane_ref booking pool; lockout feeder pool
  role_model: segregation_of_duties # labor submitter != approver; plan writer != reviewer; submitter != sign-off
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: customer_name, type: string, source: input, description: "Customer (plant owner) name" }
      - { name: site_address, type: string, source: input, description: "Installation site address" }
      - { name: billing_mode, type: enum, source: input, description: "TM | LUMP_SUM — selects invoice_amount variant; immutable after creation (no update endpoint)" }
      - { name: contract_amount_cents, type: integer, source: input, description: "LUMP_SUM: fixed contract price; TM: not-to-exceed (NTE) cap. Must be > 0" }
      - { name: equipment_hourly_rate_cents, type: integer, source: input, description: "Crane/equipment billing rate per hour used by T&M equipment charges" }
      - { name: retainage_pct, type: number, source: input, default: 0.10, description: "Retainage fraction withheld from each non-final invoice; 0 <= retainage_pct <= 0.20" }
      - { name: ot_basis, type: enum, source: input, default: DAILY_OT, description: "DAILY_OT | WEEKLY_OT — prevailing-wage overtime regime for labor_cost on this project's entries" }
      - { name: work_status, type: enum, source: system, description: "AWARDED | MOBILIZED | INSTALLING | COMMISSIONING | COMPLETED" }
      - { name: hold_status, type: enum, source: system, description: "CLEAR | SAFETY_HOLD — parallel dimension driven by SafetyPlan suspend/resume" }
      - { name: approved_rigging_plan_id, type: string, source: system, description: "Currently pinned approved RiggingPlan id; null when none approved", constraints: "nullable" }
      - { name: approved_rigging_plan_revision, type: integer, source: system, description: "Revision of the pinned approved RiggingPlan", constraints: "nullable" }
      - { name: approved_labor_cents, type: integer, source: computed, description: "Sum of total_cost_cents over LaborEntry with status IN {APPROVED, INVOICED} (see project_cost_rollup)" }
      - { name: approved_equipment_cents, type: integer, source: computed, description: "Sum of equipment_charge_cents over LiftPermit with status EXECUTED (see project_cost_rollup)" }
      - { name: invoiced_cents, type: integer, source: computed, description: "Sum of amount_cents over all Invoice records for the project" }

  - name: SiteSurvey
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: survey_date, type: string, source: input, description: "Survey date, YYYY-MM-DD" }
      - { name: anchor_bolt_count, type: integer, source: input, description: "Number of anchor bolts verified; must be > 0" }
      - { name: anchor_tolerance_mm, type: number, source: input, description: "Allowed max anchor-bolt pattern deviation per spec; > 0" }
      - { name: anchor_measured_max_deviation_mm, type: number, source: input, description: "Worst measured anchor-bolt deviation; >= 0" }
      - { name: overhead_clearance_mm, type: number, source: input, description: "Measured overhead clearance along the rigging path; > 0" }
      - { name: foundation_pour_date, type: datetime, source: input, description: "ISO8601 timestamp the foundation was poured" }
      - { name: anchor_check_passed, type: boolean, source: computed, description: "anchor_measured_max_deviation_mm <= anchor_tolerance_mm (equality passes)" }
      - { name: foundation_cured, type: boolean, source: computed, description: "current_utc >= foundation_pour_date + MIN_CURE_DAYS days (see anchor_foundation_checks)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: reviewer_note, type: string, source: system, description: "Note recorded by reviewer at review time", constraints: "nullable" }

  - name: SafetyPlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; at most one SafetyPlan per project" }
      - { name: plan_document_ref, type: string, source: input, description: "Reference to the site-specific safety plan document" }
      - { name: loto_procedure_ref, type: string, source: input, description: "Reference to the lockout-tagout procedure document" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: LockoutWindow
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: feeder_id, type: string, source: input, description: "Energy source / electrical feeder identifier being locked out" }
      - { name: starts_at, type: datetime, source: input, description: "Lockout window start (ISO8601)" }
      - { name: ends_at, type: datetime, source: input, description: "Lockout window end (ISO8601); must be > starts_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | RELEASED | CANCELLED | EXPIRED" }

  - name: RiggingPlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: revision, type: integer, source: system, description: "1-based revision counter per project: count of prior RiggingPlan rows for the project + 1" }
      - { name: lift_weight_tons, type: number, source: input, description: "Gross lifted weight including rigging; > 0" }
      - { name: crane_model, type: string, source: input, description: "Planned crane model" }
      - { name: planned_crane_capacity_tons, type: number, source: input, description: "Rated capacity of the planned crane configuration; > 0" }
      - { name: rigging_config, type: enum, source: input, description: "SINGLE_CRANE | TANDEM | GANTRY" }
      - { name: weight_check_passed, type: boolean, source: computed, description: "lift_weight_tons <= planned_crane_capacity_tons (equality passes)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: reviewer_note, type: string, source: system, description: "Note recorded by reviewer", constraints: "nullable" }

  - name: LiftPermit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: crane_ref, type: string, source: input, description: "Fleet crane unit identifier; the shared booking resource for overlap checks" }
      - { name: lift_starts_at, type: datetime, source: input, description: "Crane booking window start (ISO8601), half-open" }
      - { name: lift_ends_at, type: datetime, source: input, description: "Crane booking window end (ISO8601); must be > lift_starts_at" }
      - { name: road_permit_required, type: boolean, source: input, description: "Whether an oversize-load road permit is required for crane mobilization" }
      - { name: road_permit_number, type: string, source: input, description: "Road permit number; required iff road_permit_required is true", constraints: "conditionally required" }
      - { name: duration_hours, type: number, source: computed, description: "(lift_ends_at - lift_starts_at) in hours" }
      - { name: equipment_charge_cents, type: integer, source: computed, description: "Set at execute time: round_half_up(duration_hours * Project.equipment_hourly_rate_cents); null before EXECUTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ISSUED | EXECUTED | CANCELLED | EXPIRED" }

  - name: AlignmentRecord
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: measurement_point, type: string, source: input, description: "Machine-train point measured, e.g. PUMP-TO-MOTOR" }
      - { name: tolerance_class, type: enum, source: input, description: "STANDARD | PRECISION — selects tolerance constants" }
      - { name: measured_offset_mils, type: number, source: input, description: "Laser-measured parallel offset in mils; >= 0" }
      - { name: measured_angular_mils_per_in, type: number, source: input, description: "Laser-measured angular misalignment in mils/inch; >= 0" }
      - { name: offset_passed, type: boolean, source: computed, description: "measured_offset_mils <= class offset tolerance (equality passes)" }
      - { name: angular_passed, type: boolean, source: computed, description: "measured_angular_mils_per_in <= class angular tolerance (equality passes)" }
      - { name: verdict, type: enum, source: computed, description: "PASS iff offset_passed AND angular_passed else FAIL" }
      - { name: status, type: enum, source: system, description: "RECORDED | ACCEPTED | REJECTED" }
      - { name: reviewer_note, type: string, source: system, description: "Note recorded by reviewer", constraints: "nullable" }

  - name: CommissioningChecklist
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; at most one non-terminal checklist per project" }
      - { name: items, type: array, source: input, description: "Array of {item_key, description, required}; each item gains checked:false, checked_by_user_id:null, checked_at:null at creation" }
      - { name: required_count, type: integer, source: computed, description: "Count of items with required == true" }
      - { name: checked_required_count, type: integer, source: computed, description: "Count of required items with checked == true" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | SUBMITTED | SIGNED_OFF" }
      - { name: signed_off_by_user_id, type: string, source: system, description: "X-User-ID of the CustomerRep who signed off", constraints: "nullable" }

  - name: LaborEntry
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: worker_ref, type: string, source: input, description: "Union card / worker reference" }
      - { name: classification, type: enum, source: input, description: "MW_JOURNEYMAN | MW_APPRENTICE | MW_FOREMAN | OPERATOR — prevailing-wage classification" }
      - { name: work_date, type: string, source: input, description: "Date worked, YYYY-MM-DD" }
      - { name: hours_worked, type: number, source: input, description: "Hours worked that date; 0 < hours_worked <= 24" }
      - { name: shift, type: enum, source: input, description: "DAY | NIGHT — NIGHT applies shift multiplier" }
      - { name: regular_hours, type: number, source: computed, description: "Straight-time hours after OT split per Project.ot_basis (see labor_cost); frozen at creation" }
      - { name: overtime_hours, type: number, source: computed, description: "Overtime hours after OT split; frozen at creation" }
      - { name: base_rate_cents, type: integer, source: computed, description: "Prevailing-wage base hourly rate for classification from CLASS_RATE_CENTS" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Sum of rounded straight, overtime, and fringe components (see labor_cost)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | INVOICED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the SiteSupervisor who submitted; null while DRAFT", constraints: "nullable" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the PayrollClerk who approved", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at rejection", constraints: "nullable" }

  - name: Invoice
    parent: null
    common_fields: false   # append-only record: id + created_at only; no updates, no version
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: kind, type: enum, source: input, description: "PROGRESS | FINAL" }
      - { name: period_start, type: string, source: input, description: "Billing period start date, YYYY-MM-DD, inclusive" }
      - { name: period_end, type: string, source: input, description: "Billing period end date, YYYY-MM-DD, inclusive; must be >= period_start" }
      - { name: progress_pct, type: number, source: input, description: "Cumulative percent of contract billed-to-date (0..100); required for LUMP_SUM projects, ignored/forbidden for TM", constraints: "conditionally required" }
      - { name: billing_mode_snapshot, type: enum, source: system, description: "Project.billing_mode captured at creation" }
      - { name: gross_cents, type: integer, source: computed, description: "Gross amount before retainage (see invoice_amount)" }
      - { name: retainage_cents, type: integer, source: computed, description: "round_half_up(gross_cents * Project.retainage_pct) — computed on the summed gross, never per line" }
      - { name: retainage_released_cents, type: integer, source: computed, description: "FINAL only: sum of retainage_cents over all prior invoices of the project; 0 for PROGRESS" }
      - { name: amount_cents, type: integer, source: computed, description: "gross_cents - retainage_cents + retainage_released_cents" }
      - { name: labor_entry_ids, type: array, source: system, description: "TM: ids of LaborEntry rows marked INVOICED by this invoice; empty for LUMP_SUM" }
      - { name: lift_permit_ids, type: array, source: system, description: "TM: ids of EXECUTED LiftPermit rows billed by this invoice; empty for LUMP_SUM" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    field: work_status
    initial_state: AWARDED
    terminal_states: [COMPLETED]
    transitions:
      - from: AWARDED
        to: MOBILIZED
        trigger: "POST /v1/projects/{id}/advance"
        actor: ProjectManager
        preconditions:
          - "hold_status == CLEAR (ERR_SAFETY_HOLD)"
          - "A SafetyPlan for this project exists with status == ACTIVE (ERR_SAFETY_PLAN_NOT_ACTIVE)"
        side_effects:
          - "increments Project.version by 1"
      - from: MOBILIZED
        to: INSTALLING
        trigger: "POST /v1/projects/{id}/advance"
        actor: ProjectManager
        preconditions:
          - "hold_status == CLEAR (ERR_SAFETY_HOLD)"
          - "A SiteSurvey for this project exists with status == ACCEPTED (ERR_SITE_SURVEY_NOT_ACCEPTED)"
        side_effects:
          - "increments Project.version by 1"
      - from: INSTALLING
        to: COMMISSIONING
        trigger: "POST /v1/projects/{id}/advance"
        actor: ProjectManager
        preconditions:
          - "hold_status == CLEAR (ERR_SAFETY_HOLD)"
          - "At least one LiftPermit for this project has status == EXECUTED (ERR_NO_EXECUTED_LIFT)"
          - "No LockoutWindow for this project has status IN {SCHEDULED, ACTIVE} (ERR_LOCKOUTS_OUTSTANDING)"
        side_effects:
          - "increments Project.version by 1"
      - from: COMMISSIONING
        to: COMPLETED
        trigger: "POST /v1/projects/{id}/advance"
        actor: ProjectManager
        preconditions:
          - "hold_status == CLEAR (ERR_SAFETY_HOLD)"
          - "A CommissioningChecklist for this project exists with status == SIGNED_OFF (ERR_CHECKLIST_NOT_SIGNED_OFF)"
        side_effects:
          - "increments Project.version by 1"
      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /v1/projects/{id}/advance"
        actor: ProjectManager
        preconditions: []
        side_effects: []
        note: "Terminal — any advance attempt is rejected with ERR_INVALID_STATE"

  - entity: Project
    field: hold_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: SAFETY_HOLD
        trigger: "system cascade from POST /v1/safety-plans/{id}/suspend"
        actor: system
        preconditions:
          - "The suspended SafetyPlan belongs to this project"
        side_effects:
          - "Every LaborEntry of this project with status == SUBMITTED transitions to REJECTED with rejection_reason 'SAFETY_HOLD'"
          - "Project.approved_labor_cents is unchanged (rejected entries were not approved)"
          - "increments Project.version by 1"
      - from: SAFETY_HOLD
        to: CLEAR
        trigger: "system cascade from POST /v1/safety-plans/{id}/resume, or from POST /v1/safety-plans/{id}/close when the plan was SUSPENDED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Project.version by 1"
        note: "Compensating transition: restores CLEAR without touching labor entries rejected by the suspend cascade"

  - entity: SiteSurvey
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/site-surveys/{id}/submit"
        actor: SiteSupervisor
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /v1/site-surveys/{id}/review with outcome=ACCEPTED"
        actor: ProjectManager
        preconditions:
          - "anchor_check_passed == true (ERR_ANCHOR_OUT_OF_TOLERANCE)"
          - "foundation_cured == true at review time (ERR_FOUNDATION_NOT_CURED)"
        side_effects:
          - "reviewer_note recorded"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/site-surveys/{id}/review with outcome=REJECTED"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "reviewer_note recorded"
        note: "REJECTED is terminal; a failed survey is replaced by creating a new SiteSurvey row"

  - entity: SafetyPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/safety-plans/{id}/activate"
        actor: SafetyOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/safety-plans/{id}/suspend"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "CASCADE hop 1: Project.hold_status -> SAFETY_HOLD"
          - "CASCADE hop 2 (caused by hop 1): every LaborEntry of the project with status == SUBMITTED -> REJECTED (rejection_reason 'SAFETY_HOLD')"
          - "CASCADE hop 3 (caused by hop 2): Project derived fields re-evaluated and Project.version incremented"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/safety-plans/{id}/resume"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "Project.hold_status -> CLEAR; increments Project.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /v1/safety-plans/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "No LockoutWindow for the project has status == ACTIVE (ERR_LOCKOUTS_OUTSTANDING)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /v1/safety-plans/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "No LockoutWindow for the project has status == ACTIVE (ERR_LOCKOUTS_OUTSTANDING)"
        side_effects:
          - "Project.hold_status -> CLEAR; increments Project.version by 1"

  - entity: LockoutWindow
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system, on POST /v1/_clock/set_current_utc when starts_at <= now < ends_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system, on POST /v1/_clock/set_current_utc when now >= ends_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/lockout-windows/{id}/cancel"
        actor: SafetyOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /v1/lockout-windows/{id}/release"
        actor: SafetyOfficer
        preconditions: []
        side_effects: []
        note: "Physical locks require manual release; ACTIVE never auto-releases past ends_at"

  - entity: RiggingPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/rigging-plans/{id}/submit"
        actor: SiteSupervisor
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/rigging-plans/{id}/review with outcome=APPROVED"
        actor: ProjectManager
        preconditions:
          - "A SiteSurvey for the project exists with status == ACCEPTED (ERR_SITE_SURVEY_NOT_ACCEPTED)"
          - "weight_check_passed == true (ERR_LIFT_WEIGHT_EXCEEDED)"
        side_effects:
          - "Project.approved_rigging_plan_id := this plan id; Project.approved_rigging_plan_revision := this plan revision (version pin)"
          - "increments Project.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/rigging-plans/{id}/review with outcome=REJECTED"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "reviewer_note recorded"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /v1/rigging-plans/{id}/revise (optional new planning values)"
        actor: SiteSupervisor
        preconditions: []
        side_effects:
          - "Provided fields (lift_weight_tons, planned_crane_capacity_tons, crane_model, rigging_config) replaced; weight_check_passed recomputed"
        note: "Revision loop: the same row cycles DRAFT -> SUBMITTED -> REJECTED -> DRAFT"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade from POST /v1/rigging-plans for the same project"
        actor: system
        preconditions: []
        side_effects:
          - "Project.approved_rigging_plan_id := null; Project.approved_rigging_plan_revision := null"
          - "Every LiftPermit of the project with status == ISSUED -> CANCELLED (its pinned approval basis is gone)"

  - entity: LiftPermit
    initial_state: ISSUED
    terminal_states: [EXECUTED, CANCELLED, EXPIRED]
    transitions:
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /v1/lift-permits/{id}/execute"
        actor: SiteSupervisor
        preconditions:
          - "Project.hold_status == CLEAR (ERR_SAFETY_HOLD)"
          - "current_utc within [lift_starts_at, lift_ends_at) (ERR_OUTSIDE_LIFT_WINDOW)"
        side_effects:
          - "equipment_charge_cents := round_half_up(duration_hours * Project.equipment_hourly_rate_cents)"
          - "Project.approved_equipment_cents += equipment_charge_cents; increments Project.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /v1/lift-permits/{id}/cancel, or system cascade when the project's approved RiggingPlan is superseded"
        actor: SiteSupervisor | system
        preconditions: []
        side_effects:
          - "Booking released: crane_ref window no longer counts toward crane_window_commitment"
      - from: ISSUED
        to: EXPIRED
        trigger: "system, on POST /v1/_clock/set_current_utc when now >= lift_ends_at"
        actor: system
        preconditions: []
        side_effects:
          - "Booking released: crane_ref window no longer counts toward crane_window_commitment"

  - entity: AlignmentRecord
    initial_state: RECORDED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECORDED
        to: ACCEPTED
        trigger: "POST /v1/alignment-records/{id}/review with outcome=ACCEPTED"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "reviewer_note recorded"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /v1/alignment-records/{id}/review with outcome=REJECTED"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "reviewer_note recorded"

  - entity: CommissioningChecklist
    initial_state: IN_PROGRESS
    terminal_states: [SIGNED_OFF]
    transitions:
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /v1/commissioning-checklists/{id}/submit"
        actor: ProjectManager
        preconditions:
          - "Project.work_status == COMMISSIONING (ERR_INVALID_STATE)"
          - "checked_required_count == required_count (ERR_CHECKLIST_INCOMPLETE)"
          - "At least one AlignmentRecord for the project has status == ACCEPTED and verdict == PASS, AND no AlignmentRecord for the project has status == RECORDED (ERR_ALIGNMENT_OUTSTANDING)"
        side_effects: []
      - from: SUBMITTED
        to: SIGNED_OFF
        trigger: "POST /v1/commissioning-checklists/{id}/sign-off"
        actor: CustomerRep
        preconditions: []
        side_effects:
          - "signed_off_by_user_id := X-User-ID of the CustomerRep"
          - "increments Project.version by 1"

  - entity: LaborEntry
    initial_state: DRAFT
    terminal_states: [INVOICED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/labor-entries/{id}/submit"
        actor: SiteSupervisor
        preconditions:
          - "Project.hold_status == CLEAR (ERR_SAFETY_HOLD)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the submitter"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /v1/labor-entries/{id}/submit (resubmission)"
        actor: SiteSupervisor
        preconditions:
          - "Project.hold_status == CLEAR (ERR_SAFETY_HOLD)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the submitter; rejection_reason cleared"
        note: "Payroll revision loop: SUBMITTED -> REJECTED -> SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/labor-entries/{id}/approve"
        actor: PayrollClerk
        preconditions:
          - "X-User-ID of approver != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "Project.approved_labor_cents += total_cost_cents; increments Project.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/labor-entries/{id}/reject"
        actor: PayrollClerk
        preconditions: []
        side_effects:
          - "rejection_reason recorded"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /v1/labor-entries/{id}/reject (payroll reversal, only while not yet INVOICED)"
        actor: PayrollClerk
        preconditions: []
        side_effects:
          - "COMPENSATION: Project.approved_labor_cents -= total_cost_cents; increments Project.version by 1"
          - "rejection_reason recorded"
      - from: APPROVED
        to: INVOICED
        trigger: "system, on POST /v1/invoices for a TM project whose billing period covers work_date"
        actor: system
        preconditions: []
        side_effects:
          - "Entry id appended to Invoice.labor_entry_ids"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: rigging-plan-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /v1/rigging-plans"
    occ_field: expected_project_version
    description: |
      Creating a RiggingPlan against a Project whose version has advanced
      since the client last observed it is rejected. Plan creation supersedes
      the currently APPROVED plan and clears the project's approval pin, so a
      writer acting on a stale project view would silently discard a newer
      approval or supersede chain it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: labor_cost
    trigger: "LaborEntry creation (POST /v1/labor-entries); components frozen on the row at creation and never recomputed"
    algorithm: tiered_pricing
    formula: |
      base_rate_cents = CLASS_RATE_CENTS[classification]
      shift_mult = 1.0 if shift == DAY else NIGHT_SHIFT_MULT
      OT split (variant selected by Project.ot_basis):
        DAILY_OT:  regular_hours = min(hours_worked, DAILY_OT_THRESHOLD_H)
                   overtime_hours = max(0, hours_worked - DAILY_OT_THRESHOLD_H)
        WEEKLY_OT: prior = sum of hours_worked over LaborEntry rows with the same
                   worker_ref, same ISO week (Mon-Sun) as work_date, and status
                   IN {SUBMITTED, APPROVED, INVOICED} (DRAFT and REJECTED excluded)
                   regular_hours = max(0, min(prior + hours_worked, WEEKLY_OT_THRESHOLD_H) - min(prior, WEEKLY_OT_THRESHOLD_H))
                   overtime_hours = hours_worked - regular_hours
      Components (rounding order pinned — round each component, THEN sum):
        straight_component = round_half_up(regular_hours * base_rate_cents * shift_mult)
        overtime_component = round_half_up(overtime_hours * base_rate_cents * OT_MULT * shift_mult)
        fringe_component   = round_half_up(hours_worked * FRINGE_CENTS_PER_HOUR)
      total_cost_cents = straight_component + overtime_component + fringe_component
    input_set: "The new LaborEntry plus, for WEEKLY_OT only, prior same-worker same-week entries in status {SUBMITTED, APPROVED, INVOICED}"
    constants:
      CLASS_RATE_CENTS: { MW_JOURNEYMAN: 8500, MW_APPRENTICE: 5600, MW_FOREMAN: 9800, OPERATOR: 7200 }
      OT_MULT: 1.5
      NIGHT_SHIFT_MULT: 1.10
      FRINGE_CENTS_PER_HOUR: 2100
      DAILY_OT_THRESHOLD_H: 8
      WEEKLY_OT_THRESHOLD_H: 40
    precision: "integer cents; round_half_up per component, then sum"
    variants:
      - name: DAILY_OT
        when: "Project.ot_basis == DAILY_OT"
        difference: "OT threshold applied per single entry's hours_worked"
      - name: WEEKLY_OT
        when: "Project.ot_basis == WEEKLY_OT"
        difference: "OT threshold applied against cumulative same-worker same-week hours; identical hours_worked yields a different regular/overtime split"

  - name: invoice_amount
    trigger: "Invoice creation (POST /v1/invoices)"
    algorithm: aggregation
    formula: |
      Variant selected by Project.billing_mode (snapshot onto Invoice.billing_mode_snapshot):
      TM variant:
        labor_sum = sum of total_cost_cents over LaborEntry with status == APPROVED
                    and work_date within [period_start, period_end] inclusive
        equipment_sum = sum of equipment_charge_cents over LiftPermit with status == EXECUTED
                    and date portion of lift_starts_at within [period_start, period_end] inclusive
        gross_cents = labor_sum + equipment_sum   (both are sums of already-rounded components; no re-rounding)
        side effect: those LaborEntry rows -> INVOICED
      LUMP_SUM variant:
        cumulative_target = round_half_up(Project.contract_amount_cents * progress_pct / 100)
        gross_cents = cumulative_target - (sum of gross_cents over all prior invoices of the project)
      Shared tail (rounding order pinned — retainage computed on the summed gross, never per line):
        retainage_cents = round_half_up(gross_cents * Project.retainage_pct)
        retainage_released_cents = (kind == FINAL) ? sum of retainage_cents over all prior invoices : 0
        amount_cents = gross_cents - retainage_cents + retainage_released_cents
    input_set: "TM: APPROVED labor + EXECUTED lifts in period; LUMP_SUM: contract amount, progress_pct, prior invoices"
    constants: {}
    precision: "integer cents; round_half_up; retainage rounded from summed gross exactly once"
    variants:
      - name: TM
        when: "Project.billing_mode == TM"
        difference: "Bills actual approved labor plus executed equipment charges for the period; cumulative gross checked against NTE cap (ERR_NTE_EXCEEDED)"
      - name: LUMP_SUM
        when: "Project.billing_mode == LUMP_SUM"
        difference: "Bills progress_pct cumulative percent of the fixed contract less previously invoiced gross; identical period data yields a different gross_cents than TM"

  - name: alignment_verdict
    trigger: "AlignmentRecord creation (POST /v1/alignment-records)"
    algorithm: threshold
    formula: |
      offset_passed  = measured_offset_mils <= OFFSET_TOLERANCE_MILS[tolerance_class]      (equality passes)
      angular_passed = measured_angular_mils_per_in <= ANGULAR_TOLERANCE[tolerance_class]  (equality passes)
      verdict = PASS if offset_passed AND angular_passed else FAIL
    input_set: "The single new AlignmentRecord"
    constants:
      OFFSET_TOLERANCE_MILS: { STANDARD: 5.0, PRECISION: 2.0 }
      ANGULAR_TOLERANCE: { STANDARD: 1.0, PRECISION: 0.5 }
    precision: "comparison in raw input units; no rounding"

  - name: anchor_foundation_checks
    trigger: "SiteSurvey creation (anchor_check_passed) and continuously at read/review time (foundation_cured)"
    algorithm: threshold
    formula: |
      anchor_check_passed = anchor_measured_max_deviation_mm <= anchor_tolerance_mm  (equality passes)
      foundation_cured = current_utc >= foundation_pour_date + MIN_CURE_DAYS days    (exactly MIN_CURE_DAYS passes)
    input_set: "The single SiteSurvey plus the logical clock"
    constants:
      MIN_CURE_DAYS: 7
    precision: "datetime comparison at second precision"

  - name: project_cost_rollup
    trigger: "LaborEntry approve / reject-from-APPROVED / invoice-marking transitions; LiftPermit execute; Invoice creation"
    algorithm: aggregation
    formula: |
      Project.approved_labor_cents     = sum of LaborEntry.total_cost_cents where status IN {APPROVED, INVOICED}
      Project.approved_equipment_cents = sum of LiftPermit.equipment_charge_cents where status == EXECUTED
      Project.invoiced_cents           = sum of Invoice.amount_cents over all invoices of the project
    input_set: "All child rows of the project in the named states"
    constants: {}
    precision: "integer cents"

  - name: crane_window_commitment
    trigger: "LiftPermit creation (overlap validation) and cancellation/execution bookkeeping"
    algorithm: interval_merge
    formula: |
      Committed hours for crane_ref C = sum of duration_hours over LiftPermit rows
      with crane_ref == C and status == ISSUED (EXECUTED is historic, CANCELLED/EXPIRED released).
      Overlap check for a new ISSUED window [s, e) on crane_ref C against each existing
      ISSUED window [s2, e2) with the same crane_ref (any project — the fleet is shared):
        conflict iff s < e2 AND s2 < e     (half-open intervals; adjacency s == e2 or e == s2 is NOT a conflict)
    input_set: "LiftPermit rows with status == ISSUED and matching crane_ref, across all projects"
    constants: {}
    precision: "datetime comparison at second precision"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path and body resource ids (project_id, plan ids, etc.) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 4, category: state, check: "expected_project_version equals current Project.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /v1/rigging-plans" }
  - { priority: 5, category: state, check: "Target entity is in a valid from-state for the requested transition (includes project phase gates such as invoice kind vs work_status, lift create requiring work_status == INSTALLING, checklist submit/create phase gates)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: auth, check: "Segregation of duties: approver X-User-ID != LaborEntry.submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /v1/labor-entries/{id}/approve" }
  - { priority: 7, category: business_constraint, check: "Schema/format: required fields present, enum members valid, ranges respected (hours_worked in (0,24], ends_at > starts_at handled at priority 22, retainage_pct in [0,0.20], progress_pct in [0,100] and present iff project is LUMP_SUM, road_permit_number present iff road_permit_required, period_end >= period_start)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all endpoints with a request body" }
  - { priority: 8, category: business_safety, check: "Project.hold_status == CLEAR", error_id: ERR_SAFETY_HOLD, http_status: 409, applies_to: "POST /v1/projects/{id}/advance, POST /v1/labor-entries, POST /v1/labor-entries/{id}/submit, POST /v1/lift-permits/{id}/execute" }
  - { priority: 9, category: business_safety, check: "Project's SafetyPlan exists with status == ACTIVE", error_id: ERR_SAFETY_PLAN_NOT_ACTIVE, http_status: 409, applies_to: "POST /v1/lockout-windows, POST /v1/projects/{id}/advance (AWARDED->MOBILIZED hop)" }
  - { priority: 10, category: business_referential, check: "A SiteSurvey with status == ACCEPTED exists for the project", error_id: ERR_SITE_SURVEY_NOT_ACCEPTED, http_status: 409, applies_to: "POST /v1/rigging-plans/{id}/review (outcome=APPROVED), POST /v1/projects/{id}/advance (MOBILIZED->INSTALLING hop)" }
  - { priority: 11, category: business_referential, check: "Project.approved_rigging_plan_id is not null (a rigging plan is currently APPROVED and pinned)", error_id: ERR_RIGGING_PLAN_NOT_APPROVED, http_status: 409, applies_to: "POST /v1/lift-permits" }
  - { priority: 12, category: business_referential, check: "At least one LiftPermit has status == EXECUTED", error_id: ERR_NO_EXECUTED_LIFT, http_status: 409, applies_to: "POST /v1/projects/{id}/advance (INSTALLING->COMMISSIONING hop)" }
  - { priority: 13, category: business_referential, check: "No LockoutWindow with status IN {SCHEDULED, ACTIVE} (also guards safety-plan close: no ACTIVE lockout)", error_id: ERR_LOCKOUTS_OUTSTANDING, http_status: 409, applies_to: "POST /v1/projects/{id}/advance (INSTALLING->COMMISSIONING hop), POST /v1/safety-plans/{id}/close" }
  - { priority: 14, category: business_referential, check: "At least one ACCEPTED AlignmentRecord with verdict == PASS exists AND zero AlignmentRecords in RECORDED for the project", error_id: ERR_ALIGNMENT_OUTSTANDING, http_status: 409, applies_to: "POST /v1/commissioning-checklists/{id}/submit" }
  - { priority: 15, category: business_referential, check: "A CommissioningChecklist with status == SIGNED_OFF exists", error_id: ERR_CHECKLIST_NOT_SIGNED_OFF, http_status: 409, applies_to: "POST /v1/projects/{id}/advance (COMMISSIONING->COMPLETED hop)" }
  - { priority: 16, category: business_constraint, check: "At most one SafetyPlan per project", error_id: ERR_SAFETY_PLAN_EXISTS, http_status: 409, applies_to: "POST /v1/safety-plans" }
  - { priority: 17, category: business_constraint, check: "At most one CommissioningChecklist per project in non-terminal status (IN_PROGRESS or SUBMITTED); at most one RiggingPlan per project in open status (DRAFT or SUBMITTED) on plan creation", error_id: ERR_CHECKLIST_EXISTS, http_status: 409, applies_to: "POST /v1/commissioning-checklists" }
  - { priority: 18, category: business_constraint, check: "SiteSurvey.anchor_check_passed == true", error_id: ERR_ANCHOR_OUT_OF_TOLERANCE, http_status: 409, applies_to: "POST /v1/site-surveys/{id}/review (outcome=ACCEPTED)" }
  - { priority: 19, category: business_constraint, check: "SiteSurvey.foundation_cured == true at review time", error_id: ERR_FOUNDATION_NOT_CURED, http_status: 409, applies_to: "POST /v1/site-surveys/{id}/review (outcome=ACCEPTED)" }
  - { priority: 20, category: business_constraint, check: "RiggingPlan.weight_check_passed == true", error_id: ERR_LIFT_WEIGHT_EXCEEDED, http_status: 409, applies_to: "POST /v1/rigging-plans/{id}/review (outcome=APPROVED)" }
  - { priority: 21, category: business_constraint, check: "checked_required_count == required_count", error_id: ERR_CHECKLIST_INCOMPLETE, http_status: 422, applies_to: "POST /v1/commissioning-checklists/{id}/submit" }
  - { priority: 22, category: business_temporal, check: "Window well-formed: ends_at > starts_at (lockouts), lift_ends_at > lift_starts_at (permits)", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /v1/lockout-windows, POST /v1/lift-permits" }
  - { priority: 23, category: business_temporal, check: "Lockout buffer: for same project_id + feeder_id, new window must keep a >= LOCKOUT_BUFFER_MIN minute clearance from every window in status {SCHEDULED, ACTIVE}: new.starts_at >= existing.ends_at + buffer OR new.ends_at + buffer <= existing.starts_at (exactly LOCKOUT_BUFFER_MIN passes)", error_id: ERR_LOCKOUT_CONFLICT, http_status: 409, applies_to: "POST /v1/lockout-windows" }
  - { priority: 24, category: business_temporal, check: "Crane booking overlap per crane_window_commitment (half-open; adjacency allowed; ISSUED only; fleet-wide)", error_id: ERR_CRANE_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /v1/lift-permits" }
  - { priority: 25, category: business_temporal, check: "current_utc within [lift_starts_at, lift_ends_at) at execution", error_id: ERR_OUTSIDE_LIFT_WINDOW, http_status: 409, applies_to: "POST /v1/lift-permits/{id}/execute" }
  - { priority: 26, category: business_fiscal, check: "TM: cumulative gross (sum of prior invoices' gross_cents + this gross_cents) <= Project.contract_amount_cents (NTE cap)", error_id: ERR_NTE_EXCEEDED, http_status: 409, applies_to: "POST /v1/invoices" }
  - { priority: 27, category: business_fiscal, check: "At most one FINAL invoice per project", error_id: ERR_FINAL_INVOICE_EXISTS, http_status: 409, applies_to: "POST /v1/invoices (kind=FINAL)" }
  - { priority: 28, category: business_fiscal, check: "PROGRESS invoices: gross_cents > 0 (eligible labor/equipment non-empty for TM; positive incremental gross for LUMP_SUM). FINAL exempt (pure retainage release allowed)", error_id: ERR_NO_BILLABLE_WORK, http_status: 409, applies_to: "POST /v1/invoices (kind=PROGRESS)" }
  - { priority: 29, category: business_constraint, check: "Rigging plan creation blocked while another plan is open (DRAFT or SUBMITTED)", error_id: ERR_RIGGING_PLAN_OPEN_EXISTS, http_status: 409, applies_to: "POST /v1/rigging-plans" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - { method: POST, path: "/v1/projects", description: "Create a project", roles: [ProjectManager], code: 201, input: [name, customer_name, site_address, billing_mode, contract_amount_cents, equipment_hourly_rate_cents, "retainage_pct?", "ot_basis?"], output: Project, side_effects: ["work_status=AWARDED, hold_status=CLEAR, rollup fields 0, version=1"] }
  - { method: GET, path: "/v1/projects", description: "List projects with pagination and optional filters", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?", "work_status?", "billing_mode?"], output: "Project[]", side_effects: [] }
  - { method: GET, path: "/v1/projects/{id}", description: "Get a single project (includes version for OCC and pinned rigging plan fields)", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: [], output: Project, side_effects: [] }
  - { method: POST, path: "/v1/projects/{id}/advance", description: "Advance work_status to the next state in the AWARDED->MOBILIZED->INSTALLING->COMMISSIONING->COMPLETED chain; per-hop preconditions per state machine", roles: [ProjectManager], code: 200, input: [], output: Project, side_effects: ["work_status advances one hop", "increments Project.version by 1"] }

  # --- SiteSurvey ---
  - { method: POST, path: "/v1/site-surveys", description: "Create a site survey (anchor + foundation measurements)", roles: [SiteSupervisor], code: 201, input: [project_id, survey_date, anchor_bolt_count, anchor_tolerance_mm, anchor_measured_max_deviation_mm, overhead_clearance_mm, foundation_pour_date], output: SiteSurvey, side_effects: ["status=DRAFT", "anchor_check_passed and foundation_cured computed"] }
  - { method: GET, path: "/v1/projects/{id}/site-surveys", description: "List site surveys for a project", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "SiteSurvey[]", side_effects: [] }
  - { method: POST, path: "/v1/site-surveys/{id}/submit", description: "Submit a DRAFT survey for review", roles: [SiteSupervisor], code: 200, input: [], output: SiteSurvey, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/v1/site-surveys/{id}/review", description: "Review a SUBMITTED survey; outcome ACCEPTED enforces anchor tolerance and foundation cure", roles: [ProjectManager], code: 200, input: [outcome, "reviewer_note?"], output: SiteSurvey, side_effects: ["status -> ACCEPTED or REJECTED", "reviewer_note recorded"] }

  # --- SafetyPlan ---
  - { method: POST, path: "/v1/safety-plans", description: "Create the project's safety plan (at most one per project)", roles: [SafetyOfficer], code: 201, input: [project_id, plan_document_ref, loto_procedure_ref], output: SafetyPlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/v1/projects/{id}/safety-plans", description: "List safety plans for a project", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "SafetyPlan[]", side_effects: [] }
  - { method: POST, path: "/v1/safety-plans/{id}/activate", description: "Activate a DRAFT safety plan", roles: [SafetyOfficer], code: 200, input: [], output: SafetyPlan, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/v1/safety-plans/{id}/suspend", description: "Suspend an ACTIVE safety plan; cascades SAFETY_HOLD onto the project and auto-rejects SUBMITTED labor", roles: [SafetyOfficer], code: 200, input: [], output: SafetyPlan, side_effects: ["status -> SUSPENDED", "Project.hold_status -> SAFETY_HOLD", "SUBMITTED LaborEntry rows -> REJECTED", "increments Project.version by 1"] }
  - { method: POST, path: "/v1/safety-plans/{id}/resume", description: "Resume a SUSPENDED safety plan; clears the project safety hold", roles: [SafetyOfficer], code: 200, input: [], output: SafetyPlan, side_effects: ["status -> ACTIVE", "Project.hold_status -> CLEAR", "increments Project.version by 1"] }
  - { method: POST, path: "/v1/safety-plans/{id}/close", description: "Close an ACTIVE or SUSPENDED safety plan once no ACTIVE lockouts remain", roles: [SafetyOfficer], code: 200, input: [], output: SafetyPlan, side_effects: ["status -> CLOSED", "if was SUSPENDED: Project.hold_status -> CLEAR"] }

  # --- LockoutWindow ---
  - { method: POST, path: "/v1/lockout-windows", description: "Schedule a lockout-tagout window on a feeder; requires ACTIVE safety plan; enforces 30-minute clearance buffer per feeder", roles: [SafetyOfficer], code: 201, input: [project_id, feeder_id, starts_at, ends_at], output: LockoutWindow, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/v1/projects/{id}/lockout-windows", description: "List lockout windows for a project, optionally by feeder", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?", "feeder_id?"], output: "LockoutWindow[]", side_effects: [] }
  - { method: POST, path: "/v1/lockout-windows/{id}/cancel", description: "Cancel a SCHEDULED lockout window", roles: [SafetyOfficer], code: 200, input: [], output: LockoutWindow, side_effects: ["status -> CANCELLED"] }
  - { method: POST, path: "/v1/lockout-windows/{id}/release", description: "Release an ACTIVE lockout (physical lock removal)", roles: [SafetyOfficer], code: 200, input: [], output: LockoutWindow, side_effects: ["status -> RELEASED"] }

  # --- RiggingPlan ---
  - { method: POST, path: "/v1/rigging-plans", description: "Create a rigging plan (OCC on Project.version). Supersedes the currently APPROVED plan: old plan -> SUPERSEDED, project pin cleared, and ISSUED lift permits -> CANCELLED", roles: [SiteSupervisor], code: 201, input: [project_id, expected_project_version, lift_weight_tons, crane_model, planned_crane_capacity_tons, rigging_config], output: RiggingPlan, side_effects: ["status=DRAFT, revision := prior plan count + 1", "weight_check_passed computed", "prior APPROVED plan -> SUPERSEDED", "Project.approved_rigging_plan_id/revision -> null", "ISSUED LiftPermit rows of the project -> CANCELLED", "increments Project.version by 1"] }
  - { method: GET, path: "/v1/projects/{id}/rigging-plans", description: "List rigging plans for a project", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "RiggingPlan[]", side_effects: [] }
  - { method: POST, path: "/v1/rigging-plans/{id}/submit", description: "Submit a DRAFT rigging plan for review", roles: [SiteSupervisor], code: 200, input: [], output: RiggingPlan, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/v1/rigging-plans/{id}/review", description: "Review a SUBMITTED rigging plan; APPROVED requires accepted site survey and passing weight check; approval pins id+revision onto the project", roles: [ProjectManager], code: 200, input: [outcome, "reviewer_note?"], output: RiggingPlan, side_effects: ["status -> APPROVED or REJECTED", "on APPROVED: Project.approved_rigging_plan_id/revision pinned", "on APPROVED: increments Project.version by 1"] }
  - { method: POST, path: "/v1/rigging-plans/{id}/revise", description: "Return a REJECTED rigging plan to DRAFT, optionally replacing planning values", roles: [SiteSupervisor], code: 200, input: ["lift_weight_tons?", "planned_crane_capacity_tons?", "crane_model?", "rigging_config?"], output: RiggingPlan, side_effects: ["status -> DRAFT", "weight_check_passed recomputed if inputs changed"] }

  # --- LiftPermit ---
  - { method: POST, path: "/v1/lift-permits", description: "Book a crane lift window (crane_ref is a fleet-shared resource; half-open overlap check). Requires INSTALLING phase, CLEAR hold, and an approved rigging plan", roles: [SiteSupervisor], code: 201, input: [project_id, crane_ref, lift_starts_at, lift_ends_at, road_permit_required, "road_permit_number?"], output: LiftPermit, side_effects: ["status=ISSUED", "duration_hours computed"] }
  - { method: GET, path: "/v1/projects/{id}/lift-permits", description: "List lift permits for a project, optionally by crane_ref or status", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?", "crane_ref?", "status?"], output: "LiftPermit[]", side_effects: [] }
  - { method: POST, path: "/v1/lift-permits/{id}/execute", description: "Execute a lift inside its booked window; computes equipment charge and rolls it into the project", roles: [SiteSupervisor], code: 200, input: [], output: LiftPermit, side_effects: ["status -> EXECUTED", "equipment_charge_cents computed", "Project.approved_equipment_cents += equipment_charge_cents", "increments Project.version by 1"] }
  - { method: POST, path: "/v1/lift-permits/{id}/cancel", description: "Cancel an ISSUED lift permit, releasing the crane booking", roles: [SiteSupervisor], code: 200, input: [], output: LiftPermit, side_effects: ["status -> CANCELLED", "crane_window_commitment released"] }

  # --- AlignmentRecord ---
  - { method: POST, path: "/v1/alignment-records", description: "Record a precision laser alignment measurement; verdict computed against the tolerance class", roles: [SiteSupervisor], code: 201, input: [project_id, measurement_point, tolerance_class, measured_offset_mils, measured_angular_mils_per_in], output: AlignmentRecord, side_effects: ["status=RECORDED", "offset_passed, angular_passed, verdict computed"] }
  - { method: GET, path: "/v1/projects/{id}/alignment-records", description: "List alignment records for a project", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?", "measurement_point?"], output: "AlignmentRecord[]", side_effects: [] }
  - { method: POST, path: "/v1/alignment-records/{id}/review", description: "Accept or reject a RECORDED alignment record", roles: [ProjectManager], code: 200, input: [outcome, "reviewer_note?"], output: AlignmentRecord, side_effects: ["status -> ACCEPTED or REJECTED"] }

  # --- CommissioningChecklist ---
  - { method: POST, path: "/v1/commissioning-checklists", description: "Create the commissioning checklist (at most one non-terminal per project); requires INSTALLING or COMMISSIONING phase", roles: [ProjectManager], code: 201, input: [project_id, items], output: CommissioningChecklist, side_effects: ["status=IN_PROGRESS", "required_count/checked_required_count computed"] }
  - { method: GET, path: "/v1/projects/{id}/commissioning-checklists", description: "List commissioning checklists for a project", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "CommissioningChecklist[]", side_effects: [] }
  - { method: POST, path: "/v1/commissioning-checklists/{id}/check-item", description: "Mark one checklist item checked (records checking user and time)", roles: [SiteSupervisor], code: 200, input: [item_key], output: CommissioningChecklist, side_effects: ["items[item_key].checked=true", "checked_required_count recomputed"] }
  - { method: POST, path: "/v1/commissioning-checklists/{id}/submit", description: "Submit the completed checklist; requires all required items checked, the alignment gate, and COMMISSIONING phase", roles: [ProjectManager], code: 200, input: [], output: CommissioningChecklist, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/v1/commissioning-checklists/{id}/sign-off", description: "Customer representative signs off a SUBMITTED checklist", roles: [CustomerRep], code: 200, input: ["signoff_note?"], output: CommissioningChecklist, side_effects: ["status -> SIGNED_OFF", "signed_off_by_user_id recorded", "increments Project.version by 1"] }

  # --- LaborEntry ---
  - { method: POST, path: "/v1/labor-entries", description: "Create a labor entry; labor_cost computed and frozen at creation per Project.ot_basis", roles: [SiteSupervisor], code: 201, input: [project_id, worker_ref, classification, work_date, hours_worked, shift], output: LaborEntry, side_effects: ["status=DRAFT", "regular_hours, overtime_hours, base_rate_cents, total_cost_cents computed"] }
  - { method: GET, path: "/v1/projects/{id}/labor-entries", description: "List labor entries for a project, optionally by status or worker", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?", "status?", "worker_ref?"], output: "LaborEntry[]", side_effects: [] }
  - { method: POST, path: "/v1/labor-entries/{id}/submit", description: "Submit a DRAFT or REJECTED labor entry for payroll approval", roles: [SiteSupervisor], code: 200, input: [], output: LaborEntry, side_effects: ["status -> SUBMITTED", "submitted_by_user_id recorded"] }
  - { method: POST, path: "/v1/labor-entries/{id}/approve", description: "Approve a SUBMITTED labor entry; approver must differ from submitter (segregation of duties)", roles: [PayrollClerk], code: 200, input: [], output: LaborEntry, side_effects: ["status -> APPROVED", "Project.approved_labor_cents += total_cost_cents", "increments Project.version by 1"] }
  - { method: POST, path: "/v1/labor-entries/{id}/reject", description: "Reject a SUBMITTED entry, or reverse an APPROVED entry not yet invoiced (compensates the project labor rollup)", roles: [PayrollClerk], code: 200, input: [reason], output: LaborEntry, side_effects: ["status -> REJECTED", "if was APPROVED: Project.approved_labor_cents -= total_cost_cents", "rejection_reason recorded"] }

  # --- Invoice ---
  - { method: POST, path: "/v1/invoices", description: "Create an invoice; invoice_amount variant selected by Project.billing_mode. PROGRESS needs MOBILIZED/INSTALLING/COMMISSIONING; FINAL needs COMPLETED and releases all withheld retainage", roles: [ProjectManager], code: 201, input: [project_id, kind, period_start, period_end, "progress_pct?"], output: Invoice, side_effects: ["gross_cents, retainage_cents, retainage_released_cents, amount_cents computed", "TM: included LaborEntry rows -> INVOICED", "Project.invoiced_cents += amount_cents"] }
  - { method: GET, path: "/v1/projects/{id}/invoices", description: "List invoices for a project", roles: [ProjectManager, SiteSupervisor, SafetyOfficer, PayrollClerk, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "Invoice[]", side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Side effects: LockoutWindow SCHEDULED -> ACTIVE when starts_at <= now < ends_at and -> EXPIRED when now >= ends_at; LiftPermit ISSUED -> EXPIRED when now >= lift_ends_at", roles: [ProjectManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["auto state transitions for lockout windows and lift permits"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is not permitted to call this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, invalid enum member, or range/format violation (includes conditional requirements: progress_pct on LUMP_SUM, road_permit_number when required)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body resource id does not exist (including unknown checklist item_key)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match current Project.version on rigging plan creation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity or project phase is not in a valid from-state for the requested transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "LaborEntry approver X-User-ID equals submitted_by_user_id" }
  - { id: ERR_SAFETY_HOLD, http: 409, condition: "Project.hold_status == SAFETY_HOLD blocks the operation" }
  - { id: ERR_SAFETY_PLAN_NOT_ACTIVE, http: 409, condition: "No SafetyPlan in ACTIVE status for the project" }
  - { id: ERR_SITE_SURVEY_NOT_ACCEPTED, http: 409, condition: "No ACCEPTED SiteSurvey exists for the project" }
  - { id: ERR_RIGGING_PLAN_NOT_APPROVED, http: 409, condition: "No rigging plan currently APPROVED/pinned for the project" }
  - { id: ERR_NO_EXECUTED_LIFT, http: 409, condition: "No LiftPermit in EXECUTED status for the project" }
  - { id: ERR_LOCKOUTS_OUTSTANDING, http: 409, condition: "Lockout windows remain in SCHEDULED or ACTIVE status (or ACTIVE for safety-plan close)" }
  - { id: ERR_ALIGNMENT_OUTSTANDING, http: 409, condition: "Alignment gate unmet: no ACCEPTED record with verdict PASS, or RECORDED records still pending review" }
  - { id: ERR_CHECKLIST_NOT_SIGNED_OFF, http: 409, condition: "No CommissioningChecklist in SIGNED_OFF status for the project" }
  - { id: ERR_SAFETY_PLAN_EXISTS, http: 409, condition: "A SafetyPlan already exists for the project" }
  - { id: ERR_CHECKLIST_EXISTS, http: 409, condition: "A non-terminal CommissioningChecklist already exists for the project" }
  - { id: ERR_ANCHOR_OUT_OF_TOLERANCE, http: 409, condition: "anchor_measured_max_deviation_mm exceeds anchor_tolerance_mm on survey acceptance" }
  - { id: ERR_FOUNDATION_NOT_CURED, http: 409, condition: "Foundation poured fewer than MIN_CURE_DAYS (7) days ago at review time" }
  - { id: ERR_LIFT_WEIGHT_EXCEEDED, http: 409, condition: "lift_weight_tons exceeds planned_crane_capacity_tons on rigging plan approval" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 422, condition: "Not all required checklist items are checked at submit" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Window end is not strictly after window start" }
  - { id: ERR_LOCKOUT_CONFLICT, http: 409, condition: "New lockout window violates the 30-minute clearance buffer against an existing SCHEDULED/ACTIVE window on the same feeder" }
  - { id: ERR_CRANE_WINDOW_CONFLICT, http: 409, condition: "New lift window overlaps an existing ISSUED window on the same crane_ref (half-open; adjacency allowed)" }
  - { id: ERR_OUTSIDE_LIFT_WINDOW, http: 409, condition: "Execution attempted outside [lift_starts_at, lift_ends_at)" }
  - { id: ERR_NTE_EXCEEDED, http: 409, condition: "TM invoice would push cumulative gross past the contract NTE cap" }
  - { id: ERR_FINAL_INVOICE_EXISTS, http: 409, condition: "A FINAL invoice already exists for the project" }
  - { id: ERR_NO_BILLABLE_WORK, http: 409, condition: "PROGRESS invoice has zero billable content (gross_cents would be <= 0)" }
  - { id: ERR_RIGGING_PLAN_OPEN_EXISTS, http: 409, condition: "A RiggingPlan in DRAFT or SUBMITTED already exists for the project" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Contractor project manager; owns project lifecycle, reviews, invoicing, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/projects"
      - "POST /v1/projects/{id}/advance"
      - "POST /v1/site-surveys/{id}/review"
      - "POST /v1/rigging-plans/{id}/review"
      - "POST /v1/alignment-records/{id}/review"
      - "POST /v1/commissioning-checklists"
      - "POST /v1/commissioning-checklists/{id}/submit"
      - "POST /v1/invoices"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: SiteSupervisor
    description: "Union field superintendent; records surveys, rigging plans, lifts, alignments, labor, and checklist items"
    identity: opaque
    exclusive_operations:
      - "POST /v1/site-surveys, POST /v1/site-surveys/{id}/submit"
      - "POST /v1/rigging-plans, POST /v1/rigging-plans/{id}/submit, POST /v1/rigging-plans/{id}/revise"
      - "POST /v1/lift-permits, POST /v1/lift-permits/{id}/execute, POST /v1/lift-permits/{id}/cancel"
      - "POST /v1/alignment-records"
      - "POST /v1/commissioning-checklists/{id}/check-item"
      - "POST /v1/labor-entries, POST /v1/labor-entries/{id}/submit"
    shared_operations:
      - "All GET endpoints"
  - name: SafetyOfficer
    description: "Safety officer; owns the safety plan lifecycle and lockout-tagout windows"
    identity: opaque
    exclusive_operations:
      - "POST /v1/safety-plans, POST /v1/safety-plans/{id}/activate, POST /v1/safety-plans/{id}/suspend, POST /v1/safety-plans/{id}/resume, POST /v1/safety-plans/{id}/close"
      - "POST /v1/lockout-windows, POST /v1/lockout-windows/{id}/cancel, POST /v1/lockout-windows/{id}/release"
    shared_operations:
      - "All GET endpoints"
  - name: PayrollClerk
    description: "Payroll clerk; approves or rejects submitted labor (segregated from the submitting supervisor)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/labor-entries/{id}/approve"
      - "POST /v1/labor-entries/{id}/reject"
    shared_operations:
      - "All GET endpoints"
  - name: CustomerRep
    description: "Customer representative; sole authority for commissioning sign-off"
    identity: opaque
    exclusive_operations:
      - "POST /v1/commissioning-checklists/{id}/sign-off"
    shared_operations:
      - "All GET endpoints"
