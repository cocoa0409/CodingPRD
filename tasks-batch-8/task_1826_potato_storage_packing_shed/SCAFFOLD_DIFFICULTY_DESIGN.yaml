            - { call: "POST /potato-shed/pack-orders/${o2_id}/pack-runs", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: PackLineSupervisor, captures: { r2_status: "$.data.status" } }
            - { call: "POST /potato-shed/pack-orders/${o3_id}/pack-runs", payload: { scheduled_start: "2026-08-10T10:30:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: PackLineSupervisor, captures: { r3_err: "$.data.error_id" } }
            - { call: "POST /potato-shed/pack-orders/${o3_id}/pack-runs", payload: { scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: PackLineSupervisor, captures: { r4_status: "$.data.status" } }
          assert:
            - "r1_status == SCHEDULED and r2_status == SCHEDULED (same variety, half-open adjacency: 10:00 start after 10:00 end, no buffer)"
            - "r3_err == ERR_LINE_SCHEDULE_CONFLICT (YUKON_GOLD at 10:30 violates the 1-hour sanitation buffer after R1 10:00 end and R2 11:00 end)"
            - "r4_status == SCHEDULED (12:00 start is exactly buffer_end of R2's 11:00 end + 1h: boundary allowed)"

      - name: inhibitor_effective_window_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_RETREAT_WINDOW_VIOLATION]
          - entities.FieldLot.fields.last_inhibitor_applied_at
        distinguishing_aspect: |
          Resource: the FieldLot itself. Interval semantics: strict half-open effective window
          [applied_at, applied_at + 21 days) with NO buffer — an application 7 days in falls inside
          the previous window and conflicts, while one landing exactly on the window end is allowed.
          Different resource and different semantics (no buffer) than the pack-line rule.
        test_recipe:
          setup:
            - "Binned lot with first inhibitor application at 2026-08-03T00:00:00Z (window covers [08-03, 08-24))"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Seventeen", grower_code: "G-17" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed Q" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${l_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-03T00:00:00Z" }, as: StorageManager }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-10T00:00:00Z" }, as: StorageManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-24T00:00:00Z" }, as: StorageManager, captures: { count: "$.data.inhibitor_application_count" } }
          assert:
            - "application at 2026-08-10 (7 days in, strictly inside [08-03, 08-24)) rejected: err == ERR_RETREAT_WINDOW_VIOLATION"
            - "application at 2026-08-24 (exactly the window end, half-open) succeeds: count == 2"
            - "failed middle attempt left inhibitor_application_count at 1 until the boundary application"

  - rule_id: compensating_invariant
    instances:
      - name: contract_commitment_conservation
        grounds:
          - state_machines.PackOrder.REQUESTED_to_ALLOCATED
          - state_machines.PackOrder.ALLOCATED_to_CANCELLED
          - entities.CustomerContract.fields.remaining_committed_cwt
          - entities.CustomerContract.fields.allocated_active_cwt
        distinguishing_aspect: |
          Conserved quantity: contract commitment. Invariant committed_volume_cwt ==
          remaining_committed_cwt + allocated_active_cwt + packed_to_date_cwt holds after the
          forward action (allocate: 500 == 200 + 300 + 0) and is restored exactly by the
          compensating action (cancel: 500 == 500 + 0 + 0) — zero drift.
        test_recipe:
          setup:
            - "Lot 1000.00 RUSSET_BURBANK assessed 70/20/10 (f 0.9); contract committed 500.00 @ 2000"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Eighteen", grower_code: "G-18" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed R" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 1000.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer N", variety: "RUSSET_BURBANK", committed_volume_cwt: 500.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 80.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 80.0, requested_packed_cwt: 300.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
            - { call: "GET /potato-shed/contracts/${c_id}", payload: {}, as: SalesManager, captures: { rem1: "$.data.remaining_committed_cwt", act1: "$.data.allocated_active_cwt", pkd1: "$.data.packed_to_date_cwt" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/cancel", payload: {}, as: SalesManager, captures: { o_status: "$.data.status" } }
            - { call: "GET /potato-shed/contracts/${c_id}", payload: {}, as: SalesManager, captures: { rem2: "$.data.remaining_committed_cwt", act2: "$.data.allocated_active_cwt", pkd2: "$.data.packed_to_date_cwt" } }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { l_res: "$.data.reserved_cwt" } }
          assert:
            - "after allocate: rem1 == 200.00, act1 == 300.00, pkd1 == 0 (500 == 200 + 300 + 0)"
            - "after cancel: o_status == CANCELLED and rem2 == 500.00, act2 == 0, pkd2 == 0 (500 == 500 + 0 + 0, restored exactly)"
            - "l_res == 0 (reservation release matched the allocation to the cent)"

      - name: lot_weight_conservation
        grounds:
          - calculations.shrink_reconciliation
          - state_machines.PackRun.SCHEDULED_to_ABORTED
          - state_machines.PackRun.SCHEDULED_to_COMPLETED
          - entities.FieldLot.fields.available_cwt
        distinguishing_aspect: |
          Conserved quantity: physical lot weight. original == available + packed + cull +
          condemned + shrink holds across run create + ABORT (no drift: 1000 == 980 + 0 + 0 + 0 + 20)
          and across the subsequent COMPLETED close (1000 == 757.78 + 200 + 22.22 + 0 + 20).
          Different conserved quantity than the contract commitment invariant.
        test_recipe:
          setup:
            - "Lot 1000.00 RUSSET_BURBANK assessed 70/20/10 with cumulative shrink 20.00 (available 980.00); contract committed 500.00 @ 2000; order requested 200.00 allocated (raw reservation 222.22); fresh PASS wash check; run created"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Nineteen", grower_code: "G-19" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed S" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 1000.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 20.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer O", variety: "RUSSET_BURBANK", committed_volume_cwt: 500.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 80.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 80.0, requested_packed_cwt: 200.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-02T06:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: PackLineSupervisor, captures: { r1_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-runs/${r1_id}/close", payload: { outcome: "ABORTED" }, as: PackLineSupervisor, captures: { r1_status: "$.data.status" } }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { avail1: "$.data.available_cwt", res1: "$.data.reserved_cwt", packed1: "$.data.packed_total_cwt" } }
            - { call: "GET /potato-shed/pack-orders/${o_id}", payload: {}, as: SalesManager, captures: { o_status: "$.data.status" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: PackLineSupervisor, captures: { r2_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-runs/${r2_id}/close", payload: { outcome: "COMPLETED", draws: [ { field_lot_id: "${l_id}", raw_drawn_cwt: 222.22, packed_cwt: 200.00, us1_cwt: 170.00, us2_cwt: 30.00, cull_cwt: 22.22, cull_channel: "PROCESSING" } ] }, as: PackLineSupervisor }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { avail2: "$.data.available_cwt", res2: "$.data.reserved_cwt", packed2: "$.data.packed_total_cwt", cull2: "$.data.cull_total_cwt", credit2: "$.data.processing_credit_cwt" } }
          assert:
            - "r1_status == ABORTED and o_status == ALLOCATED (compensation returns the order)"
            - "after abort: avail1 == 980.00, res1 == 222.22, packed1 == 0 (1000 == 980 + 0 + 0 + 0 + 20: create+abort leaves the weight ledger untouched)"
            - "after completion: avail2 == 757.78, res2 == 0, packed2 == 200.00, cull2 == 22.22 (1000 == 757.78 + 200 + 22.22 + 0 + 20)"
            - "credit2 == 22.22 (PROCESSING channel cull accrues grower credit weight)"
