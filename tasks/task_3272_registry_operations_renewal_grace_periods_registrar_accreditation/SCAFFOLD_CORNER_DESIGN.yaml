        distinguishing_aspect: "A third registrar (not the from_registrar) attempting to ack gets 403 ERR_NOT_TRANSFER_PARTY — party membership is checked before the auth code."
        test_recipe:
          setup:
            - "Clock 2026-01-01, schedule effective, registrars A, B, C ACTIVE, domain by A at 2026-01-02, clock 2026-03-10, transfer A->B REQUESTED."
