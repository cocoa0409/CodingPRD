              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { error_id: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { control_error_id: $.data.error_id }
          assert:
            - "before trigger 1: QuarterlyReport.${q2_id}.monitor_data_availability_pct == 75.0 and MonitoringSystem.${cem_id}.qa_status == OUT_OF_CONTROL"
            - "before trigger 1: QuarterlyReport.${q2_id}.measured_hour_count == 15 and QuarterlyReport.${q2_id}.operating_hour_count == 20"
            - "before trigger 1: QuarterlyReport.${q2_id}.total_so2_lbs == 4383.0 and QuarterlyReport.${q2_id}.total_heat_input_mmbtu == 11111.120"
            - "trigger 1 returns HTTP 409 with error_id == ERR_MONITOR_OUT_OF_CONTROL (priority 240 wins over both 245 and 345)"
            - "trigger 1 leaves QuarterlyReport.${q2_id}.status == DRAFT"
            - "after trigger 2: MonitoringSystem.${cem_id}.qa_status == CERTIFIED and cal_status == CAL_CURRENT"
            - "trigger 3 returns HTTP 422 with error_id == ERR_DATA_AVAILABILITY_BELOW_FLOOR (75.0 < 80.0)"
            - "trigger 3 leaves QuarterlyReport.${q2_id}.status == DRAFT and creates no ComplianceCertification"
            - "the two triggers differ only in the monitor's qa_status, so the 345 rule was reached only after 240 stopped firing"

      - name: priority_segregation_of_duties_beats_stale_report_version
        grounds:
          - validations[priority=40]
          - validations[priority=200]
          - concurrency_rules[certification-stale-report]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_STALE_REPORT_VERSION]
          - endpoints[POST /emissions/quarterly-reports/{id}/certifications]
          - roles.DesignatedRepresentative
        distinguishing_aspect: |
          Pairs the SEGREGATION-OF-DUTIES authorization category (priority 40)
          against the CONCURRENCY category (priority 200) — the reverse ranking
          of the stale-version instance, because here the identity check sits
          ABOVE the version check: the submitter re-certifying with a stale
          version gets 409 ERR_SEGREGATION_OF_DUTIES, never 412.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED, CAL_CURRENT SO2 CEM"
            - "a 2026 Q2 report carrying three identical MEASURED CEMS hours, validated and then submitted by X-User-ID dual_1"
            - "the version captured right after VALIDATED is therefore stale once the submit bumps it"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "dual_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "dual_1"
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "dual_1"
              captures: { v_stale: $.data.version }
            - call: "POST /emissions/quarterly-reports/${q2_id}/submit"
              payload: { submission_format: "XML_ECMPS" }
              as: EmissionsReportPreparer
              as_user_id: "dual_1"
              captures: { v_fresh: $.data.version }
          trigger:
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${v_stale}", statement_text: "I certify under penalty of law that the submitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dual_1"
              captures: { error_id: $.data.error_id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${v_stale}", statement_text: "I certify under penalty of law that the submitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { control_error_id: $.data.error_id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${v_fresh}", statement_text: "I certify under penalty of law that the submitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dual_1"
              captures: { sod_only_error_id: $.data.error_id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${v_fresh}", statement_text: "I certify under penalty of law that the submitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { cert_id: $.data.id }
          assert:
            - "before the triggers: QuarterlyReport.${q2_id}.status == SUBMITTED and QuarterlyReport.${q2_id}.submitted_by_user_id == dual_1"
            - "trigger 1 returns HTTP 409 with error_id == ERR_SEGREGATION_OF_DUTIES (priority 40 wins over priority 200)"
            - "trigger 1 creates no ComplianceCertification and leaves Unit.${unit_id}.certified_so2_lbs_ytd == 0.0"
            - "trigger 2, identical except that the certifier is dr_1, returns HTTP 412 with error_id == ERR_STALE_REPORT_VERSION"
            - "trigger 3, with a fresh version but the submitter's own id, returns HTTP 409 with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "trigger 4 returns HTTP 201 with ComplianceCertification.${cert_id}.certifier_user_id == dr_1"
            - "after trigger 4: QuarterlyReport.${q2_id}.status == CERTIFIED, ComplianceCertification.${cert_id}.certified_so2_lbs_snapshot == 876.6 and Unit.${unit_id}.certified_so2_lbs_ytd == 876.6"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: boundary_calibration_span_error_exactly_at_spec_passes
        grounds:
          - calculations.daily_calibration_error
          - entities.DailyCalibration.fields.span_error_pct_of_span
          - entities.DailyCalibration.fields.zero_error_pct_of_span
          - entities.DailyCalibration.fields.result
          - endpoints[POST /emissions/monitoring-systems/{id}/daily-calibrations]
        distinguishing_aspect: |
          Boundary on the CALIBRATION-ERROR metric (percent of span, 2 decimals,
          round_half_up) at the daily-calibrations endpoint: 2.50 == spec passes,
          5.00 == 2 x spec is only FAILED, and 5.03 is the first value that trips
          OUT_OF_CONTROL on a single calibration.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "one SO2 CEM, span_value 400.0, calibration_error_spec_pct 2.5, never certified (so no cascade can fire)"
            - "span_reference_value is 360.0 on every calibration, so span error = |measured - 360| / 400 * 100"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 370.0 }
              as: QAAnalyst
              captures: { c1_id: $.data.id, v2: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v2}", calibration_utc: "2026-04-01T01:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 380.0 }
              as: QAAnalyst
              captures: { c2_id: $.data.id, v3: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v3}", calibration_utc: "2026-04-01T02:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { c3_id: $.data.id, v4: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v4}", calibration_utc: "2026-04-01T03:00:00Z", zero_reference_value: 0.0, zero_measured_value: 12.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { c4_id: $.data.id, v5: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v5}", calibration_utc: "2026-04-01T04:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { c5_id: $.data.id, v6: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${v6}", calibration_utc: "2026-04-01T05:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 380.1 }
              as: QAAnalyst
              captures: { c6_id: $.data.id }
          assert:
            - "DailyCalibration.${c1_id}.span_error_pct_of_span == 2.50 and DailyCalibration.${c1_id}.zero_error_pct_of_span == 0.00"
            - "DailyCalibration.${c1_id}.result == PASSED  # exactly at spec passes, the comparison is strictly greater-than"
            - "after trigger 1: MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT and consecutive_failed_calibrations == 0"
            - "DailyCalibration.${c2_id}.span_error_pct_of_span == 5.00 and DailyCalibration.${c2_id}.result == FAILED  # exactly 2 x spec is NOT out of control"
            - "after trigger 2: MonitoringSystem.${cem_id}.cal_status == CAL_FAILED and consecutive_failed_calibrations == 1"
            - "DailyCalibration.${c3_id}.span_error_pct_of_span == 2.00 and DailyCalibration.${c3_id}.result == PASSED"
            - "after trigger 3: MonitoringSystem.${cem_id}.consecutive_failed_calibrations == 0"
            - "DailyCalibration.${c4_id}.zero_error_pct_of_span == 3.00 and DailyCalibration.${c4_id}.span_error_pct_of_span == 2.00"
            - "DailyCalibration.${c4_id}.result == FAILED  # the worst of the two errors decides, so the zero drift governs"
            - "DailyCalibration.${c5_id}.result == PASSED and MonitoringSystem.${cem_id}.consecutive_failed_calibrations == 0"
            - "DailyCalibration.${c6_id}.span_error_pct_of_span == 5.03 and DailyCalibration.${c6_id}.result == OUT_OF_CONTROL_TRIGGERED"
            - "after trigger 6: MonitoringSystem.${cem_id}.cal_status == CAL_FAILED and qa_status == RECERTIFICATION_PENDING  # was never CERTIFIED, so no cascade"
            - "GET /emissions/daily-calibrations?monitoring_system_id=${cem_id}&result=PASSED returns exactly 3 rows"

      - name: boundary_relative_accuracy_exactly_ten_percent_passes
        grounds:
          - calculations.relative_accuracy_and_bias
          - entities.RataTest.fields.relative_accuracy_pct
          - entities.RataTest.fields.standard_deviation
          - entities.RataTest.fields.bias_adjustment_factor
          - endpoints[POST /emissions/rata-tests/{id}/evaluate]
        distinguishing_aspect: |
          Boundary on a DIFFERENT metric at a DIFFERENT endpoint — the
          relative-accuracy percentage (1 decimal) at the RATA evaluate
          endpoint: 10.0 exactly at RA_PASS_THRESHOLD_PCT passes while 10.7
          fails, and the 6-decimal standard deviation shows the intermediate
          precision is not truncated to the reported 1 decimal.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 ONLINE, with one NOX_RATE CEM (span 0.800)"
            - "two non-overlapping SCHEDULED RataTests on that monitor: rt_pass [2026-04-03, 2026-04-04) and rt_fail [2026-04-04, 2026-04-05)"
            - "rt_pass carries SET A (cems_mean 0.2481); rt_fail carries SET B (cems_mean 0.2456); both share reference_mean 0.2700"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "SCR" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "NOX_RATE", system_type: "CEM", span_value: 0.800, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { nox_sys_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${nox_sys_id}/rata-tests"
              payload: { window_start_utc: "2026-04-03T00:00:00Z", window_end_utc: "2026-04-04T00:00:00Z" }
              as: QAAnalyst
              captures: { rt_pass_id: $.data.id }
            - call: "POST /emissions/monitoring-systems/${nox_sys_id}/rata-tests"
              payload: { window_start_utc: "2026-04-04T00:00:00Z", window_end_utc: "2026-04-05T00:00:00Z" }
              as: QAAnalyst
              captures: { rt_fail_id: $.data.id }
            - call: "POST /emissions/rata-tests/${rt_pass_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.248 }, { reference_value: 0.266, cems_value: 0.240 }, { reference_value: 0.268, cems_value: 0.234 }, { reference_value: 0.270, cems_value: 0.252 }, { reference_value: 0.270, cems_value: 0.256 }, { reference_value: 0.272, cems_value: 0.252 }, { reference_value: 0.274, cems_value: 0.240 }, { reference_value: 0.274, cems_value: 0.260 }, { reference_value: 0.274, cems_value: 0.251 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_fail_id}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.246 }, { reference_value: 0.266, cems_value: 0.236 }, { reference_value: 0.268, cems_value: 0.244 }, { reference_value: 0.270, cems_value: 0.258 }, { reference_value: 0.270, cems_value: 0.238 }, { reference_value: 0.272, cems_value: 0.248 }, { reference_value: 0.274, cems_value: 0.254 }, { reference_value: 0.274, cems_value: 0.246 }, { reference_value: 0.274, cems_value: 0.240 }] }
              as: QAAnalyst
          trigger:
            - call: "POST /emissions/rata-tests/${rt_pass_id}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rt_fail_id}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
          assert:
            - "RataTest.${rt_pass_id}.reference_mean == 0.2700 and RataTest.${rt_pass_id}.cems_mean == 0.2481"
            - "RataTest.${rt_pass_id}.mean_difference == 0.0219 and RataTest.${rt_pass_id}.standard_deviation == 0.008038"
            - "RataTest.${rt_pass_id}.confidence_coefficient == 0.0050  # T_VALUE[9] == 1.860"
            - "RataTest.${rt_pass_id}.relative_accuracy_pct == 10.0"
            - "RataTest.${rt_pass_id}.status == PASSED  # exactly at RA_PASS_THRESHOLD_PCT 10.0 passes"
            - "RataTest.${rt_pass_id}.bias_test_failed == true and RataTest.${rt_pass_id}.bias_adjustment_factor == 1.0883"
            - "RataTest.${rt_fail_id}.cems_mean == 0.2456 and RataTest.${rt_fail_id}.standard_deviation == 0.007401"
            - "RataTest.${rt_fail_id}.mean_difference == 0.0244 and RataTest.${rt_fail_id}.confidence_coefficient == 0.0046"
            - "RataTest.${rt_fail_id}.relative_accuracy_pct == 10.7 and RataTest.${rt_fail_id}.status == FAILED"
            - "the 0.7 percentage-point gap comes from a 0.0025 shift in cems_mean, so the reported value keeps 1 decimal while the internals keep 6"
            - "MonitoringSystem.${nox_sys_id}.bias_adjustment_factor == 1.0  # never certified, so no BAF was adopted"

      - name: boundary_data_availability_exactly_at_floor_validates
        grounds:
          - calculations.monitor_data_availability_pct
          - validations[priority=345]
          - state_machines.QuarterlyReport.DRAFT_to_VALIDATED
          - endpoints[POST /emissions/quarterly-reports/{id}/validate]
          - entities.QuarterlyReport.fields.monitor_data_availability_pct
        distinguishing_aspect: |
          Boundary on the AVAILABILITY metric (1 decimal) at the report-validate
          endpoint: 16 of 20 measured hours is exactly 80.0 and validates, while
          15 of 20 is 75.0 and is refused — the same report row crossing the
          floor in one direction only.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED, CAL_CURRENT SO2 CEM"
            - "a DRAFT 2026 Q2 report carrying 20 identical MEASURED CEMS hours from 00:00 through 19:00"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
