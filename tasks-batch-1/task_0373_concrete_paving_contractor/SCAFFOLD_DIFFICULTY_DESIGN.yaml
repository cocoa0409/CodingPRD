            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { pv0: $.data.version }
            - call: "POST /projects/${proj_id}/approve-estimate"
              payload: { estimate_id: "${est_id}", expected_project_version: "${pv0}" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/permits"
