            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 1 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent B", license_number: "LIC-B", max_active_leads: 5 }, as: TeamAdmin, captures: { b: $.data.id } }
            - { call: "POST /crm/agents/${b}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead One", contact_phone: "+15125550072", contact_email: "l1@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead1: $.data.id } }
            - { call: "POST /crm/leads/${lead1}/route", payload: {}, as: TeamAdmin, captures: { asg1_agent: $.data.agent_id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead Two", contact_phone: "+15125550073", contact_email: "l2@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead2: $.data.id } }
          trigger:
            - { call: "POST /crm/leads/${lead2}/route", payload: {}, as: TeamAdmin, captures: { asg2_agent: $.data.agent_id } }
          assert:
            - "asg1_agent == ${a} (round-robin first-created with both pools empty)"
            - "asg2_agent == ${b}: A is excluded at exactly active_lead_count == max_active_leads (1 == 1); the comparison is strict-less-than eligibility (count < max)"
            - "Agent.${a}.active_lead_count == 1 and Lead.${lead2}.status == OFFERED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: lead_route_blocked_when_all_agents_paused
        grounds:
          - state_machines.Lead.NEW_to_OFFERED
          - state_machines.Agent.ACTIVE_to_PAUSED
          - errors[ERR_NO_ELIGIBLE_AGENT]
        distinguishing_aspect: |
          Entity pair Lead -> Agent: the Lead NEW -> OFFERED transition is gated
          on the state of a different entity (at least one ACTIVE, under-capacity
          Agent). With the only agent PAUSED the route fails; resuming the agent
          (Agent state change) unblocks the same lead.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; SPHERE source auto_route false; agent A ACTIVE then PAUSED"
            - "Lead pooled in NEW (no auto-route because auto_route false)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 100000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 5 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents/${a}/pause", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Pooled", contact_phone: "+15125550080", contact_email: "p@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
          trigger:
            - { call: "POST /crm/leads/${lead}/route", payload: {}, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /crm/agents/${a}/resume", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead}/route", payload: {}, as: TeamAdmin, captures: { asg_agent: $.data.agent_id } }
          assert:
            - "First route: err == ERR_NO_ELIGIBLE_AGENT (Lead transition blocked by every Agent being non-ACTIVE)"
            - "Lead.${lead}.status remains NEW after the failed route"
            - "After resume, the identical route succeeds: asg_agent == ${a} and Lead.${lead}.status == OFFERED"

      - name: enrollment_blocked_when_campaign_not_active
        grounds:
          - state_machines.NurtureEnrollment
          - state_machines.NurtureCampaign.ACTIVE_to_PAUSED
          - errors[ERR_CAMPAIGN_NOT_ACTIVE]
        distinguishing_aspect: |
          Different entity pair from the sibling instance (NurtureEnrollment ->
          NurtureCampaign, not Lead -> Agent): enrollment creation is gated on
          the campaign's state, and the check fires even when the lead side is
          fully valid (temperature matches).
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; PORTAL source auto_route true; ACTIVE agent C"
            - "Lead CLAIMED by C, temperature COLD"
            - "Campaign targeting COLD created then ACTIVATED then PAUSED"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/nurture-campaigns", payload: { team_id: "${t}", name: "Cold Drip", temperature_target: "COLD", steps: [{ offset_days: 1, channel: "EMAIL" }] }, as: TeamAdmin, captures: { camp: $.data.id } }
            - { call: "POST /crm/nurture-campaigns/${camp}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/nurture-campaigns/${camp}/pause", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550081", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
          trigger:
            - { call: "POST /crm/nurture-enrollments", payload: { campaign_id: "${camp}", lead_id: "${lead}" }, as: TeamLeader, as_user_id: "${l}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CAMPAIGN_NOT_ACTIVE — the referenced campaign's PAUSED state blocks enrollment even though Lead.${lead}.temperature == COLD equals the target"

  - rule_id: resource_temporal_overlap
    instances:
      - name: split_agreement_half_open_adjacency_allowed
        grounds:
          - validations[priority=7]
          - entities.SplitAgreement.fields.effective_until
          - errors[ERR_SPLIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_until) on the
          agent-pair resource — a new agreement starting exactly at the previous
          one's effective_until is adjacent and allowed, while a mid-window start
          conflicts. Sibling instance uses closed intervals on a different
          resource.
        test_recipe:
          setup:
            - "Team; ACTIVE agents A1 and A2"
            - "ACTIVE SplitAgreement G1 for (A1, A2) over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent One", license_number: "LIC-A1", max_active_leads: 10 }, as: TeamAdmin, captures: { a1: $.data.id } }
            - { call: "POST /crm/agents/${a1}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent Two", license_number: "LIC-A2", max_active_leads: 10 }, as: TeamAdmin, captures: { a2: $.data.id } }
            - { call: "POST /crm/agents/${a2}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a2}", a_share_bps: 5000, b_share_bps: 5000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-09-01T00:00:00Z" }, as: TeamAdmin, captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a2}", a_share_bps: 6000, b_share_bps: 4000, effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-10-01T00:00:00Z" }, as: TeamAdmin, captures: { g2: $.data.id } }
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a2}", a_share_bps: 5000, b_share_bps: 5000, effective_from: "2026-08-15T00:00:00Z" }, as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent agreement created successfully: SplitAgreement.${g2}.status == ACTIVE (new.from == G1.until is permitted under half-open semantics)"
            - "Overlapping agreement rejected: err == ERR_SPLIT_WINDOW_OVERLAP (2026-08-15 lies inside [2026-08-01, 2026-09-01))"
            - "Unordered pair: the overlap rule applies regardless of which agent is passed as agent_a_id vs agent_b_id"

      - name: time_off_closed_interval_touching_endpoints_conflict
        grounds:
          - validations[priority=7]
          - entities.AgentTimeOff.fields.ends_at
          - errors[ERR_TIME_OFF_OVERLAP]
        distinguishing_aspect: |
          Different resource (a single Agent, not an agent pair) AND different
          interval semantics: time-off blocks are CLOSED intervals, so a block
          starting exactly when another ends CONFLICTS (touching endpoints
          intersect) — the opposite of the split-agreement adjacency rule.
        test_recipe:
          setup:
            - "Team; ACTIVE agent A"
            - "Existing time-off block T1 = [2026-08-10T00:00:00Z, 2026-08-12T00:00:00Z] (closed)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 10 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents/${a}/time-offs", payload: { starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-12T00:00:00Z", reason: "conference" }, as: TeamAdmin, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /crm/agents/${a}/time-offs", payload: { starts_at: "2026-08-12T00:00:00Z", ends_at: "2026-08-14T00:00:00Z", reason: "touching" }, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /crm/agents/${a}/time-offs", payload: { starts_at: "2026-08-12T00:00:01Z", ends_at: "2026-08-14T00:00:00Z", reason: "one second later" }, as: TeamAdmin, captures: { t3: $.data.id } }
          assert:
            - "Touching block rejected: err == ERR_TIME_OFF_OVERLAP because closed intervals [10th, 12th 00:00:00] and [12th 00:00:00, 14th] share the instant 2026-08-12T00:00:00Z"
            - "One second later succeeds: AgentTimeOff.${t3} created (201) — the conflict boundary is exact to the second"

  - rule_id: compensating_invariant
    instances:
      - name: release_and_reroute_preserves_single_active_assignment
        grounds:
          - state_machines.Lead.CLAIMED_to_NEW
          - state_machines.Assignment
          - entities.Lead.fields.current_assignment_id
        distinguishing_aspect: |
          Conserved quantity: assignment cardinality — at every step of the
          claim -> release -> re-route cycle, a routed lead has EXACTLY ONE
          non-terminal Assignment, and the team's count of non-terminal
          assignments equals its count of leads in {OFFERED, CLAIMED, WORKING,
          UNDER_CONTRACT}. Release + re-route is the compensating pair.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; PORTAL source auto_route true; ACTIVE agents A (created first) and B"
            - "Lead auto-routed to A (OFFERED, one non-terminal assignment)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 10 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent B", license_number: "LIC-B", max_active_leads: 10 }, as: TeamAdmin, captures: { b: $.data.id } }
            - { call: "POST /crm/agents/${b}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550090", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${a}" }
          trigger:
            - { call: "POST /crm/leads/${lead}/release", payload: { reason: "agent reassigned by ops" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead}/route", payload: {}, as: TeamAdmin, captures: { asg2_agent: $.data.agent_id, asg2_sup: $.data.supersedes_assignment_id } }
          assert:
            - "After claim: exactly one non-terminal Assignment (CLAIMED) for ${lead}; after release: zero non-terminal and Lead NEW with current_assignment_id null; after re-route: exactly one non-terminal again (OFFERED)"
            - "GET /crm/assignments?lead_id=${lead} returns exactly 2 rows with statuses {RELEASED, OFFERED} — terminal history accumulates, active count never drifts"
            - "asg2_agent == ${b} (round-robin: B never assigned) and asg2_sup is null (release pools the lead; the supersedes chain is only for direct reassignment)"
            - "Agent.${a}.active_lead_count == 0 and Agent.${b}.active_lead_count == 1 — capacity ledger matches assignment cardinality exactly"

      - name: dispute_reapprove_preserves_money_conservation
        grounds:
          - calculations.commission_split
          - state_machines.Deal.APPROVED_to_DISPUTED
          - state_machines.Deal.DISPUTED_to_APPROVED
        distinguishing_aspect: |
          Different conserved quantity from the sibling instance: money cents.
          Across the forward action (approve with actual) and its compensating
          cycle (dispute -> re-approve with corrected actual), the identity
          referral_fee_cents + house_share_cents + sum(agent_shares) ==
          split_basis_cents holds at every observed step — no cent is created or
          destroyed.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; REFERRAL_PARTNER source cost 0, partner Pat fee_bps 2500; ACTIVE agent C; ONBOARDING LEADER L"
            - "Lead routed to C, claimed, WORKING; Deal created gross 1000000 (ESTIMATED: fee 250000, house 225000, pool 525000)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Pat Referrals", type: "REFERRAL_PARTNER", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/referral-partners", payload: { team_id: "${t}", name: "Pat", fee_bps: 2500 }, as: TeamAdmin, captures: { partner: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Closer C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550091", contact_email: "b@x.com", expected_close_price_cents: 50000000, referral_partner_id: "${partner}" }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead}", gross_commission_cents: 1000000 }, as: Agent, as_user_id: "${c}", captures: { deal: $.data.id } }
          trigger:
            - { call: "POST /crm/deals/${deal}/approve", payload: { actual_gross_commission_cents: 1100000 }, as: TeamLeader, as_user_id: "${l}" }
            - { call: "POST /crm/deals/${deal}/dispute", payload: { reason: "lender credit corrected" }, as: TeamAdmin }
            - { call: "POST /crm/deals/${deal}/approve", payload: { actual_gross_commission_cents: 900000 }, as: TeamLeader, as_user_id: "${l}" }
          assert:
            - "Estimated step: 250000 + 225000 + 525000 == 1000000 == split_basis_cents"
            - "After approve(actual 1100000): referral_fee_cents == 275000, house_share_cents == 247500, agent_pool_cents == 577500; 275000 + 247500 + 577500 == 1100000"
            - "After dispute: status DISPUTED, split fields unchanged (conservation frozen mid-dispute)"
            - "After re-approve(actual 900000): referral_fee_cents == 225000, house_share_cents == 202500, agent_pool_cents == 472500; 225000 + 202500 + 472500 == 900000 — the dispute/re-approve cycle leaves zero cent drift"
            - "agent_shares == [{agent_id: ${c}, amount_cents: 472500}] at the end (single closing agent, no agreement)"
