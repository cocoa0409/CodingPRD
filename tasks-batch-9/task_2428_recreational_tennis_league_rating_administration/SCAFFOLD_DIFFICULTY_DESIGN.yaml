          setup:
            - "Two sections: SOCAL-2026 (sec1) and NORCAL-2026 (sec2). Facility fac1 belongs to sec1, facility fac2 belongs to sec2, both with court_count 4 and turnaround_buffer_minutes 30."
            - "One SECTION league in sec1 with min_active_roster_size 2 and allow_same_day_doubleheader left at the default false; two teams of two ACTIVE 4.0 players whose home_facility_id is fac1, both IN_PLAY."
            - "Match M1 (Team H vs Team A) is scheduled at fac1 for 2026-08-15T18:00:00Z with courts_required 2, so both teams now hold a match on UTC date 2026-08-15."
            - "Match M2 pairs the same two teams and is still PENDING/unscheduled, so priority 24 does not fire."
            - "Clock stays at 2026-08-08T00:00:00Z, so 2026-08-15T20:00:00Z is a legal future start inside the season and neither priority 61 nor 64 interferes."
