              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_AMENDMENT_EFFECTIVE_OUT_OF_TERM"

      - name: err_escalator_out_of_term_rejected
        claim_type: triggerable
        grounds: ["errors[ERR_ESCALATOR_OUT_OF_TERM]", "validations[priority=9]"]
        distinguishing_aspect: "Escalator effective_date 2025-12-31 precedes the contract's effective_date 2026-01-01 -> ERR_ESCALATOR_OUT_OF_TERM."
        test_recipe:
          setup: ["payer P; contract C DRAFT 2026-01-01..2026-12-31"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer EO", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "EO-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
