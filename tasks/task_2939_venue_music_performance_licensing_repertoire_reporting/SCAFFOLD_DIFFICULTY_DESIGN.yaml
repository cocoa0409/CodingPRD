# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Venue Music Performance Licensing & Repertoire Reporting
# Every literal in every `assert:` was computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: license_fee_provisional_declared_versus_final_verified
        grounds:
          - calculations.annual_license_fee
          - entities.LicenseApplication.fields.provisional_annual_fee_cents
          - entities.License.fields.annual_fee_cents
          - entities.License.fields.verified_fee_delta_cents
          - state_machines.LicenseApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.License.PENDING_ACTIVATION_to_ACTIVE
        distinguishing_aspect: |
          This instance is money accounting on the License entity: the same fee formula run
          over the operator's self-declared capacity/use inputs (provisional_declared) and over
          the society's verified Venue survey (final_verified) yields 26121 versus 90017 cents,
          a delta of 63896 recorded on License.verified_fee_delta_cents.
        test_recipe:
          setup:
            - "Society BMI exists with repertoire_share_bp 4600"
            - "An EFFECTIVE RateSchedule for (BMI, BAR_GRILL) with default adjustment_bp 10000, min 30000, max 4500000"
            - "Venue V1 is verified at seating 120 / standing 180, MIXED, 4 live nights, 4200000 cents of annual cover revenue"
            - "LicenseApplication A1 self-declares 90 / 90, RECORDED_ONLY, 1 live night, 1000000 cents of cover revenue, and is APPROVED, producing License L1 in PENDING_ACTIVATION"
            - "Logical clock is at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_bg_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_bg_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 90, declared_standing: 90, declared_cover_revenue_cents: 1000000, declared_live_nights: 1, declared_music_use_profile: "RECORDED_ONLY", requested_term_start: "2026-09-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
              captures: { app1_provisional: "$.data.provisional_annual_fee_cents" }
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
          trigger:
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { lic1_final: "$.data.annual_fee_cents" }
          assert:
            - "LicenseApplication.${app1_id}.provisional_annual_fee_cents == 26121"
            - "License.${lic1_id}.provisional_annual_fee_cents == 26121"
            - "License.${lic1_id}.annual_fee_cents == 90017"
            - "License.${lic1_id}.verified_fee_delta_cents == 63896"
            - "GET /licensing/fee-assessments?license_id=${lic1_id} returns exactly one row with assessment_kind == INITIAL, amount_cents == 90017, paid_amount_cents == 0, status == ISSUED"
            - "Venue.${v1_id}.outstanding_balance_cents == 90017"
            - "Venue.${v1_id}.lifetime_assessed_cents == 90017"

      - name: repertoire_gap_share_title_match_versus_affiliation_coverage
        grounds:
          - calculations.repertoire_gap_share
          - entities.PerformanceReport.fields.unmatched_share_pct
          - entities.PerformanceReport.fields.uncovered_share_pct
          - entities.SetlistEntry.fields.is_matched
          - entities.SetlistEntry.fields.is_covered
          - state_machines.PerformanceReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This instance is compliance risk scoring on the PerformanceReport / SetlistEntry
          domain, not money on a License: over one identical four-entry setlist the title_match
          variant reports 49.50 percent unmatched while the affiliation_coverage variant reports
          75.25 percent uncovered, because a work registered to ASCAP or SESAC is matched but
          not covered by a BMI-only licence.
        test_recipe:
          setup:
            - "Societies BMI (4600), ASCAP (4400) and SESAC (500) exist"
            - "Venue V1 holds exactly one ACTIVE License L1 for BMI with annual_fee_cents 90017 and an ANNUAL_TERM CoverageWindow spanning 2026-09-01 to 2027-09-01"
            - "RepertoireWork rows exist for 'Blue Horizon' (BMI), 'Midnight Freight' (ASCAP) and 'Neon Sermon' (SESAC); 'Unknown Jam' is registered nowhere"
            - "DRAFT PerformanceReport R1 covers 2026-09-01 to 2026-10-01 and carries four setlist entries: Blue Horizon LIVE 300s, Midnight Freight LIVE 240s, Neon Sermon RECORDED 180s, Unknown Jam LIVE 600s"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/societies"
              payload: { society_code: "ASCAP", display_name: "American Society of Composers", repertoire_share_bp: 4400 }
              as: LicensingAdmin
              captures: { ascap_id: "$.data.id" }
            - call: "POST /licensing/societies"
              payload: { society_code: "SESAC", display_name: "SESAC Performing Rights", repertoire_share_bp: 500 }
              as: LicensingAdmin
              captures: { sesac_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "BAR_GRILL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_bg_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_bg_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Blue Note Grill", venue_category: "BAR_GRILL", seating_capacity: 120, standing_capacity: 180, occupancy_limit: 200, music_use_profile: "MIXED", weekly_live_performance_nights: 4, annual_cover_revenue_cents: 4200000 }
              as: LicensingAdmin
              captures: { v1_id: "$.data.id", v1_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v1_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 120, declared_standing: 180, declared_cover_revenue_cents: 4200000, declared_live_nights: 4, declared_music_use_profile: "MIXED", requested_term_start: "2026-09-01T00:00:00Z", expected_venue_version: "${v1_v0}" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app1_id}" }
              as: LicensingAdmin
              captures: { lic1_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic1_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/repertoire-works"
              payload: { society_id: "${bmi_id}", title: "Blue Horizon", writer_name: "A. Reed" }
              as: LicensingAdmin
              captures: { work_blue_id: "$.data.id" }
            - call: "POST /licensing/repertoire-works"
              payload: { society_id: "${ascap_id}", title: "Midnight Freight", writer_name: "J. Vance" }
              as: LicensingAdmin
              captures: { work_freight_id: "$.data.id" }
            - call: "POST /licensing/repertoire-works"
              payload: { society_id: "${sesac_id}", title: "Neon Sermon", writer_name: "K. Ito" }
              as: LicensingAdmin
              captures: { work_neon_id: "$.data.id" }
            - call: "POST /licensing/performance-reports"
              payload: { license_id: "${lic1_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: VenueOperator
              as_user_id: "${v1_id}"
              captures: { rep1_id: "$.data.id" }
            - call: "POST /licensing/performance-reports/${rep1_id}/setlist-entries"
              payload: { work_title: "Blue Horizon", writer_name: "A. Reed", society_affiliation: "BMI", performance_datetime: "2026-09-05T20:00:00Z", use_type: "LIVE", duration_seconds: 300 }
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/performance-reports/${rep1_id}/setlist-entries"
              payload: { work_title: "Midnight Freight", writer_name: "J. Vance", society_affiliation: "ASCAP", performance_datetime: "2026-09-05T20:30:00Z", use_type: "LIVE", duration_seconds: 240 }
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/performance-reports/${rep1_id}/setlist-entries"
              payload: { work_title: "Neon Sermon", writer_name: "K. Ito", society_affiliation: "SESAC", performance_datetime: "2026-09-05T21:00:00Z", use_type: "RECORDED", duration_seconds: 180 }
              as: VenueOperator
              as_user_id: "${v1_id}"
            - call: "POST /licensing/performance-reports/${rep1_id}/setlist-entries"
              payload: { work_title: "Unknown Jam", writer_name: "Unknown", society_affiliation: "UNKNOWN", performance_datetime: "2026-09-05T21:30:00Z", use_type: "LIVE", duration_seconds: 600 }
              as: VenueOperator
              as_user_id: "${v1_id}"
          trigger:
            - call: "POST /licensing/performance-reports/${rep1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v1_id}"
          assert:
            - "PerformanceReport.${rep1_id}.reported_entry_count == 4"
            - "PerformanceReport.${rep1_id}.matched_entry_count == 3"
            - "PerformanceReport.${rep1_id}.unmatched_share_pct == 49.50"
            - "PerformanceReport.${rep1_id}.uncovered_entry_count == 3"
            - "PerformanceReport.${rep1_id}.uncovered_share_pct == 75.25"
            - "PerformanceReport.${rep1_id}.unmatched_share_pct != PerformanceReport.${rep1_id}.uncovered_share_pct"
            - "PerformanceReport.${rep1_id}.gap_exposure_cents == 67738"
            - "The SetlistEntry for 'Midnight Freight' has is_matched == true, matched_work_id == ${work_freight_id} and is_covered == false"
            - "The SetlistEntry for 'Unknown Jam' has is_matched == false, matched_work_id == null and is_covered == false"

  - rule_id: combinatorial_formula
    instances:
      - name: back_license_exposure_rounds_per_month_then_sums
        grounds:
          - calculations.back_license_exposure
          - calculations.annual_license_fee
          - entities.AuditCase.fields.back_license_exposure_cents
          - entities.AuditCase.fields.unlicensed_month_count
          - state_machines.AuditCase.OPEN_to_FINDINGS_ISSUED
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the monthly instalment
          round_half_up(1335461 / 12) = 111288 is rounded FIRST and then multiplied by the 18
          unlicensed months to 2003184 cents, whereas the forbidden sum-then-round order
          round_half_up(1335461 * 18 / 12) yields 2003192 cents — an 8-cent divergence the
          scaffold pins to the per-month order.
        test_recipe:
          setup:
            - "Society BMI exists with repertoire_share_bp 4600"
            - "An EFFECTIVE RateSchedule for (BMI, CONCERT_HALL) with default adjustment_bp 10000"
            - "Venue V2 is verified at seating 1200 / standing 0, LIVE_ONLY, 5 live nights, 62000000 cents of annual cover revenue, and holds no License at all"
            - "An OPEN AuditCase C1 covers the 18 whole months from 2025-01-01 to 2026-07-01 against BMI"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "CONCERT_HALL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_ch_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_ch_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Harborlight Concert Hall", venue_category: "CONCERT_HALL", seating_capacity: 1200, standing_capacity: 0, occupancy_limit: 1300, music_use_profile: "LIVE_ONLY", weekly_live_performance_nights: 5, annual_cover_revenue_cents: 62000000 }
              as: LicensingAdmin
              captures: { v2_id: "$.data.id" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v2_id}", audit_trigger: "ROUTINE", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-07-01T00:00:00Z", society_ids: ["${bmi_id}"] }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { case18_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/audit-cases/${case18_id}/findings"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "AuditCase.${case18_id}.unlicensed_month_count == 18"
            - "AuditCase.${case18_id}.back_license_exposure_cents == 2003184"
            - "AuditCase.${case18_id}.back_license_exposure_cents != 2003192"
            - "AuditCase.${case18_id}.penalty_cents == 1001592"
            - "AuditCase.${case18_id}.pre_credit_total_cents == 3004776"
            - "AuditCase.${case18_id}.status == FINDINGS_ISSUED"
            - "GET /licensing/fee-assessments?audit_case_id=${case18_id} returns exactly one row with assessment_kind == AUDIT_BACK_LICENSE, amount_cents == 3004776 and status == ISSUED"

      - name: settlement_goodwill_tier_pinned_to_pre_credit_total
        grounds:
          - calculations.settlement_target
          - calculations.back_license_exposure
          - entities.AuditCase.fields.pre_credit_total_cents
          - entities.AuditCase.fields.goodwill_credit_cents
          - entities.AuditCase.fields.settlement_total_cents
          - state_machines.AuditCase.OPEN_to_FINDINGS_ISSUED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the goodwill tier
          is selected once from pre_credit_total_cents 2670912 (>= 2500000, so 1000 bp, credit
          267091, settlement_total 2403821); re-evaluating the tier on the post-credit total
          2403821 (< 2500000, so 500 bp) would produce credit 133546 and total 2537366, which
          the scaffold forbids.
        test_recipe:
          setup:
            - "Society BMI exists with repertoire_share_bp 4600"
            - "An EFFECTIVE RateSchedule for (BMI, CONCERT_HALL) with default adjustment_bp 10000"
            - "Venue V2 is verified at seating 1200 / standing 0, LIVE_ONLY, 5 live nights, 62000000 cents of annual cover revenue, and holds no License at all"
            - "An OPEN AuditCase C2 covers the 16 whole months from 2025-01-01 to 2026-05-01 against BMI"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "CONCERT_HALL", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_ch_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_ch_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Harborlight Concert Hall", venue_category: "CONCERT_HALL", seating_capacity: 1200, standing_capacity: 0, occupancy_limit: 1300, music_use_profile: "LIVE_ONLY", weekly_live_performance_nights: 5, annual_cover_revenue_cents: 62000000 }
              as: LicensingAdmin
              captures: { v2_id: "$.data.id" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v2_id}", audit_trigger: "ROUTINE", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-05-01T00:00:00Z", society_ids: ["${bmi_id}"] }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { case16_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/audit-cases/${case16_id}/findings"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "AuditCase.${case16_id}.unlicensed_month_count == 16"
            - "AuditCase.${case16_id}.back_license_exposure_cents == 1780608"
            - "AuditCase.${case16_id}.penalty_cents == 890304"
            - "AuditCase.${case16_id}.pre_credit_total_cents == 2670912"
            - "AuditCase.${case16_id}.goodwill_credit_cents == 267091"
            - "AuditCase.${case16_id}.goodwill_credit_cents != 133546"
            - "AuditCase.${case16_id}.settlement_total_cents == 2403821"
            - "AuditCase.${case16_id}.settlement_total_cents != 2537366"
            - "AuditCase.${case16_id}.settlement_floor_cents == 1442293"

      - name: annual_fee_occupancy_max_tier_and_clamp_interaction
        grounds:
          - calculations.annual_license_fee
          - calculations.license_type_assignment
          - entities.RateSchedule.fields.min_annual_fee_cents
          - entities.Society.fields.repertoire_share_bp
          - state_machines.License.PENDING_ACTIVATION_to_ACTIVE
        distinguishing_aspect: |
          Mode (a) non-linear interaction of four inputs: occupancy is max(0, 40) = 40 which
          selects TIER_1, the BACKGROUND_ONLY multiplier 6000 bp drives the scaled fee to 29520
          which the nested min/max clamp lifts to the 30000 floor, and only then does the 500 bp
          SESAC apportionment reduce it to 1500 — a final figure legitimately far below the
          schedule floor.
        test_recipe:
          setup:
            - "Society SESAC exists with repertoire_share_bp 500"
            - "An EFFECTIVE RateSchedule for (SESAC, FITNESS_STUDIO) with default adjustment_bp 10000, min_annual_fee_cents 30000, max_annual_fee_cents 4500000"
            - "Venue V3 is verified at seating 0 / standing 40, BACKGROUND_ONLY, 0 live nights, 0 cents of cover revenue, and has never had an exemption analysis run"
            - "LicenseApplication A3 declares exactly the verified figures and is APPROVED, producing License L3 in PENDING_ACTIVATION"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "SESAC", display_name: "SESAC Performing Rights", repertoire_share_bp: 500 }
              as: LicensingAdmin
              captures: { sesac_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${sesac_id}", venue_category: "FITNESS_STUDIO", effective_from: "2026-01-01T00:00:00Z", min_annual_fee_cents: 30000, max_annual_fee_cents: 4500000 }
              as: LicensingAdmin
              captures: { sched_fs_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_fs_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Riverbend Fitness Studio", venue_category: "FITNESS_STUDIO", seating_capacity: 0, standing_capacity: 40, occupancy_limit: 45, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0 }
              as: LicensingAdmin
              captures: { v3_id: "$.data.id", v3_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v3_id}", society_id: "${sesac_id}", requested_license_type: "BLANKET", declared_seating: 0, declared_standing: 40, declared_cover_revenue_cents: 0, declared_live_nights: 0, declared_music_use_profile: "BACKGROUND_ONLY", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v3_v0}" }
              as: VenueOperator
              as_user_id: "${v3_id}"
              captures: { app3_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app3_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v3_id}"
            - call: "POST /licensing/license-applications/${app3_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app3_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
              captures: { app3_type: "$.data.assigned_license_type" }
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app3_id}" }
              as: LicensingAdmin
              captures: { lic3_id: "$.data[0].id" }
          trigger:
            - call: "POST /licensing/licenses/${lic3_id}/activate"
              payload: {}
              as: LicensingAdmin
          assert:
            - "LicenseApplication.${app3_id}.assigned_license_type == BLANKET"
            - "License.${lic3_id}.license_type == BLANKET"
            - "License.${lic3_id}.annual_fee_cents == 1500"
            - "License.${lic3_id}.provisional_annual_fee_cents == 1500"
            - "License.${lic3_id}.verified_fee_delta_cents == 0"
            - "GET /licensing/fee-assessments?license_id=${lic3_id} returns exactly one row with amount_cents == 1500"
            - "Venue.${v3_id}.outstanding_balance_cents == 1500"
            - "Venue.${v3_id}.covered_share_bp == 500"
            - "Venue.${v3_id}.coverage_posture == PARTIALLY_COVERED"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.LicenseApplication.RETURNED_FOR_REVISION_to_SUBMITTED
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DECLINED
          - entities.LicenseApplication.fields.revision_round
          - entities.LicenseApplication.fields.decline_reason
        distinguishing_aspect: |
          Cycle on the LicenseApplication entity: UNDER_REVIEW -> RETURNED_FOR_REVISION ->
          SUBMITTED -> UNDER_REVIEW runs three times, incrementing revision_round to 3, and the
          fourth RETURN_FOR_REVISION leaves the cycle for the terminal DECLINED state with
          decline_reason REVISION_LIMIT_EXCEEDED instead of looping a fourth time.
        test_recipe:
          setup:
            - "Society BMI and an EFFECTIVE (BMI, BAR_GRILL) RateSchedule exist"
            - "Venue V1 is registered and carries no audit hold"
