              as: ProgramStaff
              captures: { st2_id: "$.data.id" }
            - call: "POST /stipend-statements/${st2_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-10-05", period_end: "2026-10-18", hours_attended: 140, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
