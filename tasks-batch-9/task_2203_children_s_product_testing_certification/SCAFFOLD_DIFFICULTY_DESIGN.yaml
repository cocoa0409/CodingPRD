      - name: boundary_periodic_due_instant_with_month_end_day_clamping_is_due_at_equality
        grounds:
          - calculations.periodic_retest_due_date
          - state_machines.SamplingPlan.ACTIVE_to_RESAMPLE_DUE
          - validations[priority=30]
          - endpoints "POST /compliance/sampling-plans/{plan_id}/periodic-review"
        distinguishing_aspect: "A different metric — a calendar instant, not a numeric measurement — on a different endpoint, POST /compliance/sampling-plans/{plan_id}/periodic-review. Two boundaries are probed at once. First, day clamping: a plan verified on 2026-08-31 with a strictest interval of 6 months is due on 2027-02-28, because February 2027 has no 31st; an implementation that adds 183 days would land on 2027-03-02 and an implementation that rolls over would land on 2027-03-03. Second, the comparison direction: at exactly 2027-02-28T00:00:00Z the plan IS due, while one day earlier the review is rejected with ERR_PERIODIC_REVIEW_NOT_DUE."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-31T00:00:00Z."
            - "Register a lead-content rule with periodic_interval_months 12 and a phthalate rule with periodic_interval_months 6, both ALWAYS-mapped onto a non-durable category with sampling_floor_units 1, so the strictest interval is 6 months."
            - "Register a product with one painted part and scope it onto FULL_PRODUCT_TEST so required_rule_ids has both rules."
            - "Create an INITIAL sampling plan with resample_grace_days 30 and activate it at 2026-08-31T00:00:00Z, so last_verified_at is 2026-08-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "LEAD-CONTENT-100"
                hazard_class: "LEAD_CONTENT"
                test_method_code: "CPSC-CH-E1002-08"
                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/applicable-rules"
              payload:
                rule_code: "PHTHALATE-1000"
                hazard_class: "PHTHALATES"
                test_method_code: "CPSC-CH-C1001-09-4"
                limit_value: 1000
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 6
                base_method_fee_cents: 24000
                component_reliance_allowed: true
                severity_weight: 7
              as: ComplianceAdministrator
              captures: { rule_phthalate_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_lead_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_phthalate_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 90"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted body shell"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
            - call: "POST /compliance/products/${product_id}/submit-for-certification"
              payload: { evidence_path: "FULL_PRODUCT_TEST" }
              as: TestCoordinator
            - call: "POST /compliance/products/${product_id}/sampling-plans"
              payload: { plan_type: "INITIAL", resample_grace_days: 30 }
              as: TestCoordinator
              captures: { plan_id: "$.data.id" }
            - call: "POST /compliance/sampling-plans/${plan_id}/activate"
              payload: {}
              as: TestCoordinator
              captures: { plan_periodic_due_at: "$.data.periodic_due_at" }
          trigger:
            - "One day early: POST /compliance/_clock/set_current_utc to 2027-02-27T00:00:00Z, then POST /compliance/sampling-plans/${plan_id}/periodic-review as TestCoordinator."
            - "Exactly due: POST /compliance/_clock/set_current_utc to 2027-02-28T00:00:00Z, then POST /compliance/sampling-plans/${plan_id}/periodic-review as TestCoordinator."
            - "Grace boundary: POST /compliance/_clock/set_current_utc to 2027-03-29T00:00:00Z and review again, then to 2027-03-30T00:00:00Z and review again."
          assert:
            - "The activation response reports periodic_due_at == \"2027-02-28T00:00:00Z\" — the 31st clamped to the last day of February 2027, with the time-of-day preserved."
            - "periodic_due_at is NOT \"2027-03-02T00:00:00Z\" (183-day arithmetic) and NOT \"2027-03-03T00:00:00Z\" (month rollover)."
            - "At 2027-02-27T00:00:00Z the review returns HTTP 409 with error_id == \"ERR_PERIODIC_REVIEW_NOT_DUE\" and the plan still reports plan_state == \"ACTIVE\"."
            - "At exactly 2027-02-28T00:00:00Z the review returns 200 with plan_state == \"RESAMPLE_DUE\" and resample_trigger == \"PERIODIC_INTERVAL\" — equality counts as due."
            - "At 2027-03-29T00:00:00Z (due plus 29 days, one short of resample_grace_days 30) the review returns 200 with plan_state still == \"RESAMPLE_DUE\"."
            - "At 2027-03-30T00:00:00Z (due plus exactly 30 days) the review returns 200 with plan_state == \"LAPSED\"."
            - "Once the plan is LAPSED, GET /compliance/products/${product_id}/compliance-summary reports compliance_posture == \"SUSPENDED\" by branch 3 of product_compliance_posture, even though no noncompliance case exists."

      - name: boundary_component_coverage_quarantine_buffer_seven_day_gap_collides_eight_day_gap_clears
        grounds:
          - calculations.component_certificate_coverage_overlap_check
          - errors.ERR_COMPONENT_COVERAGE_OVERLAP
          - endpoints "POST /compliance/component-parts/{part_id}/certificates"
        distinguishing_aspect: "A third metric — the day-count GAP between two closed coverage intervals — on a third endpoint, POST /compliance/component-parts/{part_id}/certificates. With COVERAGE_BUFFER_DAYS 7 and an existing interval ending 2026-03-31, a candidate starting 2026-04-07 sits exactly on the widened boundary and must be REJECTED, while a candidate starting 2026-04-08 must be ACCEPTED. This isolates three off-by-one errors at once: forgetting the buffer entirely (which would accept 2026-04-01), treating the buffer as exclusive (which would accept 2026-04-07), and over-applying it on both sides (which would reject 2026-04-08)."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register one lead-content rule with component_reliance_allowed true, a non-durable category with sampling_floor_units 1, and map the rule ALWAYS."
            - "Register a supplier with reliance_agreement_state ON_FILE and an INDEPENDENT laboratory with a current attestation and an accreditation for the rule."
            - "Register a product, add one painted part supplied by that supplier, and scope the product onto COMPONENT_RELIANCE."
            - "As SupplierUser submit a first component part certificate for the rule with the closed coverage interval 2026-01-01..2026-03-31; it stays in SUBMITTED and therefore occupies its interval."
