            - "PaymentPlan.${large_plan_id}.installments_due_count == 3, arrears_cents == 5000000 and late_fee_accrued_cents == 15000 — raw 75000 lowered to the LATE_FEE_CAP_CENTS cap"
            - "PaymentPlan.${small_plan_id}.outstanding_cents == 102500 and PaymentPlan.${large_plan_id}.outstanding_cents == 5015000"
            - "both plans are DELINQUENT with delinquency_strikes == 1 — one sweep is one strike per plan, never one per installment"
