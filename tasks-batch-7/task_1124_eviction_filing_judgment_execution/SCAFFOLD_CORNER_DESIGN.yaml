          elig: $.data[0].disposal_eligible_on
      trigger:
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-16T09:00:00Z'
        as: PlatformAdmin
      - call: POST /api/ops/runs
        payload: {}
        as: CourtClerk
        captures:
          d1: $.data.storage_records_disposable
      - call: GET /api/storage-records/${sr}
        payload: {}
        as: CourtClerk
        captures:
          st1: $.data.status
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-16T09:00:01Z'
        as: PlatformAdmin
      - call: POST /api/ops/runs
        payload: {}
