# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: EquipmentUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_RENT
        trigger: "POST /rental-yard/reservations/{id}/dispatch (DELIVERY) or POST /rental-yard/reservations/{id}/pickup (PICKUP)"
        actor: RentalAgent
        preconditions:
          - "the dispatched/picked-up Reservation is CONFIRMED"
          - "EquipmentUnit.availability_state == AVAILABLE (not currently ON_RENT or OUT_OF_SERVICE)"
        side_effects:
          - "set EquipmentUnit.availability_state = ON_RENT"
          - "set EquipmentUnit.fuel_level_liters = RentalCatalogItem.fuel_capacity_liters (dispatched full)"
          - "increments EquipmentUnit.version by 1"
          - "open RentalAgreement in ON_RENT"
        note: "Confirming a reservation does NOT change availability_state — a unit holds future bookings while still AVAILABLE. Only dispatch/pickup moves the physical unit ON_RENT, and only when it is AVAILABLE right now."
      - from: ON_RENT
        to: AVAILABLE
        trigger: "POST /rental-yard/return-inspections (return, CLEAN, no damage, below service threshold)"
        actor: Inspector
        preconditions:
          - "RentalAgreement.agreement_state == RETURNED_PENDING_INSPECTION"
          - "EquipmentUnit.lifetime_rental_days + this agreement's billed_days < EquipmentUnit.service_due_at_days"
        side_effects:
          - "set EquipmentUnit.availability_state = AVAILABLE"
          - "increments EquipmentUnit.version by 1"
          - "add billed_days to EquipmentUnit.lifetime_rental_days"
        note: "Healthy return below the service threshold returns the unit to the pool."
      - from: ON_RENT
        to: OUT_OF_SERVICE
        trigger: "POST /rental-yard/return-inspections (return with damage_assessed_cents > 0, OR lifetime_rental_days reaches service_due_at_days)"
        actor: Inspector
        preconditions:
          - "RentalAgreement.agreement_state == RETURNED_PENDING_INSPECTION"
          - "ReturnInspection.damage_assessed_cents > 0 OR (EquipmentUnit.lifetime_rental_days + billed_days >= EquipmentUnit.service_due_at_days)"
        side_effects:
          - "set EquipmentUnit.availability_state = OUT_OF_SERVICE"
          - "increments EquipmentUnit.version by 1"
          - "add billed_days to EquipmentUnit.lifetime_rental_days"
          - "auto-create MaintenanceTicket(OPEN, reason=DAMAGE_REPAIR if damage else SCHEDULED_SERVICE, opened_by_agreement_id=agreement.id)"
        note: "Transitive cascade origin: return -> agreement close -> unit OUT_OF_SERVICE -> maintenance ticket OPEN."
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /rental-yard/maintenance-tickets (manual pull)"
        actor: YardManager
        preconditions:
          - "EquipmentUnit.availability_state == AVAILABLE"
        side_effects:
          - "set EquipmentUnit.availability_state = OUT_OF_SERVICE"
          - "increments EquipmentUnit.version by 1"
          - "create MaintenanceTicket in OPEN"
        note: "Manual service pull from the pool."
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /rental-yard/maintenance-tickets/{id}/resolve"
        actor: YardManager
        preconditions:
          - "MaintenanceTicket.ticket_state == OPEN"
          - "no other OPEN MaintenanceTicket exists for this unit"
        side_effects:
          - "set MaintenanceTicket.ticket_state = RESOLVED"
          - "set EquipmentUnit.availability_state = AVAILABLE"
          - "increments EquipmentUnit.version by 1"
        note: "Unit returns to pool only when its last open ticket resolves."

  - entity: Reservation
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, FULFILLED]
    transitions:
      - from: CONFIRMED
        to: DISPATCHED_DELIVERY
        trigger: "POST /rental-yard/reservations/{id}/dispatch"
        actor: RentalAgent
        preconditions:
          - "Reservation.reservation_state == CONFIRMED"
          - "Reservation.fulfillment_method == DELIVERY"
          - "yard clock current date >= rental_start_date"
          - "EquipmentUnit.availability_state == AVAILABLE"
          - "delivery_truck_id references an existing DeliveryTruck"
          - "the [delivery_window_start, delivery_window_end) interval, expanded by DeliveryTruck.buffer_minutes on both sides, does not collide with any other DISPATCHED_DELIVERY/ON_RENT reservation's window on the same truck (half-open + buffer semantics)"
        side_effects:
          - "set Reservation.reservation_state = DISPATCHED_DELIVERY"
          - "set Reservation.delivery_truck_id, delivery_window_start, delivery_window_end"
          - "set linked EquipmentUnit.availability_state = ON_RENT; set fuel_level_liters = capacity; increments EquipmentUnit.version by 1"
          - "open RentalAgreement(ON_RENT, actual_start_date=clock date, scheduled_end_date=rental_end_date, deposit_held_cents=rate_card.deposit_cents)"
        note: "DELIVERY branch; only valid when fulfillment_method == DELIVERY; assigns a truck delivery window with buffered half-open overlap semantics."
      - from: CONFIRMED
        to: PICKED_UP
        trigger: "POST /rental-yard/reservations/{id}/pickup"
        actor: RentalAgent
        preconditions:
          - "Reservation.reservation_state == CONFIRMED"
          - "Reservation.fulfillment_method == PICKUP"
          - "RentalCatalogItem.requires_delivery == false"
          - "yard clock current date >= rental_start_date"
          - "EquipmentUnit.availability_state == AVAILABLE"
        side_effects:
          - "set Reservation.reservation_state = PICKED_UP"
          - "set linked EquipmentUnit.availability_state = ON_RENT; set fuel_level_liters = capacity; increments EquipmentUnit.version by 1"
          - "open RentalAgreement(ON_RENT, actual_start_date=clock date, scheduled_end_date=rental_end_date, deposit_held_cents=rate_card.deposit_cents)"
        note: "PICKUP branch; rejected for items requiring delivery; requires the unit be AVAILABLE right now."
      - from: DISPATCHED_DELIVERY
        to: ON_RENT
        trigger: "system (set immediately when the agreement opens)"
        actor: system
        preconditions:
          - "RentalAgreement opened in ON_RENT"
        side_effects:
          - "set Reservation.reservation_state = ON_RENT"
        note: "Reservation tracks the unit being live on rent."
      - from: PICKED_UP
        to: ON_RENT
        trigger: "system (set immediately when the agreement opens)"
        actor: system
        preconditions:
          - "RentalAgreement opened in ON_RENT"
        side_effects:
          - "set Reservation.reservation_state = ON_RENT"
        note: "Reservation tracks the unit being live on rent."
      - from: ON_RENT
        to: FULFILLED
        trigger: "system (set when the agreement reaches CLOSED or CLOSED_WITH_DAMAGE)"
        actor: system
        preconditions:
          - "linked RentalAgreement.agreement_state in {CLOSED, CLOSED_WITH_DAMAGE}"
        side_effects:
          - "set Reservation.reservation_state = FULFILLED"
        note: "Terminal; reservation lifecycle ends with the agreement close."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rental-yard/reservations/{id}/cancel"
        actor: RentalAgent
        preconditions:
          - "Reservation.reservation_state == CONFIRMED"
        side_effects:
          - "set Reservation.reservation_state = CANCELLED"
          - "post DEPOSIT_REFUND ledger entry reversing the DEPOSIT_HOLD; recompute ContractorAccount.outstanding_balance_cents"
        note: "Only a CONFIRMED reservation (not yet dispatched/picked up) may be cancelled. The unit's availability_state is unaffected (it never changed on confirm); the future booking interval is simply freed."

  - entity: RentalAgreement
    initial_state: ON_RENT
    terminal_states: [CLOSED, CLOSED_WITH_DAMAGE]
    transitions:
      - from: ON_RENT
        to: RETURNED_PENDING_INSPECTION
        trigger: "POST /rental-yard/rental-agreements/{id}/return"
        actor: RentalAgent
        preconditions:
          - "RentalAgreement.agreement_state == ON_RENT"
          - "yard clock current date >= actual_start_date"
        side_effects:
          - "set RentalAgreement.agreement_state = RETURNED_PENDING_INSPECTION"
          - "set RentalAgreement.actual_return_date = yard clock current date"
          - "compute RentalAgreement.final_rental_cents (final/chronological variant) and late_fee_cents over [actual_start_date, actual_return_date]"
        note: "Return marks the physical hand-back; inspection then finalizes charges."
      - from: RETURNED_PENDING_INSPECTION
        to: CLOSED
        trigger: "POST /rental-yard/return-inspections (cleanliness handling, no net damage)"
        actor: Inspector
        preconditions:
          - "RentalAgreement.agreement_state == RETURNED_PENDING_INSPECTION"
          - "ReturnInspection.net_damage_cents == 0"
        side_effects:
          - "set RentalAgreement.agreement_state = CLOSED"
          - "compute fuel_refill_cents; compute final_total_cents"
          - "post ledger entries RENTAL_CHARGE, LATE_FEE (if > 0), FUEL_CHARGE (if > 0), CLEANING_CHARGE (if DIRTY), DEPOSIT_REFUND (-deposit_held_cents)"
          - "recompute ContractorAccount.outstanding_balance_cents"
          - "transition linked Reservation to FULFILLED"
          - "EquipmentUnit -> AVAILABLE or OUT_OF_SERVICE per service threshold"
        note: "Close without damage; deposit refunded in full."
      - from: RETURNED_PENDING_INSPECTION
        to: CLOSED_WITH_DAMAGE
        trigger: "POST /rental-yard/return-inspections (net_damage_cents > 0)"
        actor: Inspector
        preconditions:
          - "RentalAgreement.agreement_state == RETURNED_PENDING_INSPECTION"
          - "ReturnInspection.net_damage_cents > 0"
        side_effects:
          - "set RentalAgreement.agreement_state = CLOSED_WITH_DAMAGE"
          - "create DamageCharge(gross_cents, waiver_applied=false, net_cents=net_damage_cents)"
          - "compute fuel_refill_cents; compute final_total_cents"
          - "post ledger entries RENTAL_CHARGE, LATE_FEE (if>0), FUEL_CHARGE (if>0), CLEANING_CHARGE (if DIRTY), DAMAGE_CHARGE (+net_damage_cents), DEPOSIT_REFUND (-deposit_held_cents)"
          - "recompute ContractorAccount.outstanding_balance_cents"
          - "transition linked Reservation to FULFILLED"
          - "set EquipmentUnit.availability_state = OUT_OF_SERVICE; auto-create MaintenanceTicket(OPEN, DAMAGE_REPAIR)"
        note: "Cascade: inspection -> agreement CLOSED_WITH_DAMAGE -> unit OUT_OF_SERVICE -> maintenance ticket OPEN."

  - entity: MaintenanceTicket
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /rental-yard/maintenance-tickets/{id}/resolve"
        actor: YardManager
        preconditions:
          - "MaintenanceTicket.ticket_state == OPEN"
        side_effects:
          - "set MaintenanceTicket.ticket_state = RESOLVED"
          - "if no other OPEN ticket on the unit, set EquipmentUnit.availability_state = AVAILABLE and increment its version"
        note: "Resolving the last open ticket frees the unit back to the pool."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
# No true CREATE-with-supersede race exists in this domain: every write-write
# conflict here (a second reservation on the same unit/interval, a second
# inspection on the same agreement, a second dispatch) is rejected by a state
# precondition or the temporal-overlap validation that a strictly-sequential
# second request observes — see §1.2.1 mandatory filter. Such conflicts are
# captured in §1.2 transition preconditions and §1.4 validations
# (ERR_INVALID_STATE, ERR_UNIT_DOUBLE_BOOKED, ERR_TRUCK_DOUBLE_BOOKED), NOT as
# OCC rules. concurrency_rules is therefore intentionally empty.
concurrency_rules: []

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: rental_charge
    trigger: "Reservation confirm (estimate variant) and RentalAgreement return (final variant)"
    algorithm: tiered_pricing
    formula: |
      # billed_days is the inclusive day count over an interval [start, end]:
      #   billed_days = (end_date - start_date).days + 1   (always >= 1)
      # Decompose billed_days greedily into 4-week, then week, then day blocks:
      four_week_blocks = billed_days // 28
      rem_after_4w     = billed_days % 28
      week_blocks      = rem_after_4w // 7
      loose_days       = rem_after_4w % 7
      rental_cents = (four_week_blocks * four_week_rate_cents
                      + week_blocks    * weekly_rate_cents
                      + loose_days     * daily_rate_cents)
      # Best-rate guard (rate_threshold_triggers): a partial block must never cost
      # more than the next whole block. After the greedy decomposition, if
      # (loose_days * daily_rate_cents) > weekly_rate_cents, charge one week instead
      # of loose_days; if the resulting (week_blocks * weekly_rate_cents within the
      # current 28-day remainder) > four_week_rate_cents, charge one 4-week block
      # instead. Apply the day->week cap first, then the week->4week cap (PINNED ORDER).
    input_set: "estimate variant: interval = [reservation.rental_start_date, reservation.rental_end_date]. final variant: interval = [agreement.actual_start_date, min(actual_return_date, scheduled_end_date)] (overdue days are NOT billed at rental rate; they are billed via late_fee)."
    constants:
      DELIVERY_FEE_BY_CATEGORY_CENTS: { HAND_TOOL: 0, POWER_TOOL: 2500, HEAVY_EQUIPMENT: 12000 }
    precision: "integer cents; all block math exact; no rounding needed"
    variants:
      - name: estimate
        when: "computed at reservation confirm onto Reservation.estimated_rental_cents"
        difference: "Uses the full planned interval [rental_start_date, rental_end_date]; assumes on-time return; ignores overdue/late."
      - name: final
        when: "computed at RentalAgreement return onto RentalAgreement.final_rental_cents"
        difference: "Uses [actual_start_date, min(actual_return_date, scheduled_end_date)]; overdue days excluded here and billed under late_fee instead. Same tiered formula, different (often shorter or capped) interval, so estimate != final whenever the actual interval diverges from the plan."

  - name: late_fee
    trigger: "RentalAgreement return"
    algorithm: threshold
    formula: |
      overdue_days = max(0, (actual_return_date - scheduled_end_date).days)   # whole days past the deadline
      late_fee_cents = round_half_up(overdue_days * daily_rate_cents * late_fee_multiplier)
      # Boundary: returning ON scheduled_end_date => overdue_days = 0 => late_fee = 0.
      # Returning one day after => overdue_days = 1.
    input_set: "Reads RentalAgreement.scheduled_end_date, actual_return_date, rate_card.daily_rate_cents, rate_card.late_fee_multiplier."
    constants: {}
    precision: "round_half_up to whole cents (multiplier may be fractional)"

  - name: fuel_refill_charge
    trigger: "ReturnInspection create"
    algorithm: aggregation
    formula: |
      missing_liters = max(0, EquipmentUnit.fuel_level_liters_at_dispatch - return_fuel_level_liters)
      # fuel_level_liters_at_dispatch == RentalCatalogItem.fuel_capacity_liters (dispatched full).
      capped_liters  = min(missing_liters, RentalCatalogItem.fuel_capacity_liters)
      fuel_refill_cents = capped_liters * rate_card.fuel_refill_cents_per_liter
      # Boundary: return_fuel_level_liters >= capacity => missing_liters = 0 => no charge.
    input_set: "Reads ReturnInspection.return_fuel_level_liters, the dispatch fuel level (= capacity), rate_card.fuel_refill_cents_per_liter."
    constants: {}
    precision: "integer cents"

  - name: account_outstanding_balance
    trigger: "any AccountLedgerEntry insert (deposit hold/refund, charges, payments) — recomputed full each time"
    algorithm: aggregation
    formula: |
      # Full recompute over ALL ledger entries for the account, in created_at ASC order
      # (tie-break: created_at then nothing else needed since entries are append-only and
      #  each insert is a distinct call). Sum signed amounts:
      outstanding_balance_cents = sum(e.amount_cents for e in ledger_entries
                                       where e.contractor_account_id == account.id)
      # DEPOSIT_HOLD / RENTAL_CHARGE / FUEL_CHARGE / CLEANING_CHARGE / LATE_FEE /
      # DAMAGE_CHARGE are positive; DEPOSIT_REFUND / PAYMENT are negative.
    input_set: "All AccountLedgerEntry rows for the account, every entry_type included."
    constants: {}
    precision: "integer cents; exact sum"
    variants:
      - name: credit_check_projection
        when: "evaluated at reservation confirm BEFORE the deposit hold is posted"
        difference: "Risk/credit projection on ContractorAccount: would_be_balance = current outstanding_balance_cents + deposit_cents + estimated_total_cents; reject if would_be_balance > credit_limit_cents. Distinct entity domain (ContractorAccount credit) from the rental_charge cost accounting on Reservation/Agreement."

  - name: damage_net_charge
    trigger: "ReturnInspection create"
    algorithm: threshold
    formula: |
      gross = ReturnInspection.damage_assessed_cents
      net_damage_cents = 0 if Reservation.damage_waiver_opted else gross
      # Boundary: damage_assessed_cents == 0 => net 0 regardless of waiver (no DamageCharge,
      #   agreement -> CLOSED). damage_assessed_cents > 0 with waiver => net 0 but unit STILL
      #   goes OUT_OF_SERVICE (damage occurred); agreement -> CLOSED (no damage ledger charge).
    input_set: "Reads ReturnInspection.damage_assessed_cents, Reservation.damage_waiver_opted."
    constants: {}
    precision: "integer cents"

  - name: final_total
    trigger: "ReturnInspection create (agreement close)"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED (circular-looking: deposit refund depends on damage,
      # which depends on waiver flag). Compute components first, THEN net the deposit:
      #   1. final_rental_cents      (rental_charge final variant, already on agreement)
      #   2. waiver_cents            = damage_waiver_daily_cents * final_billed_days
      #                                (final_billed_days = billed_days of the final interval)
      #   3. late_fee_cents          (already on agreement)
      #   4. fuel_refill_cents       (fuel_refill_charge calc)
      #   5. cleaning_cents          = cleaning_fee_cents if cleanliness == DIRTY else 0
      #   6. net_damage_cents        (damage_net_charge calc)
      #   7. deposit_refund_cents    = deposit_held_cents   (always fully refunded; damage is
      #                                a separate positive charge, NOT netted against deposit)
      final_total_cents = (final_rental_cents + waiver_cents + late_fee_cents
                           + fuel_refill_cents + cleaning_cents + net_damage_cents
                           - deposit_refund_cents)
      # This is the net amount posted to the account for the close (deposit hold already
      # posted at confirm is reversed by the DEPOSIT_REFUND line).
    input_set: "Reads agreement final_rental_cents, late_fee_cents, deposit_held_cents; inspection fuel_refill_cents, cleanliness, net_damage_cents; rate_card waiver/cleaning constants; final interval billed_days."
    constants: {}
    precision: "integer cents; sum in the pinned 1..7 order"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET (public reads allowed) — write endpoints require headers"
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all write endpoints"
  - priority: 3
    category: auth
    check: "for Contractor role, the reservation/agreement/account being acted on belongs to X-User-ID (contractor_account_id == X-User-ID)"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "Contractor-initiated reservation create, reservation cancel, account reads"
  - priority: 4
    category: existence
    check: "all path/body referenced resources exist (rate_card_id, catalog_item_id, equipment_unit_id, contractor_account_id, reservation_id, rental_agreement_id), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource by id"
  - priority: 5
    category: business_constraint
    check: "required body fields present and well-typed; enum members valid; rental_end_date >= rental_start_date; amounts non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"
  - priority: 6
    category: business_constraint
    check: "sku unique on catalog item create; asset_tag unique on equipment unit create"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /rental-yard/catalog-items, POST /rental-yard/equipment-units"
  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined (e.g., reservation CONFIRMED for cancel/dispatch/pickup; agreement ON_RENT for return; RETURNED_PENDING_INSPECTION for inspection; ticket OPEN for resolve)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: state
    check: "on reservation create, the chosen EquipmentUnit is NOT in availability_state OUT_OF_SERVICE (a unit pulled for maintenance cannot accept new bookings). On dispatch/pickup, the unit must be AVAILABLE right now (not ON_RENT, not OUT_OF_SERVICE)."
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /rental-yard/reservations, POST /rental-yard/reservations/{id}/dispatch, POST /rental-yard/reservations/{id}/pickup"
  - priority: 9
    category: business_referential
    check: "fulfillment_method == PICKUP is rejected when the catalog item requires_delivery == true (delivery-only equipment cannot be picked up)"
    error_id: ERR_DELIVERY_REQUIRED
    http_status: 422
    applies_to: "POST /rental-yard/reservations, POST /rental-yard/reservations/{id}/pickup"
  - priority: 10
    category: business_temporal
    check: "no other active Reservation/Agreement on the same EquipmentUnit overlaps the requested [rental_start_date, rental_end_date] inclusive interval (closed-interval, adjacency is NOT overlap: end_date == other.start_date is allowed)"
    error_id: ERR_UNIT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /rental-yard/reservations"
  - priority: 11
    category: business_temporal
    check: "rental_start_date >= yard clock current date (cannot reserve in the past)"
    error_id: ERR_START_IN_PAST
    http_status: 422
    applies_to: "POST /rental-yard/reservations"
  - priority: 12
    category: business_safety
    check: "ContractorAccount.account_status == ACTIVE (SUSPENDED accounts cannot open reservations)"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /rental-yard/reservations"
  - priority: 13
    category: business_fiscal
    check: "credit_check_projection: outstanding_balance_cents + deposit_cents + estimated_total_cents <= ContractorAccount.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /rental-yard/reservations"
  - priority: 14
    category: business_constraint
    check: "dispatch requires fulfillment_method == DELIVERY; pickup requires fulfillment_method == PICKUP"
    error_id: ERR_WRONG_FULFILLMENT
    http_status: 422
    applies_to: "POST /rental-yard/reservations/{id}/dispatch, POST /rental-yard/reservations/{id}/pickup"
  - priority: 15
    category: business_constraint
    check: "on dispatch, delivery_window_end > delivery_window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /rental-yard/reservations/{id}/dispatch"
  - priority: 16
    category: business_temporal
    check: "the requested [delivery_window_start, delivery_window_end) interval, expanded by DeliveryTruck.buffer_minutes on each side, must not collide with another reservation's assigned window on the same truck (half-open interval, buffer-padded; adjacency within the buffer is a collision)"
    error_id: ERR_TRUCK_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /rental-yard/reservations/{id}/dispatch"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- RateCard ----
  - method: POST
    path: "/rental-yard/rate-cards"
    description: "Create a rate card."
    roles: [YardManager]
    code: 201
    input: [name, daily_rate_cents, weekly_rate_cents, four_week_rate_cents, deposit_cents, damage_waiver_daily_cents, fuel_refill_cents_per_liter, cleaning_fee_cents, late_fee_multiplier]
    output: RateCard
    side_effects: ["create RateCard with active=true, version=1"]
  - method: GET
    path: "/rental-yard/rate-cards/{id}"
    description: "Fetch a rate card."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: []
    output: RateCard
    side_effects: []
  - method: GET
    path: "/rental-yard/rate-cards"
    description: "List rate cards (paginated)."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  # ---- RentalCatalogItem ----
  - method: POST
    path: "/rental-yard/catalog-items"
    description: "Create a catalog item bound to an active rate card."
    roles: [YardManager]
    code: 201
    input: [rate_card_id, sku, name, category, "requires_delivery?", fuel_capacity_liters]
    output: RentalCatalogItem
    side_effects: ["validate rate card active", "compute unit_count=0, available_unit_count=0"]
  - method: GET
    path: "/rental-yard/catalog-items/{id}"
    description: "Fetch a catalog item with computed availability counts."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: []
    output: RentalCatalogItem
    side_effects: ["recompute unit_count, available_unit_count"]
  - method: GET
    path: "/rental-yard/catalog-items"
    description: "List/browse catalog items; filter by rate_card_id or category."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: ["rate_card_id?", "category?", "limit?", "offset?"]
    output: RentalCatalogItem[]
    side_effects: []

  # ---- EquipmentUnit ----
  - method: POST
    path: "/rental-yard/equipment-units"
    description: "Register a physical unit for a catalog item."
    roles: [YardManager]
    code: 201
    input: [catalog_item_id, asset_tag, service_due_at_days]
    output: EquipmentUnit
    side_effects: ["create EquipmentUnit AVAILABLE, fuel_level_liters=0, lifetime_rental_days=0, version=1"]
  - method: GET
    path: "/rental-yard/equipment-units/{id}"
    description: "Fetch a unit."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []
  - method: GET
    path: "/rental-yard/equipment-units"
    description: "List units; filter by catalog_item_id and/or availability_state."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: ["catalog_item_id?", "availability_state?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []

  # ---- ContractorAccount ----
  - method: POST
    path: "/rental-yard/contractor-accounts"
    description: "Open a contractor account."
    roles: [YardManager]
    code: 201
    input: [company_name, credit_limit_cents]
    output: ContractorAccount
    side_effects: ["create ContractorAccount ACTIVE, outstanding_balance_cents=0, open_reservation_count=0"]
  - method: GET
    path: "/rental-yard/contractor-accounts/{id}"
    description: "Fetch an account with computed balance/counts."
    roles: [YardManager, RentalAgent, Contractor]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["recompute outstanding_balance_cents, open_reservation_count"]
  - method: GET
    path: "/rental-yard/contractor-accounts"
    description: "List accounts (paginated)."
    roles: [YardManager, RentalAgent]
    code: 200
    input: ["account_status?", "limit?", "offset?"]
    output: ContractorAccount[]
    side_effects: []
  - method: POST
    path: "/rental-yard/contractor-accounts/{id}/suspend"
    description: "Suspend an account (blocks new reservations)."
    roles: [YardManager]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["set account_status=SUSPENDED", "increments ContractorAccount.version by 1"]
  - method: POST
    path: "/rental-yard/contractor-accounts/{id}/payments"
    description: "Record a payment that reduces the outstanding balance."
    roles: [YardManager, Contractor]
    code: 201
    input: [amount_cents]
    output: AccountLedgerEntry
    side_effects: ["post AccountLedgerEntry PAYMENT (amount_cents < 0)", "recompute outstanding_balance_cents"]
  - method: GET
    path: "/rental-yard/contractor-accounts/{id}/ledger"
    description: "List ledger entries for an account in created_at ASC order."
    roles: [YardManager, RentalAgent, Contractor]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: AccountLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/rental-yard/contractor-accounts/{id}/reservations"
    description: "List reservations for an account (reverse-reachability for Reservation.contractor_account_id)."
    roles: [YardManager, RentalAgent, Contractor]
    code: 200
    input: ["reservation_state?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  # ---- DeliveryTruck ----
  - method: POST
    path: "/rental-yard/delivery-trucks"
    description: "Register a delivery truck with a turnaround buffer."
    roles: [YardManager]
    code: 201
    input: [name, buffer_minutes]
    output: DeliveryTruck
    side_effects: ["create DeliveryTruck version=1"]
  - method: GET
    path: "/rental-yard/delivery-trucks/{id}"
    description: "Fetch a delivery truck."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: []
    output: DeliveryTruck
    side_effects: []
  - method: GET
    path: "/rental-yard/delivery-trucks"
    description: "List delivery trucks (paginated)."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: DeliveryTruck[]
    side_effects: []

  # ---- Reservation ----
  - method: POST
    path: "/rental-yard/reservations"
    description: "Confirm a future booking, holding a deposit; the unit's physical availability_state is NOT changed (a unit holds many non-overlapping bookings while AVAILABLE)."
    roles: [RentalAgent, Contractor]
    code: 201
    input: [contractor_account_id, catalog_item_id, "equipment_unit_id?", fulfillment_method, rental_start_date, rental_end_date, "damage_waiver_opted?"]
    output: Reservation
    side_effects:
      - "select EquipmentUnit (pinned by equipment_unit_id, else selector policy over AVAILABLE units of the catalog item with no overlapping booking, ranked by created_at ASC, empty pool -> ERR_NO_UNIT_AVAILABLE)"
      - "credit_check_projection on ContractorAccount"
      - "compute estimated_rental_cents, estimated_total_cents, delivery_fee_cents"
      - "post DEPOSIT_HOLD ledger entry; recompute account outstanding_balance_cents"
  - method: GET
    path: "/rental-yard/reservations/{id}"
    description: "Fetch a reservation."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/rental-yard/reservations"
    description: "List reservations; filter by equipment_unit_id, catalog_item_id, contractor_account_id, delivery_truck_id, reservation_state."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: ["equipment_unit_id?", "catalog_item_id?", "contractor_account_id?", "delivery_truck_id?", "reservation_state?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/rental-yard/reservations/{id}/cancel"
    description: "Cancel a CONFIRMED reservation; reverses the deposit hold and frees the unit."
    roles: [RentalAgent, Contractor]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "set reservation_state=CANCELLED"
      - "set EquipmentUnit.availability_state=AVAILABLE; increments EquipmentUnit.version by 1"
      - "post DEPOSIT_REFUND ledger entry; recompute account outstanding_balance_cents"
  - method: POST
    path: "/rental-yard/reservations/{id}/dispatch"
    description: "Dispatch a DELIVERY reservation onto a truck delivery window; opens the agreement and puts the unit ON_RENT."
    roles: [RentalAgent]
    code: 200
    input: [delivery_truck_id, delivery_window_start, delivery_window_end]
    output: Reservation
    side_effects:
      - "assign delivery_truck_id, delivery_window_start, delivery_window_end after buffered overlap check"
      - "set reservation_state=DISPATCHED_DELIVERY then ON_RENT"
      - "set EquipmentUnit.availability_state=ON_RENT, fuel_level_liters=capacity; increments EquipmentUnit.version by 1"
      - "open RentalAgreement ON_RENT (actual_start_date=clock, scheduled_end_date=rental_end_date, deposit_held_cents=card.deposit_cents)"
  - method: POST
    path: "/rental-yard/reservations/{id}/pickup"
    description: "Counter pickup for a PICKUP reservation; opens the agreement and puts the unit ON_RENT."
    roles: [RentalAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "set reservation_state=PICKED_UP then ON_RENT"
      - "set EquipmentUnit.availability_state=ON_RENT, fuel_level_liters=capacity; increments EquipmentUnit.version by 1"
      - "open RentalAgreement ON_RENT"

  # ---- RentalAgreement ----
  - method: GET
    path: "/rental-yard/rental-agreements/{id}"
    description: "Fetch an agreement with computed final charges (once returned)."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []
  - method: GET
    path: "/rental-yard/rental-agreements"
    description: "List agreements; filter by reservation_id, equipment_unit_id, contractor_account_id, agreement_state."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: ["reservation_id?", "equipment_unit_id?", "contractor_account_id?", "agreement_state?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []
  - method: GET
    path: "/rental-yard/rental-agreements/{id}/ledger-entries"
    description: "List ledger entries generated by this agreement (reverse-reachability for AccountLedgerEntry.rental_agreement_id)."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: AccountLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/rental-yard/rental-agreements/{id}/return"
    description: "Mark the unit physically returned; computes final rental + late fee and awaits inspection."
    roles: [RentalAgent]
    code: 200
    input: []
    output: RentalAgreement
    side_effects:
      - "set agreement_state=RETURNED_PENDING_INSPECTION"
      - "set actual_return_date=clock date"
      - "compute final_rental_cents (final variant) and late_fee_cents"

  # ---- ReturnInspection ----
  - method: POST
    path: "/rental-yard/return-inspections"
    description: "Inspect a returned unit; computes fuel/cleaning/damage, closes the agreement, posts the ledger, frees or services the unit."
    roles: [Inspector]
    code: 201
    input: [rental_agreement_id, return_fuel_level_liters, cleanliness, damage_assessed_cents]
    output: ReturnInspection
    side_effects:
      - "compute fuel_refill_cents, net_damage_cents"
      - "compute agreement final_total_cents; agreement -> CLOSED or CLOSED_WITH_DAMAGE"
      - "post RENTAL_CHARGE, LATE_FEE?, FUEL_CHARGE?, CLEANING_CHARGE?, DAMAGE_CHARGE?, DEPOSIT_REFUND ledger entries; recompute outstanding_balance_cents"
      - "Reservation -> FULFILLED"
      - "EquipmentUnit -> AVAILABLE or OUT_OF_SERVICE (+ MaintenanceTicket OPEN); add billed_days to lifetime_rental_days; increments EquipmentUnit.version by 1"
      - "create DamageCharge when net_damage_cents > 0 OR damage_assessed_cents > 0"
  - method: GET
    path: "/rental-yard/return-inspections/{id}"
    description: "Fetch an inspection."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: []
    output: ReturnInspection
    side_effects: []
  - method: GET
    path: "/rental-yard/return-inspections"
    description: "List inspections; filter by rental_agreement_id (reverse-reachability)."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: ["rental_agreement_id?", "limit?", "offset?"]
    output: ReturnInspection[]
    side_effects: []

  # ---- DamageCharge ----
  - method: GET
    path: "/rental-yard/damage-charges/{id}"
    description: "Fetch a damage charge."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: []
    output: DamageCharge
    side_effects: []
  - method: GET
    path: "/rental-yard/damage-charges"
    description: "List damage charges; filter by rental_agreement_id or return_inspection_id (reverse-reachability)."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: ["rental_agreement_id?", "return_inspection_id?", "limit?", "offset?"]
    output: DamageCharge[]
    side_effects: []

  # ---- MaintenanceTicket ----
  - method: POST
    path: "/rental-yard/maintenance-tickets"
    description: "Manually pull an AVAILABLE unit out of service."
    roles: [YardManager]
    code: 201
    input: [equipment_unit_id, reason]
    output: MaintenanceTicket
    side_effects:
      - "set EquipmentUnit.availability_state=OUT_OF_SERVICE; increments EquipmentUnit.version by 1"
      - "create MaintenanceTicket OPEN"
  - method: GET
    path: "/rental-yard/maintenance-tickets/{id}"
    description: "Fetch a maintenance ticket."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: []
  - method: GET
    path: "/rental-yard/maintenance-tickets"
    description: "List tickets; filter by equipment_unit_id, opened_by_agreement_id, ticket_state."
    roles: [YardManager, RentalAgent, Inspector]
    code: 200
    input: ["equipment_unit_id?", "opened_by_agreement_id?", "ticket_state?", "limit?", "offset?"]
    output: MaintenanceTicket[]
    side_effects: []
  - method: POST
    path: "/rental-yard/maintenance-tickets/{id}/resolve"
    description: "Resolve an OPEN ticket; frees the unit if it was its last open ticket."
    roles: [YardManager]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects:
      - "set ticket_state=RESOLVED"
      - "if no other OPEN ticket on the unit, set EquipmentUnit.availability_state=AVAILABLE; increments EquipmentUnit.version by 1"

  # ---- YardClock (test-driving) ----
  - method: POST
    path: "/rental-yard/_clock/set_current_utc"
    description: "Set the simulated current UTC clock (test-driving)."
    roles: [YardManager]
    code: 200
    input: [to_iso8601]
    output: YardClock
    side_effects: ["set YardClock.current_utc = to_iso8601"]
  - method: GET
    path: "/rental-yard/_clock"
    description: "Read the current simulated clock."
    roles: [YardManager, RentalAgent, Contractor, Inspector]
    code: 200
    input: []
    output: YardClock
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed auth headers on a write endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_ACCOUNT_OWNER
    http: 403
    condition: "Contractor acting on a reservation/account whose contractor_account_id != X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad type, invalid enum, or rental_end_date < rental_start_date"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "sku or asset_tag already exists"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a state from which the requested transition is defined"
  - id: ERR_UNIT_NOT_AVAILABLE
    http: 409
    condition: "the chosen EquipmentUnit is OUT_OF_SERVICE on reservation create, or not AVAILABLE right now on dispatch/pickup"
  - id: ERR_DELIVERY_REQUIRED
    http: 422
    condition: "PICKUP fulfillment requested for a catalog item with requires_delivery == true"
  - id: ERR_UNIT_DOUBLE_BOOKED
    http: 409
    condition: "requested rental interval overlaps an existing active reservation/agreement on the same unit"
  - id: ERR_TRUCK_DOUBLE_BOOKED
    http: 409
    condition: "requested delivery window (buffer-padded) collides with another window on the same truck"
  - id: ERR_START_IN_PAST
    http: 422
    condition: "rental_start_date earlier than the yard clock current date"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "ContractorAccount.account_status == SUSPENDED on reservation create"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "projected balance (outstanding + deposit + estimated_total) exceeds credit_limit_cents"
  - id: ERR_WRONG_FULFILLMENT
    http: 422
    condition: "dispatch on a PICKUP reservation, or pickup on a DELIVERY reservation"
  - id: ERR_NO_UNIT_AVAILABLE
    http: 409
    condition: "reservation create omitted equipment_unit_id and no AVAILABLE unit of the catalog item is free for the interval (empty candidate pool)"
  - id: ERR_VALIDATION_LIMIT
    http: 400
    condition: "pagination limit/offset out of bounds (limit < 1, limit > 100, offset < 0)"
  - id: ERR_PAYMENT_NOT_NEGATIVE
    http: 422
    condition: "payment amount_cents is not strictly negative"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: YardManager
    description: "Owns catalog, pricing, equipment registration, account opening/suspension, and maintenance."
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-yard/rate-cards"
      - "POST /rental-yard/catalog-items"
      - "POST /rental-yard/equipment-units"
      - "POST /rental-yard/contractor-accounts"
      - "POST /rental-yard/contractor-accounts/{id}/suspend"
      - "POST /rental-yard/delivery-trucks"
      - "POST /rental-yard/maintenance-tickets"
      - "POST /rental-yard/maintenance-tickets/{id}/resolve"
      - "POST /rental-yard/_clock/set_current_utc"
    shared_operations:
      - "POST /rental-yard/contractor-accounts/{id}/payments (with Contractor)"
      - "all GET reads"
  - name: RentalAgent
    description: "Front-counter operator: creates reservations, dispatches/picks up, marks returns."
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-yard/reservations/{id}/dispatch"
      - "POST /rental-yard/reservations/{id}/pickup"
      - "POST /rental-yard/rental-agreements/{id}/return"
    shared_operations:
      - "POST /rental-yard/reservations (with Contractor)"
      - "POST /rental-yard/reservations/{id}/cancel (with Contractor)"
      - "all GET reads"
  - name: Contractor
    description: "Customer acting on their own account; may self-serve reservations, cancel, pay."
    identity: "entity_backed:ContractorAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /rental-yard/reservations (with RentalAgent; must be own account)"
      - "POST /rental-yard/reservations/{id}/cancel (with RentalAgent; must own)"
      - "POST /rental-yard/contractor-accounts/{id}/payments (with YardManager; must own)"
      - "GET reads scoped to own account/reservations/agreements"
  - name: Inspector
    description: "Performs return inspections that finalize charges and close agreements."
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-yard/return-inspections"
    shared_operations:
      - "all GET reads"
