      - name: minimum_certified_weight_uses_sex_specific_floor_constant
        claim_type: constants_applied
        grounds:
          - calculations.minimum_certified_weight.constants
          - entities.Season.fields.min_body_fat_pct_female
          - entities.Wrestler.fields.sex
        distinguishing_aspect: "Two wrestlers with byte-identical measurements (130.0 lbs, 12.0% body fat) diverge purely on the sex-selected floor constant: the female floor 12.0 yields minimum 130.0 -> class 132, while the male floor 7.0 yields 123.0 -> class 126. Same inputs, different constant, two classes apart."
        test_recipe:
          setup:
            - "Open season with the default floors (male 7.0, female 12.0), one team, one CERTIFIED assessor, one female and one male wrestler."
          setup_api_calls:
            - call: "POST /seasons"
