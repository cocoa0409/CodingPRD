# =============================================================================
# Task 1816 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances. Every chain replays from empty-DB using only
# SCAFFOLD.yaml §1.5 endpoints. Fixture constants:
#   seat_count 200, MAJOR_METRO occ 0.40, EVENING x1.20, MATINEE x0.80,
#   PG13 demand 1.10, opening x1.25 (release 2026-08-10, window [08-10,08-17])
#   => opening evening forecast 132, standard evening 105, opening matinee 88
#   cpm 2500 => per-line cents = round_half_up(impr x 2.5)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_audited_billing
        grounds:
          - calculations.provisional_invoice_amount
          - calculations.audited_invoice_amount
          - entities.Invoice.fields.provisional_amount_cents
          - entities.Invoice.fields.audited_amount_cents
        distinguishing_aspect: |
          Invoice domain: the same slot produces provisional_impressions=132 /
          provisional_amount_cents=330 from the forecast variant at creation, but
          audited_impressions=175 / audited_amount_cents=438 from the
          attendance-based variant at certification — two valid algorithms over
          identical booking data yielding different money on the Invoice entity.
        test_recipe:
          setup:
            - "MAJOR_METRO theater, 200-seat screen, PG13 feature released 2026-08-10, showtime 2026-08-14T19:00:00Z (opening-week evening => forecast 132)"
            - "NATIONAL AUTOMOTIVE campaign APPROVED, cpm 2500, contracted 100000, flight 2026-08-10..2026-08-20"
            - "one slot CONFIRMED via reel lock; reel DELIVERED; attendance 175 ACCEPTED; playlog VERIFIED; invoice DRAFT then ISSUED then CERTIFIED"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 100000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { slot_id: "$.data.id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps }
            - { call: "POST /network/reels/${r_id}/dispatch", payload: {}, as: NetworkOps }
            - { call: "POST /network/reels/${r_id}/acknowledge-delivery", payload: { outcome: DELIVERED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T21:30:00Z" }, as: NetworkOps }
            - { call: "POST /network/showtimes/${st_id}/attendance-reports", payload: { reported_attendance: 175 }, as: TheaterOps, as_user_id: "${t_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /network/attendance-reports/${ar_id}/review", payload: { decision: ACCEPT }, as: NetworkOps }
            - { call: "POST /network/slots/${slot_id}/playlogs", payload: { outcome: VERIFIED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/campaigns/${c_id}/invoices", payload: { period_start_date: "2026-08-10", period_end_date: "2026-08-20" }, as: SalesManager, captures: { inv_id: "$.data.id" } }
            - { call: "POST /network/invoices/${inv_id}/issue", payload: {}, as: SalesManager, as_user_id: "sm-2" }
          trigger:
            - { call: "POST /network/invoices/${inv_id}/certify", payload: {}, as: Auditor, as_user_id: "aud-1" }
          assert:
            - "Invoice.${inv_id}.provisional_impressions == 132"
            - "Invoice.${inv_id}.provisional_amount_cents == 330"
            - "Invoice.${inv_id}.audited_impressions == 175"
            - "Invoice.${inv_id}.audited_amount_cents == 438"
            - "Invoice.${inv_id}.final_amount_cents == 438"
            - "Invoice.${inv_id}.provisional_amount_cents != Invoice.${inv_id}.audited_amount_cents"

      - name: forecast_opening_week_vs_standard
        grounds:
          - calculations.forecast_attendance
          - entities.Showtime.fields.forecast_attendance
        distinguishing_aspect: |
          Showtime domain (distinct from the Invoice billing domain of the sibling
          instance): identical screen/feature/hour inputs yield forecast 132 under
          the OPENING_WEEK variant (showtime 2026-08-14, 4 days after release) but
          105 under the STANDARD variant (showtime 2026-08-25, 15 days after release).
        test_recipe:
          setup:
            - "MAJOR_METRO theater, 200-seat screen, PG13 feature released 2026-08-10"
            - "two evening showtimes on the same screen: 2026-08-14 (inside opening window) and 2026-08-25 (outside)"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_open: "$.data.id", fc_open: "$.data.forecast_attendance" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-25T19:00:00Z" }, as: NetworkOps, captures: { fc_std: "$.data.forecast_attendance" } }
          assert:
            - "Showtime.${st_open}.forecast_attendance == 132 (OPENING_WEEK variant: floor(200 x 0.40 x 1.20 x 1.10 x 1.25))"
            - "second showtime forecast_attendance == 105 (STANDARD variant: floor(200 x 0.40 x 1.20 x 1.10))"
            - "the two forecasts differ for identical seat_count, market_tier, daypart, and content_rating"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: forecast_multi_factor_conditional_branch
        grounds:
          - calculations.forecast_attendance
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction and a
          conditional branch on entity state — seat_count x tier occupancy x
          daypart factor x rating demand, times 1.25 only when the showtime date
          falls in the opening-week branch; opening MATINEE yields 88 while
          opening EVENING yields 132 for the same screen and feature.
        test_recipe:
          setup:
            - "MAJOR_METRO theater, 200-seat screen, PG13 feature released 2026-08-10"
            - "matinee (14:00 UTC) and evening (19:00 UTC) showtimes on 2026-08-14, both inside the opening-week branch"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T14:00:00Z" }, as: NetworkOps, captures: { st_mat: "$.data.id", fc_mat: "$.data.forecast_attendance" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { fc_eve: "$.data.forecast_attendance" } }
          assert:
            - "Showtime.${st_mat}.daypart == MATINEE and forecast_attendance == 88 (floor(200 x 0.40 x 0.80 x 1.10 x 1.25))"
            - "evening showtime daypart == EVENING and forecast_attendance == 132 (floor(200 x 0.40 x 1.20 x 1.10 x 1.25))"
            - "only the daypart factor input changed; the ratio 132/88 != 1.20/0.80 after floor, confirming non-linear floor-after-multiply ordering"

      - name: invoice_per_line_then_sum_rounding
        grounds:
          - calculations.audited_invoice_amount
          - entities.Invoice.fields.audited_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from the sibling's mode (a)): the
          scaffold pins round-per-line-then-sum — lines 437.5 -> 438 and
          217.5 -> 218 total 656 cents, whereas sum-then-round would give 655;
          the test pins 656, proving rounding order.
        test_recipe:
          setup:
            - "one STRICT campaign with two slots on two different showtimes (2026-08-14 and 2026-08-15, both opening-week evenings, forecast 132 each)"
            - "both reels LOCKED/DELIVERED; both showtimes report actual 175 ACCEPTED; slot1 VERIFIED (175 attributable), slot2 PARTIAL (floor(175 x 0.5) = 87 attributable)"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st1: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-15T19:00:00Z" }, as: NetworkOps, captures: { st2: "$.data.id" } }
            - { call: "GET /network/showtimes/${st1}/reel", payload: {}, as: NetworkOps, captures: { r1: "$.data[0].id", rv1: "$.data[0].version" } }
            - { call: "GET /network/showtimes/${st2}/reel", payload: {}, as: NetworkOps, captures: { r2: "$.data[0].id", rv2: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r1}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv1}" }, as: SalesManager, captures: { sl1: "$.data.id" } }
            - { call: "POST /network/reels/${r2}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv2}" }, as: SalesManager, captures: { sl2: "$.data.id" } }
            - { call: "GET /network/reels/${r1}", payload: {}, as: NetworkOps, captures: { rv1b: "$.data.version" } }
            - { call: "GET /network/reels/${r2}", payload: {}, as: NetworkOps, captures: { rv2b: "$.data.version" } }
            - { call: "POST /network/reels/${r1}/lock", payload: { expected_reel_version: "${rv1b}" }, as: NetworkOps }
            - { call: "POST /network/reels/${r2}/lock", payload: { expected_reel_version: "${rv2b}" }, as: NetworkOps }
            - { call: "POST /network/reels/${r1}/dispatch", payload: {}, as: NetworkOps }
            - { call: "POST /network/reels/${r2}/dispatch", payload: {}, as: NetworkOps }
            - { call: "POST /network/reels/${r1}/acknowledge-delivery", payload: { outcome: DELIVERED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/reels/${r2}/acknowledge-delivery", payload: { outcome: DELIVERED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T21:30:00Z" }, as: NetworkOps }
            - { call: "POST /network/showtimes/${st1}/attendance-reports", payload: { reported_attendance: 175 }, as: TheaterOps, as_user_id: "${t_id}", captures: { ar1: "$.data.id" } }
            - { call: "POST /network/showtimes/${st2}/attendance-reports", payload: { reported_attendance: 175 }, as: TheaterOps, as_user_id: "${t_id}", captures: { ar2: "$.data.id" } }
            - { call: "POST /network/attendance-reports/${ar1}/review", payload: { decision: ACCEPT }, as: NetworkOps }
            - { call: "POST /network/attendance-reports/${ar2}/review", payload: { decision: ACCEPT }, as: NetworkOps }
            - { call: "POST /network/slots/${sl1}/playlogs", payload: { outcome: VERIFIED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/slots/${sl2}/playlogs", payload: { outcome: PARTIAL }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/campaigns/${c_id}/invoices", payload: { period_start_date: "2026-08-10", period_end_date: "2026-08-20" }, as: SalesManager, captures: { inv_id: "$.data.id" } }
            - { call: "POST /network/invoices/${inv_id}/issue", payload: {}, as: SalesManager, as_user_id: "sm-2" }
          trigger:
            - { call: "POST /network/invoices/${inv_id}/certify", payload: {}, as: Auditor, as_user_id: "aud-1" }
          assert:
            - "Invoice.${inv_id}.audited_impressions == 262 (175 + 87)"
            - "Invoice.${inv_id}.audited_amount_cents == 656 (round_half_up(175x2.5)=438 plus round_half_up(87x2.5)=218)"
            - "audited_amount_cents != 655, the sum-then-round result (round_half_up(262 x 2.5))"
            - "Invoice.${inv_id}.provisional_amount_cents == 660 (two forecast lines of 330)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: campaign_revision_cycle
        grounds:
          - state_machines.Campaign.SUBMITTED_to_REJECTED
          - state_machines.Campaign.REJECTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic machine on Campaign: SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED
          -> APPROVED traverses the revision loop and exits forward; each state's
          re-entry is observable.
        test_recipe:
          setup: ["advertiser ACTIVE; campaign created by sm-1 in DRAFT"]
          setup_api_calls:
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/reject", payload: { reason: "rate too low" }, as: SalesManager, as_user_id: "sm-2" }
          trigger:
            - { call: "PATCH /network/campaigns/${c_id}", payload: { name: "C1-revised" }, as: SalesManager, as_user_id: "sm-1", captures: { st_after_patch: "$.data.campaign_status" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2", captures: { st_final: "$.data.campaign_status" } }
          assert:
            - "after reject: Campaign.${c_id}.campaign_status == REJECTED"
            - "after PATCH: campaign_status == DRAFT and name == C1-revised (revision loop REJECTED -> DRAFT)"
            - "after resubmit + approve: campaign_status == APPROVED and approved_by_user_id == sm-2"

      - name: invoice_parallel_dimensions
        grounds:
          - state_machines.Invoice
          - entities.Invoice.fields.billing_status
          - entities.Invoice.fields.audit_status
        distinguishing_aspect: |
          Parallel state dimensions on Invoice (distinct entity from the cyclic
          Campaign of the sibling instance): billing moves DRAFT -> ISSUED while
          audit stays UNAUDITED; settle is gated on the audit dimension alone
          (ERR_INVOICE_NOT_SETTLABLE until CERTIFIED), and void is permitted only
          while UNAUDITED.
        test_recipe:
          setup:
            - "aired slot chain complete (slot PLAYED, attendance 175 ACCEPTED); invoice DRAFT"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { slot_id: "$.data.id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: NetworkOps, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/lock", payload: { expected_reel_version: "${rv2}" }, as: NetworkOps }
            - { call: "POST /network/reels/${r_id}/dispatch", payload: {}, as: NetworkOps }
            - { call: "POST /network/reels/${r_id}/acknowledge-delivery", payload: { outcome: DELIVERED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T21:30:00Z" }, as: NetworkOps }
            - { call: "POST /network/showtimes/${st_id}/attendance-reports", payload: { reported_attendance: 175 }, as: TheaterOps, as_user_id: "${t_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /network/attendance-reports/${ar_id}/review", payload: { decision: ACCEPT }, as: NetworkOps }
            - { call: "POST /network/slots/${slot_id}/playlogs", payload: { outcome: VERIFIED }, as: TheaterOps, as_user_id: "${t_id}" }
            - { call: "POST /network/campaigns/${c_id}/invoices", payload: { period_start_date: "2026-08-10", period_end_date: "2026-08-20" }, as: SalesManager, captures: { inv_id: "$.data.id" } }
            - { call: "POST /network/invoices/${inv_id}/issue", payload: {}, as: SalesManager, as_user_id: "sm-2" }
          trigger:
            - { call: "POST /network/invoices/${inv_id}/settle", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /network/invoices/${inv_id}/certify", payload: {}, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /network/invoices/${inv_id}/settle", payload: {}, as: SalesManager, captures: { inv_after: "$.data.billing_status" } }
          assert:
            - "before certify: billing_status == ISSUED while audit_status == UNAUDITED (dimensions evolve independently)"
            - "first settle rejected: error_id == ERR_INVOICE_NOT_SETTLABLE (audit dimension gates the billing transition)"
            - "after certify: audit_status == CERTIFIED, then settle succeeds and billing_status == SETTLED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: audit_revision_cascade_depth3
        grounds:
          - state_machines.AttendanceReport.ACCEPTED_to_AUDITED
          - calculations.attributed_impressions
          - entities.Campaign.fields.delivered_impressions
        distinguishing_aspect: |
          Depth-3 chain with a distinct trigger (attendance audit): audit(150) ->
          Showtime.actual_attendance 175 -> 150; that mutation recomputes
          ReelSlot.attributed_impressions 175 -> 150; that recomputation drops
          Campaign.delivered_impressions 175 -> 150. Each link is caused by the
          previous link, not by the audit call directly.
        test_recipe:
          setup:
            - "aired chain: slot PLAYED (VERIFIED), attendance report ACCEPTED at 175, campaign.delivered_impressions == 175"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
