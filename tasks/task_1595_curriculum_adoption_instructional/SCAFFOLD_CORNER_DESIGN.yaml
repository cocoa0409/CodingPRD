        grounds: ["entities.AdoptionCycle.fields.quote_version_pin"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / po_create_requires_selected_pinned_quote
          rationale: "That instance asserts the pin is set at award, blocks PO creation for unpinned quotes, and asserts the pin clears when the selected quote leaves SELECTED."

