              payload: { lot_id: "${lot_id}", quantity_units: 10 }
              as: FreshClerk
            - call: "POST /fresh/donation-pickups/${pickup_chilled}/assignments"
              payload: { lot_id: "${lot_id}", quantity_units: 10 }
              as: FreshClerk
              captures: { line_ok: $.data.id }
          assert:
