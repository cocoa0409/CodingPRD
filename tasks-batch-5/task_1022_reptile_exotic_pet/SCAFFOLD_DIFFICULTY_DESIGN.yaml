              payload: {}
              as: SalesAssociate
          assert:
            - "Shipment.${ship_id}.status == REVERSED"
            - "Shipment.${ship_id}.reversed_reason == MANUAL"
            - "FeederBatch.${b1}.quantity_on_hand == 30"
            - "FeederBatch.${b1}.status == AVAILABLE"

      - name: available_animal_conservation_confirm_then_void
        grounds:
