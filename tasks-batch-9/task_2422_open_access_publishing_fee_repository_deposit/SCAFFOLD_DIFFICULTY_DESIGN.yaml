            - "Article.${a5_id}.compliance_status == EMBARGOED"
            - "Article.${a5_id}.latest_deposit_ordinal == 1"
            - "Grant.${g5_id}.output_count == 1"
            - "Grant.${g5_id}.compliant_output_count == 0"
            - "Grant.${g5_id}.mandate_status == IN_PROGRESS"
