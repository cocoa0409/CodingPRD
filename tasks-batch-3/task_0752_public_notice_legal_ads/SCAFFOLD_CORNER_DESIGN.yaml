  # =========================================================================
  # SECTION: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_reschedule_conflict
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[schedule-create-stale-notice]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: |
          After a first successful reschedule advances notice.version, a second reschedule still
          carrying the pre-advance expected_notice_version is rejected ERR_STALE_VERSION (412). Two
          strictly sequential requests; the second quotes a stale version.
        test_recipe:
          setup: ["A PROBATE notice SCHEDULED (insertions on 03-01/03-08, none published)"]
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v0: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v0}" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v1: "$.data.version"}
          trigger:
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v1}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v1}" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "the second trigger call returns response.error_id == ERR_STALE_VERSION"
            - "the second trigger call returns response.http_status == 412"

