          setup:
            - "FilingSeason 2026 OPEN; ControlledGroup DETERMINED_ALE with open_correction_count 0; GroupMember with measurement_method MONTHLY; one employee."
            - "The employee's ORIGINAL Form1095C was generated by preparer-1 and furnished PAPER by preparer-2 at clock 2027-01-10, so furnishing_status is FURNISHED_PAPER."
            - "Transmittal T1 holds that form, was built by preparer-1 and transmitted PAPER by agent-1, so its status is TRANSMITTED and the form's filing_status is PENDING_FILING."
