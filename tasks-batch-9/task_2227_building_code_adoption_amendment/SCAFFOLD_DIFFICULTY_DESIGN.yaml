  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: hearing_sixty_minute_buffer_rejects_thirty_minute_gap_accepts_exact_sixty
        grounds:
          - validations[priority=16]
          - errors.ERR_HEARING_TIME_CONFLICT
          - entities.Hearing.fields.scheduled_start
          - entities.Hearing.fields.scheduled_end
          - entities.DisciplineCommittee.fields.status
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) expanded by HEARING_BUFFER_MINUTES 60
          on BOTH sides, resource = DisciplineCommittee: a hearing starting 30 minutes after
          another ends is rejected, while one starting exactly 60 minutes after is accepted.
          The sibling instance uses zero buffer and aggregate capacity instead.
        test_recipe:
          setup:
            - "CodeCycle 2027 in DRAFT with one SEATED ENERGY committee of 6 voting seats."
            - "One SCHEDULED Hearing for that committee spanning 2026-10-05T14:00:00Z to 2026-10-05T17:00:00Z, whose buffered footprint is 13:00Z to 18:00Z."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_hearA
          trigger:
            - call: "POST /hearings"
              payload: { committee_id: "${cte_id}", scheduled_start: "2026-10-05T17:30:00Z", scheduled_end: "2026-10-05T19:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /hearings"
              payload: { committee_id: "${cte_id}", scheduled_start: "2026-10-05T18:00:00Z", scheduled_end: "2026-10-05T19:30:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
              captures: { hear_gap60_id: $.data.id }
          assert:
            - "trigger call 1 response.status == 409"
            - "trigger call 1 response.data.error_id == ERR_HEARING_TIME_CONFLICT"
            - "trigger call 2 response.status == 201"
            - "Hearing.${hear_gap60_id}.status == SCHEDULED"
            - "Hearing.${hear_gap60_id}.scheduled_start == 2026-10-05T18:00:00Z"
            - "GET /discipline-committees/${cte_id}/hearings returns total_count == 2"

