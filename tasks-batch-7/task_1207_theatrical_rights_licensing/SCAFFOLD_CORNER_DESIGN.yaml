# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_1207_theatrical_rights_licensing
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_title_with_all_required_fields_returns_201
        claim_type: creation
        grounds: ["entities.Title", "endpoint:POST /licensing/titles"]
        distinguishing_aspect: "POST /licensing/titles with all required fields returns 201 + full Title in response"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/titles"
              payload: { name: "Hamlet", author: "Shakespeare", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Title.status == ACTIVE"
            - "Title.version == 1"

      - name: get_title_by_id_returns_stored_data
        claim_type: retrieval
        grounds: ["entities.Title", "endpoint:GET /licensing/titles/{title_id}"]
        distinguishing_aspect: "GET returns the same name/author as POSTed"
        test_recipe:
          setup: ["Title exists"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "Hamlet", author: "Shakespeare", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
          trigger:
            - call: "GET /licensing/titles/${title_id}"
              payload: {}
              as: RightsAdmin
          assert:
            - "Title.name == 'Hamlet'"
            - "Title.author == 'Shakespeare'"

      - name: get_title_missing_returns_404
        claim_type: not_found
        grounds: ["endpoint:GET /licensing/titles/{title_id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on non-existent UUID returns ERR_NOT_FOUND 404"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "GET /licensing/titles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RightsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_title_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Title.fields.name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field `name` returns ERR_INVALID_REQUEST 400"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/titles"
              payload: { author: "X", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: title_invalid_enum_title_kind_rejected
        claim_type: type_constraint
        grounds: ["entities.Title.fields.title_kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "title_kind='OPERA' not in enum -> ERR_INVALID_REQUEST"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "OPERA", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: list_titles_pagination_defaults
        claim_type: listing
        grounds: ["endpoint:GET /licensing/titles", "response_envelope"]
        distinguishing_aspect: "GET /licensing/titles returns paginated envelope with limit/offset/total_count/has_more"
        test_recipe:
          setup: ["Two titles exist"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "A", author: "X", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "B", author: "Y", title_kind: "MUSICAL", royalty_basis: "HYBRID", base_flat_fee_cents: 70000, gross_percent_bp: 500, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 25000, late_fee_per_day_cents: 600, restricted_late_fee_per_day_cents: 1800, recording_royalty_flat_cents: 40000 }
              as: RightsAdmin
          trigger:
            - call: "GET /licensing/titles"
              payload: {}
              as: RightsAdmin
          assert:
            - "response contains total_count == 2"
            - "response contains has_more == false"
            - "default limit == 10"

      - name: computed_field_quoted_royalty_total_set_by_system
        claim_type: computed_field
        grounds: ["entities.LicenseAgreement.fields.quoted_royalty_total_cents"]
        distinguishing_aspect: "Client-supplied quoted_royalty_total_cents is ignored on approve; server computes via performance_royalty QUOTED"
        test_recipe:
          setup: ["Application UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id, quoted: $.data.quoted_royalty_total_cents }
          assert:
            - "quoted_royalty_total_cents == 50000 (tier1 mult 1.0 * amateur mult 1.0 * base 50000 * 1 perf)"
            - "Field was not influenced by any client input"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: application_initial_state_is_draft
        claim_type: initial_state
        grounds: ["state_machines.LicenseApplication"]
        distinguishing_aspect: "New LicenseApplication starts in DRAFT"
        test_recipe:
          setup: ["Title and Org exist"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
          assert:
            - "LicenseApplication.status == DRAFT"
            - "review_round == 0"

      - name: reject_from_terminal_state_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.LicenseApplication", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal; calling reject again fails"
        test_recipe:
          setup: ["Application REJECTED"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/reject"
              payload: { reason: "Insufficient info" }
              as: LicensingOfficer
          trigger:
            - call: "POST /licensing/applications/${app_id}/reject"
              payload: { reason: "Again" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: rental_terminal_returned_blocks_further_transitions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.MaterialRental"]
        distinguishing_aspect: "RETURNED rental rejects ship/mark_received/ship_return attempts"
        test_recipe:
          setup: ["Rental fully returned"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-05-15T19:00:00Z", last_performance_date: "2026-05-15T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/rentals"
              payload: { agreement_id: "${agreement_id}", scripts_qty: 5, scores_qty: 0, due_date: "2026-06-10T00:00:00Z" }
              as: MaterialsClerk
              captures: { rental_id: $.data.id }
            - call: "POST /licensing/rentals/${rental_id}/ship"
              payload: {}
              as: MaterialsClerk
            - call: "POST /licensing/rentals/${rental_id}/mark_received"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/rentals/${rental_id}/ship_return"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/rentals/${rental_id}/receive_return"
              payload: {}
              as: MaterialsClerk
          trigger:
            - call: "POST /licensing/rentals/${rental_id}/ship"
              payload: {}
              as: MaterialsClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: fine_waiver_side_effect_restores_org_standing
        claim_type: side_effect_execution
        grounds: ["state_machines.Fine.ASSESSED_to_WAIVED", "entities.Organization.fields.standing"]
        distinguishing_aspect: "Waiving the last ASSESSED fine flips Organization.standing SUSPENDED -> GOOD"
        test_recipe:
          setup: ["Org SUSPENDED via breach fine (breach fine not waivable, so use overdue fine path instead)"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-05-15T19:00:00Z", last_performance_date: "2026-05-15T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/rentals"
              payload: { agreement_id: "${agreement_id}", scripts_qty: 5, scores_qty: 0, due_date: "2026-05-20T00:00:00Z" }
              as: MaterialsClerk
              captures: { rental_id: $.data.id }
            - call: "POST /licensing/rentals/${rental_id}/ship"
              payload: {}
              as: MaterialsClerk
            - call: "POST /licensing/rentals/${rental_id}/mark_received"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/rentals/${rental_id}/ship_return"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/rentals/${rental_id}/receive_return"
              payload: {}
              as: MaterialsClerk
              captures: { late_fee: $.data.accrued_late_fee_cents }
            - call: "GET /licensing/fines"
              payload: { organization_id: "${org_id}", status: "ASSESSED" }
              as: FinanceOfficer
              captures: { fine_id: "$.data[0].id" }
          trigger:
            - call: "POST /licensing/fines/${fine_id}/waive"
              payload: {}
              as: FinanceOfficer
          assert:
            - "Fine.status == WAIVED"
            - "Organization.standing == GOOD (last ASSESSED fine resolved)"

      - name: invalid_transition_approve_from_draft
        claim_type: invalid_transition
        grounds: ["state_machines.LicenseApplication", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve from DRAFT (skipping SUBMITTED and UNDER_REVIEW) -> ERR_INVALID_STATE"
        test_recipe:
          setup: ["Application in DRAFT"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: classification_rule_paid_performers_makes_professional
        claim_type: correct_result
        grounds: ["calculations.classification_rule"]
        distinguishing_aspect: "performers_compensated=true forces PROFESSIONAL regardless of org_kind"
        test_recipe:
          setup: ["Community org, performers_compensated=true"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
