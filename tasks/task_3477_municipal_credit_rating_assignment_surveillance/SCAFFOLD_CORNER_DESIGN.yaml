        distinguishing_aspect: "The below-quorum branch of close: exactly 2 votes (< QUORUM_MIN_VOTES 3) lands ADJOURNED with QUORUM_NOT_MET, leaves the engagement COMMITTEE_READY, and creates no Rating — complementing the exactly-3 boundary instance in §1.8."
