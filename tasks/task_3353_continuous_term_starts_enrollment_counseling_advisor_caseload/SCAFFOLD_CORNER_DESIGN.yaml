# =============================================================================
# §1.9 Scaffold Corner Design — Continuous Term Enrollment
# Breadth coverage of §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ----------------------------------------------------------- entities
  - section: entities
    instances:
      - name: staff_compensation_plan_defaults_to_non_incentive
        claim_type: defaults
        grounds: [entities.Staff.fields.compensation_plan]
        distinguishing_aspect: "Omitting compensation_plan on POST /api/staff yields NON_INCENTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/staff"
              payload: { full_name: "Cal Counselor", email: "c@x.com", staff_type: "COUNSELOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { sid: "$.data.id" }
          assert:
            - "Staff.${sid}.compensation_plan == NON_INCENTIVE"

      - name: term_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Term.fields.census_date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/terms without census_date -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http 400"

      - name: term_date_ordering_violation_returns_term_date_invalid
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors[ERR_TERM_DATE_INVALID]"]
        distinguishing_aspect: "add_drop_end_date after census_date violates start < add_drop <= census < end -> ERR_TERM_DATE_INVALID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-20", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_TERM_DATE_INVALID (422)"

      - name: get_nonexistent_enrollment_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/enrollments/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/enrollments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: applications_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints.GET /api/applications]
        distinguishing_aspect: "GET /api/applications with limit 2 over 3 rows -> total_count 3, has_more true, 2 items."
        test_recipe:
          setup:
            - "Program, CO AUTHORIZED, term ENROLLMENT_OPEN; three applicants each with one SUBMITTED application"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "P1", email: "p1@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap1: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap1}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap1}"
            - call: "POST /api/applicants"
              payload: { full_name: "P2", email: "p2@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap2: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap2}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap2}"
            - call: "POST /api/applicants"
              payload: { full_name: "P3", email: "p3@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap3: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap3}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap3}"
          trigger:
            - call: "GET /api/applications"
              payload: { limit: 2, offset: 0 }
              as: RegistrarAdmin
          assert:
            - "response data has 2 items, meta pagination total_count == 3, has_more == true"

      - name: tce_computed_degree_path_fields
        claim_type: computed_fields
        grounds: [calculations.degree_path_remaining, entities.TransferCreditEvaluation.fields.remaining_credits]
        distinguishing_aspect: "accepted 100 in-progress 6 on a 120-credit program -> capped 90, remaining 24; client-sent capped_credits input is ignored."
        test_recipe:
          setup: ["Program 120 credits; open term; applicant with SUBMITTED application"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "P", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { a: "$.data.id" }
          trigger:
            - call: "POST /api/applications/${a}/transfer-credit-evaluations"
              payload: { accepted_credits: 100, in_progress_credits: 6 }
              as: RegistrarAdmin
              captures: { t: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${t}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${t}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
              captures: { capped: "$.data.capped_credits", rem: "$.data.remaining_credits" }
          assert:
            - "TransferCreditEvaluation.${t}.capped_credits == 90"
            - "TransferCreditEvaluation.${t}.remaining_credits == 24"

      - name: counselor_selector_empty_pool_leaves_unassigned
        claim_type: computed_fields
        grounds: [calculations.counselor_assignment, entities.Applicant.fields.assigned_counselor_id]
        distinguishing_aspect: "No counselor staff exist -> applicant created with assigned_counselor_id == null (empty-pool fallback, no error)."
        test_recipe:
          setup: ["empty DB (no staff)"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/applicants"
              payload: { full_name: "Solo", email: "s@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap: "$.data.id", cns: "$.data.assigned_counselor_id" }
          assert:
            - "Applicant.${ap}.assigned_counselor_id is null"
            - "Applicant.${ap}.status == PROSPECT"

      - name: counselor_selector_lowest_count_wins
        claim_type: computed_fields
        grounds: [calculations.counselor_assignment]
        distinguishing_aspect: "Two counselors: C1 already has 1 prospect, C2 has 0; new applicant assigns to C2 (lowest active_caseload_count)."
        test_recipe:
          setup: ["C1 (cap 5) and C2 (cap 5) exist; one applicant already assigned to C1 (created before C2 existed)"]
          setup_api_calls:
            - call: "POST /api/staff"
              payload: { full_name: "C1", email: "c1@x.com", staff_type: "COUNSELOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "First", email: "f@x.com", state_code: "CO" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "C2", email: "c2@x.com", staff_type: "COUNSELOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { c2: "$.data.id" }
          trigger:
            - call: "POST /api/applicants"
              payload: { full_name: "Second", email: "s@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap2: "$.data.id", cns2: "$.data.assigned_counselor_id" }
          assert:
            - "Applicant.${ap2}.assigned_counselor_id == Staff.${c2}.id (C1 has count 1, C2 has count 0)"

  # ----------------------------------------------------------- state machines
  - section: state_machines
    instances:
      - name: decision_on_withdrawn_application_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.transitions]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_error_beats_safety_error_on_decision"
          rationale: "Asserted there as the dual-failure path (ERR_INVALID_STATE wins over safety)."

      - name: withdraw_terminal_denied_application_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Application.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DENIED is terminal; POST /api/applications/{id}/withdraw on DENIED -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["open term; applicant with application DENIED"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "P", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { a: "$.data.id" }
            - call: "POST /api/applications/${a}/decision"
              payload: { decision: "DENY" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /api/applications/${a}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409); status remains DENIED"

      - name: tce_draft_to_completed_skip_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TransferCreditEvaluation.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT -> COMPLETED is not a declared edge; advance with to_state=COMPLETED from DRAFT -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["open term; applicant with SUBMITTED application; TCE in DRAFT"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "P", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { a: "$.data.id" }
            - call: "POST /api/applications/${a}/transfer-credit-evaluations"
              payload: { accepted_credits: 5, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { t: "$.data.id" }
          trigger:
            - call: "POST /api/transfer-credit-evaluations/${t}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409); TCE remains DRAFT"

      - name: early_alert_escalation_loop_cycle
        claim_type: valid_transition
        grounds: [state_machines.EarlyAlert.transitions]
        distinguishing_aspect: "OPEN->ACKNOWLEDGED->INTERVENTION->ESCALATED->INTERVENTION->RESOLVED walks the escalation loop legally; RESOLVED is terminal (further advance -> ERR_INVALID_STATE)."
        test_recipe:
          setup:
            - "Full pipeline: term IN_SESSION, enrollment ACTIVE, advisor ADV; alert created GRADE_THRESHOLD 55.0 (severity HIGH)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann", email: "a@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "P", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { a: "$.data.id" }
            - call: "POST /api/applications/${a}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { av: "$.data.version" }
            - call: "POST /api/applications/${a}/transfer-credit-evaluations"
              payload: { accepted_credits: 0, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { t: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${t}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${t}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${a}", advisor_id: "${adv}", enrollment_intensity: "FULL_TIME", tuition_cents: 100000, expected_application_version: "${av}" }
              as: RegistrarAdmin
              captures: { e: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "IN_SESSION" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments/${e}/early-alerts"
              payload: { trigger_type: "GRADE_THRESHOLD", observed_grade_percent: 55.0 }
              as: SystemAdmin
              captures: { al: "$.data.id", sev: "$.data.severity" }
          trigger:
            - call: "POST /api/early-alerts/${al}/advance"
              payload: { to_state: "ACKNOWLEDGED" }
              as: Advisor
              as_user_id: "${adv}"
            - call: "POST /api/early-alerts/${al}/advance"
              payload: { to_state: "INTERVENTION" }
              as: Advisor
              as_user_id: "${adv}"
            - call: "POST /api/early-alerts/${al}/advance"
              payload: { to_state: "ESCALATED" }
              as: Advisor
              as_user_id: "${adv}"
            - call: "POST /api/early-alerts/${al}/advance"
              payload: { to_state: "INTERVENTION" }
              as: Advisor
              as_user_id: "${adv}"
              captures: { loop_st: "$.data.status" }
            - call: "POST /api/early-alerts/${al}/advance"
              payload: { to_state: "RESOLVED" }
              as: Advisor
              as_user_id: "${adv}"
            - call: "POST /api/early-alerts/${al}/advance"
              payload: { to_state: "ACKNOWLEDGED" }
              as: Advisor
              as_user_id: "${adv}"
              captures: { term_err: "$.data.error_id" }
          assert:
            - "EarlyAlert.${al}.severity == HIGH (grade 55.0 < 60)"
            - "ESCALATED -> INTERVENTION loop succeeds (status INTERVENTION)"
            - "RESOLVED is terminal: further advance -> ERR_INVALID_STATE"

      - name: section_planned_to_staffed_requires_zero_adjunct_gap
        claim_type: precondition_enforcement
        grounds: [state_machines.CourseSection.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PLANNED -> STAFFED with adjuncts_required == 1 -> ERR_INVALID_STATE; PLANNED -> STAFFING then STAFFED with adjunct_hires 1 succeeds."
        test_recipe:
          setup: ["term ENROLLMENT_OPEN; section cap 30 forecast 31 (adjuncts_required 1)"]
          setup_api_calls:
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/terms/${term_id}/sections"
              payload: { course_code: "CS-101", capacity: 30, forecast_enrollment: 31 }
              as: RegistrarAdmin
              captures: { s: "$.data.id" }
          trigger:
            - call: "POST /api/sections/${s}/advance"
              payload: { to_state: "STAFFED" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /api/sections/${s}/advance"
              payload: { to_state: "STAFFING" }
              as: RegistrarAdmin
            - call: "POST /api/sections/${s}/advance"
              payload: { to_state: "STAFFED", adjunct_hires: 1 }
              as: RegistrarAdmin
              captures: { st: "$.data.status" }
          assert:
            - "direct PLANNED -> STAFFED -> ERR_INVALID_STATE"
            - "via STAFFING with adjunct_hires 1 -> STAFFED"

      - name: roster_on_planned_section_rejected_then_open_then_full
        claim_type: precondition_enforcement
        grounds: ["validations[priority=13]", "errors[ERR_SECTION_NOT_OPEN]", "errors[ERR_SECTION_FULL]"]
        distinguishing_aspect: "Roster on PLANNED section -> ERR_SECTION_NOT_OPEN; after opening and filling the single seat -> section LOCKED and next add -> ERR_SECTION_FULL."
        test_recipe:
          setup:
            - "Full pipeline to two REGISTERED enrollments (advisor cap 5); section cap 1 forecast 1 in ENROLLMENT_OPEN term"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "T", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/terms/${term_id}/sections"
              payload: { course_code: "CS-101", capacity: 1, forecast_enrollment: 1 }
              as: RegistrarAdmin
              captures: { s: "$.data.id" }
            - call: "POST /api/staff"
              payload: { full_name: "Ann", email: "a@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "P1", email: "p1@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap1: "$.data.id" }
