              payload: { doc_type: "TELEPHONE_SCRIPT_LOG", captured_at: "2026-07-10T00:00:00Z", storage_ref: "s3://circ/sg-log" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_g_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_g_id}", source_document_id: "${doc_g_id}", request_channel: "TELEPHONE", signed_at: "2025-06-01T00:00:00Z", attested_job_function_code: "ENGINEERING_MGMT", attested_industry_code: "MANUFACTURING", attested_purchasing_authority: "RECOMMENDS", expected_subscriber_version: "${sub_g_ver}" }
