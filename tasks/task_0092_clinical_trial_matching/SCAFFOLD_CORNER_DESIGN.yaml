# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Clinical Trial Smart Matching — breadth probe across §1.1-§1.7.
# excluded_because: stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: trial_creation_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Trial.fields.posture
          - entities.Trial.fields.irb_status
          - endpoints["POST /trials"]
        distinguishing_aspect: "POST /trials with required fields returns 201 with posture=SETUP, irb_status=NONE, enrolled_count=0, active_safety_holds=0, version=1, and a UUID id with no type prefix."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
          trigger:
            - call: "POST /trials"
              payload: { title: "Fresh", target_enrollment: 10, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tid: $.data.id, post: $.data.posture, irb: $.data.irb_status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Trial.posture == SETUP"
            - "Trial.irb_status == NONE"
            - "Trial.enrolled_count == 0"
            - "Trial.version == 1"

      - name: trial_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Trial.fields.target_enrollment
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required target_enrollment field on POST /trials returns ERR_INVALID_REQUEST (400); no trial is created."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
          trigger:
            - call: "POST /trials"
              payload: { title: "NoTarget", randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: trial_invalid_randomization_method_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Trial.fields.randomization_method
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "randomization_method outside {SIMPLE, PERMUTED_BLOCK} is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
          trigger:
            - call: "POST /trials"
              payload: { title: "BadEnum", target_enrollment: 5, randomization_method: "LOTTERY" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: trial_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /trials/{id}"]
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /trials/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
          trigger:
            - call: "GET /trials/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: participant_defaults_applied_when_optional_omitted
        claim_type: Defaults
        grounds:
          - entities.Participant.fields.prior_trials_count
          - entities.Participant.fields.biomarker_positive
          - endpoints["POST /participants"]
        distinguishing_aspect: "Omitting prior_trials_count and biomarker_positive on POST /participants applies defaults 0 and false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
          trigger:
            - call: "POST /participants"
              payload: { full_name: "P Def", age_years: 33, weight_kg: 72, hba1c: 5.5 }
              as: CoordinatorStaff
              captures: { pid: $.data.id, ptc: $.data.prior_trials_count, bm: $.data.biomarker_positive }
          assert:
            - "Participant.prior_trials_count == 0"
            - "Participant.biomarker_positive == false"

      - name: screening_computed_fields_match_engine
        claim_type: Computed Fields
        grounds:
          - calculations.match_score
          - entities.Screening.fields.match_score
          - entities.Screening.fields.match_result
        distinguishing_aspect: "A fully-eligible participant (passes the single inclusion) yields Screening.match_result=ELIGIBLE, failed_criteria_count=0, match_score=1.0 (lone inclusion category folds to full weight)."
        test_recipe:
          setup:
            - "A trial with one INCLUSION criterion age_years GE 18; a participant aged 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "ScoreOne", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/criteria"
              payload: { kind: "INCLUSION", attribute: "age_years", comparator: "GE", threshold: 18 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P One", age_years: 30, weight_kg: 70, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
          trigger:
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { res: $.data.match_result, sc: $.data.match_score, fc: $.data.failed_criteria_count }
          assert:
            - "Screening.match_result == ELIGIBLE"
            - "Screening.failed_criteria_count == 0"
            - "Screening.match_score == 1.0"

      - name: criterion_listing_reverse_reach_for_trial
        claim_type: Listing
        grounds:
          - entities.EligibilityCriterion.fields.trial_id
          - endpoints["GET /trials/{id}/criteria"]
        distinguishing_aspect: "GET /trials/{id}/criteria returns the array of criteria created under that trial (reverse-reachability for EligibilityCriterion.trial_id)."
        test_recipe:
          setup: ["A trial with two criteria."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "ListCrit", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/criteria"
              payload: { kind: "INCLUSION", attribute: "age_years", comparator: "GE", threshold: 18 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/criteria"
              payload: { kind: "EXCLUSION", attribute: "prior_trials_count", comparator: "GE", threshold: 3 }
              as: Sponsor
              as_user_id: "sponsor-1"
          trigger:
            - call: "GET /trials/${trial_id}/criteria"
              payload: {}
              as: CoordinatorStaff
          assert:
            - "response is an array of length 2 with both criteria for ${trial_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: irb_decide_already_decided_returns_revise_not_decidable
        claim_type: Idempotency
        grounds:
          - state_machines.IRBReview.PENDING_to_APPROVED
          - validations[priority=9]
          - errors[ERR_REVISE_NOT_DECIDABLE]
        distinguishing_aspect: "Deciding an IRB review a second time (already APPROVED) is rejected ERR_REVISE_NOT_DECIDABLE (409); the first decision stands."
        test_recipe:
          setup: ["A trial with a PROTOCOL review already APPROVED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "ReDecide", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
          trigger:
            - call: "POST /trials/${trial_id}/irb-reviews/${review_id}/decide"
              payload: { action: "REJECT" }
              as: IRBReviewer
              as_user_id: "irb-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REVISE_NOT_DECIDABLE"
            - "IRBReview.${review_id}.decision == APPROVED"

      - name: enrollment_activate_from_screened_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Enrollment.RANDOMIZED_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACTIVATE on an enrollment still SCREENED (not RANDOMIZED) is rejected ERR_INVALID_STATE (409); no fields change."
        test_recipe:
          setup: ["A SCREENED enrollment in a SETUP trial."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "ActBad", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P Act", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CoordinatorStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Enrollment.${enr_id}.enrollment_status == SCREENED"

      - name: visit_complete_lower_bound_inclusive
        claim_type: Side Effect Execution
        grounds:
          - calculations.draw_window_check
          - state_machines.Visit.SCHEDULED_to_COMPLETED
          - entities.Visit.fields.draw_deviation_minutes
        distinguishing_aspect: "A draw at exactly scheduled_at - w (lower bound, INCLUSIVE) completes the visit with draw_in_window=true and draw_deviation_minutes=30 (w=30), confirming the lower boundary is inclusive (complement of the §1.8 upper-bound-exclusive instance)."
        test_recipe:
          setup:
            - "An ACTIVE enrollment with a SCHEDULED visit at 2026-06-02T10:00:00Z, draw_window_minutes=30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "LowBound", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "PLACEBO", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Low", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_r: $.data.version }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_r}" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/visits"
              payload: { sequence_index: 1, scheduled_at: "2026-06-02T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/complete"
              payload: { drawn_at: "2026-06-02T09:30:00Z" }
              as: CoordinatorStaff
              captures: { st: $.data.status, inw: $.data.draw_in_window, dev: $.data.draw_deviation_minutes }
          assert:
            - "Visit.${v_id}.status == COMPLETED"
            - "Visit.${v_id}.draw_in_window == true"
            - "Visit.${v_id}.draw_deviation_minutes == 30"

      - name: withdraw_cancels_scheduled_visits
        claim_type: cascade_down
        grounds:
          - state_machines.Enrollment.SCREENED_to_WITHDRAWN
          - state_machines.Visit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Withdrawing an ACTIVE enrollment cancels its remaining SCHEDULED visits (status -> CANCELLED) as a cascade-down side effect."
        test_recipe:
          setup:
            - "An ACTIVE enrollment with one SCHEDULED visit (seq 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "WdVisit", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "PLACEBO", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Wd", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_r: $.data.version }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_r}" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/visits"
              payload: { sequence_index: 1, scheduled_at: "2026-06-05T10:00:00Z", draw_window_minutes: 30 }
              as: CoordinatorStaff
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "WITHDRAW" }
              as: CoordinatorStaff
            - call: "GET /enrollments/${enr_id}/visits"
              payload: {}
              as: CoordinatorStaff
          assert:
            - "Enrollment.${enr_id}.enrollment_status == WITHDRAWN"
            - "the listed Visit ${v_id} has status == CANCELLED"

      - name: lift_hold_from_clear_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Enrollment.HOLD_to_CLEAR
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "lift-hold on a CLEAR enrollment (never on HOLD) is rejected ERR_INVALID_STATE; the precondition safety_status==HOLD is enforced."
        test_recipe:
          setup: ["A RANDOMIZED enrollment with safety_status CLEAR (no AE)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "LiftBad", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "PLACEBO", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P Lift", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
