      - name: corner_forbidden_role_outranks_path_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_PRODUCER_NOT_FOUND]
        distinguishing_aspect: "Role admission at priority 2 runs before path-existence at priority 4: a Producer calling residency-verification on an id that does not exist gets ERR_FORBIDDEN_ROLE (403), and only a CenterAdmin sees ERR_PRODUCER_NOT_FOUND (404) for the same id."
        test_recipe:
          setup:
            - "One producer exists so the database is not empty, but the id 00000000-0000-4000-8000-000000000000 belongs to no Producer row."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
          trigger:
            - call: "POST /producers/00000000-0000-4000-8000-000000000000/residency-verification"
              payload: {document_reference: "UTIL-2026-9999"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {role_err: $.data.error_id}
            - call: "POST /producers/00000000-0000-4000-8000-000000000000/residency-verification"
              payload: {document_reference: "UTIL-2026-9999"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {nf_err: $.data.error_id}
          assert:
            - "${role_err} == ERR_FORBIDDEN_ROLE with HTTP 403 — the lower-priority 404 is masked"
            - "${nf_err} == ERR_PRODUCER_NOT_FOUND with HTTP 404 once the role is admissible"
            - "Producer.${p_id}.residency_verified is still false — neither call mutated anything"

