      - name: daily_rent_rate_rounds_half_up_on_two_unit_types
        claim_type: precision
        grounds:
          - calculations.daily_rent_rate
          - calculations.gross_rent_determination
          - entities.Lease.fields.daily_rent_cents
          - entities.Lease.fields.net_rent_cents
        distinguishing_aspect: "Two leases pin the half-up rule at both sides of a fraction that truncation would get wrong: the APARTMENT lease divides 2559000 by 365 to 7010.96 and must store 7011, while the DUPLEX lease divides 2647200 by 365 to 7252.60 and must store 7253. An implementation that truncates, or that divides the gross rent instead of the net rent, misses both."
        test_recipe:
          setup:
            - "One installation with the declared defaults and one 2026 BahRate row for E5 with dependents: monthly_rate_cents 245000, utility_allowance_cents 19500."
            - "Two 2-bedroom JUNIOR_ENLISTED units, both historic_flag false: A-201 (APARTMENT) created FIRST and A-301 (DUPLEX) created SECOND."
            - "Sponsor 1 (E5, three full-time-custody dependents, bedroom_eligibility 2) applied with pcs_orders_date 2026-08-20; sponsor 2 (identical family) applied with pcs_orders_date 2026-08-25."
            - "One offer run walked the two units smallest-first and, on the created_at tie-break, offered A-201 to sponsor 1 and A-301 to sponsor 2; both accepted."
            - "The logical clock stands at 2026-08-25T00:00:00Z and neither lease has been written yet."
