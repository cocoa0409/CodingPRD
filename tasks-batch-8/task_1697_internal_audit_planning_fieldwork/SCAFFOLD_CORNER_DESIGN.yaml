  - section: complexity_layers
    instances:
      - name: occ_stale_plan_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[engagement-create-stale-plan]", "errors[ERR_STALE_PLAN_VERSION]"]
        distinguishing_aspect: "OCC on AuditPlan.version: after a first engagement creation advances the plan to version 2, a second create carrying the stale observed version 1 is rejected with 412 ERR_STALE_PLAN_VERSION — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup: ["Plan created (version 1 captured); two entities; first engagement created advancing the plan to version 2"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E1", business_owner: "O1" }, as: AuditAdmin, captures: { ent1: "$.data.id" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "E2", business_owner: "O2" }, as: AuditAdmin, captures: { ent2: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent1}", title: "G1", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng1: "$.data.id" } }
          trigger:
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent2}", title: "G2", scope_summary: "s", budget_hours: 50, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_PLAN_VERSION and HTTP status 412 (observed ${plan_v} == 1, current == 2)"
            - "AuditPlan.${plan}.version == 2 (mutation increments version on every write)"
            - "No second engagement persisted: GET /audit/engagements?audit_plan_id=${plan} total_count == 1"

      - name: occ_stale_entity_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[risk-assessment-create-stale-entity]", "errors[ERR_STALE_ENTITY_VERSION]"]
        distinguishing_aspect: "OCC on AuditableEntity.version: after a first assessment advances the entity to version 2, a second create for a different fiscal year carrying the stale version 1 is rejected with 412 ERR_STALE_ENTITY_VERSION."
        test_recipe:
          setup: ["Entity created (version 1 captured); FY2026 assessment created (entity now version 2)"]
          setup_api_calls:
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id", ent_v: "$.data.version" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent}", fiscal_year: 2026, likelihood: 3, impact: 3, expected_auditable_entity_version: "${ent_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { ra1: "$.data.id" } }
          trigger:
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent}", fiscal_year: 2027, likelihood: 4, impact: 4, expected_auditable_entity_version: "${ent_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_ENTITY_VERSION and HTTP status 412 (observed ${ent_v} == 1, current == 2)"
            - "GET /audit/risk-assessments?auditable_entity_id=${ent} total_count == 1"

      - name: version_pinning_config_supersede
        claim_type: version_pinning
        grounds: ["calculations.finding_severity_rating", "state_machines.RatingCriteriaConfig.DRAFT_to_ACTIVE", "entities.Finding.fields.rating_criteria_config_id", "errors[ERR_RATING_CONFIG_INVALID_STATE]"]
        distinguishing_aspect: "Version pinning on approval: a finding rated CRITICAL under config1 keeps its severity and pinned config after config1 is SUPERSEDED; a new finding with the same composite 20 is rated HIGH under config2 (critical_min 24); re-activating the superseded config fails with ERR_RATING_CONFIG_INVALID_STATE."
        test_recipe:
          setup: ["Engagement FIELDWORK; config1 (20/12/6) ACTIVE; finding1 (4x5=20) created under config1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "E", business_owner: "O" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/rating-criteria-configs", payload: { name: "cfg1", critical_min: 20, high_min: 12, moderate_min: 6 }, as: AuditAdmin, captures: { cfg1: "$.data.id" } }
            - { call: "POST /audit/rating-criteria-configs/${cfg1}/activate", payload: {}, as: AuditAdmin }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "G", scope_summary: "s", budget_hours: 100, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1" }
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-1" }
            - { call: "POST /audit/engagements/${eng}/scope", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${mgr1}", role_in_engagement: "LEAD", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagements/${eng}/begin-fieldwork", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/findings", payload: { engagement_id: "${eng}", title: "F1", likelihood: 4, impact: 5 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { f1: "$.data.id", f1_sev: "$.data.severity", f1_cfg: "$.data.rating_criteria_config_id" } }
          trigger:
            - { call: "POST /audit/rating-criteria-configs", payload: { name: "cfg2", critical_min: 24, high_min: 12, moderate_min: 6 }, as: AuditAdmin, captures: { cfg2: "$.data.id" } }
            - { call: "POST /audit/rating-criteria-configs/${cfg2}/activate", payload: {}, as: AuditAdmin }
            - { call: "POST /audit/findings", payload: { engagement_id: "${eng}", title: "F2", likelihood: 4, impact: 5 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { f2: "$.data.id", f2_sev: "$.data.severity", f2_cfg: "$.data.rating_criteria_config_id" } }
            - { call: "POST /audit/rating-criteria-configs/${cfg1}/activate", payload: {}, as: AuditAdmin, captures: { e1: "$.data.error_id" } }
          assert:
            - "Finding.${f1} pinned: severity == CRITICAL and rating_criteria_config_id == ${cfg1} even after cfg1 was superseded"
            - "Finding.${f2}: severity == HIGH (20 < 24 under cfg2) and rating_criteria_config_id == ${cfg2}"
            - "RatingCriteriaConfig.${cfg1}.status == SUPERSEDED; re-activate: error == ERR_RATING_CONFIG_INVALID_STATE"
            - "Same composite 20, different severities across pinned config versions (CRITICAL vs HIGH)"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: ["complexity_profile"]
        excluded_because:
          difficulty_instance: "transitive_cascade / qa_fail_regression_four_hop_cascade"
          rationale: "N-level cascade ordering verified end-to-end by the named §1.8 instance (plus extension_approval_two_hop_overdue_recompute)."

      - name: dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / risk_score_weighted_vs_conservative_variants"
          rationale: "Both variants and their delta are asserted by the named §1.8 instance (plus utilization_provisional_vs_final_hours_basis)."

