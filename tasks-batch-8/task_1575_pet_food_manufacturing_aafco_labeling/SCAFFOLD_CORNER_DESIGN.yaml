      - name: complaint_brand_rollup_weighted_window
        claim_type: correct_result
        grounds:
          - calculations.complaint_risk_score
          - entities.BrandOwner.fields.complaint_score
        distinguishing_aspect: |
          The brand rollup is a weighted mean over the trailing 90-day window:
          two TRIAGED cases (35.0 and 57.0, half weight each) give 46.0;
          resolving the 57.0 case decays it to 25% share giving
          (17.5+14.25)/0.75 == 42.33; advancing the logical clock 31 days
          expires the decayed row, leaving 35.0.
        test_recipe:
          setup:
            - "Brand + DRAFT formula; case1 SERIOUS/ILLNESS no flag (35.0, TRIAGED); case2 LIFE_THREATENING/FOREIGN_MATERIAL no flag (57.0, TRIAGED then INVESTIGATING then RESOLVED); clock starts at 2026-08-01"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Rollup Co", fein: "552100030", contact_email: "ra@rollup.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "RU-001", product_name: "Rollup Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "${f_id}", severity: "SERIOUS", category: "ILLNESS", adverse_event_flag: false }
              as: QualityAnalyst
              captures: { c1_id: $.data.id }
            - call: "POST /petfood/complaint-cases/${c1_id}/triage"
              payload: { confirm_adverse_event_flag: false }
              as: QualityAnalyst
              captures: { c1_score: $.data.triage_score }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "${f_id}", severity: "LIFE_THREATENING", category: "FOREIGN_MATERIAL", adverse_event_flag: false }
              as: QualityAnalyst
              captures: { c2_id: $.data.id }
            - call: "POST /petfood/complaint-cases/${c2_id}/triage"
              payload: { confirm_adverse_event_flag: false }
              as: QualityAnalyst
              captures: { c2_score: $.data.triage_score }
          trigger:
            - call: "GET /petfood/brand-owners/${bo_id}"
              payload: {}
              as: QualityAnalyst
              captures: { score_after_triages: $.data.complaint_score }
            - call: "POST /petfood/complaint-cases/${c2_id}/open-investigation"
              payload: {}
              as: QualityAnalyst
            - call: "POST /petfood/complaint-cases/${c2_id}/resolve"
              payload: {}
              as: QualityAnalyst
            - call: "GET /petfood/brand-owners/${bo_id}"
              payload: {}
              as: QualityAnalyst
              captures: { score_after_resolve: $.data.complaint_score }
            - call: "POST /petfood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /petfood/brand-owners/${bo_id}"
              payload: {}
              as: QualityAnalyst
              captures: { score_after_decay_expiry: $.data.complaint_score }
          assert:
            - "Case1 final triage_score == 35.0 and case2 == 57.0"
            - "After both triages: BrandOwner.complaint_score == 46.0 ((35*0.5 + 57*0.5) / 1.0)"
            - "After case2 resolves: complaint_score == 42.33 ((17.5 + 14.25) / 0.75, decayed 25% share)"
            - "After clock +31 days (decay window expired, case1 still in 90-day window): complaint_score == 35.0"

      - name: lot_code_sequencer_chronological
        claim_type: correct_result
