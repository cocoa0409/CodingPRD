# =============================================================================
# Vocational / Trade School Management — SCAFFOLD (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  393. Vocational / Trade School Management: program & clock-hour tracking,
  admission & enrollment agreement, attendance & satisfactory progress (SAP),
  tuition/aid disbursement & refund, externship/clinical hours, licensure-exam
  readiness, placement reporting, cohort

domain_name: vocational-trade-school
api_prefix: /v1

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # All entities are top-level collections under /v1; cross-links are foreign
  # keys carried in request/entity bodies, never nested URL ownership.

  state_machine_shape: branching
  # EnrollmentAgreement forks DRAFTED→{ENROLLED,CANCELLED}; SapStanding cycles
  # GOOD↔WARNING↔PROBATION (revision loop); RefundCase forks per refund method.

  relationship_patterns:
    - one_to_many        # Program 1—* Cohort; EnrollmentAgreement 1—* AttendanceEntry
    - flat_references    # EnrollmentAgreement references Student, Cohort, Program by FK
    - cross_aggregate    # ExternshipAssignment references both EnrollmentAgreement and ExternshipSite

  role_model: peer_roles
  # Registrar owns admission/enrollment + cohort; FinancialAidOfficer owns
  # disbursement + refund; AcademicAdvisor owns attendance + SAP + externship +
  # licensure + placement; SystemAdmin owns program config + clock.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration: Program ----
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name, e.g. 'HVAC Technician'" }
      - { name: credential_type, type: enum, source: input, description: "DIPLOMA | CERTIFICATE | ASSOCIATE", constraints: "one of DIPLOMA, CERTIFICATE, ASSOCIATE" }
      - { name: required_clock_hours, type: integer, source: input, description: "Total clock hours required to graduate (> 0)", constraints: "integer > 0" }
      - { name: required_theory_hours, type: integer, source: input, description: "Of required_clock_hours, hours that must be classroom/theory", constraints: "0 <= required_theory_hours <= required_clock_hours" }
      - { name: required_externship_hours, type: integer, source: input, description: "Of required_clock_hours, hours that must be externship/clinical", constraints: "required_theory_hours + required_externship_hours <= required_clock_hours" }
      - { name: tuition_cents, type: integer, source: input, description: "Sticker tuition for the full program in cents (>= 0)", constraints: "integer >= 0" }
      - { name: sap_warning_min_pace_pct, type: number, source: input, description: "Minimum completion-pace percent below which a SAP review yields WARNING", default: 0.667, constraints: "0 < value <= 1" }
      - { name: sap_probation_min_pace_pct, type: number, source: input, description: "Minimum completion-pace percent below which a SAP review yields PROBATION/DISMISSAL track", default: 0.5, constraints: "0 < probation < warning <= 1" }
      - { name: licensure_min_attendance_pct, type: number, source: input, description: "Minimum cumulative attendance fraction required to be licensure-eligible", default: 0.9, constraints: "0 < value <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT → OPEN → CLOSED; CLOSED programs accept no new cohorts", constraints: "DRAFT, OPEN, CLOSED" }

  # ---- Resource: Cohort ----
  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program this cohort delivers" }
      - { name: code, type: string, source: input, description: "Human cohort code, e.g. 'HVAC-2026A'" }
      - { name: start_term_index, type: integer, source: input, description: "Academic term (integer clock unit) the cohort begins", constraints: "integer >= 0" }
      - { name: end_term_index, type: integer, source: input, description: "Academic term the cohort ends (exclusive end of the [start,end) interval)", constraints: "end_term_index > start_term_index" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum number of ENROLLED agreements", constraints: "integer > 0" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of agreements in ENROLLED + LEAVE_OF_ABSENCE + GRADUATED for this cohort" }
      - { name: status, type: enum, source: system, description: "FORMING → RUNNING → COMPLETED; COMPLETED locks new enrollment", constraints: "FORMING, RUNNING, COMPLETED" }

  # ---- Resource: Student (entity_backed identity) ----
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: email, type: string, source: input, description: "Unique contact email (case-insensitive unique)", constraints: "unique case-insensitive" }
      - { name: hs_diploma_verified, type: boolean, source: input, default: false, description: "Ability-to-benefit / HS-diploma admission prerequisite verified" }

  # ---- Resource: ExternshipSite (configuration) ----
  - name: ExternshipSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinical / externship host site name" }
      - { name: daily_slot_capacity, type: integer, source: input, description: "Max concurrent active assignments occupying overlapping term windows", constraints: "integer > 0" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "Count of assignments in PLACED + IN_PROGRESS at this site" }
      - { name: status, type: enum, source: system, description: "ACTIVE → SUSPENDED; SUSPENDED sites reject new placements", constraints: "ACTIVE, SUSPENDED" }

  # ---- Resource: EnrollmentAgreement (central aggregate) ----
  - name: EnrollmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; copied from the cohort at creation" }
      - { name: contract_tuition_cents, type: integer, source: input, description: "Contracted tuition in cents (may differ from program sticker)", constraints: "integer >= 0" }
      - { name: scheduled_aid_cents, type: integer, source: input, default: 0, description: "Total Title-IV/aid awarded over the program in cents", constraints: "0 <= value <= contract_tuition_cents" }
      - { name: cancellation_window_term_index, type: integer, source: input, description: "Last term index (inclusive) during which a full-refund buyer's-remorse cancellation applies", constraints: "integer >= cohort.start_term_index" }
      - { name: theory_hours_completed, type: number, source: computed, default: 0, description: "Sum of hours from POSTED AttendanceEntry rows with kind=THEORY" }
      - { name: externship_hours_completed, type: number, source: computed, default: 0, description: "Sum of hours from POSTED AttendanceEntry rows with kind=EXTERNSHIP" }
      - { name: clock_hours_completed, type: number, source: computed, default: 0, description: "theory_hours_completed + externship_hours_completed" }
      - { name: scheduled_hours_to_date, type: number, source: computed, default: 0, description: "Sum of scheduled_hours over POSTED+EXCUSED AttendanceEntry rows (the attendance denominator)" }
      - { name: attendance_pct, type: number, source: computed, default: 0, description: "clock_hours_completed / scheduled_hours_to_date, or 1.0 when scheduled_hours_to_date == 0" }
      - { name: completion_pct, type: number, source: computed, default: 0, description: "clock_hours_completed / program.required_clock_hours" }
      - { name: disbursed_aid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over RELEASED AidDisbursement rows for this agreement" }
      - { name: ledger_balance_cents, type: integer, source: computed, default: 0, description: "contract_tuition_cents - sum(RELEASED disbursements) - sum(POSTED payments); see §1.3" }
      - { name: sap_standing, type: enum, source: computed, default: "GOOD", description: "Mirror of the latest SapStanding.standing; GOOD when none exists", constraints: "GOOD, WARNING, PROBATION, DISMISSED" }
      - { name: licensure_eligible, type: boolean, source: computed, default: false, description: "True when graduation-ready AND attendance_pct >= program.licensure_min_attendance_pct; see §1.3" }
      - { name: status, type: enum, source: system, description: "DRAFTED → ENROLLED → {LEAVE_OF_ABSENCE↔ENROLLED} → GRADUATED; ENROLLED/LOA → WITHDRAWN; DRAFTED → CANCELLED", constraints: "DRAFTED, ENROLLED, LEAVE_OF_ABSENCE, GRADUATED, WITHDRAWN, CANCELLED" }
      - { name: withdrawal_term_index, type: integer, source: computed, required: false, description: "Term index recorded at withdrawal; null until WITHDRAWN" }

  # ---- Event: AttendanceEntry (clock-hour ledger line) ----
  - name: AttendanceEntry
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnrollmentAgreement.id" }
      - { name: term_index, type: integer, source: input, description: "Term in which the session occurred", constraints: "integer >= 0" }
      - { name: kind, type: enum, source: input, description: "THEORY | EXTERNSHIP — which hour bucket this session contributes to", constraints: "THEORY, EXTERNSHIP" }
      - { name: scheduled_hours, type: number, source: input, description: "Hours the student was scheduled for this session", constraints: "number > 0" }
      - { name: attended_hours, type: number, source: input, description: "Hours actually attended (<= scheduled_hours)", constraints: "0 <= attended_hours <= scheduled_hours" }
      - { name: status, type: enum, source: system, description: "POSTED (counts toward completed + denominator) | EXCUSED (denominator only, 0 attended) | VOIDED (excluded from all sums)", constraints: "POSTED, EXCUSED, VOIDED" }

  # ---- Resource: SapStanding (satisfactory academic progress review) ----
  - name: SapStanding
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnrollmentAgreement.id" }
      - { name: checkpoint_term_index, type: integer, source: input, description: "Term at which this SAP review is performed", constraints: "integer >= 0" }
      - { name: measured_pace_pct, type: number, source: computed, description: "Completion-pace ratio captured at review time; see §1.3 sap_pace" }
      - { name: measured_attendance_pct, type: number, source: computed, description: "Attendance fraction captured at review time" }
      - { name: standing, type: enum, source: computed, description: "GOOD | WARNING | PROBATION | DISMISSED — derived from pace vs program thresholds and prior standing", constraints: "GOOD, WARNING, PROBATION, DISMISSED" }
      - { name: appeal_status, type: enum, source: system, default: "NONE", description: "NONE → APPEALED → {APPEAL_GRANTED, APPEAL_DENIED}; only meaningful when standing in {PROBATION, DISMISSED}", constraints: "NONE, APPEALED, APPEAL_GRANTED, APPEAL_DENIED" }

  # ---- Resource: AidDisbursement (tuition/aid ledger) ----
  - name: AidDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnrollmentAgreement.id" }
      - { name: disbursement_index, type: integer, source: input, description: "1-based ordinal of this disbursement in the agreement's draw schedule", constraints: "integer >= 1, unique per agreement" }
      - { name: planned_amount_cents, type: integer, source: input, description: "Aid amount planned for this draw in cents", constraints: "integer > 0" }
      - { name: required_clock_hours_gate, type: integer, source: input, description: "Cumulative clock hours the student must have completed before this draw may RELEASE", constraints: "integer >= 0" }
      - { name: amount_cents, type: integer, source: computed, default: 0, description: "Actual released amount; equals planned_amount_cents on RELEASE, may be reduced on refund clawback" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → RELEASED → {RETURNED}; SCHEDULED → CANCELLED", constraints: "SCHEDULED, RELEASED, RETURNED, CANCELLED" }

  # ---- Resource: RefundCase (withdrawal refund, dual-variant) ----
  - name: RefundCase
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnrollmentAgreement.id" }
      - { name: method, type: enum, source: input, description: "PRO_RATA (clock-hour proportional) | STATE_TABLE (stepped scheduled refund table)", constraints: "PRO_RATA, STATE_TABLE" }
      - { name: withdrawal_term_index, type: integer, source: input, description: "Term index of withdrawal used by the refund math", constraints: "integer >= cohort.start_term_index" }
      - { name: tuition_earned_cents, type: integer, source: computed, description: "Tuition the school retains; depends on method; see §1.3 refund_amount" }
      - { name: tuition_refund_cents, type: integer, source: computed, description: "contract_tuition_cents - tuition_earned_cents (floored at 0)" }
      - { name: aid_return_cents, type: integer, source: computed, description: "Unearned aid returned to the aid source; see §1.3 aid_return" }
      - { name: student_refund_cents, type: integer, source: computed, description: "Cash returned to the student after aid return; see §1.3 refund_amount" }
      - { name: status, type: enum, source: system, description: "COMPUTED → {SETTLED, REVERSED}", constraints: "COMPUTED, SETTLED, REVERSED" }

  # ---- Resource: ExternshipAssignment (cross-aggregate) ----
  - name: ExternshipAssignment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnrollmentAgreement.id" }
      - { name: site_id, type: string, source: input, description: "FK -> ExternshipSite.id" }
      - { name: start_term_index, type: integer, source: input, description: "Inclusive start term of the externship window", constraints: "integer >= 0" }
      - { name: end_term_index, type: integer, source: input, description: "Exclusive end term of the externship window (half-open [start,end))", constraints: "end_term_index > start_term_index" }
      - { name: planned_hours, type: number, source: input, description: "Externship hours this assignment is expected to contribute", constraints: "number > 0" }
      - { name: verified_hours, type: number, source: computed, default: 0, description: "Externship hours credited when the assignment COMPLETES" }
      - { name: status, type: enum, source: system, description: "PLACED → IN_PROGRESS → COMPLETED; PLACED/IN_PROGRESS → TERMINATED", constraints: "PLACED, IN_PROGRESS, COMPLETED, TERMINATED" }

  # ---- Event: LicensureExamAttempt ----
  - name: LicensureExamAttempt
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnrollmentAgreement.id" }
      - { name: attempt_index, type: integer, source: input, description: "1-based ordinal of this exam sitting", constraints: "integer >= 1, unique per agreement" }
      - { name: scaled_score, type: integer, source: input, description: "Reported exam scaled score", constraints: "0 <= scaled_score <= 1000" }
      - { name: passing_score, type: integer, source: input, description: "Cut score for the licensure exam", constraints: "0 <= passing_score <= 1000" }
      - { name: result, type: enum, source: computed, description: "PASS when scaled_score >= passing_score else FAIL", constraints: "PASS, FAIL" }

  # ---- Resource: PlacementOutcome (placement reporting) ----
  - name: PlacementOutcome
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnrollmentAgreement.id" }
      - { name: outcome_term_index, type: integer, source: input, description: "Term index when the placement outcome was recorded", constraints: "integer >= 0" }
      - { name: outcome_type, type: enum, source: input, description: "EMPLOYED_IN_FIELD | EMPLOYED_RELATED | CONTINUING_EDUCATION | NOT_PLACED", constraints: "EMPLOYED_IN_FIELD, EMPLOYED_RELATED, CONTINUING_EDUCATION, NOT_PLACED" }
      - { name: employer_name, type: string, source: input, required: false, description: "Employer (required unless outcome_type is NOT_PLACED or CONTINUING_EDUCATION)" }
      - { name: counts_as_placed, type: boolean, source: computed, description: "True when outcome_type in {EMPLOYED_IN_FIELD, EMPLOYED_RELATED}; placement-rate numerator flag" }

  # ---- Configuration: SystemClock (singleton term clock) ----
  - name: SystemClock
    parent: null
    common_fields: true
    fields:
      - { name: current_term_index, type: integer, source: system, default: 0, description: "Deterministic academic-term clock; advances only via the clock endpoint", constraints: "integer >= 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # -------------------------------------------------------------------------
  - entity: Cohort
    initial_state: FORMING
    terminal_states: [COMPLETED]
    transitions:
      - from: FORMING
        to: RUNNING
        trigger: "POST /v1/cohorts/{id}/start"
        actor: Registrar
        preconditions:
          - "Cohort.status == FORMING (ERR_INVALID_STATE)"
          - "Parent Program.status == OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "SystemClock.current_term_index >= Cohort.start_term_index (ERR_COHORT_NOT_STARTED)"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /v1/cohorts/{id}/complete"
        actor: Registrar
        preconditions:
          - "Cohort.status == RUNNING (ERR_INVALID_STATE)"
          - "No agreement of this cohort is in ENROLLED or LEAVE_OF_ABSENCE (ERR_OPEN_AGREEMENTS_EXIST)"
        side_effects: []

  # -------------------------------------------------------------------------
  - entity: EnrollmentAgreement
    initial_state: DRAFTED
    terminal_states: [GRADUATED, WITHDRAWN, CANCELLED]
    transitions:
      - from: DRAFTED
        to: ENROLLED
        trigger: "POST /v1/enrollment-agreements/{id}/enroll"
        actor: Registrar
        preconditions:
          - "Agreement.status == DRAFTED (ERR_INVALID_STATE)"
          - "Student.hs_diploma_verified == true (ERR_ADMISSION_PREREQ_UNMET)"
          - "Cohort.status IN {FORMING, RUNNING} (ERR_COHORT_CLOSED)"
          - "Cohort.enrolled_count < Cohort.seat_capacity (ERR_COHORT_FULL)"
        side_effects:
          - "Cohort.enrolled_count += 1"
          - "increments Cohort.version by 1"
      - from: DRAFTED
        to: CANCELLED
        trigger: "POST /v1/enrollment-agreements/{id}/cancel"
        actor: Registrar
        preconditions:
          - "Agreement.status == DRAFTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ENROLLED
        to: LEAVE_OF_ABSENCE
        trigger: "POST /v1/enrollment-agreements/{id}/start-loa"
        actor: AcademicAdvisor
        preconditions:
          - "Agreement.status == ENROLLED (ERR_INVALID_STATE)"
          - "Agreement.sap_standing != DISMISSED (ERR_SAP_DISMISSED)"
        side_effects: []
      - from: LEAVE_OF_ABSENCE
        to: ENROLLED
        trigger: "POST /v1/enrollment-agreements/{id}/return-from-loa"
        actor: AcademicAdvisor
        preconditions:
          - "Agreement.status == LEAVE_OF_ABSENCE (ERR_INVALID_STATE)"
        side_effects: []
      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /v1/enrollment-agreements/{id}/graduate"
        actor: Registrar
        preconditions:
          - "Agreement.status == ENROLLED (ERR_INVALID_STATE)"
          - "Agreement.sap_standing IN {GOOD, WARNING} (ERR_SAP_NOT_SATISFACTORY)"
          - "clock_hours_completed >= program.required_clock_hours (ERR_CLOCK_HOURS_UNMET)"
          - "theory_hours_completed >= program.required_theory_hours (ERR_THEORY_HOURS_UNMET)"
          - "externship_hours_completed >= program.required_externship_hours (ERR_EXTERNSHIP_HOURS_UNMET)"
          - "ledger_balance_cents <= 0 (ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "Cohort.enrolled_count unchanged (GRADUATED still occupies a seat)"
          - "recompute licensure_eligible (see §1.3 licensure_eligibility)"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /v1/enrollment-agreements/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "Agreement.status IN {ENROLLED, LEAVE_OF_ABSENCE} (ERR_INVALID_STATE)"
        side_effects:
          - "withdrawal_term_index = SystemClock.current_term_index"
          - "Cohort.enrolled_count -= 1; increments Cohort.version by 1"
          - "Every ExternshipAssignment of this agreement in {PLACED, IN_PROGRESS} → TERMINATED (cascade; each terminated assignment decrements its ExternshipSite.active_assignment_count by 1)"
      - from: LEAVE_OF_ABSENCE
        to: WITHDRAWN
        trigger: "POST /v1/enrollment-agreements/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "Agreement.status IN {ENROLLED, LEAVE_OF_ABSENCE} (ERR_INVALID_STATE)"
        side_effects:
          - "withdrawal_term_index = SystemClock.current_term_index"
          - "Cohort.enrolled_count -= 1; increments Cohort.version by 1"
          - "Every ExternshipAssignment of this agreement in {PLACED, IN_PROGRESS} → TERMINATED (cascade; each terminated assignment decrements its ExternshipSite.active_assignment_count by 1)"

  # -------------------------------------------------------------------------
  - entity: AttendanceEntry
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: EXCUSED
        trigger: "POST /v1/attendance-entries/{id}/excuse"
        actor: AcademicAdvisor
        preconditions:
          - "AttendanceEntry.status == POSTED (ERR_INVALID_STATE)"
          - "Parent agreement.status IN {ENROLLED, LEAVE_OF_ABSENCE} (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "attended_hours forced to 0; row stays in attendance denominator"
          - "recompute agreement clock-hour rollups (see §1.3 clock_hour_rollup) — agreement.clock_hours_completed drops by the row's prior attended_hours; increments EnrollmentAgreement.version by 1"
      - from: POSTED
        to: VOIDED
        trigger: "POST /v1/attendance-entries/{id}/void"
        actor: AcademicAdvisor
        preconditions:
          - "AttendanceEntry.status IN {POSTED, EXCUSED} (ERR_INVALID_STATE)"
          - "Parent agreement.status IN {ENROLLED, LEAVE_OF_ABSENCE} (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "row excluded from completed sums AND denominator"
          - "recompute agreement clock-hour rollups + attendance_pct (see §1.3); increments EnrollmentAgreement.version by 1"
      - from: EXCUSED
        to: VOIDED
        trigger: "POST /v1/attendance-entries/{id}/void"
        actor: AcademicAdvisor
        preconditions:
          - "AttendanceEntry.status IN {POSTED, EXCUSED} (ERR_INVALID_STATE)"
          - "Parent agreement.status IN {ENROLLED, LEAVE_OF_ABSENCE} (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "row excluded from denominator; recompute agreement attendance_pct; increments EnrollmentAgreement.version by 1"

  # -------------------------------------------------------------------------
  - entity: SapStanding
    initial_state: NONE
    terminal_states: []
    note: "appeal_status is a parallel state dimension on the same row; `standing` is computed at creation and frozen, while `appeal_status` cycles independently."
    transitions:
      - from: NONE
        to: APPEALED
        trigger: "POST /v1/sap-standings/{id}/appeal"
        actor: AcademicAdvisor
        preconditions:
          - "SapStanding.appeal_status == NONE (ERR_INVALID_STATE)"
          - "SapStanding.standing IN {PROBATION, DISMISSED} (ERR_SAP_NOT_APPEALABLE)"
        side_effects: []
      - from: APPEALED
        to: APPEAL_GRANTED
        trigger: "POST /v1/sap-standings/{id}/resolve-appeal"
        actor: AcademicAdvisor
        preconditions:
          - "SapStanding.appeal_status == APPEALED (ERR_INVALID_STATE)"
          - "request body decision == GRANT"
        side_effects:
          - "If this is the agreement's latest SapStanding and standing == DISMISSED: agreement.sap_standing recomputed to PROBATION (appeal overturns dismissal to probation); increments EnrollmentAgreement.version by 1"
      - from: APPEALED
        to: APPEAL_DENIED
        trigger: "POST /v1/sap-standings/{id}/resolve-appeal"
        actor: AcademicAdvisor
        preconditions:
          - "SapStanding.appeal_status == APPEALED (ERR_INVALID_STATE)"
          - "request body decision == DENY"
        side_effects:
          - "If this is the agreement's latest SapStanding and standing == DISMISSED: parent agreement → WITHDRAWN (cascade withdraw with withdrawal_term_index = SystemClock.current_term_index; Cohort.enrolled_count -= 1, Cohort.version += 1; active ExternshipAssignments → TERMINATED with site count decrements); increments EnrollmentAgreement.version by 1"

  # -------------------------------------------------------------------------
  - entity: AidDisbursement
    initial_state: SCHEDULED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /v1/aid-disbursements/{id}/release"
        actor: FinancialAidOfficer
        preconditions:
          - "AidDisbursement.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Parent agreement.status IN {ENROLLED, LEAVE_OF_ABSENCE} (ERR_AGREEMENT_NOT_ACTIVE)"
          - "agreement.clock_hours_completed >= required_clock_hours_gate (ERR_DISBURSEMENT_GATE_UNMET)"
          - "disbursement_index-1 draws are all RELEASED or this is index 1 (ERR_DISBURSEMENT_OUT_OF_ORDER)"
          - "sum(RELEASED amount) + planned_amount_cents <= agreement.scheduled_aid_cents (ERR_AID_OVER_AWARD)"
        side_effects:
          - "amount_cents = planned_amount_cents"
          - "recompute agreement.disbursed_aid_cents and ledger_balance_cents (see §1.3 ledger_balance); increments EnrollmentAgreement.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/aid-disbursements/{id}/cancel"
        actor: FinancialAidOfficer
        preconditions:
          - "AidDisbursement.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []
      - from: RELEASED
        to: RETURNED
        trigger: "system (cascade from RefundCase SETTLED clawback; see §1.3 aid_return)"
        actor: system
        preconditions:
          - "AidDisbursement.status == RELEASED"
        side_effects:
          - "amount_cents reduced by the per-disbursement clawback share (see §1.3 aid_return); recompute agreement.disbursed_aid_cents and ledger_balance_cents; increments EnrollmentAgreement.version by 1"

  # -------------------------------------------------------------------------
  - entity: RefundCase
    initial_state: COMPUTED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: COMPUTED
        to: SETTLED
        trigger: "POST /v1/refund-cases/{id}/settle"
        actor: FinancialAidOfficer
        preconditions:
          - "RefundCase.status == COMPUTED (ERR_INVALID_STATE)"
          - "Parent agreement.status == WITHDRAWN (ERR_AGREEMENT_NOT_WITHDRAWN)"
          - "No other RefundCase for this agreement is already SETTLED (ERR_REFUND_ALREADY_SETTLED)"
          - "request body expected_agreement_version == agreement.version (ERR_STALE_VERSION)"
        side_effects:
          - "Clawback cascade: RELEASED AidDisbursements of the agreement transition RELEASED → RETURNED in descending disbursement_index order until aid_return_cents is consumed (see §1.3 aid_return); each RETURNED draw recomputes agreement.disbursed_aid_cents and ledger_balance_cents"
          - "increments EnrollmentAgreement.version by 1"
      - from: COMPUTED
        to: REVERSED
        trigger: "POST /v1/refund-cases/{id}/reverse"
        actor: FinancialAidOfficer
        preconditions:
          - "RefundCase.status == COMPUTED (ERR_INVALID_STATE)"
        side_effects: []

  # -------------------------------------------------------------------------
  - entity: ExternshipAssignment
    initial_state: PLACED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PLACED
        to: IN_PROGRESS
        trigger: "POST /v1/externship-assignments/{id}/begin"
        actor: AcademicAdvisor
        preconditions:
          - "ExternshipAssignment.status == PLACED (ERR_INVALID_STATE)"
          - "SystemClock.current_term_index >= start_term_index (ERR_EXTERNSHIP_NOT_STARTED)"
          - "Parent agreement.status == ENROLLED (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/externship-assignments/{id}/complete"
        actor: AcademicAdvisor
        preconditions:
          - "ExternshipAssignment.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "request body actual_hours > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "verified_hours = request actual_hours"
          - "Create a system AttendanceEntry (kind=EXTERNSHIP, status=POSTED, scheduled_hours=actual_hours, attended_hours=actual_hours, term_index=SystemClock.current_term_index) for the agreement"
          - "recompute agreement externship_hours_completed/clock_hours_completed/attendance_pct (see §1.3 clock_hour_rollup); increments EnrollmentAgreement.version by 1"
          - "ExternshipSite.active_assignment_count -= 1; increments ExternshipSite.version by 1"
      - from: PLACED
        to: TERMINATED
        trigger: "POST /v1/externship-assignments/{id}/terminate"
        actor: AcademicAdvisor
        preconditions:
          - "ExternshipAssignment.status IN {PLACED, IN_PROGRESS} (ERR_INVALID_STATE)"
        side_effects:
          - "ExternshipSite.active_assignment_count -= 1; increments ExternshipSite.version by 1"
      - from: IN_PROGRESS
        to: TERMINATED
        trigger: "POST /v1/externship-assignments/{id}/terminate"
        actor: AcademicAdvisor
        preconditions:
          - "ExternshipAssignment.status IN {PLACED, IN_PROGRESS} (ERR_INVALID_STATE)"
        side_effects:
          - "ExternshipSite.active_assignment_count -= 1; increments ExternshipSite.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: refund-settle-stale-agreement
    parent_entity: EnrollmentAgreement
    write_endpoint: "POST /v1/refund-cases/{id}/settle"
    occ_field: "expected_agreement_version"
    description: |
      Settling a RefundCase against an EnrollmentAgreement whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A RefundCase is COMPUTED off a snapshot of the agreement's ledger
      and disbursement state; if a later RELEASE/RETURN/withdrawal cascade has
      already advanced the agreement version, the snapshot the case settles
      against is stale and the clawback amounts would no longer reconcile, so the
      settle is rejected and the case must be reversed and recomputed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: clock_hour_rollup
    trigger: "AttendanceEntry create/excuse/void; ExternshipAssignment complete"
    algorithm: aggregation
    formula: |
      theory_hours_completed   = sum(attended_hours) over AttendanceEntry
                                 where agreement_id == A.id and kind == THEORY and status == POSTED
      externship_hours_completed = sum(attended_hours) over AttendanceEntry
                                 where agreement_id == A.id and kind == EXTERNSHIP and status == POSTED
      clock_hours_completed    = theory_hours_completed + externship_hours_completed
      scheduled_hours_to_date  = sum(scheduled_hours) over AttendanceEntry
                                 where agreement_id == A.id and status IN {POSTED, EXCUSED}
      completion_pct           = clock_hours_completed / program.required_clock_hours
    input_set: "AttendanceEntry rows of the agreement; VOIDED rows excluded from every sum; EXCUSED rows contribute scheduled_hours to the denominator only (attended_hours forced 0)."
    precision: "hours kept as exact decimals; pct kept as exact ratio (no rounding until display)"

  - name: attendance_pct
    trigger: "any clock_hour_rollup recompute"
    algorithm: aggregation
    formula: |
      if scheduled_hours_to_date == 0:
          attendance_pct = 1.0
      else:
          attendance_pct = clock_hours_completed / scheduled_hours_to_date
    input_set: "Derived from clock_hour_rollup outputs of the same agreement."
    precision: "exact ratio; compared against thresholds with >= semantics"
    note: "Empty-denominator boundary: zero scheduled hours yields a perfect 1.0, never a divide-by-zero."

  - name: sap_pace
    trigger: "POST /v1/sap-standings (SAP review creation)"
    algorithm: weighted_scoring
    formula: |
      # Completion-pace at a checkpoint relative to scheduled program timeline.
      cohort_term_span        = cohort.end_term_index - cohort.start_term_index   # > 0
      elapsed_fraction        = min(1.0, max(0.0,
                                  (checkpoint_term_index - cohort.start_term_index) / cohort_term_span))
      expected_hours          = elapsed_fraction * program.required_clock_hours
      if expected_hours == 0:
          measured_pace_pct = 1.0
      else:
          measured_pace_pct = clock_hours_completed / expected_hours
      measured_attendance_pct = agreement.attendance_pct (snapshot at review)
    input_set: "Agreement rollups + cohort term window + program required hours, snapshotted at review time."
    constants: { FLOOR: 0.0, CAP: 1.0 }
    precision: "measured_pace_pct stored to 4 decimal places, round_half_up"

  - name: sap_standing_classification
    trigger: "POST /v1/sap-standings (SAP review creation)"
    algorithm: threshold
    formula: |
      prior = standing of the agreement's most recent SapStanding before this one (GOOD if none)
      if measured_pace_pct >= program.sap_warning_min_pace_pct:
          standing = GOOD
      elif measured_pace_pct >= program.sap_probation_min_pace_pct:
          standing = WARNING
      else:   # pace below probation floor
          if prior IN {WARNING, PROBATION}:
              standing = DISMISSED        # consecutive sub-floor review escalates
          else:
              standing = PROBATION
    input_set: "This review's measured_pace_pct + prior standing chain for the agreement."
    constants: {}
    precision: "exact threshold comparison with >= (a pace exactly at sap_warning_min_pace_pct is GOOD)"
    variants:
      - name: first_offense
        when: "prior standing is GOOD and pace below probation floor"
        difference: "yields PROBATION, not DISMISSED"
      - name: repeat_offense
        when: "prior standing already WARNING or PROBATION and pace below probation floor"
        difference: "escalates straight to DISMISSED"

  - name: ledger_balance
    trigger: "AidDisbursement release/return; RefundCase settle; agreement create"
    algorithm: aggregation
    formula: |
      disbursed_aid_cents = sum(amount_cents) over AidDisbursement
                            where agreement_id == A.id and status == RELEASED
      ledger_balance_cents = contract_tuition_cents - disbursed_aid_cents
      # Positive balance = student still owes; <= 0 means fully covered by aid.
    input_set: "RELEASED AidDisbursement rows of the agreement; RETURNED/CANCELLED/SCHEDULED excluded."
    precision: "integer cents; no rounding"

  - name: refund_amount
    trigger: "POST /v1/refund-cases (refund case creation)"
    algorithm: chronological
    formula: |
      span        = cohort.end_term_index - cohort.start_term_index   # > 0
      elapsed     = withdrawal_term_index - cohort.start_term_index    # >= 0
      # --- buyer's-remorse short circuit (both methods) ---
      if withdrawal_term_index <= agreement.cancellation_window_term_index:
          tuition_earned_cents = 0
      else:
          # ---- PRO_RATA: clock-hour proportional, rounded once at the end ----
          if method == PRO_RATA:
              earned_fraction = min(1.0, clock_hours_completed / program.required_clock_hours)
              tuition_earned_cents = round_half_up(contract_tuition_cents * earned_fraction)
          # ---- STATE_TABLE: stepped scheduled-refund table on elapsed term fraction ----
          else:  # method == STATE_TABLE
              term_fraction = elapsed / span
              if   term_fraction <= 0.10: retain = 0.00
              elif term_fraction <= 0.25: retain = 0.25
              elif term_fraction <= 0.50: retain = 0.50
              elif term_fraction <= 0.75: retain = 0.75
              else:                       retain = 1.00
              tuition_earned_cents = round_half_up(contract_tuition_cents * retain)
      tuition_refund_cents = max(0, contract_tuition_cents - tuition_earned_cents)
      # student cash refund = tuition refund minus aid that must be returned (see aid_return)
      student_refund_cents = max(0, tuition_refund_cents - aid_return_cents)
    input_set: "Agreement contract tuition, clock hours, cohort window, withdrawal term; method selects the branch."
    constants:
      PRO_RATA_FULL_REFUND_FRACTION: 1.0
      STATE_TABLE_STEPS: "{0.10:0.00, 0.25:0.25, 0.50:0.50, 0.75:0.75, 1.00:1.00}"
    precision: "round_half_up to whole cents, applied ONCE to contract_tuition_cents * fraction (sum-then-round, never per-term rounding)"
    variants:
      - name: pro_rata
        when: "method == PRO_RATA"
        difference: "earned fraction = clock_hours_completed / required_clock_hours (actual progress)"
      - name: state_table
        when: "method == STATE_TABLE"
        difference: "earned fraction = stepped retain rate keyed on elapsed term fraction (scheduled time), independent of actual hours — same agreement yields a DIFFERENT refund than PRO_RATA"

  - name: aid_return
    trigger: "POST /v1/refund-cases (creation) and RefundCase settle clawback"
    algorithm: waterfall_allocation
    formula: |
      # Unearned aid = portion of disbursed aid attributable to unearned tuition.
      earned_fraction_of_program = min(1.0, clock_hours_completed / program.required_clock_hours)
      unearned_fraction          = 1.0 - earned_fraction_of_program
      aid_return_cents           = round_half_up(agreement.disbursed_aid_cents * unearned_fraction)
      aid_return_cents           = min(aid_return_cents, agreement.disbursed_aid_cents)
      # On SETTLE, claw back from RELEASED draws in DESCENDING disbursement_index
      # order (latest draw first); each draw returns min(remaining, draw.amount_cents),
      # transitions RELEASED -> RETURNED, and reduces its amount_cents by the clawed share.
    input_set: "disbursed_aid_cents + program-progress fraction; clawback iterates RELEASED draws of the agreement ordered by disbursement_index DESC (deterministic, never by id)."
    constants: {}
    precision: "round_half_up to whole cents on the aggregate aid_return, computed ONCE; per-draw shares are integer cents whose remainder lands on the lowest-index drawn-against draw"

  - name: licensure_eligibility
    trigger: "agreement graduate; LicensureExamAttempt create; clock_hour_rollup recompute on GRADUATED/ENROLLED agreements"
    algorithm: threshold
    formula: |
      graduation_ready = (clock_hours_completed >= program.required_clock_hours
                          and theory_hours_completed >= program.required_theory_hours
                          and externship_hours_completed >= program.required_externship_hours)
      licensure_eligible = (graduation_ready
                            and attendance_pct >= program.licensure_min_attendance_pct
                            and agreement.sap_standing IN {GOOD, WARNING})
    input_set: "Agreement rollups + program hour/attendance requirements + sap_standing."
    constants: {}
    precision: "exact >= comparison on attendance_pct against program.licensure_min_attendance_pct"
    note: "Boundary: attendance_pct exactly == licensure_min_attendance_pct is eligible (>=)."

  - name: placement_rate
    trigger: "GET /v1/programs/{id}/placement-report"
    algorithm: aggregation
    formula: |
      placeable = count of agreements where program_id == P.id and status == GRADUATED
      placed    = count of PlacementOutcome rows whose agreement is GRADUATED in program P
                  and counts_as_placed == true, taking the LATEST PlacementOutcome per
                  agreement by outcome_term_index (tie-break: later created_at)
      placement_rate_pct = (placed / placeable) if placeable > 0 else 0.0
    input_set: "GRADUATED agreements of the program + their latest PlacementOutcome."
    constants: {}
    precision: "placement_rate_pct to 4 decimal places, round_half_up; 0.0 on empty placeable set"
    note: "Empty-set boundary: zero GRADUATED agreements yields 0.0, not divide-by-zero."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles and permitted for this operation"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutations

  - priority: 5
    category: state
    check: "OCC: expected_agreement_version (when required by endpoint) equals the agreement's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/refund-cases/{id}/settle"
    note: "OCC check runs before any business reconciliation on that endpoint."

  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-references resolve to the same program/cohort scope (e.g. cohort.program_id == enrollment.program_id; site of an externship is distinct from the agreement's cohort scope check)"
    error_id: ERR_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /v1/enrollment-agreements, POST /v1/externship-assignments"

  - priority: 8
    category: business_safety
    check: "Admission prerequisite: Student.hs_diploma_verified == true before ENROLL"
    error_id: ERR_ADMISSION_PREREQ_UNMET
    http_status: 422
    applies_to: "POST /v1/enrollment-agreements/{id}/enroll"

  - priority: 9
    category: business_safety
    check: "SAP gate: agreement.sap_standing != DISMISSED for academic operations; sap_standing IN {GOOD,WARNING} to graduate"
    error_id: ERR_SAP_NOT_SATISFACTORY
    http_status: 422
    applies_to: "POST /v1/enrollment-agreements/{id}/graduate"

  - priority: 9.5
    category: state
    check: "Externship placement requires the target site to be ACTIVE"
    error_id: ERR_SITE_SUSPENDED
    http_status: 409
    applies_to: "POST /v1/externship-assignments"

  - priority: 10
    category: business_temporal
    check: "Externship window must not overlap an existing non-terminal assignment of the SAME agreement (a student cannot be at two externships at once); intervals are half-open [start_term_index, end_term_index)"
    error_id: ERR_EXTERNSHIP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /v1/externship-assignments"

  - priority: 11
    category: business_temporal
    check: "Site capacity: count of {PLACED,IN_PROGRESS} assignments at the site whose [start,end) windows intersect the requested window must be < site.daily_slot_capacity; closed-interval touch (end==start) does NOT count as overlap"
    error_id: ERR_SITE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/externship-assignments"

  - priority: 12
    category: business_constraint
    check: "Cohort seat capacity: enrolled_count < seat_capacity before ENROLL"
    error_id: ERR_COHORT_FULL
    http_status: 409
    applies_to: "POST /v1/enrollment-agreements/{id}/enroll"

  - priority: 13
    category: business_constraint
    check: "Disbursement ordering: lower-index draws RELEASED before a higher-index draw releases"
    error_id: ERR_DISBURSEMENT_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /v1/aid-disbursements/{id}/release"

  - priority: 14
    category: business_safety
    check: "Disbursement clock-hour gate: agreement.clock_hours_completed >= required_clock_hours_gate before release"
    error_id: ERR_DISBURSEMENT_GATE_UNMET
    http_status: 422
    applies_to: "POST /v1/aid-disbursements/{id}/release"

  - priority: 15
    category: business_fiscal
    check: "Aid over-award: sum(RELEASED amount) + planned_amount_cents <= agreement.scheduled_aid_cents"
    error_id: ERR_AID_OVER_AWARD
    http_status: 402
    applies_to: "POST /v1/aid-disbursements/{id}/release"

  - priority: 16
    category: business_constraint
    check: "Graduation hour requirements: clock/theory/externship hours each meet program minimums"
    error_id: ERR_CLOCK_HOURS_UNMET
    http_status: 422
    applies_to: "POST /v1/enrollment-agreements/{id}/graduate"

  - priority: 17
    category: business_fiscal
    check: "Graduation requires ledger_balance_cents <= 0 (no outstanding balance)"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /v1/enrollment-agreements/{id}/graduate"

  - priority: 18
    category: business_constraint
    check: "Refund settle requires exactly one COMPUTED case and no prior SETTLED case for the agreement"
    error_id: ERR_REFUND_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /v1/refund-cases/{id}/settle"

  - priority: 19
    category: business_constraint
    check: "Uniqueness: AidDisbursement.disbursement_index unique per agreement; LicensureExamAttempt.attempt_index unique per agreement; Student.email unique case-insensitive"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /v1/aid-disbursements, POST /v1/licensure-exam-attempts, POST /v1/students"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- SystemClock ----
  - method: GET
    path: "/v1/clock"
    description: "Read the current academic-term clock"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: SystemClock
    side_effects: []
  - method: POST
    path: "/v1/clock/advance"
    description: "Advance the term clock to a target term index (test/operator clock control)"
    roles: [SystemAdmin]
    code: 200
    input: [to_term_index]
    output: SystemClock
    side_effects: ["SystemClock.current_term_index = to_term_index (must be >= current)"]

  # ---- Program ----
  - method: POST
    path: "/v1/programs"
    description: "Create a program (DRAFT)"
    roles: [SystemAdmin]
    code: 201
    input: [name, credential_type, required_clock_hours, required_theory_hours, required_externship_hours, tuition_cents, "sap_warning_min_pace_pct?", "sap_probation_min_pace_pct?", "licensure_min_attendance_pct?"]
    output: Program
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/v1/programs"
    description: "List programs"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["status?"]
    output: "Program[]"
    side_effects: []
  - method: GET
    path: "/v1/programs/{id}"
    description: "Get a program"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/v1/programs/{id}/open"
    description: "Open a program for cohort creation (DRAFT → OPEN)"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status → OPEN"]
  - method: POST
    path: "/v1/programs/{id}/close"
    description: "Close a program (OPEN → CLOSED)"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status → CLOSED"]
  - method: GET
    path: "/v1/programs/{id}/placement-report"
    description: "Computed placement-rate report for a program (see §1.3 placement_rate)"
    roles: [Registrar, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: "{ program_id: string, graduated_count: integer, placed_count: integer, placement_rate_pct: number }"
    side_effects: []

  # ---- Cohort ----
  - method: POST
    path: "/v1/cohorts"
    description: "Create a cohort under an OPEN program (FORMING)"
    roles: [Registrar]
    code: 201
    input: [program_id, code, start_term_index, end_term_index, seat_capacity]
    output: Cohort
    side_effects: ["status = FORMING; requires Program.status == OPEN"]
  - method: GET
    path: "/v1/cohorts"
    description: "List cohorts, optionally filtered by program"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["program_id?", "status?"]
    output: "Cohort[]"
    side_effects: []
  - method: GET
    path: "/v1/cohorts/{id}"
    description: "Get a cohort"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: Cohort
    side_effects: []
  - method: POST
    path: "/v1/cohorts/{id}/start"
    description: "Start a cohort (FORMING → RUNNING)"
    roles: [Registrar]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status → RUNNING"]
  - method: POST
    path: "/v1/cohorts/{id}/complete"
    description: "Complete a cohort (RUNNING → COMPLETED)"
    roles: [Registrar]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status → COMPLETED"]

  # ---- Student ----
  - method: POST
    path: "/v1/students"
    description: "Create a student"
    roles: [Registrar]
    code: 201
    input: [full_name, email, "hs_diploma_verified?"]
    output: Student
    side_effects: []
  - method: GET
    path: "/v1/students"
    description: "List students, optionally filtered by email"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["email?"]
    output: "Student[]"
    side_effects: []
  - method: GET
    path: "/v1/students/{id}"
    description: "Get a student"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: PATCH
    path: "/v1/students/{id}"
    description: "Update a student's admission prerequisite flag"
    roles: [Registrar]
    code: 200
    input: ["hs_diploma_verified?", "full_name?", "expected_student_version?"]
    output: Student
    side_effects: ["increments Student.version by 1"]

  # ---- ExternshipSite ----
  - method: POST
    path: "/v1/externship-sites"
    description: "Create an externship/clinical site (ACTIVE)"
    roles: [AcademicAdvisor, SystemAdmin]
    code: 201
    input: [name, daily_slot_capacity]
    output: ExternshipSite
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/v1/externship-sites"
    description: "List externship sites"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["status?"]
    output: "ExternshipSite[]"
    side_effects: []
  - method: GET
    path: "/v1/externship-sites/{id}"
    description: "Get an externship site"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: ExternshipSite
    side_effects: []
  - method: POST
    path: "/v1/externship-sites/{id}/suspend"
    description: "Suspend an externship site (ACTIVE → SUSPENDED)"
    roles: [AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: ExternshipSite
    side_effects: ["status → SUSPENDED"]

  # ---- EnrollmentAgreement ----
  - method: POST
    path: "/v1/enrollment-agreements"
    description: "Draft an enrollment agreement (DRAFTED); copies program_id from the cohort"
    roles: [Registrar]
    code: 201
    input: [student_id, cohort_id, contract_tuition_cents, "scheduled_aid_cents?", cancellation_window_term_index]
    output: EnrollmentAgreement
    side_effects: ["status = DRAFTED; program_id copied from cohort; ledger_balance_cents = contract_tuition_cents"]
  - method: GET
    path: "/v1/enrollment-agreements"
    description: "List enrollment agreements; filterable by student, cohort, program"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["student_id?", "cohort_id?", "program_id?", "status?"]
    output: "EnrollmentAgreement[]"
    side_effects: []
  - method: GET
    path: "/v1/enrollment-agreements/{id}"
    description: "Get an enrollment agreement with all computed rollups"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: EnrollmentAgreement
    side_effects: []
  - method: POST
    path: "/v1/enrollment-agreements/{id}/enroll"
    description: "Enroll a drafted agreement (DRAFTED → ENROLLED)"
    roles: [Registrar]
    code: 200
    input: []
    output: EnrollmentAgreement
    side_effects: ["status → ENROLLED; Cohort.enrolled_count += 1; Cohort.version += 1"]
  - method: POST
    path: "/v1/enrollment-agreements/{id}/cancel"
    description: "Cancel a drafted agreement (DRAFTED → CANCELLED)"
    roles: [Registrar]
    code: 200
    input: []
    output: EnrollmentAgreement
    side_effects: ["status → CANCELLED"]
  - method: POST
    path: "/v1/enrollment-agreements/{id}/start-loa"
    description: "Start a leave of absence (ENROLLED → LEAVE_OF_ABSENCE)"
    roles: [AcademicAdvisor]
    code: 200
    input: []
    output: EnrollmentAgreement
    side_effects: ["status → LEAVE_OF_ABSENCE"]
  - method: POST
    path: "/v1/enrollment-agreements/{id}/return-from-loa"
    description: "Return from leave of absence (LEAVE_OF_ABSENCE → ENROLLED)"
    roles: [AcademicAdvisor]
    code: 200
    input: []
    output: EnrollmentAgreement
    side_effects: ["status → ENROLLED"]
  - method: POST
    path: "/v1/enrollment-agreements/{id}/graduate"
    description: "Graduate an agreement (ENROLLED → GRADUATED)"
    roles: [Registrar]
    code: 200
    input: []
    output: EnrollmentAgreement
    side_effects: ["status → GRADUATED; recompute licensure_eligible"]
  - method: POST
    path: "/v1/enrollment-agreements/{id}/withdraw"
    description: "Withdraw an agreement (ENROLLED/LEAVE_OF_ABSENCE → WITHDRAWN)"
    roles: [Registrar]
    code: 200
    input: []
    output: EnrollmentAgreement
    side_effects: ["status → WITHDRAWN; withdrawal_term_index set; Cohort.enrolled_count -= 1; Cohort.version += 1; active ExternshipAssignments → TERMINATED with site count decrements"]

  # ---- AttendanceEntry ----
  - method: POST
    path: "/v1/attendance-entries"
    description: "Post a clock-hour attendance session (POSTED)"
    roles: [AcademicAdvisor]
    code: 201
    input: [agreement_id, term_index, kind, scheduled_hours, attended_hours]
    output: AttendanceEntry
    side_effects: ["status = POSTED; recompute agreement clock-hour rollups + attendance_pct; EnrollmentAgreement.version += 1; requires agreement.status IN {ENROLLED, LEAVE_OF_ABSENCE}"]
  - method: GET
    path: "/v1/attendance-entries"
    description: "List attendance entries, filterable by agreement"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["agreement_id?", "status?", "kind?"]
    output: "AttendanceEntry[]"
    side_effects: []
  - method: GET
    path: "/v1/attendance-entries/{id}"
    description: "Get an attendance entry"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: AttendanceEntry
    side_effects: []
  - method: POST
    path: "/v1/attendance-entries/{id}/excuse"
    description: "Excuse an attendance entry (POSTED → EXCUSED): denominator-only"
    roles: [AcademicAdvisor]
    code: 200
    input: []
    output: AttendanceEntry
    side_effects: ["status → EXCUSED; attended_hours → 0; recompute agreement rollups; EnrollmentAgreement.version += 1"]
  - method: POST
    path: "/v1/attendance-entries/{id}/void"
    description: "Void an attendance entry (POSTED/EXCUSED → VOIDED): excluded from all sums"
    roles: [AcademicAdvisor]
    code: 200
    input: []
    output: AttendanceEntry
    side_effects: ["status → VOIDED; recompute agreement rollups + attendance_pct; EnrollmentAgreement.version += 1"]

  # ---- SapStanding ----
  - method: POST
    path: "/v1/sap-standings"
    description: "Run a SAP review at a checkpoint term (computes pace, attendance, standing)"
    roles: [AcademicAdvisor]
    code: 201
    input: [agreement_id, checkpoint_term_index]
    output: SapStanding
    side_effects: ["measured_pace_pct/measured_attendance_pct/standing computed (see §1.3); agreement.sap_standing mirrors this standing; if standing == DISMISSED no auto-withdraw occurs (only via denied appeal); EnrollmentAgreement.version += 1"]
  - method: GET
    path: "/v1/sap-standings"
    description: "List SAP standings, filterable by agreement"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["agreement_id?", "standing?"]
    output: "SapStanding[]"
    side_effects: []
  - method: GET
    path: "/v1/sap-standings/{id}"
    description: "Get a SAP standing"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: SapStanding
    side_effects: []
  - method: POST
    path: "/v1/sap-standings/{id}/appeal"
    description: "File an appeal on a PROBATION/DISMISSED standing (NONE → APPEALED)"
    roles: [AcademicAdvisor]
    code: 200
    input: []
    output: SapStanding
    side_effects: ["appeal_status → APPEALED"]
  - method: POST
    path: "/v1/sap-standings/{id}/resolve-appeal"
    description: "Resolve an appeal (APPEALED → APPEAL_GRANTED/APPEAL_DENIED)"
    roles: [AcademicAdvisor]
    code: 200
    input: [decision]
    output: SapStanding
    side_effects: ["GRANT: if latest+DISMISSED, agreement.sap_standing → PROBATION; DENY: if latest+DISMISSED, parent agreement cascade-withdraws; EnrollmentAgreement.version += 1"]

  # ---- AidDisbursement ----
  - method: POST
    path: "/v1/aid-disbursements"
    description: "Schedule an aid disbursement draw (SCHEDULED)"
    roles: [FinancialAidOfficer]
    code: 201
    input: [agreement_id, disbursement_index, planned_amount_cents, required_clock_hours_gate]
    output: AidDisbursement
    side_effects: ["status = SCHEDULED; disbursement_index must be unique per agreement"]
  - method: GET
    path: "/v1/aid-disbursements"
    description: "List aid disbursements, filterable by agreement"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["agreement_id?", "status?"]
    output: "AidDisbursement[]"
    side_effects: []
  - method: GET
    path: "/v1/aid-disbursements/{id}"
    description: "Get an aid disbursement"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: AidDisbursement
    side_effects: []
  - method: POST
    path: "/v1/aid-disbursements/{id}/release"
    description: "Release a scheduled draw (SCHEDULED → RELEASED)"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidDisbursement
    side_effects: ["status → RELEASED; amount_cents = planned_amount_cents; recompute agreement.disbursed_aid_cents + ledger_balance_cents; EnrollmentAgreement.version += 1"]
  - method: POST
    path: "/v1/aid-disbursements/{id}/cancel"
    description: "Cancel a scheduled draw (SCHEDULED → CANCELLED)"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidDisbursement
    side_effects: ["status → CANCELLED"]

  # ---- RefundCase ----
  - method: POST
    path: "/v1/refund-cases"
    description: "Compute a refund case for a WITHDRAWN agreement (COMPUTED)"
    roles: [FinancialAidOfficer]
    code: 201
    input: [agreement_id, method, withdrawal_term_index]
    output: RefundCase
    side_effects: ["status = COMPUTED; tuition_earned/tuition_refund/aid_return/student_refund computed (see §1.3 refund_amount, aid_return); requires agreement.status == WITHDRAWN"]
  - method: GET
    path: "/v1/refund-cases"
    description: "List refund cases, filterable by agreement"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["agreement_id?", "status?"]
    output: "RefundCase[]"
    side_effects: []
  - method: GET
    path: "/v1/refund-cases/{id}"
    description: "Get a refund case"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: RefundCase
    side_effects: []
  - method: POST
    path: "/v1/refund-cases/{id}/settle"
    description: "Settle a computed refund (COMPUTED → SETTLED) with OCC on the agreement"
    roles: [FinancialAidOfficer]
    code: 200
    input: [expected_agreement_version]
    output: RefundCase
    side_effects: ["status → SETTLED; clawback cascade RELEASED→RETURNED on aid draws (descending index); recompute agreement.disbursed_aid_cents + ledger_balance_cents; EnrollmentAgreement.version += 1"]
  - method: POST
    path: "/v1/refund-cases/{id}/reverse"
    description: "Reverse a computed refund (COMPUTED → REVERSED)"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: RefundCase
    side_effects: ["status → REVERSED"]

  # ---- ExternshipAssignment ----
  - method: POST
    path: "/v1/externship-assignments"
    description: "Place a student at an externship site for a term window (PLACED)"
    roles: [AcademicAdvisor]
    code: 201
    input: [agreement_id, site_id, start_term_index, end_term_index, planned_hours]
    output: ExternshipAssignment
    side_effects: ["status = PLACED; ExternshipSite.active_assignment_count += 1; ExternshipSite.version += 1; requires site.status == ACTIVE, agreement.status == ENROLLED, no same-agreement window overlap, site capacity available"]
  - method: GET
    path: "/v1/externship-assignments"
    description: "List externship assignments, filterable by agreement or site"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["agreement_id?", "site_id?", "status?"]
    output: "ExternshipAssignment[]"
    side_effects: []
  - method: GET
    path: "/v1/externship-assignments/{id}"
    description: "Get an externship assignment"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: ExternshipAssignment
    side_effects: []
  - method: POST
    path: "/v1/externship-assignments/{id}/begin"
    description: "Begin an externship (PLACED → IN_PROGRESS)"
    roles: [AcademicAdvisor]
    code: 200
    input: []
    output: ExternshipAssignment
    side_effects: ["status → IN_PROGRESS"]
  - method: POST
    path: "/v1/externship-assignments/{id}/complete"
    description: "Complete an externship (IN_PROGRESS → COMPLETED), crediting verified hours"
    roles: [AcademicAdvisor]
    code: 200
    input: [actual_hours]
    output: ExternshipAssignment
    side_effects: ["status → COMPLETED; verified_hours = actual_hours; system EXTERNSHIP AttendanceEntry created; recompute agreement rollups; EnrollmentAgreement.version += 1; ExternshipSite.active_assignment_count -= 1; ExternshipSite.version += 1"]
  - method: POST
    path: "/v1/externship-assignments/{id}/terminate"
    description: "Terminate an externship (PLACED/IN_PROGRESS → TERMINATED)"
    roles: [AcademicAdvisor]
    code: 200
    input: []
    output: ExternshipAssignment
    side_effects: ["status → TERMINATED; ExternshipSite.active_assignment_count -= 1; ExternshipSite.version += 1"]

  # ---- LicensureExamAttempt ----
  - method: POST
    path: "/v1/licensure-exam-attempts"
    description: "Record a licensure exam sitting (computes PASS/FAIL)"
    roles: [AcademicAdvisor]
    code: 201
    input: [agreement_id, attempt_index, scaled_score, passing_score]
    output: LicensureExamAttempt
    side_effects: ["result computed; attempt_index unique per agreement; requires agreement.status IN {ENROLLED, GRADUATED}"]
  - method: GET
    path: "/v1/licensure-exam-attempts"
    description: "List licensure exam attempts, filterable by agreement"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["agreement_id?", "result?"]
    output: "LicensureExamAttempt[]"
    side_effects: []
  - method: GET
    path: "/v1/licensure-exam-attempts/{id}"
    description: "Get a licensure exam attempt"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: LicensureExamAttempt
    side_effects: []

  # ---- PlacementOutcome ----
  - method: POST
    path: "/v1/placement-outcomes"
    description: "Record a placement outcome for a graduated agreement"
    roles: [AcademicAdvisor]
    code: 201
    input: [agreement_id, outcome_term_index, outcome_type, "employer_name?"]
    output: PlacementOutcome
    side_effects: ["counts_as_placed computed; requires agreement.status == GRADUATED"]
  - method: GET
    path: "/v1/placement-outcomes"
    description: "List placement outcomes, filterable by agreement"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: ["agreement_id?", "outcome_type?"]
    output: "PlacementOutcome[]"
    side_effects: []
  - method: GET
    path: "/v1/placement-outcomes/{id}"
    description: "Get a placement outcome"
    roles: [Registrar, FinancialAidOfficer, AcademicAdvisor, SystemAdmin]
    code: 200
    input: []
    output: PlacementOutcome
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / generic ---
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (path or body id) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number, attended_hours > scheduled_hours, end <= start, etc." }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Unique key collision: duplicate disbursement_index/attempt_index per agreement, or duplicate Student.email" }

  # --- OCC / state ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version on refund settle" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a state from which the requested transition is defined" }

  # --- program / cohort lifecycle ---
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Operation requires the program to be OPEN (cohort creation/start)" }
  - { id: ERR_COHORT_NOT_STARTED, http: 409, condition: "Cohort start requires SystemClock.current_term_index >= cohort.start_term_index" }
  - { id: ERR_COHORT_CLOSED, http: 409, condition: "Cohort is COMPLETED and cannot accept new enrollments" }
  - { id: ERR_COHORT_FULL, http: 409, condition: "Cohort enrolled_count has reached seat_capacity" }
  - { id: ERR_OPEN_AGREEMENTS_EXIST, http: 409, condition: "Cohort cannot complete while agreements remain ENROLLED or LEAVE_OF_ABSENCE" }

  # --- enrollment / SAP ---
  - { id: ERR_ADMISSION_PREREQ_UNMET, http: 422, condition: "Student.hs_diploma_verified is false at ENROLL" }
  - { id: ERR_SCOPE_MISMATCH, http: 409, condition: "Cross-references resolve to inconsistent program/cohort/site scope" }
  - { id: ERR_SAP_DISMISSED, http: 409, condition: "Operation blocked because agreement.sap_standing == DISMISSED" }
  - { id: ERR_SAP_NOT_SATISFACTORY, http: 422, condition: "Graduation requires sap_standing IN {GOOD, WARNING}" }
  - { id: ERR_SAP_NOT_APPEALABLE, http: 409, condition: "Appeal allowed only when standing IN {PROBATION, DISMISSED}" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the agreement in {ENROLLED, LEAVE_OF_ABSENCE} (or ENROLLED-only as noted)" }

  # --- graduation hours / balance ---
  - { id: ERR_CLOCK_HOURS_UNMET, http: 422, condition: "clock_hours_completed below program.required_clock_hours at graduation" }
  - { id: ERR_THEORY_HOURS_UNMET, http: 422, condition: "theory_hours_completed below program.required_theory_hours at graduation" }
  - { id: ERR_EXTERNSHIP_HOURS_UNMET, http: 422, condition: "externship_hours_completed below program.required_externship_hours at graduation" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 402, condition: "ledger_balance_cents > 0 at graduation" }

  # --- aid / refund ---
  - { id: ERR_DISBURSEMENT_GATE_UNMET, http: 422, condition: "clock_hours_completed below required_clock_hours_gate at release" }
  - { id: ERR_DISBURSEMENT_OUT_OF_ORDER, http: 409, condition: "A lower-index draw is not yet RELEASED when releasing a higher-index draw" }
  - { id: ERR_AID_OVER_AWARD, http: 402, condition: "Released aid would exceed agreement.scheduled_aid_cents" }
  - { id: ERR_AGREEMENT_NOT_WITHDRAWN, http: 409, condition: "Refund settle requires the agreement to be WITHDRAWN" }
  - { id: ERR_REFUND_ALREADY_SETTLED, http: 409, condition: "Another RefundCase for the agreement is already SETTLED" }

  # --- externship ---
  - { id: ERR_SITE_SUSPENDED, http: 409, condition: "Externship site is SUSPENDED and cannot accept new placements" }
  - { id: ERR_EXTERNSHIP_WINDOW_CONFLICT, http: 409, condition: "Requested externship window overlaps an existing non-terminal assignment of the same agreement" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping active assignments at the site would exceed daily_slot_capacity" }
  - { id: ERR_EXTERNSHIP_NOT_STARTED, http: 409, condition: "Externship begin requires SystemClock.current_term_index >= start_term_index" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Owns program configuration and the deterministic term clock."
    identity: opaque
    exclusive_operations:
      - "POST /v1/programs — Create program"
      - "POST /v1/programs/{id}/open — Open program"
      - "POST /v1/programs/{id}/close — Close program"
      - "POST /v1/clock/advance — Advance term clock"
    shared_operations:
      - "POST /v1/externship-sites — Create site (with AcademicAdvisor)"
      - "POST /v1/externship-sites/{id}/suspend — Suspend site (with AcademicAdvisor)"
      - "GET /v1/programs/{id}/placement-report — Read placement report (with Registrar, AcademicAdvisor)"
      - "All GET reads"

  - name: Registrar
    description: "Owns admission, cohorts, and the enrollment-agreement lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /v1/students — Create student"
      - "PATCH /v1/students/{id} — Update student admission flag"
      - "POST /v1/cohorts — Create cohort"
      - "POST /v1/cohorts/{id}/start — Start cohort"
      - "POST /v1/cohorts/{id}/complete — Complete cohort"
      - "POST /v1/enrollment-agreements — Draft agreement"
      - "POST /v1/enrollment-agreements/{id}/enroll — Enroll"
      - "POST /v1/enrollment-agreements/{id}/cancel — Cancel draft"
      - "POST /v1/enrollment-agreements/{id}/graduate — Graduate"
      - "POST /v1/enrollment-agreements/{id}/withdraw — Withdraw"
    shared_operations:
      - "GET /v1/programs/{id}/placement-report — Read placement report (with AcademicAdvisor, SystemAdmin)"
      - "All GET reads"

  - name: FinancialAidOfficer
    description: "Owns tuition/aid disbursement and refund computation/settlement."
    identity: opaque
    exclusive_operations:
      - "POST /v1/aid-disbursements — Schedule draw"
      - "POST /v1/aid-disbursements/{id}/release — Release draw"
      - "POST /v1/aid-disbursements/{id}/cancel — Cancel draw"
      - "POST /v1/refund-cases — Compute refund"
      - "POST /v1/refund-cases/{id}/settle — Settle refund (OCC)"
      - "POST /v1/refund-cases/{id}/reverse — Reverse refund"
    shared_operations:
      - "All GET reads"

  - name: AcademicAdvisor
    description: "Owns attendance, SAP, externships, licensure exams, placement, and leave of absence."
    identity: opaque
    exclusive_operations:
      - "POST /v1/attendance-entries — Post attendance"
      - "POST /v1/attendance-entries/{id}/excuse — Excuse attendance"
      - "POST /v1/attendance-entries/{id}/void — Void attendance"
      - "POST /v1/sap-standings — Run SAP review"
      - "POST /v1/sap-standings/{id}/appeal — File appeal"
      - "POST /v1/sap-standings/{id}/resolve-appeal — Resolve appeal"
      - "POST /v1/enrollment-agreements/{id}/start-loa — Start LOA"
      - "POST /v1/enrollment-agreements/{id}/return-from-loa — Return from LOA"
      - "POST /v1/externship-assignments — Place externship"
      - "POST /v1/externship-assignments/{id}/begin — Begin externship"
      - "POST /v1/externship-assignments/{id}/complete — Complete externship"
      - "POST /v1/externship-assignments/{id}/terminate — Terminate externship"
      - "POST /v1/licensure-exam-attempts — Record exam attempt"
      - "POST /v1/placement-outcomes — Record placement outcome"
    shared_operations:
      - "POST /v1/externship-sites — Create site (with SystemAdmin)"
      - "POST /v1/externship-sites/{id}/suspend — Suspend site (with SystemAdmin)"
      - "GET /v1/programs/{id}/placement-report — Read placement report (with Registrar, SystemAdmin)"
      - "All GET reads"
