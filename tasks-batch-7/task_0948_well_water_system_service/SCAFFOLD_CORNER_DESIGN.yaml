              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_a}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_a}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/emergency-tickets/${tkt_a}/diagnosis"
              payload: { cause_class: "PUMP_FAILURE", onsite_estimate_cents: 20000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/emergency-tickets"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_b}", account_id: "${acct_id}", reported_outage_hours: 2.0 }
              as: Dispatcher
              captures: { tkt_b: $.data.id }
            - call: "POST /water-service/emergency-tickets/${tkt_b}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_b}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_b}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/emergency-tickets/${tkt_b}/diagnosis"
