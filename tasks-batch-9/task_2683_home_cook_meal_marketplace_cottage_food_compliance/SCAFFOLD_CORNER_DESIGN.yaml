          Both segregation pairs are keyed on X-User-ID, not on role, and each has a narrow scope: the
          reviewer bar looks only at the KITCHEN_INSPECTION reviewer (not the certificate reviewer) and
          only at decision == APPROVE, so the very same reviewer may legally request a revision on the
          item it is barred from approving; the officer bar compares the adjudicator against
