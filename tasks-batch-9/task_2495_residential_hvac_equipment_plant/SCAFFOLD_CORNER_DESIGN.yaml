              payload: { on_date: "2026-11-05" }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_id} == ERR_WAREHOUSE_NOT_FOUND"
            - "GET /plant/warehouses/${wh_id}/occupancy?on_date=2026-11-05 still returns 200 with occupancy_units == 0 - the real warehouse is unaffected"

