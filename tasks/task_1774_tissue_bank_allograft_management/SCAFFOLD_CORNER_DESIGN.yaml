  - section: calculations
    instances:
      - name: capacity_reserve_engages_at_eighty_percent
        claim_type: correct_result
        grounds: [calculations.storage_capacity_gating, "errors[ERR_FREEZER_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Pinned evaluation order: at 3/5 occupied utilization is 60% so reserve 0 and a 4th unit is admitted; once occupied hits 4/5 = 80.0% the reserve engages (2 slots, effective 3) and a 5th unit is rejected."
        test_recipe:
          setup: ["qualified supplier; freezer nominal_capacity 5; shipment A (3 units) admitted while utilization 0%; shipment B (1 unit) admitted at utilization 60% (reserve still 0 at admission time)"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-SMALL", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 5 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 1000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 1000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-003", unit_cost_cents: 1000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L2", serial_number: "U-004", unit_cost_cents: 1000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh2: $.data.id } }
          trigger:
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ: $.data.occupied_count, util: $.data.utilization_pct, res: $.data.quarantine_reserve_slots, eff: $.data.effective_capacity } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L3", serial_number: "U-005", unit_cost_cents: 1000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
          assert:
            - "occ == 4, util == 80.0, res == 2, eff == 3 (reserve engaged exactly at the 80.0 boundary; >= semantics)"
            - "err == ERR_FREEZER_CAPACITY_EXCEEDED (4 + 1 > 3 under the engaged reserve)"
            - "Shipment ${sh2} was admitted because at its admission utilization was 60% -> reserve 0 -> effective 5 (evaluation order pinned: current occupancy first)"

      - name: valuation_empty_population_after_reject
        claim_type: input_set_filtering
        grounds: [calculations.inventory_valuation, state_machines.Shipment.RECEIVED_to_REJECTED]
        distinguishing_aspect: "REJECTED shipments never enter the valuation population: after the only shipment is rejected, both FIFO and WEIGHTED_AVERAGE return on_hand_count 0 and total_value 0.0 (no division-by-zero)."
