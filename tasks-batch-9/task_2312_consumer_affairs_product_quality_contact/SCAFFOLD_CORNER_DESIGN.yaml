            - { call: "POST /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { scope_level: LINE, plant_id: "${pl1}", production_line_id: "${ln1}", lot_id: "${lot2}", window_start: "2026-07-20T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, captures: { e2: "$.data.error_id" } }
            - { call: "POST /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { scope_level: PLANT, plant_id: "${pl1}", production_line_id: "${ln1}", window_start: "2026-07-20T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, captures: { e3: "$.data.error_id" } }
            - { call: "POST /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { scope_level: PLANT, plant_id: "${pl1}", window_start: "2026-07-20T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, captures: { sig: "$.data.id", sl: "$.data.scope_level", mc: "$.data.membership_count" } }
            - { call: "GET /trend-signals", as: QualityLead, as_user_id: "${ql1}", payload: { plant_id: "${pl1}" }, captures: { tc: "$.total_count" } }
          assert:
            - "scope_level LOT without lot_id: HTTP 422 with data.error_id == \"ERR_SCOPE_SHAPE_INVALID\""
            - "scope_level LINE with a lot_id: HTTP 422 \"ERR_SCOPE_SHAPE_INVALID\" — the lot is forbidden, not merely ignored"
            - "scope_level PLANT with a production_line_id: HTTP 422 \"ERR_SCOPE_SHAPE_INVALID\""
            - "scope_level PLANT with neither: HTTP 201 with scope_level \"PLANT\", membership_count == 1 and detection_source \"MANUAL\""
            - "GET /trend-signals?plant_id=... has total_count == 1 — the three refusals created nothing"

