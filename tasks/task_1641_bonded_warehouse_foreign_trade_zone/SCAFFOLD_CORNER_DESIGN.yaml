      - name: c_bond_capacity_boundary
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_BOND_CAPACITY_EXCEEDED]"
        distinguishing_aspect: "Bond check is inclusive: projected exposure exactly equal to bond_coverage_cents (250 == 250) is admitted; the next admission (250 + 250 > 250) fails with ERR_BOND_CAPACITY_EXCEEDED (402)."
        test_recipe:
          setup: ["Zone with bond_coverage_cents 250; admission A1 (qty 5, unit 1000, HTS 0401.10 rate 0.05 -> deferred estimate 250) SUBMITTED; admission A2 (same numbers) SUBMITTED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Bond Zone", zone_code: "Z-BND", bond_coverage_cents: 250 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy 1", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a1: "$.data.id" }
