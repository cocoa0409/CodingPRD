            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
              captures: { expired: "$.data.expired_project_ids", pending: "$.data.choice_pending_donation_ids" }
            - call: "GET /giving/donations/${dn1}"
              payload: {}
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1_status: $.data.status, dn1_deadline: $.data.choice_deadline }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
              captures: { refunded: "$.data.auto_refunded_donation_ids" }
            - call: "GET /giving/donations/${dn1}"
              payload: {}
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1_final: $.data.status }
            - call: "GET /giving/donors/${d1}"
              payload: {}
              as: PlatformAdmin
              captures: { d_refunded: $.data.lifetime_refunded_cents }
          assert:
            - "expired contains ${p1} — the project whose deadline EQUALS the clock (2026-10-01T00:00:00Z) expires in this run"
            - "pending contains ${dn1} (link 2 — expiry cascaded to the donation)"
            - "dn1_status == CHOICE_PENDING and dn1_deadline == \"2026-10-15T00:00:00Z\" (sweep time + 14 days)"
            - "refunded contains ${dn1} — choice_deadline EQUALS the clock (inclusive boundary)"
            - "dn1_final == REFUNDED with refund_reason == EXPIRED_AUTO"
            - "d_refunded == 5000 (link 3 — the refund recomputed the donor aggregate)"
            - "Project.${p1}.status == EXPIRED and funded_cents == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: late_oversized_donation_temporal_precedes_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=24]
          - errors.ERR_FUNDING_WINDOW_CLOSED
          - errors.ERR_DONATION_EXCEEDS_REMAINING
        distinguishing_aspect: |
          Category pair (business_temporal, business_fiscal): one donation is BOTH
          past the funding deadline (temporal, priority 8) AND above the remaining
          need (fiscal, priority 24); the temporal error must win because the
          project is still FUNDING (the sweep has not run, so no state error fires).
        test_recipe:
          setup:
            - "FUNDING project (goal 10959, window 30 days, deadline 2026-10-01T00:00:00Z) funded to 9000c (remaining need 1959); logical clock advanced to exactly 2026-10-01T00:00:00Z with NO sweep run, so the project row still reads FUNDING."
