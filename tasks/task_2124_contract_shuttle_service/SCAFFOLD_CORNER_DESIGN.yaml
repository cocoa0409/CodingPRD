              payload: {}
              as: OpsPlanner
              captures: { nf_route: $.data.error_id }
            - call: "GET /trips/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: OpsPlanner
              captures: { nf_trip: $.data.error_id }
            - call: "GET /vehicles/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: FleetManager
              captures: { nf_vehicle: $.data.error_id }
            - call: "GET /drivers/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: OpsPlanner
              captures: { nf_driver: $.data.error_id }
            - call: "GET /on-demand-requests/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: ClientLiaison
              captures: { nf_request: $.data.error_id }
            - call: "GET /service-period-reports/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: ContractAdmin
              captures: { nf_report: $.data.error_id }
            - call: "GET /credit-memos/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: ContractAdmin
              captures: { nf_memo: $.data.error_id }
            - call: "GET /renewal-offers/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: ContractAdmin
              captures: { nf_offer: $.data.error_id }
            - call: "POST /maintenance-orders/99999999-9999-4999-8999-999999999999/close"
              payload: { outcome: "RETURN_TO_SERVICE" }
              as: FleetManager
              captures: { nf_order: $.data.error_id }
          assert:
            - "every trigger responds with HTTP 404"
            - "${nf_route} == 'ERR_ROUTE_NOT_FOUND'"
            - "${nf_trip} == 'ERR_TRIP_NOT_FOUND'"
            - "${nf_vehicle} == 'ERR_VEHICLE_NOT_FOUND'"
            - "${nf_driver} == 'ERR_DRIVER_NOT_FOUND'"
            - "${nf_request} == 'ERR_REQUEST_NOT_FOUND'"
            - "${nf_report} == 'ERR_REPORT_NOT_FOUND'"
            - "${nf_memo} == 'ERR_MEMO_NOT_FOUND'"
            - "${nf_offer} == 'ERR_OFFER_NOT_FOUND'"
            - "${nf_order} == 'ERR_MAINTENANCE_ORDER_NOT_FOUND'"

      - name: unknown_body_foreign_keys_return_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=55]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - errors[ERR_DRIVER_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys are resolved at priority 55, before any state or business rule: an assign naming a missing vehicle returns ERR_VEHICLE_NOT_FOUND, one naming a missing driver returns ERR_DRIVER_NOT_FOUND, and a memo naming a missing contract returns ERR_CONTRACT_NOT_FOUND."
