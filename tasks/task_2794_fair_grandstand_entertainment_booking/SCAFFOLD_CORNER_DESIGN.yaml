# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Coverage Index)
#
# Walk of references/claim-extraction-guide.md's nine sections against this
# scaffold's SCAFFOLD.yaml (§1.1-§1.7). §1.8 is the depth probe; this file is
# the breadth probe: every claim the declared surface makes that §1.8 does not
# already assert.
#
# Fixture convention. Unless an instance says otherwise every chain starts from
# the same canonical fixture, which is the one §1.8 uses:
#   clock    2026-08-01T00:00:00.000Z
#   edition  2026 "State Fair 2026", run 2026-08-20..2026-08-30, gate 1500,
#            talent budget cap 40000000, refund reserve 15000000,
#            max_shows_per_day 2, curfew 23:30, ATTENDANCE_WEIGHTED
#   stage    "Grandstand", reserved 4000, GA 6000, buffer 120, soft cap 4
#   agent    user_id "agent-hollis"
#   artist   "Dust Road Revival", COUNTRY / FAMILY, base_draw_score 62.50
#   offer    VERSUS, guarantee 12500000, split 0.85, breakeven 6000000,
#            2026-08-22, load-in 14:00Z, load-out 23:00Z, window 48h
# Any deviation from those numbers is stated in the instance's setup: prose,
# because the asserted literals depend on it.
#
# Every numeric literal in an `assert:` line was produced by executing the
# corresponding §1.3 formula with Decimal ROUND_HALF_UP against the pinned
# fixture inputs -- none is an estimate.
#
# Rows of the guide that this scaffold does not instantiate are skipped without
# ceremony: bulk_action (§1.5 declares no bulk endpoint), soft_delete /
# idempotency-key / pagination_with_filtering-as-a-layer / bulk_operations /
# scheduled_actions / multi_tenancy / rate_threshold_triggers /
# conditional_feature_flags (not in complexity_layers), the linear / compound
# state-machine shapes and the forward_looking / interval_merge / topological /
# projection / decay_function / constraint_propagation algorithms (no
# calculation declares them), eventual / saga consistency, and the
# approval_chain / peer_roles / hierarchical_override / delegated_authority
# role models (role_model is segregation_of_duties).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: create_fair_edition_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.FairEdition
          - endpoints.POST_fair_editions
          - response_envelope.success
        distinguishing_aspect: |
          A POST with every required field returns 201 and a body in which all ten
          input-sourced fields echo the request, the three computed ledgers read 0,
          and the four common fields (id, created_at, updated_at, version) are
          present because FairEdition declares common_fields: true.
        test_recipe:
          setup:
            - "Empty database; the logical clock is set to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
          trigger:
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_c1: "$.data.id" }
          assert:
            - "HTTP status is 201."
            - "The envelope carries meta.api_request_id, meta.api_request_timestamp, response_type and data per response_envelope.success."
            - "FairEdition.year == 2026 and FairEdition.name == 'State Fair 2026'."
            - "FairEdition.run_start_date == '2026-08-20' and FairEdition.run_end_date == '2026-08-30'."
            - "FairEdition.gate_admission_price_cents == 1500, talent_budget_cap_cents == 40000000, refund_reserve_cents == 15000000."
            - "FairEdition.max_shows_per_day == 2, curfew_utc_time == '23:30', strategy_basis == 'ATTENDANCE_WEIGHTED'."
            - "FairEdition.committed_guarantee_total_cents == 0, refund_liability_committed_cents == 0, open_stage_count == 0."
            - "$.data.id, $.data.created_at, $.data.updated_at and $.data.version are all present and non-null."

      - name: retrieve_stage_returns_stored_data_and_zero_hold_ledger
        claim_type: retrieval
        grounds:
          - entities.Stage
          - endpoints.GET_stages_by_id
          - calculations.stage_hold_ledger
        distinguishing_aspect: |
          GET /grandstand/stages/{id} returns the stored row for the id in the path:
          all four input fields echo the creation request and the two computed
          fields read held_show_count == 0 and booking_posture == OPEN because no
          offer has ever been sent against this stage.
        test_recipe:
          setup:
            - "Canonical edition and the canonical Grandstand stage; nothing else exists."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_r1: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_r1}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_r1: "$.data.id" }
          trigger:
            - call: "GET /grandstand/stages/${st_r1}"
              payload: {}
              as: ProductionManager
          assert:
            - "HTTP status is 200."
            - "Stage.id == ${st_r1} and Stage.fair_edition_id == ${ed_r1}."
            - "Stage.name == 'Grandstand', reserved_seat_capacity == 4000, ga_capacity == 6000."
            - "Stage.changeover_buffer_minutes == 120 and Stage.slot_soft_cap == 4."
            - "Stage.held_show_count == 0 and Stage.booking_posture == 'OPEN'."

      - name: list_offers_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_offers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With exactly three DRAFT offers on one edition, limit=2/offset=0 returns
          two rows with total_count == 3 and has_more == true, and limit=2/offset=2
          returns the remaining one row with has_more == false; total_count counts
          the filtered set, not the page.
        test_recipe:
          setup:
            - "Canonical edition, stage, agent and artist."
            - "Three offers created (never sent, so no slot, radius, genre or budget rule is consulted) on 2026-08-22, 2026-08-25 and 2026-08-28."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_l1: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_l1}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_l1: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_l1: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_l1}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar_l1: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_l1}", artist_id: "${ar_l1}", target_stage_id: "${st_l1}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z" }
              as: TalentBuyer
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_l1}", artist_id: "${ar_l1}", target_stage_id: "${st_l1}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-25", load_in_start_utc: "2026-08-25T14:00:00.000Z", load_out_end_utc: "2026-08-25T23:00:00.000Z" }
              as: TalentBuyer
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_l1}", artist_id: "${ar_l1}", target_stage_id: "${st_l1}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-28", load_in_start_utc: "2026-08-28T14:00:00.000Z", load_out_end_utc: "2026-08-28T23:00:00.000Z" }
              as: TalentBuyer
          trigger:
            - call: "GET /grandstand/offers"
              payload: { fair_edition_id: "${ed_l1}", limit: 2, offset: 0 }
              as: TalentBuyer
            - call: "GET /grandstand/offers"
              payload: { fair_edition_id: "${ed_l1}", limit: 2, offset: 2 }
              as: TalentBuyer
            - call: "GET /grandstand/offers"
              payload: { fair_edition_id: "${ed_l1}", status: "SENT" }
              as: TalentBuyer
          assert:
            - "First call: HTTP 200, $.data holds exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0."
            - "Second call: $.data holds exactly 1 row, total_count == 3, has_more == false, limit == 2, offset == 2."
            - "The three ids returned across the two pages are pairwise distinct and cover all three created offers."
            - "Third call: $.data holds 0 rows, total_count == 0, has_more == false -- every offer is still DRAFT."

      - name: get_artist_with_unknown_uuid_returns_artist_not_found
        claim_type: not_found
        grounds:
          - validations.priority_8
          - errors.ERR_ARTIST_NOT_FOUND
          - endpoints.GET_artists_by_id
          - response_envelope.error
        distinguishing_aspect: |
          A syntactically valid UUID that matches no Artist row returns 404 with
          error_id ERR_ARTIST_NOT_FOUND in the error envelope -- never 200 with a
          null body and never 400.
        test_recipe:
          setup:
            - "Empty database apart from the clock; no Artist row exists at all."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
          trigger:
            - call: "GET /grandstand/artists/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: TalentBuyer
              captures: { err_nf_ar: "$.data.error_id" }
          assert:
            - "HTTP status is 404."
            - "$.data.error_id == 'ERR_ARTIST_NOT_FOUND'."
            - "$.data.message is present and non-empty per response_envelope.error."
            - "The envelope still carries meta.api_request_id and meta.api_request_timestamp."

      - name: create_offer_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_offers
        distinguishing_aspect: |
          Each of backend_split_pct and target_show_date is an Offer input field with
          no declared default, so omitting either yields 400 ERR_INVALID_REQUEST and
          persists nothing -- the offer list stays empty afterwards.
        test_recipe:
          setup:
            - "Canonical edition, stage, agent and artist; no offer exists yet."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_rq: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_rq}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_rq: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_rq: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_rq}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar_rq: "$.data.id" }
          trigger:
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_rq}", artist_id: "${ar_rq}", target_stage_id: "${st_rq}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z" }
              as: TalentBuyer
              captures: { err_rq1: "$.data.error_id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_rq}", artist_id: "${ar_rq}", target_stage_id: "${st_rq}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z" }
              as: TalentBuyer
              captures: { err_rq2: "$.data.error_id" }
            - call: "GET /grandstand/offers"
              payload: { fair_edition_id: "${ed_rq}" }
              as: TalentBuyer
          assert:
            - "First trigger (backend_split_pct omitted): HTTP 400 and $.data.error_id == 'ERR_INVALID_REQUEST'."
            - "Second trigger (target_show_date omitted): HTTP 400 and $.data.error_id == 'ERR_INVALID_REQUEST'."
            - "Third trigger: total_count == 0 -- neither rejected request created an Offer row."

      - name: optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.FairEdition.fields.max_shows_per_day
          - entities.Stage.fields.changeover_buffer_minutes
          - entities.Stage.fields.slot_soft_cap
          - entities.Artist.fields.base_draw_score
          - entities.Offer.fields.response_window_hours
        distinguishing_aspect: |
          Creating each of FairEdition, Stage, Artist and Offer with only its
          required fields yields exactly the declared defaults: max_shows_per_day 2,
          curfew_utc_time '23:30', strategy_basis ATTENDANCE_WEIGHTED,
          changeover_buffer_minutes 120, slot_soft_cap 3, base_draw_score 50.0,
          prior-year counters 0, backend_breakeven_cents 0, radius 150/30/30 and
          response_window_hours 48.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
            - "Every create below carries only the fields §1.5 marks as required (no '?' suffix)."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
          trigger:
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000 }
              as: FairOperationsDirector
              captures: { ed_df: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_df}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000 }
              as: FairOperationsDirector
              captures: { st_df: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_df: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_df}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY" }
              as: TalentBuyer
              captures: { ar_df: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_df}", artist_id: "${ar_df}", target_stage_id: "${st_df}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z" }
              as: TalentBuyer
              captures: { of_df: "$.data.id" }
          assert:
            - "FairEdition.max_shows_per_day == 2, curfew_utc_time == '23:30', strategy_basis == 'ATTENDANCE_WEIGHTED'."
            - "Stage.changeover_buffer_minutes == 120 and Stage.slot_soft_cap == 3."
            - "Artist.base_draw_score == 50.0, prior_year_paid_attendance == 0, prior_year_net_revenue_cents == 0."
            - "Offer.backend_breakeven_cents == 0, radius_miles == 150, radius_days_before == 30, radius_days_after == 30, response_window_hours == 48."
            - "All four creates return their declared success code (201)."

      - name: offer_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Offer.fields.status
          - entities.Offer.fields.round_count
          - entities.Offer.fields.radius_waiver_granted
          - entities.Offer.fields.sent_at_utc
          - entities.Offer.fields.expires_at_utc
        distinguishing_aspect: |
          Client-supplied values for the computed and system fields of Offer are
          discarded: a create that ships status ACCEPTED, round_count 5,
          radius_waiver_granted true and a sent_at_utc still returns status DRAFT,
          round_count 0, radius_waiver_granted false and null timestamps.
        test_recipe:
          setup:
            - "Canonical edition, stage, agent and artist."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_cf: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_cf}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_cf: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_cf: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_cf}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar_cf: "$.data.id" }
          trigger:
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_cf}", artist_id: "${ar_cf}", target_stage_id: "${st_cf}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", status: "ACCEPTED", round_count: 5, radius_waiver_granted: true, sent_at_utc: "2026-07-01T00:00:00.000Z", agreed_guarantee_cents: 999 }
              as: TalentBuyer
              captures: { of_cf: "$.data.id" }
          assert:
            - "HTTP status is 201 -- undeclared body keys are ignored, not rejected (validations[priority=3] constrains declared inputs only)."
            - "Offer.status == 'DRAFT' (the initial_state of state_machines.Offer), not 'ACCEPTED'."
            - "Offer.round_count == 0, not 5."
            - "Offer.radius_waiver_granted == false, not true."
            - "Offer.sent_at_utc is null and Offer.expires_at_utc is null."
            - "Offer.countered_guarantee_cents is null and Offer.agreed_guarantee_cents is null, not 999."

      - name: system_fields_are_server_generated_on_offer_create
        claim_type: system_fields
        grounds:
          - entities.Offer.fields.created_by_user_id
          - roles.TalentBuyer
          - endpoints.POST_offers
        distinguishing_aspect: |
          Offer.created_by_user_id is stamped from the request's X-User-ID and from
          nowhere else: two otherwise identical creates sent as buyer-01 and
          buyer-02 produce two Offer rows whose created_by_user_id differ exactly by
          the header, each with its own server-minted id, created_at and version.
        test_recipe:
          setup:
            - "Canonical edition, stage, agent and artist."
            - "Two TalentBuyer identities are used: X-User-ID buyer-01 and buyer-02."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "State Fair 2026", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed_sf: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed_sf}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st_sf: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              as_user_id: "buyer-01"
              captures: { ag_sf: "$.data.id" }
            - call: "POST /grandstand/artists"
