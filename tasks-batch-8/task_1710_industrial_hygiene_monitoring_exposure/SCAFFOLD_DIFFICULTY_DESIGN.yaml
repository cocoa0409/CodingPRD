            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c2}", collection_date: "2026-08-03", start_minute: 720, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s2: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c3}", collection_date: "2026-08-03", start_minute: 719, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { err: $.data.error_id } }
          assert:
            - "Sample ${s1} (480..720) and ${s2} (720..960) both created — touching half-open intervals do not conflict"
            - "Third request (start 719, overlapping [480,720)) returns http 409 with error_id ERR_PUMP_DOUBLE_BOOKED"
            - "SamplingPlan.${plan}.active_sample_count == 2 (rejected sample never entered the count)"

      - name: batch_inclusive_window_and_capacity
        grounds:
          - errors[ERR_BATCH_WINDOW_CLOSED]
          - errors[ERR_BATCH_CAPACITY_FULL]
          - entities.LabBatch.fields.max_capacity
        distinguishing_aspect: |
          Resource = LabBatch with DIFFERENT interval semantics than the pump rule: the intake
          window is CLOSED/inclusive at both ends (2026-08-12 accepted, 2026-08-13 rejected) and
          occupation is aggregate capacity (intake_count < max_capacity), not pairwise geometry.
          Also pins temporal (priority 9) beating capacity (priority 10) when both fail.
        test_recipe:
          setup:
            - "SEG H=3 plan FIELD_COMPLETE with 3 SEALED samples; batch window 2026-08-10..2026-08-12, max_capacity 2; clock at 2026-08-12 (inclusive end)"
