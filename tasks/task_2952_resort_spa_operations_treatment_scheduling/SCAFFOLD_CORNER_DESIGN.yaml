  - name: ce_gate_hours_shortfall_then_ethics_minimum_at_license_review
    claim_type: Cascading validation
    grounds:
    - validations.p17_ERR_CE_HOURS_INSUFFICIENT.check
    - validations.p18_ERR_CE_ETHICS_REQUIREMENT_UNMET.check
    - calculations.ce_compliance_evaluation.constants.CE_PER_CATEGORY_CAP_HOURS
    - calculations.ce_compliance_evaluation.constants.CE_ETHICS_MIN_HOURS
    distinguishing_aspect: "Rung 18 can only be observed after rung 17 is satisfied, and the credited total that satisfies 17 depends on CE_PER_CATEGORY_CAP_HOURS: 8.0 + 4.0 CLINICAL hours credit only 8.0, so the second review attempt still fails at 17 while a naive uncapped sum would credit 12.0 and surface the ethics error one attempt too early."
    test_recipe:
      setup: One therapist with a PENDING_REVIEW licence requiring 12.0 CE hours over a CALENDAR_WINDOW starting 2024-01-01 and ending 2027-06-30. The licence is submitted by co-1 so co-2 can review it without tripping segregation of duties. CE records are added between review attempts.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-01T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /therapists
        payload: { full_name: "Therapist Under CE Review", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "CA" }
        as: SpaDirector
        captures: { th_ce: $.data.id }
      - call: POST /therapists/${th_ce}/licenses
        payload: { license_number: "LMT-2001", license_type: "LMT", state_code: "CA", issued_on: "2024-01-01", expires_on: "2027-06-30", current_period_start_on: "2024-01-01", ce_hours_required: 12 }
        as: ComplianceOfficer
        as_user_id: "co-1"
        captures: { lic_ce: $.data.id }
      trigger:
      - call: POST /therapist-licenses/${lic_ce}/review
        payload: { decision: "VERIFIED" }
        as: ComplianceOfficer
        as_user_id: "co-2"
        captures: { err_no_ce_at_all: $.data.error_id }
      - call: POST /therapist-licenses/${lic_ce}/ce-records
        payload: { course_code: "CLIN-101", category: "CLINICAL", ce_hours: 8, completed_on: "2025-03-01" }
        as: ComplianceOfficer
        as_user_id: "co-1"
      - call: POST /therapist-licenses/${lic_ce}/ce-records
        payload: { course_code: "CLIN-102", category: "CLINICAL", ce_hours: 4, completed_on: "2025-04-01" }
        as: ComplianceOfficer
        as_user_id: "co-1"
      - call: GET /therapist-licenses/${lic_ce}/ce-compliance
        as: ComplianceOfficer
        as_user_id: "co-2"
      - call: POST /therapist-licenses/${lic_ce}/review
        payload: { decision: "VERIFIED" }
        as: ComplianceOfficer
        as_user_id: "co-2"
        captures: { err_capped_short: $.data.error_id }
      - call: POST /therapist-licenses/${lic_ce}/ce-records
        payload: { course_code: "SAFE-201", category: "SAFETY", ce_hours: 4, completed_on: "2025-05-01" }
        as: ComplianceOfficer
        as_user_id: "co-1"
      - call: GET /therapist-licenses/${lic_ce}/ce-compliance
        as: ComplianceOfficer
        as_user_id: "co-2"
      - call: POST /therapist-licenses/${lic_ce}/review
        payload: { decision: "VERIFIED" }
        as: ComplianceOfficer
        as_user_id: "co-2"
        captures: { err_ethics: $.data.error_id }
      - call: POST /therapist-licenses/${lic_ce}/ce-records
        payload: { course_code: "ETH-301", category: "ETHICS", ce_hours: 2, completed_on: "2025-06-01" }
        as: ComplianceOfficer
        as_user_id: "co-1"
      - call: GET /therapist-licenses/${lic_ce}/ce-compliance
        as: ComplianceOfficer
        as_user_id: "co-2"
      - call: POST /therapist-licenses/${lic_ce}/review
        payload: { decision: "VERIFIED", review_note: "CE complete" }
        as: ComplianceOfficer
        as_user_id: "co-2"
      assert:
      - "the first review attempt, with no CE records at all, returns 409 ERR_CE_HOURS_INSUFFICIENT and leaves verification_status PENDING_REVIEW, reviewed_by_user_id null and credited_ce_hours 0"
      - "after CLINICAL 8.0 + CLINICAL 4.0 the ce-compliance read reports credited_hours 8.0, not 12.0, because CE_PER_CATEGORY_CAP_HOURS caps each category at 8.0; shortfall_hours is 4.0 and compliant is false"
      - "the second review attempt therefore still returns 409 ERR_CE_HOURS_INSUFFICIENT, never ERR_CE_ETHICS_REQUIREMENT_UNMET — rung 17 must be satisfied before rung 18 is evaluated"
      - "after SAFETY 4.0 the ce-compliance read reports credited_hours 12.0, shortfall_hours 0.0, ethics_hours_credited 0.0 and ethics_requirement_met false"
      - "the third review attempt returns 409 ERR_CE_ETHICS_REQUIREMENT_UNMET: rung 17 now passes and rung 18 fails because 0.0 < CE_ETHICS_MIN_HOURS"
      - "after ETHICS 2.0 the ce-compliance read reports credited_hours 14.0, ethics_hours_credited 2.0, shortfall_hours 0.0 and compliant true"
      - "the fourth review attempt returns 200 with verification_status VERIFIED, verified_at == 2026-08-01T09:00:00.000Z, reviewed_by_user_id co-2, review_note 'CE complete' and credited_ce_hours 14.0 snapshotted from the CALENDAR_WINDOW evaluation"
      - "all three rejected attempts left verification_status at PENDING_REVIEW, so the licence machine never moved and version advanced only on the successful review"

  - name: room_class_availability_shift_window_double_booking_and_lead_time_rungs
    claim_type: Violation → Error
    grounds:
    - validations.p21_ERR_ROOM_CLASS_MISMATCH.check
    - validations.p22_ERR_ROOM_UNAVAILABLE.check
    - validations.p23_ERR_OUTSIDE_SHIFT_WINDOW.check
    - validations.p24_ERR_THERAPIST_DOUBLE_BOOKED.check
    - validations.p26_ERR_BOOKING_LEAD_TIME.check
    distinguishing_aspect: "Each probe violates exactly one of the five scheduling rungs while every other rung is satisfied, so the five error_ids must be distinguishable: the double-booking probe deliberately uses a second DRY room so the therapist-interval rung fires rather than the room-turnover rung, and the lead-time probe sits inside an AVAILABLE block so rung 23 cannot pre-empt rung 26."
    test_recipe:
      setup: A cleared guest, one fully licensed and certified therapist with AVAILABLE shift blocks on 2026-08-01 and 2026-08-10 from 08:00Z to 22:00Z, a DRY treatment type of 60 minutes, three DRY rooms and one HYDRO room. The clock sits at 2026-08-01T09:00:00.000Z.
