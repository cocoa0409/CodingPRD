  - rule_id: priority_pair_validation_conflict
    instances:

      - name: grind_run_state_gate_outranks_trim_insufficiency
        grounds:
          - validations[priority=13]
          - validations[priority=36]
          - errors[ERR_GRIND_RUN_NOT_OPEN]
          - errors[ERR_TRIM_INSUFFICIENT]
          - state_machines.GrindRun.SCHEDULED_to_ABORTED
          - entities.TrimLot.fields.remaining_lb
        distinguishing_aspect: |
          One request violates a `state` rule (priority 13, ERR_GRIND_RUN_NOT_OPEN, 409) and a
          `business_fiscal` rule (priority 36, ERR_TRIM_INSUFFICIENT, 422) at once and must
          return the state error; replaying the identical over-weight input against an open run
          returns the fiscal error, proving the ordering rather than a fixed preference. The
          sibling instance pairs `business_safety` with `business_temporal` instead.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "CuttingTest T1 on P1 is APPROVED, so its GRIND_TRIM line seq 2 carries allocated_cost_per_lb_cents 367.3333 and lean 78.0."
            - "TrimLot TL-A78 exists AVAILABLE with received_lb 12.00 and remaining_lb 12.00."
            - "GrindRun GR1 (window 2026-08-06T06:00Z..07:00Z) has been ABORTED before any input was added; GrindRun GR2 (window 2026-08-06T08:00Z..09:00Z, same declared_coo USA) is SCHEDULED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
