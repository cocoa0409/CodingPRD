          - state_machines.ReviewInvitation.INVITED_to_EXPIRED
          - calculations.review_lateness_and_reminder_sweep
          - calculations.reviewer_reliability_score
          - entities.Manuscript.fields.review_shortfall_flag
          - endpoints.POST /_ops/run-reminder-sweep
        distinguishing_aspect: |
          A sweep run exactly at due_at expires the invitation (inclusive boundary) and reconciles
          every derived counter in one request: expired_count 0 -> 1, open_invitation_count 1 -> 0,
          reliability_score_rolling 50.00 -> 0.00 (n_closed 1, all expired), and the manuscript's
          review_shortfall_flag false -> true, with reminded_invitation_count 0 because expiry
          takes precedence over the reminder branch.
