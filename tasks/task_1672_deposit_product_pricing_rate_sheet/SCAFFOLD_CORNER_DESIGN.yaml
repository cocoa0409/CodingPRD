scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: create_product_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.DepositProduct, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required rate_cap_bp on product creation fails schema validation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /deposit-products", payload: { product_code: "BAD", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: rate_sheet_defaults_and_sheet_version_sequence
        claim_type: computed_fields
        grounds: [entities.RateSheet.fields.sheet_version, entities.RateSheet.fields.end_date, entities.RateSheet.fields.total_projected_balance_cents]
        distinguishing_aspect: "First sheet for a (product, market) pair gets sheet_version 1 and defaulted end_date 9999-12-31; the sequence is per-pair, so a first sheet for a DIFFERENT market also gets 1; total_projected_balance_cents is the tier projection sum."
        test_recipe:
          setup: ["product P-DFT exists"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "DFT", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_dft: $.data.id } }
          trigger:
            - { call: "POST /rate-sheets", payload: { product_id: "${p_dft}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 1000000, rate_bp: 100, projected_balance_cents: 2000000 }, { tier_index: 1, lower_bound_cents: 1000000, upper_bound_cents: -1, rate_bp: 150, projected_balance_cents: 3000000 } ] }, as: PricingAnalyst, captures: { s1_ver: $.data.sheet_version, s1_end: $.data.end_date, s1_tot: $.data.total_projected_balance_cents, s1_st: $.data.status } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_dft}", market_code: "US-EAST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s2_ver: $.data.sheet_version } }
          assert:
            - "first sheet: sheet_version == 1, status == DRAFT (initial state), end_date == 9999-12-31 (default), total_projected_balance_cents == 5000000"
            - "second sheet on a different market: sheet_version == 1 again (sequence is per product+market pair)"

      - name: get_missing_sheet_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but non-existent sheet id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rate-sheets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PricingAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: body_fk_references_validated
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_PRODUCT_NOT_FOUND]", "errors[ERR_ACCOUNT_NOT_FOUND]", "errors[ERR_BUNDLE_NOT_FOUND]"]
        distinguishing_aspect: "Body FK references are validated with domain errors: bogus product_id on sheet create -> ERR_PRODUCT_NOT_FOUND; bogus account_id on exception create -> ERR_ACCOUNT_NOT_FOUND; bogus bundle_id on enrollment -> ERR_BUNDLE_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rate-sheets", payload: { product_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { err_prod: $.data.error_id } }
            - { call: "POST /exception-pricing-requests", payload: { account_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", sheet_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", requested_rate_bp: 500, term_days: 30 }, as: BranchBanker, as_user_id: "banker-1", captures: { err_acct: $.data.error_id } }
            - { call: "POST /bundle-enrollments", payload: { bundle_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", customer_ref: "CX" }, as: OperationsAdmin, captures: { err_bun: $.data.error_id } }
          assert:
            - "sheet create -> error_id ERR_PRODUCT_NOT_FOUND (422)"
            - "exception create -> error_id ERR_ACCOUNT_NOT_FOUND (422) — account checked before sheet (left-to-right body FK order)"
            - "enrollment create -> error_id ERR_BUNDLE_NOT_FOUND (422)"

      - name: account_open_without_effective_sheet_fails
        claim_type: creation
        grounds: ["endpoints.POST /deposit-accounts", "errors[ERR_SHEET_NOT_FOUND]"]
        distinguishing_aspect: "Opening an account for a product+market with no EFFECTIVE sheet fails with ERR_SHEET_NOT_FOUND (422) — the sheet_id resolver finds no effective sheet."
        test_recipe:
          setup: ["product P-NOS exists; no sheet for (P-NOS, US-WEST)"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "NOS", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_nos: $.data.id } }
          trigger:
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CN", product_id: "${p_nos}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "ONLINE" }, as: BranchBanker, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHEET_NOT_FOUND (422)"

      - name: immutable_system_fields_on_create
        claim_type: system_fields
        grounds: [entities.DepositAccount.fields.rate_source, entities.DepositAccount.fields.posted_interest_cents]
        distinguishing_aspect: "A new account's system-managed fields are initialized by the server: rate_source SHEET, posted_interest_cents 0, unposted_accrual_milli 0, version 1."
        test_recipe:
          setup:
            - "P-SYS (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with EFFECTIVE single-tier sheet [0,unbounded)@123 in US-WEST (effective 2026-08-01, lead 7, floor 0)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "SYS", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_sys: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_sys}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 123, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_sys: $.data.id } }
            - { call: "POST /rate-sheets/${s_sys}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_sys}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_sys}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_sys}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_sys}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_sys}/activate", payload: {}, as: PricingAnalyst }
          trigger:
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CS", product_id: "${p_sys}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "ONLINE" }, as: BranchBanker, captures: { a_rs: $.data.rate_source, a_posted: $.data.posted_interest_cents, a_unp: $.data.unposted_accrual_milli, a_v: $.data.version, a_rate: $.data.current_rate_bp, a_lc: $.data.lifecycle } }
          assert:
            - "rate_source == SHEET, lifecycle == OPEN (initial parallel-dimension states)"
            - "posted_interest_cents == 0, unposted_accrual_milli == 0, version == 1"
            - "current_rate_bp == 123 (computed from the effective sheet, not client-supplied)"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: activate_from_draft_returns_sheet_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RateSheet, "errors[ERR_SHEET_INVALID_STATE]"]
        distinguishing_aspect: "activate is only valid from SCHEDULED; from DRAFT it fails with ERR_SHEET_INVALID_STATE and no deployments/notices exist yet."
        test_recipe:
          setup: ["product P-IV1 and a DRAFT sheet (never submitted)"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "IV1", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_iv: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_iv}", market_code: "US-WEST", effective_date: "2026-08-01", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_iv: $.data.id } }
          trigger:
            - { call: "POST /rate-sheets/${s_iv}/activate", payload: {}, as: PricingAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHEET_INVALID_STATE (409); sheet remains DRAFT"

      - name: double_submit_returns_sheet_invalid_state
        claim_type: idempotency
        grounds: [state_machines.RateSheet.DRAFT_to_COMMITTEE_REVIEW, "errors[ERR_SHEET_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a sheet already in COMMITTEE_REVIEW is rejected with ERR_SHEET_INVALID_STATE — the submit trigger is not idempotent."
        test_recipe:
          setup: ["product P-IV2; sheet submitted once (COMMITTEE_REVIEW)"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "IV2", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_iv2: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_iv2}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_iv2: $.data.id } }
            - { call: "POST /rate-sheets/${s_iv2}/submit", payload: {}, as: PricingAnalyst }
          trigger:
            - { call: "POST /rate-sheets/${s_iv2}/submit", payload: {}, as: PricingAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHEET_INVALID_STATE (409)"

      - name: review_decision_on_retired_sheet_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RateSheet, "errors[ERR_SHEET_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: review-decision on a RETIRED sheet fails with ERR_SHEET_INVALID_STATE."
        test_recipe:
          setup: ["product P-IV3; sheet created then retired directly from DRAFT"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "IV3", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_iv3: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_iv3}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_iv3: $.data.id } }
            - { call: "POST /rate-sheets/${s_iv3}/retire", payload: {}, as: PricingCommittee, captures: { st_ret: $.data.status } }
          trigger:
            - { call: "POST /rate-sheets/${s_iv3}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee, captures: { err: $.data.error_id } }
          assert:
            - "retire from DRAFT succeeded: status == RETIRED"
            - "review-decision -> error_id == ERR_SHEET_INVALID_STATE"

      - name: promo_close_from_draft_and_terminal_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.PromotionalOffer, "errors[ERR_PROMO_INVALID_STATE]"]
        distinguishing_aspect: "close is valid only from ACTIVE; from DRAFT it fails with ERR_PROMO_INVALID_STATE."
        test_recipe:
          setup: ["product P-IV4 (allows_promos); one DRAFT offer"]
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "IV4", product_class: "MONEY_MARKET", term_months: 0, tier_application: "MARGINAL", rate_cap_bp: 600, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_iv4: $.data.id } }
            - { call: "POST /promotional-offers", payload: { product_id: "${p_iv4}", market_code: "US-WEST", promo_rate_bp: 500, promo_term_days: 30, enrollment_start: "2026-08-01", enrollment_end: "2026-08-31", min_opening_balance_cents: 0, rollover_treatment: "ROLL_TO_SHEET" }, as: PricingAnalyst, captures: { pr_iv: $.data.id } }
          trigger:
            - { call: "POST /promotional-offers/${pr_iv}/close", payload: {}, as: PricingAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROMO_INVALID_STATE (409)"

      - name: decision_on_declined_exception_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ExceptionPricingRequest, "errors[ERR_EXCEPTION_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: a further decision fails with ERR_EXCEPTION_INVALID_STATE."
        test_recipe:
          setup:
            - "P-IV5 (CD, term 12, WHOLE_BALANCE, cap 900) with EFFECTIVE single-tier sheet [0,unbounded)@480 in US-WEST (effective 2026-08-01, lead 7, floor 0); account AV 1,000,000; request XV (requested 500, delta 20, BRANCH) DECLINED by a different banker"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "IV5", product_class: "CD", term_months: 12, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: true }, as: OperationsAdmin, captures: { p_iv5: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_iv5}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 480, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_iv5: $.data.id } }
            - { call: "POST /rate-sheets/${s_iv5}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_iv5}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_iv5}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_iv5}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_iv5}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_iv5}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CV5", product_id: "${p_iv5}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "BRANCH" }, as: BranchBanker, captures: { av5: $.data.id } }
            - { call: "POST /exception-pricing-requests", payload: { account_id: "${av5}", sheet_id: "${s_iv5}", requested_rate_bp: 500, term_days: 30 }, as: BranchBanker, as_user_id: "banker-1", captures: { xv5: $.data.id } }
            - { call: "POST /exception-pricing-requests/${xv5}/decision", payload: { decision: "DECLINE" }, as: PricingCommittee, as_user_id: "committee-1", captures: { st_dec: $.data.status } }
          trigger:
            - { call: "POST /exception-pricing-requests/${xv5}/decision", payload: { decision: "APPROVE" }, as: PricingCommittee, as_user_id: "committee-2", captures: { err: $.data.error_id } }
          assert:
            - "DECLINE succeeded: status == DECLINED"
            - "second decision -> error_id == ERR_EXCEPTION_INVALID_STATE (409)"

      - name: account_lifecycle_invalid_transitions
        claim_type: invalid_transition
        grounds: [state_machines.DepositAccount, "errors[ERR_ACCOUNT_INVALID_STATE]"]
        distinguishing_aspect: "UNFREEZE from OPEN and CLOSE from CLOSED both fail with ERR_ACCOUNT_INVALID_STATE; interest posting on CLOSED fails the same way."
        test_recipe:
          setup:
            - "P-IV6 (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with EFFECTIVE single-tier sheet [0,unbounded)@100 in US-WEST (effective 2026-08-01, lead 7, floor 0); accounts AO (OPEN) and AC (CLOSED)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "IV6", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_iv6: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_iv6}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_iv6: $.data.id } }
            - { call: "POST /rate-sheets/${s_iv6}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_iv6}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_iv6}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_iv6}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_iv6}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_iv6}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CO6", product_id: "${p_iv6}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "ONLINE" }, as: BranchBanker, captures: { ao6: $.data.id } }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CC6", product_id: "${p_iv6}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "ONLINE" }, as: BranchBanker, captures: { ac6: $.data.id } }
