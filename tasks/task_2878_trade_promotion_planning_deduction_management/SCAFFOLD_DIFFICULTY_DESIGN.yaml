            - "context before the trigger: BudgetAllocation.${alloc_id}.posture == RESTRICTED, available_amount == 0.00, and Promotion.${promo_y_id}.planned_total_spend == 2250.00, so priority 95 genuinely fires"
            - "context before the trigger: Customer.${cust_id}.trading_status == CREDIT_HOLD, so priority 53 genuinely fires"
            - "Promotion.${promo_y_id}.lifecycle_status == SUBMITTED after the refusal (no partial commit)"
