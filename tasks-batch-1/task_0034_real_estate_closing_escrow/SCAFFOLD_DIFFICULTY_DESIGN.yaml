            - call: "POST /purchase-agreements/${agr_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_id}", amount_cents: 1500000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd1_id: $.data.id }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_id}", amount_cents: 1000000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd2_id: $.data.id }
            - call: "POST /wire-instructions"
              payload: { agreement_id: "${agr_id}", party: "BUYER", beneficiary_bank_name: "BB", beneficiary_account_last4: "1111", routing_number: "021000021" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { wi_b: $.data.id }
            - call: "POST /wire-instructions/${wi_b}/callback-verify"
              payload: { verifier_id: "${eo_id}", voice_callback_reference: "VC-INV" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /wire-instructions/${wi_b}/lock"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /purchase-agreements/${agr_id}/terminate"
              payload: { terminated_reason: "Deal off." }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /disbursements"
              payload: { escrow_account_id: "${esc_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          assert:
            - "EarnestMoneyDeposit.${emd1_id}.status == REFUNDED"
            - "EarnestMoneyDeposit.${emd2_id}.status == REFUNDED"
            - "trigger[1].response.data.total_count == 2"
            - "sum(Disbursement.amount_cents WHERE escrow_account_id == ${esc_id} AND purpose == EARNEST_REFUND) == 2500000"

      - name: close_balance_invariant_escrow_drain_equals_disbursements
        grounds:
          - state_machines.PurchaseAgreement.CLEARED_TO_CLOSE_to_CLOSED
