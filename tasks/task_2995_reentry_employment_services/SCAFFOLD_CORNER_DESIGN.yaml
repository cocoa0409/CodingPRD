  - name: deferred_promotion_never_skips_the_queue_head
    claim_type: waterfall_allocation
    grounds:
    - calculations.deferred_request_promotion
    - state_machines.SupportRequest_status.transitions.DEFERRED_to_APPROVED
    distinguishing_aspect: The release of 3700 covers the SECOND deferred request (2000) but not the head (8240),
      so nothing at all may be promoted — a greedy best-fit implementation promotes sr_c and breaks the queue discipline.
      MAX_PROMOTIONS_PER_EVENT is irrelevant here because the head itself does not fit.
