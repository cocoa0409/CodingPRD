            - call: "POST /exhibit-loans"
              payload: { archival_item_id: "${item_id}", exhibit_name: "Centenary Main Hall", units: 2, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: ArchivesDirector
              captures: { loan_id: $.data.id }
            - call: "POST /exhibit-loans/${loan_id}/confirm"
