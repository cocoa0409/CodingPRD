    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Qualification document UUID" }
      - { name: advertiser_id, type: string, source: system, description: "Owning advertiser" }
      - { name: created_at, type: datetime, source: system, description: "Upload timestamp" }
      - { name: doc_type, type: enum, source: input, description: "BUSINESS_LICENSE | MEDICAL_PERMIT | FINANCIAL_LICENSE | EDUCATION_PERMIT" }
      - { name: doc_url, type: string, source: input, description: "Asset URL" }
      - { name: expiry_date, type: datetime, source: input, description: "Document expiration date" }
      - { name: review_status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Reviewer-provided reason when REJECTED; null otherwise" }

