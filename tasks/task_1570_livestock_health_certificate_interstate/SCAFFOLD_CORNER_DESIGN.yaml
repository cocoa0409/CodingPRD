            - "Accredit under ACTIVE quarantine -> error_id == 'ERR_PREMISES_NOT_ACCREDITABLE' (P2 is QUARANTINE_HOLD with an ACTIVE order)"

      - name: certificate_submit_requires_active_matrix_row
