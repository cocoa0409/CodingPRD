# ---------------------------------------------------------------------------
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Resort Spa Operations & Treatment Scheduling — 9 rule_ids, 20 instances.
# Every money literal in every `assert:` was computed by executing the §1.3
# formulas against the pinned fixtures (integer cents, round_half_up).
# Canonical fixture set used by most chains:
#   TreatmentType HYDRO90 : 90 min, HYDRO, HYDROTHERAPY/ADVANCED, 30000c,
#                           high_demand true, consent 2026.1, line MARINE
#   TreatmentRoom HYDRO-1 : HYDRO, turnover 30 min, 4000c/h
#   Therapist             : SENIOR, 5200c/h, practice state HI
#   Guest                 : PLATINUM, folio_limit 500000c
#   Appointment start     : 2026-08-10T17:00:00.000Z (peak window, 16<=h<20)
#   => quoted_price_cents = 42800
# ---------------------------------------------------------------------------
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: settlement_provisional_vs_final_divergence
        grounds:
          - calculations.settlement_distribution
          - entities.SettlementRecord.fields.variant
          - entities.SettlementRecord.fields.service_charge_bp
          - entities.Appointment.fields.realized_price_cents
          - state_machines.Appointment.CONFIRMED_to_CHECKED_IN
          - state_machines.SettlementRecord.NEW_to_FINALIZED
          - state_machines.SettlementRecord.PROVISIONAL_to_SUPERSEDED
          - endpoints.POST_/appointments/{id}/settlements
        distinguishing_aspect: |
          This is the money-side dual variant: PROVISIONAL and FINAL run
          settlement_distribution over the SAME Appointment row and produce a
          different realized_price_cents (42800 vs 45300), a different
          service_charge_bp (1800 vs 1500) and a different therapist_share_cents
          (4622 vs 7077); the second dual-variant instance in this rule operates
          on a completely different entity domain (TherapistLicense continuing
          education), not on appointment money.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T17:00:00.000Z"
            - "one TreatmentType HYDRO90 (90 min, HYDRO, base 30000c, high_demand true, consent 2026.1, retail line MARINE)"
            - "one TreatmentRoom HYDRO-1 (HYDRO, turnover 30 min, 4000c/h)"
            - "one ACTIVE Therapist (SENIOR, 5200c/h, HI) with a VERIFIED HI licence and an ACTIVE ADVANCED HYDROTHERAPY certification"
            - "one PLATINUM Guest with folio_limit 500000c, an SCREENED_CLEAR intake form and a 2026.1 consent signature"
            - "one Appointment at 2026-08-10T17:00:00.000Z with quoted_price_cents 42800, CHECKED_IN then COMPLETED with actual_duration_minutes 105 and gratuity_cents 5000"
            - "two PURCHASED RetailAttachment rows of 4595c each, both resolved after check-in so the PROVISIONAL row saw retail_revenue_cents 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: SpaDirector
            - call: "POST /treatment-types"
              payload: { code: "HYDRO90", name: "Marine Hydrotherapy 90", duration_minutes: 90, room_class_required: "HYDRO", required_skill_code: "HYDROTHERAPY", required_scope_level: "ADVANCED", base_price_cents: 30000, contraindication_codes: ["ACUTE_HYPERTENSION", "SHELLFISH_ALLERGY"], retail_product_line: "MARINE", required_consent_version: "2026.1", high_demand: true }
              as: SpaDirector
              captures: { tt_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { code: "HYDRO-1", room_class: "HYDRO", capacity_guests: 1, turnover_buffer_minutes: 30, hourly_fixed_cost_cents: 4000 }
              as: SpaDirector
              captures: { room_id: $.data.id }
            - call: "POST /therapists"
              payload: { full_name: "Leilani Akana", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "HI" }
              as: SpaDirector
              captures: { th_id: $.data.id }
            - call: "POST /therapists/${th_id}/licenses"
              payload: { license_number: "HI-LMT-4410", license_type: "LMT", state_code: "HI", issued_on: "2024-01-01", expires_on: "2026-12-31", current_period_start_on: "2024-01-01", ce_hours_required: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic_id: $.data.id }
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapists/${th_id}/certifications"
              payload: { skill_code: "HYDROTHERAPY", scope_level: "ADVANCED", granted_on: "2024-01-01", expires_on: "2027-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapists/${th_id}/shift-blocks"
              payload: { block_type: "AVAILABLE", start_at: "2026-08-10T08:00:00.000Z", end_at: "2026-08-10T22:00:00.000Z" }
              as: SpaCoordinator
            - call: "POST /guests"
              payload: { full_name: "Nia Kalani", resort_room_number: "1204", loyalty_tier: "PLATINUM", folio_limit_cents: 500000 }
              as: SpaCoordinator
              captures: { guest_id: $.data.id, g_v: $.data.version }
            - call: "POST /guests/${guest_id}/intake-forms"
              payload: { expected_guest_version: "${g_v}", condition_codes: [], medications: [] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-forms/${intake_id}/consent"
              payload: { consent_version: "2026.1" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /intake-forms/${intake_id}/submit"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /intake-forms/${intake_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-3"
            - call: "POST /appointments"
              payload: { guest_id: "${guest_id}", treatment_type_id: "${tt_id}", room_id: "${room_id}", therapist_id: "${th_id}", start_at: "2026-08-10T17:00:00.000Z" }
              as: SpaCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/confirm"
              payload: {}
              as: SpaCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T17:00:00.000Z" }
              as: SpaDirector
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: SpaCoordinator
            - call: "POST /appointments/${appt_id}/retail-attachments"
              payload: { product_sku: "MARINE-SERUM-30", product_line: "MARINE", amount_cents: 4595 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { att1_id: $.data.id }
            - call: "POST /appointments/${appt_id}/retail-attachments"
              payload: { product_sku: "MARINE-BALM-50", product_line: "MARINE", amount_cents: 4595 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { att2_id: $.data.id }
            - call: "POST /retail-attachments/${att1_id}/resolve"
              payload: { outcome: "PURCHASED" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /retail-attachments/${att2_id}/resolve"
              payload: { outcome: "PURCHASED" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /appointments/${appt_id}/complete"
              payload: { actual_duration_minutes: 105, gratuity_cents: 5000 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "GET /appointments/${appt_id}"
              payload: {}
              as: SpaDirector
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /appointments/${appt_id}/settlements"
              payload: { expected_appointment_version: "${a_v}" }
              as: SpaDirector
              captures: { final_settlement_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "the PROVISIONAL SettlementRecord in GET /appointments/${appt_id}/settlements has basis_duration_minutes == 90, realized_price_cents == 42800, retail_revenue_cents == 0, service_charge_bp == 1800, service_charge_pool_cents == 7704, gratuity_cents == 0, distributable_pool_cents == 7704"
            - "that PROVISIONAL row has therapist_share_cents == 4622, support_pool_cents == 1926, house_share_cents == 1156, therapist_commission_cents == 16264, retail_commission_cents == 0, labor_cost_cents == 28686, room_fixed_cost_cents == 6000, folio_total_cents == 50504, net_margin_cents == 8114"
            - "SettlementRecord.${final_settlement_id}.variant == FINAL and status == FINALIZED with basis_duration_minutes == 105, realized_price_cents == 45300, retail_revenue_cents == 9190, service_charge_bp == 1500, service_charge_pool_cents == 6795, gratuity_cents == 5000, distributable_pool_cents == 11795"
            - "SettlementRecord.${final_settlement_id} has therapist_share_cents == 7077, support_pool_cents == 2949, house_share_cents == 1769, therapist_commission_cents == 17214, retail_commission_cents == 1102, labor_cost_cents == 34493, room_fixed_cost_cents == 7000, folio_total_cents == 66285, net_margin_cents == 12997"
            - "the PROVISIONAL row's status is SUPERSEDED after the trigger"
            - "Appointment.${appt_id}.realized_price_cents == 45300"
            - "7077 + 2949 + 1769 == 11795 (the three buckets sum exactly to distributable_pool_cents, house absorbing the residual)"
            - "GET /appointments/${appt_id}/folio-charges returns exactly 4 rows: TREATMENT 50504, RETAIL 4595, RETAIL 4595, SETTLEMENT_ADJUSTMENT 6591"
            - "Guest.${guest_id}.folio_balance_cents == 66285"

      - name: ce_calendar_window_vs_rolling_24m_divergence
        grounds:
          - calculations.ce_compliance_evaluation
          - entities.ContinuingEducationRecord.fields.completed_on
          - entities.ContinuingEducationRecord.fields.category
          - entities.TherapistLicense.fields.current_period_start_on
          - entities.TherapistLicense.fields.credited_ce_hours
          - endpoints.GET_/therapist-licenses/{id}/ce-compliance
          - validations[priority=17]
          - validations[priority=18]
        distinguishing_aspect: |
          This dual variant lives on the compliance domain (TherapistLicense +
          ContinuingEducationRecord hours), not on appointment money: the SAME
          four CE records credit 13.0 hours under CALENDAR_WINDOW (compliant
          true) and only 10.0 hours under ROLLING_24M (shortfall 2.0,
          ethics_hours_credited 0.0, compliant false), because the rolling
          window's lower bound is exclusive and derived from as_of.
          Additionally only CALENDAR_WINDOW gates POST .../review.
          logical clock parked at 2026-08-01T00:00:00.000Z so as_of defaults to 2026-08-01.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00.000Z (so the ROLLING_24M as_of default is 2026-08-01 and its exclusive lower bound is 2024-08-01)"
            - "one ACTIVE Therapist in HI"
            - "one PENDING_REVIEW TherapistLicense with current_period_start_on 2024-01-01, expires_on 2026-09-30 and ce_hours_required 12"
            - "four ContinuingEducationRecord rows on that licence: ETHICS 3.0 on 2024-03-15, CLINICAL 8.0 on 2025-06-01, CLINICAL 4.0 on 2026-02-10, SAFETY 2.0 on 2026-07-20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /therapists"
              payload: { full_name: "Kai Mahelona", employment_type: "EMPLOYEE", commission_tier: "MASTER", base_hourly_cost_cents: 6000, practice_state_code: "HI" }
              as: SpaDirector
              captures: { th_id: $.data.id }
            - call: "POST /therapists/${th_id}/licenses"
              payload: { license_number: "HI-LMT-9002", license_type: "LMT", state_code: "HI", issued_on: "2022-01-01", expires_on: "2026-09-30", current_period_start_on: "2024-01-01", ce_hours_required: 12 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic_id: $.data.id }
            - call: "POST /therapist-licenses/${lic_id}/ce-records"
              payload: { course_code: "ETH-201", category: "ETHICS", ce_hours: 3.0, completed_on: "2024-03-15" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /therapist-licenses/${lic_id}/ce-records"
              payload: { course_code: "CLI-310", category: "CLINICAL", ce_hours: 8.0, completed_on: "2025-06-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /therapist-licenses/${lic_id}/ce-records"
              payload: { course_code: "CLI-410", category: "CLINICAL", ce_hours: 4.0, completed_on: "2026-02-10" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /therapist-licenses/${lic_id}/ce-records"
              payload: { course_code: "SAF-120", category: "SAFETY", ce_hours: 2.0, completed_on: "2026-07-20" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /therapist-licenses/${lic_id}/ce-compliance"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "GET /therapist-licenses/${lic_id}/ce-compliance"
              payload: { variant: "ROLLING_24M" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "the first trigger returns variant == CALENDAR_WINDOW, window_start_on == 2024-01-01, window_end_on == 2026-09-30, credited_hours == 13.0, ethics_hours_credited == 3.0, ce_hours_required == 12, shortfall_hours == 0, ethics_requirement_met == true, compliant == true"
            - "the second trigger returns variant == ROLLING_24M, credited_hours == 10.0, ethics_hours_credited == 0.0, shortfall_hours == 2.0, ethics_requirement_met == false, compliant == false"
            - "CALENDAR_WINDOW credits 13.0 rather than 15.0 because the CLINICAL category is capped at CE_PER_CATEGORY_CAP_HOURS 8 (8.0 + 4.0 -> 8.0)"
            - "ROLLING_24M drops the ETHICS 3.0 record completed on 2024-03-15 because its lower bound 2024-08-01 is EXCLUSIVE, which is what pushes ethics_hours_credited to 0.0"
            - "the third trigger returns 200 (the review gate uses CALENDAR_WINDOW, not ROLLING_24M, so the licence verifies despite ROLLING_24M reporting compliant == false)"
            - "TherapistLicense.${lic_id}.verification_status == VERIFIED and credited_ce_hours == 13.0"

  - rule_id: combinatorial_formula
    instances:

      - name: price_quote_nested_surcharge_and_discount_caps
        mode: a
        grounds:
          - calculations.appointment_price_quote
          - calculations.appointment_price_quote.constants.SURCHARGE_CAP_BP
          - calculations.appointment_price_quote.constants.MAX_DISCOUNT_CENTS
          - calculations.appointment_price_quote.constants.PRICE_FLOOR_BP
          - entities.TreatmentType.fields.high_demand
          - entities.Guest.fields.loyalty_tier
          - entities.Appointment.fields.quoted_price_cents
          - endpoints.POST_/appointments
        distinguishing_aspect: |
          Mode (a): a single quote where THREE nested caps interact — the peak
          surcharge (1500 bp) plus the high-demand surcharge (1000 bp) sum to
          2500 bp but are clamped by SURCHARGE_CAP_BP 2000 BEFORE being applied,
          and the resulting PLATINUM discount of 7020c is then clamped by
          MAX_DISCOUNT_CENTS 4000 while the 8000 bp price floor stays slack.
          Skipping the surcharge clamp yields 44750; skipping the discount clamp
          yields 39780; only the correct clamp order yields 42800. A second
          appointment on a non-high-demand off-peak type shows the same formula
          with both surcharges absent and the discount cap NOT binding.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "TreatmentType HYDRO90 (90 min, HYDRO, base 30000c, high_demand true) and TreatmentType DRY60 (60 min, DRY, base 18000c, high_demand false, no contraindications)"
            - "TreatmentRoom HYDRO-1 (HYDRO, turnover 30) and TreatmentRoom DRY-1 (DRY, turnover 15, 2500c/h)"
            - "one ACTIVE Therapist (SENIOR, HI) with a VERIFIED HI licence and ACTIVE ADVANCED HYDROTHERAPY + BASIC SWEDISH certifications"
            - "AVAILABLE shift blocks on 2026-08-10 08:00-22:00Z and 2026-08-11 08:00-20:00Z"
            - "one PLATINUM Guest with a SCREENED_CLEAR intake form"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: SpaDirector
            - call: "POST /treatment-types"
              payload: { code: "HYDRO90", name: "Marine Hydrotherapy 90", duration_minutes: 90, room_class_required: "HYDRO", required_skill_code: "HYDROTHERAPY", required_scope_level: "ADVANCED", base_price_cents: 30000, contraindication_codes: ["ACUTE_HYPERTENSION"], retail_product_line: "MARINE", required_consent_version: "2026.1", high_demand: true }
              as: SpaDirector
              captures: { tt_hydro: $.data.id }
            - call: "POST /treatment-types"
              payload: { code: "DRY60", name: "Swedish Dry 60", duration_minutes: 60, room_class_required: "DRY", required_skill_code: "SWEDISH", required_scope_level: "BASIC", base_price_cents: 18000, contraindication_codes: [], retail_product_line: "MARINE", required_consent_version: "2026.1", high_demand: false }
              as: SpaDirector
              captures: { tt_dry: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { code: "HYDRO-1", room_class: "HYDRO", capacity_guests: 1, turnover_buffer_minutes: 30, hourly_fixed_cost_cents: 4000 }
              as: SpaDirector
              captures: { room_hydro: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { code: "DRY-1", room_class: "DRY", capacity_guests: 1, turnover_buffer_minutes: 15, hourly_fixed_cost_cents: 2500 }
              as: SpaDirector
              captures: { room_dry: $.data.id }
            - call: "POST /therapists"
              payload: { full_name: "Leilani Akana", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "HI" }
              as: SpaDirector
              captures: { th_id: $.data.id }
            - call: "POST /therapists/${th_id}/licenses"
              payload: { license_number: "HI-LMT-4410", license_type: "LMT", state_code: "HI", issued_on: "2024-01-01", expires_on: "2026-12-31", current_period_start_on: "2024-01-01", ce_hours_required: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic_id: $.data.id }
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapists/${th_id}/certifications"
              payload: { skill_code: "HYDROTHERAPY", scope_level: "ADVANCED", granted_on: "2024-01-01", expires_on: "2027-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapists/${th_id}/certifications"
              payload: { skill_code: "SWEDISH", scope_level: "BASIC", granted_on: "2024-01-01", expires_on: "2027-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapists/${th_id}/shift-blocks"
              payload: { block_type: "AVAILABLE", start_at: "2026-08-10T08:00:00.000Z", end_at: "2026-08-10T22:00:00.000Z" }
              as: SpaCoordinator
            - call: "POST /therapists/${th_id}/shift-blocks"
              payload: { block_type: "AVAILABLE", start_at: "2026-08-11T08:00:00.000Z", end_at: "2026-08-11T20:00:00.000Z" }
              as: SpaCoordinator
            - call: "POST /guests"
              payload: { full_name: "Nia Kalani", resort_room_number: "1204", loyalty_tier: "PLATINUM", folio_limit_cents: 500000 }
              as: SpaCoordinator
              captures: { guest_id: $.data.id, g_v: $.data.version }
            - call: "POST /guests/${guest_id}/intake-forms"
              payload: { expected_guest_version: "${g_v}", condition_codes: [], medications: [] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-forms/${intake_id}/consent"
              payload: { consent_version: "2026.1" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /intake-forms/${intake_id}/submit"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /intake-forms/${intake_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-3"
          trigger:
            - call: "POST /appointments"
              payload: { guest_id: "${guest_id}", treatment_type_id: "${tt_hydro}", room_id: "${room_hydro}", therapist_id: "${th_id}", start_at: "2026-08-10T17:00:00.000Z" }
              as: SpaCoordinator
              captures: { appt_peak: $.data.id }
            - call: "POST /appointments"
              payload: { guest_id: "${guest_id}", treatment_type_id: "${tt_dry}", room_id: "${room_dry}", therapist_id: "${th_id}", start_at: "2026-08-11T09:00:00.000Z" }
              as: SpaCoordinator
              captures: { appt_offpeak: $.data.id }
          assert:
            - "both triggers return 201"
            - "Appointment.${appt_peak}.quoted_price_cents == 42800"
            - "42800 is reached as: room_adjusted 39000 (30000 * 13000 bp) -> surcharge_bp min(1500 + 1000, 2000) == 2000 -> surcharge 7800 -> subtotal 46800 -> raw discount 7020 clamped to MAX_DISCOUNT_CENTS 4000 -> 42800, with the 8000 bp floor at 37440 not binding"
            - "quoted_price_cents is NOT 44750 (which is what an uncapped 2500 bp surcharge would give: subtotal 48750 - 4000) and NOT 39780 (uncapped 1500 bp discount)"
            - "Appointment.${appt_offpeak}.quoted_price_cents == 15300 (room multiplier 10000 bp leaves 18000, no peak window at 09:00Z, high_demand false, PLATINUM discount 2700 with the 4000 cap NOT binding, floor 14400 slack)"
            - "Appointment.${appt_offpeak}.high_demand_slot == false and Appointment.${appt_peak}.high_demand_slot == true"

      - name: retail_commission_per_line_rounding_then_sum
        mode: b
        grounds:
          - calculations.settlement_distribution.constants.RETAIL_COMMISSION_BP
          - calculations.settlement_distribution
          - entities.RetailAttachment.fields.amount_cents
          - entities.SettlementRecord.fields.retail_commission_cents
          - entities.SettlementRecord.fields.labor_cost_cents
          - endpoints.POST_/appointments/{id}/settlements
        distinguishing_aspect: |
          Mode (b): identical inputs, two plausible evaluation orders for the
          SAME sub-formula. Two PURCHASED retail lines of 4595c each at
          RETAIL_COMMISSION_BP 1200 give 551.4c per line; rounding each line
          half-up then summing yields 1102, while summing first (9190) and then
          rounding yields 1103. The one-cent difference propagates into
          labor_cost_cents (34493 vs 34494), so the wrong order is detectable
          twice over. Unlike mode (a) no cap or clamp participates here.
        test_recipe:
          setup:
            - "the canonical single-appointment fixture: HYDRO90 / HYDRO-1 / SENIOR therapist (5200c/h) / PLATINUM guest, appointment at 2026-08-10T17:00:00.000Z, quoted 42800"
            - "appointment CHECKED_IN, two RetailAttachment rows of 4595c each resolved PURCHASED, then COMPLETED with actual_duration_minutes 105 and gratuity_cents 5000"
          setup_api_calls:
