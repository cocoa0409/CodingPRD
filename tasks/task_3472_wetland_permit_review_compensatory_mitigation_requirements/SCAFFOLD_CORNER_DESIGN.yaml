        claim_type: scheduled_actions
        grounds: ["endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: a JD issued first thing gets that issued_date, independent of wall-clock time."
