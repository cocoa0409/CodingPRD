            - "the completion attempted before the scheduled start also returns 409 and ${error_id_complete} == ERR_INVALID_STATE, because the scheduled start instant must not be later than the logical clock"
            - "Session.${s1_id}.status == SCHEDULED and Session.${s1_id}.billing_state == UNBILLED while both rejections stand"
