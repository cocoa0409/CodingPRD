  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: test_center_room_overlap_is_half_open_so_an_abutting_session_shares_the_room
        grounds:
          - validations[priority=27]
          - errors.ERR_ROOM_WINDOW_CONFLICT
          - endpoints.POST_/exam-sessions
          - entities.ExamSession.fields.center_code
          - entities.ExamSession.fields.room_code
          - calculations.proctor_pool_concurrent_load
        distinguishing_aspect: |
          The room interval is HALF-OPEN and keyed on the (center_code, room_code) pair only:
          a session starting exactly when the incumbent ends is ACCEPTED, a session starting one
          minute before it ends is refused with 409 ERR_ROOM_WINDOW_CONFLICT, the identical
          window in a different room of the same centre is ACCEPTED, and an ONLINE_PROCTORED
          session is exempt from the room rule altogether even when it reuses the same codes —
          four outcomes that only a half-open, pair-scoped, modality-filtered comparison
          produces.
        test_recipe:
          setup:
            - "No CertificationProgram, form or candidate is needed: POST /exam-sessions depends on nothing but the acting ExamOperations role."
            - "One TEST_CENTER ExamSession S1 at center_code C1 / room_code R1 from 2026-09-01T09:00:00Z to 2026-09-01T13:00:00Z with seat_capacity 5, status OPEN, seats_reserved 0."
            - "No ONLINE_PROCTORED session exists, so proctor pool P1 has 0 committed seats."
          setup_api_calls:
            - call: "POST /exam-sessions"
              payload: {"modality": "TEST_CENTER", "starts_at": "2026-09-01T09:00:00Z", "ends_at": "2026-09-01T13:00:00Z", "seat_capacity": 5, "center_code": "C1", "room_code": "R1"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /exam-sessions"
              payload: {"modality": "TEST_CENTER", "starts_at": "2026-09-01T13:00:00Z", "ends_at": "2026-09-01T17:00:00Z", "seat_capacity": 5, "center_code": "C1", "room_code": "R1"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { s2_id: "$.data.id" }
            - call: "POST /exam-sessions"
              payload: {"modality": "TEST_CENTER", "starts_at": "2026-09-01T12:59:00Z", "ends_at": "2026-09-01T16:00:00Z", "seat_capacity": 5, "center_code": "C1", "room_code": "R1"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { err_room: "$.data.error_id" }
            - call: "POST /exam-sessions"
              payload: {"modality": "TEST_CENTER", "starts_at": "2026-09-01T09:00:00Z", "ends_at": "2026-09-01T13:00:00Z", "seat_capacity": 5, "center_code": "C1", "room_code": "R2"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { s3_id: "$.data.id" }
            - call: "POST /exam-sessions"
              payload: {"modality": "ONLINE_PROCTORED", "starts_at": "2026-09-01T09:00:00Z", "ends_at": "2026-09-01T13:00:00Z", "seat_capacity": 50, "proctor_pool_code": "P1"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { s4_id: "$.data.id" }
            - call: "POST /exam-sessions"
              payload: {"modality": "ONLINE_PROCTORED", "starts_at": "2026-09-01T12:59:00Z", "ends_at": "2026-09-01T16:00:00Z", "seat_capacity": 1, "proctor_pool_code": "P1"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { err_pool: "$.data.error_id" }
          assert:
            - "trigger[0] responds 201: ExamSession.${s2_id}.starts_at == \"2026-09-01T13:00:00Z\" and status == OPEN — adjacency (new.starts_at == existing.ends_at) is allowed on the half-open interval"
            - "trigger[1] responds 409 with ${err_room} == ERR_ROOM_WINDOW_CONFLICT (12:59 < 13:00 and 09:00 < 16:00, a one-minute intersection) and no ExamSession row is created"
            - "trigger[2] responds 201: ExamSession.${s3_id} holds the window identical to S1 because room_code R2 differs, so the (center_code, room_code) key does not collide"
            - "trigger[3] responds 201 even though its window is identical to S1's and it reuses centre-independent codes: the room rule applies only to modality == TEST_CENTER"
            - "trigger[3] leaves proctor pool P1 with committed == 50, which is accepted because POOL_MAX_CONCURRENT_SEATS 50 is compared with strict >"
            - "trigger[4] responds 409 with ${err_pool} == ERR_PROCTOR_POOL_CAPACITY_EXCEEDED (50 + 1 > 50) and no ExamSession row is created"
            - "ExamSession.${s1_id}.seats_reserved == 0 and ExamSession.${s1_id}.version is unchanged by any of the trigger calls"


      - name: candidate_seat_buffer_bars_an_abutting_second_sitting_but_admits_a_five_hour_gap
        grounds:
          - validations[priority=28]
          - errors.ERR_CANDIDATE_WINDOW_CONFLICT
          - calculations.attempt_number_assignment
          - endpoints.POST_/exam-registrations/{id}/schedule
          - state_machines.ExamRegistration.UNSCHEDULED_to_SCHEDULED
          - calculations.session_seat_occupancy
        distinguishing_aspect: |
          The candidate buffer is a per-CANDIDATE temporal rule that is independent of the room
          rule: the second seat sits in a different room, so no ERR_ROOM_WINDOW_CONFLICT is
          possible, yet a session abutting the first sitting is still refused with
          ERR_CANDIDATE_WINDOW_CONFLICT because adjacency is REJECTED once both windows are
          padded, while a session starting five hours after the first sitting ends is accepted.
          Both registrations report attempt_number 1 because neither sitting is COMPLETED or
          NO_SHOW yet, so the buffer — not the attempt counter — is what separates the outcomes.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (form_length 1, max_attempts_per_cycle 3 and retake_wait_days 45 by default) with one OPERATIONAL item and one PUBLISHED form."
            - "One APPROVED application for candidate ${cand_id} and a TEST_CENTER session S1 at C1/R1 from 2026-08-10T00:00:00Z to 2026-08-10T04:00:00Z, seat_capacity 5."
            - "One ExamRegistration ${reg_id} already SCHEDULED into S1, so ExamSession.${sess_id}.seats_reserved == 1. The logical clock is still the default 2026-08-01T00:00:00Z, before every session window."
