              as: PlantOperator
              captures: { tl2_id: $.data.id }
            - call: "POST /mfg/tank-lots/${tl2_id}/weld"
              payload: {}
              as: PlantOperator
              as_user_id: "op-weld-1"
            - call: "POST /mfg/tank-lots/${tl2_id}/apply-lining"
              payload: { glass_lining_batch_id: "${glb_id}" }
              as: PlantOperator

            - call: "POST /mfg/tank-lots"
