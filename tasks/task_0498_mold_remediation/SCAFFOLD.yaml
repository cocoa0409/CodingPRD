# =============================================================================
# Mold & Environmental Remediation — benchmark seed tables (Expert tier)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  498. Mold & Environmental Remediation: assessment & sampling (air/surface),
  scope & containment (negative air), abatement (asbestos/lead/mold) & disposal
  manifest, clearance testing & sign-off, PPE/worker certification,
  permit/notification (NESHAP), insurance billing, post-remediation verification

domain_name: mold-remediation
api_prefix: /api

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit          # regulatory gating + tamper-evident sign-off chain
  secondary_archetype: posture_driven_gating   # Project.posture derived from children gates all child ops
  complexity_layers:
    - cascading_side_effects                   # clearance fail -> reopen abatement -> void manifest -> reprice claim
    - dual_variant_calculation                 # insurance estimate vs settlement; disposal per-tier rounding
    - rate_threshold_triggers                  # spore-count clearance threshold; pressure-differential threshold
    - optimistic_concurrency                   # OCC on Project.version for clearance sign-off
    - derived_field_reconciliation             # Project.posture, open_finding_count, claim balances recomputed from children

  entity_topology: flat
  # Peer entities linked by foreign keys; Project is a hub. URLs are flat
  # collections under /api with FK fields in the body and filtered-list GETs,
  # no deep URL nesting.

  state_machine_shape: branching
  # ClearanceTest is branching (PASS/FAIL fork with divergent cascades);
  # AbatementOrder is cyclic (COMPLETED -> REOPENED -> IN_PROGRESS revision loop);
  # ContainmentZone is cyclic (ACTIVE <-> BREACHED); Project posture is compound.

  relationship_patterns:
    - one_to_many        # Project -> many Samples / Zones / Orders / Tests
    - cross_aggregate    # ClearanceTest references AbatementOrder & ContainmentZone & Worker
    - self_referential   # AbatementOrder.supersedes_order_id -> AbatementOrder.id (revision loop)

  role_model: segregation_of_duties
  # The hygienist who signs off a clearance cannot be the worker who sampled it
  # nor the lead who performed the abatement (independence rule).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: site_name, type: string, source: input, description: "Project site name" }
      - { name: hazard_class, type: enum, source: input, description: "Primary hazard. One of ASBESTOS | LEAD | MOLD" }
      - { name: structure_sqft, type: integer, source: input, description: "Affected structure area in square feet, positive integer" }
      - { name: jurisdiction_code, type: string, source: input, description: "Regulatory jurisdiction code, e.g. US-EPA" }
      - { name: posture, type: enum, source: computed, default: "ASSESSMENT", description: "Derived gate over children: ASSESSMENT | CONTAINED | ABATING | CLEARANCE_PENDING | VERIFIED | FROZEN. Recomputed on any child transition per §1.3 project_posture." }
      - { name: neshap_required, type: boolean, source: computed, description: "True iff hazard_class==ASBESTOS AND structure_sqft >= NESHAP_SQFT_THRESHOLD per §1.3 neshap_applicability" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "Lifecycle: OPEN -> SIGNED_OFF / ABANDONED. Distinct from posture; status closes the project." }
      - { name: open_finding_count, type: integer, source: computed, default: 0, description: "Count of Assessments with finding_level in {ELEVATED, HAZARDOUS} not yet CLEARED, per §1.3 open_findings" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Worker full name" }
      - { name: cert_type, type: enum, source: input, description: "Certification discipline: ASBESTOS | LEAD | MOLD | HYGIENIST" }
      - { name: cert_expires_at, type: datetime, source: input, description: "ISO8601 certification expiry; certification is valid iff cert_expires_at > clock now" }
      - { name: ppe_fit_test_at, type: datetime, source: input, description: "ISO8601 last respirator fit test; valid iff within PPE_FIT_VALID_DAYS of clock now" }
      - { name: is_cert_current, type: boolean, source: computed, description: "True iff cert_expires_at > clock now AND ppe_fit_test_at > clock now - PPE_FIT_VALID_DAYS days, per §1.3 worker_eligibility" }

  - name: Assessment
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: assessor_worker_id, type: string, source: input, description: "FK -> Worker.id; the worker who performed the assessment" }
      - { name: area_label, type: string, source: input, description: "Inspected area label" }
      - { name: finding_level, type: enum, source: computed, default: "CLEAN", description: "Derived from worst ANALYZED sample grade: CLEAN | ELEVATED | HAZARDOUS per §1.3 finding_level" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> SAMPLED -> ANALYZED -> CLEARED. CLEARED only after a SIGNED_OFF ClearanceTest covers its zone." }

  - name: Sample
    parent: Assessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: input, description: "FK -> Assessment.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; denormalized for filtering" }
      - { name: sample_type, type: enum, source: input, description: "AIR | SURFACE" }
      - { name: collected_at, type: datetime, source: input, description: "ISO8601 collection timestamp; must be <= logical clock now" }
      - { name: volume_liters, type: number, source: input, required: false, description: "Air volume sampled in liters; REQUIRED and > 0 when sample_type==AIR, forbidden for SURFACE" }
      - { name: raw_count, type: integer, source: input, required: false, description: "Lab raw structure/spore count; set on result upload, null until ANALYZED" }
      - { name: concentration, type: number, source: computed, description: "AIR: round_half_up(raw_count/volume_liters*1000) spores/m3; SURFACE: raw_count. Per §1.3 sample_concentration" }
      - { name: result_grade, type: enum, source: computed, description: "CLEAN | ELEVATED | HAZARDOUS via §1.3 sample_grade tiered thresholds" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> ANALYZED -> VOIDED. ANALYZED set on result upload." }

  - name: ContainmentZone
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: zone_label, type: string, source: input, description: "Containment zone label" }
      - { name: required_pressure_pa, type: number, source: input, description: "Required negative pressure magnitude in Pascals (positive); must be >= MIN_NEGATIVE_PRESSURE_PA" }
      - { name: latest_pressure_pa, type: number, source: computed, default: 0, description: "Reading_pa of latest PressureLog by reading_at DESC, created_at DESC tie-break; 0 before any reading. Per §1.3 containment_compliance" }
      - { name: is_compliant, type: boolean, source: computed, default: false, description: "True iff latest_pressure_pa >= required_pressure_pa per §1.3 containment_compliance" }
      - { name: status, type: enum, source: system, default: "SETUP", description: "SETUP -> ACTIVE; ACTIVE <-> BREACHED (cycle); ACTIVE -> DISMANTLED" }

  - name: PressureLog
    parent: ContainmentZone
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ContainmentZone.id" }
      - { name: reading_pa, type: number, source: input, description: "Measured negative pressure magnitude in Pascals (positive number)" }
      - { name: reading_at, type: datetime, source: input, description: "ISO8601 reading timestamp; must be <= logical clock now" }

  - name: AbatementOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: zone_id, type: string, source: input, description: "FK -> ContainmentZone.id; the zone this abatement runs in" }
      - { name: lead_worker_id, type: string, source: input, description: "FK -> Worker.id; worker leading the abatement" }
      - { name: abatement_type, type: enum, source: input, description: "ASBESTOS | LEAD | MOLD" }
      - { name: planned_weight_kg, type: number, source: input, description: "Planned hazardous material weight to remove, kg, positive" }
      - { name: removed_weight_kg, type: number, source: input, required: false, description: "Actual removed weight reported at completion, kg, positive" }
      - { name: supersedes_order_id, type: string, source: input, required: false, description: "FK -> AbatementOrder.id; set when this order is a revision created after a failed clearance" }
      - { name: revision_index, type: integer, source: computed, default: 0, description: "0 for original; predecessor.revision_index + 1 for a superseding revision. Per §1.3 revision_depth" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED -> IN_PROGRESS -> COMPLETED -> REOPENED -> IN_PROGRESS (cycle); PLANNED/IN_PROGRESS -> CANCELLED" }

  - name: DisposalManifest
    parent: AbatementOrder
    common_fields: true
    fields:
      - { name: abatement_order_id, type: string, source: input, description: "FK -> AbatementOrder.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; denormalized" }
      - { name: hauler_name, type: string, source: input, description: "Licensed waste hauler name" }
      - { name: manifest_weight_kg, type: number, source: input, description: "Declared waste weight on manifest, kg, positive" }
      - { name: disposal_fee_cents, type: integer, source: computed, description: "Tiered per-kg disposal fee plus hazard surcharge, per §1.3 disposal_fee" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> SUBMITTED -> ACCEPTED; SUBMITTED/ACCEPTED -> VOIDED (manual or on order REOPEN)" }

  - name: ClearanceTest
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: zone_id, type: string, source: input, description: "FK -> ContainmentZone.id; zone being cleared" }
      - { name: abatement_order_id, type: string, source: input, description: "FK -> AbatementOrder.id; the completed order under test" }
      - { name: sampler_worker_id, type: string, source: input, description: "FK -> Worker.id; worker who collected clearance samples" }
      - { name: signoff_worker_id, type: string, source: input, required: false, description: "FK -> Worker.id; independent hygienist who signs off; set at SIGNED_OFF" }
      - { name: clearance_air_count, type: integer, source: input, description: "Post-remediation air structure count, non-negative" }
      - { name: clearance_volume_liters, type: number, source: input, description: "Post-remediation air volume sampled, liters, positive" }
      - { name: clearance_concentration, type: number, source: computed, description: "= round_half_up(clearance_air_count/clearance_volume_liters*1000) spores/m3, per §1.3 clearance_concentration" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL via §1.3 clearance_outcome threshold against hazard-specific limit" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> ANALYZED -> {PASSED, FAILED}; PASSED -> SIGNED_OFF. FAILED is terminal for this test." }

  - name: Permit
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: permit_type, type: enum, source: input, description: "NESHAP_NOTIFICATION | DEMOLITION | TRANSPORT" }
      - { name: postmarked_at, type: datetime, source: input, description: "ISO8601 notification postmark timestamp; must be <= logical clock now" }
      - { name: work_start_at, type: datetime, source: input, description: "Planned abatement start; NESHAP requires >= NESHAP_NOTICE_DAYS days after postmarked_at" }
      - { name: notice_days, type: integer, source: computed, description: "Whole days between postmarked_at and work_start_at, floor, per §1.3 notice_lead_days" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> SUBMITTED -> ACKNOWLEDGED -> EXPIRED" }

  - name: InsuranceClaim
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: policy_number, type: string, source: input, description: "Insurer policy number" }
      - { name: deductible_cents, type: integer, source: input, description: "Policy deductible in cents, non-negative" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Policy coverage limit in cents, positive" }
      - { name: estimated_amount_cents, type: integer, source: computed, default: 0, description: "Provisional billable estimate from PLANNED/IN_PROGRESS/COMPLETED scope, per §1.3 claim_estimate" }
      - { name: settled_amount_cents, type: integer, source: computed, default: 0, description: "Final settlement from COMPLETED actuals & ACCEPTED manifests after deductible & cap, per §1.3 claim_settlement" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> SUBMITTED -> SETTLED / DENIED" }

  - name: WorkerAssignment
    parent: AbatementOrder
    common_fields: true
    fields:
      - { name: abatement_order_id, type: string, source: input, description: "FK -> AbatementOrder.id" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id" }
      - { name: shift_start_at, type: datetime, source: input, description: "ISO8601 shift start" }
      - { name: shift_end_at, type: datetime, source: input, description: "ISO8601 shift end; must be > shift_start_at" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> RELEASED. Cancelling an order releases its ACTIVE assignments." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Sample
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: ANALYZED
        trigger: "POST /api/samples/{sid}/result"
        actor: LabTech
        preconditions:
          - "Sample.status == PENDING (ERR_INVALID_STATE)"
          - "raw_count present and >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Set raw_count; compute concentration per §1.3 sample_concentration"
          - "Compute result_grade per §1.3 sample_grade"
          - "Recompute parent Assessment.finding_level per §1.3 finding_level"
          - "Recompute Project.open_finding_count per §1.3 open_findings"
          - "Recompute Project.posture per §1.3 project_posture"
      - from: PENDING
        to: VOIDED
        trigger: "POST /api/samples/{sid}/void"
        actor: ProjectManager
        preconditions:
          - "Sample.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute parent Assessment.finding_level per §1.3 finding_level"
      - from: ANALYZED
        to: VOIDED
        trigger: "POST /api/samples/{sid}/void"
        actor: ProjectManager
        preconditions:
          - "Sample.status == ANALYZED (ERR_INVALID_STATE)"
          - "Parent Assessment.status != CLEARED (ERR_ASSESSMENT_ALREADY_CLEARED) [cross-entity: Sample depends on Assessment.status]"
        side_effects:
          - "Recompute parent Assessment.finding_level per §1.3 finding_level (CASCADE hop 1)"
          - "Recompute Project.open_finding_count per §1.3 open_findings (CASCADE hop 2, caused by finding_level change)"
          - "Recompute Project.posture per §1.3 project_posture (CASCADE hop 3, caused by open_finding_count change)"

  # ---------------------------------------------------------------------------
  - entity: Assessment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SAMPLED
        trigger: "system: first Sample created under this Assessment"
        actor: system
        preconditions:
          - "Assessment.status == DRAFT"
        side_effects: []
      - from: SAMPLED
        to: ANALYZED
        trigger: "system: every child Sample is ANALYZED or VOIDED, with at least one ANALYZED"
        actor: system
        preconditions:
          - "All child Samples in {ANALYZED, VOIDED} and >= 1 ANALYZED"
        side_effects:
          - "Compute finding_level per §1.3 finding_level"
      - from: ANALYZED
        to: CLEARED
        trigger: "system: a ClearanceTest for this assessment's zone reaches SIGNED_OFF"
        actor: system
        preconditions:
          - "Assessment.status == ANALYZED"
          - "A SIGNED_OFF ClearanceTest exists whose zone_id == an AbatementOrder.zone_id covering this assessment [cross-entity: Assessment depends on ClearanceTest.status]"
        side_effects:
          - "Recompute Project.open_finding_count per §1.3 open_findings"
          - "Recompute Project.posture per §1.3 project_posture"

  # ---------------------------------------------------------------------------
  - entity: ContainmentZone
    initial_state: SETUP
    terminal_states: [DISMANTLED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /api/containment-zones/{zid}/activate"
        actor: ProjectManager
        preconditions:
          - "ContainmentZone.status == SETUP (ERR_INVALID_STATE)"
          - "is_compliant == true, i.e. a PressureLog reading >= required_pressure_pa exists (ERR_CONTAINMENT_NOT_COMPLIANT)"
        side_effects:
          - "Recompute Project.posture per §1.3 project_posture (ASSESSMENT -> CONTAINED)"
      - from: ACTIVE
        to: BREACHED
        trigger: "system: a PressureLog reading drops latest_pressure_pa below required_pressure_pa"
        actor: system
        preconditions:
          - "ContainmentZone.status == ACTIVE"
        side_effects:
          - "Set is_compliant=false (CASCADE hop 1)"
          - "Recompute Project.posture per §1.3 project_posture -> FROZEN (CASCADE hop 2, caused by breach; FROZEN outranks ABATING)"
      - from: BREACHED
        to: ACTIVE
        trigger: "system: a later PressureLog reading restores latest_pressure_pa >= required_pressure_pa"
        actor: system
        preconditions:
          - "ContainmentZone.status == BREACHED"
        side_effects:
          - "Set is_compliant=true"
          - "Recompute Project.posture per §1.3 project_posture (FROZEN clears back to ABATING/CONTAINED)"
      - from: ACTIVE
        to: DISMANTLED
        trigger: "POST /api/containment-zones/{zid}/dismantle"
        actor: ProjectManager
        preconditions:
          - "ContainmentZone.status == ACTIVE (ERR_INVALID_STATE)"
          - "No AbatementOrder in this zone in {PLANNED, IN_PROGRESS, REOPENED} (ERR_ABATEMENT_IN_PROGRESS)"
          - "A SIGNED_OFF ClearanceTest exists for this zone (ERR_NO_PASSING_CLEARANCE) [cross-entity: Zone depends on ClearanceTest.status]"
        side_effects:
          - "Recompute Project.posture per §1.3 project_posture"

  # ---------------------------------------------------------------------------
  - entity: AbatementOrder
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /api/abatement-orders/{aid}/start"
        actor: AbatementSupervisor
        preconditions:
          - "AbatementOrder.status == PLANNED (ERR_INVALID_STATE)"
          - "Referenced ContainmentZone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE) [cross-entity: AbatementOrder depends on ContainmentZone.status]"
          - "lead_worker.is_cert_current == true AND lead_worker.cert_type == abatement_type (ERR_WORKER_NOT_CERTIFIED) [cross-entity: AbatementOrder depends on Worker]"
          - "If Project.neshap_required: an ACKNOWLEDGED NESHAP_NOTIFICATION Permit exists with notice_days >= NESHAP_NOTICE_DAYS and work_start_at <= clock now (ERR_NESHAP_NOTICE_NOT_MET)"
          - "At least one ACTIVE WorkerAssignment on this order whose worker.is_cert_current (ERR_NO_CERTIFIED_CREW)"
        side_effects:
          - "Recompute Project.posture per §1.3 project_posture (CONTAINED -> ABATING)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/abatement-orders/{aid}/complete"
        actor: AbatementSupervisor
        preconditions:
          - "AbatementOrder.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "removed_weight_kg present and > 0 (ERR_INVALID_REQUEST)"
          - "Referenced ContainmentZone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
          - "An ACCEPTED DisposalManifest exists for this order with manifest_weight_kg >= removed_weight_kg (ERR_MANIFEST_WEIGHT_SHORT)"
        side_effects:
          - "Recompute InsuranceClaim.estimated_amount_cents per §1.3 claim_estimate (CASCADE)"
          - "Recompute InsuranceClaim.settled_amount_cents per §1.3 claim_settlement (CASCADE)"
          - "Recompute Project.posture per §1.3 project_posture (ABATING -> CLEARANCE_PENDING when every non-cancelled order COMPLETED)"
      - from: COMPLETED
        to: REOPENED
        trigger: "system: a ClearanceTest for this order transitions to FAILED"
        actor: system
        preconditions:
          - "AbatementOrder.status == COMPLETED"
        side_effects:
          - "VOID this order's ACCEPTED/SUBMITTED DisposalManifest(s) -> VOIDED (CASCADE hop 1)"
          - "Recompute InsuranceClaim.settled_amount_cents (manifest removed from actuals) (CASCADE hop 2, caused by manifest void)"
          - "Recompute Project.posture per §1.3 project_posture -> ABATING (CASCADE hop 3, caused by order leaving COMPLETED)"
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /api/abatement-orders/{aid}/start"
        actor: AbatementSupervisor
        preconditions:
          - "AbatementOrder.status == REOPENED (ERR_INVALID_STATE)"
          - "Referenced ContainmentZone.status == ACTIVE (ERR_ZONE_NOT_ACTIVE)"
          - "lead_worker.is_cert_current == true AND lead_worker.cert_type == abatement_type (ERR_WORKER_NOT_CERTIFIED)"
          - "At least one ACTIVE WorkerAssignment on this order whose worker.is_cert_current (ERR_NO_CERTIFIED_CREW)"
        side_effects:
          - "Recompute Project.posture per §1.3 project_posture (-> ABATING)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/abatement-orders/{aid}/cancel"
        actor: ProjectManager
        preconditions:
          - "AbatementOrder.status == PLANNED (ERR_INVALID_STATE)"
        side_effects:
          - "Release all ACTIVE WorkerAssignment on this order -> RELEASED (CASCADE)"
          - "Recompute Project.posture per §1.3 project_posture"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/abatement-orders/{aid}/cancel"
        actor: ProjectManager
        preconditions:
          - "AbatementOrder.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "No ClearanceTest in {ANALYZED, PASSED, SIGNED_OFF} references this order (ERR_CLEARANCE_IN_PROGRESS) [cross-entity: AbatementOrder depends on ClearanceTest.status]"
        side_effects:
          - "Release all ACTIVE WorkerAssignment on this order -> RELEASED (CASCADE hop 1)"
          - "Recompute InsuranceClaim.estimated_amount_cents (this order leaves provisional scope) (CASCADE hop 2, caused by cancel)"
          - "Recompute Project.posture per §1.3 project_posture (CASCADE hop 3, caused by order set change)"

  # ---------------------------------------------------------------------------
  - entity: DisposalManifest
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/disposal-manifests/{mid}/submit"
        actor: AbatementSupervisor
        preconditions:
          - "DisposalManifest.status == DRAFT (ERR_INVALID_STATE)"
          - "Referenced AbatementOrder.status in {IN_PROGRESS, COMPLETED} (ERR_INVALID_STATE) [cross-entity: DisposalManifest depends on AbatementOrder.status]"
          - "If parent order.abatement_type == ASBESTOS: an ACKNOWLEDGED TRANSPORT Permit exists (ERR_TRANSPORT_PERMIT_MISSING)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/disposal-manifests/{mid}/accept"
        actor: ProjectManager
        preconditions:
          - "DisposalManifest.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute disposal_fee_cents per §1.3 disposal_fee (finalized)"
          - "Recompute InsuranceClaim.estimated_amount_cents and settled_amount_cents per §1.3 (CASCADE)"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /api/disposal-manifests/{mid}/void"
        actor: ProjectManager
        preconditions:
          - "DisposalManifest.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute InsuranceClaim.estimated_amount_cents (CASCADE)"
      - from: ACCEPTED
        to: VOIDED
        trigger: "system: parent AbatementOrder transitions COMPLETED -> REOPENED"
        actor: system
        preconditions:
          - "DisposalManifest.status == ACCEPTED"
        side_effects:
          - "Recompute InsuranceClaim.settled_amount_cents (manifest leaves actuals) (CASCADE)"

  # ---------------------------------------------------------------------------
  - entity: ClearanceTest
    initial_state: DRAFT
    terminal_states: [FAILED, SIGNED_OFF]
    transitions:
      - from: DRAFT
        to: ANALYZED
        trigger: "POST /api/clearance-tests/{cid}/analyze"
        actor: LabTech
        preconditions:
          - "ClearanceTest.status == DRAFT (ERR_INVALID_STATE)"
          - "Referenced AbatementOrder.status == COMPLETED (ERR_ORDER_NOT_COMPLETED) [cross-entity: ClearanceTest depends on AbatementOrder.status]"
        side_effects:
          - "Compute clearance_concentration per §1.3 clearance_concentration"
          - "Compute outcome per §1.3 clearance_outcome"
          - "Auto-fork to PASSED or FAILED (see next two transitions)"
      - from: ANALYZED
        to: PASSED
        trigger: "system: outcome == PASS computed on analyze"
        actor: system
        preconditions:
          - "outcome == PASS (clearance_concentration < hazard limit)"
        side_effects: []
      - from: ANALYZED
        to: FAILED
        trigger: "system: outcome == FAIL computed on analyze"
        actor: system
        preconditions:
          - "outcome == FAIL (clearance_concentration >= hazard limit)"
        side_effects:
          - "Referenced AbatementOrder COMPLETED -> REOPENED (CASCADE hop 1, branch=FAIL)"
          - "That order's ACCEPTED DisposalManifest(s) -> VOIDED (CASCADE hop 2, caused by reopen)"
          - "Recompute InsuranceClaim.settled_amount_cents (CASCADE hop 3, caused by manifest void)"
          - "Recompute Project.posture per §1.3 project_posture -> ABATING (CASCADE hop 4)"
      - from: PASSED
        to: SIGNED_OFF
        trigger: "POST /api/clearance-tests/{cid}/signoff"
        actor: Hygienist
        preconditions:
          - "ClearanceTest.status == PASSED (ERR_INVALID_STATE)"
          - "expected_project_version matches Project.version (ERR_STALE_VERSION) [OCC, checked before business rules]"
          - "signoff_worker.cert_type == HYGIENIST AND is_cert_current (ERR_WORKER_NOT_CERTIFIED) [cross-entity]"
          - "signoff_worker_id != sampler_worker_id AND signoff_worker_id != referenced AbatementOrder.lead_worker_id (ERR_SIGNOFF_NOT_INDEPENDENT) [segregation of duties]"
        side_effects:
          - "Set signoff_worker_id (branch=PASS)"
          - "Covered Assessments ANALYZED -> CLEARED (CASCADE hop 1)"
          - "Recompute Project.open_finding_count per §1.3 open_findings (CASCADE hop 2, caused by assessments clearing)"
          - "Recompute Project.posture per §1.3 project_posture -> VERIFIED when all zones cleared (CASCADE hop 3)"
          - "increments Project.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/permits/{pmid}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Permit.status == DRAFT (ERR_INVALID_STATE)"
          - "For NESHAP_NOTIFICATION: notice_days >= NESHAP_NOTICE_DAYS (ERR_NESHAP_NOTICE_NOT_MET)"
        side_effects: []
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /api/permits/{pmid}/acknowledge"
        actor: ComplianceOfficer
        preconditions:
          - "Permit.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: EXPIRED
        trigger: "POST /api/permits/{pmid}/expire"
        actor: ComplianceOfficer
        preconditions:
          - "Permit.status == ACKNOWLEDGED (ERR_INVALID_STATE)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: InsuranceClaim
    initial_state: OPEN
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /api/insurance-claims/{clid}/submit"
        actor: ProjectManager
        preconditions:
          - "InsuranceClaim.status == OPEN (ERR_INVALID_STATE)"
          - "Project.posture in {CLEARANCE_PENDING, VERIFIED} (ERR_PROJECT_NOT_READY_FOR_BILLING) [cross-entity: InsuranceClaim depends on Project.posture]"
        side_effects:
          - "Recompute estimated_amount_cents per §1.3 claim_estimate"
      - from: SUBMITTED
        to: SETTLED
        trigger: "POST /api/insurance-claims/{clid}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "InsuranceClaim.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Project.posture == VERIFIED (ERR_PROJECT_NOT_VERIFIED) [cross-entity: InsuranceClaim depends on Project.posture]"
          - "If gross > coverage_limit_cents then allow_over_cap must be true (ERR_COVERAGE_LIMIT_EXCEEDED)"
        side_effects:
          - "Recompute settled_amount_cents per §1.3 claim_settlement"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/insurance-claims/{clid}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "InsuranceClaim.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: WorkerAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system: parent AbatementOrder transitions to CANCELLED (via cancel or abandon cascade)"
        actor: system
        preconditions:
          - "WorkerAssignment.status == ACTIVE"
        side_effects: []
        note: "RELEASED is reached only as a cascade target of AbatementOrder cancel/abandon; there is no direct release endpoint."

  # ---------------------------------------------------------------------------
  - entity: Project
    initial_state: OPEN
    terminal_states: [SIGNED_OFF, ABANDONED]
    transitions:
      - from: OPEN
        to: SIGNED_OFF
        trigger: "POST /api/projects/{pid}/signoff"
        actor: Hygienist
        preconditions:
          - "Project.status == OPEN (ERR_INVALID_STATE)"
          - "Project.posture == VERIFIED (ERR_PROJECT_NOT_VERIFIED)"
          - "open_finding_count == 0 (ERR_OPEN_FINDINGS_REMAIN)"
        side_effects:
          - "Project.status = SIGNED_OFF (terminal)"
      - from: OPEN
        to: ABANDONED
        trigger: "POST /api/projects/{pid}/abandon"
        actor: ProjectManager
        preconditions:
          - "Project.status == OPEN (ERR_INVALID_STATE)"
          - "No AbatementOrder in {IN_PROGRESS, REOPENED} (ERR_ABATEMENT_IN_PROGRESS)"
        side_effects:
          - "All PLANNED AbatementOrders -> CANCELLED (CASCADE hop 1)"
          - "Each cancelled order releases its ACTIVE WorkerAssignments -> RELEASED (CASCADE hop 2, caused by cancel)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: clearance-signoff-stale-project
    parent_entity: Project
    write_endpoint: "POST /api/clearance-tests/{cid}/signoff"
    occ_field: "expected_project_version"
    description: |
      Signing off a clearance test against a Project whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another sign-off (which bumped Project.version and cleared
      assessments) or a clearance-FAIL cascade that reopened an order has
      already mutated the project, so the current signer's view of the project —
      and the set of assessments this sign-off would clear — is stale. The loser
      carries an expected_project_version that no longer matches the live
      Project.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sample_concentration
    trigger: "Sample PENDING -> ANALYZED (POST /api/samples/{sid}/result)"
    algorithm: aggregation
    formula: |
      if sample_type == AIR:
        concentration = round_half_up( raw_count / volume_liters * 1000 , 0 )   # spores per cubic meter
      else:  # SURFACE
        concentration = raw_count
    input_set: "single sample's raw_count and volume_liters"
    constants:
      LITERS_PER_M3: 1000
    precision: "0 decimal places, round_half_up (AIR); SURFACE is integer count"

  - name: sample_grade
    trigger: "Sample PENDING -> ANALYZED, immediately after sample_concentration"
    algorithm: tiered_pricing
    formula: |
      Tiered thresholds keyed on sample_type:
        AIR (units spores/m3):
          concentration <  AIR_ELEVATED              -> CLEAN
          AIR_ELEVATED <= concentration < AIR_HAZARD -> ELEVATED
          concentration >= AIR_HAZARD                -> HAZARDOUS
        SURFACE (units raw count):
          concentration <  SURFACE_ELEVATED                  -> CLEAN
          SURFACE_ELEVATED <= concentration < SURFACE_HAZARD -> ELEVATED
          concentration >= SURFACE_HAZARD                    -> HAZARDOUS
      Boundaries are inclusive on the lower bound (>=).
    input_set: "single sample concentration + sample_type"
    constants:
      AIR_ELEVATED: 1000        # spores/m3
      AIR_HAZARD: 10000         # spores/m3
      SURFACE_ELEVATED: 50      # raw count
      SURFACE_HAZARD: 500       # raw count
    precision: "exact integer comparisons; lower bound inclusive (>=)"

  - name: finding_level
    trigger: "any child Sample ANALYZED/VOIDED; Assessment SAMPLED -> ANALYZED; sample void cascade"
    algorithm: aggregation
    formula: |
      Among child Samples WHERE status == ANALYZED (VOIDED and PENDING excluded),
      take the worst result_grade by severity order CLEAN(0) < ELEVATED(1) < HAZARDOUS(2):
        if no ANALYZED samples -> finding_level = CLEAN
        else finding_level = grade with max severity ordinal over ANALYZED samples
      Tie-break is irrelevant (max by fixed severity ordinal, not row identity).
    input_set: "child Samples WHERE status == ANALYZED"
    precision: "categorical (severity ordinal max)"

  - name: open_findings
    trigger: "Assessment finding_level change; Assessment -> CLEARED; sample void; clearance signoff"
    algorithm: aggregation
    formula: |
      open_finding_count = count of Assessments under this project WHERE
        finding_level IN {ELEVATED, HAZARDOUS} AND status != CLEARED
    input_set: "Assessments under project WHERE status != CLEARED"
    precision: "integer count"

  - name: containment_compliance
    trigger: "PressureLog created (POST /api/containment-zones/{zid}/pressure-logs); ContainmentZone read"
    algorithm: threshold
    formula: |
      latest_pressure_pa = reading_pa of the PressureLog for this zone with the
        greatest reading_at; tie-break greatest created_at; if none, 0.
      is_compliant = (latest_pressure_pa >= required_pressure_pa)     # >= inclusive
      Status transition on a new reading:
        if zone.status == ACTIVE   and not is_compliant -> zone BREACHED
        if zone.status == BREACHED and is_compliant     -> zone ACTIVE
    input_set: "PressureLog rows WHERE zone_id == zone.id"
    constants:
      MIN_NEGATIVE_PRESSURE_PA: 5      # absolute floor any zone may require
    precision: "numeric compare; >= inclusive"

  - name: neshap_applicability
    trigger: "Project create; structure_sqft/hazard_class read"
    algorithm: threshold
    formula: |
      neshap_required = (hazard_class == ASBESTOS) AND (structure_sqft >= NESHAP_SQFT_THRESHOLD)
    input_set: "single project fields"
    constants:
      NESHAP_SQFT_THRESHOLD: 160       # sqft; >= triggers NESHAP
    precision: "boolean; >= inclusive"

  - name: notice_lead_days
    trigger: "Permit create; Permit submit"
    algorithm: interval_merge
    formula: |
      delta_seconds = epoch(work_start_at) - epoch(postmarked_at)
      if delta_seconds <= 0: notice_days = 0
      else: notice_days = floor(delta_seconds / SECONDS_PER_DAY)   # whole 24h periods, floor
    input_set: "single permit's postmarked_at, work_start_at"
    constants:
      SECONDS_PER_DAY: 86400
      NESHAP_NOTICE_DAYS: 10           # minimum lead for NESHAP_NOTIFICATION
    precision: "floor to whole days"

  - name: revision_depth
    trigger: "AbatementOrder create (when supersedes_order_id present)"
    algorithm: aggregation
    formula: |
      if supersedes_order_id is null: revision_index = 0
      else: revision_index = predecessor.revision_index + 1
    input_set: "this order + the predecessor referenced by supersedes_order_id"
    precision: "integer"

  - name: disposal_fee
    trigger: "DisposalManifest create (DRAFT, provisional); finalized on DisposalManifest accept"
    algorithm: tiered_pricing
    formula: |
      w = manifest_weight_kg (kg, may be fractional)
      Marginal per-kg tier rates (cents/kg):
        portion in [0, TIER1_KG]        @ RATE1_CPK
        portion in (TIER1_KG, TIER2_KG] @ RATE2_CPK
        portion above TIER2_KG          @ RATE3_CPK
      Per tier: tier_cost_cents = floor(tier_kg * rate_cpk)   # FLOOR EACH TIER FIRST
      base_fee_cents = sum of the (already-floored) tier_cost_cents
      surcharge multiplier on the parent order's abatement_type:
        ASBESTOS -> ASBESTOS_SURCHARGE ; LEAD -> LEAD_SURCHARGE ; MOLD -> 1.0
      disposal_fee_cents = floor( base_fee_cents * surcharge_multiplier )
      ROUNDING ORDER (PINNED): floor EACH tier's marginal cost to whole cents
      BEFORE summing tiers, THEN apply surcharge, THEN floor once more.
      The per-tier-then-sum order is authoritative; sum-then-round is wrong.
    input_set: "single manifest manifest_weight_kg + parent AbatementOrder.abatement_type"
    constants:
      TIER1_KG: 100
      TIER2_KG: 500
      RATE1_CPK: 80      # cents/kg for first 100 kg
      RATE2_CPK: 120     # cents/kg for 100..500 kg
      RATE3_CPK: 200     # cents/kg above 500 kg
      ASBESTOS_SURCHARGE: 1.5
      LEAD_SURCHARGE: 1.25
    precision: "floor per tier to whole cents, then floor after surcharge"

  - name: clearance_concentration
    trigger: "ClearanceTest DRAFT -> ANALYZED"
    algorithm: aggregation
    formula: |
      clearance_concentration = round_half_up( clearance_air_count / clearance_volume_liters * 1000 , 0 )
    input_set: "single clearance test"
    constants:
      LITERS_PER_M3: 1000
    precision: "0 decimal places, round_half_up"

  - name: clearance_outcome
    trigger: "ClearanceTest DRAFT -> ANALYZED, after clearance_concentration"
    algorithm: threshold
    formula: |
      limit = hazard-specific clearance limit (spores/m3) keyed on Project.hazard_class:
        ASBESTOS -> ASBESTOS_LIMIT
        LEAD     -> LEAD_LIMIT
        MOLD     -> MOLD_LIMIT
      outcome = PASS  if clearance_concentration <  limit
                FAIL  if clearance_concentration >= limit
      NOTE: strict-less-than PASSES; equality FAILS (>= is a fail).
    input_set: "clearance_concentration + Project.hazard_class"
    constants:
      ASBESTOS_LIMIT: 70       # spores/m3 — strict
      LEAD_LIMIT: 200
      MOLD_LIMIT: 900
    precision: "integer compare; boundary equality FAILS"

  - name: project_posture
    trigger: "any child transition listed with 'Recompute Project.posture'"
    algorithm: projection
    formula: |
      Evaluate in this fixed precedence (FIRST MATCH WINS):
        1. FROZEN  if any ContainmentZone.status == BREACHED
        2. VERIFIED if there is >= 1 AbatementOrder AND every AbatementOrder is in
                    {COMPLETED, CANCELLED} AND every non-cancelled order has a
                    SIGNED_OFF ClearanceTest AND open_finding_count == 0
        3. CLEARANCE_PENDING if >= 1 non-cancelled AbatementOrder AND every
                    non-cancelled AbatementOrder.status == COMPLETED (some still
                    awaiting sign-off)
        4. ABATING if any AbatementOrder.status IN {IN_PROGRESS, REOPENED}
        5. CONTAINED if any ContainmentZone.status == ACTIVE
        6. ASSESSMENT otherwise (default initial)
      Precedence is authoritative: FROZEN outranks every other posture.
    input_set: "all ContainmentZones, AbatementOrders, ClearanceTests, open_finding_count under project"
    precision: "categorical; first-match precedence pinned"

  - name: claim_estimate
    trigger: "AbatementOrder start/complete/cancel; DisposalManifest submit/accept/void; InsuranceClaim submit"
    algorithm: forward_looking
    formula: |
      FORWARD-LOOKING provisional estimate over PLANNED scope (includes
      not-yet-finalized work):
        scope_orders = AbatementOrders WHERE status IN {PLANNED, IN_PROGRESS, COMPLETED}
                       (CANCELLED and REOPENED excluded)
        labor_cents  = sum over scope_orders of round_half_up(planned_weight_kg * LABOR_CPK)
        disposal_cents = sum of disposal_fee_cents over DisposalManifests in
                         {DRAFT, SUBMITTED, ACCEPTED} whose order is in scope_orders
        estimated_amount_cents = labor_cents + disposal_cents
      Uses planned_weight_kg (estimate) and includes DRAFT/SUBMITTED manifests
      (projected). No deductible, no cap. This is the FORWARD-LOOKING variant.
      ROUNDING ORDER (PINNED): disposal_cents is the sum of EACH manifest's
      already-tiered-and-rounded disposal_fee_cents (fee-per-manifest THEN sum).
      Two 60 kg manifests fee'd separately (each entirely in disposal tier 1) do
      NOT equal one 120 kg manifest (20 kg of which crosses into tier 2); the
      per-manifest-then-sum order is authoritative.
    input_set: "scope AbatementOrders + their non-voided DisposalManifests"
    constants:
      LABOR_CPK: 1500          # cents per planned kg (labor)
    precision: "round_half_up per order, sum exact integer cents"

  - name: claim_settlement
    trigger: "AbatementOrder complete; DisposalManifest accept/void; ClearanceTest FAIL cascade; InsuranceClaim settle"
    algorithm: chronological
    formula: |
      FINAL settlement over ACTUALS only (chronological, finalized work):
        actual_orders = AbatementOrders WHERE status == COMPLETED
        labor_cents   = sum over actual_orders of round_half_up(removed_weight_kg * LABOR_CPK)
        disposal_cents = sum of disposal_fee_cents over DisposalManifests in
                         status == ACCEPTED whose order is in actual_orders
        gross = labor_cents + disposal_cents
        after_deductible = max(0, gross - deductible_cents)
        settled_amount_cents = min(after_deductible, coverage_limit_cents)
      Uses removed_weight_kg (actuals), ACCEPTED manifests only, applies
      deductible THEN cap. This is the FINAL variant; differs from claim_estimate
      in input set (actuals vs planned), manifest filter (ACCEPTED-only vs broader),
      AND in applying deductible + coverage cap. ORDER PINNED: subtract deductible
      before applying the cap.
    input_set: "COMPLETED AbatementOrders + ACCEPTED DisposalManifests; policy deductible & cap"
    constants:
      LABOR_CPK: 1500
    precision: "round_half_up per order, then deductible, then cap (order pinned)"

  - name: worker_eligibility
    trigger: "Worker read; precondition checks on abatement start, clearance signoff, assignment create"
    algorithm: threshold
    formula: |
      cert_ok = cert_expires_at > clock_now                       # strict greater
      fit_ok  = ppe_fit_test_at > (clock_now - PPE_FIT_VALID_DAYS days)
      is_cert_current = cert_ok AND fit_ok
    input_set: "single worker vs logical clock"
    constants:
      PPE_FIT_VALID_DAYS: 365
    precision: "datetime compare; cert strict >, fit window is (now - 365d, +inf)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failing wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is a recognized role"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path resource IDs exist, validated left-to-right"
    error_id: "ERR_PROJECT_NOT_FOUND / ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: existence
    check: "FK body references (worker_id, zone_id, abatement_order_id, assessment_id, project_id) resolve to existing rows"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints with FK body fields"

  - priority: 6
    category: business_referential
    check: "Body FK belongs to the project named in the body (e.g., zone_id.project_id == project_id; abatement_order_id.project_id == project_id)"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 409
    applies_to: "create endpoints referencing project-scoped children"

  - priority: 7
    category: business_constraint
    check: "Body well-formed: required fields present, enums valid, numeric ranges (sqft>0, weights>0, AIR volume_liters>0 present, SURFACE volume_liters absent, shift_end>shift_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/mutation endpoints

  - priority: 8
    category: business_temporal
    check: "Timestamps not after logical clock now (collected_at, reading_at, postmarked_at)"
    error_id: ERR_TIMESTAMP_IN_FUTURE
    http_status: 409
    applies_to: "sample create, pressure-log create, permit create"

  - priority: 9
    category: state
    check: "OCC: expected_project_version (when required) matches Project.version BEFORE any business check"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/clearance-tests/{id}/signoff"

  - priority: 10
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: state
    check: "Parent Assessment not already CLEARED when voiding an ANALYZED sample under it"
    error_id: ERR_ASSESSMENT_ALREADY_CLEARED
    http_status: 409
    applies_to: "POST /api/samples/{id}/void (ANALYZED sample)"

  - priority: 12
    category: business_safety
    check: "ContainmentZone compliant (latest_pressure_pa >= required_pressure_pa) before activation"
    error_id: ERR_CONTAINMENT_NOT_COMPLIANT
    http_status: 422
    applies_to: "zone activate"

  - priority: 13
    category: business_safety
    check: "Referenced ContainmentZone.status == ACTIVE for abatement start/complete"
    error_id: ERR_ZONE_NOT_ACTIVE
    http_status: 409
    applies_to: "abatement start; abatement complete"

  - priority: 14
    category: business_safety
    check: "Lead worker certification current AND cert_type matches abatement_type (abatement start/reopen-start); sign-off worker is HYGIENIST & current"
    error_id: ERR_WORKER_NOT_CERTIFIED
    http_status: 422
    applies_to: "abatement start; clearance signoff; worker assignment create"

  - priority: 15
    category: business_safety
    check: "Sign-off worker independent: not sampler_worker_id and not order.lead_worker_id (segregation of duties)"
    error_id: ERR_SIGNOFF_NOT_INDEPENDENT
    http_status: 422
    applies_to: "POST /api/clearance-tests/{id}/signoff"

  - priority: 16
    category: business_safety
    check: "NESHAP notice satisfied: ACKNOWLEDGED NESHAP_NOTIFICATION permit with notice_days >= NESHAP_NOTICE_DAYS and work_start_at <= clock now, when Project.neshap_required"
    error_id: ERR_NESHAP_NOTICE_NOT_MET
    http_status: 422
    applies_to: "abatement start (when neshap_required); permit submit (NESHAP)"

  - priority: 17
    category: business_safety
    check: "ACKNOWLEDGED TRANSPORT permit before submitting an asbestos disposal manifest"
    error_id: ERR_TRANSPORT_PERMIT_MISSING
    http_status: 422
    applies_to: "disposal-manifest submit (asbestos order)"

  - priority: 18
    category: business_constraint
    check: "At least one ACTIVE WorkerAssignment with a current cert on the order before start"
    error_id: ERR_NO_CERTIFIED_CREW
    http_status: 422
    applies_to: "abatement start"

  - priority: 19
    category: business_referential
    check: "An ACCEPTED DisposalManifest with manifest_weight_kg >= removed_weight_kg exists before abatement complete"
    error_id: ERR_MANIFEST_WEIGHT_SHORT
    http_status: 409
    applies_to: "abatement complete"

  - priority: 20
    category: business_constraint
    check: "Referenced AbatementOrder.status == COMPLETED before clearance analyze"
    error_id: ERR_ORDER_NOT_COMPLETED
    http_status: 409
    applies_to: "clearance-test analyze"

  - priority: 21
    category: business_constraint
    check: "No ClearanceTest in {ANALYZED, PASSED, SIGNED_OFF} references an order being cancelled from IN_PROGRESS"
    error_id: ERR_CLEARANCE_IN_PROGRESS
    http_status: 409
    applies_to: "abatement cancel (from IN_PROGRESS)"

  - priority: 22
    category: business_constraint
    check: "No abatement order in {PLANNED, IN_PROGRESS, REOPENED} in zone; a SIGNED_OFF clearance exists, before dismantle"
    error_id: "ERR_ABATEMENT_IN_PROGRESS / ERR_NO_PASSING_CLEARANCE"
    http_status: 409
    applies_to: "zone dismantle"

  - priority: 23
    category: business_constraint
    check: "Project.posture in {CLEARANCE_PENDING, VERIFIED} before insurance submit; == VERIFIED before settle/project-signoff"
    error_id: "ERR_PROJECT_NOT_READY_FOR_BILLING / ERR_PROJECT_NOT_VERIFIED"
    http_status: 409
    applies_to: "insurance submit/settle; project signoff"

  - priority: 24
    category: business_constraint
    check: "open_finding_count == 0 before project signoff"
    error_id: ERR_OPEN_FINDINGS_REMAIN
    http_status: 409
    applies_to: "project signoff"

  - priority: 25
    category: business_fiscal
    check: "If gross settlement exceeds coverage_limit_cents, allow_over_cap must be true (else reject so over-cap is not silently capped)"
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "insurance claim settle"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to real wall-clock time."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced; subsequent worker_eligibility / temporal checks use it"]

  # ---- Workers ----
  - method: POST
    path: "/api/workers"
    description: "Register a worker with certification & PPE fit data"
    roles: [ProjectManager, ComplianceOfficer]
    code: 201
    input: [full_name, cert_type, cert_expires_at, ppe_fit_test_at]
    output: Worker
    side_effects: ["is_cert_current computed per §1.3 worker_eligibility"]
  - method: GET
    path: "/api/workers"
    description: "List workers (paginated; optional cert_type filter)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["cert_type?", "limit?", "offset?"]
    output: Worker[]
    side_effects: []
  - method: GET
    path: "/api/workers/{wid}"
    description: "Get a worker with computed is_cert_current"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: Worker
    side_effects: []

  # ---- Projects ----
  - method: POST
    path: "/api/projects"
    description: "Create remediation project"
    roles: [ProjectManager]
    code: 201
    input: [site_name, hazard_class, structure_sqft, jurisdiction_code]
    output: Project
    side_effects: ["posture=ASSESSMENT; neshap_required computed per §1.3 neshap_applicability; status=OPEN; open_finding_count=0"]
  - method: GET
    path: "/api/projects"
    description: "List projects (paginated; optional hazard_class, posture filters)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["hazard_class?", "posture?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/api/projects/{pid}"
    description: "Get project with computed posture, neshap_required, open_finding_count"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/api/projects/{pid}/signoff"
    description: "Final project sign-off (Hygienist) — closes project"
    roles: [Hygienist]
    code: 200
    input: []
    output: Project
    side_effects: ["status=SIGNED_OFF when posture==VERIFIED and open_finding_count==0"]
  - method: POST
    path: "/api/projects/{pid}/abandon"
    description: "Abandon project; cancels PLANNED orders and releases their crews"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["PLANNED orders -> CANCELLED; their ACTIVE assignments -> RELEASED (cascade)"]

  # ---- Assessments ----
  - method: POST
    path: "/api/assessments"
    description: "Create assessment under a project"
    roles: [ProjectManager, LabTech]
    code: 201
    input: [project_id, assessor_worker_id, area_label]
    output: Assessment
    side_effects: ["status=DRAFT; finding_level=CLEAN"]
  - method: GET
    path: "/api/assessments"
    description: "List assessments; filter by project_id, assessor_worker_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["project_id?", "assessor_worker_id?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/api/assessments/{aid}"
    description: "Get an assessment with computed finding_level"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  # ---- Samples ----
  - method: POST
    path: "/api/samples"
    description: "Collect a sample under an assessment (AIR requires volume_liters>0; SURFACE forbids it)"
    roles: [LabTech]
    code: 201
    input: [assessment_id, project_id, sample_type, collected_at, "volume_liters?"]
    output: Sample
    side_effects: ["status=PENDING; parent Assessment DRAFT -> SAMPLED if first sample"]
  - method: GET
    path: "/api/samples"
    description: "List samples; filter by assessment_id, project_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["assessment_id?", "project_id?", "limit?", "offset?"]
    output: Sample[]
    side_effects: []
  - method: GET
    path: "/api/samples/{sid}"
    description: "Get a sample with computed concentration & result_grade"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: Sample
    side_effects: []
  - method: POST
    path: "/api/samples/{sid}/result"
    description: "Upload lab raw_count -> PENDING to ANALYZED"
    roles: [LabTech]
    code: 200
    input: [raw_count]
    output: Sample
    side_effects: ["concentration, result_grade computed; Assessment.finding_level, Project.open_finding_count, Project.posture recomputed"]
  - method: POST
    path: "/api/samples/{sid}/void"
    description: "Void a sample (PENDING or ANALYZED)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Sample
    side_effects: ["Assessment.finding_level -> open_finding_count -> posture recomputed (cascade)"]

  # ---- Containment Zones ----
  - method: POST
    path: "/api/containment-zones"
    description: "Create a containment zone"
    roles: [ProjectManager, AbatementSupervisor]
    code: 201
    input: [project_id, zone_label, required_pressure_pa]
    output: ContainmentZone
    side_effects: ["status=SETUP; latest_pressure_pa=0; is_compliant=false"]
  - method: GET
    path: "/api/containment-zones"
    description: "List containment zones; filter by project_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: ContainmentZone[]
    side_effects: []
  - method: GET
    path: "/api/containment-zones/{zid}"
    description: "Get a containment zone with computed latest_pressure_pa & is_compliant"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: ContainmentZone
    side_effects: []
  - method: POST
    path: "/api/containment-zones/{zid}/pressure-logs"
    description: "Append a pressure reading; recomputes latest_pressure_pa & is_compliant; may BREACH or restore ACTIVE"
    roles: [AbatementSupervisor]
    code: 201
    input: [zone_id, reading_pa, reading_at]
    output: PressureLog
    side_effects: ["zone.latest_pressure_pa, is_compliant recomputed; ACTIVE->BREACHED or BREACHED->ACTIVE; Project.posture recomputed (may FREEZE/unfreeze)"]
  - method: GET
    path: "/api/pressure-logs"
    description: "List pressure logs; filter by zone_id (reverse-reachability for PressureLog.zone_id)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: PressureLog[]
    side_effects: []
  - method: GET
    path: "/api/pressure-logs/{plid}"
    description: "Get a single pressure log reading"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: PressureLog
    side_effects: []
  - method: POST
    path: "/api/containment-zones/{zid}/activate"
    description: "SETUP -> ACTIVE (requires compliant pressure)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ContainmentZone
    side_effects: ["Project.posture recomputed (ASSESSMENT -> CONTAINED)"]
  - method: POST
    path: "/api/containment-zones/{zid}/dismantle"
    description: "ACTIVE -> DISMANTLED (requires no active abatement + a SIGNED_OFF clearance)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ContainmentZone
    side_effects: ["Project.posture recomputed"]

  # ---- Abatement Orders ----
  - method: POST
    path: "/api/abatement-orders"
    description: "Create an abatement order; supersedes_order_id set for a revision"
    roles: [AbatementSupervisor]
    code: 201
    input: [project_id, zone_id, lead_worker_id, abatement_type, planned_weight_kg, "supersedes_order_id?"]
    output: AbatementOrder
    side_effects: ["status=PLANNED; revision_index computed per §1.3 revision_depth"]
  - method: GET
    path: "/api/abatement-orders"
    description: "List abatement orders; filter by project_id, zone_id, lead_worker_id, supersedes_order_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["project_id?", "zone_id?", "lead_worker_id?", "supersedes_order_id?", "limit?", "offset?"]
    output: AbatementOrder[]
    side_effects: []
  - method: GET
    path: "/api/abatement-orders/{aid}"
    description: "Get an abatement order"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: []
  - method: POST
    path: "/api/abatement-orders/{aid}/start"
    description: "PLANNED/REOPENED -> IN_PROGRESS (zone ACTIVE, cert, NESHAP, crew gates)"
    roles: [AbatementSupervisor]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: ["Project.posture -> ABATING"]
  - method: POST
    path: "/api/abatement-orders/{aid}/complete"
    description: "IN_PROGRESS -> COMPLETED (requires removed_weight_kg & accepted manifest covering it)"
    roles: [AbatementSupervisor]
    code: 200
    input: [removed_weight_kg]
    output: AbatementOrder
    side_effects: ["InsuranceClaim estimate & settlement recomputed; Project.posture -> CLEARANCE_PENDING when all orders COMPLETED"]
  - method: POST
    path: "/api/abatement-orders/{aid}/cancel"
    description: "PLANNED/IN_PROGRESS -> CANCELLED"
    roles: [ProjectManager]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: ["ACTIVE assignments RELEASED; InsuranceClaim estimate recomputed; Project.posture recomputed"]

  # ---- Worker Assignments ----
  - method: POST
    path: "/api/assignments"
    description: "Assign a worker to an abatement order"
    roles: [AbatementSupervisor]
    code: 201
    input: [abatement_order_id, worker_id, shift_start_at, shift_end_at]
    output: WorkerAssignment
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/assignments"
    description: "List worker assignments; filter by abatement_order_id, worker_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["abatement_order_id?", "worker_id?", "limit?", "offset?"]
    output: WorkerAssignment[]
    side_effects: []
  - method: GET
    path: "/api/assignments/{asid}"
    description: "Get a worker assignment"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: WorkerAssignment
    side_effects: []

  # ---- Disposal Manifests ----
  - method: POST
    path: "/api/disposal-manifests"
    description: "Create a disposal manifest for an abatement order"
    roles: [AbatementSupervisor]
    code: 201
    input: [abatement_order_id, project_id, hauler_name, manifest_weight_kg]
    output: DisposalManifest
    side_effects: ["status=DRAFT; disposal_fee_cents computed per §1.3 disposal_fee"]
  - method: GET
    path: "/api/disposal-manifests"
    description: "List disposal manifests; filter by abatement_order_id, project_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["abatement_order_id?", "project_id?", "limit?", "offset?"]
    output: DisposalManifest[]
    side_effects: []
  - method: GET
    path: "/api/disposal-manifests/{mid}"
    description: "Get a disposal manifest with computed disposal_fee_cents"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: DisposalManifest
    side_effects: []
  - method: POST
    path: "/api/disposal-manifests/{mid}/submit"
    description: "DRAFT -> SUBMITTED (asbestos requires acknowledged TRANSPORT permit)"
    roles: [AbatementSupervisor]
    code: 200
    input: []
    output: DisposalManifest
    side_effects: []
  - method: POST
    path: "/api/disposal-manifests/{mid}/accept"
    description: "SUBMITTED -> ACCEPTED; finalizes disposal_fee_cents; recomputes claim"
    roles: [ProjectManager]
    code: 200
    input: []
    output: DisposalManifest
    side_effects: ["disposal_fee_cents finalized; InsuranceClaim estimate & settlement recomputed"]
  - method: POST
    path: "/api/disposal-manifests/{mid}/void"
    description: "SUBMITTED -> VOIDED (manual)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: DisposalManifest
    side_effects: ["InsuranceClaim estimate recomputed"]

  # ---- Clearance Tests ----
  - method: POST
    path: "/api/clearance-tests"
    description: "Create a clearance test against a COMPLETED abatement order"
    roles: [LabTech]
    code: 201
    input: [project_id, zone_id, abatement_order_id, sampler_worker_id, clearance_air_count, clearance_volume_liters]
    output: ClearanceTest
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/api/clearance-tests"
    description: "List clearance tests; filter by project_id, zone_id, abatement_order_id, sampler_worker_id, signoff_worker_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["project_id?", "zone_id?", "abatement_order_id?", "sampler_worker_id?", "signoff_worker_id?", "limit?", "offset?"]
    output: ClearanceTest[]
    side_effects: []
  - method: GET
    path: "/api/clearance-tests/{cid}"
    description: "Get a clearance test with computed concentration & outcome"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: ClearanceTest
    side_effects: []
  - method: POST
    path: "/api/clearance-tests/{cid}/analyze"
    description: "DRAFT -> ANALYZED; computes concentration & outcome; PASS->PASSED, FAIL->FAILED with reopen cascade"
    roles: [LabTech]
    code: 200
    input: []
    output: ClearanceTest
    side_effects: ["clearance_concentration, outcome computed; FAIL reopens order, voids manifests, recomputes claim & posture"]
  - method: POST
    path: "/api/clearance-tests/{cid}/signoff"
    description: "PASSED -> SIGNED_OFF by independent Hygienist; OCC on Project.version; clears covered assessments"
    roles: [Hygienist]
    code: 200
    input: [signoff_worker_id, expected_project_version]
    output: ClearanceTest
    side_effects: ["covered Assessments -> CLEARED; open_finding_count, posture recomputed (-> VERIFIED); increments Project.version by 1"]

  # ---- Permits ----
  - method: POST
    path: "/api/permits"
    description: "Create a permit/notification (NESHAP/DEMOLITION/TRANSPORT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [project_id, permit_type, postmarked_at, work_start_at]
    output: Permit
    side_effects: ["status=DRAFT; notice_days computed per §1.3 notice_lead_days"]
  - method: GET
    path: "/api/permits"
    description: "List permits; filter by project_id, permit_type (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["project_id?", "permit_type?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: GET
    path: "/api/permits/{pmid}"
    description: "Get a permit with computed notice_days"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/api/permits/{pmid}/submit"
    description: "DRAFT -> SUBMITTED (NESHAP needs notice_days >= NESHAP_NOTICE_DAYS)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/api/permits/{pmid}/acknowledge"
    description: "SUBMITTED -> ACKNOWLEDGED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/api/permits/{pmid}/expire"
    description: "ACKNOWLEDGED -> EXPIRED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  # ---- Insurance Claims ----
  - method: POST
    path: "/api/insurance-claims"
    description: "Open an insurance claim for a project"
    roles: [ProjectManager]
    code: 201
    input: [project_id, policy_number, deductible_cents, coverage_limit_cents]
    output: InsuranceClaim
    side_effects: ["status=OPEN; estimated_amount_cents=0; settled_amount_cents=0"]
  - method: GET
    path: "/api/insurance-claims"
    description: "List insurance claims; filter by project_id (reverse-reachability)"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []
  - method: GET
    path: "/api/insurance-claims/{clid}"
    description: "Get an insurance claim with estimated & settled amounts"
    roles: [ProjectManager, ComplianceOfficer, AbatementSupervisor, Hygienist, LabTech]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []
  - method: POST
    path: "/api/insurance-claims/{clid}/submit"
    description: "OPEN -> SUBMITTED (posture must be CLEARANCE_PENDING or VERIFIED); recomputes estimate"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["estimated_amount_cents recomputed per §1.3 claim_estimate"]
  - method: POST
    path: "/api/insurance-claims/{clid}/settle"
    description: "SUBMITTED -> SETTLED (posture must be VERIFIED); finalizes settled_amount_cents"
    roles: [ComplianceOfficer]
    code: 200
    input: ["allow_over_cap?"]
    output: InsuranceClaim
    side_effects: ["settled_amount_cents recomputed per §1.3 claim_settlement"]
  - method: POST
    path: "/api/insurance-claims/{clid}/deny"
    description: "SUBMITTED -> DENIED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INVALID_ROLE, http: 401, condition: "X-User-Role not a recognized role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per §1.7" }
  # --- Not found ---
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project id in path/body does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Assessment not found" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "Sample not found" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "ContainmentZone not found" }
  - { id: ERR_ABATEMENT_ORDER_NOT_FOUND, http: 404, condition: "AbatementOrder not found" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "DisposalManifest not found" }
  - { id: ERR_CLEARANCE_NOT_FOUND, http: 404, condition: "ClearanceTest not found" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "InsuranceClaim not found" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "Worker not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "WorkerAssignment not found" }
  # --- Referential / cross-project ---
  - { id: ERR_CROSS_PROJECT_REFERENCE, http: 409, condition: "Body FK references a resource in a different project than the body project_id" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum, non-positive numeric, AIR sample missing volume_liters or SURFACE supplying it, shift_end <= shift_start" }
  - { id: ERR_TIMESTAMP_IN_FUTURE, http: 409, condition: "Supplied timestamp is after the logical clock now" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match current Project.version on clearance signoff" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_ASSESSMENT_ALREADY_CLEARED, http: 409, condition: "Cannot void an ANALYZED sample under a CLEARED assessment" }
  - { id: ERR_ORDER_NOT_COMPLETED, http: 409, condition: "Clearance analyze requires the abatement order to be COMPLETED" }
  - { id: ERR_ZONE_NOT_ACTIVE, http: 409, condition: "Abatement start/complete requires the zone to be ACTIVE" }
  - { id: ERR_CLEARANCE_IN_PROGRESS, http: 409, condition: "Cannot cancel an IN_PROGRESS order with an in-flight clearance test (ANALYZED/PASSED/SIGNED_OFF)" }
  - { id: ERR_ABATEMENT_IN_PROGRESS, http: 409, condition: "Operation blocked by an order in PLANNED/IN_PROGRESS/REOPENED" }
  - { id: ERR_NO_PASSING_CLEARANCE, http: 409, condition: "Zone dismantle requires a SIGNED_OFF clearance test" }
  - { id: ERR_MANIFEST_WEIGHT_SHORT, http: 409, condition: "No ACCEPTED manifest with weight >= removed_weight_kg before complete" }
  - { id: ERR_PROJECT_NOT_READY_FOR_BILLING, http: 409, condition: "Insurance submit requires posture in {CLEARANCE_PENDING, VERIFIED}" }
  - { id: ERR_PROJECT_NOT_VERIFIED, http: 409, condition: "Settle/project-signoff requires posture == VERIFIED" }
  - { id: ERR_OPEN_FINDINGS_REMAIN, http: 409, condition: "Project signoff requires open_finding_count == 0" }
  # --- Safety / compliance (422) ---
  - { id: ERR_WORKER_NOT_CERTIFIED, http: 422, condition: "Worker cert not current or cert_type mismatched for the operation" }
  - { id: ERR_SIGNOFF_NOT_INDEPENDENT, http: 422, condition: "Sign-off worker is the sampler or the abatement lead (segregation of duties)" }
  - { id: ERR_CONTAINMENT_NOT_COMPLIANT, http: 422, condition: "Zone latest_pressure_pa below required_pressure_pa at activation" }
  - { id: ERR_NESHAP_NOTICE_NOT_MET, http: 422, condition: "NESHAP notice lead time / acknowledgement not satisfied" }
  - { id: ERR_TRANSPORT_PERMIT_MISSING, http: 422, condition: "Asbestos disposal manifest submit without ACKNOWLEDGED TRANSPORT permit" }
  - { id: ERR_NO_CERTIFIED_CREW, http: 422, condition: "Abatement start without any ACTIVE assignment carrying a current cert" }
  # --- Fiscal ---
  - { id: ERR_COVERAGE_LIMIT_EXCEEDED, http: 402, condition: "Settle with allow_over_cap omitted/false while gross exceeds coverage_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Owns project lifecycle: projects, assessments, zones (activate/dismantle), order cancel, sample/manifest void & accept, insurance open/submit, worker registration"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/projects — create project"
      - "POST /api/projects/{id}/abandon — abandon project"
      - "POST /api/samples/{id}/void — void sample"
      - "POST /api/containment-zones/{id}/activate — activate zone"
      - "POST /api/containment-zones/{id}/dismantle — dismantle zone"
      - "POST /api/abatement-orders/{id}/cancel — cancel order"
      - "POST /api/disposal-manifests/{id}/accept — accept manifest"
      - "POST /api/disposal-manifests/{id}/void — void manifest"
      - "POST /api/insurance-claims — open claim"
      - "POST /api/insurance-claims/{id}/submit — submit claim"
    shared_operations:
      - "POST /api/workers — register worker (shared with ComplianceOfficer)"
      - "POST /api/assessments — create assessment (shared with LabTech)"
      - "POST /api/containment-zones — create zone (shared with AbatementSupervisor)"
      - "GET endpoints — read across resources"

  - name: AbatementSupervisor
    description: "Runs abatement: orders, assignments, pressure logs, manifests (create/submit), start/complete orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/abatement-orders — create order"
      - "POST /api/abatement-orders/{id}/start — start order"
      - "POST /api/abatement-orders/{id}/complete — complete order"
      - "POST /api/assignments — assign worker"
      - "POST /api/containment-zones/{id}/pressure-logs — log pressure"
      - "POST /api/disposal-manifests — create manifest"
      - "POST /api/disposal-manifests/{id}/submit — submit manifest"
    shared_operations:
      - "POST /api/containment-zones — create zone (shared with ProjectManager)"
      - "GET endpoints — read across resources"

  - name: LabTech
    description: "Lab & sampling: collect samples, upload results, create assessments, create/analyze clearance tests"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/samples — collect sample"
      - "POST /api/samples/{id}/result — upload result"
      - "POST /api/clearance-tests — create clearance test"
      - "POST /api/clearance-tests/{id}/analyze — analyze clearance test"
    shared_operations:
      - "POST /api/assessments — create assessment (shared with ProjectManager)"
      - "GET endpoints — read across resources"

  - name: Hygienist
    description: "Independent certified industrial hygienist: clearance sign-off and final project sign-off only (cannot have sampled or led abatement — segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/clearance-tests/{id}/signoff — sign off clearance"
      - "POST /api/projects/{id}/signoff — final project sign-off"
    shared_operations:
      - "GET endpoints — read across resources"

  - name: ComplianceOfficer
    description: "Regulatory: permits/notifications lifecycle, insurance settle/deny, worker registration, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc — set logical clock"
      - "POST /api/permits — create permit"
      - "POST /api/permits/{id}/submit — submit permit"
      - "POST /api/permits/{id}/acknowledge — acknowledge permit"
      - "POST /api/permits/{id}/expire — expire permit"
      - "POST /api/insurance-claims/{id}/settle — settle claim"
      - "POST /api/insurance-claims/{id}/deny — deny claim"
    shared_operations:
      - "POST /api/workers — register worker (shared with ProjectManager)"
      - "GET endpoints — read across resources"
