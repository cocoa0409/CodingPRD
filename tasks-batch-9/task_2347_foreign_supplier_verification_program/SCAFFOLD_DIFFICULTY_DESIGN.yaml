            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ben Osei", email: "ben@northbrook.example", qualification_summary: "Preventive controls qualified individual with laboratory oversight background", training_completed_at: "2025-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_b: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_b}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
