  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: attendance_state_before_temporal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
          - errors[ERR_ATTENDANCE_DATE_OUT_OF_RANGE]
        distinguishing_aspect: |
          Error-category pair state(409) vs business_temporal(422): one request
          (attendance entry dated 2026-07-01, before year start, on a WITHDRAWN
          enrollment) violates both; the state error must win per priority 6 < 9.
        test_recipe:
          setup:
            - "Year OPEN (start 2026-08-01); family; grade-4 student; enrollment was ACTIVE and is now WITHDRAWN"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Pri", district_code: "D-14" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Pri", date_of_birth: "2016-04-04" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-14" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/withdraw", payload: { reason: "moving out of state" }, as: Parent, as_user_id: "${fam}" }
          trigger:
            - { call: "POST /enrollments/${enr}/attendance-entries", payload: { entry_date: "2026-07-01", minutes: 300 }, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENROLLMENT_NOT_ACTIVE (HTTP 409), not ERR_ATTENDANCE_DATE_OUT_OF_RANGE (422)"
            - "no AttendanceEntry exists for the enrollment afterwards (GET /enrollments/${enr}/attendance-entries total_count == 0)"

      - name: coop_registration_safety_before_fiscal_priority
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_ENROLLMENT_NONCOMPLIANT]
          - errors[ERR_FEES_OVERDUE]
        distinguishing_aspect: |
          Error-category pair business_safety(422 NONCOMPLIANT standing) vs
          business_fiscal(422 OVERDUE fees): one co-op registration request
          violates both; the safety error must win per priority 8 < 12. Distinct
          pair from the state-vs-temporal instance.
        test_recipe:
          setup:
            - "Year OPEN; family with ACTIVE grade-4 enrollment"
            - "Class1 (cap 5, MON 09:00-10:30, start 2026-09-20, base 10000, materials 1000): student registered CONFIRMED at 11000 then parent-dropped pre-start -> refund 8500, balance 2500 with oldest_unpaid_charge_at = 2026-08-01T00:00:00Z"
            - "Clock advanced to 2026-09-05T00:00:00Z -> fee_status OVERDUE (2500 > 0 and now > 2026-08-31)"
            - "Director standing override sets compliance_standing NONCOMPLIANT (locked); no active co-op enrollments exist, so the cascade is a no-op"
            - "Class2 (cap 5, WED 10:00-11:40, start 2026-10-01, base 5000, materials 0) OPEN"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Gate", district_code: "D-15" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Gate", date_of_birth: "2016-05-05" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-15" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "Class One", subject: "Art", grade_min: 0, grade_max: 12, meeting_day: "MON", meeting_start_minutes: 540, meeting_end_minutes: 630, start_date: "2026-09-20", end_date: "2026-12-15", capacity: 5, fee_base_cents: 10000, materials_fee_cents: 1000 }, as: Registrar, captures: { cl1: $.data.id } }
            - { call: "POST /coop-classes/${cl1}/open", payload: {}, as: Registrar }
            - { call: "GET /coop-classes/${cl1}", payload: {}, as: Registrar, captures: { cv1: $.data.version } }
            - { call: "POST /coop-classes/${cl1}/enrollments", payload: { enrollment_id: "${enr}", expected_coop_class_version: "${cv1}" }, as: Parent, as_user_id: "${fam}", captures: { ce1: $.data.id } }
            - { call: "POST /coop-enrollments/${ce1}/drop", payload: {}, as: Parent, as_user_id: "${fam}", captures: { ref1: $.data.refund_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: AcademicDirector }
            - { call: "POST /enrollments/${enr}/standing-overrides", payload: { standing: "NONCOMPLIANT", reason: "director audit hold" }, as: AcademicDirector, as_user_id: "dir-1" }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "Class Two", subject: "Music", grade_min: 0, grade_max: 12, meeting_day: "WED", meeting_start_minutes: 600, meeting_end_minutes: 700, start_date: "2026-10-01", end_date: "2027-01-15", capacity: 5, fee_base_cents: 5000, materials_fee_cents: 0 }, as: Registrar, captures: { cl2: $.data.id } }
            - { call: "POST /coop-classes/${cl2}/open", payload: {}, as: Registrar }
          trigger:
            - { call: "GET /coop-classes/${cl2}", payload: {}, as: Registrar, captures: { cv2: $.data.version } }
            - { call: "POST /coop-classes/${cl2}/enrollments", payload: { enrollment_id: "${enr}", expected_coop_class_version: "${cv2}" }, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
            - { call: "GET /families/${fam}/ledger", payload: {}, as: Registrar, captures: { bal: $.data.fee_balance_cents, fstat: $.data.fee_status } }
          assert:
            - "first drop refund_cents == 8500 (11000 - 2500 admin fee, pre-start parent drop)"
            - "Family.${fam}.fee_status == OVERDUE with fee_balance_cents == 2500 at trigger time"
            - "error_id == ERR_ENROLLMENT_NONCOMPLIANT (business_safety), not ERR_FEES_OVERDUE (business_fiscal)"
            - "no new CoopEnrollment created and fee_balance_cents unchanged at 2500"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: exam_passing_percentile_boundary
        grounds:
          - calculations.exam_pass_evaluation
          - calculations.testing_requirement
          - entities.TestRegistration.fields.passed
          - entities.TestRegistration.fields.composite_percentile
        distinguishing_aspect: |
          Metric = composite percentile on the record-score endpoint: 22 fails,
          23 passes (>= semantics). Boundary sits on a different metric and a
          different endpoint than the seat-capacity instance.
        test_recipe:
          setup:
            - "Year OPEN; family; grade-5 student (testing_grades [3,5,8,11] -> testing_required); enrollment ACTIVE"
            - "Session S1 on 2026-09-15 09:00-11:00 and S2 on 2026-09-16 09:00-11:00 (different dates, no buffer conflict); both REGISTRATION_OPEN, deadline 2026-09-01, target_grades [5], capacity 10"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Exam", district_code: "D-16" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Exam", date_of_birth: "2015-06-06" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 5 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-16" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/exam-sessions", payload: { test_name: "IOWA", session_date: "2026-09-15", start_minutes: 540, end_minutes: 660, capacity: 10, registration_deadline: "2026-09-01T00:00:00Z", target_grades: [5] }, as: Registrar, captures: { s1: $.data.id } }
            - { call: "POST /exam-sessions/${s1}/open-registration", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/exam-sessions", payload: { test_name: "IOWA", session_date: "2026-09-16", start_minutes: 540, end_minutes: 660, capacity: 10, registration_deadline: "2026-09-01T00:00:00Z", target_grades: [5] }, as: Registrar, captures: { s2: $.data.id } }
            - { call: "POST /exam-sessions/${s2}/open-registration", payload: {}, as: Registrar }
            - { call: "POST /exam-sessions/${s1}/registrations", payload: { enrollment_id: "${enr}" }, as: Parent, as_user_id: "${fam}", captures: { reg1: $.data.id } }
            - { call: "POST /exam-sessions/${s2}/registrations", payload: { enrollment_id: "${enr}" }, as: Parent, as_user_id: "${fam}", captures: { reg2: $.data.id } }
            - { call: "POST /exam-sessions/${s1}/close-registration", payload: {}, as: Registrar }
            - { call: "POST /exam-sessions/${s1}/administer", payload: {}, as: Registrar }
            - { call: "POST /exam-sessions/${s2}/close-registration", payload: {}, as: Registrar }
            - { call: "POST /exam-sessions/${s2}/administer", payload: {}, as: Registrar }
            - { call: "POST /test-registrations/${reg1}/record-attendance", payload: { attendance_outcome: "ATTENDED" }, as: Registrar }
            - { call: "POST /test-registrations/${reg2}/record-attendance", payload: { attendance_outcome: "ATTENDED" }, as: Registrar }
          trigger:
            - { call: "POST /test-registrations/${reg1}/record-score", payload: { composite_percentile: 22 }, as: Registrar, captures: { p1: $.data.passed } }
            - { call: "POST /test-registrations/${reg2}/record-score", payload: { composite_percentile: 23 }, as: Registrar, captures: { p2: $.data.passed } }
            - { call: "GET /enrollments/${enr}", payload: {}, as: Registrar, captures: { tsat: $.data.testing_satisfied, treq: $.data.testing_required } }
          assert:
            - "TestRegistration.${reg1}.passed == false at composite_percentile == 22"
            - "TestRegistration.${reg2}.passed == true at composite_percentile == 23 (>= 23 passes)"
            - "Enrollment.${enr}.testing_required == true"
            - "Enrollment.${enr}.testing_satisfied == true after the 23 score"

      - name: coop_capacity_boundary_and_waitlist
        grounds:
          - entities.CoopClass.fields.seats_taken
          - state_machines.CoopEnrollment
          - calculations.coop_fee_calculation
        distinguishing_aspect: |
          Metric = integer seat count on the co-op enrollment endpoint: with
          capacity 2, the 2nd registration lands CONFIRMED and the 3rd lands
          WAITLISTED with fee_cents == 0 and no ledger charge (boundary between
          seats_taken < capacity and == capacity). Distinct metric and endpoint
          from the percentile instance.
        test_recipe:
          setup:
            - "Year OPEN; families A, B, C each with one ACTIVE enrollment (grades 4, 5, 6)"
            - "Co-op class capacity 2 (MON 09:00-10:30, start 2026-08-25 -> no early-bird at 2026-08-01, base 10000, materials 1000), OPEN"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam A", district_code: "D-17" }, as: Parent, captures: { famA: $.data.id } }
            - { call: "POST /families/${famA}/students", payload: { full_name: "Kid A", date_of_birth: "2016-01-01" }, as: Parent, as_user_id: "${famA}", captures: { stuA: $.data.id } }
            - { call: "POST /students/${stuA}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${famA}", captures: { enrA: $.data.id } }
            - { call: "POST /enrollments/${enrA}/notices", payload: { district_code: "D-17" }, as: Parent, as_user_id: "${famA}", captures: { noiA: $.data.id } }
