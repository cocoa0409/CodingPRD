            - call: "POST /identities/${c6}/grants"
              payload: { entitlement_id: "${entc}", expected_identity_version: "${c6v}" }
              as: AccessManager
              captures: { gc6: $.data.id }
            - call: "POST /identities"
              payload: { display_name: "C7", email: "c7@x.com" }
              as: AccessManager
