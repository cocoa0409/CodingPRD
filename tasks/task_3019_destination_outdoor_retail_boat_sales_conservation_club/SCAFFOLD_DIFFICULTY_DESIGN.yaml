      - name: safety_permit_gate_beats_capacity_constraint
        grounds:
          - validations[priority=11]
          - validations[priority=17]
          - state_machines.ServiceIntake.transitions.INTAKE_QUOTED_to_PERMIT_VERIFIED
          - state_machines.AttractionSession.transitions.REQUESTED_to_CONFIRMED
          - errors[ERR_PERMIT_VERIFICATION_REQUIRED]
