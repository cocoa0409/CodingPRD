# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index (task_1007)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: insurance_estimate_vs_final_coverage
        grounds:
          - calculations.insurance_coverage
          - state_machines.InsuranceClaim.SUBMITTED_to_APPROVED
          - entities.InsuranceClaim.fields.covered_amount_cents
        distinguishing_aspect: "On the InsuranceClaim domain the ESTIMATE covered_amount (16000, over claim_amount 20000) diverges from the FINAL covered_amount (9600, over adjudicated 12000) for the same claim."
        test_recipe:
          setup:
            - "A BRONZE customer with one PAID order containing a single MASTECTOMY_BRA line of unit price 20000 (subtotal 20000, discount 0)."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Mae Ins", email: "mae.ins@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Recover Soft", brand: "Amoena", category: "MASTECTOMY_BRA", base_price_cents: 20000, hygiene_class: "INTIMATE_NON_RETURNABLE" }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "REC-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /boutique/insurance-claims"
              payload: { order_id: "${order_id}" }
              as: BillingClerk
              captures: { claim_id: $.data.id, covered_estimate: $.data.covered_amount_cents }
            - call: "POST /boutique/insurance-claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE", adjudicated_amount_cents: 12000 }
              as: BillingClerk
              captures: { covered_final: $.data.covered_amount_cents }
          assert:
            - "InsuranceClaim.${claim_id}.claim_amount_cents == 20000"
            - "covered_estimate == 16000"
            - "covered_final == 9600"
            - "InsuranceClaim.${claim_id}.status == APPROVED"

      - name: loyalty_provisional_vs_final_points
        grounds:
          - calculations.loyalty_points_earned
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.Order.fields.provisional_points
          - entities.Order.fields.final_points
        distinguishing_aspect: "On the Customer/Order loyalty domain PROVISIONAL points (9, no multiplier) diverge from FINAL points (18, GOLD 2x) for identical order total 944."
        test_recipe:
          setup:
            - "A GOLD customer (loyalty_points 5000) with an order of two SKUs priced 525 each; placed."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Gia Gold", email: "gia.gold@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 5000, reason: "PROMOTION" }
              as: StoreManager
            - call: "POST /boutique/products"
              payload: { style_name: "Everyday Lift", brand: "Chantelle", category: "EVERYDAY_BRA", base_price_cents: 525 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "EL-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_a: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 36, cup_size: "C", sku_code: "EL-36C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_b: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_a}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_b}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
              captures: { prov: $.data.provisional_points }
            - call: "POST /boutique/orders/${order_id}/fulfill"
              payload: {}
              as: StoreManager
              captures: { fin: $.data.final_points }
          assert:
            - "Order.${order_id}.total_cents == 944"
            - "prov == 9"
            - "fin == 18"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: size_algo_three_input_branch          # mode (a)
        grounds:
          - calculations.bra_size_recommendation
          - state_machines.FittingAppointment.CHECKED_IN_to_CHECKED_IN
          - entities.FittingAppointment.fields.recommended_size
        distinguishing_aspect: "Mode (a): three inputs (underbust_cm, bust_cm, fit_preference) interact non-linearly — fit_preference selects a floor/ceil/round branch and cup_diff selects a tiered cup letter — yielding recommended_size 30D."
        test_recipe:
          setup:
            - "A CHECKED_IN STANDARD appointment for a customer with an active fitter and room."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Nia Fit", email: "nia.fit@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/fitters"
              payload: { full_name: "Fay Fitter", post_surgical_certified: false }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /boutique/rooms"
              payload: { room_name: "Room 1", capacity: 5 }
              as: StoreManager
              captures: { room_id: $.data.id }
            - call: "POST /boutique/appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}", room_id: "${room_id}", fitting_type: "STANDARD", scheduled_start: "2026-07-02T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
            - call: "POST /boutique/appointments/${appt_id}/check-in"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { appt_v: $.data.version }
          trigger:
            - call: "POST /boutique/appointments/${appt_id}/fit"
              payload: { underbust_cm: 76, bust_cm: 84, fit_preference: "STANDARD", expected_appointment_version: "${appt_v}" }
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { size: $.data.recommended_size }
          assert:
            - "FittingAppointment.${appt_id}.recommended_band == 30"
            - "FittingAppointment.${appt_id}.recommended_cup == D"
            - "size == 30D"

      - name: order_discount_perline_round_then_sum   # mode (b)
        grounds:
          - calculations.order_totals
          - state_machines.Order.UNPAID_to_PAID
          - entities.Order.fields.discount_cents
        distinguishing_aspect: "Mode (b): pinned per-line round_half_up then sum gives discount_cents 106 (53+53), whereas sum-then-round would give 105 — the rounding order is observable."
        test_recipe:
          setup:
            - "A GOLD customer with two ACTIVE lines of gross 525 each on a placed order (same setup as loyalty_provisional_vs_final_points)."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Bea Round", email: "bea.round@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 5000, reason: "PROMOTION" }
              as: StoreManager
            - call: "POST /boutique/products"
              payload: { style_name: "Round Bra", brand: "Wacoal", category: "EVERYDAY_BRA", base_price_cents: 525 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "RB-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_a: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 36, cup_size: "C", sku_code: "RB-36C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_b: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_a}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_b}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
              captures: { disc: $.data.discount_cents, tot: $.data.total_cents }
          assert:
            - "Order.${order_id}.subtotal_cents == 1050"
            - "disc == 106"
            - "tot == 944"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment
        grounds:
          - state_machines.Order.DRAFT_to_PLACED
          - state_machines.Order.UNPAID_to_PAID
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "On Order, payment_status and fulfillment_status advance independently: after pay payment_status==PAID while fulfillment_status stays PLACED (two parallel dimensions on one row)."
        test_recipe:
          setup:
            - "A BRONZE customer with a single-line placed order (in stock)."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Pat Par", email: "pat.par@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Par Bra", brand: "Panache", category: "EVERYDAY_BRA", base_price_cents: 1000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "PB-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fs_after_place: $.data.fulfillment_status, ps_after_place: $.data.payment_status }
          trigger:
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
              captures: { fs_after_pay: $.data.fulfillment_status, ps_after_pay: $.data.payment_status }
          assert:
            - "fs_after_place == PLACED"
            - "ps_after_place == UNPAID"
            - "ps_after_pay == PAID"
            - "fs_after_pay == PLACED"

      - name: insurance_claim_cyclic_resubmit
        grounds:
          - state_machines.InsuranceClaim.SUBMITTED_to_DENIED
          - state_machines.InsuranceClaim.DENIED_to_SUBMITTED
          - entities.InsuranceClaim.fields.status
        distinguishing_aspect: "On InsuranceClaim, DENIED -> SUBMITTED resubmit is a cycle back to a prior state (A->B->A), a different entity than Order."
        test_recipe:
          setup:
            - "A submitted claim on a PAID mastectomy order, then DENIED."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Cyd Cyc", email: "cyd.cyc@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Cyc Bra", brand: "Amoena", category: "MASTECTOMY_BRA", base_price_cents: 15000, hygiene_class: "INTIMATE_NON_RETURNABLE" }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "CYC-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
            - call: "POST /boutique/insurance-claims"
              payload: { order_id: "${order_id}" }
              as: BillingClerk
              captures: { claim_id: $.data.id }
            - call: "POST /boutique/insurance-claims/${claim_id}/adjudicate"
              payload: { decision: "DENY" }
              as: BillingClerk
              captures: { status_denied: $.data.status }
          trigger:
            - call: "POST /boutique/insurance-claims/${claim_id}/resubmit"
              payload: {}
              as: BillingClerk
              captures: { status_resubmitted: $.data.status }
          assert:
            - "status_denied == DENIED"
            - "status_resubmitted == SUBMITTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: exchange_approve_cascade_depth3
        grounds:
          - state_machines.Exchange.REQUESTED_to_APPROVED
          - entities.OrderLine.fields.status
          - entities.SKU.fields.stock_on_hand
          - entities.SKU.fields.stock_status
        distinguishing_aspect: "Depth-3 chain from exchange approve: Exchange->APPROVED mutates OrderLine.status->EXCHANGED (hop1), which raises SKU.stock_on_hand 0->1 (hop2), which flips SKU.stock_status OUT_OF_STOCK->LOW_STOCK (hop3)."
        test_recipe:
          setup:
            - "A FULFILLED single-unit EVERYDAY_BRA order line whose SKU had initial_stock 1 (so after fulfillment stock_on_hand 0, OUT_OF_STOCK); clock at default 2026-07-01."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Ada Casc", email: "ada.casc@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Casc Bra", brand: "Freya", category: "EVERYDAY_BRA", base_price_cents: 4000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "CSC-34C", initial_stock: 1 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
            - call: "POST /boutique/orders/${order_id}/fulfill"
              payload: {}
              as: StoreManager
            - call: "POST /boutique/exchanges"
              payload: { order_id: "${order_id}", order_line_id: "${line_id}", item_condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { exch_id: $.data.id }
          trigger:
            - call: "POST /boutique/exchanges/${exch_id}/approve"
              payload: {}
              as: StoreManager
          assert:
            - "OrderLine.${line_id}.status == EXCHANGED"
            - "SKU.${sku_id}.stock_on_hand == 1"
            - "SKU.${sku_id}.stock_status == LOW_STOCK"

      - name: order_cancel_cascade_depth2
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - entities.OrderLine.fields.status
          - entities.SKU.fields.reserved_count
        distinguishing_aspect: "Depth-2 chain from order cancel (a different trigger than exchange approve): Order->CANCELLED mutates OrderLine.status->CANCELLED (hop1), which releases the reservation dropping SKU.reserved_count 2->0 (hop2)."
        test_recipe:
          setup:
            - "A PLACED (unpaid) order with one line of quantity 2 against a SKU with initial_stock 5 (reserved_count 2, available 3)."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Cam Canc", email: "cam.canc@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Canc Bra", brand: "Sculptresse", category: "EVERYDAY_BRA", base_price_cents: 3000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 38, cup_size: "D", sku_code: "CNC-38D", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /boutique/orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "OrderLine.${line_id}.status == CANCELLED"
            - "SKU.${sku_id}.reserved_count == 0"
            - "SKU.${sku_id}.available_units == 5"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: exchange_state_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_LINE_NOT_EXCHANGEABLE_STATE]
          - errors[ERR_EXCHANGE_WINDOW_EXPIRED]
        distinguishing_aspect: "State (priority 7, ERR_LINE_NOT_EXCHANGEABLE_STATE) outranks business_temporal (priority 11, ERR_EXCHANGE_WINDOW_EXPIRED): an already-EXCHANGED line whose window is also expired returns the state error."
        test_recipe:
          setup:
            - "A fulfilled line (fulfilled_at 2026-07-01) already EXCHANGED via a first approved exchange; clock then advanced to 2026-08-15 (45 days, window expired)."
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Deb Dual", email: "deb.dual@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Dual Bra", brand: "Elomi", category: "EVERYDAY_BRA", base_price_cents: 4000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 40, cup_size: "E", sku_code: "DUL-40E", initial_stock: 1 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
            - call: "POST /boutique/orders/${order_id}/fulfill"
              payload: {}
              as: StoreManager
            - call: "POST /boutique/exchanges"
              payload: { order_id: "${order_id}", order_line_id: "${line_id}", item_condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { exch1_id: $.data.id }
            - call: "POST /boutique/exchanges/${exch1_id}/approve"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: StoreManager
            - call: "POST /boutique/exchanges"
              payload: { order_id: "${order_id}", order_line_id: "${line_id}", item_condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { exch2_id: $.data.id }
          trigger:
            - call: "POST /boutique/exchanges/${exch2_id}/approve"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
