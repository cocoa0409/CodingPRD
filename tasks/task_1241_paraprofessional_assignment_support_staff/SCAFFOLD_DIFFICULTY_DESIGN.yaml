  # ===========================================================================
  # Rule 3 — non_linear_state_machine (two instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_parallel_status_x_funding
        grounds:
          - state_machines.Assignment.FUNDED_to_UNFUNDED
          - state_machines.Assignment.UNFUNDED_to_PROVISIONALLY_FUNDED
          - state_machines.Assignment.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Parallel state dimensions on Assignment: after a failed resume the
          assignment sits at status=SUSPENDED x funding_status=UNFUNDED — the
          funding axis moved while the status axis did not; a later budget release
          auto re-funds (UNFUNDED -> PROVISIONALLY_FUNDED) while still SUSPENDED,
          proving the two dimensions evolve independently on one entity.
        test_recipe:
          setup:
            - "Plan ACTIVE with total_budget_cents 110000, building B1"
            - "Paras P1/P2/P3 (wage 2000, cap 2400, no quals); students S1/S2/S3 all ONE_TO_ONE / NONE 1500 min/wk"
            - "A1 (P1, 300/day Mon-Fri, weekly 52500) ACTIVE; A2 (P2, same shape, 52500) ACTIVE; committed 105000"
