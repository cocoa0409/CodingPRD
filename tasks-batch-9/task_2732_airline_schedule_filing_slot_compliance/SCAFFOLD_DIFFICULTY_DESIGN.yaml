            - "Version validated by usr-comp-1; a STANDARD IATA_SSIM submission created by usr-file-1 with changed_leg_count 4, base_charge_subtotal_cents 16900, expedite_rate_pct 0.00, expedite_fee_cents 0 and total_charge_cents 16900."
