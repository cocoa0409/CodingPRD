  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_conserves_troop_dues
        grounds:
          - state_machines.FundraiserOrder.PLACED_to_CANCELLED
          - calculations.fundraiser_troop_commission
          - entities.Troop.fields.dues_account_cents
        distinguishing_aspect: |
          Conserved quantity = Troop.dues_account_cents. Placing an order credits
          troop_commission_cents to TROOP_DUES; cancelling it appends an equal-and-
          opposite REVERSAL, so dues_account_cents returns to its pre-order value
          (net zero drift) — pinned as: after place+cancel, dues_account_cents equals
          its value before the place.
        test_recipe:
          setup:
            - "LIVE fundraiser unit_price_cents=500; troop dues_account_cents=0 before the order."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Inv9 Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1701", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Inv9 Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { seller_id: $.data.id }
            - call: "POST /councils/${council_id}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 1000 }
              as: CouncilRegistrar
              captures: { fr_id: $.data.id }
            - call: "POST /fundraisers/${fr_id}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { fr_v2: $.data.version }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr_id}", troop_id: "${troop_id}", seller_member_id: "${seller_id}", units: 150, expected_fundraiser_version: "${fr_v2}" }
              as: TroopLeader
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /fundraiser-orders/${order_id}/cancel"
              payload: {}
              as: TroopLeader
          assert:
            - "FundraiserOrder.${order_id}.status == CANCELLED"
            - "Troop.${troop_id}.dues_account_cents == 0"   # 12500 credited then reversed -> 0
            - "Fundraiser.${fr_id}.available_units == 1000"  # 1000-150 then +150 back

      - name: recharter_sweep_conserves_total_cash
        grounds:
          - calculations.recharter_balance_sweep
          - state_machines.Troop.PROVISIONAL_to_CHARTERED
          - calculations.council_fund_balances
        distinguishing_aspect: |
          Conserved quantity = total system cash (TROOP_DUES + COUNCIL_CASH), a
          DIFFERENT conserved quantity than the troop-dues invariant above. The
          recharter sweep moves charter_fee_cents out of TROOP_DUES and into
          COUNCIL_CASH; the sum (dues_account_cents + fund_cash_cents) is unchanged
          across the transition.
        test_recipe:
          setup:
            - "READY troop with settled TROOP_DUES = 60000 (one FILLED 600u order, commission 60000)."
            - "5 registered youth and 2 cleared+trained leaders so posture is READY."
          setup_api_calls:
