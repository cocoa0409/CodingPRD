  - section: cross_cutting_complexity_layers
    instances:
      - name: confirm_stale_account_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-confirm-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - entities.Account.fields.version
        distinguishing_aspect: "After confirming order1 (Account.version advances), confirming order2 while still carrying the pre-order1 expected_account_version is rejected with ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["One account (version read once) with two DRAFT orders each holding one affordable line."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "OCC Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id, v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "OCC-1", name: "Sheet Pan", category: "SMALLWARE", taxable: true, unit_price_cents: 500, case_qty: 100, case_price_cents: 45000, pallet_case_qty: 10, pallet_price_cents: 420000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order1_id: $.data.id }
            - call: "POST /orders/${order1_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order2_id: $.data.id }
            - call: "POST /orders/${order2_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order1_id}/confirm"
              payload: { expected_account_version: "${v0}" }
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order2_id}/confirm"
              payload: { expected_account_version: "${v0}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_ACCOUNT_VERSION"
            - "PurchaseOrder.${order2_id}.lifecycle_status == DRAFT"

      - name: credit_limit_exceeded_alone_rejected
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=10]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
          - calculations.account_outstanding
        distinguishing_aspect: "An ACTIVE account with credit_limit 5000 confirming an order whose total 6480 exceeds credit_available is rejected with ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["An ACTIVE account with credit_limit 5000; a DRAFT order with a line whose total (6000 + 480 tax) exceeds available."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Cred Co", credit_terms: "NET_30", credit_limit_cents: 5000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "CR-1", name: "Reach-in", category: "SMALLWARE", taxable: true, unit_price_cents: 6000, case_qty: 100, case_price_cents: 500000, pallet_case_qty: 10, pallet_price_cents: 4500000, weight_lbs_per_unit: 5, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREDIT_LIMIT_EXCEEDED"

      - name: rma_refund_credits_account_outstanding
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ReturnAuthorization.RECEIVED_to_REFUNDED
          - calculations.account_outstanding
          - entities.Account.fields.outstanding_cents
        distinguishing_aspect: "Refunding a RECEIVED RMA (refund 850) reduces Account.outstanding_cents from 3460 to 2610 for a delivered-but-unpaid order (subtotal 2000 + tax 160 + parcel freight 1300)."
        test_recipe:
          setup: ["A delivered unpaid order (total 3460) for 2 REF units; RMA RECEIVED for 1 SEALED unit (refund 850)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Refund Co", credit_terms: "NET_30", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "REF-1", name: "Storage Bin", category: "SMALLWARE", taxable: true, unit_price_cents: 1000, case_qty: 100, case_price_cents: 90000, pallet_case_qty: 10, pallet_price_cents: 850000, weight_lbs_per_unit: 1, fulfillment_type: "STOCK", freight_type: "PARCEL", on_hand_qty: 100, par_level: 50, reorder_point: 5 }
              as: WarehouseOps
              captures: { ref_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${ref_id}", quantity: 2 }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /shipments"
              payload: { order_id: "${order_id}", carrier: "UPS" }
              as: WarehouseOps
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/book"
              payload: {}
              as: WarehouseOps
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOps
            - call: "POST /orders/${order_id}/returns"
              payload: { reason: "One damaged" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { return_id: $.data.id }
            - call: "POST /returns/${return_id}/lines"
              payload: { product_id: "${ref_id}", quantity: 1, condition: "SEALED" }
              as: Buyer
              as_user_id: "${acct_id}"
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: WarehouseOps
            - call: "POST /returns/${return_id}/receive"
              payload: {}
              as: WarehouseOps
          trigger:
            - call: "POST /returns/${return_id}/refund"
              payload: {}
              as: WarehouseOps
          assert:
            - "ReturnAuthorization.${return_id}.status == REFUNDED"
            - "ReturnAuthorization.${return_id}.refund_cents == 850"
            - "Account.${acct_id}.outstanding_cents == 2610"

