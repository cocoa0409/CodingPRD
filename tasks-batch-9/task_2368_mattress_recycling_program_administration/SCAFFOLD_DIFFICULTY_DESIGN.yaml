            - "CA program (opening reserve 5000000c, monthly cost 5000000c → coverage 1.00, recommended_rate_cents 1075)."
            - "ACTIVE FOUNDATION 900c and MATTRESS 1100c rates covering all of 2026Q4; one registrant."
            - "A 2026Q4 remittance (1001 mattress + 400 foundation units, one documented 43-unit FOUNDATION claim, one undocumented 120-unit MATTRESS claim) filed at 2027-01-10 with fee_self_assessed_cents 1271043 and paid in full; enforcement_posture still NORMAL (no audit closed)."
