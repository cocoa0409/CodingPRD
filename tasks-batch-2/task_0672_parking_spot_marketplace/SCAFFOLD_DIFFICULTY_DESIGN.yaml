              as: Anonymous
              captures: { d14: $.data.id }
            - call: "POST /drivers/${d14}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d14}"
            - call: "POST /spots"
              payload: { host_id: "${h14}", title: "S14", zone_code: "Z14", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
