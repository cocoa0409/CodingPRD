  # --- ReportDeliveryPeriod ---
  - method: GET
    path: "/report-delivery-periods/{id}"
    description: "Get one delivery period"
    roles: [PlatformAdmin, DataAcquisitionManager, PrivacyOfficer, SupplierOperator, ManufacturerClient]
    code: 200
    input: []
    output: ReportDeliveryPeriod
    side_effects: []
  - method: POST
    path: "/report-delivery-periods/{id}/close"
