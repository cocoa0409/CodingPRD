              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p_cg_id}/certifications"
              payload: { engineer_name: "Jae Kim", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p_cg_id}/certifications"
              payload: { engineer_name: "Lou Ferro", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
