              as_user_id: "${w1_id}"
            - *k_close_r1
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 5000000 }
              as: Bidder
              as_user_id: "${r_id}"
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 5000000 }
              as: Bidder
              as_user_id: "${w1_id}"
          trigger:
            - *k_complete
            - *k_lic_rural
            - call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${w1_id}" }
              as: AuctionAdmin
              captures: { lic_w1: "$.data[0].id" }
          assert:
            - "License.${lic_id} (R, first assignment bid) has frequency_block_index == 0"
            - "License.${lic_w1} (W1, second assignment bid) has frequency_block_index == 1"
            - "both assignment bids had identical amount_cents 5000000, so only created_at separates them"

  # ===========================================================================
  - section: validations
    instances:

      - name: role_denied_before_existence_returns_unauthorized
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "A Bidder publishing a plan with a BOGUS id gets ERR_UNAUTHORIZED_ROLE (priority 2) — the role check fires before anyone looks up the id, so no 404 leaks."
        test_recipe:
          setup: ["Clock at default; empty database"]
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /spectrum-auctions/band-plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/publish"
              payload: {}
              as: Bidder
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { p_err: "$.data.error_id" }
          assert:
            - "p_err == ERR_UNAUTHORIZED_ROLE with status 403 (not 404)"

      - name: existence_precedes_state_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: "An AuctionAdmin closing a BOGUS round id gets ERR_NOT_FOUND (priority 3) rather than any state-machine error — the round is never reached."
        test_recipe:
          setup: ["Clock at default; empty database"]
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "POST /spectrum-auctions/rounds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/close"
              payload: {}
              as: AuctionAdmin
              captures: { e_err: "$.data.error_id" }
          assert:
            - "e_err == ERR_NOT_FOUND with status 404"

      - name: ownership_precedes_state_returns_forbidden
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: "A disclosure PATCH by the WRONG bidder against an UNDER_REVIEW applicant (a state where PATCH is also illegal) returns ERR_FORBIDDEN_OWNERSHIP (priority 4), not ERR_APPLICANT_INVALID_STATE (priority 5)."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN; applicant R is UNDER_REVIEW; a second bidder X exists"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_review_rural
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "X Other", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "X", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { x_id: "$.data.id" }
          trigger:
            - call: "GET /spectrum-auctions/applicants/${r_id}"
              payload: {}
              as: AuctionAdmin
              captures: { r_v: "$.data.version" }
            - call: "PATCH /spectrum-auctions/applicants/${r_id}/disclosure"
              payload: { expected_applicant_version: "${r_v}", legal_name: "Hijacked" }
              as: Bidder
              as_user_id: "${x_id}"
              captures: { o_err: "$.data.error_id" }
          assert:
            - "o_err == ERR_FORBIDDEN_OWNERSHIP with status 403 (X-User-ID != Applicant.id beats the state gate)"
            - "Applicant.${r_id}.legal_name == \"Rural Wireless Co\" (untouched)"

      - name: quiet_period_freeze_blocks_clean_disclosure_patch
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_QUIET_PERIOD_VIOLATION]
        distinguishing_aspect: "Even a perfectly valid disclosure PATCH (correct version, ownership still sums to 100) is rejected during the quiet period — the freeze alone is sufficient grounds."
        test_recipe:
          setup: ["Applicant S SUBMITTED with valid ownership; auction in QUIET_PERIOD"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Sigma LLC", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "A", stake_pct: 60, holder_annual_revenue_cents: 0 }, { holder_name: "B", stake_pct: 40, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { s_id: "$.data.id", s_v: "$.data.version" }
            - *k_clock_quiet
            - *k_begin_quiet
          trigger:
            - call: "PATCH /spectrum-auctions/applicants/${s_id}/disclosure"
              payload: { expected_applicant_version: "${s_v}", legal_name: "Sigma LLC (renamed)" }
              as: Bidder
              as_user_id: "${s_id}"
              captures: { qp_err: "$.data.error_id" }
          assert:
            - "qp_err == ERR_QUIET_PERIOD_VIOLATION with status 409"
            - "Applicant.${s_id}.version == s_v (the frozen record is not mutated)"

  # ===========================================================================
  - section: errors
    instances:

      - name: ownership_sum_not_100_at_creation_returns_invalid
        claim_type: Violation → Error
        grounds:
          - errors[ERR_OWNERSHIP_TOTAL_INVALID]
        distinguishing_aspect: "Creating an applicant whose stakes sum to 90 fails at creation time with ERR_OWNERSHIP_TOTAL_INVALID (422); nothing persists."
        test_recipe:
          setup: ["Clock at default; auction APPLICATION_OPEN"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
          trigger:
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Bad Cap Table", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "A", stake_pct: 90, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { o_err: "$.data.error_id" }
          assert:
            - "o_err == ERR_OWNERSHIP_TOTAL_INVALID with status 422"
            - "GET /spectrum-auctions/auctions/${auction_id}/applicants returns an empty array"

      - name: dual_credit_claims_conflict_at_qualify
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CREDIT_CLAIM_CONFLICT]
        distinguishing_aspect: "An applicant claiming BOTH small-business and rural credits passes creation but fails QUALIFY with ERR_CREDIT_CLAIM_CONFLICT — the mutual exclusion is enforced at qualification, not registration."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN; applicant claims both credits, has paid upfront, and is UNDER_REVIEW"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Greedy Credits", claims_small_business: true, claims_rural_credit: true, own_annual_revenue_cents: 0, service_population: 100000, ownership_interests: [{ holder_name: "Sole", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { g_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${g_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${g_id}"
            - call: "POST /spectrum-auctions/applicants/${g_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
          trigger:
            - call: "POST /spectrum-auctions/applicants/${g_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
              captures: { c_err: "$.data.error_id" }
          assert:
            - "c_err == ERR_CREDIT_CLAIM_CONFLICT with status 422"
            - "Applicant.${g_id}.status == UNDER_REVIEW (failed qualify leaves the state machine in place)"

      - name: qualify_without_upfront_returns_insufficient
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INSUFFICIENT_UPFRONT]
        distinguishing_aspect: "QUALIFY with zero upfront paid (eligibility_units 0) fails with ERR_INSUFFICIENT_UPFRONT even though ownership is valid and claims are exclusive."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN; applicant UNDER_REVIEW having paid nothing"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_review_rural
          trigger:
            - call: "POST /spectrum-auctions/applicants/${r_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
              captures: { i_err: "$.data.error_id" }
          assert:
            - "i_err == ERR_INSUFFICIENT_UPFRONT with status 422"
            - "Applicant.${r_id}.eligibility_units == 0 and status == UNDER_REVIEW"

      - name: duplicate_area_code_and_category_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DUPLICATE_AREA_CODE]
          - errors[ERR_DUPLICATE_BLOCK_CATEGORY]
        distinguishing_aspect: "Uniqueness is scoped to the band plan: reusing area_code PEA002 or category CATEGORY_A within the same plan is rejected, while the same codes under a DIFFERENT plan would be legal."
        test_recipe:
          setup: ["Clock at default; DRAFT plan already holding area PEA002 and block CATEGORY_A"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
          trigger:
            - call: "POST /spectrum-auctions/license-areas"
              payload: { band_plan_id: "${plan_id}", area_code: "PEA002", name: "Dup Area", population: 1000 }
              as: AuctionAdmin
              captures: { dup_area_err: "$.data.error_id" }
            - call: "POST /spectrum-auctions/license-blocks"
              payload: { band_plan_id: "${plan_id}", category: "CATEGORY_A", mhz_size: 5, supply_per_area: 1, price_per_mhz_pop_cents: 1 }
              as: AuctionAdmin
              captures: { dup_block_err: "$.data.error_id" }
          assert:
            - "dup_area_err == ERR_DUPLICATE_AREA_CODE (409)"
            - "dup_block_err == ERR_DUPLICATE_BLOCK_CATEGORY (409)"

      - name: quiet_period_before_deadline_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_APPLICATION_DEADLINE_NOT_PASSED]
        distinguishing_aspect: "BEGIN_QUIET_PERIOD at 2026-09-01 with a 2026-09-15 deadline fails with ERR_APPLICATION_DEADLINE_NOT_PASSED; after the clock passes the deadline the same action succeeds."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN at clock 2026-09-01; deadline 2026-09-15"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
          trigger:
            - call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "BEGIN_QUIET_PERIOD" }
              as: AuctionAdmin
              captures: { early_err: "$.data.error_id" }
            - *k_clock_quiet
            - *k_begin_quiet
          assert:
            - "early_err == ERR_APPLICATION_DEADLINE_NOT_PASSED (409)"
            - "after the clock reaches 2026-09-16 the same action succeeds and status == QUIET_PERIOD"

      - name: start_clock_without_qualified_bidders_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_NO_QUALIFIED_BIDDERS]
        distinguishing_aspect: "START_CLOCK with only a SUBMITTED (never reviewed) applicant fails with ERR_NO_QUALIFIED_BIDDERS; the auction stays in QUIET_PERIOD."
        test_recipe:
          setup: ["Auction QUIET_PERIOD; one applicant SUBMITTED (never qualified)"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_clock_quiet
            - *k_begin_quiet
          trigger:
            - call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "START_CLOCK" }
              as: AuctionAdmin
              captures: { nq_err: "$.data.error_id" }
          assert:
            - "nq_err == ERR_NO_QUALIFIED_BIDDERS with status 422"
            - "Auction.${auction_id}.status == QUIET_PERIOD and current_round_number == 0"

      - name: upfront_payment_after_clock_start_returns_window_closed
        claim_type: Violation → Error
        grounds:
          - errors[ERR_UPFRONT_WINDOW_CLOSED]
        distinguishing_aspect: "Once the clock is running, further upfront payments are rejected with ERR_UPFRONT_WINDOW_CLOSED — eligibility is frozen for the duration of the auction."
        test_recipe:
          setup: ["Auction CLOCK_ACTIVE; applicant R QUALIFIED; a second applicant U SUBMITTED with 0 paid"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
            - *k_upfront_rural
            - *k_review_rural
            - *k_qualify_rural
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "U Late", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "U", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { u_id: "$.data.id" }
            - *k_clock_quiet
            - *k_begin_quiet
            - *k_start_clock
          trigger:
            - call: "POST /spectrum-auctions/applicants/${u_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${u_id}"
              captures: { uw_err: "$.data.error_id" }
          assert:
            - "uw_err == ERR_UPFRONT_WINDOW_CLOSED with status 409"
            - "Applicant.${u_id}.upfront_paid_cents == 0 and eligibility_units == 0"

      - name: withdrawal_after_quiet_period_returns_window_closed
        claim_type: Violation → Error
        grounds:
          - errors[ERR_WITHDRAWAL_WINDOW_CLOSED]
        distinguishing_aspect: "Withdrawal is only honored while APPLICATION_OPEN: the same call during QUIET_PERIOD returns ERR_WITHDRAWAL_WINDOW_CLOSED and no refund occurs."
        test_recipe:
          setup: ["Applicant S SUBMITTED with 25,000,000,000 paid; auction in QUIET_PERIOD"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "S Stuck", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "S", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { s_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${s_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${s_id}"
            - *k_clock_quiet
            - *k_begin_quiet
          trigger:
            - call: "POST /spectrum-auctions/applicants/${s_id}/withdraw"
              payload: {}
              as: Bidder
              as_user_id: "${s_id}"
              captures: { ww_err: "$.data.error_id" }
          assert:
            - "ww_err == ERR_WITHDRAWAL_WINDOW_CLOSED with status 409"
            - "Applicant.${s_id}.status == SUBMITTED and upfront_held_cents == 25000000000 (no refund escaped)"

      - name: bid_quantity_over_supply_and_duplicate_bid
        claim_type: Violation → Error
        grounds:
