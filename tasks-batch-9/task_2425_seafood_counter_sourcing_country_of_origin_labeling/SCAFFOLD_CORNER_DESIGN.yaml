              as: ChainAdmin
              captures: { supplier_one: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Coastline Wholesale", permit_number: "PERMIT-8802" }
              as: ChainAdmin
              captures: { supplier_two: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Red Snapper", scientific_name: "Lutjanus campechanus", acceptable_market_names: ["Red Snapper"], simp_covered: true, high_risk_substitution: true, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { snapper_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_a}", supplier_id: "${supplier_one}", species_id: "${snapper_id}", lot_code: "SNP-0801-D", harvest_method: "WILD_TRAP", production_method: "WILD", origin_country_code: "MX", previously_frozen: false, fresh_claim: false, received_weight_kg: 15.000, unit_cost_cents_per_kg: 2600, retail_price_cents_per_kg: 3400, cooked_retail_price_cents_per_kg: 3800 }
              as: SeafoodManager
