  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycle
        grounds:
          - state_machines.Offer.PENDING_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_SUPERSEDED
          - state_machines.Offer.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          Offer has a cycle PENDING → COUNTERED → (new PENDING) → COUNTERED → …
          → ACCEPTED; each counter increments round_number and links supersedes_offer_id.
          Cyclic negotiation loop, not a linear pipeline. Entity: Offer.
        test_recipe:
          setup:
            - "Show in CONFIRMED with hold confirmed"
            - "Agent proposes offer round 1 (PENDING); Venue counters (round 2 PENDING, round 1 COUNTERED); Agent counters again (round 3 PENDING, round 2 COUNTERED); Venue accepts round 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "NEG", agency: "A", guarantee_floor_cents: 30000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { neg_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { neg_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${neg_a}", room: "MAIN_ROOM", show_date: "2026-10-01", doors_at_utc: "2026-10-01T19:00:00Z", curfew_at_utc: "2026-10-01T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-20T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${neg_agent}"
              captures: { neg_s: $.data.id }
            - call: "POST /shows/${neg_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${neg_agent}" }
              as: BookingAgent
              as_user_id: "${neg_agent}"
              captures: { neg_h: $.data.id }
            - call: "GET /shows/${neg_s}"
              payload: {}
              as: VenueManager
              captures: { neg_v0: $.data.version }
            - call: "POST /shows/${neg_s}/date-holds/${neg_h}/confirm"
              payload: { expected_show_version: "${neg_v0}" }
              as: BookingAgent
              as_user_id: "${neg_agent}"
          trigger:
            - call: "POST /shows/${neg_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 80000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 5000, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${neg_agent}"
              captures: { r1_id: $.data.id, r1_round: $.data.round_number }
            - call: "POST /shows/${neg_s}/offers/${r1_id}/counter"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 70000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 5000, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: VenueManager
              captures: { r2_id: $.data.id, r2_round: $.data.round_number, r2_supersedes: $.data.supersedes_offer_id }
            - call: "POST /shows/${neg_s}/offers/${r2_id}/counter"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 75000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 5000, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${neg_agent}"
              captures: { r3_id: $.data.id, r3_round: $.data.round_number, r3_supersedes: $.data.supersedes_offer_id }
            - call: "GET /shows/${neg_s}"
              payload: {}
              as: VenueManager
              captures: { neg_v_pre_accept: $.data.version }
            - call: "POST /shows/${neg_s}/offers/${r3_id}/accept"
              payload: { expected_show_version: "${neg_v_pre_accept}" }
              as: VenueManager
              captures: { deal_guarantee: $.data.guarantee_cents }
          assert:
            - "Offer.${r1_id}.status == COUNTERED"
            - "Offer.${r2_id}.status == COUNTERED"
            - "Offer.${r3_id}.status == ACCEPTED"
            - "Offer.${r1_id}.round_number == 1; Offer.${r2_id}.round_number == 2; Offer.${r3_id}.round_number == 3"
            - "Offer.${r2_id}.supersedes_offer_id == ${r1_id}"
            - "Offer.${r3_id}.supersedes_offer_id == ${r2_id}"
            - "Deal.guarantee_cents == 75000  # round 3 accepted"

      - name: show_parallel_dimension_hold_and_deposit
        grounds:
          - state_machines.Show
          - state_machines.DateHold
          - entities.Show.fields.deposit_paid_cents
        distinguishing_aspect: |
          DateHold (ACTIVE→CHALLENGED→CONFIRMED branch structure) and the
          deposit-paid axis on Show (deposit_paid_cents vs deposit_required_cents)
          evolve as parallel dimensions: a Show can be CONFIRMED yet blocked from
          ON_SALE because the deposit axis has not caught up. Two independent
          state dimensions gating the same entity. Entity: Show (distinct from Offer).
        test_recipe:
          setup:
            - "Show CONFIRMED via P1 hold; offer accepted with deposit_required=25000"
            - "Only 10000 deposit paid (partial); show.status remains CONFIRMED and on-sale is blocked"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "PD", agency: "A", guarantee_floor_cents: 50000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { pd_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { pd_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${pd_a}", room: "MAIN_ROOM", show_date: "2026-10-05", doors_at_utc: "2026-10-05T19:00:00Z", curfew_at_utc: "2026-10-05T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${pd_agent}"
              captures: { pd_s: $.data.id }
            - call: "POST /shows/${pd_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${pd_agent}" }
              as: BookingAgent
              as_user_id: "${pd_agent}"
              captures: { pd_h: $.data.id }
            - call: "GET /shows/${pd_s}"
              payload: {}
              as: VenueManager
              captures: { pd_v0: $.data.version }
            - call: "POST /shows/${pd_s}/date-holds/${pd_h}/confirm"
              payload: { expected_show_version: "${pd_v0}" }
              as: BookingAgent
              as_user_id: "${pd_agent}"
            - call: "POST /shows/${pd_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 100000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 0, bar_split_pct: 0.10, merch_split_pct: 0.20 }
              as: BookingAgent
              as_user_id: "${pd_agent}"
              captures: { pd_o: $.data.id }
            - call: "GET /shows/${pd_s}"
              payload: {}
              as: VenueManager
              captures: { pd_v1: $.data.version }
            - call: "POST /shows/${pd_s}/offers/${pd_o}/accept"
              payload: { expected_show_version: "${pd_v1}" }
              as: VenueManager
            # Partial deposit 10000 (required 25000)
            - call: "POST /shows/${pd_s}/wire-transfers"
              payload: { purpose: "ARTIST_DEPOSIT", amount_cents: 10000, recipient_artist_id: "${pd_a}", support_act_id: "", settlement_id: "" }
              as: Accountant
              captures: { pd_dep: $.data.id }
            - call: "POST /shows/${pd_s}/wire-transfers/${pd_dep}/complete"
              payload: {}
              as: Accountant
            - call: "POST /shows/${pd_s}/ticket-tiers"
              payload: { tier_name: "GA", face_price_cents: 2000, capacity: 500, tier_order: 1 }
              as: Promoter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:01Z" }
              as: VenueManager
            - call: "GET /shows/${pd_s}"
              payload: {}
              as: Promoter
              captures: { pd_v_pre: $.data.version, pd_deposit_paid: $.data.deposit_paid_cents, pd_deposit_required: $.data.deposit_required_cents }
          trigger:
            - call: "POST /shows/${pd_s}/on-sale"
              payload: { expected_show_version: "${pd_v_pre}" }
              as: Promoter
              captures: { pd_err: $.data.error_id }
          assert:
            - "Show.${pd_s}.status == CONFIRMED (date-hold axis reached CONFIRMED)"
            - "Show.${pd_s}.deposit_paid_cents == 10000"
            - "Show.${pd_s}.deposit_required_cents == 25000"
            - "on-sale call returns ERR_DEPOSIT_NOT_CLEARED (deposit axis not satisfied)"
            - "Show.${pd_s}.status remains CONFIRMED after failed on-sale"

  # ==========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: hold_confirm_releases_competing_holds
        grounds:
          - state_machines.DateHold.ACTIVE_to_CONFIRMED
          - state_machines.DateHold.CHALLENGED_to_CONFIRMED
          - state_machines.Show.HOLD_PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Depth-3 cascade originating from DateHold confirm:
          (1) DateHold.confirm → DateHold.status=CONFIRMED; (2) that triggers
          Show.status HOLD_PENDING→CONFIRMED and show.hold_priority update;
          (3) that triggers all other DateHolds on same (room, show_date) → RELEASED.
          Trigger: POST /shows/{id}/date-holds/{hid}/confirm.
        test_recipe:
          setup:
            - "Three Shows on MAIN_ROOM 2026-10-10 (S_a, S_b, S_c), each with its own P1 DateHold placed by the same agent"
            - "Confirm hold on S_a; verify S_b and S_c holds auto-release"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "CC", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { cc_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { cc_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${cc_a}", room: "MAIN_ROOM", show_date: "2026-10-10", doors_at_utc: "2026-10-10T19:00:00Z", curfew_at_utc: "2026-10-10T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-20T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${cc_agent}"
              captures: { cc_sa: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${cc_a}", room: "MAIN_ROOM", show_date: "2026-10-10", doors_at_utc: "2026-10-10T19:00:00Z", curfew_at_utc: "2026-10-10T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-20T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${cc_agent}"
              captures: { cc_sb: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${cc_a}", room: "MAIN_ROOM", show_date: "2026-10-10", doors_at_utc: "2026-10-10T19:00:00Z", curfew_at_utc: "2026-10-10T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-20T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${cc_agent}"
              captures: { cc_sc: $.data.id }
            - call: "POST /shows/${cc_sa}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${cc_agent}" }
              as: BookingAgent
              as_user_id: "${cc_agent}"
              captures: { cc_ha: $.data.id }
            - call: "POST /shows/${cc_sb}/date-holds"
              payload: { priority: "P2", booked_by_agent_id: "${cc_agent}" }
              as: BookingAgent
              as_user_id: "${cc_agent}"
              captures: { cc_hb: $.data.id }
            - call: "POST /shows/${cc_sc}/date-holds"
              payload: { priority: "COURTESY", booked_by_agent_id: "${cc_agent}" }
              as: BookingAgent
              as_user_id: "${cc_agent}"
              captures: { cc_hc: $.data.id }
            - call: "GET /shows/${cc_sa}"
              payload: {}
              as: VenueManager
              captures: { cc_va: $.data.version }
          trigger:
            - call: "POST /shows/${cc_sa}/date-holds/${cc_ha}/confirm"
              payload: { expected_show_version: "${cc_va}" }
              as: BookingAgent
              as_user_id: "${cc_agent}"
          assert:
            - "DateHold.${cc_ha}.status == CONFIRMED  # link 1"
            - "Show.${cc_sa}.status == CONFIRMED; Show.${cc_sa}.hold_priority == P1  # link 2"
            - "DateHold.${cc_hb}.status == RELEASED  # link 3 cascade"
            - "DateHold.${cc_hc}.status == RELEASED  # link 3 cascade"
            - "Show.${cc_sb}.status == HOLD_PENDING (its own hold released but show unchanged)"
            - "Show.${cc_sc}.status == HOLD_PENDING"

      - name: cancel_refunds_tickets_and_cancels_supports
        grounds:
          - state_machines.Show.ON_SALE_to_CANCELLED
          - state_machines.SupportAct.CONFIRMED_to_CANCELLED
          - state_machines.WireTransfer
        distinguishing_aspect: |
          Depth-3 cascade originating from Show cancel:
          (1) Show cancel → all non-refunded TicketSales refund_status → REFUNDED
          (which recomputes Show.tickets_sold and Show.gross_ticket_revenue_cents);
          (2) Show cancel → each CONFIRMED SupportAct → CANCELLED; (3) each
          SupportAct cancellation creates a SUPPORT_BUYOUT WireTransfer.
          Trigger: POST /shows/{id}/cancel — distinct from Rule 4 instance 1.
        test_recipe:
          setup:
            - "Show ON_SALE with 10 tickets sold (gross=20000), one CONFIRMED SupportAct agreed_fee=8000 buyout=6000"
            - "Cancel by VenueManager reason=VENUE"
          setup_api_calls:
