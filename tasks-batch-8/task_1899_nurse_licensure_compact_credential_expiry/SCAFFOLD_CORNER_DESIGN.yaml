        claim_type: retrieval
        grounds:
          - "entities.StateLicense"
          - "endpoints"
        distinguishing_aspect: "GET by id returns every persisted input field verbatim plus the system fields (status DRAFT, created_by_user_id from X-User-ID)."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse with one DRAFT license."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
