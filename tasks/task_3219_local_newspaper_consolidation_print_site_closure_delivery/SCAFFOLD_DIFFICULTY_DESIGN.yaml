  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: dock_loading_window_half_open_adjacency
        grounds:
          - validations[priority=21]
          - entities.PrintSite.fields.loading_slot_minutes
          - entities.PrintSite.fields.max_concurrent_departures
          - errors[ERR_DOCK_SLOT_CONFLICT]
        distinguishing_aspect: "This overlap rule uses half-open interval semantics with a per-departure loading buffer: two windows that merely touch at 01:30 do not conflict, while a window opening inside the previous one does, and the rule counts occupied occupancy slots against max_concurrent_departures rather than against a single exclusive reservation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT with loading_slot_minutes 30 and max_concurrent_departures 2, region North, market Riverton, and one route dispatching at 01:00."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "KOT", press_units: 2, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PRIORITY", distinct_shifts_per_night: 4, loading_slot_minutes: 30 }
              as: PrintOperationsDirector
              captures: { site_kot_id: $.data.id }
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
          trigger:
            - call: "POST /regional-news-ops/print-sites/${site_kot_id}/routes"
              payload: { destination_market_id: "${mkt_riv_id}", transit_minutes: 130, dispatch_cutoff_utc: "01:15", is_direct_hop: true, buffer_minutes: 45 }
              as: PrintOperationsDirector
              captures: { second_ok: $.data.id }
            - call: "POST /regional-news-ops/print-sites/${site_kot_id}/routes"
              payload: { destination_market_id: "${mkt_riv_id}", transit_minutes: 140, dispatch_cutoff_utc: "01:20", is_direct_hop: true, buffer_minutes: 45 }
              as: PrintOperationsDirector
              captures: { third_err: $.data.error_id }
          assert:
            - "a second overlapping departure is accepted while max_concurrent_departures is 2"
            - "a third overlapping departure is rejected with error_id == ERR_DOCK_SLOT_CONFLICT"
            - "the rejection http status == 409"

      - name: delivery_stop_pause_window_inclusive_aggregate_capacity
        grounds:
          - validations[priority=14]
          - validations[priority=13]
          - entities.DeliveryStop.fields.pause_window_days
          - entities.DeliveryRoute.fields.stop_capacity
        distinguishing_aspect: "This overlap rule uses a different interval semantic on a different resource: the stop pause window is closed-inclusive on both ends (pause_window_days counts end minus start plus one), and the overlapping resource is the route's aggregate stop capacity, which counts paused stops against the ceiling while terminated stops are excluded."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT, region North, market Riverton, contractor Cedar Hill and delivery route R1 with stop_capacity 3."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - *t_contractor_cedar
            - call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/routes"
              payload: { print_market_id: "${mkt_riv_id}", route_code: "R1", stop_capacity: 3, per_stop_fee_cents: 1150, dist_per_stop_miles: 3.0, cost_per_copy_ceiling_cents: 600, printed_copies_surcharge_cents: 0, cost_run_date: "2026-09-10" }
              as: DeliveryNetworkManager
              captures: { droute_r1_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-routes/${droute_r1_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { stop_s1_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-routes/${droute_r1_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S2", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { stop_s2_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-routes/${droute_r1_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S3", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { stop_s3_id: $.data.id }
          trigger:
            - call: "POST /regional-news-ops/delivery-routes/${droute_r1_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S4", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { cap_err: $.data.error_id }
            - call: "POST /regional-news-ops/delivery-stops/${stop_s3_id}/terminate"
              payload: {}
              as: DeliveryNetworkManager
              captures: { s3_status: $.data.status }
            - call: "POST /regional-news-ops/delivery-routes/${droute_r1_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S4", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { s4_id: $.data.id }
          assert:
            - "the fourth stop is refused with error_id == ERR_STOP_CAPACITY_EXCEEDED while three non-terminated stops occupy a capacity of 3"
            - "DeliveryStop S1 pause_window_days == 5 for the inclusive window 2026-10-05..2026-10-09"
            - "after S3 is terminated the fourth stop is accepted, because terminated stops no longer count against the aggregate capacity"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: transfer_ledger_credit_restores_zero_net
        grounds:
          - calculations.print_site_transfer_cost
          - entities.PrintMarket.fields.print_site_transfer_cost_cents
          - entities.PrintMarket.fields.print_site_transfer_credit_cents
          - entities.PrintMarket.fields.net_print_site_transfer_cost_cents
        distinguishing_aspect: "The conserved quantity is the market's net print-site transfer cost: the forward action posts a positive transfer cost and its compensating withdrawal posts a credit exactly equal and opposite, so the named quantity returns to exactly 0.00 and not merely to a small residual."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT, region North, market Riverton (floor 8000), route KOT->Riverton, contractor Cedar Hill with route R1 and a stop, and a 40000-copy edition; the contractor is then terminated so the delivery boycott is active."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - *t_contractor_cedar
            - *t_droute_riv
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
            - call: "GET /regional-news-ops/region-hubs/${hub_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { hub_v1: $.data.version }
            - *t_plan_riv
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/editions"
              payload: { assigned_print_site_id: "${site_kot_id}", slug: "2026-09-21", page_count: 12, requested_print_run_copies: 40000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/terminate"
              payload: {}
              as: DeliveryNetworkManager
          trigger:
            - call: "GET /regional-news-ops/print-markets/${mkt_riv_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { net_before: $.data.net_print_site_transfer_cost_cents, cost_before: $.data.print_site_transfer_cost_cents }
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/withdraw"
              payload: {}
              as: PrintOperationsDirector
              captures: { cost_after: $.data.print_site_transfer_cost_cents, credit_after: $.data.print_site_transfer_credit_cents, net_after: $.data.net_print_site_transfer_cost_cents }
          assert:
            - "PrintMarket Riverton net_print_site_transfer_cost_cents == 92.00 before the compensating withdrawal"
            - "PrintMarket Riverton print_site_transfer_credit_cents == -92.00 exactly, the precise negation of the forward cost"
            - "PrintMarket Riverton net_print_site_transfer_cost_cents == 0.00 after the compensating withdrawal"
            - "PrintMarket Riverton transfer_cost_disputed == false, so no drift survives the compensation"

      - name: subscriber_exit_credit_returns_the_same_quantity_it_charged
        grounds:
          - calculations.subscriber_digital_migration_credit
          - state_machines.SubscriberContract.transitions.active_to_churned_pending_retention
          - state_machines.SubscriberContract.transitions.churned_pending_retention_to_active
          - entities.SubscriberContract.fields.churn_retention_credit_cents
        distinguishing_aspect: "The conserved quantity here is the subscriber's retention credit rather than a market ledger: a contract that enters the retention branch and is returned to active by accepting the offer ends with the same churn_retention_credit_cents it was granted on entry, so the round trip does not accumulate credit."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT, region North, market Riverton, route, contractor Cedar Hill, delivery route R1 with one stop, one subscriber SUB-ROUND with 40 remaining issues, and one open retention offer seeded by terminating the stop."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - *t_contractor_cedar
            - *t_droute_riv
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { stop_riv_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-stops/${stop_riv_id}/subscribers"
              payload: { subscriber_ref: "SUB-ROUND", remaining_print_issues: 40, paid_through_utc: "2027-06-01T00:00:00Z", print_issue_value_cents: 1200 }
              as: CustomerService
              captures: { sub_round_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-stops/${stop_riv_id}/terminate"
              payload: {}
              as: DeliveryNetworkManager
          trigger:
            - call: "GET /regional-news-ops/subscribers/${sub_round_id}"
              payload: {}
              as: CustomerService
              captures: { credit_entry: $.data.churn_retention_credit_cents, status_entry: $.data.status }
            - call: "POST /regional-news-ops/subscribers/${sub_round_id}/accept-retention-offer"
              payload: {}
              as: CustomerService
              captures: { status_returned: $.data.status, credit_returned: $.data.churn_retention_credit_cents }
          assert:
            - "SubscriberContract SUB-ROUND status == churned_pending_retention with churn_retention_credit_cents == 5000 on entry"
            - "the accepted retention offer returns status to active"
            - "SubscriberContract SUB-ROUND churn_retention_credit_cents == 5000 after the round trip, so the credit quantity is unchanged by the compensation"
            - "no second credit is added on the return leg"

