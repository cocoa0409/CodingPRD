              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9006", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
          trigger:
            - call: "POST /invoices/${inv_id}/approve"
              payload: { tier: 1 }
              as: APManager
              as_user_id: "u-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403): role APManager != TIER_ROLE[1]"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_vendor_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[vendor-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH carries expected_vendor_version: after a first successful PATCH bumps version 1->2, replaying the same observed version yields 412 ERR_STALE_VERSION; re-reading and retrying succeeds."
        test_recipe:
          setup: ["Vendor DRAFT created (version 1 captured)"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Occ Olive", tax_id: "20-0000058", remit_email: "ap@oo3.com", phone: "+1-555-2063", address_line1: "89 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id, v_ver: $.data.version }
          trigger:
            - { call: "PATCH /vendors/${v_id}", payload: { phone: "+1-555-7000", expected_vendor_version: "${v_ver}" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - call: "PATCH /vendors/${v_id}"
              payload: { city: "Shelbyville", expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { err: $.data.error_id }
            - { call: "GET /vendors/${v_id}", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { v_ver2: $.data.version } }
            - { call: "PATCH /vendors/${v_id}", payload: { city: "Shelbyville", expected_vendor_version: "${v_ver2}" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
          assert:
            - "Second PATCH with the stale captured version: error_id == ERR_STALE_VERSION (412), city unchanged"
            - "Retry with the re-read version (2): 200, city == Shelbyville, version == 3"

      - name: occ_vendor_merge_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[vendor-merge-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Merge is create-with-supersede on the survivor: a first merge legitimately advances the survivor's version, so a second merge still carrying the pre-merge observation is refused with 412."
        test_recipe:
          setup: ["Survivor ACTIVE (version captured at 3); two DRAFT duplicates"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Merge Hub", tax_id: "20-0000059", remit_email: "ap@mh.com", phone: "+1-555-2064", address_line1: "90 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { surv: $.data.id }
            - { call: "POST /vendors/${surv}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${surv}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${surv}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { surv_ver: $.data.version } }
            - call: "POST /vendors"
              payload: { legal_name: "Zephyr Receivables One", tax_id: "20-0000060", remit_email: "ap@mha.com", phone: "+1-555-2065", address_line1: "91 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { dup_a: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Quantum Receivables Two", tax_id: "20-0000061", remit_email: "ap@mhb.com", phone: "+1-555-2066", address_line1: "92 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { dup_b: $.data.id }
          trigger:
            - { call: "POST /vendors/${surv}/merge", payload: { duplicate_vendor_id: "${dup_a}", expected_vendor_version: "${surv_ver}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - call: "POST /vendors/${surv}/merge"
              payload: { duplicate_vendor_id: "${dup_b}", expected_vendor_version: "${surv_ver}" }
              as: VendorManager
              as_user_id: "u-vm-01"
              captures: { err: $.data.error_id }
            - { call: "GET /vendors/${surv}", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { surv_ver2: $.data.version } }
            - { call: "POST /vendors/${surv}/merge", payload: { duplicate_vendor_id: "${dup_b}", expected_vendor_version: "${surv_ver2}" }, as: VendorManager, as_user_id: "u-vm-01" }
          assert:
            - "Merge A succeeds (survivor version 3 -> 4); merge B with the stale version: error_id == ERR_STALE_VERSION (412), dup_b stays DRAFT"
            - "Merge B retried with the fresh version: 200, dup_b MERGED"

      - name: occ_bank_account_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bank-account-create-stale-vendor]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Bank-account creation is OCC-guarded on the vendor: a PATCH that lands between the client's read and its account-create makes the create fail 412."
        test_recipe:
          setup: ["Vendor DRAFT; client holds version 1; a PATCH bumps it to 2"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Occ Bank Co", tax_id: "20-0000062", remit_email: "ap@ob.com", phone: "+1-555-2067", address_line1: "93 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - { call: "PATCH /vendors/${v_id}", payload: { phone: "+1-555-7001", expected_vendor_version: "${v_ver}" }, as: VendorSpecialist, as_user_id: "u-vs-02" }
          trigger:
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000999111777", routing_number: "021000021", account_holder_name: "Occ Bank Co", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412); no VendorBankAccount and no CallbackVerification persisted"

      - name: ops_run_sweep_idempotent_second_run_noop
        claim_type: ops_run_checkpoint
        grounds: ["calculations.dormancy_evaluation", "endpoints.\"POST /vendor-sweeps/run\""]
        distinguishing_aspect: "The sweep is an epoch checkpoint: a second run at the same logical instant transitions nothing — all four counters are 0."
        test_recipe:
          setup: ["Vendor approved 2026-01-01 (dormancy-eligible at the 2026-08-01 sweep)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Idle Ibis", tax_id: "20-0000063", remit_email: "ap@ii2.com", phone: "+1-555-2068", address_line1: "94 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2025-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
          trigger:
            - { call: "POST /vendor-sweeps/run", payload: {}, as: SystemAdmin, as_user_id: "u-sys-01", captures: { s1: "$.data.vendors_marked_dormant" } }
            - { call: "POST /vendor-sweeps/run", payload: {}, as: SystemAdmin, as_user_id: "u-sys-01" }
          assert:
            - "First sweep: vendors_marked_dormant == 1"
            - "Second sweep at the same clock: all counters == 0 (no double-transition, no drift)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the PATCH response itself carries the new field values and the incremented version, and a subsequent GET agrees — no eventual lag anywhere in the surface."
        test_recipe:
          setup: ["Vendor DRAFT"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Consistent Crane", tax_id: "20-0000064", remit_email: "ap@cc4.com", phone: "+1-555-2069", address_line1: "95 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id, v_ver: $.data.version }
          trigger:
            - { call: "PATCH /vendors/${v_id}", payload: { remit_email: "new@cc4.com", expected_vendor_version: "${v_ver}" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "GET /vendors/${v_id}", payload: {}, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "PATCH response: remit_email == new@cc4.com, version == 2, updated_at refreshed"
            - "GET: identical remit_email and version (same values, same request sequence, no lag)"
