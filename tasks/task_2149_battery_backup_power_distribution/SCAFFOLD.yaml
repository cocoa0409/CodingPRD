    side_effects: ["status initialised to SUBMITTED; months_in_service and credit_cents stay 0 until adjudication"]

  - method: GET
    path: "/distribution/warranty-claims/{warrantyClaimId}"
    description: "Read one warranty claim."
    roles: [PlatformAdmin, SalesRep, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/distribution/warranty-claims"
    description: "List warranty claims with FK and status filters."
    roles: [PlatformAdmin, SalesRep, ComplianceOfficer, Customer]
    code: 200
    input: ["account_id?", "battery_model_id?", "replacement_order_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/distribution/warranty-claims/{warrantyClaimId}/adjudicate"
    description: "Three-way fork on the computed months_in_service."
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["runs warranty_prorata_credit writing months_in_service, coverage_band and credit_cents", "status -> APPROVED_FREE, APPROVED_PRORATA or DENIED"]

  - method: POST
    path: "/distribution/warranty-claims/{warrantyClaimId}/settle"
    description: "Settle an approved claim either as account credit or as a synthesized replacement order."
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: [settlement_mode, "replacement_warehouse_id?"]
    output: WarrantyClaim
