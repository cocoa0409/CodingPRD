            - "both list queries return exactly SiteBooking.${booking_id} with total_count == 1, so the association is reachable from either side of the link"
            - "HostSchool.${school_id}.booked_block_count == 1 — the two rejected calls never incremented it"

      - name: screening_expiry_is_derived_as_decided_on_plus_365_days
        claim_type: computed_read
        grounds:
          - entities.Volunteer.fields.screening_expires_on
          - state_machines.Volunteer.PENDING_to_CLEARED.side_effects
        distinguishing_aspect: "screening_expires_on is decided_on + 365 CALENDAR days, not 'the same date next year': a decision on 2026-08-01 expires 2027-08-01, while a decision on 2027-06-12 expires 2028-06-11 because the 365-day window is swallowed by the 2028 leap day. A REJECTED decision must leave the field null."
        test_recipe:
          setup: ["Two PENDING volunteers exist; the clock starts at its 2026-08-01 default."]
          setup_api_calls:
            - call: "POST /volunteers"
              payload: { full_name: "Rosa Cook", email: "rosa@corps.test", role_type: "COOK" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
              captures: { early_volunteer_id: "$.data.id" }
            - call: "POST /volunteers"
              payload: { full_name: "Casey Guard", email: "casey@corps.test", role_type: "CHAPERONE" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
              captures: { leap_volunteer_id: "$.data.id" }
            - call: "POST /volunteers"
              payload: { full_name: "Nate Barred", email: "nate@corps.test", role_type: "CHAPERONE" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
              captures: { rejected_volunteer_id: "$.data.id" }
          trigger:
            - call: "POST /volunteers/${early_volunteer_id}/screening-decision"
              payload: { decision: "CLEAR", decided_on: "2026-08-01" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
            - call: "POST /volunteers/${rejected_volunteer_id}/screening-decision"
              payload: { decision: "REJECT", decided_on: "2026-08-01" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-12T00:00:00Z" }
              as: VolunteerScreener
            - call: "POST /volunteers/${leap_volunteer_id}/screening-decision"
              payload: { decision: "CLEAR", decided_on: "2027-06-12" }
              as: VolunteerScreener
              as_user_id: "scr-remy"
            - call: "GET /volunteers/${leap_volunteer_id}"
              as: TourManager
          assert:
            - "Volunteer.${early_volunteer_id}.screening_status == CLEARED with screening_decided_on == 2026-08-01 and screening_expires_on == 2027-08-01"
            - "Volunteer.${leap_volunteer_id}.screening_expires_on == 2028-06-11 — 365 days after 2027-06-12 lands one day short of the anniversary because 2028-02-29 exists"
            - "Volunteer.${rejected_volunteer_id}.screening_status == REJECTED with screening_decided_on == 2026-08-01 and screening_expires_on == null"
            - "every cleared or rejected volunteer carries screened_by_user_id == scr-remy taken from the X-User-ID header, never from the body"
            - "the GET returns the same derived expiry as the decision response, so the field is stored rather than recomputed per read"

