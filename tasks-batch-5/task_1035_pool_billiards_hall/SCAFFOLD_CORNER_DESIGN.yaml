  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_member_plan_change_success_increments_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[member-plan-change-stale]", entities.Member.fields.version, endpoints]
        distinguishing_aspect: "A plan-change carrying the member's current version succeeds, applies the GOLD upgrade immediately (plan_id=GOLD), and increments Member.version to 2."
        test_recipe:
          setup: ["SILVER and GOLD plans; a member on SILVER at version 1."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "SILVER", monthly_fee_cents: 5000, table_discount_pct: 0.10 }
              as: Manager
              captures: { ocs: "$.data.id" }
            - call: "POST /v1/plans"
              payload: { tier: "GOLD", monthly_fee_cents: 8000, table_discount_pct: 0.20 }
              as: Manager
              captures: { ocg: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "oc1@x.com", full_name: "OC One", plan_id: "${ocs}" }
              as: Manager
              captures: { ocm: "$.data.id", ocv: "$.data.version" }
          trigger:
            - call: "POST /v1/members/${ocm}/plan-change"
              payload: { target_plan_id: "${ocg}", expected_member_version: "${ocv}" }
              as: Member
              as_user_id: "${ocm}"
          assert:
            - "Member.${ocm}.plan_id == ${ocg}"
            - "Member.${ocm}.version == 2"

      - name: occ_member_plan_change_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[member-plan-change-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A plan-change carrying version 1 after a wallet adjustment already advanced the member to version 2 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["SILVER and GOLD plans; member created (version 1) then a wallet adjustment bumps it to version 2."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "SILVER", monthly_fee_cents: 5000, table_discount_pct: 0.10 }
              as: Manager
              captures: { ocss: "$.data.id" }
            - call: "POST /v1/plans"
              payload: { tier: "GOLD", monthly_fee_cents: 8000, table_discount_pct: 0.20 }
              as: Manager
              captures: { ocsg: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "oc2@x.com", full_name: "OC Two", plan_id: "${ocss}" }
              as: Manager
              captures: { ocsm: "$.data.id", ocsv0: "$.data.version" }
            - call: "POST /v1/members/${ocsm}/wallet/adjustments"
              payload: { amount_cents: 5000 }
              as: Manager
          trigger:
            - call: "POST /v1/members/${ocsm}/plan-change"
              payload: { target_plan_id: "${ocsg}", expected_member_version: "${ocsv0}" }
              as: Member
              as_user_id: "${ocsm}"
              captures: { eocs: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_STALE_VERSION"
            - "trigger response HTTP status == 412"

      - name: occ_reservation_reschedule_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-reschedule-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A reschedule carrying the reservation's create-time version (1) after a confirm advanced it to version 2 is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A reservation created (version 1) then confirmed (version 2)."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { orp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "or1@x.com", full_name: "OR One", plan_id: "${orp}" }
              as: Manager
              captures: { orm: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 47, table_type: "POOL_9FT", seat_capacity: 6, hourly_rate_cents: 1200 }
              as: Manager
              captures: { ort: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${orm}", table_id: "${ort}", start_at: "2026-07-12T10:00:00Z", end_at: "2026-07-12T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { orr: "$.data.id", orv0: "$.data.version" }
            - call: "POST /v1/reservations/${orr}/confirm"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /v1/reservations/${orr}/reschedule"
              payload: { start_at: "2026-07-12T13:00:00Z", end_at: "2026-07-12T14:00:00Z", expected_reservation_version: "${orv0}" }
              as: FrontDesk
              captures: { eor: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_STALE_VERSION"

