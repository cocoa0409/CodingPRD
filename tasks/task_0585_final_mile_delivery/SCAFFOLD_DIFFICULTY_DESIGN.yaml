  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: window_requires_active_team
        grounds:
          - state_machines.DeliveryOrder.CREATED_to_SCHEDULED
          - validations[priority=9]
          - entities.DeliveryTeam.fields.status
        distinguishing_aspect: |
          A DeliveryOrder's CREATED->SCHEDULED window reservation depends on the referenced
          DeliveryTeam's state (Order->Team pair): reserving against an OUT_OF_SERVICE team is
          rejected with ERR_TEAM_OUT_OF_SERVICE (409).
        test_recipe:
          setup:
            - "One OUT_OF_SERVICE team in region CA, a CA customer, and a fresh CREATED THRESHOLD order (version 1)."
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot A", region_code: "CA" }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /delivery-teams"
              payload: { depot_id: "${depot_id}", team_name: "T1", lead_name: "Lee", member2_name: "Max", region_code: "CA", max_daily_stops: 10, max_daily_weight_lbs: 500, max_daily_volume_cuft: 1000, status: "OUT_OF_SERVICE" }
              as: PlatformAdmin
