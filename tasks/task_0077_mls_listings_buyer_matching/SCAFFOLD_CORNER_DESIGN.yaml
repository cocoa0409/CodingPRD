        grounds: ["concurrency_rules[offer-accept-stale-listing]", "errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: transitive_cascade / accept_offer_three_hop_cascade
          rationale: "OCC stale-version on accept is the negative companion of the accept cascade; the positive accept path is exercised there and the OCC dynamic-version requirement is lint-enforced."
      - name: dual_agency_forbidden_422
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUAL_AGENCY_FORBIDDEN]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dual_agency_safety_beats_budget_constraint
          rationale: "ERR_DUAL_AGENCY_FORBIDDEN is asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: not_your_turn_on_counter_409
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_NOT_YOUR_TURN]"]
        distinguishing_aspect: "The buyer side countering when current_party==SELLER (fresh OPEN offer) returns ERR_NOT_YOUR_TURN (409)."
