# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Driveway Sealcoating & Asphalt Maintenance Service
# Nine Difficulty Rules x 2 instances each = 18 instances.
# All formula-derived assert values were pre-computed from §1.3 constants.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_final_invoice_pricing
        grounds:
          - calculations.job_pricing
          - calculations.invoice_settlement
        distinguishing_aspect: |
          Money domain: the same job priced twice — provisional on assessment
          snapshots (Quote.total_cents == 50300) vs final on crew actuals
          (Invoice.total_cents == 56922) — the two variants of the same rate
          structure produce different money for the same WorkOrder.
        test_recipe:
          setup:
            - "Commercial customer/property; assessment area 1200 sqft, crack 40 ft, pothole area 10 sqft, oil 5, slope NONE (PCI 80)"
            - "STANDARD material (coverage 80, price 900c/gal, cure 48h, warranty 12mo, reapply 24mo); lot delivered 100 gal (threshold 15)"
            - "Crew capacity 8000; published route sheet 2026-08-10; passing forecast for 2026-08-10"
            - "Quote (crack+patch+seal, 1 coat) accepted; work order scheduled 2026-08-10 07:00-11:00; displacement CLEARED"
            - "Work started and finished with actuals area 1250, crack 44, pothole 12, gallons 17; clock advanced past cure"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Acme Parking LLC", customer_type: "COMMERCIAL", email: "ops@acme.example", phone: "555-0100" }, as: OfficeAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${cust_id}", address: "100 Commerce Way", lot_kind: "COMMERCIAL_LOT" }, as: OfficeAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${prop_id}", measured_area_sqft: 1200, crack_linear_ft: 40, pothole_count: 2, pothole_area_sqft: 10, oil_spot_area_sqft: 5, slope_severity: "NONE" }, as: Estimator, captures: { asm_id: "$.data.id" } }
            - { call: "POST /api/assessments/${asm_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "POST /api/material-lots", payload: { material_id: "${mat_id}", delivered_gallons: 100, unit_cost_cents: 1500, received_on: "2026-07-15", reorder_threshold_gallons: 15 }, as: OfficeAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/crews", payload: { crew_name: "Crew Alpha", home_zone: "North", daily_capacity_sqft: 8000 }, as: OfficeAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-10" }, as: Dispatcher, captures: { sheet_id: "$.data.id" } }
            - { call: "POST /api/route-sheets/${sheet_id}/publish", payload: {}, as: Dispatcher }
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-10", min_temp_f: 65, max_temp_f: 82, precip_probability_pct: 10, precipitation_mm: 0, source: "FORECAST" }, as: Dispatcher }
            - { call: "GET /api/properties/${prop_id}", payload: {}, as: OfficeAdmin, captures: { prop_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${prop_id}", assessment_id: "${asm_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${prop_v}" }, as: Estimator, captures: { quote_id: "$.data.id", quote_total: "$.data.total_cents" } }
            - { call: "POST /api/quotes/${quote_id}/send", payload: {}, as: Estimator }
            - { call: "POST /api/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/work-orders?quote_id=${quote_id}", payload: {}, as: Dispatcher, captures: { wo_id: "$.data[0].id" } }
            - { call: "POST /api/work-orders/${wo_id}/schedule", payload: { route_sheet_id: "${sheet_id}", material_lot_id: "${lot_id}", scheduled_date: "2026-08-10", window_start_hour: 7, window_end_hour: 11, drive_minutes_est: 20, vehicles_to_move: 3 }, as: Dispatcher }
            - { call: "GET /api/displacement-plans?work_order_id=${wo_id}", payload: {}, as: Dispatcher, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /api/displacement-plans/${plan_id}/send-notice", payload: {}, as: Dispatcher }
            - { call: "POST /api/displacement-plans/${plan_id}/confirm-cleared", payload: {}, as: Dispatcher }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/work-orders/${wo_id}/start", payload: {}, as: CrewLead }
            - { call: "POST /api/work-orders/${wo_id}/finish-application", payload: { actual_area_sqft: 1250, actual_crack_ft: 44, actual_pothole_area_sqft: 12, actual_stripe_ft: 0, gallons_used: 17 }, as: CrewLead }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T07:00:00Z" }, as: OfficeAdmin }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: CrewLead }
            - { call: "GET /api/invoices?work_order_id=${wo_id}", payload: {}, as: OfficeAdmin, captures: { inv_total: "$.data[0].total_cents", inv_subtotal: "$.data[0].subtotal_cents", inv_surcharge: "$.data[0].fuel_surcharge_cents" } }
          assert:
            - "Quote.${quote_id}.total_cents == 50300 (provisional: lines 28800/6000/8000, subtotal 42800, mobilization 7500)"
            - "Invoice.subtotal_cents == 53700 (final: lines 30000/6600/9600 + mobilization 7500 on actuals 1250/44/12)"
            - "Invoice.fuel_surcharge_cents == 3222 (6% of 53700)"
            - "Invoice.total_cents == 56922 and != Quote.total_cents (50300) — provisional and final variants diverge for identical scope"

      - name: crew_utilization_projected_vs_realized
        grounds:
          - calculations.crew_utilization
        distinguishing_aspect: |
          Capacity domain (Crew, not money): the same August capacity base
          (16000 sqft over two sheets) yields projected_utilization_pct == 20.0
          (booked quoted areas 1200 + 2000) but realized_utilization_pct == 7.8
          (only the first job completed, actual 1250) — two variants of the
          same utilization aggregate on the same crew-month.
        test_recipe:
          setup:
            - "Two commercial properties; assessments area 1200 and 2000; STANDARD material; two lots"
            - "Crew with two published sheets 2026-08-10 and 2026-08-11, capacity 8000 each"
            - "Both work orders scheduled (WO1 on 08-10, WO2 on 08-11); WO1 runs to COMPLETED with actual_area 1250; WO2 stays SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Acme Parking LLC", customer_type: "COMMERCIAL", email: "ops@acme.example", phone: "555-0100" }, as: OfficeAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${cust_id}", address: "100 Commerce Way", lot_kind: "COMMERCIAL_LOT" }, as: OfficeAdmin, captures: { prop1_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${cust_id}", address: "200 Commerce Way", lot_kind: "COMMERCIAL_LOT" }, as: OfficeAdmin, captures: { prop2_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${prop1_id}", measured_area_sqft: 1200, crack_linear_ft: 0, pothole_count: 0, pothole_area_sqft: 0, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { asm1_id: "$.data.id" } }
            - { call: "POST /api/assessments/${asm1_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/assessments", payload: { property_id: "${prop2_id}", measured_area_sqft: 2000, crack_linear_ft: 0, pothole_count: 0, pothole_area_sqft: 0, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { asm2_id: "$.data.id" } }
            - { call: "POST /api/assessments/${asm2_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "POST /api/material-lots", payload: { material_id: "${mat_id}", delivered_gallons: 500, unit_cost_cents: 1500, received_on: "2026-07-15", reorder_threshold_gallons: 15 }, as: OfficeAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/crews", payload: { crew_name: "Crew Alpha", home_zone: "North", daily_capacity_sqft: 8000 }, as: OfficeAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-10" }, as: Dispatcher, captures: { sheet1_id: "$.data.id" } }
            - { call: "POST /api/route-sheets/${sheet1_id}/publish", payload: {}, as: Dispatcher }
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-11" }, as: Dispatcher, captures: { sheet2_id: "$.data.id" } }
            - { call: "POST /api/route-sheets/${sheet2_id}/publish", payload: {}, as: Dispatcher }
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-10", min_temp_f: 65, max_temp_f: 82, precip_probability_pct: 10, precipitation_mm: 0, source: "FORECAST" }, as: Dispatcher }
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-11", min_temp_f: 66, max_temp_f: 83, precip_probability_pct: 5, precipitation_mm: 0, source: "FORECAST" }, as: Dispatcher }
            - { call: "GET /api/properties/${prop1_id}", payload: {}, as: OfficeAdmin, captures: { prop1_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${prop1_id}", assessment_id: "${asm1_id}", material_id: "${mat_id}", include_crack_fill: false, include_patch: false, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${prop1_v}" }, as: Estimator, captures: { quote1_id: "$.data.id" } }
            - { call: "POST /api/quotes/${quote1_id}/send", payload: {}, as: Estimator }
            - { call: "POST /api/quotes/${quote1_id}/accept", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/work-orders?quote_id=${quote1_id}", payload: {}, as: Dispatcher, captures: { wo1_id: "$.data[0].id" } }
            - { call: "POST /api/work-orders/${wo1_id}/schedule", payload: { route_sheet_id: "${sheet1_id}", material_lot_id: "${lot_id}", scheduled_date: "2026-08-10", window_start_hour: 7, window_end_hour: 11, drive_minutes_est: 20, vehicles_to_move: 2 }, as: Dispatcher }
            - { call: "GET /api/properties/${prop2_id}", payload: {}, as: OfficeAdmin, captures: { prop2_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${prop2_id}", assessment_id: "${asm2_id}", material_id: "${mat_id}", include_crack_fill: false, include_patch: false, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${prop2_v}" }, as: Estimator, captures: { quote2_id: "$.data.id" } }
            - { call: "POST /api/quotes/${quote2_id}/send", payload: {}, as: Estimator }
            - { call: "POST /api/quotes/${quote2_id}/accept", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/work-orders?quote_id=${quote2_id}", payload: {}, as: Dispatcher, captures: { wo2_id: "$.data[0].id" } }
            - { call: "POST /api/work-orders/${wo2_id}/schedule", payload: { route_sheet_id: "${sheet2_id}", material_lot_id: "${lot_id}", scheduled_date: "2026-08-11", window_start_hour: 7, window_end_hour: 11, drive_minutes_est: 25, vehicles_to_move: 4 }, as: Dispatcher }
            - { call: "GET /api/displacement-plans?work_order_id=${wo1_id}", payload: {}, as: Dispatcher, captures: { plan1_id: "$.data[0].id" } }
            - { call: "POST /api/displacement-plans/${plan1_id}/send-notice", payload: {}, as: Dispatcher }
            - { call: "POST /api/displacement-plans/${plan1_id}/confirm-cleared", payload: {}, as: Dispatcher }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/work-orders/${wo1_id}/start", payload: {}, as: CrewLead }
            - { call: "POST /api/work-orders/${wo1_id}/finish-application", payload: { actual_area_sqft: 1250, actual_crack_ft: 0, actual_pothole_area_sqft: 0, actual_stripe_ft: 0, gallons_used: 17 }, as: CrewLead }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T07:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/work-orders/${wo1_id}/complete", payload: {}, as: CrewLead }
          trigger:
            - { call: "GET /api/crews/${crew_id}/utilization", payload: { month: "2026-08" }, as: Dispatcher, captures: { util_proj: "$.data.projected_utilization_pct", util_real: "$.data.realized_utilization_pct" } }
          assert:
            - "Utilization.capacity_sqft == 16000 (two non-cancelled sheets of 8000)"
            - "Utilization.projected_sqft == 3200 (quoted 1200 COMPLETED + quoted 2000 SCHEDULED)"
            - "Utilization.realized_sqft == 1250 (actual of the single COMPLETED job)"
            - "projected_utilization_pct == 20.0 and realized_utilization_pct == 7.8 — forward-looking vs realized variants diverge"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_pricing_multi_factor_tiered
        grounds:
          - calculations.job_pricing
        distinguishing_aspect: |
          Mode (a): a >= 3-input formula with tiered-rate selection (area tier),
          grade factor, coat multiplier, conditional mobilization fee, and a
          minimum-charge max() — evaluated on 1200 sqft (tier 2), STANDARD,
          1 coat, crack 40 ft, pothole 10 sqft -> total_cents == 50300.
        test_recipe:
          setup:
            - "Commercial property; assessment 1200/40/2 potholes/10/5/NONE; STANDARD material; quote scope crack+patch+seal, 1 coat, no discount"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Acme Parking LLC", customer_type: "COMMERCIAL", email: "ops@acme.example", phone: "555-0100" }, as: OfficeAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${cust_id}", address: "100 Commerce Way", lot_kind: "COMMERCIAL_LOT" }, as: OfficeAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${prop_id}", measured_area_sqft: 1200, crack_linear_ft: 40, pothole_count: 2, pothole_area_sqft: 10, oil_spot_area_sqft: 5, slope_severity: "NONE" }, as: Estimator, captures: { asm_id: "$.data.id" } }
            - { call: "POST /api/assessments/${asm_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "GET /api/properties/${prop_id}", payload: {}, as: OfficeAdmin, captures: { prop_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/quotes", payload: { property_id: "${prop_id}", assessment_id: "${asm_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${prop_v}" }, as: Estimator, captures: { quote_id: "$.data.id" } }
          assert:
            - "Quote.seal_line_cents == 28800 (1200 sqft at tier-2 24c, grade factor 1.0, 1 coat)"
            - "Quote.crack_line_cents == 6000 (40 ft at 150c)"
            - "Quote.patch_line_cents == 8000 (10 sqft at 800c)"
            - "Quote.striping_line_cents == 0 (excluded)"
            - "Quote.subtotal_cents == 42800"
            - "Quote.mobilization_fee_cents == 7500 (42800 < 200000)"
            - "Quote.total_cents == 50300 (max(42800 + 7500, 25000))"

      - name: invoice_rounding_order_pinned
        grounds:
          - calculations.invoice_settlement
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line round_half_up
          then sum (pinned) yields subtotal 49005 and total 51945, while
          sum-then-round would yield 49004/51944; actuals 1234 sqft at PREMIUM
          1.35 factor (seal float 39981.6c) and 10.15 ft crack (float 1522.5c)
          force the one-cent divergence.
        test_recipe:
          setup:
            - "Commercial property; assessment 1234/10.15/0/0/0/NONE; PREMIUM material (factor 1.35, coverage 70, price 1500c); lot 200 gal"
            - "Job scheduled, started, finished with actuals identical to assessment (area 1234, crack 10.15), gallons 18; cure passed"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Beta Retail LLC", customer_type: "COMMERCIAL", email: "ops@beta.example", phone: "555-0200" }, as: OfficeAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${cust_id}", address: "55 Market St", lot_kind: "COMMERCIAL_LOT" }, as: OfficeAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${prop_id}", measured_area_sqft: 1234, crack_linear_ft: 10.15, pothole_count: 0, pothole_area_sqft: 0, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { asm_id: "$.data.id" } }
            - { call: "POST /api/assessments/${asm_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Premium", grade: "PREMIUM", coverage_sqft_per_gallon: 70, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 36, warranty_months: 24, price_per_gallon_cents: 1500 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "POST /api/material-lots", payload: { material_id: "${mat_id}", delivered_gallons: 200, unit_cost_cents: 1500, received_on: "2026-07-15", reorder_threshold_gallons: 15 }, as: OfficeAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/crews", payload: { crew_name: "Crew Beta", home_zone: "South", daily_capacity_sqft: 8000 }, as: OfficeAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-10" }, as: Dispatcher, captures: { sheet_id: "$.data.id" } }
            - { call: "POST /api/route-sheets/${sheet_id}/publish", payload: {}, as: Dispatcher }
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-10", min_temp_f: 65, max_temp_f: 82, precip_probability_pct: 10, precipitation_mm: 0, source: "FORECAST" }, as: Dispatcher }
            - { call: "GET /api/properties/${prop_id}", payload: {}, as: OfficeAdmin, captures: { prop_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${prop_id}", assessment_id: "${asm_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: false, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${prop_v}" }, as: Estimator, captures: { quote_id: "$.data.id" } }
            - { call: "POST /api/quotes/${quote_id}/send", payload: {}, as: Estimator }
            - { call: "POST /api/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/work-orders?quote_id=${quote_id}", payload: {}, as: Dispatcher, captures: { wo_id: "$.data[0].id" } }
            - { call: "POST /api/work-orders/${wo_id}/schedule", payload: { route_sheet_id: "${sheet_id}", material_lot_id: "${lot_id}", scheduled_date: "2026-08-10", window_start_hour: 7, window_end_hour: 11, drive_minutes_est: 15, vehicles_to_move: 0 }, as: Dispatcher }
            - { call: "GET /api/displacement-plans?work_order_id=${wo_id}", payload: {}, as: Dispatcher, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /api/displacement-plans/${plan_id}/send-notice", payload: {}, as: Dispatcher }
            - { call: "POST /api/displacement-plans/${plan_id}/confirm-cleared", payload: {}, as: Dispatcher }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/work-orders/${wo_id}/start", payload: {}, as: CrewLead }
            - { call: "POST /api/work-orders/${wo_id}/finish-application", payload: { actual_area_sqft: 1234, actual_crack_ft: 10.15, actual_pothole_area_sqft: 0, actual_stripe_ft: 0, gallons_used: 18 }, as: CrewLead }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T07:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: CrewLead }
          trigger:
            - { call: "GET /api/invoices?work_order_id=${wo_id}", payload: {}, as: OfficeAdmin, captures: { inv_id: "$.data[0].id", inv_subtotal: "$.data[0].subtotal_cents", inv_total: "$.data[0].total_cents" } }
          assert:
            - "Invoice.line_items == [seal 39982, crack 1523, mobilization 7500] — crack 1522.5 rounds half-up to 1523 per line"
            - "Invoice.subtotal_cents == 49005 (per-line-first order; sum-then-round would give 49004)"
            - "Invoice.fuel_surcharge_cents == 2940 (6% of 49005, tier keyed on the rounded subtotal)"
            - "Invoice.total_cents == 51945"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle
        grounds:
          - state_machines.Quote.SENT_to_REVISION_REQUESTED
          - state_machines.Quote.REVISION_REQUESTED_to_DRAFT
        distinguishing_aspect: |
          Cycle on Quote: DRAFT -> SENT -> REVISION_REQUESTED -> (PATCH) DRAFT
          -> SENT -> ACCEPTED; the loop clears sent_at/expires_on and recomputes
          pricing, so the same quote id traverses DRAFT twice.
        test_recipe:
          setup:
            - "Commercial property with SUBMITTED assessment 1200/40/2/10/5/NONE; STANDARD material; quote created (1 coat)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Acme Parking LLC", customer_type: "COMMERCIAL", email: "ops@acme.example", phone: "555-0100" }, as: OfficeAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${cust_id}", address: "100 Commerce Way", lot_kind: "COMMERCIAL_LOT" }, as: OfficeAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${prop_id}", measured_area_sqft: 1200, crack_linear_ft: 40, pothole_count: 2, pothole_area_sqft: 10, oil_spot_area_sqft: 5, slope_severity: "NONE" }, as: Estimator, captures: { asm_id: "$.data.id" } }
            - { call: "POST /api/assessments/${asm_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "GET /api/properties/${prop_id}", payload: {}, as: OfficeAdmin, captures: { prop_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${prop_id}", assessment_id: "${asm_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${prop_v}" }, as: Estimator, captures: { quote_id: "$.data.id" } }
            - { call: "POST /api/quotes/${quote_id}/send", payload: {}, as: Estimator }
          trigger:
            - { call: "POST /api/quotes/${quote_id}/request-revision", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "PATCH /api/quotes/${quote_id}", payload: { coats: 2 }, as: Estimator, captures: { q_status: "$.data.status", q_sent_at: "$.data.sent_at", q_total: "$.data.total_cents" } }
            - { call: "POST /api/quotes/${quote_id}/send", payload: {}, as: Estimator, captures: { q_status2: "$.data.status", q_expires: "$.data.expires_on" } }
            - { call: "POST /api/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { q_status3: "$.data.status" } }
          assert:
            - "After request-revision: Quote.status == REVISION_REQUESTED"
            - "After PATCH: Quote.status == DRAFT and sent_at == null and expires_on == null (cycle reset)"
            - "After PATCH: Quote.total_cents == 79100 (2 coats: seal 57600 + crack 6000 + patch 8000 = 71600 subtotal; 71600 < 200000 so mobilization 7500 applies)"
            - "After second send: status == SENT with fresh expires_on == 2026-08-15"
            - "After accept: status == ACCEPTED and a single WorkOrder exists for the quote"

      - name: work_order_parallel_state_dimensions
        grounds:
          - state_machines.WorkOrder.CURING_to_COMPLETED
          - state_machines.WorkOrderBilling.UNINVOICED_to_INVOICED
          - state_machines.WorkOrderBilling.INVOICED_to_PAID
