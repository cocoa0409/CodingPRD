            - { call: "GET /payment-integrity/abrasion-profiles", payload: { provider_id: "${pb7_id}" }, as: Any, captures: { pb7_tier: "$.data[0].tier", pb7_mon: "$.data[0].monitor_only" } }
          trigger:
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "B74", provider_id: "${pb7_id}", member_id: "M-B74", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pb7_id}", captures: { cb74_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cb74_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pb7_id}" }
            - { call: "POST /payment-integrity/claims/${cb74_id}/run-edits", payload: {}, as: PlanAdmin, captures: { cb74_status: $.data.status, cb74_allowed: $.data.allowed_amount_cents } }
            - { call: "GET /payment-integrity/claims/${cb74_id}/edit-hits", payload: {}, as: Any, captures: { hb74_applied: "$.data[0].applied", hb74_attr: "$.data[0].attributed_savings_cents" } }
          assert:
            - "ProviderAbrasionProfile[provider=${pb7_id}].tier == HIGH and monitor_only == true before the trigger (standard_index 0.5333 >= 0.50)"
            - "Claim.${cb74_id} EditHit exists with applied == false and attributed_savings_cents == 0 (monitor-only recording)"
            - "no ReviewTask exists for claim ${cb74_id}"
            - "Claim.${cb74_id}.status == READY_TO_PAY with allowed_amount_cents == 40000 (no denial despite the firing edit)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: edit_windows_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_EDIT_WINDOW_OVERLAP]
          - entities.EditVersion.fields.effective_from
          - entities.EditVersion.fields.effective_to
        distinguishing_aspect: |
          Resource: EditRule version windows, HALF-OPEN semantics — window
          [2026-06-01, 2026-12-01) overlapping ACTIVE [2026-01-01, 2026-07-01)
          is rejected, while the adjacent window [2026-07-01, 2027-01-01)
          touching at the exclusive boundary is accepted.
        test_recipe:
          setup:
            - "Edit rule RW; version A window [2026-01-01, 2026-07-01) approved ACTIVE (rule version now 2)"
            - "Version B window [2026-06-01, 2026-12-01) submitted; version C window [2026-07-01, 2027-01-01) submitted"
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "WIN-01", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rw_id: $.data.id, rw_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rw_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line A", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { wa_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${wa_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${wa_id}/approve", payload: { expected_edit_rule_version: "${rw_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/edit-rules/${rw_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line B", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { wb_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${wb_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-rules/${rw_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line C", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { wc_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${wc_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "GET /payment-integrity/edit-rules/${rw_id}", payload: {}, as: Any, captures: { rw_v2: $.data.version } }
          trigger:
            - { call: "POST /payment-integrity/edit-versions/${wb_id}/approve", payload: { expected_edit_rule_version: "${rw_v2}" }, as: EditApprover, as_user_id: approver-1, captures: { wb_err: $.data.error_id } }
            - { call: "POST /payment-integrity/edit-versions/${wc_id}/approve", payload: { expected_edit_rule_version: "${rw_v2}" }, as: EditApprover, as_user_id: approver-1, captures: { wc_status: $.data.status } }
            - { call: "GET /payment-integrity/edit-rules/${rw_id}", payload: {}, as: Any, captures: { rw_count: $.data.active_version_count } }
          assert:
            - "version B approve rejected with error_id == ERR_EDIT_WINDOW_OVERLAP (409): [2026-06-01, 2026-12-01) intersects ACTIVE [2026-01-01, 2026-07-01)"
            - "failed approve does not bump EditRule.${rw_id}.version, so version C approves with the same expected version"
            - "version C approves to ACTIVE: adjacency at 2026-07-01 is not overlap under half-open windows"
            - "EditRule.${rw_id}.active_version_count == 2 (A and C coexist with disjoint windows)"

      - name: ibr_provider_occupancy_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_PROVIDER_AUDIT_OVERLAP]
          - state_machines.ItemizedBillReview.IN_AUDIT_to_COMPLETED
        distinguishing_aspect: |
          Resource: provider audit occupancy, CLOSED interval with a 14-day
          post-completion buffer — a manual IBR created 10 days after the prior
          review completed collides (rejected), while one created 15 days after
          is accepted. Different semantics than the half-open adjacency rule for
          edit windows.
        test_recipe:
          setup:
            - "Provider PF8; claim X (one 100000 line) screened clean to READY_TO_PAY at default clock 2026-08-01"
            - "Manual IBR1 on claim X completed at 2026-08-01T00:00:00Z (occupancy interval [2026-08-01, 2026-08-15] closed)"
            - "Claim Y (one 50000 line) screened clean; clock first advanced to 2026-08-11 (inside buffer), then to 2026-08-16 (outside)"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-F8", name: "Occupied Prov" }, as: PlanAdmin, captures: { pf8_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F8X", provider_id: "${pf8_id}", member_id: "M-F8X", claim_type: PROFESSIONAL, total_billed_cents: 100000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pf8_id}", captures: { cf8x_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf8x_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 100000 }, as: Provider, as_user_id: "${pf8_id}" }
            - { call: "POST /payment-integrity/claims/${cf8x_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims/${cf8x_id}/itemized-bill-reviews", payload: {}, as: SeniorReviewer, as_user_id: senior-1, captures: { ibr1_id: $.data.id } }
            - { call: "POST /payment-integrity/itemized-bill-reviews/${ibr1_id}/receive-documents", payload: {}, as: Provider, as_user_id: "${pf8_id}" }
            - { call: "POST /payment-integrity/itemized-bill-reviews/${ibr1_id}/start-audit", payload: {}, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/itemized-bill-reviews/${ibr1_id}/complete", payload: { findings_cents: 0 }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F8Y", provider_id: "${pf8_id}", member_id: "M-F8Y", claim_type: PROFESSIONAL, total_billed_cents: 50000, service_from: "2026-07-11T00:00:00Z", service_to: "2026-07-11T00:00:00Z" }, as: Provider, as_user_id: "${pf8_id}", captures: { cf8y_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf8y_id}/lines", payload: { line_number: 1, procedure_code: "99214", billed_cents: 50000 }, as: Provider, as_user_id: "${pf8_id}" }
            - { call: "POST /payment-integrity/claims/${cf8y_id}/run-edits", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "POST /payment-integrity/claims/${cf8y_id}/itemized-bill-reviews", payload: {}, as: SeniorReviewer, as_user_id: senior-1, captures: { ibr2_err: $.data.error_id } }
            - { call: "POST /payment-integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims/${cf8y_id}/itemized-bill-reviews", payload: {}, as: SeniorReviewer, as_user_id: senior-1, captures: { ibr2_id: $.data.id } }
          assert:
            - "at completed_at + 10 days the manual IBR is rejected with error_id == ERR_PROVIDER_AUDIT_OVERLAP (409)"
            - "at completed_at + 15 days the manual IBR is created (201): buffer [2026-08-01, 2026-08-15] no longer covers now"
            - "ItemizedBillReview.${ibr2_id}.status == REQUESTED and Claim.${cf8y_id} re-pended (READY_TO_PAY -> PENDED)"
  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_dollar_conservation_across_override
        grounds:
          - entities.Claim.fields.allowed_amount_cents
          - entities.Claim.fields.denied_amount_cents
          - entities.Claim.fields.initial_allowed_cents
          - state_machines.EditHit.FIRED_to_OVERRIDDEN
        distinguishing_aspect: |
          Conserved quantity: the claim dollar split. The forward action (edit
          fires, 200000 denied) paired with its compensating action (task
          OVERRIDE releases 200000) leaves allowed_amount_cents +
          denied_amount_cents == initial_allowed_cents == 200000 at every
          checkpoint — no drift after the round trip.
        test_recipe:
          setup:
            - "Provider PC9; edit EC9 (DENY, PROFESSIONAL) ACTIVE"
            - "Claim: one 200000 line; run-edits fires the edit (allowed 0, denied 200000); task assigned"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-C9", name: "Conserve Prov" }, as: PlanAdmin, captures: { pc9_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "CONS-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rc9_id: $.data.id, rc9_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rc9_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evc9_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evc9_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evc9_id}/approve", payload: { expected_edit_rule_version: "${rc9_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C9", provider_id: "${pc9_id}", member_id: "M-C9", claim_type: PROFESSIONAL, total_billed_cents: 200000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pc9_id}", captures: { cc9_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cc9_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 200000 }, as: Provider, as_user_id: "${pc9_id}" }
            - { call: "POST /payment-integrity/claims/${cc9_id}/run-edits", payload: {}, as: PlanAdmin, captures: { cc9_al0: $.data.allowed_amount_cents, cc9_dn0: $.data.denied_amount_cents, cc9_ia: $.data.initial_allowed_cents } }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cc9_id}" }, as: Any, captures: { tc9_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tc9_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
          trigger:
            - { call: "POST /payment-integrity/review-tasks/${tc9_id}/decide", payload: { outcome: OVERRIDE }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${cc9_id}", payload: {}, as: Any, captures: { cc9_al1: $.data.allowed_amount_cents, cc9_dn1: $.data.denied_amount_cents, cc9_st: $.data.status } }
          assert:
            - "after run-edits (forward): allowed_amount_cents == 0 and denied_amount_cents == 200000; 0 + 200000 == initial_allowed_cents == 200000"
            - "after OVERRIDE (compensating): allowed_amount_cents == 200000 and denied_amount_cents == 0; 200000 + 0 == initial_allowed_cents == 200000"
            - "Claim.${cc9_id}.status == READY_TO_PAY after the release (bubble-up through DETERMINED)"

      - name: savings_period_bucket_identity
        grounds:
          - calculations.savings_measurement
          - entities.SavingsPeriod.fields.pending_pipeline_cents
          - entities.SavingsPeriod.fields.reversed_cents
        distinguishing_aspect: |
          Conserved quantity: the period's provisional savings total. Bucket
          moves (confirm 50000, leave 70000 pending, partially release 20000 of
          60000) shuffle dollars among finalized/pending/reversed but the
          identity provisional == finalized + pending + reversed holds exactly:
          180000 == 90000 + 70000 + 20000. Different conserved quantity than the
          claim dollar split.
        test_recipe:
          setup:
            - "Provider PS9; edit ES9 (DENY, PROFESSIONAL) ACTIVE"
            - "Claim A: 50000 line upheld; claim B: 70000 line hit left FIRED; claim C: 60000 line upheld then dispute PARTIAL releasing 20000"
            - "SavingsPeriod 2026-08 created and moved to RECONCILING (default clock keeps every event inside the period month)"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-S9", name: "Bucket Prov" }, as: PlanAdmin, captures: { ps9_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "BUCKET-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rs9_id: $.data.id, rs9_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rs9_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evs9_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evs9_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evs9_id}/approve", payload: { expected_edit_rule_version: "${rs9_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "SA", provider_id: "${ps9_id}", member_id: "M-SA", claim_type: PROFESSIONAL, total_billed_cents: 50000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${ps9_id}", captures: { csa_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${csa_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 50000 }, as: Provider, as_user_id: "${ps9_id}" }
            - { call: "POST /payment-integrity/claims/${csa_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${csa_id}" }, as: Any, captures: { tsa_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tsa_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tsa_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "SB", provider_id: "${ps9_id}", member_id: "M-SB", claim_type: PROFESSIONAL, total_billed_cents: 70000, service_from: "2026-07-11T00:00:00Z", service_to: "2026-07-11T00:00:00Z" }, as: Provider, as_user_id: "${ps9_id}", captures: { csb_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${csb_id}/lines", payload: { line_number: 1, procedure_code: "99214", billed_cents: 70000 }, as: Provider, as_user_id: "${ps9_id}" }
            - { call: "POST /payment-integrity/claims/${csb_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "SC", provider_id: "${ps9_id}", member_id: "M-SC", claim_type: PROFESSIONAL, total_billed_cents: 60000, service_from: "2026-07-12T00:00:00Z", service_to: "2026-07-12T00:00:00Z" }, as: Provider, as_user_id: "${ps9_id}", captures: { csc_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${csc_id}/lines", payload: { line_number: 1, procedure_code: "99215", billed_cents: 60000 }, as: Provider, as_user_id: "${ps9_id}" }
            - { call: "POST /payment-integrity/claims/${csc_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${csc_id}" }, as: Any, captures: { tsc_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tsc_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tsc_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${csc_id}", payload: {}, as: Any, captures: { csc_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${csc_id}/edit-hits", payload: {}, as: Any, captures: { hsc_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/claims/${csc_id}/disputes", payload: { edit_hit_id: "${hsc_id}", reason: "partial release", expected_claim_version: "${csc_v}" }, as: Provider, as_user_id: "${ps9_id}", captures: { dsc_id: $.data.id } }
            - { call: "POST /payment-integrity/disputes/${dsc_id}/start-review", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1 }
            - { call: "POST /payment-integrity/disputes/${dsc_id}/decide", payload: { outcome: PARTIAL, released_cents: 20000 }, as: DisputeAdjudicator, as_user_id: adj-1 }
            - { call: "POST /payment-integrity/savings-periods", payload: { period_key: "2026-08" }, as: PlanAdmin, captures: { sp9_id: $.data.id } }
            - { call: "POST /payment-integrity/savings-periods/${sp9_id}/begin-reconciliation", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "POST /payment-integrity/savings-periods/${sp9_id}/finalize", payload: {}, as: PlanAdmin }
          assert:
            - "SavingsPeriod.${sp9_id}.provisional_savings_cents == 180000"
            - "SavingsPeriod.${sp9_id}.finalized_savings_cents == 90000"
            - "SavingsPeriod.${sp9_id}.pending_pipeline_cents == 70000"
            - "SavingsPeriod.${sp9_id}.reversed_cents == 20000"
            - "identity holds: 90000 + 70000 + 20000 == 180000 (no drift across confirm/pend/partial-release bucket moves)"
