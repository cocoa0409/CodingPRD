      - name: need_targets_apply_cover_weeks_push_fill_rate_and_default_lift
        claim_type: constants_applied
        grounds:
          - calculations.store_need_units
          - calculations.store_need_units.constants
          - calculations.promo_lift_factor_bp.constants
          - entities.AllocationLine.fields.need_units
          - entities.AllocationRun.fields.unallocated_remainder_units
        distinguishing_aspect: |
          Three declared constants have to appear with their exact declared values, and the only way to see
          them is through need_units. One program carries one item of each type so all three target formulas
          run over the same store in one dataset: PUSH multiplies fixture capacity by PUSH_FILL_RATE_BP = 8000
          and FLOORs it, DEMAND_DRIVEN multiplies the weekly demand by COVER_WEEKS = 4, and MIN_MAX_TOPUP uses
          max_units with no constant at all. With no promo event in the database the lift must fall back to
          DEFAULT_LIFT_BP = 10000, i.e. exactly neutral. Store 0102 pins the FLOOR: capacity 32 gives 25.6, so
          its target is 25 and its need is 0 - a ROUND would give 26, a need of 1 and a spurious line.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE; store 0101 shelf plan 4 x 3 x 4 = capacity 48 / pmin 12, store 0102 shelf plan 4 x 2 x 4 = capacity 32 / pmin 8"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500; three items on it: SKU-1001 SEASONAL, SKU-2001 BASIC, SKU-3001 FASHION"
            - "Positions at 0101: SKU-1001 on_hand 13 / min 12 / max 48 / forecast 9, SKU-2001 on_hand 5 / min 10 / max 30 / forecast 4, SKU-3001 on_hand 13 / min 12 / max 48 / forecast 9"
            - "Position at 0102: SKU-3001 on_hand 25 (S 5 / M 9 / L 8 / XL 3) / min 8 / max 32 / forecast 5"
            - "on_order_units is 0 everywhere, no promo event exists, and one 30-unit receipt is staged per item"
            - "The logical clock is the default 2026-08-01T00:00:00Z"
