          rationale: "That instance asserts ERR_PERMIT_EXPIRED wins over ERR_PERMIT_WEIGHT_EXCEEDED and leaves the permit EXPIRED."

  # =========================================================================
  - section: endpoints
    instances:

      - name: success_and_error_responses_use_the_declared_envelope
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - endpoints[POST /projects]
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp; successes set response_type to 'object' or 'array' with the payload under data, while failures set response_type to 'error' and put error_id and message under data."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
            - call: "GET /pieces"
              payload: { project_id: "${proj_id}" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the create response has meta.api_request_id, meta.api_request_timestamp, response_type == 'object' and data.id == ${proj_id}"
            - "the list response has response_type == 'array' with limit 10, offset 0, total_count 0 and has_more false"
            - "the failing read has response_type == 'error' and ${err_id} == ERR_PROJECT_NOT_FOUND with a non-empty ${err_msg}"

