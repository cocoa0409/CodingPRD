            - "RemediationCampaign.${camp_id}.solicited_consent_count == 1 and applied_count == 0  # the counters are not rewritten by the cascade"
            - "RemediationCampaign.${camp_id}.status != SUSPENDED  # target_defect is CHARGING, so the S4 suspension branch does not fire"
            - "ThermalEvent.${event_id}.notification_deadline_at == 2026-08-01T12:00:00Z  # detected_at + 24 h for S4"
            - "ThermalEvent.${event_id}.notification_status == PENDING and event_status == OPEN"

      - name: consent_decline_cascades_campaign_closure_and_liability_reversal
        depth: 2
        trigger_kind: "POST /battery-warranty/remediation-consents/{consent_id}/decision with decision=DECLINE"
        grounds:
          - state_machines.RemediationConsent.PENDING_to_DECLINED
          - state_machines.WarrantyClaim.APPROVED_SOFTWARE_to_DENIED
          - state_machines.RemediationCampaign.FIELD_RELEASE_to_CLOSED
          - entities.WarrantyProgram.fields.accrued_liability_cents
          - entities.WarrantyClaim.fields.denial_reason
        distinguishing_aspect: |
          A different trigger (an owner decision, not a thermal event) drives a two-link chain that
          runs in the opposite direction - money is UNBOOKED rather than state escalated: the decline
          empties the campaign's open set so the campaign closes, and the same decline denies the
          APPROVED_SOFTWARE claim, subtracting its 21167-cent oem_total from the program ledger and
          returning accrued_liability_cents to exactly 0 with no drift.
        test_recipe:
          setup:
            - "Vehicle in service 2020-03-10 with five fresh snapshots giving retention 70.00 % and NO faulted modules, so remedy_decision returns SOFTWARE_REMEDIATION / NO_MODULE_FAULT."
            - "A CHARGING campaign for MX-90 released FIELD, which solicits the one eligible vehicle: solicited_consent_count 1, open_consent_count 1."
            - "The claim is adjudicated SOFTWARE_REMEDIATION against that campaign: parts 0, labor ROUND_HALF_UP(0.5 * 18333) = 9167, hazmat 0, diagnostic 12000 -> remedy_cost_cents 21167; FULL_COVERAGE, so oem_share_cents 21167, admin_fee_cents 0 (below the 200000 tier floor) and oem_total_cents 21167 is booked to the program."
