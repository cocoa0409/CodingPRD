              captures: { body_id: $.data.id }
            - call: "POST /records-requests"
              payload: { requester_id: "${r1_id}", body_id: "${body_id}", subject: "Fifty", description: "x", estimated_page_count: 0 }
              as: Requester
              as_user_id: "${r1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /records-requests/${req_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents"
              payload: { title: "Fifty", page_count: 50, review_minutes: 0, retention_series: "ADMIN" }
              as: RecordsOfficer
              captures: { doc_id: $.data.id }
            - call: "POST /records-requests/${req_id}/documents/${doc_id}/transition"
              payload: { to_status: "REVIEWED" }
              as: RecordsOfficer
            - call: "POST /records-requests/${req_id}/documents/${doc_id}/transition"
              payload: { to_status: "RELEASED" }
              as: RecordsOfficer
            - call: "GET /records-requests/${req_id}"
              payload: {}
              as: RecordsOfficer
              captures: { rr_v: $.data.version }
          trigger:
            - call: "POST /records-requests/${req_id}/determination"
              payload: { decision: "GRANTED", expected_records_request_version: "${rr_v}" }
              as: RecordsOfficer
          assert:
            - "RecordsRequest.${req_id}.assessed_fee_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: agenda_item_open_requires_meeting_in_session
        grounds:
