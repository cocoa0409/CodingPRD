        claim_type: parallel_state_dimensions
        grounds:
          - state_machines.Structure
          - complexity_profile.state_machine_shape
          - calculations.substantial_ratio
        distinguishing_aspect: |
          The determination axis is already at SUBSTANTIAL_IMPROVEMENT (ratio 52.50 >= 50.00)
          when an ELEVATION_DEFICIENT violation drives the certificate axis from
          PENDING_CERTIFICATE to NON_COMPLIANT; the violation leaves substantial_status
          untouched and the determination left compliance_status untouched.
        test_recipe:
          setup:
            - "Canonical base fixture; one counted IMPROVEMENT record of 105000.00 on 2026-03-01 (52.50% of 200000.00) auto-opens a CUMULATIVE case, which is then determined SUBSTANTIAL."
          setup_api_calls:
            - call: "POST /floodplain/communities"
