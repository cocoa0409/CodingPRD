            - "the second trigger is HTTP 409 with ${err_b} == ERR_LOT_ON_FOOD_SAFETY_HOLD"
            - "the third trigger is HTTP 409 with ${err_c} == ERR_INVALID_DISPOSITION_STATE"
            - "FruitLot.${lot1}.food_safety_hold == true and FruitLot.${lot1}.cold_chain_status == PACKED and FruitLot.${lot1}.cooling_tunnel_id == null"
