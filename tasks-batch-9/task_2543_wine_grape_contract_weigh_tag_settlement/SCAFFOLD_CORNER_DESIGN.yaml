          Two contracts, identical except for evergreen_flag, ride the same two clock
          moves. The window opens for both at 2026-08-03T00:00:00Z (2026-11-01 minus 90
          days) and closes for both at 2026-11-01T00:00:00Z, and at that instant the flag
          alone decides EVERGREEN_ROLLED versus NOT_RENEWING. The evergreen roll also
          RECOMPUTES its own window from the new term_end_vintage 2027, so the dimension is
