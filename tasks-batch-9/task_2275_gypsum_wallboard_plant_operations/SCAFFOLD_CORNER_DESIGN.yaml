        grounds:
          - concurrency_rules[feed-create-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
        distinguishing_aspect: |
          Feeds guard the lot balance with expected_lot_version, so a client that reuses the version it
          read before its own first feed is refused with ERR_STALE_LOT_VERSION (412) — this is the
          protection that stops a double feed from over-drawing a lot, and it is a different rule and a
          different code from the plant-level guard.
        test_recipe:
          setup:
            - "Plant GYP-1 with a 100.000 t APPROVED lot (version 2 after its assay) and batch BF PLANNED."
