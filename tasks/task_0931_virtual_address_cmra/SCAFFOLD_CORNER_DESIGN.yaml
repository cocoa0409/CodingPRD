              as_user_id: "${box_id}"
          assert:
            - "the trigger call returns 412 with error_id ERR_STALE_VERSION"
            - "GET /boxes/${box_id}/forward-shipments returns total_count 0"
            - "MailItem.${mi_id}.forward_shipment_id == null"
            - "Box.${box_id}.version == ${bv}"

      - name: version_increments_by_exactly_one_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.Box.fields.version", "entities.MailItem.fields.version"]
        distinguishing_aspect: "A Box starts at version 1 and advances by exactly 1 per mutating write, so activate then a compliance-review open leaves version 3."
        test_recipe:
          setup: ["One PENDING_SETUP box."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-7004", plan_tier_id: "${plan_id}", holder_name: "Fox Ver", holder_email: "fox@example.com" }
              as: CmraOperator
              captures: { box_id: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
              captures: { v2: "$.data.version" }
            - call: "POST /boxes/${box_id}/compliance-reviews"
              payload: { reason: "ID_EXPIRY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /boxes/${box_id}"
              payload: {}
              as: CmraOperator
              captures: { v3: "$.data.version" }
          assert:
            - "${v1} == 1"
            - "${v2} == 2"
            - "${v3} == 3"
            - "Box.${box_id}.compliance_status == UNDER_REVIEW"

      - name: cascading_side_effects_across_seven_entity_hops
        claim_type: cascading_side_effects
        grounds: ["state_machines.ComplianceReview.OPEN_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / compliance_suspension_seven_hop_cascade
          rationale: "The full multi-hop chain and its ordering are asserted end to end by the named §1.8 instance."

      - name: dual_variant_calculation_divergence
        claim_type: dual_variant_calculation
        grounds: ["calculations.package_billable_weight", "calculations.plan_change_proration"]
        excluded_because:
          difficulty_instance: dual_variant_calc / package_dimensional_vs_actual_weight_diverge
          rationale: "Variant divergence on identical inputs is asserted by the named §1.8 instance and by plan_change_upgrade_vs_downgrade_proration."

      - name: rate_threshold_trigger_at_the_storage_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.storage_days"]
        excluded_because:
          difficulty_instance: boundary_precision_check / storage_free_window_exact_day_boundary
          rationale: "The cumulative-threshold boundary and its reset are asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: cascaded_changes_are_visible_in_the_triggering_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.Form1583.NOTARIZED_to_ACCEPTED"]
        distinguishing_aspect: "The consistency model is immediate: the accept response already carries the ACCEPTED status and expires_on, and an immediate read of the Recipient already shows AUTHORIZED and RELEASABLE with no second write."
        test_recipe:
          setup: ["An ACTIVE box whose recipient has both documents VERIFIED and a NOTARIZED Form 1583."]
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { tier_code: "PLUS", name: "Plus", rank: 2, monthly_fee_cents: 6000, included_recipients: 3, included_scan_pages: 50, included_forwards: 2, included_storage_days: 60, overage_scan_page_cents: 25, overage_forward_cents: 900, overage_storage_day_cents: 30, overage_recipient_cents: 500, allows_overage: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /boxes"
              payload: { box_number: "Z-8001", plan_tier_id: "${plan_id}", holder_name: "Gus Now", holder_email: "gus@example.com", security_deposit_cents: 0, extra_recipient_slots: 0, prepaid_balance_cents: 0 }
              as: CmraOperator
              captures: { box_id: "$.data.id" }
            - call: "POST /boxes/${box_id}/activate"
              payload: {}
              as: CmraOperator
            - call: "POST /boxes/${box_id}/recipients"
              payload: { legal_name: "Gus Now", recipient_kind: "INDIVIDUAL", signature_authorization_on_file: false }
              as: CmraOperator
              captures: { rec_id: "$.data.id" }
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "PHOTO", doc_type: "PASSPORT", expires_on: "2027-06-30" }
              as: CmraOperator
              captures: { photo_id: "$.data.id" }
            - call: "POST /id-documents/${photo_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/id-documents"
              payload: { doc_class: "ADDRESS", doc_type: "UTILITY_BILL", expires_on: "2027-03-31" }
              as: CmraOperator
              captures: { addr_id: "$.data.id" }
            - call: "POST /id-documents/${addr_id}/verify"
              payload: {}
              as: CmraOperator
            - call: "POST /recipients/${rec_id}/form-1583"
              payload: { home_address_line: "1 Bootstrap Way" }
              as: CmraOperator
              captures: { form_id: "$.data.id" }
            - call: "POST /form-1583/${form_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "not-1"
          trigger:
            - call: "POST /form-1583/${form_id}/accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acc_status: "$.data.status", acc_expires: "$.data.expires_on" }
            - call: "GET /recipients/${rec_id}"
              payload: {}
              as: CmraOperator
          assert:
            - "${acc_status} == ACCEPTED"
            - "${acc_expires} == 2031-04-30"
            - "the second trigger call returns Recipient.roster_status AUTHORIZED and release_eligibility RELEASABLE in the same response"
            - "Box.${box_id}.roster_authorized_count == 1"
