          assert:
            - "${drv_status0} == 'APPLICANT' and ${drv_v1} == 1, the declared initial state"
            - "Driver.${drv_id}.qualification_status == 'PENDING_CHECKS'"
            - "Driver.${drv_id}.mvr_points_latest == 0 and Driver.${drv_id}.version == ${drv_v1} + 1"
            - "Driver.${drv_id}.insurance_status == 'NONE' and qualified_by_user_id == null and disqualified_reason == null"
            - "MvrCheck.${mvr_id}.driver_id == ${drv_id} and recorded_by_user_id == 'co-1'"

