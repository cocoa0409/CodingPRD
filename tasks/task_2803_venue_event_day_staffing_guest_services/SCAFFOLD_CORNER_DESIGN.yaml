            - "${err_dir_assign}, ${err_coord_assign}, ${err_dir_request} and ${err_dir_resource} are all 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 - assign, refund-request and the accessibility pool are supervisor-exclusive even against the director"
            - "${gi_status} == 'IN_PROGRESS' and ${gi_assigned} == ${m1}"
            - "${gi_refund_status} == 'PENDING', ${gi_requested} == 1500 and ${gi_requester} == 'sup-1' - filing the ask moves no money, so Event.${ev_id}.refund_budget_remaining_cents is still 100000"
            - "${res_status} == 'AVAILABLE' with unit_count 6, and ${areq_status} == 'REQUESTED' with units_requested 2 and companion_seats_requested 1"
            - "each refusal wrote nothing: GET /accessibility-resources?event_id=${ev_id}&limit=10&offset=0 returns total_count == 1"

      - name: staff_member_cannot_mark_no_show_or_release
        claim_type: role_exclusive_operations
        grounds:
          - roles.StaffMember
          - roles.StaffingCoordinator
          - conditional_role_rules
          - validations[priority 2]
          - validations[priority 7]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: >-
          The attendance endpoint is action-gated per role on the same path: a worker may CHECK_IN and
          CHECK_OUT their own shift, but NO_SHOW and RELEASE are coordinator-only and return
          ERR_ROLE_NOT_PERMITTED at priority 2, while CHECK_IN on someone else's shift returns
          ERR_NOT_RESOURCE_OWNER at priority 7 - two different 403s from one endpoint.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z."
            - "One IN_PROGRESS Event whose LOCKED plan carries a TICKET_TAKER slot (no required certifications, override 2, 18:00Z -> 22:05Z)."
            - "Two ACTIVE members m1 and m2, each with one SCHEDULED assignment on that slot: a1 for m1 and a2 for m2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Attendance Role Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M1 Worker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M2 Worker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2019-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m2}" }
              as: StaffingCoordinator
              captures: { a2: $.data.id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /staff-assignments/${a2}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_no_show: $.data.error_id }
            - call: "POST /staff-assignments/${a2}/attendance"
              payload: { action: "RELEASE" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_release: $.data.error_id }
            - call: "POST /staff-assignments/${a2}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_owner: $.data.error_id }
            - call: "POST /staff-assignments/${a1}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { a1_att: $.data.attendance_status, a1_late: $.data.late_check_in, a1_in: $.data.check_in_at }
            - call: "POST /staff-assignments/${a2}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
              captures: { a2_att: $.data.attendance_status, a2_pay: $.data.payout_status }
          assert:
            - "${err_no_show} == 'ERR_ROLE_NOT_PERMITTED' and ${err_release} == 'ERR_ROLE_NOT_PERMITTED', both HTTP 403 - the action inside the body, not the path, decides"
            - "${err_owner} == 'ERR_NOT_RESOURCE_OWNER' with HTTP 403 - CHECK_IN is available to the role but only on the caller's own row, and priority 7 is reached only because priority 2 passed"
            - "${a1_att} == 'CHECKED_IN', ${a1_late} == false and ${a1_in} == '2026-09-12T18:00:00Z' - exactly at shift_start, inside the 5-minute grace"
            - "${a2_att} == 'NO_SHOW' and ${a2_pay} == 'VOIDED' when the coordinator sends the same action the worker was refused"
            - "the three refusals left StaffAssignment.${a2} in 'SCHEDULED' with check_in_at null, and PositionSlot.${slot_id}.filled_headcount was 2 before the NO_SHOW"

      - name: peer_roles_shared_resolve_works_for_both_supervisor_and_director
        claim_type: role_shared_operations
        grounds:
          - roles.GuestExperienceDirector
          - roles.GuestServicesSupervisor
          - conditional_role_rules
          - endpoints[POST /guest-issues/{id}/resolve]
          - endpoints[POST /satisfaction-responses]
          - state_machines.GuestIssue.IN_PROGRESS_to_ESCALATED
        distinguishing_aspect: >-
          The peer pair genuinely shares resolve and satisfaction-response - both roles succeed on
          both - yet the same resolve endpoint becomes director-exclusive the moment the issue is
          ESCALATED: the supervisor who could resolve it a minute earlier from IN_PROGRESS is now
          refused with ERR_ROLE_NOT_PERMITTED.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event with a LOCKED plan."
            - "One ACTIVE member with a VALID CODE_OF_CONDUCT certification."
            - "Three MEDIUM / OTHER GuestIssues reported at 19:00Z (SLA deadline 19:45Z) and all three assigned so they are IN_PROGRESS: gi_1, gi_2 and gi_3."
            - "The clock is then moved to 19:46Z so gi_3's SLA is breached and it can be escalated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Peer Roles Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Issue one" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_1: $.data.id, gi_1_deadline: $.data.sla_deadline }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Issue two" }
              as: GuestExperienceDirector
              as_user_id: "dir-9"
              captures: { gi_2: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Issue three" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_3: $.data.id }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /guest-issues/${gi_2}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /guest-issues/${gi_3}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:46:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /guest-issues/${gi_3}/escalate"
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { gi_3_status: $.data.status, gi_3_breached: $.data.sla_breached }
          trigger:
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { gi_1_status: $.data.status, gi_1_resolver: $.data.resolved_by_user_id }
            - call: "POST /guest-issues/${gi_2}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { gi_2_status: $.data.status, gi_2_resolver: $.data.resolved_by_user_id }
            - call: "POST /guest-issues/${gi_3}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { err_escalated: $.data.error_id }
            - call: "POST /guest-issues/${gi_3}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { gi_3_resolved: $.data.status, gi_3_resolver: $.data.resolved_by_user_id }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z100", score: 4 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { sr_sup: $.data.submitted_by_user_id }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z100", score: 5 }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { sr_dir: $.data.submitted_by_user_id }
          assert:
            - "${gi_1_deadline} == '2026-09-12T19:45:00Z' (MEDIUM => 45 minutes) and ${gi_3_breached} == true at 19:46Z, which is what let the escalate through"
            - "${gi_3_status} == 'ESCALATED'"
            - "${gi_1_status} == 'RESOLVED' with ${gi_1_resolver} == 'sup-1' and ${gi_2_status} == 'RESOLVED' with ${gi_2_resolver} == 'dir-1' - resolve from IN_PROGRESS is genuinely shared"
            - "${err_escalated} == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 - the same supervisor, the same endpoint, the same resolution_type, refused only because the status is ESCALATED"
            - "${gi_3_resolved} == 'RESOLVED' and ${gi_3_resolver} == 'dir-1'"
            - "${sr_sup} == 'sup-1' and ${sr_dir} == 'dir-1' - both peers may key a satisfaction response"
            - "the CRITICAL child issue created by the escalate is untouched by any of these calls and is still IN_PROGRESS or REPORTED per its own lifecycle"

      - name: supervisor_cannot_read_staffing_model_recommendation
        claim_type: role_exclusive_operations
        grounds:
          - roles.GuestExperienceDirector
          - roles.StaffingCoordinator
          - roles.GuestServicesSupervisor
          - endpoints[GET /events/{id}/staffing-model-recommendation]
          - endpoints[GET /events/{id}/satisfaction-summary]
          - errors[ERR_EVENT_STATE_INVALID]
        distinguishing_aspect: >-
          The two computed reads have mirror-image role sets, which is the sharpest expression of the
          segregation model: the recommendation is director-plus-coordinator and refuses the
          supervisor, the satisfaction summary is director-plus-supervisor and refuses the coordinator,
          and the worker is refused both - while a non-CLOSED event refuses even the director with
          ERR_EVENT_STATE_INVALID.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T23:30:00Z."
            - "Event A is CLOSED, with a LOCKED plan carrying one TICKET_TAKER slot and two satisfaction responses (scores 4 and 5 in Z100)."
            - "Event B is still PLANNED."
            - "One member id is available to use as a StaffMember X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T23:30:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Mirror Reads A", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_a: $.data.id, ev_a_v1: $.data.version }
            - call: "POST /events"
              payload: { name: "Mirror Reads B", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_b: $.data.id }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_a}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_a}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Worker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staffing-plans/${plan_a}/activate"
              payload: { expected_event_version: "${ev_a_v1}" }
              as: StaffingCoordinator
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_a}", zone_code: "Z100", score: 4 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { sr_1: $.data.id }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_a}", zone_code: "Z100", score: 5 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { sr_2: $.data.id }
            - call: "POST /events/${ev_a}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /events/${ev_a}/lifecycle"
              payload: { target_status: "CLOSED" }
              as: GuestExperienceDirector
              captures: { ev_a_status: $.data.status }
          trigger:
            - call: "GET /events/${ev_a}/staffing-model-recommendation"
              as: GuestExperienceDirector
              captures: { rec_dir_understaffed: $.data.understaffed_slot_count, rec_dir_avg: $.data.average_score, rec_dir_event: $.data.event_id }
            - call: "GET /events/${ev_a}/staffing-model-recommendation"
              as: StaffingCoordinator
              captures: { rec_coord_understaffed: $.data.understaffed_slot_count, rec_coord_avg: $.data.average_score }
            - call: "GET /events/${ev_a}/staffing-model-recommendation"
              as: GuestServicesSupervisor
              captures: { err_rec_sup: $.data.error_id }
            - call: "GET /events/${ev_a}/staffing-model-recommendation"
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_rec_member: $.data.error_id }
            - call: "GET /events/${ev_a}/satisfaction-summary"
              as: GuestServicesSupervisor
              captures: { sum_sup_count: $.data.response_count, sum_sup_avg: $.data.average_score }
            - call: "GET /events/${ev_a}/satisfaction-summary"
              as: GuestExperienceDirector
              captures: { sum_dir_count: $.data.response_count }
            - call: "GET /events/${ev_a}/satisfaction-summary"
              as: StaffingCoordinator
              captures: { err_sum_coord: $.data.error_id }
            - call: "GET /events/${ev_a}/satisfaction-summary"
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_sum_member: $.data.error_id }
            - call: "GET /events/${ev_b}/staffing-model-recommendation"
              as: GuestExperienceDirector
              captures: { err_rec_state: $.data.error_id }
          assert:
            - "${ev_a_status} == 'CLOSED'"
            - "${rec_dir_event} == ${ev_a}, ${rec_dir_understaffed} == 1 (the one slot required 2 heads and nobody worked it) and ${rec_dir_avg} == 4.50"
            - "${rec_coord_understaffed} == ${rec_dir_understaffed} and ${rec_coord_avg} == ${rec_dir_avg} - the coordinator gets a byte-identical body, so this is a shared read, not a director read the coordinator happens to reach"
            - "${err_rec_sup} == 'ERR_ROLE_NOT_PERMITTED' and ${err_rec_member} == 'ERR_ROLE_NOT_PERMITTED', both HTTP 403"
            - "${sum_sup_count} == 2 with ${sum_sup_avg} == 4.50, and ${sum_dir_count} == 2"
            - "${err_sum_coord} == 'ERR_ROLE_NOT_PERMITTED' and ${err_sum_member} == 'ERR_ROLE_NOT_PERMITTED', both HTTP 403 - the exact inverse exclusion of the recommendation read"
            - "${err_rec_state} == 'ERR_EVENT_STATE_INVALID' with HTTP 409 on the PLANNED event ${ev_b} - the role check passed first, then the state check refused it"

      - name: reporter_cannot_decide_the_refund_on_their_own_issue
        claim_type: segregation_of_duties
        grounds:
          - roles
          - conditional_role_rules
          - validations[priority 8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - calculations.refund_authorized_amount
        distinguishing_aspect: >-
          Segregation is enforced on X-User-ID and not on role: the reporter 'sup-9' is refused even
          when they present the director role, and the requester 'sup-1' is refused as well, so the
          money only moves when a third user 'sup-2' decides - three distinct users are structurally
          required to complete one refund.
