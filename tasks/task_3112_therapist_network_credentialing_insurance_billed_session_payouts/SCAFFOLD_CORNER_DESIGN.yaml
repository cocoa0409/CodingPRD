        distinguishing_aspect: "The cap is expressed on the counter rather than on the clock, so the third resubmit is refused with 422 ERR_RESUBMISSION_LIMIT_REACHED while the clock is still comfortably inside the filing window."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z; a billed session whose claim is denied and then resubmitted twice back into SUBMITTED."
          setup_api_calls:
            - *c_clock
