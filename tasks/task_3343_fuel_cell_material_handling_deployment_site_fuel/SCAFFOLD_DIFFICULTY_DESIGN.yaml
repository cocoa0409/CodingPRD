      - name: assessment_reject_revise_resubmit_loop
        grounds:
          - state_machines.Assessment.SUBMITTED_to_REJECTED
          - state_machines.Assessment.REJECTED_to_DRAFT
        distinguishing_aspect: |
          Assessment (different entity than FuelInvoice) has a revision cycle
          SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> APPROVED: the loop count
          is unbounded and the re-submitted assessment can still reach APPROVED,
          which then unlocks conversion-plan scheduling.
        test_recipe:
          setup:
            - "Site with a DRAFT assessment (forklift_count 4, duty 8h, peak 8)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
