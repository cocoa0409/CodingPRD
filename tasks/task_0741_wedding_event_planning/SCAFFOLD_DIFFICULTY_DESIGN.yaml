            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
