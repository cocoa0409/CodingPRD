          PARALLEL DIMENSIONS ON ONE ROW. administrative_status and compliance_status advance on
          disjoint trigger sets and their state names do not overlap, so one permit walks through
          four distinct combined states — (ACTIVE, COMPLIANT), (ACTIVE, PROBATION),
