# =============================================================================
# Task 1858 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and is replayable from empty-DB via its setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: facility_risk_baseline_vs_history_adjusted
        grounds:
          - calculations.facility_risk_score
          - entities.Facility.fields.risk_score_baseline
          - entities.Facility.fields.risk_score_history
          - state_machines.Audit.REPORT_SUBMITTED_to_COMPLETED
        distinguishing_aspect: |
          Facility-domain dual variant: the BASELINE variant (country risk x sector
          multiplier + worker factor) and the HISTORY_ADJUSTED variant (50% baseline +
          50% finding-history component) are both computed from the SAME facility data
          and MUST differ — baseline 87.0 vs history 48.0 — and risk_tier flips HIGH ->
          MEDIUM purely because the applicable variant switched at the audit's terminal
          transition (unlike the supplier scorecard instance, which is a Supplier-domain
          provisional-vs-verified divergence).
        test_recipe:
          setup:
            - "Supplier (APPAREL) ACTIVE with published code acknowledged; facility BD / 1200 workers -> baseline 60*1.2+15 = 87.0, tier HIGH, history null"
            - "Audit INITIAL ANNOUNCED [2026-09-01, 2026-09-03) started, interview sample satisfied (min ceil(sqrt(1200)) = 35), findings 2 MAJOR + 1 MINOR recorded (no ZT), report submitted and accepted"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR", "CHILD_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Acme Apparel Ltd", country_code: "BD", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "S Rahman", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Dhaka Plant 1", country_code: "BD", worker_count: 1200, processes: ["cutting", "sewing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "GET /facilities/${fac_id}/scoping", payload: {}, as: ComplianceOfficer, captures: { pre_tier: $.data.risk_tier, pre_hist: $.data.risk_score_history, pre_base: $.data.risk_score_baseline } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["BD", "US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-03T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/worker-interviews", payload: { interview_count: 35, forced_labor_indicators: false, recruitment_fee_indicators: false }, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WORKING_HOURS", description: "Excessive overtime beyond legal limits" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_maj1: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WAGES", description: "Overtime premium underpaid" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_maj2: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MINOR", category: "HEALTH_SAFETY", description: "Missing signage in one workshop" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_min: $.data.id } }
            - { call: "POST /audits/${au_id}/submit-report", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
          trigger:
            - { call: "POST /audits/${au_id}/decide", payload: { decision: "COMPLETE" }, as: ComplianceOfficer }
            - { call: "GET /facilities/${fac_id}/scoping", payload: {}, as: ComplianceOfficer, captures: { post_tier: $.data.risk_tier, post_hist: $.data.risk_score_history, post_base: $.data.risk_score_baseline, post_ivl: $.data.next_audit_interval_months } }
          assert:
            - "pre-completion: ${pre_base} == 87.0 and ${pre_tier} == HIGH and ${pre_hist} == null (baseline variant applies before any terminal audit)"
            - "post-completion on identical facility inputs: ${post_base} == 87.0 but ${post_hist} == 48.0 (round_half_up(0.5*87.0 + 0.5*min(100, 10*0+4*2+1*1), 1) = 48.0)"
            - "${post_tier} == MEDIUM (48.0 >= 40, < 70) and ${post_ivl} == 12 (TIER_BASE_MONTHS[MEDIUM])"

      - name: supplier_scorecard_provisional_vs_verified
        grounds:
          - calculations.supplier_scorecard_scores
          - entities.Supplier.fields.provisional_score
          - entities.Supplier.fields.verified_score
          - state_machines.CorrectiveActionPlan.VERIFICATION_REQUESTED_to_VERIFIED_PASSED
        distinguishing_aspect: |
          Supplier-domain dual variant (different entity domain than the facility risk
          instance): PROVISIONAL counts every non-VOIDED finding even after verified
          remediation, VERIFIED counts only OPEN findings — with 1 ZT open, 1 MAJOR
          open, 1 MAJOR verified-closed, 1 MINOR verified-closed and 1 unresolved
          CRITICAL grievance, the SAME data yields provisional 32 vs verified 45.
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility US / 10 workers; audit started; findings recorded in order MAJOR(WORKING_HOURS), MAJOR(WAGES), MINOR(HEALTH_SAFETY), ZERO_TOLERANCE(FORCED_LABOR) — the ZT record auto-fails the audit (FAILED_ZT) and drops the supplier to PROBATION"
            - "CAPs for the first MAJOR and the MINOR each pass the full cycle (create -> approve -> request-verification -> verify PASS by a second auditor), so those two findings are VERIFIED_CLOSED; the second MAJOR and the ZT remain OPEN"
            - "One CRITICAL grievance unresolved at the facility"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR", "CHILD_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Beta Goods Inc", country_code: "US", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "J Doe", signer_title: "COO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Riverside DC", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Verifier", firm_name: "VerifyCo", certifications: ["SMETA"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud2_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "ANNUAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-03T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WORKING_HOURS", description: "Overtime beyond 60h" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_majA: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WAGES", description: "Missing premium pay" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_majB: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MINOR", category: "HEALTH_SAFETY", description: "Blocked exit sign" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_minC: $.data.id } }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "ZERO_TOLERANCE", category: "FORCED_LABOR", description: "Passports withheld" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_zt: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { finding_id: "${f_majA}", actions: [{ description: "Cap overtime at 60h", owner: "HR", due_date: "2026-10-01T00:00:00Z" }] }, as: SupplierContact, as_user_id: "${sup_id}", captures: { capA: $.data.id } }
            - { call: "POST /corrective-action-plans/${capA}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /corrective-action-plans/${capA}/request-verification", payload: {}, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /corrective-action-plans/${capA}/verify", payload: { outcome: "PASS", verification_note: "Verified on site" }, as: Auditor, as_user_id: "${aud2_id}" }
            - { call: "POST /corrective-action-plans", payload: { finding_id: "${f_minC}", actions: [{ description: "Replace exit sign", owner: "Maintenance", due_date: "2026-10-01T00:00:00Z" }] }, as: SupplierContact, as_user_id: "${sup_id}", captures: { capC: $.data.id } }
            - { call: "POST /corrective-action-plans/${capC}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /corrective-action-plans/${capC}/request-verification", payload: {}, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /corrective-action-plans/${capC}/verify", payload: { outcome: "PASS", verification_note: "Sign restored" }, as: Auditor, as_user_id: "${aud2_id}" }
            - { call: "POST /grievances", payload: { facility_id: "${fac_id}", channel: "HOTLINE", category: "WAGES", severity: "CRITICAL", description: "Unpaid wages for two months" }, as: WorkerHotline, captures: { g_id: $.data.id } }
          trigger:
            - { call: "GET /suppliers/${sup_id}/scorecard", payload: {}, as: ComplianceOfficer, captures: { prov: $.data.provisional_score, ver: $.data.verified_score, tier: $.data.consequence_tier } }
            - { call: "GET /suppliers/${sup_id}", payload: {}, as: ComplianceOfficer, captures: { sup_status: $.data.status } }
          assert:
            - "${prov} == 32 (100 - 40*1 - 10*2 - 3*1 - 5*1: verified closures give NO credit in the provisional variant)"
            - "${ver} == 45 (100 - 40*1 - 10*1 - 3*0 - 5*1: the VERIFIED_CLOSED MAJOR and MINOR restore their deductions)"
            - "${tier} == PROBATION_WATCH (45 in [40, 59]) and ${sup_status} == PROBATION (an OPEN zero-tolerance finding exists)"

  - rule_id: combinatorial_formula
    instances:
      - name: recruitment_fee_per_item_rounding_then_sum
        grounds:
          - calculations.recruitment_fee_reimbursement_total
          - entities.RecruitmentFeeReview.fields.total_reimbursement_cents
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding order: the scaffold pins
          round-per-item-then-sum, so 3 items of 300 BDT minor units at 0.0115 yield
          round_half_up(3.45)=3 per item -> total 9 cents; the rejected sum-then-round
          order would yield round_half_up(10.35)=10. Distinct mode from the
          audit_interval instance (mode (a): tiered selection + nested min/clamp).
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility US / 10 workers; audit IN_PROGRESS (clock at 2026-09-01)"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR", "CHILD_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Coral Foods Co", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "A Cruz", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Fresno Plant", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-03T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
          trigger:
            - { call: "POST /audits/${au_id}/recruitment-fee-reviews", payload: { workers_assessed: 3, fee_items: [{ worker_ref: "W1", amount_minor_units: 300, currency: "BDT" }, { worker_ref: "W2", amount_minor_units: 300, currency: "BDT" }, { worker_ref: "W3", amount_minor_units: 300, currency: "BDT" }] }, as: Auditor, as_user_id: "${aud_id}", captures: { rev_id: $.data.id, total: $.data.total_reimbursement_cents, out: $.data.outstanding_reimbursement_cents, rev_status: $.data.status } }
          assert:
            - "${total} == 9 (per-item round_half_up(300 * 0.0115) = 3 each, summed 3+3+3); MUST NOT equal 10 (the sum-then-round order)"
            - "${out} == 9 and ${rev_status} == PENDING_CONFIRMATION"

      - name: audit_interval_tiered_min_clamp
        grounds:
          - calculations.next_audit_interval
          - calculations.facility_risk_score
          - state_machines.MutualRecognitionClaim.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Combinatorial mode (a) — a >=3-input non-linear formula: tier base (12 for
          MEDIUM after the history variant re-tier), nested min with FAILED_ZT_CAP (3),
          additive mutual-recognition validity extension (+12 for SMETA), final clamp
          to [3, 36]; the same facility without any one input yields a different
          interval (12, 3, or 15). Distinct mode from the fee-rounding instance.
        test_recipe:
          setup:
            - "Supplier (APPAREL) ACTIVE; facility BD / 1200 workers (baseline 87.0, HIGH)"
            - "Audit FAILED_ZT via one ZERO_TOLERANCE(FORCED_LABOR) finding; the ZT finding then remediated to VERIFIED_CLOSED through the CAP cycle (second auditor verifies), so mutual-recognition acceptance is unblocked"
            - "SMETA claim (external_score 80 >= 75, external_audit_date 2026-07-01 within 12 months of the 2026-09-01 clock) ACCEPTED"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR", "CHILD_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Delta Textiles", country_code: "BD", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "R Karim", signer_title: "MD", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Chattogram Knit", country_code: "BD", worker_count: 1200, processes: ["knitting"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["BD"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Verifier", firm_name: "VerifyCo", certifications: ["SMETA"], country_codes_covered: ["BD"] }, as: AuditCoordinator, captures: { aud2_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-03T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "ZERO_TOLERANCE", category: "FORCED_LABOR", description: "Recruitment debt bondage" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_zt: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { finding_id: "${f_zt}", actions: [{ description: "Repay recruitment fees", owner: "HR", due_date: "2026-09-20T00:00:00Z" }] }, as: SupplierContact, as_user_id: "${sup_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /corrective-action-plans/${cap_id}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /corrective-action-plans/${cap_id}/request-verification", payload: {}, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /corrective-action-plans/${cap_id}/verify", payload: { outcome: "PASS", verification_note: "Fees repaid with receipts" }, as: Auditor, as_user_id: "${aud2_id}" }
            - { call: "POST /mutual-recognition-claims", payload: { facility_id: "${fac_id}", program_name: "SMETA", external_audit_ref: "EXT-2026-118", external_audit_date: "2026-07-01T00:00:00Z", external_score: 80 }, as: SupplierContact, as_user_id: "${sup_id}", captures: { claim_id: $.data.id } }
            - { call: "POST /mutual-recognition-claims/${claim_id}/decide", payload: { decision: "ACCEPT" }, as: ComplianceOfficer }
          trigger:
            - { call: "GET /facilities/${fac_id}/scoping", payload: {}, as: ComplianceOfficer, captures: { tier: $.data.risk_tier, hist: $.data.risk_score_history, ivl: $.data.next_audit_interval_months, due: $.data.next_audit_due_date } }
          assert:
            - "${hist} == 48.5 (round_half_up(0.5*87.0 + 0.5*min(100, 10*1), 1)) and ${tier} == MEDIUM"
            - "${ivl} == 15 (TIER_BASE 12 -> min(12, FAILED_ZT_CAP 3) = 3 -> + SMETA validity 12 = 15 -> clamp [3,36] keeps 15)"
            - "${due} == 2027-12-03T00:00:00Z (latest terminal audit scheduled_end 2026-09-03 + 15 months)"

  - rule_id: non_linear_state_machine
    instances:
      - name: audit_report_return_correction_cycle
        grounds:
          - state_machines.Audit.REPORT_SUBMITTED_to_IN_PROGRESS
          - state_machines.Audit.IN_PROGRESS_to_REPORT_SUBMITTED
          - state_machines.Audit.REPORT_SUBMITTED_to_COMPLETED
        distinguishing_aspect: |
          Cyclic machine on Audit: IN_PROGRESS -> REPORT_SUBMITTED -> IN_PROGRESS
          (return for correction) -> REPORT_SUBMITTED -> COMPLETED — the loop edge is
          what makes this non-linear, and the second submit succeeds on the SAME audit
          because the worker interview record is retained. The paired instance exercises
          a different entity (CorrectiveActionPlan).
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility US / 10 workers (min sample 4); audit ANNOUNCED [2026-09-01, 2026-09-02) assigned to the lead auditor; clock at 2026-09-01"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Echo Electronics", country_code: "US", sector: "ELECTRONICS" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "K Lee", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Austin Assembly", country_code: "US", worker_count: 10, processes: ["smt"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["RBA"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "ANNUAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/worker-interviews", payload: { interview_count: 4, forced_labor_indicators: false, recruitment_fee_indicators: false }, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/submit-report", payload: {}, as: Auditor, as_user_id: "${aud_id}", captures: { st1: $.data.status } }
          trigger:
