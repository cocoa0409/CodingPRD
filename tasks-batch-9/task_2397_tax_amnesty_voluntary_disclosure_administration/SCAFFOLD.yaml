  - method: POST
    path: /amnesty/agreements/{id}/declare-breach
    purpose: "Declare the agreement breached, reinstate every waived amount and escalate enforcement"
    input: ["breach_reason"]
    output: VoluntaryDisclosureAgreement
    side_effects: ["status := BREACHED; breach_reason := payload.breach_reason", "reinstated_amount_cents := the total waiver clawed back; waived_amount_cents := 0", "each FILED, ASSESSED or SETTLED return becomes REINSTATED with payable_* := gross_* and waived_* := 0", "an ACTIVE PaymentPlan becomes DEFAULTED with default_reason BREACH_CASCADE and its SCHEDULED or LATE installments become VOIDED", "payment_status := DELINQUENT", "creates an EnforcementAction in ISSUED with origin BREACH_CASCADE on the reinstated amount", "recomputes Taxpayer.open_enforcement_action_count and compliance_behavior_score", "recomputes AmnestyProgram.reinstated_total_cents and waived_total_cents", "increments VoluntaryDisclosureAgreement.version by 1"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AGREEMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_AGREEMENT_NOT_EXECUTED, ERR_NOTHING_TO_REINSTATE]
  - method: POST
    path: /amnesty/agreements/{id}/rescind-breach
    purpose: "Rescind a breach declaration and compensate every side effect it produced"
    input: ["rescind_reason"]
    output: VoluntaryDisclosureAgreement
    side_effects: ["status := EXECUTED; breach_reason := null", "every REINSTATED return is restored to SETTLED or FILED with its waiver recomputed", "reinstated_amount_cents := 0; waived_amount_cents and total_due_cents recomputed", "a PaymentPlan defaulted by the cascade returns to ACTIVE and its VOIDED installments return to SCHEDULED with paid_cents preserved", "every BREACH_CASCADE EnforcementAction of this agreement becomes ABATED with abatement_reason BREACH_RESCINDED", "recomputes Taxpayer.open_enforcement_action_count and compliance_behavior_score", "recomputes AmnestyProgram.reinstated_total_cents and waived_total_cents", "increments VoluntaryDisclosureAgreement.version by 1"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AGREEMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_AGREEMENT_NOT_BREACHED]
