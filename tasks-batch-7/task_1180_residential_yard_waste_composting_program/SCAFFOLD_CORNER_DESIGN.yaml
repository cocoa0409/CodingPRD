            - "capture ${bk_c_st} == WAITLISTED"
            - "SurgeBooking.${bk_b}.status == CONFIRMED"
            - "SurgeBooking.${bk_c}.status == WAITLISTED"
            - "SurgeEvent.${ev}.reserved_slots == 1"

      - name: credit_invariant_covered
        claim_type: invariant
        grounds:
          - "calculations.service_credit_balance"
        excluded_because: { difficulty_instance: "credit_approve_then_void_balance_unchanged", rationale: "Approve+void balance conservation asserted there." }
      - name: slot_invariant_covered
        claim_type: invariant
        grounds:
          - "calculations.surge_slot_allocation"
        excluded_because: { difficulty_instance: "surge_book_then_cancel_slots_unchanged", rationale: "Book+cancel slot conservation asserted there." }
      - name: cascade_contamination_suspension_covered
        claim_type: cascading_side_effects
        grounds:
