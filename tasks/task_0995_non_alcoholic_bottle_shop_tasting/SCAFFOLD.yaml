    side_effects: []
  - method: GET
    path: "/nabs/skus/{id}/special-orders"
    description: "Reverse-reachability: special orders resolved to this SKU"
    roles: [PlatformAdmin, ShopStaff]
    code: 200
    input: ["limit?", "offset?"]
