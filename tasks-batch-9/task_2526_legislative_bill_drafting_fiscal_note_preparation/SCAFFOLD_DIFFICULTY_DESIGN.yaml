  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: rescinding_an_adopted_amendment_restores_the_session_certified_ledger_bit_identically
        grounds:
          - state_machines.Amendment.ADOPTED_to_DRAFTED
          - state_machines.Bill.fiscal_status.NOTE_STALE_to_NOTE_COMPLETE
          - state_machines.FiscalNoteRequest.ROUTED_to_CERTIFIED
          - calculations.session_certified_fiscal_ledger
          - entities.Session.fields.certified_fiscal_total_cents
          - entities.Session.fields.fiscal_posture
        distinguishing_aspect: |
          Conserved quantity type: MONEY (integer cents in
          Session.certified_fiscal_total_cents). The adopt debited exactly 50000000
          and flipped the posture off CONSTRAINED; the rescind must re-post the SAME
          retained amount, not a re-derivation from cost lines, so the ledger returns
          to 50000000 exactly and the posture returns to CONSTRAINED. Every satellite
          counter the adopt touched (Agency.open_request_count,
          Bill.adopted_amendment_count, Bill.adopted_fiscal_delta_cents) must also
          return to its pre-adoption value, with rescind_count as the only new
          evidence that anything happened.
        test_recipe:
          setup:
            - "Exactly the state reached at the end of amendment_adoption_cascades_four_levels_from_bill_fiscal_status_to_session_posture: a FLOOR amendment with fiscal_impact_delta_cents 750000 has been ADOPTED on a REPORTED bill whose 50000000-cent note was re-opened."
            - "Before the adopt the ledger read 50000000 with fiscal_posture CONSTRAINED, Agency.open_request_count 0, Bill.adopted_amendment_count 0 and Bill.adopted_fiscal_delta_cents 0."
            - "After the adopt the ledger reads 0 with fiscal_posture NORMAL, the note is ROUTED with revision_round 1 and reopened_by_amendment_id set, and Agency.open_request_count is 1."
            - "No other amendment of this bill is ADOPTED, so the rescission removes the last fiscally material one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
