            - "Trigger call 9: data.state is STILL HELD with hold_reason UPSTREAM_RUN_REPIN - the repin side-effect list touches the run only; nothing cascades back down to the deliverable"
            - "Trigger call 10: HTTP 409 with ${rel_err} == ERR_RUN_NOT_PUBLISHED - a release is refused while the upstream run is only OPEN (validation priority 47)"
            - "Trigger calls 11-13: HTTP 200; the run walks OPEN -> EDITED -> WEIGHTED -> PUBLISHED again, and because ${d1_98} is HELD and not SCHEDULED at publication time it is NOT in the due_at fan-out"
            - "Trigger call 14: HTTP 200 with data.state == SCHEDULED (exactly held_from_state), data.hold_reason == null, data.held_from_state == null and data.due_at == null - the publication that would have stamped due_at happened while the row was held"
            - "Trigger call 15: data.held_deliverable_count == 0 but data.delivery_sla_credit_cents is STILL 3250 - release decrements the counter and never reverses the credit"

      - name: pinned_rule_set_survives_its_own_supersession_on_a_published_run
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers[version_pinning_on_approval]
          - state_machines[MethodologyChange NOTIFIED -> EFFECTIVE]
          - validations[priority 35]
        distinguishing_aspect: "Approval-time pinning is proven by a contradiction that must be allowed to stand: after activation the PUBLISHED run still points at an edit rule set whose status is now SUPERSEDED, keeps its projected_average_audience, and the notification keeps the delta disclosed at notify time - while a NEW run with that same pin is refused. Old work is frozen at its approved version; new work must use the successor."
