            - call: "POST /governance/training-records"
              payload: { member_id: "${mem_chair_id}", module_code: "IPS_MECHANICS", status: "WAIVED", waiver_basis: "ASPPA QKA credential renewed 2028-05-31" }
              as: PlanSponsorAdmin
