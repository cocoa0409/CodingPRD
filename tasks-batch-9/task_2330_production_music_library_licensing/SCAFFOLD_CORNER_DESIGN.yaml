            - "Call 2 → 422 with data.error_id == \"ERR_SCALE_NOT_ALLOWED_FOR_TIER\" (media_type GAME disagrees with the tier's FILM)"
            - "Call 3 → 201 with status \"SUBMITTED\" and requested_term_months 36 (the range is not checked at creation)"
            - "Call 5 → 422 with data.error_id == \"ERR_TERM_OUTSIDE_TIER_RANGE\" and SyncRequest.${sr1}.status stays \"UNDER_REVIEW\" with quoted_fee_cents null"
            - "Call 8 → 200 with SyncRequest.${sr2}.quoted_fee_cents == 1254000 (600000 * 2.20 * 1.00 * 1.00 = 1320000, 5.00% discount → 1320000 - 66000) and quoted_discount_pct == 5.00"

      - name: accept_priority_ladder_not_found_then_unauthorized_then_mismatch
