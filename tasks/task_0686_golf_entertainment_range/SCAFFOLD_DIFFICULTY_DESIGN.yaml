              as: Guest
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /golf/reservations/${res_id}/confirm"
              payload: { expected_bay_version: "${bay_v}" }
              as: Guest
              as_user_id: "${m_id}"
