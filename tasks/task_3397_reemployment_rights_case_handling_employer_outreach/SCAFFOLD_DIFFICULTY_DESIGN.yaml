  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_requires_ombudsman_certified
        grounds:
          - state_machines.ReemploymentCase.TRIAGE_to_ASSIGNED
          - state_machines.Ombudsman.CERTIFIED_to_EXPIRED
          - errors.ERR_OMBUDSMAN_NOT_CERTIFIED
        distinguishing_aspect: |
          Entity pair Case -> Ombudsman: the TRIAGE -> ASSIGNED transition is
          gated on the Ombudsman's status being CERTIFIED — failed for a
          TRAINEE and again for a lapsed EXPIRED volunteer. Different entity
          pair from the Referral -> Case sibling.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One TRIAGE case. Ombudsman T is a TRAINEE (no training); ombudsman E was CERTIFIED but the clock is later pushed past expiry."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_member
            - *k_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
            - call: "POST /reemployment/ombudsmen"
              payload: { full_name: "Un Trained", email: "un@example.com" }
              as: Anonymous
              captures: { ot_id: $.data.id }
            - *k_omb_std
            - *k_tra
            - *k_trb
            - *k_trc
            - *k_cert
          trigger:
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${ot_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
              captures: { err_trainee: $.data.error_id }
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "GET /reemployment/ombudsmen/${omb_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { stale_status: $.data.status }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
              captures: { err_expired: $.data.error_id }
          assert:
            - "err_trainee == ERR_OMBUDSMAN_NOT_CERTIFIED (409) for the TRAINEE"
            - "stale_status == EXPIRED after the clock passes 2028-09-01 (lazy flip on read)"
            - "err_expired == ERR_OMBUDSMAN_NOT_CERTIFIED (409) for the lapsed volunteer"
            - "ReemploymentCase.${case_id}.status is still TRIAGE with assigned_ombudsman_id null"

      - name: referral_submit_requires_case_escalation_pending
        grounds:
          - state_machines.Referral.initial_state
          - entities.Referral.fields.case_id
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair Referral -> Case: POST /reemployment/referrals is gated
          on the case being ESCALATION_PENDING — rejected while the case is
          merely ASSIGNED, accepted once escalated. Different entity pair
          from the Case -> Ombudsman sibling.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman assigned to a case in ASSIGNED (no rounds yet)."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_omb_std
            - *k_tra
            - *k_trb
            - *k_trc
            - *k_cert
            - *k_member
            - *k_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/referrals"
              payload: { case_id: "${case_id}", agency: "DOL_VETS", summary: "Premature referral attempt." }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { err_early: $.data.error_id }
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rx1_id: $.data.id }
            - call: "POST /reemployment/mediation-rounds/${rx1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "ESCALATION_PENDING" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/referrals"
              payload: { case_id: "${case_id}", agency: "DOL_VETS", summary: "Timely referral after escalation." }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { ref_ok: $.data.id }
          assert:
            - "err_early == ERR_INVALID_STATE (409): ASSIGNED case cannot take a referral"
            - "after escalation the same create returns 201 and Referral.${ref_ok}.status == DRAFT"
            - "GET /reemployment/cases/${case_id}/referrals returns exactly 1 row (the DRAFT) — the rejected attempt persisted nothing"

  - rule_id: resource_temporal_overlap
    instances:
      - name: member_service_periods_half_open_adjacency
        grounds:
          - errors.ERR_SERVICE_PERIOD_OVERLAP
          - entities.ServicePeriod.fields.start_date
          - entities.ServicePeriod.fields.end_date
        distinguishing_aspect: |
          Interval semantics = half-open [start_date, end_date) on the
          ServiceMember resource across ALL employers: back-to-back periods
          (end == next start) are allowed, a one-day-back overlap is
          rejected, and an ongoing (null end_date) period blocks everything
          after its start. Different resource and different interval
          semantics from the venue sibling.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member MM, employers E1 and E2."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - call: "POST /reemployment/employers"
              payload: { legal_name: "Riverstone Clinics", sector: "HEALTHCARE", size_tier: "MEDIUM" }
              as: ProgramCoordinator
              captures: { emp2_id: $.data.id }
            - call: "POST /reemployment/members"
              payload: { full_name: "Mel Ames", email: "mel@example.com", branch: "AIR_FORCE", component: "AIR_GUARD" }
              as: Anonymous
              captures: { mm_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mm_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", orders_type: "ACTIVE_DUTY" }
              as: ServiceMember
              as_user_id: "${mm_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mm_id}", employer_id: "${emp2_id}", start_date: "2026-03-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mm_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mm_id}", employer_id: "${emp2_id}", start_date: "2026-02-28T00:00:00Z", end_date: "2026-04-01T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mm_id}"
              captures: { err_olap: $.data.error_id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mm_id}", employer_id: "${emp_id}", start_date: "2026-06-01T00:00:00Z", orders_type: "ANNUAL_TRAINING" }
              as: ServiceMember
              as_user_id: "${mm_id}"
              captures: { p4_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mm_id}", employer_id: "${emp2_id}", start_date: "2026-07-01T00:00:00Z", end_date: "2026-08-01T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mm_id}"
              captures: { err_inf: $.data.error_id }
          assert:
            - "P2 adjacent at end == start is accepted (201) — half-open semantics"
            - "err_olap == ERR_SERVICE_PERIOD_OVERLAP (422) for the 2026-02-28 start intersecting P1"
            - "P4 ongoing (end_date null) is accepted (201)"
            - "err_inf == ERR_SERVICE_PERIOD_OVERLAP (422): an ongoing period extends to infinity"
            - "GET /reemployment/members/${mm_id}/service-periods returns exactly 3 rows (P1, P2, P4)"

      - name: venue_booking_closed_interval_with_buffer
        grounds:
          - errors.ERR_VENUE_DOUBLE_BOOKED
          - state_machines.OutreachEvent.OPEN_to_CANCELLED
          - entities.OutreachEvent.fields.venue
        distinguishing_aspect: |
          Interval semantics = CLOSED intervals plus a mandatory 60-minute
          teardown buffer on the venue resource: a new event starting 30
          minutes after another ends is rejected, one starting exactly at
          end+60min is accepted, and CANCELLED events are excluded from the
          comparison set. Different resource and different semantics from the
          member-period sibling.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No events yet."
          setup_api_calls:
            - *k_clock
            - call: "POST /reemployment/outreach-events"
              payload: { title: "Employer Briefing A", venue: "Hall-A", starts_at: "2026-10-10T10:00:00Z", ends_at: "2026-10-10T12:00:00Z", topic: "RIGHTS_OVERVIEW" }
              as: ProgramCoordinator
              captures: { eva_id: $.data.id }
          trigger:
            - call: "POST /reemployment/outreach-events"
              payload: { title: "Briefing B too soon", venue: "Hall-A", starts_at: "2026-10-10T12:30:00Z", ends_at: "2026-10-10T13:30:00Z", topic: "BENEFITS_BRIEFING" }
              as: ProgramCoordinator
              captures: { err_buf: $.data.error_id }
            - call: "POST /reemployment/outreach-events"
              payload: { title: "Briefing C exactly after buffer", venue: "Hall-A", starts_at: "2026-10-10T13:00:00Z", ends_at: "2026-10-10T14:00:00Z", topic: "BENEFITS_BRIEFING" }
              as: ProgramCoordinator
              captures: { evc_id: $.data.id }
            - call: "POST /reemployment/outreach-events"
              payload: { title: "Briefing D other venue", venue: "Hall-B", starts_at: "2026-10-10T11:00:00Z", ends_at: "2026-10-10T12:00:00Z", topic: "HIRING_FAIR" }
              as: ProgramCoordinator
              captures: { evd_id: $.data.id }
            - call: "POST /reemployment/outreach-events/${eva_id}/state"
              payload: { to_status: "CANCELLED" }
              as: ProgramCoordinator
            - call: "POST /reemployment/outreach-events"
              payload: { title: "Briefing E reuses cancelled slot", venue: "Hall-A", starts_at: "2026-10-10T10:30:00Z", ends_at: "2026-10-10T11:30:00Z", topic: "EMPLOYER_RECOGNITION" }
              as: ProgramCoordinator
              captures: { eve_id: $.data.id }
          assert:
            - "err_buf == ERR_VENUE_DOUBLE_BOOKED (422): 12:30 start is inside the 60-minute buffer after the 12:00 end"
            - "event C at exactly 13:00 (end + 60 min) is accepted (201)"
            - "event D at another venue overlapping in time is accepted (201)"
            - "after A is CANCELLED, event E overlapping A's old slot is accepted (201) — the comparison set excludes CANCELLED"
            - "OutreachEvent.${eva_id}.status == CANCELLED"

  - rule_id: compensating_invariant
    instances:
      - name: caseload_conserved_across_assign_and_resolve
        grounds:
          - calculations.ombudsman_caseload
          - state_machines.ReemploymentCase.AWAITING_RESPONSE_to_RESOLVED_INFORMAL
          - state_machines.ReemploymentCase.TRIAGE_to_ASSIGNED
        distinguishing_aspect: |
          Conserved quantity = the ombudsman's active_caseload: the assign
          (+1) paired with the informal resolution (-1) returns the derived
          count to baseline 0, and the field always equals the live count of
          assigned active-state cases. Different conserved quantity from the
          open-round-count sibling.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman with zero cases; one member case driven through full mediation with complete documentation."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_omb_std
            - *k_tra
            - *k_trb
            - *k_trc
            - *k_cert
            - *k_member
            - *k_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
            - call: "GET /reemployment/ombudsmen/${omb_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { cl0: $.data.active_caseload }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
            - call: "GET /reemployment/ombudsmen/${omb_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { cl1: $.data.active_caseload }
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "INTAKE", body: "Intake done." }
              as: ProgramCoordinator
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "CONTACT", body: "Employer contacted." }
              as: ProgramCoordinator
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "RESOLUTION", body: "Terms agreed in principle." }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate with back pay.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { inv_r1: $.data.id }
          trigger:
            - call: "POST /reemployment/mediation-rounds/${inv_r1}/respond"
              payload: { response: "ACCEPT" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /reemployment/ombudsmen/${omb_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { cl2: $.data.active_caseload }
            - call: "GET /reemployment/cases"
              payload: { assigned_ombudsman_id: "${omb_id}", status: "ASSIGNED" }
              as: ProgramCoordinator
          assert:
            - "cl0 == 0, cl1 == 1 (assign incremented), cl2 == 0 (resolve compensated)"
            - "ReemploymentCase.${case_id}.status == RESOLVED_INFORMAL and the round is ACCEPTED"
            - "GET /reemployment/cases?assigned_ombudsman_id=${omb_id}&status=ASSIGNED returns 0 rows, matching the derived field"
            - "invariant holds at every step: active_caseload == count of the ombudsman's cases in ASSIGNED | IN_MEDIATION | AWAITING_RESPONSE | ESCALATION_PENDING"

      - name: open_round_count_conserved_across_propose_and_respond
        grounds:
          - entities.ReemploymentCase.fields.open_round_count
          - state_machines.MediationRound.PROPOSED_to_DECLINED
          - state_machines.MediationRound.PROPOSED_to_COUNTERED
        distinguishing_aspect: |
          Conserved quantity = the case's open_round_count: opening a round
          (+1) paired with its terminal response (-1) returns the derived
          count to 0, twice in a row, and the field always equals the live
          count of PROPOSED rounds. Different conserved quantity from the
          caseload sibling.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman assigned to a case; two rounds opened and terminally responded (DECLINE, then COUNTER)."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_omb_std
            - *k_tra
            - *k_trb
            - *k_trc
            - *k_cert
            - *k_member
            - *k_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { orc0: $.data.open_round_count }
          trigger:
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Offer one.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { q1_id: $.data.id }
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { orc1: $.data.open_round_count }
            - call: "POST /reemployment/mediation-rounds/${q1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { orc2: $.data.open_round_count }
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Offer two.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { q2_id: $.data.id }
            - call: "POST /reemployment/mediation-rounds/${q2_id}/respond"
              payload: { response: "COUNTER", counter_text: "Half measure." }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { orc3: $.data.open_round_count }
          assert:
            - "orc0 == 0, orc1 == 1 (open incremented), orc2 == 0 (DECLINE compensated), orc3 == 0 (COUNTER compensated)"
            - "GET /reemployment/cases/${case_id}/rounds returns exactly 2 rows with statuses DECLINED and COUNTERED — zero PROPOSED, matching open_round_count"
            - "MediationRound.${q2_id}.counter_text == \"Half measure.\" was stored"
            - "invariant: open_round_count == count of the case's rounds in PROPOSED at every step"
