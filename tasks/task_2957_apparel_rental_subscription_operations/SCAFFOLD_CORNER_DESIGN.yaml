      - name: validation_fit_feedback_is_refused_before_the_return_and_refused_a_second_time
        claim_type: conditional_validation
        grounds:
          - "validations.priority 36"
          - "validations.priority 37"
          - "errors[ERR_FEEDBACK_NOT_ELIGIBLE]"
          - "errors[ERR_FEEDBACK_ALREADY_EXISTS]"
          - "entities.FitFeedback"
          - "endpoints.POST /reservations/{reservation_id}/fit-feedback"
        distinguishing_aspect: >-
          Eligibility is state-scoped to RETURNED or CLOSED, so the identical body is a 409
          ERR_FEEDBACK_NOT_ELIGIBLE while the garment is still IN_POSSESSION and a 201 the moment the INBOUND leg
          is received. The one-per-reservation rule then makes a replay of that same accepted body a 409
          ERR_FEEDBACK_ALREADY_EXISTS rather than an idempotent 201, and feedback_count must stay 1.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z by the PlatformAdmin clock endpoint"
