            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-9301", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 20, last_water_body_id: "${wb_prior}" }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_id: $.data.id }
            - call: "POST /inspection-records/${rec_id}/screening"
              payload: { expected_watercraft_version: "${wc_version}", residual_water_present: false, prior_water_body_id: "${wb_prior}" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /detection-reports"
              payload: { inspection_record_id: "${rec_id}", species_code: "DREISSENA_POLYMORPHA", detection_class: "LIVE_ORGANISM" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rep_id: $.data.id }
            - call: "POST /detection-reports/${rep_id}/submission"
              payload: { notes: "single live adult, retained" }
              as: Inspector
              as_user_id: "${insp_a}"
          trigger:
            - call: "POST /detection-reports/${rep_id}/state-acknowledgement"
              payload: { verdict: "ACCEPTED", state_db_ack_id: "AIS-2026-000512" }
              as: StateDataSteward
              as_user_id: "steward-77"
          assert:
            - "the trigger's own 200 response already shows data.status == ACCEPTED and data.state_db_ack_id == AIS-2026-000512"
            - "GET /water-bodies/${wb_prior} issued immediately afterwards already shows detection_count == 1 and live_detection_count == 1 - the counters do not lag one request behind"
            - "the same read already shows the escalated infestation_status, with no intervening write of any kind"
            - "GET /detection-reports?water_body_id=${wb_prior}&status=ACCEPTED immediately returns meta.total_count == 1, so the list projection is as fresh as the row"
            - "re-reading any of these a second time returns identical values: there is no convergence window to wait out"
