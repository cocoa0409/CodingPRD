            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/disputes", payload: { dispute_type: "ACCESS_OBSTRUCTION", description: "gate padlocked, crews turned away twice" }, as: Landowner, as_user_id: "${lo_id}", captures: { disp_id: $.data.id } }
          trigger:
