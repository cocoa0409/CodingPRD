# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not allowed on endpoint, or entity-backed caller touches a resource it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing required field, bad type, unknown enum member, syntactic range violation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path or body referenced id does not exist (checked left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state-machine from-state precondition fails and no more specific code applies" }
  - { id: ERR_BIKE_NOT_AVAILABLE, http: 409, condition: "referenced bike is not in the required disposition state (usually READY_FOR_DISPOSITION)" }
  - { id: ERR_AWARD_NOT_APPROVED, http: 409, condition: "giveaway award is not APPROVED where required" }
  - { id: ERR_SALE_NOT_PENDING, http: 409, condition: "sale is not PENDING where required" }
  - { id: ERR_TICKET_NOT_OPEN, http: 409, condition: "scrap ticket is not OPEN at pickup" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "tool membership is not ACTIVE where required (session create/start; sale discount)" }
  - { id: ERR_PARTICIPANT_NOT_ACTIVE, http: 409, condition: "participant is not ENROLLED/HOURS_MET where required" }
  - { id: ERR_USAGE_NOT_COMMITTED, http: 409, condition: "usage row already VOIDED at void time" }
  - { id: ERR_NOT_YOUR_SHIFT, http: 403, condition: "Volunteer caller acts on a shift owned by another volunteer" }
  - { id: ERR_MEMBER_NOT_OWNER, http: 403, condition: "Member caller acts on a session/membership that is not theirs" }
  - { id: ERR_REVIEWER_IS_LOGGER, http: 403, condition: "hour-log reviewer X-User-ID equals created_by_user_id (segregation of duties)" }
  - { id: ERR_FULFILLER_IS_APPROVER, http: 403, condition: "giveaway fulfiller X-User-ID equals decided_by_user_id (segregation of duties)" }
  - { id: ERR_INSPECTOR_IS_REFURB_LEAD, http: 422, condition: "safety inspector equals the bike's refurb lead (segregation of duties)" }
  - { id: ERR_CHECKLIST_INCONSISTENT, http: 422, condition: "result PASS with any checklist item false" }
  - { id: ERR_HELMET_REQUIRED, http: 422, condition: "required helmet distribution missing (graduation, YOUTH giveaway fulfill, sale completion)" }
  - { id: ERR_HELMET_OUT_OF_STOCK, http: 422, condition: "helmet SKU quantity_on_hand is 0" }
  - { id: ERR_NOT_A_HELMET_SKU, http: 422, condition: "helmet_part_id references a Part whose category is not HELMET" }
  - { id: ERR_HELMET_SIZE_REQUIRED, http: 422, condition: "HELMET part created without helmet_size, or non-HELMET part with helmet_size" }
  - { id: ERR_RECIPIENT_REFERENCE_MISMATCH, http: 422, condition: "helmet recipient_kind does not match the FK fields present" }
  - { id: ERR_SERIAL_NUMBER_CONFLICT, http: 409, condition: "serial_number already registered" }
  - { id: ERR_PART_NAME_CONFLICT, http: 409, condition: "part name already exists" }
  - { id: ERR_GRADE_NOT_REFURBISHABLE, http: 422, condition: "REFURBISH destination with grade D" }
  - { id: ERR_GRADE_NOT_HARVESTABLE, http: 422, condition: "HARVEST destination with grade A or B" }
  - { id: ERR_SCRAP_CRITERIA_NOT_MET, http: 422, condition: "SCRAP destination without grade D + frame_damage" }
  - { id: ERR_LEAD_INELIGIBLE, http: 422, condition: "refurb lead volunteer suspended or below APPRENTICE" }
  - { id: ERR_VOLUNTEER_SUSPENDED, http: 422, condition: "acting volunteer's engagement_status is SUSPENDED" }
  - { id: ERR_USAGE_SKILL_INSUFFICIENT, http: 422, condition: "part usage logger below APPRENTICE" }
  - { id: ERR_INSPECTOR_SKILL_INSUFFICIENT, http: 422, condition: "safety inspector below JOURNEYMAN" }
  - { id: ERR_NO_WORK_RECORDED, http: 422, condition: "submit-safety without any COMMITTED PartUsage" }
  - { id: ERR_NO_HARVEST_RECORDED, http: 422, condition: "harvest-complete without any PartHarvest" }
  - { id: ERR_SCRAP_TICKET_OPEN, http: 409, condition: "bike already has an OPEN scrap ticket" }
  - { id: ERR_SALE_ALREADY_PENDING, http: 409, condition: "bike already has a PENDING sale" }
  - { id: ERR_SALE_PENDING_CONFLICT, http: 409, condition: "giveaway fulfill blocked by a PENDING sale on the bike" }
  - { id: ERR_ALREADY_ENROLLED, http: 409, condition: "attendance row already exists for (session, volunteer)" }
  - { id: ERR_TRAINING_FULL, http: 422, condition: "session enrolled_count == capacity (at-capacity enrollments rejected; below capacity allowed)" }
  - { id: ERR_PROMOTION_CRITERIA_NOT_MET, http: 422, condition: "promotion thresholds (>=) not met for next skill level" }
  - { id: ERR_RESERVATION_EXISTS, http: 409, condition: "participant already holds a bike reservation" }
  - { id: ERR_NO_BIKE_RESERVED, http: 422, condition: "graduation without a reserved bike" }
  - { id: ERR_QUIZ_NOT_PASSED, http: 422, condition: "graduation without safety_quiz_passed" }
  - { id: ERR_HOURS_NOT_MET, http: 422, condition: "reserve-bike before HOURS_MET" }
  - { id: ERR_NOT_HARVESTABLE_CATEGORY, http: 422, condition: "harvesting a HELMET SKU (helmets are purchased stock only)" }
  - { id: ERR_ATTENDANCE_MARKS_INCOMPLETE, http: 422, condition: "session completion marks missing/duplicate attendances" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "new shift half-open-overlaps an existing SCHEDULED/CHECKED_IN shift of the same volunteer" }
  - { id: ERR_SHIFT_DURATION_INVALID, http: 422, condition: "shift duration outside 30..480 minutes" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 422, condition: "check-in outside [start - 15m, end]" }
  - { id: ERR_STAND_BUFFER_CONFLICT, http: 409, condition: "stand booking violates the 15-minute cleanup buffer against an existing BOOKED/IN_USE session on the same stand" }
  - { id: ERR_SESSION_DURATION_INVALID, http: 422, condition: "session duration outside 30..180 minutes" }
  - { id: ERR_STAND_NUMBER_INVALID, http: 422, condition: "stand_number outside 1..4" }
  - { id: ERR_START_TOO_EARLY, http: 422, condition: "session start attempted before start_time - 10m" }
  - { id: ERR_WORK_DATE_OUT_OF_WINDOW, http: 422, condition: "hour-log work_date outside [enrollment date, min(today, deadline)]" }
  - { id: ERR_DAILY_HOURS_EXCEEDED, http: 422, condition: "PENDING+APPROVED hours on the same work_date would exceed 6" }
  - { id: ERR_SESSION_NOT_ENDED, http: 422, condition: "training completion attempted before scheduled_end" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "usage quantity exceeds Part.quantity_on_hand" }
  - { id: ERR_GIVEAWAY_QUOTA_EXCEEDED, http: 422, condition: "4 awards already APPROVED/FULFILLED in the current calendar month" }
  - { id: ERR_QUANTITY_INVALID, http: 422, condition: "quantity < 1 on usage/harvest/restock" }
  - { id: ERR_WEIGHT_INVALID, http: 422, condition: "scrap weight outside (0, 100] kg" }
  - { id: ERR_SHIFT_NOT_CREDITABLE, http: 422, condition: "hour-log shift_id references a shift that is not COMPLETED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopCoordinator
    description: "Front-of-shop staff: intake, triage, routing, parts, scheduling, enrollment, sales desk, helmet distribution, sweep operation"
    identity: opaque
    exclusive_operations: ["donor/bike/part CRUD", "triage", "route", "harvest-complete", "scrap ticket create", "training session create/enroll/complete/cancel", "shift create/complete", "participant enroll/record-quiz", "hour-log approve/reject", "sale create/complete", "giveaway create/fulfill", "membership suspend/reinstate", "helmet distribution", "ops sweep", "clock set"]
    shared_operations: ["reads (with ProgramDirector)", "hour-log create (with Participant)", "reserve/release bike (with Participant)", "withdraw (with Participant)", "session book/close/cancel (with Member)", "shift cancel (with owning Volunteer)"]
  - name: ProgramDirector
    description: "Program oversight: approvals and reversals with fiscal/compliance weight; deliberately disjoint from ShopCoordinator logging/fulfillment duties"
    identity: opaque
    exclusive_operations: ["volunteer promote/suspend/reinstate", "hour-log void", "usage void", "sale void", "giveaway approve/deny/cancel", "graduation", "scrap pickup confirmation"]
    shared_operations: ["reads (with ShopCoordinator)"]
  - name: Volunteer
    description: "Registered shop volunteer; capabilities gate on skill_level and engagement_status attributes"
    identity: "entity_backed:Volunteer"
    exclusive_operations: ["part usage logging (APPRENTICE+)", "part harvest logging", "submit-safety", "safety inspections (JOURNEYMAN+)", "own shift check-in"]
    shared_operations: ["bike/part/session reads", "own shift cancel (with ShopCoordinator)"]
  - name: Participant
    description: "Earn-a-bike enrollee acting on their own record"
    identity: "entity_backed:EarnABikeParticipant"
    exclusive_operations: ["log own hours", "reserve/release own graduation bike"]
    shared_operations: ["own record reads", "own withdrawal (with ShopCoordinator)"]
  - name: Member
    description: "Tool-access member acting on their own membership"
    identity: "entity_backed:ToolMembership"
    exclusive_operations: ["book own stand sessions", "start own sessions"]
    shared_operations: ["own membership/billing reads", "own session close/cancel (with ShopCoordinator)", "bike reads"]
