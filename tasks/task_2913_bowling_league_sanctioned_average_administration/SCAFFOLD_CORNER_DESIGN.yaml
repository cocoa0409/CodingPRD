            - "POST /teams as LeagueTreasurer returns 403 with the same code, not 409 - the league is IN_SEASON so priority 15 would also refuse it, and priority 2 is reported instead"
            - "POST /fee-remittances as LeagueSecretary returns 403 - remittance filing is LeagueTreasurer-exclusive even for the officer who registered the memberships"
            - "POST /award-applications as LeagueSecretary returns 403 - honor-score filing is Bowler-exclusive, so the secretary cannot open a claim they would later have to verify"
