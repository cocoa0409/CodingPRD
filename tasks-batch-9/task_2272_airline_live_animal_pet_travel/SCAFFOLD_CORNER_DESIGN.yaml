      - name: arrive_completes_segment_delivers_animal_and_completes_reservation
        claim_type: bubble_up
        grounds:
          - state_machines.FlightLeg.DEPARTED_to_ARRIVED
          - state_machines.SegmentAssignment.ACCEPTED_to_COMPLETED
          - state_machines.AnimalRecord.IN_TRANSIT_to_DELIVERED
          - state_machines.Reservation.IN_TRANSIT_to_COMPLETED
        distinguishing_aspect: "Arrival is the bubble-up hop: one call moves the leg to ARRIVED and lets the terminal states propagate upward - segment COMPLETED, animal DELIVERED because this is its highest-sequence_index segment, reservation COMPLETED because every non-DENIED animal is delivered, and posture CLOSED."
        test_recipe:
          setup:
            - "The single-segment CHECKED itinerary on AN101 is fully processed: compliance VERIFIED, animal TRAVEL_READY with measured_weight_kg 27, booking CONFIRMED, segment ACCEPTED by a second agent, and the leg has DEPARTED so the animal is IN_TRANSIT and the reservation is IN_TRANSIT"
