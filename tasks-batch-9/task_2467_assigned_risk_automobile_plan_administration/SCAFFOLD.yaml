# =============================================================================
# Task 2467 — Assigned Risk Automobile Plan Administration
# Seed tables §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Corner design → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2467. Assigned Risk Automobile Plan Administration (state automobile insurance plan): applicant
  eligibility with documented voluntary market rejections and premium deposit requirements,
  assignment of risks to carriers in proportion to voluntary market share, servicing carrier
  designation and policy issuance responsibilities, rating rules with plan-approved surcharge points
  for violations and accidents, cancellation, non-renewal restrictions and reassignment on carrier
  exit, driver reclassification and exit to the voluntary market, claim handling standards and
  complaint resolution, quota reconciliation and carrier credit for voluntary writings in
  underserved territories

domain_name: assigned-risk-auto-plan
api_prefix: /plan

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities joined by FK fields carried in request bodies; only three
  # ownership pairs (Applicant→Vehicle, Application→MarketRejection,
  # PlanPeriod→AssignmentCycle) appear as nested URLs. Carrier, Application,
  # Assignment, Policy, Claim, Complaint and QuotaReconciliation are all
  # top-level collections that reference each other by id.

  state_machine_shape: parallel
  # Policy carries two independent state axes (policy_status ×
  # premium_settlement_status). Application is additionally cyclic
  # (SUBMITTED ⇄ RETURNED_FOR_CURE, ASSIGNED → CERTIFIED_AWAITING_ASSIGNMENT)
  # and branching (SUBMITTED forks to CERTIFIED / REJECTED / RETURNED_FOR_CURE);
  # Complaint is cyclic (FINDINGS_RECORDED → OPEN); PlanPeriod auto-transitions
  # to CLOSED from aggregate child state.

  relationship_patterns:
    - one_to_many          # Carrier→Assignment, Application→MarketRejection, Policy→Claim
    - self_referential     # Assignment.predecessor_assignment_id -> Assignment.id
    - cross_aggregate      # Policy→Carrier, Complaint→Carrier, QuotaReconciliation→PlanPeriod

  role_model: segregation_of_duties
  # The ComplianceExaminer who records a complaint's findings may not be the
  # examiner who resolves it (X-User-ID compared against
  # Complaint.findings_recorded_by_user_id).

  consistency_model: immediate

  difficulty_level: expert
  # 13 entities / 53 endpoints / 62 error codes / 44 validations / 13
  # calculations / 10 state machines / 2 concurrency rules / 4 roles, of which
  # 3 calculations are dual-variant. Density target: every write endpoint either
  # feeds the carrier-selection ranking, the premium ledger invariant, or the
  # posture gate that the selector reads back.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the voluntary-market carrier participating in the plan.
        constraints: "1..120 chars"
      - name: naic_code
        type: string
        source: input
        description: NAIC company code; MarketRejection rows cite this value.
        constraints: "exactly 5 digits; unique across all Carrier rows"
      - name: voluntary_market_share_bps
        type: integer
        source: input
        description: Carrier's voluntary private-passenger market share in basis points; drives quota apportionment.
        constraints: "1..10000"
      - name: licensed_territories
        type: array
        source: input
        description: Territory codes the carrier is licensed to write; the assignment selector filters on membership.
        constraints: "non-empty; each element in {T01, T02, T03}; no duplicates"
      - name: enrollment_sequence
        type: integer
        source: system
        description: Monotonic 1-based registration order; final tie-break for quota apportionment and carrier selection (never `id`).
        constraints: "assigned server-side, strictly increasing, gap-free"
      - name: status
        type: enum
        source: system
        description: Plan participation lifecycle.
        default: ACTIVE
        constraints: "ACTIVE | EXIT_NOTICED | EXIT_COMPLETE"
      - name: exit_effective_date
        type: datetime
        source: system
        description: Date the carrier's plan participation ends; set by the exit-notice endpoint, null while ACTIVE.
        default: null
      - name: performance_score
        type: integer
        source: computed
        description: 100 minus accumulated claim-standard and complaint deductions, plus period-closure recovery; floor 0, ceiling 100.
        default: 100
        constraints: "0..100"
      - name: breach_count_current_period
        type: integer
        source: computed
        description: Count of Claim rows of this carrier with standard_breach == true acknowledged since the last PlanPeriod closure.
        default: 0
      - name: upheld_complaint_count
        type: integer
        source: computed
        description: Lifetime count of Complaint rows against this carrier with status == RESOLVED_UPHELD.
        default: 0
      - name: non_renewal_count_current_period
        type: integer
        source: computed
        description: Count of non-renewal notices this carrier issued since the last PlanPeriod closure; capped by the plan non-renewal rule.
        default: 0
      - name: assigned_risk_count
        type: integer
        source: computed
        description: Count of this carrier's Assignment rows with status IN {PENDING_ACCEPTANCE, ACCEPTED, POLICY_ISSUED}.
        default: 0
      - name: voluntary_credit_units
        type: number
        source: computed
        description: Accumulated credit for risks written voluntarily on plan exit; 1.5 per risk garaged in an underserved territory, else 1.0.
        default: 0
        constraints: "1 decimal place"
      - name: quota_target_units
        type: integer
        source: computed
        description: Largest-remainder apportionment of the current OPEN PlanPeriod's total_assignable_units to this carrier (see calculations.carrier_quota_target_units).
        default: 0
      - name: quota_variance_units
        type: number
        source: computed
        description: assigned_risk_count + voluntary_credit_units - quota_target_units on the POLICY_COUNT basis; positive means over-served.
        default: 0
        constraints: "1 decimal place"
      - name: overallocated
        type: boolean
        source: computed
        description: True when quota_variance_units > 0; forces posture to RESTRICTED.
        default: false
      - name: posture
        type: enum
        source: computed
        description: Derived gate on plan operations; recomputed after every mutation of status, performance_score, breach_count_current_period or overallocated.
        default: OPEN
        constraints: "OPEN | RESTRICTED | SUSPENDED"
      - name: penalty_balance_cents
        type: integer
        source: computed
        description: Sum of penalty_cents across this carrier's QuotaReconciliation rows with status == FINAL.
        default: 0

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Producer (agency) name.
      - name: license_number
        type: string
        source: input
        description: State producer license number.
        constraints: "unique across all Producer rows"
      - name: appointed_territories
        type: array
        source: input
        description: Territory codes the producer may submit applications for.
        constraints: "non-empty; each element in {T01, T02, T03}"
      - name: status
        type: enum
        source: input
        description: Producer standing with the plan; SUSPENDED producers cannot submit or resubmit applications.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Named insured.
      - name: driver_license_number
        type: string
        source: input
        description: Operator license number.
        constraints: "unique across all Applicant rows"
      - name: territory_code
        type: enum
        source: input
        description: Applicant's residence territory.
        constraints: "T01 | T02 | T03"
      - name: driver_class
        type: enum
        source: input
        description: Plan-approved driver classification; YOUTHFUL_OPERATOR adds surcharge points before the cap.
        constraints: "ADULT | YOUTHFUL_OPERATOR | SENIOR"
      - name: first_licensed_date
        type: datetime
        source: input
        description: Date first licensed; the clean-years baseline when no chargeable event exists.
      - name: last_chargeable_event_date
        type: datetime
        source: computed
        description: Latest of (verified_violations[].conviction_date across this applicant's Application rows) and (Claim.loss_date where at_fault == true on Policy rows of this applicant); falls back to first_licensed_date.
      - name: clean_years_credited
        type: integer
        source: computed
        description: min(5, floor((clock - last_chargeable_event_date) / 365 days)); voluntary-market exit requires >= 3.
        default: 0
        constraints: "0..5"
      - name: voluntary_market_eligible
        type: boolean
        source: computed
        description: Set true when any Policy of this applicant reaches policy_status == EXITED_TO_VOLUNTARY.
        default: false

  - name: Vehicle
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; owner of the vehicle.
      - name: vin
        type: string
        source: input
        description: Vehicle identification number.
        constraints: "17 chars; unique across all Vehicle rows"
      - name: vehicle_class_code
        type: enum
        source: input
        description: Plan-approved use classification driving the class factor.
        constraints: "PLEASURE | WORK_LT10 | WORK_GE10 | BUSINESS"
      - name: garaging_territory_code
        type: enum
        source: input
        description: Territory where the vehicle is garaged; selects the territory base rate and the assignment eligibility filter.
        constraints: "T01 | T02 | T03"
      - name: model_year
        type: integer
        source: input
        description: Model year of the vehicle.
        constraints: "1980..2027"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the risk being placed.
      - name: producer_id
        type: string
        source: input
        description: FK -> Producer.id; producer of record submitting the application.
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; vehicle to be insured; must belong to applicant_id.
      - name: intake_sequence
        type: integer
        source: system
        description: Monotonic 1-based intake order across all applications; secondary sort key of the assignment queue (never `id`).
        constraints: "strictly increasing, gap-free"
      - name: requested_effective_date
        type: datetime
        source: input
        description: Coverage start date requested by the applicant.
      - name: declared_violations
        type: array
        source: input
        description: "Applicant-declared record: array of { code, conviction_date }; code in {SPEEDING_MINOR, SPEEDING_MAJOR, AT_FAULT_ACCIDENT, LICENSE_SUSPENSION, RECKLESS_DRIVING, DUI}."
        constraints: "may be empty array; conviction_date ISO 8601 UTC"
      - name: verified_violations
        type: array
        source: computed
        description: Motor-vehicle-record verified violation array written by the MVR verification endpoint; null until verified. Same element shape as declared_violations.
        default: null
      - name: mvr_verified_at
        type: datetime
        source: system
        description: Clock value when MVR verification was recorded; certification requires non-null.
        default: null
      - name: status
        type: enum
        source: system
        description: Application lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | RETURNED_FOR_CURE | REJECTED | CERTIFIED_AWAITING_ASSIGNMENT | DEFERRED_NO_CARRIER | ASSIGNED | POLICY_ISSUED | CLOSED_EXITED | CLOSED_CANCELLED"
      - name: cure_count
        type: integer
        source: computed
        description: Number of completed cure round-trips (incremented on each resubmission); plan allows at most 2.
        default: 0
        constraints: "0..2"
      - name: certified_at
        type: datetime
        source: system
        description: Clock value when eligibility was certified; the assignment queue orders on this field and PlanPeriod membership is decided by it.
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceExaminer who certified or rejected eligibility.
        default: null
      - name: rejection_reason_code
        type: string
        source: system
        description: Reason recorded when status becomes REJECTED.
        default: null
      - name: distinct_rejection_count
        type: integer
        source: computed
        description: Count of distinct rejecting_carrier_naic_code values among this application's MarketRejection rows whose rejection_date is within 90 days before clock.
        default: 0
      - name: surcharge_points_estimated
        type: integer
        source: computed
        description: Surcharge points from verified_violations (or declared_violations when unverified) rated at certified_at; see calculations.surcharge_points.
        default: 0
      - name: estimated_annual_premium_cents
        type: integer
        source: computed
        description: Per-line-rounded annual premium at the estimation rating date; see calculations.annual_premium.
        default: 0
      - name: estimated_expense_charge_cents
        type: integer
        source: computed
        description: Plan expense charge on the estimated annual premium; see calculations.plan_expense_charge.
        default: 0
      - name: estimated_total_charge_cents
        type: integer
        source: computed
        description: estimated_annual_premium_cents + estimated_expense_charge_cents.
        default: 0
      - name: required_deposit_cents
        type: integer
        source: computed
        description: max(round_half_up(estimated_total_charge_cents * 0.25), 15000); certification requires deposit_paid_total_cents >= this value.
        default: 0
      - name: deposit_paid_total_cents
        type: integer
        source: computed
        description: Sum of every deposit amount_cents recorded against this application; never decreases.
        default: 0
      - name: deposit_balance_cents
        type: integer
        source: computed
        description: deposit_paid_total_cents not yet credited to premium or refunded; conserved quantity of the deposit invariant.
        default: 0

  - name: MarketRejection
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application the declination documents.
      - name: rejecting_carrier_naic_code
        type: string
        source: input
        description: NAIC code of the voluntary-market carrier that declined the risk; must equal the naic_code of some Carrier row (any status). Not an FK — declinations are filed by code, and the plan never joins the Carrier row into rating.
        constraints: "exactly 5 digits"
      - name: rejection_date
        type: datetime
        source: input
        description: Date the voluntary-market declination was issued; the 90-day eligibility lookback is measured against this value.
      - name: reason_code
        type: enum
        source: input
        description: Declination reason as filed by the voluntary carrier.
        constraints: "UNACCEPTABLE_DRIVING_RECORD | UNDERWRITING_GUIDELINES | NO_APPETITE_TERRITORY | PRIOR_CANCELLATION"
      - name: document_reference
        type: string
        source: input
        description: Plan document control number evidencing the declination.

  - name: PlanPeriod
    parent: null
    common_fields: true
    fields:
      - name: period_code
        type: string
        source: input
        description: Plan quota period label, e.g. "2026-P3".
        constraints: "unique across all PlanPeriod rows"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the closed quota window.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the closed quota window; must be >= window_start.
      - name: underserved_territories
        type: array
        source: input
        description: Territory codes attracting the 1.5x voluntary-writing credit multiplier this period.
        constraints: "each element in {T01, T02, T03}; may be empty"
      - name: status
        type: enum
        source: system
        description: Quota period lifecycle; CLOSED is reached automatically once every ACTIVE carrier holds a FINAL QuotaReconciliation for the period.
        default: OPEN
        constraints: "OPEN | RECONCILING | CLOSED"
      - name: total_assignable_units
        type: integer
        source: computed
        description: Count of Application rows whose certified_at falls inside [window_start, window_end] and whose status is in {CERTIFIED_AWAITING_ASSIGNMENT, DEFERRED_NO_CARRIER, ASSIGNED, POLICY_ISSUED, CLOSED_EXITED, CLOSED_CANCELLED}.
        default: 0
      - name: total_assignable_car_years
        type: number
        source: computed
        description: Sum over ACTIVE carriers of exposure_car_years(carrier, period), each already rounded to 4 decimals; see calculations.exposure_car_years.
        default: 0
        constraints: "4 decimal places"

  - name: AssignmentCycle
    parent: PlanPeriod
    common_fields: true
    fields:
      - name: plan_period_id
        type: string
        source: input
        description: FK -> PlanPeriod.id; period the cycle apportions against.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the closed intake window; only applications certified inside the window are queued.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the closed intake window; must be >= window_start and inside the parent period window.
      - name: status
        type: enum
        source: system
        description: Cycle run state.
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED"
      - name: assigned_count
        type: integer
        source: computed
        description: Number of applications this run placed with a carrier.
        default: 0
      - name: deferred_count
        type: integer
        source: computed
        description: Number of queued applications this run could not place because the candidate pool was empty.
        default: 0
      - name: run_at
        type: datetime
        source: system
        description: Clock value when the run executed.
        default: null

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: FK -> Application.id; risk being assigned; written by the selector, never accepted from a client.
      - name: carrier_id
        type: string
        source: system
        description: FK -> Carrier.id; servicing carrier designated by the selector, never accepted from a client.
      - name: assignment_cycle_id
        type: string
        source: system
        description: FK -> AssignmentCycle.id; run that produced this assignment; null when assignment_kind == REASSIGNMENT.
        default: null
      - name: predecessor_assignment_id
        type: string
        source: system
        description: FK -> Assignment.id; assignment this one replaces on carrier exit; null when assignment_kind == INITIAL.
        default: null
      - name: batch_sequence
        type: integer
        source: system
        description: 1-based creation order within the originating request (cycle run or exit-notice cascade); secondary sort key for assignment lists (never `id`).
      - name: assignment_kind
        type: enum
        source: system
        description: Whether the assignment came from a cycle run or from a carrier-exit reassignment.
        constraints: "INITIAL | REASSIGNMENT"
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle.
        default: PENDING_ACCEPTANCE
        constraints: "PENDING_ACCEPTANCE | ACCEPTED | POLICY_ISSUED | RESCINDED | REASSIGNED | CLOSED"
      - name: acceptance_deadline
        type: datetime
        source: computed
        description: created_at + 10 days; acceptance after this instant is refused and the plan may rescind for ISSUANCE_DEADLINE_MISSED.
      - name: accepted_at
        type: datetime
        source: system
        description: Clock value when the servicing carrier accepted.
        default: null
      - name: deficit_score_at_selection
        type: number
        source: computed
        description: quota_target_units - assigned_risk_count of the winning carrier at the instant of selection; audit trail of the ranking decision.
        default: 0
        constraints: "1 decimal place"
      - name: provisional_premium_cents
        type: integer
        source: computed
        description: Snapshot of Application.estimated_total_charge_cents at selection time.
        default: 0
      - name: rescission_reason_code
        type: enum
        source: system
        description: Why the plan pulled the assignment back.
        default: null
        constraints: "ISSUANCE_DEADLINE_MISSED | CARRIER_INELIGIBLE | ASSIGNMENT_ERROR"

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: FK -> Assignment.id; assignment authorising issuance.
      - name: carrier_id
        type: string
        source: system
        description: FK -> Carrier.id; current servicing carrier, copied from the Assignment at issuance and rewritten when a reassignment is accepted.
      - name: policy_number
        type: string
        source: input
        description: Carrier-assigned policy number.
        constraints: "unique across all Policy rows"
      - name: effective_date
        type: datetime
        source: input
        description: Inclusive start of the annual term; the final-rating rating date.
      - name: expiration_date
        type: datetime
        source: input
        description: Exclusive end of the annual term; must equal effective_date + 365 days.
      - name: policy_status
        type: enum
        source: system
        description: "Coverage axis of the two independent Policy state dimensions."
        default: IN_FORCE
        constraints: "IN_FORCE | REASSIGNMENT_PENDING | NON_RENEWAL_PENDING | NON_RENEWED | CANCELLED | EXITED_TO_VOLUNTARY"
      - name: premium_settlement_status
        type: enum
        source: system
        description: "Money axis of the two independent Policy state dimensions; initialised at issuance from premium_credited_cents vs total_annual_charge_cents."
        constraints: "PAID_IN_FULL | PREMIUM_OUTSTANDING | REFUND_ISSUED | BALANCE_DUE_AT_CANCELLATION"
      - name: surcharge_points_applied
        type: integer
        source: computed
        description: Capped surcharge points used by the in-force rating; recomputed on reclassification.
        default: 0
        constraints: "0..15"
      - name: surcharge_factor_applied
        type: number
        source: computed
        description: Plan-approved surcharge factor selected by surcharge_points_applied.
        constraints: "2 decimal places"
      - name: premium_lines
        type: object
        source: computed
        description: "Per-coverage-line rounded premium: { BI: integer_cents, PD: integer_cents, UM: integer_cents }."
      - name: final_premium_cents
        type: integer
        source: computed
        description: premium_lines.BI + premium_lines.PD + premium_lines.UM (per-line rounding then sum, never sum then round).
        default: 0
      - name: plan_expense_charge_cents
        type: integer
        source: computed
        description: Plan expense charge whose rate tier is selected from final_premium_cents before the charge is added.
        default: 0
      - name: total_annual_charge_cents
        type: integer
        source: computed
        description: final_premium_cents + plan_expense_charge_cents; the amount the insured owes for the term.
        default: 0
      - name: premium_credited_cents
        type: integer
        source: computed
        description: Portion of the applicant's deposit credited to this policy's premium; conserved quantity of the deposit invariant.
        default: 0
      - name: additional_premium_due_cents
        type: integer
        source: computed
        description: total_annual_charge_cents - premium_credited_cents while the policy is unsettled.
        default: 0
      - name: refund_paid_cents
        type: integer
        source: computed
        description: Cumulative unearned premium returned to the insured.
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: Earned premium in excess of premium_credited_cents at cancellation.
        default: 0
      - name: earned_premium_cents
        type: integer
        source: computed
        description: Premium the plan treats as earned at cancellation, on the refund_basis variant that applies.
        default: 0
      - name: refund_basis
        type: enum
        source: computed
        description: Which earned-premium variant produced earned_premium_cents.
        default: null
        constraints: "PRO_RATA | SHORT_RATE"
      - name: cancellation_reason_code
        type: enum
        source: system
        description: Plan-enumerated cancellation reason.
        default: null
        constraints: "NON_PAYMENT_OF_PREMIUM | LICENSE_SUSPENDED | MATERIAL_MISREPRESENTATION | VEHICLE_NOT_GARAGED_IN_STATE | INSURED_REQUEST | PLAN_ORDERED"
      - name: cancellation_effective_date
        type: datetime
        source: system
        description: Exclusive end of coverage used as the days-in-force boundary.
        default: null
      - name: cancellation_initiated_by
        type: enum
        source: system
        description: Party that initiated cancellation; selects the earned-premium variant.
        default: null
        constraints: "CARRIER | PLAN | INSURED"
      - name: non_renewal_notice_count
        type: integer
        source: computed
        description: Non-renewal notices served on this policy; the plan allows at most 1 per term.
        default: 0
      - name: non_renewal_effective_date
        type: datetime
        source: system
        description: expiration_date recorded when a non-renewal notice is served.
        default: null
      - name: rating_revision
        type: integer
        source: computed
        description: 1 at issuance, incremented by each accepted reclassification.
        default: 1
      - name: reassignment_required
        type: boolean
        source: computed
        description: True while the servicing carrier is exiting and a receiving carrier has not yet accepted.
        default: false
      - name: open_complaint_count
        type: integer
        source: computed
        description: Count of this policy's Complaint rows with status IN {OPEN, FINDINGS_RECORDED}.
        default: 0
      - name: complaint_freeze_active
        type: boolean
        source: computed
        description: open_complaint_count > 0; freezes cancellation and non-renewal notices.
        default: false
      - name: exposure_car_years_current_period
        type: number
        source: computed
        description: Days of this policy's term overlapping the current OPEN or RECONCILING PlanPeriod window divided by 365, rounded half-up to 4 decimals.
        default: 0
        constraints: "4 decimal places"

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; policy the loss is reported under.
      - name: loss_date
        type: datetime
        source: input
        description: Date of loss; must be within [Policy.effective_date, clock].
      - name: at_fault
        type: boolean
        source: input
        description: Whether the insured was at fault; at-fault losses reset the applicant's clean-years clock.
      - name: coverage_line
        type: enum
        source: input
        description: Coverage line the loss is reported against.
        constraints: "BI | PD | UM"
      - name: reserve_cents
        type: integer
        source: input
        description: Carrier's loss reserve in cents.
        constraints: ">= 0"
      - name: reported_at
        type: datetime
        source: system
        description: Clock value when the claim was reported to the plan.
      - name: acknowledgement_deadline
        type: datetime
        source: computed
        description: reported_at + 10 days; the plan claim-handling standard.
      - name: acknowledged_at
        type: datetime
        source: system
        description: Clock value when the carrier acknowledged the claim.
        default: null
      - name: status
        type: enum
        source: system
        description: Claim lifecycle.
        default: OPEN
        constraints: "OPEN | ACKNOWLEDGED | CLOSED_PAID | CLOSED_DENIED"
      - name: standard_breach
        type: boolean
        source: computed
        description: True when acknowledged_at > acknowledgement_deadline; drives the carrier's breach count and score deduction.
        default: false
      - name: paid_cents
        type: integer
        source: computed
        description: Indemnity paid at closure; 0 for CLOSED_DENIED.
        default: 0

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; policy complained about.
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; carrier the complaint runs against; must equal the policy's carrier_id at filing time.
      - name: complaint_type
        type: enum
        source: input
        description: Plan complaint taxonomy.
        constraints: "CLAIM_HANDLING_DELAY | RATING_DISPUTE | CANCELLATION_DISPUTE | SERVICE_STANDARD"
      - name: narrative
        type: string
        source: input
        description: Complainant's statement.
        constraints: "1..2000 chars"
      - name: status
        type: enum
        source: system
        description: Complaint resolution lifecycle; FINDINGS_RECORDED can return to OPEN for a further review round.
        default: OPEN
        constraints: "OPEN | FINDINGS_RECORDED | RESOLVED_UPHELD | RESOLVED_NOT_UPHELD"
      - name: findings_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the examiner who recorded findings; the resolver must differ from this value.
        default: null
      - name: findings_note
        type: string
        source: system
        description: Investigation findings text.
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the examiner who resolved the complaint.
        default: null
      - name: disposition
        type: enum
        source: system
        description: Resolution outcome recorded by the resolving examiner.
        default: null
        constraints: "UPHELD | NOT_UPHELD | RETURNED_FOR_FURTHER_REVIEW"
      - name: review_round
        type: integer
        source: computed
        description: 1 initially, incremented each time a resolution returns the complaint to OPEN.
        default: 1

  - name: QuotaReconciliation
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; carrier being reconciled.
      - name: plan_period_id
        type: string
        source: input
        description: FK -> PlanPeriod.id; period being reconciled.
      - name: basis
        type: enum
        source: input
        description: Which of the two plan-approved measurement bases the reconciliation uses.
        constraints: "POLICY_COUNT | CAR_YEAR_EXPOSURE"
      - name: obligation_units
        type: number
        source: computed
        description: The carrier's quota obligation on the chosen basis.
        constraints: "integer on POLICY_COUNT; 4 decimals on CAR_YEAR_EXPOSURE"
      - name: credited_units
        type: number
        source: computed
        description: The carrier's credited volume on the chosen basis, including voluntary-writing credit.
        constraints: "1 decimal on POLICY_COUNT; 4 decimals on CAR_YEAR_EXPOSURE"
      - name: variance_units
        type: number
        source: computed
        description: credited_units - obligation_units; negative means the carrier is deficient.
      - name: voluntary_credit_units_applied
        type: number
        source: computed
        description: Carrier.voluntary_credit_units folded into credited_units by this reconciliation.
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: round_half_up(max(0, -variance_units) * 25000).
        default: 0
      - name: status
        type: enum
        source: system
        description: FINAL until a newer reconciliation for the same carrier and period supersedes it.
        default: FINAL
        constraints: "FINAL | SUPERSEDED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CLOSED_EXITED, CLOSED_CANCELLED]
    transitions:
      - from: SUBMITTED
        to: RETURNED_FOR_CURE
        trigger: "POST /plan/applications/{id}/cure-return"
        actor: ComplianceExaminer
        preconditions:
          - "Application.status == SUBMITTED"
          - "Application.cure_count < 2"
        side_effects:
          - "cure_count is NOT changed here (it increments on resubmission)"
        note: "Branch 1 of the 3-way fork out of SUBMITTED."
      - from: RETURNED_FOR_CURE
        to: SUBMITTED
        trigger: "POST /plan/applications/{id}/resubmission"
        actor: ProducerAgent
        preconditions:
          - "Application.status == RETURNED_FOR_CURE"
          - "Producer.status == ACTIVE for Application.producer_id"
        side_effects:
          - "cure_count += 1"
          - "verified_violations reset to null and mvr_verified_at reset to null — the MVR must be re-pulled"
          - "distinct_rejection_count recomputed against the clock"
        note: "Cycle edge: SUBMITTED ⇄ RETURNED_FOR_CURE, bounded by cure_count <= 2."
      - from: SUBMITTED
        to: CERTIFIED_AWAITING_ASSIGNMENT
        trigger: "POST /plan/applications/{id}/certification with decision == CERTIFY"
        actor: ComplianceExaminer
        preconditions:
          - "Application.status == SUBMITTED"
          - "Application.mvr_verified_at is not null"
          - "Application.distinct_rejection_count >= 2"
          - "Application.deposit_paid_total_cents >= Application.required_deposit_cents"
          - "a PlanPeriod with status == OPEN exists whose [window_start, window_end] contains the clock"
        side_effects:
          - "certified_at = clock; certified_by_user_id = X-User-ID"
          - "surcharge_points_estimated, estimated_annual_premium_cents, estimated_expense_charge_cents, estimated_total_charge_cents recomputed at rating date == clock"
          - "containing PlanPeriod.total_assignable_units += 1"
        note: "Branch 2 of the fork."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plan/applications/{id}/certification with decision == REJECT"
        actor: ComplianceExaminer
        preconditions:
          - "Application.status == SUBMITTED"
          - "Application.mvr_verified_at is not null"
        side_effects:
          - "rejection_reason_code recorded; certified_by_user_id = X-User-ID"
          - "deposit_paid_total_cents stays put and remains wholly in deposit_balance_cents (the deposit invariant still holds)"
        note: "Branch 3 of the fork; terminal."
      - from: CERTIFIED_AWAITING_ASSIGNMENT
        to: ASSIGNED
        trigger: "POST /plan/assignment-cycles/{id}/run (selector placed the risk)"
        actor: system
        preconditions:
          - "Application.certified_at inside the cycle's [window_start, window_end]"
          - "at least one Carrier passes the candidate filter"
        side_effects:
          - "an Assignment row is created with assignment_kind == INITIAL and status == PENDING_ACCEPTANCE"
          - "winning Carrier.assigned_risk_count += 1, quota_variance_units and posture recomputed"
          - "AssignmentCycle.assigned_count += 1"
      - from: CERTIFIED_AWAITING_ASSIGNMENT
        to: DEFERRED_NO_CARRIER
        trigger: "POST /plan/assignment-cycles/{id}/run (candidate pool empty)"
        actor: system
        preconditions:
          - "Application.certified_at inside the cycle's window"
          - "no Carrier passes the candidate filter"
        side_effects:
          - "AssignmentCycle.deferred_count += 1"
          - "no Assignment row is created and no error is raised"
      - from: DEFERRED_NO_CARRIER
        to: ASSIGNED
        trigger: "POST /plan/assignment-cycles/{id}/run of a later cycle"
        actor: system
        preconditions:
          - "Application.certified_at inside the later cycle's window"
          - "at least one Carrier passes the candidate filter"
        side_effects:
          - "same side effects as CERTIFIED_AWAITING_ASSIGNMENT → ASSIGNED"
      - from: ASSIGNED
        to: CERTIFIED_AWAITING_ASSIGNMENT
        trigger: "POST /plan/assignments/{id}/rescission, or the suspension cascade of POST /plan/complaints/{id}/resolution"
        actor: PlanAdministrator
        preconditions:
          - "the Assignment being pulled back has status IN {PENDING_ACCEPTANCE, ACCEPTED}"
          - "no Policy references that Assignment"
        side_effects:
          - "Assignment.status = RESCINDED with rescission_reason_code"
          - "designated Carrier.assigned_risk_count -= 1, quota_variance_units and posture recomputed"
        note: "Cycle edge: the risk re-enters the queue and can be placed by the next cycle run."
      - from: ASSIGNED
        to: POLICY_ISSUED
        trigger: "POST /plan/policies"
        actor: ServicingCarrier
        preconditions:
          - "the Assignment has status == ACCEPTED"
          - "Carrier.posture != SUSPENDED"
        side_effects:
          - "Policy created; Assignment.status = POLICY_ISSUED"
          - "deposit_balance_cents decreases by the credited amount; Policy.premium_credited_cents increases by the same amount"
      - from: POLICY_ISSUED
        to: CLOSED_EXITED
        trigger: "POST /plan/policies/{id}/voluntary-exit"
        actor: PlanAdministrator
        preconditions:
          - "Policy.policy_status == IN_FORCE"
          - "Applicant.clean_years_credited >= 3"
          - "no Claim of the policy has status IN {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "Policy.policy_status = EXITED_TO_VOLUNTARY; Applicant.voluntary_market_eligible = true"
          - "Assignment.status = CLOSED; Carrier.assigned_risk_count -= 1"
          - "Carrier.voluntary_credit_units += 1.5 when the vehicle's garaging_territory_code is in the period's underserved_territories, else += 1.0"
      - from: POLICY_ISSUED
        to: CLOSED_CANCELLED
        trigger: "POST /plan/policies/{id}/cancellation"
        actor: ServicingCarrier | PlanAdministrator | ProducerAgent
        preconditions:
          - "Policy.policy_status == IN_FORCE"
          - "Policy.complaint_freeze_active == false"
        side_effects:
          - "Policy.policy_status = CANCELLED; earned_premium_cents / refund_paid_cents / balance_due_cents settled"
          - "Assignment.status = CLOSED; Carrier.assigned_risk_count -= 1"

  - entity: Assignment
    state_field: status
    initial_state: PENDING_ACCEPTANCE
    terminal_states: [RESCINDED, REASSIGNED, CLOSED]
    transitions:
      - from: PENDING_ACCEPTANCE
        to: ACCEPTED
        trigger: "POST /plan/assignments/{id}/acceptance"
        actor: ServicingCarrier
        preconditions:
          - "assignment_kind == INITIAL"
          - "clock <= acceptance_deadline"
          - "Carrier.posture != SUSPENDED"
          - "the caller's Carrier.id == Assignment.carrier_id"
        side_effects:
          - "accepted_at = clock"
      - from: PENDING_ACCEPTANCE
        to: POLICY_ISSUED
        trigger: "POST /plan/assignments/{id}/acceptance"
        actor: ServicingCarrier
        preconditions:
          - "assignment_kind == REASSIGNMENT"
          - "clock <= acceptance_deadline"
          - "Carrier.posture != SUSPENDED"
        side_effects:
          - "the existing Policy is transferred: Policy.carrier_id = the accepting carrier, policy_status REASSIGNMENT_PENDING → IN_FORCE, reassignment_required = false"
          - "predecessor Assignment.status = REASSIGNED; the predecessor's Carrier.assigned_risk_count -= 1"
          - "when the predecessor's Carrier.status == EXIT_NOTICED and that carrier now has no Policy rows with policy_status IN {IN_FORCE, REASSIGNMENT_PENDING, NON_RENEWAL_PENDING}, that Carrier.status bubbles up to EXIT_COMPLETE"
        note: "A reassignment lands on POLICY_ISSUED directly — the policy already exists."
      - from: ACCEPTED
        to: POLICY_ISSUED
        trigger: "POST /plan/policies"
        actor: ServicingCarrier
        preconditions:
          - "no Policy already references this Assignment"
          - "Carrier.posture != SUSPENDED"
        side_effects:
          - "Application.status = POLICY_ISSUED"
      - from: PENDING_ACCEPTANCE
        to: RESCINDED
        trigger: "POST /plan/assignments/{id}/rescission, or the suspension cascade of POST /plan/complaints/{id}/resolution"
        actor: PlanAdministrator
        preconditions:
          - "reason_code == ISSUANCE_DEADLINE_MISSED requires clock > acceptance_deadline"
        side_effects:
          - "Application.status = CERTIFIED_AWAITING_ASSIGNMENT"
          - "Carrier.assigned_risk_count -= 1; quota_variance_units, overallocated and posture recomputed"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /plan/assignments/{id}/rescission with reason_code == ISSUANCE_DEADLINE_MISSED"
        actor: PlanAdministrator
        preconditions:
          - "clock > acceptance_deadline"
          - "no Policy references this Assignment"
        side_effects:
          - "Application.status = CERTIFIED_AWAITING_ASSIGNMENT"
          - "Carrier.assigned_risk_count -= 1 and Carrier.performance_score -= 5 (MISSED_ISSUANCE_RESCISSION)"
      - from: POLICY_ISSUED
        to: REASSIGNED
        trigger: "acceptance of the successor Assignment created by POST /plan/carriers/{id}/exit-notice"
        actor: system
        preconditions:
          - "a successor Assignment with predecessor_assignment_id == this Assignment.id reached POLICY_ISSUED"
        side_effects: []
      - from: POLICY_ISSUED
        to: CLOSED
        trigger: "POST /plan/policies/{id}/cancellation, POST /plan/policies/{id}/voluntary-exit, or the policy reaching NON_RENEWED"
        actor: system
        preconditions:
          - "the referencing Policy left policy_status == IN_FORCE for a terminal coverage state"
        side_effects: []

  - entity: Policy
    state_field: policy_status
    initial_state: IN_FORCE
    terminal_states: [NON_RENEWED, CANCELLED, EXITED_TO_VOLUNTARY]
    note: "Coverage axis. Runs independently of premium_settlement_status — see the next machine (parallel dimensions on one entity)."
    transitions:
      - from: IN_FORCE
        to: REASSIGNMENT_PENDING
        trigger: "POST /plan/carriers/{id}/exit-notice"
        actor: PlanAdministrator
        preconditions:
          - "the servicing Carrier.status == ACTIVE at the time of the notice"
        side_effects:
          - "reassignment_required = true"
          - "a REASSIGNMENT Assignment is created for the receiving carrier chosen by the selector"
      - from: REASSIGNMENT_PENDING
        to: IN_FORCE
        trigger: "POST /plan/assignments/{id}/acceptance of the REASSIGNMENT assignment"
        actor: ServicingCarrier
        preconditions:
          - "the accepting Carrier.posture != SUSPENDED"
        side_effects:
          - "carrier_id rewritten to the receiving carrier; reassignment_required = false"
        note: "Cycle edge on the coverage axis."
      - from: IN_FORCE
        to: NON_RENEWAL_PENDING
        trigger: "POST /plan/policies/{id}/non-renewal-notice"
        actor: ServicingCarrier
        preconditions:
          - "non_renewal_notice_count == 0"
          - "complaint_freeze_active == false"
          - "clock <= expiration_date - 45 days"
          - "Carrier.non_renewal_count_current_period < 3"
        side_effects:
          - "non_renewal_notice_count = 1; non_renewal_effective_date = expiration_date"
          - "Carrier.non_renewal_count_current_period += 1"
      - from: NON_RENEWAL_PENDING
        to: NON_RENEWED
        trigger: "POST /plan/_clock/set_current_utc advancing the clock to or past non_renewal_effective_date, observed on the next read of the policy"
        actor: system
        preconditions:
          - "clock >= non_renewal_effective_date"
        side_effects:
          - "Assignment.status = CLOSED; Carrier.assigned_risk_count -= 1"
      - from: IN_FORCE
        to: CANCELLED
        trigger: "POST /plan/policies/{id}/cancellation"
        actor: ServicingCarrier | PlanAdministrator | ProducerAgent
        preconditions:
          - "complaint_freeze_active == false"
          - "cancellation_reason_code is permitted for the elapsed term position (see validations)"
        side_effects:
          - "earned_premium_cents, refund_basis, refund_paid_cents and balance_due_cents settled"
          - "premium_settlement_status advances on the money axis"
      - from: IN_FORCE
        to: EXITED_TO_VOLUNTARY
        trigger: "POST /plan/policies/{id}/voluntary-exit"
        actor: PlanAdministrator
        preconditions:
          - "Applicant.clean_years_credited >= 3"
          - "no Claim with status IN {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "Carrier.voluntary_credit_units increased by the territory-weighted credit"

  - entity: Policy
    state_field: premium_settlement_status
    initial_state: PREMIUM_OUTSTANDING
    terminal_states: [REFUND_ISSUED, BALANCE_DUE_AT_CANCELLATION]
    note: "Money axis. At issuance the initial state is chosen by the ledger: PAID_IN_FULL when premium_credited_cents >= total_annual_charge_cents, otherwise PREMIUM_OUTSTANDING."
    transitions:
      - from: PREMIUM_OUTSTANDING
        to: PAID_IN_FULL
        trigger: "POST /plan/applications/{id}/deposit followed by the credit sweep, or POST /plan/policies/{id}/reclassification lowering total_annual_charge_cents to at or below premium_credited_cents"
        actor: ProducerAgent | PlanAdministrator
        preconditions:
          - "premium_credited_cents >= total_annual_charge_cents after the write"
        side_effects:
          - "additional_premium_due_cents = 0"
          - "policy_status is NOT touched"
      - from: PAID_IN_FULL
        to: PREMIUM_OUTSTANDING
        trigger: "POST /plan/policies/{id}/reclassification raising total_annual_charge_cents above premium_credited_cents"
        actor: PlanAdministrator
        preconditions:
          - "total_annual_charge_cents > premium_credited_cents after re-rating"
        side_effects:
          - "additional_premium_due_cents = total_annual_charge_cents - premium_credited_cents"
      - from: PAID_IN_FULL
        to: REFUND_ISSUED
        trigger: "POST /plan/policies/{id}/cancellation producing a positive refund"
        actor: ServicingCarrier | PlanAdministrator | ProducerAgent
        preconditions:
          - "premium_credited_cents - earned_premium_cents > 0"
        side_effects:
          - "refund_paid_cents += premium_credited_cents - earned_premium_cents; premium_credited_cents = earned_premium_cents"
      - from: PREMIUM_OUTSTANDING
        to: REFUND_ISSUED
        trigger: "POST /plan/policies/{id}/cancellation producing a positive refund"
        actor: ServicingCarrier | PlanAdministrator | ProducerAgent
        preconditions:
          - "premium_credited_cents - earned_premium_cents > 0"
        side_effects:
          - "refund_paid_cents += premium_credited_cents - earned_premium_cents; balance_due_cents = 0"
      - from: PREMIUM_OUTSTANDING
        to: BALANCE_DUE_AT_CANCELLATION
        trigger: "POST /plan/policies/{id}/cancellation where earned premium exceeds the credited deposit"
        actor: ServicingCarrier | PlanAdministrator | ProducerAgent
        preconditions:
          - "earned_premium_cents - premium_credited_cents > 0"
        side_effects:
          - "balance_due_cents = earned_premium_cents - premium_credited_cents; refund_paid_cents unchanged"
      - from: PREMIUM_OUTSTANDING
        to: PAID_IN_FULL
        trigger: "POST /plan/policies/{id}/cancellation where earned premium exactly equals the credited deposit"
        actor: ServicingCarrier | PlanAdministrator | ProducerAgent
        preconditions:
          - "earned_premium_cents == premium_credited_cents"
        side_effects:
          - "refund_paid_cents unchanged; balance_due_cents = 0"

  - entity: Carrier
    state_field: status
    initial_state: ACTIVE
    terminal_states: [EXIT_COMPLETE]
    transitions:
      - from: ACTIVE
        to: EXIT_NOTICED
        trigger: "POST /plan/carriers/{id}/exit-notice"
        actor: PlanAdministrator
        preconditions:
          - "Carrier.status == ACTIVE"
          - "exit_effective_date >= clock + 90 days"
        side_effects:
          - "posture recomputed to SUSPENDED (status != ACTIVE dominates the posture ladder)"
          - "every Policy of this carrier with policy_status == IN_FORCE moves to REASSIGNMENT_PENDING and gets a REASSIGNMENT Assignment"
          - "every Assignment of this carrier with status == PENDING_ACCEPTANCE is RESCINDED with reason CARRIER_INELIGIBLE and its Application returns to CERTIFIED_AWAITING_ASSIGNMENT"
          - "the carrier is dropped from the apportionment denominator, so every remaining ACTIVE carrier's quota_target_units is recomputed"
      - from: EXIT_NOTICED
        to: EXIT_COMPLETE
        trigger: "acceptance of the last outstanding REASSIGNMENT Assignment (bubble-up)"
        actor: system
        preconditions:
          - "no Policy of this carrier has policy_status IN {IN_FORCE, REASSIGNMENT_PENDING, NON_RENEWAL_PENDING}"
        side_effects:
          - "assigned_risk_count == 0; posture stays SUSPENDED"

  - entity: Complaint
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_NOT_UPHELD]
    transitions:
      - from: OPEN
        to: FINDINGS_RECORDED
        trigger: "POST /plan/complaints/{id}/findings"
        actor: ComplianceExaminer
        preconditions:
          - "Complaint.status == OPEN"
        side_effects:
          - "findings_recorded_by_user_id = X-User-ID; findings_note stored"
      - from: FINDINGS_RECORDED
        to: RESOLVED_UPHELD
        trigger: "POST /plan/complaints/{id}/resolution with disposition == UPHELD"
        actor: ComplianceExaminer
        preconditions:
          - "X-User-ID != findings_recorded_by_user_id (segregation of duties)"
        side_effects:
          - "Carrier.upheld_complaint_count += 1 and Carrier.performance_score -= 20 (floor 0)"
          - "Carrier.posture recomputed; if it becomes SUSPENDED, every PENDING_ACCEPTANCE Assignment of that carrier is RESCINDED with reason CARRIER_INELIGIBLE and each Application returns to CERTIFIED_AWAITING_ASSIGNMENT"
          - "Policy.open_complaint_count -= 1 and complaint_freeze_active recomputed"
      - from: FINDINGS_RECORDED
        to: RESOLVED_NOT_UPHELD
        trigger: "POST /plan/complaints/{id}/resolution with disposition == NOT_UPHELD"
        actor: ComplianceExaminer
        preconditions:
          - "X-User-ID != findings_recorded_by_user_id"
        side_effects:
          - "no score change; Policy.open_complaint_count -= 1 and complaint_freeze_active recomputed"
      - from: FINDINGS_RECORDED
        to: OPEN
        trigger: "POST /plan/complaints/{id}/resolution with disposition == RETURNED_FOR_FURTHER_REVIEW"
        actor: ComplianceExaminer
        preconditions:
          - "X-User-ID != findings_recorded_by_user_id"
          - "review_round < 3"
        side_effects:
          - "review_round += 1; findings_recorded_by_user_id and findings_note cleared so a fresh examiner may record findings"
          - "Policy.open_complaint_count unchanged — the freeze stays on"
        note: "Cycle edge; bounded by review_round < 3."

  - entity: Claim
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED_PAID, CLOSED_DENIED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /plan/claims/{id}/acknowledgement"
        actor: ServicingCarrier
        preconditions:
          - "the caller's Carrier.id == the policy's carrier_id"
        side_effects:
          - "acknowledged_at = clock"
          - "when acknowledged_at > acknowledgement_deadline: standard_breach = true, Carrier.breach_count_current_period += 1, Carrier.performance_score -= 5 (floor 0), posture recomputed"
      - from: ACKNOWLEDGED
        to: CLOSED_PAID
        trigger: "POST /plan/claims/{id}/closure with disposition == PAID"
        actor: ServicingCarrier
        preconditions:
          - "paid_cents <= reserve_cents"
        side_effects:
          - "paid_cents recorded"
          - "when at_fault == true the applicant's last_chargeable_event_date and clean_years_credited are recomputed"
      - from: ACKNOWLEDGED
        to: CLOSED_DENIED
        trigger: "POST /plan/claims/{id}/closure with disposition == DENIED"
        actor: ServicingCarrier
        preconditions:
          - "denial_reason is present"
        side_effects:
          - "paid_cents stays 0"

  - entity: AssignmentCycle
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /plan/assignment-cycles/{id}/run"
        actor: PlanAdministrator
        preconditions:
          - "AssignmentCycle.status == SCHEDULED"
          - "clock >= window_start"
          - "parent PlanPeriod.status == OPEN"
        side_effects:
          - "run_at = clock; assigned_count and deferred_count finalised"

  - entity: PlanPeriod
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RECONCILING
        trigger: "POST /plan/plan-periods/{id}/closure"
        actor: PlanAdministrator
        preconditions:
          - "PlanPeriod.status == OPEN"
          - "clock >= window_end"
          - "no AssignmentCycle of this period has status == SCHEDULED"
        side_effects:
          - "total_assignable_units and total_assignable_car_years frozen at the closure instant"
          - "every ACTIVE Carrier: breach_count_current_period = 0, non_renewal_count_current_period = 0, performance_score = min(100, performance_score + 10), posture recomputed"
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /plan/quota-reconciliations completing the last outstanding carrier (bubble-up)"
        actor: system
        preconditions:
          - "every Carrier with status == ACTIVE has a QuotaReconciliation for this period with status == FINAL"
        side_effects:
          - "no further QuotaReconciliation rows may be created for this period"

  - entity: QuotaReconciliation
    state_field: status
    initial_state: FINAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: FINAL
        to: SUPERSEDED
        trigger: "POST /plan/quota-reconciliations for the same carrier_id and plan_period_id"
        actor: PlanAdministrator
        preconditions:
          - "the new request carries a matching expected_carrier_version"
        side_effects:
          - "the prior row's status = SUPERSEDED; Carrier.penalty_balance_cents recomputed from FINAL rows only"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quota-reconciliation-supersede
    parent_entity: Carrier
    write_endpoint: "POST /plan/quota-reconciliations"
    occ_field: "expected_carrier_version"
    description: |
      A reconciliation is filed against a carrier's counted volume, and the plan
      permits a later filing on a different basis to legitimately supersede the
      prior FINAL row for the same carrier and period. Because the supersede is
      lawful on its own terms, the request must pin the carrier state it measured:
      a request whose expected_carrier_version no longer matches Carrier.version
      is rejected, since the carrier's assigned_risk_count or voluntary_credit_units
      moved after the filer read them and the variance would be computed off stale
      volume.
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412

  - rule_id: policy-reclassification-supersede
    parent_entity: Policy
    write_endpoint: "POST /plan/policies/{id}/reclassification"
    occ_field: "expected_policy_version"
    description: |
      Driver reclassification re-rates an in-force policy and rewrites the premium
      ledger, and the plan allows a later reclassification to supersede an earlier
      one within the same term. The request must therefore pin the rating revision
      it was computed against: an expected_policy_version that no longer matches
      Policy.version is rejected, because premium_credited_cents or
      surcharge_points_applied changed after the filer read them and re-rating from
      that stale base would corrupt the deposit invariant.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: surcharge_points
    trigger: "on POST /plan/applications/{id}/certification (estimate), on POST /plan/policies (final rating) and on POST /plan/policies/{id}/reclassification (re-rating)"
    algorithm: aggregation
    formula: |
      source = Application.verified_violations if Application.mvr_verified_at is not null
               else Application.declared_violations
      # experience window: strictly inside the 1095-day lookback
      in_window = [v for v in source
                   if v.conviction_date > rating_date - 1095 days
                   and v.conviction_date <= rating_date]
      raw = sum(VIOLATION_POINTS[v.code] for v in in_window)
            + DRIVER_CLASS_POINT_ADDER[driver_class]
      points = min(POINTS_CAP, raw)
    input_set: "verified_violations when the MVR has been pulled, otherwise declared_violations; only convictions strictly newer than rating_date - 1095 days"
    constants:
      VIOLATION_POINTS:
        SPEEDING_MINOR: 1
        SPEEDING_MAJOR: 3
        AT_FAULT_ACCIDENT: 3
        LICENSE_SUSPENSION: 4
        RECKLESS_DRIVING: 5
        DUI: 8
      DRIVER_CLASS_POINT_ADDER:
        ADULT: 0
        SENIOR: 1
        YOUTHFUL_OPERATOR: 3
      POINTS_CAP: 15
      EXPERIENCE_WINDOW_DAYS: 1095
    precision: "integer points; the window bound is strict (>), so a conviction exactly 1095 days before the rating date is excluded"
    variants:
      - name: estimated_points
        when: "certification, using the rating date == clock at certification"
        difference: "written to Application.surcharge_points_estimated; the reclassification driver class is not yet known"
      - name: applied_points
        when: "policy issuance and reclassification, using rating_date == Policy.effective_date"
        difference: "written to Policy.surcharge_points_applied; the lookback anchor moves to the policy effective date, so a conviction can age out between certification and issuance"

  - name: annual_premium
    trigger: "on POST /plan/policies and POST /plan/policies/{id}/reclassification; also for the Application estimate fields"
    algorithm: weighted_scoring
    formula: |
      base    = TERRITORY_BASE_ANNUAL_CENTS[vehicle.garaging_territory_code]
      klass   = CLASS_FACTORS[vehicle.vehicle_class_code]
      surch   = SURCHARGE_FACTOR(points)     # step function, see constants
      # per-line rounding, THEN sum. Never sum the unrounded lines and round once.
      for line, share in [("BI", 0.55), ("PD", 0.30), ("UM", 0.15)]:
          premium_lines[line] = round_half_up(base * share * klass * surch)
      final_premium_cents = premium_lines.BI + premium_lines.PD + premium_lines.UM
    input_set: "the Vehicle referenced by the Application, the Applicant's driver_class, and the in-window violations"
    constants:
      TERRITORY_BASE_ANNUAL_CENTS:
        T01: 96475
        T02: 148337
        T03: 231909
      LINE_SHARES:
        BI: 0.55
        PD: 0.30
        UM: 0.15
      CLASS_FACTORS:
        PLEASURE: 1.00
        WORK_LT10: 1.10
        WORK_GE10: 1.25
        BUSINESS: 1.45
      SURCHARGE_FACTOR:
        "0": 1.00
        "1-3": 1.15
        "4-5": 1.35
        "6-9": 1.60
        "10+": 1.90
    precision: |
      Each coverage line is rounded half-up to whole cents independently and the three
      rounded lines are summed. For T02 / PLEASURE / 6 points this yields
      130537 + 71202 + 35601 = 237340, whereas rounding the unrounded sum yields
      237339 — a one-cent divergence that propagates into the expense tier and deposit.

  - name: plan_expense_charge
    trigger: "immediately after annual_premium, on the same endpoints"
    algorithm: tiered_pricing
    formula: |
      rate = 0.06 if final_premium_cents <  75000
             else 0.05 if final_premium_cents < 150000
             else 0.04
      plan_expense_charge_cents = round_half_up(final_premium_cents * rate)
      total_annual_charge_cents = final_premium_cents + plan_expense_charge_cents
    input_set: "the policy's own final_premium_cents only"
    constants:
      EXPENSE_TIER_1_CEILING_CENTS: 75000
      EXPENSE_TIER_2_CEILING_CENTS: 150000
      EXPENSE_RATE_TIER_1: 0.06
      EXPENSE_RATE_TIER_2: 0.05
      EXPENSE_RATE_TIER_3: 0.04
    precision: |
      The tier is selected from the PRE-charge premium, never from the charge-inclusive
      total. T02 / PLEASURE / 0 points gives final_premium_cents == 148337, which sits in
      tier 2 (rate 0.05) → charge 7417 and total 155754. Selecting the tier from the
      charge-inclusive total (155754 >= 150000 → 0.04) would give 5933 / 154270 and is wrong.
      Tier ceilings are exclusive: a final premium of exactly 150000 is in tier 3.

  - name: required_deposit
    trigger: "on POST /plan/applications and recomputed on every deposit and resubmission"
    algorithm: threshold
    formula: |
      required_deposit_cents = max(round_half_up(estimated_total_charge_cents * 0.25),
                                   DEPOSIT_FLOOR_CENTS)
    input_set: "Application.estimated_total_charge_cents"
    constants:
      DEPOSIT_PERCENT: 0.25
      DEPOSIT_FLOOR_CENTS: 15000
    precision: "whole cents, round_half_up; certification compares with >= so paying exactly the required deposit passes"

  - name: earned_premium_at_cancellation
    trigger: "on POST /plan/policies/{id}/cancellation"
    algorithm: threshold
    formula: |
      days_in_force = whole_days(cancellation_effective_date - Policy.effective_date)
      # variant selection is by initiating party, see variants
      pro_rata   = round_half_up(total_annual_charge_cents * days_in_force / 365)
      short_rate = min(total_annual_charge_cents,
                       max(SHORT_RATE_MINIMUM_CENTS,
                           round_half_up(total_annual_charge_cents * days_in_force / 365
                                         * SHORT_RATE_PENALTY_MULTIPLIER)))
      earned_premium_cents = pro_rata if refund_basis == PRO_RATA else short_rate
      refund_paid_cents  += max(0, premium_credited_cents - earned_premium_cents)
      balance_due_cents   = max(0, earned_premium_cents - premium_credited_cents)
      premium_credited_cents = min(premium_credited_cents, earned_premium_cents)
    input_set: "the single Policy being cancelled; days_in_force uses whole days and the term is half-open [effective_date, cancellation_effective_date)"
    constants:
      DAYS_PER_YEAR: 365
      SHORT_RATE_PENALTY_MULTIPLIER: 1.10
      SHORT_RATE_MINIMUM_CENTS: 5000
    precision: "whole cents, round_half_up; the penalty multiplier is applied inside the rounding, not to a pre-rounded pro-rata figure"
    variants:
      - name: pro_rata
        when: "cancellation_initiated_by IN {CARRIER, PLAN} — the insured keeps every unearned cent"
        difference: "refund_basis = PRO_RATA; no penalty multiplier, no minimum retained premium"
      - name: short_rate
        when: "cancellation_initiated_by == INSURED — mid-term withdrawal by the insured"
        difference: "refund_basis = SHORT_RATE; earned premium is inflated 10% and floored at 5000 cents, then clamped to the full term charge. On a 246834-cent policy cancelled 91 days in, pro-rata earns 61539 (refund 185295) while short-rate earns 67693 (refund 179141)."

  - name: carrier_quota_target_units
    trigger: "recomputed on every mutation that changes the ACTIVE carrier set, any carrier's voluntary_market_share_bps, or the period's total_assignable_units"
    algorithm: waterfall_allocation
    formula: |
      actives = [c for c in Carrier if c.status == ACTIVE]     # EXIT_NOTICED carriers drop out
      S       = sum(c.voluntary_market_share_bps for c in actives)
      total   = current PlanPeriod.total_assignable_units
      for c in actives:
          exact_c     = total * c.voluntary_market_share_bps / S
          floor_c     = floor(exact_c)
          remainder_c = exact_c - floor_c
      leftover = total - sum(floor_c)
      # largest-remainder: hand the leftover units out one at a time
      order = sort(actives, key=(remainder DESC,
                                voluntary_market_share_bps DESC,
                                enrollment_sequence ASC))
      quota_target_units = floor_c + (1 if c in order[:leftover] else 0)
      quota_variance_units = assigned_risk_count + voluntary_credit_units - quota_target_units
      overallocated        = quota_variance_units > 0
    input_set: "Carrier rows with status == ACTIVE; the PlanPeriod with status IN {OPEN, RECONCILING}"
    constants:
      APPORTIONMENT_METHOD: largest_remainder
    precision: |
      Exact quotients are kept unrounded for the remainder comparison; targets are whole
      units that always sum exactly to total_assignable_units. Ties on the remainder are
      broken by the larger market share and then by the lower enrollment_sequence — never
      by `id`. Example: total 2 with shares 500 / 1500 gives exacts 0.5 / 1.5, floors 0 / 1,
      one leftover unit, and a 0.5 / 0.5 remainder tie that the 1500-bps carrier wins, so
      the targets are 0 and 2.

  - name: carrier_selection_for_assignment
    trigger: "on POST /plan/assignment-cycles/{id}/run for each queued application, and once per exiting policy inside POST /plan/carriers/{id}/exit-notice"
    algorithm: chronological
    formula: |
      # 1. queue construction (cycle run only)
      queue = [a for a in Application
               if a.status IN {CERTIFIED_AWAITING_ASSIGNMENT, DEFERRED_NO_CARRIER}
               and cycle.window_start <= a.certified_at <= cycle.window_end]
      queue.sort(key=(certified_at ASC, intake_sequence ASC))
      # 2. per-application candidate filter
      for app in queue:
          candidates = [c for c in Carrier
                        if c.status == ACTIVE
                        and c.posture == OPEN
                        and app.vehicle.garaging_territory_code in c.licensed_territories
                        and c.id != excluded_carrier_id]      # exit cascade excludes the exiting carrier
          if candidates is empty:
              app.status = DEFERRED_NO_CARRIER; cycle.deferred_count += 1; continue
          # 3. ranking — greatest unmet quota first
          winner = max(candidates, key=(quota_target_units - assigned_risk_count DESC,
                                        voluntary_market_share_bps DESC,
                                        created_at ASC,
                                        enrollment_sequence ASC))
          # 4. state is written before the next application is ranked
          winner.assigned_risk_count += 1     # recompute variance / overallocated / posture
          create Assignment(kind=INITIAL, status=PENDING_ACCEPTANCE,
                            deficit_score_at_selection=<deficit measured in step 3>,
                            batch_sequence=<1-based order within this run>)
    input_set: "Carrier rows that are ACTIVE, posture OPEN and licensed in the vehicle's garaging territory"
    constants:
      ACCEPTANCE_WINDOW_DAYS: 10
    precision: |
      The ranking is recomputed after every placement inside the same run, so ordering is
      observable: two applications in one run can land on different carriers even though the
      candidate set never changes. A deficit of 0 or below does not disqualify a carrier —
      when it is the only licensed candidate it takes the risk and becomes overallocated.
      Tie-breaks never use `id`.

  - name: clean_years_credited
    trigger: "recomputed on claim closure, MVR verification, policy issuance and every read of the Applicant"
    algorithm: decay_function
    formula: |
      events = [v.conviction_date for each verified violation on this applicant's applications]
             + [cl.loss_date for cl in this applicant's Claim rows if cl.at_fault]
      last_chargeable_event_date = max(events) if events else Applicant.first_licensed_date
      clean_years_credited = min(CLEAN_YEARS_CAP,
                                 floor(whole_days(clock - last_chargeable_event_date) / 365))
    input_set: "verified violations and at-fault claims of the applicant; declared-but-unverified violations are ignored"
    constants:
      CLEAN_YEARS_CAP: 5
      VOLUNTARY_EXIT_MIN_CLEAN_YEARS: 3
    precision: |
      Whole days, floored. At clock 2026-09-15 a chargeable event on 2023-09-16 is exactly
      1095 days back → 3 clean years → voluntary exit is allowed; an event on 2023-09-20 is
      1091 days back → 2 clean years → exit is refused. Note the deliberate interaction with
      surcharge_points: an event exactly 1095 days old grants the third clean year and at the
      same instant falls outside the strict points window.

  - name: exposure_car_years
    trigger: "on POST /plan/plan-periods/{id}/closure and on POST /plan/quota-reconciliations with basis == CAR_YEAR_EXPOSURE"
    algorithm: interval_merge
    formula: |
      def policy_car_years(p, period):
          lo   = max(p.effective_date, period.window_start)
          hi   = min(p.expiration_date, period.window_end + 1 day, clock)
          days = max(0, whole_days(hi - lo))
          return round_half_up(days / 365, 4)
      carrier_car_years = sum(policy_car_years(p, period)
                              for p in Policy where p.carrier_id == carrier.id
                              and p.policy_status != CANCELLED)
      period.total_assignable_car_years = sum(carrier_car_years(c, period)
                                              for c in Carrier if c.status == ACTIVE)
    input_set: "Policy rows of the carrier whose term overlaps the period window and whose policy_status is not CANCELLED"
    constants:
      DAYS_PER_YEAR: 365
      CAR_YEAR_DECIMALS: 4
    precision: |
      The period window is inclusive on both ends, so the exposure interval runs to
      window_end + 1 day; the running clock also caps it. Each policy is rounded to 4
      decimals first, carrier totals sum the already-rounded values, and the period total
      sums the already-rounded carrier values. For a period 2026-09-01..2026-11-30 read at
      clock 2026-11-30: a policy effective 2026-11-24 contributes 6 days → 0.0164 and a
      policy effective 2026-09-01 contributes 90 days → 0.2466, giving 0.2630 in total.

  - name: quota_reconciliation_variance
    trigger: "on POST /plan/quota-reconciliations"
    algorithm: aggregation
    formula: |
      if basis == POLICY_COUNT:
          obligation_units = carrier.quota_target_units                       # whole units
          credited_units   = carrier.assigned_risk_count + carrier.voluntary_credit_units
      else:  # CAR_YEAR_EXPOSURE
          S = sum(c.voluntary_market_share_bps for c in Carrier if c.status == ACTIVE)
          obligation_units = round_half_up(period.total_assignable_car_years
                                           * carrier.voluntary_market_share_bps / S, 4)
          credited_units   = carrier_car_years(carrier, period) + carrier.voluntary_credit_units
      variance_units = credited_units - obligation_units
      penalty_cents  = round_half_up(max(0, -variance_units) * DEFICIENCY_PENALTY_CENTS_PER_UNIT)
      voluntary_credit_units_applied = carrier.voluntary_credit_units
    input_set: "one Carrier and one PlanPeriod; the period must be in status RECONCILING"
    constants:
      DEFICIENCY_PENALTY_CENTS_PER_UNIT: 25000
    precision: "POLICY_COUNT variance carries 1 decimal (voluntary credit is granted in halves); CAR_YEAR_EXPOSURE variance carries 4 decimals; the penalty is whole cents, round_half_up"
    variants:
      - name: policy_count_basis
        when: "basis == POLICY_COUNT — the plan's headcount measure"
        difference: "obligation is the integer largest-remainder target and credit is the live assigned_risk_count, so a carrier that took its whole target shows variance 0 and no penalty"
      - name: car_year_exposure_basis
        when: "basis == CAR_YEAR_EXPOSURE — the plan's earned-exposure measure"
        difference: "obligation and credit are both car-years, so a carrier that took its full headcount late in the period is still deficient. On the fixture above the same carrier reconciles to variance 0 / penalty 0 on POLICY_COUNT and variance -0.1151 / penalty 2878 on CAR_YEAR_EXPOSURE."

  - name: carrier_performance_and_posture
    trigger: "recomputed after every claim acknowledgement, complaint resolution, assignment rescission, exit notice, plan-period closure and quota recomputation"
    algorithm: constraint_propagation
    formula: |
      performance_score = clamp(0, 100,
            100
            - 5  * (claim acknowledgements past the deadline, lifetime)
            - 20 * (complaints resolved UPHELD, lifetime)
            - 5  * (assignments rescinded for ISSUANCE_DEADLINE_MISSED, lifetime)
            + 10 * (plan periods closed while this carrier was ACTIVE))
      # posture ladder — first matching rule wins
      posture = SUSPENDED  if status != ACTIVE
                SUSPENDED  if performance_score < 70
                RESTRICTED if 70 <= performance_score <= 84
                RESTRICTED if breach_count_current_period >= 3
                RESTRICTED if overallocated
                OPEN       otherwise
    input_set: "the carrier's lifetime Claim, Complaint and Assignment history plus the current period counters"
    constants:
      SCORE_START: 100
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      ACK_BREACH_DEDUCTION: 5
      UPHELD_COMPLAINT_DEDUCTION: 20
      MISSED_ISSUANCE_DEDUCTION: 5
      PERIOD_CLOSURE_RECOVERY: 10
      SUSPENSION_SCORE_CEILING: 70
      RESTRICTION_SCORE_CEILING: 85
      BREACH_RESTRICTION_THRESHOLD: 3
    precision: |
      Integer score, clamped after every individual adjustment (not once at the end), so two
      upheld complaints take a fresh carrier 100 → 80 → 60: the first lands it in RESTRICTED
      and the second in SUSPENDED. The ladder is ordered — an overallocated carrier with a
      score of 60 reports SUSPENDED, not RESTRICTED.

  - name: voluntary_writing_credit
    trigger: "on POST /plan/policies/{id}/voluntary-exit"
    algorithm: aggregation
    formula: |
      territory = the Vehicle's garaging_territory_code
      credit    = UNDERSERVED_CREDIT_MULTIPLIER if territory in period.underserved_territories
                  else STANDARD_CREDIT_UNITS
      Carrier.voluntary_credit_units += credit
    input_set: "the PlanPeriod with status IN {OPEN, RECONCILING} at the moment of exit"
    constants:
      STANDARD_CREDIT_UNITS: 1.0
      UNDERSERVED_CREDIT_MULTIPLIER: 1.5
    precision: "1 decimal place; credit accrues to the carrier that serviced the policy at exit, not to the original assignee"

  - name: distinct_rejection_count
    trigger: "on POST /plan/applications/{id}/market-rejections, on resubmission, and on certification"
    algorithm: aggregation
    formula: |
      window_start = clock - VOLUNTARY_REJECTION_LOOKBACK_DAYS
      distinct_rejection_count = count(distinct r.rejecting_carrier_naic_code
                                       for r in MarketRejection
                                       where r.application_id == app.id
                                       and window_start <= r.rejection_date <= clock)
    input_set: "the application's MarketRejection rows inside the lookback window; duplicate NAIC codes collapse to one"
    constants:
      VOLUNTARY_REJECTION_LOOKBACK_DAYS: 90
      MIN_DISTINCT_REJECTIONS: 2
    precision: "integer count; the window is inclusive on both ends, so a declination dated exactly 90 days before the clock still counts"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in this order; the first
#     failing rule's error_id is returned and no later rule is evaluated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-API-Key and X-Role headers are present and the role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: request_shape
    check: "required body fields present, enums in range, integers non-negative where required, ISO-8601 timestamps, limit in 1..100 and offset >= 0, expiration_date == effective_date + 365 days omitted here (see priority 10)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "every id in the path and then every id in the body resolves to a row, validated left-to-right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: auth
    check: "a ServicingCarrier caller may only act on Assignment / Policy / Claim rows whose carrier_id equals the carrier the caller is bound to"
    error_id: ERR_CARRIER_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "POST /plan/assignments/{id}/acceptance, POST /plan/policies, POST /plan/policies/{id}/non-renewal-notice, POST /plan/policies/{id}/cancellation, POST /plan/claims, POST /plan/claims/{id}/acknowledgement, POST /plan/claims/{id}/closure"

  - priority: 5
    category: auth
    check: "a ProducerAgent caller may only act on Application / Policy rows whose producer of record is the producer the caller is bound to"
    error_id: ERR_PRODUCER_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "POST /plan/applications/{id}/market-rejections, POST /plan/applications/{id}/deposit, POST /plan/applications/{id}/resubmission, POST /plan/policies/{id}/cancellation"

  - priority: 6
    category: state
    check: "the target row is in a state from which the requested transition exists (see §1.2)"
    error_id: "ERR_INVALID_<ENTITY>_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 6
    category: state
    check: "the Carrier the operation designates has status == ACTIVE"
    error_id: ERR_CARRIER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /plan/carriers/{id}/exit-notice, POST /plan/carriers/{id}/licensing-amendment, POST /plan/quota-reconciliations"

  - priority: 7
    category: state
    check: "expected_carrier_version / expected_policy_version matches the parent row's current version (see §1.2.1)"
    error_id: "ERR_STALE_CARRIER_VERSION | ERR_STALE_POLICY_VERSION"
    http_status: 412
    applies_to: "POST /plan/quota-reconciliations, POST /plan/policies/{id}/reclassification"

  - priority: 8
    category: business_safety
    check: "certification requires Application.mvr_verified_at to be non-null — the plan may not certify an unverified driving record"
    error_id: ERR_MVR_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /plan/applications/{id}/certification"

  - priority: 8
    category: business_safety
    check: "certification requires distinct_rejection_count >= 2 — documented voluntary-market declinations from two different carriers inside the 90-day lookback"
    error_id: ERR_INSUFFICIENT_MARKET_REJECTIONS
    http_status: 422
    applies_to: "POST /plan/applications/{id}/certification"
    note: "Outranks the deposit check at priority 12: an ineligible risk is refused before the plan looks at money."

  - priority: 8
    category: business_safety
    check: "the designated Carrier.posture != SUSPENDED"
    error_id: ERR_CARRIER_SUSPENDED
    http_status: 409
    applies_to: "POST /plan/assignments/{id}/acceptance, POST /plan/policies"

  - priority: 8
    category: business_safety
    check: "clock <= Assignment.acceptance_deadline"
    error_id: ERR_ACCEPTANCE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /plan/assignments/{id}/acceptance"

  - priority: 8
    category: business_safety
    check: "the X-User-ID resolving a complaint differs from Complaint.findings_recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /plan/complaints/{id}/resolution"

  - priority: 9
    category: business_referential
    check: "the Policy has complaint_freeze_active == false — an unresolved complaint freezes adverse action against the insured"
    error_id: ERR_COMPLAINT_FREEZE_ACTIVE
    http_status: 409
    applies_to: "POST /plan/policies/{id}/cancellation, POST /plan/policies/{id}/non-renewal-notice"
    note: "Outranks the permitted-reason check at priority 10."

  - priority: 9
    category: business_referential
    check: "no Claim of the policy has status IN {OPEN, ACKNOWLEDGED}"
    error_id: ERR_OPEN_CLAIM_BLOCKS_EXIT
    http_status: 409
    applies_to: "POST /plan/policies/{id}/voluntary-exit"

  - priority: 9
    category: business_referential
    check: "the Vehicle referenced by an Application belongs to the Application's applicant_id"
    error_id: ERR_VEHICLE_APPLICANT_MISMATCH
    http_status: 422
    applies_to: "POST /plan/applications"

  - priority: 9
    category: business_referential
    check: "rejecting_carrier_naic_code equals the naic_code of some Carrier row"
    error_id: ERR_REJECTING_CARRIER_UNKNOWN
    http_status: 422
    applies_to: "POST /plan/applications/{id}/market-rejections"

  - priority: 9
    category: business_referential
    check: "the application does not already carry a MarketRejection with the same rejecting_carrier_naic_code inside the lookback window"
    error_id: ERR_DUPLICATE_REJECTING_CARRIER
    http_status: 409
    applies_to: "POST /plan/applications/{id}/market-rejections"

  - priority: 9
    category: business_referential
    check: "the complaint's carrier_id equals the policy's current carrier_id"
    error_id: ERR_COMPLAINT_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /plan/complaints"

  - priority: 9
    category: business_referential
    check: "the Producer of record has status == ACTIVE"
    error_id: ERR_PRODUCER_SUSPENDED
    http_status: 409
    applies_to: "POST /plan/applications, POST /plan/applications/{id}/resubmission"

  - priority: 9
    category: business_referential
    check: "the applicant's territory_code is in the producer's appointed_territories"
    error_id: ERR_PRODUCER_TERRITORY_NOT_APPOINTED
    http_status: 422
    applies_to: "POST /plan/applications"

  - priority: 10
    category: business_temporal
    check: "when whole_days(cancellation_effective_date - effective_date) > 60, cancellation_reason_code must be in {NON_PAYMENT_OF_PREMIUM, LICENSE_SUSPENDED, MATERIAL_MISREPRESENTATION, INSURED_REQUEST}; VEHICLE_NOT_GARAGED_IN_STATE and PLAN_ORDERED are first-60-day reasons only"
    error_id: ERR_CANCEL_REASON_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /plan/policies/{id}/cancellation"
    note: "Boundary is strict: exactly 60 days in force still permits the restricted reasons; 61 days does not."

  - priority: 10
    category: business_temporal
    check: "cancellation_effective_date is inside [effective_date, expiration_date] and >= clock"
    error_id: ERR_CANCEL_DATE_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /plan/policies/{id}/cancellation"

  - priority: 10
    category: business_temporal
    check: "no other Policy on the same Vehicle whose half-open term [effective_date, expiration_date) intersects the requested term; adjacency (new effective_date == prior expiration_date) is permitted"
    error_id: ERR_POLICY_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /plan/policies"

  - priority: 10
    category: business_temporal
    check: "the new AssignmentCycle's closed window [window_start, window_end] is separated from every sibling cycle of the same period by at least one clear day (window_start >= prior.window_end + 2 days, or window_end + 2 days <= prior.window_start)"
    error_id: ERR_CYCLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /plan/assignment-cycles"
    note: "Unlike policy terms, cycle windows are closed intervals and mere adjacency is refused — the plan needs a clear settlement day between runs."

  - priority: 10
    category: business_temporal
    check: "the AssignmentCycle window lies inside the parent PlanPeriod window"
    error_id: ERR_CYCLE_WINDOW_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /plan/assignment-cycles"

  - priority: 10
    category: business_temporal
    check: "the new PlanPeriod's closed window does not intersect any existing PlanPeriod window"
    error_id: ERR_PERIOD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /plan/plan-periods"

  - priority: 10
    category: business_temporal
    check: "expiration_date == effective_date + 365 days and effective_date >= clock"
    error_id: ERR_POLICY_TERM_INVALID
    http_status: 422
    applies_to: "POST /plan/policies"

  - priority: 10
    category: business_temporal
    check: "clock <= expiration_date - 45 days when serving a non-renewal notice"
    error_id: ERR_NON_RENEWAL_NOTICE_TOO_LATE
    http_status: 422
    applies_to: "POST /plan/policies/{id}/non-renewal-notice"

  - priority: 10
    category: business_temporal
    check: "exit_effective_date >= clock + 90 days"
    error_id: ERR_EXIT_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /plan/carriers/{id}/exit-notice"

  - priority: 10
    category: business_temporal
    check: "loss_date is inside [Policy.effective_date, clock]"
    error_id: ERR_LOSS_DATE_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /plan/claims"

  - priority: 10
    category: business_temporal
    check: "clock >= AssignmentCycle.window_start for a run, and clock >= PlanPeriod.window_end for a closure"
    error_id: ERR_WINDOW_NOT_REACHED
    http_status: 409
    applies_to: "POST /plan/assignment-cycles/{id}/run, POST /plan/plan-periods/{id}/closure"

  - priority: 11
    category: business_constraint
    check: "Application.cure_count < 2 when returning an application for cure"
    error_id: ERR_CURE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /plan/applications/{id}/cure-return"

  - priority: 11
    category: business_constraint
    check: "Complaint.review_round < 3 when returning a complaint for further review"
    error_id: ERR_REVIEW_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /plan/complaints/{id}/resolution"

  - priority: 11
    category: business_constraint
    check: "unique values: Carrier.naic_code, Producer.license_number, Applicant.driver_license_number, Vehicle.vin, PlanPeriod.period_code, Policy.policy_number"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /plan/carriers, POST /plan/producers, POST /plan/applicants, POST /plan/applicants/{id}/vehicles, POST /plan/plan-periods, POST /plan/policies"

  - priority: 11
    category: business_constraint
    check: "Carrier.non_renewal_count_current_period < 3 — the plan caps a carrier's non-renewals per period"
    error_id: ERR_NON_RENEWAL_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /plan/policies/{id}/non-renewal-notice"

  - priority: 11
    category: business_constraint
    check: "the designated Carrier is licensed in the vehicle's garaging_territory_code"
    error_id: ERR_CARRIER_NOT_LICENSED_IN_TERRITORY
    http_status: 422
    applies_to: "POST /plan/policies"

  - priority: 11
    category: business_constraint
    check: "Applicant.clean_years_credited >= 3 for a voluntary-market exit"
    error_id: ERR_CLEAN_YEARS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /plan/policies/{id}/voluntary-exit"

  - priority: 11
    category: business_constraint
    check: "paid_cents <= Claim.reserve_cents on a PAID closure"
    error_id: ERR_PAYMENT_EXCEEDS_RESERVE
    http_status: 422
    applies_to: "POST /plan/claims/{id}/closure"

  - priority: 11
    category: business_constraint
    check: "the PlanPeriod is in status RECONCILING when a reconciliation is filed"
    error_id: ERR_PERIOD_NOT_RECONCILING
    http_status: 409
    applies_to: "POST /plan/quota-reconciliations"

  - priority: 11
    category: business_constraint
    check: "no AssignmentCycle of the period is still SCHEDULED when the period is closed"
    error_id: ERR_CYCLE_STILL_SCHEDULED
    http_status: 409
    applies_to: "POST /plan/plan-periods/{id}/closure"

  - priority: 12
    category: business_fiscal
    check: "Application.deposit_paid_total_cents >= Application.required_deposit_cents at certification"
    error_id: ERR_DEPOSIT_BELOW_REQUIRED
    http_status: 422
    applies_to: "POST /plan/applications/{id}/certification"
    note: "Lowest-priority business check: money is verified only after eligibility and documentation."

  - priority: 12
    category: business_fiscal
    check: "deposit amount_cents >= 1"
    error_id: ERR_DEPOSIT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /plan/applications/{id}/deposit"

# =============================================================================
# §1.5 API Endpoint Table   (all paths sit under api_prefix /plan)
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- carriers
  - method: POST
    path: "/plan/carriers"
    description: "Enrol a voluntary-market carrier in the plan."
    roles: [PlanAdministrator]
    code: 201
    input: [name, naic_code, voluntary_market_share_bps, licensed_territories]
    output: Carrier
    side_effects:
      - "enrollment_sequence assigned as the next monotonic integer"
      - "status = ACTIVE, performance_score = 100, posture = OPEN"
      - "every ACTIVE carrier's quota_target_units recomputed (the apportionment denominator changed)"

  - method: GET
    path: "/plan/carriers"
    description: "List enrolled carriers."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: ["status?", "posture?", "territory_code?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: GET
    path: "/plan/carriers/{id}"
    description: "Read one carrier including its live quota, score, posture and version."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: POST
    path: "/plan/carriers/{id}/exit-notice"
    description: "File a carrier's notice of withdrawal from the plan and start reassignment of its book."
    roles: [PlanAdministrator]
    code: 200
    input: [exit_effective_date]
    output: Carrier
    side_effects:
      - "Carrier.status = EXIT_NOTICED and posture = SUSPENDED"
      - "every IN_FORCE Policy of the carrier moves to REASSIGNMENT_PENDING with reassignment_required = true"
      - "one REASSIGNMENT Assignment per reassigned policy, created in ascending Policy.created_at order with batch_sequence 1..n, each carrying predecessor_assignment_id"
      - "each receiving Carrier.assigned_risk_count += 1 with quota_variance_units, overallocated and posture recomputed"
      - "every PENDING_ACCEPTANCE Assignment of the exiting carrier is RESCINDED with reason CARRIER_INELIGIBLE and its Application returns to CERTIFIED_AWAITING_ASSIGNMENT"
      - "the exiting carrier leaves the apportionment denominator, so every remaining ACTIVE carrier's quota_target_units is recomputed"

  - method: POST
    path: "/plan/carriers/{id}/licensing-amendment"
    description: "Record a state filing that replaces the territories a carrier is licensed to write; the plan's book already placed with the carrier is untouched."
    roles: [PlanAdministrator]
    code: 200
    input: [licensed_territories]
    output: Carrier
    side_effects:
      - "licensed_territories replaced wholesale; existing Assignment and Policy rows are NOT reassigned, so a carrier can end up servicing a risk it may no longer write"
      - "posture recomputed; quota_target_units are unchanged because the ACTIVE carrier set and the share denominator did not move"
    note: "Only an ACTIVE carrier may amend its filings; a withdrawing carrier is refused with ERR_CARRIER_NOT_ACTIVE."

  # --------------------------------------------------------------- producers
  - method: POST
    path: "/plan/producers"
    description: "Register a producer authorised to submit plan applications."
    roles: [PlanAdministrator]
    code: 201
    input: [name, license_number, appointed_territories, "status?"]
    output: Producer
    side_effects: []

  - method: GET
    path: "/plan/producers/{id}"
    description: "Read one producer."
    roles: [PlanAdministrator, ComplianceExaminer, ProducerAgent]
    code: 200
    input: []
    output: Producer
    side_effects: []

  # -------------------------------------------------------- applicants + vehicles
  - method: POST
    path: "/plan/applicants"
    description: "Create an applicant (named insured)."
    roles: [PlanAdministrator, ProducerAgent]
    code: 201
    input: [full_name, driver_license_number, territory_code, driver_class, first_licensed_date]
    output: Applicant
    side_effects:
      - "last_chargeable_event_date initialised to first_licensed_date and clean_years_credited computed against the clock"

  - method: GET
    path: "/plan/applicants/{id}"
    description: "Read one applicant including clean-years credit."
    roles: [PlanAdministrator, ComplianceExaminer, ProducerAgent, ServicingCarrier]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/plan/applicants/{id}/vehicles"
    description: "Add a vehicle to an applicant."
    roles: [PlanAdministrator, ProducerAgent]
    code: 201
    input: [vin, vehicle_class_code, garaging_territory_code, model_year]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/plan/applicants/{id}/vehicles"
    description: "List the vehicles of one applicant."
    roles: [PlanAdministrator, ComplianceExaminer, ProducerAgent, ServicingCarrier]
    code: 200
    input: ["limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ------------------------------------------------------------- applications
  - method: POST
    path: "/plan/applications"
    description: "Submit an assigned-risk application for a vehicle."
    roles: [ProducerAgent, PlanAdministrator]
    code: 201
    input: [applicant_id, producer_id, vehicle_id, requested_effective_date, declared_violations]
    output: Application
    side_effects:
      - "status = SUBMITTED; intake_sequence assigned as the next monotonic integer"
      - "surcharge_points_estimated, estimated_annual_premium_cents, estimated_expense_charge_cents, estimated_total_charge_cents and required_deposit_cents computed from declared_violations at rating date == clock"

  - method: GET
    path: "/plan/applications"
    description: "List applications, filterable by applicant, producer, vehicle and status."
    roles: [PlanAdministrator, ComplianceExaminer, ProducerAgent, ServicingCarrier]
    code: 200
    input: ["applicant_id?", "producer_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/plan/applications/{id}"
    description: "Read one application including its premium estimate and deposit ledger."
    roles: [PlanAdministrator, ComplianceExaminer, ProducerAgent, ServicingCarrier]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/plan/applications/{id}/market-rejections"
    description: "File a documented voluntary-market declination against the application."
    roles: [ProducerAgent, PlanAdministrator]
    code: 201
    input: [rejecting_carrier_naic_code, rejection_date, reason_code, document_reference]
    output: MarketRejection
    side_effects:
      - "Application.distinct_rejection_count recomputed over the 90-day lookback"

  - method: GET
    path: "/plan/applications/{id}/market-rejections"
    description: "List the declinations filed against one application."
    roles: [PlanAdministrator, ComplianceExaminer, ProducerAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: MarketRejection[]
    side_effects: []

  - method: POST
    path: "/plan/applications/{id}/deposit"
    description: "Record a premium deposit payment against the application."
    roles: [ProducerAgent, PlanAdministrator]
    code: 200
    input: [amount_cents]
    output: Application
    side_effects:
      - "deposit_paid_total_cents += amount_cents and deposit_balance_cents += amount_cents"
      - "when a Policy already exists for this application, the new money sweeps into Policy.premium_credited_cents up to total_annual_charge_cents and premium_settlement_status is re-derived"

  - method: POST
    path: "/plan/applications/{id}/mvr-verification"
    description: "Record the motor-vehicle-record pull that verifies (or corrects) the declared driving record."
    roles: [ComplianceExaminer]
    code: 200
    input: [verified_violations]
    output: Application
    side_effects:
      - "verified_violations stored and mvr_verified_at = clock"
      - "surcharge_points_estimated and the premium estimate re-derived from the verified record"
      - "the applicant's last_chargeable_event_date and clean_years_credited recomputed"

  - method: POST
    path: "/plan/applications/{id}/certification"
    description: "Certify or reject the applicant's eligibility for the plan."
    roles: [ComplianceExaminer]
    code: 200
    input: [decision, "rejection_reason_code?"]
    output: Application
    side_effects:
      - "decision == CERTIFY: status = CERTIFIED_AWAITING_ASSIGNMENT, certified_at = clock, certified_by_user_id = X-User-ID, containing PlanPeriod.total_assignable_units += 1 and every ACTIVE carrier's quota_target_units recomputed"
      - "decision == REJECT: status = REJECTED with rejection_reason_code recorded"

  - method: POST
    path: "/plan/applications/{id}/cure-return"
    description: "Return a submitted application to the producer for cure of a documentation defect."
    roles: [ComplianceExaminer]
    code: 200
    input: [cure_note]
    output: Application
    side_effects:
      - "status = RETURNED_FOR_CURE"

  - method: POST
    path: "/plan/applications/{id}/resubmission"
    description: "Resubmit a cured application."
    roles: [ProducerAgent, PlanAdministrator]
    code: 200
    input: ["declared_violations?", "requested_effective_date?"]
    output: Application
    side_effects:
      - "status = SUBMITTED and cure_count += 1"
      - "verified_violations = null and mvr_verified_at = null — the MVR must be pulled again"
      - "the premium estimate, required_deposit_cents and distinct_rejection_count are re-derived at the current clock"

  # ------------------------------------------------- plan periods + cycles
  - method: POST
    path: "/plan/plan-periods"
    description: "Open a quota period."
    roles: [PlanAdministrator]
    code: 201
    input: [period_code, window_start, window_end, "underserved_territories?"]
    output: PlanPeriod
    side_effects:
      - "status = OPEN; total_assignable_units = 0"

  - method: GET
    path: "/plan/plan-periods/{id}"
    description: "Read one quota period including its frozen totals."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier]
    code: 200
    input: []
    output: PlanPeriod
    side_effects: []

  - method: POST
    path: "/plan/plan-periods/{id}/closure"
    description: "Close the intake side of a quota period and move it into reconciliation."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: PlanPeriod
    side_effects:
      - "status = RECONCILING; total_assignable_units and total_assignable_car_years frozen"
      - "every ACTIVE Carrier: breach_count_current_period = 0, non_renewal_count_current_period = 0, performance_score = min(100, performance_score + 10), posture recomputed"

  - method: POST
    path: "/plan/assignment-cycles"
    description: "Schedule an assignment cycle inside a quota period."
    roles: [PlanAdministrator]
    code: 201
    input: [plan_period_id, window_start, window_end]
    output: AssignmentCycle
    side_effects:
      - "status = SCHEDULED"

  - method: GET
    path: "/plan/plan-periods/{id}/assignment-cycles"
    description: "List the assignment cycles of one quota period."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssignmentCycle[]
    side_effects: []

  - method: GET
    path: "/plan/assignment-cycles/{id}"
    description: "Read one assignment cycle including its run counters."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier]
    code: 200
    input: []
    output: AssignmentCycle
    side_effects: []

  - method: POST
    path: "/plan/assignment-cycles/{id}/run"
    description: "Run the cycle: apportion every queued application to a servicing carrier in proportion to voluntary market share."
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: AssignmentCycle
    side_effects:
      - "status = COMPLETED and run_at = clock"
      - "for each queued application in (certified_at ASC, intake_sequence ASC) order the selector of §1.3 picks a carrier, creates a PENDING_ACCEPTANCE Assignment with batch_sequence 1..n, sets Application.status = ASSIGNED and increments assigned_count"
      - "each winning Carrier.assigned_risk_count += 1 with quota_variance_units, overallocated and posture recomputed before the next application is ranked"
      - "an application with an empty candidate pool becomes DEFERRED_NO_CARRIER and increments deferred_count"

  # ------------------------------------------------------------- assignments
  - method: GET
    path: "/plan/assignments"
    description: "List assignments, filterable by application, carrier, cycle, predecessor and status."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: ["application_id?", "carrier_id?", "assignment_cycle_id?", "predecessor_assignment_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/plan/assignments/{id}"
    description: "Read one assignment including the deficit that won it."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/plan/assignments/{id}/acceptance"
    description: "Servicing carrier accepts the designated risk."
    roles: [ServicingCarrier]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "accepted_at = clock; an INITIAL assignment becomes ACCEPTED"
      - "a REASSIGNMENT assignment becomes POLICY_ISSUED, the existing Policy's carrier_id is rewritten, policy_status returns to IN_FORCE, reassignment_required = false, the predecessor Assignment becomes REASSIGNED and the predecessor's Carrier.assigned_risk_count -= 1"
      - "when the predecessor's carrier is EXIT_NOTICED and holds no further live policies, that Carrier.status bubbles up to EXIT_COMPLETE"

  - method: POST
    path: "/plan/assignments/{id}/rescission"
    description: "Plan pulls an assignment back into the queue."
    roles: [PlanAdministrator]
    code: 200
    input: [reason_code]
    output: Assignment
    side_effects:
      - "status = RESCINDED with rescission_reason_code; Application.status = CERTIFIED_AWAITING_ASSIGNMENT"
      - "Carrier.assigned_risk_count -= 1 with quota_variance_units, overallocated and posture recomputed"
      - "reason_code == ISSUANCE_DEADLINE_MISSED additionally applies Carrier.performance_score -= 5"

  # ---------------------------------------------------------------- policies
  - method: POST
    path: "/plan/policies"
    description: "Servicing carrier issues the assigned-risk policy and finalises rating."
    roles: [ServicingCarrier]
    code: 201
    input: [assignment_id, policy_number, effective_date, expiration_date]
    output: Policy
    side_effects:
      - "carrier_id copied from the Assignment; Assignment.status = POLICY_ISSUED; Application.status = POLICY_ISSUED"
      - "surcharge_points_applied, surcharge_factor_applied, premium_lines, final_premium_cents, plan_expense_charge_cents and total_annual_charge_cents computed at rating date == effective_date"
      - "the applicant's deposit_balance_cents sweeps into premium_credited_cents up to total_annual_charge_cents; additional_premium_due_cents and premium_settlement_status derived from the result"
      - "exposure_car_years_current_period computed against the OPEN or RECONCILING PlanPeriod"

  - method: GET
    path: "/plan/policies"
    description: "List policies, filterable by carrier, assignment and coverage state."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: ["carrier_id?", "assignment_id?", "policy_status?", "premium_settlement_status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/plan/policies/{id}"
    description: "Read one policy including both state axes and the premium ledger."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/plan/policies/{id}/reclassification"
    description: "Re-rate an in-force policy after a driver reclassification, superseding the prior rating revision."
    roles: [PlanAdministrator]
    code: 200
    input: [expected_policy_version, reclassified_driver_class, reclassification_effective_date]
    output: Policy
    side_effects:
      - "increments `Policy.version` by 1"
      - "rating_revision += 1; surcharge_points_applied, surcharge_factor_applied, premium_lines, final_premium_cents, plan_expense_charge_cents and total_annual_charge_cents recomputed with the new driver class"
      - "when total_annual_charge_cents < premium_credited_cents the excess moves into refund_paid_cents and premium_credited_cents drops to the new total; otherwise additional_premium_due_cents is restated"
      - "premium_settlement_status re-derived on the money axis; policy_status untouched"
      - "the Applicant's driver_class is updated to reclassified_driver_class"

  - method: POST
    path: "/plan/policies/{id}/cancellation"
    description: "Cancel an in-force assigned-risk policy and settle unearned premium. The initiating party is taken from the caller's role: ServicingCarrier → CARRIER, PlanAdministrator → PLAN, ProducerAgent → INSURED."
    roles: [ServicingCarrier, PlanAdministrator, ProducerAgent]
    code: 200
    input: [cancellation_reason_code, cancellation_effective_date]
    output: Policy
    side_effects:
      - "policy_status = CANCELLED; cancellation_initiated_by derived from the caller's role; refund_basis = PRO_RATA for CARRIER/PLAN and SHORT_RATE for INSURED"
      - "earned_premium_cents, refund_paid_cents, balance_due_cents and premium_settlement_status settled per §1.3 earned_premium_at_cancellation"
      - "Assignment.status = CLOSED; Application.status = CLOSED_CANCELLED"
      - "Carrier.assigned_risk_count -= 1 with quota_variance_units, overallocated and posture recomputed"

  - method: POST
    path: "/plan/policies/{id}/non-renewal-notice"
    description: "Servicing carrier serves notice that the policy will not be renewed at expiration."
    roles: [ServicingCarrier]
    code: 200
    input: [reason_note]
    output: Policy
    side_effects:
      - "policy_status = NON_RENEWAL_PENDING; non_renewal_notice_count = 1; non_renewal_effective_date = expiration_date"
      - "Carrier.non_renewal_count_current_period += 1"

  - method: POST
    path: "/plan/policies/{id}/voluntary-exit"
    description: "Move a rehabilitated risk out of the plan into the carrier's voluntary book."
    roles: [PlanAdministrator]
    code: 200
    input: ["exit_note?"]
    output: Policy
    side_effects:
      - "policy_status = EXITED_TO_VOLUNTARY; Applicant.voluntary_market_eligible = true"
      - "Assignment.status = CLOSED; Application.status = CLOSED_EXITED"
      - "Carrier.assigned_risk_count -= 1 and Carrier.voluntary_credit_units += 1.5 for an underserved garaging territory, else += 1.0"
      - "quota_variance_units, overallocated and posture recomputed"

  # ------------------------------------------------------------------ claims
  - method: POST
    path: "/plan/claims"
    description: "Servicing carrier reports a loss under an assigned-risk policy."
    roles: [ServicingCarrier]
    code: 201
    input: [policy_id, loss_date, at_fault, coverage_line, reserve_cents]
    output: Claim
    side_effects:
      - "status = OPEN, reported_at = clock, acknowledgement_deadline = reported_at + 10 days"
      - "Policy.complaint_freeze_active is unaffected; the policy's voluntary exit is now blocked while the claim is live"

  - method: GET
    path: "/plan/policies/{id}/claims"
    description: "List the claims reported under one policy."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/plan/claims/{id}"
    description: "Read one claim including its handling-standard breach flag."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier, ProducerAgent]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/plan/claims/{id}/acknowledgement"
    description: "Servicing carrier acknowledges the claim against the plan's handling standard."
    roles: [ServicingCarrier]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "status = ACKNOWLEDGED and acknowledged_at = clock"
      - "acknowledged_at > acknowledgement_deadline sets standard_breach = true, Carrier.breach_count_current_period += 1, Carrier.performance_score -= 5 and recomputes posture"

  - method: POST
    path: "/plan/claims/{id}/closure"
    description: "Close the claim as paid or denied."
    roles: [ServicingCarrier]
    code: 200
    input: [disposition, "paid_cents?", "denial_reason?"]
    output: Claim
    side_effects:
      - "status = CLOSED_PAID with paid_cents recorded, or CLOSED_DENIED with paid_cents = 0"
      - "an at-fault closure recomputes the Applicant's last_chargeable_event_date and clean_years_credited"

  # -------------------------------------------------------------- complaints
  - method: POST
    path: "/plan/complaints"
    description: "Docket a complaint against the servicing carrier of a policy."
    roles: [PlanAdministrator, ComplianceExaminer]
    code: 201
    input: [policy_id, carrier_id, complaint_type, narrative]
    output: Complaint
    side_effects:
      - "status = OPEN, review_round = 1"
      - "Policy.open_complaint_count += 1 and complaint_freeze_active = true — cancellation and non-renewal are frozen"

  - method: GET
    path: "/plan/complaints"
    description: "List complaints, filterable by policy, carrier and status."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier]
    code: 200
    input: ["policy_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: GET
    path: "/plan/complaints/{id}"
    description: "Read one complaint including its findings trail."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/plan/complaints/{id}/findings"
    description: "Examiner records investigation findings."
    roles: [ComplianceExaminer]
    code: 200
    input: [findings_note]
    output: Complaint
    side_effects:
      - "status = FINDINGS_RECORDED; findings_recorded_by_user_id = X-User-ID"

  - method: POST
    path: "/plan/complaints/{id}/resolution"
    description: "A second examiner resolves the complaint or returns it for a further review round."
    roles: [ComplianceExaminer]
    code: 200
    input: [disposition, "resolution_note?"]
    output: Complaint
    side_effects:
      - "UPHELD: status = RESOLVED_UPHELD, Carrier.upheld_complaint_count += 1, Carrier.performance_score -= 20, posture recomputed; a resulting SUSPENDED posture rescinds every PENDING_ACCEPTANCE Assignment of that carrier with reason CARRIER_INELIGIBLE and returns each Application to CERTIFIED_AWAITING_ASSIGNMENT"
      - "NOT_UPHELD: status = RESOLVED_NOT_UPHELD with no score change"
      - "either resolution decrements Policy.open_complaint_count and re-derives complaint_freeze_active"
      - "RETURNED_FOR_FURTHER_REVIEW: status = OPEN, review_round += 1, findings cleared, the freeze stays on"

  # --------------------------------------------------- quota reconciliation
  - method: POST
    path: "/plan/quota-reconciliations"
    description: "File a carrier's quota reconciliation for a period on one of the two plan-approved bases; a later filing supersedes the prior FINAL row."
    roles: [PlanAdministrator]
    code: 201
    input: [carrier_id, plan_period_id, basis, expected_carrier_version]
    output: QuotaReconciliation
    side_effects:
      - "increments `Carrier.version` by 1"
      - "obligation_units, credited_units, variance_units, voluntary_credit_units_applied and penalty_cents computed per §1.3 quota_reconciliation_variance"
      - "any prior FINAL row for the same carrier and period becomes SUPERSEDED and Carrier.penalty_balance_cents is recomputed from FINAL rows only"
      - "when every ACTIVE carrier now holds a FINAL row for the period, PlanPeriod.status bubbles up to CLOSED"

  - method: GET
    path: "/plan/quota-reconciliations"
    description: "List reconciliations, filterable by carrier and period."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier]
    code: 200
    input: ["carrier_id?", "plan_period_id?", "basis?", "status?", "limit?", "offset?"]
    output: QuotaReconciliation[]
    side_effects: []

  - method: GET
    path: "/plan/quota-reconciliations/{id}"
    description: "Read one reconciliation."
    roles: [PlanAdministrator, ComplianceExaminer, ServicingCarrier]
    code: 200
    input: []
    output: QuotaReconciliation
    side_effects: []

  # ------------------------------------------------------------ test-driving
  - method: POST
    path: "/plan/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and ageing rule reads. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlanAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock advances; clean_years_credited, distinct_rejection_count, acceptance-window and non-renewal-notice checks all re-evaluate against the new value"
      - "no entity row is mutated by this call"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-API-Key or X-Role header missing, or X-Role is not one of the four declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_CARRIER_SCOPE_FORBIDDEN
    http: 403
    condition: "a ServicingCarrier acts on an Assignment, Policy or Claim belonging to a different carrier"
  - id: ERR_PRODUCER_SCOPE_FORBIDDEN
    http: 403
    condition: "a ProducerAgent acts on an Application or Policy whose producer of record is a different producer"
  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, unknown enum value, malformed timestamp, negative amount, limit outside 1..100 or negative offset"
  # --- existence ----------------------------------------------------------
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier id in the path or body does not resolve"
  - id: ERR_PRODUCER_NOT_FOUND
    http: 404
    condition: "producer id does not resolve"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "applicant id does not resolve"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "vehicle id does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application id does not resolve"
  - id: ERR_PLAN_PERIOD_NOT_FOUND
    http: 404
    condition: "plan period id does not resolve"
  - id: ERR_ASSIGNMENT_CYCLE_NOT_FOUND
    http: 404
    condition: "assignment cycle id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment id does not resolve"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy id does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim id does not resolve"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint id does not resolve"
  - id: ERR_QUOTA_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "quota reconciliation id does not resolve"
  # --- state --------------------------------------------------------------
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the requested transition does not exist from the application's current status"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "the requested transition does not exist from the assignment's current status"
  - id: ERR_INVALID_POLICY_STATE
    http: 409
    condition: "the requested transition does not exist from the policy's current policy_status"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the requested transition does not exist from the claim's current status"
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "the requested transition does not exist from the complaint's current status"
  - id: ERR_INVALID_CYCLE_STATE
    http: 409
    condition: "the assignment cycle is already COMPLETED"
  - id: ERR_INVALID_PERIOD_STATE
    http: 409
    condition: "the plan period is not in the status the operation requires"
  - id: ERR_CARRIER_NOT_ACTIVE
    http: 409
    condition: "the designated carrier's status is not ACTIVE"
  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_CARRIER_VERSION
    http: 412
    condition: "expected_carrier_version does not match Carrier.version"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not match Policy.version"
  # --- business safety ---------------------------------------------------
  - id: ERR_MVR_NOT_VERIFIED
    http: 422
    condition: "certification attempted before the motor-vehicle record was verified"
  - id: ERR_INSUFFICIENT_MARKET_REJECTIONS
    http: 422
    condition: "fewer than two distinct voluntary-market declinations inside the 90-day lookback"
  - id: ERR_CARRIER_SUSPENDED
    http: 409
    condition: "the designated carrier's posture is SUSPENDED"
  - id: ERR_ACCEPTANCE_WINDOW_EXPIRED
    http: 409
    condition: "acceptance attempted after Assignment.acceptance_deadline"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the examiner resolving a complaint is the examiner who recorded its findings"
  # --- business referential ----------------------------------------------
  - id: ERR_COMPLAINT_FREEZE_ACTIVE
    http: 409
    condition: "adverse action attempted while the policy has an unresolved complaint"
  - id: ERR_OPEN_CLAIM_BLOCKS_EXIT
    http: 409
    condition: "voluntary exit attempted while a claim is OPEN or ACKNOWLEDGED"
  - id: ERR_VEHICLE_APPLICANT_MISMATCH
    http: 422
    condition: "the vehicle does not belong to the application's applicant"
  - id: ERR_REJECTING_CARRIER_UNKNOWN
    http: 422
    condition: "rejecting_carrier_naic_code matches no enrolled carrier"
  - id: ERR_DUPLICATE_REJECTING_CARRIER
    http: 409
    condition: "a declination from the same NAIC code is already on file inside the lookback window"
  - id: ERR_COMPLAINT_CARRIER_MISMATCH
    http: 422
    condition: "the complaint's carrier_id is not the policy's current servicing carrier"
  - id: ERR_PRODUCER_SUSPENDED
    http: 409
    condition: "the producer of record is SUSPENDED"
  - id: ERR_PRODUCER_TERRITORY_NOT_APPOINTED
    http: 422
    condition: "the applicant's territory is outside the producer's appointed territories"
  # --- business temporal --------------------------------------------------
  - id: ERR_CANCEL_REASON_NOT_PERMITTED
    http: 422
    condition: "a first-60-day-only cancellation reason used more than 60 days into the term"
  - id: ERR_CANCEL_DATE_OUT_OF_TERM
    http: 422
    condition: "cancellation_effective_date outside the policy term or before the clock"
  - id: ERR_POLICY_TERM_OVERLAP
    http: 409
    condition: "the requested term intersects another policy term on the same vehicle"
  - id: ERR_CYCLE_WINDOW_CONFLICT
    http: 409
    condition: "the assignment cycle window overlaps or merely abuts a sibling cycle window"
  - id: ERR_CYCLE_WINDOW_OUTSIDE_PERIOD
    http: 422
    condition: "the assignment cycle window is not contained in its plan period window"
  - id: ERR_PERIOD_WINDOW_CONFLICT
    http: 409
    condition: "the plan period window intersects an existing plan period window"
  - id: ERR_POLICY_TERM_INVALID
    http: 422
    condition: "expiration_date is not effective_date + 365 days, or effective_date is before the clock"
  - id: ERR_NON_RENEWAL_NOTICE_TOO_LATE
    http: 422
    condition: "non-renewal notice served fewer than 45 days before expiration"
  - id: ERR_EXIT_NOTICE_TOO_SHORT
    http: 422
    condition: "exit_effective_date is fewer than 90 days after the clock"
  - id: ERR_LOSS_DATE_OUTSIDE_TERM
    http: 422
    condition: "loss_date is before the policy effective date or after the clock"
  - id: ERR_WINDOW_NOT_REACHED
    http: 409
    condition: "a cycle run before its window_start, or a period closure before its window_end"
  # --- business constraint ------------------------------------------------
  - id: ERR_CURE_LIMIT_EXCEEDED
    http: 409
    condition: "a third cure return attempted on the same application"
  - id: ERR_REVIEW_ROUND_LIMIT
    http: 409
    condition: "a further review round requested on a complaint already at review_round 3"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "naic_code, license_number, driver_license_number, vin, period_code or policy_number already exists"
  - id: ERR_NON_RENEWAL_QUOTA_EXCEEDED
    http: 409
    condition: "the carrier already served three non-renewals this period"
  - id: ERR_CARRIER_NOT_LICENSED_IN_TERRITORY
    http: 422
    condition: "the issuing carrier is not licensed in the vehicle's garaging territory"
  - id: ERR_CLEAN_YEARS_INSUFFICIENT
    http: 422
    condition: "voluntary exit attempted with fewer than three clean years credited"
  - id: ERR_PAYMENT_EXCEEDS_RESERVE
    http: 422
    condition: "paid_cents exceeds the claim reserve on a PAID closure"
  - id: ERR_PERIOD_NOT_RECONCILING
    http: 409
    condition: "a reconciliation filed against a period that is not RECONCILING"
  - id: ERR_CYCLE_STILL_SCHEDULED
    http: 409
    condition: "period closure attempted while an assignment cycle is still SCHEDULED"
  # --- business fiscal ----------------------------------------------------
  - id: ERR_DEPOSIT_BELOW_REQUIRED
    http: 422
    condition: "certification attempted with deposit_paid_total_cents below required_deposit_cents"
  - id: ERR_DEPOSIT_AMOUNT_INVALID
    http: 422
    condition: "deposit amount_cents below 1"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdministrator
    description: "The plan's central administrator: enrols carriers and producers, opens periods, runs assignment cycles, rescinds assignments, orders reclassifications and voluntary exits, and files quota reconciliations."
    identity: "opaque"
    exclusive_operations:
      - "POST /plan/carriers"
      - "POST /plan/carriers/{id}/exit-notice"
      - "POST /plan/carriers/{id}/licensing-amendment"
      - "POST /plan/producers"
      - "POST /plan/plan-periods"
      - "POST /plan/plan-periods/{id}/closure"
      - "POST /plan/assignment-cycles"
      - "POST /plan/assignment-cycles/{id}/run"
      - "POST /plan/assignments/{id}/rescission"
      - "POST /plan/policies/{id}/reclassification"
      - "POST /plan/policies/{id}/voluntary-exit"
      - "POST /plan/quota-reconciliations"
      - "POST /plan/_clock/set_current_utc"
    shared_operations:
      - "POST /plan/applicants"
      - "POST /plan/applicants/{id}/vehicles"
      - "POST /plan/applications"
      - "POST /plan/applications/{id}/market-rejections"
      - "POST /plan/applications/{id}/deposit"
      - "POST /plan/applications/{id}/resubmission"
      - "POST /plan/policies/{id}/cancellation"
      - "POST /plan/complaints"
      - "every GET endpoint"

  - name: ComplianceExaminer
    description: "State insurance-department examiner: verifies motor-vehicle records, certifies or rejects eligibility, returns applications for cure, and runs the two-examiner complaint process."
    identity: "opaque"
    exclusive_operations:
      - "POST /plan/applications/{id}/mvr-verification"
      - "POST /plan/applications/{id}/certification"
      - "POST /plan/applications/{id}/cure-return"
      - "POST /plan/complaints/{id}/findings"
      - "POST /plan/complaints/{id}/resolution"
    shared_operations:
      - "POST /plan/complaints"
      - "every GET endpoint"
    note: "Segregation of duties: X-User-ID is recorded on findings and compared on resolution, so one examiner cannot both investigate and dispose of the same complaint."

  - name: ServicingCarrier
    description: "A carrier designated to service assigned risks: accepts assignments, issues policies, serves non-renewal notices, and handles claims."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /plan/assignments/{id}/acceptance"
      - "POST /plan/policies"
      - "POST /plan/policies/{id}/non-renewal-notice"
      - "POST /plan/claims"
      - "POST /plan/claims/{id}/acknowledgement"
      - "POST /plan/claims/{id}/closure"
    shared_operations:
      - "POST /plan/policies/{id}/cancellation"
      - "every GET endpoint except GET /plan/producers/{id}"
    note: "X-User-ID equals the Carrier.id the caller acts as; every write is scoped to that carrier's own assignments, policies and claims."

  - name: ProducerAgent
    description: "The producer of record: submits applications, files voluntary-market declinations, records deposits, resubmits cured applications, and cancels at the insured's request."
    identity: "entity_backed:Producer"
    exclusive_operations: []
    shared_operations:
      - "POST /plan/applications/{id}/resubmission"
      - "POST /plan/applicants"
      - "POST /plan/applicants/{id}/vehicles"
      - "POST /plan/applications"
      - "POST /plan/applications/{id}/market-rejections"
      - "POST /plan/applications/{id}/deposit"
      - "POST /plan/policies/{id}/cancellation"
      - "every GET endpoint except GET /plan/quota-reconciliations"
    note: "X-User-ID equals the Producer.id the caller acts as. A cancellation filed by this role is an insured-initiated cancellation and is settled on the SHORT_RATE variant."
