  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_requires_program_open
        grounds:
          - state_machines.Application.CLEARED_to_APPROVED
          - state_machines.Program.OPEN_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Application -> Program dependency: a CLEARED application cannot be
          approved once its Program has left OPEN. The DO_NOT_TRAVEL advisory
          window fully contains the program dates, so the program is
          SUSPENDED, but the cascade withdraws only APPROVED/COMMITTED
          applications — the CLEARED application survives and the approve
          attempt then fails purely on the cross-entity program-state gate.
        test_recipe:
          setup:
            - "FR program OPEN; one application CLEARED (clearance by coord-a, so coord-b would be a valid approver)"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Gate Student", email: "gate@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/travel-advisories"
              payload: { country_code: "FR", level: "DO_NOT_TRAVEL", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: SafetyOfficer
          trigger:
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
              captures: { err: $.data.error_id }
            - call: "GET /api/v1/programs/${prog_id}"
              as: ProgramCoordinator
              captures: { prog_status: $.data.status }
            - call: "GET /api/v1/applications/${app_id}"
              as: ProgramCoordinator
              captures: { app_status: $.data.status }
          assert:
            - "error_id == ERR_INVALID_STATE (Program.status != OPEN blocks CLEARED -> APPROVED)"
            - "Program.${prog_id}.status == SUSPENDED (advisory cascade ran)"
            - "Application.${app_id}.status == CLEARED (cascade withdraws only APPROVED/COMMITTED, and the failed approve changed nothing)"
      - name: depart_requires_covering_insurance
        grounds:
          - state_machines.Application.COMMITTED_to_ABROAD
          - errors[ERR_INSURANCE_COVERAGE_MISSING]
        distinguishing_aspect: |
          Application -> InsuranceEnrollment dependency (a different entity
          pair than Application -> Program): DEPART is rejected with
          ERR_INSURANCE_COVERAGE_MISSING when no ACTIVE enrollment covering
          the program dates exists for the application.
        test_recipe:
          setup:
            - "FR program OPEN; one application COMMITTED; NO insurance enrollment created"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Uninsured Student", email: "uninsured@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app_id}/commit"
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/lifecycle"
              payload: { action: "DEPART" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSURANCE_COVERAGE_MISSING (http 422)"
            - "Application.${app_id}.status remains COMMITTED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: advisory_half_open_overlap
        grounds:
          - validations[priority=8]
          - entities.TravelAdvisory.fields.effective_to
          - errors[ERR_ADVISORY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the TravelAdvisory resource:
          [2027-01-01, 2027-03-01) and [2027-03-01, 2027-05-01) touch but do
          NOT overlap (one's effective_to == the other's effective_from), so
          both are accepted; [2027-02-01, 2027-04-01) properly intersects and
          is rejected with ERR_ADVISORY_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "one ACTIVE CAUTION advisory for FR over [2027-01-01, 2027-03-01)"
          setup_api_calls:
            - call: "POST /api/v1/travel-advisories"
              payload: { country_code: "FR", level: "CAUTION", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z" }
              as: SafetyOfficer
              captures: { adv_a: $.data.id }
          trigger:
            - call: "POST /api/v1/travel-advisories"
              payload: { country_code: "FR", level: "WARNING", effective_from: "2027-03-01T00:00:00Z", effective_to: "2027-05-01T00:00:00Z" }
              as: SafetyOfficer
              captures: { adv_b: $.data.id, adv_b_status: $.data.status }
            - call: "POST /api/v1/travel-advisories"
              payload: { country_code: "FR", level: "CAUTION", effective_from: "2027-02-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "adjacent window [2027-03-01, 2027-05-01) is ACCEPTED (201, status ACTIVE) — half-open semantics treat touching endpoints as non-overlapping"
            - "intersecting window [2027-02-01, 2027-04-01) is rejected with ERR_ADVISORY_WINDOW_OVERLAP (409)"
      - name: program_host_schedule_buffer
        grounds:
          - validations[priority=8]
          - entities.Program.fields.host_institution
          - errors[ERR_PROGRAM_SCHEDULE_BUFFER]
        distinguishing_aspect: |
          Minimum-gap buffer semantics on a DIFFERENT resource (Program at a
          host_institution), not interval intersection: two programs at the
          same host must be separated by >= 7 days; exactly 7 days
          (2027-05-10 end -> 2027-05-17 start) is allowed, while 6 days
          (-> 2027-05-16 start) is rejected with ERR_PROGRAM_SCHEDULE_BUFFER.
        test_recipe:
          setup:
            - "ACTIVE FR agreement; one DRAFT program at Universite Lyon running 2027-01-10..2027-05-10"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog1: $.data.id }
          trigger:
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Summer 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SUMMER", start_date: "2027-05-17T00:00:00Z", end_date: "2027-08-15T00:00:00Z", application_deadline: "2027-02-01T00:00:00Z", capacity: 20, billing_model: "PROGRAM_FEE", program_fee_cents: 900000, min_gpa: 2.50 }
              as: ProgramCoordinator
              captures: { prog2: $.data.id, prog2_status: $.data.status }
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Tight Summer 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SUMMER", start_date: "2027-05-16T00:00:00Z", end_date: "2027-08-10T00:00:00Z", application_deadline: "2027-02-01T00:00:00Z", capacity: 20, billing_model: "PROGRAM_FEE", program_fee_cents: 900000, min_gpa: 2.50 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "7-day gap (end 2027-05-10 -> start 2027-05-17) is ACCEPTED (201, DRAFT) — buffer is >= 7 days"
            - "6-day gap (start 2027-05-16) is rejected with ERR_PROGRAM_SCHEDULE_BUFFER (409)"

  - rule_id: compensating_invariant
    instances:
      - name: seat_count_commit_withdraw_invariant
        grounds:
          - calculations.seats_taken_aggregation
          - state_machines.Application.APPROVED_to_COMMITTED
          - state_machines.Application.COMMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = seat count: commit followed by its compensating
          withdraw leaves Program.seats_taken unchanged (0 -> 1 -> 0), and the
          field always equals count(status IN {COMMITTED, ABROAD}).
        test_recipe:
          setup:
            - "FR program OPEN, capacity 30; one application APPROVED"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Seat Student", email: "seat@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/commit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /api/v1/programs/${prog_id}"
              as: ProgramCoordinator
              captures: { seats_mid: $.data.seats_taken }
            - call: "POST /api/v1/applications/${app_id}/withdraw"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /api/v1/programs/${prog_id}"
              as: ProgramCoordinator
              captures: { seats_end: $.data.seats_taken }
          assert:
            - "after commit: seats_taken == 1"
            - "after compensating withdraw: seats_taken == 0 — the forward+compensating pair leaves the conserved seat count unchanged"
            - "Application.${app_id}.status == WITHDRAWN with withdraw_reason == STUDENT_INITIATED"
      - name: billing_outstanding_pay_void_invariant
        grounds:
          - calculations.refund_credit_memo
          - calculations.billing_charge_calculation
          - state_machines.BillingStatement.PARTIALLY_PAID_to_VOID
        distinguishing_aspect: |
          Conserved quantity = money outstanding (different from the seat
          count instance): for the program's statements, sum(outstanding)
          goes 0 -> 940000 at commit -> 840000 after a 100000 payment -> 0
          after the compensating withdraw/void, with credit_memo_cents ==
          amount_paid_cents == 100000; the cycle leaves no drift.
        test_recipe:
          setup:
            - "FR program OPEN; one application APPROVED (student aid snapshot 900000)"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Money Student", email: "money@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 900000 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/commit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /api/v1/billing-statements"
              payload: { application_id: "${app_id}" }
              as: BursarOffice
              captures: { stmt_id: "$.data[0].id", out_new: "$.data[0].outstanding_cents" }
            - call: "POST /api/v1/billing-statements/${stmt_id}/payments"
              payload: { amount_cents: 100000 }
              as: BursarOffice
              captures: { st_mid: $.data.status, out_mid: $.data.outstanding_cents }
            - call: "POST /api/v1/applications/${app_id}/withdraw"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /api/v1/billing-statements"
              payload: { application_id: "${app_id}" }
              as: BursarOffice
              captures: { st_end: "$.data[0].status", credit_end: "$.data[0].credit_memo_cents", out_end: "$.data[0].outstanding_cents" }
          assert:
            - "at commit: outstanding_cents == 940000 (charge 1800000 + 35000 + 5000 - 900000)"
            - "after paying 100000: status == PARTIALLY_PAID and outstanding_cents == 840000"
            - "after compensating withdraw: status == VOID, credit_memo_cents == 100000 (== amount_paid_cents), outstanding_cents == 0 == pre-commit value"
