          assert:
            - "${err_odo1} == \"ERR_ODOMETER_REGRESSION\""
            - "Reservation.${res_cr1_id}.status == IN_USE"

      - name: error_loss_exceeds_repair_cost_on_incident_open
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOSS_EXCEEDS_REPAIR_COST]
          - validations[priority=22]
          - endpoints.POST /car-share/incidents
        distinguishing_aspect: "Opening an incident whose declared loss estimate exceeds its repair_cost_cents is refused with ERR_LOSS_EXCEEDS_REPAIR_COST when both figures are supplied at creation."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership and one CONFIRMED reservation"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Loss Excess", email: "loss.excess@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_loss_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 4 }
              as: Member
              as_user_id: "${m_loss_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Loss Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_lss_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_lss_id}", vin: "VIN3160S1", model: "Punch", capacity_seats: 5, next_service_miles: 47000 }
              as: FleetAdmin
              captures: { veh_cs1_id: $.data.id, veh_cs1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_loss_id}", pod_id: "${pod_lss_id}", vehicle_id: "${veh_cs1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cs1_ver}" }
              as: Member
              as_user_id: "${m_loss_id}"
              captures: { res_cs1_id: $.data.id }
          trigger:
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_cs1_id}", vehicle_id: "${veh_cs1_id}", member_id: "${m_loss_id}", incident_type: "DAMAGE", repair_cost_cents: 5000, loss_estimate_cents: 9000 }
              as: PodOperator
              captures: { err_loss1: $.data.error_id }
          assert:
            - "${err_loss1} == \"ERR_LOSS_EXCEEDS_REPAIR_COST\""
            - "GET /car-share/incidents?reservation_id=${res_cs1_id} returns 0 rows"

      - name: error_duplicate_vin_on_vehicle_creation
        claim_type: error_triggerable
        grounds:
          - validations[priority=15]
          - entities.Vehicle.fields.vin
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A second Vehicle row with a vin already present is refused with ERR_INVALID_REQUEST and the pre-existing vehicle remains the only row reachable through the pod-scoped vehicle list."
        test_recipe:
          setup: ["One pod holding one vehicle with vin VIN3160T1"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Vin Lot", site_type: "CAMPUS", capacity: 4, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_vin_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_vin_id}", vin: "VIN3160T1", model: "Kiger", capacity_seats: 5, next_service_miles: 48000 }
              as: FleetAdmin
              captures: { veh_ct1_id: $.data.id }
          trigger:
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_vin_id}", vin: "VIN3160T1", model: "Kiger", capacity_seats: 5 }
              as: FleetAdmin
              captures: { err_vin1: $.data.error_id }
          assert:
            - "${err_vin1} == \"ERR_INVALID_REQUEST\""
            - "${err_vin1} != \"ERR_POD_CAPACITY_EXCEEDED\""

  # ===========================================================================
  # section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: pod_creation_denied_to_pod_operator
        claim_type: rbac_denial
        grounds:
          - roles.FleetAdmin
          - roles.PodOperator
          - errors[ERR_FORBIDDEN]
          - endpoints.POST /car-share/pods
        distinguishing_aspect: "Pod creation is a FleetAdmin exclusive operation, so a PodOperator caller is refused with ERR_FORBIDDEN and no pod is created."
        test_recipe:
          setup: ["Empty database with the logical clock at its 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /car-share/pods"
              payload: { name: "Owned Pod", site_type: "NEIGHBORHOOD", capacity: 1, fuel_floor_pct: 25 }
              as: FleetAdmin
              captures: { pod_own_id: $.data.id }
          trigger:
            - call: "POST /car-share/pods"
              payload: { name: "Illegal Pod", site_type: "NEIGHBORHOOD", capacity: 1, fuel_floor_pct: 25 }
              as: PodOperator
              captures: { err_rbac1: $.data.error_id }
          assert:
            - "${err_rbac1} == \"ERR_FORBIDDEN\""
            - "GET /car-share/pods returns exactly 1 row"

      - name: membership_creation_denied_to_pod_operator
        claim_type: rbac_denial
        grounds:
          - roles.UniversityAccountAdmin
          - roles.PodOperator
          - errors[ERR_FORBIDDEN]
          - endpoints.POST /car-share/memberships
        distinguishing_aspect: "Membership creation is a UniversityAccountAdmin exclusive operation, so a PodOperator caller is refused with ERR_FORBIDDEN."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Rb Member", email: "rb.member@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_rb_id: $.data.id }
