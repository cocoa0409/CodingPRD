              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { e1: $.data.error_id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T16:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
