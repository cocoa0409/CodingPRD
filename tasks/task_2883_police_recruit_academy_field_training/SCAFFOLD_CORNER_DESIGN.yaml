            - call: "GET /recruits"
              payload: { limit: 100 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          assert:
            - "limit 0: HTTP 400, data.error_id == 'ERR_INVALID_PAGINATION' - not clamped to the default of 10"
            - "limit 101: HTTP 400, data.error_id == 'ERR_INVALID_PAGINATION' - not clamped to 100"
            - "offset -1: HTTP 400, data.error_id == 'ERR_INVALID_PAGINATION'"
            - "the same limit 101 on a different list endpoint: HTTP 400 with the same code - the rule is global, not per endpoint"
            - "limit 1 offset 0: HTTP 200 with data holding 1 entry, total_count == 1, has_more == false"
            - "limit 100: HTTP 200 - the upper bound is inclusive"

      - name: violation_to_error_clock_must_not_run_backwards_but_may_stand_still
        claim_type: violation_to_error
        grounds:
          - validations[priority 23]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The guard is 'not EARLIER than', so re-setting the clock to the SAME instant is legal while any earlier instant is a 400 - and a rejected call must leave the clock exactly where it was."
        test_recipe:
          setup:
            - "The logical clock has been advanced to 2026-08-10T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T11:59:59Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { e2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:01Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
          assert:
            - "five days earlier: HTTP 400, data.error_id == 'ERR_CLOCK_NOT_MONOTONIC'"
            - "one second earlier: HTTP 400, data.error_id == 'ERR_CLOCK_NOT_MONOTONIC'"
            - "the same instant: HTTP 200 with data.current_utc == '2026-08-10T12:00:00Z' - equality is not 'earlier'"
            - "one second later: HTTP 200 with data.current_utc == '2026-08-10T12:00:01Z'"
            - "neither rejected call moved the clock: the accepted equal-instant call proves it was still at 2026-08-10T12:00:00Z"

