          trigger:
            - call: "POST /api/product-sales-contracts/${k_sale_meal_id}/deliver"
              payload: { delivery_date: "2026-09-12T00:00:00Z", quantity_lbs: 500, actual_protein_pct: 45.5 }
              as: ProductMerchandiser
              captures: { k_err14: $.data.error_id }
          assert:
            - "response 422 with error_id ERR_QUALITY_SPEC_FAILED (45.5 < 46.0)"
            - "ProductSalesContract.${k_sale_meal_id}.delivered_lbs == 0 and deliveries == [] and status == OPEN"

      - name: biodiesel_feedstock_quota_enforced
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", errors.ERR_FEEDSTOCK_QUOTA_EXCEEDED, entities.CrushPlant.fields.biodiesel_feedstock_share_pct]
        distinguishing_aspect: "Aggregate quota: plant refinery 1000000 lbs/day x 10% share x 30 days = 3000000 lbs of non-terminal biodiesel feedstock; a 2000000-lb contract books, a further 1000001-lb contract fails 422 ERR_FEEDSTOCK_QUOTA_EXCEEDED (3000001 > 3000000)."
        test_recipe:
          setup: ["Plant refinery 1000000, share 10; buyer. Contract A: 2000000 lbs BIODIESEL_FEEDSTOCK."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_buyer
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${k_buyer_id}", plant_id: "${k_plant_id}", product: "BIODIESEL_FEEDSTOCK", quantity_lbs: 2000000, price_cents_per_lb: 60, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z", max_ffa_pct: 1.0 }
              as: ProductMerchandiser
              captures: { k_feed_a: $.data.id }
          trigger:
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${k_buyer_id}", plant_id: "${k_plant_id}", product: "BIODIESEL_FEEDSTOCK", quantity_lbs: 1000001, price_cents_per_lb: 60, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z", max_ffa_pct: 1.0 }
              as: ProductMerchandiser
              captures: { k_err15: $.data.error_id }
          assert:
            - "contract A (${k_feed_a}) created 201 (2000000 <= 3000000)"
            - "contract B fails 422 ERR_FEEDSTOCK_QUOTA_EXCEEDED (2000000 + 1000001 > 3000000)"

      - name: election_without_futures_quote_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", errors.ERR_NO_MARKET_QUOTE]
        distinguishing_aspect: "A DEFERRED election for futures month 2027-05 with no BEAN quote on file fails 422 ERR_NO_MARKET_QUOTE; the contract stays UNPRICED."
        test_recipe:
          setup: ["DEFERRED contract 100 bu, futures_month 2027-05; no quotes posted for that month."]
