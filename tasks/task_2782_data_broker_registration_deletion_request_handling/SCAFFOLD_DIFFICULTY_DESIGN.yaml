              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { ca_reg_id: $.data.id }
            - call: "POST /registrations/${ca_reg_id}/disclosures"
