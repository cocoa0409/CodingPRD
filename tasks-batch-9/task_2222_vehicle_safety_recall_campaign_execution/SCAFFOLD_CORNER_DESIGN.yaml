      - name: wave_release_ratios_are_rounded_to_four_decimal_places
        claim_type: precision
        grounds:
          - calculations.wave_release_quota
          - entities.NotificationWave.fields.provisional_coverage_ratio
          - entities.NotificationWave.fields.parts_coverage_ratio
        distinguishing_aspect: |
          One unit against three eligible owners is 0.333333..., which must be stored as 0.3333 at
          four decimals (not 0.33 and not 0.3334); that value clears the LOW floor 0.3000 exactly,
