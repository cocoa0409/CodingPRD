          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "Contractor 'Sabine Rig 7' GOOD_STANDING with one ACTIVE UnitCostContract, ceiling 20000000, rates 4137 / 849999 / 1213 / 2499999"
            - "two ORPHAN_CONFIRMED wells 42-001-01200 and 42-001-01201 under the same operator"
            - "one PluggingJob already SCHEDULED on the first well with scheduled_start 2026-09-01T00:00:00Z and planned_rig_days 3, so crew_window_end_at == 2026-09-06T00:00:00Z"
