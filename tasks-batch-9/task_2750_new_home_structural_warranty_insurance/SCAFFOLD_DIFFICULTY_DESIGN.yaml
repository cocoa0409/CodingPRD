              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
