# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage)
# Timekeeping & FLSA Overtime. Enumerates testable claims of §1.1–§1.7 not
# already covered by §1.8. Setup conventions identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_employee_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Employee, endpoints]
        distinguishing_aspect: "POST /employees with all required fields returns 201 and echoes classification, base_rate_cents, status=ACTIVE."
        test_recipe:
          setup: ["An employer and worksite exist."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "New Hire", classification: "NON_EXEMPT", base_rate_cents: 1800 }
              as: PayrollAdmin
              captures: { e_id: $.data.id, e_status: $.data.status }
          assert:
            - "response.status == 201"
            - "Employee.${e_id}.classification == NON_EXEMPT"
            - "Employee.${e_id}.base_rate_cents == 1800"
            - "Employee.${e_id}.status == ACTIVE"
            - "Employee.${e_id}.version == 1"

      - name: get_employee_not_found
        claim_type: Not Found
        grounds: [entities.Employee, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /employees/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty employee table."]
          setup_api_calls: []
          trigger:
            - call: "GET /employees/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_employee_missing_classification_invalid_request
        claim_type: Required Fields
        grounds: [entities.Employee.fields.classification, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /employees omitting the required classification field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An employer and worksite exist."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "No Class", base_rate_cents: 1800 }
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: employee_is_tipped_defaults_false
        claim_type: Defaults
        grounds: [entities.Employee.fields.is_tipped]
        distinguishing_aspect: "Omitting is_tipped on employee create applies default false."
        test_recipe:
          setup: ["An employer and worksite exist."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Default Tip", classification: "NON_EXEMPT", base_rate_cents: 1800 }
              as: PayrollAdmin
              captures: { e_id: $.data.id }
          assert:
            - "Employee.${e_id}.is_tipped == false"

      - name: timeedit_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TimeEdit]
        distinguishing_aspect: "TimeEdit has common_fields:false (id + created_at only); the audit row exposes editor_user_id, old_value, new_value and is never updatable (no PUT/PATCH endpoint)."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; CLOSED 8h punch; an applied TimeEdit on the punch."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
          trigger:
            - call: "POST /punches/${p_ca}/edits"
              payload: { field: "CLOCK_OUT", new_value: "2026-06-01T17:00:00Z", reason: "badge log correction" }
              as: Supervisor
              as_user_id: "sup-9"
              captures: { edit_id: $.data.id, edit_old: $.data.old_value, edit_editor: $.data.editor_user_id }
          assert:
            - "response.status == 201"
            - "TimeEdit.${edit_id}.editor_user_id == sup-9"
            - "TimeEdit.${edit_id}.old_value == 2026-06-01T16:00:00Z"
            - "TimeEdit.${edit_id}.new_value == 2026-06-01T17:00:00Z"

      - name: timesheet_starts_in_draft
        claim_type: System Fields
        grounds: [entities.TimesheetWeek.fields.status, state_machines.TimesheetWeek.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "A newly created TimesheetWeek has status=DRAFT and version=1, regardless of input."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
          trigger:
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
          assert:
            - "TimesheetWeek.${tw}.status == DRAFT"
            - "TimesheetWeek.${tw}.version == 1"

      - name: create_employee_invalid_classification_enum
        claim_type: Type Constraints
        grounds: [entities.Employee.fields.classification, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "classification outside {EXEMPT, NON_EXEMPT} is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An employer and worksite exist."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Bad Class", classification: "CONTRACTOR", base_rate_cents: 1800 }
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: employee_requires_valid_worksite_parent
        claim_type: Parent Relationships
        grounds: [entities.Employee.fields.home_worksite_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Employee create with a non-existent home_worksite_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["An employer exists; no worksite created."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "11111111-1111-4111-8111-111111111111", full_name: "Orphan", classification: "NON_EXEMPT", base_rate_cents: 1800 }
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_shift_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Shift.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a CANCELLED shift a second time returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; a SCHEDULED shift that has been cancelled."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/cancel"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /shifts/${sh_ca}/cancel"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: close_already_closed_punch_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TimePunch.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a CLOSED punch again returns ERR_INVALID_STATE (409); the close is not idempotent."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; a CLOSED 8h punch."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
          trigger:
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T17:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: finalized_run_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.PayrollRun.OPEN_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From FINALIZED (terminal), POST /payroll-runs/{id}/cancel returns ERR_INVALID_STATE (409) — no transitions out of a finalized run."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; an APPROVED week locked then run FINALIZED."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
              captures: { tw_v_sub: $.data.version }
            - call: "POST /timesheet-weeks/${tw}/approve"
              payload: { expected_timesheet_week_version: "${tw_v_sub}" }
              as: Supervisor
              as_user_id: "sup-2"
              captures: { tw_v_appr: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-06-01", period_end: "2026-06-07" }
              as: PayrollAdmin
              captures: { run: $.data.id }
            - call: "POST /payroll-runs/${run}/include"
              payload: { timesheet_week_id: "${tw}", expected_timesheet_week_version: "${tw_v_appr}" }
              as: PayrollAdmin
            - call: "POST /payroll-runs/${run}/finalize"
              payload: {}
              as: PayrollAdmin
          trigger:
            - call: "POST /payroll-runs/${run}/cancel"
              payload: {}
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: void_open_punch_reverts_shift_to_scheduled
        claim_type: Side Effect Execution
        grounds: [state_machines.TimePunch.OPEN_to_VOIDED, entities.Shift.fields.status]
        distinguishing_aspect: "Voiding the only OPEN punch on a shift reverts the Shift from OPEN back to SCHEDULED."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee; an OPEN punch on a shift (shift is OPEN)."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
          trigger:
            - call: "POST /punches/${p_ca}/void"
              payload: {}
              as: Supervisor
              captures: { v_status: $.data.status }
          assert:
            - "TimePunch.${p_ca}.status == VOIDED"
            - "Shift.${sh_ca}.status == SCHEDULED"

      - name: submit_blocked_by_open_punch_in_week
        claim_type: Precondition Enforcement
        grounds: [state_machines.TimesheetWeek.DRAFT_to_SUBMITTED, "validations[priority=9]", "errors[ERR_OPEN_PUNCH_IN_WEEK]"]
        distinguishing_aspect: "Submitting a week while an OPEN punch exists in that workweek returns ERR_OPEN_PUNCH_IN_WEEK (409)."
        test_recipe:
          setup: ["CA worksite; NON_EXEMPT employee with an OPEN punch on 2026-06-01; a DRAFT week for 2026-06-01."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
          trigger:
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OPEN_PUNCH_IN_WEEK"

  # ===========================================================================
  - section: calculations
    instances:
      - name: tip_true_up_shortfall_made_up
        claim_type: Correct Result
        grounds: [calculations.tip_true_up, entities.TimesheetWeek.fields.tip_true_up_cents, entities.TimesheetWeek.fields.gross_wages_cents]
        distinguishing_aspect: "Tipped NON_EXEMPT at cash wage 213 working 30h with 10000 cents tips: required=max(725,725)*30=21750; direct=6390; earned=16390; tip_true_up_cents=5360; gross=11750."
        test_recipe:
          setup: ["TX worksite federal-only (state_min_wage 725); a tipped NON_EXEMPT employee base 213 cents (cash wage); 30h across the week; tips 10000 cents declared (not pooled)."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme", federal_min_wage_cents: 725, federal_tipped_cash_wage_cents: 213 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "TX", daily_ot_enabled: false, state_min_wage_cents: 725 }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "TX site", state_code: "TX" }
              as: PayrollAdmin
              captures: { ws_tx: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_tx}", full_name: "Tip Tina", classification: "NON_EXEMPT", base_rate_cents: 213, is_tipped: true }
              as: PayrollAdmin
              captures: { e_t: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_t}", worksite_id: "${ws_tx}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T18:00:00Z" }
              as: Supervisor
              captures: { sh1: $.data.id }
            - call: "POST /shifts/${sh1}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_t}"
              captures: { pp1: $.data.id }
