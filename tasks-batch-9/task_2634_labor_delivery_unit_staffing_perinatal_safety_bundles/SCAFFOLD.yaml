    input_types: {}
    output: ShiftAssignment
    validation_priorities: [1, 2, 3, 8, 8.08]
    transitions: ["ShiftAssignment.status SCHEDULED -> CANCELLED"]
    side_effects: ["Recompute calc cesarean_readiness_derivation and calc unit_posture_derivation; increments shift.version and unit.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_SHIFT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_SHIFT_HAS_ACTIVE_COVERAGE]

