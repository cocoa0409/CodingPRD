            - "IndirectCostRate.${c20_rate2_id}.status == ACTIVE"

  # ===========================================================================
  # SECTION 3 — Calculations (correct-result / input-set / constants /
  # precision / algorithm-specific / variant)
  # ===========================================================================
  - section: calculations
    instances:
      - name: closeout_unobligated_balance_equals_ceiling_minus_drawn
        claim_type: Correct Result
        grounds:
          - calculations.closeout_unobligated_balance
          - entities.Award.fields.federal_ceiling_cents
          - entities.Award.fields.federal_drawn_cents
        distinguishing_aspect: |
          On close, closeout_unobligated_cents == federal_ceiling_cents - federal_drawn_cents: ceiling
          24000000 with 5000000 drawn -> 19000000, surfaced on the close response.
        test_recipe:
          setup:
            - "ACTIVE Award (ceiling 24000000); one fund budget 10000000; a drawdown 5000000 DISBURSED (federal_drawn 5000000); award taken to PENDING_CLOSEOUT with no DRAFT/SUBMITTED reports and no ACTIVE subaward."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C21", applicant_org_name: "Corner Org 21", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c21_app_id: $.data.id }
            - call: "POST /applications/${c21_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c21_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c21_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c21_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c21_award_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c21_rf_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c21_award_id}", amount_cents: 5000000, allocation_plan: [ { restricted_fund_id: "${c21_rf_id}", amount_cents: 5000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c21"
              captures: { c21_dd_id: $.data.id }
            - call: "POST /drawdowns/${c21_dd_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c21"
            - call: "GET /awards/${c21_award_id}"
