            - call: "POST /health-permits"
              payload: { truck_id: "${truck_id}", permit_number: "P-2", state_code: "CA", issued_at: "2026-05-01T00:00:00.000Z", expires_at: "2026-12-01T00:00:00.000Z" }
              as: HealthInspector
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "PROPANE", propane_psi_after: 50 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Dee", role: "DRIVER", shift_start: "2026-06-02T16:00:00.000Z", shift_end: "2026-06-02T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Coe", role: "COOK", shift_start: "2026-06-02T16:00:00.000Z", shift_end: "2026-06-02T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /menu-items"
              payload: { truck_id: "${truck_id}", sku: "B1", name: "Burrito", unit_price_cents: 450, par_units: 10 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { item_id: $.data.id }
            - call: "POST /prep-batches"
              payload: { truck_id: "${truck_id}", menu_item_id: "${item_id}", units_made: 10 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /spots"
              payload: { name: "Plaza", state_code: "CA", concurrent_capacity: 2, reservation_fee_cents: 2500 }
              as: Dispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Night Market", starts_at: "2026-06-02T17:00:00.000Z", ends_at: "2026-06-02T22:00:00.000Z" }
              as: Dispatcher
              captures: { event_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { truck_v: $.data.version }
            - call: "POST /bookings"
              payload: { truck_id: "${truck_id}", spot_id: "${spot_id}", event_id: "${event_id}", window_start: "2026-06-02T17:30:00.000Z", window_end: "2026-06-02T21:00:00.000Z", expected_truck_version: "${truck_v}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/arrive"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders"
              payload: { booking_id: "${booking_id}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", menu_item_id: "${item_id}", quantity: 2 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders/${order_id}/authorize-payment"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders/${order_id}/capture-payment"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
          trigger:
            - call: "POST /orders/${order_id}/settle"
              payload: { discount_code: "NONE" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { fee_bal: $.data.reservation_fee_balance_cents, gross: $.data.gross_sales_cents }
          assert:
            - "OperatorTruck.${truck_id}.reservation_fee_balance_cents == 2500"
            - "OperatorTruck.${truck_id}.gross_sales_cents == 900"

  # ===========================================================================
  - rule_id: combinatorial_formula
