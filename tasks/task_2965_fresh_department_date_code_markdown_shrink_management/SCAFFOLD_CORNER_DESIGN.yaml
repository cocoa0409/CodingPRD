              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "PRODUCE", shelf_life_days_default: 5 }
              as: StoreOperationsAdmin
