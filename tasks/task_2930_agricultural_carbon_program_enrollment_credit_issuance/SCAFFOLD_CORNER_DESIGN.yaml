            - "the approve response itself returns HTTP 200 with data.status == \"APPROVED\" and data.approved_by_admin_id == \"admin-baseline-01\""
            - "the first read after approval already shows Enrollment.status == \"ACTIVE\" and permanence_status == \"IN_COMPLIANCE\" — no second read is needed"
            - "the field read already shows status == \"ENROLLED\" and the grower read already shows total_enrolled_acres == 1000.00 (hop 3 lands in the same write as hop 1)"
            - "the opine response cascades the run to VERIFIED and the issue response returns HTTP 201 with gross_credits == 283, buffer_credits == 51, issued_credits == 232, serial_start == 1 and serial_end == 232"
            - "the payment list read immediately after issuance returns total_count == 1 with data[0].status == \"ACCRUED\", data[0].payment_model == \"PER_CREDIT\", data[0].net_amount_cents == 306240 and data[0].credit_batch_id == ${cb1_id} — the cascade-minted row is discoverable at once"
