  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (three different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: fuel_trigger_inclusive_threshold
        grounds:
          - calculations.fuel_escalation_adjustment
          - entities.Contract.fields.fuel_escalation_trigger_pct
          - errors[ERR_FUEL_ENTRY_MISSING]
        distinguishing_aspect: |
          Metric: fuel index price in cents; endpoint: POST /busops/invoices/generate.
          The trigger comparison is INCLUSIVE (P*100 >= B*(100+pct)): P=420 with
          B=400, pct=5 lands exactly on the threshold and escalates (adj 320),
          while P=419 is one cent below and yields exactly 0.
        test_recipe:
          setup:
            - "Contract ACTIVE: base 400, trigger 5, share 80; one route; bus mpg_x10=50"
            - "Day 2026-06-01 RECONCILED with COMPLETED assignment miles=100; day 2026-07-01 RECONCILED likewise"
            - "Fuel entries: 2026-06 at 420 (exactly B*1.05), 2026-07 at 419 (one below)"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-BND1", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-B1", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31", fuel_escalation_trigger_pct: 5, fuel_escalation_share_pct: 80 }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Bnd1", license_number: "L110", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BB1", capacity: 48, fuel_type: "DIESEL", mpg_x10: 50, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id" } }
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${a1}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a1}/complete", payload: { actual_start_minute: 420, actual_end_minute: 480, actual_miles: 100 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "GET /busops/service-days/${sd1}", as: ContractorOps, captures: { sd1_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd1}/lock", payload: { expected_service_day_version: "${sd1_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sd1}/reconcile", payload: {}, as: ContractorOps }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-07-01" }, as: ContractorOps, captures: { sd2: $.data.id } }
            - { call: "POST /busops/service-days/${sd2}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd2}" }, as: ContractorOps, captures: { a2: "$.data[0].id" } }
            - { call: "POST /busops/assignments/${a2}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${a2}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a2}/complete", payload: { actual_start_minute: 420, actual_end_minute: 480, actual_miles: 100 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "GET /busops/service-days/${sd2}", as: ContractorOps, captures: { sd2_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd2}/lock", payload: { expected_service_day_version: "${sd2_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sd2}/reconcile", payload: {}, as: ContractorOps }
            - { call: "POST /busops/fuel-price-entries", payload: { district_id: "${d_id}", effective_month: "2026-06", avg_price_cents_per_gallon: 420, source: "EIA" }, as: FinanceClerk }
            - { call: "POST /busops/fuel-price-entries", payload: { district_id: "${d_id}", effective_month: "2026-07", avg_price_cents_per_gallon: 419, source: "EIA" }, as: FinanceClerk }
          trigger:
            - { call: "POST /busops/invoices/generate", payload: { contract_id: "${c_id}", period_month: "2026-06" }, as: FinanceClerk, captures: { inv6: $.data.id } }
            - { call: "POST /busops/invoices/generate", payload: { contract_id: "${c_id}", period_month: "2026-07" }, as: FinanceClerk, captures: { inv7: $.data.id } }
          assert:
            - "Invoice.${inv6}.fuel_adjustment_cents == 320 (420*100 >= 400*105 exactly triggers; 16c/gal x 20.000 gal)"
            - "Invoice.${inv7}.fuel_adjustment_cents == 0 (419*100 < 400*105: one cent below threshold)"
            - "Invoice.${inv6}.total_cents == 50320 and Invoice.${inv7}.total_cents == 50000"
      - name: training_hours_inclusive_threshold
        grounds:
          - calculations.training_eligibility
          - state_machines.Driver.TRAINING_to_TESTING
          - errors[ERR_TRAINING_HOURS_INSUFFICIENT]
        distinguishing_aspect: |
          Metric: accumulated training minutes; endpoint: POST /busops/drivers/{id}/events.
          behind_wheel_minutes == 2400 exactly qualifies (inclusive >=); 2399 is
          rejected with ERR_TRAINING_HOURS_INSUFFICIENT and the driver stays TRAINING.
        test_recipe:
          setup:
            - "One district; driver X with 2400 behind-wheel + 1200 classroom minutes; driver Y with 2399 behind-wheel + 1200 classroom minutes; both in TRAINING"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-BND2", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Exact", license_number: "L120", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { drx: $.data.id } }
            - { call: "POST /busops/drivers/${drx}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${drx}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${drx}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${drx}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Short", license_number: "L121", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dry: $.data.id } }
            - { call: "POST /busops/drivers/${dry}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dry}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dry}", category: "BEHIND_WHEEL", minutes: 2399, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dry}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
          trigger:
            - { call: "POST /busops/drivers/${drx}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter, captures: { stx: $.data.status } }
            - { call: "POST /busops/drivers/${dry}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter, captures: { erry: $.data.error_id } }
          assert:
            - "${stx} == TESTING (2400 exactly satisfies the inclusive threshold)"
            - "${erry} == ERR_TRAINING_HOURS_INSUFFICIENT (2399 fails)"
            - "Driver.${dry}.status == TRAINING (unchanged)"
            - "HTTP status for driver Y attempt is 422"
      - name: incident_sla_strict_breach_threshold
        grounds:
          - calculations.incident_sla
          - state_machines.Incident.SUBMITTED_to_ACKNOWLEDGED
          - entities.Incident.fields.sla_breached
        distinguishing_aspect: |
          Metric: elapsed seconds against a 24h CRITICAL SLA; endpoint:
          POST /busops/incidents/{id}/acknowledge. Breach uses STRICT >: an
          acknowledgement exactly at submitted_at+24h is NOT a breach, one
          second later IS. Different metric and endpoint from the fuel-price
          and training-minute boundaries.
        test_recipe:
          setup:
            - "District exists; two CRITICAL incidents submitted at clock 2026-06-01T08:00:00Z (due_by 2026-06-02T08:00:00Z)"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-BND3", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /busops/incidents", payload: { district_id: "${d_id}", category: "ACCIDENT", severity: "CRITICAL", description: "Minor collision, no injuries", occurred_at: "2026-06-01T07:30:00Z" }, as: ContractorOps, captures: { i1: $.data.id } }
            - { call: "POST /busops/incidents/${i1}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/incidents", payload: { district_id: "${d_id}", category: "MEDICAL", severity: "CRITICAL", description: "Student medical event", occurred_at: "2026-06-01T07:45:00Z" }, as: ContractorOps, captures: { i2: $.data.id } }
            - { call: "POST /busops/incidents/${i2}/submit", payload: {}, as: ContractorOps }
          trigger:
            - { call: "POST /busops/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /busops/incidents/${i1}/acknowledge", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}", captures: { b1: $.data.sla_breached } }
            - { call: "POST /busops/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T08:00:01Z" }, as: SystemAdmin }
            - { call: "POST /busops/incidents/${i2}/acknowledge", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}", captures: { b2: $.data.sla_breached } }
          assert:
            - "Incident.${i1}.district_due_by == 2026-06-02T08:00:00Z (submitted + 24h)"
            - "${b1} == false (acknowledged exactly at deadline: strict > means no breach)"
            - "${b2} == true (one second past deadline breaches)"
            - "Incident.${i1}.status == ACKNOWLEDGED and Incident.${i2}.status == ACKNOWLEDGED"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (three different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_active_driver
        grounds:
          - state_machines.Assignment.PLANNED_to_CONFIRMED
          - state_machines.Driver.ACTIVE_to_SUSPENDED
          - errors[ERR_DRIVER_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair Driver->Assignment: a PLANNED assignment cannot transition to
          CONFIRMED while the referenced Driver is SUSPENDED; the driver's own
          state machine gates the assignment's transition.
        test_recipe:
          setup: ["Contract ACTIVE, one route; driver reached ACTIVE then SUSPENDED via discipline; service day 2026-06-01 DISPATCH_OPEN with PLANNED assignment; bus available"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-XD1", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-X1", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Xd1", license_number: "L130", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/discipline", payload: { action: "SUSPEND", reason: "Policy violation" }, as: ContractorOps }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BX1", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id" } }
          trigger:
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DRIVER_NOT_ACTIVE"
            - "Assignment.${a1}.status == PLANNED (unchanged)"
            - "Assignment.${a1}.driver_id remains null"
      - name: confirm_requires_in_service_bus
        grounds:
          - state_machines.Assignment.PLANNED_to_CONFIRMED
          - state_machines.Bus.IN_SERVICE_to_IN_SHOP
          - errors[ERR_BUS_NOT_IN_SERVICE]
        distinguishing_aspect: |
          Pair Bus->Assignment: opening a work order flips the bus to IN_SHOP,
          and that foreign state blocks the assignment's CONFIRMED transition —
          a different entity pair from Driver->Assignment.
        test_recipe:
          setup: ["Contract ACTIVE, one route; driver ACTIVE; bus moved IN_SHOP via a work order; service day 2026-06-01 DISPATCH_OPEN with PLANNED assignment"]
