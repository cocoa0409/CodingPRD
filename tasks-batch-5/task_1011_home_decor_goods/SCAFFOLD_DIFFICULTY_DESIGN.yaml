# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Home Décor & Home-Goods Store. 9 rules x 2 instances = 18 instances.
# All setup_api_calls / trigger calls conform to SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: refund_receipted_vs_non_receipted_price_basis
        grounds:
          - calculations.return_refund
          - entities.Return.fields.base_refund_cents
          - entities.OrderLine.fields.unit_price_cents
          - entities.Product.fields.current_price_cents
        distinguishing_aspect: |
          On the Return domain: NON_RECEIPTED bases refund on Product.current_price_cents today
          (8500 after a markdown), whereas RECEIPTED would base it on the paid unit_price_cents
          (10000) — same returned unit, two refund figures.
        test_recipe:
          setup:
            - "Store ACTIVE; regular Product base 10000, floor 1000, first_received 2026-06-10 (weeks 3 = FULL at order time)."
            - "Order fulfilled at clock 2026-07-01 (unit_price snapshot 10000); clock then advanced to 2026-07-13 (weeks 4 = MARKDOWN_1, current_price 8500) — within the 30-day return window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store R1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-R1", name: "Ceramic Vase", category: "DECOR", base_price_cents: 10000, clearance_floor_cents: 1000, first_received_at: "2026-06-10T00:00:00Z", is_treasure_hunt: false }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 10 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "r1@x.com", full_name: "R One" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT", member_id: "${mid}" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-13T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${oid}", product_id: "${pid}", returned_qty: 1, variant: "NON_RECEIPTED" }
              as: StoreAssociate
              captures: { rid: $.data.id }
          assert:
            - "Return.${rid}.base_refund_cents == 8500"
            - "Return.${rid}.restocking_fee_cents == 0"
            - "Return.${rid}.refund_amount_cents == 8500"
            - "A RECEIPTED return of the same line would base on unit_price_cents 10000, so base_refund_cents would be 10000 — the two variants diverge."

      - name: loyalty_points_provisional_vs_earned
        grounds:
          - calculations.loyalty_points
          - entities.Order.fields.provisional_points
          - entities.Order.fields.earned_points
          - entities.LoyaltyMember.fields.points_balance
        distinguishing_aspect: |
          On the LoyaltyMember domain: provisional_points is floor(subtotal/100)*rate = 54 (over pre-redemption
          subtotal 1800), earned_points is floor(total_due/100)*rate = 39 (over post-redemption 1300) — the two
          variants diverge whenever redeemed_cents > 0.
        test_recipe:
          setup:
            - "GOLD member (lifetime_spend 200000, tier discount 10%, rate 3), points_balance 1000."
            - "Order (BOPIS) redeeming 500 points; single line unit_price 1000 x qty 2 -> line_net 1800 -> subtotal 1800; total_due 1300."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store P1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-P1", name: "Throw Pillow", category: "TEXTILE", base_price_cents: 1000, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z", is_treasure_hunt: false }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 10 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "p1@x.com", full_name: "P One", initial_lifetime_spend_cents: 200000, initial_points_balance: 1000 }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "BOPIS", member_id: "${mid}", requested_redeem_points: 500 }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
          assert:
            - "Order.${oid}.subtotal_cents == 1800"
            - "Order.${oid}.total_due_cents == 1300"
            - "Order.${oid}.provisional_points == 54"
            - "Order.${oid}.earned_points == 39"
            - "LoyaltyMember.${mid}.points_balance == 539"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: treasure_hunt_ladder_with_clearance_floor_max
        grounds:
          - calculations.product_pricing
          - entities.Product.fields.current_price_cents
          - entities.Product.fields.markdown_tier
          - entities.Product.fields.is_treasure_hunt
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base_price_cents, weeks-derived markdown_pct selected by the is_treasure_hunt
          ladder, clearance_floor_cents) combine non-linearly through max(round_half_up(base*(1-pct)), floor);
          here the floor 800 dominates the 40% clearance price 600.
        test_recipe:
          setup:
            - "Treasure-hunt Product base 1000, floor 800, first_received 2026-05-01; clock 2026-07-01 -> weeks 8 -> treasure CLEARANCE 40% -> 600, floored up to 800."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /products"
              payload: { sku: "SKU-TH1", name: "Accent Lamp", category: "SEASONAL", base_price_cents: 1000, clearance_floor_cents: 800, first_received_at: "2026-05-01T00:00:00Z", is_treasure_hunt: true }
              as: MerchandisingManager
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /products/${pid}"
              payload: {}
              as: MerchandisingManager
          assert:
            - "Product.${pid}.weeks_on_shelf == 8"
            - "Product.${pid}.markdown_tier == CLEARANCE"
            - "Product.${pid}.current_price_cents == 800"

      - name: order_subtotal_round_per_line_then_sum
        grounds:
          - calculations.order_totals
          - entities.OrderLine.fields.line_net_cents
          - entities.Order.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned. Two lines of unit_price 1055 x qty 1 at GOLD 10%:
          round_half_up(949.5)=950 per line, summed = 1900; sum-then-round would give
          round(2110*0.9)=1899. The pinned per-line rounding yields 1900.
        test_recipe:
          setup:
            - "GOLD member (10% discount). Two FULL-price products at 1055 each; one line of qty 1 for each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store C1", region_code: "NY", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CA", name: "Frame A", category: "DECOR", base_price_cents: 1055, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z", is_treasure_hunt: false }
              as: MerchandisingManager
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CB", name: "Frame B", category: "DECOR", base_price_cents: 1055, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z", is_treasure_hunt: false }
              as: MerchandisingManager
              captures: { pb: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pa}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inva: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pb}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { invb: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "c1@x.com", full_name: "C One", initial_lifetime_spend_cents: 200000 }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT", member_id: "${mid}" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pa}", qty: 1 }
              as: StoreAssociate
              captures: { la: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pb}", qty: 1 }
              as: StoreAssociate
              captures: { lb: $.data.id }
          trigger:
            - call: "GET /orders/${oid}"
              payload: {}
              as: StoreAssociate
          assert:
            - "OrderLine.${la}.line_net_cents == 950"
            - "OrderLine.${lb}.line_net_cents == 950"
            - "Order.${oid}.subtotal_cents == 1900"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_payment_and_fulfillment_axes_independent
        grounds:
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - state_machines.Order.PENDING_to_READY
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on one Order: capture advances only payment_status
          (AUTHORIZED->CAPTURED) while fulfillment_status stays PENDING, and ready advances
          only fulfillment_status (PENDING->READY) while payment_status stays CAPTURED.
        test_recipe:
          setup:
            - "Order with one reserved line, both axes at initial states (PENDING / AUTHORIZED)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store SM1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-SM1", name: "Rug", category: "TEXTILE", base_price_cents: 5000, clearance_floor_cents: 500, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "BOPIS" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
          assert:
            - "Order.${oid}.payment_status == CAPTURED"
            - "Order.${oid}.fulfillment_status == READY"
            - "Each transition advanced exactly one axis — the two dimensions are independent."

      - name: special_order_requote_cycle_back_to_quoted
        grounds:
          - state_machines.SpecialOrder.CUSTOMER_REVIEW_to_QUOTED
          - state_machines.SpecialOrder.QUOTED_to_CUSTOMER_REVIEW
          - entities.SpecialOrder.fields.status
        distinguishing_aspect: |
          Cyclic shape on SpecialOrder: request-changes returns CUSTOMER_REVIEW->QUOTED, a
          self-referential revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "SpecialOrder quoted then submitted for review; OCC version tracked from each response."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store SO1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "so1@x.com", full_name: "SO One" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", member_id: "${mid}", description: "Custom sectional" }
              as: StoreAssociate
              captures: { so_id: $.data.id, so_v1: $.data.version }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 50000, expected_special_order_version: "${so_v1}" }
              as: StoreAssociate
              captures: { so_v2: $.data.version }
            - call: "POST /special-orders/${so_id}/submit-for-review"
              payload: {}
              as: StoreAssociate
              captures: { so_v3: $.data.version }
          trigger:
            - call: "POST /special-orders/${so_id}/request-changes"
              payload: {}
              as: StoreAssociate
          assert:
            - "SpecialOrder.${so_id}.status == QUOTED"
            - "SpecialOrder.${so_id}.quote_revision == 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: discontinue_product_cascade_depth3
        grounds:
          - state_machines.Product.ACTIVE_to_DISCONTINUED
          - state_machines.RegistryItem.OPEN_to_UNAVAILABLE
          - entities.StoreInventory.fields.status
          - entities.RegistryItem.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single discontinue: Product DISCONTINUED -> StoreInventory DEAD
          (caused by the discontinue) -> RegistryItem UNAVAILABLE (caused by the DEAD inventory)
          -> Registry recomputed; each link is caused by the previous.
        test_recipe:
          setup:
            - "Product stocked at a store and referenced by an OPEN RegistryItem on an ACTIVE registry."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store D1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-D1", name: "Table Lamp", category: "DECOR", base_price_cents: 3000, clearance_floor_cents: 300, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "d1@x.com", full_name: "D One" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /registries"
              payload: { owner_member_id: "${mid}", title: "Housewarming", event_date: "2026-12-01" }
              as: Customer
              as_user_id: "${mid}"
              captures: { reg_id: $.data.id }
            - call: "POST /registries/${reg_id}/items"
              payload: { product_id: "${pid}", desired_qty: 2 }
              as: Customer
              as_user_id: "${mid}"
              captures: { ri_id: $.data.id }
          trigger:
            - call: "POST /products/${pid}/discontinue"
              payload: {}
              as: MerchandisingManager
          assert:
            - "Product.${pid}.status == DISCONTINUED"
            - "StoreInventory.${inv_id}.status == DEAD"
            - "RegistryItem.${ri_id}.status == UNAVAILABLE"

      - name: order_cancel_release_reservation_depth2
        grounds:
          - state_machines.Order.PENDING_to_CANCELLED
          - entities.StoreInventory.fields.on_hand_qty
          - entities.StoreInventory.fields.reserved_qty
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (order cancel): cancel -> StoreInventory
          reservation released (reserved->on_hand, caused by cancel) -> owning Product availability
          reconciled (caused by the inventory change).
        test_recipe:
          setup:
            - "Order with one PENDING line reserving 3 of 10 allocated units (on_hand 7, reserved 3)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store CB1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CB1", name: "Bowl Set", category: "KITCHEN", base_price_cents: 2000, clearance_floor_cents: 200, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 10 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 3 }
              as: StoreAssociate
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreAssociate
          assert:
            - "Order.${oid}.fulfillment_status == CANCELLED"
            - "StoreInventory.${inv_id}.reserved_qty == 0"
            - "StoreInventory.${inv_id}.on_hand_qty == 10"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: delivery_day_full_beats_crew_unavailable
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_DELIVERY_DAY_FULL]
          - errors[ERR_ASSEMBLY_CREW_UNAVAILABLE]
        distinguishing_aspect: |
          business_temporal (ERR_DELIVERY_DAY_FULL, p7) vs business_constraint
          (ERR_ASSEMBLY_CREW_UNAVAILABLE, p8): a booking that both fills the day and overlaps the
          crew window returns the p7 temporal error.
        test_recipe:
          setup:
            - "Store with oversized_slots_per_day 1; one confirmed-eligible booking on 2026-07-10 occupying crew window [10:00,12:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store PC1", region_code: "CA", oversized_slots_per_day: 1 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /assembly-crews"
              payload: { store_id: "${store_id}", name: "Crew Alpha" }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { o1: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { o2: $.data.id }
            - call: "POST /delivery-bookings"
              payload: { order_id: "${o1}", store_id: "${store_id}", delivery_date: "2026-07-10", needs_assembly: true, crew_id: "${crew_id}", assembly_window_start: "2026-07-10T10:00:00Z", assembly_window_end: "2026-07-10T12:00:00Z" }
              as: DeliveryCoordinator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /delivery-bookings"
              payload: { order_id: "${o2}", store_id: "${store_id}", delivery_date: "2026-07-10", needs_assembly: true, crew_id: "${crew_id}", assembly_window_start: "2026-07-10T11:00:00Z", assembly_window_end: "2026-07-10T13:00:00Z" }
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DELIVERY_DAY_FULL"
            - "The p8 ERR_ASSEMBLY_CREW_UNAVAILABLE is also violated but suppressed by the lower-priority-number p7 rule."

      - name: order_not_fulfilled_beats_return_qty_exceeds
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_ORDER_NOT_FULFILLED]
          - errors[ERR_RETURN_QTY_EXCEEDS]
        distinguishing_aspect: |
          state (ERR_ORDER_NOT_FULFILLED, p4) vs business_fiscal (ERR_RETURN_QTY_EXCEEDS, p9): a
          return against a still-PENDING order for an absurd qty returns the p4 state error, a
          different category pair than the delivery conflict.
        test_recipe:
          setup:
            - "Order captured but NOT fulfilled (fulfillment PENDING); one line qty 2; return requests qty 99."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store PC2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-PC2", name: "Coaster", category: "KITCHEN", base_price_cents: 800, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${oid}", product_id: "${pid}", returned_qty: 99, variant: "RECEIPTED" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_FULFILLED"
            - "The p9 ERR_RETURN_QTY_EXCEEDS is also violated but suppressed by the lower-priority-number p4 rule."

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: markdown_clearance_threshold_at_week_12
        grounds:
          - calculations.product_pricing
          - entities.Product.fields.markdown_tier
          - entities.Product.fields.weeks_on_shelf
        distinguishing_aspect: |
          Numeric >= boundary on weeks_on_shelf: exactly 12 weeks flips MARKDOWN_2 (30%, 7000)
          into CLEARANCE (50%, 5000) via GET /products/{id}; 11 weeks would still be MARKDOWN_2.
        test_recipe:
          setup:
            - "Regular Product base 10000, floor 1000, first_received 2026-04-08; clock 2026-07-01 -> exactly 12 weeks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /products"
              payload: { sku: "SKU-B1", name: "Wall Clock", category: "DECOR", base_price_cents: 10000, clearance_floor_cents: 1000, first_received_at: "2026-04-08T00:00:00Z", is_treasure_hunt: false }
              as: MerchandisingManager
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /products/${pid}"
              payload: {}
              as: MerchandisingManager
          assert:
            - "Product.${pid}.weeks_on_shelf == 12"
            - "Product.${pid}.markdown_tier == CLEARANCE"
            - "Product.${pid}.current_price_cents == 5000"

      - name: inventory_reserve_at_zero_availability
        grounds:
          - calculations.inventory_conservation
          - validations[priority=8]
          - errors[ERR_INSUFFICIENT_INVENTORY]
          - entities.StoreInventory.fields.on_hand_qty
        distinguishing_aspect: |
          Zero-availability boundary on StoreInventory via POST /orders/{id}/lines: a first line of
          qty 3 succeeds when available is exactly 3, driving availability to 0; a second order's
          qty-1 line then fails at the on_hand-reserved == 0 edge — a different metric and endpoint
          than the weeks threshold.
        test_recipe:
          setup:
            - "StoreInventory allocated 3; order o1 line qty 3 drives available to 0; order o2 attempts qty 1 of the same product/store."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store B2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-B2", name: "Candle", category: "SEASONAL", base_price_cents: 500, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 3 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { product_id: "${pid}", qty: 3 }
              as: StoreAssociate
              captures: { l1: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /orders/${o2}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_INVENTORY"
            - "StoreInventory.${inv_id}.on_hand_qty == 0"
            - "StoreInventory.${inv_id}.reserved_qty == 3"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_requires_store_active
        grounds:
          - state_machines.DeliveryBooking.SCHEDULED_to_CONFIRMED
          - validations[priority=6]
          - errors[ERR_STORE_RESET_LOCKED]
          - entities.Store.fields.status
        distinguishing_aspect: |
          Pair DeliveryBooking->Store: the SCHEDULED->CONFIRMED transition is gated by the parent
          Store.status == ACTIVE; a RESET_LOCKED store blocks confirmation with ERR_STORE_RESET_LOCKED.
        test_recipe:
          setup:
            - "SCHEDULED booking on 2026-07-10; owning store then locked for seasonal reset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store CE1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /delivery-bookings"
              payload: { order_id: "${oid}", store_id: "${store_id}", delivery_date: "2026-07-10" }
              as: DeliveryCoordinator
              captures: { b1: $.data.id }
            - call: "POST /stores/${store_id}/lock"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /delivery-bookings/${b1}/confirm"
              payload: {}
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STORE_RESET_LOCKED"
            - "DeliveryBooking.${b1}.status == SCHEDULED"

      - name: add_line_requires_product_active
        grounds:
          - state_machines.Product.ACTIVE_to_DISCONTINUED
          - validations[priority=4]
          - errors[ERR_PRODUCT_DISCONTINUED]
          - entities.Product.fields.status
        distinguishing_aspect: |
          Pair Order/OrderLine->Product: adding an OrderLine depends on Product.status == ACTIVE;
          a DISCONTINUED product blocks the line with ERR_PRODUCT_DISCONTINUED — a different entity
          pair than DeliveryBooking->Store.
        test_recipe:
          setup:
            - "Product stocked then discontinued; a fresh order attempts to add a line for it."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store CE2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CE2", name: "Planter", category: "DECOR", base_price_cents: 1500, clearance_floor_cents: 200, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /products/${pid}/discontinue"
              payload: {}
              as: MerchandisingManager
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCT_DISCONTINUED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_day_capacity_aggregate_count
        grounds:
          - calculations.delivery_day_capacity
          - validations[priority=7]
          - errors[ERR_DELIVERY_DAY_FULL]
          - entities.Store.fields.oversized_slots_per_day
        distinguishing_aspect: |
          Store resource, aggregate discrete-day capacity: a second same-day booking is rejected
          purely on count (>= oversized_slots_per_day) with no interval geometry.
        test_recipe:
          setup:
            - "Store slots_per_day 1; one non-assembly booking already on 2026-07-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store TO1", region_code: "CA", oversized_slots_per_day: 1 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { o1: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { o2: $.data.id }
            - call: "POST /delivery-bookings"
              payload: { order_id: "${o1}", store_id: "${store_id}", delivery_date: "2026-07-10" }
              as: DeliveryCoordinator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /delivery-bookings"
              payload: { order_id: "${o2}", store_id: "${store_id}", delivery_date: "2026-07-10" }
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DELIVERY_DAY_FULL"

      - name: assembly_crew_halfopen_interval_overlap
        grounds:
          - calculations.assembly_window_overlap
          - validations[priority=8]
          - errors[ERR_ASSEMBLY_CREW_UNAVAILABLE]
          - entities.AssemblyCrew.fields.id
        distinguishing_aspect: |
          AssemblyCrew resource, half-open interval geometry: a window [11:00,13:00) overlapping an
          existing [10:00,12:00) on the same crew is rejected (start<end pairwise), while touching
          endpoints would be allowed — different resource entity and semantics than the day count.
        test_recipe:
          setup:
            - "Store slots_per_day 5 (day capacity not the blocker); crew Alpha holds [10:00,12:00) on 2026-07-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store TO2", region_code: "CA", oversized_slots_per_day: 5 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /assembly-crews"
              payload: { store_id: "${store_id}", name: "Crew Alpha" }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { o1: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { o2: $.data.id }
            - call: "POST /delivery-bookings"
              payload: { order_id: "${o1}", store_id: "${store_id}", delivery_date: "2026-07-10", needs_assembly: true, crew_id: "${crew_id}", assembly_window_start: "2026-07-10T10:00:00Z", assembly_window_end: "2026-07-10T12:00:00Z" }
              as: DeliveryCoordinator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /delivery-bookings"
              payload: { order_id: "${o2}", store_id: "${store_id}", delivery_date: "2026-07-10", needs_assembly: true, crew_id: "${crew_id}", assembly_window_start: "2026-07-10T11:00:00Z", assembly_window_end: "2026-07-10T13:00:00Z" }
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSEMBLY_CREW_UNAVAILABLE"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_conserved_reserve_then_cancel
        grounds:
          - calculations.inventory_conservation
          - state_machines.Order.PENDING_to_CANCELLED
          - entities.StoreInventory.fields.allocated_qty
          - entities.StoreInventory.fields.on_hand_qty
        distinguishing_aspect: |
          Conserved quantity = physical units per StoreInventory row: allocated_qty (10) ==
          on_hand + reserved + sold at all times; reserve(forward)+cancel(compensating) returns
          on_hand to 10 with zero drift.
        test_recipe:
          setup:
            - "StoreInventory allocated 10; order line reserves 4; order then cancelled."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store CI1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CI1", name: "Duvet", category: "TEXTILE", base_price_cents: 6000, clearance_floor_cents: 500, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 10 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 4 }
              as: StoreAssociate
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreAssociate
          assert:
            - "StoreInventory.${inv_id}.allocated_qty == 10"
            - "StoreInventory.${inv_id}.on_hand_qty == 10"
            - "StoreInventory.${inv_id}.reserved_qty == 0"
            - "StoreInventory.${inv_id}.sold_qty == 0"

      - name: loyalty_points_conserved_redeem_then_cancel
        grounds:
          - calculations.points_conservation
          - state_machines.Order.PENDING_to_CANCELLED
          - entities.LoyaltyMember.fields.points_balance
          - entities.LoyaltyMember.fields.points_redeemed_total
        distinguishing_aspect: |
          Conserved quantity = loyalty points: points_balance == points_earned_total -
          points_redeemed_total; redeem(forward,-500)+cancel(compensating,+500) restores balance to
          1000 with zero drift — a different conserved quantity than inventory units.
        test_recipe:
          setup:
            - "Member points_balance 1000; order redeems 500 (balance -> 500); order cancelled (balance restored to 1000)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store CI2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "ci2@x.com", full_name: "CI Two", initial_points_balance: 1000 }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT", member_id: "${mid}", requested_redeem_points: 500 }
              as: StoreAssociate
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreAssociate
          assert:
            - "LoyaltyMember.${mid}.points_balance == 1000"
            - "LoyaltyMember.${mid}.points_redeemed_total == 0"
