              as: FleetManager
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OWNERSHIP_MISMATCH (order's fleet_customer_id is ${cust_id}, not ${cust_b})"
            - "VehicleOrder.${ord_id}.status stays DRAFT"

