      - name: equipment_lines_beyond_available_stock_are_refused
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 72: the requested qty must be <= (equipment_item.on_hand_qty - equipment_item.reserved_qty) (ERR_EQUIPMENT_STOCK_UNAVAILABLE, 409)."
          - "§1.5 POST /tech-riders/{id}/equipment-lines recomputes EquipmentItem.reserved_qty over RESERVED lines."
        distinguishing_aspect: >-
          Stock is exhausted in two steps so the check is exercised against both
          terms of the subtraction: first a request larger than on_hand_qty, then
          - after a successful reservation of the whole shelf - a single-unit
          request that only fails because reserved_qty has grown. An
          implementation that compares against on_hand_qty alone passes the first
          and fails the second.
        test_recipe:
          setup:
            - "Grand Hall exists with house_power_amps 400, so a 500 A rider request is a POWER_SHORTFALL."
            - "EquipmentItem 'Tour Power Distro 200A' exists with on_hand_qty 2, daily_rate_cents 25000, reserved_qty 0."
            - "Two RENTAL engagements on Grand Hall (Oct 1-3 and Oct 10-12 2026) each have a rider requesting 500 A, both reviewed to GAP_IDENTIFIED ['POWER_SHORTFALL']."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /equipment-items"
              as: CenterAdmin
              payload: { category: "POWER", model_name: "Tour Power Distro 200A", on_hand_qty: 2, daily_rate_cents: 25000, replacement_value_cents: 900000 }
              captures: { item_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "First Rental", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { eng_one: "$.data.id" }
            - call: "POST /engagements/${eng_one}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 500, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_one: "$.data.id" }
            - call: "POST /tech-riders/${rider_one}/review"
              as: TechnicalDirector
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Second Rental", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { eng_two: "$.data.id" }
            - call: "POST /engagements/${eng_two}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 500, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_two: "$.data.id" }
            - call: "POST /tech-riders/${rider_two}/review"
              as: TechnicalDirector
          trigger:
            - call: "POST /tech-riders/${rider_one}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "${item_id}", covers_gap: "POWER_SHORTFALL", qty: 3, rental_days: 1 }
              captures: { e_overdraw: "$.data.error_id" }
            - call: "POST /tech-riders/${rider_one}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "${item_id}", covers_gap: "POWER_SHORTFALL", qty: 2, rental_days: 1 }
              captures: { line_one: "$.data.id" }
            - call: "POST /tech-riders/${rider_two}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "${item_id}", covers_gap: "POWER_SHORTFALL", qty: 1, rental_days: 1 }
              captures: { e_reserved_out: "$.data.error_id" }
            - call: "GET /equipment-items/${item_id}"
              as: CenterAdmin
            - call: "GET /equipment-items/${item_id}/rental-lines"
              as: CenterAdmin
              payload: { limit: 10, offset: 0 }
          assert:
            - "Request for 3 of 2 on-hand units: 409 ERR_EQUIPMENT_STOCK_UNAVAILABLE, and reserved_qty is still 0."
            - "Request for exactly the 2 available units: 201 with line_cost_cents == 50000 (25000 * 2 * 1) - the boundary is `<=`."
            - "A one-unit request from the second rider: 409 ERR_EQUIPMENT_STOCK_UNAVAILABLE - on_hand_qty 2 minus reserved_qty 2 leaves nothing, so the check consults both terms."
            - "EquipmentItem.reserved_qty == 2 and the rental-lines listing reports meta.total_count == 1: neither rejected request created a line."

      - name: offers_below_the_guarantee_floor_are_refused_on_both_sides_of_the_table
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 76: offered_fee_cents and counter/revised offers must be >= artist.guarantee_floor_cents (ERR_GUARANTEE_BELOW_FLOOR, 422)."
          - "§1.5 POST /fee-negotiations/{id}/counter and POST /fee-negotiations/{id}/revise-offer."
        distinguishing_aspect: >-
          The floor is tested one cent below, exactly at, and via the artist's own
          counter, which is the only place the rule applies to a value the CENTER
          did not submit. An implementation that validates only the opening offer
          accepts a 150000 counter against a 200000 floor and silently books an
          illegal guarantee.
        test_recipe:
          setup:
            - "Artist 'Cadence Quartet' has guarantee_floor_cents 200000 and a routing window covering 2026-09-01 to 2026-12-31."
            - "A DRAFT PRESENTED engagement on Grand Hall (performance 2026-10-11) exists with negotiation_round_count 0."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 199999, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { e_low_offer: "$.data.error_id" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 200000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { counter_fee_cents: 150000, counter_artist_share_pct: 0.2 }
              captures: { e_low_counter: "$.data.error_id" }
            - call: "POST /fee-negotiations/${neg_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { counter_fee_cents: 250000, counter_artist_share_pct: 0.2 }
              captures: { countered: "$.data.status" }
            - call: "GET /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { limit: 10, offset: 0 }
          assert:
            - "199999 against a 200000 floor: 422 ERR_GUARANTEE_BELOW_FLOOR, and engagement.negotiation_round_count is still 0 - the rejected round was never opened and the version did not move from ${eng_v0}."
            - "Exactly 200000: 201 with round_index 1 and status 'OFFERED' - the comparison is `>=`."
            - "A 150000 counter from the artist's own representative: 422 ERR_GUARANTEE_BELOW_FLOOR, and the round is still 'OFFERED' with counter_fee_cents null."
            - "A 250000 counter: 200 with status 'COUNTERED' - the floor binds the counter path exactly as it binds the offer path."
            - "The negotiation listing reports meta.total_count == 1: only one round exists despite four attempts."

      - name: clearing_an_uncovered_gap_requires_a_line_that_matches_the_gap
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 77: every capability gap other than RIGGING_NEAR_LIMIT must be covered by a RESERVED EquipmentRentalLine whose covers_gap matches that gap (ERR_GAP_NOT_COVERED, 409)."
        distinguishing_aspect: >-
          Three attempts to clear the same rider - with no line, with a line whose
          covers_gap is NONE, and with a matching line - separate "some line
          exists" from "a line matching this gap exists". The middle attempt is
          the discriminator: a comfort item reserved against the same rider must
          not satisfy the coverage requirement.
        test_recipe:
          setup:
            - "Grand Hall exists with house_power_amps 400."
            - "EquipmentItem 'Tour Power Distro 200A' (POWER, on_hand 5, 25000/day) and EquipmentItem 'Wardrobe Steamer' (SOFT_GOODS, on_hand 5, 5000/day) exist."
            - "A RENTAL engagement on Grand Hall has a rider requesting 500 A, reviewed to GAP_IDENTIFIED ['POWER_SHORTFALL']."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /equipment-items"
              as: CenterAdmin
              payload: { category: "POWER", model_name: "Tour Power Distro 200A", on_hand_qty: 5, daily_rate_cents: 25000, replacement_value_cents: 900000 }
              captures: { distro_id: "$.data.id" }
            - call: "POST /equipment-items"
              as: CenterAdmin
              payload: { category: "SOFT_GOODS", model_name: "Wardrobe Steamer", on_hand_qty: 5, daily_rate_cents: 5000, replacement_value_cents: 60000 }
              captures: { steamer_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Meridian Rental", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 500, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
          trigger:
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
              captures: { e_no_line: "$.data.error_id" }
            - call: "POST /tech-riders/${rider_id}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "${steamer_id}", covers_gap: "NONE", qty: 1, rental_days: 2 }
              captures: { comfort_line: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
              captures: { e_wrong_line: "$.data.error_id" }
            - call: "POST /tech-riders/${rider_id}/equipment-lines"
              as: TechnicalDirector
              payload: { equipment_item_id: "${distro_id}", covers_gap: "POWER_SHORTFALL", qty: 1, rental_days: 2 }
              captures: { covering_line: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
            - call: "GET /engagements/${engagement_id}"
              as: RentalManager
          assert:
            - "Clear with no lines at all: 409 ERR_GAP_NOT_COVERED and review_status stays 'GAP_IDENTIFIED'."
            - "Clear after reserving a covers_gap 'NONE' comfort item: still 409 ERR_GAP_NOT_COVERED - existence of a line is not coverage."
            - "Clear after reserving a covers_gap 'POWER_SHORTFALL' line: 200 with review_status 'CLEARED' and rider.additional_equipment_cost_cents == 60000 (10000 steamer + 50000 distro) - BOTH reserved lines are billed, not only the covering one."
            - "engagement.additional_equipment_cost_cents == 60000 while deposit_required_cents stays 175000 (round_half_up(0.25 * 700000)): the client's outstanding_balance_cents is 0, so the equipment add-on branch of deposit_requirement does not apply."
            - "The failed clears left no side effects: engagement.additional_equipment_cost_cents was 0 until the successful clear."

      - name: ticketing_errors_follow_the_pinned_tier_before_engagement_precedence
        claim_type: error_triggerable
        grounds:
          - "§1.6 ERR_TICKETING_NOT_ON_SALE (409) fires when the engagement's ticketing_status is not ON_SALE while the target tier is still ACTIVE."
          - "§1.6 ERR_TIER_CLOSED (409): the tier-scoped check is evaluated BEFORE the engagement-scoped ticketing check, so a CLOSED tier under a CLOSED engagement returns this code."
          - "§1.4 priority 73: qty must be <= tier.available_qty (ERR_TIER_SOLD_OUT, 409)."
          - "§1.5 POST /engagements/{id}/settlements sets ticketing_status -> CLOSED and closes ACTIVE tiers."
        distinguishing_aspect: >-
          Walks all three sale-time refusals on one tier as the ticketing
          dimension advances TIERS_DRAFT -> ON_SALE -> CLOSED, and the final
          attempt is the case the scaffold explicitly adjudicated: both the tier
          and the engagement are closed, and only the tier's code is correct. An
          implementation that checks the engagement first returns
          ERR_TICKETING_NOT_ON_SALE there.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' exist; a PRESENTED engagement (performance 2026-10-11T19:00Z-22:00Z) has one ACTIVE tier ORCH: 100 seats at 10000, dynamic pricing disabled."
            - "Round 1 at 300000 / 0.10 was accepted; risk was assessed to score 27 -> LOW -> CLEARED (projected_gross 800000, projected_margin 250000); the rider was reviewed CAPABLE and cleared."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 100, base_price_cents: 10000, price_ceiling_cents: 12000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { tier_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              captures: { eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              captures: { eng_v1: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v1}" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
          trigger:
            - call: "POST /price-tiers/${tier_id}/ticket-sales"
              as: BoxOfficeManager
              payload: { qty: 1, channel: "WEB" }
              captures: { e_not_on_sale: "$.data.error_id" }
            - call: "POST /engagements/${engagement_id}/confirm"
              as: ProgrammingDirector
            - call: "POST /engagements/${engagement_id}/on-sale"
              as: BoxOfficeManager
            - call: "POST /price-tiers/${tier_id}/ticket-sales"
              as: BoxOfficeManager
              payload: { qty: 101, channel: "WEB" }
              captures: { e_sold_out: "$.data.error_id" }
            - call: "POST /price-tiers/${tier_id}/ticket-sales"
              as: BoxOfficeManager
              payload: { qty: 10, channel: "WEB" }
              captures: { sale_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-10-12T00:00:00Z" }
            - call: "POST /engagements/${engagement_id}/settlements"
              as: FinanceController
              captures: { settlement_id: "$.data.id" }
            - call: "POST /price-tiers/${tier_id}/ticket-sales"
              as: BoxOfficeManager
              payload: { qty: 1, channel: "WINDOW" }
              captures: { e_tier_closed: "$.data.error_id" }
            - call: "GET /price-tiers/${tier_id}"
              as: BoxOfficeManager
          assert:
            - "Sale while ticketing_status is 'TIERS_DRAFT' and the tier is ACTIVE: 409 ERR_TICKETING_NOT_ON_SALE - the tier-scoped check passes, so the engagement-scoped one is reached."
            - "After on-sale, a 101-ticket order against 100 available seats: 409 ERR_TIER_SOLD_OUT, and sold_qty stays 0."
            - "A 10-ticket order succeeds: 201 with unit_price_cents 10000 (dynamic pricing disabled, multiplier 1.00), so the ON_SALE path genuinely works."
            - "Opening the settlement sets engagement.ticketing_status 'CLOSED' and the tier's status 'CLOSED'."
            - "The post-settlement sale returns 409 ERR_TIER_CLOSED - NOT ERR_TICKETING_NOT_ON_SALE - even though both dimensions are closed and both codes sit at priority 40, matching the precedence pinned in §1.6."
            - "Final tier state: sold_qty 10, gross_cents 100000, available_qty 90, status 'CLOSED'."

      - name: duplicate_child_rows_and_out_of_state_repeats_return_state_specific_codes
        claim_type: error_triggerable
        grounds:
          - "§1.4 priority 75: at most one TechRider and at most one Settlement per engagement (ERR_DUPLICATE_TECH_RIDER | ERR_DUPLICATE_SETTLEMENT, 409)."
          - "§1.6 ERR_LABOR_CALL_INVALID_STATE (409): hours reported on a call that is not ESTIMATED."
          - "§1.6 ERR_SETTLEMENT_INVALID_STATE (409): finalize attempted on a settlement that is not EXPENSES_RECONCILED."
        distinguishing_aspect: >-
          Every refusal here is a REPEAT of a call that just succeeded, which is
          the failure mode a naive implementation is most likely to allow (a
          second rider row, a second settlement row, a second hours report that
          double-bills labor). Finalizing straight from DRAFT also proves the
          two-step settlement workflow cannot be short-circuited even by the role
          that owns both steps.
        test_recipe:
          setup:
            - "Grand Hall, client 'Meridian Dance Company' (credit A, outstanding 0) and UnionDepartment STAGEHANDS (roster 20, 5000/h, defaults) exist."
            - "A RENTAL engagement (load-in 2026-10-01T08:00Z, performance 2026-10-02T19:00Z-22:00Z, load-out 2026-10-03T02:00Z, 1 performance day, 1 load-in day) has facility_fee_cents 700000."
            - "One labor call (crew 2, Oct 1 08:00-12:00Z) is ESTIMATED at 40000, so labor_estimate_total_cents is 40000 and deposit_required_cents is ceil_100(round_half_up(0.25 * 740000)) = 185000."
            - "A rider (1000 kg / 200 A / 2 universes) has been submitted and the engagement is still DRAFT."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload: { department: "STAGEHANDS", roster_size: 20, straight_hourly_rate_cents: 5000 }
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Meridian Rental", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload: { union_department_id: "${dept_id}", crew_size: 2, call_start_utc: "2026-10-01T08:00:00Z", call_end_utc: "2026-10-01T12:00:00Z" }
              captures: { call_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload: { submitted_rigging_kg: 1200, requested_power_amps: 250, requested_dmx_universes: 3, requires_orchestra_pit: true }
              captures: { e_dup_rider: "$.data.error_id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
            - call: "POST /engagements/${engagement_id}/record-deposit"
              as: RentalManager
              payload: { amount_cents: 185000 }
              captures: { eng_v_pre_risk: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v_pre_risk}" }
            - call: "POST /engagements/${engagement_id}/confirm"
              as: RentalManager
            - call: "POST /labor-calls/${call_id}/report-hours"
              as: TechnicalDirector
              payload: { actual_hours: 4, meal_break_taken: true }
            - call: "POST /labor-calls/${call_id}/report-hours"
              as: TechnicalDirector
              payload: { actual_hours: 9, meal_break_taken: false }
              captures: { e_call_state: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-10-03T00:00:00Z" }
            - call: "POST /engagements/${engagement_id}/settlements"
              as: FinanceController
              captures: { settlement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/settlements"
              as: FinanceController
              captures: { e_dup_settlement: "$.data.error_id" }
            - call: "POST /settlements/${settlement_id}/finalize"
              as: FinanceController
              as_user_id: "user-fc-9"
              captures: { e_settlement_state: "$.data.error_id" }
            - call: "GET /engagements/${engagement_id}/tech-riders"
              as: RentalManager
              payload: { limit: 10, offset: 0 }
            - call: "GET /engagements/${engagement_id}/settlements"
              as: FinanceController
          assert:
            - "Second rider submission on the DRAFT engagement: 409 ERR_DUPLICATE_TECH_RIDER (priority 75), and the rider listing later reports meta.total_count == 1 with the ORIGINAL 1000 kg / 200 A / 2 universes values."
            - "Second hours report on a WORKED call: 409 ERR_LABOR_CALL_INVALID_STATE, and actual_cost_cents is still 40000 - the 9-hour, no-meal-break figures were not applied."
            - "Second settlement on the same engagement: 409 ERR_DUPLICATE_SETTLEMENT."
            - "finalize on a DRAFT settlement: 409 ERR_SETTLEMENT_INVALID_STATE - reconcile-expenses cannot be skipped; the settlement is still 'DRAFT' with finalized_by_user_id null."
            - "The engagement is still 'PERFORMED' (not 'SETTLED'), the labor call is still 'WORKED' (not 'RECONCILED') and no SETTLEMENT_CONTRIBUTION reserve entry exists."
            - "The X-User-ID on finalize is irrelevant here: a RENTAL engagement has fee_accepted_by_user_id null, so the priority-28 segregation check cannot fire and the 409 is unambiguous."
  # ===========================================================================
  # RBAC (§1.7) - guide Table 7, including the segregation_of_duties role model
  # ===========================================================================
  - section: rbac
    instances:

      - name: every_declared_role_may_read_the_engagement_it_participates_in
        claim_type: shared_operations
        grounds:
          - "§1.5 GET /engagements/{id} lists all eight roles: ProgrammingDirector, RentalManager, ArtistRepresentative, RentalClientContact, TechnicalDirector, BoxOfficeManager, FinanceController, CenterAdmin."
          - "§1.4 priority 25: entity_backed roles must present an X-User-ID equal to the owning foreign key (ArtistRepresentative -> engagement.artist_id, RentalClientContact -> engagement.rental_client_id)."
        distinguishing_aspect: >-
          The widest shared operation in the API is swept across all eight roles,
          and because the two entity_backed roles can only own one engagement type
          each, the sweep is split over a PRESENTED and a RENTAL booking. That
          split is itself the claim: an implementation that lets
          RentalClientContact read a presented engagement (or the reverse) has
          collapsed ownership into role membership.
        test_recipe:
          setup:
            - "Grand Hall, artist 'Cadence Quartet' and client 'Meridian Dance Company' exist."
            - "A DRAFT PRESENTED engagement (Sep 15 2026) and a DRAFT RENTAL engagement (Oct 2 2026) exist on the same hall."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-09-14T08:00:00Z", performance_start_utc: "2026-09-15T19:00:00Z", performance_end_utc: "2026-09-15T22:00:00Z", load_out_end_utc: "2026-09-16T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { presented_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Meridian Rental", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { rental_id: "$.data.id" }
          trigger:
            - call: "GET /engagements/${presented_id}"
              as: ProgrammingDirector
            - call: "GET /engagements/${presented_id}"
              as: RentalManager
            - call: "GET /engagements/${presented_id}"
              as: TechnicalDirector
            - call: "GET /engagements/${presented_id}"
              as: BoxOfficeManager
            - call: "GET /engagements/${presented_id}"
              as: FinanceController
            - call: "GET /engagements/${presented_id}"
              as: CenterAdmin
            - call: "GET /engagements/${presented_id}"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
            - call: "GET /engagements/${rental_id}"
              as: RentalClientContact
              as_user_id: "${client_id}"
          assert:
            - "The eight trigger calls cover all eight roles declared in §1.7, six of them on the presented booking plus the two entity_backed identities."
            - "All eight reads return 200 with the same id, title and three state dimensions - the read is genuinely shared, not owner-only."
            - "The ArtistRepresentative read succeeds only because X-User-ID equals engagement.artist_id, and the RentalClientContact read only because X-User-ID equals engagement.rental_client_id."
            - "No read mutates anything: both engagements report version 1 after the sweep."

      - name: box_office_manager_cannot_open_a_fee_negotiation
        claim_type: exclusive_operations
        grounds:
          - "§1.7 ProgrammingDirector holds POST /engagements/{id}/fee-negotiations as an exclusive operation; BoxOfficeManager holds POST /engagements/{id}/price-tiers."
          - "§1.4 priority 20 -> ERR_ROLE_NOT_PERMITTED (403)."
        distinguishing_aspect: >-
          A pair of exclusive operations is crossed in both directions on the same
          engagement, so the instance proves the role table is enforced per
          endpoint rather than as a general "staff may write" rule - and each role
          is then shown to succeed on its own operation, which rules out a blanket
          403.
        test_recipe:
          setup:
            - "Grand Hall, artist 'Cadence Quartet' (guarantee_floor_cents 200000) and a DRAFT PRESENTED engagement (performance 2026-10-11) exist."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: BoxOfficeManager
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { e_role: "$.data.error_id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: ProgrammingDirector
              payload: { tier_name: "ORCH", seats_allocated: 100, base_price_cents: 10000, price_ceiling_cents: 12000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { e_role_reverse: "$.data.error_id" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 100, base_price_cents: 10000, price_ceiling_cents: 12000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { tier_id: "$.data.id" }
          assert:
            - "BoxOfficeManager opening a negotiation: 403 ERR_ROLE_NOT_PERMITTED even though the payload and expected_engagement_version are entirely valid."
            - "ProgrammingDirector adding a price tier: 403 ERR_ROLE_NOT_PERMITTED - the exclusion runs both ways."
            - "Each role then succeeds on its own operation (201 and 201), and the engagement's version was NOT consumed by the rejected negotiation attempt: the successful round still accepts ${eng_v0}."
            - "The rejected tier attempt left ticketing_status at 'TICKETING_UNSET' until the BoxOfficeManager's tier advanced it to 'TIERS_DRAFT'."

      - name: request_with_missing_or_undeclared_auth_headers_is_unauthenticated
        claim_type: authentication
        grounds:
          - "§1.4 priority 10: X-User-Role and X-User-ID must be present and X-User-Role must be a role declared in §1.7 (ERR_MISSING_AUTH_HEADERS, 401)."
        distinguishing_aspect: >-
          Authentication is checked at the very top of the ladder, so this
          instance aims the unauthenticated request at an endpoint whose other
          preconditions would also fail (an unknown engagement id): the 401 must
          win over the 404, which is the only way to show priority 10 precedes
          priority 30.
        test_recipe:
          setup:
            - "One real DRAFT PRESENTED engagement exists so that a well-formed target is available; the id ffffffff-ffff-4fff-8fff-ffffffffffff matches nothing."
            - "The trigger calls are issued with a header set that violates priority 10: the first sends X-User-Role 'TicketScanner', which is not a role declared in §1.7; the second omits both X-User-Role and X-User-ID entirely."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
          trigger:
            - call: "GET /engagements/ffffffff-ffff-4fff-8fff-ffffffffffff"
              as: TicketScanner
              captures: { e_bad_role: "$.data.error_id" }
            - call: "GET /engagements/${engagement_id}"
              as: TicketScanner
              captures: { e_no_headers: "$.data.error_id" }
          assert:
            - "Undeclared role on a non-existent engagement: 401 ERR_MISSING_AUTH_HEADERS - NOT 404 ERR_ENGAGEMENT_NOT_FOUND, because priority 10 precedes priority 30."
            - "Request with both headers omitted against a REAL engagement: 401 ERR_MISSING_AUTH_HEADERS, so the check covers absence as well as an unknown value."
            - "Neither response leaks entity data: the body carries only the error envelope."

      - name: artist_representative_of_another_artist_is_forbidden
        claim_type: resource_ownership
        grounds:
          - "§1.7 ArtistRepresentative has identity entity_backed:Artist."
          - "§1.4 priority 25: X-User-ID must equal the owning foreign key of the target resource (ERR_NOT_RESOURCE_OWNER, 403)."
          - "§1.5 POST /engagements/{id}/tech-riders is open to ArtistRepresentative and RentalClientContact."
        distinguishing_aspect: >-
          The acting role is CORRECT for the endpoint and only the identity is
          wrong, so the 403 can only come from the ownership check - and the same
          request from the right representative then succeeds. Two artists on two
          engagements in the same hall keeps everything else identical.
        test_recipe:
          setup:
            - "Two artists exist: 'Cadence Quartet' and 'Tidewater Ensemble', each with a routing window covering 2026-09-01 to 2026-12-31."
            - "Grand Hall hosts one PRESENTED engagement per artist (Oct 2 and Oct 11 2026), neither with a rider yet."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_a: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Tidewater Ensemble", agency_name: "Harbor Artists", guarantee_floor_cents: 300000, historical_sell_through_pct: 0.6, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_b: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_a}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { eng_a: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_b}", title: "Tidewater Ensemble Concert", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { eng_b: "$.data.id" }
          trigger:
            - call: "POST /engagements/${eng_a}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_b}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { e_owner: "$.data.error_id" }
            - call: "POST /engagements/${eng_a}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_a}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_a: "$.data.id" }
            - call: "GET /engagements/${eng_a}/tech-riders"
              as: ProgrammingDirector
              payload: { limit: 10, offset: 0 }
          assert:
            - "Rider submitted by the wrong artist's representative: 403 ERR_NOT_RESOURCE_OWNER, not 403 ERR_ROLE_NOT_PERMITTED - the role is allowed on this endpoint, only the identity is wrong."
            - "The identical payload from the right representative: 201 with review_status 'SUBMITTED'."
            - "The rider listing reports meta.total_count == 1, so the forbidden attempt created nothing (and therefore did not consume the one-rider-per-engagement allowance)."

      - name: finance_controller_who_accepted_the_fee_cannot_finalize_the_settlement
        claim_type: segregation_of_duties
        grounds:
          - "§1.4 priority 28: the finalizing FinanceController's X-User-ID must differ from engagement.fee_accepted_by_user_id (ERR_SEGREGATION_OF_DUTIES, 403)."
          - "§1.2 FeeNegotiation COUNTERED -> ACCEPTED is available to ProgrammingDirector and writes engagement.fee_accepted_by_user_id."
          - "§1.4 priority 28 is evaluated before priority 40, so a duties conflict outranks any state objection."
        distinguishing_aspect: >-
          The same human acts twice: they accept the counter (as the deal-maker)
          and then attempt to sign off the money (as the controller). Because
          priority 28 sits above priority 40, the refusal must be
          ERR_SEGREGATION_OF_DUTIES on a settlement that is otherwise perfectly
          finalizable, and a second controller then completes it - which is the
          only way to show the block is about identity, not about state.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' (guarantee_floor_cents 200000, historical_sell_through_pct 0.8, routing 2026-09-01 -> 2026-12-31) exist."
            - "A PRESENTED engagement (performance 2026-10-11T19:00Z-22:00Z) has one ACTIVE tier ORCH 100 seats at 10000 with dynamic pricing disabled, so projected_gross_cents is 800000."
