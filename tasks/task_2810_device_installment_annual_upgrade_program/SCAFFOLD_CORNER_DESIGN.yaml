# =============================================================================
# PRD Benchmark §1.9 Scaffold Corner Design — Device Installment & Annual
# Upgrade Program. Breadth probe over §1.1-§1.7; depth lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections and claim_type values are taken
# from references/claim-extraction-guide.md.
# The logical clock starts at 2026-08-01T00:00:00Z on every fresh server.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_active_financing_posture_defaults
        claim_type: creation
        grounds:
          - endpoints.POST_/customers
          - entities.Customer.fields.status
          - entities.Customer.fields.default_strike_count
        distinguishing_aspect: |
          POST /customers with the three required inputs returns 201 and every computed
          posture field at its declared default in the SAME response body: status ACTIVE,
          financing_lock_reason null, credit_score_band null, credit_limit_cents 0,
          outstanding_principal_cents 0, open_loan_count 0, completed_upgrade_count 0,
          last_upgrade_completed_at null, default_strike_count 0, version 1.
        test_recipe:
          setup:
            - "Empty database at the startup clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Ada Nakamura", email: "ada.nakamura@example.com", mobile_number: "+15550100001" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
          assert:
            - "the call returns HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "Customer.${cust}.full_name == \"Ada Nakamura\" and email == \"ada.nakamura@example.com\" and mobile_number == \"+15550100001\""
            - "Customer.${cust}.status == ACTIVE and financing_lock_reason == null and financing_locked_at == null"
            - "Customer.${cust}.credit_score_band == null and credit_limit_cents == 0"
            - "Customer.${cust}.outstanding_principal_cents == 0 and open_loan_count == 0"
            - "Customer.${cust}.completed_upgrade_count == 0 and last_upgrade_completed_at == null"
            - "Customer.${cust}.default_strike_count == 0"
            - "Customer.${cust}.version == 1 and id, created_at, updated_at are all non-null"

      - name: get_customer_returns_the_stored_record_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_/customers/{id}
          - entities.Customer.fields.credit_limit_cents
        distinguishing_aspect: |
          GET /customers/{id} returns exactly the persisted row: after a PRIME decision the
          read shows credit_score_band PRIME and credit_limit_cents 250000 written by the
          decision cascade, with no re-derivation and no version bump from the read itself.
        test_recipe:
          setup:
            - "One customer with a PRIME-decided application on a 119900-cent model."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-A", display_name: "Handset A", retail_price_cents: 119900, monthly_protection_premium_cents: 1199, trade_in_base_credit_cents: 60000, generation_year: 2027 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Bo Ferreira", email: "bo.ferreira@example.com", mobile_number: "+15550100002" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_a}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
          trigger:
            - call: "GET /customers/${cust}"
              payload: {}
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
              captures: { band: "$.data.credit_score_band" }
          assert:
            - "the call returns HTTP 200 with response_type == \"object\""
            - "Customer.${cust}.credit_score_band == PRIME and credit_limit_cents == 250000"
            - "Customer.${cust}.status == ACTIVE and outstanding_principal_cents == 0 and open_loan_count == 0"
            - "Customer.${cust}.version == 1 (a GET never bumps version)"
            - "CreditApplication.${app}.status == APPROVED with exposure_at_decision_cents == 119900 and decision_reason == \"WITHIN_LIMIT\""

      - name: list_device_models_pagination_envelope_and_filter
        claim_type: listing
        grounds:
          - endpoints.GET_/device-models
          - entities.DeviceModel.fields.active
        distinguishing_aspect: |
          GET /device-models returns the four pagination fields with the declared defaults
          (limit 10, offset 0) and exact counts: total_count 3 / has_more false unfiltered,
          two items and has_more true at limit=2, one item and has_more false at
          limit=2&offset=2, total_count 2 under active=true, and limit=101 is refused with
          ERR_INVALID_REQUEST rather than clamped.
        test_recipe:
          setup:
            - "Three catalog models, one of them retired (active false)."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-A", display_name: "Handset A", retail_price_cents: 119900, monthly_protection_premium_cents: 1199, trade_in_base_credit_cents: 60000, generation_year: 2027 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /device-models"
              payload: { sku: "MDL-C", display_name: "Handset C", retail_price_cents: 59900, monthly_protection_premium_cents: 799, trade_in_base_credit_cents: 20000, generation_year: 2025, active: false }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_c: "$.data.id" }
          trigger:
            - call: "GET /device-models"
              payload: {}
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /device-models"
              payload: { limit: 2, offset: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "GET /device-models"
              payload: { limit: 2, offset: 2 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "GET /device-models"
              payload: { active: true }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "GET /device-models"
              payload: { limit: 101 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { err_limit: "$.data.error_id" }
          assert:
            - "the unfiltered call returns HTTP 200 with response_type == \"array\", limit == 10, offset == 0, total_count == 3, has_more == false and 3 items"
            - "the limit=2&offset=0 call returns 2 items with limit == 2, offset == 0, total_count == 3, has_more == true"
            - "the limit=2&offset=2 call returns 1 item with total_count == 3 and has_more == false"
            - "the active=true call returns total_count == 2 and neither item is ${m_c}"
            - "DeviceModel.${m_c}.active == false and concurrent_reservation_capacity == 2 and reserved_slot_count == 0"
            - "the limit=101 call returns HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: unknown_path_ids_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations.priority_20_ERR_CUSTOMER_NOT_FOUND
          - validations.priority_21_ERR_DEVICE_MODEL_NOT_FOUND
          - validations.priority_22_ERR_CREDIT_APPLICATION_NOT_FOUND
          - validations.priority_23_ERR_LOAN_NOT_FOUND
          - validations.priority_24_ERR_DEVICE_UNIT_NOT_FOUND
          - validations.priority_25_ERR_UPGRADE_REQUEST_NOT_FOUND
          - validations.priority_26_ERR_TRADE_IN_NOT_FOUND
          - validations.priority_27_ERR_PAYMENT_POSTING_NOT_FOUND
        distinguishing_aspect: |
          Each addressed collection returns its OWN 404 error_id for a well-formed but
          unknown path id — eight distinct codes, never a generic ERR_INVALID_REQUEST and
          never a shared ERR_NOT_FOUND — on an empty database where no row of any type
          exists.
        test_recipe:
          setup:
            - "Empty database; no entity of any type has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /customers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_cust: "$.data.error_id" }
            - call: "GET /device-models/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_model: "$.data.error_id" }
            - call: "GET /credit-applications/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_app: "$.data.error_id" }
            - call: "GET /loans/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_loan: "$.data.error_id" }
            - call: "GET /device-units/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_dev: "$.data.error_id" }
            - call: "GET /upgrade-requests/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_ur: "$.data.error_id" }
            - call: "GET /trade-ins/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_ti: "$.data.error_id" }
            - call: "GET /payment-postings/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e_post: "$.data.error_id" }
          assert:
            - "every one of the eight calls returns HTTP 404 with response_type == \"error\" and a non-empty message"
            - "the /customers call returns error_id ERR_CUSTOMER_NOT_FOUND"
            - "the /device-models call returns error_id ERR_DEVICE_MODEL_NOT_FOUND"
            - "the /credit-applications call returns error_id ERR_CREDIT_APPLICATION_NOT_FOUND"
            - "the /loans call returns error_id ERR_LOAN_NOT_FOUND"
            - "the /device-units call returns error_id ERR_DEVICE_UNIT_NOT_FOUND"
            - "the /upgrade-requests call returns error_id ERR_UPGRADE_REQUEST_NOT_FOUND"
            - "the /trade-ins call returns error_id ERR_TRADE_IN_NOT_FOUND"
            - "the /payment-postings call returns error_id ERR_PAYMENT_POSTING_NOT_FOUND"

      - name: missing_required_input_fields_return_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_10_ERR_INVALID_REQUEST
          - endpoints.POST_/customers
          - endpoints.POST_/device-models
          - endpoints.POST_/credit-applications
        distinguishing_aspect: |
          Priority 10 fires on the absence of any input field the endpoint declares without a
          default — email on POST /customers, retail_price_cents on POST /device-models,
          requested_term_months on POST /credit-applications — with HTTP 400
          ERR_INVALID_REQUEST, and it fires BEFORE the referential checks at priorities
          30-31 even though the body carries otherwise valid ids.
        test_recipe:
          setup:
            - "One catalog model and one customer exist so the referential checks would pass."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Cyd Oyelaran", email: "cyd.oyelaran@example.com", mobile_number: "+15550100003" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "No Email", mobile_number: "+15550100004" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { e1: "$.data.error_id" }
            - call: "POST /device-models"
              payload: { sku: "MDL-X", display_name: "Handset X", monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { e2: "$.data.error_id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { e3: "$.data.error_id" }
          assert:
            - "all three calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /customers/${cust} still returns the only customer and no second Customer row was created"
            - "GET /device-models returns total_count == 1 (the MDL-X attempt persisted nothing)"
            - "GET /credit-applications?customer_id=${cust} returns total_count == 0"

      - name: omitted_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DeviceModel.fields.concurrent_reservation_capacity
          - entities.CarrierAccount.fields.unlock_policy_days
          - entities.CarrierAccount.fields.port_freeze_flag
          - entities.CreditApplication.fields.declared_down_payment_cents
        distinguishing_aspect: |
          Every optional input falls back to the value §1.1 declares, not to null or zero by
          accident: concurrent_reservation_capacity 2 and active true on DeviceModel,
          unlock_policy_days 60 and port_freeze_flag false on CarrierAccount, and
          declared_down_payment_cents 0 on CreditApplication — which makes
          requested_principal_cents equal the full 89900 retail price.
        test_recipe:
          setup:
            - "Empty database at the startup clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Dae Villanueva", email: "dae.villanueva@example.com", mobile_number: "+15550100005" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /customers/${cust}/carrier-accounts"
              payload: { carrier_code: "VERIZON", account_number: "ACC-2810-0005" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { carr: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
          assert:
            - "DeviceModel.${m_b}.concurrent_reservation_capacity == 2 and active == true and reserved_slot_count == 0"
            - "CarrierAccount.${carr}.unlock_policy_days == 60 and port_freeze_flag == false"
            - "CarrierAccount.${carr}.activation_state == PENDING, activated_at == null, active_device_imei == null"
            - "CarrierAccount.${carr}.customer_id == ${cust} and carrier_code == VERIZON"
            - "CreditApplication.${app}.declared_down_payment_cents == 0"
            - "CreditApplication.${app}.requested_principal_cents == 89900 and status == SUBMITTED"
            - "CreditApplication.${app}.credit_score_band == null, credit_limit_cents == 0, approved_principal_cents == 0, conditional_down_payment_required_cents == 0, underwriter_user_id == null, decided_at == null"

      - name: loan_computed_fields_derive_from_model_and_down_payment
        claim_type: computed_fields
        grounds:
          - entities.InstallmentLoan.fields.principal_cents
          - entities.InstallmentLoan.fields.premium_total_cents
          - entities.InstallmentLoan.fields.monthly_installment_cents
          - entities.CreditApplication.fields.requested_principal_cents
          - calculations.installment_schedule_generation
        distinguishing_aspect: |
          On a 119900-cent model with a 20000-cent down payment every computed money field is
          derived, never echoed from input: requested_principal_cents 99900,
          principal_cents 99900, monthly_protection_premium_cents 1199 (snapshotted from the
          model), premium_total_cents 28776, monthly_installment_cents 5362
          (round_half_up(99900/24) == 4163 plus 1199) and obligation_balance_cents 128676.
        test_recipe:
          setup:
            - "PRIME customer, Handset A model at 119900 with a 1199 premium, application declaring a 20000 down payment, originated with the same 20000 at point of sale."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-A", display_name: "Handset A", retail_price_cents: 119900, monthly_protection_premium_cents: 1199, trade_in_base_credit_cents: 60000, generation_year: 2027 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Eve Brannigan", email: "eve.brannigan@example.com", mobile_number: "+15550100006" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_a}", requested_term_months: 24, declared_down_payment_cents: 20000 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
          trigger:
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 20000, imei: "356938035643001" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
          assert:
            - "the call returns HTTP 201"
            - "CreditApplication.${app}.requested_principal_cents == 99900 and approved_principal_cents == 99900"
            - "InstallmentLoan.${loan}.principal_cents == 99900 and down_payment_cents == 20000 and rolled_over_balance_cents == 0 and origination_fee_cents == 0"
            - "InstallmentLoan.${loan}.term_months == 24 and monthly_protection_premium_cents == 1199 and premium_total_cents == 28776"
            - "InstallmentLoan.${loan}.monthly_installment_cents == 5362"
            - "InstallmentLoan.${loan}.obligation_balance_cents == 128676"
            - "InstallmentLoan.${loan}.predecessor_loan_id == null and closure_reason == null"
            - "GET /loans/${loan}/installments returns total_count == 24"
            - "Installment(loan_id=${loan}, installment_number=1).principal_component_cents == 4163, premium_component_cents == 1199, amount_due_cents == 5362, due_date == 2026-09-01T00:00:00Z"
            - "Installment(loan_id=${loan}, installment_number=24).principal_component_cents == 4151, amount_due_cents == 5350, due_date == 2028-08-01T00:00:00Z"
            - "Customer.${cust}.outstanding_principal_cents == 99900 and open_loan_count == 1"
            - "CreditApplication.${app}.status == ORIGINATED"

      - name: system_fields_are_server_stamped_at_origination_and_posting
        claim_type: system_fields
        grounds:
          - entities.InstallmentLoan.fields.origination_date
          - entities.InstallmentLoan.fields.upgrade_window_opens_at
          - entities.PaymentPosting.fields.posted_at
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          origination_date, upgrade_window_opens_at and posted_at are stamped from the
          LOGICAL clock, not from wall time and not from any input field: a loan minted at
          2026-08-01 carries origination_date 2026-08-01T00:00:00Z and
          upgrade_window_opens_at 2027-06-27T00:00:00Z (+330 days), and a posting made after
          the clock moves to 2026-09-15 carries posted_at 2026-09-15T00:00:00Z.
        test_recipe:
          setup:
            - "Handset B loan originated at the startup clock 2026-08-01, then the clock advanced to 2026-09-15 before a single payment is posted."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Finn Okorie", email: "finn.okorie@example.com", mobile_number: "+15550100007" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643002" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 4745 }
              as: Customer
              as_user_id: "${cust}"
              captures: { p1: "$.data.id" }
          assert:
            - "InstallmentLoan.${loan}.origination_date == 2026-08-01T00:00:00Z"
            - "InstallmentLoan.${loan}.upgrade_window_opens_at == 2027-06-27T00:00:00Z"
            - "InstallmentLoan.${loan}.version == 1 immediately after origination"
            - "the loan's DeviceUnit was created by the system: GET /device-units?loan_id=${loan} returns total_count == 1 with imei == \"356938035643002\", activation_status UNACTIVATED, unlock_status LOCKED, possession_status WITH_CUSTOMER, carrier_account_id null"
            - "PaymentPosting.${p1}.posted_at == 2026-09-15T00:00:00Z"
            - "PaymentPosting.${p1}.loan_id == ${loan} and reverses_posting_id == null"
            - "InstallmentLoan.${loan}.version == 2 after the posting"

      - name: invalid_enum_and_out_of_range_inputs_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_10_ERR_INVALID_REQUEST
