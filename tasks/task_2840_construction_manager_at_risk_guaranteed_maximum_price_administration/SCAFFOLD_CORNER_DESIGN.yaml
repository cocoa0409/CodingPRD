            - "trigger call 2 returns 201 with data.status == SEALED and bidder_type == CM_SELF_PERFORM"
            - "WorkPackage.${wp}.bid_count == 1 after trigger call 2"

      - name: allowance_overrun_requires_explicit_authorization_only_when_the_rate_is_exceeded
        claim_type: conditional_validation
        grounds:
          - validations.priority_112
          - calculations.allowance_unit_conservation
        distinguishing_aspect: |
          overrun_authorized is required CONDITIONALLY - only when actual_unit_cost strictly
          exceeds the allowance unit rate. At or below the rate the flag may be omitted, so the
          same endpoint accepts a payload without the flag and rejects an otherwise identical
          one whose unit cost is a ten-thousandth higher.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /qualification-items"
              payload: { gmp_proposal_id: "${prop}", item_type: "ALLOWANCE", text: "hard rock excavation allowance", allowance_amount: 90000.00, allocated_units: 1500, unit_of_measure: "CY" }
              as: ConstructionManager
              captures: { qi: $.data.id }
          trigger:
            - call: "POST /qualification-items/${qi}/allowance-reconciliation"
              payload: { action: "RECONCILE", units: 100, actual_unit_cost: 60.0000 }
              as: ConstructionManager
            - call: "POST /qualification-items/${qi}/allowance-reconciliation"
              payload: { action: "RECONCILE", units: 100, actual_unit_cost: 60.0001 }
              as: ConstructionManager
              captures: { e2: $.data.error_id }
            - call: "POST /qualification-items/${qi}/allowance-reconciliation"
              payload: { action: "RECONCILE", units: 100, actual_unit_cost: 60.0001, overrun_authorized: true }
              as: ConstructionManager
          assert:
            - "trigger call 1 returns 200 with reconciled_amount == 6000.00 and variance_amount == 0.00: at exactly the 60.0000 rate no authorization is needed"
            - "trigger call 2 returns 422 with data.error_id == ERR_ALLOWANCE_OVERRUN_UNAUTHORIZED, because 60.0001 strictly exceeds the rate and the flag was omitted"
            - "after trigger call 2 QualificationItem.${qi}.reconciled_units is still 100 and reconciliation_seq is still 1"
            - "trigger call 3 returns 200 with reconciled_units == 200, reconciled_amount == 12000.01 (6000.00 plus round(100 * 60.0001, 2) == 6000.01) and reconciliation_seq == 2"
            - "QualificationItem.${qi}.variance_amount == 0.01 (12000.01 booked less the 12000.00 expected at the allowance rate) and status == PARTIALLY_RECONCILED"

      - name: declared_prior_estimate_of_an_equal_or_later_milestone_is_rejected
        claim_type: cascading_validation
        grounds:
          - validations.priority_92
          - calculations.estimate_milestone_variance
          - global_constants.MILESTONE_RANK
        distinguishing_aspect: |
          A declared prior_estimate_id must clear THREE stacked checks in order: the row must
          exist (priority 52), it must belong to the same project (priority 90), and only then is
          its milestone_rank compared (priority 92). The rank comparison is strict, so declaring
          a same-milestone predecessor is refused even though such a row is a perfectly valid
          estimate.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "DD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { dd: $.data.id }
            - call: "POST /estimates/${dd}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${dd}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 950000.00, prior_estimate_id: "${dd}", expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { e1: $.data.error_id }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "DD", submitted_cost_of_work: 1050000.00, prior_estimate_id: "${dd}", expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { e2: $.data.error_id }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_50", submitted_cost_of_work: 1050000.00, prior_estimate_id: "${dd}", expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { cd: $.data.id }
          assert:
            - "trigger call 1 returns 422 with data.error_id == ERR_MILESTONE_RANK_REGRESSION: SD has rank 1 and the declared prior DD has rank 2"
            - "trigger call 2 returns 422 with data.error_id == ERR_MILESTONE_RANK_REGRESSION: equal ranks are also refused, the comparison is strictly lower"
            - "neither rejected call bumped CmarProject.${proj}.version, so the same ${pv2} token is still current for trigger call 3"
            - "trigger call 3 returns 201 with milestone_rank == 3, variance_basis == DECLARED_PRIOR, variance_basis_estimate_id == ${dd} and variance_pct == 0.0500 (round(50000.00 / 1000000.00, 4))"
            - "the DD estimate is untouched by the two rejections: ProgressiveEstimate.${dd}.status is still RECONCILED and superseded_by_estimate_id is null"

      - name: draw_state_check_outranks_the_contingency_balance_check
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: draw_state_invalid_priority_69_outranks_contingency_insufficient_priority_121
          rationale: |
            The §1.8 instance builds a draw that violates BOTH the state rule at priority 69 and
            the pot-balance rule at priority 121 and pins the reported code to the lower
            priority number, then peels one violation away at a time to show each rule can fire
            on its own.

      - name: subcontract_write_validated_against_sibling_bid_state
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: subcontract_creation_requires_the_named_bid_to_be_the_awarded_one
          rationale: |
            The cross-entity validation is that a subcontract's awarded_bid_id must name a bid
            that is already AWARDED on the same package - a rule whose inputs live in three
            entities. The §1.8 instance walks the losing-bid, wrong-package and
            not-yet-awarded variants against ERR_BID_STATE_INVALID and
            ERR_WORK_PACKAGE_PROJECT_MISMATCH.

