              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 30000, effective_from: "2026-01-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R1", effective_at: "2026-09-01T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v0}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/advance_day"
              payload: { days: 1 }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-CAP", property_address: "1 Cap Ct", list_price_cents: 30000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/citations"
              payload: { member_id: "${mb_id}", rule_code: "INACCURACY", listing_id: "${listing_id}" }
              as: AssociationStaff
              captures: { cit_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/citations/${cit_id}/pay"
              payload: { tender_cents: 30000 }
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/members/${mb_id}/credit-adjustments"
              payload: { amount_cents: 150000, note: "seed to 180000" }
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${assoc_id}/citations/${cit_id}/donate-credit"
              payload: { amount_cents: 20000 }
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/citations/${cit_id}/donate-credit"
              payload: { amount_cents: 1 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { cap_err: $.data.error_id }
            - call: "GET /mls/associations/${assoc_id}/members/${mb_id}"
              payload: {}
              as: AssociationStaff
          assert:
            - "First donate succeeds: balance lands exactly AT the cap (200000) — boundary inclusive"
            - "Second donate of 1c rejected error_id == ERR_CREDIT_CAP_EXCEEDED"
            - "Member.${mb_id}.sanction_credit_balance_cents == 200000 after both attempts (no partial application of the rejected donation)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_activation_gated_by_member_membership_state
        grounds:
          - state_machines.Listing.DRAFT_to_ACTIVE
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - errors[ERR_MEMBER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Listing -> Member: the listing's DRAFT->ACTIVE transition
          reads listing_member.membership_state AND mls_access_state at
          transition time; a dues suspension flips the member and immediately
          gates the listing — the listing itself is untouched by the dues
          workflow yet its valid next-state set shrinks.
        test_recipe:
          setup:
            - "Association A; broker MB2; agent MA (non-broker member); office O brokered by MB2; DRAFT listing L owned by MA"
            - "DuesPeriod P billed; MA's invoice PENDING; clock past grace; reconcile suspends MA only (MB2 paid)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "XS1", name: "Cross Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB2", full_name: "Broker Two" }
              as: AssociationStaff
              captures: { mb2_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MA", full_name: "Agent" }
              as: AssociationStaff
              captures: { ma_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb2_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${ma_id}", mls_number: "MLS-XS1", property_address: "2 Gate Rd", list_price_cents: 21000000 }
              as: Member
              as_user_id: "${ma_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/dues-periods"
              payload: { year: 2026, period_start_date: "2026-09-01T00:00:00Z", due_date: "2026-09-10T00:00:00Z", grace_end_date: "2026-09-20T00:00:00Z", amount_cents: 120000 }
              as: AssociationStaff
              captures: { period_id: $.data.id, period_version: $.data.version }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/dues-periods/${period_id}/bill"
              payload: { expected_dues_period_version: "${period_version}" }
              as: AssociationStaff
            - call: "GET /mls/dues-invoices?dues_period_id=${period_id}&member_id=${mb2_id}"
              payload: {}
              as: AssociationStaff
              captures: { mb2_invoice: "$.data[0].id" }
            - call: "POST /mls/associations/${assoc_id}/dues-invoices/${mb2_invoice}/pay"
              payload: { tender_cents: 120000 }
              as: Member
              as_user_id: "${mb2_id}"
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/dues-periods/${period_id}/reconcile"
              payload: {}
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${ma_id}"
              captures: { err: $.data.error_id }
          assert:
            - "activate rejected error_id == ERR_MEMBER_SUSPENDED"
            - "Member.${ma_id}.membership_state == SUSPENDED while Office.${office_id}.status == ACTIVE (non-broker suspension does NOT suspend office — dependency is member-scoped)"
            - "Listing.${listing_id}.status == DRAFT"
      - name: arbitration_filing_gated_by_listing_sold_state
        grounds:
          - state_machines.ArbitrationCase.transitions
          - state_machines.Listing.PENDING_to_SOLD
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair ArbitrationCase -> Listing (different pair from instance 1):
          an arbitration case may only be filed against a listing whose status is
          SOLD; filing against an ACTIVE listing is rejected with
          ERR_INVALID_STATE even though both members and the association are in
          perfect standing — the case's legal entry state depends on the linked
          listing's lifecycle.
        test_recipe:
          setup:
            - "Association A; broker MB; agent ML; respondent MR; office O; COMP_DISPLAY_ON revision active; listing L ACTIVE (never SOLD)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "XS2", name: "Cross Two", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
