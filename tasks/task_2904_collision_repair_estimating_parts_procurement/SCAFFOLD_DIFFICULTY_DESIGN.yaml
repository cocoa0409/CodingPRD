            - "RepairOrder.${ro_b_id}.pre_tax_total_cents == 53040, insurer_authorized_cents == 3040, customer_pay_cents == 50000, authorization_posture == CONSENT_REQUIRED"
            - "a POST /repair-orders/${ro_a_id}/stage-advance with to_stage = PARTS_STAGED succeeds while the same call on ${ro_b_id} is refused ERR_AUTHORIZATION_POSTURE_BLOCKED (409)"

      - name: vendor_score_floor_is_inclusive_at_exactly_40_on_order
        grounds:
          - validations.priority_88
          - calculations.vendor_fulfillment_score
          - entities.PartsVendor.fields.fulfillment_score_rolling
          - errors.ERR_VENDOR_SCORE_BELOW_FLOOR
        distinguishing_aspect: |
          A different metric on a different endpoint: fulfillment_score_rolling against
          VENDOR_SCORE_FLOOR on POST /parts-lines/{id}/order. A vendor sitting on exactly 40 must still
          be orderable (the gate is >=); once a late-and-returned line drags the rolling window to 32
          the next order is refused, even though the LIFETIME score is a comfortable 47.
        test_recipe:
          setup:
            - "The four-closed-line vendor of refinish/vendor instance one: fulfillment_score_rolling exactly 40, fulfillment_score_lifetime 55."
            - "A fifth OEM line at 10000 qty 1 on the same locked order, quoted and price-locked, ordered with promised_eta 2026-08-15."
            - "The clock then moves to 2026-08-20, the fifth line is received CORRECT (late, so on_time false) and fully returned with reason UNUSED (restocking fee 2000)."
