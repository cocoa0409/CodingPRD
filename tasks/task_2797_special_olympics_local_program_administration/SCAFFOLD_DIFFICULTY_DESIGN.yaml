# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: special-olympics-local-program  (task_2797)
# 9 rule_ids / 19 instances. Every instance is reachable from an empty DB
# using only endpoints declared in SCAFFOLD.yaml §1.5.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: entry_performance_ratio_direction_variants
        grounds:
          - calculations.entry_performance_ratio
          - entities.CompetitionEntry.fields.performance_ratio
          - entities.SportSeason.fields.sport
          - state_machines.CompetitionEntry.LOCKED_to_RESULTED
        distinguishing_aspect: |
          Two identical (skill_score 40.0, result_value 44.0) pairs produce 0.9091 in an ATHLETICS
          season and 1.1000 in a BOCCE season, because the ratio's numerator and denominator swap on
          season.sport; this variant pair lives on the CompetitionEntry / SportSeason domain, not on
          the money domain used by the other dual-variant instance.
        test_recipe:
          setup:
            - "Program with one CERTIFIED coach credential so posture is OPEN"
            - "Three ACTIVE, medically CLEARED athletes all aged 22-29 at the competition date"
            - "Two seasons of the same program - ATHLETICS and BOCCE - both PRACTICE_OPEN with zero practice minimums"
            - "Three entries per season so each division reaches DIVISION_MIN_ENTRIES and can be locked"
            - "Clock advanced past registration_deadline to divide and lock, then to competition_date to post results"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Dana Ruiz", email: "dana@rb.example", date_of_birth: "1988-04-12", volunteer_class: "COACH" }
              as: ProgramManager
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/credentials"
              payload: { role_class: "COACH" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred: $.data.id }
            - call: "POST /credentials/${cred}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1001" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
            - call: "POST /credentials/${cred}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath1: $.data.id }
            - call: "POST /athletes/${ath1}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { form1: $.data.id }
            - call: "POST /medical-forms/${form1}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Ivan Petrov", birth_date: "2003-10-01", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath2: $.data.id }
            - call: "POST /athletes/${ath2}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { form2: $.data.id }
            - call: "POST /medical-forms/${form2}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Grace Lin", birth_date: "1998-05-20", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath3: $.data.id }
            - call: "POST /athletes/${ath3}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { form3: $.data.id }
            - call: "POST /medical-forms/${form3}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /programs/${prog}/seasons"
              payload: { sport: "ATHLETICS", season_name: "Fall 2026 Athletics", practice_minimum_sessions: 0, practice_minimum_minutes: 0, registration_deadline: "2026-09-01", divisioning_date: "2026-09-05", competition_date: "2026-09-20", games_level: "LOCAL", entry_slot_budget: 40, advancement_slots_per_division: 2 }
              as: CompetitionDirector
              captures: { s_ath: $.data.id }
            - call: "POST /seasons/${s_ath}/open-practice"
              payload: {}
              as: CompetitionDirector
            - call: "POST /programs/${prog}/seasons"
              payload: { sport: "BOCCE", season_name: "Fall 2026 Bocce", practice_minimum_sessions: 0, practice_minimum_minutes: 0, registration_deadline: "2026-09-01", divisioning_date: "2026-09-05", competition_date: "2026-09-20", games_level: "LOCAL", entry_slot_budget: 40, advancement_slots_per_division: 2 }
              as: CompetitionDirector
              captures: { s_boc: $.data.id }
            - call: "POST /seasons/${s_boc}/open-practice"
              payload: {}
              as: CompetitionDirector
            - call: "POST /competition-entries"
              payload: { season_id: "${s_ath}", participant_type: "ATHLETE", participant_id: "${ath1}", event_code: "100M_DASH", skill_score: 40.0 }
              as: CompetitionDirector
              captures: { e_ath1: $.data.id }
            - call: "POST /competition-entries"
              payload: { season_id: "${s_ath}", participant_type: "ATHLETE", participant_id: "${ath2}", event_code: "100M_DASH", skill_score: 39.0 }
              as: CompetitionDirector
            - call: "POST /competition-entries"
              payload: { season_id: "${s_ath}", participant_type: "ATHLETE", participant_id: "${ath3}", event_code: "100M_DASH", skill_score: 38.0 }
              as: CompetitionDirector
            - call: "POST /competition-entries"
              payload: { season_id: "${s_boc}", participant_type: "ATHLETE", participant_id: "${ath1}", event_code: "BOCCE_SINGLES", skill_score: 40.0 }
              as: CompetitionDirector
              captures: { e_boc1: $.data.id }
            - call: "POST /competition-entries"
              payload: { season_id: "${s_boc}", participant_type: "ATHLETE", participant_id: "${ath2}", event_code: "BOCCE_SINGLES", skill_score: 39.0 }
              as: CompetitionDirector
            - call: "POST /competition-entries"
              payload: { season_id: "${s_boc}", participant_type: "ATHLETE", participant_id: "${ath3}", event_code: "BOCCE_SINGLES", skill_score: 38.0 }
              as: CompetitionDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: CompetitionDirector
            - call: "POST /seasons/${s_ath}/divisioning"
              payload: {}
              as: CompetitionDirector
            - call: "POST /seasons/${s_boc}/divisioning"
              payload: {}
              as: CompetitionDirector
            - call: "POST /seasons/${s_ath}/lock-entries"
              payload: {}
              as: CompetitionDirector
            - call: "POST /seasons/${s_boc}/lock-entries"
              payload: {}
              as: CompetitionDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T09:00:00Z" }
              as: CompetitionDirector
          trigger:
            - call: "POST /competition-entries/${e_ath1}/result"
              payload: { result_value: 44.0 }
              as: CompetitionDirector
            - call: "POST /competition-entries/${e_boc1}/result"
              payload: { result_value: 44.0 }
              as: CompetitionDirector
          assert:
            - "CompetitionEntry.${e_ath1}.performance_ratio == 0.9091"
            - "CompetitionEntry.${e_boc1}.performance_ratio == 1.1000"
            - "CompetitionEntry.${e_ath1}.skill_score == 40.0 and CompetitionEntry.${e_boc1}.skill_score == 40.0"
            - "CompetitionEntry.${e_ath1}.result_value == 44.0 and CompetitionEntry.${e_boc1}.result_value == 44.0"
            - "CompetitionEntry.${e_ath1}.advancement_status == ADVANCED_STATE"
            - "CompetitionEntry.${e_boc1}.advancement_status == ADVANCED_STATE"
            - "CompetitionEntry.${e_ath1}.status == ADVANCED and CompetitionEntry.${e_boc1}.status == ADVANCED"

      - name: contribution_in_kind_recognition_variants
        grounds:
          - calculations.contribution_recognized_value
          - entities.Contribution.fields.recognized_value_cents
          - entities.Contribution.fields.contribution_type
          - entities.Program.fields.recognized_support_cents
        distinguishing_aspect: |
          The same stated_value_cents 600000 recognises 500000 as IN_KIND_GOODS (hard cap) but 480000 as
          IN_KIND_SERVICES (20 percent discount, no cap) - a cap-versus-rate divergence on the
          Contribution / Program money domain, structurally unrelated to the sport-direction ratio
          divergence of the other dual-variant instance.
        test_recipe:
          setup:
            - "A single program with an empty support ledger; no athletes or seasons are needed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Halbrook Hardware", contribution_type: "IN_KIND_GOODS", designation: "GENERAL", stated_value_cents: 600000, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c_goods: $.data.id }
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Halbrook Legal", contribution_type: "IN_KIND_SERVICES", designation: "GENERAL", stated_value_cents: 600000, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c_srv: $.data.id }
          assert:
            - "Contribution.${c_goods}.recognized_value_cents == 500000"
            - "Contribution.${c_srv}.recognized_value_cents == 480000"
            - "Contribution.${c_goods}.stated_value_cents == 600000 and Contribution.${c_srv}.stated_value_cents == 600000"
            - "Contribution.${c_goods}.status == RECEIVED and Contribution.${c_srv}.status == RECEIVED"
            - "Program.${prog}.recognized_support_cents == 980000"
            - "Program.${prog}.pledged_support_cents == 0"
            - "Program.${prog}.family_engagement_credit_cents == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: credential_effective_expiry_role_min
        grounds:
          - calculations.credential_effective_expiry
          - entities.Credential.fields.expires_on
          - entities.Credential.fields.screening_result
          - entities.Credential.fields.role_class
          - state_machines.Credential.READY_TO_CERTIFY_to_CERTIFIED
        distinguishing_aspect: |
          Mode (a): a nested min() over three inputs - screening_completed_on + 1095,
          training_completed_on + TRAINING_VALIDITY_DAYS_BY_ROLE[role_class], and (only when
          screening_result is FLAGGED) certified_at + 365 - where the role_class branch and the FLAGGED
          branch each change which term wins from the SAME pair of completion dates.
        test_recipe:
          setup:
            - "One program with three volunteers: a coach, and two unified partners"
            - "Three credentials, all with screening completed 2026-07-01 and training completed 2026-07-05"
            - "The third credential's screening result is FLAGGED so the review-window term enters the min()"
            - "Clock left at the default 2026-08-01T00:00:00Z so certified_at is that instant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CredentialingOfficer
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Dana Ruiz", email: "dana@rb.example", date_of_birth: "1988-04-12", volunteer_class: "COACH" }
              as: CredentialingOfficer
              captures: { vol_a: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Noah Byrd", email: "noah@rb.example", date_of_birth: "1990-06-15", volunteer_class: "UNIFIED_PARTNER" }
              as: CredentialingOfficer
              captures: { vol_b: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Priya Shah", email: "priya@rb.example", date_of_birth: "1991-02-03", volunteer_class: "UNIFIED_PARTNER" }
              as: CredentialingOfficer
              captures: { vol_c: $.data.id }
            - call: "POST /volunteers/${vol_a}/credentials"
              payload: { role_class: "COACH" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred_a: $.data.id }
            - call: "POST /credentials/${cred_a}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1001" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred_a}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
            - call: "POST /volunteers/${vol_b}/credentials"
              payload: { role_class: "UNIFIED_PARTNER" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred_b: $.data.id }
            - call: "POST /credentials/${cred_b}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1002" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred_b}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
            - call: "POST /volunteers/${vol_c}/credentials"
              payload: { role_class: "UNIFIED_PARTNER" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred_c: $.data.id }
            - call: "POST /credentials/${cred_c}/screening"
              payload: { completed_on: "2026-07-01", result: "FLAGGED", vendor_reference: "BGS-1003" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred_c}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /credentials/${cred_a}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /credentials/${cred_b}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /credentials/${cred_c}/certify"
              payload: { flag_override_reason: "Non-disqualifying municipal citation reviewed by the safety committee" }
              as: CredentialingOfficer
              as_user_id: "officer-3"
          assert:
            - "Credential.${cred_a}.screening_expires_on == 2029-06-30 and Credential.${cred_a}.training_expires_on == 2027-07-05"
            - "Credential.${cred_a}.expires_on == 2027-07-05"
            - "Credential.${cred_b}.training_expires_on == 2028-07-04"
            - "Credential.${cred_b}.expires_on == 2028-07-04"
            - "Credential.${cred_c}.training_expires_on == 2028-07-04"
            - "Credential.${cred_c}.expires_on == 2027-08-01"
            - "Credential.${cred_a}.status == CERTIFIED and Credential.${cred_b}.status == CERTIFIED and Credential.${cred_c}.status == CERTIFIED"
            - "Credential.${cred_c}.certified_at == 2026-08-01T00:00:00.000Z"

      - name: family_engagement_round_then_sum
        grounds:
          - calculations.family_engagement_match_credit
          - entities.Contribution.fields.match_credit_cents
          - entities.Program.fields.family_engagement_credit_cents
        distinguishing_aspect: |
          Mode (b): three RECEIVED family-engagement contributions of 12345 cents each must each round
          their 10 percent match to 1235 cents BEFORE summation, giving 3705; the sum-then-round order
          would give 3704, so the one-cent difference falsifies the wrong evaluation order.
        test_recipe:
          setup:
            - "One program with an empty family engagement ledger"
            - "Three identical cash receipts of 12345 cents designated FAMILY_ENGAGEMENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Foster Family", contribution_type: "CASH_RECEIPT", designation: "FAMILY_ENGAGEMENT", stated_value_cents: 12345, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c1: $.data.id }
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Petrov Family", contribution_type: "CASH_RECEIPT", designation: "FAMILY_ENGAGEMENT", stated_value_cents: 12345, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c2: $.data.id }
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Lin Family", contribution_type: "CASH_RECEIPT", designation: "FAMILY_ENGAGEMENT", stated_value_cents: 12345, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c3: $.data.id }
          assert:
            - "Contribution.${c1}.match_credit_cents == 1235"
            - "Contribution.${c2}.match_credit_cents == 1235"
            - "Contribution.${c3}.match_credit_cents == 1235"
            - "Program.${prog}.family_engagement_credit_cents == 3705"
            - "Program.${prog}.family_engagement_credit_cents != 3704"
            - "Program.${prog}.recognized_support_cents == 37035"

      - name: undersized_division_merge_order
        grounds:
          - calculations.undersized_division_merge
          - calculations.division_assignment
          - entities.Division.fields.merged_into_division_id
          - entities.Division.fields.merged_source_count
          - state_machines.Division.UNDERSIZED_to_VOIDED
          - errors[ERR_UNDERSIZED_DIVISION_PRESENT]
        distinguishing_aspect: |
          Mode (c): "which divisions are undersized" and "which merges happened" are mutually dependent,
          so the merge pass reads its source list from a pre-merge snapshot and its target eligibility
          from live counts - the AGE_16_21 division is UNDERSIZED in the snapshot yet is never processed
          as a source because it became the AGE_12_15 division's merge target, while the AGE_30_PLUS
          division finds no adjacent target and is left UNDERSIZED.
        test_recipe:
          setup:
            - "Program with a CERTIFIED coach so posture is OPEN"
            - "Five ACTIVE, CLEARED athletes aged 14, 15, 18, 18 and 32 at the competition date"
            - "One ATHLETICS season, PRACTICE_OPEN, zero practice minimums"
            - "Five 100M_DASH entries: 20.0 and 19.8 in AGE_12_15, 20.4 and 20.1 in AGE_16_21, 8.0 in AGE_30_PLUS"
            - "Clock advanced to 2026-09-02, one day past the registration deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Dana Ruiz", email: "dana@rb.example", date_of_birth: "1988-04-12", volunteer_class: "COACH" }
              as: ProgramManager
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/credentials"
              payload: { role_class: "COACH" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred: $.data.id }
            - call: "POST /credentials/${cred}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1001" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
            - call: "POST /credentials/${cred}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Kai Obi", birth_date: "2012-05-10", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath_a: $.data.id }
            - call: "POST /athletes/${ath_a}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { f_a: $.data.id }
            - call: "POST /medical-forms/${f_a}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Sara Nolan", birth_date: "2011-08-02", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath_b: $.data.id }
            - call: "POST /athletes/${ath_b}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { f_b: $.data.id }
            - call: "POST /medical-forms/${f_b}/review"
              payload: { decision: "APPROVE" }
              as: MedicalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Tomas Reyes", birth_date: "2008-04-15", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath_c: $.data.id }
            - call: "POST /athletes/${ath_c}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
