      - name: no_show_cascade_side_effects_are_applied_in_order
        claim_type: Side Effect Execution
        excluded_because:
          difficulty_instance: no_show_three_hop_suppression_and_pool_posture
          rationale: "The §1.8 transitive_cascade instance already walks all three declared side effects of Recruitment SCHEDULED -> NO_SHOW - incentive FORFEITED, pool ledger release with posture recompute, and participant suppression with suppressed_participant_count - and asserts each hop's stored fields."
      - name: settlement_keeps_the_pool_ledger_in_sync
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: incentive_forward_estimate_vs_chronological_actual
          rationale: "The §1.8 dual_variant_calc instance reconciles pool.incentive_reserved_cents / incentive_paid_cents / incentive_available_cents before and after a binding settlement, which is exactly the ledger-sync claim for the Recruitment incentive dimension."
      - name: withdrawal_compensates_every_reservation_side_effect
        claim_type: Compensation
        excluded_because:
          difficulty_instance: pool_cents_conserved_when_invitations_are_withdrawn
          rationale: "The §1.8 compensating_invariant instance proves the withdraw path returns exactly reserved_cents with no drift across a surcharged and an unsurcharged reservation, so a separate compensation walk would repeat it."
      - name: evidence_link_changes_adjust_the_finding_and_its_theme
        claim_type: Cross-entity
        excluded_because:
          difficulty_instance: finding_evidence_mass_conserved_across_link_add_and_delete
          rationale: "The §1.8 compensating_invariant instance already verifies that an EvidenceLink add and its matching delete leave Finding.evidence_strength and the parent Theme's evidence_weight at their original values, covering the cross-entity side-effect claim."
      - name: study_dimensions_are_independent
        claim_type: parallel
        excluded_because:
          difficulty_instance: study_execution_and_recruitment_dimensions_advance_independently
          rationale: "The §1.8 non_linear_state_machine instance drives execution_status and recruitment_status through interleaved transitions and asserts the combined state after each, which is the parallel-shape claim in full."
      - name: reframing_loop_terminates_at_the_revision_ceiling
        claim_type: cyclic
        excluded_because:
          difficulty_instance: research_request_reframing_cycle_with_bounded_rounds
          rationale: "The §1.8 non_linear_state_machine instance walks NEEDS_REFRAMING -> SUBMITTED twice and shows the third resubmit failing with ERR_REVISION_LIMIT_REACHED, which is the cyclic-shape termination claim for ResearchRequest."
