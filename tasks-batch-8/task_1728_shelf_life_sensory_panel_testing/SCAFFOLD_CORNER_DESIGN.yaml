            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-RT", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "GET /sensory-lab/studies/${study_id}", payload: {}, as: SensoryScientist, captures: { study_v: $.data.version } }
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_id}", arm_id: "${arm_id}", expected_study_version: "${study_v}" }, as: SensoryScientist, captures: { rec_id: $.data.id } }
            - { call: "POST /sensory-lab/date-code-recommendations/${rec_id}/accept", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/study-reports", payload: { study_id: "${study_id}", title: "Fish sauce report" }, as: SensoryScientist, as_user_id: "sci-author", captures: { report_id: $.data.id } }
            - { call: "POST /sensory-lab/study-reports/${report_id}/attach-recommendation", payload: { recommendation_id: "${rec_id}" }, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/submit", payload: {}, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/qa-approve", payload: {}, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/release", payload: {}, as: LabDirector }
            - { call: "GET /sensory-lab/sample-units", payload: { study_id: "${study_id}", unit_purpose: "RETAIN" }, as: LabDirector, captures: { retain_id: "$.data[0].id", retention: "$.data[0].retention_until_utc" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-29T23:59:59Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/retain-sweeps", payload: {}, as: LabDirector, captures: { n1: $.data.expired_count } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/retain-sweeps", payload: {}, as: LabDirector, captures: { n2: $.data.expired_count } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:01Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/retain-sweeps", payload: {}, as: LabDirector, captures: { n3: $.data.expired_count } }
          assert:
            - "SampleUnit.${retain_id}.retention_until_utc == 2026-10-30T00:00:00Z (set at release: clock + 90 days)"
            - "sweep at retention - 1s: expired_count == 0; sweep at exactly retention: expired_count == 0 (strict < boundary)"
            - "sweep at retention + 1s: expired_count == 1 and SampleUnit.${retain_id}.status == EXPIRED"
            - "StorageChamber.${chamber_id}.reserved_units == 0 after expiry"

      - name: abort_cascades_compensate_children
        claim_type: cascading_side_effects
        grounds: [state_machines.Study.IN_PROGRESS_to_ABORTED]
        distinguishing_aspect: "Aborting an IN_PROGRESS study cascades to every child in one request: PLANNED session -> CANCELLED, its ASSIGNED assignment -> EXCUSED, pulled units -> DISCARDED (chamber reserved 0), escrow refunded (50 - 16 -> 50), recommendations none."
        test_recipe:
          setup: ["study IN_PROGRESS (client topped up 50; reserve 16 = 10 + 2*1 + 4*1); session S PLANNED with QUALIFIED panelist ASSIGNED; 2 RETAIN units pulled into CH-AB (reserved_units == 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Abort Co", contact_email: "abort@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 50 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Sriracha", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-AB", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp0}", arm_id: "${arm_id}", scheduled_start_utc: "2026-08-02T10:00:00Z", scheduled_end_utc: "2026-08-02T11:00:00Z" }, as: PanelCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 2, unit_purpose: "RETAIN" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "Ab Pan", email: "ab@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { p: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${s1}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/abort", payload: {}, as: LabDirector }
          assert:
            - "Study.${study_id}.status == ABORTED and reserved_hours_escrow == 0"
            - "EvaluationSession.${s1}.status == CANCELLED (PLANNED -> CANCELLED cascade)"
            - "PanelAssignment.${a}.status == EXCUSED (second-level cascade from the session cancel)"
            - "GET /sensory-lab/sample-units?study_id=${study_id} shows both units DISCARDED; StorageChamber.${chamber_id}.reserved_units == 0"
            - "ClientAccount.${client_id}.retainer_hours_balance == 50.0 (16-hour escrow fully refunded)"

  # ===========================================================================
  # From Table 5 (Endpoints) + Table 6 (Errors) + Consistency Model
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error
        claim_type: crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success envelope: meta.api_request_id + meta.api_request_timestamp present, response_type 'object', data holds the entity. Error envelope: response_type 'error', data.error_id + data.message present."
        test_recipe:
          setup: []
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/clients", payload: { name: "Env Co", contact_email: "env@acme.com" }, as: LabDirector, captures: { cid: $.data.id } }
            - { call: "GET /sensory-lab/clients/11111111-2222-4333-8444-555555555555", payload: {}, as: LabDirector, captures: { err: $.data.error_id } }
          assert:
            - "create response: meta.api_request_id non-empty, response_type == object, data.id == ${cid}"
            - "error response: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty (http 404)"

      - name: list_filters_and_created_at_order
        claim_type: listing
        grounds: ["endpoints[GET /sensory-lab/panelists]", "endpoints[GET /sensory-lab/sample-units]"]
        distinguishing_aspect: "Filtered lists honor the filter and created_at ASC ordering: GET /panelists?status=QUALIFIED returns only the qualified panelist; GET /sample-units?status=DISCARDED returns only discarded units."
        test_recipe:
          setup: ["panelists: one QUALIFIED (screening 90 + 3 trainings), one APPLIED"]
          setup_api_calls:
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "List One", email: "l1@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { lp1: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${lp1}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${lp1}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${lp1}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${lp1}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "List Two", email: "l2@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { lp2: $.data.id } }
          trigger:
            - { call: "GET /sensory-lab/panelists", payload: { status: "QUALIFIED" }, as: PanelCoordinator, captures: { only: "$.data[0].id" } }
            - { call: "GET /sensory-lab/panelists", payload: { status: "APPLIED" }, as: PanelCoordinator, captures: { only2: "$.data[0].id" } }
          assert:
            - "QUALIFIED filter: total_count == 1, row id == ${lp1}"
            - "APPLIED filter: total_count == 1, row id == ${lp2}"
            - "unfiltered list: total_count == 2 ordered ${lp1} then ${lp2} (created_at ASC)"

  - section: errors
    instances:
      - name: error_measurement_out_of_range
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEASUREMENT_OUT_OF_RANGE]"]
        excluded_because:
          difficulty_instance: measurement_range_error_beats_referential_error
          rationale: "Triggered as the winning error of the §1.8 priority-pair instance (APC 999.0)."
      - name: error_chamber_capacity_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHAMBER_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: chamber_capacity_equality_allowed
          rationale: "Triggered by the over-capacity third pull in the §1.8 boundary instance (and again in chamber_aggregate_capacity_across_studies)."
      - name: error_panelist_double_booked
        claim_type: violation_to_error
        grounds: ["errors[ERR_PANELIST_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: panelist_half_open_adjacency
          rationale: "Triggered by the strictly-intersecting S3 assignment in the §1.8 overlap instance."
      - name: error_no_pulled_samples
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_PULLED_SAMPLES]"]
        excluded_because:
          difficulty_instance: session_open_requires_pulled_samples
          rationale: "Asserted as the failing first open in the §1.8 cross-entity dependency instance."
      - name: error_unverified_claims
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNVERIFIED_CLAIMS]"]
        excluded_because:
          difficulty_instance: report_release_requires_all_claims_supported
          rationale: "Asserted as the failing first release in the §1.8 cross-entity dependency instance."
      - name: error_invalid_sample_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_SAMPLE_STATE]"]
        excluded_because:
          difficulty_instance: sample_unit_checkout_return_cycle
          rationale: "Asserted by the second consume on the terminal CONSUMED unit in the §1.8 cyclic machine instance."

  - section: consistency_model
    instances:
      - name: immediate_consistency_after_mutation
        claim_type: immediate
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the pull's own response shows the time point PULLED; the very next GET of the chamber shows reserved_units == 2; a GET of the study right after activate shows the escrow debited — no read-your-writes lag anywhere."
        test_recipe:
          setup: ["study IN_PROGRESS (client 100 -> 84 after 16-hour reserve); chamber CH-IC (20C, cap 10); tp0"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "IC Co", contact_email: "ic@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Soy Sauce", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-IC", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist, captures: { esc: $.data.reserved_hours_escrow } }
            - { call: "GET /sensory-lab/clients/${client_id}", payload: {}, as: LabDirector, captures: { bal: $.data.retainer_hours_balance } }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 2, unit_purpose: "RETAIN" }, as: SensoryScientist, captures: { tp_st: $.data.status } }
            - { call: "GET /sensory-lab/chambers/${chamber_id}", payload: {}, as: LabDirector, captures: { res: $.data.reserved_units } }
          assert:
            - "activate response itself carries reserved_hours_escrow == 16 (10 + 2*1 + 4*1)"
            - "immediately following GET: client balance == 84.0 (debit visible in the same logical instant)"
            - "pull response: SamplingTimePoint.${tp0}.status == PULLED"
            - "immediately following GET: chamber reserved_units == 2"

  - section: state_machines
    instances:
      - name: report_resubmit_and_lab_result_state_gates
        claim_type: invalid_transition
        grounds: [state_machines.StudyReport.DRAFT_to_INTERNAL_REVIEW, "errors[ERR_INVALID_REPORT_STATE]", "errors[ERR_INVALID_STUDY_STATE]"]
        distinguishing_aspect: "Two remaining state gates: a report already in INTERNAL_REVIEW rejects a second submit with ERR_INVALID_REPORT_STATE; a lab result posted while the study is DRAFT (fieldwork never started) fails with ERR_INVALID_STUDY_STATE."
        test_recipe:
          setup: ["study A ANALYSIS with report in INTERNAL_REVIEW; study B still DRAFT with arm_b/tp_b"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "SG Co", contact_email: "sg@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 200 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Vinegar A", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_a: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_a}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_a: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_a}", day_index: 0 }, as: SensoryScientist, captures: { tp_a: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_a}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_a}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_a}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_a}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_a}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "GET /sensory-lab/studies/${study_a}", payload: {}, as: SensoryScientist, captures: { va: $.data.version } }
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_a}", arm_id: "${arm_a}", expected_study_version: "${va}" }, as: SensoryScientist, captures: { rec_a: $.data.id } }
            - { call: "POST /sensory-lab/date-code-recommendations/${rec_a}/accept", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/study-reports", payload: { study_id: "${study_a}", title: "Vinegar A report" }, as: SensoryScientist, as_user_id: "sci-author", captures: { report_id: $.data.id } }
            - { call: "POST /sensory-lab/study-reports/${report_id}/attach-recommendation", payload: { recommendation_id: "${rec_a}" }, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/study-reports/${report_id}/submit", payload: {}, as: SensoryScientist, as_user_id: "sci-author" }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Vinegar B", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_b: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_b}", packaging_variant: "MAP", is_control: true }, as: SensoryScientist, captures: { arm_b: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_b}", day_index: 0 }, as: SensoryScientist, captures: { tp_b: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/study-reports/${report_id}/submit", payload: {}, as: SensoryScientist, as_user_id: "sci-author", captures: { err1: $.data.error_id } }
            - { call: "POST /sensory-lab/lab-test-results", payload: { study_id: "${study_b}", arm_id: "${arm_b}", time_point_id: "${tp_b}", test_type: "WATER_ACTIVITY", measured_value: 0.5 }, as: LabAnalyst, captures: { err2: $.data.error_id } }
          assert:
            - "second submit on INTERNAL_REVIEW report: error_id == ERR_INVALID_REPORT_STATE (http 409); status unchanged"
            - "lab result on DRAFT study: error_id == ERR_INVALID_STUDY_STATE (lab results require IN_PROGRESS/ANALYSIS/REPORTING)"
