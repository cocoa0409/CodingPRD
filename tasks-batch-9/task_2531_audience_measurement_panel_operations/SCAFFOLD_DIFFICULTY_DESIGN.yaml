              captures: { m15_blocked_after_denial: "$.data.outcome" }
          trigger:
            - call: "POST /processing-runs/${run15_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-publisher-15"
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m15_id}", scope_edit_rule_set_id: "${rs15_id}", auditor_note: "Re-review after remediation" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-15b"
              captures: { audit15b_id: "$.data.id" }
            - call: "POST /processing-runs/${run15_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-publisher-15"
            - call: "POST /accreditation-audits/${audit15b_id}/finalize"
              payload: { outcome: "ACCREDITED", limitation_disclosures: [] }
              as: AccreditationAuditor
              as_user_id: "auditor-closer-15b"
            - call: "POST /processing-runs/${run15_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-publisher-15"
          assert:
            - "${run15_projected} == 29167 and ${m15_blocked_after_denial} == DENIED"
            - "After the DENIED finalize: Market.${m15_id}.accreditation_status == DENIED, .publication_blocked == true, .open_audit_count == 0, .recruitment_posture == CLOSED and .limitation_disclosures == [SMALL_CELL_SAMPLE]"
            - "Trigger call 1: HTTP 409 with data.error_id == ERR_PUBLICATION_BLOCKED, and ProcessingRun.${run15_id}.state is still WEIGHTED with published_by_user_id == null"
            - "Trigger call 2 succeeds: Market.${m15_id}.open_audit_count == 1 and .recruitment_posture == FROZEN while .publication_blocked is still true"
            - "Trigger call 3: HTTP 409 with data.error_id == ERR_MARKET_FROZEN - the priority-23 freeze is reported ahead of the priority-43 block while both hold"
            - "Trigger call 4 succeeds: Market.${m15_id}.accreditation_status == ACCREDITED, .publication_blocked == false, .open_audit_count == 0, .recruitment_posture == CLOSED"
            - "Trigger call 4: Market.${m15_id}.limitation_disclosures == [SMALL_CELL_SAMPLE] still - an ACCREDITED outcome never erases a recorded disclosure"
            - "Trigger call 5: HTTP 200; ProcessingRun.${run15_id}.state == PUBLISHED with published_by_user_id == stat-publisher-15"
            - "Trigger call 5: ProcessingRun.${run15_id}.limitation_disclosures == [SMALL_CELL_SAMPLE] - the market disclosure is appended at publish time and travels with the data"
            - "ProcessingRun.${run15_id}.projected_average_audience == 29167 and .total_weight_mass == 120000.0000 across all five trigger calls - the run's own numbers never moved"

