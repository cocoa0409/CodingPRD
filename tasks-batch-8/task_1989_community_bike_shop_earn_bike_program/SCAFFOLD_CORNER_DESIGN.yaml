  - section: cross_cutting
    instances:
      - name: occ_stale_part_version_on_usage
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[part-usage-stale-stock]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Part.version: after a first usage bumps the part to version 3, a second usage carrying the pre-first-usage version 2 is rejected ERR_STALE_VERSION (412); re-reading and resubmitting with version 3 succeeds."
        test_recipe:
          setup: ["bike IN_REFURBISHMENT (APPRENTICE lead); part restocked to 10 (version 2)"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D OCC", donor_type: "INDIVIDUAL", email: "docc@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "V L", email: "vl@x.org" }, as: ShopCoordinator, captures: { v: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T1", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 5, capacity: 10 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T2", level: "BASIC", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", credit_hours: 5, capacity: 10 }, as: ShopCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /training-sessions/${s1}/enroll", payload: { volunteer_id: "${v}" }, as: ShopCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /training-sessions/${s2}/enroll", payload: { volunteer_id: "${v}" }, as: ShopCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s1}/complete", payload: { marks: [ { attendance_id: "${a1}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${a2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /volunteers/${v}/promote", as: ProgramDirector }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-OC2", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "REFURBISH", refurb_lead_volunteer_id: "${v}" }, as: ShopCoordinator }
            - { call: "POST /parts", payload: { name: "Spoke", category: "WHEELS", unit_cost_cents: 20 }, as: ShopCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /parts/${pt}/restock", payload: { quantity: 10 }, as: ShopCoordinator, captures: { pt_v2: $.data.version } }
          trigger:
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 1, expected_part_version: "${pt_v2}" }, as: Volunteer, as_user_id: "${v}", captures: { u1: $.data.id } }
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 1, expected_part_version: "${pt_v2}" }, as: Volunteer, as_user_id: "${v}", captures: { err: $.data.error_id } }
            - { call: "GET /parts/${pt}", as: ShopCoordinator, captures: { pt_v3: $.data.version } }
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 1, expected_part_version: "${pt_v3}" }, as: Volunteer, as_user_id: "${v}", captures: { u2: $.data.id } }
          assert:
            - "first usage with the post-restock version succeeds"
            - "second usage replaying the same version -> error_id ERR_STALE_VERSION (412)"
            - "after re-read (version 3), the resubmitted usage succeeds"
            - "Part.${pt}.quantity_on_hand == 8 (two successful decrements only)"

      - name: occ_stale_participant_version_on_approve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[hour-approval-stale-participant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on EarnABikeParticipant.version: after approving log h1 advances the participant version, approving h2 with the pre-h1 version fails ERR_STALE_VERSION (412); resubmitting with the fresh version succeeds."
        test_recipe:
