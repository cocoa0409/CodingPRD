              captures: { pre_req: $.data.required_reserve_cents, pre_short: $.data.reserve_shortfall_cents, pre_posture: $.data.oversight_posture }
            - call: "POST /oversight/settlement-batches/${b1_id}/fund"
              payload: { funding_reference: "WIRE-EARLY-1" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_early_fund: $.data.error_id }
            - *q_res_a_read2
            - *q_res_top_193750
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { mid_req: $.data.required_reserve_cents, mid_short: $.data.reserve_shortfall_cents, mid_posture: $.data.oversight_posture }
            - call: "POST /oversight/settlement-batches/${b1_id}/fund"
              payload: { funding_reference: "WIRE-OK-1" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { f_status: $.data.funding_status, f_bps: $.data.bank_fee_bps_applied, f_fee: $.data.bank_fee_cents, f_base: $.data.settlement_base_cents, f_res: $.data.reserve_funding_cents, f_net: $.data.net_to_partner_cents, f_carry: $.data.shortfall_carry_cents }
            - call: "GET /oversight/ledger-entries"
              payload: { settlement_batch_id: "${b1_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { legs_total: $.total_count }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { acc_total: $.total_count, acc0_type: "$.data[0].account_type", acc0_bal: "$.data[0].balance_cents", acc0_status: "$.data[0].status" }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { post_req: $.data.required_reserve_cents, post_short: $.data.reserve_shortfall_cents, post_posture: $.data.oversight_posture, post_paid: $.data.cumulative_paid_out_cents, post_fees: $.data.cumulative_bank_fee_cents, post_conc: $.data.concentration_ratio_pct }
          assert:
            - "casc_recon == MATCHED — reconcile is NOT in required_reserve_cents' trigger list, so it leaves the reserve fields untouched"
            - "pre_req == 405000 (floor(8100000*500/10000) beats both the 150bps trailing-gross floor of 0 and the 250000 absolute floor, at the OPEN multiplier 1.00) with pre_short == 92500 and pre_posture == HEIGHTENED"
            - "e_early_fund == ERR_RESERVE_SHORTFALL with HTTP 402 — link 0 of the cascade is a precondition, so no leg is written"
            - "mid_req == 506250 == floor(405000 * 1.25) and mid_short == 0 and mid_posture == OPEN — the 193750 top-up satisfies the HEIGHTENED requirement that only becomes visible during the top-up's own pass, so paying only the 92500 the client could see would have left a 92500 shortfall"
            - "f_bps == 45 (gross 8000000 < TIER_2_GROSS_FLOOR_CENTS), f_fee == 61000 == 25000 + floor(8000000*45/10000), f_base == 8100000, f_res == 400000 == floor(8000000*500/10000), f_net == 7639000, f_carry == 0, f_status == FUNDED"
            - "legs_total == 3 — END_USER_DEBIT -8100000, RESERVE_FUND +400000, FEE -61000, all carrying settlement_batch_id == ${b1_id} (link 1)"
            - "acc_total == 2 with the FBO_END_USER balance at 0 and the RESERVE balance at 845250 == 506250 + 400000 - 61000, both still status ACTIVE (link 2, and link 5 does NOT fire)"
            - "post_paid == 7639000 and post_fees == 61000 — the counters take net and fee, never the base"
            - "post_req == 250000 and post_short == 0 (link 3): with the FBO drained the 500bps term is 0 and the trailing-gross term is 0 because b1.window_end 2026-08-15 is after the logical clock 2026-08-01, so RESERVE_ABSOLUTE_FLOOR_CENTS wins"
            - "post_posture == OPEN (link 4) and post_conc == 0.00 — the bank-wide FBO denominator is now 0, which step 5 of concentration_ratio_pct defines as 0.00 rather than an error"

      - name: the_reserve_basis_variant_moves_exactly_5000_cents_on_an_identical_settlement_base
        claim_type: dual_variant_calculation
        grounds:
          - calculations.settlement_net_to_partner_cents.variants.gross_basis_reserve
          - calculations.settlement_net_to_partner_cents.variants.net_basis_reserve
          - endpoints.POST_/oversight/settlement-batches/{id}/clear-variance
          - validations.priority_75
        distinguishing_aspect: "The two batches are engineered so that settlement_base_cents is 8100000 and gross_settlement_cents is 8000000 in BOTH cases — the MATCHED batch reaches 8100000 through interchange 200000, the VARIANCE_CLEARED batch through interchange 100000 plus a cleared adjustment of 100000. Every other input to the formula is identical, so the only possible source of a difference is the variant selector, and the difference must be exactly floor(100000*500/10000) == 5000. An implementation that always uses gross, or always uses the base, produces identical figures for both batches and fails."
        test_recipe:
          setup:
            - "Partner A LIVE with reserve 506250 and FBO 8100000; batch b1 MATCHED; batch bv VARIANCE_CLEARED with variance_adjustment_cents 100000."
