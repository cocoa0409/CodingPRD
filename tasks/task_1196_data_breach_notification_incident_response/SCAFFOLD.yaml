scenario: 'generate task hard than expert level! 1196. Data Breach Notification & Incident Response (corporate incident response team): incident intake & severity classification, forensic investigation
  scope & evidence preservation, affected-record determination & data element analysis, notification obligation matrix by state/regulator & deadline clock, notice drafting/approval & mailing vendor coordination,
  credit monitoring offer & call center staffing, regulator/AG submission & inquiry response, post-incident remediation & lessons learned

  '
domain_name: data-breach-incident-response
api_prefix: ''
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
  - cascading_side_effects
  - optimistic_concurrency
  - scheduled_deferred_actions
  - derived_field_reconciliation
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Incident
  parent: null
  common_fields: true
  fields:
  - name: title
    type: string
    source: input
    description: Short incident title
  - name: discovered_at
    type: datetime
    source: input
    description: When the breach was discovered (ISO8601 UTC)
  - name: occurred_at
    type: datetime
    source: input
    description: Best-estimate breach occurrence timestamp (may be after discovered_at for forensic anomalies)
  - name: source_channel
    type: enum
    source: input
    description: INTERNAL_DETECTION | THIRD_PARTY_REPORT | LAW_ENFORCEMENT | CUSTOMER_COMPLAINT | AUDIT
  - name: severity
    type: enum
    source: system
    default: UNCLASSIFIED
    description: UNCLASSIFIED | LOW | MODERATE | HIGH | CRITICAL
  - name: investigation_status
    type: enum
    source: system
    default: INTAKE
    description: INTAKE | SCOPED | INVESTIGATING | CONFIRMED | CONTAINED | CLOSED — parallel dimension 1
  - name: notification_status
    type: enum
    source: system
    default: NOT_REQUIRED
    description: NOT_REQUIRED | EVALUATING | REQUIRED | DRAFTING | APPROVED | DISPATCHING | COMPLETED | WAIVED — parallel dimension 2
  - name: risk_score_conservative
    type: integer
    source: computed
    description: 0-100 risk score under the CONSERVATIVE variant (assumes worst-case data misuse)
  - name: risk_score_likelihood_adjusted
    type: integer
    source: computed
    description: 0-100 risk score under the LIKELIHOOD_ADJUSTED variant (discounts by exfiltration probability)
  - name: total_affected_subjects
    type: integer
    source: computed
    default: 0
    description: Count of AffectedSubject rows with status IN {IDENTIFIED, VERIFIED}
  - name: total_notified_subjects
    type: integer
    source: computed
    default: 0
    description: Count of AffectedSubject rows with status = NOTIFIED
  - name: total_pending_subjects
    type: integer
    source: computed
    default: 0
    description: Count of AffectedSubject rows with status IN {IDENTIFIED, VERIFIED, NOTICE_QUEUED}
  - name: credit_monitoring_offered
    type: integer
    source: computed
    default: 0
    description: Count of AffectedSubject rows with credit_monitoring_status != NOT_OFFERED
  - name: credit_monitoring_enrolled
    type: integer
    source: computed
    default: 0
    description: Count of AffectedSubject rows with credit_monitoring_status = ENROLLED
  - name: credit_monitoring_declined
    type: integer
    source: computed
    default: 0
    description: Count of AffectedSubject rows with credit_monitoring_status = DECLINED
  - name: remediation_status
    type: enum
    source: system
    default: NOT_STARTED
    description: NOT_STARTED | PLANNING | IN_PROGRESS | VERIFIED | CLOSED
- name: ForensicScope
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: scope_statement
    type: string
    source: input
    description: Narrative scope of forensic investigation
  - name: systems_in_scope
    type: array
    source: input
    description: Array of system identifiers (e.g., ['CRM','EMAIL','HR_DB'])
  - name: data_elements_at_risk
    type: array
    source: input
    description: 'Array of PII categories: NAME | SSN | DOB | EMAIL | PHONE | ADDRESS | DRIVER_LICENSE | PASSPORT | FINANCIAL_ACCOUNT | HEALTH_RECORD | BIOMETRIC | CREDENTIALS'
  - name: exfiltration_likelihood_pct
    type: integer
    source: input
    description: 0-100; probability data was actually exfiltrated (drives likelihood-adjusted risk variant)
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | BASELINED | AMENDED | FINAL
- name: EvidenceItem
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: label
    type: string
    source: input
    description: Evidence label (e.g., 'firewall-log-2026-05-01.gz')
  - name: evidence_type
    type: enum
    source: input
    description: LOG | DISK_IMAGE | MEMORY_DUMP | EMAIL | NETWORK_PCAP | DOCUMENT | PHOTO
  - name: collected_at
    type: datetime
    source: input
    description: When the evidence was collected
  - name: collected_by_user_id
    type: string
    source: input
    description: User id of collecting responder
  - name: preservation_hash
    type: string
    source: input
    description: SHA-256 hex of preserved artifact; immutable after SEALED
  - name: status
    type: enum
    source: system
    default: COLLECTED
    description: COLLECTED | SEALED | RELEASED | DESTROYED
- name: EvidenceCustodyLog
  parent: Incident
  common_fields: false
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: evidence_item_id
    type: string
    source: system
    description: FK -> EvidenceItem.id; the evidence item being handed off
  - name: custodian_user_id
    type: string
    source: input
    description: Responder holding custody during [start_at, end_at)
  - name: start_at
    type: datetime
    source: input
    description: Custody start (inclusive, half-open interval)
  - name: end_at
    type: datetime
    source: input
    description: Custody end (exclusive, half-open interval); null while custody is OPEN
  - name: purpose
    type: string
    source: input
    description: Why custody was taken
- name: AffectedSubject
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: external_subject_ref
    type: string
    source: input
    description: Stable external reference (e.g., CRM customer number)
  - name: full_name
    type: string
    source: input
    description: Subject full name
  - name: residence_state_code
    type: string
    source: input
    description: US state/territory code driving jurisdiction matrix (e.g., CA, NY, TX); or 'NON_US'
  - name: data_elements_exposed
    type: array
    source: input
    description: PII categories exposed for this subject; must be a subset of ForensicScope.data_elements_at_risk when scope is BASELINED or later
  - name: record_count
    type: integer
    source: input
    description: Number of records belonging to this subject that were exposed
  - name: status
    type: enum
    source: system
    default: IDENTIFIED
    description: IDENTIFIED | VERIFIED | NOTICE_QUEUED | NOTIFIED | EXCLUDED
  - name: credit_monitoring_status
    type: enum
    source: system
    default: NOT_OFFERED
    description: NOT_OFFERED | OFFERED_PENDING | ENROLLED | DECLINED | EXPIRED
  - name: offered_at
    type: datetime
    source: system
    description: Timestamp credit monitoring was offered (null until OFFERED_PENDING)
- name: JurisdictionEvaluation
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: state_code
    type: string
    source: input
    description: Jurisdiction code (e.g., CA, NY, TX, GDPR-EEA)
  - name: statute_reference
    type: string
    source: input
    description: Statute citation (e.g., 'Cal. Civ. Code §1798.82')
  - name: record_count_threshold
    type: integer
    source: input
    description: Resident-record threshold at or above which notification is mandatory in this jurisdiction
  - name: deadline_days
    type: integer
    source: input
    description: Statutory days from determination to notification
  - name: deadline_kind
    type: enum
    source: input
    description: CALENDAR_DAYS | BUSINESS_DAYS — selects the variant in notification_deadline computation
  - name: requires_ag_notification
    type: boolean
    source: input
    description: Whether the state Attorney General must also be notified
  - name: requires_credit_agencies
    type: boolean
    source: input
    description: Whether the three nationwide CRAs must be notified (typically when threshold crossed)
  - name: subjects_in_jurisdiction
    type: integer
    source: computed
    default: 0
    description: Count of AffectedSubject rows with residence_state_code == state_code and status IN {IDENTIFIED, VERIFIED, NOTICE_QUEUED, NOTIFIED}
  - name: notification_required
    type: boolean
    source: computed
    description: True iff subjects_in_jurisdiction >= record_count_threshold (>= is inclusive at boundary)
  - name: deadline_at
    type: datetime
    source: computed
    description: Computed notification deadline per deadline_kind variant; null until determination event fires
  - name: status
    type: enum
    source: system
    default: PENDING
    description: PENDING | TRIGGERED | WAIVED | SATISFIED
- name: Notice
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: jurisdiction_evaluation_id
    type: string
    source: system
    description: FK -> JurisdictionEvaluation.id; the jurisdiction this notice satisfies (self-referential when jurisdiction requires multi-round revision)
  - name: version_label
    type: integer
    source: system
    default: 1
    description: 1, 2, 3, ... — increments on each return-to-DRAFT cycle
  - name: body_text
    type: string
    source: input
    description: Notice body (consumer-facing)
  - name: language
    type: string
    source: input
    default: en
    description: ISO-639 language code
  - name: approved_by_user_id
    type: string
    source: system
    description: General Counsel who approved; set only on APPROVED transition
  - name: approved_at
    type: datetime
    source: system
    description: Timestamp of most recent APPROVED transition
  - name: supersedes_notice_id
    type: string
    source: input
    description: FK -> Notice.id; when revising an APPROVED notice, points to the version being replaced
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | LEGAL_REVIEW | APPROVED | LOCKED_FOR_MAIL | SUPERSEDED | REJECTED
- name: MailingBatch
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: notice_id
    type: string
    source: system
    description: FK -> Notice.id; the locked notice being mailed
  - name: vendor_code
    type: string
    source: input
    description: Mailing vendor (e.g., PRINTCO_A, PRINTCO_B)
  - name: recipient_count
    type: integer
    source: computed
    description: Count of AffectedSubject rows transitioned into NOTICE_QUEUED by this batch
  - name: scheduled_ship_date
    type: datetime
    source: input
    description: Vendor ship date
  - name: status
    type: enum
    source: system
    default: QUEUED
    description: QUEUED | IN_PRODUCTION | SHIPPED | DELIVERED_CONFIRMED | FAILED
- name: CreditMonitoringOffer
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: affected_subject_id
    type: string
    source: system
    description: FK -> AffectedSubject.id; the subject this offer targets
  - name: vendor_code
    type: string
    source: input
    description: Credit-monitoring vendor (e.g., CM_VENDOR_X)
  - name: term_months
    type: integer
    source: input
    description: Free monitoring duration (12 or 24)
  - name: unit_cost_cents
    type: integer
    source: input
    description: Vendor cost per enrolled subject per term
  - name: offer_code
    type: string
    source: system
    description: Unique redemption code issued to subject
  - name: expires_at
    type: datetime
    source: system
    description: Offer expiration (determination_at + 90 days)
  - name: status
    type: enum
    source: system
    default: ISSUED
    description: ISSUED | REDEEMED | DECLINED | EXPIRED | CANCELLED
- name: CallCenterStaffingPlan
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: effective_from
    type: datetime
    source: input
    description: When this staffing plan takes effect
  - name: effective_until
    type: datetime
    source: input
    description: When this staffing plan expires
  - name: seats_required
    type: integer
    source: computed
    description: Tiered seat count derived from incident.total_pending_subjects at plan creation; see call_center_seat_formula
  - name: languages_supported
    type: array
    source: input
    description: e.g., ['en','es']
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | SUPERSEDED | CLOSED
- name: RegulatorSubmission
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: jurisdiction_evaluation_id
    type: string
    source: system
    description: FK -> JurisdictionEvaluation.id; the jurisdiction whose AG/regulator is being notified
  - name: notice_id
    type: string
    source: system
    description: FK -> Notice.id; the approved notice attached to this submission
  - name: submission_channel
    type: enum
    source: input
    description: PORTAL | EMAIL | CERTIFIED_MAIL
  - name: submitted_at
    type: datetime
    source: system
    description: Timestamp of SUBMITTED transition
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | SUBMITTED | ACKNOWLEDGED | INQUIRY_OPEN | INQUIRY_RESPONDED | CLOSED
- name: RemediationAction
  parent: Incident
  common_fields: true
  fields:
  - name: incident_id
    type: string
    source: system
    description: FK -> Incident.id; owning breach incident
  - name: title
    type: string
    source: input
    description: Action title (e.g., 'Rotate CRM API keys')
  - name: category
    type: enum
    source: input
    description: TECHNICAL | PROCESS | TRAINING | VENDOR | LEGAL
  - name: owner_user_id
    type: string
    source: input
    description: Responder owning this action
  - name: due_at
    type: datetime
    source: input
    description: Action due date
  - name: completed_at
    type: datetime
    source: system
    description: Timestamp when action was completed
  - name: status
    type: enum
    source: system
    default: OPEN
    description: OPEN | IN_PROGRESS | COMPLETED | VERIFIED | CANCELLED
state_machines:
- entity: Incident
  initial_state: investigation_status=INTAKE, notification_status=NOT_REQUIRED
  terminal_states:
  - investigation_status=CLOSED
  note: 'Parallel state dimensions: investigation_status and notification_status evolve independently on the same Incident row; both must reach a terminal/idle posture before CLOSED.'
  transitions:
  - from: investigation_status=INTAKE
    to: investigation_status=SCOPED
    trigger: POST /incidents/{incidentId}/forensic-scopes (first ForensicScope creation)
    actor: IncidentCommander
    preconditions:
    - incident.investigation_status == INTAKE
    - payload.systems_in_scope non-empty
    - payload.data_elements_at_risk non-empty
    side_effects:
    - increments Incident.version by 1
    - recomputes incident.risk_score_conservative and incident.risk_score_likelihood_adjusted
  - from: investigation_status=SCOPED
    to: investigation_status=INVESTIGATING
    trigger: POST /incidents/{incidentId}/forensic-scopes/{scopeId}/baseline
    actor: ForensicLead
    preconditions:
    - scope.status == DRAFT
    - scope.systems_in_scope non-empty
    side_effects:
    - scope.status := BASELINED
    - incident.investigation_status := INVESTIGATING
    - increments Incident.version by 1
  - from: investigation_status=INVESTIGATING
    to: investigation_status=CONFIRMED
    trigger: POST /incidents/{incidentId}/confirm
    actor: IncidentCommander
    preconditions:
    - incident.investigation_status == INVESTIGATING
    - at least one EvidenceItem with status == SEALED exists for the incident
    - incident.total_affected_subjects > 0
    side_effects:
    - incident.notification_status := EVALUATING
    - 'for each JurisdictionEvaluation je of incident with status == PENDING: je.status := TRIGGERED; je.deadline_at := notification_deadline(now, je.deadline_days, je.deadline_kind)'
    - 'for each JurisdictionEvaluation je transitioned to TRIGGERED: emit NotificationObligation work-item (implicit) which triggers Notice placeholder creation when je.notification_required is true'
    - recompute incident.risk_score_conservative and incident.risk_score_likelihood_adjusted
    - increments Incident.version by 1
  - from: investigation_status=CONFIRMED
    to: investigation_status=CONTAINED
    trigger: POST /incidents/{incidentId}/contain
    actor: IncidentCommander
    preconditions:
    - incident.investigation_status == CONFIRMED
    - every RemediationAction with category == TECHNICAL has status IN {COMPLETED, VERIFIED, CANCELLED}
    side_effects:
    - incident.remediation_status := IN_PROGRESS
    - increments Incident.version by 1
  - from: investigation_status=CONTAINED
    to: investigation_status=CLOSED
    trigger: POST /incidents/{incidentId}/close
    actor: IncidentCommander
    preconditions:
    - incident.notification_status IN {COMPLETED, WAIVED, NOT_REQUIRED}
    - every RemediationAction has status IN {VERIFIED, CANCELLED}
    - every RegulatorSubmission has status IN {CLOSED, ACKNOWLEDGED}
    - incident.remediation_status == VERIFIED
    side_effects:
    - increments Incident.version by 1
  - from: notification_status=EVALUATING
    to: notification_status=REQUIRED
    trigger: system (automatic when any JurisdictionEvaluation.notification_required flips to true)
    actor: system
    preconditions: []
    side_effects: []
  - from: notification_status=EVALUATING
    to: notification_status=NOT_REQUIRED
    trigger: system (automatic when all JurisdictionEvaluation rows resolve with notification_required == false)
    actor: system
    preconditions: []
    side_effects: []
  - from: notification_status=REQUIRED
    to: notification_status=DRAFTING
    trigger: POST /incidents/{incidentId}/notices (first Notice creation)
    actor: PrivacyCounsel
    preconditions:
    - incident.notification_status == REQUIRED
    side_effects:
    - increments Incident.version by 1
  - from: notification_status=DRAFTING
    to: notification_status=APPROVED
    trigger: system (automatic when every TRIGGERED JurisdictionEvaluation has at least one Notice with status == APPROVED or LOCKED_FOR_MAIL)
    actor: system
    preconditions: []
    side_effects: []
  - from: notification_status=APPROVED
    to: notification_status=DISPATCHING
    trigger: POST /incidents/{incidentId}/mailing-batches (first MailingBatch creation)
    actor: PrivacyCounsel
    preconditions: []
    side_effects:
    - increments Incident.version by 1
  - from: notification_status=DISPATCHING
    to: notification_status=COMPLETED
    trigger: system (automatic when incident.total_pending_subjects == 0 AND incident.total_affected_subjects == incident.total_notified_subjects)
    actor: system
    preconditions: []
    side_effects: []
- entity: ForensicScope
  initial_state: DRAFT
  terminal_states:
  - FINAL
  transitions:
  - from: DRAFT
    to: BASELINED
    trigger: POST /incidents/{incidentId}/forensic-scopes/{scopeId}/baseline
    actor: ForensicLead
    preconditions:
    - scope.systems_in_scope non-empty
    - scope.data_elements_at_risk non-empty
    side_effects:
    - incident.investigation_status := INVESTIGATING if currently SCOPED
  - from: BASELINED
    to: AMENDED
    trigger: POST /incidents/{incidentId}/forensic-scopes/{scopeId}/amend
    actor: ForensicLead
    preconditions:
    - incident.investigation_status == INVESTIGATING
    side_effects:
    - recompute incident.risk_score_conservative and incident.risk_score_likelihood_adjusted
    - increments Incident.version by 1
  - from: AMENDED
    to: BASELINED
    trigger: POST /incidents/{incidentId}/forensic-scopes/{scopeId}/re-baseline
    actor: ForensicLead
    preconditions: []
    side_effects:
    - increments Incident.version by 1
  - from: BASELINED
    to: FINAL
    trigger: POST /incidents/{incidentId}/forensic-scopes/{scopeId}/finalize
    actor: ForensicLead
    preconditions:
    - incident.investigation_status IN {CONFIRMED, CONTAINED}
    side_effects:
    - increments Incident.version by 1
- entity: EvidenceItem
  initial_state: COLLECTED
  terminal_states:
  - DESTROYED
  - RELEASED
  transitions:
  - from: COLLECTED
    to: SEALED
    trigger: POST /incidents/{incidentId}/evidence-items/{itemId}/seal
    actor: ForensicLead
    preconditions:
    - item.preservation_hash present (64 lowercase hex chars)
    - no overlapping EvidenceCustodyLog exists for this item in the half-open interval [seal_time, infinity)
    side_effects:
    - increments Incident.version by 1
  - from: SEALED
    to: RELEASED
    trigger: POST /incidents/{incidentId}/evidence-items/{itemId}/release
    actor: ForensicLead
    preconditions:
    - incident.investigation_status IN {CONFIRMED, CONTAINED}
    side_effects:
    - increments Incident.version by 1
  - from: SEALED
    to: DESTROYED
    trigger: POST /incidents/{incidentId}/evidence-items/{itemId}/destroy
    actor: ForensicLead
    preconditions:
    - incident.investigation_status == CLOSED
    side_effects: []
- entity: AffectedSubject
  initial_state: IDENTIFIED
  terminal_states:
  - NOTIFIED
  - EXCLUDED
  transitions:
  - from: IDENTIFIED
    to: VERIFIED
    trigger: POST /incidents/{incidentId}/affected-subjects/{subjectId}/verify
    actor: DataAnalyst
    preconditions:
    - subject.data_elements_exposed non-empty
    side_effects:
    - recompute incident.total_affected_subjects, total_pending_subjects
    - increments Incident.version by 1
  - from: IDENTIFIED
    to: EXCLUDED
    trigger: POST /incidents/{incidentId}/affected-subjects/{subjectId}/exclude
    actor: DataAnalyst
    preconditions:
    - incident.notification_status NOT IN {DISPATCHING, COMPLETED}
    side_effects:
    - recompute incident.total_affected_subjects, total_pending_subjects, subjects_in_jurisdiction on linked JurisdictionEvaluation rows
    - increments Incident.version by 1
  - from: VERIFIED
    to: NOTICE_QUEUED
    trigger: system (automatic on POST /incidents/{incidentId}/mailing-batches when subject matches batch scope)
    actor: system
    preconditions:
    - subject.status == VERIFIED
    - a Notice with status == LOCKED_FOR_MAIL exists for subject's JurisdictionEvaluation
    side_effects: []
  - from: NOTICE_QUEUED
    to: NOTIFIED
    trigger: POST /incidents/{incidentId}/mailing-batches/{batchId}/mark-shipped (system cascades per-subject)
    actor: PrivacyCounsel
    preconditions:
    - batch.status == IN_PRODUCTION
    side_effects:
    - subject.status := NOTIFIED
    - recompute incident.total_notified_subjects and total_pending_subjects
    - increments Incident.version by 1
- entity: Notice
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  - REJECTED
  note: 'Cyclic revision loop: APPROVED -> DRAFT is allowed via /revise (creates a new Notice row that supersedes the prior). DRAFT -> LEGAL_REVIEW -> DRAFT via /request-changes is also a cycle.'
  transitions:
  - from: DRAFT
    to: LEGAL_REVIEW
    trigger: POST /incidents/{incidentId}/notices/{noticeId}/submit-for-review
    actor: PrivacyCounsel
    preconditions:
    - notice.body_text length >= 200 characters
    - incident.notification_status IN {DRAFTING, REQUIRED}
    side_effects:
    - increments Incident.version by 1
  - from: LEGAL_REVIEW
    to: APPROVED
    trigger: POST /incidents/{incidentId}/notices/{noticeId}/approve
    actor: GeneralCounsel
    preconditions:
    - incident.investigation_status == CONFIRMED
    - jurisdiction_evaluation.deadline_at > now (cannot approve a notice whose statutory deadline has already passed — business_temporal)
    - 'seg-of-duty: acting GeneralCounsel X-User-ID != notice.created_by PrivacyCounsel X-User-ID stored on notice (tracked via meta)'
    side_effects:
    - notice.approved_by_user_id := acting user id
    - notice.approved_at := now
    - increments Incident.version by 1
  - from: LEGAL_REVIEW
    to: DRAFT
    trigger: POST /incidents/{incidentId}/notices/{noticeId}/request-changes
    actor: GeneralCounsel
    preconditions: []
    side_effects:
    - notice.version_label := notice.version_label + 1
  - from: APPROVED
    to: LOCKED_FOR_MAIL
    trigger: POST /incidents/{incidentId}/notices/{noticeId}/lock-for-mail
    actor: PrivacyCounsel
    preconditions:
    - no MailingBatch with status IN {QUEUED, IN_PRODUCTION} exists for this notice
    side_effects:
    - increments Incident.version by 1
  - from: APPROVED
    to: SUPERSEDED
    trigger: system (when a new Notice with supersedes_notice_id == this notice.id is created and submitted-for-review)
    actor: system
    preconditions: []
    side_effects:
    - 'for each MailingBatch with notice_id == this notice.id and status == QUEUED: batch.status := FAILED'
- entity: MailingBatch
  initial_state: QUEUED
  terminal_states:
  - DELIVERED_CONFIRMED
  - FAILED
  transitions:
  - from: QUEUED
    to: IN_PRODUCTION
    trigger: POST /incidents/{incidentId}/mailing-batches/{batchId}/start-production
    actor: PrivacyCounsel
    preconditions:
    - notice.status == LOCKED_FOR_MAIL
    - incident.notification_status == DISPATCHING
    side_effects:
    - 'for each AffectedSubject in batch scope with status == VERIFIED: subject.status := NOTICE_QUEUED'
    - recompute incident.total_pending_subjects
    - call_center_seats_required recompute on the active CallCenterStaffingPlan (because total_pending_subjects changed)
    - increments Incident.version by 1
  - from: IN_PRODUCTION
    to: SHIPPED
    trigger: POST /incidents/{incidentId}/mailing-batches/{batchId}/mark-shipped
    actor: PrivacyCounsel
    preconditions:
    - batch.scheduled_ship_date <= now
    side_effects:
    - 'for each AffectedSubject transitioned to NOTICE_QUEUED by this batch: subject.status := NOTIFIED'
    - recompute incident.total_notified_subjects and total_pending_subjects
    - 'if incident.total_pending_subjects == 0 AND incident.total_affected_subjects == incident.total_notified_subjects: incident.notification_status := COMPLETED'
    - increments Incident.version by 1
  - from: SHIPPED
    to: DELIVERED_CONFIRMED
    trigger: POST /incidents/{incidentId}/mailing-batches/{batchId}/confirm-delivery
    actor: PrivacyCounsel
    preconditions: []
    side_effects: []
  - from: QUEUED
    to: FAILED
    trigger: POST /incidents/{incidentId}/mailing-batches/{batchId}/fail
    actor: PrivacyCounsel
    preconditions: []
    side_effects:
    - if batch was the only batch pinning its notice to LOCKED_FOR_MAIL, notice returns to APPROVED
    - increments Incident.version by 1
- entity: CreditMonitoringOffer
  initial_state: ISSUED
  terminal_states:
  - REDEEMED
  - DECLINED
  - EXPIRED
  - CANCELLED
  transitions:
  - from: ISSUED
    to: REDEEMED
    trigger: POST /incidents/{incidentId}/credit-monitoring-offers/{offerId}/redeem
    actor: AffectedSubjectRole
    preconditions:
    - offer.expires_at > now
    side_effects:
    - subject.credit_monitoring_status := ENROLLED
    - recompute incident.credit_monitoring_enrolled
    - increments Incident.version by 1
  - from: ISSUED
    to: DECLINED
    trigger: POST /incidents/{incidentId}/credit-monitoring-offers/{offerId}/decline
    actor: AffectedSubjectRole
    preconditions: []
    side_effects:
    - subject.credit_monitoring_status := DECLINED
    - recompute incident.credit_monitoring_declined
    - increments Incident.version by 1
  - from: ISSUED
    to: EXPIRED
    trigger: system (automatic when now >= offer.expires_at AND offer.status == ISSUED)
    actor: system
    preconditions: []
    side_effects:
    - subject.credit_monitoring_status := EXPIRED
  - from: ISSUED
    to: CANCELLED
    trigger: POST /incidents/{incidentId}/credit-monitoring-offers/{offerId}/cancel
    actor: PrivacyCounsel
    preconditions:
    - incident.notification_status != COMPLETED
    side_effects:
    - subject.credit_monitoring_status := NOT_OFFERED
    - recompute incident.credit_monitoring_offered
- entity: CallCenterStaffingPlan
  initial_state: ACTIVE
  terminal_states:
  - SUPERSEDED
  - CLOSED
  transitions:
  - from: ACTIVE
    to: SUPERSEDED
    trigger: system (when a new CallCenterStaffingPlan with effective_from >= current plan's effective_from is created for the same incident)
    actor: system
    preconditions:
    - new plan.effective_from >= current plan.effective_from
    - new plan.effective_from < current plan.effective_until (strict overlap required to supersede; touching edges do not supersede)
    side_effects:
    - increments Incident.version by 1
  - from: ACTIVE
    to: CLOSED
    trigger: POST /incidents/{incidentId}/call-center-staffing-plans/{planId}/close
    actor: IncidentCommander
    preconditions:
    - incident.notification_status == COMPLETED
    side_effects: []
- entity: RegulatorSubmission
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /incidents/{incidentId}/regulator-submissions/{subId}/submit
    actor: PrivacyCounsel
    preconditions:
    - notice.status IN {APPROVED, LOCKED_FOR_MAIL}
    - jurisdiction_evaluation.requires_ag_notification == true
    - jurisdiction_evaluation.status == TRIGGERED
    side_effects:
    - submission.submitted_at := now
    - increments Incident.version by 1
  - from: SUBMITTED
    to: ACKNOWLEDGED
    trigger: POST /incidents/{incidentId}/regulator-submissions/{subId}/acknowledge
    actor: PrivacyCounsel
    preconditions: []
    side_effects: []
  - from: ACKNOWLEDGED
    to: INQUIRY_OPEN
    trigger: POST /incidents/{incidentId}/regulator-submissions/{subId}/open-inquiry
    actor: PrivacyCounsel
    preconditions: []
    side_effects: []
  - from: INQUIRY_OPEN
    to: INQUIRY_RESPONDED
    trigger: POST /incidents/{incidentId}/regulator-submissions/{subId}/respond-inquiry
    actor: GeneralCounsel
    preconditions:
    - 'seg-of-duty: acting GeneralCounsel X-User-ID != submission''s original submitter X-User-ID'
    side_effects: []
  - from: INQUIRY_RESPONDED
    to: CLOSED
    trigger: POST /incidents/{incidentId}/regulator-submissions/{subId}/close
    actor: PrivacyCounsel
    preconditions: []
    side_effects: []
  - from: ACKNOWLEDGED
    to: CLOSED
    trigger: POST /incidents/{incidentId}/regulator-submissions/{subId}/close
    actor: PrivacyCounsel
    preconditions: []
    side_effects: []
- entity: RemediationAction
  initial_state: OPEN
  terminal_states:
  - VERIFIED
  - CANCELLED
  transitions:
  - from: OPEN
    to: IN_PROGRESS
    trigger: POST /incidents/{incidentId}/remediation-actions/{actionId}/start
    actor: IncidentCommander
    preconditions: []
    side_effects: []
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: POST /incidents/{incidentId}/remediation-actions/{actionId}/complete
    actor: IncidentCommander
    preconditions: []
    side_effects: []
  - from: COMPLETED
    to: VERIFIED
    trigger: POST /incidents/{incidentId}/remediation-actions/{actionId}/verify
    actor: GeneralCounsel
    preconditions:
    - 'seg-of-duty: verifying GeneralCounsel X-User-ID != action.owner_user_id'
    side_effects:
    - 'if all RemediationAction rows for incident are in {VERIFIED, CANCELLED}: incident.remediation_status := VERIFIED'
  - from: OPEN
    to: CANCELLED
    trigger: POST /incidents/{incidentId}/remediation-actions/{actionId}/cancel
    actor: IncidentCommander
    preconditions: []
    side_effects: []
concurrency_rules:
- rule_id: notice-create-stale-incident
  parent_entity: Incident
  write_endpoint: POST /incidents/{incidentId}/notices
  occ_field: expected_incident_version
  description: 'Creating a Notice against an Incident whose version has advanced since

    the client last observed it is rejected with ERR_STALE_VERSION. This

    captures the case where another writer has just amended the ForensicScope

    or transitioned the Incident''s notification_status, so the current

    writer''s drafting context is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: mailing-batch-create-stale-incident
  parent_entity: Incident
  write_endpoint: POST /incidents/{incidentId}/mailing-batches
  occ_field: expected_incident_version
  description: 'Creating a MailingBatch against an Incident whose version has advanced

    since the client last observed it is rejected with ERR_STALE_VERSION.

    The client''s view of recipient_count and notification_status may no

    longer reflect the actual incident state.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: notification_deadline
  trigger: On incident confirmation (investigation_status INVESTIGATING -> CONFIRMED); runs once per JurisdictionEvaluation transitioning to TRIGGERED
  algorithm: chronological
  formula: '# Base variant: CALENDAR_DAYS

    #   deadline_at = determination_at + deadline_days (simple date arithmetic, no skipping)

    # Variant: BUSINESS_DAYS

    #   deadline_at = walk forward from determination_at, counting only Mon-Fri

    #   (excluding US federal holidays, hardcoded list) until deadline_days counted

    # Both variants pin evaluation order:

    #   1) determination_at is fixed at the moment of CONFIRMED transition (server-stamped)

    #   2) add days per variant rule

    #   3) result is a UTC datetime at 23:59:59.999 of the final day

    '
  input_set: JurisdictionEvaluation rows with status == TRIGGERED for the incident; determination_at taken from the CONFIRMED transition timestamp
  constants:
    US_FEDERAL_HOLIDAYS_2026: 2026-01-01,2026-01-19,2026-02-16,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-10-12,2026-11-11,2026-11-26,2026-12-25
    END_OF_DAY: T23:59:59.999Z
  precision: ISO8601 UTC datetime at millisecond precision
  variants:
  - name: calendar_days
    when: JurisdictionEvaluation.deadline_kind == CALENDAR_DAYS
    difference: Adds deadline_days directly to determination_at date; result is end-of-day on that future calendar date
  - name: business_days
    when: JurisdictionEvaluation.deadline_kind == BUSINESS_DAYS
    difference: Skips Saturdays, Sundays, and listed US federal holidays while counting deadline_days forward; result is end-of-day on the Nth business day
- name: incident_risk_score
  trigger: On ForensicScope baseline/amend, on AffectedSubject add/verify/exclude, on incident CONFIRMED transition
  algorithm: weighted_scoring
  formula: '# Inputs: data_elements_at_risk (list), exfiltration_likelihood_pct (0-100),

    #         total_affected_subjects (count), source_channel (enum)

    # Element weights: SSN=20, DRIVER_LICENSE=15, PASSPORT=15, FINANCIAL_ACCOUNT=18,

    #                  HEALTH_RECORD=18, BIOMETRIC=20, CREDENTIALS=15, DOB=8,

    #                  NAME=2, EMAIL=3, PHONE=3, ADDRESS=4

    # Channel multiplier: LAW_ENFORCEMENT=1.2, THIRD_PARTY_REPORT=1.1, else 1.0

    # Volume bonus: min(20, floor(total_affected_subjects / 500))

    # Base = (sum of element weights) * channel_multiplier + volume_bonus

    # Conservative variant:        risk_score_conservative = min(100, round(Base))

    # Likelihood-adjusted variant: risk_score_likelihood_adjusted = min(100, round(Base * exfiltration_likelihood_pct / 100))

    # Pinned evaluation order: (1) sum element weights, (2) multiply by channel multiplier,

    #   (3) add volume bonus, (4) for conservative: round half-up; for likelihood-adjusted:

    #   multiply by exfiltration_likelihood_pct/100 THEN round half-up. Rounding is the

    #   LAST step in each variant; intermediate values are not rounded.

    '
  input_set: ForensicScope with status IN {BASELINED, AMENDED, FINAL} (latest by updated_at); AffectedSubject rows with status IN {IDENTIFIED, VERIFIED, NOTICE_QUEUED, NOTIFIED}
  constants:
    WEIGHT_SSN: 20
    WEIGHT_DRIVER_LICENSE: 15
    WEIGHT_PASSPORT: 15
    WEIGHT_FINANCIAL_ACCOUNT: 18
    WEIGHT_HEALTH_RECORD: 18
    WEIGHT_BIOMETRIC: 20
    WEIGHT_CREDENTIALS: 15
    WEIGHT_DOB: 8
    WEIGHT_NAME: 2
    WEIGHT_EMAIL: 3
    WEIGHT_PHONE: 3
    WEIGHT_ADDRESS: 4
    CHANNEL_MULT_LAW_ENFORCEMENT: 1.2
    CHANNEL_MULT_THIRD_PARTY: 1.1
    VOLUME_BONUS_CAP: 20
    VOLUME_BONUS_DIVISOR: 500
  precision: integer 0-100, round_half_up at the final step only
  variants:
  - name: conservative
    when: Stored in incident.risk_score_conservative
    difference: Does not discount by exfiltration_likelihood_pct; assumes worst-case misuse
  - name: likelihood_adjusted
    when: Stored in incident.risk_score_likelihood_adjusted
    difference: Multiplies base by exfiltration_likelihood_pct/100 before rounding; same inputs produce a strictly lower score whenever exfiltration_likelihood_pct < 100
- name: credit_monitoring_cost_cents
  trigger: Computed read on GET /incidents/{incidentId}/cost-summary; recomputed whenever a CreditMonitoringOffer transitions status
  algorithm: aggregation
  formula: '# Rounding order is PINNED: per-offer cost is computed and rounded to the

    # cent FIRST, then summed across offers. "Sum then round" produces a

    # different total when term_months * unit_cost_cents has fractional cents

    # (it does not here — all integers — but the proration rule below introduces

    # fractions when an offer is cancelled mid-term).

    #

    # Per-offer cost:

    #   base_offer_cents   = term_months * unit_cost_cents

    #   If status == REDEEMED:   offer_cost_cents = base_offer_cents

    #   If status == DECLINED or EXPIRED: offer_cost_cents = 0

    #   If status == CANCELLED:  proration_factor = (days from ISSUED to CANCELLED) / (term_months * 30)

    #                            offer_cost_cents = round_half_up(base_offer_cents * proration_factor)

    #   If status == ISSUED:     offer_cost_cents = round_half_up(base_offer_cents * 0.10)  # reservation fee

    # Total = sum over offers (each offer''s offer_cost_cents rounded to integer cents BEFORE summing)

    '
  input_set: CreditMonitoringOffer rows for the incident in any status
  constants:
    ISSUED_RESERVATION_PCT: 0.1
    PRORATION_DAY_LENGTH: 30
  precision: integer cents; per-offer round_half_up BEFORE summing; never round the sum
  variants: []
- name: call_center_seats_required
  trigger: On CallCenterStaffingPlan creation AND on any recompute triggered by AffectedSubject status change while plan is ACTIVE
  algorithm: threshold
  formula: '# Tiered formula over incident.total_pending_subjects (call it P):

    #   P < 100                -> seats = 2

    #   100 <= P < 1000        -> seats = 2 + ceil((P - 100) / 50)

    #   1000 <= P < 10000      -> seats = 20 + ceil((P - 1000) / 250)

    #   P >= 10000             -> seats = 56 + ceil((P - 10000) / 1000)

    # Boundary rule: tiers are INCLUSIVE on the lower bound, EXCLUSIVE on the upper.

    # Multi-input interactions: if incident.severity == CRITICAL, multiply result by 1.5 and round half-up.

    # If plan.languages_supported contains more than 1 language, add 2 seats flat (applied AFTER severity multiplier).

    # Pinned evaluation order: (1) base tier, (2) severity multiplier with round_half_up,

    #   (3) language surcharge.

    '
  input_set: incident.total_pending_subjects at plan creation; incident.severity; plan.languages_supported
  constants:
    TIER1_CAP: 100
    TIER2_CAP: 1000
    TIER3_CAP: 10000
    TIER1_BASE: 2
    TIER2_BASE: 2
    TIER2_RATE_PER: 50
    TIER3_BASE: 20
    TIER3_RATE_PER: 250
    TIER4_BASE: 56
    TIER4_RATE_PER: 1000
    CRITICAL_MULTIPLIER: 1.5
    MULTILANG_SURCHARGE: 2
  precision: integer seat count, round_half_up at multiplier step
  variants: []
- name: jurisdiction_subjects_count
  trigger: On AffectedSubject create / verify / exclude; drives JurisdictionEvaluation.subjects_in_jurisdiction and notification_required flag
  algorithm: aggregation
  formula: '# subjects_in_jurisdiction = count of AffectedSubject rows where

    #   residence_state_code == JurisdictionEvaluation.state_code

    #   AND status IN {IDENTIFIED, VERIFIED, NOTICE_QUEUED, NOTIFIED}

    #   (EXCLUDED subjects do NOT count)

    # notification_required = (subjects_in_jurisdiction >= record_count_threshold)

    # Boundary: >= is INCLUSIVE — exactly at threshold DOES trigger notification.

    '
  input_set: AffectedSubject rows for the incident filtered by state_code and status
  constants: {}
  precision: integer count
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and one of the declared role names; X-User-ID header present and non-empty
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: Role is permitted to invoke the endpoint per §1.5 roles list
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Every path-template id (incidentId, scopeId, itemId, subjectId, noticeId, batchId, offerId, planId, subId, actionId, jurisdictionEvaluationId) resolves to an existing row; validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: existence
  check: Foreign keys in request body (jurisdiction_evaluation_id, notice_id, supersedes_notice_id) resolve to existing rows in the same incident
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: POST/PUT/PATCH endpoints with body FKs
- priority: 5
  category: state
  check: Target entity is in a state from which the requested transition is allowed per §1.2
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all transition/action endpoints
- priority: 6
  category: state
  check: Incident-level parallel state preconditions (e.g., notice.approve requires incident.investigation_status == CONFIRMED; mailing batch start-production requires incident.notification_status == DISPATCHING)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: transition endpoints with cross-entity preconditions
- priority: 7
  category: business_safety
  check: EvidenceItem seal requires preservation_hash matching ^[0-9a-f]{64}$; custody log creation requires no overlapping half-open interval for the same evidence_item_id
  error_id: ERR_CUSTODY_OVERLAP
  http_status: 409
  applies_to: POST /incidents/{incidentId}/evidence-items/{itemId}/seal, POST /incidents/{incidentId}/custody-logs
- priority: 8
  category: business_safety
  check: 'Segregation of duties: notice.approve requires acting GeneralCounsel X-User-ID != the PrivacyCounsel X-User-ID who created the notice; remediation-action.verify requires acting GeneralCounsel
    X-User-ID != action.owner_user_id; regulator-submission.respond-inquiry requires acting GeneralCounsel X-User-ID != submission''s original submitter'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 409
  applies_to: POST /incidents/{incidentId}/notices/{noticeId}/approve, POST /incidents/{incidentId}/remediation-actions/{actionId}/verify, POST /incidents/{incidentId}/regulator-submissions/{subId}/respond-inquiry
- priority: 9
  category: business_temporal
  check: notice.approve requires jurisdiction_evaluation.deadline_at > now; mailing-batch.mark-shipped requires batch.scheduled_ship_date <= now; credit-monitoring-offer.redeem requires offer.expires_at
    > now
  error_id: ERR_DEADLINE_PASSED
  http_status: 409
  applies_to: POST .../approve, POST .../mark-shipped, POST .../redeem
- priority: 10
  category: business_referential
  check: AffectedSubject.data_elements_exposed must be a subset of the incident's current ForensicScope.data_elements_at_risk whenever the scope is in {BASELINED, AMENDED, FINAL}
  error_id: ERR_DATA_ELEMENT_OUT_OF_SCOPE
  http_status: 422
  applies_to: POST /incidents/{incidentId}/affected-subjects, POST /incidents/{incidentId}/affected-subjects/{subjectId}/verify
- priority: 11
  category: business_constraint
  check: 'Notice supersession chain must be acyclic: notice.supersedes_notice_id must not form a cycle back to the notice being created'
  error_id: ERR_SUPERSESSION_CYCLE
  http_status: 422
  applies_to: POST /incidents/{incidentId}/notices
- priority: 12
  category: business_constraint
  check: CallCenterStaffingPlan effective_from < effective_until; new plan's effective interval must not partially overlap any other ACTIVE plan's interval for the same incident (touching edges allowed;
    half-open interval semantics [from, until))
  error_id: ERR_STAFFING_PLAN_OVERLAP
  http_status: 409
  applies_to: POST /incidents/{incidentId}/call-center-staffing-plans
- priority: 13
  category: business_constraint
  check: AffectedSubject.external_subject_ref unique per incident among rows with status != EXCLUDED
  error_id: ERR_DUPLICATE_SUBJECT
  http_status: 409
  applies_to: POST /incidents/{incidentId}/affected-subjects
- priority: 14
  category: business_constraint
  check: 'CreditMonitoringOffer: at most one offer with status == ISSUED per affected_subject_id at any time'
  error_id: ERR_OFFER_ALREADY_ACTIVE
  http_status: 409
  applies_to: POST /incidents/{incidentId}/credit-monitoring-offers
- priority: 15
  category: business_fiscal
  check: 'call-center-staffing-plan creation: seats_required computed via call_center_seats_required formula must be >= 2 (defensive floor)'
  error_id: ERR_INVALID_REQUEST
  http_status: 422
  applies_to: POST /incidents/{incidentId}/call-center-staffing-plans
- priority: 16
  category: business_fiscal
  check: CreditMonitoringOffer.term_months IN {12, 24}; unit_cost_cents > 0
  error_id: ERR_INVALID_REQUEST
  http_status: 422
  applies_to: POST /incidents/{incidentId}/credit-monitoring-offers
- priority: 17
  category: existence
  check: 'optimistic-concurrency: expected_incident_version in payload must equal current incident.version; otherwise ERR_STALE_VERSION (412)'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /incidents/{incidentId}/notices, POST /incidents/{incidentId}/mailing-batches
endpoints:
- method: POST
  path: /incidents
  description: Create a new breach incident
  roles:
  - IncidentCommander
  code: 201
  input:
  - title
  - discovered_at
  - occurred_at
  - source_channel
  output: Incident
  side_effects:
  - incident initialized with investigation_status=INTAKE, notification_status=NOT_REQUIRED, version=1
- method: GET
  path: /incidents
  description: List incidents (paginated; filter by severity, investigation_status, notification_status)
  roles:
  - IncidentCommander
  - ForensicLead
  - PrivacyCounsel
  - GeneralCounsel
  - DataAnalyst
  - Auditor
  code: 200
  input:
  - severity?
  - investigation_status?
  - notification_status?
  - limit?
  - offset?
  output: Incident[]
  side_effects: []
- method: GET
  path: /incidents/{id}
  description: Read one incident
  roles:
  - IncidentCommander
  - ForensicLead
  - PrivacyCounsel
  - GeneralCounsel
  - DataAnalyst
  - Auditor
  code: 200
  input: []
  output: Incident
  side_effects: []
- method: POST
  path: /incidents/{id}/confirm
  description: Confirm the breach (transitions investigation_status INVESTIGATING -> CONFIRMED, cascades jurisdiction triggers)
  roles:
  - IncidentCommander
  code: 200
  input: []
  output: Incident
  side_effects:
  - cascade jurisdiction triggers
  - recompute risk scores
  - increment Incident.version
- method: POST
  path: /incidents/{id}/contain
  description: Mark the incident as contained
  roles:
  - IncidentCommander
  code: 200
  input: []
  output: Incident
  side_effects:
  - increment Incident.version
- method: POST
  path: /incidents/{id}/close
  description: Close the incident (terminal)
  roles:
  - IncidentCommander
  code: 200
  input: []
  output: Incident
  side_effects:
  - increment Incident.version
- method: POST
  path: /incidents/{id}/forensic-scopes
  description: Create a forensic scope (first creation transitions incident INTAKE -> SCOPED)
  roles:
  - IncidentCommander
  - ForensicLead
  code: 201
  input:
  - scope_statement
  - systems_in_scope
  - data_elements_at_risk
  - exfiltration_likelihood_pct
  output: ForensicScope
  side_effects:
  - incident INTAKE -> SCOPED
  - recompute risk scores
  - increment Incident.version
- method: GET
  path: /incidents/{id}/forensic-scopes
