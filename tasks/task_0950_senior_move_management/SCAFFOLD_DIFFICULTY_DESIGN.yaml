              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /vendors"
              payload: { name: "Bright Path Cleaning", vendor_type: "CLEANING", coi_expires_on: "2027-01-31", daily_capacity: 3, holdback_pct: 0.10 }
              as: PLATFORM_ADMIN
              captures: { vc: "$.data.id" }
            - call: "POST /vendor-assignments"
              payload: { engagement_id: "${eng}", vendor_id: "${vc}", service_kind: "CLEANING", service_date: "2026-06-16", quoted_cents: 85000 }
              as: MOVE_MANAGER
              captures: { va: "$.data.id" }
            - call: "POST /vendor-assignments/${va}/accept"
              payload: {}
              as: VENDOR
              as_user_id: "${vc}"
            - call: "POST /vendor-assignments/${va}/schedule"
              payload: {}
              as: MOVE_MANAGER
            - call: "GET /invoices"
              payload: { engagement_id: "${eng}" }
              as: BILLING_ADMIN
              captures: { inv: "$.data[0].id", iv0: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /vendor-assignments/${va}/perform"
              payload: { performed_at_utc: "2026-06-16T09:00:00.000Z" }
              as: VENDOR
              as_user_id: "${vc}"
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv}", line_type: "MANUAL_ADJUSTMENT", amount_cents: 5000, memo: "Packing material top-up", expected_invoice_version: "${iv0}" }
              as: BILLING_ADMIN
              captures: { errocc: "$.data.error_id" }
            - call: "GET /invoices/${inv}"
              payload: {}
              as: BILLING_ADMIN
              captures: { iv1: "$.data.version" }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv}", line_type: "MANUAL_ADJUSTMENT", amount_cents: 5000, memo: "Packing material top-up", expected_invoice_version: "${iv1}" }
              as: BILLING_ADMIN
              captures: { lnm: "$.data.id" }
          assert:
            - "after the first trigger call, VendorAssignment.${va}.status == PERFORMED, holdback_cents == 8500 and paid_cents == 76500"
            - "after the first trigger call, exactly one InvoiceLine on Invoice.${inv} has line_type VENDOR_PASSTHROUGH with amount_cents == 85000"
            - "after the first trigger call, Invoice.${inv}.version == ${iv0} + 1 and subtotal_cents == 85000"
            - "the second trigger call responds 412 and ${errocc} == ERR_STALE_INVOICE_VERSION"
            - "the loser's write did not land: no InvoiceLine on Invoice.${inv} has line_type MANUAL_ADJUSTMENT at that point and subtotal_cents is still 85000"
            - "${iv1} == ${iv0} + 1"
