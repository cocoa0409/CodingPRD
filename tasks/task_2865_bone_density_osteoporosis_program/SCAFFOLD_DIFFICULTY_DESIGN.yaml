              payload: { scan_order_id: "${order3_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-10T08:30:00Z", end_utc: "2026-03-10T09:00:00Z" }
              as: Scheduler
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order2_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-10T09:45:00Z", end_utc: "2026-03-10T10:15:00Z" }
              as: Scheduler
            - call: "POST /bone-density/scan-appointments"
