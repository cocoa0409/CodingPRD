              payload: { hour_bucket_utc: "2026-09-01T00:00:00Z", infra_host_count: 5, container_host_count: 1, serverless_invocation_count: 10 }
              as: IngestionAgent
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/host-hour-records"
              payload: { hour_bucket_utc: "2026-09-01T00:00:00Z", infra_host_count: 99, container_host_count: 0, serverless_invocation_count: 0 }
              as: IngestionAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_DUPLICATE_HOST_HOUR"

      - name: open_incidents_block_period_close
