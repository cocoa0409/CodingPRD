      - name: borrower_cannot_pay_for_foreign_facility_forbidden
        claim_type: rbac_exclusive_denial
        grounds: ['roles[Borrower]', 'errors[ERR_NOT_RESOURCE_OWNER]', 'validations[priority=3]']
        distinguishing_aspect: "Borrower B2 paying a facility owned by B1 -> 403 ERR_NOT_RESOURCE_OWNER."
