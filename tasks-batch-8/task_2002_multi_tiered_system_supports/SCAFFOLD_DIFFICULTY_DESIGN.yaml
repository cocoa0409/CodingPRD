              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${a2_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id }
            # 3 NON_RESPONSIVE probes → weeks_at_tier3_unresponsive = 3
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${a2_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-18", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${a2_id}/plans/${p_id}/probes"
              payload: { administered_on: "2026-08-25", score: 50 }
              as: InterventionistRole
              as_user_id: "${i_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
