            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { s1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${s1}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${s1}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 15000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000, restatement_of_id: "${s1}" }, as: CreditAnalyst, as_user_id: "${an}", captures: { s2: $.data.id } }
            - { call: "POST /credit/financial-statements/${s2}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${s2}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
          trigger:
            - { call: "GET /credit/financial-statements?loan_application_id=${app}", as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "GET /credit/financial-statements?restatement_of_id=${s1}", as: CreditAnalyst, as_user_id: "${an}" }
          assert:
            - "?loan_application_id=${app}: array of length 2 (${s1} SUPERSEDED, ${s2} FINAL)"
            - "?restatement_of_id=${s1}: array of length 1 containing only ${s2}"
            - "?loan_application_id=${app}&restatement_of_id absent target ${s2}: filtering by restatement_of_id=${s2} returns an empty array (nothing restates S2)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: submit_moves_application_to_spreading
        claim_type: valid_transition
        grounds: [state_machines.LoanApplication.INTAKE_to_SPREADING]
        distinguishing_aspect: "The submit trigger moves INTAKE -> SPREADING with the parent application otherwise unchanged."
        test_recipe:
          setup: ["Officer rm + analyst an; borrower; application INTAKE with one SUBMITTED statement attached"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
          trigger:
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { st: $.data.status } }
          assert:
            - "LoanApplication.${app}.status == SPREADING after submit (200)"
            - "FinancialStatement.${stmt}.status remains SUBMITTED (submit does not touch statements)"

      - name: submit_twice_rejected_invalid_state
        claim_type: idempotency
        grounds: [state_machines.LoanApplication.INTAKE_to_SPREADING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the submit trigger after it succeeded is rejected: SPREADING is not a legal from-state for submit."
        test_recipe:
          setup: ["Application already in SPREADING (submitted once)"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
          trigger:
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { err: $.data.error_id } }
          assert:
            - "second submit: status 409, error_id == ERR_INVALID_STATE"
            - "LoanApplication.${app}.status == SPREADING (unchanged by the rejected repeat)"

      - name: finalize_spreads_from_intake_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LoanApplication.SPREADING_to_APPRAISAL_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "finalize-spreads on an INTAKE application is rejected with the state error (priority 6), even though its statements are also not FINAL — the from-state guard fires first."
        test_recipe:
          setup: ["Application in INTAKE with one SUBMITTED statement (never submitted to spreading)"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
          trigger:
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { err: $.data.error_id } }
          assert:
            - "status 409, error_id == ERR_INVALID_STATE (INTAKE is not SPREADING)"
            - "no dscr_standard/risk_rating written: LoanApplication.${app}.dscr_standard == null"

      - name: withdraw_is_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LoanApplication.INTAKE_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: both a second withdraw and a submit against the withdrawn application fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Application in INTAKE with one statement; then withdrawn"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/withdraw", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /credit/loan-applications/${app}/withdraw", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { err1: $.data.error_id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { err2: $.data.error_id } }
          assert:
            - "first withdraw succeeded: status == WITHDRAWN"
            - "second withdraw: 409 ERR_INVALID_STATE (terminal lockdown)"
            - "submit after withdraw: 409 ERR_INVALID_STATE (no outgoing transitions from WITHDRAWN)"

      - name: statement_spread_finalize_records_officers
        claim_type: side_effect_execution
        grounds: [state_machines.FinancialStatement.SUBMITTED_to_SPREAD, state_machines.FinancialStatement.SPREAD_to_FINAL]
        distinguishing_aspect: "The spread and finalize transitions stamp spread_by_officer_id / finalized_by_officer_id from X-User-ID and advance SUBMITTED -> SPREAD -> FINAL in order."
        test_recipe:
          setup: ["Application in SPREADING with one SUBMITTED statement"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
          trigger:
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { st1: $.data.status, spread_by: $.data.spread_by_officer_id } }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { st2: $.data.status, fin_by: $.data.finalized_by_officer_id } }
          assert:
            - "after spread: status == SPREAD and spread_by_officer_id == ${an}"
            - "after finalize: status == FINAL and finalized_by_officer_id == ${an}"

      - name: superseded_statement_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FinancialStatement.FINAL_to_SUPERSEDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUPERSEDED is terminal: once a restatement finalizes and supersedes the original, spreading the superseded original is rejected."
        test_recipe:
          setup: ["Application SPREADING; S1 FINAL; S2 restating S1 spread and finalized so S1 -> SUPERSEDED"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 11000000, addbacks_cents: 3000000, distributions_cents: 800000, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { s1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${s1}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${s1}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, ebitda_cents: 15000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000, restatement_of_id: "${s1}" }, as: CreditAnalyst, as_user_id: "${an}", captures: { s2: $.data.id } }
            - { call: "POST /credit/financial-statements/${s2}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${s2}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { s2_st: $.data.status } }
          trigger:
