              as: WarrantyAnalyst
              captures: { vin_a_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_a_id}", mode_code: "FM-A-CORE", description: "Legacy compressor core wear", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
