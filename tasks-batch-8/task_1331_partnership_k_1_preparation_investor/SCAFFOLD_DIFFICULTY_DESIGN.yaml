      - name: composite_min_income_inclusive_boundary
        grounds:
          - calculations.composite_tax
          - validations[priority=15]
        distinguishing_aspect: |
          Metric: state-source income vs an inclusive >= threshold, reached via
          POST /funds/composite-filings/{id}/file: partners at exactly 150050 ==
