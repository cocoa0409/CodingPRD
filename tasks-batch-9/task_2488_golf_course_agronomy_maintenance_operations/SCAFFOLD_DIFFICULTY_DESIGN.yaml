# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# ===========================================================================
# Every instance grounds in elements already declared in SCAFFOLD.yaml
# §1.1-§1.7. Deleting this file leaves the scaffold's declared behaviour
# identical; it only makes coverage harder to audit.
#
# Shared fixture conventions used by every instance below:
#   * The logical clock starts at its declared default 2026-08-01T00:00:00Z.
#     An instance only calls POST /_clock/set_current_utc when it needs a
#     different instant.
#   * Opaque-role callers carry stable literal X-User-ID values
#     ("super-1", "agro-1", "agro-2", "tourn-1", "tech-1") so segregation of
#     duties is observable. Applicator callers carry the Applicator.id
#     captured from POST /applicators.
#   * Every numeric literal in an `assert:` was computed by executing the
#     matching §1.3 formula against its `constants:` in exact decimal
#     arithmetic with round-half-up.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: turf_nitrogen_applied_actual_vs_planned_commitment
        grounds:
          - calculations.turf_nitrogen_load
          - calculations.application_mass_and_nitrogen
          - entities.TurfArea.fields.nitrogen_applied_lb_per_1000_ytd
          - entities.TurfArea.fields.nitrogen_projected_lb_per_1000
          - validations[priority=31]
        distinguishing_aspect: |
          This dual variant lives on the TurfArea regulatory-load domain: the
          applied_actual variant counts only nitrogen already in the ground
          (RECORDED/VERIFIED Application rows) while the planned_commitment
          variant additionally adds the per-1000 rates of PLANNED and SCHEDULED
          FERTILITY tasks, so the same database yields 2.113 and 2.963 at the
          same instant on the same field pair.
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN (hole 7, 40 ft from water)."
            - "One DRAFT agronomic plan for 2026 carrying one PLANNED FERTILITY task on that green at 0.85 lb N per 1000 sq ft."
            - "One licensed applicator (CAT_3_TURF, license good through 2027-06-30) and one urea product at 46 percent nitrogen, no posting required."
            - "One RECORDED application of that product on the green at 200 lb per acre."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000, water_restricted_threshold_pct: 80, water_suspended_threshold_pct: 100 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA", target_moisture_pct: 18 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 8.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-11001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Urea 46-0-0", epa_reg_no: "NA-FERT-0001", requires_license_category: "CAT_3_TURF", rei_hours: 0, min_buffer_ft: 0, max_wind_speed_mph: 15, posting_required: false, nitrogen_pct: 46 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { urea_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 200, wind_speed_mph: 5, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app1_id: $.data.id }
          assert:
            - "Application.${app1_id}.total_lb == 25.25"
            - "Application.${app1_id}.nitrogen_lb == 11.62"
            - "TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 2.113"
            - "TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 == 2.963"
            - "TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 - TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 0.850"
            - "PlanTask.${task1_id}.status == PLANNED and PlanTask.${task1_id}.commitment_lb == 4.68"

      - name: equipment_replacement_score_now_vs_fiscal_year_projection
        grounds:
          - calculations.equipment_replacement_score
          - entities.EquipmentUnit.fields.replacement_score
          - entities.EquipmentUnit.fields.replacement_score_projected
          - entities.EquipmentUnit.fields.replacement_flag
          - state_machines.EquipmentUnit.IN_SERVICE_to_DOWN_FOR_SERVICE
        distinguishing_aspect: |
          This dual variant lives on the EquipmentUnit capital-planning domain,
          a different entity domain from the TurfArea nitrogen instance: the
          as_of_now variant reads the meter as logged (81.8) while the
          fy_projection variant adds avg_daily_hours times the 152 whole days
          remaining to 31 December of the clock's year (85.7), and only the
          projected variant feeds replacement_flag.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z, so 152 whole days remain to the fiscal year end."
            - "One course and one 2018 triplex greens mower with a 6000 hour design life, a 250 hour service interval, 3.5 average daily hours and 4200 hours already on the meter."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "TRIPLEX_GREENS_MOWER", model_year: 2018, purchase_cost: 38000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.5, initial_engine_hours: 4200 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { unit1_id: $.data.id, unit1_score: $.data.replacement_score, unit1_proj: $.data.replacement_score_projected }
          trigger:
            - call: "POST /equipment-units/${unit1_id}/log-hours"
              payload: { hours_added: 300 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
          assert:
            - "at creation EquipmentUnit.${unit1_id}.replacement_score == 59.5 and replacement_score_projected == 63.5 and replacement_flag == false"
            - "EquipmentUnit.${unit1_id}.engine_hours == 4500.0"
            - "EquipmentUnit.${unit1_id}.hours_since_service == 300.0"
            - "EquipmentUnit.${unit1_id}.replacement_score == 81.8"
            - "EquipmentUnit.${unit1_id}.replacement_score_projected == 85.7"
            - "EquipmentUnit.${unit1_id}.replacement_flag == true"
            - "EquipmentUnit.${unit1_id}.status == DOWN_FOR_SERVICE"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: plan_ledger_rounds_per_task_then_sums_mode_b
        grounds:
          - calculations.plan_nitrogen_commitment_lb
          - entities.AgronomicPlan.fields.committed_nitrogen_lb
          - entities.PlanTask.fields.commitment_lb
          - state_machines.PlanTask.PLANNED_to_SCHEDULED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order changes the cents. Both tasks
          carry a half-cent remainder (4.675 and 3.225), so rounding per task
          then summing gives 7.91 while summing the exact products then
          rounding once gives 7.90; the scaffold pins the per-task order.
        test_recipe:
          setup:
            - "One course with a 5500 sq ft green at hole 7 and a 4300 sq ft green at hole 12."
            - "One 2026 plan with an 8.00 lb nitrogen budget, two PLANNED FERTILITY tasks at 0.85 and 0.75 lb per 1000, submitted by agro-1 and approved by super-1 so the plan is ACTIVE."
            - "Two SCHEDULED maintenance windows, one on each green, each contained in its task's planned window."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 4300, mowing_height_mm: 3.2, distance_to_water_ft: 200, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 8.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id, task1_commit: $.data.commitment_lb }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.75, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task2_id: $.data.id, task2_commit: $.data.commitment_lb }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", window_start: "2026-08-12T05:00:00Z", window_end: "2026-08-12T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win1_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", window_start: "2026-08-13T05:00:00Z", window_end: "2026-08-13T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win2_id: $.data.id }
          trigger:
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${win1_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /agronomic-plans/${plan_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_after_t1: $.data.version }
            - call: "POST /plan-tasks/${task2_id}/schedule"
              payload: { maintenance_window_id: "${win2_id}", expected_plan_version: "${plan_v_after_t1}" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "PlanTask.${task1_id}.commitment_lb == 4.68"
            - "PlanTask.${task2_id}.commitment_lb == 3.23"
            - "AgronomicPlan.${plan_id}.committed_nitrogen_lb == 7.91"
            - "AgronomicPlan.${plan_id}.committed_nitrogen_lb != 7.90 (the sum-then-round order is rejected)"
            - "after the first schedule only, AgronomicPlan.${plan_id}.committed_nitrogen_lb == 4.68"
            - "MaintenanceWindow.${win1_id}.plan_task_id == ${task1_id}"

      - name: water_overage_tier_keyed_on_base_charge_mode_c
        grounds:
          - calculations.water_overage_assessment
          - calculations.course_water_posture
          - entities.Course.fields.water_used_gal
          - state_machines.IrrigationRun.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation
          order: total_charge depends on surcharge, surcharge depends on the
          tier, and the tier looks like it should be keyed on total_charge but
          is keyed on base_charge from step 2. With 7600.0 gal used against a
          7000 gal allocation the pinned order gives tier T1 and 25.24; keying
          the tier on total_charge instead gives 25.54.
        test_recipe:
          setup:
            - "One course with a 7000 gal annual allocation."
            - "One 130000 sq ft fairway at hole 7."
            - "One RECLAIMED pump station with a 7600 gal daily cap, a 200 gpm ceiling and 3 zones, so the annual allocation check is exempt and the daily headroom is the binding constraint."
            - "One irrigation run over a 60 minute window replacing a 10 point moisture deficit, completed for its full duration."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 7000, water_restricted_threshold_pct: 80, water_suspended_threshold_pct: 100 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "FAIRWAY", hole_number: 7, area_sq_ft: 130000, mowing_height_mm: 12.7, distance_to_water_ft: 15, soil_type: "NATIVE_LOAM" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { fw7_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "RECLAIMED", max_flow_gpm: 200, max_concurrent_zones: 3, daily_withdrawal_cap_gal: 7600 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${fw7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_v}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /irrigation-runs/${run1_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /courses/${course_id}/water-assessment"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { assessed_tier: $.data.tier, assessed_total: $.data.total_charge }
          assert:
            - "IrrigationRun.${run1_id}.allotted_gal == 7600.0"
            - "IrrigationRun.${run1_id}.flow_gpm == 126.67"
            - "IrrigationRun.${run1_id}.volume_gal == 7600.0"
            - "Course.${course_id}.water_used_gal == 7600.0"
            - "Course.${course_id}.water_posture == SUSPENDED, since 7600.0 / 7000 * 100 == 108.571 percent clears the 100 percent threshold"
            - "water-assessment.billable_gal == 600.0"
            - "water-assessment.base_charge == 24.70"
            - "water-assessment.tier == T1"
            - "water-assessment.surcharge_rate == 0.90"
            - "water-assessment.surcharge == 0.54"
            - "water-assessment.total_charge == 25.24"
            - "water-assessment.total_charge != 25.54 (the total-keyed tier order is rejected)"

      - name: irrigation_allotment_nested_min_switches_binding_constraint_mode_a
        grounds:
          - calculations.irrigation_run_allotment
          - entities.IrrigationRun.fields.allotted_gal
          - entities.IrrigationRun.fields.flow_gpm
          - validations[priority=49]
        distinguishing_aspect: |
          Mode (a) — four inputs (moisture deficit, area, water-posture factor,
          station headroom) interacting non-linearly through a nested min, so
          the binding term changes between two runs on the same station with no
          change to the formula: the 5500 sq ft green is demand-bound at 272.8
          gal while the 130000 sq ft fairway is headroom-bound at 4000.0 gal.
        test_recipe:
          setup:
            - "One course with a 100000 gal annual allocation, so the annual check never binds."
            - "One 5500 sq ft green at hole 7 and one 130000 sq ft fairway at hole 7."
            - "One WELL pump station with a 4000 gal daily cap, a 300 gpm ceiling and 2 zones."
            - "Two non-overlapping irrigation windows so neither zone nor flow capacity binds."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "FAIRWAY", hole_number: 7, area_sq_ft: 130000, mowing_height_mm: 12.7, distance_to_water_ft: 15, soil_type: "NATIVE_LOAM" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { fw7_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 300, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 4000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v: $.data.version }
          trigger:
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T04:40:00Z", target_moisture_deficit_pct: 8, expected_pump_station_version: "${pump_v}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_a_id: $.data.id }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${fw7_id}", window_start: "2026-08-05T05:00:00Z", window_end: "2026-08-05T06:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_v}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_b_id: $.data.id }
          assert:
            - "IrrigationRun.${run_a_id}.allotted_gal == 272.8 (demand term binds: 8 * 5.5 * 6.2 == 272.8 is below the 4000 gal headroom)"
            - "IrrigationRun.${run_a_id}.flow_gpm == 6.82"
            - "IrrigationRun.${run_b_id}.allotted_gal == 4000.0 (headroom term binds: the 8060.0 gal demand is clipped to the station's remaining cap)"
            - "IrrigationRun.${run_b_id}.flow_gpm == 66.67"
            - "both runs are created with status SCHEDULED and volume_gal == 0"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_record_and_posting_dimensions_advance_independently
        grounds:
          - state_machines.Application.POSTED_to_RELEASED
          - state_machines.Application.RECORDED_to_VERIFIED
          - entities.Application.fields.posting_status
          - entities.Application.fields.record_status
          - validations[priority=32]
        distinguishing_aspect: |
          Application is the parallel-dimension case: the record dimension
          (RECORDED -> VERIFIED) and the posting dimension (POSTED ->
          RELEASED) advance in either order and neither reads the other, so
          the posting can be released while the record is still unverified and
          verification afterwards leaves the posting alone. The combined state
          (RECORDED, RELEASED) is reachable and is not a state either
          dimension alone can express.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T06:00:00Z."
            - "One course and one 5500 sq ft green 40 ft from water."
            - "Two applicators: Dana (CAT_3_TURF) who sprays, and Miguel (CAT_3_AND_7) who will verify."
            - "One fungicide requiring CAT_3_TURF with a 24 hour restricted-entry interval, a 25 ft buffer, a 12 mph wind ceiling, posting required and no nitrogen."
            - "One RECORDED application by Dana at the clock instant, so posting_status is POSTED and rei_expires_at is 2026-08-11T06:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-11001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Miguel Ortiz", license_number: "OR-CAT37-22002", license_category: "CAT_3_AND_7", license_expires_on: "2028-03-31" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Fairway Guard SC", epa_reg_no: "1234-56", requires_license_category: "CAT_3_TURF", rei_hours: 24, min_buffer_ft: 25, max_wind_speed_mph: 12, posting_required: true, nitrogen_pct: 0 }
              as: Superintendent
