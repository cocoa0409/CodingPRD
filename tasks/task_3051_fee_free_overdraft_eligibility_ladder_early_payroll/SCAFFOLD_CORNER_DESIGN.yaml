        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "immediate consistency: the post-early response's EarlyPosting reflects the deposit transition, and a subsequent GET of the account in the same logical instant shows provisional_early_cents already updated — no eventual lag."
