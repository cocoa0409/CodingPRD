scaffold_corner_design:
  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: customer_creation_returns_all_fields_and_region
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with email/full_name/zip_code 90210 -> 201, install_region computed WEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "new@x.com", full_name: "New Cust", zip_code: "90210" }
              as: Anonymous
              captures: { cid: $.data.id }
          assert:
            - "response code == 201"
            - "Customer.${cid}.install_region == WEST"
            - "Customer.${cid}.version == 1"

      - name: customer_region_derivation_south_bucket
        claim_type: Computed Fields
        grounds: [entities.Customer.fields.install_region]
        distinguishing_aspect: "zip_code first digit 3 -> install_region SOUTH (computed, input ignored if supplied)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "south@x.com", full_name: "South", zip_code: "30301" }
              as: Anonymous
              captures: { cid: $.data.id }
          assert:
            - "Customer.${cid}.install_region == SOUTH"

      - name: project_not_found_returns_404
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{nonexistent-uuid} -> ERR_RESOURCE_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response.error_id == ERR_RESOURCE_NOT_FOUND"
            - "http status 404"

      - name: project_missing_required_room_type
        claim_type: Required Fields
        grounds: [entities.Project.fields.room_type, "validations[priority=21]"]
        distinguishing_aspect: "POST /projects without room_type -> ERR_VALIDATION 422."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rf@x.com", full_name: "RF", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}" }
              as: Designer
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: project_invalid_room_type_enum
        claim_type: Type Constraints
        grounds: [entities.Project.fields.room_type]
        distinguishing_aspect: "POST /projects with room_type=BATHROOM (not in enum) -> ERR_VALIDATION 422."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "enum@x.com", full_name: "Enum", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "BATHROOM" }
              as: Designer
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: project_initial_status_lead_and_system_fields
        claim_type: System Fields
        grounds: [entities.Project.fields.status, entities.Project.fields.install_region]
        distinguishing_aspect: "New project starts status LEAD, version 1, install_region copied from customer; system fields not settable by client."
        test_recipe:
          setup: ["a customer exists (zip 70001 -> WEST)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "init@x.com", full_name: "Init", zip_code: "70001" }
              as: Anonymous
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "PANTRY" }
              as: Designer
              captures: { proj: $.data.id }
          assert:
            - "Project.${proj}.status == LEAD"
            - "Project.${proj}.install_region == WEST"
            - "Project.${proj}.version == 1"

      - name: project_wrong_customer_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Project.fields.customer_id, "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /projects with non-existent customer_id -> ERR_RESOURCE_NOT_FOUND 404 (FK integrity)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "11111111-1111-1111-1111-111111111111", room_type: "GARAGE" }
              as: Designer
          assert:
            - "response.error_id == ERR_RESOURCE_NOT_FOUND"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_project_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Project.QUOTED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a project already CANCELLED -> ERR_INVALID_STATE 409; no side effects."
        test_recipe:
          setup: ["Project cancelled from LEAD"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc@x.com", full_name: "CC", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "GARAGE" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /projects/${proj}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: cancel_after_deposit_paid_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Project.LEAD_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Project in DEPOSIT_PAID cannot be cancelled (cancel allowed only in {LEAD,DESIGNING,QUOTED}) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project progressed to DEPOSIT_PAID"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dp@x.com", full_name: "DP", zip_code: "50000" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "GARAGE" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 1, linear_feet: 20, ceiling_height_in: 108 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 12, unit_price_cents: 4000 }, { component_type: "PANEL", quantity: 6, unit_price_cents: 3000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /quotes/${quote}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { qv: $.data.version }
            - call: "POST /deposits"
              payload: { project_id: "${proj}", quote_id: "${quote}", amount_cents: 17820 }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/capture"
              payload: { expected_quote_version: "${qv}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /projects/${proj}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: terminal_warranty_resolved_no_further_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WarrantyClaim.ADJUSTMENT_SCHEDULED_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RESOLVED warranty claim cannot be re-resolved -> ERR_INVALID_STATE 409 (terminal lock)."
        test_recipe:
          setup: ["WarrantyClaim resolved (FIT, adjustment path)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "wr@x.com", full_name: "WR", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 10, unit_price_cents: 5000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /quotes/${quote}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { qv: $.data.version }
            - call: "POST /deposits"
              payload: { project_id: "${proj}", quote_id: "${quote}", amount_cents: 5000000 }
              as: PlatformAdmin
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/capture"
              payload: { expected_quote_version: "${qv}" }
              as: PlatformAdmin
            - call: "GET /manufacture-orders"
              payload: { project_id: "${proj}" }
              as: ManufacturingOps
              captures: { mo: "$.data[0].id" }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: ManufacturingOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacture-orders/${mo}/complete"
              payload: {}
              as: ManufacturingOps
            - call: "POST /crews"
              payload: { crew_name: "W-term", region: "WEST", daily_capacity_units: 100 }
              as: Scheduler
              captures: { crew: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${proj}", manufacture_order_id: "${mo}", crew_id: "${crew}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T16:00:00Z" }
              as: Scheduler
              captures: { job: $.data.id }
            - call: "POST /install-jobs/${job}/book"
              payload: {}
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${job}/start"
              payload: {}
              as: Scheduler
            - call: "POST /install-jobs/${job}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /warranty-claims"
              payload: { project_id: "${proj}", install_job_id: "${job}", defect_type: "FIT" }
              as: Customer
              as_user_id: "${cust}"
              captures: { claim: $.data.id }
            - call: "POST /warranty-claims/${claim}/approve"
              payload: {}
              as: ManufacturingOps
            - call: "POST /warranty-claims/${claim}/schedule-adjustment"
              payload: {}
              as: ManufacturingOps
            - call: "POST /warranty-claims/${claim}/resolve"
              payload: {}
              as: ManufacturingOps
          trigger:
            - call: "POST /warranty-claims/${claim}/resolve"
              payload: {}
              as: ManufacturingOps
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: design_consult_render_requires_scheduled_idempotency
        claim_type: Idempotency
        grounds: [state_machines.DesignConsult.SCHEDULED_to_RENDERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rendering a consult that is already RENDERED -> ERR_INVALID_STATE (same trigger twice)."
        test_recipe:
          setup: ["DesignConsult rendered once"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rc@x.com", full_name: "RC", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
              captures: { consult: $.data.id }
            - call: "POST /design-consults/${consult}/render"
              payload: { rendering_url: "https://r/1.glb" }
              as: Designer
          trigger:
            - call: "POST /design-consults/${consult}/render"
              payload: { rendering_url: "https://r/2.glb" }
              as: Designer
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: design_consult_render_valid_transition_sets_url
        claim_type: Side Effect Execution
        grounds: [state_machines.DesignConsult.SCHEDULED_to_RENDERED]
        distinguishing_aspect: "Render transition sets rendering_url and moves SCHEDULED->RENDERED."
        test_recipe:
          setup: ["DesignConsult SCHEDULED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rv@x.com", full_name: "RV", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
              captures: { consult: $.data.id }
          trigger:
            - call: "POST /design-consults/${consult}/render"
              payload: { rendering_url: "https://r/main.glb" }
              as: Designer
          assert:
            - "DesignConsult.${consult}.status == RENDERED"
            - "DesignConsult.${consult}.rendering_url == https://r/main.glb"

      - name: first_design_consult_bubbles_project_to_designing
        claim_type: Bubble up
        grounds: [state_machines.Project.LEAD_to_DESIGNING]
        distinguishing_aspect: "Creating the first DesignConsult auto-advances Project LEAD->DESIGNING and bumps Project.version."
        test_recipe:
          setup: ["Project LEAD"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "bub@x.com", full_name: "Bub", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
          assert:
            - "Project.${proj}.status == DESIGNING"
            - "Project.${proj}.version == 2"

      - name: config_finalize_locks_measure_cross_entity
        claim_type: Cross-entity
        grounds: [state_machines.ComponentConfig.DRAFT_to_FINALIZED, entities.SpaceMeasure.fields.confirmed]
        distinguishing_aspect: "Finalizing a config sets its SpaceMeasure.confirmed=true (cross-entity side effect) and bumps SpaceMeasure.version."
        test_recipe:
          setup: ["DRAFT config on a fresh measure"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "lk@x.com", full_name: "LK", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 8, unit_price_cents: 5000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
          trigger:
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
          assert:
            - "ComponentConfig.${cfg}.status == FINALIZED"
            - "ComponentConfig.${cfg}.total_units == 8"
            - "SpaceMeasure.${meas}.confirmed == true"

      - name: quote_expiry_auto_transition_on_read
        claim_type: Valid Transition
        grounds: [state_machines.Quote.ISSUED_to_EXPIRED, entities.Quote.fields.expires_at]
        distinguishing_aspect: "An ISSUED quote read after expires_at via GET /quotes/{id} auto-transitions to EXPIRED (read-triggered sweep)."
        test_recipe:
          setup: ["Quote ISSUED at 2026-04-01, QUOTE_VALIDITY_DAYS later it is past expiry; clock advanced beyond expires_at"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "exp@x.com", full_name: "Exp", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 8, unit_price_cents: 5000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /quotes/${quote}"
              payload: {}
              as: Designer
          assert:
            - "Quote.${quote}.status == EXPIRED"

      - name: quote_accept_after_expiry_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Quote.ISSUED_to_ACCEPTED, "validations[priority=13]", "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "Accepting a quote when now > expires_at -> ERR_QUOTE_EXPIRED 409."
        test_recipe:
          setup: ["Quote ISSUED then clock advanced beyond expires_at"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "expa@x.com", full_name: "ExpA", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z" }
              as: Designer
            - call: "POST /projects/${proj}/space-measures"
              payload: { wall_count: 2, linear_feet: 12.5, ceiling_height_in: 96 }
              as: Designer
              captures: { meas: $.data.id }
            - call: "POST /projects/${proj}/component-configs"
              payload: { space_measure_id: "${meas}", material_grade: "MELAMINE", line_items: [ { component_type: "SHELF", quantity: 8, unit_price_cents: 5000 } ] }
              as: Designer
              captures: { cfg: $.data.id }
            - call: "POST /component-configs/${cfg}/finalize"
              payload: {}
              as: Designer
            - call: "POST /projects/${proj}/quotes"
              payload: { component_config_id: "${cfg}" }
              as: Designer
              captures: { quote: $.data.id }
            - call: "POST /quotes/${quote}/issue"
              payload: {}
              as: Designer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /quotes/${quote}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "response.error_id == ERR_QUOTE_EXPIRED"

      - name: measure_already_confirmed_second_finalize_rejected
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=9]", "errors[ERR_MEASURE_ALREADY_CONFIRMED]"]
        distinguishing_aspect: "Finalizing a second config against an already-confirmed SpaceMeasure -> ERR_MEASURE_ALREADY_CONFIRMED 409."
        test_recipe:
          setup: ["measure already backs a FINALIZED config; a second DRAFT config references the same measure"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "mc@x.com", full_name: "MC", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
