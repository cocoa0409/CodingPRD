  - name: retailer_suspend_then_reinstate_round_trip_restores_the_active_state
    claim_type: valid_transition
    grounds: [state_machines.Retailer.ACTIVE_to_SUSPENDED, state_machines.Retailer.SUSPENDED_to_ACTIVE,
      'endpoints[POST /comics/retailers/{id}/suspend]', 'endpoints[POST /comics/retailers/{id}/reinstate]']
    distinguishing_aspect: 'Suspension is reversible and touches nothing but status/suspension_reason:
      the ledgers (cumulative_units_ytd, open_balance_cents, discount_tier) are identical before and after
      the round trip.'
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', one ACTIVE retailer DM-2001 with opening_units_ytd
          2500 (discount_tier BASIC)]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SalesDirector
      - call: POST /comics/retailers
        payload: {account_no: DM-2001, name: Panel Palace, credit_limit_cents: 5000000, non_returnable_ack: true,
          opening_units_ytd: 2500}
        as: SalesDirector
        captures: {r1: $.data.id}
      trigger:
      - call: POST /comics/retailers/${r1}/suspend
        payload: {reason: aged balance under review}
        as: SalesDirector
      - call: POST /comics/retailers/${r1}/reinstate
        payload: {}
        as: SalesDirector
      assert: ['after the suspend: Retailer.${r1}.status == SUSPENDED with suspension_reason == ''aged
          balance under review''', 'after the reinstate: Retailer.${r1}.status == ACTIVE with suspension_reason
          == null', 'Retailer.${r1}.cumulative_units_ytd == 2500 and discount_tier == BASIC throughout',
        'Retailer.${r1}.open_balance_cents == 0 throughout', each call bumps Retailer.version by exactly
          1]
