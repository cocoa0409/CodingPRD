            - call: "POST /cidery/press-batches/${pb_if_a}/start"
              payload: {}
              as: CellarLead
            # Lot now has pressed=800, unpressed=200
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-17T08:00:00Z"
                press_window_minutes: 60
                blend_lines: []
              as: CellarLead
              captures: { pb_if_b: $.data.id }
          trigger:
            - call: "POST /cidery/press-batches/${pb_if_b}/blend-lines"
              payload: { harvest_lot_id: "${hif}", weight_lbs: 500, position: 1 }
              as: CellarLead
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INSUFFICIENT_FRUIT'"

      - name: return_window_expired_after_30_days
        claim_type: violation_to_error
