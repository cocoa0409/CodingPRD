              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { study_id: $.data.id }
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-08", period: "AM_ARRIVAL", observed_minutes: 60, child_count: 70, adult_count: 10, vehicle_count: 500, adequate_gaps: 28 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-09", period: "PM_DISMISSAL", observed_minutes: 60, child_count: 50, adult_count: 8, vehicle_count: 380, adequate_gaps: 20 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/analyze"
              payload: {}
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/finalize"
