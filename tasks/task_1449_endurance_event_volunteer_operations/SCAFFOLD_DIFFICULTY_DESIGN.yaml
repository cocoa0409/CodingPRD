  - rule_id: cross_entity_state_dependency
    instances:
      - name: signup_create_gated_by_event_state
        grounds:
          - state_machines.Event.PUBLISHED_to_LOCKED
          - validations[priority=4]
          - errors[ERR_EVENT_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair Signup x Event: signup creation against a perfectly good
          volunteer and shift is rejected solely because the EVENT moved
          PUBLISHED -> LOCKED (ERR_EVENT_NOT_PUBLISHED); the event gate precedes
          the shift gate in the documented gauntlet order.
        test_recipe:
          setup:
            - "Event was PUBLISHED with one OPEN shift and ELIGIBLE volunteer; director then ran lock-signups (Event LOCKED, Shift LOCKED)"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { sh_st: $.data.status } }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Shift.${sh}.status == LOCKED (${sh_st}) — cascaded from the event lock"
            - "create rejected with ERR_EVENT_NOT_PUBLISHED (${err}) — Signup transitions are gated on the Event's state, a cross-entity dependency"

      - name: adjustment_approve_gated_by_debrief_state
        grounds:
          - state_machines.RoleAdjustment.PROPOSED_to_APPROVED
          - state_machines.DebriefReport.DRAFT_to_SUBMITTED
          - errors[ERR_DEBRIEF_NOT_ACKNOWLEDGED]
        distinguishing_aspect: |
          Entity pair RoleAdjustment x DebriefReport (a different pair than
          Signup x Event): an adjustment whose motivating debrief is merely
          SUBMITTED cannot be approved — ERR_DEBRIEF_NOT_ACKNOWLEDGED — even
          though the event is correctly DEBRIEF_OPEN and the director calls approve.
        test_recipe:
          setup:
            - "Full lifecycle to DEBRIEF_OPEN; V1 captain of the shift; DebriefReport created and SUBMITTED but never acknowledged"
            - "RoleAdjustment PROPOSED citing that debrief (proposed_min_age_years 21)"
