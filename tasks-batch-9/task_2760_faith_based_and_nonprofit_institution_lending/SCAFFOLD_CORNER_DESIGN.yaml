              payload: {}
              as: PlatformAdmin
              captures: { e_gp: $.data.error_id }
            - call: "GET /governance-authorizations/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
              captures: { e_gov: $.data.error_id }
            - call: "GET /pledge-campaigns/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { e_camp: $.data.error_id }
            - call: "GET /pledges/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlatformAdmin
              captures: { e_pledge: $.data.error_id }
            - call: "GET /collateral-assets/00000000-0000-4000-8000-000000000006"
              payload: {}
