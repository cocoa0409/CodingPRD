          assert:
            - "the 10:30..11:30 attempt returned HTTP 409 with data.error_id == ERR_ZONE_BURY_CONCURRENCY_EXCEEDED because it overlaps both existing raw dig windows and the zone cap is 2"
            - "the 13:00..14:00 attempt returned HTTP 201 because raw windows [10:00,13:00) and [13:00,14:00) do not overlap and the zone rule ignores travel buffers"
            - "InstallAppointment.${ap3}.status == SCHEDULED"
            - "InstallAppointment.${ap3}.window_start_at == 2026-10-05T13:00:00Z"
