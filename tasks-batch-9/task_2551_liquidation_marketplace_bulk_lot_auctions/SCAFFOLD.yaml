    code: 200
    input: [approved_credit_limit_cents]
    output: BuyerAccount
    side_effects:
      - "sets approved_credit_limit_cents and recomputes available_credit_cents per calculations.buyer_exposure"
      - "increments BuyerAccount.version by 1"

  - method: POST
    path: "/liquidation/warehouses"
    description: "Register an origin warehouse with its dock door count and turnaround buffer."
    roles: [PlatformAdmin]
