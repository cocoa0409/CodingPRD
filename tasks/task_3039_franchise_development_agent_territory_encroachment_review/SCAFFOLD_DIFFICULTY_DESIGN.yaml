        distinguishing_aspect: |
          Category pair business_referential vs business_temporal: a protest whose
          protesting store is TERMINATED AND whose filing is past the 30-day window
          must surface ERR_STORE_NOT_OPEN (priority 7), never
          ERR_PROTEST_WINDOW_EXPIRED (priority 8) — a different pair than
          state-vs-safety.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-15T00:00:00Z (44 days after approval on 2026-09-01 -> window expired)."
