        claim_type: standard_crud
        grounds:
          - response_envelope
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Every response uses the fixed envelope: successes carry
          meta.api_request_id + meta.api_request_timestamp with
          response_type "object" (or "array" for lists), and errors carry
          response_type "error" with data.error_id and data.message.
        test_recipe:
          setup: ["Base exists"]
          setup_api_calls:
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "GET /bases/${base_id}"
              as: Dispatcher
            - call: "GET /routes"
              as: Dispatcher
            - call: "GET /bases/00000000-0000-4000-8000-000000000000"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "GET /bases/{id} 200 body: meta.api_request_id and meta.api_request_timestamp present, response_type == object, data holds the Base"
            - "GET /routes 200 body: response_type == array and the pagination block reports limit/offset/total_count/has_more (defaults 10/0/0/false on the empty collection)"
            - "404 body: response_type == error and data.error_id == ERR_NOT_FOUND with a non-empty data.message; trigger capture err == ERR_NOT_FOUND"

