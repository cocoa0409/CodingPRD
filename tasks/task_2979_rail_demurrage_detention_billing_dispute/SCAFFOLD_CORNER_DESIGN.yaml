              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9L4-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9L4-THX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car1_id: $.data.id, car1_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9L4-THX02", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car2_id: $.data.id, car2_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car1_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9L4-A", expected_rail_car_version: "${car1_v}" }
              as: RailroadAgent
              captures: { cyc1_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc1_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc1_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc1_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car2_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9L4-B", expected_rail_car_version: "${car2_v}" }
              as: RailroadAgent
              captures: { cyc2_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc2_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-05T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc2_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-05T09:00:00Z" }
