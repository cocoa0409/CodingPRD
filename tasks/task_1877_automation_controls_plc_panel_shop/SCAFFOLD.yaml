    side_effects: []
  - method: GET
    path: "/panel-shop/startup-sessions/{id}"
    description: "Fetch a startup session."
    roles: [ProjectManager, QAManager, FieldEngineer, Customer]
    code: 200
    input: []
    output: StartupSession
    side_effects: []
  - method: GET
    path: "/panel-shop/panels/{id}/startup-sessions"
    description: "List startup sessions of a panel (FK reverse reachability)."
    roles: [ProjectManager, QAManager, FieldEngineer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StartupSession[]
    side_effects: []
  - method: POST
