            - call: "POST /panel-shop/jobs/${job12_id}/panels"
              payload: { panel_tag: "P-B4", enclosure_rating: "NEMA_1", design_engineer_id: "de-009" }
              as: DesignEngineer
              captures: { panel_b4: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "CON-B5", component_class: "CONTACTOR", unit_cost_cents: 8000, lead_time_days: 5, sccr_ka: 5, heat_dissipation_w: 20 }
              as: QAManager
