      distinguishing_aspect: 'A DqFile version read before an MVR adjudication cascade is stale afterwards: the PUT carrying it is rejected with 412 and leaves the document MISSING, while the same
        PUT with the post-cascade version succeeds.'
      test_recipe:
        setup:
        - One submitted application whose DqFile version was captured, after which adjudicating an MVR PASS bumped it.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_id}
            position_type: OTR
          as: Recruiter
          captures:
            app_id: $.data.id
        - call: POST /driver-applications/${app_id}/submit
          payload: {}
          as: Recruiter
          as_user_id: rec-001
        - call: GET /dq-files
          payload:
            application_id: ${app_id}
          as: Recruiter
          captures:
            dqf_id: $.data[0].id
        - call: GET /dq-files/${dqf_id}
          payload: {}
          as: Recruiter
          captures:
            dqf_v_old: $.data.version
        - call: POST /screening-checks
          payload:
            application_id: ${app_id}
            check_type: MVR
          as: Recruiter
          captures:
            mvr_id: $.data.id
        - call: POST /screening-checks/${mvr_id}/record-result
          payload:
            issued_on: '2026-07-01'
            violation_points: 0
            serious_violation_count: 0
            crash_preventable_count: 0
          as: Recruiter
        - call: POST /screening-checks/${mvr_id}/adjudicate
          payload:
            decision: PASS
          as: SafetyDirector
        - call: GET /dq-documents
          payload:
            dq_file_id: ${dqf_id}
            doc_type: CDL_COPY
          as: Recruiter
          captures:
            doc_cdl: $.data[0].id
        trigger:
        - call: PUT /dq-documents/${doc_cdl}
          payload:
            status: PRESENT
            effective_on: '2026-08-01'
            expected_dq_file_version: ${dqf_v_old}
          as: Recruiter
          captures:
            err: $.data.error_id
        - call: GET /dq-files/${dqf_id}
          payload: {}
          as: Recruiter
          captures:
            dqf_v_now: $.data.version
        - call: PUT /dq-documents/${doc_cdl}
          payload:
            status: PRESENT
            effective_on: '2026-08-01'
            expected_dq_file_version: ${dqf_v_now}
          as: Recruiter
        assert:
        - 'First trigger: HTTP status == 412 and data.error_id == ERR_STALE_VERSION'
        - 'After the first trigger: DqDocument.${doc_cdl}.status == MISSING and DqFile.${dqf_id}.completeness_pct == 21.43'
        - DqFile.${dqf_id}.version == ${dqf_v_old} + 1 before the retry
        - 'Third trigger: HTTP status == 200 and DqDocument.${doc_cdl}.status == PRESENT'
        - DqFile.${dqf_id}.completeness_pct == 28.57 and version == ${dqf_v_old} + 2 after the retry
    - name: occ_stale_application_version_on_reapply_returns_412
      claim_type: optimistic_concurrency
      grounds:
      - concurrency_rules[reapply-stale-application]
      - errors[ERR_STALE_VERSION]
      - endpoints[POST /driver-applications/{application_id}/reapply]
      distinguishing_aspect: 'Re-applying against a predecessor that has already been superseded is rejected: the first reapply bumps the prior application''s version, so a second reapply still
        carrying the pre-supersede version returns 412.'
      test_recipe:
        setup:
        - One application that was submitted and then disqualified, with its version captured before any reapply.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: dana.ruiz@example.com
            cdl_number: CDL-77120
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_id}
            position_type: OTR
          as: Recruiter
          captures:
            app_id: $.data.id
        - call: POST /driver-applications/${app_id}/submit
          payload: {}
          as: Recruiter
          as_user_id: rec-001
        - call: POST /driver-applications/${app_id}/disqualify
          payload:
            reason: CANDIDATE_PAUSED
          as: SafetyDirector
        - call: GET /driver-applications/${app_id}
          payload: {}
          as: Recruiter
          captures:
            app_v: $.data.version
        - call: POST /driver-applications/${app_id}/reapply
          payload:
            expected_application_version: ${app_v}
            position_type: REGIONAL
          as: Recruiter
          captures:
            app_new: $.data.id
        - call: POST /driver-applications/${app_new}/disqualify
          payload:
            reason: CANDIDATE_PAUSED_AGAIN
          as: SafetyDirector
        trigger:
        - call: POST /driver-applications/${app_id}/reapply
          payload:
            expected_application_version: ${app_v}
            position_type: OTR
          as: Recruiter
          captures:
            err: $.data.error_id
        assert:
        - HTTP status == 412
        - response data.error_id == ERR_STALE_VERSION
        - DriverApplication.${app_id}.version == ${app_v} + 1
        - GET /driver-applications?prior_application_id=${app_id} returns exactly 1 row whose id == ${app_new}
    - name: cascading_side_effects_end_to_end_chain
