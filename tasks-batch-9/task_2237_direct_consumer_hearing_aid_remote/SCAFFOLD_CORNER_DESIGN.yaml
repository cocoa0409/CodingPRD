  - section: consistency_model
    instances:

      - name: consistency_immediate_confirm_fit_response_and_reads_agree
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, endpoints.POST_device_orders_confirm_fit]
        distinguishing_aspect: "Under the immediate model the confirm-fit response body already carries the assigned device_id and READY_TO_SHIP, and a read of the pool in the very next call already shows on_hand 4 / reserved 1 -- there is no window in which the denormalized counters lag."
        test_recipe:
          setup:
            - "Stocked NEO/M/OPEN pool (5 units) and a PASS patient with an AUTHORIZED order."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /inventory-pools", payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }, as: PlatformAdmin, captures: { pool_mo: "$.data.id" } }
            - { call: "POST /inventory-pools/${pool_mo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-C001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "c1@x.test", full_name: "C One", age_years: 70 }, as: CareOpsAgent, captures: { pat_c1: "$.data.id" } }
            - { call: "POST /patients/${pat_c1}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_c1}", captures: { scr_c1: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_c1}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_c1}" }
            - { call: "POST /screening-sessions/${scr_c1}/submit", payload: {}, as: Patient, as_user_id: "${pat_c1}" }
            - { call: "POST /patients/${pat_c1}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_c1}", captures: { ord_c1: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_c1}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /device-orders/${ord_c1}/confirm-fit", payload: {}, as: CareOpsAgent }
          assert:
            - "HTTP 200 and the SAME response body already contains data.fulfillment_status == \"READY_TO_SHIP\" and a non-null data.device_id"
            - "the immediately following GET /inventory-pools/${pool_mo} returns data.on_hand_units == 4 and data.reserved_units == 1 with no retry needed"
            - "the immediately following GET /devices/{data.device_id} returns data.status == \"RESERVED\""
            - "GET /device-orders/${ord_c1} returns the same device_id as the trigger response (no read-your-writes anomaly)"

      - name: consistency_immediate_state_changes_accompanying_a_4xx_are_visible_at_once
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, errors.ERR_PAYMENT_DECLINED, state_machines.CarePlanSubscription.ACTIVE_to_PAST_DUE]
        distinguishing_aspect: "Even when the response is a 402 whose envelope carries only {error_id, message}, the dunning side effects are committed immediately: the very next read shows PAST_DUE with dunning_attempts 1, so a client must never assume a 4xx means no state change."
        test_recipe:
          setup:
            - "Canonical delivered order with an ACTIVE STANDARD 9900 plan at cycle_ordinal 0; the clock is at 2026-08-31."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
