              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-01T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /sessions/${s1_id}/start"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /sessions/${s1_id}/complete"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-02T11:00:00Z", requested_seconds: 120 }
