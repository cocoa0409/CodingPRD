  # ===========================================================================
  # Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: blockout_lift_action_endpoint_records_the_reason
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /blockout-assignments/{assignment_id}/lift]
          - state_machines.BlockoutAssignment.ACTIVE_to_LIFTED
          - entities.BlockoutAssignment.fields.lift_reason
        distinguishing_aspect: "The lift action is the only way a blockout leaves ACTIVE: it stamps lift_reason and lifted_at from the request and the logical clock, and the assignment stops appearing in the ACTIVE listing for that day."
        test_recipe:
          setup:
            - "Program in DESIGN with a BRONZE tier and a STANDARD park day 2026-09-01 (1000 / 100)."
            - "One ACTIVE BlockoutAssignment for (BRONZE, 2026-09-01)."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id", day_901_v: "$.data.version" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "${day_901}", expected_park_day_version: "${day_901_v}" }
              as: ProgramAdmin
              captures: { blk: "$.data.id" }
          trigger:
            - call: "POST /blockout-assignments/${blk}/lift"
              payload: { reason: "Capacity released for the promo weekend" }
              as: ProgramAdmin
          assert:
            - "HTTP 200 with data.status == 'LIFTED', data.lift_reason == 'Capacity released for the promo weekend', data.lifted_at == '2026-08-01T00:00:00Z'"
            - "GET /blockout-assignments?park_day_id=${day_901}&status=ACTIVE → data.total_count == 0"
            - "GET /blockout-assignments?park_day_id=${day_901} → data.total_count == 1 (the row is lifted, not deleted)"
            - "GET /blockout-assignments/${blk} → data.assignment_source == 'MANUAL' (a hand-made blockout, not a capacity adjustment)"

      - name: revenue_summary_is_a_computed_read_over_the_program
        claim_type: computed_read
        grounds:
          - endpoints[GET /pass-programs/{program_id}/revenue-summary]
          - calculations.program_revenue_analysis
        distinguishing_aspect: "A read-only projection: one PAY_IN_FULL pass and no visits yields base == recognized == 12000 with deferred 0, and calling it twice changes nothing on the program row."
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE (12000) and exactly one processed ACTIVE pass bought PAY_IN_FULL. No park days, no visits."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
          trigger:
            - call: "GET /pass-programs/${prog}/revenue-summary"
              as: ProgramAdmin
              captures: { base: "$.data.base_revenue_cents" }
          assert:
            - "HTTP 200 with data.base_revenue_cents == 12000, data.recognized_revenue_cents == 12000, data.deferred_revenue_cents == 0, data.forfeited_revenue_cents == 0"
            - "data.active_pass_count == 1, data.total_visit_count == 0, data.visits_per_active_pass == 0.00"
            - "data.total_in_park_spend_cents == 0 and data.spend_per_visit_cents == 0"
            - "a second identical call returns the identical body and GET /pass-programs/${prog} → data.version is unchanged (the read has no side effects)"
            - "the same call as ComplianceOfficer returns 200; as PassOfficeClerk it returns 403 ERR_ROLE_NOT_PERMITTED"

      - name: blockout_assignment_requires_both_referenced_rows_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /blockout-assignments]
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_PARK_DAY_NOT_FOUND]
        distinguishing_aspect: "The junction write resolves both sides before doing anything: an unknown park_day_id is 404 ERR_PARK_DAY_NOT_FOUND and an unknown tier_id is 404 ERR_TIER_NOT_FOUND (priority 11 first), and only when both resolve does the link appear on both sides."
        test_recipe:
          setup:
            - "Program in DESIGN with a BRONZE tier and one STANDARD park day 2026-09-01."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id", day_901_v: "$.data.version" }
          trigger:
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "11111111-1111-4111-8111-111111111111", expected_park_day_version: "${day_901_v}" }
              as: ProgramAdmin
              captures: { err1: "$.data.error_id" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "22222222-2222-4222-8222-222222222222", park_day_id: "${day_901}", expected_park_day_version: "${day_901_v}" }
              as: ProgramAdmin
              captures: { err2: "$.data.error_id" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "${day_901}", expected_park_day_version: "${day_901_v}" }
              as: ProgramAdmin
              captures: { blk: "$.data.id" }
          assert:
            - "first trigger: HTTP 404 with data.error_id == 'ERR_PARK_DAY_NOT_FOUND'"
            - "second trigger: HTTP 404 with data.error_id == 'ERR_TIER_NOT_FOUND' (priority 11 is evaluated before priority 12)"
            - "third trigger: HTTP 201 with data.tier_id == '${bronze}', data.park_day_id == '${day_901}', data.status == 'ACTIVE'"
            - "GET /blockout-assignments?tier_id=${bronze} → data.total_count == 1 and GET /blockout-assignments?park_day_id=${day_901} → data.total_count == 1 (reachable from both sides of the junction)"
            - "GET /park-days/${day_901} → data.version == ${day_901_v} + 1 (only the accepted write bumped it)"

      - name: reservation_cancel_is_allowed_only_while_confirmed
        claim_type: conditional_action
        grounds:
          - endpoints[POST /reservations/{reservation_id}/cancel]
          - validations[priority=51]
          - errors[ERR_RESERVATION_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancellation is conditional on the CONFIRMED status: the first call releases the slot, the second call on the now-CANCELLED_BY_HOLDER row is 409, and the day's counters do not move a second time."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE and a STANDARD park day 2026-09-01 (1000 / 100 → 100 slots)."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL holding one CONFIRMED reservation [09:00, 12:00)."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_901}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
