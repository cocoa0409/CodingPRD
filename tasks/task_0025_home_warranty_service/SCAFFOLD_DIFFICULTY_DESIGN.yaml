scaffold_difficulty_design:

  # =====================================================================
  # Rule 1: dual-variant calculations on DIFFERENT entity domains.
  # Instance A — ClaimTicket: provisional_copay (at ASSESS) vs final_copay
  #   (at RESOLVE) produce different cents for identical R when SF is waived
  #   on return visit.
  # Instance B — Contract: renewal_premium variant early_renewal vs at_expiry
  #   produce different premium cents for identical P depending on D.
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: copay_provisional_vs_final_diverge_on_return_visit
        grounds:
          - calculations.provisional_copay
          - calculations.final_copay
          - calculations.is_return_visit
          - entities.ClaimTicket.fields.provisional_copay_cents
          - entities.ClaimTicket.fields.final_copay_cents
          - state_machines.ClaimTicket.SUBMITTED_to_ASSESSED
          - state_machines.ClaimTicket.ASSESSED_to_DISPATCHED
          - state_machines.ClaimTicket.DISPATCHED_to_RESOLVED
        distinguishing_aspect: |
          Operates on entity ClaimTicket. For an identical repair_cost_cents R = 30000
          (over copay_cap_cents C = 25000), the provisional_copay at ASSESS pins
          provisional_copay_cents = round_half_up((30000-25000)*0.20) + service_fee_cents(7500)
          = 1000 + 7500 = 8500; the same claim, after dispatch evaluates is_return_visit
          == true (window open from a prior dispatch on the same CoveredItem) and the
          claim is RESOLVED with the same R = 30000, yields final_copay_cents =
          round_half_up((30000-25000)*0.20) + 0 = 1000. Same inputs, two algorithms
          (provisional reads ContractPackage.service_fee_cents; final reads pinned
          service_fee_charged_cents = 0), different result: 8500 vs 1000.
        test_recipe:
          setup:
            - "A PlatformAdmin-created ContractPackage 'PLUS' with annual_premium_cents=50000, service_fee_cents=7500, copay_cap_cents=25000, copay_share_pct=0.20, return_visit_window_days=30, max_covered_items=5."
            - "A Customer with one ACTIVE Contract on PLUS (coverage_start_utc = 2026-01-01, coverage_end_utc = 2027-01-01), one CoveredItem (HVAC, pre_existing_flag=false)."
            - "An initial ClaimTicket on that CoveredItem that completed an earlier dispatch at 2026-02-01T10:00Z (so CoveredItem.last_dispatch_completed_utc = 2026-02-01T10:00Z; initial claim RESOLVED)."
            - "A SECOND ClaimTicket on the same CoveredItem, filed at clock_now = 2026-02-05T12:00Z (within the 30-day return-visit window)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus Package", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { plus_pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "alice@example.com", full_name: "Alice", home_address: "1 Main St" }
              as: Anonymous
              captures: { alice_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${alice_id}", package_id: "${plus_pkg_id}" }
              as: Customer
              as_user_id: "${alice_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "Carrier", model: "XR15", install_year: 2022, pre_existing_flag: false }
              as: Customer
              as_user_id: "${alice_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "First failure" }
              as: Customer
              as_user_id: "${alice_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /claims/${claim1_id}/assess"
              payload: { estimated_repair_cost_cents: 30000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim1_id}/dispatch"
              payload: { technician_id: "tech-001", scheduled_utc: "2026-02-01T09:00:00Z" }
              as: Dispatcher
              captures: { }
            - call: "GET /dispatches"
              payload: { claim_id: "${claim1_id}" }
              as: Dispatcher
              captures: { d1_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d1_id}/start"
              payload: {}
              as: Technician
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d1_id}/complete"
              payload: {}
              as: Technician
            - call: "POST /claims/${claim1_id}/resolve"
              payload: { actual_repair_cost_cents: 30000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Same issue recurs" }
              as: Customer
              as_user_id: "${alice_id}"
              captures: { claim2_id: $.data.id }
            - call: "POST /claims/${claim2_id}/assess"
              payload: { estimated_repair_cost_cents: 30000 }
              as: Dispatcher
          trigger:
            - call: "POST /claims/${claim2_id}/dispatch"
              payload: { technician_id: "tech-002", scheduled_utc: "2026-02-06T09:00:00Z" }
              as: Dispatcher
            - call: "GET /claims/${claim2_id}"
              payload: {}
              as: Dispatcher
              captures: { c2_provisional: $.data.provisional_copay_cents, c2_is_return: $.data.is_return_visit, c2_sf: $.data.service_fee_charged_cents }
            - call: "GET /dispatches"
              payload: { claim_id: "${claim2_id}" }
              as: Dispatcher
              captures: { d2_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-06T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d2_id}/start"
              payload: {}
              as: Technician
            - call: "POST /dispatches/${d2_id}/complete"
              payload: {}
              as: Technician
            - call: "POST /claims/${claim2_id}/resolve"
              payload: { actual_repair_cost_cents: 30000 }
              as: Dispatcher
              captures: { c2_final: $.data.final_copay_cents }
          assert:
            - "ClaimTicket.${claim2_id}.provisional_copay_cents == 8500"
            - "ClaimTicket.${claim2_id}.is_return_visit == true"
            - "ClaimTicket.${claim2_id}.service_fee_charged_cents == 0"
            - "ClaimTicket.${claim2_id}.final_copay_cents == 1000"
            - "8500 != 1000 (provisional and final diverge on the same R because the service fee is waived on return visit)"

      - name: renewal_premium_early_vs_at_expiry_diverge
        grounds:
          - calculations.renewal_premium
          - entities.Contract.fields.annual_premium_due_cents
          - state_machines.Contract.EXPIRING_SOON_to_RENEWED
        distinguishing_aspect: |
          Operates on entity Contract. For an identical ContractPackage (P =
          50000 annual_premium_cents, 0 covered items so surcharge=0), renewing
          at D = 20 days remaining (early_renewal) yields successor
          annual_premium_due_cents = 50000 - round_half_up(50000*0.10) = 45000,
          while renewing at D = 5 days remaining (at_expiry) yields successor
          annual_premium_due_cents = 50000. Same P, two pricing tiers, different
          result: 45000 vs 50000. Different entity domain from instance A
          (Contract, not ClaimTicket).
        test_recipe:
          setup:
            - "PlatformAdmin-created package PLUS as above (annual_premium_cents=50000)."
            - "Two Customers each with one ACTIVE Contract on PLUS; both contracts have ZERO CoveredItems so the per-item surcharge component is 0."
            - "Both contracts auto-transitioned into EXPIRING_SOON via /_clock/tick after clock advanced past coverage_end_utc - 30 days."
            - "Contract A renewed at clock_now = coverage_end_utc - 20 days (D = 20 → early_renewal); Contract B renewed at clock_now = coverage_end_utc - 5 days (D = 5 → at_expiry)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus Package", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { plus_pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@example.com", full_name: "A", home_address: "1 A St" }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "b@example.com", full_name: "B", home_address: "1 B St" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${a_id}", package_id: "${plus_pkg_id}" }
              as: Customer
              as_user_id: "${a_id}"
              captures: { contract_a_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${b_id}", package_id: "${plus_pkg_id}" }
              as: Customer
              as_user_id: "${b_id}"
              captures: { contract_b_id: $.data.id }
            - call: "POST /contracts/${contract_a_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /contracts/${contract_b_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-12-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contracts/${contract_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { a_v_es: $.data.version }
            - call: "POST /contracts/${contract_a_id}/renew"
              payload: { expected_contract_version: "${a_v_es}" }
              as: Customer
              as_user_id: "${a_id}"
              captures: { successor_a_id: $.data.id, successor_a_premium: $.data.annual_premium_due_cents }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-12-27T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contracts/${contract_b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { b_v_es: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_b_id}/renew"
              payload: { expected_contract_version: "${b_v_es}" }
              as: Customer
              as_user_id: "${b_id}"
              captures: { successor_b_id: $.data.id, successor_b_premium: $.data.annual_premium_due_cents }
          assert:
            - "Contract.${successor_a_id}.annual_premium_due_cents == 45000 (D=20 → early_renewal: 50000 - round_half_up(50000*0.10) = 50000 - 5000)"
            - "Contract.${successor_b_id}.annual_premium_due_cents == 50000 (D=5 → at_expiry: no discount)"
            - "45000 != 50000 (identical P; renewal_premium variant diverges by tier)"

  # =====================================================================
  # Rule 2: combinatorial formulas in DIFFERENT modes.
  # Instance A (mode (a)) — final_copay: ≥3 inputs (R, C, P, SF) with
  #   conditional branches on is_return_visit AND the threshold R > C.
  # Instance B (mode (b)) — renewal_premium: per-item surcharge with
  #   PINNED rounding order (round per item then sum).
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: final_copay_four_input_nonlinear_branching
        grounds:
          - calculations.final_copay
          - calculations.is_return_visit
          - calculations.service_fee_charged
        distinguishing_aspect: |
          Mode (a) per §0.5: final_copay has 4 inputs (R, C, P, SF) with two
          non-linear interactions — max(0, R-C) gating the co-pay above cap, AND
          the branch on is_return_visit pinning SF to either ContractPackage.
          service_fee_cents or 0. For R=30000, C=25000, P=0.20, is_return_visit
          = false (so SF = 7500): final_copay = 7500 + round_half_up(5000*0.20)
          = 7500 + 1000 = 8500. Holds the under_cap vs over_cap × first_visit vs
          return_visit cross-product.
        test_recipe:
          setup:
            - "ContractPackage PREM with annual_premium_cents=60000, service_fee_cents=7500, copay_cap_cents=25000, copay_share_pct=0.20, return_visit_window_days=30, max_covered_items=5."
            - "A Customer with one ACTIVE Contract on PREM, one CoveredItem (REFRIGERATOR, pre_existing_flag=false)."
            - "One ClaimTicket on that CoveredItem, status DISPATCHED via tech-A scheduled 2026-02-01T09:00Z; Dispatch IN_PROGRESS, then COMPLETED at 2026-02-01T10:00Z. is_return_visit was FALSE (no prior completed dispatch on this CoveredItem). SF pinned at 7500."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PREM", name: "Premium Package", annual_premium_cents: 60000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { prem_pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "carol@example.com", full_name: "Carol", home_address: "9 Oak St" }
              as: Anonymous
              captures: { carol_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${carol_id}", package_id: "${prem_pkg_id}" }
              as: Customer
              as_user_id: "${carol_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "REFRIGERATOR", brand: "Whirlpool", model: "WRF555", install_year: 2023, pre_existing_flag: false }
              as: Customer
              as_user_id: "${carol_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Compressor failure" }
              as: Customer
              as_user_id: "${carol_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 30000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/dispatch"
              payload: { technician_id: "tech-A", scheduled_utc: "2026-02-01T09:00:00Z" }
              as: Dispatcher
            - call: "GET /dispatches"
              payload: { claim_id: "${claim_id}" }
              as: Dispatcher
              captures: { d_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d_id}/start"
              payload: {}
              as: Technician
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d_id}/complete"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /claims/${claim_id}/resolve"
              payload: { actual_repair_cost_cents: 30000 }
              as: Dispatcher
              captures: { fc: $.data.final_copay_cents, sf: $.data.service_fee_charged_cents, rv: $.data.is_return_visit }
          assert:
            - "ClaimTicket.${claim_id}.is_return_visit == false"
            - "ClaimTicket.${claim_id}.service_fee_charged_cents == 7500"
            - "ClaimTicket.${claim_id}.final_copay_cents == 8500 (= 7500 + round_half_up((30000-25000)*0.20) = 7500 + 1000)"

      - name: renewal_premium_per_item_surcharge_rounding_order
        grounds:
          - calculations.renewal_premium
          - entities.Contract.fields.annual_premium_due_cents
        distinguishing_aspect: |
          Mode (b) per §0.5: renewal_premium's per-item surcharge pins the
          rounding ORDER — round per_item first, then multiply by extra_items.
          With P = 12345 cents and ITEM_SURCHARGE_PCT_PER_ITEM = 0.02:
          per_item_cents = round_half_up(12345 * 0.02) = round_half_up(246.9) = 247.
          For N_items = 4 (extra_items = 3): surcharge_total = 247 * 3 = 741.
          The REJECTED alternative ("sum then round": round_half_up(12345 * 0.02 * 3)
          = round_half_up(740.7) = 741 — coincidentally equal here; choose P that
          forces divergence). Pick P = 12350: per_item = round_half_up(247.0)
          = 247, surcharge = 247*3 = 741; alternative = round_half_up(12350*0.02*3)
          = round_half_up(741.0) = 741. Still equal — pick P = 12325: per_item =
          round_half_up(246.5) = 247 (half_up rounds .5 away from zero), surcharge
          = 741; alternative = round_half_up(12325*0.02*3) = round_half_up(739.5)
          = 740. Divergence: 741 vs 740. Different mode from instance A (b vs a).
        test_recipe:
          setup:
            - "ContractPackage SURCHARGE_TEST with annual_premium_cents=12325 (chosen so 12325*0.02 = 246.5 rounds_half_up to 247), service_fee_cents=7500, copay_cap_cents=25000, copay_share_pct=0.20, return_visit_window_days=30, max_covered_items=10."
            - "A Customer with one ACTIVE Contract on SURCHARGE_TEST and EXACTLY 4 CoveredItems (extra_items = 3) registered before the contract enters EXPIRING_SOON."
            - "Clock advanced past coverage_end_utc - 30 days and /_clock/tick called → contract in EXPIRING_SOON."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "SURCHARGE", name: "Surcharge Test", annual_premium_cents: 12325, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 10 }
              as: PlatformAdmin
              captures: { sur_pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "dan@example.com", full_name: "Dan", home_address: "2 Pine St" }
              as: Anonymous
              captures: { dan_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${dan_id}", package_id: "${sur_pkg_id}" }
              as: Customer
              as_user_id: "${dan_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M1", install_year: 2022 }
              as: Customer
              as_user_id: "${dan_id}"
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "WATER_HEATER", brand: "B", model: "M2", install_year: 2022 }
              as: Customer
              as_user_id: "${dan_id}"
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "REFRIGERATOR", brand: "B", model: "M3", install_year: 2022 }
              as: Customer
              as_user_id: "${dan_id}"
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "DISHWASHER", brand: "B", model: "M4", install_year: 2022 }
              as: Customer
              as_user_id: "${dan_id}"
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-12-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_es: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/renew"
              payload: { expected_contract_version: "${v_es}" }
              as: Customer
              as_user_id: "${dan_id}"
              captures: { successor_id: $.data.id, successor_premium: $.data.annual_premium_due_cents }
          assert:
            - "Contract.${successor_id}.annual_premium_due_cents == 11833 (D=20 → early_renewal: base_after_discount = 12325 - round_half_up(12325*0.10) = 12325 - 1233 = 11092; per_item_cents = round_half_up(12325*0.02) = round_half_up(246.5) = 247; surcharge = 247*3 = 741; total = 11092 + 741 = 11833. The 'sum then round' alternative would give 11091.75 → 11092 base + round_half_up(739.5)=740 surcharge = 11832. The pinned order is unambiguously 11833.)"

  # =====================================================================
  # Rule 3: non-linear state machines on DIFFERENT entities.
  # Instance A (cyclic) — ClaimTicket: DISPATCHED -> ASSESSED on /reopen.
  # Instance B (branching) — Contract: EXPIRING_SOON -> {RENEWED, EXPIRED, CANCELLED}.
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_cyclic_reopen_dispatched_to_assessed
        grounds:
          - state_machines.ClaimTicket.DISPATCHED_to_ASSESSED
          - state_machines.Dispatch.IN_PROGRESS_to_RETURN_NEEDED
          - entities.ClaimTicket.fields.status
        distinguishing_aspect: |
          ClaimTicket has a cyclic edge: status DISPATCHED transitions back to
          ASSESSED via /reopen, then onward to DISPATCHED again via /dispatch on
          the same claim. This is a true cycle (A→B→A) on ClaimTicket — distinct
          shape from instance B (branching on Contract).
        test_recipe:
          setup:
            - "An ACTIVE Contract with one CoveredItem, one ClaimTicket in status DISPATCHED whose linked Dispatch is in RETURN_NEEDED status."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e@example.com", full_name: "E", home_address: "3 Elm" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "C", model: "X", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
