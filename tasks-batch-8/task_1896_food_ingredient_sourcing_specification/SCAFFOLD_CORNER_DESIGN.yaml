  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_spec_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[spec-supersede-stale-ingredient]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a spec with expected_ingredient_version captured before another writer created a spec (which bumped ingredient.version) fails with ERR_STALE_VERSION 412; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Ingredient created (version 1 captured); first spec created (version bumps to 2)"]
          setup_api_calls:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "OCC-1", name: "OCC Ingredient", allergen_profile: ["NONE"], requires_dual_source: false }
              as: ProcurementManager
              captures: { ing_id: $.data.id, ing_v: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v1", effective_date: "2026-07-01T00:00:00Z", version_note: "initial spec version", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec1: $.data.id }
          trigger:
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v2", effective_date: "2026-08-01T00:00:00Z", version_note: "stale version attempt", supersedes_spec_id: "${spec1}", expected_ingredient_version: "${ing_v}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { err: $.data.error_id }
            - call: "GET /sourcing/ingredients/${ing_id}"
              payload: {}
              as: ProcurementManager
              captures: { ing_v_fresh: $.data.version }
            - call: "POST /sourcing/ingredients/${ing_id}/specs"
              payload: { spec_version_label: "v2", effective_date: "2026-08-01T00:00:00Z", version_note: "fresh version attempt", supersedes_spec_id: "${spec1}", expected_ingredient_version: "${ing_v_fresh}" }
              as: SpecAuthor
              as_user_id: author-1
              captures: { spec2: $.data.id }
          assert:
            - "Stale create (expected version 1 while actual is 2): error_id == ERR_STALE_VERSION, HTTP 412"
            - "Retry with fresh version succeeds: spec v2 created"

