              as: ContractAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /cancellations"
              payload: { contract_id: "${contract_id}", reason: "CUSTOMER_REQUEST", request_date: "2026-01-31T00:00:00Z" }
              as: ContractAdmin
              captures: { canc_id: $.data.id }
          trigger:
            - call: "POST /cancellations/${canc_id}/approve"
              payload: {}
              as: ContractAdmin
          assert:
            - "Cancellation.${canc_id}.refund_basis == FULL (30 days is inclusive boundary)"
            - "Cancellation.${canc_id}.net_refund_cents == 240000"

      - name: coverage_term_expiry_elapsed_months_boundary
        grounds:
          - state_machines.Contract.transitions.ACTIVE_to_EXPIRED
          - calculations.pro_rata_refund
          - entities.Contract.fields.status
        distinguishing_aspect: |
          Interval semantics B (DIFFERENT geometry, different resource — the Contract coverage term rather
          than the cancellation free-look) — coverage occupies [sale_date, sale_date + term_months). At
          months_elapsed == term_months (clock 2031-01-01, 60 months) the term boundary is reached and a
          GET auto-transitions ACTIVE->EXPIRED, an exclusive upper-endpoint treatment unlike the inclusive
          free-look window.
        test_recipe:
          setup:
            - "ACTIVE contract sale_date 2026-01-01, term_months 60; clock advanced to 2031-01-01."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool TO2" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINTO200001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-01-01T00:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractAdmin
              captures: { st: $.data.status }
          assert:
            - "Contract.${contract_id}.status == EXPIRED (months_elapsed 60 >= term_months 60)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reverse_authorization_pool_paid_loss_conserved
        grounds:
          - state_machines.RepairAuthorization.transitions.DISBURSED_to_REVERSED
          - calculations.pool_surplus
          - entities.ReinsurancePool.fields.paid_loss_cents
        distinguishing_aspect: |
          Conserved quantity = ReinsurancePool.paid_loss_cents. Forward disburse posts LOSS_PAID +48349;
          the compensating reverse posts LOSS_REVERSED -48349, so after the pair pool.paid_loss_cents == 0
          (unchanged from before the forward action), pinned as sum(LOSS_PAID) + sum(LOSS_REVERSED) == 0.
        test_recipe:
          setup:
            - "Claim disbursed for 48349 against the pool (paid_loss 48349)."
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool CI1" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, rental_benefit_cents_per_day: 5000, rental_max_days: 3, towing_benefit_cents: 8000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, network_status: "IN_NETWORK", direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINCI100001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "transmission", rental_days_claimed: 4, towing_claimed: true }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
