    output: "WarrantyClaim[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or wrong parent scope" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body FK (motor_id/customer_id/work_order_id/spare_motor_id) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_INVALID_INPUT, http: 400, condition: "Field-level constraint violation (non-positive hours, negative amounts, bad enum)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept attempted at or after expires_at; quote auto-transitions to EXPIRED" }
  - { id: ERR_CUSTOMER_ON_HOLD, http: 402, condition: "Customer standing HOLD blocks quote acceptance" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same operator may not perform two steps that the process segregates" }
  - { id: ERR_DUPLICATE_ACTIVE, http: 409, condition: "Uniqueness violation: live quote per work order / serial per shop / active contract per customer" }
  - { id: ERR_FINAL_TEST_NOT_PASS, http: 409, condition: "Release requires latest FINAL verdict PASS and any CORE_LOSS verdict PASS" }
  - { id: ERR_POOL_UNAVAILABLE, http: 409, condition: "Pool checkout blocked: contract not ACTIVE, slots exhausted, spare not IN_POOL, or kW outside +/-20% band" }
  - { id: ERR_WARRANTY_OUT_OF_WINDOW, http: 422, condition: "months_elapsed >= warranty_months at approval" }
  - { id: ERR_WARRANTY_EXCLUDED_MODE, http: 422, condition: "failure_mode in the exclusion set (OVERLOAD/INGRESS/MISAPPLICATION/UNAUTHORIZED_REPAIR)" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Void requires amount_paid_cents == 0" }
  - { id: ERR_CLAIMS_OPEN, http: 409, condition: "Close blocked by open warranty claim or unreturned pool loan" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Shop owner/administrator; configures the service center and drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /shops — create shop"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET endpoints (all read access)"

  - name: ServiceManager
    description: "Service manager; customer registry, pool contracts, release/delivery, warranty adjudication, payments"
    identity: opaque
    exclusive_operations:
      - "POST /shops/{shopId}/customers — register customer"
      - "POST /shops/{shopId}/motors — register motor"
      - "POST .../release — release work order (issues invoice)"
      - "POST .../deliver — deliver work order"
      - "POST .../close — close work order"
      - "POST .../scrap — scrap pre-approval work order"
      - "POST /shops/{shopId}/invoices/{invoiceId}/void — void invoice"
      - "POST /shops/{shopId}/customers/{customerId}/payments — record payment"
      - "POST /shops/{shopId}/pool-contracts and lifecycle actions"
      - "POST .../loans and .../return — pool loan checkout/return"
      - "POST .../warranty-claims/{id}/start-review|approve|deny"
    shared_operations:
      - "GET endpoints"
      - "POST .../warranty-claims — file claim on behalf of customer"

  - name: Technician
    description: "Test technician; intake, incoming/core/final tests, diagnosis"
    identity: opaque
    exclusive_operations:
      - "POST /shops/{shopId}/work-orders — intake"
      - "POST .../tests — record test records"
      - "POST .../diagnose — record diagnosis + estimates"
    shared_operations:
      - "GET endpoints"

  - name: WindingTechnician
    description: "Rewind specialist; starts rewind and records coil data (segregated from test technician)"
    identity: opaque
    exclusive_operations:
      - "POST .../start-rewind"
      - "POST .../coil-data"
    shared_operations:
      - "GET endpoints"

  - name: Estimator
    description: "Quote estimator; issues, sends, revises quotes"
    identity: opaque
    exclusive_operations:
      - "POST .../quotes — issue quote (OCC-guarded)"
      - "POST .../quotes/{id}/send"
      - "POST .../quotes/{id}/revise"
    shared_operations:
      - "GET endpoints"

  - name: Customer
    description: "Customer account; accepts/declines quotes, files warranty claims, reads own records"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST .../quotes/{id}/accept"
      - "POST .../quotes/{id}/decline"
