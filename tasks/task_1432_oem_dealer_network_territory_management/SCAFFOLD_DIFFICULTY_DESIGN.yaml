# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# OEM Dealer Network & Territory Management
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: unit_sale_discount_provisional_vs_final
        grounds:
          - calculations.tier_discount
          - state_machines.SalesTarget.OPEN_to_CLOSED_MET
          - entities.UnitSale.fields.provisional_discount_cents
          - entities.UnitSale.fields.final_discount_cents
          - entities.Dealer.fields.discount_reconciliation_cents
        distinguishing_aspect: |
          Same sales data, two variants on the pricing domain: PROVISIONAL projects the
          reporting sale as accepted (achieved+1) at creation, FINAL uses only ACCEPTED
          sales at close — sale A crosses the SILVER boundary between the two variants,
          so provisional 2000 != final 5000 and the 3000 delta lands on the dealer.
        test_recipe:
          setup:
            - "Dealer DL-A1 ACTIVE (2 verified certs, activated agreement)"
            - "SalesTarget Q3 2026 target_units=2 OPEN"
            - "Sale A: serial A-100, 2026-08-10, list 100000 -> provisional (0+1)/2=0.5 BRONZE 2% = 2000"
            - "Sale B: serial A-101, 2026-08-15, list 100000 -> provisional (1+1)/2=1.0 SILVER 5% = 5000"
            - "Both sales ACCEPTED; clock moved past quarter end"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer A1", dealer_code: "DL-A1", region: "West", credit_limit_cents: 1000000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-A1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-A2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-A1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 2 }, as: OemSalesOps, captures: { t: $.data.id } }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "A-100", sale_date: "2026-08-10", list_price_cents: 100000 }, as: DealerUser, as_user_id: "${d}", captures: { s_a: $.data.id } }
            - { call: "POST /network/unit-sales/${s_a}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "A-101", sale_date: "2026-08-15", list_price_cents: 100000 }, as: DealerUser, as_user_id: "${d}", captures: { s_b: $.data.id } }
            - { call: "POST /network/unit-sales/${s_b}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/sales-targets/${t}/close", payload: {}, as: OemSalesOps }
            - { call: "GET /network/unit-sales/${s_a}", as: Any }
            - { call: "GET /network/dealers/${d}", as: Any }
            - { call: "GET /network/sales-targets/${t}", as: Any }
          assert:
            - "UnitSale.${s_a}.provisional_discount_cents == 2000 (BRONZE 2% at report time)"
            - "UnitSale.${s_a}.final_discount_cents == 5000 (SILVER 5% at close)"
            - "UnitSale.${s_b}.final_discount_cents == 5000 (delta 0 for B)"
            - "Dealer.${d}.discount_reconciliation_cents == 3000"
            - "Dealer.${d}.tier == SILVER"
            - "SalesTarget.${t}.status == CLOSED_MET"
            - "SalesTarget.${t}.final_discount_rate == 0.05"

      - name: dealer_scorecard_strict_vs_inclusive
        grounds:
          - calculations.dealer_performance_score
          - entities.Dealer.fields.tier
        distinguishing_aspect: |
          Same dealer data, two variants on the risk-scoring domain: STRICT counts only
          ACCEPTED sales / ACTIVE certs / CHARGED_BACK amounts; INCLUSIVE adds REPORTED
          sales, half-weights PENDING certs, and adds AUDIT_FLAGGED amounts — totals
          58.07 (STRICT) vs 63.16 (INCLUSIVE) differ.
        test_recipe:
          setup:
            - "Dealer DL-B1 ACTIVE; cert CA-1 verified then EXPIRED (expires 2026-07-01, clock 2026-08-01); CA-2 ACTIVE; CA-3 PENDING_VERIFICATION -> 1 ACTIVE + 1 PENDING"
            - "Stock audit 1500 >= min 1000 -> stock_compliant true -> parts_score 100"
            - "Target Q3 2026 units=4; sales SC-1, SC-2 ACCEPTED; SC-3 left REPORTED"
            - "Claim X parts 10000 PAID; claim Y parts 4000 CHARGED_BACK (FULL 4000); claim Z parts 5000 AUDIT_FLAGGED"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer B1", dealer_code: "DL-B1", region: "East", credit_limit_cents: 1000000, min_stock_value_cents: 1000 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CA-1", earned_on: "2025-01-10", expires_on: "2026-07-01" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CA-2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-B1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CA-3", earned_on: "2026-06-01", expires_on: "2028-06-01" }, as: DealerUser, as_user_id: "${d}" }
            - { call: "POST /network/certifications/${c1}/expire", payload: {}, as: OemAuditor }
            - { call: "POST /network/dealers/${d}/stock-audit", payload: { observed_stock_value_cents: 1500 }, as: OemAuditor }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 4 }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "SC-1", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s1: $.data.id } }
            - { call: "POST /network/unit-sales/${s1}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "SC-2", sale_date: "2026-08-06", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s2: $.data.id } }
            - { call: "POST /network/unit-sales/${s2}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "SC-3", sale_date: "2026-08-07", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}" }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "CL-X", parts_cost_cents: 10000, labor_hours: 0, failure_description: "hydraulic pump" }, as: DealerUser, as_user_id: "${d}", captures: { clx: $.data.id } }
            - { call: "POST /network/warranty-claims/${clx}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${clx}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "CL-Y", parts_cost_cents: 4000, labor_hours: 0, failure_description: "seal kit" }, as: DealerUser, as_user_id: "${d}", captures: { cly: $.data.id } }
            - { call: "POST /network/warranty-claims/${cly}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cly}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cly}/flag-audit", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cly}/chargeback", payload: { finding: "FULL" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "CL-Z", parts_cost_cents: 5000, labor_hours: 0, failure_description: "valve" }, as: DealerUser, as_user_id: "${d}", captures: { clz: $.data.id } }
            - { call: "POST /network/warranty-claims/${clz}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${clz}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${clz}/flag-audit", payload: {}, as: OemAuditor }
          trigger:
            - { call: "GET /network/dealers/${d}/scorecard", payload: { period_year: 2026, period_quarter: 3, variant: "STRICT" }, as: Any }
            - { call: "GET /network/dealers/${d}/scorecard", payload: { period_year: 2026, period_quarter: 3, variant: "INCLUSIVE" }, as: Any }
          assert:
            - "STRICT: sales_score == 33.33 (2/4), service_score == 78.95 (100 - 100*4000/19000), training_score == 50.00, parts_score == 100, total_score == 58.07"
            - "INCLUSIVE: sales_score == 50.00 (3/4), service_score == 52.63 (100 - 100*9000/19000), training_score == 75.00, parts_score == 100, total_score == 63.16"
            - "STRICT total_score != INCLUSIVE total_score"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: floorplan_interest_age_bracket_accrual
        grounds:
          - calculations.floorplan_interest_accrual
          - state_machines.FloorPlanAdvance.OPEN_to_PAST_DUE
        distinguishing_aspect: |
          Mode (a): 3+ inputs (principal, age_days, paid curtailments) with non-linear
          bracket selection — an advance aged 200 days accrues across TWO rate brackets
          (90 days @0.0002 + 20 days @0.0004) after a 90-day free window: 26000 cents,
          and the same audit flips status to PAST_DUE.
        test_recipe:
          setup:
            - "Dealer DL-C1 ACTIVE with credit_limit 2000000"
            - "Advance of 1000000 on serial F-300 created at default clock 2026-08-01 (advance_date)"
            - "Clock moved to 2027-02-17 -> age 200 days (Aug31+Sep30+Oct31+Nov30+Dec31+Jan31+16)"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer C1", dealer_code: "DL-C1", region: "North", credit_limit_cents: 2000000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-C1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-C2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-C1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "F-300", advance_cents: 1000000 }, as: OemNetworkAdmin, captures: { adv: $.data.id } }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2027-02-17T00:00:00Z" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/floorplan-advances/${adv}/aging-audit", payload: {}, as: OemAuditor, captures: { adv_status: $.data.status, adv_interest: $.data.accrued_interest_cents } }
          assert:
            - "FloorPlanAdvance.${adv}.accrued_interest_cents == 26000 (1000000 * (0.0002*90 + 0.0004*20))"
            - "FloorPlanAdvance.${adv}.status == PAST_DUE (200 days > 90, <= 270)"
            - "Dealer.${d}.floorplan_utilization_cents == 1000000 (PAST_DUE still counts)"

      - name: parts_return_credit_per_line_rounding
        grounds:
          - calculations.parts_return_credit
          - entities.PartsReturn.fields.credit_cents
          - entities.PartsReturn.fields.restock_pct_applied
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-line-then-sum — two lines of
          1 x 2 cents at 15% restock give 2+2=4 cents per-line (round_half_up(1.7)=2
          each); the forbidden sum-then-round order would give round(3.4)=3.
        test_recipe:
          setup:
            - "Dealer DL-D1 ACTIVE, min_stock 1000, stock audit 1500 -> compliant"
            - "Parts purchases 10000 in clock year 2026 -> allowance 500"
            - "Default clock 2026-08-01 is after June 30 -> restock_pct 0.15"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer D1", dealer_code: "DL-D1", region: "South", credit_limit_cents: 500000, min_stock_value_cents: 1000 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-D1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-D2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-D1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers/${d}/stock-audit", payload: { observed_stock_value_cents: 1500 }, as: OemAuditor }
            - { call: "POST /network/dealers/${d}/parts-purchases", payload: { amount_cents: 10000 }, as: OemNetworkAdmin }
            - { call: "POST /network/parts-returns", payload: { dealer_id: "${d}", return_year: 2026, lines: [ { part_number: "P1", quantity: 1, unit_credit_cents: 2 }, { part_number: "P2", quantity: 1, unit_credit_cents: 2 } ] }, as: DealerUser, as_user_id: "${d}", captures: { r: $.data.id } }
          trigger:
            - { call: "POST /network/parts-returns/${r}/submit", payload: {}, as: DealerUser, as_user_id: "${d}" }
            - { call: "POST /network/parts-returns/${r}/decide", payload: { decision: "CREDIT" }, as: OemSalesOps }
          assert:
            - "PartsReturn.${r}.credit_cents == 4 (per-line round-then-sum; sum-then-round would give 3)"
            - "PartsReturn.${r}.restock_pct_applied == 0.15"
            - "PartsReturn.${r}.status == CREDITED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: warranty_claim_audit_dispute_cycle
        grounds:
          - state_machines.WarrantyClaim.PAID_to_AUDIT_FLAGGED
          - state_machines.WarrantyClaim.AUDIT_FLAGGED_to_CHARGED_BACK
          - state_machines.WarrantyClaim.CHARGED_BACK_to_DISPUTED
          - state_machines.WarrantyClaim.DISPUTED_to_PAID
        distinguishing_aspect: |
          WarrantyClaim machine is cyclic: PAID -> AUDIT_FLAGGED -> CHARGED_BACK ->
          DISPUTED -> PAID loops back to a prior state; chargeback posts 10000 to the
          dealer balance mid-loop and the UPHELD resolution reverses it to 0.
        test_recipe:
          setup:
            - "Dealer DL-E1 ACTIVE; claim on serial C-500: parts 10000, labor 0 -> amount 10000 (BRONZE tier, labor irrelevant)"
            - "Claim driven to PAID, then flagged"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer E1", dealer_code: "DL-E1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-E1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-E2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-E1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "C-500", parts_cost_cents: 10000, labor_hours: 0, failure_description: "boom cylinder" }, as: DealerUser, as_user_id: "${d}", captures: { cl: $.data.id } }
            - { call: "POST /network/warranty-claims/${cl}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl}/flag-audit", payload: {}, as: OemAuditor }
          trigger:
            - { call: "POST /network/warranty-claims/${cl}/chargeback", payload: { finding: "FULL" }, as: OemAuditor }
            - { call: "GET /network/dealers/${d}", as: Any, captures: { bal_mid: $.data.chargeback_balance_cents } }
            - { call: "POST /network/warranty-claims/${cl}/dispute", payload: {}, as: DealerUser, as_user_id: "${d}" }
            - { call: "POST /network/warranty-claims/${cl}/resolve-dispute", payload: { outcome: "UPHELD" }, as: OemAuditor }
            - { call: "GET /network/warranty-claims/${cl}", as: Any }
            - { call: "GET /network/dealers/${d}", as: Any }
          assert:
            - "after chargeback: WarrantyClaim.${cl}.status == CHARGED_BACK and chargeback_amount_cents == 10000"
            - "after chargeback: Dealer.${d}.chargeback_balance_cents == 10000 (< 50000, no suspension)"
            - "after dispute+resolve UPHELD: WarrantyClaim.${cl}.status == PAID (cycle closed)"
            - "after resolve UPHELD: WarrantyClaim.${cl}.chargeback_amount_cents == null"
            - "after resolve UPHELD: Dealer.${d}.chargeback_balance_cents == 0"

      - name: lead_decline_and_reroute_cycle
        grounds:
          - state_machines.Lead.ROUTED_to_DECLINED
          - state_machines.Lead.DECLINED_to_ROUTED
          - calculations.lead_routing_selection
        distinguishing_aspect: |
          Lead machine is cyclic: ROUTED -> DECLINED -> ROUTED; the second routing must
          exclude the decliner via declined_dealer_ids, so with two SHARED-coverage
          dealers the lead moves D1 -> D2 despite D1 winning the initial tie-break.
        test_recipe:
          setup:
            - "Dealers DL-F1 (created first) and DL-F2 ACTIVE, both with SHARED assignments on territory T-100 window [2026-01-01, 2026-12-31)"
            - "Lead in T-100; initial route ties on open_lead_count 0=0 -> created_at ASC -> DL-F1"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer F1", dealer_code: "DL-F1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d1: $.data.id, d1_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-F1A", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { f1c1: $.data.id } }
            - { call: "POST /network/certifications/${f1c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-F1B", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { f1c2: $.data.id } }
            - { call: "POST /network/certifications/${f1c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d1}", agreement_code: "AGR-F1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a1: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a1}/activate", payload: { expected_dealer_version: "${d1_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers", payload: { name: "Dealer F2", dealer_code: "DL-F2", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d2: $.data.id, d2_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-F2A", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { f2c1: $.data.id } }
            - { call: "POST /network/certifications/${f2c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-F2B", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { f2c2: $.data.id } }
            - { call: "POST /network/certifications/${f2c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d2}", agreement_code: "AGR-F2", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a2: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d2_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d1}", agreement_id: "${a1}", territory_code: "T-100", coverage_type: "SHARED", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d2}", agreement_id: "${a2}", territory_code: "T-100", coverage_type: "SHARED", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/leads", payload: { territory_code: "T-100", product_line: "EXCAVATOR", estimated_value_cents: 500000, contact_name: "Sam" }, as: OemSalesOps, captures: { lead: $.data.id } }
          trigger:
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps, captures: { first_dealer: $.data.routed_dealer_id } }
            - { call: "POST /network/leads/${lead}/respond", payload: { response: "DECLINE" }, as: DealerUser, as_user_id: "${d1}" }
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps, captures: { second_dealer: $.data.routed_dealer_id } }
            - { call: "POST /network/leads/${lead}/respond", payload: { response: "ACCEPT" }, as: DealerUser, as_user_id: "${d2}" }
          assert:
            - "first route: Lead.${lead}.routed_dealer_id == ${d1} (tie on 0 open leads -> earliest created_at)"
            - "after decline: Lead.${lead}.status == DECLINED and declined_dealer_ids contains ${d1}"
            - "second route: Lead.${lead}.routed_dealer_id == ${d2} (decliner excluded)"
            - "final: Lead.${lead}.status == ACCEPTED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: dealer_termination_cascade
        grounds:
          - state_machines.Dealer.ACTIVE_to_TERMINATED
          - state_machines.DealerAgreement.ACTIVE_to_TERMINATED
          - state_machines.TerritoryAssignment.ACTIVE_to_RELEASED
          - state_machines.Lead.ROUTED_to_DECLINED
        distinguishing_aspect: |
          Depth-3 chain from POST /dealers/{id}/terminate: dealer termination forces
          its ACTIVE agreement to TERMINATED (link 1); the agreement's termination
          releases its ACTIVE assignment (link 2); the assignment's release re-queues
          the ROUTED lead to NEW (link 3) — each hop caused by the previous mutation.
        test_recipe:
          setup:
            - "Dealer DL-G1 ACTIVE with agreement ACTIVE, EXCLUSIVE assignment on T-200 [2026-01-01, 2026-12-31)"
            - "Targets Q1 2026 and Q2 2026 (units 10) both closed with 0 achieved -> CLOSED_MISSED; STRICT score 45 < 60 both quarters (sales 0, service 100, training 100, parts 0)"
            - "Lead on T-200 ROUTED to DL-G1"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer G1", dealer_code: "DL-G1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 1000 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-G1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-G2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-G1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-200", coverage_type: "EXCLUSIVE", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin, captures: { asg: $.data.id } }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 1, target_units: 10 }, as: OemSalesOps, captures: { t1: $.data.id } }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 2, target_units: 10 }, as: OemSalesOps, captures: { t2: $.data.id } }
            - { call: "POST /network/sales-targets/${t1}/close", payload: {}, as: OemSalesOps }
            - { call: "POST /network/sales-targets/${t2}/close", payload: {}, as: OemSalesOps }
            - { call: "POST /network/leads", payload: { territory_code: "T-200", product_line: "LOADER", estimated_value_cents: 300000, contact_name: "Pat" }, as: OemSalesOps, captures: { lead: $.data.id } }
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps }
          trigger:
            - { call: "POST /network/dealers/${d}/terminate", payload: {}, as: OemNetworkAdmin }
            - { call: "GET /network/dealer-agreements/${a}", as: Any }
            - { call: "GET /network/territory-assignments/${asg}", as: Any }
            - { call: "GET /network/leads/${lead}", as: Any }
          assert:
            - "Dealer.${d}.status == TERMINATED"
            - "DealerAgreement.${a}.status == TERMINATED (link 1)"
            - "TerritoryAssignment.${asg}.status == RELEASED (link 2)"
            - "Lead.${lead}.status == NEW and routed_dealer_id == null (link 3)"

      - name: chargeback_suspension_cascade
        grounds:
          - state_machines.WarrantyClaim.AUDIT_FLAGGED_to_CHARGED_BACK
          - state_machines.Dealer.ACTIVE_to_SUSPENDED
          - entities.Dealer.fields.chargeback_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (claim chargeback, not termination):
          chargeback posts to Dealer.chargeback_balance_cents (link 1); the balance
          crossing the 50000 threshold itself flips Dealer ACTIVE -> SUSPENDED
          (link 2); the suspension re-queues the dealer's ROUTED lead (link 3).
        test_recipe:
          setup:
            - "Dealer DL-H1 ACTIVE with EXCLUSIVE assignment on T-300 and a ROUTED lead"
            - "Claim 1 parts 30000 PAID + flagged; claim 2 parts 25000 PAID + flagged"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer H1", dealer_code: "DL-H1", region: "East", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-H1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-H2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-H1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-300", coverage_type: "EXCLUSIVE", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/leads", payload: { territory_code: "T-300", product_line: "DOZER", estimated_value_cents: 250000, contact_name: "Lee" }, as: OemSalesOps, captures: { lead: $.data.id } }
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "H-1", parts_cost_cents: 30000, labor_hours: 0, failure_description: "transmission" }, as: DealerUser, as_user_id: "${d}", captures: { cl1: $.data.id } }
            - { call: "POST /network/warranty-claims/${cl1}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl1}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl1}/flag-audit", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl1}/chargeback", payload: { finding: "FULL" }, as: OemAuditor }
            - { call: "GET /network/dealers/${d}", as: Any, captures: { bal1: $.data.chargeback_balance_cents } }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "H-2", parts_cost_cents: 25000, labor_hours: 0, failure_description: "final drive" }, as: DealerUser, as_user_id: "${d}", captures: { cl2: $.data.id } }
            - { call: "POST /network/warranty-claims/${cl2}/decide", payload: { decision: "APPROVE" }, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl2}/pay", payload: {}, as: OemAuditor }
            - { call: "POST /network/warranty-claims/${cl2}/flag-audit", payload: {}, as: OemAuditor }
          trigger:
            - { call: "POST /network/warranty-claims/${cl2}/chargeback", payload: { finding: "FULL" }, as: OemAuditor }
            - { call: "GET /network/dealers/${d}", as: Any }
            - { call: "GET /network/leads/${lead}", as: Any }
          assert:
            - "after first chargeback: Dealer.${d}.chargeback_balance_cents == 30000 and status == ACTIVE (< 50000)"
            - "after second chargeback: WarrantyClaim.${cl2}.chargeback_amount_cents == 25000"
            - "after second chargeback: Dealer.${d}.chargeback_balance_cents == 55000 and status == SUSPENDED (threshold crossing caused by the balance mutation, not the endpoint)"
            - "Lead.${lead}.status == NEW and routed_dealer_id == null (suspension cascade)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_dealer_advance_state_over_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_DEALER_NOT_ACTIVE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the same floor-plan create violates
          both (dealer SUSPENDED; advance 200000 > available 100000) — priority 6
          state error ERR_DEALER_NOT_ACTIVE must win over priority 11 fiscal
          ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Dealer DL-J1 ACTIVE with credit_limit 100000, then suspended via status endpoint"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer J1", dealer_code: "DL-J1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-J1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-J2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-J1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers/${d}/status", payload: { target: "SUSPENDED" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "J-9", advance_cents: 200000 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEALER_NOT_ACTIVE (state priority 6 beats fiscal priority 11)"
            - "HTTP status == 409 (not 402)"
            - "no FloorPlanAdvance created; Dealer.${d}.floorplan_utilization_cents == 0"

      - name: territory_overlap_constraint_over_referential
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_TERRITORY_OVERLAP]
          - errors[ERR_AGREEMENT_DEALER_MISMATCH]
        distinguishing_aspect: |
          Category pair business_constraint vs business_referential: one assignment
          create both overlaps an ACTIVE EXCLUSIVE assignment on T-X (constraint,
          priority 8) and references an agreement belonging to a different dealer
          (referential, priority 10) — ERR_TERRITORY_OVERLAP must win.
        test_recipe:
          setup:
            - "Dealer DL-K1 ACTIVE with agreement AGR-K1 and ACTIVE EXCLUSIVE assignment on T-X [2026-01-01, 2026-12-31)"
            - "Dealer DL-K2 ACTIVE with its own agreement AGR-K2 (window inside which the requested assignment dates fall)"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer K1", dealer_code: "DL-K1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d1: $.data.id, d1_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-K1A", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { k1c1: $.data.id } }
            - { call: "POST /network/certifications/${k1c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-K1B", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { k1c2: $.data.id } }
            - { call: "POST /network/certifications/${k1c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d1}", agreement_code: "AGR-K1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a1: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a1}/activate", payload: { expected_dealer_version: "${d1_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d1}", agreement_id: "${a1}", territory_code: "T-X", coverage_type: "EXCLUSIVE", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers", payload: { name: "Dealer K2", dealer_code: "DL-K2", region: "East", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d2: $.data.id, d2_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-K2A", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { k2c1: $.data.id } }
            - { call: "POST /network/certifications/${k2c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-K2B", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { k2c2: $.data.id } }
            - { call: "POST /network/certifications/${k2c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d2}", agreement_code: "AGR-K2", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a2: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d2_v}" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d2}", agreement_id: "${a1}", territory_code: "T-X", coverage_type: "EXCLUSIVE", starts_on: "2026-06-01", ends_on: "2026-09-01" }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TERRITORY_OVERLAP (constraint priority 8 beats referential priority 10)"
            - "HTTP status == 409 (not 422 ERR_AGREEMENT_DEALER_MISMATCH)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: target_close_exact_attainment_is_met
        grounds:
          - state_machines.SalesTarget.OPEN_to_CLOSED_MET
          - calculations.tier_discount
        distinguishing_aspect: |
          Numeric boundary on achieved_units vs target_units via the close endpoint:
          achieved == target (2 == 2) is CLOSED_MET because the comparison is >= ;
          achieved 1 would be MISSED. Metric: unit count.
        test_recipe:
          setup:
            - "Dealer DL-T1 ACTIVE; target Q3 2026 units=2; sales B-1 and B-2 accepted -> achieved exactly 2; clock past quarter end"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer T1", dealer_code: "DL-T1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-T1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-T2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-T1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 2 }, as: OemSalesOps, captures: { t: $.data.id } }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "B-1", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s1: $.data.id } }
            - { call: "POST /network/unit-sales/${s1}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "B-2", sale_date: "2026-08-06", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s2: $.data.id } }
            - { call: "POST /network/unit-sales/${s2}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/sales-targets/${t}/close", payload: {}, as: OemSalesOps, captures: { st: $.data.status } }
          assert:
            - "SalesTarget.${t}.achieved_units == 2 (exactly at target)"
            - "SalesTarget.${t}.status == CLOSED_MET (>= boundary: equality counts as MET)"
            - "SalesTarget.${t}.final_discount_rate == 0.05 (ratio 1.0 >= SILVER threshold 1.0, < GOLD 1.2)"

      - name: lead_route_empty_pool_orphans
        grounds:
          - calculations.lead_routing_selection
          - state_machines.Lead.NEW_to_ORPHANED
          - state_machines.Lead.ORPHANED_to_ROUTED
        distinguishing_aspect: |
          Empty-collection boundary via the route endpoint: zero eligible dealers is
          not an error — the lead goes ORPHANED; once an assignment exists the same
          endpoint routes it. Metric: candidate-pool cardinality (0 vs 1).
        test_recipe:
          setup:
            - "Lead on territory T-EMPTY which no assignment covers (pool empty)"
            - "Later: Dealer DL-L1 ACTIVE with EXCLUSIVE assignment on T-EMPTY"
          setup_api_calls:
            - { call: "POST /network/leads", payload: { territory_code: "T-EMPTY", product_line: "CRANE", estimated_value_cents: 900000, contact_name: "Rae" }, as: OemSalesOps, captures: { lead: $.data.id } }
            - { call: "POST /network/dealers", payload: { name: "Dealer L1", dealer_code: "DL-L1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-L1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-L2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-L1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps, captures: { st1: $.data.status } }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-EMPTY", coverage_type: "EXCLUSIVE", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps, captures: { st2: $.data.status, rd: $.data.routed_dealer_id } }
          assert:
            - "first route (empty pool): Lead.${lead}.status == ORPHANED and routed_dealer_id == null — no error"
            - "second route (pool of 1): Lead.${lead}.status == ROUTED and routed_dealer_id == ${d}"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: agreement_activation_requires_certifications
        grounds:
          - state_machines.DealerAgreement.DRAFT_to_ACTIVE
          - validations[priority=7]
          - errors[ERR_CERTIFICATION_COMPLIANCE]
        distinguishing_aspect: |
          Entity pair DealerAgreement <-> Certification: activation is gated on a
          DIFFERENT entity's aggregate state (>= 2 ACTIVE certifications); with only
          one ACTIVE cert the same request fails, and succeeds after the second cert
          is verified — with the dealer version untouched by the failure.
        test_recipe:
          setup:
            - "Dealer DL-M1 ONBOARDING with exactly 1 ACTIVE certification and a DRAFT agreement"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer M1", dealer_code: "DL-M1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-M1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-M1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-M2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "GET /network/dealers/${d}", as: Any }
          assert:
            - "first activate: error_id == ERR_CERTIFICATION_COMPLIANCE (only 1 ACTIVE cert)"
            - "failed activate mutated nothing: Dealer.version still == ${d_v} when retried"
            - "second activate succeeds: DealerAgreement.${a}.status == ACTIVE"
            - "Dealer.${d}.status == ACTIVE (ONBOARDING -> ACTIVE on first activation)"

      - name: sale_void_blocked_by_floorplan_payoff
        grounds:
          - state_machines.UnitSale.ACCEPTED_to_VOIDED
          - state_machines.FloorPlanAdvance.OPEN_to_PAID_OFF
          - errors[ERR_SALE_PAYOFF_LOCKED]
        distinguishing_aspect: |
          Entity pair UnitSale <-> FloorPlanAdvance: voiding an ACCEPTED sale is
          rejected precisely because the linked advance's state is PAID_OFF via the
          acceptance cascade; the same void on an unlinked sale succeeds (see
          target_attainment_accept_void_invariant).
        test_recipe:
          setup:
            - "Dealer DL-N1 ACTIVE credit 200000; advance on serial N-1 (50000) OPEN"
            - "Target Q3 2026 units=5; sale on the SAME serial N-1 accepted -> advance PAID_OFF by cascade"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer N1", dealer_code: "DL-N1", region: "West", credit_limit_cents: 200000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-N1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-N2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-N1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "N-1", advance_cents: 50000 }, as: OemNetworkAdmin, captures: { adv: $.data.id } }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 5 }, as: OemSalesOps, captures: { t: $.data.id } }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "N-1", sale_date: "2026-08-03", list_price_cents: 80000 }, as: DealerUser, as_user_id: "${d}", captures: { s: $.data.id } }
            - { call: "POST /network/unit-sales/${s}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
          trigger:
            - { call: "POST /network/unit-sales/${s}/void", payload: {}, as: OemSalesOps, captures: { err: $.data.error_id } }
            - { call: "GET /network/unit-sales/${s}", as: Any }
            - { call: "GET /network/floorplan-advances/${adv}", as: Any }
            - { call: "GET /network/sales-targets/${t}", as: Any }
          assert:
            - "error_id == ERR_SALE_PAYOFF_LOCKED"
            - "UnitSale.${s}.status == ACCEPTED (unchanged)"
            - "FloorPlanAdvance.${adv}.status == PAID_OFF (acceptance cascade already fired)"
            - "SalesTarget.${t}.achieved_units == 1 (void blocked, attainment unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: territory_assignment_half_open_adjacency
        grounds:
          - errors[ERR_TERRITORY_OVERLAP]
          - entities.TerritoryAssignment.fields.starts_on
          - entities.TerritoryAssignment.fields.ends_on
        distinguishing_aspect: |
          Half-open interval semantics on the territory resource: [2026-01-01,
          2026-07-01) and [2026-07-01, 2026-12-31) touch but do NOT overlap (ends_on
          exclusive) — adjacency succeeds, while [2026-06-15, 2026-08-01) is rejected.
        test_recipe:
          setup:
            - "Dealer DL-P1 ACTIVE with agreement [2026-01-01, 2026-12-31]"
            - "Existing ACTIVE EXCLUSIVE assignment on T-400 [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer P1", dealer_code: "DL-P1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-P1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-P2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-P1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-400", coverage_type: "EXCLUSIVE", starts_on: "2026-01-01", ends_on: "2026-07-01" }, as: OemNetworkAdmin, captures: { asg1: $.data.id } }
          trigger:
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-400", coverage_type: "EXCLUSIVE", starts_on: "2026-07-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin, captures: { asg2: $.data.id } }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-400", coverage_type: "EXCLUSIVE", starts_on: "2026-06-15", ends_on: "2026-08-01" }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent assignment succeeds: TerritoryAssignment.${asg2}.status == ACTIVE (half-open: 2026-07-01 boundary is free)"
            - "overlapping assignment rejected: error_id == ERR_TERRITORY_OVERLAP"

      - name: agreement_activation_inclusive_overlap
        grounds:
          - state_machines.DealerAgreement.DRAFT_to_ACTIVE
          - errors[ERR_AGREEMENT_OVERLAP]
          - concurrency_rules[agreement-activate-stale-dealer]
        distinguishing_aspect: |
          Inclusive closed-interval semantics on the dealer's agreement resource:
          [2026-12-31, 2027-12-31] TOUCHES the ACTIVE [2026-01-01, 2026-12-31] at one
          date and that single shared day counts as overlap (unlike assignments) —
          activation requires supersede_existing=true, which retires the old
          agreement to SUPERSEDED.
        test_recipe:
          setup:
            - "Dealer DL-Q1 ACTIVE with agreement AGR-Q1 ACTIVE [2026-01-01, 2026-12-31]; dealer.version read fresh"
            - "Second DRAFT agreement AGR-Q2 [2026-12-31, 2027-12-31] (touching expiry day)"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer Q1", dealer_code: "DL-Q1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-Q1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-Q2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-Q1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a1: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a1}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "GET /network/dealers/${d}", as: Any, captures: { d_v2: $.data.version } }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-Q2", effective_date: "2026-12-31", expiry_date: "2027-12-31" }, as: OemNetworkAdmin, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d_v2}", supersede_existing: false }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d_v2}", supersede_existing: true }, as: OemNetworkAdmin }
            - { call: "GET /network/dealer-agreements/${a1}", as: Any }
          assert:
            - "without supersede flag: error_id == ERR_AGREEMENT_OVERLAP (touching 2026-12-31 counts under inclusive semantics)"
            - "with supersede_existing=true: activation succeeds"
            - "DealerAgreement.${a1}.status == SUPERSEDED"
            - "DealerAgreement.${a2}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: floorplan_utilization_advance_payoff_invariant
        grounds:
          - entities.Dealer.fields.floorplan_utilization_cents
          - state_machines.FloorPlanAdvance.OPEN_to_PAID_OFF
          - state_machines.FloorPlanAdvance.OPEN_to_CURTAILED
        distinguishing_aspect: |
          Conserved quantity: credit cents. Invariant Dealer.floorplan_utilization_cents
          == sum of (advance_cents - paid_curtailments_cents) over non-terminal
          advances; the create+full-payoff pair returns utilization to exactly its
          pre-action value (0), and a partial payment leaves exactly the remainder
          (30000), with available == limit - utilization at every step.
        test_recipe:
          setup:
            - "Dealer DL-R1 ACTIVE, credit_limit 300000, utilization 0"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer R1", dealer_code: "DL-R1", region: "West", credit_limit_cents: 300000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-R1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-R2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-R1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "R-1", advance_cents: 120000 }, as: OemNetworkAdmin, captures: { adv1: $.data.id } }
            - { call: "GET /network/dealers/${d}", as: Any, captures: { u1: $.data.floorplan_utilization_cents } }
            - { call: "POST /network/floorplan-advances/${adv1}/payment", payload: { amount_cents: 120000 }, as: OemNetworkAdmin }
            - { call: "GET /network/dealers/${d}", as: Any, captures: { u2: $.data.floorplan_utilization_cents, avail2: $.data.floorplan_available_cents } }
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "R-2", advance_cents: 50000 }, as: OemNetworkAdmin, captures: { adv2: $.data.id } }
            - { call: "POST /network/floorplan-advances/${adv2}/payment", payload: { amount_cents: 20000 }, as: OemNetworkAdmin }
            - { call: "GET /network/dealers/${d}", as: Any }
            - { call: "GET /network/floorplan-advances/${adv2}", as: Any }
          assert:
            - "after advance 120000: utilization == 120000"
            - "after full payoff (compensation): utilization == 0 == pre-action value; floorplan_available_cents == 300000"
            - "after advance 50000 + payment 20000: utilization == 30000 == sum(remaining principal over non-terminal advances)"
            - "FloorPlanAdvance.${adv2}.status == CURTAILED and paid_curtailments_cents == 20000"
            - "final floorplan_available_cents == 270000 (invariant: available + utilization == credit_limit)"

      - name: target_attainment_accept_void_invariant
        grounds:
          - entities.SalesTarget.fields.achieved_units
          - state_machines.UnitSale.REPORTED_to_ACCEPTED
          - state_machines.UnitSale.ACCEPTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: accepted-unit count. Invariant achieved_units == count of
          ACCEPTED UnitSales for the target's dealer+quarter; the accept (+1) and void
          (-1) pair returns achieved_units to exactly its pre-action value 0 — a
          different conserved quantity (unit count, not cents) than the floor-plan rule.
        test_recipe:
          setup:
            - "Dealer DL-S1 ACTIVE; target Q3 2026 units=5; sale W-1 has NO floor-plan advance (void allowed)"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer S1", dealer_code: "DL-S1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-S1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-S2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-S1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 5 }, as: OemSalesOps, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "W-1", sale_date: "2026-08-03", list_price_cents: 50000 }, as: DealerUser, as_user_id: "${d}", captures: { s: $.data.id } }
            - { call: "POST /network/unit-sales/${s}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "GET /network/sales-targets/${t}", as: Any, captures: { ach1: $.data.achieved_units } }
            - { call: "POST /network/unit-sales/${s}/void", payload: {}, as: OemSalesOps }
            - { call: "GET /network/sales-targets/${t}", as: Any, captures: { ach2: $.data.achieved_units } }
          assert:
            - "after accept: SalesTarget.${t}.achieved_units == 1 (forward action)"
            - "after void (compensation): SalesTarget.${t}.achieved_units == 0 == pre-action value"
            - "UnitSale.${s}.status == VOIDED"
            - "invariant holds: achieved_units == count of ACCEPTED sales for (dealer, 2026 Q3)"
