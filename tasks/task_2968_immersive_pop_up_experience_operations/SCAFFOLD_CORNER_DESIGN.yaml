      - name: demand_index_counts_only_released_slots_and_settled_orders
        claim_type: input_set_filtering
        grounds:
          - calculations.run_extension_demand_index.input_set
          - endpoints[GET /experience-runs/{runId}/demand-index]
        distinguishing_aspect: |
          Both terms of the demand index are aggregates over filtered sets, and the filters are the
          whole difficulty: a CANCELLED slot keeps its released_capacity on the row but must leave
          the denominator, a DRAFT slot was never in it, a PENDING order must not enter the order
          count, a CANCELLED order must not either, and a REFUND_DUE order counts in BOTH the
          denominator and the numerator of the refund share. The read endpoint must also persist
          nothing, so run.demand_index stays 0.00 while the response reports 5.00.
