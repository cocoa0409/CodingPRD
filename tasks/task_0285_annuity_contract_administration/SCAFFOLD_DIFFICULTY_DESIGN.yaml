# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Annuity Contract Administration. Nine §0.5 rule_ids, >=2 instances each.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls
# chain drives empty-DB -> the asserted state using only §1.5 endpoints.
# All formula-derived asserts are literals computed against §1.3 + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: projection_settled_vs_include_pending_on_contract
        grounds:
          - calculations.projected_maturity_value_forward
          - calculations.accumulation_value_chronological
          - entities.Contract.fields.accumulation_value_cents
        distinguishing_aspect: |
          Same FIXED contract, same clock, two variants of projected_maturity_value_forward
          diverge purely by inclusion set: settled_only excludes the one SUBMITTED premium
          (base 2,000,000 -> 2,217,436) while include_pending folds its 500,000 net in
          (base 2,500,000 -> 2,771,795); the entity domain is Contract value projection.
        test_recipe:
          setup:
            - "FIXED product, fixed_annual_rate_bps=350, surrender_charge_schedule length 3 (years 0,1,2)."
            - "Contract issued 2026-01-01 with one CLEARED initial premium net 2,000,000 and one still-SUBMITTED subsequent premium net 500,000; contract_year=0, accumulation=2,000,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "Fixed 3yr", contract_type: "FIXED", fixed_annual_rate_bps: 350, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 }, { contract_year: 1, charge_bps: 600 }, { contract_year: 2, charge_bps: 500 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Ada Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 500000, expected_contract_version: "${cv1}" }
              as: ContractAdmin
              captures: { prem1: $.data.id }
          trigger:
            - call: "GET /contracts/${cid}/projection"
              payload: { include_pending: false }
              as: ContractAdmin
              captures: { proj_settled: $.data.projected_maturity_value_cents }
            - call: "GET /contracts/${cid}/projection"
              payload: { include_pending: true }
              as: ContractAdmin
              captures: { proj_pending: $.data.projected_maturity_value_cents }
          assert:
            - "projection(include_pending=false).projected_maturity_value_cents == 2217436"
            - "projection(include_pending=true).projected_maturity_value_cents == 2771795"
            - "proj_settled != proj_pending"

      - name: death_benefit_return_of_premium_vs_account_value
        grounds:
          - calculations.death_benefit_valuation
          - entities.DeathClaim.fields.death_benefit_cents
          - entities.Contract.fields.cumulative_premium_cents
          - state_machines.DeathClaim.VERIFYING_to_VALUED
        distinguishing_aspect: |
          Two contracts with identical 2,000,000 cumulative premium reduced to accumulation 1,800,000
          by a 200,000 free-corridor partial withdrawal value the death benefit differently by
          Product.death_benefit_type: RETURN_OF_PREMIUM = max(2,000,000, 1,800,000) = 2,000,000 vs
          ACCOUNT_VALUE = 1,800,000; the divergence lives on the DeathClaim/Contract domain, not
          Contract value projection.
        test_recipe:
          setup:
            - "Two FIXED contracts each funded 2,000,000 (cumulative_premium 2,000,000) then a 200,000 fully-free-corridor partial withdrawal settles so accumulation=1,800,000; product A death_benefit_type RETURN_OF_PREMIUM, product B ACCOUNT_VALUE. Corridor 10000bps and year0 charge 0 so the 200,000 withdrawal is fully free and uncharged."
            - "Each contract has a single 100% beneficiary and a DeathClaim FILED then VERIFYING (identity verified), ready for value-benefit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "ROP", contract_type: "FIXED", fixed_annual_rate_bps: 0, free_withdrawal_corridor_bps: 10000, death_benefit_type: "RETURN_OF_PREMIUM", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid_rop: $.data.id }
            - call: "POST /products"
              payload: { name: "AV", contract_type: "FIXED", fixed_annual_rate_bps: 0, free_withdrawal_corridor_bps: 10000, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid_av: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid_rop}", owner_name: "Owner A", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid_a: $.data.id, cv_a0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid_a}", gross_premium_cents: 2000000, expected_contract_version: "${cv_a0}" }
              as: ContractAdmin
              captures: { prem_a: $.data.id }
            - call: "POST /premiums/${prem_a}/clear"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${cid_a}"
              payload: {}
              as: ContractAdmin
              captures: { cv_a1: $.data.version }
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid_a}", requested_amount_cents: 200000, expected_contract_version: "${cv_a1}" }
              as: ContractAdmin
              captures: { wd_a: $.data.id }
            - call: "POST /withdrawals/${wd_a}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /contracts"
              payload: { product_id: "${pid_av}", owner_name: "Owner B", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid_b: $.data.id, cv_b0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid_b}", gross_premium_cents: 2000000, expected_contract_version: "${cv_b0}" }
              as: ContractAdmin
              captures: { prem_b: $.data.id }
            - call: "POST /premiums/${prem_b}/clear"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${cid_b}"
              payload: {}
              as: ContractAdmin
              captures: { cv_b1: $.data.version }
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid_b}", requested_amount_cents: 200000, expected_contract_version: "${cv_b1}" }
              as: ContractAdmin
              captures: { wd_b: $.data.id }
            - call: "POST /withdrawals/${wd_b}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /beneficiaries"
              payload: { contract_id: "${cid_a}", full_name: "Bea A", relationship: "SPOUSE", share_bps: 10000 }
              as: ContractAdmin
            - call: "POST /beneficiaries"
              payload: { contract_id: "${cid_b}", full_name: "Bea B", relationship: "SPOUSE", share_bps: 10000 }
              as: ContractAdmin
            - call: "POST /death-claims"
              payload: { contract_id: "${cid_a}", date_of_death: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { dc_a: $.data.id }
            - call: "POST /death-claims/${dc_a}/verify-identity"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /death-claims"
              payload: { contract_id: "${cid_b}", date_of_death: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { dc_b: $.data.id }
            - call: "POST /death-claims/${dc_b}/verify-identity"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /death-claims/${dc_a}/value-benefit"
              payload: {}
              as: ComplianceOfficer
              captures: { db_a: $.data.death_benefit_cents }
            - call: "POST /death-claims/${dc_b}/value-benefit"
              payload: {}
              as: ComplianceOfficer
              captures: { db_b: $.data.death_benefit_cents }
          assert:
            - "DeathClaim.${dc_a}.death_benefit_cents == 2000000"
            - "DeathClaim.${dc_b}.death_benefit_cents == 1800000"
            - "db_a != db_b"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: index_segment_credit_nested_cap_floor_participation
        grounds:
          - calculations.apply_crediting
          - entities.IndexSegment.fields.cap_bps
          - entities.CreditingEvent.fields.credit_cents
          - state_machines.IndexSegment.OPEN_to_CREDITED
        distinguishing_aspect: |
          MODE (a) non-linear: index credit = round(segment_premium * max(min(raw*participation,
          cap), floor)/10000) with 4 inputs and nested min/max; raw 1200bps with cap 800bps and
          participation 100% clamps to the cap -> credit 80,000 on a 1,000,000 segment.
        test_recipe:
          setup:
            - "INDEXED product; contract ACTIVE via a 2,000,000 cleared initial premium."
            - "One OPEN IndexSegment SP500 segment_premium 1,000,000, cap_bps 800, floor_bps 0, participation_bps 10000, term [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "Indexed", contract_type: "INDEXED", death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Idx Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /index-segments"
              payload: { contract_id: "${cid}", index_name: "SP500", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", segment_premium_cents: 1000000, cap_bps: 800, floor_bps: 0, participation_bps: 10000 }
              as: ContractAdmin
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /crediting-events"
              payload: { contract_id: "${cid}", crediting_kind: "INDEX_SEGMENT", source_segment_id: "${seg}", raw_index_return_bps: 1200, credit_period_start: "2026-01-01T00:00:00Z", credit_period_end: "2026-07-01T00:00:00Z" }
              as: CreditingOfficer
              captures: { credit: $.data.credit_cents }
          assert:
            - "CreditingEvent.credit_cents == 80000"
            - "IndexSegment.${seg}.status == CREDITED"

      - name: withdrawal_pinned_order_corridor_then_charge_then_mva
        grounds:
          - calculations.free_corridor_split
          - calculations.surrender_charge_on_withdrawal
          - calculations.mva_adjustment
          - entities.Withdrawal.fields.gross_withdrawal_cents
          - state_machines.Withdrawal.REQUESTED_to_SETTLED
        distinguishing_aspect: |
          MODE (c) circular-looking/pinned evaluation order: gross_withdrawal depends on
          surrender_charge and mva, both of which depend on chargeable_amount which depends on the
          corridor split — the scaffold pins corridor -> charge -> mva so the value is well-defined.
          requested 300,000 with corridor allowance 200,000 gives free 200,000 / chargeable 100,000,
          charge 7,000 (700bps), mva +45 -> gross 307,045 (distinct mode from instance 1's mode a).
        test_recipe:
          setup:
            - "FIXED product with mva_enabled=true, fixed_annual_rate_bps=350, surrender schedule length 3 (year0 700bps), corridor 1000bps."
            - "Contract ACTIVE, accumulation=2,000,000, highest_anniversary_value=2,000,000, contract_year=0, free_withdrawal_used=0; one REQUESTED withdrawal requested_amount 300,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "FixedMVA", contract_type: "FIXED", fixed_annual_rate_bps: 350, free_withdrawal_corridor_bps: 1000, mva_enabled: true, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 }, { contract_year: 1, charge_bps: 600 }, { contract_year: 2, charge_bps: 500 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "MVA Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid}", requested_amount_cents: 300000, expected_contract_version: "${cv1}" }
              as: ContractAdmin
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /withdrawals/${wid}/settle"
              payload: {}
              as: ComplianceOfficer
              captures: { gross: $.data.gross_withdrawal_cents }
          assert:
            - "Withdrawal.${wid}.free_amount_cents == 200000"
            - "Withdrawal.${wid}.chargeable_amount_cents == 100000"
            - "Withdrawal.${wid}.surrender_charge_cents == 7000"
            - "Withdrawal.${wid}.mva_cents == 45"
            - "Withdrawal.${wid}.gross_withdrawal_cents == 307045"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: exchange1035_cyclic_submit_revision_loop
        grounds:
          - state_machines.Exchange1035.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Exchange1035.REVISION_REQUESTED_to_SUBMITTED
          - entities.Exchange1035.fields.revision_count
        distinguishing_aspect: |
          Exchange1035 has a true cycle SUBMITTED <-> REVISION_REQUESTED: a request-revision then
          resubmit returns to SUBMITTED while incrementing revision_count, so the same state is
          revisited (revision_count 0 -> 1) — non-linear on the Exchange1035 entity.
        test_recipe:
          setup:
            - "An OUTBOUND 1035 exchange against a source contract, transfer 1,000,000 basis 600,000, already SUBMITTED then returned for revision (REVISION_REQUESTED)."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Src Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { src: $.data.id }
            - call: "POST /exchanges-1035"
              payload: { direction: "OUTBOUND", source_contract_id: "${src}", external_carrier: "OtherCarrier", transfer_amount_cents: 1000000, cost_basis_cents: 600000 }
              as: ContractAdmin
              captures: { ex: $.data.id }
            - call: "POST /exchanges-1035/${ex}/submit"
              payload: {}
              as: ContractAdmin
            - call: "POST /exchanges-1035/${ex}/request-revision"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /exchanges-1035/${ex}/submit"
              payload: {}
              as: ContractAdmin
              captures: { rc: $.data.revision_count, st: $.data.status }
          assert:
            - "Exchange1035.${ex}.status == SUBMITTED"
            - "Exchange1035.${ex}.revision_count == 1"

      - name: death_claim_fork_join_two_branches
        grounds:
          - state_machines.DeathClaim.FILED_to_VERIFYING
          - state_machines.DeathClaim.VERIFYING_to_VALUED
          - state_machines.DeathClaim.VALUED_to_FUNDED
          - entities.DeathClaim.fields.identity_verified
          - entities.DeathClaim.fields.benefit_valued
        distinguishing_aspect: |
          DeathClaim is fork-join on a different entity than Exchange1035: FUND requires BOTH
          identity_verified (branch 1) AND benefit_valued (branch 2) true, set by divergent
          side-effect sets (verify sets identity_verified; value sets benefit_valued +
          death_benefit_cents). The complete fork-join reaches FUNDED and terminates the contract.
        test_recipe:
          setup:
            - "Contract ACTIVE funded 2,000,000 (ACCOUNT_VALUE product), single 100% beneficiary, DeathClaim FILED -> VERIFYING -> VALUED (both branches done)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "AV", contract_type: "FIXED", fixed_annual_rate_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /beneficiaries"
              payload: { contract_id: "${cid}", full_name: "Bea", relationship: "SPOUSE", share_bps: 10000 }
              as: ContractAdmin
            - call: "POST /death-claims"
              payload: { contract_id: "${cid}", date_of_death: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { dc: $.data.id }
            - call: "POST /death-claims/${dc}/verify-identity"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /death-claims/${dc}/value-benefit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /death-claims/${dc}/fund"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "DeathClaim.${dc}.identity_verified == true"
            - "DeathClaim.${dc}.benefit_valued == true"
            - "DeathClaim.${dc}.status == FUNDED"
            - "Contract.${cid}.status == TERMINATED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: full_surrender_cascade_depth3
        grounds:
          - state_machines.Withdrawal.REQUESTED_to_SETTLED
          - state_machines.Contract.ACTIVE_to_SURRENDERED
          - entities.SubAccountAllocation.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from Withdrawal settle: settle (A) -> Contract ACTIVE->SURRENDERED (B,
          caused by is_full_surrender) -> each ACTIVE SubAccountAllocation -> LIQUIDATED (C, caused
          by the contract transition, not by settle directly). Distinct trigger from premium-clear.
        test_recipe:
          setup:
            - "VARIABLE contract ACTIVE funded 2,000,000 with two ACTIVE allocations (6000/4000 bps); corridor 0 and year0 charge 0 so the full surrender gross == accumulation; one REQUESTED full-surrender withdrawal sized at the full accumulation 2,000,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "VarNoCharge", contract_type: "VARIABLE", free_withdrawal_corridor_bps: 0, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 0 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Var Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /sub-account-allocations"
              payload: { contract_id: "${cid}", division_name: "EQUITY", allocation_bps: 6000, unit_value_cents: 1000 }
              as: ContractAdmin
              captures: { alloc1: $.data.id }
            - call: "POST /sub-account-allocations"
              payload: { contract_id: "${cid}", division_name: "BOND", allocation_bps: 4000, unit_value_cents: 1000 }
              as: ContractAdmin
              captures: { alloc2: $.data.id }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid}", requested_amount_cents: 2000000, is_full_surrender: true, expected_contract_version: "${cv1}" }
              as: ContractAdmin
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /withdrawals/${wid}/settle"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Withdrawal.${wid}.status == SETTLED"
            - "Contract.${cid}.status == SURRENDERED"
            - "Contract.${cid}.accumulation_value_cents == 0"
            - "SubAccountAllocation.${alloc1}.status == LIQUIDATED"
            - "SubAccountAllocation.${alloc2}.status == LIQUIDATED"

      - name: premium_clear_cascade_depth2
        grounds:
          - state_machines.Premium.SUBMITTED_to_CLEARED
          - state_machines.Contract.PENDING_to_ACTIVE
          - entities.Contract.fields.issue_date
          - entities.Contract.fields.highest_anniversary_value_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: initial Premium clear (A) -> Contract
          PENDING->ACTIVE (B, caused by is_initial), which sets issue_date and
          highest_anniversary_value_cents = accumulation 2,000,000. Each link caused by the prior.
        test_recipe:
          setup:
            - "FIXED product; contract PENDING with one SUBMITTED initial premium gross 2,000,000; clock at 2026-03-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 350, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
