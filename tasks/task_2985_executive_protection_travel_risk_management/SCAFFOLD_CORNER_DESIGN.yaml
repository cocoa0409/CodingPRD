          assert:
            - "the destination rating stored composite_destination_score == ${dest_score} == 24.99 and rating_band == LOW; the trip was therefore approved with max_leg_risk_band == LOW, required_approval_level == MANAGER and ${band0} == LOW"
            - "the second assessment submitted with composite_risk_score == ${c2} == 42.50 == round_half_up((0.45*90.00 + 0.35*0 + 0.20*10.00) * 1.0, 2)"
            - "CH-B hop 1: the trigger returns HTTP 200 with status == APPROVED, approved_by_staff_id == ${dir_id}, approved_at == '2026-08-01T00:00:00.000Z', and Executive.threat_level == ELEVATED (42.50 falls in [30.00, 55.00))"
            - "CH-B hop 2: GET /exec-protection/risk-assessments/${ra1} shows status == SUPERSEDED, and the trigger response has supersedes_assessment_id == ${sup} == ${ra1}"
            - "CH-B hop 3: GET /exec-protection/trips/${trip_id} shows risk_assessment_id == ${ra2} — the live trip was re-pointed away from the superseded row"
            - "CH-B hop 4 on the leg: leg_risk_band == MODERATE (min(100.00, round_half_up(24.99 + 5, 2)) == 29.99), required_advance_items == [ROUTE_SURVEY, HOTEL_SURVEY], completed_advance_items still == [ROUTE_SURVEY] (recorded items are never discarded by a band change) and advance_complete == false"
            - "CH-B hop 4 on the trip: max_leg_risk_band == MODERATE, required_approval_level == DIRECTOR, approval_state == PENDING_REVIEW and briefing_ack_at == null"
            - "CH-B hop 4 on readiness: readiness_state == DEGRADED, check_in_interval_hours == 2 and Executive.open_degraded_trip_count == 1"
            - "no money moved: Executive.committed_budget_cents == 112500, spent_budget_cents == 0, remaining_budget_cents == 99887500 and Trip.provisional_security_cost_cents == 112500 — CH-B touches risk, not the ledger"

      - name: trip_dimensions_each_reach_their_target_state_on_the_declared_trigger
        claim_type: valid_transition
        grounds:
          - state_machines.Trip.approval_state
          - state_machines.Trip.readiness_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / trip_approval_and_readiness_dimensions_advance_independently
          rationale: "That instance walks both Trip dimensions through every forward edge and asserts the target state after each declared trigger."

      - name: independent_state_dimensions_change_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Trip.approval_state
          - state_machines.Trip.readiness_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / trip_approval_and_readiness_dimensions_advance_independently
          rationale: "Asserted as the whole point of that instance: an approval-dimension write must not move readiness and vice versa."

      - name: vendor_suspension_cascades_down_to_its_live_engagements
        claim_type: cascade_down
        grounds:
          - state_machines.VendorEngagement.ACTIVE_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / vendor_suspension_cascades_five_hops_to_check_in_interval
          rationale: "That instance walks all five CH-A hops and asserts that only the ACTIVE engagement is cancelled while the COMPLETED one is left alone."

      - name: destination_rating_revision_adjusts_every_dependent_leg_and_trip
        claim_type: cross_entity
        grounds:
          - state_machines.Trip.approval_state.APPROVED_to_PENDING_REVIEW
        excluded_because:
          difficulty_instance: transitive_cascade / destination_rating_revision_cascades_four_hops_and_reopens_approval
          rationale: "That instance asserts all four CH-C hops from the rating PATCH through leg bands to the reopened approval."

      - name: trip_denial_reverses_every_side_effect_of_its_submission
        claim_type: compensation
        grounds:
          - state_machines.Trip.approval_state.PENDING_REVIEW_to_DENIED.side_effects
        excluded_because:
          difficulty_instance: compensating_invariant / trip_denial_restores_the_money_ledger_to_its_pre_submit_identity
          rationale: "That instance asserts the three-part money ledger identity before submit, after submit and after the denial."

      - name: engagement_cancellation_keeps_the_vendor_hour_ledger_reconciled
        claim_type: ledger_sync
        grounds:
          - entities.Vendor.committed_engagement_hours
          - calculations.commitment_ledgers
        excluded_because:
          difficulty_instance: compensating_invariant / vendor_suspension_restores_the_hours_ledger_without_touching_completed_rows
          rationale: "That instance walks Q_VENDOR_HOURS through 0 -> 4 -> 10 -> 4 -> 0 across create, complete and suspension."

      - name: extraction_triage_cancels_only_the_assignments_that_have_not_started
        claim_type: conditional_cascade
        grounds:
          - state_machines.ProtectiveDetailAssignment.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: non_linear_state_machine / incident_extraction_fork_cancels_only_future_assignments_then_joins
          rationale: "That instance asserts the starts_at > clock_now predicate by leaving an already-running assignment CONFIRMED while a later one is cancelled."

      - name: trip_submission_is_guarded_by_the_state_of_a_different_entity
        claim_type: guarded_transitions
        grounds:
          - state_machines.Trip.approval_state.DRAFT_to_PENDING_REVIEW.preconditions
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / trip_submit_gated_on_risk_assessment_status_then_unblocked_by_approval
          rationale: "That instance blocks the same trigger on RiskAssessment.status and then unblocks it without changing anything on the Trip."

  - section: calculations
    instances:

      - name: destination_composite_lands_exactly_on_the_moderate_band_edge
        claim_type: threshold
        grounds:
          - calculations.destination_composite_score
          - entities.DestinationRating.rating_band
          - entities.DestinationRating.insurance_required_coverage_cents
          - endpoints.PATCH_/exec-protection/destination-ratings/{country_code}
        distinguishing_aspect: |
          The band cut-points are lower-bound inclusive, so the interesting triple is
          24.99 / 25.00 / 25.01 rather than integers. One hundredth of hazard index moves the
          composite by 0.002 * 100, so hazard 34.95 / 35.00 / 35.05 walks the composite across
          the edge, and the required insurance coverage must jump 25000000 -> 50000000 exactly
          when the composite REACHES 25.00, not after it passes it. The medical index enters
          inverted, so a perfect 100.00 contributes nothing at all.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one analyst; no rating yet for PT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 30.00, political_instability_index: 30.00, medical_infrastructure_index: 100.00, natural_hazard_index: 34.95, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { s1: $.data.composite_destination_score, b1: $.data.rating_band }
            - call: "PATCH /exec-protection/destination-ratings/PT"
              payload: { natural_hazard_index: 35.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { s2: $.data.composite_destination_score, b2: $.data.rating_band }
            - call: "PATCH /exec-protection/destination-ratings/PT"
              payload: { natural_hazard_index: 35.05 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { s3: $.data.composite_destination_score, b3: $.data.rating_band }
          assert:
            - "just below the edge: ${s1} == 24.99 == round_half_up(0.30*30.00 + 0.30*30.00 + 0.20*(100 - 100.00) + 0.20*34.95, 2), ${b1} == LOW, insurance_required_coverage_cents == 25000000"
            - "exactly on the edge: ${s2} == 25.00, ${b2} == MODERATE, insurance_required_coverage_cents == 50000000 — BAND_MODERATE_AT is inclusive, so equality already moves the band"
            - "just above the edge: ${s3} == 25.01, ${b3} == MODERATE, insurance_required_coverage_cents == 50000000"
            - "the inverted medical term contributed 0.00 at all three points because medical_infrastructure_index == 100.00"
            - "each PATCH returns HTTP 200 on the same row: country_code == 'PT' throughout, crime_index and political_instability_index still 30.00, and version reaches 3 after the second PATCH"

      - name: advance_requirement_set_adds_crowd_plan_for_a_public_appearance
        claim_type: correct_result
        grounds:
          - calculations.advance_requirement_set
          - calculations.required_approval_level
          - entities.TripLeg.required_advance_items
          - entities.TripLeg.advance_complete
        distinguishing_aspect: |
          trip_purpose is an input to a LEG-level derivation: a LOW-band leg normally requires
          only ROUTE_SURVEY, but on a PUBLIC_APPEARANCE trip the same leg must additionally
          require CROWD_PLAN, emitted last because the canonical order is fixed rather than
          insertion-ordered. The same purpose independently steps required_approval_level from
          MANAGER to DIRECTOR, so one enum drives two different derivations, and advance_complete
          must stay false until BOTH items are recorded.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; PT rated LOW (composite 9.80); APPROVED assessment; one DRAFT trip with trip_purpose PUBLIC_APPEARANCE and one PT leg"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Dan Director", staff_role: "DIRECTOR", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 15000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { dir_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/residential-survey"
              payload: { survey_outcome: "COMPLETE", residential_component: 10.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /exec-protection/risk-assessments/${ra_id}/submit"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments/${ra_id}/review"
              payload: { outcome: "APPROVE", review_notes: "cleared" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "PUBLIC_APPEARANCE", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 1, destination_country_code: "PT", arrive_at: "2026-09-10T00:00:00Z", depart_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { leg_id: $.data.id, items: $.data.required_advance_items }
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
              payload: { item_type: "ROUTE_SURVEY", outcome: "COMPLETE", note: "route walked" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { done1: $.data.advance_complete }
            - call: "POST /exec-protection/trip-legs/${leg_id}/advance-progress"
              payload: { item_type: "CROWD_PLAN", outcome: "COMPLETE", note: "stage perimeter agreed" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { done2: $.data.advance_complete }
          assert:
            - "the leg is created with leg_risk_band == LOW (composite 9.80 plus THREAT_UPLIFT[LOW] == 0) and required_advance_items == ${items} == ['ROUTE_SURVEY', 'CROWD_PLAN'] in that canonical order"
            - "ADVANCE_REQUIRED_BY_BAND[LOW] alone would be ['ROUTE_SURVEY']; CROWD_PLAN is present solely because trip_purpose == PUBLIC_APPEARANCE"
            - "after only ROUTE_SURVEY: completed_advance_items == ['ROUTE_SURVEY'], ${done1} == false — the required set is not yet a subset of what is recorded"
            - "after CROWD_PLAN as well: completed_advance_items == ['ROUTE_SURVEY', 'CROWD_PLAN'] and ${done2} == true"
            - "the same enum also drove the approval level: Trip.max_leg_risk_band == LOW yet required_approval_level == DIRECTOR, one step above the MANAGER base, because trip_purpose == PUBLIC_APPEARANCE"
            - "Trip.readiness_state == ADVANCE_IN_PROGRESS after the first recorded item and stays ADVANCE_IN_PROGRESS after the second (READY is only reached through approval)"

      - name: exposure_score_rounds_once_after_scaling_and_drops_signals_past_the_window
        claim_type: precision
        grounds:
          - calculations.public_exposure_score
          - entities.Executive.public_exposure_score
        distinguishing_aspect: |
          The score is scaled by 5 and rounded ONCE at the end, so a decayed contribution of
          2.25 must surface as 11.25 rather than as a rounded 2.00 scaled to 10.00. The window is
          half-open at EXPOSURE_WINDOW_DAYS, so a signal of age exactly 92 days is dropped
          outright rather than down-weighted to a small residue: the score after adding it must
          be byte-identical to the score before it, which no down-weighting implementation can
          reproduce.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00Z; one executive with an empty signal log"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "SOCIAL_GEOTAG", severity: 3, observed_at: "2026-07-02T00:00:00Z", source_note: "checked in at venue" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "MEDIA_MENTION", severity: 5, observed_at: "2026-08-01T00:00:00Z", source_note: "front page" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "PUBLIC_FILING", severity: 4, observed_at: "2026-05-01T00:00:00Z", source_note: "old proxy statement" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
          assert:
            - "after signal 1 (age_days 30, exactly one half-life): Executive.public_exposure_score == 11.25 == round_half_up(3 * 1.5 * 0.5 * 5, 2)"
            - "after signal 2 (age_days 0, weight 1.0): public_exposure_score == 36.25 == round_half_up((2.25 + 5.00) * 5, 2) — the accumulation is unrounded and only the final scaled figure is rounded"
            - "after signal 3 (age_days 92, at or past EXPOSURE_WINDOW_DAYS 90): public_exposure_score is still exactly 36.25 — the out-of-window signal contributes nothing, not a decayed residue"
            - "GET /exec-protection/executives/${exec_id}/exposure-signals returns total_count == 3: the dropped signal is still stored, it is only excluded from the input_set"
            - "the score never exceeded EXPOSURE_SCORE_CAP 100.0, so the cap was not the reason for any value"

      - name: on_time_scheduled_check_in_at_the_due_instant_re_anchors_the_next_one
        claim_type: interval_merge
        grounds:
          - calculations.check_in_schedule
          - entities.CheckIn.late
          - entities.Trip.next_check_in_due_at
        distinguishing_aspect: |
          Lateness is a STRICT comparison against the due instant in force before the row is
          applied, so a SCHEDULED check-in arriving at exactly next_check_in_due_at is on time.
          The two non-scheduled kinds behave differently on the same trip: an AD_HOC row must
          leave next_check_in_due_at untouched, while the SCHEDULED row re-anchors it to
          reported_at + interval rather than to previous_due + interval — a distinction only
          visible when the check-in does not arrive at the clock's own multiple of the interval.
        test_recipe:
          setup:
            - "an APPROVED, READY trip with band LOW (check_in_interval_hours 24) whose next_check_in_due_at is 2026-09-11T00:00:00Z; clock then moved to that exact instant"
