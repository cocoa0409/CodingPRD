# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 987 — Ice-Delivery & Event-Ice Service
# 9 rules x >=2 instances = 19 instances (combinatorial_formula carries 3,
# one per mode (a)/(b)/(c)). All monetary literals pre-computed from the
# pinned fixture price book:
#   (CUBE,BAG) 1-19:350 / 20-99:300 / 100+:275 ; (CUBE,PALLET) 1-4:28000 / 5+:26000
#   (BLOCK,BAG) 1-9:900 / 10+:800 ; (BLOCK,PALLET) 21000
#   (DRY_ICE,BAG) 1-9:1500 / 10-49:1350 / 50+:1200 ; (DRY_ICE,PALLET) 60000
#   deposit 1500/pallet ; fee 4900 (waived post-discount >= 20000) ;
#   discount 500bps >= 50000, 1000bps >= 100000 ; surge 1500bps ; handling 700bps dry-ice lines
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final_surge_adoption
        grounds:
          - calculations.order_total_composition
          - state_machines.Order.transitions.DRAFT_to_QUOTED
          - state_machines.Order.transitions.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          Same order lines, two valid pricing evaluations on the Order/Invoice
          money domain: PROVISIONAL (surge evaluated at quote time: none ACTIVE
          -> 0) vs FINAL (surge evaluated at confirm time: window now ACTIVE ->
          1500bps on post-discount 48450 = 7268). Totals diverge 51450 vs 58718.
        test_recipe:
          setup:
            - "Depot cap 10; fixture PriceBook ACTIVE; EVENT_ORGANIZER customer credit_limit 500000"
            - "Order WILL_CALL event 2026-05-20 window 10:00-12:00: 30x(CUBE,BAG)@300 + 2x(BLOCK,PALLET)@21000"
            - "Surge window covering 2026-05-15..2026-06-15 created SCHEDULED at quote time, ACTIVE by confirm time"
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot DV", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "standard-2026"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 1, tier_max_units: 19, unit_price_cents: 350 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 20, tier_max_units: 99, unit_price_cents: 300 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 100, tier_max_units: null, unit_price_cents: 275 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 1, tier_max_units: 4, unit_price_cents: 28000 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 5, tier_max_units: null, unit_price_cents: 26000 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 900 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 10, tier_max_units: null, unit_price_cents: 800 }
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 1500 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 10, tier_max_units: 49, unit_price_cents: 1350 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 50, tier_max_units: null, unit_price_cents: 1200 }
                  - { product_form: DRY_ICE, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 60000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                  - { threshold_cents: 100000, discount_bps: 1000 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "DV Events", kind: EVENT_ORGANIZER, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-20"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: CUBE, packaging: BAG, quantity_units: 30 }
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 2 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { provisional_total: $.data.total_cents, provisional_surcharge: $.data.surcharge_cents }
            - call: "POST /surge-windows"
              payload: { depot_id: "${depot_id}", start_date: "2026-05-15", end_date: "2026-06-15", admission_policy: OPEN }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { final_total: $.data.total_cents, final_surcharge: $.data.surcharge_cents, final_mode: $.data.pricing_mode }
          assert:
            - "provisional_total == 51450 and provisional_surcharge == 0 (no ACTIVE surge window at quote time)"
            - "final_total == 58718 and final_surcharge == 7268 (round_half_up(48450 * 0.15)) and final_mode == FINAL"
            - "Order.${order_id}.discount_cents == 2550 and deposit_cents == 3000 and delivery_fee_cents == 0"
            - "provisional_total != final_total despite identical order lines"

      - name: credit_exposure_settled_vs_forward_looking
        grounds:
          - calculations.credit_exposure
          - validations[priority=27]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Different entity domain than the pricing variant (Customer credit
          accounting): SETTLED exposure stores 0 (no issued invoices) while
          FORWARD_LOOKING counts the confirmed-uninvoiced pipeline 51450; the
          confirm check uses FORWARD_LOOKING, so a 9900-cent order is rejected
          at limit 60000 (61350 > 60000) and admitted at limit 61350 (equality).
        test_recipe:
          setup:
            - "Depot cap 10; fixture PriceBook ACTIVE; customer A limit 60000; customer B limit 61350"
            - "A holds CONFIRMED order1 total 51450 (30x CUBE,BAG + 2x BLOCK,PALLET, WILL_CALL 2026-05-20, no surge window)"
            - "B holds an identical CONFIRMED order1b"
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot CE", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "standard-2026"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 1, tier_max_units: 19, unit_price_cents: 350 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 20, tier_max_units: 99, unit_price_cents: 300 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 100, tier_max_units: null, unit_price_cents: 275 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 1, tier_max_units: 4, unit_price_cents: 28000 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 5, tier_max_units: null, unit_price_cents: 26000 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 900 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 10, tier_max_units: null, unit_price_cents: 800 }
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 1500 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 10, tier_max_units: 49, unit_price_cents: 1350 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 50, tier_max_units: null, unit_price_cents: 1200 }
                  - { product_form: DRY_ICE, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 60000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                  - { threshold_cents: 100000, discount_bps: 1000 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "Bar A", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 60000 }
              as: PlatformAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { account_name: "Bar B", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 61350 }
              as: PlatformAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_a}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-20"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: CUBE, packaging: BAG, quantity_units: 30 }
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 2 }
              as: CustomerAgent
              as_user_id: "${cust_a}"
              captures: { order_a1: $.data.id }
            - call: "POST /orders/${order_a1}/quote"
              as: CustomerAgent
              as_user_id: "${cust_a}"
            - call: "POST /orders/${order_a1}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_a}"
            - call: "POST /orders"
              payload:
                customer_id: "${cust_b}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-22"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: CUBE, packaging: BAG, quantity_units: 30 }
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 2 }
              as: CustomerAgent
              as_user_id: "${cust_b}"
              captures: { order_b1: $.data.id }
            - call: "POST /orders/${order_b1}/quote"
              as: CustomerAgent
              as_user_id: "${cust_b}"
            - call: "POST /orders/${order_b1}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_b}"
            - call: "POST /orders"
              payload:
                customer_id: "${cust_a}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-21"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: CUBE, packaging: BAG, quantity_units: 30 }
                  - { product_form: BLOCK, packaging: BAG, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_a}"
              captures: { order_a2: $.data.id }
            - call: "POST /orders/${order_a2}/quote"
              as: CustomerAgent
              as_user_id: "${cust_a}"
            - call: "POST /orders"
              payload:
                customer_id: "${cust_b}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-23"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: CUBE, packaging: BAG, quantity_units: 30 }
                  - { product_form: BLOCK, packaging: BAG, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_b}"
              captures: { order_b2: $.data.id }
            - call: "POST /orders/${order_b2}/quote"
              as: CustomerAgent
              as_user_id: "${cust_b}"
          trigger:
            - call: "POST /orders/${order_a2}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_a}"
              captures: { a2_error: $.data.error_id }
            - call: "POST /orders/${order_b2}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_b}"
              captures: { b2_status: $.data.fulfillment_status }
            - call: "GET /customers/${cust_a}"
              as: PlatformAdmin
              captures: { a_exposure: $.data.outstanding_exposure_cents }
          assert:
            - "a2_error == ERR_CREDIT_LIMIT_EXCEEDED (forward-looking 51450 + 9900 = 61350 > 60000 + 0)"
            - "b2_status == CONFIRMED (61350 <= 61350: equality admitted)"
            - "a_exposure == 0 (SETTLED variant: no issued invoices exist — the rejection proves FORWARD_LOOKING was used)"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_line_pricing_multi_input
        grounds:
          - calculations.order_line_pricing
        distinguishing_aspect: |
          Mode (a): four inputs (product_form, packaging, quantity tier,
          HANDLING_BPS conditional on form) with non-linear interaction — the
          flat tier rate switches the unit price (13 bags -> 1350, 9 bags ->
          1500) and the dry-ice-only 700bps handling folds in BEFORE rounding,
          so 13x1350x1.07 rounds to 18779 while 9x1500x1.07 rounds to 14445.
        test_recipe:
          setup:
            - "Depot cap 10; fixture PriceBook ACTIVE; customer limit 500000"
            - "Order WILL_CALL 2026-05-20 with two DRY_ICE BAG lines: 13 units (tier 10-49) and 9 units (tier 1-9)"
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot CF-a", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "standard-2026"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 1, tier_max_units: 19, unit_price_cents: 350 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 20, tier_max_units: 99, unit_price_cents: 300 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 100, tier_max_units: null, unit_price_cents: 275 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 1, tier_max_units: 4, unit_price_cents: 28000 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 5, tier_max_units: null, unit_price_cents: 26000 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 900 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 10, tier_max_units: null, unit_price_cents: 800 }
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 1500 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 10, tier_max_units: 49, unit_price_cents: 1350 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 50, tier_max_units: null, unit_price_cents: 1200 }
                  - { product_form: DRY_ICE, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 60000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                  - { threshold_cents: 100000, discount_bps: 1000 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "CF Events", kind: EVENT_ORGANIZER, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-20"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: DRY_ICE, packaging: BAG, quantity_units: 13 }
                  - { product_form: DRY_ICE, packaging: BAG, quantity_units: 9 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { merch: $.data.merchandise_subtotal_cents, total: $.data.total_cents }
            - call: "GET /orders/${order_id}/lines"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { line0_total: "$.data[0].line_total_cents", line0_unit: "$.data[0].unit_price_cents", line1_total: "$.data[1].line_total_cents", line1_unit: "$.data[1].unit_price_cents" }
          assert:
            - "line0_unit == 1350 (tier 10-49 flat rate) and line0_total == 18779 (round_half_up(13*1350*1.07))"
            - "line1_unit == 1500 (tier 1-9 flat rate) and line1_total == 14445 (round_half_up(9*1500*1.07))"
            - "merch == 33224 and total == 33224 (WILL_CALL: no fee; no discount tier below 50000; no deposit for BAG)"

      - name: per_line_rounding_order_beats_sum_then_round
        grounds:
          - calculations.order_line_pricing
          - calculations.order_total_composition
        distinguishing_aspect: |
          Mode (b): pinned rounding order "round each line, then sum" yields
          18779 + 4334 = 23113; the alternative "sum exact then round" yields
          round_half_up(21600*1.07) = 23112 — a 1-cent divergence the scaffold
          pins to the per-line order.
        test_recipe:
          setup:
            - "Depot cap 10; fixture PriceBook ACTIVE; customer limit 500000"
            - "Order WILL_CALL 2026-05-20 with DRY_ICE BAG lines 13 and 3 units (both hit a .5-cent handling fraction)"
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot CF-b", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "standard-2026"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 1, tier_max_units: 19, unit_price_cents: 350 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 20, tier_max_units: 99, unit_price_cents: 300 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 100, tier_max_units: null, unit_price_cents: 275 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 1, tier_max_units: 4, unit_price_cents: 28000 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 5, tier_max_units: null, unit_price_cents: 26000 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 900 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 10, tier_max_units: null, unit_price_cents: 800 }
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 1500 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 10, tier_max_units: 49, unit_price_cents: 1350 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 50, tier_max_units: null, unit_price_cents: 1200 }
                  - { product_form: DRY_ICE, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 60000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                  - { threshold_cents: 100000, discount_bps: 1000 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "CF-b Events", kind: EVENT_ORGANIZER, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-20"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: DRY_ICE, packaging: BAG, quantity_units: 13 }
                  - { product_form: DRY_ICE, packaging: BAG, quantity_units: 3 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { merch: $.data.merchandise_subtotal_cents }
          assert:
            - "merch == 23113 (per-line rounding: round_half_up(17550*1.07)=18779 + round_half_up(4050*1.07)=4334)"
            - "merch != 23112 (which the sum-then-round order would produce: round_half_up(21600*1.07))"

      - name: discount_then_surcharge_evaluation_order
        grounds:
          - calculations.order_total_composition
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation
          order — discount keyed on PRE-discount merchandise (51000 -> 500bps ->
          2550), surcharge on POST-discount base (48450 -> 7268), deposit exempt
          and added last. A surcharge-on-pre-discount-base evaluation would give
          7628; the pinned order gives 7268 and total 58718.
        test_recipe:
          setup:
            - "Same fixture as order_pricing_provisional_vs_final_surge_adoption: order confirmed while surge window ACTIVE"
            - "Order WILL_CALL 2026-05-20: 30x(CUBE,BAG) + 2x(BLOCK,PALLET); RATIONED-free OPEN surge window active at confirm"
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot CF-c", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "standard-2026"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 1, tier_max_units: 19, unit_price_cents: 350 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 20, tier_max_units: 99, unit_price_cents: 300 }
