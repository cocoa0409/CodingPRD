              payload: { timer_loop_id: "${l_z}", logged_by_staff_id: "${sl_id}", incident_type: "MISSING_ITEM" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { inc2: $.data.id }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { open2: $.data.open_remake_count, posture2: $.data.service_posture, free2: $.data.merge_slots_free, cost2: $.data.remake_cost_accrued_cents }
          trigger:
            - call: "POST /drive-thru/restaurants/${r_id}/merge-award"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${posture0} == OPEN at registration"
            - "At one open remake: ${open1} == 1, ${req1} == 1 (min_oot_count 0 + lane_bump 0 because 0.0 < 12 + accuracy_bump 1) and ${posture1} == SURGE — threshold-1 does NOT reach ACCURACY_HOLD"
            - "The award at posture SURGE succeeded: ${s1_loop} == ${l_y} (earliest order_complete_at among the eligible Y and W; X is excluded for REMAKE_OPEN) with ${s1_reason} == ALTERNATE — SURGE never blocks merge-award"
            - "At two open remakes: ${open2} == 2, ${posture2} == ACCURACY_HOLD, ${free2} == 1 and ${cost2} == 1100 (350 + 750)"
            - "HTTP 409 and ${err} == ERR_POSTURE_ACCURACY_HOLD"
            - "${err} != ERR_NO_MERGE_CANDIDATE — loop W is still an eligible ORDERED candidate"
            - "${err} != ERR_MERGE_CAPACITY_EXHAUSTED — merge_slots_free is 1, not 0; priority 11 fires ahead of priorities 30 and 32"
            - "GET /drive-thru/merge-slots?restaurant_id=${r_id} still returns total_count 1 and TimerLoop.${l_w}.timing_state == ORDERED with no slot"

      - name: cascade_depart_five_hop_chain_end_to_end
        claim_type: side_effect_execution
        grounds:
          - state_machines.TimerLoop.AT_WINDOW_to_CLOSED
          - calculations.restaurant_rollup_recompute
        excluded_because:
          difficulty_instance: depart_cascade_slot_release_to_surge_posture
          rationale: "That §1.8 instance walks the whole depart cascade — slot release, trailing car rate, volume tier, required_oot_count and service_posture — and asserts each hop's value, so a separate cross-cutting cascade test would duplicate it exactly."

      - name: cascade_incident_conditional_pull_forward_and_slot_forfeit
        claim_type: side_effect_execution
        grounds:
          - state_machines.AccuracyIncident.initial_state_LOGGED
          - state_machines.MergeSlot.RESERVED_to_FORFEITED
        excluded_because:
          difficulty_instance: incident_cascade_pull_forward_forfeits_reserved_slot
          rationale: "That §1.8 instance covers the conditional cascade (the auto-issued PullForwardOrder fires only when the loop holds a RESERVED slot) together with the slot forfeit and the merge_slots_free rebound."

      - name: dual_variant_report_two_answers_from_one_dataset
        claim_type: variant_divergence
        grounds:
          - calculations.report_attainment_metrics.variants
        excluded_because:
          difficulty_instance: report_variant_divergence_provisional_vs_final
          rationale: "That §1.8 instance builds one dataset and computes both variants, asserting the different cars_served, metric basis, window_tier, attainment_band and coaching_pool_points."

      - name: threshold_tier_floor_is_inclusive_at_the_boundary
        claim_type: constants_applied
        grounds:
          - calculations.restaurant_rollup_recompute
          - entities.VolumeTierPolicy.fields.cars_per_hour_floor
        excluded_because:
          difficulty_instance: tier_floor_exact_inclusive_on_depart
          rationale: "That §1.8 instance lands cars_per_hour_effective exactly on a band floor and asserts the higher band is selected (>= floor, < ceiling), covering the threshold boundary for this layer."

  # ==========================================================================
  # §1.9 SECTION 9 — CONSISTENCY MODEL
  # ==========================================================================
  - section: consistency_model
    instances:

      - name: consistency_unfreeze_response_already_shows_recomputed_posture
        claim_type: side_effect_execution
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /drive-thru/restaurants/{restaurantId}/unfreeze]
          - calculations.restaurant_rollup_recompute
        distinguishing_aspect: "Consistency is immediate, so the unfreeze RESPONSE itself carries ACCURACY_HOLD and the 1100-cent accrual — the caller never has to re-read the store to see the recompute."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band (min_oot_count 0); one SINGLE-lane store; one StaffMember; one ACTIVE LUNCH profile."
            - "Two ORDERED TimerLoops, each carrying one LOGGED incident (WRONG_SIZE 350 on the first, WRONG_ITEM 750 on the second), so open_remake_count is 2 and the store is ACCURACY_HOLD; the store is then FROZEN."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Immediate Rollup Store", store_number: "C-2398-68", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Imm Carbery", oot_certified: true }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l_1: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:20Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops/${l_1}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:01:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops/${l_1}/order-complete"
              payload: { order_items_count: 2 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/accuracy-incidents"
              payload: { timer_loop_id: "${l_1}", logged_by_staff_id: "${sl_id}", incident_type: "WRONG_SIZE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { inc1: $.data.id, cost1: $.data.remake_cost_cents }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:02:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l_2: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:02:20Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops/${l_2}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:03:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/timer-loops/${l_2}/order-complete"
              payload: { order_items_count: 5 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/accuracy-incidents"
              payload: { timer_loop_id: "${l_2}", logged_by_staff_id: "${sl_id}", incident_type: "WRONG_ITEM" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { inc2: $.data.id, cost2: $.data.remake_cost_cents, inc2_rest: $.data.restaurant_id }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { posture_hold: $.data.service_posture, open_hold: $.data.open_remake_count, accrued_hold: $.data.remake_cost_accrued_cents, v_hold: $.data.version }
            - call: "POST /drive-thru/restaurants/${r_id}/freeze"
              payload: { freeze_reason: "Health inspector on site" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { posture_frozen: $.data.service_posture, v_frozen: $.data.version }
          trigger:
            - call: "POST /drive-thru/restaurants/${r_id}/unfreeze"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
              captures: { posture_after: $.data.service_posture, open_after: $.data.open_remake_count, accrued_after: $.data.remake_cost_accrued_cents, req_after: $.data.required_oot_count, cphe_after: $.data.cars_per_hour_effective, tier_after: $.data.volume_tier, free_after: $.data.merge_slots_free, v_after: $.data.version }
          assert:
            - "${cost1} == 350 and ${cost2} == 750 and ${inc2_rest} == ${r_id}"
            - "Before the freeze: ${posture_hold} == ACCURACY_HOLD, ${open_hold} == 2, ${accrued_hold} == 1100"
            - "${posture_frozen} == FROZEN and ${v_frozen} == ${v_hold} + 1"
            - "HTTP 200 and the unfreeze response ALREADY reports ${posture_after} == ACCURACY_HOLD — not OPEN, and not a stale FROZEN"
            - "The same response also carries the re-derived ${open_after} == 2, ${accrued_after} == 1100, ${req_after} == 1 (accuracy bump only), ${cphe_after} == 0.0, ${tier_after} == TIER_1 and ${free_after} == 1"
            - "${v_after} == ${v_frozen} + 1"
            - "A follow-up GET /drive-thru/restaurants/${r_id} returns byte-identical rollup values — there is no lag window in which the two disagree"
