            - "Threshold reset: the FINAL readiness-report returns rolling_event_ids [\"${ev6}\", \"${ev3}\", \"${ev4}\"], mean_d2i_minutes 40.00 ((14+75+31)/3), cesarean_readiness_state \"DEGRADED\" and readiness_reason \"MEAN_D2I_ABOVE_READY_CEILING\", and the stored unit field agrees: u_readiness2 == \"DEGRADED\" — the rate threshold is recoverable, not latching: the unit climbs back out of NOT_READY purely because the window slid, with no drill, shift or administrative action in between."

  # =========================================================================
  # 9. CONSISTENCY MODEL  (guide Table 9)
  # complexity_profile.consistency_model == immediate, so the obligation is
  # "all changes visible in same request's response". Two arms are needed to
  # make that falsifiable: (a) nothing lags — a cascade that crosses four
  # entities is already final on the very next read AND a sweep run straight
  # afterwards has no deferred work left to do; (b) the effects that DO wait
  # are not lagging denormalisations but clock-driven edges that require an
  # explicit POST /obstetric-units/{unitId}/capacity-sweep, and they do not
  # settle by themselves no matter how far the clock advances.
  # =========================================================================
  - section: consistency_model
    instances:
      - name: a_four_entity_cascade_is_final_on_the_very_next_read_and_leaves_the_sweep_nothing_to_do
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model=immediate
          - endpoints[POST /care-assignments]
          - endpoints[POST /care-assignments/{assignmentId}/release]
          - endpoints[POST /obstetric-units/{unitId}/capacity-sweep]
          - endpoints[GET /obstetric-units/{unitId}/coverage-report]
          - calculations[care_assignment_unit_debit]
          - calculations[unit_posture_derivation]
        distinguishing_aspect: |
          One POST /care-assignments touches four entities: the junction row it creates, the encounter's
          staffing axis, the covering shift's load ledger and the unit's posture, buffer and deficit. Under
          an `immediate` model every one of those is final before the response is written, so this instance
          reads all four back on the calls IMMEDIATELY following the write — no clock advance, no sweep, no
          retry — and pins each value. The write's own response is required to carry its computed
          acuity_units_consumed rather than a null to be filled in later, and unit.version must already
          have advanced by exactly one, which is the observable proof the unit row was updated inside the
          same transaction rather than queued. The discriminating half is the SWEEP run straight afterwards:
          under `immediate` it must be a no-op (every counter 0, posture and deficit unchanged), because
          there is no deferred work in flight. An implementation that defers denormalisation to the sweep
          passes the naive "did the number change eventually" check but fails here twice — once on the
          reads taken before the sweep, and once because the sweep reports work done. The release arm then
          runs the whole thing backwards in one call (posture OPEN -> RATIO_STRAINED, buffer 45 -> 75,
          posture_reason NONE -> DEFICIT_POSITIVE), proving the immediacy is symmetric and not an artifact
          of a create-only fast path.
        test_recipe:
          setup: |
            Clock starts at 2026-08-01T05:45:00Z. One unit "Verrazano Shoals Womens Pavilion LDR" with two
            LDR beds (never assigned, so available_ldr_beds stays 2). Three staff: an ANESTHESIOLOGIST and
            an OB_ATTENDING purely to satisfy the drill roster, and an RN_LABOR_DELIVERY with
            fetal_monitoring_cert_level ADVANCED who does the actual covering. A DECISION_TO_INCISION drill
            scheduled for 05:50 is started at 05:50, documented at 06:00 with a passing 3-minute interval
            and validated by the PerinatalSafetyOfficer, lifting cesarean_readiness_state off its NOT_READY
            default to DEGRADED — without this the INDUCTION_FROZEN branch of unit_posture_derivation would
            mask every posture movement this instance measures. At 06:00 the nurse gets a BEDSIDE shift over
            [06:00, 12:00) and it is activated, freezing capacity_units_effective at
            min(BASE_CAPACITY_UNITS[BEDSIDE] 4.0, CERT_CAP_UNITS[ADVANCED] 4.0) = 4.0 with no charge offset
            and no TIER_IV penalty. One walk-in encounter PRC-VERR-4101 (39 weeks, parity 1, all defaults)
            is admitted, so it is TIER_I / ANTEPARTUM with required_coverage_units 0.5, staffing_state
            UNASSIGNED and assigned_coverage_units 0.0 — a standing deficit of 0.5 that puts the unit at
            RATIO_STRAINED with turnover_buffer_minutes 75 before anything is measured. No bookings, passes,
            bundles or assessments exist anywhere, so the sweep genuinely has nothing else it could do.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T05:45:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Verrazano Shoals Womens Pavilion LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
