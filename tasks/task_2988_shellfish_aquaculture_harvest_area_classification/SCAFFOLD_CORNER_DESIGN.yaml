      - name: reopen_precedence_places_the_prohibited_gate_above_the_timing_gate
        claim_type: priority_ordering
        grounds:
          - "validations[priority=41]"
          - "validations[priority=51]"
          - "errors[ERR_AREA_PROHIBITED]"
          - "errors[ERR_REOPEN_TOO_EARLY]"
        excluded_because:
          difficulty_instance: reopen_prohibited_area_before_window_returns_safety_over_temporal
          rationale: "That instance already walks the reopen precedence chain with an area that is simultaneously PROHIBITED and inside its closure window, proving 41 outranks 51 and 61; a second recipe would only restate the same ordering."

      - name: authorization_precedence_places_the_dealer_gate_above_the_rent_gate
        claim_type: priority_ordering
        grounds:
          - "validations[priority=84]"
          - "validations[priority=95]"
          - "errors[ERR_DEALER_CERTIFICATION_EXPIRED]"
          - "errors[ERR_LEASE_RENT_DELINQUENT]"
        excluded_because:
          difficulty_instance: authorization_with_expired_dealer_and_delinquent_rent_returns_referential_over_fiscal
          rationale: "That instance issues an authorization whose dealer certification has expired AND whose lease rent is delinquent, pinning the 84-before-95 order and the 409-before-402 status choice in one call."
  - section: endpoints
    instances:

      - name: classification_summary_is_a_side_effect_free_computed_read
        claim_type: computed_read
        grounds:
          - endpoints[GET /shellfish/growing-areas/{id}/classification-summary]
          - calculations.area_water_quality_statistics
          - entities.GrowingArea.fields.version
        distinguishing_aspect: |
          The summary is derived on read and never persisted: two successive reads of different
          variants return different statistics while GrowingArea.version, classification,
          harvest_status and updated_at are all unchanged, so the endpoint cannot be the thing that
          downgrades an area.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED/OPEN with clean_sample_mpn_limit 14.0."
            - "Five SYSTEMATIC_RANDOM samples of 2 MPN each on 2026-07-05, 07-12, 07-19, 07-26 and 07-31, so the area is never swept: geometric mean 2.0, p90 2.0, version 1."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-12T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-19T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-26T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-31T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
          trigger:
            - call: "GET /shellfish/growing-areas/${area}/classification-summary"
              payload: { variant: "SYSTEMATIC_RANDOM" }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}/classification-summary"
              payload: { variant: "ADVERSE_CONDITION" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 200 with data.variant == SYSTEMATIC_RANDOM, data.sample_count == 5, data.mean_log10 == 0.3010, data.geometric_mean_mpn == 2.0, data.p90_mpn == 2.0 and data.eligible_classification == APPROVED"
            - "Second call: HTTP 200 with data.variant == ADVERSE_CONDITION and its own window_start_at/window_end_at pair"
            - "Third call: HTTP 200 with data.version == 1, data.classification == APPROVED, data.harvest_status == OPEN and data.accepted_sample_count == 5 — identical to the state before the two reads"
            - "Both summary responses carry response_type == \"object\" and neither carries a data.error_id"

      - name: shipment_assembly_links_two_tagged_lots_and_derives_the_roster_totals
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /shellfish/shipments]
          - entities.Shipment.fields.lot_count
          - entities.Shipment.fields.total_bushels
          - entities.Shipment.fields.is_interstate
        distinguishing_aspect: |
          Assembly is a genuine many-to-one link: the roster's lot_count 2 and total_bushels 30 are
          derived from the referenced lots rather than supplied, is_interstate is derived from
          destination_state VA against the dealer's own state_code NC, and each lot's shipment_id is
          back-filled by the same call.
        test_recipe:
          setup:
            - "The standard active-authorization fixture with an NC LISTED dealer and projected_bushels 600; clock 2026-08-10T11:00:00Z."
            - "LOT-A: 10 bushels, first out 06:00:00Z, last out 08:00:00Z, in control 10:30:00Z — COMPLIANT and TAGGED."
            - "LOT-B: 20 bushels, first out 09:00:00Z, last out 09:30:00Z, in control 10:45:00Z — 105 minutes against a 270-minute allowance, so COMPLIANT and TAGGED."
