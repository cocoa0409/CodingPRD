              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /lesa-set-asides"
              payload: { loan_id: "${loan_id}", funding_mode: "FULLY_FUNDED", annual_property_charge_cents: 600000, life_expectancy_years: 10 }
              as: ServicerOps
              captures: { lesa_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /property-charge-payments"
              payload: { loan_id: "${loan_id}", lesa_set_aside_id: "${lesa_id}", charge_type: "PROPERTY_TAX", coverage_start: "2024-01-01", coverage_end: "2024-07-01", amount_cents: 100000 }
              as: ServicerOps
              captures: { pay1_id: $.data.id }
          trigger:
            - call: "POST /property-charge-payments"
              payload: { loan_id: "${loan_id}", lesa_set_aside_id: "${lesa_id}", charge_type: "PROPERTY_TAX", coverage_start: "2024-06-01", coverage_end: "2025-01-01", amount_cents: 100000 }
              as: ServicerOps
              captures: { err: $.data.error_id }
            - call: "POST /property-charge-payments"
              payload: { loan_id: "${loan_id}", lesa_set_aside_id: "${lesa_id}", charge_type: "PROPERTY_TAX", coverage_start: "2024-07-01", coverage_end: "2025-01-01", amount_cents: 100000 }
              as: ServicerOps
              captures: { adj_id: $.data.id }
          assert:
            - "overlap payment [2024-06-01,2025-01-01) => HTTP 409, data.error_id == ERR_COVERAGE_WINDOW_OVERLAP"
            - "adjacent payment [2024-07-01,2025-01-01) => HTTP 201, PropertyChargePayment.${adj_id}.status == POSTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: disbursement_void_restores_principal_capacity
        grounds:
          - state_machines.Disbursement.transitions.DISBURSED_to_VOIDED
          - entities.Loan.fields.principal_balance_cents
          - entities.Loan.fields.available_line_of_credit_cents
          - entities.LedgerEntry.fields.entry_type
          - endpoints["POST /disbursements/{disbursementId}/void"]
        distinguishing_aspect: |
          Conserved quantity = PRINCIPAL CAPACITY: across disburse then void, the invariant
          principal_balance_cents + available_line_of_credit_cents == 15690000 (gross limit) holds
          exactly. Disburse 5000000 makes (6000000 + 9690000)=15690000; void restores
          (1000000 + 14690000)=15690000 with zero drift.
        test_recipe:
          setup:
            - "Originated LOC base loan: principal_balance_cents=1000000, available_line_of_credit_cents=14690000 (sum 15690000)."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer CI1", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Ray Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v: $.data.version }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 5000000 }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { disb_id: $.data.id }
            - call: "POST /disbursements/${disb_id}/approve"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicerOps
            - call: "POST /disbursements/${disb_id}/disburse"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "POST /disbursements/${disb_id}/void"
              payload: {}
              as: ServicerOps
          assert:
            - "Before void: Loan.${loan_id}.principal_balance_cents == 6000000 AND available_line_of_credit_cents == 9690000 (sum 15690000)"
            - "After void: Loan.${loan_id}.principal_balance_cents == 1000000"
            - "After void: Loan.${loan_id}.available_line_of_credit_cents == 14690000"
            - "After void: principal_balance_cents + available_line_of_credit_cents == 15690000 (no drift)"
            - "Disbursement.${disb_id}.status == VOIDED"

      - name: property_charge_reverse_restores_lesa_pool
        grounds:
          - endpoints["POST /property-charge-payments/{paymentId}/reverse"]
          - entities.LesaSetAside.fields.drawn_cents
          - entities.LesaSetAside.fields.remaining_cents
          - entities.LesaSetAside.fields.initial_amount_cents
          - endpoints["POST /property-charge-payments"]
        distinguishing_aspect: |
          DIFFERENT conserved quantity = LESA POOL: across a property-charge payment then its reversal,
          drawn_cents + remaining_cents == initial_amount_cents (6000000) holds exactly. Pay 200000 ->
          (200000 + 5800000); reverse -> (0 + 6000000) with no drift, and status returns FUNDED.
        test_recipe:
          setup:
            - "Originated LINE_OF_CREDIT loan with FULLY_FUNDED LESA initial_amount_cents=6000000; one POSTED PROPERTY_TAX payment of 200000."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer CI2", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Sue Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /lesa-set-asides"
              payload: { loan_id: "${loan_id}", funding_mode: "FULLY_FUNDED", annual_property_charge_cents: 600000, life_expectancy_years: 10 }
              as: ServicerOps
              captures: { lesa_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /property-charge-payments"
              payload: { loan_id: "${loan_id}", lesa_set_aside_id: "${lesa_id}", charge_type: "PROPERTY_TAX", coverage_start: "2024-01-01", coverage_end: "2025-01-01", amount_cents: 200000 }
              as: ServicerOps
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /property-charge-payments/${pay_id}/reverse"
              payload: {}
              as: ServicerOps
          assert:
            - "Before reverse: LesaSetAside.${lesa_id}.drawn_cents == 200000 AND remaining_cents == 5800000 (sum 6000000)"
            - "After reverse: LesaSetAside.${lesa_id}.drawn_cents == 0"
            - "After reverse: LesaSetAside.${lesa_id}.remaining_cents == 6000000"
            - "After reverse: drawn_cents + remaining_cents == initial_amount_cents == 6000000 (no drift)"
            - "After reverse: LesaSetAside.${lesa_id}.status == FUNDED"
            - "PropertyChargePayment.${pay_id}.status == REVERSED"
