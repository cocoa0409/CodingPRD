          - state_machines.RampPass.none_to_ACTIVE
        distinguishing_aspect: |
          RampPass resource, closed [valid_from,valid_to] semantics (adjacency counts as overlap): a second SEASONAL
          pass for the same boater whose window touches/overlaps the first is rejected — different interval geometry
          than the half-open berth rule, on a different resource entity.
        test_recipe:
          setup:
            - "Boater with a SEASONAL ramp pass valid 2026-05-01..2026-08-31; a second pass 2026-08-31..2026-10-31 touches it (closed adjacency = overlap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Ramp R", email: "ramp@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Trailer", length_ft: 20, registration_number: "REG-RR", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/ramp-passes"
              payload: { boater_id: "${boater_id}", vessel_id: "${vessel_id}", pass_type: "SEASONAL", valid_from_date: "2026-05-01", valid_to_date: "2026-08-31" }
              as: Harbormaster
              captures: { pass1: $.data.id }
          trigger:
            - call: "POST /marina/ramp-passes"
              payload: { boater_id: "${boater_id}", vessel_id: "${vessel_id}", pass_type: "SEASONAL", valid_from_date: "2026-08-31", valid_to_date: "2026-10-31" }
              as: Harbormaster
              captures: { err: $.data.error_id }
          assert:
            - "error.error_id == ERR_RAMP_PASS_OVERLAP"
            - "RampPass.${pass1}.status == ACTIVE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: berth_occupancy_conserved_activate_then_revoke
        grounds:
          - state_machines.Permit.OFFERED_to_ACTIVE
          - state_machines.Permit.ACTIVE_to_REVOKED
          - calculations.marina_occupancy
          - entities.Marina.fields.occupied_slip_count
        distinguishing_aspect: |
          Conserved quantity = berth occupancy count: activating a permit raises occupied_slip_count 0->1 and revoking
          it (the compensating action) returns occupied_slip_count to 0 and available_slip_count to 1 — no drift.
        test_recipe:
          setup:
            - "One SLIP/MEDIUM berth; a RESIDENT permit activated (occupied_slip_count 1). Then revoked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "MEDIUM", max_length_ft: 40 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Occ O", email: "occ@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Occupier", length_ft: 30, registration_number: "REG-OC", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id }
            - call: "POST /marina/invoices/${inv_id}/pay"
              payload: { amount_cents: 120000 }
              as: Harbormaster
          trigger:
            - call: "POST /marina/permits/${permit_id}/revoke"
              payload: { reason: "owner request" }
              as: Harbormaster
          assert:
            - "Permit.${permit_id}.status == REVOKED"
            - "Marina.${marina_id}.occupied_slip_count == 0"
            - "Marina.${marina_id}.available_slip_count == 1"
            - "Berth.${berth_id}.status == AVAILABLE"

      - name: money_conserved_pay_then_revoke_refund
        grounds:
          - calculations.refund_on_revoke
          - state_machines.Invoice.PAID_to_PARTIALLY_REFUNDED
          - entities.Invoice.fields.amount_paid_cents
          - entities.Invoice.fields.amount_refunded_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents): a RESIDENT slip permit paid 160000 and revoked on 2026-07-01 refunds
          exactly 106957 (prorated remaining 123/184 days), leaving net recognized 53043 = amount_paid - amount_refunded;
          a distinct conserved quantity from the berth-occupancy invariant.
        test_recipe:
          setup:
            - "RESIDENT slip 40ft permit paid 160000 (activated 2026-05-01). Revoked on 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Harbormaster
            - call: "POST /marina/marinas"
              payload: { name: "Cove", season_start_date: "2026-05-01", season_end_date: "2026-10-31", liveaboard_cap: 2 }
              as: Harbormaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/berths"
              payload: { marina_id: "${marina_id}", berth_type: "SLIP", size_class: "LARGE", max_length_ft: 45 }
              as: Harbormaster
              captures: { berth_id: $.data.id }
            - call: "POST /marina/boaters"
              payload: { full_name: "Money M", email: "money@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boater_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boater_id}", name: "Bigslip", length_ft: 40, registration_number: "REG-MM", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boater_id}", vessel_id: "${vessel_id}", requested_berth_type: "SLIP", requested_size_class: "LARGE", season_year: 2026 }
              as: Harbormaster
              captures: { permit_id: $.data.id, inv_id: $.data.invoice_id }
            - call: "POST /marina/invoices/${inv_id}/pay"
              payload: { amount_cents: 160000 }
              as: Harbormaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Harbormaster
          trigger:
            - call: "POST /marina/permits/${permit_id}/revoke"
              payload: { reason: "left the marina" }
              as: Harbormaster
          assert:
            - "Invoice.${inv_id}.amount_paid_cents == 160000"
            - "Invoice.${inv_id}.amount_refunded_cents == 106957"
            - "Invoice.${inv_id}.status == PARTIALLY_REFUNDED"
