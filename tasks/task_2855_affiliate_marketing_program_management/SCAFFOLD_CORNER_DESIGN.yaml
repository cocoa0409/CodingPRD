# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task_2855
# Every instance is grounded in SCAFFOLD.yaml §1.1–§1.7 and reachable from an
# empty database using only endpoints declared in §1.5. Corners already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub.
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_network_returns_declared_fields_and_version_one
        claim_type: creation
        grounds:
          - entities.Network
          - entities.Network.fields.fee_model
          - entities.Network.fields.fee_bps
          - endpoints[POST /networks]
          - endpoints[GET /networks/{id}]
          - response_envelope.success
        distinguishing_aspect: "POST /networks on an empty database returns response_type \"object\" with version == 1 and created_at == updated_at, and the immediately following GET /networks/{id} returns byte-identical field values."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned at 2026-07-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          trigger:
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "HYBRID", fee_bps: 375, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "GET /networks/${net_id}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "fa-001"
          assert:
            - "the POST response has response_type == \"object\" and a non-empty meta.api_request_id and meta.api_request_timestamp"
            - "Network.${net_id}.name == \"Corner Network\", fee_model == \"HYBRID\", fee_bps == 375, flat_fee_cents == 0, statement_currency == \"USD\""
            - "Network.${net_id}.version == 1 and created_at == updated_at"
            - "GET /networks/${net_id} returns the same id, name, fee_model, fee_bps, flat_fee_cents, statement_currency and version == 1"

      - name: get_affiliate_returns_stored_input_and_zeroed_computed_defaults
        claim_type: retrieval
        grounds:
          - entities.Affiliate
          - entities.Affiliate.fields.status
          - entities.Affiliate.fields.incrementality_tier
          - entities.Affiliate.fields.tax_document_status
          - endpoints[GET /affiliates/{id}]
        distinguishing_aspect: "A freshly created Affiliate returns every computed counter at its declared default — accrued_balance_cents 0, incrementality_score_bps 0, incrementality_tier MEDIUM, tax_document_status NONE — none of which the client supplied."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z."
            - "One Network and one CONTENT partner created through the public application endpoint, still PENDING_APPLICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Beacon Content LLC", contact_email: "beacon@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: "$.data.id" }
          trigger:
            - call: "GET /affiliates/${aff_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
          assert:
            - "Affiliate.${aff_id}.legal_name == \"Beacon Content LLC\", contact_email == \"beacon@example.com\", partner_type == \"CONTENT\", network_id == ${net_id}, payout_currency == \"USD\""
            - "Affiliate.${aff_id}.status == \"PENDING_APPLICATION\" and suspension_cause == \"NONE\""
            - "Affiliate.${aff_id}.sub_affiliate_depth == 0 and parent_affiliate_id is null"
            - "Affiliate.${aff_id}.fraud_risk_score == 0 and fraud_risk_score_trailing == 0.0"
            - "Affiliate.${aff_id}.incrementality_score_bps == 0 and incrementality_tier == \"MEDIUM\""
            - "Affiliate.${aff_id}.attributed_conversion_count == 0, new_customer_attributed_count == 0 and coupon_assisted_conversion_count == 0"
            - "Affiliate.${aff_id}.accrued_balance_cents == 0, reserved_balance_cents == 0 and lifetime_paid_cents == 0"
            - "Affiliate.${aff_id}.tax_document_status == \"NONE\", open_violation_case_count == 0, tracking_link_count == 0 and version == 1"

      - name: list_affiliates_paginates_with_total_count_and_filters_by_partner_type
        claim_type: listing
        grounds:
          - endpoints[GET /affiliates]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three partners exist; limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true, offset 2 returns 1 row with has_more false, and partner_type=COUPON narrows total_count to 1."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z."
            - "One Network and three partners: two CONTENT and one COUPON, all PENDING_APPLICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Beacon Content LLC", contact_email: "beacon@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_a: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Lumen Media LLC", contact_email: "lumen@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_b: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Coupon Cove LLC", contact_email: "cove@example.com", partner_type: "COUPON", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_c: "$.data.id" }
          trigger:
            - call: "GET /affiliates"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "GET /affiliates"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "GET /affiliates"
              payload: { partner_type: "COUPON", limit: 10, offset: 0 }
              as: ProgramAdmin
              as_user_id: "adm-001"
          assert:
            - "the first list response has response_type == \"array\", limit == 2, offset == 0, total_count == 3, has_more == true and exactly 2 data rows"
            - "the second list response has offset == 2, total_count == 3, has_more == false and exactly 1 data row"
            - "the third list response has total_count == 1, has_more == false and its single row id == ${aff_c} with partner_type == \"COUPON\""

      - name: get_affiliate_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_AFFILIATE_NOT_FOUND]
          - validations[priority 3]
          - response_envelope.error
        distinguishing_aspect: "A syntactically valid but unknown affiliate id returns HTTP 404 with response_type \"error\" and data.error_id == \"ERR_AFFILIATE_NOT_FOUND\" — never an empty 200 object."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          trigger:
            - call: "GET /affiliates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "the response has response_type == \"error\" and data.error_id == \"ERR_AFFILIATE_NOT_FOUND\""
            - "data.message is a non-empty string and meta.api_request_id is present"

      - name: create_affiliate_missing_required_partner_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Affiliate.fields.partner_type
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 14]
        distinguishing_aspect: "partner_type has source input with no default, so omitting it returns ERR_INVALID_REQUEST (400) and no Affiliate row is persisted — GET /affiliates still reports total_count 0."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z and one Network."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
          trigger:
            - call: "POST /affiliates"
              payload: { legal_name: "Nameless LLC", contact_email: "nameless@example.com", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { err: "$.data.error_id" }
            - call: "GET /affiliates"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
              as_user_id: "adm-001"
          assert:
            - "HTTP status == 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /affiliates returns total_count == 0"

      - name: create_tracking_link_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.TrackingLink.fields.cookie_window_days
          - entities.TrackingLink.fields.device_graph_enabled
          - entities.TrackingLink.fields.status
          - entities.Affiliate.fields.tracking_link_count
          - endpoints[POST /affiliates/{id}/tracking-links]
        distinguishing_aspect: "Omitting cookie_window_days and device_graph_enabled yields exactly 30 and false — the §1.1 defaults — while the parent Affiliate's tracking_link_count becomes 1 and its version becomes 2 in the same request."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z."
            - "One Network and one CONTENT partner still in PENDING_APPLICATION (link minting is only blocked for SUSPENDED and TERMINATED partners)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Beacon Content LLC", contact_email: "beacon@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: "$.data.id" }
          trigger:
            - call: "POST /affiliates/${aff_id}/tracking-links"
              payload: { landing_url: "https://retail.example/apparel", sub_id: "beacon-apparel" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { link_id: "$.data.id" }
            - call: "GET /affiliates/${aff_id}"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
          assert:
            - "TrackingLink.${link_id}.cookie_window_days == 30 and device_graph_enabled == false"
            - "TrackingLink.${link_id}.status == \"ACTIVE\", disabled_reason is null and version == 1"
            - "TrackingLink.${link_id}.affiliate_id == ${aff_id} and sub_id == \"beacon-apparel\""
            - "Affiliate.${aff_id}.tracking_link_count == 1 and version == 2"

      - name: application_screening_scores_are_computed_not_accepted_from_input
        claim_type: computed_fields
        grounds:
          - entities.AffiliateApplication.fields.site_quality_score
          - entities.AffiliateApplication.fields.brand_suitability_score
          - calculations.site_quality_composite_score
        excluded_because:
          difficulty_instance: non_linear_state_machine / application_revision_cycle_then_divergent_approve_branch
          rationale: "That instance already screens the same application twice and asserts the recomputed site_quality_score literals 58.4 and 87.8 plus the derived screening_outcome, which is exactly the computed-field claim for AffiliateApplication."

      - name: create_conversion_with_client_supplied_status_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Conversion.fields.attribution_status
          - entities.Conversion.fields.validation_status
          - entities.Conversion.fields.gross_commission_cents
          - endpoints[POST /conversions]
        distinguishing_aspect: "A POST /conversions body that smuggles attribution_status, gross_commission_cents and id is accepted, but every one of those system/computed fields comes back at its §1.1 default (UNATTRIBUTED, 0, server-minted id) rather than the submitted value."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z; no partner, link or policy is needed because POST /conversions only records the order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          trigger:
            - call: "POST /conversions"
              payload: { order_ref: "ORD-SYS-1", order_total_cents: 100000, product_category: "APPAREL", customer_ref: "CUST-SYS", is_new_customer: false, placed_at: "2026-07-01T09:00:00.000Z", device_id: "D1", other_channel_touch: "NONE", attribution_status: "AFFILIATE_ATTRIBUTED", gross_commission_cents: 999999, id: "client-supplied-id" }
              as: TrackingIngestor
              as_user_id: "ing-001"
              captures: { conv_id: "$.data.id" }
          assert:
            - "HTTP status == 201 and Conversion.${conv_id}.id != \"client-supplied-id\""
            - "Conversion.${conv_id}.attribution_status == \"UNATTRIBUTED\" and validation_status == \"PENDING_VALIDATION\""
            - "Conversion.${conv_id}.gross_commission_cents == 0, payable_commission_cents == 0, clawed_back_cents == 0 and returned_amount_cents == 0"
            - "Conversion.${conv_id}.attributed_affiliate_id, attributed_click_id and commission_policy_id are all null and candidate_click_count == 0"
            - "Conversion.${conv_id}.version == 1 and created_at == updated_at"

      - name: create_network_with_cross_field_fee_violations_rejected
        claim_type: type_constraints
        grounds:
          - entities.Network.fields.fee_bps
          - entities.Network.fields.flat_fee_cents
          - entities.Network.fields.statement_currency
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Each of the three §1.1 Network constraints fails independently with ERR_INVALID_REQUEST (400): flat_fee_cents non-zero under PERCENT_OF_COMMISSION, fee_bps non-zero under FLAT_PER_CONVERSION, and statement_currency outside {USD, EUR, GBP}."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          trigger:
            - call: "POST /networks"
              payload: { name: "Bad Percent Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 375, flat_fee_cents: 500, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { err_percent: "$.data.error_id" }
            - call: "POST /networks"
              payload: { name: "Bad Flat Network", fee_model: "FLAT_PER_CONVERSION", fee_bps: 100, flat_fee_cents: 25, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { err_flat: "$.data.error_id" }
            - call: "POST /networks"
              payload: { name: "Bad Currency Network", fee_model: "HYBRID", fee_bps: 375, flat_fee_cents: 0, statement_currency: "JPY" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { err_currency: "$.data.error_id" }
          assert:
            - "the PERCENT_OF_COMMISSION attempt returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" because flat_fee_cents must be 0"
            - "the FLAT_PER_CONVERSION attempt returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" because fee_bps must be 0"
            - "the statement_currency \"JPY\" attempt returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "no Network row is created by any of the three attempts"

      - name: click_event_rows_expose_no_version_and_have_no_mutation_endpoint
        claim_type: immutability
        grounds:
          - entities.ClickEvent
          - endpoints[GET /tracking-links/{id}/clicks]
          - endpoints[POST /tracking-links/{id}/clicks]
        distinguishing_aspect: "ClickEvent declares common_fields false, so its rows carry id and created_at but no version and no updated_at, and §1.5 exposes exactly one write path (POST /tracking-links/{id}/clicks) with no update or delete route."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z."
            - "One Network, one PENDING_APPLICATION CONTENT partner and one ACTIVE TrackingLink carrying a single ORGANIC_CLICK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Beacon Content LLC", contact_email: "beacon@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: "$.data.id" }
            - call: "POST /affiliates/${aff_id}/tracking-links"
              payload: { landing_url: "https://retail.example/apparel", sub_id: "beacon-apparel", cookie_window_days: 30, device_graph_enabled: false }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { link_id: "$.data.id" }
            - call: "POST /tracking-links/${link_id}/clicks"
              payload: { occurred_at: "2026-07-04T10:00:00.000Z", device_id: "D1", click_type: "ORGANIC_CLICK", referrer_domain: "beacon.example" }
              as: TrackingIngestor
              as_user_id: "ing-001"
              captures: { click_id: "$.data.id" }
          trigger:
            - call: "GET /tracking-links/${link_id}/clicks"
              payload: { limit: 10, offset: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
          assert:
            - "the response has total_count == 1 and its single row id == ${click_id}"
            - "the ClickEvent row carries id and created_at but contains no \"version\" key and no \"updated_at\" key"
            - "the ClickEvent row carries tracking_link_id == ${link_id}, occurred_at == \"2026-07-04T10:00:00.000Z\", device_id == \"D1\", click_type == \"ORGANIC_CLICK\", is_trademark_term == false"
            - "§1.5 declares no PUT, PATCH or DELETE route for ClickEvent, so the row can never be amended after ingestion"

      - name: create_application_under_unknown_affiliate_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.AffiliateApplication.fields.affiliate_id
          - errors[ERR_AFFILIATE_NOT_FOUND]
          - validations[priority 3]
        distinguishing_aspect: "The application's parent is addressed in the path, so an unknown affiliate id returns ERR_AFFILIATE_NOT_FOUND (404) rather than ERR_APPLICATION_NOT_FOUND or a 400."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z; no Affiliate rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          trigger:
            - call: "POST /affiliates/00000000-0000-0000-0000-000000000000/applications"
              payload: { site_url: "https://ghost.example", primary_traffic_source: "ORGANIC_SEARCH", monthly_traffic_estimate: 1000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404 and data.error_id == \"ERR_AFFILIATE_NOT_FOUND\""
            - "no AffiliateApplication row is created"

      - name: create_affiliate_with_unknown_network_id_returns_not_found
        claim_type: foreign_key_integrity
        grounds:
          - entities.Affiliate.fields.network_id
          - errors[ERR_NETWORK_NOT_FOUND]
          - validations[priority 11]
          - complexity_profile.entity_topology
        distinguishing_aspect: "In a flat topology the FK travels in the body, and an unknown network_id is rejected with ERR_NETWORK_NOT_FOUND (404) — the reference is validated, not stored blindly."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z; no Network rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          trigger:
            - call: "POST /affiliates"
              payload: { legal_name: "Orphan Media LLC", contact_email: "orphan@example.com", partner_type: "CONTENT", network_id: "00000000-0000-0000-0000-000000000000", payout_currency: "USD" }
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404 and data.error_id == \"ERR_NETWORK_NOT_FOUND\""
            - "no Affiliate row is created"

  - section: state_machines
    instances:

      - name: affiliate_and_application_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Affiliate.initial_state
          - state_machines.AffiliateApplication.initial_state
          - entities.AffiliateApplication.fields.review_state
          - entities.AffiliateApplication.fields.screening_outcome
        distinguishing_aspect: "A partner created through POST /affiliates lands in PENDING_APPLICATION and its first application lands in SUBMITTED with screening_outcome NOT_SCREENED, revision_round_count 0 and both scores still null."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-07-05T00:00:00Z and one Network."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
          trigger:
            - call: "POST /affiliates"
              payload: { legal_name: "Beacon Content LLC", contact_email: "beacon@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: "$.data.id" }
