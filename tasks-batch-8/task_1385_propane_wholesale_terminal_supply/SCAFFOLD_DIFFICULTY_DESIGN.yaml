            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /trucks"
              payload: { terminal_id: "${term}", unit_number: "U-01", capacity_gal: 11000, weekly_hours_limit_minutes: 3600 }
              as: SupplyAdmin
              captures: { tk1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer I1", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
