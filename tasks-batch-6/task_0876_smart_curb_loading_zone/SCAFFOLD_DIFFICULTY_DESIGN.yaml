      - name: schedule_buffer_gap_lt_15_rejects
        grounds:
          - calculations.schedule_window_overlap
          - validations[priority=7]
          - errors[ERR_SCHEDULE_WINDOW_CONFLICT]
        distinguishing_aspect: "Turnover-buffer boundary on schedule-windows: a second exclusive window with gap exactly 15 min (== TURNOVER_BUFFER_MINUTES) is accepted; a gap of 14 min (< buffer) is rejected."
