      - name: goodwill_approval_flips_coverage_and_releases_suspension_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.GoodwillAuthorization.transitions.PENDING_to_APPROVED
          - state_machines.WarrantyClaim.status.SUSPENDED_to_SUBMITTED
          - entities.WarrantyClaim.fields.coverage_type
          - entities.ClaimEdit.fields.resolved_at
          - calculations.goodwill_authorization_limit
        distinguishing_aspect: |
          Approving the authorization fires a three-part cross-entity cascade on the claim: coverage_type flips
          NONE -> GOODWILL, the open NO_COVERAGE edit is stamped resolved_at, and because that was the only
          SUSPEND edit the claim returns SUSPENDED -> SUBMITTED in the same response.
        test_recipe:
          setup:
            - "WORLD-GOODWILL: claim RO-GW-1 is SUSPENDED with coverage NONE and one open NO_COVERAGE SUSPEND edit."
            - "Its limits are adjudicator 40000 and manager 48000 (margin 0.1000, decay 0.8, share cap 48000)."
            - "adj-user-1 requested 40000 with policy_adjustment_pct 0.25, so the authorization sits in PENDING."
            - "adj-user-2 decides it, satisfying the segregation-of-duties rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-20T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
