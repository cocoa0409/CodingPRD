              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 300, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /community-care/appointments/${ap_id}/complete"
              as: ProviderRep
              as_user_id: "${p_id}"
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests"
              payload: { requested_visits: 5, requested_extra_days: 10 }
              as: CareCoordinator
              captures: { ext_id: $.data.id }
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { ra_v1: $.data.version }
          trigger:
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests/${ext_id}/decide"
              payload: { decision: "APPROVED", expected_referral_authorization_version: "${ra_v1}" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /community-care/appointments/${ap_id}/documentation"
              payload: { content_ref: "bundle-v1" }
              as: ProviderRep
              as_user_id: "${p_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /community-care/medical-documentation/${doc_id}/review"
              payload: { decision: "ACCEPTED" }
              as: CareCoordinator
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { ra_v2: $.data.version }
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests/${ext_id}/decide"
              payload: { decision: "APPROVED", expected_referral_authorization_version: "${ra_v2}" }
              as: CareCoordinator
