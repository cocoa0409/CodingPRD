            - "The UTILITY project is FUNDED with funded_amount_cents == 4500000; the SAFETY project is DEFERRED with funded_amount_cents == 0 (never 10500000 partial); the EXPANSION project is FUNDED with funded_amount_cents == 3000000 even though it ranks below the deferred project"
            - "budget_cents == allocated_cents + unallocated_cents and allocated_cents == 4500000 + 3000000"
            - "Park EM funded_capital_cents_ytd == 4500000 and park PC funded_capital_cents_ytd == 3000000"
