      - name: gift_card_cents_conserved_across_debit_and_exhaustion
        grounds:
          - state_machines.WorkshopSession.DRESSED_to_PAID
          - state_machines.GiftCard.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: |
          Conserved quantity: gift-card cents across the system. Paying a
          session total of exactly the card's balance debits to 0 and flips
          the card to EXHAUSTED; the sum (card balance + captured payments) is
          invariant. A second payment attempt on the exhausted card fails with
          no further drift.
        test_recipe:
          setup:
