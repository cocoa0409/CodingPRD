        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[resubmit-supersede-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After an EXPIRED request is superseded once (its version advances), a second resubmission carrying the stale pre-supersede version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An EXPIRED request whose version was read before any supersede, then superseded once by a first resubmission."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
