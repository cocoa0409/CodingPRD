# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1295_pallet_manufacturing_recycling
# 2 instances per each of the 9 Difficulty Rules (§0.5)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: core_batch_provisional_vs_final_settlement
        grounds:
          - calculations.settlement_final
          - entities.CorePurchaseBatch.fields.provisional_settlement_cents
          - entities.CorePurchaseBatch.fields.final_settlement_cents
          - state_machines.CorePurchaseBatch.AUDIT_to_CLOSED
        distinguishing_aspect: |
          Settlement on CorePurchaseBatch (procurement domain): provisional pays
          manifest_count * agreed_unit_price_cents with no grade mix or shortage
          penalty, while final applies the per-grade schedule (A 1.00x, B 0.60x,
          SCRAP 0) and the 25% under-delivery penalty on the manifest shortfall —
          identical batch data yields 5000 provisional vs 2775 final.
        test_recipe:
          setup:
            - "logical clock at startup default 2026-08-01T00:00:00Z"
            - "CorePurchaseBatch: agreed 500 cents/core, manifest_count 10, estimated mix A=0.5/B=0.3/SCRAP=0.2, status AUDIT"
            - "9 CoreUnits in the batch, all sorted: 4 grade A, 3 grade B, 2 SCRAP (received_count 9 < manifest 10)"
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "CoreCo", agreed_unit_price_cents: 500, manifest_count: 10, estimated_grade_mix: { A: 0.5, B: 0.3, SCRAP: 0.2 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c1: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c2: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c3: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c4: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c5: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c6: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c7: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c8: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c9: $.data.id }
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c2}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c3}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c4}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c5}/sort"
              payload: { grade: "B" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c6}/sort"
              payload: { grade: "B" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c7}/sort"
              payload: { grade: "B" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c8}/sort"
              payload: { grade: "SCRAP", condition_notes: "broken stringers" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${c9}/sort"
              payload: { grade: "SCRAP", condition_notes: "rotted deck" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-batches/${batch_id}/finish-sorting"
              payload: {}
              as: YardSupervisor
          trigger:
            - call: "POST /pallet-ops/core-batches/${batch_id}/close"
              payload: {}
              as: ProcurementManager
          assert:
            - "CorePurchaseBatch.${batch_id}.provisional_settlement_cents == 5000"
            - "CorePurchaseBatch.${batch_id}.final_settlement_cents == 2775"
            - "CorePurchaseBatch.${batch_id}.grade_yield_variance_bp == -556"
            - "final_settlement_cents != provisional_settlement_cents (2775 != 5000)"

      - name: route_margin_provisional_vs_final_with_skip
        grounds:
          - calculations.route_margin_provisional
          - calculations.route_margin_final
          - entities.DeliveryRoute.fields.provisional_margin_cents
          - entities.DeliveryRoute.fields.final_margin_cents
          - state_machines.DeliveryRoute.PLAN_to_DISPATCHED
          - state_machines.DeliveryRoute.DISPATCHED_to_CLOSED
        distinguishing_aspect: |
          Route margin on DeliveryRoute (fleet domain — a different entity domain
          from CorePurchaseBatch settlement): provisional counts ALL scheduled
          stops' order revenue (30000 + 22500 = 52500) minus mileage and stop
          costs, while final zeroes the SKIPPED stop's 22500 revenue and adds
          the 8000-cent fuel surcharge — same route data yields 21300
          provisional vs -9200 final.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; PINE lumber index 400000 cents/mbf covering it; no seasonal band (multiplier 10000)"
            - "ACTIVE spec S1 (48x40x6, 15 boards, PINE); NEW_BUILD lot of 500 grade NEW"
            - "customer CU with pool_credit_balance_cents 0; two allocated orders: O1 qty 20 (total 30000), O2 qty 15 (total 22500)"
            - "route R: trailer 5000 cuft, planned_miles 120; stops: seq1 DELIVERY O1, seq2 DELIVERY O2"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot_id: $.data.id }
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "ShipperOne" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 20, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /pallet-ops/orders/${o1_id}/confirm"
              payload: { expected_order_version: "${o1_v}" }
              as: SalesRep
              captures: { o1_v2: $.data.version, o1_total: $.data.total_cents }
            - call: "POST /pallet-ops/orders/${o1_id}/allocate"
              payload: { expected_order_version: "${o1_v2}" }
              as: SalesRep
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 15, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /pallet-ops/orders/${o2_id}/confirm"
              payload: { expected_order_version: "${o2_v}" }
              as: SalesRep
              captures: { o2_v2: $.data.version, o2_total: $.data.total_cents }
            - call: "POST /pallet-ops/orders/${o2_id}/allocate"
              payload: { expected_order_version: "${o2_v2}" }
              as: SalesRep
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-10T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 120 }
              as: FleetPlanner
              captures: { route_id: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${o1_id}" }
              as: FleetPlanner
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 2, stop_type: "DELIVERY", order_id: "${o2_id}" }
              as: FleetPlanner
              captures: { stop2_id: $.data.id }
            - call: "GET /pallet-ops/routes/${route_id}"
              payload: {}
              as: FleetPlanner
              captures: { route_v2: $.data.version }
            - call: "POST /pallet-ops/routes/${route_id}/dispatch"
              payload: { expected_route_version: "${route_v2}" }
              as: FleetPlanner
            - call: "POST /pallet-ops/route-stops/${stop2_id}/skip"
              payload: {}
              as: FleetPlanner
          trigger:
            - call: "POST /pallet-ops/routes/${route_id}/close"
              payload: { fuel_surcharge_cents: 8000 }
              as: FleetPlanner
          assert:
            - "SalesOrder.${o1_id}.total_cents == 30000 and SalesOrder.${o2_id}.total_cents == 22500"
            - "DeliveryRoute.${route_id}.provisional_margin_cents == 21300"
            - "DeliveryRoute.${route_id}.final_margin_cents == -9200"
            - "RouteStop.${stop2_id}.status == SKIPPED contributes 0 revenue to final margin"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a) tiered/branching and (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: new_build_cost_tier_and_index_lookup
        grounds:
          - calculations.new_build_unit_cost
          - entities.InventoryLot.fields.unit_cost_cents
          - validations[priority=25]
        distinguishing_aspect: |
          Mode (a) — 3+ inputs with non-linear interaction: unit_cost depends on
          spec.board_feet_per_pallet (itself computed via nested ceil + two
          cross-sections), the half-open lumber index window lookup, AND the
          quantity-tiered overhead rate (18/12/9%); qty 99 lands in tier 1
          (7434 cents) while qty 100 lands in tier 2 (7056 cents) — a one-unit
          quantity change flips the rate branch at the 100 boundary.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; PINE index 400000 cents/mbf [2026-07-01, 2026-09-01)"
            - "ACTIVE PINE spec 48x40x6 15 boards (board_feet_per_pallet 15.75)"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 99, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot99_id: $.data.id }
          trigger:
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 100, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot100_id: $.data.id }
          assert:
            - "PalletSpec.${spec_id}.board_feet_per_pallet == 15.75"
            - "InventoryLot.${lot99_id}.unit_cost_cents == 7434"
            - "InventoryLot.${lot100_id}.unit_cost_cents == 7056"
            - "tier boundary 100 belongs to tier 2 (100 <= qty < 500): lot100 cost 7056 < lot99 cost 7434 despite identical lumber price"

      - name: order_pricing_per_line_rounding_then_sum
        grounds:
          - calculations.order_pricing
          - entities.SalesOrder.fields.subtotal_cents
          - entities.SalesOrder.fields.seasonal_adjustment_cents
          - entities.OrderLine.fields.extended_price_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: per-line extended_price_cents
          rounded half-up FIRST then summed into subtotal; the seasonal
          adjustment is computed once on the SUMMED subtotal (not per-line then
          summed). With lines 10x1500 and 5x1100, subtotal is 20500 and the
          11000-bp adjustment is 2050; computing seasonal per-line then summing
          (1500 + 550 = 2050 here but diverges on fractional lines) or summing
          raw then rounding are both forbidden orders.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; seasonal band PEAK-2026-Q3 11000 bp [2026-08-01, 2026-09-01)"
            - "ACTIVE PINE spec S; customer with pool_credit_balance_cents 0"
            - "order with line1 qty 10 grade NEW (unit 1500) and line2 qty 5 grade A (unit 1100)"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/seasonal-index"
              payload: { season_code: "PEAK-2026-Q3", multiplier_bp: 11000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "RoundTripper" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 10, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /pallet-ops/orders/${order_id}/lines"
              payload: { spec_id: "${spec_id}", quantity: 5, quality_grade_requested: "A" }
              as: SalesRep
              captures: { line2_id: $.data.id }
          trigger:
            - call: "POST /pallet-ops/orders/${order_id}/confirm"
              payload: { expected_order_version: "${order_v}" }
              as: SalesRep
          assert:
            - "OrderLine.${line2_id}.extended_price_cents == 5500 (per-line round of 5 * 1100)"
            - "SalesOrder.${order_id}.subtotal_cents == 20500 (sum of per-line rounded 15000 + 5500)"
            - "SalesOrder.${order_id}.seasonal_adjustment_cents == 2050 (round_half_up(20500 * 1000 / 10000) on subtotal)"
            - "SalesOrder.${order_id}.total_cents == 22550 (20500 + 2050 - 0)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: core_unit_repair_failure_cycle
        grounds:
          - state_machines.CoreUnit
          - state_machines.RepairWorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.CoreUnit.fields.repair_cycle_count
        distinguishing_aspect: |
          CoreUnit has a true cycle: IN_REPAIR --(complete FAILED)--> grade
          UNSORTED + processing_status YARD --(sort)--> graded --(new work
          order)--> IN_REPAIR again, with repair_cycle_count monotonically
          increasing across loops — the machine loops on the SAME row rather
          than following a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE PINE spec exists (repair target); batch in SORTING with 1 core sorted to B (repairable); first work order completed FAILED"
          setup_api_calls:
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { cyc_spec: $.data.id }
            - call: "POST /pallet-ops/specs/${cyc_spec}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "CycleCo", agreed_unit_price_cents: 500, manifest_count: 1, estimated_grade_mix: { A: 0.0, B: 1.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { core_id: $.data.id }
            - call: "POST /pallet-ops/core-units/${core_id}/sort"
              payload: { grade: "B" }
              as: YardSupervisor
            - call: "POST /pallet-ops/repair-orders"
              payload: { core_unit_id: "${core_id}", target_grade: "A", target_spec_id: "${cyc_spec}", labor_minutes_estimate: 30 }
              as: YardSupervisor
              captures: { wo1_id: $.data.id }
            - call: "POST /pallet-ops/repair-orders/${wo1_id}/start"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/repair-orders/${wo1_id}/complete"
              payload: { outcome_grade: "FAILED", actual_labor_minutes: 25 }
              as: YardSupervisor
          trigger:
            - call: "POST /pallet-ops/core-units/${core_id}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/repair-orders"
              payload: { core_unit_id: "${core_id}", target_grade: "A", target_spec_id: "${cyc_spec}", labor_minutes_estimate: 20 }
              as: YardSupervisor
              captures: { wo2_id: $.data.id }
          assert:
            - "CoreUnit.${core_id}.repair_cycle_count == 1 after first FAILED completion"
            - "CoreUnit.${core_id}.grade == UNSORTED after FAILED (cycle back into sorting)"
            - "second sort succeeds on the same core id and grade == A"
            - "RepairWorkOrder.${wo2_id}.status == OPEN — the cycled core is repairable again"

      - name: sales_order_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.SalesOrder
          - entities.SalesOrder.fields.payment_status
          - entities.SalesOrder.fields.fulfillment_status
          - calculations.order_pricing
        distinguishing_aspect: |
          SalesOrder carries two independent state axes — payment_status
          (UNPAID -> PAID | CREDIT_SETTLED) and fulfillment_status
          (DRAFT -> CONFIRMED -> ALLOCATED -> SHIPPED -> DELIVERED | CANCELLED) —
          on the same row; a fully credit-covered order flips payment to
          CREDIT_SETTLED at confirm while fulfillment only reaches CONFIRMED,
          showing the axes evolve independently.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; PINE index; ACTIVE spec; NEW lot 500"
            - "customer has pool_credit_balance_cents 2800 and pool_units_outstanding 1 (delivered 5, returned 4 A-grade -> credited 4*700=2800)"
            - "DRAFT order qty 1 grade NEW (invoice 1500 <= credit 2800)"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "CreditRich" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-05T00:00:00Z", spec_id: "${spec_id}", quantity: 5, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { seed_o: $.data.id, seed_ov: $.data.version }
            - call: "POST /pallet-ops/orders/${seed_o}/confirm"
              payload: { expected_order_version: "${seed_ov}" }
              as: SalesRep
              captures: { seed_ov2: $.data.version }
            - call: "POST /pallet-ops/orders/${seed_o}/allocate"
              payload: { expected_order_version: "${seed_ov2}" }
              as: SalesRep
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-05T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 40 }
              as: FleetPlanner
              captures: { seed_r: $.data.id }
            - call: "POST /pallet-ops/routes/${seed_r}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${seed_o}" }
              as: FleetPlanner
              captures: { seed_s: $.data.id }
            - call: "GET /pallet-ops/routes/${seed_r}"
              payload: {}
              as: FleetPlanner
              captures: { seed_rv: $.data.version }
            - call: "POST /pallet-ops/routes/${seed_r}/dispatch"
              payload: { expected_route_version: "${seed_rv}" }
              as: FleetPlanner
            - call: "POST /pallet-ops/route-stops/${seed_s}/arrive"
              payload: {}
              as: FleetPlanner
            - call: "POST /pallet-ops/route-stops/${seed_s}/complete"
              payload: {}
              as: FleetPlanner
            - call: "POST /pallet-ops/pool-returns"
              payload: { customer_id: "${cust_id}", returned_count: 4, grade_on_return: "A" }
              as: SalesRep
              captures: { pr_id: $.data.id }
            - call: "POST /pallet-ops/pool-returns/${pr_id}/grade"
              payload: { grade_on_return: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/pool-returns/${pr_id}/credit"
              payload: {}
              as: SalesRep
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "POST /pallet-ops/orders/${order_id}/confirm"
              payload: { expected_order_version: "${order_v}" }
              as: SalesRep
          assert:
            - "SalesOrder.${order_id}.subtotal_cents == 1500 and seasonal_adjustment_cents == 0 (no seasonal band)"
            - "SalesOrder.${order_id}.pool_credit_applied_cents == 1500 (min(2800, 1500))"
            - "SalesOrder.${order_id}.total_cents == 0 and payment_status == CREDIT_SETTLED"
            - "SalesOrder.${order_id}.fulfillment_status == CONFIRMED — payment axis advanced to a terminal state while fulfillment axis sits mid-pipeline"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; one depth>=3, one depth>=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pool_credit_to_grinding_cascade
        grounds:
          - state_machines.PoolReturn.GRADED_to_CREDITED
          - state_machines.CoreUnit
          - state_machines.GrindingBatch
          - entities.Customer.fields.pool_credit_balance_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /pool-returns/{id}/credit: credit
          mutates Customer (pool_units_outstanding -= returned_count) AND
          synthesizes CoreUnit rows in GRINDING_QUEUED (link 1); those CoreUnits
          satisfy the eligibility gate of POST /grinding-batches + start
          (link 2); grinding completion flips the cores to terminal GROUND
          (link 3) — each hop caused by the previous link's output.
        test_recipe:
          setup:
            - "customer with pool_units_outstanding == 5 (order of 5 delivered)"
            - "LOGGED+GRADED pool return of 2 SCRAP units for that customer"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 100, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "CascadeCust" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 5, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /pallet-ops/orders/${order_id}/confirm"
              payload: { expected_order_version: "${order_v}" }
              as: SalesRep
              captures: { order_v2: $.data.version }
            - call: "POST /pallet-ops/orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v2}" }
              as: SalesRep
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-10T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 40 }
              as: FleetPlanner
              captures: { route_id: $.data.id }
            - call: "POST /pallet-ops/routes/${route_id}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${order_id}" }
              as: FleetPlanner
              captures: { stop_id: $.data.id }
            - call: "GET /pallet-ops/routes/${route_id}"
              payload: {}
              as: FleetPlanner
              captures: { route_v: $.data.version }
            - call: "POST /pallet-ops/routes/${route_id}/dispatch"
              payload: { expected_route_version: "${route_v}" }
              as: FleetPlanner
            - call: "POST /pallet-ops/route-stops/${stop_id}/arrive"
              payload: {}
              as: FleetPlanner
            - call: "POST /pallet-ops/route-stops/${stop_id}/complete"
              payload: {}
              as: FleetPlanner
            - call: "POST /pallet-ops/pool-returns"
              payload: { customer_id: "${cust_id}", returned_count: 2, grade_on_return: "SCRAP" }
              as: SalesRep
              captures: { pr_id: $.data.id }
            - call: "POST /pallet-ops/pool-returns/${pr_id}/grade"
              payload: { grade_on_return: "SCRAP" }
              as: YardSupervisor
          trigger:
            - call: "POST /pallet-ops/pool-returns/${pr_id}/credit"
              payload: {}
              as: SalesRep
            - call: "GET /pallet-ops/core-units"
              payload: { grade: "SCRAP", processing_status: "GRINDING_QUEUED" }
              as: YardSupervisor
              captures: { gq1: "$.data[0].id", gq2: "$.data[1].id" }
            - call: "POST /pallet-ops/grinding-batches"
              payload: { input_core_ids: ["${gq1}", "${gq2}"] }
              as: YardSupervisor
              captures: { gb_id: $.data.id }
            - call: "POST /pallet-ops/grinding-batches/${gb_id}/start"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/grinding-batches/${gb_id}/complete"
              payload: { output_fiber_cuyd: 12.5, revenue_cents: 9000 }
              as: YardSupervisor
          assert:
            - "Customer.${cust_id}.pool_units_outstanding == 3 after credit (5 delivered - 2 returned)"
            - "PoolReturn.${pr_id}.status == CREDITED and total_credit_cents == 0 (SCRAP tier)"
            - "two new CoreUnit rows exist with grade == SCRAP and processing_status == GRINDING_QUEUED (link 1 output)"
            - "GrindingBatch.${gb_id}.yield_ratio == 6.25 (12.5 / 2)"
            - "both input cores end processing_status == GROUND (link 3 terminal)"

      - name: repair_completion_to_lot_depletion_cascade
        grounds:
          - state_machines.RepairWorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.InventoryLot.AVAILABLE_to_DEPLETED
          - calculations.allocation_selector
        distinguishing_aspect: |
          Depth-2 chain triggered by POST /repair-orders/{id}/complete with
          outcome A: completion synthesizes a 1-unit RECYCLED_REPAIR InventoryLot
          (link 1); a subsequent order allocation consumes that lot's single
          unit, auto-flipping the lot to DEPLETED via the system bubble-up
          transition (link 2) — the lot state change is caused by the
          allocation, which was possible only because of the repair output.
        test_recipe:
          setup:
            - "batch SORTING with one core graded B; repair work order targeting A on that core, completed A"
            - "ACTIVE PINE spec S2; customer order of 1 A-grade pallet for S2, CONFIRMED"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-42X42-11B", length_in: 42, width_in: 42, height_in: 5.0, board_count: 11, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec2_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec2_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "FixUp", agreed_unit_price_cents: 500, manifest_count: 1, estimated_grade_mix: { A: 0.0, B: 1.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { core_id: $.data.id }
            - call: "POST /pallet-ops/core-units/${core_id}/sort"
              payload: { grade: "B" }
              as: YardSupervisor
            - call: "POST /pallet-ops/repair-orders"
              payload: { core_unit_id: "${core_id}", target_grade: "A", labor_minutes_estimate: 30, target_spec_id: "${spec2_id}" }
              as: YardSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /pallet-ops/repair-orders/${wo_id}/start"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/repair-orders/${wo_id}/complete"
              payload: { outcome_grade: "A", actual_labor_minutes: 28 }
              as: YardSupervisor
            - call: "GET /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec2_id}", status: "AVAILABLE" }
              as: SalesRep
              captures: { rlot_id: "$.data[0].id" }
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "OnePalletBuyer" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec2_id}", quantity: 1, quality_grade_requested: "A" }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /pallet-ops/orders/${order_id}/confirm"
              payload: { expected_order_version: "${order_v}" }
              as: SalesRep
              captures: { order_v2: $.data.version }
          trigger:
            - call: "POST /pallet-ops/orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v2}" }
              as: SalesRep
          assert:
            - "InventoryLot.${rlot_id}.quantity_available == 0 after allocation (link 2 input)"
            - "InventoryLot.${rlot_id}.status == DEPLETED (system auto-transition, link 2 output)"
            - "the order's OrderLine.allocated_lot_id == ${rlot_id}"
            - "CoreUnit.${core_id}.processing_status == REPAIRED (link 1 terminal state)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_ht_complete
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.HeatTreatmentRun.RUNNING_to_COMPLETED
          - errors[ERR_HT_NOT_RUNNING]
          - errors[ERR_HT_DWELL_SHORT]
        distinguishing_aspect: |
          Pair state-vs-business_safety: completing a run that is still STAGING
          violates the state precondition (priority 5) AND would also fail the
          6h dwell rule (safety, priority 9); the response MUST be
          ERR_HT_NOT_RUNNING because state is evaluated before business safety.
        test_recipe:
          setup:
            - "HT run created and still STAGING with one PENDING_HT lot assigned; run never started so dwell is also 0"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE", requires_heat_treatment_default: true }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot_id: $.data.id }
            - call: "POST /pallet-ops/ht-runs"
              payload: { chamber_code: "CH-1", species_profile: "PINE", capacity_pallets: 100 }
              as: HeatTreatOperator
              captures: { run_id: $.data.id }
            - call: "POST /pallet-ops/ht-runs/${run_id}/assign-lot"
              payload: { lot_id: "${lot_id}" }
              as: HeatTreatOperator
          trigger:
            - call: "POST /pallet-ops/ht-runs/${run_id}/complete"
              payload: {}
              as: HeatTreatOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HT_NOT_RUNNING (state category, priority 5) — NOT ERR_HT_DWELL_SHORT (business_safety, priority 9)"
            - "HeatTreatmentRun.${run_id}.status remains STAGING"
            - "InventoryLot.${lot_id}.heat_treat_status remains PENDING_HT"

      - name: referential_vs_fiscal_on_allocate
        grounds:
          - validations[priority=8]
          - validations[priority=24]
          - errors[ERR_HT_REQUIRED]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          Pair business_safety-vs-business_fiscal: allocating a line with
          heat_treatment_required=true where a candidate lot has enough quantity
          but is not HT_CERTIFIED must return ERR_HT_REQUIRED (safety,
          priority 7), NOT ERR_INSUFFICIENT_STOCK (fiscal, priority 23) — the
          safety filter empties the candidate set before the fiscal check runs.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; PINE index; ACTIVE spec S (requires_heat_treatment_default false)"
            - "NEW_BUILD lot of 100, heat_treat_status NOT_REQUIRED (fails the HT_CERTIFIED filter)"
            - "order line qty 50 with heat_treatment_required=true (explicit override), order CONFIRMED"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 100, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot_id: $.data.id }
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "ExporterIntl" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 50, quality_grade_requested: "NEW", heat_treatment_required: true }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /pallet-ops/orders/${order_id}/confirm"
              payload: { expected_order_version: "${order_v}" }
              as: SalesRep
              captures: { order_v2: $.data.version }
          trigger:
            - call: "POST /pallet-ops/orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v2}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HT_REQUIRED (business_safety, priority 7) — NOT ERR_INSUFFICIENT_STOCK (business_fiscal, priority 23)"
            - "InventoryLot.${lot_id}.quantity_available unchanged at 100 (no partial reservation)"
            - "SalesOrder.${order_id}.fulfillment_status remains CONFIRMED"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: lumber_index_half_open_window_boundary
        grounds:
          - calculations.new_build_unit_cost
          - entities.LumberPriceIndex.fields.effective_to
          - errors[ERR_PRICE_INDEX_MISSING]
        distinguishing_aspect: |
          Numeric temporal boundary on POST /inventory-lots: the lumber window
          is half-open [effective_from, effective_to) — a lot created at exactly
          effective_to is NOT covered (ERR_PRICE_INDEX_MISSING) while one second
          before is covered at 400 cents/bf; >= vs > precision on the window edge.
        test_recipe:
          setup:
            - "PINE index 400000 [2026-07-01T00:00:00Z, 2026-09-01T00:00:00Z); ACTIVE PINE spec"
            - "lot created at 2026-08-31T23:59:59Z succeeds; clock then set to exactly 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { lot_ok: $.data.id }
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 10, quality_grade: "NEW" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "InventoryLot.${lot_ok}.unit_cost_cents == 7434 (covered at 2026-08-31T23:59:59Z)"
            - "lot creation at exactly 2026-09-01T00:00:00Z (effective_to) fails with ERR_PRICE_INDEX_MISSING"
            - "boundary is half-open: effective_from inclusive, effective_to exclusive"

      - name: trailer_cube_exact_fit_vs_overflow
        grounds:
          - validations[priority=16]
          - entities.DeliveryRoute.fields.cube_used_cuft
          - entities.PalletSpec.fields.unit_cube_cuft
          - errors[ERR_CUBE_OVERFLOW]
        distinguishing_aspect: |
          Zero-remainder capacity boundary on a different metric (trailer cube,
          cubic feet) and different endpoint (POST /routes/{id}/stops): a stop
          whose load brings cube_used_cuft to EXACTLY trailer_cube_capacity_cuft
          is admitted (<= comparison); any further stop overflows. Here 75
          pallets x 6.6667 cuft = 500.0025 cuft capacity fits exactly; the 76th
          pallet's stop is rejected with ERR_CUBE_OVERFLOW.
        test_recipe:
          setup:
            - "clock 2026-08-01; PINE index; ACTIVE spec 48x40x6 (unit_cube 6.6667 cuft); NEW lot 500"
            - "allocated orders O1 qty 74 (cube 493.3358) and O2 qty 1 (cube 6.6667) and O3 qty 1"
            - "route with trailer_cube_capacity_cuft 500.0025 (exactly 75 pallets)"
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
