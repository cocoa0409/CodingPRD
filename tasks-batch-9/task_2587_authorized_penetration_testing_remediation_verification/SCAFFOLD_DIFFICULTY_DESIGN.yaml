        grounds:
          - calculations.authorized_target_collision
          - validations.priority_54_ERR_TARGET_WINDOW_COLLISION
          - entities.AuthorizedTarget.fields.cooldown_hours
          - entities.RulesOfEngagement.fields.active_target_count
