# =============================================================================
# PRD Benchmark Scaffold — Makerspace & Fab-Lab Membership
# Difficulty: Expert
# =============================================================================

scenario: |
  Makerspace & Fab-Lab Membership: membership tier & equipment access, tool
  certification/training prerequisite, machine reservation (laser/CNC/3D) & time,
  material store & consumable billing, project storage & locker, day-pass vs
  monthly, safety/waiver & supervision, class/workshop

domain_name: makerspace-fablab
# Flat topology: every entity is a top-level collection. api_prefix is empty so
# all collection paths ("/members", "/machines", "/reservations", ...) sit at the
# root and the FK reverse-reachability check resolves each entity's segment.
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # flat: peer entities linked by foreign keys; no entity nesting in URL paths.

  state_machine_shape: parallel
  # Reservation carries parallel dimensions (occupancy_status × billing_status);
  # Certification is cyclic (ACTIVE→EXPIRED→ACTIVE renewal loop); WorkshopEnrollment
  # is branching (ENROLLED→{ATTENDED, NO_SHOW}); Member subscription is linear.

  relationship_patterns:
    - one_to_many        # Member → Reservation, Member → Certification, Machine → Reservation
    - many_to_many       # Member ↔ Workshop via WorkshopEnrollment junction
    - cross_aggregate    # Reservation references Member, Machine, and (optionally) a Certification

  role_model: peer_roles
  # Member acts on own resources; StaffInstructor runs certifications/workshops and
  # supervises; FacilityAdmin owns machine/plan/locker configuration and clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration: membership tier ----
  - name: MembershipTier
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: code, type: string, source: input, description: "Unique tier code, e.g. DAYPASS | MAKER | PRO" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: billing_mode, type: enum, source: input, description: "DAYPASS | MONTHLY", constraints: "DAYPASS | MONTHLY" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly fee in cents; 0 for DAYPASS tiers", default: 0, constraints: ">= 0" }
      - { name: daypass_fee_cents, type: integer, source: input, description: "Per-day-pass price in cents; 0 for MONTHLY tiers", default: 0, constraints: ">= 0" }
      - { name: discount_bps, type: integer, source: input, description: "Member machine-time discount in basis points (1000 = 10%)", default: 0, constraints: "0..10000" }
      - { name: prepaid_machine_minutes, type: integer, source: input, description: "Free machine minutes granted each cycle", default: 0, constraints: ">= 0" }
      - { name: locker_free_liters, type: integer, source: input, description: "Free project-locker volume in liters before overage", default: 0, constraints: ">= 0" }
      - { name: unsupervised_allowed, type: boolean, source: input, description: "Whether tier may book UNSUPERVISED sessions when readiness gate passes", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Resource: member ----
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Unique member email" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: tier_id, type: string, source: input, description: "FK -> MembershipTier.id; current membership tier" }
      - { name: subscription_status, type: enum, source: system, description: "PENDING_WAIVER | ACTIVE | SUSPENDED | CANCELLED", default: "PENDING_WAIVER", constraints: "PENDING_WAIVER | ACTIVE | SUSPENDED | CANCELLED" }
      - { name: waiver_signed_at, type: datetime, source: system, description: "Timestamp the safety waiver was signed; null until signed" }
      - { name: cycle_start_at, type: datetime, source: system, description: "Logical-clock instant the current 30-day billing cycle began; null until ACTIVE" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Prepaid wallet balance in cents; debited on confirm, credited on cancel/refund", default: 0, constraints: ">= 0" }
      - { name: prepaid_minutes_remaining, type: integer, source: computed, description: "Free machine minutes left this cycle; reset to tier.prepaid_machine_minutes on cycle roll", default: 0, constraints: ">= 0" }
      - { name: daypass_count_window, type: integer, source: computed, description: "Count of day-passes purchased in the rolling 30-day window ending at the logical clock", default: 0, constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Configuration: machine (laser / CNC / 3D printer) ----
  - name: Machine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Machine display name" }
      - { name: machine_class, type: enum, source: input, description: "LASER | CNC | PRINTER_3D", constraints: "LASER | CNC | PRINTER_3D" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Time charge per hour in cents", constraints: ">= 0" }
      - { name: setup_fee_cents, type: integer, source: input, description: "Flat per-session setup fee in cents", default: 0, constraints: ">= 0" }
      - { name: min_billing_minutes, type: integer, source: input, description: "Minimum billable minutes per session regardless of shorter use", default: 0, constraints: ">= 0" }
      - { name: cooldown_minutes, type: integer, source: input, description: "Mandatory post-session cooldown buffer used in overlap geometry; 0 = bare half-open adjacency allowed", default: 0, constraints: ">= 0" }
      - { name: requires_certification, type: boolean, source: input, description: "Whether a machine_class certification is mandatory to reserve", default: true }
      - { name: operational_status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", default: "AVAILABLE", constraints: "AVAILABLE | OUT_OF_SERVICE" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Resource: tool certification ----
  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; certified member" }
      - { name: machine_class, type: enum, source: input, description: "LASER | CNC | PRINTER_3D this certification grants", constraints: "LASER | CNC | PRINTER_3D" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", default: "ACTIVE", constraints: "ACTIVE | EXPIRED | REVOKED" }
      - { name: orientation_complete, type: boolean, source: input, description: "Whether the member completed class orientation for this machine_class", default: false }
      - { name: supervised_minutes, type: integer, source: input, description: "Supervised practice minutes logged toward unsupervised eligibility", default: 0, constraints: ">= 0" }
      - { name: required_supervised_minutes, type: integer, source: input, description: "Supervised minutes required for full readiness on this class", default: 0, constraints: ">= 0" }
      - { name: granted_at, type: datetime, source: system, description: "Logical-clock instant the certification was granted/renewed" }
      - { name: expires_at, type: datetime, source: system, description: "Logical-clock instant the certification lapses (granted_at + 365 days)" }
      - { name: readiness_score, type: number, source: computed, description: "Weighted unsupervised-readiness score in [0,1]; see calc certification_readiness" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Resource: machine reservation (time window) ----
  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; reserving member" }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; reserved machine" }
      - { name: certification_id, type: string, source: input, description: "FK -> Certification.id; certification relied upon for access; null only when machine.requires_certification is false" }
      - { name: start_at, type: datetime, source: input, description: "Reserved window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Reserved window end (exclusive)" }
      - { name: supervision_mode, type: enum, source: input, description: "SUPERVISED | UNSUPERVISED", constraints: "SUPERVISED | UNSUPERVISED" }
      - { name: occupancy_status, type: enum, source: system, description: "Occupancy dimension: HELD | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", default: "HELD", constraints: "HELD | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: billing_status, type: enum, source: system, description: "Billing dimension (parallel to occupancy): UNBILLED | HOLD_PLACED | SETTLED | REFUNDED", default: "UNBILLED", constraints: "UNBILLED | HOLD_PLACED | SETTLED | REFUNDED" }
      - { name: reserved_minutes, type: integer, source: computed, description: "(end_at - start_at) in whole minutes" }
      - { name: actual_minutes, type: integer, source: computed, description: "(check_out_at - check_in_at) in whole minutes; null until COMPLETED" }
      - { name: check_in_at, type: datetime, source: system, description: "Logical-clock instant of check-in; null until CHECKED_IN" }
      - { name: check_out_at, type: datetime, source: system, description: "Logical-clock instant of check-out; null until COMPLETED" }
      - { name: free_minutes_applied, type: integer, source: computed, description: "Prepaid minutes consumed by this reservation's current charge", default: 0, constraints: ">= 0" }
      - { name: estimate_charge_cents, type: integer, source: computed, description: "Forward estimate session charge at confirm time (reserved_minutes basis)", default: 0 }
      - { name: final_charge_cents, type: integer, source: computed, description: "Final session charge at settle time (actual_minutes basis)", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Resource: project locker ----
  - name: Locker
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; locker holder" }
      - { name: label, type: string, source: input, description: "Locker label / unit number" }
      - { name: capacity_liters, type: integer, source: input, description: "Physical locker capacity in liters", constraints: ">= 0" }
      - { name: used_liters, type: integer, source: input, description: "Project volume currently stored in liters", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED", default: "ASSIGNED", constraints: "ASSIGNED | RELEASED" }
      - { name: overage_fee_cents, type: integer, source: computed, description: "Storage overage charge for current used_liters above tier.locker_free_liters", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Configuration: material catalog item ----
  - name: MaterialItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit code" }
      - { name: name, type: string, source: input, description: "Material display name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit in cents", constraints: ">= 0" }
      - { name: stock_qty, type: integer, source: input, description: "On-hand stock quantity", default: 0, constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Resource: material purchase (consumable billing) ----
  - name: MaterialPurchase
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; purchasing member" }
      - { name: lines, type: array, source: input, description: "Array of {material_item_id, quantity}; >= 1 line" }
      - { name: waste_surcharge_bps, type: integer, source: input, description: "Order-level waste surcharge in basis points applied to discounted subtotal", default: 0, constraints: "0..10000" }
      - { name: status, type: enum, source: system, description: "DRAFT | BILLED | VOIDED", default: "DRAFT", constraints: "DRAFT | BILLED | VOIDED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded discounted amounts" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Rounded waste surcharge over subtotal" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + surcharge_cents" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Configuration: workshop / class ----
  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: title, type: string, source: input, description: "Workshop title" }
      - { name: machine_class, type: enum, source: input, description: "Machine class this workshop certifies on completion; null for non-certifying classes", constraints: "LASER | CNC | PRINTER_3D" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Member.id; staff member who leads the workshop (acts under StaffInstructor role)" }
      - { name: starts_at, type: datetime, source: input, description: "Workshop start instant" }
      - { name: capacity, type: integer, source: input, description: "Maximum enrolled seats", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | RUNNING | COMPLETED | CANCELLED", default: "OPEN", constraints: "OPEN | FULL | RUNNING | COMPLETED | CANCELLED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of ENROLLED + ATTENDED enrollments", default: 0, constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Junction: workshop enrollment ----
  - name: WorkshopEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id; enrolled workshop" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolled member" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ATTENDED | NO_SHOW | WITHDRAWN", default: "ENROLLED", constraints: "ENROLLED | ATTENDED | NO_SHOW | WITHDRAWN" }
      - { name: certification_id, type: string, source: system, description: "FK -> Certification.id; certification minted on ATTENDED for a certifying workshop; null otherwise" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # ---- Event log: wallet ledger ----
  - name: WalletEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; ledger owner" }
      - { name: kind, type: enum, source: system, description: "TOPUP | DEBIT | REFUND | DAYPASS | SUBSCRIPTION | MATERIAL | OVERAGE", constraints: "TOPUP | DEBIT | REFUND | DAYPASS | SUBSCRIPTION | MATERIAL | OVERAGE" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents; positive credits the wallet, negative debits it" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; source reservation when kind in {DEBIT, REFUND}; null otherwise" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Member wallet_credit_cents immediately after this entry" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; append-only ordering key" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Member subscription (linear, with SUSPENDED revert) ----
  - entity: Member
    field: subscription_status
    initial_state: PENDING_WAIVER
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_WAIVER
        to: ACTIVE
        trigger: "POST /members/{id}/activate"
        actor: Member
        preconditions:
          - "waiver_signed_at is not null (waiver signed via POST /members/{id}/sign-waiver)"
          - "Member.tier_id resolves to a MembershipTier"
          - "For MONTHLY tier: wallet_credit_cents >= prorated monthly fee (see membership_proration FORWARD variant)"
        side_effects:
          - "Set cycle_start_at = logical clock now"
          - "Reset prepaid_minutes_remaining = tier.prepaid_machine_minutes"
          - "For MONTHLY tier: debit wallet_credit_cents by FORWARD prorated fee; append WalletEntry kind=SUBSCRIPTION"
          - "For MONTHLY tier: append WalletEntry balance_after_cents = new wallet_credit_cents"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/suspend"
        actor: StaffInstructor
        preconditions:
          - "Member.subscription_status == ACTIVE"
        side_effects:
          - "All Reservation rows for this member with occupancy_status IN {HELD, CONFIRMED} -> CANCELLED (cascade A: each cancel itself refunds wallet hold)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/activate"
        actor: Member
        preconditions:
          - "Member.subscription_status == SUSPENDED"
          - "waiver_signed_at is not null"
        side_effects:
          - "No re-proration; cycle_start_at unchanged"

      - from: [PENDING_WAIVER, ACTIVE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /members/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "All Reservation rows for this member with occupancy_status IN {HELD, CONFIRMED, CHECKED_IN} -> CANCELLED (cascade: refund each wallet hold)"
          - "All Locker rows for this member with status == ASSIGNED -> RELEASED"
          - "If subscription was ACTIVE/SUSPENDED on a MONTHLY tier: compute CHRONOLOGICAL accrual; credit wallet_credit_cents by refund_cents = forward_cents - accrued_cents; append WalletEntry kind=SUBSCRIPTION amount=+refund_cents (omit if refund_cents == 0)"

  # ---- Certification (cyclic: ACTIVE -> EXPIRED -> ACTIVE renewal loop) ----
  - entity: Certification
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /certifications/{id}/refresh-expiry (system re-evaluation against logical clock)"
        actor: StaffInstructor
        preconditions:
          - "Certification.status == ACTIVE"
          - "logical clock now >= expires_at"
        side_effects:
          - "All future Reservation rows (start_at > clock now) on this member+machine_class with occupancy_status IN {HELD, CONFIRMED} and supervision_mode == UNSUPERVISED -> CANCELLED (cascade B step 1)"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /certifications/{id}/renew"
        actor: StaffInstructor
        preconditions:
          - "Certification.status == EXPIRED"
        side_effects:
          - "Set granted_at = clock now; set expires_at = clock now + 365 days"
          - "Recompute readiness_score"

      - from: [ACTIVE, EXPIRED]
        to: REVOKED
        trigger: "POST /certifications/{id}/revoke"
        actor: StaffInstructor
        preconditions: []
        side_effects:
          - "All Reservation rows on this member+machine_class with occupancy_status IN {HELD, CONFIRMED} -> CANCELLED (cascade: refund each wallet hold)"

  # ---- Reservation occupancy dimension (branching + revert) ----
  - entity: Reservation
    field: occupancy_status
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Member
        preconditions:
          - "Member.subscription_status == ACTIVE"
          - "Machine.operational_status == AVAILABLE"
          - "If machine.requires_certification: a Certification on (member, machine.machine_class) with status == ACTIVE exists and certification_id references it"
          - "If supervision_mode == UNSUPERVISED: tier.unsupervised_allowed AND certification.readiness_score >= 0.8 (READINESS_GATE)"
          - "wallet_credit_cents >= estimate_charge_cents (computed FORWARD this transition)"
        side_effects:
          - "Compute estimate_charge_cents via session_charge FORWARD (reserved_minutes basis); set free_minutes_applied"
          - "Debit wallet_credit_cents by estimate_charge_cents; billing_status -> HOLD_PLACED"
          - "Decrement prepaid_minutes_remaining by free_minutes_applied"
          - "Append WalletEntry kind=DEBIT amount=-estimate_charge_cents reservation_id={id}"

      - from: CONFIRMED
        to: HELD
        trigger: "POST /reservations/{id}/release-hold"
        actor: Member
        preconditions:
          - "Reservation.occupancy_status == CONFIRMED"
          - "logical clock now < start_at (cannot release after window opens)"
        side_effects:
          - "Refund wallet_credit_cents by estimate_charge_cents; billing_status -> UNBILLED"
          - "Restore prepaid_minutes_remaining by free_minutes_applied; set free_minutes_applied = 0"
          - "Append WalletEntry kind=REFUND amount=+estimate_charge_cents reservation_id={id}"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: Member
        preconditions:
          - "Reservation.occupancy_status == CONFIRMED"
          - "logical clock now >= start_at"
          - "logical clock now < end_at"
        side_effects:
          - "Set check_in_at = clock now"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /reservations/{id}/check-out"
        actor: Member
        preconditions:
          - "Reservation.occupancy_status == CHECKED_IN"
        side_effects:
          - "Set check_out_at = clock now; compute actual_minutes"
          - "Compute final_charge_cents via session_charge FINAL (actual_minutes basis)"
          - "Reconcile wallet: delta = final_charge_cents - estimate_charge_cents; if delta > 0 debit, if delta < 0 refund; billing_status -> SETTLED"
          - "Append WalletEntry kind=DEBIT or REFUND for the reconciliation delta (omit if delta == 0)"

      - from: [HELD, CONFIRMED]
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "If billing_status == HOLD_PLACED: refund wallet_credit_cents by estimate_charge_cents; restore prepaid_minutes_remaining by free_minutes_applied; billing_status -> REFUNDED"
          - "Append WalletEntry kind=REFUND amount=+estimate_charge_cents reservation_id={id} (only when a hold existed)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reservations/{id}/mark-no-show"
        actor: StaffInstructor
        preconditions:
          - "Reservation.occupancy_status == CONFIRMED"
          - "logical clock now >= end_at"
        side_effects:
          - "Forfeit the hold: billing_status -> SETTLED (no refund); estimate stands as final_charge_cents = estimate_charge_cents"

  # ---- Locker (linear with release) ----
  - entity: Locker
    field: status
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /lockers/{id}/release"
        actor: Member
        preconditions:
          - "Locker.status == ASSIGNED"
        side_effects:
          - "If overage_fee_cents > 0: debit wallet_credit_cents by overage_fee_cents; append WalletEntry kind=OVERAGE amount=-overage_fee_cents"
          - "Set used_liters = 0"

  # ---- MaterialPurchase (linear) ----
  - entity: MaterialPurchase
    field: status
    initial_state: DRAFT
    terminal_states: [BILLED, VOIDED]
    transitions:
      - from: DRAFT
        to: BILLED
        trigger: "POST /material-purchases/{id}/bill"
        actor: Member
        preconditions:
          - "MaterialPurchase.status == DRAFT"
          - "Every line's MaterialItem.stock_qty >= line.quantity"
          - "Member.wallet_credit_cents >= total_cents (computed this transition)"
        side_effects:
          - "Recompute subtotal_cents, surcharge_cents, total_cents via material_billing"
          - "Decrement each MaterialItem.stock_qty by line.quantity (cascade C: purchase bill -> item stock debit)"
          - "Debit wallet_credit_cents by total_cents; append WalletEntry kind=MATERIAL amount=-total_cents"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /material-purchases/{id}/void"
        actor: Member
        preconditions:
          - "MaterialPurchase.status == DRAFT"
        side_effects: []

  # ---- Workshop (branching lifecycle) ----
  - entity: Workshop
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (enrolled_count reaches capacity on enrollment create)"
        actor: system
        preconditions:
          - "enrolled_count == capacity after a new enrollment"
        side_effects:
          - "Further enrollment attempts rejected with ERR_WORKSHOP_FULL"

      - from: FULL
        to: OPEN
        trigger: "system (enrolled_count drops below capacity on WITHDRAWN)"
        actor: system
        preconditions:
          - "enrolled_count < capacity after a withdrawal"
        side_effects: []

      - from: [OPEN, FULL]
        to: RUNNING
        trigger: "POST /workshops/{id}/start"
        actor: StaffInstructor
        preconditions:
          - "logical clock now >= starts_at"
          - "Workshop.status IN {OPEN, FULL}"
        side_effects: []

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /workshops/{id}/complete"
        actor: StaffInstructor
        preconditions:
          - "Workshop.status == RUNNING"
        side_effects:
          - "Every enrollment still in ENROLLED -> NO_SHOW (cascade D step 1: workshop complete -> enrollment auto-resolve)"

      - from: [OPEN, FULL]
        to: CANCELLED
        trigger: "POST /workshops/{id}/cancel"
        actor: StaffInstructor
        preconditions: []
        side_effects:
          - "Every enrollment in {ENROLLED} -> WITHDRAWN"

  # ---- WorkshopEnrollment (branching: ENROLLED -> {ATTENDED, NO_SHOW, WITHDRAWN}) ----
  - entity: WorkshopEnrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /workshop-enrollments/{id}/mark-attended"
        actor: StaffInstructor
        preconditions:
          - "WorkshopEnrollment.status == ENROLLED"
          - "Parent Workshop.status == RUNNING"
        side_effects:
          - "If Workshop.machine_class is not null: mint a Certification (cascade D variant: ATTENDED -> Certification grant) for (member, machine_class), status=ACTIVE, granted_at=clock now, expires_at=now+365d, orientation_complete=true; set enrollment.certification_id"

      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /workshop-enrollments/{id}/mark-no-show or system (workshop complete)"
        actor: StaffInstructor
        preconditions:
          - "WorkshopEnrollment.status == ENROLLED"
        side_effects: []

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /workshop-enrollments/{id}/withdraw"
        actor: Member
        preconditions:
          - "WorkshopEnrollment.status == ENROLLED"
          - "Parent Workshop.status IN {OPEN, FULL}"
        side_effects:
          - "Decrement parent Workshop.enrolled_count; if Workshop.status == FULL and enrolled_count < capacity -> Workshop.status = OPEN (bubble up)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: locker-overage-stale-tier
    parent_entity: Member
    write_endpoint: "POST /lockers"
    occ_field: "expected_member_version"
    description: |
      Assigning a new Locker against a Member whose version has advanced since the
      client last observed it is rejected. A locker's overage is keyed to the
      member's current tier.locker_free_liters; if the member was re-tiered (a
      mutation that bumps Member.version) after the client read the member, the
      client's view of the free-liter quota is stale and the locker assignment
      must be re-derived against the current tier rather than the observed one.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reservation-confirm-stale-member
    parent_entity: Member
    write_endpoint: "POST /reservations/{id}/confirm"
    occ_field: "expected_member_version"
    description: |
      Confirming a Reservation against a Member whose version has advanced since
      the client last observed it is rejected. Confirm debits the member's wallet
      and prepaid minutes; another writer's wallet-affecting action (top-up,
      another confirm, a refund) bumps Member.version, so a stale expected version
      means the client computed affordability against an outdated balance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Calc 1: machine session charge (DUAL VARIANT: forward estimate vs final) ----
  - name: session_charge
    trigger: "Reservation HELD->CONFIRMED (estimate), CHECKED_IN->COMPLETED (final), CONFIRMED->NO_SHOW (forfeit)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned; rounding occurs EXACTLY ONCE, after the discount.
      basis_minutes  = reserved_minutes        (FORWARD/estimate variant)
                     = actual_minutes          (FINAL variant)
      billable_minutes = max(basis_minutes, machine.min_billing_minutes)
      free_minutes     = min(billable_minutes, member.prepaid_minutes_remaining)   # prepaid block
      charged_minutes  = billable_minutes - free_minutes
      time_charge_raw  = charged_minutes * machine.hourly_rate_cents / 60          # exact rational
      time_after_disc  = time_charge_raw * (10000 - tier.discount_bps) / 10000     # discount on TIME only
      time_charge_cents = round_half_up(time_after_disc)                            # ROUND ONCE here
      session_charge_cents = time_charge_cents + machine.setup_fee_cents            # setup not discounted
    input_set: "Single Reservation + its Machine + the member's MembershipTier + member.prepaid_minutes_remaining"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "round_half_up to whole cents, applied once to time_after_disc; setup_fee added after rounding"
    variants:
      - name: forward_estimate
        when: "HELD->CONFIRMED; basis_minutes = reserved_minutes (the booked window)"
        difference: "Uses the reserved window length; written to estimate_charge_cents and held against wallet"
      - name: final_actual
        when: "CHECKED_IN->COMPLETED; basis_minutes = actual_minutes (check_in..check_out)"
        difference: "Uses real occupancy; written to final_charge_cents; wallet reconciled by (final - estimate) delta"

  # ---- Calc 2: material consumable billing (combinatorial mode (b): nested rounding order) ----
  - name: material_billing
    trigger: "MaterialPurchase DRAFT->BILLED"
    algorithm: aggregation
    formula: |
      # PINNED ORDER — round PER LINE first, then sum, then surcharge, then round surcharge once.
      for each line {material_item_id, quantity}:
        raw_line   = quantity * MaterialItem.unit_price_cents
        disc_line  = raw_line * (10000 - tier.discount_bps) / 10000
        line_cents = round_half_up(disc_line)            # ROUND PER LINE
      subtotal_cents  = sum(line_cents over all lines)
      surcharge_cents = round_half_up(subtotal_cents * waste_surcharge_bps / 10000)
      total_cents     = subtotal_cents + surcharge_cents
    input_set: "All lines of one MaterialPurchase + each line's MaterialItem.unit_price_cents + buyer tier.discount_bps"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "round_half_up per line, then round_half_up the surcharge; sum-then-round is explicitly NOT used"

  # ---- Calc 3: membership proration (DUAL VARIANT: forward vs chronological; different entity domain) ----
  - name: membership_proration
    trigger: "Member PENDING_WAIVER->ACTIVE (forward, debit at activation); Member ACTIVE/SUSPENDED->CANCELLED (chronological, refund accounting at cancel)"
    algorithm: forward_looking
    formula: |
      CYCLE_DAYS = 30
      # The cycle is anchored to the member: activation opens a fresh 30-day cycle.
      elapsed_days(now) = floor((now - cycle_start_at) / 1 day)     # whole days since cycle opened, >= 0
      FORWARD (charged once at activation, projects the whole upcoming cycle):
        forward_cents = round_half_up(tier.monthly_fee_cents * CYCLE_DAYS / CYCLE_DAYS)
                      = tier.monthly_fee_cents                       # full month projected up front
      CHRONOLOGICAL (computed at cancel, charges only the days actually elapsed, capped at CYCLE_DAYS):
        used_days   = min(elapsed_days(clock now), CYCLE_DAYS)
        accrued_cents = round_half_up(tier.monthly_fee_cents * used_days / CYCLE_DAYS)
        refund_cents  = forward_cents - accrued_cents                # credited back to wallet on cancel
    input_set: "One Member, its tier.monthly_fee_cents, cycle_start_at, logical clock now"
    constants:
      CYCLE_DAYS: 30
    precision: "round_half_up to whole cents; FORWARD projects the full cycle once at activation; CHRONOLOGICAL rounds the elapsed-day fraction once at cancel"
    variants:
      - name: forward_proration
        when: "Activation; debits the full monthly fee for the upcoming 30-day cycle regardless of how long the member stays"
        difference: "Projects the entire cycle up front (forward_cents = full monthly_fee_cents); blind to early cancellation"
      - name: chronological_accrual
        when: "Cancel; charges only the days elapsed since cycle_start_at and refunds the unused remainder"
        difference: "Bills used_days/30 of the fee; diverges from FORWARD by exactly the refund whenever a member cancels before day 30"

  # ---- Calc 4: certification readiness (weighted_scoring; gates UNSUPERVISED) ----
  - name: certification_readiness
    trigger: "Certification create, renew, refresh-expiry; read on Reservation confirm READINESS_GATE"
    algorithm: weighted_scoring
    formula: |
      cert_weight        = 0.5 if Certification.status == ACTIVE else 0.0
      orientation_weight = 0.2 if Certification.orientation_complete else 0.0
      supervised_ratio   = min(supervised_minutes / required_supervised_minutes, 1.0)   # 0 if required == 0
      supervised_weight  = 0.3 * supervised_ratio
      readiness_score    = round(cert_weight + orientation_weight + supervised_weight, 4)
      # READINESS_GATE for UNSUPERVISED reservation: readiness_score >= 0.8 (>=, not >)
    input_set: "One Certification row (status, orientation_complete, supervised_minutes, required_supervised_minutes)"
    constants:
      W_CERT: 0.5
      W_ORIENTATION: 0.2
      W_SUPERVISED: 0.3
      READINESS_GATE: 0.8
    precision: "score rounded to 4 decimal places; gate comparison is >= READINESS_GATE"

  # ---- Calc 5: locker overage (threshold) ----
  - name: locker_overage
    trigger: "Locker create/update used_liters; Locker ASSIGNED->RELEASED"
    algorithm: threshold
    formula: |
      free = member.tier.locker_free_liters
      overage_liters = max(0, used_liters - free)
      overage_fee_cents = overage_liters * OVERAGE_RATE_CENTS_PER_LITER
      # Boundary: used_liters == free -> 0; used_liters == free + 1 -> one liter charged
    input_set: "One Locker + holder Member's tier.locker_free_liters"
    constants:
      OVERAGE_RATE_CENTS_PER_LITER: 30
    precision: "integer cents; no rounding needed"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of {Member, StaffInstructor, FacilityAdmin}; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed roles act only on their own resources"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: existence
    check: "Every path id and every FK in the body resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, end_at > start_at, quantity >= 1, lines non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT/PATCH"

  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version on guarded writes equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lockers, POST /reservations/{id}/confirm"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2 from/preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Waiver signed (waiver_signed_at not null) before member may activate or any reservation is confirmed"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 409
    applies_to: "POST /members/{id}/activate, POST /reservations/{id}/confirm"

  - priority: 8
    category: business_safety
    check: "Machine requiring certification: an ACTIVE Certification on (member, machine_class) exists and is referenced"
    error_id: ERR_CERTIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 9
    category: business_safety
    check: "UNSUPERVISED reservation: tier.unsupervised_allowed AND certification.readiness_score >= 0.8 (READINESS_GATE)"
    error_id: ERR_READINESS_NOT_MET
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "Reserved window does not collide with another non-terminal reservation on the same machine, per that machine's interval semantics (bare half-open if cooldown_minutes==0, else dilated by cooldown_minutes)"
    error_id: ERR_RESERVATION_OVERLAP
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "Day-pass purchases in the rolling 30-day window must not exceed MAX_DAYPASSES_PER_WINDOW (3); the 4th is blocked"
    error_id: ERR_CONVERT_TO_MONTHLY
    http_status: 409
    applies_to: "POST /members/{id}/buy-daypass"

  - priority: 12
    category: business_constraint
    check: "Workshop has an open seat (enrolled_count < capacity) for a new enrollment"
    error_id: ERR_WORKSHOP_FULL
    http_status: 409
    applies_to: "POST /workshop-enrollments"

  - priority: 13
    category: business_constraint
    check: "Material lines do not exceed on-hand MaterialItem.stock_qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /material-purchases/{id}/bill"

  - priority: 14
    category: business_fiscal
    check: "Member wallet_credit_cents covers the charge (estimate / proration / material total / overage)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 409
    applies_to: "POST /members/{id}/activate, POST /reservations/{id}/confirm, POST /material-purchases/{id}/bill"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [FacilityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: datetime }"
    side_effects: ["Logical clock advanced to to_iso8601 for all subsequent deadline/expiry/window rules"]

  # ---- MembershipTier (configuration) ----
  - method: POST
    path: "/membership-tiers"
    description: "Create a membership tier"
    roles: [FacilityAdmin]
    code: 201
    input: [code, name, billing_mode, "monthly_fee_cents?", "daypass_fee_cents?", "discount_bps?", "prepaid_machine_minutes?", "locker_free_liters?", "unsupervised_allowed?"]
    output: MembershipTier
    side_effects: ["version=1"]

  - method: GET
    path: "/membership-tiers/{id}"
    description: "Get a membership tier"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: MembershipTier
    side_effects: []

  - method: GET
    path: "/membership-tiers"
    description: "List membership tiers"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MembershipTier[]
    side_effects: []

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Register a member (anonymous/self-service); starts PENDING_WAIVER"
    roles: [Member, FacilityAdmin]
    code: 201
    input: [email, full_name, tier_id]
    output: Member
    side_effects: ["subscription_status=PENDING_WAIVER, wallet_credit_cents=0, prepaid_minutes_remaining=0, version=1"]

  - method: GET
    path: "/members/{id}"
    description: "Get a member"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members (filterable by tier_id for FK reverse-reachability)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 200
    input: ["tier_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{id}/sign-waiver"
    description: "Sign the safety/liability waiver"
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: ["Set waiver_signed_at = clock now"]

  - method: POST
    path: "/members/{id}/topup"
    description: "Top up wallet credit (prepaid)"
    roles: [Member, FacilityAdmin]
    code: 200
    input: [amount_cents]
    output: Member
    side_effects: ["Increment wallet_credit_cents; append WalletEntry kind=TOPUP"]

  - method: POST
    path: "/members/{id}/activate"
    description: "Activate subscription (PENDING_WAIVER/SUSPENDED -> ACTIVE)"
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: ["Set cycle_start_at; reset prepaid_minutes_remaining; MONTHLY: debit FORWARD prorated fee + WalletEntry kind=SUBSCRIPTION"]

  - method: POST
    path: "/members/{id}/suspend"
    description: "Suspend a member (ACTIVE -> SUSPENDED)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["Cascade A: cancel member's HELD/CONFIRMED reservations, refunding each hold"]

  - method: POST
    path: "/members/{id}/cancel"
    description: "Cancel membership"
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: ["subscription_status=CANCELLED; cancel non-terminal reservations (refund holds); release ASSIGNED lockers"]

  - method: POST
    path: "/members/{id}/buy-daypass"
    description: "Buy a day-pass (rolling-window threshold)"
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: ["Increment daypass_count_window; debit wallet by tier.daypass_fee_cents; append WalletEntry kind=DAYPASS"]

  - method: POST
    path: "/members/{id}/roll-cycle"
    description: "Advance the member's billing cycle (reset prepaid minutes and day-pass window); operator/cron surface"
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["Set cycle_start_at = clock now; reset prepaid_minutes_remaining = tier.prepaid_machine_minutes; reset daypass_count_window = 0"]

  - method: GET
    path: "/wallet-entries/{id}"
    description: "Get a single wallet ledger entry"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: WalletEntry
    side_effects: []

  - method: GET
    path: "/wallet-entries"
    description: "List wallet ledger entries (filter by member_id and/or reservation_id for FK reverse-reachability)"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["member_id?", "reservation_id?", "limit?", "offset?"]
    output: WalletEntry[]
    side_effects: []

  # ---- Machine (configuration) ----
  - method: POST
    path: "/machines"
    description: "Create a machine"
    roles: [FacilityAdmin]
    code: 201
    input: [name, machine_class, hourly_rate_cents, "setup_fee_cents?", "min_billing_minutes?", "cooldown_minutes?", "requires_certification?"]
    output: Machine
    side_effects: ["operational_status=AVAILABLE, version=1"]

  - method: GET
    path: "/machines/{id}"
    description: "Get a machine"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Machine
    side_effects: []

  - method: GET
    path: "/machines"
    description: "List machines"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["machine_class?", "limit?", "offset?"]
    output: Machine[]
    side_effects: []

  - method: POST
    path: "/machines/{id}/set-status"
    description: "Set machine operational status (AVAILABLE/OUT_OF_SERVICE)"
    roles: [FacilityAdmin]
    code: 200
    input: [operational_status]
    output: Machine
    side_effects: []

  # ---- Certification ----
  - method: POST
    path: "/certifications"
    description: "Grant a certification directly (staff path; workshop ATTENDED also mints one)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 201
    input: [member_id, machine_class, "orientation_complete?", "supervised_minutes?", "required_supervised_minutes?"]
    output: Certification
    side_effects: ["status=ACTIVE, granted_at=clock now, expires_at=now+365d, compute readiness_score, version=1"]

  - method: GET
    path: "/certifications/{id}"
    description: "Get a certification"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/certifications"
    description: "List certifications (filter by member_id for FK reverse-reachability)"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["member_id?", "machine_class?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  - method: POST
    path: "/certifications/{id}/refresh-expiry"
    description: "Re-evaluate expiry against the logical clock (ACTIVE -> EXPIRED if lapsed)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["Cascade B step 1: cancel future UNSUPERVISED HELD/CONFIRMED reservations on this member+class"]

  - method: POST
    path: "/certifications/{id}/renew"
    description: "Renew an expired certification (EXPIRED -> ACTIVE)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["Set granted_at, expires_at = now+365d; recompute readiness_score"]

  - method: POST
    path: "/certifications/{id}/revoke"
    description: "Revoke a certification (-> REVOKED)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Certification
    side_effects: ["Cancel HELD/CONFIRMED reservations on this member+class (refund holds)"]

  # ---- Reservation ----
  - method: POST
    path: "/reservations"
    description: "Create a reservation (HELD); validates overlap and certification reference"
    roles: [Member]
    code: 201
    input: [member_id, machine_id, "certification_id?", start_at, end_at, supervision_mode]
    output: Reservation
    side_effects: ["occupancy_status=HELD, billing_status=UNBILLED, compute reserved_minutes, version=1"]

  - method: GET
    path: "/reservations/{id}"
    description: "Get a reservation"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "List reservations (filter by member_id, machine_id, or certification_id for FK reverse-reachability)"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["member_id?", "machine_id?", "certification_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Confirm a HELD reservation; computes FORWARD estimate and holds wallet"
    roles: [Member]
    code: 200
    input: [expected_member_version]
    output: Reservation
    side_effects: ["Compute estimate_charge_cents (forward); debit wallet; HOLD_PLACED; decrement prepaid_minutes_remaining; increments Member.version by 1; WalletEntry kind=DEBIT"]

  - method: POST
    path: "/reservations/{id}/release-hold"
    description: "Release a hold (CONFIRMED -> HELD) before the window opens; refunds estimate"
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Refund wallet by estimate; restore prepaid minutes; billing_status=UNBILLED; WalletEntry kind=REFUND"]

  - method: POST
    path: "/reservations/{id}/check-in"
    description: "Check in (CONFIRMED -> CHECKED_IN) within the window"
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Set check_in_at"]

  - method: POST
    path: "/reservations/{id}/check-out"
    description: "Check out (CHECKED_IN -> COMPLETED); computes FINAL charge and reconciles wallet"
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Compute final_charge_cents; reconcile wallet by (final - estimate) delta; billing_status=SETTLED; WalletEntry for delta"]

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a HELD/CONFIRMED reservation; refunds any hold"
    roles: [Member]
    code: 200
    input: []
    output: Reservation
    side_effects: ["occupancy_status=CANCELLED; refund hold if HOLD_PLACED; billing_status=REFUNDED; WalletEntry kind=REFUND"]

  - method: POST
    path: "/reservations/{id}/mark-no-show"
    description: "Mark a confirmed reservation as no-show after its window (forfeits hold)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: ["occupancy_status=NO_SHOW; billing_status=SETTLED; final_charge_cents=estimate_charge_cents; no refund"]

  # ---- Locker ----
  - method: POST
    path: "/lockers"
    description: "Assign a project locker to a member (OCC-guarded on member.version)"
    roles: [Member, FacilityAdmin]
    code: 201
    input: [member_id, label, capacity_liters, "used_liters?", expected_member_version]
    output: Locker
    side_effects: ["status=ASSIGNED; compute overage_fee_cents; increments Member.version by 1; version=1"]

  - method: GET
    path: "/lockers/{id}"
    description: "Get a locker"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Locker
    side_effects: []

  - method: GET
    path: "/lockers"
    description: "List lockers (filter by member_id for FK reverse-reachability)"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Locker[]
    side_effects: []

  - method: PATCH
    path: "/lockers/{id}"
    description: "Update locker stored volume (recomputes overage)"
    roles: [Member]
    code: 200
    input: ["used_liters?"]
    output: Locker
    side_effects: ["Recompute overage_fee_cents"]

  - method: POST
    path: "/lockers/{id}/release"
    description: "Release a locker (ASSIGNED -> RELEASED); bills outstanding overage"
    roles: [Member]
    code: 200
    input: []
    output: Locker
    side_effects: ["status=RELEASED; if overage_fee_cents>0 debit wallet + WalletEntry kind=OVERAGE; used_liters=0"]

  # ---- MaterialItem (configuration) ----
  - method: POST
    path: "/material-items"
    description: "Create a material catalog item"
    roles: [FacilityAdmin]
    code: 201
    input: [sku, name, unit_price_cents, "stock_qty?"]
    output: MaterialItem
    side_effects: ["version=1"]

  - method: GET
    path: "/material-items/{id}"
    description: "Get a material item"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: MaterialItem
    side_effects: []

  - method: GET
    path: "/material-items"
    description: "List material items"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: MaterialItem[]
    side_effects: []

  # ---- MaterialPurchase ----
  - method: POST
    path: "/material-purchases"
    description: "Create a DRAFT material purchase"
    roles: [Member]
    code: 201
    input: [member_id, lines, "waste_surcharge_bps?"]
    output: MaterialPurchase
    side_effects: ["status=DRAFT; compute subtotal/surcharge/total; version=1"]

  - method: GET
    path: "/material-purchases/{id}"
    description: "Get a material purchase"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: MaterialPurchase
    side_effects: []

  - method: GET
    path: "/material-purchases"
    description: "List material purchases (filter by member_id for FK reverse-reachability)"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: MaterialPurchase[]
    side_effects: []

  - method: POST
    path: "/material-purchases/{id}/bill"
    description: "Bill a DRAFT purchase: debit wallet, decrement stock (cascade C)"
    roles: [Member]
    code: 200
    input: []
    output: MaterialPurchase
    side_effects: ["status=BILLED; recompute totals; decrement MaterialItem.stock_qty per line; debit wallet; WalletEntry kind=MATERIAL"]

  - method: POST
    path: "/material-purchases/{id}/void"
    description: "Void a DRAFT purchase"
    roles: [Member]
    code: 200
    input: []
    output: MaterialPurchase
    side_effects: ["status=VOIDED"]

  # ---- Workshop ----
  - method: POST
    path: "/workshops"
    description: "Create a workshop/class"
    roles: [StaffInstructor, FacilityAdmin]
    code: 201
    input: [title, "machine_class?", instructor_id, starts_at, capacity]
    output: Workshop
    side_effects: ["status=OPEN, enrolled_count=0, version=1"]

  - method: GET
    path: "/workshops/{id}"
    description: "Get a workshop"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Workshop
    side_effects: []

  - method: GET
    path: "/workshops"
    description: "List workshops (filter by instructor_id for FK reverse-reachability)"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["instructor_id?", "machine_class?", "limit?", "offset?"]
    output: Workshop[]
    side_effects: []

  - method: POST
    path: "/workshops/{id}/start"
    description: "Start a workshop (OPEN/FULL -> RUNNING)"
    roles: [StaffInstructor]
    code: 200
    input: []
    output: Workshop
    side_effects: []

  - method: POST
    path: "/workshops/{id}/complete"
    description: "Complete a workshop (RUNNING -> COMPLETED); cascade D resolves ENROLLED to NO_SHOW"
    roles: [StaffInstructor]
    code: 200
    input: []
    output: Workshop
    side_effects: ["status=COMPLETED; remaining ENROLLED enrollments -> NO_SHOW"]

  - method: POST
    path: "/workshops/{id}/cancel"
    description: "Cancel a workshop (OPEN/FULL -> CANCELLED)"
    roles: [StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: Workshop
    side_effects: ["status=CANCELLED; ENROLLED enrollments -> WITHDRAWN"]

  # ---- WorkshopEnrollment ----
  - method: POST
    path: "/workshop-enrollments"
    description: "Enroll a member in a workshop (seat check; may auto-transition workshop to FULL)"
    roles: [Member]
    code: 201
    input: [workshop_id, member_id]
    output: WorkshopEnrollment
    side_effects: ["status=ENROLLED; increment Workshop.enrolled_count; if ==capacity -> Workshop FULL; version=1"]

  - method: GET
    path: "/workshop-enrollments/{id}"
    description: "Get an enrollment"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: []
    output: WorkshopEnrollment
    side_effects: []

  - method: GET
    path: "/workshop-enrollments"
    description: "List enrollments (filter by workshop_id, member_id, or certification_id for FK reverse-reachability)"
    roles: [Member, StaffInstructor, FacilityAdmin]
    code: 200
    input: ["workshop_id?", "member_id?", "certification_id?", "limit?", "offset?"]
    output: WorkshopEnrollment[]
    side_effects: []

  - method: POST
    path: "/workshop-enrollments/{id}/mark-attended"
    description: "Mark attended (ENROLLED -> ATTENDED); mints a Certification for certifying workshops (cascade D variant)"
    roles: [StaffInstructor]
    code: 200
    input: []
    output: WorkshopEnrollment
    side_effects: ["status=ATTENDED; mint Certification if workshop.machine_class set; set certification_id"]

  - method: POST
    path: "/workshop-enrollments/{id}/mark-no-show"
    description: "Mark no-show (ENROLLED -> NO_SHOW)"
    roles: [StaffInstructor]
    code: 200
    input: []
    output: WorkshopEnrollment
    side_effects: ["status=NO_SHOW"]

  - method: POST
    path: "/workshop-enrollments/{id}/withdraw"
    description: "Withdraw (ENROLLED -> WITHDRAWN); frees a seat (bubble up to OPEN)"
    roles: [Member]
    code: 200
    input: []
    output: WorkshopEnrollment
    side_effects: ["status=WITHDRAWN; decrement Workshop.enrolled_count; FULL->OPEN if below capacity"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted, or entity-backed role acting on another member's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, end_at <= start_at, quantity < 1, empty lines" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_WAIVER_REQUIRED, http: 409, condition: "Member has not signed the safety waiver (waiver_signed_at is null)" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 409, condition: "Machine requires certification but no referenced ACTIVE certification on (member, machine_class)" }
  - { id: ERR_READINESS_NOT_MET, http: 409, condition: "UNSUPERVISED reservation blocked: tier disallows it or readiness_score < 0.8" }
  - { id: ERR_RESERVATION_OVERLAP, http: 409, condition: "Reserved window collides with another non-terminal reservation under the machine's interval semantics" }
  - { id: ERR_CONVERT_TO_MONTHLY, http: 409, condition: "Day-pass purchase would exceed 3 in the rolling 30-day window; convert to monthly" }
  - { id: ERR_WORKSHOP_FULL, http: 409, condition: "Workshop enrolled_count == capacity; no open seat" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Material line quantity exceeds MaterialItem.stock_qty" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 409, condition: "Member wallet_credit_cents below the required charge" }
  - { id: ERR_MACHINE_OUT_OF_SERVICE, http: 409, condition: "Machine.operational_status == OUT_OF_SERVICE on confirm" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Member already has a non-terminal enrollment in this workshop" }
  - { id: ERR_DUPLICATE_TIER_CODE, http: 409, condition: "MembershipTier.code already exists" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "MaterialItem.sku already exists" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Check-in attempted before start_at or after end_at" }
  - { id: ERR_VALIDATION_LIMIT, http: 400, condition: "Pagination limit/offset outside [1,100]/[0,inf)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A makerspace member acting on their own subscription, reservations, lockers, purchases, and enrollments."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/sign-waiver"
      - "POST /members/{id}/activate"
      - "POST /members/{id}/cancel"
      - "POST /members/{id}/buy-daypass"
      - "POST /reservations"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/release-hold"
      - "POST /reservations/{id}/check-in"
      - "POST /reservations/{id}/check-out"
      - "POST /reservations/{id}/cancel"
      - "PATCH /lockers/{id}"
      - "POST /lockers/{id}/release"
      - "POST /material-purchases"
      - "POST /material-purchases/{id}/bill"
      - "POST /material-purchases/{id}/void"
      - "POST /workshop-enrollments"
      - "POST /workshop-enrollments/{id}/withdraw"
    shared_operations:
      - "POST /members (self-register; also FacilityAdmin)"
      - "POST /members/{id}/topup (also FacilityAdmin)"
      - "POST /lockers (own; also FacilityAdmin)"
      - "GET endpoints on own/visible resources"

  - name: StaffInstructor
    description: "Staff who run certifications and workshops, supervise sessions, suspend members, and resolve no-shows."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/suspend"
      - "POST /certifications"
      - "POST /certifications/{id}/refresh-expiry"
      - "POST /certifications/{id}/renew"
      - "POST /certifications/{id}/revoke"
      - "POST /reservations/{id}/mark-no-show"
      - "POST /workshops"
      - "POST /workshops/{id}/start"
      - "POST /workshops/{id}/complete"
      - "POST /workshops/{id}/cancel"
      - "POST /workshop-enrollments/{id}/mark-attended"
      - "POST /workshop-enrollments/{id}/mark-no-show"
    shared_operations:
      - "GET endpoints (read-only across resources)"

  - name: FacilityAdmin
    description: "Operator who configures tiers, machines, material catalog, advances the logical clock, rolls billing cycles, and may register members/lockers."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /membership-tiers"
      - "POST /machines"
      - "POST /machines/{id}/set-status"
      - "POST /material-items"
      - "POST /members/{id}/roll-cycle"
    shared_operations:
      - "POST /members (also Member)"
      - "POST /members/{id}/topup (also Member)"
      - "POST /lockers (also Member)"
      - "POST /members/{id}/suspend (also StaffInstructor)"
      - "POST /certifications and certification lifecycle (also StaffInstructor)"
      - "POST /workshops, /workshops/{id}/cancel (also StaffInstructor)"
      - "GET endpoints (read-only across resources)"
