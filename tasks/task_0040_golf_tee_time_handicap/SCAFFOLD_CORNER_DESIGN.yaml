  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_booking_write
        claim_type: optimistic_concurrency
        grounds: [entities.TeeTime.fields.version, "concurrency_rules[booking-create-stale-teetime]"]
        distinguishing_aspect: "Each successful booking on a slot increments TeeTime.version by exactly 1 (v0 -> v0+1)."
        test_recipe:
          setup: ["FOURSOME slot at version 1; one booking. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "VerCrs", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
