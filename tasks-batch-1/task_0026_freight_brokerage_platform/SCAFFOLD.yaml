scenario: |
  Freight Brokerage Platform: shipper quote request, carrier qualification (MC#/USDOT),
  Spot/Contract rates, Detention/Accessorial, factoring financing, dispute claims,
  SmartWay compliance.

domain_name: freight-brokerage-platform
api_prefix: /freight

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Shipper
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered company name of the shipper.
      - name: billing_email
        type: string
        source: input
        description: Primary AP contact email.
      - name: credit_limit_cents
        type: integer
        source: input
        description: Total open invoice exposure the broker will extend in cents.
        constraints: ">= 0"
      - name: open_ar_cents
        type: integer
        source: computed
        description: Current open accounts-receivable in cents; sum of Invoice.total_cents where Invoice.status IN {ISSUED, PARTIALLY_PAID}.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the shipper.
        constraints: "values: {ACTIVE, ON_HOLD}"
        default: ACTIVE

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered DBA of the carrier.
      - name: mc_number
        type: string
        source: input
        description: FMCSA Motor Carrier number (6-7 digit numeric string).
        constraints: "^[0-9]{6,7}$; unique across Carrier rows"
      - name: usdot_number
        type: string
        source: input
        description: USDOT registration number (5-8 digit numeric string).
        constraints: "^[0-9]{5,8}$; unique across Carrier rows"
      - name: smartway_tier
        type: enum
        source: input
        description: EPA SmartWay tier reported by carrier.
        constraints: "values: {NONE, BRONZE, SILVER, GOLD}"
        default: NONE
      - name: insurance_expiry_utc
        type: datetime
        source: input
        description: ISO 8601 UTC timestamp when liability insurance expires.
      - name: qualification_status
        type: enum
        source: system
        description: Result of MC#/USDOT/insurance review.
        constraints: "values: {PENDING, QUALIFIED, REJECTED, SUSPENDED}"
        default: PENDING
      - name: safety_score
        type: number
        source: input
        description: FMCSA SMS safety score 0.0-100.0 (lower is safer).
        constraints: "0.0 <= safety_score <= 100.0"
      - name: rejection_reason_code
        type: enum
        source: system
        description: Set when qualification_status transitions to REJECTED.
        constraints: "values: {NULL, BAD_MC, BAD_USDOT, INSURANCE_EXPIRED, SAFETY_OVER_THRESHOLD}"
        default: null

  - name: ContractRate
    parent: null
    common_fields: true
    fields:
      - name: shipper_id
        type: string
        source: input
        description: FK -> Shipper.id; the shipper this contract covers.
      - name: lane_origin
        type: string
        source: input
        description: Origin postal region code (5-digit US ZIP).
        constraints: "^[0-9]{5}$"
      - name: lane_destination
        type: string
        source: input
        description: Destination postal region code (5-digit US ZIP).
        constraints: "^[0-9]{5}$"
      - name: rate_per_mile_cents
        type: integer
        source: input
        description: All-in linehaul rate per mile in cents.
        constraints: "> 0"
      - name: fuel_surcharge_per_mile_cents
        type: integer
        source: input
        description: Fuel adjustment per mile in cents added on top of linehaul.
        constraints: ">= 0"
      - name: detention_free_minutes
        type: integer
        source: input
        description: Free detention window per stop (minutes) before billing.
        constraints: ">= 0"
      - name: detention_rate_per_hour_cents
        type: integer
        source: input
        description: Detention charge per hour after free window.
        constraints: ">= 0"
      - name: effective_from_utc
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC start of contract.
      - name: effective_until_utc
        type: datetime
        source: input
        description: Exclusive ISO 8601 UTC end of contract.
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the contract.
        constraints: "values: {DRAFT, ACTIVE, EXPIRED, TERMINATED}"
        default: DRAFT

  - name: QuoteRequest
    parent: null
    common_fields: true
    fields:
      - name: shipper_id
        type: string
        source: input
        description: FK -> Shipper.id; the shipper requesting the quote.
      - name: lane_origin
        type: string
        source: input
        description: Origin 5-digit ZIP.
        constraints: "^[0-9]{5}$"
      - name: lane_destination
        type: string
        source: input
        description: Destination 5-digit ZIP.
        constraints: "^[0-9]{5}$"
      - name: distance_miles
        type: integer
        source: input
        description: Pre-computed road distance in whole miles.
        constraints: "> 0"
      - name: pickup_window_start_utc
        type: datetime
        source: input
        description: Inclusive ISO 8601 UTC pickup window start.
      - name: pickup_window_end_utc
        type: datetime
        source: input
        description: Exclusive ISO 8601 UTC pickup window end.
      - name: requested_equipment
        type: enum
        source: input
        description: Trailer equipment type.
        constraints: "values: {DRY_VAN, REEFER, FLATBED}"
      - name: requires_smartway
        type: boolean
        source: input
        description: When true, only carriers with smartway_tier in {BRONZE, SILVER, GOLD} are eligible to be awarded.
        default: false
      - name: rate_mode
        type: enum
        source: computed
        description: How the offered rate was derived; SPOT means no covering ContractRate row found, CONTRACT means rate sourced from a covering ContractRate.
        constraints: "values: {SPOT, CONTRACT}"
      - name: contract_rate_id
        type: string
        source: computed
        description: FK -> ContractRate.id; populated only when rate_mode == CONTRACT; the version of the contract pinned at quote time.
        default: null
      - name: contract_rate_version
        type: integer
        source: computed
        description: Snapshot of ContractRate.version at quote-create time; used for version-pinning checks on award.
        default: null
      - name: quoted_total_cents
        type: integer
        source: computed
        description: All-in rate quoted to the shipper in cents at create time.
      - name: status
        type: enum
        source: system
        description: Quote lifecycle state.
        constraints: "values: {OPEN, AWARDED, EXPIRED, WITHDRAWN}"
        default: OPEN
      - name: expires_at_utc
        type: datetime
        source: system
        description: ISO 8601 UTC; set to pickup_window_start_utc on create.

  - name: Load
    parent: null
    common_fields: true
    fields:
      - name: quote_request_id
        type: string
        source: input
        description: FK -> QuoteRequest.id; the awarded quote that produced this load.
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier awarded the load.
      - name: agreed_rate_cents
        type: integer
        source: computed
        description: Final per-load linehaul + fuel rate locked at award time (in cents).
      - name: detention_charge_cents
        type: integer
        source: computed
        description: Accessorial detention charge accrued at delivery (in cents).
        default: 0
      - name: accessorial_total_cents
        type: integer
        source: computed
        description: Sum of all Accessorial.amount_cents on this load.
        default: 0
      - name: pod_received_at_utc
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp Proof-of-Delivery was filed.
        default: null
      - name: actual_pickup_at_utc
        type: datetime
        source: input
        description: ISO 8601 UTC actual pickup arrival timestamp; supplied with /loads/{id}/pickup.
        default: null
      - name: actual_delivery_at_utc
        type: datetime
        source: input
        description: ISO 8601 UTC actual delivery arrival timestamp; supplied with /loads/{id}/deliver.
        default: null
      - name: status
        type: enum
        source: system
        description: Load lifecycle state.
        constraints: "values: {AWARDED, IN_TRANSIT, DELIVERED, INVOICED, CLOSED, CANCELLED}"
        default: AWARDED

  - name: Accessorial
    parent: null
    common_fields: false
    fields:
      - name: load_id
        type: string
        source: input
        description: FK -> Load.id; the load this charge attaches to.
      - name: code
        type: enum
        source: input
        description: Accessorial type code.
        constraints: "values: {LUMPER, TARPS, EXTRA_STOP, REWEIGH, LAYOVER, DETENTION}"
      - name: amount_cents
        type: integer
        source: input
        description: Charge amount in cents.
        constraints: "> 0"
      - name: note
        type: string
        source: input
        description: Free-text description.

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: load_id
        type: string
        source: input
        description: FK -> Load.id; the load being billed.
      - name: total_cents
        type: integer
        source: computed
        description: Sum of agreed_rate_cents + detention_charge_cents + accessorial_total_cents at issue time.
      - name: factored
        type: boolean
        source: system
        description: True iff a FactoringRequest in {APPROVED, ADVANCED} references this invoice.
        default: false
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle.
        constraints: "values: {ISSUED, PARTIALLY_PAID, PAID, DISPUTED, WRITTEN_OFF}"
        default: ISSUED
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Total cash receipts applied to this invoice.
        default: 0

  - name: FactoringRequest
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> Invoice.id; the invoice being factored.
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier requesting the advance.
      - name: factoring_fee_pct
        type: number
        source: input
        description: Discount rate the factor will charge, expressed as percent (e.g., 2.5 means 2.5%).
        constraints: "0.0 < factoring_fee_pct <= 10.0"
      - name: advance_cents
        type: integer
        source: computed
        description: Cash advance after discount = round_half_up(Invoice.total_cents * (1 - factoring_fee_pct/100)).
      - name: status
        type: enum
        source: system
        description: Factoring lifecycle.
        constraints: "values: {REQUESTED, APPROVED, ADVANCED, REJECTED, RECOURSE}"
        default: REQUESTED

  - name: DisputeClaim
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> Invoice.id; the invoice being disputed.
      - name: claim_type
        type: enum
        source: input
        description: Kind of dispute.
        constraints: "values: {OVERCHARGE, DAMAGED_GOODS, LATE_DELIVERY, MISSING_POD}"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Amount the shipper is contesting in cents.
        constraints: "> 0"
      - name: resolution_amount_cents
        type: integer
        source: input
        description: Final adjustment granted to shipper in cents; set on resolve, must be 0 <= resolution_amount_cents <= claimed_amount_cents.
        default: null
      - name: resolution_kind
        type: enum
        source: input
        description: Outcome posted at resolution.
        constraints: "values: {UPHELD, PARTIAL, DENIED}"
        default: null
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle.
        constraints: "values: {OPEN, RESOLVED, WITHDRAWN}"
        default: OPEN

  - name: SmartWayAudit
    parent: null
    common_fields: false
    fields:
      - name: shipper_id
        type: string
        source: input
        description: FK -> Shipper.id; the shipper whose SmartWay quota is being audited for the named quarter.
      - name: quarter_label
        type: string
        source: input
        description: Calendar quarter label such as "2026Q2"; one audit per (shipper_id, quarter_label).
        constraints: "^[0-9]{4}Q[1-4]$"
      - name: total_loads
        type: integer
        source: computed
        description: Count of Load rows belonging to this shipper that delivered during the quarter (status IN {DELIVERED, INVOICED, CLOSED} and actual_delivery_at_utc within quarter).
      - name: smartway_loads
        type: integer
        source: computed
        description: Count of those loads whose carrier had smartway_tier in {BRONZE, SILVER, GOLD} on delivery date.
      - name: smartway_ratio
        type: number
        source: computed
        description: smartway_loads / total_loads, rounded to four decimal places with half-up; zero loads -> ratio 0.
      - name: compliance_status
        type: enum
        source: computed
        description: PASSING when smartway_ratio >= 0.60, AT_RISK when 0.40 <= smartway_ratio < 0.60, FAILING when smartway_ratio < 0.40. Zero-load audits are FAILING.
        constraints: "values: {PASSING, AT_RISK, FAILING}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /carriers/{id}/qualify"
        actor: BrokerOps
        preconditions:
          - "Carrier.mc_number matches ^[0-9]{6,7}$"
          - "Carrier.usdot_number matches ^[0-9]{5,8}$"
          - "Carrier.insurance_expiry_utc > current_utc"
          - "Carrier.safety_score < SAFETY_REJECT_THRESHOLD (75.0)"
        side_effects:
          - "Carrier.qualification_status <- QUALIFIED"
          - "Carrier.version increments by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /carriers/{id}/reject"
        actor: BrokerOps
        preconditions:
          - "request includes reason_code in {BAD_MC, BAD_USDOT, INSURANCE_EXPIRED, SAFETY_OVER_THRESHOLD}"
        side_effects:
          - "Carrier.qualification_status <- REJECTED"
          - "Carrier.rejection_reason_code <- reason_code"
          - "Carrier.version increments by 1"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /carriers/{id}/suspend"
        actor: BrokerOps
        preconditions:
          - "Carrier.qualification_status == QUALIFIED"
        side_effects:
          - "Carrier.qualification_status <- SUSPENDED"
          - "Carrier.version increments by 1"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /carriers/{id}/reinstate"
        actor: BrokerOps
        preconditions:
          - "Carrier.insurance_expiry_utc > current_utc"
        side_effects:
          - "Carrier.qualification_status <- QUALIFIED"
          - "Carrier.version increments by 1"

  - entity: QuoteRequest
    initial_state: OPEN
    terminal_states: [AWARDED, EXPIRED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: AWARDED
        trigger: "POST /quote-requests/{id}/award"
        actor: BrokerOps
        preconditions:
          - "QuoteRequest.status == OPEN"
          - "current_utc < QuoteRequest.expires_at_utc"
          - "Carrier.qualification_status == QUALIFIED"
          - "When QuoteRequest.requires_smartway == true: Carrier.smartway_tier IN {BRONZE, SILVER, GOLD}"
          - "When QuoteRequest.rate_mode == CONTRACT: ContractRate.version == QuoteRequest.contract_rate_version (version-pinning)"
          - "When QuoteRequest.rate_mode == CONTRACT: ContractRate.status == ACTIVE"
        side_effects:
          - "QuoteRequest.status <- AWARDED"
          - "QuoteRequest.version increments by 1"
          - "Load row created in status AWARDED with agreed_rate_cents = QuoteRequest.quoted_total_cents (cascade hop 1)"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /_clock/advance (system: when current_utc >= expires_at_utc and status == OPEN)"
        actor: system
        preconditions:
          - "QuoteRequest.status == OPEN"
          - "current_utc >= QuoteRequest.expires_at_utc"
        side_effects:
          - "QuoteRequest.status <- EXPIRED"
          - "QuoteRequest.version increments by 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /quote-requests/{id}/withdraw"
        actor: Shipper
        preconditions:
          - "QuoteRequest.status == OPEN"
        side_effects:
          - "QuoteRequest.status <- WITHDRAWN"
          - "QuoteRequest.version increments by 1"

  - entity: Load
    initial_state: AWARDED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: AWARDED
        to: IN_TRANSIT
        trigger: "POST /loads/{id}/pickup"
        actor: Carrier
        preconditions:
          - "Load.status == AWARDED"
          - "actual_pickup_at_utc is provided"
        side_effects:
          - "Load.status <- IN_TRANSIT"
          - "Load.actual_pickup_at_utc <- request.actual_pickup_at_utc"
          - "Load.version increments by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /loads/{id}/deliver"
        actor: Carrier
        preconditions:
          - "Load.status == IN_TRANSIT"
          - "actual_delivery_at_utc is provided"
          - "actual_delivery_at_utc > Load.actual_pickup_at_utc"
        side_effects:
          - "Load.status <- DELIVERED"
          - "Load.actual_delivery_at_utc <- request.actual_delivery_at_utc"
          - "Load.pod_received_at_utc <- current_utc"
          - "Detention calculation runs (calc detention_charge): updates Load.detention_charge_cents (calc cascade hop 1)"
          - "Load.version increments by 1"
      - from: DELIVERED
        to: INVOICED
        trigger: "POST /loads/{id}/invoice"
        actor: BrokerOps
        preconditions:
          - "Load.status == DELIVERED"
          - "Load.pod_received_at_utc IS NOT NULL"
        side_effects:
          - "Load.status <- INVOICED"
          - "Load.version increments by 1"
          - "Invoice row created (cascade hop 1) with total_cents computed by calc invoice_total_cents"
      - from: INVOICED
        to: CLOSED
        trigger: "POST /invoices/{id}/mark-paid (system event)"
        actor: BrokerOps
        preconditions:
          - "Invoice.status == PAID"
          - "Invoice.load_id == Load.id"
        side_effects:
          - "Load.status <- CLOSED"
          - "Load.version increments by 1"
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /loads/{id}/cancel"
        actor: BrokerOps
        preconditions:
          - "Load.status == AWARDED"
        side_effects:
          - "Load.status <- CANCELLED"
          - "Load.version increments by 1"
          - "QuoteRequest.status <- WITHDRAWN (cascade hop 2: load cancellation hop after award; reverses the AWARDED state on the parent quote so a fresh quote must be issued for the lane)"
          - "QuoteRequest.version increments by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments"
        actor: BrokerOps
        preconditions:
          - "Invoice.status == ISSUED"
          - "request.amount_cents > 0"
          - "Invoice.amount_paid_cents + request.amount_cents < Invoice.total_cents"
        side_effects:
          - "Invoice.amount_paid_cents += request.amount_cents"
          - "Invoice.status <- PARTIALLY_PAID"
          - "Invoice.version increments by 1"
          - "Shipper.open_ar_cents recomputed (calc cascade)"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: BrokerOps
        preconditions:
          - "Invoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "Invoice.amount_paid_cents + request.amount_cents == Invoice.total_cents"
        side_effects:
          - "Invoice.amount_paid_cents += request.amount_cents"
          - "Invoice.status <- PAID"
          - "Invoice.version increments by 1"
          - "Shipper.open_ar_cents recomputed (calc cascade hop 1)"
          - "Load.status <- CLOSED (cascade hop 2)"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: BrokerOps
        preconditions:
          - "Invoice.status == ISSUED"
          - "request.amount_cents == Invoice.total_cents"
        side_effects:
          - "Invoice.amount_paid_cents = Invoice.total_cents"
          - "Invoice.status <- PAID"
          - "Invoice.version increments by 1"
          - "Shipper.open_ar_cents recomputed (calc cascade hop 1)"
          - "Load.status <- CLOSED (cascade hop 2)"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /dispute-claims"
        actor: Shipper
        preconditions:
          - "Invoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "request.claimed_amount_cents <= Invoice.total_cents"
        side_effects:
          - "Invoice.status <- DISPUTED"
          - "Invoice.version increments by 1"
          - "DisputeClaim row created with status OPEN (cascade hop 1)"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /dispute-claims/{id}/resolve (when resolution_kind == DENIED)"
        actor: BrokerOps
        preconditions:
          - "DisputeClaim.status == OPEN"
          - "request.resolution_kind == DENIED"
        side_effects:
          - "DisputeClaim.status <- RESOLVED"
          - "DisputeClaim.resolution_kind <- DENIED"
          - "DisputeClaim.resolution_amount_cents <- 0"
          - "Invoice.status reverts to ISSUED if amount_paid_cents == 0 else PARTIALLY_PAID"
          - "Invoice.version increments by 1"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /dispute-claims/{id}/resolve (when resolution_kind == UPHELD AND resolution_amount_cents == Invoice.total_cents - Invoice.amount_paid_cents)"
        actor: BrokerOps
        preconditions:
          - "DisputeClaim.status == OPEN"
          - "request.resolution_kind == UPHELD"
          - "request.resolution_amount_cents == Invoice.total_cents - Invoice.amount_paid_cents"
        side_effects:
          - "DisputeClaim.status <- RESOLVED"
          - "DisputeClaim.resolution_kind <- UPHELD"
          - "DisputeClaim.resolution_amount_cents <- request.resolution_amount_cents"
          - "Invoice.status <- WRITTEN_OFF"
          - "Invoice.version increments by 1"
          - "Shipper.open_ar_cents recomputed (calc cascade hop 1)"
          - "Load.status <- CLOSED (cascade hop 2)"
          - "FactoringRequest.status <- RECOURSE when invoice.factored == true (cascade hop 3: dispute write-off recalls the advance)"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /dispute-claims/{id}/resolve (when resolution_kind == PARTIAL)"
        actor: BrokerOps
        preconditions:
          - "DisputeClaim.status == OPEN"
          - "request.resolution_kind == PARTIAL"
          - "0 < request.resolution_amount_cents < Invoice.total_cents - Invoice.amount_paid_cents"
        side_effects:
          - "DisputeClaim.status <- RESOLVED"
          - "DisputeClaim.resolution_kind <- PARTIAL"
          - "DisputeClaim.resolution_amount_cents <- request.resolution_amount_cents"
          - "Invoice.total_cents -= request.resolution_amount_cents (calc cascade hop 1: rerun calc invoice_total_cents with partial credit)"
          - "Invoice.status reverts to ISSUED if amount_paid_cents == 0 else PARTIALLY_PAID"
          - "Invoice.version increments by 1"
          - "Shipper.open_ar_cents recomputed (calc cascade hop 2)"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /dispute-claims/{id}/withdraw"
        actor: Shipper
        preconditions:
          - "DisputeClaim.status == OPEN"
        side_effects:
          - "DisputeClaim.status <- WITHDRAWN"
          - "Invoice.status reverts to prior pre-DISPUTED state"
          - "Invoice.version increments by 1"
        note: "Withdrawing is also valid for ISSUED → ISSUED self-loop on Invoice (no net change); listed here as DisputeClaim transition documentation."

  - entity: ContractRate
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contract-rates/{id}/activate"
        actor: BrokerOps
        preconditions:
          - "ContractRate.effective_from_utc <= current_utc < ContractRate.effective_until_utc"
          - "Shipper.status == ACTIVE"
        side_effects:
          - "ContractRate.status <- ACTIVE"
          - "ContractRate.version increments by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contract-rates/{id}/terminate"
        actor: BrokerOps
        preconditions:
          - "ContractRate.status == ACTIVE"
        side_effects:
          - "ContractRate.status <- TERMINATED"
          - "ContractRate.version increments by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advances to effective_until_utc"
        actor: system
        preconditions:
          - "current_utc >= ContractRate.effective_until_utc"
        side_effects:
          - "ContractRate.status <- EXPIRED"
          - "ContractRate.version increments by 1"

  - entity: FactoringRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /factoring-requests/{id}/approve"
        actor: BrokerOps
        preconditions:
          - "FactoringRequest.status == REQUESTED"
          - "Invoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "Invoice.factored == false"
          - "Carrier.qualification_status == QUALIFIED"
        side_effects:
          - "FactoringRequest.status <- APPROVED"
          - "Invoice.factored <- true"
          - "FactoringRequest.version increments by 1"
          - "Invoice.version increments by 1"
      - from: APPROVED
        to: ADVANCED
        trigger: "POST /factoring-requests/{id}/advance"
        actor: BrokerOps
        preconditions:
          - "FactoringRequest.status == APPROVED"
        side_effects:
          - "FactoringRequest.status <- ADVANCED"
          - "FactoringRequest.version increments by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /factoring-requests/{id}/reject"
        actor: BrokerOps
        preconditions:
          - "FactoringRequest.status == REQUESTED"
        side_effects:
          - "FactoringRequest.status <- REJECTED"
          - "FactoringRequest.version increments by 1"
      - from: ADVANCED
        to: RECOURSE
        trigger: "system: triggered by Invoice WRITTEN_OFF cascade or POST /factoring-requests/{id}/recourse"
        actor: BrokerOps
        preconditions:
          - "FactoringRequest.status == ADVANCED"
          - "Invoice.status == WRITTEN_OFF"
        side_effects:
          - "FactoringRequest.status <- RECOURSE"
          - "FactoringRequest.version increments by 1"

  - entity: DisputeClaim
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /dispute-claims/{id}/resolve"
        actor: BrokerOps
        preconditions:
          - "DisputeClaim.status == OPEN"
          - "request.resolution_kind IN {UPHELD, PARTIAL, DENIED}"
          - "When PARTIAL: 0 < resolution_amount_cents < remaining open amount"
          - "When UPHELD: resolution_amount_cents == remaining open amount"
          - "When DENIED: resolution_amount_cents == 0"
        side_effects:
          - "DisputeClaim.status <- RESOLVED"
          - "DisputeClaim.version increments by 1"
          - "Invoice transitions per resolution_kind (see Invoice machine cascade hop 1–3)"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /dispute-claims/{id}/withdraw"
        actor: Shipper
        preconditions:
          - "DisputeClaim.status == OPEN"
        side_effects:
          - "DisputeClaim.status <- WITHDRAWN"
          - "DisputeClaim.version increments by 1"
          - "Invoice reverts to pre-DISPUTED status"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: load-cancel-stale-quote-version
    parent_entity: QuoteRequest
    write_endpoint: "POST /quote-requests/{id}/award"
    occ_field: "expected_quote_request_version"
    description: |
      Awarding a QuoteRequest whose version has advanced since the client last
      observed it is rejected. The canonical race: the client reads
      QuoteRequest.version=N, but a sibling broker has already withdrawn or
      issued a fresh quote on the same lane (which legitimately supersedes the
      prior view), advancing the quote's version. The second award call still
      carrying expected_quote_request_version=N is deterministically rejected
      with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-rate-activate-stale-version
    parent_entity: ContractRate
    write_endpoint: "POST /contract-rates/{id}/activate"
    occ_field: "expected_contract_rate_version"
    description: |
      Activating a ContractRate against a stale version is rejected. The
      canonical race: an admin reads ContractRate.version=N, but another admin
      has already amended fuel surcharge (which legitimately supersedes the
      prior view), advancing the contract's version. The second activate call
      still carrying expected_contract_rate_version=N is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_total_at_request
    trigger: "POST /quote-requests (create)"
    algorithm: tiered_pricing
    formula: |
      # Mode resolution (CONTRACT vs SPOT) and total calculation.
      cov := first ContractRate row where
               shipper_id == request.shipper_id
               AND lane_origin == request.lane_origin
               AND lane_destination == request.lane_destination
               AND effective_from_utc <= request.pickup_window_start_utc < effective_until_utc
               AND status == ACTIVE
             ordered by created_at ASC, picking the first row.
      if cov exists:
        rate_mode := CONTRACT
        contract_rate_id := cov.id
        contract_rate_version := cov.version
        linehaul := cov.rate_per_mile_cents * request.distance_miles
        fuel := cov.fuel_surcharge_per_mile_cents * request.distance_miles
        quoted_total_cents := linehaul + fuel
      else:
        rate_mode := SPOT
        contract_rate_id := null
        contract_rate_version := null
        # SPOT tiered pricing on distance_miles:
        if distance_miles <= 250:
          base_rate_per_mile_cents := SPOT_TIER1_PER_MILE_CENTS
        elif distance_miles <= 750:
          base_rate_per_mile_cents := SPOT_TIER2_PER_MILE_CENTS
        else:
          base_rate_per_mile_cents := SPOT_TIER3_PER_MILE_CENTS
        linehaul := base_rate_per_mile_cents * distance_miles
        fuel := SPOT_FUEL_SURCHARGE_PER_MILE_CENTS * distance_miles
        equipment_uplift_cents :=
          (equipment_uplift_pct[request.requested_equipment] / 100.0) * linehaul
        # Round equipment_uplift_cents to nearest cent half-up, BEFORE summing.
        equipment_uplift_cents := round_half_up(equipment_uplift_cents)
        quoted_total_cents := linehaul + fuel + equipment_uplift_cents
    input_set: |
      QuoteRequest fields at create time. The covering ContractRate search uses
      strict 5-digit-ZIP equality on lane_origin and lane_destination AND
      status==ACTIVE filter AND temporal window inclusion AND tie-break
      created_at ASC.
    constants:
      SPOT_TIER1_PER_MILE_CENTS: 320      # up to 250 mi
      SPOT_TIER2_PER_MILE_CENTS: 235      # 251-750 mi
      SPOT_TIER3_PER_MILE_CENTS: 195      # 751+ mi
      SPOT_FUEL_SURCHARGE_PER_MILE_CENTS: 65
      equipment_uplift_pct:
        DRY_VAN: 0
        REEFER: 18
        FLATBED: 10
    precision: "Round equipment_uplift_cents to nearest cent (half-up) BEFORE summing into quoted_total_cents. Linehaul and fuel are already in whole cents."
    variants:
      - name: contract_variant
        when: "A row in ContractRate satisfies the covering predicate"
        difference: "Uses the contract's rate_per_mile_cents and fuel_surcharge_per_mile_cents verbatim; no tier table and no equipment uplift. quote.rate_mode=CONTRACT and contract_rate_version captured for version-pinning."
      - name: spot_variant
        when: "No covering ContractRate exists"
        difference: "Uses SPOT_TIER_* constants by distance band, adds equipment_uplift_pct uplift, rounds uplift half-up before sum. quote.rate_mode=SPOT and contract_rate_id remains null."

  - name: detention_charge
    trigger: "POST /loads/{id}/deliver (state DELIVERED hop)"
    algorithm: threshold
    formula: |
      # Pickup-detention only; delivery detention is a separately-billed Accessorial.
      detention_minutes_at_pickup :=
        floor((Load.actual_pickup_at_utc - QuoteRequest.pickup_window_start_utc) / 60)
        # value is whole minutes; clipped at 0 if pickup is early.
      detention_minutes_at_pickup := max(0, detention_minutes_at_pickup)
      free_min := contract.detention_free_minutes if quote.rate_mode == CONTRACT
                  else SPOT_DETENTION_FREE_MINUTES
      rate_cents_per_hour := contract.detention_rate_per_hour_cents if quote.rate_mode == CONTRACT
                             else SPOT_DETENTION_RATE_PER_HOUR_CENTS
      billable_minutes := max(0, detention_minutes_at_pickup - free_min)
      # Round billable_minutes UP to the next whole hour BEFORE multiplying.
      billable_hours := ceil(billable_minutes / 60)
      detention_charge_cents := billable_hours * rate_cents_per_hour
    input_set: |
      Single Load row; QuoteRequest reached via Load.quote_request_id;
      ContractRate (if rate_mode==CONTRACT) reached via QuoteRequest.contract_rate_id.
    constants:
      SPOT_DETENTION_FREE_MINUTES: 120
      SPOT_DETENTION_RATE_PER_HOUR_CENTS: 7500
    precision: |
      Order matters: subtract free_min from minutes FIRST, then ceil(/60) to whole hours,
      then multiply by rate. Computing hours first would lose the boundary precision.

  - name: invoice_total_cents
    trigger: "POST /loads/{id}/invoice (state INVOICED) AND on DisputeClaim PARTIAL resolution recompute"
    algorithm: aggregation
    formula: |
      Invoice.total_cents :=
        Load.agreed_rate_cents
        + Load.detention_charge_cents
        + sum(Accessorial.amount_cents WHERE Accessorial.load_id == Load.id)
        - sum(DisputeClaim.resolution_amount_cents
              WHERE DisputeClaim.invoice_id == Invoice.id
                AND DisputeClaim.status == RESOLVED
                AND DisputeClaim.resolution_kind == PARTIAL)
    input_set: |
      Single Load, all attached Accessorial rows, all RESOLVED PARTIAL
      DisputeClaim rows on this Invoice. Order: sum-then-subtract; do not net
      per-line.
    constants: {}
    precision: "All values in whole cents; no rounding needed."

  - name: factoring_advance
    trigger: "POST /factoring-requests (create)"
    algorithm: tiered_pricing
    formula: |
      # Factoring fee schedule by carrier safety_score:
      if Carrier.safety_score < 25:
        applicable_fee_pct := FACTORING_BASE_PCT
      elif Carrier.safety_score < 50:
        applicable_fee_pct := FACTORING_BASE_PCT + 0.5
      elif Carrier.safety_score < 75:
        applicable_fee_pct := FACTORING_BASE_PCT + 1.5
      # Carriers with safety_score >= 75 are not QUALIFIED, so unreachable here.
      actual_fee_pct := max(applicable_fee_pct, request.factoring_fee_pct)
      # Compute advance: subtract discount from Invoice.total_cents
      raw_advance := Invoice.total_cents * (100.0 - actual_fee_pct) / 100.0
      advance_cents := round_half_up(raw_advance)
    input_set: |
      Single Invoice and its Carrier (via Invoice -> Load -> Carrier). Only
      Invoices with status IN {ISSUED, PARTIALLY_PAID} are eligible.
    constants:
      FACTORING_BASE_PCT: 2.0
    precision: "Round advance_cents to nearest cent half-up after computing raw_advance once."

  - name: shipper_credit_risk_score
    trigger: "GET /shippers/{id}/credit-risk OR on Invoice status change"
    algorithm: weighted_scoring
    formula: |
      utilization_ratio := Shipper.open_ar_cents / max(Shipper.credit_limit_cents, 1)
      late_count := count(Invoice WHERE Invoice.load_id IN Loads-of-shipper
                                  AND Invoice.status == PARTIALLY_PAID
                                  AND current_utc - Invoice.created_at > LATE_AGE_DAYS days)
      dispute_count := count(DisputeClaim WHERE Invoice -> Load -> Shipper == id
                                          AND DisputeClaim.status == RESOLVED
                                          AND DisputeClaim.resolution_kind != DENIED)
      score := round_half_up(
                 W_UTIL * min(utilization_ratio, 1.0) * 100
                 + W_LATE * late_count
                 + W_DISPUTE * dispute_count,
                 0)
      # tie-break: insertion order resolved by created_at ASC.
    input_set: |
      Shipper and all Invoice + DisputeClaim rows linked via Load.shipper_id ==
      Shipper.id. Open invoices counted regardless of factoring status.
    constants:
      W_UTIL: 0.6
      W_LATE: 5
      W_DISPUTE: 8
      LATE_AGE_DAYS: 30
    precision: "Round the final composite score to whole integer half-up. min(utilization_ratio,1.0)*100 is computed without intermediate rounding."

  - name: shipper_open_ar_invariant
    trigger: "Recomputed on every Invoice mutation (issue, payment, dispute UPHELD, dispute PARTIAL); also re-evaluated by the test suite as a global conservation check."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (compensating-action invariant):
      # Shipper.open_ar_cents == sum(
      #   Invoice.total_cents - Invoice.amount_paid_cents
      #   WHERE Invoice -> Load.quote_request_id -> QuoteRequest.shipper_id == Shipper.id
      #     AND Invoice.status IN {ISSUED, PARTIALLY_PAID, DISPUTED}
      # )
      #
      # Forward action: POST /invoices/{id}/payments increments amount_paid_cents.
      # Compensating action: POST /dispute-claims/{id}/withdraw which restores
      # Invoice.status to its pre-DISPUTED value WITHOUT changing total_cents
      # or amount_paid_cents — the open_ar contribution returns to the same
      # value it held before the dispute opened. Forward action paired with
      # its compensating action MUST leave Shipper.open_ar_cents unchanged.
    input_set: "All Invoice rows reachable from Shipper.id via Invoice.load_id -> Load.quote_request_id -> QuoteRequest.shipper_id."
    constants: {}
    precision: "Exact cents; no rounding."

  - name: load_accessorial_total_invariant
    trigger: "Recomputed on every POST /loads/{id}/accessorials."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (compensating-action invariant on accessorial line items):
      # Load.accessorial_total_cents == sum(Accessorial.amount_cents
      #                                     WHERE Accessorial.load_id == Load.id)
      #
      # Forward action: POST /loads/{id}/accessorials adds amount_cents to the
      # sum. Compensating action: POST /dispute-claims with claim_type=OVERCHARGE
      # AND resolution_kind=PARTIAL with resolution_amount_cents equal to that
      # accessorial's amount_cents reduces Invoice.total_cents by exactly the
      # same amount (the dispute reduces Invoice.total_cents but DOES NOT mutate
      # Load.accessorial_total_cents, ensuring the invariant
      # `Invoice.total_cents + Σ PARTIAL resolutions ==
      #   Load.agreed_rate_cents + Load.detention_charge_cents +
      #   Load.accessorial_total_cents` holds exactly).
    input_set: "All Accessorial rows on this Load."
    constants: {}
    precision: "Exact cents."

  - name: smartway_quarterly_audit
    trigger: "POST /smartway-audits (create) OR scheduled quarterly snapshot"
    algorithm: aggregation
    formula: |
      qtr_start_utc, qtr_end_utc := parse_quarter(quarter_label) # e.g., 2026Q2 -> [2026-04-01T00:00:00Z, 2026-07-01T00:00:00Z)
      eligible_loads :=
        Load rows WHERE
          QuoteRequest(via Load.quote_request_id).shipper_id == request.shipper_id
          AND Load.status IN {DELIVERED, INVOICED, CLOSED}
          AND qtr_start_utc <= Load.actual_delivery_at_utc < qtr_end_utc
      total_loads := count(eligible_loads)
      smartway_loads :=
        count(L in eligible_loads WHERE Carrier(via L.carrier_id).smartway_tier IN {BRONZE, SILVER, GOLD})
      if total_loads == 0:
        smartway_ratio := 0.0
        compliance_status := FAILING
      else:
        smartway_ratio := round_half_up(smartway_loads / total_loads, 4)
        if smartway_ratio >= 0.60:
          compliance_status := PASSING
        elif smartway_ratio >= 0.40:
          compliance_status := AT_RISK
        else:
          compliance_status := FAILING
    input_set: |
      All Load rows of the named Shipper whose actual_delivery_at_utc falls
      within the half-open quarter window [start, end). Carrier.smartway_tier
      is read AS OF the load's delivery moment from the persisted Carrier row.
    constants:
      SMARTWAY_PASS_THRESHOLD: 0.60
      SMARTWAY_AT_RISK_THRESHOLD: 0.40
    precision: |
      Ratio rounded to 4 decimal places half-up BEFORE threshold comparison.
      Tie at exactly 0.60 -> PASSING; tie at exactly 0.40 -> AT_RISK.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-parameter resources resolve (left-to-right): Shipper, Carrier, ContractRate, QuoteRequest, Load, Invoice, FactoringRequest, DisputeClaim"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Foreign-key fields in body reference existing rows"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST /quote-requests, POST /contract-rates, POST /loads, POST /factoring-requests, POST /dispute-claims, POST /loads/{id}/accessorials"

  - priority: 5
    category: state
    check: "Target resource state allows this transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "expected_<parent>_version matches current parent.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /quote-requests/{id}/award, POST /contract-rates/{id}/activate"

  - priority: 7
    category: business_safety
    check: "On POST /carriers/{id}/qualify: Carrier.safety_score < 75.0"
    error_id: ERR_SAFETY_SCORE_TOO_HIGH
    http_status: 422
    applies_to: "POST /carriers/{id}/qualify"

  - priority: 8
    category: business_safety
    check: "On POST /carriers/{id}/qualify and POST /quote-requests/{id}/award and POST /loads: Carrier.insurance_expiry_utc > current_utc"
    error_id: ERR_INSURANCE_EXPIRED
    http_status: 422
    applies_to: "POST /carriers/{id}/qualify, POST /carriers/{id}/reinstate, POST /quote-requests/{id}/award"

  - priority: 9
    category: business_safety
    check: "When QuoteRequest.requires_smartway == true: awarded Carrier.smartway_tier IN {BRONZE, SILVER, GOLD}"
    error_id: ERR_SMARTWAY_INELIGIBLE
    http_status: 422
    applies_to: "POST /quote-requests/{id}/award"

  - priority: 10
    category: business_referential
    check: "On POST /quote-requests/{id}/award when QuoteRequest.rate_mode == CONTRACT: QuoteRequest.contract_rate_version MUST equal current ContractRate.version (version-pinning)"
    error_id: ERR_CONTRACT_RATE_STALE
    http_status: 422
    applies_to: "POST /quote-requests/{id}/award"

  - priority: 11
    category: business_temporal
    check: "On POST /quote-requests: pickup_window_start_utc < pickup_window_end_utc AND pickup_window_start_utc > current_utc"
    error_id: ERR_TIME_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /quote-requests"

  - priority: 12
    category: business_temporal
    check: "On POST /loads/{id}/deliver: actual_delivery_at_utc > Load.actual_pickup_at_utc"
    error_id: ERR_DELIVERY_BEFORE_PICKUP
    http_status: 422
    applies_to: "POST /loads/{id}/deliver"

  - priority: 13
    category: business_temporal
    check: "On POST /contract-rates: effective_from_utc < effective_until_utc"
    error_id: ERR_CONTRACT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /contract-rates"

  - priority: 14
    category: business_constraint
    check: "On POST /carriers: mc_number matches ^[0-9]{6,7}$ AND usdot_number matches ^[0-9]{5,8}$ AND each value is unique across Carrier rows"
    error_id: ERR_INVALID_MC_USDOT
    http_status: 422
    applies_to: "POST /carriers"

  - priority: 15
    category: business_constraint
    check: "On POST /dispute-claims: claimed_amount_cents <= Invoice.total_cents - Invoice.amount_paid_cents"
    error_id: ERR_DISPUTE_AMOUNT_EXCEEDS_OPEN
    http_status: 422
    applies_to: "POST /dispute-claims"

  - priority: 16
    category: business_constraint
    check: "On POST /dispute-claims/{id}/resolve: resolution_amount_cents bound by resolution_kind per §1.2"
    error_id: ERR_RESOLUTION_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /dispute-claims/{id}/resolve"

  - priority: 17
    category: business_fiscal
    check: "On POST /quote-requests: Shipper.open_ar_cents + estimated_quote_cents <= Shipper.credit_limit_cents (credit guard); estimated quote computed using SPOT tier with NONE smartway and distance_miles for fast preflight"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /quote-requests"

  - priority: 18
    category: business_fiscal
    check: "On POST /invoices/{id}/payments: amount_cents > 0 AND amount_paid_cents + amount_cents <= total_cents"
    error_id: ERR_PAYMENT_OVERAGE
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"

  - priority: 19
    category: business_fiscal
    check: "On POST /factoring-requests: factoring_fee_pct >= calculated minimum fee per safety_score tier; factor cannot underprice the schedule"
    error_id: ERR_FACTORING_FEE_BELOW_MIN
    http_status: 422
    applies_to: "POST /factoring-requests"

  - priority: 20
    category: business_constraint
    check: "On POST /smartway-audits: one row per (shipper_id, quarter_label); quarter_label format ^[0-9]{4}Q[1-4]$ AND quarter_end_utc < current_utc"
    error_id: ERR_AUDIT_QUARTER_INVALID
    http_status: 422
    applies_to: "POST /smartway-audits"

  - priority: 21
    category: business_temporal
    check: |
      On POST /contract-rates/{id}/activate: no other ContractRate row may already
      be ACTIVE for the same (shipper_id, lane_origin, lane_destination) tuple
      with a time window [effective_from_utc, effective_until_utc) that overlaps
      this row's window. Interval semantics: HALF-OPEN [from, until). Adjacency
      (one's until == other's from) is NOT an overlap.
    error_id: ERR_CONTRACT_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /contract-rates/{id}/activate"

  - priority: 22
    category: business_temporal
    check: |
      On POST /quote-requests: no other OPEN QuoteRequest may exist for the same
      (shipper_id, lane_origin, lane_destination) whose pickup_window
      [pickup_window_start_utc, pickup_window_end_utc) overlaps including a
      120-minute pre-pickup buffer (effective interval =
      [pickup_window_start_utc - 120min, pickup_window_end_utc)). Adjacency at
      the buffered edge IS an overlap (closed boundary on left side after
      buffer expansion).
    error_id: ERR_QUOTE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /quote-requests"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Shippers ----
  - method: POST
    path: "/freight/shippers"
    description: "Register a new shipper."
    roles: [BrokerOps]
    code: 201
    input: [legal_name, billing_email, credit_limit_cents]
    output: Shipper
    side_effects:
      - "Creates Shipper row with status=ACTIVE, open_ar_cents=0."

  - method: GET
    path: "/freight/shippers/{id}"
    description: "Fetch one Shipper."
    roles: [BrokerOps, Shipper]
    code: 200
    input: []
    output: Shipper
    side_effects: []

  - method: GET
    path: "/freight/shippers"
    description: "List shippers; supports status filter."
    roles: [BrokerOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Shipper[]
    side_effects: []

  - method: GET
    path: "/freight/shippers/{id}/credit-risk"
    description: "Compute and return current shipper_credit_risk_score (calc §1.3)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: "{ score: integer, utilization_ratio: number, late_count: integer, dispute_count: integer }"
    side_effects: []

  # ---- Carriers ----
  - method: POST
    path: "/freight/carriers"
    description: "Register a carrier in PENDING status."
    roles: [BrokerOps]
    code: 201
    input: ["legal_name", "mc_number", "usdot_number", "smartway_tier?", "insurance_expiry_utc", "safety_score"]
    output: Carrier
    side_effects:
      - "Creates Carrier row with qualification_status=PENDING."

  - method: GET
    path: "/freight/carriers/{id}"
    description: "Fetch one Carrier."
    roles: [BrokerOps, Carrier]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/freight/carriers"
    description: "List carriers; supports qualification_status filter."
    roles: [BrokerOps]
    code: 200
    input: ["qualification_status?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: POST
    path: "/freight/carriers/{id}/qualify"
    description: "Approve carrier qualification (PENDING -> QUALIFIED)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: Carrier
    side_effects:
      - "Carrier.qualification_status <- QUALIFIED; Carrier.version increments by 1."

  - method: POST
    path: "/freight/carriers/{id}/reject"
    description: "Reject carrier (PENDING -> REJECTED) with a reason code."
    roles: [BrokerOps]
    code: 200
    input: [reason_code]
    output: Carrier
    side_effects:
      - "Carrier.qualification_status <- REJECTED; Carrier.rejection_reason_code <- reason_code; Carrier.version increments by 1."

  - method: POST
    path: "/freight/carriers/{id}/suspend"
    description: "Suspend a qualified carrier (QUALIFIED -> SUSPENDED)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: Carrier
    side_effects:
      - "Carrier.qualification_status <- SUSPENDED; Carrier.version increments by 1."

  - method: POST
    path: "/freight/carriers/{id}/reinstate"
    description: "Reinstate a suspended carrier (SUSPENDED -> QUALIFIED)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: Carrier
    side_effects:
      - "Carrier.qualification_status <- QUALIFIED; Carrier.version increments by 1."

  # ---- ContractRates ----
  - method: POST
    path: "/freight/contract-rates"
    description: "Create a contract rate in DRAFT."
    roles: [BrokerOps]
    code: 201
    input: [shipper_id, lane_origin, lane_destination, rate_per_mile_cents, fuel_surcharge_per_mile_cents, detention_free_minutes, detention_rate_per_hour_cents, effective_from_utc, effective_until_utc]
    output: ContractRate
    side_effects:
      - "Creates ContractRate row with status=DRAFT."

  - method: GET
    path: "/freight/contract-rates/{id}"
    description: "Fetch one ContractRate."
    roles: [BrokerOps, Shipper]
    code: 200
    input: []
    output: ContractRate
    side_effects: []

  - method: GET
    path: "/freight/contract-rates"
    description: "List contract rates; supports filtering by shipper_id and status."
    roles: [BrokerOps, Shipper]
    code: 200
    input: ["shipper_id?", "status?", "limit?", "offset?"]
    output: ContractRate[]
    side_effects: []

  - method: POST
    path: "/freight/contract-rates/{id}/activate"
    description: "Activate a DRAFT contract (DRAFT -> ACTIVE). OCC-guarded."
    roles: [BrokerOps]
    code: 200
    input: [expected_contract_rate_version]
    output: ContractRate
    side_effects:
      - "ContractRate.status <- ACTIVE; ContractRate.version increments by 1."

  - method: POST
    path: "/freight/contract-rates/{id}/terminate"
    description: "Terminate an ACTIVE contract (ACTIVE -> TERMINATED)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: ContractRate
    side_effects:
      - "ContractRate.status <- TERMINATED; ContractRate.version increments by 1."

  # ---- QuoteRequests ----
  - method: POST
    path: "/freight/quote-requests"
    description: "Shipper requests a quote on a lane and equipment; rate_mode and quoted_total_cents are computed."
    roles: [Shipper, BrokerOps]
    code: 201
    input: ["shipper_id", "lane_origin", "lane_destination", "distance_miles", "pickup_window_start_utc", "pickup_window_end_utc", "requested_equipment", "requires_smartway?"]
    output: QuoteRequest
    side_effects:
      - "Runs calc quote_total_at_request; sets rate_mode, contract_rate_id, contract_rate_version, quoted_total_cents, expires_at_utc=pickup_window_start_utc."

  - method: GET
    path: "/freight/quote-requests/{id}"
    description: "Fetch one QuoteRequest."
    roles: [Shipper, BrokerOps]
    code: 200
    input: []
    output: QuoteRequest
    side_effects: []

  - method: GET
    path: "/freight/quote-requests"
    description: "List quote requests; supports filtering."
    roles: [Shipper, BrokerOps]
    code: 200
    input: ["shipper_id?", "status?", "rate_mode?", "contract_rate_id?", "limit?", "offset?"]
    output: QuoteRequest[]
    side_effects: []

  - method: POST
    path: "/freight/quote-requests/{id}/award"
    description: "Award a quote to a specific carrier; creates the Load. OCC-guarded."
    roles: [BrokerOps]
    code: 200
    input: [carrier_id, expected_quote_request_version]
    output: Load
    side_effects:
      - "QuoteRequest.status <- AWARDED; QuoteRequest.version increments by 1."
      - "Load row created with status=AWARDED, agreed_rate_cents=QuoteRequest.quoted_total_cents (cascade hop)."

  - method: POST
    path: "/freight/quote-requests/{id}/withdraw"
    description: "Shipper withdraws an OPEN quote."
    roles: [Shipper]
    code: 200
    input: []
    output: QuoteRequest
    side_effects:
      - "QuoteRequest.status <- WITHDRAWN; QuoteRequest.version increments by 1."

  # ---- Loads ----
  - method: GET
    path: "/freight/loads/{id}"
    description: "Fetch one Load."
    roles: [BrokerOps, Carrier, Shipper]
    code: 200
    input: []
    output: Load
    side_effects: []

  - method: GET
    path: "/freight/loads"
    description: "List loads; supports filtering by quote_request_id, carrier_id, status."
    roles: [BrokerOps, Carrier, Shipper]
    code: 200
    input: ["quote_request_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: Load[]
    side_effects: []

  - method: POST
    path: "/freight/loads/{id}/pickup"
    description: "Carrier reports pickup (AWARDED -> IN_TRANSIT)."
    roles: [Carrier]
    code: 200
    input: [actual_pickup_at_utc]
    output: Load
    side_effects:
      - "Load.status <- IN_TRANSIT; Load.actual_pickup_at_utc set; Load.version increments by 1."

  - method: POST
    path: "/freight/loads/{id}/deliver"
    description: "Carrier reports delivery (IN_TRANSIT -> DELIVERED); detention_charge calc runs."
    roles: [Carrier]
    code: 200
    input: [actual_delivery_at_utc]
    output: Load
    side_effects:
      - "Load.status <- DELIVERED; Load.actual_delivery_at_utc set; Load.pod_received_at_utc set; runs calc detention_charge (cascade hop 1); Load.version increments by 1."

  - method: POST
    path: "/freight/loads/{id}/cancel"
    description: "Cancel an AWARDED load before pickup; cascades QuoteRequest back to WITHDRAWN."
    roles: [BrokerOps]
    code: 200
    input: []
    output: Load
    side_effects:
      - "Load.status <- CANCELLED; QuoteRequest.status <- WITHDRAWN (cascade hop 2); Load.version increments by 1; QuoteRequest.version increments by 1."

  - method: POST
    path: "/freight/loads/{id}/invoice"
    description: "Generate Invoice from a DELIVERED load (DELIVERED -> INVOICED)."
    roles: [BrokerOps]
    code: 201
    input: []
    output: Invoice
    side_effects:
      - "Load.status <- INVOICED; Load.version increments by 1; Invoice row created via calc invoice_total_cents (cascade hop 1)."

  - method: POST
    path: "/freight/loads/{id}/accessorials"
    description: "Attach an Accessorial charge to a load. Allowed while status IN {DELIVERED}."
    roles: [BrokerOps, Carrier]
    code: 201
    input: ["code", "amount_cents", "note?"]
    output: Accessorial
    side_effects:
      - "Creates Accessorial row; Load.accessorial_total_cents recomputed; Load.version increments by 1."

  - method: GET
    path: "/freight/loads/{id}/accessorials"
    description: "List accessorials on a load."
    roles: [BrokerOps, Carrier, Shipper]
    code: 200
    input: []
    output: Accessorial[]
    side_effects: []

  # ---- Invoices ----
  - method: GET
    path: "/freight/invoices/{id}"
    description: "Fetch one Invoice."
    roles: [BrokerOps, Shipper, Carrier]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/freight/invoices"
    description: "List invoices; supports filter by load_id and status."
    roles: [BrokerOps, Shipper, Carrier]
    code: 200
    input: ["load_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/freight/invoices/{id}/payments"
    description: "Record a cash receipt against an invoice."
    roles: [BrokerOps]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects:
      - "Invoice.amount_paid_cents += amount_cents; Invoice.status transition per §1.2; Shipper.open_ar_cents recomputed (cascade hop 1); Load.status <- CLOSED on full payment (cascade hop 2); Invoice.version increments by 1."

  # ---- FactoringRequests ----
  - method: POST
    path: "/freight/factoring-requests"
    description: "Carrier requests factoring on an open Invoice; advance_cents computed."
    roles: [Carrier]
    code: 201
    input: [invoice_id, carrier_id, factoring_fee_pct]
    output: FactoringRequest
    side_effects:
      - "Creates FactoringRequest row in REQUESTED; runs calc factoring_advance (advance_cents)."

  - method: GET
    path: "/freight/factoring-requests/{id}"
    description: "Fetch one FactoringRequest."
    roles: [BrokerOps, Carrier]
    code: 200
    input: []
    output: FactoringRequest
    side_effects: []

  - method: GET
    path: "/freight/factoring-requests"
    description: "List factoring requests; supports filter by carrier_id, invoice_id, status."
    roles: [BrokerOps, Carrier]
    code: 200
    input: ["carrier_id?", "invoice_id?", "status?", "limit?", "offset?"]
    output: FactoringRequest[]
    side_effects: []

  - method: POST
    path: "/freight/factoring-requests/{id}/approve"
    description: "Approve a factoring request (REQUESTED -> APPROVED)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: FactoringRequest
    side_effects:
      - "FactoringRequest.status <- APPROVED; Invoice.factored <- true; FactoringRequest.version increments by 1; Invoice.version increments by 1."

  - method: POST
    path: "/freight/factoring-requests/{id}/advance"
    description: "Disburse the advance (APPROVED -> ADVANCED)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: FactoringRequest
    side_effects:
      - "FactoringRequest.status <- ADVANCED; FactoringRequest.version increments by 1."

  - method: POST
    path: "/freight/factoring-requests/{id}/reject"
    description: "Reject a factoring request (REQUESTED -> REJECTED)."
    roles: [BrokerOps]
    code: 200
    input: []
    output: FactoringRequest
    side_effects:
      - "FactoringRequest.status <- REJECTED; FactoringRequest.version increments by 1."

  # ---- DisputeClaims ----
  - method: POST
    path: "/freight/dispute-claims"
    description: "Shipper opens a dispute claim against an invoice; Invoice transitions ISSUED -> DISPUTED."
    roles: [Shipper]
    code: 201
    input: [invoice_id, claim_type, claimed_amount_cents]
    output: DisputeClaim
    side_effects:
      - "Creates DisputeClaim row in OPEN; Invoice.status <- DISPUTED (cascade hop 1); Invoice.version increments by 1."

  - method: GET
    path: "/freight/dispute-claims/{id}"
    description: "Fetch one DisputeClaim."
    roles: [BrokerOps, Shipper]
    code: 200
    input: []
    output: DisputeClaim
    side_effects: []

  - method: GET
    path: "/freight/dispute-claims"
    description: "List dispute claims; supports filter by invoice_id, status."
    roles: [BrokerOps, Shipper]
    code: 200
    input: ["invoice_id?", "status?", "limit?", "offset?"]
    output: DisputeClaim[]
    side_effects: []

  - method: POST
    path: "/freight/dispute-claims/{id}/resolve"
    description: "Broker resolves an OPEN dispute claim (UPHELD/PARTIAL/DENIED)."
    roles: [BrokerOps]
    code: 200
    input: [resolution_kind, resolution_amount_cents]
    output: DisputeClaim
    side_effects:
      - "DisputeClaim.status <- RESOLVED; Invoice transitions per resolution_kind (UPHELD->WRITTEN_OFF; PARTIAL->ISSUED|PARTIALLY_PAID with total_cents reduction; DENIED->ISSUED|PARTIALLY_PAID unchanged); on UPHELD cascade FactoringRequest.status <- RECOURSE when Invoice.factored == true (cascade hop 3); DisputeClaim.version increments by 1; Invoice.version increments by 1."

  - method: POST
    path: "/freight/dispute-claims/{id}/withdraw"
    description: "Shipper withdraws a dispute; Invoice reverts to its pre-DISPUTED status."
    roles: [Shipper]
    code: 200
    input: []
    output: DisputeClaim
    side_effects:
      - "DisputeClaim.status <- WITHDRAWN; Invoice.status reverts to ISSUED or PARTIALLY_PAID; DisputeClaim.version increments by 1; Invoice.version increments by 1."

  # ---- SmartWayAudits ----
  - method: POST
    path: "/freight/smartway-audits"
    description: "Create a SmartWay audit row for (shipper_id, quarter_label); ratio + compliance_status computed via calc smartway_quarterly_audit."
    roles: [BrokerOps]
    code: 201
    input: [shipper_id, quarter_label]
    output: SmartWayAudit
    side_effects:
      - "Creates SmartWayAudit row with computed total_loads, smartway_loads, smartway_ratio, compliance_status."

  - method: GET
    path: "/freight/smartway-audits"
    description: "List SmartWay audits; supports filter by shipper_id, quarter_label, compliance_status."
    roles: [BrokerOps, Shipper]
    code: 200
    input: ["shipper_id?", "quarter_label?", "compliance_status?", "limit?", "offset?"]
    output: SmartWayAudit[]
    side_effects: []

  - method: GET
    path: "/freight/shippers/{id}/smartway-audits"
    description: "List SmartWay audits for a single shipper (sub-resource form for reverse-reachability)."
    roles: [BrokerOps, Shipper]
    code: 200
    input: ["quarter_label?", "compliance_status?", "limit?", "offset?"]
    output: SmartWayAudit[]
    side_effects: []

  # ---- Test-driving (system) ----
  - method: POST
    path: "/freight/_clock/set_current_utc"
    description: "Test-driving endpoint: pin server's current_utc to a literal ISO 8601 timestamp."
    roles: [BrokerOps]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Server-wide clock set; any /_clock/advance auto-transitions may then run on next call."

  - method: POST
    path: "/freight/_clock/advance"
    description: "Test-driving endpoint: trigger system-time-driven auto-transitions (QuoteRequest -> EXPIRED, ContractRate -> EXPIRED) based on current_utc."
    roles: [BrokerOps]
    code: 200
    input: []
    output: "{ expired_quote_request_ids: array, expired_contract_rate_ids: array }"
    side_effects:
      - "Each QuoteRequest with status=OPEN AND expires_at_utc <= current_utc transitions to EXPIRED; each ContractRate with status=ACTIVE AND effective_until_utc <= current_utc transitions to EXPIRED; version increments by 1 on each."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Caller's role lacks permission for endpoint per §1.7."

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist."

  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "Body foreign-key field references a non-existent row."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits this operation."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current parent.version (OCC fail)."

  - id: ERR_SAFETY_SCORE_TOO_HIGH
    http: 422
    condition: "Carrier.safety_score >= 75.0 at qualify time."

  - id: ERR_INSURANCE_EXPIRED
    http: 422
    condition: "Carrier.insurance_expiry_utc <= current_utc at qualify/award time."

  - id: ERR_SMARTWAY_INELIGIBLE
    http: 422
    condition: "QuoteRequest.requires_smartway == true but awarded Carrier.smartway_tier == NONE."

  - id: ERR_CONTRACT_RATE_STALE
    http: 422
    condition: "On award, QuoteRequest.contract_rate_version != current ContractRate.version."

  - id: ERR_TIME_WINDOW_INVALID
    http: 422
    condition: "QuoteRequest pickup window invalid (start >= end OR start <= current_utc)."

  - id: ERR_DELIVERY_BEFORE_PICKUP
    http: 422
    condition: "On deliver, actual_delivery_at_utc <= Load.actual_pickup_at_utc."

  - id: ERR_CONTRACT_WINDOW_INVALID
    http: 422
    condition: "ContractRate effective_from_utc >= effective_until_utc."

  - id: ERR_INVALID_MC_USDOT
    http: 422
    condition: "mc_number or usdot_number fails regex check OR collides with an existing Carrier row."

  - id: ERR_DISPUTE_AMOUNT_EXCEEDS_OPEN
    http: 422
    condition: "DisputeClaim.claimed_amount_cents > Invoice.total_cents - Invoice.amount_paid_cents."

  - id: ERR_RESOLUTION_AMOUNT_INVALID
    http: 422
    condition: "Resolution_amount_cents inconsistent with resolution_kind per §1.2 preconditions."

  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Shipper.open_ar_cents + estimated quote total > Shipper.credit_limit_cents on /quote-requests."

  - id: ERR_PAYMENT_OVERAGE
    http: 422
    condition: "Payment amount would push Invoice.amount_paid_cents above total_cents OR amount_cents <= 0."

  - id: ERR_FACTORING_FEE_BELOW_MIN
    http: 422
    condition: "factoring_fee_pct below the minimum schedule for the carrier's safety_score band."

  - id: ERR_AUDIT_QUARTER_INVALID
    http: 422
    condition: "Quarter_label malformed OR not yet complete OR duplicate (shipper_id, quarter_label) row."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, wrong type, or schema violation outside the catalog above."

  - id: ERR_CONTRACT_WINDOW_OVERLAP
    http: 422
    condition: "Activating ContractRate whose [effective_from_utc, effective_until_utc) half-open window overlaps another already-ACTIVE ContractRate on the same (shipper_id, lane_origin, lane_destination)."

  - id: ERR_QUOTE_WINDOW_OVERLAP
    http: 422
    condition: "Creating a QuoteRequest whose buffered pickup window [pickup_window_start_utc - 120min, pickup_window_end_utc) overlaps with another OPEN QuoteRequest on the same lane and shipper."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrokerOps
    description: "Broker operations staff: qualifies carriers, manages contracts, awards quotes, manages invoices, dispatches loads."
    identity: opaque
    exclusive_operations:
      - "POST /freight/shippers"
      - "POST /freight/carriers"
      - "POST /freight/carriers/{id}/qualify"
      - "POST /freight/carriers/{id}/reject"
      - "POST /freight/carriers/{id}/suspend"
      - "POST /freight/carriers/{id}/reinstate"
      - "POST /freight/contract-rates"
      - "POST /freight/contract-rates/{id}/activate"
      - "POST /freight/contract-rates/{id}/terminate"
      - "POST /freight/quote-requests/{id}/award"
      - "POST /freight/loads/{id}/cancel"
      - "POST /freight/loads/{id}/invoice"
      - "POST /freight/invoices/{id}/payments"
      - "POST /freight/factoring-requests/{id}/approve"
      - "POST /freight/factoring-requests/{id}/advance"
      - "POST /freight/factoring-requests/{id}/reject"
      - "POST /freight/dispute-claims/{id}/resolve"
      - "POST /freight/smartway-audits"
      - "GET /freight/shippers/{id}/credit-risk"
      - "POST /freight/_clock/set_current_utc"
      - "POST /freight/_clock/advance"
    shared_operations:
      - "GET /freight/shippers, GET /freight/shippers/{id}"
      - "GET /freight/carriers, GET /freight/carriers/{id}"
      - "GET /freight/contract-rates, GET /freight/contract-rates/{id}"
      - "POST /freight/quote-requests, GET /freight/quote-requests/{id}, GET /freight/quote-requests"
      - "GET /freight/loads/{id}, GET /freight/loads"
      - "POST /freight/loads/{id}/accessorials, GET /freight/loads/{id}/accessorials"
      - "GET /freight/invoices/{id}, GET /freight/invoices"
      - "GET /freight/factoring-requests/{id}, GET /freight/factoring-requests"
      - "GET /freight/dispute-claims/{id}, GET /freight/dispute-claims"
      - "GET /freight/smartway-audits"

  - name: Shipper
    description: "Shipper acting on its own resources: opens quotes, withdraws quotes, files dispute claims."
    identity: "entity_backed:Shipper"
    exclusive_operations:
      - "POST /freight/quote-requests/{id}/withdraw"
      - "POST /freight/dispute-claims"
      - "POST /freight/dispute-claims/{id}/withdraw"
    shared_operations:
      - "POST /freight/quote-requests (shared with BrokerOps; Shipper must own shipper_id == X-User-ID)"
      - "GET /freight/shippers/{id} (ownership: X-User-ID == path.id)"
      - "GET /freight/contract-rates (ownership: shipper_id filter == X-User-ID)"
      - "GET /freight/quote-requests, GET /freight/quote-requests/{id}"
      - "GET /freight/loads/{id}, GET /freight/loads"
      - "GET /freight/loads/{id}/accessorials"
      - "GET /freight/invoices/{id}, GET /freight/invoices"
      - "GET /freight/dispute-claims/{id}, GET /freight/dispute-claims"
      - "GET /freight/smartway-audits"

  - name: Carrier
    description: "Carrier acting on its own loads: pickup, deliver, file accessorials, request factoring."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /freight/loads/{id}/pickup"
      - "POST /freight/loads/{id}/deliver"
      - "POST /freight/factoring-requests"
    shared_operations:
      - "GET /freight/carriers/{id} (ownership: X-User-ID == path.id)"
      - "GET /freight/loads, GET /freight/loads/{id} (filter by carrier_id == X-User-ID)"
      - "POST /freight/loads/{id}/accessorials, GET /freight/loads/{id}/accessorials"
      - "GET /freight/invoices, GET /freight/invoices/{id}"
      - "GET /freight/factoring-requests, GET /freight/factoring-requests/{id}"
