            - "the contrast with tank-campaign half-open adjacency is the falsifiable distinction"

  - rule_id: compensating_invariant
    instances:
      - name: campaign_headroom_conserved_under_allocate_release
        grounds:
          - state_machines.Allocation.RESERVED_to_RELEASED
          - entities.Campaign.fields.unallocated_units
          - entities.Campaign.fields.expected_good_units
        distinguishing_aspect: |
          Conserved quantity = campaign planned supply units: unallocated_units plus
          the sum of units over allocations in RESERVED or FULFILLED must equal
          expected_good_units (6200) before the pair, between allocate and release,
          and after release — the compensating pair leaves zero drift.
        test_recipe:
          setup:
            - "SECURED commitment (5000/5000); campaign SCHEDULED planned 10000 -> expected_good_units 6200, unallocated 6200"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01", captures: { c_v: $.data.version } }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { camp_id: $.data.id } }
          trigger:
            - { call: "POST /glass/allocations", payload: { commitment_id: "${c_id}", campaign_id: "${camp_id}", units: 5000, expected_commitment_version: "${c_v}" }, as: CapacityPlanner, captures: { a_id: $.data.id } }
            - { call: "GET /glass/campaigns/${camp_id}", as: CapacityPlanner, captures: { unalloc_mid: $.data.unallocated_units } }
            - { call: "POST /glass/allocations/${a_id}/release", as: CapacityPlanner }
            - { call: "GET /glass/campaigns/${camp_id}", as: CapacityPlanner, captures: { unalloc_end: $.data.unallocated_units } }
          assert:
            - "after allocate: Campaign.${camp_id}.unallocated_units == 1200 and 1200 + 5000 (RESERVED) == 6200 == expected_good_units"
            - "after release: Campaign.${camp_id}.unallocated_units == 6200 and 6200 + 0 (no RESERVED/FULFILLED allocations) == 6200 == expected_good_units"
            - "the forward/compensating pair leaves the conserved supply quantity unchanged"

      - name: prepayment_cents_conserved_under_apply_and_release
        grounds:
          - state_machines.Commitment.RELEASED
          - entities.Commitment.fields.prepayment_applied_cents
          - entities.Commitment.fields.prepayment_remaining_cents
          - entities.Commitment.fields.prepayment_refunded_cents
        distinguishing_aspect: |
          Conserved quantity = prepayment money-cents (distinct from supply units):
          applied + remaining + refunded must equal prepayment_cents (2600000) after
          every step of the apply (1,000,000) then release pair.
        test_recipe:
          setup:
            - "SECURED commitment (committed 12000, required 12000, prepayment 2600000 -> base 14600, coverage 1.216667 -> TIER_A, effective 15330)"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 12000, required_units: 12000, prepayment_cents: 2600000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01" }
          trigger:
            - { call: "POST /glass/commitments/${c_id}/apply-prepayment", payload: { amount_cents: 1000000 }, as: FinanceController, as_user_id: "fin-02", captures: { applied: $.data.prepayment_applied_cents, remaining: $.data.prepayment_remaining_cents, refunded: $.data.prepayment_refunded_cents } }
            - { call: "POST /glass/commitments/${c_id}/release", payload: { reason: "program restructure" }, as: ProgramManager, captures: { applied2: $.data.prepayment_applied_cents, remaining2: $.data.prepayment_remaining_cents, refunded2: $.data.prepayment_refunded_cents, c_status: $.data.status } }
          assert:
            - "after apply: applied == 1000000, remaining == 1600000, refunded == 0; sum == 2600000 == prepayment_cents"
            - "after release: applied == 1000000, remaining == 0, refunded == 1600000; sum == 2600000 == prepayment_cents"
            - "Commitment.${c_id}.status == RELEASED"
            - "the conserved money quantity differs in kind from the supply-unit invariant of the sibling instance"
