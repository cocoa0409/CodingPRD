  - rule_id: priority_pair_validation_conflict
    instances:
      - name: shelf_blocked_priority_34_beats_feed_capacity_priority_45
        grounds:
          - validations[priority=34]
          - validations[priority=45]
          - errors[ERR_LISTING_SHELF_BLOCKED]
          - errors[ERR_FEED_CAPACITY_EXCEEDED]
          - state_machines.RetailerListing.shelf_OK_to_shelf_UNAUTHORIZED
        distinguishing_aspect: |
          The identical queue request violates both the shelf-block rule at priority 34 and the
          feed-capacity rule at priority 45; the response must be ERR_LISTING_SHELF_BLOCKED. Clearing
          only the shelf block with a shelf-status OK call and replaying the byte-identical payload
          then yields ERR_FEED_CAPACITY_EXCEEDED, proving the first response was an ordering decision
          and not a capacity misread.
        test_recipe:
          setup:
            - "Retailer BigBox is ACTIVE with min_image_count 4, feed_slot_capacity 6, max_concurrent_feed_windows 2 and three REQUIRED requirement rows (title weight 40, description weight 30, brand weight 10), so the completeness denominator D == 80 + IMAGE_WEIGHT 20 == 100"
            - "product SKU-B-1 has revision 1 PINNED on the BigBox listing with title and description present, brand ABSENT and image_count 4, and exactly three APPROVED image assets against min_image_count 4"
            - "therefore RetailerListing.completeness_score_certified == 85.00, completeness_score_declared == 90.00, readiness_score == 51.00, syndication_state == NOT_SYNDICATED, shelf_state == OK"
            - "Retailer.feed_slots_reserved == 0, Retailer.version == 1 and the logical clock stands at 2026-08-10T00:00:00Z"
            - "one observation with unauthorized_seller_count 1 (accuracy 95.00, in_stock true, rating_avg 4.00, search_rank 2) has moved the listing to shelf_state UNAUTHORIZED, raised one OPEN UNAUTHORIZED_LISTING ShelfAlert and capped readiness_score at 75.00 (0.60*85.00 + 0.40*min(95.00, 60.00))"
            - "feed_slot_capacity is 6 while feed_slots_reserved is 0, so a 10-slot request also breaks capacity"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 500, base_weight: 30.00, is_global_required: false }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
