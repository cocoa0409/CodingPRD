  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: drought_index_three_triggers_only_on_the_second_consecutive_reading
        grounds:
          - calculations.drought_trigger
          - entities.DroughtReading.fields.consecutive_severe_count
          - entities.DroughtReading.fields.triggered_destock
          - entities.Pasture.fields.drought_destock_flag
        distinguishing_aspect: |
          BOUNDARY ON A NUMERIC RUN COUNTER reached through POST
          /grazing/pastures/{id}/drought-readings: drought_index >= 3 is the severe test and
          the run must reach exactly 2 before the flag flips, so reading 1 (index 3) does
          not trigger, an index-2 reading resets the run to 0, and only the second
          consecutive index-3 reading sets drought_destock_flag.
        test_recipe:
          setup:
            - "Pasture North Bench is AVAILABLE with one DRY_MATTER assessment and no contracts."
            - "No drought readings exist and drought_destock_flag is false."
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Dana Reyes", certification_number: "RC-1102", state_code: "MT" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /grazing/pastures"
              payload: { name: "North Bench", acres: 1200, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 5000 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id, p1_v0: $.data.version }
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${p1_v0}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1800, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
            - call: "POST /grazing/pastures/${p1}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
          trigger:
            - call: "POST /grazing/pastures/${p1}/drought-readings"
              payload: { reading_date: "2026-09-01", drought_index: 3, forage_remaining_pct: 45 }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { rd1_run: $.data.consecutive_severe_count, rd1_trig: $.data.triggered_destock }
            - call: "POST /grazing/pastures/${p1}/drought-readings"
              payload: { reading_date: "2026-09-05", drought_index: 2, forage_remaining_pct: 40 }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { rd2_run: $.data.consecutive_severe_count, rd2_trig: $.data.triggered_destock }
            - call: "POST /grazing/pastures/${p1}/drought-readings"
              payload: { reading_date: "2026-09-10", drought_index: 3, forage_remaining_pct: 35 }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { rd3_run: $.data.consecutive_severe_count, rd3_trig: $.data.triggered_destock }
            - call: "POST /grazing/pastures/${p1}/drought-readings"
              payload: { reading_date: "2026-09-14", drought_index: 3, forage_remaining_pct: 30 }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { rd4_run: $.data.consecutive_severe_count, rd4_trig: $.data.triggered_destock }
          assert:
            - "${rd1_run} == 1 and ${rd1_trig} == false"
            - "${rd2_run} == 0 and ${rd2_trig} == false"
            - "${rd3_run} == 1 and ${rd3_trig} == false"
            - "${rd4_run} == 2 and ${rd4_trig} == true"
            - "Pasture.${p1}.drought_destock_flag == true"
            - "Pasture.${p1}.grazing_posture == DESTOCK_ORDERED"

      - name: pasture_activation_rejects_empty_assessment_set_then_accepts_one
        grounds:
          - validations[priority=15]
          - errors[ERR_NO_CAPACITY_ASSESSMENT]
          - state_machines.Pasture.DRAFT_to_AVAILABLE
          - entities.Pasture.fields.effective_assessment_id
        distinguishing_aspect: |
          BOUNDARY ON AN EMPTY COLLECTION — a different metric from the drought run counter
          and reached through a different endpoint, POST /grazing/pastures/{id}/status:
          zero CapacityAssessments is refused with ERR_NO_CAPACITY_ASSESSMENT (409) and the
          very first assessment makes the identical call succeed.
        test_recipe:
          setup:
            - "One Grazier and one RangeConsultant exist."
            - "Pasture North Bench is in DRAFT with zero capacity assessments, rated_head_days 0 and effective_assessment_id null."
