# =============================================================================
# SCAFFOLD — Card-Settlement Holdback Repayment Financing (Square-Loans-style)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Card-Settlement Holdback Repayment Financing (Square Loans): offer eligibility
  computed from processing history, seasonality and account tenure with
  pre-approved amounts, fixed-fee financing repaid as a percentage holdback of
  daily card settlement rather than fixed installments, minimum repayment
  requirements over a period with catch-up payment obligations, merchant
  processing migration risk where a borrower moves volume to another processor,
  offer expiration and re-underwriting on renewal, delinquency handling and
  personal guarantee enforcement, funding partner bank origination with loan
  sale and servicing retention, disclosure requirements for commercial financing
  in states that mandate them.

domain_name: card-settlement-holdback-financing
api_prefix: /lending

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Merchant legal business name" }
      - { name: state_code, type: string, source: input, description: "Two-letter uppercase US state code of principal place of business; drives disclosure mandate" }
      - { name: owner_name, type: string, source: input, description: "Primary owner full name" }
      - { name: processing_started_at, type: datetime, source: input, description: "UTC timestamp when the merchant first processed a card payment on the platform; tenure anchor" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ELIGIBLE | SUSPENDED" }
      - { name: lifetime_net_cents, type: integer, source: computed, description: "Sum of net_settled_cents over ProcessingDayBatch in status FINALIZED or SWEPT" }
      - { name: trailing_12m_months_recorded, type: integer, source: computed, description: "Distinct calendar months with at least one FINALIZED/SWEPT batch whose processing_date is within [clock-365d, clock]" }
      - { name: seasonality_index, type: number, source: computed, description: "(max_month_net - min_month_net) / avg_month_net over trailing 12m months; 4dp round_half_up" }
      - { name: trailing_30d_net_cents, type: integer, source: computed, description: "Sum net_settled_cents of FINALIZED/SWEPT batches with processing_date in [clock-30d, clock)" }
      - { name: prior_30d_net_cents, type: integer, source: computed, description: "Sum net_settled_cents of FINALIZED/SWEPT batches with processing_date in [clock-60d, clock-30d)" }
      - { name: trailing_30d_chargeback_ratio, type: number, source: computed, description: "chargebacks_cents sum / net_settled_cents sum over trailing 30d window; 0 when net sum is 0; 4dp round_half_up" }
      - { name: active_loan_id, type: string, source: system, description: "id of the merchant's non-terminal Loan, null when none" }
      - { name: loans_repaid_count, type: integer, source: system, default: 0, description: "Count of loans that reached REPAID" }

  - name: ProcessingDayBatch
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; owning merchant" }
      - { name: processing_date, type: string, source: input, description: "Calendar date YYYY-MM-DD the batch settles; unique per merchant" }
      - { name: gross_cents, type: integer, source: input, description: "Gross card volume for the day" }
      - { name: refunds_cents, type: integer, source: input, default: 0, description: "Refunds for the day" }
      - { name: chargebacks_cents, type: integer, source: input, default: 0, description: "Chargebacks for the day" }
      - { name: net_settled_cents, type: integer, source: computed, description: "gross_cents - refunds_cents - chargebacks_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | SWEPT" }

  - name: LoanOffer
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; offer recipient" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | ACCEPTED | EXPIRED | REUNDERWRITING | WITHDRAWN" }
      - { name: trailing_12m_avg_net_cents, type: integer, source: computed, description: "Average monthly net over trailing 12m at generation time" }
      - { name: seasonality_index_at_generation, type: number, source: computed, description: "Merchant seasonality_index snapshot at generation" }
      - { name: preapproved_standard_cents, type: integer, source: computed, description: "STANDARD variant pre-approval (no seasonality haircut), floored to $500" }
      - { name: preapproved_conservative_cents, type: integer, source: computed, description: "CONSERVATIVE variant pre-approval (0.70 haircut), floored to $500" }
      - { name: preapproved_cents, type: integer, source: computed, description: "Selected pre-approval: CONSERVATIVE when seasonality_index_at_generation > 0.75 else STANDARD" }
      - { name: issued_at, type: datetime, source: system, description: "Clock timestamp when offer entered OFFERED; null until issued" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + 30 days; offer accept window is half-open [issued_at, expires_at)" }
      - { name: accepted_principal_cents, type: integer, source: system, description: "Principal chosen at acceptance; null until accepted" }
      - { name: accepted_holdback_pct, type: number, source: system, description: "Holdback fraction chosen at acceptance; null until accepted" }
      - { name: accepted_loan_id, type: string, source: system, description: "id of the Loan created by acceptance; null until accepted" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of times this offer has been renewed via REUNDERWRITING" }
      - { name: generated_by, type: string, source: system, description: "X-User-ID of the Underwriter who generated the offer" }

  - name: Guarantor
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; guaranteed loan" }
      - { name: full_name, type: string, source: input, description: "Guarantor legal name" }
      - { name: email, type: string, source: input, description: "Guarantor contact email" }
      - { name: guarantee_cap_cents, type: integer, source: input, description: "Maximum amount enforceable under the personal guarantee" }
      - { name: status, type: enum, source: system, description: "LINKED | ACTIVE | ENFORCED | RELEASED" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Clock timestamp of guarantee acknowledgment; null until ACTIVE" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; borrowing merchant" }
      - { name: offer_id, type: string, source: system, description: "FK -> LoanOffer.id; originating offer" }
      - { name: principal_cents, type: integer, source: system, description: "Accepted principal" }
      - { name: holdback_pct, type: number, source: system, description: "Accepted holdback fraction of daily net settlement" }
      - { name: fee_rate, type: number, source: computed, description: "Tiered fee rate: principal <= 2500000 -> 0.11; <= 10000000 -> 0.13; else 0.15" }
      - { name: fee_cents, type: integer, source: computed, description: "round_half_up(principal_cents * fee_rate), whole cents" }
      - { name: total_repayment_cents, type: integer, source: computed, description: "principal_cents + fee_cents (evaluation order pinned: principal -> fee_rate -> fee_cents -> total)" }
      - { name: per_period_minimum_cents, type: integer, source: computed, description: "floor(total_repayment_cents / 18); minimum due per 60-day repayment period" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "total_repayment_cents minus applied sweeps, applied catch-ups, and enforcement draws" }
      - { name: paid_to_date_cents, type: integer, source: computed, description: "Sum of applied sweeps + applied catch-ups + enforcement draws" }
      - { name: repayment_period_index, type: integer, source: system, default: 0, description: "Zero-based current 60-day period; period p covers [activated_day + 60p, activated_day + 60(p+1))" }
      - { name: consecutive_missed_periods, type: integer, source: system, default: 0, description: "Consecutive evaluated periods below minimum" }
      - { name: carried_surplus_cents, type: integer, source: system, default: 0, description: "Over-minimum amount carried into the next period's evaluation" }
      - { name: cumulative_shortfall_cents, type: integer, source: system, default: 0, description: "Accumulated under-minimum amount across missed periods, reduced by catch-ups before period credit" }
      - { name: status, type: enum, source: system, description: "PENDING_DISCLOSURE | PENDING_ACK | ACTIVE | DELINQUENT | DEFAULTED | REPAID | CHARGED_OFF" }
      - { name: disclosure_required, type: boolean, source: computed, description: "true when merchant state_code in {CA, NY, UT, VA} at acceptance" }
      - { name: activated_at, type: datetime, source: system, description: "Clock timestamp of activation; null until ACTIVE" }
      - { name: servicing_retained, type: boolean, source: system, default: true, description: "Platform retains servicing even after a SETTLED LoanSale" }

  - name: DisclosureStatement
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; disclosed loan" }
      - { name: status, type: enum, source: system, description: "GENERATED | DELIVERED | ACKNOWLEDGED" }
      - { name: mandate_state, type: boolean, source: computed, description: "true when loan.disclosure_required" }
      - { name: apr_scheduled, type: number, source: computed, description: "SCHEDULED variant: fee_rate * (365 / 1080), 4dp round_half_up" }
      - { name: apr_projected, type: number, source: computed, description: "PROJECTED variant: fee_rate * (365 / projected_term_days); projected_term_days = ceil(total_repayment_cents / daily_pace_cents); daily_pace_cents = (trailing-90d FINALIZED/SWEPT net sum / 90) * holdback_pct; 4dp round_half_up" }
      - { name: disclosed_apr_basis, type: enum, source: computed, description: "PROJECTED when mandate_state else SCHEDULED" }
      - { name: estimated_term_days, type: integer, source: computed, description: "projected_term_days when mandate_state else 1080" }
      - { name: delivered_at, type: datetime, source: system, description: "Clock timestamp of delivery; null until DELIVERED" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Clock timestamp of acknowledgment; null until ACKNOWLEDGED" }
      - { name: cooling_required, type: boolean, source: computed, description: "true when mandate_state; acknowledgment allowed only at or after delivered_at + 24h" }

  - name: SettlementSweep
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan repaid by this sweep" }
      - { name: batch_id, type: string, source: system, description: "FK -> ProcessingDayBatch.id; batch swept" }
      - { name: holdback_cents, type: integer, source: computed, description: "round_half_up(batch.net_settled_cents * loan.holdback_pct), clipped to loan.remaining_balance_cents at posting" }
      - { name: clipped, type: boolean, source: computed, description: "true when raw holdback exceeded remaining balance and was clipped" }
      - { name: swept_date, type: string, source: system, description: "processing_date of the swept batch; determines repayment-period attribution" }
      - { name: status, type: enum, source: system, description: "APPLIED | REVERSED" }
      - { name: reversed_at, type: datetime, source: system, description: "Clock timestamp of reversal; null while APPLIED" }

  - name: CatchUpPayment
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan paid down" }
      - { name: amount_cents, type: integer, source: input, description: "Out-of-band payment amount" }
      - { name: period_index_credited, type: integer, source: system, description: "Loan.repayment_period_index at settle time; attribution for minimum evaluation" }
      - { name: status, type: enum, source: system, description: "INITIATED | APPLIED | FAILED | REVERSED" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; defaulted loan enforced" }
      - { name: guarantor_id, type: string, source: system, description: "FK -> Guarantor.id; guarantee being enforced" }
      - { name: status, type: enum, source: system, description: "DRAFT | DEMANDED | ESCALATED | DRAWN | RELEASED" }
      - { name: demanded_at, type: datetime, source: system, description: "Clock timestamp of demand; null until DEMANDED" }
      - { name: window_end, type: datetime, source: computed, description: "demanded_at + 30 days; closed interval [demanded_at, window_end] blocks new demands on the same guarantor and gates escalation" }
      - { name: draw_amount_cents, type: integer, source: computed, description: "min(loan.remaining_balance_cents, guarantor.guarantee_cap_cents) at draw time; null until DRAWN" }

  - name: FundingPartnerBank
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Originating partner bank name" }
      - { name: purchase_discount_pct, type: number, source: input, description: "Discount off remaining balance when purchasing a loan" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: committed_exposure_cents, type: integer, source: computed, description: "Sum of purchase_price_cents over LoanSale in COMMITTED status for this bank" }

  - name: LoanSale
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan being sold" }
      - { name: bank_id, type: string, source: input, description: "FK -> FundingPartnerBank.id; purchasing bank" }
      - { name: status, type: enum, source: system, description: "QUOTED | COMMITTED | SETTLED | FAILED" }
      - { name: purchase_price_cents, type: integer, source: computed, description: "round_half_up(loan.remaining_balance_cents * (1 - bank.purchase_discount_pct)) at quote/requote" }
      - { name: reserve_withheld_cents, type: integer, source: computed, description: "round_half_up(purchase_price_cents * 0.05) at settle" }
      - { name: bank_remittance_cents, type: integer, source: computed, description: "purchase_price_cents - reserve_withheld_cents at settle" }
      - { name: committed_by_user_id, type: string, source: system, description: "X-User-ID of committing BankOfficer" }
      - { name: settled_by_user_id, type: string, source: system, description: "X-User-ID of settling BankOfficer; must differ from committed_by_user_id" }

  - name: MigrationSignal
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; merchant evaluated for processor migration" }
      - { name: status, type: enum, source: system, description: "DETECTED | CONFIRMED | CLEARED | DISMISSED" }
      - { name: drop_ratio, type: number, source: computed, description: "1 - trailing_30d_net_cents / prior_30d_net_cents; 0 when prior window net is 0; 4dp round_half_up" }
      - { name: volume_only_would_trigger, type: boolean, source: computed, description: "VOLUME_ONLY variant verdict: drop_ratio >= 0.60 AND trailing_30d_net_cents > 0" }
      - { name: triggered, type: boolean, source: computed, description: "Active variant VOLUME_AND_CHARGEBACK verdict: volume_only_would_trigger OR trailing_30d_chargeback_ratio > 0.03; when false, GET /lending/merchants/{id}/migration_signals returns an empty array for this evaluation (no row created)" }
      - { name: evaluated_at, type: datetime, source: system, description: "Clock timestamp of evaluation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Merchant
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ELIGIBLE
        trigger: "POST /lending/merchants/{merchantId}/activate"
        actor: PlatformAdmin
        preconditions:
          - "clock - processing_started_at >= 365 days (ERR_MERCHANT_TENURE_INSUFFICIENT)"
          - "lifetime_net_cents >= 10000000 (ERR_MERCHANT_VOLUME_INSUFFICIENT)"
        side_effects:
          - "Merchant aggregates recomputed from FINALIZED/SWEPT batches"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /lending/migration_signals/{signalId}/confirm (cascade) OR Loan DELINQUENT/DEFAULTED cascade"
        actor: ServicerAgent | system
        preconditions: []
        side_effects:
          - "Offer creation for this merchant blocked with ERR_MERCHANT_SUSPENDED while SUSPENDED"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /lending/merchants/{merchantId}/reinstate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: ProcessingDayBatch
    initial_state: OPEN
    terminal_states: [SWEPT]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /lending/processing_batches/{batchId}/finalize"
        actor: ServicerAgent
        preconditions: []
        side_effects:
          - "Merchant.lifetime_net_cents, trailing windows, seasonality_index, trailing_12m_months_recorded recomputed (bump Merchant.version)"
      - from: FINALIZED
        to: SWEPT
        trigger: "POST /lending/loans/{loanId}/sweeps (cascade from sweep creation referencing this batch)"
        actor: ServicerAgent
        preconditions:
          - "Referenced loan is ACTIVE or DELINQUENT"
        side_effects:
          - "SettlementSweep created in APPLIED status"

  - entity: LoanOffer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /lending/offers/{offerId}/issue"
        actor: Underwriter
        preconditions:
          - "No other offer for this merchant in OFFERED (ERR_OFFER_OVERLAP_ACTIVE)"
        side_effects:
          - "issued_at = clock; expires_at = clock + 30 days"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (lazy: evaluated on any read/renew/accept when clock >= expires_at)"
        actor: system
        preconditions:
          - "clock >= expires_at (half-open accept window [issued_at, expires_at) is closed)"
        side_effects: []
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /lending/offers/{offerId}/accept"
        actor: MerchantOwner
        preconditions:
          - "clock < expires_at (ERR_OFFER_EXPIRED)"
          - "expected_merchant_version matches Merchant.version (ERR_STALE_VERSION)"
          - "Merchant.active_loan_id is null (ERR_MERCHANT_HAS_ACTIVE_LOAN)"
          - "accepted_holdback_pct in {0.08, 0.10, 0.14} (ERR_HOLDBACK_PCT_NOT_OFFERED)"
          - "selected_principal_cents <= preapproved_cents (ERR_OFFER_AMOUNT_EXCEEDS_PREAPPROVED)"
        side_effects:
          - "Loan created (PENDING_DISCLOSURE when merchant.state_code in {CA,NY,UT,VA} at this moment, else PENDING_ACK) with computed fee/totals"
          - "Guarantor created in LINKED"
          - "DisclosureStatement created in GENERATED with both APR variants"
          - "Merchant.active_loan_id set; Merchant.version incremented"
      - from: EXPIRED
        to: REUNDERWRITING
        trigger: "POST /lending/offers/{offerId}/renew"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "Re-underwrite: recompute trailing_12m_avg_net_cents, seasonality_index_at_generation, preapproved_standard_cents, preapproved_conservative_cents, preapproved_cents from current merchant aggregates"
          - "renewal_count += 1"
      - from: OFFERED
        to: REUNDERWRITING
        trigger: "POST /lending/offers/{offerId}/renew (permitted directly when clock >= expires_at; treated as passing through EXPIRED)"
        actor: Underwriter
        preconditions:
          - "clock >= expires_at"
        side_effects:
          - "Same re-underwrite recompute as EXPIRED -> REUNDERWRITING; renewal_count += 1"
      - from: REUNDERWRITING
        to: OFFERED
        trigger: "POST /lending/offers/{offerId}/issue"
        actor: Underwriter
        preconditions:
          - "No other offer for this merchant in OFFERED (ERR_OFFER_OVERLAP_ACTIVE)"
        side_effects:
          - "issued_at = clock; expires_at = clock + 30 days (renewed offer carries refreshed amounts and a fresh window)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /lending/offers/{offerId}/withdraw"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /lending/offers/{offerId}/withdraw"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: WITHDRAWN
        trigger: "POST /lending/offers/{offerId}/withdraw"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: REUNDERWRITING
        to: WITHDRAWN
        trigger: "POST /lending/offers/{offerId}/withdraw"
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: Guarantor
    initial_state: LINKED
    terminal_states: [RELEASED]
    transitions:
      - from: LINKED
        to: ACTIVE
        trigger: "POST /lending/guarantors/{guarantorId}/acknowledge"
        actor: GuarantorPrincipal
        preconditions:
          - "X-User-ID equals this Guarantor.id"
        side_effects:
          - "acknowledged_at = clock"
      - from: ACTIVE
        to: ENFORCED
        trigger: "POST /lending/enforcement_actions/{actionId}/draw (cascade)"
        actor: ServicerAgent
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /lending/enforcement_actions/{actionId}/release (cascade) when no other non-terminal EnforcementAction references this guarantor and the loan is terminal"
        actor: ServicerAgent
        preconditions: []
        side_effects: []
      - from: ENFORCED
        to: RELEASED
        trigger: "POST /lending/enforcement_actions/{actionId}/release (cascade) after draw when loan is terminal"
        actor: ServicerAgent
        preconditions: []
        side_effects: []

  - entity: Loan
    initial_state: PENDING_DISCLOSURE
    terminal_states: [REPAID, CHARGED_OFF]
    transitions:
      - from: PENDING_DISCLOSURE
        to: ACTIVE
        trigger: "POST /lending/loans/{loanId}/activate"
        actor: ServicerAgent
        preconditions:
          - "DisclosureStatement for this loan is ACKNOWLEDGED (ERR_DISCLOSURE_NOT_ACKNOWLEDGED)"
          - "Guarantor for this loan is ACTIVE (ERR_GUARANTOR_NOT_ACTIVE)"
        side_effects:
          - "activated_at = clock; repayment_period_index = 0"
      - from: PENDING_ACK
        to: ACTIVE
        trigger: "POST /lending/loans/{loanId}/activate"
        actor: ServicerAgent
        preconditions:
          - "DisclosureStatement for this loan is DELIVERED or ACKNOWLEDGED (ERR_DISCLOSURE_NOT_DELIVERED)"
          - "Guarantor for this loan is ACTIVE (ERR_GUARANTOR_NOT_ACTIVE)"
        side_effects:
          - "activated_at = clock; repayment_period_index = 0"
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /lending/loans/{loanId}/evaluate_period (cascade: consecutive_missed_periods reaches 2)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: Merchant -> SUSPENDED (offer creation blocked)"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /lending/loans/{loanId}/evaluate_period (cure: evaluated period MET and cumulative_shortfall_cents == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_missed_periods reset to 0 (Merchant remains SUSPENDED until reinstate)"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /lending/loans/{loanId}/evaluate_period (cascade: consecutive_missed_periods reaches 4)"
        actor: system
        preconditions: []
        side_effects:
          - "EnforcementAction created in DRAFT referencing this loan and its guarantor (cascade hop)"
          - "Merchant remains SUSPENDED"
      - from: ACTIVE
        to: REPAID
        trigger: "system (automatic when remaining_balance_cents reaches 0 via sweep, catch-up, or enforcement draw)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: Merchant.active_loan_id cleared, loans_repaid_count += 1, Merchant.version incremented"
          - "Cascade hop 3: when Merchant.status is ELIGIBLE, a renewal LoanOffer is auto-created in DRAFT with recomputed pre-approval amounts"
      - from: DELINQUENT
        to: REPAID
        trigger: "system (automatic when remaining_balance_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE -> REPAID (merchant cleared, renewal offer generated when ELIGIBLE)"
      - from: DEFAULTED
        to: REPAID
        trigger: "system (automatic when enforcement draw or catch-up brings remaining_balance_cents to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Merchant cascade as ACTIVE -> REPAID; open EnforcementAction for this loan -> RELEASED"
      - from: DEFAULTED
        to: CHARGED_OFF
        trigger: "POST /lending/loans/{loanId}/charge_off"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Merchant.active_loan_id cleared; open EnforcementAction for this loan -> RELEASED"

  - entity: DisclosureStatement
    initial_state: GENERATED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: GENERATED
        to: DELIVERED
        trigger: "POST /lending/disclosures/{disclosureId}/deliver"
        actor: ServicerAgent
        preconditions: []
        side_effects:
          - "delivered_at = clock"
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /lending/disclosures/{disclosureId}/acknowledge"
        actor: MerchantOwner
        preconditions:
          - "X-User-ID equals the loan's merchant_id"
          - "when cooling_required: clock >= delivered_at + 24 hours (ERR_DISCLOSURE_COOLING_NOT_ELAPSED)"
        side_effects:
          - "acknowledged_at = clock"

  - entity: SettlementSweep
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /lending/sweeps/{sweepId}/reverse"
        actor: ServicerAgent
        preconditions:
          - "Loan is ACTIVE or DELINQUENT (ERR_LOAN_ALREADY_TERMINAL)"
        side_effects:
          - "Loan.remaining_balance_cents += holdback_cents; Loan.paid_to_date_cents -= holdback_cents (compensating)"
          - "Batch returns SWEPT -> FINALIZED"

  - entity: CatchUpPayment
    initial_state: INITIATED
    terminal_states: [APPLIED, FAILED, REVERSED]
    transitions:
      - from: INITIATED
        to: APPLIED
        trigger: "POST /lending/catch_up_payments/{paymentId}/settle"
        actor: ServicerAgent
        preconditions:
          - "Loan is ACTIVE or DELINQUENT or DEFAULTED (ERR_LOAN_ALREADY_TERMINAL)"
          - "amount_cents <= loan.remaining_balance_cents (ERR_CATCHUP_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "period_index_credited = loan.repayment_period_index"
          - "Loan.remaining_balance_cents -= amount_cents; paid_to_date_cents += amount_cents"
          - "Application order: amount first reduces cumulative_shortfall_cents; excess counts toward the current period"
      - from: INITIATED
        to: FAILED
        trigger: "POST /lending/catch_up_payments/{paymentId}/fail"
        actor: ServicerAgent
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: REVERSED
        trigger: "POST /lending/catch_up_payments/{paymentId}/reverse"
        actor: ServicerAgent
        preconditions:
          - "Loan is not REPAID or CHARGED_OFF (ERR_LOAN_ALREADY_TERMINAL)"
        side_effects:
          - "Loan.remaining_balance_cents += amount_cents; paid_to_date_cents -= amount_cents; shortfall/period attribution unwound"

  - entity: EnforcementAction
    initial_state: DRAFT
    terminal_states: [DRAWN, RELEASED]
    transitions:
      - from: DRAFT
        to: DEMANDED
        trigger: "POST /lending/enforcement_actions/{actionId}/demand"
        actor: ServicerAgent
        preconditions:
          - "No other EnforcementAction whose guarantor email equals this action's guarantor email, in DEMANDED or ESCALATED status, with clock <= its window_end (closed interval; ERR_ENFORCEMENT_WINDOW_OPEN)"
        side_effects:
          - "demanded_at = clock; window_end = clock + 30 days"
      - from: DEMANDED
        to: ESCALATED
        trigger: "POST /lending/enforcement_actions/{actionId}/escalate"
        actor: ServicerAgent
        preconditions:
          - "clock >= window_end (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: ESCALATED
        to: DRAWN
        trigger: "POST /lending/enforcement_actions/{actionId}/draw"
        actor: ServicerAgent
        preconditions:
          - "Loan is DEFAULTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "draw_amount_cents = min(loan.remaining_balance_cents, guarantor.guarantee_cap_cents)"
          - "Loan.remaining_balance_cents -= draw_amount_cents; paid_to_date_cents += draw_amount_cents"
          - "Guarantor -> ENFORCED; if remaining hits 0 the Loan REPAID cascade fires"
      - from: DRAFT
        to: RELEASED
        trigger: "POST /lending/enforcement_actions/{actionId}/release"
        actor: ServicerAgent
        preconditions:
          - "Loan is REPAID or CHARGED_OFF (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Guarantor -> RELEASED when no other non-terminal action references it"
      - from: DEMANDED
        to: RELEASED
        trigger: "POST /lending/enforcement_actions/{actionId}/release"
        actor: ServicerAgent
        preconditions:
          - "Loan is REPAID or CHARGED_OFF"
        side_effects:
          - "Guarantor -> RELEASED when no other non-terminal action references it"
      - from: ESCALATED
        to: RELEASED
        trigger: "POST /lending/enforcement_actions/{actionId}/release"
        actor: ServicerAgent
        preconditions:
          - "Loan is REPAID or CHARGED_OFF"
        side_effects:
          - "Guarantor -> RELEASED when no other non-terminal action references it"
      - from: DRAWN
        to: RELEASED
        trigger: "POST /lending/enforcement_actions/{actionId}/release"
        actor: ServicerAgent
        preconditions:
          - "Loan is REPAID or CHARGED_OFF"
        side_effects: []

  - entity: FundingPartnerBank
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lending/funding_banks/{bankId}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "New LoanSale quotes and commits for this bank rejected with ERR_BANK_INACTIVE"

  - entity: LoanSale
    initial_state: QUOTED
    terminal_states: [SETTLED, FAILED]
    transitions:
      - from: QUOTED
        to: COMMITTED
        trigger: "POST /lending/sales/{saleId}/commit"
        actor: BankOfficer
        preconditions:
          - "Bank is ACTIVE (ERR_BANK_INACTIVE)"
        side_effects:
          - "committed_by_user_id = X-User-ID; bank.committed_exposure_cents += purchase_price_cents"
      - from: COMMITTED
        to: SETTLED
        trigger: "POST /lending/sales/{saleId}/settle"
        actor: BankOfficer
        preconditions:
          - "X-User-ID != committed_by_user_id (segregation of duties; ERR_SOD_SAME_USER)"
          - "Loan is ACTIVE (ERR_LOAN_NOT_ACTIVE)"
          - "Bank is ACTIVE (ERR_BANK_INACTIVE)"
        side_effects:
          - "reserve_withheld_cents = round_half_up(purchase_price_cents * 0.05); bank_remittance_cents = purchase_price_cents - reserve_withheld_cents"
          - "bank.committed_exposure_cents -= purchase_price_cents"
          - "settled_by_user_id = X-User-ID; loan.servicing_retained stays true"
      - from: COMMITTED
        to: FAILED
        trigger: "POST /lending/sales/{saleId}/fail"
        actor: BankOfficer
        preconditions: []
        side_effects:
          - "bank.committed_exposure_cents -= purchase_price_cents (compensating)"
      - from: FAILED
        to: QUOTED
        trigger: "POST /lending/sales/{saleId}/requote"
        actor: BankOfficer
        preconditions:
          - "Bank is ACTIVE (ERR_BANK_INACTIVE)"
        side_effects:
          - "purchase_price_cents recomputed from current loan.remaining_balance_cents"

  - entity: MigrationSignal
    initial_state: DETECTED
    terminal_states: [CLEARED, DISMISSED]
    transitions:
      - from: DETECTED
        to: CONFIRMED
        trigger: "POST /lending/migration_signals/{signalId}/confirm"
        actor: ServicerAgent
        preconditions: []
        side_effects:
          - "Merchant -> SUSPENDED (offer creation blocked; existing loans unaffected)"
      - from: DETECTED
        to: DISMISSED
        trigger: "POST /lending/migration_signals/{signalId}/dismiss"
        actor: ServicerAgent
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CLEARED
        trigger: "POST /lending/migration_signals/{signalId}/clear"
        actor: ServicerAgent
        preconditions: []
        side_effects: []
        note: "Merchant reinstatement is a separate explicit PlatformAdmin action."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-accept-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /lending/offers/{offerId}/accept"
    occ_field: "expected_merchant_version"
    description: |
      Accepting an offer against a Merchant whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just accepted an offer for the merchant (which legitimately
      sets active_loan_id and supersedes the client view) and the current
      writer's view of the merchant is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: sweep-post-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /lending/loans/{loanId}/sweeps"
    occ_field: "expected_loan_version"
    description: |
      Posting a settlement sweep against a Loan whose version has advanced since
      the client last observed it is rejected. A sweep mutates
      remaining_balance_cents, so a client holding a stale balance view must
      re-read the loan before posting the next sweep.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_settled
    trigger: "ProcessingDayBatch creation"
    algorithm: aggregation
    formula: |
      net_settled_cents = gross_cents - refunds_cents - chargebacks_cents
    input_set: "The batch being created"
    precision: "whole cents (integer)"

  - name: merchant_aggregates
    trigger: "batch finalize, sweep creation/reversal (batch leaves/enters FINALIZED+SWEPT set)"
    algorithm: aggregation
    formula: |
      Included batches: status in {FINALIZED, SWEPT}.
      lifetime_net_cents = sum(net_settled_cents) over all included batches.
      trailing_12m set: processing_date within [clock - 365 days, clock].
      monthly_net[m] = sum of net_settled_cents grouped by calendar month of processing_date.
      trailing_12m_months_recorded = count of distinct months in trailing_12m set.
      avg_month_net = sum(monthly_net) / trailing_12m_months_recorded (exact rational until used).
      seasonality_index = (max(monthly_net) - min(monthly_net)) / avg_month_net, 4dp round_half_up;
        0 when trailing_12m_months_recorded == 0.
      trailing_30d_net_cents = sum over processing_date in [clock - 30d, clock).
      prior_30d_net_cents = sum over processing_date in [clock - 60d, clock - 30d).
      trailing_30d_chargeback_ratio = (sum chargebacks_cents over trailing 30d) / trailing_30d_net_cents,
        4dp round_half_up; 0 when trailing_30d_net_cents == 0.
    input_set: "Batches of the merchant in status FINALIZED or SWEPT, filtered by processing_date windows anchored at the logical clock"
    precision: "integer cents; ratios 4dp round_half_up"

  - name: offer_preapproval
    trigger: "offer generation (POST /lending/merchants/{merchantId}/offers) and re-underwriting (renew)"
    algorithm: tiered_pricing
    formula: |
      Requires trailing_12m_months_recorded >= 12 (else ERR_MERCHANT_VOLUME_INSUFFICIENT).
      base_cents = avg_month_net_cents * OFFER_MONTHS_MULT          # avg exact, then truncate to cents
      standard_raw = base_cents
      conservative_raw = base_cents * CONSERVATIVE_HAIRCUT
      preapproved_standard_cents = floor(standard_raw / OFFER_ROUND_STEP_CENTS) * OFFER_ROUND_STEP_CENTS
      preapproved_conservative_cents = floor(conservative_raw / OFFER_ROUND_STEP_CENTS) * OFFER_ROUND_STEP_CENTS
      if seasonality_index > SEASONALITY_THRESHOLD:
        preapproved_cents = preapproved_conservative_cents
      else:
        preapproved_cents = preapproved_standard_cents
    input_set: "Merchant aggregates from merchant_aggregates at generation/renewal time"
    constants:
      OFFER_MONTHS_MULT: 1.25
      CONSERVATIVE_HAIRCUT: 0.70
      SEASONALITY_THRESHOLD: 0.75
      OFFER_ROUND_STEP_CENTS: 50000
      MIN_MONTHS_RECORDED: 12
    precision: "whole cents; seasonality comparison uses the 4dp rounded index"
    variants:
      - name: STANDARD
        when: "seasonality_index <= 0.75"
        difference: "No haircut: avg_month_net * 1.25 floored to $500"
      - name: CONSERVATIVE
        when: "seasonality_index > 0.75"
        difference: "0.70 haircut applied before flooring; identical history therefore yields a lower pre-approval"

  - name: loan_fee_and_minimum
    trigger: "offer acceptance (Loan creation)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (circular-looking dependency made explicit):
      1. principal_cents = accepted selected_principal_cents
      2. fee_rate = 0.11 if principal_cents <= 2500000
                  0.13 if principal_cents <= 10000000
                  0.15 otherwise
      3. fee_cents = round_half_up(principal_cents * fee_rate)   # whole cents
      4. total_repayment_cents = principal_cents + fee_cents
      5. per_period_minimum_cents = floor(total_repayment_cents / 18)
      remaining_balance_cents initialized to total_repayment_cents; paid_to_date_cents = 0.
    input_set: "The accepted offer and its selected principal"
    constants:
      TIER1_CAP_CENTS: 2500000
      TIER1_RATE: 0.11
      TIER2_CAP_CENTS: 10000000
      TIER2_RATE: 0.13
      TIER3_RATE: 0.15
      MIN_REPAYMENT_FRACTION_DENOM: 18
    precision: "whole cents; fee round_half_up; minimum floor"

  - name: daily_holdback
    trigger: "sweep creation (POST /lending/loans/{loanId}/sweeps)"
    algorithm: aggregation
    formula: |
      Rounding order is pinned: round PER DAY, then accumulate.
      raw_cents = batch.net_settled_cents * loan.holdback_pct
      daily_cents = round_half_up(raw_cents)          # per-day rounding, NOT weekly-sum-then-round
      holdback_cents = min(daily_cents, loan.remaining_balance_cents)
      clipped = (daily_cents > loan.remaining_balance_cents)
    input_set: "The referenced FINALIZED batch and the loan's current remaining balance"
    precision: "whole cents, round_half_up per day"
    note: "Weekly aggregation then rounding is a valid alternative interpretation and yields different cents; this scaffold pins per-day rounding."

  - name: period_minimum_evaluation
    trigger: "POST /lending/loans/{loanId}/evaluate_period"
    algorithm: threshold
    formula: |
      Requires clock >= activated_at + 60 * (repayment_period_index + 1) days (else ERR_PERIOD_NOT_ELAPSED).
      Window for period p: [activated_at + 60p days, activated_at + 60(p+1) days).
      paid_in_period = sum(holdback_cents of APPLIED sweeps with swept_date in window)
                     + sum(amount_cents of APPLIED catch-ups with period_index_credited == p,
                           counted at the portion exceeding shortfall reduction)
      effective_paid = paid_in_period + carried_surplus_cents
      if effective_paid >= per_period_minimum_cents:          # boundary: >= is MET
        carried_surplus_cents = effective_paid - per_period_minimum_cents
        consecutive_missed_periods = 0
        if status == DELINQUENT and cumulative_shortfall_cents == 0: status -> ACTIVE (cure)
      else:
        consecutive_missed_periods += 1
        cumulative_shortfall_cents += (per_period_minimum_cents - effective_paid)
        carried_surplus_cents = 0
        if consecutive_missed_periods >= 4: status -> DEFAULTED (enforcement cascade)
        elif consecutive_missed_periods >= 2: status -> DELINQUENT (merchant suspension cascade)
      repayment_period_index += 1
    input_set: "APPLIED sweeps and catch-ups attributed to the closing period; loan counters"
    constants:
      MIN_REPAYMENT_PERIOD_DAYS: 60
      PERIODS_TO_DELINQUENT: 2
      PERIODS_TO_DEFAULT: 4
    precision: "whole cents; >= boundary inclusive"

  - name: migration_risk
    trigger: "POST /lending/merchants/{merchantId}/migration_signals/evaluate"
    algorithm: weighted_scoring
    formula: |
      drop_ratio = 1 - trailing_30d_net_cents / prior_30d_net_cents; 0 when prior_30d_net_cents == 0; 4dp round_half_up
      volume_only_would_trigger = (drop_ratio >= MIGRATION_DROP_THRESHOLD) AND (trailing_30d_net_cents > 0)
      triggered = volume_only_would_trigger OR (trailing_30d_chargeback_ratio > CHARGEBACK_SPIKE_RATIO)
      A MigrationSignal is created (DETECTED) iff triggered; when not triggered no row is created and the
      response reports triggered=false inline.
    input_set: "Merchant window aggregates from merchant_aggregates"
    constants:
      MIGRATION_DROP_THRESHOLD: 0.60
      CHARGEBACK_SPIKE_RATIO: 0.03
    precision: "4dp round_half_up; threshold >= inclusive for drop, > strict for chargeback"
    variants:
      - name: VOLUME_ONLY
        when: "Diagnostic comparison variant, reported as volume_only_would_trigger"
        difference: "Considers only the volume drop ratio; ignores chargeback spikes"
      - name: VOLUME_AND_CHARGEBACK
        when: "Active variant (drives signal creation)"
        difference: "Additionally triggers on chargeback ratio > 3% even when volume drop is below threshold"

  - name: disclosure_apr_equivalent
    trigger: "DisclosureStatement generation (offer acceptance)"
    algorithm: forward_looking
    formula: |
      apr_scheduled = fee_rate * (365 / SCHEDULED_TERM_DAYS)                       # 4dp round_half_up
      daily_pace_cents = (sum of net_settled_cents over FINALIZED/SWEPT batches
                          with processing_date in [accept_day - 90 days, accept_day]) / 90 * holdback_pct
      if daily_pace_cents <= 0: projected_term_days = SCHEDULED_TERM_DAYS
      else: projected_term_days = ceil(total_repayment_cents / daily_pace_cents)
      apr_projected = fee_rate * (365 / projected_term_days)                       # 4dp round_half_up
      disclosed_apr_basis = PROJECTED when loan.disclosure_required else SCHEDULED
      estimated_term_days = projected_term_days when loan.disclosure_required else SCHEDULED_TERM_DAYS
    input_set: "The new loan's fee_rate/holdback/total and the merchant's trailing-90d batches (closed window, both ends inclusive)"
    constants:
      SCHEDULED_TERM_DAYS: 1080
      PACE_WINDOW_DAYS: 90
    precision: "4dp round_half_up"
    variants:
      - name: SCHEDULED
        when: "Non-mandate states (informational disclosure)"
        difference: "Assumes the maximum scheduled term of 1080 days; lower APR-equivalent"
      - name: PROJECTED
        when: "Mandate states {CA, NY, UT, VA}"
        difference: "Term projected from trailing-90d holdback pace; faster pace yields a higher disclosed APR-equivalent for identical loan terms"

  - name: sale_purchase_price
    trigger: "LoanSale quote/requote (purchase price), settle (reserve/remittance)"
    algorithm: waterfall_allocation
    formula: |
      At quote/requote:
        purchase_price_cents = round_half_up(loan.remaining_balance_cents * (1 - bank.purchase_discount_pct))
      At settle (waterfall over purchase_price_cents, ordered buckets):
        bucket 1 (reserve):  reserve_withheld_cents = round_half_up(purchase_price_cents * SALE_RESERVE_PCT)
        bucket 2 (bank):     bank_remittance_cents  = purchase_price_cents - reserve_withheld_cents
      Invariant: reserve_withheld_cents + bank_remittance_cents == purchase_price_cents.
    input_set: "The loan's current remaining balance and the bank's discount"
    constants:
      SALE_RESERVE_PCT: 0.05
    precision: "whole cents, round_half_up; reserve first, remainder to bank"

  - name: enforcement_draw_amount
    trigger: "POST /lending/enforcement_actions/{actionId}/draw"
    algorithm: threshold
    formula: |
      draw_amount_cents = min(loan.remaining_balance_cents, guarantor.guarantee_cap_cents)
      Applied to the loan identically to a catch-up application (reduces remaining, increases paid).
    input_set: "The defaulted loan and its guarantor"
    precision: "whole cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist (left-to-right: merchant, offer, loan, batch, sale, signal, disclosure, guarantor, action, bank, sweep, payment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version in body matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lending/offers/{offerId}/accept; POST /lending/loans/{loanId}/sweeps"
  - priority: 5
    category: state
    check: "Target resource state permits the operation (incl. offer expiry vs clock, merchant ELIGIBLE/SUSPENDED gates, batch already swept, bank inactive, loan active/terminal gates, merchant has active loan)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_OFFER_EXPIRED | ERR_LOAN_NOT_ACTIVE | ERR_LOAN_ALREADY_TERMINAL | ERR_MERCHANT_NOT_ELIGIBLE | ERR_MERCHANT_SUSPENDED | ERR_BANK_INACTIVE | ERR_BATCH_ALREADY_SWEPT | ERR_MERCHANT_HAS_ACTIVE_LOAN"
    http_status: 409
    applies_to: "state transition endpoints; offer create/accept; sweep creation; sale quote/settle"
  - priority: 6
    category: business_safety
    check: "Regulatory disclosure gates on loan activation/acknowledgment (delivered/acknowledged state per mandate, 24h cooling)"
    error_id: "ERR_DISCLOSURE_NOT_DELIVERED | ERR_DISCLOSURE_NOT_ACKNOWLEDGED | ERR_DISCLOSURE_COOLING_NOT_ELAPSED"
    http_status: 409
    applies_to: "POST /lending/loans/{loanId}/activate; POST /lending/disclosures/{disclosureId}/acknowledge"
  - priority: 7
    category: business_constraint
    check: "Uniqueness/overlap/SoD constraints (batch date unique per merchant, single OFFERED offer per merchant, holdback choice in offered set, no open migration signal, enforcement demand window, sale settle by a different user than commit)"
    error_id: "ERR_DUPLICATE_PROCESSING_DATE | ERR_OFFER_OVERLAP_ACTIVE | ERR_HOLDBACK_PCT_NOT_OFFERED | ERR_MIGRATION_SIGNAL_OPEN | ERR_ENFORCEMENT_WINDOW_OPEN | ERR_SOD_SAME_USER"
    http_status: 409
    applies_to: "batch create; offer create/issue/accept; migration evaluate; enforcement demand; sale settle"
  - priority: 8
    category: business_referential
    check: "Cross-entity referential state (guarantor ACTIVE before loan activation; batch FINALIZED before sweep)"
    error_id: "ERR_GUARANTOR_NOT_ACTIVE | ERR_BATCH_NOT_FINALIZED"
    http_status: 409
    applies_to: "POST /lending/loans/{loanId}/activate; POST /lending/loans/{loanId}/sweeps"
  - priority: 9
    category: business_fiscal
    check: "Amount/aggregate fiscal limits (selected principal <= preapproved, catch-up <= remaining balance, lifetime volume minimum)"
    error_id: "ERR_OFFER_AMOUNT_EXCEEDS_PREAPPROVED | ERR_CATCHUP_EXCEEDS_OUTSTANDING | ERR_MERCHANT_VOLUME_INSUFFICIENT"
    http_status: 409
    applies_to: "offer accept; catch-up settle; merchant activate; offer generate"
  - priority: 10
    category: business_temporal
    check: "Time-based gates (repayment period fully elapsed; tenure minimum)"
    error_id: "ERR_PERIOD_NOT_ELAPSED | ERR_MERCHANT_TENURE_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /lending/loans/{loanId}/evaluate_period; POST /lending/merchants/{merchantId}/activate"
  - priority: 11
    category: business_constraint
    check: "Request body shape: required fields present, enums valid, non-negative integer cents, state_code two uppercase letters"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Lazy offer expiry and all clock-gated rules evaluate against the new clock"]

  # --- Merchant ---
  - method: POST
    path: "/lending/merchants"
    description: "Onboard a merchant"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, state_code, owner_name, processing_started_at]
    output: Merchant
    side_effects: ["status=ONBOARDING; aggregates zeroed"]

  - method: GET
    path: "/lending/merchants/{merchantId}"
    description: "Get a merchant"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: GET
    path: "/lending/merchants"
    description: "List merchants with pagination"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Merchant[]"
    side_effects: []

  - method: POST
    path: "/lending/merchants/{merchantId}/activate"
    description: "Activate a merchant after tenure and volume minimums"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status -> ELIGIBLE"]

  - method: POST
    path: "/lending/merchants/{merchantId}/reinstate"
    description: "Reinstate a suspended merchant"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Merchant
    side_effects: ["status SUSPENDED -> ELIGIBLE"]

  # --- Processing batches ---
  - method: POST
    path: "/lending/merchants/{merchantId}/processing_batches"
    description: "Record a daily card settlement batch (unique per merchant+date)"
    roles: [PlatformAdmin, ServicerAgent]
    code: 201
    input: ["processing_date", "gross_cents", "refunds_cents?", "chargebacks_cents?"]
    output: ProcessingDayBatch
    side_effects: ["status=OPEN; net_settled_cents computed"]

  - method: POST
    path: "/lending/processing_batches/{batchId}/finalize"
    description: "Finalize a batch; recomputes merchant aggregates"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: ProcessingDayBatch
    side_effects: ["status -> FINALIZED; merchant aggregates recomputed; Merchant.version incremented"]

  - method: GET
    path: "/lending/processing_batches/{batchId}"
    description: "Get a batch"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: ProcessingDayBatch
    side_effects: []

  - method: GET
    path: "/lending/merchants/{id}/processing_batches"
    description: "List a merchant's batches"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ProcessingDayBatch[]"
    side_effects: []

  # --- Offers ---
  - method: POST
    path: "/lending/merchants/{merchantId}/offers"
    description: "Generate a pre-approved offer (computes STANDARD and CONSERVATIVE variants)"
    roles: [Underwriter]
    code: 201
    input: []
    output: LoanOffer
    side_effects: ["status=DRAFT; pre-approval amounts computed; ERR_MERCHANT_NOT_ELIGIBLE / ERR_MERCHANT_SUSPENDED / ERR_MERCHANT_VOLUME_INSUFFICIENT / ERR_OFFER_OVERLAP_ACTIVE as applicable"]

  - method: POST
    path: "/lending/offers/{offerId}/issue"
    description: "Issue an offer (DRAFT or REUNDERWRITING -> OFFERED), starting the 30-day window"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanOffer
    side_effects: ["status -> OFFERED; issued_at/expires_at set"]

  - method: POST
    path: "/lending/offers/{offerId}/withdraw"
    description: "Withdraw an offer"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanOffer
    side_effects: ["status -> WITHDRAWN"]

  - method: POST
    path: "/lending/offers/{offerId}/renew"
    description: "Re-underwrite an expired offer"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanOffer
    side_effects: ["status -> REUNDERWRITING; amounts recomputed; renewal_count += 1"]

  - method: POST
    path: "/lending/offers/{offerId}/accept"
    description: "Merchant accepts an offer; creates Loan, Guarantor, DisclosureStatement"
    roles: [MerchantOwner]
    code: 200
    input: [selected_principal_cents, accepted_holdback_pct, guarantor_full_name, guarantor_email, guarantee_cap_cents, expected_merchant_version]
    output: LoanOffer
    side_effects:
      - "status -> ACCEPTED; accepted_loan_id set"
      - "Loan + Guarantor(LINKED) + DisclosureStatement(GENERATED) created"
      - "Merchant.active_loan_id set; increments Merchant.version by 1"

  - method: GET
    path: "/lending/offers/{offerId}"
    description: "Get an offer"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: LoanOffer
    side_effects: []

  - method: GET
    path: "/lending/merchants/{id}/offers"
    description: "List a merchant's offers"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LoanOffer[]"
    side_effects: []

  # --- Loans ---
  - method: GET
    path: "/lending/loans/{loanId}"
    description: "Get a loan"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/lending/loans"
    description: "List loans (filtered)"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["merchant_id?", "offer_id?", "status?", "limit?", "offset?"]
    output: "Loan[]"
    side_effects: []

  - method: GET
    path: "/lending/merchants/{id}/loans"
    description: "List a merchant's loans"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Loan[]"
    side_effects: []

  - method: POST
    path: "/lending/loans/{loanId}/activate"
    description: "Activate a loan after disclosure and guarantee gates"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: Loan
    side_effects: ["status -> ACTIVE; activated_at set; repayment_period_index=0"]

  - method: POST
    path: "/lending/loans/{loanId}/charge_off"
    description: "Charge off a defaulted loan"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: ["status DEFAULTED -> CHARGED_OFF; open enforcement actions released"]

  - method: POST
    path: "/lending/loans/{loanId}/evaluate_period"
    description: "Close the current 60-day repayment period and apply minimum-payment rules"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "period_minimum_evaluation calculation"
      - "Delinquency/default cascades to Merchant and EnforcementAction"

  # --- Guarantors ---
  - method: GET
    path: "/lending/guarantors/{guarantorId}"
    description: "Get a guarantor"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: Guarantor
    side_effects: []

  - method: GET
    path: "/lending/loans/{id}/guarantors"
    description: "List a loan's guarantors (0 or 1)"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: "Guarantor[]"
    side_effects: []

  - method: POST
    path: "/lending/guarantors/{guarantorId}/acknowledge"
    description: "Guarantor acknowledges the personal guarantee"
    roles: [GuarantorPrincipal]
    code: 200
    input: []
    output: Guarantor
    side_effects: ["status LINKED -> ACTIVE"]

  # --- Disclosures ---
  - method: GET
    path: "/lending/disclosures/{disclosureId}"
    description: "Get a disclosure statement"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: DisclosureStatement
    side_effects: []

  - method: GET
    path: "/lending/loans/{id}/disclosures"
    description: "List a loan's disclosure statements"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: "DisclosureStatement[]"
    side_effects: []

  - method: POST
    path: "/lending/disclosures/{disclosureId}/deliver"
    description: "Deliver a disclosure to the merchant"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: DisclosureStatement
    side_effects: ["status GENERATED -> DELIVERED"]

  - method: POST
    path: "/lending/disclosures/{disclosureId}/acknowledge"
    description: "Merchant acknowledges a disclosure (24h cooling in mandate states)"
    roles: [MerchantOwner]
    code: 200
    input: []
    output: DisclosureStatement
    side_effects: ["status DELIVERED -> ACKNOWLEDGED"]

  # --- Sweeps ---
  - method: POST
    path: "/lending/loans/{loanId}/sweeps"
    description: "Post the holdback sweep for a finalized batch against a loan"
    roles: [ServicerAgent]
    code: 201
    input: [batch_id, expected_loan_version]
    output: SettlementSweep
    side_effects:
      - "SettlementSweep created APPLIED; batch FINALIZED -> SWEPT"
      - "Loan balances updated; increments Loan.version by 1"
      - "REPAID cascade when remaining reaches 0"

  - method: GET
    path: "/lending/sweeps/{sweepId}"
    description: "Get a sweep"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: SettlementSweep
    side_effects: []

  - method: GET
    path: "/lending/loans/{id}/sweeps"
    description: "List a loan's sweeps"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SettlementSweep[]"
    side_effects: []

  - method: GET
    path: "/lending/sweeps"
    description: "List sweeps (filtered)"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["loan_id?", "batch_id?", "limit?", "offset?"]
    output: "SettlementSweep[]"
    side_effects: []

  - method: POST
    path: "/lending/sweeps/{sweepId}/reverse"
    description: "Reverse an applied sweep (compensating)"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: SettlementSweep
    side_effects: ["status -> REVERSED; loan balances restored; batch SWEPT -> FINALIZED"]

  # --- Catch-up payments ---
  - method: POST
    path: "/lending/loans/{loanId}/catch_up_payments"
    description: "Merchant initiates an out-of-band catch-up payment"
    roles: [MerchantOwner]
    code: 201
    input: [amount_cents]
    output: CatchUpPayment
    side_effects: ["status=INITIATED"]

  - method: POST
    path: "/lending/catch_up_payments/{paymentId}/settle"
    description: "Settle and apply a catch-up payment"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: CatchUpPayment
    side_effects: ["status -> APPLIED; loan balances updated; shortfall-first application"]

  - method: POST
    path: "/lending/catch_up_payments/{paymentId}/fail"
    description: "Mark a catch-up payment failed"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: CatchUpPayment
    side_effects: ["status -> FAILED"]

  - method: POST
    path: "/lending/catch_up_payments/{paymentId}/reverse"
    description: "Reverse an applied catch-up payment"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: CatchUpPayment
    side_effects: ["status -> REVERSED; loan balances restored"]

  - method: GET
    path: "/lending/catch_up_payments/{paymentId}"
    description: "Get a catch-up payment"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: CatchUpPayment
    side_effects: []

  - method: GET
    path: "/lending/loans/{id}/catch_up_payments"
    description: "List a loan's catch-up payments"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CatchUpPayment[]"
    side_effects: []

  # --- Enforcement ---
  - method: POST
    path: "/lending/enforcement_actions/{actionId}/demand"
    description: "Issue a demand on the personal guarantee"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["status DRAFT -> DEMANDED; window_end set"]

  - method: POST
    path: "/lending/enforcement_actions/{actionId}/escalate"
    description: "Escalate an unpaid demand after its 30-day window"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["status DEMANDED -> ESCALATED"]

  - method: POST
    path: "/lending/enforcement_actions/{actionId}/draw"
    description: "Draw on the personal guarantee"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["status -> DRAWN; draw amount applied to loan; Guarantor -> ENFORCED"]

  - method: POST
    path: "/lending/enforcement_actions/{actionId}/release"
    description: "Release an enforcement action once the loan is terminal"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["status -> RELEASED; Guarantor -> RELEASED when no other open actions"]

  - method: GET
    path: "/lending/enforcement_actions/{actionId}"
    description: "Get an enforcement action"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: GET
    path: "/lending/loans/{id}/enforcement_actions"
    description: "List a loan's enforcement actions"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EnforcementAction[]"
    side_effects: []

  - method: GET
    path: "/lending/enforcement_actions"
    description: "List enforcement actions (filtered)"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["loan_id?", "guarantor_id?", "limit?", "offset?"]
    output: "EnforcementAction[]"
    side_effects: []

  # --- Migration signals ---
  - method: POST
    path: "/lending/merchants/{merchantId}/migration_signals/evaluate"
    description: "Evaluate processor-migration risk from recent batches; creates a DETECTED signal when triggered"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: MigrationSignal
    side_effects: ["ERR_MERCHANT_NOT_ELIGIBLE unless merchant ELIGIBLE; ERR_MIGRATION_SIGNAL_OPEN when a DETECTED/CONFIRMED signal exists"]

  - method: POST
    path: "/lending/migration_signals/{signalId}/confirm"
    description: "Confirm a migration signal; suspends the merchant"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: MigrationSignal
    side_effects: ["status -> CONFIRMED; Merchant -> SUSPENDED"]

  - method: POST
    path: "/lending/migration_signals/{signalId}/dismiss"
    description: "Dismiss a migration signal"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: MigrationSignal
    side_effects: ["status DETECTED -> DISMISSED"]

  - method: POST
    path: "/lending/migration_signals/{signalId}/clear"
    description: "Clear a confirmed migration signal"
    roles: [ServicerAgent]
    code: 200
    input: []
    output: MigrationSignal
    side_effects: ["status CONFIRMED -> CLEARED"]

  - method: GET
    path: "/lending/migration_signals/{signalId}"
    description: "Get a migration signal"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: MigrationSignal
    side_effects: []

  - method: GET
    path: "/lending/merchants/{id}/migration_signals"
    description: "List a merchant's migration signals"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MigrationSignal[]"
    side_effects: []

  # --- Funding partner banks ---
  - method: POST
    path: "/lending/funding_banks"
    description: "Register a funding partner bank"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, purchase_discount_pct]
    output: FundingPartnerBank
    side_effects: ["status=ACTIVE; committed_exposure_cents=0"]

  - method: POST
    path: "/lending/funding_banks/{bankId}/suspend"
    description: "Suspend a funding partner bank"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FundingPartnerBank
    side_effects: ["status -> SUSPENDED"]

  - method: GET
    path: "/lending/funding_banks/{bankId}"
    description: "Get a funding partner bank"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: FundingPartnerBank
    side_effects: []

  # --- Loan sales ---
  - method: POST
    path: "/lending/loans/{loanId}/sales/quote"
    description: "Quote a loan sale to a partner bank"
    roles: [BankOfficer]
    code: 201
    input: [bank_id]
    output: LoanSale
    side_effects: ["status=QUOTED; purchase_price_cents computed"]

  - method: POST
    path: "/lending/sales/{saleId}/commit"
    description: "Commit to a quoted sale"
    roles: [BankOfficer]
    code: 200
    input: []
    output: LoanSale
    side_effects: ["status -> COMMITTED; bank.committed_exposure_cents += purchase_price_cents"]

  - method: POST
    path: "/lending/sales/{saleId}/settle"
    description: "Settle a committed sale (must be a different officer than committer)"
    roles: [BankOfficer]
    code: 200
    input: []
    output: LoanSale
    side_effects: ["status -> SETTLED; reserve/remittance waterfall; exposure released; servicing retained"]

  - method: POST
    path: "/lending/sales/{saleId}/fail"
    description: "Fail a committed sale (compensating)"
    roles: [BankOfficer]
    code: 200
    input: []
    output: LoanSale
    side_effects: ["status -> FAILED; bank.committed_exposure_cents -= purchase_price_cents"]

  - method: POST
    path: "/lending/sales/{saleId}/requote"
    description: "Requote a failed sale at the loan's current remaining balance"
    roles: [BankOfficer]
    code: 200
    input: []
    output: LoanSale
    side_effects: ["status FAILED -> QUOTED; purchase_price_cents recomputed"]

  - method: GET
    path: "/lending/sales/{saleId}"
    description: "Get a loan sale"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: []
    output: LoanSale
    side_effects: []

  - method: GET
    path: "/lending/loans/{id}/sales"
    description: "List a loan's sales"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LoanSale[]"
    side_effects: []

  - method: GET
    path: "/lending/sales"
    description: "List loan sales (filtered)"
    roles: [PlatformAdmin, Underwriter, ServicerAgent, MerchantOwner, GuarantorPrincipal, BankOfficer, Auditor]
    code: 200
    input: ["loan_id?", "bank_id?", "limit?", "offset?"]
    output: "LoanSale[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, negative cents, bad state_code" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a state where the transition is not allowed (incl. enforcement escalate before window_end)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_MERCHANT_TENURE_INSUFFICIENT, http: 409, condition: "clock - processing_started_at < 365 days at activation" }
  - { id: ERR_MERCHANT_VOLUME_INSUFFICIENT, http: 409, condition: "lifetime_net_cents < 10000000 at activation, or trailing_12m_months_recorded < 12 at offer generation" }
  - { id: ERR_MERCHANT_NOT_ELIGIBLE, http: 409, condition: "Merchant not in ELIGIBLE status where required (offer generation, migration evaluation); ONBOARDING case" }
  - { id: ERR_MERCHANT_SUSPENDED, http: 409, condition: "Offer generation attempted for a SUSPENDED merchant" }
  - { id: ERR_MERCHANT_HAS_ACTIVE_LOAN, http: 409, condition: "Offer acceptance while merchant.active_loan_id is set" }
  - { id: ERR_DUPLICATE_PROCESSING_DATE, http: 409, condition: "A batch already exists for this merchant and processing_date" }
  - { id: ERR_BATCH_NOT_FINALIZED, http: 409, condition: "Sweep references a batch not in FINALIZED status" }
  - { id: ERR_BATCH_ALREADY_SWEPT, http: 409, condition: "Sweep references a batch already SWEPT by a non-reversed sweep" }
  - { id: ERR_OFFER_OVERLAP_ACTIVE, http: 409, condition: "Another offer for this merchant is currently OFFERED (validity windows are half-open [issued_at, expires_at))" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Acceptance attempted at or after expires_at" }
  - { id: ERR_OFFER_AMOUNT_EXCEEDS_PREAPPROVED, http: 409, condition: "selected_principal_cents > offer.preapproved_cents" }
  - { id: ERR_HOLDBACK_PCT_NOT_OFFERED, http: 409, condition: "accepted_holdback_pct not in {0.08, 0.10, 0.14}" }
  - { id: ERR_GUARANTOR_NOT_ACTIVE, http: 409, condition: "Loan activation while the guarantor is not ACTIVE" }
  - { id: ERR_DISCLOSURE_NOT_DELIVERED, http: 409, condition: "Non-mandate loan activation before the disclosure is DELIVERED" }
  - { id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED, http: 409, condition: "Mandate-state loan activation before the disclosure is ACKNOWLEDGED" }
  - { id: ERR_DISCLOSURE_COOLING_NOT_ELAPSED, http: 409, condition: "Mandate-state acknowledgment before delivered_at + 24h" }
  - { id: ERR_LOAN_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE loan (sale settle, sweep on PENDING loan)" }
  - { id: ERR_LOAN_ALREADY_TERMINAL, http: 409, condition: "Operation blocked on REPAID/CHARGED_OFF loan (sweep reverse, catch-up settle/reverse)" }
  - { id: ERR_CATCHUP_EXCEEDS_OUTSTANDING, http: 409, condition: "Catch-up settle amount exceeds loan.remaining_balance_cents" }
  - { id: ERR_PERIOD_NOT_ELAPSED, http: 409, condition: "evaluate_period before the current 60-day period has fully elapsed" }
  - { id: ERR_ENFORCEMENT_WINDOW_OPEN, http: 409, condition: "New demand while another DEMANDED/ESCALATED action exists whose guarantor has the same email and whose closed window [demanded_at, window_end] contains the clock" }
  - { id: ERR_MIGRATION_SIGNAL_OPEN, http: 409, condition: "Migration evaluation while a DETECTED/CONFIRMED signal exists for the merchant" }
  - { id: ERR_BANK_INACTIVE, http: 409, condition: "Sale quote/commit/settle/requote against a SUSPENDED bank" }
  - { id: ERR_SOD_SAME_USER, http: 409, condition: "Sale settle attempted by the same X-User-ID that committed it (segregation of duties)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform superuser: merchant onboarding/activation/reinstatement, batch recording, bank registry, charge-offs, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /lending/merchants"
      - "POST /lending/merchants/{merchantId}/activate"
      - "POST /lending/merchants/{merchantId}/reinstate"
      - "POST /lending/funding_banks"
      - "POST /lending/funding_banks/{bankId}/suspend"
      - "POST /lending/loans/{loanId}/charge_off"
    shared_operations:
      - "POST /lending/merchants/{merchantId}/processing_batches (with ServicerAgent)"
      - "All GET endpoints"

  - name: Underwriter
    description: "Generates, issues, renews, and withdraws loan offers; may not service loans or post sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /lending/merchants/{merchantId}/offers"
      - "POST /lending/offers/{offerId}/issue"
      - "POST /lending/offers/{offerId}/withdraw"
      - "POST /lending/offers/{offerId}/renew"
    shared_operations:
      - "All GET endpoints"

  - name: ServicerAgent
    description: "Services loans: finalizes batches, posts/reverses sweeps, settles catch-ups, activates loans, delivers disclosures, runs period evaluation, manages enforcement and migration signals"
    identity: opaque
    exclusive_operations:
      - "POST /lending/processing_batches/{batchId}/finalize"
      - "POST /lending/loans/{loanId}/activate"
      - "POST /lending/loans/{loanId}/evaluate_period"
      - "POST /lending/loans/{loanId}/sweeps"
      - "POST /lending/sweeps/{sweepId}/reverse"
      - "POST /lending/catch_up_payments/{paymentId}/settle"
      - "POST /lending/catch_up_payments/{paymentId}/fail"
      - "POST /lending/catch_up_payments/{paymentId}/reverse"
      - "POST /lending/disclosures/{disclosureId}/deliver"
      - "POST /lending/enforcement_actions/{actionId}/demand"
      - "POST /lending/enforcement_actions/{actionId}/escalate"
      - "POST /lending/enforcement_actions/{actionId}/draw"
      - "POST /lending/enforcement_actions/{actionId}/release"
      - "POST /lending/merchants/{merchantId}/migration_signals/evaluate"
      - "POST /lending/migration_signals/{signalId}/confirm"
      - "POST /lending/migration_signals/{signalId}/dismiss"
      - "POST /lending/migration_signals/{signalId}/clear"
    shared_operations:
      - "POST /lending/merchants/{merchantId}/processing_batches (with PlatformAdmin)"
      - "All GET endpoints"

  - name: MerchantOwner
    description: "The borrowing merchant: accepts its own offers, acknowledges its own disclosures, initiates catch-up payments; X-User-ID equals the Merchant.id"
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /lending/offers/{offerId}/accept (own merchant's offers only)"
      - "POST /lending/disclosures/{disclosureId}/acknowledge (own loans only)"
      - "POST /lending/loans/{loanId}/catch_up_payments (own loans only)"
    shared_operations:
      - "All GET endpoints"

  - name: GuarantorPrincipal
    description: "The personal guarantor: acknowledges the guarantee; X-User-ID equals the Guarantor.id"
    identity: "entity_backed:Guarantor"
    exclusive_operations:
      - "POST /lending/guarantors/{guarantorId}/acknowledge (own guarantee only)"
    shared_operations:
      - "All GET endpoints"

  - name: BankOfficer
    description: "Funding partner bank officer: quotes, commits, settles, fails, and requotes loan sales; settle must be a different X-User-ID than commit (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /lending/loans/{loanId}/sales/quote"
      - "POST /lending/sales/{saleId}/commit"
      - "POST /lending/sales/{saleId}/settle"
      - "POST /lending/sales/{saleId}/fail"
      - "POST /lending/sales/{saleId}/requote"
    shared_operations:
      - "All GET endpoints"

  - name: Auditor
    description: "Read-only oversight"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
