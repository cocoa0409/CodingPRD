      - name: certify_environmental_review_already_certified_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EnvironmentalReview.terminal_states
          - state_machines.EnvironmentalReview.null_to_CERTIFIED
          - errors[ERR_INVALID_ENV_REVIEW_STATE]
        distinguishing_aspect: "CERTIFIED is EnvironmentalReview's only terminal state, and the EXEMPT branch creates the row already CERTIFIED, so POST /environmental-reviews/{id}/certify on it returns HTTP 409 ERR_INVALID_ENV_REVIEW_STATE and leaves certified_at at its original 2026-08-01T00:00:00Z rather than re-stamping it; the same is true of /recirculate from CERTIFIED."
        test_recipe:
          setup:
            - "One custodian Agency, one Parcel and one ADOPTED declaration."
            - "An EXEMPT EnvironmentalReview, which §1.2 declares is created already CERTIFIED with certified_at := clock."
          setup_api_calls:
