  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.TrainingDataset.initial_state
          - state_machines.ModelVersion.initial_state
          - state_machines.Deployment_rollout_state.initial_state
          - state_machines.Deployment_health_state.initial_state
        distinguishing_aspect: |
          Four machines, four initial states, all asserted from a single chain: TrainingDataset DRAFT,
          ModelVersion DRAFT, Deployment rollout_state PENDING AND health_state HEALTHY on the same
          row (parallel dimensions both start at their own initial state), plus ServingEndpoint
          operational_state OPEN.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one Model, one approved snapshot, one APPROVED version, one OPEN cluster"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id, ds_state: $.data.approval_state }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id, v1_state: $.data.approval_state }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version, se1_state: $.data.operational_state }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id, d1_roll: $.data.rollout_state, d1_health: $.data.health_state }
          assert:
            - "TrainingDataset.${ds_id}.approval_state == 'DRAFT' at creation"
            - "ModelVersion.${v1_id}.approval_state == 'DRAFT' at creation"
            - "ServingEndpoint.${se1_id}.operational_state == 'OPEN' at creation"
            - "Deployment.${d1_id}.rollout_state == 'PENDING' AND health_state == 'HEALTHY' — both dimensions of the same row start independently at their own initial state"
            - "Deployment.${d1_id}.traffic_pct == 0.00, ramp_step_index == 0, target_traffic_pct == 100.00, cumulative_ramp_delta_pct == 0.00, manual_override_active == false"
            - "no TrafficRampStep exists yet: GET /traffic-ramp-steps?deployment_id=${d1_id} returns total_count 0"

      - name: hold_then_resume_preserves_traffic_pct_and_ramp_step_index
        claim_type: Valid Transition
        grounds:
          - state_machines.Deployment_rollout_state.RAMPING_to_HELD
          - state_machines.Deployment_rollout_state.HELD_to_RAMPING
          - calculations.endpoint_traffic_ledger
        distinguishing_aspect: |
          HOLD and RESUME are the pause pair of the cyclic rollout machine: neither writes traffic_pct
          nor ramp_step_index and neither appends a TrafficRampStep, and because HELD is inside the
          ledger's included state set the endpoint keeps counting the held traffic. The next ramp then
          resumes from the preserved checkpoint index (15.00 -> 35.00, not 15.00 -> 5.00).
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one REALTIME Deployment ramped twice: RAMPING at traffic_pct 15.00, ramp_step_index 2"
