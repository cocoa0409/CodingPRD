              payload: {}
              as: UnitedFundAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /fundraising/campaigns/aaaaaaaa-0000-4000-8000-000000000002"
              payload: {}
              as: UnitedFundAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /fundraising/pledges/aaaaaaaa-0000-4000-8000-000000000003"
              payload: {}
              as: UnitedFundAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /fundraising/agencies/aaaaaaaa-0000-4000-8000-000000000004"
              payload: {}
              as: UnitedFundAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /fundraising/allocation-cycles/aaaaaaaa-0000-4000-8000-000000000005"
              payload: {}
              as: UnitedFundAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /fundraising/allocation-requests/aaaaaaaa-0000-4000-8000-000000000006"
              payload: {}
              as: UnitedFundAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /fundraising/panelists/aaaaaaaa-0000-4000-8000-000000000007"
              payload: {}
              as: UnitedFundAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /fundraising/outcome-reports/aaaaaaaa-0000-4000-8000-000000000008"
              payload: {}
              as: UnitedFundAdmin
