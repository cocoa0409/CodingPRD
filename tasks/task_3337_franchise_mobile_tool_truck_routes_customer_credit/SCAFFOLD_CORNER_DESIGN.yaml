  # ===========================================================================
  # section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: endpoint_success_envelope_and_pagination_defaults
        claim_type: response_envelope
        grounds: ["endpoints[GET /retail/routes]", response_envelope.pagination_defaults]
        distinguishing_aspect: "A successful list read returns the fixed envelope — meta.api_request_id present, response_type array, data an array — with pagination defaults limit 10 and offset 0 applied when they are omitted."
        test_recipe:
          setup: ["Two franchisees each owning one route, created DRAFT"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "First Franchisee LLC" }, as: PlatformAdmin, captures: { f1_id: "$.data.id" } }
            - { call: "POST /retail/franchisees", payload: { legal_name: "Second Franchisee LLC" }, as: PlatformAdmin, captures: { f2_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f1_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f1_id}" }
            - { call: "POST /retail/franchisees/${f2_id}/routes", payload: { route_code: R2, route_tier: B, zip_codes: [75002], visit_weekday: 2, truck_label: T-02, inventory_invested_cents: 50000, mix_plan: TOOL_STORAGE, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f2_id}" }
          trigger:
            - { call: "GET /retail/routes", payload: {}, as: PlatformAdmin, captures: { env_meta: "$.meta.api_request_id", first_code: "$.data[0].route_code" } }
          assert:
            - "the response carries meta.api_request_id (non-empty) and response_type == array"
            - "data has exactly 2 entries, one per franchisee"
            - "the default page size applied is limit 10 with offset 0"
            - "pagination_fields limit, offset, total_count and has_more are present"
            - "total_count == 2 and has_more == false"

      - name: endpoint_listing_filter_combinations_narrow_the_page
        claim_type: listing
        grounds: ["endpoints[GET /retail/warranty-claims]", entities.WarrantyClaim.fields.claim_status, entities.WarrantyClaim.fields.claim_kind]
        distinguishing_aspect: "The claims list honours a compound filter: claim_status=OPEN&claim_kind=WARRANTY_REPLACEMENT narrows the page to exactly the matching rows and total_count reflects the filter rather than the whole table."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; approved account A1 (limit 50000); product P1; a 2 x P1 order DELIVERED in the week of 2026-09-07 with two claims filed on different lines and one submitted"]
