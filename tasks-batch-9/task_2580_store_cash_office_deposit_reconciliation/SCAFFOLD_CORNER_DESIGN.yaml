            - "Deposit.${deposit_id}.status == \"SEALED\", seal_number == \"SEAL-1\", sealed_by_user_id == \"U-CLERK-2\", prepared_by_user_id == \"U-CLERK-1\""
            - "Safe.${safe_id}.open_state == \"LOCKED\" — relocked once by the first seal only"
