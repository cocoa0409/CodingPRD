              as: PlatformAdmin
            - call: "POST /episodes"
              payload: { show_id: "${show_b}", contract_id: "${contract_b}", title: "Ep B", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_b}"
              captures: { ep_b: $.data.id }
          trigger:
