  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: contract_offer_negotiation_cycle_round_cap_and_terminal_lockdown
        grounds:
          - state_machines.ContractOffer.SENT_to_COUNTERED
          - state_machines.ContractOffer.COUNTERED_to_SENT
          - state_machines.ContractOffer.COUNTERED_to_DECLINED
          - entities.ContractOffer.fields.round_number
          - entities.ContractOffer.fields.expires_at
          - validations[priority=8]
        distinguishing_aspect: |
          ContractOffer is genuinely cyclic: SENT -> COUNTERED -> SENT can be walked repeatedly,
          each revise increments round_number and restarts the 72-hour expiry clock from a new
          sent_at, and the loop terminates only when round_number reaches
          League.max_negotiation_rounds. A linear reading of the machine cannot produce the
          third-counter refusal, and DECLINED is a real terminal state that locks out the cycle.
        test_recipe:
          setup:
            - "One league with offer_response_window_hours 72 and max_negotiation_rounds 3"
            - "One organization and one association-member adult player"
            - "One SENT offer created at clock 2026-08-04T00:00:00Z, so expires_at is 2026-08-07T00:00:00Z"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 1, max_roster_size: 7, offer_response_window_hours: 72, max_negotiation_rounds: 3, association_min_prize_split_bp: 4000, association_max_streaming_hours_per_week: 20, tryout_required_before_offer: false }
