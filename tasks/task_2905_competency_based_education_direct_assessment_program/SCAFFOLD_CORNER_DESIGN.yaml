      - name: a_suspended_evaluator_cannot_be_revived
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EVALUATOR_SUSPENDED]
          - state_machines.Evaluator.terminal_states
        distinguishing_aspect: "SUSPENDED is the Evaluator terminal state, so the status endpoint that created it refuses to undo it: both CERTIFIED and PROVISIONAL targets return 409 ERR_EVALUATOR_SUSPENDED and the row stays at the version the suspension produced — there is no administrative escape hatch."
        test_recipe:
          setup:
            - "one CERTIFIED evaluator with no mentor appointment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /evaluators"
              payload: { full_name: "Eve Reader", email: "eve@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev_id: $.data.id, ev_status: $.data.status, ev_v1: $.data.version }
          trigger:
            - call: "POST /evaluators/${ev_id}/status"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { susp_status: $.data.status, susp_version: $.data.version }
            - call: "POST /evaluators/${ev_id}/status"
              payload: { status: "CERTIFIED" }
              as: PlatformAdmin
              captures: { e_revive_certified: $.data.error_id }
            - call: "POST /evaluators/${ev_id}/status"
              payload: { status: "PROVISIONAL" }
              as: PlatformAdmin
              captures: { e_revive_provisional: $.data.error_id }
            - call: "GET /evaluators/${ev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { final_status: $.data.status, final_version: $.data.version }
          assert:
            - "${ev_status} == CERTIFIED"
            - "${ev_v1} == 1"
            - "${susp_status} == SUSPENDED"
            - "${susp_version} == 2"
            - "${e_revive_certified} == ERR_EVALUATOR_SUSPENDED"
            - "${e_revive_provisional} == ERR_EVALUATOR_SUSPENDED"
            - "both refusals have status code 409"
            - "${final_status} == SUSPENDED"
            - "${final_version} == ${susp_version}"

  # §1.4's declared role_model is `segregation_of_duties`, so the guide's
  # approval_chain / hierarchical_override / delegated_authority rows have no
  # applicable claim here and are not emitted. `peer_roles` is likewise not the
  # declared model — the student-vs-student and mentor-vs-mentor isolation it
  # would describe is covered by the ownership instance below, which is really a
  # priority-3 ERR_NOT_RESOURCE_OWNER denial rather than a role-model claim.
  - section: rbac
    instances:
      - name: every_role_can_run_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.Registrar.exclusive_operations
          - roles.Student.exclusive_operations
          - roles.Evaluator.exclusive_operations
          - roles.IntegrityOfficer.exclusive_operations
          - roles.FinancialAidOfficer.exclusive_operations
          - roles.FacultyMentor.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
        distinguishing_aspect: "All seven roles must clear their own gate in ONE end-to-end run: Registrar publishes and blueprints, Student submits, Evaluator scores, IntegrityOfficer investigates and resolves, FinancialAidOfficer schedules aid, FacultyMentor endorses, PlatformAdmin re-certifies — an implementation that hard-codes a single super-role passes none of the denial instances and an implementation that over-narrows fails here."
        test_recipe:
          setup:
            - "the base chain with IT-101 and IT-102, a single-reader blueprint on IT-101, an ACTIVE term, a mentor with an ACTIVE assignment and one CERTIFIED evaluator"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-102", title: "Query Optimization", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c2_id: $.data.id }
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /mentors"
              payload: { full_name: "Mentor Meg", email: "meg@example.edu", max_caseload: 5, cadence_days: 14 }
              as: Registrar
              captures: { men_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Eve Reader", email: "eve@example.edu", certification_level: "SENIOR" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
          trigger:
            # Registrar exclusive: publish, blueprint, student activation, term, assignment
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
              captures: { pub_status: $.data.status }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { bp_status: $.data.status }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
              captures: { stu_status: $.data.enrollment_status, stu_v2: $.data.version }
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
              captures: { term_status: $.data.status }
            - call: "POST /mentor-assignments"
              payload: { student_id: "${stu_id}", expected_student_version: "${stu_v2}", mentor_id: "${men_id}" }
              as: Registrar
              captures: { asg_id: $.data.id, asg_status: $.data.status }
            # Student exclusive: submit (attempt creation is shared with Registrar)
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
            - call: "POST /assessment-attempts/${att_id}/submit"
              payload: { artifact_hash: "sha256:aaa", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_submitted: $.data.status }
            # Evaluator shared: open a case; IntegrityOfficer exclusive: investigate + resolve
            - call: "POST /integrity-cases"
              payload: { attempt_id: "${att_id}", signal_type: "ATTESTATION_ANOMALY", severity: "LOW" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { case_id: $.data.id, case_opener: $.data.opened_by_user_id }
            - call: "POST /integrity-cases/${case_id}/investigate"
              payload: {}
              as: IntegrityOfficer
              as_user_id: "officer-1"
              captures: { case_inv: $.data.status }
            - call: "POST /integrity-cases/${case_id}/resolve"
              payload: { outcome: "DISMISSED", sanction: "NONE" }
              as: IntegrityOfficer
              as_user_id: "officer-2"
              captures: { case_res: $.data.status }
            # Evaluator exclusive: score
            - call: "POST /assessment-attempts/${att_id}/scores"
              payload: { evaluator_id: "${ev_id}", dimension_scores: [{ code: "D1", score: 90 }] }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { sc_pct: $.data.weighted_score_pct }
            # FinancialAidOfficer exclusive: schedule aid against the fresh term version
            - call: "GET /subscription-terms/${term_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { term_v_now: $.data.version, term_ce: $.data.credit_equivalency_earned }
            - call: "POST /aid-disbursements"
              payload: { student_id: "${stu_id}", term_id: "${term_id}", scheduled_amount_cents: 200000, expected_term_version: "${term_v_now}" }
              as: FinancialAidOfficer
              captures: { dis_status: $.data.status }
            # FacultyMentor exclusive: endorse
            - call: "POST /mentor-assignments/${asg_id}/endorsements"
              payload: { competency_id: "${c2_id}" }
              as: FacultyMentor
              as_user_id: "${men_id}"
              captures: { asg_endorsed_status: $.data.status }
            # PlatformAdmin exclusive: change evaluator certification
            - call: "POST /evaluators/${ev_id}/status"
              payload: { status: "PROVISIONAL" }
              as: PlatformAdmin
              captures: { ev_new_status: $.data.status }
          assert:
            - "${pub_status} == PUBLISHED"
            - "${bp_status} == PUBLISHED"
            - "${stu_status} == ACTIVE"
            - "${term_status} == ACTIVE"
            - "${asg_status} == ACTIVE"
            - "${att_submitted} == UNDER_REVIEW"
            - "${case_opener} == ${ev_id}"
            - "${case_inv} == UNDER_INVESTIGATION"
            - "${case_res} == DISMISSED"
            - "${sc_pct} == 90.00"
            - "${term_ce} == 1"
            - "${dis_status} == SCHEDULED"
            - "${asg_endorsed_status} == ACTIVE"
            - "the endorsement response lists exactly one entry in endorsed_competency_ids, namely ${c2_id}"
            - "${ev_new_status} == PROVISIONAL"
            - "every call in this recipe returned 200 or 201 — no 403 anywhere"

      - name: no_role_can_run_another_roles_exclusive_operation
