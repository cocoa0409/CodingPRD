            - { call: "POST /v1/certifications/${c}/suspend", payload: { reason: "manual review" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { t_v1: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t}", facility_id: "${f}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T10:30:00Z", expected_team_version: "${t_v1}" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /v1/certifications/${c}/reinstate", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
