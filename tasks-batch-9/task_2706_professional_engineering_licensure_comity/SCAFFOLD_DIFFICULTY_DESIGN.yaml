      - name: consent_order_gated_on_case_probable_cause
        grounds:
          - validations[priority=10]
          - errors.ERR_PROBABLE_CAUSE_REQUIRED
          - state_machines.Case.sanction_status.NONE_to_PROPOSED
          - state_machines.Case.investigation_status.INVESTIGATING_to_PROBABLE_CAUSE
          - calculations.civil_penalty_assessment
          - concurrency_rules[consent-order-create-stale-case]
        distinguishing_aspect: |
          A guard that crosses the two PARALLEL axes of a single entity rather than two entities: the
          sanction axis may leave NONE only once the independent investigation axis has reached
          PROBABLE_CAUSE. The rejected attempt supplies a perfectly fresh expected_case_version, so the
          412 OCC gate at priority 8 cannot be what fires; and because the rejection must not bump the
          version, the SAME captured version value is reused implicitly by the later successful call after
          the finding advances the clock on the case — any spurious version increment on the failed attempt
          would surface as a 412 on the replay.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Finn Adeyemi' holds an ACTIVE licence issued 2026-01-15."
            - "A CPC_FRAUD Case naming that licence as respondent has been opened for investigation by INV-4, so investigation_status is INVESTIGATING, sanction_status is NONE, and assessed_penalty_cents is still 0."
