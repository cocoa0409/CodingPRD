  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: campaign_activate_requires_location_posture_open
        grounds:
          - state_machines.Campaign.SCHEDULED_to_RUNNING
          - validations[priority=9]
          - errors[ERR_LOCATION_RESTRICTED]
          - calculations.location_posture
        distinguishing_aspect: |
          Entity pair = Campaign -> Location. The Campaign's SCHEDULED -> RUNNING transition is legal only
          while the parent Location's derived posture is OPEN; with a single unsynced GOOGLE listing the
          location's listing_health_score is 15.00 (< 40.00) so posture is RESTRICTED and activate is refused.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "Location has exactly ONE listing (GOOGLE), never synced -> PENDING_SYNC, last_synced_at null."
            - "listing_health_score == 15.00 (< LISTING_MIN_HEALTH 40.00) so posture == RESTRICTED."
            - "An EMAIL campaign exists and has been SCHEDULED (scheduling is legal under RESTRICTED)."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version, posture_before: $.data.posture }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Blocked", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 10, credits_allocated: 10, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_LOCATION_RESTRICTED"
            - "Location.${loc_id}.listing_health_score == 15.00"
            - "Location.${loc_id}.posture == RESTRICTED"
            - "Campaign.${camp}.status == SCHEDULED (unchanged)"
            - "Campaign.${camp}.activated_at == null"

      - name: response_publish_requires_connected_listing_for_review_site
        grounds:
          - state_machines.ReviewResponse.APPROVED_to_PUBLISHED
          - validations[priority=15]
          - errors[ERR_LISTING_NOT_CONNECTED]
          - entities.Listing.fields.sync_state
        distinguishing_aspect: |
          Entity pair = ReviewResponse -> Listing (a different pair from Campaign -> Location). Publishing an
          APPROVED reply to a YELP review is refused because the Listing for (this location, YELP) is still
          PENDING_SYNC; the CONNECTED GOOGLE listing of the same location does not help.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "Location has a CONNECTED GOOGLE listing and a PENDING_SYNC YELP listing (never synced); listing_health_score == 59.00 so posture is OPEN."
            - "One YELP review rated 5 is ingested; agent-1 drafts and submits a reply; co-1 approves it, so the ReviewResponse is APPROVED."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "YELP", external_review_id: "y-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "Thank you!", expected_review_version: "${rev_v}" }
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { resp: $.data.id }
            - call: "POST /reputation/review-responses/${resp}/submit"
              payload: {}
              as: ResponseAgent
              as_user_id: "agent-1"
            - call: "POST /reputation/review-responses/${resp}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /reputation/review-responses/${resp}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_LISTING_NOT_CONNECTED"
            - "Listing.${lst_y}.sync_state == PENDING_SYNC"
            - "ReviewResponse.${resp}.state == APPROVED (unchanged)"
            - "ReviewResponse.${resp}.published_at == null"
            - "Review.${rev}.response_state == APPROVED (not RESPONDED)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: contact_frequency_cap_half_open_window_rejects_then_allows_at_exact_end
        grounds:
          - validations[priority=21]
          - errors[ERR_FREQUENCY_CAP_ACTIVE]
          - entities.Contact.fields.last_requested_at
          - entities.Business.fields.default_frequency_cap_days
        distinguishing_aspect: |
          Resource entity = Contact; interval semantics = a HALF-OPEN cooldown [last_requested_at,
          last_requested_at + 30d) with no buffer. One second before the end (2026-05-30T23:59:59Z) the
          enqueue is rejected; at exactly the end instant (2026-05-31T00:00:00Z) it succeeds, because the
          interval's right edge is exclusive.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with three CONNECTED listings; Business.default_frequency_cap_days == 30."
            - "An EMAIL campaign RUNNING with credits_allocated 10 and daily_send_cap 10."
            - "Contact C1 already has one QUEUED request, so last_requested_at == 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group", default_frequency_cap_days: 30 }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_y}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_f}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/businesses/${biz_id}/contacts"
              payload: { full_name: "E One", email: "e1@example.com", email_consent: true }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Spring Asks", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 10, credits_allocated: 10, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req1: $.data.id }
          trigger:
            - call: "POST /reputation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /reputation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req2: $.data.id }
          assert:
            - "at 2026-05-30T23:59:59Z: HTTP status == 409 and error_id == ERR_FREQUENCY_CAP_ACTIVE"
            - "at 2026-05-31T00:00:00Z: HTTP status == 201 and ReviewRequest.${req2}.status == QUEUED"
            - "Contact.${c1}.request_count == 2"
            - "Contact.${c1}.last_requested_at == 2026-05-31T00:00:00.000Z"
            - "Campaign.${camp}.credits_reserved == 2"

      - name: campaign_send_window_buffered_edge_rejects_touching_allows_one_minute_gap
        grounds:
          - validations[priority=20]
          - errors[ERR_SEND_WINDOW_CONFLICT]
          - entities.Campaign.fields.send_window_start
          - state_machines.Campaign.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Resource entity = Location (shared per-channel send capacity); interval semantics = CLOSED
          windows expanded by a symmetric 15-minute buffer, so touching exactly at the buffer edge IS a
          collision. Against A = 09:00-11:00 the window 11:15-12:00 collides (660 + 15 == 675) while
          11:16-12:00 does not (660 + 15 < 676) — arithmetic entirely unlike the Contact half-open cooldown.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with three CONNECTED listings."
            - "Campaign A: EMAIL, send window 09:00-11:00, SCHEDULED."
            - "Campaign B: EMAIL, send window 11:15-12:00, still DRAFT."
            - "Campaign C: EMAIL, send window 11:16-12:00, still DRAFT."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v1: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Campaign A", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v1}" }
              as: PlatformAdmin
              captures: { camp_a: $.data.id }
            - call: "POST /reputation/campaigns/${camp_a}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v2: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Campaign B", channel: "EMAIL", message_body: "Rate us", send_window_start: "11:15", send_window_end: "12:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v2}" }
              as: PlatformAdmin
              captures: { camp_b: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v3: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Campaign C", channel: "EMAIL", message_body: "Rate us", send_window_start: "11:16", send_window_end: "12:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v3}" }
              as: PlatformAdmin
              captures: { camp_c: $.data.id }
          trigger:
            - call: "POST /reputation/campaigns/${camp_b}/schedule"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /reputation/campaigns/${camp_c}/schedule"
              payload: {}
              as: PlatformAdmin
              captures: { c_status: $.data.status }
          assert:
            - "scheduling Campaign B: HTTP status == 409 and error_id == ERR_SEND_WINDOW_CONFLICT"
            - "Campaign.${camp_b}.status == DRAFT (unchanged)"
            - "scheduling Campaign C: HTTP status == 200 and Campaign.${camp_c}.status == SCHEDULED"
            - "Campaign.${camp_a}.status == SCHEDULED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: campaign_spendable_credits_conserved_on_enqueue_then_cancel
        grounds:
          - state_machines.ReviewRequest.QUEUED_to_SUPPRESSED
          - entities.Campaign.fields.credits_reserved
          - entities.Campaign.fields.credits_released
          - entities.Campaign.fields.credits_consumed
        distinguishing_aspect: |
          Conserved quantity = SPENDABLE CREDITS, pinned as
          `Campaign.credits_allocated - Campaign.credits_reserved - Campaign.credits_consumed`.
          Enqueue (forward) reserves one credit and cancel (compensating) releases it, so the quantity
          returns to exactly 5 with zero drift, while credits_released records the round trip.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location OPEN with three CONNECTED listings."
            - "An EMAIL campaign with credits_allocated 5, RUNNING, with no requests yet: spendable credits == 5."
            - "One email-consenting contact."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
