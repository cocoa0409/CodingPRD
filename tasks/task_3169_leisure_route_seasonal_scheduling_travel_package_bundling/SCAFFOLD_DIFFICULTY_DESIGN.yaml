# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3169_leisure_route_seasonal_scheduling_travel_package_bundling
# Nine §0.5 rules × 2 instances each = 18 instances.
# Every setup chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_diverges_on_cancelled_bundle
        grounds:
          - calculations.settlement_gross_payable
          - entities.SupplierSettlement.fields.gross_payable_cents
          - entities.SupplierSettlement.fields.clawback_cents
        distinguishing_aspect: |
          Same settlement window and same supplier, two valid algorithms produce
          different gross_payable_cents: PROVISIONAL counts ACTIVE and CANCELLED
          bundles whose flight_date is in the window, FINAL counts only bundles
          still ACTIVE at finalize. This is a settlement-ledger variant on
          SupplierSettlement — a different entity domain from the booking-side
          snapshot variant exercised in the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Stations SCK (origin) and SFB (leisure destination); route SCK->SFB with base_fare_cents 9900."
            - "OPEN SeasonWindow 2027-03-01..2027-03-31."
            - "Publication for Mondays with first=last=2027-03-01 (a Monday); one SCHEDULED FlightInstance F1 on 2027-03-01."
            - "Aircraft A319 assigned to F1."
            - "HOTEL SupplierOffer H for SFB, net_cost_cents 12000, sell_price_cents 20000."
            - "Two PACKAGE bookings B1 and B2 on F1, each consuming offer H."
            - "B1 is cancelled before settlement creation."
          setup_api_calls:
            - &dd_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkPlanner
            - &dd_s_origin
              call: "POST /stations"
              payload: { iata_code: "SCK", station_kind: "ORIGIN_SMALL_CITY", timezone: "America/Los_Angeles", single_station_flag: true }
              as: NetworkPlanner
              captures: { st_origin: $.data.id }
            - &dd_s_dest
              call: "POST /stations"
              payload: { iata_code: "SFB", station_kind: "LEISURE_DESTINATION", timezone: "America/New_York" }
              as: NetworkPlanner
              captures: { st_dest: $.data.id }
            - &dd_route
              call: "POST /routes"
              payload: { origin_station_id: "${st_origin}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 2 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
            - &dd_window
              call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - &dd_activate
              call: "POST /routes/${route_id}/activate"
              payload: {}
              as: NetworkPlanner
            - &dd_pub
              call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - &dd_list_flights
              call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
              captures: { f1_id: "$.data[0].id", f1_v0: "$.data[0].version" }
            - &dd_aircraft
              call: "POST /aircraft"
              payload: { tail_number: "N901NV", seat_capacity: 156, daily_utilization_cap_minutes: 480, peak_day_cap_minutes: 720 }
              as: OpsController
              captures: { ac_id: $.data.id }
            - &dd_assign_ac
              call: "POST /flight-instances/${f1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
            - &dd_offer_h
              call: "POST /supplier-offers"
              payload: { supplier_code: "HTL-SFB-1", component_kind: "HOTEL", destination_station_id: "${st_dest}", net_cost_cents: 12000, sell_price_cents: 20000 }
              as: FinanceAnalyst
              captures: { offer_h: $.data.id }
            - &dd_b1
              call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 2, booking_kind: "PACKAGE", hotel_offer_id: "${offer_h}", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { b1_id: $.data.id }
            - &dd_b2
              call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${offer_h}", expected_flight_version: "${f1_v0} + 1" }
              as: CustomerService
              captures: { b2_id: $.data.id }
            - &dd_b1_cancel
              call: "POST /bookings/${b1_id}/cancel"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /supplier-settlements"
              payload: { supplier_code: "HTL-SFB-1", period_start_date: "2027-03-01", period_end_date: "2027-03-31" }
              as: FinanceAnalyst
              captures: { settlement_id: $.data.id, prov_gross: $.data.gross_payable_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: FinanceAnalyst
            - call: "POST /supplier-settlements/${settlement_id}/finalize"
              payload: {}
              as: FinanceAnalyst
              captures: { final_gross: $.data.gross_payable_cents, final_clawback: $.data.clawback_cents }
          assert:
            - "provisional gross_payable_cents == 24000 (both B1 and B2 counted under the PROVISIONAL variant)"
            - "final gross_payable_cents == 12000 (only the still-ACTIVE B2 counted under the FINAL variant)"
            - "final clawback_cents == 12000 (B1's net cost moved into clawback)"
            - "provisional != final — the two variants diverge on identical window data"

      - name: base_fare_snapshot_vs_live_route_fare
        grounds:
          - calculations.base_fare_total
          - entities.Booking.fields.base_fare_total_cents
          - entities.Route.fields.base_fare_cents
        distinguishing_aspect: |
          Booking.base_fare_total_cents is a pinned snapshot taken at booking
          time from Route.base_fare_cents; the Route's fare is the live value.
          Two valid interpretations of "the fare for this booking" — snapshot vs
          live — produce different numbers once the route fare changes. This is
          a booking-fare variant on Booking/Route, a different entity domain
          from the settlement variant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route with base_fare_cents 9900; one SCHEDULED FlightInstance F1; aircraft assigned."
            - "Booking B1 (AIR_ONLY, 2 passengers) created while fare is 9900."
            - "NetworkPlanner then updates route economics by closing and recreating the route context — modelled here as: a SECOND route R2 on the same station pair is NOT allowed, so the snapshot test instead verifies B1's pinned fare differs from a second booking B2 made after a fare change. Because base_fare_cents is input-only at route creation, the snapshot divergence is tested via two routes: R_A fare 9900 (booking B_A) and R_B fare 12900 (booking B_B), each flight identical otherwise."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
          trigger:
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 2, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { b_air: $.data.id, b_air_total: $.data.base_fare_total_cents }
          assert:
            - "Booking.${b_air}.base_fare_total_cents == 19800 (2 * 9900, snapshot at booking time)"
            - "Booking.${b_air}.ancillary_total_cents == 0"
            - "Booking.${b_air}.booking_kind == AIR_ONLY"
            - "Booking.${b_air}.package_bundle_id is null"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: utilization_cap_multibranch_peak_vs_nonpeak
        grounds:
          - calculations.aircraft_daily_utilization_check
          - entities.Aircraft.fields.daily_utilization_cap_minutes
          - entities.Aircraft.fields.peak_day_cap_minutes
          - entities.FlightInstance.fields.is_peak_day
        distinguishing_aspect: |
          Mode (a) — multi-input formula with a conditional branch on entity
          state: applicable_cap is selected from {daily_utilization_cap_minutes,
          peak_day_cap_minutes} by the FlightInstance.is_peak_day boolean, which
          itself derives from the route's peak-day set at publish. Three inputs
          (day_minutes accumulator, target.block_minutes, branch-selected cap)
          interact non-linearly.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route with one OPEN window covering 2027-03-01..2027-03-07."
            - "Publication publishing Monday 2027-03-01 (non-peak) and Friday 2027-03-06 is NOT possible in one publication (operating_days_mask [1,5] would emit both); here a single Monday publication yields one SCHEDULED flight F1 (2027-03-01, block 240)."
            - "Aircraft with daily_utilization_cap_minutes 480, peak_day_cap_minutes 720."
            - "F1 already assigned to the aircraft (uses 240 of 480 non-peak minutes)."
            - "A second publication emits F2 on Monday 2027-03-08 — wait, that is outside the window; instead the window is 2027-03-01..2027-03-31 and F2 is 2027-03-08, block 240."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - call: "POST /routes"
              payload: { origin_station_id: "${st_origin}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 4 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *dd_activate
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-29", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
              captures: { f1_id: "$.data[0].id", f2_id: "$.data[1].id" }
            - *dd_aircraft
            - *dd_assign_ac
          trigger:
            - call: "POST /flight-instances/${f2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
          assert:
            - "the response status is 200 — day_minutes was 0 for 2027-03-08, proposed 240 <= 480 non-peak cap"
            - "FlightInstance.${f2_id}.aircraft_id == ${ac_id}"
            - "FlightInstance.${f2_id}.is_peak_day == false (Monday not in the route peak-day set)"

      - name: settlement_rounding_order_pinned_sum_then_store
        grounds:
          - calculations.settlement_gross_payable
          - calculations.package_bundle_price
        distinguishing_aspect: |
          Mode (b) — nested aggregation where the order matters: bundle prices
          are summed per-bundle from frozen component sell_price_cents first,
          then settlement gross sums per-bundle net_cost_cents across bundles.
          Summing components across bundles before aggregating per bundle (the
          alternative reading) yields the same integer here, so the pinned
          order is verified by asserting bundle_price_cents per-bundle and the
          settlement total over three bundles with mixed component sets — the
          test pins the evaluation order so the value is well-defined.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route, window, publication, flight F1 (2027-03-01), aircraft assigned."
            - "Three offers for the same supplier SUP-X: HOTEL H (net 10000, sell 18000), RENTAL_CAR C (net 4000, sell 7500), ATTRACTION T (net 1500, sell 3000)."
            - "Three PACKAGE bookings on F1: B_H (hotel only), B_HC (hotel+car), B_HCT (hotel+car+attraction)."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
            - call: "POST /supplier-offers"
              payload: { supplier_code: "SUP-X", component_kind: "HOTEL", destination_station_id: "${st_dest}", net_cost_cents: 10000, sell_price_cents: 18000 }
              as: FinanceAnalyst
              captures: { off_h: $.data.id }
            - call: "POST /supplier-offers"
              payload: { supplier_code: "SUP-X", component_kind: "RENTAL_CAR", destination_station_id: "${st_dest}", net_cost_cents: 4000, sell_price_cents: 7500 }
              as: FinanceAnalyst
              captures: { off_c: $.data.id }
            - call: "POST /supplier-offers"
              payload: { supplier_code: "SUP-X", component_kind: "ATTRACTION_TICKET", destination_station_id: "${st_dest}", net_cost_cents: 1500, sell_price_cents: 3000 }
              as: FinanceAnalyst
              captures: { off_t: $.data.id }
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${off_h}", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk_h: $.data.id, bk_h_bundle: $.data.package_bundle_id }
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${off_h}", rental_car_offer_id: "${off_c}", expected_flight_version: "${f1_v0} + 1" }
              as: CustomerService
              captures: { bk_hc: $.data.id, bk_hc_bundle: $.data.package_bundle_id }
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${off_h}", rental_car_offer_id: "${off_c}", attraction_offer_id: "${off_t}", expected_flight_version: "${f1_v0} + 2" }
              as: CustomerService
              captures: { bk_hct: $.data.id, bk_hct_bundle: $.data.package_bundle_id }
          trigger:
            - call: "GET /package-bundles/${bk_h_bundle}"
              payload: {}
              as: FinanceAnalyst
              captures: { price_h: $.data.bundle_price_cents }
            - call: "GET /package-bundles/${bk_hc_bundle}"
              payload: {}
              as: FinanceAnalyst
              captures: { price_hc: $.data.bundle_price_cents }
            - call: "GET /package-bundles/${bk_hct_bundle}"
              payload: {}
              as: FinanceAnalyst
              captures: { price_hct: $.data.bundle_price_cents }
            - call: "POST /supplier-settlements"
              payload: { supplier_code: "SUP-X", period_start_date: "2027-03-01", period_end_date: "2027-03-31" }
              as: FinanceAnalyst
              captures: { stl_x: $.data.id, gross_x: $.data.gross_payable_cents }
          assert:
            - "PackageBundle.${bk_h_bundle}.bundle_price_cents == 18000 (hotel only)"
            - "PackageBundle.${bk_hc_bundle}.bundle_price_cents == 25500 (18000 + 7500)"
            - "PackageBundle.${bk_hct_bundle}.bundle_price_cents == 28500 (18000 + 7500 + 3000)"
            - "SupplierSettlement.${stl_x}.gross_payable_cents == 32500 (per-bundle net sums: 10000 + 14000 + 15500, summed after per-bundle aggregation)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: route_posture_cycles_active_suspended_active
        grounds:
          - state_machines.Route
          - entities.Route.fields.route_posture
          - entities.Route.fields.suspended_seasons_count
        distinguishing_aspect: |
          Route's posture machine is cyclic: SEASONAL_ACTIVE ->
          SEASONALLY_SUSPENDED -> SEASONAL_ACTIVE via reactivate, and the cycle
          can repeat across seasons — suspended_seasons_count accumulates each
          traversal, proving the loop is re-entrant rather than a one-shot
          revert.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route with one OPEN window, activated (SEASONAL_ACTIVE)."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
          trigger:
            - call: "POST /routes/${route_id}/suspend"
              payload: {}
              as: NetworkPlanner
              captures: { post_suspend_posture: $.data.route_posture, post_suspend_count: $.data.suspended_seasons_count }
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Summer 2027", window_start_date: "2027-06-01", window_end_date: "2027-08-31" }
              as: NetworkPlanner
            - call: "POST /routes/${route_id}/reactivate"
              payload: {}
              as: NetworkPlanner
              captures: { post_reactivate_posture: $.data.route_posture }
          assert:
            - "post-suspend route_posture == SEASONALLY_SUSPENDED"
            - "post-suspend suspended_seasons_count == 1"
            - "post-reactivate route_posture == SEASONAL_ACTIVE — the cycle closed"
            - "suspended_seasons_count remains 1 after reactivation (accumulator does not reset)"

      - name: booking_parallel_strand_rebook_dimensions
        grounds:
          - state_machines.Booking
          - entities.Booking.fields.booking_status
          - entities.Booking.fields.stranded_until_date
        distinguishing_aspect: |
          Booking's machine is branching with a revert loop: CONFIRMED ->
          STRANDED -> STRANDED_REBOOKED -> (operated) CONFIRMED, and
          STRANDED_REBOOKED can be cancelled — a fork-join shape where the
          disruption branch and the customer-cancellation branch carry
          divergent side-effect sets (rebook recomputes seats on two flights;
          cancel cascades to ancillaries and bundle). Non-linear on Booking, a
          different entity from Route.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route, window 2027-03-01..2027-03-31, publication for Mondays 2027-03-01..2027-03-29 yielding F1..F5; aircraft assigned to all."
            - "AIR_ONLY booking B1 (1 pax) on F1."
            - "Disruption cancels F1 -> B1 STRANDED with stranded_until_date 2027-03-08 (F2's date)."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - call: "POST /routes"
              payload: { origin_station_id: "${st_origin}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 4 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *dd_activate
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-29", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
              captures: { f1_id: "$.data[0].id", f1_v0: "$.data[0].version", f2_id: "$.data[1].id" }
            - *dd_aircraft
            - *dd_assign_ac
            - call: "POST /flight-instances/${f2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk1: $.data.id, bk1_v0: $.data.version }
            - call: "POST /routes/${route_id}/disruptions"
              payload: { flight_instance_id: "${f1_id}", reason_code: "WEATHER" }
              as: OpsController
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk1}/rebook"
              payload: { target_flight_instance_id: "${f2_id}", expected_booking_version: "${bk1_v0} + 1" }
              as: CustomerService
              captures: { bk1_status: $.data.booking_status, bk1_flight: $.data.flight_instance_id, bk1_stranded: $.data.stranded_until_date }
          assert:
            - "Booking.${bk1}.booking_status == STRANDED_REBOOKED"
            - "Booking.${bk1}.flight_instance_id == ${f2_id}"
            - "Booking.${bk1}.stranded_until_date is null (cleared on rebook)"
            - "FlightInstance.${f2_id}.seats_sold == 1"
            - "DisruptionEvent.${disp_id}.disruption_status == RECOVERED (all stranded bookings resolved)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depths >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: route_suspend_cascade_depth3
        grounds:
          - state_machines.Route
          - state_machines.SeasonWindow
          - state_machines.SchedulePublication
          - state_machines.FlightInstance
          - state_machines.Booking
        distinguishing_aspect: |
          Depth-3 chain from POST /routes/{id}/suspend: route suspension ->
          OPEN SeasonWindows -> SUSPENDED (hop 1); window suspension -> its
          PUBLISHED SchedulePublications -> FROZEN (hop 2); publication freeze
          -> its SCHEDULED FlightInstances -> CANCELLED via synthesized
          LOW_DEMAND DisruptionEvents (hop 3); each flight cancellation ->
          CONFIRMED Bookings -> STRANDED with recomputed stranded_until_date
          (hop 4). Each hop is caused by the previous hop's mutation, not by
          the original call.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route SEASONAL_ACTIVE with one OPEN window and one PUBLISHED publication emitting F1 (2027-03-01) and F2 (2027-03-08); aircraft assigned to both."
            - "AIR_ONLY booking B1 (1 pax) on F1."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - call: "POST /routes"
              payload: { origin_station_id: "${st_origin}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 4 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *dd_activate
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-08", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
              captures: { f1_id: "$.data[0].id", f1_v0: "$.data[0].version", f2_id: "$.data[1].id" }
            - *dd_aircraft
            - *dd_assign_ac
            - call: "POST /flight-instances/${f2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk1: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/suspend"
              payload: {}
              as: NetworkPlanner
          assert:
            - "Route.${route_id}.route_posture == SEASONALLY_SUSPENDED"
            - "SeasonWindow.${window_id}.window_status == SUSPENDED"
            - "SchedulePublication.${pub_id}.publication_status == FROZEN"
            - "FlightInstance.${f1_id}.flight_status == CANCELLED and cancelled_by_disruption_id is non-null"
            - "FlightInstance.${f2_id}.flight_status == CANCELLED"
            - "Booking.${bk1}.booking_status == STRANDED"
            - "Booking.${bk1}.stranded_until_date is null (no SCHEDULED flight remains on the route)"

      - name: booking_cancel_cascade_depth2
        grounds:
          - state_machines.Booking
          - state_machines.PackageBundle
          - state_machines.SupplierSettlement
        distinguishing_aspect: |
          Depth-2 chain from POST /bookings/{id}/cancel (a different trigger
          from route suspension): booking cancellation -> PackageBundle ->
          CANCELLED (hop 1); bundle cancellation -> covering PROVISIONAL
          SupplierSettlement.clawback_cents += net_cost_cents and status ->
          CLAWED_BACK (hop 2). Different conserved ledger than the route
          cascade.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Full pipeline: route, window, publication, flight F1 (2027-03-01), aircraft, HOTEL offer H (net 12000), PACKAGE booking B1 on F1."
            - "PROVISIONAL SupplierSettlement for the hotel's supplier covering 2027-03-01..2027-03-31 with gross_payable_cents 12000."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
            - *dd_offer_h
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${offer_h}", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk1: $.data.id, bundle1: $.data.package_bundle_id }
            - call: "POST /supplier-settlements"
              payload: { supplier_code: "HTL-SFB-1", period_start_date: "2027-03-01", period_end_date: "2027-03-31" }
              as: FinanceAnalyst
              captures: { stl_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk1}/cancel"
              payload: {}
              as: CustomerService
          assert:
            - "Booking.${bk1}.booking_status == CANCELLED"
            - "PackageBundle.${bundle1}.bundle_status == CANCELLED"
            - "SupplierSettlement.${stl_id}.clawback_cents == 12000"
            - "SupplierSettlement.${stl_id}.settlement_status == CLAWED_BACK"
            - "FlightInstance.${f1_id}.seats_sold == 0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_publish
        grounds:
          - validations.priority_4
          - validations.priority_5
          - errors.ERR_WINDOW_NOT_OPEN
          - errors.ERR_PUBLISH_HORIZON_VIOLATION
        distinguishing_aspect: |
          Pair (state, business_temporal): publishing into a SUSPENDED window
          AND with first_operating_date only 10 days ahead violates priority-4
          (window state) and priority-5 (publish horizon). The state error
          ERR_WINDOW_NOT_OPEN must win because state (4) precedes
          business_temporal (5).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route with window 2026-09-01..2027-03-31; window suspended; route is SEASONALLY_SUSPENDED."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Long Window", window_start_date: "2026-09-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *dd_activate
            - call: "POST /routes/${route_id}/season-windows/${window_id}/suspend"
              payload: {}
              as: NetworkPlanner
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2026-09-11", last_operating_date: "2026-09-11", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_WINDOW_NOT_OPEN (priority-4 state wins)"
            - "error_id != ERR_PUBLISH_HORIZON_VIOLATION (priority-5 temporal suppressed)"

      - name: business_referential_vs_business_constraint_on_package_booking
        grounds:
          - validations.priority_8
          - validations.priority_10
          - errors.ERR_OFFER_WRONG_DESTINATION
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: |
          Pair (business_referential, OCC state): a PACKAGE booking whose hotel
          offer serves the WRONG destination and whose expected_flight_version
          is stale violates priority-8 (referential) and priority-12 (OCC).
          The referential error ERR_OFFER_WRONG_DESTINATION must win because
          business_referential (8) precedes the OCC check (12).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route, window, publication, flight F1; aircraft assigned."
            - "HOTEL offer H_wrong whose destination_station_id is a DIFFERENT leisure station (LAS) than the route's destination (SFB)."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
            - call: "POST /stations"
              payload: { iata_code: "LAS", station_kind: "LEISURE_DESTINATION", timezone: "America/Los_Angeles" }
              as: NetworkPlanner
              captures: { st_las: $.data.id }
            - call: "POST /supplier-offers"
              payload: { supplier_code: "HTL-LAS-9", component_kind: "HOTEL", destination_station_id: "${st_las}", net_cost_cents: 9000, sell_price_cents: 15000 }
              as: FinanceAnalyst
              captures: { offer_wrong: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${offer_wrong}", expected_flight_version: "${f1_v0} - 1" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_OFFER_WRONG_DESTINATION (priority-8 referential wins)"
            - "error_id != ERR_STALE_VERSION (priority-12 OCC suppressed)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: utilization_cap_equality_allowed
        grounds:
          - calculations.aircraft_daily_utilization_check
          - errors.ERR_UTILIZATION_CAP_EXCEEDED
        distinguishing_aspect: |
          Numeric threshold metric: proposed_total == applicable_cap is allowed
          (strictly-greater rejects). Two flights of 240 + 240 = 480 minutes on
          a 480-minute non-peak cap both assign; a third minute would reject.
          Endpoint: POST /flight-instances/{id}/assign-aircraft.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route, window 2027-03-01..2027-03-31, publication for Mondays emitting F1 (2027-03-01, 240 min). Second publication for the same Monday route is prevented by frequency cap 2 -> instead two separate routes R1/R2 sharing one aircraft is over-complex; simpler: ONE publication with operating_days_mask [1,4] (Mon+Thu) emits F_Mon (2027-03-01) and F_Thu (2027-03-04). To put two flights on the SAME date, use two publications on disjoint weekday masks cannot collide on date; therefore this test uses daily cap 480 reached by two SEPARATE flights on the same date from two DIFFERENT routes sharing one tail: R_A (SCK->SFB) publishes F_A on 2027-03-01 (240 min), R_B (MRY->SFB) publishes F_B on 2027-03-01 (240 min)."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
            - call: "POST /stations"
              payload: { iata_code: "MRY", station_kind: "ORIGIN_SMALL_CITY", timezone: "America/Los_Angeles" }
              as: NetworkPlanner
              captures: { st_mry: $.data.id }
            - call: "POST /routes"
              payload: { origin_station_id: "${st_mry}", destination_station_id: "${st_dest}", base_fare_cents: 8900, weekly_frequency_cap: 2 }
              as: NetworkPlanner
              captures: { route_b: $.data.id }
            - call: "POST /routes/${route_b}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_b: $.data.id, window_b_v0: $.data.version }
            - call: "POST /routes/${route_b}/activate"
              payload: {}
              as: NetworkPlanner
            - call: "POST /routes/${route_b}/publications"
              payload: { season_window_id: "${window_b}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "12:30", block_minutes: 240, expected_window_version: "${window_b_v0}" }
              as: NetworkPlanner
              captures: { pub_b: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_b}" }
              as: OpsController
              captures: { f_b_id: "$.data[0].id" }
          trigger:
            - call: "POST /flight-instances/${f_b_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
          assert:
            - "the response status is 200 — 240 + 240 == 480 exactly equals the non-peak cap, and == is allowed"
            - "FlightInstance.${f_b_id}.aircraft_id == ${ac_id}"

      - name: rebook_capacity_equality_allowed
        grounds:
          - calculations.rebook_capacity_check
          - errors.ERR_REBOOK_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Seat-count metric on a different endpoint (POST /bookings/{id}/rebook):
          projected_seats == seat_capacity is allowed. Aircraft with capacity 2,
          one existing booking of 1 seat, rebooking a stranded 1-seat booking
          fills the aircraft exactly to capacity and must succeed.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route, window, publication emitting F1 (2027-03-01) and F2 (2027-03-08); aircraft (capacity 2) assigned to both."
            - "F2 already has one AIR_ONLY booking of 1 seat (seats_sold == 1)."
            - "F1 has one AIR_ONLY booking B1 of 1 seat; disruption cancels F1 -> B1 STRANDED."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - call: "POST /routes"
              payload: { origin_station_id: "${st_origin}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 4 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *dd_activate
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-08", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
              captures: { f1_id: "$.data[0].id", f1_v0: "$.data[0].version", f2_id: "$.data[1].id", f2_v0: "$.data[0].version" }
            - call: "POST /aircraft"
              payload: { tail_number: "N902NV", seat_capacity: 2, daily_utilization_cap_minutes: 480, peak_day_cap_minutes: 720 }
              as: OpsController
              captures: { ac2_id: $.data.id }
            - call: "POST /flight-instances/${f1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac2_id}" }
              as: OpsController
            - call: "POST /flight-instances/${f2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac2_id}" }
              as: OpsController
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f2_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f2_v0} + 1" }
              as: CustomerService
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0} + 1" }
              as: CustomerService
              captures: { bk1: $.data.id, bk1_v0: $.data.version }
            - call: "POST /routes/${route_id}/disruptions"
              payload: { flight_instance_id: "${f1_id}", reason_code: "MAINTENANCE" }
              as: OpsController
          trigger:
            - call: "POST /bookings/${bk1}/rebook"
              payload: { target_flight_instance_id: "${f2_id}", expected_booking_version: "${bk1_v0} + 1" }
              as: CustomerService
          assert:
            - "the response status is 200 — 1 existing + 1 rebooked == capacity 2 exactly, and == is allowed"
            - "Booking.${bk1}.booking_status == STRANDED_REBOOKED"
            - "FlightInstance.${f2_id}.seats_sold == 2"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: publication_creation_gated_by_window_open
        grounds:
          - state_machines.SchedulePublication
          - state_machines.SeasonWindow
          - errors.ERR_WINDOW_NOT_OPEN
        distinguishing_aspect: |
          Pair (SchedulePublication, SeasonWindow): a publication can only be
          created while its parent SeasonWindow is OPEN. Suspending the window
          blocks further publication even though the publication entity itself
          is new and stateless.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route SEASONAL_ACTIVE with window 2027-03-01..2027-03-31 OPEN."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - call: "POST /routes/${route_id}/season-windows/${window_id}/suspend"
              payload: {}
              as: NetworkPlanner
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0} + 1" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_WINDOW_NOT_OPEN"
            - "no SchedulePublication was created (GET /routes/${route_id}/publications returns 0 rows)"

      - name: rebook_gated_by_target_flight_scheduled
        grounds:
          - state_machines.Booking
          - state_machines.FlightInstance
          - errors.ERR_REBOOK_FLIGHT_INVALID
        distinguishing_aspect: |
          Pair (Booking, FlightInstance): the booking's STRANDED ->
          STRANDED_REBOOKED transition is gated on the TARGET flight's state
          (must be SCHEDULED on the same route) — a different entity pair from
          publication/window. Targeting a CANCELLED flight is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route with publication emitting F1 (2027-03-01) and F2 (2027-03-08); aircraft assigned to both."
            - "Booking B1 on F1; disruptions cancel BOTH F1 and F2 (two separate DisruptionEvents)."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - call: "POST /routes"
              payload: { origin_station_id: "${st_origin}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 4 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *dd_activate
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-08", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
              captures: { f1_id: "$.data[0].id", f1_v0: "$.data[0].version", f2_id: "$.data[1].id" }
            - *dd_aircraft
            - *dd_assign_ac
            - call: "POST /flight-instances/${f2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk1: $.data.id, bk1_v0: $.data.version }
            - call: "POST /routes/${route_id}/disruptions"
              payload: { flight_instance_id: "${f1_id}", reason_code: "WEATHER" }
              as: OpsController
            - call: "POST /routes/${route_id}/disruptions"
              payload: { flight_instance_id: "${f2_id}", reason_code: "WEATHER" }
              as: OpsController
          trigger:
            - call: "POST /bookings/${bk1}/rebook"
              payload: { target_flight_instance_id: "${f2_id}", expected_booking_version: "${bk1_v0} + 1" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REBOOK_FLIGHT_INVALID (target flight is CANCELLED, not SCHEDULED)"
            - "Booking.${bk1}.booking_status remains STRANDED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: weekly_frequency_cap_aggregate_overlap
        grounds:
          - calculations.weekly_frequency_check
          - errors.ERR_FREQUENCY_CAP_EXCEEDED
        distinguishing_aspect: |
          Aggregate-capacity interval semantics: a publication occupying
          weekdays in an ISO week is rejected when the WEEK'S total departures
          on the route would exceed weekly_frequency_cap — the unit of conflict
          is the (route, ISO-week) aggregate, not a point-in-time slot.
          Cap 2, existing publication emits Mon+Fri (2 departures), a second
          publication for Thursday in the same week would make 3 > 2 and is
          rejected; cap equality (2 == 2) was already allowed for the first
          publication.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route weekly_frequency_cap 2; window 2027-03-01..2027-03-31."
            - "First publication with operating_days_mask [1,5] covering the single week 2027-03-01..2027-03-05 (Mon 03-01 + Fri 03-05 = 2 departures, at cap)."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - call: "POST /routes"
              payload: { origin_station_id: "${st_origin}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 2 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *dd_activate
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1, 5], first_operating_date: "2027-03-01", last_operating_date: "2027-03-05", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub1: $.data.id }
            - call: "GET /routes/${route_id}/season-windows/${window_id}"
              payload: {}
              as: NetworkPlanner
              captures: { window_v1: $.data.version }
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [4], first_operating_date: "2027-03-04", last_operating_date: "2027-03-04", departure_time_local: "13:00", block_minutes: 240, expected_window_version: "${window_v1}" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FREQUENCY_CAP_EXCEEDED (3 weekly departures > cap 2)"
            - "the first publication's two FlightInstances remain SCHEDULED"

      - name: aircraft_daily_utilization_point_capacity
        grounds:
          - calculations.aircraft_daily_utilization_check
          - errors.ERR_UTILIZATION_CAP_EXCEEDED
        distinguishing_aspect: |
          Point-in-time accumulated-capacity semantics on a different resource
          (Aircraft, not Route-week): the tail's block-minute budget for ONE
          calendar date is the contended interval. Two 240-minute flights on
          the same date against a 480-minute cap fit exactly; a third 1-minute
          flight on that date exceeds 480 and is rejected — different interval
          arithmetic from the route-week aggregate.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two routes R_A (SCK->SFB) and R_B (MRY->SFB) each publish one flight on 2027-03-01: F_A (240 min) and F_B (240 min), both assigned to one aircraft with non-peak cap 480 (already at cap)."
            - "A third route R_C (FAT->SFB) publishes F_C on 2027-03-01 with block_minutes 1."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
            - call: "POST /stations"
              payload: { iata_code: "MRY", station_kind: "ORIGIN_SMALL_CITY", timezone: "America/Los_Angeles" }
              as: NetworkPlanner
              captures: { st_mry: $.data.id }
            - call: "POST /routes"
              payload: { origin_station_id: "${st_mry}", destination_station_id: "${st_dest}", base_fare_cents: 8900, weekly_frequency_cap: 2 }
              as: NetworkPlanner
              captures: { route_b: $.data.id }
            - call: "POST /routes/${route_b}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_b: $.data.id, window_b_v0: $.data.version }
            - call: "POST /routes/${route_b}/activate"
              payload: {}
              as: NetworkPlanner
            - call: "POST /routes/${route_b}/publications"
              payload: { season_window_id: "${window_b}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "12:30", block_minutes: 240, expected_window_version: "${window_b_v0}" }
              as: NetworkPlanner
              captures: { pub_b: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_b}" }
              as: OpsController
              captures: { f_b_id: "$.data[0].id" }
            - call: "POST /flight-instances/${f_b_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
            - call: "POST /stations"
              payload: { iata_code: "FAT", station_kind: "ORIGIN_SMALL_CITY", timezone: "America/Los_Angeles" }
              as: NetworkPlanner
              captures: { st_fat: $.data.id }
            - call: "POST /routes"
              payload: { origin_station_id: "${st_fat}", destination_station_id: "${st_dest}", base_fare_cents: 7900, weekly_frequency_cap: 2 }
              as: NetworkPlanner
              captures: { route_c: $.data.id }
            - call: "POST /routes/${route_c}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_c: $.data.id, window_c_v0: $.data.version }
            - call: "POST /routes/${route_c}/activate"
              payload: {}
              as: NetworkPlanner
            - call: "POST /routes/${route_c}/publications"
              payload: { season_window_id: "${window_c}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "18:00", block_minutes: 1, expected_window_version: "${window_c_v0}" }
              as: NetworkPlanner
              captures: { pub_c: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_c}" }
              as: OpsController
              captures: { f_c_id: "$.data[0].id" }
          trigger:
            - call: "POST /flight-instances/${f_c_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_UTILIZATION_CAP_EXCEEDED (480 + 1 > 480)"
            - "FlightInstance.${f_c_id}.aircraft_id remains null"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seats_sold_conserved_across_book_and_cancel
        grounds:
          - entities.FlightInstance.fields.seats_sold
          - state_machines.Booking
        distinguishing_aspect: |
          Conserved quantity: FlightInstance.seats_sold. Invariant — for any
          flight, seats_sold equals the sum of passenger_count over its
          CONFIRMED/STRANDED/STRANDED_REBOOKED bookings. Booking creation adds
          exactly passenger_count; booking cancellation removes exactly
          passenger_count; the pair of compensating actions returns seats_sold
          to its prior value with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route, window, publication, flight F1 with aircraft; seats_sold == 0."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
          trigger:
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 3, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk1: $.data.id }
            - call: "POST /bookings/${bk1}/cancel"
              payload: {}
              as: CustomerService
          assert:
            - "after booking: FlightInstance.${f1_id}.seats_sold == 3"
            - "after cancel: FlightInstance.${f1_id}.seats_sold == 0 (invariant restored, zero drift)"

      - name: settlement_ledger_conserved_across_cancel_and_finalize
        grounds:
          - calculations.settlement_gross_payable
          - entities.SupplierSettlement.fields.gross_payable_cents
          - entities.SupplierSettlement.fields.clawback_cents
        distinguishing_aspect: |
          Conserved quantity: the settlement ledger identity
          final_gross_payable_cents + clawback_cents == provisional_gross_payable_cents
          must hold when bundles cancel between provisional issuance and
          finalization. Money neither appears nor vanishes — cancelled bundles
          move their net_cost_cents from gross into clawback. Different
          conserved quantity from seats_sold.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Route, window, publication, flight F1 (2027-03-01), aircraft; HOTEL offer H (net 12000)."
            - "Two PACKAGE bookings B1, B2 on F1 (both consume H)."
            - "PROVISIONAL settlement S for HTL-SFB-1 over 2027-03-01..2027-03-31 (provisional gross 24000)."
            - "B1 cancelled -> S.clawback 12000, status CLAWED_BACK."
          setup_api_calls:
            - *dd_clock
            - *dd_s_origin
            - *dd_s_dest
            - *dd_route
            - *dd_window
            - *dd_activate
            - *dd_pub
            - *dd_list_flights
            - *dd_aircraft
            - *dd_assign_ac
            - *dd_offer_h
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${offer_h}", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk1: $.data.id }
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${offer_h}", expected_flight_version: "${f1_v0} + 1" }
              as: CustomerService
              captures: { bk2: $.data.id }
            - call: "POST /supplier-settlements"
              payload: { supplier_code: "HTL-SFB-1", period_start_date: "2027-03-01", period_end_date: "2027-03-31" }
              as: FinanceAnalyst
              captures: { stl_id: $.data.id, stl_prov_gross: $.data.gross_payable_cents }
            - call: "POST /bookings/${bk1}/cancel"
              payload: {}
              as: CustomerService
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: FinanceAnalyst
          trigger:
            - call: "POST /supplier-settlements/${stl_id}/finalize"
              payload: {}
              as: FinanceAnalyst
              captures: { stl_final_gross: $.data.gross_payable_cents, stl_final_claw: $.data.clawback_cents }
          assert:
            - "provisional gross_payable_cents == 24000"
            - "after cancel: clawback_cents == 12000"
            - "final gross_payable_cents == 12000"
            - "final gross + clawback == provisional gross (12000 + 12000 == 24000) — ledger conserved"
