        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_SCRAP_NOTE_REQUIRED]"]
        distinguishing_aspect: "Sorting to SCRAP with empty/missing condition_notes fails with ERR_SCRAP_NOTE_REQUIRED (422); A/B sorts do not require the note."
        test_recipe:
          setup: ["batch SORTING with two UNSORTED cores"]
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "NoteCo", agreed_unit_price_cents: 100, manifest_count: 2, estimated_grade_mix: { A: 0.5, B: 0.0, SCRAP: 0.5 } }
