            - "Affiliation.${aff_id}.earnout_unallocated_cents == 90000000 and EarnoutTranche.${tr_id}.status == PROJECTED"

      - name: logical_clock_rejects_backward_moves_and_accepts_equal
        claim_type: Temporal validation
        grounds:
          - validations[priority=36]
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints["POST /dso/_clock/set_current_utc"]
        distinguishing_aspect: "Re-setting the clock to its current value is an accepted no-op while any earlier value returns ERR_CLOCK_NOT_MONOTONIC, and the created_at of a row written afterwards proves which value survived."
        test_recipe:
          setup:
            - "The logical clock set to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
          trigger:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59Z" }
              as: DsoIntegrationLead
              captures: { err: "$.data.error_id" }
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
          assert:
            - "The equal-value call returns HTTP 200 and is a no-op"
            - "The backward call returns HTTP 422 with data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "The forward call returns HTTP 200 and Affiliation.${aff_id}.created_at == 2026-09-02T00:00:00Z"

