      - name: referential_beats_clearability_beats_grace_on_lot_sort
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=20]
          - errors.ERR_OFFER_MANUFACTURER_MISMATCH
          - errors.ERR_OFFER_NOT_CLEARABLE
          - errors.ERR_SUBMISSION_PAST_GRACE
        distinguishing_aspect: |
          A three-deep ladder on one endpoint, peeled one rung at a time. A lot
          sorted against a REGISTERED (never-activated) offer belonging to
          manufacturer A but tagged with manufacturer B's id, after the offer's
          grace window has closed, violates priority 12, priority 13 and
          priority 20 at once. Fixing only the manufacturer id exposes the
          clearability error; using the sibling offer that did reach ACTIVE (and
          then EXPIRED via the clock sweep) exposes the grace error alone. Any
          implementation that checks dates before ownership, or clearability
          before ownership, returns the wrong error on the first call.
        test_recipe:
          setup:
            - "clock starts at 2026-08-01T00:00:00Z, then advances once to 2026-08-16T00:00:00Z"
            - "manufacturer A (prefix 038000) owns two offers, both expiration_date 2026-08-10 with redemption_grace_days 5, so the last legal sort date is 2026-08-15"
            - "offer P1 is registered AND activated while the clock is still 2026-08-01 (activate requires expiration_date >= the clock date), so the 2026-08-16 sweep moves it ACTIVE -> EXPIRED — clearable but past grace"
            - "offer P2 is only registered, so it stays REGISTERED — not clearable AND past grace"
            - "manufacturer B (prefix 072250) exists and is ACTIVE, purely to be the wrong owner"
            - "a submission of an ACTIVE retailer is taken to intake_status COUNT_VERIFIED with verified_count 2 and no lots yet, so the priority-8 state gate is satisfied on every trigger call"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_a_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { legal_name: "Thrift Beverage", gs1_company_prefix: "072250", handling_fee_policy: "TIERED_RATE", dispute_window_days: 30 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_b_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "BOTH", payment_terms: "NET_30", base_fee_tier: "STANDARD", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_a_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-08-10", redemption_instructions: "Save 50c on two cans", barcode_family: "GS1_DATABAR", max_redemptions: 100000, purchase_requirement_units: 2, redemption_grace_days: 5, digital_enabled: false, clip_validity_days: 14 }
              as: Manufacturer
              as_user_id: "${mfr_a_id}"
              captures: { offer_p1_id: $.data.id }
            - call: "POST /offers/${offer_p1_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_a_id}"
            - call: "POST /offers/${offer_p1_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_a_id}", offer_code: "SOUP60", face_value_cents: 60, handling_fee_cents: 7, expiration_date: "2026-08-10", redemption_instructions: "Save 60c on two cans", barcode_family: "GS1_DATABAR", max_redemptions: 100000, purchase_requirement_units: 2, redemption_grace_days: 5, digital_enabled: false, clip_validity_days: 14 }
              as: Manufacturer
              as_user_id: "${mfr_a_id}"
              captures: { offer_p2_id: $.data.id }
            - call: "POST /offers/${offer_p2_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_a_id}"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 2, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_p2_id}", manufacturer_id: "${mfr_b_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_p2_id}", manufacturer_id: "${mfr_a_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_p1_id}", manufacturer_id: "${mfr_a_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
          assert:
            - "the clock call returned expired_offer_count == 1 (only P1 was ACTIVE)"
            - "Offer.${offer_p1_id}.status == EXPIRED and Offer.${offer_p2_id}.status == REGISTERED"
            - "rung 1: trigger call 1 returns 422 ERR_OFFER_MANUFACTURER_MISMATCH (priority 12 beats both 13 and 20)"
            - "rung 2: trigger call 2 returns 422 ERR_OFFER_NOT_CLEARABLE (priority 13 beats 20)"
            - "rung 3: trigger call 3 returns 422 ERR_SUBMISSION_PAST_GRACE (2026-08-16 > 2026-08-10 + 5 days)"
            - "no lot was created by any of the three calls: Submission.${sub_id}.sorted_lot_count == 0 and intake_status == COUNT_VERIFIED"

      - name: safety_beats_temporal_beats_capability_on_submission_intake
        grounds:
          - validations[priority=10]
          - validations[priority=17]
          - validations[priority=23]
          - errors.ERR_RETAILER_SUSPENDED
          - errors.ERR_POSTMARK_WINDOW_OVERLAP
          - errors.ERR_CHANNEL_NOT_SUPPORTED
        distinguishing_aspect: |
          Three rules of three different categories collide on POST
          /submissions: the priority-10 safety gate (403), the priority-17
          temporal overlap gate (409) and the priority-23 capability gate (422).
          The three HTTP statuses are all different, so the ladder is observable
          from the status line alone. Each rung is peeled by changing exactly one
          thing — reinstate the retailer, then move the window off the overlap,
          then switch the channel — and the fourth call, with all three
          satisfied, must create the submission.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "retailer with channel_capability MAIL_ONLY holds one open submission on the half-open window [2026-07-01, 2026-07-31) in intake_status RECEIVED (not CLOSED, so it still contends)"
            - "the retailer is then administratively SUSPENDED"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "MAIL_ONLY", payment_terms: "NET_30", base_fee_tier: "STANDARD", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 2, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_open_id: $.data.id }
            - call: "POST /retailers/${ret_id}/suspend"
              payload: { reason: "Fraud review pending" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "ELECTRONIC", declared_count: 2, postmark_window_start: "2026-07-10", postmark_window_end: "2026-07-20" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /retailers/${ret_id}/reinstate"
              payload: { reason: "Review closed with no finding" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "ELECTRONIC", declared_count: 2, postmark_window_start: "2026-07-10", postmark_window_end: "2026-07-20" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "ELECTRONIC", declared_count: 2, postmark_window_start: "2026-07-31", postmark_window_end: "2026-08-10" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 2, postmark_window_start: "2026-07-31", postmark_window_end: "2026-08-10" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_new_id: $.data.id }
          assert:
            - "rung 1: trigger call 1 returns 403 ERR_RETAILER_SUSPENDED (priority 10 beats both 17 and 23)"
            - "rung 2: trigger call 3 returns 409 ERR_POSTMARK_WINDOW_OVERLAP (priority 17 beats 23) — [2026-07-10, 2026-07-20) overlaps the open [2026-07-01, 2026-07-31)"
            - "rung 3: trigger call 4 returns 422 ERR_CHANNEL_NOT_SUPPORTED — the window starting exactly on the open window's exclusive end is adjacent, not overlapping, so only the capability rule remains"
            - "satisfaction: trigger call 5 returns 201 and Submission.${sub_new_id}.channel == MAIL with intake_status RECEIVED and settlement_status PENDING"
            - "Retailer.${ret_id}.status == ACTIVE and handling_fee_tier == STANDARD after the reinstatement"
            - "exactly two Submissions exist for this retailer: GET /submissions?retailer_id=${ret_id} returns 2 rows"

  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: lot_sort_on_final_grace_day_inclusive
        grounds:
          - validations[priority=20]
          - errors.ERR_SUBMISSION_PAST_GRACE
          - entities.Offer.fields.redemption_grace_days
          - endpoints.POST./_clock/set_current_utc
        distinguishing_aspect: |
          The redemption grace window closes on expiration_date +
          redemption_grace_days INCLUSIVE. With expiration_date 2026-08-10 and
          redemption_grace_days 5 the last legal sort date is 2026-08-15. The
          test probes boundary-1 (2026-08-14, accepted), the boundary itself
          (2026-08-15, accepted) and boundary+1 (2026-08-16, refused 422), so an
          off-by-one in either direction fails: a strict `<` comparison rejects
          the 2026-08-15 call and a `<= +6` comparison accepts the 2026-08-16
          one. The clock is only ever moved forward, honouring monotonicity.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default while the offer is registered and activated (activate requires expiration_date >= the clock date)"
            - "offer face 50, expiration_date 2026-08-10, redemption_grace_days 5"
            - "submission declared 6 / verified 6 so three lots of counted_qty 2 would fit and the submission stays in COUNT_VERIFIED after two of them"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "BOTH", payment_terms: "NET_30", base_fee_tier: "STANDARD", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-08-10", redemption_instructions: "Save 50c on two cans", barcode_family: "GS1_DATABAR", max_redemptions: 100000, purchase_requirement_units: 2, redemption_grace_days: 5, digital_enabled: false, clip_validity_days: 14 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /submissions"
