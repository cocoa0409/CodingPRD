              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - call: "POST /records/schedules/${sch_tmp}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
          trigger:
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_sub}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 5, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 1.0 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { err_napp: $.data.error_id }
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_tmp}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 5, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 1.0 }
