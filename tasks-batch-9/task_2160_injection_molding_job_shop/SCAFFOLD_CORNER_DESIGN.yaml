        distinguishing_aspect: "A SCHEDULED, UNSTAGED job rejects three different conditional actions with three distinct codes: unblock gives ERR_JOB_NOT_BLOCKED, start gives ERR_JOB_MATERIAL_NOT_STAGED (the run axis is fine, the material axis is not) and complete gives ERR_JOB_NOT_RUNNING."
