      - name: voiding_the_first_funded_draw_rebuilds_the_par_split_and_reprices_the_surviving_draw
        grounds:
          - calculations.negative_arbitrage_cost
          - state_machines.DrawRequest.FUNDED_to_VOIDED
          - endpoints[POST /draw-requests/{id}/void]
          - entities.BondIssue.cumulative_funded_cents
          - entities.BondIssue.undrawn_cents
        distinguishing_aspect: |
          A THIRD CONSERVED QUANTITY: the bond's par split, under
          par_amount_cents == cumulative_funded_cents + undrawn_cents. The
          compensation is not a simple subtraction, because voiding the EARLIER
          draw restores the undrawn balance the LATER draw accrued against, so
          the survivor's own accrual must RISE from 344,444 to 861,111 - a
          reversal implemented as "total minus the voided accrual" would leave
          1,191,666 - 847,222 = 344,444 and be wrong by 516,667 cents. The
          per-period rounding order is also visible: 861,111 is the floor-half-up
          of 861,111.11 for a single 62-day period on 200,000,000 at 250 bps.
