      - name: unit_not_amendable_and_ceiling_errors_triggerable
        claim_type: Violation → Error
        grounds:
          - errors.ERR_UNIT_NOT_AMENDABLE
          - errors.ERR_CONTRACT_CEILING_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unit_not_amendable_state_check_preempts_contract_ceiling_check
          rationale: "That §1.8 instance raises ERR_UNIT_NOT_AMENDABLE on the DELIVERED unit and ERR_CONTRACT_CEILING_EXCEEDED on the amendable one, so both catalog entries are exercised."

      - name: axle_load_exceeded_triggerable
        claim_type: Violation → Error
        grounds:
