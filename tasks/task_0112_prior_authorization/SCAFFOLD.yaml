scenario: |
  Medical Prior Authorization Workflow: service/drug pre-approval request,
  clinical evidence upload, insurance review (Peer-to-Peer), expedited request,
  denial/Appeal three-tier process, expiration resubmission.

domain_name: prior-authorization
api_prefix: /authorization-requests

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - version_pinning_on_approval
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "Insurance member identifier", constraints: "unique across system" }
      - { name: full_name, type: string, source: input, description: "Patient full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: plan_type, type: enum, source: input, description: "COMMERCIAL | MEDICARE | MEDICAID", constraints: "one of COMMERCIAL, MEDICARE, MEDICAID" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE", constraints: "one of ACTIVE, INACTIVE" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier", constraints: "unique, 10 digits" }
      - { name: full_name, type: string, source: input, description: "Provider full legal name" }
      - { name: specialty, type: string, source: input, description: "Provider specialty (e.g., CARDIOLOGY)" }
      - { name: in_network, type: boolean, source: input, description: "Whether provider is in-network", default: true }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE", constraints: "one of ACTIVE, SUSPENDED" }

  - name: ServiceCatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "CPT/HCPCS/NDC code", constraints: "unique" }
      - { name: kind, type: enum, source: input, description: "SERVICE | DRUG", constraints: "one of SERVICE, DRUG" }
      - { name: name, type: string, source: input, description: "Human-readable name" }
      - { name: requires_pa, type: boolean, source: input, description: "Whether this catalog item requires prior authorization", default: true }
      - { name: standard_sla_hours, type: integer, source: input, description: "SLA decision window for standard requests, in hours", default: 336, constraints: ">= 24" }
      - { name: expedited_sla_hours, type: integer, source: input, description: "SLA decision window for expedited requests, in hours", default: 72, constraints: ">= 4 and < standard_sla_hours" }
      - { name: approval_validity_days, type: integer, source: input, description: "How many days an APPROVED authorization remains usable from approved_at", default: 90, constraints: ">= 1" }
      - { name: required_evidence_categories, type: array, source: input, description: "Required evidence categories (e.g., LAB, IMAGING, NOTES, MED_HISTORY)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: "ACTIVE", constraints: "one of ACTIVE, RETIRED" }

  - name: AuthorizationRequest
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK to Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK to Provider.id (requesting provider)" }
      - { name: service_code, type: string, source: input, description: "ServiceCatalogItem.code at submission time (denormalized)" }
      - { name: service_catalog_item_id, type: string, source: input, description: "FK to ServiceCatalogItem.id" }
      - { name: service_catalog_item_version, type: integer, source: system, description: "Pinned version of ServiceCatalogItem at submission time" }
      - { name: urgency, type: enum, source: input, description: "STANDARD | EXPEDITED", default: "STANDARD", constraints: "one of STANDARD, EXPEDITED" }
      - { name: clinical_justification, type: string, source: input, description: "Free-text clinical justification, max 4000 chars" }
      - { name: requested_units, type: integer, source: input, description: "Number of units (visits / doses / sessions) requested", constraints: ">= 1" }
      - { name: prior_request_id, type: string, source: input, description: "Self-referential FK; set when this request is a resubmission of a prior EXPIRED authorization", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | PENDING_INFO | PEER_REVIEW | APPROVED | DENIED | EXPIRED | WITHDRAWN", constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, PENDING_INFO, PEER_REVIEW, APPROVED, DENIED, EXPIRED, WITHDRAWN" }
      - { name: submitted_at, type: datetime, source: system, description: "ISO 8601 UTC timestamp when status first transitioned to SUBMITTED" }
      - { name: decision_deadline_at, type: datetime, source: computed, description: "Computed deadline by which payer must decide (see calc: decision_deadline)" }
      - { name: decided_at, type: datetime, source: system, description: "ISO 8601 UTC timestamp when APPROVED/DENIED first reached" }
      - { name: expires_at, type: datetime, source: computed, description: "Computed expiration timestamp for APPROVED authorizations (approved_at + ServiceCatalogItem.approval_validity_days)" }
      - { name: evidence_completeness_score, type: number, source: computed, description: "Weighted score 0..1 over required_evidence_categories" }
      - { name: evidence_reuse_discount, type: number, source: computed, description: "Resubmission discount factor applied to required-evidence completeness when prior_request_id is set" }

  - name: ClinicalEvidence
    parent: AuthorizationRequest
    common_fields: false
    fields:
      - { name: authorization_request_id, type: string, source: system, description: "FK to AuthorizationRequest.id" }
      - { name: category, type: enum, source: input, description: "LAB | IMAGING | NOTES | MED_HISTORY | OTHER", constraints: "one of LAB, IMAGING, NOTES, MED_HISTORY, OTHER" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: uri, type: string, source: input, description: "Opaque storage reference (e.g., s3://...)" }
      - { name: byte_size, type: integer, source: input, description: "Document size in bytes", constraints: ">= 1 and <= 50_000_000" }
      - { name: sourced_from_request_id, type: string, source: input, description: "If reused from a prior request, the source AuthorizationRequest.id; otherwise null", default: null }
      - { name: status, type: enum, source: system, description: "ATTACHED | WITHDRAWN", default: "ATTACHED", constraints: "one of ATTACHED, WITHDRAWN" }

  - name: PeerToPeerReview
    parent: AuthorizationRequest
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: system, description: "FK to AuthorizationRequest.id" }
      - { name: scheduled_at, type: datetime, source: input, description: "Proposed P2P timeslot (ISO 8601 UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Duration of the P2P call window", constraints: ">= 15 and <= 60" }
      - { name: payer_reviewer_id, type: string, source: input, description: "Opaque payer reviewer identifier (PayerReviewer X-User-ID)" }
      - { name: outcome, type: enum, source: system, description: "PENDING | UPHELD | OVERTURNED | NO_SHOW", default: "PENDING", constraints: "one of PENDING, UPHELD, OVERTURNED, NO_SHOW" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: "SCHEDULED", constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }
      - { name: notes, type: string, source: input, description: "Reviewer notes captured at completion", default: null }

  - name: Decision
    parent: AuthorizationRequest
    common_fields: false
    fields:
      - { name: authorization_request_id, type: string, source: system, description: "FK to AuthorizationRequest.id" }
      - { name: outcome, type: enum, source: input, description: "APPROVED | DENIED", constraints: "one of APPROVED, DENIED" }
      - { name: rationale, type: string, source: input, description: "Reviewer rationale, max 4000 chars" }
      - { name: approved_units, type: integer, source: input, description: "Units approved (<= AuthorizationRequest.requested_units); 0 when DENIED", default: 0 }
      - { name: denial_reason_code, type: enum, source: input, description: "Required when outcome=DENIED: NOT_MEDICALLY_NECESSARY | EXPERIMENTAL | OUT_OF_NETWORK | EVIDENCE_INSUFFICIENT | NON_COVERED_BENEFIT", default: null, constraints: "one of NOT_MEDICALLY_NECESSARY, EXPERIMENTAL, OUT_OF_NETWORK, EVIDENCE_INSUFFICIENT, NON_COVERED_BENEFIT" }
      - { name: decided_by_role, type: enum, source: system, description: "INITIAL_REVIEWER | MEDICAL_DIRECTOR | EXTERNAL_REVIEWER (the role producing this decision)" }
      - { name: supersedes_decision_id, type: string, source: system, description: "Prior Decision.id this decision overrides (set when a successful appeal overturns the prior outcome)", default: null }

  - name: Appeal
    parent: AuthorizationRequest
    common_fields: true
    fields:
      - { name: authorization_request_id, type: string, source: system, description: "FK to AuthorizationRequest.id" }
      - { name: tier, type: integer, source: system, description: "1=reconsideration | 2=medical_director | 3=external_review", constraints: "one of 1, 2, 3" }
      - { name: reason, type: string, source: input, description: "Free-text appeal reason from the provider/patient, max 4000 chars" }
      - { name: filed_at, type: datetime, source: system, description: "ISO 8601 UTC timestamp when appeal was filed" }
      - { name: decision_deadline_at, type: datetime, source: computed, description: "Per-tier SLA deadline (see calc: appeal_decision_deadline)" }
      - { name: outcome, type: enum, source: system, description: "PENDING | UPHELD | OVERTURNED | WITHDRAWN", default: "PENDING", constraints: "one of PENDING, UPHELD, OVERTURNED, WITHDRAWN" }
      - { name: decided_at, type: datetime, source: system, description: "ISO 8601 UTC timestamp when appeal decided" }
      - { name: superseded_decision_id, type: string, source: system, description: "FK to Decision.id this appeal targets (the prior denial)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AuthorizationRequest
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /authorization-requests/{id}/submit"
        actor: Provider
        preconditions:
          - "ServiceCatalogItem.status must be ACTIVE (ERR_CATALOG_RETIRED)"
          - "Patient.status must be ACTIVE (ERR_PATIENT_INACTIVE)"
          - "Provider.status must be ACTIVE (ERR_PROVIDER_SUSPENDED)"
          - "If urgency=EXPEDITED, clinical_justification must contain ≥ 50 non-whitespace chars (ERR_EXPEDITED_JUSTIFICATION_REQUIRED)"
        side_effects:
          - "submitted_at = now()"
          - "service_catalog_item_version pinned to ServiceCatalogItem.version at submission"
          - "decision_deadline_at computed via calc: decision_deadline"
          - "evidence_completeness_score computed via calc: evidence_completeness"
          - "evidence_reuse_discount computed via calc: evidence_reuse_discount"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /authorization-requests/{id}/start-review"
        actor: InitialReviewer
        preconditions:
          - "evidence_completeness_score >= 0.50 (ERR_EVIDENCE_INSUFFICIENT)"
        side_effects: []

      - from: UNDER_REVIEW
        to: PENDING_INFO
        trigger: "POST /authorization-requests/{id}/request-info"
        actor: InitialReviewer
        preconditions: []
        side_effects:
          - "decision_deadline_at extended by 7 days for STANDARD urgency, 24 hours for EXPEDITED urgency (calc: decision_deadline applies pending_info_extension)"

      - from: PENDING_INFO
        to: UNDER_REVIEW
        trigger: "POST /authorization-requests/{id}/resume-review"
        actor: InitialReviewer
        preconditions:
          - "evidence_completeness_score >= 0.75 (ERR_EVIDENCE_INSUFFICIENT)"
        side_effects: []

      - from: UNDER_REVIEW
        to: PEER_REVIEW
        trigger: "POST /authorization-requests/{id}/peer-to-peer"
        actor: Provider
        preconditions:
          - "No PeerToPeerReview already in SCHEDULED or COMPLETED for this request (ERR_PEER_REVIEW_ALREADY_SCHEDULED)"
        side_effects:
          - "Create PeerToPeerReview with status=SCHEDULED, outcome=PENDING"

      - from: PEER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /peer-to-peer-reviews/{id}/complete"
        actor: PayerReviewer
        preconditions:
          - "PeerToPeerReview.status = SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "PeerToPeerReview.status = COMPLETED"
          - "PeerToPeerReview.outcome set to UPHELD | OVERTURNED | NO_SHOW from request payload"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /authorization-requests/{id}/decide"
        actor: InitialReviewer
        preconditions:
          - "outcome=APPROVED, approved_units >= 1 and <= requested_units (ERR_INVALID_APPROVED_UNITS)"
        side_effects:
          - "Create Decision with outcome=APPROVED, decided_by_role=INITIAL_REVIEWER"
          - "decided_at = now()"
          - "expires_at computed via calc: approval_expiration"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /authorization-requests/{id}/decide"
        actor: InitialReviewer
        preconditions:
          - "outcome=DENIED, denial_reason_code provided (ERR_DENIAL_REASON_REQUIRED)"
        side_effects:
          - "Create Decision with outcome=DENIED, decided_by_role=INITIAL_REVIEWER"
          - "decided_at = now()"

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /_clock/advance (auto-sweep) when now() >= expires_at"
        actor: system
        preconditions:
          - "now() >= expires_at"
        side_effects:
          - "No new Appeal allowed; resubmission must create a new AuthorizationRequest referencing prior_request_id"

      - from: DENIED
        to: APPROVED
        trigger: "POST /appeals/{id}/decide with outcome=OVERTURNED"
        actor: MedicalDirector | ExternalReviewer | InitialReviewer
        preconditions:
          - "An Appeal targeting the latest DENIED Decision exists, transitioning to OVERTURNED"
        side_effects:
          - "Create new Decision with outcome=APPROVED, decided_by_role = role of appeal decider, supersedes_decision_id = prior DENIED Decision.id"
          - "decided_at = now() (on the new Decision)"
          - "AuthorizationRequest.decided_at = now()"
          - "expires_at computed via calc: approval_expiration"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /authorization-requests/{id}/withdraw"
        actor: Provider
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /authorization-requests/{id}/withdraw"
        actor: Provider
        preconditions: []
        side_effects:
          - "Any PeerToPeerReview in SCHEDULED → CANCELLED"

      - from: PENDING_INFO
        to: WITHDRAWN
        trigger: "POST /authorization-requests/{id}/withdraw"
        actor: Provider
        preconditions: []
        side_effects: []

  - entity: PeerToPeerReview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /peer-to-peer-reviews/{id}/complete"
        actor: PayerReviewer
        preconditions:
          - "outcome in {UPHELD, OVERTURNED, NO_SHOW} (ERR_INVALID_P2P_OUTCOME)"
        side_effects:
          - "Parent AuthorizationRequest.status transitions PEER_REVIEW → UNDER_REVIEW"
          - "If outcome=OVERTURNED, evidence_completeness_score is recomputed with peer_review_bonus = +0.10 (calc: evidence_completeness — variant: post_p2p)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /peer-to-peer-reviews/{id}/cancel"
        actor: Provider | PayerReviewer
        preconditions: []
        side_effects:
          - "Parent AuthorizationRequest.status transitions PEER_REVIEW → UNDER_REVIEW (revert)"

  - entity: Appeal
    initial_state: PENDING
    terminal_states: [UPHELD, OVERTURNED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /appeals/{id}/decide"
        actor: "InitialReviewer (tier=1) | MedicalDirector (tier=2) | ExternalReviewer (tier=3)"
        preconditions:
          - "Caller role matches tier (ERR_APPEAL_TIER_ROLE_MISMATCH)"
          - "Parent AuthorizationRequest.status = DENIED (ERR_INVALID_STATE)"
          - "now() <= decision_deadline_at + 0h (ERR_APPEAL_DEADLINE_EXPIRED)"
        side_effects:
          - "decided_at = now()"
          - "No state change on parent AuthorizationRequest (remains DENIED)"

      - from: PENDING
        to: OVERTURNED
        trigger: "POST /appeals/{id}/decide"
        actor: "InitialReviewer (tier=1) | MedicalDirector (tier=2) | ExternalReviewer (tier=3)"
        preconditions:
          - "Caller role matches tier (ERR_APPEAL_TIER_ROLE_MISMATCH)"
          - "Parent AuthorizationRequest.status = DENIED (ERR_INVALID_STATE)"
          - "now() <= decision_deadline_at + 0h (ERR_APPEAL_DEADLINE_EXPIRED)"
          - "approved_units >= 1 (ERR_INVALID_APPROVED_UNITS)"
        side_effects:
          - "decided_at = now()"
          - "Cascading: AuthorizationRequest.status transitions DENIED → APPROVED with new Decision per AuthorizationRequest state machine"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Provider
        preconditions: []
        side_effects:
          - "decided_at = now()"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two InitialReviewers decide the same request simultaneously"
    guarantee: "Exactly one decision is recorded; second is rejected as the status already advanced past UNDER_REVIEW"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on AuthorizationRequest.status transition out of UNDER_REVIEW"

  - scenario: "Two providers schedule a peer-to-peer for the same authorization at the same time"
    guarantee: "At most one PeerToPeerReview per authorization is in SCHEDULED or COMPLETED; the second request is rejected"
    error_id: ERR_PEER_REVIEW_ALREADY_SCHEDULED
    http_status: 409
    serialization: "First-writer-wins on PeerToPeerReview creation per authorization_request_id"

  - scenario: "Provider files two appeals at the same tier for the same DENIED decision concurrently"
    guarantee: "At most one PENDING Appeal exists per (authorization_request_id, tier); second is rejected"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    serialization: "First-writer-wins on Appeal creation per (authorization_request_id, tier)"

  - scenario: "Resubmission and expiration-sweep run for the same prior request concurrently"
    guarantee: "Only the first resubmission succeeds; subsequent resubmissions targeting the same prior_request_id are rejected"
    error_id: ERR_RESUBMISSION_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on AuthorizationRequest creation per prior_request_id"

  - scenario: "PATCH (e.g., update clinical_justification) collides with a state transition on the same authorization"
    guarantee: "Stale-version PATCHes are rejected"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "Optimistic concurrency on AuthorizationRequest.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: decision_deadline
    trigger: "AuthorizationRequest.submitted_at set; recomputed on UNDER_REVIEW → PENDING_INFO and PENDING_INFO → UNDER_REVIEW transitions"
    algorithm: threshold
    formula: |
      base = ServiceCatalogItem.standard_sla_hours if urgency == STANDARD else ServiceCatalogItem.expedited_sla_hours
      pending_info_extension_hours = 0
      for each completed UNDER_REVIEW → PENDING_INFO → UNDER_REVIEW cycle on this request:
        pending_info_extension_hours += (168 if urgency == STANDARD else 24)
      decision_deadline_at = submitted_at + (base + pending_info_extension_hours) hours
    input_set: "AuthorizationRequest.urgency; ServiceCatalogItem.standard_sla_hours / expedited_sla_hours (version pinned at submission); count of PENDING_INFO cycles"
    constants:
      STANDARD_PENDING_INFO_EXTENSION_HOURS: 168
      EXPEDITED_PENDING_INFO_EXTENSION_HOURS: 24
    precision: "datetime to the second (ISO 8601 UTC, three fractional digits)"
    variants:
      - name: standard
        when: "urgency == STANDARD"
        difference: "base = standard_sla_hours; extension per pending-info cycle = 168 hours"
      - name: expedited
        when: "urgency == EXPEDITED"
        difference: "base = expedited_sla_hours; extension per pending-info cycle = 24 hours"

  - name: appeal_decision_deadline
    trigger: "Appeal.filed_at set (i.e., appeal created)"
    algorithm: threshold
    formula: |
      hours_by_tier = { 1: 240, 2: 480, 3: 720 }   # 10 days, 20 days, 30 days
      if AuthorizationRequest.urgency == EXPEDITED:
        hours_by_tier = { 1: 72, 2: 96, 3: 168 }   # 3 days, 4 days, 7 days
      Appeal.decision_deadline_at = Appeal.filed_at + hours_by_tier[Appeal.tier] hours
    input_set: "Appeal.tier; AuthorizationRequest.urgency"
    constants:
      STANDARD_T1_HOURS: 240
      STANDARD_T2_HOURS: 480
      STANDARD_T3_HOURS: 720
      EXPEDITED_T1_HOURS: 72
      EXPEDITED_T2_HOURS: 96
      EXPEDITED_T3_HOURS: 168
    precision: "datetime to the second (ISO 8601 UTC, three fractional digits)"

  - name: evidence_completeness
    trigger: "Any ClinicalEvidence created or withdrawn under this AuthorizationRequest; on transitions SUBMITTED, PENDING_INFO ↔ UNDER_REVIEW, and PEER_REVIEW → UNDER_REVIEW when P2P outcome=OVERTURNED"
    algorithm: weighted_scoring
    formula: |
      required = ServiceCatalogItem.required_evidence_categories  # e.g. [LAB, IMAGING, NOTES, MED_HISTORY]
      attached_categories = { e.category : true for e in ClinicalEvidence
                              where authorization_request_id == this.id
                                and status == ATTACHED }
      if len(required) == 0:
        base_score = 1.0
      else:
        base_score = count(c for c in required if attached_categories.get(c, False)) / len(required)
      score = round(base_score - evidence_reuse_discount + post_p2p_bonus, 2)
      score = max(0.0, min(1.0, score))   # clamp into [0, 1]
      AuthorizationRequest.evidence_completeness_score = score
      # post_p2p_bonus = 0.10 if latest PeerToPeerReview.outcome == OVERTURNED else 0.00
      # evidence_reuse_discount per calc: evidence_reuse_discount
    input_set: "Required evidence categories from version-pinned ServiceCatalogItem; ClinicalEvidence rows with status=ATTACHED for this request; latest PeerToPeerReview.outcome"
    constants:
      P2P_OVERTURNED_BONUS: 0.10
    precision: "2 decimal places, round_half_up; clamped to [0.0, 1.0]"
    variants:
      - name: base
        when: "No completed PeerToPeerReview, or latest PeerToPeerReview.outcome != OVERTURNED"
        difference: "post_p2p_bonus = 0.00"
      - name: post_p2p
        when: "Latest PeerToPeerReview.outcome == OVERTURNED"
        difference: "post_p2p_bonus = +0.10 applied additively before clamp"

  - name: evidence_reuse_discount
    trigger: "AuthorizationRequest creation when prior_request_id is set; recomputed on every evidence_completeness recompute"
    algorithm: aggregation
    formula: |
      if prior_request_id is null:
        evidence_reuse_discount = 0.00
      else:
        prior = AuthorizationRequest where id == prior_request_id
        if prior is null:
          raise ERR_PRIOR_REQUEST_NOT_FOUND
        reused = count(e for e in ClinicalEvidence
                       where authorization_request_id == this.id
                         and sourced_from_request_id == prior.id
                         and status == ATTACHED)
        total_required = len(ServiceCatalogItem.required_evidence_categories)  # version-pinned
        if total_required == 0:
          evidence_reuse_discount = 0.00
        else:
          # The discount REDUCES evidence completeness by 0.05 per reused doc, capped at 0.20
          evidence_reuse_discount = min(0.20, 0.05 * reused)
      evidence_reuse_discount = round(evidence_reuse_discount, 2)
    input_set: "prior_request_id; ClinicalEvidence rows where sourced_from_request_id == prior.id"
    constants:
      DISCOUNT_PER_REUSED_DOC: 0.05
      DISCOUNT_CAP: 0.20
    precision: "2 decimal places, round_half_up"

  - name: approval_expiration
    trigger: "AuthorizationRequest transitions to APPROVED (initial decision or appeal-overturn)"
    algorithm: forward_looking
    formula: |
      approved_at = AuthorizationRequest.decided_at  # set on transition
      validity_days = ServiceCatalogItem.approval_validity_days  # version-pinned at submission
      expires_at = approved_at + validity_days * 24 hours
    input_set: "decided_at; version-pinned ServiceCatalogItem.approval_validity_days"
    constants: {}
    precision: "datetime to the second (ISO 8601 UTC, three fractional digits)"
    variants:
      - name: initial_approval
        when: "Decision.decided_by_role == INITIAL_REVIEWER"
        difference: "validity_days uses the version-pinned ServiceCatalogItem.approval_validity_days at original submission_at"
      - name: appeal_overturn
        when: "Decision.decided_by_role in {MEDICAL_DIRECTOR, EXTERNAL_REVIEWER}"
        difference: "validity_days STILL uses the version-pinned ServiceCatalogItem at original submission_at — the appeal does NOT re-pin the catalog version"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller's role is permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-parameter resources exist; resolved left-to-right (parent before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Foreign-key body references (patient_id, provider_id, service_catalog_item_id, authorization_request_id, payer_reviewer_id, prior_request_id) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /authorization-requests, POST .../clinical-evidence, POST .../peer-to-peer, POST .../appeals"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state-change endpoints"

  - priority: 6
    category: business_safety
    check: "ServiceCatalogItem.status must be ACTIVE at submission (RETIRED catalog items cannot be the basis for new authorization requests)"
    error_id: ERR_CATALOG_RETIRED
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/submit"

  - priority: 7
    category: business_safety
    check: "Patient.status must be ACTIVE on submit"
    error_id: ERR_PATIENT_INACTIVE
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/submit"

  - priority: 8
    category: business_safety
    check: "Provider.status must be ACTIVE on submit"
    error_id: ERR_PROVIDER_SUSPENDED
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/submit"

  - priority: 9
    category: business_constraint
    check: "Expedited urgency requires a clinical_justification of at least 50 non-whitespace characters"
    error_id: ERR_EXPEDITED_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /authorization-requests/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "evidence_completeness_score must be >= 0.50 to start initial review, and >= 0.75 to resume after PENDING_INFO"
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /authorization-requests/{id}/start-review, POST /authorization-requests/{id}/resume-review"

  - priority: 11
    category: business_referential
    check: "ClinicalEvidence.sourced_from_request_id, if set, must match the prior_request_id of the current AuthorizationRequest"
    error_id: ERR_EVIDENCE_REUSE_MISMATCH
    http_status: 422
    applies_to: "POST /authorization-requests/{authId}/clinical-evidence"

  - priority: 12
    category: business_temporal
    check: "Resubmission only permitted when prior_request_id refers to an AuthorizationRequest in EXPIRED status"
    error_id: ERR_PRIOR_REQUEST_NOT_EXPIRED
    http_status: 422
    applies_to: "POST /authorization-requests (creation with prior_request_id set)"

  - priority: 13
    category: business_temporal
    check: "Only one AuthorizationRequest may exist per prior_request_id (first-writer-wins on resubmission)"
    error_id: ERR_RESUBMISSION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /authorization-requests (creation with prior_request_id set)"

  - priority: 14
    category: business_constraint
    check: "Decision.approved_units must be in [1, AuthorizationRequest.requested_units] when outcome=APPROVED, and 0 when outcome=DENIED"
    error_id: ERR_INVALID_APPROVED_UNITS
    http_status: 422
    applies_to: "POST /authorization-requests/{id}/decide, POST /appeals/{id}/decide"

  - priority: 15
    category: business_constraint
    check: "denial_reason_code required when outcome=DENIED"
    error_id: ERR_DENIAL_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /authorization-requests/{id}/decide"

  - priority: 16
    category: business_referential
    check: "Caller's role must match the Appeal.tier (tier=1 InitialReviewer; tier=2 MedicalDirector; tier=3 ExternalReviewer)"
    error_id: ERR_APPEAL_TIER_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /appeals/{id}/decide"

  - priority: 17
    category: business_temporal
    check: "Appeals must be filed in strict tier order: tier=N may only be filed after tier=N-1 has reached UPHELD"
    error_id: ERR_APPEAL_TIER_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /authorization-requests/{id}/appeals"

  - priority: 18
    category: business_temporal
    check: "An appeal at a tier can only be filed if no PENDING Appeal at the same tier already exists for this request"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/appeals"

  - priority: 19
    category: business_temporal
    check: "now() must be <= Appeal.decision_deadline_at when deciding an appeal"
    error_id: ERR_APPEAL_DEADLINE_EXPIRED
    http_status: 422
    applies_to: "POST /appeals/{id}/decide"

  - priority: 20
    category: business_constraint
    check: "At most one PeerToPeerReview in {SCHEDULED, COMPLETED} per AuthorizationRequest"
    error_id: ERR_PEER_REVIEW_ALREADY_SCHEDULED
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/peer-to-peer"

  - priority: 21
    category: business_constraint
    check: "PeerToPeerReview.scheduled_at must be strictly after now() and must not overlap with another SCHEDULED P2P for the same payer_reviewer_id within the duration window (half-open [scheduled_at, scheduled_at + duration_minutes))"
    error_id: ERR_PEER_REVIEW_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/peer-to-peer"

  - priority: 22
    category: business_constraint
    check: "ClinicalEvidence.byte_size must be > 0 and <= 50_000_000"
    error_id: ERR_EVIDENCE_SIZE_INVALID
    http_status: 422
    applies_to: "POST /authorization-requests/{authId}/clinical-evidence"

  - priority: 23
    category: business_constraint
    check: "Two ClinicalEvidence rows under the same AuthorizationRequest in status=ATTACHED cannot share the same uri"
    error_id: ERR_EVIDENCE_DUPLICATE_URI
    http_status: 409
    applies_to: "POST /authorization-requests/{authId}/clinical-evidence"

  - priority: 24
    category: state
    check: "Version on PATCH or state-change requests must equal the resource's current version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "All PATCH and POST .../<action> endpoints on AuthorizationRequest, PeerToPeerReview, Appeal"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Patient ---
  - method: POST
    path: "/patients"
    description: "Register a new patient (test fixture / onboarding)"
    roles: [PlatformAdmin]
    code: 201
    input: [member_id, full_name, date_of_birth, plan_type]
    output: Patient
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/patients/{patientId}"
    description: "Fetch a patient"
    roles: [PlatformAdmin, Provider, InitialReviewer, MedicalDirector, ExternalReviewer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- Provider ---
  - method: POST
    path: "/providers"
    description: "Register a provider (test fixture / onboarding)"
    roles: [PlatformAdmin]
    code: 201
    input: [npi, full_name, specialty, "in_network?"]
    output: Provider
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/providers/{providerId}"
    description: "Fetch a provider"
    roles: [PlatformAdmin, Provider, InitialReviewer]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # --- ServiceCatalogItem ---
  - method: POST
    path: "/service-catalog-items"
    description: "Create a catalog item"
    roles: [PlatformAdmin]
    code: 201
    input: [code, kind, name, "requires_pa?", "standard_sla_hours?", "expedited_sla_hours?", "approval_validity_days?", "required_evidence_categories?"]
    output: ServiceCatalogItem
    side_effects: ["status=ACTIVE, version=1"]

  - method: GET
    path: "/service-catalog-items/{itemId}"
    description: "Fetch a catalog item"
    roles: [PlatformAdmin, Provider, InitialReviewer, MedicalDirector, ExternalReviewer]
    code: 200
    input: []
    output: ServiceCatalogItem
    side_effects: []

  - method: PATCH
    path: "/service-catalog-items/{itemId}"
    description: "Update a catalog item (changes apply only to future submissions; version-pinned references retain prior values)"
    roles: [PlatformAdmin]
    code: 200
    input: ["name?, standard_sla_hours?, expedited_sla_hours?, approval_validity_days?, required_evidence_categories?, version"]
    output: ServiceCatalogItem
    side_effects: ["version increments"]

  # --- AuthorizationRequest ---
  - method: POST
    path: "/authorization-requests"
    description: "Create a new authorization request in DRAFT status; if prior_request_id is set, this is a resubmission"
    roles: [Provider]
    code: 201
    input: [patient_id, provider_id, service_catalog_item_id, "urgency?", clinical_justification, requested_units, "prior_request_id?"]
    output: AuthorizationRequest
    side_effects: ["status=DRAFT; if prior_request_id set, validations 12 & 13 run; evidence_reuse_discount initialized to 0.00"]

  - method: GET
    path: "/authorization-requests/{authId}"
    description: "Fetch a specific authorization request (includes computed fields)"
    roles: [PlatformAdmin, Provider, InitialReviewer, MedicalDirector, ExternalReviewer, PayerReviewer]
    code: 200
    input: []
    output: AuthorizationRequest
    side_effects: []

  - method: GET
    path: "/authorization-requests"
    description: "List authorization requests with filtering and pagination"
    roles: [PlatformAdmin, Provider, InitialReviewer, MedicalDirector, ExternalReviewer]
    code: 200
    input: ["status?, urgency?, patient_id?, provider_id?, limit?, offset?"]
    output: "AuthorizationRequest[]"
    side_effects: []

  - method: PATCH
    path: "/authorization-requests/{authId}"
    description: "Update a DRAFT authorization request"
    roles: [Provider]
    code: 200
    input: ["clinical_justification?, requested_units?, urgency?, version"]
    output: AuthorizationRequest
    side_effects: ["Allowed only when status=DRAFT (ERR_INVALID_STATE otherwise)"]

  - method: POST
    path: "/authorization-requests/{authId}/submit"
    description: "Submit a DRAFT request for payer review"
    roles: [Provider]
    code: 200
    input: [version]
    output: AuthorizationRequest
    side_effects: ["DRAFT → SUBMITTED; submitted_at = now(); pin service_catalog_item_version; compute decision_deadline_at, evidence_completeness_score, evidence_reuse_discount"]

  - method: POST
    path: "/authorization-requests/{authId}/start-review"
    description: "Begin initial review (SUBMITTED → UNDER_REVIEW)"
    roles: [InitialReviewer]
    code: 200
    input: [version]
    output: AuthorizationRequest
    side_effects: ["Requires evidence_completeness_score >= 0.50"]

  - method: POST
    path: "/authorization-requests/{authId}/request-info"
    description: "Request more information from the provider (UNDER_REVIEW → PENDING_INFO)"
    roles: [InitialReviewer]
    code: 200
    input: [version]
    output: AuthorizationRequest
    side_effects: ["Extends decision_deadline_at per calc: decision_deadline (urgency-based)"]

  - method: POST
    path: "/authorization-requests/{authId}/resume-review"
    description: "Resume review after info provided (PENDING_INFO → UNDER_REVIEW)"
    roles: [InitialReviewer]
    code: 200
    input: [version]
    output: AuthorizationRequest
    side_effects: ["Requires evidence_completeness_score >= 0.75"]

  - method: POST
    path: "/authorization-requests/{authId}/peer-to-peer"
    description: "Schedule a peer-to-peer review (UNDER_REVIEW → PEER_REVIEW)"
    roles: [Provider]
    code: 201
    input: [scheduled_at, duration_minutes, payer_reviewer_id, version]
    output: PeerToPeerReview
    side_effects: ["Creates PeerToPeerReview SCHEDULED; parent AuthorizationRequest UNDER_REVIEW → PEER_REVIEW"]

  - method: POST
    path: "/authorization-requests/{authId}/decide"
    description: "Issue the initial decision (UNDER_REVIEW → APPROVED or DENIED)"
    roles: [InitialReviewer]
    code: 201
    input: [outcome, rationale, "approved_units?", "denial_reason_code?", version]
    output: Decision
    side_effects: ["Creates Decision; sets AuthorizationRequest.decided_at; on APPROVED computes expires_at"]

  - method: POST
    path: "/authorization-requests/{authId}/withdraw"
    description: "Withdraw a request prior to a decision"
    roles: [Provider]
    code: 200
    input: [version]
    output: AuthorizationRequest
    side_effects: ["Status → WITHDRAWN; cancel any SCHEDULED PeerToPeerReview"]

  # --- ClinicalEvidence ---
  - method: POST
    path: "/authorization-requests/{authId}/clinical-evidence"
    description: "Attach a clinical-evidence document to an authorization request"
    roles: [Provider]
    code: 201
    input: [category, title, uri, byte_size, "sourced_from_request_id?"]
    output: ClinicalEvidence
    side_effects: ["status=ATTACHED; recompute parent evidence_completeness_score and (if sourced_from_request_id set) evidence_reuse_discount"]

  - method: GET
    path: "/authorization-requests/{authId}/clinical-evidence"
    description: "List clinical evidence under an authorization request"
    roles: [PlatformAdmin, Provider, InitialReviewer, MedicalDirector, ExternalReviewer, PayerReviewer]
    code: 200
    input: ["status?, category?, limit?, offset?"]
    output: "ClinicalEvidence[]"
    side_effects: []

  - method: POST
    path: "/authorization-requests/{authId}/clinical-evidence/{evidenceId}/withdraw"
    description: "Withdraw a clinical-evidence document (ATTACHED → WITHDRAWN)"
    roles: [Provider]
    code: 200
    input: []
    output: ClinicalEvidence
    side_effects: ["status=WITHDRAWN; recompute parent evidence_completeness_score"]

  # --- PeerToPeerReview ---
  - method: GET
    path: "/peer-to-peer-reviews/{p2pId}"
    description: "Fetch a peer-to-peer review"
    roles: [PlatformAdmin, Provider, InitialReviewer, PayerReviewer]
    code: 200
    input: []
    output: PeerToPeerReview
    side_effects: []

  - method: POST
    path: "/peer-to-peer-reviews/{p2pId}/complete"
    description: "Record the outcome of a peer-to-peer review (SCHEDULED → COMPLETED)"
    roles: [PayerReviewer]
    code: 200
    input: [outcome, "notes?", version]
    output: PeerToPeerReview
    side_effects: ["Parent AuthorizationRequest PEER_REVIEW → UNDER_REVIEW; if outcome=OVERTURNED, recompute evidence_completeness_score (variant: post_p2p)"]

  - method: POST
    path: "/peer-to-peer-reviews/{p2pId}/cancel"
    description: "Cancel a scheduled peer-to-peer review (SCHEDULED → CANCELLED)"
    roles: [Provider, PayerReviewer]
    code: 200
    input: [version]
    output: PeerToPeerReview
    side_effects: ["Parent AuthorizationRequest PEER_REVIEW → UNDER_REVIEW (revert)"]

  # --- Appeal ---
  - method: POST
    path: "/authorization-requests/{authId}/appeals"
    description: "File an appeal against the latest DENIED decision; tier is computed from prior appeals"
    roles: [Provider]
    code: 201
    input: [reason]
    output: Appeal
    side_effects: ["Tier = (count of UPHELD appeals on this request) + 1; filed_at = now(); compute decision_deadline_at; superseded_decision_id = latest DENIED Decision.id"]

  - method: GET
    path: "/appeals/{appealId}"
    description: "Fetch an appeal"
    roles: [PlatformAdmin, Provider, InitialReviewer, MedicalDirector, ExternalReviewer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{appealId}/decide"
    description: "Decide an appeal (UPHELD keeps denial; OVERTURNED flips to APPROVED via cascade)"
    roles: [InitialReviewer, MedicalDirector, ExternalReviewer]
    code: 200
    input: [outcome, "approved_units?", rationale, version]
    output: Appeal
    side_effects: ["UPHELD → no state change on parent; OVERTURNED → parent DENIED → APPROVED + new superseding Decision + recompute expires_at"]

  - method: POST
    path: "/appeals/{appealId}/withdraw"
    description: "Provider withdraws a pending appeal"
    roles: [Provider]
    code: 200
    input: [version]
    output: Appeal
    side_effects: ["outcome=WITHDRAWN; tier counter unchanged (does NOT count as UPHELD for purposes of next-tier eligibility)"]

  # --- Clock / Sweep (test-driving endpoints) ---
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving endpoint: advance the system clock to a future ISO timestamp"
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: "{ now: datetime }"
    side_effects: ["Server clock advanced; does NOT automatically run sweep"]

  - method: POST
    path: "/_sweep/run"
    description: "Test-driving endpoint: run the expiration sweep that transitions APPROVED → EXPIRED when now() >= expires_at"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_authorization_request_ids: string[] }"
    side_effects: ["For each AuthorizationRequest in APPROVED with now() >= expires_at: status → EXPIRED; updated_at and version bumped"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Required identity headers (X-User-Role, X-User-ID) are absent or malformed"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller's role does not permit the requested operation per RBAC matrix"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist"

  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Foreign-key body reference (patient_id, provider_id, service_catalog_item_id, prior_request_id, payer_reviewer_id) does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in a state from which the requested transition is not legal"

  - id: ERR_VERSION_MISMATCH
    http: 409
    condition: "Submitted version does not equal current version (optimistic concurrency)"

  - id: ERR_CATALOG_RETIRED
    http: 409
    condition: "ServiceCatalogItem.status is RETIRED at submission"

  - id: ERR_PATIENT_INACTIVE
    http: 409
    condition: "Patient.status is INACTIVE at submission"

  - id: ERR_PROVIDER_SUSPENDED
    http: 409
    condition: "Provider.status is SUSPENDED at submission"

  - id: ERR_EXPEDITED_JUSTIFICATION_REQUIRED
    http: 422
    condition: "urgency=EXPEDITED but clinical_justification has < 50 non-whitespace characters"

  - id: ERR_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "evidence_completeness_score below threshold for the requested transition (0.50 to start review; 0.75 to resume from PENDING_INFO)"

  - id: ERR_EVIDENCE_REUSE_MISMATCH
    http: 422
    condition: "ClinicalEvidence.sourced_from_request_id does not match this AuthorizationRequest.prior_request_id"

  - id: ERR_PRIOR_REQUEST_NOT_EXPIRED
    http: 422
    condition: "Resubmission attempted but referenced prior AuthorizationRequest is not in EXPIRED state"

  - id: ERR_RESUBMISSION_ALREADY_EXISTS
    http: 409
    condition: "An AuthorizationRequest already references this prior_request_id"

  - id: ERR_INVALID_APPROVED_UNITS
    http: 422
    condition: "approved_units out of range: must be 0 for DENIED, and 1..requested_units for APPROVED"

  - id: ERR_DENIAL_REASON_REQUIRED
    http: 422
    condition: "Decision outcome=DENIED but denial_reason_code missing"

  - id: ERR_APPEAL_TIER_ROLE_MISMATCH
    http: 403
    condition: "Caller's role does not match Appeal.tier (1=InitialReviewer, 2=MedicalDirector, 3=ExternalReviewer)"

  - id: ERR_APPEAL_TIER_OUT_OF_ORDER
    http: 422
    condition: "Tier N appeal filed without a prior UPHELD appeal at tier N-1"

  - id: ERR_APPEAL_ALREADY_FILED
    http: 409
    condition: "A PENDING Appeal at the same tier already exists for this AuthorizationRequest"

  - id: ERR_APPEAL_DEADLINE_EXPIRED
    http: 422
    condition: "now() is past Appeal.decision_deadline_at"

  - id: ERR_PEER_REVIEW_ALREADY_SCHEDULED
    http: 409
    condition: "A PeerToPeerReview in SCHEDULED or COMPLETED already exists for this AuthorizationRequest"

  - id: ERR_PEER_REVIEW_TIME_CONFLICT
    http: 409
    condition: "PeerToPeerReview.scheduled_at overlaps with another SCHEDULED P2P for the same payer_reviewer_id within the duration window"

  - id: ERR_EVIDENCE_SIZE_INVALID
    http: 422
    condition: "ClinicalEvidence.byte_size out of bounds (must be > 0 and <= 50_000_000)"

  - id: ERR_EVIDENCE_DUPLICATE_URI
    http: 409
    condition: "Two ATTACHED ClinicalEvidence rows under the same AuthorizationRequest share the same uri"

  - id: ERR_INVALID_P2P_OUTCOME
    http: 422
    condition: "PeerToPeerReview.outcome on /complete must be one of UPHELD, OVERTURNED, NO_SHOW"

  - id: ERR_PRIOR_REQUEST_NOT_FOUND
    http: 404
    condition: "prior_request_id is set but the referenced AuthorizationRequest does not exist"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational administrator; manages reference data (patients, providers, catalog) and drives clock/sweep test endpoints"
    identity: opaque
    exclusive_operations:
      - "POST /patients — Create patient"
      - "POST /providers — Create provider"
      - "POST /service-catalog-items — Create catalog item"
      - "PATCH /service-catalog-items/{itemId} — Update catalog item"
      - "POST /_clock/advance — Advance system clock"
      - "POST /_sweep/run — Run expiration sweep"
    shared_operations:
      - "GET /patients/{patientId}, GET /providers/{providerId}, GET /service-catalog-items/{itemId}"
      - "GET /authorization-requests, GET /authorization-requests/{authId}"
      - "GET /peer-to-peer-reviews/{p2pId}, GET /appeals/{appealId}"
      - "GET /authorization-requests/{authId}/clinical-evidence"

  - name: Provider
    description: "Requesting clinician/practice; owns AuthorizationRequest lifecycle from DRAFT through SUBMITTED and files appeals"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /authorization-requests — Create authorization request (must equal provider_id in body)"
      - "PATCH /authorization-requests/{authId} — Update DRAFT request"
      - "POST /authorization-requests/{authId}/submit — Submit"
      - "POST /authorization-requests/{authId}/withdraw — Withdraw"
      - "POST /authorization-requests/{authId}/clinical-evidence — Attach evidence"
      - "POST /authorization-requests/{authId}/clinical-evidence/{evidenceId}/withdraw — Withdraw evidence"
      - "POST /authorization-requests/{authId}/peer-to-peer — Request a P2P"
      - "POST /authorization-requests/{authId}/appeals — File an appeal"
      - "POST /appeals/{appealId}/withdraw — Withdraw appeal"
    shared_operations:
      - "GET /authorization-requests/{authId} (only when Provider.id matches AuthorizationRequest.provider_id)"
      - "GET /authorization-requests (filtered to caller's provider_id)"
      - "GET /peer-to-peer-reviews/{p2pId} (only when request is the Provider's)"
      - "POST /peer-to-peer-reviews/{p2pId}/cancel"

  - name: InitialReviewer
    description: "Payer initial-review nurse; performs first-tier review and can decide T1 appeals (reconsideration)"
    identity: opaque
    exclusive_operations:
      - "POST /authorization-requests/{authId}/start-review — SUBMITTED → UNDER_REVIEW"
      - "POST /authorization-requests/{authId}/request-info — UNDER_REVIEW → PENDING_INFO"
      - "POST /authorization-requests/{authId}/resume-review — PENDING_INFO → UNDER_REVIEW"
      - "POST /authorization-requests/{authId}/decide — Issue initial Decision"
      - "POST /appeals/{appealId}/decide — Decide tier=1 appeals"
    shared_operations:
      - "GET /authorization-requests, GET /authorization-requests/{authId}"
      - "GET /authorization-requests/{authId}/clinical-evidence"

  - name: MedicalDirector
    description: "Payer medical director; decides tier=2 appeals only"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/{appealId}/decide — Decide tier=2 appeals"
    shared_operations:
      - "GET /authorization-requests, GET /authorization-requests/{authId}"
      - "GET /authorization-requests/{authId}/clinical-evidence"
      - "GET /appeals/{appealId}"

  - name: ExternalReviewer
    description: "Independent external reviewer; decides tier=3 appeals only"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/{appealId}/decide — Decide tier=3 appeals"
    shared_operations:
      - "GET /authorization-requests, GET /authorization-requests/{authId}"
      - "GET /authorization-requests/{authId}/clinical-evidence"
      - "GET /appeals/{appealId}"

  - name: PayerReviewer
    description: "Payer clinical reviewer who runs the P2P call with the requesting Provider"
    identity: opaque
    exclusive_operations:
      - "POST /peer-to-peer-reviews/{p2pId}/complete — Record P2P outcome"
    shared_operations:
      - "GET /peer-to-peer-reviews/{p2pId}"
      - "GET /authorization-requests/{authId}"
      - "GET /authorization-requests/{authId}/clinical-evidence"
      - "POST /peer-to-peer-reviews/{p2pId}/cancel"
