# ============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2618 — Gift Card Fraud & Balance Protection
#
# Section names and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. §1.8 is the depth probe; this file is
# the breadth walk over §1.1–§1.7, with `excluded_because:` stubs wherever a
# §1.8 instance already asserts the corner.
#
# Unless an instance moves it, the logical clock stays at its default
# 2026-08-01T00:00:00Z. The literal 00000000-0000-4000-8000-000000000000 is
# used throughout as a well-formed id that is guaranteed absent.
#
# ---------------------------------------------------------------------------
# §1.6 ERROR CATALOG COVERAGE MAP (41 codes, every one triggered)
#   ERR_UNAUTHENTICATED                 -> rbac / request_without_user_header_is_unauthenticated
#   ERR_UNAUTHORIZED (p20 role)         -> rbac / pos_associate_cannot_resolve_a_draining_alert
#   ERR_UNAUTHORIZED (p22 store scope)  -> rbac / store_manager_cannot_audit_another_stores_rack
#   ERR_INVALID_REQUEST                 -> entities / store_create_without_region_code_is_invalid_request
#   ERR_STORE_NOT_FOUND                 -> entities / card_rack_create_under_unknown_store_is_not_found
#   ERR_RACK_NOT_FOUND                  -> errors / rack_audit_on_unknown_rack_is_not_found
#   ERR_CARD_NOT_FOUND                  -> entities / gift_card_get_with_unknown_id_is_not_found
#   ERR_ISSUANCE_REQUEST_NOT_FOUND      -> errors / issuance_screen_on_unknown_request_is_not_found
#   ERR_BULK_ORDER_NOT_FOUND            -> errors / bulk_order_decide_on_unknown_order_is_not_found
#   ERR_ALERT_NOT_FOUND                 -> errors / alert_triage_on_unknown_alert_is_not_found
#   ERR_CLAIM_NOT_FOUND                 -> errors / claim_decide_on_unknown_claim_is_not_found
#   ERR_LISTING_NOT_FOUND               -> errors / listing_validate_on_unknown_listing_is_not_found
#   ERR_PERIOD_NOT_FOUND                -> errors / period_close_on_unknown_period_is_not_found
#   ERR_LEDGER_EVENT_NOT_FOUND          -> errors / ledger_reverse_on_unknown_event_is_not_found
#   ERR_HOLD_NOT_FOUND                  -> errors / hold_settle_on_unknown_hold_is_not_found
#   ERR_STALE_CARD_VERSION              -> cross_cutting_complexity_layers / hold_create_with_stale_card_version_conflicts
#   ERR_STALE_PERIOD_VERSION            -> cross_cutting_complexity_layers / period_restate_with_stale_period_version_conflicts
#   ERR_CARD_NOT_ACTIVE                 -> state_machines / redemption_on_inactive_card_is_rejected
#   ERR_CARD_FROZEN                     -> STUB (§1.8 frozen_card_state_error_beats_insufficient_balance_fiscal_error)
#   ERR_INVALID_ISSUANCE_STATE          -> state_machines / second_screen_on_approved_issuance_request_is_rejected
#   ERR_INVALID_BULK_ORDER_STATE        -> errors / bulk_identity_verification_twice_is_invalid_bulk_order_state
#   ERR_INVALID_ALERT_STATE             -> state_machines / alert_resolve_before_triage_is_rejected
#   ERR_INVALID_CLAIM_STATE             -> state_machines / resubmit_evidence_on_submitted_claim_is_rejected
#   ERR_INVALID_LISTING_STATE           -> errors / listing_validate_twice_is_invalid_listing_state
#   ERR_INVALID_PERIOD_STATE            -> state_machines / second_close_on_closed_period_is_rejected
#   ERR_INVALID_HOLD_STATE              -> state_machines / settle_on_released_hold_is_rejected
#   ERR_LEDGER_EVENT_ALREADY_REVERSED   -> errors / double_reversal_of_the_same_redemption_is_rejected
#   ERR_PACKAGING_SEAL_BROKEN           -> validations / physical_issuance_with_broken_seal_is_rejected
#   ERR_RACK_TAMPERED                   -> STUB (§1.8 physical_issuance_screen_blocked_by_suspect_rack_state)
#   ERR_STORE_FLOOR_SUSPENDED           -> STUB (§1.8 suspended_floor_safety_error_beats_missing_identity_referential_error)
#   ERR_SEGREGATION_OF_DUTIES           -> rbac / same_user_cannot_triage_and_resolve_one_alert
#                                          rbac / same_user_cannot_intake_and_decide_one_claim
#   ERR_IDENTITY_VERIFICATION_REQUIRED  -> validations / bulk_approval_without_identity_above_threshold_is_rejected
#   ERR_EVIDENCE_INCOMPLETE             -> validations / physical_claim_without_packaging_photo_cannot_be_approved
#   ERR_ALERT_NOT_CONFIRMED             -> endpoints / referral_requires_a_confirmed_alert
#   ERR_CLAIM_WINDOW_EXPIRED            -> validations / claim_filed_one_day_past_the_window_is_rejected
#   ERR_BULK_QUANTITY_LIMIT_EXCEEDED    -> validations / bulk_order_one_card_over_the_quantity_limit_is_rejected
#   ERR_EVIDENCE_ROUND_LIMIT_EXCEEDED   -> validations / fourth_evidence_request_exceeds_the_round_limit
#   ERR_PERIOD_OVERLAP                  -> STUB (§1.8 liability_period_half_open_adjacency_allowed_overlap_rejected)
#   ERR_DUPLICATE_LISTING               -> validations / second_live_listing_for_same_card_and_marketplace_is_rejected
#   ERR_INSUFFICIENT_BALANCE            -> validations / redemption_above_available_balance_is_rejected
#   ERR_HOLD_CAPACITY_EXCEEDED          -> STUB (§1.8 redemption_hold_aggregate_capacity_over_closed_intervals)
#   ERR_REISSUE_LIMIT_EXCEEDED          -> validations / claim_gross_reissue_above_the_cap_is_rejected
# ============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: store_create_returns_all_declared_fields_with_derived_counters_zeroed
        claim_type: creation
        grounds:
          - entities.RetailStore.fields.floor_posture
          - entities.RetailStore.fields.tampered_rack_count
          - entities.RetailStore.fields.suspect_rack_count
          - entities.RetailStore.fields.open_alert_count
          - entities.RetailStore.fields.declined_issuance_count
          - state_machines.RetailStore.initial_state
        distinguishing_aspect: "POST /stores with the three required inputs returns 201 and every declared RetailStore field, with floor_posture OPEN and all four derived counters at 0 — none of them null and none of them absent."
        test_recipe:
          setup:
            - "Empty database. Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /stores"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /stores"
              payload: { name: "Grand Avenue Market", region_code: "SE", address_line: "800 Grand Ave" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id, store_v0: $.data.version }
          assert:
            - "the setup GET /stores returns total_count == 0"
            - "HTTP status == 201"
            - "RetailStore.${store1_id}.name == Grand Avenue Market"
            - "RetailStore.${store1_id}.region_code == SE"
            - "RetailStore.${store1_id}.address_line == 800 Grand Ave"
            - "RetailStore.${store1_id}.floor_posture == OPEN"
            - "RetailStore.${store1_id}.tampered_rack_count == 0"
            - "RetailStore.${store1_id}.suspect_rack_count == 0"
            - "RetailStore.${store1_id}.open_alert_count == 0"
            - "RetailStore.${store1_id}.declined_issuance_count == 0"
            - "${store_v0} == 1"
            - "RetailStore.${store1_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"

      - name: card_rack_get_by_id_returns_the_row_written_by_the_last_audit
        claim_type: retrieval
        grounds:
          - entities.CardRack.fields.observed_card_count
          - entities.CardRack.fields.last_audit_at
          - entities.CardRack.fields.missing_card_count
          - calculations.rack_tamper_classification
        distinguishing_aspect: "GET /card-racks/{id} returns exactly what the audit persisted — observed_card_count 10, missing_card_count 0, tamper_state INTACT, last_audit_at 2026-08-01T00:00:00Z — rather than a stale pre-audit copy."
        test_recipe:
          setup:
            - "One RetailStore and one CardRack with expected_card_count 10."
            - "One clean audit reporting 10 observed cards and 0 seal breaks, which re-derives tamper_state to INTACT."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Clearview Foods", region_code: "MW", address_line: "9 Clearview Dr" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-C1", expected_card_count: 10 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 10, seal_breaks_observed: 0 }
              as: PosAssociate
              captures: { audit_state: $.data.tamper_state }
          trigger:
            - call: "GET /card-racks/${rack1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-20"
              captures: { got_state: $.data.tamper_state, got_observed: $.data.observed_card_count, got_missing: $.data.missing_card_count }
          assert:
            - "HTTP status == 200"
            - "${got_state} == INTACT and ${audit_state} == INTACT"
            - "${got_observed} == 10"
            - "${got_missing} == 0"
            - "CardRack.${rack1_id}.store_id == ${store1_id}"
            - "CardRack.${rack1_id}.rack_label == RACK-C1"
            - "CardRack.${rack1_id}.expected_card_count == 10"
            - "CardRack.${rack1_id}.seal_breaks_observed == 0"
            - "CardRack.${rack1_id}.last_audit_at == 2026-08-01T00:00:00Z"
            - "CardRack.${rack1_id}.remediation_note == null"

      - name: gift_card_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /gift-cards]
          - response_envelope.pagination_defaults
          - entities.GiftCard.fields.activation_state
        distinguishing_aspect: "With 12 INACTIVE cards, GET /gift-cards with no limit returns 10 rows / total_count 12 / has_more true; offset 10 returns 2 rows / has_more false; and limit 101 is rejected by §1.4 p25 — so the declared envelope defaults (limit 10, max 100) are enforced rather than being decoration."
        test_recipe:
          setup:
            - "One RetailStore and one CardRack with expected_card_count 20."
            - "Twelve GiftCards created against that rack, all left INACTIVE with current_balance_cents 0."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Bayview Superstore", region_code: "NW", address_line: "1200 Bayview Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-BV", expected_card_count: 20 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2001" }
              as: PosAssociate
              captures: { c1: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2002" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2003" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2004" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2005" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2006" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2007" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2008" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2009" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2010" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2011" }
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2012" }
              as: PosAssociate
              captures: { c12: $.data.id }
          trigger:
            - call: "GET /gift-cards"
              payload: { store_id: "${store1_id}" }
              as: FraudAnalyst
              as_user_id: "analyst-20"
            - call: "GET /gift-cards"
              payload: { store_id: "${store1_id}", limit: 10, offset: 10 }
              as: FraudAnalyst
              as_user_id: "analyst-20"
            - call: "GET /gift-cards"
              payload: { activation_state: "INACTIVE", limit: 5, offset: 0 }
              as: FraudAnalyst
              as_user_id: "analyst-20"
            - call: "GET /gift-cards"
              payload: { limit: 101 }
              as: FraudAnalyst
              as_user_id: "analyst-20"
          assert:
            - "first trigger call: 10 items returned (the declared default limit), total_count == 12, has_more == true, offset echoed as 0, limit echoed as 10"
            - "second trigger call: 2 items returned, total_count == 12, has_more == false"
            - "third trigger call: 5 items returned, total_count == 12, has_more == true — the filter narrows nothing here because all 12 cards are INACTIVE"
            - "fourth trigger call: HTTP status == 400 with error_id ERR_INVALID_REQUEST — limit 101 exceeds the declared maximum of 100"
            - "GiftCard.${c1}.activation_state == INACTIVE and GiftCard.${c12}.activation_state == INACTIVE"
            - "GiftCard.${c1}.current_balance_cents == 0 and face_value_cents == 0"

      - name: gift_card_get_with_unknown_id_is_not_found
        claim_type: not_found
        grounds:
          - validations[priority=32]
          - errors.ERR_CARD_NOT_FOUND
        distinguishing_aspect: "GET /gift-cards/{id} with a well-formed but absent id returns 404 ERR_CARD_NOT_FOUND rather than 200 with a null body or a 500."
        test_recipe:
          setup:
            - "Empty database apart from one RetailStore, so the 404 cannot be confused with an empty-schema failure."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Elm Street Pharmacy", region_code: "NE", address_line: "5 Elm St" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
          trigger:
            - call: "GET /gift-cards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-21"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_CARD_NOT_FOUND"
            - "GET /gift-cards returns total_count == 0 — nothing was created as a side effect of the lookup"

      - name: store_create_without_region_code_is_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=25]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /stores]
        distinguishing_aspect: "POST /stores omitting the required region_code returns 400 ERR_INVALID_REQUEST and persists nothing — it does not default the field to null or to an empty string."
        test_recipe:
          setup:
            - "Empty database. Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /stores"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /stores"
              payload: { name: "Nameless Region Store", address_line: "1 Nowhere Ln" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /stores returns total_count == 0 — the rejected create wrote nothing"

      - name: risk_policy_get_on_empty_database_returns_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.RiskPolicy.fields.inquiry_velocity_threshold
          - entities.RiskPolicy.fields.drain_watch_score_threshold
          - entities.RiskPolicy.fields.recovery_factor_bps
          - entities.RiskPolicy.fields.provisional_reserve_rate_bps
          - endpoints[GET /risk-policy]
        distinguishing_aspect: "GET /risk-policy against an untouched database returns the singleton with all eighteen thresholds at their declared defaults — 60/5/1440/40/70/45/75/50000/25/3/3/2/90/3/100000/8500/3500/1000 — rather than 404 or a body of nulls."
        test_recipe:
          setup:
            - "Empty database. No PUT /risk-policy has ever been issued."
          setup_api_calls:
            - call: "GET /stores"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /risk-policy"
              payload: {}
              as: LiabilityAccountant
              as_user_id: "acct-20"
              captures: { policy_v: $.data.version }
          assert:
            - "HTTP status == 200"
            - "RiskPolicy.inquiry_velocity_window_minutes == 60"
            - "RiskPolicy.inquiry_velocity_threshold == 5"
            - "RiskPolicy.redemption_window_minutes == 1440"
            - "RiskPolicy.drain_watch_score_threshold == 40"
            - "RiskPolicy.drain_restrict_score_threshold == 70"
            - "RiskPolicy.digital_hold_score_threshold == 45"
            - "RiskPolicy.digital_decline_score_threshold == 75"
            - "RiskPolicy.bulk_identity_threshold_cents == 50000"
            - "RiskPolicy.bulk_quantity_limit == 25"
            - "RiskPolicy.rack_shrink_threshold == 3"
            - "RiskPolicy.rack_seal_break_threshold == 3"
            - "RiskPolicy.floor_heightened_alert_threshold == 2"
            - "RiskPolicy.claim_window_days == 90"
            - "RiskPolicy.claim_evidence_round_limit == 3"
            - "RiskPolicy.reissue_cap_cents == 100000"
            - "RiskPolicy.recovery_factor_bps == 8500"
            - "RiskPolicy.provisional_reserve_rate_bps == 3500"
            - "RiskPolicy.final_reserve_rate_bps == 1000"
            - "${policy_v} == 1"

      - name: gift_card_create_rejects_a_client_supplied_computed_balance
        claim_type: computed_fields
        grounds:
          - entities.GiftCard.fields.current_balance_cents
          - entities.GiftCard.fields.available_balance_cents
          - validations[priority=25]
          - endpoints[POST /gift-cards]
        distinguishing_aspect: "POST /gift-cards carrying current_balance_cents is rejected with 400 ERR_INVALID_REQUEST because the field is computed and absent from the endpoint's declared input — a client cannot mint value by asserting a balance at creation."
        test_recipe:
          setup:
            - "One RetailStore and one CardRack with expected_card_count 5."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Foothill Grocer", region_code: "SW", address_line: "77 Foothill Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-F1", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
          trigger:
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-3101", current_balance_cents: 50000 }
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST — current_balance_cents is not in POST /gift-cards' declared input"
            - "GET /gift-cards?rack_id=${rack1_id} returns total_count == 0"
            - "GET /ledger-events returns total_count == 0 — no value was minted"

      - name: ledger_event_stamps_occurred_at_and_created_by_user_id_server_side
        claim_type: system_fields
        grounds:
          - entities.LedgerEvent.fields.occurred_at
          - entities.LedgerEvent.fields.created_by_user_id
          - entities.LedgerEvent.fields.signed_amount_cents
          - entities.LedgerEvent.fields.type
        distinguishing_aspect: "A redemption posted by user pos-30 yields a LedgerEvent whose occurred_at is the logical clock 2026-08-01T00:00:00Z and whose created_by_user_id is pos-30 — both stamped by the server, neither accepted from the body."
        test_recipe:
          setup:
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 6000 cents."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Copper Creek Store", region_code: "MW", address_line: "40 Copper Creek" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-CC", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-3201" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 6000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-30", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
          trigger:
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 2500, merchant_store_id: "${store1_id}", pos_terminal_id: "T-30", memo: "coffee and pastry" }
              as: PosAssociate
              as_user_id: "pos-30"
              captures: { ev_id: $.data.id, ev_when: $.data.occurred_at, ev_user: $.data.created_by_user_id }
          assert:
            - "HTTP status == 201"
            - "${ev_when} == 2026-08-01T00:00:00Z"
            - "${ev_user} == pos-30"
            - "LedgerEvent.${ev_id}.type == REDEMPTION"
            - "LedgerEvent.${ev_id}.amount_cents == 2500"
            - "LedgerEvent.${ev_id}.signed_amount_cents == -2500"
            - "LedgerEvent.${ev_id}.reverses_event_id == null"
            - "LedgerEvent.${ev_id}.memo == coffee and pastry"
            - "GiftCard.${card_id}.current_balance_cents == 3500"

      - name: gift_card_masked_number_violating_its_pattern_is_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.GiftCard.fields.card_number_masked
          - validations[priority=25]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "card_number_masked '1234-5678-9012-3456' is rejected with 400 ERR_INVALID_REQUEST because the declared pattern requires three masked groups followed by exactly four digits — the constraint is enforced, not merely documented."
        test_recipe:
          setup:
            - "One RetailStore and one CardRack with expected_card_count 5."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Sandhill Market", region_code: "SE", address_line: "6 Sandhill Way" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-SH", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
          trigger:
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "1234-5678-9012-3456" }
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /gift-cards?rack_id=${rack1_id} returns total_count == 0"

