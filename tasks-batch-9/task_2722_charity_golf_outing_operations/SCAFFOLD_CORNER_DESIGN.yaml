            - "GET /outing-ops/registrations/${re_id} reads status == 'CONFIRMED' with confirmed_at == '2026-08-01T00:00:00Z' - Echo wins on tier price_cents 200000 DESC over Delta's 100000"
            - "GET /outing-ops/registrations/${rd_id} still reads status == 'WAITLISTED' - exactly one promotion happens per cancel, even though Delta also fits"
            - "GET /outing-ops/registrations/${rc_id} still reads status == 'WAITLISTED' - Charlie holds the most expensive package but player_count 4 > the 2 freed slots, so the filter removes it before the price ranking is ever consulted"
            - "GET /outing-ops/outings/${o_id} reads confirmed_player_slots == 8 (Alpha 4 + Foxtrot 2 + Echo 2) and waitlisted_registration_count == 2"
            - "the same outing reads gross_revenue_cents == 700000 (only CONFIRMED rows count, so the two waitlisted payments are excluded), refunded_cents == 100000, course_charge_cents == 76000 (8 billable at 9500), net_proceeds_before_fee_cents == 524000, admin_fee_cents == 35000 (5% of the 700000 gross) and net_proceeds_cents == 489000"

      - name: team_handicap_variant_divergence_between_provisional_and_locked
        claim_type: Variant Divergence
        grounds:
          - calculations.team_playing_handicap.variants
        distinguishing_aspect: "Same four players, two variants: the PROVISIONAL team handicap reads the index snapshotted at confirmation while the LOCKED one reads the sandbag-capped index, so a player who reports a much lower index after confirming moves the team handicap by a capped amount."
        excluded_because:
          difficulty_instance: team_playing_handicap_provisional_vs_locked
          rationale: "The §1.8 instance already drives both variants over one field, asserting the PROVISIONAL value, the MAX_INDEX_IMPROVEMENT floor written at LOCK_FIELD and the divergent LOCKED value; a corner duplicate would only re-run the same three asserts."

      - name: net_proceeds_variant_divergence_between_provisional_and_final
        claim_type: Variant Divergence
        grounds:
          - calculations.net_proceeds_rollup.variants
        distinguishing_aspect: "The rollup swaps three inputs at once when RECONCILE flips the variant - billable_players, the prize cost basis and the inclusion of fulfillment_credit_cents - so the two nets differ on identical rows."
        excluded_because:
          difficulty_instance: net_proceeds_provisional_vs_final
          rationale: "The §1.8 instance asserts the full PROVISIONAL rollup, then the FINAL rollup after RECONCILE, and the delta between them field by field; a corner instance cannot add a distinct claim."

      - name: best_ball_per_player_allowance_rounds_before_the_quarter_aggregation
        claim_type: Precision
        grounds:
          - calculations.team_playing_handicap.precision
          - calculations.team_playing_handicap.constants
        distinguishing_aspect: "BEST_BALL rounds each 0.90 allowance to a whole stroke BEFORE the 0.25 aggregation, so rounding each player first and rounding the sum last give different team handicaps."
        excluded_because:
          difficulty_instance: best_ball_allowance_per_player_rounding_order
          rationale: "The §1.8 instance is built exactly on the ordering trap, with indexes chosen so the two orderings disagree; repeating it as a corner adds no new boundary."

      - name: token_benefit_exactly_on_the_ceiling_is_disregarded
        claim_type: Constants Applied
        grounds:
          - calculations.charitable_deductible.constants
          - calculations.charitable_deductible.precision
        distinguishing_aspect: "A registration whose tier gsv_cents sits exactly on min(TOKEN_GSV_CAP_CENTS, round_half_up(0.02 * payment)) is disregarded because the comparison is <=, making the whole payment deductible."
        excluded_because:
          difficulty_instance: token_benefit_gsv_exactly_on_the_ceiling_is_disregarded
          rationale: "The §1.8 instance pins the ceiling boundary from both sides on a REGISTRATION receipt; the corner section instead covers the AUCTION branch, where the token rule does not apply at all."

      - name: admin_fee_tier_boundary_on_the_before_fee_net
        claim_type: Constants Applied
        grounds:
          - calculations.net_proceeds_rollup.formula
        distinguishing_aspect: "The fee RATE is keyed off net_proceeds_before_fee_cents while the fee BASE is gross revenue, and the tier edge sits at exactly 2000000."
        excluded_because:
          difficulty_instance: admin_fee_tier_boundary_at_exactly_two_million_before_fee
          rationale: "The §1.8 instances admin_fee_tier_selected_on_before_fee_applied_to_gross and admin_fee_tier_boundary_at_exactly_two_million_before_fee already cover the rate-versus-base split and the boundary itself; the corner file only asserts the fee incidentally inside larger fixtures."

      - name: asset_capacity_conservation_holds_after_a_release
        claim_type: Correct Result
        grounds:
          - calculations.asset_occupancy_availability
        distinguishing_aspect: "capacity == remaining_capacity + reserved_count + committed_count + fulfilled_count must hold before and after every forward action and its compensation, and Outing.reserved_asset_slot_count must agree with the per-asset sum."
        excluded_because:
          difficulty_instance: allocation_release_restores_the_asset_capacity_conservation_identity
          rationale: "The §1.8 instance walks the identity through reserve, commit and release on a multi-capacity asset and checks the outing-level counter at each step, which is strictly stronger than any single-shot corner check."

  - section: validations
    instances:
      - name: unknown_path_and_body_ids_return_the_leftmost_not_found_code
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_TIER_NOT_FOUND
          - errors.ERR_PLAYER_NOT_FOUND
          - errors.ERR_ASSET_NOT_FOUND
          - errors.ERR_ALLOCATION_NOT_FOUND
          - errors.ERR_CONTEST_NOT_FOUND
          - errors.ERR_ITEM_NOT_FOUND
          - errors.ERR_RECEIPT_NOT_FOUND
        distinguishing_aspect: "Every entity family gets its OWN 404 code rather than a generic one, and when a request carries two unresolvable references the report order is fixed: the path segment is resolved before the body, and body foreign keys are resolved in the endpoint's declared input order, so a request with both a bogus outing_id and a bogus package_tier_id reports the outing."
        test_recipe:
          setup:
            - "One DRAFT outing with one PackageTier, so the valid-outing / bogus-tier combination is expressible."
            - "The literal 00000000-0000-4000-8000-0000000000ff is a well-formed UUID that matches no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Not Found Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "SOLO", kind: "INDIVIDUAL", price_cents: 30000, player_slots: 1, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /outing-ops/contracts/00000000-0000-4000-8000-0000000000ff"
              as: CourseOperations
              captures: { e_contract: $.data.error_id }
            - call: "GET /outing-ops/package-tiers/00000000-0000-4000-8000-0000000000ff"
              as: TournamentDirector
              captures: { e_tier: $.data.error_id }
            - call: "GET /outing-ops/players/00000000-0000-4000-8000-0000000000ff"
              as: TournamentDirector
              captures: { e_player: $.data.error_id }
            - call: "GET /outing-ops/sponsorship-assets/00000000-0000-4000-8000-0000000000ff"
              as: SponsorshipManager
              captures: { e_asset: $.data.error_id }
            - call: "GET /outing-ops/sponsor-allocations/00000000-0000-4000-8000-0000000000ff"
              as: SponsorshipManager
              captures: { e_alloc: $.data.error_id }
            - call: "GET /outing-ops/contests/00000000-0000-4000-8000-0000000000ff"
              as: TournamentDirector
              captures: { e_contest: $.data.error_id }
            - call: "GET /outing-ops/fundraising-items/00000000-0000-4000-8000-0000000000ff"
              as: CharityTreasurer
              captures: { e_item: $.data.error_id }
            - call: "GET /outing-ops/receipts/00000000-0000-4000-8000-0000000000ff"
              as: CharityTreasurer
              captures: { e_receipt: $.data.error_id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "00000000-0000-4000-8000-0000000000ff", buyer_name: "Ghost Tier", player_count: 1 }
              as: TournamentDirector
              captures: { e_body_tier: $.data.error_id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "00000000-0000-4000-8000-0000000000ff", package_tier_id: "00000000-0000-4000-8000-0000000000ff", buyer_name: "Ghost Everything", player_count: 1 }
              as: TournamentDirector
              captures: { e_body_outing: $.data.error_id }
          assert:
            - "every call answers HTTP 404 with the success envelope's error shape, and no row is created"
            - "${e_contract} == 'ERR_CONTRACT_NOT_FOUND', ${e_tier} == 'ERR_TIER_NOT_FOUND', ${e_player} == 'ERR_PLAYER_NOT_FOUND', ${e_asset} == 'ERR_ASSET_NOT_FOUND'"
            - "${e_alloc} == 'ERR_ALLOCATION_NOT_FOUND', ${e_contest} == 'ERR_CONTEST_NOT_FOUND', ${e_item} == 'ERR_ITEM_NOT_FOUND', ${e_receipt} == 'ERR_RECEIPT_NOT_FOUND'"
            - "${e_body_tier} == 'ERR_TIER_NOT_FOUND' - the outing resolves, so the second body reference is reported"
            - "${e_body_outing} == 'ERR_OUTING_NOT_FOUND' - with both body references dead, the FIRST field of the endpoint's declared input list wins"
            - "GET /outing-ops/registrations?outing_id=${o_id} returns total_count == 0"

      - name: authorization_outranks_the_schema_check_on_the_same_request
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "One request violates two rules at once - a role that is not on the endpoint's roles list AND a missing required body field - and the answer must be the priority-2 authorization error, never the priority-3 schema error; the mirror case pairs a dead path id with a bad enum value and must still report the priority-3 schema error, because the schema is checked before the path is resolved."
        test_recipe:
          setup:
            - "One DRAFT outing exists, so the path id in the mirror case is the only unresolvable reference."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Priority Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/outings"
              payload: { name: "Wrong Role And Missing Field", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: CharityTreasurer
              captures: { e_auth: $.data.error_id }
            - call: "POST /outing-ops/outings/00000000-0000-4000-8000-0000000000ff/play-transition"
              payload: { action: "NOT_AN_ACTION" }
              as: TournamentDirector
              captures: { e_schema: $.data.error_id }
          assert:
            - "the first call answers HTTP 403 with ${e_auth} == 'ERR_UNAUTHORIZED' - the absent beneficiary_name is never reported, because priority 2 outranks priority 3"
            - "the second call answers HTTP 422 with ${e_schema} == 'ERR_INVALID_REQUEST' and NOT 'ERR_OUTING_NOT_FOUND' - priority 3 outranks the priority-4 path existence check"
            - "GET /outing-ops/outings returns total_count == 1 - neither refused request created or mutated a row"

      - name: a_receipt_naming_two_subjects_or_none_is_ambiguous
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors.ERR_RECEIPT_SUBJECT_AMBIGUOUS
          - entities.CharitableReceipt.fields.receipt_kind
        distinguishing_aspect: "The subject rule is an exclusive OR in both directions: naming a registration AND a fundraising item is refused, and naming NEITHER is refused by the same code, so the check is not simply a null test on one field."
        test_recipe:
          setup:
