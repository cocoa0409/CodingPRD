  - method: POST
    path: /vpc/accessory-work-orders/{workOrderId}/kit
    description: "Reserve kit units for the work order."
    roles: [AccessoryTechnician]
    code: 200
    input: []
    output: AccessoryWorkOrder
    side_effects:
      - "status PLANNED -> KITTED; kit.reserved_qty and available_qty recomputed"
      - "vehicle.processing_status SURVEYED -> ACCESSORY_IN_PROGRESS on the first kitted work order"

  - method: POST
    path: /vpc/accessory-work-orders/{workOrderId}/install
    description: "Record the install; consumes kit units and bills the program."
    roles: [AccessoryTechnician]
    code: 200
    input: []
    output: AccessoryWorkOrder
    side_effects:
      - "status KITTED -> INSTALLED; installed_by_user_id := X-User-ID"
      - "billed_cents := calculations.accessory_program_billing; vehicle.accessory_billed_cents recomputed"
      - "kit.on_hand_qty -= qty; consumed_qty, reserved_qty and available_qty recomputed (INVARIANT K preserved)"

  - method: POST
    path: /vpc/accessory-work-orders/{workOrderId}/void
    description: "Void a work order from PLANNED, KITTED or INSTALLED; the INSTALLED case is the compensating half of install."
    roles: [AccessoryTechnician]
    code: 200
    input: []
    output: AccessoryWorkOrder
    side_effects:
      - "status -> VOIDED"
      - "from KITTED: reservation released"
      - "from INSTALLED: kit.on_hand_qty += qty, billed_cents -> 0, vehicle.accessory_billed_cents recomputed (INVARIANT K restored)"

  # ------------------------------------------------------ quality inspections
  - method: POST
    path: /vpc/vehicles/{vehicleId}/quality-inspections
    description: "Open a quality inspection. The inspector may not be an operator who installed accessories on this unit (segregation of duties)."
    roles: [QualityInspector]
    code: 201
    input: []
    output: QualityInspection
    side_effects: ["status := OPEN; inspector_user_id := X-User-ID"]

  - method: GET
    path: /vpc/quality-inspections/{inspectionId}
    description: "Read one quality inspection."
    roles: *ops_roles
    code: 200
    input: []
    output: QualityInspection
    side_effects: []

  - method: GET
    path: /vpc/quality-inspections
    description: "List quality inspections, optionally filtered by unit or status."
    roles: *ops_roles
    code: 200
    input: ["vehicle_id?", "status?", "outcome?", "limit?", "offset?"]
    output: QualityInspection[]
    side_effects: []

  - method: POST
    path: /vpc/quality-inspections/{inspectionId}/complete
    description: "Complete the inspection. outcome=FAIL drives the 4-link rework cascade."
    roles: [QualityInspector]
    code: 200
    input: ["outcome", "defect_count"]
    output: QualityInspection
    side_effects:
      - "outcome PASS -> status PASSED; vehicle.processing_status -> INSPECTION_PASSED"
      - "outcome FAIL -> LINK 1 status FAILED; LINK 2 vehicle back to ACCESSORY_IN_PROGRESS with rework_cycle_count += 1; LINK 3 every INSTALLED work order of the unit -> KITTED in created_at ASC order with reopen_count += 1 and billed_cents -> 0; LINK 4 kit.on_hand_qty += qty per reopened order and vehicle.accessory_billed_cents recomputed"

  # -------------------------------------------------------------- hold orders
  - method: POST
    path: /vpc/processing-centers/{centerId}/hold-orders
    description: "Apply a recall or stop-ship hold to units in the yard before release. scope_type selects MODEL_LINE (all matching units) or SINGLE_VIN targeting."
    roles: [DistributionManager]
    code: 201
    input: ["hold_type", "scope_type", "reference_code", "model_line?", "vehicle_id?"]
    output: HoldOrder
    side_effects:
      - "LINK 1: hold created in OPEN; applied_by_user_id := X-User-ID"
      - "LINK 2 (caused by LINK 1): every in-scope Vehicle with yard_presence == IN_YARD gets stop_ship_blocked := true and blocking_hold_order_id := hold.id; affected_vehicle_count stamped"
      - "LINK 3 (caused by LINK 2): each such unit's ReleaseOrder in ALLOCATED -> CANCELLED_BY_HOLD with cancelled_by_hold_order_id set, processed in created_at ASC order. An order already in RELEASED is NOT cancelled — it is frozen, and gate-out is rejected with ERR_VEHICLE_STOP_SHIP_BLOCKED until the hold is lifted"
      - "LINK 4 (caused by LINK 3): truck_carrier.committed_slots and available_slots recomputed (INVARIANT S), dealer.open_allocation_count recomputed, vehicle.processing_status reverts to SHIPPING_READY, vehicle.storage_charge_provisional_cents -> 0 and center.provisional_storage_accrued_cents recomputed"

  - method: GET
    path: /vpc/hold-orders/{holdOrderId}
    description: "Read one hold order."
    roles: *ops_roles
    code: 200
    input: []
    output: HoldOrder
    side_effects: []

  - method: GET
    path: /vpc/hold-orders
    description: "List hold orders, optionally filtered by center, single-VIN target, type or status."
    roles: *ops_roles
    code: 200
    input: ["processing_center_id?", "vehicle_id?", "hold_type?", "scope_type?", "status?", "limit?", "offset?"]
    output: HoldOrder[]
    side_effects: []

  - method: POST
    path: /vpc/hold-orders/{holdOrderId}/lift
    description: "Lift a hold. The lifter may not be the applier (segregation of duties)."
    roles: [DistributionManager]
    code: 200
    input: []
    output: HoldOrder
    side_effects:
      - "status OPEN -> LIFTED; lifted_by_user_id := X-User-ID"
      - "covered units: stop_ship_blocked -> false and blocking_hold_order_id -> null when no other OPEN hold covers them, otherwise blocking_hold_order_id repointed to the remaining OPEN hold with the earliest created_at"
      - "release orders already CANCELLED_BY_HOLD are NOT restored; orders that were merely frozen in RELEASED become gate-able again"

