            - "Property.${p7_id}.status == CLOSED and management_posture == DISPOSED (link 1)"
            - "ManagementAgreement.${ag7_id}.status == TERMINATED (link 2, driven by link 1)"
            - "VendorContract.${v7_id}.assignment_status == TERMINATED (link 3, driven by link 2)"

      - name: statement_close_cascades_to_report_generation_depth2
        grounds:
          - state_machines.MonthlyStatement.OPEN_to_CLOSED
          - state_machines.OwnerReportPackage.DRAFT_to_GENERATED
          - calculations.owner_distribution
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger than disposition: closing
          a MonthlyStatement (1) freezes the statement's computed fees and
          debits property cash, which (2) flips the DRAFT OwnerReportPackage
          for the same property+period to GENERATED and computes
          distribution_amount_cents via the owner_distribution waterfall.
