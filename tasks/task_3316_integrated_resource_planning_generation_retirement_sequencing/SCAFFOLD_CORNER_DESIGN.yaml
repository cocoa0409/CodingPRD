        distinguishing_aspect: "Statutory deadline: open-comment with the clock at 2026-09-02 for cycle_year 2026 fails ERR_CYCLE_DEADLINE_MISSED (422); on 2026-09-01 exactly it succeeds (on-or-before semantics)."
        test_recipe:
          setup: ["Two identical DRAFT plans P1 (opened 09-01) and P2 (opened 09-02), each with BASE forecast and portfolio."]
