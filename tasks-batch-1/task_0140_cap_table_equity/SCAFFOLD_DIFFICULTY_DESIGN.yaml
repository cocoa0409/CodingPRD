              captures: { v1_status: $.data.status, v1_sup: $.data.superseded_by_id }
          assert:
            - "Valuation.${v1}.status == SUPERSEDED (link 1)"
            - "Valuation.${v1}.superseded_by_id == ${v2} (link 1)"
            - "Valuation.${v2}.status == EFFECTIVE (link 2 re-prices fully_diluted_shares at fmv=400c)"

