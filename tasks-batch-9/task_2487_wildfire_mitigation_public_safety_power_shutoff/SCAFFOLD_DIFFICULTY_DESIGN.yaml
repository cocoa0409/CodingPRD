            - call: "POST /notification-batches/${batch_adv_id}/dispatch"
              payload: {}
              as: CommunityLiaison
            - call: "POST /psps-events/${ev1_id}/arm"
              payload: {}
              as: PSPSDutyOfficer
          trigger:
            - call: "POST /mitigation-projects/${mp_cc2_id}/submit"
              payload: {}
              as: GridPlanner
          assert:
            - "HTTP 409 with data.error_id == ERR_CIRCUIT_POSTURE_LOCKED"
            - "MitigationProject.${mp_cc2_id}.status == DRAFT (unchanged)"
            - "Circuit.${alpha_id}.risk_posture == LOCKED and energization_state == DE_ENERGIZATION_PENDING"
            - "MitigationProject.${mp_cc2_id}.risk_reduction_score == 1.86 (computed at creation, when ALPHA was TIER_3 and unlocked)"
            - "MitigationProject.${mp_cc2_id}.budget_cents == 2500000"
            - "After POST /psps-events/${ev1_id}/cancel with cancellation_reason 'forecast improved', Circuit.${alpha_id}.risk_posture == EXTREME and the same submit call returns HTTP 200"

      - name: filing_submit_requires_qualifying_mitigation_project
        grounds:
          - state_machines.WildfirePlanFiling.DRAFT_to_SUBMITTED
          - validations[priority=14]
          - errors[ERR_FILING_METRICS_INCOMPLETE]
          - calculations.plan_filing_performance_metrics
        distinguishing_aspect: |
          The (WildfirePlanFiling, MitigationProject) pair across a plan-year join key rather than a
          foreign key: the filing is a well-formed DRAFT, but its submission is refused with
          ERR_FILING_METRICS_INCOMPLETE because the only project for plan year 2026 is still SUBMITTED and
          therefore not in the qualifying status set {APPROVED, IN_EXECUTION, SUSPENDED, COMPLETED}.
        test_recipe:
          setup:
            - "Circuit DELTA is NON_HFTD with overhead_miles 4.0 and risk_posture NORMAL."
            - "Project MP-UG-1 (UNDERGROUNDING, 3.0 miles, plan_year 2026) has been submitted but not yet reviewed, so its status is SUBMITTED."
            - "Filing WMP-2026 for plan_year 2026 exists in status DRAFT with qualifying_project_count 0."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "DELTA", district_code: "D-WEST", hftd_tier: "NON_HFTD", overhead_miles: 4.0, equipment_condition_index: 90, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { delta_id: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "MP-UG-1", circuit_id: "${delta_id}", program_type: "UNDERGROUNDING", plan_year: 2026, planned_miles: 3.0, unit_cost_per_mile_cents: 9000000 }
              as: GridPlanner
              captures: { mp_ug_id: $.data.id }
            - call: "POST /mitigation-projects/${mp_ug_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /plan-filings"
              payload: { filing_code: "WMP-2026", plan_year: 2026 }
              as: GridPlanner
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /plan-filings/${filing_id}/submit"
              payload: {}
              as: GridPlanner
          assert:
            - "HTTP 422 with data.error_id == ERR_FILING_METRICS_INCOMPLETE"
            - "WildfirePlanFiling.${filing_id}.status == DRAFT (unchanged)"
            - "WildfirePlanFiling.${filing_id}.qualifying_project_count == 0"
            - "WildfirePlanFiling.${filing_id}.safety_review_state == PENDING and fiscal_review_state == PENDING"
            - "MitigationProject.${mp_ug_id}.status == SUBMITTED"
            - "After POST /mitigation-projects/${mp_ug_id}/review with decision APPROVE as reviewer_1, the same filing submit returns HTTP 200 and qualifying_project_count == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: circuit_event_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=16]
          - errors[ERR_CIRCUIT_WINDOW_CONFLICT]
          - calculations.psps_scope_determination
          - entities.PSPSEvent.fields.forecast_all_clear_at
        distinguishing_aspect: |
          Circuit occupation uses HALF-OPEN [forecast_onset_at, forecast_all_clear_at) semantics: a second
          event whose onset is exactly the first event's all-clear (2026-08-16T18:00:00Z) scopes the same
          circuit successfully, while an event whose onset is one hour earlier
          (2026-08-16T17:00:00Z) is refused with ERR_CIRCUIT_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "The ALPHA -> BRAVO -> CHARLIE chain with the five customers."
            - "ALPHA has FORECAST indices for 2026-08-15 (fpi_score 85.93, R5) and for 2026-08-16 (fpi_score 78.66, R5)."
            - "Event EV-1 spans 2026-08-15T18:00:00Z to 2026-08-16T18:00:00Z and is SCOPED, holding all three circuits CONFIRMED."
            - "Two further events exist in DRAFT: EV-TOUCH with onset exactly 2026-08-16T18:00:00Z and EV-OVERLAP with onset 2026-08-16T17:00:00Z, both with forecast_date 2026-08-16 indices as their trigger."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { alpha_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "BRAVO", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 70, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${alpha_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { bravo_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "CHARLIE", district_code: "D-NORTH", hftd_tier: "TIER_2", overhead_miles: 5.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", upstream_circuit_id: "${bravo_id}", fast_trip_enabled: false }
              as: GridPlanner
              captures: { charlie_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A1", circuit_id: "${alpha_id}", elevation_ft: 3200, representativeness_weight: 0.70, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-A2", circuit_id: "${alpha_id}", elevation_ft: 2600, representativeness_weight: 0.45, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_a2_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-14T18:00:00Z", wind_gust_mph: 62.0, relative_humidity_pct: 22.0, temperature_f: 104.0, dead_fuel_moisture_pct: 8.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a1_id}", observed_at: "2026-08-15T15:00:00Z", wind_gust_mph: 57.0, relative_humidity_pct: 28.0, temperature_f: 99.0, dead_fuel_moisture_pct: 9.5 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-14T17:00:00Z", wind_gust_mph: 48.0, relative_humidity_pct: 26.0, temperature_f: 101.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_a2_id}", observed_at: "2026-08-15T16:00:00Z", wind_gust_mph: 44.0, relative_humidity_pct: 31.0, temperature_f: 96.0, dead_fuel_moisture_pct: 10.0 }
              as: MeteorologyAnalyst
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${alpha_id}", forecast_date: "2026-08-15", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_fc_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-A1", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: true, preferred_language: "ES", notification_channels: ["SMS", "VOICE"], accessibility_needs: [], address_zone_code: "Z1" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-A2", circuit_id: "${alpha_id}", customer_class: "CRITICAL_FACILITY", medical_baseline: false, preferred_language: "EN", notification_channels: ["VOICE", "EMAIL"], accessibility_needs: [], address_zone_code: "Z1" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-A3", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "ZH", notification_channels: ["SMS"], accessibility_needs: ["AUDIO", "TTY"], address_zone_code: "Z2" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-B1", circuit_id: "${bravo_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "Z3" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-C1", circuit_id: "${charlie_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["EMAIL"], accessibility_needs: [], address_zone_code: "Z4" }
              as: GridPlanner
            - call: "POST /psps-events"
              payload: { event_code: "EV-1", trigger_fire_potential_index_id: "${fpi_fc_id}", forecast_onset_at: "2026-08-15T18:00:00Z", forecast_all_clear_at: "2026-08-16T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { ev1_id: $.data.id, ev1_v0: $.data.version }
            - call: "POST /psps-events/${ev1_id}/scope"
              payload: { expected_psps_event_version: "${ev1_v0}" }
              as: PSPSDutyOfficer
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${alpha_id}", forecast_date: "2026-08-16", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_16_id: $.data.id }
            - call: "POST /psps-events"
              payload: { event_code: "EV-TOUCH", trigger_fire_potential_index_id: "${fpi_16_id}", forecast_onset_at: "2026-08-16T18:00:00Z", forecast_all_clear_at: "2026-08-17T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { ev_touch_id: $.data.id, ev_touch_v0: $.data.version }
            - call: "POST /psps-events"
              payload: { event_code: "EV-OVERLAP", trigger_fire_potential_index_id: "${fpi_16_id}", forecast_onset_at: "2026-08-16T17:00:00Z", forecast_all_clear_at: "2026-08-17T17:00:00Z" }
              as: PSPSDutyOfficer
              captures: { ev_overlap_id: $.data.id, ev_overlap_v0: $.data.version }
          trigger:
            - call: "POST /psps-events/${ev_overlap_id}/scope"
              payload: { expected_psps_event_version: "${ev_overlap_v0}" }
              as: PSPSDutyOfficer
            - call: "POST /psps-events/${ev_touch_id}/scope"
              payload: { expected_psps_event_version: "${ev_touch_v0}" }
              as: PSPSDutyOfficer
          assert:
            - "FirePotentialIndex.${fpi_16_id}.fpi_score == 78.66 and fpi_tier == R5"
            - "The EV-OVERLAP scope returns HTTP 409 with data.error_id == ERR_CIRCUIT_WINDOW_CONFLICT"
            - "PSPSEvent.${ev_overlap_id}.scope_status == DRAFT with confirmed_scope_count 0"
            - "GET /psps-events/${ev_overlap_id}/scopes returns total_count 0 (the guard runs before any row is written)"
            - "The EV-TOUCH scope returns HTTP 200 — adjacency at 2026-08-16T18:00:00Z is not a conflict"
            - "PSPSEvent.${ev_touch_id}.scope_status == SCOPED with confirmed_scope_count 3"
            - "PSPSEvent.${ev_touch_id}.ignition_risk_avoided_score == 14.16 (per-term 5.51 + 4.72 + 3.93 at the lower 78.66 score)"
            - "PSPSEvent.${ev1_id}.confirmed_scope_count is still 3 and its scope rows are untouched"

      - name: resource_center_reset_buffer_closed_interval_plus_240_minutes
        grounds:
          - validations[priority=16]
          - errors[ERR_RESOURCE_CENTER_BUFFER_CONFLICT]
          - calculations.resource_center_activation_selector
          - entities.CommunityResourceCenter.fields.last_served_all_clear_at
        distinguishing_aspect: |
          Resource-center occupation uses a CLOSED previous-service interval extended by a 240-minute
          trailing reset buffer, a different interval semantics from the circuit rule: with
          last_served_all_clear_at 2026-08-20T18:00:00Z a new event whose onset is 2026-08-20T21:59:00Z
          (239 minutes later) is refused with ERR_RESOURCE_CENTER_BUFFER_CONFLICT, while an onset of
          exactly 2026-08-20T22:00:00Z (240 minutes later) is accepted.
        test_recipe:
          setup:
            - "Circuit HOTEL (TIER_2, overhead_miles 8.0, district D-SOUTH) with two customers and FORECAST indices for 2026-08-20, 2026-08-21 and 2026-08-22, each 60.00 / tier R4."
            - "Resource center CRC-S1 in district D-SOUTH with site_capacity 150 and accessibility_certified true served event EV-H (all-clear 2026-08-20T18:00:00Z) and is now DEMOBILIZED with last_served_all_clear_at 2026-08-20T18:00:00Z."
            - "Two later events are SCOPED over HOTEL: EV-EARLY with onset 2026-08-20T21:59:00Z and EV-EDGE with onset 2026-08-20T22:00:00Z, and the whole EV-H cycle has been closed so HOTEL is ENERGIZED again."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "HOTEL", district_code: "D-SOUTH", hftd_tier: "TIER_2", overhead_miles: 8.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
