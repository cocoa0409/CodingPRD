  - rule_id: cross_entity_state_dependency
    instances:
      - name: replica_approval_gated_on_consent_grant_status
        grounds:
          - state_machines.DigitalReplica.BUILT_to_APPROVED_FOR_USE
          - state_machines.ConsentGrant.ACTIVE_to_SUSPENDED
          - validations.priority_35_ERR_CONSENT_NOT_ACTIVE
        distinguishing_aspect: >-
          Entity pair ConsentGrant -> DigitalReplica. Nothing about the replica changes between the
          two attempts — only the governing grant's status flips ACTIVE -> SUSPENDED -> ACTIVE via
          POST /consent-grants/{id}/suspension, and the identical approve-for-use call must fail
          with 409 ERR_CONSENT_NOT_ACTIVE and then succeed.
        test_recipe:
          setup:
            - "CA law profile and the SAG_AFTRA/ADVERTISING union row exist"
            - "Talent with an ACTIVE grant, one stored asset and one replica still in BUILT"
            - "The grant is then SUSPENDED by a rights administrator with suspension_reason COMPLIANCE_HOLD"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
