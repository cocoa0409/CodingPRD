# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3339_agent_desk_fee_model_commission_retention_administration
# 9 rules x 2 instances = 18 instances. Every setup_api_calls chain drives
# empty-DB -> setup state using only §1.5 endpoints. Pinned fixture literals:
#   office  "Denver Central" / market DEN / target 25
#   office2 "Phoenix North"  / market PHX / target 10
#   schedule "95/5 Desk Plan": desk 300000, oh 500bps, reten 9500bps,
#     referral 2500bps, tech 25000, marketing 40000,
#     window [2026-01-01, 9999-12-31)
#   agents: Alice (list+sell, LIC-A-001), Bob (LIC-B-002), plus onboarding-only
#   offer: listing L-100, buyer "Buyer One", price 50000000
#   txn via accept: sale 50000000, GCI 1000000
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: closing_statement_standard_vs_former_agent_overhead_waiver
        grounds:
          - calculations.closing_statement
          - state_machines.Transaction.PENDING_CLOSE_to_CLOSED
          - entities.ClosingStatementLine.fields.variant
        distinguishing_aspect: |
          Same GCI (1000000) and same fee schedule, but the STANDARD variant
          (agent ACTIVE at close) books an OVERHEAD_SHARE line of 37500 while
          the FORMER_AGENT variant (agent TERMINATION_PENDING at close) waives
          overhead to 0 and routes the same 712500 retention into
          DEPARTURE_HOLD instead of AGENT_PAYABLE — identical inputs, two
          valid algorithms, different line sets on the Transaction domain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Two Denver agents Alice and Bob, each ACTIVE with an ACCEPTED assignment on the 95/5 schedule."
            - "Two transactions T1 (seller Alice) and T2 (seller Bob), each UNDER_CONTRACT via offer acceptance with GCI 1000000, each with a fully approved CDA, each moved to PENDING_CLOSE."
            - "Bob has initiated termination (status TERMINATION_PENDING) AFTER his CDA was approved but BEFORE T2 closes; Alice remains ACTIVE."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &d_office
              call: "POST /offices"
              payload: { office_name: "Denver Central", market_code: "DEN", recruiting_target_agents: 25 }
              as: FranchiseeOwner
              captures: { office_id: $.data.id }
            - &d_office2
              call: "POST /offices"
              payload: { office_name: "Phoenix North", market_code: "PHX", recruiting_target_agents: 10 }
              as: FranchiseeOwner
              captures: { office2_id: $.data.id }
            - &d_sched
              call: "POST /fee-schedules"
              payload: { schedule_name: "95/5 Desk Plan", desk_fee_cents: 300000, overhead_share_bps: 500, retention_bps: 9500, referral_fee_bps: 2500, tech_subscription_monthly_cents: 25000, marketing_monthly_cents: 40000, effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z" }
              as: BrokerOfRecord
              captures: { sched_id: $.data.id }
            - &d_alice
              call: "POST /offices/${office_id}/agents"
              payload: { full_name: "Alice Agent", email: "alice@x.com", license_number: "LIC-A-001" }
              as: ManagingBroker
              captures: { alice_id: $.data.id, alice_v0: $.data.version }
            - &d_bob
              call: "POST /offices/${office_id}/agents"
              payload: { full_name: "Bob Agent", email: "bob@x.com", license_number: "LIC-B-002" }
              as: ManagingBroker
              captures: { bob_id: $.data.id, bob_v0: $.data.version }
            - &d_fa_alice
              call: "POST /agents/${alice_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${alice_v0}" }
              as: ManagingBroker
              captures: { fa_alice_id: $.data.id }
            - &d_fa_alice_accept
              call: "POST /fee-assignments/${fa_alice_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &d_fa_bob
              call: "POST /agents/${bob_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${bob_v0}" }
              as: ManagingBroker
              captures: { fa_bob_id: $.data.id }
            - &d_fa_bob_accept
              call: "POST /fee-assignments/${fa_bob_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${bob_id}"
            - &d_offer1
              call: "POST /offices/${office_id}/offers"
              payload: { listing_reference: "L-100", buyer_name: "Buyer One", offer_price_cents: 50000000 }
              as: Agent
              as_user_id: "${alice_id}"
              captures: { offer1_id: $.data.id }
            - &d_offer1_accept
              call: "POST /offers/${offer1_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &d_txn1
              call: "POST /offices/${office_id}/transactions"
              payload: { listing_agent_id: "${alice_id}", selling_agent_id: "${alice_id}", offer_id: "${offer1_id}", sale_price_cents: 50000000, gross_commission_cents: 1000000 }
              as: ManagingBroker
              captures: { txn1_id: $.data.id }
            - &d_offer2
              call: "POST /offices/${office_id}/offers"
              payload: { listing_reference: "L-200", buyer_name: "Buyer Two", offer_price_cents: 50000000 }
              as: Agent
              as_user_id: "${bob_id}"
              captures: { offer2_id: $.data.id }
            - &d_offer2_accept
              call: "POST /offers/${offer2_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${bob_id}"
            - &d_txn2
              call: "POST /offices/${office_id}/transactions"
              payload: { listing_agent_id: "${bob_id}", selling_agent_id: "${bob_id}", offer_id: "${offer2_id}", sale_price_cents: 50000000, gross_commission_cents: 1000000 }
              as: ManagingBroker
              captures: { txn2_id: $.data.id }
            - &d_cda1
              call: "POST /transactions/${txn1_id}/cdas"
              payload: { review_ladder: ["COMPLIANCE_REVIEW", "TRUST_REVIEW", "BROKER_SIGNOFF"] }
              as: ManagingBroker
              captures: { cda1_id: $.data.id }
            - &d_cda1_r0
              call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: ComplianceAuditor
            - &d_cda1_r1
              call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: TrustAccountant
            - &d_cda1_r2
              call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: ManagingBroker
            - &d_cda2
              call: "POST /transactions/${txn2_id}/cdas"
              payload: { review_ladder: ["COMPLIANCE_REVIEW", "TRUST_REVIEW", "BROKER_SIGNOFF"] }
              as: ManagingBroker
              captures: { cda2_id: $.data.id }
            - &d_cda2_r0
              call: "POST /cdas/${cda2_id}/review"
              payload: { verdict: "APPROVE" }
              as: ComplianceAuditor
            - &d_cda2_r1
              call: "POST /cdas/${cda2_id}/review"
              payload: { verdict: "APPROVE" }
              as: TrustAccountant
            - &d_cda2_r2
              call: "POST /cdas/${cda2_id}/review"
              payload: { verdict: "APPROVE" }
              as: ManagingBroker
            - &d_rc1
              call: "POST /transactions/${txn1_id}/request-close"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &d_rc2
              call: "POST /transactions/${txn2_id}/request-close"
              payload: {}
              as: Agent
              as_user_id: "${bob_id}"
            - &d_bob_terminate
              call: "POST /agents/${bob_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${bob_id}"
          trigger:
            - call: "POST /transactions/${txn1_id}/close"
              payload: {}
              as: ManagingBroker
            - call: "POST /transactions/${txn2_id}/close"
              payload: {}
              as: ManagingBroker
          assert:
            - "Transaction.${txn1_id}.status == CLOSED and Transaction.${txn2_id}.status == CLOSED"
            - "T1 lines (STANDARD): REFERRAL_FEE 250000, AGENT_RETENTION 712500, OVERHEAD_SHARE 37500, OFFICE_SPLIT 0"
            - "T2 lines (FORMER_AGENT): REFERRAL_FEE 250000, AGENT_RETENTION 712500, OVERHEAD_SHARE 0, OFFICE_SPLIT 37500"
            - "every ClosingStatementLine of ${txn1_id} has variant == STANDARD; every line of ${txn2_id} has variant == FORMER_AGENT"
            - "the AGENT_RETENTION line of ${txn1_id} is matched by a CommissionEntry in status AGENT_PAYABLE, while ${txn2_id}'s retention sits in a CommissionEntry with status DEPARTURE_HOLD"
            - "sum of amount_cents over each transaction's closing lines == 0"

      - name: departure_proration_owed_vs_refund_fixed_month
        grounds:
          - calculations.departure_proration
          - state_machines.Agent.TERMINATION_PENDING_to_TERMINATED
          - entities.Invoice.fields.origin
        distinguishing_aspect: |
          On the Agent domain (not the Transaction domain of the sibling
          instance), the same desk_fee_cents 300000 and the same departure date
          (day 10 of a 30-day fixed month) feed two valid proration algorithms:
          owed_variant charges round_half_up(300000*10/30) = 100000 on the
          DEPARTURE invoice when the month was never billed, while
          refund_variant credits round_half_up(300000*20/30) = 200000 when the
          September desk fee was already PAID — and owed + refund == desk fee
          exactly.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z. Alice ACTIVE on the 95/5 schedule; Bob ACTIVE on the same schedule."
            - "September billing run executed for both agents; Bob's September invoice (365000) is fully PAID, Alice's is left ISSUED."
            - "Clock advanced to 2026-09-10T00:00:00Z (D=10); both agents terminate; clock advanced to 2026-09-24T00:00:00Z (notice window elapsed)."
          setup_api_calls:
            - &p_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_bob
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_fa_bob
            - *d_fa_bob_accept
            - &p_gen_sep
              call: "POST /offices/${office_id}/generate-invoices"
              payload: { billing_month: "2026-09" }
              as: ManagingBroker
              captures: { inv_bob_id: "$.data[1].id", inv_alice_id: "$.data[0].id" }
            - &p_pay_bob
              call: "POST /invoices/${inv_bob_id}/pay"
              payload: { amount_cents: 365000 }
              as: Agent
              as_user_id: "${bob_id}"
            - &p_clock1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &p_alice_term
              call: "POST /agents/${alice_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &p_bob_term
              call: "POST /agents/${bob_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${bob_id}"
            - &p_clock2
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agents/${alice_id}/complete-termination"
              payload: {}
              as: ManagingBroker
            - call: "POST /agents/${bob_id}/complete-termination"
              payload: {}
              as: ManagingBroker
          assert:
            - "Agent.${alice_id}.status == TERMINATED and Agent.${bob_id}.status == TERMINATED"
            - "Alice's DEPARTURE invoice carries PRORATED_DESK_FEE line amount_cents == 100000 (owed variant: days 1..10 of the fixed 30-day month)"
            - "Bob's DEPARTURE invoice carries a refund credit of 200000 (refund variant: days 11..30 of the already-PAID September fee), netted so his departure invoice total is 200000 LESS than the owed-variant shape"
            - "100000 + 200000 == 300000 == FeeSchedule.${sched_id}.desk_fee_cents exactly (invariant_pending_gci_conservation at the proration level)"
            - "Alice's departure invoice has origin == DEPARTURE and due_date == terminated_at + 14 days"
            - "Office.${office_id}.active_agent_count == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: closing_statement_pinned_evaluation_order_overhead_off_net_gci
        grounds:
          - calculations.closing_statement
          - entities.ClosingStatementLine.fields.line_type
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: overhead_share keys off
          net_gci (post-referral), net_gci keys off the referral tier, and
          office_split is the residual — with GCI 1000000, referral 2500bps,
          retention 9500bps, overhead 500bps the pinned order yields
          OVERHEAD_SHARE 37500 and OFFICE_SPLIT 0; evaluating overhead off
          gross (the wrong order) would yield 50000 and a negative residual.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE on the 95/5 schedule; one UNDER_CONTRACT transaction T1 with GCI 1000000, CDA fully approved, PENDING_CLOSE."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_offer1
            - *d_offer1_accept
            - *d_txn1
            - *d_cda1
            - *d_cda1_r0
            - *d_cda1_r1
            - *d_cda1_r2
            - *d_rc1
          trigger:
            - call: "POST /transactions/${txn1_id}/close"
              payload: {}
              as: ManagingBroker
          assert:
            - "ClosingStatementLine GCI == 1000000"
            - "REFERRAL_FEE == 250000 (computed first, off gross)"
            - "AGENT_RETENTION == 712500 (off net 750000)"
            - "OVERHEAD_SHARE == 37500 (off net 750000 — NOT 50000 off gross)"
            - "OFFICE_SPLIT == 0 == 750000 - 712500 - 37500 (residual last)"
            - "the six line amounts sum to zero"

      - name: invoice_line_totals_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_line_totals
          - entities.Invoice.fields.amount_due_cents
          - entities.InvoiceLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: each InvoiceLine is rounded half-up to
          whole cents BEFORE the invoice sum — desk 300000 + tech 25000 +
          marketing 40000 are already whole so the per-line order is pinned
          and observable as amount_due_cents == 365000 with each line stored
          at its own rounded value; the scaffold forbids the sum-then-round
          order even where both orders would coincide, because the line rows
          themselves carry the rounded amounts.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Alice ACTIVE on the 95/5 schedule. No invoices yet."
          setup_api_calls:
            - *p_clock0
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
          trigger:
            - call: "POST /offices/${office_id}/generate-invoices"
              payload: { billing_month: "2026-09" }
              as: ManagingBroker
              captures: { inv_id: "$.data[0].id" }
          assert:
            - "exactly one invoice created for Alice, origin == AUTO_RUN, status == ISSUED"
            - "Invoice.${inv_id}.amount_due_cents == 365000"
            - "the invoice has exactly 3 lines: DESK_FEE 300000, TECH_SUBSCRIPTION 25000, MARKETING 40000"
            - "no OVERHEAD_SHARE line exists on the monthly invoice (overhead is deducted at closing only)"
            - "Invoice.${inv_id}.due_date == 2026-09-08T00:00:00Z (first of billing month + 7 days)"
            - "re-running generate-invoices for 2026-09 returns the same invoice (idempotent), GET /invoices?agent_id=${alice_id} still returns exactly 1 row"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: offer_negotiation_cycle_round_cap
        grounds:
          - state_machines.Offer.OFFERED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_OFFERED
          - errors.ERR_NEGOTIATION_EXHAUSTED
        distinguishing_aspect: |
          The Offer machine is cyclic (OFFERED -> COUNTERED -> OFFERED) with a
          round counter: four full reoffer cycles succeed (offer_round
          1->2->3->4->5 guarded so the 4th reoffer lands round 4... pinned:
          rounds increment per reoffer and the reoffer that would start round
          5 is rejected with ERR_NEGOTIATION_EXHAUSTED) — a loop with a
          termination condition, not a pipeline.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE; one OFFERED offer O1 (round 1)."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_offer1
          trigger:
            - &nl_counter
              call: "POST /offers/${offer1_id}/counter"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &nl_reoffer
              call: "POST /offers/${offer1_id}/reoffer"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - *nl_counter
            - *nl_reoffer
            - *nl_counter
            - *nl_reoffer
            - *nl_counter
            - call: "POST /offers/${offer1_id}/reoffer"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "after three counter/reoffer cycles Offer.${offer1_id}.offer_round == 4 and status == OFFERED"
            - "the fourth counter succeeds (status COUNTERED, round still 4)"
            - "the fourth reoffer (which would open round 5) returns 409 and err_id == ERR_NEGOTIATION_EXHAUSTED"
            - "Offer.${offer1_id} remains COUNTERED with offer_round == 4 after the rejection"

      - name: cda_review_ladder_reject_cycles_to_rung_zero
        grounds:
          - state_machines.CommissionDisbursementAuthorization.IN_REVIEW_to_IN_REVIEW
          - state_machines.CommissionDisbursementAuthorization.IN_REVIEW_to_APPROVED
          - errors.ERR_REVIEW_RUNG_MISMATCH
        distinguishing_aspect: |
          The CDA machine cycles IN_REVIEW -> IN_REVIEW: a REJECT at rung 2
          resets current_rung to 0 instead of terminating, so the ladder must
          be re-walked — and a second REJECT-free walk reaches APPROVED,
          proving the loop is productive rather than a dead end. Different
          entity than the Offer cycle.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE; T1 UNDER_CONTRACT; CDA1 IN_REVIEW at rung 0."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_offer1
            - *d_offer1_accept
            - *d_txn1
            - *d_cda1
          trigger:
            - *d_cda1_r0
            - *d_cda1_r1
            - call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "REJECT" }
              as: ManagingBroker
            - *d_cda1_r0
            - *d_cda1_r1
            - *d_cda1_r2
          assert:
            - "after the REJECT at rung 2, CommissionDisbursementAuthorization.${cda1_id}.status == IN_REVIEW and current_rung == 0"
            - "a rung-1 review immediately after the REJECT is rejected with 409 ERR_REVIEW_RUNG_MISMATCH (the ladder really reset)"
            - "after the second full walk the CDA is APPROVED with current_rung == 2 consumed"
            - "CDA.${cda1_id}.status == APPROVED exactly once (terminal)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: close_cascade_receipt_to_split_to_referral_fulfillment
        grounds:
          - state_machines.Transaction.PENDING_CLOSE_to_CLOSED
          - state_machines.ReferralAgreement.ACTIVE_to_FULFILLED
          - calculations.closing_statement
        distinguishing_aspect: |
          Depth-3 chain: close posts GCI_RECEIPT (hop 1); the split of that
          receipt posts AGENT_DISBURSEMENT / OFFICE_FEE_ACCRUAL /
          REFERRAL_PAYOUT entries (hop 2, caused by the receipt); the
          REFERRAL_PAYOUT entry itself flips the covering ReferralAgreement
          ACTIVE -> FULFILLED and stamps fulfilled_transaction_id (hop 3,
          caused by hop 2 — not by the close directly).
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE in Denver; Phoenix office exists with its own ACTIVE agent Carol; an ACTIVE ReferralAgreement (referring Phoenix -> receiving Denver, agent Alice, 2000bps) covers the deal."
            - "T1 UNDER_CONTRACT with GCI 1000000, CDA approved, PENDING_CLOSE."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - &c_carol
              call: "POST /offices/${office2_id}/agents"
              payload: { full_name: "Carol Agent", email: "carol@x.com", license_number: "LIC-C-003" }
              as: ManagingBroker
              captures: { carol_id: $.data.id, carol_v0: $.data.version }
            - &c_fa_carol
              call: "POST /agents/${carol_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${carol_v0}" }
              as: ManagingBroker
              captures: { fa_carol_id: $.data.id }
            - &c_fa_carol_accept
              call: "POST /fee-assignments/${fa_carol_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${carol_id}"
            - &c_ref
              call: "POST /referral-agreements"
              payload: { referring_office_id: "${office2_id}", receiving_office_id: "${office_id}", agent_id: "${alice_id}", referral_fee_bps: 2000 }
              as: ManagingBroker
              captures: { ref_id: $.data.id }
            - &c_ref_accept
              call: "POST /referral-agreements/${ref_id}/accept"
              payload: {}
              as: ManagingBroker
            - *d_offer1
            - *d_offer1_accept
            - *d_txn1
            - *d_cda1
            - *d_cda1_r0
            - *d_cda1_r1
            - *d_cda1_r2
            - *d_rc1
          trigger:
            - call: "POST /transactions/${txn1_id}/close"
              payload: {}
              as: ManagingBroker
          assert:
            - "a CommissionEntry kind=GCI_RECEIPT status=ESCROW_HELD amount 1000000 exists for ${txn1_id} (hop 1)"
            - "CommissionEntries AGENT_DISBURSEMENT (AGENT_PAYABLE, 760000), OFFICE_FEE_ACCRUAL (OFFICE_FEE_ACCRUED, 40000) and REFERRAL_PAYOUT (REFERRAL_PAYABLE, 200000) exist — the split is computed off net 800000 because the agreement's 2000bps overrides the schedule's 2500bps (hop 2)"
            - "ReferralAgreement.${ref_id}.status == FULFILLED and fulfilled_transaction_id == ${txn1_id} (hop 3, caused by the payout entry)"
            - "GET /commission-entries?transaction_id=${txn1_id} returns exactly the receipt plus its split children with the statuses above"

      - name: terminate_cascade_holds_to_departure_invoice_to_release
        grounds:
          - state_machines.Agent.ACTIVE_to_TERMINATION_PENDING
          - state_machines.Agent.TERMINATION_PENDING_to_TERMINATED
          - state_machines.CommissionEntry.DEPARTURE_HOLD_to_DISBURSED
        distinguishing_aspect: |
          Different trigger than the close cascade and depth >= 2: terminate
          spawns DEPARTURE_HOLD entries from open invoice lines (hop 1);
          complete-termination generates the DEPARTURE invoice and nets the
          holds against it (hop 2, caused by hop 1's holds existing); when the
          invoice nets to <= 0 the holds flip DEPARTURE_HOLD -> DISBURSED
          (implicit hop 3 inside the release step).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01; Alice ACTIVE; September invoice ISSUED at 365000 unpaid. Clock 2026-09-10: Alice terminates (holds spawn). Clock 2026-09-24: notice elapsed."
          setup_api_calls:
            - *p_clock0
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *p_gen_sep
            - *p_clock1
            - *p_alice_term
            - *p_clock2
          trigger:
            - call: "POST /agents/${alice_id}/complete-termination"
              payload: {}
              as: ManagingBroker
          assert:
            - "after terminate, a CommissionEntry kind=DEPARTURE_HOLD status=DEPARTURE_HOLD amount 365000 exists (hop 1)"
            - "after complete-termination, a new Invoice with origin == DEPARTURE exists carrying PRORATED_DESK_FEE 100000 (hop 2)"
            - "the DEPARTURE_HOLD entry transitioned out of DEPARTURE_HOLD (released/netted) — GET /commission-entries?office_id=${office_id}&status=DEPARTURE_HOLD returns 0 rows for Alice"
            - "Agent.${alice_id}.status == TERMINATED and Office.${office_id}.active_agent_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: cda_review_wrong_rung_and_terminal_state_conflict
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - errors.ERR_REVIEW_RUNG_MISMATCH
        distinguishing_aspect: |
          state (priority 4) vs business_safety (priority 11): on an APPROVED
          (terminal) CDA, a review submitted by the WRONG role for rung 0 must
          surface ERR_INVALID_STATE — the state check fires before the
          rung-ownership safety check is ever consulted.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE; T1 UNDER_CONTRACT; CDA1 fully walked to APPROVED."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_offer1
            - *d_offer1_accept
            - *d_txn1
            - *d_cda1
            - *d_cda1_r0
            - *d_cda1_r1
            - *d_cda1_r2
          trigger:
            - call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: TrustAccountant
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "err_id != ERR_REVIEW_RUNG_MISMATCH — terminal-state rejection wins over rung ownership"
            - "CDA.${cda1_id}.status remains APPROVED"

      - name: pay_invoice_overpayment_vs_terminal_state_conflict
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
          - errors.ERR_OVERPAYMENT
        distinguishing_aspect: |
          state (priority 4) vs business_fiscal (priority 10): paying MORE
          than the remaining balance on an already-PAID invoice must surface
          ERR_INVALID_STATE (terminal), not ERR_OVERPAYMENT — a different
          category pair than the CDA conflict.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Alice ACTIVE; September invoice generated and fully PAID (365000)."
          setup_api_calls:
            - *p_clock0
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *p_gen_sep
            - call: "POST /invoices/${inv_alice_id}/pay"
              payload: { amount_cents: 365000 }
              as: Agent
              as_user_id: "${alice_id}"
          trigger:
            - call: "POST /invoices/${inv_alice_id}/pay"
              payload: { amount_cents: 99999999 }
              as: Agent
              as_user_id: "${alice_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "err_id != ERR_OVERPAYMENT"
            - "Invoice.${inv_alice_id}.amount_paid_cents == 365000 (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: offer_ttl_72h_exact_boundary_expires
        grounds:
          - calculations.offer_expiry_check
          - state_machines.Offer.OFFERED_to_EXPIRED
          - errors.ERR_OFFER_EXPIRED
        distinguishing_aspect: |
          Numeric threshold crossing on the TTL metric: at updated_at + 71:59:59
          the offer is still OFFERED and acceptable; at exactly updated_at +
          72:00:00 the >= boundary flips it to EXPIRED and accept is rejected
          with ERR_OFFER_EXPIRED. Reached through POST /offers/{id}/accept.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE; O1 created OFFERED at exactly 2026-09-10T00:00:00Z."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_offer1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T23:59:59Z" }
              as: PlatformAdmin
            - call: "GET /offers/${offer1_id}"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /offers/${offer1_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "at 2026-09-12T23:59:59Z (71:59:59 elapsed) Offer.${offer1_id}.status == OFFERED"
            - "at exactly 2026-09-13T00:00:00Z (72:00:00 elapsed) accept returns 409 and err_id == ERR_OFFER_EXPIRED"
            - "after the failed accept, Offer.${offer1_id}.status == EXPIRED"

      - name: retention_report_zero_baseline_rejected
        grounds:
          - calculations.agent_retention_index
          - errors.ERR_NO_RETENTION_BASELINE
          - entities.AgentRetentionReport.fields.headcount_start
        distinguishing_aspect: |
          Empty-set boundary on the headcount metric (a different metric than
          the TTL seconds and reached through a different endpoint): with
          zero agents onboarded before 2026-09-01, headcount_start == 0 and
          the CHURN report is rejected with 422 ERR_NO_RETENTION_BASELINE;
          adding one agent onboarded in August makes the same call succeed
          with retention_bps == 10000.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Denver office exists with NO agents onboarded before September. (Bob is onboarded and activated in August in a parallel fixture for the positive branch — here the office starts empty.)"
          setup_api_calls:
            - *p_clock0
            - *d_office
            - *d_office2
          trigger:
            - call: "POST /offices/${office_id}/retention-reports/compute"
              payload: { period_month: "2026-09", report_variant: "CHURN" }
              as: FranchiseeOwner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and err_id == ERR_NO_RETENTION_BASELINE"
            - "GET /offices/${office_id}/retention-reports returns 0 rows — no report row is persisted on the failure path"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: request_close_gated_by_cda_approval
        grounds:
          - state_machines.Transaction.UNDER_CONTRACT_to_PENDING_CLOSE
          - state_machines.CommissionDisbursementAuthorization.IN_REVIEW_to_APPROVED
          - errors.ERR_CDA_NOT_APPROVED
        distinguishing_aspect: |
          Transaction -> CommissionDisbursementAuthorization pair:
          request-close on a transaction whose CDA is still IN_REVIEW (rung 1
          of 3) fails with ERR_CDA_NOT_APPROVED; only after the ladder reaches
          APPROVED does the identical request succeed — supervision gating that
          persists regardless of the desk-fee compensation model.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE; T1 UNDER_CONTRACT; CDA1 IN_REVIEW with only rung 0 approved."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_offer1
            - *d_offer1_accept
            - *d_txn1
            - *d_cda1
            - *d_cda1_r0
          trigger:
            - call: "POST /transactions/${txn1_id}/request-close"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
              captures: { err_id: $.data.error_id }
            - *d_cda1_r1
            - *d_cda1_r2
            - call: "POST /transactions/${txn1_id}/request-close"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
          assert:
            - "the first request-close returns 409 and err_id == ERR_CDA_NOT_APPROVED"
            - "Transaction.${txn1_id}.status remains UNDER_CONTRACT after the rejection"
            - "after the ladder completes, the identical request-close returns 200 and Transaction.${txn1_id}.status == PENDING_CLOSE"

      - name: office_close_gated_by_active_agent_count
        grounds:
          - state_machines.Office.ACTIVE_to_CLOSED
          - entities.Office.fields.active_agent_count
          - errors.ERR_OFFICE_NOT_EMPTY
        distinguishing_aspect: |
          Office -> Agent pair (different pair than Transaction -> CDA):
          close_office while any Agent of the office is ACTIVE fails with
          ERR_OFFICE_NOT_EMPTY; once the last agent is TERMINATED
          (active_agent_count reaches 0) the same close succeeds and cascades
          open invoices into COLLECTIONS.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE in Denver (active_agent_count == 1)."
          setup_api_calls:
            - *p_clock0
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
          trigger:
            - call: "POST /offices/${office_id}/close"
              payload: {}
              as: FranchiseeOwner
              captures: { close_err: $.data.error_id }
            - *p_alice_term
            - *p_clock2
            - call: "POST /agents/${alice_id}/complete-termination"
              payload: {}
              as: ManagingBroker
            - call: "POST /offices/${office_id}/close"
              payload: {}
              as: FranchiseeOwner
          assert:
            - "the first close (Alice still ACTIVE) returns 409 and close_err == ERR_OFFICE_NOT_EMPTY"
            - "after complete-termination, Office.${office_id}.active_agent_count == 0"
            - "the second close returns 200, Office.${office_id}.status == CLOSED and closed_at == 2026-09-24T00:00:00Z"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: fee_assignment_window_overlap_rejected_but_adjacency_allowed
        grounds:
          - validations[priority=7]
          - entities.FeeAssignment.fields.effective_from
          - errors.ERR_ASSIGNMENT_OVERLAP
        distinguishing_aspect: |
          Half-open [from, to) interval semantics on the FeeAssignment
          resource: a second assignment whose window [2026-06-01, 9999-12-31)
          intersects the existing [2026-01-01, 9999-12-31) is rejected with
          ERR_ASSIGNMENT_OVERLAP, while a window starting exactly at the
          predecessor's effective_to (gap=0 adjacency) is accepted.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE with ACCEPTED assignment window [2026-01-01, 9999-12-31). Second schedule exists for the follow-up window."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - &ro_sched2
              call: "POST /fee-schedules"
              payload: { schedule_name: "90/10 Desk Plan", desk_fee_cents: 200000, overhead_share_bps: 600, retention_bps: 9000, referral_fee_bps: 2500, tech_subscription_monthly_cents: 25000, marketing_monthly_cents: 40000, effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z" }
              as: BrokerOfRecord
              captures: { sched2_id: $.data.id }
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
            - call: "GET /agents/${alice_id}"
              payload: {}
              as: ManagingBroker
              captures: { alice_v_now: $.data.version }
          trigger:
            - call: "POST /agents/${alice_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched2_id}", effective_from: "2026-06-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${alice_v_now}" }
              as: ManagingBroker
              captures: { err_id: $.data.error_id }
          assert:
            - "the overlapping create returns 409 and err_id == ERR_ASSIGNMENT_OVERLAP"
            - "GET /agents/${alice_id}/fee-assignments returns exactly 1 ACCEPTED row (no new assignment persisted)"

      - name: fee_schedule_window_must_tile_without_overlap
        grounds:
          - validations[priority=8]
          - entities.FeeSchedule.fields.effective_to
          - errors.ERR_SCHEDULE_WINDOW_VIOLATION
        distinguishing_aspect: |
          Different resource (FeeSchedule, not FeeAssignment) and different
          interval semantics: schedule windows must TILE — a new window that
          overlaps the existing schedule's [2026-01-01, 9999-12-31) is
          rejected, and because the incumbent is open-ended no legal successor
          window exists at all (the whole calendar is covered), making the
          overlap check a strict-superset rejection rather than mere adjacency
          bookkeeping.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. The open-ended 95/5 schedule covers [2026-01-01, 9999-12-31)."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
          trigger:
            - call: "POST /fee-schedules"
              payload: { schedule_name: "Rogue Plan", desk_fee_cents: 100000, overhead_share_bps: 400, retention_bps: 9600, referral_fee_bps: 2500, tech_subscription_monthly_cents: 10000, marketing_monthly_cents: 10000, effective_from: "2027-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z" }
              as: BrokerOfRecord
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_SCHEDULE_WINDOW_VIOLATION"
            - "GET /fee-schedules returns exactly 1 row — the rogue schedule was not persisted"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: advance_and_return_preserve_unearned_balance
        grounds:
          - calculations.advance_recovery_offset
          - entities.Agent.fields.unearned_advance_balance_cents
          - endpoints.POST_/agents/{agentId}/advance-commission
          - endpoints.POST_/agents/{agentId}/return-advance
        distinguishing_aspect: |
          Conserved quantity: Agent.unearned_advance_balance_cents.
          advance(100000) then return_advance(100000) leaves the balance
          exactly at its pre-pair value 0, and the matching ADVANCE /
          ADVANCE_RETURN CommissionEntries carry +100000 / -100000 signed
          amounts — forward action plus compensating action, zero drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T00:00:00Z. Alice ACTIVE; unearned_advance_balance_cents == 0."
          setup_api_calls:
            - *d_clock
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_fa_alice
            - *d_fa_alice_accept
          trigger:
            - call: "POST /agents/${alice_id}/advance-commission"
              payload: { amount_cents: 100000 }
              as: ManagingBroker
            - call: "POST /agents/${alice_id}/return-advance"
              payload: { amount_cents: 100000 }
              as: Agent
              as_user_id: "${alice_id}"
          assert:
            - "after the advance, Agent.${alice_id}.unearned_advance_balance_cents == 100000"
            - "after the return, Agent.${alice_id}.unearned_advance_balance_cents == 0 (exactly the pre-pair value)"
            - "GET /commission-entries?office_id=${office_id} contains ADVANCE +100000 and ADVANCE_RETURN -100000"
            - "a further return-advance of 1 is rejected with 422 ERR_OVERPAYMENT (balance cannot go negative)"

      - name: pay_then_writeoff_floor_and_trust_conservation
        grounds:
          - calculations.trust_balance
          - state_machines.Invoice.COLLECTIONS_to_PAID
          - state_machines.Invoice.COLLECTIONS_to_WRITTEN_OFF
          - entities.Office.fields.trust_balance_cents
        distinguishing_aspect: |
          Different conserved quantity: Office.trust_balance_cents over the
          escrow+receivable identity. An ISSUED invoice contributes 365000 to
          trust; paying it in full moves the contribution to zero via PAID
          (forward + compensating payment leave the identity
          trust == entries + receivables intact), while a WRITE_OFF of an
          unpaid COLLECTIONS invoice reduces trust by exactly the unpaid
          balance — each path conserves the formula, no drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Alice ACTIVE; September invoice 365000 ISSUED (unpaid). Bob ACTIVE; his September invoice 365000 also ISSUED. Clock advanced to 2026-10-08T00:00:00Z so Bob's invoice (due 2026-09-08) is 30 days past due and escalates ISSUED -> OVERDUE -> COLLECTIONS; office suspends."
          setup_api_calls:
            - *p_clock0
            - *d_office
            - *d_office2
            - *d_sched
            - *d_alice
            - *d_bob
            - *d_fa_alice
            - *d_fa_alice_accept
            - *d_fa_bob
            - *d_fa_bob_accept
            - &ci_gen_sep
              call: "POST /offices/${office_id}/generate-invoices"
              payload: { billing_month: "2026-09" }
              as: ManagingBroker
              captures: { inv_alice_id: "$.data[0].id", inv_bob_id: "$.data[1].id" }
            - &ci_pay_alice
              call: "POST /invoices/${inv_alice_id}/pay"
              payload: { amount_cents: 365000 }
              as: Agent
              as_user_id: "${alice_id}"
            - &ci_clock_late
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /invoices/${inv_bob_id}"
              payload: {}
              as: TrustAccountant
          trigger:
            - call: "POST /invoices/${inv_bob_id}/write-off"
              payload: {}
              as: BrokerOfRecord
          assert:
            - "before escalation, Office trust_balance_cents == 365000 (Bob's unpaid invoice; Alice's is PAID and drops out of the receivable sum)"
            - "after the clock advance, Invoice.${inv_bob_id}.status == COLLECTIONS and Office.${office_id}.status == SUSPENDED"
            - "write-off returns 200, Invoice.${inv_bob_id}.status == WRITTEN_OFF"
            - "Office.${office_id}.trust_balance_cents == 0 (unpaid 365000 removed as bad debt; no escrow entries exist)"
            - "Office.${office_id}.status == ACTIVE again (last COLLECTIONS invoice cleared)"
