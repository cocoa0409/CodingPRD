# =============================================================================
# §1.9 Scaffold Corner Design — Recreational Vehicle Assembly Plant
#
# Breadth probe. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe over
# the nine §0.5 reasoning rules; this file walks
# references/claim-extraction-guide.md row by row against §1.1-§1.7 of
# SCAFFOLD.yaml and emits one instance per applicable row, or an
# `excluded_because:` stub when a §1.8 instance already asserts the corner.
#
# Shared fixtures, always built from empty DB inside the instance itself:
#
#   TOW kit  — FloorPlan FP-TOW (TOWABLE, 28 ft, msrp 8000000, base hours 40.00,
#              dry 6000, gvwr 9000, wheelbase 180, 50 A, 60 gal),
#              OptionItem OPT-E1 (ELECTRICAL, ROUGH_IN, 100000 cents, 0 lbs,
#              1.00 h, 20 A), Dealer D-TOW (CENTRAL, 1500 bp, credit limit
#              100000000, goodwill 500000), ProductionLine LINE-T (TOWABLE,
#              240.00 h/day, 4 units/day), ChassisReceipt CH-T1 (TOWABLE,
#              gvwr 9000, wheelbase 180), TestBooth BOOTH-W (WATER_TEST,
#              1 bay, 30 min turnaround).
#              A STOCK order on [OPT-E1] therefore has
#              required_station_hours 41.00 (41.00 * 1.00 * 1.00; 20 A is under
#              the 40 A surcharge threshold), config_weight_lbs 6000,
#              payload_remaining_lbs 3000, provisional_invoice_cents 6620350
#              (6240000 + 82750 + freight 297600) and, once funded,
#              financed_principal_cents 5958315.
#
#   CANON kit — FloorPlan FP-3410 and the five canonical options of §1.3's
#              worked examples (required_station_hours 71.24,
#              config_weight_lbs 22920, provisional_invoice_cents 16122725,
#              financed_principal_cents 14510453).
#
# The logical clock starts at 2026-08-01T00:00:00Z and may only be moved
# forward (ERR_INVALID_REQUEST otherwise), so instances that need no particular
# instant still advance it once to exercise POST /_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: floor_plan_creation_returns_computed_payload_and_default_status
        claim_type: creation
        grounds:
          - endpoints["POST /floor-plans"]
          - entities.FloorPlan.fields.max_payload_lbs
          - entities.FloorPlan.fields.status
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "A POST /floor-plans carrying only the ten declared input fields returns 201 with max_payload_lbs 3600 computed by the server, status defaulted to ACTIVE, version 1 and created_at taken from the logical clock."
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock is moved from its 2026-08-01T00:00:00Z default to 2026-08-02T00:00:00Z so the created_at stamp is provably taken from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantAdmin
              captures: { clock_now: $.data.current_utc, clock_prev: $.data.previous_utc }
          trigger:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
          assert:
            - "response status == 201 and response_type == object"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are both present"
            - "FloorPlan.${fp_id}.max_payload_lbs == 3600 (26000 - 22400)"
            - "FloorPlan.${fp_id}.status == ACTIVE (default applied, not supplied)"
            - "FloorPlan.${fp_id}.version == 1"
            - "FloorPlan.${fp_id}.created_at == 2026-08-02T00:00:00Z and updated_at == 2026-08-02T00:00:00Z"
            - "the setup call reported previous_utc == 2026-08-01T00:00:00Z and current_utc == 2026-08-02T00:00:00Z"

      - name: option_item_defaults_applied_when_optional_fields_are_omitted
        claim_type: defaults
        grounds:
          - endpoints["POST /option-items"]
          - entities.OptionItem.fields.amp_draw
          - entities.OptionItem.fields.water_demand_gal
          - entities.OptionItem.fields.requires_option_codes
          - entities.OptionItem.fields.excludes_option_codes
          - entities.OptionItem.fields.status
        distinguishing_aspect: "Omitting all five optional OptionItem inputs yields amp_draw 0, water_demand_gal 0, requires_option_codes [], excludes_option_codes [] and status ACTIVE, and a second option that supplies them keeps the supplied values."
        test_recipe:
          setup:
            - "Empty database, clock advanced to 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantAdmin
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "POST /option-items"
              payload: { option_code: "OPT-BARE", category: "INTERIOR", install_station: "FINISH", price_cents: 50000, weight_lbs: 10, added_station_hours: 1.00 }
              as: PlantAdmin
              captures: { opt_bare_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-FULL", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 3, requires_option_codes: ["OPT-BARE"], excludes_option_codes: [], status: "DISCONTINUED" }
              as: PlantAdmin
              captures: { opt_full_id: $.data.id }
          assert:
            - "OptionItem.${opt_bare_id}.amp_draw == 0 and water_demand_gal == 0"
            - "OptionItem.${opt_bare_id}.requires_option_codes == [] and excludes_option_codes == []"
            - "OptionItem.${opt_bare_id}.status == ACTIVE and version == 1"
            - "OptionItem.${opt_full_id}.amp_draw == 20 and water_demand_gal == 3"
            - "OptionItem.${opt_full_id}.requires_option_codes == [\"OPT-BARE\"] and status == DISCONTINUED"

      - name: unit_order_computed_totals_are_derived_at_create
        claim_type: computed_fields
        grounds:
          - endpoints["POST /unit-orders"]
          - calculations.unit_order_configuration_totals
          - entities.UnitOrder.fields.required_station_hours
          - entities.UnitOrder.fields.payload_remaining_lbs
          - entities.UnitOrder.fields.provisional_invoice_cents
        distinguishing_aspect: "Creating a two-option CLASS_A order derives required_station_hours 59.23 (51.50 * 1.00 * 1.15 = 59.225, rounded half up once), config_weight_lbs 22675 and option_price_total_cents 630500 while provisional_invoice_cents stays 0 because pricing only happens at submit."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "FloorPlan FP-3410 of the CANON kit, options OPT-AC2 (2.50 h, 95 lbs, 16 A, 385000) and OPT-WASH (3.00 h, 180 lbs, 12 A, 245500), Dealer D-CANON."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-AC2", category: "ELECTRICAL", install_station: "ROOF_SET", price_cents: 385000, weight_lbs: 95, added_station_hours: 2.50, amp_draw: 16, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_ac2_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-WASH", category: "APPLIANCE", install_station: "APPLIANCE_INSTALL", price_cents: 245500, weight_lbs: 180, added_station_hours: 3.00, amp_draw: 12, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_wash_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-CANON", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
          trigger:
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_ac2_id}", "${opt_wash_id}"], requested_delivery_date: "2026-10-01T00:00:00Z", customer_reference: "WALK-IN" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "response status == 201"
            - "UnitOrder.${ord_id}.option_price_total_cents == 630500"
            - "UnitOrder.${ord_id}.config_weight_lbs == 22675 and payload_remaining_lbs == 3325"
            - "UnitOrder.${ord_id}.total_amp_draw == 28 and total_water_demand_gal == 0"
            - "UnitOrder.${ord_id}.required_station_hours == 59.23"
            - "UnitOrder.${ord_id}.status == DRAFT and financing_status == NOT_FINANCED"
            - "UnitOrder.${ord_id}.provisional_invoice_cents == 0 and final_invoice_cents == null"
            - "UnitOrder.${ord_id}.locked_floor_plan_version == null and locked_option_versions == []"
            - "UnitOrder.${ord_id}.ship_hold_reason == NONE and version == 1"

      - name: warranty_claim_dealer_id_is_header_derived_and_body_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints["POST /warranty-claims"]
          - entities.WarrantyClaim.fields.dealer_id
          - entities.WarrantyClaim.fields.in_warranty
          - calculations.warranty_claim_reimbursement
          - endpoints["POST /_inject/delivered-unit"]
        distinguishing_aspect: "A claim posted by dealer D-A while carrying dealer_id of dealer D-B in the body is stored with dealer_id == D-A: the body key is not a declared input and is discarded rather than honoured or rejected."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "FloorPlan FP-TOW, dealers D-A and D-B, and one delivered unit injected for D-A with shipped_at defaulted to the clock, so in_warranty is true."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-A", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-B", region: "EAST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_b_id: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a_id}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { build_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_id}", claim_type: "APPLIANCE", labor_hours: 3.50, parts_cost_cents: 68000, narrative: "Refrigerator will not hold temperature", dealer_id: "${dlr_b_id}" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { clm_id: $.data.id }
          assert:
            - "response status == 201"
            - "WarrantyClaim.${clm_id}.dealer_id == ${dlr_a_id} (the X-User-ID), never ${dlr_b_id}"
            - "WarrantyClaim.${clm_id}.in_warranty == true"
            - "WarrantyClaim.${clm_id}.labor_reimbursement_cents == 27300 and parts_reimbursement_cents == 78200"
            - "WarrantyClaim.${clm_id}.authority_tier == TIER_A (105500 <= 150000)"
            - "WarrantyClaim.${clm_id}.goodwill_authorized_cents == 0 and supplier_chargeback_cents == 0 and total_reimbursement_cents == 0 before any decision"
            - "WarrantyClaim.${clm_id}.status == SUBMITTED and info_request_count == 0 and resubmission_count == 0"
            - "GET /warranty-claims?dealer_id=${dlr_b_id} returns total_count 0"

      - name: unit_order_listing_filters_by_dealer_and_paginates
        claim_type: listing
        grounds:
          - endpoints["GET /unit-orders"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two orders for D-A and one for D-B, GET /unit-orders?dealer_id=D-A&limit=1&offset=0 returns one row with total_count 2 and has_more true, and offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "FloorPlan FP-TOW, option OPT-E1, dealers D-A and D-B; two DRAFT orders for D-A created in that order and one for D-B."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-E1", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_e1_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-A", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-B", region: "EAST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_b_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_a_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { ord_a1_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_a_id}", floor_plan_id: "${fp_id}", order_type: "SOLD", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-02T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { ord_a2_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_b_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-03T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_b_id}"
              captures: { ord_b1_id: $.data.id }
          trigger:
            - call: "GET /unit-orders?dealer_id=${dlr_a_id}&limit=1&offset=0"
              payload: {}
              as: PlantAdmin
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /unit-orders?dealer_id=${dlr_a_id}&limit=1&offset=1"
              payload: {}
              as: PlantAdmin
              captures: { page2_first_id: "$.data[0].id" }
            - call: "GET /unit-orders?order_type=SOLD"
              payload: {}
              as: PlantAdmin
          assert:
            - "the first trigger call returns total_count 2, has_more true, limit 1, offset 0 and exactly one row"
            - "page1_first_id == ${ord_a1_id} (creation order)"
            - "the second trigger call returns total_count 2, has_more false and page2_first_id == ${ord_a2_id}"
            - "the third trigger call returns total_count 1 with the single row ${ord_a2_id}"
            - "GET /unit-orders with no filter returns total_count 3, limit 10 and offset 0 by default"
            - "no row of any page has dealer_id == ${dlr_b_id} in the first two trigger calls"

      - name: reference_data_path_and_body_ids_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_SUPPLIER_NOT_FOUND
          - errors.ERR_FLOOR_PLAN_NOT_FOUND
          - errors.ERR_OPTION_ITEM_NOT_FOUND
          - errors.ERR_DEALER_NOT_FOUND
          - errors.ERR_PRODUCTION_LINE_NOT_FOUND
          - errors.ERR_TEST_BOOTH_NOT_FOUND
          - validations[priority 4].ERR_UNIT_ORDER_NOT_FOUND
          - validations[priority 5].ERR_FLOOR_PLAN_NOT_FOUND
        distinguishing_aspect: "Each reference-data endpoint answers an unknown id with its own 404 code rather than a generic one, and POST /chassis-receipts reports ERR_SUPPLIER_NOT_FOUND for an unknown body foreign key."
        test_recipe:
          setup:
            - "Empty database except the clock move; no supplier, floor plan, option, dealer, line or booth exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantAdmin
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "GET /suppliers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlantAdmin
              captures: { e_sup: $.data.error_id }
            - call: "GET /floor-plans/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlantAdmin
              captures: { e_fp: $.data.error_id }
            - call: "GET /option-items/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlantAdmin
              captures: { e_opt: $.data.error_id }
            - call: "POST /dealers/00000000-0000-4000-8000-000000000004/status"
              payload: { status: "SUSPENDED" }
              as: PlantAdmin
              captures: { e_dlr: $.data.error_id }
            - call: "GET /production-lines/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlantAdmin
              captures: { e_line: $.data.error_id }
            - call: "GET /test-booths/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlantAdmin
              captures: { e_booth: $.data.error_id }
            - call: "POST /chassis-receipts"
              payload: { supplier_id: "00000000-0000-4000-8000-000000000007", chassis_serial: "CH-ORPHAN", chassis_class: "TOWABLE", gvwr_lbs: 9000, wheelbase_in: 180 }
              as: PlantAdmin
              captures: { e_body_sup: $.data.error_id }
          assert:
            - "e_sup == ERR_SUPPLIER_NOT_FOUND with status 404"
            - "e_fp == ERR_FLOOR_PLAN_NOT_FOUND with status 404"
            - "e_opt == ERR_OPTION_ITEM_NOT_FOUND with status 404"
            - "e_dlr == ERR_DEALER_NOT_FOUND with status 404"
            - "e_line == ERR_PRODUCTION_LINE_NOT_FOUND with status 404"
            - "e_booth == ERR_TEST_BOOTH_NOT_FOUND with status 404"
            - "e_body_sup == ERR_SUPPLIER_NOT_FOUND with status 404 and no ChassisReceipt row is created"
            - "every error response has response_type == error and a non-empty data.message"

      - name: order_and_supply_path_ids_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_UNIT_ORDER_NOT_FOUND
          - errors.ERR_PRODUCTION_SLOT_NOT_FOUND
          - errors.ERR_CHASSIS_RECEIPT_NOT_FOUND
          - errors.ERR_COMPONENT_LOT_NOT_FOUND
          - errors.ERR_UNIT_BUILD_NOT_FOUND
          - validations[priority 4].ERR_UNIT_ORDER_NOT_FOUND
        distinguishing_aspect: "The order, slot, chassis, lot and build reads each answer an unknown id with their own 404 code, and POST /component-installations reports ERR_UNIT_BUILD_NOT_FOUND because unit_build_id precedes component_lot_id in the endpoint's declared input order."
        test_recipe:
          setup:
            - "Empty database except the clock move."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantAdmin
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "GET /unit-orders/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: ProductionScheduler
              captures: { e_ord: $.data.error_id }
            - call: "GET /production-slots/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: ProductionScheduler
              captures: { e_slot: $.data.error_id }
            - call: "GET /chassis-receipts/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: ProductionScheduler
              captures: { e_ch: $.data.error_id }
            - call: "GET /component-lots/00000000-0000-4000-8000-000000000014"
              payload: {}
              as: PlantAdmin
              captures: { e_lot: $.data.error_id }
            - call: "GET /unit-builds/00000000-0000-4000-8000-000000000015"
              payload: {}
              as: LineSupervisor
              captures: { e_build: $.data.error_id }
            - call: "POST /component-installations"
              payload: { unit_build_id: "00000000-0000-4000-8000-000000000016", component_lot_id: "00000000-0000-4000-8000-000000000017", station: "APPLIANCE_INSTALL", quantity: 1 }
              as: LineSupervisor
              captures: { e_body: $.data.error_id }
          assert:
            - "e_ord == ERR_UNIT_ORDER_NOT_FOUND with status 404"
            - "e_slot == ERR_PRODUCTION_SLOT_NOT_FOUND with status 404"
            - "e_ch == ERR_CHASSIS_RECEIPT_NOT_FOUND with status 404"
            - "e_lot == ERR_COMPONENT_LOT_NOT_FOUND with status 404"
            - "e_build == ERR_UNIT_BUILD_NOT_FOUND with status 404"
            - "e_body == ERR_UNIT_BUILD_NOT_FOUND (not ERR_COMPONENT_LOT_NOT_FOUND) and no ComponentInstallation row is created"

      - name: quality_warranty_and_recall_path_ids_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_COMPONENT_INSTALLATION_NOT_FOUND
          - errors.ERR_QUALITY_INSPECTION_NOT_FOUND
          - errors.ERR_WARRANTY_CLAIM_NOT_FOUND
          - errors.ERR_RECALL_CAMPAIGN_NOT_FOUND
          - validations[priority 4].ERR_UNIT_ORDER_NOT_FOUND
        distinguishing_aspect: "Existence is checked before state and role scope on the downstream workflows: completing an unknown inspection, paying an unknown claim and opening an unknown campaign all return their entity's 404 code rather than 409 or 403."
        test_recipe:
          setup:
            - "Empty database except the clock move."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantAdmin
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "GET /component-installations/00000000-0000-4000-8000-000000000021"
              payload: {}
              as: PlantAdmin
              captures: { e_inst: $.data.error_id }
            - call: "POST /quality-inspections/00000000-0000-4000-8000-000000000022/complete"
              payload: { defect_points: 0, leak_detected: false }
              as: QualityInspector
              captures: { e_insp: $.data.error_id }
            - call: "GET /warranty-claims/00000000-0000-4000-8000-000000000023"
              payload: {}
              as: WarrantyAdministrator
              captures: { e_clm: $.data.error_id }
            - call: "POST /warranty-claims/00000000-0000-4000-8000-000000000024/pay"
              payload: {}
              as: WarrantyAdministrator
