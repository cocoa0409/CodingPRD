# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3026_pick_brick_wall_build_minifigure_bulk_retail
#
# Breadth probe over the claim-extraction guide's nine sections. Every claim
# the §1.1–§1.7 surface declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not
# already exercise. Corners already covered by §1.8 appear as excluded_because
# stubs with no test_recipe.
#
# Fixture conventions match §1.8: logical clock default 2026-09-01T00:00:00Z,
# fixture stores use wall_bin_capacity_grams 1000 or 2000, and EMPTY_BACKFILL_PCT
# is 0.10 so an emptied 1000 g bin auto-backfills by 100 g.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: store_creation_returns_derived_fields_and_starts_trading
        claim_type: Creation
        grounds: ["entities.Store", "endpoints.POST_/stores"]
        distinguishing_aspect: "A store opened with only the four required fields comes back 201 with stage TRADING, version 1, and the computed engine mass, shrinkage and epoch fields initialised to zero rather than client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0201", display_name: "Brick Yard One", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st201: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${st201}.stage == TRADING and Store.${st201}.version == 1"
            - "Store.${st201}.bin_engine_mass_grams == 0 and Store.${st201}.shrinkage_basis_points == 0"
            - "Store.${st201}.last_event_run_index == 0"
            - "the response carries non-null id, created_at and updated_at"

      - name: member_creation_applies_tier_and_balance_defaults
        claim_type: Defaults
        grounds: ["entities.Member", "endpoints.POST_/stores/members"]
        distinguishing_aspect: "A member created with three input fields only is stamped STANDARD with zero points and zero passes, and a client-supplied tier is not honoured on this endpoint."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0202 exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0202", display_name: "Brick Yard Two", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st202: $.data.id }
          trigger:
            - call: "POST /stores/members"
              payload: { email: "m_default@example.com", display_name: "Default Member", home_store_id: "${st202}" }
              as: PlatformAdmin
              captures: { mem_def: $.data.id }
          assert:
            - "Member.${mem_def}.tier == STANDARD"
            - "Member.${mem_def}.stage == ACTIVE"
            - "Member.${mem_def}.points_balance == 0 and Member.${mem_def}.passed_mb_reservations == 0"
            - "Member.${mem_def}.version == 1"

      - name: wall_bin_creation_derives_status_from_declared_mass
        claim_type: Computed Fields
        grounds: ["entities.WallBin.fields.status", "entities.WallBin.fields.fill_pct", "endpoints.POST_/stores/wall-bins"]
        distinguishing_aspect: "The bin status is never client-supplied: declaring 1000 g on a 1000 g capacity yields OPEN at 100.0 percent while declaring 400 g yields LOW at 40.0 percent."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0203 with one element."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0203", display_name: "Brick Yard Three", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st203: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "4001", element_name: "Brick 2x2", theme: "Town", unit_mass_grams: 1.8, cost_basis_cents: 5, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el4001: $.data.id }
          trigger:
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st203}", element_id: "${el4001}", bin_label: "A01", bin_capacity_grams: 1000, bin_mass_grams: 1000 }
              as: StoreAssociate
              captures: { bin_full: $.data.id, bin_full_status: $.data.status, bin_full_pct: $.data.fill_pct }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st203}", element_id: "${el4001}", bin_label: "A02", bin_capacity_grams: 1000, bin_mass_grams: 400 }
              as: StoreAssociate
              captures: { bin_low: $.data.id, bin_low_status: $.data.status }
          assert:
            - "the full bin returns status OPEN and fill_pct 100.0"
            - "the 400 g bin returns status LOW and fill_pct 40.0"
            - "WallBin.${bin_low}.depletion_rate_pct_per_day == 0"

      - name: wall_bin_creation_requires_an_existing_store
        claim_type: Parent Relationships
        grounds: ["entities.WallBin.fields.store_id", "validations[priority=3]"]
        distinguishing_aspect: "A bin posted against a well-formed but non-existent store id is rejected at the existence rung before the element is ever resolved, so the reported error is the not-found error rather than the element error."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0204 and element 4002 exist; the rejected call names a foreign store id."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0204", display_name: "Brick Yard Four", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st204: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "4002", element_name: "Plate 1x4", theme: "Icons", unit_mass_grams: 1.2, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el4002: $.data.id }
          trigger:
            - call: "POST /stores/wall-bins"
              payload: { store_id: "00000000-0000-4000-8000-000000000000", element_id: "${el4002}", bin_label: "B01", bin_capacity_grams: 1000, bin_mass_grams: 500 }
              as: StoreAssociate
              captures: { bin_err: $.data.error_id }
          assert:
            - "the rejected call returns error_id == ERR_NOT_FOUND"
            - "GET /stores/wall-bins with store_id ${st204} returns an empty array"

      - name: element_listing_paginates_with_total_count
        claim_type: Listing
        grounds: ["endpoints.GET_/stores/elements", "response_envelope.pagination_fields"]
        distinguishing_aspect: "The element list honours limit and offset and reports total_count and has_more against the full filtered set rather than the returned page."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Three elements registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/elements"
              payload: { element_code: "4101", element_name: "Brick 1x1", theme: "Town", unit_mass_grams: 0.4, cost_basis_cents: 3, make_ready_lead_days: 5 }
              as: PlatformAdmin
            - call: "POST /stores/elements"
              payload: { element_code: "4102", element_name: "Brick 1x2", theme: "Town", unit_mass_grams: 0.7, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
            - call: "POST /stores/elements"
              payload: { element_code: "4103", element_name: "Brick 1x3", theme: "Icons", unit_mass_grams: 1.0, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
          trigger:
            - call: "GET /stores/elements"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { page_first: "$.data[0].id" }
          assert:
            - "the page returns 2 elements and total_count 3 with has_more true"
            - "the first element of the page is ${page_first}"
            - "GET /stores/elements?limit=2&offset=2 returns 1 element and has_more false"

      - name: missing_element_required_field_is_rejected
        claim_type: Required Fields
        grounds: ["entities.Element.fields.unit_mass_grams", "validations[priority=1]"]
        distinguishing_aspect: "Registering an element without cost_basis_cents is rejected before the element_code uniqueness or theme checks are reached, proving required-field enforcement runs at the auth rung rather than at the business rung."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/elements"
              payload: { element_code: "4201", element_name: "Brick 2x2", theme: "Town", unit_mass_grams: 1.8 }
              as: PlatformAdmin
              captures: { el_missing_err: $.data.error_id }
          assert:
            - "the rejected call returns an error envelope and no element is created"
            - "GET /stores/elements?theme=Town returns total_count 0"

      - name: element_not_found_on_read
        claim_type: Not Found
        grounds: ["endpoints.GET_/stores/elements/{id}", "validations[priority=3]"]
        distinguishing_aspect: "Reading an element by a syntactically valid but unregistered id returns the not-found error rather than an empty object."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /stores/elements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { el_nf_err: $.data.error_id }
          assert:
            - "the read returns error_id == ERR_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present on the error envelope"

      - name: element_status_enum_rejects_an_unknown_value
        claim_type: Type Constraints
        grounds: ["entities.Element.fields.status", "entities.Element.fields.sourcing_mode"]
        distinguishing_aspect: "A new element is stamped PENDING_CATALOG and CURRENT_PRODUCTION, and the status filter on the list endpoint accepts only declared enum members."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/elements"
              payload: { element_code: "4301", element_name: "Tile 2x2", theme: "Town", unit_mass_grams: 1.0, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el4301: $.data.id, el4301_status: $.data.status, el4301_mode: $.data.sourcing_mode }
          assert:
            - "the new element returns status PENDING_CATALOG and sourcing_mode CURRENT_PRODUCTION"
            - "Element.${el4301}.version == 1"

      - name: fusion_allocation_is_immutable
        claim_type: Immutability
        grounds: ["entities.FusionAllocation", "endpoints.GET_/stores/fusion-orders/{id}/allocations"]
        distinguishing_aspect: "FusionAllocation carries no version and no update endpoint, so a recorded draw can only be changed by voiding the whole order and re-drawing."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0205 with element 4401, one member, one bin holding 1000 g, and one open order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0205", display_name: "Brick Yard Five", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st205: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "4401", element_name: "Brick 2x4", theme: "Town", unit_mass_grams: 2.5, cost_basis_cents: 6, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el4401: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_imm@example.com", display_name: "Immutable Member", home_store_id: "${st205}" }
              as: PlatformAdmin
              captures: { mem_imm: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st205}", element_id: "${el4401}", bin_label: "C01", bin_capacity_grams: 1000, bin_mass_grams: 1000 }
              as: StoreAssociate
              captures: { bin_c01: $.data.id }
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${st205}", member_id: "${mem_imm}", cup_size: "LARGE", pricing_model: "CUP_FILL", declared_mass_grams: 400 }
              as: StoreAssociate
              captures: { ord_imm: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders/{id}/allocations"
              payload: { wall_bin_id: "${bin_c01}", allocation_grams: 400 }
              as: StoreAssociate
          assert:
            - "GET /stores/fusion-orders/${ord_imm}/allocations returns exactly 1 row with allocation_grams 400"
            - "the allocation row exposes fusion_order_id, wall_bin_id and allocation_grams and no version field"
            - "WallBin.${bin_c01}.bin_mass_grams == 600"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: fusion_order_starts_pending_and_inspection_starts_scheduled
        claim_type: Initial State
        grounds: ["state_machines.FusionOrder.initial_state", "state_machines.ExitInspection.initial_state"]
        distinguishing_aspect: "An order is born PENDING with zero priced fields and its inspection is born SCHEDULED with zero variance, so neither initial state is client-selectable."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0206 with element 4501, one member and one bin holding 1000 g."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0206", display_name: "Brick Yard Six", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st206: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "4501", element_name: "Brick 2x6", theme: "Town", unit_mass_grams: 3.0, cost_basis_cents: 7, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el4501: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_init@example.com", display_name: "Init Member", home_store_id: "${st206}" }
              as: PlatformAdmin
              captures: { mem_init: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st206}", element_id: "${el4501}", bin_label: "D01", bin_capacity_grams: 1000, bin_mass_grams: 1000 }
              as: StoreAssociate
              captures: { bin_d01: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${st206}", member_id: "${mem_init}", cup_size: "JUMBO", pricing_model: "CUP_FILL", declared_mass_grams: 300 }
              as: StoreAssociate
              captures: { ord_init: $.data.id, ord_init_v: $.data.version }
            - call: "POST /stores/exit-inspections"
              payload: { fusion_order_id: "${ord_init}", outcome: "CLEAR", checklist_result: "COMPLETED", reviewed_by_user_id: "assoc-77", expected_fusion_order_version: "${ord_init_v}" }
              as: StoreAssociate
              captures: { insp_init: $.data.id, insp_stage: $.data.stage }
          assert:
            - "FusionOrder.${ord_init}.status == PENDING before the inspection"
            - "FusionOrder.${ord_init}.base_price_cents == 0 and FusionOrder.${ord_init}.final_price_cents == 0"
            - "the inspection returns stage COMPLETED and ExitInspection.${insp_init}.variance_bps == 0"

      - name: sealing_twice_is_rejected_and_leaves_the_first_seal_intact
        claim_type: Idempotency
        grounds: ["state_machines.MinifigureBuild.BUILDING_to_SEALED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second seal on an already SEALED build is refused with the invalid-state error, the platform generation does not advance, and the first seal's points award is not repeated."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0207 with two component elements, one member, two bins holding 1000 g each, and one build carrying torso and head only."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0207", display_name: "Brick Yard Seven", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st207: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "4601", element_name: "Torso Plain", theme: "Town", unit_mass_grams: 2.0, cost_basis_cents: 20, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el_torso: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "4602", element_name: "Head Smile", theme: "Town", unit_mass_grams: 1.0, cost_basis_cents: 10, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el_head: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_seal@example.com", display_name: "Seal Member", home_store_id: "${st207}" }
              as: PlatformAdmin
              captures: { mem_seal: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st207}", element_id: "${el_torso}", bin_label: "E01", bin_capacity_grams: 1000, bin_mass_grams: 1000 }
              as: StoreAssociate
              captures: { bin_e01: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st207}", element_id: "${el_head}", bin_label: "E02", bin_capacity_grams: 1000, bin_mass_grams: 1000 }
              as: StoreAssociate
              captures: { bin_e02: $.data.id }
            - call: "POST /stores/minifigure-builds"
              payload: { store_id: "${st207}", member_id: "${mem_seal}" }
              as: StoreAssociate
              captures: { build_seal: $.data.id }
            - call: "POST /stores/minifigure-builds/{id}/components"
              payload: { torso_element_id: "${el_torso}", head_element_id: "${el_head}" }
              as: Member
              as_user_id: "${mem_seal}"
              captures: { build_seal_v1: $.data.version }
          trigger:
            - call: "POST /stores/minifigure-builds/{id}/seal"
              payload: { expected_build_version: "${build_seal_v1}" }
              as: Member
              as_user_id: "${mem_seal}"
              captures: { seal_status: $.data.status, seal_v2: $.data.version }
            - call: "POST /stores/minifigure-builds/{id}/seal"
              payload: { expected_build_version: "${seal_v2}" }
              as: Member
              as_user_id: "${mem_seal}"
              captures: { seal_err: $.data.error_id }
          assert:
            - "the first seal returns status SEALED"
            - "the second seal returns error_id == ERR_INVALID_STATE"
            - "MinifigureBuild.${build_seal}.platform_gen == 1 and MinifigureBuild.${build_seal}.status == SEALED"

      - name: a_returned_build_is_terminal_and_refuses_further_mutations
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.MinifigureBuild.terminal_states", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETURNED is a terminal build state, so both a component write and a seal against it are refused rather than silently ignored."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0208 with one component element, one member, one bin holding 1000 g, and one build whose single component is missing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0208", display_name: "Brick Yard Eight", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st208: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "4701", element_name: "Legs Blue", theme: "Town", unit_mass_grams: 1.2, cost_basis_cents: 12, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el_legs: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_ret@example.com", display_name: "Return Member", home_store_id: "${st208}" }
              as: PlatformAdmin
              captures: { mem_ret: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st208}", element_id: "${el_legs}", bin_label: "F01", bin_capacity_grams: 1000, bin_mass_grams: 1000 }
              as: StoreAssociate
              captures: { bin_f01: $.data.id }
            - call: "POST /stores/minifigure-builds"
              payload: { store_id: "${st208}", member_id: "${mem_ret}" }
              as: StoreAssociate
              captures: { build_ret: $.data.id, build_ret_v1: $.data.version }
          trigger:
            - call: "POST /stores/minifigure-builds/{id}/seal"
              payload: { expected_build_version: "${build_ret_v1}" }
              as: Member
              as_user_id: "${mem_ret}"
              captures: { ret_seal_err: $.data.error_id }
          assert:
            - "the seal is refused with error_id == ERR_COMPONENTS_INCOMPLETE"
            - "MinifigureBuild.${build_ret}.components_missing == 4"
            - "MinifigureBuild.${build_ret}.status == BUILDING"

      - name: check_in_outside_the_event_window_is_refused
        claim_type: Precondition Enforcement
        grounds: ["state_machines.MiniBuildReservation.REGISTERED_to_PASSED", "errors[ERR_EVENT_WINDOW_CLOSED]"]
        distinguishing_aspect: "The check-in edge requires the hosting event to be OPEN, so the same call is refused with the event-window error when the slot is still SCHEDULED one day before its start."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0209 with a slot on 2026-09-02 and one REGISTERED reservation on it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0209", display_name: "Brick Yard Nine", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st209: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_win@example.com", display_name: "Window Member", home_store_id: "${st209}" }
              as: PlatformAdmin
              captures: { mem_win: $.data.id }
            - call: "POST /stores/store-events"
