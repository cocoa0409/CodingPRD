            - "GET /drinkware/customization-orders/${c_order} returns 200 with the identical axis values (immediate read-after-write)"

      - name: warranty_credit_equivalent_when_line_discontinued
        claim_type: Side Effect Execution
        grounds:
          - state_machines.WarrantyClaim.FILED_to_APPROVED_REPLACEMENT
          - entities.WarrantyClaim.fields.credit_equivalent_cents
        distinguishing_aspect: "The replacement policy degrades deterministically: with no customized order and the product line DISCONTINUED, APPROVE_REPLACEMENT resolves CREDIT_EQUIVALENT at exactly the line's map_price_cents (3499c) instead of reserving any unit."
        test_recipe:
          setup:
            - "Clock set; canonical line discontinued; DTC claim (LID, purchase 2026-06-01, inside the 24-month window) on file."
          setup_api_calls:
            - *c_clock
            - *c_line
            - call: "POST /drinkware/product-lines/${c_line}/discontinue"
              payload: {}
              as: PlatformAdmin
