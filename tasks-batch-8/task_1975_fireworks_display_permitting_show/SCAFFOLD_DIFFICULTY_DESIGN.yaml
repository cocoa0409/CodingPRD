            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
