        grounds:
          - calculations.fefo_allocation
          - entities.Lot.fields.status
          - errors[ERR_INSUFFICIENT_COMPONENT_LOTS]
        distinguishing_aspect: |
          ProductionRun x Lot pair: a GIFT_ASSEMBLY run's completion is gated by the
          status of the component Lots (BLOCKED lots are excluded from the FEFO pool), a
          different entity pair than ProductionRun x ProductionLine.
        test_recipe:
          setup:
            - "BASE window; gift set GS needs 13 units of component CX per set; the only CX lot (130 units) is BLOCKED by an OPEN bloom hold"
            - "GIFT_ASSEMBLY run planned 10 sets is IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "CX", name: "Component X", product_type: "STANDARD", brand: "OWN", base_price_cents: 300, unit_weight_grams: 50, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { cx: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "GS", name: "Gift Set", product_type: "GIFT_SET", brand: "OWN", base_price_cents: 5000, unit_weight_grams: 700, shelf_life_days: 120, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { gs: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${cx}", name: "CX mass", shape_code: "BAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rcx: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${gs}", name: "GS assembly", shape_code: "BAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 1.0 }
              as: ProductionPlanner
              captures: { rgs: $.data.id }
            - call: "POST /gift-components"
              payload: { gift_product_id: "${gs}", component_product_id: "${cx}", qty_per_set: 13 }
              as: ProductionPlanner
            - call: "POST /molds"
              payload: { shape_code: "BAR", cavity_count: 36 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_id}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${cx}", recipe_id: "${rcx}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 130, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_cx: $.data.id }
            - call: "POST /production-runs/${run_cx}/start"
              payload: {}
              as: LineOperator
            - call: "POST /production-runs/${run_cx}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 130 }
              as: LineOperator
              captures: { lot_cx: $.data.created_lot_id }
            - call: "POST /quality-holds"
              payload: { lot_id: "${lot_cx}", defect_type: "BLOOM", affected_units: 5 }
              as: QualityManager
              captures: { hold_id: $.data.id }
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v2: $.data.version }
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${gs}", recipe_id: "${rgs}", line_id: "${line_id}", run_type: "GIFT_ASSEMBLY", planned_units: 10, scheduled_start: "2026-09-07T08:00:00Z", scheduled_end: "2026-09-07T16:00:00Z", expected_window_version: "${win_v2}" }
              as: ProductionPlanner
              captures: { run_g: $.data.id }
            - call: "POST /production-runs/${run_g}/start"
              payload: {}
              as: LineOperator
          trigger:
            - call: "POST /production-runs/${run_g}/complete"
              payload: { actual_cook_temp_c: 85, actual_temper_exit_c: 29, output_units: 10 }
              as: LineOperator
              captures: { err: $.data.error_id }
            - call: "GET /production-runs/${run_g}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "error_id == ERR_INSUFFICIENT_COMPONENT_LOTS with HTTP 422 (FEFO pool excludes the BLOCKED lot, so 0 of the 130 required units are eligible)"
            - "ProductionRun.${run_g}.status remains IN_PROGRESS"
            - "ProductionRun.${run_g}.created_lot_id is null (no gift lot created)"
            - "Lot.${lot_cx}.qty_on_hand == 130 (no partial deduction on failure)"

  # ==================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_runs_half_open_adjacency
        grounds:
          - validations[priority=6]
          - entities.ProductionRun.fields.scheduled_start
          - errors[ERR_LINE_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          ProductionLine resource with half-open [start, end) semantics: a run starting
          exactly when another ends is allowed (adjacent), while a one-hour-overlapping
          run conflicts.
        test_recipe:
          setup:
            - "BASE window PUBLISHED; LINE-1 free; run A occupies 2026-09-05T08:00-12:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_a: $.data.id }
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v2: $.data.version }
          trigger:
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 100, scheduled_start: "2026-09-05T12:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v2}" }
              as: ProductionPlanner
              captures: { run_b: $.data.id }
            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v3: $.data.version }
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 100, scheduled_start: "2026-09-05T11:00:00Z", scheduled_end: "2026-09-05T13:00:00Z", expected_window_version: "${win_v3}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "run B (12:00 start == run A 12:00 end) is created with 201 and status PLANNED (half-open adjacency allowed)"
            - "run C (11:00-13:00) rejected: error_id == ERR_LINE_SCHEDULE_CONFLICT with HTTP 409"
            - "GET /production-runs?line_id=${line_id} returns exactly 2 runs"

      - name: window_ship_intervals_closed_overlap
        grounds:
          - validations[priority=6]
          - entities.SeasonalWindow.fields.ship_start
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          SeasonalWindow resource with closed-interval semantics (different from the
          line's half-open runs): a second HOLIDAY window whose ship_start touches the
          first window's ship_end counts as overlap and is rejected.
        test_recipe:
          setup:
            - "Existing HOLIDAY window W1 with ship period 2026-11-01..2026-12-26"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 10000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-10-01T00:00:00Z", build_end: "2026-10-31T00:00:00Z", ship_start: "2026-12-26T00:00:00Z", ship_end: "2027-01-10T00:00:00Z", target_units: 2000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-10-01T00:00:00Z", build_end: "2026-10-31T00:00:00Z", ship_start: "2026-12-27T00:00:00Z", ship_end: "2027-01-10T00:00:00Z", target_units: 2000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { w3: $.data.id }
          assert:
            - "W2 (ship_start 2026-12-26 == W1.ship_end) rejected: error_id == ERR_WINDOW_OVERLAP with HTTP 409 (closed interval: touching counts)"
            - "W3 (ship_start 2026-12-27, one day clear) created with 201 and status DRAFT"
            - "GET /seasonal-windows?season_code=HOLIDAY returns exactly 2 windows"

  # ==================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==================================================================
  - rule_id: compensating_invariant
    instances:
      - name: packaging_reserve_cancel_conservation
        grounds:
          - calculations.packaging_requirement
          - entities.PackagingComponent.fields.qty_reserved
          - state_machines.ProductionRun.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is packaging availability: reserve (run create) paired with
          release (run cancel) leaves qty_on_hand - qty_reserved == 1000 and qty_on_hand
          itself untouched by the pair.
        test_recipe:
          setup:
            - "Packaging component with qty_on_hand 1000, units_per_component 10"
            - "BASE window PUBLISHED; line exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
          trigger:
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 5000, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "GET /packaging-components"
              payload: {}
              as: ProductionPlanner
              captures: { res_after_create: "$.data[0].qty_reserved", avail_after_create: "$.data[0].qty_available" }
            - call: "POST /production-runs/${run_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - call: "GET /packaging-components"
              payload: {}
              as: ProductionPlanner
              captures: { onhand_after_cancel: "$.data[0].qty_on_hand", res_after_cancel: "$.data[0].qty_reserved", avail_after_cancel: "$.data[0].qty_available" }
          assert:
            - "after create: qty_reserved == 500 (ceil(5000/10)) and qty_available == 500"
            - "after cancel: qty_reserved == 0 and qty_available == 1000"
            - "qty_on_hand == 1000 throughout the reserve/cancel pair (never consumed)"
            - "invariant qty_on_hand - qty_reserved == 1000 holds again after the compensating cancel"

      - name: rework_reserve_cancel_unit_conservation
        grounds:
          - state_machines.ProductionRun.PLANNED_to_CANCELLED
          - entities.Lot.fields.qty_reserved_rework
        distinguishing_aspect: |
          Conserved quantity is source-lot units: rework earmark (run create) paired with
          its release (run cancel) leaves qty_on_hand + qty_reserved_rework == 1000 — a
          different conserved quantity than packaging availability.
