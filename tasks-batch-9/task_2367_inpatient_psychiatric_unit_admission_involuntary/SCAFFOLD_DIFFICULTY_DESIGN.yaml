            - "One RIGHTS_ADVOCATE clinician exists; booked_docket_minutes starts at 0."
            - "Hearing H1 for petition 1 is SCHEDULED on Friday 2026-09-04 from 10:00:00Z for 60 minutes, so it ends 11:00:00Z."
