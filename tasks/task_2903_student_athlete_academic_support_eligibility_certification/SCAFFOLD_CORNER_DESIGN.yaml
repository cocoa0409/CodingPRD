          trigger:
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s37_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s37_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
          assert:
            - "The response is HTTP 201 with data.status == DRAFT, data.decided_by_user_id null and data.decided_at null"
            - "data.requested_by_user_id == co_requester and data.credit_relief_applied == 0.00"
            - "data.audit_variant == CATALOG_AT_ENTRY, data.degree_applicable_credits_counted == 0.00, data.progress_pct == 0.0000 and data.required_progress_pct == 0.0000"
            - "data.benchmark_result == FAIL with data.failure_reasons == [GPA_BELOW_MINIMUM] because 0.00 < PROVISIONAL_MIN_GPA 1.8"
            - "StudentAthlete.${s37_id}.eligibility_state == NOT_CERTIFIED - creation alone changes no student state"

      - name: terminated_tutor_admits_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Tutor.transitions.SUSPENDED_to_TERMINATED
          - state_machines.Tutor.transitions.SUSPENDED_to_TRAINED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "TERMINATED is Tutor's only terminal state, so REINSTATE on a TERMINATED tutor returns 409 ERR_INVALID_STATE_TRANSITION even though REINSTATE is a declared action from SUSPENDED."
