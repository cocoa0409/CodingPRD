scenario: |
  Engine Aftermarket Service Agreements with Flight-Hour Pricing (GE Aerospace): long-term service agreements pricing maintenance per engine flight hour with escalation and utilization assumptions, shop visit forecasting based on cycles, environment severity and operator route structure, workscope determination at each shop visit balancing cost against remaining life until the next planned removal, parts sourcing across new, repaired and used serviceable material with approval by contract terms, spare engine leasing to cover aircraft on ground during shop visits, contract accounting where revenue and cost recognition depend on lifetime visit projections, operator fleet mix changes and contract renegotiation, engineering directives, service bulletins and airworthiness compliance incorporated into workscopes

domain_name: engine-aftermarket-service-agreements
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Airline / operator legal name"
      - name: iata_code
        type: string
        source: input
        description: "Two-letter IATA designator; unique"
        constraints: "unique across Operators; 2 uppercase letters"
      - name: credit_rating
        type: enum
        source: input
        description: "Credit grade driving spare-lease deposit waiver"
        constraints: "one of {A, B, C}; A waives the lease deposit"

  - name: Engine
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; owning airline"
      - name: esn
        type: string
        source: input
        description: "Engine serial number; unique"
        constraints: "unique across Engines"
      - name: engine_model
        type: string
        source: input
        description: "Engine model designation (e.g. CFM56-7B); drives Directive applicability and spare-engine model match"
      - name: base_severity_tier
        type: enum
        source: input
        description: "Environment severity of the engine's home operation; feeds visit cost projection"
        constraints: "one of {BENIGN, MODERATE, HARSH}"
      - name: cumulative_flight_hours
        type: number
        source: system
        description: "Lifetime flight hours; incremented by verified FlightHourReports"
        default: 0
      - name: cumulative_cycles
        type: integer
        source: system
        description: "Lifetime cycles; incremented by verified FlightHourReports"
        default: 0
      - name: llp_remaining_cycles
        type: integer
        source: input
        description: "Minimum remaining cycles across life-limited parts; consumed by verified reports and restored by shop-visit completion"
        constraints: "integer >= 0"
      - name: agreement_id
        type: string
        source: system
        description: "FK -> ServiceAgreement.id; null until enrolled; set by the enroll endpoint and permanent thereafter"
        default: null
      - name: assumed_annual_hours
        type: number
        source: input
        description: "Utilization assumption captured at enrollment; basis of the utilization ratio"
        constraints: "> 0; required at enrollment"
      - name: assumed_cycles_per_month
        type: integer
        source: input
        description: "Assumed cycle consumption rate captured at enrollment; basis of cycle-based forecasting"
        constraints: "integer > 0; required at enrollment"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of enrollment; null until enrolled"
        default: null
      - name: status
        type: enum
        source: system
        description: "Asset state machine: IN_SERVICE -> IN_SHOP -> IN_SERVICE"
        default: IN_SERVICE
        constraints: "one of {IN_SERVICE, IN_SHOP}"
      - name: projected_next_removal_date
        type: datetime
        source: computed
        description: "Cycle-based removal projection: logical clock + floor(llp_remaining_cycles / assumed_cycles_per_month * 30) days; null until enrolled"

  - name: ServiceAgreement
    parent: null
    common_fields: true
    fields:
      - name: contract_ref
        type: string
        source: input
        description: "Customer-facing contract reference; unique"
        constraints: "unique across ServiceAgreements"
      - name: base_rate_per_fh_usd
        type: number
        source: input
        description: "Base price per engine flight hour in USD before escalation and utilization band"
        constraints: "> 0"
      - name: escalation_pct
        type: number
        source: input
        description: "Annual escalation fraction (e.g. 0.03); compounded once per full 12-month period elapsed since escalation_anchor_date"
        constraints: ">= 0"
      - name: escalation_anchor_date
        type: datetime
        source: input
        description: "Date from which escalation anniversaries are counted"
      - name: start_date
        type: datetime
        source: input
        description: "Contract term start"
      - name: end_date
        type: datetime
        source: input
        description: "Contract term end; agreement auto-expires when the logical clock reaches it"
      - name: allowed_sourcing_classes
        type: array
        source: input
        description: "Part sourcing classes permitted by contract terms"
        constraints: "non-empty subset of {NEW, REPAIRED, USM}"
      - name: max_workscope_cost_usd
        type: number
        source: input
        description: "Per-shop-visit workscope cost cap; approval above it is rejected"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> ACTIVE <-> RENEGOTIATION cycle; ACTIVE -> EXPIRED (system at end_date)"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RENEGOTIATION, EXPIRED}"
      - name: billed_to_date_usd
        type: number
        source: computed
        description: "Sum of provisional_total_usd over ISSUED statements plus final_total_usd over SETTLED statements of this agreement"
      - name: enrolled_engine_count
        type: integer
        source: computed
        description: "Count of Engines whose agreement_id equals this agreement's id"

  - name: FlightHourReport
    parent: null
    common_fields: true
    fields:
      - name: engine_id
        type: string
        source: input
        description: "FK -> Engine.id; reporting engine (path id)"
      - name: period
        type: string
        source: input
        description: "Calendar month being reported, format YYYY-MM"
        constraints: "unique per (engine_id, period); must not be a future month relative to the logical clock"
      - name: flight_hours
        type: number
        source: input
        description: "Flight hours accumulated in the period"
        constraints: ">= 0"
      - name: cycles
        type: integer
        source: input
        description: "Cycles accumulated in the period"
        constraints: "integer >= 0"
      - name: observed_severity
        type: enum
        source: input
        description: "Dominant route-environment severity observed in the period"
        constraints: "one of {BENIGN, MODERATE, HARSH}"
      - name: status
        type: enum
        source: system
        description: "SUBMITTED -> VERIFIED (terminal); verification drives the cumulative/forecast cascade"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, VERIFIED}"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of verification; null while SUBMITTED"
        default: null

  - name: BillingStatement
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ServiceAgreement.id; billed agreement (path id)"
      - name: period
        type: string
        source: input
        description: "Billing month, format YYYY-MM"
        constraints: "unique per (agreement_id, period); must not be a future month relative to the logical clock"
      - name: status
        type: enum
        source: system
        description: "ISSUED (provisional) -> SETTLED (final, terminal)"
        default: ISSUED
        constraints: "one of {ISSUED, SETTLED}"
      - name: line_items
        type: array
        source: computed
        description: "Per-engine billing lines: [{engine_id, hours, effective_rate_per_fh_usd, line_amount_usd}]; input set depends on variant (see billing_statement_calculation)"
      - name: provisional_total_usd
        type: number
        source: computed
        description: "Sum of line amounts using the PROVISIONAL input set (SUBMITTED + VERIFIED reports); fixed at issuance"
      - name: final_total_usd
        type: number
        source: computed
        description: "Sum of line amounts using the FINAL input set (VERIFIED reports only); null until settled"
        default: null
      - name: adjustment_usd
        type: number
        source: computed
        description: "final_total_usd - provisional_total_usd; null until settled"
        default: null

  - name: ShopVisit
    parent: null
    common_fields: true
    fields:
      - name: engine_id
        type: string
        source: input
        description: "FK -> Engine.id; inducted engine (path id)"
      - name: planned_induction_date
        type: datetime
        source: input
        description: "Planned induction instant; auto-advanced by the forecast cascade when the recomputed forecast falls earlier"
      - name: forecast_induction_date
        type: datetime
        source: computed
        description: "min(cycle_based, calendar_based) forecast per shop_visit_forecast_calculation; recomputed at creation and on every report verification for this engine"
      - name: forecast_method
        type: enum
        source: computed
        description: "Which forecast variant produced forecast_induction_date"
        constraints: "one of {CYCLE_BASED, CALENDAR_BASED}"
      - name: actual_induction_date
        type: datetime
        source: system
        description: "Logical-clock date of induction; null until INDUCTED"
        default: null
      - name: completion_date
        type: datetime
        source: system
        description: "Logical-clock date of completion; null until COMPLETED"
        default: null
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> INDUCTED -> COMPLETED (terminal)"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, INDUCTED, COMPLETED}"
      - name: projected_cost_usd
        type: number
        source: computed
        description: "Severity-adjusted visit cost projection: WORKSCOPE_BASE_COST_USD * SEVERITY_COST_FACTOR[engine.base_severity_tier]"
      - name: committed_parts_cost_usd
        type: number
        source: computed
        description: "Sum of quantity * unit_cost_usd over PartRequisitions in status SOURCED belonging to any non-SUPERSEDED Workscope of this visit"

  - name: Workscope
    parent: null
    common_fields: true
    fields:
      - name: shop_visit_id
        type: string
        source: input
        description: "FK -> ShopVisit.id; owning visit (path id)"
      - name: scope_version
        type: integer
        source: system
        description: "1-based version counter per shop visit; increments on each new Workscope for the same visit"
      - name: status
        type: enum
        source: system
        description: "SUBMITTED -> {APPROVED, REJECTED}; APPROVED -> REOPENED (directive cascade); {REJECTED, REOPENED, APPROVED} -> SUPERSEDED when a newer version is created"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, REOPENED, SUPERSEDED}"
      - name: items
        type: array
        source: input
        description: "Proposed work items: [{item_code, item_type, estimated_cost_usd, restores_cycles, directive_ref}]; the server appends due mandatory-directive items at creation"
        constraints: "item_type one of {MANDATORY_DIRECTIVE, LLP_REPLACEMENT, MODULE_OVERHAUL, INSPECTION}; restores_cycles integer >= 0; directive_ref null unless MANDATORY_DIRECTIVE"
      - name: total_cost_usd
        type: number
        source: computed
        description: "Sum of estimated_cost_usd over items, round_half_up to 2 decimals, recomputed whenever items change"
      - name: restores_llp_cycles
        type: integer
        source: computed
        description: "max restores_cycles over items (0 when none); applied to the engine at visit completion"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the latest approve/reject decision; null while undecided"
        default: null

  - name: PartRequisition
    parent: null
    common_fields: true
    fields:
      - name: workscope_id
        type: string
        source: input
        description: "FK -> Workscope.id; demanding workscope (path id)"
      - name: part_number
        type: string
        source: input
        description: "Catalog part number being sourced"
      - name: quantity
        type: integer
        source: input
        description: "Units required"
        constraints: "integer > 0"
      - name: list_price_usd
        type: number
        source: input
        description: "Catalog list price per unit in USD; class factors apply on top"
        constraints: "> 0"
      - name: requested_class
        type: enum
        source: input
        description: "Operator-preferred sourcing class"
        constraints: "one of {NEW, REPAIRED, USM}"
      - name: required_by_date
        type: datetime
        source: input
        description: "Latest acceptable delivery date; drives lead-time eligibility"
      - name: sourced_class
        type: enum
        source: system
        description: "Class selected by the sourcing selector; null until SOURCED"
        default: null
        constraints: "one of {NEW, REPAIRED, USM}"
      - name: unit_cost_usd
        type: number
        source: computed
        description: "list_price_usd * CLASS_COST_FACTOR[sourced_class], round_half_up to 2 decimals; null until SOURCED"
        default: null
      - name: status
        type: enum
        source: system
        description: "REQUESTED -> {SOURCED, ESCALATED}; ESCALATED -> SOURCED (override); {REQUESTED, ESCALATED, SOURCED} -> CANCELLED (workscope cascade only)"
        default: REQUESTED
        constraints: "one of {REQUESTED, SOURCED, ESCALATED, CANCELLED}"

  - name: SpareEngine
    parent: null
    common_fields: true
    fields:
      - name: spare_serial
        type: string
        source: input
        description: "Spare engine serial; unique"
        constraints: "unique across SpareEngines"
      - name: engine_model
        type: string
        source: input
        description: "Engine model this spare can substitute for; must match the covered engine's model"
      - name: daily_lease_rate_usd
        type: number
        source: input
        description: "Lease price per calendar day in USD"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "AVAILABLE -> LEASED (lease activation) -> AVAILABLE (lease return); system-driven only"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, LEASED}"

  - name: SpareEngineLease
    parent: null
    common_fields: true
    fields:
      - name: spare_engine_id
        type: string
        source: input
        description: "FK -> SpareEngine.id; leased asset"
      - name: shop_visit_id
        type: string
        source: input
        description: "FK -> ShopVisit.id; shop visit whose aircraft-on-ground window this lease covers"
      - name: start_date
        type: datetime
        source: input
        description: "Lease window start (inclusive)"
      - name: end_date
        type: datetime
        source: input
        description: "Lease window end (exclusive); must be strictly after start_date"
      - name: status
        type: enum
        source: system
        description: "RESERVED -> ACTIVE -> RETURNED; RESERVED -> CANCELLED (forecast cascade when window no longer contains the planned induction date)"
        default: RESERVED
        constraints: "one of {RESERVED, ACTIVE, RETURNED, CANCELLED}"
      - name: lease_cost_usd
        type: number
        source: computed
        description: "Whole days in [start_date, end_date) * spare engine daily_lease_rate_usd, round_half_up to 2 decimals"
      - name: deposit_usd
        type: number
        source: computed
        description: "LEASE_DEPOSIT_USD unless the covered operator's credit_rating is A, in which case 0"

  - name: Directive
    parent: null
    common_fields: false
    fields:
      - name: directive_ref
        type: string
        source: input
        description: "Authority reference (e.g. AD-2026-0113); unique"
        constraints: "unique across Directives"
      - name: directive_type
        type: enum
        source: input
        description: "Issuing instrument"
        constraints: "one of {AD, SB, ED}"
      - name: applicability_model
        type: string
        source: input
        description: "Engine model this directive applies to (exact string match on Engine.engine_model)"
      - name: mandatory
        type: boolean
        source: input
        description: "Mandatory directives must be incorporated into an APPROVED workscope before visit completion"
      - name: compliance_cycles
        type: integer
        source: input
        description: "Compliance threshold in cumulative cycles; null when date-bound only"
        default: null
        constraints: "integer > 0 or null; at least one of compliance_cycles / compliance_date must be non-null"
      - name: compliance_date
        type: datetime
        source: input
        description: "Compliance deadline instant; null when cycle-bound only"
        default: null
      - name: estimated_cost_usd
        type: number
        source: input
        description: "Cost of incorporating the directive into a workscope"
        constraints: "> 0"

  - name: RecognitionSnapshot
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ServiceAgreement.id; accounted agreement (path id)"
      - name: lifetime_revenue_projection_usd
        type: number
        source: computed
        description: "billed_to_date_usd + remaining_term_months * projected_monthly_revenue (PROJECTED variant input set)"
      - name: lifetime_cost_projection_usd
        type: number
        source: computed
        description: "cost_to_date_usd + sum over enrolled engines of forecast_visits * severity-adjusted projected visit cost"
      - name: cost_to_date_usd
        type: number
        source: computed
        description: "Sum of total_cost_usd over APPROVED workscopes of COMPLETED visits on engines enrolled in this agreement, plus lease_cost_usd of RETURNED leases on those visits"
      - name: recognition_pct
        type: number
        source: computed
        description: "min(1, cost_to_date_usd / lifetime_cost_projection_usd), 4 decimal places round_half_up; 0 when projection is 0"
      - name: recognized_revenue_projected_usd
        type: number
        source: computed
        description: "PROJECTED variant: recognition_pct * lifetime_revenue_projection_usd, 2 decimals round_half_up"
      - name: recognized_revenue_actual_usd
        type: number
        source: computed
        description: "ACTUAL variant: settled_billing_to_date * (1 - TARGET_MARGIN_PCT), 2 decimals round_half_up"
      - name: onerous_loss_accrual_usd
        type: number
        source: computed
        description: "lifetime_cost_projection_usd - lifetime_revenue_projection_usd when projected margin < MARGIN_FLOOR_PCT, else 0"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/activate"
        actor: ContractManager
        preconditions:
          - "agreement.status == DRAFT"
          - "agreement.start_date <= logical clock < agreement.end_date"
        side_effects:
          - "increments ServiceAgreement.version by 1"
      - from: ACTIVE
        to: RENEGOTIATION
        trigger: "POST /api/agreements/{id}/open-renegotiation"
        actor: ContractManager
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "increments ServiceAgreement.version by 1"
          - "billing issuance and shop-visit induction are blocked while RENEGOTIATION (state gate on other endpoints)"
      - from: RENEGOTIATION
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/amend"
        actor: ContractManager
        preconditions:
          - "agreement.status == RENEGOTIATION"
          - "expected_agreement_version == agreement.version (OCC)"
        side_effects:
          - "applies amended commercial terms (rates, escalation, caps, allowed classes, end_date)"
          - "increments ServiceAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /api/_clock/set_current_utc advancing the logical clock to >= agreement.end_date"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "logical clock >= agreement.end_date"
        side_effects:
          - "increments ServiceAgreement.version by 1"

  - entity: Engine
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: IN_SHOP
        trigger: "POST /api/shop-visits/{id}/induct on a visit of this engine"
        actor: ShopPlanner
        preconditions:
          - "engine.status == IN_SERVICE"
          - "visit.status == SCHEDULED"
          - "engine's enrolled agreement.status == ACTIVE"
        side_effects:
          - "increments Engine.version by 1"
      - from: IN_SHOP
        to: IN_SERVICE
        trigger: "POST /api/shop-visits/{id}/complete on the open visit of this engine"
        actor: ShopPlanner
        preconditions:
          - "engine.status == IN_SHOP"
          - "visit.status == INDUCTED"
        side_effects:
          - "engine.llp_remaining_cycles := max(engine.llp_remaining_cycles, visit's APPROVED workscope restores_llp_cycles) when an APPROVED workscope exists"
          - "recomputes engine.projected_next_removal_date"
          - "increments Engine.version by 1"

  - entity: FlightHourReport
    initial_state: SUBMITTED
    terminal_states: [VERIFIED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/flight-hour-reports/{id}/verify"
        actor: FinanceController
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "report.verified_at := logical clock"
          - "engine.cumulative_flight_hours += report.flight_hours; engine.cumulative_cycles += report.cycles; engine.llp_remaining_cycles := max(0, engine.llp_remaining_cycles - report.cycles)"
          - "recompute engine.projected_next_removal_date"
          - "for each ShopVisit of this engine in status SCHEDULED: recompute forecast_induction_date; if the new forecast is earlier than planned_induction_date, set planned_induction_date := forecast_induction_date and cancel every RESERVED SpareEngineLease of that visit whose [start_date, end_date) does not contain the new planned_induction_date"
          - "increments Engine.version by 1 and report.version by 1"

  - entity: BillingStatement
    initial_state: ISSUED
    terminal_states: [SETTLED]
    transitions:
      - from: ISSUED
        to: SETTLED
        trigger: "POST /api/billing-statements/{id}/settle"
        actor: FinanceController
        preconditions:
          - "statement.status == ISSUED"
        side_effects:
          - "recomputes line_items with the FINAL input set (VERIFIED reports only)"
          - "sets final_total_usd and adjustment_usd := final_total_usd - provisional_total_usd"
          - "recomputes agreement.billed_to_date_usd"
          - "increments BillingStatement.version by 1"

  - entity: ShopVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: INDUCTED
        trigger: "POST /api/shop-visits/{id}/induct"
        actor: ShopPlanner
        preconditions:
          - "visit.status == SCHEDULED"
          - "engine.status == IN_SERVICE"
          - "engine's enrolled agreement.status == ACTIVE"
          - "count of ShopVisits with status INDUCTED and actual_induction_date == current logical-clock date is < SHOP_INDUCTION_DAILY_CAPACITY"
        side_effects:
          - "visit.actual_induction_date := logical clock"
          - "engine.status := IN_SHOP"
          - "increments ShopVisit.version by 1 and Engine.version by 1"
      - from: INDUCTED
        to: COMPLETED
        trigger: "POST /api/shop-visits/{id}/complete"
        actor: ShopPlanner
        preconditions:
          - "visit.status == INDUCTED"
          - "compliance gate, evaluated in this order: (a) every due mandatory Directive applicable to the engine model is incorporated into an APPROVED workscope of this visit, else ERR_MANDATORY_DIRECTIVE_OPEN; (b) an APPROVED Workscope exists for this visit, else ERR_NO_APPROVED_WORKSCOPE"
          - "no PartRequisition of any non-SUPERSEDED workscope of this visit is in status REQUESTED or ESCALATED"
        side_effects:
          - "visit.completion_date := logical clock"
          - "engine.status := IN_SERVICE; llp restoration applied per Engine transition"
          - "increments ShopVisit.version by 1"

  - entity: Workscope
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/workscopes/{id}/approve"
        actor: Operator
        preconditions:
          - "workscope.status in {SUBMITTED}"
          - "visit.status == INDUCTED"
          - "workscope.total_cost_usd <= agreement.max_workscope_cost_usd"
        side_effects:
          - "workscope.decided_at := logical clock"
          - "increments Workscope.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/workscopes/{id}/reject"
        actor: Operator
        preconditions:
          - "workscope.status in {SUBMITTED}"
        side_effects:
          - "workscope.decided_at := logical clock"
          - "increments Workscope.version by 1"
      - from: APPROVED
        to: REOPENED
        trigger: "system: POST /api/directives creating a mandatory Directive applicable to the engine model while the visit is INDUCTED"
        actor: system
        preconditions:
          - "workscope.status == APPROVED"
          - "directive.mandatory == true and directive.applicability_model == engine.engine_model"
          - "directive is DUE for the visit per workscope_determination_calculation Step 1 evaluated at issuance"
          - "visit.status == INDUCTED"
        side_effects:
          - "workscope.status := REOPENED (items are NOT modified; approved baseline is preserved)"
          - "requisitions of this workscope in status REQUESTED or ESCALATED are set to CANCELLED"
          - "increments Workscope.version by 1"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system: POST /api/shop-visits/{id}/workscopes creating a newer version for the same visit"
        actor: system
        preconditions:
          - "workscope.status in {REJECTED, REOPENED, APPROVED}"
        side_effects:
          - "workscope.status := SUPERSEDED"
          - "requisitions of this workscope in status REQUESTED, ESCALATED or SOURCED are set to CANCELLED (committed parts cost released)"
          - "increments Workscope.version by 1"
      - from: REOPENED
        to: SUPERSEDED
        trigger: "system: POST /api/shop-visits/{id}/workscopes creating a newer version for the same visit"
        actor: system
        preconditions:
          - "workscope.status in {REJECTED, REOPENED, APPROVED}"
        side_effects:
          - "workscope.status := SUPERSEDED"
          - "requisitions of this workscope in status REQUESTED, ESCALATED or SOURCED are set to CANCELLED"
          - "increments Workscope.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /api/shop-visits/{id}/workscopes creating a newer version for the same visit"
        actor: system
        preconditions:
          - "workscope.status in {REJECTED, REOPENED, APPROVED}"
        side_effects:
          - "workscope.status := SUPERSEDED"
          - "requisitions of this workscope in status REQUESTED, ESCALATED or SOURCED are set to CANCELLED"
          - "increments Workscope.version by 1"

  - entity: PartRequisition
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: SOURCED
        trigger: "POST /api/part-requisitions/{id}/source"
        actor: ShopPlanner
        preconditions:
          - "requisition.status in {REQUESTED, ESCALATED}"
          - "parts_sourcing_selector finds at least one eligible class"
        side_effects:
          - "sets sourced_class and unit_cost_usd per parts_sourcing_selector"
          - "increments PartRequisition.version by 1"
      - from: REQUESTED
        to: ESCALATED
        trigger: "POST /api/part-requisitions/{id}/source when no class is eligible without override"
        actor: system
        preconditions:
          - "requisition.status == REQUESTED"
          - "eligibility set of parts_sourcing_selector is empty and override is not applied"
        side_effects:
          - "requisition.status := ESCALATED; the request returns ERR_NO_ELIGIBLE_SOURCING_CLASS"
          - "increments PartRequisition.version by 1"
      - from: ESCALATED
        to: SOURCED
        trigger: "POST /api/part-requisitions/{id}/source with override=true"
        actor: ContractManager
        preconditions:
          - "requisition.status in {REQUESTED, ESCALATED}"
          - "override == true and caller role is ContractManager"
          - "at least one class in agreement.allowed_sourcing_classes (lead-time bypassed)"
        side_effects:
          - "sets sourced_class to the cheapest allowed class and unit_cost_usd accordingly"
          - "increments PartRequisition.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system: workscope cascade (REOPENED or SUPERSEDED)"
        actor: system
        preconditions:
          - "requisition.status in {REQUESTED, ESCALATED}"
        side_effects:
          - "increments PartRequisition.version by 1"
      - from: ESCALATED
        to: CANCELLED
        trigger: "system: workscope cascade (REOPENED or SUPERSEDED)"
        actor: system
        preconditions:
          - "requisition.status in {REQUESTED, ESCALATED}"
        side_effects:
          - "increments PartRequisition.version by 1"
      - from: SOURCED
        to: CANCELLED
        trigger: "system: workscope SUPERSEDED cascade releases the committed part (compensation)"
        actor: system
        preconditions:
          - "requisition.status == SOURCED"
          - "the owning workscope transitions to SUPERSEDED"
        side_effects:
          - "visit.committed_parts_cost_usd decreases by quantity * unit_cost_usd"
          - "increments PartRequisition.version by 1"

  - entity: SpareEngine
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: LEASED
        trigger: "POST /api/spare-engine-leases/{id}/activate"
        actor: system
        preconditions:
          - "spare_engine.status == AVAILABLE"
          - "lease.status == RESERVED"
        side_effects:
          - "increments SpareEngine.version by 1"
      - from: LEASED
        to: AVAILABLE
        trigger: "POST /api/spare-engine-leases/{id}/return"
        actor: system
        preconditions:
          - "spare_engine.status == LEASED"
          - "lease.status == ACTIVE"
        side_effects:
          - "increments SpareEngine.version by 1"

  - entity: SpareEngineLease
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /api/spare-engine-leases/{id}/activate"
        actor: Operator
        preconditions:
          - "lease.status == RESERVED"
          - "logical clock within [lease.start_date, lease.end_date)"
          - "lease's shop visit status in {SCHEDULED, INDUCTED}"
          - "spare_engine.status == AVAILABLE"
        side_effects:
          - "spare_engine.status := LEASED"
          - "increments SpareEngineLease.version by 1 and SpareEngine.version by 1"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /api/spare-engine-leases/{id}/return"
        actor: Operator
        preconditions:
          - "lease.status == ACTIVE"
        side_effects:
          - "spare_engine.status := AVAILABLE"
          - "increments SpareEngineLease.version by 1 and SpareEngine.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "system: report-verification cascade advancing the visit's planned_induction_date outside the lease window"
        actor: system
        preconditions:
          - "lease.status == RESERVED"
          - "new planned_induction_date not in [lease.start_date, lease.end_date)"
        side_effects:
          - "increments SpareEngineLease.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: amend-stale-agreement
    parent_entity: ServiceAgreement
    write_endpoint: "POST /api/agreements/{id}/amend"
    occ_field: expected_agreement_version
    description: |
      Amending a ServiceAgreement whose version has advanced since the client
      last observed it is rejected. A prior amend or open-renegotiation has
      already bumped agreement.version, so the current writer's terms were
      drafted against a stale contract baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: workscope-create-stale-visit
    parent_entity: ShopVisit
    write_endpoint: "POST /api/shop-visits/{id}/workscopes"
    occ_field: expected_shop_visit_version
    description: |
      Creating a new Workscope version against a ShopVisit whose version has
      advanced since the client last observed it is rejected. A prior workscope
      creation legitimately superseded the previous version and bumped
      ShopVisit.version, so the current writer's view of the visit is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_rate_calculation
    trigger: "whenever a billing line is computed for an engine and period (billing issue and settle)"
    algorithm: tiered_pricing
    formula: |
      anniversaries = number of integers k >= 1 such that
        escalation_anchor_date + k*12 months <= last day of the statement period
      escalation_factor = (1 + escalation_pct) ^ anniversaries
      band_factor = UTIL_BAND_LOW_FACTOR    if utilization_ratio <  UTIL_BAND_LOW_THRESHOLD
                  = UTIL_BAND_STANDARD_FACTOR if UTIL_BAND_LOW_THRESHOLD <= ratio <= UTIL_BAND_HIGH_THRESHOLD
                  = UTIL_BAND_HIGH_FACTOR   if utilization_ratio >  UTIL_BAND_HIGH_THRESHOLD
      effective_rate_per_fh_usd = round_half_up_4dp(
          base_rate_per_fh_usd * escalation_factor * band_factor)
    input_set: "the ServiceAgreement's rate/escalation fields and the engine's utilization_ratio for the statement period"
    constants:
      UTIL_BAND_LOW_THRESHOLD: 0.90
      UTIL_BAND_HIGH_THRESHOLD: 1.10
      UTIL_BAND_LOW_FACTOR: 0.95
      UTIL_BAND_STANDARD_FACTOR: 1.00
      UTIL_BAND_HIGH_FACTOR: 1.08
      RATE_PRECISION_DP: 4
    precision: "rate carried at 4 decimal places, round_half_up"
    variants: []

  - name: utilization_ratio_calculation
    trigger: "inside effective_rate_calculation for an engine and statement period"
    algorithm: threshold
    formula: |
      window = calendar months M such that M <= statement period AND M > statement period - 12 months
      verified = FlightHourReports of this engine with status == VERIFIED and period in window
      if verified is empty: utilization_ratio = 1.00 (STANDARD, no-data default)
      else:
        months_present = count of distinct periods in verified
        annualized_hours = (sum of flight_hours over verified) * 12 / months_present
        utilization_ratio = annualized_hours / engine.assumed_annual_hours
    input_set: "VERIFIED FlightHourReports of the engine whose period falls in the 12-month window ending at the statement period (inclusive)"
    constants:
      NO_DATA_RATIO: 1.00
      WINDOW_MONTHS: 12
    precision: "ratio exact decimal; compared against band thresholds with strict/non-strict bounds exactly as written"
    variants: []

  - name: billing_statement_calculation
    trigger: "POST /api/agreements/{id}/billing-statements (ISSUED, PROVISIONAL variant) and POST /api/billing-statements/{id}/settle (SETTLED, FINAL variant)"
    algorithm: aggregation
    formula: |
      for each Engine with agreement_id == agreement.id (evaluated at the time of the call):
        report = FlightHourReport of (engine, statement period) in the variant's input set
        if none: engine contributes no line
        else:
          effective_rate = effective_rate_calculation(engine, period)   # 4 dp
          line_amount_usd = round_half_up_2dp(report.flight_hours * effective_rate)
      total = sum of line_amount_usd over all lines   # NO further rounding; per-line rounding is pinned
      # pinned rounding order: round EACH line to 2 dp first, THEN sum.
    input_set: "PROVISIONAL: reports in {SUBMITTED, VERIFIED}; FINAL: reports in {VERIFIED} only; engines are those currently enrolled in the agreement, iterated in enrolled_at ASC order with created_at ASC as tie-break"
    constants:
      MONEY_DP: 2
    precision: "line amounts 2 decimal places round_half_up; totals are exact sums of rounded lines"
    variants:
      - name: PROVISIONAL
        when: "statement issuance (status ISSUED)"
        difference: "input set includes SUBMITTED as well as VERIFIED reports, so unverified hours are billed"
      - name: FINAL
        when: "statement settlement (status SETTLED)"
        difference: "input set is VERIFIED reports only; unverified hours drop out and the adjustment is the delta"

  - name: shop_visit_forecast_calculation
    trigger: "ShopVisit creation and every FlightHourReport verification for the engine (recompute of forecast_induction_date on SCHEDULED visits); also Engine.projected_next_removal_date"
    algorithm: forward_looking
    formula: |
      cycle_based   = logical clock + floor(engine.llp_remaining_cycles / engine.assumed_cycles_per_month * FORECAST_DAYS_PER_MONTH) days
      calendar_based = (completion_date of the engine's most recent COMPLETED ShopVisit,
                        or engine.created_at if none) + CALENDAR_INTERVAL_MONTHS months
      forecast_induction_date = min(cycle_based, calendar_based)
      forecast_method = CYCLE_BASED if cycle_based <= calendar_based else CALENDAR_BASED
    input_set: "the engine's current llp_remaining_cycles and enrollment assumptions; its COMPLETED visit history"
    constants:
      FORECAST_DAYS_PER_MONTH: 30
      CALENDAR_INTERVAL_MONTHS: 72
    precision: "date arithmetic at whole-day granularity; ties go to CYCLE_BASED"
    variants:
      - name: CYCLE_BASED
        when: "consumption-driven view"
        difference: "date derived from remaining LLP cycles and assumed monthly cycle rate; moves earlier as verified reports consume life"
      - name: CALENDAR_BASED
        when: "calendar-driven view"
        difference: "date derived from the last completed visit (or engine creation) plus a fixed calendar interval; insensitive to utilization"

  - name: workscope_determination_calculation
    trigger: "Workscope creation (server-side assembly) and Directive creation cascade for SUBMITTED workscopes"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED to break the circular look between
      # (remaining life -> which items are mandatory) and (items -> post-visit life):
      # (1) due directives are evaluated against PRE-visit engine state;
      # (2) mandatory items are fixed; (3) post-visit interval is evaluated;
      # (4) only then is the cost check possible.
      buffer_cycles = MIN_POST_VISIT_INTERVAL_MONTHS * engine.assumed_cycles_per_month
      Step 1: a Directive D is DUE for this visit iff D.mandatory AND
              D.applicability_model == engine.engine_model AND
              ( (D.compliance_cycles is not null AND D.compliance_cycles <= engine.llp_remaining_cycles + buffer_cycles)
                OR (D.compliance_date is not null AND D.compliance_date <= logical clock + MIN_POST_VISIT_INTERVAL_MONTHS months) )
      Step 2: mandatory items = one MANDATORY_DIRECTIVE item per DUE directive
              (item_code := D.directive_ref, estimated_cost_usd := D.estimated_cost_usd,
               restores_cycles := 0, directive_ref := D.directive_ref),
              appended to the proposer-supplied items, de-duplicated by directive_ref
      Step 3: restored = max restores_cycles over all items (0 if none)
              post_visit_life_cycles = max(restored, engine.llp_remaining_cycles)
              post_visit_interval_months = post_visit_life_cycles / engine.assumed_cycles_per_month
              if post_visit_interval_months < MIN_POST_VISIT_INTERVAL_MONTHS:
                reject creation with ERR_INSUFFICIENT_LIFE_RESTORATION
      Step 4: total_cost_usd = round_half_up_2dp(sum of estimated_cost_usd over all items)
    input_set: "engine pre-visit llp_remaining_cycles and enrollment assumptions; mandatory Directives matching the engine model; proposer-supplied items"
    constants:
      MIN_POST_VISIT_INTERVAL_MONTHS: 18
    precision: "money 2 decimals round_half_up; interval comparison is a strict <"
    variants: []

  - name: parts_sourcing_selector
    trigger: "POST /api/part-requisitions/{id}/source"
    algorithm: weighted_scoring
    formula: |
      unit_cost(class) = round_half_up_2dp(requisition.list_price_usd * CLASS_COST_FACTOR[class])
      lead_days(class) = CLASS_LEAD_DAYS[class]
      eligible(class) = class in agreement.allowed_sourcing_classes
                        AND (override == true OR requisition.required_by_date >= logical clock + lead_days(class) days)
      selection:
        if override == true: choose cheapest class in allowed_sourcing_classes by unit_cost
        elif requested_class is eligible: choose requested_class
        elif any class eligible: choose the eligible class with lowest unit_cost
        else: no selection -> requisition ESCALATED, ERR_NO_ELIGIBLE_SOURCING_CLASS
      tie-break on equal unit_cost: fixed class priority NEW, then REPAIRED, then USM
    input_set: "the requisition, the agreement's allowed_sourcing_classes, the logical clock"
    constants:
      CLASS_COST_FACTOR_NEW: 1.00
      CLASS_COST_FACTOR_REPAIRED: 0.70
      CLASS_COST_FACTOR_USM: 0.45
      CLASS_LEAD_DAYS_NEW: 7
      CLASS_LEAD_DAYS_REPAIRED: 21
      CLASS_LEAD_DAYS_USM: 3
    precision: "unit cost 2 decimals round_half_up"
    variants: []

  - name: lease_cost_calculation
    trigger: "SpareEngineLease creation"
    algorithm: aggregation
    formula: |
      days = number of whole calendar days in the half-open interval [start_date, end_date)
      lease_cost_usd = round_half_up_2dp(days * spare_engine.daily_lease_rate_usd)
      deposit_usd = 0 if operator.credit_rating == 'A' else LEASE_DEPOSIT_USD
    input_set: "the lease window, the spare engine's daily rate, the operator's credit rating"
    constants:
      LEASE_DEPOSIT_USD: 50000
    precision: "money 2 decimals round_half_up; window arithmetic is half-open [start, end) so adjacency is not overlap"
    variants: []

  - name: recognition_snapshot_calculation
    trigger: "POST /api/agreements/{id}/recognition-snapshots"
    algorithm: forward_looking
    formula: |
      remaining_term_months = (end_date.year*12 + end_date.month) - (clock.year*12 + clock.month); floor at 0
      effective_rate_now(engine) = effective_rate_calculation(engine, current period)
      projected_monthly_revenue = sum over engines with agreement_id == agreement.id of
                                  (engine.assumed_annual_hours / 12) * effective_rate_now(engine)
      lifetime_revenue_projection_usd = agreement.billed_to_date_usd + remaining_term_months * projected_monthly_revenue
      forecast_visits(engine) = ceil(remaining_term_months * engine.assumed_cycles_per_month / LLP_RESET_CYCLES)
      projected_cost_per_visit(engine) = WORKSCOPE_BASE_COST_USD * SEVERITY_COST_FACTOR[engine.base_severity_tier]
      lifetime_cost_projection_usd = cost_to_date_usd + sum over enrolled engines of forecast_visits * projected_cost_per_visit
      cost_to_date_usd = sum of total_cost_usd over APPROVED workscopes of COMPLETED visits of enrolled engines
                         + sum of lease_cost_usd over RETURNED leases of those visits
      recognition_pct = min(1, cost_to_date_usd / lifetime_cost_projection_usd); 0 when projection is 0
      recognized_revenue_projected_usd = round_half_up_2dp(recognition_pct * lifetime_revenue_projection_usd)
      settled_billing_to_date = sum of final_total_usd over SETTLED statements of the agreement
      recognized_revenue_actual_usd = round_half_up_2dp(settled_billing_to_date * (1 - TARGET_MARGIN_PCT))
      projected_margin = (lifetime_revenue_projection_usd - lifetime_cost_projection_usd) / lifetime_revenue_projection_usd (0 when revenue projection is 0)
      onerous_loss_accrual_usd = round_half_up_2dp(lifetime_cost_projection_usd - lifetime_revenue_projection_usd)
                                 if projected_margin < MARGIN_FLOOR_PCT else 0
    input_set: "PROJECTED variant uses forward-looking enrollment/run-rate/forecast inputs; ACTUAL variant uses only SETTLED statements (chronological actuals); both share cost_to_date actuals"
    constants:
      LLP_RESET_CYCLES: 8000
      WORKSCOPE_BASE_COST_USD: 1200000
      SEVERITY_COST_FACTOR_BENIGN: 1.00
      SEVERITY_COST_FACTOR_MODERATE: 1.15
      SEVERITY_COST_FACTOR_HARSH: 1.30
      TARGET_MARGIN_PCT: 0.15
      MARGIN_FLOOR_PCT: 0.05
    precision: "pct 4 decimals round_half_up; money 2 decimals round_half_up"
    variants:
      - name: PROJECTED
        when: "lifetime projection basis"
        difference: "revenue recognized in proportion to cost-to-date over a forward-looking lifetime projection that includes forecast visits and run-rate billing"
      - name: ACTUAL
        when: "chronological actuals basis"
        difference: "revenue recognized from settled billings only, deflated by the fixed target margin; ignores all forecast state"

  - name: shop_induction_capacity_check
    trigger: "POST /api/shop-visits/{id}/induct"
    algorithm: threshold
    formula: |
      inducted_today = count of ShopVisits with status == INDUCTED
                       and actual_induction_date == current logical-clock date
      if inducted_today >= SHOP_INDUCTION_DAILY_CAPACITY: reject with ERR_SHOP_CAPACITY_EXCEEDED
    input_set: "all ShopVisits regardless of agreement or operator (aggregate daily shop capacity)"
    constants:
      SHOP_INDUCTION_DAILY_CAPACITY: 2
    precision: "whole-count comparison; boundary is >= (the capacity-th induction of the day is rejected)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is in the endpoint's roles; for Operator calls, X-User-ID equals the id of the Operator owning the target resource, resolved through the resource's engine chain (engine.operator_id for engines and their reports/visits; the visit's engine's operator for workscopes and leases)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the path resolves to an existing resource, validated left to right"
    error_id: ERR_OPERATOR_NOT_FOUND
    http_status: 404
    applies_to: "all (resource-specific variants: ERR_ENGINE_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SHOP_VISIT_NOT_FOUND, ERR_WORKSCOPE_NOT_FOUND, ERR_REQUISITION_NOT_FOUND, ERR_SPARE_ENGINE_NOT_FOUND, ERR_LEASE_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_STATEMENT_NOT_FOUND)"
  - priority: 4
    category: business_constraint
    check: "request body shape: required fields present, types valid, enum values in range, quantity/amount bounds respected, end_date strictly after start_date on lease windows, report/statement period not after the current logical-clock month, directive has at least one of compliance_cycles/compliance_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all (window and period violations surface as ERR_INVALID_WINDOW 422 and ERR_FUTURE_PERIOD 422)"
  - priority: 5
    category: business_constraint
    check: "uniqueness: iata_code, esn, contract_ref, spare_serial, directive_ref unique; (engine_id, period) unique across FlightHourReports; (agreement_id, period) unique across BillingStatements"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "creation endpoints (report and statement duplicates surface as ERR_DUPLICATE_REPORT and ERR_DUPLICATE_STATEMENT)"
  - priority: 6
    category: state
    check: "state preconditions of the targeted transition hold: agreement in required status (ERR_AGREEMENT_NOT_ACTIVE, ERR_AGREEMENT_NOT_IN_RENEGOTIATION), engine enrollment/state (ERR_ENGINE_NOT_ENROLLED, ERR_ENGINE_IN_SHOP), visit/workscope/requisition/report/statement/lease in a from-state of the requested transition (ERR_INVALID_STATE, ERR_VISIT_NOT_INDUCTED, ERR_NO_APPROVED_WORKSCOPE, ERR_WORKSCOPE_NOT_SUBMITTED, ERR_WORKSCOPE_NOT_APPROVED, ERR_ACTIVE_WORKSCOPE_EXISTS, ERR_VISIT_NOT_ACTIVE_FOR_LEASE), OCC version match (ERR_STALE_VERSION)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (ERR_STALE_VERSION returns 412)"
  - priority: 7
    category: business_safety
    check: "airworthiness compliance gate on visit completion, evaluated in this order: (a) every due mandatory Directive applicable to the engine model is incorporated into an APPROVED workscope of the visit, else ERR_MANDATORY_DIRECTIVE_OPEN; (b) an APPROVED workscope exists, else ERR_NO_APPROVED_WORKSCOPE"
    error_id: ERR_MANDATORY_DIRECTIVE_OPEN
    http_status: 409
    applies_to: "POST /api/shop-visits/{id}/complete"
  - priority: 8
    category: business_temporal
    check: "temporal resource rules: lease window must not overlap another RESERVED/ACTIVE lease of the same spare engine under half-open [start,end) semantics; lease activation only inside its window; daily induction count below SHOP_INDUCTION_DAILY_CAPACITY"
    error_id: ERR_LEASE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/spare-engine-leases, POST /api/spare-engine-leases/{id}/activate (ERR_LEASE_NOT_IN_WINDOW), POST /api/shop-visits/{id}/induct (ERR_SHOP_CAPACITY_EXCEEDED)"
  - priority: 9
    category: business_referential
    check: "cross-entity referential rules: engine not already enrolled (ERR_ENGINE_ALREADY_ENROLLED), visit completion blocked by open requisitions (ERR_OPEN_REQUISITIONS), spare engine model matches the visit engine's model (ERR_MODEL_MISMATCH), sourcing eligibility non-empty (ERR_NO_ELIGIBLE_SOURCING_CLASS)"
    error_id: ERR_OPEN_REQUISITIONS
    http_status: 409
    applies_to: "enroll, visit completion, lease creation, requisition sourcing"
  - priority: 10
    category: business_fiscal
    check: "fiscal gates: workscope approval requires total_cost_usd <= agreement.max_workscope_cost_usd (ERR_WORKSCOPE_COST_CAP_EXCEEDED); workscope creation requires the post-visit life restoration to meet MIN_POST_VISIT_INTERVAL_MONTHS (ERR_INSUFFICIENT_LIFE_RESTORATION)"
    error_id: ERR_WORKSCOPE_COST_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /api/workscopes/{id}/approve, POST /api/shop-visits/{id}/workscopes (ERR_INSUFFICIENT_LIFE_RESTORATION)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /api/_clock/set_current_utc
    description: "Sets the logical clock used by every date rule. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Side effect: agreements whose end_date is reached transition ACTIVE -> EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["auto-expire ACTIVE agreements whose end_date <= to_iso8601"]

  - method: POST
    path: /api/operators
    description: "Register an airline operator"
    roles: [PlatformAdmin]
    code: 201
    input: [name, iata_code, credit_rating]
    output: Operator
    side_effects: []

  - method: POST
    path: /api/engines
    description: "Register an engine asset for an operator"
    roles: [PlatformAdmin]
    code: 201
    input: [operator_id, esn, engine_model, base_severity_tier, llp_remaining_cycles]
    output: Engine
    side_effects: []

  - method: POST
    path: /api/engines/{id}/flight-hour-reports
    description: "Operator submits the monthly flight-hour/cycle report for an enrolled, in-service engine"
    roles: [Operator]
    code: 201
    input: [period, flight_hours, cycles, observed_severity]
    output: FlightHourReport
    side_effects: []

  - method: POST
    path: /api/engines/{id}/shop-visits
    description: "Operator schedules a shop visit; server computes forecast_induction_date and forecast_method from shop_visit_forecast_calculation"
    roles: [Operator]
    code: 201
    input: [planned_induction_date]
    output: ShopVisit
    side_effects: ["runs shop_visit_forecast_calculation", "computes projected_cost_usd"]

  - method: POST
    path: /api/agreements
    description: "Draft a long-term flight-hour service agreement (created in DRAFT)"
    roles: [ContractManager]
    code: 201
    input: [contract_ref, base_rate_per_fh_usd, escalation_pct, escalation_anchor_date, start_date, end_date, allowed_sourcing_classes, max_workscope_cost_usd]
    output: ServiceAgreement
    side_effects: []

  - method: POST
    path: /api/agreements/{id}/activate
    description: "Activate a DRAFT agreement"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["increments ServiceAgreement.version by 1"]

  - method: POST
    path: /api/agreements/{id}/open-renegotiation
    description: "Open a renegotiation round on an ACTIVE agreement; blocks billing and induction until amended"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["increments ServiceAgreement.version by 1"]

  - method: POST
    path: /api/agreements/{id}/amend
    description: "Close a renegotiation by applying amended terms; OCC-guarded on the agreement version"
    roles: [ContractManager]
    code: 200
    input: [expected_agreement_version, "base_rate_per_fh_usd?", "escalation_pct?", "escalation_anchor_date?", "end_date?", "allowed_sourcing_classes?", "max_workscope_cost_usd?"]
    output: ServiceAgreement
    side_effects: ["applies amended terms", "transitions RENEGOTIATION -> ACTIVE", "increments ServiceAgreement.version by 1"]

  - method: POST
    path: /api/agreements/{id}/enroll
    description: "Enroll an unenrolled in-service engine into an ACTIVE agreement with utilization assumptions (fleet mix change)"
    roles: [ContractManager]
    code: 200
    input: [engine_id, assumed_annual_hours, assumed_cycles_per_month]
    output: Engine
    side_effects: ["sets engine.agreement_id, assumed_annual_hours, assumed_cycles_per_month, enrolled_at", "increments Engine.version by 1"]

  - method: POST
    path: /api/agreements/{id}/billing-statements
    description: "Issue the PROVISIONAL monthly flight-hour statement for an ACTIVE agreement (SUBMITTED + VERIFIED reports)"
    roles: [FinanceController]
    code: 201
    input: [period]
    output: BillingStatement
    side_effects: ["runs billing_statement_calculation PROVISIONAL variant", "recomputes agreement.billed_to_date_usd"]

  - method: POST
    path: /api/agreements/{id}/recognition-snapshots
    description: "Append a contract-accounting snapshot recomputing PROJECTED and ACTUAL revenue recognition for the agreement"
    roles: [FinanceController]
    code: 201
    input: []
    output: RecognitionSnapshot
    side_effects: ["runs recognition_snapshot_calculation"]

  - method: POST
    path: /api/flight-hour-reports/{id}/verify
    description: "Finance verifies a submitted report; consumes engine LLP life and drives the forecast/lease cascade"
    roles: [FinanceController]
    code: 200
    input: []
    output: FlightHourReport
    side_effects: ["engine cumulative hours/cycles += report values; engine.llp_remaining_cycles decreases", "recomputes engine.projected_next_removal_date", "SCHEDULED visits of the engine: forecast recompute, planned date auto-advance, out-of-window RESERVED leases auto-cancel"]

  - method: POST
    path: /api/billing-statements/{id}/settle
    description: "Settle an ISSUED statement: recompute with the FINAL variant (VERIFIED reports only) and record the adjustment"
    roles: [FinanceController]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["runs billing_statement_calculation FINAL variant", "sets final_total_usd and adjustment_usd", "recomputes agreement.billed_to_date_usd", "increments BillingStatement.version by 1"]

  - method: POST
    path: /api/shop-visits/{id}/induct
    description: "Induct a SCHEDULED visit; pulls the engine into the shop subject to the daily induction capacity"
    roles: [ShopPlanner]
    code: 200
    input: []
    output: ShopVisit
    side_effects: ["engine.status := IN_SHOP", "sets actual_induction_date", "increments ShopVisit.version by 1 and Engine.version by 1"]

  - method: POST
    path: /api/shop-visits/{id}/complete
    description: "Complete an INDUCTED visit after the compliance gate (approved workscope, due mandatory directives incorporated, no open requisitions)"
    roles: [ShopPlanner]
    code: 200
    input: []
    output: ShopVisit
    side_effects: ["engine.status := IN_SERVICE", "applies llp restoration from the APPROVED workscope", "sets completion_date", "increments ShopVisit.version by 1"]

  - method: POST
    path: /api/shop-visits/{id}/workscopes
    description: "Create the next workscope version for an INDUCTED visit; server appends due mandatory-directive items and enforces the post-visit life floor; OCC-guarded on the visit version; supersedes the previous REJECTED/REOPENED/APPROVED version"
    roles: [ShopPlanner]
    code: 201
    input: [expected_shop_visit_version, "items?"]
    output: Workscope
    side_effects: ["runs workscope_determination_calculation (mandatory item append + life floor)", "previous version -> SUPERSEDED with requisition compensation", "increments ShopVisit.version by 1"]

  - method: POST
    path: /api/workscopes/{id}/approve
    description: "Operator approves a SUBMITTED workscope within the agreement cost cap"
    roles: [Operator]
    code: 200
    input: []
    output: Workscope
    side_effects: ["sets decided_at", "increments Workscope.version by 1"]

  - method: POST
    path: /api/workscopes/{id}/reject
    description: "Operator rejects a SUBMITTED workscope; a new version may then be created"
    roles: [Operator]
    code: 200
    input: []
    output: Workscope
    side_effects: ["sets decided_at", "increments Workscope.version by 1"]

  - method: POST
    path: /api/workscopes/{id}/part-requisitions
    description: "Demand a part for an APPROVED workscope with a preferred sourcing class"
    roles: [ShopPlanner]
    code: 201
    input: [part_number, quantity, list_price_usd, requested_class, required_by_date]
    output: PartRequisition
    side_effects: []

  - method: POST
    path: /api/part-requisitions/{id}/source
    description: "Run the sourcing selector; ESCALATED when no class is eligible; ContractManager may pass override=true to bypass lead time (never the allowed-class list)"
    roles: [ShopPlanner, ContractManager]
    code: 200
    input: ["override?"]
    output: PartRequisition
    side_effects: ["sets sourced_class and unit_cost_usd on success", "REQUESTED -> ESCALATED with ERR_NO_ELIGIBLE_SOURCING_CLASS when eligibility is empty"]

  - method: POST
    path: /api/spare-engines
    description: "Register a spare engine in the lease pool"
    roles: [PlatformAdmin]
    code: 201
    input: [spare_serial, engine_model, daily_lease_rate_usd]
    output: SpareEngine
    side_effects: []

  - method: POST
    path: /api/spare-engine-leases
    description: "Reserve a spare engine for a shop visit's aircraft-on-ground window; half-open overlap and model-match enforced"
    roles: [Operator]
    code: 201
    input: [spare_engine_id, shop_visit_id, start_date, end_date]
    output: SpareEngineLease
    side_effects: ["runs lease_cost_calculation"]

  - method: POST
    path: /api/spare-engine-leases/{id}/activate
    description: "Activate a RESERVED lease inside its window while the covered visit is SCHEDULED or INDUCTED"
    roles: [Operator]
    code: 200
    input: []
    output: SpareEngineLease
    side_effects: ["spare_engine.status := LEASED", "increments SpareEngineLease.version by 1 and SpareEngine.version by 1"]

  - method: POST
    path: /api/spare-engine-leases/{id}/return
    description: "Return an ACTIVE lease; the spare engine becomes AVAILABLE again"
    roles: [Operator]
    code: 200
    input: []
    output: SpareEngineLease
    side_effects: ["spare_engine.status := AVAILABLE", "increments SpareEngineLease.version by 1 and SpareEngine.version by 1"]

  - method: POST
    path: /api/directives
    description: "Issue an engineering directive / service bulletin / airworthiness directive; mandatory ones cascade into workscopes of applicable INDUCTED visits"
    roles: [PlatformAdmin]
    code: 201
    input: [directive_ref, directive_type, applicability_model, mandatory, estimated_cost_usd, "compliance_cycles?", "compliance_date?"]
    output: Directive
    side_effects: ["SUBMITTED workscopes on INDUCTED visits of matching engine models: append the due MANDATORY_DIRECTIVE item and recompute total_cost_usd", "APPROVED workscopes on INDUCTED visits of matching models: transition to REOPENED and auto-cancel their REQUESTED/ESCALATED requisitions"]

  - method: GET
    path: /api/engines/{id}
    description: "Read one engine including computed projected_next_removal_date"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: []
    output: Engine
    side_effects: []

  - method: GET
    path: /api/engines
    description: "List engines; optional filters by operator_id and agreement_id (reverse lookup for both Engine foreign keys)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["operator_id?", "agreement_id?", "limit?", "offset?"]
    output: Engine[]
    side_effects: []

  - method: GET
    path: /api/engines/{id}/shop-visits
    description: "List shop visits of an engine (reverse reachability for ShopVisit.engine_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: ShopVisit[]
    side_effects: []

  - method: GET
    path: /api/engines/{id}/flight-hour-reports
    description: "List flight-hour reports of an engine (reverse reachability for FlightHourReport.engine_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: FlightHourReport[]
    side_effects: []

  - method: GET
    path: /api/agreements/{id}
    description: "Read one agreement including computed billed_to_date_usd and enrolled_engine_count"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []

  - method: GET
    path: /api/agreements/{id}/billing-statements
    description: "List billing statements of an agreement (reverse reachability for BillingStatement.agreement_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: BillingStatement[]
    side_effects: []

  - method: GET
    path: /api/agreements/{id}/recognition-snapshots
    description: "List recognition snapshots of an agreement, append-only history (reverse reachability for RecognitionSnapshot.agreement_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: RecognitionSnapshot[]
    side_effects: []

  - method: GET
    path: /api/shop-visits/{id}
    description: "Read one shop visit including computed forecast and committed parts cost"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: []
    output: ShopVisit
    side_effects: []

  - method: GET
    path: /api/shop-visits/{id}/workscopes
    description: "List workscope versions of a visit (reverse reachability for Workscope.shop_visit_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: Workscope[]
    side_effects: []

  - method: GET
    path: /api/shop-visits/{id}/leases
    description: "List spare engine leases covering a visit (reverse reachability for SpareEngineLease.shop_visit_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: SpareEngineLease[]
    side_effects: []

  - method: GET
    path: /api/workscopes/{id}
    description: "Read one workscope version including computed total_cost_usd and restores_llp_cycles"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: []
    output: Workscope
    side_effects: []

  - method: GET
    path: /api/workscopes/{id}/part-requisitions
    description: "List part requisitions of a workscope (reverse reachability for PartRequisition.workscope_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: PartRequisition[]
    side_effects: []

  - method: GET
    path: /api/spare-engines/{id}
    description: "Read one spare engine"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: []
    output: SpareEngine
    side_effects: []

  - method: GET
    path: /api/spare-engines/{id}/leases
    description: "List leases of a spare engine (reverse reachability for SpareEngineLease.spare_engine_id)"
    roles: [PlatformAdmin, ContractManager, Operator, ShopPlanner, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: SpareEngineLease[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or Operator caller's X-User-ID does not match the resource-owning operator" }
  - { id: ERR_OPERATOR_NOT_FOUND, http: 404, condition: "Referenced operator id does not exist" }
  - { id: ERR_ENGINE_NOT_FOUND, http: 404, condition: "Referenced engine id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Referenced agreement id does not exist" }
  - { id: ERR_SHOP_VISIT_NOT_FOUND, http: 404, condition: "Referenced shop visit id does not exist" }
  - { id: ERR_WORKSCOPE_NOT_FOUND, http: 404, condition: "Referenced workscope id does not exist" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "Referenced part requisition id does not exist" }
  - { id: ERR_SPARE_ENGINE_NOT_FOUND, http: 404, condition: "Referenced spare engine id does not exist" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "Referenced spare engine lease id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Referenced flight-hour report id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "Referenced billing statement id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type, enum value out of range, or numeric bound violated" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Lease end_date is not strictly after start_date" }
  - { id: ERR_FUTURE_PERIOD, http: 422, condition: "Report or statement period is after the current logical-clock month" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Unique business key collision (iata_code, esn, contract_ref, spare_serial, directive_ref)" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A FlightHourReport already exists for (engine_id, period)" }
  - { id: ERR_DUPLICATE_STATEMENT, http: 409, condition: "A BillingStatement already exists for (agreement_id, period)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the agreement in ACTIVE status (billing issuance, enrollment, visit induction blocked in DRAFT/RENEGOTIATION/EXPIRED)" }
  - { id: ERR_AGREEMENT_NOT_IN_RENEGOTIATION, http: 409, condition: "Amend attempted while the agreement is not in RENEGOTIATION" }
  - { id: ERR_ENGINE_NOT_ENROLLED, http: 409, condition: "Operation requires the engine enrolled in an agreement (report submission, visit scheduling)" }
  - { id: ERR_ENGINE_ALREADY_ENROLLED, http: 409, condition: "Enroll attempted on an engine whose agreement_id is already set" }
  - { id: ERR_ENGINE_IN_SHOP, http: 409, condition: "Operation requires the engine IN_SERVICE but it is IN_SHOP (report submission during a visit)" }
  - { id: ERR_VISIT_NOT_INDUCTED, http: 409, condition: "Workscope creation/approval requires the visit INDUCTED" }
  - { id: ERR_NO_APPROVED_WORKSCOPE, http: 409, condition: "Visit completion requires an APPROVED workscope and none exists" }
  - { id: ERR_WORKSCOPE_NOT_SUBMITTED, http: 409, condition: "Approve/reject attempted on a workscope not in SUBMITTED status" }
  - { id: ERR_WORKSCOPE_NOT_APPROVED, http: 409, condition: "Part requisition creation requires the workscope APPROVED" }
  - { id: ERR_ACTIVE_WORKSCOPE_EXISTS, http: 409, condition: "New workscope version attempted while the latest version is still SUBMITTED (undecided)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic transition precondition failure not covered by a more specific error (e.g. terminal-state lockdown, double verify, double settle, lease activate from non-RESERVED)" }
  - { id: ERR_MANDATORY_DIRECTIVE_OPEN, http: 409, condition: "Visit completion blocked: a due mandatory Directive applicable to the engine model is not incorporated into an APPROVED workscope" }
  - { id: ERR_LEASE_WINDOW_OVERLAP, http: 409, condition: "Lease window overlaps another RESERVED/ACTIVE lease of the same spare engine under half-open [start,end) semantics (adjacent windows do not overlap)" }
  - { id: ERR_LEASE_NOT_IN_WINDOW, http: 409, condition: "Lease activation attempted when the logical clock is outside [start_date, end_date)" }
  - { id: ERR_SHOP_CAPACITY_EXCEEDED, http: 409, condition: "Induction would exceed SHOP_INDUCTION_DAILY_CAPACITY for the current logical-clock date" }
  - { id: ERR_OPEN_REQUISITIONS, http: 409, condition: "Visit completion blocked by requisitions still REQUESTED or ESCALATED" }
  - { id: ERR_MODEL_MISMATCH, http: 422, condition: "Spare engine model does not match the shop visit engine's model" }
  - { id: ERR_NO_ELIGIBLE_SOURCING_CLASS, http: 409, condition: "No sourcing class passes the agreement's allowed list and lead-time eligibility; requisition moved to ESCALATED" }
  - { id: ERR_WORKSCOPE_COST_CAP_EXCEEDED, http: 422, condition: "Workscope total_cost_usd exceeds the agreement's max_workscope_cost_usd at approval" }
  - { id: ERR_INSUFFICIENT_LIFE_RESTORATION, http: 422, condition: "Proposed workscope leaves post-visit life below MIN_POST_VISIT_INTERVAL_MONTHS of operation" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "MRO provider platform administrator; registers master data and issues airworthiness artifacts"
    identity: opaque
    exclusive_operations: ["POST /api/operators", "POST /api/engines", "POST /api/spare-engines", "POST /api/directives", "POST /api/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: ContractManager
    description: "MRO commercial contracts manager; owns agreement lifecycle and enrollment, resolves sourcing escalations"
    identity: opaque
    exclusive_operations: ["POST /api/agreements", "POST /api/agreements/{id}/activate", "POST /api/agreements/{id}/open-renegotiation", "POST /api/agreements/{id}/amend", "POST /api/agreements/{id}/enroll"]
    shared_operations: ["all GET endpoints", "POST /api/part-requisitions/{id}/source (with override=true)"]
  - name: Operator
    description: "Airline customer; submits utilization, schedules visits, approves workscopes, leases spare engines"
    identity: "entity_backed:Operator"
    exclusive_operations: ["POST /api/engines/{id}/flight-hour-reports", "POST /api/engines/{id}/shop-visits", "POST /api/workscopes/{id}/approve", "POST /api/workscopes/{id}/reject", "POST /api/spare-engine-leases", "POST /api/spare-engine-leases/{id}/activate", "POST /api/spare-engine-leases/{id}/return"]
    shared_operations: ["all GET endpoints"]
  - name: ShopPlanner
    description: "MRO shop floor planner; inducts and completes visits, drafts workscopes and requisitions"
    identity: opaque
    exclusive_operations: ["POST /api/shop-visits/{id}/induct", "POST /api/shop-visits/{id}/complete", "POST /api/shop-visits/{id}/workscopes", "POST /api/workscopes/{id}/part-requisitions"]
    shared_operations: ["all GET endpoints", "POST /api/part-requisitions/{id}/source (without override)"]
  - name: FinanceController
    description: "MRO finance controller; verifies utilization, issues and settles billing, runs contract accounting"
    identity: opaque
    exclusive_operations: ["POST /api/flight-hour-reports/{id}/verify", "POST /api/agreements/{id}/billing-statements", "POST /api/billing-statements/{id}/settle", "POST /api/agreements/{id}/recognition-snapshots"]
    shared_operations: ["all GET endpoints"]
