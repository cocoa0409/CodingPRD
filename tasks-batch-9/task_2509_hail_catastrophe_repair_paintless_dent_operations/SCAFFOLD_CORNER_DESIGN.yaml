            - call: "POST /hail-ops/facilities/${fac}/commission"
              payload: {}
              as: CatastropheDirector
          assert:
            - "the DENY returns 200 with ${denied_status} == DENIED, data.valid_from == null, data.valid_to == null and data.decided_at set to 2026-08-05T08:00:00Z"
            - "the first commission returns 409 with ${err_commission} == ERR_REQUIRED_PERMIT_MISSING and Facility.${fac}.status is still SETUP with posture == FROZEN"
            - "the replacement ZONING_USE permit is created in PENDING and its APPROVE decision returns 200 with status == APPROVED"
            - "the second commission returns 200 with Facility.${fac}.status == COMMISSIONED and posture == OPEN"
            - "GET /hail-ops/facilities/${fac}/permits?permit_type=ZONING_USE returns total_count == 2, one DENIED and one APPROVED"
