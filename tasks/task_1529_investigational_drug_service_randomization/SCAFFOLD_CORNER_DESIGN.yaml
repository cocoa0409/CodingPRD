  - section: cross_cutting_layers
    instances:
      - name: fee_schedule_approve_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fee-schedule-approve-stale-study]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Study.version: after the first approval bumps the study to version 2, a second approval carrying the stale version 1 is rejected 412; retrying with the current version succeeds and SUPERSEDES the first schedule."
        test_recipe:
          setup: ["study DRAFT (version 1) with two DRAFT fee schedules fs1, fs2"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-CC-1", title: "OCC", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 100, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs1: $.data.id } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 200, dispensing_fee_cents: 6000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs2: $.data.id } }
          trigger:
            - { call: "POST /api/fee-schedules/${fs1}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin, captures: { fs1_st: $.data.status } }
            - { call: "POST /api/fee-schedules/${fs2}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /api/studies/${study}", as: SponsorAdmin, captures: { study_vnow: $.data.version } }
            - { call: "POST /api/fee-schedules/${fs2}/approve", payload: { expected_study_version: "${study_vnow}" }, as: SponsorAdmin, captures: { fs2_st: $.data.status } }
            - { call: "GET /api/fee-schedules/${fs1}", as: SponsorAdmin, captures: { fs1_after: $.data.status } }
          assert:
            - "fs1_st == APPROVED (first approve succeeds at version 1)"
            - "err == ERR_STALE_VERSION and HTTP status 412 (fs2 approve carried the now-stale version 1 after the study advanced to 2)"
            - "fs2_st == APPROVED after retrying with the fresh version"
            - "fs1_after == SUPERSEDED (approval of fs2 retired fs1)"
      - name: slot_list_replace_stale_version_and_retires_unassigned
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[slot-list-replace-stale-study]", "errors[ERR_STALE_VERSION]", "state_machines.RandomizationSlot.UNASSIGNED_to_RELEASED"]
        distinguishing_aspect: "Second OCC write endpoint: replace carrying a stale expected_study_version gets 412; a successful replace retires every prior UNASSIGNED slot to RELEASED while installing the new list."
        test_recipe:
          setup: ["study ACTIVE (version advanced to 3 by approve+activate); first slot list uploaded (one UNASSIGNED slot) at version 3, moving the study to version 4"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-CC-2", title: "OCC", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin, captures: { study_v3: $.data.version } }
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-OLD", arm_code: "TRT-A" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin, captures: { slot_old: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-NEW", arm_code: "PBO" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /api/studies/${study}", as: SponsorAdmin, captures: { study_vnow: $.data.version } }
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-NEW", arm_code: "PBO" } ], expected_study_version: "${study_vnow}" }, as: SponsorAdmin }
            - { call: "GET /api/randomization-slots/${slot_old}", as: SponsorAdmin, captures: { old_status: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION and HTTP status 412 (first replace moved the study from 3 to 4)"
            - "second replace with the fresh version succeeds"
            - "old_status == RELEASED (prior UNASSIGNED slot retired by the successful replace)"
      - name: monitor_start_outside_window_rejected_until_clock_enters
        claim_type: scheduled_actions
        grounds: ["state_machines.MonitorVisit.SCHEDULED_to_IN_PROGRESS", "errors[ERR_OUTSIDE_VISIT_WINDOW]", "endpoints.\"POST /api/_clock/set_current_utc\""]
        distinguishing_aspect: "Clock-gated action: starting a visit scheduled for 2026-08-10 fails at the default clock (2026-08-01) with ERR_OUTSIDE_VISIT_WINDOW and succeeds after the logical clock is set inside the window."
        test_recipe:
          setup: ["study + site exist; visit scheduled [2026-08-10T09:00, 2026-08-10T17:00]"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-CC-3", title: "CLK", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/monitor-visits", payload: { site_id: "${site}", monitor_name: "CRA Jo", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T17:00:00Z" }, as: Monitor, captures: { mv: $.data.id } }
          trigger:
            - { call: "POST /api/monitor-visits/${mv}/start", as: Monitor, captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/monitor-visits/${mv}/start", as: Monitor, captures: { st: $.data.status } }
          assert:
            - "err == ERR_OUTSIDE_VISIT_WINDOW (default clock 2026-08-01 is before the window)"
            - "after setting the clock inside the window, st == IN_PROGRESS"
      - name: excursion_cascade_layer_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: excursion_unacceptable_cascades_to_lot_depletion_and_resupply
          rationale: "The N-level cascade (assess -> kits -> lot depletion -> resupply shipment) is asserted end-to-end there."
      - name: expiry_sweep_expires_kits_and_lot_then_resupplies
        claim_type: ops_run_checkpoint
        grounds: ["endpoints.\"POST /api/_ops/expiry_sweep\"", "state_machines.Lot.ACTIVE_to_EXPIRED"]
        distinguishing_aspect: "Epoch checkpoint: with the clock past lot expiry, the sweep moves the AVAILABLE kit to EXPIRED, flips the lot ACTIVE -> EXPIRED, and — zero usable kits remaining with study and site ACTIVE — auto-creates exactly one resupply kit RS-LOT-EXP-1-1 in IN_TRANSIT."
        test_recipe:
          setup: ["study ACTIVE; site ACTIVE; lot expiry 2026-09-01T00:00:00Z with single kit K-EXP AVAILABLE; clock advanced to 2026-09-02T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-CC-4", title: "SWP", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P", license_number: "L-CC-4" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-EXP-1", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2026-09-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-EXP"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: SponsorAdmin }
          trigger:
            - { call: "POST /api/_ops/expiry_sweep", as: SponsorAdmin, captures: { kits_expired: $.data.kits_expired, lots_expired: $.data.lots_expired, resupply: $.data.resupply_kits_created } }
          assert:
            - "kits_expired == 1 and lots_expired == 1 and resupply == 1"
            - "Kit.${k1}.status == EXPIRED and Lot.${lot}.status == EXPIRED"
            - "GET /api/kits?lot_id=${lot}&status=IN_TRANSIT returns exactly one kit with kit_number == RS-LOT-EXP-1-1"
      - name: immediate_consistency_after_mutation
