              as: NetworkPlanner
              captures: { e_inv: "$.data.error_id" }
            - call: "GET /fulfillment-network/packaging-supplies/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: NetworkPlanner
              captures: { e_pkg: "$.data.error_id" }
            - call: "GET /fulfillment-network/carrier-pickups/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: NetworkPlanner
              captures: { e_pickup: "$.data.error_id" }
            - call: "GET /fulfillment-network/order-lines/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: NetworkPlanner
              captures: { e_line: "$.data.error_id" }
            - call: "GET /fulfillment-network/routing-runs/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: NetworkPlanner
              captures: { e_run: "$.data.error_id" }
            - call: "GET /fulfillment-network/routing-candidates/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: NetworkPlanner
              captures: { e_cand: "$.data.error_id" }
            - call: "GET /fulfillment-network/assignment-lines/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: NetworkPlanner
              captures: { e_aline: "$.data.error_id" }
            - call: "GET /fulfillment-network/performance-windows/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: NetworkPlanner
