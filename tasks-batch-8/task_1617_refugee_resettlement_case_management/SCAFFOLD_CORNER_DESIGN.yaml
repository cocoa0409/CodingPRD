          - validations[priority=8]
        distinguishing_aspect: "VACATED setups drop out of the overlap input set: a new setup whose window overlaps the vacated setup's old window is accepted because only PREPARING/READY/OCCUPIED setups participate in conflict detection."
        test_recipe:
          setup:
            - "Case CASE-CA4A (household_size 1) had a HousingSetup on unit U covering [2026-08-10, 2027-02-10), now VACATED"
            - "Case CASE-CA4B exists (PRE_ARRIVAL, household_size 1)"
