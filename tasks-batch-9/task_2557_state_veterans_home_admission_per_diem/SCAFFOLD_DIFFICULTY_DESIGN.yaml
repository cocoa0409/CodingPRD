  - rule_id: transitive_cascade
    instances:
      - name: survey_failure_cascade_unit_home_claims
        grounds:
          - state_machines.CareUnit.CERTIFIED_to_DECERTIFIED
          - state_machines.VeteransHome.RECOGNIZED_to_SUSPENDED
          - state_machines.PerDiemClaim.DRAFT_to_VOID
          - calculations.survey_compliance_score
          - endpoints.POST_/svh/care-units/{id}/survey-result
          - entities.VeteransHome.fields.recognition_suspended_reason
        distinguishing_aspect: |
          One survey POST propagates four hops across three entity types: CareUnit certification
          (hop 1) -> CareUnit operational_posture FROZEN plus waitlist cancellation (hop 2) ->
          parent VeteransHome recognition_status SUSPENDED with recognition_suspended_reason
          UNIT_DECERTIFIED (hop 3) -> the home's DRAFT PerDiemClaim voided and its 31 CensusDay rows
          released back to unclaimed (hop 4). Stopping at hop 2 or 3 leaves a claimable claim on a
          decertified unit, which is exactly the failure this chain must exclude.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with decertified_unit_count 0 and one CERTIFIED NURSING CareUnit with licensed_bed_count 2, per_diem_rate_cents 11857."
            - "One Resident admitted 2026-08-01 with 31 RESIDENT_DAY CensusDay rows for August."
            - "One additional ELIGIBLE applicant holding an ACTIVE WaitlistEntry on the same unit."
            - "One DRAFT PerDiemClaim for (unit, 2026-08) that has already absorbed the 31 census days."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
