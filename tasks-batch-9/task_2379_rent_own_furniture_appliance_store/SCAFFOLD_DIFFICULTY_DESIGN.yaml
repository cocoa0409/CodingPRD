# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2379
# 9 rule_ids / 19 instances. Every numeric literal in an `assert:` line was
# produced by executing the §1.3 formula in code against the pinned setup.
# Every chain starts from an empty database and only uses §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: early_purchase_payoff_pct_of_remaining_vs_cash_price_minus_credit
        grounds:
          - calculations.early_purchase_payoff
          - entities.StateRtoRule.fields.early_purchase_formula
          - entities.EarlyPurchaseQuote.fields.formula_applied
          - entities.Agreement.fields.state_rule_version_snapshot
        distinguishing_aspect: |
          Two agreements with an identical unit price (120000), identical term
          (WEEKLY x 52) and an identical payment history (3 posted periods,
          rent_applied_cents 15231, loyalty_tier SILVER) produce payoffs of
          135388 cents in TX (PCT_OF_REMAINING keeps the rental markup and the
          processing fee inside the base) versus 108274 cents in MN
          (CASH_PRICE_MINUS_CREDIT prices off the depreciated cash price and
          credits 55% of rent paid), a divergence of 27114 cents driven only by
          the state rule the agreement snapshotted.
        test_recipe:
          setup:
            - "one TX StateRtoRule with early_purchase_formula PCT_OF_REMAINING, early_purchase_pct 0.55 and processing_fee_max_cents 5000"
            - "one MN StateRtoRule with early_purchase_formula CASH_PRICE_MINUS_CREDIT, rent_credit_pct 0.55 and processing_fee_max_cents 0"
            - "one VERIFIED customer holding two agreements, one at the TX store and one at the MN store, each on a NEW FURNITURE unit of cash_price_cents 120000, WEEKLY, renewal_count 52"
            - "both agreements DELIVERED at logical clock 2026-08-01T00:00:00Z and each carrying exactly three posted on-time renewal payments of 5077 cents"
            - "the customer's loyalty_points_lifetime is 225, so loyalty_tier is SILVER when both quotes are issued"
          setup_api_calls:
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "MN", late_fee_grace_days: 5, late_fee_pct: 0.05, late_fee_max_cents: 600, reinstate_threshold_months: 2, reinstate_days_short: 7, reinstate_days_long: 21, reinstatement_fee_cents: 0, early_purchase_formula: "CASH_PRICE_MINUS_CREDIT", early_purchase_pct: 0.55, rent_credit_pct: 0.55, processing_fee_max_cents: 0, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 2, quiet_hours_start_utc_hour: 21, quiet_hours_end_utc_hour: 9, repossession_paid_pct_limit: 0.50, credit_inquiry_prohibited: false, max_term_renewals: 24 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Duluth Main", state_code: "MN", service_bay_capacity: 2 }
              as: PlatformAdmin
              captures: { store_mn_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_tx_id: $.data.id }
            - call: "POST /stores/${store_mn_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-MN-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_mn_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_tx_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_tx_id: $.data.id, agr_tx_v1: $.data.version }
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_mn_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_mn_id: $.data.id, agr_mn_v1: $.data.version }
            - call: "POST /stores/${store_tx_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_tx_id: $.data.id }
            - call: "POST /stores/${store_mn_id}/delivery-crews"
              payload: { crew_name: "MN Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_mn_id: $.data.id }
            - call: "POST /agreements/${agr_tx_id}/delivery-orders"
              payload: { crew_id: "${crew_tx_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_tx_v1}" }
              as: StoreManager
              captures: { do_tx_id: $.data.id }
            - call: "POST /agreements/${agr_mn_id}/delivery-orders"
              payload: { crew_id: "${crew_mn_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_mn_v1}" }
              as: StoreManager
              captures: { do_mn_id: $.data.id }
            - call: "POST /delivery-orders/${do_tx_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
            - call: "POST /delivery-orders/${do_mn_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
            - call: "POST /agreements/${agr_tx_id}/renewal-payments"
              payload: { amount_cents: 5077, payment_method: "CASH" }
              as: SalesAssociate
            - call: "POST /agreements/${agr_tx_id}/renewal-payments"
              payload: { amount_cents: 5077, payment_method: "CASH" }
              as: SalesAssociate
            - call: "POST /agreements/${agr_tx_id}/renewal-payments"
              payload: { amount_cents: 5077, payment_method: "CASH" }
              as: SalesAssociate
            - call: "POST /agreements/${agr_mn_id}/renewal-payments"
              payload: { amount_cents: 5077, payment_method: "CASH" }
              as: SalesAssociate
            - call: "POST /agreements/${agr_mn_id}/renewal-payments"
              payload: { amount_cents: 5077, payment_method: "CASH" }
              as: SalesAssociate
            - call: "POST /agreements/${agr_mn_id}/renewal-payments"
              payload: { amount_cents: 5077, payment_method: "CASH" }
              as: SalesAssociate
            - call: "GET /agreements/${agr_tx_id}"
              as: SalesAssociate
              captures: { agr_tx_v2: $.data.version }
            - call: "GET /agreements/${agr_mn_id}"
              as: SalesAssociate
              captures: { agr_mn_v2: $.data.version }
          trigger:
            - call: "POST /agreements/${agr_tx_id}/early-purchase-quotes"
              payload: { expected_agreement_version: "${agr_tx_v2}" }
              as: SalesAssociate
              captures: { quote_tx_id: $.data.id }
            - call: "POST /agreements/${agr_mn_id}/early-purchase-quotes"
              payload: { expected_agreement_version: "${agr_mn_v2}" }
              as: SalesAssociate
              captures: { quote_mn_id: $.data.id }
          assert:
            - "Agreement.${agr_tx_id}.total_of_payments_cents == 269004 and Agreement.${agr_mn_id}.total_of_payments_cents == 264004"
            - "Agreement.${agr_tx_id}.rent_applied_cents == 15231 and Agreement.${agr_mn_id}.rent_applied_cents == 15231"
            - "Customer.${cust_id}.loyalty_points_lifetime == 225 and Customer.${cust_id}.loyalty_tier == SILVER"
            - "EarlyPurchaseQuote.${quote_tx_id}.formula_applied == PCT_OF_REMAINING"
            - "EarlyPurchaseQuote.${quote_tx_id}.pre_discount_cents == 139575"
            - "EarlyPurchaseQuote.${quote_tx_id}.loyalty_discount_cents == 4187"
            - "EarlyPurchaseQuote.${quote_tx_id}.payoff_amount_cents == 135388"
            - "EarlyPurchaseQuote.${quote_mn_id}.formula_applied == CASH_PRICE_MINUS_CREDIT"
            - "EarlyPurchaseQuote.${quote_mn_id}.pre_discount_cents == 111623"
            - "EarlyPurchaseQuote.${quote_mn_id}.loyalty_discount_cents == 3349"
            - "EarlyPurchaseQuote.${quote_mn_id}.payoff_amount_cents == 108274"
            - "EarlyPurchaseQuote.${quote_tx_id}.payoff_amount_cents - EarlyPurchaseQuote.${quote_mn_id}.payoff_amount_cents == 27114"
            - "both quotes have late_fee_component_cents == 0 and expires_at == 2026-08-08T00:00:00Z"

      - name: unit_residual_provisional_at_return_vs_final_at_grading
        grounds:
          - calculations.unit_residual_value
          - entities.InventoryUnit.fields.residual_valuation_basis
          - entities.ReturnInspection.fields.final_residual_value_cents
          - state_machines.InventoryUnit.RETURNED_PENDING_GRADE_to_AVAILABLE
        distinguishing_aspect: |
          The same InventoryUnit is valued twice by the same formula in a
          different entity dimension than the payoff instance: at return the
          PROVISIONAL variant assumes one grade notch of wear and zero
          deductions (96900 cents, basis PROVISIONAL), while at grading the
          FINAL variant substitutes the inspector's GRADE_B and subtracts
          3000 cents of damage plus one missing part (74300 cents, basis
          FINAL) — a 22600-cent grading variance on one physical unit.
        test_recipe:
          setup:
            - "one TX StateRtoRule and one TX store with a NEW FURNITURE unit of cash_price_cents 120000 and rent_cycle_count 0"
            - "a VERIFIED customer with a WEEKLY x 52 agreement on that unit, DELIVERED at 2026-08-01T00:00:00Z"
            - "the customer has returned the unit voluntarily, so the agreement is RETURN_PENDING_INSPECTION and the unit is RETURNED_PENDING_GRADE with a PROVISIONAL residual already written"
          setup_api_calls:
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /stores/${store_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_id: $.data.id }
            - call: "POST /agreements/${agr_id}/delivery-orders"
              payload: { crew_id: "${crew_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_v1}" }
              as: StoreManager
              captures: { do_id: $.data.id }
            - call: "POST /delivery-orders/${do_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
            - call: "POST /agreements/${agr_id}/return"
              payload: { return_reason: "VOLUNTARY_RETURN" }
              as: SalesAssociate
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /return-inspections/${insp_id}/grade"
              payload: { assessed_grade: "GRADE_B", damage_deduction_cents: 3000, missing_parts_count: 1 }
              as: ServiceTechnician
          assert:
            - "before the trigger InventoryUnit.${unit_id}.residual_value_cents == 96900 and residual_valuation_basis == PROVISIONAL"
            - "ReturnInspection.${insp_id}.final_residual_value_cents == 74300"
            - "InventoryUnit.${unit_id}.residual_value_cents == 74300 and residual_valuation_basis == FINAL"
            - "ReturnInspection.${insp_id}.re_rent_rate_cents == 3144"
            - "ReturnInspection.${insp_id}.depreciation_tier == TIER_2"
            - "InventoryUnit.${unit_id}.condition_grade == GRADE_B and rent_cycle_count == 1 and status == AVAILABLE"
            - "Agreement.${agr_id}.possession_status == RETURNED and payment_status == CLOSED"

  - rule_id: combinatorial_formula
    instances:

      - name: allocation_waterfall_partial_credit_plus_two_arrears_buckets
        grounds:
          - calculations.renewal_payment_allocation
          - entities.RenewalPayment.fields.allocation_partial_credit_cents
          - entities.Agreement.fields.partial_credit_cents
          - state_machines.Agreement.DELINQUENT_to_CURRENT
        distinguishing_aspect: |
          Combination mode 1 of 3 — bucket ORDER interacting with carried-forward
          money: a 9000-cent payment against 508 late fee, 500 reinstatement fee
          and 4000 cents of pre-existing partial credit advances exactly 2
          periods (rent 10154) because the leftover partial credit re-enters the
          rent pool AFTER both arrears buckets are satisfied; paying the two
          arrears from the rent pool instead, or ignoring the carried credit,
          yields 1 period and a different partial_credit_cents.
        test_recipe:
          setup:
            - "TX StateRtoRule (grace 3 days, late_fee_pct 0.10, cap 1000, reinstatement_fee_cents 500, short window 5 days)"
            - "a VERIFIED customer with a WEEKLY x 52 agreement on a NEW 120000-cent unit, renewal_rate_cents 5077, DELIVERED at 2026-08-01T00:00:00Z so period 1 is due 2026-08-08T00:00:00Z"
            - "a 4000-cent partial payment already posted while the agreement was CURRENT, leaving partial_credit_cents 4000 and periods_paid 0"
            - "a day-close run at 2026-08-12T00:00:00Z (4 days late) that assessed a 508-cent late fee, drove the agreement DELINQUENT and opened a 5-day ReinstatementWindow carrying a 500-cent reinstatement fee"
          setup_api_calls:
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /stores/${store_id}/delivery-crews"
              payload: { crew_name: "TX Crew A", setup_certified: true }
              as: StoreManager
              captures: { crew_id: $.data.id }
            - call: "POST /agreements/${agr_id}/delivery-orders"
              payload: { crew_id: "${crew_id}", service_type: "DELIVERY_ONLY", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_agreement_version: "${agr_v1}" }
              as: StoreManager
              captures: { do_id: $.data.id }
            - call: "POST /delivery-orders/${do_id}/complete"
              payload: { setup_completed: false }
              as: ServiceTechnician
            - call: "POST /agreements/${agr_id}/renewal-payments"
              payload: { amount_cents: 4000, payment_method: "CASH" }
              as: SalesAssociate
              captures: { pay1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${store_id}/day-close"
              as: StoreManager
          trigger:
            - call: "POST /agreements/${agr_id}/renewal-payments"
              payload: { amount_cents: 9000, payment_method: "CASH" }
              as: SalesAssociate
              captures: { pay2_id: $.data.id }
          assert:
            - "RenewalPayment.${pay1_id}.periods_advanced == 0 and allocation_partial_credit_cents == 4000 and loyalty_points_awarded == 0"
            - "RenewalPayment.${pay2_id}.allocation_late_fee_cents == 508"
            - "RenewalPayment.${pay2_id}.allocation_reinstatement_fee_cents == 500"
            - "RenewalPayment.${pay2_id}.periods_advanced == 2"
            - "RenewalPayment.${pay2_id}.allocation_rent_cents == 10154"
            - "RenewalPayment.${pay2_id}.allocation_partial_credit_cents == 1838"
            - "RenewalPayment.${pay2_id}.allocation_customer_credit_cents == 0"
            - "RenewalPayment.${pay2_id}.days_late == 4 and cured_delinquency == true"
            - "RenewalPayment.${pay2_id}.loyalty_points_awarded == 101"
            - "Agreement.${agr_id}.periods_paid == 2 and rent_applied_cents == 10154"
            - "Agreement.${agr_id}.partial_credit_cents == 1838"
            - "Agreement.${agr_id}.late_fee_balance_cents == 0 and late_fee_paid_cents == 508"
            - "Agreement.${agr_id}.reinstatement_fee_balance_cents == 0 and reinstatement_fee_paid_cents == 500"
            - "Agreement.${agr_id}.payment_status == CURRENT"
            - "Agreement.${agr_id}.current_period_due_at == 2026-08-22T00:00:00Z"
            - "the agreement's single ReinstatementWindow has status == USED"

      - name: pricing_ceil_rate_before_multiply_inflates_disclosed_subtotal
        grounds:
          - calculations.agreement_pricing
          - entities.Agreement.fields.rent_subtotal_cents
          - entities.Agreement.fields.monthly_equivalent_rate_cents
          - endpoints["GET /agreements/{id}/disclosure"]
        distinguishing_aspect: |
          Combination mode 2 of 3 — ROUNDING ORDER: ceil(264000 / 52) = 5077 is
