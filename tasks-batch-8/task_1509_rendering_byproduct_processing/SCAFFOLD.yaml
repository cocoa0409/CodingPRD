# =============================================================================
# Task 1509: Rendering & Byproduct Processing — scaffold seed tables
# =============================================================================

scenario: |
  Rendering & Byproduct Processing (Darling Ingredients rendering plant): raw material route collection & supplier agreement, material segregation (species/prohibited material) compliance, cooking process yield (fat/protein meal), finished product spec & customer contract pricing, odor control & permit compliance, transport of raw vs finished with sanitation, price index (tallow/meal) & margin, dead-stock pickup service fees

domain_name: rendering-byproduct-processing
api_prefix: /rendering

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # flat: peer entities with foreign key references; all collections live at
  # /rendering/<collection> and cross-references travel in request bodies.

  state_machine_shape: cyclic
  # cyclic: CookRun recook loop, SupplierAgreement/CustomerContract suspend-reinstate
  # loops, Vehicle sanitation loop, ProductLot downgrade-regrade loop,
  # SalesOrder confirm-deallocate loop, PeriodSettlement close-reopen loop.
  # Plant.posture additionally acts as a posture gate on child operations.

  relationship_patterns:
    - one_to_many        # Plant -> everything; Route -> Stops; CookRun -> ProductLots
    - cross_aggregate    # SalesOrder -> CustomerContract + ProductLot + Vehicle; RouteStop -> Route + Supplier + Agreement

  role_model: segregation_of_duties
  # SoD: creator cannot approve own agreement/contract; screener cannot adjudicate
  # own batch; reporter cannot confirm own odor event; grader cannot release own
  # lot; settlement closer cannot finalize own close.

  consistency_model: immediate
  # immediate: every mutation (including cascaded side effects) is atomic within
  # the request and visible in the response + subsequent reads.

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: plant_name, type: string, source: input, description: "Rendering plant display name" }
      - { name: location, type: string, source: input, description: "Plant location (city/state)" }
      - { name: cooker_capacity, type: integer, source: input, description: "Max number of cook runs that may be in an active cooking stage at once; must be >= 1" }
      - { name: standard_cost_cents_per_lb, type: integer, source: input, description: "Standard production cost basis per finished lb, used for margin floor checks" }
      - { name: odor_score, type: integer, source: computed, default: 1000, description: "Odor compliance score 0..1000; starts at 1000; confirmed events subtract, quiet periods recover" }
      - { name: posture, type: enum, source: system, description: "OPERATING | RESTRICTED | SUSPENDED | DECOMMISSIONED — gates child operations" }
      - { name: current_period_index, type: integer, source: system, default: 1, description: "Current settlement period counter; starts at 1; increments on advance-period" }

  - name: CompliancePermit
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: permit_number, type: string, source: input, description: "Regulator permit number" }
      - { name: odor_event_threshold, type: integer, source: input, description: "Confirmed odor events in a period that auto-suspend this permit; must be >= 1" }
      - { name: emission_limit_ppm, type: number, source: input, description: "Permitted emission ceiling in ppm" }
      - { name: issued_on, type: string, source: system, description: "Date permit was issued (null until issued)" }
      - { name: expires_on, type: string, source: input, description: "Expiry date (YYYY-MM-DD); permit EXPIRED when logical clock passes this date" }
      - { name: confirmed_violation_count, type: integer, source: computed, default: 0, description: "Confirmed odor events linked to this permit during the current period; reset to 0 by advance-period" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_ISSUANCE | ACTIVE | SUSPENDED | EXPIRED | REVOKED" }

  - name: Supplier
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: supplier_name, type: string, source: input, description: "Supplier display name" }
      - { name: supplier_type, type: enum, source: input, description: "FARM | SLAUGHTERHOUSE | BUTCHER_SHOP | GROCERY" }
      - { name: contamination_strikes, type: integer, source: computed, default: 0, description: "Count of REJECTED_AT_SITE stops with rejection_reason=PROHIBITED_MATERIAL; >=3 suspends supplier" }
      - { name: outstanding_service_fees_cents, type: integer, source: computed, default: 0, description: "Unpaid dead-stock/pickup service fees owed by supplier to the plant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: SupplierAgreement
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; agreeing supplier" }
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; denormalized owning plant (must equal supplier's plant)" }
      - { name: agreement_ref, type: string, source: input, description: "External agreement reference" }
      - { name: species_scope, type: array, source: input, description: "Allowed species tags: subset of [BOVINE, PORCINE, POULTRY, OVINE, MIXED]; must be non-empty" }
      - { name: prohibited_material_policy, type: enum, source: input, description: "ZERO_TOLERANCE | SORT_AND_RETURN" }
      - { name: accepts_dead_stock, type: boolean, source: input, description: "Whether dead-stock pickups are serviced under this agreement" }
      - { name: pickup_base_fee_cents, type: integer, source: input, description: "Flat per-stop pickup fee charged to supplier; >= 0" }
      - { name: per_lb_fee_cents, type: integer, source: input, description: "Per-pound pickup fee; >= 0" }
      - { name: mileage_rate_cents, type: integer, source: input, description: "Per-mile pickup fee; >= 0" }
      - { name: dead_stock_surcharge_cents, type: integer, source: input, default: 0, description: "Flat surcharge added when the stop is a dead-stock pickup; >= 0" }
      - { name: minimum_volume_lbs, type: integer, source: input, default: 0, description: "Supplier's delivered lbs in current period at/above which the volume discount applies; 0 disables" }
      - { name: volume_discount_pct, type: number, source: input, default: 0, description: "Discount fraction (e.g. 0.05) applied to final pickup fee once minimum_volume_lbs is reached" }
      - { name: effective_from, type: string, source: input, description: "First service date (YYYY-MM-DD) in effect, inclusive" }
      - { name: effective_to, type: string, source: input, description: "Last service date (YYYY-MM-DD) in effect, inclusive; must be >= effective_from" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of creator (SoD: approver must differ)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | SUSPENDED | TERMINATED" }

  - name: Vehicle
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: vehicle_tag, type: string, source: input, description: "Fleet tag / plate" }
      - { name: capacity_lbs, type: integer, source: input, description: "Maximum payload in lbs; must be >= 1" }
      - { name: duty_class, type: enum, source: input, description: "RAW_MATERIAL | FINISHED_PRODUCT | DUAL" }
      - { name: sanitation_status, type: enum, source: system, description: "SANITIZED | DIRTY | QUARANTINED; starts SANITIZED" }
      - { name: completed_trip_count, type: integer, source: computed, default: 0, description: "Completed collection routes + shipped sales orders" }

  - name: WashTicket
    parent: Vehicle
    common_fields: false
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; washed vehicle" }
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; must equal vehicle's plant" }
      - { name: wash_type, type: enum, source: input, description: "STANDARD | DEEP (DEEP required to clear QUARANTINED)" }
      - { name: washed_at, type: datetime, source: input, description: "Wash timestamp (ISO8601)" }
      - { name: detergent_ppm, type: number, source: input, description: "Detergent concentration used" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of recorder" }

  - name: CollectionRoute
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; assigned vehicle" }
      - { name: route_code, type: string, source: input, description: "Human route code" }
      - { name: service_date, type: string, source: input, description: "Service date (YYYY-MM-DD); must fall inside each stop's agreement window" }
      - { name: scheduled_departure, type: datetime, source: input, description: "Planned departure (ISO8601, whole hour)" }
      - { name: scheduled_return, type: datetime, source: input, description: "Planned return (ISO8601, whole hour); must be > scheduled_departure" }
      - { name: total_collected_lbs, type: integer, source: computed, default: 0, description: "Sum of actual_weight_lbs over stops in DELIVERED or VOIDED, computed at route completion" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: RouteStop
    parent: CollectionRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> CollectionRoute.id; parent route" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; pickup supplier" }
      - { name: agreement_id, type: string, source: input, description: "FK -> SupplierAgreement.id; governing agreement (must belong to supplier)" }
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; denormalized owning plant (must equal route's plant)" }
      - { name: sequence_no, type: integer, source: input, description: "Stop order within route; >= 1; unique per route among non-CANCELLED stops" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Planned arrival window start (must be within route departure..return)" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Planned arrival window end; must be > window start and within route window" }
      - { name: estimated_weight_lbs, type: integer, source: input, description: "Estimated pickup lbs; >= 1" }
      - { name: estimated_distance_miles, type: integer, source: input, description: "Estimated one-way miles; >= 0" }
      - { name: species_tag, type: enum, source: input, description: "BOVINE | PORCINE | POULTRY | OVINE | MIXED; must be in agreement species_scope" }
      - { name: is_dead_stock, type: boolean, source: input, description: "True when this is a dead-stock pickup (surcharge applies; agreement must accept dead stock)" }
      - { name: actual_weight_lbs, type: integer, source: system, description: "Scale weight recorded at collect (null until collected)" }
      - { name: actual_distance_miles, type: integer, source: system, description: "Actual miles recorded at collect" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee estimate at creation: base + est_weight*per_lb + est_miles*mileage + dead-stock surcharge; NO volume discount" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Settled fee at collect: actuals + dead-stock surcharge, minus volume discount if supplier period volume threshold met; null until collected" }
      - { name: rejection_reason, type: enum, source: system, description: "PROHIBITED_MATERIAL | TEMPERATURE_EXCURSION | OTHER; null unless rejected" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ARRIVED | COLLECTED | DELIVERED | REJECTED_AT_SITE | MISSED | CANCELLED | VOIDED" }

  - name: InboundBatch
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; origin supplier" }
      - { name: agreement_id, type: string, source: input, description: "FK -> SupplierAgreement.id; governing agreement" }
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id; set when created by stop collect; null for walk-in receiving" }
      - { name: species, type: enum, source: input, description: "BOVINE | PORCINE | POULTRY | OVINE | MIXED" }
      - { name: weight_lbs, type: integer, source: input, description: "Received gross lbs; >= 1" }
      - { name: temperature_f, type: number, source: input, description: "Material temperature at receipt (F)" }
      - { name: received_at, type: datetime, source: input, description: "Receipt timestamp (ISO8601)" }
      - { name: screening_result, type: enum, source: system, description: "PENDING | PASS | FAIL_PROHIBITED | FAIL_TEMPERATURE" }
      - { name: screened_by, type: string, source: system, description: "X-User-ID of screener (null until screened; SoD: adjudicator must differ)" }
      - { name: reserved_lbs, type: integer, source: computed, default: 0, description: "Lbs reserved by cook runs in STAGED/COOKING/SETTLING/PRESSING/FAILED" }
      - { name: consumed_lbs, type: integer, source: computed, default: 0, description: "Lbs consumed by COMPLETED cook runs" }
      - { name: remaining_lbs, type: integer, source: computed, description: "= weight_lbs - reserved_lbs - consumed_lbs" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACCEPTED | QUARANTINED | REJECTED | DEPLETED" }

  - name: CookRun
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: cooker_line, type: integer, source: input, description: "Cook line identifier; >= 1" }
      - { name: recipe, type: enum, source: input, description: "RUMINANT_RENDER | PORCINE_RENDER | POULTRY_RENDER | MIXED_RENDER" }
      - { name: planned_inputs, type: array, source: input, description: "List of {batch_id, weight_lbs}; non-empty; each weight_lbs >= 1 and <= batch remaining_lbs" }
      - { name: total_input_lbs, type: integer, source: computed, description: "Sum of planned input weights" }
      - { name: theoretical_fat_lbs, type: integer, source: computed, description: "Sum over inputs of weight * species fat coefficient" }
      - { name: theoretical_meal_lbs, type: integer, source: computed, description: "Sum over inputs of weight * species meal coefficient" }
      - { name: actual_fat_output_lbs, type: integer, source: input, description: "Measured fat output recorded at complete (null until then)" }
      - { name: actual_meal_output_lbs, type: integer, source: input, description: "Measured meal output recorded at complete (null until then)" }
      - { name: yield_variance_pct, type: number, source: computed, description: "(actual_total - theoretical_total) / theoretical_total * 100, 2dp round_half_up; null until complete" }
      - { name: energy_cost_cents, type: integer, source: computed, description: "Tiered energy cost computed at complete; null until then" }
      - { name: cook_start, type: datetime, source: input, description: "Planned cook window start (ISO8601, whole hour)" }
      - { name: cook_end, type: datetime, source: input, description: "Planned cook window end; must be > cook_start; duration must be whole hours" }
      - { name: recook_count, type: integer, source: system, default: 0, description: "Number of FAILED -> STAGED recook cycles" }
      - { name: failure_reason, type: string, source: system, description: "Failure note recorded at fail (null otherwise)" }
      - { name: status, type: enum, source: system, description: "STAGED | COOKING | SETTLING | PRESSING | COMPLETED | FAILED | CANCELLED" }

  - name: ProductLot
    parent: CookRun
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; denormalized from cook run" }
      - { name: cook_run_id, type: string, source: system, description: "FK -> CookRun.id; producing cook run" }
      - { name: product_type, type: enum, source: system, description: "TALLOW | YELLOW_GREASE | PROTEIN_MEAL | FEATHER_MEAL; derived from recipe" }
      - { name: quantity_lbs, type: integer, source: system, description: "Produced lbs (= recorded actual output)" }
      - { name: available_lbs, type: integer, source: computed, description: "= quantity_lbs - allocated_lbs" }
      - { name: allocated_lbs, type: integer, source: computed, default: 0, description: "Lbs allocated to CONFIRMED sales orders" }
      - { name: lab_moisture_pct, type: number, source: input, description: "Lab moisture % (null until graded)" }
      - { name: lab_ffa_pct, type: number, source: input, description: "Lab free-fatty-acid % (fats only; null until graded)" }
      - { name: lab_protein_pct, type: number, source: input, description: "Lab protein % (meals only; null until graded)" }
      - { name: grade, type: enum, source: system, description: "UNGRADED | PREMIUM | STANDARD | FEED_GRADE | OFF_SPEC; computed at grade/regrade" }
      - { name: graded_by, type: string, source: system, description: "X-User-ID of grading lab tech (SoD: releaser must differ)" }
      - { name: status, type: enum, source: system, description: "LAB_PENDING | GRADED | RELEASED | DOWNGRADED | REJECTED | DEPLETED" }

  - name: CustomerContract
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: customer_name, type: string, source: input, description: "Customer display name" }
      - { name: product_type, type: enum, source: input, description: "TALLOW | YELLOW_GREASE | PROTEIN_MEAL | FEATHER_MEAL" }
      - { name: spec_max_moisture_pct, type: number, source: input, description: "Contract spec: max moisture %" }
      - { name: spec_max_ffa_pct, type: number, source: input, description: "Contract spec: max FFA % (fats)" }
      - { name: spec_min_protein_pct, type: number, source: input, description: "Contract spec: min protein % (meals; 0 for fats)" }
      - { name: pricing_mode, type: enum, source: input, description: "FIXED | INDEX_LINKED" }
      - { name: base_price_cents_per_lb, type: integer, source: input, description: "Fixed price per lb (required when pricing_mode=FIXED; ignored otherwise)" }
      - { name: index_product, type: enum, source: input, description: "TALLOW | MEAL; required when pricing_mode=INDEX_LINKED" }
      - { name: index_basis_adjustment_cents, type: integer, source: input, description: "Signed cents/lb added to the index (required when INDEX_LINKED; may be negative)" }
      - { name: volume_commitment_lbs, type: integer, source: input, description: "Contracted volume per period; informational" }
      - { name: tier_discounts, type: array, source: input, description: "List of {threshold_lbs, discount_pct} sorted ascending by threshold; empty list allowed" }
      - { name: margin_floor_pct, type: number, source: input, description: "Minimum acceptable order margin pct (e.g. 15.0)" }
      - { name: effective_from, type: string, source: input, description: "First ship date in effect, inclusive" }
      - { name: effective_to, type: string, source: input, description: "Last ship date in effect, inclusive; >= effective_from" }
      - { name: delivered_volume_lbs, type: integer, source: computed, default: 0, description: "Lifetime shipped lbs under this contract" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of creator (SoD: approver must differ)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | SUSPENDED | TERMINATED" }

  - name: SalesOrder
    parent: CustomerContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> CustomerContract.id; governing contract" }
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; must equal contract's plant" }
      - { name: quantity_lbs, type: integer, source: input, description: "Ordered lbs; >= 1" }
      - { name: requested_ship_date, type: string, source: input, description: "Ship date (YYYY-MM-DD); selects the price index entry and must be inside contract window" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Rounded price per lb computed at price step (null until priced)" }
      - { name: applied_index_price_cents, type: integer, source: computed, description: "Index cents/lb selected for INDEX_LINKED pricing; null for FIXED" }
      - { name: applied_discount_pct, type: number, source: computed, description: "Tier discount fraction applied (null until priced)" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "quantity_lbs * unit_price_cents (null until priced)" }
      - { name: discount_amount_cents, type: integer, source: computed, description: "round_half_up(gross * applied_discount_pct)" }
      - { name: freight_surcharge_cents, type: integer, source: computed, description: "Flat per-order freight surcharge added after discount" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross - discount + freight" }
      - { name: margin_pct, type: number, source: computed, description: "(unit_price - plant.standard_cost_cents_per_lb) / unit_price * 100, 2dp round_half_up" }
      - { name: allocations, type: array, source: system, description: "List of {lot_id, quantity_lbs} recorded at confirm" }
      - { name: shipped_vehicle_id, type: string, source: system, description: "Vehicle used at ship (null until shipped)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PRICED | CONFIRMED | SHIPPED | INVOICED | CANCELLED" }

  - name: PriceIndexEntry
    parent: Plant
    common_fields: false
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: index_product, type: enum, source: input, description: "TALLOW | MEAL" }
      - { name: effective_date, type: string, source: input, description: "First date (YYYY-MM-DD) this quote applies" }
      - { name: price_cents_per_lb, type: integer, source: input, description: "Quoted cents per lb; >= 1" }
      - { name: source, type: enum, source: input, description: "USDA_AMS | JACOBSEN | INTERNAL" }
      - { name: published_by, type: string, source: system, description: "X-User-ID of publisher" }

  - name: OdorEvent
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: permit_id, type: string, source: system, description: "FK -> CompliancePermit.id; the plant's ACTIVE permit at confirm time (null while REPORTED/DISMISSED or if none active)" }
      - { name: reported_at, type: datetime, source: input, description: "Complaint timestamp (ISO8601)" }
      - { name: location_description, type: string, source: input, description: "Where the odor was reported" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: reported_by, type: string, source: system, description: "X-User-ID of reporter (SoD: confirmer/dismisser must differ)" }
      - { name: confirmed_by, type: string, source: system, description: "X-User-ID of confirmer (null until confirmed)" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | DISMISSED" }

  - name: PeriodSettlement
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: period_index, type: integer, source: system, description: "Settlement period number (matches Plant.current_period_index at creation)" }
      - { name: pickup_fees_accrued_cents, type: integer, source: computed, default: 0, description: "Sum of final fees accrued minus reversals in this period" }
      - { name: product_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of invoiced order net amounts in this period" }
      - { name: energy_costs_cents, type: integer, source: computed, default: 0, description: "Sum of cook-run energy costs completed in this period" }
      - { name: transport_costs_cents, type: integer, source: computed, default: 0, description: "Sum of actual miles * transport rate for stops collected in this period" }
      - { name: confirmed_odor_events, type: integer, source: system, default: 0, description: "Odor events confirmed during this period (drives odor recovery)" }
      - { name: gross_margin_cents, type: integer, source: computed, description: "= product_revenue + pickup_fees - energy_costs - transport_costs" }
      - { name: margin_pct, type: number, source: computed, description: "gross_margin / (product_revenue + pickup_fees) * 100, 2dp round_half_up; null when denominator is 0" }
      - { name: closed_by, type: string, source: system, description: "X-User-ID of closer (null until closed; SoD: finalizer must differ)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | REOPENED | FINALIZED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Plant
    initial_state: OPERATING
    terminal_states: [DECOMMISSIONED]
    # posture is a derived gate: every mutating operational endpoint checks it
    transitions:
      - from: OPERATING
        to: RESTRICTED
        trigger: "system (automatic when odor_score drops below 600 after a confirmed odor event)"
        actor: system
        preconditions: []
        side_effects:
          - "No direct child mutation; posture gate now blocks route dispatch and cook-run start (ERR_PLANT_RESTRICTED)"
      - from: RESTRICTED
        to: OPERATING
        trigger: "system (automatic when odor_score recovers to >= 700 via advance-period recovery)"
        actor: system
        preconditions:
          - "Plant's ACTIVE permit (if any) is not SUSPENDED/REVOKED/EXPIRED"
        side_effects: []
      - from: OPERATING
        to: SUSPENDED
        trigger: "system (automatic when the plant's ACTIVE CompliancePermit becomes SUSPENDED, EXPIRED, or REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "All CollectionRoutes in PLANNED/DISPATCHED/IN_PROGRESS -> CANCELLED"
          - "Their RouteStops in SCHEDULED/ARRIVED -> CANCELLED; stops in COLLECTED -> VOIDED with final fee reversed from the current PeriodSettlement and their InboundBatch -> REJECTED"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system (automatic when the plant's ACTIVE CompliancePermit becomes SUSPENDED, EXPIRED, or REVOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same route/stop/batch/fee cascade as OPERATING -> SUSPENDED"
      - from: SUSPENDED
        to: OPERATING
        trigger: "system (automatic when a CompliancePermit is reinstated/issued and odor_score >= 700)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system (automatic when a CompliancePermit is reinstated/issued and odor_score < 700)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPERATING
        to: DECOMMISSIONED
        trigger: "POST /rendering/plants/{id}/decommission"
        actor: PlantManager
        preconditions:
          - "Posture is OPERATING, RESTRICTED, or SUSPENDED (ERR_PLANT_DECOMMISSIONED if already DECOMMISSIONED)"
        side_effects:
          - "All non-terminal routes -> CANCELLED (with stop cascade); all non-terminal sales orders -> CANCELLED"
      - from: RESTRICTED
        to: DECOMMISSIONED
        trigger: "POST /rendering/plants/{id}/decommission"
        actor: PlantManager
        preconditions: []
        side_effects: ["Same cascade as OPERATING -> DECOMMISSIONED"]
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /rendering/plants/{id}/decommission"
        actor: PlantManager
        preconditions: []
        side_effects: ["Same cascade as OPERATING -> DECOMMISSIONED"]

  - entity: CompliancePermit
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: PENDING_ISSUANCE
        trigger: "POST /rendering/permits/{id}/submit"
        actor: ComplianceOfficer
        preconditions: ["Permit in DRAFT (ERR_PERMIT_INVALID_STATE)"]
        side_effects: []
      - from: PENDING_ISSUANCE
        to: ACTIVE
        trigger: "POST /rendering/permits/{id}/issue"
        actor: Regulator
        preconditions:
          - "Permit in PENDING_ISSUANCE (ERR_PERMIT_INVALID_STATE)"
          - "No other permit for the same plant is ACTIVE or SUSPENDED (ERR_DUPLICATE_ACTIVE_PERMIT)"
          - "expires_on >= current logical date (ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "issued_on set to current logical date"
          - "If plant.posture == SUSPENDED: recompute posture (OPERATING if odor_score >= 700 else RESTRICTED)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rendering/permits/{id}/suspend OR system (automatic when confirmed_violation_count reaches odor_event_threshold)"
        actor: "Regulator | system"
        preconditions: ["Permit in ACTIVE (ERR_PERMIT_INVALID_STATE)"]
        side_effects:
          - "Plant posture -> SUSPENDED (cascades to routes/stops/batches/fees per Plant machine)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rendering/permits/{id}/reinstate"
        actor: Regulator
        preconditions:
          - "Permit in SUSPENDED (ERR_PERMIT_INVALID_STATE)"
          - "expires_on >= current logical date (ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "confirmed_violation_count reset to 0"
          - "Plant posture recomputed (OPERATING if odor_score >= 700 else RESTRICTED)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /rendering/permits/{id}/revoke"
        actor: Regulator
        preconditions: ["Permit in ACTIVE or SUSPENDED (ERR_PERMIT_INVALID_STATE)"]
        side_effects: ["Plant posture -> SUSPENDED with route/stop cascade"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /rendering/permits/{id}/revoke"
        actor: Regulator
        preconditions: ["Permit in ACTIVE or SUSPENDED (ERR_PERMIT_INVALID_STATE)"]
        side_effects: ["Plant already SUSPENDED; no further cascade"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic at advance-period when expires_on < current logical date)"
        actor: system
        preconditions: []
        side_effects: ["Plant posture -> SUSPENDED with route/stop cascade"]

  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when contamination_strikes reaches 3)"
        actor: system
        preconditions: []
        side_effects:
          - "All SupplierAgreements of this supplier in ACTIVE -> SUSPENDED"
          - "All RouteStops of this supplier in SCHEDULED or ARRIVED -> CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rendering/suppliers/{id}/reinstate"
        actor: ProcurementManager
        preconditions: ["Supplier in SUSPENDED (ERR_SUPPLIER_INVALID_STATE)"]
        side_effects:
          - "contamination_strikes reset to 0"
          - "NOTE: agreements stay SUSPENDED; each must be reinstated separately"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rendering/suppliers/{id}/terminate"
        actor: ProcurementManager
        preconditions: ["Supplier in ACTIVE or SUSPENDED (ERR_SUPPLIER_INVALID_STATE)"]
        side_effects:
          - "All non-TERMINATED SupplierAgreements -> TERMINATED"
          - "All RouteStops of this supplier in SCHEDULED or ARRIVED -> CANCELLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /rendering/suppliers/{id}/terminate"
        actor: ProcurementManager
        preconditions: ["Supplier in ACTIVE or SUSPENDED (ERR_SUPPLIER_INVALID_STATE)"]
        side_effects: ["Same cascade as ACTIVE -> TERMINATED"]

  - entity: SupplierAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rendering/supplier-agreements/{id}/submit"
        actor: ProcurementManager
        preconditions: ["Agreement in DRAFT (ERR_AGREEMENT_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /rendering/supplier-agreements/{id}/approve"
        actor: PlantManager
        preconditions:
          - "Agreement in SUBMITTED (ERR_AGREEMENT_INVALID_STATE)"
          - "X-User-ID != created_by (ERR_SOD_VIOLATION)"
          - "No overlapping ACTIVE or SUSPENDED agreement for the same supplier with overlapping [effective_from, effective_to] window (ERR_AGREEMENT_WINDOW_OVERLAP)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /rendering/supplier-agreements/{id}/return-to-draft"
        actor: PlantManager
        preconditions: ["Agreement in SUBMITTED (ERR_AGREEMENT_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rendering/supplier-agreements/{id}/suspend OR system (supplier strike cascade)"
        actor: "PlantManager | system"
        preconditions: ["Agreement in ACTIVE (ERR_AGREEMENT_INVALID_STATE for manual)"]
        side_effects:
          - "All RouteStops referencing this agreement in SCHEDULED or ARRIVED -> CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rendering/supplier-agreements/{id}/reinstate"
        actor: PlantManager
        preconditions:
          - "Agreement in SUSPENDED (ERR_AGREEMENT_INVALID_STATE)"
          - "Supplier is ACTIVE (ERR_SUPPLIER_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rendering/supplier-agreements/{id}/terminate"
        actor: PlantManager
        preconditions: ["Agreement in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED (ERR_AGREEMENT_INVALID_STATE)"]
        side_effects:
          - "All RouteStops referencing this agreement in SCHEDULED or ARRIVED -> CANCELLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /rendering/supplier-agreements/{id}/terminate"
        actor: PlantManager
        preconditions: ["Agreement in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED"]
        side_effects: ["Same stop-cancellation cascade"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /rendering/supplier-agreements/{id}/terminate"
        actor: PlantManager
        preconditions: ["Agreement in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: TERMINATED
        trigger: "POST /rendering/supplier-agreements/{id}/terminate"
        actor: PlantManager
        preconditions: ["Agreement in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED"]
        side_effects: []

  - entity: Vehicle
    initial_state: SANITIZED
    terminal_states: []
    transitions:
      - from: SANITIZED
        to: DIRTY
        trigger: "system (automatic when an assigned CollectionRoute completes OR a sales order shipped on this vehicle)"
        actor: system
        preconditions: []
        side_effects: ["completed_trip_count += 1"]
      - from: DIRTY
        to: SANITIZED
        trigger: "POST /rendering/vehicles/{id}/wash-tickets with result=PASS (STANDARD or DEEP)"
        actor: RouteDispatcher
        preconditions: ["Vehicle sanitation_status in DIRTY (wash on SANITIZED is a no-op 200; wash on QUARANTINED requires DEEP)"]
        side_effects: ["sanitation_status -> SANITIZED on PASS; unchanged on FAIL"]
      - from: DIRTY
        to: QUARANTINED
        trigger: "POST /rendering/vehicles/{id}/quarantine"
        actor: ComplianceOfficer
        preconditions: ["Vehicle sanitation_status in DIRTY or SANITIZED (ERR_VEHICLE_INVALID_STATE if already QUARANTINED)"]
        side_effects: []
      - from: SANITIZED
        to: QUARANTINED
        trigger: "POST /rendering/vehicles/{id}/quarantine"
        actor: ComplianceOfficer
        preconditions: ["Vehicle sanitation_status in DIRTY or SANITIZED (ERR_VEHICLE_INVALID_STATE if already QUARANTINED)"]
        side_effects: []
      - from: QUARANTINED
        to: SANITIZED
        trigger: "POST /rendering/vehicles/{id}/wash-tickets with wash_type=DEEP and result=PASS"
        actor: RouteDispatcher
        preconditions: ["wash_type must be DEEP from QUARANTINED (ERR_DEEP_WASH_REQUIRED)"]
        side_effects: ["sanitation_status -> SANITIZED on PASS; unchanged on FAIL"]

  - entity: CollectionRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /rendering/collection-routes/{id}/dispatch"
        actor: RouteDispatcher
        preconditions:
          - "Route in PLANNED (ERR_ROUTE_INVALID_STATE)"
          - "Plant posture OPERATING (ERR_PLANT_RESTRICTED if RESTRICTED; ERR_PLANT_SUSPENDED if SUSPENDED)"
          - "At least one non-CANCELLED stop exists (ERR_ROUTE_EMPTY)"
          - "Vehicle sanitation_status == SANITIZED (ERR_VEHICLE_NOT_SANITIZED)"
          - "Vehicle duty_class in {RAW_MATERIAL, DUAL} (ERR_VEHICLE_DUTY_MISMATCH)"
          - "Current logical time <= scheduled_return (ERR_ROUTE_WINDOW_PASSED)"
        side_effects: []
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "system (automatic when the first stop transitions to ARRIVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /rendering/collection-routes/{id}/complete"
        actor: RouteDispatcher
        preconditions:
          - "Route in DISPATCHED or IN_PROGRESS (ERR_ROUTE_INVALID_STATE)"
          - "Every stop is in a terminal state: DELIVERED, REJECTED_AT_SITE, MISSED, CANCELLED, or VOIDED (ERR_STOP_INVALID_STATE)"
        side_effects:
          - "Vehicle sanitation_status -> DIRTY; completed_trip_count += 1"
          - "total_collected_lbs = sum of actual_weight_lbs over stops in DELIVERED or VOIDED"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /rendering/collection-routes/{id}/complete"
        actor: RouteDispatcher
        preconditions: ["Route in DISPATCHED or IN_PROGRESS", "Every stop terminal"]
        side_effects: ["Same as IN_PROGRESS -> COMPLETED"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /rendering/collection-routes/{id}/cancel OR system (plant suspension/decommission cascade)"
        actor: "RouteDispatcher | system"
        preconditions:
          - "Manual cancel: route in PLANNED, DISPATCHED, or IN_PROGRESS (ERR_ROUTE_INVALID_STATE)"
          - "Manual cancel: no stop in COLLECTED (ERR_ROUTE_HAS_COLLECTED_STOPS)"
        side_effects:
          - "All stops in SCHEDULED or ARRIVED -> CANCELLED"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /rendering/collection-routes/{id}/cancel OR system cascade"
        actor: "RouteDispatcher | system"
        preconditions: ["Same as PLANNED -> CANCELLED"]
        side_effects: ["Same stop cascade; system cascade additionally voids COLLECTED stops (fee reversal + batch REJECTED)"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /rendering/collection-routes/{id}/cancel OR system cascade"
        actor: "RouteDispatcher | system"
        preconditions: ["Same as PLANNED -> CANCELLED"]
        side_effects: ["Same as DISPATCHED -> CANCELLED"]

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, REJECTED_AT_SITE, MISSED, CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /rendering/route-stops/{id}/arrive"
        actor: RouteDispatcher
        preconditions:
          - "Stop in SCHEDULED (ERR_STOP_INVALID_STATE)"
          - "Route in DISPATCHED or IN_PROGRESS (ERR_ROUTE_INVALID_STATE)"
        side_effects: ["If route was DISPATCHED: route -> IN_PROGRESS"]
      - from: ARRIVED
        to: COLLECTED
        trigger: "POST /rendering/route-stops/{id}/collect"
        actor: RouteDispatcher
        preconditions:
          - "Stop in ARRIVED (ERR_STOP_INVALID_STATE)"
          - "Current-period PeriodSettlement in OPEN or REOPENED (ERR_PERIOD_CLOSED)"
        side_effects:
          - "actual_weight_lbs / actual_distance_miles recorded"
          - "final_fee_cents computed (pickup_service_fee FINAL variant)"
          - "InboundBatch created (RECEIVED, screening_result=PENDING, weight=actual_weight_lbs, route_stop_id=this stop)"
          - "Current PeriodSettlement: pickup_fees_accrued_cents += final_fee; transport_costs_cents += actual_miles * TRANSPORT_COST_PER_MILE_CENTS"
          - "Supplier.outstanding_service_fees_cents += final_fee"
      - from: ARRIVED
        to: REJECTED_AT_SITE
        trigger: "POST /rendering/route-stops/{id}/reject-at-site"
        actor: RouteDispatcher
        preconditions: ["Stop in ARRIVED (ERR_STOP_INVALID_STATE)"]
        side_effects:
          - "rejection_reason recorded (PROHIBITED_MATERIAL | TEMPERATURE_EXCURSION | OTHER); no fee accrues (final_fee_cents stays null)"
          - "If rejection_reason == PROHIBITED_MATERIAL: Supplier.contamination_strikes += 1; at 3 strikes Supplier -> SUSPENDED which suspends its ACTIVE agreements and cancels its SCHEDULED/ARRIVED stops"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /rendering/route-stops/{id}/miss"
        actor: RouteDispatcher
        preconditions:
          - "Stop in SCHEDULED (ERR_STOP_INVALID_STATE)"
          - "Route in DISPATCHED or IN_PROGRESS (ERR_ROUTE_INVALID_STATE)"
        side_effects: []
      - from: COLLECTED
        to: DELIVERED
        trigger: "POST /rendering/route-stops/{id}/deliver"
        actor: RouteDispatcher
        preconditions: ["Stop in COLLECTED (ERR_STOP_INVALID_STATE)"]
        side_effects: []
      - from: COLLECTED
        to: VOIDED
        trigger: "POST /rendering/route-stops/{id}/void"
        actor: RouteDispatcher
        preconditions:
          - "Stop in COLLECTED or DELIVERED (ERR_STOP_INVALID_STATE)"
          - "Linked InboundBatch has consumed_lbs == 0 and reserved_lbs == 0 (ERR_BATCH_INVALID_STATE)"
          - "Current-period PeriodSettlement in OPEN or REOPENED (ERR_PERIOD_CLOSED)"
        side_effects:
          - "PeriodSettlement.pickup_fees_accrued_cents -= final_fee_cents; transport_costs_cents -= actual_miles * rate"
          - "Supplier.outstanding_service_fees_cents -= final_fee_cents"
          - "Linked InboundBatch -> REJECTED"
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /rendering/route-stops/{id}/void"
        actor: RouteDispatcher
        preconditions: ["Same as COLLECTED -> VOIDED"]
        side_effects: ["Same reversal as COLLECTED -> VOIDED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (route cancel cascade / supplier suspension cascade / agreement suspension cascade / plant suspension cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ARRIVED
        to: CANCELLED
        trigger: "system (same cascades)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InboundBatch
    initial_state: RECEIVED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /rendering/inbound-batches/{id}/screen with screening_result=PASS"
        actor: ScalehouseOperator
        preconditions: ["Batch in RECEIVED (ERR_BATCH_INVALID_STATE)"]
        side_effects: ["screening_result=PASS; screened_by recorded"]
      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /rendering/inbound-batches/{id}/screen with FAIL_TEMPERATURE, OR with FAIL_PROHIBITED when agreement.prohibited_material_policy == SORT_AND_RETURN"
        actor: ScalehouseOperator
        preconditions: ["Batch in RECEIVED (ERR_BATCH_INVALID_STATE)"]
        side_effects: ["screening_result recorded; screened_by recorded"]
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /rendering/inbound-batches/{id}/screen with FAIL_PROHIBITED when agreement.prohibited_material_policy == ZERO_TOLERANCE"
        actor: ScalehouseOperator
        preconditions: ["Batch in RECEIVED (ERR_BATCH_INVALID_STATE)"]
        side_effects: ["screening_result=FAIL_PROHIBITED; screened_by recorded"]
      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /rendering/inbound-batches/{id}/adjudicate with decision=ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "Batch in QUARANTINED (ERR_BATCH_INVALID_STATE)"
          - "X-User-ID != screened_by (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /rendering/inbound-batches/{id}/adjudicate with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "Batch in QUARANTINED (ERR_BATCH_INVALID_STATE)"
          - "X-User-ID != screened_by (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: ACCEPTED
        to: DEPLETED
        trigger: "system (automatic when remaining_lbs reaches 0 and consumed_lbs > 0 after a cook run completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CookRun
    initial_state: STAGED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: STAGED
        to: COOKING
        trigger: "POST /rendering/cook-runs/{id}/start"
        actor: ProductionSupervisor
        preconditions:
          - "Cook run in STAGED (ERR_COOK_RUN_INVALID_STATE)"
          - "Plant posture OPERATING (ERR_PLANT_RESTRICTED / ERR_PLANT_SUSPENDED)"
          - "Every input batch still has sufficient remaining_lbs (ERR_WEIGHT_EXCEEDS_REMAINING)"
        side_effects: []
      - from: COOKING
        to: SETTLING
        trigger: "POST /rendering/cook-runs/{id}/advance"
        actor: ProductionSupervisor
        preconditions: ["Cook run in COOKING (ERR_COOK_RUN_INVALID_STATE)"]
        side_effects: []
      - from: SETTLING
        to: PRESSING
        trigger: "POST /rendering/cook-runs/{id}/advance"
        actor: ProductionSupervisor
        preconditions: ["Cook run in SETTLING (ERR_COOK_RUN_INVALID_STATE)"]
        side_effects: []
      - from: PRESSING
        to: COMPLETED
        trigger: "POST /rendering/cook-runs/{id}/complete"
        actor: ProductionSupervisor
        preconditions:
          - "Cook run in PRESSING (ERR_COOK_RUN_INVALID_STATE)"
          - "abs(yield_variance_pct) <= 25 OR override_note provided (ERR_YIELD_OUT_OF_TOLERANCE)"
        side_effects:
          - "theoretical yields + yield_variance_pct finalized; energy_cost_cents computed (tiered)"
          - "For each input batch: reserved_lbs -= weight, consumed_lbs += weight; batch -> DEPLETED if remaining_lbs == 0"
          - "ProductLots created (LAB_PENDING): fat lot + meal lot per recipe mapping"
          - "Current PeriodSettlement.energy_costs_cents += energy_cost_cents"
      - from: COOKING
        to: FAILED
        trigger: "POST /rendering/cook-runs/{id}/fail"
        actor: ProductionSupervisor
        preconditions: ["Cook run in COOKING or SETTLING (ERR_COOK_RUN_INVALID_STATE)"]
        side_effects: ["failure_reason recorded; batch reservations retained"]
      - from: SETTLING
        to: FAILED
        trigger: "POST /rendering/cook-runs/{id}/fail"
        actor: ProductionSupervisor
        preconditions: ["Cook run in COOKING or SETTLING (ERR_COOK_RUN_INVALID_STATE)"]
        side_effects: ["failure_reason recorded; batch reservations retained"]
      - from: FAILED
        to: STAGED
        trigger: "POST /rendering/cook-runs/{id}/restage"
        actor: ProductionSupervisor
        preconditions: ["Cook run in FAILED (ERR_COOK_RUN_INVALID_STATE)"]
        side_effects: ["recook_count += 1; failure_reason cleared; batch reservations retained"]
      - from: STAGED
        to: CANCELLED
        trigger: "POST /rendering/cook-runs/{id}/cancel"
        actor: ProductionSupervisor
        preconditions: ["Cook run in STAGED or FAILED (ERR_COOK_RUN_INVALID_STATE)"]
        side_effects:
          - "For each input batch: reserved_lbs -= planned weight (mass conservation compensation)"
      - from: FAILED
        to: CANCELLED
        trigger: "POST /rendering/cook-runs/{id}/cancel"
        actor: ProductionSupervisor
        preconditions: ["Cook run in STAGED or FAILED (ERR_COOK_RUN_INVALID_STATE)"]
        side_effects: ["Same reservation release"]

  - entity: ProductLot
    initial_state: LAB_PENDING
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: LAB_PENDING
        to: GRADED
        trigger: "POST /rendering/product-lots/{id}/grade"
        actor: QualityLabTech
        preconditions: ["Lot in LAB_PENDING (ERR_LOT_INVALID_STATE)"]
        side_effects: ["grade computed from lab values (grade_determination); graded_by recorded; if computed grade == OFF_SPEC: lot -> REJECTED instead"]
      - from: GRADED
        to: RELEASED
        trigger: "POST /rendering/product-lots/{id}/release"
        actor: ProductionSupervisor
        preconditions:
          - "Lot in GRADED (ERR_LOT_INVALID_STATE)"
          - "grade != OFF_SPEC (ERR_LOT_INVALID_STATE)"
          - "X-User-ID != graded_by (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: GRADED
        to: DOWNGRADED
        trigger: "POST /rendering/product-lots/{id}/downgrade"
        actor: QualityLabTech
        preconditions: ["Lot in GRADED or RELEASED (ERR_LOT_INVALID_STATE)"]
        side_effects: []
      - from: RELEASED
        to: DOWNGRADED
        trigger: "POST /rendering/product-lots/{id}/downgrade"
        actor: QualityLabTech
        preconditions:
          - "Lot in GRADED or RELEASED (ERR_LOT_INVALID_STATE)"
          - "Lot has allocated_lbs == 0 (ERR_LOT_INVALID_STATE)"
        side_effects: []
      - from: DOWNGRADED
        to: GRADED
        trigger: "POST /rendering/product-lots/{id}/regrade"
        actor: QualityLabTech
        preconditions: ["Lot in DOWNGRADED (ERR_LOT_INVALID_STATE)"]
        side_effects: ["grade recomputed from new lab values; if OFF_SPEC: lot -> REJECTED instead"]
      - from: GRADED
        to: REJECTED
        trigger: "POST /rendering/product-lots/{id}/reject OR grade computation yielding OFF_SPEC"
        actor: QualityLabTech
        preconditions: ["Lot in GRADED or DOWNGRADED (ERR_LOT_INVALID_STATE)"]
        side_effects: []
      - from: DOWNGRADED
        to: REJECTED
        trigger: "POST /rendering/product-lots/{id}/reject"
        actor: QualityLabTech
        preconditions: ["Lot in GRADED or DOWNGRADED (ERR_LOT_INVALID_STATE)"]
        side_effects: []
      - from: RELEASED
        to: DEPLETED
        trigger: "system (automatic when a shipment leaves available_lbs == 0 and allocated_lbs == 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rendering/customer-contracts/{id}/submit"
        actor: SalesManager
        preconditions: ["Contract in DRAFT (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /rendering/customer-contracts/{id}/approve"
        actor: PlantManager
        preconditions:
          - "Contract in SUBMITTED (ERR_CONTRACT_INVALID_STATE)"
          - "X-User-ID != created_by (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /rendering/customer-contracts/{id}/return-to-draft"
        actor: PlantManager
        preconditions: ["Contract in SUBMITTED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rendering/customer-contracts/{id}/suspend"
        actor: SalesManager
        preconditions: ["Contract in ACTIVE (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rendering/customer-contracts/{id}/reinstate"
        actor: SalesManager
        preconditions: ["Contract in SUSPENDED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rendering/customer-contracts/{id}/terminate"
        actor: SalesManager
        preconditions: ["Contract in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED (ERR_CONTRACT_INVALID_STATE)"]
        side_effects: ["All orders of this contract in DRAFT or PRICED -> CANCELLED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /rendering/customer-contracts/{id}/terminate"
        actor: SalesManager
        preconditions: ["Contract in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED"]
        side_effects: ["Same order-cancel cascade"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /rendering/customer-contracts/{id}/terminate"
        actor: SalesManager
        preconditions: ["Contract in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: TERMINATED
        trigger: "POST /rendering/customer-contracts/{id}/terminate"
        actor: SalesManager
        preconditions: ["Contract in ACTIVE, SUSPENDED, DRAFT, or SUBMITTED"]
        side_effects: []

  - entity: SalesOrder
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /rendering/sales-orders/{id}/price"
        actor: SalesManager
        preconditions:
          - "Order in DRAFT (ERR_ORDER_INVALID_STATE)"
          - "Contract in ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "requested_ship_date within [contract.effective_from, contract.effective_to] (ERR_CONTRACT_NOT_IN_EFFECT)"
          - "INDEX_LINKED: a PriceIndexEntry exists for contract.index_product with effective_date <= requested_ship_date (ERR_NO_INDEX_FOR_DATE)"
        side_effects:
          - "unit_price_cents / applied_discount_pct / gross / discount / freight / net / margin_pct computed (index_linked_unit_price + order_amount_composition + tier_selection_projected_volume)"
      - from: PRICED
        to: CONFIRMED
        trigger: "POST /rendering/sales-orders/{id}/confirm"
        actor: SalesManager
        preconditions:
          - "Order in PRICED (ERR_ORDER_INVALID_STATE)"
          - "Contract in ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Every allocated lot: RELEASED, product_type == contract.product_type, meets contract spec (ERR_SPEC_BELOW_CONTRACT_MIN), available_lbs sufficient (ERR_INSUFFICIENT_LOT_QUANTITY)"
          - "Sum of allocations == order.quantity_lbs (ERR_ALLOCATION_MISMATCH)"
          - "margin_pct >= contract.margin_floor_pct (ERR_MARGIN_FLOOR_BREACH)"
        side_effects:
          - "allocations recorded; each lot.allocated_lbs += qty (available_lbs decreases)"
      - from: CONFIRMED
        to: PRICED
        trigger: "POST /rendering/sales-orders/{id}/deallocate"
        actor: SalesManager
        preconditions: ["Order in CONFIRMED (ERR_ORDER_INVALID_STATE)"]
        side_effects: ["Each allocated lot.allocated_lbs -= qty (restored); allocations cleared"]
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /rendering/sales-orders/{id}/ship"
        actor: RouteDispatcher
        preconditions:
          - "Order in CONFIRMED (ERR_ORDER_INVALID_STATE)"
          - "Plant posture OPERATING or RESTRICTED (ERR_PLANT_SUSPENDED)"
          - "Vehicle sanitation_status == SANITIZED (ERR_VEHICLE_NOT_SANITIZED)"
          - "Vehicle duty_class in {FINISHED_PRODUCT, DUAL} (ERR_VEHICLE_DUTY_MISMATCH)"
        side_effects:
          - "shipped_vehicle_id recorded; vehicle sanitation_status -> DIRTY; completed_trip_count += 1"
          - "Each allocated lot: allocated_lbs -= qty; lot -> DEPLETED if available_lbs == 0 and allocated_lbs == 0"
          - "Contract.delivered_volume_lbs += quantity_lbs"
      - from: SHIPPED
        to: INVOICED
        trigger: "POST /rendering/sales-orders/{id}/invoice"
        actor: FinanceAnalyst
        preconditions:
          - "Order in SHIPPED (ERR_ORDER_INVALID_STATE)"
          - "Current-period PeriodSettlement in OPEN or REOPENED (ERR_PERIOD_CLOSED)"
        side_effects:
          - "PeriodSettlement.product_revenue_cents += net_amount_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rendering/sales-orders/{id}/cancel"
        actor: SalesManager
        preconditions: ["Order in DRAFT, PRICED, or CONFIRMED (ERR_ORDER_INVALID_STATE)"]
        side_effects: ["If CONFIRMED: allocations released (lots restored)"]
      - from: PRICED
        to: CANCELLED
        trigger: "POST /rendering/sales-orders/{id}/cancel"
        actor: SalesManager
        preconditions: ["Order in DRAFT, PRICED, or CONFIRMED"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rendering/sales-orders/{id}/cancel"
        actor: SalesManager
        preconditions: ["Order in DRAFT, PRICED, or CONFIRMED"]
        side_effects: ["Allocations released (lots restored)"]

  - entity: OdorEvent
    initial_state: REPORTED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /rendering/odor-events/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "Event in REPORTED (ERR_ODOR_EVENT_ALREADY_RESOLVED)"
          - "X-User-ID != reported_by (ERR_SOD_VIOLATION)"
        side_effects:
          - "confirmed_by recorded; permit_id set to plant's ACTIVE permit (if any)"
          - "Plant.odor_score = max(0, odor_score - severity_penalty); if score < 600 and posture OPERATING: posture -> RESTRICTED"
          - "Current PeriodSettlement.confirmed_odor_events += 1"
          - "If permit linked: permit.confirmed_violation_count += 1; if count >= permit.odor_event_threshold: permit -> SUSPENDED, which suspends plant posture, which cancels non-terminal routes/stops and voids collected-stop fees"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /rendering/odor-events/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "Event in REPORTED (ERR_ODOR_EVENT_ALREADY_RESOLVED)"
          - "X-User-ID != reported_by (ERR_SOD_VIOLATION)"
        side_effects: ["No score change"]

  - entity: PeriodSettlement
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /rendering/period-settlements/{id}/close"
        actor: FinanceAnalyst
        preconditions: ["Settlement in OPEN (ERR_SETTLEMENT_INVALID_STATE)"]
        side_effects: ["closed_by recorded"]
      - from: CLOSED
        to: REOPENED
        trigger: "POST /rendering/period-settlements/{id}/reopen"
        actor: PlantManager
        preconditions:
          - "Settlement in CLOSED (ERR_SETTLEMENT_INVALID_STATE)"
          - "Settlement.period_index == plant.current_period_index (ERR_SETTLEMENT_INVALID_STATE)"
        side_effects: ["closed_by cleared"]
      - from: REOPENED
        to: CLOSED
        trigger: "POST /rendering/period-settlements/{id}/close"
        actor: FinanceAnalyst
        preconditions: ["Settlement in OPEN or REOPENED (ERR_SETTLEMENT_INVALID_STATE)"]
        side_effects: ["closed_by recorded"]
      - from: CLOSED
        to: FINALIZED
        trigger: "POST /rendering/period-settlements/{id}/finalize"
        actor: PlantManager
        preconditions:
          - "Settlement in CLOSED (ERR_SETTLEMENT_INVALID_STATE)"
          - "X-User-ID != closed_by (ERR_SOD_VIOLATION)"
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-contract
    parent_entity: CustomerContract
    write_endpoint: "POST /rendering/sales-orders"
    occ_field: "expected_contract_version"
    description: |
      Creating a SalesOrder against a CustomerContract whose version has advanced
      since the client last observed it is rejected. The contract remains ACTIVE
      after an order is created (creation legitimately succeeds on a fresh read),
      so the only deterministic rejection channel is the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: stop-create-stale-route
    parent_entity: CollectionRoute
    write_endpoint: "POST /rendering/route-stops"
    occ_field: "expected_route_version"
    description: |
      Adding a RouteStop to a CollectionRoute whose version has advanced since the
      client last observed it is rejected. The route remains PLANNED after a stop
      is added, so a second creation on a stale read would otherwise legitimately
      succeed; the OCC check on route.version is the deterministic guard.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: agreement-amend-stale-agreement
    parent_entity: SupplierAgreement
    write_endpoint: "POST /rendering/supplier-agreements/{id}/amend"
    occ_field: "expected_agreement_version"
    description: |
      Amending a SupplierAgreement whose version has advanced since the client
      last observed it is rejected. Amend keeps the agreement ACTIVE, so a second
      amend on a stale read would otherwise legitimately succeed; the OCC check
      on agreement.version is the deterministic guard.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cook_yield
    trigger: "CookRun creation (THEORETICAL variant) and CookRun completion (ACTUAL variant + variance)"
    algorithm: aggregation
    formula: |
      THEORETICAL (at POST /rendering/cook-runs):
        theoretical_fat_lbs  = sum over planned_inputs of (weight_lbs * FAT_COEFF[batch.species])
        theoretical_meal_lbs = sum over planned_inputs of (weight_lbs * MEAL_COEFF[batch.species])
        each product rounded to integer lbs, round_half_up, PER INPUT LINE, then summed.
      ACTUAL (at POST /rendering/cook-runs/{id}/complete):
        actual totals = actual_fat_output_lbs + actual_meal_output_lbs (operator-recorded scale values)
        yield_variance_pct = (actual_total - theoretical_total) / theoretical_total * 100,
                             2 decimal places, round_half_up
    input_set: "planned_inputs referencing batches in any non-REJECTED state at creation time"
    constants:
      FAT_COEFF: { BOVINE: 0.16, PORCINE: 0.14, POULTRY: 0.10, OVINE: 0.15, MIXED: 0.12 }
      MEAL_COEFF: { BOVINE: 0.24, PORCINE: 0.22, POULTRY: 0.30, OVINE: 0.23, MIXED: 0.25 }
      YIELD_TOLERANCE_PCT: 25.0
    precision: "integer lbs per line round_half_up; variance 2 decimal places round_half_up"
    variants:
      - name: THEORETICAL
        when: "at cook-run creation"
        difference: "Uses species coefficient table over planned weights; ignores measured outputs"
      - name: ACTUAL
        when: "at cook-run completion"
        difference: "Uses operator-recorded scale outputs; produces yield_variance_pct vs THEORETICAL — identical inputs generally yield different totals"

  - name: pickup_service_fee
    trigger: "RouteStop creation (PROVISIONAL variant) and RouteStop collect (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL (at POST /rendering/route-stops):
        provisional_fee_cents = pickup_base_fee_cents
                              + estimated_weight_lbs * per_lb_fee_cents
                              + estimated_distance_miles * mileage_rate_cents
                              + (dead_stock_surcharge_cents if is_dead_stock else 0)
        (NO volume discount in the provisional variant)
      FINAL (at POST /rendering/route-stops/{id}/collect):
        subtotal = pickup_base_fee_cents
                 + actual_weight_lbs * per_lb_fee_cents
                 + actual_distance_miles * mileage_rate_cents
                 + (dead_stock_surcharge_cents if is_dead_stock else 0)
        supplier_period_volume_lbs = sum of actual_weight_lbs over this supplier's stops
                                     collected into the CURRENT period (period_index == plant.current_period_index),
                                     including this stop
        if minimum_volume_lbs > 0 and supplier_period_volume_lbs >= minimum_volume_lbs:
          discount = round_half_up(subtotal * volume_discount_pct)
        else:
          discount = 0
        final_fee_cents = subtotal - discount
    input_set: "agreement fee fields; stop estimated/actual measures; supplier period volume"
    constants:
      TRANSPORT_COST_PER_MILE_CENTS: 150
    precision: "integer cents, round_half_up on the discount only"
    variants:
      - name: PROVISIONAL
        when: "stop creation"
        difference: "Estimated weight/miles; volume discount never applied"
      - name: FINAL
        when: "stop collect"
        difference: "Actual weight/miles; volume discount applied when the supplier's current-period collected volume (including this stop) reaches minimum_volume_lbs — same stop generally settles at a different amount than its estimate"

  - name: index_linked_unit_price
    trigger: "POST /rendering/sales-orders/{id}/price"
    algorithm: tiered_pricing
    formula: |
      if contract.pricing_mode == FIXED:
        base = contract.base_price_cents_per_lb
        applied_index_price_cents = null
      else:  # INDEX_LINKED
        idx = the PriceIndexEntry of this plant with index_product == contract.index_product
              and effective_date <= order.requested_ship_date, choosing the LATEST effective_date;
              ties on equal effective_date cannot exist (uniqueness rule); none -> ERR_NO_INDEX_FOR_DATE
        base = idx.price_cents_per_lb + contract.index_basis_adjustment_cents
        applied_index_price_cents = idx.price_cents_per_lb
      grade_mult: PREMIUM 1.05 | STANDARD 1.00 | FEED_GRADE 0.85 (grade supplied in price call payload)
      unit_price_cents = round_half_up(base * grade_mult)   # integer cents per lb, EXACTLY ONE rounding here
    input_set: "contract pricing fields; plant PriceIndexEntry set; requested grade"
    constants:
      GRADE_MULTIPLIER: { PREMIUM: 1.05, STANDARD: 1.00, FEED_GRADE: 0.85 }
    precision: "unit price integer cents, round_half_up"

  - name: order_amount_composition
    trigger: "POST /rendering/sales-orders/{id}/price (immediately after index_linked_unit_price)"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED — rounding happens per component, never on the total:
        1. unit_price_cents        (already rounded integer, from index_linked_unit_price)
        2. gross_amount_cents      = quantity_lbs * unit_price_cents          (exact integer; NOT round(quantity * unrounded_unit))
        3. applied_discount_pct    = tier from tier_selection_projected_volume
        4. discount_amount_cents   = round_half_up(gross_amount_cents * applied_discount_pct)
        5. freight_surcharge_cents = FREIGHT_FLAT_CENTS
        6. net_amount_cents        = gross_amount_cents - discount_amount_cents + freight_surcharge_cents
        7. margin_pct              = round_half_up((unit_price_cents - plant.standard_cost_cents_per_lb)
                                     / unit_price_cents * 100, 2)
    input_set: "the priced order, its contract tier table, plant standard cost"
    constants:
      FREIGHT_FLAT_CENTS: 12500
    precision: "integer cents; margin_pct 2 decimal places round_half_up"

  - name: tier_selection_projected_volume
    trigger: "POST /rendering/sales-orders/{id}/price (feeds order_amount_composition step 3)"
    algorithm: threshold
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, PINNED EVALUATION ORDER:
        1. projected_volume_lbs = contract.delivered_volume_lbs + this order's quantity_lbs
           (the order contributes to its own tier evaluation; orders not yet SHIPPED do not)
        2. scan contract.tier_discounts ascending; selected tier = the LAST tier whose
           threshold_lbs <= projected_volume_lbs (threshold comparison is >= on the projected side:
           projected_volume_lbs >= threshold_lbs qualifies); no qualifying tier -> discount 0
        3. applied_discount_pct = selected tier's discount_pct
      delivered_volume_lbs only advances at SHIP time, so re-pricing an order after shipping
      an earlier order can select a different tier for the same quantity.
    input_set: "contract.delivered_volume_lbs, order.quantity_lbs, contract.tier_discounts"
    constants: {}
    precision: "discount_pct as declared fraction (e.g. 0.02)"

  - name: odor_score_update
    trigger: "odor-event confirm (penalty) and plant advance-period (recovery)"
    algorithm: decay_function
    formula: |
      On confirm: odor_score = max(0, odor_score - SEVERITY_PENALTY[severity])
        if odor_score < RESTRICTED_THRESHOLD and posture == OPERATING: posture -> RESTRICTED
      On advance-period: if closing settlement.confirmed_odor_events == 0:
          odor_score = min(1000, odor_score + RECOVERY_PER_PERIOD)
        after recovery, if posture == RESTRICTED and odor_score >= RECOVERY_THRESHOLD: posture -> OPERATING
      HYSTERESIS: scores in [600, 700) never themselves cause a transition; only crossings of
      600 (downward, to RESTRICTED) and 700 (upward, back to OPERATING) fire.
    input_set: "confirmed odor events of the closing period; current odor_score; posture"
    constants:
      SEVERITY_PENALTY: { LOW: 50, MEDIUM: 100, HIGH: 150 }
      RESTRICTED_THRESHOLD: 600
      RECOVERY_THRESHOLD: 700
      RECOVERY_PER_PERIOD: 50
      SCORE_CAP: 1000
      SCORE_FLOOR: 0
    precision: "integer score"

  - name: vehicle_route_overlap
    trigger: "POST /rendering/collection-routes"
    algorithm: interval_merge
    formula: |
      PAIRWISE HALF-OPEN SEMANTICS: routes occupy [scheduled_departure, scheduled_return).
      A new route conflicts with an existing route R for the SAME vehicle iff
        R.status in {PLANNED, DISPATCHED, IN_PROGRESS}
        AND new.scheduled_departure < R.scheduled_return
        AND R.scheduled_departure < new.scheduled_return
      Adjacency is NOT a conflict: new.scheduled_departure == R.scheduled_return is allowed
      (and symmetrically new.scheduled_return == R.scheduled_departure).
      Conflict -> ERR_VEHICLE_SCHEDULE_OVERLAP.
    input_set: "all routes of the same vehicle in PLANNED/DISPATCHED/IN_PROGRESS"
    constants: {}
    precision: "ISO8601 datetime comparison, whole-hour inputs"

  - name: cooker_capacity_check
    trigger: "POST /rendering/cook-runs"
    algorithm: threshold
    formula: |
      AGGREGATE-CAPACITY SEMANTICS (not pairwise): count, over all cook runs of the same plant
      in {STAGED, COOKING, SETTLING, PRESSING} whose [cook_start, cook_end) half-open window
      overlaps the new run's [cook_start, cook_end) (overlap iff a.cook_start < b.cook_end
      AND b.cook_start < a.cook_end; touching endpoints do NOT overlap),
      must be < plant.cooker_capacity; otherwise ERR_COOKER_CAPACITY_EXCEEDED.
      cooker_line is informational and does NOT partition capacity.
    input_set: "plant's non-terminal cook runs in active stages"
    constants: {}
    precision: "whole-hour window comparison"

  - name: route_capacity_check
    trigger: "POST /rendering/route-stops"
    algorithm: aggregation
    formula: |
      planned_load_lbs = sum of estimated_weight_lbs over the route's stops in
                         {SCHEDULED, ARRIVED} plus the new stop's estimated_weight_lbs
      planned_load_lbs <= vehicle.capacity_lbs must hold; equality is ALLOWED;
      planned_load_lbs == capacity + 1 -> ERR_ROUTE_OVER_CAPACITY.
    input_set: "route's non-terminal, non-cancelled stops"
    constants: {}
    precision: "integer lbs"

  - name: energy_cost_tiered
    trigger: "POST /rendering/cook-runs/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      duration_hours = (cook_end - cook_start) in whole hours
      prior_hours = sum of duration_hours over this plant's cook runs COMPLETED earlier in the
                    CURRENT period (order among same-instant completions: by updated_at ASC)
      MARGINAL TIER STRADDLE:
        hours_in_tier1 = max(0, min(duration_hours, TIER1_LIMIT - prior_hours))
        hours_in_tier2 = duration_hours - hours_in_tier1
        energy_cost_cents = hours_in_tier1 * TIER1_RATE + hours_in_tier2 * TIER2_RATE
    input_set: "plant's COMPLETED cook runs of the current period; this run's window"
    constants:
      TIER1_LIMIT: 500
      TIER1_RATE: 4200
      TIER2_RATE: 3800
    precision: "integer cents"

  - name: grade_determination
    trigger: "POST /rendering/product-lots/{id}/grade and /regrade"
    algorithm: threshold
    formula: |
      For TALLOW / YELLOW_GREASE (uses lab_moisture_pct, lab_ffa_pct):
        PREMIUM    if moisture <= 0.3 and ffa <= 2.0
        STANDARD   elif moisture <= 0.5 and ffa <= 4.0
        FEED_GRADE elif moisture <= 1.0 and ffa <= 8.0
        else OFF_SPEC
      For PROTEIN_MEAL / FEATHER_MEAL (uses lab_protein_pct, lab_moisture_pct):
        PREMIUM    if protein >= 65 and moisture <= 8
        STANDARD   elif protein >= 60 and moisture <= 10
        FEED_GRADE elif protein >= 55 and moisture <= 12
        else OFF_SPEC
      Boundary comparisons are INCLUSIVE as written (<= / >=).
      OFF_SPEC at grade time transitions the lot straight to REJECTED.
    input_set: "lab values on the lot"
    constants: {}
    precision: "input percentages 1 decimal place"

  - name: contract_spec_check
    trigger: "POST /rendering/sales-orders/{id}/confirm (per allocated lot)"
    algorithm: threshold
    formula: |
      A lot meets the contract spec iff:
        lot.lab_moisture_pct <= contract.spec_max_moisture_pct
        AND (contract.product_type in {TALLOW, YELLOW_GREASE} implies lot.lab_ffa_pct <= contract.spec_max_ffa_pct)
        AND (contract.product_type in {PROTEIN_MEAL, FEATHER_MEAL} implies lot.lab_protein_pct >= contract.spec_min_protein_pct)
        AND lot.grade != OFF_SPEC AND lot.status == RELEASED
      Any failure -> ERR_SPEC_BELOW_CONTRACT_MIN (business_safety, beats fiscal checks).
    input_set: "order allocations, contract spec fields"
    constants: {}
    precision: "inclusive boundary comparisons"

  - name: segregation_compatibility
    trigger: "POST /rendering/cook-runs"
    algorithm: constraint_propagation
    formula: |
      Allowed species sets per recipe:
        RUMINANT_RENDER: {BOVINE, OVINE}            (these two MAY be mixed)
        PORCINE_RENDER:  {PORCINE}
        POULTRY_RENDER:  {POULTRY}
        MIXED_RENDER:    {BOVINE, OVINE, PORCINE}   (POULTRY never allowed in MIXED_RENDER)
      Every planned input batch's species must be in the recipe's allowed set,
      else ERR_SPECIES_MIXING_VIOLATION. Batches must be in ACCEPTED status
      (ERR_BATCH_NOT_ACCEPTED) and not QUARANTINED/REJECTED.
    input_set: "planned input batches"
    constants: {}
    precision: "set membership"

  - name: batch_mass_conservation
    trigger: "invariant, evaluated on every cook-run create/complete/cancel"
    algorithm: aggregation
    formula: |
      INVARIANT (conserved quantity: raw material mass per batch):
        batch.weight_lbs == batch.remaining_lbs + batch.reserved_lbs + batch.consumed_lbs
        at ALL times.
      Stage (create):  reserved_lbs += w; remaining_lbs -= w
      Complete:        reserved_lbs -= w; consumed_lbs += w   (remaining unchanged)
      Cancel/void:     reserved_lbs -= w; remaining_lbs += w  (consumed unchanged)
      A stage followed by its cancel MUST restore remaining_lbs exactly to its prior value.
    input_set: "the batch and its referencing cook runs"
    constants: {}
    precision: "integer lbs"

  - name: settlement_accrual_conservation
    trigger: "invariant, evaluated on stop collect/void"
    algorithm: aggregation
    formula: |
      INVARIANT (conserved quantity: accrued dollars):
        current PeriodSettlement.pickup_fees_accrued_cents tracks the running sum of
        final_fee_cents over COLLECTED/DELIVERED stops of this period minus reversals;
        a collect followed by a void of the same stop MUST leave
        pickup_fees_accrued_cents, transport_costs_cents AND
        Supplier.outstanding_service_fees_cents exactly at their pre-collect values.
      Reversals land in the settlement whose period_index == plant.current_period_index;
      voiding a stop collected in an earlier (already advanced) period is rejected
      (ERR_PERIOD_CLOSED).
    input_set: "current period settlement, stop, supplier"
    constants:
      TRANSPORT_COST_PER_MILE_CENTS: 150
    precision: "integer cents"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum values in domain, integer quantities >= 1 where declared, scheduled_return > scheduled_departure, cook_end > cook_start with whole-hour duration, effective_to >= effective_from, species_scope non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 3
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "Every id in path and every FK id in the body must exist (validated left-to-right: path first, then body fields in declared order): ERR_PLANT_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_WASH_TICKET_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_STOP_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_COOK_RUN_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_INDEX_ENTRY_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_ODOR_EVENT_NOT_FOUND"
    error_id: ERR_PLANT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: state
    check: "Plant posture gate: SUSPENDED blocks every operational mutation (route/stop/batch/cook-run/order/index creates and all their action endpoints); RESTRICTED additionally blocks collection-route dispatch and cook-run start; DECOMMISSIONED blocks everything mutating. Administrative entities (permits, odor events, suppliers, agreements, vehicles, wash tickets, contracts, settlements) remain writable while SUSPENDED"
    error_id: ERR_PLANT_SUSPENDED
    http_status: 409
    applies_to: "operational mutations on routes, stops, batches, cook runs, sales orders, price index entries"

  - priority: 6
    category: state
    check: "Target resource must be in a valid from-state for the requested transition (per §1.2): ERR_PERMIT_INVALID_STATE | ERR_SUPPLIER_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_VEHICLE_INVALID_STATE | ERR_ROUTE_INVALID_STATE | ERR_STOP_INVALID_STATE | ERR_BATCH_INVALID_STATE | ERR_COOK_RUN_INVALID_STATE | ERR_LOT_INVALID_STATE | ERR_CONTRACT_INVALID_STATE | ERR_ORDER_INVALID_STATE | ERR_SETTLEMENT_INVALID_STATE | ERR_ODOR_EVENT_ALREADY_RESOLVED"
    error_id: ERR_ROUTE_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: agreement/contract approver != created_by; odor confirmer/dismisser != reported_by; batch adjudicator != screened_by; lot releaser != graded_by; settlement finalizer != closed_by"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "approve/confirm/dismiss/adjudicate/release/finalize endpoints"

  - priority: 8
    category: business_safety
    check: "Vehicle sanitation & duty: dispatch requires SANITIZED and duty in {RAW_MATERIAL, DUAL}; order ship requires SANITIZED and duty in {FINISHED_PRODUCT, DUAL}; wash from QUARANTINED requires wash_type=DEEP"
    error_id: ERR_VEHICLE_NOT_SANITIZED
    http_status: 409
    applies_to: "route dispatch, order ship, wash-ticket creation"

  - priority: 9
    category: business_safety
    check: "Material segregation & sourcing compliance: every cook-run input batch species must belong to the recipe's allowed species set (POULTRY never mixes; MIXED_RENDER excludes POULTRY) (ERR_SPECIES_MIXING_VIOLATION); stop species_tag must be in the agreement's species_scope (ERR_SPECIES_OUT_OF_SCOPE); is_dead_stock=true requires agreement.accepts_dead_stock=true (ERR_DEAD_STOCK_NOT_ACCEPTED)"
    error_id: ERR_SPECIES_MIXING_VIOLATION
    http_status: 422
    applies_to: "POST /rendering/cook-runs, POST /rendering/route-stops"

  - priority: 10
    category: business_safety
    check: "Product spec: every allocated lot must be RELEASED, of the contract's product_type, grade != OFF_SPEC, and meet contract spec minimums (moisture/FFA/protein)"
    error_id: ERR_SPEC_BELOW_CONTRACT_MIN
    http_status: 422
    applies_to: "POST /rendering/sales-orders/{id}/confirm"

  - priority: 11
    category: business_referential
    check: "Cross-entity state: stop creation requires supplier ACTIVE (ERR_SUPPLIER_NOT_ACTIVE) and agreement ACTIVE (ERR_AGREEMENT_NOT_ACTIVE) and agreement belonging to that supplier; order create/confirm requires contract ACTIVE (ERR_CONTRACT_NOT_ACTIVE); cook-run inputs require batches ACCEPTED (ERR_BATCH_NOT_ACCEPTED); agreement reinstate requires supplier ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "stop create, order create/confirm, cook-run create, agreement reinstate"

  - priority: 12
    category: business_constraint
    check: "Uniqueness & pairwise overlap: at most one ACTIVE/SUSPENDED permit per plant (ERR_DUPLICATE_ACTIVE_PERMIT); no overlapping ACTIVE/SUSPENDED agreement windows per supplier (ERR_AGREEMENT_WINDOW_OVERLAP); unique (plant, index_product, effective_date) for price index entries (ERR_DUPLICATE_INDEX_ENTRY); no vehicle double-booking (ERR_VEHICLE_SCHEDULE_OVERLAP); cooker aggregate capacity (ERR_COOKER_CAPACITY_EXCEEDED)"
    error_id: ERR_VEHICLE_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "permit issue, agreement approve, index create, route create, cook-run create"

  - priority: 13
    category: business_constraint
    check: "Capacity & allocation sums, evaluated in this listed order: route planned load <= vehicle capacity (ERR_ROUTE_OVER_CAPACITY); cook planned_inputs non-empty (ERR_EMPTY_INPUT); cook input weight <= batch remaining (ERR_WEIGHT_EXCEEDS_REMAINING); dispatch requires >= 1 stop (ERR_ROUTE_EMPTY); order allocations sum == quantity (ERR_ALLOCATION_MISMATCH) BEFORE per-lot availability (ERR_INSUFFICIENT_LOT_QUANTITY); manual route cancel blocked while a stop is COLLECTED (ERR_ROUTE_HAS_COLLECTED_STOPS); stop sequence_no unique per route among non-CANCELLED stops (ERR_DUPLICATE_STOP_SEQUENCE)"
    error_id: ERR_ROUTE_OVER_CAPACITY
    http_status: 422
    applies_to: "stop create, cook-run create, route dispatch/cancel, order confirm"

  - priority: 14
    category: business_constraint
    check: "Yield tolerance: |yield_variance_pct| > 25 requires override_note on complete"
    error_id: ERR_YIELD_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /rendering/cook-runs/{id}/complete"

  - priority: 15
    category: business_temporal
    check: "Windows: stop scheduled window inside route [departure, return] (ERR_WINDOW_OUTSIDE_ROUTE); dispatch not after scheduled_return per logical clock (ERR_ROUTE_WINDOW_PASSED); route service_date inside agreement window (ERR_AGREEMENT_NOT_IN_EFFECT); order requested_ship_date inside contract window (ERR_CONTRACT_NOT_IN_EFFECT)"
    error_id: ERR_WINDOW_OUTSIDE_ROUTE
    http_status: 422
    applies_to: "stop create, route dispatch, order create/price"

  - priority: 16
    category: business_temporal
    check: "Index availability: INDEX_LINKED pricing requires a PriceIndexEntry for the contract's index_product with effective_date <= requested_ship_date"
    error_id: ERR_NO_INDEX_FOR_DATE
    http_status: 422
    applies_to: "POST /rendering/sales-orders/{id}/price"

  - priority: 17
    category: business_fiscal
    check: "Margin floor: order margin_pct >= contract.margin_floor_pct"
    error_id: ERR_MARGIN_FLOOR_BREACH
    http_status: 402
    applies_to: "POST /rendering/sales-orders/{id}/confirm"

  - priority: 18
    category: business_fiscal
    check: "Period openness: fee accrual (collect), fee reversal (void), and revenue accrual (invoice) require the current-period settlement in OPEN or REOPENED; advance-period requires the current settlement CLOSED (ERR_SETTLEMENT_NOT_CLOSED)"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "stop collect/void, order invoice, plant advance-period"

# =============================================================================
# Table 1.5: API Endpoint Table (flat collections under /rendering)
# =============================================================================
endpoints:
  # --- logical clock (test-driving; deterministic default) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (ISO8601). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced (permit expiry and route-window checks observe it)"]

  # --- Plant ---
  - method: POST
    path: "/rendering/plants"
    description: "Create a rendering plant; auto-creates PeriodSettlement #1 (OPEN)"
    roles: [PlantManager]
    code: 201
    input: [plant_name, location, cooker_capacity, standard_cost_cents_per_lb]
    output: Plant
    side_effects:
      - "posture=OPERATING, odor_score=1000, current_period_index=1"
      - "PeriodSettlement(period_index=1, OPEN) created"
  - method: GET
    path: "/rendering/plants"
    description: "List plants"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "posture?"]
    output: "Plant[]"
    side_effects: []
  - method: GET
    path: "/rendering/plants/{id}"
    description: "Get one plant"
    roles: [Any]
    code: 200
    input: []
    output: Plant
    side_effects: []
  - method: POST
    path: "/rendering/plants/{id}/decommission"
    description: "Decommission plant (terminal); cascades cancellation to non-terminal routes and orders"
    roles: [PlantManager]
    code: 200
    input: []
    output: Plant
    side_effects: ["posture -> DECOMMISSIONED; route/stop/order cancellation cascades"]
  - method: POST
    path: "/rendering/plants/{id}/advance-period"
    description: "Ops-run checkpoint: requires current settlement CLOSED; increments current_period_index, opens a new OPEN settlement, applies odor recovery, recomputes posture, expires lapsed permits"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: Plant
    side_effects:
      - "Current settlement must be CLOSED (ERR_SETTLEMENT_NOT_CLOSED)"
      - "current_period_index += 1; new PeriodSettlement(OPEN) created"
      - "Active permit.confirmed_violation_count reset to 0"
      - "If closing settlement.confirmed_odor_events == 0: odor_score = min(1000, odor_score + 50)"
      - "Posture recompute: RESTRICTED -> OPERATING when score >= 700 and permit healthy"
      - "Permits ACTIVE with expires_on < current logical date -> EXPIRED (plant -> SUSPENDED with route cascade)"

  # --- CompliancePermit ---
  - method: POST
    path: "/rendering/permits"
    description: "Create a compliance permit (DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [plant_id, permit_number, odor_event_threshold, emission_limit_ppm, expires_on]
    output: CompliancePermit
    side_effects: ["status=DRAFT, confirmed_violation_count=0"]
  - method: GET
    path: "/rendering/permits"
    description: "List permits (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "status?"]
    output: "CompliancePermit[]"
    side_effects: []
  - method: GET
    path: "/rendering/permits/{id}"
    description: "Get one permit"
    roles: [Any]
    code: 200
    input: []
    output: CompliancePermit
    side_effects: []
  - method: POST
    path: "/rendering/permits/{id}/submit"
    description: "Submit permit for issuance (DRAFT -> PENDING_ISSUANCE)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CompliancePermit
    side_effects: ["status -> PENDING_ISSUANCE"]
  - method: POST
    path: "/rendering/permits/{id}/issue"
    description: "Regulator issues permit (PENDING_ISSUANCE -> ACTIVE); lifts SUSPENDED posture if score allows"
    roles: [Regulator]
    code: 200
    input: []
    output: CompliancePermit
    side_effects: ["status -> ACTIVE; issued_on set; ERR_DUPLICATE_ACTIVE_PERMIT if another ACTIVE/SUSPENDED permit exists for the plant; plant posture recompute"]
  - method: POST
    path: "/rendering/permits/{id}/suspend"
    description: "Regulator suspends permit (ACTIVE -> SUSPENDED); plant posture -> SUSPENDED with cascade"
    roles: [Regulator]
    code: 200
    input: []
    output: CompliancePermit
    side_effects: ["status -> SUSPENDED; plant posture -> SUSPENDED; route/stop/batch/fee cascade"]
  - method: POST
    path: "/rendering/permits/{id}/reinstate"
    description: "Regulator reinstates suspended permit (SUSPENDED -> ACTIVE)"
    roles: [Regulator]
    code: 200
    input: []
    output: CompliancePermit
    side_effects: ["status -> ACTIVE; confirmed_violation_count reset to 0; plant posture recompute"]
  - method: POST
    path: "/rendering/permits/{id}/revoke"
    description: "Regulator revokes permit (ACTIVE/SUSPENDED -> REVOKED, terminal)"
    roles: [Regulator]
    code: 200
    input: []
    output: CompliancePermit
    side_effects: ["status -> REVOKED; plant posture -> SUSPENDED with cascade"]

  # --- OdorEvent ---
  - method: POST
    path: "/rendering/odor-events"
    description: "Log an odor complaint (REPORTED); reported_by = caller"
    roles: [ComplianceOfficer]
    code: 201
    input: [plant_id, reported_at, location_description, severity]
    output: OdorEvent
    side_effects: ["status=REPORTED; reported_by recorded"]
  - method: GET
    path: "/rendering/odor-events"
    description: "List odor events (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "permit_id?", "status?"]
    output: "OdorEvent[]"
    side_effects: []
  - method: GET
    path: "/rendering/odor-events/{id}"
    description: "Get one odor event"
    roles: [Any]
    code: 200
    input: []
    output: OdorEvent
    side_effects: []
  - method: POST
    path: "/rendering/odor-events/{id}/confirm"
    description: "Confirm a reported event (SoD: confirmer != reporter); applies score penalty, permit violation count, posture cascades"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OdorEvent
    side_effects:
      - "status -> CONFIRMED; confirmed_by recorded; permit_id linked to plant ACTIVE permit"
      - "odor_score -= severity penalty; posture -> RESTRICTED if score < 600"
      - "settlement.confirmed_odor_events += 1"
      - "permit.confirmed_violation_count += 1; at threshold permit -> SUSPENDED -> plant SUSPENDED -> route/stop cascade"
  - method: POST
    path: "/rendering/odor-events/{id}/dismiss"
    description: "Dismiss a reported event (SoD: dismisser != reporter); no score change"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OdorEvent
    side_effects: ["status -> DISMISSED"]

  # --- Supplier ---
  - method: POST
    path: "/rendering/suppliers"
    description: "Onboard a supplier (ACTIVE)"
    roles: [ProcurementManager]
    code: 201
    input: [plant_id, supplier_name, supplier_type]
    output: Supplier
    side_effects: ["status=ACTIVE; contamination_strikes=0; outstanding_service_fees_cents=0"]
  - method: GET
    path: "/rendering/suppliers"
    description: "List suppliers (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "status?", "supplier_type?"]
    output: "Supplier[]"
    side_effects: []
  - method: GET
    path: "/rendering/suppliers/{id}"
    description: "Get one supplier"
    roles: [Any]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: POST
    path: "/rendering/suppliers/{id}/reinstate"
    description: "Reinstate a SUSPENDED supplier; resets strikes; agreements stay SUSPENDED"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> ACTIVE; contamination_strikes = 0"]
  - method: POST
    path: "/rendering/suppliers/{id}/terminate"
    description: "Terminate a supplier; agreements terminated; open stops cancelled"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: Supplier
    side_effects: ["status -> TERMINATED; agreements -> TERMINATED; SCHEDULED/ARRIVED stops -> CANCELLED"]

  # --- SupplierAgreement ---
  - method: POST
    path: "/rendering/supplier-agreements"
    description: "Create a supplier agreement (DRAFT); created_by = caller"
    roles: [ProcurementManager]
    code: 201
    input: [supplier_id, plant_id, agreement_ref, species_scope, prohibited_material_policy, accepts_dead_stock, pickup_base_fee_cents, per_lb_fee_cents, mileage_rate_cents, "dead_stock_surcharge_cents?", "minimum_volume_lbs?", "volume_discount_pct?", effective_from, effective_to]
    output: SupplierAgreement
    side_effects: ["status=DRAFT; created_by recorded"]
  - method: GET
    path: "/rendering/supplier-agreements"
    description: "List agreements (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "supplier_id?", "status?"]
    output: "SupplierAgreement[]"
    side_effects: []
  - method: GET
    path: "/rendering/supplier-agreements/{id}"
    description: "Get one agreement"
    roles: [Any]
    code: 200
    input: []
    output: SupplierAgreement
    side_effects: []
  - method: POST
    path: "/rendering/supplier-agreements/{id}/submit"
    description: "Submit agreement for approval (DRAFT -> SUBMITTED)"
    roles: [ProcurementManager]
    code: 200
    input: []
    output: SupplierAgreement
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/rendering/supplier-agreements/{id}/approve"
    description: "Approve agreement (SUBMITTED -> ACTIVE); SoD vs creator; window-overlap check"
    roles: [PlantManager]
    code: 200
    input: []
    output: SupplierAgreement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/rendering/supplier-agreements/{id}/return-to-draft"
    description: "Return agreement to DRAFT for revision (SUBMITTED -> DRAFT)"
    roles: [PlantManager]
    code: 200
    input: []
    output: SupplierAgreement
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/rendering/supplier-agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement; its SCHEDULED/ARRIVED stops are cancelled"
    roles: [PlantManager]
    code: 200
    input: []
    output: SupplierAgreement
    side_effects: ["status -> SUSPENDED; referencing SCHEDULED/ARRIVED stops -> CANCELLED"]
  - method: POST
    path: "/rendering/supplier-agreements/{id}/reinstate"
    description: "Reinstate a SUSPENDED agreement (requires supplier ACTIVE)"
    roles: [PlantManager]
    code: 200
    input: []
    output: SupplierAgreement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/rendering/supplier-agreements/{id}/terminate"
    description: "Terminate an agreement (from DRAFT/SUBMITTED/ACTIVE/SUSPENDED)"
    roles: [PlantManager]
    code: 200
    input: []
    output: SupplierAgreement
    side_effects: ["status -> TERMINATED; referencing SCHEDULED/ARRIVED stops -> CANCELLED"]
  - method: POST
    path: "/rendering/supplier-agreements/{id}/amend"
    description: "Amend commercial terms of an ACTIVE agreement in place (stays ACTIVE); OCC-guarded"
    roles: [ProcurementManager]
    code: 200
    input: [expected_agreement_version, "pickup_base_fee_cents?", "per_lb_fee_cents?", "mileage_rate_cents?", "dead_stock_surcharge_cents?", "minimum_volume_lbs?", "volume_discount_pct?", "effective_to?"]
    output: SupplierAgreement
    side_effects:
      - "increments SupplierAgreement.version by 1"
      - "ERR_STALE_VERSION (412) when expected_agreement_version != current version"

  # --- Vehicle / WashTicket ---
  - method: POST
    path: "/rendering/vehicles"
    description: "Register a vehicle (sanitation starts SANITIZED)"
    roles: [RouteDispatcher]
    code: 201
    input: [plant_id, vehicle_tag, capacity_lbs, duty_class]
    output: Vehicle
    side_effects: ["sanitation_status=SANITIZED; completed_trip_count=0"]
  - method: GET
    path: "/rendering/vehicles"
    description: "List vehicles (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "sanitation_status?", "duty_class?"]
    output: "Vehicle[]"
    side_effects: []
  - method: GET
    path: "/rendering/vehicles/{id}"
    description: "Get one vehicle"
    roles: [Any]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: POST
    path: "/rendering/vehicles/{id}/wash-tickets"
    description: "Record a wash; PASS clears DIRTY (any wash) or QUARANTINED (DEEP only); FAIL leaves status unchanged"
    roles: [RouteDispatcher]
    code: 201
    input: [plant_id, wash_type, washed_at, detergent_ppm, result]
    output: WashTicket
    side_effects: ["On PASS: sanitation_status -> SANITIZED; on FAIL: unchanged; ERR_DEEP_WASH_REQUIRED when QUARANTINED and wash_type=STANDARD"]
  - method: GET
    path: "/rendering/wash-tickets"
    description: "List wash tickets (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "vehicle_id?", "result?"]
    output: "WashTicket[]"
    side_effects: []
  - method: GET
    path: "/rendering/wash-tickets/{id}"
    description: "Get one wash ticket"
    roles: [Any]
    code: 200
    input: []
    output: WashTicket
    side_effects: []
  - method: POST
    path: "/rendering/vehicles/{id}/quarantine"
    description: "Quarantine a vehicle (from SANITIZED or DIRTY)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["sanitation_status -> QUARANTINED"]

  # --- CollectionRoute ---
  - method: POST
    path: "/rendering/collection-routes"
    description: "Create a collection route (PLANNED); validates vehicle pairwise window overlap, sanitation, and duty"
    roles: [RouteDispatcher]
    code: 201
    input: [plant_id, vehicle_id, route_code, service_date, scheduled_departure, scheduled_return]
    output: CollectionRoute
    side_effects:
      - "status=PLANNED; total_collected_lbs=0"
      - "ERR_VEHICLE_SCHEDULE_OVERLAP on half-open window conflict with same vehicle's PLANNED/DISPATCHED/IN_PROGRESS routes"
      - "ERR_VEHICLE_NOT_SANITIZED / ERR_VEHICLE_DUTY_MISMATCH on sanitation/duty violation"
  - method: GET
    path: "/rendering/collection-routes"
    description: "List routes (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "vehicle_id?", "status?", "service_date?"]
    output: "CollectionRoute[]"
    side_effects: []
  - method: GET
    path: "/rendering/collection-routes/{id}"
    description: "Get one route"
    roles: [Any]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: []
  - method: POST
    path: "/rendering/collection-routes/{id}/dispatch"
    description: "Dispatch a PLANNED route (requires >= 1 stop, sanitized RAW/DUAL vehicle, posture OPERATING, window not passed)"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: ["status -> DISPATCHED"]
  - method: POST
    path: "/rendering/collection-routes/{id}/complete"
    description: "Complete a DISPATCHED/IN_PROGRESS route once all stops are terminal; vehicle becomes DIRTY"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: ["status -> COMPLETED; vehicle -> DIRTY; total_collected_lbs computed"]
  - method: POST
    path: "/rendering/collection-routes/{id}/cancel"
    description: "Cancel a non-terminal route (blocked while any stop is COLLECTED); cancels SCHEDULED/ARRIVED stops"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: ["status -> CANCELLED; SCHEDULED/ARRIVED stops -> CANCELLED"]

  # --- RouteStop ---
  - method: POST
    path: "/rendering/route-stops"
    description: "Add a stop to a PLANNED route; OCC-guarded on route version; computes provisional fee"
    roles: [RouteDispatcher]
    code: 201
    input: [route_id, supplier_id, agreement_id, plant_id, sequence_no, scheduled_window_start, scheduled_window_end, estimated_weight_lbs, estimated_distance_miles, species_tag, is_dead_stock, expected_route_version]
    output: RouteStop
    side_effects:
      - "status=SCHEDULED; provisional_fee_cents computed (PROVISIONAL variant)"
      - "increments CollectionRoute.version by 1"
      - "ERR_STALE_VERSION (412) when expected_route_version != current route version"
      - "Validations: supplier ACTIVE, agreement ACTIVE + belongs to supplier, species in scope (ERR_SPECIES_OUT_OF_SCOPE), dead stock accepted (ERR_DEAD_STOCK_NOT_ACCEPTED), window inside route, capacity check, sequence uniqueness"
  - method: GET
    path: "/rendering/route-stops"
    description: "List stops (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "route_id?", "supplier_id?", "agreement_id?", "plant_id?", "status?"]
    output: "RouteStop[]"
    side_effects: []
  - method: GET
    path: "/rendering/route-stops/{id}"
    description: "Get one stop"
    roles: [Any]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: POST
    path: "/rendering/route-stops/{id}/arrive"
    description: "Mark stop ARRIVED (route DISPATCHED/IN_PROGRESS); first arrival moves route to IN_PROGRESS"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status -> ARRIVED; route DISPATCHED -> IN_PROGRESS"]
  - method: POST
    path: "/rendering/route-stops/{id}/collect"
    description: "Record collection: actuals, FINAL fee, creates InboundBatch, accrues fee + transport cost to current settlement"
    roles: [RouteDispatcher]
    code: 201
    input: [actual_weight_lbs, actual_distance_miles, temperature_f]
    output: RouteStop
    side_effects:
      - "status -> COLLECTED; actuals recorded; final_fee_cents computed (FINAL variant)"
      - "InboundBatch created (RECEIVED, PENDING screening)"
      - "PeriodSettlement: pickup_fees_accrued_cents += final fee; transport_costs_cents += actual miles * 150"
      - "Supplier.outstanding_service_fees_cents += final fee"
  - method: POST
    path: "/rendering/route-stops/{id}/reject-at-site"
    description: "Reject at supplier site; PROHIBITED_MATERIAL adds a contamination strike (3rd strike suspends supplier + agreements + cancels open stops)"
    roles: [RouteDispatcher]
    code: 200
    input: [rejection_reason]
    output: RouteStop
    side_effects: ["status -> REJECTED_AT_SITE; strike cascade when reason == PROHIBITED_MATERIAL"]
  - method: POST
    path: "/rendering/route-stops/{id}/miss"
    description: "Mark stop MISSED (from SCHEDULED, route dispatched)"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status -> MISSED"]
  - method: POST
    path: "/rendering/route-stops/{id}/deliver"
    description: "Mark collected stop DELIVERED at plant"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status -> DELIVERED"]
  - method: POST
    path: "/rendering/route-stops/{id}/void"
    description: "Void a COLLECTED/DELIVERED stop: reverses fee + transport accrual exactly, rejects the linked batch"
    roles: [RouteDispatcher]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "status -> VOIDED; PeriodSettlement pickup_fees_accrued_cents -= final fee; transport_costs_cents -= miles * 150"
      - "Supplier.outstanding_service_fees_cents -= final fee"
      - "Linked InboundBatch -> REJECTED (requires reserved_lbs == 0 and consumed_lbs == 0)"

  # --- InboundBatch ---
  - method: POST
    path: "/rendering/inbound-batches"
    description: "Walk-in receiving (no route stop); creates batch in RECEIVED"
    roles: [ScalehouseOperator]
    code: 201
    input: [plant_id, supplier_id, agreement_id, species, weight_lbs, temperature_f, received_at]
    output: InboundBatch
    side_effects: ["status=RECEIVED; screening_result=PENDING; reserved=0; consumed=0; remaining=weight"]
  - method: GET
    path: "/rendering/inbound-batches"
    description: "List batches (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "supplier_id?", "agreement_id?", "route_stop_id?", "status?", "species?"]
    output: "InboundBatch[]"
    side_effects: []
  - method: GET
    path: "/rendering/inbound-batches/{id}"
    description: "Get one batch"
    roles: [Any]
    code: 200
    input: []
    output: InboundBatch
    side_effects: []
  - method: POST
    path: "/rendering/inbound-batches/{id}/screen"
    description: "Screen a RECEIVED batch: PASS -> ACCEPTED; FAIL_TEMPERATURE -> QUARANTINED; FAIL_PROHIBITED -> REJECTED (ZERO_TOLERANCE) or QUARANTINED (SORT_AND_RETURN)"
    roles: [ScalehouseOperator]
    code: 200
    input: [screening_result]
    output: InboundBatch
    side_effects: ["screening_result + screened_by recorded; status per result/policy"]
  - method: POST
    path: "/rendering/inbound-batches/{id}/quarantine"
    description: "Compliance hold on a RECEIVED batch (RECEIVED -> QUARANTINED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: InboundBatch
    side_effects: ["status -> QUARANTINED"]
  - method: POST
    path: "/rendering/inbound-batches/{id}/adjudicate"
    description: "Decide a QUARANTINED batch (SoD: adjudicator != screened_by when screened_by set)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: InboundBatch
    side_effects: ["status -> ACCEPTED (decision=ACCEPT) or REJECTED (decision=REJECT)"]

  # --- CookRun ---
  - method: POST
    path: "/rendering/cook-runs"
    description: "Stage a cook run: species/recipe compatibility, batch remaining checks, cooker aggregate capacity; computes theoretical yields; reserves batch mass"
    roles: [ProductionSupervisor]
    code: 201
    input: [plant_id, cooker_line, recipe, planned_inputs, cook_start, cook_end]
    output: CookRun
    side_effects:
      - "status=STAGED; theoretical_fat_lbs/theoretical_meal_lbs computed (THEORETICAL variant)"
      - "Each input batch: reserved_lbs += weight (batch_mass_conservation)"
      - "ERR_SPECIES_MIXING_VIOLATION / ERR_BATCH_NOT_ACCEPTED / ERR_WEIGHT_EXCEEDS_REMAINING / ERR_COOKER_CAPACITY_EXCEEDED / ERR_EMPTY_INPUT"
  - method: GET
    path: "/rendering/cook-runs"
    description: "List cook runs (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "status?", "recipe?"]
    output: "CookRun[]"
    side_effects: []
  - method: GET
    path: "/rendering/cook-runs/{id}"
    description: "Get one cook run"
    roles: [Any]
    code: 200
    input: []
    output: CookRun
    side_effects: []
  - method: POST
    path: "/rendering/cook-runs/{id}/start"
    description: "Start cooking (STAGED -> COOKING); blocked when plant RESTRICTED/SUSPENDED"
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: CookRun
    side_effects: ["status -> COOKING"]
  - method: POST
    path: "/rendering/cook-runs/{id}/advance"
    description: "Advance stage (COOKING -> SETTLING -> PRESSING)"
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: CookRun
    side_effects: ["status advances one stage"]
  - method: POST
    path: "/rendering/cook-runs/{id}/fail"
    description: "Fail a run in COOKING/SETTLING (-> FAILED); reservations retained for recook"
    roles: [ProductionSupervisor]
    code: 200
    input: [failure_reason]
    output: CookRun
    side_effects: ["status -> FAILED; failure_reason recorded"]
  - method: POST
    path: "/rendering/cook-runs/{id}/restage"
    description: "Restage a FAILED run (-> STAGED); recook_count += 1"
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: CookRun
    side_effects: ["status -> STAGED; recook_count += 1; failure_reason cleared"]
  - method: POST
    path: "/rendering/cook-runs/{id}/complete"
    description: "Complete a PRESSING run with measured outputs; computes variance + tiered energy cost; creates product lots; consumes batch mass"
    roles: [ProductionSupervisor]
    code: 200
    input: [actual_fat_output_lbs, actual_meal_output_lbs, "override_note?"]
    output: CookRun
    side_effects:
      - "status -> COMPLETED; yield_variance_pct + energy_cost_cents computed"
      - "Batches: reserved_lbs -= w, consumed_lbs += w; batch -> DEPLETED when remaining hits 0"
      - "ProductLots created (status LAB_PENDING, grade UNGRADED): TALLOW+PROTEIN_MEAL (RUMINANT/PORCINE/MIXED) or YELLOW_GREASE+FEATHER_MEAL (POULTRY)"
      - "PeriodSettlement.energy_costs_cents += energy_cost_cents"
      - "ERR_YIELD_OUT_OF_TOLERANCE when |variance| > 25 and no override_note"
  - method: POST
    path: "/rendering/cook-runs/{id}/cancel"
    description: "Cancel a STAGED or FAILED run; releases batch reservations exactly"
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: CookRun
    side_effects: ["status -> CANCELLED; batch reserved_lbs -= planned weight"]

  # --- ProductLot ---
  - method: GET
    path: "/rendering/product-lots"
    description: "List product lots (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "cook_run_id?", "status?", "product_type?", "grade?"]
    output: "ProductLot[]"
    side_effects: []
  - method: GET
    path: "/rendering/product-lots/{id}"
    description: "Get one lot"
    roles: [Any]
    code: 200
    input: []
    output: ProductLot
    side_effects: []
  - method: POST
    path: "/rendering/product-lots/{id}/grade"
    description: "Record lab results; computes grade; OFF_SPEC lots go straight to REJECTED"
    roles: [QualityLabTech]
    code: 200
    input: [lab_moisture_pct, lab_ffa_pct, lab_protein_pct]
    output: ProductLot
    side_effects: ["grade computed; graded_by recorded; status -> GRADED (or REJECTED when OFF_SPEC)"]
  - method: POST
    path: "/rendering/product-lots/{id}/release"
    description: "Release a GRADED lot for sale (SoD: releaser != grader)"
    roles: [ProductionSupervisor]
    code: 200
    input: []
    output: ProductLot
    side_effects: ["status -> RELEASED"]
  - method: POST
    path: "/rendering/product-lots/{id}/downgrade"
    description: "Spot-check failure: GRADED/RELEASED -> DOWNGRADED (blocked when allocated)"
    roles: [QualityLabTech]
    code: 200
    input: []
    output: ProductLot
    side_effects: ["status -> DOWNGRADED"]
  - method: POST
    path: "/rendering/product-lots/{id}/regrade"
    description: "Re-grade a DOWNGRADED lot with new lab values (-> GRADED, or REJECTED when OFF_SPEC)"
    roles: [QualityLabTech]
    code: 200
    input: [lab_moisture_pct, lab_ffa_pct, lab_protein_pct]
    output: ProductLot
    side_effects: ["grade recomputed; status -> GRADED or REJECTED"]
  - method: POST
    path: "/rendering/product-lots/{id}/reject"
    description: "Reject a GRADED/DOWNGRADED lot (terminal)"
    roles: [QualityLabTech]
    code: 200
    input: []
    output: ProductLot
    side_effects: ["status -> REJECTED"]

  # --- CustomerContract ---
  - method: POST
    path: "/rendering/customer-contracts"
    description: "Create a customer contract (DRAFT); created_by = caller"
    roles: [SalesManager]
    code: 201
    input: [plant_id, customer_name, product_type, spec_max_moisture_pct, spec_max_ffa_pct, spec_min_protein_pct, pricing_mode, "base_price_cents_per_lb?", "index_product?", "index_basis_adjustment_cents?", volume_commitment_lbs, tier_discounts, margin_floor_pct, effective_from, effective_to]
    output: CustomerContract
    side_effects: ["status=DRAFT; delivered_volume_lbs=0; created_by recorded; ERR_INVALID_REQUEST when FIXED without base price or INDEX_LINKED without index fields"]
  - method: GET
    path: "/rendering/customer-contracts"
    description: "List contracts (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "status?", "product_type?"]
    output: "CustomerContract[]"
    side_effects: []
  - method: GET
    path: "/rendering/customer-contracts/{id}"
    description: "Get one contract"
    roles: [Any]
    code: 200
    input: []
    output: CustomerContract
    side_effects: []
  - method: POST
    path: "/rendering/customer-contracts/{id}/submit"
    description: "Submit contract (DRAFT -> SUBMITTED)"
    roles: [SalesManager]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/rendering/customer-contracts/{id}/approve"
    description: "Approve contract (SUBMITTED -> ACTIVE); SoD vs creator"
    roles: [PlantManager]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/rendering/customer-contracts/{id}/return-to-draft"
    description: "Return contract to DRAFT (SUBMITTED -> DRAFT)"
    roles: [PlantManager]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/rendering/customer-contracts/{id}/suspend"
    description: "Suspend an ACTIVE contract"
    roles: [SalesManager]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/rendering/customer-contracts/{id}/reinstate"
    description: "Reinstate a SUSPENDED contract"
    roles: [SalesManager]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/rendering/customer-contracts/{id}/terminate"
    description: "Terminate a contract; DRAFT/PRICED orders cancel"
    roles: [SalesManager]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status -> TERMINATED; orders in DRAFT/PRICED -> CANCELLED"]

  # --- SalesOrder ---
  - method: POST
    path: "/rendering/sales-orders"
    description: "Create a sales order against an ACTIVE contract (DRAFT); OCC-guarded on contract version"
    roles: [SalesManager]
    code: 201
    input: [contract_id, plant_id, quantity_lbs, requested_ship_date, expected_contract_version]
    output: SalesOrder
    side_effects:
      - "status=DRAFT"
      - "increments CustomerContract.version by 1"
      - "ERR_STALE_VERSION (412) when expected_contract_version != current contract version"
  - method: GET
    path: "/rendering/sales-orders"
    description: "List sales orders (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "contract_id?", "plant_id?", "status?"]
    output: "SalesOrder[]"
    side_effects: []
  - method: GET
    path: "/rendering/sales-orders/{id}"
    description: "Get one sales order"
    roles: [Any]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: POST
    path: "/rendering/sales-orders/{id}/price"
    description: "Price a DRAFT order: index/fixed selection, grade multiplier, projected-volume tier, pinned rounding order, margin compute"
    roles: [SalesManager]
    code: 200
    input: [expected_grade]
    output: SalesOrder
    side_effects: ["status -> PRICED; unit/gross/discount/freight/net/margin fields populated"]
  - method: POST
    path: "/rendering/sales-orders/{id}/confirm"
    description: "Confirm a PRICED order with lot allocations: spec safety, allocation sums, margin floor"
    roles: [SalesManager]
    code: 200
    input: [allocations]
    output: SalesOrder
    side_effects: ["status -> CONFIRMED; allocations recorded; lots' allocated_lbs increased"]
  - method: POST
    path: "/rendering/sales-orders/{id}/deallocate"
    description: "Release allocations (CONFIRMED -> PRICED); lots restored exactly"
    roles: [SalesManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> PRICED; lots' allocated_lbs decreased; allocations cleared"]
  - method: POST
    path: "/rendering/sales-orders/{id}/ship"
    description: "Ship a CONFIRMED order on a sanitized FINISHED_PRODUCT/DUAL vehicle"
    roles: [RouteDispatcher]
    code: 200
    input: [vehicle_id]
    output: SalesOrder
    side_effects: ["status -> SHIPPED; vehicle -> DIRTY; contract.delivered_volume_lbs += quantity; lots drawn down (DEPLETED at zero)"]
  - method: POST
    path: "/rendering/sales-orders/{id}/invoice"
    description: "Invoice a SHIPPED order; accrues net revenue to the current period settlement"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> INVOICED; PeriodSettlement.product_revenue_cents += net_amount_cents"]
  - method: POST
    path: "/rendering/sales-orders/{id}/cancel"
    description: "Cancel a DRAFT/PRICED/CONFIRMED order; releases allocations"
    roles: [SalesManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> CANCELLED; allocations released when CONFIRMED"]

  # --- PriceIndexEntry ---
  - method: POST
    path: "/rendering/price-index-entries"
    description: "Publish a price index quote (append-only); unique per (plant, product, effective_date)"
    roles: [FinanceAnalyst]
    code: 201
    input: [plant_id, index_product, effective_date, price_cents_per_lb, source]
    output: PriceIndexEntry
    side_effects: ["published_by recorded; ERR_DUPLICATE_INDEX_ENTRY on same (plant, product, date)"]
  - method: GET
    path: "/rendering/price-index-entries"
    description: "List price index entries (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "index_product?"]
    output: "PriceIndexEntry[]"
    side_effects: []
  - method: GET
    path: "/rendering/price-index-entries/{id}"
    description: "Get one price index entry"
    roles: [Any]
    code: 200
    input: []
    output: PriceIndexEntry
    side_effects: []

  # --- PeriodSettlement ---
  - method: GET
    path: "/rendering/period-settlements"
    description: "List period settlements (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "period_index?", "status?"]
    output: "PeriodSettlement[]"
    side_effects: []
  - method: GET
    path: "/rendering/period-settlements/{id}"
    description: "Get one period settlement"
    roles: [Any]
    code: 200
    input: []
    output: PeriodSettlement
    side_effects: []
  - method: POST
    path: "/rendering/period-settlements/{id}/close"
    description: "Close an OPEN/REOPENED settlement; closed_by recorded"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: PeriodSettlement
    side_effects: ["status -> CLOSED; closed_by recorded"]
  - method: POST
    path: "/rendering/period-settlements/{id}/reopen"
    description: "Reopen the current period's CLOSED settlement (clears closed_by)"
    roles: [PlantManager]
    code: 200
    input: []
    output: PeriodSettlement
    side_effects: ["status -> REOPENED; closed_by cleared"]
  - method: POST
    path: "/rendering/period-settlements/{id}/finalize"
    description: "Finalize a CLOSED settlement (terminal); SoD: finalizer != closed_by"
    roles: [PlantManager]
    code: 200
    input: []
    output: PeriodSettlement
    side_effects: ["status -> FINALIZED"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: actor matches a forbidden prior-actor field (creator/reporter/screener/grader/closer)" }

  # --- request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, bad type, unknown enum member, non-positive quantity, inverted window/dates" }

  # --- existence (404) ---
  - { id: ERR_PLANT_NOT_FOUND, http: 404, condition: "plant_id / path plant id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id does not exist" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "SupplierAgreement id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id does not exist" }
  - { id: ERR_WASH_TICKET_NOT_FOUND, http: 404, condition: "WashTicket id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "CollectionRoute id does not exist" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "RouteStop id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "InboundBatch id does not exist" }
  - { id: ERR_COOK_RUN_NOT_FOUND, http: 404, condition: "CookRun id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "ProductLot id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "CustomerContract id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "SalesOrder id does not exist" }
  - { id: ERR_INDEX_ENTRY_NOT_FOUND, http: 404, condition: "PriceIndexEntry id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "PeriodSettlement id does not exist" }
  - { id: ERR_ODOR_EVENT_NOT_FOUND, http: 404, condition: "OdorEvent id does not exist" }

  # --- posture / state (409) ---
  - { id: ERR_PLANT_SUSPENDED, http: 409, condition: "Operational mutation attempted while plant posture is SUSPENDED" }
  - { id: ERR_PLANT_RESTRICTED, http: 409, condition: "Route dispatch or cook-run start attempted while plant posture is RESTRICTED" }
  - { id: ERR_PLANT_DECOMMISSIONED, http: 409, condition: "Any mutation attempted on a DECOMMISSIONED plant" }
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "Permit not in required from-state (e.g., issue non-PENDING, reinstate non-SUSPENDED, already terminal)" }
  - { id: ERR_SUPPLIER_INVALID_STATE, http: 409, condition: "Supplier transition from wrong state (e.g., reinstate non-SUSPENDED, terminate TERMINATED)" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement transition from wrong state" }
  - { id: ERR_VEHICLE_INVALID_STATE, http: 409, condition: "Vehicle operation from wrong sanitation state (e.g., quarantine an already-QUARANTINED vehicle)" }
  - { id: ERR_ROUTE_INVALID_STATE, http: 409, condition: "Route transition from wrong state (e.g., dispatch non-PLANNED, complete non-dispatched, double cancel)" }
  - { id: ERR_STOP_INVALID_STATE, http: 409, condition: "Stop transition from wrong state (e.g., collect non-ARRIVED, arrive on terminal stop, void non-collected)" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Batch transition from wrong state (e.g., screen non-RECEIVED, adjudicate non-QUARANTINED, void stop whose batch is reserved/consumed)" }
  - { id: ERR_COOK_RUN_INVALID_STATE, http: 409, condition: "Cook-run transition from wrong state (e.g., start non-STAGED, advance past PRESSING, complete non-PRESSING, cancel COMPLETED)" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "Lot transition from wrong state (e.g., grade non-LAB_PENDING, release non-GRADED, downgrade allocated lot)" }
  - { id: ERR_CONTRACT_INVALID_STATE, http: 409, condition: "Contract transition from wrong state" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Order transition from wrong state (e.g., price non-DRAFT, confirm non-PRICED, ship non-CONFIRMED, invoice non-SHIPPED)" }
  - { id: ERR_SETTLEMENT_INVALID_STATE, http: 409, condition: "Settlement transition from wrong state (e.g., close FINALIZED, reopen non-CLOSED or non-current period)" }
  - { id: ERR_ODOR_EVENT_ALREADY_RESOLVED, http: 409, condition: "Confirm/dismiss attempted on an event already CONFIRMED or DISMISSED" }

  # --- referential state (409) ---
  - { id: ERR_SUPPLIER_NOT_ACTIVE, http: 409, condition: "Stop creation or agreement reinstate requires supplier ACTIVE" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Stop creation requires agreement ACTIVE (and belonging to the stop's supplier)" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Order create/price/confirm requires contract ACTIVE" }
  - { id: ERR_BATCH_NOT_ACCEPTED, http: 409, condition: "Cook-run input batch not in ACCEPTED status" }

  # --- business safety ---
  - { id: ERR_VEHICLE_NOT_SANITIZED, http: 409, condition: "Dispatch/ship requires sanitation_status SANITIZED" }
  - { id: ERR_VEHICLE_DUTY_MISMATCH, http: 409, condition: "Vehicle duty_class incompatible with raw collection vs finished-product shipment" }
  - { id: ERR_DEEP_WASH_REQUIRED, http: 422, condition: "Wash from QUARANTINED requires wash_type=DEEP" }
  - { id: ERR_SPECIES_MIXING_VIOLATION, http: 422, condition: "Cook-run input species not in recipe's allowed set (POULTRY never mixes; MIXED_RENDER excludes POULTRY)" }
  - { id: ERR_SPECIES_OUT_OF_SCOPE, http: 422, condition: "Stop species_tag not in agreement species_scope" }
  - { id: ERR_DEAD_STOCK_NOT_ACCEPTED, http: 422, condition: "is_dead_stock=true but agreement accepts_dead_stock=false" }
  - { id: ERR_SPEC_BELOW_CONTRACT_MIN, http: 422, condition: "Allocated lot fails contract spec (moisture/FFA/protein/grade/status)" }

  # --- constraint (409/422) ---
  - { id: ERR_DUPLICATE_ACTIVE_PERMIT, http: 409, condition: "Issuing a permit while another permit for the plant is ACTIVE or SUSPENDED" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Approving an agreement whose [effective_from, effective_to] overlaps another ACTIVE/SUSPENDED agreement of the same supplier" }
  - { id: ERR_DUPLICATE_INDEX_ENTRY, http: 409, condition: "PriceIndexEntry already exists for (plant, index_product, effective_date)" }
  - { id: ERR_VEHICLE_SCHEDULE_OVERLAP, http: 409, condition: "New route half-open window overlaps an existing PLANNED/DISPATCHED/IN_PROGRESS route of the same vehicle" }
  - { id: ERR_COOKER_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping active cook runs would reach plant.cooker_capacity" }
  - { id: ERR_ROUTE_OVER_CAPACITY, http: 422, condition: "Sum of estimated stop weights would exceed vehicle capacity_lbs" }
  - { id: ERR_WEIGHT_EXCEEDS_REMAINING, http: 422, condition: "Cook-run planned input weight exceeds batch remaining_lbs" }
  - { id: ERR_EMPTY_INPUT, http: 422, condition: "Cook-run planned_inputs is empty" }
  - { id: ERR_ROUTE_EMPTY, http: 422, condition: "Dispatch attempted with zero non-CANCELLED stops" }
  - { id: ERR_ROUTE_HAS_COLLECTED_STOPS, http: 409, condition: "Manual route cancel blocked while a stop is COLLECTED (deliver or void first)" }
  - { id: ERR_ALLOCATION_MISMATCH, http: 422, condition: "Sum of order allocations != order quantity_lbs" }
  - { id: ERR_INSUFFICIENT_LOT_QUANTITY, http: 422, condition: "Allocated lot lacks available_lbs" }
  - { id: ERR_DUPLICATE_STOP_SEQUENCE, http: 422, condition: "sequence_no already used by a non-CANCELLED stop on the route" }
  - { id: ERR_YIELD_OUT_OF_TOLERANCE, http: 422, condition: "|yield_variance_pct| > 25 and no override_note supplied" }

  # --- temporal (422) ---
  - { id: ERR_WINDOW_OUTSIDE_ROUTE, http: 422, condition: "Stop scheduled window not inside route [scheduled_departure, scheduled_return]" }
  - { id: ERR_ROUTE_WINDOW_PASSED, http: 422, condition: "Dispatch attempted after scheduled_return per the logical clock" }
  - { id: ERR_AGREEMENT_NOT_IN_EFFECT, http: 422, condition: "Route service_date outside agreement [effective_from, effective_to]" }
  - { id: ERR_CONTRACT_NOT_IN_EFFECT, http: 422, condition: "Order requested_ship_date outside contract window" }
  - { id: ERR_NO_INDEX_FOR_DATE, http: 422, condition: "No PriceIndexEntry for the contract's index_product with effective_date <= requested_ship_date" }

  # --- fiscal ---
  - { id: ERR_MARGIN_FLOOR_BREACH, http: 402, condition: "Order margin_pct below contract.margin_floor_pct at confirm" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "Fee/revenue accrual or reversal targeted a settlement not in OPEN/REOPENED" }
  - { id: ERR_SETTLEMENT_NOT_CLOSED, http: 409, condition: "advance-period requires the current settlement to be CLOSED" }

  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent entity's current version" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant general manager; owns plant lifecycle, agreement/contract approval, settlement finalize/reopen"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/plants — create plant"
      - "POST /rendering/plants/{id}/decommission"
      - "POST /rendering/supplier-agreements/{id}/approve, /return-to-draft, /suspend, /reinstate, /terminate"
      - "POST /rendering/customer-contracts/{id}/approve, /return-to-draft"
      - "POST /rendering/period-settlements/{id}/reopen, /finalize"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints (as Any-equivalent reads)"]

  - name: ComplianceOfficer
    description: "Environmental/compliance officer; permits, odor events, quarantine and adjudication, vehicle quarantine"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/permits + /submit"
      - "POST /rendering/odor-events + /confirm + /dismiss"
      - "POST /rendering/inbound-batches/{id}/quarantine + /adjudicate"
      - "POST /rendering/vehicles/{id}/quarantine"
    shared_operations: ["all GET endpoints"]

  - name: Regulator
    description: "External regulator; issues, suspends, reinstates, revokes permits"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/permits/{id}/issue, /suspend, /reinstate, /revoke"
    shared_operations: ["all GET endpoints"]

  - name: ProcurementManager
    description: "Owns supplier onboarding and agreement drafting/amendment (cannot approve own agreements)"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/suppliers + /reinstate + /terminate"
      - "POST /rendering/supplier-agreements + /submit + /amend"
    shared_operations: ["all GET endpoints"]

  - name: RouteDispatcher
    description: "Owns vehicles, wash tickets, routes, stops, and finished-product shipments"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/vehicles + wash-tickets"
      - "POST /rendering/collection-routes + /dispatch + /complete + /cancel"
      - "POST /rendering/route-stops + /arrive + /collect + /reject-at-site + /miss + /deliver + /void"
      - "POST /rendering/sales-orders/{id}/ship"
    shared_operations: ["all GET endpoints"]

  - name: ScalehouseOperator
    description: "Weighbridge operator; walk-in receiving and screening (cannot adjudicate own screenings)"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/inbound-batches"
      - "POST /rendering/inbound-batches/{id}/screen"
    shared_operations: ["all GET endpoints"]

  - name: ProductionSupervisor
    description: "Owns cook runs and product-lot release (cannot release lots graded by self)"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/cook-runs + /start + /advance + /fail + /restage + /complete + /cancel"
      - "POST /rendering/product-lots/{id}/release"
    shared_operations: ["all GET endpoints"]

  - name: QualityLabTech
    description: "Lab technician; grades, downgrades, regrades, rejects product lots"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/product-lots/{id}/grade + /downgrade + /regrade + /reject"
    shared_operations: ["all GET endpoints"]

  - name: SalesManager
    description: "Owns customer contracts and sales orders up to confirmation (cannot approve own contracts; cannot ship)"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/customer-contracts + /submit + /suspend + /reinstate + /terminate"
      - "POST /rendering/sales-orders + /price + /confirm + /deallocate + /cancel"
    shared_operations: ["all GET endpoints"]

  - name: FinanceAnalyst
    description: "Owns price index publication, period advance, settlement close, invoicing"
    identity: opaque
    exclusive_operations:
      - "POST /rendering/price-index-entries"
      - "POST /rendering/plants/{id}/advance-period"
      - "POST /rendering/period-settlements/{id}/close"
      - "POST /rendering/sales-orders/{id}/invoice"
    shared_operations: ["all GET endpoints"]

  - name: Any
    description: "Read-only pseudo-role; every declared role may perform these GET operations"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /rendering/plants, /{id}"
      - "GET /rendering/permits, /{id}"
      - "GET /rendering/odor-events, /{id}"
      - "GET /rendering/suppliers, /{id}"
      - "GET /rendering/supplier-agreements, /{id}"
      - "GET /rendering/vehicles, /{id}"
      - "GET /rendering/wash-tickets, /{id}"
      - "GET /rendering/collection-routes, /{id}"
      - "GET /rendering/route-stops, /{id}"
      - "GET /rendering/inbound-batches, /{id}"
      - "GET /rendering/cook-runs, /{id}"
      - "GET /rendering/product-lots, /{id}"
      - "GET /rendering/customer-contracts, /{id}"
      - "GET /rendering/sales-orders, /{id}"
      - "GET /rendering/price-index-entries, /{id}"
      - "GET /rendering/period-settlements, /{id}"
