          - entities.DeductionLine.amount_cents
          - state_machines.LifeEvent.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity #1 (payroll ledger cents): after a RETROACTIVE life
          event, sum(DeductionLine.amount_cents for employee) must equal the expected
          owed = sum over each processed period of the per_paycheck in effect for
          that period under the new election; the retro lines exactly close the gap
          (no drift).
        test_recipe:
          setup:
            - "Employee SEMI_MONTHLY, ACTIVE SILVER EMPLOYEE_ONLY (pp 4500), 2 pay periods run (ledger 9000)."
            - "RETROACTIVE life event to GOLD EMPLOYEE_PLUS_SPOUSE (pp 13500), event_date covers both periods."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Qi Lund", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Silver PPO" }
              as: BenefitsAdmin
              captures: { silver_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${silver_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 30000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { silver_tier_id: $.data.id }
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_PLUS_SPOUSE", monthly_premium_cents: 90000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${silver_tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_silver_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
            - call: "POST /enrollments/${enr_silver_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
            - call: "POST /_payroll/run"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOfficer
            - call: "POST /_payroll/run"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOfficer
            - call: "POST /employees/${emp_id}/life-events"
              payload: { event_type: "MARRIAGE", event_date: "2026-02-01", requested_plan_tier_id: "${gold_tier_id}", adjustment_mode: "RETROACTIVE" }
              as: BenefitsAdmin
              as_user_id: "sub_q"
              captures: { le_id: $.data.id }
          trigger:
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev2: $.data.version }
            - call: "POST /life-events/${le_id}/approve"
              payload: { expected_employee_version: "${ev2}" }
              as: BenefitsAdmin
              as_user_id: "appr_q"
            - call: "GET /deduction-lines?employee_id=${emp_id}"
              payload: {}
              as: PayrollOfficer
          assert:
            - "sum of all DeductionLine.amount_cents for ${emp_id} == 27000 (2 REGULAR @4500 + 2 RETRO_ADJUSTMENT @9000)"
            - "expected_owed under new election == per_paycheck_new(13500) * 2 == 27000; ledger total equals it (no drift)"

      - name: dependent_count_conserved_add_then_remove
        grounds:
          - entities.Enrollment.covered_dependent_count
          - validations[priority=12]
          - entities.Dependent.verification_status
        distinguishing_aspect: |
          Conserved quantity #2 (covered dependent count, a different type of
          conserved quantity from ledger cents): adding then removing the same
          VERIFIED dependent leaves Enrollment.covered_dependent_count unchanged.
        test_recipe:
          setup:
            - "Employee ELIGIBLE with an ACTIVE MEDICAL enrollment (covered_dependent_count 0) and a VERIFIED CHILD dependent."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Ro Diaz", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_PLUS_CHILDREN", monthly_premium_cents: 90000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${gold_tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdmin
              captures: { ev1: $.data.version }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: { expected_employee_version: "${ev1}" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/dependents"
              payload: { relationship: "CHILD", full_name: "Kid Diaz", date_of_birth: "2021-03-03" }
              as: BenefitsAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /dependents/${dep_id}/verify"
              payload: {}
              as: DependentVerifier
              as_user_id: "verifier_z"
          trigger:
            - call: "POST /enrollments/${enr_id}/add-dependent"
              payload: { dependent_id: "${dep_id}" }
              as: BenefitsAdmin
              captures: { count_after_add: $.data.covered_dependent_count }
            - call: "POST /enrollments/${enr_id}/remove-dependent"
              payload: { dependent_id: "${dep_id}" }
              as: BenefitsAdmin
              captures: { count_after_remove: $.data.covered_dependent_count }
          assert:
            - "Enrollment.${enr_id}.covered_dependent_count == 1 after add"
            - "Enrollment.${enr_id}.covered_dependent_count == 0 after remove (conserved back to baseline, no drift)"
