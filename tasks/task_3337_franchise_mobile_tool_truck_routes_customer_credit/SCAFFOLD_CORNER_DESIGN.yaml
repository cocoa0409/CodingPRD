            - { call: "POST /retail/product-orders/${po_id}/pledges", payload: { credit_account_id: "${a1_id}", pledged_lines: [{ product_id: "${p1_id}", qty: 2 }], expected_product_order_version: "${po_ver}" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pl_id: "$.data.id", pl_status: "$.data.pledge_status", pl_amount: "$.data.sustained_amount_cents" } }
