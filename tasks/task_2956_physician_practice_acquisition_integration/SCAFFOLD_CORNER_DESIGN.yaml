      - name: acquisition_ledger_read_matches_its_child_liability_rows
        claim_type: Computed read
        grounds:
          - calculations.liability_escrow_ledger
          - entities.Acquisition.fields.escrow_committed_cents
          - entities.LiabilityItem.fields.escrowed_amount_cents
        distinguishing_aspect: |
          The acquisition's escrow ledger is a derived read over its LiabilityItem rows
          and stays reconciled through each disposition change: committed plus available
          always equals the total, and the parent figure is the exact sum of the
          children's escrowed_amount_cents at every step.
        test_recipe:
          setup:
            - "One ASSET Acquisition with escrow_total_cents 10000000 and three LiabilityItems in disposition UNASSIGNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /liability-items"
              payload: { acquisition_id: "${acq_id}", category: "EQUIPMENT_LEASE", description: "Two imaging leases running to 2029.", estimated_amount_cents: 2500000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { item_a_id: "$.data.id" }
            - call: "POST /liability-items"
              payload: { acquisition_id: "${acq_id}", category: "PAYER_REFUND_EXPOSURE", description: "Open overpayment recoupments from 2024.", estimated_amount_cents: 1750000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { item_b_id: "$.data.id" }
            - call: "POST /liability-items"
              payload: { acquisition_id: "${acq_id}", category: "STARK_SELF_DISCLOSURE", description: "Self-disclosed space lease shortfall.", estimated_amount_cents: 900000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { item_c_id: "$.data.id" }
          trigger:
            - call: "POST /liability-items/${item_a_id}/disposition"
              payload: { target_disposition: "ESCROWED", disposition_note: "Held against the escrow." }
              as: DealLead
              as_user_id: "dl-1"
            - call: "POST /liability-items/${item_b_id}/disposition"
              payload: { target_disposition: "ESCROWED", disposition_note: "Held pending the recoupment audit." }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "Acquisition.${acq_id}.escrow_committed_cents == 4250000, the sum of 2500000 and 1750000"
            - "Acquisition.${acq_id}.escrow_available_cents == 5750000 and committed plus available equals escrow_total_cents"
            - "LiabilityItem.${item_a_id}.escrowed_amount_cents == 2500000 and LiabilityItem.${item_c_id}.escrowed_amount_cents == 0 while still UNASSIGNED"
            - "after ${item_b_id} is moved ESCROWED -> EXCLUDED, escrow_committed_cents == 2500000 and escrow_available_cents == 7500000"
            - "GET /liability-items with acquisition_id ${acq_id} and disposition ESCROWED then reports total_count == 1"

      - name: provider_based_conversion_is_a_conditional_action
        claim_type: Conditional action
        grounds:
