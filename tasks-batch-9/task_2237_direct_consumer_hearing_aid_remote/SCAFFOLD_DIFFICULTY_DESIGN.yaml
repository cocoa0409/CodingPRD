    - name: warranty_deductible_tier_product_then_integer_surcharge
      grounds:
        - "calculations.warranty_deductible"
        - "state_machines.WarrantyClaim.FILED_to_TRIAGED"
        - "entities.WarrantyClaim.fields.claim_ordinal"
        - "entities.Device.fields.shipped_at"
      distinguishing_aspect: >-
        MODE (a) - three inputs (device_age_months, claim_kind, claim_ordinal)
        interacting non-linearly: two of them multiply into a rounded product and
        the third is an integer surcharge added AFTER rounding. At exactly
        device_age_months == 12 the inclusive tier-1 multiplier 0.5 applies, so a
        second DAMAGE claim is round_half_up(9900 * 0.5 * 0.75) + 5000 =
        3713 + 5000 = 8713. Reading the boundary exclusively gives 12425, rounding
        the exact half down gives 8712, and rounding the sum instead of the product
        gives 8712 as well. The first (DEFECT) claim shows the kind_factor 0.0
        collapse to a 0 deductible at ordinal 1.
