  - section: consistency_model
    instances:
      - name: every_derived_value_is_already_correct_in_the_writing_responses_own_body
        claim_type: immediate
        grounds:
          - consistency_model
          - response_envelope
          - calculations.applicant_annual_income_and_category
        distinguishing_aspect: "The model is immediate, so the POST that certifies income already returns the derived figures in its own response body — a follow-up GET is byte-identical rather than newly populated, and there is no window in which annual_income_cents is still null after a 200."
        test_recipe:
          setup:
            - "one ProgramYear 2026 (ami 9,000,000) and one Applicant in APPLIED with wage 7,000,000, assets 5,000,000, 2 dependents"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { certified_income: $.data.annual_income_cents, certified_pct: $.data.ami_percent }
            - call: "GET /rehab/applicants/${hh_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "the POST response itself carries ${certified_income} == 7020000, ${certified_pct} == 78.0, income_category LOW and eligibility_status INCOME_VERIFIED"
            - "the immediate GET returns exactly the same field values and the same version, with no second write in between"
            - "GET /rehab/applicants?income_category=LOW already includes ${hh_id} on the first read after the POST"
            - "no field is null in the GET that was populated in the POST, and none changed value"
