  - section: errors
    instances:
      - name: presentation_and_negotiation_guards_complete_the_error_catalog
        claim_type: triggerability
        grounds:
          - errors.ERR_PRESENTATION_NOT_ACCEPTED
          - errors.ERR_PRESENTATION_DECLINED
          - errors.ERR_AGREEMENT_HAS_OPEN_NEGOTIATION
          - errors.ERR_PRINCIPAL_HAS_LIVE_AUTHORIZATIONS
          - errors.ERR_AUTHORIZATION_NOT_AUTHORIZED
        distinguishing_aspect: |
          These five ids are only reachable through configurations that are easy to
          make unreachable by accident. A deal may be proposed on a DRAFT
          presentation, so after the review is decided by ANOTHER principal's
          presentation that deal is acceptable in every respect except its
          presentation's status. A deal may also be OPENED on an already DECLINED
          presentation, and only the propose call refuses it. And a still-open
          negotiation plus a PENDING_SETUP authorization jointly pin both the
          agreement and the principal in place until the deal is rejected.
        test_recipe:
          setup:
            - "Retailer BIGMART; three ACTIVE principals NWF/SGF/GLF, each with an ACTIVE non-exclusive FROZEN_SNACKS agreement and one VALIDATED item (i1/i2/i3). No conflict rules exist."
