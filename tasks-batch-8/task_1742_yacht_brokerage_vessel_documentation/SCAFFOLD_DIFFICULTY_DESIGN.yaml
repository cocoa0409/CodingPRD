              payload: {}
              as: SellingAgent
              as_user_id: "${saF}"
            - call: "POST /yacht/escrow-entries/${entF}/refund"
              payload: {}
              as: EscrowOfficer
          assert:
            - "Offer.${offF}.status == FAILED (trigger)"
