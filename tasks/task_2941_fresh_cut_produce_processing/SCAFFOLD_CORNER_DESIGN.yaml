            - call: "POST /process-runs/${run_r}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 100.00, expected_process_run_version: "${vr}" }
              as: LineOperator
              captures: { e_class: "$.data.error_id" }
          assert:
            - "${changeover_needed} == false: L2 has never run product, so last_run_allergen_group is null and the CELERY group needs no changeover clean yet"
            - "${frozen_target} == 20.0 and ${frozen_dwell} == 90 == max(90, ceil(90 x 20.0 / 25.0)) == max(90, 72), frozen before the run's own pounds landed"
            - "${cons_lb} == 12000.00 and ${load} == 21600.00 == round_half_up(12000.00 x 1.8, 2)"
            - "${idx} == 0.540 == round_half_up(21600.00 / 40000, 3), so ${target} == 35.0"
