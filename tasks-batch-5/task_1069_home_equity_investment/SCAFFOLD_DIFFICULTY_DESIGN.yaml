  - rule_id: resource_temporal_overlap
    instances:
      - name: appraiser_buffer_overlap
        grounds:
          - validations[priority=10]
          - entities.AppraisalAppointment.fields.scheduled_start
          - errors[ERR_APPRAISER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Buffered-interval semantics on the Appraiser resource: appointment2 [11:30,12:30) starts 30 minutes
          after appointment1 ends at 11:00 — inside APPRAISER_BUFFER_MINUTES=60 — so it is rejected
          ERR_APPRAISER_DOUBLE_BOOKED. Region matches (CA-BAY), isolating the temporal rule.
        test_recipe:
          setup:
            - "Appraiser region CA-BAY; two PENDING APPRAISAL valuations; appointment1 SCHEDULED CA-BAY [10:00,11:00)"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F15", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "ho15@x.com", full_name: "Ho Fifteen" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "15 Main St", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "APPRAISAL" }
              as: InvestmentAnalyst
              captures: { val1: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "APPRAISAL" }
              as: InvestmentAnalyst
              captures: { val2: $.data.id }
            - call: "POST /hei/appraisers"
