  - section: validations
    instances:
      - name: role_denied_before_existence_on_adopt
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
        distinguishing_aspect: "A FilingCoordinator calling adopt on a NONEXISTENT resolution id gets ERR_FORBIDDEN_ROLE (403): role (priority 2) is evaluated before existence (priority 3), so the 404 never surfaces."
        test_recipe:
          setup: ["J1 and one DRAFT entity exist (only to obtain a valid entity version scalar is unnecessary - the resolution id is fake)"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
