            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se_v: $.data.version }
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v}", system_type: "CONVENTIONAL", bedrooms: 3, tank_capacity_gal: 1000, drainfield_x_ft: 150, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_id: $.data.id }
            - call: "POST /system-designs/${sd_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /system-designs/${sd_id}/review"
              payload: { decision: "APPROVE" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
            - call: "POST /contractors"
              payload: { business_name: "Cascade Septic", license_number: "LIC-0856-C", license_class: "DUAL", license_expires_on: "2030-01-01T00:00:00Z", bond_amount_cents: 5000000 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { c_id: $.data.id }
            - call: "POST /construction-permits"
              payload: { system_design_id: "${sd_id}", contractor_id: "${c_id}", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { cp_id: $.data.id }
            - call: "POST /inspections"
              payload: { construction_permit_id: "${cp_id}", inspection_type: "COVER", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { i1_id: $.data.id }
            - call: "POST /inspections/${i1_id}/result"
              payload: { result: "PASS" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
            - call: "POST /inspections"
              payload: { construction_permit_id: "${cp_id}", inspection_type: "FINAL", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { i2_id: $.data.id }
            - call: "POST /inspections/${i2_id}/result"
              payload: { result: "PASS" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
            - call: "POST /operating-permits"
              payload: { construction_permit_id: "${cp_id}", household_size: 4 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { op_id: $.data.id }
            - call: "GET /parcels/${p_id}"
              payload: {}
              as: Applicant
              as_user_id: "u-app-1"
              captures: { pv1: $.data.version }
