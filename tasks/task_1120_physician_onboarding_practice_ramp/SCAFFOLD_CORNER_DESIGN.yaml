          setup_api_calls:
            - { call: "POST /onboarding/physicians", payload: { full_name: "Dr. Jen", specialty: "INTERNAL_MEDICINE", email: "jen@x.com", hire_type: "EXPERIENCED" }, as: Recruiter, captures: { phys_id: "$.data.id" } }
