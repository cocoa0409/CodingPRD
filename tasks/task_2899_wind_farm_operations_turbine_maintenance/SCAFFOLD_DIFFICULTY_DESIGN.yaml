  - rule_id: priority_pair_validation_conflict
    instances:
      - name: schedule_peels_a_three_rung_ladder_state_44_then_safety_52_then_fiscal_72
        grounds:
          - validations[priority=44]
          - validations[priority=52]
          - validations[priority=72]
          - errors.ERR_WEATHER_WINDOW_NOT_CONFIRMED
          - errors.ERR_CREW_WIND_LIMIT_EXCEEDED
          - errors.ERR_CREW_CAPACITY_EXCEEDED
          - endpoints.POST_/wind-ops/work-orders/{id}/schedule
        distinguishing_aspect: |
          One schedule request violates three rules at once and the ladder is peeled strictly by
          priority: 44 (state) wins over 52 (business_safety) which wins over 72 (business_fiscal).
          Each fix exposes exactly the next rung, and the HTTP status changes with it (409 then 422
          then 422), so an implementation that evaluates safety or capacity first is caught on the
          very first call rather than only on the last.
        test_recipe:
          setup:
            - "one farm with one ONLINE turbine T1"
            - "crew CRW-A certified GWO_BASIC with max_work_wind_speed_ms 10 and daily_hours_capacity 6"
            - "one SUBMITTED MAJOR_COMPONENT work order on T1 with estimated_hours 8 and required_certification GWO_BASIC"
            - "weather window WW_A on 2026-06-20 left in state FORECAST forecasting 18 m/s"
            - "the logical clock reads 2026-06-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
