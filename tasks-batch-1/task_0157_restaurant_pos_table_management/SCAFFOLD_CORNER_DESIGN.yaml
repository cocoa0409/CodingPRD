scaffold_corner_design:

  # =========================================================================
  # Entities — creation, retrieval, listing, not-found, required-field, computed, FK integrity
  # =========================================================================
  - section: entities
    instances:
      - name: create_restaurant_returns_201_with_config_defaults
        claim_type: Creation
        grounds: [entities.Restaurant, endpoints]
        distinguishing_aspect: "POST /restaurants with name+tax_rate_bps returns 201; omitted large_party_threshold defaults to 8, auto_gratuity_bps to 2000, comp_cap_bps to 10000, min_rest_minutes to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /restaurants"
              payload: { name: "Bistro", tax_rate_bps: 875 }
              as: Manager
              captures: { rid: $.data.id, lpt: $.data.large_party_threshold }
          assert:
            - "response status == 201"
            - "Restaurant.${rid}.large_party_threshold == 8"
            - "Restaurant.${rid}.auto_gratuity_bps == 2000"
            - "Restaurant.${rid}.comp_cap_bps == 10000"
            - "Restaurant.${rid}.version == 1"

      - name: get_menu_item_returns_stored_fields_and_computed_count
        claim_type: Retrieval
        grounds: [entities.MenuItem, endpoints]
        distinguishing_aspect: "GET /menu-items/{id} returns the created MenuItem with available_count == initial_available_count and is_86 == false at creation."
        test_recipe:
          setup: ["Restaurant exists; one MenuItem with initial_available_count=4."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Fries", station: "FRY", base_price_cents: 400, happy_hour_price_cents: 300, initial_available_count: 4 }
              as: Manager
              captures: { mi: $.data.id }
          trigger:
            - call: "GET /menu-items/${mi}"
              payload: {}
              as: Server
              as_user_id: "x"
          assert:
            - "response status == 200"
            - "MenuItem.${mi}.available_count == 4"
            - "MenuItem.${mi}.is_86 == false"

      - name: list_menu_items_paginated_envelope
        claim_type: Listing
        grounds: [entities.MenuItem, endpoints]
        distinguishing_aspect: "GET /menu-items?restaurant_id=&limit=1 returns response_type array with meta.total_count and has_more reflecting the full set."
        test_recipe:
          setup: ["Restaurant with 2 menu items."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "A", station: "GRILL", base_price_cents: 100, happy_hour_price_cents: 100, initial_available_count: 1 }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "B", station: "GRILL", base_price_cents: 200, happy_hour_price_cents: 200, initial_available_count: 1 }
              as: Manager
          trigger:
            - call: "GET /menu-items"
              payload: { restaurant_id: "${rid}", limit: 1 }
              as: Manager
          assert:
            - "response status == 200 and response_type == array"
            - "meta.total_count == 2 and has_more == true and len(data) == 1"

      - name: get_check_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds: [entities.Check, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /checks/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Restaurant exists; no check with the queried id."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /checks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_menu_item_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.MenuItem, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /menu-items omitting base_price_cents (required, no default) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Restaurant exists."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "X", station: "GRILL", happy_hour_price_cents: 100, initial_available_count: 1 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_menu_item_bad_enum_station_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.MenuItem.fields.station, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "station value 'OVEN' (not in {GRILL,FRY,SAUTE,COLD,BAR,EXPO}) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Restaurant exists."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "X", station: "OVEN", base_price_cents: 100, happy_hour_price_cents: 100, initial_available_count: 1 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: order_item_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.OrderItem.fields.status, entities.OrderItem.fields.unit_price_cents]
        distinguishing_aspect: "POST /order-items sets status=PENDING regardless of any client-supplied status; unit_price_cents stays unset until fire (id/created_at server-minted)."
        test_recipe:
          setup: ["Restaurant, menu item, table, server, seating, check, BUILDING course exist."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 5 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
          trigger:
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { oi: $.data.id, st: $.data.status }
          assert:
            - "response status == 201"
            - "OrderItem.${oi}.status == PENDING"

      - name: item_modifier_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ItemModifier]
        distinguishing_aspect: "ItemModifier has common_fields:false → carries only id + created_at, no version/updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["Restaurant, menu item, table, server, seating, check, course, PENDING order item exist."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 5 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { oi: $.data.id }
          trigger:
            - call: "POST /item-modifiers"
              payload: { restaurant_id: "${rid}", order_item_id: "${oi}", name: "no salt", surcharge_cents: 0 }
              as: Server
              as_user_id: "${sm}"
              captures: { mod: $.data.id }
          assert:
            - "response status == 201"
            - "the modifier response carries no version field (common_fields:false)"

      - name: seating_party_size_exceeds_table_capacity_referential
        claim_type: Parent Relationships
        grounds: ["validations[priority=7]", "errors[ERR_CAPACITY_EXCEEDED]", entities.Seating.fields.party_size]
        distinguishing_aspect: "POST /seatings with party_size 6 on a capacity-4 table returns ERR_CAPACITY_EXCEEDED 409 (referential capacity bound, distinct from the state gate)."
        test_recipe:
          setup: ["Restaurant; AVAILABLE table capacity 4; clock 2026-06-03 12:00."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-03T12:00:00Z" }
              as: Manager
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
          trigger:
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 6 }
              as: Host
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CAPACITY_EXCEEDED"

      - name: fk_reverse_reachability_courses_by_check
        claim_type: Creation
        grounds: [entities.Course.fields.check_id, endpoints]
        distinguishing_aspect: "FK Course.check_id is discoverable via GET /courses?check_id= returning Course[] (filtered-list reverse-reachability)."
        test_recipe:
          setup: ["Restaurant; a check with one BUILDING course."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
          trigger:
            - call: "GET /courses"
              payload: { check_id: "${chk}" }
              as: Server
              as_user_id: "${sm}"
          assert:
            - "response status == 200 and response_type == array"
            - "data contains exactly one course with id == ${crs}"

      - name: fk_reverse_reachability_tip_allocations_by_pool
        claim_type: Retrieval
        grounds: [entities.TipAllocation.fields.tip_pool_id, endpoints]
        distinguishing_aspect: "Cascade-created TipAllocation rows (no creation response) are discoverable only via GET /tip-allocations?tip_pool_id= returning TipAllocation[]."
        test_recipe:
          setup: ["Reuse the EVEN_BY_HOURS distributed pool from §1.8 distribute_then_payout_conserves_tip_pool_cents (pool ${pool} distributed)."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-01T20:00:00Z" }
              as: Manager
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Srv", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { srv: $.data.id }
            - call: "POST /staff-shifts"
              payload: { restaurant_id: "${rid}", staff_id: "${srv}", business_date: "2026-06-01", clock_in_minute: 600, clock_out_minute: 1080 }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Soda", station: "BAR", base_price_cents: 500, happy_hour_price_cents: 500, initial_available_count: 50 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${srv}", party_size: 2 }
              as: Server
              as_user_id: "${srv}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${srv}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${srv}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${srv}"
            - call: "POST /tip-pools"
              payload: { restaurant_id: "${rid}", business_date: "2026-06-01", distribution_mode: "EVEN_BY_HOURS" }
              as: Manager
              captures: { pool: $.data.id }
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${srv}"
            - call: "POST /payments"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", amount_cents: 500, tip_cents: 6000, method: "CARD" }
              as: Server
              as_user_id: "${srv}"
            - call: "POST /checks/${chk}/close"
              payload: {}
              as: Server
              as_user_id: "${srv}"
            - call: "POST /tip-pools/${pool}/distribute"
              payload: {}
              as: Manager
          trigger:
            - call: "GET /tip-allocations"
              payload: { tip_pool_id: "${pool}" }
              as: Manager
          assert:
            - "response status == 200 and response_type == array"
            - "data has exactly one allocation (single shift) with amount_cents == 6000"

  # =========================================================================
  # State machines — initial state, invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: check_initial_state_open_on_create
        claim_type: Initial State
        grounds: [state_machines.Check, entities.Check.fields.status]
        distinguishing_aspect: "A newly created Check has status == OPEN and provisional_subtotal_cents == 0."
        test_recipe:
          setup: ["Restaurant, table, server, seating exist."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
          trigger:
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id, st: $.data.status }
          assert:
            - "Check.${chk}.status == OPEN"
            - "Check.${chk}.provisional_subtotal_cents == 0"

      - name: close_open_check_without_present_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Check.PRESENTED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /checks/{id}/close on an OPEN (never PRESENTED) check returns ERR_INVALID_STATE 409 — close only legal from PRESENTED."
        test_recipe:
          setup: ["A check OPEN with one fired item, never presented."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 5 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "POST /checks/${chk}/close"
              payload: {}
              as: Server
              as_user_id: "${sm}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: fire_already_fired_course_idempotency_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Course.BUILDING_to_FIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Firing the same course twice → the second POST /courses/{id}/fire returns ERR_INVALID_STATE 409 (course already FIRED, terminal)."
        test_recipe:
          setup: ["A check with a fired course (one item)."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 5 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reopen_after_payment_blocked_invalid_state
        claim_type: guarded transitions
        grounds: [state_machines.Check.PRESENTED_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reopen requires amount_paid_cents==0; a PRESENTED check with a SETTLED payment returns ERR_INVALID_STATE 409 on POST /checks/{id}/reopen."
        test_recipe:
          setup: ["A presented check with a SETTLED partial payment (amount_paid_cents > 0)."]
          setup_api_calls:
            - call: "POST /restaurants"
