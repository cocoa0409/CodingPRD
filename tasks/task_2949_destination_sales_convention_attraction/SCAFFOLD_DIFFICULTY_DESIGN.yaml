              as: SalesManager
              captures: { opp_small_id: $.data.id }
            - call: "POST /opportunities/${opp_small_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_small_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-05T00:00:00Z", move_out_end: "2028-04-07T00:00:00Z" }
              as: CenterScheduler
              captures: { h1_id: $.data.id, h1_rank: $.data.hold_rank }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Large Following Expo", arrival_date: "2028-04-15", departure_date: "2028-04-16", peak_rooms_requested: 900, total_room_nights_requested: 900, attendance_estimate: 5000, exhibit_sqft_requested: 120000, rate_ceiling_amount: 215.00 }
              as: SalesManager
