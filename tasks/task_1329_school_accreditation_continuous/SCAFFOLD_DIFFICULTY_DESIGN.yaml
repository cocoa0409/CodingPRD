              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Window County", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "North", enrollment: 500 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/survey-instruments"
              payload: { stakeholder_group: "BOARD", title: "Board Survey", min_participation_pct: 10 }
              as: AccreditationOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/survey-windows"
              payload: { campus_id: "${campus_id}", instrument_id: "${inst_id}", opens_at: "2026-10-01T00:00:00Z", closes_at: "2026-11-01T00:00:00Z", eligible_count: 10 }
              as: AccreditationOfficer
              captures: { w_id: $.data.id }
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/survey-windows/${w_id}/responses"
              payload: { respondent_token: "tok-open-boundary" }
              as: Anonymous
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/survey-windows/${w_id}/responses"
              payload: { respondent_token: "tok-close-boundary" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "First response accepted (201) at exactly opens_at (inclusive lower bound)"
            - "Second response rejected at exactly closes_at (exclusive upper bound) with ERR_INVALID_STATE (window auto-CLOSED at closes_at before the response is evaluated)"
            - "Window.${w_id}.response_count == 1"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reopen_finalize_conserves_composite_index
        grounds:
          - state_machines.SelfStudyRating.FINALIZED_to_REOPENED
          - state_machines.SelfStudyRating.REOPENED_to_SUBMITTED
          - calculations.campus_composite_index
        distinguishing_aspect: |
          Conserved quantity: Campus.composite_index_pct. Forward+compensating
          pair (finalize -> reopen -> resubmit -> finalize with unchanged
          rating) MUST restore the exact composite value 75.00 — no drift.
        test_recipe:
          setup:
            - "SINGLE_SCHOOL system; standard L1(w100); term SELF_STUDY; rating 3 FINALIZED"
            - "Campus composite == 75.00 after first finalize"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Invariant School", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 300 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/ratings/${r_1}/reopen"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/campuses/${campus_id}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "Campus.composite_index_pct == 75.00 exactly after the full cycle (no drift from the reopen/refinalize compensation)"

      - name: payment_overpost_then_invoice_balance_conserved
        grounds:
          - state_machines.Invoice.ISSUED_to_PARTIALLY_PAID
          - state_machines.Invoice.ISSUED_to_PAID
        distinguishing_aspect: |
          Conserved quantity: invoice outstanding balance. Forward pair
          (partial payment 300000 -> final payment 320000) MUST leave
          sum(Payment.amount_cents) == Invoice.amount_cents == 620000 exactly
          when PAID; any further payment on the terminal PAID invoice is
          rejected so the conserved equality can never drift. Different
          conserved quantity (monetary balance vs composite index).
        test_recipe:
          setup:
            - "Fee schedule base 500000, per_campus 120000, threshold 1000; one small campus"
            - "ANNUAL_FEE invoice amount = 620000"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/fee-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", base_system_fee_cents: 500000, per_campus_fee_cents: 120000, large_campus_fee_cents: 200000, large_campus_threshold: 1000, visit_day_rate_cents: 75000 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems"
              payload: { name: "Ledger County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 300 }
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/systems/${sys_id}/invoices"
              payload: { billing_year: 2026, invoice_type: "ANNUAL_FEE" }
              as: SystemBursar
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /accreditation/invoices/${inv_id}/payments"
              payload: { amount_cents: 300000, paid_at: "2026-08-02T00:00:00Z", expected_invoice_version: "${inv_v}" }
              as: SystemBursar
            - call: "GET /accreditation/invoices/${inv_id}"
              payload: {}
              as: SystemBursar
              captures: { inv_v2: $.data.version }
            - call: "POST /accreditation/invoices/${inv_id}/payments"
              payload: { amount_cents: 320000, paid_at: "2026-08-03T00:00:00Z", expected_invoice_version: "${inv_v2}" }
              as: SystemBursar
            - call: "GET /accreditation/invoices/${inv_id}"
              payload: {}
              as: SystemBursar
              captures: { inv_v3: $.data.version }
            - call: "POST /accreditation/invoices/${inv_id}/payments"
              payload: { amount_cents: 1, paid_at: "2026-08-04T00:00:00Z", expected_invoice_version: "${inv_v3}" }
              as: SystemBursar
              captures: { err: $.data.error_id }
          assert:
            - "Invoice.${inv_id}.amount_cents == 620000"
            - "After payments 300000 + 320000: Invoice.status == PAID and sum of payments == 620000 == amount_cents exactly"
            - "Further payment of 1 cent on the PAID invoice is rejected (terminal-state lockdown with ERR_INVALID_STATE) — the outstanding-balance invariant sum(payments) == amount_cents holds permanently"
