            - "hop 4: MembershipAgreement.${ag_id}.visits_fulfilled_count == 1 and revenue_recognized_cents == 25000, the 100000-cent price recognised over one of four owed visits"
  # ================================================================ RULE 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_versus_referential_on_dispatch
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_NO_APPOINTMENT_LINES]
          - errors[ERR_NO_ELIGIBLE_TECHNICIAN]
        distinguishing_aspect: |
          A `state` category rule (priority 5) meets a `business_referential` rule (priority 10) on the same
          dispatch request: the zero-line appointment wins with ERR_NO_APPOINTMENT_LINES even though the
          skill-referential rule is also unsatisfiable on this fixture.
        test_recipe:
          setup:
            - "one branch, one technician holding only the PLUMBING skill, one published HVAC task"
            - "one appointment with a single line whose task requires HVAC, so no eligible technician exists"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["PLUMBING"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COMP", category: "HVAC", display_name: "Compressor Replacement", required_skill_code: "HVAC", estimated_hours: 3.0, flat_rate_cents: 300000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T12:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-COMP" }
              as: Dispatcher
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
              captures: { err_both: $.data.error_id }
          assert:
            - "the trigger returns ERR_NO_ELIGIBLE_TECHNICIAN (422) because the appointment does carry a line, so priority 5 does not fire"
            - "on the same fixture, dispatching an appointment with zero lines returns ERR_NO_APPOINTMENT_LINES (409), so the state rule outranks the referential rule"
            - "a second appointment with zero lines returns ERR_NO_APPOINTMENT_LINES (409) on the identical payload, isolating the presence of a line as the only difference"
      - name: business_safety_versus_business_temporal_on_booking
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_WINDOW_OVERLAP]
          - errors[ERR_WINDOW_INVALID]
        distinguishing_aspect: |
          A `business_safety` rule (priority 7) meets a `business_temporal` rule (priority 8) on the same
          booking payload: a backwards window that also overlaps a live appointment is reported as
          ERR_WINDOW_OVERLAP rather than ERR_WINDOW_INVALID.
        test_recipe:
          setup:
            - "one branch and one live appointment occupying 2026-09-10T09:00:00Z through 2026-09-10T11:00:00Z"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-09-10T11:00:00Z", window_end_utc: "2026-09-10T10:00:00Z" }
              as: Dispatcher
              captures: { err_pair: $.data.error_id }
          assert:
            - "the trigger returns ERR_WINDOW_OVERLAP (409), the business_safety rule at priority 7"
            - "a booking that is merely backwards at 2026-09-10T14:00:00Z to 2026-09-10T13:00:00Z returns ERR_WINDOW_INVALID (400), the business_temporal rule at priority 8"
            - "the two rules sit on different error-category pairs from the dispatch fixture, which pairs state with business_referential"
  # ================================================================ RULE 6
  - rule_id: boundary_precision_check
    instances:
      - name: branch_capacity_exact_threshold_at_booking
        grounds:
          - validations[priority=5]
          - entities.Branch.fields.capacity_consumed_hours
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          A numeric threshold crossing on Branch capacity: a booking whose estimated hours bring
          capacity_consumed_hours to exactly 8.0 on an 8.0-hour branch is admitted, because the capacity
          comparison is not strict, while a 9.0-hour booking crosses it.
        test_recipe:
          setup:
            - "one branch with daily_dispatch_capacity_hours 8, one HVAC technician, one published HVAC task of 4.0 estimated hours"
            - "two appointments already booked with dispatched lines, consuming 8.0 hours"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 8 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COIL", category: "HVAC", display_name: "Coil Clean", required_skill_code: "HVAC", estimated_hours: 4.0, flat_rate_cents: 15000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-11T09:00:00Z", window_end_utc: "2026-09-11T11:00:00Z" }
              as: Dispatcher
              captures: { a1_id: $.data.id }
            - call: "POST /api/appointments/${a1_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a1_id}" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-09-12T09:00:00Z", window_end_utc: "2026-09-12T11:00:00Z" }
              as: Dispatcher
              captures: { a2_id: $.data.id }
            - call: "POST /api/appointments/${a2_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a2_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Cy", postal_code: "78701", window_start_utc: "2026-09-13T09:00:00Z", window_end_utc: "2026-09-13T11:00:00Z" }
              as: Dispatcher
              captures: { a3_id: $.data.id }
          assert:
            - "Branch.${br_id}.capacity_consumed_hours == 8.0 after the two setup dispatches"
            - "the trigger succeeds with 201, because capacity is checked against the branch's own dispatched hours and the incoming pair of zero-hour lines leaves the total at 8.0"
            - "the boundary is 8.0 exactly: the third appointment is the (capacity == consumed) case, and it is admitted rather than refused"
      - name: replenishment_exact_shortfall_edge
        grounds:
          - entities.TruckStockItem.fields.replenish_shortfall_units
          - entities.TruckStockItem.fields.status
          - state_machines.TruckStockItem.SHORT_to_PENDING_REPLENISHMENT
        distinguishing_aspect: |
          An empty-collection edge rather than a numeric threshold: an item whose quantity_on_hand equals
          its reorder_point reports replenish_shortfall_units 1 and is SHORT, while an item whose
          quantity_on_hand exceeds the reorder_point reports 0 and is STOCKED.
        test_recipe:
          setup:
            - "no truck rows exist; this instance observes the derived fields directly on the two TruckStockItem shapes"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "GET /api/branches/${br_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "with quantity_on_hand 4 and reorder_point 4 the derived replenish_shortfall_units is 1, since the formula is reorder_point + 1 - quantity_on_hand"
            - "with quantity_on_hand 5 and reorder_point 4 the derived replenish_shortfall_units is 0 and the item is not short"
            - "the boundary is the inclusive reorder point: quantity_on_hand == reorder_point counts as short, quantity_on_hand == reorder_point + 1 does not"
  # ================================================================ RULE 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: call_review_requires_completed_appointment
        grounds:
          - state_machines.CallRecord.COACHING_ASSIGNED_to_REVIEWED
          - errors[ERR_CALL_NOT_REVIEWABLE]
          - validations[priority=22]
        distinguishing_aspect: |
          The CallRecord to Appointment pair: the call's COACHING_ASSIGNED to REVIEWED transition is
          refused while the attributed appointment is merely DISPATCHED", and succeeds only once that
          appointment reaches COMPLETED.
        test_recipe:
