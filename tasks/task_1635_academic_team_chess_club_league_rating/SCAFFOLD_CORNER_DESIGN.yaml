  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: rating_dual_variant_core
        claim_type: variant_divergence
        grounds:
          - "calculations.rating_update"
        excluded_because:
          difficulty_instance: provisional_vs_established_rating_divergence
          rationale: "Variant divergence with literal ratings asserted in the named §1.8 instance."

      - name: travel_stipend_dual_variant_core
        claim_type: variant_divergence
        grounds:
          - "calculations.travel_stipend"
        excluded_because:
          difficulty_instance: projected_vs_actual_travel_stipend
          rationale: "PROJECTED vs ACTUAL inclusion-set divergence asserted in the named §1.8 instance."

      - name: membership_fee_deadline_boundary
        claim_type: precision
        grounds:
          - "calculations.membership_fee"
        distinguishing_aspect: "Threshold uses <=: created exactly at dues_deadline pays regular 2500; one second later pays late 3750."
        test_recipe:
          setup: ["Season (regular 2500 / late 3750, deadline 2026-09-01T00:00:00Z) ACTIVE; club A with players P1, P2"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P2", grade_level: 9 }, as: FederationAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: FederationAdmin }
          trigger:
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { f1: $.data.fee_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:01Z" }, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p2}", season_id: "${sid}" }, as: FederationAdmin, captures: { f2: $.data.fee_cents } }
          assert:
            - "At exactly the deadline: fee_cents == 2500 (${f1}); one second later: fee_cents == 3750 (${f2})"

