              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_CYCLE_NOT_FOUND }
            - call: "POST /disclosure/officer-certifications"
              payload: { cycle_id: "${cycle_id}", officer_member_id: "00000000-0000-4000-8000-00000000beef", cert_type: "CEO_302" }
              as: ComplianceAdmin
              expect_error: { http: 404, error_id: ERR_MEMBER_NOT_FOUND }
            - call: "POST /disclosure/officer-certifications"
              payload: { cycle_id: "${cycle_id}", officer_member_id: "${foreign_officer}", cert_type: "CEO_302" }
              as: ComplianceAdmin
