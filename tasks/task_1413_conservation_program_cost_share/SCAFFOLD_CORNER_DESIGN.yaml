# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth probe over every testable claim of SCAFFOLD.yaml §1.1–§1.7 that §1.8
# does not already cover. Sections/claim_types per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: program_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.ConservationProgram.fields.spot_check_modulus, entities.ConservationProgram.fields.advance_cap_pct]
        distinguishing_aspect: "Omitting optional inputs applies defaults: spot_check_modulus == 5, advance_cap_pct == 0.5; status == SETUP; ranking_run_count == 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id, mod: $.data.spot_check_modulus, cap: $.data.advance_cap_pct, st: $.data.status, rrc: $.data.ranking_run_count } }
          trigger: []
          assert:
            - "mod == 5 and cap == 0.5 (defaults applied)"
            - "st == SETUP and rrc == 0 (initial state and system default)"

      - name: applicant_hu_flag_computed
        claim_type: computed_fields
        grounds: [entities.Applicant.fields.historically_underserved]
        distinguishing_aspect: "historically_underserved is computed from hu_category: LIMITED_RESOURCE -> true, NONE -> false; client-supplied value is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /eqip/applicants", payload: { legal_name: "H", hu_category: "LIMITED_RESOURCE", parcel_ids: ["P-1"] }, as: ProgramAdmin, captures: { hu: $.data.historically_underserved } }
            - { call: "POST /eqip/applicants", payload: { legal_name: "S", hu_category: "NONE", parcel_ids: ["P-2"] }, as: ProgramAdmin, captures: { std: $.data.historically_underserved } }
          trigger: []
          assert:
            - "hu == true and std == false"

      - name: program_create_client_id_input_ignored
        claim_type: system_fields
        grounds: [entities.ConservationProgram]
        distinguishing_aspect: "Client-supplied id/version are not part of input and ignored; server mints a UUID id and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", id: "11111111-1111-4111-8111-111111111111", version: 99 }, as: ProgramAdmin, captures: { rid: $.data.id, rv: $.data.version } }
          assert:
            - "rid != 11111111-1111-4111-8111-111111111111 (server-minted)"
            - "rv == 1"

      - name: missing_resources_return_typed_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CONTRACT_NOT_FOUND]", "errors[ERR_POOL_NOT_FOUND]", "errors[ERR_APPLICATION_NOT_FOUND]", "errors[ERR_RECOUPMENT_DEMAND_NOT_FOUND]"]
        distinguishing_aspect: "Each resource family returns its own typed 404 error_id on a non-existent UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /eqip/contracts/11111111-1111-4111-8111-111111111111", payload: {}, as: ProgramAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /eqip/pools/11111111-1111-4111-8111-111111111111", payload: {}, as: ProgramAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /eqip/applications/11111111-1111-4111-8111-111111111111", payload: {}, as: ProgramAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /eqip/recoupment-demands/11111111-1111-4111-8111-111111111111", payload: {}, as: ProgramAdmin, captures: { e4: $.data.error_id } }
          assert:
            - "e1 == ERR_CONTRACT_NOT_FOUND; e2 == ERR_POOL_NOT_FOUND; e3 == ERR_APPLICATION_NOT_FOUND; e4 == ERR_RECOUPMENT_DEMAND_NOT_FOUND (all HTTP 404)"

      - name: application_missing_required_parcel_rejected
        claim_type: required_fields
        grounds: [entities.Application.fields.parcel_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field parcel_id at creation -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["program exists (window irrelevant for shape validation); applicant exists"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-1"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", planned_practices: [ { practice_code: "FENCE", quantity: 10 } ], self_reported_answers: {} }, as: Applicant, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: rate_and_criterion_uniqueness_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_RATE]", "errors[ERR_DUPLICATE_CRITERION]"]
        distinguishing_aspect: "Second rate with same practice_code in the same program -> ERR_DUPLICATE_RATE (409); second criterion with same code -> ERR_DUPLICATE_CRITERION (409)."
        test_recipe:
          setup: ["program in SETUP with one FENCE rate and one SOIL_HEALTH criterion"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 301, hu_rate_cents: 361, lifespan_years: 10 }, as: ProgramAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 2.0, max_points: 40 }, as: ProgramAdmin, captures: { e2: $.data.error_id } }
          assert:
            - "e1 == ERR_DUPLICATE_RATE; e2 == ERR_DUPLICATE_CRITERION"

      - name: applicant_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Applicant.fields.hu_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "hu_category outside the enum -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /eqip/applicants", payload: { legal_name: "X", hu_category: "SUPREME_BEING", parcel_ids: ["P-1"] }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: application_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Application]
        distinguishing_aspect: "New application is DRAFT with null ranking_score and null funded_pool_id."
        test_recipe:
          setup: ["program OPEN with pool, rate, criterion; applicant with parcel P-1"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-1"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-1", planned_practices: [ { practice_code: "FENCE", quantity: 10 } ], self_reported_answers: { SOIL_HEALTH: 5 } }, as: Applicant, as_user_id: "${a1}", captures: { st: $.data.status, rs: $.data.ranking_score, fp: $.data.funded_pool_id } }
          assert:
            - "st == DRAFT; rs == null; fp == null"

      - name: withdraw_obligated_application_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Application, "errors[ERR_APPLICATION_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "OBLIGATED is terminal for withdrawal: withdraw after contract obligation -> ERR_APPLICATION_NOT_WITHDRAWABLE (409); contract and pool untouched."
        test_recipe:
          setup: ["full happy path: application OBLIGATED via contract (FENCE 1000, pool 1000000)"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/applications/${app}/withdraw", payload: {}, as: Applicant, as_user_id: "${a1}", captures: { err: $.data.error_id } }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { oblig: $.data.obligated_cents } }
          assert:
            - "err == ERR_APPLICATION_NOT_WITHDRAWABLE"
            - "oblig == 300000 (no side effects leaked from the rejected transition)"

      - name: spot_check_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SpotCheck, "errors[ERR_SPOT_CHECK_NOT_PENDING]"]
        distinguishing_aspect: "A PASSED spot check accepts no further record-result: second call -> ERR_SPOT_CHECK_NOT_PENDING (409)."
        test_recipe:
          setup: ["certified FENCE item (planner-1); PENDING spot check by qa-1"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/practice-items/${item}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/practice-items/${item}/certify", payload: { certified_quantity: 1000 }, as: ConservationPlanner, as_user_id: "planner-1" }
            - { call: "POST /eqip/spot-checks", payload: { contract_id: "${con}", practice_item_id: "${item}" }, as: QualityAssuranceOfficer, as_user_id: "qa-1", captures: { sc: $.data.id } }
            - { call: "POST /eqip/spot-checks/${sc}/record-result", payload: { result: "PASS" }, as: QualityAssuranceOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /eqip/spot-checks/${sc}/record-result", payload: { result: "PASS" }, as: QualityAssuranceOfficer, as_user_id: "qa-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SPOT_CHECK_NOT_PENDING (terminal lockdown; idempotent-looking replay rejected)"

      - name: certification_failure_retry_cycle
        claim_type: valid_transition
        grounds: [state_machines.ContractPracticeItem.CERTIFICATION_FAILED_to_INSTALLED]
        distinguishing_aspect: "Cyclic machine: INSTALLED -> CERTIFICATION_FAILED -> INSTALLED -> CERTIFIED all reachable on the same item."
        test_recipe:
          setup: ["contract OBLIGATED with FENCE item PLANNED"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/practice-items/${item}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}", captures: { s1: $.data.certification_status } }
            - { call: "POST /eqip/practice-items/${item}/fail-certification", payload: {}, as: ConservationPlanner, as_user_id: "planner-1", captures: { s2: $.data.certification_status } }
            - { call: "POST /eqip/practice-items/${item}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}", captures: { s3: $.data.certification_status } }
            - { call: "POST /eqip/practice-items/${item}/certify", payload: { certified_quantity: 950 }, as: ConservationPlanner, as_user_id: "planner-1", captures: { s4: $.data.certification_status, cq: $.data.certified_quantity } }
          assert:
            - "s1 == INSTALLED; s2 == CERTIFICATION_FAILED; s3 == INSTALLED (retry loop); s4 == CERTIFIED; cq == 950"

      - name: certify_creates_maintenance_obligation
        claim_type: side_effect_execution
        grounds: [state_machines.ContractPracticeItem.INSTALLED_to_CERTIFIED, calculations.maintenance_window]
        distinguishing_aspect: "Certification at 2026-10-01 (COVER_CROP lifespan 5y) spawns obligation ACTIVE with start 2026-10-01T00:00:00Z and end 2031-09-30T00:00:00Z (+1825 days)."
        test_recipe:
          setup: ["contract OBLIGATED; COVER_CROP item INSTALLED; clock at 2026-10-01"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "COVER_CROP", quantity: 10 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "COVER_CROP", planned_quantity: 10, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/practice-items/${item}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/practice-items/${item}/certify", payload: { certified_quantity: 10 }, as: ConservationPlanner, as_user_id: "planner-1" }
            - { call: "GET /eqip/maintenance-obligations", payload: { practice_item_id: "${item}" }, as: ProgramAdmin, captures: { ost: "$.data[0].status", ost_start: "$.data[0].start_date", ost_end: "$.data[0].end_date", ocode: "$.data[0].practice_code", oparcel: "$.data[0].parcel_id" } }
          assert:
            - "ost == ACTIVE; ost_start == 2026-10-01T00:00:00Z; ost_end == 2031-09-30T00:00:00Z (5 * 365 days)"
            - "ocode == COVER_CROP and oparcel == P-100 (copied from item/application)"

      - name: item_expiry_sweep_deadline_boundary
        claim_type: valid_transition
        grounds: [state_machines.ContractPracticeItem.PLANNED_to_EXPIRED]
        distinguishing_aspect: "System sweep boundary: at clock == deadline the item stays PLANNED (breach is strictly clock > deadline); one second later it is EXPIRED and the pool obligation is released."
        test_recipe:
          setup: ["contract OBLIGATED; FENCE item (300000) deadline 2027-03-01T00:00:00Z; pool 1000000 (obligated 300000)"]
          setup_api_calls:
