            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator }
            - { call: "POST /plant/products", payload: { sku_code: "C-OCC2", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-OCC2", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 50, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${lv}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
            - { call: "POST /plant/runs/${run_id}/schedule", payload: {}, as: LineScheduler }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_id}", allocated_kg: 194.4 }, as: LineScheduler }
            - { call: "POST /plant/runs/${run_id}/start", payload: {}, as: LineScheduler }
            - { call: "POST /plant/pack-orders", payload: { production_run_id: "${run_id}", cases_planned: 30, verification_method: "AVERAGE_WEIGHT" }, as: PackagingLead, captures: { po_id: "$.data.id" } }
            - { call: "POST /plant/pack-orders/${po_id}/start-packing", payload: {}, as: PackagingLead }
            - { call: "POST /plant/pack-orders/${po_id}/weight-check", payload: { cases_packed: 30, sample_weights_g: [360.0, 360.0, 360.0] }, as: PackagingLead }
            - { call: "POST /plant/pack-orders/${po_id}/seal", payload: {}, as: PackagingLead }
            - { call: "POST /plant/customers", payload: { account_name: "OCC2 Mart", channel: "RETAIL_GROCERY", region: "R1", base_weekly_cases: 30, priority_tier: "A", min_shelf_life_pct: 30 }, as: PlantManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/routes", payload: { route_code: "R-OCC2", route_date: "2026-08-05", region: "R1", vehicle_capacity_cases: 100 }, as: RouteDispatcher, captures: { route_id: "$.data.id", rv1: "$.data.version" } }
            - { call: "POST /plant/routes/${route_id}/stops", payload: { customer_id: "${cust_id}", pack_order_id: "${po_id}", requested_cases: 5, expected_route_version: "${rv1}" }, as: RouteDispatcher, captures: { stop1: "$.data.id" } }
          trigger:
            - { call: "POST /plant/routes/${route_id}/stops", payload: { customer_id: "${cust_id}", pack_order_id: "${po_id}", requested_cases: 5, expected_route_version: "${rv1}" }, as: RouteDispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION (http 412): route version advanced 1 -> 2 after stop 1"
            - "only one stop persisted; route committed_cases == 5"

      - name: cc_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[run-create-stale-line]"
          - "entities.ProductionLine.fields.line_status"
        distinguishing_aspect: "Each line mutation bumps version by exactly 1: create v1 -> DOWN v2 -> ACTIVE v3; updated_at refreshes on each write."
        test_recipe:
          setup: ["one line created"]
          setup_api_calls:
            - { call: "POST /plant/lines", payload: { line_code: "L-VER", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /plant/lines/${line_id}/set-status", payload: { line_status: "DOWN" }, as: PlantManager, captures: { v2: "$.data.version", st2: "$.data.line_status" } }
            - { call: "POST /plant/lines/${line_id}/set-status", payload: { line_status: "ACTIVE" }, as: PlantManager, captures: { v3: "$.data.version", st3: "$.data.line_status" } }
          assert:
            - "v1 == 1, after DOWN v2 == 2, after ACTIVE v3 == 3 (exactly +1 per mutation)"
            - "line_status reflects DOWN then ACTIVE"

      - name: cc_derived_lot_fields_reconcile_on_draw
        claim_type: derived_field_reconciliation
        grounds: [entities.IngredientLot.fields.drawn_kg, entities.IngredientLot.fields.available_kg]
        distinguishing_aspect: "drawn_kg and available_kg recompute on every batch draw: 5000 -> two draws of 1000 and 500 leave drawn 1500 / available 3500."
        test_recipe:
          setup: ["CONDITIONED lot 5000 kg"]
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-DR", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator }
          trigger:
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 500, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator }
            - { call: "GET /plant/ingredient-lots/${lot_id}", payload: {}, as: MillerOperator, captures: { drawn: "$.data.drawn_kg", avail: "$.data.available_kg", lst: "$.data.lot_status" } }
          assert:
            - "drawn_kg == 1500 and available_kg == 3500 after both draws"
            - "lot_status == CONDITIONED (not depleted: 3500 > 0)"

      - name: cc_quarantine_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.NixtamalBatch.MASA_AVAILABLE_to_QUARANTINED]
        excluded_because:
          difficulty_instance: "transitive_cascade / batch_quarantine_cascades_release_demote_changeover_cancel"
          rationale: "The 3-level cascade is asserted end-to-end there."

      - name: cc_window_activation_sweep_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.SeasonalWindow.SCHEDULED_to_ACTIVE]
        excluded_because:
          difficulty_instance: "transitive_cascade / seasonal_activation_sweep_shortens_stops"
          rationale: "The activate -> allotment -> short -> restock chain is asserted there."

      - name: cc_dual_variant_yield_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.theoretical_masa_yield, calculations.actual_masa_yield]
        excluded_because:
          difficulty_instance: "dual_variant_calc / masa_yield_theoretical_vs_actual_diverge"
          rationale: "Both variants and their delta asserted there."

      - name: cc_dual_variant_pack_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.pack_weight_verification]
        excluded_because:
          difficulty_instance: "dual_variant_calc / pack_weight_average_vs_count_verify_diverge"
          rationale: "Variant divergence on identical samples asserted there."

      - name: cc_route_committed_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds: [entities.Route.fields.committed_cases, entities.PackOrder.fields.cases_available]
        excluded_because:
          difficulty_instance: "compensating_invariant / cases_stop_short_conserves_pack_cases"
          rationale: "committed_cases and cases_available are asserted before and after allocate/short there."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: cons_immediate_visibility_in_mutation_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, response_envelope]
        distinguishing_aspect: "Immediate consistency: mutation responses carry the computed state in the SAME response (no re-read needed) — batch creation returns theoretical_masa_kg; weight-check returns pack_status + avg_pack_weight_g; seal returns expires_on."
        test_recipe:
          setup: ["run IN_PROGRESS on milled batch; pack order PACKING"]
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-IM", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
