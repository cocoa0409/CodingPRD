# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of every other testable claim)
# Sections and claim_types come from references/claim-extraction-guide.md.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: school_creation_returns_prospect_status_and_zeroed_aggregates
        claim_type: Creation
        grounds: [entities.School.fields.partnership_status, entities.School.fields.impact_index_interim, endpoints]
        distinguishing_aspect: "POST /schools with the five required fields returns 201, partnership_status PROSPECT, version 1 and every computed aggregate at 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id, status: $.data.partnership_status }
          assert:
            - "HTTP status == 201"
            - "School.${school_id}.partnership_status == PROSPECT"
            - "School.${school_id}.version == 1"
            - "School.${school_id}.target_student_count == 0"
            - "School.${school_id}.impact_index_interim == 0.00 and impact_index_audited == 0.00"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: supply_item_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds: [entities.SupplyItem.fields.hygiene_sealed_required, entities.SupplyItem.fields.catalog_active]
        distinguishing_aspect: "Omitting hygiene_sealed_required and catalog_active yields false and true respectively."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /supply-items"
              payload: { sku: "NBK-01", name: "Composition notebook", category: "PAPER", unit_cost_cents: 180, bulk_pack_size: 10 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { item_id: $.data.id, sealed_flag: $.data.hygiene_sealed_required, active_flag: $.data.catalog_active }
          assert:
            - "SupplyItem.${item_id}.hygiene_sealed_required == false"
            - "SupplyItem.${item_id}.catalog_active == true"

      - name: supply_item_duplicate_sku_is_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=22]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "A second SupplyItem with sku PEN-12 returns 409 ERR_DUPLICATE_SKU and does not create a row."
        test_recipe:
          setup: ["Catalog already holds sku PEN-12."]
          setup_api_calls:
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils, cheaper", category: "WRITING", unit_cost_cents: 199, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_SKU"
            - "SupplyItem.${first_id}.unit_cost_cents == 250"

      - name: supply_item_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /supply-items without bulk_pack_size returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: grade_kit_spec_computed_kit_unit_cost_and_line_count
        claim_type: Computed Fields
        grounds: [calculations.kit_unit_cost, entities.GradeKitSpec.fields.kit_unit_cost_cents, entities.GradeKitSpec.fields.line_count]
        distinguishing_aspect: "A three-line K_2 kit of 4 pencils (250), 2 notebooks (180) and 1 backpack (1450) computes kit_unit_cost_cents 2810 and line_count 3."
        test_recipe:
          setup: ["Lincoln Elementary is ACTIVE; the catalog holds pencils, notebooks and backpacks."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { pencil_id: $.data.id }
            - call: "POST /supply-items"
              payload: { sku: "NBK-01", name: "Composition notebook", category: "PAPER", unit_cost_cents: 180, bulk_pack_size: 10 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { notebook_id: $.data.id }
            - call: "POST /supply-items"
              payload: { sku: "BPK-01", name: "Standard backpack", category: "BACKPACK", unit_cost_cents: 1450, bulk_pack_size: 6 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { backpack_id: $.data.id }
            - call: "POST /grade-kit-specs"
              payload: { school_id: "${school_id}", grade_band: "K_2", student_target_count: 100 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${pencil_id}", qty_per_student: 4 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${notebook_id}", qty_per_student: 2 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "${backpack_id}", qty_per_student: 1 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { line3_id: $.data.id }
            - call: "GET /grade-kit-specs/${spec_id}"
              payload: {}
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { cost: $.data.kit_unit_cost_cents, lines: $.data.line_count }
          assert:
            - "GradeKitSpec.${spec_id}.kit_unit_cost_cents == 2810"
            - "GradeKitSpec.${spec_id}.line_count == 3"
            - "GradeKitSpec.${spec_id}.status == DRAFT"

      - name: kit_spec_line_body_fk_supply_item_not_found
        claim_type: Not Found
        grounds: ["validations[priority=5]", "errors[ERR_SUPPLY_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "A kit spec line naming a non-existent supply_item_id returns 404 ERR_SUPPLY_ITEM_NOT_FOUND and leaves line_count at 0."
        test_recipe:
          setup: ["Lincoln Elementary is ACTIVE and owns one DRAFT K_2 spec with no lines."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /grade-kit-specs"
              payload: { school_id: "${school_id}", grade_band: "K_2", student_target_count: 100 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /kit-spec-lines"
              payload: { grade_kit_spec_id: "${spec_id}", supply_item_id: "00000000-0000-4000-8000-000000000000", qty_per_student: 4 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_SUPPLY_ITEM_NOT_FOUND"
            - "GradeKitSpec.${spec_id}.line_count == 0"

      - name: cash_donation_restriction_type_and_fk_must_agree
        claim_type: Type Constraints
        grounds: ["validations[priority=29]", "errors[ERR_CASH_RESTRICTION_VIOLATION]", entities.CashDonation.fields.restriction_type]
        distinguishing_aspect: "An ITEM_RESTRICTED gift without restricted_supply_item_id returns 422 ERR_CASH_RESTRICTION_VIOLATION and the cycle's cash_received_cents stays 0."
        test_recipe:
          setup: ["Cycle 'Back-to-School 2026' is COLLECTING with no gifts yet."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /cash-donations"
              payload: { drive_cycle_id: "${cycle_id}", donor_name: "Backpack Fund", amount_cents: 30000, restriction_type: "ITEM_RESTRICTED" }
              as: DonorRelations
              as_user_id: "dr-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_CASH_RESTRICTION_VIOLATION"
            - "DriveCycle.${cycle_id}.cash_received_cents == 0"
            - "GET /cash-donations with drive_cycle_id=${cycle_id} returns an empty array"

      - name: inventory_position_is_created_lazily_by_first_adjustment
        claim_type: Creation
        grounds: [endpoints, entities.InventoryPosition.fields.adjustment_qty, calculations.item_conservation]
        distinguishing_aspect: "The first cycle-count adjustment for a (cycle, item) pair creates the position with on_hand_qty 12, adjustment_qty 12 and every other counter at 0."
        test_recipe:
          setup: ["Cycle 'Back-to-School 2026' is COLLECTING and pencils exist in the catalog; no position exists yet."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { pencil_id: $.data.id }
          trigger:
            - call: "POST /inventory-positions/adjustments"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", delta_on_hand_qty: 12, reason: "opening count" }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { pos_id: $.data.id, on_hand: $.data.on_hand_qty }
          assert:
            - "InventoryPosition.${pos_id}.on_hand_qty == 12"
            - "InventoryPosition.${pos_id}.adjustment_qty == 12"
            - "InventoryPosition.${pos_id}.reserved_qty == 0 and distributed_qty == 0 and damaged_qty == 0"
            - "DriveCycle.${cycle_id}.total_items_on_hand == 12"
            - "GET /inventory-positions with drive_cycle_id=${cycle_id} returns exactly 1 position"

      - name: distribution_event_listing_is_paginated_with_envelope_counts
        claim_type: Listing
        grounds: [endpoints, entities.DistributionEvent.fields.seat_capacity]
        distinguishing_aspect: "GET /distribution-events?school_id=...&limit=1&offset=0 returns one item with total_count 2 and has_more true."
        test_recipe:
          setup: ["Lincoln Elementary is ACTIVE with two DRAFT events of 10 seats each in the COLLECTING cycle."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "K_2", window_start: "2026-08-20T15:00:00Z", window_end: "2026-08-20T17:00:00Z", seat_capacity: 10 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev1_id: $.data.id }
            - call: "POST /distribution-events"
              payload: { school_id: "${school_id}", drive_cycle_id: "${cycle_id}", grade_band: "G3_5", window_start: "2026-08-21T15:00:00Z", window_end: "2026-08-21T17:00:00Z", seat_capacity: 10 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { ev2_id: $.data.id }
          trigger:
            - call: "GET /distribution-events"
              payload: { school_id: "${school_id}", limit: 1, offset: 0 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response_type == array and exactly 1 item is returned"
            - "meta/pagination reports total_count == 2 and has_more == true"
            - "the returned item is one of ${ev1_id} or ${ev2_id}"

  - section: state_machines
    instances:

      - name: school_direct_prospect_to_active_is_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.School.PROSPECT_to_MOU_PENDING", "errors[ERR_INVALID_SCHOOL_STATE]"]
        distinguishing_aspect: "PROSPECT -> ACTIVE is not declared, so the jump returns 409 ERR_INVALID_SCHOOL_STATE and partnership_status stays PROSPECT."
        test_recipe:
          setup: ["One school sits at PROSPECT."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
          trigger:
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_SCHOOL_STATE"
            - "School.${school_id}.partnership_status == PROSPECT"
            - "School.${school_id}.version == 1"

      - name: archived_school_is_terminal_and_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.School.ACTIVE_to_ARCHIVED", "errors[ERR_INVALID_SCHOOL_STATE]"]
        distinguishing_aspect: "After ARCHIVED, a reactivation attempt returns 409 ERR_INVALID_SCHOOL_STATE and the school stays ARCHIVED."
        test_recipe:
          setup: ["Lincoln Elementary reached ACTIVE and was then ARCHIVED with no live events."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 400, max_concurrent_seats: 120 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ARCHIVED" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_SCHOOL_STATE"
            - "School.${school_id}.partnership_status == ARCHIVED"

      - name: year_round_cycle_reopens_collection_from_distribution
        claim_type: Valid Transition
        grounds: ["state_machines.DriveCycle.DISTRIBUTION_to_COLLECTING", "entities.DriveCycle.fields.cadence"]
        distinguishing_aspect: "A YEAR_ROUND cycle moves DISTRIBUTION -> COLLECTING and lands back in COLLECTING with its version incremented."
        test_recipe:
          setup: ["A YEAR_ROUND cycle has advanced DRAFT -> COLLECTING -> SORTING -> DISTRIBUTION."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Year-Round 2026", cadence: "YEAR_ROUND", window_start: "2026-07-01T00:00:00Z", window_end: "2027-06-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "SORTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "DISTRIBUTION" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { status: $.data.status, ver: $.data.version }
          assert:
            - "HTTP status == 200"
            - "DriveCycle.${cycle_id}.status == COLLECTING"
            - "DriveCycle.${cycle_id}.version == 5"

      - name: back_to_school_cadence_forbids_reopening_collection
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=17]", "errors[ERR_CADENCE_FORBIDS_REOPEN]", "state_machines.DriveCycle.DISTRIBUTION_to_COLLECTING"]
        distinguishing_aspect: "The same DISTRIBUTION -> COLLECTING request on a BACK_TO_SCHOOL cycle returns 409 ERR_CADENCE_FORBIDS_REOPEN and the cycle stays in DISTRIBUTION."
        test_recipe:
          setup: ["A BACK_TO_SCHOOL cycle has advanced to DISTRIBUTION."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "SORTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "DISTRIBUTION" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CADENCE_FORBIDS_REOPEN"
            - "DriveCycle.${cycle_id}.status == DISTRIBUTION"

      - name: cycle_cannot_enter_distribution_with_open_batches
        claim_type: Precondition Enforcement
        grounds: ["state_machines.DriveCycle.SORTING_to_DISTRIBUTION", "errors[ERR_INVALID_CYCLE_STATE]", "entities.DonationBatch.fields.status"]
        distinguishing_aspect: "With one INSPECTED batch outstanding, SORTING -> DISTRIBUTION returns 409 ERR_INVALID_CYCLE_STATE and the cycle stays SORTING."
        test_recipe:
          setup: ["Cycle is SORTING; site 'Northside Depot' is ACTIVE and holds one INSPECTED pencil batch."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
