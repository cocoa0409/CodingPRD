            - "fu_st == 'PENDING' and fu_due == '2026-08-17T09:00:00Z' (closed_at + 5 business days)"

      - name: withdraw_cascade_releases_children_and_freezes_tolling
        claim_type: side_effect_execution
        grounds: [state_machines.PatientCase.UNDER_INVESTIGATION_to_WITHDRAWN, state_machines.ClockSuspension.OPEN_to_CLOSED]
        distinguishing_aspect: "Withdraw from UNDER_INVESTIGATION cascades: assignment RELEASED, investigation CANCELLED, open suspension CLOSED with credited_seconds frozen at withdraw time (259200 for 3 days)."
        test_recipe:
          setup: ["Grievance UNDER_INVESTIGATION; suspension opened 2026-08-05T09:00:00Z; withdraw at 2026-08-08T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Neuro", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
