        distinguishing_aspect: |
          Depth-2 cascade originating from a DIFFERENT trigger (shipment dispatch): dispatching the
          Shipment (A: SH -> DISPATCHED) causes its linked PhotoOrder to transition (B: O PAID ->
          FULFILLED). Link B is caused by link A. Distinct propagation pattern and distinct trigger
          from the retake cascade.
        test_recipe:
          setup:
            - "Session GALLERY_OPEN; order O PAID (merch 4750); a PENDING Shipment SH with tracking_code for O."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Aspen School", scheduled_date: "2026-05-08T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
