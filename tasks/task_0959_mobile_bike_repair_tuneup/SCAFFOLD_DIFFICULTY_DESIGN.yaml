  - rule_id: resource_temporal_overlap
    instances:
      - name: mechanic_buffered_half_open_overlap
        grounds:
          - calculations.mechanic_stop_overlap
          - errors[ERR_MECHANIC_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open with a 15-minute buffer on the
          Mechanic resource — a stop starting at exactly exist_end + buffer
          (11:15) is ALLOWED, while 11:00 (inside the buffer) conflicts;
          endpoint POST /v1/route-days/{id}/stops.
        test_recipe:
          setup:
            - "Two QUOTED requests from DIFFERENT customers; existing PLANNED stop 10:00-11:00 for mechanic Mo"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust1: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Bob", email: "bob@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust2: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust1}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike1: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust2}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike2: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust1}", bike_id: "${bike1}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req1: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust2}", bike_id: "${bike2}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:30:00Z", window_end: "2026-05-02T13:00:00Z" }, as: Dispatcher, captures: { req2: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req1}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop1: $.data.id } }
          trigger:
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req2}", planned_start: "2026-05-02T11:00:00Z", planned_end: "2026-05-02T11:30:00Z", travel_buffer_minutes: 15 }, as: Dispatcher, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req2}", planned_start: "2026-05-02T11:15:00Z", planned_end: "2026-05-02T11:45:00Z", travel_buffer_minutes: 15 }, as: Dispatcher, captures: { stop2: $.data.id, seq2: $.data.seq } }
          assert:
            - "11:00 start: ERR_MECHANIC_WINDOW_OVERLAP (409) — inside the 15-minute buffer of the 10:00-11:00 stop"
            - "11:15 start: 201 created, seq == 2 — exact touch at exist_end + buffer is ALLOWED (half-open semantics)"

      - name: customer_closed_interval_touch_conflicts
        grounds:
          - calculations.customer_window_overlap
          - errors[ERR_CUSTOMER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource: Customer
          windows use CLOSED intervals with no buffer — a new window starting
          exactly at the existing window's end (11:00 == 11:00) CONFLICTS, in
          direct contrast to the mechanic rule's allowed exact touch; endpoint
          POST /v1/service-requests.
        test_recipe:
          setup:
            - "Customer Ann has a QUOTED request with window 2026-05-02 10:00-11:00"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike1: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike2: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike1}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { req1: $.data.id } }
          trigger:
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike2}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T11:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CUSTOMER_WINDOW_OVERLAP (409) — touching endpoints conflict under closed-interval semantics"

  - rule_id: compensating_invariant
    instances:
      - name: stock_reserve_release_conserves_units
        grounds:
          - calculations.truck_stock_reconciliation
          - entities.TruckStockItem.fields.on_hand
          - entities.TruckStockItem.fields.reserved
        distinguishing_aspect: |
          Conserved quantity: physical part units. RESERVE(2) paired with its
          compensating RELEASE(2) leaves on_hand and reserved exactly as before
          (5 and 0); the movement log replays to received - returned - consumed
          == on_hand.
        test_recipe:
          setup:
            - "Van with 5 units of A1 received; dispatched IN_SERVICE request"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/parts", payload: { sku: "A1", name: "Chain", unit_price_cents: 1200, warranty_days: 90 }, as: PlatformAdmin, captures: { part_a: $.data.id } }
            - { call: "POST /v1/vans/${van_id}/stock-movements", payload: { part_id: "${part_a}", quantity: 5, reason: "RECEIVE" }, as: Dispatcher }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
          trigger:
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 2, action: "RESERVE" }, as: Mechanic, as_user_id: "${mech_id}", captures: { oh1: $.data.on_hand, rv1: $.data.reserved } }
            - { call: "POST /v1/service-requests/${req_id}/part-usages", payload: { part_id: "${part_a}", quantity: 2, action: "RELEASE" }, as: Mechanic, as_user_id: "${mech_id}", captures: { oh2: $.data.on_hand, rv2: $.data.reserved } }
            - { call: "GET /v1/stock-movements", payload: { van_id: "${van_id}", part_id: "${part_a}" }, as: Dispatcher }
          assert:
            - "After RESERVE 2: on_hand == 5, reserved == 2"
            - "After compensating RELEASE 2: on_hand == 5, reserved == 0 — identical to pre-RESERVE state (no drift)"
            - "Movement replay: received(5) - returned(0) - consumed(0) == on_hand(5)"

      - name: credit_apply_conserves_cents
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - entities.Customer.fields.account_credit_cents
          - entities.Invoice.fields.credit_applied_cents
        distinguishing_aspect: |
          Conserved quantity: money cents (different type from part units).
          PAY with use_credit moves cents from Customer.account_credit_cents to
          Invoice.credit_applied_cents: 1000 = 0 + 1000 after payment, and
          credit_applied(1000) + amount_paid(6992) == total(7992).
        test_recipe:
          setup:
            - "Customer granted 1000 credit; COMPLETED job invoiced at 7992 (BASIC labor 40, zone 2500, tax 592); invoice ISSUED"
          setup_api_calls:
            - { call: "POST /v1/zones", payload: { name: "Z1", base_callout_fee_cents: 2500 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/service-tiers", payload: { code: "BASIC", base_price_cents: 4900, included_minutes: 45, overage_rate_cents_per_min: 120, labor_warranty_days: 30 }, as: PlatformAdmin, captures: { tier_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customers/${cust_id}/credit-adjustments", payload: { amount_cents: 1000, reason: "goodwill" }, as: PlatformAdmin, captures: { credit_pre: $.data.account_credit_cents } }
            - { call: "POST /v1/bikes", payload: { customer_id: "${cust_id}", bike_type: "MECHANICAL" }, as: Dispatcher, captures: { bike_id: $.data.id } }
            - { call: "POST /v1/service-requests", payload: { customer_id: "${cust_id}", bike_id: "${bike_id}", zone_id: "${zone_id}", tier_id: "${tier_id}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T12:00:00Z" }, as: Dispatcher, captures: { req_id: $.data.id } }
            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "COMPLETE", labor_minutes: 40 }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/invoices", payload: {}, as: Dispatcher, captures: { inv_id: $.data.id } }
            - { call: "POST /v1/invoices/${inv_id}/events", payload: { event_type: "ISSUE" }, as: Dispatcher }
          trigger:
            - { call: "POST /v1/invoices/${inv_id}/events", payload: { event_type: "PAY", amount_cents: 6992, use_credit: true }, as: Customer, as_user_id: "${cust_id}", captures: { inv_credit: $.data.credit_applied_cents, inv_paid: $.data.amount_paid_cents, inv_status: $.data.status } }
            - { call: "GET /v1/customers/${cust_id}", as: Dispatcher, captures: { credit_post: $.data.account_credit_cents } }
          assert:
            - "Invoice.credit_applied_cents == 1000 and amount_paid_cents == 6992 (1000 + 6992 == 7992 == total_cents)"
            - "Customer.account_credit_cents: 1000 before, 0 after — credit_before == credit_after + credit_applied"
            - "Invoice.status == PAID; ServiceRequest work_status == CLOSED (COMPLETED + PAID)"
