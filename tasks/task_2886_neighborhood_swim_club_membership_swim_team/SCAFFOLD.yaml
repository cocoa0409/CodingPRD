scenario: |
  2886. Neighborhood Swim Club Membership & Swim Team (community swim club): membership category and
  bond/initiation structure with waitlist by household, seasonal dues, guest passes and guest-fee
  accounting, lifeguard staffing, certification tracking and ratio compliance by bather load, swim team
  registration, meet hosting and volunteer job requirements, facility reservation for private parties
  with capacity limits, health-department inspection findings and closure protocol, capital reserve for
  pool resurfacing and pump replacement, suspension and conduct enforcement

domain_name: neighborhood-swim-club
api_prefix: "/swim-club"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Household, Membership, MembershipCategory, Season form a cross-referencing graph; Household is
  # self-referential through bond transfer; VolunteerAssignment is a many-to-many junction between
  # Meet and SwimTeamRegistration. No strict single-parent tree exists.

  state_machine_shape: cyclic
  # InspectionFinding cycles REMEDIATION_SUBMITTED -> REOPENED -> REMEDIATION_SUBMITTED; ConductCase
  # cycles SANCTIONED -> APPEALED -> UNDER_REVIEW -> SANCTIONED; WaitlistEntry cycles
  # WAITING -> OFFERED -> WAITING on requeued declines. Membership additionally carries two
  # independent parallel state dimensions (dues_status x access_status) on the same row, and Meet
  # branches SCHEDULED -> {STAFFED, UNDERSTAFFED} -> HOSTED with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Season -> Membership / GuardShift / Meet / InspectionFinding
    - many_to_many         # VolunteerAssignment junctions Meet <-> SwimTeamRegistration
    - self_referential     # Household.transferred_from_household_id -> Household.id (bond transfer)
    - cross_aggregate      # GuardShift certification checks reach across Lifeguard aggregate

  role_model: segregation_of_duties
  # Three two-person controls: the HealthInspector user who recorded a finding may not verify-close it;
  # the user who requested a CapitalProject may not approve it; the user who reported a ConductCase may
  # not decide its sanction.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 16 entities, 73 endpoints, 59 error codes, 11 calculations, 16 state-machine dimensions.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: year
        type: integer
        source: input
        description: "Calendar year of the swim season"
        constraints: "unique across Season; 2026..2099"
      - name: open_date
        type: string
        source: input
        description: "First day the facility is open, ISO 8601 date YYYY-MM-DD"
      - name: close_date
        type: string
        source: input
        description: "Last day the facility is open, ISO 8601 date YYYY-MM-DD"
        constraints: "close_date > open_date"
      - name: dues_due_date
        type: string
        source: input
        description: "Date after which an INVOICED membership becomes DELINQUENT at the next billing run, ISO 8601 date"
      - name: baseline_bather_load
        type: integer
        source: input
        description: "Standing bather headcount assumed present at any open moment, before party reservations are added"
        default: 10
        constraints: ">= 0"
      - name: bather_load_capacity
        type: integer
        source: input
        description: "Hard aggregate bather ceiling for the whole facility at any instant"
        default: 120
        constraints: ">= 1"
      - name: proration_basis
        type: enum
        source: input
        description: "Selects which seasonal_dues_assessment variant this season uses"
        constraints: "one of {CALENDAR_DAY, SWIM_WEEK}"
      - name: guest_settlement_policy
        type: enum
        source: input
        description: "Selects which guest_visit_settlement variant this season uses"
        constraints: "one of {PASS_FIRST, FEE_FIRST_ON_WEEKEND}"
      - name: status
        type: enum
        source: system
        description: "Season lifecycle state"
        default: PLANNED
        constraints: "one of {PLANNED, OPEN, CLOSED}"
      - name: facility_posture
        type: enum
        source: computed
        description: "Derived gate over child operations; recomputed by calculations.facility_posture_derivation"
        default: CLOSED
        constraints: "one of {OPEN, RESTRICTED, CLOSED}"
      - name: open_critical_finding_count
        type: integer
        source: computed
        description: "Count of InspectionFinding rows for this season with severity CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED}"
        default: 0
      - name: open_major_finding_count
        type: integer
        source: computed
        description: "Count of InspectionFinding rows for this season with severity MAJOR and status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED}"
        default: 0
      - name: closure_started_at
        type: datetime
        source: system
        description: "Logical-clock instant at which facility_posture last became CLOSED because of a CRITICAL finding; null when never closed by a finding"
        default: null
      - name: reserve_contributions_cents
        type: integer
        source: computed
        description: "Lifetime capital-reserve contributions booked against this season (manual contributions plus per-membership auto contributions)"
        default: 0
      - name: reserve_unallocated_cents
        type: integer
        source: computed
        description: "Contributions not currently drawn by a CapitalProject; equals reserve_contributions_cents minus the sum of CapitalProject.funded_cents for projects funded from this season"
        default: 0

  - name: MembershipCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Category identifier"
        constraints: "unique across MembershipCategory; one of {FAMILY, COUPLE, SINGLE, SENIOR, SWIM_TEAM_ONLY}"
      - name: label
        type: string
        source: input
        description: "Human-readable category name"
      - name: bond_cents
        type: integer
        source: input
        description: "Refundable capital bond a joining household owes for this category"
        constraints: ">= 0"
      - name: initiation_fee_cents
        type: integer
        source: input
        description: "One-time non-refundable initiation fee charged only to households whose prior_member flag is false"
        constraints: ">= 0"
      - name: seasonal_dues_cents
        type: integer
        source: input
        description: "Full-season dues before proration"
        constraints: ">= 0"
      - name: guest_pass_allotment
        type: integer
        source: input
        description: "Free guest passes granted to the household when a membership in this category is created"
        constraints: ">= 0"
      - name: max_household_size
        type: integer
        source: input
        description: "Maximum Household.member_count permitted in this category"
        constraints: ">= 1"
      - name: volunteer_credits_required
        type: integer
        source: input
        description: "Volunteer credits owed per CONFIRMED swim-team registration held under a membership in this category"
        constraints: ">= 0"
      - name: waitlist_required
        type: boolean
        source: input
        description: "When true, a membership in this category may only be created against an ACCEPTED WaitlistEntry"
        default: true
      - name: proration_allowed
        type: boolean
        source: input
        description: "When false, seasonal_dues_assessment charges full seasonal_dues_cents regardless of join_date"
        default: true
      - name: party_privileges
        type: boolean
        source: input
        description: "When false, memberships in this category may not create PartyReservation rows"
        default: true

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: primary_contact_name
        type: string
        source: input
        description: "Name of the household's primary contact"
      - name: address_line
        type: string
        source: input
        description: "Street address of the household"
      - name: residency
        type: enum
        source: input
        description: "Whether the household lies inside the club's assessment district"
        constraints: "one of {IN_DISTRICT, OUT_OF_DISTRICT}"
      - name: member_count
        type: integer
        source: input
        description: "Number of people covered by this household's membership"
        default: 1
        constraints: ">= 1"
      - name: transferred_from_household_id
        type: string
        source: input
        description: "FK -> Household.id; nullable; the household whose paid bond was transferred to this one, making bond_status TRANSFERRED at creation"
        default: null
      - name: bond_status
        type: enum
        source: system
        description: "Bond posture of the household"
        default: NONE
        constraints: "one of {NONE, INSTALLMENTS, PAID, TRANSFERRED}"
      - name: bond_paid_cents
        type: integer
        source: system
        description: "Cumulative bond principal credited to this household"
        default: 0
      - name: prior_member
        type: boolean
        source: system
        description: "True once the household has ever held a membership, or at creation when a bond was transferred in; suppresses the initiation fee"
        default: false
      - name: standing
        type: enum
        source: system
        description: "Conduct standing of the household"
        default: GOOD_STANDING
        constraints: "one of {GOOD_STANDING, PROBATION, SUSPENDED, EXPELLED}"
      - name: conduct_points
        type: integer
        source: computed
        description: "Sum of ConductCase.points_assessed over cases for this household with status IN {SANCTIONED, CLOSED} whose sanctioned_at is within CONDUCT_LOOKBACK_DAYS of the logical clock"
        default: 0
      - name: guest_pass_allotment_granted
        type: integer
        source: system
        description: "Cumulative free guest passes ever granted to this household"
        default: 0
      - name: guest_passes_consumed
        type: integer
        source: computed
        description: "Sum of GuestVisit.passes_used over visits under this household's memberships with status RECORDED"
        default: 0
      - name: guest_pass_balance
        type: integer
        source: computed
        description: "guest_pass_allotment_granted minus guest_passes_consumed"
        default: 0
      - name: guest_fee_owed_cents
        type: integer
        source: computed
        description: "Sum of GuestVisit.fee_charged_cents over visits under this household's memberships with status RECORDED"
        default: 0
      - name: party_charges_owed_cents
        type: integer
        source: computed
        description: "Sum of PartyReservation.total_charge_cents minus PartyReservation.refunded_cents over reservations under this household's memberships with status IN {REQUESTED, CONFIRMED, COMPLETED, CANCELLED_BY_HOST, CANCELLED_BY_CLOSURE, CANCELLED_BY_SUSPENSION}"
        default: 0
      - name: account_credit_cents
        type: integer
        source: computed
        description: "Refund credit sitting on the household's account, raised by party-reservation refunds and lowered when auto-applied to a membership balance"
        default: 0

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household queued for a membership slot"
      - name: membership_category_id
        type: string
        source: input
        description: "FK -> MembershipCategory.id; the category queue this entry sits in"
      - name: priority_tier
        type: enum
        source: input
        description: "Queue tier claimed by the household"
        constraints: "one of {LEGACY, SIBLING, STANDARD}"
      - name: priority_tier_rank
        type: integer
        source: computed
        description: "Numeric rank of priority_tier used as the primary sort key: LEGACY=0, SIBLING=1, STANDARD=2"
      - name: status
        type: enum
        source: system
        description: "Waitlist lifecycle state"
        default: WAITING
        constraints: "one of {WAITING, OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN}"
      - name: deferral_count
        type: integer
        source: system
        description: "Number of times this entry has been requeued after declining an offer"
        default: 0
      - name: offered_at
        type: datetime
        source: system
        description: "Logical-clock instant the current offer was extended; null while WAITING"
        default: null
      - name: offer_expires_at
        type: datetime
        source: system
        description: "offered_at plus OFFER_WINDOW_DAYS; an offer is still acceptable while clock <= offer_expires_at"
        default: null
      - name: requeued_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent requeued decline; null when the entry has never been requeued"
        default: null
      - name: queue_key_at
        type: datetime
        source: computed
        description: "requeued_at when requeued_at is not null, otherwise created_at; secondary sort key of the waitlist selector"

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household holding this membership"
      - name: membership_category_id
        type: string
        source: input
        description: "FK -> MembershipCategory.id; the category purchased"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this membership covers"
      - name: join_date
        type: string
        source: input
        description: "Date the household's access begins, ISO 8601 date YYYY-MM-DD"
        constraints: "must fall within [Season.open_date, Season.close_date]"
      - name: bond_payment_plan
        type: enum
        source: input
        description: "How the household settles the category bond"
        constraints: "one of {FULL, INSTALLMENTS, TRANSFERRED}"
      - name: dues_status
        type: enum
        source: system
        description: "First parallel state dimension: billing posture of the membership"
        default: UNBILLED
        constraints: "one of {UNBILLED, INVOICED, PAID, DELINQUENT, WRITTEN_OFF}"
      - name: access_status
        type: enum
        source: system
        description: "Second parallel state dimension: facility-access posture of the membership, evolving independently of dues_status"
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, LAPSED, TERMINATED}"
      - name: assessed_dues_cents
        type: integer
        source: computed
        description: "Output of calculations.seasonal_dues_assessment, stamped at creation"
        default: 0
      - name: initiation_fee_cents
        type: integer
        source: computed
        description: "MembershipCategory.initiation_fee_cents when Household.prior_member is false at creation, otherwise 0"
        default: 0
      - name: bond_installment_cents
        type: integer
        source: computed
        description: "First bond installment billed on this invoice; round_half_up(category.bond_cents * BOND_INSTALLMENT_RATE) when bond_payment_plan is INSTALLMENTS, category.bond_cents when FULL, 0 when TRANSFERRED"
        default: 0
      - name: swim_team_fee_cents
        type: integer
        source: computed
        description: "Sum of SwimTeamRegistration.assessed_fee_cents over registrations under this membership with status IN {PENDING, CONFIRMED, COMPLETED}"
        default: 0
      - name: late_penalty_cents
        type: integer
        source: computed
        description: "Line 5 of calculations.season_dues_invoice_total; zero unless the invoice was cut after Season.dues_due_date"
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "Output of calculations.season_dues_invoice_total, stamped at invoice time"
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cumulative cents received against this membership, including auto-applied household account credit"
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "invoice_total_cents plus volunteer_buyout_cents minus amount_paid_cents, floored at 0"
        default: 0
      - name: invoiced_at
        type: datetime
        source: system
        description: "Logical-clock instant the invoice was cut; null while UNBILLED"
        default: null
      - name: volunteer_credits_required
        type: integer
        source: computed
        description: "min(VOLUNTEER_CREDIT_CAP, category.volunteer_credits_required * count of SwimTeamRegistration under this membership with status IN {CONFIRMED, COMPLETED})"
        default: 0
      - name: volunteer_credits_earned
        type: integer
        source: computed
        description: "Sum of VolunteerAssignment.credit_value over assignments whose registration belongs to this membership and whose status is COMPLETED"
        default: 0
      - name: volunteer_buyout_cents
        type: integer
        source: computed
        description: "max(0, volunteer_credits_required - volunteer_credits_earned) * VOLUNTEER_BUYOUT_PER_CREDIT_CENTS, assessed at season close"
        default: 0

  - name: GuestVisit
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership sponsoring the guests"
      - name: sponsor_name
        type: string
        source: input
        description: "Name of the household person escorting the guests"
      - name: guest_count
        type: integer
        source: input
        description: "Number of guests admitted on this visit"
        constraints: ">= 1"
      - name: visit_start_iso
        type: datetime
        source: input
        description: "Instant the guests entered, ISO 8601 UTC with three fractional digits"
      - name: is_weekend
        type: boolean
        source: computed
        description: "True when visit_start_iso falls on Saturday or Sunday in UTC"
      - name: settlement_variant
        type: enum
        source: computed
        description: "Copy of Season.guest_settlement_policy applied to this visit"
        constraints: "one of {PASS_FIRST, FEE_FIRST_ON_WEEKEND}"
      - name: passes_used
        type: integer
        source: computed
        description: "Free guest passes consumed by this visit per calculations.guest_visit_settlement"
        default: 0
      - name: fee_charged_cents
        type: integer
        source: computed
        description: "Cash guest fee accrued by this visit per calculations.guest_visit_settlement"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Whether the visit still counts against the household ledger"
        default: RECORDED
        constraints: "one of {RECORDED, VOIDED}"
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant the visit was voided; null while RECORDED"
        default: null

  - name: Lifeguard
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Guard's full name"
      - name: hire_date
        type: string
        source: input
        description: "Date of hire, ISO 8601 date YYYY-MM-DD"
      - name: employment_status
        type: enum
        source: system
        description: "Whether the guard may be scheduled"
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: scheduled_hours
        type: number
        source: computed
        description: "Sum of GuardShift.duration_hours over shifts for this guard with status IN {SCHEDULED, CONFIRMED, COMPLETED}"
        default: 0
      - name: has_valid_lifeguard_cert
        type: boolean
        source: computed
        description: "True when at least one Certification for this guard has cert_type LIFEGUARD and status VALID"
        default: false
      - name: has_valid_cpr_cert
        type: boolean
        source: computed
        description: "True when at least one Certification for this guard has cert_type CPR_AED and status VALID"
        default: false

  - name: Certification
    parent: Lifeguard
    common_fields: true
    fields:
      - name: lifeguard_id
        type: string
        source: input
        description: "FK -> Lifeguard.id; the certified guard"
      - name: cert_type
        type: enum
        source: input
        description: "Certification family"
        constraints: "one of {LIFEGUARD, CPR_AED, WSI, POOL_OPERATOR}"
      - name: issued_on
        type: string
        source: input
        description: "Issue date, ISO 8601 date YYYY-MM-DD"
      - name: expires_on
        type: string
        source: input
        description: "Expiry date, ISO 8601 date YYYY-MM-DD; the certification covers a shift when expires_on >= the shift's end date"
        constraints: "expires_on > issued_on"
      - name: status
        type: enum
        source: system
        description: "Certification validity state"
        default: VALID
        constraints: "one of {VALID, EXPIRED, REVOKED, SUPERSEDED}"
      - name: revoked_reason
        type: string
        source: system
        description: "Free-text reason recorded when status became REVOKED; null otherwise"
        default: null

  - name: GuardShift
    parent: null
    common_fields: true
    fields:
      - name: lifeguard_id
        type: string
        source: input
        description: "FK -> Lifeguard.id; the guard working the shift"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season the shift belongs to"
      - name: shift_role
        type: enum
        source: input
        description: "Deck role; SUPERVISOR shifts never count toward the bather-load ratio"
        constraints: "one of {PRIMARY, SECONDARY, SUPERVISOR}"
      - name: start_iso
        type: datetime
        source: input
        description: "Shift start, ISO 8601 UTC with three fractional digits"
      - name: end_iso
        type: datetime
        source: input
        description: "Shift end, ISO 8601 UTC with three fractional digits"
        constraints: "end_iso > start_iso"
      - name: duration_hours
        type: number
        source: computed
        description: "(end_iso - start_iso) in hours, rounded to 2 decimal places round_half_up"
      - name: counts_toward_ratio
        type: boolean
        source: computed
        description: "True when shift_role IN {PRIMARY, SECONDARY}"
      - name: status
        type: enum
        source: system
        description: "Shift lifecycle state"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW, CANCELLED_BY_CLOSURE}"

  - name: SwimTeamRegistration
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership the swimmer belongs to"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season being swum; must equal the membership's season_id"
      - name: swimmer_name
        type: string
        source: input
        description: "Swimmer's full name"
      - name: swimmer_birthdate
        type: string
        source: input
        description: "Swimmer's date of birth, ISO 8601 date YYYY-MM-DD; primary sort key for multi-swimmer fee sequencing"
      - name: squad
        type: enum
        source: input
        description: "Training group"
        constraints: "one of {MINI, JUNIOR, SENIOR}"
      - name: squad_seq
        type: integer
        source: computed
        description: "1-based rank of this swimmer within its membership, ordered by swimmer_birthdate ASC then created_at ASC over registrations with status IN {PENDING, CONFIRMED, WAITLISTED, COMPLETED}"
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: "Per-swimmer swim-team fee from line 4 of calculations.season_dues_invoice_total"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Registration lifecycle state"
        default: PENDING
        constraints: "one of {PENDING, CONFIRMED, WAITLISTED, WITHDRAWN, REVOKED, COMPLETED}"

  - name: Meet
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season hosting the meet"
      - name: name
        type: string
        source: input
        description: "Meet name"
      - name: start_iso
        type: datetime
        source: input
        description: "Meet start, ISO 8601 UTC with three fractional digits"
      - name: end_iso
        type: datetime
        source: input
        description: "Meet end, ISO 8601 UTC with three fractional digits"
        constraints: "end_iso > start_iso"
      - name: expected_swimmers
        type: integer
        source: input
        description: "Projected swimmer headcount; added to the bather load during the meet window"
        constraints: ">= 0"
      - name: volunteer_slots_required
        type: integer
        source: input
        description: "Volunteer credits the host club must field before the roster can be declared staffed"
        constraints: ">= 0"
      - name: volunteer_slots_filled
        type: integer
        source: computed
        description: "Sum of VolunteerAssignment.credit_value over assignments for this meet with status IN {ASSIGNED, COMPLETED}"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Meet lifecycle state; roster closing branches into STAFFED or UNDERSTAFFED"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, STAFFED, UNDERSTAFFED, HOSTED, CANCELLED}"
      - name: roster_closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the volunteer roster was closed; null while SCHEDULED"
        default: null
      - name: understaffed_penalty_cents
        type: integer
        source: computed
        description: "MEET_UNDERSTAFF_PENALTY_CENTS times the credit shortfall at roster close, charged only on the UNDERSTAFFED branch of hosting"
        default: 0

  - name: VolunteerAssignment
    parent: null
    common_fields: true
    fields:
      - name: meet_id
        type: string
        source: input
        description: "FK -> Meet.id; the meet being staffed"
      - name: swim_team_registration_id
        type: string
        source: input
        description: "FK -> SwimTeamRegistration.id; the registration whose household is working the job"
      - name: job_code
        type: enum
        source: input
        description: "Volunteer job taken"
        constraints: "one of {TIMER, STARTER, CONCESSIONS, MARSHAL, SCORER}"
      - name: credit_value
        type: integer
        source: computed
        description: "Credits this job is worth per JOB_CREDIT_VALUES: TIMER=1, STARTER=2, CONCESSIONS=1, MARSHAL=1, SCORER=2"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state; RELEASED is produced only by the suspension cascade"
        default: ASSIGNED
        constraints: "one of {ASSIGNED, COMPLETED, NO_SHOW, RELEASED}"

  - name: PartyReservation
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership hosting the private party"
      - name: zone
        type: enum
        source: input
        description: "Facility zone reserved; WHOLE_FACILITY conflicts with every other zone"
        constraints: "one of {PAVILION, SHALLOW_END, WHOLE_FACILITY}"
      - name: start_iso
        type: datetime
        source: input
        description: "Reservation start, ISO 8601 UTC with three fractional digits; intervals are half-open [start_iso, end_iso)"
      - name: end_iso
        type: datetime
        source: input
        description: "Reservation end, ISO 8601 UTC with three fractional digits"
        constraints: "end_iso > start_iso"
      - name: guest_count
        type: integer
        source: input
        description: "Non-member guests expected"
        constraints: ">= 0"
      - name: host_party_size
        type: integer
        source: input
        description: "Household attendees expected"
        constraints: ">= 1"
      - name: projected_bather_load
        type: integer
        source: computed
        description: "guest_count + host_party_size, step 1 of calculations.party_reservation_charge"
      - name: duration_hours_ceil
        type: integer
        source: computed
        description: "ceil((end_iso - start_iso) in minutes / 60)"
      - name: required_guard_count
        type: integer
        source: computed
        description: "Step 2 of calculations.party_reservation_charge"
      - name: base_facility_fee_cents
        type: integer
        source: computed
        description: "ZONE_BASE_FEE_CENTS for the reserved zone"
      - name: guest_overage_fee_cents
        type: integer
        source: computed
        description: "max(0, guest_count - INCLUDED_GUESTS) * GUEST_OVERAGE_CENTS"
      - name: lifeguard_surcharge_cents
        type: integer
        source: computed
        description: "required_guard_count * GUARD_HOURLY_CENTS * duration_hours_ceil"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "base_facility_fee_cents + guest_overage_fee_cents + lifeguard_surcharge_cents"
      - name: member_discount_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * discount rate selected from subtotal_cents tier)"
      - name: total_charge_cents
        type: integer
        source: computed
        description: "subtotal_cents - member_discount_cents"
      - name: refunded_cents
        type: integer
        source: computed
        description: "Cents credited back to the household when the reservation was cancelled"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Reservation lifecycle state"
        default: REQUESTED
        constraints: "one of {REQUESTED, CONFIRMED, COMPLETED, REJECTED, CANCELLED_BY_HOST, CANCELLED_BY_CLOSURE, CANCELLED_BY_SUSPENSION}"

  - name: InspectionFinding
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season inspected"
      - name: inspected_on
        type: string
        source: input
        description: "Date of the health-department visit, ISO 8601 date YYYY-MM-DD"
      - name: inspector_name
        type: string
        source: input
        description: "Name of the inspecting officer"
      - name: finding_code
        type: string
        source: input
        description: "Health-code citation, e.g. 'HC-410'"
      - name: severity
        type: enum
        source: input
        description: "Citation severity; CRITICAL forces closure, MAJOR counts toward the restriction threshold"
        constraints: "one of {CRITICAL, MAJOR, MINOR}"
      - name: narrative
        type: string
        source: input
        description: "Inspector's narrative"
      - name: status
        type: enum
        source: system
        description: "Finding remediation state; cycles REMEDIATION_SUBMITTED -> REOPENED -> REMEDIATION_SUBMITTED"
        default: OPEN
        constraints: "one of {OPEN, REMEDIATION_SUBMITTED, REOPENED, VERIFIED_CLOSED}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HealthInspector who filed the finding; may not equal verified_by_user_id"
      - name: remediation_note
        type: string
        source: system
        description: "Most recent remediation narrative submitted by the PoolManager; null before the first submission"
        default: null
      - name: remediation_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent remediation submission; null before the first submission"
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HealthInspector who verify-closed the finding; null until VERIFIED_CLOSED"
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times a submitted remediation was rejected and the finding reopened"
        default: 0

  - name: ConductCase
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household charged"
      - name: subject_name
        type: string
        source: input
        description: "Name of the individual involved, free text"
      - name: severity
        type: enum
        source: input
        description: "Incident severity driving CONDUCT_POINTS"
        constraints: "one of {MINOR, MAJOR, SEVERE}"
      - name: narrative
        type: string
        source: input
        description: "Incident narrative"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle state; cycles SANCTIONED -> APPEALED -> UNDER_REVIEW -> SANCTIONED"
        default: REPORTED
        constraints: "one of {REPORTED, UNDER_REVIEW, SANCTIONED, APPEALED, DISMISSED, CLOSED}"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reporter; may not equal decided_by_user_id"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardPresident who sanctioned or dismissed the case; null until decided"
        default: null
      - name: sanction_type
        type: enum
        source: system
        description: "Sanction imposed; null until SANCTIONED"
        default: null
        constraints: "one of {WARNING, PROBATION, SUSPENSION, EXPULSION}"
      - name: points_assessed
        type: integer
        source: computed
        description: "CONDUCT_POINTS[severity] once the case reaches SANCTIONED, otherwise 0"
        default: 0
      - name: sanctioned_at
        type: datetime
        source: system
        description: "Logical-clock instant the current sanction was imposed; null until SANCTIONED"
        default: null
      - name: appeal_count
        type: integer
        source: system
        description: "Number of appeals filed against this case"
        default: 0

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - name: funding_season_id
        type: string
        source: input
        description: "FK -> Season.id; the season whose capital reserve funds this project"
      - name: project_kind
        type: enum
        source: input
        description: "Capital work being funded"
        constraints: "one of {POOL_RESURFACING, PUMP_REPLACEMENT}"
      - name: title
        type: string
        source: input
        description: "Project title"
      - name: budget_cents
        type: integer
        source: input
        description: "Board-authorised ceiling on cumulative draws"
        constraints: ">= 1"
      - name: funded_cents
        type: integer
        source: computed
        description: "Cumulative reserve draws currently held by this project; reset to 0 on cancellation"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Project lifecycle state"
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, FUNDED, IN_PROGRESS, COMPLETED, REJECTED, CANCELLED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the requester; may not equal approved_by_user_id"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardPresident who approved the project; null until APPROVED"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /swim-club/seasons/{id}/open"
        actor: PoolManager
        preconditions:
          - "season.status == PLANNED"
        side_effects:
          - "recompute Season.facility_posture per calculations.facility_posture_derivation (an OPEN season with no open findings becomes facility_posture OPEN)"
          - "recompute Season.open_critical_finding_count and Season.open_major_finding_count"
          - "increments Season.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /swim-club/seasons/{id}/close"
        actor: PoolManager
        preconditions:
          - "season.status == OPEN"
        side_effects:
          - "Season.facility_posture := CLOSED"
          - "every Membership with season_id == season.id and access_status IN {ACTIVE, SUSPENDED} transitions to access_status LAPSED, processed in created_at ASC order"
          - "every SwimTeamRegistration with season_id == season.id and status == CONFIRMED transitions to COMPLETED, processed in created_at ASC order"
          - "for each Membership in the season, recompute volunteer_credits_earned then set volunteer_buyout_cents := max(0, volunteer_credits_required - volunteer_credits_earned) * VOLUNTEER_BUYOUT_PER_CREDIT_CENTS and recompute balance_due_cents"
          - "any Membership whose recomputed balance_due_cents > 0 and whose dues_status == PAID transitions dues_status back to INVOICED"
          - "increments Season.version by 1"

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /swim-club/waitlist-entries/next-offer (selector picks exactly one WAITING entry in the requested category)"
        actor: MembershipChair
        preconditions:
          - "entry.status == WAITING"
          - "entry is the unique winner of the waitlist selector defined in calculations.waitlist_offer_selection"
          - "household.standing == GOOD_STANDING"
        side_effects:
          - "WaitlistEntry.offered_at := logical clock"
          - "WaitlistEntry.offer_expires_at := logical clock + OFFER_WINDOW_DAYS days"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /swim-club/waitlist-entries/{id}/respond with decision=ACCEPT"
        actor: Member
        preconditions:
          - "entry.status == OFFERED"
          - "logical clock <= entry.offer_expires_at"
          - "X-User-ID == entry.household_id"
        side_effects:
          - "the entry becomes the mandatory precondition for POST /swim-club/memberships in categories whose waitlist_required is true"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: WAITING
        trigger: "POST /swim-club/waitlist-entries/{id}/respond with decision=DECLINE and requeue=true"
        actor: Member
        note: "Cycle edge. The entry returns to the tail of its tier queue instead of leaving the waitlist."
        preconditions:
          - "entry.status == OFFERED"
          - "entry.deferral_count < MAX_DEFERRALS"
          - "X-User-ID == entry.household_id"
        side_effects:
          - "WaitlistEntry.deferral_count += 1"
          - "WaitlistEntry.requeued_at := logical clock, which makes queue_key_at later than every un-requeued sibling"
          - "WaitlistEntry.offered_at := null and WaitlistEntry.offer_expires_at := null"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /swim-club/waitlist-entries/{id}/respond with decision=DECLINE and requeue=false"
        actor: Member
        preconditions:
          - "entry.status == OFFERED"
          - "X-User-ID == entry.household_id"
        side_effects:
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "system, step 2 of POST /swim-club/seasons/{id}/billing-runs"
        actor: system
        preconditions:
          - "entry.status == OFFERED"
          - "logical clock > entry.offer_expires_at"
        side_effects:
          - "the vacated slot is refilled in step 3 of the same billing run by re-running the waitlist selector for entry.membership_category_id"
          - "increments WaitlistEntry.version by 1"
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /swim-club/waitlist-entries/{id}/respond with decision=WITHDRAW"
        actor: Member
        preconditions:
          - "entry.status == WAITING"
          - "X-User-ID == entry.household_id"
        side_effects:
          - "increments WaitlistEntry.version by 1"

  - entity: Membership
    dimension: dues_status
    initial_state: UNBILLED
    terminal_states: [WRITTEN_OFF]
    note: "First of two parallel state dimensions on the Membership row. dues_status and access_status advance independently; neither is a function of the other."
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /swim-club/memberships/{id}/invoice"
        actor: Treasurer
        preconditions:
          - "membership.dues_status == UNBILLED"
          - "season.status IN {PLANNED, OPEN}"
        side_effects:
          - "recompute Membership.swim_team_fee_cents, Membership.bond_installment_cents, Membership.initiation_fee_cents, Membership.late_penalty_cents and Membership.invoice_total_cents per calculations.season_dues_invoice_total"
          - "Membership.invoiced_at := logical clock"
          - "Membership.balance_due_cents := invoice_total_cents - amount_paid_cents"
          - "Household.bond_status := INSTALLMENTS when bond_payment_plan == INSTALLMENTS"
          - "when Household.standing == GOOD_STANDING, the access_status dimension advances PENDING -> ACTIVE in the same request"
          - "increments Membership.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /swim-club/memberships/{id}/payments"
        actor: Member | Treasurer
        preconditions:
          - "membership.dues_status IN {INVOICED, DELINQUENT}"
          - "amount_cents <= membership.balance_due_cents"
          - "amount_cents == membership.balance_due_cents for the transition to PAID; a smaller payment leaves dues_status unchanged"
        side_effects:
          - "Membership.amount_paid_cents += amount_cents and Membership.balance_due_cents recomputed"
          - "Household.bond_status := PAID when bond_payment_plan == FULL and the membership reaches PAID"
          - "Season.reserve_contributions_cents += RESERVE_CONTRIBUTION_PER_MEMBERSHIP_CENTS and Season.reserve_unallocated_cents += RESERVE_CONTRIBUTION_PER_MEMBERSHIP_CENTS, booked exactly once per membership on its first arrival at PAID"
          - "increments Membership.version by 1"
      - from: INVOICED
        to: DELINQUENT
        trigger: "system, step 4 of POST /swim-club/seasons/{id}/billing-runs"
        actor: system
        preconditions:
          - "membership.dues_status == INVOICED"
          - "date(logical clock) > season.dues_due_date (strictly greater; the due date itself is not delinquent)"
          - "membership.balance_due_cents > 0"
        side_effects:
          - "increments Membership.version by 1"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /swim-club/memberships/{id}/payments"
        actor: Member | Treasurer
        preconditions:
          - "membership.dues_status == DELINQUENT"
          - "amount_cents == membership.balance_due_cents"
        side_effects:
          - "same side effects as INVOICED -> PAID"
          - "increments Membership.version by 1"
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /swim-club/memberships/{id}/write-off"
        actor: Treasurer
        preconditions:
          - "membership.dues_status == DELINQUENT"
        side_effects:
          - "Membership.balance_due_cents := 0"
          - "the access_status dimension transitions ACTIVE -> SUSPENDED in the same request when access_status == ACTIVE"
          - "increments Membership.version by 1"
      - from: PAID
        to: INVOICED
        trigger: "system, POST /swim-club/seasons/{id}/close"
        actor: system
        note: "Re-opening edge. The volunteer buyout is assessed only at season close, so a membership that had settled in full can acquire a fresh balance after the fact. This is the only edge that moves dues_status backwards."
        preconditions:
          - "membership.dues_status == PAID"
          - "the recomputed balance_due_cents (invoice_total_cents + volunteer_buyout_cents - amount_paid_cents) is strictly greater than 0, which happens exactly when volunteer_buyout_cents > 0"
        side_effects:
          - "Membership.balance_due_cents := max(0, invoice_total_cents + volunteer_buyout_cents - amount_paid_cents)"
          - "invoice_total_cents, amount_paid_cents and assessed_dues_cents are NOT re-derived; only the buyout line and the balance move"
          - "increments Membership.version by 1"

  - entity: Membership
    dimension: access_status
    initial_state: PENDING
    terminal_states: [LAPSED, TERMINATED]
    note: "Second parallel dimension. A membership can be dues_status PAID while access_status SUSPENDED, or dues_status DELINQUENT while access_status ACTIVE."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /swim-club/memberships/{id}/invoice"
        actor: Treasurer
        preconditions:
          - "membership.access_status == PENDING"
          - "household.standing == GOOD_STANDING"
        side_effects:
          - "the membership becomes eligible to sponsor GuestVisit, PartyReservation and SwimTeamRegistration rows"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade from Household GOOD_STANDING|PROBATION -> SUSPENDED, or from the DELINQUENT -> WRITTEN_OFF dues transition"
        actor: system
        preconditions:
          - "membership.access_status == ACTIVE"
        side_effects:
          - "every SwimTeamRegistration under this membership with status IN {PENDING, CONFIRMED, WAITLISTED} transitions to REVOKED, processed in created_at ASC order"
          - "every PartyReservation under this membership with status IN {REQUESTED, CONFIRMED} and start_iso > logical clock transitions to CANCELLED_BY_SUSPENSION, processed in start_iso ASC then created_at ASC order"
          - "increments Membership.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade from Household SUSPENDED -> GOOD_STANDING via POST /swim-club/households/{id}/standing-transitions"
        actor: system
        preconditions:
          - "membership.access_status == SUSPENDED"
          - "household.standing == GOOD_STANDING after the standing transition"
        side_effects:
          - "revoked registrations are NOT restored; reinstatement only reopens facility access"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "system, POST /swim-club/seasons/{id}/close"
        actor: system
        preconditions:
          - "membership.access_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "increments Membership.version by 1"
      - from: SUSPENDED
        to: LAPSED
        trigger: "system, POST /swim-club/seasons/{id}/close"
        actor: system
        preconditions:
          - "membership.access_status == SUSPENDED"
        side_effects:
          - "increments Membership.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "cascade from Household SUSPENDED -> EXPELLED via the EXPULSION sanction"
        actor: system
        preconditions:
          - "membership.access_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "Membership.balance_due_cents is left untouched; the bond is forfeited and Household.bond_status is left at its current value"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "cascade from Household GOOD_STANDING|PROBATION -> EXPELLED via the EXPULSION sanction"
        actor: system
        preconditions:
          - "membership.access_status == ACTIVE"
        side_effects:
          - "same side effects as the ACTIVE -> SUSPENDED cascade, then TERMINATED"
          - "increments Membership.version by 1"

  - entity: Household
    initial_state: GOOD_STANDING
    terminal_states: [EXPELLED]
    transitions:
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "cascade from ConductCase UNDER_REVIEW -> SANCTIONED with sanction_type == PROBATION"
        actor: system
        preconditions:
          - "household.standing == GOOD_STANDING"
        side_effects:
          - "Household.conduct_points recomputed per calculations.conduct_point_accrual"
          - "increments Household.version by 1"
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "cascade from ConductCase UNDER_REVIEW -> SANCTIONED with sanction_type == SUSPENSION, or when recomputed conduct_points >= CONDUCT_SUSPENSION_THRESHOLD"
        actor: system
        preconditions:
          - "household.standing IN {GOOD_STANDING, PROBATION}"
        side_effects:
          - "every Membership of this household with access_status == ACTIVE transitions to SUSPENDED, processed in created_at ASC order (which itself cascades to SwimTeamRegistration and PartyReservation)"
          - "increments Household.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "cascade from ConductCase UNDER_REVIEW -> SANCTIONED when recomputed conduct_points >= CONDUCT_SUSPENSION_THRESHOLD"
        actor: system
        preconditions:
          - "household.standing == PROBATION"
        side_effects:
          - "same membership cascade as GOOD_STANDING -> SUSPENDED"
          - "increments Household.version by 1"
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "POST /swim-club/households/{id}/standing-transitions with to_standing=GOOD_STANDING"
        actor: BoardPresident
        note: "Cycle edge back into good standing; the club can suspend and reinstate the same household repeatedly."
        preconditions:
          - "household.standing == SUSPENDED"
          - "no ConductCase for this household is in status IN {REPORTED, UNDER_REVIEW, APPEALED}"
        side_effects:
          - "every Membership of this household with access_status == SUSPENDED transitions back to ACTIVE, processed in created_at ASC order"
          - "increments Household.version by 1"
      - from: SUSPENDED
        to: EXPELLED
        trigger: "cascade from ConductCase UNDER_REVIEW -> SANCTIONED with sanction_type == EXPULSION"
        actor: system
        note: "This edge is also taken directly from GOOD_STANDING and from PROBATION when the sanction is EXPULSION; SUSPENDED is written as the from-state because it is the most common path."
        preconditions:
          - "household.standing IN {GOOD_STANDING, PROBATION, SUSPENDED}"
        side_effects:
          - "every Membership of this household with access_status IN {ACTIVE, SUSPENDED} transitions to TERMINATED, processed in created_at ASC order"
          - "every WaitlistEntry of this household with status IN {WAITING, OFFERED} transitions to WITHDRAWN"
          - "increments Household.version by 1"

  - entity: GuestVisit
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /swim-club/guest-visits/{id}/void"
        actor: PoolManager
        note: "Compensating action for POST /swim-club/guest-visits. Must leave the guest-pass conservation identity intact."
        preconditions:
          - "visit.status == RECORDED"
        side_effects:
          - "GuestVisit.voided_at := logical clock"
          - "the visit leaves the RECORDED filter, so Household.guest_passes_consumed decreases by visit.passes_used and Household.guest_pass_balance increases by the same amount"
          - "Household.guest_fee_owed_cents decreases by visit.fee_charged_cents"
          - "Household.guest_pass_allotment_granted is NOT touched, so guest_pass_balance + guest_passes_consumed == guest_pass_allotment_granted still holds"
          - "increments GuestVisit.version by 1 and increments Household.version by 1"

  - entity: Certification
    initial_state: VALID
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: VALID
        to: SUPERSEDED
        trigger: "POST /swim-club/certifications for the same lifeguard_id and cert_type"
        actor: PoolManager
        preconditions:
          - "an existing Certification for the same lifeguard_id and cert_type has status VALID"
        side_effects:
          - "the newly created Certification starts at VALID; the prior row becomes SUPERSEDED"
          - "recompute Lifeguard.has_valid_lifeguard_cert and Lifeguard.has_valid_cpr_cert"
          - "increments Certification.version by 1 on the superseded row"
      - from: VALID
        to: EXPIRED
        trigger: "system, step 1 of POST /swim-club/seasons/{id}/billing-runs"
        actor: system
        preconditions:
          - "certification.status == VALID"
          - "certification.expires_on < date(logical clock)"
        side_effects:
          - "recompute Lifeguard.has_valid_lifeguard_cert and Lifeguard.has_valid_cpr_cert"
          - "increments Certification.version by 1"
      - from: VALID
        to: REVOKED
        trigger: "POST /swim-club/certifications/{id}/revoke"
        actor: PoolManager
        preconditions:
          - "certification.status == VALID"
        side_effects:
          - "Certification.revoked_reason := reason"
          - "recompute Lifeguard.has_valid_lifeguard_cert and Lifeguard.has_valid_cpr_cert"
          - "when cert_type == LIFEGUARD and the guard retains no VALID LIFEGUARD certification, Lifeguard.employment_status := INACTIVE"
          - "increments Certification.version by 1 and increments Lifeguard.version by 1"
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "POST /swim-club/certifications for the same lifeguard_id and cert_type"
        actor: PoolManager
        preconditions:
          - "an existing Certification for the same lifeguard_id and cert_type has status EXPIRED"
        side_effects:
          - "increments Certification.version by 1 on the superseded row"

  - entity: GuardShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, CANCELLED_BY_CLOSURE]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /swim-club/guard-shifts/{id}/transitions with to_status=CONFIRMED"
        actor: PoolManager
        preconditions:
          - "shift.status == SCHEDULED"
          - "lifeguard.employment_status == ACTIVE"
          - "there exists a Certification for shift.lifeguard_id with cert_type == LIFEGUARD, status == VALID and expires_on >= date(shift.end_iso)"
          - "there exists a Certification for shift.lifeguard_id with cert_type == CPR_AED, status == VALID and expires_on >= date(shift.end_iso)"
        side_effects:
          - "recompute Lifeguard.scheduled_hours"
          - "increments GuardShift.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /swim-club/guard-shifts/{id}/transitions with to_status=COMPLETED"
        actor: PoolManager
        preconditions:
          - "shift.status == CONFIRMED"
          - "logical clock >= shift.end_iso"
        side_effects:
          - "increments GuardShift.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /swim-club/guard-shifts/{id}/transitions with to_status=NO_SHOW"
        actor: PoolManager
        preconditions:
          - "shift.status == CONFIRMED"
          - "logical clock >= shift.start_iso"
        side_effects:
          - "recompute Lifeguard.scheduled_hours (a NO_SHOW shift leaves the SCHEDULED/CONFIRMED/COMPLETED filter)"
          - "increments GuardShift.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /swim-club/guard-shifts/{id}/transitions with to_status=CANCELLED"
        actor: PoolManager
        preconditions:
          - "shift.status IN {SCHEDULED, CONFIRMED}"
          - "for every PartyReservation with status CONFIRMED whose half-open window overlaps this shift, the post-cancellation scheduled guard count must still satisfy calculations.staffing_ratio_compliance"
        side_effects:
          - "recompute Lifeguard.scheduled_hours"
          - "increments GuardShift.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /swim-club/guard-shifts/{id}/transitions with to_status=CANCELLED"
        actor: PoolManager
        preconditions:
          - "shift.status == CONFIRMED"
          - "same ratio-preservation precondition as SCHEDULED -> CANCELLED"
        side_effects:
          - "recompute Lifeguard.scheduled_hours"
          - "increments GuardShift.version by 1"
      - from: CONFIRMED
        to: CANCELLED_BY_CLOSURE
        trigger: "cascade from Season.facility_posture becoming CLOSED"
        actor: system
        preconditions:
          - "shift.status IN {SCHEDULED, CONFIRMED}"
          - "shift.end_iso > logical clock"
        side_effects:
          - "recompute Lifeguard.scheduled_hours"
          - "increments GuardShift.version by 1"
      - from: SCHEDULED
        to: CANCELLED_BY_CLOSURE
        trigger: "cascade from Season.facility_posture becoming CLOSED"
        actor: system
        preconditions:
          - "shift.status == SCHEDULED"
          - "shift.end_iso > logical clock"
        side_effects:
          - "recompute Lifeguard.scheduled_hours"
          - "increments GuardShift.version by 1"

  - entity: SwimTeamRegistration
    initial_state: PENDING
    terminal_states: [WITHDRAWN, REVOKED, COMPLETED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /swim-club/swim-team-registrations/{id}/transitions with to_status=CONFIRMED"
        actor: SwimTeamCoach
        preconditions:
          - "registration.status == PENDING"
          - "the registration's Membership has access_status == ACTIVE"
          - "the registration's Membership has dues_status IN {INVOICED, PAID}"
          - "season.status == OPEN"
        side_effects:
          - "recompute Membership.volunteer_credits_required"
          - "recompute Membership.swim_team_fee_cents"
          - "increments SwimTeamRegistration.version by 1"
      - from: WAITLISTED
        to: PENDING
        trigger: "system, cascade when a squad slot frees because a sibling registration leaves status IN {PENDING, CONFIRMED}"
        actor: system
        preconditions:
          - "registration.status == WAITLISTED"
          - "the count of registrations for the same season_id and squad with status IN {PENDING, CONFIRMED} is strictly below SQUAD_CAPACITY[squad]"
          - "the registration is the earliest WAITLISTED row for that season_id and squad ordered by created_at ASC"
        side_effects:
          - "increments SwimTeamRegistration.version by 1"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "POST /swim-club/swim-team-registrations/{id}/transitions with to_status=CONFIRMED"
        actor: SwimTeamCoach
        preconditions:
          - "registration.status == WAITLISTED"
          - "the count of registrations for the same season_id and squad with status IN {PENDING, CONFIRMED, COMPLETED} is strictly below SQUAD_CAPACITY[squad], otherwise ERR_SQUAD_FULL - this is the only edge that raises it"
          - "the registration's Membership has access_status == ACTIVE"
          - "the registration's Membership has dues_status IN {INVOICED, PAID}"
          - "season.status == OPEN"
        side_effects:
          - "the registration takes the free squad slot directly, without passing through PENDING"
          - "recompute Membership.volunteer_credits_required"
          - "recompute Membership.swim_team_fee_cents"
          - "increments SwimTeamRegistration.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /swim-club/swim-team-registrations/{id}/transitions with to_status=WITHDRAWN"
        actor: SwimTeamCoach
        preconditions:
          - "registration.status == PENDING"
        side_effects:
          - "every VolunteerAssignment for this registration with status == ASSIGNED transitions to RELEASED"
          - "the earliest WAITLISTED registration for the same season_id and squad, if any, is promoted WAITLISTED -> PENDING"
          - "recompute Membership.volunteer_credits_required and Membership.swim_team_fee_cents"
          - "increments SwimTeamRegistration.version by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /swim-club/swim-team-registrations/{id}/transitions with to_status=WITHDRAWN"
        actor: SwimTeamCoach
        preconditions:
          - "registration.status == CONFIRMED"
        side_effects:
          - "same side effects as PENDING -> WITHDRAWN"
          - "increments SwimTeamRegistration.version by 1"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /swim-club/swim-team-registrations/{id}/transitions with to_status=WITHDRAWN"
        actor: SwimTeamCoach
        preconditions:
          - "registration.status == WAITLISTED"
        side_effects:
          - "no squad slot frees and no WAITLISTED sibling is promoted, because a WAITLISTED row never held a slot"
          - "recompute Membership.volunteer_credits_required and Membership.swim_team_fee_cents"
          - "increments SwimTeamRegistration.version by 1"
      - from: PENDING
        to: REVOKED
        trigger: "cascade from Membership.access_status becoming SUSPENDED or TERMINATED"
        actor: system
        preconditions:
          - "registration.status == PENDING"
        side_effects:
          - "same side effects as CONFIRMED -> REVOKED"
          - "increments SwimTeamRegistration.version by 1"
      - from: WAITLISTED
        to: REVOKED
        trigger: "cascade from Membership.access_status becoming SUSPENDED or TERMINATED"
        actor: system
        preconditions:
          - "registration.status == WAITLISTED"
        side_effects:
          - "same side effects as CONFIRMED -> REVOKED, except that no squad slot frees because a WAITLISTED row never held one"
          - "increments SwimTeamRegistration.version by 1"
      - from: CONFIRMED
        to: REVOKED
        trigger: "cascade from Membership.access_status becoming SUSPENDED or TERMINATED"
        actor: system
        preconditions:
          - "registration.status == CONFIRMED"
        side_effects:
          - "every VolunteerAssignment for this registration with status == ASSIGNED transitions to RELEASED, which itself decrements Meet.volunteer_slots_filled and can flip Meet.status STAFFED -> UNDERSTAFFED"
          - "recompute Membership.volunteer_credits_required and Membership.swim_team_fee_cents"
          - "increments SwimTeamRegistration.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system, POST /swim-club/seasons/{id}/close"
        actor: system
        preconditions:
          - "registration.status == CONFIRMED"
        side_effects:
          - "increments SwimTeamRegistration.version by 1"

  - entity: Meet
    initial_state: SCHEDULED
    terminal_states: [HOSTED, CANCELLED]
    note: "Fork-join shape: SCHEDULED forks into STAFFED or UNDERSTAFFED at roster close, and both branches join at HOSTED with divergent side-effect sets."
    transitions:
      - from: SCHEDULED
        to: STAFFED
        trigger: "POST /swim-club/meets/{id}/close-roster"
        actor: SwimTeamCoach
        preconditions:
          - "meet.status == SCHEDULED"
          - "meet.volunteer_slots_filled >= meet.volunteer_slots_required (inclusive; equality is sufficient, and a meet requiring 0 credits qualifies with zero assignments)"
        side_effects:
          - "Meet.roster_closed_at := logical clock"
          - "Meet.understaffed_penalty_cents := 0"
          - "increments Meet.version by 1"
      - from: SCHEDULED
        to: UNDERSTAFFED
        trigger: "POST /swim-club/meets/{id}/close-roster"
        actor: SwimTeamCoach
        preconditions:
          - "meet.status == SCHEDULED"
          - "meet.volunteer_slots_filled < meet.volunteer_slots_required"
        side_effects:
          - "Meet.roster_closed_at := logical clock"
          - "Meet.understaffed_penalty_cents := (meet.volunteer_slots_required - meet.volunteer_slots_filled) * MEET_UNDERSTAFF_PENALTY_CENTS"
          - "increments Meet.version by 1"
      - from: STAFFED
        to: HOSTED
        trigger: "POST /swim-club/meets/{id}/transitions with to_status=HOSTED"
        actor: SwimTeamCoach
        preconditions:
          - "meet.status == STAFFED"
          - "logical clock >= meet.end_iso"
          - "season.facility_posture == OPEN"
        side_effects:
          - "every VolunteerAssignment for this meet still in status ASSIGNED transitions to COMPLETED, processed in created_at ASC order"
          - "for each such assignment, the owning Membership.volunteer_credits_earned increases by assignment.credit_value"
          - "no penalty is booked on this branch"
          - "increments Meet.version by 1"
      - from: UNDERSTAFFED
        to: HOSTED
        trigger: "POST /swim-club/meets/{id}/transitions with to_status=HOSTED"
        actor: SwimTeamCoach
        preconditions:
          - "meet.status == UNDERSTAFFED"
          - "logical clock >= meet.end_iso"
          - "season.facility_posture == OPEN"
        side_effects:
          - "every VolunteerAssignment for this meet still in status ASSIGNED transitions to COMPLETED, processed in created_at ASC order"
          - "for each such assignment, the owning Membership.volunteer_credits_earned increases by assignment.credit_value"
          - "additionally, Meet.understaffed_penalty_cents is divided evenly across the memberships holding a CONFIRMED registration in this meet's season, ordered by Membership.created_at ASC, integer division with the remainder cents assigned one each to the earliest memberships in that order; each share is added to that Membership.balance_due_cents"
          - "increments Meet.version by 1"
      - from: STAFFED
        to: UNDERSTAFFED
        trigger: "cascade from VolunteerAssignment ASSIGNED -> RELEASED or ASSIGNED -> NO_SHOW lowering Meet.volunteer_slots_filled"
        actor: system
        preconditions:
          - "meet.status == STAFFED"
          - "the recomputed meet.volunteer_slots_filled < meet.volunteer_slots_required"
        side_effects:
          - "Meet.understaffed_penalty_cents := (meet.volunteer_slots_required - meet.volunteer_slots_filled) * MEET_UNDERSTAFF_PENALTY_CENTS"
          - "Meet.roster_closed_at is NOT cleared - the roster stays closed, so no replacement volunteer may be assigned"
          - "increments Meet.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /swim-club/meets/{id}/transitions with to_status=CANCELLED"
        actor: SwimTeamCoach
        preconditions:
          - "meet.status == SCHEDULED"
        side_effects:
          - "every VolunteerAssignment for this meet with status == ASSIGNED transitions to RELEASED"
          - "Meet.understaffed_penalty_cents := 0"
          - "increments Meet.version by 1"
      - from: STAFFED
        to: CANCELLED
        trigger: "POST /swim-club/meets/{id}/transitions with to_status=CANCELLED"
        actor: SwimTeamCoach
        preconditions:
          - "meet.status == STAFFED"
        side_effects:
          - "same side effects as SCHEDULED -> CANCELLED"
          - "increments Meet.version by 1"
      - from: UNDERSTAFFED
        to: CANCELLED
        trigger: "POST /swim-club/meets/{id}/transitions with to_status=CANCELLED"
        actor: SwimTeamCoach
        preconditions:
          - "meet.status == UNDERSTAFFED"
        side_effects:
          - "same side effects as SCHEDULED -> CANCELLED, and the accrued understaffed_penalty_cents is zeroed rather than billed"
          - "increments Meet.version by 1"

  - entity: VolunteerAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, RELEASED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /swim-club/volunteer-assignments/{id}/transitions with to_status=COMPLETED, or cascade from Meet -> HOSTED"
        actor: SwimTeamCoach | system
        preconditions:
          - "assignment.status == ASSIGNED"
        side_effects:
          - "the owning Membership.volunteer_credits_earned increases by assignment.credit_value"
          - "Meet.volunteer_slots_filled is unchanged (COMPLETED remains inside the filter)"
          - "increments VolunteerAssignment.version by 1"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /swim-club/volunteer-assignments/{id}/transitions with to_status=NO_SHOW"
        actor: SwimTeamCoach
        preconditions:
          - "assignment.status == ASSIGNED"
          - "meet.status IN {STAFFED, UNDERSTAFFED, HOSTED}"
        side_effects:
          - "Meet.volunteer_slots_filled decreases by assignment.credit_value (NO_SHOW leaves the filter)"
          - "when meet.status == STAFFED and the new volunteer_slots_filled < volunteer_slots_required, Meet.status becomes UNDERSTAFFED and Meet.understaffed_penalty_cents is recomputed"
          - "increments VolunteerAssignment.version by 1"
      - from: ASSIGNED
        to: RELEASED
        trigger: "cascade from SwimTeamRegistration -> REVOKED or -> WITHDRAWN, or from Meet -> CANCELLED"
        actor: system
        preconditions:
          - "assignment.status == ASSIGNED"
        side_effects:
          - "Meet.volunteer_slots_filled decreases by assignment.credit_value"
          - "when meet.status == STAFFED and the new volunteer_slots_filled < volunteer_slots_required, Meet.status becomes UNDERSTAFFED and Meet.understaffed_penalty_cents is recomputed"
          - "increments VolunteerAssignment.version by 1"

  - entity: PartyReservation
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED_BY_HOST, CANCELLED_BY_CLOSURE, CANCELLED_BY_SUSPENSION]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /swim-club/party-reservations/{id}/transitions with to_status=CONFIRMED"
        actor: PoolManager
        preconditions:
          - "reservation.status == REQUESTED"
          - "season.facility_posture == OPEN"
          - "calculations.staffing_ratio_compliance evaluates compliant == true at reservation.start_iso and at reservation.end_iso minus one minute"
        side_effects:
          - "Household.party_charges_owed_cents is unchanged (the charge was already booked at creation)"
          - "increments PartyReservation.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /swim-club/party-reservations/{id}/transitions with to_status=REJECTED"
        actor: PoolManager
        preconditions:
          - "reservation.status == REQUESTED"
        side_effects:
          - "PartyReservation.refunded_cents := reservation.total_charge_cents"
          - "Household.party_charges_owed_cents decreases by reservation.total_charge_cents"
          - "increments PartyReservation.version by 1 and increments Household.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /swim-club/party-reservations/{id}/transitions with to_status=COMPLETED"
        actor: PoolManager
        preconditions:
          - "reservation.status == CONFIRMED"
          - "logical clock >= reservation.end_iso"
        side_effects:
          - "increments PartyReservation.version by 1"
      - from: CONFIRMED
        to: CANCELLED_BY_HOST
        trigger: "POST /swim-club/party-reservations/{id}/transitions with to_status=CANCELLED_BY_HOST"
        actor: Member | PoolManager
        preconditions:
          - "reservation.status == CONFIRMED"
          - "logical clock < reservation.start_iso"
        side_effects:
          - "PartyReservation.refunded_cents := reservation.total_charge_cents when (reservation.start_iso - logical clock) >= CANCEL_FULL_REFUND_DAYS days, otherwise round_half_up(reservation.total_charge_cents * 0.5)"
          - "Household.party_charges_owed_cents decreases by PartyReservation.refunded_cents"
          - "Household.account_credit_cents increases by PartyReservation.refunded_cents"
          - "the account-credit auto-apply rule then runs: if the household holds a Membership in this reservation's season with dues_status IN {INVOICED, DELINQUENT} and account_credit_cents >= that membership's balance_due_cents, the whole balance is applied (amount_paid_cents += balance_due_cents, dues_status -> PAID, account_credit_cents -= the applied amount, Season reserve contributions booked once)"
          - "increments PartyReservation.version by 1 and increments Household.version by 1"
      - from: CONFIRMED
        to: CANCELLED_BY_CLOSURE
        trigger: "cascade from Season.facility_posture becoming CLOSED"
        actor: system
        preconditions:
          - "reservation.status == CONFIRMED"
          - "reservation.end_iso > logical clock"
        side_effects:
          - "PartyReservation.refunded_cents := reservation.total_charge_cents (a club-caused closure always refunds in full, regardless of CANCEL_FULL_REFUND_DAYS)"
          - "Household.party_charges_owed_cents decreases by reservation.total_charge_cents"
          - "Household.account_credit_cents increases by reservation.total_charge_cents"
          - "the account-credit auto-apply rule then runs exactly as on CANCELLED_BY_HOST, which is the third and fourth hop of the closure cascade"
          - "increments PartyReservation.version by 1 and increments Household.version by 1"
      - from: CONFIRMED
        to: CANCELLED_BY_SUSPENSION
        trigger: "cascade from Membership.access_status becoming SUSPENDED or TERMINATED"
        actor: system
        preconditions:
          - "reservation.status == CONFIRMED"
          - "reservation.start_iso > logical clock"
        side_effects:
          - "PartyReservation.refunded_cents := round_half_up(reservation.total_charge_cents * 0.5) (a suspension-caused cancellation always refunds half, because the cause is the member's own conduct)"
          - "Household.party_charges_owed_cents decreases by PartyReservation.refunded_cents"
          - "Household.account_credit_cents increases by PartyReservation.refunded_cents"
          - "the account-credit auto-apply rule does NOT run on this edge, because a suspended household may not settle dues from conduct-driven refunds"
          - "increments PartyReservation.version by 1 and increments Household.version by 1"

  - entity: InspectionFinding
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED]
    note: "Cyclic shape: REMEDIATION_SUBMITTED -> REOPENED -> REMEDIATION_SUBMITTED may repeat without bound."
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /swim-club/inspection-findings/{id}/transitions with to_status=REMEDIATION_SUBMITTED"
        actor: PoolManager
        preconditions:
          - "finding.status IN {OPEN, REOPENED}"
          - "remediation_note is present and non-empty"
        side_effects:
          - "InspectionFinding.remediation_note := remediation_note and InspectionFinding.remediation_submitted_at := logical clock"
          - "Season.facility_posture is recomputed, but a submitted remediation is still an open finding, so a CRITICAL finding keeps the season CLOSED"
          - "increments InspectionFinding.version by 1"
      - from: REOPENED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /swim-club/inspection-findings/{id}/transitions with to_status=REMEDIATION_SUBMITTED"
        actor: PoolManager
        note: "Cycle edge; taken once per reopen round."
        preconditions:
          - "finding.status == REOPENED"
          - "remediation_note is present and non-empty"
        side_effects:
          - "same side effects as OPEN -> REMEDIATION_SUBMITTED"
          - "increments InspectionFinding.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: REOPENED
        trigger: "POST /swim-club/inspection-findings/{id}/transitions with to_status=REOPENED"
        actor: HealthInspector
        note: "Cycle edge; the inspector rejects the submitted remediation."
        preconditions:
          - "finding.status == REMEDIATION_SUBMITTED"
        side_effects:
          - "InspectionFinding.reopen_count += 1"
          - "Season.facility_posture recomputed (unchanged, the finding is still open)"
          - "increments InspectionFinding.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: VERIFIED_CLOSED
        trigger: "POST /swim-club/inspection-findings/{id}/transitions with to_status=VERIFIED_CLOSED"
        actor: HealthInspector
        preconditions:
          - "finding.status == REMEDIATION_SUBMITTED"
          - "X-User-ID != finding.recorded_by_user_id (two-person control)"
        side_effects:
          - "InspectionFinding.verified_by_user_id := X-User-ID"
          - "Season.open_critical_finding_count and Season.open_major_finding_count recomputed"
          - "Season.facility_posture recomputed, which reopens the facility (posture OPEN or RESTRICTED) once no CRITICAL finding remains open"
          - "Season.closure_started_at := null when the recomputed posture is not CLOSED"
          - "increments InspectionFinding.version by 1 and increments Season.version by 1"

  - entity: ConductCase
    initial_state: REPORTED
    terminal_states: [DISMISSED, CLOSED]
    note: "Cyclic shape: SANCTIONED -> APPEALED -> UNDER_REVIEW -> SANCTIONED may repeat until appeal_count reaches MAX_APPEALS."
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /swim-club/conduct-cases/{id}/transitions with to_status=UNDER_REVIEW"
        actor: BoardPresident
        preconditions:
          - "case.status IN {REPORTED, APPEALED}"
        side_effects:
          - "increments ConductCase.version by 1"
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /swim-club/conduct-cases/{id}/transitions with to_status=UNDER_REVIEW"
        actor: BoardPresident
        note: "Cycle edge; the appeal is accepted for re-hearing."
        preconditions:
          - "case.status == APPEALED"
        side_effects:
          - "ConductCase.points_assessed := 0 and Household.conduct_points recomputed, which can drop the household below CONDUCT_SUSPENSION_THRESHOLD (standing is NOT automatically restored; that requires the explicit standing transition)"
          - "increments ConductCase.version by 1 and increments Household.version by 1"
      - from: UNDER_REVIEW
        to: SANCTIONED
        trigger: "POST /swim-club/conduct-cases/{id}/transitions with to_status=SANCTIONED and sanction_type set"
        actor: BoardPresident
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "X-User-ID != case.reported_by_user_id (two-person control)"
          - "sanction_type is present"
        side_effects:
          - "ConductCase.sanction_type := sanction_type, ConductCase.decided_by_user_id := X-User-ID, ConductCase.sanctioned_at := logical clock"
          - "ConductCase.points_assessed := CONDUCT_POINTS[case.severity]"
          - "Household.conduct_points recomputed per calculations.conduct_point_accrual"
          - "Household.standing advances per calculations.conduct_sanction_standing_map, which itself cascades to Membership.access_status, then to SwimTeamRegistration, then to VolunteerAssignment and Meet"
          - "increments ConductCase.version by 1 and increments Household.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /swim-club/conduct-cases/{id}/transitions with to_status=DISMISSED"
        actor: BoardPresident
        preconditions:
          - "case.status == UNDER_REVIEW"
          - "X-User-ID != case.reported_by_user_id (two-person control)"
        side_effects:
          - "ConductCase.decided_by_user_id := X-User-ID and ConductCase.points_assessed := 0"
          - "Household.conduct_points recomputed"
          - "increments ConductCase.version by 1"
      - from: SANCTIONED
        to: APPEALED
        trigger: "POST /swim-club/conduct-cases/{id}/transitions with to_status=APPEALED"
        actor: Member
        note: "Cycle edge; only the charged household may appeal."
        preconditions:
          - "case.status == SANCTIONED"
          - "X-User-ID == case.household_id"
          - "case.appeal_count < MAX_APPEALS"
          - "logical clock <= case.sanctioned_at + APPEAL_WINDOW_DAYS days"
        side_effects:
          - "ConductCase.appeal_count += 1"
          - "increments ConductCase.version by 1"
      - from: SANCTIONED
        to: CLOSED
        trigger: "POST /swim-club/conduct-cases/{id}/transitions with to_status=CLOSED"
        actor: BoardPresident
        preconditions:
          - "case.status == SANCTIONED"
          - "logical clock > case.sanctioned_at + APPEAL_WINDOW_DAYS days"
        side_effects:
          - "the case's points remain inside the conduct_point_accrual lookback window"
          - "increments ConductCase.version by 1"

  - entity: CapitalProject
    initial_state: PROPOSED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /swim-club/capital-projects/{id}/transitions with to_status=APPROVED"
        actor: BoardPresident
        preconditions:
          - "project.status == PROPOSED"
          - "X-User-ID != project.requested_by_user_id (two-person control)"
        side_effects:
          - "CapitalProject.approved_by_user_id := X-User-ID"
          - "increments CapitalProject.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /swim-club/capital-projects/{id}/transitions with to_status=REJECTED"
        actor: BoardPresident
        preconditions:
          - "project.status == PROPOSED"
          - "X-User-ID != project.requested_by_user_id (two-person control)"
        side_effects:
          - "increments CapitalProject.version by 1"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /swim-club/capital-projects/{id}/fund"
        actor: Treasurer
        preconditions:
          - "project.status IN {APPROVED, FUNDED}"
          - "expected_capital_project_version == project.version"
          - "draw_amount_cents <= season.reserve_unallocated_cents"
          - "project.funded_cents + draw_amount_cents <= project.budget_cents"
        side_effects:
          - "CapitalProject.funded_cents += draw_amount_cents"
          - "Season.reserve_unallocated_cents -= draw_amount_cents while Season.reserve_contributions_cents is untouched, preserving the reserve identity"
          - "increments CapitalProject.version by 1 and increments Season.version by 1"
      - from: FUNDED
        to: IN_PROGRESS
        trigger: "POST /swim-club/capital-projects/{id}/transitions with to_status=IN_PROGRESS"
        actor: Treasurer
        preconditions:
          - "project.status == FUNDED"
          - "project.funded_cents > 0"
        side_effects:
          - "increments CapitalProject.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /swim-club/capital-projects/{id}/transitions with to_status=COMPLETED"
        actor: Treasurer
        preconditions:
          - "project.status == IN_PROGRESS"
        side_effects:
          - "increments CapitalProject.version by 1"
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /swim-club/capital-projects/{id}/transitions with to_status=CANCELLED"
        actor: BoardPresident
        note: "Compensating action for the fund draw. Must restore the reserve identity exactly."
        preconditions:
          - "project.status IN {APPROVED, FUNDED, IN_PROGRESS}"
        side_effects:
          - "Season.reserve_unallocated_cents += project.funded_cents"
          - "CapitalProject.funded_cents := 0"
          - "Season.reserve_contributions_cents is untouched, so reserve_unallocated_cents + sum(funded_cents over FUNDED/IN_PROGRESS/COMPLETED projects) == reserve_contributions_cents holds again"
          - "increments CapitalProject.version by 1 and increments Season.version by 1"

  - entity: Lifeguard
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "cascade from Certification VALID -> REVOKED where cert_type == LIFEGUARD"
        actor: system
        preconditions:
          - "lifeguard.employment_status == ACTIVE"
          - "no Certification for this lifeguard with cert_type == LIFEGUARD retains status VALID"
        side_effects:
          - "the guard can no longer be moved SCHEDULED -> CONFIRMED on any shift"
          - "increments Lifeguard.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /swim-club/certifications creating a new VALID cert_type == LIFEGUARD row for this guard"
        actor: PoolManager
        preconditions:
          - "lifeguard.employment_status == INACTIVE"
        side_effects:
          - "increments Lifeguard.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version; no other mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: guest-visit-record-stale-household
    parent_entity: Household
    write_endpoint: "POST /swim-club/guest-visits"
    occ_field: "expected_household_version"
    description: |
      Recording a GuestVisit against a Household whose version has advanced since the client last
      observed it is rejected. Recording repeated visits for the same household is legitimate under
      the product spec, so a second sequential request carrying the same expected_household_version
      is not blocked by any state precondition: the free-pass balance the client used to decide
      whether this visit would be pass-settled or fee-settled has silently moved, so the stale-version
      check is what protects the guest-fee ledger.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

  - rule_id: capital-project-fund-stale-project
    parent_entity: CapitalProject
    write_endpoint: "POST /swim-club/capital-projects/{id}/fund"
    occ_field: "expected_capital_project_version"
    description: |
      Drawing reserve funds against a CapitalProject whose version has advanced since the client last
      observed it is rejected. Multiple successive draws against the same APPROVED or FUNDED project
      are legitimate, so a second sequential draw is not blocked by any state precondition; the
      stale-version check is what prevents a client working from an out-of-date funded_cents figure
      from over-drawing the reserve.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: seasonal_dues_assessment
    trigger: "POST /swim-club/memberships (stamps assessed_dues_cents exactly once, on the variant named by the membership's season)"
    algorithm: threshold
    formula: |
      # Inputs: season (open_date, close_date, proration_basis), membership.join_date,
      #         category.seasonal_dues_cents
      variant = season.proration_basis          # the season, not the request, names the variant
      total_days    = (season.close_date - season.open_date).days + 1        # inclusive of both endpoints
      total_weeks   = ceil(total_days / 7)
      effective_on  = max(membership.join_date, season.open_date)
      remaining_days  = (season.close_date - effective_on).days + 1          # inclusive of both endpoints
      remaining_weeks = ceil(remaining_days / 7)

      if remaining_days <= 0:
          assessed_dues_cents = 0
      elif effective_on <= season.open_date:
          assessed_dues_cents = category.seasonal_dues_cents                # full season, no proration
      else:
          # variant-dependent proration; see variants below
          if variant == CALENDAR_DAY:
              assessed_dues_cents = round_half_up(category.seasonal_dues_cents * remaining_days / total_days)
          elif variant == SWIM_WEEK:
              assessed_dues_cents = round_half_up(category.seasonal_dues_cents * remaining_weeks / total_weeks)

      # Worked example (pinned): season 2027-05-22 .. 2027-09-06 -> total_days 108, total_weeks 16
      #   join_date 2027-07-05 -> remaining_days 64, remaining_weeks 10
      #   FAMILY seasonal_dues_cents 78000
      #   CALENDAR_DAY: round_half_up(78000 * 64 / 108) = round_half_up(46222.222...) = 46222
      #   SWIM_WEEK   : round_half_up(78000 * 10 / 16)  = 48750
      #   The two variants differ by 2528 cents on identical inputs.
    input_set: "The Membership's own category and its season's window and proration_basis. assessed_dues_cents is stamped once, at POST /swim-club/memberships while dues_status is still UNBILLED, and is never re-derived: a later invoice, payment, write-off or season close leaves the stamped figure frozen."
    constants:
      DAYS_PER_SWIM_WEEK: 7
    precision: "integer cents; round_half_up on the single final multiplication, never on the intermediate ratio"
    variants:
      - name: CALENDAR_DAY
        when: "Applied to every Membership created in a Season whose proration_basis is CALENDAR_DAY, which is the value POST /swim-club/seasons defaults to when proration_basis is omitted."
        difference: "Prorates on inclusive calendar days remaining over inclusive calendar days in the season, so a mid-week join is charged for the exact days it can swim."
      - name: SWIM_WEEK
        when: "Applied to every Membership created in a Season explicitly created with proration_basis=SWIM_WEEK, the basis the board adopts for seasons whose swim meets start in the first week."
        difference: "Prorates on ceil-rounded 7-day swim weeks over ceil-rounded season weeks. Because both numerator and denominator are rounded up, a partial week is billed as a whole week, so for the same category, the same season window and the same join_date the SWIM_WEEK figure is strictly greater than the CALENDAR_DAY figure whenever the join date is not a week boundary. The delta flows straight into invoice_total_cents and balance_due_cents on the invoice that follows."

  - name: guest_visit_settlement
    trigger: "POST /swim-club/guest-visits"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: visit.guest_count, visit.visit_start_iso, household.guest_pass_balance
      settlement_variant = season.guest_settlement_policy   # copied onto the visit at creation
      is_weekend = day_of_week(visit.visit_start_iso) IN {SATURDAY, SUNDAY}
      unit_fee   = GUEST_FEE_WEEKEND_CENTS if is_weekend else GUEST_FEE_WEEKDAY_CENTS

      if settlement_variant == PASS_FIRST:
          passes_used = min(household.guest_pass_balance, visit.guest_count)
      elif settlement_variant == FEE_FIRST_ON_WEEKEND:
          passes_used = 0 if is_weekend else min(household.guest_pass_balance, visit.guest_count)

      billable_guests    = visit.guest_count - passes_used
      fee_charged_cents  = billable_guests * unit_fee
      household.guest_pass_balance     -= passes_used
      household.guest_passes_consumed += passes_used
      household.guest_fee_owed_cents += fee_charged_cents

      # Worked example (pinned): guest_count 6 on 2027-07-10 (Saturday), guest_pass_balance 4
      #   PASS_FIRST           : passes_used 4, billable 2, fee_charged_cents = 2 * 800 = 1600
      #   FEE_FIRST_ON_WEEKEND : passes_used 0, billable 6, fee_charged_cents = 6 * 800 = 4800
      #   Identical inputs, 3200 cents apart, and the surviving guest_pass_balance differs (0 vs 4).
    input_set: "Only the sponsoring Household's live pass balance and the season's guest_settlement_policy. Passes consumed by GuestVisits later VOIDED are returned to the balance, so guest_pass_balance always equals guest_pass_allotment_granted minus the passes held by visits still in status RECORDED."
    constants:
      GUEST_FEE_WEEKDAY_CENTS: 500
      GUEST_FEE_WEEKEND_CENTS: 800
    precision: "integer cents; no rounding is required because every term is an integer product"
    variants:
      - name: PASS_FIRST
        when: "Applied to every GuestVisit recorded in a Season whose guest_settlement_policy is PASS_FIRST, which is the value POST /swim-club/seasons defaults to when guest_settlement_policy is omitted."
        difference: "Free passes are spent before any cash fee is charged, on every day of the week."
      - name: FEE_FIRST_ON_WEEKEND
        when: "Applied to every GuestVisit recorded in a Season explicitly created with guest_settlement_policy=FEE_FIRST_ON_WEEKEND, the board rule that protects free passes from being burned on the busiest days."
        difference: "On a Saturday or Sunday visit no pass is consumed at all and every guest is charged the weekend fee; on a weekday the two variants coincide exactly. So the variant changes both the fee and the surviving pass balance, and only for weekend dates."

  - name: season_dues_invoice_total
    trigger: "POST /swim-club/memberships/{id}/invoice"
    algorithm: waterfall_allocation
    formula: |
      # Assembles the invoice as an ordered list of lines. The rounding ORDER is pinned: every
      # line is rounded to whole cents as it is emitted, and the late penalty is computed from
      # the SUM OF ALREADY-ROUNDED LINES. Summing exact line values and rounding once at the end
      # is a DIFFERENT, WRONG total.

      # Line 1 - prorated seasonal dues, already stamped at membership creation
      L1 = membership.assessed_dues_cents

      # Line 2 - initiation fee, already stamped at membership creation
      #          (category.initiation_fee_cents when household.prior_member is false, else 0)
      L2 = membership.initiation_fee_cents

      # Line 3 - bond installment, keyed off the membership's bond_payment_plan
      if   membership.bond_payment_plan == FULL:         L3 = category.bond_cents
      elif membership.bond_payment_plan == INSTALLMENTS: L3 = round_half_up(category.bond_cents * BOND_INSTALLMENT_RATE)
      else:                                             L3 = 0        # TRANSFERRED
      membership.bond_installment_cents = L3

      # Line 4 - swim team fees, ONE ROUNDED SUB-LINE PER SWIMMER. Each swimmer's
      #          assessed_fee_cents was rounded when its registration was created, using that
      #          registration's squad_seq (1-based within the membership, ordered by
      #          swimmer_birthdate ASC then created_at ASC - never by id):
      #            assessed_fee_cents = round_half_up(SWIM_TEAM_FEE_CENTS * (1 - discount_rate))
      #            discount_rate      = min(MULTI_SWIMMER_DISCOUNT_RATE * (squad_seq - 1),
      #                                     MULTI_SWIMMER_DISCOUNT_CAP)
      #          Line 4 sums those ALREADY-ROUNDED per-swimmer amounts.
      L4 = sum(reg.assessed_fee_cents for reg in SwimTeamRegistrations of this membership
               with status IN {PENDING, CONFIRMED, COMPLETED})
      membership.swim_team_fee_cents = L4

      # Line 5 - late penalty on everything above, charged when the invoice is cut after the due date
      base = L1 + L2 + L3 + L4                               # sum of already-rounded lines
      L5   = round_half_up(base * LATE_PENALTY_RATE) if logical_clock_date > season.dues_due_date else 0

      membership.late_penalty_cents  = L5
      membership.invoice_total_cents = base + L5
      membership.balance_due_cents   = max(0, membership.invoice_total_cents
                                              + membership.volunteer_buyout_cents
                                              - membership.amount_paid_cents)

      # Worked example (pinned): FAMILY category (seasonal_dues 78000, initiation 45000,
      #   bond 120000) in a CALENDAR_DAY season, join_date 2027-07-05, household.prior_member
      #   false, bond_payment_plan INSTALLMENTS, 3 swimmers registered, invoiced on 2027-07-06
      #   (after dues_due_date 2027-04-15), volunteer_buyout_cents still 0.
      #     L1 = 46222
      #     L2 = 45000
      #     L3 = round_half_up(120000 * 0.25) = 30000    (bond_payment_plan INSTALLMENTS)
      #     L4 : squad_seq=1 round_half_up(14500 * 1.0000) = 14500
      #          squad_seq=2 round_half_up(14500 * 0.9375) = round_half_up(13593.75) = 13594
      #          squad_seq=3 round_half_up(14500 * 0.8750) = round_half_up(12687.50) = 12688
      #          L4 = 40782
      #     base = 46222 + 45000 + 30000 + 40782 = 162004
      #     L5   = round_half_up(162004 * 0.035) = round_half_up(5670.14) = 5670
      #     invoice_total_cents = 167674
      #   The rejected alternative order (sum the exact swim-team values 14500 + 13593.75 +
      #   12687.50 = 40781.25, round once to 40781, base 162003, penalty
      #   round_half_up(5670.105) = 5670) yields 167673. The pinned order is observable: the two
      #   answers differ by 1 cent, and the difference survives into balance_due_cents.
    input_set: "The membership's own category, its stamped assessed_dues_cents and initiation_fee_cents, its bond_payment_plan, and its SwimTeamRegistrations in status PENDING, CONFIRMED or COMPLETED only - WAITLISTED, WITHDRAWN and REVOKED registrations are excluded from Line 4. The late-penalty line depends only on the logical clock against season.dues_due_date."
    constants:
      BOND_INSTALLMENT_RATE: 0.25
      SWIM_TEAM_FEE_CENTS: 14500
      MULTI_SWIMMER_DISCOUNT_RATE: 0.0625
      MULTI_SWIMMER_DISCOUNT_CAP: 0.25
      LATE_PENALTY_RATE: 0.035
    precision: "integer cents; round_half_up applied once per emitted line and once to the penalty, in exactly that order"

  - name: party_reservation_charge
    trigger: "POST /swim-club/party-reservations"
    algorithm: tiered_pricing
    formula: |
      # This formula LOOKS circular: the guard surcharge depends on the bather load, the discount
      # tier depends on a subtotal that already includes the guard surcharge, and the final total
      # depends on the discount. It is not circular - the nine steps below are the pinned
      # evaluation order and MUST be executed in exactly this sequence.

      # step 1 - bather load
      bather_load = reservation.guest_count + reservation.host_party_size

      # step 2 - guards required (whole-facility bookings need one extra for deep-end coverage)
      ratio_guards         = ceil(bather_load / GUARD_BATHER_RATIO)
      required_guard_count = max(MIN_GUARDS_WHEN_OPEN, ratio_guards)
                             + (1 if reservation.zone == WHOLE_FACILITY else 0)

      # step 3 - billable duration, rounded UP to whole hours
      duration_hours_ceil = ceil((reservation.end_iso - reservation.start_iso) / 1 hour)

      # step 4 - guard surcharge
      guard_surcharge_cents = required_guard_count * duration_hours_ceil * GUARD_HOURLY_CENTS

      # step 5 - zone base fee
      base_fee_cents = ZONE_BASE_FEE_CENTS[reservation.zone]

      # step 6 - guest overage
      guest_overage_cents = max(0, reservation.guest_count - INCLUDED_GUESTS) * GUEST_OVERAGE_CENTS

      # step 7 - subtotal (the guard surcharge IS inside the discount base)
      subtotal_cents = base_fee_cents + guest_overage_cents + guard_surcharge_cents

      # step 8 - discount tier, keyed off the subtotal from step 7 (inclusive lower bounds)
      if   subtotal_cents >= DISCOUNT_TIER_2_CENTS: discount_rate = 0.15
      elif subtotal_cents >= DISCOUNT_TIER_1_CENTS: discount_rate = 0.10
      else:                                        discount_rate = 0.00

      # step 9 - total
      discount_cents     = round_half_up(subtotal_cents * discount_rate)
      total_charge_cents = subtotal_cents - discount_cents

      household.party_charges_owed_cents += total_charge_cents

      # Worked example (pinned): zone WHOLE_FACILITY, guest_count 26, host_party_size 5,
      #   2027-07-10T14:00:00Z -> 2027-07-10T18:30:00Z
      #     step 1 bather_load          = 31
      #     step 2 ratio_guards         = ceil(31 / 25) = 2 ; +1 for WHOLE_FACILITY -> 3
      #     step 3 duration_hours_ceil  = ceil(4.5) = 5
      #     step 4 guard_surcharge      = 3 * 5 * 2200 = 33000
      #     step 5 base_fee             = 20000
      #     step 6 guest_overage        = max(0, 26 - 10) * 700 = 11200
      #     step 7 subtotal             = 20000 + 11200 + 33000 = 64200
      #     step 8 64200 >= 45000       -> discount_rate 0.15
      #     step 9 discount             = round_half_up(9630.0) = 9630 ; total = 54570
      #   Evaluating step 8 against base_fee + guest_overage only (31200) would pick tier 1
      #   (0.10) and produce 57780 - a different, wrong answer. The order is observable.
    input_set: "The reservation's own zone, guest_count, host_party_size and time window. No other reservation contributes to the charge; overlap and capacity are validation concerns, not pricing concerns."
    constants:
      GUARD_BATHER_RATIO: 25
      MIN_GUARDS_WHEN_OPEN: 1
      GUARD_HOURLY_CENTS: 2200
      INCLUDED_GUESTS: 10
      GUEST_OVERAGE_CENTS: 700
      DISCOUNT_TIER_1_CENTS: 25000
      DISCOUNT_TIER_2_CENTS: 45000
      ZONE_BASE_FEE_CENTS: { PAVILION: 6000, SHALLOW_END: 9000, WHOLE_FACILITY: 20000 }
    precision: "integer cents; ceil on guard count and on duration hours; round_half_up on the discount only"

  - name: facility_posture_derivation
    trigger: "Recomputed after every write to InspectionFinding (create or transition) and after POST /swim-club/seasons/{id}/open and POST /swim-club/seasons/{id}/close"
    algorithm: constraint_propagation
    formula: |
      open_findings = InspectionFindings for this season with status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED}
      season.open_critical_finding_count = count(open_findings where severity == CRITICAL)
      season.open_major_finding_count    = count(open_findings where severity == MAJOR)

      if season.status != OPEN:
          posture = CLOSED                     # a season that is not OPEN is never swimmable
      elif season.open_critical_finding_count >= 1:
          posture = CLOSED
      elif season.open_major_finding_count >= MAJOR_FINDING_RESTRICT_THRESHOLD:
          posture = RESTRICTED
      else:
          posture = OPEN

      if posture == CLOSED and season.facility_posture != CLOSED:
          season.closure_started_at = logical clock
          # cascade hop 2: every CONFIRMED PartyReservation in this season whose end_iso is
          # still in the future moves to CANCELLED_BY_CLOSURE, and every SCHEDULED or
          # CONFIRMED GuardShift of the season still in the future moves to
          # CANCELLED_BY_CLOSURE
      if posture != CLOSED:
          season.closure_started_at = null
    input_set: "InspectionFindings of this season only, and only those in a non-terminal status. VERIFIED_CLOSED findings never contribute, no matter their severity. MINOR findings never affect posture at all."
    constants:
      MAJOR_FINDING_RESTRICT_THRESHOLD: 2
    precision: "integer counts; no rounding"

  - name: staffing_ratio_compliance
    trigger: "GET /swim-club/seasons/{id}/staffing-window, and as a precondition of POST /swim-club/party-reservations/{id}/transitions to CONFIRMED and of POST /swim-club/guard-shifts/{id}/transitions to CONFIRMED"
    algorithm: interval_merge
    formula: |
      # Inputs: season, at_iso (a single instant)
      overlapping_parties = PartyReservations of this season with status IN {REQUESTED, CONFIRMED}
                            and start_iso <= at_iso < end_iso        # half-open [start, end)
      bather_load = sum(p.guest_count + p.host_party_size for p in overlapping_parties)

      ratio_guards         = ceil(bather_load / GUARD_BATHER_RATIO)
      required_guard_count = max(MIN_GUARDS_WHEN_OPEN, ratio_guards)
                             + (1 if any(p.zone == WHOLE_FACILITY for p in overlapping_parties) else 0)

      covering_shifts = GuardShifts of this season with status == CONFIRMED
                        and counts_toward_ratio == true             # SUPERVISOR shifts excluded
                        and start_iso <= at_iso <= end_iso          # CLOSED interval for shifts
      scheduled_guard_count = count(distinct lifeguard_id over covering_shifts)

      compliant = scheduled_guard_count >= required_guard_count
    input_set: "PartyReservations in REQUESTED or CONFIRMED (never REJECTED, COMPLETED or any CANCELLED_* status) plus GuardShifts in CONFIRMED with counts_toward_ratio true, i.e. shift_role PRIMARY or SECONDARY - SCHEDULED shifts do not count toward coverage because an unconfirmed guard may not show, and SUPERVISOR shifts never count. Note the deliberate asymmetry: parties use a half-open interval so back-to-back parties do not stack, while shifts use a closed interval so a guard standing at the exact instant of handover is counted."
    constants:
      GUARD_BATHER_RATIO: 25
      MIN_GUARDS_WHEN_OPEN: 1
    precision: "integer counts; ceil on the ratio division; the >= comparison is inclusive, so exactly meeting the requirement is compliant"

  - name: waitlist_offer_selection
    trigger: "POST /swim-club/waitlist-entries/next-offer"
    algorithm: chronological
    formula: |
      candidates = WaitlistEntries where
                     status == WAITING
                     and membership_category_id == requested membership_category_id
                     and household.standing == GOOD_STANDING

      if candidates is empty:
          raise ERR_WAITLIST_EMPTY

      # deterministic total order; created_at is the final tie-break, never id
      # priority_tier_rank: LEGACY = 0, SIBLING = 1, STANDARD = 2
      winner = min(candidates, key = (entry.priority_tier_rank ASC,
                                      entry.queue_key_at      ASC,
                                      entry.created_at        ASC))

      winner.status            = OFFERED
      winner.offered_at        = logical clock
      winner.offer_expires_at  = logical clock + OFFER_WINDOW_DAYS days
    input_set: "Only WAITING entries for the requested category whose household is in GOOD_STANDING. Entries whose household is on PROBATION, SUSPENDED or EXPELLED are skipped without changing their status, as are entries already OFFERED, ACCEPTED, DECLINED, WITHDRAWN or EXPIRED. queue_key_at equals created_at until the entry is requeued, after which it equals requeued_at - which is how a household that declines with requeue=true loses its place to later arrivals in the same tier."
    constants:
      OFFER_WINDOW_DAYS: 14
      MAX_DEFERRALS: 2
    precision: "no arithmetic; ordering only"

  - name: volunteer_credit_balance
    trigger: "POST /swim-club/meets/{id}/close-roster and POST /swim-club/volunteer-assignments/{id}/transitions, and read back through GET /swim-club/swim-team-registrations/{id}"
    algorithm: aggregation
    formula: |
      # per Membership (the household's dues invoice carries the volunteer obligation)
      earned = sum(JOB_CREDIT_VALUES[a.job_code] for a in VolunteerAssignments
                   whose swim_team_registration_id belongs to this membership
                   and whose status == COMPLETED)
      membership.volunteer_credits_earned = min(earned, VOLUNTEER_CREDIT_CAP)
      shortfall = max(0, membership.volunteer_credits_required
                         - membership.volunteer_credits_earned)
      membership.volunteer_buyout_cents = shortfall * VOLUNTEER_BUYOUT_PER_CREDIT_CENTS

      # per Meet, filled slots are counted in credits, not in bodies
      meet.volunteer_slots_filled = sum(a.credit_value for a in
                                        VolunteerAssignments of this meet
                                        with status IN {ASSIGNED, COMPLETED})
    input_set: "For a membership's earned credits, only COMPLETED assignments count. For a meet's filled slots, ASSIGNED and COMPLETED both count while RELEASED and NO_SHOW do not - so releasing or no-showing an assignment lowers the meet's filled count and can push a STAFFED meet back to UNDERSTAFFED. volunteer_credits_required is itself derived: min(VOLUNTEER_CREDIT_CAP, category.volunteer_credits_required * count of registrations in CONFIRMED or COMPLETED)."
    constants:
      JOB_CREDIT_VALUES: { TIMER: 1, STARTER: 2, CONCESSIONS: 1, MARSHAL: 1, SCORER: 2 }
      VOLUNTEER_CREDIT_CAP: 10
      VOLUNTEER_BUYOUT_PER_CREDIT_CENTS: 3500
    precision: "integer credits and integer cents; the cap is applied to earned credits before the shortfall is taken, so over-volunteering never produces a negative buyout"

  - name: capital_reserve_position
    trigger: "POST /swim-club/seasons/{id}/reserve-contributions, POST /swim-club/memberships/{id}/payments (the per-membership contribution), POST /swim-club/capital-projects/{id}/fund and the CapitalProject CANCELLED transition"
    algorithm: aggregation
    formula: |
      # The reserve is tracked with two counters on Season that must always satisfy the identity
      #   season.reserve_unallocated_cents
      #     + sum(p.funded_cents for p in CapitalProjects of this season
      #           with status IN {FUNDED, IN_PROGRESS, COMPLETED})
      #   == season.reserve_contributions_cents
      #
      # Contribution: the first time a membership's dues_status becomes PAID, both counters rise
      #   season.reserve_contributions_cents += RESERVE_CONTRIBUTION_PER_MEMBERSHIP_CENTS
      #   season.reserve_unallocated_cents   += RESERVE_CONTRIBUTION_PER_MEMBERSHIP_CENTS
      # (booked exactly once per membership; season.reserve_contributed_membership_count += 1)
      #
      # Draw: funding a project moves money between the two sides of the identity
      #   season.reserve_unallocated_cents -= draw_amount_cents
      #   project.funded_cents             += draw_amount_cents
      #
      # Compensation: cancelling a funded project moves it all back
      #   season.reserve_unallocated_cents += project.funded_cents
      #   project.funded_cents             := 0
      #
      # reserve_contributions_cents is append-only: it NEVER decreases, not on a draw and not on
      # a cancellation. Writing off a membership's dues does NOT claw back an already-booked
      # contribution either.
    input_set: "CapitalProjects of this season in FUNDED, IN_PROGRESS or COMPLETED contribute their funded_cents to the allocated side. PROPOSED, APPROVED, REJECTED and CANCELLED projects contribute nothing (a CANCELLED project has had funded_cents zeroed, so it also contributes nothing arithmetically)."
    constants:
      RESERVE_CONTRIBUTION_PER_MEMBERSHIP_CENTS: 5000
    precision: "integer cents; no rounding anywhere, so the identity holds exactly"

  - name: conduct_point_accrual
    trigger: "Every ConductCase transition that changes points_assessed (SANCTIONED, DISMISSED, APPEALED -> UNDER_REVIEW)"
    algorithm: decay_function
    formula: |
      cutoff = logical clock - CONDUCT_LOOKBACK_DAYS days
      household.conduct_points = sum(c.points_assessed for c in ConductCases of this household
                                     where c.status IN {SANCTIONED, CLOSED}
                                       and c.sanctioned_at >= cutoff)
      # points_assessed was set to CONDUCT_POINTS[c.severity] when the case was SANCTIONED
    input_set: "Only SANCTIONED and CLOSED cases whose sanctioned_at falls inside the lookback window. REPORTED, UNDER_REVIEW, APPEALED and DISMISSED cases contribute zero - which is why accepting an appeal for re-hearing can lower a household's points below the suspension threshold. Cases older than the window decay out entirely, without any explicit event."
    constants:
      CONDUCT_LOOKBACK_DAYS: 730
      CONDUCT_POINTS: { MINOR: 2, MAJOR: 4, SEVERE: 8 }
    precision: "integer points; the lookback boundary is inclusive, so a case sanctioned exactly CONDUCT_LOOKBACK_DAYS ago still counts"

  - name: conduct_sanction_standing_map
    trigger: "Immediately after conduct_point_accrual recomputes household.conduct_points on a ConductCase SANCTIONED transition"
    algorithm: threshold
    formula: |
      # Two independent inputs decide the new standing: the sanction just handed down, and the
      # household's accrued point total. The stronger of the two wins.
      by_sanction = { WARNING:    GOOD_STANDING,
                      PROBATION:  PROBATION,
                      SUSPENSION: SUSPENDED,
                      EXPULSION:  EXPELLED }[case.sanction_type]

      if   household.conduct_points >= CONDUCT_EXPULSION_THRESHOLD:  by_points = EXPELLED
      elif household.conduct_points >= CONDUCT_SUSPENSION_THRESHOLD: by_points = SUSPENDED
      else:                                                          by_points = GOOD_STANDING

      severity_rank = { GOOD_STANDING: 0, PROBATION: 1, SUSPENDED: 2, EXPELLED: 3 }
      target = the one of {by_sanction, by_points, household.standing} with the highest
               severity_rank                       # standing never softens on a sanction

      if target != household.standing:
          household.standing = target
          # cascade hop 2 onward when target IN {SUSPENDED, EXPELLED}:
          #   Membership.access_status -> SUSPENDED (or TERMINATED on EXPELLED)
          #   -> SwimTeamRegistration  -> REVOKED
          #   -> VolunteerAssignment   -> RELEASED
          #   -> Meet.volunteer_slots_filled decremented, STAFFED -> UNDERSTAFFED if short
          #   -> future PartyReservations -> CANCELLED_BY_SUSPENSION
    input_set: "The household's own recomputed conduct_points and the sanction_type of the case being decided. Standing is monotone under this rule: it can only move to an equal or more severe value, and is softened only by the explicit POST /swim-club/households/{id}/standing-transitions reinstatement."
    constants:
      CONDUCT_SUSPENSION_THRESHOLD: 6
      CONDUCT_EXPULSION_THRESHOLD: 10
    precision: "integer thresholds; both comparisons are inclusive >= , so exactly 6 points suspends and exactly 10 expels"

# =============================================================================
# 1.4 Validation Rules (evaluated strictly in ascending priority order)
# =============================================================================
# Domain ordering rationale: this is a public-health-regulated facility, so the ladder runs
#   auth -> shape -> existence -> optimistic concurrency -> resource state ->
#   safety/compliance (guard certification and bather ratio) -> temporal window ->
#   constraint (overlap, capacity, uniqueness) -> referential -> fiscal (money last).
# A closed pool outranks an unpaid bill, and an uncertified guard outranks a scheduling
# inconvenience: nobody may swim while the health department has us shut, and no fiscal
# complaint may be reported in place of a compliance failure.
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "for a Member, X-User-ID equals the Household.id that owns the addressed resource (directly for a Household or WaitlistEntry, through membership.household_id for a Membership, GuestVisit, SwimTeamRegistration or PartyReservation, and through case.household_id for a ConductCase)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Member-accessible endpoints that address an owned resource"

  - priority: 5
    category: auth
    check: "two-person control: the deciding user is not the user who created the item under decision. X-User-ID != project.requested_by_user_id on CapitalProject APPROVED/REJECTED, X-User-ID != case.reported_by_user_id on ConductCase SANCTIONED/DISMISSED, and X-User-ID != finding.recorded_by_user_id on InspectionFinding VERIFIED_CLOSED"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /swim-club/capital-projects/{id}/transitions, POST /swim-club/conduct-cases/{id}/transitions, POST /swim-club/inspection-findings/{id}/transitions"

  - priority: 10
    category: business_constraint
    check: "every required input field of the endpoint is present, of the declared JSON type, and non-empty; integer money and count fields are integers >= 0; date fields are YYYY-MM-DD and instant fields are ISO-8601 UTC"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 11
    category: business_constraint
    check: "every enum-valued input is one of the declared values for that field (membership category code, residency, priority_tier, bond_payment_plan, season proration_basis and guest_settlement_policy, waitlist decision, membership payment allocation, household payment allocation, zone, shift_role, severity, sanction_type, job_code, squad, cert_type, project_kind, to_standing, to_status)"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints accepting an enum input"

  - priority: 12
    category: business_temporal
    check: "for any pair of instants or dates in one payload, start is strictly before end (guard shift start_iso < end_iso, party start_iso < end_iso, season open_date < close_date)"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /swim-club/seasons, POST /swim-club/guard-shifts, POST /swim-club/party-reservations"

  - priority: 13
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 422
    applies_to: "all list endpoints"

  - priority: 20
    category: existence
    check: "the Season addressed in the path or referenced by season_id exists"
    error_id: ERR_SEASON_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints addressing or referencing a Season"

  - priority: 21
    category: existence
    check: "the MembershipCategory referenced by membership_category_id exists"
    error_id: ERR_CATEGORY_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/membership-categories/{id}, POST /swim-club/waitlist-entries, POST /swim-club/memberships"

  - priority: 22
    category: existence
    check: "the Household addressed in the path or referenced by household_id exists"
    error_id: ERR_HOUSEHOLD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints addressing or referencing a Household"

  - priority: 23
    category: existence
    check: "the WaitlistEntry addressed in the path exists"
    error_id: ERR_WAITLIST_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/waitlist-entries/{id}, POST /swim-club/waitlist-entries/{id}/respond"

  - priority: 24
    category: existence
    check: "the Membership addressed in the path or referenced by membership_id exists"
    error_id: ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints addressing or referencing a Membership"

  - priority: 25
    category: existence
    check: "the GuestVisit addressed in the path exists"
    error_id: ERR_GUEST_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/guest-visits/{id}, POST /swim-club/guest-visits/{id}/void"

  - priority: 26
    category: existence
    check: "the Lifeguard addressed in the path or referenced by lifeguard_id exists"
    error_id: ERR_LIFEGUARD_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/lifeguards/{id}, POST /swim-club/certifications, POST /swim-club/guard-shifts"

  - priority: 27
    category: existence
    check: "the Certification addressed in the path exists"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/certifications/{id}, POST /swim-club/certifications/{id}/revoke"

  - priority: 28
    category: existence
    check: "the GuardShift addressed in the path exists"
    error_id: ERR_GUARD_SHIFT_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/guard-shifts/{id}, POST /swim-club/guard-shifts/{id}/transitions"

  - priority: 29
    category: existence
    check: "the SwimTeamRegistration addressed in the path or referenced by swim_team_registration_id exists"
    error_id: ERR_REGISTRATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/swim-team-registrations/{id}, POST /swim-club/swim-team-registrations/{id}/transitions, POST /swim-club/volunteer-assignments"

  - priority: 30
    category: existence
    check: "the Meet addressed in the path or referenced by meet_id exists"
    error_id: ERR_MEET_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/meets/{id}, POST /swim-club/meets/{id}/close-roster, POST /swim-club/meets/{id}/transitions, POST /swim-club/volunteer-assignments"

  - priority: 31
    category: existence
    check: "the VolunteerAssignment addressed in the path exists"
    error_id: ERR_VOLUNTEER_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/volunteer-assignments/{id}, POST /swim-club/volunteer-assignments/{id}/transitions"

  - priority: 32
    category: existence
    check: "the PartyReservation addressed in the path exists"
    error_id: ERR_PARTY_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/party-reservations/{id}, POST /swim-club/party-reservations/{id}/transitions"

  - priority: 33
    category: existence
    check: "the InspectionFinding addressed in the path exists"
    error_id: ERR_INSPECTION_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/inspection-findings/{id}, POST /swim-club/inspection-findings/{id}/transitions"

  - priority: 34
    category: existence
    check: "the ConductCase addressed in the path exists"
    error_id: ERR_CONDUCT_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/conduct-cases/{id}, POST /swim-club/conduct-cases/{id}/transitions"

  - priority: 35
    category: existence
    check: "the CapitalProject addressed in the path exists"
    error_id: ERR_CAPITAL_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "GET /swim-club/capital-projects/{id}, POST /swim-club/capital-projects/{id}/transitions, POST /swim-club/capital-projects/{id}/fund"

  - priority: 38
    category: state
    check: "expected_household_version equals the sponsoring Household's current version (§1.2.1 guest-visit-record-stale-household)"
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412
    applies_to: "POST /swim-club/guest-visits"

  - priority: 39
    category: state
    check: "expected_capital_project_version equals the CapitalProject's current version (§1.2.1 capital-project-fund-stale-project)"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /swim-club/capital-projects/{id}/fund"

  - priority: 40
    category: state
    check: "the referenced Season.status is OPEN"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /swim-club/memberships, POST /swim-club/guest-visits, POST /swim-club/guard-shifts, POST /swim-club/swim-team-registrations, POST /swim-club/meets, POST /swim-club/party-reservations"

  - priority: 41
    category: state
    check: "the referenced Season.facility_posture is not CLOSED"
    error_id: ERR_FACILITY_CLOSED
    http_status: 409
    applies_to: "POST /swim-club/guest-visits, POST /swim-club/party-reservations, POST /swim-club/party-reservations/{id}/transitions to CONFIRMED, POST /swim-club/meets/{id}/transitions to HOSTED"

  - priority: 42
    category: state
    check: "when the referenced Season.facility_posture is RESTRICTED, the request stays inside the restricted-operations envelope: a GuestVisit may bring at most RESTRICTED_MAX_GUESTS_PER_VISIT (2) guests and a PartyReservation may not book zone WHOLE_FACILITY"
    error_id: ERR_FACILITY_RESTRICTED
    http_status: 409
    applies_to: "POST /swim-club/guest-visits, POST /swim-club/party-reservations"

  - priority: 43
    category: state
    check: "the requested to_status is a declared outgoing edge from the resource's current status in §1.2"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all transition and action endpoints"

  - priority: 44
    category: state
    check: "the addressed resource is not already in a terminal state for its state machine"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition and action endpoints"

  - priority: 45
    category: state
    check: "the acting or referenced Household.standing is not SUSPENDED or EXPELLED"
    error_id: ERR_HOUSEHOLD_SUSPENDED
    http_status: 409
    applies_to: "POST /swim-club/waitlist-entries, POST /swim-club/memberships, POST /swim-club/guest-visits, POST /swim-club/swim-team-registrations, POST /swim-club/party-reservations"

  - priority: 46
    category: state
    check: "the referenced Membership.access_status is ACTIVE for POST /swim-club/guest-visits and POST /swim-club/party-reservations. POST /swim-club/swim-team-registrations relaxes this to access_status IN {PENDING, ACTIVE}, because swimmers must be registered before the invoice is cut (the invoice is what flips access PENDING -> ACTIVE and what bills swim-team fees), but a SUSPENDED, LAPSED or TERMINATED membership may never register a swimmer. POST /swim-club/swim-team-registrations/{id}/transitions to CONFIRMED tightens it again: the membership must be access_status ACTIVE AND dues_status IN {INVOICED, PAID}, so a swimmer cannot be confirmed onto a squad from an uninvoiced or suspended membership."
    error_id: ERR_MEMBERSHIP_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /swim-club/guest-visits, POST /swim-club/swim-team-registrations, POST /swim-club/party-reservations, POST /swim-club/swim-team-registrations/{id}/transitions to CONFIRMED"

  - priority: 47
    category: state
    check: "the Meet.roster_closed_at is null (a closed roster accepts no further volunteer assignments and cannot be closed twice)"
    error_id: ERR_ROSTER_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /swim-club/meets/{id}/close-roster, POST /swim-club/volunteer-assignments"

  - priority: 48
    category: state
    check: "the WaitlistEntry is in status OFFERED and its offer is still live: logical clock <= entry.offer_expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /swim-club/waitlist-entries/{id}/respond"

  - priority: 49
    category: state
    check: "entry.deferral_count < MAX_DEFERRALS (2) when decision=DECLINE is sent with requeue=true"
    error_id: ERR_MAX_DEFERRALS_REACHED
    http_status: 409
    applies_to: "POST /swim-club/waitlist-entries/{id}/respond"

  - priority: 50
    category: business_safety
    check: "the assigned Lifeguard holds a Certification with status VALID and cert_type LIFEGUARD and another with status VALID and cert_type CPR_AED, each with expires_on >= date(shift.end_iso). Certification is a health-department compliance requirement and therefore outranks every scheduling and fiscal check below."
    error_id: ERR_CERT_NOT_VALID_FOR_SHIFT
    http_status: 422
    applies_to: "POST /swim-club/guard-shifts, POST /swim-club/guard-shifts/{id}/transitions to CONFIRMED"

  - priority: 51
    category: business_safety
    check: "calculations.staffing_ratio_compliance reports compliant == true at the window being confirmed (checked at start_iso and at end_iso minus one minute)"
    error_id: ERR_GUARD_RATIO_NOT_MET
    http_status: 422
    applies_to: "POST /swim-club/party-reservations/{id}/transitions to CONFIRMED, POST /swim-club/meets/{id}/transitions to HOSTED"

  - priority: 60
    category: business_temporal
    check: "the operation's date or instant lies inside the referenced season's window: season.open_date <= date <= season.close_date"
    error_id: ERR_OUTSIDE_SEASON_WINDOW
    http_status: 422
    applies_to: "POST /swim-club/guest-visits, POST /swim-club/guard-shifts, POST /swim-club/meets, POST /swim-club/party-reservations"

  - priority: 61
    category: business_temporal
    check: "visit_start_iso is not after the logical clock's date (a visit cannot be recorded before it happens)"
    error_id: ERR_VISIT_IN_FUTURE
    http_status: 422
    applies_to: "POST /swim-club/guest-visits"

  - priority: 62
    category: business_constraint
    check: "the Lifeguard has no other GuardShift in status SCHEDULED or CONFIRMED whose closed interval [start_iso, end_iso] comes within SHIFT_REST_BUFFER_MINUTES (30) of the new shift. Two shifts that merely touch (previous end_iso == new start_iso) are rejected; a gap of exactly 30 minutes is allowed."
    error_id: ERR_SHIFT_REST_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /swim-club/guard-shifts"

  - priority: 63
    category: business_constraint
    check: "no other PartyReservation in status REQUESTED or CONFIRMED holds a conflicting zone over a half-open [start_iso, end_iso) overlap. A WHOLE_FACILITY booking conflicts with every zone; PAVILION and SHALLOW_END conflict only with themselves. Adjacency (previous end_iso == new start_iso) is allowed."
    error_id: ERR_ZONE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /swim-club/party-reservations"

  - priority: 64
    category: business_constraint
    check: "the aggregate bather load of all REQUESTED and CONFIRMED reservations overlapping the requested half-open window, plus this reservation's own load, does not exceed season.bather_load_capacity"
    error_id: ERR_BATHER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /swim-club/party-reservations"

  - priority: 65
    category: business_constraint
    check: "the household has no existing Membership for this season whose access_status is outside {LAPSED, TERMINATED}"
    error_id: ERR_DUPLICATE_MEMBERSHIP
    http_status: 409
    applies_to: "POST /swim-club/memberships"

  - priority: 66
    category: business_constraint
    check: "the household has no existing WaitlistEntry for this membership category in status WAITING, OFFERED or ACCEPTED"
    error_id: ERR_DUPLICATE_WAITLIST_ENTRY
    http_status: 409
    applies_to: "POST /swim-club/waitlist-entries"

  - priority: 67
    category: business_constraint
    check: "guest_count is between 1 and MAX_GUESTS_PER_VISIT (6) inclusive"
    error_id: ERR_GUEST_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /swim-club/guest-visits"

  - priority: 68
    category: business_constraint
    check: "household.member_count <= category.max_household_size for the category being joined or waitlisted"
    error_id: ERR_HOUSEHOLD_SIZE_EXCEEDED
    http_status: 422
    applies_to: "POST /swim-club/waitlist-entries, POST /swim-club/memberships"

  - priority: 69
    category: business_constraint
    check: "meet.volunteer_slots_filled + JOB_CREDIT_VALUES[job_code] <= meet.volunteer_slots_required, i.e. a meet cannot be oversubscribed in credits. A new assignment is born ASSIGNED and counts immediately, so the check runs at creation."
    error_id: ERR_VOLUNTEER_SLOTS_FULL
    http_status: 409
    applies_to: "POST /swim-club/volunteer-assignments"

  - priority: 70
    category: business_constraint
    check: "the registration has no other VolunteerAssignment for this meet in status ASSIGNED or COMPLETED"
    error_id: ERR_DUPLICATE_VOLUNTEER_ASSIGNMENT
    http_status: 409
    applies_to: "POST /swim-club/volunteer-assignments"

  - priority: 71
    category: business_referential
    check: "when the category's waitlist_required is true, the household must hold a WaitlistEntry for this category in status ACCEPTED"
    error_id: ERR_WAITLIST_OFFER_REQUIRED
    http_status: 409
    applies_to: "POST /swim-club/memberships"

  - priority: 72
    category: business_referential
    check: "the membership_category_id in the request matches the category of the waitlist entry being converted"
    error_id: ERR_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /swim-club/memberships"

  - priority: 73
    category: business_referential
    check: "all season-scoped references in one request name the same Season: registration.season_id == membership.season_id, assignment's meet.season_id == registration.season_id, shift.season_id == the season whose window is checked, project.funding_season_id == the season drawn against"
    error_id: ERR_SEASON_MISMATCH
    http_status: 422
    applies_to: "POST /swim-club/swim-team-registrations, POST /swim-club/volunteer-assignments, POST /swim-club/capital-projects/{id}/fund"

  - priority: 74
    category: business_referential
    check: "at least one eligible WaitlistEntry exists for the requested category (status WAITING and household.standing == GOOD_STANDING)"
    error_id: ERR_WAITLIST_EMPTY
    http_status: 409
    applies_to: "POST /swim-club/waitlist-entries/next-offer"

  - priority: 75
    category: business_constraint
    check: "the squad named on the registration has room: count of SwimTeamRegistrations for this season and squad in status PENDING, CONFIRMED or COMPLETED < SQUAD_CAPACITY[squad] ({MINI: 20, JUNIOR: 30, SENIOR: 30}). At creation a full squad does not reject: the registration is born WAITLISTED instead of PENDING. The error only fires when a WAITLISTED registration is pushed to CONFIRMED while the squad is still full."
    error_id: ERR_SQUAD_FULL
    http_status: 409
    applies_to: "POST /swim-club/swim-team-registrations/{id}/transitions to CONFIRMED"

  - priority: 80
    category: business_fiscal
    check: "the household is not delinquent: it holds no Membership in this season with dues_status IN {DELINQUENT, WRITTEN_OFF}, and household.guest_fee_owed_cents + household.party_charges_owed_cents does not exceed DELINQUENCY_TOLERANCE_CENTS (0)"
    error_id: ERR_DUES_DELINQUENT
    http_status: 402
    applies_to: "POST /swim-club/guest-visits, POST /swim-club/party-reservations, POST /swim-club/swim-team-registrations"

  - priority: 81
    category: business_fiscal
    check: "the household's bond is settled (household.bond_status IN {PAID, TRANSFERRED}, or bond_paid_cents >= category.bond_cents) before the household may reserve the facility for a private party"
    error_id: ERR_BOND_NOT_PAID
    http_status: 402
    applies_to: "POST /swim-club/party-reservations"

  - priority: 82
    category: business_fiscal
    check: "no payment exceeds the counter it settles: on POST /swim-club/memberships/{id}/payments, amount_cents <= membership.balance_due_cents; on POST /swim-club/households/{id}/payments, amount_cents <= household.guest_fee_owed_cents for allocation=GUEST_FEES, <= household.party_charges_owed_cents for allocation=PARTY_CHARGES, and <= category.bond_cents - household.bond_paid_cents for allocation=BOND"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /swim-club/memberships/{id}/payments, POST /swim-club/households/{id}/payments"

  - priority: 83
    category: business_fiscal
    check: "draw_amount_cents <= season.reserve_unallocated_cents"
    error_id: ERR_INSUFFICIENT_RESERVE
    http_status: 402
    applies_to: "POST /swim-club/capital-projects/{id}/fund"

  - priority: 84
    category: business_fiscal
    check: "project.funded_cents + draw_amount_cents <= project.budget_cents"
    error_id: ERR_DRAW_EXCEEDS_BUDGET
    http_status: 422
    applies_to: "POST /swim-club/capital-projects/{id}/fund"

# =============================================================================
# 1.5 API Endpoints
# =============================================================================
endpoints:
  # --- Season -----------------------------------------------------------------
  - method: POST
    path: "/swim-club/seasons"
    description: "Create a swim season in PLANNED status with its dues due date, bather-load capacity, and the two policy switches that select the dual-variant defaults."
    roles: [BoardPresident]
    code: 201
    input: [year, open_date, close_date, dues_due_date, baseline_bather_load, bather_load_capacity, "proration_basis?", "guest_settlement_policy?"]
    output: Season
    side_effects: ["status := PLANNED", "facility_posture := CLOSED", "reserve_contributions_cents := 0", "reserve_unallocated_cents := 0", "proration_basis defaults to CALENDAR_DAY and guest_settlement_policy defaults to PASS_FIRST"]

  - method: POST
    path: "/swim-club/seasons/{id}/open"
    description: "Open the season for swimming. Recomputes facility posture from the season's open inspection findings."
    roles: [PoolManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status PLANNED -> OPEN", "calculations.facility_posture_derivation runs", "version += 1"]

  - method: POST
    path: "/swim-club/seasons/{id}/close"
    description: "Close the season. Lapses every unpaid membership and forces facility posture to CLOSED."
    roles: [PoolManager]
    code: 200
    input: []
    output: Season
    side_effects: ["status OPEN -> CLOSED", "every Membership of this season with access_status IN {ACTIVE, SUSPENDED} moves access_status -> LAPSED, processed in created_at ASC order", "every SwimTeamRegistration of this season in CONFIRMED moves to COMPLETED", "volunteer_buyout_cents is assessed on every membership per calculations.volunteer_credit_balance and folded into balance_due_cents", "facility_posture := CLOSED", "version += 1"]

  - method: POST
    path: "/swim-club/seasons/{id}/billing-runs"
    description: "Operator-run checkpoint that ages the season: expires stale waitlist offers, marks invoiced-but-unpaid memberships DELINQUENT once the dues due date has passed, and expires certifications that lapsed since the last run."
    roles: [Treasurer]
    code: 200
    input: ["as_of_date?"]
    output: Season
    side_effects: ["every WaitlistEntry in OFFERED with offer_expires_at < clock moves to EXPIRED", "every Membership in INVOICED with balance_due_cents > 0 and clock date > season.dues_due_date moves dues_status -> DELINQUENT", "every Certification in VALID with expires_on < clock date moves to EXPIRED, which can drive its Lifeguard to INACTIVE", "version += 1"]

  - method: POST
    path: "/swim-club/seasons/{id}/reserve-contributions"
    description: "Book a lump capital-reserve contribution (a special assessment) onto the season, raising both sides of the reserve identity."
    roles: [Treasurer]
    code: 200
    input: [amount_cents, "note?"]
    output: Season
    side_effects: ["reserve_contributions_cents += amount_cents", "reserve_unallocated_cents += amount_cents", "version += 1"]

  - method: GET
    path: "/swim-club/seasons/{id}"
    description: "Read one season, including its derived posture, finding counts and reserve counters."
    roles: [BoardPresident, Treasurer, PoolManager, MembershipChair, SwimTeamCoach, HealthInspector, Member]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: GET
    path: "/swim-club/seasons"
    description: "List seasons, filterable by year and lifecycle status."
    roles: [BoardPresident, Treasurer, PoolManager, MembershipChair, SwimTeamCoach, HealthInspector, Member]
    code: 200
    input: ["year?", "status?", "facility_posture?", "limit?", "offset?"]
    output: Season[]
    side_effects: []

  - method: GET
    path: "/swim-club/seasons/{id}/staffing-window"
    description: "Computed read: evaluates calculations.staffing_ratio_compliance at a single instant and returns the bather load, the required guard count, the confirmed guard count and the compliance verdict."
    roles: [PoolManager, BoardPresident, HealthInspector]
    code: 200
    input: [at_iso]
    output: "{ season_id, at_iso, bather_load, required_guard_count, scheduled_guard_count, compliant }"
    side_effects: []

  # --- MembershipCategory -----------------------------------------------------
  - method: POST
    path: "/swim-club/membership-categories"
    description: "Create a membership category with its bond, initiation fee, seasonal dues, guest-pass allotment, household size cap and volunteer obligation."
    roles: [MembershipChair]
    code: 201
    input: [code, label, bond_cents, initiation_fee_cents, seasonal_dues_cents, guest_pass_allotment, max_household_size, volunteer_credits_required, "waitlist_required?", "proration_allowed?", "party_privileges?"]
    output: MembershipCategory
    side_effects: ["waitlist_required defaults to false, proration_allowed to true, party_privileges to true"]

  - method: GET
    path: "/swim-club/membership-categories/{id}"
    description: "Read one membership category."
    roles: [MembershipChair, Treasurer, BoardPresident, PoolManager, Member]
    code: 200
    input: []
    output: MembershipCategory
    side_effects: []

  - method: GET
    path: "/swim-club/membership-categories"
    description: "List membership categories."
    roles: [MembershipChair, Treasurer, BoardPresident, PoolManager, Member]
    code: 200
    input: ["code?", "waitlist_required?", "limit?", "offset?"]
    output: MembershipCategory[]
    side_effects: []

  # --- Household --------------------------------------------------------------
  - method: POST
    path: "/swim-club/households"
    description: "Register a household. transferred_from_household_id records a bond transfer from a departing household, which carries that household's paid bond forward."
    roles: [MembershipChair]
    code: 201
    input: [primary_contact_name, address_line, residency, member_count, "transferred_from_household_id?", "prior_member?"]
    output: Household
    side_effects: ["standing := GOOD_STANDING", "bond_status := NONE and bond_paid_cents := 0, unless transferred_from_household_id is given, in which case bond_status := TRANSFERRED and bond_paid_cents copies the source household's bond_paid_cents", "conduct_points := 0", "guest_pass_allotment_granted, guest_passes_consumed and guest_pass_balance := 0", "guest_fee_owed_cents, party_charges_owed_cents and account_credit_cents := 0"]

  - method: POST
    path: "/swim-club/households/{id}/standing-transitions"
    description: "Move a household's conduct standing explicitly. This is the only path that softens standing (reinstatement from SUSPENDED back to PROBATION or GOOD_STANDING); the conduct pipeline can only harden it."
    roles: [BoardPresident]
    code: 200
    input: [to_standing, reason]
    output: Household
    side_effects: ["standing := to_standing", "on a move out of SUSPENDED, every Membership of this household with access_status == SUSPENDED returns to ACTIVE, but revoked SwimTeamRegistrations and released VolunteerAssignments are NOT restored", "version += 1"]

  - method: POST
    path: "/swim-club/households/{id}/payments"
    description: "Front-desk settlement of household-level money. allocation=GUEST_FEES and allocation=PARTY_CHARGES retire cash owed at the gate or for a party; allocation=BOND pays down the membership bond. This is the ONLY way guest fees and party charges are cleared with money - voiding a visit or refunding a reservation is a reversal, not a payment - and it is what a household must do before it may sponsor another guest or book another party, because validations[priority=80] tolerates zero outstanding household charges."
    roles: [Treasurer, Member]
    code: 200
    input: [amount_cents, allocation]
    output: Household
    side_effects: ["allocation=GUEST_FEES lowers guest_fee_owed_cents by amount_cents", "allocation=PARTY_CHARGES lowers party_charges_owed_cents by amount_cents", "allocation=BOND raises bond_paid_cents by amount_cents and moves bond_status NONE or INSTALLMENTS -> PAID once bond_paid_cents >= the bond_cents of the category of this household's Membership (bond_status TRANSFERRED is never overwritten)", "version += 1"]

  - method: GET
    path: "/swim-club/households/{id}"
    description: "Read one household, including its guest-pass ledger, conduct points and money owed."
    roles: [MembershipChair, Treasurer, BoardPresident, PoolManager, Member]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/swim-club/households"
    description: "List households. transferred_from_household_id finds every household that inherited a bond from the given household."
    roles: [MembershipChair, Treasurer, BoardPresident, PoolManager]
    code: 200
    input: ["standing?", "residency?", "bond_status?", "transferred_from_household_id?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # --- WaitlistEntry ----------------------------------------------------------
  - method: POST
    path: "/swim-club/waitlist-entries"
    description: "Put a household on the waitlist for a membership category. queue_key_at is seeded from created_at and is what the offer selector orders on."
    roles: [MembershipChair, Member]
    code: 201
    input: [household_id, membership_category_id, "priority_tier?"]
    output: WaitlistEntry
    side_effects: ["status := WAITING", "priority_tier defaults to STANDARD and priority_tier_rank is derived (LEGACY=0, SIBLING=1, STANDARD=2)", "deferral_count := 0", "requeued_at := null", "queue_key_at := created_at"]

  - method: POST
    path: "/swim-club/waitlist-entries/next-offer"
    description: "Extend the next membership offer for a category, choosing the winner per calculations.waitlist_offer_selection. Returns the entry that was offered."
    roles: [MembershipChair]
    code: 200
    input: [membership_category_id]
    output: WaitlistEntry
    side_effects: ["winning entry status WAITING -> OFFERED", "offered_at := clock, offer_expires_at := clock + OFFER_WINDOW_DAYS days", "ERR_WAITLIST_EMPTY when no eligible entry exists", "version += 1"]

  - method: POST
    path: "/swim-club/waitlist-entries/{id}/respond"
    description: "Respond to a live offer with decision=ACCEPT, decision=DECLINE (with or without requeue), or decision=WITHDRAW from a WAITING entry."
    roles: [Member, MembershipChair]
    code: 200
    input: [decision, "requeue?"]
    output: WaitlistEntry
    side_effects: ["decision=ACCEPT moves OFFERED -> ACCEPTED, which is the entry POST /swim-club/memberships consumes in a waitlist_required category", "decision=DECLINE with requeue=true moves OFFERED -> WAITING with deferral_count += 1, requeued_at := clock (so queue_key_at becomes later than every un-requeued sibling), offered_at := null and offer_expires_at := null", "decision=DECLINE with requeue=false moves OFFERED -> DECLINED", "decision=WITHDRAW moves WAITING -> WITHDRAWN", "requeue defaults to false", "version += 1"]

  - method: GET
    path: "/swim-club/waitlist-entries/{id}"
    description: "Read one waitlist entry, including its queue key and deferral count."
    roles: [MembershipChair, BoardPresident, Member]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/swim-club/waitlist-entries"
    description: "List waitlist entries, filterable by household, category and status. This is how a household's queue position is discovered."
    roles: [MembershipChair, BoardPresident, Member]
    code: 200
    input: ["household_id?", "membership_category_id?", "status?", "priority_tier?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  # --- Membership -------------------------------------------------------------
  - method: POST
    path: "/swim-club/memberships"
    description: "Create a season membership for a household, converting a live waitlist offer when the category requires one. Books the provisional dues assessment on the CALENDAR_DAY variant."
    roles: [MembershipChair]
    code: 201
    input: [household_id, membership_category_id, season_id, join_date, "bond_payment_plan?"]
    output: Membership
    side_effects: ["dues_status := UNBILLED and access_status := PENDING", "calculations.seasonal_dues_assessment runs on the variant named by season.proration_basis and stamps assessed_dues_cents once", "initiation_fee_cents := category.initiation_fee_cents when household.prior_member is false, otherwise 0", "household.guest_pass_allotment_granted += category.guest_pass_allotment and household.guest_pass_balance += category.guest_pass_allotment", "household.bond_status := INSTALLMENTS when bond_payment_plan is INSTALLMENTS", "household.version += 1"]

  - method: POST
    path: "/swim-club/memberships/{id}/invoice"
    description: "Cut the season invoice per calculations.season_dues_invoice_total. Cut exactly once per membership: it is the only UNBILLED -> INVOICED edge, and it is also what flips access_status PENDING -> ACTIVE, so every swimmer to be billed must already be registered."
    roles: [Treasurer]
    code: 200
    input: []
    output: Membership
    side_effects: ["bond_installment_cents, swim_team_fee_cents and late_penalty_cents set from the invoice lines while assessed_dues_cents and initiation_fee_cents keep their creation-time stamps", "invoice_total_cents and balance_due_cents set", "invoiced_at := clock", "dues_status UNBILLED -> INVOICED", "access_status PENDING -> ACTIVE, which is what makes the membership eligible to sponsor guest visits and party reservations", "version += 1"]

  - method: POST
    path: "/swim-club/memberships/{id}/payments"
    description: "Record a dues or bond payment against the membership. A payment that clears the balance settles the membership and books the season's per-membership reserve contribution once."
    roles: [Treasurer, Member]
    code: 200
    input: [amount_cents, "allocation?"]
    output: Membership
    side_effects: ["amount_paid_cents += amount_cents and balance_due_cents -= amount_cents", "allocation defaults to DUES; allocation=BOND raises household.bond_paid_cents and flips household.bond_status to PAID once bond_paid_cents >= category.bond_cents", "when balance_due_cents reaches 0 the dues_status moves INVOICED -> PAID or DELINQUENT -> PAID, and calculations.capital_reserve_position books RESERVE_CONTRIBUTION_PER_MEMBERSHIP_CENTS onto both season reserve counters exactly once for this membership", "household.version += 1 and season.version += 1", "version += 1"]

  - method: POST
    path: "/swim-club/memberships/{id}/write-off"
    description: "Write off an uncollectible balance on a DELINQUENT membership. Suspends access without clawing back any already-booked reserve contribution."
    roles: [Treasurer]
    code: 200
    input: [reason]
    output: Membership
    side_effects: ["dues_status DELINQUENT -> WRITTEN_OFF and balance_due_cents := 0", "access_status ACTIVE -> SUSPENDED in the same request, which revokes every SwimTeamRegistration of this membership in PENDING, CONFIRMED or WAITLISTED and cancels every future reservation as CANCELLED_BY_SUSPENSION", "season.reserve_contributions_cents is NOT reduced", "version += 1"]

  - method: GET
    path: "/swim-club/memberships/{id}"
    description: "Read one membership, including its invoice breakdown, balance and volunteer credit position."
    roles: [MembershipChair, Treasurer, BoardPresident, PoolManager, SwimTeamCoach, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/swim-club/memberships"
    description: "List memberships, filterable by household, category, season and either status dimension."
    roles: [MembershipChair, Treasurer, BoardPresident, PoolManager, SwimTeamCoach, Member]
    code: 200
    input: ["household_id?", "membership_category_id?", "season_id?", "dues_status?", "access_status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  # --- GuestVisit -------------------------------------------------------------
  - method: POST
    path: "/swim-club/guest-visits"
    description: "Record a guest visit sponsored by a membership. Carries the OCC guard expected_household_version because the settlement outcome depends on the household's live pass balance."
    roles: [Member, PoolManager]
    code: 201
    input: [membership_id, sponsor_name, guest_count, visit_start_iso, expected_household_version]
    output: GuestVisit
    side_effects: ["status := RECORDED", "is_weekend derived from visit_start_iso", "settlement_variant := season.guest_settlement_policy, copied onto the visit", "calculations.guest_visit_settlement sets passes_used and fee_charged_cents", "household.guest_pass_balance -= passes_used, household.guest_passes_consumed += passes_used, household.guest_fee_owed_cents += fee_charged_cents", "household.version += 1", "ERR_STALE_HOUSEHOLD_VERSION (412) when expected_household_version != household.version"]

  - method: POST
    path: "/swim-club/guest-visits/{id}/void"
    description: "Void a mistakenly recorded guest visit. Returns the consumed passes and reverses the fee, restoring the guest-pass conservation identity exactly."
    roles: [PoolManager]
    code: 200
    input: [reason]
    output: GuestVisit
    side_effects: ["status RECORDED -> VOIDED and voided_at := clock", "household.guest_pass_balance += passes_used and household.guest_passes_consumed -= passes_used", "household.guest_fee_owed_cents -= fee_charged_cents", "household.version += 1", "version += 1"]

  - method: GET
    path: "/swim-club/guest-visits/{id}"
    description: "Read one guest visit, including how it was settled."
    roles: [PoolManager, Treasurer, MembershipChair, BoardPresident, Member]
    code: 200
    input: []
    output: GuestVisit
    side_effects: []

  - method: GET
    path: "/swim-club/guest-visits"
    description: "List guest visits, filterable by sponsoring membership and status."
    roles: [PoolManager, Treasurer, MembershipChair, BoardPresident, Member]
    code: 200
    input: ["membership_id?", "status?", "settlement_variant?", "limit?", "offset?"]
    output: GuestVisit[]
    side_effects: []

  # --- Lifeguard --------------------------------------------------------------
  - method: POST
    path: "/swim-club/lifeguards"
    description: "Hire a lifeguard. The guard starts ACTIVE but holds no certification, so no shift can be confirmed until certifications are recorded."
    roles: [PoolManager]
    code: 201
    input: [full_name, hire_date]
    output: Lifeguard
    side_effects: ["employment_status := ACTIVE", "scheduled_hours := 0", "has_valid_lifeguard_cert := false and has_valid_cpr_cert := false"]

  - method: GET
    path: "/swim-club/lifeguards/{id}"
    description: "Read one lifeguard, including the two derived certification flags and scheduled hours."
    roles: [PoolManager, BoardPresident, HealthInspector]
    code: 200
    input: []
    output: Lifeguard
    side_effects: []

  - method: GET
    path: "/swim-club/lifeguards"
    description: "List lifeguards, filterable by employment status and certification coverage."
    roles: [PoolManager, BoardPresident, HealthInspector]
    code: 200
    input: ["employment_status?", "has_valid_lifeguard_cert?", "limit?", "offset?"]
    output: Lifeguard[]
    side_effects: []

  # --- Certification ----------------------------------------------------------
  - method: POST
    path: "/swim-club/certifications"
    description: "Record a certification for a lifeguard. Recording a second certification of the same cert_type supersedes the previous one."
    roles: [PoolManager]
    code: 201
    input: [lifeguard_id, cert_type, issued_on, expires_on]
    output: Certification
    side_effects: ["status := VALID", "any existing Certification for this lifeguard with the same cert_type and status VALID moves to SUPERSEDED", "lifeguard.has_valid_lifeguard_cert / has_valid_cpr_cert recomputed", "an INACTIVE lifeguard returns to ACTIVE when a VALID LIFEGUARD certification exists again", "lifeguard.version += 1"]

  - method: POST
    path: "/swim-club/certifications/{id}/revoke"
    description: "Revoke a certification. Revoking a guard's last valid lifeguard certification deactivates the guard."
    roles: [PoolManager]
    code: 200
    input: [revoked_reason]
    output: Certification
    side_effects: ["status VALID -> REVOKED and revoked_reason recorded", "lifeguard.has_valid_lifeguard_cert / has_valid_cpr_cert recomputed", "lifeguard.employment_status ACTIVE -> INACTIVE when no VALID LIFEGUARD certification remains", "every GuardShift of this lifeguard in SCHEDULED or CONFIRMED whose end_iso is still in the future moves to CANCELLED", "lifeguard.version += 1", "version += 1"]

  - method: GET
    path: "/swim-club/certifications/{id}"
    description: "Read one certification."
    roles: [PoolManager, BoardPresident, HealthInspector]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/swim-club/certifications"
    description: "List certifications, filterable by lifeguard, type and status. This is how a guard's certification wall is discovered."
    roles: [PoolManager, BoardPresident, HealthInspector]
    code: 200
    input: ["lifeguard_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  # --- GuardShift -------------------------------------------------------------
  - method: POST
    path: "/swim-club/guard-shifts"
    description: "Schedule a lifeguard shift inside a season window. Enforces the certification wall before the rest buffer, so an uncertified guard is reported as a compliance failure and never as a scheduling conflict."
    roles: [PoolManager]
    code: 201
    input: [lifeguard_id, season_id, shift_role, start_iso, end_iso]
    output: GuardShift
    side_effects: ["status := SCHEDULED", "duration_hours computed from the interval", "counts_toward_ratio := true when shift_role IN {PRIMARY, SECONDARY}, false for SUPERVISOR", "lifeguard.scheduled_hours += duration_hours", "lifeguard.version += 1"]

  - method: POST
    path: "/swim-club/guard-shifts/{id}/transitions"
    description: "Move a shift through CONFIRMED, COMPLETED, CANCELLED or NO_SHOW."
    roles: [PoolManager]
    code: 200
    input: [to_status]
    output: GuardShift
    side_effects: ["status := to_status when the edge is declared in §1.2", "CONFIRMED re-checks the certification wall against date(end_iso)", "CANCELLED and NO_SHOW subtract duration_hours from lifeguard.scheduled_hours", "lifeguard.version += 1", "version += 1"]

  - method: GET
    path: "/swim-club/guard-shifts/{id}"
