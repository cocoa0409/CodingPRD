            - "hop 4: AdvertiserContract.${ac1_id}.guarantee_status == SUSPENDED_PENDING_RESTATEMENT"
            - "hop 5: MakeGoodObligation.${mg1_id}.status == VOID with closed_reason == RESTATEMENT_REQUIRED_CASCADE"
            - "AdvertiserContract.${ac1_id}.makegood_credit_committed_cents == 0, makegood_credit_waived_cents == 0, makegood_credit_available_cents == 10200000"
            - "${mg1_credit} == 4808796 was committed before the cascade, so the pool returned to its full 10200000 with no drift"

      - name: hygiene_sweep_three_hop_posture_staleness_cascade
        grounds:
          - calculations.publication_copies_ledger
          - calculations.publication_audit_posture
          - state_machines.Subscriber.QUALIFIED_to_REQUALIFICATION_REQUIRED
          - entities.HygieneRun.fields.statements_invalidated_count
          - entities.CirculationStatement.fields.breakdown_stale
          - validations[priority=42]
        distinguishing_aspect: |
          Depth 3 from a different trigger (hygiene-runs, not issue-report) and through a different
          chain: (1) the sweep removes a recipient, (2) the removal pushes undeliverable_pct to
          exactly the restrict threshold so audit_posture moves OPEN -> RESTRICTED, (3) the posture
          change marks the publication's DRAFT statement breakdown_stale, which then blocks
          certification. No money and no audit entities are involved.
        test_recipe:
          setup:
            - "publication with undeliverable_restrict_pct 5.00 and all three qualification rules"
            - "recipient SD with 950 PAID copies and recipient SE with 50 CONTROLLED copies, both verified QUALIFIED at the default clock"
