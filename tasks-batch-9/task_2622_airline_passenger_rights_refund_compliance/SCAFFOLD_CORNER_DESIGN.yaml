      - name: complaint_not_answer_breached_at_exact_answer_due_instant
        claim_type: satisfaction_to_pass
        grounds: ["calculations.complaint_deadline_resolution.precision", "endpoints[POST /compliance/compliance-sweeps]", "calculations.compliance_sweep_recount"]
        distinguishing_aspect: "Both breach comparisons are strict: a sweep run at exactly answer_due_utc (2026-10-04T09:00:00Z) leaves answer_breached false and open_violation_count 0, while the same sweep one second later flags it — the boundary instant belongs to the carrier."
        test_recipe:
          setup:
            - "Complaint received 2026-08-05T09:00:00Z (category REFUND -> answer_due 2026-10-04T09:00:00Z, ack_due 2026-09-04T09:00:00Z) and acknowledged 2026-08-06T10:00:00Z, so only the answer axis is live."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bk_id}", category: "REFUND", channel: "EMAIL", received_at_utc: "2026-08-05T09:00:00Z", summary: "Refund never arrived." }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { cmp_id: "$.data.id" }
            - call: "POST /compliance/consumer-complaints/${cmp_id}/acknowledge"
              payload: { acknowledged_at_utc: "2026-08-06T10:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T09:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
          trigger:
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { answer_flags_at_due: "$.data.complaint_answer_breach_flagged_count", violations_at_due: "$.data.open_violation_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T09:00:01Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
