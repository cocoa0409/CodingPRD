            - { call: "POST /ops/safety-events", payload: { contractor_id: "${b2_c2}", kind: "NEAR_MISS", severity_weight: 1, occurred_at: "2026-04-21T00:00:00Z" }, as: EHSOfficer, as_user_id: "ehs-1" }
          trigger:
            - call: "POST /ops/contractors/${b2_c1}/qualify"
