        grounds:
          - state_machines.HarvestLoad.PLANNED_to_IN_TRANSIT
          - state_machines.HarvestLoad.IN_TRANSIT_to_REJECTED
          - calculations.delivery_window_committed_tons
          - entities.Block.fields.committed_harvest_tons
          - entities.CustomFarmingContract.fields.projected_total_billable
        distinguishing_aspect: |
          The window's tonnage ledger is conserved across a three-step lifecycle: booking consumes
          12.40 tons, dispatch deliberately consumes nothing more (committed_tons counts PLANNED
          and IN_TRANSIT alike), and rejection returns the full 12.40 so committed_tons is 0.00 and
          window_posture OPEN again — while received_tons stays 0.00 and the contract's
          accrued_quality_incentive never moves. The compensation here is a resource ledger, not a
          budget ledger as in this rule's other instance.
        test_recipe:
          setup:
            - "Contract C1 ACTIVE with only block B-12 enrolled at 12.5 contracted acres, per_acre_annual_fee 950.00 -> management_fee_base 11875.00."
            - "Plan P1 APPROVED; crew CR1 ACTIVE with HARVEST capability; B-12 carries a CLUSTER_COUNT estimate -> governing_estimate_tons 91.47."
            - "No spray has been applied, so Block.phi_clear_at is null and dispatch is unrestricted."
            - "WineryDeliveryWindow DW1 [2026-09-14T06:00:00Z, 2026-09-14T18:00:00Z], capacity_tons 40.00, committed_tons 0.00, remaining_tons 40.00, window_posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b1_id}", contracted_acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /contracts/${c1_id}/activate"
              payload: { client_signature_name: "Dana Ridgecrest" }
              as: ClientOwner
              as_user_id: "${v1_id}"
            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2026, quality_target: "PREMIUM", pruning_budget_per_acre: 420.00, canopy_budget_per_acre: 310.00, irrigation_budget_per_acre: 180.00, pest_budget_per_acre: 265.00, seasonal_water_cap_inches: 9.000 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /farming-plans/${p1_id}/submit"
              payload: { submission_note: "2026 program for B-12" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /farming-plans/${p1_id}/approve"
              payload: { approval_note: "Approved as submitted" }
              as: Controller
              as_user_id: "u-ctl-1"
            - call: "POST /crews"
              payload: { crew_name: "Cuadrilla Norte", pay_structure: "PIECE_RATE", crew_size: 12, base_hourly_rate: 19.50, piece_rate_per_vine: 0.65, vines_per_hour_standard: 45, task_capabilities: ["PRUNING", "SUCKERING", "LEAFING", "HARVEST"], pest_certified: false, crew_status: "ACTIVE" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { cr1_id: $.data.id }
            - call: "POST /blocks/${b1_id}/yield-estimates"
              payload: { method: "CLUSTER_COUNT", sample_date: "2026-08-25", avg_clusters_per_vine: 32, avg_cluster_weight_lb: 0.42 }
              as: Agronomist
              as_user_id: "u-ag-1"
            - call: "POST /delivery-windows"
              payload: { winery_name: "Coastal Cellars", window_start: "2026-09-14T06:00:00Z", window_end: "2026-09-14T18:00:00Z", capacity_tons: 40.00 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { dw1_id: $.data.id }
            - call: "GET /delivery-windows/${dw1_id}"
              payload: {}
              as: Controller
              captures: { dw1_v0: $.data.version }
          trigger:
            - call: "POST /harvest-loads"
              payload: { block_id: "${b1_id}", crew_id: "${cr1_id}", delivery_window_id: "${dw1_id}", estimated_tons: 12.40, delivery_eta: "2026-09-14T09:00:00Z", expected_delivery_window_version: "${dw1_v0}" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { hl_id: $.data.id, hl_status_planned: $.data.load_status }
            - call: "GET /delivery-windows/${dw1_id}"
              payload: {}
              as: Controller
              captures: { dw1_committed_booked: $.data.committed_tons, dw1_remaining_booked: $.data.remaining_tons }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T07:00:00Z" }
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
            - call: "POST /harvest-loads/${hl_id}/dispatch"
              payload: { gross_tons_at_dispatch: 13.10 }
              as: CrewSupervisor
              as_user_id: "${cr1_id}"
              captures: { hl_status_transit: $.data.load_status, hl_dispatched_at: $.data.dispatched_at }
            - call: "GET /delivery-windows/${dw1_id}"
              payload: {}
              as: Controller
              captures: { dw1_committed_transit: $.data.committed_tons, dw1_remaining_transit: $.data.remaining_tons }
            - call: "POST /harvest-loads/${hl_id}/reject"
              payload: { rejection_reason: "MOG_EXCESS" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { hl_status_rejected: $.data.load_status, hl_net: $.data.net_tons, hl_incentive: $.data.quality_incentive_amount }
            - call: "GET /delivery-windows/${dw1_id}"
              payload: {}
              as: Controller
              captures: { dw1_committed_final: $.data.committed_tons, dw1_remaining_final: $.data.remaining_tons, dw1_posture_final: $.data.window_posture }
            - call: "GET /blocks/${b1_id}"
              payload: {}
              as: Controller
              captures: { b1_committed: $.data.committed_harvest_tons, b1_received: $.data.received_tons, b1_remaining: $.data.remaining_estimated_tons }
            - call: "GET /contracts/${c1_id}"
              payload: {}
              as: Controller
              captures: { c1_accrued: $.data.accrued_quality_incentive, c1_projected: $.data.projected_total_billable }
          assert:
            - "after booking: HarvestLoad.${hl_id}.load_status == PLANNED, WineryDeliveryWindow.${dw1_id}.committed_tons == 12.40 and remaining_tons == 27.60"
            - "after dispatch: HarvestLoad.${hl_id}.load_status == IN_TRANSIT and dispatched_at == 2026-09-14T07:00:00Z"
            - "after dispatch WineryDeliveryWindow.${dw1_id}.committed_tons is still 12.40 and remaining_tons still 27.60 (dispatch consumes no additional capacity)"
            - "after reject: HarvestLoad.${hl_id}.load_status == REJECTED, rejection_reason == MOG_EXCESS, net_tons == 0.00, quality_incentive_amount == 0.00"
            - "WineryDeliveryWindow.${dw1_id}.committed_tons == 0.00"
            - "WineryDeliveryWindow.${dw1_id}.remaining_tons == 40.00"
            - "WineryDeliveryWindow.${dw1_id}.window_posture == OPEN"
            - "Block.${b1_id}.committed_harvest_tons == 0.00"
            - "Block.${b1_id}.received_tons == 0.00"
            - "Block.${b1_id}.remaining_estimated_tons == 91.47"
            - "CustomFarmingContract.${c1_id}.accrued_quality_incentive == 0.00"
            - "CustomFarmingContract.${c1_id}.projected_total_billable == 11875.00"
            - "at all four observations committed_tons + remaining_tons == 40.00"
