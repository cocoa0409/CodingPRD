              captures: { token_v: $.data.version }
          trigger:
            - call: "POST /ca/certificate-profiles/${profile_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-02T00:00:00Z", expected_profile_version: "${token_v}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { first_crl_number: $.data.crl_number }
            - call: "POST /ca/certificate-profiles/${profile_id}/crl-publications"
              payload: { this_update: "2026-08-01T23:00:00Z", next_update: "2026-08-02T22:00:00Z", expected_profile_version: "${token_v}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err_stale_profile: $.data.error_id }
