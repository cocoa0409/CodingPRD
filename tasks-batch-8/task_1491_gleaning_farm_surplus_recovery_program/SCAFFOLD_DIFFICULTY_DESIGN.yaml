        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          available_lbs = harvested - distributed - condemned is the gate for
          creating a Distribution, while creating that Distribution itself
          mutates distributed (and hence available). The scaffold pins the
          order: feasibility is evaluated against totals CURRENT at request
