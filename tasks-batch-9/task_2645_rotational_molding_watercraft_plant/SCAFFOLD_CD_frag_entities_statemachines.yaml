            - "ProductionOrder.${po}: status still 'IN_PRODUCTION', blocked_reason == null, version == 4  # 1 create + 1 release + 2 cycle creates; the cascade left the order alone because it was never BLOCKED_RESIN, so CASCADE-E link 5 is likewise inert"
