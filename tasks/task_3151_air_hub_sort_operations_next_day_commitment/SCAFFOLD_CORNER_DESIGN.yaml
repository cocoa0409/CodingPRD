              as: SortOperator
              captures: { err_scope: $.data.error_id }
          assert:
            - "the first request returns 404 with ${err_both} == ERR_RESOURCE_NOT_FOUND for the hub_id, checked first because hub_id is declared first"
            - "the second request returns 404 with ${err_scope} == ERR_RESOURCE_NOT_FOUND even though ${ac_ind_id} is a real aircraft — it belongs to a different hub"
            - "GET /airhub/packages?hub_id=${hub_id} returns 0 rows"
            - "GET /airhub/packages?hub_id=${ind_hub_id} returns 0 rows"

      - name: package_load_gate_and_version_guard
        claim_type: Parent Relationships
