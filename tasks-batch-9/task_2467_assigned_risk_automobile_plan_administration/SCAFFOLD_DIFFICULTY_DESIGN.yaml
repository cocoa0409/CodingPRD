            - "Clock at 2026-10-05. Atlas Mutual services policy AR-100008 and holds a second ACCEPTED assignment for application 2 with no policy yet, so assigned_risk_count == 2."
            - "Two complaints against Atlas on AR-100008 have been resolved UPHELD, so performance_score == 60 and posture == SUSPENDED while status is still ACTIVE."
            - "The ACCEPTED assignment survived the suspension cascade because only PENDING_ACCEPTANCE assignments are rescinded, and its acceptance predates the suspension."
