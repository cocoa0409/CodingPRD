      - name: every_new_row_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Referral
          - state_machines.ConsentRecord
          - state_machines.EvaluationCase
          - state_machines.DomainAssessment
          - state_machines.ScreeningEvent
          - state_machines.ScreeningSlot
        distinguishing_aspect: |
          Six machines are asserted at birth in one chain: a Referral starts
          RECEIVED with consent_status NOT_REQUESTED (two dimensions, two
          initials), a ConsentRecord PENDING, an EvaluationCase PLANNED with
          required_domain_count 5, a DomainAssessment SCHEDULED, a ScreeningEvent
          SCHEDULED and a ScreeningSlot BOOKED - none of which the client may set.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE screening_host_approved site, one SCHOOL_PSYCHOLOGIST chair, one ECSE_TEACHER evaluator and one child born 2023-08-01."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
