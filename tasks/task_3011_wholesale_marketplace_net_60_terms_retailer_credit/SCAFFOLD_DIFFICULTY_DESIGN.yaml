    instances:
      - name: grant_interval_overlap_same_pair
        grounds:
          - validations[priority=13]
          - state_machines.ExclusivityGrant
        distinguishing_aspect: |
          Half-open [starts_at, ends_at) interval semantics on the
          ExclusivityGrant resource: a second grant for the same (brand,
          retailer) whose interval merely TOUCHES the first (starts_at == prior
          ends_at) is accepted, while one overlapping by one second is rejected
          with ERR_GRANT_OVERLAP.
