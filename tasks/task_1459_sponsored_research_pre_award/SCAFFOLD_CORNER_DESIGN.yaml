        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ACTIVE_REVIEW]"]
        distinguishing_aspect: "A second IRB review on the same proposal while the first is PENDING -> ERR_DUPLICATE_ACTIVE_REVIEW (409); a different review_type (IACUC) is accepted."
        test_recipe:
          setup: ["opportunity, eligible PI; proposal DRAFT with one PENDING IRB review"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
