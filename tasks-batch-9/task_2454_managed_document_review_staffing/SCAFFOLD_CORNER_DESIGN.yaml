            - "first trigger call: HTTP 409 with error_id \"ERR_SECOND_LEVEL_SAME_REVIEWER\", which outranks the tier mismatch at priority 35"
            - "second trigger call: HTTP 201 with effective_per_document_cents == 128 (round_half_up(150 * 1.35 * 1.05 * 0.60)) and committed_amount_cents == 51200"
            - "after the last call: Assignment.${a2_id}.billable_amount_cents == 51200 and Batch.${b1_id}.status == \"QC_SAMPLING\" — the join fires only on the SECOND_LEVEL submit"
            - "Assignment.${a1_id}.billable_amount_cents == 85200 and status == \"SUBMITTED\""
            - "Matter.${m_id}.committed_spend_cents == 136400 (85200 + 51200)"

      - name: release_requires_validated_privilege_quota
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=24]
          - errors[ERR_PRIVILEGE_LOG_INCOMPLETE]
          - state_machines.Batch.QC_PASSED_to_RELEASED
        distinguishing_aspect: "The release precondition is a FLOOR, not a percentage: with zero privilege entries the quota is max(2, ceil(0 * 0.20)) == 2, so a QC_PASSED batch with a clean sample is still refused with ERR_PRIVILEGE_LOG_INCOMPLETE."
        test_recipe:
          setup:
            - "the core matter with Batch 1 (400 documents) coded, submitted and QC_PASSED on a clean 40-document sample"
            - "Reviewer A logged privilege_hits_logged 0, so the batch carries no PrivilegeLogEntry rows"
            - "Reviewer C is the QC validator and holds no assignment on the batch"
