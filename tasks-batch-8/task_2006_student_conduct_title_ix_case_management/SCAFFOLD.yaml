scenario: |
  2006. Student Conduct & Title IX Case Management (university Title IX office): report intake & jurisdiction/scope determination, supportive measures & no-contact directive, investigation assignment & evidence gathering, advisor/support-person rights & notice requirements, live hearing & cross-examination procedure, sanctioning matrix & appeal grounds, recordkeeping & annual statistics, informal resolution option

domain_name: title-ix-case-management
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Case.version for create-with-supersede writes
    - cascading_side_effects        # appeal outcome -> case remand -> packet supersede -> item re-review
    - scheduled_actions             # logical-clock-driven review windows, appeal deadlines, directive expiry
    - selector_policy               # university-appointed advisor selection from eligible pool
  entity_topology: flat             # peer collections under /api/* linked by FK references
  state_machine_shape: cyclic       # Case remand loops, informal-resolution withdrawal loops, hearing adjourn/reconvene loops
  relationship_patterns:
    - one_to_many                   # Case -> Notice/EvidenceItem/SupportiveMeasure/...
    - self_referential              # NoContactDirective.superseded_by_directive_id, AdvisorAppointment.replaced_by_appointment_id
    - cross_aggregate               # Hearing -> EvidencePacket gate, Appeal -> Determination target
  role_model: segregation_of_duties # investigator / decision-maker / coordinator / appeal officer / facilitator must be different people per case
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: PartyProfile
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal full name" }
      - { name: university_id, type: string, source: input, description: "University-issued person identifier; unique across PartyProfile" }
      - { name: role_type, type: enum, source: input, description: "STUDENT | EMPLOYEE | FACULTY | STAFF | EXTERNAL" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: advisor_eligible, type: boolean, source: input, default: false, description: "Whether this profile may serve as a university-appointed advisor" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: report_number, type: string, source: system, description: "Server-minted human reference RPT-<year>-<zero-padded sequence within received year>" }
      - { name: complainant_id, type: string, source: input, description: "FK -> PartyProfile.id; the complainant" }
      - { name: respondent_id, type: string, source: input, description: "FK -> PartyProfile.id; the respondent" }
      - { name: coordinator_id, type: string, source: input, description: "FK -> PartyProfile.id; Title IX coordinator owning this case" }
      - { name: categories, type: array, source: input, description: "Non-empty array of alleged-conduct category enums: SEXUAL_HARASSMENT | SEXUAL_ASSAULT | DATING_VIOLENCE | DOMESTIC_VIOLENCE | STALKING | OTHER_SEX_BASED | NON_TITLE_IX_MISCONDUCT" }
      - { name: occurred_at, type: datetime, source: input, description: "Alleged incident timestamp (ISO8601)" }
      - { name: occurred_in_program_activity, type: boolean, source: input, description: "Jurisdiction fact: incident occurred within an education program or activity" }
      - { name: occurred_in_united_states, type: boolean, source: input, description: "Jurisdiction fact: complainant was in the United States" }
      - { name: received_via, type: enum, source: input, description: "ONLINE_FORM | IN_PERSON | EMAIL | THIRD_PARTY | ANONYMOUS" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of intake" }
      - { name: status, type: enum, source: system, description: "RECEIVED | JURISDICTION_REVIEW | AWAITING_FORMAL_COMPLAINT | INVESTIGATION | EVIDENCE_REVIEW | HEARING_PREPARATION | HEARING_IN_PROGRESS | DELIBERATION | DETERMINATION_ISSUED | APPEAL_REVIEW | REMANDED | INFORMAL_RESOLUTION_IN_PROGRESS | RESOLVED_INFORMAL | DISMISSED | REFERRED_TO_CONDUCT | CLOSED" }
      - { name: formal_complaint_signed, type: boolean, source: system, default: false, description: "Set true when the complainant files a signed formal complaint" }
      - { name: formal_complaint_filed_at, type: datetime, source: system, description: "Null until formal complaint filed" }
      - { name: standard_of_evidence, type: enum, source: input, default: "PREPONDERANCE", description: "PREPONDERANCE | CLEAR_AND_CONVINCING; pinned at intake and immutable; determination must match" }
      - { name: dismissal_reason, type: enum, source: system, description: "MANDATORY_NO_JURISDICTION | DISCRETIONARY_COMPLAINANT_WITHDRAWN | DISCRETIONARY_RESPONDENT_DEPARTED | DISCRETIONARY_EVIDENCE_UNAVAILABLE; null unless DISMISSED/REFERRED_TO_CONDUCT" }
      - { name: remand_target, type: enum, source: system, description: "INVESTIGATION | HEARING_PREPARATION; set when an appeal remands the case, null otherwise" }
      - { name: active_supportive_measure_count, type: integer, source: computed, default: 0, description: "Count of SupportiveMeasure rows with this case_id and status == ACTIVE; maintained on every measure mutation" }
      - { name: interim_suspension_eligible, type: boolean, source: computed, default: false, description: "True when calc_case_exposure_score >= INTERIM_SUSPENSION_THRESHOLD (70); recomputed on every exposure input mutation" }
      - { name: exposure_score, type: integer, source: computed, default: 0, description: "Last computed value of calc_case_exposure_score" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when status entered a terminal state (CLOSED, DISMISSED, REFERRED_TO_CONDUCT, RESOLVED_INFORMAL); null until then" }

  - name: SupportiveMeasure
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: measure_type, type: enum, source: input, description: "COUNSELING | COURSE_ADJUSTMENT | HOUSING_CHANGE | SCHEDULE_CHANGE | EXTENSION | ESCORT | SAFETY_PLAN | OTHER" }
      - { name: party_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT | BOTH; confidentiality scope: cross-party reads forbidden unless BOTH" }
      - { name: description, type: string, source: input, description: "Measure details" }
      - { name: effective_from, type: datetime, source: input, description: "Start of measure window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of measure window (exclusive); null = open-ended, never auto-expires" }
      - { name: is_confidential, type: boolean, source: system, default: true, description: "Always true; the other party must not learn the measure exists" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED | EXPIRED" }

  - name: NoContactDirective
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: party_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT | MUTUAL; which party the directive restrains. A MUTUAL directive occupies BOTH party scopes for overlap purposes" }
      - { name: restrictions, type: array, source: input, description: "Non-empty subset of IN_PERSON | ELECTRONIC | THIRD_PARTY | PROXIMITY" }
      - { name: proximity_feet, type: integer, source: input, description: "Required when restrictions includes PROXIMITY; minimum physical separation" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive) - half-open interval [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); null = open-ended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | LIFTED | EXPIRED" }
      - { name: superseded_by_directive_id, type: string, source: system, description: "FK -> NoContactDirective.id; set when a newer directive supersedes this one; null otherwise" }
      - { name: substantiated_violation_count, type: integer, source: computed, default: 0, description: "Count of DirectiveViolation rows on this directive with status SUBSTANTIATED" }

  - name: DirectiveViolation
    parent: NoContactDirective
    common_fields: true
    fields:
      - { name: directive_id, type: string, source: system, description: "FK -> NoContactDirective.id; the violated directive (path-bound)" }
      - { name: reported_by_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT | STAFF" }
      - { name: occurred_at, type: datetime, source: input, description: "When the alleged violation occurred" }
      - { name: description, type: string, source: input, description: "What happened" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBSTANTIATED | UNSUBSTANTIATED" }
      - { name: substantiated_at, type: datetime, source: system, description: "Logical-clock timestamp of substantiation; null otherwise; drives rolling-window exposure count" }

  - name: InvestigatorAssignment
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: investigator_id, type: string, source: input, description: "FK -> PartyProfile.id; staff member proposed as investigator" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | DECLINED | RECUSED | COMPLETED" }
      - { name: recusal_reason, type: string, source: input, description: "Required on recusal; null otherwise" }

  - name: EvidenceItem
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: submitted_by_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT | INVESTIGATOR" }
      - { name: evidence_type, type: enum, source: input, description: "DOCUMENT | PHOTO | VIDEO | MESSAGE_RECORD | TESTIMONY_SUMMARY | OTHER" }
      - { name: description, type: string, source: input, description: "Evidence description" }
      - { name: collected_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ACCEPTED | EXCLUDED" }
      - { name: exclusion_reason, type: string, source: input, description: "Required when ruling EXCLUDED; cleared on re-review" }

  - name: EvidencePacket
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: packet_sequence, type: integer, source: system, description: "1-based sequence of packets on this case, in creation order" }
      - { name: investigative_report_summary, type: string, source: input, description: "Investigative report narrative; required before release" }
      - { name: report_attached_at, type: datetime, source: system, description: "Logical-clock time report was attached; null until attached" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED_FOR_REVIEW | REVIEW_CLOSED | FINALIZED | WITHDRAWN | SUPERSEDED" }
      - { name: released_at, type: datetime, source: system, description: "When the packet was released to the parties; null until released" }
      - { name: review_closes_at, type: datetime, source: computed, description: "= released_at + REVIEW_WINDOW_DAYS(10 days); null until released" }
      - { name: complainant_responded_at, type: datetime, source: system, description: "Complainant evidence-review response time; null until submitted" }
      - { name: respondent_responded_at, type: datetime, source: system, description: "Respondent evidence-review response time; null until submitted" }
      - { name: pinned_item_ids, type: array, source: computed, description: "Snapshot list of EvidenceItem ids with status ACCEPTED at release time; immutable once released" }

  - name: Notice
    parent: Case
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: notice_type, type: enum, source: input, description: "ALLEGATIONS | INTERVIEW | EVIDENCE_RELEASE | HEARING | DETERMINATION | DISMISSAL | APPEAL_FILED | APPEAL_OUTCOME | INFORMAL_PROPOSAL" }
      - { name: recipient_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT | BOTH" }
      - { name: body, type: string, source: input, description: "Notice content" }
      - { name: scheduled_event_at, type: datetime, source: input, description: "Required for INTERVIEW and HEARING notices; the event being noticed" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock send timestamp" }
      - { name: lead_time_sufficient, type: boolean, source: computed, description: "For INTERVIEW/HEARING notices: scheduled_event_at - sent_at >= required lead days (5 interview / 10 hearing); true for other types" }

  - name: AdvisorAppointment
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: party_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT; which party this advisor serves" }
      - { name: advisor_id, type: string, source: input, description: "FK -> PartyProfile.id; the advisor" }
      - { name: source, type: enum, source: system, description: "PARTY_SELECTED | UNIVERSITY_APPOINTED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN | REPLACED" }
      - { name: replaced_by_appointment_id, type: string, source: system, description: "FK -> AdvisorAppointment.id; set when replaced; null otherwise" }

  - name: Hearing
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: decision_maker_id, type: string, source: input, description: "FK -> PartyProfile.id; hearing decision-maker (segregation-checked)" }
      - { name: scheduled_at, type: datetime, source: input, description: "Hearing start" }
      - { name: estimated_duration_minutes, type: integer, source: input, description: "Positive integer; occupancy interval is [scheduled_at, scheduled_at + estimated_duration_minutes)" }
      - { name: modality, type: enum, source: input, description: "IN_PERSON | VIRTUAL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_SESSION | ADJOURNED | DELIBERATION | COMPLETED | CANCELLED" }
      - { name: adjourn_reason, type: string, source: input, description: "Required on adjourn; cleared on reconvene" }
      - { name: convened_at, type: datetime, source: system, description: "Logical-clock time the hearing was convened; null until then" }

  - name: CrossExamQuestion
    parent: Hearing
    common_fields: true
    fields:
      - { name: hearing_id, type: string, source: system, description: "FK -> Hearing.id; owning hearing (path-bound)" }
      - { name: sequence, type: integer, source: system, description: "1-based submission order within the hearing" }
      - { name: asked_by_advisor_id, type: string, source: input, description: "FK -> PartyProfile.id; the asking advisor (must hold ACTIVE AdvisorAppointment on the hearing's case)" }
      - { name: target_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT; party being cross-examined; must be the opposing side of the asker's appointment" }
      - { name: question_text, type: string, source: input, description: "The question" }
      - { name: ruling, type: enum, source: system, description: "PENDING | ALLOWED | DISALLOWED" }
      - { name: ruling_reason, type: string, source: input, description: "Required when ruling DISALLOWED (relevance exclusion); null otherwise" }

  - name: Determination
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: issued_by_id, type: string, source: system, description: "FK -> PartyProfile.id; the decision-maker who issued (taken from the completed hearing)" }
      - { name: responsibility_finding, type: enum, source: input, description: "RESPONSIBLE | NOT_RESPONSIBLE | INSUFFICIENT_EVIDENCE" }
      - { name: standard_of_evidence, type: enum, source: input, description: "PREPONDERANCE | CLEAR_AND_CONVINCING; must equal case.standard_of_evidence" }
      - { name: rationale, type: string, source: input, description: "Written rationale" }
      - { name: aggravating_factor_count, type: integer, source: input, default: 0, description: "Number of aggravating factors found (>= 0)" }
      - { name: mitigating_factor_count, type: integer, source: input, default: 0, description: "Number of mitigating factors found (>= 0)" }
      - { name: prior_responsible_findings, type: integer, source: input, default: 0, description: "Respondent's prior responsible findings attested at draft time (>= 0)" }
      - { name: provisional_severity_score, type: integer, source: computed, description: "calc_sanction_severity_score provisional variant (mitigating excluded); computed at draft creation" }
      - { name: final_severity_score, type: integer, source: computed, description: "calc_sanction_severity_score final variant (mitigating included); computed at issue; null until issued" }
      - { name: final_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | TIER_4; band of total_points including restitution points; null until issued" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | FINAL | REVERSED | SUPERSEDED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock issue time; null until issued" }
      - { name: appeal_deadline, type: datetime, source: computed, description: "= issued_at + APPEAL_WINDOW_DAYS(5 days); filings at exactly this instant are timely (inclusive); null until issued" }

  - name: Sanction
    parent: Determination
    common_fields: true
    fields:
      - { name: determination_id, type: string, source: system, description: "FK -> Determination.id; owning determination (path-bound at creation)" }
      - { name: sanction_type, type: enum, source: input, description: "WARNING | PROBATION | SUSPENSION | EXPULSION | EDUCATIONAL_PROGRAM | NO_CONTACT_CONTINUATION | RESTITUTION" }
      - { name: duration_days, type: integer, source: input, description: "Required for PROBATION | SUSPENSION | EDUCATIONAL_PROGRAM | NO_CONTACT_CONTINUATION; must be within the final-tier duration bounds; forbidden for WARNING | EXPULSION | RESTITUTION" }
      - { name: restitution_items, type: array, source: input, description: "Required when sanction_type == RESTITUTION: non-empty array of { description: string, amount_dollars: number }; forbidden otherwise" }
      - { name: applied_restitution_cents, type: integer, source: computed, description: "calc_restitution_amount output after per-item rounding and provisional-tier cap; 0 for non-RESTITUTION sanctions" }
      - { name: effective_from, type: datetime, source: system, description: "= determination.issued_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | STAYED | LIFTED_ON_APPEAL" }

  - name: Appeal
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: filed_by_side, type: enum, source: input, description: "COMPLAINANT | RESPONDENT" }
      - { name: filed_by_id, type: string, source: system, description: "FK -> PartyProfile.id; taken from the acting party's identity" }
      - { name: appeal_target, type: enum, source: input, description: "DETERMINATION | DISMISSAL" }
      - { name: grounds, type: array, source: input, description: "Non-empty subset of PROCEDURAL_IRREGULARITY | NEW_EVIDENCE | CONFLICT_OF_INTEREST | DISPROPORTIONATE_SANCTION" }
      - { name: statement, type: string, source: input, description: "Supporting statement" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock filing time; must be <= target deadline (inclusive)" }
      - { name: appeal_officer_id, type: string, source: input, description: "FK -> PartyProfile.id; assigned at begin-review (segregation-checked)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | AFFIRMED | REVERSED | REMANDED | SANCTION_MODIFIED | REINSTATED" }
      - { name: remand_scope, type: enum, source: input, description: "Required when outcome REMANDED: INVESTIGATION | HEARING_PREPARATION; must be INVESTIGATION when grounds includes NEW_EVIDENCE, HEARING_PREPARATION when grounds is only PROCEDURAL_IRREGULARITY/CONFLICT_OF_INTEREST" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock decision time; null until decided" }

  - name: InformalResolution
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: facilitator_id, type: string, source: input, description: "FK -> PartyProfile.id; neutral facilitator (segregation-checked)" }
      - { name: complainant_consent_at, type: datetime, source: system, description: "Complainant voluntary written consent time; null until given" }
      - { name: respondent_consent_at, type: datetime, source: system, description: "Respondent voluntary written consent time; null until given" }
      - { name: agreed_terms, type: string, source: input, description: "Required at resolve; the agreed resolution terms" }
      - { name: status, type: enum, source: system, description: "PROPOSED | IN_PROGRESS | RESOLVED | WITHDRAWN | TERMINATED" }
      - { name: withdrawn_by_side, type: enum, source: system, description: "COMPLAINANT | RESPONDENT; set on withdrawal; null otherwise" }

  - name: CaseEvent
    parent: Case
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case (path-bound)" }
      - { name: event_type, type: enum, source: system, description: "REPORT_RECEIVED | JURISDICTION_REVIEW_STARTED | JURISDICTION_CONFIRMED | FORMAL_COMPLAINT_FILED | CASE_DISMISSED | CASE_REFERRED | MEASURE_CREATED | MEASURE_TERMINATED | MEASURE_EXPIRED | DIRECTIVE_CREATED | DIRECTIVE_SUPERSEDED | DIRECTIVE_LIFTED | DIRECTIVE_EXPIRED | VIOLATION_REPORTED | VIOLATION_SUBSTANTIATED | VIOLATION_UNSUBSTANTIATED | INVESTIGATOR_PROPOSED | INVESTIGATOR_ACCEPTED | INVESTIGATOR_DECLINED | INVESTIGATOR_RECUSED | EVIDENCE_SUBMITTED | EVIDENCE_REVIEW_STARTED | EVIDENCE_RULED | PACKET_CREATED | REPORT_ATTACHED | PACKET_RELEASED | REVIEW_RESPONSE_RECORDED | PACKET_REVIEW_CLOSED | PACKET_FINALIZED | PACKET_WITHDRAWN | PACKET_SUPERSEDED | NOTICE_SENT | ADVISOR_APPOINTED | ADVISOR_WITHDRAWN | ADVISOR_REPLACED | HEARING_SCHEDULED | HEARING_CONVENED | HEARING_ADJOURNED | HEARING_RECONVENED | HEARING_CANCELLED | QUESTION_ASKED | QUESTION_RULED | CROSS_EXAM_CLOSED | DETERMINATION_DRAFTED | DETERMINATION_ISSUED | DETERMINATION_FINALIZED | SANCTION_COMPLETED | APPEAL_FILED | APPEAL_REVIEW_STARTED | APPEAL_DECIDED | CASE_RESUMED | INFORMAL_PROPOSED | INFORMAL_CONSENT_RECORDED | INFORMAL_WITHDRAWN | INFORMAL_TERMINATED | INFORMAL_RESOLVED | CASE_CLOSED" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor (or 'system')" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor (or 'system')" }
      - { name: details, type: object, source: system, description: "Event payload: changed fields and values" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp of the event" }

  - name: AnnualStatistic
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Calendar year (2000..2100); unique across AnnualStatistic" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | AMENDED" }
      - { name: snapshot_counts, type: object, source: computed, description: "Frozen calc_annual_statistics output at publish time: { reports_received, formal_complaints_filed, dismissed, referred, hearings_completed, informal_resolved, determinations_responsible, per_category: {<CATEGORY>: n}, avg_resolution_days }" }
      - { name: amended_counts, type: object, source: computed, description: "Recomputed calc_annual_statistics output at last amendment; null until amended" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock publish time" }
      - { name: amended_at, type: datetime, source: system, description: "Logical-clock time of last amendment; null until amended" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: RECEIVED
    terminal_states: [CLOSED, REFERRED_TO_CONDUCT, RESOLVED_INFORMAL]
    transitions:
      - from: RECEIVED
        to: JURISDICTION_REVIEW
        trigger: "POST /api/cases/{id}/begin-jurisdiction-review"
        actor: TitleIXCoordinator
        preconditions: ["actor identity (X-User-ID) equals case.coordinator_id"]
        side_effects: ["append CaseEvent JURISDICTION_REVIEW_STARTED", "increment Case.version by 1"]
      - from: JURISDICTION_REVIEW
        to: AWAITING_FORMAL_COMPLAINT
        trigger: "POST /api/cases/{id}/confirm-jurisdiction"
        actor: TitleIXCoordinator
        preconditions:
          - "occurred_in_program_activity == true AND occurred_in_united_states == true"
          - "categories contains at least one of SEXUAL_HARASSMENT, SEXUAL_ASSAULT, DATING_VIOLENCE, DOMESTIC_VIOLENCE, STALKING, OTHER_SEX_BASED (NON_TITLE_IX_MISCONDUCT-only reports can never be confirmed)"
        side_effects: ["append CaseEvent JURISDICTION_CONFIRMED", "increment Case.version by 1"]
      - from: JURISDICTION_REVIEW
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: TitleIXCoordinator
        preconditions: ["payload.refer_to_conduct == false"]
        side_effects: ["set dismissal_reason + closed_at = now", "append Notice DISMISSAL to BOTH parties", "append CaseEvent CASE_DISMISSED", "increment Case.version by 1"]
      - from: JURISDICTION_REVIEW
        to: REFERRED_TO_CONDUCT
        trigger: "POST /api/cases/{id}/dismiss"
        actor: TitleIXCoordinator
        preconditions: ["payload.refer_to_conduct == true"]
        side_effects: ["set dismissal_reason + closed_at = now", "append Notice DISMISSAL to BOTH parties", "append CaseEvent CASE_REFERRED", "increment Case.version by 1"]
      - from: AWAITING_FORMAL_COMPLAINT
        to: INVESTIGATION
        trigger: "POST /api/cases/{id}/file-formal-complaint"
        actor: Party
        preconditions: ["actor identity equals case.complainant_id (only the complainant may file)"]
        side_effects:
          - "set formal_complaint_signed = true, formal_complaint_filed_at = now"
          - "append Notice ALLEGATIONS to BOTH parties (auto-generated; prerequisite for any INTERVIEW notice)"
          - "append CaseEvent FORMAL_COMPLAINT_FILED"
          - "increment Case.version by 1"
      - from: AWAITING_FORMAL_COMPLAINT
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: TitleIXCoordinator
        preconditions: ["payload.refer_to_conduct == false"]
        side_effects: ["set dismissal_reason + closed_at = now", "append Notice DISMISSAL to BOTH parties", "append CaseEvent CASE_DISMISSED", "increment Case.version by 1"]
      - from: INVESTIGATION
        to: EVIDENCE_REVIEW
        trigger: "POST /api/evidence-packets/{packetId}/release (on this case's DRAFT packet)"
        actor: Investigator
        preconditions: ["see EvidencePacket release preconditions"]
        side_effects: ["see EvidencePacket release side effects", "increment Case.version by 1"]
      - from: EVIDENCE_REVIEW
        to: HEARING_PREPARATION
        trigger: "POST /api/evidence-packets/{packetId}/finalize"
        actor: Investigator
        preconditions: ["see EvidencePacket finalize preconditions"]
        side_effects: ["see EvidencePacket finalize side effects", "increment Case.version by 1"]
      - from: HEARING_PREPARATION
        to: HEARING_IN_PROGRESS
        trigger: "POST /api/hearings/{hearingId}/convene"
        actor: DecisionMaker
        preconditions: ["see Hearing convene preconditions"]
        side_effects: ["see Hearing convene side effects", "increment Case.version by 1"]
      - from: HEARING_IN_PROGRESS
        to: DELIBERATION
        trigger: "POST /api/hearings/{hearingId}/close-cross-exam"
        actor: DecisionMaker
        preconditions: ["zero CrossExamQuestion rows on this hearing with ruling == PENDING"]
        side_effects: ["append CaseEvent CROSS_EXAM_CLOSED", "increment Case.version by 1"]
      - from: DELIBERATION
        to: DETERMINATION_ISSUED
        trigger: "POST /api/determinations/{determinationId}/issue"
        actor: DecisionMaker
        preconditions: ["see Determination issue preconditions"]
        side_effects: ["see Determination issue side effects", "increment Case.version by 1"]
      - from: DETERMINATION_ISSUED
        to: APPEAL_REVIEW
        trigger: "POST /api/cases/{id}/appeals (appeal_target == DETERMINATION)"
        actor: Party
        preconditions: ["see Appeal create preconditions"]
        side_effects: ["append CaseEvent APPEAL_FILED", "increment Case.version by 1"]
      - from: DETERMINATION_ISSUED
        to: CLOSED
        trigger: "POST /api/cases/{id}/finalize-closure"
        actor: TitleIXCoordinator
        preconditions:
          - "logical clock strictly greater than determination.appeal_deadline of the case's ISSUED determination (the full appeal window must have elapsed)"
          - "no Appeal on this case with status IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "ISSUED determination -> FINAL (append CaseEvent DETERMINATION_FINALIZED)"
          - "set closed_at = now; append CaseEvent CASE_CLOSED"
          - "increment Case.version by 1"
      - from: APPEAL_REVIEW
        to: CLOSED
        trigger: "POST /api/appeals/{appealId}/decide with outcome AFFIRMED | REVERSED | SANCTION_MODIFIED (or dismissal-appeal outcome AFFIRMED)"
        actor: AppealOfficer
        preconditions: ["see Appeal decide preconditions"]
        side_effects: ["see Appeal decide side effects", "set closed_at = now", "append CaseEvent CASE_CLOSED", "increment Case.version by 1"]
      - from: APPEAL_REVIEW
        to: REMANDED
        trigger: "POST /api/appeals/{appealId}/decide with outcome REMANDED"
        actor: AppealOfficer
        preconditions: ["see Appeal decide preconditions"]
        side_effects: ["set remand_target = appeal.remand_scope", "see Appeal decide side effects", "increment Case.version by 1"]
      - from: REMANDED
        to: INVESTIGATION
        trigger: "POST /api/cases/{id}/resume"
        actor: TitleIXCoordinator
        preconditions: ["case.remand_target == INVESTIGATION"]
        side_effects:
          - "the case's most recent EvidencePacket with status FINALIZED -> SUPERSEDED (append CaseEvent PACKET_SUPERSEDED)"
          - "that packet's pinned EvidenceItems with status ACCEPTED -> UNDER_REVIEW (append EVIDENCE_REVIEW_STARTED per item)"
          - "append CaseEvent CASE_RESUMED"
          - "increment Case.version by 1"
      - from: REMANDED
        to: HEARING_PREPARATION
        trigger: "POST /api/cases/{id}/resume"
        actor: TitleIXCoordinator
        preconditions: ["case.remand_target == HEARING_PREPARATION"]
        side_effects: ["append CaseEvent CASE_RESUMED", "increment Case.version by 1"]
      - from: INVESTIGATION
        to: INFORMAL_RESOLUTION_IN_PROGRESS
        trigger: "POST /api/cases/{id}/informal-resolutions"
        actor: TitleIXCoordinator
        preconditions: ["see InformalResolution propose preconditions"]
        side_effects: ["append CaseEvent INFORMAL_PROPOSED", "increment Case.version by 1"]
      - from: EVIDENCE_REVIEW
        to: INFORMAL_RESOLUTION_IN_PROGRESS
        trigger: "POST /api/cases/{id}/informal-resolutions"
        actor: TitleIXCoordinator
        preconditions: ["see InformalResolution propose preconditions"]
        side_effects: ["append CaseEvent INFORMAL_PROPOSED", "increment Case.version by 1"]
      - from: INFORMAL_RESOLUTION_IN_PROGRESS
        to: INVESTIGATION
        trigger: "POST /api/informal-resolutions/{irId}/withdraw or POST /api/informal-resolutions/{irId}/consent with consent == false"
        actor: Party
        preconditions: ["the InformalResolution leaves PROPOSED/IN_PROGRESS"]
        side_effects: ["append CaseEvent CASE_RESUMED", "increment Case.version by 1"]
      - from: INFORMAL_RESOLUTION_IN_PROGRESS
        to: RESOLVED_INFORMAL
        trigger: "POST /api/informal-resolutions/{irId}/resolve"
        actor: TitleIXCoordinator
        preconditions: ["see InformalResolution resolve preconditions"]
        side_effects: ["set closed_at = now", "append CaseEvent CASE_CLOSED", "increment Case.version by 1"]
      - from: INVESTIGATION
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: TitleIXCoordinator
        preconditions: ["payload.refer_to_conduct == false"]
        side_effects: ["any Hearing in {SCHEDULED, ADJOURNED} -> CANCELLED (HEARING_CANCELLED)", "set dismissal_reason + closed_at = now", "Notice DISMISSAL to BOTH", "CaseEvent CASE_DISMISSED", "increment Case.version by 1"]
      - from: EVIDENCE_REVIEW
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: TitleIXCoordinator
        preconditions: ["payload.refer_to_conduct == false"]
        side_effects: ["set dismissal_reason + closed_at = now", "Notice DISMISSAL to BOTH", "CaseEvent CASE_DISMISSED", "increment Case.version by 1"]
      - from: HEARING_PREPARATION
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: TitleIXCoordinator
        preconditions: ["payload.refer_to_conduct == false"]
        side_effects: ["any Hearing in {SCHEDULED, ADJOURNED} -> CANCELLED (HEARING_CANCELLED)", "set dismissal_reason + closed_at = now", "Notice DISMISSAL to BOTH", "CaseEvent CASE_DISMISSED", "increment Case.version by 1"]
      - from: INFORMAL_RESOLUTION_IN_PROGRESS
        to: DISMISSED
        trigger: "POST /api/cases/{id}/dismiss"
        actor: TitleIXCoordinator
        preconditions: ["payload.refer_to_conduct == false"]
        side_effects: ["PROPOSED/IN_PROGRESS InformalResolution -> TERMINATED (CaseEvent INFORMAL_TERMINATED)", "set dismissal_reason + closed_at = now", "Notice DISMISSAL to BOTH", "CaseEvent CASE_DISMISSED", "increment Case.version by 1"]
      - from: DISMISSED
        to: AWAITING_FORMAL_COMPLAINT
        trigger: "POST /api/appeals/{appealId}/decide with outcome REINSTATED (appeal_target == DISMISSAL)"
        actor: AppealOfficer
        preconditions: ["see Appeal decide preconditions"]
        side_effects: ["clear dismissal_reason and closed_at", "append CaseEvent CASE_RESUMED", "increment Case.version by 1"]
    note: "Three cycles exist: (a) REMANDED -> INVESTIGATION/HEARING_PREPARATION -> ... -> APPEAL_REVIEW -> REMANDED; (b) INVESTIGATION/EVIDENCE_REVIEW -> INFORMAL_RESOLUTION_IN_PROGRESS -> INVESTIGATION on withdrawal; (c) DISMISSED -> AWAITING_FORMAL_COMPLAINT on reinstatement."

  - entity: SupportiveMeasure
    initial_state: ACTIVE
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/supportive-measures/{id}/terminate"
        actor: TitleIXCoordinator
        preconditions: []
        side_effects: ["recompute case.active_supportive_measure_count (-1)", "append CaseEvent MEASURE_TERMINATED", "increment Case.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/cases/{id}/reconcile when logical clock >= measure.effective_to (and effective_to non-null)"
        actor: system
        preconditions: ["effective_to IS NOT NULL", "clock >= effective_to"]
        side_effects: ["recompute case.active_supportive_measure_count (-1)", "append CaseEvent MEASURE_EXPIRED", "increment Case.version by 1"]

  - entity: NoContactDirective
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, LIFTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /api/cases/{id}/no-contact-directives with supersede_existing == true overlapping this directive's scope/window"
        actor: TitleIXCoordinator
        preconditions: ["new directive's window overlaps this directive's window on a shared party scope"]
        side_effects:
          - "set this directive's effective_to = new directive's effective_from, superseded_by_directive_id = new directive id"
          - "append CaseEvent DIRECTIVE_SUPERSEDED"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /api/no-contact-directives/{id}/lift"
        actor: TitleIXCoordinator
        preconditions: []
        side_effects: ["recompute case exposure score (ACTIVE_DIRECTIVE_POINTS removed)", "append CaseEvent DIRECTIVE_LIFTED", "increment Case.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/cases/{id}/reconcile when logical clock >= directive.effective_to (and effective_to non-null)"
        actor: system
        preconditions: ["effective_to IS NOT NULL", "clock >= effective_to"]
        side_effects: ["recompute case exposure score", "append CaseEvent DIRECTIVE_EXPIRED", "increment Case.version by 1"]

  - entity: DirectiveViolation
    initial_state: PENDING
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: PENDING
        to: SUBSTANTIATED
        trigger: "POST /api/directive-violations/{id}/substantiate"
        actor: TitleIXCoordinator
        preconditions: ["parent directive exists (any status); case not terminal"]
        side_effects:
          - "set substantiated_at = now"
          - "directive.substantiated_violation_count += 1"
          - "recompute calc_case_exposure_score on the owning case; if score crosses to >= INTERIM_SUSPENSION_THRESHOLD (70) set case.interim_suspension_eligible = true"
          - "append CaseEvent VIOLATION_SUBSTANTIATED"
          - "increment Case.version by 1"
      - from: PENDING
        to: UNSUBSTANTIATED
        trigger: "POST /api/directive-violations/{id}/mark-unsubstantiated"
        actor: TitleIXCoordinator
        preconditions: ["case not terminal"]
        side_effects: ["append CaseEvent VIOLATION_UNSUBSTANTIATED", "increment Case.version by 1"]

  - entity: InvestigatorAssignment
    initial_state: PROPOSED
    terminal_states: [DECLINED, RECUSED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /api/investigator-assignments/{id}/accept"
        actor: Investigator
        preconditions:
          - "actor identity equals assignment.investigator_id"
          - "segregation re-check at accept time: investigator_id differs from case coordinator_id, every other assignment's investigator_id with status IN {PROPOSED, ACTIVE, COMPLETED}, every hearing decision_maker_id, every appeal officer, every informal facilitator on this case, and is neither complainant nor respondent"
          - "no other InvestigatorAssignment on this case with status == ACTIVE"
        side_effects: ["append CaseEvent INVESTIGATOR_ACCEPTED", "increment Case.version by 1"]
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /api/investigator-assignments/{id}/decline"
        actor: Investigator
        preconditions: ["actor identity equals assignment.investigator_id"]
        side_effects: ["append CaseEvent INVESTIGATOR_DECLINED", "increment Case.version by 1"]
      - from: ACTIVE
        to: RECUSED
        trigger: "POST /api/investigator-assignments/{id}/recuse"
        actor: Investigator | TitleIXCoordinator
        preconditions: ["payload.recusal_reason non-empty", "actor is the assigned investigator or the case coordinator"]
        side_effects:
          - "set recusal_reason"
          - "case no longer has an ACTIVE investigator: evidence review/release/finalize endpoints on this case now fail ERR_NO_ACTIVE_INVESTIGATOR until a replacement accepts"
          - "append CaseEvent INVESTIGATOR_RECUSED"
          - "increment Case.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/evidence-packets/{packetId}/finalize on this case"
        actor: system
        preconditions: ["packet finalize succeeds"]
        side_effects: ["append CaseEvent (via packet finalize)", "increment Case.version by 1"]
    note: "Recusal + replacement forms a case-level cycle: PROPOSED -> ACTIVE -> RECUSED, then a NEW assignment PROPOSED -> ACTIVE. The same person may NOT be re-proposed after a recusal for bias on the same case (segregation validation ERR_SEGREGATION_OF_DUTIES on create)."

  - entity: EvidenceItem
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/evidence-items/{id}/begin-review"
        actor: Investigator
        preconditions: ["case has an ACTIVE InvestigatorAssignment whose investigator is the actor", "case status IN {INVESTIGATION, EVIDENCE_REVIEW}"]
        side_effects: ["append CaseEvent EVIDENCE_REVIEW_STARTED"]
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /api/evidence-items/{id}/rule-relevance with ruling == ACCEPTED"
        actor: Investigator
        preconditions: ["actor is the case's ACTIVE investigator"]
        side_effects: ["clear exclusion_reason", "append CaseEvent EVIDENCE_RULED", "if case has a DRAFT EvidencePacket and item is ACCEPTED, it becomes eligible for pinned_item_ids at release"]
      - from: UNDER_REVIEW
        to: EXCLUDED
        trigger: "POST /api/evidence-items/{id}/rule-relevance with ruling == EXCLUDED"
        actor: Investigator
        preconditions: ["actor is the case's ACTIVE investigator", "payload.exclusion_reason non-empty"]
        side_effects: ["set exclusion_reason", "append CaseEvent EVIDENCE_RULED"]
      - from: EXCLUDED
        to: UNDER_REVIEW
        trigger: "POST /api/evidence-items/{id}/begin-review (reconsideration)"
        actor: Investigator
        preconditions: ["actor is the case's ACTIVE investigator", "case status IN {INVESTIGATION, EVIDENCE_REVIEW}"]
        side_effects: ["append CaseEvent EVIDENCE_REVIEW_STARTED"]
      - from: ACCEPTED
        to: UNDER_REVIEW
        trigger: "cascade: owning packet -> SUPERSEDED (remand resume to INVESTIGATION or new packet supersession)"
        actor: system
        preconditions: ["item was pinned in the superseded packet"]
        side_effects: ["append CaseEvent EVIDENCE_REVIEW_STARTED"]
    note: "Cyclic: EXCLUDED -> UNDER_REVIEW -> EXCLUDED/ACCEPTED reconsideration loops; ACCEPTED -> UNDER_REVIEW on packet supersession. No terminal states by design."

  - entity: EvidencePacket
    initial_state: DRAFT
    terminal_states: [FINALIZED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: RELEASED_FOR_REVIEW
        trigger: "POST /api/evidence-packets/{id}/release"
        actor: Investigator
        preconditions:
          - "actor is the case's ACTIVE investigator"
          - "investigative_report_summary attached (report_attached_at non-null)"
          - "case status == INVESTIGATION"
        side_effects:
          - "set released_at = now; review_closes_at = released_at + 10 days (REVIEW_WINDOW_DAYS)"
          - "pinned_item_ids = [ids of EvidenceItems on this case with status == ACCEPTED, ordered by collected_at ASC then created_at ASC]"
          - "append Notice EVIDENCE_RELEASE to BOTH parties"
          - "case -> EVIDENCE_REVIEW"
          - "append CaseEvent PACKET_RELEASED"
          - "increment Case.version by 1"
          - "note: zero ACCEPTED items is legal; pinned_item_ids may be the empty list"
      - from: RELEASED_FOR_REVIEW
        to: REVIEW_CLOSED
        trigger: "system: when the second party review-response is recorded, or POST /api/cases/{id}/reconcile when clock >= review_closes_at"
        actor: system
        preconditions: ["(complainant_responded_at non-null AND respondent_responded_at non-null) OR clock >= review_closes_at"]
        side_effects: ["append CaseEvent PACKET_REVIEW_CLOSED"]
      - from: REVIEW_CLOSED
        to: FINALIZED
        trigger: "POST /api/evidence-packets/{id}/finalize"
        actor: Investigator
        preconditions: ["actor is the case's ACTIVE investigator", "report_attached_at non-null"]
        side_effects:
          - "case -> HEARING_PREPARATION"
          - "the case's ACTIVE InvestigatorAssignment -> COMPLETED"
          - "append CaseEvent PACKET_FINALIZED"
          - "increment Case.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/evidence-packets/{id}/withdraw"
        actor: Investigator
        preconditions: ["actor is the case's ACTIVE investigator"]
        side_effects: ["append CaseEvent PACKET_WITHDRAWN"]
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "POST /api/cases/{id}/evidence-packets (new packet supersedes the FINALIZED one) OR case resume to INVESTIGATION after remand"
        actor: Investigator | system
        preconditions: ["new packet creation succeeds / remand resume succeeds"]
        side_effects: ["pinned ACCEPTED items -> UNDER_REVIEW", "append CaseEvent PACKET_SUPERSEDED"]

  - entity: AdvisorAppointment
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, REPLACED]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/advisor-appointments/{id}/withdraw"
        actor: Advisor | Party | TitleIXCoordinator
        preconditions: ["actor is the appointed advisor, the served party, or the case coordinator"]
        side_effects: ["append CaseEvent ADVISOR_WITHDRAWN", "increment Case.version by 1"]
      - from: ACTIVE
        to: REPLACED
        trigger: "creation of a new ACTIVE AdvisorAppointment for the same (case_id, party_side)"
        actor: system
        preconditions: ["new appointment creation succeeds"]
        side_effects: ["set replaced_by_appointment_id", "append CaseEvent ADVISOR_REPLACED"]

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /api/hearings/{id}/convene"
        actor: DecisionMaker
        preconditions:
          - "actor identity equals hearing.decision_maker_id"
          - "case status == HEARING_PREPARATION"
          - "logical clock >= hearing.scheduled_at"
          - "BOTH parties hold an AdvisorAppointment with status ACTIVE on this case (ERR_ADVISOR_REQUIRED otherwise)"
        side_effects: ["set convened_at = now", "case -> HEARING_IN_PROGRESS", "append CaseEvent HEARING_CONVENED", "increment Case.version by 1"]
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /api/hearings/{id}/adjourn"
        actor: DecisionMaker
        preconditions: ["payload.adjourn_reason non-empty"]
        side_effects: ["set adjourn_reason", "append CaseEvent HEARING_ADJOURNED"]
      - from: ADJOURNED
        to: IN_SESSION
        trigger: "POST /api/hearings/{id}/reconvene"
        actor: DecisionMaker
        preconditions: []
        side_effects: ["clear adjourn_reason", "append CaseEvent HEARING_RECONVENED"]
      - from: IN_SESSION
        to: DELIBERATION
        trigger: "POST /api/hearings/{id}/close-cross-exam"
        actor: DecisionMaker
        preconditions: ["zero CrossExamQuestion rows on this hearing with ruling == PENDING (ERR_PENDING_QUESTIONS_REMAIN otherwise)"]
        side_effects: ["case -> DELIBERATION", "append CaseEvent CROSS_EXAM_CLOSED", "increment Case.version by 1"]
      - from: DELIBERATION
        to: COMPLETED
        trigger: "POST /api/determinations/{id}/issue on this case"
        actor: system
        preconditions: ["determination issue succeeds"]
        side_effects: ["append CaseEvent (via determination issue)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/hearings/{id}/cancel, or cascade: case dismissal"
        actor: DecisionMaker | TitleIXCoordinator | system
        preconditions: []
        side_effects: ["append CaseEvent HEARING_CANCELLED"]
      - from: ADJOURNED
        to: CANCELLED
        trigger: "cascade: case dismissal"
        actor: system
        preconditions: []
        side_effects: ["append CaseEvent HEARING_CANCELLED"]
    note: "Cyclic via IN_SESSION -> ADJOURNED -> IN_SESSION; a hearing may adjourn/reconvene any number of times while PENDING questions accumulate and get ruled."

  - entity: CrossExamQuestion
    initial_state: PENDING
    terminal_states: [ALLOWED, DISALLOWED]
    transitions:
      - from: PENDING
        to: ALLOWED
        trigger: "POST /api/cross-exam-questions/{id}/rule with ruling == ALLOWED"
        actor: DecisionMaker
        preconditions: ["actor identity equals the hearing's decision_maker_id", "hearing status == IN_SESSION"]
        side_effects: ["append CaseEvent QUESTION_RULED"]
      - from: PENDING
        to: DISALLOWED
        trigger: "POST /api/cross-exam-questions/{id}/rule with ruling == DISALLOWED"
        actor: DecisionMaker
        preconditions: ["actor identity equals the hearing's decision_maker_id", "hearing status == IN_SESSION", "payload.ruling_reason non-empty (relevance exclusion must be explained on the record)"]
        side_effects: ["set ruling_reason", "append CaseEvent QUESTION_RULED"]

  - entity: Determination
    initial_state: DRAFT
    terminal_states: [FINAL, REVERSED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/determinations/{id}/issue"
        actor: DecisionMaker
        preconditions:
          - "actor identity equals the completed hearing's decision_maker_id"
          - "case status == DELIBERATION"
          - "payload.standard_of_evidence == case.standard_of_evidence (ERR_STANDARD_OF_EVIDENCE_MISMATCH otherwise)"
          - "payload.sanction_selections conform to the final-tier matrix bounds (ERR_SANCTION_OUTSIDE_MATRIX otherwise); if responsibility_finding != RESPONSIBLE, sanction_selections must be empty"
        side_effects:
          - "compute final_severity_score (final variant incl. mitigating), restitution amounts, final_tier per calc_sanction_severity_score + calc_restitution_amount pinned order"
          - "create Sanction rows (status ACTIVE, effective_from = issued_at)"
          - "set issued_at = now; appeal_deadline = issued_at + 5 days"
          - "case -> DETERMINATION_ISSUED; hearing -> COMPLETED"
          - "append Notice DETERMINATION to BOTH parties"
          - "append CaseEvent DETERMINATION_ISSUED"
          - "increment Case.version by 1"
      - from: ISSUED
        to: FINAL
        trigger: "POST /api/cases/{id}/finalize-closure (window elapsed) OR appeal decide AFFIRMED | SANCTION_MODIFIED"
        actor: TitleIXCoordinator | AppealOfficer
        preconditions: ["see triggering endpoint"]
        side_effects: ["append CaseEvent DETERMINATION_FINALIZED"]
      - from: ISSUED
        to: REVERSED
        trigger: "appeal decide REVERSED"
        actor: AppealOfficer
        preconditions: []
        side_effects: ["this determination's ACTIVE Sanctions -> LIFTED_ON_APPEAL (compensation; no double-counted discipline)", "append CaseEvent APPEAL_DECIDED"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "appeal decide REMANDED"
        actor: AppealOfficer
        preconditions: []
        side_effects: ["this determination's ACTIVE Sanctions -> STAYED", "append CaseEvent APPEAL_DECIDED"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /api/cases/{id}/determinations (a new DRAFT supersedes any existing DRAFT on the case)"
        actor: DecisionMaker
        preconditions: ["new draft creation succeeds"]
        side_effects: ["append CaseEvent DETERMINATION_DRAFTED (on new draft)"]

  - entity: Sanction
    initial_state: ACTIVE
    terminal_states: [COMPLETED, STAYED, LIFTED_ON_APPEAL]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/cases/{id}/reconcile when duration_days non-null and clock >= effective_from + duration_days; or POST /api/sanctions/{id}/mark-complete for duration-less types (WARNING, EXPULSION, RESTITUTION)"
        actor: system | TitleIXCoordinator
        preconditions: ["for reconcile path: duration_days non-null and clock >= effective_from + duration_days", "for mark-complete: sanction_type IN {WARNING, EXPULSION, RESTITUTION}"]
        side_effects: ["append CaseEvent SANCTION_COMPLETED", "increment Case.version by 1"]
      - from: ACTIVE
        to: STAYED
        trigger: "cascade: appeal decide REMANDED on the owning determination"
        actor: system
        preconditions: []
        side_effects: ["append CaseEvent APPEAL_DECIDED (on case log)"]
      - from: ACTIVE
        to: LIFTED_ON_APPEAL
        trigger: "cascade: appeal decide REVERSED or SANCTION_MODIFIED on the owning determination"
        actor: system
        preconditions: []
        side_effects: ["for SANCTION_MODIFIED: replacement Sanction rows are created ACTIVE under the same determination per modified_sanction_selections (validated against final-tier matrix)"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [AFFIRMED, REVERSED, REMANDED, SANCTION_MODIFIED, REINSTATED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/appeals/{id}/begin-review"
        actor: TitleIXCoordinator
        preconditions:
          - "payload.appeal_officer_id passes segregation: differs from case coordinator_id, ACTIVE/COMPLETED investigator, hearing decision_maker_id, facilitator, and both parties (ERR_SEGREGATION_OF_DUTIES / ERR_OFFICIAL_IS_CASE_PARTY)"
        side_effects: ["append Notice APPEAL_FILED to the NON-filing party", "append CaseEvent APPEAL_REVIEW_STARTED", "increment Case.version by 1"]
      - from: UNDER_REVIEW
        to: AFFIRMED
        trigger: "POST /api/appeals/{id}/decide with outcome == AFFIRMED"
        actor: AppealOfficer
        preconditions: ["actor identity equals appeal.appeal_officer_id", "outcome compatible with appeal_target (AFFIRMED allowed for both targets)"]
        side_effects: ["if appeal_target == DETERMINATION: determination -> FINAL", "case -> CLOSED (closed_at = now)", "Notice APPEAL_OUTCOME to BOTH", "CaseEvent APPEAL_DECIDED + CASE_CLOSED", "increment Case.version by 1"]
      - from: UNDER_REVIEW
        to: REVERSED
        trigger: "POST /api/appeals/{id}/decide with outcome == REVERSED"
        actor: AppealOfficer
        preconditions: ["appeal_target == DETERMINATION (ERR_APPEAL_OUTCOME_INCOMPATIBLE otherwise)"]
        side_effects: ["determination -> REVERSED; its ACTIVE sanctions -> LIFTED_ON_APPEAL", "case -> CLOSED", "Notice APPEAL_OUTCOME to BOTH", "CaseEvent APPEAL_DECIDED + CASE_CLOSED", "increment Case.version by 1"]
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /api/appeals/{id}/decide with outcome == REMANDED"
        actor: AppealOfficer
        preconditions: ["appeal_target == DETERMINATION", "remand_scope present and ground-compatible: INVESTIGATION required when grounds includes NEW_EVIDENCE; HEARING_PREPARATION only when grounds subset of {PROCEDURAL_IRREGULARITY, CONFLICT_OF_INTEREST} (ERR_REMAND_SCOPE_MISMATCH otherwise)"]
        side_effects: ["determination -> SUPERSEDED; its ACTIVE sanctions -> STAYED", "case -> REMANDED with remand_target = remand_scope", "Notice APPEAL_OUTCOME to BOTH", "CaseEvent APPEAL_DECIDED", "increment Case.version by 1"]
      - from: UNDER_REVIEW
        to: SANCTION_MODIFIED
        trigger: "POST /api/appeals/{id}/decide with outcome == SANCTION_MODIFIED"
        actor: AppealOfficer
        preconditions: ["appeal_target == DETERMINATION", "payload.modified_sanction_selections non-empty and each selection within final-tier matrix bounds (ERR_SANCTION_OUTSIDE_MATRIX)"]
        side_effects: ["determination's ACTIVE sanctions -> LIFTED_ON_APPEAL; replacement sanctions created ACTIVE under same determination; determination -> FINAL", "case -> CLOSED", "Notice APPEAL_OUTCOME to BOTH", "CaseEvent APPEAL_DECIDED + CASE_CLOSED", "increment Case.version by 1"]
      - from: UNDER_REVIEW
        to: REINSTATED
        trigger: "POST /api/appeals/{id}/decide with outcome == REINSTATED"
        actor: AppealOfficer
        preconditions: ["appeal_target == DISMISSAL (ERR_APPEAL_OUTCOME_INCOMPATIBLE otherwise)"]
        side_effects: ["case DISMISSED -> AWAITING_FORMAL_COMPLAINT (dismissal_reason and closed_at cleared)", "Notice APPEAL_OUTCOME to BOTH", "CaseEvent APPEAL_DECIDED + CASE_RESUMED", "increment Case.version by 1"]

  - entity: InformalResolution
    initial_state: PROPOSED
    terminal_states: [RESOLVED, WITHDRAWN, TERMINATED]
    transitions:
      - from: PROPOSED
        to: IN_PROGRESS
        trigger: "POST /api/informal-resolutions/{id}/consent (auto-fires when the SECOND party consents)"
        actor: Party
        preconditions: ["both complainant_consent_at and respondent_consent_at now set"]
        side_effects: ["append CaseEvent INFORMAL_CONSENT_RECORDED", "increment Case.version by 1"]
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /api/informal-resolutions/{id}/resolve"
        actor: TitleIXCoordinator
        preconditions: ["actor is case coordinator", "payload.agreed_terms non-empty"]
        side_effects: ["case -> RESOLVED_INFORMAL (terminal; not appealable; appeal creation on such case fails ERR_APPEAL_TARGET_INVALID)", "set agreed_terms", "CaseEvent INFORMAL_RESOLVED + CASE_CLOSED", "increment Case.version by 1"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /api/informal-resolutions/{id}/withdraw"
        actor: Party
        preconditions: ["actor is complainant or respondent on the case"]
        side_effects: ["set withdrawn_by_side", "case -> INVESTIGATION", "CaseEvent INFORMAL_WITHDRAWN + CASE_RESUMED", "increment Case.version by 1"]
      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /api/informal-resolutions/{id}/withdraw"
        actor: Party
        preconditions: ["actor is complainant or respondent on the case"]
        side_effects: ["set withdrawn_by_side", "case -> INVESTIGATION", "CaseEvent INFORMAL_WITHDRAWN + CASE_RESUMED", "increment Case.version by 1"]
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /api/informal-resolutions/{id}/consent with consent == false (decline), or cascade: case dismissal"
        actor: Party | system
        preconditions: []
        side_effects: ["case -> INVESTIGATION (when not caused by dismissal)", "CaseEvent INFORMAL_TERMINATED", "increment Case.version by 1"]

  - entity: AnnualStatistic
    initial_state: PUBLISHED
    terminal_states: []
    transitions:
      - from: PUBLISHED
        to: AMENDED
        trigger: "POST /api/annual-statistics/{year}/amend"
        actor: TitleIXCoordinator
        preconditions: ["year row exists with status PUBLISHED or AMENDED"]
        side_effects: ["amended_counts = live calc_annual_statistics recomputation at amend time; amended_at = now; snapshot_counts remain frozen"]
      - from: AMENDED
        to: AMENDED
        trigger: "POST /api/annual-statistics/{year}/amend (re-amendment self-loop)"
        actor: TitleIXCoordinator
        preconditions: []
        side_effects: ["amended_counts recomputed again; amended_at refreshed; snapshot_counts remain frozen"]

# =============================================================================
# Concurrency Rules (OCC on parent version - true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: packet-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /api/cases/{id}/evidence-packets"
    occ_field: "expected_case_version"
    description: |
      Creating an EvidencePacket against a Case whose version has advanced since the
      client last observed it is rejected. Packet creation legitimately supersedes a
      FINALIZED predecessor packet, so a second create based on a pre-supersede view
      of the case would otherwise double-supersede.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: determination-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /api/cases/{id}/determinations"
    occ_field: "expected_case_version"
    description: |
      Creating a Determination draft against a Case whose version has advanced since
      the client last observed it is rejected. A new determination draft on a REMANDED
      case legitimately supersedes the prior SUPERSEDED determination lineage; a writer
      working from a pre-remand view of the case must restart from the current version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: directive-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /api/cases/{id}/no-contact-directives"
    occ_field: "expected_case_version"
    description: |
      Creating a NoContactDirective with supersede_existing == true against a Case
      whose version has advanced since the client last observed it is rejected. A
      superseding create legitimately truncates the overlapping ACTIVE directive, so a
      writer whose view of the directive set is stale must re-read the case first.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_case_exposure_score
    trigger: "on DirectiveViolation SUBSTANTIATED, on NoContactDirective create/lift/expire (ACTIVE_DIRECTIVE_POINTS membership change), on Case creation"
    algorithm: threshold
    formula: |
      score = CATEGORY_BASE[max-priority category in case.categories per STAT_HIERARCHY_PRIORITY]
            + PRIOR_FINDING_POINTS * count_respondent_priors
            + NCD_VIOLATION_POINTS * rolling_substantiated_count
            + (ACTIVE_DIRECTIVE_POINTS if any directive on this case has status == ACTIVE else 0)
      where rolling_substantiated_count = calc_ncd_violation_rolling_count(now)
      and   count_respondent_priors = count of OTHER cases (case_id != this case) with an ISSUED-or-later
            Determination (status IN {ISSUED, FINAL, SUPERSEDED}) whose responsibility_finding == RESPONSIBLE
            for the same respondent_id; REVERSED determinations excluded.
      interim_suspension_eligible = (score >= INTERIM_SUSPENSION_THRESHOLD)   # 70, INCLUSIVE boundary
    input_set: "the Case, its DirectiveViolation rows with status SUBSTANTIATED, its NoContactDirective rows with status ACTIVE, and the respondent's other cases' Determinations with status IN {ISSUED, FINAL, SUPERSEDED}"
    constants:
      CATEGORY_BASE: { SEXUAL_ASSAULT: 40, DATING_VIOLENCE: 35, DOMESTIC_VIOLENCE: 35, STALKING: 30, SEXUAL_HARASSMENT: 25, OTHER_SEX_BASED: 15, NON_TITLE_IX_MISCONDUCT: 0 }
      PRIOR_FINDING_POINTS: 15
      NCD_VIOLATION_POINTS: 10
      ACTIVE_DIRECTIVE_POINTS: 10
      INTERIM_SUSPENSION_THRESHOLD: 70
    precision: "integer arithmetic; no rounding"
    variants: []

  - name: calc_ncd_violation_rolling_count
    trigger: "evaluated inside calc_case_exposure_score at time `now`"
    algorithm: chronological
    formula: |
      rolling_count = count of DirectiveViolation rows on directives of THIS case
                      with status == SUBSTANTIATED
                      AND substantiated_at IN [now - 365 days, now]   # BOTH bounds INCLUSIVE
      Process in substantiated_at ASC order; ties broken by created_at ASC. (Order affects only audit output, not the count.)
    input_set: "DirectiveViolation rows whose directive_id belongs to a NoContactDirective with this case_id, status SUBSTANTIATED only"
    constants:
      ROLLING_WINDOW_DAYS: 365
    precision: "integer count"
    variants: []

  - name: calc_evidence_review_window
    trigger: "on EvidencePacket release; evaluated again on each review-response submission and on reconcile"
    algorithm: threshold
    formula: |
      review_closes_at = released_at + REVIEW_WINDOW_DAYS
      A review response submitted at logical time t is TIMELY iff t <= review_closes_at   # INCLUSIVE at the exact close instant
      The packet auto-closes (REVIEW_CLOSED) at the EARLIER of:
        (a) the moment both complainant_responded_at and respondent_responded_at are set, or
        (b) reconcile observing clock >= review_closes_at
    input_set: "the released EvidencePacket and its two party response timestamps"
    constants:
      REVIEW_WINDOW_DAYS: 10
    precision: "second precision on timestamps; inclusive comparison"
    variants: []

  - name: calc_appeal_deadline
    trigger: "on Determination issue; checked on Appeal creation"
    algorithm: threshold
    formula: |
      appeal_deadline = issued_at + APPEAL_WINDOW_DAYS
      An appeal filed at logical time t is TIMELY iff t <= appeal_deadline   # INCLUSIVE at the exact deadline instant
      For appeal_target == DISMISSAL: deadline = closed_at + APPEAL_WINDOW_DAYS over the case's DISMISSED transition.
    input_set: "the ISSUED Determination (or DISMISSED case) and the appeal's filed_at"
    constants:
      APPEAL_WINDOW_DAYS: 5
    precision: "second precision; inclusive comparison"
    variants: []

  - name: calc_notice_lead_time
    trigger: "on Notice creation with notice_type INTERVIEW or HEARING; also re-checked on Hearing scheduling"
    algorithm: threshold
    formula: |
      required_lead_days = LEAD_DAYS[notice_type]
      lead_time_sufficient = (scheduled_event_at - sent_at) >= required_lead_days * 86400 seconds   # INCLUSIVE: exactly the lead time passes
      Non-event notice types (ALLEGATIONS, EVIDENCE_RELEASE, DETERMINATION, DISMISSAL, APPEAL_*) always have lead_time_sufficient == true.
    input_set: "the Notice row"
    constants:
      LEAD_DAYS: { INTERVIEW: 5, HEARING: 10 }
    precision: "second precision; inclusive comparison"
    variants: []

  - name: calc_sanction_severity_score
    trigger: "provisional variant on Determination draft creation (POST /api/cases/{id}/determinations); final variant on Determination issue (POST /api/determinations/{id}/issue)"
    algorithm: weighted_scoring
    formula: |
      matrix_score(variant) = CATEGORY_BASE[max-priority category in case.categories per STAT_HIERARCHY_PRIORITY]
            + PRIOR_POINTS * determination.prior_responsible_findings
            + AGGRAVATING_POINTS * determination.aggravating_factor_count
            - MITIGATING_POINTS * (determination.mitigating_factor_count if variant == FINAL else 0)
            + NCD_POINTS * (total substantiated DirectiveViolations on this case, all-time, not rolling)
      tier(score) = TIER_1 if 0 <= score <= 24
                    TIER_2 if 25 <= score <= 49
                    TIER_3 if 50 <= score <= 74
                    TIER_4 if score >= 75          # band lower bounds INCLUSIVE
      MATRIX (final_tier governs allowed sanction types and duration bounds):
        TIER_1: { WARNING, EDUCATIONAL_PROGRAM(1..30d), PROBATION(1..90d) }
        TIER_2: { EDUCATIONAL_PROGRAM(1..60d), PROBATION(30..180d), SUSPENSION(1..90d), NO_CONTACT_CONTINUATION(1..180d) }
        TIER_3: { PROBATION(91..365d), SUSPENSION(91..365d), RESTITUTION, NO_CONTACT_CONTINUATION(1..365d) }
        TIER_4: { SUSPENSION(180..730d), EXPULSION, RESTITUTION, NO_CONTACT_CONTINUATION(1..730d) }
      provisional_severity_score = matrix_score(PROVISIONAL)   # computed at draft
      final_severity_score       = matrix_score(FINAL)          # computed at issue
      final_tier                 = tier(final_severity_score + restitution_points)   # see calc_restitution_amount pinned order
    input_set: "the Determination's factor counts, the Case categories, all SUBSTANTIATED DirectiveViolations on the case (all-time)"
    constants:
      CATEGORY_BASE: { SEXUAL_ASSAULT: 40, DATING_VIOLENCE: 35, DOMESTIC_VIOLENCE: 35, STALKING: 30, SEXUAL_HARASSMENT: 25, OTHER_SEX_BASED: 15, NON_TITLE_IX_MISCONDUCT: 0 }
      PRIOR_POINTS: 15
      AGGRAVATING_POINTS: 10
      MITIGATING_POINTS: 5
      NCD_POINTS: 10
      TIER_BANDS: { TIER_1: [0, 24], TIER_2: [25, 49], TIER_3: [50, 74], TIER_4: [75, null] }
    precision: "integer arithmetic"
    variants:
      - name: PROVISIONAL
        when: "determination DRAFT creation"
        difference: "mitigating_factor_count contributes 0 (unverified mitigations excluded); produces provisional_severity_score, which can be STRICTLY GREATER than final_severity_score for identical other inputs"
      - name: FINAL
        when: "determination issue"
        difference: "mitigating_factor_count contributes -5 each; produces final_severity_score and (with restitution points) final_tier"

  - name: calc_restitution_amount
    trigger: "on Determination issue, for each sanction_selection with sanction_type == RESTITUTION, and for the determination-level final_tier computation"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency resolved explicitly):
        1. matrix_score = calc_sanction_severity_score FINAL variant (mitigating INCLUDED)
        2. per-item rounding FIRST: for each restitution item,
             item_cents = round_half_up(item.amount_dollars * 100)
           then summed_cents = SUM(item_cents)
           (The alternative order - sum raw dollars then round once - is FORBIDDEN and yields different cents:
            e.g. items [1.005, 1.005] -> per-item 101 + 101 = 202 cents, but sum-then-round gives 201 cents.)
        3. cap_tier = tier(matrix_score)   # tier WITHOUT restitution points
           cap_cents = RESTITUTION_CAP_CENTS[cap_tier]
        4. applied_restitution_cents = min(summed_cents, cap_cents)
           If cap_cents == 0 (TIER_1/TIER_2), a RESTITUTION selection fails ERR_SANCTION_OUTSIDE_MATRIX instead of clamping.
        5. restitution_points = floor(applied_restitution_cents / RESTITUTION_POINT_UNIT_CENTS)   # 100
        6. total_points = matrix_score + restitution_points
        7. final_tier = tier(total_points)   # governs duration bounds for ALL sanction selections
           NOTE: the restitution cap remains cap_tier from step 3 even when final_tier > cap_tier.
    input_set: "the RESTITUTION selection's restitution_items array, the determination's matrix_score"
    constants:
      RESTITUTION_CAP_CENTS: { TIER_1: 0, TIER_2: 0, TIER_3: 50000, TIER_4: 250000 }
      RESTITUTION_POINT_UNIT_CENTS: 100
    precision: "integer cents; round_half_up per item BEFORE summing"
    variants: []

  - name: calc_annual_statistics
    trigger: "on GET /api/annual-statistics/{year} (live view), on publish (frozen into snapshot_counts), on amend (frozen into amended_counts)"
    algorithm: aggregation
    formula: |
      Inclusion window: cases with received_at IN [year-01-01T00:00:00Z, (year+1)-01-01T00:00:00Z)   # lower inclusive, upper EXCLUSIVE
      reports_received        = count(included cases)
      formal_complaints_filed = count(included cases with formal_complaint_signed == true)
      dismissed               = count(included with status == DISMISSED)
      referred                = count(included with status == REFERRED_TO_CONDUCT)
      hearings_completed      = count(Hearing rows with status COMPLETED whose case is included; hearing completion itself may fall outside the window - case inclusion governs)
      informal_resolved       = count(included with status == RESOLVED_INFORMAL)
      determinations_responsible = count(included cases whose LATEST determination (by issued_at ASC, tie created_at ASC) has responsibility_finding == RESPONSIBLE and status IN {ISSUED, FINAL, SUPERSEDED}; REVERSED latest determinations exclude the case)
      Hierarchy rule (each case counted in EXACTLY ONE category bucket):
        assigned_category(case) = the category in case.categories with the HIGHEST STAT_HIERARCHY_PRIORITY
        per_category[C] = count(included cases with assigned_category == C)
        SUM over per_category == reports_received   # conserved: every included case counted exactly once
      avg_resolution_days: see calc_avg_resolution_days
    input_set: "Case rows by received_at window; Hearing/Deter mination rows joined by case_id"
    constants:
      STAT_HIERARCHY_PRIORITY: { SEXUAL_ASSAULT: 7, DATING_VIOLENCE: 6, DOMESTIC_VIOLENCE: 5, STALKING: 4, SEXUAL_HARASSMENT: 3, OTHER_SEX_BASED: 2, NON_TITLE_IX_MISCONDUCT: 1 }
    precision: "integer counts; avg_resolution_days to 1 decimal round_half_up"
    variants:
      - name: LIVE
        when: "GET /api/annual-statistics/{year} before publish, or amended_counts recomputation"
        difference: "reflects the database AS OF the current logical clock, including cases still in flight"
      - name: PUBLISHED
        when: "snapshot_counts frozen at publish time"
        difference: "later case mutations (dismissals, reversals, new findings) do NOT move snapshot_counts; the same underlying cases can therefore yield different numbers under LIVE vs PUBLISHED"

  - name: calc_avg_resolution_days
    trigger: "evaluated as part of calc_annual_statistics"
    algorithm: aggregation
    formula: |
      resolved_set = included cases with closed_at non-null AND closed_at < (year+1)-01-01T00:00:00Z
      PINNED ROUNDING ORDER (nested rounding; the reverse order yields different tenths):
        1. per-case days = FLOOR((closed_at - received_at) / 86400)          # integer floor FIRST, per case
        2. avg = SUM(per-case days) / count(resolved_set)                     # exact rational mean SECOND
        3. avg_resolution_days = round_half_up(avg, 1 decimal)                # single rounding LAST
      If resolved_set is empty, avg_resolution_days = null (NOT 0).
    input_set: "the statistics inclusion set intersected with terminal cases closed within the same calendar window"
    constants: {}
    precision: "floor per case (integer days), then mean, then round_half_up to 1 decimal place"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present (and, for entity_backed roles, equal to an existing PartyProfile.id)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-template resource ids resolve, validated LEFT-TO-RIGHT (case id before nested child id); body FK fields (complainant_id, respondent_id, coordinator_id, investigator_id, advisor_id, decision_maker_id, appeal_officer_id, facilitator_id, asked_by_advisor_id) resolve to existing PartyProfile rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition exists in §1.2 (per-machine from-state matching); terminal states reject all further transitions"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 4
    category: state
    check: "case is not in a terminal state (CLOSED, REFERRED_TO_CONDUCT, RESOLVED_INFORMAL) for any child-mutation endpoint; terminal cases are read-only except events listing, statistics, and retention purge"
    error_id: ERR_CASE_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all POST endpoints nested under /api/cases/{id} except appeals on DISMISSED (dismissal appeals are allowed from terminal DISMISSED)"
  - priority: 5
    category: business_safety
    check: "segregation of duties on the case: a PartyProfile may hold at most one official function per case, where 'investigator' means any InvestigatorAssignment on the case with status IN {PROPOSED, ACTIVE, COMPLETED} (having SERVED as investigator permanently bars decision-maker/appeal/facilitator functions on the same case even after the assignment completes); additionally no official may be the complainant or respondent; additionally a person RECUSED on this case may not be re-proposed to any official function on this case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /api/cases/{id}/investigator-assignments, POST /api/investigator-assignments/{id}/accept, POST /api/cases/{id}/hearings, POST /api/appeals/{id}/begin-review, POST /api/cases/{id}/informal-resolutions"
  - priority: 5
    category: business_safety
    check: "an official function assignee who equals case.complainant_id or case.respondent_id is rejected with the party-specific error (more specific than generic segregation)"
    error_id: ERR_OFFICIAL_IS_CASE_PARTY
    http_status: 422
    applies_to: "POST /api/cases/{id}/investigator-assignments, POST /api/cases/{id}/hearings, POST /api/appeals/{id}/begin-review, POST /api/cases/{id}/informal-resolutions"
  - priority: 5
    category: business_safety
    check: "informal resolution is prohibited when the respondent's role_type == EMPLOYEE and the complainant's role_type == STUDENT (employee-on-student allegations may never resolve informally)"
    error_id: ERR_INFORMAL_RESOLUTION_PROHIBITED
    http_status: 422
    applies_to: "POST /api/cases/{id}/informal-resolutions"
  - priority: 5
    category: business_safety
    check: "formal complaint may only be filed by the case complainant (actor identity == case.complainant_id)"
    error_id: ERR_ONLY_COMPLAINANT_MAY_FILE
    http_status: 422
    applies_to: "POST /api/cases/{id}/file-formal-complaint"
  - priority: 5
    category: business_safety
    check: "confirm-jurisdiction requires occurred_in_program_activity == true AND occurred_in_united_states == true AND at least one Title IX category present in categories"
    error_id: ERR_JURISDICTION_REQUIREMENTS_UNMET
    http_status: 422
    applies_to: "POST /api/cases/{id}/confirm-jurisdiction"
  - priority: 5
    category: business_safety
    check: "hearing convene requires BOTH parties to hold an AdvisorAppointment with status ACTIVE on the case"
    error_id: ERR_ADVISOR_REQUIRED
    http_status: 422
    applies_to: "POST /api/hearings/{id}/convene"
  - priority: 5
    category: business_safety
    check: "cross-examination questions may only be submitted by an advisor holding an ACTIVE AdvisorAppointment on the hearing's case; the question's target_side must be the OPPOSING side of the asker's appointment (advisors cross-examine the other party, never their own)"
    error_id: ERR_QUESTIONER_NOT_CASE_ADVISOR
    http_status: 422
    applies_to: "POST /api/hearings/{id}/cross-exam-questions"
  - priority: 5
    category: business_safety
    check: "Party-role reads of SupportiveMeasure rows are limited to measures whose party_side covers the reader; reading the other party's measure (or a BOTH measure is visible to both) — cross-party single-read is forbidden"
    error_id: ERR_SUPPORTIVE_MEASURE_CONFIDENTIAL
    http_status: 403
    applies_to: "GET /api/supportive-measures/{id}"
  - priority: 5
    category: business_safety
    check: "advisor identity must not be the opposing party of the same case, must not be any official on the case, and (for UNIVERSITY_APPOINTED) must have advisor_eligible == true; PARTY_SELECTED advisors need not be advisor_eligible"
    error_id: ERR_ADVISOR_INELIGIBLE
    http_status: 422
    applies_to: "POST /api/cases/{id}/advisor-appointments, POST /api/cases/{id}/advisor-appointments/appoint-university"
  - priority: 5
    category: business_safety
    check: "standard_of_evidence on determination issue must equal case.standard_of_evidence pinned at intake (same standard applies to both parties)"
    error_id: ERR_STANDARD_OF_EVIDENCE_MISMATCH
    http_status: 422
    applies_to: "POST /api/determinations/{id}/issue"
  - priority: 6
    category: business_temporal
    check: "event notices: scheduled_event_at - now >= LEAD_DAYS[type] days (INTERVIEW 5, HEARING 10); inclusive at exactly the lead"
    error_id: ERR_NOTICE_LEAD_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/cases/{id}/notices"
  - priority: 6
    category: business_temporal
    check: "an INTERVIEW notice may only be created after the ALLEGATIONS notice exists for the case (parties must receive allegations before any interview)"
    error_id: ERR_NOTICE_ORDER_VIOLATION
    http_status: 422
    applies_to: "POST /api/cases/{id}/notices"
  - priority: 6
    category: business_temporal
    check: "evidence review response accepted only while packet RELEASED_FOR_REVIEW and now <= review_closes_at (inclusive); after the close instant it is late"
    error_id: ERR_REVIEW_RESPONSE_LATE
    http_status: 422
    applies_to: "POST /api/evidence-packets/{id}/review-responses"
  - priority: 6
    category: business_temporal
    check: "packet finalize requires review closed (both responses in, or clock >= review_closes_at); finalizing while the window is still open and responses outstanding is premature"
    error_id: ERR_REVIEW_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /api/evidence-packets/{id}/finalize"
  - priority: 6
    category: business_temporal
    check: "appeal filing time must be <= the target's deadline (issued_at/closed_at + 5 days, inclusive); a filing after that instant is rejected"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/cases/{id}/appeals"
  - priority: 6
    category: business_temporal
    check: "hearing scheduling: decision-maker occupancy intervals [scheduled_at, scheduled_at + estimated_duration_minutes) on non-cancelled hearings must not overlap, AND must leave a gap of at least HEARING_BUFFER_MINUTES (60) on both sides — gap exactly 60 minutes passes, 59 fails; also scheduled_at must be > now"
    error_id: ERR_HEARING_TIME_CONFLICT
    http_status: 422
    applies_to: "POST /api/cases/{id}/hearings"
  - priority: 6
    category: business_temporal
    check: "no-contact directive windows: on the same case and shared party scope (MUTUAL shares both scopes), half-open intervals [effective_from, effective_to) must not overlap unless supersede_existing == true; adjacency (new.effective_from == existing.effective_to, gap == 0) is ALLOWED"
    error_id: ERR_DIRECTIVE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /api/cases/{id}/no-contact-directives"
  - priority: 7
    category: business_constraint
    check: "at most one EvidencePacket per case in a non-terminal state (DRAFT, RELEASED_FOR_REVIEW, REVIEW_CLOSED); creating another while one is live is rejected"
    error_id: ERR_ACTIVE_PACKET_EXISTS
    http_status: 409
    applies_to: "POST /api/cases/{id}/evidence-packets"
  - priority: 7
    category: business_constraint
    check: "at most one Hearing per case in a non-terminal state (SCHEDULED, IN_SESSION, ADJOURNED, DELIBERATION)"
    error_id: ERR_ACTIVE_HEARING_EXISTS
    http_status: 409
    applies_to: "POST /api/cases/{id}/hearings"
  - priority: 7
    category: business_constraint
    check: "at most one InformalResolution per case in a non-terminal state (PROPOSED, IN_PROGRESS)"
    error_id: ERR_ACTIVE_INFORMAL_RESOLUTION_EXISTS
    http_status: 409
    applies_to: "POST /api/cases/{id}/informal-resolutions"
  - priority: 7
    category: business_constraint
    check: "informal resolution requires a signed formal complaint on the case (formal_complaint_signed == true)"
    error_id: ERR_FORMAL_COMPLAINT_REQUIRED
    http_status: 422
    applies_to: "POST /api/cases/{id}/informal-resolutions"
  - priority: 7
    category: business_constraint
    check: "at most one InvestigatorAssignment per case with status ACTIVE; proposing while one is ACTIVE is rejected (recusal must come first)"
    error_id: ERR_INVESTIGATOR_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/cases/{id}/investigator-assignments"
  - priority: 7
    category: business_constraint
    check: "evidence review/ruling, packet release/finalize require an ACTIVE InvestigatorAssignment on the case whose investigator_id equals the actor"
    error_id: ERR_NO_ACTIVE_INVESTIGATOR
    http_status: 422
    applies_to: "POST /api/evidence-items/{id}/begin-review, POST /api/evidence-items/{id}/rule-relevance, POST /api/evidence-packets/{id}/release, POST /api/evidence-packets/{id}/finalize, POST /api/evidence-packets/{id}/attach-report, POST /api/evidence-packets/{id}/withdraw"
  - priority: 7
    category: business_constraint
    check: "close-cross-exam requires zero PENDING CrossExamQuestion rows on the hearing"
    error_id: ERR_PENDING_QUESTIONS_REMAIN
    http_status: 422
    applies_to: "POST /api/hearings/{id}/close-cross-exam"
  - priority: 7
    category: business_constraint
    check: "sanction_selections at issue/modify must be non-empty iff finding == RESPONSIBLE; every selection's type and duration must fall within the computed final-tier matrix bounds; RESTITUTION additionally requires cap_tier >= TIER_3"
    error_id: ERR_SANCTION_OUTSIDE_MATRIX
    http_status: 422
    applies_to: "POST /api/determinations/{id}/issue, POST /api/appeals/{id}/decide (SANCTION_MODIFIED)"
  - priority: 7
    category: business_constraint
    check: "a party may hold at most one ACTIVE AdvisorAppointment per case; creating a new one REPLACES the old only via the documented replacement cascade — direct double-ACTIVE is impossible, but appointing for a side whose ACTIVE appointment is identical advisor_id is a no-op rejection"
    error_id: ERR_DUPLICATE_ADVISOR
    http_status: 409
    applies_to: "POST /api/cases/{id}/advisor-appointments"
  - priority: 7
    category: business_constraint
    check: "university-appointed advisor selector pool empty (no advisor_eligible PartyProfile that is not a party/official on this case) — selector fallback"
    error_id: ERR_NO_ADVISOR_AVAILABLE
    http_status: 422
    applies_to: "POST /api/cases/{id}/advisor-appointments/appoint-university"
  - priority: 7
    category: business_constraint
    check: "duplicate informal-resolution consent by the same party is rejected; PartyProfile.university_id must be unique; AnnualStatistic.year must be unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /api/informal-resolutions/{id}/consent, POST /api/party-profiles, POST /api/annual-statistics/{year}/publish"
  - priority: 7
    category: business_constraint
    check: "review response recorded twice by the same party side on the same packet"
    error_id: ERR_DUPLICATE_RESPONSE
    http_status: 409
    applies_to: "POST /api/evidence-packets/{id}/review-responses"
  - priority: 8
    category: business_referential
    check: "appeal target must exist and be appealable: DETERMINATION requires an ISSUED determination; DISMISSAL requires case status == DISMISSED; RESOLVED_INFORMAL cases and FINAL/REVERSED/SUPERSEDED determinations are not appealable"
    error_id: ERR_APPEAL_TARGET_INVALID
    http_status: 422
    applies_to: "POST /api/cases/{id}/appeals"
  - priority: 8
    category: business_referential
    check: "appeal outcome must be compatible with appeal_target: REINSTATED only for DISMISSAL; REVERSED/REMANDED/SANCTION_MODIFIED only for DETERMINATION; remand_scope must match grounds (NEW_EVIDENCE -> INVESTIGATION)"
    error_id: ERR_APPEAL_OUTCOME_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /api/appeals/{id}/decide"
  - priority: 8
    category: business_referential
    check: "resume target must match case.remand_target set by the remanding appeal"
    error_id: ERR_REMAND_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /api/cases/{id}/resume, POST /api/appeals/{id}/decide (REMANDED scope-vs-grounds check)"
  - priority: 8
    category: business_referential
    check: "supportive measure / advisor appointment / consent / review-response / appeal actors naming a party side must match the case's actual party binding (e.g. withdrawing advisor appointment by a non-party is rejected)"
    error_id: ERR_PARTY_BINDING_MISMATCH
    http_status: 422
    applies_to: "POST /api/advisor-appointments/{id}/withdraw, POST /api/informal-resolutions/{id}/consent, POST /api/informal-resolutions/{id}/withdraw, POST /api/evidence-packets/{id}/review-responses, POST /api/cases/{id}/appeals"
  - priority: 9
    category: business_fiscal
    check: "RESTITUTION sanction requires a non-empty restitution_items array; every item amount_dollars must be > 0"
    error_id: ERR_RESTITUTION_ITEMS_REQUIRED
    http_status: 422
    applies_to: "POST /api/determinations/{id}/issue, POST /api/appeals/{id}/decide (SANCTION_MODIFIED)"
  - priority: 9
    category: business_fiscal
    check: "statistics publication/amendment requires year within 2000..2100 and (for amend) an existing PUBLISHED/AMENDED row"
    error_id: ERR_STATISTICS_YEAR_INVALID
    http_status: 422
    applies_to: "POST /api/annual-statistics/{year}/publish, POST /api/annual-statistics/{year}/amend"
  - priority: 5
    category: business_safety
    check: "Party role may only read cases where actor identity is complainant_id or respondent_id, and descendants of such cases; Advisor role only cases where actor holds an AdvisorAppointment (any status). Unaffiliated reads are indistinguishable from absent authorization."
    error_id: ERR_CASE_ACCESS_DENIED
    http_status: 403
    applies_to: "GET /api/cases/{id} and every GET nested under /api/cases/{id}/*, plus single-resource GETs of case-descendant entities when actor role is Party or Advisor"
  - priority: 8
    category: business_referential
    check: "actor identity must equal the hearing's decision_maker_id for determination draft/issue, hearing convene/close-cross-exam, and cross-exam question ruling"
    error_id: ERR_NOT_HEARING_DECISION_MAKER
    http_status: 422
    applies_to: "POST /api/cases/{id}/determinations, POST /api/determinations/{id}/issue, POST /api/hearings/{id}/convene, POST /api/hearings/{id}/close-cross-exam, POST /api/cross-exam-questions/{id}/rule"
  - priority: 8
    category: business_referential
    check: "appeal decide requires actor identity == appeal.appeal_officer_id (the officer assigned at begin-review)"
    error_id: ERR_NOT_ASSIGNED_APPEAL_OFFICER
    http_status: 422
    applies_to: "POST /api/appeals/{id}/decide"
  - priority: 10
    category: state
    check: "OCC: expected_case_version on guarded create-with-supersede endpoints must equal the case's current version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /api/cases/{id}/evidence-packets, POST /api/cases/{id}/determinations, POST /api/cases/{id}/no-contact-directives"
  - priority: 11
    category: business_constraint
    check: "request schema: missing required fields, wrong types, unknown enum members, empty arrays where non-empty required, malformed datetimes"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- PartyProfile ----
  - method: POST
    path: /api/party-profiles
    description: "Register a person in the university directory"
    roles: [CaseAdministrator, TitleIXCoordinator]
    code: 201
    input: [full_name, university_id, role_type, email, "advisor_eligible?"]
    output: PartyProfile
    side_effects: ["university_id uniqueness enforced (ERR_DUPLICATE_RESOURCE)"]
  - method: GET
    path: /api/party-profiles
    description: "List directory entries"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer]
    code: 200
    input: ["role_type?", "advisor_eligible?", "limit?", "offset?"]
    output: PartyProfile[]
    side_effects: []
  - method: GET
    path: /api/party-profiles/{id}
    description: "Read one directory entry"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party, Advisor]
    code: 200
    input: []
    output: PartyProfile
    side_effects: []

  # ---- Case ----
  - method: POST
    path: /api/cases
    description: "Report intake: record a new conduct/Title IX report"
    roles: [TitleIXCoordinator, CaseAdministrator]
    code: 201
    input: [complainant_id, respondent_id, coordinator_id, categories, occurred_at, occurred_in_program_activity, occurred_in_united_states, received_via, "standard_of_evidence?"]
    output: Case
    side_effects: ["mint report_number RPT-<received year>-<seq>", "stamp received_at from logical clock", "compute initial exposure score", "append CaseEvent REPORT_RECEIVED"]
  - method: GET
    path: /api/cases
    description: "List cases with filters (staff only)"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer]
    code: 200
    input: ["status?", "category?", "complainant_id?", "respondent_id?", "coordinator_id?", "received_year?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: GET
    path: /api/cases/{id}
    description: "Read one case (Party/Advisor restricted to affiliated cases)"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party, Advisor]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: POST
    path: /api/cases/{id}/begin-jurisdiction-review
    description: "Move RECEIVED case into jurisdiction/scope determination"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: Case
    side_effects: ["Case RECEIVED -> JURISDICTION_REVIEW", "CaseEvent JURISDICTION_REVIEW_STARTED", "increments Case.version by 1"]
  - method: POST
    path: /api/cases/{id}/confirm-jurisdiction
    description: "Confirm Title IX jurisdiction after review"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: Case
    side_effects: ["Case JURISDICTION_REVIEW -> AWAITING_FORMAL_COMPLAINT", "CaseEvent JURISDICTION_CONFIRMED", "increments Case.version by 1"]
  - method: POST
    path: /api/cases/{id}/dismiss
    description: "Dismiss (mandatory/discretionary) with optional conduct referral"
    roles: [TitleIXCoordinator]
    code: 200
    input: [dismissal_reason, refer_to_conduct]
    output: Case
    side_effects: ["Case -> DISMISSED or REFERRED_TO_CONDUCT (terminal, but DISMISSED appealable)", "non-terminal Hearings CANCELLED, PROPOSED/IN_PROGRESS InformalResolution TERMINATED", "Notice DISMISSAL to BOTH", "sets closed_at", "increments Case.version by 1"]
  - method: POST
    path: /api/cases/{id}/file-formal-complaint
    description: "Complainant files a signed formal complaint, launching the investigation track"
    roles: [Party]
    code: 200
    input: []
    output: Case
    side_effects: ["Case AWAITING_FORMAL_COMPLAINT -> INVESTIGATION", "formal_complaint_signed = true", "auto Notice ALLEGATIONS to BOTH", "CaseEvent FORMAL_COMPLAINT_FILED", "increments Case.version by 1"]
  - method: POST
    path: /api/cases/{id}/finalize-closure
    description: "Close case after the appeal window has fully elapsed with no pending appeal"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: Case
    side_effects: ["ISSUED Determination -> FINAL", "Case DETERMINATION_ISSUED -> CLOSED", "sets closed_at", "CaseEvent DETERMINATION_FINALIZED + CASE_CLOSED", "increments Case.version by 1"]
  - method: POST
    path: /api/cases/{id}/resume
    description: "Resume a REMANDED case into its remand_target state"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: Case
    side_effects: ["Case REMANDED -> remand_target", "on INVESTIGATION resume: FINALIZED packet SUPERSEDED and its pinned ACCEPTED items -> UNDER_REVIEW", "CaseEvent CASE_RESUMED", "increments Case.version by 1"]
  - method: POST
    path: /api/cases/{id}/reconcile
    description: "Ops-run checkpoint: apply all logical-clock-gated transitions for this case (measure expiry, directive expiry, packet review close, dated-sanction completion)"
    roles: [TitleIXCoordinator, CaseAdministrator]
    code: 200
    input: []
    output: { expired_measure_ids: "string[]", expired_directive_ids: "string[]", review_closed_packet_ids: "string[]", completed_sanction_ids: "string[]" }
    side_effects: ["SupportiveMeasure ACTIVE -> EXPIRED where effective_to <= clock", "NoContactDirective ACTIVE -> EXPIRED where effective_to <= clock", "EvidencePacket RELEASED_FOR_REVIEW -> REVIEW_CLOSED where review_closes_at <= clock", "Sanction ACTIVE -> COMPLETED where duration_days non-null and effective_from + duration_days <= clock", "exposure score recomputed if directives expired", "increments Case.version by 1 when any transition fired"]

  # ---- SupportiveMeasure ----
  - method: POST
    path: /api/cases/{id}/supportive-measures
    description: "Create a supportive measure (available from RECEIVED onward, even without a formal complaint)"
    roles: [TitleIXCoordinator]
    code: 201
    input: [measure_type, party_side, description, effective_from, "effective_to?"]
    output: SupportiveMeasure
    side_effects: ["status ACTIVE", "case.active_supportive_measure_count +1", "CaseEvent MEASURE_CREATED", "increments Case.version by 1"]
  - method: GET
    path: /api/cases/{id}/supportive-measures
    description: "List measures on a case; Party readers see only measures covering their own side (plus BOTH)"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party]
    code: 200
    input: ["status?", "party_side?", "limit?", "offset?"]
    output: SupportiveMeasure[]
    side_effects: []
  - method: GET
    path: /api/supportive-measures/{id}
    description: "Read one measure; cross-party Party reads rejected ERR_SUPPORTIVE_MEASURE_CONFIDENTIAL"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party]
    code: 200
    input: []
    output: SupportiveMeasure
    side_effects: []
  - method: POST
    path: /api/supportive-measures/{id}/terminate
    description: "Terminate an ACTIVE measure early"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: SupportiveMeasure
    side_effects: ["ACTIVE -> TERMINATED", "active_supportive_measure_count -1", "CaseEvent MEASURE_TERMINATED", "increments Case.version by 1"]

  # ---- NoContactDirective ----
  - method: POST
    path: /api/cases/{id}/no-contact-directives
    description: "Issue a no-contact directive; OCC-guarded; optional supersession of overlapping ACTIVE directive on shared scope"
    roles: [TitleIXCoordinator]
    code: 201
    input: [party_side, restrictions, effective_from, "effective_to?", "proximity_feet?", "supersede_existing?", expected_case_version]
    output: NoContactDirective
    side_effects: ["status ACTIVE", "if supersede_existing: overlapping ACTIVE directive -> SUPERSEDED with effective_to truncated to new effective_from", "exposure score recompute (+ACTIVE_DIRECTIVE_POINTS)", "CaseEvent DIRECTIVE_CREATED (+ DIRECTIVE_SUPERSEDED)", "increments Case.version by 1"]
  - method: GET
    path: /api/cases/{id}/no-contact-directives
    description: "List directives on a case"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party]
    code: 200
    input: ["status?", "party_side?", "limit?", "offset?"]
    output: NoContactDirective[]
    side_effects: []
  - method: GET
    path: /api/no-contact-directives/{id}
    description: "Read one directive"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party]
    code: 200
    input: []
    output: NoContactDirective
    side_effects: []
  - method: GET
    path: /api/no-contact-directives
    description: "Filtered list (self-FK reverse reachability via superseded_by_directive_id)"
    roles: [TitleIXCoordinator, CaseAdministrator]
    code: 200
    input: ["superseded_by_directive_id?", "status?", "limit?", "offset?"]
    output: NoContactDirective[]
    side_effects: []
  - method: POST
    path: /api/no-contact-directives/{id}/lift
    description: "Lift an ACTIVE directive"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: NoContactDirective
    side_effects: ["ACTIVE -> LIFTED", "exposure recompute", "CaseEvent DIRECTIVE_LIFTED", "increments Case.version by 1"]

  # ---- DirectiveViolation ----
  - method: POST
    path: /api/no-contact-directives/{id}/violations
    description: "Report an alleged violation of a directive"
    roles: [TitleIXCoordinator, Party]
    code: 201
    input: [reported_by_side, occurred_at, description]
    output: DirectiveViolation
    side_effects: ["status PENDING", "CaseEvent VIOLATION_REPORTED"]
  - method: GET
    path: /api/no-contact-directives/{id}/violations
    description: "List violations of a directive"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DirectiveViolation[]
    side_effects: []
  - method: GET
    path: /api/directive-violations/{id}
    description: "Read one violation report"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer, Party]
    code: 200
    input: []
    output: DirectiveViolation
    side_effects: []
  - method: POST
    path: /api/directive-violations/{id}/substantiate
    description: "Substantiate a pending violation (feeds exposure score contagion)"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: DirectiveViolation
    side_effects: ["PENDING -> SUBSTANTIATED", "substantiated_at = now", "directive.substantiated_violation_count +1", "calc_case_exposure_score recompute; may flip case.interim_suspension_eligible at >= 70", "CaseEvent VIOLATION_SUBSTANTIATED", "increments Case.version by 1"]
  - method: POST
    path: /api/directive-violations/{id}/mark-unsubstantiated
    description: "Mark a pending violation unsubstantiated"
    roles: [TitleIXCoordinator]
    code: 200
    input: []
    output: DirectiveViolation
    side_effects: ["PENDING -> UNSUBSTANTIATED", "CaseEvent VIOLATION_UNSUBSTANTIATED", "increments Case.version by 1"]

  # ---- InvestigatorAssignment ----
  - method: POST
    path: /api/cases/{id}/investigator-assignments
    description: "Propose an investigator (segregation-checked)"
    roles: [TitleIXCoordinator]
    code: 201
    input: [investigator_id]
    output: InvestigatorAssignment
    side_effects: ["status PROPOSED", "CaseEvent INVESTIGATOR_PROPOSED"]
  - method: GET
    path: /api/cases/{id}/investigator-assignments
    description: "List assignments on a case"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InvestigatorAssignment[]
    side_effects: []
  - method: GET
    path: /api/investigator-assignments/{id}
    description: "Read one assignment"
    roles: [TitleIXCoordinator, CaseAdministrator, Investigator, DecisionMaker, AppealOfficer]
    code: 200
    input: []
    output: InvestigatorAssignment
    side_effects: []
  - method: GET
    path: /api/investigator-assignments
    description: "Filtered list by investigator"
    roles: [TitleIXCoordinator, CaseAdministrator]
    code: 200
    input: ["investigator_id?", "status?", "limit?", "offset?"]
    output: InvestigatorAssignment[]
    side_effects: []
  - method: POST
    path: /api/investigator-assignments/{id}/accept
    description: "Investigator accepts (conflict-of-interest attestation); segregation re-checked"
    roles: [Investigator]
    code: 200
    input: []
    output: InvestigatorAssignment
    side_effects: ["PROPOSED -> ACTIVE", "CaseEvent INVESTIGATOR_ACCEPTED", "increments Case.version by 1"]
  - method: POST
    path: /api/investigator-assignments/{id}/decline
