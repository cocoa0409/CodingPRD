  # =======================================================================
  - section: endpoints
    instances:

      - name: create_and_read_environment_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /environments]
          - endpoints[GET /environments/{id}]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Environment is create-and-read only: the GET returns exactly what the POST stored (including the explicit cooldown 45 rather than the 30 default), and a second POST reusing the name prod-us is refused with 400 ERR_INVALID_REQUEST rather than a 409 duplicate-family error."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no Environment exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 45, requires_compliance_evidence: true }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: "$.data.id" }
            - call: "GET /environments/${env_id}"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
              captures: { echoed_name: "$.data.name" }
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "STAGING", deploy_window_start_hour_utc: 0, deploy_window_end_hour_utc: 24 }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "The create returns HTTP 201 and the read returns HTTP 200 with the same id"
            - "Environment.${env_id}.name == prod-us and tier == PROD"
            - "Environment.${env_id}.deploy_window_start_hour_utc == 2 and deploy_window_end_hour_utc == 6"
            - "Environment.${env_id}.cooldown_minutes == 45 (the explicit value, not the 30 default)"
            - "Environment.${env_id}.requires_compliance_evidence == true"
            - "Environment.${env_id}.version == 1"
            - "The duplicate-name create returns HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: flag_cleanup_sweep_enforces_and_reports_per_bucket_counts
        claim_type: bulk_action
        grounds:
          - endpoints[POST /flag-cleanup-sweeps]
          - calculations.flag_stale_debt
          - state_machines.FlagRolloutStep.SOAKING_to_ABORTED
          - state_machines.FlagRolloutStep.PLANNED_to_VOIDED
        distinguishing_aspect: "The sweep is a single bulk action with skip-not-fail semantics: it evaluates both flags, enforces only the stale one by pausing it with kill_switch_engaged true, aborts its SOAKING step and voids its PLANNED step, and reports evaluated 2 / enforced 1 / paused 1 / aborted 1 / voided 1 while the compliant flag's steps are untouched."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; cleanup_state stays COMPLIANT on both flags until the first sweep runs."
            - "flag_stale (expires_at 2026-07-17T00:00:00Z, orphaned) has step_s1 (5 pct / 30 min) SOAKING and step_s2 (5 pct / 30 min) PLANNED, so it is ACTIVE_ROLLING_OUT with current_exposure_pct 0."
            - "flag_fresh (expires_at 2026-12-01T00:00:00Z) has step_f1 (5 pct / 30 min) SOAKING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "legacy-pricing", owner_user_id: "u-eng-1", expires_at: "2026-07-17T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_stale: "$.data.id", stale_v0: "$.data.version" }
            - call: "POST /feature-flags/${flag_stale}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${stale_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step_s1: "$.data.id" }
            - call: "GET /feature-flags/${flag_stale}"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { stale_v1: "$.data.version" }
            - call: "POST /feature-flags/${flag_stale}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${stale_v1}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step_s2: "$.data.id" }
            - call: "POST /flag-rollout-steps/${step_s1}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_fresh: "$.data.id", fresh_v0: "$.data.version" }
            - call: "POST /feature-flags/${flag_fresh}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${fresh_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step_f1: "$.data.id" }
            - call: "POST /flag-rollout-steps/${step_f1}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
          trigger:
            - call: "POST /flag-cleanup-sweeps"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { evaluated: "$.data.evaluated_count", paused: "$.data.paused_flag_count" }
          assert:
            - "HTTP 200 with evaluated_count == 2, enforced_count == 1, overdue_count == 0, warning_count == 0"
            - "paused_flag_count == 1, aborted_step_count == 1 and voided_step_count == 1"
            - "FeatureFlag.${flag_stale}.stale_debt_points == 60 and cleanup_state == ENFORCED"
            - "FeatureFlag.${flag_stale}.state == PAUSED with kill_switch_engaged == true"
            - "FlagRolloutStep.${step_s1}.state == ABORTED and FlagRolloutStep.${step_s2}.state == VOIDED"
            - "FeatureFlag.${flag_stale}.current_exposure_pct == 0 and applied_step_count == 0"
            - "FeatureFlag.${flag_fresh}.cleanup_state == COMPLIANT, state == ACTIVE_ROLLING_OUT and FlagRolloutStep.${step_f1}.state == SOAKING"
            - "Both flags report last_sweep_at == 2026-08-01T00:00:00Z"

      - name: link_endpoints_with_unknown_body_ids_return_resource_not_found
        claim_type: cross_reference_link
        grounds:
          - validations[priority=5]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints[POST /change-requests/{id}/flag-links]
