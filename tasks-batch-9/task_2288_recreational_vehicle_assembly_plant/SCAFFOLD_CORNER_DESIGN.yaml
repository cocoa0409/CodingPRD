              payload: {}
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { one_lot: "$.data[0].id", one_lot_avail: "$.data[0].quantity_available" }
            - call: "GET /quality-inspections?unit_build_id=${build_id}"
              payload: {}
              as: QualityInspector
              as_user_id: "QI-1"
              captures: { insp_first: "$.data[0].id" }
            - call: "GET /quality-inspections?unit_build_id=${build_id}&inspection_type=WATER_TEST&status=SCHEDULED"
              payload: {}
              as: LineSupervisor
              as_user_id: "LS-1"
              captures: { wt_first: "$.data[0].id", wt_booth: "$.data[0].test_booth_id" }
            - call: "GET /quality-inspections/${pdi_id}"
              payload: {}
              as: QualityInspector
              as_user_id: "QI-1"
              captures: { pdi_type: $.data.inspection_type, pdi_booth: $.data.test_booth_id, pdi_inspector: $.data.inspector_user_id, pdi_result: $.data.result }
            - call: "GET /recall-campaigns?supplier_id=${sup_ap}&status=DRAFT"
              payload: {}
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { camp_first: "$.data[0].id", camp_ship_stop: "$.data[0].ship_stop" }
            - call: "GET /recall-campaigns?status=OPEN"
              payload: {}
              as: PlantAdmin
          assert:
            - "the first call returns total_count 2 with lots_first == LOT-A1 (creation order) — the DRAFT campaign has quarantined nothing, so both lots are still AVAILABLE"
            - "the second call returns total_count 1 with one_lot == ${lot_a2} and one_lot_avail == 6: lot_code is an exact-match filter, not a prefix"
            - "the third call returns total_count 2 with insp_first == ${pdi_id}, both inspections belonging to build ${build_id}"
            - "the fourth call returns total_count 1 with wt_first == ${wt_id} and wt_booth == ${booth_id}: inspection_type and status stack on the same query"
            - "the single-resource read returns pdi_type == PDI, pdi_booth null, pdi_inspector == QI-1 and pdi_result null — a SCHEDULED inspection carries no result yet"
            - "the sixth call returns total_count 1 with camp_first == ${camp_id} and camp_ship_stop == false, since severity ADVISORY does not raise a ship stop"
            - "the seventh call returns total_count 0, has_more false, limit 10 and an empty data array with HTTP 200 — a filter that matches nothing is not a 404"

  # ===========================================================================
