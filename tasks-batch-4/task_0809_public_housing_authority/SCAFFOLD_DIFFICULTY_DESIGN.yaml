              captures: { err: $.data.error_id }
          assert:
            - "the offer returns HTTP 422 with ${err} == ERR_BEDROOM_MISMATCH (not ERR_UNIT_TURNOVER_CONFLICT)"
            - "no Offer is created for entry ${entry_b2}; Unit ${unit_id}.status stays AVAILABLE"

  - rule_id: boundary_precision_check
    instances:
