              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
