          Project -> Teacher): a PO in the correct ISSUED state still cannot SHIP
          while its vendor row is SUSPENDED; the rejection is the state-category
          ERR_INVALID_STATE and the PO remains ISSUED.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; FUNDED project (goal 10959, single donation 10959); its PO is ISSUED; the vendor has just been suspended."
          setup_api_calls:
