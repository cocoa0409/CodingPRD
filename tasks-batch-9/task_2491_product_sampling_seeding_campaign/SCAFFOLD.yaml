# =============================================================================
# PRD Benchmark Seed Tables — task_2491_product_sampling_seeding_campaign
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2491. Product Sampling & Seeding Campaign (consumer brand sampling program): sampling objective definition across trial generation, review acquisition and awareness with target audience specification, panel recruitment or purchase-triggered sampling with eligibility screening and fraud controls, sample kit assembly, inventory allocation and fulfillment logistics with cost per sample tracking, disclosure requirements for incentivized reviews and honest opinion policies, review collection, syndication to retailer sites and moderation of ineligible content, redemption and conversion measurement through purchase data matching, sample diversion and resale monitoring, campaign lift analysis against holdout groups

domain_name: product-sampling-seeding

# Flat topology: every entity is its own top-level collection and children carry
# foreign keys in the request body rather than in the URL path. There is no single
# owning resource path, so the prefix is the API root.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy

  entity_topology: flat
  # Peer collections linked by FKs in request bodies; no nesting in URL paths
  # except the single PurchaseMatch sub-resource read.

  state_machine_shape: parallel
  # Enrollment carries two independent state axes on one row
  # (screening_status × obligation_status). ReviewSubmission and DiversionCase
  # add revision cycles; Campaign adds a SUSPENDED↔SAMPLING_ACTIVE cycle plus a
  # derived compliance_posture that gates child operations.

  relationship_patterns:
    - one_to_many
    - many_to_many          # ReviewSubmission × Retailer via SyndicationRecord
    - self_referential      # Panelist.referred_by_panelist_id, SampleShipment.supersedes_shipment_id
    - cross_aggregate       # DiversionCase spans Panelist and SampleShipment

  role_model: segregation_of_duties
  # The moderator user who requested changes on a ReviewSubmission may not be the
  # moderator user who later approves that same review.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 60 endpoints / 44 error codes / 6 state machines / 11 calculations.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable campaign name.
        constraints: non-empty, max 160 chars
      - name: objective_type
        type: enum
        source: input
        description: Primary sampling objective declared at definition time.
        constraints: "one of {TRIAL_GENERATION, REVIEW_ACQUISITION, AWARENESS}"
      - name: target_segment_codes
        type: array
        source: input
        description: Target audience specification — the explicit set of Panelist.segment_code values eligible for this campaign.
        constraints: array of 1..8 non-empty strings, no duplicates
      - name: syndication_retailer_ids
        type: array
        source: input
        description: Retailer ids this campaign is contractually cleared to syndicate reviews to. Not an FK field; membership is checked by validation priority 17.
        constraints: array of 0..8 Retailer ids that must all exist at campaign creation
      - name: sampling_window_start
        type: datetime
        source: input
        description: Inclusive start of the campaign sampling window (ISO 8601 UTC).
      - name: sampling_window_end
        type: datetime
        source: input
        description: Inclusive end of the campaign sampling window (ISO 8601 UTC).
        constraints: must be strictly after sampling_window_start
      - name: review_due_days
        type: integer
        source: input
        description: Days after sample delivery within which the panelist owes a review.
        default: 21
        constraints: 1..90
      - name: min_review_word_count
        type: integer
        source: input
        description: Campaign-level minimum body_text word count for review submission.
        default: 50
        constraints: 10..500
      - name: holdout_pct
        type: number
        source: input
        description: Fraction of screened enrollments deterministically withheld from sampling to form the measurement holdout group.
        default: 0.2
        constraints: 0 <= holdout_pct <= 0.5, at most 4 decimal places
      - name: budget_total_cents
        type: integer
        source: input
        description: Total sampling budget in whole cents.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Campaign lifecycle state (see §1.2 Campaign machine).
        default: DRAFT
        constraints: "one of {DRAFT, SCREENING_OPEN, SAMPLING_ACTIVE, SUSPENDED, REVIEW_WINDOW, CLOSED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived compliance gate recomputed by calculation campaign_compliance_posture on every diversion/review side effect; gates child operations.
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: kit_assembly_unit_cost_cents
        type: integer
        source: computed
        description: Per-kit assembly cost in whole cents, produced by calculation kit_assembly_unit_cost (round-per-line-then-sum).
        default: 0
      - name: budget_committed_cents
        type: integer
        source: computed
        description: Sum of committed_cost_cents over this campaign's non-CANCELLED SampleShipments.
        default: 0
      - name: budget_available_cents
        type: integer
        source: computed
        description: "budget_total_cents - budget_committed_cents; conserved-money invariant partner of budget_committed_cents."
        default: 0
      - name: enrollment_count
        type: integer
        source: computed
        description: Count of Enrollment rows created against this campaign (all screening_status values, never decremented).
        default: 0
      - name: holdout_enrollment_count
        type: integer
        source: computed
        description: Count of this campaign's Enrollments with holdout_flag true.
        default: 0
      - name: allocated_sample_count
        type: integer
        source: computed
        description: Count of this campaign's SampleShipments with status IN {ALLOCATED, SHIPPED, DELIVERED, LOST}.
        default: 0
      - name: delivered_sample_count
        type: integer
        source: computed
        description: Count of this campaign's SampleShipments with status == DELIVERED.
        default: 0
      - name: approved_review_count
        type: integer
        source: computed
        description: Count of this campaign's ReviewSubmissions with status == APPROVED.
        default: 0
      - name: syndicated_review_count
        type: integer
        source: computed
        description: Count of this campaign's SyndicationRecords with status == SYNDICATED.
        default: 0
      - name: disclosure_rejected_review_count
        type: integer
        source: computed
        description: Count of this campaign's ReviewSubmissions with status == DISCLOSURE_REJECTED; input to campaign_compliance_posture.
        default: 0
      - name: substantiated_diversion_count
        type: integer
        source: computed
        description: Count of SUBSTANTIATED DiversionCases whose sample_shipment_id belongs to this campaign.
        default: 0
      - name: write_off_cost_cents
        type: integer
        source: computed
        description: Accumulated inventory write-off cost in whole cents; enters the final cost_per_sample numerator only.
        default: 0
      - name: cost_per_sample_provisional_cents
        type: integer
        source: computed
        description: Provisional variant of calculation cost_per_sample, refreshed on every allocation/cancellation.
        default: 0
      - name: cost_per_sample_final_cents
        type: integer
        source: computed
        description: Final variant of calculation cost_per_sample, refreshed on delivery, loss, write-off and campaign close.
        default: 0
      - name: launched_by_user_id
        type: string
        source: system
        description: X-User-ID of the CampaignManager that performed activate-sampling; null before launch.
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the campaign entered CLOSED; null otherwise.

  - name: KitLine
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign whose sample kit this line belongs to.
      - name: component_sku
        type: string
        source: input
        description: Stock-keeping unit of this kit component.
        constraints: non-empty, unique per campaign_id
      - name: component_role
        type: enum
        source: input
        description: Role this component plays in the assembled kit.
        constraints: "one of {HERO_PRODUCT, ACCESSORY, INSERT_CARD, DISCLOSURE_INSERT}"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Cost of one unit of this component in whole cents.
        constraints: ">= 0"
      - name: quantity_per_kit
        type: integer
        source: input
        description: Units of this component consumed by one assembled kit.
        constraints: ">= 1"
      - name: component_discount_pct
        type: number
        source: input
        description: Supplier discount applied to this line before rounding.
        default: 0
        constraints: 0 <= component_discount_pct < 1, at most 4 decimal places
      - name: extended_cost_cents
        type: integer
        source: computed
        description: "ROUND_HALF_UP(unit_cost_cents * quantity_per_kit * (1 - component_discount_pct), 0) — the per-line rounded cost pinned by calculation kit_assembly_unit_cost."
        default: 0
      - name: status
        type: enum
        source: system
        description: ACTIVE lines participate in kit assembly and inventory reservation; RETIRED lines are excluded from both.
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"
      - name: units_received
        type: integer
        source: computed
        description: Cumulative units booked into inventory for this line via POST /kit-lines/{id}/receipts.
        default: 0
      - name: units_available
        type: integer
        source: computed
        description: Units free to reserve.
        default: 0
      - name: units_reserved
        type: integer
        source: computed
        description: Units held by SampleShipments in status ALLOCATED.
        default: 0
      - name: units_shipped
        type: integer
        source: computed
        description: Units consumed by SampleShipments in status SHIPPED, DELIVERED or LOST.
        default: 0
      - name: units_written_off
        type: integer
        source: computed
        description: Units removed by POST /kit-lines/{id}/write-offs.
        default: 0

  - name: FulfillmentCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Center name.
        constraints: non-empty
      - name: zone_code
        type: string
        source: input
        description: Freight zone code used for reporting.
        constraints: non-empty
      - name: daily_pick_capacity_units
        type: integer
        source: input
        description: Aggregate unit capacity this center can pick across all time-overlapping waves.
        constraints: ">= 1"
      - name: freight_cents_per_kit
        type: integer
        source: input
        description: Freight charged per shipped kit out of this center, in whole cents.
        constraints: ">= 0"

  - name: FulfillmentWave
    parent: FulfillmentCenter
    common_fields: true
    fields:
      - name: fulfillment_center_id
        type: string
        source: input
        description: FK -> FulfillmentCenter.id; the center that executes this wave.
      - name: window_start
        type: datetime
        source: input
        description: Half-open interval start of the pick window (ISO 8601 UTC), inclusive.
      - name: window_end
        type: datetime
        source: input
        description: Half-open interval end of the pick window (ISO 8601 UTC), exclusive.
        constraints: must be strictly after window_start
      - name: planned_capacity_units
        type: integer
        source: input
        description: Per-wave unit ceiling; independent of the center's aggregate daily_pick_capacity_units.
        constraints: ">= 1"
      - name: planned_unit_count
        type: integer
        source: computed
        description: Units currently planned into this wave — the sum of kit units held by its SampleShipments in status ALLOCATED.
        default: 0
      - name: shipped_unit_count
        type: integer
        source: computed
        description: Units this wave actually released to carriers.
        default: 0
      - name: status
        type: enum
        source: system
        description: Wave lifecycle state (see §1.2 FulfillmentWave machine).
        default: PLANNED
        constraints: "one of {PLANNED, LOCKED, RELEASED}"

  - name: Panelist
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Panelist login email.
        constraints: non-empty, globally unique
      - name: display_name
        type: string
        source: input
        description: Public review byline.
        constraints: non-empty
      - name: address_hash
        type: string
        source: input
        description: Salted hash of the shipping address; equal hashes across panelists are an address-cluster fraud signal.
        constraints: non-empty
      - name: account_opened_at
        type: datetime
        source: input
        description: Instant the panel account was opened (ISO 8601 UTC); account age feeds the fraud score.
      - name: segment_code
        type: string
        source: input
        description: Audience segment this panelist belongs to; matched against Campaign.target_segment_codes.
        constraints: non-empty
      - name: referred_by_panelist_id
        type: string
        source: input
        description: FK -> Panelist.id; the panelist who referred this one (self-referential). Null when the signup is organic.
        default: null
      - name: integrity_status
        type: enum
        source: system
        description: Fraud-control standing. CLEAR panelists may screen and be sampled; FLAGGED blocks screening; BANNED blocks every panelist-facing write.
        default: CLEAR
        constraints: "one of {CLEAR, FLAGGED, BANNED}"
      - name: diversion_strikes
        type: integer
        source: computed
        description: Count of SUBSTANTIATED DiversionCases against this panelist.
        default: 0
      - name: fraud_risk_score_screening
        type: number
        source: computed
        description: Screening variant of calculation panelist_fraud_risk_score, one decimal place.
        default: 0.0
        constraints: 0.0 <= score <= 100.0
      - name: fraud_risk_score_audit
        type: number
        source: computed
        description: Post-campaign audit variant of calculation panelist_fraud_risk_score, one decimal place; null until an audit rescore runs.
        constraints: 0.0 <= score <= 100.0
      - name: last_risk_scored_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent risk scoring; null before the first score.

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign this panelist enrolled in.
      - name: panelist_id
        type: string
        source: input
        description: FK -> Panelist.id; the enrolling panelist.
      - name: screening_answers
        type: object
        source: input
        description: Free-form screener answers captured at enrollment; replaced wholesale on resubmission.
      - name: enrollment_seq
        type: integer
        source: system
        description: 1-based ordinal of this enrollment within its campaign, assigned as Campaign.enrollment_count + 1 at creation.
      - name: holdout_flag
        type: boolean
        source: computed
        description: True when calculation holdout_assignment places this enrollment_seq in the measurement holdout group; holdout enrollments are never sampled.
        default: false
      - name: screening_status
        type: enum
        source: system
        description: First independent state axis — eligibility screening outcome (see §1.2 Enrollment machine).
        default: PENDING_SCREEN
        constraints: "one of {PENDING_SCREEN, SCREEN_PASSED, SCREEN_FAILED, SCREEN_REVOKED}"
      - name: obligation_status
        type: enum
        source: system
        description: Second independent state axis — the panelist's sample/review obligation (see §1.2 Enrollment machine); evolves independently of screening_status on the same row.
        default: NONE
        constraints: "one of {NONE, SAMPLE_SENT, REVIEW_DUE, REVIEW_FULFILLED, FORFEITED}"
      - name: screening_failure_reason
        type: enum
        source: system
        description: Reason recorded when screening_status becomes SCREEN_FAILED; null otherwise.
        constraints: "one of {SEGMENT_MISMATCH, FRAUD_SCORE_TOO_HIGH, COOLDOWN_CONFLICT, INTEGRITY_HOLD}"
      - name: screen_attempt_count
        type: integer
        source: computed
        description: Number of times POST /enrollments/{id}/screen has been evaluated for this enrollment.
        default: 0
      - name: review_due_at
        type: datetime
        source: system
        description: Deadline stamped when obligation_status becomes REVIEW_DUE — delivery instant plus Campaign.review_due_days days; null otherwise.
      - name: fraud_score_at_screening
        type: number
        source: system
        description: Snapshot of Panelist.fraud_risk_score_screening at the moment screening was evaluated; null before the first screen.

  - name: SampleShipment
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment this sample fulfils.
      - name: fulfillment_wave_id
        type: string
        source: input
        description: FK -> FulfillmentWave.id; the pick wave this shipment is planned into.
      - name: supersedes_shipment_id
        type: string
        source: input
        description: FK -> SampleShipment.id; the LOST shipment this reship supersedes (self-referential). Null for a first shipment.
        default: null
      - name: surcharge_cents
        type: integer
        source: input
        description: Carrier surcharge in whole cents recorded at allocation; enters the final cost_per_sample numerator only.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Shipment lifecycle state (see §1.2 SampleShipment machine).
        default: ALLOCATED
        constraints: "one of {ALLOCATED, SHIPPED, DELIVERED, LOST, CANCELLED}"
      - name: committed_cost_cents
        type: integer
        source: computed
        description: "Campaign.kit_assembly_unit_cost_cents + FulfillmentCenter.freight_cents_per_kit snapshotted at allocation; released verbatim on cancellation so the budget invariant cannot drift."
        default: 0
      - name: reserved_line_units
        type: object
        source: computed
        description: "Map of KitLine.id -> units reserved by this shipment, snapshotted at allocation; cancellation releases exactly these amounts."
      - name: kit_unit_total
        type: integer
        source: computed
        description: Sum of the values in reserved_line_units; the unit weight this shipment contributes to wave and center capacity.
        default: 0
      - name: shipped_at
        type: datetime
        source: system
        description: Logical-clock instant the owning wave was released; null before shipping.
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of delivery confirmation; null otherwise.

  - name: ReviewSubmission
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment that owes this review.
      - name: headline
        type: string
        source: input
        description: Review headline.
        constraints: non-empty, max 120 chars
      - name: body_text
        type: string
        source: input
        description: Review body; word_count is derived from this field.
        constraints: non-empty
      - name: star_rating
        type: integer
        source: input
        description: Star rating awarded by the panelist.
        constraints: 1..5
      - name: disclosure_statement
        type: string
        source: input
        description: Incentivized-review disclosure text; must contain a required disclosure phrase to pass submission.
        default: null
      - name: honest_opinion_attested
        type: boolean
        source: input
        description: Panelist attestation that the opinion is their own and unconditioned on the free sample.
        default: false
      - name: word_count
        type: integer
        source: computed
        description: Count of whitespace-delimited tokens in body_text, recomputed on create and on every revision.
        default: 0
      - name: status
        type: enum
        source: system
        description: Review lifecycle state (see §1.2 ReviewSubmission machine).
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CHANGES_REQUESTED, DISCLOSURE_REJECTED, APPROVED, RETRACTED}"
      - name: revision_count
        type: integer
        source: computed
        description: Number of completed CHANGES_REQUESTED -> SUBMITTED revision cycles.
        default: 0
      - name: first_submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the first DRAFT -> SUBMITTED transition; never overwritten by later revisions. Feeds the audit-variant review-velocity term.
      - name: changes_requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceModerator that most recently requested changes; segregation-of-duties key.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceModerator that approved this review; null otherwise.
      - name: moderator_note
        type: string
        source: system
        description: Free-text note recorded by the most recent moderation decision.

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Retailer name.
        constraints: non-empty
      - name: feed_status
        type: enum
        source: input
        description: Whether the retailer's review feed currently accepts dispatches.
        default: ACCEPTING
        constraints: "one of {ACCEPTING, PAUSED}"
      - name: requires_disclosure_badge
        type: boolean
        source: input
        description: When true, a dispatched review's disclosure_statement must contain calculation syndication_eligibility's BADGE_PHRASE — a stricter standard than the submit-time gate, which accepts either member of REQUIRED_DISCLOSURE_PHRASES.
        default: true
      - name: min_star_rating_accepted
        type: integer
        source: input
        description: Minimum star_rating the retailer will publish.
        default: 1
        constraints: 1..5
      - name: max_reviews_per_panelist_per_month
        type: integer
        source: input
        description: Maximum SYNDICATED reviews per panelist this retailer accepts in the trailing 30-day window.
        default: 1
        constraints: ">= 1"

  - name: SyndicationRecord
    parent: null
    common_fields: true
    fields:
      - name: review_submission_id
        type: string
        source: input
        description: FK -> ReviewSubmission.id; the review being syndicated.
      - name: retailer_id
        type: string
        source: input
        description: FK -> Retailer.id; the destination retailer feed.
      - name: status
        type: enum
        source: system
        description: Syndication lifecycle state (see §1.2 SyndicationRecord machine).
        default: QUEUED
        constraints: "one of {QUEUED, SYNDICATED, REJECTED, TAKEDOWN_REQUESTED}"
      - name: rejection_reason
        type: enum
        source: system
        description: Retailer-side moderation outcome recorded when status becomes REJECTED; null otherwise.
        constraints: "one of {BELOW_MIN_RATING, DISCLOSURE_BADGE_MISSING, PANELIST_RATE_LIMIT}"
      - name: syndicated_at
        type: datetime
        source: system
        description: Logical-clock instant of successful dispatch; null otherwise. Anchors the retailer's trailing 30-day per-panelist rate limit.
      - name: takedown_requested_at
        type: datetime
        source: system
        description: Logical-clock instant a takedown was requested because the source review was retracted; null otherwise.

  - name: DiversionCase
    parent: null
    common_fields: true
    fields:
      - name: panelist_id
        type: string
        source: input
        description: FK -> Panelist.id; the panelist suspected of diverting or reselling the sample.
      - name: sample_shipment_id
        type: string
        source: input
        description: FK -> SampleShipment.id; the shipment whose units are suspected of diversion.
      - name: signal_type
        type: enum
        source: input
        description: Detection signal that opened the case.
        constraints: "one of {RESALE_LISTING, ADDRESS_CLUSTER, BULK_REDEMPTION}"
      - name: evidence_note
        type: string
        source: input
        description: Investigator note describing the evidence.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Case lifecycle state (see §1.2 DiversionCase machine).
        default: OPEN
        constraints: "one of {OPEN, INVESTIGATING, SUBSTANTIATED, DISMISSED}"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceModerator that opened the case.
      - name: substantiated_at
        type: datetime
        source: system
        description: Logical-clock instant the case was substantiated; null otherwise.
      - name: reopen_count
        type: integer
        source: computed
        description: Number of completed INVESTIGATING -> OPEN reopen cycles.
        default: 0

  - name: PurchaseMatch
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment whose panelist the purchase record was matched to.
      - name: retailer_channel_code
        type: string
        source: input
        description: Opaque purchase-data channel code (not a Retailer reference); recorded for provenance only.
        constraints: non-empty
      - name: purchase_amount_cents
        type: integer
        source: input
        description: Matched purchase amount in whole cents.
        constraints: ">= 0"
      - name: purchased_at
        type: datetime
        source: input
        description: Instant of the matched purchase (ISO 8601 UTC).
      - name: match_confidence
        type: number
        source: input
        description: Confidence of the identity match between purchase record and panelist.
        constraints: 0 <= match_confidence <= 1, at most 4 decimal places
      - name: qualified
        type: boolean
        source: computed
        description: "True iff match_confidence >= 0.8 AND purchased_at falls inside the campaign conversion window; only qualified matches count as conversions."
        default: false

  - name: LiftAnalysis
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign being measured.
      - name: variant
        type: enum
        source: input
        description: Treated-group definition used for this analysis.
        constraints: "one of {ITT, PER_PROTOCOL}"
      - name: treated_count
        type: integer
        source: computed
        description: Size of the treated group under the chosen variant.
        default: 0
      - name: holdout_count
        type: integer
        source: computed
        description: Size of the holdout group (variant-independent).
        default: 0
      - name: treated_converted_count
        type: integer
        source: computed
        description: Treated enrollments with at least one qualified PurchaseMatch.
        default: 0
      - name: holdout_converted_count
        type: integer
        source: computed
        description: Holdout enrollments with at least one qualified PurchaseMatch.
        default: 0
      - name: treated_conversion_rate
        type: number
        source: computed
        description: treated_converted_count / treated_count, 4 decimal places; 0.0 when treated_count is 0.
        default: 0.0
      - name: holdout_conversion_rate
        type: number
        source: computed
        description: holdout_converted_count / holdout_count, 4 decimal places; 0.0 when holdout_count is 0.
        default: 0.0
      - name: lift_pct
        type: number
        source: computed
        description: "ROUND_HALF_UP(100 * (treated_conversion_rate - holdout_conversion_rate), 2)."
        default: 0.0
      - name: power_status
        type: enum
        source: computed
        description: MEASURED when the groups support inference; INSUFFICIENT_POWER when holdout_count is 0 or treated_count < 3.
        default: MEASURED
        constraints: "one of {MEASURED, INSUFFICIENT_POWER}"
      - name: effective_sample_count
        type: integer
        source: computed
        description: Campaign.delivered_sample_count minus diverted_unit_count; the denominator of both cost figures.
        default: 0
      - name: diverted_unit_count
        type: integer
        source: computed
        description: Count of SUBSTANTIATED DiversionCases whose shipment belongs to this campaign.
        default: 0
      - name: base_cost_per_sample_cents
        type: integer
        source: computed
        description: Step-1 pre-penalty cost per sample; the value whose tier selects penalty_rate_pct.
        default: 0
      - name: penalty_rate_pct
        type: integer
        source: computed
        description: Diversion penalty rate in percent, selected from the tier of base_cost_per_sample_cents (never from the adjusted figure).
        default: 0
      - name: diversion_penalty_cents
        type: integer
        source: computed
        description: Step-3 penalty charged for substantiated diversion.
        default: 0
      - name: adjusted_cost_per_sample_cents
        type: integer
        source: computed
        description: Step-4 post-penalty cost per sample.
        default: 0
      - name: superseded
        type: boolean
        source: computed
        description: True once a later LiftAnalysis for the same campaign_id supersedes this row.
        default: false
      - name: computed_at
        type: datetime
        source: system
        description: Logical-clock instant this analysis was computed.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Campaign
  - entity: Campaign
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCREENING_OPEN
        trigger: "POST /campaigns/{campaign_id}/open-screening"
        actor: CampaignManager
        preconditions:
          - "Campaign.status == DRAFT"
          - "count(KitLine where campaign_id == Campaign.id AND status == ACTIVE) >= 1, else ERR_CAMPAIGN_KIT_EMPTY"
        side_effects:
          - "recompute Campaign.kit_assembly_unit_cost_cents via calculation kit_assembly_unit_cost"
          - "set Campaign.budget_available_cents = Campaign.budget_total_cents - Campaign.budget_committed_cents"
          - "increment Campaign.version by 1"
      - from: SCREENING_OPEN
        to: SAMPLING_ACTIVE
        trigger: "POST /campaigns/{campaign_id}/activate-sampling"
        actor: CampaignManager
        preconditions:
          - "Campaign.status == SCREENING_OPEN"
          - "count(Enrollment where campaign_id == Campaign.id AND screening_status == SCREEN_PASSED) >= 1, else ERR_INVALID_CAMPAIGN_TRANSITION"
        side_effects:
          - "set Campaign.launched_by_user_id = X-User-ID of the acting CampaignManager"
          - "increment Campaign.version by 1"
        note: "Sample allocation (POST /sample-shipments) is only reachable from SAMPLING_ACTIVE."
      - from: SAMPLING_ACTIVE
        to: SUSPENDED
        trigger: "POST /campaigns/{campaign_id}/suspend"
        actor: ComplianceModerator
        preconditions:
          - "Campaign.status == SAMPLING_ACTIVE"
        side_effects:
          - "increment Campaign.version by 1"
        note: "Cycle leg 1 of 2 — SUSPENDED is not terminal."
      - from: SUSPENDED
        to: SAMPLING_ACTIVE
        trigger: "POST /campaigns/{campaign_id}/resume"
        actor: ComplianceModerator
        preconditions:
          - "Campaign.status == SUSPENDED"
          - "Campaign.compliance_posture != FROZEN, else ERR_CAMPAIGN_POSTURE_FROZEN"
        side_effects:
          - "increment Campaign.version by 1"
        note: "Cycle leg 2 of 2 — the campaign may suspend and resume any number of times."
      - from: SAMPLING_ACTIVE
        to: REVIEW_WINDOW
        trigger: "POST /campaigns/{campaign_id}/open-review-window"
        actor: CampaignManager
        preconditions:
          - "Campaign.status == SAMPLING_ACTIVE"
          - "count(SampleShipment of this campaign with status == ALLOCATED) == 0, else ERR_INVALID_CAMPAIGN_TRANSITION"
        side_effects:
          - "recompute Campaign.cost_per_sample_final_cents via calculation cost_per_sample variant final"
          - "increment Campaign.version by 1"
      - from: REVIEW_WINDOW
        to: CLOSED
        trigger: "POST /campaigns/{campaign_id}/close"
        actor: CampaignManager
        preconditions:
          - "Campaign.status == REVIEW_WINDOW"
          - "count(ReviewSubmission of this campaign with status == SUBMITTED) == 0, else ERR_INVALID_CAMPAIGN_TRANSITION"
        side_effects:
          - "for every Enrollment of this campaign with obligation_status == REVIEW_DUE: set obligation_status = FORFEITED"
          - "recompute Campaign.cost_per_sample_final_cents via calculation cost_per_sample variant final"
          - "set Campaign.closed_at = logical clock now"
          - "increment Campaign.version by 1"

  # --------------------------------------------------------------- KitLine
  - entity: KitLine
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /kit-lines/{kit_line_id}/retire"
        actor: CampaignManager
        preconditions:
          - "KitLine.status == ACTIVE, else ERR_INVALID_KIT_LINE_STATE"
          - "Campaign.status != CLOSED, else ERR_INVALID_CAMPAIGN_TRANSITION"
        side_effects:
          - "recompute Campaign.kit_assembly_unit_cost_cents via calculation kit_assembly_unit_cost (the retired line stops contributing cost); increment Campaign.version by 1"
          - "increment KitLine.version by 1"
        note: "A RETIRED line keeps whatever units_reserved it already carries; those reservations are released by the owning shipment's own cancel or wave release, so kit_unit_conservation still holds on the retired row. A RETIRED line is excluded from kit_assembly_unit_cost and from kit_reservation_selector's candidate set, so retiring every line of a campaign makes the reservation pool empty."

  # -------------------------------------------------------- FulfillmentWave
  - entity: FulfillmentWave
    state_field: status
    initial_state: PLANNED
    terminal_states: [RELEASED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /fulfillment-waves/{fulfillment_wave_id}/lock"
        actor: FulfillmentOps
        preconditions:
          - "FulfillmentWave.status == PLANNED"
          - "FulfillmentWave.planned_unit_count >= 1, else ERR_INVALID_WAVE_STATE"
        side_effects:
          - "increment FulfillmentWave.version by 1"
      - from: LOCKED
        to: PLANNED
        trigger: "system — cascade hop 2 of the shipment-cancellation chain, fired when the last ALLOCATED shipment leaves a LOCKED wave"
        actor: system
        preconditions:
          - "FulfillmentWave.status == LOCKED"
          - "FulfillmentWave.planned_unit_count reached 0 as a result of the cascade"
        side_effects:
          - "increment FulfillmentWave.version by 1"
          - "cascade hop 3: for the Campaign of the cancelled shipment's enrollment, decrement Campaign.allocated_sample_count by 1 and recompute Campaign.cost_per_sample_provisional_cents via calculation cost_per_sample variant provisional; increment Campaign.version by 1"
        note: "Unlock has no endpoint of its own — it is reachable only as the second hop of the ALLOCATED -> CANCELLED cascade."
      - from: LOCKED
        to: RELEASED
        trigger: "POST /fulfillment-waves/{fulfillment_wave_id}/release"
        actor: FulfillmentOps
        preconditions:
          - "FulfillmentWave.status == LOCKED"
        side_effects:
          - "for every SampleShipment of this wave with status == ALLOCATED: set status = SHIPPED, set shipped_at = logical clock now"
          - "for every KitLine id in each shipped shipment's reserved_line_units: decrement KitLine.units_reserved and increment KitLine.units_shipped by the mapped amount"
          - "set FulfillmentWave.shipped_unit_count = FulfillmentWave.planned_unit_count; set FulfillmentWave.planned_unit_count = 0"
          - "for every affected Enrollment: set obligation_status = SAMPLE_SENT"
          - "increment FulfillmentWave.version by 1"

  # ----------------------------------- Enrollment — axis 1: screening_status
  - entity: Enrollment
    state_field: screening_status
    initial_state: PENDING_SCREEN
    terminal_states: [SCREEN_REVOKED]
    transitions:
      - from: PENDING_SCREEN
        to: SCREEN_PASSED
        trigger: "POST /enrollments/{enrollment_id}/screen"
        actor: CampaignManager
        preconditions:
          - "Enrollment.screening_status == PENDING_SCREEN, else ERR_ENROLLMENT_NOT_SCREENABLE"
          - "Campaign.status IN {SCREENING_OPEN, SAMPLING_ACTIVE}, else ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS"
          - "Campaign.compliance_posture != FROZEN, else ERR_CAMPAIGN_POSTURE_FROZEN"
          - "Panelist.integrity_status == CLEAR, else screening_status becomes SCREEN_FAILED with reason INTEGRITY_HOLD"
          - "calculation eligibility_screening_decision returns PASS"
        side_effects:
          - "increment Enrollment.screen_attempt_count by 1"
          - "recompute Panelist.fraud_risk_score_screening via calculation panelist_fraud_risk_score variant screening; set Panelist.last_risk_scored_at = logical clock now"
          - "set Enrollment.fraud_score_at_screening = Panelist.fraud_risk_score_screening"
          - "set Enrollment.holdout_flag via calculation holdout_assignment"
          - "if holdout_flag became true: increment Campaign.holdout_enrollment_count by 1 and increment Campaign.version by 1"
          - "increment Enrollment.version by 1"
      - from: PENDING_SCREEN
        to: SCREEN_FAILED
        trigger: "POST /enrollments/{enrollment_id}/screen"
        actor: CampaignManager
        preconditions:
          - "Enrollment.screening_status == PENDING_SCREEN"
          - "calculation eligibility_screening_decision returns FAIL"
        side_effects:
          - "increment Enrollment.screen_attempt_count by 1"
          - "recompute Panelist.fraud_risk_score_screening via calculation panelist_fraud_risk_score variant screening"
          - "set Enrollment.screening_failure_reason to the first failing check per calculation eligibility_screening_decision"
          - "set Enrollment.fraud_score_at_screening = Panelist.fraud_risk_score_screening"
          - "increment Enrollment.version by 1"
      - from: SCREEN_FAILED
        to: PENDING_SCREEN
        trigger: "POST /enrollments/{enrollment_id}/resubmit-screening"
        actor: Panelist
        preconditions:
          - "Enrollment.screening_status == SCREEN_FAILED, else ERR_ENROLLMENT_NOT_SCREENABLE"
          - "X-User-ID == Enrollment.panelist_id, else ERR_NOT_RESOURCE_OWNER"
          - "Panelist.integrity_status != BANNED, else ERR_PANELIST_BANNED"
          - "Enrollment.screen_attempt_count < 3, else ERR_ENROLLMENT_NOT_SCREENABLE"
        side_effects:
          - "replace Enrollment.screening_answers with the request payload"
          - "set Enrollment.screening_failure_reason = null"
          - "increment Enrollment.version by 1"
        note: "Revision cycle: SCREEN_FAILED -> PENDING_SCREEN -> SCREEN_PASSED|SCREEN_FAILED, capped at 3 evaluated attempts."
      - from: SCREEN_PASSED
        to: SCREEN_REVOKED
        trigger: "system — cascade hop 2 of the diversion-substantiation chain, fired because the Panelist became BANNED"
        actor: system
        preconditions:
          - "Enrollment.screening_status == SCREEN_PASSED"
          - "Panelist.integrity_status transitioned to BANNED in cascade hop 1"
        side_effects:
          - "set Enrollment.obligation_status = FORFEITED unless it is already REVIEW_FULFILLED"
          - "cascade hop 3: for every ReviewSubmission of this enrollment with status IN {SUBMITTED, APPROVED}: set status = RETRACTED (see ReviewSubmission machine)"
          - "increment Enrollment.version by 1"
      - from: PENDING_SCREEN
        to: SCREEN_REVOKED
        trigger: "system — cascade hop 2 of the diversion-substantiation chain, fired because the Panelist became BANNED"
        actor: system
        preconditions:
          - "Enrollment.screening_status == PENDING_SCREEN"
          - "Panelist.integrity_status transitioned to BANNED in cascade hop 1"
        side_effects:
          - "set Enrollment.obligation_status = FORFEITED"
          - "increment Enrollment.version by 1"

  # --------------------------------- Enrollment — axis 2: obligation_status
  - entity: Enrollment
    state_field: obligation_status
    initial_state: NONE
    terminal_states: [REVIEW_FULFILLED, FORFEITED]
    transitions:
      - from: NONE
        to: SAMPLE_SENT
        trigger: "POST /fulfillment-waves/{fulfillment_wave_id}/release (wave LOCKED -> RELEASED)"
        actor: FulfillmentOps
        preconditions:
          - "Enrollment.obligation_status == NONE"
          - "a SampleShipment of this enrollment moved ALLOCATED -> SHIPPED in the same release"
        side_effects:
          - "increment Enrollment.version by 1"
        note: "Independent of screening_status, which stays SCREEN_PASSED throughout this axis."
      - from: SAMPLE_SENT
        to: REVIEW_DUE
        trigger: "POST /sample-shipments/{sample_shipment_id}/deliver"
        actor: FulfillmentOps
        preconditions:
          - "Enrollment.obligation_status == SAMPLE_SENT"
        side_effects:
          - "set Enrollment.review_due_at = delivered_at plus Campaign.review_due_days days"
          - "increment Enrollment.version by 1"
      - from: REVIEW_DUE
        to: REVIEW_FULFILLED
        trigger: "POST /review-submissions/{review_submission_id}/moderate with decision APPROVE"
        actor: ComplianceModerator
        preconditions:
          - "Enrollment.obligation_status == REVIEW_DUE"
        side_effects:
          - "increment Enrollment.version by 1"
      - from: SAMPLE_SENT
        to: FORFEITED
        trigger: "POST /sample-shipments/{sample_shipment_id}/report-lost"
        actor: FulfillmentOps
        preconditions:
          - "Enrollment.obligation_status == SAMPLE_SENT"
          - "no other SampleShipment of this enrollment is in status IN {ALLOCATED, SHIPPED, DELIVERED}"
        side_effects:
          - "increment Enrollment.version by 1"
        note: "A reship (POST /sample-shipments with supersedes_shipment_id) is the recovery path; it re-enters this axis at NONE -> SAMPLE_SENT."
      - from: FORFEITED
        to: NONE
        trigger: "POST /sample-shipments (reship with supersedes_shipment_id pointing at the LOST shipment)"
        actor: FulfillmentOps
        preconditions:
          - "Enrollment.obligation_status == FORFEITED"
          - "Enrollment.screening_status == SCREEN_PASSED"
          - "the superseded SampleShipment.status == LOST"
        side_effects:
          - "set SampleShipment.supersedes_shipment_id on the new shipment"
          - "increment Enrollment.version by 1"
        note: "Cycle: NONE -> SAMPLE_SENT -> FORFEITED -> NONE. The obligation axis loops while the screening axis stays put."
      - from: REVIEW_DUE
        to: FORFEITED
        trigger: "POST /campaigns/{campaign_id}/close (campaign REVIEW_WINDOW -> CLOSED)"
        actor: CampaignManager
        preconditions:
          - "Enrollment.obligation_status == REVIEW_DUE at campaign close"
        side_effects:
          - "increment Enrollment.version by 1"

  # --------------------------------------------------------- SampleShipment
  - entity: SampleShipment
    state_field: status
    initial_state: ALLOCATED
    terminal_states: [DELIVERED, LOST, CANCELLED]
    transitions:
      - from: null
        to: ALLOCATED
        trigger: "POST /sample-shipments"
        actor: FulfillmentOps
        preconditions:
          - "Campaign.status == SAMPLING_ACTIVE, else ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS"
          - "Campaign.compliance_posture != FROZEN, else ERR_CAMPAIGN_POSTURE_FROZEN"
          - "Enrollment.screening_status == SCREEN_PASSED, else ERR_INVALID_SHIPMENT_STATE"
          - "Enrollment.holdout_flag == false, else ERR_HOLDOUT_ENROLLMENT_NOT_SAMPLEABLE"
          - "Enrollment.obligation_status IN {NONE, FORFEITED}, else ERR_INVALID_SHIPMENT_STATE"
          - "payload expected_enrollment_version == Enrollment.version, else ERR_STALE_ENROLLMENT_VERSION"
          - "FulfillmentWave.status == PLANNED, else ERR_INVALID_WAVE_STATE"
          - "calculation wave_capacity_check passes both the per-wave and the center-aggregate ceiling"
          - "calculation kit_reservation_selector finds sufficient stock on every ACTIVE KitLine, else ERR_KIT_STOCK_INSUFFICIENT"
          - "Campaign.budget_available_cents >= committed_cost_cents, else ERR_CAMPAIGN_BUDGET_EXHAUSTED"
        side_effects:
          - "snapshot SampleShipment.reserved_line_units and kit_unit_total per calculation kit_reservation_selector"
          - "for every entry in reserved_line_units: decrement KitLine.units_available and increment KitLine.units_reserved by the mapped amount"
          - "set SampleShipment.committed_cost_cents = Campaign.kit_assembly_unit_cost_cents + FulfillmentCenter.freight_cents_per_kit"
          - "increment Campaign.budget_committed_cents and decrement Campaign.budget_available_cents by committed_cost_cents"
          - "increment FulfillmentWave.planned_unit_count by kit_unit_total; increment FulfillmentWave.version by 1"
          - "increment Campaign.allocated_sample_count by 1; recompute Campaign.cost_per_sample_provisional_cents via calculation cost_per_sample variant provisional; increment Campaign.version by 1"
          - "increment Enrollment.version by 1 (OCC advance for the reship-supersede rule)"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /sample-shipments/{sample_shipment_id}/cancel"
        actor: FulfillmentOps
        preconditions:
          - "SampleShipment.status == ALLOCATED, else ERR_INVALID_SHIPMENT_STATE"
        side_effects:
          - "cascade hop 1 (SampleShipment -> KitLine): for every entry in reserved_line_units, increment KitLine.units_available and decrement KitLine.units_reserved by exactly the mapped amount; increment each KitLine.version by 1"
          - "cascade hop 2 (KitLine release -> FulfillmentWave): because those units are no longer reserved, decrement FulfillmentWave.planned_unit_count by kit_unit_total; if the wave was LOCKED and planned_unit_count thereby reached 0, the wave auto-transitions LOCKED -> PLANNED; increment FulfillmentWave.version by 1"
          - "cascade hop 3 (FulfillmentWave planned-unit change -> Campaign): decrement Campaign.allocated_sample_count by 1, decrement Campaign.budget_committed_cents and increment Campaign.budget_available_cents by exactly SampleShipment.committed_cost_cents, recompute Campaign.cost_per_sample_provisional_cents via calculation cost_per_sample variant provisional; increment Campaign.version by 1"
          - "increment SampleShipment.version by 1"
        note: "Depth-3 transitive cascade. Each hop is caused by the previous hop's mutation, not by the cancel call itself. Both conserved quantities (KitLine units and Campaign budget cents) return to their pre-allocation values."
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /fulfillment-waves/{fulfillment_wave_id}/release (wave LOCKED -> RELEASED); every ALLOCATED shipment in the wave moves together"
        actor: FulfillmentOps
        preconditions:
          - "SampleShipment.fulfillment_wave_id == the released wave and SampleShipment.status == ALLOCATED"
          - "FulfillmentWave.status == LOCKED, else ERR_INVALID_WAVE_STATE"
        side_effects:
          - "set SampleShipment.shipped_at = logical clock now"
          - "for every entry in reserved_line_units: decrement KitLine.units_reserved and increment KitLine.units_shipped by the mapped amount; increment each KitLine.version by 1"
          - "advance the owning Enrollment obligation axis NONE -> SAMPLE_SENT"
          - "increment FulfillmentWave.shipped_unit_count by kit_unit_total and reset FulfillmentWave.planned_unit_count to 0"
          - "increment SampleShipment.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /sample-shipments/{sample_shipment_id}/deliver"
        actor: FulfillmentOps
        preconditions:
          - "SampleShipment.status == SHIPPED, else ERR_INVALID_SHIPMENT_STATE"
        side_effects:
          - "set SampleShipment.delivered_at = logical clock now"
          - "increment Campaign.delivered_sample_count by 1; recompute Campaign.cost_per_sample_final_cents via calculation cost_per_sample variant final; recompute Campaign.compliance_posture via calculation campaign_compliance_posture; increment Campaign.version by 1"
          - "advance the owning Enrollment obligation axis SAMPLE_SENT -> REVIEW_DUE"
          - "increment SampleShipment.version by 1"
      - from: SHIPPED
        to: LOST
        trigger: "POST /sample-shipments/{sample_shipment_id}/report-lost"
        actor: FulfillmentOps
        preconditions:
          - "SampleShipment.status == SHIPPED, else ERR_INVALID_SHIPMENT_STATE"
        side_effects:
          - "recompute Campaign.cost_per_sample_final_cents via calculation cost_per_sample variant final (LOST cost stays in the numerator, leaves the denominator)"
          - "increment Campaign.version by 1"
          - "advance the owning Enrollment obligation axis SAMPLE_SENT -> FORFEITED when no sibling shipment remains in {ALLOCATED, SHIPPED, DELIVERED}"
          - "increment SampleShipment.version by 1"

  # ------------------------------------------------------- ReviewSubmission
  - entity: ReviewSubmission
    state_field: status
    initial_state: DRAFT
    terminal_states: [DISCLOSURE_REJECTED, RETRACTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /review-submissions/{review_submission_id}/submit"
        actor: Panelist
        preconditions:
          - "ReviewSubmission.status == DRAFT, else ERR_INVALID_REVIEW_STATE"
          - "X-User-ID == Enrollment.panelist_id of the review's enrollment, else ERR_NOT_RESOURCE_OWNER"
          - "Panelist.integrity_status != BANNED, else ERR_PANELIST_BANNED"
          - "Campaign.status IN {SAMPLING_ACTIVE, REVIEW_WINDOW}, else ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS"
          - "Enrollment.obligation_status == REVIEW_DUE, else ERR_ENROLLMENT_NOT_ELIGIBLE_FOR_REVIEW"
          - "honest_opinion_attested == true, else ERR_HONEST_OPINION_NOT_ATTESTED"
          - "disclosure_statement contains a REQUIRED_DISCLOSURE_PHRASE, else ERR_DISCLOSURE_STATEMENT_MISSING"
          - "word_count >= Campaign.min_review_word_count, else ERR_REVIEW_TOO_SHORT"
        side_effects:
          - "set ReviewSubmission.first_submitted_at = logical clock now when it is null"
          - "increment ReviewSubmission.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /review-submissions/{review_submission_id}/moderate with decision APPROVE"
        actor: ComplianceModerator
        preconditions:
          - "ReviewSubmission.status == SUBMITTED, else ERR_INVALID_REVIEW_STATE"
          - "X-User-ID != ReviewSubmission.changes_requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set ReviewSubmission.approved_by_user_id = X-User-ID; set moderator_note from payload"
          - "increment Campaign.approved_review_count by 1; increment Campaign.version by 1"
          - "advance the owning Enrollment obligation axis REVIEW_DUE -> REVIEW_FULFILLED"
          - "increment ReviewSubmission.version by 1"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /review-submissions/{review_submission_id}/moderate with decision REQUEST_CHANGES"
        actor: ComplianceModerator
        preconditions:
          - "ReviewSubmission.status == SUBMITTED, else ERR_INVALID_REVIEW_STATE"
        side_effects:
          - "set ReviewSubmission.changes_requested_by_user_id = X-User-ID; set moderator_note from payload"
          - "increment ReviewSubmission.version by 1"
        note: "Branch 1 of 3 out of SUBMITTED; opens the revision cycle."
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /review-submissions/{review_submission_id}/revise"
        actor: Panelist
        preconditions:
          - "ReviewSubmission.status == CHANGES_REQUESTED, else ERR_INVALID_REVIEW_STATE"
          - "X-User-ID == Enrollment.panelist_id of the review's enrollment, else ERR_NOT_RESOURCE_OWNER"
          - "word_count of the new body_text >= Campaign.min_review_word_count, else ERR_REVIEW_TOO_SHORT"
          - "disclosure_statement contains a REQUIRED_DISCLOSURE_PHRASE, else ERR_DISCLOSURE_STATEMENT_MISSING"
        side_effects:
          - "replace headline, body_text, star_rating, disclosure_statement from payload; recompute word_count"
          - "increment ReviewSubmission.revision_count by 1"
          - "leave ReviewSubmission.first_submitted_at untouched"
          - "increment ReviewSubmission.version by 1"
        note: "Cycle leg: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED, repeatable without limit."
      - from: SUBMITTED
        to: DISCLOSURE_REJECTED
        trigger: "POST /review-submissions/{review_submission_id}/moderate with decision REJECT_DISCLOSURE"
        actor: ComplianceModerator
        preconditions:
          - "ReviewSubmission.status == SUBMITTED, else ERR_INVALID_REVIEW_STATE"
        side_effects:
          - "set ReviewSubmission.moderator_note from payload"
          - "increment Campaign.disclosure_rejected_review_count by 1; recompute Campaign.compliance_posture via calculation campaign_compliance_posture; increment Campaign.version by 1"
          - "increment ReviewSubmission.version by 1"
        note: "Branch 3 of 3 out of SUBMITTED; terminal — moderation of ineligible content."
      - from: APPROVED
        to: RETRACTED
        trigger: "system — cascade hop 3 of the diversion-substantiation chain, fired because the owning Enrollment became SCREEN_REVOKED"
        actor: system
        preconditions:
          - "ReviewSubmission.status == APPROVED"
          - "Enrollment.screening_status transitioned to SCREEN_REVOKED in cascade hop 2"
        side_effects:
          - "decrement Campaign.approved_review_count by 1; increment Campaign.version by 1"
          - "cascade hop 4: for every SyndicationRecord of this review with status == SYNDICATED: set status = TAKEDOWN_REQUESTED (see SyndicationRecord machine)"
          - "increment ReviewSubmission.version by 1"
      - from: SUBMITTED
        to: RETRACTED
        trigger: "system — cascade hop 3 of the diversion-substantiation chain, fired because the owning Enrollment became SCREEN_REVOKED"
        actor: system
        preconditions:
          - "ReviewSubmission.status == SUBMITTED"
          - "Enrollment.screening_status transitioned to SCREEN_REVOKED in cascade hop 2"
        side_effects:
          - "increment ReviewSubmission.version by 1"

  # ------------------------------------------------------ SyndicationRecord
  - entity: SyndicationRecord
    state_field: status
    initial_state: QUEUED
    terminal_states: [REJECTED, TAKEDOWN_REQUESTED]
    transitions:
      - from: QUEUED
        to: SYNDICATED
        trigger: "POST /syndication-records/{syndication_record_id}/dispatch"
        actor: FulfillmentOps
        preconditions:
          - "SyndicationRecord.status == QUEUED, else ERR_INVALID_SYNDICATION_STATE"
          - "ReviewSubmission.status == APPROVED, else ERR_INVALID_REVIEW_STATE"
          - "Campaign.compliance_posture == OPEN, else ERR_CAMPAIGN_POSTURE_RESTRICTED (RESTRICTED) or ERR_CAMPAIGN_POSTURE_FROZEN (FROZEN)"
          - "Retailer.feed_status == ACCEPTING, else ERR_RETAILER_FEED_PAUSED"
          - "calculation syndication_eligibility returns ACCEPT"
        side_effects:
          - "set SyndicationRecord.syndicated_at = logical clock now"
          - "increment Campaign.syndicated_review_count by 1; increment Campaign.version by 1"
          - "increment SyndicationRecord.version by 1"
      - from: QUEUED
        to: REJECTED
        trigger: "POST /syndication-records/{syndication_record_id}/dispatch"
        actor: FulfillmentOps
        preconditions:
          - "SyndicationRecord.status == QUEUED"
          - "Retailer.feed_status == ACCEPTING"
          - "calculation syndication_eligibility returns REJECT with a reason"
        side_effects:
          - "set SyndicationRecord.rejection_reason to the first failing retailer rule per calculation syndication_eligibility"
          - "increment SyndicationRecord.version by 1"
        note: "Branch sibling of QUEUED -> SYNDICATED with a disjoint side-effect set: no campaign counter moves."
      - from: SYNDICATED
        to: TAKEDOWN_REQUESTED
        trigger: "system — cascade hop 4 of the diversion-substantiation chain, fired because the source ReviewSubmission became RETRACTED"
        actor: system
        preconditions:
          - "SyndicationRecord.status == SYNDICATED"
          - "ReviewSubmission.status transitioned to RETRACTED in cascade hop 3"
        side_effects:
          - "set SyndicationRecord.takedown_requested_at = logical clock now"
          - "decrement Campaign.syndicated_review_count by 1; increment Campaign.version by 1"
          - "increment SyndicationRecord.version by 1"

  # ----------------------------------------------------------- DiversionCase
  - entity: DiversionCase
    state_field: status
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /diversion-cases/{diversion_case_id}/investigate"
        actor: ComplianceModerator
        preconditions:
          - "DiversionCase.status == OPEN, else ERR_INVALID_DIVERSION_CASE_STATE"
        side_effects:
          - "the status write to INVESTIGATING happens FIRST, so this case itself is already counted by the audit score's open_cases term"
          - "recompute Panelist.fraud_risk_score_audit via calculation panelist_fraud_risk_score variant audit; set Panelist.last_risk_scored_at = logical clock now"
          - "if Panelist.fraud_risk_score_audit >= 55.0 and integrity_status == CLEAR: set Panelist.integrity_status = FLAGGED; increment Panelist.version by 1"
          - "increment DiversionCase.version by 1"
      - from: INVESTIGATING
        to: OPEN
        trigger: "POST /diversion-cases/{diversion_case_id}/reopen"
        actor: ComplianceModerator
        preconditions:
          - "DiversionCase.status == INVESTIGATING, else ERR_INVALID_DIVERSION_CASE_STATE"
        side_effects:
          - "increment DiversionCase.reopen_count by 1"
          - "increment DiversionCase.version by 1"
        note: "Cycle: OPEN -> INVESTIGATING -> OPEN, repeatable; the audit rescore re-runs on every re-entry to INVESTIGATING."
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /diversion-cases/{diversion_case_id}/dismiss"
        actor: ComplianceModerator
        preconditions:
          - "DiversionCase.status == INVESTIGATING, else ERR_INVALID_DIVERSION_CASE_STATE"
        side_effects:
          - "if the panelist has no other DiversionCase with status IN {INVESTIGATING, SUBSTANTIATED} and integrity_status == FLAGGED: set Panelist.integrity_status = CLEAR; increment Panelist.version by 1"
          - "increment DiversionCase.version by 1"
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /diversion-cases/{diversion_case_id}/substantiate"
        actor: ComplianceModerator
        preconditions:
          - "DiversionCase.status == INVESTIGATING, else ERR_INVALID_DIVERSION_CASE_STATE"
          - "X-User-ID != DiversionCase.opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set DiversionCase.substantiated_at = logical clock now"
          - "direct (non-chain) effect: increment Campaign.substantiated_diversion_count by 1 and recompute Campaign.compliance_posture via calculation campaign_compliance_posture; increment Campaign.version by 1"
          - "cascade hop 1 (DiversionCase -> Panelist): increment Panelist.diversion_strikes by 1 and set Panelist.integrity_status = BANNED; increment Panelist.version by 1"
          - "cascade hop 2 (Panelist BANNED -> Enrollment): because the panelist is now BANNED, every Enrollment of that panelist with screening_status IN {PENDING_SCREEN, SCREEN_PASSED} moves to SCREEN_REVOKED and its obligation_status becomes FORFEITED unless already REVIEW_FULFILLED"
          - "cascade hop 3 (Enrollment SCREEN_REVOKED -> ReviewSubmission): because those enrollments are revoked, every ReviewSubmission of theirs with status IN {SUBMITTED, APPROVED} moves to RETRACTED and Campaign.approved_review_count is decremented for each previously APPROVED review"
          - "cascade hop 4 (ReviewSubmission RETRACTED -> SyndicationRecord): because those reviews are retracted, every SyndicationRecord of theirs with status == SYNDICATED moves to TAKEDOWN_REQUESTED and Campaign.syndicated_review_count is decremented for each"
          - "increment DiversionCase.version by 1"
        note: "Depth-4 transitive cascade with each hop caused by the previous hop's mutation; distinct from the shipment-cancellation cascade in both origin and propagation pattern."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: lift-analysis-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /lift-analyses"
    occ_field: "expected_campaign_version"
    description: |
      Creating a LiftAnalysis against a Campaign whose version has advanced since
      the client last observed it is rejected. A newly created LiftAnalysis
      legitimately supersedes the campaign's prior analysis (setting
      superseded = true on it), so a writer holding a stale view of the campaign
      would silently overwrite measurement that already reflects newer delivery,
      diversion and syndication counters.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

  - rule_id: reship-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /sample-shipments"
    occ_field: "expected_enrollment_version"
    description: |
      Allocating a SampleShipment against an Enrollment whose version has advanced
      since the client last observed it is rejected. A reship carrying
      supersedes_shipment_id legitimately supersedes a LOST shipment and moves the
      obligation axis back to NONE, so an allocation built on a stale view of the
      enrollment would double-commit budget and kit units against an obligation
      state that no longer holds.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: kit_assembly_unit_cost
    trigger: "On POST /kit-lines, on POST /campaigns/{campaign_id}/open-screening, and on any change to a KitLine's cost inputs; writes KitLine.extended_cost_cents and Campaign.kit_assembly_unit_cost_cents."
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round per line, THEN sum. The alternative
      # (sum the unrounded extended costs, then round once) is explicitly NOT
      # used and produces a different value whenever the discarded per-line
      # fractions accumulate past half a cent.
      lines = [ kl for kl in KitLine
                if kl.campaign_id == C.id and kl.status == 'ACTIVE' ]
      lines = sort(lines, key=(created_at ASC, component_sku ASC))
      for kl in lines:
          raw = kl.unit_cost_cents * kl.quantity_per_kit * (1 - kl.component_discount_pct)
          kl.extended_cost_cents = ROUND_HALF_UP(raw, 0)      # STEP 1: per line
      C.kit_assembly_unit_cost_cents = SUM(kl.extended_cost_cents for kl in lines)  # STEP 2
      # RETIRED lines contribute neither cost nor reservation.
    input_set: "KitLine rows of the campaign with status == ACTIVE; RETIRED lines excluded."
    constants: {}
    precision: "whole cents, ROUND_HALF_UP applied per line before summation"

  - name: cost_per_sample
    trigger: "Provisional variant recomputed on POST /sample-shipments and on POST /sample-shipments/{id}/cancel. Final variant recomputed on POST /sample-shipments/{id}/deliver, POST /sample-shipments/{id}/report-lost, POST /kit-lines/{id}/write-offs, POST /campaigns/{id}/open-review-window and POST /campaigns/{id}/close."
    algorithm: aggregation
    formula: |
      # Shared helper: the freight of a shipment is the freight of the center
      # that owns the shipment's wave.
      freight(s) = FulfillmentCenter[ FulfillmentWave[s.fulfillment_wave_id]
                                      .fulfillment_center_id ].freight_cents_per_kit

      # ---- variant provisional ------------------------------------------
      P = [ s for s in SampleShipment
            if Enrollment[s.enrollment_id].campaign_id == C.id
            and s.status in {'ALLOCATED','SHIPPED','DELIVERED','LOST'} ]
      if len(P) == 0: C.cost_per_sample_provisional_cents = 0
      else:
        numer = SUM( C.kit_assembly_unit_cost_cents + freight(s) for s in P )
        C.cost_per_sample_provisional_cents = ROUND_HALF_UP(numer / len(P), 0)

      # ---- variant final ------------------------------------------------
      F_num = [ s for s in SampleShipment
                if Enrollment[s.enrollment_id].campaign_id == C.id
                and s.status in {'DELIVERED','LOST'} ]
      F_den = [ s for s in F_num if s.status == 'DELIVERED' ]
      if len(F_den) == 0: C.cost_per_sample_final_cents = 0
      else:
        numer = SUM( C.kit_assembly_unit_cost_cents + freight(s) + s.surcharge_cents
                     for s in F_num ) + C.write_off_cost_cents
        C.cost_per_sample_final_cents = ROUND_HALF_UP(numer / len(F_den), 0)
    input_set: "Provisional includes ALLOCATED, SHIPPED, DELIVERED and LOST shipments in both numerator and denominator and ignores surcharges and write-offs. Final keeps LOST and DELIVERED cost in the numerator, counts only DELIVERED in the denominator, and adds per-shipment surcharge_cents plus Campaign.write_off_cost_cents."
    constants: {}
    precision: "whole cents, ROUND_HALF_UP on the single final division"
    variants:
      - name: provisional
        when: "Allocation-time cost accounting on Campaign; refreshed on every allocation and cancellation."
        difference: "Denominator counts every non-cancelled shipment regardless of outcome; numerator excludes surcharges and write-offs."
      - name: final
        when: "Landed-cost accounting on Campaign; refreshed on delivery, loss, write-off, review-window opening and close."
        difference: "LOST shipments stay in the numerator but leave the denominator, and surcharges plus write-off cost enter the numerator — so the same shipment set yields a strictly larger figure whenever any shipment is LOST or carries a surcharge."

  - name: panelist_fraud_risk_score
    trigger: "Screening variant on POST /enrollments/{enrollment_id}/screen and on POST /panelists/{panelist_id}/risk-rescore with variant SCREENING. Audit variant on POST /diversion-cases/{id}/investigate and on POST /panelists/{panelist_id}/risk-rescore with variant AUDIT."
    algorithm: weighted_scoring
    formula: |
      addr_collisions = count( p2 in Panelist
                               if p2.id != p.id
                               and p2.address_hash == p.address_hash
                               and p2.integrity_status in {'CLEAR','FLAGGED','BANNED'} )
      addr_base   = W_ADDR * min(3, addr_collisions) / 3
      age_days    = floor( (clock_now - p.account_opened_at) / 86400 seconds )
      age_term    = W_AGE if age_days < ACCOUNT_AGE_FLOOR_DAYS else 0
      strike_term = min( W_STRIKE, W_STRIKE * p.diversion_strikes / 2 )
      ref_term    = W_REFERRAL if ( p.referred_by_panelist_id is not null
                                    and Panelist[p.referred_by_panelist_id].integrity_status
                                        in {'FLAGGED','BANNED'} ) else 0

      # ---- variant screening --------------------------------------------
      raw_screening = addr_base + age_term + strike_term + ref_term
      p.fraud_risk_score_screening = ROUND_HALF_UP( min(100.0, raw_screening), 1 )

      # ---- variant audit ------------------------------------------------
      recent_reviews = count( r in ReviewSubmission
                              if Enrollment[r.enrollment_id].panelist_id == p.id
                              and r.status in {'SUBMITTED','APPROVED','RETRACTED'}
                              and r.first_submitted_at is not null
                              and (clock_now - 7 days) <= r.first_submitted_at <= clock_now )
      vel_term    = W_VELOCITY if recent_reviews >= VELOCITY_TRIP_COUNT else 0
      open_cases  = count( d in DiversionCase
                           if d.panelist_id == p.id
                           and d.status in {'INVESTIGATING','SUBSTANTIATED'} )
      resale_term = W_RESALE * min(2, open_cases) / 2
      raw_audit   = AUDIT_ADDR_MULTIPLIER * addr_base + age_term + strike_term
                    + ref_term + vel_term + resale_term
      p.fraud_risk_score_audit = ROUND_HALF_UP( min(100.0, raw_audit), 1 )
    input_set: "All Panelist rows sharing the address_hash (any integrity_status) for the collision term; the panelist's own DiversionCases in INVESTIGATING or SUBSTANTIATED for the resale term; ReviewSubmissions whose first_submitted_at falls in the closed trailing 7-day window ending at the logical clock for the velocity term."
    constants:
      W_ADDR: 18
      W_AGE: 22
      W_STRIKE: 25
      W_REFERRAL: 15
      W_VELOCITY: 20
      W_RESALE: 30
      ACCOUNT_AGE_FLOOR_DAYS: 30
      VELOCITY_TRIP_COUNT: 3
      AUDIT_ADDR_MULTIPLIER: 1.5
      FLAG_THRESHOLD_INCLUSIVE: 55.0
    precision: "1 decimal place, ROUND_HALF_UP, clamped to [0.0, 100.0]"
    variants:
      - name: screening
        when: "Pre-sampling eligibility screening; only signals observable before a sample ships."
        difference: "Uses addr_base at weight 1.0 and omits the review-velocity and resale terms entirely."
      - name: audit
        when: "Post-campaign fraud audit on a Panelist, run when a diversion case moves to INVESTIGATING or on an explicit rescore."
        difference: "Re-weights addr_base by AUDIT_ADDR_MULTIPLIER (1.5) and adds vel_term and resale_term, so the identical panelist row scores strictly higher whenever any collision, review-velocity or open-case signal exists."

  - name: eligibility_screening_decision
    trigger: "On POST /enrollments/{enrollment_id}/screen, after Panelist.fraud_risk_score_screening has been recomputed; decides PENDING_SCREEN -> SCREEN_PASSED vs SCREEN_FAILED and writes Enrollment.screening_status and Enrollment.screening_failure_reason."
    algorithm: threshold
    formula: |
      # The four checks are evaluated in THIS PINNED ORDER; the FIRST failing
      # check supplies screening_failure_reason and no later check is evaluated.
      # None of these outcomes is an HTTP error: a failed screen is a 200
      # response carrying screening_status == SCREEN_FAILED.
      p = Panelist[e.panelist_id]
      C = Campaign[e.campaign_id]
      # check 1
      if p.integrity_status != 'CLEAR':
          return FAIL('INTEGRITY_HOLD')
      # check 2
      if p.segment_code not in C.target_segment_codes:
          return FAIL('SEGMENT_MISMATCH')
      # check 3 — inclusive threshold on the freshly recomputed screening score
      if p.fraud_risk_score_screening >= FLAG_THRESHOLD_INCLUSIVE:
          return FAIL('FRAUD_SCORE_TOO_HIGH')
      # check 4
      if calculation panelist_cooldown_overlap returns CONFLICT:
          return FAIL('COOLDOWN_CONFLICT')
      return PASS
    input_set: "The enrollment's own Panelist row (integrity_status, segment_code, fraud_risk_score_screening as just recomputed by calculation panelist_fraud_risk_score variant screening), the enrollment's Campaign.target_segment_codes, and the panelist's other SCREEN_PASSED Enrollments via calculation panelist_cooldown_overlap."
    constants:
      FLAG_THRESHOLD_INCLUSIVE: 55.0
    precision: "score comparison inclusive at 1 decimal place (score == 55.0 FAILS); check order is pinned 1 -> 2 -> 3 -> 4"

  - name: panelist_cooldown_overlap
    trigger: "Evaluated inside eligibility_screening_decision on POST /enrollments/{enrollment_id}/screen."
    algorithm: interval_merge
    formula: |
      # CLOSED-interval semantics with a trailing exclusivity buffer on the
      # PANELIST resource. The prior campaign occupies
      #   [ prior.sampling_window_start , prior.sampling_window_end + BUFFER_DAYS ]
      # inclusive at BOTH ends. The candidate campaign occupies
      #   [ cand.sampling_window_start , cand.sampling_window_end ] inclusive.
      # Touching at a single instant therefore COUNTS as a collision:
      #   cand.start == prior.end + BUFFER_DAYS  ->  CONFLICT
      #   cand.start == prior.end + BUFFER_DAYS + 1 second -> NO CONFLICT
      prior = [ e2 for e2 in Enrollment
                if e2.panelist_id == e.panelist_id
                and e2.id != e.id
                and e2.screening_status == 'SCREEN_PASSED' ]
      for e2 in sort(prior, key=created_at ASC):
          pc = Campaign[e2.campaign_id]
          occupied_from = pc.sampling_window_start
          occupied_to   = pc.sampling_window_end + PANELIST_COOLDOWN_DAYS days
          if cand.sampling_window_start <= occupied_to
             and cand.sampling_window_end >= occupied_from:
              return CONFLICT with e2
      return NO_CONFLICT
    input_set: "Only Enrollment rows of the same panelist with screening_status == SCREEN_PASSED; PENDING_SCREEN, SCREEN_FAILED and SCREEN_REVOKED enrollments never occupy the panelist."
    constants:
      PANELIST_COOLDOWN_DAYS: 14
    precision: "second resolution on ISO 8601 UTC instants; both interval ends inclusive"

  - name: wave_capacity_check
    trigger: "On POST /sample-shipments, before any reservation is written."
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics with AGGREGATE capacity on the
      # FULFILLMENT-CENTER resource. A wave occupies [window_start, window_end).
      # Adjacency is therefore free: V.window_end == W.window_start -> NO overlap.
      # Capacity is checked twice against two different ceilings.
      W  = FulfillmentWave[payload.fulfillment_wave_id]
      u  = kit_unit_total of the shipment being allocated   # from kit_reservation_selector
      # ceiling 1 — per-wave
      if W.planned_unit_count + u > W.planned_capacity_units:
          return ERR_WAVE_CAPACITY_EXCEEDED
      # ceiling 2 — center aggregate over all time-overlapping waves
      O = [ V for V in FulfillmentWave
            if V.fulfillment_center_id == W.fulfillment_center_id
            and V.status in {'PLANNED','LOCKED'}
            and V.window_start < W.window_end
            and V.window_end   > W.window_start ]          # W itself is in O
      occupied = SUM( V.planned_unit_count for V in O )
      if occupied + u > FulfillmentCenter[W.fulfillment_center_id].daily_pick_capacity_units:
          return ERR_CENTER_CAPACITY_EXCEEDED
      return OK
    input_set: "FulfillmentWave rows of the same center with status IN {PLANNED, LOCKED}; RELEASED waves have planned_unit_count == 0 and are excluded from the overlap set."
    constants: {}
    precision: "second resolution; window_start inclusive, window_end exclusive"

  - name: kit_reservation_selector
    trigger: "On POST /sample-shipments, to decide which KitLine rows are debited and by how much."
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter
      candidates = [ kl for kl in KitLine
                     if kl.campaign_id == Enrollment[payload.enrollment_id].campaign_id
                     and kl.status == 'ACTIVE' ]
      # (d) empty-pool fallback
      if len(candidates) == 0: return ERR_CAMPAIGN_KIT_EMPTY
      # (b) ranking expression / debit order, (c) tie-break
      order = sort(candidates, key=(created_at ASC, component_sku ASC))
      # all-or-nothing: no partial reservation is ever written
      for kl in order:
          if kl.units_available < kl.quantity_per_kit:
              return ERR_KIT_STOCK_INSUFFICIENT   # naming the FIRST short line in `order`
      reserved_line_units = { kl.id: kl.quantity_per_kit for kl in order }
      kit_unit_total = SUM(kl.quantity_per_kit for kl in order)
      return reserved_line_units, kit_unit_total
    input_set: "KitLine rows of the shipment's campaign with status == ACTIVE, debited in created_at ASC order with component_sku ASC as tie-break."
    constants: {}
    precision: "integer units; all-or-nothing — a failing line leaves every KitLine untouched"

  - name: holdout_assignment
    trigger: "On the PENDING_SCREEN -> SCREEN_PASSED transition of POST /enrollments/{enrollment_id}/screen; writes Enrollment.holdout_flag."
    algorithm: threshold
    formula: |
      # Deterministic (no randomness) staircase allocation over the campaign's
      # 1-based enrollment ordinal. Assigns exactly floor(n * holdout_pct)
      # holdouts among the first n enrollments.
      n = e.enrollment_seq
      e.holdout_flag = ( floor(n * C.holdout_pct) > floor((n - 1) * C.holdout_pct) )
    input_set: "Enrollment.enrollment_seq (assigned as Campaign.enrollment_count + 1 at creation) and Campaign.holdout_pct; no other row participates."
    constants: {}
    precision: "exact integer floor on the product of a 1-based ordinal and a 4-decimal fraction"

  - name: campaign_compliance_posture
    trigger: "Recomputed on POST /diversion-cases/{id}/substantiate, on POST /sample-shipments/{id}/deliver and on POST /review-submissions/{id}/moderate with decision REJECT_DISCLOSURE; writes Campaign.compliance_posture."
    algorithm: threshold
    formula: |
      substantiated = C.substantiated_diversion_count
      delivered     = C.delivered_sample_count
      diversion_rate = 0.0 if delivered == 0
                       else ROUND_HALF_UP(substantiated / delivered, 4)
      if diversion_rate >= FROZEN_RATE or substantiated >= FROZEN_ABS:
          C.compliance_posture = 'FROZEN'
      elif diversion_rate >= RESTRICTED_RATE
           or C.disclosure_rejected_review_count >= RESTRICTED_DISCLOSURE_ABS:
          C.compliance_posture = 'RESTRICTED'
      else:
          C.compliance_posture = 'OPEN'
      # Gates (enforced by validations priority 13/14):
      #   FROZEN     blocks POST /enrollments/{id}/screen, POST /sample-shipments,
      #              POST /campaigns/{id}/resume and syndication dispatch.
      #   RESTRICTED blocks syndication dispatch only.
    input_set: "Campaign.substantiated_diversion_count, Campaign.delivered_sample_count and Campaign.disclosure_rejected_review_count — all maintained as counters by the transitions listed in the trigger."
    constants:
      FROZEN_RATE: 0.2
      FROZEN_ABS: 5
      RESTRICTED_RATE: 0.05
      RESTRICTED_DISCLOSURE_ABS: 3
    precision: "diversion_rate at 4 decimal places, ROUND_HALF_UP; both rate comparisons are inclusive (>=)"

  - name: review_disclosure_gate
    trigger: "On POST /review-submissions/{review_submission_id}/submit and on POST /review-submissions/{review_submission_id}/revise."
    algorithm: threshold
    formula: |
      word_count = len( [ t for t in body_text.split(on any run of whitespace) if t != '' ] )
      # order of checks is pinned by validations priorities 15, 16 and 17
      if honest_opinion_attested != true:            return ERR_HONEST_OPINION_NOT_ATTESTED
      if disclosure_statement is null or none of REQUIRED_DISCLOSURE_PHRASES
         appears as a case-insensitive substring of disclosure_statement:
                                                     return ERR_DISCLOSURE_STATEMENT_MISSING
      if word_count < C.min_review_word_count:        return ERR_REVIEW_TOO_SHORT
      return OK        # word_count == C.min_review_word_count PASSES (inclusive)
    input_set: "The submitted body_text, disclosure_statement and honest_opinion_attested of this ReviewSubmission plus Campaign.min_review_word_count."
    constants:
      REQUIRED_DISCLOSURE_PHRASES:
        - "i received this product for free"
        - "sample provided by"
    precision: "integer word count; the threshold comparison is inclusive (word_count >= min passes)"

  - name: syndication_eligibility
    trigger: "On POST /syndication-records/{syndication_record_id}/dispatch."
    algorithm: threshold
    formula: |
      r  = ReviewSubmission[sr.review_submission_id]
      rt = Retailer[sr.retailer_id]
      p  = Enrollment[r.enrollment_id].panelist_id
      # checks evaluated in this pinned order; first failure wins
      if r.star_rating < rt.min_star_rating_accepted:
          return REJECT('BELOW_MIN_RATING')
      # The retailer badge standard is STRICTER than the submit-time gate: the
      # submit gate (calculation review_disclosure_gate) accepts EITHER member of
      # REQUIRED_DISCLOSURE_PHRASES, while a retailer demanding the badge accepts
      # only BADGE_PHRASE. A review that legitimately cleared submission with
      # 'Sample provided by ...' therefore still fails this check.
      if rt.requires_disclosure_badge == true
         and ( r.disclosure_statement is null
               or BADGE_PHRASE not in lowercase(r.disclosure_statement) ):
          return REJECT('DISCLOSURE_BADGE_MISSING')
      recent = count( sr2 in SyndicationRecord
                      if sr2.retailer_id == rt.id
                      and sr2.status == 'SYNDICATED'
                      and Enrollment[ ReviewSubmission[sr2.review_submission_id]
                                      .enrollment_id ].panelist_id == p
                      and (clock_now - 30 days) <= sr2.syndicated_at <= clock_now )
      if recent >= rt.max_reviews_per_panelist_per_month:
          return REJECT('PANELIST_RATE_LIMIT')
      return ACCEPT
    input_set: "SyndicationRecord rows for the same retailer and same panelist with status == SYNDICATED whose syndicated_at falls in the closed trailing 30-day window ending at the logical clock; TAKEDOWN_REQUESTED and REJECTED rows are excluded."
    constants:
      RATE_LIMIT_WINDOW_DAYS: 30
      BADGE_PHRASE: 'i received this product for free'
    precision: "integer counts; the rate-limit comparison is inclusive (recent >= max rejects); BADGE_PHRASE is matched as a case-insensitive substring"

  - name: campaign_lift_and_diversion_penalty
    trigger: "On POST /lift-analyses; writes every computed field of the new LiftAnalysis row."
    algorithm: forward_looking
    formula: |
      # ---------- part A: conversion lift against the holdout group ----------
      conv_window_end = C.sampling_window_end + CONVERSION_TAIL_DAYS days
      qualified(e) = exists pm in PurchaseMatch
                     with pm.enrollment_id == e.id
                     and pm.match_confidence >= MATCH_CONFIDENCE_FLOOR
                     and C.sampling_window_start <= pm.purchased_at <= conv_window_end
      holdout = [ e for e in Enrollment if e.campaign_id == C.id
                  and e.holdout_flag == true
                  and e.screening_status == 'SCREEN_PASSED' ]
      if variant == 'ITT':
          treated = [ e for e in Enrollment if e.campaign_id == C.id
                      and e.holdout_flag == false
                      and e.screening_status == 'SCREEN_PASSED' ]
      else:   # PER_PROTOCOL
          treated = [ e for e in Enrollment if e.campaign_id == C.id
                      and e.holdout_flag == false
                      and e.screening_status == 'SCREEN_PASSED'
                      and exists s in SampleShipment
                          with s.enrollment_id == e.id and s.status == 'DELIVERED' ]
      treated_conversion_rate = 0.0 if len(treated) == 0
          else ROUND_HALF_UP( count(e in treated if qualified(e)) / len(treated), 4 )
      holdout_conversion_rate = 0.0 if len(holdout) == 0
          else ROUND_HALF_UP( count(e in holdout if qualified(e)) / len(holdout), 4 )
      lift_pct = ROUND_HALF_UP( 100 * (treated_conversion_rate
                                       - holdout_conversion_rate), 2 )
      power_status = 'INSUFFICIENT_POWER' if (len(holdout) == 0 or len(treated) < MIN_TREATED_FOR_POWER)
                     else 'MEASURED'

      # ---------- part B: diversion penalty, evaluation order PINNED ---------
      # This block LOOKS circular: the penalty depends on a rate, the rate depends
      # on a tier of the cost per sample, and the cost per sample depends on the
      # penalty. The order below resolves it and is the ONLY valid reading:
      diverted_unit_count    = C.substantiated_diversion_count
      effective_sample_count = C.delivered_sample_count - diverted_unit_count
      # STEP 1 — PRE-penalty base, from committed budget only
      base_cost_per_sample_cents = 0 if effective_sample_count <= 0
          else ROUND_HALF_UP( C.budget_committed_cents / effective_sample_count, 0 )
      # STEP 2 — tier is selected from the STEP-1 value, never from STEP 4
      penalty_rate_pct = 10 if base_cost_per_sample_cents < PENALTY_TIER_LOW
                         else (20 if base_cost_per_sample_cents < PENALTY_TIER_HIGH else 35)
      # STEP 3
      diversion_penalty_cents = ROUND_HALF_UP(
          base_cost_per_sample_cents * penalty_rate_pct / 100 * diverted_unit_count, 0 )
      # STEP 4 — post-penalty figure; recomputing STEP 2 from it is FORBIDDEN
      adjusted_cost_per_sample_cents = 0 if effective_sample_count <= 0
          else ROUND_HALF_UP( (C.budget_committed_cents + diversion_penalty_cents)
                              / effective_sample_count, 0 )

      # ---------- part C: supersede the prior analysis ------------------------
      for prior in [ la for la in LiftAnalysis if la.campaign_id == C.id
                     and la.superseded == false ]:
          prior.superseded = true
    input_set: "Enrollments of the campaign with screening_status == SCREEN_PASSED, split by holdout_flag; PurchaseMatch rows of those enrollments with match_confidence >= 0.8 and purchased_at inside [sampling_window_start, sampling_window_end + 30 days] closed at both ends; SampleShipments with status == DELIVERED for the PER_PROTOCOL treated filter; Campaign counters for part B."
    constants:
      MATCH_CONFIDENCE_FLOOR: 0.8
      CONVERSION_TAIL_DAYS: 30
      MIN_TREATED_FOR_POWER: 3
      PENALTY_TIER_LOW: 500
      PENALTY_TIER_HIGH: 1500
    precision: "conversion rates at 4 decimal places ROUND_HALF_UP; lift_pct at 2 decimal places ROUND_HALF_UP; all cent figures whole cents ROUND_HALF_UP"
    variants:
      - name: ITT
        when: "variant == 'ITT' — intent-to-treat measurement on LiftAnalysis."
        difference: "Treated group is every screened non-holdout enrollment, whether or not a sample was ever delivered."
      - name: PER_PROTOCOL
        when: "variant == 'PER_PROTOCOL' — per-protocol measurement on LiftAnalysis."
        difference: "Treated group is restricted to enrollments with at least one DELIVERED shipment, so the denominator shrinks and the same PurchaseMatch data yields a different treated_conversion_rate and lift_pct."

  - name: kit_unit_conservation
    trigger: "Invariant asserted after every KitLine-touching operation: POST /kit-lines/{id}/receipts, POST /kit-lines/{id}/write-offs, POST /sample-shipments, POST /sample-shipments/{id}/cancel, POST /fulfillment-waves/{id}/release."
    algorithm: aggregation
    formula: |
      # Conserved quantity #1 — PHYSICAL KIT UNITS. Must hold for every KitLine
      # at every observable instant.
      KitLine.units_available + KitLine.units_reserved
        + KitLine.units_shipped + KitLine.units_written_off
        == KitLine.units_received
      # The forward action POST /sample-shipments moves quantity_per_kit units
      # available -> reserved. The compensating action
      # POST /sample-shipments/{id}/cancel moves exactly the amounts recorded in
      # SampleShipment.reserved_line_units back reserved -> available, so the
      # round trip restores every one of the four buckets to its prior value.
    input_set: "One KitLine row; no cross-entity inputs."
    constants: {}
    precision: "exact integers; zero drift permitted"

  - name: campaign_budget_conservation
    trigger: "Invariant asserted after every Campaign-budget-touching operation: POST /campaigns/{id}/open-screening, POST /sample-shipments, POST /sample-shipments/{id}/cancel."
    algorithm: aggregation
    formula: |
      # Conserved quantity #2 — BUDGET CENTS.
      Campaign.budget_committed_cents + Campaign.budget_available_cents
        == Campaign.budget_total_cents
      # The forward action POST /sample-shipments moves
      # SampleShipment.committed_cost_cents from available -> committed. The
      # compensating action POST /sample-shipments/{id}/cancel moves back exactly
      # SampleShipment.committed_cost_cents (the snapshot, NOT a recomputation
      # from current kit cost), so a kit-cost change between allocation and
      # cancellation cannot leak cents.
    input_set: "One Campaign row plus the committed_cost_cents snapshot on each of its SampleShipments."
    constants: {}
    precision: "exact whole cents; zero drift permitted"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the first failing rule determines the response error_id)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role names one of the six roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's roles list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body carries every required input field of the endpoint, every value matches its declared type/enum/range, no unknown field is present, and pagination limit/offset are inside [1,100] / [0,inf)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: business_temporal
    check: "Campaign.sampling_window_end is strictly after Campaign.sampling_window_start."
    error_id: ERR_CAMPAIGN_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /campaigns"

  - priority: 6
    category: business_temporal
    check: "FulfillmentWave.window_end is strictly after FulfillmentWave.window_start."
    error_id: ERR_WAVE_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /fulfillment-waves"

  - priority: 7
    category: existence
    check: "Every path-template id resolves to an existing row, validated left-to-right."
    error_id: "ERR_CAMPAIGN_NOT_FOUND | ERR_KIT_LINE_NOT_FOUND | ERR_FULFILLMENT_CENTER_NOT_FOUND | ERR_FULFILLMENT_WAVE_NOT_FOUND | ERR_PANELIST_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_SYNDICATION_RECORD_NOT_FOUND | ERR_DIVERSION_CASE_NOT_FOUND | ERR_LIFT_ANALYSIS_NOT_FOUND | ERR_PURCHASE_MATCH_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path-template id"

  - priority: 8
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the order the fields appear in the endpoint's input list; ids inside Campaign.syndication_retailer_ids are checked left-to-right."
    error_id: "ERR_CAMPAIGN_NOT_FOUND | ERR_PANELIST_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_FULFILLMENT_CENTER_NOT_FOUND | ERR_FULFILLMENT_WAVE_NOT_FOUND | ERR_KIT_LINE_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK fields in input"

  - priority: 9
    category: auth
    check: "When X-User-Role is Panelist, X-User-ID equals the panelist_id of the Enrollment behind the target resource."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /enrollments, POST /enrollments/{enrollment_id}/resubmit-screening, POST /review-submissions, POST /review-submissions/{review_submission_id}/submit, POST /review-submissions/{review_submission_id}/revise, GET /enrollments/{enrollment_id}, GET /review-submissions/{review_submission_id}"

  - priority: 10
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2."
    error_id: "ERR_INVALID_CAMPAIGN_TRANSITION | ERR_INVALID_KIT_LINE_STATE | ERR_INVALID_WAVE_STATE | ERR_INVALID_SHIPMENT_STATE | ERR_INVALID_REVIEW_STATE | ERR_INVALID_SYNDICATION_STATE | ERR_INVALID_DIVERSION_CASE_STATE | ERR_ENROLLMENT_NOT_SCREENABLE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: state
    check: "The owning Campaign's status permits the operation: enrollment creation and screening require status IN {SCREENING_OPEN, SAMPLING_ACTIVE}; shipment allocation requires status == SAMPLING_ACTIVE; review submission requires status IN {SAMPLING_ACTIVE, REVIEW_WINDOW}; lift analysis requires status IN {REVIEW_WINDOW, CLOSED}."
    error_id: ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollments/{enrollment_id}/screen, POST /sample-shipments, POST /review-submissions, POST /review-submissions/{review_submission_id}/submit, POST /lift-analyses"

  - priority: 12
    category: state
    check: "The OCC field in the request body equals the parent entity's current version (see §1.2.1)."
    error_id: "ERR_STALE_CAMPAIGN_VERSION | ERR_STALE_ENROLLMENT_VERSION"
    http_status: 412
    applies_to: "POST /lift-analyses, POST /sample-shipments"

  - priority: 13
    category: business_safety
    check: "The Panelist behind the target resource has integrity_status != BANNED."
    error_id: ERR_PANELIST_BANNED
    http_status: 403
    applies_to: "POST /enrollments, POST /enrollments/{enrollment_id}/resubmit-screening, POST /review-submissions, POST /review-submissions/{review_submission_id}/submit, POST /review-submissions/{review_submission_id}/revise, POST /syndication-records"

  - priority: 14
    category: business_safety
    check: "The Panelist behind the reviewed content has integrity_status != FLAGGED when the operation publishes that content externally."
    error_id: ERR_PANELIST_INTEGRITY_HOLD
    http_status: 403
    applies_to: "POST /syndication-records, POST /syndication-records/{syndication_record_id}/dispatch"

  - priority: 15
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID is not the user who performed the paired earlier step — a review's approver may not be the moderator who requested changes on it, and a diversion case's substantiator may not be the moderator who opened it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /review-submissions/{review_submission_id}/moderate, POST /diversion-cases/{diversion_case_id}/substantiate"

  - priority: 16
    category: business_safety
    check: "Campaign.compliance_posture != FROZEN."
    error_id: ERR_CAMPAIGN_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /enrollments/{enrollment_id}/screen, POST /sample-shipments, POST /campaigns/{campaign_id}/resume, POST /syndication-records/{syndication_record_id}/dispatch"

  - priority: 17
    category: business_safety
    check: "Campaign.compliance_posture == OPEN when the operation publishes content to a retailer feed."
    error_id: ERR_CAMPAIGN_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /syndication-records/{syndication_record_id}/dispatch"

  - priority: 18
    category: business_safety
    check: "honest_opinion_attested is true on the submitted or revised review."
    error_id: ERR_HONEST_OPINION_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /review-submissions/{review_submission_id}/submit, POST /review-submissions/{review_submission_id}/revise"

  - priority: 19
    category: business_safety
    check: "disclosure_statement is non-null and contains one of calculation review_disclosure_gate's REQUIRED_DISCLOSURE_PHRASES as a case-insensitive substring."
    error_id: ERR_DISCLOSURE_STATEMENT_MISSING
    http_status: 422
    applies_to: "POST /review-submissions/{review_submission_id}/submit, POST /review-submissions/{review_submission_id}/revise"

  - priority: 20
    category: business_referential
    check: "retailer_id appears in the Campaign.syndication_retailer_ids array of the campaign behind the review being syndicated."
    error_id: ERR_RETAILER_NOT_IN_CAMPAIGN
    http_status: 422
    applies_to: "POST /syndication-records"

  - priority: 21
    category: business_referential
    check: "Retailer.feed_status == ACCEPTING."
    error_id: ERR_RETAILER_FEED_PAUSED
    http_status: 409
    applies_to: "POST /syndication-records/{syndication_record_id}/dispatch"

  - priority: 22
    category: business_constraint
    check: "word_count of body_text is >= Campaign.min_review_word_count (inclusive)."
    error_id: ERR_REVIEW_TOO_SHORT
    http_status: 422
    applies_to: "POST /review-submissions/{review_submission_id}/submit, POST /review-submissions/{review_submission_id}/revise"

  - priority: 23
    category: business_constraint
    check: "No Enrollment already exists for this (campaign_id, panelist_id) pair with screening_status != SCREEN_REVOKED."
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 24
    category: business_constraint
    check: "No SyndicationRecord already exists for this (review_submission_id, retailer_id) pair with status != REJECTED."
    error_id: ERR_DUPLICATE_SYNDICATION_TARGET
    http_status: 409
    applies_to: "POST /syndication-records"

  - priority: 25
    category: business_constraint
    check: "The Enrollment being sampled has holdout_flag == false."
    error_id: ERR_HOLDOUT_ENROLLMENT_NOT_SAMPLEABLE
    http_status: 422
    applies_to: "POST /sample-shipments"

  - priority: 26
    category: business_constraint
    check: "The Enrollment behind the review has obligation_status == REVIEW_DUE."
    error_id: ERR_ENROLLMENT_NOT_ELIGIBLE_FOR_REVIEW
    http_status: 422
    applies_to: "POST /review-submissions/{review_submission_id}/submit"

  - priority: 27
    category: business_constraint
    check: "The campaign has at least one KitLine with status == ACTIVE (calculation kit_reservation_selector's empty-pool fallback)."
    error_id: ERR_CAMPAIGN_KIT_EMPTY
    http_status: 422
    applies_to: "POST /campaigns/{campaign_id}/open-screening, POST /sample-shipments"

  - priority: 28
    category: business_temporal
    check: "Per-wave ceiling: FulfillmentWave.planned_unit_count + kit_unit_total <= FulfillmentWave.planned_capacity_units."
    error_id: ERR_WAVE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /sample-shipments"

  - priority: 29
    category: business_temporal
    check: "Center aggregate ceiling: the sum of planned_unit_count over all PLANNED/LOCKED waves of the same center whose half-open [window_start, window_end) overlaps the target wave's, plus kit_unit_total, is <= FulfillmentCenter.daily_pick_capacity_units."
    error_id: ERR_CENTER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /sample-shipments"

  - priority: 30
    category: business_constraint
    check: "Every ACTIVE KitLine of the campaign has units_available >= quantity_per_kit (all-or-nothing reservation)."
    error_id: ERR_KIT_STOCK_INSUFFICIENT
    http_status: 422
    applies_to: "POST /sample-shipments"

  - priority: 31
    category: business_constraint
    check: "The write-off unit count does not exceed KitLine.units_available."
    error_id: ERR_WRITE_OFF_EXCEEDS_AVAILABLE
    http_status: 422
    applies_to: "POST /kit-lines/{kit_line_id}/write-offs"

  - priority: 32
    category: business_temporal
    check: "PurchaseMatch.purchased_at falls inside [Campaign.sampling_window_start, Campaign.sampling_window_end + 30 days], both ends inclusive."
    error_id: ERR_PURCHASE_MATCH_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /purchase-matches"

  - priority: 33
    category: business_fiscal
    check: "Campaign.budget_available_cents >= the shipment's committed_cost_cents."
    error_id: ERR_CAMPAIGN_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: "POST /sample-shipments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Campaign
  - method: POST
    path: "/campaigns"
    description: "Define a sampling campaign: objective, target audience specification, sampling window, holdout share and budget."
    roles: [CampaignManager]
    code: 201
    input: [name, objective_type, target_segment_codes, sampling_window_start, sampling_window_end, budget_total_cents, "syndication_retailer_ids?", "review_due_days?", "min_review_word_count?", "holdout_pct?"]
    output: Campaign
    side_effects:
      - "creates Campaign in status DRAFT with compliance_posture OPEN"
      - "sets budget_available_cents = budget_total_cents and budget_committed_cents = 0"
      - "validates every id in syndication_retailer_ids exists"

  - method: GET
    path: "/campaigns/{campaign_id}"
    description: "Read one campaign including every computed counter, cost figure and compliance_posture."
    roles: [CampaignManager, ComplianceModerator, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/campaigns"
    description: "List campaigns with pagination and status filtering."
    roles: [CampaignManager, ComplianceModerator, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["status?", "objective_type?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: GET
    path: "/campaigns/{campaign_id}/cost-summary"
    description: "Computed read returning both cost-per-sample variants side by side together with the budget conservation pair."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: "{ campaign_id: string, kit_assembly_unit_cost_cents: integer, cost_per_sample_provisional_cents: integer, cost_per_sample_final_cents: integer, budget_total_cents: integer, budget_committed_cents: integer, budget_available_cents: integer, allocated_sample_count: integer, delivered_sample_count: integer, write_off_cost_cents: integer }"
    side_effects: []

  - method: POST
    path: "/campaigns/{campaign_id}/open-screening"
    description: "Move a DRAFT campaign to SCREENING_OPEN, freezing the kit assembly cost."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "recomputes kit_assembly_unit_cost_cents via calculation kit_assembly_unit_cost"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/campaigns/{campaign_id}/activate-sampling"
    description: "Move a SCREENING_OPEN campaign to SAMPLING_ACTIVE and record the launching manager."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "sets launched_by_user_id from X-User-ID"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/campaigns/{campaign_id}/suspend"
    description: "Suspend an active campaign (compliance hold); blocks allocation while suspended."
    roles: [ComplianceModerator]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "increments Campaign.version by 1"

  - method: POST
    path: "/campaigns/{campaign_id}/resume"
    description: "Return a SUSPENDED campaign to SAMPLING_ACTIVE; refused while compliance_posture is FROZEN."
    roles: [ComplianceModerator]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "increments Campaign.version by 1"

  - method: POST
    path: "/campaigns/{campaign_id}/open-review-window"
    description: "Close allocation and open the review window; refreshes the final cost per sample."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "recomputes cost_per_sample_final_cents via calculation cost_per_sample variant final"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/campaigns/{campaign_id}/close"
    description: "Close the campaign, forfeiting outstanding review obligations."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "sets obligation_status = FORFEITED on every Enrollment still REVIEW_DUE"
      - "recomputes cost_per_sample_final_cents; sets closed_at; increments Campaign.version by 1"

  # -------------------------------------------------------------- KitLine
  - method: POST
    path: "/kit-lines"
    description: "Add one component line to a campaign's sample kit."
    roles: [CampaignManager]
    code: 201
    input: [campaign_id, component_sku, component_role, unit_cost_cents, quantity_per_kit, "component_discount_pct?"]
    output: KitLine
    side_effects:
      - "computes KitLine.extended_cost_cents via calculation kit_assembly_unit_cost step 1"
      - "recomputes Campaign.kit_assembly_unit_cost_cents and increments Campaign.version by 1"

  - method: GET
    path: "/kit-lines/{kit_line_id}"
    description: "Read one kit line including its four inventory buckets."
    roles: [CampaignManager, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: KitLine
    side_effects: []

  - method: GET
    path: "/kit-lines"
    description: "List kit lines, filterable by owning campaign — reverse-reachability channel for KitLine.campaign_id."
    roles: [CampaignManager, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: KitLine[]
    side_effects: []

  - method: POST
    path: "/kit-lines/{kit_line_id}/receipts"
    description: "Book received inventory units into a kit line."
    roles: [FulfillmentOps]
    code: 200
    input: [units]
    output: KitLine
    side_effects:
      - "increments units_received and units_available by units"
      - "increments KitLine.version by 1"

  - method: POST
    path: "/kit-lines/{kit_line_id}/write-offs"
    description: "Write off damaged or expired units, moving them from available to written_off."
    roles: [FulfillmentOps]
    code: 200
    input: [units, reason]
    output: KitLine
    side_effects:
      - "decrements units_available and increments units_written_off by units"
      - "increments Campaign.write_off_cost_cents by units * unit_cost_cents, recomputes cost_per_sample_final_cents, increments Campaign.version by 1"
      - "increments KitLine.version by 1"

  - method: POST
    path: "/kit-lines/{kit_line_id}/retire"
    description: "Retire a kit line so it stops contributing cost and stops being reserved; the campaign's kit assembly cost is refreshed."
    roles: [CampaignManager]
    code: 200
    input: []
    output: KitLine
    side_effects:
      - "sets KitLine.status = RETIRED and increments KitLine.version by 1"
      - "recomputes Campaign.kit_assembly_unit_cost_cents via calculation kit_assembly_unit_cost and increments Campaign.version by 1"
      - "leaves units_reserved untouched; existing reservations are still released by the owning shipment's cancel or wave release"

  # ---------------------------------------------------- FulfillmentCenter
  - method: POST
    path: "/fulfillment-centers"
    description: "Register a fulfillment center with its aggregate daily pick capacity and per-kit freight rate."
    roles: [FulfillmentOps]
    code: 201
    input: [name, zone_code, daily_pick_capacity_units, freight_cents_per_kit]
    output: FulfillmentCenter
    side_effects: []

  - method: GET
    path: "/fulfillment-centers/{fulfillment_center_id}"
    description: "Read one fulfillment center."
    roles: [FulfillmentOps, CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: FulfillmentCenter
    side_effects: []

  # ------------------------------------------------------ FulfillmentWave
  - method: POST
    path: "/fulfillment-waves"
    description: "Plan a pick wave on a center over a half-open [window_start, window_end) interval."
    roles: [FulfillmentOps]
    code: 201
    input: [fulfillment_center_id, window_start, window_end, planned_capacity_units]
    output: FulfillmentWave
    side_effects:
      - "creates FulfillmentWave in status PLANNED with planned_unit_count 0"

  - method: GET
    path: "/fulfillment-waves/{fulfillment_wave_id}"
    description: "Read one pick wave including its unit counters."
    roles: [FulfillmentOps, CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: FulfillmentWave
    side_effects: []

  - method: GET
    path: "/fulfillment-waves"
    description: "List pick waves, filterable by center — reverse-reachability channel for FulfillmentWave.fulfillment_center_id."
    roles: [FulfillmentOps, CampaignManager, PlatformAdmin]
    code: 200
    input: ["fulfillment_center_id?", "status?", "limit?", "offset?"]
    output: FulfillmentWave[]
    side_effects: []

  - method: POST
    path: "/fulfillment-waves/{fulfillment_wave_id}/lock"
    description: "Lock a planned wave so no further shipments may be allocated into it."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: FulfillmentWave
    side_effects:
      - "increments FulfillmentWave.version by 1"

  - method: POST
    path: "/fulfillment-waves/{fulfillment_wave_id}/release"
    description: "Release a locked wave to the carrier: every ALLOCATED shipment becomes SHIPPED and its reserved kit units become shipped units."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: FulfillmentWave
    side_effects:
      - "sets each ALLOCATED shipment to SHIPPED with shipped_at = clock now"
      - "moves reserved units to shipped units on every affected KitLine"
      - "advances each affected Enrollment obligation axis NONE -> SAMPLE_SENT"
      - "increments FulfillmentWave.version by 1"

  # ------------------------------------------------------------- Panelist
  - method: POST
    path: "/panelists"
    description: "Recruit a panelist into the panel, optionally recording the referring panelist."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [email, display_name, address_hash, account_opened_at, segment_code, "referred_by_panelist_id?"]
    output: Panelist
    side_effects:
      - "creates Panelist with integrity_status CLEAR, diversion_strikes 0 and fraud_risk_score_screening 0.0"

  - method: GET
    path: "/panelists/{panelist_id}"
    description: "Read one panelist including both fraud score variants and integrity standing."
    roles: [ComplianceModerator, CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: Panelist
    side_effects: []

  - method: GET
    path: "/panelists"
    description: "List panelists, filterable by referrer — reverse-reachability channel for the self-referential Panelist.referred_by_panelist_id."
    roles: [ComplianceModerator, CampaignManager, PlatformAdmin]
    code: 200
    input: ["referred_by_panelist_id?", "integrity_status?", "segment_code?", "limit?", "offset?"]
    output: Panelist[]
    side_effects: []

  - method: POST
    path: "/panelists/{panelist_id}/risk-rescore"
    description: "Recompute a panelist's fraud risk under an explicit variant (SCREENING or AUDIT) without touching any enrollment."
    roles: [ComplianceModerator]
    code: 200
    input: [variant]
    output: Panelist
    side_effects:
      - "writes fraud_risk_score_screening or fraud_risk_score_audit per calculation panelist_fraud_risk_score"
      - "sets last_risk_scored_at = clock now; increments Panelist.version by 1"
      - "when the AUDIT score is >= 55.0 and integrity_status == CLEAR, sets integrity_status = FLAGGED"

  # ----------------------------------------------------------- Enrollment
  - method: POST
    path: "/enrollments"
    description: "Enroll a panelist into a campaign; screening is a separate step."
    roles: [Panelist, CampaignManager]
    code: 201
    input: [campaign_id, panelist_id, screening_answers]
    output: Enrollment
    side_effects:
      - "assigns enrollment_seq = Campaign.enrollment_count + 1"
      - "increments Campaign.enrollment_count by 1 and Campaign.version by 1"
      - "creates Enrollment with screening_status PENDING_SCREEN and obligation_status NONE"

  - method: GET
    path: "/enrollments/{enrollment_id}"
    description: "Read one enrollment including both independent state axes."
    roles: [CampaignManager, ComplianceModerator, FulfillmentOps, Panelist, PlatformAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by campaign or panelist — reverse-reachability channel for Enrollment.campaign_id and Enrollment.panelist_id."
    roles: [CampaignManager, ComplianceModerator, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "panelist_id?", "screening_status?", "obligation_status?", "holdout_flag?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{enrollment_id}/screen"
    description: "Run eligibility screening and fraud controls, then place the enrollment in the treated or holdout group."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "recomputes Panelist.fraud_risk_score_screening; snapshots it onto fraud_score_at_screening"
      - "sets screening_status to SCREEN_PASSED or SCREEN_FAILED with screening_failure_reason"
      - "on pass, sets holdout_flag via calculation holdout_assignment and may increment Campaign.holdout_enrollment_count"
      - "increments Enrollment.screen_attempt_count and Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollment_id}/resubmit-screening"
    description: "Panelist replaces screener answers after a failed screen, returning the enrollment to PENDING_SCREEN."
    roles: [Panelist]
    code: 200
    input: [screening_answers]
    output: Enrollment
    side_effects:
      - "replaces screening_answers, clears screening_failure_reason"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/enrollments/{enrollment_id}/purchase-matches"
    description: "Sub-resource read listing every matched purchase for one enrollment — reverse-reachability channel for PurchaseMatch.enrollment_id."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PurchaseMatch[]
    side_effects: []

  # ------------------------------------------------------- SampleShipment
  - method: POST
    path: "/sample-shipments"
    description: "Allocate a sample kit to a screened enrollment inside a planned wave, reserving inventory and committing budget. Carries the enrollment OCC token."
    roles: [FulfillmentOps]
    code: 201
    input: [enrollment_id, fulfillment_wave_id, expected_enrollment_version, "surcharge_cents?", "supersedes_shipment_id?"]
    output: SampleShipment
    side_effects:
      - "reserves units on every ACTIVE KitLine per calculation kit_reservation_selector; snapshots reserved_line_units and kit_unit_total"
      - "snapshots committed_cost_cents; moves that amount from Campaign.budget_available_cents to Campaign.budget_committed_cents"
      - "increments FulfillmentWave.planned_unit_count by kit_unit_total and FulfillmentWave.version by 1"
      - "increments Campaign.allocated_sample_count, recomputes cost_per_sample_provisional_cents, increments Campaign.version by 1"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/sample-shipments/{sample_shipment_id}"
    description: "Read one shipment including its cost and reservation snapshots."
    roles: [FulfillmentOps, CampaignManager, ComplianceModerator, PlatformAdmin]
    code: 200
    input: []
    output: SampleShipment
    side_effects: []

  - method: GET
    path: "/sample-shipments"
    description: "List shipments, filterable by enrollment, wave or superseded shipment — reverse-reachability channel for SampleShipment.enrollment_id, SampleShipment.fulfillment_wave_id and the self-referential SampleShipment.supersedes_shipment_id."
    roles: [FulfillmentOps, CampaignManager, ComplianceModerator, PlatformAdmin]
    code: 200
    input: ["enrollment_id?", "fulfillment_wave_id?", "supersedes_shipment_id?", "status?", "limit?", "offset?"]
    output: SampleShipment[]
    side_effects: []

  - method: POST
    path: "/sample-shipments/{sample_shipment_id}/cancel"
    description: "Cancel an allocated shipment; releases inventory and budget through the depth-3 cascade."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: SampleShipment
    side_effects:
      - "cascade hop 1: releases reserved_line_units back to KitLine.units_available"
      - "cascade hop 2: decrements FulfillmentWave.planned_unit_count and unlocks a LOCKED wave that thereby reaches 0"
      - "cascade hop 3: decrements Campaign.allocated_sample_count, returns committed_cost_cents to budget_available_cents, recomputes cost_per_sample_provisional_cents"

  - method: POST
    path: "/sample-shipments/{sample_shipment_id}/deliver"
    description: "Confirm delivery, starting the review obligation clock."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: SampleShipment
    side_effects:
      - "sets delivered_at; increments Campaign.delivered_sample_count; recomputes cost_per_sample_final_cents and compliance_posture"
      - "advances the Enrollment obligation axis SAMPLE_SENT -> REVIEW_DUE and stamps review_due_at"

  - method: POST
    path: "/sample-shipments/{sample_shipment_id}/report-lost"
    description: "Report a shipped sample as lost in transit; its cost stays in the final numerator but leaves the denominator."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: SampleShipment
    side_effects:
      - "recomputes Campaign.cost_per_sample_final_cents"
      - "advances the Enrollment obligation axis SAMPLE_SENT -> FORFEITED when no sibling shipment is still live"

  # ----------------------------------------------------- ReviewSubmission
  - method: POST
    path: "/review-submissions"
    description: "Create a review draft for an enrollment; obligation eligibility is enforced at submission, not at drafting."
    roles: [Panelist]
    code: 201
    input: [enrollment_id, headline, body_text, star_rating, "disclosure_statement?", "honest_opinion_attested?"]
    output: ReviewSubmission
    side_effects:
      - "creates ReviewSubmission in status DRAFT and computes word_count from body_text"

  - method: GET
    path: "/review-submissions/{review_submission_id}"
    description: "Read one review including word_count, revision_count and the moderation audit ids."
    roles: [ComplianceModerator, CampaignManager, Panelist, PlatformAdmin]
    code: 200
    input: []
    output: ReviewSubmission
    side_effects: []

  - method: GET
    path: "/review-submissions"
    description: "List reviews, filterable by enrollment — reverse-reachability channel for ReviewSubmission.enrollment_id."
    roles: [ComplianceModerator, CampaignManager, PlatformAdmin]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: ReviewSubmission[]
    side_effects: []

  - method: POST
    path: "/review-submissions/{review_submission_id}/submit"
    description: "Submit a draft for moderation; enforces the honest-opinion attestation, the incentivized-review disclosure and the minimum word count."
    roles: [Panelist]
    code: 200
    input: []
    output: ReviewSubmission
    side_effects:
      - "sets first_submitted_at on the first submission only"
      - "increments ReviewSubmission.version by 1"

  - method: POST
    path: "/review-submissions/{review_submission_id}/moderate"
    description: "Moderator decision: APPROVE, REQUEST_CHANGES or REJECT_DISCLOSURE. Approval is barred for the moderator who requested the changes."
    roles: [ComplianceModerator]
    code: 200
    input: [decision, "moderator_note?"]
    output: ReviewSubmission
    side_effects:
      - "APPROVE: sets approved_by_user_id, increments Campaign.approved_review_count, advances the Enrollment obligation axis to REVIEW_FULFILLED"
      - "REQUEST_CHANGES: sets changes_requested_by_user_id and moves the review to CHANGES_REQUESTED"
      - "REJECT_DISCLOSURE: increments Campaign.disclosure_rejected_review_count and recomputes compliance_posture"

  - method: POST
    path: "/review-submissions/{review_submission_id}/revise"
    description: "Panelist revises a review that changes were requested on, returning it to SUBMITTED."
    roles: [Panelist]
    code: 200
    input: [headline, body_text, star_rating, "disclosure_statement?", "honest_opinion_attested?"]
    output: ReviewSubmission
    side_effects:
      - "replaces the review content, recomputes word_count, increments revision_count"
      - "leaves first_submitted_at untouched; increments ReviewSubmission.version by 1"

  # ------------------------------------------------------------- Retailer
  - method: POST
    path: "/retailers"
    description: "Register a retailer feed with its disclosure, rating and per-panelist rate-limit policy."
    roles: [PlatformAdmin, CampaignManager]
    code: 201
    input: [name, "feed_status?", "requires_disclosure_badge?", "min_star_rating_accepted?", "max_reviews_per_panelist_per_month?"]
    output: Retailer
    side_effects: []

  - method: GET
    path: "/retailers/{retailer_id}"
    description: "Read one retailer's syndication policy."
    roles: [PlatformAdmin, CampaignManager, FulfillmentOps, ComplianceModerator]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  # ---------------------------------------------------- SyndicationRecord
  - method: POST
    path: "/syndication-records"
    description: "Queue an approved review for syndication to one retailer cleared by the campaign."
    roles: [CampaignManager, FulfillmentOps]
    code: 201
    input: [review_submission_id, retailer_id]
    output: SyndicationRecord
    side_effects:
      - "creates SyndicationRecord in status QUEUED"

  - method: GET
    path: "/syndication-records/{syndication_record_id}"
    description: "Read one syndication record including its retailer-side rejection reason."
    roles: [CampaignManager, FulfillmentOps, ComplianceModerator, PlatformAdmin]
    code: 200
    input: []
    output: SyndicationRecord
    side_effects: []

  - method: GET
    path: "/syndication-records"
    description: "List syndication records, filterable by review or retailer — reverse-reachability channel for SyndicationRecord.review_submission_id and SyndicationRecord.retailer_id."
    roles: [CampaignManager, FulfillmentOps, ComplianceModerator, PlatformAdmin]
    code: 200
    input: ["review_submission_id?", "retailer_id?", "status?", "limit?", "offset?"]
    output: SyndicationRecord[]
    side_effects: []

  - method: POST
    path: "/syndication-records/{syndication_record_id}/dispatch"
    description: "Dispatch a queued record to the retailer feed; the retailer's own moderation rules decide SYNDICATED versus REJECTED."
    roles: [FulfillmentOps]
    code: 200
    input: []
    output: SyndicationRecord
    side_effects:
      - "on ACCEPT: sets syndicated_at, increments Campaign.syndicated_review_count"
      - "on REJECT: sets rejection_reason and leaves every campaign counter untouched"

  # -------------------------------------------------------- DiversionCase
  - method: POST
    path: "/diversion-cases"
    description: "Open a sample diversion or resale monitoring case against a panelist and a specific shipment."
    roles: [ComplianceModerator]
    code: 201
    input: [panelist_id, sample_shipment_id, signal_type, evidence_note]
    output: DiversionCase
    side_effects:
      - "creates DiversionCase in status OPEN and records opened_by_user_id from X-User-ID"

  - method: GET
    path: "/diversion-cases/{diversion_case_id}"
    description: "Read one diversion case."
    roles: [ComplianceModerator, CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: DiversionCase
    side_effects: []

  - method: GET
    path: "/diversion-cases"
    description: "List diversion cases, filterable by panelist or shipment — reverse-reachability channel for DiversionCase.panelist_id and DiversionCase.sample_shipment_id."
    roles: [ComplianceModerator, CampaignManager, PlatformAdmin]
    code: 200
    input: ["panelist_id?", "sample_shipment_id?", "status?", "limit?", "offset?"]
    output: DiversionCase[]
    side_effects: []

  - method: POST
    path: "/diversion-cases/{diversion_case_id}/investigate"
    description: "Begin investigating a case; runs the AUDIT fraud rescore and may flag the panelist."
    roles: [ComplianceModerator]
    code: 200
    input: []
    output: DiversionCase
    side_effects:
      - "recomputes Panelist.fraud_risk_score_audit and may set integrity_status = FLAGGED"
      - "increments DiversionCase.version by 1"

  - method: POST
    path: "/diversion-cases/{diversion_case_id}/reopen"
    description: "Return an investigating case to OPEN pending further evidence."
    roles: [ComplianceModerator]
    code: 200
    input: []
    output: DiversionCase
    side_effects:
      - "increments reopen_count and DiversionCase.version by 1"

  - method: POST
    path: "/diversion-cases/{diversion_case_id}/dismiss"
    description: "Dismiss an investigating case; clears a FLAGGED panelist when no other case is live."
    roles: [ComplianceModerator]
    code: 200
    input: []
    output: DiversionCase
    side_effects:
      - "may reset Panelist.integrity_status to CLEAR"
      - "increments DiversionCase.version by 1"

  - method: POST
    path: "/diversion-cases/{diversion_case_id}/substantiate"
    description: "Substantiate diversion; bans the panelist and triggers the depth-4 revocation cascade. Barred for the moderator who opened the case."
    roles: [ComplianceModerator]
    code: 200
    input: []
    output: DiversionCase
    side_effects:
      - "cascade hop 1: Panelist.diversion_strikes += 1 and integrity_status = BANNED"
      - "cascade hop 2: the panelist's live Enrollments become SCREEN_REVOKED / FORFEITED"
      - "cascade hop 3: their SUBMITTED and APPROVED ReviewSubmissions become RETRACTED"
      - "cascade hop 4: their SYNDICATED SyndicationRecords become TAKEDOWN_REQUESTED"
      - "direct effect: Campaign.substantiated_diversion_count += 1 and compliance_posture recomputed"

  # -------------------------------------------------------- PurchaseMatch
  - method: POST
    path: "/purchase-matches"
    description: "Ingest one matched purchase record from the purchase-data feed for conversion measurement."
    roles: [PlatformAdmin]
    code: 201
    input: [enrollment_id, retailer_channel_code, purchase_amount_cents, purchased_at, match_confidence]
    output: PurchaseMatch
    side_effects:
      - "computes PurchaseMatch.qualified from match_confidence and the campaign conversion window"

  - method: GET
    path: "/purchase-matches/{purchase_match_id}"
    description: "Read one matched purchase record."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: PurchaseMatch
    side_effects: []

  - method: GET
    path: "/purchase-matches"
    description: "List matched purchases, filterable by enrollment and qualification — filtered-list reverse-reachability channel for PurchaseMatch.enrollment_id."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: ["enrollment_id?", "qualified?", "limit?", "offset?"]
    output: PurchaseMatch[]
    side_effects: []

  # ---------------------------------------------------------- LiftAnalysis
  - method: POST
    path: "/lift-analyses"
    description: "Compute campaign lift against the holdout group under one treated-group variant, plus the diversion-penalty cost figures. Carries the campaign OCC token and supersedes the prior analysis."
    roles: [CampaignManager]
    code: 201
    input: [campaign_id, variant, expected_campaign_version]
    output: LiftAnalysis
    side_effects:
      - "computes every measurement and cost field via calculation campaign_lift_and_diversion_penalty"
      - "sets superseded = true on the campaign's previously non-superseded analyses"
      - "increments Campaign.version by 1"

  - method: GET
    path: "/lift-analyses/{lift_analysis_id}"
    description: "Read one lift analysis."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: LiftAnalysis
    side_effects: []

  - method: GET
    path: "/lift-analyses"
    description: "List lift analyses, filterable by campaign — reverse-reachability channel for LiftAnalysis.campaign_id."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "variant?", "limit?", "offset?"]
    output: LiftAnalysis[]
    side_effects: []

  # --------------------------------------------- test-driving endpoint(s)
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit ISO 8601 UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Every deadline, cooldown, rate-limit and conversion-window rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "replaces the logical clock value; no entity is mutated"

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is reachable from at least one §1.4 priority row.
# =============================================================================
errors:

  # ---- authentication / authorisation ----
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header absent, empty, or not a syntactically valid UUID."
    applies_to: ["all except POST /panelists"]

  - id: ERR_FORBIDDEN_ROLE
    http_status: 403
    condition: "The caller's role is not listed in the endpoint's roles."
    applies_to: ["all authenticated endpoints"]

  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "A Panelist-role caller targets an Enrollment or ReviewSubmission that does not belong to their own Panelist record."
    applies_to: ["POST /enrollments", "POST /enrollments/{enrollment_id}/resubmit-screening", "POST /review-submissions", "POST /review-submissions/{review_submission_id}/submit", "POST /review-submissions/{review_submission_id}/revise", "GET /enrollments/{enrollment_id}", "GET /review-submissions/{review_submission_id}"]

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Missing required field, wrong JSON type, unknown enum member, negative or zero unit/amount where positive is required, match_confidence outside [0.0, 1.0], star_rating outside 1..5, holdout_pct outside [0.0, 0.9], malformed ISO 8601 datetime, or pagination limit/offset outside its allowed range."
    applies_to: ["all endpoints with a request body or query parameters"]

  - id: ERR_CAMPAIGN_WINDOW_INVALID
    http_status: 400
    condition: "sampling_window_end is not strictly after sampling_window_start."
    applies_to: ["POST /campaigns"]

  - id: ERR_WAVE_WINDOW_INVALID
    http_status: 400
    condition: "window_end is not strictly after window_start."
    applies_to: ["POST /fulfillment-waves"]

  # ---- path-parameter existence (404) ----
  - id: ERR_CAMPAIGN_NOT_FOUND
    http_status: 404
    condition: "No Campaign with the given id (path parameter or campaign_id in the body)."
    applies_to: ["GET /campaigns/{campaign_id}", "GET /campaigns/{campaign_id}/cost-summary", "POST /campaigns/{campaign_id}/open-screening", "POST /campaigns/{campaign_id}/activate-sampling", "POST /campaigns/{campaign_id}/suspend", "POST /campaigns/{campaign_id}/resume", "POST /campaigns/{campaign_id}/open-review-window", "POST /campaigns/{campaign_id}/close", "POST /kit-lines", "POST /enrollments", "POST /lift-analyses"]

  - id: ERR_KIT_LINE_NOT_FOUND
    http_status: 404
    condition: "No KitLine with the given id."
    applies_to: ["GET /kit-lines/{kit_line_id}", "POST /kit-lines/{kit_line_id}/receipts", "POST /kit-lines/{kit_line_id}/write-offs"]

  - id: ERR_FULFILLMENT_CENTER_NOT_FOUND
    http_status: 404
    condition: "No FulfillmentCenter with the given id (path parameter or fulfillment_center_id in the body)."
    applies_to: ["GET /fulfillment-centers/{fulfillment_center_id}", "POST /fulfillment-waves"]

  - id: ERR_FULFILLMENT_WAVE_NOT_FOUND
    http_status: 404
    condition: "No FulfillmentWave with the given id (path parameter or fulfillment_wave_id in the body)."
    applies_to: ["GET /fulfillment-waves/{fulfillment_wave_id}", "POST /fulfillment-waves/{fulfillment_wave_id}/lock", "POST /fulfillment-waves/{fulfillment_wave_id}/release", "POST /sample-shipments"]

  - id: ERR_PANELIST_NOT_FOUND
    http_status: 404
    condition: "No Panelist with the given id (path parameter, panelist_id, or referred_by_panelist_id in the body)."
    applies_to: ["GET /panelists/{panelist_id}", "POST /panelists", "POST /panelists/{panelist_id}/risk-rescore", "POST /enrollments", "POST /diversion-cases"]

  - id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    condition: "No Enrollment with the given id (path parameter or enrollment_id in the body)."
    applies_to: ["GET /enrollments/{enrollment_id}", "GET /enrollments/{enrollment_id}/purchase-matches", "POST /enrollments/{enrollment_id}/screen", "POST /enrollments/{enrollment_id}/resubmit-screening", "POST /sample-shipments", "POST /review-submissions", "POST /purchase-matches"]

  - id: ERR_SHIPMENT_NOT_FOUND
    http_status: 404
    condition: "No SampleShipment with the given id (path parameter, sample_shipment_id, or supersedes_shipment_id in the body)."
    applies_to: ["GET /sample-shipments/{sample_shipment_id}", "POST /sample-shipments", "POST /sample-shipments/{sample_shipment_id}/cancel", "POST /sample-shipments/{sample_shipment_id}/deliver", "POST /sample-shipments/{sample_shipment_id}/report-lost", "POST /diversion-cases"]

  - id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    condition: "No ReviewSubmission with the given id (path parameter or review_submission_id in the body)."
    applies_to: ["GET /review-submissions/{review_submission_id}", "POST /review-submissions/{review_submission_id}/submit", "POST /review-submissions/{review_submission_id}/moderate", "POST /review-submissions/{review_submission_id}/revise", "POST /syndication-records"]

  - id: ERR_RETAILER_NOT_FOUND
    http_status: 404
    condition: "No Retailer with the given id (path parameter, retailer_id in the body, or any member of syndication_retailer_ids)."
    applies_to: ["GET /retailers/{retailer_id}", "POST /campaigns", "POST /syndication-records"]

  - id: ERR_SYNDICATION_RECORD_NOT_FOUND
    http_status: 404
    condition: "No SyndicationRecord with the given id."
    applies_to: ["GET /syndication-records/{syndication_record_id}", "POST /syndication-records/{syndication_record_id}/dispatch"]

  - id: ERR_DIVERSION_CASE_NOT_FOUND
    http_status: 404
    condition: "No DiversionCase with the given id."
    applies_to: ["GET /diversion-cases/{diversion_case_id}", "POST /diversion-cases/{diversion_case_id}/investigate", "POST /diversion-cases/{diversion_case_id}/reopen", "POST /diversion-cases/{diversion_case_id}/dismiss", "POST /diversion-cases/{diversion_case_id}/substantiate"]

  - id: ERR_LIFT_ANALYSIS_NOT_FOUND
    http_status: 404
    condition: "No LiftAnalysis with the given id."
    applies_to: ["GET /lift-analyses/{lift_analysis_id}"]

  - id: ERR_PURCHASE_MATCH_NOT_FOUND
    http_status: 404
    condition: "No PurchaseMatch with the given id."
    applies_to: ["GET /purchase-matches/{purchase_match_id}"]

  # ---- state (409) ----
  - id: ERR_INVALID_CAMPAIGN_TRANSITION
    http_status: 409
    condition: "The campaign's own lifecycle transition is not declared from its current status, or a dependent write is attempted against a CLOSED campaign (for example activating a DRAFT campaign, resuming a campaign that is not SUSPENDED, adding a kit line after SCREENING_OPEN, or retiring a kit line on a CLOSED campaign). Campaign-status gating of enrollment, screening, allocation, review and lift-analysis writes belongs exclusively to ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS at priority 11."
    applies_to: ["POST /campaigns/{campaign_id}/open-screening", "POST /campaigns/{campaign_id}/activate-sampling", "POST /campaigns/{campaign_id}/suspend", "POST /campaigns/{campaign_id}/resume", "POST /campaigns/{campaign_id}/open-review-window", "POST /campaigns/{campaign_id}/close", "POST /kit-lines", "POST /kit-lines/{kit_line_id}/retire"]

  - id: ERR_INVALID_KIT_LINE_STATE
    http_status: 409
    condition: "Retiring a kit line whose status is already RETIRED."
    applies_to: ["POST /kit-lines/{kit_line_id}/retire"]

  - id: ERR_INVALID_WAVE_STATE
    http_status: 409
    condition: "The wave's status does not permit the operation: locking a wave that is not PLANNED, releasing a wave that is not LOCKED, or allocating a shipment into a wave that is not PLANNED."
    applies_to: ["POST /fulfillment-waves/{fulfillment_wave_id}/lock", "POST /fulfillment-waves/{fulfillment_wave_id}/release", "POST /sample-shipments"]

  - id: ERR_INVALID_SHIPMENT_STATE
    http_status: 409
    condition: "The shipment's status does not permit the operation: cancelling a shipment that is not ALLOCATED, delivering or reporting lost a shipment that is not SHIPPED, or superseding a shipment that is neither CANCELLED nor LOST."
    applies_to: ["POST /sample-shipments", "POST /sample-shipments/{sample_shipment_id}/cancel", "POST /sample-shipments/{sample_shipment_id}/deliver", "POST /sample-shipments/{sample_shipment_id}/report-lost"]

  - id: ERR_INVALID_REVIEW_STATE
    http_status: 409
    condition: "The review's status does not permit the operation: submitting a review whose status is not DRAFT, moderating a review that is not SUBMITTED, revising a review that is not CHANGES_REQUESTED, or dispatching a syndication record whose review is not APPROVED. Queueing a syndication record is allowed from any review status; publication is what requires APPROVED."
    applies_to: ["POST /review-submissions/{review_submission_id}/submit", "POST /review-submissions/{review_submission_id}/moderate", "POST /review-submissions/{review_submission_id}/revise", "POST /syndication-records/{syndication_record_id}/dispatch"]

  - id: ERR_INVALID_SYNDICATION_STATE
    http_status: 409
    condition: "Dispatching a syndication record whose status is not QUEUED."
    applies_to: ["POST /syndication-records/{syndication_record_id}/dispatch"]

  - id: ERR_INVALID_DIVERSION_CASE_STATE
    http_status: 409
    condition: "The case's status does not permit the operation: investigating a case that is not OPEN, or reopening / dismissing / substantiating a case that is not INVESTIGATING."
    applies_to: ["POST /diversion-cases/{diversion_case_id}/investigate", "POST /diversion-cases/{diversion_case_id}/reopen", "POST /diversion-cases/{diversion_case_id}/dismiss", "POST /diversion-cases/{diversion_case_id}/substantiate"]

  - id: ERR_ENROLLMENT_NOT_SCREENABLE
    http_status: 409
    condition: "The enrollment's screening axis does not permit the operation: screening an enrollment that is not PENDING_SCREEN, resubmitting answers for an enrollment that is not SCREEN_FAILED, or allocating a sample to an enrollment that is not SCREEN_PASSED."
    applies_to: ["POST /enrollments/{enrollment_id}/screen", "POST /enrollments/{enrollment_id}/resubmit-screening", "POST /sample-shipments"]

  - id: ERR_CAMPAIGN_NOT_ACCEPTING_ENROLLMENTS
    http_status: 409
    condition: "The owning campaign's status does not permit the operation: enrollment creation or screening while status is neither SCREENING_OPEN nor SAMPLING_ACTIVE; shipment allocation while status is not SAMPLING_ACTIVE; review draft creation or submission while status is neither SAMPLING_ACTIVE nor REVIEW_WINDOW; lift analysis while status is neither REVIEW_WINDOW nor CLOSED."
    applies_to: ["POST /enrollments", "POST /enrollments/{enrollment_id}/screen", "POST /sample-shipments", "POST /review-submissions", "POST /review-submissions/{review_submission_id}/submit", "POST /lift-analyses"]

  # ---- optimistic concurrency (412) ----
  - id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    condition: "expected_campaign_version does not equal the campaign's current version."
    applies_to: ["POST /lift-analyses"]

  - id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    condition: "expected_enrollment_version does not equal the enrollment's current version."
    applies_to: ["POST /sample-shipments"]

  # ---- integrity / safety ----
  - id: ERR_PANELIST_BANNED
    http_status: 403
    condition: "The targeted panelist's integrity_status is BANNED."
    applies_to: ["POST /enrollments", "POST /enrollments/{enrollment_id}/screen", "POST /enrollments/{enrollment_id}/resubmit-screening", "POST /sample-shipments", "POST /review-submissions", "POST /review-submissions/{review_submission_id}/submit", "POST /syndication-records"]

  - id: ERR_PANELIST_INTEGRITY_HOLD
    http_status: 403
    condition: "The targeted panelist's integrity_status is FLAGGED, which holds their content out of any outbound retailer feed while a diversion case is under investigation."
    applies_to: ["POST /syndication-records", "POST /syndication-records/{syndication_record_id}/dispatch"]

  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "The X-User-ID performing the action already performed the conflicting prior step: approving a review whose changes the same moderator requested, or substantiating a diversion case the same moderator opened."
    applies_to: ["POST /review-submissions/{review_submission_id}/moderate", "POST /diversion-cases/{diversion_case_id}/substantiate"]

  # ---- compliance posture gates ----
  - id: ERR_CAMPAIGN_POSTURE_FROZEN
    http_status: 409
    condition: "The campaign's compliance_posture is FROZEN, which blocks screening, allocation, syndication queueing, syndication dispatch and resume until the posture clears."
    applies_to: ["POST /campaigns/{campaign_id}/resume", "POST /sample-shipments", "POST /syndication-records", "POST /syndication-records/{syndication_record_id}/dispatch", "POST /enrollments/{enrollment_id}/screen"]

  - id: ERR_CAMPAIGN_POSTURE_RESTRICTED
    http_status: 409
    condition: "The campaign's compliance_posture is RESTRICTED, which blocks queueing and dispatching syndication while still permitting sample allocation."
    applies_to: ["POST /syndication-records", "POST /syndication-records/{syndication_record_id}/dispatch"]

  # ---- disclosure and honest-opinion policy ----
  - id: ERR_HONEST_OPINION_NOT_ATTESTED
    http_status: 422
    condition: "A review is submitted without honest_opinion_attested == true."
    applies_to: ["POST /review-submissions/{review_submission_id}/submit"]

  - id: ERR_DISCLOSURE_STATEMENT_MISSING
    http_status: 422
    condition: "An incentivized review is submitted or revised with a disclosure_statement that is absent, blank, or contains none of the required disclosure phrases (case-insensitive substring match)."
    applies_to: ["POST /review-submissions/{review_submission_id}/submit", "POST /review-submissions/{review_submission_id}/revise"]

  - id: ERR_REVIEW_TOO_SHORT
    http_status: 422
    condition: "The review's word_count is strictly below the campaign's min_review_word_count, on submit or on revise."
    applies_to: ["POST /review-submissions/{review_submission_id}/submit", "POST /review-submissions/{review_submission_id}/revise"]

  # ---- syndication referential / feed policy ----
  - id: ERR_RETAILER_NOT_IN_CAMPAIGN
    http_status: 422
    condition: "The retailer_id is not a member of the owning campaign's syndication_retailer_ids."
    applies_to: ["POST /syndication-records"]

  - id: ERR_RETAILER_FEED_PAUSED
    http_status: 409
    condition: "The retailer's feed_status is PAUSED."
    applies_to: ["POST /syndication-records", "POST /syndication-records/{syndication_record_id}/dispatch"]

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    condition: "The panelist already has an Enrollment on this campaign whose screening_status is not SCREEN_REVOKED."
    applies_to: ["POST /enrollments"]

  - id: ERR_DUPLICATE_SYNDICATION_TARGET
    http_status: 409
    condition: "A SyndicationRecord already exists for this (review_submission_id, retailer_id) pair in a status other than REJECTED."
    applies_to: ["POST /syndication-records"]

  # ---- eligibility ----
  - id: ERR_HOLDOUT_ENROLLMENT_NOT_SAMPLEABLE
    http_status: 422
    condition: "A sample shipment is allocated to an enrollment whose holdout_flag is true; holdout members must never receive a sample."
    applies_to: ["POST /sample-shipments"]

  - id: ERR_ENROLLMENT_NOT_ELIGIBLE_FOR_REVIEW
    http_status: 422
    condition: "A review is submitted while the obligation_status of its enrollment is not REVIEW_DUE. Drafting is unrestricted; eligibility is enforced only at submission."
    applies_to: ["POST /review-submissions/{review_submission_id}/submit"]

  # ---- inventory, capacity and budget ----
  - id: ERR_CAMPAIGN_KIT_EMPTY
    http_status: 422
    condition: "The campaign has no ACTIVE KitLine, so no kit can be assembled."
    applies_to: ["POST /campaigns/{campaign_id}/open-screening", "POST /sample-shipments"]

  - id: ERR_WAVE_CAPACITY_EXCEEDED
    http_status: 422
    condition: "planned_unit_count + this shipment's kit_unit_total would exceed the wave's planned_capacity_units."
    applies_to: ["POST /sample-shipments"]

  - id: ERR_CENTER_CAPACITY_EXCEEDED
    http_status: 422
    condition: "The sum of planned_unit_count across every non-RELEASED wave on the center whose window overlaps this wave's half-open window, plus this shipment's kit_unit_total, would exceed the center's daily_pick_capacity_units."
    applies_to: ["POST /sample-shipments"]

  - id: ERR_KIT_STOCK_INSUFFICIENT
    http_status: 422
    condition: "At least one ACTIVE KitLine has units_available strictly below its quantity_per_kit; reservation is all-or-nothing."
    applies_to: ["POST /sample-shipments"]

  - id: ERR_WRITE_OFF_EXCEEDS_AVAILABLE
    http_status: 422
    condition: "The requested write-off units exceed the kit line's units_available."
    applies_to: ["POST /kit-lines/{kit_line_id}/write-offs"]

  - id: ERR_PURCHASE_MATCH_OUT_OF_WINDOW
    http_status: 422
    condition: "purchased_at is strictly before the campaign's sampling_window_start or strictly after sampling_window_end plus CONVERSION_TAIL_DAYS."
    applies_to: ["POST /purchase-matches"]

  - id: ERR_CAMPAIGN_BUDGET_EXHAUSTED
    http_status: 422
    condition: "committed_cost_cents for this allocation exceeds the campaign's budget_available_cents."
    applies_to: ["POST /sample-shipments"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# role_model: segregation_of_duties
# =============================================================================
roles:
  - name: CampaignManager
    description: "Owns campaign definition and lifecycle: objective, audience, kit composition, budget, screening decisions, syndication queueing and lift measurement."
    identity: opaque
    exclusive_operations:
      - "POST /campaigns"
      - "POST /campaigns/{campaign_id}/open-screening"
      - "POST /campaigns/{campaign_id}/activate-sampling"
      - "POST /campaigns/{campaign_id}/open-review-window"
      - "POST /campaigns/{campaign_id}/close"
      - "POST /kit-lines"
      - "POST /kit-lines/{kit_line_id}/retire"
      - "POST /enrollments/{enrollment_id}/screen"
      - "POST /lift-analyses"
    shared_operations:
      - "POST /enrollments (shared with Panelist)"
      - "POST /retailers (shared with PlatformAdmin)"
      - "POST /syndication-records (shared with FulfillmentOps)"
      - "every GET listed with CampaignManager in §1.5"

  - name: ComplianceModerator
    description: "Independent compliance function: review moderation and disclosure enforcement, fraud rescoring, diversion case handling, and campaign suspension. Cannot allocate inventory or define campaigns."
    identity: opaque
    exclusive_operations:
      - "POST /campaigns/{campaign_id}/suspend"
      - "POST /campaigns/{campaign_id}/resume"
      - "POST /panelists/{panelist_id}/risk-rescore"
      - "POST /review-submissions/{review_submission_id}/moderate"
      - "POST /diversion-cases"
      - "POST /diversion-cases/{diversion_case_id}/investigate"
      - "POST /diversion-cases/{diversion_case_id}/reopen"
      - "POST /diversion-cases/{diversion_case_id}/dismiss"
      - "POST /diversion-cases/{diversion_case_id}/substantiate"
    shared_operations:
      - "every GET listed with ComplianceModerator in §1.5"
    segregation_of_duties:
      - "The X-User-ID that requested changes on a review MUST NOT be the X-User-ID that later approves it (ERR_SEGREGATION_OF_DUTIES)."
      - "The X-User-ID that opened a diversion case MUST NOT be the X-User-ID that substantiates it (ERR_SEGREGATION_OF_DUTIES)."

  - name: FulfillmentOps
    description: "Runs inventory, wave planning and outbound logistics: receipts, write-offs, allocation, wave lock/release, delivery outcomes and feed dispatch."
    identity: opaque
    exclusive_operations:
      - "POST /fulfillment-centers"
      - "POST /fulfillment-waves"
      - "POST /fulfillment-waves/{fulfillment_wave_id}/lock"
      - "POST /fulfillment-waves/{fulfillment_wave_id}/release"
      - "POST /kit-lines/{kit_line_id}/receipts"
      - "POST /kit-lines/{kit_line_id}/write-offs"
      - "POST /sample-shipments"
      - "POST /sample-shipments/{sample_shipment_id}/cancel"
      - "POST /sample-shipments/{sample_shipment_id}/deliver"
      - "POST /sample-shipments/{sample_shipment_id}/report-lost"
      - "POST /syndication-records/{syndication_record_id}/dispatch"
    shared_operations:
      - "POST /syndication-records (shared with CampaignManager)"
      - "every GET listed with FulfillmentOps in §1.5"

  - name: Panelist
    description: "A recruited panel member acting on their own enrollments and reviews only. Every write is scoped by ownership; X-User-ID resolves to the Panelist row whose id equals it."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /enrollments/{enrollment_id}/resubmit-screening"
      - "POST /review-submissions"
      - "POST /review-submissions/{review_submission_id}/submit"
      - "POST /review-submissions/{review_submission_id}/revise"
    shared_operations:
      - "POST /enrollments (shared with CampaignManager)"
      - "GET /enrollments/{enrollment_id} and GET /review-submissions/{review_submission_id}, restricted to their own rows (ERR_NOT_RESOURCE_OWNER otherwise)"

  - name: PlatformAdmin
    description: "Platform operator: retailer registry, purchase-data ingestion, panelist administration, logical clock control and full read access. Deliberately holds no campaign, moderation or allocation authority."
    identity: opaque
    exclusive_operations:
      - "POST /purchase-matches"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /panelists (shared with Anonymous)"
      - "POST /retailers (shared with CampaignManager)"
      - "every GET listed with PlatformAdmin in §1.5"

  - name: Anonymous
    description: "Unauthenticated self-service recruitment. The only endpoint reachable without a valid X-User-ID header is panel sign-up; every other endpoint returns ERR_UNAUTHENTICATED."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /panelists (shared with PlatformAdmin)"
