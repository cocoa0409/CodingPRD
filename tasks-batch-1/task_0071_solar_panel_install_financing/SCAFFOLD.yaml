        constraints: ">= 0"

  - name: Utility
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by 1 on every mutation."
      - name: name
        type: string
        source: input
        description: "Utility company name."
      - name: state_code
        type: string
        source: input
        description: "2-letter state the utility serves."
        constraints: "in {CA, NJ, MA, TX, AZ}"
      - name: feeder_headroom_kw
        type: number
        source: input
        description: "Remaining export capacity in kW on the utility feeder. Decremented when an interconnection is APPROVED; restored if REJECTED after approval is impossible (terminal)."
        constraints: ">= 0"
      - name: net_metering_rate_cents_per_kwh
        type: number
        source: input
        description: "Retail credit rate in cents/kWh applied to net exports under net metering."
        constraints: ">= 0"
      - name: export_credit_ratio
        type: number
        source: input
        description: "Fraction of retail rate credited to net exports (1.0 = full retail net metering; <1.0 = net billing). Drives net-metering variant."
        default: 1.0
        constraints: "0.0 <= x <= 1.0"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Project
    initial_state: REQUESTED
    terminal_states: [OPERATIONAL, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSESSED
        trigger: "POST /solar/projects/{id}/assess"
        actor: SolarInstaller
        preconditions:
          - "project.status == REQUESTED"
          - "0.0 <= shading_factor <= 1.0 and peak_sun_hours >= 0"
        side_effects:
          - "set project.shading_factor and project.peak_sun_hours from payload"
          - "increment project.version by 1"
      - from: ASSESSED
        to: DESIGNED
        trigger: "POST /solar/projects/{id}/design"
        actor: SolarInstaller
        preconditions:
          - "project.status == ASSESSED"
          - "acting SolarInstaller is licensed in homeowner.state_code (state_code in installer.licensed_states)"
          - "roof_area_sqft > 0"
        side_effects:
          - "set project.installer_id"
          - "compute project.system_size_kw (calc: size_system)"
          - "compute project.estimated_annual_production_kwh (calc: estimate_production)"
          - "set project.gross_system_cost_cents from payload"
          - "compute project.itc_credit_cents (calc: itc_credit), initially attributed to project pending financing"
          - "increment project.version by 1"
      - from: DESIGNED
        to: PERMIT_PENDING
        trigger: "POST /solar/projects/{id}/submit-permit"
        actor: SolarInstaller
        preconditions:
          - "project.status == DESIGNED"
          - "project.financing_plan_id is not null and its FinancingPlan.status == ACTIVE"
        side_effects:
          - "increment project.version by 1"
      - from: PERMIT_PENDING
        to: PERMIT_APPROVED
        trigger: "POST /solar/projects/{id}/approve-permit"
        actor: PlatformAdmin
        preconditions:
          - "project.status == PERMIT_PENDING"
        side_effects:
          - "increment project.version by 1"
      - from: PERMIT_APPROVED
        to: INSTALLED
        trigger: "POST /solar/projects/{id}/complete-install"
        actor: SolarInstaller
        preconditions:
          - "project.status == PERMIT_APPROVED"
          - "acting installer.id == project.installer_id"
        side_effects:
          - "increment project.version by 1"
      - from: INSTALLED
        to: FAILED_INSPECTION
        trigger: "POST /solar/projects/{id}/inspect (result=FAIL)"
        actor: PlatformAdmin
        preconditions:
          - "project.status == INSTALLED"
        side_effects:
          - "increment project.version by 1"
      - from: INSTALLED
        to: PTO_PENDING
        trigger: "POST /solar/projects/{id}/inspect (result=PASS)"
        actor: PlatformAdmin
        preconditions:
          - "project.status == INSTALLED"
        side_effects:
          - "increment project.version by 1"
      - from: FAILED_INSPECTION
        to: REMEDIATION
        trigger: "POST /solar/projects/{id}/start-remediation"
        actor: SolarInstaller
        preconditions:
          - "project.status == FAILED_INSPECTION"
          - "acting installer.id == project.installer_id"
        side_effects:
          - "increment project.version by 1"
      - from: REMEDIATION
        to: INSTALLED
        trigger: "POST /solar/projects/{id}/complete-install"
        actor: SolarInstaller
        preconditions:
          - "project.status == REMEDIATION"
          - "acting installer.id == project.installer_id"
        side_effects:
          - "increment project.version by 1"
        note: "Revision loop: REMEDIATION -> INSTALLED re-enters the inspection branch (cyclic)."
      - from: PTO_PENDING
        to: OPERATIONAL
        trigger: "POST /solar/interconnection-applications/{id}/grant-pto (cross-entity)"
        actor: Utility
        preconditions:
          - "project.status == PTO_PENDING"
          - "the project's InterconnectionApplication.status == APPROVED"
        side_effects:
          - "set InterconnectionApplication.status = PTO_GRANTED"
          - "create WarrantyPolicy for the project with coverage_start = now (calc: none; copies estimate)"
          - "increment project.version by 1"
        note: "Cross-entity: granting PTO on the InterconnectionApplication drives the Project terminal transition and mints the warranty."
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /solar/projects/{id}/cancel"
        actor: Homeowner
        preconditions:
          - "project.status in {REQUESTED, ASSESSED, DESIGNED}"
          - "acting homeowner.id == project.homeowner_id"
        side_effects:
          - "if project.financing_plan_id is not null, cascade FinancingPlan.status -> TERMINATED"
          - "increment project.version by 1"
      - from: ASSESSED
        to: CANCELLED
        trigger: "POST /solar/projects/{id}/cancel"
        actor: Homeowner
        preconditions:
          - "project.status in {REQUESTED, ASSESSED, DESIGNED}"
          - "acting homeowner.id == project.homeowner_id"
        side_effects:
          - "if project.financing_plan_id is not null, cascade FinancingPlan.status -> TERMINATED"
          - "increment project.version by 1"
      - from: DESIGNED
        to: CANCELLED
        trigger: "POST /solar/projects/{id}/cancel"
        actor: Homeowner
        preconditions:
          - "project.status in {REQUESTED, ASSESSED, DESIGNED}"
          - "acting homeowner.id == project.homeowner_id"
        side_effects:
          - "cascade FinancingPlan.status -> TERMINATED (depth-1)"
          - "increment project.version by 1"

  - entity: FinancingPlan
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /solar/financing-plans/{id}/activate"
        actor: Homeowner
        preconditions:
          - "plan.status == DRAFT"
          - "the plan's Project.status == DESIGNED"
          - "acting homeowner.id == project.homeowner_id"
        side_effects:
          - "compute plan.monthly_payment_cents (calc: financing_monthly_payment)"
          - "set project.financing_plan_id = plan.id"
          - "recompute project.itc_credit_cents attribution: if model==LOAN itc_beneficiary=HOMEOWNER else FINANCIER"
          - "increment project.version by 1 (derived-field reconciliation on project)"
          - "increment plan.version by 1"
        note: "Branch point: model selected at create; activation pins srec_owner / itc_beneficiary."
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /solar/projects/{id}/cancel (cascade)"
        actor: system
        preconditions:
          - "plan.status == DRAFT"
        side_effects:
          - "increment plan.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /solar/projects/{id}/cancel (cascade) — only while project still cancellable"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "increment plan.version by 1"

  - entity: InterconnectionApplication
    initial_state: FILED
    terminal_states: [PTO_GRANTED, REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /solar/interconnection-applications/{id}/begin-review"
        actor: Utility
        preconditions:
          - "app.status == FILED"
          - "acting utility.id == app.utility_id"
        side_effects:
          - "increment app.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /solar/interconnection-applications/{id}/approve"
        actor: Utility
        preconditions:
          - "app.status == UNDER_REVIEW"
          - "acting utility.id == app.utility_id"
          - "utility.feeder_headroom_kw >= app.requested_export_kw"
        side_effects:
          - "decrement utility.feeder_headroom_kw by app.requested_export_kw (cross-entity ledger sync)"
          - "increment utility.version by 1"
          - "increment app.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /solar/interconnection-applications/{id}/reject"
        actor: Utility
        preconditions:
          - "app.status == UNDER_REVIEW"
          - "acting utility.id == app.utility_id"
        side_effects:
          - "increment app.version by 1"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /solar/interconnection-applications/{id}/withdraw"
        actor: Utility
        preconditions:
          - "app.status == APPROVED"
          - "acting utility.id == app.utility_id"
          - "the application's Project.status != OPERATIONAL"
        side_effects:
          - "restore utility.feeder_headroom_kw by app.requested_export_kw (compensating action; reverses the approve decrement)"
          - "increment utility.version by 1"
          - "increment app.version by 1"
        note: "Compensating action: withdraw after approval restores the exact feeder_headroom_kw the approve decremented, conserving total feeder capacity."
      - from: APPROVED
        to: PTO_GRANTED
        trigger: "POST /solar/interconnection-applications/{id}/grant-pto"
        actor: Utility
        preconditions:
          - "app.status == APPROVED"
          - "acting utility.id == app.utility_id"
          - "the application's Project.status == PTO_PENDING"
        side_effects:
          - "set project.status = OPERATIONAL (cross-entity; depth-2 cascade source)"
          - "create WarrantyPolicy for project (coverage_start = now, coverage_years = 25)"
          - "increment app.version by 1"
          - "increment project.version by 1"

  - entity: SREC
    initial_state: MINTED
    terminal_states: [RETIRED]
    transitions:
      - from: MINTED
        to: LISTED
        trigger: "POST /solar/srecs/{id}/list"
        actor: Homeowner
        preconditions:
          - "srec.status == MINTED"
          - "the SREC's Project.status == OPERATIONAL"
        side_effects:
          - "increment srec.version by 1"
      - from: LISTED
        to: SOLD
        trigger: "POST /solar/srec-sales (sweep, cross-entity)"
        actor: SrecBroker
        preconditions:
          - "srec.status == LISTED"
        side_effects:
          - "set srec.srec_sale_id"
          - "increment srec.version by 1"
      - from: SOLD
        to: RETIRED
        trigger: "POST /solar/srecs/{id}/retire"
        actor: SrecBroker
        preconditions:
          - "srec.status == SOLD"
        side_effects:
          - "increment srec.version by 1"

  - entity: NetMeterPeriod
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /solar/net-meter-periods/{id}/settle"
        actor: Utility
        preconditions:
          - "period.status == OPEN"
          - "the period's Project.status == OPERATIONAL"
          - "no earlier OPEN period exists on the same project (settle in chronological period_start order)"
        side_effects:
          - "compute period.net_kwh, period.bill_credit_cents, period.bank_kwh_after (calc: net_metering_settlement)"
          - "carry bank_kwh_after forward as the bank baseline for the next period (project-level accumulator)"
          - "increment period.version by 1"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, REMEDIATED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /solar/warranty-claims/{id}/request-info"
        actor: SolarInstaller
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "increment claim.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /solar/warranty-claims/{id}/resubmit"
        actor: Homeowner
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "acting homeowner.id == project.homeowner_id"
        side_effects:
          - "increment claim.version by 1"
        note: "Cyclic revision loop INFO_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /solar/warranty-claims/{id}/approve"
        actor: SolarInstaller
        preconditions:
          - "claim.status == SUBMITTED"
          - "for PRODUCTION_SHORTFALL: shortfall_kwh > 0 after evaluation (calc: production_shortfall_eval)"
          - "the claim's Project.status == OPERATIONAL"
        side_effects:
          - "compute claim.measured_production_kwh, claim.shortfall_kwh, claim.payout_cents (calc: production_shortfall_eval)"
          - "increment claim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /solar/warranty-claims/{id}/deny"
        actor: SolarInstaller
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "increment claim.version by 1"
      - from: APPROVED
        to: REMEDIATED
        trigger: "POST /solar/warranty-claims/{id}/remediate"
        actor: SolarInstaller
        preconditions:
          - "claim.status == APPROVED"
        side_effects:
          - "increment claim.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: srec-sale-stale-project
    parent_entity: Project
    write_endpoint: "POST /solar/srec-sales"
    occ_field: "expected_project_version"
    description: |
      Creating an SrecSale sweeps all LISTED SRECs of a project+vintage into a
      single sale and stamps each as SOLD. A second SrecSale create that still
      carries the project version the client last observed is rejected when the
      project's version has since advanced — for instance because another sale
      already swept (and emptied) the LISTED pool, or new periods/SRECs mutated
      the project. The stale-version check makes the sweep deterministic against
      a snapshot the client actually observed, rather than against whatever the
      LISTED pool happens to hold at execution time.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: financing-activate-stale-project
    parent_entity: Project
    write_endpoint: "POST /solar/financing-plans/{id}/activate"
    occ_field: "expected_project_version"
    description: |
      Activating a FinancingPlan attaches it to its Project (sets
      project.financing_plan_id, recomputes ITC attribution) and bumps the
      project version. A second activate carrying the project version the client
      previously observed is rejected once the project version has advanced — for
      example because a different DRAFT plan for the same project was activated
      first and legitimately became the attached plan. The OCC check resolves
      which DRAFT plan binds to a project against a snapshot the client observed.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: size_system
    trigger: "POST /solar/projects/{id}/design (DESIGNED transition)"
    algorithm: threshold
    formula: |
      # System size capped by BOTH roof area and a usage-offset target; pick the smaller.
      area_cap_kw   = floor((roof_area_sqft / SQFT_PER_KW) * 100) / 100        # 2 dp, floor
      usage_target_kw = (annual_kwh_usage * USAGE_OFFSET) /
                        (peak_sun_hours * 365 * (1 - shading_factor))
      usage_target_kw = floor(usage_target_kw * 100) / 100                     # 2 dp, floor
      system_size_kw = min(area_cap_kw, usage_target_kw)
      # Boundary: if peak_sun_hours == 0 OR (1 - shading_factor) == 0 -> ERR_DESIGN_INFEASIBLE
    input_set: "single Project; uses roof_area_sqft, annual_kwh_usage, peak_sun_hours, shading_factor"
    constants:
      SQFT_PER_KW: 70
      USAGE_OFFSET: 1.0
    precision: "2 decimal places, floor (truncate toward zero); kW"
    variants: []

  - name: estimate_production
    trigger: "POST /solar/projects/{id}/design (DESIGNED transition)"
    algorithm: weighted_scoring
    formula: |
      estimated_annual_production_kwh =
        round( system_size_kw * peak_sun_hours * 365 * (1 - shading_factor) * SYSTEM_DERATE )
      # round_half_up to nearest whole kWh
    input_set: "single Project; uses system_size_kw (from size_system), peak_sun_hours, shading_factor"
    constants:
      SYSTEM_DERATE: 0.80
    precision: "0 decimal places (whole kWh), round_half_up"
    variants: []

  - name: itc_credit
    trigger: "POST /solar/projects/{id}/design; re-attributed on financing-plans/{id}/activate"
    algorithm: threshold
    formula: |
      base_rate = ITC_RATE                                  # 0.30 federal
      # Domestic-content / energy-community adders are tiered by state_code:
      adder = STATE_ADDER[state_code]                       # default 0.00
      effective_rate = min(base_rate + adder, ITC_RATE_CAP) # cap 0.40
      itc_credit_cents = round_half_up(gross_system_cost_cents * effective_rate)
      # Attribution (set at activate): LOAN -> HOMEOWNER, PPA/LEASE -> FINANCIER
    input_set: "single Project + Homeowner.state_code; attribution depends on FinancingPlan.model"
    constants:
      ITC_RATE: 0.30
      ITC_RATE_CAP: 0.40
      STATE_ADDER: { CA: 0.00, NJ: 0.10, MA: 0.10, TX: 0.00, AZ: 0.10 }
    precision: "0 decimal places (cents), round_half_up"
    variants:
      - name: homeowner_claims
        when: "FinancingPlan.model == LOAN"
        difference: "itc_beneficiary = HOMEOWNER; the homeowner books the credit."
      - name: financier_claims
        when: "FinancingPlan.model in {PPA, LEASE}"
        difference: "itc_beneficiary = FINANCIER; the third-party owner books the credit (homeowner gets none)."

  - name: financing_monthly_payment
    trigger: "POST /solar/financing-plans/{id}/activate (DRAFT->ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      if model == LEASE:
        monthly_payment_cents = lease_monthly_cents
      elif model == LOAN:
        r = loan_apr / 12.0
        n = term_years * 12
        if r == 0:
          monthly_payment_cents = round_half_up(loan_principal_cents / n)
        else:
          factor = (r * (1+r)**n) / ((1+r)**n - 1)
          monthly_payment_cents = round_half_up(loan_principal_cents * factor)
      elif model == PPA:
        # Year-1 PPA monthly is an estimate from production (escalator ignored in year 1):
        annual_ppa_cents = estimated_annual_production_kwh * ppa_rate_cents_per_kwh
        monthly_payment_cents = round_half_up(annual_ppa_cents / 12)
    input_set: "single FinancingPlan + its Project (for PPA production)"
    constants: {}
    precision: "0 decimal places (cents), round_half_up; loan uses standard amortization"
    variants:
      - name: loan_amortized
        when: "model == LOAN"
        difference: "Standard annuity amortization over term; interest-bearing."
      - name: lease_fixed
        when: "model == LEASE"
        difference: "Flat contractual monthly; production-independent."
      - name: ppa_production_based
        when: "model == PPA"
        difference: "Derived from year-1 production estimate × rate; production-dependent."

  - name: srec_sale_settlement
    trigger: "POST /solar/srec-sales (sweep create)"
    algorithm: aggregation
    formula: |
      # Sweep: all SRECs of (project_id, vintage_year) with status == LISTED.
      # Process in chronological mint order: ORDER BY SREC.created_at ASC, then id is NOT used.
      swept = [s for s in SRECs
               if s.project_id == sale.project_id
               and s.vintage_year == sale.vintage_year
               and s.status == LISTED]
      srec_count = len(swept)
      if srec_count == 0: -> ERR_NO_LISTED_SRECS
      gross_proceeds_cents = srec_count * price_cents_per_srec
      # Rounding order PINNED: compute fee on the gross total, then subtract (sum-then-round).
      fee_cents = round_half_up(gross_proceeds_cents * broker.broker_fee_pct)
      net_proceeds_cents = gross_proceeds_cents - fee_cents
    input_set: "all LISTED SRECs matching sale.project_id + sale.vintage_year"
    constants: {}
    precision: "0 decimal places (cents), round_half_up; fee computed on the gross total (sum-then-round), NOT per-SREC"
    variants: []

  - name: net_metering_settlement
    trigger: "POST /solar/net-meter-periods/{id}/settle (OPEN->SETTLED)"
    algorithm: chronological
    formula: |
      # Periods settle in chronological period_start ASC order; bank carries forward.
      net_kwh = kwh_produced - kwh_consumed             # signed
      bank_before = current project kWh bank (0 for first period)
      if net_kwh >= 0:                                   # surplus exported
        # surplus first reduces nothing owed; banks at export_credit_ratio, but credited cash
        export_kwh = net_kwh
        credited_kwh = floor(export_kwh)                 # whole kWh
        bill_credit_cents = round_half_up(
            credited_kwh * utility.net_metering_rate_cents_per_kwh * utility.export_credit_ratio)
        bank_kwh_after = bank_before + export_kwh        # bank grows by full surplus
      else:                                              # net consumption
        deficit_kwh = -net_kwh
        drawn = min(bank_before, deficit_kwh)            # draw from bank first
        bank_kwh_after = bank_before - drawn
        billable_kwh = deficit_kwh - drawn
        bill_credit_cents = -round_half_up(
            billable_kwh * utility.net_metering_rate_cents_per_kwh)   # negative = charge
    input_set: "single NetMeterPeriod + project's prior settled bank + Utility rates"
    constants: {}
    precision: "0 decimal places (cents), round_half_up; kWh whole numbers"
    variants:
      - name: full_retail_net_metering
        when: "utility.export_credit_ratio == 1.0"
        difference: "Surplus credited at full retail rate; symmetric with consumption charge."
      - name: net_billing
        when: "utility.export_credit_ratio < 1.0"
        difference: "Surplus credited at a discounted export rate while consumption is charged at full retail — asymmetric, produces a different bill_credit_cents for identical net_kwh."

  - name: production_shortfall_eval
    trigger: "POST /solar/warranty-claims/{id}/approve (PRODUCTION_SHORTFALL)"
    algorithm: aggregation
    formula: |
      # Measured production = sum kwh_produced over SETTLED NetMeterPeriods whose
      # period_start >= claimed_window_start AND period_end <= claimed_window_end.
      measured_production_kwh = sum(p.kwh_produced for p in SETTLED periods of project
                                    where p.period_start >= window_start
                                    and p.period_end <= window_end)
      guaranteed_kwh = floor(project.estimated_annual_production_kwh * policy.production_guarantee_pct)
      shortfall_kwh = max(0, guaranteed_kwh - measured_production_kwh)
      # Payout: shortfall valued at the project's net-metering retail rate (utility of its interconnection).
      payout_cents = round_half_up(shortfall_kwh * utility.net_metering_rate_cents_per_kwh)
    input_set: "SETTLED NetMeterPeriods of the project within [window_start, window_end); policy guarantee; utility rate"
    constants: {}
    precision: "0 decimal places; guaranteed_kwh floored, payout round_half_up"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except anonymous registration endpoints"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path/body-referenced resources exist, validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 4
    category: auth
    check: "Acting entity_backed user owns the resource (homeowner.id == project.homeowner_id; installer.id == project.installer_id; utility.id == app.utility_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped transitions"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "SolarInstaller is licensed in the homeowner's state_code before design"
    error_id: ERR_INSTALLER_NOT_LICENSED
    http_status: 422
    applies_to: "POST /solar/projects/{id}/design"
  - priority: 7
    category: business_constraint
    check: "Sunlight assessment is feasible: peak_sun_hours > 0 and shading_factor < 1.0 (else system size is undefined)"
    error_id: ERR_DESIGN_INFEASIBLE
    http_status: 422
    applies_to: "POST /solar/projects/{id}/design"
  - priority: 8
    category: business_referential
    check: "FinancingPlan model-specific required fields present (PPA needs rate+escalator; LEASE needs lease_monthly_cents; LOAN needs principal+apr)"
    error_id: ERR_FINANCING_FIELDS_MISSING
    http_status: 422
    applies_to: "POST /solar/financing-plans"
  - priority: 9
    category: business_constraint
    check: "A Project may have at most one non-TERMINATED FinancingPlan; activating a second is rejected"
    error_id: ERR_FINANCING_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /solar/financing-plans/{id}/activate"
  - priority: 10
    category: business_temporal
    check: "NetMeterPeriod [period_start, period_end) must not overlap any existing period on the same project (half-open intervals; touching endpoints allowed)"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /solar/net-meter-periods"
  - priority: 11
    category: business_temporal
    check: "period_end must be strictly after period_start; claimed_window_end strictly after claimed_window_start"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /solar/net-meter-periods, POST /solar/warranty-claims"
  - priority: 11.5
    category: business_temporal
    check: "A PRODUCTION_SHORTFALL claim's [claimed_window_start, claimed_window_end] must not overlap any non-DENIED PRODUCTION_SHORTFALL claim on the same project, using CLOSED-interval semantics: two windows conflict when start_A <= end_B AND start_B <= end_A (shared endpoints DO collide, unlike NetMeterPeriod's half-open rule)."
    error_id: ERR_CLAIM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /solar/warranty-claims"
  - priority: 12
    category: business_constraint
    check: "NetMeterPeriods settle in chronological period_start order; settling while an earlier OPEN period exists is rejected"
    error_id: ERR_OUT_OF_ORDER_SETTLEMENT
    http_status: 409
    applies_to: "POST /solar/net-meter-periods/{id}/settle"
  - priority: 13
    category: business_safety
    check: "Interconnection approval requires utility.feeder_headroom_kw >= requested_export_kw"
    error_id: ERR_INSUFFICIENT_FEEDER_HEADROOM
    http_status: 422
    applies_to: "POST /solar/interconnection-applications/{id}/approve"
  - priority: 14
    category: business_constraint
    check: "SrecSale sweep must find >= 1 LISTED SREC matching project_id + vintage_year"
    error_id: ERR_NO_LISTED_SRECS
    http_status: 422
    applies_to: "POST /solar/srec-sales"
  - priority: 15
    category: business_referential
    check: "SrecBroker must trade the homeowner's state_code market (state_code in broker.operating_states)"
    error_id: ERR_BROKER_MARKET_MISMATCH
    http_status: 422
    applies_to: "POST /solar/srec-sales"
  - priority: 16
    category: business_constraint
    check: "PRODUCTION_SHORTFALL approval requires shortfall_kwh > 0; zero shortfall cannot be approved"
    error_id: ERR_NO_SHORTFALL
    http_status: 422
    applies_to: "POST /solar/warranty-claims/{id}/approve"
  - priority: 17
    category: business_fiscal
    check: "OCC: expected_project_version matches Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /solar/srec-sales, POST /solar/financing-plans/{id}/activate"
  - priority: 18
    category: business_constraint
    check: "Required body fields present and well-typed; enums in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create endpoints"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Homeowner ---
  - method: POST
    path: "/solar/homeowners"
    description: "Register a homeowner."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, state_code, annual_kwh_usage]
    output: Homeowner
    side_effects: []
  - method: GET
    path: "/solar/homeowners/{id}"
    description: "Fetch a homeowner."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Homeowner
    side_effects: []

  # --- SolarInstaller ---
  - method: POST
    path: "/solar/installers"
    description: "Register a solar installer."
    roles: [Anonymous]
    code: 201
    input: [company_name, licensed_states]
    output: SolarInstaller
    side_effects: []
  - method: GET
    path: "/solar/installers/{id}"
    description: "Fetch an installer."
    roles: [SolarInstaller, PlatformAdmin]
    code: 200
    input: []
    output: SolarInstaller
    side_effects: []

  # --- Utility ---
  - method: POST
    path: "/solar/utilities"
    description: "Register a utility."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, feeder_headroom_kw, net_metering_rate_cents_per_kwh, "export_credit_ratio?"]
    output: Utility
    side_effects: []
  - method: GET
    path: "/solar/utilities/{id}"
    description: "Fetch a utility (observe feeder_headroom_kw, version)."
    roles: [Utility, PlatformAdmin]
    code: 200
    input: []
    output: Utility
    side_effects: []

  # --- SrecBroker ---
  - method: POST
    path: "/solar/brokers"
    description: "Register an SREC broker."
    roles: [Anonymous]
    code: 201
    input: [firm_name, broker_fee_pct, operating_states]
    output: SrecBroker
    side_effects: []
  - method: GET
    path: "/solar/brokers/{id}"
    description: "Fetch a broker."
    roles: [SrecBroker, PlatformAdmin]
    code: 200
    input: []
    output: SrecBroker
    side_effects: []

  # --- Project ---
  - method: POST
    path: "/solar/projects"
    description: "Create a project request."
    roles: [Homeowner]
    code: 201
    input: [homeowner_id, roof_area_sqft]
    output: Project
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/solar/projects/{id}"
    description: "Fetch a project (observe status, version, computed fields)."
    roles: [Homeowner, SolarInstaller, PlatformAdmin, Utility]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/solar/projects"
    description: "List projects, filterable by homeowner_id or installer_id (reverse-reachability)."
    roles: [Homeowner, SolarInstaller, PlatformAdmin]
    code: 200
    input: ["homeowner_id?", "installer_id?", "financing_plan_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/solar/projects/{id}/assess"
    description: "Record sunlight assessment (REQUESTED -> ASSESSED)."
    roles: [SolarInstaller]
    code: 200
    input: [shading_factor, peak_sun_hours]
    output: Project
    side_effects: ["set shading_factor, peak_sun_hours", "status=ASSESSED", "project.version += 1"]
  - method: POST
    path: "/solar/projects/{id}/design"
    description: "Submit design (ASSESSED -> DESIGNED); computes size, production, ITC."
    roles: [SolarInstaller]
    code: 200
    input: [installer_id, gross_system_cost_cents]
    output: Project
    side_effects: ["set installer_id", "compute system_size_kw", "compute estimated_annual_production_kwh", "compute itc_credit_cents", "status=DESIGNED", "project.version += 1"]
  - method: POST
    path: "/solar/projects/{id}/submit-permit"
    description: "Submit permit package (DESIGNED -> PERMIT_PENDING)."
    roles: [SolarInstaller]
    code: 200
    input: []
    output: Project
    side_effects: ["status=PERMIT_PENDING", "project.version += 1"]
  - method: POST
    path: "/solar/projects/{id}/approve-permit"
    description: "Approve permit (PERMIT_PENDING -> PERMIT_APPROVED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=PERMIT_APPROVED", "project.version += 1"]
  - method: POST
    path: "/solar/projects/{id}/complete-install"
    description: "Mark install complete (PERMIT_APPROVED|REMEDIATION -> INSTALLED)."
    roles: [SolarInstaller]
    code: 200
    input: []
    output: Project
    side_effects: ["status=INSTALLED", "project.version += 1"]
  - method: POST
    path: "/solar/projects/{id}/inspect"
    description: "Record inspection (INSTALLED -> PTO_PENDING on PASS, -> FAILED_INSPECTION on FAIL)."
    roles: [PlatformAdmin]
    code: 200
    input: [result]
    output: Project
    side_effects: ["status=PTO_PENDING or FAILED_INSPECTION", "project.version += 1"]
  - method: POST
    path: "/solar/projects/{id}/start-remediation"
    description: "Begin remediation (FAILED_INSPECTION -> REMEDIATION)."
    roles: [SolarInstaller]
    code: 200
    input: []
    output: Project
    side_effects: ["status=REMEDIATION", "project.version += 1"]
  - method: POST
    path: "/solar/projects/{id}/cancel"
    description: "Cancel a project (REQUESTED|ASSESSED|DESIGNED -> CANCELLED); cascades plan termination."
    roles: [Homeowner]
    code: 200
    input: []
    output: Project
    side_effects: ["status=CANCELLED", "cascade FinancingPlan -> TERMINATED if attached", "project.version += 1"]

  # --- FinancingPlan ---
  - method: POST
    path: "/solar/financing-plans"
    description: "Create a DRAFT financing plan (PPA/LEASE/LOAN) for a DESIGNED project."
    roles: [Homeowner]
    code: 201
    input: [project_id, model, term_years, "ppa_rate_cents_per_kwh?", "ppa_escalator_pct?", "lease_monthly_cents?", "loan_principal_cents?", "loan_apr?"]
    output: FinancingPlan
    side_effects: ["status=DRAFT", "set srec_owner + itc_beneficiary from model"]
  - method: GET
    path: "/solar/financing-plans/{id}"
    description: "Fetch a financing plan."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []
  - method: GET
    path: "/solar/financing-plans"
    description: "List financing plans, filterable by project_id (reverse-reachability)."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []
  - method: POST
    path: "/solar/financing-plans/{id}/activate"
    description: "Activate a DRAFT plan (DRAFT -> ACTIVE); computes monthly payment, attaches to project, recomputes ITC attribution. OCC on project.version."
    roles: [Homeowner]
    code: 200
    input: [expected_project_version]
    output: FinancingPlan
    side_effects: ["status=ACTIVE", "compute monthly_payment_cents", "set project.financing_plan_id", "recompute project.itc_credit_cents attribution", "project.version += 1"]

  # --- InterconnectionApplication ---
  - method: POST
    path: "/solar/interconnection-applications"
    description: "File an interconnection application for a project."
    roles: [SolarInstaller]
    code: 201
    input: [project_id, utility_id, requested_export_kw]
    output: InterconnectionApplication
    side_effects: ["status=FILED"]
  - method: GET
    path: "/solar/interconnection-applications/{id}"
    description: "Fetch an interconnection application."
    roles: [SolarInstaller, Utility, PlatformAdmin]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: []
  - method: GET
    path: "/solar/interconnection-applications"
    description: "List interconnection applications, filterable by project_id or utility_id (reverse-reachability)."
    roles: [SolarInstaller, Utility, PlatformAdmin]
    code: 200
    input: ["project_id?", "utility_id?", "limit?", "offset?"]
    output: InterconnectionApplication[]
    side_effects: []
  - method: POST
    path: "/solar/interconnection-applications/{id}/begin-review"
    description: "Begin utility review (FILED -> UNDER_REVIEW)."
    roles: [Utility]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status=UNDER_REVIEW", "app.version += 1"]
  - method: POST
    path: "/solar/interconnection-applications/{id}/approve"
    description: "Approve interconnection (UNDER_REVIEW -> APPROVED); decrements feeder headroom."
    roles: [Utility]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status=APPROVED", "decrement utility.feeder_headroom_kw", "utility.version += 1", "app.version += 1"]
  - method: POST
    path: "/solar/interconnection-applications/{id}/reject"
    description: "Reject interconnection (UNDER_REVIEW -> REJECTED)."
    roles: [Utility]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status=REJECTED", "app.version += 1"]
  - method: POST
    path: "/solar/interconnection-applications/{id}/withdraw"
    description: "Withdraw an approved interconnection (APPROVED -> REJECTED); restores feeder headroom (compensating action)."
    roles: [Utility]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status=REJECTED", "restore utility.feeder_headroom_kw by requested_export_kw", "utility.version += 1", "app.version += 1"]
  - method: POST
    path: "/solar/interconnection-applications/{id}/grant-pto"
    description: "Grant PTO (APPROVED -> PTO_GRANTED); drives Project -> OPERATIONAL and mints WarrantyPolicy."
    roles: [Utility]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status=PTO_GRANTED", "project.status=OPERATIONAL", "create WarrantyPolicy", "app.version += 1", "project.version += 1"]

  # --- SREC ---
  - method: POST
    path: "/solar/srecs"
    description: "Mint an SREC for an OPERATIONAL project (one per MWh of vintage production)."
    roles: [PlatformAdmin]
    code: 201
    input: [project_id, vintage_year]
    output: SREC
    side_effects: ["status=MINTED", "set owner_type from plan.srec_owner", "increment project.lifetime_srec_count", "project.version += 1"]
  - method: GET
    path: "/solar/srecs/{id}"
    description: "Fetch an SREC."
    roles: [Homeowner, SrecBroker, PlatformAdmin]
    code: 200
    input: []
    output: SREC
    side_effects: []
  - method: GET
    path: "/solar/srecs"
    description: "List SRECs, filterable by project_id or srec_sale_id (reverse-reachability)."
    roles: [Homeowner, SrecBroker, PlatformAdmin]
    code: 200
    input: ["project_id?", "srec_sale_id?", "status?", "limit?", "offset?"]
    output: SREC[]
    side_effects: []
  - method: POST
    path: "/solar/srecs/{id}/list"
    description: "List an SREC for sale (MINTED -> LISTED)."
    roles: [Homeowner]
    code: 200
    input: []
    output: SREC
    side_effects: ["status=LISTED", "srec.version += 1"]
  - method: POST
    path: "/solar/srecs/{id}/retire"
    description: "Retire a sold SREC (SOLD -> RETIRED)."
    roles: [SrecBroker]
    code: 200
    input: []
    output: SREC
    side_effects: ["status=RETIRED", "srec.version += 1"]

  # --- SrecSale ---
  - method: POST
    path: "/solar/srec-sales"
    description: "Create a sale sweeping all LISTED SRECs of a project+vintage; computes proceeds. OCC on project.version."
    roles: [SrecBroker]
    code: 201
    input: [project_id, broker_id, vintage_year, price_cents_per_srec, expected_project_version]
    output: SrecSale
    side_effects: ["sweep LISTED SRECs -> SOLD", "set srec.srec_sale_id", "compute srec_count, gross_proceeds_cents, net_proceeds_cents", "project.version += 1"]
  - method: GET
    path: "/solar/srec-sales/{id}"
    description: "Fetch an SREC sale (observe srec_count, net_proceeds_cents)."
    roles: [SrecBroker, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: SrecSale
    side_effects: []
  - method: GET
    path: "/solar/srec-sales"
    description: "List SREC sales, filterable by project_id or broker_id (reverse-reachability)."
    roles: [SrecBroker, Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "broker_id?", "limit?", "offset?"]
    output: SrecSale[]
    side_effects: []

  # --- NetMeterPeriod ---
  - method: POST
    path: "/solar/net-meter-periods"
    description: "Open a billing-month period for an OPERATIONAL project (overlap-checked)."
    roles: [Utility]
    code: 201
    input: [project_id, period_start, period_end, kwh_produced, kwh_consumed]
    output: NetMeterPeriod
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/solar/net-meter-periods/{id}"
    description: "Fetch a net-meter period (observe net_kwh, bill_credit_cents, bank_kwh_after)."
    roles: [Utility, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: NetMeterPeriod
    side_effects: []
  - method: GET
    path: "/solar/net-meter-periods"
    description: "List net-meter periods, filterable by project_id (reverse-reachability)."
    roles: [Utility, Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: NetMeterPeriod[]
    side_effects: []
  - method: POST
    path: "/solar/net-meter-periods/{id}/settle"
    description: "Settle a period (OPEN -> SETTLED) in chronological order; computes credit and bank carryover."
    roles: [Utility]
    code: 200
    input: []
    output: NetMeterPeriod
    side_effects: ["status=SETTLED", "compute net_kwh, bill_credit_cents, bank_kwh_after", "period.version += 1"]

  # --- WarrantyPolicy (reverse-reachability for project FK) ---
  - method: GET
    path: "/solar/warranty-policies/{id}"
    description: "Fetch a warranty policy."
    roles: [Homeowner, SolarInstaller, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyPolicy
    side_effects: []
  - method: GET
    path: "/solar/warranty-policies"
    description: "List warranty policies, filterable by project_id (reverse-reachability)."
    roles: [Homeowner, SolarInstaller, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: WarrantyPolicy[]
    side_effects: []

  # --- WarrantyClaim ---
  - method: POST
    path: "/solar/warranty-claims"
    description: "File a warranty claim against an OPERATIONAL project."
    roles: [Homeowner]
    code: 201
    input: [project_id, claim_type, "claimed_window_start?", "claimed_window_end?"]
    output: WarrantyClaim
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/solar/warranty-claims/{id}"
    description: "Fetch a warranty claim (observe shortfall_kwh, payout_cents)."
    roles: [Homeowner, SolarInstaller, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/solar/warranty-claims"
    description: "List warranty claims, filterable by project_id (reverse-reachability)."
    roles: [Homeowner, SolarInstaller, PlatformAdmin]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/solar/warranty-claims/{id}/request-info"
    description: "Request more info (SUBMITTED -> INFO_REQUESTED)."
    roles: [SolarInstaller]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status=INFO_REQUESTED", "claim.version += 1"]
  - method: POST
    path: "/solar/warranty-claims/{id}/resubmit"
    description: "Resubmit after info request (INFO_REQUESTED -> SUBMITTED)."
    roles: [Homeowner]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status=SUBMITTED", "claim.version += 1"]
  - method: POST
    path: "/solar/warranty-claims/{id}/approve"
    description: "Approve claim (SUBMITTED -> APPROVED); evaluates production shortfall and payout."
    roles: [SolarInstaller]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status=APPROVED", "compute measured_production_kwh, shortfall_kwh, payout_cents", "claim.version += 1"]
  - method: POST
    path: "/solar/warranty-claims/{id}/deny"
    description: "Deny claim (SUBMITTED -> DENIED)."
    roles: [SolarInstaller]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status=DENIED", "claim.version += 1"]
  - method: POST
    path: "/solar/warranty-claims/{id}/remediate"
    description: "Mark claim remediated (APPROVED -> REMEDIATED)."
    roles: [SolarInstaller]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status=REMEDIATED", "claim.version += 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed user is not the owner of the targeted resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which this transition is defined."
  - id: ERR_INSTALLER_NOT_LICENSED
    http: 422
    condition: "Installer not licensed in the homeowner's state_code at design time."
  - id: ERR_DESIGN_INFEASIBLE
    http: 422
    condition: "Sunlight assessment makes system size undefined (peak_sun_hours == 0 or shading_factor >= 1.0)."
  - id: ERR_FINANCING_FIELDS_MISSING
    http: 422
    condition: "Model-specific required financing fields absent for the chosen model."
  - id: ERR_FINANCING_ALREADY_ACTIVE
    http: 409
    condition: "Project already has a non-TERMINATED FinancingPlan when activating another."
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "New NetMeterPeriod [start,end) overlaps an existing period on the same project."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Interval end is not strictly after start."
  - id: ERR_CLAIM_WINDOW_OVERLAP
    http: 409
    condition: "A PRODUCTION_SHORTFALL claim window overlaps an existing non-DENIED claim window on the same project (closed-interval semantics)."
  - id: ERR_OUT_OF_ORDER_SETTLEMENT
    http: 409
    condition: "Settling a period while an earlier OPEN period exists on the same project."
  - id: ERR_INSUFFICIENT_FEEDER_HEADROOM
    http: 422
    condition: "requested_export_kw exceeds utility.feeder_headroom_kw at approval."
  - id: ERR_NO_LISTED_SRECS
    http: 422
    condition: "SrecSale sweep found zero LISTED SRECs for project_id + vintage_year."
  - id: ERR_BROKER_MARKET_MISMATCH
    http: 422
    condition: "Broker does not operate in the homeowner's state_code market."
  - id: ERR_NO_SHORTFALL
    http: 422
    condition: "PRODUCTION_SHORTFALL claim approval attempted with shortfall_kwh == 0."
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not match the current Project.version (OCC)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/malformed required body field, out-of-range enum, or negative numeric."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register new accounts."
    identity: opaque
    exclusive_operations:
      - "POST /solar/homeowners"
      - "POST /solar/installers"
      - "POST /solar/brokers"
    shared_operations: []
  - name: Homeowner
    description: "Property owner; requests projects, selects financing, lists SRECs, files warranty claims."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /solar/projects"
      - "POST /solar/projects/{id}/cancel"
      - "POST /solar/financing-plans"
      - "POST /solar/financing-plans/{id}/activate"
      - "POST /solar/srecs/{id}/list"
      - "POST /solar/warranty-claims"
      - "POST /solar/warranty-claims/{id}/resubmit"
    shared_operations:
      - "GET /solar/projects"
      - "GET /solar/projects/{id}"
      - "GET endpoints for owned financing-plans, srecs, srec-sales, net-meter-periods, warranty-policies, warranty-claims"
  - name: SolarInstaller
    description: "Designs, permits, installs, remediates; adjudicates warranty claims."
    identity: "entity_backed:SolarInstaller"
    exclusive_operations:
      - "POST /solar/projects/{id}/assess"
      - "POST /solar/projects/{id}/design"
      - "POST /solar/projects/{id}/submit-permit"
      - "POST /solar/projects/{id}/complete-install"
      - "POST /solar/projects/{id}/start-remediation"
      - "POST /solar/interconnection-applications"
      - "POST /solar/warranty-claims/{id}/request-info"
      - "POST /solar/warranty-claims/{id}/approve"
      - "POST /solar/warranty-claims/{id}/deny"
      - "POST /solar/warranty-claims/{id}/remediate"
    shared_operations:
      - "GET /solar/projects"
      - "GET /solar/projects/{id}"
      - "GET /solar/interconnection-applications"
  - name: Utility
    description: "Runs interconnection review/PTO and net-metering settlement."
    identity: "entity_backed:Utility"
    exclusive_operations:
      - "POST /solar/interconnection-applications/{id}/begin-review"
      - "POST /solar/interconnection-applications/{id}/approve"
      - "POST /solar/interconnection-applications/{id}/reject"
      - "POST /solar/interconnection-applications/{id}/withdraw"
      - "POST /solar/interconnection-applications/{id}/grant-pto"
      - "POST /solar/net-meter-periods"
      - "POST /solar/net-meter-periods/{id}/settle"
    shared_operations:
      - "GET /solar/projects/{id}"
      - "GET /solar/interconnection-applications"
      - "GET /solar/net-meter-periods"
  - name: SrecBroker
    description: "Buys and retires SRECs; creates sweep sales."
    identity: "entity_backed:SrecBroker"
    exclusive_operations:
      - "POST /solar/srec-sales"
      - "POST /solar/srecs/{id}/retire"
    shared_operations:
      - "GET /solar/srecs"
      - "GET /solar/srec-sales"
  - name: PlatformAdmin
    description: "Operator; registers utilities, mints SRECs, approves permits, runs inspections."
    identity: opaque
    exclusive_operations:
      - "POST /solar/utilities"
      - "POST /solar/projects/{id}/approve-permit"
      - "POST /solar/projects/{id}/inspect"
      - "POST /solar/srecs"
    shared_operations:
      - "GET endpoints across all entities"
