            - "HTTP status == 409"
            - "response.error_id == \"ERR_CYCLE_FROZEN\""
            - "response.error_id != \"ERR_DUPLICATE_METRIC_KEY\""
            - "response.success == false"
            - "GET /ir/component-metrics?component_id=${comp} -> data has length 1"
            - "ComponentMetric.${m1}.reported_value == 1000"
            - "SurveyComponent.${comp}.prep_status == DRAFT"
      - name: segregation_of_duties_outranks_collection_deadline_passed_on_certify
        grounds:
          - validations[priority=13]
          - validations[priority=22]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_COLLECTION_DEADLINE_PASSED]
          - entities.SurveyComponent.fields.prepared_by_user_id
        distinguishing_aspect: |
          The certify call violates priority 13 (category business_safety, 403) and
          priority 22 (category business_temporal, 422) at once; the higher-priority
          segregation-of-duties error must be returned with HTTP 403, which is a different
          error category AND a different status code from the losing rule - the opposite
          pairing to the two-409 conflict in
          frozen_cycle_state_error_outranks_duplicate_metric_key_conflict.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with collection_deadline 2027-02-15T23:59:59Z."
            - "The ENROLLMENT component holds TOTAL_HEADCOUNT 1000 against prior-year 1000 and was prepared by X-User-ID u-shared, so edit_status is CLEARED and prepared_by_user_id is u-shared."
            - "The logical clock has been advanced to 2027-03-01T00:00:00Z, past the collection deadline."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60011", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.total_headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "u-shared"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: IRDirector
          trigger:
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the fall enrollment component after the deadline." }
              as: IRDirector
              as_user_id: "u-shared"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "response.error_id != \"ERR_COLLECTION_DEADLINE_PASSED\""
            - "SurveyComponent.${comp}.prep_status == PREPARED"
            - "SurveyComponent.${comp}.edit_status == CLEARED"
            - "SurveyComponent.${comp}.prepared_by_user_id == \"u-shared\""
            - "SurveyComponent.${comp}.certified_by_user_id is null"
  - rule_id: boundary_precision_check
    instances:
      - name: prior_year_variance_at_exactly_ten_and_twentyfive_percent_thresholds
        grounds:
          - calculations.prior_year_variance_pct
          - calculations.edit_check_generation
          - entities.ComponentMetric.fields.variance_pct
          - entities.EditCheck.fields.severity
          - entities.SurveyComponent.fields.fatal_open_count
        distinguishing_aspect: |
          Three metrics land at 9.9, exactly 10.0 and exactly 25.0 percent variance, so the
          >= comparisons are pinned at both constants at once: 9.9 raises nothing, 10.0
          raises a WARNING and 25.0 raises a FATAL, and sequence_no 1 / 2 also pins the
          metric_key ASC emission order because the silent 9.9 metric sorts first.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with one FINANCE census extract (coverage 2026-07-01 to 2027-06-30)."
            - "A DRAFT FINANCE component holds exactly three metrics: INSTRUCTION_EXPENSES_CENTS 1100 against 1000 (variance 10.0), ACADEMIC_SUPPORT_EXPENSES_CENTS 1099 against 1000 (variance 9.9), STUDENT_SERVICES_EXPENSES_CENTS 1250 against 1000 (variance 25.0)."
            - "FTE_ENROLLMENT is deliberately absent, so the per-FTE figure cannot be computed."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "FINANCE", record_count: 3, coverage_start_date: "2026-07-01", coverage_end_date: "2027-06-30", checksum: "a1b2c3d4e5f60012", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "FINANCE" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "INSTRUCTION_EXPENSES_CENTS", reported_value: 1100, prior_year_value: 1000, source_field_path: "fin.gl.instruction_total" }
              as: IRAnalyst
              captures: { m_instr: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "ACADEMIC_SUPPORT_EXPENSES_CENTS", reported_value: 1099, prior_year_value: 1000, source_field_path: "fin.gl.academic_support_total" }
              as: IRAnalyst
              captures: { m_acad: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "STUDENT_SERVICES_EXPENSES_CENTS", reported_value: 1250, prior_year_value: 1000, source_field_path: "fin.gl.student_services_total" }
              as: IRAnalyst
              captures: { m_svc: $.data.id }
          trigger:
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "GET /ir/edit-checks"
              payload: { component_id: "${comp}" }
              as: IRAnalyst
              captures: { ec_first: "$.data[0].id", ec_second: "$.data[1].id" }
          assert:
            - "ComponentMetric.${m_instr}.variance_pct == 10.0"
            - "ComponentMetric.${m_acad}.variance_pct == 9.9"
            - "ComponentMetric.${m_svc}.variance_pct == 25.0"
            - "GET /ir/edit-checks?component_id=${comp} -> data has length 2"
            - "EditCheck.${ec_first}.check_code == \"PY_VAR_INSTRUCTION_EXPENSES_CENTS\""
            - "EditCheck.${ec_first}.severity == WARNING"
            - "EditCheck.${ec_first}.sequence_no == 1"
            - "EditCheck.${ec_first}.variance_pct == 10.0"
            - "EditCheck.${ec_first}.observed_value == 1100"
            - "EditCheck.${ec_first}.prior_year_value == 1000"
            - "EditCheck.${ec_second}.check_code == \"PY_VAR_STUDENT_SERVICES_EXPENSES_CENTS\""
            - "EditCheck.${ec_second}.severity == FATAL"
            - "EditCheck.${ec_second}.sequence_no == 2"
            - "EditCheck.${ec_second}.variance_pct == 25.0"
            - "no EditCheck exists with metric_key == \"ACADEMIC_SUPPORT_EXPENSES_CENTS\""
            - "SurveyComponent.${comp}.edit_status == OPEN_EDITS"
            - "SurveyComponent.${comp}.fatal_open_count == 1"
            - "SurveyComponent.${comp}.core_expense_per_fte_cents is null"
      - name: small_cell_boundary_at_exactly_min_cell_size_and_structural_zero
        grounds:
          - calculations.disclosure_avoidance
          - entities.DataRequest.fields.min_cell_size
          - entities.DisclosureCell.fields.raw_count
          - state_machines.DataRequest.RECEIVED_to_SCREENED
          - state_machines.DisclosureCell.PENDING_to_RELEASED
        distinguishing_aspect: |
          With min_cell_size 5 the cell at exactly 5 is released while the cell at 4 is
          primary-suppressed and the structural zero is released untouched, pinning the
          strict 0 < raw_count < min_cell_size window; the cell at exactly 5 is then chosen
          as the complementary victim because it is the smallest positive released cell,
          so one value sits on both boundaries in a single screen.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN with one CERTIFIED ENROLLMENT component."
            - "A DataRequest from an EXTERNAL requester uses SMALL_CELL_SUPPRESSION with min_cell_size 5."
            - "Its AGE_BAND crosstab holds four cells: A_UNDER_18 4, B_18_24 5, C_25_PLUS 0, D_35_PLUS 30 (raw total 39, above the minimum)."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 39, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60013", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 39, prior_year_value: 39, source_field_path: "sis.enrollment.total_headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the fall enrollment component for disclosure processing." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
            - call: "POST /ir/reporting-cycles/${cyc}/data-requests"
              payload: { requester_org: "Statewide Policy Institute", requester_type: "EXTERNAL", requested_metric_key: "HEADCOUNT_BY_AGE", avoidance_method: "SMALL_CELL_SUPPRESSION", min_cell_size: 5 }
              as: DisclosureOfficer
              captures: { req: $.data.id }
            - call: "POST /ir/data-requests/${req}/cells"
              payload: { dimension_group: "AGE_BAND", dimension_key: "A_UNDER_18", raw_count: 4 }
              as: DisclosureOfficer
              captures: { c_a: $.data.id }
            - call: "POST /ir/data-requests/${req}/cells"
              payload: { dimension_group: "AGE_BAND", dimension_key: "B_18_24", raw_count: 5 }
              as: DisclosureOfficer
              captures: { c_b: $.data.id }
            - call: "POST /ir/data-requests/${req}/cells"
              payload: { dimension_group: "AGE_BAND", dimension_key: "C_25_PLUS", raw_count: 0 }
              as: DisclosureOfficer
              captures: { c_c: $.data.id }
            - call: "POST /ir/data-requests/${req}/cells"
              payload: { dimension_group: "AGE_BAND", dimension_key: "D_35_PLUS", raw_count: 30 }
              as: DisclosureOfficer
              captures: { c_d: $.data.id }
          trigger:
            - call: "POST /ir/data-requests/${req}/screen"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "disclosure-1"
          assert:
            - "DataRequest.${req}.status == SCREENED"
            - "DataRequest.${req}.cell_count == 4"
            - "DisclosureCell.${c_a}.suppression_state == PRIMARY_SUPPRESSED"
            - "DisclosureCell.${c_a}.released_count is null"
            - "DisclosureCell.${c_b}.suppression_state == COMPLEMENTARY_SUPPRESSED"
            - "DisclosureCell.${c_b}.released_count is null"
            - "DisclosureCell.${c_c}.suppression_state == RELEASED"
            - "DisclosureCell.${c_c}.released_count == 0"
            - "DisclosureCell.${c_d}.suppression_state == RELEASED"
            - "DisclosureCell.${c_d}.released_count == 30"
            - "DataRequest.${req}.released_cell_count == 2"
            - "DataRequest.${req}.suppressed_cell_count == 2"
            - "DataRequest.${req}.residual_disclosure_risk == false"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: prepare_refused_when_referenced_census_extract_is_superseded
        grounds:
          - validations[priority=12]
          - errors[ERR_FROZEN_FILE_SUPERSEDED]
          - state_machines.FrozenFile.LOCKED_to_SUPERSEDED
          - calculations.frozen_file_coverage_overlap
          - calculations.cycle_active_record_count
          - entities.FrozenFile.fields.supersedes_frozen_file_id
        distinguishing_aspect: |
          The component's own prep_status is a legal DRAFT and its cycle's posture REOPENED
          permits prepare, yet the call is refused because a third entity - the FrozenFile it
          references - moved to SUPERSEDED when the corrected extract was registered, so the
          gate lives entirely outside both the target row and its parent cycle.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 was frozen once on extract EX-1 (ENROLLMENT, 2026-09-01 to 2026-10-15, record_count 1000) and then reopened, which reverted its ENROLLMENT component to DRAFT."
            - "A corrected extract EX-2 with the identical domain and identical closed coverage window was registered while the cycle was REOPENED, so EX-1 is SUPERSEDED and EX-2 is ACTIVE with record_count 1005."
            - "The component still references EX-1 in frozen_file_id, and the cycle remains REOPENED."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60014", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.total_headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the fall enrollment component on the first census extract." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
            - call: "POST /ir/reporting-cycles/${cyc}/reopen"
              payload: { reopen_reason: "The vendor re-delivered the census extract after correcting a residency flag." }
              as: IRDirector
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: RegistrarOfficer
              captures: { cyc_v2: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1005, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "b2c3d4e5f6a70015", expected_cycle_version: "${cyc_v2}" }
              as: RegistrarOfficer
              captures: { ff2: $.data.id }
          trigger:
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.error_id == \"ERR_FROZEN_FILE_SUPERSEDED\""
            - "FrozenFile.${ff1}.status == SUPERSEDED"
            - "FrozenFile.${ff2}.status == ACTIVE"
            - "FrozenFile.${ff2}.supersedes_frozen_file_id == ${ff1}"
            - "ReportingCycle.${cyc}.active_record_count == 1005"
            - "ReportingCycle.${cyc}.snapshot_posture == REOPENED"
            - "SurveyComponent.${comp}.prep_status == DRAFT"
            - "SurveyComponent.${comp}.edit_status == NOT_RUN"
      - name: reconcile_blocked_until_source_component_reaches_certified
        grounds:
          - validations[priority=12]
          - errors[ERR_SOURCE_NOT_CERTIFIED]
          - state_machines.ExternalSubmission.DRAFT_to_RECONCILED
          - state_machines.SurveyComponent.PREPARED_to_CERTIFIED
          - calculations.submission_reconciliation
        distinguishing_aspect: |
          The same reconcile call on the same DRAFT submission is refused with
          ERR_SOURCE_NOT_CERTIFIED while the source SurveyComponent is only PREPARED and
          succeeds unchanged once that component reaches CERTIFIED, so the gate is the
          sibling component's state rather than the submission's own or its cycle's posture;
