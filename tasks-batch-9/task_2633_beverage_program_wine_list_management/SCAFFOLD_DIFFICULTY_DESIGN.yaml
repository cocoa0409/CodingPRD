  - rule_id: boundary_precision_check
    instances:
      - name: corkage_waiver_ratio_floor_at_exact_multiple
        grounds:
          - calculations.corkage_charge
          - constants_global.LARGE_PARTY_THRESHOLD
          - constants_global.LARGE_PARTY_CORKAGE_DISCOUNT_PCT
          - entities.Venue.fields.corkage_waiver_purchase_ratio
          - endpoints["POST /beverage-program/venues/{venue_id}/corkage-charges"]
        distinguishing_aspect: |
          Four quotes on the same venue pin the exact inclusive/exclusive edges of `corkage_charge`:
          bottles_purchased_from_list == ratio waives exactly one bottle (floor, not ceil, and `>=`
          not `>`), one bottle below the ratio waives none, an over-supply cannot waive more bottles
          than were actually brought (the `min` clamp), and party_size == LARGE_PARTY_THRESHOLD
          triggers the 25% discount whose half-up rounding of 3500 * 75 / 100 = 2625 lands on an exact
          integer boundary rather than a truncation.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB created with default corkage policy: corkage_fee_cents 3500, corkage_waiver_purchase_ratio 2, byo_bottle_limit_per_party 2, byo_prohibited_categories []."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 2, bottles_purchased_from_list: 2, party_size: 4, byo_categories: ["RED"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 2, bottles_purchased_from_list: 1, party_size: 4, byo_categories: ["RED"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 2, bottles_purchased_from_list: 4, party_size: 4, byo_categories: ["RED"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 2, bottles_purchased_from_list: 2, party_size: 8, byo_categories: ["RED"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
          assert:
            - "quote 1 (purchased 2 == ratio 2, party 4): waived_bottles == 1, chargeable_bottles == 1, corkage_total_cents == 3500, large_party_discount_applied == false"
            - "quote 2 (purchased 1, one below the ratio): waived_bottles == 0, chargeable_bottles == 2, corkage_total_cents == 7000"
            - "quote 3 (purchased 4, floor(4/2) == 2 waivers available but only 2 bottles brought): waived_bottles == 2, chargeable_bottles == 0, corkage_total_cents == 0 — never negative and never more than byo_bottle_count"
            - "quote 4 (party_size 8 == LARGE_PARTY_THRESHOLD, so the >= edge is inclusive): waived_bottles == 1, chargeable_bottles == 1, large_party_discount_applied == true, corkage_total_cents == 2625"
            - "quote 4's 2625 equals round_half_up(3500 * 75 / 100) exactly; 2624 or 2626 indicate truncation or a float artefact"
            - "no CorkageCharge row is persisted: the venue's version is unchanged across all four quotes"
      - name: glass_price_effective_pour_floor_to_zero_pours
        grounds:
          - calculations.list_entry_glass_price
          - constants_global.BTG_SPOILAGE_ALLOWANCE_POURS
          - validations[priority=57]
          - entities.Wine.fields.bottle_size_ml
          - endpoints["POST /beverage-program/list-versions/{list_version_id}/entries"]
        distinguishing_aspect: |
          Three entries on the same 750 ml RED wine walk pour_size_ml across the integer-division
          cliff of `effective_pours = floor(750 / pour) - BTG_SPOILAGE_ALLOWANCE_POURS`: 250 ml gives
          floor 3 minus 1 = 2 effective pours, 375 ml gives floor 2 minus 1 = 1 pour (the last legal
          value), and 400 ml gives floor 1 minus 1 = 0 pours, which must be refused with
          ERR_POUR_SIZE_TOO_LARGE rather than dividing by zero. Unlike the corkage instance, the edge
          here is an integer floor feeding a divisor, so the boundary is a crash boundary as well as
          a price boundary, and the surviving prices (4300 and 8575) are not multiples of each other.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with cogs_target_pct_by_category.RED = 28.0."
            - "Three distinct RED wines, each reference_cost_cents 2400 and bottle_size_ml 750, so uniqueness on (list_version_id, wine_id) does not block three sibling entries."
            - "A DRAFT ListVersion on the venue's wine list."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_a_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Estate Cabernet", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_b_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Geyserville", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_c_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v1: $.data.version }
          trigger:
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_a_id}", sort_rank: 1, expected_list_version_version: "${lv_v1}", by_the_glass: true, pour_size_ml: 250, par_bottles: 6, education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e_250_id: $.data.id }
            - call: "GET /beverage-program/list-versions/${lv_id}"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_v2: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_b_id}", sort_rank: 2, expected_list_version_version: "${lv_v2}", by_the_glass: true, pour_size_ml: 375, par_bottles: 6, education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e_375_id: $.data.id }
            - call: "GET /beverage-program/list-versions/${lv_id}"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_v3: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_c_id}", sort_rank: 3, expected_list_version_version: "${lv_v3}", by_the_glass: true, pour_size_ml: 400, par_bottles: 6, education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
          assert:
            - "ListEntry.${e_250_id}.effective_pours == 2 and ListEntry.${e_250_id}.glass_price_cents == 4300"
            - "ListEntry.${e_375_id}.effective_pours == 1 and ListEntry.${e_375_id}.glass_price_cents == 8575 (the last pour size that still yields a sellable pour)"
            - "the 400 ml call returns HTTP 422 with error_id ERR_POUR_SIZE_TOO_LARGE, not a 500 and not an ERR_VALUE_OUT_OF_RANGE"
            - "GET /beverage-program/list-versions/${lv_id}/entries returns exactly 2 rows; the rejected entry left no partial row"
            - "ListVersion.${lv_id}.version advanced exactly twice (once per accepted entry) and did not advance on the refusal"
            - "both surviving entries have bottle_price_cents == 8600 and price_band == CORE, so the glass divergence comes only from effective_pours"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_confirm_blocked_by_venue_posture_frozen_after_pricing
        grounds:
          - state_machines.WineDinnerEvent.PRICED_to_CONFIRMED
          - validations[priority=60]
          - calculations.venue_pour_cost_variance
          - entities.Venue.fields.program_posture
          - entities.WineDinnerEvent.fields.state
        distinguishing_aspect: |
          The blocking state lives on a *different* entity than the one being transitioned and it was
          legal at the moment of pricing: the event reaches PRICED while Venue.program_posture is OPEN,
          then an unrelated by-the-glass slot close plus a pour-cost run flips the venue to FROZEN, and
          only then does confirm fail. The event's own state machine permits PRICED -> CONFIRMED, so a
          test that only inspects WineDinnerEvent passes; the refusal is decided by Venue. Thawing the
          venue via an adjusted variance resolution makes the identical confirm succeed, proving the
          dependency is on live venue state rather than on a snapshot taken at pricing time.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with cogs_target_pct_by_category.RED = 28.0 and event_cogs_target_pct 28.0, program_posture OPEN."
            - "A published ListVersion carrying one by-the-glass RED entry (pour_size_ml 177, effective_pours 3, glass_price_cents 2875, bottle_price_cents 8600)."
            - "A 24-seat wine dinner on 2026-10-10T18:00:00Z-21:00:00Z pinned to that version with pour_plan [{entry, 2}], priced while the venue was OPEN."
            - "One 12-bottle RED lot at 2400 cents received 2026-08-10 in bin A1 (capacity 48)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, event_cogs_target_pct: 28.0, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_red_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w_red_id}", bin_id: "${bin_id}", bottles_received: 12, unit_cost_cents: 2400, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v1: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_red_id}", sort_rank: 1, expected_list_version_version: "${lv_v1}", by_the_glass: true, pour_size_ml: 177, par_bottles: 6, education_verified: false }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_id}/submit"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/list-versions/${lv_id}/publish"
              payload: {}
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/wine-dinner-events"
              payload: { venue_id: "${v1_id}", list_version_id: "${lv_id}", name: "Ridge Vertical", starts_at: "2026-10-10T18:00:00Z", ends_at: "2026-10-10T21:00:00Z", seat_count: 24, pour_plan: [{ list_entry_id: "${e1_id}", pours_per_seat: 2 }] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { ev1_id: $.data.id }
