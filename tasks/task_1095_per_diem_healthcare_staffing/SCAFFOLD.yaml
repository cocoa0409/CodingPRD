scenario: "Per-Diem Healthcare Staffing & Float Pool: clinician & credential/license, shift post & self-schedule/claim, facility order & fill, rate & differential/overtime, timesheet & verification, no-show/cancellation & reliability, invoice (bill/pay-rate), compliance"
domain_name: "per-diem-healthcare-staffing"
api_prefix: "/staffing"

complexity_profile:
  primary_archetype: "quota_allocation"
  secondary_archetype: "compliance_audit"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "rate_threshold_triggers"
  entity_topology: "graph"
  state_machine_shape: "cyclic"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "self_referential"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"
  notes: |
    Shift slots are the finite pool: a StaffingOrder declares headcount, Shifts are the
    individual slots, ShiftClaims are competing bids, and an Assignment commits a slot.
    Compliance (credential verification + expiry) gates every allocation, reliability
    scoring feeds back into eligibility, and the money layer (pay-rate vs bill-rate)
    closes the loop. Assignment carries two independent state axes (work_status ×
    pay_status); Timesheet and Credential and StaffingOrder all carry cycles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Named constants. EVERY named constant referenced by any formula, validation
# rule, or state-machine guard anywhere in this scaffold is declared here with
# a concrete value. Calculation-local `constants:` blocks repeat the subset a
# given formula uses; the values here are authoritative.
# ---------------------------------------------------------------------------
global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- shift geometry ---
  MIN_SHIFT_DURATION_HOURS: 4.0
  MAX_SHIFT_DURATION_HOURS: 16.0
  MIN_REST_HOURS_BETWEEN_SHIFTS: 8.0
  MAX_WEEKLY_SCHEDULED_HOURS: 60.0
  MAX_ORDER_HEADCOUNT: 20

  # --- claim window / claim quota ---
  SHIFT_CLAIM_LOCK_HOURS: 2.0
  MAX_OPEN_CLAIMS_PER_CLINICIAN: 5

  # --- credential compliance ---
  CREDENTIAL_BUFFER_DAYS: 1

  # --- worked-hours / break geometry ---
  UNPAID_BREAK_THRESHOLD_MINUTES: 360
  UNPAID_BREAK_MINUTES: 30

  # --- pay rate, differentials, overtime ---
  NIGHT_WINDOW_START_HOUR: 19
  NIGHT_WINDOW_END_HOUR: 7
  NIGHT_DIFF_CENTS_PER_HOUR: 450
  WEEKEND_DIFF_CENTS_PER_HOUR: 300
  CRISIS_RATE_MULTIPLIER: 1.25
  OVERTIME_THRESHOLD_HOURS: 40.0
  OVERTIME_MULTIPLIER: 1.5

  # --- timesheet lifecycle ---
  TIMESHEET_SUBMISSION_WINDOW_DAYS: 7
  TIMESHEET_MAX_DISPUTE_ROUNDS: 2

  # --- cancellation / no-show / reliability ---
  CANCELLATION_FREE_HOURS: 72.0
  CANCELLATION_LATE_HOURS: 24.0
  CANCEL_PENALTY_POINTS_LATE: 5
  CANCEL_PENALTY_POINTS_VERY_LATE: 15
  NO_SHOW_PENALTY_POINTS: 30
  SHIFT_COMPLETION_CREDIT_POINTS: 2
  FACILITY_CANCELLATION_CREDIT_POINTS: 2
  RELIABILITY_BASE_SCORE: 100
  RELIABILITY_MIN_SCORE: 0
  RELIABILITY_MAX_SCORE: 100
  RELIABILITY_WINDOW_DAYS: 90
  RELIABILITY_WEIGHT_TIER1_MAX_AGE_DAYS: 30
  RELIABILITY_WEIGHT_TIER1: 1.0
  RELIABILITY_WEIGHT_TIER2_MAX_AGE_DAYS: 60
  RELIABILITY_WEIGHT_TIER2: 0.6
  RELIABILITY_WEIGHT_TIER3_MAX_AGE_DAYS: 90
  RELIABILITY_WEIGHT_TIER3: 0.3
  RELIABILITY_SUSPENSION_THRESHOLD: 60

  # --- billing ---
  MARKUP_TIER1_MAX_CENTS: 200000
  MARKUP_TIER2_MAX_CENTS: 500000
  MARKUP_TIER1_MULTIPLIER: 1.45
  MARKUP_TIER2_MULTIPLIER: 1.38
  MARKUP_TIER3_MULTIPLIER: 1.32
  INVOICE_NET_TERMS_DAYS: 30
  INVOICE_MAX_PERIOD_DAYS: 31

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Facility display name."
        constraints: "1..120 chars, required"
      - name: unit_name
        type: string
        source: input
        description: "The single staffed unit (e.g. ICU) this facility schedules through the float pool."
        constraints: "1..60 chars, required"
      - name: unit_capacity
        type: integer
        source: input
        description: "Maximum number of Shifts on this facility whose CLOSED intervals may intersect at any instant."
        constraints: ">= 1, <= 20, required"
      - name: required_credential_types
        type: array
        source: input
        description: "Credential types a clinician must hold (VERIFIED and unexpired) to be eligible for any Shift of this facility."
        constraints: "non-empty array of CredentialType enum members {RN_LICENSE, BLS, ACLS, TB_SCREENING, FIT_TEST}"
      - name: pending_pay_cents
        type: integer
        source: computed
        description: "Sum of gross_pay_cents over Timesheets of this facility with status == VERIFIED (i.e. billable but not yet on an invoice)."
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of bill_total_cents over Invoices of this facility with status == ISSUED. Conserved quantity for the issue/void compensating invariant."
        default: 0
      - name: lifetime_billed_cents
        type: integer
        source: computed
        description: "Sum of bill_total_cents over Invoices of this facility with status IN {ISSUED, SETTLED}. Sole input to the markup-tier selection."
        default: 0

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Clinician legal name."
        constraints: "1..120 chars, required"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Clinicians."
        constraints: "required, unique"
      - name: specialty
        type: enum
        source: input
        description: "Clinical specialty used to match StaffingOrder.specialty and to select the RateCard."
        constraints: "one of {RN, LPN, CNA, RT, PT}"
      - name: status
        type: enum
        source: system
        description: "Eligibility gate for claiming and being awarded shifts."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED is written by the reliability recompute side effect when provisional_reliability_score < RELIABILITY_SUSPENSION_THRESHOLD, ACTIVE is restored by the same recompute when the score returns to >= RELIABILITY_SUSPENSION_THRESHOLD"
      - name: reliability_score
        type: integer
        source: computed
        description: "ADJUDICATED variant of reliability_score (only ReliabilityEvents with adjudication_status == CONFIRMED)."
        default: 100
      - name: provisional_reliability_score
        type: integer
        source: computed
        description: "PROVISIONAL variant of reliability_score (ReliabilityEvents with adjudication_status IN {PENDING, CONFIRMED}). Drives the suspension gate."
        default: 100
      - name: no_show_count
        type: integer
        source: computed
        description: "Count of this clinician's ReliabilityEvents with event_type == NO_SHOW and adjudication_status == CONFIRMED inside the RELIABILITY_WINDOW_DAYS window."
        default: 0
      - name: completed_shift_count
        type: integer
        source: computed
        description: "Count of this clinician's Assignments with work_status == WORKED."
        default: 0

  - name: Credential
    parent: Clinician
    common_fields: true
    fields:
      - name: clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; taken from the path, never from the body."
      - name: credential_type
        type: enum
        source: input
        description: "Type of licence/certification."
        constraints: "one of {RN_LICENSE, BLS, ACLS, TB_SCREENING, FIT_TEST}; unique per (clinician_id, credential_type) among Credentials whose status != REVOKED"
      - name: license_number
        type: string
        source: input
        description: "Issuing-body identifier."
        constraints: "1..40 chars, required"
      - name: issued_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the credential was issued."
      - name: expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the credential lapses. Must be strictly after issued_on."
      - name: status
        type: enum
        source: system
        description: "Compliance state of this credential."
        default: "PENDING_VERIFICATION"
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, REJECTED, EXPIRED, REVOKED}"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant the ComplianceOfficer accepted the credential; null until then."
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ComplianceOfficer who verified; null until then."
        default: null
      - name: decision_note
        type: string
        source: system
        description: "Free-text note captured from the verify/revoke call; null when never set."
        default: null

  - name: RateCard
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; taken from the path."
      - name: specialty
        type: enum
        source: input
        description: "Specialty this rate applies to."
        constraints: "one of {RN, LPN, CNA, RT, PT}"
      - name: base_pay_rate_cents_per_hour
        type: integer
        source: input
        description: "Clinician base pay rate in integer cents per hour, before urgency multiplier, differentials, and overtime."
        constraints: ">= 1000, <= 50000"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the interval in which this card is selectable."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the selectable interval; null means open-ended."
        default: null

  - name: StaffingOrder
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; must equal the acting FacilityScheduler's X-User-ID."
      - name: specialty
        type: enum
        source: input
        description: "Specialty requested; every Shift under this order inherits it."
        constraints: "one of {RN, LPN, CNA, RT, PT}"
      - name: headcount
        type: integer
        source: input
        description: "Number of Shift slots this order authorises."
        constraints: ">= 1 and <= MAX_ORDER_HEADCOUNT (20)"
      - name: urgency
        type: enum
        source: input
        description: "STANDARD or CRISIS; CRISIS multiplies the base pay rate by CRISIS_RATE_MULTIPLIER."
        constraints: "one of {STANDARD, CRISIS}"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive earliest scheduled_start allowed for Shifts under this order."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive latest scheduled_end allowed for Shifts under this order."
      - name: status
        type: enum
        source: system
        description: "Aggregate fill posture derived from child Shift states."
        default: "OPEN"
        constraints: "one of {OPEN, PARTIALLY_FILLED, FILLED, CLOSED, CANCELLED}"
      - name: shift_count
        type: integer
        source: computed
        description: "Count of Shifts under this order in any status."
        default: 0
      - name: open_count
        type: integer
        source: computed
        description: "Count of Shifts under this order with status == OPEN."
        default: 0
      - name: filled_count
        type: integer
        source: computed
        description: "Count of Shifts under this order with status IN {ASSIGNED, COMPLETED}."
        default: 0
      - name: completed_count
        type: integer
        source: computed
        description: "Count of Shifts under this order with status == COMPLETED."
        default: 0
      - name: cancelled_count
        type: integer
        source: computed
        description: "Count of Shifts under this order with status == CANCELLED."
        default: 0

  - name: Shift
    parent: StaffingOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> StaffingOrder.id; taken from the path."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Inclusive shift start (ISO 8601 UTC)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Exclusive shift end (ISO 8601 UTC). Duration must be within [MIN_SHIFT_DURATION_HOURS, MAX_SHIFT_DURATION_HOURS]."
      - name: status
        type: enum
        source: system
        description: "Slot occupancy state."
        default: "OPEN"
        constraints: "one of {OPEN, ASSIGNED, COMPLETED, CANCELLED}"
      - name: claim_count
        type: integer
        source: computed
        description: "Count of ShiftClaims on this shift with status == PENDING. Recomputed on every claim create/withdraw/award, and every recompute bumps Shift.version."
        default: 0
      - name: scheduled_hours
        type: number
        source: computed
        description: "(scheduled_end - scheduled_start) in hours, 2 decimal places, round_half_up."
      - name: estimated_hours
        type: number
        source: computed
        description: "Scheduled hours minus the deemed unpaid break; the ESTIMATED variant's hour input."
      - name: estimated_pay_cents
        type: integer
        source: computed
        description: "ESTIMATED variant of shift_pay_amount, frozen at Shift creation from the scheduled interval and the selected RateCard."
      - name: base_pay_rate_cents_per_hour
        type: integer
        source: computed
        description: "Snapshot of the selected RateCard.base_pay_rate_cents_per_hour at Shift creation. Frozen: later RateCard edits never re-rate an existing Shift."
      - name: effective_rate_cents_per_hour
        type: integer
        source: computed
        description: "round_half_up(base_pay_rate_cents_per_hour * CRISIS_RATE_MULTIPLIER) when the parent order's urgency == CRISIS, else base_pay_rate_cents_per_hour. Frozen at Shift creation."

  - name: ShiftClaim
    parent: Shift
    common_fields: true
    fields:
      - name: shift_id
        type: string
        source: system
        description: "FK -> Shift.id; taken from the path."
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; must equal the acting Clinician's X-User-ID."
      - name: status
        type: enum
        source: system
        description: "Bid state."
        default: "PENDING"
        constraints: "one of {PENDING, AWARDED, DECLINED, WITHDRAWN}"
      - name: note
        type: string
        source: input
        description: "Optional free-text note from the clinician."
        default: null
      - name: claimed_at
        type: datetime
        source: system
        description: "Logical-clock instant the claim was created. Second sort key of the award ranking expression."
      - name: reliability_snapshot
        type: integer
        source: system
        description: "Clinician.reliability_score captured at claim creation; retained for audit. NOT used by the award ranking (which reads the live score)."

  - name: Assignment
    parent: Shift
    common_fields: true
    fields:
      - name: shift_id
        type: string
        source: system
        description: "FK -> Shift.id; taken from the path of the award call."
      - name: clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the clinician of the awarded ShiftClaim."
      - name: claim_id
        type: string
        source: system
        description: "FK -> ShiftClaim.id; the claim that won the award."
      - name: replaces_assignment_id
        type: string
        source: system
        description: "FK -> Assignment.id; set when this assignment backfills a slot vacated by a cancelled or no-showed assignment on the same shift. Null for a first fill."
        default: null
      - name: work_status
        type: enum
        source: system
        description: "First independent state axis: the staffing/attendance dimension."
        default: "PENDING_CONFIRMATION"
        constraints: "one of {PENDING_CONFIRMATION, CONFIRMED, WORKED, CANCELLED_BY_CLINICIAN, CANCELLED_BY_FACILITY, NO_SHOW}"
      - name: pay_status
        type: enum
        source: system
        description: "Second independent state axis: the money dimension. Advances on timesheet and invoice events, never on work_status transitions except the WAIVED terminal."
        default: "UNBILLED"
        constraints: "one of {UNBILLED, TIMESHEET_PENDING, PAYABLE, INVOICED, PAID, WAIVED}"
      - name: awarded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the award."
      - name: confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant the clinician confirmed; null until then."
        default: null
      - name: estimated_pay_cents
        type: integer
        source: computed
        description: "ESTIMATED variant of shift_pay_amount, copied from Shift.estimated_pay_cents at award time and frozen."
      - name: final_pay_cents
        type: integer
        source: computed
        description: "FINAL variant of shift_pay_amount, copied from the verified Timesheet.gross_pay_cents. Null until a timesheet is verified."
        default: null
      - name: cancellation_lead_hours
        type: number
        source: computed
        description: "(Shift.scheduled_start - current_utc) in hours at the moment of cancellation or no-show, 2 decimal places, round_half_up. Null while the assignment is not cancelled."
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: "Reason text supplied by the cancelling actor; null until cancelled."
        default: null

  - name: Timesheet
    parent: Assignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: system
        description: "FK -> Assignment.id; taken from the path."
      - name: invoice_id
        type: string
        source: system
        description: "FK -> Invoice.id; set when the timesheet is pulled onto an invoice, cleared back to null when that invoice is voided."
        default: null
      - name: clock_in
        type: datetime
        source: input
        description: "Actual punch-in instant (ISO 8601 UTC)."
      - name: clock_out
        type: datetime
        source: input
        description: "Actual punch-out instant (ISO 8601 UTC); must be strictly after clock_in."
      - name: break_minutes
        type: integer
        source: input
        description: "Unpaid break minutes reported by the clinician."
        constraints: ">= 0 and <= 240"
      - name: raw_minutes
        type: integer
        source: computed
        description: "(clock_out - clock_in) in whole minutes."
      - name: unpaid_break_minutes
        type: integer
        source: computed
        description: "Deemed unpaid break: UNPAID_BREAK_MINUTES when raw_minutes >= UNPAID_BREAK_THRESHOLD_MINUTES and break_minutes < UNPAID_BREAK_MINUTES, else break_minutes."
      - name: worked_hours
        type: number
        source: computed
        description: "(raw_minutes - unpaid_break_minutes) / 60, 2 decimal places, round_half_up."
      - name: night_hours
        type: number
        source: computed
        description: "Hours of the RAW clocked interval falling inside the daily night window; breaks are NOT deducted from differential hours."
      - name: weekend_hours
        type: number
        source: computed
        description: "Hours of the RAW clocked interval falling on a Saturday or Sunday (UTC); breaks are NOT deducted from differential hours."
      - name: regular_hours
        type: number
        source: computed
        description: "worked_hours - overtime_hours."
      - name: overtime_hours
        type: number
        source: computed
        description: "Portion of worked_hours above OVERTIME_THRESHOLD_HOURS for the clinician's ISO week, allocated by the weekly_overtime_allocation rule at verification time and then frozen."
      - name: gross_pay_cents
        type: integer
        source: computed
        description: "FINAL variant of shift_pay_amount for this timesheet, in integer cents. Computed at each verification and frozen until the next dispute/resubmit round."
      - name: status
        type: enum
        source: system
        description: "Verification/billing state; cycles between SUBMITTED and DISPUTED."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, DISPUTED, VERIFIED, INVOICED, PAID}"
      - name: dispute_count
        type: integer
        source: computed
        description: "Number of times this timesheet has been disputed. Third dispute is refused."
        default: 0
      - name: dispute_reason
        type: string
        source: system
        description: "Reason of the most recent dispute; null when never disputed."
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent verification; null until first verified."
        default: null

  - name: ReliabilityEvent
    parent: Clinician
    common_fields: true
    fields:
      - name: clinician_id
        type: string
        source: system
        description: "FK -> Clinician.id; the clinician the event scores."
      - name: assignment_id
        type: string
        source: system
        description: "FK -> Assignment.id; the assignment that produced the event. Null is never produced by the declared transitions but the field is nullable for forward compatibility."
        default: null
      - name: event_type
        type: enum
        source: system
        description: "What happened."
        constraints: "one of {SHIFT_COMPLETED, LATE_CANCELLATION, VERY_LATE_CANCELLATION, NO_SHOW, FACILITY_CANCELLATION_CREDIT}"
      - name: penalty_points
        type: integer
        source: system
        description: "Non-negative penalty weight; 0 for credit events."
        default: 0
      - name: credit_points
        type: integer
        source: system
        description: "Non-negative credit weight; 0 for penalty events."
        default: 0
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant the event was appended; the age input of the reliability decay tiers."
      - name: adjudication_status
        type: enum
        source: system
        description: "PENDING for penalty events, CONFIRMED at creation for credit events. Only a ComplianceOfficer moves PENDING onward."
        default: "PENDING"
        constraints: "one of {PENDING, CONFIRMED, OVERTURNED}"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical-clock instant of adjudication; null while PENDING."
        default: null
      - name: reason
        type: string
        source: system
        description: "Human-readable reason captured from the triggering transition."

  - name: Invoice
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the billed facility."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the billed period; matched against Shift.scheduled_start."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the billed period. Period length must be <= INVOICE_MAX_PERIOD_DAYS."
      - name: status
        type: enum
        source: system
        description: "Billing state."
        default: "DRAFT"
        constraints: "one of {DRAFT, ISSUED, SETTLED, VOID}"
      - name: markup_tier
        type: enum
        source: computed
        description: "Tier selected once at generation from Facility.lifetime_billed_cents BEFORE this invoice contributes to it."
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: markup_multiplier
        type: number
        source: computed
        description: "Multiplier of the selected markup_tier, frozen on the invoice at generation."
      - name: lines
        type: array
        source: computed
        description: "Ordered billing lines; each object is { timesheet_id, worked_hours, pay_cents, bill_cents }. Sorted by the line's Shift.scheduled_start ASC, tie-break Timesheet.created_at ASC."
      - name: line_count
        type: integer
        source: computed
        description: "Number of entries in lines."
      - name: pay_total_cents
        type: integer
        source: computed
        description: "Sum of lines[].pay_cents."
      - name: bill_total_cents
        type: integer
        source: computed
        description: "Sum of lines[].bill_cents, where each bill_cents was already rounded to whole cents (round-per-line-then-sum, pinned)."
      - name: margin_cents
        type: integer
        source: computed
        description: "bill_total_cents - pay_total_cents."
      - name: issued_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the BillingAgent who issued; null while DRAFT."
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issue; null while DRAFT."
        default: null
      - name: due_at
        type: datetime
        source: computed
        description: "issued_at + INVOICE_NET_TERMS_DAYS days; null while DRAFT."
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the BillingAgent who settled; must differ from issued_by_user_id."
        default: null
      - name: paid_amount_cents
        type: integer
        source: system
        description: "Amount recorded at settlement; must equal bill_total_cents."
        default: null
      - name: void_reason
        type: string
        source: system
        description: "Reason captured at void; null otherwise."
        default: null

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:

  - entity: Credential
    axis: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, REVOKED]
    shape: "cyclic (VERIFIED -> EXPIRED -> VERIFIED renewal loop)"
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /staffing/credentials/{id}/verify with decision == VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status == PENDING_VERIFICATION"
          - "if expires_on is supplied it must be strictly after current_utc; otherwise the stored expires_on must be strictly after current_utc"
        side_effects:
          - "sets Credential.status = VERIFIED"
          - "sets Credential.verified_at = current_utc and Credential.verified_by_user_id = X-User-ID"
          - "sets Credential.expires_on to the supplied expires_on when present"
          - "increments Credential.version by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /staffing/credentials/{id}/verify with decision == REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status == PENDING_VERIFICATION"
        side_effects:
          - "sets Credential.status = REJECTED and Credential.decision_note = note"
          - "increments Credential.version by 1"
        note: "REJECTED is terminal; the clinician must POST a new Credential row to retry."
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: lazy evaluation whenever the credential is read or used in a compliance check and current_utc >= credential.expires_on"
        actor: system
        preconditions:
          - "credential.status == VERIFIED"
          - "current_utc >= credential.expires_on"
        side_effects:
          - "sets Credential.status = EXPIRED"
          - "increments Credential.version by 1"
        note: "Expiry is materialised on read (GET /staffing/clinicians/{id}/credentials) and on every credential_compliance_gate evaluation, so it is observable without any batch job."
      - from: EXPIRED
        to: VERIFIED
        trigger: "POST /staffing/credentials/{id}/verify with decision == VERIFIED and a renewed expires_on"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status == EXPIRED"
          - "expires_on is supplied and is strictly after current_utc"
        side_effects:
          - "sets Credential.status = VERIFIED, expires_on = supplied value, verified_at = current_utc, verified_by_user_id = X-User-ID"
          - "increments Credential.version by 1"
        note: "This is the cycle: a lapsed licence is renewed in place rather than replaced."
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /staffing/credentials/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status IN {VERIFIED, EXPIRED}"
        side_effects:
          - "sets Credential.status = REVOKED and Credential.decision_note = reason"
          - "increments Credential.version by 1"
      - from: EXPIRED
        to: REVOKED
        trigger: "POST /staffing/credentials/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status IN {VERIFIED, EXPIRED}"
        side_effects:
          - "sets Credential.status = REVOKED and Credential.decision_note = reason"
          - "increments Credential.version by 1"

  - entity: Clinician
    axis: status
    initial_state: ACTIVE
    terminal_states: []
    shape: "cyclic (ACTIVE -> SUSPENDED -> ACTIVE)"
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: reliability_recompute side effect, fired by any ReliabilityEvent append or adjudication"
        actor: system
        preconditions:
          - "clinician.status == ACTIVE"
          - "recomputed provisional_reliability_score < RELIABILITY_SUSPENSION_THRESHOLD (60)"
        side_effects:
          - "sets Clinician.status = SUSPENDED"
          - "sets every ShiftClaim of this clinician with status == PENDING to DECLINED, and recomputes Shift.claim_count on each affected Shift"
          - "increments Clinician.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: reliability_recompute side effect, fired by any ReliabilityEvent append or adjudication"
        actor: system
        preconditions:
          - "clinician.status == SUSPENDED"
          - "recomputed provisional_reliability_score >= RELIABILITY_SUSPENSION_THRESHOLD (60)"
        side_effects:
          - "sets Clinician.status = ACTIVE"
          - "increments Clinician.version by 1"
        note: "Reinstatement does NOT resurrect the claims declined at suspension time; the clinician must claim again."

  - entity: StaffingOrder
    axis: status
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    shape: "compound + cyclic (fill posture derived from child Shift states; FILLED -> PARTIALLY_FILLED -> OPEN on release)"
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "system: order_fill_posture recompute after POST /staffing/shifts/{id}/award"
        actor: system
        preconditions:
          - "order.status == OPEN"
          - "recomputed filled_count > 0 and filled_count < order.headcount"
        side_effects:
          - "sets StaffingOrder.status = PARTIALLY_FILLED"
          - "refreshes shift_count, open_count, filled_count, completed_count, cancelled_count"
          - "increments StaffingOrder.version by 1"
      - from: OPEN
        to: FILLED
        trigger: "system: order_fill_posture recompute after POST /staffing/shifts/{id}/award"
        actor: system
        preconditions:
          - "order.status == OPEN"
          - "recomputed filled_count == order.headcount"
        side_effects:
          - "sets StaffingOrder.status = FILLED"
          - "refreshes the five counter fields"
          - "increments StaffingOrder.version by 1"
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "system: order_fill_posture recompute after POST /staffing/shifts/{id}/award"
        actor: system
        preconditions:
          - "recomputed filled_count == order.headcount"
        side_effects:
          - "sets StaffingOrder.status = FILLED"
          - "refreshes the five counter fields"
          - "increments StaffingOrder.version by 1"
      - from: FILLED
        to: PARTIALLY_FILLED
        trigger: "system: order_fill_posture recompute after an Assignment release (cancel or no-show) returns its Shift to OPEN"
        actor: system
        preconditions:
          - "recomputed filled_count > 0 and filled_count < order.headcount"
        side_effects:
          - "sets StaffingOrder.status = PARTIALLY_FILLED"
          - "refreshes the five counter fields"
          - "increments StaffingOrder.version by 1"
      - from: PARTIALLY_FILLED
        to: OPEN
        trigger: "system: order_fill_posture recompute after an Assignment release returns its Shift to OPEN"
        actor: system
        preconditions:
          - "recomputed filled_count == 0"
          - "recomputed completed_count == 0"
        side_effects:
          - "sets StaffingOrder.status = OPEN"
          - "refreshes the five counter fields"
          - "increments StaffingOrder.version by 1"
      - from: PARTIALLY_FILLED
        to: CLOSED
        trigger: "system: order_fill_posture recompute after a Shift reaches COMPLETED"
        actor: system
        preconditions:
          - "shift_count >= 1"
          - "every Shift under the order has status IN {COMPLETED, CANCELLED}"
        side_effects:
          - "sets StaffingOrder.status = CLOSED"
          - "refreshes the five counter fields"
          - "increments StaffingOrder.version by 1"
      - from: FILLED
        to: CLOSED
        trigger: "system: order_fill_posture recompute after a Shift reaches COMPLETED"
        actor: system
        preconditions:
          - "shift_count >= 1"
          - "every Shift under the order has status IN {COMPLETED, CANCELLED}"
        side_effects:
          - "sets StaffingOrder.status = CLOSED"
          - "refreshes the five counter fields"
          - "increments StaffingOrder.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /staffing/orders/{id}/cancel"
        actor: FacilityScheduler
        preconditions:
          - "order.status IN {OPEN, PARTIALLY_FILLED, FILLED}"
          - "X-User-ID == order.facility_id"
        side_effects:
          - "CASCADE LINK 1 — sets every Shift under the order whose status IN {OPEN, ASSIGNED} to CANCELLED"
          - "CASCADE LINK 2 — because those Shifts became CANCELLED, every Assignment on them whose work_status IN {PENDING_CONFIRMATION, CONFIRMED} moves to CANCELLED_BY_FACILITY and its pay_status moves to WAIVED"
          - "CASCADE LINK 3 — because those Assignments were cancelled by the facility, one ReliabilityEvent of event_type FACILITY_CANCELLATION_CREDIT is appended per cancelled Assignment with credit_points = FACILITY_CANCELLATION_CREDIT_POINTS (2) and adjudication_status = CONFIRMED"
          - "CASCADE LINK 4 — because those ReliabilityEvents were appended, reliability_recompute runs for each affected Clinician, rewriting reliability_score and provisional_reliability_score and, when the provisional score crosses back to >= RELIABILITY_SUSPENSION_THRESHOLD, moving Clinician.status SUSPENDED -> ACTIVE"
          - "sets every remaining ShiftClaim with status == PENDING on the cancelled Shifts to DECLINED and recomputes Shift.claim_count"
          - "sets StaffingOrder.status = CANCELLED, refreshes the five counter fields"
          - "increments StaffingOrder.version by 1"
      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "POST /staffing/orders/{id}/cancel"
        actor: FacilityScheduler
        preconditions:
          - "order.status IN {OPEN, PARTIALLY_FILLED, FILLED}"
          - "X-User-ID == order.facility_id"
        side_effects:
          - "identical four-link cascade as the OPEN -> CANCELLED transition"
      - from: FILLED
        to: CANCELLED
        trigger: "POST /staffing/orders/{id}/cancel"
        actor: FacilityScheduler
        preconditions:
          - "order.status IN {OPEN, PARTIALLY_FILLED, FILLED}"
          - "X-User-ID == order.facility_id"
        side_effects:
          - "identical four-link cascade as the OPEN -> CANCELLED transition"

  - entity: Shift
    axis: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    shape: "cyclic (OPEN -> ASSIGNED -> OPEN when an assignment is released)"
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /staffing/shifts/{id}/award"
        actor: FacilityScheduler
        preconditions:
          - "shift.status == OPEN"
          - "parent StaffingOrder.status IN {OPEN, PARTIALLY_FILLED}"
          - "at least one eligible PENDING ShiftClaim exists (see claim_award_selection)"
        side_effects:
          - "creates an Assignment in work_status PENDING_CONFIRMATION and pay_status UNBILLED"
          - "sets Shift.status = ASSIGNED"
          - "sets the winning ShiftClaim.status = AWARDED and every other PENDING ShiftClaim on this shift to DECLINED"
          - "recomputes Shift.claim_count and increments Shift.version by 1"
          - "triggers order_fill_posture recompute on the parent StaffingOrder"
      - from: ASSIGNED
        to: OPEN
        trigger: "system: Assignment release — POST /staffing/assignments/{id}/cancel or POST /staffing/assignments/{id}/no-show"
        actor: system
        preconditions:
          - "shift.status == ASSIGNED"
          - "parent StaffingOrder.status != CANCELLED"
        side_effects:
          - "sets Shift.status = OPEN so the slot can be backfilled"
          - "increments Shift.version by 1"
          - "triggers order_fill_posture recompute on the parent StaffingOrder"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "system: POST /staffing/timesheets/{id}/verify moved the shift's Assignment to pay_status PAYABLE"
        actor: system
        preconditions:
          - "shift.status == ASSIGNED"
          - "the shift's Assignment has pay_status == PAYABLE"
        side_effects:
          - "sets Shift.status = COMPLETED"
          - "increments Shift.version by 1"
          - "triggers order_fill_posture recompute on the parent StaffingOrder"
      - from: OPEN
        to: CANCELLED
        trigger: "system: parent StaffingOrder cancelled"
        actor: system
        preconditions:
          - "shift.status IN {OPEN, ASSIGNED}"
        side_effects:
          - "sets Shift.status = CANCELLED and increments Shift.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system: parent StaffingOrder cancelled"
        actor: system
        preconditions:
          - "shift.status IN {OPEN, ASSIGNED}"
        side_effects:
          - "sets Shift.status = CANCELLED and increments Shift.version by 1"
          - "cascades into the shift's live Assignment (see StaffingOrder cancel LINK 2)"

  - entity: ShiftClaim
    axis: status
    initial_state: PENDING
    terminal_states: [AWARDED, DECLINED, WITHDRAWN]
    shape: "branching (one PENDING fans out to three terminal outcomes)"
    transitions:
      - from: PENDING
        to: AWARDED
        trigger: "POST /staffing/shifts/{id}/award selected this claim"
        actor: FacilityScheduler
        preconditions:
          - "claim.status == PENDING"
          - "claim.clinician passes every eligibility predicate of claim_award_selection"
        side_effects:
          - "sets ShiftClaim.status = AWARDED and increments ShiftClaim.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "system: a sibling claim on the same shift was awarded, OR the shift was cancelled, OR the claimant clinician was suspended"
        actor: system
        preconditions:
          - "claim.status == PENDING"
        side_effects:
          - "sets ShiftClaim.status = DECLINED and increments ShiftClaim.version by 1"
          - "recomputes Shift.claim_count and increments Shift.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /staffing/claims/{id}/withdraw"
        actor: Clinician
        preconditions:
          - "claim.status == PENDING"
          - "X-User-ID == claim.clinician_id"
        side_effects:
          - "sets ShiftClaim.status = WITHDRAWN and increments ShiftClaim.version by 1"
          - "recomputes Shift.claim_count and increments Shift.version by 1"

  - entity: Assignment
    axis: work_status
    initial_state: PENDING_CONFIRMATION
    terminal_states: [WORKED, CANCELLED_BY_CLINICIAN, CANCELLED_BY_FACILITY, NO_SHOW]
    shape: "branching; this work_status axis evolves independently of the pay_status axis on the same row"
    transitions:
      - from: PENDING_CONFIRMATION
        to: CONFIRMED
        trigger: "POST /staffing/assignments/{id}/confirm"
        actor: Clinician
        preconditions:
          - "assignment.work_status == PENDING_CONFIRMATION"
          - "X-User-ID == assignment.clinician_id"
          - "the assignment's Clinician.status == ACTIVE"
          - "current_utc < shift.scheduled_start"
        side_effects:
          - "sets Assignment.work_status = CONFIRMED and confirmed_at = current_utc"
          - "increments Assignment.version by 1"
        note: "pay_status is untouched — the two axes are independent."
      - from: CONFIRMED
        to: WORKED
        trigger: "system: POST /staffing/assignments/{id}/timesheets accepted a timesheet"
        actor: system
        preconditions:
          - "assignment.work_status == CONFIRMED"
        side_effects:
          - "sets Assignment.work_status = WORKED"
          - "increments Clinician.completed_shift_count by 1"
          - "increments Assignment.version by 1"
      - from: PENDING_CONFIRMATION
        to: CANCELLED_BY_CLINICIAN
        trigger: "POST /staffing/assignments/{id}/cancel by the assigned Clinician"
        actor: Clinician
        preconditions:
          - "assignment.work_status IN {PENDING_CONFIRMATION, CONFIRMED}"
          - "X-User-ID == assignment.clinician_id"
        side_effects:
          - "sets Assignment.work_status = CANCELLED_BY_CLINICIAN, pay_status = WAIVED, cancellation_reason = reason"
          - "sets Assignment.cancellation_lead_hours per the cancellation_penalty_tier rule"
          - "when the tier is LATE or VERY_LATE, appends one ReliabilityEvent (LATE_CANCELLATION penalty 5, or VERY_LATE_CANCELLATION penalty 15) with adjudication_status = PENDING, then runs reliability_recompute for the Clinician"
          - "returns the Shift ASSIGNED -> OPEN, which triggers order_fill_posture recompute"
          - "increments Assignment.version by 1"
      - from: CONFIRMED
        to: CANCELLED_BY_CLINICIAN
        trigger: "POST /staffing/assignments/{id}/cancel by the assigned Clinician"
        actor: Clinician
        preconditions:
          - "assignment.work_status IN {PENDING_CONFIRMATION, CONFIRMED}"
          - "X-User-ID == assignment.clinician_id"
        side_effects:
          - "identical to the PENDING_CONFIRMATION -> CANCELLED_BY_CLINICIAN side-effect set"
      - from: PENDING_CONFIRMATION
        to: CANCELLED_BY_FACILITY
        trigger: "POST /staffing/assignments/{id}/cancel by the owning FacilityScheduler, or the StaffingOrder cancel cascade"
        actor: FacilityScheduler
        preconditions:
          - "assignment.work_status IN {PENDING_CONFIRMATION, CONFIRMED}"
          - "X-User-ID == the facility_id of the assignment's StaffingOrder"
        side_effects:
          - "sets Assignment.work_status = CANCELLED_BY_FACILITY, pay_status = WAIVED, cancellation_reason = reason, cancellation_lead_hours per cancellation_penalty_tier"
          - "appends one ReliabilityEvent FACILITY_CANCELLATION_CREDIT with credit_points = 2 and adjudication_status = CONFIRMED, then runs reliability_recompute for the Clinician"
          - "returns the Shift ASSIGNED -> OPEN (skipped when the shift is being cancelled by the order cascade), which triggers order_fill_posture recompute"
          - "increments Assignment.version by 1"
      - from: CONFIRMED
        to: CANCELLED_BY_FACILITY
        trigger: "POST /staffing/assignments/{id}/cancel by the owning FacilityScheduler, or the StaffingOrder cancel cascade"
        actor: FacilityScheduler
        preconditions:
          - "assignment.work_status IN {PENDING_CONFIRMATION, CONFIRMED}"
          - "X-User-ID == the facility_id of the assignment's StaffingOrder"
        side_effects:
          - "identical to the PENDING_CONFIRMATION -> CANCELLED_BY_FACILITY side-effect set"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /staffing/assignments/{id}/no-show"
        actor: FacilityVerifier
        preconditions:
          - "assignment.work_status == CONFIRMED"
          - "current_utc >= shift.scheduled_start"
          - "X-User-ID == the facility_id of the assignment's StaffingOrder"
        side_effects:
          - "CASCADE LINK 1 — sets Assignment.work_status = NO_SHOW and pay_status = WAIVED"
          - "CASCADE LINK 2 — because the assignment was marked NO_SHOW, appends one ReliabilityEvent NO_SHOW with penalty_points = NO_SHOW_PENALTY_POINTS (30) and adjudication_status = PENDING, then runs reliability_recompute rewriting Clinician.reliability_score and Clinician.provisional_reliability_score"
          - "CASCADE LINK 3 — because the recomputed provisional score may fall below RELIABILITY_SUSPENSION_THRESHOLD, Clinician.status moves ACTIVE -> SUSPENDED and every PENDING ShiftClaim of that clinician is set to DECLINED with Shift.claim_count recomputed on each affected Shift"
          - "returns the Shift ASSIGNED -> OPEN, which triggers order_fill_posture recompute"
          - "increments Assignment.version by 1"

  - entity: Assignment
    axis: pay_status
    initial_state: UNBILLED
    terminal_states: [PAID, WAIVED]
    shape: "cyclic (INVOICED -> PAYABLE on void); independent of the work_status axis"
    transitions:
      - from: UNBILLED
        to: TIMESHEET_PENDING
        trigger: "system: POST /staffing/assignments/{id}/timesheets"
        actor: system
        preconditions:
          - "assignment.pay_status == UNBILLED"
        side_effects:
          - "sets Assignment.pay_status = TIMESHEET_PENDING"
          - "increments Assignment.version by 1"
      - from: TIMESHEET_PENDING
        to: PAYABLE
        trigger: "system: POST /staffing/timesheets/{id}/verify"
        actor: system
        preconditions:
          - "assignment.pay_status == TIMESHEET_PENDING"
        side_effects:
          - "sets Assignment.pay_status = PAYABLE and Assignment.final_pay_cents = Timesheet.gross_pay_cents"
          - "increments Facility.pending_pay_cents by Timesheet.gross_pay_cents and increments Facility.version by 1"
          - "increments Assignment.version by 1"
      - from: PAYABLE
        to: INVOICED
        trigger: "system: POST /staffing/invoices pulled the assignment's timesheet onto a DRAFT invoice"
        actor: system
        preconditions:
          - "assignment.pay_status == PAYABLE"
        side_effects:
          - "sets Assignment.pay_status = INVOICED"
          - "increments Assignment.version by 1"
      - from: INVOICED
        to: PAYABLE
        trigger: "system: POST /staffing/invoices/{id}/void"
        actor: system
        preconditions:
          - "assignment.pay_status == INVOICED"
        side_effects:
          - "sets Assignment.pay_status = PAYABLE"
          - "increments Assignment.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "system: POST /staffing/invoices/{id}/settle"
        actor: system
        preconditions:
          - "assignment.pay_status == INVOICED"
        side_effects:
          - "sets Assignment.pay_status = PAID"
          - "increments Assignment.version by 1"
      - from: UNBILLED
        to: WAIVED
        trigger: "system: the work_status axis reached CANCELLED_BY_CLINICIAN, CANCELLED_BY_FACILITY, or NO_SHOW"
        actor: system
        preconditions:
          - "assignment.pay_status == UNBILLED"
        side_effects:
          - "sets Assignment.pay_status = WAIVED"
          - "increments Assignment.version by 1"

  - entity: Timesheet
    axis: status
    initial_state: SUBMITTED
    terminal_states: [PAID]
    shape: "cyclic (SUBMITTED -> DISPUTED -> SUBMITTED, bounded by TIMESHEET_MAX_DISPUTE_ROUNDS; INVOICED -> VERIFIED on void)"
    transitions:
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /staffing/timesheets/{id}/dispute"
        actor: FacilityVerifier
        preconditions:
          - "timesheet.status == SUBMITTED"
          - "timesheet.dispute_count < TIMESHEET_MAX_DISPUTE_ROUNDS (2)"
          - "X-User-ID == the facility_id of the timesheet's StaffingOrder"
        side_effects:
          - "sets Timesheet.status = DISPUTED, dispute_reason = reason, increments dispute_count by 1"
          - "increments Timesheet.version by 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /staffing/timesheets/{id}/resubmit with corrected punches"
        actor: Clinician
        preconditions:
          - "timesheet.status == DISPUTED"
          - "X-User-ID == the timesheet's Assignment.clinician_id"
        side_effects:
          - "overwrites clock_in, clock_out, break_minutes and recomputes raw_minutes, unpaid_break_minutes, worked_hours, night_hours, weekend_hours"
          - "sets Timesheet.status = SUBMITTED"
          - "increments Timesheet.version by 1"
        note: "The cycle back-edge; dispute_count is NOT reset, which is what bounds the loop."
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /staffing/timesheets/{id}/verify"
        actor: FacilityVerifier
        preconditions:
          - "timesheet.status == SUBMITTED"
          - "the timesheet's Assignment.work_status == WORKED"
          - "X-User-ID == the facility_id of the timesheet's StaffingOrder"
        side_effects:
          - "CASCADE LINK 1 — runs weekly_overtime_allocation then shift_pay_amount(FINAL), writing overtime_hours, regular_hours and gross_pay_cents; sets status = VERIFIED and verified_at = current_utc"
          - "CASCADE LINK 2 — because the timesheet became VERIFIED, the Assignment's pay_status axis moves TIMESHEET_PENDING -> PAYABLE, final_pay_cents is set, and Facility.pending_pay_cents grows by gross_pay_cents"
          - "CASCADE LINK 3 — because the Assignment reached pay_status PAYABLE, its Shift moves ASSIGNED -> COMPLETED, which triggers order_fill_posture recompute on the StaffingOrder (PARTIALLY_FILLED/FILLED -> CLOSED once every sibling shift is terminal)"
          - "appends one ReliabilityEvent SHIFT_COMPLETED with credit_points = SHIFT_COMPLETION_CREDIT_POINTS (2) and adjudication_status = CONFIRMED, then runs reliability_recompute for the Clinician"
          - "increments Timesheet.version by 1"
      - from: VERIFIED
        to: INVOICED
        trigger: "system: POST /staffing/invoices pulled this timesheet onto a DRAFT invoice"
        actor: system
        preconditions:
          - "timesheet.status == VERIFIED"
        side_effects:
          - "sets Timesheet.status = INVOICED and Timesheet.invoice_id = the new invoice id"
          - "decrements Facility.pending_pay_cents by gross_pay_cents"
          - "increments Timesheet.version by 1"
      - from: INVOICED
        to: VERIFIED
        trigger: "system: POST /staffing/invoices/{id}/void"
        actor: system
        preconditions:
          - "timesheet.status == INVOICED"
        side_effects:
          - "sets Timesheet.status = VERIFIED and Timesheet.invoice_id = null"
          - "increments Facility.pending_pay_cents by gross_pay_cents"
          - "increments Timesheet.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "system: POST /staffing/invoices/{id}/settle"
        actor: system
        preconditions:
          - "timesheet.status == INVOICED"
        side_effects:
          - "sets Timesheet.status = PAID"
          - "increments Timesheet.version by 1"

  - entity: ReliabilityEvent
    axis: adjudication_status
    initial_state: PENDING
    terminal_states: [CONFIRMED, OVERTURNED]
    shape: "branching"
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /staffing/reliability-events/{id}/adjudicate with decision == CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "event.adjudication_status == PENDING"
        side_effects:
          - "sets adjudication_status = CONFIRMED and adjudicated_at = current_utc"
          - "runs reliability_recompute for the Clinician, rewriting reliability_score, provisional_reliability_score and no_show_count, and possibly moving Clinician.status"
          - "increments ReliabilityEvent.version by 1"
      - from: PENDING
        to: OVERTURNED
        trigger: "POST /staffing/reliability-events/{id}/adjudicate with decision == OVERTURNED"
        actor: ComplianceOfficer
        preconditions:
          - "event.adjudication_status == PENDING"
        side_effects:
          - "sets adjudication_status = OVERTURNED and adjudicated_at = current_utc"
          - "runs reliability_recompute for the Clinician; OVERTURNED events are excluded from BOTH score variants, so the provisional score returns exactly to its pre-event value and a suspension caused by this event is reversed"
          - "increments ReliabilityEvent.version by 1"
        note: "Credit events (SHIFT_COMPLETED, FACILITY_CANCELLATION_CREDIT) are appended directly in CONFIRMED and therefore never enter this machine."

  - entity: Invoice
    axis: status
    initial_state: DRAFT
    terminal_states: [SETTLED, VOID]
    shape: "branching"
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /staffing/invoices/{id}/issue"
        actor: BillingAgent
        preconditions:
          - "invoice.status == DRAFT"
          - "invoice.line_count >= 1"
        side_effects:
          - "sets status = ISSUED, issued_at = current_utc, issued_by_user_id = X-User-ID, due_at = current_utc + INVOICE_NET_TERMS_DAYS days"
          - "increments Facility.outstanding_balance_cents by bill_total_cents"
          - "increments Facility.lifetime_billed_cents by bill_total_cents"
          - "increments Facility.version by 1 and Invoice.version by 1"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /staffing/invoices/{id}/settle"
        actor: BillingAgent
        preconditions:
          - "invoice.status == ISSUED"
          - "X-User-ID != invoice.issued_by_user_id (segregation of duties)"
          - "paid_amount_cents == invoice.bill_total_cents"
        side_effects:
          - "sets status = SETTLED, settled_by_user_id = X-User-ID, paid_amount_cents = supplied amount"
          - "decrements Facility.outstanding_balance_cents by bill_total_cents (lifetime_billed_cents is unchanged)"
          - "moves every line's Timesheet INVOICED -> PAID and every corresponding Assignment pay_status INVOICED -> PAID"
          - "increments Facility.version by 1 and Invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /staffing/invoices/{id}/void"
        actor: BillingAgent
        preconditions:
          - "invoice.status IN {DRAFT, ISSUED}"
        side_effects:
          - "sets status = VOID and void_reason = reason"
          - "moves every line's Timesheet INVOICED -> VERIFIED (invoice_id cleared) and every corresponding Assignment pay_status INVOICED -> PAYABLE"
          - "increments Facility.pending_pay_cents by pay_total_cents"
          - "increments Facility.version by 1 and Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /staffing/invoices/{id}/void"
        actor: BillingAgent
        preconditions:
          - "invoice.status IN {DRAFT, ISSUED}"
        side_effects:
          - "sets status = VOID and void_reason = reason"
          - "decrements Facility.outstanding_balance_cents by bill_total_cents AND decrements Facility.lifetime_billed_cents by bill_total_cents, restoring both to their pre-issue values"
          - "moves every line's Timesheet INVOICED -> VERIFIED (invoice_id cleared) and every corresponding Assignment pay_status INVOICED -> PAYABLE"
          - "increments Facility.pending_pay_cents by pay_total_cents"
          - "increments Facility.version by 1 and Invoice.version by 1"

# ===========================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned
# mechanism). Both entries survive the serial-observability filter: the loser's
# request would legitimately succeed under natural product semantics if its view
# of the parent were current.
# ===========================================================================
concurrency_rules:
  - rule_id: award-against-stale-shift
    parent_entity: Shift
    write_endpoint: "POST /staffing/shifts/{id}/award"
    occ_field: "expected_shift_version"
    description: |
      Awarding a Shift whose version has advanced since the client last read it is
      rejected. Shift.version advances whenever claim_count is recomputed, i.e.
      whenever a new ShiftClaim lands or an existing one is withdrawn. The award
      call therefore encodes "I have seen the candidate pool as of version N"; if
      the pool has changed, the scheduler's ranking decision was made against a
      stale candidate set and is refused so the scheduler can re-read and re-decide.
    error_id: ERR_STALE_SHIFT_VERSION
    http_status: 412

  - rule_id: invoice-generate-against-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /staffing/invoices"
    occ_field: "expected_facility_version"
    description: |
      Generating an Invoice for a Facility whose version has advanced since the
      client last read it is rejected. Facility.version advances whenever
      pending_pay_cents changes, i.e. whenever another Timesheet is verified into
      the billable pool. The generation call encodes "I have seen the billable set
      as of version N"; a stale version means the draft would omit or misstate
      billable work, so the caller must re-read the facility first.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
#
# Global determinism note: NO calculation, selector, tie-break, allocation
# order, cascade order or replay order anywhere in this scaffold reads an
# entity `id`. Where a final tie-break over common fields is needed, it is
# `created_at ASC`.
# ===========================================================================
calculations:

  - name: worked_hours_normalization
    trigger: "on POST /staffing/assignments/{id}/timesheets and on POST /staffing/timesheets/{id}/resubmit"
    algorithm: aggregation
    formula: |
      raw_minutes = whole_minutes(clock_out - clock_in)
      if raw_minutes >= UNPAID_BREAK_THRESHOLD_MINUTES and break_minutes < UNPAID_BREAK_MINUTES:
          unpaid_break_minutes = UNPAID_BREAK_MINUTES
      else:
          unpaid_break_minutes = break_minutes
      worked_hours = round_half_up((raw_minutes - unpaid_break_minutes) / 60, 2)
    input_set: "The single Timesheet being written. clock_out must be strictly after clock_in (ERR_INVALID_PUNCH_INTERVAL otherwise)."
    constants:
      UNPAID_BREAK_THRESHOLD_MINUTES: 360
      UNPAID_BREAK_MINUTES: 30
    precision: "worked_hours to 2 decimal places, round_half_up; raw_minutes and unpaid_break_minutes are whole integers"
    note: "A short shift (raw_minutes < 360) with break_minutes = 0 keeps a 0-minute break; a long shift with an under-reported break is force-deducted to 30."

  - name: differential_hours
    trigger: "on POST /staffing/assignments/{id}/timesheets, on POST /staffing/timesheets/{id}/resubmit (FINAL), and at Shift creation over the scheduled interval (ESTIMATED)"
    algorithm: interval_merge
    formula: |
      # Both windows are measured over the RAW interval [start, end) — the unpaid
      # break is deliberately NOT deducted from differential hours.
      night_minutes  = minutes of [start, end) whose UTC wall time falls in
                       [NIGHT_WINDOW_START_HOUR:00, 24:00) union [00:00, NIGHT_WINDOW_END_HOUR:00)
      weekend_minutes = minutes of [start, end) whose UTC calendar day is Saturday or Sunday
      night_hours   = round_half_up(night_minutes / 60, 2)
      weekend_hours = round_half_up(weekend_minutes / 60, 2)
      # The two windows may overlap; a Saturday 22:00 minute counts in BOTH and
      # therefore earns both differentials.
    input_set: "FINAL variant reads [clock_in, clock_out); ESTIMATED variant reads [scheduled_start, scheduled_end). Half-open in both cases, so a shift ending exactly at 19:00 has zero night minutes."
    constants:
      NIGHT_WINDOW_START_HOUR: 19
      NIGHT_WINDOW_END_HOUR: 7
    precision: "2 decimal places, round_half_up"

  - name: weekly_overtime_allocation
    trigger: "inside POST /staffing/timesheets/{id}/verify, immediately before shift_pay_amount(FINAL)"
    algorithm: chronological
    formula: |
      week_start = the most recent Monday 00:00:00Z at or before shift.scheduled_start
      week_end   = week_start + 7 days           # half-open [week_start, week_end)
      cumulative_before = sum of Timesheet.worked_hours over the SAME Clinician's
          timesheets T2 where:
            - T2.id != this timesheet
            - T2.status IN {VERIFIED, INVOICED, PAID} at the instant this
              verification is processed
            - T2's Shift.scheduled_start IN [week_start, week_end)
      overtime_hours = round_half_up(
          max(0.0, min(worked_hours, cumulative_before + worked_hours - OVERTIME_THRESHOLD_HOURS)), 2)
      regular_hours  = round_half_up(worked_hours - overtime_hours, 2)
    input_set: |
      Only ALREADY-VERIFIED sibling timesheets in the same ISO week count toward
      cumulative_before; SUBMITTED and DISPUTED siblings are excluded. The
      accumulator therefore advances in VERIFICATION order, which is the declared
      order-sensitivity of this rule. Once written, overtime_hours and
      regular_hours are frozen on the timesheet and are NOT retro-adjusted when a
      later sibling is verified.
    constants:
      OVERTIME_THRESHOLD_HOURS: 40.0
    precision: "2 decimal places, round_half_up"
    note: "Boundary is strict: cumulative_before + worked_hours == 40.00 yields overtime_hours == 0.00; 40.01 yields 0.01."

  - name: shift_pay_amount
    trigger: "ESTIMATED variant on POST /staffing/orders/{id}/shifts (frozen onto Shift.estimated_pay_cents, copied to Assignment.estimated_pay_cents at award); FINAL variant inside POST /staffing/timesheets/{id}/verify (written to Timesheet.gross_pay_cents and copied to Assignment.final_pay_cents)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — pick the rate card (see rate_card_selection below) and freeze the rate.
      base_rate = RateCard.base_pay_rate_cents_per_hour
      if StaffingOrder.urgency == "CRISIS":
          effective_rate = round_half_up(base_rate * CRISIS_RATE_MULTIPLIER)   # whole cents, rounded ONCE, before any hour multiplication
      else:
          effective_rate = base_rate

      # Step 2 — split the hours (FINAL only; ESTIMATED sets overtime_hours = 0.00).
      regular_hours, overtime_hours   # from weekly_overtime_allocation

      # Step 3 — three independently rounded money components, then a single sum.
      regular_component = round_half_up(regular_hours * effective_rate)
      overtime_component = round_half_up(overtime_hours * effective_rate * OVERTIME_MULTIPLIER)
      differential_component = round_half_up(night_hours * NIGHT_DIFF_CENTS_PER_HOUR)
                             + round_half_up(weekend_hours * WEEKEND_DIFF_CENTS_PER_HOUR)

      pay_cents = regular_component + overtime_component + differential_component
    input_set: |
      ESTIMATED reads the SCHEDULED interval, deems the unpaid break with the same
      UNPAID_BREAK_* rule applied to the scheduled duration, sets overtime_hours to
      0.00 (a shift is estimated standalone, with no knowledge of the week), and uses
      scheduled-interval differential hours. FINAL reads the ACTUAL punches, the
      weekly overtime allocation, and actual-interval differential hours.
    constants:
      CRISIS_RATE_MULTIPLIER: 1.25
      OVERTIME_MULTIPLIER: 1.5
      NIGHT_DIFF_CENTS_PER_HOUR: 450
      WEEKEND_DIFF_CENTS_PER_HOUR: 300
      UNPAID_BREAK_THRESHOLD_MINUTES: 360
      UNPAID_BREAK_MINUTES: 30
    precision: "whole cents; round_half_up applied per component (Step 3), never to the final sum"
    variants:
      - name: ESTIMATED
        when: "at Shift creation and again copied onto the Assignment at award time"
        difference: "scheduled interval instead of punches; overtime_hours forced to 0.00; differential hours from the scheduled interval. Stored on Shift.estimated_pay_cents and Assignment.estimated_pay_cents."
      - name: FINAL
        when: "at timesheet verification"
        difference: "actual punches; weekly overtime split applied; differential hours from the actual raw interval. Stored on Timesheet.gross_pay_cents and Assignment.final_pay_cents. For identical scheduled and actual intervals the two variants agree; any punch drift or any weekly overtime makes them diverge."

  - name: rate_card_selection
    trigger: "inside POST /staffing/orders/{id}/shifts, before shift_pay_amount(ESTIMATED)"
    algorithm: threshold
    formula: |
      candidates = RateCards R where
          R.facility_id == order.facility_id
          and R.specialty == order.specialty
          and R.effective_from <= shift.scheduled_start
          and (R.effective_to is null or shift.scheduled_start < R.effective_to)
      if candidates is empty: raise ERR_RATE_CARD_NOT_FOUND
      winner = the candidate with the greatest effective_from;
               tie-break: greatest created_at; final tie-break: created_at ASC is
               unreachable because created_at is unique per row
      Shift.base_pay_rate_cents_per_hour = winner.base_pay_rate_cents_per_hour
    input_set: "All RateCards of the facility for the order's specialty; effective_from inclusive, effective_to exclusive."
    constants: {}
    precision: "n/a"

  - name: cancellation_penalty_tier
    trigger: "inside POST /staffing/assignments/{id}/cancel and POST /staffing/assignments/{id}/no-show"
    algorithm: threshold
    formula: |
      lead_hours = round_half_up((shift.scheduled_start - current_utc) / 3600 seconds, 2)
      if actor is the facility (CANCELLED_BY_FACILITY):
          event_type = FACILITY_CANCELLATION_CREDIT
          credit_points = FACILITY_CANCELLATION_CREDIT_POINTS   # 2, regardless of lead_hours
          penalty_points = 0
      elif transition is NO_SHOW:
          event_type = NO_SHOW; penalty_points = NO_SHOW_PENALTY_POINTS   # 30
      elif lead_hours >= CANCELLATION_FREE_HOURS:                          # >= 72.00
          no ReliabilityEvent is appended at all
      elif lead_hours >= CANCELLATION_LATE_HOURS:                          # 24.00 <= lead < 72.00
          event_type = LATE_CANCELLATION; penalty_points = CANCEL_PENALTY_POINTS_LATE       # 5
      else:                                                                # lead < 24.00, including negative
          event_type = VERY_LATE_CANCELLATION; penalty_points = CANCEL_PENALTY_POINTS_VERY_LATE  # 15
    input_set: "The single Assignment being released and its Shift.scheduled_start, evaluated against the logical clock."
    constants:
      CANCELLATION_FREE_HOURS: 72.0
      CANCELLATION_LATE_HOURS: 24.0
      CANCEL_PENALTY_POINTS_LATE: 5
      CANCEL_PENALTY_POINTS_VERY_LATE: 15
      NO_SHOW_PENALTY_POINTS: 30
      FACILITY_CANCELLATION_CREDIT_POINTS: 2
    precision: "lead_hours to 2 decimal places, round_half_up; points are integers"
    note: "Both boundaries are inclusive-on-the-cheaper-side: lead_hours == 72.00 is free, lead_hours == 24.00 is LATE (5), lead_hours == 23.99 is VERY_LATE (15)."

  - name: reliability_score
    trigger: "reliability_recompute — fired by every ReliabilityEvent append (cancel, no-show, verify, facility cancel cascade) and by POST /staffing/reliability-events/{id}/adjudicate"
    algorithm: weighted_scoring
    formula: |
      def weight(event):
          age_days = floor((current_utc - event.occurred_at) / 86400 seconds)
          if age_days <= RELIABILITY_WEIGHT_TIER1_MAX_AGE_DAYS: return RELIABILITY_WEIGHT_TIER1   # <= 30  -> 1.0
          if age_days <= RELIABILITY_WEIGHT_TIER2_MAX_AGE_DAYS: return RELIABILITY_WEIGHT_TIER2   # <= 60  -> 0.6
          if age_days <= RELIABILITY_WEIGHT_TIER3_MAX_AGE_DAYS: return RELIABILITY_WEIGHT_TIER3   # <= 90  -> 0.3
          return 0.0                                                                              # > 90   -> excluded

      def score(included_adjudication_statuses):
          raw = RELIABILITY_BASE_SCORE
          for e in ReliabilityEvents of this clinician
                   where e.adjudication_status IN included_adjudication_statuses
                     and e.occurred_at >= current_utc - RELIABILITY_WINDOW_DAYS days
                     and e.occurred_at <= current_utc:
              raw = raw - e.penalty_points * weight(e) + e.credit_points * weight(e)
          return clamp(round_half_up(raw), RELIABILITY_MIN_SCORE, RELIABILITY_MAX_SCORE)

      Clinician.reliability_score             = score({CONFIRMED})
      Clinician.provisional_reliability_score = score({PENDING, CONFIRMED})
      Clinician.no_show_count = count of in-window events with event_type == NO_SHOW
                                and adjudication_status == CONFIRMED
    input_set: "All ReliabilityEvents of the clinician whose occurred_at falls in the trailing RELIABILITY_WINDOW_DAYS window, inclusive at both ends. OVERTURNED events are excluded from BOTH variants."
    constants:
      RELIABILITY_BASE_SCORE: 100
      RELIABILITY_MIN_SCORE: 0
      RELIABILITY_MAX_SCORE: 100
      RELIABILITY_WINDOW_DAYS: 90
      RELIABILITY_WEIGHT_TIER1_MAX_AGE_DAYS: 30
      RELIABILITY_WEIGHT_TIER1: 1.0
      RELIABILITY_WEIGHT_TIER2_MAX_AGE_DAYS: 60
      RELIABILITY_WEIGHT_TIER2: 0.6
      RELIABILITY_WEIGHT_TIER3_MAX_AGE_DAYS: 90
      RELIABILITY_WEIGHT_TIER3: 0.3
      RELIABILITY_SUSPENSION_THRESHOLD: 60
    precision: "integer score, round_half_up before clamping"
    variants:
      - name: ADJUDICATED
        when: "written to Clinician.reliability_score; also the value snapshotted onto ShiftClaim.reliability_snapshot"
        difference: "counts only CONFIRMED events, so a freshly recorded (still PENDING) no-show has zero effect."
      - name: PROVISIONAL
        when: "written to Clinician.provisional_reliability_score; this is the variant the suspension gate reads"
        difference: "counts PENDING events as if confirmed, so a freshly recorded no-show immediately depresses it. Immediately after a first no-show on an otherwise clean clinician the two variants read 100 (ADJUDICATED) and 70 (PROVISIONAL)."

  - name: claim_award_selection
    trigger: "inside POST /staffing/shifts/{id}/award when the request omits claim_id"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter — an explicit predicate over entity fields
      candidates = ShiftClaims C on this shift where
          C.status == "PENDING"
          and Clinician(C.clinician_id).status == "ACTIVE"
          and credential_compliance_gate(C.clinician_id, shift) passes
          and clinician_shift_overlap_gate(C.clinician_id, shift) passes
          and clinician_rest_gate(C.clinician_id, shift) passes
          and weekly_hours_gate(C.clinician_id, shift) passes

      # (b) ranking expression, (c) tie-breaks
      order candidates by:
          1. Clinician.reliability_score DESC      # live ADJUDICATED score, not the snapshot
          2. ShiftClaim.claimed_at ASC             # earliest bid wins a score tie
          3. ShiftClaim.created_at ASC             # final deterministic tie-break

      # (d) empty-pool fallback
      if candidates is empty: raise ERR_NO_ELIGIBLE_CLAIM (409)

      winner = candidates[0]
    input_set: "PENDING ShiftClaims of this Shift only. AWARDED, DECLINED and WITHDRAWN claims never re-enter the pool."
    constants: {}
    precision: "n/a"
    note: "When claim_id IS supplied the pool is the single named claim; it must be PENDING, belong to this shift, and pass every eligibility predicate, otherwise the corresponding gate error is raised (not ERR_NO_ELIGIBLE_CLAIM)."

  - name: facility_markup_tier
    trigger: "inside POST /staffing/invoices, evaluated exactly once and frozen onto the DRAFT invoice"
    algorithm: threshold
    formula: |
      # Circular-looking: this invoice's bill_total_cents will itself be added to
      # Facility.lifetime_billed_cents when the invoice is ISSUED, and that field is
      # the tier input. The evaluation order is PINNED as follows and is what makes
      # the value well-defined:
      #   1. read basis = Facility.lifetime_billed_cents as it stands BEFORE this
      #      invoice exists (DRAFT invoices contribute nothing, and the invoice
      #      being generated has not been issued);
      #   2. select the tier from `basis`;
      #   3. freeze markup_tier and markup_multiplier on the invoice;
      #   4. only afterwards compute lines/bill_total_cents from the frozen multiplier.
      # The multiplier is NEVER re-derived at issue/settle time.
      basis = Facility.lifetime_billed_cents
      if basis <  MARKUP_TIER1_MAX_CENTS:  tier = TIER_1; multiplier = MARKUP_TIER1_MULTIPLIER   # basis < 200000    -> 1.45
      elif basis < MARKUP_TIER2_MAX_CENTS: tier = TIER_2; multiplier = MARKUP_TIER2_MULTIPLIER   # 200000..499999    -> 1.38
      else:                                tier = TIER_3; multiplier = MARKUP_TIER3_MULTIPLIER   # >= 500000         -> 1.32
    input_set: "Facility.lifetime_billed_cents, which is the sum of bill_total_cents over that facility's Invoices with status IN {ISSUED, SETTLED}. VOID and DRAFT invoices contribute nothing."
    constants:
      MARKUP_TIER1_MAX_CENTS: 200000
      MARKUP_TIER2_MAX_CENTS: 500000
      MARKUP_TIER1_MULTIPLIER: 1.45
      MARKUP_TIER2_MULTIPLIER: 1.38
      MARKUP_TIER3_MULTIPLIER: 1.32
    precision: "tier boundaries are half-open: basis == 200000 selects TIER_2, basis == 500000 selects TIER_3"

  - name: invoice_totals
    trigger: "inside POST /staffing/invoices, after facility_markup_tier has frozen the multiplier"
    algorithm: aggregation
    formula: |
      billable = Timesheets T where
          T.status == "VERIFIED"
          and facility_of(T) == invoice.facility_id
          and T's Shift.scheduled_start IN [period_start, period_end)     # half-open
      if billable is empty: raise ERR_NO_BILLABLE_TIMESHEETS (422)

      order billable by  Shift.scheduled_start ASC, tie-break Timesheet.created_at ASC

      lines = []
      for T in billable:
          pay_cents  = T.gross_pay_cents
          bill_cents = round_half_up(pay_cents * invoice.markup_multiplier)   # ROUND PER LINE
          lines.append({ timesheet_id: T.id, worked_hours: T.worked_hours,
                         pay_cents: pay_cents, bill_cents: bill_cents })

      pay_total_cents  = sum(l.pay_cents  for l in lines)
      bill_total_cents = sum(l.bill_cents for l in lines)    # SUM OF ALREADY-ROUNDED LINES
      margin_cents     = bill_total_cents - pay_total_cents
      line_count       = len(lines)
    input_set: "VERIFIED timesheets of the facility whose Shift.scheduled_start lies in the half-open billing period. SUBMITTED, DISPUTED, INVOICED and PAID timesheets are excluded."
    constants: {}
    precision: |
      PINNED ROUNDING ORDER: round each line to whole cents FIRST, then sum the
      rounded lines. The alternative reading (sum the exact products, then round
      once) is explicitly wrong here and produces a different bill_total_cents
      whenever two or more lines each carry a 0.5-cent remainder.

  - name: order_fill_posture
    trigger: "after every award, every Assignment release, every Shift completion, and every StaffingOrder cancel"
    algorithm: aggregation
    formula: |
      shift_count     = count(Shifts of this order)
      open_count      = count(Shifts of this order with status == "OPEN")
      filled_count    = count(Shifts of this order with status IN {"ASSIGNED", "COMPLETED"})
      completed_count = count(Shifts of this order with status == "COMPLETED")
      cancelled_count = count(Shifts of this order with status == "CANCELLED")
      # slot-partition invariant, checked after every recompute:
      #   shift_count == open_count + filled_count + cancelled_count
      status =
        CANCELLED                              if the order was explicitly cancelled
        CLOSED                                 elif shift_count >= 1 and open_count == 0
                                                    and filled_count == completed_count
                                                    and completed_count + cancelled_count == shift_count
        FILLED                                 elif filled_count == headcount
        PARTIALLY_FILLED                       elif filled_count > 0
        OPEN                                   else
    input_set: "All Shifts under the order regardless of status."
    constants:
      MAX_ORDER_HEADCOUNT: 20
    precision: "integer counters"

# ===========================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending `priority`;
# the FIRST rule that fails determines the response error_id)
# ===========================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: existence
    check: "every id in the path resolves to a stored entity, validated left-to-right"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_TIMESHEET_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_RELIABILITY_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path id"

  - priority: 31
    category: existence
    check: "every id supplied in the request body resolves to a stored entity (facility_id on POST /staffing/orders and POST /staffing/invoices, clinician_id on POST /staffing/shifts/{id}/claims, claim_id on POST /staffing/shifts/{id}/award)"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "POST /staffing/orders, POST /staffing/invoices, POST /staffing/shifts/{id}/claims, POST /staffing/shifts/{id}/award"

  - priority: 40
    category: auth
    check: "for FacilityScheduler and FacilityVerifier, X-User-ID equals the Facility.id that owns the target resource (order.facility_id, or the facility_id reached via shift -> order, assignment -> shift -> order, timesheet -> assignment -> shift -> order)"
    error_id: ERR_ROLE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /staffing/orders, POST /staffing/orders/{id}/shifts, POST /staffing/orders/{id}/cancel, POST /staffing/shifts/{id}/award, POST /staffing/assignments/{id}/cancel, POST /staffing/assignments/{id}/no-show, POST /staffing/timesheets/{id}/dispute, POST /staffing/timesheets/{id}/verify, POST /staffing/facilities/{id}/rate-cards"

  - priority: 41
    category: auth
    check: "for Clinician, X-User-ID equals the clinician_id that owns the target resource (path clinician_id, body clinician_id, claim.clinician_id, assignment.clinician_id, or timesheet -> assignment.clinician_id)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /staffing/clinicians/{id}/credentials, POST /staffing/shifts/{id}/claims, POST /staffing/claims/{id}/withdraw, POST /staffing/assignments/{id}/confirm, POST /staffing/assignments/{id}/cancel, POST /staffing/assignments/{id}/timesheets, POST /staffing/timesheets/{id}/resubmit"

  - priority: 45
    category: auth
    check: "segregation of duties — the BillingAgent settling an invoice must not be the BillingAgent who issued it (X-User-ID != invoice.issued_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /staffing/invoices/{id}/settle"

  - priority: 50
    category: business_constraint
    check: "request body conforms to the endpoint's input schema — required fields present, types correct, enum members valid, numeric ranges honoured (unit_capacity 1..20, headcount 1..MAX_ORDER_HEADCOUNT, break_minutes 0..240, base_pay_rate_cents_per_hour 1000..50000, required_credential_types non-empty), email unique among Clinicians, (clinician_id, credential_type) unique among non-REVOKED Credentials"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 55
    category: business_temporal
    check: "clock_out is strictly after clock_in, and the punched interval lies within [shift.scheduled_start - 4h, shift.scheduled_end + 4h]"
    error_id: ERR_INVALID_PUNCH_INTERVAL
    http_status: 400
    applies_to: "POST /staffing/assignments/{id}/timesheets, POST /staffing/timesheets/{id}/resubmit"

  - priority: 56
    category: business_constraint
    check: "shift duration is within [MIN_SHIFT_DURATION_HOURS (4.0), MAX_SHIFT_DURATION_HOURS (16.0)] and scheduled_end is strictly after scheduled_start"
    error_id: ERR_SHIFT_DURATION_INVALID
    http_status: 422
    applies_to: "POST /staffing/orders/{id}/shifts"

  - priority: 57
    category: business_temporal
    check: "shift.scheduled_start >= order.window_start and shift.scheduled_end <= order.window_end"
    error_id: ERR_SHIFT_OUTSIDE_ORDER_WINDOW
    http_status: 422
    applies_to: "POST /staffing/orders/{id}/shifts"

  - priority: 58
    category: business_temporal
    check: "period_end is strictly after period_start and (period_end - period_start) <= INVOICE_MAX_PERIOD_DAYS (31) days"
    error_id: ERR_INVOICE_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /staffing/invoices"

  - priority: 60
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_CREDENTIAL_NOT_PENDING | ERR_ORDER_NOT_OPEN | ERR_SHIFT_NOT_OPEN | ERR_CLAIM_NOT_PENDING | ERR_ASSIGNMENT_NOT_CONFIRMED | ERR_ASSIGNMENT_NOT_CANCELLABLE | ERR_TIMESHEET_NOT_DISPUTABLE | ERR_TIMESHEET_NOT_VERIFIABLE | ERR_TIMESHEET_NOT_RESUBMITTABLE | ERR_INVOICE_NOT_DRAFT | ERR_INVOICE_NOT_ISSUED | ERR_INVOICE_NOT_VOIDABLE | ERR_EVENT_ALREADY_ADJUDICATED"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 61
    category: state
    check: "a timesheet may only be submitted once per Assignment (assignment.pay_status must be UNBILLED) and only when assignment.work_status == CONFIRMED"
    error_id: ERR_ASSIGNMENT_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /staffing/assignments/{id}/timesheets"

  - priority: 65
    category: state
    check: "the acting or targeted Clinician has status == ACTIVE"
    error_id: ERR_CLINICIAN_SUSPENDED
    http_status: 409
    applies_to: "POST /staffing/shifts/{id}/claims, POST /staffing/shifts/{id}/award, POST /staffing/assignments/{id}/confirm"

  - priority: 70
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (OCC, §1.2.1)"
    error_id: "ERR_STALE_SHIFT_VERSION | ERR_STALE_FACILITY_VERSION"
    http_status: 412
    applies_to: "POST /staffing/shifts/{id}/award, POST /staffing/invoices"

  - priority: 75
    category: business_safety
    check: "credential_compliance_gate — for every credential_type in facility.required_credential_types the clinician holds a Credential of that type with status == VERIFIED"
    error_id: ERR_CREDENTIAL_MISSING
    http_status: 422
    applies_to: "POST /staffing/shifts/{id}/claims; and POST /staffing/shifts/{id}/award ONLY when claim_id is supplied (when claim_id is omitted the gate acts as an eligibility filter inside claim_award_selection and an empty pool raises ERR_NO_ELIGIBLE_CLAIM instead)"

  - priority: 76
    category: business_safety
    check: "credential_compliance_gate (expiry leg) — every required VERIFIED Credential satisfies expires_on >= shift.scheduled_end + CREDENTIAL_BUFFER_DAYS (1) days; a credential whose expires_on <= current_utc is first materialised to EXPIRED and then fails this check"
    error_id: ERR_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /staffing/shifts/{id}/claims; and POST /staffing/shifts/{id}/award ONLY when claim_id is supplied (otherwise the gate filters the candidate pool)"

  - priority: 80
    category: business_temporal
    check: "claim window is open — current_utc <= shift.scheduled_start - SHIFT_CLAIM_LOCK_HOURS (2.0) hours. Exactly at the lock instant the claim is still accepted; one second later it is refused"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /staffing/shifts/{id}/claims"

  - priority: 81
    category: business_temporal
    check: "the shift has ended — current_utc >= shift.scheduled_end"
    error_id: ERR_SHIFT_NOT_ENDED
    http_status: 422
    applies_to: "POST /staffing/assignments/{id}/timesheets"

  - priority: 82
    category: business_temporal
    check: "current_utc <= shift.scheduled_end + TIMESHEET_SUBMISSION_WINDOW_DAYS (7) days"
    error_id: ERR_TIMESHEET_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /staffing/assignments/{id}/timesheets"

  - priority: 85
    category: business_constraint
    check: "the clinician has no existing ShiftClaim on this Shift with status IN {PENDING, AWARDED}"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /staffing/shifts/{id}/claims"

  - priority: 86
    category: business_constraint
    check: "clinician_shift_overlap_gate — the target shift's HALF-OPEN interval [scheduled_start, scheduled_end) must not intersect the half-open interval of any other Shift the clinician already occupies through an Assignment with work_status IN {PENDING_CONFIRMATION, CONFIRMED, WORKED}. Back-to-back shifts (prev_end == next_start) do NOT intersect under this rule"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /staffing/shifts/{id}/claims; and POST /staffing/shifts/{id}/award ONLY when claim_id is supplied (otherwise the gate filters the candidate pool inside claim_award_selection)"

  - priority: 87
    category: business_safety
    check: "clinician_rest_gate — the gap between the target shift and every adjacent occupied shift of the same clinician (occupied = Assignment with work_status IN {PENDING_CONFIRMATION, CONFIRMED, WORKED}) is >= MIN_REST_HOURS_BETWEEN_SHIFTS (8.0) hours. A gap of exactly 8.00 hours passes"
    error_id: ERR_REST_PERIOD_VIOLATION
    http_status: 422
    applies_to: "POST /staffing/shifts/{id}/claims; and POST /staffing/shifts/{id}/award ONLY when claim_id is supplied (otherwise the gate filters the candidate pool inside claim_award_selection)"

  - priority: 88
    category: business_constraint
    check: "unit_capacity_gate — counting the shift being created, the number of Shifts of this Facility with status IN {OPEN, ASSIGNED, COMPLETED} whose CLOSED intervals [scheduled_start, scheduled_end] pairwise intersect the new shift's closed interval must not exceed Facility.unit_capacity. Touching endpoints (prev_end == next_start) DO count as intersecting under this rule"
    error_id: ERR_UNIT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /staffing/orders/{id}/shifts"

  - priority: 89
    category: business_constraint
    check: "the order's shift_count (excluding CANCELLED shifts) plus the shift being created must not exceed order.headcount"
    error_id: ERR_HEADCOUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /staffing/orders/{id}/shifts"

  - priority: 90
    category: business_fiscal
    check: "weekly_hours_gate — the clinician's total Shift.scheduled_hours over Assignments with work_status IN {PENDING_CONFIRMATION, CONFIRMED, WORKED} in the target shift's ISO week, plus the target shift's scheduled_hours, must be <= MAX_WEEKLY_SCHEDULED_HOURS (60.0). Exactly 60.00 passes"
    error_id: ERR_WEEKLY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /staffing/shifts/{id}/claims; and POST /staffing/shifts/{id}/award ONLY when claim_id is supplied (otherwise the gate filters the candidate pool inside claim_award_selection)"

  - priority: 91
    category: business_fiscal
    check: "the clinician has fewer than MAX_OPEN_CLAIMS_PER_CLINICIAN (5) ShiftClaims with status == PENDING"
    error_id: ERR_CLAIM_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /staffing/shifts/{id}/claims"

  - priority: 95
    category: business_referential
    check: "a RateCard is selectable for (facility, order.specialty, shift.scheduled_start) per rate_card_selection"
    error_id: ERR_RATE_CARD_NOT_FOUND
    http_status: 422
    applies_to: "POST /staffing/orders/{id}/shifts"

  - priority: 96
    category: business_referential
    check: "at least one VERIFIED Timesheet of the facility falls in the half-open billing period"
    error_id: ERR_NO_BILLABLE_TIMESHEETS
    http_status: 422
    applies_to: "POST /staffing/invoices"

  - priority: 97
    category: business_constraint
    check: "the requested half-open period must not intersect the period of any existing Invoice of this facility with status IN {DRAFT, ISSUED, SETTLED}"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /staffing/invoices"

  - priority: 98
    category: business_referential
    check: "claim_award_selection produced a non-empty candidate pool"
    error_id: ERR_NO_ELIGIBLE_CLAIM
    http_status: 409
    applies_to: "POST /staffing/shifts/{id}/award"

  - priority: 99
    category: business_constraint
    check: "timesheet.dispute_count < TIMESHEET_MAX_DISPUTE_ROUNDS (2)"
    error_id: ERR_DISPUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /staffing/timesheets/{id}/dispute"

  - priority: 100
    category: business_fiscal
    check: "paid_amount_cents equals invoice.bill_total_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /staffing/invoices/{id}/settle"

# ===========================================================================
# §1.5 API Endpoint Table   (api_prefix = /staffing; every path parameter is
# literally named {id} because each path carries at most one)
# ===========================================================================
endpoints:

  # ---------------------- registry / configuration ------------------------
  - method: POST
    path: "/staffing/facilities"
    description: "Register a facility with its single staffed unit, the unit's concurrency capacity, and the credential types every clinician must hold to work there."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "unit_name", "unit_capacity", "required_credential_types"]
    output: Facility
    side_effects: ["initialises pending_pay_cents, outstanding_balance_cents and lifetime_billed_cents to 0"]

  - method: GET
    path: "/staffing/facilities/{id}"
    description: "Read one facility, including the three money counters used by the billing invariants."
    roles: [PlatformAdmin, ComplianceOfficer, FacilityScheduler, FacilityVerifier, BillingAgent]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/staffing/facilities/{id}/rate-cards"
    description: "Publish a pay rate for one specialty at this facility over a half-open effectivity interval."
    roles: [PlatformAdmin, FacilityScheduler]
    code: 201
    input: ["specialty", "base_pay_rate_cents_per_hour", "effective_from", "effective_to?"]
    output: RateCard
    side_effects: ["future Shift creations under this facility+specialty select this card per rate_card_selection"]

  - method: GET
    path: "/staffing/facilities/{id}/rate-cards"
    description: "List the rate cards of a facility (reverse lookup for RateCard.facility_id)."
    roles: [PlatformAdmin, ComplianceOfficer, FacilityScheduler, FacilityVerifier, BillingAgent]
    code: 200
    input: ["specialty?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  - method: POST
    path: "/staffing/clinicians"
    description: "Register a per-diem clinician in the float pool."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "email", "specialty"]
    output: Clinician
    side_effects: ["sets status = ACTIVE, reliability_score = 100, provisional_reliability_score = 100"]

  - method: GET
    path: "/staffing/clinicians/{id}"
    description: "Read one clinician, including both reliability score variants."
    roles: [PlatformAdmin, ComplianceOfficer, FacilityScheduler, FacilityVerifier, Clinician]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: POST
    path: "/staffing/clinicians/{id}/credentials"
    description: "Attach a licence/certification to a clinician; it starts PENDING_VERIFICATION and confers no eligibility until a ComplianceOfficer verifies it."
    roles: [PlatformAdmin, Clinician]
    code: 201
    input: ["credential_type", "license_number", "issued_on", "expires_on"]
    output: Credential
    side_effects: []

  - method: GET
    path: "/staffing/clinicians/{id}/credentials"
    description: "List a clinician's credentials (reverse lookup for Credential.clinician_id). Materialises VERIFIED -> EXPIRED for any credential whose expires_on has passed on the logical clock."
    roles: [PlatformAdmin, ComplianceOfficer, FacilityScheduler, Clinician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Credential[]
    side_effects: ["lazily materialises the VERIFIED -> EXPIRED transition"]

  - method: POST
    path: "/staffing/credentials/{id}/verify"
    description: "ComplianceOfficer accepts or rejects a PENDING credential, or renews an EXPIRED one by supplying a new expires_on."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "expires_on?", "note?"]
    output: Credential
    side_effects: ["Credential PENDING_VERIFICATION -> VERIFIED|REJECTED, or EXPIRED -> VERIFIED"]

  - method: POST
    path: "/staffing/credentials/{id}/revoke"
    description: "ComplianceOfficer revokes a VERIFIED or EXPIRED credential; the clinician immediately loses eligibility everywhere that credential type is required."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason"]
    output: Credential
    side_effects: ["Credential -> REVOKED"]

  # ---------------------- orders, shifts, claims --------------------------
  - method: POST
    path: "/staffing/orders"
    description: "A facility opens a staffing order for a specialty, a headcount of slots, and a scheduling window."
    roles: [FacilityScheduler]
    code: 201
    input: ["facility_id", "specialty", "headcount", "urgency", "window_start", "window_end"]
    output: StaffingOrder
    side_effects: ["StaffingOrder created in status OPEN with all five counters at 0"]

  - method: GET
    path: "/staffing/orders/{id}"
    description: "Read one staffing order with its derived fill counters."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician, BillingAgent]
    code: 200
    input: []
    output: StaffingOrder
    side_effects: []

  - method: GET
    path: "/staffing/facilities/{id}/orders"
    description: "List a facility's staffing orders (reverse lookup for StaffingOrder.facility_id)."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, BillingAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StaffingOrder[]
    side_effects: []

  - method: POST
    path: "/staffing/orders/{id}/shifts"
    description: "Post one shift slot under an order. Selects the rate card, freezes the effective rate, and computes the ESTIMATED pay variant."
    roles: [FacilityScheduler]
    code: 201
    input: ["scheduled_start", "scheduled_end"]
    output: Shift
    side_effects:
      - "runs rate_card_selection and freezes Shift.base_pay_rate_cents_per_hour and Shift.effective_rate_cents_per_hour"
      - "runs shift_pay_amount(ESTIMATED) and freezes Shift.estimated_pay_cents"
      - "runs order_fill_posture on the parent StaffingOrder"

  - method: GET
    path: "/staffing/orders/{id}/shifts"
    description: "List the shifts of an order (reverse lookup for Shift.order_id)."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Shift[]
    side_effects: []

  - method: POST
    path: "/staffing/orders/{id}/cancel"
    description: "Cancel a whole staffing order. Fires the four-link cascade order -> shifts -> assignments -> reliability events -> clinician status."
    roles: [FacilityScheduler]
    code: 200
    input: ["reason"]
    output: StaffingOrder
    side_effects:
      - "cancels every OPEN/ASSIGNED Shift of the order"
      - "cancels every live Assignment on those shifts as CANCELLED_BY_FACILITY with pay_status WAIVED"
      - "appends a FACILITY_CANCELLATION_CREDIT ReliabilityEvent per cancelled Assignment"
      - "runs reliability_recompute for every affected Clinician, possibly reinstating SUSPENDED -> ACTIVE"
      - "declines every remaining PENDING ShiftClaim on those shifts"

  - method: GET
    path: "/staffing/shifts/{id}"
    description: "Read one shift, including claim_count, the frozen rates, the ESTIMATED pay and the version used for the award OCC check."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: POST
    path: "/staffing/shifts/{id}/claims"
    description: "A clinician self-schedules by claiming an open shift. Runs the full compliance, overlap, rest, weekly-hours and claim-quota gate stack."
    roles: [Clinician]
    code: 201
    input: ["clinician_id", "note?"]
    output: ShiftClaim
    side_effects:
      - "snapshots Clinician.reliability_score onto ShiftClaim.reliability_snapshot"
      - "recomputes Shift.claim_count and increments Shift.version by 1"

  - method: GET
    path: "/staffing/claims/{id}"
    description: "Read one shift claim."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician]
    code: 200
    input: []
    output: ShiftClaim
    side_effects: []

  - method: GET
    path: "/staffing/claims"
    description: "Filtered list of shift claims (reverse lookup for ShiftClaim.shift_id and ShiftClaim.clinician_id)."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician]
    code: 200
    input: ["shift_id?", "clinician_id?", "status?", "limit?", "offset?"]
    output: ShiftClaim[]
    side_effects: []

  - method: POST
    path: "/staffing/claims/{id}/withdraw"
    description: "A clinician withdraws a pending claim, shrinking the candidate pool and bumping the shift's version."
    roles: [Clinician]
    code: 200
    input: []
    output: ShiftClaim
    side_effects: ["ShiftClaim PENDING -> WITHDRAWN", "recomputes Shift.claim_count and increments Shift.version by 1"]

  - method: POST
    path: "/staffing/shifts/{id}/award"
    description: "The facility fills the slot. Optimistically concurrency-checked against the shift version the scheduler last observed. With claim_id the named claim is awarded; without it the server ranks the eligible pool per claim_award_selection."
    roles: [FacilityScheduler]
    code: 201
    input: ["expected_shift_version", "claim_id?"]
    output: Assignment
    side_effects:
      - "creates an Assignment in work_status PENDING_CONFIRMATION / pay_status UNBILLED with estimated_pay_cents copied from the Shift"
      - "sets replaces_assignment_id when the shift previously carried a released Assignment"
      - "ShiftClaim PENDING -> AWARDED for the winner, PENDING -> DECLINED for every sibling"
      - "Shift OPEN -> ASSIGNED"
      - "increments Shift.version by 1"
      - "runs order_fill_posture on the parent StaffingOrder"

  # ---------------------- assignments & attendance ------------------------
  - method: GET
    path: "/staffing/assignments/{id}"
    description: "Read one assignment with both of its independent state axes and both pay variants."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician, BillingAgent]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/staffing/assignments"
    description: "Filtered list of assignments (reverse lookup for Assignment.shift_id, Assignment.clinician_id, Assignment.claim_id and the self-referential Assignment.replaces_assignment_id)."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician, BillingAgent]
    code: 200
    input: ["shift_id?", "clinician_id?", "claim_id?", "replaces_assignment_id?", "work_status?", "pay_status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/staffing/assignments/{id}/confirm"
    description: "The awarded clinician confirms attendance before the shift starts."
    roles: [Clinician]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment.work_status PENDING_CONFIRMATION -> CONFIRMED; pay_status untouched"]

  - method: POST
    path: "/staffing/assignments/{id}/cancel"
    description: "Either the assigned clinician or the owning facility scheduler releases the slot. The reliability consequence depends on who cancelled and how close to the start."
    roles: [Clinician, FacilityScheduler]
    code: 200
    input: ["reason"]
    output: Assignment
    side_effects:
      - "Assignment.work_status -> CANCELLED_BY_CLINICIAN or CANCELLED_BY_FACILITY; pay_status -> WAIVED"
      - "computes cancellation_lead_hours and applies cancellation_penalty_tier"
      - "appends a ReliabilityEvent unless the clinician cancelled at >= 72.00 hours lead"
      - "runs reliability_recompute for the Clinician"
      - "Shift ASSIGNED -> OPEN and order_fill_posture recompute"

  - method: POST
    path: "/staffing/assignments/{id}/no-show"
    description: "The facility records that a confirmed clinician did not appear. Fires the three-link no-show cascade."
    roles: [FacilityVerifier]
    code: 200
    input: ["note?"]
    output: Assignment
    side_effects:
      - "Assignment.work_status CONFIRMED -> NO_SHOW; pay_status -> WAIVED"
      - "appends a NO_SHOW ReliabilityEvent (30 penalty points, adjudication_status PENDING)"
      - "runs reliability_recompute; a provisional score below 60 suspends the clinician and declines all their PENDING claims"
      - "Shift ASSIGNED -> OPEN and order_fill_posture recompute"

  # ---------------------- timesheets --------------------------------------
  - method: POST
    path: "/staffing/assignments/{id}/timesheets"
    description: "The clinician submits actual punches after the shift has ended."
    roles: [Clinician]
    code: 201
    input: ["clock_in", "clock_out", "break_minutes"]
    output: Timesheet
    side_effects:
      - "runs worked_hours_normalization and differential_hours"
      - "Assignment.work_status CONFIRMED -> WORKED and Clinician.completed_shift_count += 1"
      - "Assignment.pay_status UNBILLED -> TIMESHEET_PENDING"

  - method: GET
    path: "/staffing/assignments/{id}/timesheets"
    description: "List the timesheets of an assignment (reverse lookup for Timesheet.assignment_id)."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician, BillingAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Timesheet[]
    side_effects: []

  - method: GET
    path: "/staffing/timesheets/{id}"
    description: "Read one timesheet with its hour split and the FINAL pay variant."
    roles: [PlatformAdmin, FacilityScheduler, FacilityVerifier, Clinician, BillingAgent]
    code: 200
    input: []
    output: Timesheet
    side_effects: []

  - method: POST
    path: "/staffing/timesheets/{id}/dispute"
    description: "The facility verifier rejects the punches back to the clinician. Bounded to TIMESHEET_MAX_DISPUTE_ROUNDS rounds."
    roles: [FacilityVerifier]
    code: 200
    input: ["reason"]
    output: Timesheet
    side_effects: ["Timesheet SUBMITTED -> DISPUTED and dispute_count += 1"]

  - method: POST
    path: "/staffing/timesheets/{id}/resubmit"
    description: "The clinician corrects the punches, closing one dispute round. dispute_count is deliberately not reset."
    roles: [Clinician]
    code: 200
    input: ["clock_in", "clock_out", "break_minutes"]
    output: Timesheet
    side_effects: ["Timesheet DISPUTED -> SUBMITTED", "recomputes raw_minutes, unpaid_break_minutes, worked_hours, night_hours, weekend_hours"]

  - method: POST
    path: "/staffing/timesheets/{id}/verify"
    description: "The facility verifier accepts the punches. Runs the weekly overtime allocation and the FINAL pay variant, then fires the three-link verification cascade."
    roles: [FacilityVerifier]
    code: 200
    input: []
    output: Timesheet
    side_effects:
      - "runs weekly_overtime_allocation then shift_pay_amount(FINAL); writes overtime_hours, regular_hours, gross_pay_cents"
      - "Timesheet SUBMITTED -> VERIFIED"
      - "Assignment.pay_status TIMESHEET_PENDING -> PAYABLE and final_pay_cents set"
      - "Facility.pending_pay_cents += gross_pay_cents and Facility.version += 1"
      - "Shift ASSIGNED -> COMPLETED and order_fill_posture recompute (may CLOSE the order)"
      - "appends a SHIFT_COMPLETED credit ReliabilityEvent and runs reliability_recompute"

  # ---------------------- reliability -------------------------------------
  - method: GET
    path: "/staffing/clinicians/{id}/reliability-events"
    description: "Append-only reliability ledger of a clinician (reverse lookup for ReliabilityEvent.clinician_id)."
    roles: [PlatformAdmin, ComplianceOfficer, Clinician]
    code: 200
    input: ["event_type?", "adjudication_status?", "limit?", "offset?"]
    output: ReliabilityEvent[]
    side_effects: []

  - method: GET
    path: "/staffing/assignments/{id}/reliability-events"
    description: "Reliability events produced by one assignment (reverse lookup for ReliabilityEvent.assignment_id)."
    roles: [PlatformAdmin, ComplianceOfficer, FacilityScheduler, FacilityVerifier, Clinician]
    code: 200
    input: ["limit?", "offset?"]
    output: ReliabilityEvent[]
    side_effects: []

  - method: POST
    path: "/staffing/reliability-events/{id}/adjudicate"
    description: "A ComplianceOfficer confirms or overturns a pending penalty event. Overturning removes it from BOTH score variants and can reinstate a suspended clinician."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision"]
    output: ReliabilityEvent
    side_effects:
      - "ReliabilityEvent PENDING -> CONFIRMED|OVERTURNED"
      - "runs reliability_recompute for the Clinician, rewriting reliability_score, provisional_reliability_score and no_show_count"
      - "may move Clinician.status ACTIVE <-> SUSPENDED"

  # ---------------------- billing -----------------------------------------
  - method: POST
    path: "/staffing/invoices"
    description: "Generate a DRAFT invoice sweeping the facility's VERIFIED timesheets in a half-open period. Optimistically concurrency-checked against the facility version the biller last observed."
    roles: [BillingAgent]
    code: 201
    input: ["facility_id", "period_start", "period_end", "expected_facility_version"]
    output: Invoice
    side_effects:
      - "runs facility_markup_tier (frozen) then invoice_totals with per-line rounding"
      - "Timesheets VERIFIED -> INVOICED with invoice_id set; Assignments pay_status PAYABLE -> INVOICED"
      - "Facility.pending_pay_cents -= pay_total_cents"
      - "increments Facility.version by 1"

  - method: GET
    path: "/staffing/invoices/{id}"
    description: "Read one invoice with its frozen markup, its lines and its three money totals."
    roles: [PlatformAdmin, BillingAgent, FacilityScheduler, FacilityVerifier]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/staffing/facilities/{id}/invoices"
    description: "List a facility's invoices (reverse lookup for Invoice.facility_id)."
    roles: [PlatformAdmin, BillingAgent, FacilityScheduler, FacilityVerifier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/staffing/invoices/{id}/timesheets"
    description: "List the timesheets currently attached to an invoice (reverse lookup for Timesheet.invoice_id)."
    roles: [PlatformAdmin, BillingAgent, FacilityScheduler, FacilityVerifier]
    code: 200
    input: ["limit?", "offset?"]
    output: Timesheet[]
    side_effects: []

  - method: POST
    path: "/staffing/invoices/{id}/issue"
    description: "Issue a draft invoice to the facility, moving money onto the facility's outstanding balance and lifetime billed total."
    roles: [BillingAgent]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice DRAFT -> ISSUED with issued_by_user_id, issued_at, due_at"
      - "Facility.outstanding_balance_cents += bill_total_cents; Facility.lifetime_billed_cents += bill_total_cents; Facility.version += 1"

  - method: POST
    path: "/staffing/invoices/{id}/settle"
    description: "Record payment of an issued invoice. Segregation of duties: the settling BillingAgent must differ from the issuing one."
    roles: [BillingAgent]
    code: 200
    input: ["paid_amount_cents"]
    output: Invoice
    side_effects:
      - "Invoice ISSUED -> SETTLED"
      - "Facility.outstanding_balance_cents -= bill_total_cents; Facility.version += 1"
      - "Timesheets INVOICED -> PAID and Assignments pay_status INVOICED -> PAID"

  - method: POST
    path: "/staffing/invoices/{id}/void"
    description: "Void a draft or issued invoice, exactly reversing the issue side effects and returning every line's timesheet to the billable pool."
    roles: [BillingAgent]
    code: 200
    input: ["reason"]
    output: Invoice
    side_effects:
      - "Invoice -> VOID"
      - "when the invoice was ISSUED: Facility.outstanding_balance_cents -= bill_total_cents and Facility.lifetime_billed_cents -= bill_total_cents"
      - "Timesheets INVOICED -> VERIFIED with invoice_id cleared; Assignments pay_status INVOICED -> PAYABLE"
      - "Facility.pending_pay_cents += pay_total_cents; Facility.version += 1"

  # ---------------------- test-driving surface ----------------------------
  - method: POST
    path: "/staffing/_clock/set_current_utc"
    description: "Set the server's logical clock, which every temporal rule in this scaffold reads. Before the first call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. EVERY server-stamped timestamp in this API — created_at, updated_at, and every *_at field (claimed_at, awarded_at, confirmed_at, verified_at, occurred_at, adjudicated_at, issued_at, due_at) — is rendered from this logical clock, in ISO 8601 UTC with exactly three fractional digits, e.g. 2026-05-01T00:00:00.000Z."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["all subsequent temporal evaluations (claim window, credential expiry, cancellation lead, reliability decay, invoice due date) use the new instant"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_ROLE_SCOPE_VIOLATION
    http: 403
    condition: "a FacilityScheduler or FacilityVerifier acts on a resource belonging to a different facility"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "a Clinician acts on a credential, claim, assignment or timesheet that belongs to a different clinician"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the BillingAgent settling an invoice is the same opaque user that issued it"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required body field, wrong type, invalid enum member, out-of-range number, duplicate clinician email, or duplicate (clinician, credential_type)"
  - id: ERR_INVALID_PUNCH_INTERVAL
    http: 400
    condition: "clock_out is not strictly after clock_in, or the punched interval lies more than 4 hours outside the scheduled interval"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "facility id in path or body does not resolve"
  - id: ERR_CLINICIAN_NOT_FOUND
    http: 404
    condition: "clinician id in path or body does not resolve"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "credential id in path does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "staffing order id in path does not resolve"
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "shift id in path does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "shift claim id in path or body does not resolve, or the named claim does not belong to the path shift"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment id in path does not resolve"
  - id: ERR_TIMESHEET_NOT_FOUND
    http: 404
    condition: "timesheet id in path does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id in path does not resolve"
  - id: ERR_RELIABILITY_EVENT_NOT_FOUND
    http: 404
    condition: "reliability event id in path does not resolve"
  - id: ERR_CREDENTIAL_NOT_PENDING
    http: 409
    condition: "verify called on a credential whose status is not PENDING_VERIFICATION or EXPIRED, or revoke called on a credential whose status is not VERIFIED or EXPIRED"
  - id: ERR_ORDER_NOT_OPEN
    http: 409
    condition: "a shift is posted under, or a cancel is issued against, a StaffingOrder whose status is CLOSED or CANCELLED"
  - id: ERR_SHIFT_NOT_OPEN
    http: 409
    condition: "claim or award attempted on a Shift whose status is not OPEN"
  - id: ERR_CLAIM_NOT_PENDING
    http: 409
    condition: "withdraw or award attempted on a ShiftClaim whose status is not PENDING"
  - id: ERR_ASSIGNMENT_NOT_CONFIRMED
    http: 409
    condition: "no-show or timesheet submission attempted on an Assignment whose work_status is not CONFIRMED, or a second timesheet is submitted for the same Assignment"
  - id: ERR_ASSIGNMENT_NOT_CANCELLABLE
    http: 409
    condition: "confirm or cancel attempted on an Assignment whose work_status is already terminal"
  - id: ERR_TIMESHEET_NOT_DISPUTABLE
    http: 409
    condition: "dispute attempted on a Timesheet whose status is not SUBMITTED"
  - id: ERR_TIMESHEET_NOT_VERIFIABLE
    http: 409
    condition: "verify attempted on a Timesheet whose status is not SUBMITTED"
  - id: ERR_TIMESHEET_NOT_RESUBMITTABLE
    http: 409
    condition: "resubmit attempted on a Timesheet whose status is not DISPUTED"
  - id: ERR_INVOICE_NOT_DRAFT
    http: 409
    condition: "issue attempted on an Invoice whose status is not DRAFT"
  - id: ERR_INVOICE_NOT_ISSUED
    http: 409
    condition: "settle attempted on an Invoice whose status is not ISSUED"
  - id: ERR_INVOICE_NOT_VOIDABLE
    http: 409
    condition: "void attempted on an Invoice whose status is SETTLED or already VOID"
  - id: ERR_EVENT_ALREADY_ADJUDICATED
    http: 409
    condition: "adjudicate attempted on a ReliabilityEvent whose adjudication_status is not PENDING"
  - id: ERR_CLINICIAN_SUSPENDED
    http: 409
    condition: "the acting or targeted Clinician has status SUSPENDED"
  - id: ERR_STALE_SHIFT_VERSION
    http: 412
    condition: "expected_shift_version does not equal the shift's current version at award time"
  - id: ERR_STALE_FACILITY_VERSION
    http: 412
    condition: "expected_facility_version does not equal the facility's current version at invoice generation time"
  - id: ERR_CREDENTIAL_MISSING
    http: 422
    condition: "the clinician does not hold a VERIFIED Credential for every credential type the facility requires"
  - id: ERR_CREDENTIAL_EXPIRED
    http: 422
    condition: "a required credential exists but expires before shift.scheduled_end + CREDENTIAL_BUFFER_DAYS, or has already lapsed on the logical clock"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "the claim arrives later than SHIFT_CLAIM_LOCK_HOURS before the shift start"
  - id: ERR_SHIFT_NOT_ENDED
    http: 422
    condition: "a timesheet is submitted before the shift's scheduled_end on the logical clock"
  - id: ERR_TIMESHEET_WINDOW_CLOSED
    http: 422
    condition: "a timesheet is submitted more than TIMESHEET_SUBMISSION_WINDOW_DAYS after the shift's scheduled_end"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "the clinician already holds a PENDING or AWARDED claim on this shift"
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "the shift's half-open interval intersects another shift the clinician already occupies"
  - id: ERR_REST_PERIOD_VIOLATION
    http: 422
    condition: "the gap to an adjacent occupied shift of the same clinician is under MIN_REST_HOURS_BETWEEN_SHIFTS"
  - id: ERR_UNIT_CAPACITY_EXCEEDED
    http: 409
    condition: "the new shift's closed interval would push the facility unit's concurrent shift count above unit_capacity"
  - id: ERR_HEADCOUNT_EXCEEDED
    http: 422
    condition: "posting the shift would exceed the order's authorised headcount"
  - id: ERR_SHIFT_DURATION_INVALID
    http: 422
    condition: "shift duration is outside [MIN_SHIFT_DURATION_HOURS, MAX_SHIFT_DURATION_HOURS] or scheduled_end is not after scheduled_start"
  - id: ERR_SHIFT_OUTSIDE_ORDER_WINDOW
    http: 422
    condition: "the shift's interval is not contained in the parent order's [window_start, window_end]"
  - id: ERR_WEEKLY_HOURS_EXCEEDED
    http: 422
    condition: "the clinician's committed scheduled hours in the shift's ISO week would exceed MAX_WEEKLY_SCHEDULED_HOURS"
  - id: ERR_CLAIM_LIMIT_EXCEEDED
    http: 422
    condition: "the clinician already holds MAX_OPEN_CLAIMS_PER_CLINICIAN pending claims"
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 422
    condition: "no RateCard is selectable for the facility, specialty and shift start"
  - id: ERR_NO_ELIGIBLE_CLAIM
    http: 409
    condition: "the award candidate pool is empty after eligibility filtering"
  - id: ERR_NO_BILLABLE_TIMESHEETS
    http: 422
    condition: "no VERIFIED timesheet of the facility falls in the requested billing period"
  - id: ERR_INVOICE_PERIOD_OVERLAP
    http: 409
    condition: "the requested billing period intersects a DRAFT, ISSUED or SETTLED invoice period of the same facility"
  - id: ERR_INVOICE_PERIOD_INVALID
    http: 422
    condition: "period_end is not after period_start, or the period is longer than INVOICE_MAX_PERIOD_DAYS"
  - id: ERR_DISPUTE_LIMIT_REACHED
    http: 409
    condition: "a third dispute is attempted on the same timesheet"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents differs from the invoice's bill_total_cents"

# ===========================================================================
# §1.7 RBAC Matrix — segregation of duties
# ===========================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the staffing marketplace. Owns the registries (facilities, clinicians, rate cards) and the logical clock; deliberately has no power over orders, awards, verification or billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /staffing/facilities"
      - "POST /staffing/clinicians"
      - "POST /staffing/_clock/set_current_utc"
    shared_operations:
      - "POST /staffing/facilities/{id}/rate-cards (with FacilityScheduler)"
      - "POST /staffing/clinicians/{id}/credentials (with Clinician)"
      - "all GET endpoints except GET /staffing/facilities/{id} money counters are shared with every operational role"

  - name: ComplianceOfficer
    description: "Licensure and conduct authority. The only role that can verify, reject or revoke a credential, and the only role that can adjudicate a reliability penalty. Cannot post orders, award shifts, verify timesheets or touch money."
    identity: "opaque"
    exclusive_operations:
      - "POST /staffing/credentials/{id}/verify"
      - "POST /staffing/credentials/{id}/revoke"
      - "POST /staffing/reliability-events/{id}/adjudicate"
    shared_operations:
      - "GET /staffing/clinicians/{id}"
      - "GET /staffing/clinicians/{id}/credentials"
      - "GET /staffing/clinicians/{id}/reliability-events"

  - name: FacilityScheduler
    description: "Demand side of one facility. Posts orders and shifts and awards claims. X-User-ID is the Facility.id, so every write is scoped to that facility. Deliberately cannot verify or dispute a timesheet — attendance sign-off is a different duty."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /staffing/orders"
      - "POST /staffing/orders/{id}/shifts"
      - "POST /staffing/orders/{id}/cancel"
      - "POST /staffing/shifts/{id}/award"
    shared_operations:
      - "POST /staffing/assignments/{id}/cancel (with Clinician)"
      - "POST /staffing/facilities/{id}/rate-cards (with PlatformAdmin)"
      - "GET endpoints over its own orders, shifts, claims, assignments, timesheets and invoices"

  - name: FacilityVerifier
    description: "Attendance and timesheet sign-off for one facility. X-User-ID is the Facility.id. Segregated from FacilityScheduler: the role that fills a slot never signs off the hours worked in it."
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /staffing/assignments/{id}/no-show"
      - "POST /staffing/timesheets/{id}/dispute"
      - "POST /staffing/timesheets/{id}/verify"
    shared_operations:
      - "GET endpoints over its own facility's orders, shifts, assignments, timesheets and invoices"

  - name: Clinician
    description: "Supply side. X-User-ID is the Clinician.id. Self-schedules by claiming shifts, confirms or cancels assignments, and submits or resubmits timesheets — but can never verify their own hours."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /staffing/shifts/{id}/claims"
      - "POST /staffing/claims/{id}/withdraw"
      - "POST /staffing/assignments/{id}/confirm"
      - "POST /staffing/assignments/{id}/timesheets"
      - "POST /staffing/timesheets/{id}/resubmit"
    shared_operations:
      - "POST /staffing/clinicians/{id}/credentials (with PlatformAdmin)"
      - "POST /staffing/assignments/{id}/cancel (with FacilityScheduler)"
      - "GET endpoints over their own credentials, claims, assignments, timesheets and reliability events"

  - name: BillingAgent
    description: "Money side. Opaque operator identity, which is what makes the issue/settle segregation of duties testable: the invoice records issued_by_user_id and refuses a settlement from the same X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /staffing/invoices"
      - "POST /staffing/invoices/{id}/issue"
      - "POST /staffing/invoices/{id}/settle"
      - "POST /staffing/invoices/{id}/void"
    shared_operations:
      - "GET /staffing/invoices/{id}"
      - "GET /staffing/facilities/{id}/invoices"
      - "GET /staffing/invoices/{id}/timesheets"
      - "GET /staffing/timesheets/{id}"





