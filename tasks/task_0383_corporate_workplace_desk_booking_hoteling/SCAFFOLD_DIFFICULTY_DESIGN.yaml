  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: neighborhood_capacity_boundary_distinct_plus_one_equals_cap_allowed
        grounds:
          - calculations.neighborhood_capacity_check
          - validations[priority=14]
          - entities.Neighborhood.fields.effective_cap_seats
        distinguishing_aspect: |
          Capacity gate uses distinct_reserved + 1 <= effective_cap_seats (inclusive <=).
          With 3 seats and cap_pct 60, effective_cap_seats = ceil(1.8) = 2; with 1 seat
          already reserved (distinct=1), booking a second distinct seat gives 1+1=2 == cap,
          which is ALLOWED (not rejected). Metric: integer capacity-count threshold, on
          POST /workplace/reservations.
        test_recipe:
          setup:
            - "Floor; neighborhood cap_pct=60 with 3 seats => effective_cap_seats=2."
            - "Seat A reserved on 2026-07-01 (distinct_reserved=1)."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ11" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 11, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
