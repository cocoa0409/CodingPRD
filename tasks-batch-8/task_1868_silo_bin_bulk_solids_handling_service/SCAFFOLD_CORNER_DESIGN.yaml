      - name: safety_officer_cannot_create_ticket_forbidden
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /service-tickets is limited to PlantOperator/ServiceManager; SafetyOfficer gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Site and vessel exist."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "SO Site", state_code: "IA" }
              as: ServiceManager
              captures: { sso: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sso}", name: "BIN-SO", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vso: $.data.id }
          trigger:
            - call: "POST /service-tickets"
              payload: { site_id: "${sso}", vessel_id: "${vso}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status 403"

      - name: operator_cannot_read_other_site_vessel_forbidden
        claim_type: rbac_denial
        grounds:
          - "roles PlantOperator"
          - "validations[priority=3]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Entity-backed ownership: a PlantOperator whose X-User-ID is site A posting a reading for site B's vessel gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Sites SA and SB; vessel VB belongs to SB."]
          setup_api_calls:
