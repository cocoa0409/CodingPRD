  - section: errors
    instances:

      - name: error_pool_state_invalid_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_POOL_STATE_INVALID]
          - validations[priority=23]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / run_schedule_requires_pool_committed
          rationale: "The named §1.8 instance schedules a run against a DRAFT pool and asserts ERR_POOL_STATE_INVALID with http_status 409 before repeating the identical request against the same pool once it is COMMITTED."

      - name: error_dispense_state_invalid_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DISPENSE_STATE_INVALID]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: compensating_invariant / subsidy_ledger_money_conservation_on_dispense_void
          rationale: "The named §1.8 instance voids a fill and then voids it a second time, asserting ERR_DISPENSE_STATE_INVALID (409) so the subsidy credit cannot be applied twice."

      - name: error_run_not_release_eligible_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RUN_NOT_RELEASE_ELIGIBLE]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_release_requires_run_release_eligible
          rationale: "The named §1.8 instance attempts the release while the run's release_eligibility is BLOCKED and asserts ERR_RUN_NOT_RELEASE_ELIGIBLE, then releases successfully after the passing culture."

      - name: error_pasteurizer_slot_conflict_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PASTEURIZER_SLOT_CONFLICT]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pasteurizer_half_open_slot_with_cleaning_buffer
          rationale: "The named §1.8 instance asserts ERR_PASTEURIZER_SLOT_CONFLICT one minute inside the occupied half-open window and a 201 at the first free minute on the same pasteurizer."

      - name: error_allocation_exceeds_donation_remaining_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING]
          - validations[priority=62]
        excluded_because:
          difficulty_instance: compensating_invariant / milk_volume_conservation_across_pool_scrap_and_reallocation
          rationale: "The named §1.8 instance re-draws a scrapped donation and asserts that an over-draw returns ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING, which is how it proves the credit-back restored the exact millilitres."

  # ==========================================================================
  - section: rbac
    instances:

      - name: auth_gate_rejects_absent_headers_and_an_unknown_role_before_any_permission_check
        claim_type: authentication_required
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "The two 401 gates are decided before the endpoint's roles list is read: an absent header pair and an empty X-User-ID both return ERR_MISSING_AUTH_HEADERS, an X-User-Role of MilkBankSuperuser returns ERR_UNKNOWN_ROLE rather than the 403 ERR_ROLE_NOT_PERMITTED, and only the intact header pair reaches the handler."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z and one donor row DNR-0001 exist, so the list endpoint has something to return once a request gets past the auth gate."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
          trigger:
            - { call: "GET /milk-bank/donors", payload: {}, as: "", as_user_id: "", captures: { e1: "$.data.error_id" } }
            - { call: "GET /milk-bank/donors", payload: {}, as: MilkBankAdmin, as_user_id: "", captures: { e2: "$.data.error_id" } }
            - { call: "GET /milk-bank/donors", payload: {}, as: "MilkBankSuperuser", as_user_id: "u-admin-1", captures: { e3: "$.data.error_id" } }
            - { call: "GET /milk-bank/donors", payload: {}, as: MilkBankAdmin, as_user_id: "u-admin-1" }
          assert:
            - "${e1} == ERR_MISSING_AUTH_HEADERS with http_status 401 (both headers absent)"
            - "${e2} == ERR_MISSING_AUTH_HEADERS with http_status 401 (X-User-Role present, X-User-ID empty)"
            - "${e3} == ERR_UNKNOWN_ROLE with http_status 401"
            - "${e3} != ERR_ROLE_NOT_PERMITTED (an unrecognised role never reaches the 403 permission check)"
            - "fourth response: http_status == 200 and total_count == 1 and data[0].donor_code == DNR-0001"
            - "the three rejected requests wrote nothing: GET /milk-bank/donors as MilkBankAdmin still reports total_count == 1"

      - name: exclusive_operations_cannot_be_swapped_between_roles
        claim_type: cross_role_denial
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.MedicalDirector.exclusive_operations
          - roles.ProcessingTechnician.exclusive_operations
          - roles.Prescriber.exclusive_operations
          - roles.MilkBankAdmin.exclusive_operations
        distinguishing_aspect: "Every attempt by a role to run another role's exclusive operation is refused with a 403 that changes nothing - the intake coordinator cannot qualify a donor, file serology or open a pool, the pharmacist cannot write a prescription, the medical director cannot open a subsidy program and the technician cannot move the clock - while the rightful owner's identical call on the same donor succeeds at the end."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 sits in SCREENING with an ACCEPTED questionnaire (base 30 / screening 50), a NON_REACTIVE serology panel collected 2026-07-20 and an ACTIVE physician approval, so the only thing missing is the qualification call itself."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { e1: "$.data.error_id" } }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-08-01", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { e2: "$.data.error_id" } }
            - { call: "POST /milk-bank/pools", payload: { pool_code: "POOL-0001", target_milk_class: "TERM" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { e3: "$.data.error_id" } }
            - { call: "POST /milk-bank/prescriptions", payload: { prescription_code: "RX-0001", patient_reference: "NICU-A", patient_type: "NICU_INPATIENT", clinical_acuity: "CRITICAL", requires_preterm_milk: false, subsidy_required: false, prescribed_ml: 500, needed_by_date: "2026-09-01" }, as: DispensingPharmacist, as_user_id: "u-pharm-1", captures: { e4: "$.data.error_id" } }
            - { call: "POST /milk-bank/subsidy-programs", payload: { program_code: "SUB-0001", name: "Community Milk Fund", coverage_pct: 0.60, annual_cap_cents: 100000 }, as: MedicalDirector, as_user_id: "u-md-1", captures: { e5: "$.data.error_id" } }
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-06T08:00:00Z" }, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { e6: "$.data.error_id" } }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "${e1} == ERR_ROLE_NOT_PERMITTED with http_status 403"
            - "${e2} == ERR_ROLE_NOT_PERMITTED with http_status 403"
            - "${e3} == ERR_ROLE_NOT_PERMITTED with http_status 403"
            - "${e4} == ERR_ROLE_NOT_PERMITTED with http_status 403"
            - "${e5} == ERR_ROLE_NOT_PERMITTED with http_status 403"
            - "${e6} == ERR_ROLE_NOT_PERMITTED with http_status 403"
            - "nothing was written by the six refusals: GET /milk-bank/pools as ProcessingTechnician returns total_count == 0, GET /milk-bank/prescriptions as Prescriber returns total_count == 0, and GET /milk-bank/donors/${d1}/serology-panels still returns exactly 1 row"
            - "the clock never moved: the qualification stamped in the last call carries qualified_at == 2026-08-05T08:00:00Z"
            - "seventh response: http_status == 200 and data.status == QUALIFIED and data.qualified_by_user_id == u-md-1"
            - "Donor.${d1}.surveillance_risk_score == 30 and Donor.${d1}.screening_risk_score == 50"

      - name: donor_role_reads_only_her_own_file_and_her_lists_are_filtered_not_rejected
        claim_type: entity_backed_scope
        grounds:
          - validations[priority=4]
          - errors[ERR_DONOR_SCOPE_VIOLATION]
          - roles.Donor.identity
          - roles.Donor.shared_operations
        distinguishing_aspect: "For an entity-backed Donor identity the acting X-User-ID is the Donor row id: reading another donor's record or shipment is a 403 ERR_DONOR_SCOPE_VIOLATION, registering a cooler for another donor_id is the same 403, but the collection endpoint answers 200 with only the acting donor's shipment - filtering, not rejection."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; two donors exist and are both QUALIFIED, DNR-0001 (id captured as d1) and DNR-0002 (id captured as d2)."
            - "The intake coordinator registered one cooler for each donor: TRK-0001 for DNR-0001 and TRK-0002 for DNR-0002."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0002", full_name: "Bea Cruz", email: "bea.cruz@example.org", zone_code: "Z1" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d2: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d2}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d2}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d2}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
