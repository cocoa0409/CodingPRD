            - "RoyaltyAccrual.${acc2}.status == HELD (unchanged by the rejected validation)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_submit_requires_dsp_active
        grounds:
          - state_machines.UsageReport.DRAFT_to_SUBMITTED
          - state_machines.ServiceProvider.transitions
          - validations[priority=6]
        distinguishing_aspect: |
          Pair UsageReport -> ServiceProvider: a report whose owning DSP is
          SUSPENDED cannot be submitted; the valid next-state set of the
          report is gated by the parent's posture.
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule ACTIVE; DSP Duetify ACTIVE"
            - "Report R1 for 2026-08 SUBMITTED (prerequisite that makes the DSP suspendable)"
            - "Report R2 for 2026-08 in DRAFT with one line"
            - "DSP then SUSPENDED"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-07" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r1: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r1}/lines"
              payload: { isrc: "USAA19900041", track_title: "Sora", plays_count: 10, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r1}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-08" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r2: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r2}/lines"
              payload: { isrc: "USAA19900042", track_title: "Ruff", plays_count: 10, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/suspend"
              payload: {}
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r2}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_DSP_NOT_ACTIVE"
            - "UsageReport.${r2}.status == DRAFT (unchanged)"
            - "ServiceProvider.${dsp_id}.participation_status == SUSPENDED"

      - name: statement_finalize_requires_member_payee
        grounds:
          - state_machines.Statement.DRAFT_to_FINALIZED
          - state_machines.Payee.transitions
          - validations[priority=22]
        distinguishing_aspect: |
          Different entity pair Statement -> Payee (not involving
          ServiceProvider): finalizing a member's statement is gated on the
          member owning at least one ACTIVE Payee; with the only payee
          SUSPENDED, finalization is rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-01; member A with one Payee P (ACTIVE)"
            - "Statement S for member A, period 2026-06, DRAFT with one zero-context line"
            - "P then SUSPENDED"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/members/${m_a}/payees"
              payload: { payee_legal_name: "Alder Publishing LLC", payment_method: "ACH", routing_number: "021000021", account_number: "123456789", tax_id: "123456789" }
              as: MLCAdministrator
              captures: { p0: $.data.id }
            - call: "POST /mlc/members/${m_a}/statements"
              payload: { period_month: "2026-06" }
              as: MLCAdministrator
              captures: { st0: $.data.id }
            - call: "POST /mlc/members/${m_a}/payees/${p0}/suspend"
              payload: {}
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/members/${m_a}/statements/${st0}/finalize"
              payload: {}
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NO_ACTIVE_PAYEE"
            - "Statement.${st0}.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: share_overlap_half_open_supersede
        grounds:
          - validations[priority=11]
          - entities.WorkShare.fields.effective_from
          - entities.WorkShare.fields.supersedes_share_id
        distinguishing_aspect: |
          Half-open interval semantics on the WorkShare resource: an
          overlapping same-claimant share is rejected without
          supersedes_share_id, while an ADJACENT share (new effective_from ==
          old effective_to) is permitted because [a,b) vs [b,c) do not overlap.
        test_recipe:
          setup:
            - "Clock 2026-09-01; work 'Kestrel' v1; member A"
            - "Share S1: A 50%, [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/works"
              payload: { title: "Kestrel" }
              as: MLCAdministrator
              captures: { w0: $.data.id, w0_v: $.data.version }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", expected_work_version: "${w0_v}" }
              as: MLCAdministrator
              captures: { s1: $.data.id }
            - call: "GET /mlc/works/${w0}"
              payload: {}
              as: MLCAdministrator
              captures: { w0_v2: $.data.version }
          trigger:
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 40, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", expected_work_version: "${w0_v2}" }
              as: MLCAdministrator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 40, effective_from: "2026-07-01T00:00:00Z", expected_work_version: "${w0_v2}" }
              as: MLCAdministrator
              captures: { s2: $.data.id }
          assert:
            - "err_overlap == ERR_SHARE_OVERLAP_NEEDS_SUPERSEDE (June-August window collides with January-July)"
            - "Share ${s2} created with status ACTIVE (adjacent half-open boundary effective_from == prior effective_to is NOT an overlap)"
            - "MusicalWork.${w0}.total_share_percent == 90.0"

      - name: rate_schedule_window_adjacency
        grounds:
          - validations[priority=18]
          - entities.RateSchedule.fields.effective_from
          - entities.RateSchedule.fields.effective_to
        distinguishing_aspect: |
          Different interval semantics on a different resource: RateSchedule
          windows reject any overlap with the ACTIVE schedule but treat
          touching endpoints (new.effective_from == active.effective_to) as
          legal adjacency — an aggregate-capacity reading of the timeline
          (exactly one ACTIVE schedule at any instant) rather than the
          per-claimant supersede reading of WorkShare.
        test_recipe:
          setup:
            - "Clock 2026-09-01; schedule RS1 ACTIVE over [2026-01-01, 2027-01-01)"
            - "PENDING schedules RS2 [2026-06-01, 2028-01-01) (overlapping) and RS3 [2027-01-01, null) (adjacent)"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs1: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs1}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-06-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", rate_cents_under_5min: 135, rate_cents_per_minute_over_5min: 260 }
              as: MLCAdministrator
              captures: { rs2: $.data.id }
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2027-01-01T00:00:00Z", rate_cents_under_5min: 135, rate_cents_per_minute_over_5min: 260 }
              as: MLCAdministrator
              captures: { rs3: $.data.id }
          trigger:
            - call: "POST /mlc/rate-schedules/${rs2}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /mlc/rate-schedules/${rs3}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { err_adjacent: $.data.error_id }
          assert:
            - "err_overlap == ERR_RATE_SCHEDULE_OVERLAP"
            - "err_adjacent == ERR_RATE_SCHEDULE_NOT_YET_EFFECTIVE (the adjacent window is geometrically legal; the rejection at clock 2026-09-01 is the temporal not-yet-effective gate, proving adjacency passed the overlap check)"
            - "RateSchedule.${rs1}.status == ACTIVE (unchanged by both failed activations)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: report_split_conserves_total_cents
        grounds:
          - calculations.report_total_reconciliation
          - entities.UsageReport.fields.total_usage_cents
          - entities.UsageReport.fields.matched_usage_cents
        distinguishing_aspect: |
          Conserved quantity: UsageReport.total_usage_cents. The forward
          action (accept, partitioning lines into MATCHED/UNMATCHED) paired
          with its compensation readings (reject/reopen then resubmit/accept
          after adding a work, changing the partition) MUST leave
          matched + unmatched == total at every reading — the partition moves
          cents but never creates or destroys them.
        test_recipe:
          setup:
            - "Clock 2026-09-01; schedule ACTIVE; DSP ACTIVE"
            - "Report 2026-06 with two lines: L1 'Kestrel' 131000 cents (no work yet -> unmatched), L2 'Petrel' 13100 cents (unmatched)"
            - "After first accept: partition 0 / 144100; then register work 'Kestrel' (100% member A) and run a MatchRun; re-read the partition"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
              payload: { legal_name: "Duetify" }
              as: MLCAdministrator
              captures: { dsp_id: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/activate"
              payload: {}
              as: MLCAdministrator
              captures: { dsp_v: $.data.accepted_rate_schedule_version }
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports"
              payload: { reporting_month: "2026-06" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900001", track_title: "Kestrel", plays_count: 1000, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { l1: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900003", track_title: "Petrel", plays_count: 100, duration_seconds: 100 }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { l2: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/submit"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/accept"
              payload: { accepted_rate_schedule_version: "${dsp_v}" }
              as: MLCAdministrator
            - call: "POST /mlc/works"
              payload: { title: "Kestrel" }
              as: MLCAdministrator
              captures: { w0: $.data.id, w0_v: $.data.version }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 100, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v}" }
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/match-runs"
              payload: {}
              as: MLCAdministrator
            - call: "GET /mlc/service-providers/${dsp_id}/usage-reports/${r0}"
              payload: {}
              as: MLCAdministrator
              captures: { tot: $.data.total_usage_cents, mat: $.data.matched_usage_cents, unm: $.data.unmatched_usage_cents }
          assert:
            - "tot == 144100 at every reading (1000*131 + 100*131)"
            - "After first accept: matched_usage_cents == 0 and unmatched_usage_cents == 144100 (conserved pre-match)"
            - "After MatchRun: mat == 131000 and unm == 13100, and mat + unm == tot (compensating re-partition conserves the total)"

      - name: cycle_close_conserves_pool_cents
        grounds:
          - calculations.historical_market_share_allocation
          - entities.CycleRun.fields.pool_cents
          - entities.DistributionLine.fields.allocated_cents
        distinguishing_aspect: |
          Different conserved quantity: the distribution pool. Cycle close
          (forward sweep of expired accruals into the pool) paired with the
          waterfall allocation (compensating distribution to members) MUST
          satisfy pool_cents == sum(allocated_cents + residual_cents over
          DistributionLines) + residual_cents on the CycleRun — sweeping and
          distributing never strand or invent cents.
        test_recipe:
          setup:
            - "Clock 2026-09-01; schedule ACTIVE; DSP ACTIVE"
            - "Members A (signatory, has 100% share on matched work 'Merlin' so weight 1) and B (non-signatory, weight 1)"
            - "Report 2026-06 with line 'Merlin' matched to A (postings FINALIZED via statement) and unmatched line 'Petrel' 100100 cents -> HELD accrual expiring 2029-07-01"
            - "Clock at 2029-08-01; CycleRun 2029-08 covering [2026-06, 2026-06], MARKET_SHARE_USAGE"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
