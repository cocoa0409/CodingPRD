        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ComplaintCase.INTAKE_to_TRIAGED
          - state_machines.ProductionBatch.IN_PROCESS_to_COMPLETED
        distinguishing_aspect: |
          Consistency is immediate: the complete response body itself carries
          status COMPLETED and the computed yield_variance_pct, and the triage
          response carries the final triage_score 45.0 — a follow-up GET of
          the brand shows the recomputed complaint_score 45.0 in the same
          logical instant, with no reconciliation lag.
