scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pep_cost_provisional_vs_final_on_victim
        grounds:
          - calculations.pep_dose_projection
          - entities.PEPRecommendation.fields.projected_cost_cents
          - entities.PEPRecommendation.fields.final_cost_cents
        distinguishing_aspect: |
          On the PEPRecommendation (victim) domain: projected_cost_cents assumes the full
          4-dose regimen (120000) while final_cost_cents counts only the 2 doses actually
          administered (60000) for identical inputs — the two variants diverge.
        test_recipe:
          setup:
            - "One Owner and one identified DOG (DOMESTIC, vaccination EXPIRED)."
            - "A CATEGORY_II BiteCase for that animal -> risk_level MODERATE, pep_indication INITIATE."
            - "A PEPRecommendation created (INITIATE): projected_doses 4, projected_cost_cents 120000."
            - "Two doses administered so status is INITIATED (2 < 4)."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Ada Owner", phone: "555-0100" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "EXPIRED" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-DV1", incident_datetime: "2026-03-01T09:00:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_II", victim_name: "Vic A", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version", risk: "$.data.risk_level" }
            - call: "POST /api/v1/bite-cases/${case_id}/pep-recommendations"
              payload: { expected_bite_case_version: "${case_v}" }
              as: Epidemiologist
              captures: { pep_id: "$.data.id", projected: "$.data.projected_cost_cents" }
            - call: "POST /api/v1/pep-recommendations/${pep_id}/administer-dose"
              payload: {}
              as: Epidemiologist
          trigger:
            - call: "POST /api/v1/pep-recommendations/${pep_id}/administer-dose"
              payload: {}
              as: Epidemiologist
              captures: { final: "$.data.final_cost_cents" }
          assert:
            - "PEPRecommendation.${pep_id}.projected_cost_cents == 120000"
            - "PEPRecommendation.${pep_id}.final_cost_cents == 60000"
            - "PEPRecommendation.${pep_id}.status == INITIATED"

      - name: quarantine_boarding_estimated_vs_actual_on_owner
        grounds:
          - calculations.quarantine_boarding_cost
          - entities.QuarantineOrder.fields.boarding_cost_cents
          - state_machines.QuarantineOrder.ACTIVE_to_BREACHED
        distinguishing_aspect: |
          On the QuarantineOrder/Owner (boarding-cost) domain — a different entity domain from
          the PEP dose cost: boarding_cost_cents is ESTIMATED at 10 full days (40000) while
          ACTIVE, but recomputed to the ACTUAL 4 whole days confined (16000) after an early breach.
        test_recipe:
          setup:
            - "Owner, identified DOG owned by that owner, a FACILITY (daily_boarding_cents 4000, capacity 5)."
            - "Clock at 2026-03-01T00:00:00Z; a FACILITY QuarantineOrder issued (start 2026-03-01, scheduled_end 2026-03-11) -> ACTIVE, estimated boarding 40000."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Ben Owner", phone: "555-0101" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "North Shelter", facility_type: "SHELTER", capacity: 5, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-DV2", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "LEG", wound_category: "CATEGORY_II", victim_name: "Vic B", victim_age: 42, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id", est_boarding: "$.data.boarding_cost_cents" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HealthDeptAdmin
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/breach"
              payload: {}
              as: AnimalControlOfficer
              captures: { actual_boarding: "$.data.boarding_cost_cents" }
          assert:
            - "QuarantineOrder.${order_id}.boarding_cost_cents == 40000 while ACTIVE (estimated, captured as est_boarding)"
            - "QuarantineOrder.${order_id}.boarding_cost_cents == 16000 after breach (actual: 4 whole days * 4000)"
            - "QuarantineOrder.${order_id}.status == BREACHED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_level_nonlinear_branch_mode_a
        grounds:
          - calculations.risk_level
          - entities.BiteCase.fields.risk_level
          - entities.BiteCase.fields.pep_indication
        distinguishing_aspect: |
          Mode (a): risk_level has >=3 inputs (wound_category, species/animal_class,
          vaccination_status) with non-linear branching — a CURRENT-vaccinated observable
          domestic dog yields LOW even at CATEGORY_III, because the vaccination/availability
          branch overrides wound severity.
        test_recipe:
          setup:
            - "An identified DOG (DOMESTIC, vaccination CURRENT)."
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CF1", incident_datetime: "2026-03-01T10:00:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_III", victim_name: "Vic C", victim_age: 55, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", risk: "$.data.risk_level", pep_ind: "$.data.pep_indication" }
          assert:
            - "BiteCase.${case_id}.risk_level == LOW"
            - "BiteCase.${case_id}.pep_indication == DEFER"

      - name: citation_fine_per_line_rounding_mode_b
        grounds:
          - calculations.citation_fine_total
          - entities.Citation.fields.total_fine_cents
          - entities.Citation.fields.base_fine_cents
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned to round-per-violation-then-sum. For
          violations [NO_CURRENT_VACCINATION(25025), UNLICENSED_ANIMAL(15075)] at 8.5%,
          per-line rounding gives 27152 + 16356 = 43508, whereas sum-then-round gives 43509;
          the scaffold pins 43508.
        test_recipe:
          setup:
            - "An Owner and a CATEGORY_I BiteCase (no animal) to attach the citation to."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Cara Owner", phone: "555-0102" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CF2", incident_datetime: "2026-03-01T11:00:00Z", exposure_type: "SCRATCH", body_site: "HAND", wound_category: "CATEGORY_I", victim_name: "Vic D", victim_age: 20 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/citations"
              payload: { owner_id: "${owner_id}", case_id: "${case_id}", violations: ["NO_CURRENT_VACCINATION", "UNLICENSED_ANIMAL"] }
              as: AnimalControlOfficer
              captures: { cit_id: "$.data.id", total: "$.data.total_fine_cents" }
          assert:
            - "Citation.${cit_id}.base_fine_cents == 40100"
            - "Citation.${cit_id}.total_fine_cents == 43508"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quarantine_order_branching_divergent_side_effects
        grounds:
          - state_machines.QuarantineOrder.ACTIVE_to_BREACHED
          - state_machines.QuarantineOrder.ACTIVE_to_COMPLETED
          - state_machines.QuarantineOrder.ACTIVE_to_CONVERTED_TO_SPECIMEN
        distinguishing_aspect: |
          QuarantineOrder is a branching fork ACTIVE -> {COMPLETED, BREACHED,
          CONVERTED_TO_SPECIMEN} with divergent side-effect sets: the BREACHED branch issues
          a Citation and flags animal-control, whereas COMPLETED releases the animal — proving
          the machine is non-linear.
        test_recipe:
          setup:
            - "Owner, owned DOG, FACILITY; a FACILITY QuarantineOrder ACTIVE."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Dan Owner", phone: "555-0103" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "NONE" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "East Clinic", facility_type: "VET_CLINIC", capacity: 3, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-SM1", incident_datetime: "2026-03-01T07:00:00Z", exposure_type: "BITE", body_site: "FOOT", wound_category: "CATEGORY_II", victim_name: "Vic E", victim_age: 61, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/breach"
              payload: {}
              as: AnimalControlOfficer
          assert:
            - "QuarantineOrder.${order_id}.status == BREACHED"
            - "Owner.${owner_id}.compliance_status == DELINQUENT (BREACHED branch issued a Citation; the COMPLETED branch would not)"
            - "Animal.${animal_id}.control_status == DISPATCH_REQUESTED"

      - name: pep_recommendation_branching_supersede
        grounds:
          - state_machines.PEPRecommendation.RECOMMENDED_to_SUPERSEDED
          - state_machines.PEPRecommendation.RECOMMENDED_to_INITIATED
          - concurrency_rules[pep-recommendation-supersede-stale-case]
        distinguishing_aspect: |
          PEPRecommendation (a different entity from QuarantineOrder) is also non-linear:
          RECOMMENDED branches to {INITIATED, SUPERSEDED, NOT_INDICATED}. Creating a newer
          recommendation drives the prior one to terminal SUPERSEDED while the new one is RECOMMENDED.
        test_recipe:
          setup:
            - "A CATEGORY_II BiteCase for an identified DOG (EXPIRED) -> INITIATE."
            - "A first PEPRecommendation (RECOMMENDED)."
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "EXPIRED" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-SM2", incident_datetime: "2026-03-01T12:00:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_II", victim_name: "Vic F", victim_age: 33, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/bite-cases/${case_id}/pep-recommendations"
              payload: { expected_bite_case_version: "${case_v}" }
              as: Epidemiologist
              captures: { pep1_id: "$.data.id" }
            - call: "GET /api/v1/bite-cases/${case_id}"
              payload: {}
              as: Epidemiologist
              captures: { case_v2: "$.data.version" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/pep-recommendations"
              payload: { expected_bite_case_version: "${case_v2}" }
              as: Epidemiologist
              captures: { pep2_id: "$.data.id" }
          assert:
            - "PEPRecommendation.${pep1_id}.status == SUPERSEDED"
            - "PEPRecommendation.${pep2_id}.status == RECOMMENDED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lab_positive_cascade_depth4
        grounds:
          - state_machines.Specimen.SUBMITTED_to_RESULTED
          - state_machines.BiteCase.LAB_PENDING_to_CONFIRMED_RABID
          - calculations.surveillance_positive_rollup
          - entities.SurveillanceRegion.fields.alert_status
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the previous: report-result POSITIVE mutates the
          Specimen (RESULTED); that drives BiteCase -> CONFIRMED_RABID; that increments the
          matched SurveillanceRegion.confirmed_positive_count; that recompute flips
          alert_status to OUTBREAK.
        test_recipe:
          setup:
            - "A SurveillanceRegion RB-CASC1 with positive_threshold 1."
            - "A DOG marked EUTHANIZED; a BiteCase in region RB-CASC1 for it; a SATISFACTORY Specimen (case now LAB_PENDING)."
          setup_api_calls:
            - call: "POST /api/v1/surveillance-regions"
              payload: { region_code: "RB-CASC1", positive_threshold: 1 }
              as: HealthDeptAdmin
              captures: { region_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "UNKNOWN" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/animals/${animal_id}/disposition"
              payload: { disposition: "EUTHANIZED" }
              as: AnimalControlOfficer
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CASC1", incident_datetime: "2026-03-01T06:00:00Z", exposure_type: "BITE", body_site: "HEAD_NECK", wound_category: "CATEGORY_III", victim_name: "Vic G", victim_age: 8, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases/${case_id}/specimens"
              payload: { animal_id: "${animal_id}", collected_datetime: "2026-03-01T06:30:00Z", condition: "SATISFACTORY" }
              as: Veterinarian
              captures: { spec_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/specimens/${spec_id}/report-result"
              payload: { test_method: "DFA", result: "POSITIVE" }
              as: Veterinarian
          assert:
            - "Specimen.${spec_id}.status == RESULTED"
            - "BiteCase.${case_id}.status == CONFIRMED_RABID"
            - "SurveillanceRegion.${region_id}.confirmed_positive_count == 1"
            - "SurveillanceRegion.${region_id}.alert_status == OUTBREAK"

      - name: quarantine_breach_cascade_depth3
        grounds:
          - state_machines.QuarantineOrder.ACTIVE_to_BREACHED
          - entities.Owner.fields.outstanding_fines_cents
          - entities.Owner.fields.compliance_status
          - entities.Animal.fields.control_status
        distinguishing_aspect: |
          A different trigger (breach, not lab-result): breach mutates the QuarantineOrder
          (BREACHED); that issues a Citation; that raises Owner.outstanding_fines_cents and
          flips compliance_status to DELINQUENT; that flips Animal.control_status to
          DISPATCH_REQUESTED — each link caused by the prior.
        test_recipe:
          setup:
            - "Owner, owned DOG, FACILITY; clock 2026-03-01; a FACILITY QuarantineOrder ACTIVE."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Eve Owner", phone: "555-0104" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "NONE" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "West Shelter", facility_type: "SHELTER", capacity: 4, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CASC2", incident_datetime: "2026-03-01T05:00:00Z", exposure_type: "BITE", body_site: "LEG", wound_category: "CATEGORY_II", victim_name: "Vic H", victim_age: 47, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/breach"
              payload: {}
              as: AnimalControlOfficer
          assert:
            - "QuarantineOrder.${order_id}.status == BREACHED"
            - "Owner.${owner_id}.outstanding_fines_cents == 54250"
            - "Owner.${owner_id}.compliance_status == DELINQUENT"
            - "Animal.${animal_id}.control_status == DISPATCH_REQUESTED"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: safety_outranks_state_on_complete
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - errors[ERR_ANIMAL_SYMPTOMATIC]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair business_safety(priority 20) vs state(priority 30): a complete
          call targeting an already-CONVERTED_TO_SPECIMEN order AND carrying observation_outcome
          SYMPTOMATIC fails both, and the higher-priority safety check wins -> ERR_ANIMAL_SYMPTOMATIC.
        test_recipe:
          setup:
            - "Owner, owned DOG, FACILITY; clock 2026-03-01; a FACILITY QuarantineOrder issued then CONVERTED_TO_SPECIMEN (now terminal)."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Fay Owner", phone: "555-0105" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "NONE" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "South Clinic", facility_type: "VET_CLINIC", capacity: 3, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-PP1", incident_datetime: "2026-03-01T04:00:00Z", exposure_type: "BITE", body_site: "TORSO", wound_category: "CATEGORY_III", victim_name: "Vic I", victim_age: 12, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-orders/${order_id}/convert-to-specimen"
              payload: { collected_datetime: "2026-03-03T00:00:00Z", condition: "SATISFACTORY" }
              as: Veterinarian
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/complete"
              payload: { observation_outcome: "SYMPTOMATIC" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_ANIMAL_SYMPTOMATIC"

      - name: referential_outranks_fiscal_on_pay
        grounds:
          - validations[priority=60]
          - validations[priority=70]
          - errors[ERR_NOT_CITATION_OWNER]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          A different error-category pair business_referential(priority 60) vs
          business_fiscal(priority 70): a pay call by the wrong Owner AND with a wrong
          payment_amount_cents fails both, and referential wins -> ERR_NOT_CITATION_OWNER.
        test_recipe:
          setup:
            - "Two Owners; a CATEGORY_I BiteCase; a Citation owned by owner1 (total_fine_cents 43508)."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Gina Owner", phone: "555-0106" }
              as: IntakeOfficer
              captures: { owner1_id: "$.data.id" }
            - call: "POST /api/v1/owners"
              payload: { full_name: "Hank Owner", phone: "555-0107" }
              as: IntakeOfficer
              captures: { owner2_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-PP2", incident_datetime: "2026-03-01T03:00:00Z", exposure_type: "SCRATCH", body_site: "HAND", wound_category: "CATEGORY_I", victim_name: "Vic J", victim_age: 25 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
            - call: "POST /api/v1/citations"
              payload: { owner_id: "${owner1_id}", case_id: "${case_id}", violations: ["NO_CURRENT_VACCINATION", "UNLICENSED_ANIMAL"] }
              as: AnimalControlOfficer
              captures: { cit_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/citations/${cit_id}/pay"
              payload: { payment_amount_cents: 1 }
              as: Owner
              as_user_id: "${owner2_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 403"
            - "response error_id == ERR_NOT_CITATION_OWNER"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quarantine_completion_10day_boundary
        grounds:
          - validations[priority=40]
          - entities.QuarantineOrder.fields.scheduled_end_date
          - errors[ERR_QUARANTINE_NOT_ELAPSED]
        distinguishing_aspect: |
          Metric = elapsed observation days on the complete endpoint; boundary is inclusive
          (>=). At 2026-03-10T23:59:59Z completion is rejected (ERR_QUARANTINE_NOT_ELAPSED);
          at exactly scheduled_end 2026-03-11T00:00:00Z it succeeds.
        test_recipe:
          setup:
            - "Owner, owned DOG, FACILITY; clock 2026-03-01; a FACILITY QuarantineOrder ACTIVE (scheduled_end 2026-03-11T00:00:00Z)."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Ivy Owner", phone: "555-0108" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "Central Shelter", facility_type: "SHELTER", capacity: 5, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-BND1", incident_datetime: "2026-03-01T02:00:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_II", victim_name: "Vic K", victim_age: 39, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T23:59:59Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/quarantine-orders/${order_id}/complete"
              payload: { observation_outcome: "HEALTHY" }
              as: Veterinarian
              captures: { err_early: "$.data.error_id" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/quarantine-orders/${order_id}/complete"
              payload: { observation_outcome: "HEALTHY" }
              as: Veterinarian
              captures: { final_status: "$.data.status" }
          assert:
            - "first complete (at 2026-03-10T23:59:59Z) error_id == ERR_QUARANTINE_NOT_ELAPSED (409)"
            - "second complete (at 2026-03-11T00:00:00Z) -> QuarantineOrder.${order_id}.status == COMPLETED"

      - name: surveillance_outbreak_count_boundary
        grounds:
          - calculations.surveillance_positive_rollup
          - entities.SurveillanceRegion.fields.confirmed_positive_count
          - entities.SurveillanceRegion.fields.alert_status
        distinguishing_aspect: |
          A different metric (confirmed positive count) reached through a different endpoint
          (report-result): with positive_threshold 2, one positive leaves alert_status
          ELEVATED (1 < 2); the second positive reaches the inclusive boundary (2 >= 2) -> OUTBREAK.
        test_recipe:
          setup:
            - "SurveillanceRegion RB-BND2 threshold 2; a first EUTHANIZED-animal case in RB-BND2 already reported POSITIVE (count 1, ELEVATED)."
            - "A second EUTHANIZED animal, a second RB-BND2 case, and a second SATISFACTORY Specimen (case LAB_PENDING)."
          setup_api_calls:
            - call: "POST /api/v1/surveillance-regions"
              payload: { region_code: "RB-BND2", positive_threshold: 2 }
              as: HealthDeptAdmin
              captures: { region_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "FOX", animal_class: "WILD", identified: true, vaccination_status: "NONE" }
              as: IntakeOfficer
              captures: { animal1_id: "$.data.id" }
            - call: "POST /api/v1/animals/${animal1_id}/disposition"
              payload: { disposition: "EUTHANIZED" }
              as: AnimalControlOfficer
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-BND2", incident_datetime: "2026-03-01T01:00:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_III", victim_name: "Vic L", victim_age: 50, animal_id: "${animal1_id}" }
              as: IntakeOfficer
              captures: { case1_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases/${case1_id}/specimens"
              payload: { animal_id: "${animal1_id}", collected_datetime: "2026-03-01T01:30:00Z", condition: "SATISFACTORY" }
              as: Veterinarian
              captures: { spec1_id: "$.data.id" }
            - call: "POST /api/v1/specimens/${spec1_id}/report-result"
              payload: { test_method: "DFA", result: "POSITIVE" }
              as: Veterinarian
            - call: "POST /api/v1/animals"
              payload: { species: "SKUNK", animal_class: "WILD", identified: true, vaccination_status: "NONE" }
              as: IntakeOfficer
              captures: { animal2_id: "$.data.id" }
            - call: "POST /api/v1/animals/${animal2_id}/disposition"
              payload: { disposition: "EUTHANIZED" }
              as: AnimalControlOfficer
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-BND2", incident_datetime: "2026-03-01T01:05:00Z", exposure_type: "BITE", body_site: "LEG", wound_category: "CATEGORY_III", victim_name: "Vic M", victim_age: 44, animal_id: "${animal2_id}" }
              as: IntakeOfficer
              captures: { case2_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases/${case2_id}/specimens"
              payload: { animal_id: "${animal2_id}", collected_datetime: "2026-03-01T01:35:00Z", condition: "SATISFACTORY" }
              as: Veterinarian
              captures: { spec2_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/specimens/${spec2_id}/report-result"
              payload: { test_method: "DFA", result: "POSITIVE" }
              as: Veterinarian
          assert:
            - "SurveillanceRegion.${region_id}.confirmed_positive_count == 2"
            - "SurveillanceRegion.${region_id}.alert_status == OUTBREAK"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_cleared_depends_on_quarantine_completed
        grounds:
          - state_machines.BiteCase.OBSERVATION_PENDING_to_CLEARED
          - state_machines.QuarantineOrder.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Entity pair BiteCase <- QuarantineOrder: the BiteCase only reaches CLEARED as the
          bubble-up side effect of its QuarantineOrder reaching COMPLETED; before completion
          the case stays OBSERVATION_PENDING.
        test_recipe:
          setup:
            - "Owner, owned DOG, FACILITY; clock 2026-03-01; FACILITY QuarantineOrder ACTIVE, case OBSERVATION_PENDING; clock advanced to 2026-03-11."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Jo Owner", phone: "555-0109" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "CAT", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "Harbor Shelter", facility_type: "SHELTER", capacity: 5, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CE1", incident_datetime: "2026-03-01T00:30:00Z", exposure_type: "BITE", body_site: "FOOT", wound_category: "CATEGORY_II", victim_name: "Vic N", victim_age: 29, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: HealthDeptAdmin
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/complete"
              payload: { observation_outcome: "HEALTHY" }
              as: Veterinarian
          assert:
            - "QuarantineOrder.${order_id}.status == COMPLETED"
            - "BiteCase.${case_id}.status == CLEARED"
            - "Animal.${animal_id}.status == RELEASED"

      - name: pep_discontinue_depends_on_animal_cleared
        grounds:
          - state_machines.PEPRecommendation.INITIATED_to_DISCONTINUED
          - validations[priority=25]
          - errors[ERR_ANIMAL_NOT_CLEARED]
        distinguishing_aspect: |
          A different entity pair PEPRecommendation <- Animal: discontinuation is blocked while
          the case's Animal is not RELEASED and no NEGATIVE specimen exists -> ERR_ANIMAL_NOT_CLEARED,
          even though the PEP is validly INITIATED.
        test_recipe:
          setup:
            - "A CATEGORY_II case for an identified DOG (EXPIRED) -> INITIATE; a PEPRecommendation with one dose administered (INITIATED); the animal is still REPORTED (not cleared)."
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "EXPIRED" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CE2", incident_datetime: "2026-03-01T00:20:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_II", victim_name: "Vic O", victim_age: 36, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/bite-cases/${case_id}/pep-recommendations"
              payload: { expected_bite_case_version: "${case_v}" }
              as: Epidemiologist
              captures: { pep_id: "$.data.id" }
            - call: "POST /api/v1/pep-recommendations/${pep_id}/administer-dose"
              payload: {}
              as: Epidemiologist
          trigger:
            - call: "POST /api/v1/pep-recommendations/${pep_id}/discontinue"
              payload: {}
              as: Epidemiologist
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_ANIMAL_NOT_CLEARED"
            - "PEPRecommendation.${pep_id}.status == INITIATED (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: animal_single_occupancy_overlap_rejected
        grounds:
          - validations[priority=45]
          - errors[ERR_ANIMAL_QUARANTINE_OVERLAP]
          - entities.QuarantineOrder.fields.scheduled_end_date
        distinguishing_aspect: |
          Single-occupancy interval semantics on the Animal resource: a second order for the
          same animal whose [start, scheduled_end) window overlaps an existing ACTIVE order is
          rejected (ERR_ANIMAL_QUARANTINE_OVERLAP); adjacency (new.start == old.end) would be allowed.
        test_recipe:
          setup:
            - "One identified DOG; a FACILITY order for it 2026-03-01..2026-03-11 ACTIVE; a second OPEN case referencing the same animal."
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "Bay Shelter", facility_type: "SHELTER", capacity: 5, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-TO1", incident_datetime: "2026-03-01T00:10:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_II", victim_name: "Vic P", victim_age: 22, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case1_id: "$.data.id", case1_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case1_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case1_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order1_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-TO1", incident_datetime: "2026-03-02T00:10:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_II", victim_name: "Vic P2", victim_age: 23, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case2_id: "$.data.id", case2_v: "$.data.version" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case2_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case2_v}", animal_id: "${animal_id}", order_type: "HOME_CONFINEMENT", start_date: "2026-03-05T00:00:00Z" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_ANIMAL_QUARANTINE_OVERLAP"

      - name: facility_capacity_aggregate_overlap_rejected
        grounds:
          - validations[priority=50]
          - errors[ERR_FACILITY_AT_CAPACITY]
          - entities.QuarantineFacility.fields.capacity
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the QuarantineFacility resource (distinct
          from Animal single-occupancy): with capacity 1, a second FACILITY order for a
          DIFFERENT animal whose window overlaps an existing ACTIVE order at that facility is
          rejected (ERR_FACILITY_AT_CAPACITY).
        test_recipe:
          setup:
            - "A FACILITY with capacity 1; animal A confined there 2026-03-01..2026-03-11 (occupancy 1); a second animal B and its OPEN case."
          setup_api_calls:
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "Tiny Clinic", facility_type: "VET_CLINIC", capacity: 1, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animalA_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "CAT", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animalB_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-TO2", incident_datetime: "2026-03-01T00:05:00Z", exposure_type: "BITE", body_site: "LEG", wound_category: "CATEGORY_II", victim_name: "Vic Q", victim_age: 31, animal_id: "${animalA_id}" }
              as: IntakeOfficer
              captures: { caseA_id: "$.data.id", caseA_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${caseA_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${caseA_v}", animal_id: "${animalA_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { orderA_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-TO2", incident_datetime: "2026-03-01T00:06:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_II", victim_name: "Vic R", victim_age: 34, animal_id: "${animalB_id}" }
              as: IntakeOfficer
              captures: { caseB_id: "$.data.id", caseB_v: "$.data.version" }
          trigger:
            - call: "POST /api/v1/bite-cases/${caseB_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${caseB_v}", animal_id: "${animalB_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-05T00:00:00Z" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_FACILITY_AT_CAPACITY"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: facility_occupancy_conserved_on_issue_then_complete
        grounds:
          - entities.QuarantineFacility.fields.current_occupancy
          - state_machines.QuarantineOrder.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = facility occupancy COUNT, pinned as
          current_occupancy == count(QuarantineOrder where facility_id==F and status==ACTIVE).
          Issue (+1) then complete (-1) returns current_occupancy to its pre-issue value of 0.
        test_recipe:
          setup:
            - "A FACILITY capacity 5 occupancy 0; owned DOG; clock 2026-03-01; a FACILITY order issued (occupancy 1); clock advanced to 2026-03-11."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Kim Owner", phone: "555-0110" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "Grand Shelter", facility_type: "SHELTER", capacity: 5, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CI1", incident_datetime: "2026-03-01T00:03:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_II", victim_name: "Vic S", victim_age: 27, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id", occ_after_issue: "$.data.status" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: HealthDeptAdmin
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/complete"
              payload: { observation_outcome: "HEALTHY" }
              as: Veterinarian
          assert:
            - "QuarantineFacility.${facility_id}.current_occupancy == 1 while the order is ACTIVE"
            - "QuarantineFacility.${facility_id}.current_occupancy == 0 after completion (invariant restored)"

      - name: owner_fine_balance_conserved_on_issue_then_dismiss
        grounds:
          - entities.Owner.fields.outstanding_fines_cents
          - state_machines.Citation.CONTESTED_to_DISMISSED
          - state_machines.Citation.ISSUED_to_CONTESTED
        distinguishing_aspect: |
          A different conserved quantity = owner MONETARY balance, pinned as
          outstanding_fines_cents == sum(total_fine_cents for owned Citations in {ISSUED,CONTESTED,UPHELD}).
          Issue (+43508) then dismiss (-43508) returns the balance to 0 and compliance to COMPLIANT.
        test_recipe:
          setup:
            - "An Owner; a CATEGORY_I case; a Citation (total 43508) issued then contested; owner outstanding 43508."
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Lee Owner", phone: "555-0111" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-CI2", incident_datetime: "2026-03-01T00:02:00Z", exposure_type: "SCRATCH", body_site: "HAND", wound_category: "CATEGORY_I", victim_name: "Vic T", victim_age: 19 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
            - call: "POST /api/v1/citations"
              payload: { owner_id: "${owner_id}", case_id: "${case_id}", violations: ["NO_CURRENT_VACCINATION", "UNLICENSED_ANIMAL"] }
              as: AnimalControlOfficer
              captures: { cit_id: "$.data.id" }
            - call: "POST /api/v1/citations/${cit_id}/contest"
              payload: { reason: "disputed" }
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /api/v1/citations/${cit_id}/resolve"
              payload: { resolution: "DISMISSED" }
              as: Epidemiologist
          assert:
            - "Owner.${owner_id}.outstanding_fines_cents == 43508 after issuance"
            - "Owner.${owner_id}.outstanding_fines_cents == 0 after dismissal (invariant restored)"
            - "Owner.${owner_id}.compliance_status == COMPLIANT after dismissal"
