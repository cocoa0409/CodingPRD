      - name: catalog_rejection_cycle_resubmits_and_enforces_gtin_and_shelf_life
        claim_type: cyclic
        grounds:
          - state_machines.Item.INCOMPLETE_to_SUBMITTED
          - state_machines.Item.SUBMITTED_to_REJECTED
          - state_machines.Item.REJECTED_to_SUBMITTED
          - state_machines.Item.SUBMITTED_to_VALIDATED
          - errors.ERR_CATALOG_GTIN_MISMATCH
          - errors.ERR_CATALOG_SHELF_LIFE_TOO_SHORT
        distinguishing_aspect: |
          The catalog loop INCOMPLETE→SUBMITTED→REJECTED→SUBMITTED→VALIDATED is
          the one cycle in the scaffold with NO iteration cap, and each traversal
          re-runs both data guards: gtin14 must equal '00' + upc (422
          ERR_CATALOG_GTIN_MISMATCH) and shelf_life_days must be >= 30 (422
          ERR_CATALOG_SHELF_LIFE_TOO_SHORT). catalog_submission_round counts the
          traversals while catalog_reject_reason is cleared on each resubmission.
        test_recipe:
          setup:
            - "Retailer BIGMART (needed only as the RetailerBuyer identity for catalog decisions, which are chain-agnostic); principal NWF in PROSPECT; item I1 with upc 011111000001 in catalog_state INCOMPLETE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
