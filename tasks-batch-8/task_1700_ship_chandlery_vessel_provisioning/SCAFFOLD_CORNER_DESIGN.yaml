      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check (even on a nonexistent resource id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /chandlery/vessel-calls/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
              captures: { errN: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth, priority 1, beats the 404)"

      - name: existence_beats_state_on_unknown_quotation_accept
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]", "errors[ERR_QUOTATION_NOT_FOUND]"]
        distinguishing_aspect: "Accept on a nonexistent quotation id returns ERR_QUOTATION_NOT_FOUND (existence, priority 3), never a state error — pinning that existence is checked before state."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /chandlery/quotations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { errO: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTATION_NOT_FOUND"

