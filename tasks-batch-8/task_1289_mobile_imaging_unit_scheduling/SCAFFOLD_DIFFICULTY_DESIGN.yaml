      - name: route_stipend_per_leg_rounding_order
        grounds:
          - calculations.route_travel_stipend
          - entities.TransportLeg.fields.stipend_cents
          - entities.RoutePlan.fields.total_travel_stipend_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-per-leg-then-sum.
          Two legs at 10.01 miles each: per-leg round_half_up(10.01*67)=671 twice, total 1342;
          sum-then-round would give round_half_up(20.02*67)=1341. Distinct mode from the
          tiered-formula (a) and circular-order (c) instances.
        test_recipe:
          setup:
            - "One published week plan with a single site day and two transport legs of 10.01 miles each (overnight false)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsDirector }
            - { call: "POST /api/facilities", payload: { name: "Hospital A", address: "1 A St", supported_modalities: ["CT"], pad_amps_available: 150, pad_voltage: 480, pad_level_tolerance_deg: 2.0 }, as: OperationsDirector, captures: { fac_a: $.data.id } }
