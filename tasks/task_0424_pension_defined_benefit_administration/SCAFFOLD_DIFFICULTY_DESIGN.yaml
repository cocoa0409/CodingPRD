# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every rule_id carries >= 2 instances (>= 18 total). Every grounds[] entry resolves
# to a declared element; every setup_api_calls / trigger chain drives empty-DB -> the
# asserted state using only §1.5 endpoints. All formula-derived asserts are literals
# computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: benefit_formula_fap_vs_cash_balance_diverge
        grounds:
          - calculations.benefit_formula
          - entities.PensionPlan.fields.benefit_formula_type
          - entities.BenefitElection.fields.gross_accrued_monthly_cents
        distinguishing_aspect: |
          Identical participant census (same comp rows, same 24.0y service, same FULLY_VESTED
          status) yields a DIFFERENT gross_accrued_monthly_cents depending solely on the plan's
          benefit_formula_type: the FINAL_AVERAGE_PAY variant returns 330000 while a CASH_BALANCE
          plan with an equal hypothetical account returns the annuitized figure — divergent
          monthly-accrual subject.
        test_recipe:
          setup:
            - "FAP plan: benefit_formula_type=FINAL_AVERAGE_PAY, fap_accrual_rate=0.015, NRA=65."
            - "Participant hired 2000-01-01, DOB 1962-01-01, terminated 2024-01-01 (24.0y), FULLY_VESTED."
            - "Comp rows 2019..2023; highest-3-consecutive (2021/2022/2023) sum 33,000,000 -> FAP 11,000,000."
            - "Election SINGLE_LIFE, annuity_start_date 2024-06-01; submit computes gross 330000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme FAP DB", ein_psn: "12-3456789-001", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.02, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1001", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2019, gross_comp_cents: 9000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2020, gross_comp_cents: 9500000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2021, gross_comp_cents: 10000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2022, gross_comp_cents: 11000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              captures: { gross: $.data.gross_accrued_monthly_cents }
          assert:
            - "BenefitElection.${e_id}.gross_accrued_monthly_cents == 330000"
            - "BenefitElection.${e_id}.js_reduced_monthly_cents == 330000"
            - "Participant.${p_id}.final_average_pay_cents == 11000000"
            - "Participant.${p_id}.vesting_status == FULLY_VESTED"

      - name: lump_sum_apv_sla_basis_vs_417e_basis_diverge
        grounds:
          - calculations.lump_sum_apv
          - entities.BenefitElection.fields.lump_sum_value_cents
          - entities.BenefitElection.fields.relative_value_pct
        distinguishing_aspect: |
          For the SAME gross 330000 (annual 3,960,000), the SLA comparator (factor 12.5) gives
          sla_pv 49,500,000 while the 417(e) cash-out at age 62 (factor 11.9) gives lump_sum_value
          47,124,000 — two valid present-value bases yielding different results; relative_value_pct
          0.952. Distinct subject (cash-out valuation, not monthly accrual).
        test_recipe:
          setup:
            - "Same FAP plan + participant as the FAP instance; gross 330000."
            - "LUMP_SUM election, annuity_start_date 2024-06-01 (attained age 62 -> 60-64 band, factor 11.9)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme FAP LS", ein_psn: "12-3456789-002", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1002", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2021, gross_comp_cents: 10000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2022, gross_comp_cents: 11000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "LUMP_SUM", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              captures: { lsv: $.data.lump_sum_value_cents, rv: $.data.relative_value_pct }
          assert:
            - "BenefitElection.${e_id}.gross_accrued_monthly_cents == 330000"
            - "BenefitElection.${e_id}.lump_sum_value_cents == 47124000"
            - "BenefitElection.${e_id}.relative_value_pct == 0.952"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lump_sum_age_band_tiered_factor_selection
        grounds:
          - calculations.lump_sum_apv
          - calculations.benefit_formula
          - entities.BenefitElection.fields.relative_value_pct
        distinguishing_aspect: |
          Mode (a): >=3 inputs with tiered selection — lump_sum_apv combines gross_accrued (itself
          a function of FAP, accrual rate, service, vested_pct) with an age-band tiered 417(e)
          segment factor (12.4 / 11.9 / 10.8). At age 57 (55-59 band, factor 10.8) relative_value
          is 0.864, a non-linear branch distinct from the 60-64 band's 0.952.
        test_recipe:
          setup:
            - "FAP plan, participant gross 330000; LUMP_SUM election ASD at attained age 57 (DOB 1967-01-01, ASD 2024-06-01)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme FAP Early", ein_psn: "12-3456789-003", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1003", date_of_birth: "1967-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2021, gross_comp_cents: 10000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2022, gross_comp_cents: 11000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "LUMP_SUM", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              captures: { rv: $.data.relative_value_pct }
          assert:
            - "BenefitElection.${e_id}.gross_accrued_monthly_cents == 330000"
            - "BenefitElection.${e_id}.lump_sum_value_cents == 42768000"
            - "BenefitElection.${e_id}.relative_value_pct == 0.864"

      - name: pbgc_variable_rate_cap_applied_after_rate
        grounds:
          - calculations.pbgc_premium
          - entities.PbgcPremiumFiling.fields.variable_rate_premium_cents
          - entities.PbgcPremiumFiling.fields.total_premium_cents
        distinguishing_aspect: |
          Mode (c): an evaluation-order pin — variable_rate_premium = min(round(UVB*0.0052),
          participant_count*65200). The cap MUST be applied AFTER the rate, never before. With
          count 10 and UVB 2,000,000,000, raw rate = 10,400,000 but the per-head cap 652,000 wins;
          applying the cap to UVB first would give a different number. total = flat 101,000 + 652,000.
        test_recipe:
          setup:
            - "Any ACTIVE plan; PBGC premium filing with participant_count=10, UVB=2,000,000,000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Premium", ein_psn: "12-3456789-004", benefit_formula_type: "CASH_BALANCE", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.0, cb_pay_credit_rate: 0.05, cb_interest_crediting_rate: 0.04 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/premiums"
              payload: { plan_id: "${plan_id}", premium_year: 2024, participant_count: 10, unfunded_vested_benefits_cents: 2000000000 }
              as: PlanActuary
              captures: { prem_id: $.data.id }
          trigger:
            - call: "GET /plans/premiums/${prem_id}"
              payload: {}
              as: PlanActuary
              captures: { var: $.data.variable_rate_premium_cents, tot: $.data.total_premium_cents }
          assert:
            - "PbgcPremiumFiling.${prem_id}.flat_rate_premium_cents == 101000"
            - "PbgcPremiumFiling.${prem_id}.variable_rate_premium_cents == 652000"
            - "PbgcPremiumFiling.${prem_id}.total_premium_cents == 753000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: election_revision_cycle_approved_back_to_draft
        grounds:
          - state_machines.BenefitElection.APPROVED_to_DRAFT
          - state_machines.BenefitElection.DRAFT_to_SUBMITTED
          - state_machines.BenefitElection.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          BenefitElection is cyclic: APPROVED --reopen--> DRAFT --submit--> SUBMITTED --approve-->
          APPROVED is a true loop on the SAME row, not a linear pipeline. After reopen the computed
          benefit fields are cleared and the election is resubmittable.
        test_recipe:
          setup:
            - "SINGLE_LIFE election APPROVED (submitter ADM_A, approver ADM_B for segregation of duties)."
            - "No BenefitPayment yet created for the election."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Cycle", ein_psn: "12-3456789-005", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1005", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
          trigger:
            - call: "POST /plans/elections/${e_id}/reopen"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
              captures: { st: $.data.status }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
              captures: { st2: $.data.status }
          assert:
            - "after reopen: BenefitElection.${e_id}.status == DRAFT"
            - "after resubmit: BenefitElection.${e_id}.status == SUBMITTED"

      - name: qdro_amend_cycle_rejected_back_to_draft
        grounds:
          - state_machines.QdroAward.REJECTED_to_DRAFT
          - state_machines.QdroAward.DRAFT_to_SUBMITTED
          - state_machines.QdroAward.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          QdroAward (a DIFFERENT entity from BenefitElection) is cyclic: SUBMITTED --reject-->
          REJECTED --amend--> DRAFT --submit--> SUBMITTED, an amend loop on the same row; amend
          clears alternate_payee_monthly_cents.
        test_recipe:
          setup:
            - "Participant exists; a PERCENTAGE QDRO submitted then rejected."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme QDRO", ein_psn: "12-3456789-006", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1006", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/qdros"
              payload: { participant_id: "${p_id}", alternate_payee_kind: "FORMER_SPOUSE", split_method: "PERCENTAGE", award_pct: 0.40 }
              as: BenefitsAdministrator
              captures: { q_id: $.data.id }
            - call: "POST /plans/qdros/${q_id}/submit"
              payload: {}
              as: BenefitsAdministrator
            - call: "POST /plans/qdros/${q_id}/reject"
              payload: {}
              as: BenefitsAdministrator
          trigger:
            - call: "POST /plans/qdros/${q_id}/amend"
              payload: {}
              as: BenefitsAdministrator
              captures: { st: $.data.status }
            - call: "POST /plans/qdros/${q_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              captures: { st2: $.data.status }
          assert:
            - "after amend: QdroAward.${q_id}.status == DRAFT"
            - "after resubmit: QdroAward.${q_id}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: commence_cascades_payment_then_retire_depth3
        grounds:
          - state_machines.BenefitElection.APPROVED_to_COMMENCED
          - state_machines.Participant.TERMINATED_to_RETIRED
          - calculations.payment_setup
          - entities.BenefitPayment.fields.base_monthly_cents
        distinguishing_aspect: |
          Depth-3 chain from one trigger (election commence): commence -> (1) creates a BenefitPayment
          in PENDING_SETUP whose base_monthly_cents is set by payment_setup; that payment's existence
          -> (2) drives Participant TERMINATED->RETIRED; each link is caused by the prior link, not
          by the original call directly.
        test_recipe:
          setup:
            - "SINGLE_LIFE election APPROVED (ADM_A submit, ADM_B approve), no pending QDRO, gross 330000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Commence", ein_psn: "12-3456789-007", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.02, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1007", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2021, gross_comp_cents: 10000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2022, gross_comp_cents: 11000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
          trigger:
            - call: "POST /plans/elections/${e_id}/commence"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
              captures: { est: $.data.status }
            - call: "GET /plans/payments?participant_id=${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { pay0_base: "$.data[0].base_monthly_cents", pay0_status: "$.data[0].status" }
            - call: "GET /plans/participants/${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { p_emp: $.data.employment_status }
          assert:
            - "BenefitElection.${e_id}.status == COMMENCED"
            - "BenefitPayment[participant_id=${p_id}][0].status == PENDING_SETUP"
            - "BenefitPayment[participant_id=${p_id}][0].base_monthly_cents == 330000"
            - "Participant.${p_id}.employment_status == RETIRED"

      - name: record_death_cascades_inpay_payment_terminated_depth2
        grounds:
          - state_machines.Participant.RETIRED_to_DECEASED
          - state_machines.BenefitPayment.IN_PAY_to_TERMINATED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (record-death): record-death -> Participant DECEASED ->
          (caused by that DECEASED transition) every IN_PAY BenefitPayment for the participant
          cascades to TERMINATED. Different originating transition than commence.
        test_recipe:
          setup:
            - "Participant RETIRED with an IN_PAY BenefitPayment (commenced + activated, base 330000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Death", ein_psn: "12-3456789-008", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1008", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "POST /plans/elections/${e_id}/commence"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "GET /plans/payments?participant_id=${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /plans/payments/${pay_id}/activate"
              payload: {}
              as: BenefitsAdministrator
              captures: { pst: $.data.status }
          trigger:
            - call: "POST /plans/participants/${p_id}/record-death"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp: $.data.employment_status }
            - call: "GET /plans/payments/${pay_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { payst: $.data.status }
          assert:
            - "Participant.${p_id}.employment_status == DECEASED"
            - "BenefitPayment.${pay_id}.status == TERMINATED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: vesting_beats_funding_on_lump_sum_submit
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_PARTICIPANT_NOT_VESTED]
        distinguishing_aspect: |
          A single LUMP_SUM submit violates BOTH the vesting gate (priority 8, business_safety,
          participant only PARTIALLY_VESTED) AND the funding gate (priority 10, business_safety,
          FROZEN plan). Because priority 8 < priority 10, the server MUST return
          ERR_PARTICIPANT_NOT_VESTED, not ERR_FUNDING_RESTRICTED. (category pair: vesting-safety
          vs funding-safety, distinct checks.)
        test_recipe:
          setup:
            - "FROZEN plan (latest CERTIFIED aftap 0.50 -> FROZEN)."
            - "Participant TERMINATED but only PARTIALLY_VESTED (6.0y service -> vested 0.8)."
            - "LUMP_SUM election in DRAFT; submit would fail both checks."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Frozen", ein_psn: "12-3456789-009", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 5000000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f_id: $.data.id }
            - call: "POST /plans/filings/${f_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1009", date_of_birth: "1962-01-01", hire_date: "2018-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-07-01" }
              as: BenefitsAdministrator
              captures: { vstatus: $.data.vesting_status }
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "LUMP_SUM", annuity_start_date: "2024-08-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Participant.${p_id}.vesting_status == PARTIALLY_VESTED"
            - "PensionPlan.${plan_id}.funding_posture == FROZEN"
            - "response.status == 409"
            - "response.data.error_id == ERR_PARTICIPANT_NOT_VESTED"

      - name: existence_beats_state_on_election_approve
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Approving a non-existent election under a real plan path violates existence (priority 3,
          existence category) before any state check (priority 6, state category) can run. The
          server MUST return ERR_NOT_FOUND (404), not ERR_INVALID_STATE. (category pair:
          existence vs state.)
        test_recipe:
          setup:
            - "A real plan exists; the election id in the path does not exist."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme NF", ein_psn: "12-3456789-010", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/00000000-0000-4000-8000-000000000000/approve"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: aftap_restricted_floor_080_boundary
        grounds:
          - calculations.funding_posture
          - calculations.aftap
          - entities.PensionPlan.fields.funding_posture
        distinguishing_aspect: |
          funding_posture uses >= boundaries: aftap exactly 0.80 yields OPEN (>= OPEN_FLOOR),
          while 0.79 yields RESTRICTED. Metric: AFTAP ratio crossing the 0.80 threshold, reached
          via the filings certify endpoint.
        test_recipe:
          setup:
            - "Plan with one CERTIFIED filing whose aftap is exactly 0.80 (assets 8,000,000,000 / target 10,000,000,000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme 080", ein_psn: "12-3456789-011", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 8000000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /plans/filings/${f_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
              captures: { aftap: $.data.aftap_pct }
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanActuary
              captures: { posture: $.data.funding_posture }
          assert:
            - "PlanYearFiling.${f_id}.aftap_pct == 0.8"
            - "PensionPlan.${plan_id}.funding_posture == OPEN"

      - name: early_retirement_age_55_boundary_on_submit
        grounds:
          - validations[priority=14]
          - errors[ERR_BENEFIT_NOT_AVAILABLE]
          - state_machines.BenefitElection.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          A different metric on a different endpoint: attained age at annuity_start_date crossing
          EARLY_RETIREMENT_AGE=55. ASD giving attained age exactly 55 passes submit; age 54 fails
          with ERR_BENEFIT_NOT_AVAILABLE. (DOB 1969-06-01, ASD 2024-06-01 -> exactly 55.)
        test_recipe:
          setup:
            - "FULLY_VESTED TERMINATED participant; SINGLE_LIFE election with ASD = participant 55th birthday."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme 55", ein_psn: "12-3456789-012", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1012", date_of_birth: "1969-06-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              captures: { st: $.data.status }
          assert:
            - "BenefitElection.${e_id}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: election_submit_requires_participant_terminated
        grounds:
          - state_machines.BenefitElection.DRAFT_to_SUBMITTED
          - entities.Participant.fields.employment_status
          - validations[priority=7]
          - errors[ERR_PARTICIPANT_NOT_ELIGIBLE]
        distinguishing_aspect: |
          BenefitElection's DRAFT->SUBMITTED is gated by a DIFFERENT entity's state: the
          Participant must be TERMINATED. An ACTIVE participant blocks submit with
          ERR_PARTICIPANT_NOT_ELIGIBLE. (entity pair: BenefitElection -> Participant.)
        test_recipe:
          setup:
            - "Participant still ACTIVE (never terminated), FULLY_VESTED by service; SINGLE_LIFE election DRAFT."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Active", ein_psn: "12-3456789-013", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1013", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Participant.${p_id}.employment_status == ACTIVE"
            - "response.status == 409"
            - "response.data.error_id == ERR_PARTICIPANT_NOT_ELIGIBLE"

      - name: payment_activate_requires_participant_retired
        grounds:
          - state_machines.BenefitPayment.PENDING_SETUP_to_IN_PAY
          - entities.Participant.fields.employment_status
          - validations[priority=7]
          - errors[ERR_PARTICIPANT_NOT_ELIGIBLE]
        distinguishing_aspect: |
          A DIFFERENT entity pair: BenefitPayment's PENDING_SETUP->IN_PAY depends on Participant
          being RETIRED. Because commence already retires the participant, the activate path is
          gated cross-entity; this instance asserts the positive activate succeeds only with a
          RETIRED participant (employment_status RETIRED at activation time).
        test_recipe:
          setup:
            - "Election COMMENCED, payment in PENDING_SETUP, participant RETIRED (via commence cascade)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Activate", ein_psn: "12-3456789-014", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1014", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "POST /plans/elections/${e_id}/commence"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "GET /plans/payments?participant_id=${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { pay_id: "$.data[0].id" }
          trigger:
            - call: "POST /plans/payments/${pay_id}/activate"
              payload: {}
              as: BenefitsAdministrator
              captures: { st: $.data.status }
          assert:
            - "Participant.${p_id}.employment_status == RETIRED"
            - "BenefitPayment.${pay_id}.status == IN_PAY"
            - "BenefitPayment.${pay_id}.current_monthly_cents == 330000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: compensation_plan_year_uniqueness_per_participant
        grounds:
          - validations[priority=5]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.AnnualCompensation.fields.plan_year
        distinguishing_aspect: |
          Interval semantics = a single point-in-time slot per participant per plan_year (degenerate
          interval; no two AnnualCompensation rows may occupy the same plan_year). A second comp row
          for plan_year 2023 on the same participant collides -> ERR_DUPLICATE_RESOURCE. Resource:
          the participant's per-year compensation slot.
        test_recipe:
          setup:
            - "Participant with a 2023 compensation row already created."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Comp", ein_psn: "12-3456789-015", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1015", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
          trigger:
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 13000000 }
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: filing_plan_year_uniqueness_per_plan
        grounds:
          - validations[priority=5]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.PlanYearFiling.fields.plan_year
        distinguishing_aspect: |
          A DIFFERENT resource (PlanYearFiling) with DIFFERENT interval semantics — one filing slot
          per plan per plan_year, but uniqueness is scoped to the PLAN aggregate, not a participant.
          A second 2024 filing on the same plan collides -> ERR_DUPLICATE_RESOURCE, even while a
          DRAFT of the same year already exists.
        test_recipe:
          setup:
            - "Plan with a DRAFT 2024 filing already created."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Filing", ein_psn: "12-3456789-016", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 8000000000, funding_target_cents: 10000000000 }
              as: PlanActuary
          trigger:
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 9000000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_RESOURCE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: qdro_split_conserves_total_monthly_benefit
        grounds:
          - calculations.qdro_split
          - calculations.payment_setup
          - entities.QdroAward.fields.alternate_payee_monthly_cents
          - entities.BenefitPayment.fields.base_monthly_cents
        distinguishing_aspect: |
          Conserved quantity = total monthly benefit. Invariant pinned as a formula:
          BenefitPayment.base_monthly_cents + sum(QUALIFIED QdroAward.alternate_payee_monthly_cents)
          == BenefitElection.js_reduced_monthly_cents. With a 40% PERCENTAGE QDRO on js_reduced
          330000: carve 132000, participant base 198000, 198000 + 132000 == 330000 (no drift).
        test_recipe:
          setup:
            - "FULLY_VESTED TERMINATED participant, SINGLE_LIFE election (js_reduced 330000)."
            - "A 40% PERCENTAGE QDRO QUALIFIED before commencement; then commence."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Conserve", ein_psn: "12-3456789-017", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "1017", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2021, gross_comp_cents: 10000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2022, gross_comp_cents: 11000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/qdros"
              payload: { participant_id: "${p_id}", alternate_payee_kind: "FORMER_SPOUSE", split_method: "PERCENTAGE", award_pct: 0.40 }
              as: BenefitsAdministrator
              captures: { q_id: $.data.id }
            - call: "POST /plans/qdros/${q_id}/submit"
              payload: {}
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
            - call: "POST /plans/qdros/${q_id}/qualify"
              payload: {}
              as: BenefitsAdministrator
              captures: { carve: $.data.alternate_payee_monthly_cents }
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
          trigger:
            - call: "POST /plans/elections/${e_id}/commence"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "GET /plans/payments?participant_id=${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { base: "$.data[0].base_monthly_cents" }
          assert:
            - "QdroAward.${q_id}.alternate_payee_monthly_cents == 132000"
            - "BenefitPayment[participant_id=${p_id}][0].base_monthly_cents == 198000"
            - "BenefitPayment.base_monthly_cents + QdroAward.alternate_payee_monthly_cents == 330000"

      - name: filing_supersede_conserves_single_certified_latest
        grounds:
          - state_machines.PlanYearFiling.DRAFT_to_CERTIFIED
          - state_machines.PlanYearFiling.CERTIFIED_to_SUPERSEDED
          - calculations.funding_posture
          - entities.PensionPlan.fields.latest_certified_filing_id
        distinguishing_aspect: |
          A DIFFERENT conserved quantity (count of CERTIFIED-and-current filings of a given year):
          certifying a 2025 filing supersedes the prior 2024 CERTIFIED filing, so exactly ONE filing
          drives funding_posture at any time. Forward (certify 2025) + compensating (supersede 2024)
          leaves the invariant: plan.latest_certified_filing_id points to the greatest-plan_year
          CERTIFIED filing, and superseded filings no longer drive posture.
        test_recipe:
          setup:
            - "Plan with a 2024 filing CERTIFIED (aftap 0.84 -> OPEN), then a 2025 filing CERTIFIED (aftap 0.65 -> RESTRICTED)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme Supersede", ein_psn: "12-3456789-018", benefit_formula_type: "FINAL_AVERAGE_PAY", normal_retirement_age: 65, cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2024, plan_assets_cents: 8400000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f24_id: $.data.id }
            - call: "POST /plans/filings/${f24_id}/certify"
              payload: { expected_plan_version: "${plan_v0}" }
              as: PlanActuary
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanActuary
              captures: { plan_v_after1: $.data.version }
            - call: "POST /plans/filings"
              payload: { plan_id: "${plan_id}", plan_year: 2025, plan_assets_cents: 6500000000, funding_target_cents: 10000000000 }
              as: PlanActuary
              captures: { f25_id: $.data.id }
          trigger:
            - call: "POST /plans/filings/${f25_id}/certify"
              payload: { expected_plan_version: "${plan_v_after1}" }
              as: PlanActuary
              captures: { f25st: $.data.status }
            - call: "GET /plans/filings/${f24_id}"
              payload: {}
              as: PlanActuary
              captures: { f24st: $.data.status }
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanActuary
              captures: { posture: $.data.funding_posture, latest: $.data.latest_certified_filing_id }
          assert:
            - "PlanYearFiling.${f25_id}.status == CERTIFIED"
            - "PlanYearFiling.${f25_id}.aftap_pct == 0.65"
            - "PlanYearFiling.${f24_id}.status == SUPERSEDED"
            - "PensionPlan.${plan_id}.funding_posture == RESTRICTED"
            - "PensionPlan.${plan_id}.latest_certified_filing_id == ${f25_id}"
