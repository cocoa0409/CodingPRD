  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: trueup_band_boundary_at_exactly_one_thousand_cents_is_inclusive
        grounds:
          - calculations.table_minimum_trueup
          - entities.TableTier.fields.minimum_bill_cents
          - entities.VenueLedgerEntry.fields.amount_cents
          - validations[priority=7]
        distinguishing_aspect: "A numeric threshold crossing on a different metric from the counter boundary — the shortfall band edge. A 1000-cent shortfall is inclusive in band 1 (factor 0.50, band_cents 500, true-up 500) while a 1001-cent shortfall falls to band 2 (factor 0.60, band_cents 600.60, true-up 625), so the ledger amount jumps by 125 cents across a single cent of shortfall."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with a T4 tier of minimum 14000, a T2 tier of minimum 8000, one T4 table and one T2 table, two chefs, and two parties."
          setup_api_calls:
            - *c_clock
            - *c_venue
            - *c_tier6
            - *c_tier4
            - *c_tier2
            - *c_table1
            - *c_table2
            - *c_table3
            - *c_chef1
            - *c_chef2
            - *c_party_plat
            - *c_party_gold
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold_id}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-03T18:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
