  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_billed_disputed_superseded_reaudit_cycle
        grounds:
          - state_machines.AuditWorkOrder.BILLED_to_DISPUTED
          - state_machines.AuditWorkOrder.DISPUTED_to_SUPERSEDED_BY_REAUDIT
          - state_machines.AuditResult.DISPUTED_to_SUPERSEDED
        distinguishing_aspect: |
          AuditWorkOrder has a cyclic aggregate shape: BILLED -> DISPUTED -> SUPERSEDED_BY_REAUDIT spawns a fresh
          REAUDIT work order (status SELECTED, reaudit_of_work_order_id pointing back), so the policy re-enters the
          audit pipeline rather than following a one-way pipeline.
        test_recipe:
          setup:
            - "WC policy WC-600 (CA): estimated premium 600000, minimum 10000, payroll estimate 100000, mod 1.20, class code 8810 -> VOLUNTARY_REPORT; allocation 95000 VERIFIED; result ISSUED at 2026-08-15 with earned 45600 and a RETURN_PREMIUM_CREDIT billing of 554400"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-600", insured_name: "Zeta", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.20, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 95000, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/issue-result", payload: {}, as: AuditManager, as_user_id: "mgr-1" }
            - { call: "GET /audit-results/${res}/billing-transactions", payload: {}, as: AuditManager, captures: { bill: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: AuditManager }
            - { call: "POST /audit-results/${res}/disputes", payload: { grounds: "PAYROLL_ERROR" }, as: Insured, as_user_id: "${pol}", captures: { dsp: "$.data.id" } }
            - { call: "POST /disputes/${dsp}/start-review", payload: {}, as: AuditManager, as_user_id: "mgr-2" }
          trigger:
            - { call: "POST /disputes/${dsp}/uphold", payload: {}, as: AuditManager, as_user_id: "mgr-2" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_status: "$.data.status" } }
            - { call: "GET /audit-work-orders/${wo}/reaudits", payload: {}, as: AuditManager, captures: { re_type: "$.data[0].audit_type", re_status: "$.data[0].status", re_of: "$.data[0].reaudit_of_work_order_id", re_run: "$.data[0].selection_run_id" } }
            - { call: "GET /audit-results/${res}", payload: {}, as: AuditManager, captures: { res_status: "$.data.status" } }
            - { call: "GET /billing-transactions/${bill}", payload: {}, as: AuditManager, captures: { bill_status: "$.data.status" } }
          assert:
            - "AuditWorkOrder.${wo}.status == SUPERSEDED_BY_REAUDIT"
            - "AuditResult.${res}.status == SUPERSEDED"
            - "BillingTransaction.${bill}.status == CANCELLED (compensation for the superseded result)"
            - "exactly one re-audit work order exists: audit_type == REAUDIT, status == SELECTED, reaudit_of_work_order_id == ${wo}, selection_run_id == null"

      - name: appointment_no_show_reschedule_cycle_with_cap
        grounds:
          - state_machines.AuditAppointment.SCHEDULED_to_NO_SHOW
          - state_machines.AuditWorkOrder.APPOINTMENT_SCHEDULED_to_APPOINTMENT_SCHEDULED
          - entities.AuditWorkOrder.fields.no_show_count
        distinguishing_aspect: |
          AuditAppointment loops SCHEDULED -> NO_SHOW -> (new appointment) SCHEDULED on the same work order, bounded
          by no_show_count: two cycles succeed, the third creation is rejected with ERR_RESCHEDULE_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "WC policy WC-700 (CA): estimated premium 2000000, minimum 100000, payroll estimate 100000, mod 1.00, class code 8810 -> PHYSICAL work order, assigned auditor, in RECORDS_REQUESTED"
          setup_api_calls:
