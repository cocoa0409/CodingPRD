            - call: POST /race-results
              payload: { race_edition_id: "${ed_id}", invitation_id: "${invA_id}", gun_seconds: 7400, net_seconds: 7398 }
              as: TechnicalOfficial
              captures: { resA_id: "$.data.id" }
            - call: POST /race-results
              payload: { race_edition_id: "${ed_id}", invitation_id: "${invB_id}", gun_seconds: 7500, net_seconds: 7498 }
              as: TechnicalOfficial
              captures: { resB_id: "$.data.id" }
          trigger:
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
              captures: { err1: "$.data.error_id" }
            - call: POST /race-results/${resA_id}/certify
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
              captures: { err2: "$.data.error_id" }
            - call: POST /race-results/${resB_id}/certify
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
              captures: { ed_v: "$.data.version" }
            - call: POST /race-editions/${ed_id}/settle-purse
              as: FinanceOfficer
              captures: { err3: "$.data.error_id" }
            - call: POST /race-editions/${ed_id}/compute-awards
              payload: { expected_race_edition_version: "${ed_v}" }
              as: FinanceOfficer
            - call: POST /race-editions/${ed_id}/settle-purse
              as: FinanceOfficer
              captures: { err4: "$.data.error_id" }
