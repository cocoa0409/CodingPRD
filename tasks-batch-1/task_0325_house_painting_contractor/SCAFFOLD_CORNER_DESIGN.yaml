            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v1}", reason: "first", action: "ADD_SURFACE", new_label: "Study", new_surface_kind: "INTERIOR", new_area_sqft: 300, new_coats: 2, new_prep_level: "HEAVY", new_paint_product_id: "${p1}" }
              as: Estimator
              captures: { co1: $.data.id }
            - call: "POST /painting/change-orders/${co1}/submit"
              payload: {}
              as: Estimator
            - call: "POST /painting/change-orders/${co1}/approve"
              payload: {}
