  # --- Computed / aggregated reads ---
  - method: GET
    path: "/tours/{tourId}/pnl"
    description: "Computed tour P&L: projected vs settled"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: { projected_gross_cents: integer, projected_cost_cents: integer, settled_gross_cents: integer, settled_cost_cents: integer }
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/shows/{showId}/day-sheet"
    description: "Computed day sheet: show + packet + legs + budget rollup"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: { show_id: string, daysheet_issued: boolean, packet_revision: integer, budget_total_cents: integer }
    side_effects: []

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z (before any set_current_utc call, the logical clock reads exactly this default and MUST NOT fall back to wall-clock)."
    roles: [TourManager]
    code: 200
    input: [to_iso8601]
    output: object
    side_effects:
      - "Triggers hold_expiry_check sweep"
      - "Triggers Tour ON_SALE → IN_PROGRESS transition when threshold crossed"
      - "Triggers routing_leg rest-day rechecks"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not authorized for this operation"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required fields, wrong types"

  - id: ERR_REFERENTIAL_INTEGRITY
    http: 422
    condition: "Request-body FK (market_id, venue_id, related_show_id) does not resolve within the same tour"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a permissible state for the requested transition"

  - id: ERR_TOUR_NOT_PLANNING
    http: 409
    condition: "start-routing requires Tour.status == PLANNING"

  - id: ERR_TOUR_UNSTAGED
    http: 409
    condition: "start-routing requires at least one Market and one Venue"

  - id: ERR_NO_CONFIRMED_SHOWS
    http: 409
    condition: "open-on-sale requires >= 1 CONFIRMED show"

  - id: ERR_POSTURE_NOT_OPEN
    http: 409
    condition: "Operation requires Tour.posture == OPEN"

  - id: ERR_POSTURE_FROZEN
    http: 409
    condition: "Operation blocked because Tour.posture == FROZEN"

  - id: ERR_VENUE_UNAVAILABLE
    http: 409
    condition: "show_date not in venue.available_dates or already booked"

  - id: ERR_ON_SALE_LEAD_VIOLATED
    http: 409
    condition: "show_date - on_sale_at < MIN_ON_SALE_LEAD_DAYS"

  - id: ERR_RADIUS_CONFLICT
    http: 409
    condition: "Radius-clause sweep produced a CRITICAL conflict"

  - id: ERR_REST_VIOLATION
    http: 409
    condition: "Crew rest-day requirement violated by locked leg"

  - id: ERR_LEG_UNANCHORED
    http: 409
    condition: "Routing leg's origin/destination markets contain no CONFIRMED show"

  - id: ERR_LEG_NOT_YET
    http: 409
    condition: "Cannot complete a leg before its travel_date"

  - id: ERR_SHOW_NOT_PERFORMED
    http: 409
    condition: "Settlement submit requires Show.status == PERFORMED"

  - id: ERR_SHOW_NOT_YET
    http: 409
    condition: "Cannot mark performed before show_date end-of-day UTC"

  - id: ERR_ADVANCE_INCOMPLETE
    http: 409
    condition: "Advance packet has a section not APPROVED (or immigration NOT_REQUIRED)"

  - id: ERR_COUNTER_LIMIT
    http: 409
    condition: "Hold has reached MAX_COUNTER_ROUNDS"

  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "Logical clock >= hold_expires_at"

  - id: ERR_MATERIAL_VARIANCE
    http: 409
    condition: "Settlement variance_flag == MATERIAL"

  - id: ERR_BUDGET_OVERRUN
    http: 402
    condition: "Committed actual costs exceed the tour's per-show budget cap"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Settlement submitter and verifier must be different X-User-ID"

  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Unique-key violation (territory_rank, leg_index, or venue name within market)"

  - id: ERR_SHOWS_PENDING
    http: 409
    condition: "Tour has shows in non-terminal status blocking transition"

  - id: ERR_SETTLEMENTS_OPEN
    http: 409
    condition: "Tour has settlement rows not in PAID state"

  - id: ERR_HOLDS_OUTSTANDING
    http: 409
    condition: "Tour has ACTIVE ComplianceHold rows blocking close"

  - id: ERR_STALE_TOUR_VERSION
    http: 412
    condition: "OCC: expected_tour_version does not match Tour.version"

  - id: ERR_STALE_SHOW_VERSION
    http: 412
    condition: "OCC: expected_show_version does not match Show.version"

  - id: ERR_STALE_PACKET_REVISION
    http: 412
    condition: "OCC: expected_packet_revision does not match AdvancePacket.packet_revision"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TourManager
    description: "Owns the tour lifecycle: routing, holds response, advance submission, budget, marketing"
    identity: opaque
    exclusive_operations:
      - "POST /tours"
      - "POST /tours/{id}/start-routing"
      - "POST /tours/{id}/open-on-sale"
      - "POST /tours/{id}/enter-settlement-review"
      - "POST /tours/{id}/close"
      - "POST /tours/{id}/markets"
      - "POST /tours/{id}/venues"
      - "POST /tours/{id}/routing-legs (+lock/complete/cancel)"
      - "POST /tours/{id}/shows"
      - "POST /tours/{id}/shows/{sid}/confirm"
      - "POST /tours/{id}/shows/{sid}/advance"
      - "POST /tours/{id}/shows/{sid}/mark-performed"
      - "POST /tours/{id}/shows/{sid}/cancel"
      - "POST /tours/{id}/shows/{sid}/holds/{hid}/respond-counter"
      - "POST /tours/{id}/shows/{sid}/advance-packet/sections/{s}/submit"
      - "POST /tours/{id}/shows/{sid}/budget-lines (+PATCH)"
      - "POST /tours/{id}/shows/{sid}/marketing-spends"
      - "POST /tours/{id}/compliance-holds (+resolve)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Promoter
    description: "Promoter company representative; owns holds and settlement submission"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{id}/shows/{sid}/holds"
      - "POST /tours/{id}/shows/{sid}/holds/{hid}/counter"
      - "POST /tours/{id}/shows/{sid}/holds/{hid}/accept"
      - "POST /tours/{id}/shows/{sid}/holds/{hid}/reject"
      - "POST /tours/{id}/shows/{sid}/holds/{hid}/withdraw"
      - "POST /tours/{id}/shows/{sid}/settlement/submit"
      - "PATCH /tours/{id}/shows/{sid}/tickets"
    shared_operations:
      - "All GET endpoints"

  - name: VenueRep
    description: "Venue operations; approves/rejects advance packet sections"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{id}/shows/{sid}/advance-packet/sections/{s}/approve"
      - "POST /tours/{id}/shows/{sid}/advance-packet/sections/{s}/reject"
    shared_operations:
      - "All GET endpoints"

  - name: SettlementAccountant
    description: "Independent settlement verifier/payer (segregated from Promoter)"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{id}/shows/{sid}/settlement/verify"
      - "POST /tours/{id}/shows/{sid}/settlement/pay"
    shared_operations:
      - "All GET endpoints"

  - name: Any
    description: "Read-only shared role used for list/get endpoints by any authenticated actor"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /tours (+ sub-resources)"
