  # =========================================================================
  # RULE 3 - non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: study_revision_cycle_to_round_cap
        grounds:
          state_machines: [CapacityStudy]
          entities: [CapacityStudy]
          endpoints: ["POST /facilities/capacity-studies/{id}/submit", "POST /facilities/capacity-studies/{id}/return", "POST /facilities/capacity-studies/{id}/reopen", "POST /facilities/capacity-studies/{id}/certify"]
        shape: cyclic
        path: "DRAFT -> SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED -> RETURNED -> reopen rejected"
        distinguishing_aspect: >
          The study returns to DRAFT twice and is blocked on the third attempt,
          which no forward-only reading of the table permits. Each pass through the
          loop increments revision_round and clears the frozen capacity fields, so
          a SUBMITTED study on the third pass carries the same 107.1 utilization it
          carried on the first while revision_round has advanced to 2. The loop is
          bounded: with revision_round at 3 the reopen is rejected with
          ERR_REVISION_LIMIT_REACHED while the study stays RETURNED, and certify
          from RETURNED is rejected with ERR_STUDY_STATE_INVALID rather than
          silently jumping the cycle.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/class-size-policies"
            payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { policy_id: id }
          - call: "POST /facilities/schools"
            payload: { name: "Pinecrest Middle", grade_configuration: "MIDDLE_68", site_acreage: 8.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { school_id: id, school_version_1: version }
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R102", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
