              as: AgencyAdmin
              as_user_id: "adm_1"
          assert:
            - "Before the trigger Applicant.${ap}.disciplinary_risk_index_reported == 30.00 and disciplinary_risk_index_effective == 30.00 and good_standing_flag == false"
            - "HTTP status is 200 and DisciplinaryRecord.${dr}.resolved == true and resolved_at == 2026-08-01T00:00:00Z"
            - "Applicant.${ap}.disciplinary_risk_index_reported == 0.00 and disciplinary_risk_index_effective == 0.00"
            - "Applicant.${ap}.good_standing_flag == true"
            - "GET /licensure/applicants/${ap}/disciplinary-records with resolved true returns total_count == 1 and with resolved false returns total_count == 0"

  # ===========================================================================
  - section: errors
    instances:

      - name: request_missing_x_user_id_header_returns_401
        claim_type: Triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request that carries no X-User-ID / X-User-Role headers at all returns ERR_UNAUTHENTICATED (401) at priority 1, before any role or body check can run — so a body that is also malformed still yields the 401."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensure/applicants"
              payload: { state_code: "TX" }
              as: none
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "response_type == error and the missing required field full_name did not produce ERR_INVALID_REQUEST instead"

      - name: unknown_application_id_on_submit_returns_not_found
        claim_type: Triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: "An action endpoint whose path {id} does not resolve returns ERR_APPLICATION_NOT_FOUND (404) at priority 4, ahead of any state check that would have produced a 409."
        test_recipe:
          setup: ["Empty database; no LicenseApplication row exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /licensure/applications/app_ghost_0001/submit"
              payload: {}
              as: Applicant
              as_user_id: "ap_ghost_0001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_APPLICATION_NOT_FOUND"
            - "response_type == error"

      - name: disciplinary_record_already_resolved_returns_409
        claim_type: Triggerable
        grounds:
          - validations[priority=12]
          - errors[ERR_DISCIPLINARY_RECORD_ALREADY_RESOLVED]
        distinguishing_aspect: "Resolving an already-resolved DisciplinaryRecord returns ERR_DISCIPLINARY_RECORD_ALREADY_RESOLVED (409), resolved_at keeps its first value and the applicant's indexes are not recomputed a second time."
        test_recipe:
          setup:
            - "One Applicant with one ADVISORY DisciplinaryRecord dated 2026-01-01 that has already been resolved at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /licensure/applicants"
              payload: { full_name: "Jorge Silva", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/disciplinary-records"
              payload: { applicant_id: "${ap}", source_state: "OK", source_database: "NPDB", severity: "ADVISORY", action_effective_at: "2026-01-01T00:00:00Z", reported_at: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { dr: $.data.id }
            - call: "POST /licensure/disciplinary-records/${dr}/resolve"
              payload: {}
              as: AgencyAdmin
              as_user_id: "adm_1"
          trigger:
            - call: "POST /licensure/disciplinary-records/${dr}/resolve"
              payload: {}
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_DISCIPLINARY_RECORD_ALREADY_RESOLVED"
            - "DisciplinaryRecord.${dr}.resolved == true and resolved_at == 2026-08-01T00:00:00Z"
            - "Applicant.${ap}.disciplinary_risk_index_reported == 0.00 and good_standing_flag == true"

