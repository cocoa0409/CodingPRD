  - rule_id: boundary_precision_check
    instances:
      - name: bpc_reportable_threshold_exact_60000
        grounds:
          - calculations.reportable_amount_1099
          - entities.TaxForm1099Filing.fields.federal_filing_required
        distinguishing_aspect: |
          Metric = reportable cents vs the 60000 federal threshold (INCLUSIVE
          >=). A filing at exactly 60000 (after excluding an
          EXPENSE_REIMBURSEMENT item and an out-of-window SERVICE_FEE item) is
          REQUIRED; a different contractor's filing at 59999 is NOT.
        test_recipe:
          setup:
            - "Two contractors; jurisdiction US-CA (state threshold 0)"
            - "Filing A line items: SERVICE_FEE 40000 (2026-03-10), SERVICE_FEE 20000 (2026-11-01), EXPENSE_REIMBURSEMENT 50000 (excluded by kind), SERVICE_FEE 9999 dated 2027-01-05 (excluded by window)"
            - "Filing B line items: SERVICE_FEE 40000 + SERVICE_FEE 19999 (both in-year) = 59999"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Boundary A LLC", entity_type: "LLC", ein: "12-0001686", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_a: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Boundary B LLC", entity_type: "LLC", ein: "12-0001687", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_b: $.data.id }
          trigger:
            - call: "POST /api/filings"
              payload: { contractor_id: "${con_a}", state_jurisdiction_id: "${jur_ca}", tax_year: 2026, payment_line_items: [ { amount_cents: 40000, payment_date: "2026-03-10", kind: "SERVICE_FEE" }, { amount_cents: 20000, payment_date: "2026-11-01", kind: "SERVICE_FEE" }, { amount_cents: 50000, payment_date: "2026-04-01", kind: "EXPENSE_REIMBURSEMENT" }, { amount_cents: 9999, payment_date: "2027-01-05", kind: "SERVICE_FEE" } ] }
              as: TaxReportingSpecialist
              captures: { fil_a: $.data.id, rep_a: $.data.reportable_amount_cents, fed_a: $.data.federal_filing_required, st_a: $.data.state_filing_required }
            - call: "POST /api/filings"
              payload: { contractor_id: "${con_b}", state_jurisdiction_id: "${jur_ca}", tax_year: 2026, payment_line_items: [ { amount_cents: 40000, payment_date: "2026-03-10", kind: "SERVICE_FEE" }, { amount_cents: 19999, payment_date: "2026-11-01", kind: "SERVICE_FEE" } ] }
              as: TaxReportingSpecialist
              captures: { fil_b: $.data.id, rep_b: $.data.reportable_amount_cents, fed_b: $.data.federal_filing_required }
          assert:
            - "Filing(${fil_a}).reportable_amount_cents == 60000 (reimbursement and out-of-window items excluded)"
            - "Filing(${fil_a}).federal_filing_required == true (60000 >= 60000, inclusive boundary)"
            - "Filing(${fil_a}).state_filing_required == true (60000 >= 0)"
            - "Filing(${fil_b}).reportable_amount_cents == 59999 AND federal_filing_required == false (one cent below)"
      - name: bpc_zero_findings_cleared_vs_one_finding
        grounds:
          - state_machines.MonitoringReview.SCHEDULED_to_CLOSED
          - entities.MonitoringReview.fields.outcome
          - entities.MonitoringReview.fields.findings_count
        distinguishing_aspect: |
          Metric = findings COUNT at the empty-set boundary (distinct metric from
          the cents threshold above), reached via POST /api/reviews/{id}/close
          (distinct endpoint from the filings boundary). findings == [] closes
          CLEARED with no remediation linkage; findings of length 1 requires a
          linked OPEN remediation action and closes FINDINGS_FILED.
        test_recipe:
          setup:
            - "ACTIVE STANDARD engagement; review R1 scheduled 2026-09-01; review R2 scheduled 2026-10-01 (exactly 30 days later — allowed)"
