              as: ComplianceOfficer
              as_user_id: "compliance-001"
              captures: { paidA: $.data.paid_cents, resA: $.data.reserve_cents, incA: $.data.incurred_authorized_cents }
            - call: "POST /warranty/claims/${cA}/payment-reversals"
              payload: { reserve_entry_id: "${ePayA}", memo: "double reversal attempt" }
              as: ComplianceOfficer
