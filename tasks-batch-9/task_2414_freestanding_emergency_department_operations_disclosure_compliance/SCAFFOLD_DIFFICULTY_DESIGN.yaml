  - rule_id: transitive_cascade
    instances:
      - name: third_disclosure_refusal_cascades_defect_posture_forecast_method_and_coverage_deficit
        grounds:
          - state_machines.Encounter.DISCLOSURE_PRESENTED_to_DISCLOSURE_REFUSED
          - calculations.facility_compliance_posture
          - calculations.required_physician_coverage
          - calculations.coverage_reconciliation
          - entities.VolumeForecast.fields.escalated_by_posture
          - entities.Facility.fields.coverage_deficit_flag
        distinguishing_aspect: |
          Five-link chain from one disclosure refusal: refusal appends a defect-counted ledger entry
          (link 1) -> Facility.open_compliance_defect_count reaches the inclusive threshold 3
          (link 2) -> compliance_posture flips OPEN to RESTRICTED (link 3) -> the ACTIVE forecast's
          method is rewritten TRAILING_MEAN to PEAK_ADJUSTED and its required hours rise 32.50 to
          38.00 (link 4) -> coverage_deficit_hours becomes 2.00 and Facility.coverage_deficit_flag
          flips false to true (link 5). Each link is caused by the previous one, not by the refusal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN (license ACTIVE, template PUBLISHED, signage ATTESTED) and max_concurrent_physicians 2"
            - "One ACTIVE VolumeForecast: period_start_date 2026-08-01, period_days 2, historical_daily_volumes [22, 19, 26, 31, 18, 24, 29], method TRAILING_MEAN, so required_physician_hours_total is 32.50"
            - "Three PHYSICIAN shifts inside the period totalling 36.00 clipped hours (doc-a and doc-b both 2026-08-01T00:00Z..12:00Z, doc-a again 2026-08-02T00:00Z..12:00Z), so coverage_deficit_hours is 0.00 and Facility.coverage_deficit_flag is false"
            - "Three registered encounters; the first two already recorded decision REFUSED, so open_compliance_defect_count is 2 and compliance_posture is still OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities"
              payload: { name: "Cedar Freestanding ED", state_code: "TX", license_category: "INDEPENDENT_FREESTANDING_ED", license_status: "ACTIVE", observation_bed_count: 4, imaging_scope: ["XRAY", "CT"], lab_scope: ["CBC", "TROPONIN"], pharmacy_scope_tier: "EMERGENCY_ONLY", max_concurrent_physicians: 2 }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { fac_id: $.data.id, fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/disclosure-templates"
              payload: { version_label: "V1", facility_fee_cents: 145000, observation_hourly_cents: 42000, network_status_statement: "OUT_OF_NETWORK_ALL_PLANS", required_signage_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { tpl_v1_id: $.data.id }
            - call: "POST /disclosure-templates/${tpl_v1_id}/publish"
              payload: { expected_facility_version: "${fac_v1}" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/signage-attestations"
              payload: { attested_elements: ["LICENSE_CATEGORY_SIGN", "FEE_DISCLOSURE_SIGN", "NETWORK_STATUS_SIGN", "NOT_A_URGENT_CARE_SIGN"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /facilities/${fac_id}/volume-forecasts"
              payload: { period_start_date: "2026-08-01", period_days: 2, historical_daily_volumes: [22, 19, 26, 31, 18, 24, 29], method: "TRAILING_MEAN" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { vf_id: $.data.id }
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-a", role_type: "PHYSICIAN", board_certified: true, start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-01T12:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { sh1_id: $.data.id }
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-b", role_type: "PHYSICIAN", board_certified: true, start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-01T12:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { sh2_id: $.data.id }
            - call: "POST /facilities/${fac_id}/physician-shifts"
              payload: { clinician_user_id: "doc-a", role_type: "PHYSICIAN", board_certified: true, start_utc: "2026-08-02T00:00:00Z", end_utc: "2026-08-02T12:00:00Z" }
              as: FacilityAdministrator
              as_user_id: "admin-1"
              captures: { sh3_id: $.data.id }
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-5001", acuity_level: 2, presenting_service_line: "GENERAL_MEDICAL" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc1_id: $.data.id }
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-5002", acuity_level: 2, presenting_service_line: "GENERAL_MEDICAL" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc2_id: $.data.id }
            - call: "POST /facilities/${fac_id}/encounters"
              payload: { patient_reference: "PT-5003", acuity_level: 2, presenting_service_line: "GENERAL_MEDICAL" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
              captures: { enc3_id: $.data.id }
            - call: "POST /encounters/${enc1_id}/disclosure-decision"
              payload: { decision: "REFUSED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
            - call: "POST /encounters/${enc2_id}/disclosure-decision"
              payload: { decision: "REFUSED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /encounters/${enc3_id}/disclosure-decision"
              payload: { decision: "REFUSED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
          assert:
            - "Encounter.${enc3_id}.disclosure_state == DISCLOSURE_REFUSED"
            - "Facility.${fac_id}.open_compliance_defect_count == 3"
            - "Facility.${fac_id}.compliance_posture == RESTRICTED"
            - "Facility.${fac_id}.restricted_service_codes == [MRI, THROMBOLYTIC]"
            - "VolumeForecast.${vf_id}.method == PEAK_ADJUSTED and VolumeForecast.${vf_id}.escalated_by_posture == true"
            - "VolumeForecast.${vf_id}.forecast_daily_volume == 28.26"
            - "VolumeForecast.${vf_id}.required_physician_hours_total == 38.00"
            - "VolumeForecast.${vf_id}.scheduled_physician_hours == 36.00"
            - "VolumeForecast.${vf_id}.coverage_deficit_hours == 2.00"
            - "Facility.${fac_id}.coverage_deficit_flag == true"
            - "GET /facilities/${fac_id}/compliance-ledger-entries contains an entry with event_type == DISCLOSURE_REFUSED, severity == MAJOR, defect_counted == true, subject_type == ENCOUNTER, subject_id == ${enc3_id} and an entry with event_type == POSTURE_CHANGE"
      - name: insurance_based_transfer_decline_cascades_unit_release_saturation_and_capacity_state
        grounds:
          - state_machines.TransferOrder.REQUESTED_to_DECLINED
          - calculations.ambulance_unit_ledger
          - entities.AmbulanceMOU.fields.saturation_state
          - entities.Facility.fields.transfer_capacity_state
        distinguishing_aspect: |
          A different triggering transition (TransferOrder REQUESTED -> DECLINED, not a disclosure
          decision) drives a four-link chain on the transport ledger: the decline releases the order's
          reserved unit (link 1) -> AmbulanceMOU.units_reserved drops 1 to 0 and units_available
          rises 0 to 1 (link 2) -> the MOU's saturation_state flips SATURATED to AVAILABLE (link 3) ->
