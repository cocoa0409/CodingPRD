      - name: calc_adherence_rounding_order_sets_the_precision_of_both_variants
        claim_type: precision
        grounds:
          - calculations.order_set_adherence.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_adherence_rounding_order_per_unit_mean_versus_pooled_ratio
          rationale: "That instance pins the 4dp per-unit rates and the single 2dp pooled rounding and asserts the resulting 58.60 versus 51.00 spread."

      - name: calc_retirement_gate_threshold_boundary_on_fire_count
        claim_type: threshold
        grounds:
          - calculations.low_value_retirement_eligibility.constants.MIN_FIRE_COUNT
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_retirement_gate_rejects_fire_count_39_and_accepts_40
          rationale: "The threshold-1 / threshold pair on MIN_FIRE_COUNT is exactly that instance's subject."

      - name: calc_burden_index_weighted_scoring_variants_diverge_on_the_same_ledger
        claim_type: weighted_scoring
        grounds:
          - calculations.alert_burden_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_burden_index_fire_weighted_versus_clinician_weighted
          rationale: "Both weighting bases are computed from one firing ledger and asserted against each other there."

      - name: calc_reviewer_workload_aggregation_running_total_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.reviewer_workload_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_reviewer_workload_minutes_conserved_across_withdraw_and_reassign
          rationale: "The running total after add and its exact reversal after withdraw are asserted there, including the capacity identity."

      - name: calc_quorum_constraint_propagation_reaches_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.artifact_quorum_evaluation.evaluation_order
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_quorum_required_votes_pinned_evaluation_order_with_concern_bump
          rationale: "The pinned seven-step evaluation order and the concern-driven required-votes bump propagating to the auto-advance decision are asserted there."

      - name: calc_priority_score_variant_divergence_on_identical_stored_data
        claim_type: variant_divergence
        grounds:
          - calculations.content_request_priority_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_priority_score_provisional_versus_committee_calibrated
          rationale: "Same request, two variants, both literals asserted with their delta."

      - name: calc_adherence_variant_selection_per_protocol_then_intention_to_treat
        claim_type: variant_selection
        grounds:
          - calculations.order_set_adherence.variants
          - entities.AdherenceMeasurement.fields.adherence_pct_per_protocol
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_adherence_rounding_order_per_unit_mean_versus_pooled_ratio
          rationale: "That instance asserts the per-protocol value is the one stored at creation and the intention-to-treat value is the one computed at finalize."

      - name: calc_adherence_reconciliation_mirrors_the_final_variant_to_the_order_set
        claim_type: reconciliation
        grounds:
          - entities.OrderSet.fields.latest_adherence_pct
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_adherence_rounding_order_per_unit_mean_versus_pooled_ratio
          rationale: "OrderSet.latest_adherence_pct == 51.00 (the intention-to-treat value, not 58.60) is asserted there as the reconciliation step."

  - section: validations
    instances:

      - name: validation_triage_accept_with_one_citation_returns_evidence_insufficient
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors.ERR_EVIDENCE_INSUFFICIENT
        distinguishing_aspect: "A request carrying a single peer-reviewed citation fails MIN_CITATIONS_FOR_ACCEPT == 2 at triage ACCEPT with ERR_EVIDENCE_INSUFFICIENT (422), and the request stays SUBMITTED rather than moving to TRIAGE_ACCEPTED."
        test_recipe:
          setup:
            - "One sponsor, one committee chair."
            - "A SUBMITTED content request with exactly one peer-reviewed citation."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Single citation request", request_type: "ORDER_SET", clinical_domain: "CARDIOLOGY", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Local practice memo", peer_reviewed: true }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
          trigger:
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Looks reasonable" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "HTTP 422 with error_id ERR_EVIDENCE_INSUFFICIENT"
            - "GET /cds/content-requests/${cr_id} shows status == SUBMITTED, triaged_at == null and version unchanged at 1"
            - "priority_score is still the intake provisional 30.00 (EVIDENCE_GRADE_POINTS[B] 30 plus ROUTINE 0 plus no safety bonus)"

      - name: validation_triage_accept_passes_with_exactly_two_citations_one_peer_reviewed
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=15].constants.MIN_CITATIONS_FOR_ACCEPT
          - validations[priority=15].constants.MIN_PEER_REVIEWED_FOR_ACCEPT
        distinguishing_aspect: "Exactly two citations of which exactly one is peer reviewed sits on the satisfying side of both thresholds for a ROUTINE request with patient_safety_flag false, so triage ACCEPT succeeds and recalibrates priority_score from 30.00 to 6.00."
        test_recipe:
          setup:
            - "One sponsor, one committee chair."
            - "A SUBMITTED ROUTINE grade-B request with two citations, one peer reviewed and one not, patient_safety_flag false."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Two citation request", request_type: "ORDER_SET", clinical_domain: "CARDIOLOGY", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", patient_safety_flag: false, evidence_citations: [{ citation: "Circulation 2021 statin trial", peer_reviewed: true }, { citation: "Vendor monograph", peer_reviewed: false }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id, intake_score: $.data.priority_score }
          trigger:
            - call: POST /cds/content-requests/${cr_id}/triage
