            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "i.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_a}"
