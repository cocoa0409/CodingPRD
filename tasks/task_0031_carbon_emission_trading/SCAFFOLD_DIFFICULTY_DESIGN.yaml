scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_industry_benchmark_vs_historical_emission
        grounds:
          - calculations.calc_allocation_total
          - state_machines.Allocation.PROPOSED_to_PUBLISHED
          - entities.Allocation.fields.method
          - entities.Allocation.fields.total_quota
        distinguishing_aspect: |
          Two valid allocation algorithms operate on the SAME Allocation entity but produce
          different total_quota for inputs that look equivalent: INDUSTRY_BENCHMARK uses
          forward-looking activity_volume*benchmark_factor while HISTORICAL_EMISSION applies
          backward-looking historical_baseline*0.97. This instance is grounded on the Allocation
          entity domain (quota issuance).
        test_recipe:
          setup:
            - "POST /enterprises Enterprise A (industry_code=POWER, jurisdiction=JD_ALPHA)"
            - "POST /enterprises Enterprise B (industry_code=POWER, jurisdiction=JD_ALPHA)"
            - "POST /allocation-cycles year=2025, free_paid_ratio=0.80, ccer_cap_pct=0.05"
          trigger:
            - "POST /allocation-cycles/{id}/allocations enterprise=A, method=INDUSTRY_BENCHMARK, activity_volume=1000.00, benchmark_factor=1.50"
            - "POST /allocation-cycles/{id}/allocations enterprise=B, method=HISTORICAL_EMISSION, historical_baseline=1500.00"
          assert:
            - "Allocation(A).total_quota == 1500.00 and free_quota == 1200.00 and paid_quota == 300.00"
            - "Allocation(B).total_quota == 1455.00 and free_quota == 1164.00 and paid_quota == 291.00"
            - "Allocation(A).total_quota != Allocation(B).total_quota despite both inputs being '1500-equivalent'"

      - name: emissions_reported_vs_verified
        grounds:
          - calculations.calc_total_reported_emissions
          - calculations.calc_verified_emissions
          - entities.EmissionReport.fields.total_reported_emissions
          - entities.EmissionReport.fields.total_verified_emissions
          - state_machines.EmissionReport.UNDER_VERIFICATION_to_VERIFIED
        distinguishing_aspect: |
          Two valid emission totals on the EmissionReport entity (a different domain than
          Allocation): total_reported_emissions uses enterprise's self-reported emission_factor;
          total_verified_emissions uses verifier-adjusted factor at on-site visit. Same activity
          data, two different cents, both authoritative in their own context (planning vs
          compliance).
        test_recipe:
          setup:
            - "Run allocation cycle to FINALIZED for Enterprise C"
            - "POST /enterprises/{C}/emission-reports cycle_year=2025"
            - "POST /emission-reports/{r}/lines source=ELECTRICITY, activity_data=100.00, emission_factor=0.500 (no document required)"
            - "POST /emission-reports/{r}/submit -> SUBMITTED"
            - "POST /emission-reports/{r}/assign-verifier agency=AGY1, scheduled_visit >= now+7d"
            - "POST /_clock/advance to scheduled_visit"
          trigger:
            - "POST /verification-assignments/{a}/complete-onsite line_adjustments=[{line, verified_amount=55.00}]"
            - "POST /verification-assignments/{a}/issue-report"
          assert:
            - "EmissionReport.total_reported_emissions == 50.00"
            - "EmissionReport.total_verified_emissions == 55.00"
            - "total_reported_emissions != total_verified_emissions; both persisted on the SAME EmissionReport row"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: trade_fee_marginal_tier_with_channel_branching
        grounds:
          - calculations.calc_trade_fee
          - entities.Trade.fields.buyer_fee
          - entities.Trade.fields.seller_fee
          - entities.TradingOrder.fields.channel
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (channel, quantity, price) with non-linear interaction —
          channel selects base_rate from a 3-entry table, then gross_value selects which subset of
          three marginal tiers contribute, with two nested min/max expressions per tier. This is
          NOT a simple linear formula and NOT a rounding-order issue.
        test_recipe:
          setup:
            - "Two enterprises with sufficient QUOTA balances and finalized allocations"
            - "Enterprise SellerS posts SELL LIMIT order: instrument=QUOTA, qty=4000, price=50.00, channel=EXCHANGE"
          trigger:
            - "Enterprise BuyerB posts BUY MARKET order: instrument=QUOTA, qty=4000, channel=EXCHANGE"
          assert:
            - "Trade.gross_value == 200000.00"
            - "Trade.buyer_fee == 180.00 (= 100000*0.0010 + 100000*0.0010*0.80)"
            - "Trade.seller_fee == 180.00"

      - name: emission_total_round_per_line_then_sum
        grounds:
          - calculations.calc_total_reported_emissions
          - entities.EmissionDataLine.fields.source_amount
          - entities.EmissionReport.fields.total_reported_emissions
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — 'round each line to 2dp THEN sum' versus
          'sum activity*factor then round once' produce different cents. Scaffold pins per-line
          rounding first; the alternative interpretation is forbidden and produces 0.01 less.
        test_recipe:
          setup:
            - "Enterprise with FINALIZED allocation and DRAFT emission report for cycle 2025"
            - "POST /emission-reports/{r}/lines source=ELECTRICITY, activity_data=1.000, emission_factor=0.005 (no document required for ELECTRICITY)"
            - "POST /emission-reports/{r}/lines source=ELECTRICITY, activity_data=1.000, emission_factor=0.005"
          trigger:
            - "POST /emission-reports/{r}/submit"
          assert:
            - "EmissionDataLine[0].source_amount == 0.01 (round_half_up of 0.005)"
            - "EmissionDataLine[1].source_amount == 0.01"
            - "EmissionReport.total_reported_emissions == 0.02 (per-line then sum). Forbidden alternative (sum then round) would yield 0.01."

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: emission_report_dispute_cycle
        grounds:
          - state_machines.EmissionReport.VERIFIED_to_DISPUTED
          - state_machines.EmissionReport.DISPUTED_to_VERIFIED
          - state_machines.EmissionReport.SUBMITTED_to_DRAFT
        distinguishing_aspect: |
          EmissionReport state machine contains a true cycle VERIFIED → DISPUTED → VERIFIED
          (and a separate cycle SUBMITTED → DRAFT through versioning). At least two distinct
          loops on this entity; pure A→B→C→D pipelines do NOT satisfy this.
        test_recipe:
          setup:
            - "Run a report through to status=VERIFIED with assignment.report_issued_at = now"
          trigger:
            - "POST /emission-reports/{r}/dispute (within 14 days)"
            - "POST /verification-assignments/{a}/resolve-dispute adjusted_total_verified_emissions=60.00"
          assert:
            - "After dispute: EmissionReport.status == 'DISPUTED'"
            - "After resolve: EmissionReport.status == 'VERIFIED' (returned to prior state)"
            - "VerificationAssignment.status sequence observed: REPORT_ISSUED -> DISPUTED -> RESOLVED"

      - name: allocation_objection_revert_branch
        grounds:
          - state_machines.Allocation.PUBLISHED_to_OBJECTED
          - state_machines.Allocation.OBJECTED_to_PUBLISHED
          - state_machines.Allocation.OBJECTED_to_REVISED
        distinguishing_aspect: |
          Allocation state machine has a branching fork-join with revert: PUBLISHED→OBJECTED, then
          either OBJECTED→PUBLISHED (reject) OR OBJECTED→REVISED (uphold), with divergent
          side-effect sets per branch (uphold recomputes free/paid; reject does not). This is a
          DIFFERENT entity from EmissionReport, satisfying the differentiation clause.
        test_recipe:
          setup:
            - "Allocation in PUBLISHED state with total_quota=1500"
            - "Enterprise files Objection on it"
          trigger:
            - "POST /objections/{o}/uphold revised_total_quota=1200.00"
          assert:
            - "Allocation.status == 'REVISED'"
            - "Allocation.free_quota == 960.00 and paid_quota == 240.00 (recomputed from revised total)"
            - "Branching observed: PUBLISHED -> OBJECTED -> REVISED. Repeating with /reject would have produced PUBLISHED, demonstrating divergent side-effects per branch."

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cycle_finalize_to_enterprise_balance_to_compliance_eligibility
        grounds:
          - state_machines.AllocationCycle.OBJECTION_OPEN_to_FINALIZED
          - state_machines.Allocation.PUBLISHED_to_FINALIZED
          - entities.Enterprise.fields.account_status
          - entities.Enterprise.fields.quota_balance
          - state_machines.ComplianceDeclaration.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Depth-3 cascade originating from a SINGLE trigger (cycle.finalize): step 1 cycle
          OBJECTION_OPEN→FINALIZED ITSELF causes step 2 each Allocation PUBLISHED→FINALIZED;
          step 2 ITSELF causes step 3 Enterprise.account_status PENDING→OPEN and
          quota_balance += free_quota; that change to Enterprise THEN enables a fourth-tier
          consequence — the enterprise's later ComplianceDeclaration submit becomes possible
          (was not before, because account_status != OPEN). Each link is caused by the
          previous, not the original action.
        test_recipe:
          setup:
            - "Allocation cycle 2025 in OBJECTION_OPEN with one Allocation for Enterprise E (free_quota=1200, paid_quota=300, status=PUBLISHED)"
            - "Enterprise E.account_status='PENDING', quota_balance=0.00, paid_quota_balance=0.00"
            - "POST /_clock/advance to objection_deadline + 1s"
          trigger:
            - "POST /allocation-cycles/{id}/finalize"
          assert:
            - "AllocationCycle.status == 'FINALIZED'"
            - "Allocation.status == 'FINALIZED' (caused by cycle finalize)"
            - "Enterprise.account_status == 'OPEN' (caused by allocation finalize)"
            - "Enterprise.quota_balance == 1200.00 and paid_quota_balance == 300.00"
            - "AuditLogEntry exists with action='QUOTA_ALLOCATED', delta_quota == 1500"

      - name: penalty_pay_to_declaration_to_settlement_eligibility
        grounds:
          - state_machines.PenaltyOrder.UNPAID_to_PAID
          - state_machines.ComplianceDeclaration.NON_COMPLIANT_to_PENALIZED
          - state_machines.AllocationCycle.COMPLIANCE_OPEN_to_SETTLED
          - state_machines.AllocationCycle.SETTLED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (POST /penalty-orders/{id}/pay): step 1
          PenaltyOrder UNPAID→PAID; that ITSELF causes step 2 ComplianceDeclaration
          NON_COMPLIANT→PENALIZED; that ITSELF unblocks step 3 the cycle.close precondition
          (all penalties PAID). Different originating trigger from instance 1 (penalty pay vs
          cycle finalize), so the scaffold captures more than one propagation pattern.
        test_recipe:
          setup:
            - "Cycle SETTLED with one Enterprise E in NON_COMPLIANT and unpaid PenaltyOrder"
            - "AnnualSettlement for E in CLOSED"
          trigger:
            - "POST /penalty-orders/{p}/pay"
            - "POST /allocation-cycles/{c}/close"
          assert:
            - "PenaltyOrder.payment_status == 'PAID' (step 1)"
            - "ComplianceDeclaration.status == 'PENALIZED' (step 2, caused by step 1)"
            - "AllocationCycle.status == 'CLOSED' (step 3, only allowed because step 2 satisfied close precondition)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pair_on_assign_verifier
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_VERIFIER_CONFLICT_OF_INTEREST
        distinguishing_aspect: |
          Pair = (state, business_safety). Trigger an assign-verifier where the report is in DRAFT
          (state violation) AND agency_id equals the enterprise (safety/COI violation). Server
          MUST emit ERR_INVALID_STATE (priority 4) not ERR_VERIFIER_CONFLICT_OF_INTEREST
          (priority 6).
        test_recipe:
          setup:
            - "EmissionReport in DRAFT (no submit performed)"
          trigger:
            - "POST /emission-reports/{r}/assign-verifier agency_id=enterprise_id, scheduled_visit_at=now+8d"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_INVALID_STATE'"

      - name: business_temporal_vs_business_constraint_pair_on_compliance_submit
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_WINDOW_CLOSED
          - errors.ERR_CCER_CAP_EXCEEDED
        distinguishing_aspect: |
          Pair = (business_temporal, business_constraint) — different from the (state,
          business_safety) pair above. Submit a ComplianceDeclaration after compliance_deadline
          (window closed) AND with declared_offset_ccer way over the cap (constraint violation).
          Server MUST emit ERR_WINDOW_CLOSED (priority 7) not ERR_CCER_CAP_EXCEEDED (priority 9).
        test_recipe:
          setup:
            - "Cycle with compliance_deadline at T0; verified_emissions=100, ccer_cap_pct=0.05"
            - "POST /_clock/advance to T0 + 1 day"
          trigger:
            - "POST /compliance-declarations/{cd}/submit declared_offset_ccer=50.00 (50 > 0.05*100=5.00)"
          assert:
            - "Response status == 422"
            - "error_id == 'ERR_WINDOW_CLOSED'"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: penalty_severity_breakpoint_at_0_05_inclusive_to_moderate
        grounds:
          - calculations.calc_penalty_amount
          - entities.PenaltyOrder.fields.severity
          - state_machines.ComplianceDeclaration.SUBMITTED_to_NON_COMPLIANT
        distinguishing_aspect: |
          Numeric metric: deficit_pct boundary at exactly 0.05. Spec pins 'deficit_pct < 0.05 =>
          MINOR; >= 0.05 and < 0.20 => MODERATE'. Test exactly 0.05 to confirm MODERATE
          (NOT MINOR). Reachable through POST /compliance-declarations/{id}/submit.
        test_recipe:
          setup:
            - "Verified emissions = 100.00 for Enterprise in jurisdiction JD_ALPHA"
            - "Compliance: declared_offset_quota=95.00, declared_offset_ccer=0, declared_borrow_amount=0"
          trigger:
            - "POST /compliance-declarations/{cd}/submit"
          assert:
            - "ComplianceDeclaration.deficit_amount == 5.00"
            - "deficit_pct == 0.05 exactly => PenaltyOrder.severity == 'MODERATE' (NOT 'MINOR')"
            - "PenaltyOrder.penalty_rate == 200.00 (JD_ALPHA, MODERATE)"
            - "PenaltyOrder.penalty_amount == 1000.00"

      - name: empty_emission_lines_set_blocks_submit
        grounds:
          - validations[priority=4]
          - state_machines.EmissionReport.DRAFT_to_SUBMITTED
          - entities.EmissionDataLine
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Different metric (empty-collection edge, NOT a numeric threshold) on a different
          endpoint (POST /emission-reports/{id}/submit, not /compliance-declarations/submit).
          Submitting a DRAFT report with zero EmissionDataLine rows is rejected via the precondition
          'At least one EmissionDataLine exists'.
        test_recipe:
          setup:
            - "POST /enterprises/{e}/emission-reports for cycle 2025 (DRAFT, zero lines, zero documents)"
          trigger:
            - "POST /emission-reports/{r}/submit"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_INVALID_STATE'"
            - "EmissionReport.status remains 'DRAFT'"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: compliance_submit_requires_emission_report_finalized
        grounds:
          - state_machines.ComplianceDeclaration.DRAFT_to_SUBMITTED
          - entities.EmissionReport.fields.status
          - entities.ComplianceDeclaration
        distinguishing_aspect: |
          Pair = (ComplianceDeclaration, EmissionReport). ComplianceDeclaration cannot transition
          DRAFT→SUBMITTED unless the corresponding EmissionReport.status == FINALIZED. The
          declaration's own state alone is insufficient.
        test_recipe:
          setup:
            - "EmissionReport in VERIFIED (not yet FINALIZED)"
            - "ComplianceDeclaration in DRAFT for same (enterprise, cycle_year)"
          trigger:
            - "POST /compliance-declarations/{cd}/submit declared_offset_quota=100.00"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_INVALID_STATE'"
            - "After POST /emission-reports/{r}/finalize, the SAME submit succeeds"

      - name: cycle_close_requires_all_penalty_orders_paid
        grounds:
          - state_machines.AllocationCycle.SETTLED_to_CLOSED
          - entities.PenaltyOrder.fields.payment_status
          - entities.AllocationCycle
        distinguishing_aspect: |
          Different entity pair = (AllocationCycle, PenaltyOrder). Cycle cannot transition
          SETTLED→CLOSED while ANY PenaltyOrder for that cycle is in payment_status != PAID.
          Different pair from the ComplianceDeclaration↔EmissionReport instance above.
        test_recipe:
          setup:
            - "AllocationCycle in SETTLED"
            - "AnnualSettlements all in CLOSED"
            - "One PenaltyOrder for this cycle in payment_status='UNPAID'"
          trigger:
            - "POST /allocation-cycles/{c}/close"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_INVALID_STATE'"
            - "After POST /penalty-orders/{p}/pay (which sets PAID), the SAME close succeeds"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: verification_visit_buffer_window
        grounds:
          - state_machines.EmissionReport.SUBMITTED_to_UNDER_VERIFICATION
          - validations[priority=7]
          - entities.VerificationAssignment.fields.scheduled_visit_at
          - errors.ERR_WINDOW_CLOSED
        distinguishing_aspect: |
          Interval semantics 1: buffered point-in-time on VerificationAssignment.scheduled_visit_at.
          The constraint is a half-open buffer 'visit must be at least 7 days after assignment'
          (i.e., scheduled_visit_at >= now+7d, strict-less is rejected). Resource = single point
          on a per-report timeline; no aggregate capacity.
        test_recipe:
          setup:
            - "EmissionReport in SUBMITTED"
            - "now = T0"
          trigger:
            - "POST /emission-reports/{r}/assign-verifier agency=AGY1, scheduled_visit_at = T0 + 6d 23h 59m"
          assert:
            - "Response status == 422"
            - "error_id == 'ERR_WINDOW_CLOSED'"
            - "Repeating with scheduled_visit_at = T0 + 7d 0h 0m succeeds (boundary inclusive)"

      - name: dispute_window_after_report_issued
        grounds:
          - state_machines.EmissionReport.VERIFIED_to_DISPUTED
          - validations[priority=7]
          - entities.VerificationAssignment.fields.report_issued_at
          - errors.ERR_WINDOW_CLOSED
        distinguishing_aspect: |
          Different interval semantics: closed forward window of fixed duration on the EmissionReport
          resource. Dispute is allowed only while now <= report_issued_at + 14d. This is a half-
          open look-back window measured from a different anchor (report_issued_at, not now), and
          sits on a different resource (EmissionReport vs VerificationAssignment). Two overlap
          rules with identical interval arithmetic do NOT count.
        test_recipe:
          setup:
            - "EmissionReport in VERIFIED with VerificationAssignment.report_issued_at = T0"
            - "POST /_clock/advance to T0 + 14d 0h 1s"
          trigger:
            - "POST /emission-reports/{r}/dispute"
          assert:
            - "Response status == 422"
            - "error_id == 'ERR_WINDOW_CLOSED'"
            - "Repeating with clock at T0 + 14d 0h exactly succeeds (boundary inclusive)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: trade_executed_then_settled_conserves_global_quota_supply
        grounds:
          - state_machines.TradingOrder.OPEN_to_FILLED
          - calculations.calc_trade_fee
          - entities.Enterprise.fields.quota_balance
          - entities.Enterprise.fields.paid_quota_balance
        distinguishing_aspect: |
          Conserved quantity = SUM_OVER_ENTERPRISES(quota_balance + paid_quota_balance) for QUOTA
          trades. A QUOTA Trade between buyer B and seller S decreases S by qty and increases B by
          qty, leaving the system-wide quota supply unchanged. Pinned formula:
            sum_after = sum_before, where sum = Σ(quota_balance + paid_quota_balance) over all enterprises.
        test_recipe:
          setup:
            - "Enterprise S: quota_balance=2000.00, paid_quota_balance=0; Enterprise B: quota_balance=0, paid_quota_balance=0"
            - "Sum_before = 2000.00"
            - "S posts SELL LIMIT order: qty=500, price=40.00, instrument=QUOTA, channel=EXCHANGE"
          trigger:
            - "B posts BUY MARKET order: qty=500, instrument=QUOTA, channel=EXCHANGE (full match)"
          assert:
            - "Trade executed: quantity=500, price=40.00"
            - "Enterprise S: quota_balance + paid_quota_balance == 1500.00"
            - "Enterprise B: quota_balance + paid_quota_balance == 500.00"
            - "Sum_after = 1500.00 + 500.00 == 2000.00 == Sum_before (invariant: total QUOTA conserved across the trade)"

      - name: penalty_pay_then_mandatory_deduction_conserves_compliance_pressure
        grounds:
          - state_machines.PenaltyOrder.UNPAID_to_PAID
          - state_machines.ComplianceDeclaration.NON_COMPLIANT_to_PENALIZED
          - entities.PenaltyOrder.fields.deficit_amount
          - entities.PenaltyOrder.fields.mandatory_deduction_amount
          - entities.AnnualSettlement.fields.deficit_purchase_amount
        distinguishing_aspect: |
          Different conserved quantity (regulatory 'compliance pressure' in tCO2e, NOT a balance).
          Pinned formula:
            initial_deficit_tonnes == retired_via_settlement_tonnes + future_mandatory_deduction_tonnes
          where retired_via_settlement_tonnes = ComplianceDeclaration.declared_offset_quota that the
          enterprise designated to cover the deficit's matching portion AND
          future_mandatory_deduction_tonnes == 1.5 * initial_deficit_tonnes (regulatory premium, the
          compensating action's effect on next cycle's allocation). The invariant pins that
          mandatory_deduction_amount on PenaltyOrder MUST equal 1.5 * deficit_amount EXACTLY — no
          drift, no rounding gain/loss across the pay → next-cycle-deduction chain.
        test_recipe:
          setup:
            - "ComplianceDeclaration submitted with deficit_amount=20.00 (verified=100, offset_total=80)"
            - "PenaltyOrder created via calc_penalty_amount in JD_ALPHA jurisdiction"
          trigger:
            - "POST /penalty-orders/{p}/pay"
          assert:
            - "PenaltyOrder.deficit_amount == 20.00"
            - "PenaltyOrder.mandatory_deduction_amount == 30.00 (== 1.5 * 20.00, pinned invariant — no drift)"
            - "PenaltyOrder.payment_status == 'PAID'"
            - "Conservation: mandatory_deduction_amount / deficit_amount == 1.5 exactly (the compensating-action multiplier is preserved through the pay transition)"
