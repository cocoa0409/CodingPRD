              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { p2: $.data.id }
            - call: "POST /devices"
              payload: { account_id: "${acct_id}", device_label: "TV", platform: "TV", supports_hd: true }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /stream-sessions"
              payload: { profile_id: "${p1}", device_id: "${dev_id}", title_id: "${title_id}" }
              as: ProfileUser
              as_user_id: "${p1}"
              captures: { s1: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-22T12:30:00Z", run_sweeps: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /stream-sessions"
