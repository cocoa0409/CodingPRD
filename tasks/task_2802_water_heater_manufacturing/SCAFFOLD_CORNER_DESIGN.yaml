      - name: lift_restriction_requires_zero_held_units_and_restricted_state
        claim_type: conditional_action
        grounds:
          - endpoints[POST /mfg/product-models/{id}/lift-restriction]
          - endpoints[POST /mfg/heater-units/{id}/release-hold]
          - state_machines.ProductModel.RESTRICTED_to_RELEASED
          - state_machines.HeaterUnit.HELD_to_SCRAPPED
          - validations[priority 8]
          - validations[priority 33]
          - errors[ERR_HELD_UNITS_REMAIN]
          - errors[ERR_INVALID_UNIT_STATE]
          - errors[ERR_INVALID_MODEL_STATE]
        distinguishing_aspect: >
          A decertification hold is a one-way street for the unit: label_status went INVALID, so no HELD ->
          LABELED transition exists any more and the only way to clear held_unit_count is to scrap the unit. Only
          then may the restriction be lifted, and lifting it touches the release dimension ONLY - the model stays
          DECERTIFIED. A second lift is a state error rather than an idempotent no-op, which is exactly what the
          ProductModel state error covers.
        test_recipe:
          setup:
            - "Model GX50-T was CERTIFIED and RELEASED, and unit u1 was LABELED with serial GX50-T-202608-00001."
            - "Revoking the certification decertified the model, held u1 with hold_reason_code MODEL_DECERTIFIED and label_status INVALID, and moved release_status RELEASED -> RESTRICTED."
