          - endpoints[POST /modular/projects/{projectId}/weather-observations]
          - calculations.crane_pick_feasibility
          - validations[priority=62]
        distinguishing_aspect: |
          The observation endpoint writes no state machine — it only moves two forecast numbers — but
          its side effect reaches forward into a re-evaluated precondition: a pick that was feasible
          at 85.00% when it was scheduled becomes infeasible at execute-set once a 20 mph gust is
          recorded, because the chart capacity is derated to 72_000 lb.
