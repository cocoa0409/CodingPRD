# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2209_alcohol_wholesaler_price_posting_post
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: posted_price_as_certified_versus_as_amended_diverge_on_same_item
        grounds:
          - calculations.posted_case_price_resolution
          - entities.PriceScheduleItem.fields.certified_case_price_cents
          - entities.PriceScheduleItem.fields.case_price_cents
          - state_machines.HoldAmendment.PENDING_to_ACCEPTED
        distinguishing_aspect: |
          This instance's two variants live in the PriceScheduleItem pricing domain: as_certified reads the
          certification snapshot while as_amended reads the live price, so a single accepted hold amendment makes
          the same item resolve to 120000 under one variant and 115000 under the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "StateProgram TX with all thresholds at their declared defaults."
            - "Wholesaler A (license W-1001) with a FILING_AGENT and a CERTIFYING_OFFICER; brand Rio Reserve APPROVED for 2026-01-01 through 2027-12-31."
            - "Wholesaler B (license W-2002) with its own filing agent, certifying officer and APPROVED brand."
            - "Schedule A for posting month 2026-09 carries item A (Rio Reserve, 750 ml, 12 per case) at case 120000 / unit 11000; submitted on time and certified, so certified_case_price_cents is 120000."
            - "Schedule B for posting month 2026-09 carries item B at case 110000 / unit 10000; certified."
            - "A hold amendment on item A referencing item B is accepted inside the post-and-hold window, moving item A to case 115000 / unit 10500."
            - "The clock is advanced to 2026-10-01T00:00:00Z and a posting run makes both schedules EFFECTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-2002", legal_name: "Gulf Coast Beverage", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_b: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_b}", full_name: "Ben Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_b: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_b}", full_name: "Bea Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_b: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_b}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_b}"
              captures: { brand_b: $.data.id }
            - call: "POST /brands/${brand_b}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_a}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
              captures: { sched_a_v: $.data.version }
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_b}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_b}"
              captures: { sched_b: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_b}", brand_id: "${brand_b}", size_ml: 750, bottles_per_case: 12, case_price_cents: 110000, unit_price_cents: 10000 }
              as: FilingAgent
              as_user_id: "${agent_b}"
              captures: { item_b: $.data.id }
            - call: "POST /price-schedules/${sched_b}/submit"
              as: FilingAgent
              as_user_id: "${agent_b}"
            - call: "POST /price-schedules/${sched_b}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_b}"
            - call: "POST /hold-amendments"
              payload: { amending_item_id: "${item_a}", reference_item_id: "${item_b}", new_case_price_cents: 115000, new_unit_price_cents: 10500, expected_schedule_version: "${sched_a_v}" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { amend_1: $.data.id }
            - call: "POST /hold-amendments/${amend_1}/accept"
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /price-schedule-items/${item_a}/posted-price"
              payload: { as_of: "2026-10-01T00:00:00Z", variant: "as_amended" }
              as: ComplianceOfficer
              captures: { amended_case: $.data.posted_case_price_cents, amended_unit: $.data.posted_unit_price_cents }
            - call: "GET /price-schedule-items/${item_a}/posted-price"
              payload: { as_of: "2026-10-01T00:00:00Z", variant: "as_certified" }
              as: ComplianceOfficer
              captures: { certified_case: $.data.posted_case_price_cents, certified_unit: $.data.posted_unit_price_cents }
          assert:
            - "GET /price-schedule-items/${item_a}/posted-price with variant as_amended returns posted_case_price_cents == 115000"
            - "GET /price-schedule-items/${item_a}/posted-price with variant as_amended returns posted_unit_price_cents == 10500"
            - "GET /price-schedule-items/${item_a}/posted-price with variant as_certified returns posted_case_price_cents == 120000"
            - "GET /price-schedule-items/${item_a}/posted-price with variant as_certified returns posted_unit_price_cents == 11000"
            - "the two variants differ by exactly 5000 cents on posted_case_price_cents for the same item and the same as_of instant"
            - "PriceScheduleItem.${item_a}.case_price_cents == 115000 and PriceScheduleItem.${item_a}.certified_case_price_cents == 120000"

      - name: penalty_exposure_assessed_versus_provisional_diverge_on_wholesaler
        grounds:
          - calculations.wholesaler_penalty_exposure
          - entities.Wholesaler.fields.penalty_exposure_cents
          - entities.Wholesaler.fields.late_filing_penalty_accrued_cents
          - state_machines.ComplianceAudit.OPEN_to_COLLECTED
        distinguishing_aspect: |
          This instance's two variants live in the Wholesaler risk domain rather than the item pricing domain:
          assessed_exposure counts only accrued and assessed money (250000) while provisional_exposure projects the
          findings sitting in a COLLECTED audit at multiplier 1.00 and returns 270000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (off_posted_penalty_rate_pct 0.40, late_filing_penalty_cents 250000)."
            - "Wholesaler A with a filing agent, a certifying officer and an APPROVED brand."
            - "Schedule for posting month 2026-09 carrying item A at case 120000 / unit 11000; submitted on time, certified, and made EFFECTIVE by a posting run after the clock moves to 2026-10-01T00:00:00Z."
            - "A retailer invoice dated 2026-10-05T00:00:00Z charges 10 cases at 115000 against a posted price of 120000, so validation flags a 50000-cent undercharge."
            - "A second schedule for posting month 2026-08 is submitted while the clock reads 2026-10-01, which is past that month's 2026-08-10T23:59:59.999Z deadline, accruing one 250000-cent late filing penalty."
            - "A compliance audit for period 2026-10 is opened and collected, producing one finding of 50000 cents while the audit is still COLLECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_a}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
            - call: "POST /retailer-invoices"
              payload: { wholesaler_id: "${wh_a}", retailer_license_number: "R-777", invoice_date: "2026-10-05T00:00:00Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { inv_a: $.data.id }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv_a}", item_id: "${item_a}", cases_quantity: 10, bottles_quantity: 0, case_price_charged_cents: 115000, unit_price_charged_cents: 11000, promotional_allowance_cents: 0, depletion_allowance_cents: 0 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { line_a: $.data.id }
            - call: "POST /retailer-invoices/${inv_a}/validate"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-08" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_late: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_late}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 121000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_late}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "GET /wholesalers/${wh_a}"
              as: ComplianceOfficer
              captures: { wh_a_v: $.data.version }
            - call: "POST /compliance-audits"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", audit_period_month: "2026-10", expected_wholesaler_version: "${wh_a_v}" }
              as: ComplianceOfficer
              captures: { audit_a: $.data.id }
            - call: "POST /compliance-audits/${audit_a}/collect"
              as: ComplianceOfficer
          trigger:
            - call: "GET /wholesalers/${wh_a}/penalty-exposure"
              payload: { variant: "assessed_exposure" }
              as: ComplianceOfficer
              captures: { assessed_exposure: $.data.exposure_cents }
            - call: "GET /wholesalers/${wh_a}/penalty-exposure"
              payload: { variant: "provisional_exposure" }
              as: ComplianceOfficer
              captures: { provisional_exposure: $.data.exposure_cents, provisional_part: $.data.provisional_cents }
          assert:
            - "GET /wholesalers/${wh_a}/penalty-exposure with variant assessed_exposure returns exposure_cents == 250000"
            - "GET /wholesalers/${wh_a}/penalty-exposure with variant assessed_exposure returns provisional_cents == 0"
            - "GET /wholesalers/${wh_a}/penalty-exposure with variant provisional_exposure returns provisional_cents == 20000"
            - "GET /wholesalers/${wh_a}/penalty-exposure with variant provisional_exposure returns exposure_cents == 270000"
            - "Wholesaler.${wh_a}.penalty_exposure_cents == 250000, equal to the assessed_exposure variant and not to the provisional_exposure variant"
            - "ComplianceAudit.${audit_a}.status == COLLECTED and ComplianceAudit.${audit_a}.total_variance_cents == 50000"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_line_net_price_composes_tier_selection_with_two_independent_allowance_caps
        grounds:
          - calculations.invoice_line_net_price
          - calculations.tier_discounted_case_price
          - entities.InvoiceLine.fields.net_price_cents
          - entities.StateProgram.fields.max_promotional_allowance_pct
          - entities.StateProgram.fields.depletion_allowance_per_case_cents
        distinguishing_aspect: |
          Mode (a): a single line's net price is the composition of four independently derived terms — gross from two
          quantity dimensions, a quantity discount chosen from two competing tiers by greatest min_cases, a
          promotional allowance capped by a floored percentage of gross, and a depletion allowance capped per case —
          so 1517000 gross becomes 1266550 net and no single term can be omitted without changing the result.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (max_promotional_allowance_pct 0.05, depletion_allowance_per_case_cents 150, max_quantity_discount_pct 0.15)."
            - "Wholesaler A with filing agent, certifying officer and APPROVED brand Rio Reserve."
            - "Schedule for posting month 2026-09 carrying item A at case 120000 / unit 11000, submitted on time and certified."
            - "Item A carries two ACTIVE quantity discount tiers: min_cases 5 at 0.05 (discounted 114000) and min_cases 10 at 0.12 (discounted 105600)."
            - "The clock advances to 2026-10-01T00:00:00Z and a posting run makes item A EFFECTIVE."
            - "A retailer invoice dated 2026-10-05T00:00:00Z carries one line for 12 cases plus 7 bottles at the posted prices, with a 100000-cent promotional allowance and a 3000-cent depletion allowance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
            - call: "POST /price-schedules/${sched_a}/certify"
              as: CertifyingOfficer
              as_user_id: "${cert_a}"
            - call: "POST /quantity-discount-tiers"
              payload: { item_id: "${item_a}", min_cases: 5, discount_pct: 0.05 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { tier_5: $.data.id }
            - call: "POST /quantity-discount-tiers"
              payload: { item_id: "${item_a}", min_cases: 10, discount_pct: 0.12 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { tier_10: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /posting-runs"
              payload: { state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
            - call: "POST /retailer-invoices"
              payload: { wholesaler_id: "${wh_a}", retailer_license_number: "R-777", invoice_date: "2026-10-05T00:00:00Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { inv_a: $.data.id }
            - call: "POST /invoice-lines"
              payload: { invoice_id: "${inv_a}", item_id: "${item_a}", cases_quantity: 12, bottles_quantity: 7, case_price_charged_cents: 120000, unit_price_charged_cents: 11000, promotional_allowance_cents: 100000, depletion_allowance_cents: 3000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { line_a: $.data.id }
          trigger:
            - call: "POST /retailer-invoices/${inv_a}/validate"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { inv_subtotal: $.data.subtotal_cents, inv_surcharge: $.data.surcharge_cents, inv_total: $.data.total_cents }
          assert:
            - "QuantityDiscountTier.${tier_5}.discounted_case_price_cents == 114000"
            - "QuantityDiscountTier.${tier_10}.discounted_case_price_cents == 105600"
            - "InvoiceLine.${line_a}.gross_cents == 1517000"
            - "InvoiceLine.${line_a}.quantity_discount_cents == 172800"
            - "InvoiceLine.${line_a}.allowed_promotional_cents == 75850"
            - "InvoiceLine.${line_a}.excess_promotional_cents == 24150"
            - "InvoiceLine.${line_a}.allowed_depletion_cents == 1800"
            - "InvoiceLine.${line_a}.excess_depletion_cents == 1200"
            - "InvoiceLine.${line_a}.net_price_cents == 1266550"
            - "InvoiceLine.${line_a}.variance_cents == 0 while InvoiceLine.${line_a}.finding_variance_cents == 25350"
            - "InvoiceLine.${line_a}.is_off_posted == true"
            - "RetailerInvoice.${inv_a}.total_allowance_cents == 77650"

      - name: audit_penalty_rounds_each_finding_before_summing_then_escalates_by_prior_history
        grounds:
          - calculations.audit_penalty_assessment
          - entities.AuditFinding.fields.penalty_component_cents
          - entities.ComplianceAudit.fields.base_penalty_cents
          - entities.ComplianceAudit.fields.tier_multiplier
          - state_machines.ComplianceAudit.COLLECTED_to_ASSESSED
        distinguishing_aspect: |
          Mode (b): the rounding ORDER is the whole result — rounding each finding to whole cents before summing gives
          base_penalty_cents 4651 whereas summing the raw products and rounding once gives 4650, and the tier
          multiplier of 1.50 then produces a second half-cent boundary at 6976.5 that rounds up to 6977.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; StateProgram NV configured with off_posted_penalty_rate_pct 0.375 and every other threshold at its default."
            - "Wholesaler C with a filing agent, a certifying officer and an APPROVED brand."
            - "Schedule for posting month 2026-09 carrying item C at case 120000 / unit 11000; submitted on time and certified; the clock then advances to 2026-10-01T00:00:00Z and a posting run makes item C EFFECTIVE."
            - "A first invoice dated 2026-10-03T00:00:00Z carries three single-case lines charged at 119000 each, so each line is 1000 cents under the posted price."
            - "The first audit for period 2026-10 is collected and assessed, giving Wholesaler C an off_posted_violation_count of 3."
            - "A second invoice dated 2026-11-04T00:00:00Z carries two single-case lines charged at 115900 and 111700, so the two findings are 4100 and 8300 cents."
            - "A second audit for period 2026-11 is opened and collected."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "NV", program_name: "Nevada Price Posting Program", off_posted_penalty_rate_pct: 0.375 }
              as: ComplianceOfficer
              captures: { prog_nv: $.data.id }
            - call: "POST /wholesalers"
