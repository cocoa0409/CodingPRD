    claim_type: correct_result
    grounds:
    - calculations.employer_hiring_rate
    distinguishing_aspect: An employer with zero completed matches reads hiring_rate_pct == 0.00 (not null, not an error) for both variants, and
      COHORT without cohort dates is a schema error.
    test_recipe:
      setup:
      - Employer emp AUTHORIZED; no matches exist
      setup_api_calls:
      - call: POST /skillbridge/employers
        payload:
          legal_name: Acme Logistics LLC
          industry_code: LOG
        as: ProgramOffice
        captures:
          emp: $.data.id
      - call: POST /skillbridge/employers/${emp}/authorize
        payload: {}
        as: ProgramOffice
      trigger:
      - call: GET /skillbridge/employers/${emp}/hiring-rate
        as: ProgramOffice
        captures:
          d_variant: $.data.variant
          d_completed: $.data.completed_count
          d_rate: $.data.hiring_rate_pct
      - call: GET /skillbridge/employers/${emp}/hiring-rate?variant=COHORT
        as: ProgramOffice
      - call: GET /skillbridge/employers/${emp}/hiring-rate?variant=COHORT&cohort_start_date=2027-01-01&cohort_end_date=2027-01-31
        as: ProgramOffice
        captures:
          c_completed: $.data.completed_count
          c_converted: $.data.converted_count
          c_rate: $.data.hiring_rate_pct
          c_ws: $.data.window_start_date
      assert:
      - 'default variant is ROLLING: completed_count == 0, hiring_rate_pct == 0.00 (zero denominator pinned to 0.00)'
      - 'COHORT without cohort_start_date/cohort_end_date: ERR_VALIDATION (400)'
      - 'COHORT [2027-01-01, 2027-01-31]: window_start_date echoes 2027-01-01, completed_count == 0, converted_count == 0, hiring_rate_pct ==
        0.00'
