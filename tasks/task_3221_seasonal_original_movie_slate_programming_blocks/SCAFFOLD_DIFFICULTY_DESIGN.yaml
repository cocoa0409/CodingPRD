            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc_a}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t2}", location_id: "${loc_b}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
            - call: "POST /slate/talent"
              payload: { studio_id: "${studio_id}", stage_name: "Star A", availability_windows: [{ start: "2027-03-01T00:00:00Z", end: "2027-03-15T00:00:00Z" }, { start: "2027-03-15T00:00:00Z", end: "2027-04-01T00:00:00Z" }] }
              as: TalentAgent
