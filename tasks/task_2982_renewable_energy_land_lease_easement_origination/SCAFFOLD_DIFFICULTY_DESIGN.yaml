              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "PUBLIC_ROAD", setback_feet: 100, encumbrance_rate_per_acre: 0.04, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-1188-004", county_fips: "48453", landowner_id: "${l1_id}", gross_acres: 125.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_clean_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-1188-007", county_fips: "48453", landowner_id: "${l1_id}", gross_acres: 90.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_blocked_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_blocked_id}", item_type: "TAX_LIEN", severity: "BLOCKING", curative_cost_cents: 190000 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { ti_lien_id: "$.data.id" }
            - call: "POST /land-origination/corridors"
              payload: { route_name: "Bluestem 345kV Collector", total_length_m: 5000, voltage_class: "COLLECTION_34_5KV", buffer_m: 50 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { cor_id: "$.data.id" }
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${cor_id}", parcel_id: "${p_clean_id}", crossing_kind: "COLLECTION_LINE", station_start_m: 1000, station_end_m: 1500, occupancy_window_start: "2026-09-01T00:00:00Z", occupancy_window_end: "2026-10-01T00:00:00Z" }
              as: LandAgent
