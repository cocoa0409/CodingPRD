# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not authorized for endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "entity_backed role's X-User-ID does not match the resource owner" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-referenced FK does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a state permitting this transition" }
  - { id: ERR_PROGRAM_LOCKED_DOWN, http: 409, condition: "Program.posture == LOCKDOWN blocks the operation" }
  - { id: ERR_INCIDENT_ON_INVALID_SESSION, http: 409, condition: "IncidentReport requires session in IN_PROGRESS or later" }
  - { id: ERR_INSUFFICIENT_REVIEWER_LEVEL, http: 409, condition: "Supervision reviewer lacks status=CERTIFIED or level<4" }
  - { id: ERR_CLINICAL_REQUIRES_CRITICAL, http: 409, condition: "Escalation requires severity=CRITICAL" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 409, condition: "PeerGroup.status != ACTIVE" }
  - { id: ERR_PROGRAM_CAUTION_BLOCKS_ENROLLMENT, http: 409, condition: "Program.posture == CAUTION blocks new Enrollment" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end_at <= start_at" }
  - { id: ERR_ROOM_OVERLAP, http: 409, condition: "Room booking conflict (half-open interval)" }
  - { id: ERR_FACILITATOR_BUFFER_CONFLICT, http: 409, condition: "Facilitator 30-minute buffer conflict" }
  - { id: ERR_AGREEMENT_EXPIRED, http: 422, condition: "ConfidentialityAgreement expires_at <= signed_at OR <= current_utc" }
  - { id: ERR_AGREEMENT_VERSION_REGRESSION, http: 409, condition: "agreement_version not strictly greater than existing version" }
  - { id: ERR_COFACILITATOR_SAME_AS_PRIMARY, http: 422, condition: "cofacilitator_id == primary_facilitator_id" }
  - { id: ERR_INVALID_CAPACITY, http: 422, condition: "Capacity must be >= 1" }
  - { id: ERR_GROUP_AT_CAPACITY, http: 409, condition: "active_enrollment_count >= base_capacity blocks confirmation" }
  - { id: ERR_FACILITATOR_LEVEL_TOO_LOW, http: 409, condition: "primary_facilitator.level < required_facilitator_level" }
  - { id: ERR_SUPERVISION_REQUIRED, http: 409, condition: "primary_facilitator.supervision_required == true" }
  - { id: ERR_MODALITY_MISMATCH, http: 422, condition: "access_modality incompatible with PeerGroup.modality or virtual_link_token invalid" }
  - { id: ERR_SURVEY_INVALID, http: 422, condition: "Survey rating out of range or participant did not attend" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Email already registered on another Participant or Facilitator" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operational administrator; can do all write operations"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs, POST /rooms, POST /training-courses"
      - "POST /programs/{pid}/groups/* (create/activate/pause/resume/retire)"
      - "POST /facilitators (create), all facilitator lifecycle actions"
      - "POST /participants (create), all participant lifecycle actions"
      - "POST /_clock/set_current_utc"
      - "POST /incidents/{iid}/acknowledge, resolve, escalate"
    shared_operations:
      - "All GET endpoints"
      - "POST enrollments, attendance, supervision-reviews"

  - name: Facilitator
    description: "Volunteer facilitator (entity_backed); can view own profile, lead sessions, raise incidents"
    identity: "entity_backed:Facilitator"
    exclusive_operations:
      - "POST sessions/{sid}/complete (when primary or cofacilitator on that session)"
      - "POST attendance/{aid}/void (when assigned to that session)"
    shared_operations:
      - "GET own profile, sessions, attendance, incidents"
      - "POST incidents (raise)"

  - name: Participant
    description: "Registered participant (entity_backed); manages own enrollments, check-ins, surveys"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /programs/{pid}/groups/{gid}/sessions/{sid}/surveys (must have attended)"
      - "POST own attendance check-in/check-out (participant_id == X-User-ID)"
      - "POST own enrollment confirm/release (participant_id == X-User-ID)"
    shared_operations:
      - "GET own profile, enrollments, agreements, referrals"
      - "POST /participants/{pid}/agreements (when pid == X-User-ID)"

  - name: ClinicalCoordinator
    description: "Clinical services liaison; manages escalated referrals"
    identity: "opaque"
    exclusive_operations:
      - "POST /participants/{pid}/referrals/{rid}/accept, decline, complete"
    shared_operations:
      - "GET participants, referrals, incidents (read-only for triage)"
