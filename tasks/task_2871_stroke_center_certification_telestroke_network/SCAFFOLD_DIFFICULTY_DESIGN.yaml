        as: EdPhysician
        as_user_id: ed_ann
        captures:
          nl_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:06:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes/${nl_id}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:08:00Z'
        as: ProgramCoordinator
      - call: GET /stroke-network/code-strokes/${nl_id}
        as: EdPhysician
        captures:
          nl_v: $.data.version
      - call: POST /stroke-network/consults
        payload:
          case_id: ${nl_id}
          agreement_id: ${agr_id}
          requested_privilege_scope: CONSULT_AND_THROMBOLYSIS
          expected_case_version: ${nl_v}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          nl_k: $.data.id
      trigger:
      - call: POST /stroke-network/consults/${nl_k}/decline
        payload:
          last_decline_reason: already at another bedside
        as: Neurologist
        as_user_id: ${n1_id}
      - call: GET /stroke-network/consults/${nl_k}
        as: EdPhysician
        captures:
          mid_status: $.data.status
          mid_assigned: $.data.assigned_neurologist_id
          mid_attempts: $.data.routing_attempt_count
          mid_declines: $.data.decline_count
      - call: POST /stroke-network/consults/${nl_k}/decline
        payload:
          last_decline_reason: no capacity on the stroke service
        as: Neurologist
        as_user_id: ${n2_id}
      assert:
      - ${mid_status} == ASSIGNED — the first decline did NOT terminate the consult, it looped it back through REQUESTED and out again in the same request
      - ${mid_assigned} == ${n2_id} — the rank-20 neurologist, because the decliner was appended to excluded_neurologist_ids BEFORE the selector re-ran
      - ${mid_attempts} == 2 and ${mid_declines} == 1
      - TelestrokeConsult.${nl_k}.status == ESCALATED_UNFILLED after the second decline — the loop exits instead of taking a third lap
      - TelestrokeConsult.${nl_k}.assigned_neurologist_id == null
      - TelestrokeConsult.${nl_k}.decline_count == 2 == CONSULT_DECLINE_LIMIT
      - TelestrokeConsult.${nl_k}.routing_attempt_count == 2, NOT 3 — the escalating decline never runs a routing pass
      - TelestrokeConsult.${nl_k}.excluded_neurologist_ids contains both ${n1_id} and ${n2_id}
      - Neurologist.${n1_id}.active_consult_count == 0 and Neurologist.${n2_id}.active_consult_count == 0
      - Neurologist.${n1_id}.completed_consult_count == 0 and Neurologist.${n2_id}.completed_consult_count == 0 — a decline is not a completion
      - exactly one SYSTEM_DETECTED ProtocolDeviation with deviation_type CONSULT_UNFILLED and severity MAJOR exists on case ${nl_id}, so CodeStrokeCase.${nl_id}.deviation_count == 1 (the first decline created none)
      - CodeStrokeCase.${nl_id}.status == CONSULT_IN_PROGRESS — the case does not rewind when its consult escalates
  - name: checklist_amendment_rewinds_determination_while_the_case_self_loops
    grounds:
