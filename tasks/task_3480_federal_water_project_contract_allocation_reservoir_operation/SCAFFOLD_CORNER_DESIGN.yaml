      - name: record_delivery_over_outstanding_returns_invalid_quantity
        claim_type: Violation → Error
        grounds:
          - state_machines.DeliveryOrder.fulfillment_status
          - errors.ERR_INVALID_QUANTITY
        distinguishing_aspect: "A record-delivery amount above the outstanding balance (ordered 400, delivered 150, then 300) fails 400 ERR_INVALID_QUANTITY; exactly the outstanding 250 succeeds and completes the order."
        test_recipe:
          setup:
            - "Base announced fixture; SR order 400 af with 150 delivered."
          setup_api_calls:
            - *b_clock
