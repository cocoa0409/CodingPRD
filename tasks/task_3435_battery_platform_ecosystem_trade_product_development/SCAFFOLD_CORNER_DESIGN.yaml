# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3435_battery_platform_ecosystem_trade_product_development
#
# Breadth probe over SCAFFOLD.yaml sections 1.1-1.7: everything the difficulty
# design does not already exercise. Sections/claim types follow the
# claim-extraction-guide taxonomy.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: platform_create_returns_computed_defaults
        claim_type: Creation
        grounds:
          - entities.BatteryPlatform
          - endpoints.POST_/battery-ecosystem/battery-platforms
        distinguishing_aspect: "A platform created with only required fields returns 201 with status ACTIVE, current_generation 0, version 1, and server-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at the server default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_platform
              call: "POST /battery-ecosystem/battery-platforms"
              payload: { code: "MX12", interface_key: "INTERFACE_B", chemistry_family: "LFP", backward_commitment_years: 8, forward_commitment_generations: 2 }
              as: PlatformAdmin
              captures: { pf: $.data.id }
          assert:
            - "the response status is 201 with response_type object and meta.api_request_id present"
            - "BatteryPlatform.${pf}.status == ACTIVE and current_generation == 0 and version == 1"
            - "id, created_at and updated_at are non-null and server-stamped"

      - name: pack_create_system_field_input_ignored
        claim_type: System Fields
        grounds:
          - entities.BatteryPack.fields.certification_status
          - endpoints.POST_/battery-ecosystem/battery-packs
        distinguishing_aspect: "Client-supplied certification_status and version in the create body are ignored: the pack still starts DESIGN with version 1."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One platform."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-SYS", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90, certification_status: "CERTIFIED", version: 99, safety_hold: true }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
          assert:
            - "BatteryPack.${pk}.certification_status == DESIGN (client CERTIFIED ignored)"
            - "BatteryPack.${pk}.version == 1 and safety_hold == false (client values ignored)"

      - name: pack_create_missing_required_sku_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.BatteryPack.fields.sku
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Omitting the required sku fails at validation priority 5 with ERR_VALIDATION and HTTP 400 before any state or business rule runs."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One platform."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and the response status is 400 with response_type error"

      - name: tool_create_with_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ToolModel.fields.trade
          - errors.ERR_VALIDATION
        distinguishing_aspect: "An out-of-enum trade value is a 400 ERR_VALIDATION, not a 404 or a silent coercion."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One platform."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-X", trade: "UNDERWATER", category: "DRILL", tier: "CONSUMER", corded_conversion: false, avg_power_draw_w: 250, min_pack_generation: 1, max_pack_generation: 1, replacement_price_cents: 9000, warranty_days: 360, free_replacement_days: 30, torque_min_nm: 2, torque_max_nm: 60 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (trade must be one of PLUMBING | ELECTRICAL | HVAC | CARPENTRY | MASONRY | AUTOMOTIVE)"

      - name: tool_create_corded_without_runtime_target_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ToolModel.fields.runtime_target_min
          - validations.priority_5
        distinguishing_aspect: "runtime_target_min is conditionally required: corded_conversion true without it fails, while corded_conversion false without it succeeds — the conditional requirement is the claim under test."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One platform."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-C1", trade: "MASONRY", category: "SAW", tier: "TRADE_SPECIALIST", corded_conversion: true, avg_power_draw_w: 900, min_pack_generation: 1, max_pack_generation: 1, replacement_price_cents: 40000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 5, torque_max_nm: 300 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
            - call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-C2", trade: "MASONRY", category: "SAW", tier: "TRADE_SPECIALIST", corded_conversion: false, avg_power_draw_w: 900, min_pack_generation: 1, max_pack_generation: 1, replacement_price_cents: 40000, warranty_days: 360, free_replacement_days: 60, torque_min_nm: 5, torque_max_nm: 300 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { ok_tool: $.data.id }
          assert:
            - "first create fails with error_id ERR_VALIDATION (runtime_target_min required when corded_conversion is true)"
            - "second create (corded_conversion false, no runtime_target_min) succeeds: ToolModel.${ok_tool} exists"

      - name: tracked_assets_list_filters_by_account_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/battery-ecosystem/tracked-assets
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three assets on one account, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; a foreign account filter returns 0 rows."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, pack, STANDARD account, and a second empty account; three battery assets on the first account."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - &k_pack_design
              call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-LST", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - &k_account_std
              call: "POST /battery-ecosystem/asset-accounts"
              payload: { org_name: "Paginators Inc", tier: "STANDARD" }
              as: PlatformAdmin
              captures: { ac: $.data.id }
            - call: "POST /battery-ecosystem/asset-accounts"
              payload: { org_name: "Empty Co", tier: "STANDARD" }
              as: PlatformAdmin
              captures: { ac2: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-P-1", manufactured_at: "2026-08-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-P-2", manufactured_at: "2026-08-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-P-3", manufactured_at: "2026-08-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
          trigger:
            - call: "GET /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", limit: 2, offset: 0 }
              as: AccountManager
              as_user_id: "${ac}"
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /battery-ecosystem/tracked-assets?account_id=${ac}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /battery-ecosystem/tracked-assets?account_id=${ac2} returns 0 rows with total_count == 0"
            - "an unfiltered GET /battery-ecosystem/tracked-assets uses pagination defaults limit 10 / offset 0"

      - name: pack_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/battery-ecosystem/battery-packs/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated pack id yields 404 ERR_NOT_FOUND, not a 400."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Empty pack catalog."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /battery-ecosystem/battery-packs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and the response status is 404"

      - name: asset_first_paired_at_stamped_from_logical_clock
        claim_type: Computed Fields
        grounds:
          - entities.TrackedAsset.fields.first_paired_at
        distinguishing_aspect: "first_paired_at is system-stamped from the logical clock at creation (the ACTIVATION warranty basis); setting the clock to 2026-07-04 before registration makes that exact value observable."
        test_recipe:
          setup: ["Logical clock 2026-07-04. Platform, pack, account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T00:00:00Z" }
              as: PlatformAdmin
            - *k_platform
            - *k_pack_design
            - *k_account_std
          trigger:
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-CLK-1", manufactured_at: "2026-01-15T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
          assert:
            - "TrackedAsset.${a1}.first_paired_at == 2026-07-04T00:00:00Z (logical clock, not wall clock)"
            - "TrackedAsset.${a1}.manufactured_at == 2026-01-15T00:00:00Z (input preserved)"
            - "TrackedAsset.${a1}.status == ACTIVE and is_replacement_unit == false and anti_theft_lock_enabled == false (defaults)"

      - name: claim_create_auto_assigns_least_booked_center_with_created_at_tiebreak
        claim_type: Computed Fields
        grounds:
          - calculations.service_center_selection
          - entities.WarrantyClaim.fields.service_center_id
        distinguishing_aspect: "The selector is fully deterministic: least booked_count for the service_date wins, ties break on center created_at ASC (never id). Three claims over two equal-capacity centers land sc1, sc2, sc1."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, CERTIFIED pack, account with three battery assets. Centers SC-A (created first) and SC-B, both BATTERY_SERVICE capacity 5."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - &k_center_a
              call: "POST /battery-ecosystem/service-centers"
              payload: { code: "SC-A", region: "MW", capabilities: ["BATTERY_SERVICE"], daily_capacity: 5 }
              as: PlatformAdmin
              captures: { sca: $.data.id }
            - call: "POST /battery-ecosystem/service-centers"
              payload: { code: "SC-B", region: "MW", capabilities: ["BATTERY_SERVICE"], daily_capacity: 5 }
              as: PlatformAdmin
              captures: { scb: $.data.id }
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-S-1", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-S-2", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a2: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-S-3", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F1", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c1: $.data.id, c1_center: $.data.service_center_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a2}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F2", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c2: $.data.id, c2_center: $.data.service_center_id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a3}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F3", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c3: $.data.id, c3_center: $.data.service_center_id }
          assert:
            - "claim 1 -> ${sca} (tie at 0 booked, earliest created_at)"
            - "claim 2 -> ${scb} (SC-A now leads 1-0)"
            - "claim 3 -> ${sca} (tie at 1-1, created_at tie-break again)"
            - "no claim required the client to name a center: service_center_id is system-assigned"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: pack_decide_from_design_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.BatteryPack
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "decide-certification is only valid from SUBMITTED; calling it on a DESIGN pack fails with ERR_INVALID_STATE and leaves the pack untouched."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; pack in DESIGN (never submitted)."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
          trigger:
            - call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and the response status is 409"
            - "BatteryPack.${pk}.certification_status remains DESIGN"

      - name: pack_recalled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BatteryPack.CERTIFIED_to_RECALLED
          - state_machines.BatteryPack.REJECTED_to_SUBMITTED
        distinguishing_aspect: "RECALLED is terminal: after a RECALL bulletin pulls the pack, both submit-certification and decide-certification are rejected with ERR_INVALID_STATE — the reject/resubmit cycle cannot resurrect it."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; pack CERTIFIED then RECALLED via a RECALL bulletin."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - &k_submit_pack
              call: "POST /battery-ecosystem/battery-packs/${pk}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
            - &k_certify_pack
              call: "POST /battery-ecosystem/battery-packs/${pk}/decide-certification"
              payload: { decision: "CERTIFIED" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
            - call: "POST /battery-ecosystem/safety-bulletins"
              payload: { platform_id: "${pf}", battery_pack_ids: ["${pk}"], severity: "RECALL", title: "recall", effective_from: "2026-09-01T00:00:00Z" }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
          trigger:
            - call: "POST /battery-ecosystem/battery-packs/${pk}/submit-certification"
              payload: {}
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "submit-certification on the RECALLED pack fails with error_id ERR_INVALID_STATE"
            - "BatteryPack.${pk}.certification_status remains RECALLED"

      - name: insight_decide_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ResearchInsight
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "ADOPTED and REJECTED are terminal for insights: a second decide on an already-decided insight fails with ERR_INVALID_STATE; the adopted counts do not double-count."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; tool in CONCEPT; one FIELD_RESEARCH insight already ADOPTED."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - &k_tool_basic
              call: "POST /battery-ecosystem/tool-models"
              payload: { platform_id: "${pf}", model_code: "T-IDEM", trade: "CARPENTRY", category: "DRILL", tier: "CONSUMER", corded_conversion: false, avg_power_draw_w: 250, min_pack_generation: 1, max_pack_generation: 1, replacement_price_cents: 9000, warranty_days: 360, free_replacement_days: 30, torque_min_nm: 2, torque_max_nm: 60 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { tm: $.data.id, tm_v: $.data.version }
            - call: "POST /battery-ecosystem/insights"
              payload: { tool_model_id: "${tm}", kind: "FIELD_RESEARCH", summary: "fr", severity: "LOW" }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { i1: $.data.id }
            - call: "POST /battery-ecosystem/insights/${i1}/decide"
              payload: { decision: "ADOPTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
          trigger:
            - call: "POST /battery-ecosystem/insights/${i1}/decide"
              payload: { decision: "REJECTED" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "second decide fails with error_id ERR_INVALID_STATE"
            - "ResearchInsight.${i1}.status remains ADOPTED and ToolModel.${tm}.adopted_field_research_count == 1"

      - name: tool_skip_stage_transition_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ToolModel
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CONCEPT -> LAUNCHED is not an edge even though both states exist: the stage machine only allows the declared edges, and the failure carries ERR_INVALID_STATE while the OCC version is NOT consumed (no mutation, no version bump)."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; tool freshly created in CONCEPT at version 1."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_tool_basic
          trigger:
            - call: "POST /battery-ecosystem/tool-models/${tm}/transition"
              payload: { to_stage: "LAUNCHED", expected_tool_model_version: "${tm_v}" }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (skip-stage is a state violation, not a stale-version one)"
            - "ToolModel.${tm}.stage == CONCEPT and version == 1 still"

      - name: asset_reported_lost_blocks_claim_create
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TrackedAsset.ACTIVE_to_REPORTED_LOST
          - validations.priority_6
        distinguishing_aspect: "A claim requires the asset ACTIVE; an asset in REPORTED_LOST rejects claim creation with ERR_INVALID_STATE, and recovering the asset (REPORTED_LOST -> ACTIVE) re-opens claim creation."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, CERTIFIED pack, account, center; one battery asset reported lost."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - *k_center_a
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-LOST-1", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets/${a1}/transition"
              payload: { to_status: "REPORTED_LOST" }
              as: AccountManager
              as_user_id: "${ac}"
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "NO_CHARGE", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { err: $.data.error_id }
            - call: "POST /battery-ecosystem/tracked-assets/${a1}/transition"
              payload: { to_status: "ACTIVE" }
              as: AccountManager
              as_user_id: "${ac}"
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "NO_CHARGE", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c1: $.data.id }
          assert:
            - "claim creation against REPORTED_LOST fails with error_id ERR_INVALID_STATE"
            - "after recovery (REPORTED_LOST -> ACTIVE), the identical claim succeeds: WarrantyClaim.${c1} exists"

      - name: listing_create_supersedes_prior_listing
        claim_type: side_effect_execution
        grounds:
          - state_machines.DistributionListing
          - endpoints.POST_/battery-ecosystem/listings
          - entities.DistributionListing.fields.superseded_by_listing_id
        distinguishing_aspect: "Creating a listing for a (partner, product) pair that already has a PROPOSED listing ends the prior one and links it via superseded_by_listing_id; both effects are visible in one create."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, CERTIFIED pack, INDUSTRIAL partner (version 1)."]
          setup_api_calls:
            - *k_clock
            - *k_platform
