              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${prof_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "INCINERATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000001", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 1000.0, declared_container_count: 4, is_bulk: false }] }
              as: ReceivingClerk
              captures: { man_id: $.data.id }
            - call: "POST /tsdf/manifests/${man_id}/receive"
