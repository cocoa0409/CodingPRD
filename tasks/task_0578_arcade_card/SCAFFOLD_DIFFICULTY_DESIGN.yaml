  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: chip_bonus_liability_conserved_confirm_revert
        grounds:
          - state_machines.PartyBooking.DRAFT_to_CONFIRMED
          - state_machines.PartyBooking.CONFIRMED_to_DRAFT
          - entities.GameCard.bonus_chip_balance_cents
          - entities.CardLedgerEntry.bonus_delta_cents
        distinguishing_aspect: "Conserved quantity = total bonus chip liability (sum of GameCard.bonus_chip_balance_cents over provisioned cards). Confirm loads 2*1000=2000; revert claws back 2*1000; the sum returns to its pre-confirm value 0 (BONUS_GRANT +1000 exactly offset by BONUS_CLAWBACK -1000 per card)."
        test_recipe:
          setup:
            - "Room, package (included_chip 1000), host, booking of 2 guests confirmed then its two provisioned card ids captured."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Room J", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Gold", base_price_cents: 20000, included_guests: 10, included_hours: 2, included_chip_cents: 1000, tier: "GOLD", combo_name: "Combo", combo_value_cents: 3000 }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "host10@x.com", full_name: "Host Ten" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room_id}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 2 }
              as: Coordinator
              captures: { bid: $.data.id }
            - call: "POST /party-bookings/${bid}/confirm"
              payload: {}
              as: Coordinator
            - call: "GET /wristbands"
              payload: { booking_id: "${bid}" }
              as: Coordinator
              captures: { card0: "$.data[0].card_id", card1: "$.data[1].card_id" }
          trigger:
            - call: "POST /party-bookings/${bid}/revert-to-draft"
              payload: {}
              as: Coordinator
          assert:
            - "GameCard.${card0}.bonus_chip_balance_cents == 0 after revert"
            - "GameCard.${card1}.bonus_chip_balance_cents == 0 after revert"
            - "sum over {card0,card1} of bonus_chip_balance_cents == 0 (total bonus chip liability returned to pre-confirm value)"

      - name: points_outstanding_conserved_reserve_cancel
        grounds:
          - state_machines.Redemption.RESERVED_to_CANCELLED
          - entities.GameCard.ticket_points_balance
          - entities.PrizeItem.reserved_qty
          - entities.PrizeItem.stock_qty
        distinguishing_aspect: "Conserved quantity = e-ticket points outstanding + prize stock (a different conserved quantity than chip cents): reserve holds 1000 points and reserves 2 units; cancel refunds exactly 1000 points and releases 2 units, so ticket_points_balance returns to 1000 and prize stock_qty/reserved_qty return to 10/0."
        test_recipe:
          setup:
            - "Attraction (cost 100, award 1000), prize (price 500, stock 10), member+card funded to 1000 points via one play."
          setup_api_calls:
            - call: "POST /attractions"
              payload: { name: "Racer", chip_cost_cents: 100, points_award: 1000 }
              as: Manager
              captures: { attr_id: $.data.id }
            - call: "POST /prize-items"
              payload: { name: "Teddy", points_price: 500, stock_qty: 10 }
              as: Manager
              captures: { prize_id: $.data.id }
            - call: "POST /members"
              payload: { email: "inv@x.com", full_name: "Invariant" }
              as: Cashier
              captures: { m_id: $.data.id }
            - call: "POST /game-cards"
              payload: { owner_member_id: "${m_id}" }
              as: Cashier
              captures: { c_id: $.data.id }
            - call: "POST /game-cards/${c_id}/activate"
              payload: {}
              as: Cashier
            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 200 }
              as: Cashier
            - call: "POST /game-plays"
              payload: { card_id: "${c_id}", attraction_id: "${attr_id}" }
              as: Attendant
            - call: "GET /game-cards/${c_id}"
              payload: {}
              as: Attendant
              captures: { cv: $.data.version }
            - call: "POST /redemptions"
              payload: { card_id: "${c_id}", prize_item_id: "${prize_id}", quantity: 2, expected_card_version: "${cv}" }
              as: Attendant
              captures: { red_id: $.data.id }
          trigger:
            - call: "POST /redemptions/${red_id}/cancel"
              payload: {}
              as: Attendant
          assert:
            - "GameCard.${c_id}.ticket_points_balance == 1000 after cancel (hold of 1000 fully refunded)"
            - "PrizeItem.${prize_id}.reserved_qty == 0 after cancel"
            - "PrizeItem.${prize_id}.stock_qty == 10 (unchanged across reserve+cancel)"
            - "Redemption.${red_id}.status == CANCELLED"
