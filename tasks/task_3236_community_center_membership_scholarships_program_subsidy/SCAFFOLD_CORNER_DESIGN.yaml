# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3236_community_center_membership_scholarships_program_subsidy
#
# Breadth probe: every claim the 1.1-1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that 1.8
# already covers appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: association_create_returns_defaults_and_common_fields
        claim_type: Creation
        grounds:
          - entities.Association
          - endpoints.POST_/associations
        distinguishing_aspect: "An association created with only name, ami_base_cents and campaign_year comes back 201 with reciprocity_enabled defaulted to true, version 1, and system id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Association.${assoc_id}.reciprocity_enabled == true (default applied)"
            - "Association.${assoc_id}.version == 1"
            - "the response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: category_create_rejects_invalid_household_type_enum
        claim_type: Type Constraints
        grounds:
          - entities.MembershipCategory.fields.household_type
          - errors.ERR_INVALID_REQUEST
          - validations.priority_6
        distinguishing_aspect: "household_type is a closed enum; HOUSEHOLD is not in {ADULT, TWO_ADULT, FAMILY, SENIOR, YOUNG_ADULT, TEEN} and must be rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Association and branch exist."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
          trigger:
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Weird", household_type: "HOUSEHOLD", joining_fee_cents: 1000, monthly_dues_cents: 8000, max_adults: 2, max_dependents: 4 }
              as: BranchDirector
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST"
            - "no category is created: GET /categories?branch_id=${branch_id} returns an empty list"

      - name: membership_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Membership.fields.status
          - entities.Membership.fields.lifetime_billed_cents
        distinguishing_aspect: "system/computed fields (status, draft_status, assistance_pct, lifetime_billed_cents) supplied in the POST /memberships body are ignored; the created row shows status ACTIVE, draft_status CURRENT, assistance_pct 0."
        test_recipe:
          setup:
            - "Association, branch, category (joining fee 0, dues 8000), member exist."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
          assert:
            - "Membership.${mship_id}.status == ACTIVE and draft_status == CURRENT"
            - "Membership.${mship_id}.assistance_pct == 0"
            - "Membership.${mship_id}.lifetime_billed_cents == 0"
            - "Membership.${mship_id}.hold_days_used_trailing_12mo == 0"

      - name: member_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/members/{memberId}
          - errors.ERR_NOT_FOUND
          - validations.priority_3
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the member path produces 404 ERR_NOT_FOUND, not 400 and not a generic 500."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /members/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id ERR_NOT_FOUND"

      - name: memberships_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/memberships
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three memberships at a branch, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup:
            - "Association, branch, ADULT category, three members each holding a membership."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M One", email: "m1@x.com", birth_date: "1990-01-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M Two", email: "m2@x.com", birth_date: "1990-01-02", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { m2: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M Three", email: "m3@x.com", birth_date: "1990-01-03", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { m3: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${m1}", member_ids: ["${m1}"] }
              as: FrontDesk
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${m2}", member_ids: ["${m2}"] }
              as: FrontDesk
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${m3}", member_ids: ["${m3}"] }
              as: FrontDesk
          trigger:
            - call: "GET /memberships"
              payload: { branch_id: "${branch_id}", limit: 2, offset: 0 }
              as: BranchDirector
          assert:
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /memberships?branch_id=${branch_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /memberships with no params returns 3 rows with limit defaulting to 10 and offset to 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: approve_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ScholarshipApplication.UNDER_REVIEW_to_APPROVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Approve is declared only from UNDER_REVIEW; invoking it on a fresh SUBMITTED application fails 409 ERR_INVALID_STATE and neither pool nor membership is touched."
        test_recipe:
          setup:
            - "Association, branch, category, member, ACTIVE membership, one SUBMITTED application (never reviewed)."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Applicant", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id, mship_v: $.data.version }
            - call: "POST /scholarship-applications"
              payload: { branch_id: "${branch_id}", membership_id: "${mship_id}", applicant_member_id: "${member_id}", household_size: 1, annual_income_cents: 1000000, documentation: ["TAX_RETURN"] }
              as: Member
              as_user_id: "${member_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /scholarship-applications/${app_id}/approve"
              payload: { expected_membership_version: "${mship_v}" }
              as: BranchDirector
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_INVALID_STATE"
            - "ScholarshipApplication.${app_id}.status remains SUBMITTED"
            - "Branch.${branch_id}.scholarship_pool_obligated_cents == 0"

      - name: cancelled_membership_is_terminal_for_all_actions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Membership
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is terminal: hold, resume, reinstate and cancel itself on a CANCELLED membership all fail 409 ERR_INVALID_STATE (or ERR_ALREADY_TERMINAL); nothing resurrects it."
        test_recipe:
          setup:
            - "Association, branch, category, member; membership created then cancelled."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
            - call: "POST /memberships/${mship_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /memberships/${mship_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /memberships/${mship_id}/reinstate"
              payload: {}
              as: BranchDirector
              captures: { err2: $.data.error_id }
          assert:
            - "resume returns 409 ERR_INVALID_STATE"
            - "reinstate returns 409 ERR_INVALID_STATE (reinstate is declared only from LAPSED)"
            - "Membership.${mship_id}.status remains CANCELLED"

      - name: waitlist_promotion_is_fifo_with_created_at_tiebreak
        claim_type: side_effect_execution
        grounds:
          - state_machines.Registration.REGISTERED_to_CANCELLED
          - state_machines.Registration.WAITLISTED_to_REGISTERED
        distinguishing_aspect: "Cancelling the head REGISTERED seat promotes the LOWEST waitlist_position (created earlier beats later); the promoted registration's fee is computed at promotion and positions compact."
        test_recipe:
          setup:
            - "Branch, space, program (priority 0), session REG_OPEN with capacity 1: member A REGISTERED, members B then C WAITLISTED at positions 1 and 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Studio 1", kind: "STUDIO", capacity: 30, dropin_capacity: 5 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /programs"
              payload: { branch_id: "${branch_id}", name: "Hoops", kind: "SPORTS", base_fee_cents: 4000, member_priority_days: 0 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-20", end_on: "2026-09-20", time_start: "18:00", time_end: "19:00", capacity: 1 }
              as: ProgramCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /members"
              payload: { full_name: "A One", email: "a@x.com", birth_date: "1990-01-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { ma: $.data.id }
            - call: "POST /members"
              payload: { full_name: "B Two", email: "b@x.com", birth_date: "1990-01-02", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { mb: $.data.id }
            - call: "POST /members"
              payload: { full_name: "C Three", email: "c@x.com", birth_date: "1990-01-03", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { mc: $.data.id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", member_id: "${ma}", participant_name: "A One", participant_birth_date: "1990-01-01" }
              as: FrontDesk
              captures: { reg_a: $.data.id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", member_id: "${mb}", participant_name: "B Two", participant_birth_date: "1990-01-02" }
              as: FrontDesk
              captures: { reg_b: $.data.id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", member_id: "${mc}", participant_name: "C Three", participant_birth_date: "1990-01-03" }
              as: FrontDesk
              captures: { reg_c: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_a}/cancel"
              payload: {}
              as: Member
              as_user_id: "${ma}"
          assert:
            - "Registration.${reg_b}.status == REGISTERED (head of line promoted) and waitlist_position == null"
            - "Registration.${reg_b}.fee_charged_cents == 6000 (NON_MEMBER 4000 * 1.5, computed at promotion)"
            - "Registration.${reg_c}.status == WAITLISTED with waitlist_position == 1 (compacted from 2)"
            - "ProgramSession.${sess_id}.enrolled_count == 1 and waitlist_count == 1"

      - name: clock_driven_session_window_transitions
        claim_type: valid_transition
        grounds:
          - state_machines.ProgramSession.SCHEDULED_to_REG_OPEN
          - state_machines.ProgramSession.REG_OPEN_to_REG_CLOSED
          - state_machines.ProgramSession.REG_CLOSED_to_COMPLETED
        distinguishing_aspect: "Session status flips purely from the logical clock: SCHEDULED before member_opens_on, REG_OPEN at member_opens_on, REG_CLOSED at end of start_on day, COMPLETED after end_on — with no explicit action calls."
        test_recipe:
          setup:
            - "Branch, space, program (member_priority_days 3), session start_on 2026-09-20 end_on 2026-09-21 (member_opens_on 2026-09-03, public_opens_on 2026-09-06)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Studio 1", kind: "STUDIO", capacity: 30, dropin_capacity: 5 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /programs"
              payload: { branch_id: "${branch_id}", name: "Hoops", kind: "SPORTS", base_fee_cents: 4000, member_priority_days: 3 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-20", end_on: "2026-09-21", time_start: "18:00", time_end: "19:00", capacity: 10 }
              as: ProgramCoordinator
              captures: { sess_id: $.data.id }
          trigger:
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { st0: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: AssociationAdmin
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { st1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T00:00:00Z" }
              as: AssociationAdmin
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { st2: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-22T00:00:00Z" }
              as: AssociationAdmin
            - call: "GET /sessions/${sess_id}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "status at 2026-09-01 == SCHEDULED"
            - "status at 2026-09-04 == REG_OPEN (member window opened 2026-09-03)"
            - "status at 2026-09-21 == REG_CLOSED (end of start_on day reached)"
            - "status at 2026-09-22 == COMPLETED (end_on passed)"

      - name: draft_fail_three_times_flips_delinquent_and_45_days_lapses
        claim_type: side_effect_execution
        grounds:
          - state_machines.Membership.draft_status:CURRENT_to_draft_status:RETRY_PENDING
          - state_machines.Membership.ACTIVE_to_LAPSED
        distinguishing_aspect: "Exactly the third consecutive fail attempt (attempt_count reaches 3) sets draft_status DELINQUENT and starts the clock; advancing the clock 45 days auto-lapses the membership and cascades to any award."
        test_recipe:
          setup:
            - "Member M with ACTIVE membership and one PENDING draft; clock 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
            - call: "GET /memberships/${mship_id}/drafts"
              payload: {}
              as: BranchDirector
              captures: { draft1: "$.data[0].id" }
          trigger:
            - call: "POST /drafts/${draft1}/fail"
              payload: {}
              as: BranchDirector
            - call: "POST /drafts/${draft1}/fail"
              payload: {}
              as: BranchDirector
            - call: "GET /memberships/${mship_id}"
              payload: {}
              as: BranchDirector
              captures: { ds2: $.data.draft_status }
            - call: "POST /drafts/${draft1}/fail"
              payload: {}
              as: BranchDirector
            - call: "GET /memberships/${mship_id}"
              payload: {}
              as: BranchDirector
              captures: { ds3: $.data.draft_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-17T00:00:00Z" }
              as: AssociationAdmin
            - call: "GET /memberships/${mship_id}"
              payload: {}
              as: BranchDirector
          assert:
            - "after 2 fails: draft_status == RETRY_PENDING, status == ACTIVE"
            - "after 3 fails: draft_status == DELINQUENT, delinquent_since == 2026-09-01"
            - "at 2026-10-17 (46 days later): Membership.${mship_id}.status == LAPSED"
            - "a fourth fail on the same FAILED draft returns 409 (attempt_count cap 3) ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:

      - name: sliding_scale_boundary_zero_point_eight_is_ineligible
        claim_type: threshold_boundary
        grounds:
          - calculations.sliding_scale_award
          - errors.ERR_AWARD_INELIGIBLE
        distinguishing_aspect: "income_ratio EXACTLY 0.8000 (round4 applied first) is ineligible — approve must fail ERR_AWARD_INELIGIBLE; 0.7999 would still take the 0.25 tier."
        test_recipe:
          setup:
            - "Association ami 5000000. Branch with ample pool. Member with ACTIVE membership, dues 8000. Application household_size 1, income 4000000 -> ratio round4(4000000/5000000) == 0.8000."
