    success_code: 200
    side_effects: []

  - method: POST
    path: /appeal-requests/{id}/board-review
    description: "Appeal board takes the case up."
    roles: [PlatformAppealBoard]
    input: []
    output: AppealRequest
    success_code: 200
    side_effects:
      - "SUBMITTED -> BOARD_REVIEW with board_started_at = clock_now"
      - "Segregation of duties: X-User-ID must differ from Submission.reviewed_by_user_id"

  - method: POST
    path: /appeal-requests/{id}/decide
    description: "Appeal decision: uphold, overturn, or partially overturn (three divergent cascades)."
    roles: [PlatformAppealBoard]
    input: [outcome, rationale, "overturned_rejection_reason_ids?"]
    output: AppealRequest
    success_code: 200
    side_effects:
      - "OVERTURNED: all cited reasons get appeal_disposition = OVERTURNED, overturn_ratio = 1.00, Submission -> APPROVED, FAILED mappings -> IN_PROGRESS, +STANDING_APPEAL_CREDIT"
      - "PARTIALLY_OVERTURNED: overturned_rejection_reason_ids must be a non-empty strict subset; only those reasons leave the penalty scope; Submission -> REJECTED without refreshing rejected_at"
      - "UPHELD: all cited reasons UPHELD, overturn_ratio = 0.00, Submission -> REJECTED_FINAL (terminal)"
      - "Every branch recomputes both PublisherAccount standing variants and enforces X-User-ID != Submission.reviewed_by_user_id"

  - method: POST
    path: /appeal-requests/{id}/withdraw
    description: "Publisher withdraws a filed appeal."
    roles: [ComplianceOfficer]
    input: ["reason_code?"]
    output: AppealRequest
    success_code: 200
    side_effects:
      - "SUBMITTED -> WITHDRAWN; Submission APPEAL_PENDING -> REJECTED without refreshing rejected_at, so the original appeal window keeps running"

