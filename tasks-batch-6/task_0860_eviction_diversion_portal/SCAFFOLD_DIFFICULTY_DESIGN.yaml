              payload: { to_status: "SCHEDULED", officer_id: "${off_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: Sheriff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OFFICER_UNAVAILABLE"
            - "http status == 409"
            - "LockoutOrder.${lock_b_id}.status == REQUESTED"

  - rule_id: compensating_invariant
    instances:
      - name: arrears_money_conservation_on_installment_payment
        grounds:
          - calculations.case_net_arrears
          - entities.Case.fields.claimed_arrears_cents
          - state_machines.Installment.DUE_to_PAID
        distinguishing_aspect: |
          Conserved quantity = money: for the case, net_arrears_cents + sum(PAID installment amounts)
          + sum(DISBURSED assistance) == claimed_arrears_cents (600000) is invariant across a payment.
          After paying one 100000 installment: 500000 + 100000 + 0 == 600000.
        test_recipe:
          setup:
            - "Case claimed 600000, ANSWERED; ACCEPTED plan total 600000 over 6 installments (100000 each)"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /cases/${case_id}"
              as: Clerk
              captures: { case_v: $.data.version }
            - call: "POST /payment-plans"
              payload: { case_id: "${case_id}", proposed_by: "LANDLORD", total_cents: 600000, installment_count: 6, first_due_date: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /payment-plans/${plan_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "GET /installments?payment_plan_id=${plan_id}"
              as: Clerk
              captures: { inst1_id: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${inst1_id}/transition"
              payload: { to_status: "PAID" }
              as: Tenant
              as_user_id: "${tn_id}"
          assert:
            - "Case.${case_id}.net_arrears_cents == 500000"
            - "Case.${case_id}.net_arrears_cents + 100000 (sum PAID installments) + 0 (sum DISBURSED assistance) == 600000 (claimed_arrears_cents)"

      - name: court_slot_conservation_on_schedule_then_cancel
        grounds:
          - entities.Court.fields.hearings_scheduled_count
          - state_machines.Hearing.SCHEDULED_to_CANCELLED
          - calculations.court_calendar_capacity
        distinguishing_aspect: |
          Conserved quantity = calendar slot count: Court.hearings_scheduled_count equals the number of
          SCHEDULED hearings on the court. A forward schedule (count 0 -> 1) paired with its compensating
          cancel (count 1 -> 0) leaves the count at its original 0 with no drift.
        test_recipe:
          setup:
            - "Court capacity 2; a case; one SCHEDULED hearing (count == 1)"
          setup_api_calls:
            - call: "POST /courts"
              payload: { name: "HC", jurisdiction_code: "J1", hearing_daily_capacity: 2 }
              as: Clerk
              captures: { court_id: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL", email: "l@x.com" }
              as: Clerk
              captures: { ll_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "TN", email: "t@x.com", household_income_cents: 200000, household_size: 3 }
              as: Clerk
              captures: { tn_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", landlord_id: "${ll_id}", tenant_id: "${tn_id}", filing_type: "NONPAYMENT", claimed_arrears_cents: 600000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", court_id: "${court_id}", hearing_type: "INITIAL", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Clerk
              captures: { hearing_id: $.data.id }
          trigger:
            - call: "POST /hearings/${hearing_id}/transition"
              payload: { to_status: "CANCELLED" }
              as: Clerk
          assert:
            - "Hearing.${hearing_id}.status == CANCELLED"
            - "Court.${court_id}.hearings_scheduled_count == 0"
