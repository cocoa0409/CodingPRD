          - errors[ERR_NO_TANK_LOCATED]
          - state_machines.TankProject.INTAKE_to_SURVEYED
          - entities.TankProject.fields.tanks_detected_count
        distinguishing_aspect: |
          Zero-count edge on a different metric (tanks_detected_count, not a concentration) reached through a
          different endpoint (POST /tank-projects/{id}/sweep-survey): a sweep that locates zero tanks is
          refused with ERR_NO_TANK_LOCATED, the project stays at INTAKE, and no method_score is minted even
          though the survey payload was otherwise well formed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "One NJ Property and one TankProject at status INTAKE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
