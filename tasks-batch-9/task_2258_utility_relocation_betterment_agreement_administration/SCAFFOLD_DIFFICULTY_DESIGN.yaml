  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_revision_cycle_reenters_submitted_three_times_then_hits_the_limit
        grounds:
          - state_machines.RelocationPlan.SUBMITTED_to_UNDER_REVIEW
          - state_machines.RelocationPlan.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.RelocationPlan.REVISION_REQUESTED_to_SUBMITTED
          - entities.RelocationPlan.fields.revision_round
          - validations[priority=26]
        distinguishing_aspect: |
          The RelocationPlan cycle SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED is
          walked three full times; the state name repeats while revision_round strictly increases
          0 -> 1 -> 2 -> 3, and the fourth resubmission is rejected by the loop termination
          condition rather than by the transition table, so a solution that treats the graph as a
          plain DAG (or that forgets to count rounds) diverges only on the fourth lap.
        test_recipe:
          setup:
            - "Project, private ELECTRIC owner, PRIVATE_EASEMENT facility, conflict with an ISSUED determination, and one plan in status SUBMITTED with revision_round 0."
            - "Each lap is driven by the owner rep for that facility's owner, so the resubmit owner-scope precondition is satisfied every time."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
