concurrency_rules:
- rule_id: prescription-create-field-occ
  parent_entity: FieldBoundary
  write_endpoint: POST /agdata/prescriptions
  occ_field: expected_field_boundary_version
  description: 'Creating a Prescription against a FieldBoundary whose version has advanced

    since the client last observed it is rejected. A prior prescription

    creation or a field activation legitimately advanced the field version,

    so the current writer''s snapshot of the field is stale.

    '
  error_id: ERR_STALE_FIELD_BOUNDARY_VERSION
  http_status: 412
- rule_id: license-purchase-machine-occ
  parent_entity: Machine
  write_endpoint: POST /agdata/feature-licenses
  occ_field: expected_machine_version
  description: 'Purchasing a FeatureLicense against a Machine whose version has advanced

    since the client last observed it is rejected. A prior license purchase

    legitimately advanced the machine version (license provisioning mutates

    the machine''s configuration), so the current writer''s view is stale.

    '
  error_id: ERR_STALE_MACHINE_VERSION
  http_status: 412
- rule_id: plan-change-tier-occ
  parent_entity: DataPlan
  write_endpoint: POST /agdata/data-plans/{id}/change-tier
  occ_field: expected_plan_version
  description: 'Changing the tier of a DataPlan whose version has advanced since the

    client last observed it is rejected. A prior change-tier legitimately

    repriced the plan, so the current writer''s pricing basis is stale.

    '
  error_id: ERR_STALE_PLAN_VERSION
  http_status: 412
calculations:
- name: plan_proration
  trigger: POST /agdata/data-plans/{id}/change-tier (on success, before tier is stored)
  algorithm: tiered_pricing
  formula: "delta_cents = TIER_PRICE_CENTS[new_tier] - TIER_PRICE_CENTS[old_tier]\nelapsed_days = (date(now) - cycle_start_date)\
    \ in whole days, floored, >= 0\nVariant CALENDAR_DAY:\n  days_in_month = number of calendar days in the month containing\
    \ now (28..31)\n  remaining_fraction = (days_in_month - day_of_month(now)) / days_in_month\nVariant THIRTY_DAY:\n  remaining_fraction\
    \ = max(0, (30 - elapsed_days)) / 30\ncharge_cents = round_half_up(delta_cents * remaining_fraction) to integer cents\n\
    charge may be negative (credit) on downgrade.\n"
  input_set: The DataPlan being changed; its tier, proration_method, cycle_start_date; the logical clock
  constants:
    TIER_PRICE_CENTS:
      BASIC: 30000
      STANDARD: 60000
      UNLIMITED: 120000
  precision: integer cents, round_half_up
  variants:
  - name: CALENDAR_DAY
    when: plan.proration_method == CALENDAR_DAY
    difference: Remaining fraction uses the true calendar month length and the calendar day-of-month; October (31 days) yields
      a larger remaining fraction than THIRTY_DAY for the same date
  - name: THIRTY_DAY
    when: plan.proration_method == THIRTY_DAY
    difference: Every cycle is treated as exactly 30 days measured from cycle_start_date, regardless of calendar month length
- name: data_usage_posture
  trigger: telemetry-ingest acceptance, change-tier, and clock-driven cycle rollover
  algorithm: threshold
  formula: "cap_mb = TIER_CAP_MB[tier]  # null for UNLIMITED\nif cap_mb is null: usage_posture = NORMAL\nelse:\n  ratio =\
    \ used_mb / cap_mb\n  if ratio >= EXHAUST_AT_RATIO: usage_posture = EXHAUSTED\n  elif ratio >= THROTTLE_AT_RATIO: usage_posture\
    \ = THROTTLED\n  else: usage_posture = NORMAL\nBoundary semantics: >= at both thresholds; exactly 80.00% of cap is THROTTLED,\n\
    exactly 100.00% of cap is EXHAUSTED.\nCycle rollover, applied on every clock-set: while the next boundary\n  (cycle_start_date\
    \ advanced by whole months at cycle_anchor_day) is <= date(now),\n  set used_mb = 0 and cycle_start_date = that boundary;\
    \ then recompute usage_posture\n  and the machine's connectivity_posture.\n"
  input_set: The machine's DataPlan (the unique plan in PENDING/ACTIVE/SUSPENDED) and its accepted telemetry batches in the
    current cycle
  constants:
    TIER_CAP_MB:
      BASIC: 5120
      STANDARD: 20480
      UNLIMITED: null
    THROTTLE_AT_RATIO: 0.8
    EXHAUST_AT_RATIO: 1.0
  precision: ratio computed in full precision; comparison is exact (used_mb and cap_mb are both exact numbers)
- name: machine_connectivity_posture
  trigger: any modem_status transition, any DataPlan status/usage change, machine activation
  algorithm: constraint_propagation
  formula: 'plan = the machine''s DataPlan (unique in PENDING/ACTIVE/SUSPENDED, may be absent)

    if modem_status != PROVISIONED: posture = OFFLINE

    elif plan is absent: posture = NO_PLAN

    elif plan.status != ACTIVE: posture = PLAN_SUSPENDED

    elif plan.usage_posture == EXHAUSTED: posture = EXHAUSTED

    elif plan.usage_posture == THROTTLED: posture = THROTTLED

    else: posture = CONNECTED

    Evaluation order is exactly as listed (first match wins).

    '
  input_set: The Machine row, its modem_status, and its unique DataPlan with status in PENDING/ACTIVE/SUSPENDED
  constants: {}
  precision: enum; no rounding
- name: uptime_prediction
  trigger: GET /agdata/machines/{id}/uptime-prediction; also reused as warranty data coverage (see warranty_data_coverage)
  algorithm: aggregation
  formula: "window = [now - UPTIME_WINDOW_HOURS hours, now), aligned to whole hour buckets\nEach accepted telemetry batch\
    \ contributes its hour_count consecutive hour\nbuckets starting at the bucket containing start_hour_iso.\nfilled = count\
    \ of distinct window buckets contributed by >= 1 batch\nconservative_score = round_half_up(100.0 * filled / UPTIME_WINDOW_HOURS,\
    \ 1 decimal)\noptimistic: an empty bucket is bridged iff its immediately preceding bucket\n  is filled; bridged = count\
    \ of such buckets\noptimistic_score = round_half_up(100.0 * (filled + bridged) / UPTIME_WINDOW_HOURS, 1 decimal)\nfilled_hours\
    \ = filled; bridged_hours = bridged (reported alongside)\n"
  input_set: All accepted (non-duplicate) telemetry batches of the machine, intersected with the trailing window
  constants:
    UPTIME_WINDOW_HOURS: 720
  precision: 1 decimal place, round_half_up
  variants:
  - name: OPTIMISTIC
    when: uptime-prediction reads and operator dashboards
    difference: Empty buckets immediately preceded by a filled bucket count as covered, so the score is >= conservative_score
      for identical data
  - name: CONSERVATIVE
    when: warranty data sufficiency (see warranty_data_coverage)
    difference: Only buckets with an actual record count; gaps are treated as uncovered
- name: parts_recommendation
  trigger: GET /agdata/machines/{id}/uptime-prediction (computed alongside uptime)
  algorithm: threshold
  formula: 'score = conservative_score from uptime_prediction

    if score < OVERHAUL_BELOW_PCT: recommendation = OVERHAUL_KIT

    elif score < SERVICE_BELOW_PCT: recommendation = SERVICE_KIT

    else: recommendation = NONE

    '
  input_set: uptime_prediction conservative_score for the machine
  constants:
    OVERHAUL_BELOW_PCT: 70.0
    SERVICE_BELOW_PCT: 85.0
  precision: compares against the rounded 1-decimal score
- name: prescription_product_totals
  trigger: POST /agdata/prescriptions (computed at creation from zones)
  algorithm: aggregation
  formula: 'Rounding order is pinned: round per zone FIRST, then sum.

    for each zone: zone_liters = round_half_up(rate_l_per_ha * area_ha, 2 decimals)

    total_product_liters = sum(zone_liters)  # exact sum of the rounded zone values

    total_area_ha = sum(zone.area_ha)

    weighted_avg_rate_l_per_ha = round_half_up(total_product_liters / total_area_ha, 3 decimals)

    (Sum-then-round is explicitly NOT the rule and yields different values, e.g.

    zones (2.55 x 1.10) x 2 -> per-zone-then-sum 5.62 vs sum-then-round 5.61.)

    '
  input_set: The zones array of the prescription being created
  constants:
    ZONE_QTY_DECIMALS: 2
    AVG_RATE_DECIMALS: 3
  precision: per-zone 2 decimals round_half_up, then sum; average 3 decimals round_half_up
- name: warranty_payout_allocation
  trigger: POST /agdata/warranty-claims/{id}/decide with decision APPROVE
  algorithm: waterfall_allocation
  formula: "age_months = whole months between Machine.manufacture_date and date(now), floored\ncoverage_pct = 0.90 if age_months\
    \ <= AGE_FULL_COVER_MAX_MONTHS\n               else 0.70 if age_months <= AGE_PARTIAL_COVER_MAX_MONTHS\n             \
    \  else 0.50\ncovered_parts = floor(parts_amount_cents * coverage_pct)\nlabor_cents = claim_amount_cents - parts_amount_cents\n\
    labor_cap = LABOR_CAP_CENTS[dealer.service_tier]\ncovered_labor = floor(min(labor_cents, labor_cap) * coverage_pct)\n\
    payout_cents = min(claim_amount_cents, covered_parts + covered_labor, PAYOUT_MAX_CENTS)\n"
  input_set: The claim, its machine (manufacture_date), its dealer (service_tier), and the logical clock
  constants:
    AGE_FULL_COVER_MAX_MONTHS: 24
    AGE_PARTIAL_COVER_MAX_MONTHS: 60
    LABOR_CAP_CENTS:
      STANDARD: 500000
      PREMIUM: 900000
    PAYOUT_MAX_CENTS: 2000000
  precision: integer cents; floor at each multiplication
- name: license_bundle_fee
  trigger: POST /agdata/feature-licenses (computed at purchase)
  algorithm: tiered_pricing
  formula: "Evaluation order is pinned (the fee depends on a count that includes the\nlicense being purchased, so the order\
    \ is part of the contract):\n(1) n = count of this machine's FeatureLicenses in PURCHASED, ACTIVATED or\n    SUSPENDED,\
    \ PLUS the new license being purchased\n(2) discount = BUNDLE_DISCOUNT(n): 0.00 if n == 1, 0.10 if n == 2, 0.20 if n >=\
    \ 3\n(3) base = LICENSE_BASE_FEE_CENTS[feature_code]\n(4) fee_cents = round_half_up(base * (1 - discount)) to integer\
    \ cents\n"
  input_set: The machine's existing non-terminal licenses plus the new purchase
  constants:
    LICENSE_BASE_FEE_CENTS:
      AUTO_GUIDANCE: 120000
      SECTION_CONTROL: 180000
      VARIABLE_RATE_SPREAD: 90000
      TELEMATICS_PREMIUM: 60000
    BUNDLE_DISCOUNT_2: 0.1
    BUNDLE_DISCOUNT_3_PLUS: 0.2
  precision: integer cents, round_half_up
- name: warranty_data_coverage
  trigger: POST /agdata/warranty-claims/{id}/submit (precondition evaluation)
  algorithm: threshold
  formula: 'coverage = uptime_prediction.conservative_score for the machine (identical

    window and bucket semantics; single defining site is uptime_prediction)

    eligible iff coverage >= WARRANTY_MIN_COVERAGE_PCT (exactly 90.0 passes)

    '
  input_set: Same as uptime_prediction for the machine
  constants:
    WARRANTY_MIN_COVERAGE_PCT: 90.0
  precision: compares the rounded 1-decimal conservative score
- name: provisioning_attempt_gate
  trigger: POST /agdata/machines/{id}/provision-modem (precondition evaluation)
  algorithm: threshold
  formula: 'begin allowed iff provisioning_attempts < PROVISIONING_MAX_ATTEMPTS; at exactly PROVISIONING_MAX_ATTEMPTS the
    begin is rejected with ERR_PROVISIONING_ATTEMPTS_EXHAUSTED (>= semantics: the 5th begin is the last legal one)'
  input_set: The Machine row
  constants:
    PROVISIONING_MAX_ATTEMPTS: 5
  precision: integer comparison, exact
- name: time_driven_expiry_sweep
  trigger: POST /agdata/_clock/set_current_utc
  algorithm: threshold
  formula: 'On every clock advance: ConsentTickets in REQUESTED/GRANTED with now >= expires_at -> EXPIRED (expires_at = created_at
    + CONSENT_TTL_HOURS hours); DataShareGrants in ACTIVE/SUSPENDED with now >= valid_until -> EXPIRED; FeatureLicenses TERM
    in ACTIVATED with now >= expires_at -> EXPIRED; IntegrationPartners CERTIFIED with date(now) >= certification_expires_on
    -> EXPIRED (certification_expires_on = certification date + CERT_VALIDITY_DAYS days); DataPlan cycle rollovers per data_usage_posture;
    IntegrationPartner calls_today resets when the UTC date changes. All comparisons use >= (reaching the boundary expires).'
  input_set: All entities with time-bounded validity windows
  constants:
    CONSENT_TTL_HOURS: 72
    CERT_VALIDITY_DAYS: 365
  precision: timestamp comparison to the second; date comparison by UTC calendar day
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and role is a declared role name
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all endpoints
- priority: 2
  category: auth
  check: Caller role is in the endpoint's declared roles list
  error_id: ERR_FORBIDDEN_FOR_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: existence
  check: 'Request body shape: required fields present, enum values in their declared sets, types correct, numeric ranges honored
    (amounts > 0 where declared, hour_count > 0, quota > 0), valid_from < valid_until where both are inputs, clock-set timestamps
    monotonically non-decreasing'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all write endpoints
- priority: 4
  category: existence
  check: Path ids exist left-to-right, then body foreign keys in the endpoint's declared input order
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path or body resource references
- priority: 5
  category: existence
  check: 'Data-access scope gate: non-admin, non-system callers must either own the target (GrowerManager X-User-ID == the
    resource''s organization_id) or hold an ACTIVE DataShareGrant on the target organization whose grantee_type maps to the
    caller role, whose grantee_ref_id == caller X-User-ID, whose closed window covers now, and whose scopes include the endpoint''s
    required scope (TELEMATICS for machine/uptime/plan reads, AGRONOMIC for field/prescription reads and prescription creation,
    DIAGNOSTICS for session reads). Dealer claim/session lists are restricted to dealer_id == X-User-ID; PartnerApp GET on
    itself requires X-User-ID == partner id'
  error_id: ERR_DATA_ACCESS_DENIED
  http_status: 403
  applies_to: scoped read/write endpoints (machine/uptime/plan/field/prescription/grant/ticket/session/delivery/license/claim
    reads; prescription creation by Agronomist)
- priority: 6
  category: state
  check: 'Target resource and cross-entity state preconditions for the requested transition, including ERR_INVALID_STATE_TRANSITION
    (generic wrong-state), ERR_MACHINE_NOT_ACTIVATED (delivery requires ACTIVATED/IN_SERVICE), ERR_MODEM_NOT_PROVISIONED,
    ERR_PLAN_NOT_ACTIVE, ERR_FIELD_NOT_ACTIVE, ERR_PACKAGE_NOT_PUBLISHED, ERR_MACHINE_POSTURE_BLOCKED, ERR_ORG_SUSPENDED,
    ERR_DEALER_SUSPENDED, ERR_PARTNER_NOT_CERTIFIED, ERR_CONSENT_ALREADY_CONSUMED, ERR_CONSENT_EXPIRED. Order inside this
    category: modem check before plan check before usage check on telemetry-ingest'
  error_id: ERR_INVALID_STATE_TRANSITION and the listed specific state errors
  http_status: 409
  applies_to: state transition endpoints and state-gated writes
- priority: 7
  category: business_safety
  check: 'Consent and compliance gates: diagnostic sessions require a GRANTED REMOTE_DIAGNOSTIC ticket; IndependentTechnician
    ticket requests and session opens require the org''s right_to_repair_enabled (ERR_RTR_NOT_ENABLED); partner data-pull
    requires an ACTIVE grant covering the requested scope (ERR_DATA_SCOPE_NOT_GRANTED)'
  error_id: ERR_RTR_NOT_ENABLED | ERR_DATA_SCOPE_NOT_GRANTED
  http_status: 403
  applies_to: POST /agdata/consent-tickets, POST /agdata/diagnostic-sessions, POST /agdata/integration-partners/{id}/data-pull
- priority: 8
  category: business_constraint
  check: 'Uniqueness and capacity: one plan per machine (ERR_PLAN_ALREADY_EXISTS), one non-REVOKED license per (machine, feature_code)
    (ERR_LICENSE_ALREADY_EXISTS), one non-terminal delivery per (machine, package) (ERR_DELIVERY_ALREADY_PENDING), one OPEN
    diagnostic session per machine (ERR_MACHINE_SESSION_ACTIVE), grant window overlap per (organization, grantee_type, grantee_ref_id,
    scope) on closed intervals (ERR_GRANT_WINDOW_OVERLAP), duplicate telemetry batch_id per machine (ERR_DUPLICATE_TELEMETRY_BATCH),
    provisioning attempts exhausted (ERR_PROVISIONING_ATTEMPTS_EXHAUSTED), package model compatibility (ERR_PACKAGE_MODEL_MISMATCH),
    section-control license gate for multi-zone sends (ERR_FEATURE_NOT_LICENSED), field archive with open prescriptions (ERR_FIELD_HAS_OPEN_PRESCRIPTIONS),
    same-tier change (ERR_TIER_CHANGE_INVALID), warranty data coverage (ERR_INSUFFICIENT_DATA_COVERAGE)'
  error_id: the listed constraint errors
  http_status: 409
  applies_to: creation and action endpoints as listed
- priority: 9
  category: business_referential
  check: 'Cross-references must agree: ticket.machine_id == request machine_id (ERR_TICKET_MACHINE_MISMATCH), ticket.ticket_type
    == REMOTE_DIAGNOSTIC for sessions (ERR_TICKET_TYPE_MISMATCH), prescription.organization_id == field.organization_id and
    machine.organization_id (ERR_INVALID_REQUEST), plan.organization_id == machine.organization_id (ERR_INVALID_REQUEST)'
  error_id: ERR_TICKET_MACHINE_MISMATCH | ERR_TICKET_TYPE_MISMATCH | ERR_INVALID_REQUEST
  http_status: 409
  applies_to: POST /agdata/diagnostic-sessions, POST /agdata/prescriptions, POST /agdata/data-plans
- priority: 10
  category: business_temporal
  check: 'Temporal windows: prescription send requires now <= valid_until (ERR_PRESCRIPTION_EXPIRED); grant resume requires
    now <= valid_until (ERR_INVALID_STATE_TRANSITION); grant windows and consent expiry are enforced by clock-set transitions'
  error_id: ERR_PRESCRIPTION_EXPIRED | ERR_INVALID_STATE_TRANSITION
  http_status: 409
  applies_to: POST /agdata/prescriptions/{id}/send-to-machine, POST /agdata/data-share-grants/{id}/resume
- priority: 11
  category: business_fiscal
  check: 'Quota and monetary gates: partner data-pull requires calls_today < api_quota_calls_per_day for the current UTC date
    (ERR_PARTNER_QUOTA_EXCEEDED)'
  error_id: ERR_PARTNER_QUOTA_EXCEEDED
  http_status: 409
  applies_to: POST /agdata/integration-partners/{id}/data-pull
- priority: 12
  category: business_constraint
  check: 'OCC: expected_<parent>_version must equal the parent''s current version on OCC-guarded writes'
  error_id: ERR_STALE_MACHINE_VERSION | ERR_STALE_FIELD_BOUNDARY_VERSION | ERR_STALE_PLAN_VERSION
  http_status: 412
  applies_to: POST /agdata/feature-licenses, POST /agdata/prescriptions, POST /agdata/data-plans/{id}/change-tier
  note: Evaluated after existence and request-shape, before the write commits; categorized last so a stale-version conflict
    is only reported once all domain checks pass
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
endpoints:
- method: POST
  path: /agdata/_clock/set_current_utc
  description: Set the platform logical clock. The server starts with the clock fixed at 2026-09-01T00:00:00Z and never falls
    back to wall-clock time; this endpoint moves it (monotonically non-decreasing). Side effects sweep all time-driven transitions
    deterministically.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - current_utc
  output:
    current_utc: string
  side_effects:
  - DataShareGrants in ACTIVE/SUSPENDED with now >= valid_until -> EXPIRED
  - ConsentTickets in REQUESTED/GRANTED with now >= expires_at -> EXPIRED
  - FeatureLicenses TERM in ACTIVATED with now >= expires_at -> EXPIRED (machine active_license_count recomputed)
  - IntegrationPartners CERTIFIED with date(now) >= certification_expires_on -> EXPIRED
  - 'DataPlans: cycle rollover when the anchor boundary passed -> used_mb = 0, cycle_start_date advanced, usage_posture and
    machine posture recomputed'
  - 'IntegrationPartners: calls_today reset when the UTC date changes'
- method: POST
  path: /agdata/organizations
  description: Create a grower organization (tenant). right_to_repair_enabled and independent_session_max_minutes record the
    org's jurisdiction rules for diagnostic access.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - name
  - region_code
  - right_to_repair_enabled?
  - independent_session_max_minutes?
  output: Organization
  side_effects:
  - status=ACTIVE
- method: POST
  path: /agdata/organizations/{id}/suspend
  description: Suspend an organization; cascades to plans, posture, in-flight downloads, grants and open sessions.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: Organization
  side_effects:
  - ACTIVE DataPlans of the org -> SUSPENDED; affected machines recompute posture to PLAN_SUSPENDED; DOWNLOADING deliveries
    on them -> FAILED (CONNECTIVITY_LOST); ACTIVE DataShareGrants -> SUSPENDED; OPEN DiagnosticSessions on org machines ->
    CLOSED (ACCESS_WITHDRAWN); increments Organization.version
- method: POST
  path: /agdata/organizations/{id}/resume
  description: Resume an organization. Children are NOT auto-resumed.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: Organization
  side_effects:
  - status -> ACTIVE; plans, grants, sessions and deliveries unchanged; increments Organization.version
- method: POST
  path: /agdata/dealers
  description: Register an equipment dealer.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - dealer_code
  - name
  - region_code
  - service_tier
  output: Dealer
  side_effects:
  - status=ACTIVE, warranty_reserve_cents=0, warranty_paid_cents=0
- method: GET
  path: /agdata/dealers/{id}
  description: Read a dealer, including warranty reserve/paid totals.
  roles:
  - PlatformAdmin
  - DealerTechnician
  code: 200
  input: []
  output: Dealer
  side_effects:
  - DealerTechnician callers must satisfy X-User-ID == dealer id (ERR_DATA_ACCESS_DENIED)
- method: POST
  path: /agdata/dealers/{id}/suspend
  description: Suspend a dealer; blocks new activations, sessions and claims by the dealer.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: Dealer
  side_effects:
  - status -> SUSPENDED
- method: POST
  path: /agdata/machines
  description: Register a machine with its telematics modem identity.
  roles:
  - GrowerManager
  - PlatformAdmin
  code: 201
  input:
  - organization_id
  - serial_number
  - model_code
  - selling_dealer_id
  - modem_imei
  - manufacture_date
  output: Machine
  side_effects:
  - lifecycle_status=REGISTERED, modem_status=UNPROVISIONED, connectivity_posture=OFFLINE; GrowerManager callers must satisfy
    X-User-ID == organization_id (ERR_DATA_ACCESS_DENIED)
- method: GET
  path: /agdata/machines/{id}
  description: Read a machine including lifecycle_status, modem_status and the derived connectivity_posture and active_license_count.
  roles:
  - GrowerManager
  - DealerTechnician
  - Agronomist
  - CoopAnalyst
  - PartnerApp
  - PlatformAdmin
  code: 200
  input: []
  output: Machine
  side_effects:
  - Scope gate TELEMATICS for non-owner, non-admin callers (ERR_DATA_ACCESS_DENIED)
- method: GET
  path: /agdata/machines
  description: List machines; non-admin callers must pass organization_id and satisfy the TELEMATICS scope gate for it.
  roles:
  - GrowerManager
  - DealerTechnician
  - Agronomist
  - CoopAnalyst
  - PartnerApp
  - PlatformAdmin
  code: 200
  input:
  - organization_id?
  - selling_dealer_id?
  - activating_dealer_id?
  - lifecycle_status?
  - limit?
  - offset?
  output: Machine[]
  side_effects: []
- method: POST
  path: /agdata/machines/{id}/activate
  description: 'Dealer activation handshake: the dealer of record or any ACTIVE dealer activates a fully provisioned machine
    with an ACTIVE plan.'
  roles:
  - DealerTechnician
  code: 200
  input: []
  output: Machine
  side_effects:
  - lifecycle_status REGISTERED -> ACTIVATED, activating_dealer_id = X-User-ID, activated_at = now
- method: POST
  path: /agdata/machines/{id}/provision-modem
  description: Begin (or retry) modem provisioning with the network operator.
  roles:
  - DealerTechnician
  - PlatformAdmin
  code: 200
  input: []
  output: Machine
  side_effects:
  - modem_status UNPROVISIONED|PROVISION_FAILED -> PROVISIONING, provisioning_attempts += 1; ERR_PROVISIONING_ATTEMPTS_EXHAUSTED
    at PROVISIONING_MAX_ATTEMPTS
- method: POST
  path: /agdata/machines/{id}/modem-provisioning-events
  description: Network-operator callback reporting the provisioning outcome.
  roles:
  - System
  code: 200
  input:
  - outcome
  output: Machine
  side_effects:
  - modem_status PROVISIONING -> PROVISIONED (outcome PROVISION_SUCCEEDED) or PROVISION_FAILED (outcome PROVISION_FAILED);
    posture recomputed on success
- method: POST
  path: /agdata/machines/{id}/telemetry-ingest
  description: 'Ingest one telematics batch: hour_count consecutive hourly records starting at start_hour_iso, plus payload_mb
    counted against the ACTIVE plan. batch_id is idempotent per machine.'
  roles:
  - System
  code: 201
  input:
  - batch_id
  - start_hour_iso
  - hour_count
  - payload_mb
  output: Machine
  side_effects:
  - ERR_DUPLICATE_TELEMETRY_BATCH if batch_id already accepted for this machine
  - 'Posture gate: modem not PROVISIONED -> ERR_MODEM_NOT_PROVISIONED; plan not ACTIVE -> ERR_PLAN_NOT_ACTIVE; usage EXHAUSTED
    -> ERR_MACHINE_POSTURE_BLOCKED'
  - used_mb += payload_mb; usage_posture recomputed (THROTTLE_AT_RATIO / EXHAUST_AT_RATIO); posture recomputed
  - First accepted batch on an ACTIVATED machine flips lifecycle_status to IN_SERVICE
- method: GET
  path: /agdata/machines/{id}/uptime-prediction
  description: 'Computed read: dual-variant uptime scores over the trailing UPTIME_WINDOW_HOURS and the derived parts recommendation.'
  roles:
  - GrowerManager
  - DealerTechnician
  - Agronomist
  - CoopAnalyst
  - PartnerApp
  - PlatformAdmin
  code: 200
  input: []
  output:
    optimistic_score: number
    conservative_score: number
    window_hours: integer
    filled_hours: integer
    bridged_hours: integer
    parts_recommendation: string
  side_effects:
  - Scope gate TELEMATICS for non-owner, non-admin callers
- method: POST
  path: /agdata/data-plans
  description: Create a subscription data plan for a machine (PENDING until activated). At most one plan per machine in PENDING/ACTIVE/SUSPENDED.
  roles:
  - GrowerManager
  - PlatformAdmin
  code: 201
  input:
  - organization_id
  - machine_id
  - tier
  - proration_method
  output: DataPlan
  side_effects:
  - status=PENDING, monthly_price_cents from TIER_PRICE_CENTS, used_mb=0, usage_posture=NORMAL; ERR_PLAN_ALREADY_EXISTS if
    the machine already has a plan in PENDING/ACTIVE/SUSPENDED
- method: GET
  path: /agdata/data-plans/{id}
  description: Read a data plan including used_mb, usage_posture and last_proration_charge_cents.
  roles:
  - GrowerManager
  - PlatformAdmin
  code: 200
  input: []
  output: DataPlan
  side_effects:
  - GrowerManager callers must own the plan's organization (ERR_DATA_ACCESS_DENIED)
- method: GET
  path: /agdata/data-plans
  description: List data plans.
  roles:
  - GrowerManager
  - PlatformAdmin
  code: 200
  input:
  - organization_id?
  - machine_id?
  - status?
  - limit?
  - offset?
  output: DataPlan[]
  side_effects: []
- method: POST
  path: /agdata/data-plans/{id}/activate
  description: Activate a PENDING plan; anchors the billing cycle at today.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: DataPlan
  side_effects:
  - status PENDING -> ACTIVE; cycle_anchor_day = day-of-month(now), cycle_start_date = date(now); machine posture recomputed;
    increments DataPlan.version
- method: POST
  path: /agdata/data-plans/{id}/suspend
  description: Suspend an ACTIVE plan; fails in-flight downloads on the machine.
  roles:
  - GrowerManager
  - PlatformAdmin
  code: 200
  input: []
  output: DataPlan
  side_effects:
  - status ACTIVE -> SUSPENDED; machine posture -> PLAN_SUSPENDED; DOWNLOADING UpdateDeliveries on the machine -> FAILED (CONNECTIVITY_LOST);
    increments DataPlan.version
- method: POST
  path: /agdata/data-plans/{id}/resume
  description: Resume a SUSPENDED plan.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: DataPlan
  side_effects:
  - status SUSPENDED -> ACTIVE; machine posture recomputed; ERR_ORG_SUSPENDED if the organization is SUSPENDED; increments
    DataPlan.version
- method: POST
  path: /agdata/data-plans/{id}/change-tier
  description: Change tier mid-cycle with proration per the plan's proration_method (OCC-guarded).
  roles:
  - GrowerManager
  code: 200
  input:
  - new_tier
  - expected_plan_version
  output: DataPlan
  side_effects:
  - last_proration_charge_cents = calculations.plan_proration; tier and monthly_price_cents updated; usage_posture and machine
    posture recomputed; increments DataPlan.version; ERR_TIER_CHANGE_INVALID for same tier or non-ACTIVE plan uses ERR_PLAN_NOT_ACTIVE
- method: POST
  path: /agdata/field-boundaries
  description: Create a field boundary (DRAFT until activated).
  roles:
  - GrowerManager
  code: 201
  input:
  - organization_id
  - name
  - season_year
  - area_hectares
  output: FieldBoundary
  side_effects:
  - status=DRAFT
- method: GET
  path: /agdata/field-boundaries/{id}
  description: Read a field boundary.
  roles:
  - GrowerManager
  - Agronomist
  - CoopAnalyst
  - PartnerApp
  - PlatformAdmin
  code: 200
  input: []
  output: FieldBoundary
  side_effects:
  - Scope gate AGRONOMIC for non-owner, non-admin callers
- method: GET
  path: /agdata/field-boundaries
  description: List field boundaries.
  roles:
  - GrowerManager
  - Agronomist
  - CoopAnalyst
  - PartnerApp
  - PlatformAdmin
  code: 200
  input:
  - organization_id?
  - status?
  - limit?
  - offset?
  output: FieldBoundary[]
  side_effects: []
- method: POST
  path: /agdata/field-boundaries/{id}/activate
  description: Activate a field boundary so it accepts prescriptions.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: FieldBoundary
  side_effects:
  - status DRAFT -> ACTIVE; increments FieldBoundary.version
- method: POST
  path: /agdata/field-boundaries/{id}/archive
  description: Archive a field boundary; blocked while open prescriptions reference it.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: FieldBoundary
  side_effects:
  - status ACTIVE -> ARCHIVED; ERR_FIELD_HAS_OPEN_PRESCRIPTIONS if any prescription is DRAFT/APPROVED/SENT
- method: POST
  path: /agdata/prescriptions
  description: Create a prescription against an ACTIVE field (OCC on the field version). Computes zone-rounded product totals.
  roles:
  - GrowerManager
  - Agronomist
  code: 201
  input:
  - organization_id
  - field_boundary_id
  - machine_id
  - crop_type
  - zones
  - valid_from
  - valid_until
  - expected_field_boundary_version
  output: Prescription
  side_effects:
  - status=DRAFT, revision=1, total_product_liters and weighted_avg_rate_l_per_ha computed per calculations.prescription_product_totals
  - Increments FieldBoundary.version (the prescription attaches to the field snapshot)
  - Agronomist callers need an ACTIVE AGRONOMIC grant on the organization (ERR_DATA_ACCESS_DENIED)
- method: GET
  path: /agdata/prescriptions/{id}
  description: Read a prescription.
  roles:
  - GrowerManager
  - Agronomist
  - CoopAnalyst
  - PartnerApp
  - PlatformAdmin
  code: 200
  input: []
  output: Prescription
  side_effects:
  - Scope gate AGRONOMIC for non-owner, non-admin callers
- method: GET
  path: /agdata/prescriptions
  description: List prescriptions.
  roles:
  - GrowerManager
  - Agronomist
  - CoopAnalyst
  - PartnerApp
  - PlatformAdmin
  code: 200
  input:
  - organization_id?
  - field_boundary_id?
  - machine_id?
  - status?
  - superseded_by_id?
  - limit?
  - offset?
  output: Prescription[]
  side_effects: []
- method: POST
  path: /agdata/prescriptions/{id}/approve
  description: Grower-only approval of a DRAFT prescription.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: Prescription
  side_effects:
  - status DRAFT -> APPROVED
- method: POST
  path: /agdata/prescriptions/{id}/revise
  description: Return an APPROVED prescription to DRAFT, bumping revision.
  roles:
  - GrowerManager
  - Agronomist
  code: 200
  input: []
  output: Prescription
  side_effects:
  - status APPROVED -> DRAFT, revision += 1
- method: POST
  path: /agdata/prescriptions/{id}/send-to-machine
  description: Send an APPROVED prescription to the target machine display; supersedes any SENT prescription of the same field.
  roles:
  - GrowerManager
  - Agronomist
  code: 200
  input: []
  output: Prescription
  side_effects:
  - 'status APPROVED -> SENT; other SENT prescriptions of the field -> SUPERSEDED with superseded_by_id; gates: org ACTIVE,
    posture CONNECTED, now <= valid_until, SECTION_CONTROL license when len(zones) > 1'
- method: POST
  path: /agdata/prescriptions/{id}/report-as-applied
  description: Machine-side as-applied report; acknowledges the prescription.
  roles:
  - System
  code: 200
  input:
  - applied_total_liters
  - applied_coverage_ha
  output: Prescription
  side_effects:
  - status SENT -> ACKNOWLEDGED; applied_total_liters, applied_coverage_ha, applied_at recorded
- method: POST
  path: /agdata/data-share-grants
  description: Grant scoped data access on an organization to an agronomist, cooperative, dealer or third-party app. Closed-interval
    overlap per (organization, grantee_type, grantee_ref_id, scope) is rejected.
  roles:
  - GrowerManager
  code: 201
  input:
  - organization_id
  - grantee_type
  - grantee_ref_id
  - scopes
  - valid_from
  - valid_until
  output: DataShareGrant
  side_effects:
  - status=ACTIVE; ERR_GRANT_WINDOW_OVERLAP on closed-interval overlap with any ACTIVE/SUSPENDED grant sharing a scope
- method: GET
  path: /agdata/data-share-grants/{id}
  description: Read a grant.
  roles:
  - GrowerManager
  - PlatformAdmin
  - Agronomist
  - CoopAnalyst
  - DealerTechnician
  - PartnerApp
  code: 200
  input: []
  output: DataShareGrant
  side_effects:
  - 'Non-admin callers: the org owner, or the grantee (grantee_ref_id == X-User-ID with the mapped role)'
- method: GET
  path: /agdata/data-share-grants
  description: List grants.
  roles:
  - GrowerManager
  - PlatformAdmin
  - Agronomist
  - CoopAnalyst
  - DealerTechnician
  - PartnerApp
  code: 200
  input:
  - organization_id?
  - grantee_ref_id?
  - status?
  - limit?
  - offset?
  output: DataShareGrant[]
  side_effects: []
- method: POST
  path: /agdata/data-share-grants/{id}/suspend
  description: Suspend a grant (access denied while SUSPENDED).
  roles:
  - GrowerManager
  code: 200
  input: []
  output: DataShareGrant
  side_effects:
  - status ACTIVE -> SUSPENDED
- method: POST
  path: /agdata/data-share-grants/{id}/resume
  description: Resume a SUSPENDED grant; the window must still be valid.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: DataShareGrant
  side_effects:
  - status SUSPENDED -> ACTIVE; ERR_INVALID_STATE_TRANSITION if now > valid_until
- method: POST
  path: /agdata/data-share-grants/{id}/revoke
  description: Permanently revoke a grant.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: DataShareGrant
  side_effects:
  - status ACTIVE|SUSPENDED -> REVOKED
- method: POST
  path: /agdata/consent-tickets
  description: Request customer consent for remote diagnostics or a software update. requester_ref_id is the Dealer.id for
    dealer requests, the caller X-User-ID for independent technicians, or 'platform'.
  roles:
  - DealerTechnician
  - IndependentTechnician
  - PlatformAdmin
  code: 201
  input:
  - organization_id
  - machine_id
  - ticket_type
  - requester_ref_id
  output: ConsentTicket
  side_effects:
  - status=REQUESTED, expires_at = now + CONSENT_TTL_HOURS hours; IndependentTechnician callers require the org's right_to_repair_enabled
    (ERR_RTR_NOT_ENABLED)
- method: GET
  path: /agdata/consent-tickets/{id}
  description: Read a consent ticket.
  roles:
  - GrowerManager
  - PlatformAdmin
  - DealerTechnician
  - IndependentTechnician
  code: 200
  input: []
  output: ConsentTicket
  side_effects:
  - 'Non-admin callers: the org owner, or the requester (requester_ref_id == X-User-ID for independents; dealer_id == X-User-ID
    for dealer-requested tickets)'
- method: GET
  path: /agdata/consent-tickets
  description: List consent tickets.
  roles:
  - GrowerManager
  - PlatformAdmin
  - DealerTechnician
  - IndependentTechnician
  code: 200
  input:
  - organization_id?
  - machine_id?
  - ticket_type?
  - status?
  - limit?
  - offset?
  output: ConsentTicket[]
  side_effects: []
- method: POST
  path: /agdata/consent-tickets/{id}/grant
  description: Grower grants the requested consent.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: ConsentTicket
  side_effects:
  - status REQUESTED -> GRANTED, granted_at = now; bound UpdateDelivery AWAITING_CONSENT -> CONSENT_GRANTED; ERR_ORG_SUSPENDED
    if the organization is SUSPENDED
- method: POST
  path: /agdata/consent-tickets/{id}/deny
  description: Grower denies the requested consent.
  roles:
  - GrowerManager
  code: 200
  input: []
  output: ConsentTicket
  side_effects:
  - status REQUESTED -> DENIED; bound UpdateDelivery AWAITING_CONSENT -> DECLINED
- method: POST
  path: /agdata/diagnostic-sessions
  description: 'Open a remote diagnostic session on a machine, consuming a GRANTED REMOTE_DIAGNOSTIC consent ticket. At most
    one OPEN session per machine (half-open interval lock: a new session may open immediately after the previous closes).'
  roles:
  - DealerTechnician
  - IndependentTechnician
  code: 201
  input:
  - machine_id
  - consent_ticket_id
  output: DiagnosticSession
  side_effects:
  - status=OPEN, opened_at=now, organization_id copied from the machine
  - ConsentTicket GRANTED -> CONSUMED with bound_session_id set
  - technician_kind from caller role; diagnostic_detail_level EXTENDED for dealers, BASIC for independents
  - 'Gates: ticket state (ERR_INVALID_STATE_TRANSITION unless GRANTED, ERR_CONSENT_ALREADY_CONSUMED, ERR_CONSENT_EXPIRED),
    ticket type/machine match (ERR_TICKET_TYPE_MISMATCH, ERR_TICKET_MACHINE_MISMATCH), machine posture CONNECTED or THROTTLED
    (ERR_MACHINE_POSTURE_BLOCKED), org ACTIVE (ERR_ORG_SUSPENDED), dealer ACTIVE for dealer sessions (ERR_DEALER_SUSPENDED),
    right_to_repair_enabled for independents (ERR_RTR_NOT_ENABLED), no other OPEN session on the machine (ERR_MACHINE_SESSION_ACTIVE)'
- method: GET
  path: /agdata/diagnostic-sessions/{id}
  description: Read a diagnostic session.
  roles:
  - GrowerManager
  - PlatformAdmin
  - DealerTechnician
  - IndependentTechnician
  - Agronomist
  - CoopAnalyst
  code: 200
  input: []
  output: DiagnosticSession
  side_effects:
  - 'Non-admin callers: org owner, the session participant, or a DIAGNOSTICS grantee'
- method: GET
  path: /agdata/diagnostic-sessions
  description: List diagnostic sessions.
  roles:
  - GrowerManager
  - PlatformAdmin
  - DealerTechnician
  - IndependentTechnician
  - Agronomist
  - CoopAnalyst
  code: 200
  input:
  - machine_id?
  - organization_id?
  - dealer_id?
  - consent_ticket_id?
  - status?
  - limit?
  - offset?
  output: DiagnosticSession[]
  side_effects: []
- method: POST
  path: /agdata/diagnostic-sessions/{id}/close
  description: Close an open session; only the opener may close.
  roles:
  - DealerTechnician
  - IndependentTechnician
  code: 200
  input:
  - fault_found
  output: DiagnosticSession
  side_effects:
  - status OPEN -> CLOSED, closed_reason=COMPLETED, fault_found recorded; ERR_DATA_ACCESS_DENIED if caller is not the opener
- method: POST
  path: /agdata/software-packages
  description: Register a software package (DRAFT until published).
  roles:
  - PlatformAdmin
  code: 201
  input:
  - package_code
  - target_model_code
  - firmware_version
  - size_mb
  - mandatory
  output: SoftwarePackage
  side_effects:
  - status=DRAFT
- method: GET
  path: /agdata/software-packages/{id}
  description: Read a software package.
  roles:
  - PlatformAdmin
  - GrowerManager
  code: 200
  input: []
  output: SoftwarePackage
  side_effects: []
- method: POST
  path: /agdata/software-packages/{id}/publish
  description: Publish a package so deliveries can be scheduled.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: SoftwarePackage
  side_effects:
  - status DRAFT -> PUBLISHED
- method: POST
  path: /agdata/software-packages/{id}/withdraw
  description: Withdraw a published package; cancels pending deliveries and revokes their consent tickets.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: SoftwarePackage
  side_effects:
  - status PUBLISHED -> WITHDRAWN; deliveries AWAITING_CONSENT/CONSENT_GRANTED -> CANCELLED; their tickets REQUESTED/GRANTED
    -> REVOKED
- method: POST
  path: /agdata/update-deliveries
  description: Schedule a software update delivery for a machine; mints a SOFTWARE_UPDATE consent ticket (requester 'platform')
    in REQUESTED.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - machine_id
  - package_id
  output: UpdateDelivery
  side_effects:
  - 'status=AWAITING_CONSENT; creates the bound ConsentTicket; gates: package PUBLISHED (ERR_PACKAGE_NOT_PUBLISHED), package.target_model_code
    == machine.model_code (ERR_PACKAGE_MODEL_MISMATCH), machine ACTIVATED or IN_SERVICE (ERR_MACHINE_NOT_ACTIVATED), no non-terminal
    delivery for the same (machine, package) (ERR_DELIVERY_ALREADY_PENDING)'
- method: GET
  path: /agdata/update-deliveries/{id}
  description: Read a delivery.
  roles:
  - PlatformAdmin
  - GrowerManager
  code: 200
  input: []
  output: UpdateDelivery
  side_effects: []
- method: GET
  path: /agdata/update-deliveries
  description: List deliveries.
  roles:
  - PlatformAdmin
  - GrowerManager
  code: 200
  input:
  - machine_id?
  - package_id?
  - consent_ticket_id?
  - status?
  - limit?
  - offset?
  output: UpdateDelivery[]
  side_effects: []
- method: POST
  path: /agdata/update-deliveries/{id}/start-download
  description: Machine begins downloading; from CONSENT_GRANTED or FAILED (consent-preserving retry). Optional packages require
    CONNECTED; mandatory ones also tolerate THROTTLED.
  roles:
  - System
  code: 200
  input: []
  output: UpdateDelivery
  side_effects:
  - status -> DOWNLOADING, download_attempts += 1; on the first transition the bound ConsentTicket GRANTED -> CONSUMED; ERR_MACHINE_POSTURE_BLOCKED
    when posture is insufficient
- method: POST
  path: /agdata/update-deliveries/{id}/report-installed
  description: Machine reports a successful install; stamps the firmware version onto the machine.
  roles:
  - System
  code: 200
  input: []
  output: UpdateDelivery
  side_effects:
  - status DOWNLOADING -> INSTALLED; Machine.modem_firmware_version = package firmware_version; installed_at = now
- method: POST
  path: /agdata/update-deliveries/{id}/report-failed
  description: Machine reports a failed download/verification.
  roles:
  - System
  code: 200
  input:
  - failure_reason
  output: UpdateDelivery
  side_effects:
  - status DOWNLOADING -> FAILED; failure_reason recorded
- method: POST
  path: /agdata/feature-licenses
  description: Purchase a per-machine feature unlock (OCC on the machine version). fee_cents is computed per calculations.license_bundle_fee.
  roles:
  - GrowerManager
  code: 201
  input:
  - machine_id
  - feature_code
  - license_type
  - term_months?
  - expected_machine_version
  output: FeatureLicense
  side_effects:
  - status=PURCHASED, fee_cents computed; increments Machine.version; ERR_LICENSE_ALREADY_EXISTS if a non-REVOKED license
    for (machine_id, feature_code) exists
- method: GET
  path: /agdata/feature-licenses/{id}
  description: Read a feature license.
  roles:
  - GrowerManager
  - PlatformAdmin
  code: 200
  input: []
  output: FeatureLicense
  side_effects: []
- method: GET
  path: /agdata/feature-licenses
  description: List feature licenses.
  roles:
  - GrowerManager
  - PlatformAdmin
  code: 200
  input:
  - machine_id?
  - feature_code?
  - status?
  - limit?
  - offset?
  output: FeatureLicense[]
  side_effects: []
- method: POST
  path: /agdata/feature-licenses/{id}/activate
  description: Sync-handshake activation of a purchased (or suspended) license onto the machine; requires CONNECTED posture.
  roles:
  - System
  code: 200
  input: []
  output: FeatureLicense
  side_effects:
  - status PURCHASED|SUSPENDED -> ACTIVATED; activated_at/expires_at set on first activation; Machine.active_license_count
    recomputed
- method: POST
  path: /agdata/feature-licenses/{id}/suspend
  description: Suspend a license (feature stops gating as activated).
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: FeatureLicense
  side_effects:
  - status ACTIVATED -> SUSPENDED; Machine.active_license_count recomputed
- method: POST
  path: /agdata/feature-licenses/{id}/revoke
  description: Revoke a license permanently.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: FeatureLicense
  side_effects:
  - status PURCHASED|ACTIVATED|SUSPENDED -> REVOKED; Machine.active_license_count recomputed
- method: POST
  path: /agdata/warranty-claims
  description: Dealer opens a warranty claim draft against an IN_SERVICE machine.
  roles:
  - DealerTechnician
  code: 201
  input:
  - machine_id
  - claim_amount_cents
  - parts_amount_cents
  - description
  output: WarrantyClaim
  side_effects:
  - 'status=DRAFT; dealer_id = X-User-ID, organization_id copied from machine; gates: dealer ACTIVE (ERR_DEALER_SUSPENDED),
    machine IN_SERVICE (ERR_INVALID_STATE_TRANSITION)'
- method: GET
  path: /agdata/warranty-claims/{id}
  description: Read a warranty claim.
  roles:
  - DealerTechnician
  - GrowerManager
  - PlatformAdmin
  code: 200
  input: []
  output: WarrantyClaim
  side_effects:
  - DealerTechnician restricted to claims with dealer_id == X-User-ID; GrowerManager to the owning org
- method: GET
  path: /agdata/warranty-claims
  description: List warranty claims.
  roles:
  - DealerTechnician
  - GrowerManager
  - PlatformAdmin
  code: 200
  input:
  - machine_id?
  - dealer_id?
  - organization_id?
  - status?
  - limit?
  - offset?
  output: WarrantyClaim[]
  side_effects: []
- method: POST
  path: /agdata/warranty-claims/{id}/submit
  description: Submit a draft claim; requires sufficient machine data coverage and reserves the claim amount on the dealer.
  roles:
  - DealerTechnician
  code: 200
  input: []
  output: WarrantyClaim
  side_effects:
  - status DRAFT -> SUBMITTED; Dealer.warranty_reserve_cents += claim_amount_cents; ERR_INSUFFICIENT_DATA_COVERAGE when warranty_data_coverage
    < WARRANTY_MIN_COVERAGE_PCT
- method: POST
  path: /agdata/warranty-claims/{id}/decide
  description: Manufacturer decision; APPROVE computes the payout allocation, DENY releases the dealer reserve.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - decision
  output: WarrantyClaim
  side_effects:
  - SUBMITTED -> APPROVED (payout_cents = calculations.warranty_payout_allocation) or -> DENIED (Dealer.warranty_reserve_cents
    -= claim_amount_cents)
- method: POST
  path: /agdata/warranty-claims/{id}/settle
  description: Settle an approved claim; converts dealer reserve into paid.
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: WarrantyClaim
  side_effects:
  - APPROVED -> SETTLED; Dealer.warranty_reserve_cents -= claim_amount_cents; Dealer.warranty_paid_cents += payout_cents
- method: POST
  path: /agdata/integration-partners
  description: Register a third-party software integration partner.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - name
  - api_quota_calls_per_day
  output: IntegrationPartner
  side_effects:
  - status=REGISTERED, calls_today=0
- method: GET
  path: /agdata/integration-partners/{id}
  description: Read a partner; PartnerApp callers may only read themselves.
  roles:
  - PlatformAdmin
  - PartnerApp
  code: 200
  input: []
  output: IntegrationPartner
  side_effects:
  - PartnerApp requires X-User-ID == partner id (ERR_DATA_ACCESS_DENIED)
- method: POST
  path: /agdata/integration-partners/{id}/submit-for-certification
  description: Submit a partner for certification review (from REGISTERED or EXPIRED).
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: IntegrationPartner
  side_effects:
  - status REGISTERED|EXPIRED -> CERTIFICATION_REVIEW
- method: POST
  path: /agdata/integration-partners/{id}/decide
  description: 'Certification decision: CERTIFY (sets expiry now + CERT_VALIDITY_DAYS) or FAIL (back to REGISTERED).'
  roles:
  - PlatformAdmin
  code: 200
  input:
  - decision
  output: IntegrationPartner
  side_effects:
  - CERTIFICATION_REVIEW -> CERTIFIED | REGISTERED
- method: POST
  path: /agdata/integration-partners/{id}/data-pull
  description: Certified partner pulls scoped organization data through the published interface; consumes one unit of the
    daily quota.
  roles:
  - PartnerApp
  code: 200
  input:
  - organization_id
  - scope
  output:
    organization_id: string
    scope: string
    record_count: integer
    calls_remaining_today: integer
  side_effects:
  - 'calls_today += 1 (reset on UTC date change via clock-set); gates: CERTIFIED (ERR_PARTNER_NOT_CERTIFIED), ACTIVE grant
    covering scope (ERR_DATA_SCOPE_NOT_GRANTED), quota (ERR_PARTNER_QUOTA_EXCEEDED)'
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing, malformed, or an undeclared role
- id: ERR_FORBIDDEN_FOR_ROLE
  http: 403
  condition: Caller role is not in the endpoint's roles list
- id: ERR_INVALID_REQUEST
  http: 400
  condition: 'Malformed body: missing required field, out-of-enum value, bad type/range, valid_from >= valid_until, non-monotonic
    clock-set, or inconsistent body references (e.g., plan organization != machine organization)'
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id (left-to-right) or body foreign key (declared input order) does not exist
- id: ERR_DATA_ACCESS_DENIED
  http: 403
  condition: Caller is neither the owning GrowerManager nor a scope-valid grantee nor PlatformAdmin; also ownership mismatches
    on dealer/partner self-scoped reads and session close by non-opener
- id: ERR_INVALID_STATE_TRANSITION
  http: 409
  condition: Target resource is in a state where the requested transition does not exist (covers ticket-not-GRANTED, wrong-state
    actions, resume of an expired-window grant)
- id: ERR_MACHINE_NOT_ACTIVATED
  http: 409
  condition: UpdateDelivery creation requires machine lifecycle ACTIVATED or IN_SERVICE
- id: ERR_MACHINE_POSTURE_BLOCKED
  http: 409
  condition: Machine connectivity_posture insufficient for the operation (telemetry when EXHAUSTED; sends and license activation
    unless CONNECTED; downloads unless CONNECTED or mandatory+THROTTLED; sessions unless CONNECTED/THROTTLED)
- id: ERR_MODEM_NOT_PROVISIONED
  http: 409
  condition: Machine activation or telemetry ingest with modem_status != PROVISIONED
- id: ERR_PLAN_NOT_ACTIVE
  http: 409
  condition: Machine activation, telemetry ingest, or change-tier without an ACTIVE plan
- id: ERR_ORG_SUSPENDED
  http: 409
  condition: Organization SUSPENDED blocks plan activation/resume, machine activation, consent grant, prescription send, session
    creation
- id: ERR_DEALER_SUSPENDED
  http: 409
  condition: SUSPENDED dealer cannot activate machines, open sessions, or create claims
- id: ERR_FIELD_NOT_ACTIVE
  http: 409
  condition: Prescription creation against a field not in ACTIVE
- id: ERR_PACKAGE_NOT_PUBLISHED
  http: 409
  condition: Delivery creation against a package not in PUBLISHED
- id: ERR_PARTNER_NOT_CERTIFIED
  http: 403
  condition: data-pull by a partner not currently CERTIFIED
- id: ERR_CONSENT_ALREADY_CONSUMED
  http: 409
  condition: Consent ticket already CONSUMED (state check wins over referential mismatches)
- id: ERR_CONSENT_EXPIRED
  http: 409
  condition: Consent ticket is EXPIRED (clock advanced past expires_at)
- id: ERR_TICKET_MACHINE_MISMATCH
  http: 409
  condition: Consent ticket's machine_id differs from the request's machine_id
- id: ERR_TICKET_TYPE_MISMATCH
  http: 409
  condition: Session creation with a ticket whose ticket_type is not REMOTE_DIAGNOSTIC
- id: ERR_RTR_NOT_ENABLED
  http: 403
  condition: IndependentTechnician ticket request or session open in an organization with right_to_repair_enabled == false
- id: ERR_DATA_SCOPE_NOT_GRANTED
  http: 403
  condition: data-pull scope not covered by an ACTIVE, in-window grant naming the partner
- id: ERR_MACHINE_SESSION_ACTIVE
  http: 409
  condition: Another DiagnosticSession is already OPEN on the machine
- id: ERR_GRANT_WINDOW_OVERLAP
  http: 409
  condition: Closed-interval window overlap with an existing ACTIVE/SUSPENDED grant for the same (organization, grantee_type,
    grantee_ref_id) sharing at least one scope
- id: ERR_PLAN_ALREADY_EXISTS
  http: 409
  condition: The machine already has a plan in PENDING, ACTIVE or SUSPENDED
- id: ERR_LICENSE_ALREADY_EXISTS
  http: 409
  condition: A non-REVOKED license for (machine_id, feature_code) already exists
- id: ERR_DELIVERY_ALREADY_PENDING
  http: 409
  condition: A non-terminal UpdateDelivery already exists for (machine_id, package_id)
- id: ERR_DUPLICATE_TELEMETRY_BATCH
  http: 409
  condition: batch_id already accepted for this machine (idempotent re-submission rejected)
- id: ERR_PROVISIONING_ATTEMPTS_EXHAUSTED
  http: 409
  condition: provision-modem attempted when provisioning_attempts == PROVISIONING_MAX_ATTEMPTS
- id: ERR_PACKAGE_MODEL_MISMATCH
  http: 409
  condition: Package target_model_code differs from the machine's model_code
- id: ERR_FEATURE_NOT_LICENSED
  http: 409
  condition: Multi-zone prescription send without an ACTIVATED SECTION_CONTROL license on the machine
- id: ERR_TIER_CHANGE_INVALID
  http: 409
  condition: change-tier with new_tier == current tier
- id: ERR_PRESCRIPTION_EXPIRED
  http: 409
  condition: send-to-machine when now > valid_until
- id: ERR_INSUFFICIENT_DATA_COVERAGE
  http: 409
  condition: Claim submit with conservative data coverage below WARRANTY_MIN_COVERAGE_PCT
- id: ERR_PARTNER_QUOTA_EXCEEDED
  http: 409
  condition: data-pull when calls_today == api_quota_calls_per_day
- id: ERR_FIELD_HAS_OPEN_PRESCRIPTIONS
  http: 409
  condition: Archiving a field with prescriptions in DRAFT, APPROVED or SENT
- id: ERR_STALE_MACHINE_VERSION
  http: 412
  condition: expected_machine_version != current Machine.version on feature-license purchase
- id: ERR_STALE_FIELD_BOUNDARY_VERSION
  http: 412
  condition: expected_field_boundary_version != current FieldBoundary.version on prescription creation
- id: ERR_STALE_PLAN_VERSION
  http: 412
  condition: expected_plan_version != current DataPlan.version on change-tier
roles:
- name: GrowerManager
  description: The grower organization account; owns machines, plans, fields, prescriptions and grants; the only role that
    approves prescriptions and decides consent
  identity: entity_backed:Organization
  exclusive_operations:
  - POST /agdata/prescriptions/{id}/approve
  - POST /agdata/consent-tickets/{id}/grant and /deny
  - POST /agdata/data-share-grants and grant suspend/resume/revoke
  - POST /agdata/feature-licenses (purchase)
  - POST /agdata/field-boundaries and activate/archive
  - POST /agdata/data-plans and activate/resume/change-tier
  shared_operations:
  - machine/plan/field/prescription/grant/ticket/session/delivery/license/claim reads for owned organizations
  - POST /agdata/prescriptions and /revise and /send-to-machine (shared with Agronomist under grant)
  - POST /agdata/machines (shared with PlatformAdmin)
- name: DealerTechnician
  description: Equipment dealer staff; activate machines, provision modems, request diagnostic consent, run diagnostic sessions,
    open warranty claims
  identity: entity_backed:Dealer
  exclusive_operations:
  - POST /agdata/machines/{id}/activate
  - POST /agdata/warranty-claims and /submit
  shared_operations:
  - POST /agdata/machines/{id}/provision-modem (shared with PlatformAdmin)
  - POST /agdata/consent-tickets (shared with IndependentTechnician, PlatformAdmin)
  - POST /agdata/diagnostic-sessions and /close (own sessions)
  - scoped reads under DEALER grants or session participation
- name: IndependentTechnician
  description: Right-to-repair independent mechanic; may request diagnostic consent and open BASIC-level sessions only where
    the organization enables right-to-repair
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - POST /agdata/consent-tickets and /diagnostic-sessions (RTR-gated)
- name: Agronomist
  description: External agronomy advisor; reads TELEMATICS/AGRONOMIC data under grant and may create/revise/send prescriptions
    under an AGRONOMIC grant
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - POST /agdata/prescriptions, /revise, /send-to-machine (grant-gated)
  - grant-scoped reads
- name: CoopAnalyst
  description: Cooperative analyst; read-only access under COOPERATIVE grants
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - grant-scoped reads
- name: PartnerApp
  description: Certified third-party software integration; pulls scoped data through the published interface within its daily
    quota
  identity: entity_backed:IntegrationPartner
  exclusive_operations:
  - POST /agdata/integration-partners/{id}/data-pull
  shared_operations:
  - GET /agdata/integration-partners/{id} (self only)
- name: PlatformAdmin
  description: Platform operator; provisions configuration (orgs, dealers, packages, partners), decides certifications and
    warranty claims, suspends organizations/dealers/licenses, drives the logical clock
  identity: opaque
  exclusive_operations:
  - POST /agdata/organizations, /dealers, /software-packages, /integration-partners and their lifecycle actions
  - POST /agdata/_clock/set_current_utc
  - POST /agdata/update-deliveries (schedule)
  - POST /agdata/warranty-claims/{id}/decide and /settle
  - POST /agdata/feature-licenses/{id}/suspend and /revoke
  shared_operations:
  - all reads; POST /agdata/machines, /data-plans, /provision-modem, /consent-tickets, /data-plans/{id}/suspend
- name: System
  description: 'Machine-side and network automation: telemetry ingest, provisioning callbacks, update download reports, license
    activation handshakes, as-applied reports'
  identity: opaque
  exclusive_operations:
  - POST /agdata/machines/{id}/telemetry-ingest and /modem-provisioning-events
  - POST /agdata/update-deliveries/{id}/start-download, /report-installed, /report-failed
  - POST /agdata/feature-licenses/{id}/activate
  - POST /agdata/prescriptions/{id}/report-as-applied
  shared_operations: []
