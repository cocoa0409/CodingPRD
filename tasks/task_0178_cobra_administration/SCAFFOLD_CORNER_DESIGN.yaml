# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — COBRA Administration
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# Shared minimal fixtures reuse the Plan A chain (premium 61200, coverage_loss
# 2026-04-01, election_deadline 2026-05-31, initial_premium_due 2026-05-25).
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Section 1 — Entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_plan_returns_201_with_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.GroupHealthPlan.fields.standard_admin_fee_pct
          - entities.GroupHealthPlan.fields.election_window_days
        distinguishing_aspect: "POST /plans with only name+applicable_premium_cents applies defaults: standard_admin_fee_pct 0.02, election_window_days 60, initial_premium_grace_days 45, status ACTIVE."
        test_recipe:
          setup: ["No plan exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /plans"
              payload: { name: "Defaults Plan", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
          assert:
            - "response.status == 201"
            - "GroupHealthPlan.${plan_id}.standard_admin_fee_pct == 0.02"
            - "GroupHealthPlan.${plan_id}.election_window_days == 60"
            - "GroupHealthPlan.${plan_id}.initial_premium_grace_days == 45"
            - "GroupHealthPlan.${plan_id}.status == ACTIVE"

      - name: create_beneficiary_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.QualifiedBeneficiary.fields.relationship
          - validations[priority=5]
        distinguishing_aspect: "POST /beneficiaries omitting required relationship -> ERR_INVALID_REQUEST (400), no beneficiary created."
        test_recipe:
          setup: ["Plan A exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "No Rel", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_event_invalid_enum_event_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.QualifyingEvent.fields.event_type
          - validations[priority=5]
        distinguishing_aspect: "POST /events with event_type=FURLOUGH (not a declared enum member) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Plan A + beneficiary exist."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Enum", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "FURLOUGH", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_enrollment_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.CobraEnrollment
          - validations[priority=3]
        distinguishing_aspect: "GET /enrollments/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB beyond a plan."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlanAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: max_coverage_months_computed_36_for_divorce
        claim_type: Computed Fields
        grounds:
          - calculations.max_coverage_months
          - entities.QualifyingEvent.fields.max_coverage_months
        distinguishing_aspect: "DIVORCE event computes max_coverage_months=36 (not the 18 covered by §1.8); input value cannot be supplied by client."
        test_recipe:
          setup: ["Plan A + spouse beneficiary exist."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Spouse", relationship: "SPOUSE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "DIVORCE", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-05-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
          assert:
            - "QualifyingEvent.${event_id}.max_coverage_months == 36"
            - "QualifyingEvent.${event_id}.status == RECORDED"

      - name: hipaa_certificate_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.HipaaCertificate
        distinguishing_aspect: "HipaaCertificate has common_fields:false — read response carries id + created_at but no version/updated_at, and no mutation endpoint exists for it."
        test_recipe:
          setup: ["Enrollment terminated early, certificate issued (reuse early-term chain)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Imm", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 61200, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-15T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /enrollments/${enr_id}/terminate-early"
              payload: { reason: "OTHER_GROUP_COVERAGE" }
              as: PlanAdministrator
          trigger:
            - call: "GET /beneficiaries/${ben_id}/certificates"
              payload: {}
              as: PlanAdministrator
              captures: { cm: $.data.0.creditable_months }
          assert:
            - "HipaaCertificate(beneficiary ${ben_id}).creditable_months == 3"
            - "HipaaCertificate(beneficiary ${ben_id}) read response has no `version` field"

      - name: create_event_unknown_beneficiary_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.QualifyingEvent.fields.beneficiary_id
          - validations[priority=3]
        distinguishing_aspect: "POST /events referencing a beneficiary_id that does not exist -> ERR_NOT_FOUND (404) (FK existence validated)."
        test_recipe:
          setup: ["Plan A exists; no beneficiary with the supplied id."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "00000000-0000-4000-8000-000000000000", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_beneficiaries_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - entities.QualifiedBeneficiary.fields.plan_id
        distinguishing_aspect: "GET /plans/{id}/beneficiaries returns an array envelope with pagination meta (total_count, has_more) after two beneficiaries are registered."
        test_recipe:
          setup: ["Plan A with two beneficiaries."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B One", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Two", relationship: "SPOUSE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
          trigger:
            - call: "GET /plans/${plan_id}/beneficiaries"
              payload: {}
              as: PlanAdministrator
          assert:
            - "response.response_type == array"
            - "response.data length == 2"
            - "response.meta total_count == 2 and has_more == false"

  # ---------------------------------------------------------------------------
  # Section 2 — State Machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: void_event_after_notice_sent_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.QualifyingEvent.RECORDED_to_VOID
          - validations[priority=6]
        distinguishing_aspect: "Voiding an event already in NOTICE_SENT (not RECORDED) -> ERR_INVALID_STATE (409); event stays NOTICE_SENT."
        test_recipe:
          setup: ["Plan A; event recorded and notice sent."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B VoidNs", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
          trigger:
            - call: "POST /events/${event_id}/void"
              payload: {}
              as: PlanAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "QualifyingEvent.${event_id}.status == NOTICE_SENT"

      - name: terminate_early_on_terminated_enrollment_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CobraEnrollment.ACTIVE_to_TERMINATED
          - validations[priority=6]
        distinguishing_aspect: "A second terminate-early on an already-TERMINATED enrollment -> ERR_INVALID_STATE (409); TERMINATED is terminal."
        test_recipe:
          setup: ["Plan A enrollment terminated early once (OTHER_GROUP_COVERAGE)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Term2", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 61200, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-06-15T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /enrollments/${enr_id}/terminate-early"
              payload: { reason: "OTHER_GROUP_COVERAGE" }
              as: PlanAdministrator
          trigger:
            - call: "POST /enrollments/${enr_id}/terminate-early"
              payload: { reason: "MEDICARE_ENTITLEMENT" }
              as: PlanAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: run_to_term_tick_issues_certificate_18_months
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CobraEnrollment.ACTIVE_to_TERMINATED
          - calculations.creditable_months
          - entities.CobraEnrollment.fields.termination_reason
        distinguishing_aspect: "After clock passes scheduled_end 2027-09-30, tick TERMINATES with RUN_TO_TERM and issues a HIPAA certificate with creditable_months 18 (distinct from the nonpayment/early-term cascades in §1.8)."
        test_recipe:
          setup: ["Plan A enrollment ACTIVE (April paid keeps it ACTIVE); clock jumped past scheduled_end 2027-09-30 to 2027-10-05."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Run", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 61200, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2027-10-05T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /plans/${plan_id}/tick"
              payload: {}
              as: PlanAdministrator
            - call: "GET /beneficiaries/${ben_id}/certificates"
              payload: {}
              as: PlanAdministrator
              captures: { cm: $.data.0.creditable_months }
          assert:
            - "CobraEnrollment.${enr_id}.status == TERMINATED"
            - "CobraEnrollment.${enr_id}.termination_reason == RUN_TO_TERM"
            - "CobraEnrollment.${enr_id}.actual_end_date == 2027-09-30"
            - "HipaaCertificate(beneficiary ${ben_id}).creditable_months == 18"

      - name: initial_premium_nonpayment_tick_terminates_no_certificate
        claim_type: Conditional cascade
        grounds:
          - state_machines.CobraEnrollment.PENDING_INITIAL_PREMIUM_to_TERMINATED
          - entities.CobraEnrollment.fields.actual_end_date
        distinguishing_aspect: "Enrollment never paid month 1; tick past initial_premium_due_date 2026-05-25 TERMINATES (NONPAYMENT) with actual_end_date 2026-03-31 (= coverage_start - 1) and issues NO HIPAA certificate (creditable_months would be 0)."
        test_recipe:
          setup: ["Plan A enrollment PENDING_INITIAL_PREMIUM (elected, never paid); clock past initial due 2026-05-25 to 2026-05-26."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B NoPay", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-05-26T00:00:00.000Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /plans/${plan_id}/tick"
              payload: {}
              as: PlanAdministrator
            - call: "GET /beneficiaries/${ben_id}/certificates"
              payload: {}
              as: PlanAdministrator
          assert:
            - "CobraEnrollment.${enr_id}.status == TERMINATED"
            - "CobraEnrollment.${enr_id}.termination_reason == NONPAYMENT"
            - "CobraEnrollment.${enr_id}.actual_end_date == 2026-03-31"
            - "GET /beneficiaries/${ben_id}/certificates returns data length == 0"

      - name: payment_flips_pending_enrollment_to_active_bubble_up
        claim_type: Bubble up
        grounds:
          - state_machines.CobraEnrollment.PENDING_INITIAL_PREMIUM_to_ACTIVE
          - entities.PremiumAccount.fields.paid_through_date
        distinguishing_aspect: "First month-1 payment within initial grace bubbles enrollment PENDING_INITIAL_PREMIUM -> ACTIVE and sets account.paid_through_date to 2026-04-30."
        test_recipe:
          setup: ["Plan A enrollment PENDING_INITIAL_PREMIUM; April invoice OPEN; clock 2026-04-20 (before due 2026-05-25)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Bub", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
