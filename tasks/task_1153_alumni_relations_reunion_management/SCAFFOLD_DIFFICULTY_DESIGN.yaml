              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${evb_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${evb_id}/registrations"
              payload: { tier_id: "${tierb_id}", alumni_id: "${bal_id}" }
