            - "Submission exactly at cooldown_until 2026-10-01 succeeds (right edge open): review created with recommendation_state in {PENDING, DISPLAYED, FILTERED}"
            - "The auto-placed alert itself remains ACTIVE (cooldown expiry does not lift the alert)"

