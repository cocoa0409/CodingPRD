          - entities.Partner.fields.marketing_qualified_spend_cents
          - entities.Partner.fields.marketing_attainment_pct
        distinguishing_aspect: |
          CASCADE B is triggered by MdfClaim validation_state VALIDATED -> REJECTED - a different
          transition from CASCADE A's registration approval - and propagates along a fiscal path:
          claw-back (hop 1) releases the allocation commitment (hop 2), which removes the claim's
          verified spend from marketing_qualified_spend_cents dropping attainment 1.0 -> 0.0
          (hop 3), which trips the MARKETING_COMPLIANCE_MIN_PCT 0.75 floor and downgrades the
          partner to PROBATION / STANDARD (hop 4).
