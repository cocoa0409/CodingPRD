      - name: donor_revisits_screening_through_the_deferral_cycle
        grounds:
          - state_machines.Donor.status
          - endpoints."POST /eye-bank/donors/{id}/defer"
          - endpoints."POST /eye-bank/donors/{id}/reinstate"
          - entities.Donor.fields.deferral_reason
          - entities.Donor.fields.consent_scope
        distinguishing_aspect: |
          The cycle edge — a donor already at CONSENT_OBTAINED is deferred, reinstated back to
          SCREENING, and then walks CONSENT_OBTAINED again. States repeat but version only ever
          increases, deferral_reason is set then cleared, and consent_scope survives the round
          trip (a fresh consent call must not be required to preserve it).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "donor referred, one screening record recorded (REFERRED -> SCREENING), consent captured (-> CONSENT_OBTAINED, version 3)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-CYC", referral_source: "MEDICAL_EXAMINER", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", body_cooled_at: "2026-08-03T03:00:00.000Z", age_years: 52, cause_of_death_category: "CARDIAC" }
