            - "After app2 is withdrawn: ledger 95.00 / 0.00 / 100.00 and status is STILL PARTIALLY_TRANSFERRED, not ACTIVE — the derivation is a function of the ledger, and transferred_away_af never decreases."
            - "certified_hcu_af stays 195.00 across all three states and the right's version increases on every ledger movement."

      - name: calc_mitigation_fee_tier_selected_on_the_presurcharge_subtotal
        claim_type: constants_applied
        grounds: [calculations.mitigation_fee, calculations.mitigation_fee.constants]
        distinguishing_aspect: >-
          The tier is chosen from the pre-surcharge base_fee_usd, so a volume
          whose post-surcharge total crosses a tier threshold must still be priced
          in the lower tier.
        excluded_because:
          difficulty_instance: mitigation_fee_tier_on_presurcharge_subtotal
          rationale: >-
            The §1.8 instance is built exactly on this trap: it prices volumes
            that straddle both the 5000.00 and 20000.00 thresholds and asserts
            both the correct surcharge_pct and the wrong one that a
            post-surcharge tier lookup would select. A breadth instance would
            restate the same computation with the same constants.

      - name: calc_lease_settlement_credit_variant_divergence_and_precision
        claim_type: variant_divergence
        grounds: [calculations.lease_settlement_credit, calculations.lease_settlement_credit.variants]
        distinguishing_aspect: >-
          PRO_RATA_DAILY and SEASON_BLOCK split the same partially-elapsed lease
          differently, and the two-step 3-dp-then-2-dp rounding is observable on
          the settlement figure.
        excluded_because:
          difficulty_instance: lease_settlement_valuation_variant
          rationale: >-
            The §1.8 instance cancels two identical leases mid-window under the
            two valuation methods and asserts both used_af / settlement_credit_af
            pairs, the half-open day count, the 30-day block behaviour and the
            two-step rounding. Repeating it at breadth level would add no case
            the depth instance does not already pin.

      - name: calc_pod_concurrent_rate_load_half_open_and_aggregated
        claim_type: input_set_filtering
        grounds:
          - "calculations.pod_concurrent_rate_load"
          - "validations[priority=42]"
        distinguishing_aspect: >-
          The capacity rule sums rates over half-open overlaps, so touching
          windows never collide and equality with max_rate_cfs is admissible.
        excluded_because:
          difficulty_instance: pod_half_open_adjacency_and_aggregate
          rationale: >-
            The §1.8 instance already exercises the adjacency boundary (an
            end-date-equals-start-date pair that must be accepted), the
            aggregation of three overlapping leases and the exact-equality case,
            which together subsume any single breadth-level boundary probe.

      - name: calc_right_lease_exclusion_window_closed_with_fallow_buffer
        claim_type: constants_applied
        grounds:
          - "calculations.right_lease_exclusion_window"
          - "validations[priority=41]"
        distinguishing_aspect: >-
          The same-right/different-headgate exclusivity window is CLOSED and
          padded by a 7-day fallow buffer on both sides, the opposite geometry
          from the capacity rule.
        excluded_because:
          difficulty_instance: right_closed_buffer_across_headgates
          rationale: >-
            The §1.8 instance places candidate leases at 7 days and 8 days from an
            existing lease on a different headgate of the same right and asserts
            the collision / no-collision pair, which is the entire content of this
            corner.

      - name: calc_right_volume_ledger_conservation_across_escrow_movements
        claim_type: reconciliation
        grounds: [calculations.right_volume_ledger]
        distinguishing_aspect: >-
          certified_hcu_af == transferable_af + encumbered_af +
          transferred_away_af must hold after every escrow, release and permanent
          transfer.
        excluded_because:
          difficulty_instance: right_volume_ledger_submit_withdraw
          rationale: >-
            The §1.8 conservation instance walks the full submit / resubmit /
            withdraw / decide cycle and asserts the identity plus exact bucket
            values at every step, including the compensating-action requirement
            that withdrawal restores the pre-submit values byte for byte.

      - name: calc_bank_credit_ledger_conservation_across_reservations
        claim_type: reconciliation
        grounds: [calculations.bank_credit_ledger]
        distinguishing_aspect: >-
          deposited_credit_af == available_credit_af + committed_credit_af +
          leased_out_af must hold across reservation, activation, settlement and
          cancellation.
        excluded_because:
          difficulty_instance: bank_credit_ledger_reserve_cancel
          rationale: >-
            The §1.8 conservation instance already reserves, activates, cancels
            and settles a lease while asserting the identity and each bucket after
            every move, including the exact-restoration case from RESERVED.

  - section: validations
    instances:
      - name: val_priority_role_check_precedes_path_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - complexity_profile.validation_rule_count
        distinguishing_aspect: >-
          A caller with the wrong role naming a right that does not exist gets
          403 ROLE_NOT_PERMITTED, never 404 — the authorization gate at priority 2
          runs before any path id is resolved at priority 3, so the response
          cannot be used to probe which right numbers exist.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z. No water right with the probed id exists. POST /water-rights/{id}/hcu-studies is restricted to WaterRightsAnalyst only."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /water-rights/00000000-0000-0000-0000-000000000000/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: BasinAdjudicator, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED."
            - "ERR_WATER_RIGHT_NOT_FOUND (404) must NOT be returned even though the path id is unresolvable."
            - "No HcuStudy row is created."

      - name: val_priority_path_existence_precedes_request_shape
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=6]
        distinguishing_aspect: >-
          An unresolvable path id with a simultaneously malformed body returns
          404, not 422: existence at priority 3 outranks request-shape validation
          at priority 6, so body parsing cannot mask a bad route.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; no water right with the probed id exists. The body is invalid twice over: `method` is not a member of the enum and the study period is inverted."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /water-rights/00000000-0000-0000-0000-000000000000/hcu-studies", payload: {method: GUESSWORK, study_period_start_year: 2025, study_period_end_year: 2023}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404 with error_id ERR_WATER_RIGHT_NOT_FOUND."
            - "ERR_INVALID_REQUEST (422) must NOT be returned."

      - name: val_priority_body_foreign_key_precedes_uniqueness
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=11]
        distinguishing_aspect: >-
          Two independent violations in the same body — an unknown claimant_id and
          a right_number that is already taken — resolve to the referential error
          at priority 7, not the uniqueness error at priority 11.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A exists and already holds right WR-2198-001."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
          trigger:
            - {call: "POST /water-rights", payload: {claimant_id: "00000000-0000-0000-0000-000000000000", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404 with error_id ERR_CLAIMANT_NOT_FOUND."
            - "ERR_DUPLICATE_RIGHT_NUMBER (409) must NOT be returned."
            - "No second WaterRight row is created and claimant A's right count is unchanged."

      - name: val_priority_scope_completeness_precedes_study_ownership
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: >-
          A CHANGE_OF_USE application that both omits its mandatory
          proposed_purpose_of_use AND cites a certified study belonging to a
          DIFFERENT right returns the scope error at priority 8, not the
          cross-reference error at priority 9 — the two nearest business rules on
          this endpoint are separated by exactly one priority step.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; rights R1 and R2 both activated with METER evidence and each carrying its own CERTIFIED study."
