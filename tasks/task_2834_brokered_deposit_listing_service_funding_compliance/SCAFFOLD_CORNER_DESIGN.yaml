  - section: validations
    instances:
      - name: corner_duplicate_cert_id_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority 39 ERR_DUPLICATE_KEY]
          - endpoints[POST /institutions]
          - endpoints[POST /institutions/{id}/concentration-limits]
        distinguishing_aspect: "cert_id is globally unique, so the second institution with CERT-9050 is a 409 ERR_DUPLICATE_KEY - while ConcentrationLimit.metric is deliberately NOT a uniqueness key, so a second BROKERED_TO_TOTAL_DEPOSITS limit is a 201 that supersedes the first."
        test_recipe:
          setup:
            - "One institution holding cert_id CERT-9050 with one ACTIVE BROKERED_TO_TOTAL_DEPOSITS limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Unique Bank NA", cert_id: "CERT-9050", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /institutions/${inst_id}/concentration-limits"
              payload: { metric: "BROKERED_TO_TOTAL_DEPOSITS", warning_threshold_bps: 1000, breach_threshold_bps: 2000 }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { lim1_id: $.data.id }
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Copycat Bank NA", cert_id: "CERT-9050", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 1000000000, total_liabilities_cents: 2000000000, tier1_capital_cents: 200000000, liquidity_buffer_cents: 50000000 }
              as: SystemAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /institutions/${inst_id}/concentration-limits"
              payload: { metric: "BROKERED_TO_TOTAL_DEPOSITS", warning_threshold_bps: 1500, breach_threshold_bps: 2500 }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { lim2_id: $.data.id }
          assert:
            - "first trigger: HTTP 409 with error_id == ERR_DUPLICATE_KEY and a non-empty message; no second institution row is created"
            - "second trigger: HTTP 201 - a repeated metric is a supersession, not a duplicate key"
            - "ConcentrationLimit.${lim1_id}.status == RETIRED with current_value_bps == 0 and breach_state == WITHIN"
            - "ConcentrationLimit.${lim2_id}.status == ACTIVE with breach_threshold_bps == 2500 and breach_state == WITHIN"
            - "GET /institutions/${inst_id}/concentration-limits?status=ACTIVE returns total_count == 1"

