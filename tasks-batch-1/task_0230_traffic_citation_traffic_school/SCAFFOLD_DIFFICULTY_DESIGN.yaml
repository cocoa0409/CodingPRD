  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: owner_vs_state_on_partial_payment_owner_wins
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair business_referential (priority 4, ERR_NOT_RESOURCE_OWNER) vs
          state (priority 5, ERR_INVALID_STATE). A non-owning Driver pays a VOID
          citation: both the ownership check and the state check would fail; the
          lower-priority-number ownership error (403) must win over the state error (409).
        test_recipe:
          setup:
            - "Jurisdiction A; citation owned by D9 and VOIDed; a second driver D10 (not the owner) attempts to pay it."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D9LIC", full_name: "Ell Nine" }
              as: CourtClerk
              captures: { d9: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D10LIC", full_name: "Em Ten" }
              as: CourtClerk
              captures: { d10: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d9}", citation_number: "C-PV1", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { c9: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c9}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c9}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${c9}/void"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /citations/${c9}/payments"
              payload: { amount_cents: 1000, method: "CARD" }
              as: Driver
              as_user_id: "${d10}"
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER (priority 4 beats the priority-5 ERR_INVALID_STATE)"

      - name: not_yet_late_vs_already_applied_on_late_penalty
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_NOT_YET_LATE]
          - errors[ERR_PENALTY_ALREADY_APPLIED]
        distinguishing_aspect: |
          Category pair business_temporal (priority 6, ERR_NOT_YET_LATE) vs
          business_constraint (priority 17, ERR_PENALTY_ALREADY_APPLIED) — a DIFFERENT
          pairing from the instance above. Late penalty already applied AND the clock
          is then rewound before appear_by: the temporal check (priority 6) fires first
          and returns ERR_NOT_YET_LATE, not the already-applied error.
        test_recipe:
          setup:
            - "Jurisdiction A; citation assessed; clock advanced past appear_by; late penalty applied once (late_penalty_applied=true); clock rewound to before appear_by."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
