              as_user_id: "${cred_or}"
              captures: { debt_1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_or}", debtor_tin: "555-66-7777", debtor_name: "Sam Poe", debt_type: "STATE_TAX", original_amount_cents: 40000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-11-15T00:00:00Z", due_process_completed: true }
