          assert:
            - "the 90-hour call returns HTTP 422 with error_id ERR_PAYER_HOUR_CAP_EXCEEDED, not ERR_APPROVED_EXCEEDS_REQUESTED"
            - "the 60-hour call returns HTTP 422 with error_id ERR_APPROVED_EXCEEDS_REQUESTED"
            - "the 40-hour call returns HTTP 201 with Authorization.${auth_id}.approved_hours_per_week == 40 and status == \"PENDING\""
            - "the two rejected calls left PlanOfCare.${poc_id}.version at 2, so the same expected_plan_of_care_version still worked for the third call"

      - name: uniqueness_rules_bite_on_licence_numbers_and_competencies
        claim_type: Violation → Error
        grounds:
          - validations[priority 30 ERR_LICENSE_NUMBER_TAKEN]
          - validations[priority 31 ERR_COMPETENCY_DUPLICATE]
          - endpoints[POST /pdn/nurse-competencies/{id}/revoke]
        distinguishing_aspect: >-
          A repeated licence number is 409 and a second TRACH competency for the same nurse is 409,
          but once the first competency is REVOKED the same (nurse, TRACH) pair may be re-attested,
          because the uniqueness set excludes REVOKED rows.
        test_recipe:
          setup:
            - "One nurse RN-100001 holding a VALID TRACH competency."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/nurses"
              payload: { full_name: "Nora Vance", license_type: "RN", license_number: "RN-100001", license_expires_on: "2027-06-30", max_weekly_hours: 48 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { n1_id: $.data.id }
            - call: "POST /pdn/nurses/${n1_id}/competencies"
              payload: { skill: "TRACH", validated_on: "2026-06-01", expires_on: "2027-07-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /pdn/nurses"
              payload: { full_name: "Other Nurse", license_type: "LPN", license_number: "RN-100001", license_expires_on: "2027-06-30" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/nurses/${n1_id}/competencies"
              payload: { skill: "TRACH", validated_on: "2026-07-01", expires_on: "2027-08-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "POST /pdn/nurse-competencies/${comp_id}/revoke"
              payload: { revoked_reason: "return demonstration failed on re-check" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "POST /pdn/nurses/${n1_id}/competencies"
              payload: { skill: "TRACH", validated_on: "2026-07-01", expires_on: "2027-08-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
              captures: { comp2_id: $.data.id }
          assert:
            - "the duplicate licence number returns HTTP 409 with error_id ERR_LICENSE_NUMBER_TAKEN"
            - "the duplicate TRACH attestation returns HTTP 409 with error_id ERR_COMPETENCY_DUPLICATE"
            - "the revoke returns HTTP 200 with NurseCompetency.${comp_id}.status == \"REVOKED\""
            - "the re-attestation returns HTTP 201 with NurseCompetency.${comp2_id}.status == \"VALID\""
            - "Nurse.${n1_id}.verified_skills == [\"TRACH\"] after the re-attestation (the REVOKED row contributes nothing)"

