  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_cycle_create_initial_state_planning_with_budget_split
        claim_type: initial_state
        grounds:
          - state_machines.ProgramCycle.null_to_PLANNING
          - calculations.program_budget_waterfall
          - entities.ProgramCycle.fields.reserve_pct
        distinguishing_aspect: "A newly created ProgramCycle lands in PLANNING with every counter zeroed and the reserve split already applied: reserve_pct defaults to 0.05, so a 10,000,000,000-cent authorisation yields reserve 500,000,000, available 9,500,000,000 and remaining == available."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; no program cycles exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2027, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED" }
              as: ProgramAdmin
              captures: { pc_id: $.data.id }
          assert:
            - "HTTP 201; ProgramCycle.${pc_id}.status == PLANNING (the declared initial state) and version == 1"
            - "ProgramCycle.${pc_id}.reserve_pct == 0.05 (default applied), reserve_cents == 500000000, available_cents == 9500000000"
            - "ProgramCycle.${pc_id}.committed_cents == 0 and remaining_cents == 9500000000"
            - "ProgramCycle.${pc_id}.identified_count == 0, programmed_count == 0, deferred_count == 0, unprogrammed_cost_cents == 0"
            - "ProgramCycle.${pc_id}.locked_at == null, submitted_at == null, closed_at == null"
            - "GET /program-cycles/${pc_id}/allocation-summary reports identity_holds == true with authorized_budget_cents == reserve_cents + committed_cents + remaining_cents"

      - name: scour_evaluation_finalize_low_risk_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.ScourEvaluation.DRAFT_to_FINAL
          - calculations.scour_status_derivation
          - entities.Bridge.fields.scour_status
        distinguishing_aspect: "Finalising a scour_code 5 evaluation moves it DRAFT -> FINAL and publishes derived_scour_status LOW_RISK to the Bridge, which is the branch of HOP 3 that creates NO plan of action and leaves the 24-month interval and poa_compliant true untouched."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Rita Rating is licensed (PE-11021) and CURRENT; Cedar Creek Bridge has spans_water true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Rita Rating", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", load_rating_engineer_licensed: true, pe_license_number: "PE-11021" }
              as: ProgramAdmin
              captures: { rate_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/scour-evaluations"
              payload: { evaluated_by_id: "${rate_id}", evaluation_method: "HEC18_SCREENING", scour_code: 5, foundation_type: "PILE", observed_scour_depth_m: 0.4 }
              as: RatingEngineer
              as_user_id: "${rate_id}"
              captures: { se_id: $.data.id }
          trigger:
            - call: "POST /scour-evaluations/${se_id}/finalize"
              payload: {}
              as: RatingEngineer
              as_user_id: "${rate_id}"
              captures: { se_status: $.data.status }
          assert:
            - "HTTP 200; ScourEvaluation.${se_id}.status == FINAL and finalized_at == 2026-09-01T00:00:00Z"
            - "ScourEvaluation.${se_id}.derived_scour_status == LOW_RISK - scour_code 5 sits between SCOUR_CRITICAL_MAX_CODE 3 and LOW_RISK_MAX_CODE 6"
            - "Bridge.${br_id}.scour_status == LOW_RISK and Bridge.${br_id}.version == 2 (the create left it at 1, HOP 2 bumped it once)"
            - "Bridge.${br_id}.inspection_interval_months is still 24 and next_inspection_due_date is still 2028-09-01 - the 12-month scour floor applies only to SCOUR_CRITICAL"
            - "Bridge.${br_id}.poa_compliant is still true and GET /plans-of-action?bridge_id=${br_id} returns an empty list with total_count == 0"

