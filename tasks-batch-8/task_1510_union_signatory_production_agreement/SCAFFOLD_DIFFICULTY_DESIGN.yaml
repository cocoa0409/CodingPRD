scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contribution_report_provisional_includes_open_logs_final_excludes
        grounds:
          - calculations.contribution_dues
          - entities.ContributionReport.fields.provisional_contributions_due_cents
          - entities.ContributionReport.fields.final_contributions_due_cents
          - state_machines.ContributionReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Same inclusion set, same production, same ULB tier: the provisional variant
          (computed at creation, includes OPEN logs) yields 30600 cents while the final
          variant (computed at submit, excludes the still-OPEN SOUND log) yields 17000
          cents — the two variants of contribution_dues diverge on the ContributionReport
          entity domain (financial reporting), driven purely by log-status filtering.
        test_recipe:
          setup:
            - "SIGNATORY company with one ULTRA_LOW_BUDGET production (budget 20000000, bond posted 2500000) in IN_PRODUCTION"
            - "crew: CAMERA W-CAM-1 @120000 (ACTIVE, log L1 on 2026-08-10 SUBMITTED), GRIP W-GRIP-1 @90000 (HIRED), SOUND W-SND-1 @80000 (ACTIVE, log L2 on 2026-08-10 left OPEN)"
            - "default logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Canyon Films LLC", fein: "12-3456789" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Desert Night", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "DIRECTOR_OF_PHOTOGRAPHY", daily_rate_cents: 120000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "KEY_GRIP", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "SOUND_MIXER", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { snd_id: $.data.id } }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${snd_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { log1_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${log1_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${snd_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 900, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { log2_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 1, work_day_log_ids: [ "${log1_id}", "${log2_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep_id: $.data.id } }
            - { call: "POST /union-compliance/contribution-reports/${rep_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "ContributionReport.${rep_id}.provisional_gross_wages_cents == 180000"
            - "ContributionReport.${rep_id}.provisional_contributions_due_cents == 30600"
            - "ContributionReport.${rep_id}.final_gross_wages_cents == 100000"
            - "ContributionReport.${rep_id}.final_contributions_due_cents == 17000"
            - "ContributionReport.${rep_id}.status == SUBMITTED"

      - name: audit_assessment_per_period_vs_aggregate_netting
        grounds:
          - calculations.audit_assessment
          - entities.Audit.fields.assessment_cents
          - entities.Audit.fields.alt_assessment_cents
          - state_machines.Audit.OPEN_to_FINDINGS_ISSUED
        distinguishing_aspect: |
          On the Audit entity domain (assessment arithmetic — a different entity domain
          from ContributionReport dues): with period 5 over-reported by 16000 (a listed
          log was voided after acceptance, then the tier upgraded) and period 6
          under-reported by 1000, the official per_period variant yields 1100 cents
          (no cross-period netting) while the aggregate variant yields 0 cents
          (net −15000 floored at 0) — same accepted reports, two valid algorithms.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production (budget 20000000, bond posted 2500000) IN_PRODUCTION with CAMERA crew @100000 ACTIVE (plus HIRED GRIP/SOUND to satisfy staffing)"
            - "L1 (2026-08-10), L2 (2026-08-12), L3 (2026-08-13) all SUBMITTED; report period 5 [L1,L2] ACCEPTED with final 34000; report period 6 [L3] ACCEPTED with final 17000"
            - "L2 voided after acceptance; budget revised to 40000000 upgrading tier to MODIFIED_LOW_BUDGET (rate 18, cap 150000)"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Ridge Pictures LLC", fein: "98-7654321" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Ridge Line", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${l1_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-12", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l2_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${l2_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-13", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l3_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${l3_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 5, work_day_log_ids: [ "${l1_id}", "${l2_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep5_id: $.data.id } }
            - { call: "POST /union-compliance/contribution-reports/${rep5_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports/${rep5_id}/review", payload: { decision: "ACCEPT" }, as: FundTrustee }
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 6, work_day_log_ids: [ "${l3_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep6_id: $.data.id } }
            - { call: "POST /union-compliance/contribution-reports/${rep6_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports/${rep6_id}/review", payload: { decision: "ACCEPT" }, as: FundTrustee }
            - { call: "POST /union-compliance/work-day-logs/${l2_id}/void", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "GET /union-compliance/productions/${prod_id}", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v: $.data.version } }
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 40000000, expected_production_version: "${prod_v}" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/audits", payload: { production_id: "${prod_id}", scope_period_indices: [ 5, 6 ] }, as: FundTrustee, as_user_id: "ft_1", captures: { audit_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/audits/${audit_id}/issue-findings", payload: {}, as: FundTrustee, as_user_id: "ft_1" }
          assert:
            - "Audit.${audit_id}.status == FINDINGS_ISSUED"
            - "Audit.${audit_id}.assessment_cents == 1100"
            - "Audit.${audit_id}.alt_assessment_cents == 0"
            - "Audit.${audit_id}.assessment_cents != Audit.${audit_id}.alt_assessment_cents"

  # ===================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b))
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contribution_dues_tier_cap_branch_and_single_rounding
        grounds:
          - calculations.contribution_dues
          - entities.ContributionReport.fields.final_gross_wages_cents
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction: per-log
          min(daily_rate, tier cap) branches (only the 120000 CAMERA log is capped at
          the ULB cap 100000), tier-rate selection (ULB rate 17/100), then a single
          round_half_up on the aggregated base — yielding gross 275000 and dues 46750.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production IN_PRODUCTION; CAMERA @120000, GRIP @95000, SOUND @80000 all ACTIVE with one SUBMITTED log each (2026-08-10/11/12), no penalties"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Delta Motion LLC", fein: "22-1111111" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "TELEVISION", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Delta Run", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "DIRECTOR_OF_PHOTOGRAPHY", daily_rate_cents: 120000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "KEY_GRIP", daily_rate_cents: 95000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { grip_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "SOUND_MIXER", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { snd_id: $.data.id } }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${grip_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${snd_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${grip_id}", work_date: "2026-08-11", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { lg_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${snd_id}", work_date: "2026-08-12", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { ls_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${lc_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs/${lg_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs/${ls_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 1, work_day_log_ids: [ "${lc_id}", "${lg_id}", "${ls_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/contribution-reports/${rep_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "ContributionReport.${rep_id}.final_gross_wages_cents == 275000"
            - "ContributionReport.${rep_id}.final_contributions_due_cents == 46750"

      - name: work_log_penalty_per_unit_rounding_pinned
        grounds:
          - calculations.work_log_penalties
          - entities.WorkDayLog.fields.meal_penalty_cents
          - entities.WorkDayLog.fields.penalty_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters (a different mode from
          instance 1's mode-(a) tiered-branch formula): daily rate 100010 with a
          75-minute meal delay (3 half-hour units). The pinned per-unit order
          round_half_up(100010/32)=3125 then multiply gives 9375; the rejected
          sum-then-round order would give round_half_up(300030/32)=9376.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production IN_PRODUCTION; CAMERA crew @100010 ACTIVE (plus HIRED GRIP/SOUND for staffing); no prior-day log for the assignment"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Echo Stage LLC", fein: "33-2222222" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "NEW_MEDIA", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Echo Falls", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100010 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 1000, meal_breaks: [ { start_minutes: 915, end_minutes: 945 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { log_id: $.data.id } }
          assert:
            - "WorkDayLog.${log_id}.meal_penalty_units == 3"
            - "WorkDayLog.${log_id}.meal_penalty_cents == 9375"
            - "WorkDayLog.${log_id}.turnaround_violation == false"
            - "WorkDayLog.${log_id}.penalty_cents == 9375"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_info_request_cycle
        grounds:
          - state_machines.SignatoryApplication.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.SignatoryApplication.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.SignatoryApplication.fields.review_rounds
        distinguishing_aspect: |
          On SignatoryApplication: a true cycle UNDER_REVIEW -> INFO_REQUESTED ->
          UNDER_REVIEW (negotiation loop), exercised twice so review_rounds reaches 2
          before APPROVED — the entity revisits UNDER_REVIEW rather than progressing
          linearly.
        test_recipe:
          setup:
            - "company PENDING with one DRAFT application (scope THEATRICAL)"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Foxglove Films LLC", fein: "44-3333333" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 60000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/signatory-applications/${app_id}/request-info", payload: { info_request_note: "Provide financing plan" }, as: UnionRep }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/provide-info", payload: { info_response: "Financing plan v1 attached" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/request-info", payload: { info_request_note: "Provide chain of title" }, as: UnionRep }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/provide-info", payload: { info_response: "Chain of title attached" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
          assert:
            - "SignatoryApplication.${app_id}.review_rounds == 2"
            - "SignatoryApplication.${app_id}.status == APPROVED"
            - "ProducerCompany.${co_id}.status == SIGNATORY"

      - name: grievance_settlement_negotiation_cycle
        grounds:
          - state_machines.Grievance.INVESTIGATING_to_PROPOSED_SETTLEMENT
          - state_machines.Grievance.PROPOSED_SETTLEMENT_to_INVESTIGATING
          - entities.Grievance.fields.proposal_status
        distinguishing_aspect: |
          On Grievance (a different entity from SignatoryApplication): the negotiation
          cycle INVESTIGATING -> PROPOSED_SETTLEMENT -> INVESTIGATING via REJECT, then a
          second proposal accepted — proposal_status walks NONE -> OPEN -> REJECTED ->
          OPEN -> ACCEPTED while the grievance loops back before resolving.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production in STAFFING (bond posted); grievance FILED by ur_1 with incident 2026-07-20 (inside the 30-day window of the default 2026-08-01 clock), intake accepted by ur_1"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Harbor Light LLC", fein: "55-4444444" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Harbor Shift", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_id}", category: "PAY", incident_date: "2026-07-20", description: "Late payroll for week 30" }, as: UnionRep, as_user_id: "ur_1", captures: { grv_id: $.data.id } }
            - { call: "POST /union-compliance/grievances/${grv_id}/accept-intake", payload: {}, as: UnionRep, as_user_id: "ur_1", captures: { grv_v: $.data.version } }
          trigger:
            - { call: "POST /union-compliance/grievances/${grv_id}/propose-settlement", payload: { proposal_amount_cents: 50000, expected_grievance_version: "${grv_v}" }, as: UnionRep, as_user_id: "ur_2" }
            - { call: "POST /union-compliance/grievances/${grv_id}/respond-settlement", payload: { decision: "REJECT" }, as: ProducerRep, as_user_id: "${co_id}", captures: { grv_v2: $.data.version } }
            - { call: "POST /union-compliance/grievances/${grv_id}/propose-settlement", payload: { proposal_amount_cents: 70000, expected_grievance_version: "${grv_v2}" }, as: UnionRep, as_user_id: "ur_2" }
            - { call: "POST /union-compliance/grievances/${grv_id}/respond-settlement", payload: { decision: "ACCEPT" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/grievances/${grv_id}/payments", payload: { amount_cents: 70000 }, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "after REJECT: Grievance.${grv_id}.status == INVESTIGATING and proposal_status == REJECTED"
            - "after second ACCEPT: Grievance.${grv_id}.settlement_agreed_cents == 70000"
            - "after payment: Grievance.${grv_id}.settlement_paid_cents == 70000 and status == CLOSED"

  # ===================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: budget_revision_tier_upgrade_cascade
        grounds:
          - state_machines.Production.ANY_NON_TERMINAL_to_SAME
          - state_machines.Bond.POSTED_to_UNDERFUNDED
          - calculations.budget_tier_selection
          - calculations.posture_derivation
          - concurrency_rules[budget-revision-stale-production]
        distinguishing_aspect: |
          Depth-3 cascade triggered by a budget revision: budget_cents 20000000 ->
          40000000 upgrades agreement_tier ULTRA_LOW_BUDGET -> MODIFIED_LOW_BUDGET
          (link 1); the tier change recomputes Bond.amount_required_cents to 5000000
          and flips Bond POSTED -> UNDERFUNDED because only 2500000 is held (link 2);
          the bond flip itself recomputes Production.compliance_posture to RESTRICTED
          (link 3). Each link is caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production (budget 20000000) in STAFFING with bond POSTED at exactly 2500000; no crew, no grievances, posture CLEAR"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Juniper Films LLC", fein: "66-5555555" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Juniper Pass", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "GET /union-compliance/productions/${prod_id}", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v: $.data.version } }
          trigger:
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 40000000, expected_production_version: "${prod_v}" }, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "Production.${prod_id}.budget_cents == 40000000"
            - "Production.${prod_id}.agreement_tier == MODIFIED_LOW_BUDGET"
            - "Bond.${bond_id}.amount_required_cents == 5000000"
            - "Bond.${bond_id}.status == UNDERFUNDED"
            - "Production.${prod_id}.compliance_posture == RESTRICTED"

      - name: audit_close_bond_forfeit_company_cascade
        grounds:
          - state_machines.Audit.FINDINGS_ISSUED_to_CLOSED
          - state_machines.Bond.UNDERFUNDED_to_FORFEITED
          - state_machines.ProducerCompany.SIGNATORY_to_SUSPENDED
          - calculations.audit_assessment
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (audit close, not budget revision):
          closing an audit with assessment 1100 unpaid forfeits the production's bond
          (link 1: Bond UNDERFUNDED -> FORFEITED, held 2500000 -> total_forfeited); the
          bond forfeiture itself suspends the producer company (link 2: ProducerCompany
          SIGNATORY -> SUSPENDED) and recomputes the production posture.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production IN_PRODUCTION; CAMERA @100000 ACTIVE with L1 (2026-08-10) SUBMITTED; report period 1 [L1] ACCEPTED at ULB final 17000"
            - "budget then revised to 40000000 (tier MODIFIED_LOW_BUDGET; bond UNDERFUNDED; posture RESTRICTED); audit of period 1 issued findings: expected 0.18*100000 = 18000 vs reported 17000 -> assessment 1100 unpaid"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Kestrel Media LLC", fein: "77-6666666" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "TELEVISION", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Kestrel Run", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs/${l1_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 1, work_day_log_ids: [ "${l1_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep_id: $.data.id } }
            - { call: "POST /union-compliance/contribution-reports/${rep_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/contribution-reports/${rep_id}/review", payload: { decision: "ACCEPT" }, as: FundTrustee }
            - { call: "GET /union-compliance/productions/${prod_id}", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v: $.data.version } }
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 40000000, expected_production_version: "${prod_v}" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/audits", payload: { production_id: "${prod_id}", scope_period_indices: [ 1 ] }, as: FundTrustee, as_user_id: "ft_1", captures: { audit_id: $.data.id } }
            - { call: "POST /union-compliance/audits/${audit_id}/issue-findings", payload: {}, as: FundTrustee, as_user_id: "ft_1" }
          trigger:
            - { call: "POST /union-compliance/audits/${audit_id}/close", payload: {}, as: FundTrustee, as_user_id: "ft_2" }
          assert:
            - "Audit.${audit_id}.assessment_cents == 1100"
            - "Audit.${audit_id}.status == CLOSED"
            - "Bond.${bond_id}.status == FORFEITED"
            - "Bond.${bond_id}.total_forfeited_cents == 2500000"
            - "Bond.${bond_id}.amount_held_cents == 0"
            - "ProducerCompany.${co_id}.status == SUSPENDED"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_production_state_error_beats_staffing_safety
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_PRODUCTION_STATE]
          - errors[ERR_MIN_STAFF_UNMET]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a start-production call on a
          REGISTERED production (bond never posted) with ZERO crew violates both
          priority 7 (state: not STAFFING) and priority 19 (safety: staffing minimums
          unmet) — the higher-priority state error ERR_PRODUCTION_STATE must win.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production REGISTERED with bond still PENDING; no crew hired"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Larch Films LLC", fein: "88-7777777" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Larch Hollow", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PRODUCTION_STATE"
            - "Production.${prod_id}.status == REGISTERED"

      - name: grievance_filing_temporal_beats_cross_production_referential
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - errors[ERR_FILING_WINDOW_EXPIRED]
          - errors[ERR_CROSS_PRODUCTION_REFERENCE]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_referential (a different
          pair from instance 1): a grievance filed against production B referencing a
          crew assignment of production A (referential violation) with an incident_date
          41 days before the default clock (temporal violation) must return
          ERR_FILING_WINDOW_EXPIRED (priority 20), not ERR_CROSS_PRODUCTION_REFERENCE
          (priority 21).
        test_recipe:
          setup:
            - "SIGNATORY company; production A (ULB, STAFFING) with crew assignment CA1; production B (ULB, STAFFING); default clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Maple Gate LLC", fein: "99-8888888" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 40000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Maple A", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_a: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_a}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_a: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_a}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_a}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { ca1_id: $.data.id } }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Maple B", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_b: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_b}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_b: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_b}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_b}", crew_assignment_id: "${ca1_id}", category: "WORK_RULE", incident_date: "2026-06-21", description: "Cross-production reference with expired window" }, as: UnionRep, as_user_id: "ur_1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FILING_WINDOW_EXPIRED"
            - "no Grievance exists for Production.${prod_b} (GET /union-compliance/productions/${prod_b}/grievances returns an empty list)"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: budget_revision_tier_cap_inclusive_boundary
        grounds:
          - calculations.budget_tier_selection
          - validations[priority=31]
          - errors[ERR_TIER_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric: money threshold on POST budget-revisions — the ULB cap 30000000 is
          INCLUSIVE: a revision to exactly 30000000 keeps the tier ULTRA_LOW_BUDGET
          (bond stays POSTED), while 30000100 (one cent over, padded to a non-round
          figure) upgrades to MODIFIED_LOW_BUDGET and flips the bond UNDERFUNDED.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production (budget 20000000) STAFFING, bond POSTED 2500000, posture CLEAR"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Noble Birch LLC", fein: "11-9999999" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Birch Line", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "GET /union-compliance/productions/${prod_id}", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v: $.data.version } }
          trigger:
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 30000000, expected_production_version: "${prod_v}" }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_v2: $.data.version } }
            - { call: "POST /union-compliance/productions/${prod_id}/budget-revisions", payload: { new_budget_cents: 30000100, expected_production_version: "${prod_v2}" }, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "after first revision: Production.${prod_id}.agreement_tier == ULTRA_LOW_BUDGET and Bond.${bond_id}.status == POSTED"
            - "after second revision: Production.${prod_id}.agreement_tier == MODIFIED_LOW_BUDGET and Bond.${bond_id}.status == UNDERFUNDED and Bond.${bond_id}.amount_required_cents == 5000000"

      - name: contribution_report_empty_log_set_rejected
        grounds:
          - validations[priority=29]
          - errors[ERR_EMPTY_REPORT]
          - entities.ContributionReport.fields.work_day_log_ids
        distinguishing_aspect: |
          Metric: empty-collection boundary (zero-count edge) on a DIFFERENT endpoint
          (POST contribution-reports, not budget-revisions): an empty work_day_log_ids
          set is rejected with ERR_EMPTY_REPORT, while a one-element set succeeds.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production IN_PRODUCTION with staffing met; no logs needed for the failing call"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Orchid Peak LLC", fein: "12-0000001" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "NEW_MEDIA", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
