        distinguishing_aspect: |
          Charter's DRAFT -> SCHEDULED transition depends on the Boat entity's state:
          with boat status DRYDOCK the schedule is rejected ERR_BOAT_NOT_IN_SERVICE —
          the Charter->Boat pair, distinct from the Charter->Marina pair below.
        test_recipe:
          setup:
            - "DRAFT charter fully crewed and slotted, but its boat set to DRYDOCK."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Boat Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "I1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Dryboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap I", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Boat Cust", email: "boat@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-01-10T12:00:00Z", return_at: "2027-01-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "POST /boats/${boat_id}/set-status"
              payload: { status: "DRYDOCK" }
              as: FleetManager
          trigger:
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_BOAT_NOT_IN_SERVICE"

      - name: charter_schedule_requires_marina_open
        grounds:
          - state_machines.Charter.transitions.DRAFT_to_SCHEDULED
          - entities.Marina.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Charter's DRAFT -> SCHEDULED transition depends on the Marina entity's state:
          with marina status CLOSED the schedule is rejected ERR_MARINA_NOT_OPEN — the
          Charter->Marina pair, a different entity pair than Charter->Boat.
        test_recipe:
          setup:
            - "DRAFT charter fully crewed and slotted, but its marina set to CLOSED."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Closed Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "J1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Openboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap J", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Closed Cust", email: "closed@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-01-10T12:00:00Z", return_at: "2027-01-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "POST /marinas/${marina_id}/set-status"
              payload: { status: "CLOSED" }
              as: DockMaster
          trigger:
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_MARINA_NOT_OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_window_overlap_with_turnaround_buffer
        grounds:
          - validations[priority=8]
          - calculations.open_slot_count
          - entities.Marina.fields.turnaround_buffer_minutes
          - entities.SlotReservation.fields.window_start
        distinguishing_aspect: |
          On DockSlot, a second reservation starting 15 min after the first window ends is
          rejected ERR_SLOT_WINDOW_CONFLICT because the marina turnaround_buffer (30 min)
          extends the prior occupation — closed-adjacency-plus-buffer interval semantics.
        test_recipe:
          setup:
            - "Marina with turnaround_buffer 30 min, one slot; charter A reserves [12:00,16:00); charter B tries to reserve a window starting 16:15 (inside the 30-min buffer)."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Buf Marina", slot_count: 1, turnaround_buffer_minutes: 30 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "K1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Bufboat A", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_a_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Bufboat B", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_b_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_a_id}", trip_type: "INSHORE", depart_at: "2027-02-10T12:00:00Z", return_at: "2027-02-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { chA_id: $.data.id, chA_v: $.data.version }
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${chA_id}", expected_charter_version: "${chA_v}" }
              as: DockMaster
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_b_id}", trip_type: "INSHORE", depart_at: "2027-02-10T16:15:00Z", return_at: "2027-02-10T20:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { chB_id: $.data.id, chB_v: $.data.version }
          trigger:
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${chB_id}", expected_charter_version: "${chB_v}" }
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SLOT_WINDOW_CONFLICT"

      - name: captain_double_booked_half_open_no_buffer
        grounds:
          - validations[priority=9]
          - state_machines.CrewAssignment.transitions.TENTATIVE_to_LOCKED
          - entities.Charter.fields.depart_at
        distinguishing_aspect: |
          On the Captain resource, a captain already assigned to charter A [12:00,16:00) is
          rejected ERR_CAPTAIN_DOUBLE_BOOKED when assigned to charter B [15:00,18:00) which
          strictly overlaps — pure half-open overlap with NO buffer, different interval
          semantics and a different resource than the slot rule.
        test_recipe:
          setup:
            - "Two charters at the same marina with overlapping intervals; captain assigned to A, then assigned to B."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Dbl Marina", slot_count: 4 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Dblboat A", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_a_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Dblboat B", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_b_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap Dbl", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_a_id}", trip_type: "INSHORE", depart_at: "2027-03-10T12:00:00Z", return_at: "2027-03-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { chA_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_b_id}", trip_type: "INSHORE", depart_at: "2027-03-10T15:00:00Z", return_at: "2027-03-10T18:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { chB_id: $.data.id }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${chA_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
          trigger:
            - call: "POST /crew-assignments"
              payload: { charter_id: "${chB_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CAPTAIN_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seats_booked_conserved_on_book_then_cancel
        grounds:
          - entities.Charter.fields.seats_booked
          - state_machines.Booking.transitions.RESERVED_CONFIRMED_to_CANCELLED
          - calculations.seat_subtotal_cents
        distinguishing_aspect: |
          Conserved quantity = Charter.seats_booked. Booking create (+party_size 2) paired
          with its cancel (-party_size 2) leaves seats_booked exactly at its pre-create
          value 0 (invariant: seats_booked == sum of party_size over {RESERVED,CONFIRMED}
          bookings), with zero drift.
        test_recipe:
          setup:
            - "Charter DRAFT with seats_total 6 and seats_booked 0; one booking created (party 2) then cancelled."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "Seat Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Seatboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Seat Cust", email: "seat@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-04-10T12:00:00Z", return_at: "2027-04-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { final_seats: $.data.seats_booked }
          assert:
            - "Charter.${ch_id}.seats_booked == 0"
            - "Booking.${bk_id}.status == CANCELLED"

      - name: slot_occupancy_conserved_on_schedule_then_cancel
        grounds:
          - calculations.open_slot_count
          - state_machines.Charter.transitions.DRAFT_SCHEDULED_WEATHER_HOLD_to_CANCELLED
          - state_machines.SlotReservation.transitions.HELD_OCCUPIED_to_RELEASED
        distinguishing_aspect: |
          A different conserved quantity = Marina.open_slot_count (slot capacity). Schedule
          occupies the slot (slot_count 2 -> open 1 during the window) and charter cancel
          releases it, restoring open_slot_count to 2 — slot capacity conserved, no leak.
        test_recipe:
          setup:
            - "Marina slot_count 2; clock inside the charter window; charter SCHEDULED (slot OCCUPIED) then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-10T13:00:00Z" }
              as: FleetManager
            - call: "POST /marinas"
              payload: { name: "Occ Marina", slot_count: 2 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /dock-slots"
              payload: { marina_id: "${marina_id}", slot_label: "L1", max_boat_length_ft: 40 }
              as: DockMaster
              captures: { slot_id: $.data.id }
            - call: "POST /boats"
              payload: { marina_id: "${marina_id}", name: "Occboat", length_ft: 30, passenger_capacity: 6 }
              as: FleetManager
              captures: { boat_id: $.data.id }
            - call: "POST /captains"
              payload: { marina_id: "${marina_id}", full_name: "Cap Occ", uscg_license_grade: "MASTER_50", license_expires_on: "2030-01-01T00:00:00Z" }
              as: FleetManager
              captures: { cap_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Occ Cust", email: "occ@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /charters"
              payload: { marina_id: "${marina_id}", boat_id: "${boat_id}", trip_type: "INSHORE", depart_at: "2027-05-10T12:00:00Z", return_at: "2027-05-10T16:00:00Z", base_seat_price_cents: 10000, seats_total: 6 }
              as: FleetManager
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crew-assignments"
              payload: { charter_id: "${ch_id}", role_slot: "CAPTAIN", captain_id: "${cap_id}" }
              as: FleetManager
            - call: "POST /slot-reservations"
              payload: { dock_slot_id: "${slot_id}", charter_id: "${ch_id}", expected_charter_version: "${ch_v}" }
              as: DockMaster
            - call: "GET /charters/${ch_id}"
              as: FleetManager
              captures: { ch_v2: $.data.version }
            - call: "POST /bookings"
              payload: { charter_id: "${ch_id}", customer_id: "${cust_id}", party_size: 2, expected_charter_version: "${ch_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/pay-deposit"
              payload: { amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charters/${ch_id}/schedule"
              as: FleetManager
          trigger:
            - call: "POST /charters/${ch_id}/cancel"
              as: FleetManager
            - call: "GET /marinas/${marina_id}"
              as: DockMaster
              captures: { final_open: $.data.open_slot_count }
          assert:
            - "Marina.${marina_id}.open_slot_count == 2"
            - "Charter.${ch_id}.status == CANCELLED"
