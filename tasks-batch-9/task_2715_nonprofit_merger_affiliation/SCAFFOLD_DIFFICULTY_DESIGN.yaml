  - rule_id: compensating_invariant
    instances:
      - name: transfer_then_unwind_conserves_the_pair_restricted_corpus
        grounds:
          - calculations.organization_restricted_corpus.variants.pair_conservation_invariant
          - state_machines.RestrictedFund.TRANSFERRED_to_CONSENT_GRANTED
          - state_machines.IntegrationTask.PLANNED_to_HELD
          - endpoints.GET_/restructurings/{id}/dossier
        distinguishing_aspect: |
          pair_restricted_corpus_cents, the sum of restricted_corpus_cents over both
          parties, is a conserved quantity: a transfer only moves value from the
          retained side of one organization to the recipient side of the other, and an
          unwind must restore every side effect exactly. The invariant is read at three
          points - before the transfer, after the transfer and after the unwind - and
          must be byte-identical at all three, while transferable_amount_cents stays at
          62000000 so a re-transfer would release the same amount, unwind_count reaches
          1, the posture returns to RESTRICTED_PENDING and the PROGRAM_CONTINUITY task
          goes back to HELD. Any implementation that recomputes the corpus from scratch
          on transfer but patches it incrementally on unwind drifts here.
        test_recipe:
          setup:
            - "A Restructuring in status STRUCTURE_SELECTED with structure_type MERGER"
