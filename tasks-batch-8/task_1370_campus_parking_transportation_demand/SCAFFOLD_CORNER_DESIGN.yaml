              as: ParkingAdmin
              captures: { alloc_c: $.data.id }
            - call: "GET /parking/allocations/${alloc_c}"
              as: ParkingAdmin
              captures: { v_c: $.data.version }
          trigger:
            - call: "POST /parking/permits"
              payload: { patron_id: "${a_id}", allocation_id: "${alloc_c}", plate_number: "A111", expected_allocation_version: "${v_c}" }
              as: ParkingAdmin
              captures: { fee_total: $.data.fee_total_cents, status: $.data.status }
            - call: "GET /parking/allocations/${alloc_c}"
              as: ParkingAdmin
              captures: { cnt: $.data.allocated_count }
          assert:
            - "captured fee_total == 84000 and status == ACTIVE in the write response itself"
            - "captured cnt == 1 on the immediately following read"
