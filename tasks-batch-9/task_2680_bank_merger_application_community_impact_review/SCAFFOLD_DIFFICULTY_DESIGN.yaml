  - rule_id: transitive_cascade
    instances:
      - name: branch_divestiture_designation_cascades_to_condition_satisfaction
        depth: 4
        grounds:
          - endpoints[POST /branches/{id}/designate].side_effects
          - calculations.required_divestiture
          - calculations.competitive_posture_rollup
          - state_machines.ApprovalCondition.OPEN_to_SATISFIED
        distinguishing_aspect: |
          One designation call produces a four-link chain in which each link is only possible because the
          previous one happened: (1) Branch Harbor Kestrel West moves OPEN -> DESIGNATED_FOR_DIVESTITURE;
          (2) because that branch is now designated under this application, the CompetitiveAnalysis
          recomputes designated_divestiture_deposits_usd 40,000,000, hhi_post_mitigated 5592 and
          mitigation_satisfied true; (3) because the analysis now satisfies its mitigation, the
          application's competitive_posture rolls up MITIGATION_REQUIRED -> CLEARED_WITH_DIVESTITURE;
          (4) because the posture now clears, the OPEN DIVESTITURE ApprovalCondition flips to SATISFIED
          with satisfied_by_user_id "system". No link is a sibling fan-out of the trigger; link 4 reads
          only the value produced by link 3.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the Kestrel MSA world: base 1,000,000,000 across Northbay 200,000,000, Harbor 60,000,000 + 40,000,000 and Lakeside 700,000,000"
            - "an application with a CompetitiveAnalysis of that market: MITIGATION_REQUIRED, required_divestiture_deposits_usd 39,000,000, nothing designated yet"
            - "the application submitted, accepted, its comment period closed, and the clock advanced to 2026-09-15 so a recommendation is permitted"
