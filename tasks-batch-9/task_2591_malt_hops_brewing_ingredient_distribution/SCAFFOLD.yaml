  # ---- YeastStrain / YeastPropagationJob ----------------------------------
  - method: POST
    path: "/yeast-strains"
    description: "Register a yeast strain with its fermentation type, propagation lead time, shipping viability, slurry density and vessel limits."
    roles: [WarehouseOperator, PlatformAdmin]
    code: 201
    input: [strain_code, name, fermentation_type, propagation_lead_time_days, list_price_cents_per_l, "viability_pct_at_ship?", "cells_per_ml_slurry_billion?", "min_batch_l?", "vessel_max_l?"]
    output: YeastStrain
    side_effects: []

  - method: GET
    path: "/yeast-strains/{id}"
    description: "Fetch a yeast strain with its propagation and viability parameters."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: []
    output: YeastStrain
    side_effects: []

  - method: POST
    path: "/yeast-propagation-jobs"
    description: "Request a yeast propagation for a recipe's batch on a given pitch date. Computes the pitch-rate advisory and the propagation volume, and enforces both the lead time and the strain's vessel turnover gap."
    roles: [Brewer, WarehouseOperator]
    code: 201
    input: [brewer_id, recipe_id, yeast_strain_id, pitch_date]
    output: YeastPropagationJob
    side_effects:
      - "sets status REQUESTED with ready_at and failure_reason null"
      - "runs calculations.yeast_pitch_advisory, writing recommended_pitch_rate_million_cells_per_ml_per_plato, required_cells_billion, recommended_slurry_l, propagation_volume_l and pitch_rate_advice"

  - method: GET
    path: "/yeast-propagation-jobs/{id}"
    description: "Fetch a propagation job with its pitch-rate advisory, propagation volume and readiness."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: []
    output: YeastPropagationJob
    side_effects: []

  - method: GET
    path: "/yeast-propagation-jobs"
    description: "List propagation jobs filtered by brewer, recipe, strain, the job they replace, or status. The replaces_job_id filter is the only way to discover a replacement job minted by a cold-chain excursion."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: ["brewer_id?", "recipe_id?", "yeast_strain_id?", "replaces_job_id?", "status?", "limit?", "offset?"]
    output: YeastPropagationJob[]
    side_effects: []

  - method: POST
    path: "/yeast-propagation-jobs/{id}/start"
    description: "Begin propagation, stamping the readiness date from the strain's lead time."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: YeastPropagationJob
    side_effects:
      - "transitions REQUESTED -> PROPAGATING and sets ready_at = current logical clock + strain.propagation_lead_time_days days"
      - "increments YeastPropagationJob.version by 1"

  - method: POST
    path: "/yeast-propagation-jobs/{id}/complete"
    description: "Close a propagation as READY or FAILED."
    roles: [WarehouseOperator]
    code: 200
    input: [outcome, "failure_reason?"]
    output: YeastPropagationJob
    side_effects:
      - "on READY: transitions PROPAGATING -> READY and clears failure_reason"
      - "on FAILED: transitions PROPAGATING -> FAILED and records failure_reason"
      - "increments YeastPropagationJob.version by 1"

  - method: POST
    path: "/yeast-propagation-jobs/{id}/requeue"
    description: "Re-book a failed propagation onto a new pitch date, re-checking the lead time and the strain's vessel turnover gap."
    roles: [WarehouseOperator]
    code: 200
    input: [new_pitch_date]
    output: YeastPropagationJob
    side_effects:
      - "transitions FAILED -> REQUESTED, sets pitch_date = new_pitch_date and clears failure_reason and ready_at"
      - "re-runs calculations.yeast_pitch_advisory against the new pitch date, which can change propagation_volume_l through viability decay"
      - "increments YeastPropagationJob.version by 1"

  # ---- SalesOrder ---------------------------------------------------------
  - method: POST
    path: "/sales-orders"
    description: "Open a draft sales order for a brewer with the requested ship date. Fees are not assessed until confirmation."
    roles: [Brewer, AllocationManager]
    code: 201
    input: [brewer_id, requested_ship_date, "purchase_order_ref?"]
    output: SalesOrder
    side_effects:
      - "sets fulfillment_status DRAFT, credit_status PENDING_REVIEW, fee_variant null, line_count 0, requires_cold_chain false and every money field 0"

  - method: GET
    path: "/sales-orders/{id}"
    description: "Fetch a sales order with its priced fee breakdown, both status dimensions and the freight tier that was applied."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []

  - method: GET
    path: "/sales-orders"
    description: "List sales orders filtered by brewer or by either status dimension independently, ordered by created_at ASC."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: ["brewer_id?", "fulfillment_status?", "credit_status?", "limit?", "offset?"]
    output: SalesOrder[]
    side_effects: []

  - method: POST
    path: "/sales-orders/{id}/lines"
    description: "Add a hop, malt or yeast line to a draft order. Hop lines draw either on a crop-year contract or on spot inventory. Enforces the item minimum and flags a pallet break."
    roles: [Brewer, AllocationManager]
    code: 201
    input: [item_type, quantity, uom, "allocation_source?", "hop_variety_id?", "hop_contract_id?", "malt_lot_id?", "yeast_propagation_job_id?", "unit_price_cents?"]
    output: OrderLine
    side_effects:
      - "defaults unit_price_cents from the contract price, the variety spot price, the malt product list price or the yeast strain list price when omitted"
      - "sets cold_chain_required from HopVariety.cold_storage_required for HOP lines, MaltProduct.cold_storage_required for MALT lines and YeastStrain.cold_storage_required for YEAST lines"
      - "runs calculations.order_subtotal_rollup, writing OrderLine.extended_cents and pallet_break plus the order's subtotal_cents, chargeable_lbs, line_count and requires_cold_chain"
      - "increments SalesOrder.version by 1"

  - method: DELETE
    path: "/sales-orders/{id}/lines/{line_id}"
    description: "Remove a line from a draft order and reprice the order."
    roles: [Brewer, AllocationManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "moves the OrderLine to REMOVED"
      - "re-runs calculations.order_subtotal_rollup, rewriting subtotal_cents, chargeable_lbs, line_count and requires_cold_chain"
      - "increments SalesOrder.version by 1"

  - method: POST
    path: "/sales-orders/{id}/confirm"
    description: "Confirm the order: commit contract, malt and spot volume, price the PROVISIONAL fee assessment against the brewer's pre-order freight tier, and re-test the credit limit."
    roles: [Brewer]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "transitions fulfillment_status DRAFT -> CONFIRMED"
      - "commits contract poundage into HopContract.committed_lbs and re-runs calculations.contract_allocation_ledger, leaving allocated_lbs unchanged"
      - "commits malt into MaltLot.committed_lbs via calculations.malt_lot_availability and draws SPOT hop lines from HopVariety.available_spot_lbs"
      - "runs calculations.order_subtotal_rollup then calculations.order_fee_assessment variant PROVISIONAL, writing volume_discount_cents, freight_cents, freight_tier_applied, pallet_break_fee_cents, small_order_surcharge_cents, total_cents and fee_variant PROVISIONAL"
      - "the Brewer re-runs calculations.brewer_credit_posture, raising open_order_exposure_cents by this order's total_cents"
      - "increments SalesOrder.version by 1"

  - method: POST
    path: "/sales-orders/{id}/credit-decision"
    description: "Approve or hold the order on the credit dimension, independently of fulfillment. A hold freezes any staged reefer load."
    roles: [CreditManager]
    code: 200
    input: [decision, "decision_note?"]
    output: SalesOrder
    side_effects:
      - "on APPROVE: transitions credit_status PENDING_REVIEW or ON_HOLD -> APPROVED"
      - "on HOLD: transitions credit_status PENDING_REVIEW or APPROVED -> ON_HOLD and moves the order's STAGED ColdChainShipments to HELD, releasing zone pallets"
      - "increments SalesOrder.version by 1"

  - method: POST
    path: "/sales-orders/{id}/pick"
    description: "Pick the order from the warehouse. Requires released malt, ready yeast and an approved credit decision."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "transitions fulfillment_status CONFIRMED -> PICKED"
      - "increments SalesOrder.version by 1"

  - method: POST
    path: "/sales-orders/{id}/ship"
    description: "Ship and invoice the order, moving its total into accounts receivable and marking its yeast as shipped."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "transitions fulfillment_status PICKED -> SHIPPED and sets invoiced_at to the current logical clock"
      - "adds total_cents to Brewer.ar_balance_cents through calculations.brewer_ar_ledger"
      - "transitions every READY YeastPropagationJob on a YEAST line to SHIPPED"
      - "the Brewer re-runs calculations.brewer_credit_posture; the order leaves open_order_exposure_cents as it enters ar_balance_cents, so credit_exposure_cents does not move"
      - "increments SalesOrder.version by 1"

  - method: POST
    path: "/sales-orders/{id}/deliver"
    description: "Record delivery. Re-prices freight under the FINAL variant with this order's own volume now counted in the trailing-12-month window, books the difference, and re-rates the brewer's freight program."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "transitions fulfillment_status SHIPPED -> DELIVERED and sets delivered_at to the current logical clock"
      - "transitions the order's ColdChainShipment IN_TRANSIT -> DELIVERED when one exists"
      - "re-runs calculations.order_fee_assessment variant FINAL, rewriting freight_cents, freight_tier_applied and total_cents, setting fee_variant FINAL and storing final_freight_adjustment_cents"
      - "adds final_freight_adjustment_cents to Brewer.ar_balance_cents through calculations.brewer_ar_ledger"
      - "the Brewer re-runs calculations.freight_program_tier and calculations.brewer_credit_posture"
      - "increments SalesOrder.version by 1"

  - method: POST
    path: "/sales-orders/{id}/cancel"
    description: "Cancel the order. Releases every committed pound back to its contract, lot or variety, credits any invoice already booked, and supersedes any staged or held reefer load."
    roles: [Brewer, AllocationManager]
    code: 200
    input: [cancel_reason]
    output: SalesOrder
    side_effects:
      - "transitions fulfillment_status DRAFT, CONFIRMED, PICKED or SHIPPED -> CANCELLED and moves every OPEN or TRIMMED line to REMOVED"
      - "releases contract poundage from HopContract.committed_lbs back into remaining_lbs, malt from MaltLot.committed_lbs and spot hops back into HopVariety.available_spot_lbs, so calculations.contract_allocation_ledger conservation holds"
      - "when invoiced_at is not null: posts a credit memo for total_cents plus any final_freight_adjustment_cents already booked through calculations.brewer_ar_ledger"
      - "moves the order's STAGED or HELD ColdChainShipments to SUPERSEDED, releasing zone pallets"
      - "the Brewer re-runs calculations.brewer_credit_posture"
      - "increments SalesOrder.version by 1"

  # ---- OrderLine ----------------------------------------------------------
  - method: GET
    path: "/order-lines/{id}"
    description: "Fetch an order line with its extended value, pallet-break flag and any shortfall trim."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: []
    output: OrderLine
