            - call: "POST /stormwater/post-construction-facilities"
              payload: { construction_site_id: "${site_a_id}", facility_type: "WET_POND", ownership: "PRIVATE", design_capacity_cf: 6000, service_area_acres: 2.50 }
              as: ConstructionInspector
              captures: { fac_a_id: $.data.id }
            - call: "POST /stormwater/annual-reports"
