              as: ITOperator
              as_user_id: "${op1_id}"
            - call: "POST /exercises"
              payload: { name: "Axis independence rehearsal", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T06:00:00Z" }
