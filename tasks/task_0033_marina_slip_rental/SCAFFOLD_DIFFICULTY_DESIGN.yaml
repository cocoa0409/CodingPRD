              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tx_id}", vessel_id: "${vx_id}", start_date: "2026-09-05", end_date: "2026-09-15", is_liveaboard: true, expected_slip_version: "${slip_v0}" }
