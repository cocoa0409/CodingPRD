      - name: error_berth_conflict_overlap
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BERTH_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / berth_window_half_open_overlap_adjacency_ok
          rationale: "ERR_BERTH_CONFLICT on an overlapping window is the asserted failure path of the named §1.8 instance."

      - name: error_gate_slot_conflict
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_GATE_SLOT_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / gate_slot_buffered_overlap_adjacency_conflicts
          rationale: "ERR_GATE_SLOT_CONFLICT is the asserted failure path of the named §1.8 instance."

      # ERR_STALE_VERSION (412) is actively triggered by the two cross_cutting_complexity_layers
      # OCC instances below (berth_berth_stale_version_conflict, customs_clear_stale_version_conflict),
