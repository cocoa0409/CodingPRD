          - errors[ERR_TECH_CERT_INSUFFICIENT]
          - state_machines.RouteDay.status.LOCKED_to_DISPATCHED
          - state_machines.Appointment.fulfillment_status.PENDING_to_EN_ROUTE
        distinguishing_aspect: "MUTATE-THEN-REJECT: dispatch flips appointments in created_at ASC order and stops at the first one whose service_type outruns the technician's downgraded certification; the earlier flip stands and the route day remains LOCKED."
        test_recipe:
          setup:
            - "The clock sits at 2026-05-03T14:00:00Z."
            - "One client with two ZONE_A addresses and two assessed UPRIGHT instruments."
            - "A JOURNEYMAN technician holds a 2026-05-04 route day carrying a TUNE stop at 09:00 (created first) and a REGULATE stop at 10:25 (created second)."
            - "The technician has since been downgraded to APPRENTICE and the route day locked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "Partial Dispatch", email: "pd@example.com", phone: "555-0352", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Site A", zone_code: "ZONE_A", address_key: "pd-site-a", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_a: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Site B", zone_code: "ZONE_A", address_key: "pd-site-b", distance_miles_from_shop: 4.0 }
              as: ShopManager
              captures: { loc_b: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_a}", make: "Yamaha", model: "U1", serial_number: "SN-C52-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_a: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_b}", make: "Yamaha", model: "U3", serial_number: "SN-C52-0002", instrument_class: "UPRIGHT", usage_tier: "STUDIO" }
              as: ShopManager
              captures: { inst_b: "$.data.id" }
            - call: "POST /instruments/${inst_a}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_b}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_b}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "assessed" }
              as: ShopManager
            - call: "POST /technicians"
              payload: { display_name: "Tech D52", certification_level: "JOURNEYMAN", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04" }
              as: ShopManager
              captures: { rd_id: "$.data.id", rd_v0: "$.data.version" }
            - call: "POST /appointments"
              payload: { instrument_id: "${inst_a}", route_day_id: "${rd_id}", location_id: "${loc_a}", scheduled_start_utc: "2026-05-04T09:00:00Z", service_type: "TUNE", expected_route_day_version: "${rd_v0}" }
              as: ShopManager
              captures: { ap_tune: "$.data.id" }
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: ShopManager
              captures: { rd_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { instrument_id: "${inst_b}", route_day_id: "${rd_id}", location_id: "${loc_b}", scheduled_start_utc: "2026-05-04T10:25:00Z", service_type: "REGULATE", expected_route_day_version: "${rd_v1}" }
              as: ShopManager
              captures: { ap_reg: "$.data.id" }
            - call: "PATCH /technicians/${tech_id}"
              payload: { certification_level: "APPRENTICE" }
              as: PlatformAdmin
            - call: "POST /route-days/${rd_id}/status-transitions"
              payload: { to_status: "LOCKED" }
              as: ShopManager
          trigger:
            - call: "POST /route-days/${rd_id}/status-transitions"
              payload: { to_status: "DISPATCHED" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with error_id ERR_TECH_CERT_INSUFFICIENT"
            - "Appointment.${ap_tune}.fulfillment_status == EN_ROUTE - the earlier flip is NOT rolled back"
            - "Appointment.${ap_reg}.fulfillment_status == PENDING"
            - "RouteDay.${rd_id}.status == LOCKED"
            - "RouteDay.${rd_id}.committed_minutes == 350 (85 for the TUNE stop plus 265 for the REGULATE stop)"

  # =======================================================================
  # ERRORS - remaining catalogue coverage
  # =======================================================================
  - section: errors
    instances:

      - name: location_create_with_unknown_client_returns_client_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLIENT_NOT_FOUND]
          - validations[priority=9]
        distinguishing_aspect: "A body FK that does not resolve returns 404 ERR_CLIENT_NOT_FOUND, not ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /locations"
              payload: { client_id: "00000000-0000-4000-8000-000000000001", label: "Ghost", zone_code: "ZONE_A", address_key: "ghost", distance_miles_from_shop: 1.0 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_CLIENT_NOT_FOUND"

      - name: instrument_create_with_unknown_location_returns_location_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LOCATION_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "Existence is checked left to right: the client resolves, so the unresolved current_location_id yields ERR_LOCATION_NOT_FOUND."
        test_recipe:
          setup: ["One client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Loc Client", email: "loc@example.com", phone: "555-0360", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
          trigger:
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "00000000-0000-4000-8000-000000000002", make: "X", model: "Y", serial_number: "SN-C60-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_LOCATION_NOT_FOUND"

      - name: service_order_create_with_unknown_quote_returns_quote_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_QUOTE_NOT_FOUND]
          - validations[priority=12]
        distinguishing_aspect: "POST /service-orders with an unresolved quote_id returns 404 ERR_QUOTE_NOT_FOUND before any state or fiscal rung runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-orders"
              payload: { quote_id: "00000000-0000-4000-8000-000000000003" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_QUOTE_NOT_FOUND"

      - name: milestones_listing_for_unknown_service_order_returns_service_order_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SERVICE_ORDER_NOT_FOUND]
          - validations[priority=13]
        distinguishing_aspect: "The sub-resource listing resolves its parent first, so an unknown service order id yields ERR_SERVICE_ORDER_NOT_FOUND rather than an empty array."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /service-orders/00000000-0000-4000-8000-000000000004/milestones"
              payload: {}
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_SERVICE_ORDER_NOT_FOUND"

      - name: route_day_transition_on_unknown_id_returns_resource_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=14]
        distinguishing_aspect: "Entities without a bespoke 404 code - Technician, RouteDay, Appointment, TuningRecall, Milestone, MoveJob, Warranty, WarrantyClaim, ConsignmentAgreement, PartsLot, PartsAllocation, LedgerEntry - all share ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /route-days/00000000-0000-4000-8000-000000000005/status-transitions"
              payload: { to_status: "LOCKED" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"

      - name: parts_lot_duplicate_lot_code_returns_duplicate_lot_code
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_LOT_CODE]
          - validations[priority=16]
        distinguishing_aspect: "lot_code is unique across all lots regardless of part_type, so reusing it with a different part_type still returns 409 ERR_DUPLICATE_LOT_CODE."
        test_recipe:
          setup: ["One HAMMER_SET lot with lot_code LOT-C65-A already exists."]
          setup_api_calls:
            - call: "POST /parts-lots"
              payload: { part_type: "HAMMER_SET", lot_code: "LOT-C65-A", initial_qty: 5 }
              as: ShopManager
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "POST /parts-lots"
              payload: { part_type: "STRING_SET", lot_code: "LOT-C65-A", initial_qty: 3 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_LOT_CODE"
            - "PartsLot.${lot_id}.on_hand_qty == 5 and initial_qty == 5"

      - name: error_stale_instrument_version_on_quote_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_INSTRUMENT_VERSION]
          - concurrency_rules[quote-create-stale-instrument]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / client_not_active_beats_stale_instrument_version
          rationale: "That instance's third trigger call asserts exactly this 412 once the state rung is satisfied."

      - name: error_attempt_limit_exceeded_on_third_milestone_rejection
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ATTEMPT_LIMIT_EXCEEDED]
          - validations[priority=55]
        excluded_because:
          difficulty_instance: non_linear_state_machine / milestone_capped_rejection_loop_on_third_attempt
          rationale: "Asserted as the failure path of the named difficulty instance."

      - name: error_appointment_overlap_on_same_route_day
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPOINTMENT_OVERLAP]
          - validations[priority=49]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / route_day_half_open_intervals_allow_touching_stops
          rationale: "Asserted as the third trigger call of the named difficulty instance."

      - name: error_move_window_conflict_on_buffered_window
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MOVE_WINDOW_CONFLICT]
          - validations[priority=51]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / move_window_buffered_closed_interval_rejects_a_sixty_minute_gap
          rationale: "Asserted as the first trigger call of the named difficulty instance."

      - name: parts_request_below_the_partial_floor_returns_parts_insufficient
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PARTS_INSUFFICIENT]
