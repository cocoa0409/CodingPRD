  - section: cross_cutting_layers
    instances:
      - name: occ_program_edit_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-edit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT /api/scholarship-programs/{id} requires expected_program_version: a writer replaying version 1 after a successful edit (which bumped the program to version 2) is rejected 412 ERR_STALE_VERSION — the deterministic two-sequential-requests OCC probe."
        test_recipe:
          setup: ["DRAFT program at version 1"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { name: "Occ Donor", contact_email: "occ@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Occ Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Occ Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id, p_v1: $.data.version }
          trigger:
            - call: "PUT /api/scholarship-programs/${p_id}"
              payload: { expected_program_version: "${p_v1}", name: "Occ Award v2", min_gpa_hundredths: 310 }
              as: ScholarshipCoordinator
              captures: { p_v2: $.data.version, p_gpa: $.data.min_gpa_hundredths }
            - call: "PUT /api/scholarship-programs/${p_id}"
              payload: { expected_program_version: "${p_v1}", name: "Occ Award STALE" }
              as: ScholarshipCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "First edit: p_v2 == ${p_v1} + 1 (== 2) and p_gpa == 310"
            - "Stale replay with the pre-edit version: err == ERR_STALE_VERSION (412); name remains 'Occ Award v2'"

      - name: occ_fund_commitment_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fund-commitment-stale-version]", "errors[ERR_STALE_VERSION]", "calculations.fund_availability"]
        distinguishing_aspect: "Commitments are additive and both valid in isolation, so OCC arbitrates: the commitment carrying the pre-commitment version fails 412 and committed_cents does not double-count."
        test_recipe:
          setup: ["fund committed 1000000 at version 1"]
          setup_api_calls:
            - call: "POST /api/award-funds"
              payload: { name: "Occ Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id, f_v1: $.data.version }
          trigger:
            - call: "POST /api/award-funds/${f_id}/commitments"
              payload: { amount_cents: 500000, expected_fund_version: "${f_v1}" }
              as: ScholarshipCoordinator
              captures: { f_committed: $.data.committed_cents, f_v2: $.data.version, f_avail: $.data.available_cents }
            - call: "POST /api/award-funds/${f_id}/commitments"
              payload: { amount_cents: 500000, expected_fund_version: "${f_v1}" }
              as: ScholarshipCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "First commitment: f_committed == 1500000, f_v2 == ${f_v1} + 1, f_avail == 1500000 (committed - 0 - 0 + 0)"
            - "Stale replay: err == ERR_STALE_VERSION (412); committed_cents remains 1500000"

