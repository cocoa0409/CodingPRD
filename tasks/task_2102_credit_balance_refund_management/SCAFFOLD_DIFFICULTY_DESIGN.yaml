  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: void_check_cascade_check_to_request_to_credit_balance_to_medicare_obligation
        grounds:
          - state_machines.CheckDisbursement.ISSUED_to_VOIDED
          - state_machines.RefundRequest.ISSUED_to_REISSUE_PENDING
          - state_machines.CreditBalance.REFUNDED_to_REFUND_PENDING
          - state_machines.MedicareRepaymentObligation.SATISFIED_to_OPEN
          - entities.AccountTransaction.fields.reversal_of_transaction_id
        distinguishing_aspect: |
          Depth-4 chain originating at POST /check-disbursements/{checkId}/void:
          voiding the check posts the REVERSAL (hop 1); that posting is what moves
          RefundRequest ISSUED -> REISSUE_PENDING (hop 2); that request move is
          what returns CreditBalance REFUNDED -> REFUND_PENDING (hop 3); and that
          credit-balance move is what reopens MedicareRepaymentObligation SATISFIED
          -> OPEN (hop 4). No hop is a direct effect of the void call itself.
        test_recipe:
          setup:
            - "A MEDICARE payer and account VC1 with a 12000-cent credit identified on 2026-08-15, root cause confirmed, attributed PROPORTIONAL to payer_portion_cents 12000, so a MedicareRepaymentObligation exists with reportable_amount_cents 12000 and due_at 2026-10-14."
            - "Refund request RR-VC1 for 12000 cents to the PAYER approved at tier 2, batched in B-VC, locked, and issued on 2026-08-20 — CheckDisbursement ISSUED, RefundRequest ISSUED, CreditBalance REFUNDED, obligation SATISFIED with satisfaction_mode REFUND_CHECK, account balance_cents 0."
            - "The logical clock is at 2026-08-25, still well inside the 60-day Medicare window."
