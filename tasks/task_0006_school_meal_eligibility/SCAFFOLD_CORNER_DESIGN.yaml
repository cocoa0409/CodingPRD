    instances:

      - name: invalid_transition_approve_from_draft
        claim_type: invalid_transition
        grounds: ["state_machines.MealApplication", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /approve on a DRAFT MealApplication (not UNDER_REVIEW) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Household H; MealApplication A in DRAFT."
          setup_api_calls:
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Inv", family_size: 4, annual_income_cents: 4000000, address_state: "CA" }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /school-meals/applications/${app_id}/approve"
              payload: { decision_reason: "shouldn't work" }
              as: DistrictReviewer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response.data.error_id == ERR_INVALID_STATE"

      - name: invalid_transition_settle_an_already_rejected_tx
        claim_type: invalid_transition
        grounds: ["state_machines.ServiceTransaction.PENDING_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /settle on a REJECTED ServiceTransaction (terminal) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Setup chain that yields one REJECTED transaction; staff then attempts to settle it."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "RejFam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "Rej kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-06-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Plain", list_price_cents: 0, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 300 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_id: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx_id}/reject"
              payload: { rejection_reason: "MANUAL" }
              as: SchoolStaff
          trigger:
            - call: "POST /school-meals/service-transactions/${tx_id}/settle"
              payload: {}
              as: SchoolStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response.data.error_id == ERR_INVALID_STATE"

      - name: invalid_transition_withdraw_from_under_review
        claim_type: invalid_transition
        grounds: ["state_machines.MealApplication", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdraw is only allowed from DRAFT or SUBMITTED; calling it from UNDER_REVIEW returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Application A in UNDER_REVIEW state."
          setup_api_calls:
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "URev", family_size: 4, annual_income_cents: 4500000, address_state: "CA" }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
            - call: "POST /school-meals/applications/${app_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
          trigger:
            - call: "POST /school-meals/applications/${app_id}/withdraw"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response.data.error_id == ERR_INVALID_STATE"

      - name: valid_transition_clock_advance_expires_eligibility
        claim_type: valid_transition
        grounds: ["state_machines.EligibilityDetermination.lifecycle_status_ACTIVE_to_EXPIRED", "endpoints.POST./school-meals/_clock/advance_and_expire"]
        distinguishing_aspect: "Advancing server clock past valid_to_utc auto-transitions ACTIVE→EXPIRED for that determination."
        test_recipe:
          setup:
            - "EligibilityDetermination D valid_to_utc=2026-06-30T00:00:00.000Z, ACTIVE."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Exp", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-06-01T00:00:00.000Z", valid_to_utc: "2026-06-30T00:00:00.000Z" }
              as: SchoolStaff
              captures: { elig_id: $.data.id }
          trigger:
            - call: "POST /school-meals/_clock/advance_and_expire"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { expired_count: $.data.expired_count }
            - call: "GET /school-meals/eligibility-determinations/${elig_id}"
              payload: {}
              as: USDAAuditor
              captures: { elig_lc_after: $.data.lifecycle_status }
          assert:
            - "EligibilityDetermination.${elig_id}.lifecycle_status == EXPIRED"

