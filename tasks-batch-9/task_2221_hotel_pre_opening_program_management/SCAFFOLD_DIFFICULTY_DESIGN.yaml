            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_p_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 60, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_p1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_p_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_p1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_p1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/programs/${prog_p_id}/open-booking"
              payload: {}
              as: CommercialDirector
            - call: "POST /pre-opening/permit-applications"
              payload: { program_id: "${prog_p_id}", gating_milestone_id: "${m_p1_id}", permit_type: "FOOD_SERVICE", review_days: 21 }
              as: LicensingCoordinator
              captures: { permit_p_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/permit-applications/${permit_p_id}/submit"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /pre-opening/programs/${prog_p_id}/suspend-booking"
              payload: { reason: "Rate strategy review" }
              as: CommercialDirector
          assert:
            - "POST /pre-opening/permit-applications/${permit_p_id}/submit response: PermitApplication.${permit_p_id}.state == \"SUBMITTED\""
            - "After the submit: PreOpeningProgram.${prog_p_id}.schedule_state == \"LICENSING\" and PreOpeningProgram.${prog_p_id}.commercial_state == \"BOOKING_OPEN\""
            - "POST /pre-opening/programs/${prog_p_id}/suspend-booking response: PreOpeningProgram.${prog_p_id}.commercial_state == \"BOOKING_SUSPENDED\""
            - "After the suspend: PreOpeningProgram.${prog_p_id}.schedule_state == \"LICENSING\" (unchanged by the commercial-dimension transition)"
            - "PreOpeningProgram.${prog_p_id}.readiness_posture == \"MOBILIZING\""

      - name: punch_item_reject_resubmit_verify_reopen_cycle
        grounds:
          - state_machines.PunchListItem.READY_FOR_VERIFICATION_to_REJECTED
          - state_machines.PunchListItem.REJECTED_to_READY_FOR_VERIFICATION
          - state_machines.PunchListItem.VERIFIED_to_OPEN
          - entities.PunchListItem.fields.rejection_count
          - entities.PunchListItem.fields.blocks_certificate_of_occupancy
        distinguishing_aspect: |
          Two nested cycles on the PunchListItem entity — a third distinct entity: the rework loop
          READY_FOR_VERIFICATION -> REJECTED -> READY_FOR_VERIFICATION (rejection_count 1) and the
          reopen loop VERIFIED -> OPEN, which returns the row to its initial state with
          verified_by_user_id and submitted_by_user_id both cleared.
        test_recipe:
          setup:
            - "Program in PLANNING with one MAJOR punch list item raised by user cm-1."
            - "The item was submitted for verification by cm-1, rejected by inspector qi-1 (rejection_count 1), and resubmitted by cm-1."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Old Mill Lodge", brand_code: "OML", room_count: 90, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_g_id: "$.data.id" }
            - call: "POST /pre-opening/punch-list-items"
              payload: { program_id: "${prog_g_id}", description: "Lobby millwork gap", severity: "MAJOR" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { punch_g_id: "$.data.id" }
            - call: "POST /pre-opening/punch-list-items/${punch_g_id}/submit-verification"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /pre-opening/punch-list-items/${punch_g_id}/verify"
              payload: { decision: "REJECT" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /pre-opening/punch-list-items/${punch_g_id}/submit-verification"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /pre-opening/punch-list-items/${punch_g_id}/verify"
              payload: { decision: "VERIFY" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /pre-opening/punch-list-items/${punch_g_id}/reopen"
              payload: { reason: "Gap reappeared after settling" }
              as: QualityInspector
              as_user_id: "qi-1"
          assert:
            - "POST /pre-opening/punch-list-items/${punch_g_id}/verify response: PunchListItem.${punch_g_id}.state == \"VERIFIED\" and verified_by_user_id == \"qi-1\" and rejection_count == 1"
            - "POST /pre-opening/punch-list-items/${punch_g_id}/reopen response: PunchListItem.${punch_g_id}.state == \"OPEN\""
            - "PunchListItem.${punch_g_id}.verified_by_user_id == null and PunchListItem.${punch_g_id}.submitted_by_user_id == null"
            - "PunchListItem.${punch_g_id}.rejection_count == 1 (the reopen loop does not reset the rework counter)"
            - "PunchListItem.${punch_g_id}.blocks_certificate_of_occupancy == false (severity MAJOR)"
            - "PreOpeningProgram.${prog_g_id}.open_critical_punch_count == 0"
            - "PreOpeningProgram.${prog_g_id}.readiness_posture == \"MOBILIZING\""

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: permit_deficiency_freezes_program_and_puts_blocks_at_risk
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_DEFICIENT
          - state_machines.Milestone.COMPLETE_to_BLOCKED
          - calculations.critical_path_schedule
          - calculations.readiness_posture
          - state_machines.PreOpeningProgram.BOOKING_OPEN_to_BOOKING_SUSPENDED
          - state_machines.ReservationBlock.ACCEPTED_to_AT_RISK
          - calculations.contingency_liability
        distinguishing_aspect: |
          Depth-5 chain triggered by POST /pre-opening/permit-applications/{id}/record-review with
          decision DEFICIENCY: permit -> DEFICIENT causes the gating milestone to absorb 21 review days
          and go BLOCKED, which causes the committed critical path to move 2026-12-09 -> 2026-12-30,
          which causes the posture to become FROZEN, which causes booking suspension and re-evaluates
          the block against the NEW date so it becomes AT_RISK with contingency 2052000 — link 5 is
          only reachable because link 3 moved the date past the block's arrival.
        test_recipe:
          setup:
            - "Program with construction_start_date 2026-09-01, target_opening_date 2027-02-01, licensing_buffer_days 14, slip_tolerance_days 10, relocation_rate_cents 25000, room_night_ceiling 500, contingency_liability_cap_cents 90000000."
            - "M1 (CONSTRUCTION_COMPLETE, 60 days) -> M2 (CO_ISSUANCE, 20 days) FINISH_START lag 0; M1 run to COMPLETE over 2026-09-01..2026-11-05, M2 still NOT_STARTED, so projected_opening_date_committed is 2026-12-09."
            - "Mandatory FOOD_SERVICE permit (review_days 21) gated on M1 and in state SUBMITTED, so schedule_state is LICENSING."
            - "Booking open with one ACCEPTED block of 19 rooms x 4 nights arriving 2026-12-20 — after 2026-12-09, so is_pre_opening is false and contingency_cents is 0."
            - "Logical clock at 2026-11-05."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Ashgrove Hotel", brand_code: "AGH", room_count: 210, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14, slip_tolerance_days: 10 }
              as: ProgramDirector
              captures: { prog_h_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_h_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 60, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_h1_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_h_id}", code: "CO_ISSUANCE", name: "Certificate of occupancy issuance", duration_days: 20, planned_start_date: "2026-11-05" }
              as: ConstructionManager
              captures: { m_h2_id: "$.data.id" }
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${m_h1_id}", successor_milestone_id: "${m_h2_id}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
            - call: "POST /pre-opening/programs/${prog_h_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_h1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_h1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/permit-applications"
              payload: { program_id: "${prog_h_id}", gating_milestone_id: "${m_h1_id}", permit_type: "FOOD_SERVICE", review_days: 21 }
              as: LicensingCoordinator
              captures: { permit_h_id: "$.data.id" }
            - call: "POST /pre-opening/permit-applications/${permit_h_id}/submit"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /pre-opening/programs/${prog_h_id}/open-booking"
              payload: {}
              as: CommercialDirector
            - call: "GET /pre-opening/programs/${prog_h_id}"
              as: CommercialDirector
              captures: { prog_h_v: "$.data.version" }
            - call: "POST /pre-opening/reservation-blocks"
              payload: { program_id: "${prog_h_id}", account_name: "Ashgrove Conference Bureau", arrival_date: "2026-12-20", night_count: 4, room_count: 19, rate_cents: 20000, expected_program_version: "${prog_h_v}" }
              as: CommercialDirector
              captures: { blk_h_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/permit-applications/${permit_h_id}/record-review"
              payload: { decision: "DEFICIENCY", deficiency_reason: "Grease interceptor undersized" }
              as: LicensingCoordinator
          assert:
            - "Link 1 — PermitApplication.${permit_h_id}.state == \"DEFICIENT\" and deficiency_reason == \"Grease interceptor undersized\""
            - "Link 2 — Milestone.${m_h1_id}.state == \"BLOCKED\" and Milestone.${m_h1_id}.blocked_days_accrued == 21"
            - "Link 3 — PreOpeningProgram.${prog_h_id}.projected_opening_date_committed == \"2026-12-30\" (was 2026-12-09)"
            - "Link 3 — PreOpeningProgram.${prog_h_id}.projected_opening_date_optimistic == \"2026-12-09\" (unchanged: OPTIMISTIC ignores blocked_days_accrued)"
            - "Link 3 — Milestone.${m_h2_id}.earliest_start_date == \"2026-11-26\" and Milestone.${m_h2_id}.earliest_finish_date == \"2026-12-16\""
            - "Link 3 — PreOpeningProgram.${prog_h_id}.schedule_slip_days == 0"
            - "Link 4 — PreOpeningProgram.${prog_h_id}.readiness_posture == \"FROZEN\""
            - "Link 5 — PreOpeningProgram.${prog_h_id}.commercial_state == \"BOOKING_SUSPENDED\""
            - "Link 5 — ReservationBlock.${blk_h_id}.state == \"AT_RISK\" and at_risk_reason == \"PERMIT_DEFICIENCY\" and is_pre_opening == true"
            - "Link 5 — ReservationBlock.${blk_h_id}.contingency_cents == 2052000 and PreOpeningProgram.${prog_h_id}.contingency_liability_cents == 2052000"
            - "PreOpeningProgram.${prog_h_id}.committed_room_nights == 76 (the cascade moves state and money, never the held room-nights)"

      - name: hire_onboarding_bubbles_plan_readiness_into_program_score
        grounds:
          - state_machines.Hire.ACCEPTED_to_ONBOARDED
          - entities.DepartmentHiringPlan.fields.onboarded_count
          - entities.DepartmentHiringPlan.fields.readiness_flag
          - entities.PreOpeningProgram.fields.departments_ready_count
          - calculations.readiness_posture
        distinguishing_aspect: |
          Depth-3 chain from a different trigger — POST /pre-opening/hires/{id}/onboard — and it
