  - section: rbac
    instances:
      - name: learner_cannot_drive_another_employees_assignment_returns_403
        claim_type: exclusive_operations
        grounds:
          - validations[priority 7]
          - errors[ERR_NOT_ASSIGNMENT_OWNER]
          - roles[Learner]
        distinguishing_aspect: "The Learner role is entity_backed, so permission is per-row: learner B is a legitimate Learner yet cannot start or submit learner A's assignment (ERR_NOT_ASSIGNMENT_OWNER, 403), while A's own start succeeds - the 403 is about identity, not about the role."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two employees A and B in the same department; A holds an ANNUAL assignment."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "own.a@corp.example", full_name: "Ann Owner", department: "HR", role_code: "IC", hire_date: "2019-01-01" }, as: ProgramAdmin, captures: { ea: "$.data.id", ea_v: "$.data.version" } }
            - { call: "POST /awareness/employees", payload: { email: "own.b@corp.example", full_name: "Ben Bystander", department: "HR", role_code: "IC", hire_date: "2019-02-02" }, as: ProgramAdmin, captures: { eb: "$.data.id" } }
            - { call: "POST /awareness/training-modules", payload: { code: "OWN-ANN", title: "Ownership Probe Module", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${ea}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${ea_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments/${a}/start", payload: {}, as: Learner, as_user_id: "${eb}" }
            - { call: "POST /awareness/curriculum-assignments/${a}/submit", payload: { score_pct: 100 }, as: Learner, as_user_id: "${eb}" }
            - { call: "POST /awareness/curriculum-assignments/${a}/start", payload: {}, as: Learner, as_user_id: "${ea}", captures: { st: "$.data.state" } }
          assert:
            - "both of B's calls return HTTP 403 with error_id ERR_NOT_ASSIGNMENT_OWNER"
            - "A's start returns HTTP 200 with state IN_PROGRESS and started_at == 2026-08-01T00:00:00Z"
            - "CurriculumAssignment.${a}.attempt_count == 0 after the rejected calls (submit never ran)"
            - "a ProgramAdmin cannot substitute for the learner: POST /start as ProgramAdmin returns 403 ERR_ROLE_NOT_PERMITTED"

      - name: manager_cannot_extend_a_non_report_assignment_returns_403
        claim_type: exclusive_operations
        grounds:
          - validations[priority 8]
          - errors[ERR_NOT_DIRECT_REPORT_MANAGER]
          - roles[Manager]
        distinguishing_aspect: "Manager authority is scoped to the direct-report edge: a manager of a different employee is refused with ERR_NOT_DIRECT_REPORT_MANAGER (403) on both extension and acknowledge, and the check reads Employee.manager_id rather than any department match."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-09T00:00:00Z after the assignment is created."
            - "Manager M1 owns report R1; manager M2 owns nobody. R1 holds a REMEDIAL assignment due 2026-08-08T00:00:00Z."
            - "One sweep at 2026-08-09T00:00:00Z creates a SENT level-1 notice addressed to M1."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "m1.scope@corp.example", full_name: "Mel One", department: "IT", role_code: "MANAGER", hire_date: "2010-01-01" }, as: ProgramAdmin, captures: { m1: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "m2.scope@corp.example", full_name: "Moe Two", department: "IT", role_code: "MANAGER", hire_date: "2010-02-02" }, as: ProgramAdmin, captures: { m2: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "r1.scope@corp.example", full_name: "Rita Report", department: "IT", role_code: "IT_ADMIN", hire_date: "2020-03-03", manager_id: "${m1}" }, as: ProgramAdmin, captures: { r1: "$.data.id", r1_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "SCOPE-REM", title: "Scope Probe Remedial", module_type: "REMEDIAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${r1}", module_id: "${m}", assignment_reason: "REMEDIAL", expected_employee_version: "${r1_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${a}", state: "SENT" }, as: ProgramAdmin, captures: { n: "$.data[0].id" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments/${a}/extension", payload: { extension_days: 5 }, as: Manager, as_user_id: "${m2}" }
            - { call: "POST /awareness/escalation-notices/${n}/acknowledge", payload: { action_plan_note: "Not my report." }, as: Manager, as_user_id: "${m2}" }
            - { call: "POST /awareness/curriculum-assignments/${a}/extension", payload: { extension_days: 5 }, as: Manager, as_user_id: "${m1}", captures: { granted: "$.data.granted_extension_days" } }
          assert:
            - "both of M2's calls return HTTP 403 with error_id ERR_NOT_DIRECT_REPORT_MANAGER"
            - "EscalationNotice.${n}.state is still SENT with action_plan_note null after M2's attempt"
            - "M1's extension returns HTTP 200 with granted_extension_days == 5 and effective_due_at == 2026-08-13T00:00:00Z"
            - "M1's extension also reset escalation_level to 0 and EXPIREd notice ${n}"

      - name: campaign_author_cannot_schedule_another_authors_campaign_returns_403
        claim_type: exclusive_operations
        grounds:
          - validations[priority 9]
          - errors[ERR_NOT_CAMPAIGN_AUTHOR]
          - roles[CampaignAuthor]
        distinguishing_aspect: "author_user_id is captured from X-User-ID at creation and enforced on submit-for-review, schedule and cancel: a second CampaignAuthor holding the same role is refused with ERR_NOT_CAMPAIGN_AUTHOR (403), so peer authors cannot touch each other's campaigns."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One APPROVED_FOR_USE template, one ACTIVE ENGINEERING employee, and a campaign authored by author-1 and already APPROVED."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "peer.target@corp.example", full_name: "Perry Target", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-06-06" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Peer Probe Template", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Peer Ownership Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-05T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-2" }
            - { call: "POST /awareness/campaigns/${c}/cancel", payload: {}, as: CampaignAuthor, as_user_id: "author-2" }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-05T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1", captures: { st: "$.data.state" } }
          assert:
            - "both of author-2's calls return HTTP 403 with error_id ERR_NOT_CAMPAIGN_AUTHOR"
            - "PhishingCampaign.${c}.state was still APPROVED after the rejected calls (no CANCELLED leak)"
            - "author-1's schedule returns HTTP 200 with state SCHEDULED and one QUEUED delivery for ${e}"
            - "PhishingCampaign.${c}.author_user_id == author-1 throughout"

      - name: campaign_author_cannot_approve_their_own_campaign_returns_422
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 14]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties is by X-User-ID, not by role name: the same human holding both the CampaignAuthor and CampaignApprover roles is refused with ERR_SEGREGATION_OF_DUTIES_VIOLATION (422) on approve and on reject of their own campaign, while a different approver's approve succeeds on a template that is clean."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An APPROVED_FOR_USE template with no harmful theme tags; a campaign authored by author-1 sitting in IN_REVIEW."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/phishing-templates", payload: { name: "SOD Probe Template", pretext_category: "PACKAGE_DELIVERY", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["CURIOSITY", "URGENCY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Self Approval Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/reject", payload: { rejection_reason: "Self rejection attempt." }, as: CampaignApprover, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { st: "$.data.state", rev: "$.data.reviewer_user_id" } }
          assert:
            - "the self-approve returns HTTP 422 with error_id ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "the self-reject returns HTTP 422 with the same error_id: both review verdicts are covered"
            - "PhishingCampaign.${c}.state was still IN_REVIEW after both attempts, with reviewer_user_id null"
            - "approver-1's approve returns HTTP 200 with state APPROVED and reviewer_user_id == approver-1"
            - "the template's own approve-for-use by a non-author approver was accepted earlier, so the 422 is about the campaign's author edge only"

      - name: campaign_approval_cannot_skip_the_review_step_returns_409
        claim_type: approval_chain
        grounds:
          - state_machines.PhishingCampaign.DRAFT_to_IN_REVIEW
          - state_machines.PhishingCampaign.IN_REVIEW_to_APPROVED
          - errors[ERR_CAMPAIGN_STATE_INVALID]
        distinguishing_aspect: "The chain is submit-then-approve with no shortcut: approving a DRAFT campaign returns ERR_CAMPAIGN_STATE_INVALID (409) even for a legitimate independent approver, and scheduling an IN_REVIEW campaign fails the same way - each rung requires the previous one."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
