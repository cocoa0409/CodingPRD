            - call: "POST /price-integrity/price-change-files/${file_a}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_4}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T09:30:00Z", scheduled_end_at: "2026-08-03T09:45:00Z", expected_price_change_file_version: "${file_v2}" }
              as: PricingAdmin
              captures: { task_4_after_terminal: $.data.id }
          assert:
            - "Touching at a single instant conflicts: new [10:00, 11:00] vs existing [09:00, 10:00] gives 10:00 <= 10:00 AND 09:00 <= 11:00, so the call returns HTTP 409 with ${err_touching} == ERR_ASSOCIATE_SCHEDULE_CONFLICT"
            - "The reservation is per assignee, not per aisle or store: the identical touching window for la2 succeeds as ${task_2_other_assignee} with HTTP 201, print_status == NOT_PRINTED, placement_status == UNPLACED"
            - "One minute of separation clears it: [10:01, 11:00] for la1 succeeds as ${task_3_one_minute_clear} with HTTP 201"
            - "Contrast with the aisle rule: no cooldown is added here, so 10:01 is enough where an aisle audit would have needed 60 minutes"
            - "Terminal tasks stop reserving: after ${task_1} reaches placement_status VERIFIED, the window [09:30, 09:45] — fully inside T1's original window — is accepted as ${task_4_after_terminal} with HTTP 201"
            - "The same [09:30, 09:45] window would have been rejected before the verification, because 09:30 <= 10:00 AND 09:00 <= 09:45 both held while T1 was still non-terminal"
            - "GET /price-integrity/label-tasks?assigned_associate_id=${la1} returns total_count 3 and GET /price-integrity/label-tasks?assigned_associate_id=${la2} returns total_count 1"
            - "la1's scheduled minutes on 2026-08-03 total 60 + 59 + 15 == 134, far below ASSOCIATE_DAILY_MINUTES_CAP, so priority 70 never interferes"

      - name: associate_daily_minute_cap_is_an_aggregate_not_an_overlap
        grounds:
          - validations.priority_70_ERR_ASSOCIATE_DAILY_CAP_EXCEEDED
          - endpoints.POST_/price-integrity/price-change-files/{id}/label-tasks
          - entities.LabelTask.fields.scheduled_start_at
        distinguishing_aspect: |
          An aggregate temporal constraint rather than a pairwise one: every individual window is
          non-overlapping and legal, yet their SUM over one UTC calendar day may not exceed
          ASSOCIATE_DAILY_MINUTES_CAP (480). The boundary is inclusive — landing exactly on 480 is
          allowed and one extra minute is refused — and the accumulator resets at the UTC day
          boundary, so the identical refused window succeeds when moved to the next day.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default; jurisdiction US-CA with grace_period_hours 96 so both 2026-08-03 and 2026-08-04 windows stay inside the file's grace."
            - "One store, one aisle, one CERTIFIED LABEL_ASSOCIATE (la1)."
            - "One distributed file with FOUR lines, effective_date 2026-08-03T00:00:00Z."
            - "Incumbent task T1: line 1, la1, [2026-08-03T00:00:00Z, 2026-08-03T07:00:00Z] — exactly 420 scheduled minutes."
