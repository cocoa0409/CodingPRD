  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_batch_version_blocks_a_second_planned_run_and_a_refresh_lets_it_through
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.packaging-run-create-stale-batch
          - errors.ERR_STALE_BATCH_VERSION
          - validations.priority_22
        distinguishing_aspect: "Creating a run is itself a write on the parent batch, so the version a client observed at condition time is already spent by its own first create. The replay carries a well-formed body that would otherwise be legal (the batch has 11.000 bbl left) and still fails at 412, and a single re-read makes the identical request succeed."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; batch B-1001 CONDITIONING at 16.000 bbl with the version observed at the condition call."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
          trigger:
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-1", package_type: "HALF_BBL_KEG", destination: "DISTRIBUTION", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run1_id: $.data.id }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-2", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 4, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { err_stale: $.data.error_id }
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_v2: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-2", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 4, expected_batch_version: "${batch_v2}" }
              as: CellarOperator
              captures: { run2_id: $.data.id }
          assert:
            - "First create: HTTP 201, PackagingRun.${run1_id}.state == PLANNED"
            - "Replay with the stale version: HTTP 412 with error_id == ERR_STALE_BATCH_VERSION"
            - "GET /packaging-runs?batch_id=${batch_id} returns total_count == 1 immediately after the failed replay - nothing was written"
            - "batch_v2 == batch_v + 1 (the successful create incremented the parent exactly once and the rejected one did not)"
            - "Re-issued create with the fresh version: HTTP 201, PackagingRun.${run2_id}.state == PLANNED"
            - "Batch.${batch_id}.state == CONDITIONING with packaged_bbl 0.000 (planning moves no barrels)"

      - name: stale_license_version_blocks_a_proposal_after_a_ytd_adjustment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.appointment-create-stale-license
          - errors.ERR_STALE_LICENSE_VERSION
          - validations.priority_22
        distinguishing_aspect: "The second OCC rule is bumped by a write the proposing client never made: a compliance-side YTD adjustment on the licence. The 412 therefore proves the token is the licence's own version rather than an appointment counter, and the check runs after existence so a bad licence id would still be a 404."
        test_recipe:
          setup:
            - "Brewery ACTIVE; WA franchise licence registered, version observed at create time."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
