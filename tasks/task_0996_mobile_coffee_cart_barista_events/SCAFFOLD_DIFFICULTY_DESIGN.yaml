        distinguishing_aspect: |
          Boundary on UNITS metric on the reservation-create endpoint: qty_units == on_hand - reserved must SUCCEED; qty_units == (on_hand - reserved) + 1 must FAIL. Distinct metric from cart-buffer minutes, distinct endpoint.
