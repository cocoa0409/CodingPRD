              as_user_id: "admin-1"
            - call: "POST /signature-batches"
              payload: { petition_id: "${p2_id}", circulator_id: "${c1_id}", county_id: "${alpha_id}", affidavit_signed: true }
              as: Proponent
              as_user_id: "prop-2"
              captures: { b2_id: $.data.id }
            - call: "POST /signature-batches/${b2_id}/signatures"
              payload: { line_number: 1, signer_name: "Ada Adams", claimed_voter_id_number: "VA1", signed_on: "2026-09-11T00:00:00Z", signature_hash: "H-VA1" }
              as: Proponent
              as_user_id: "prop-2"
              captures: { l3_id: $.data.id }
          trigger:
            - call: "GET /signature-batches?petition_id=${p1_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { p1_batches_first: "$.data[0].id" }
            - call: "GET /signature-batches?petition_id=${p2_id}&status=RECEIVED"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { p2_batch_first: "$.data[0].id", p2_batch_status: "$.data[0].status" }
            - call: "GET /signature-batches?petition_id=${p1_id}&status=RECEIVED"
              as: ElectionsExaminer
              as_user_id: "exam-1"
            - call: "GET /signature-batches?is_supplemental=true"
              as: ElectionsExaminer
              as_user_id: "exam-1"
            - call: "GET /signature-records?batch_id=${b1_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { rec_first: "$.data[0].id", rec_first_line: "$.data[0].line_number" }
            - call: "GET /signature-records?batch_id=${b1_id}&in_sample=true"
              as: ElectionsExaminer
              as_user_id: "exam-1"
            - call: "GET /signature-records?validation_status=PENDING&batch_id=${b2_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pending_first: "$.data[0].id" }
            - call: "GET /circulation-assignments?circulator_id=${c1_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { asg_first: "$.data[0].id" }
            - call: "GET /circulation-assignments?petition_id=${p2_id}&status=ACTIVE"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { asg_p2: "$.data[0].id" }
            - call: "GET /verification-rounds?petition_id=${p1_id}"
              as: ElectionsExaminer
              as_user_id: "exam-1"
            - call: "GET /petitions?standard_id=${std_id}&status=CLEARED"
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { cleared_first: "$.data[0].id" }
          assert:
            - "GET /signature-batches?petition_id=${p1_id} returns exactly [${b1_id}] and ${p1_batches_first} == ${b1_id}"
            - "GET /signature-batches?petition_id=${p2_id}&status=RECEIVED returns exactly [${b2_id}] with ${p2_batch_first} == ${b2_id} and ${p2_batch_status} == RECEIVED - both filters are applied together"
            - "GET /signature-batches?petition_id=${p1_id}&status=RECEIVED returns [] - b1 is AFFIDAVIT_VERIFIED, so the conjunction excludes it"
            - "GET /signature-batches?is_supplemental=true returns [] - the boolean filter is honoured, not ignored"
            - "GET /signature-records?batch_id=${b1_id} returns exactly the two lines of b1 in line_number order, ${rec_first} == ${l1_id} and ${rec_first_line} == 1; b2's line is absent"
            - "GET /signature-records?batch_id=${b1_id}&in_sample=true returns [] - no round has selected anything yet"
            - "GET /signature-records?validation_status=PENDING&batch_id=${b2_id} returns exactly [${l3_id}] and ${pending_first} == ${l3_id}"
            - "GET /circulation-assignments?circulator_id=${c1_id} returns exactly [${a1_id}, ${a2_id}]; ${asg_first} == ${a1_id} (creation order)"
            - "GET /circulation-assignments?petition_id=${p2_id}&status=ACTIVE returns exactly [${a2_id}] and ${asg_p2} == ${a2_id}"
            - "GET /verification-rounds?petition_id=${p1_id} returns [] - an empty child collection is an empty array, not a 404"
            - "GET /petitions?standard_id=${std_id}&status=CLEARED returns exactly [${p1_id}, ${p2_id}] and ${cleared_first} == ${p1_id}"

      - name: computed_read_verification_invoice_tiers
        claim_type: computed_read
        grounds:
          - endpoints[GET /petitions/{petition_id}/verification-invoice]
          - calculations.verification_invoice
        excluded_because:
          difficulty_instance: invoice_tier_keyed_on_gross_before_discount
          rationale: |
            §1.8 reads the invoice at the TIER_A_FLOOR and TIER_B_FLOOR boundaries and one
            signature below each, asserting gross, tier, discount, subtotal, surcharge and
            total, and confirms the tier is chosen from the gross rather than the discounted
            subtotal. The computed read has no remaining unexercised branch.

      - name: computed_read_county_distribution_report
        claim_type: computed_read
        grounds:
          - endpoints[GET /petitions/{petition_id}/distribution-report]
          - calculations.county_distribution
        excluded_because:
          difficulty_instance: county_distribution_minimum_inclusive_boundary
          rationale: |
            §1.8 reads the distribution report with a county credited exactly at its minimum
            and one signature below it, asserting per-county minimum, credited count and the
            rolled-up qualifying_county_count, so the report's arithmetic and its inclusive
            comparison are both covered.

      - name: conditional_action_round_void_branch
        claim_type: conditional_action
        grounds:
          - endpoints[POST /verification-rounds/{round_id}/void]
          - state_machines.VerificationRound
        excluded_because:
          difficulty_instance: round_void_preserves_cost_ledger
          rationale: |
            §1.8 voids a tallied round and asserts the branch-dependent outcome: the petition
            returns to its pre-round stage, the round's own counts are cleared, and the cost
            ledger is deliberately not unwound. The conditional behaviour of the endpoint is
            already the subject of that instance.

  # ---------------------------------------------------------------------------
  # Section 6 of 9: errors. The guide's error table carries no per-row claims -
  # the single obligation is that every declared code is reachable. §1.8 and the
  # earlier sections of this file already trigger 45 of the 67 codes; the three
  # instances below sweep the remaining infrastructure codes (auth, shape, and
  # both existence layers) so the catalog is exhausted.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: auth_header_failures_rejected_before_anything_else
        claim_type: violation_to_error
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_INVALID_ROLE]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The first three rules are probed on requests that are also wrong in later ways -
          a non-existent path id and an unparseable body - so an implementation that
          validates the body or looks up the resource before reading the headers is caught.
          The blank header is an empty string rather than an absent one, because absent and
          present-but-empty are the same violation at priority 1 and only the empty-string
          form catches a truthiness bug. An unknown role string is separated from a known
          role that simply is not on the endpoint's list: 401 versus 403.
        test_recipe:
          setup:
            - "No domain state is needed; every probe is refused before the store is touched."
            - "Fixtures must send X-User-Role and X-User-ID as literal empty strings, not omit them, for the blank cases."
          setup_api_calls: []
          trigger:
            - call: "GET /petitions/00000000-0000-0000-0000-000000009999"
              as: ""
              as_user_id: "admin-1"
              captures: { e_blank_role: $.data.error_id }
            - call: "GET /petitions/00000000-0000-0000-0000-000000009999"
              as: SosAdmin
              as_user_id: ""
              captures: { e_blank_user: $.data.error_id }
            - call: "GET /petitions/00000000-0000-0000-0000-000000009999"
              as: "Notary"
              as_user_id: "notary-1"
              captures: { e_bad_role: $.data.error_id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", registered_voter_count: -5 }
              as: "notary"
              as_user_id: "notary-1"
              captures: { e_bad_role2: $.data.error_id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", registered_voter_count: -5 }
              as: Challenger
              as_user_id: "chal-1"
              captures: { e_role_before_shape: $.data.error_id }
            - call: "POST /petitions/00000000-0000-0000-0000-000000009999/clear-for-circulation"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { e_role_before_404: $.data.error_id }
          assert:
            - "${e_blank_role} == ERR_MISSING_AUTH_HEADERS (401) - an empty role string is a missing header, and the non-existent petition id is never consulted"
            - "${e_blank_user} == ERR_MISSING_AUTH_HEADERS (401) - the same code for the id header"
            - "${e_bad_role} == ERR_INVALID_ROLE (401) - Notary is not one of the seven declared roles"
            - "${e_bad_role2} == ERR_INVALID_ROLE (401) - role matching is case-sensitive, so lowercase sosadmin-style spellings are invalid roles rather than authorised actors"
            - "${e_role_before_shape} == ERR_UNAUTHORIZED (403), not ERR_INVALID_REQUEST - priority 3 runs before the shape check even though registered_voter_count is negative and name is missing"
            - "${e_role_before_404} == ERR_UNAUTHORIZED (403), not ERR_PETITION_NOT_FOUND - clearance is SosAdmin-only, and the role check precedes existence"

      - name: malformed_request_shapes_return_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          One code, eight distinct shape violations, each on a different clause of the
          priority-4 rule: a missing required field, an out-of-range integer, an empty array
          where cardinality is at least one, a duplicate entry in an array declared free of
          duplicates, an unknown enum member, an unparseable instant, effective_to equal to
          (not after) effective_from, and pagination arguments outside 1..100 and 0...
          Every probe otherwise names real resources and an authorised role, so nothing but
          the shape rule can explain the refusal - and the equal-instant case proves the
          comparison is strict rather than inclusive.
        test_recipe:
          setup:
            - "One VerificationStandard SOS-E, one County ALPHA, one DRAFT Petition and one Circulator exist so every probe carries valid ids and an authorised role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-E", gubernatorial_vote_total: 100, signature_pct_bps: 100, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Shape Committee", submitted_title: "Shape Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          trigger:
            - call: "POST /counties"
              payload: { county_code: "BETA", registered_voter_count: 10 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_missing: $.data.error_id }
            - call: "POST /counties"
              payload: { county_code: "GAMMA", name: "Gamma County", registered_voter_count: -5 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_range: $.data.error_id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Empty Subjects", submitted_title: "No Subjects", measure_subject_codes: [] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { e_empty_array: $.data.error_id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Dup Subjects", submitted_title: "Dup Subjects", measure_subject_codes: ["TAX", "TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { e_dup_array: $.data.error_id }
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "MAYBE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { e_enum: $.data.error_id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VBAD", full_name: "Bad Date", signature_on_file_hash: "H-VBAD", registration_date: "2020-13-45T99:99:99Z" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_instant: $.data.error_id }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${c1_id}", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${c1_v}" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_interval: $.data.error_id }
            - call: "GET /petitions?limit=0"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_limit: $.data.error_id }
            - call: "GET /signature-batches?offset=-1"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_offset: $.data.error_id }
            - call: "GET /petitions?limit=101"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_limit_hi: $.data.error_id }
            - call: "GET /petitions?limit=100"
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { ok_first: "$.data[0].id" }
          assert:
            - "${e_missing} == ERR_INVALID_REQUEST (400) - name is required and absent"
            - "${e_range} == ERR_INVALID_REQUEST (400) - registered_voter_count is out of range"
            - "${e_empty_array} == ERR_INVALID_REQUEST (400) - measure_subject_codes must hold at least one entry"
            - "${e_dup_array} == ERR_INVALID_REQUEST (400) - measure_subject_codes must be free of duplicates, and this is a shape violation, not ERR_SINGLE_SUBJECT_VIOLATION"
            - "${e_enum} == ERR_INVALID_REQUEST (400) - decision admits only APPROVE and REJECT; the petition state is never consulted"
            - "${e_instant} == ERR_INVALID_REQUEST (400) - registration_date is not a valid ISO 8601 UTC instant"
            - "${e_interval} == ERR_INVALID_REQUEST (400) - effective_to must be strictly after effective_from, so equal instants are refused at priority 4 rather than at the temporal rules of priority 14"
            - "${e_limit} == ERR_INVALID_REQUEST (400), ${e_offset} == ERR_INVALID_REQUEST (400) and ${e_limit_hi} == ERR_INVALID_REQUEST (400) - limit lives in 1..100 and offset is non-negative"
            - "GET /petitions?limit=100 succeeds with ${ok_first} == ${pet_id} - the upper bound is inclusive, so only 101 is out of range"
            - "No County, Petition, VoterRecord or CirculationAssignment was created by any refused probe"

      - name: unresolvable_ids_return_the_entity_specific_not_found_code
        claim_type: not_found
        grounds:
          - validations[priority 5]
          - validations[priority 6]
          - errors[ERR_VERIFICATION_STANDARD_NOT_FOUND]
          - errors[ERR_COUNTY_NOT_FOUND]
          - errors[ERR_VOTER_RECORD_NOT_FOUND]
          - errors[ERR_PETITION_NOT_FOUND]
          - errors[ERR_CIRCULATOR_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_SIGNATURE_RECORD_NOT_FOUND]
          - errors[ERR_ROUND_NOT_FOUND]
          - errors[ERR_CURE_PERIOD_NOT_FOUND]
          - errors[ERR_CHALLENGE_NOT_FOUND]
          - errors[ERR_FRAUD_REFERRAL_NOT_FOUND]
        distinguishing_aspect: |
          Every one of the twelve entities has its own 404 code, and a shared generic
          not-found would pass a laxer suite while breaking the audit trail this program
          needs. Each path-parameter probe uses a role that is authorised for the endpoint so
          priority 3 cannot mask priority 5. The body-level half then shows that the same
          codes are produced by priority 6 and, critically, that the declared field order is
          honoured: a POST /signature-batches carrying three unresolvable foreign keys returns
          ERR_PETITION_NOT_FOUND because petition_id is declared before circulator_id and
          county_id, and an unknown entry in assigned_county_codes yields
          ERR_COUNTY_NOT_FOUND rather than a shape error.
        test_recipe:
          setup:
            - "One VerificationStandard SOS-Q, one County ALPHA, one Circulator c1 and one DRAFT Petition exist, so each body-level probe can hold exactly one unresolvable key while the rest resolve."
            - "MISSING is shorthand for the literal id 00000000-0000-0000-0000-000000009999, which is never issued by the API."
