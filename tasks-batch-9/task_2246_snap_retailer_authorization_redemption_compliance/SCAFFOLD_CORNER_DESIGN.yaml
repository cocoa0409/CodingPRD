            - "EquipmentOrder.${order_init_id}.status == DRAFT and placed_at == null"
            - "Store.${store_id}.sanction_status == UNDER_INVESTIGATION (opening the investigation released nothing because the deployment was released by that same cascade)"

      - name: sanction_case_is_created_in_charge_draft_from_a_substantiated_investigation
        claim_type: Initial State
        grounds:
          - state_machines.SanctionCase.initial_state
          - validations.priority_17_evidence
        distinguishing_aspect: "POST /sanction-cases lands in CHARGE_DRAFT with every deadline, sanction and CMP field still null, and the store's sanction_status is still UNDER_INVESTIGATION rather than CHARGED."
        test_recipe:
          setup:
            - "An authorized store with a SUBSTANTIATED INELIGIBLE_ITEM_SALES investigation."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
