      - name: rider_scope_variants_diverge_on_one_booking
        claim_type: variant_divergence
        grounds:
          - calculations.rider_cost_estimate.variants.PROPOSED_SCOPE
          - calculations.rider_cost_estimate.variants.CONTRACTED_SCOPE
        excluded_because:
          difficulty_instance: dual_variant_calc / rider_scope_variant_divergence_on_booking
          rationale: "That instance builds five lines that exercise every divergence source at once (undecided, rejected, substituted, promoter-provided, capped) and asserts both totals plus the delta."

      - name: artist_risk_variants_diverge_on_one_roster_row
        claim_type: variant_divergence
        grounds:
          - calculations.artist_radius_risk_score.variants.STRICT
          - calculations.artist_radius_risk_score.variants.ADJUDICATED
        excluded_because:
          difficulty_instance: dual_variant_calc / artist_risk_variant_divergence_on_roster
          rationale: "That instance pairs three open CONFLICT reports with one adjudicated VIOLATION so STRICT returns 65 and blocks while ADJUDICATED returns 29 and does not."

      - name: deposit_recovery_variants_diverge_after_a_clawback
        claim_type: variant_divergence
        grounds:
          - calculations.deposit_recovery.variants.CONTRACTUAL
          - calculations.deposit_recovery.variants.ACTUAL_CHRONOLOGICAL
        excluded_because:
          difficulty_instance: dual_variant_calc / deposit_recovery_contractual_versus_actual_chronological
          rationale: "That instance stamps the CONTRACTUAL figure at cancellation, replays the RECOVERED installments chronologically, and asserts the clamp between the two."

      - name: guarantee_ceiling_is_a_nested_min_over_three_inputs
        claim_type: correct_result
        grounds:
          - calculations.offer_guarantee_ceiling
        excluded_because:
          difficulty_instance: combinatorial_formula / guarantee_ceiling_nested_min_max
          rationale: "That instance varies which of tier_headroom, festival_headroom and the scaled draw component wins the min, including the inner max against BASE_FLOOR_CENTS."

      - name: rider_lines_are_rounded_before_they_are_summed
        claim_type: precision
        grounds:
          - calculations.rider_cost_estimate
        excluded_because:
          difficulty_instance: combinatorial_formula / rider_per_line_rounding_order
          rationale: "That instance is built so that summing raw products and rounding once differs from the declared per-line round_half_up, and asserts the declared reading."

      - name: settlement_bracket_is_chosen_from_the_unadjusted_gross
        claim_type: correct_result
        grounds:
          - calculations.settlement_total
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_share_bracket_evaluation_order
          rationale: "That instance parks the gross next to SHARE_BRACKET_HI_CENTS so the circular reading picks a different bracket, and asserts the pinned order."

      - name: genre_share_of_exactly_040_passes
        claim_type: constants_applied
        grounds:
          - calculations.genre_balance_share
          - validations[priority 72]
        excluded_because:
          difficulty_instance: boundary_precision_check / genre_share_exactly_at_cap_passes
          rationale: "That instance sits the including share on GENRE_CAP_PCT exactly and then one cent over, covering both sides of the strict comparison."

      - name: deposit_tier_at_exactly_120_days_uses_half
        claim_type: constants_applied
        grounds:
          - calculations.payment_schedule_build
        excluded_because:
          difficulty_instance: boundary_precision_check / deposit_tier_exactly_120_days_uses_half
          rationale: "That instance accepts at exactly DEPOSIT_TIER_FAR_DAYS and one day later, asserting 0.50 and 0.40 across the boundary."

      - name: buffered_abutment_on_a_stage_is_a_conflict
        claim_type: correct_result
        grounds:
          - calculations.stage_interval_conflict
          - validations[priority 50]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / stage_buffered_abutment_conflict
          rationale: "That instance tests exact abutment with a non-zero changeover buffer and the first minute that clears it."

      - name: stage_day_minutes_aggregate_over_a_calendar_date
        claim_type: correct_result
        grounds:
          - calculations.stage_day_load
          - validations[priority 52]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / stage_day_aggregate_minutes_cap
          rationale: "That instance builds non-overlapping slots whose buffered sum exceeds daily_program_minutes_cap, and lands the equality case too."

      - name: radius_window_is_a_closed_interval_on_both_days
        claim_type: correct_result
        grounds:
          - calculations.radius_conflict_detection
        excluded_because:
          difficulty_instance: boundary_precision_check / radius_window_closed_interval_boundary_conflict
          rationale: "That instance reports performances on window_start_date, window_end_date and one day outside each end."

      - name: budget_commitment_survives_cancel_and_replace
        claim_type: correct_result
        grounds:
          - calculations.budget_commitment_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / budget_commitment_restored_after_cancel_and_replace
          rationale: "That instance reconciles all three expressions of the conserved currency after an accept, a cancel and a replacement accept."

      - name: stage_minutes_survive_cancel_and_replace
        claim_type: correct_result
        grounds:
          - calculations.stage_minutes_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / stage_minutes_restored_after_cancel_and_replace
          rationale: "That instance asserts Stage.booked_minutes returns to its pre-accept value and matches the recomputed booking sum."

      - name: installment_total_is_conserved_across_an_amendment
        claim_type: correct_result
        grounds:
          - calculations.payment_schedule_build
        excluded_because:
          difficulty_instance: compensating_invariant / installment_total_conserved_across_guarantee_amendment
          rationale: "That instance amends the guarantee and asserts the rebuilt non-VOIDED installments again sum to the new guarantee."

  - section: validations
    instances:

      - name: uniqueness_collisions_rejected_across_four_entities
        claim_type: violation_to_error
        grounds:
          - validations[priority 20]
          - validations[priority 21]
          - validations[priority 22]
          - validations[priority 23]
          - errors[ERR_DUPLICATE_TIER_CODE]
          - errors[ERR_DUPLICATE_STAGE_NAME]
          - errors[ERR_DUPLICATE_ARTIST_NAME]
          - errors[ERR_DUPLICATE_WAVE_NUMBER]
        distinguishing_aspect: |
          All four uniqueness rules in the 20-29 band fire from one fixture, and the
          tier rule is probed on both of its composite keys: a colliding tier_code with
          a free tier_rank and a free tier_code with a colliding tier_rank surface the
          same ERR_DUPLICATE_TIER_CODE. The artist key is global rather than per
          festival, so a second "Nova Kade" collides even with no festival in the body.
        test_recipe:
          setup:
            - "One festival with a single HEADLINER tier at rank 1, one stage named Aurora Main, the roster act Nova Kade, and wave_number 1 in PRESALE."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.0, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
