  - rule_id: boundary_precision_check
    instances:

      - name: warranty_free_band_includes_the_exact_anniversary_month
        grounds:
          - calculations.warranty_prorata_credit
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED_FREE
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED_PRORATA
          - entities.WarrantyClaim.fields.months_in_service
        distinguishing_aspect: |
          Numeric threshold boundary on months_in_service, reached through
          POST /distribution/warranty-claims/{id}/adjudicate: exactly 12 months on a
          12-month free band is FREE and pays the full 18500 cents (the comparison is <=),
          while 13 months is PRORATA and pays 17729 - a one-month step worth 771 cents.
        test_recipe:
          setup:
            - "One STANDARD TX account and model IB-31-FLD with warranty_free_replacement_months 12 and warranty_prorata_months 24 at 18500 cents."
            - "Claim ON: installed 2024-08-15, failed 2025-08-15, serial SN-BND-ON, still SUBMITTED."
            - "Claim OVER: installed 2024-08-15, failed 2025-09-15, serial SN-BND-OVER, already adjudicated."
          setup_api_calls:
            - call: "POST /distribution/accounts"
              payload: { name: "Alamo Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 9 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-31-FLD", chemistry: "FLOODED_LEAD_ACID", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.25, unit_weight_kg: 26.0, lead_content_kg: 12.5, core_deposit_cents: 2200, list_price_cents: 18500, warranty_free_replacement_months: 12, warranty_prorata_months: 24, shelf_life_days: 540, self_discharge_pct_per_month: 6.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
            - call: "POST /distribution/warranty-claims"
              payload: { account_id: "${acct}", battery_model_id: "${m_fld}", serial_number: "SN-BND-OVER", installed_on: "2024-08-15", failed_on: "2025-09-15" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { wc_over: $.data.id }
            - call: "POST /distribution/warranty-claims/${wc_over}/adjudicate"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { over_months: $.data.months_in_service, over_credit: $.data.credit_cents }
            - call: "POST /distribution/warranty-claims"
              payload: { account_id: "${acct}", battery_model_id: "${m_fld}", serial_number: "SN-BND-ON", installed_on: "2024-08-15", failed_on: "2025-08-15" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { wc_on: $.data.id }
          trigger:
            - call: "POST /distribution/warranty-claims/${wc_on}/adjudicate"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { on_months: $.data.months_in_service, on_credit: $.data.credit_cents }
          assert:
            - "${on_months} == 12"
            - "WarrantyClaim.${wc_on}.coverage_band == FREE"
            - "WarrantyClaim.${wc_on}.status == APPROVED_FREE"
            - "${on_credit} == 18500"
            - "${over_months} == 13"
            - "WarrantyClaim.${wc_over}.coverage_band == PRORATA"
            - "WarrantyClaim.${wc_over}.status == APPROVED_PRORATA"
            - "${over_credit} == 17729"

      - name: submit_rejects_order_holding_zero_lines
        grounds:
          - validations[priority=12]
          - errors[ERR_ORDER_HAS_NO_LINES]
          - entities.Order.fields.line_count
          - state_machines.Order.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (line_count) and a different
          endpoint (POST /distribution/orders/{id}/submit) from the months_in_service
          threshold: line_count 0 is rejected with ERR_ORDER_HAS_NO_LINES while every
          money field stays 0 and the order stays DRAFT.
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse, one ACTIVE STANDARD TX account, and one DRAFT order carrying no lines at all."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Empty Cart Co", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 9 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-15" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id, lc: $.data.line_count }
          trigger:
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "${lc} == 0"
            - "HTTP status == 422"
            - "${err} == ERR_ORDER_HAS_NO_LINES"
            - "Order.${ord}.fulfillment_status == DRAFT"
            - "Order.${ord}.credit_status == PENDING"
            - "Order.${ord}.subtotal_cents == 0"
            - "Order.${ord}.total_cents == 0"
            - "Account.${acct}.open_receivable_cents == 0"

      - name: state_of_charge_exactly_at_threshold_stays_sellable
        grounds:
          - calculations.lot_state_of_charge
          - calculations.lot_condition_posture
          - calculations.lot_allocation_selector
          - entities.InventoryLot.fields.condition_state
        distinguishing_aspect: |
          Boundary on a third metric (state_of_charge_pct) reached through
          POST /distribution/orders/{id}/allocate: a lot sitting at exactly 75.0 percent
          is SELLABLE because clause 4 uses a strict <, so allocation succeeds against it,
          while its older 70.0 percent sibling is REFRESH_REQUIRED and never enters the
          candidate set despite winning the FIFO ranking.
        test_recipe:
          setup:
            - "The logical clock is left at its 2026-08-01T00:00:00Z default."
            - "One hazmat-endorsed TX warehouse, one STANDARD TX account and model IB-SLF-5 with self_discharge_pct_per_month 5.0 and shelf_life_days 540."
            - "Lot ON manufactured 2026-03-01 (153 days, 5 storage months, 75.0 percent, SELLABLE) with 20 units."
