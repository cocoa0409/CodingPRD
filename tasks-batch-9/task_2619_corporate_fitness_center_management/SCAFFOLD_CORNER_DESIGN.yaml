            - call: "GET /members/${m1_id}"
              payload: {}
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { m1_ver: $.data.version }
            - call: "POST /members/${m1_id}/waivers"
              payload: { waiver_version_code: "WVR-2026A", expires_on: "2027-06-30", acknowledged_health_disclosure: true, expected_member_version: "${m1_ver}" }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /members/${m1_id}/waivers"
              payload: { waiver_version_code: "WVR-2026B", expires_on: "2027-12-31", acknowledged_health_disclosure: true, expected_member_version: "${m1_ver}" }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { err_stale_member: $.data.error_id }
            - call: "GET /members/${m1_id}"
              payload: {}
