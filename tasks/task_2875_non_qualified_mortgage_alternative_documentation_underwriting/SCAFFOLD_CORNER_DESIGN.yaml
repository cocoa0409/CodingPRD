        distinguishing_aspect: "One DSCR loan is approved seven times and returns four different error_ids in declared ladder order, twice returning ERR_ATR_DOCUMENTATION_INCOMPLETE because the second appraisal moved reconciled_value_cents and invalidated a determination that had already been made - and the final refusal is ERR_LTV_ABOVE_PROGRAM_MAX, because the conservative 70000000 value pushed LTV from 75.00 to 85.71."
