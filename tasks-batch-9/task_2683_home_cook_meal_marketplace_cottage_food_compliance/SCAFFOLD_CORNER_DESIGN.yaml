              payload: { decision: "DISMISS" }
              as: SafetyOfficer
              as_user_id: so-2
              captures: { inc_after: "$.data.status" }
            - call: POST /cooks/${cook_id}/standing-actions
              payload: { action: "REINSTATE", reason: "incident dismissed at triage" }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { standing_2: "$.data.compliance_standing", reason_2: "$.data.standing_reason", cook_v_clear: "$.data.version" }
            - call: POST /cooks/${cook_id}/standing-actions
              payload: { action: "REINSTATE", reason: "double click" }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { err_repeat: "$.data.error_id" }
