        grounds:
          - validations[priority=9]
          - errors[ERR_MEMBER_DOUBLE_BOOKED]
          - state_machines.Callout.STANDBY_to_DEPLOYED
          - entities.Task.fields.planned_start
        distinguishing_aspect: |
          Member interval semantics = CLOSED window + MEMBER_REST_BUFFER_MIN(60)
          gap (different from the resource half-open no-buffer rule): a member
          DEPLOYED to task1 [10:00,12:00] cannot deploy to task2 [12:30,14:00]
