# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Foundation Scholarship Management — Expert
# 9 rule_ids x >= 2 instances = 18 instances total.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.6.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: award_provisional_vs_final_diverge_on_same_applicant
        grounds:
          - calculations.provisional_award
          - calculations.final_award
          - entities.Award.fields.provisional_award_cents
          - entities.Award.fields.final_award_cents
        distinguishing_aspect: "On the Award domain: provisional keys off rubric_total tier (>=90 -> 1.00) giving 1000000c; final keys off verified_gpa factor (3.20 -> 0.90) giving 900000c; identical applicant data, two algorithms, delta 100000c."
        test_recipe:
          setup:
            - "Fund OPEN->REVIEW->AWARDING with criteria min_gpa=3.00, max_award_cents=1000000, endowment 5000000."
            - "Applicant eligible; application requested 1000000c; transcript verified_gpa=3.20; two SUBMITTED rubric scores 95/90/85 -> rubric_total 91.50; application SCORED then AWARDED with provisional 1000000c."
            - "Stewardship acknowledged so disburse can compute final."
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Merit Fund", endowment_cents: 5000000, award_term: "FALL" }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 3.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 1000000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Ada Lovelace", email: "ada@x.edu", self_reported_gpa: 3.90, residency_state: "CA", field_of_study: "CS", institution_id: "INST1" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 1000000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "Prof X", document_uri: "s3://rec1" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t1", verified_gpa: 3.20 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /committee-members"
              payload: { full_name: "Rev A", email: "a@x.edu", expertise_field: "CS" }
              as: CommitteeMember
              captures: { mem_a: $.data.id }
            - call: "POST /committee-members"
              payload: { full_name: "Rev B", email: "b@x.edu", expertise_field: "CS" }
              as: CommitteeMember
              captures: { mem_b: $.data.id }
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}" }
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /scholarship-funds/${fund_id}/begin-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}", academic_score: 95, need_score: 90, essay_score: 85 }
              as: CommitteeMember
              as_user_id: "${mem_a}"
              captures: { score_a: $.data.id }
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}", academic_score: 95, need_score: 90, essay_score: 85 }
              as: CommitteeMember
              as_user_id: "${mem_b}"
              captures: { score_b: $.data.id }
            - call: "POST /rubric-scores/${score_a}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_a}"
            - call: "POST /rubric-scores/${score_b}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_b}"
            - call: "POST /applications/${app_id}/finalize-scoring"
              payload: {}
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/begin-awarding"
              payload: {}
              as: FoundationAdmin
            - call: "GET /scholarship-funds/${fund_id}"
              payload: {}
              as: FoundationAdmin
              captures: { fund_v: $.data.version }
            - call: "POST /applications/${app_id}/award"
              payload: { expected_fund_version: "${fund_v}" }
              as: FoundationAdmin
              captures: { award_id: $.data.id }
            - call: "POST /stewardship-records"
              payload: { award_id: "${award_id}", thank_you_text: "Thank you!" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { stew_id: $.data.id }
            - call: "POST /stewardship-records/${stew_id}/acknowledge"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "GET /awards/${award_id}"
              payload: {}
              as: FoundationAdmin
              captures: { prov: $.data.provisional_award_cents }
            - call: "POST /awards/${award_id}/disburse"
              payload: { institution_id: "INST1" }
              as: DisbursementOfficer
              captures: { disb_id: $.data.id, disb_amt: $.data.amount_cents }
          assert:
            - "Award.${award_id}.provisional_award_cents == 1000000"
            - "Award.${award_id}.final_award_cents == 900000"
            - "Disbursement.${disb_id}.amount_cents == 900000"
            - "Award.${award_id}.provisional_award_cents != Award.${award_id}.final_award_cents"

      - name: eligibility_uses_verified_gpa_not_self_reported
        grounds:
          - calculations.eligibility_match
          - entities.Application.fields.eligibility_matched
          - entities.Application.fields.eligibility_failures
          - entities.Transcript.fields.verified_gpa
          - entities.Applicant.fields.self_reported_gpa
        distinguishing_aspect: "On the Application domain: self_reported_gpa=3.90 would pass min_gpa=3.50 but registrar verified_gpa=3.20 fails; eligibility uses verified_gpa, so eligibility_matched==false with eligibility_failures==['GPA'] despite the higher self-report."
        test_recipe:
          setup:
            - "Fund OPEN with criteria min_gpa=3.50; applicant self_reported_gpa=3.90 but transcript verified_gpa=3.20."
            - "Application has 1 recommendation + 1 transcript, ready to submit."
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "STEM Fund", endowment_cents: 2000000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 3.50, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Grace H", email: "g@x.edu", self_reported_gpa: 3.90, residency_state: "NY", field_of_study: "Math", institution_id: "INST2" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 400000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "Dean", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t", verified_gpa: 3.20 }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { matched: $.data.eligibility_matched }
          assert:
            - "Application.${app_id}.eligibility_matched == false"
            - "Application.${app_id}.eligibility_failures == ['GPA']"
            - "Application.${app_id}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_award_nonlinear_tier_times_request_capped
        grounds:
          - calculations.provisional_award
          - entities.Award.fields.provisional_award_cents
          - entities.EligibilityCriteria.fields.max_award_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction (rubric_total tier branch -> MULT_MID 0.80, multiply requested 700000, then min() cap against max_award_cents 500000); the min() cap binds so result is 500000c not the 560000c raw."
        test_recipe:
          setup:
            - "Fund AWARDING, criteria max_award_cents=500000, endowment 5000000; application requested 700000c."
            - "rubric_total = 80.00 (two reviewers each 80/80/80) -> tier MID 0.80; raw 560000 capped to 500000."
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Cap Fund", endowment_cents: 5000000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Bo", email: "bo@x.edu", self_reported_gpa: 3.0, residency_state: "TX", field_of_study: "Bio", institution_id: "I3" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 700000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t", verified_gpa: 3.0 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /committee-members"
              payload: { full_name: "Rev A", email: "a@x.edu", expertise_field: "Bio" }
              as: CommitteeMember
              captures: { mem_a: $.data.id }
            - call: "POST /committee-members"
              payload: { full_name: "Rev B", email: "b@x.edu", expertise_field: "Bio" }
              as: CommitteeMember
              captures: { mem_b: $.data.id }
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}" }
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /scholarship-funds/${fund_id}/begin-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}", academic_score: 80, need_score: 80, essay_score: 80 }
              as: CommitteeMember
              as_user_id: "${mem_a}"
              captures: { score_a: $.data.id }
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}", academic_score: 80, need_score: 80, essay_score: 80 }
              as: CommitteeMember
              as_user_id: "${mem_b}"
              captures: { score_b: $.data.id }
            - call: "POST /rubric-scores/${score_a}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_a}"
            - call: "POST /rubric-scores/${score_b}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_b}"
            - call: "POST /applications/${app_id}/finalize-scoring"
              payload: {}
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/begin-awarding"
              payload: {}
              as: FoundationAdmin
            - call: "GET /scholarship-funds/${fund_id}"
              payload: {}
              as: FoundationAdmin
              captures: { fund_v: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/award"
              payload: { expected_fund_version: "${fund_v}" }
              as: FoundationAdmin
              captures: { award_id: $.data.id, prov: $.data.provisional_award_cents }
          assert:
            - "Award.${award_id}.provisional_award_cents == 500000"
            - "Application.${app_id}.rubric_total == 80.0"

      - name: rubric_total_sum_then_divide_then_round_once
        grounds:
          - calculations.rubric_total
          - calculations.rubric_weighted_value
          - entities.Application.fields.rubric_total
          - entities.RubricScore.fields.weighted_value
        distinguishing_aspect: "Mode (b): nested rounding order is pinned to sum-then-divide-then-round-once; weighted_values [91.50, 91.50, 80.00] sum 263.00 / 3 = 87.6667 -> single final round to 87.67, not per-step rounding."
        test_recipe:
          setup:
            - "Fund REVIEW; application UNDER_REVIEW with three ASSIGNED reviewers."
            - "Three SUBMITTED scores: two of 95/90/85 (wv 91.50) and one of 80/80/80 (wv 80.00)."
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Round Fund", endowment_cents: 9000000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 1000000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Cy", email: "cy@x.edu", self_reported_gpa: 3.2, residency_state: "WA", field_of_study: "EE", institution_id: "I4" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 500000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t", verified_gpa: 3.2 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /committee-members"
              payload: { full_name: "RA", email: "ra@x.edu", expertise_field: "EE" }
              as: CommitteeMember
              captures: { mem_a: $.data.id }
            - call: "POST /committee-members"
              payload: { full_name: "RB", email: "rb@x.edu", expertise_field: "EE" }
              as: CommitteeMember
              captures: { mem_b: $.data.id }
            - call: "POST /committee-members"
              payload: { full_name: "RC", email: "rc@x.edu", expertise_field: "EE" }
              as: CommitteeMember
              captures: { mem_c: $.data.id }
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_c}" }
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /scholarship-funds/${fund_id}/begin-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}", academic_score: 95, need_score: 90, essay_score: 85 }
              as: CommitteeMember
              as_user_id: "${mem_a}"
              captures: { score_a: $.data.id }
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}", academic_score: 95, need_score: 90, essay_score: 85 }
              as: CommitteeMember
              as_user_id: "${mem_b}"
              captures: { score_b: $.data.id }
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_c}", academic_score: 80, need_score: 80, essay_score: 80 }
              as: CommitteeMember
              as_user_id: "${mem_c}"
              captures: { score_c: $.data.id }
            - call: "POST /rubric-scores/${score_a}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_a}"
            - call: "POST /rubric-scores/${score_b}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_b}"
            - call: "POST /rubric-scores/${score_c}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_c}"
          trigger:
            - call: "POST /applications/${app_id}/finalize-scoring"
              payload: {}
              as: FoundationAdmin
              captures: { rt: $.data.rubric_total }
          assert:
            - "Application.${app_id}.rubric_total == 87.67"
            - "Application.${app_id}.status == SCORED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_review_revision_cycle_loop
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_NEEDS_REVISION
          - state_machines.Application.NEEDS_REVISION_to_UNDER_REVIEW
          - entities.Application.fields.revision_round
        distinguishing_aspect: "Cycle on the Application entity: UNDER_REVIEW -> NEEDS_REVISION -> UNDER_REVIEW; revision_round increments to 1 on the loop-back and rubric_total returns to null after request-revision retracts scores."
        test_recipe:
          setup:
            - "Fund REVIEW; application UNDER_REVIEW with two ASSIGNED reviewers and two SUBMITTED scores."
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Loop Fund", endowment_cents: 3000000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Di", email: "di@x.edu", self_reported_gpa: 3.0, residency_state: "OR", field_of_study: "Art", institution_id: "I5" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 300000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t", verified_gpa: 3.0 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /committee-members"
              payload: { full_name: "RA", email: "ra@x.edu", expertise_field: "Art" }
              as: CommitteeMember
              captures: { mem_a: $.data.id }
            - call: "POST /committee-members"
              payload: { full_name: "RB", email: "rb@x.edu", expertise_field: "Art" }
              as: CommitteeMember
              captures: { mem_b: $.data.id }
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}" }
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /scholarship-funds/${fund_id}/begin-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}", academic_score: 70, need_score: 70, essay_score: 70 }
              as: CommitteeMember
              as_user_id: "${mem_a}"
              captures: { score_a: $.data.id }
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_b}", academic_score: 70, need_score: 70, essay_score: 70 }
              as: CommitteeMember
              as_user_id: "${mem_b}"
              captures: { score_b: $.data.id }
            - call: "POST /rubric-scores/${score_a}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_a}"
            - call: "POST /rubric-scores/${score_b}/submit"
              payload: {}
              as: CommitteeMember
              as_user_id: "${mem_b}"
          trigger:
            - call: "POST /applications/${app_id}/request-revision"
              payload: {}
              as: FoundationAdmin
              captures: { rr: $.data.revision_round }
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FoundationAdmin
              captures: { st: $.data.status }
          assert:
            - "Application.${app_id}.status == UNDER_REVIEW"
            - "Application.${app_id}.revision_round == 1"
            - "Application.${app_id}.rubric_total == null"
            - "RubricScore.${score_a}.status == RETRACTED"

      - name: award_renewal_pending_cycle_back_to_active
        grounds:
          - state_machines.Award.ACTIVE_to_RENEWAL_PENDING
          - state_machines.Award.RENEWAL_PENDING_to_ACTIVE
          - entities.Award.fields.term_index
        distinguishing_aspect: "Cycle on the Award entity (distinct from Application): ACTIVE -> RENEWAL_PENDING -> ACTIVE; term_index advances from 1 to 2 on the approved loop-back."
        test_recipe:
          setup:
            - "Award ACTIVE (disbursed) for an applicant; renewal_gpa_floor=3.00; fund has ample available_cents."
          setup_api_calls:
            - call: "POST /scholarship-funds"
