  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_settle_disputed_before_anything_else
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - state_machines.DamageAssessment.ASSESSED_to_DISPUTED
        distinguishing_aspect: |
          Pair {state (priority 4) vs business_constraint ERR_ASSESSMENT_DISPUTED (priority 11)}:
          settling a reservation that is RETURNED with a DISPUTED assessment fails — the state
          check (lifecycle must be RETURNED, which holds) passes, so the lower-priority
          ERR_ASSESSMENT_DISPUTED wins; but if lifecycle is also wrong, ERR_INVALID_STATE (4)
          would win first. Test pins that with valid state the dispute error surfaces.
        test_recipe:
          setup:
            - "Reservation RETURNED with DamageAssessment moved to DISPUTED by the renter."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-07T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SKI", name: "Touring", size_label: "165cm" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
