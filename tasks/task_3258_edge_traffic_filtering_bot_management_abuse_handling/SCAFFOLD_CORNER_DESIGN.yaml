            action: BLOCK
            rate_limit_threshold_rpm: 100
        as: ZoneAdmin
        as_user_id: ${acc_f}
        captures:
          err: $.data.error_id
      - call: PATCH /api/zones/${zone_p}
        payload:
          traffic_rules:
          - name: rl
