            - "GET /kennel-allocations with station_id ${st_hkg} returns an empty list"

      - name: kennel_allocation_with_end_before_start_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_44
          - errors.ERR_INVALID_TIME_RANGE
        distinguishing_aspect: "occupancy_end_utc must be STRICTLY after occupancy_start_utc, so a window that ends three hours before it starts is refused with 422 ERR_INVALID_TIME_RANGE rather than normalised by swapping the endpoints."
        test_recipe:
