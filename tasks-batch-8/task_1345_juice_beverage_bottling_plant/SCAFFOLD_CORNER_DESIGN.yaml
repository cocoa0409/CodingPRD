        grounds:
          - state_machines.ProductionRun.IN_PRODUCTION_to_COMPLETED
          - errors[ERR_FILL_COUNT_EXCEEDS_THEORETICAL]
          - errors[ERR_ZONE_TEMPERATURE_MISMATCH]
        distinguishing_aspect: |
          The complete gate isolates: actual 0 rejected (lower bound), 1051
          rejected (above ceil(planned * 1.05) == 1050 even though theoretical
          4143 is higher — the reserved cap binds), FROZEN zone rejected for a
          PASTEURIZATION run; each failure leaves the run IN_PRODUCTION so the
          corrected retry succeeds.
        test_recipe:
          setup:
            - "Full pipeline; run IN_PRODUCTION (planned 1000, theoretical 4143); zones Z-FRZ FROZEN and Z-AMB AMBIENT (both cap 50); clock inside the window"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "FillCo", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
