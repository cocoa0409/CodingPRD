          assert:
            - "${run12_projected} == 29167 and ${d17_due_at_at_placement} == null - a scheduled row placed before publication has no due date yet"
            - "ClientDeliverable.${d17_id}.due_at == 2026-08-15T00:00:00Z and ClientDeliverable.${d16_id}.due_at == 2026-08-15T00:00:00Z"
            - "${d17_gross} == 150000 - exactly the bracket floor - and ${d17_discount} == 22500 (0.15 applied, not 0.10)"
            - "ClientDeliverable.${d17_id}.days_late == 0 and .late_penalty_cents == 0 and ${d17_total} == 127500"
            - "${d16_gross} == 145000 - the closest representable point below the floor, since the surcharge granularity is 5000 - and ${d16_discount} == 14500 (0.10 applied)"
            - "ClientDeliverable.${d16_id}.days_late == 0 and .late_penalty_cents == 0 and ${d16_total} == 130500"
            - "${d17_total} < ${d16_total} even though ${d17_gross} > ${d16_gross}"
            - "Client.${cl12_id}.delivery_sla_credit_cents == 0 - no penalty was charged on either dispatch"
            - "ClientDeliverable.${d17_id}.state == DELIVERED and .kind == SCHEDULED_DATASET and .findings_summary == null"

      - name: meter_fault_threshold_at_exactly_1440_versus_1439
        grounds:
          - calculations.meter_missing_minutes
          - calculations.quota_cell_fill
          - calculations.market_recruitment_posture
          - endpoints[POST /processing-runs/{processing_run_id}/detect-faults]
          - state_machines.Meter.health_status.HEALTHY_to_FAULTED
          - state_machines.Meter.health_status.HEALTHY_to_SUSPECT
          - entities.Meter.fields.missing_minutes_last_scan
        distinguishing_aspect: |
          A different metric on a different endpoint from the billing boundary: missing_minutes against
          fault_missing_minutes_threshold on POST /processing-runs/{id}/detect-faults. Inside one scan
          of a 1440-minute window, the meter with zero coverage sits at exactly 1440 and becomes
          FAULTED while the meter with a single 1-minute record sits at 1439 and becomes only SUSPECT,
          proving the comparison is >= and not >.
