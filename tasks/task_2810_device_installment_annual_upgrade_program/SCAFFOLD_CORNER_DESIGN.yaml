      - name: overpayment_is_recorded_then_further_payment_has_nothing_to_allocate
        claim_type: waterfall_allocation
        grounds:
          - calculations.payment_waterfall_allocation
          - entities.PaymentPosting.fields.overpayment_cents
          - validations.priority_94_ERR_NOTHING_TO_ALLOCATE
        distinguishing_aspect: |
          A single 120000-cent posting drains all three buckets: it allocates 89900 principal +
          23976 premium, satisfies all 24 installments and records the 6124-cent remainder as
          overpayment_cents (never auto-refunded, never applied as principal), leaving
          obligation 0 with the loan still ACTIVE. The very next 1000-cent posting has no
          eligible installment left and returns HTTP 422 ERR_NOTHING_TO_ALLOCATE.
        test_recipe:
          setup:
            - "Handset B loan originated 2026-08-01 with no payments (total obligation 113876)."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
