# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3177_independent_dealer_territory_parts_commitments_rebuild_programs
#
# Depth probe: one block per §0.5 Difficulty Rule, each carrying >= 2 instances.
# Every instance grounds in §1.1–§1.6 and drives empty-DB to its precondition
# through §1.5 endpoint calls only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: stocking_mandate_active_ceiling_vs_final_floor_variant
        grounds:
          - calculations.required_stocking_units
          - calculations.tier_weighted_machine_population
          - entities.PartsCommitment.fields.required_stocking_units_final
          - endpoints.POST_/dealer-network/parts-commitments
        distinguishing_aspect: "The two stocking variants sit on the PartsCommitment domain and diverge on identical inputs: the active variant ceilings each term and the final variant floors each term, so required_stocking_units == 64 and required_stocking_units_final == 63 for machine_population_units 500, planned_annual_units 50000 and a 24-hour STANDARD fill window whose rate term is 63.5 and planned term is 62.5."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Dealer T-220 with one EXCLUSIVE EXCAVATION agreement, two DEALER_MASTER technicians and a commitment whose tier-weighted numerator is 500."
          setup_api_calls:
            - &c_clock
              call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DealerNetworkManager
            - &c_dealer
              call: "POST /dealer-network/dealers"
              payload: { legal_name: "Prairie Ironworks LLC", home_state_code: "TX", territory_code: "T-220" }
              as: DealerNetworkManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - &c_agree
              call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", territory_code: "T-220", exclusivity_level: "EXCLUSIVE", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 20, expected_dealer_version: "${d_v}" }
              as: DealerNetworkManager
              captures: { ag_id: $.data.id }
            - &c_cert1
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-01", product_family: "EXCAVATION", credential_code: "DEALER_MASTER", certified_at: "2026-08-01T00:00:00Z" }
              as: PartsManager
            - &c_cert2
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-02", product_family: "EXCAVATION", credential_code: "DEALER_MASTER", certified_at: "2026-08-01T00:00:00Z" }
              as: PartsManager
            - &c_read_dealer
              call: "GET /dealer-network/dealers/${d_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { d_v2: $.data.version }
            - &c_commit
              call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EXCAVATION", machine_population_units: 500, machine_population_slope: 1.0, planned_annual_units: 50000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_id}/submit"
              payload: {}
              as: PartsManager
              captures: { cm_v: $.data.version }
          assert:
            - "PartsCommitment.${cm_id}.machine_population_tier == MEDIUM"
            - "PartsCommitment.${cm_id}.required_stocking_units == 64"
            - "PartsCommitment.${cm_id}.required_stocking_units_final == 63"
            - "required_stocking_units_final <= required_stocking_units holds on the response"
            - "PartsCommitment.${cm_id}.required_stocking_units != 63 and required_stocking_units_final != 64"

      - name: performance_ratio_reported_basis_vs_uncapped_plan_basis
        grounds:
          - calculations.performance_evaluation
          - entities.PerformanceReview.fields.performance_ratio_pct
          - entities.PerformanceReview.fields.actual_market_share_pct
          - endpoints.POST_/dealer-network/performance-reviews/{id}/evaluate
        distinguishing_aspect: "The two ratio variants sit on the PerformanceReview domain: with a reported share of 120 and a plan of 20 the reported-share basis saturates at 100.0 while the uncapped plan-normalized basis yields 600.0, so the served performance_ratio_pct is 100.0 and never 600.0."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 dealer with an ACTIVE EXCAVATION agreement on a 20 percent plan."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - &c_submit
              call: "POST /dealer-network/parts-commitments/${cm_id}/submit"
              payload: {}
              as: PartsManager
            - &c_ready
              call: "POST /dealer-network/parts-commitments/${cm_id}/ready-for-orders"
              payload: {}
              as: PartsManager
            - &c_read_agree
              call: "GET /dealer-network/dealer-agreements/${ag_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { ag_a: $.data.version }
            - &c_activate
              call: "POST /dealer-network/dealer-agreements/${ag_id}/activate"
              payload: {}
              as: DealerNetworkManager
            - &c_read_agree2
              call: "GET /dealer-network/dealer-agreements/${ag_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { ag_b: $.data.version }
            - &c_review_over
              call: "POST /dealer-network/performance-reviews"
              payload: { dealer_id: "${d_id}", agreement_id: "${ag_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", actual_territory_machine_units: 120, territory_market_machine_units: 100, sampled_service_orders: 10, met_sla_service_orders: 10, expected_dealeragreement_version: "${ag_b}" }
              as: DealerPerformanceReviewer
              captures: { rv_over: $.data.id }
          trigger:
            - call: "POST /dealer-network/performance-reviews/${rv_over}/evaluate"
              payload: {}
              as: DealerPerformanceReviewer
          assert:
            - "PerformanceReview.${rv_over}.actual_market_share_pct == 120.0000"
            - "PerformanceReview.${rv_over}.performance_ratio_pct == 100.0"
            - "PerformanceReview.${rv_over}.performance_ratio_pct != 600.0"
            - "PerformanceReview.${rv_over}.loyalty_score == 103.0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: stocking_mandate_nested_max_ceiling_composition
        grounds:
          - calculations.required_stocking_units
          - calculations.tier_weighted_machine_population
          - calculations.availability_target_pct
          - entities.PartsCommitment.fields.machine_population_tier
        distinguishing_aspect: "Mode (a) of the rule: the mandate composes three inputs through a nested max-of-ceilings selection over the tier-weighted numerator with a rate chosen by the fill-window band, so 500 machines on a 24-hour STANDARD window give rate 0.127 and terms 63.5 and 62.5, and the mandate is 64 from max(ceil(63.5), ceil(62.5)) rather than either single term."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. T-220 dealer with agreement, technicians and a commitment at machine_population_units 500, planned_annual_units 50000, target 50, window 24."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_id}/submit"
              payload: {}
              as: PartsManager
          assert:
            - "PartsCommitment.${cm_id}.machine_population_tier == MEDIUM"
            - "PartsCommitment.${cm_id}.required_stocking_units == 64"
            - "PartsCommitment.${cm_id}.availability_target_pct == 92.0"
            - "the active variant is max(ceil(500 * 0.127), ceil(50000 / 800)) == max(ceil(63.5), ceil(62.5)) == 64"

      - name: forecast_parts_demand_per_record_ceiling_vs_sum_then_ceiling
        grounds:
          - calculations.forecast_parts_demand_units
          - calculations.weight_class_tier_multiplier
          - endpoints.GET_/dealer-network/machine-population-records/forecast
          - entities.MachinePopulationRecord.fields.projected_annual_parts_units
        distinguishing_aspect: "Mode (b) of the rule: nested rounding order is pinned — each of the five population records is ceiling-rounds to a whole unit and the results are then summed, giving 42, 42, 42, 42 and 42 for a total of 210, where summing the exact products first and rounding once gives 208."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A T-220 dealer with a premium-covered machine, a plus-covered machine and three uncovered machines of 30000, 50000 and 120000 lb in EXCAVATION, EARTHMOVING and COMPACTION."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - &c_pop_lift
              call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "LIFT_TRUCK", machine_serial: "SN-3001", machine_operating_weight_lb: 30000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_lift: $.data.id }
            - &c_pop_exc
              call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-3002", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_exc: $.data.id }
            - &c_pop_earth
              call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "EARTHMOVING", machine_serial: "SN-3003", machine_operating_weight_lb: 120000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_earth: $.data.id }
            - &c_pop_comp1
              call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "COMPACTION", machine_serial: "SN-3004", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_comp1: $.data.id }
            - &c_pop_comp2
              call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "COMPACTION", machine_serial: "SN-3005", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
              captures: { pop_comp2: $.data.id }
            - &c_sup_premium
              call: "POST /dealer-network/support-agreements"
              payload: { dealer_id: "${d_id}", machine_serial: "SN-3001", plan_tier: "PREMIUM", enrolled_at: "2026-08-15T00:00:00Z" }
              as: PartsManager
            - &c_sup_plus
              call: "POST /dealer-network/support-agreements"
              payload: { dealer_id: "${d_id}", machine_serial: "SN-3002", plan_tier: "PLUS", enrolled_at: "2026-08-15T00:00:00Z" }
              as: PartsManager
          trigger:
            - call: "GET /dealer-network/machine-population-records/forecast"
              payload: { dealer_id: "${d_id}" }
              as: PartsManager
          assert:
            - "response data forecast_parts_demand_units == 210"
            - "response data per_record_total == 210 and response data sum_then_ceiling_total == 208"
            - "MachinePopulationRecord.${pop_lift}.projected_annual_parts_units == 42"
            - "MachinePopulationRecord.${pop_exc}.projected_annual_parts_units == 42"
            - "MachinePopulationRecord.${pop_comp1}.projected_annual_parts_units == 42"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: parts_commitment_cycle_over_order_ready_core_pending_performance_deficient
        grounds:
          - state_machines.PartsCommitment.ORDER_READY_to_CORE_PENDING
          - state_machines.PartsCommitment.CORE_PENDING_to_ORDER_READY
          - state_machines.PartsCommitment.ORDER_READY_to_PERFORMANCE_DEFICIENT
          - state_machines.PartsCommitment.PERFORMANCE_DEFICIENT_to_ORDER_READY
          - endpoints.POST_/dealer-network/parts-commitments/{id}/suspend-core-credit
        distinguishing_aspect: "A cyclic machine on PartsCommitment: ORDER_READY returns to itself through two distinct circular routes — ORDER_READY to CORE_PENDING to ORDER_READY, and ORDER_READY to PERFORMANCE_DEFICIENT to ORDER_READY — so the entity is not a forward-only pipeline and both loops are independently traversable in one run."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is ORDER_READY with a zero credit balance and no open batch."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_id}/suspend-core-credit"
              payload: {}
              as: PartsManager
            - call: "POST /dealer-network/parts-commitments/${cm_id}/settle-core-credit"
              payload: { credit_settlement_cents: 0 }
              as: PartsManager
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/mark-underperforming"
              payload: {}
              as: DealerPerformanceReviewer
            - call: "POST /dealer-network/parts-commitments/${cm_id}/reinstate"
              payload: {}
              as: PartsManager
          assert:
            - "after the first two calls GET /dealer-network/parts-commitments/${cm_id} reports status == ORDER_READY and credit_balance_cents == 6200"
            - "after mark-underperforming PartsCommitment.${cm_id}.status == PERFORMANCE_DEFICIENT"
            - "after reinstate PartsCommitment.${cm_id}.status == ORDER_READY"
            - "the commitment returned to ORDER_READY twice in one run without ever passing through COMPLETE"

      - name: service_order_cyclic_raise_and_lower_within_open
        grounds:
          - state_machines.ServiceOrder.OPEN_to_OPEN
          - state_machines.ServiceOrder.OPEN_to_IN_PROGRESS
          - state_machines.ServiceOrder.IN_PROGRESS_to_OPEN
          - state_machines.ServiceOrder.OPEN_to_RESOLVED
          - endpoints.POST_/dealer-network/service-orders/{id}/raise-restriction
        distinguishing_aspect: "A second non-linear machine on a different entity: ServiceOrder holds self-loop cycles on both OPEN and IN_PROGRESS through raise-restriction and lower-restriction, plus a genuine backtrack cycle IN_PROGRESS to OPEN through reopen, so the order revisits states it has already occupied."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is ORDER_READY with risk-bearing service orders."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
            - &c_svc
              call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "EMERGENCY_FILL", product_family: "EXCAVATION", orderable_ref_enabled: false, restriction_scope: "HOURS_SPENT", sla_hours: 6.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /dealer-network/service-orders/${so_id}/begin"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/service-orders/${so_id}/raise-restriction"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/service-orders/${so_id}/lower-restriction"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/service-orders/${so_id}/reopen"
              payload: {}
              as: ServiceTechnicianSupervisor
          assert:
            - "after begin ServiceOrder.${so_id}.status == IN_PROGRESS"
            - "after raise-restriction ServiceOrder.${so_id}.status == IN_PROGRESS and restriction_scope == METER_RUNNING and risk_score == 32"
            - "after lower-restriction ServiceOrder.${so_id}.restriction_scope == HOURS_SPENT and risk_score == 22"
            - "after reopen ServiceOrder.${so_id}.status == OPEN"
            - "the order occupied OPEN twice and IN_PROGRESS twice in one run"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: restriction_order_escalation_cascades_three_hops_to_dealer_backorders
        grounds:
          - state_machines.ServiceOrder.IN_PROGRESS_to_ESCALATED
          - state_machines.PartsCommitment.ORDER_READY_to_PERFORMANCE_DEFICIENT
          - calculations.default_deferred_shortage_rule
          - entities.Dealer.fields.open_backorder_units
          - endpoints.POST_/dealer-network/service-orders/{id}/escalate
        distinguishing_aspect: "A depth-3 chain from a different trigger than the agreement suspension: escalating a ServiceOrder moves the ServiceOrder to ESCALATED, which itself drives the PartsCommitment to PERFORMANCE_DEFICIENT, which itself recomputes Dealer.open_backorder_units — each hop caused by the previous hop, not by the original call."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is ORDER_READY with one non-orderable emergency fill order in IN_PROGRESS."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
            - *c_svc
            - call: "POST /dealer-network/service-orders/${so_id}/begin"
              payload: {}
              as: ServiceTechnicianSupervisor
          trigger:
            - call: "POST /dealer-network/service-orders/${so_id}/escalate"
              payload: {}
              as: ServiceTechnicianSupervisor
          assert:
            - "ServiceOrder.${so_id}.status == ESCALATED"
            - "GET /dealer-network/parts-commitments/${cm_id} reports status == PERFORMANCE_DEFICIENT"
            - "GET /dealer-network/parts-commitments/${cm_id} reports a non-null backorder_opened_at"
            - "Dealer.${d_id}.open_backorder_units == 0"
            - "the open_backorder_units recompute is a consequence of the commitment mutation, not of the escalate call directly"

      - name: core_return_restriction_cascades_two_hops_to_support_coverage
        grounds:
          - state_machines.RebuildClaim.APPROVED_to_CORE_PENDING
          - state_machines.PartsCommitment.ORDER_READY_to_CORE_PENDING
          - state_machines.SupportAgreement.ACTIVE_to_SUSPENDED
          - entities.MachinePopulationRecord.fields.coverage_multiplier
          - endpoints.POST_/dealer-network/support-agreements/{id}/suspend
        distinguishing_aspect: "A depth-2 chain from a different triggering transition, rooted in the rebuild programme rather than the service bench: suspending a SupportAgreement mutates MachinePopulationRecord.coverage_multiplier for the covered serial, and that mutation then re-derives PartsCommitment.required_stocking_units for the dealer's family."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is ORDER_READY and the machine SN-3001 is covered by an ACTIVE PREMIUM support agreement."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
            - call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-3001", machine_operating_weight_lb: 50000, meter_hours: 1000 }
              as: PartsManager
            - call: "POST /dealer-network/support-agreements"
              payload: { dealer_id: "${d_id}", machine_serial: "SN-3001", plan_tier: "PREMIUM", enrolled_at: "2026-08-15T00:00:00Z" }
              as: PartsManager
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /dealer-network/support-agreements/${sup_id}/suspend"
              payload: {}
              as: PartsManager
          assert:
            - "SupportAgreement.${sup_id}.status == SUSPENDED"
            - "the MachinePopulationRecord for SN-3001 reports coverage_multiplier == 1.0"
            - "GET /dealer-network/parts-commitments/${cm_id} reports available_commitment_units == 250"
            - "the stocking mandate recompute is a consequence of the coverage mutation, not of the suspend call directly"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: invalid_state_outranks_stocking_mandate_hard_cap
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
          - errors.ERR_STOCKING_MANDATE_HARD_CAP
          - endpoints.POST_/dealer-network/parts-commitments/{id}/settle-core-credit
        distinguishing_aspect: "A state-versus-business_constraint priority conflict: a settlement on a commitment that is already ORDER_READY (priority 5) AND whose settlement figure reaches the mandate threshold (priority 7) answers ERR_INVALID_STATE, not ERR_STOCKING_MANDATE_HARD_CAP, because priority 5 is checked first."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment sits in ORDER_READY with required_stocking_units_final 63."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_id}/settle-core-credit"
              payload: { credit_settlement_cents: 6200 }
              as: PartsManager
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_STOCKING_MANDATE_HARD_CAP"
            - "PartsCommitment.${cm_id}.status is still ORDER_READY"
            - "GET /dealer-network/parts-commitments/${cm_id} reports credit_balance_cents == 0"

      - name: rebuild_spec_safety_outranks_machine_not_in_population_referential
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors.ERR_REBUILD_SPEC_EXCEEDED
          - errors.ERR_MACHINE_NOT_IN_POPULATION
          - endpoints.POST_/dealer-network/rebuild-claims/{id}/approve
        distinguishing_aspect: "A business_safety-versus-business_referential priority conflict: an approval whose machine exceeds the D3 specification weight limit (priority 6) AND whose serial is absent from the dealer's live population (priority 9) answers ERR_REBUILD_SPEC_EXCEEDED, not ERR_MACHINE_NOT_IN_POPULATION."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is PERFORMANCE_DEFICIENT so the dealer holds repair priority, and the machine serial is absent from the live population."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
            - *c_svc
            - call: "POST /dealer-network/service-orders/${so_id}/begin"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/service-orders/${so_id}/escalate"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/rebuild-claims"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-7001", machine_operating_weight_lb: 130000, client_meter_hours: 4000, requested_at: "2026-08-20T00:00:00Z", core_purchase_value_cents: 4000000, rebuild_labor_hours: 10.0, rebuild_labor_rate_cents: 14000, certified_rebuild_spec_code: "CAT_CERTIFIED_3" }
              as: RebuildProgramSpecialist
              captures: { rc_id: $.data.id, rc_v: $.data.version }
          trigger:
            - call: "POST /dealer-network/rebuild-claims/${rc_id}/approve"
              payload: { expected_rebuildclaim_version: "${rc_v}" }
              as: RebuildProgramSpecialist
              captures: { e2: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_REBUILD_SPEC_EXCEEDED"
            - "error_id != ERR_MACHINE_NOT_IN_POPULATION"
            - "RebuildClaim.${rc_id}.status is still REQUESTED"
            - "RebuildClaim.${rc_id}.rebuild_fee_cents is null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: stocking_mandate_rate_band_boundary_at_exactly_twenty_four_hours
        grounds:
          - calculations.required_stocking_units
          - calculations.weight_class_tier_multiplier
          - endpoints.POST_/dealer-network/parts-commitments/{id}/submit
          - validations[priority=7]
        distinguishing_aspect: "A numeric threshold crossing on the PartsCommitment domain: the 0.127 STANDARD rate applies while emergency_fill_window_hours is <= 24, so a window of exactly 24 selects 0.127 and a window of 24.5 drops to the 0.101 BASIC rate; separately the weight band is inclusive at both 40000 and 100000 lb, so 100001 lb moves to the 1.2 multiplier while 100000 lb stays at 1.0."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. T-220 dealer with agreement and technicians; two commitments are created with windows of exactly 24 and 24.5."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - &c_commit_24
              call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EXCAVATION", machine_population_units: 80, machine_population_slope: 1.0, planned_annual_units: 1000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24, expected_dealer_version: "${d_v2}" }
              as: PartsManager
              captures: { cm24: $.data.id }
            - &c_pop_edge
              call: "POST /dealer-network/machine-population-records"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", machine_serial: "SN-4001", machine_operating_weight_lb: 100001, meter_hours: 500 }
              as: PartsManager
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm24}/submit"
              payload: {}
              as: PartsManager
              captures: { cm24_v: $.data.version }
            - call: "GET /dealer-network/dealers/${d_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { d_v3: $.data.version }
            - call: "POST /dealer-network/parts-commitments"
              payload: { agreement_id: "${ag_id}", dealer_id: "${d_id}", product_family: "EXCAVATION", machine_population_units: 80, machine_population_slope: 1.0, planned_annual_units: 1000, emergency_stocking_target_pct: 50, emergency_fill_window_hours: 24.5, expected_dealer_version: "${d_v3}" }
              as: PartsManager
              captures: { cm245: $.data.id }
            - call: "POST /dealer-network/parts-commitments/${cm245}/submit"
              payload: {}
              as: PartsManager
          assert:
            - "PartsCommitment.${cm24}.required_stocking_units == 11"
            - "PartsCommitment.${cm245}.required_stocking_units == 9"
            - "MachinePopulationRecord.${pop_edge}.weight_class_tier == HEAVY"
            - "MachinePopulationRecord.${pop_edge}.projected_annual_parts_units == 48"
            - "the 24-hour commitment reads 11 from ceil(80 * 0.127) while the 24.5-hour commitment reads 9 from ceil(80 * 0.101)"

      - name: reconstruct_batch_and_empty_pool_boundaries_on_restriction_scoring
        grounds:
          - calculations.emergency_fill_resolution
          - calculations.restriction_deferral_tier
          - errors.ERR_COMMITMENT_EMPTY
          - endpoints.POST_/dealer-network/parts-order-batches
        distinguishing_aspect: "An empty-collection and zero-count boundary trio on a different metric: the restriction ordering list is empty exactly when the population holds no such machines, so deferral_tier is 0; a gross_filled_units sum of exactly 0.0 makes the non-orderable fill 0 while a sum of exactly 8.0 still uses denom 2 and gives 4; and a zero outstanding batch converts requested 5 into reserved 0 with ERR_COMMITMENT_EMPTY."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is ORDER_READY with required_stocking_units_final 63, no batches and no population."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
            - &c_svc_empty
              call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "RESTRICTION", product_family: "EXCAVATION", machine_serial: "SN-9001", restriction_scope: "HOURS_SPENT", sla_hours: 0.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_empty: $.data.id }
            - &c_svc_ov
              call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "EMERGENCY_FILL", product_family: "EXCAVATION", orderable_ref_enabled: false, restriction_scope: "HOURS_SPENT", sla_hours: 4.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_ov: $.data.id }
            - &c_svc_half
              call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "EMERGENCY_FILL", product_family: "EXCAVATION", orderable_ref_enabled: false, restriction_scope: "HOURS_SPENT", sla_hours: 4.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_half: $.data.id }
          trigger:
            - call: "POST /dealer-network/service-orders/${so_ov}/begin"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/service-orders/${so_ov}/record-emergency-fill"
              payload: {}
              as: ServiceTechnicianSupervisor
              captures: { so_ov_data: $.data.emergency_filled_units }
            - call: "POST /dealer-network/service-orders/${so_half}/begin"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/service-orders/${so_half}/record-emergency-fill"
              payload: {}
              as: ServiceTechnicianSupervisor
              captures: { so_half_data: $.data.emergency_filled_units }
          assert:
            - "GET /dealer-network/service-orders/${so_empty} reports deferral_tier == 0 because the ordering target list is empty"
            - "the first fill reports emergency_filled_units == 2, from ceil(8.0 / 2) with denom 2"
            - "the second fill reports emergency_filled_units == 3, from ceil(12.0 / 4) with denom 4"
            - "after POST /dealer-network/parts-order-batches with requested_units 5 against a fully committed third commitment, the response is 409 with error_id == ERR_COMMITMENT_EMPTY and reserved_units == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: parts_commitment_tier_depends_on_agreement_activation_state
        grounds:
          - state_machines.PartsCommitment.PLANNED_to_SUBMITTED
          - state_machines.DealerAgreement.SUBMITTED_to_ACTIVE
          - entities.Dealer.fields.trusted_commitment_count
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "An agreement-to-commitment state dependency: POST /parts-commitments/{id}/submit succeeds only while the owning DealerAgreement is SUBMITTED or ACTIVE, so the identical call is a 409 ERR_INVALID_STATE before the agreement is submitted and a 200 after — a different entity pair than the commitment-to-dealer one below."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. T-220 dealer with a DRAFT agreement, two technicians and a PLANNED commitment."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_id}/submit"
              payload: {}
              as: PartsManager
              captures: { e_blocked: $.data.error_id }
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/submit"
              payload: {}
              as: DealerNetworkManager
            - call: "POST /dealer-network/parts-commitments/${cm_id}/submit"
              payload: {}
              as: PartsManager
          assert:
            - "the first submit returns 409 with error_id == ERR_INVALID_STATE"
            - "Dealer.${d_id}.trusted_commitment_count == 0 after the blocked submit"
            - "the second submit returns 200 and PartsCommitment.${cm_id}.status == SUBMITTED"
            - "the blocked attempt left PartsCommitment.${cm_id}.required_stocking_units computed but the status unchanged"

      - name: commitment_ready_for_orders_depends_on_dealer_trusted_state
        grounds:
          - state_machines.PartsCommitment.SUBMITTED_to_ORDER_READY
          - state_machines.Dealer.PENDING_AGREEMENT_to_ACTIVE
          - entities.Dealer.fields.status
          - entities.PartsCommitment.fields.status
        distinguishing_aspect: "A commitment-to-dealer state dependency on a different entity pair: ORDER_READY flips the owning agreement's trusted flag which drives Dealer.status to ACTIVE, and a later agreement TERMINATE that suspends every commitment moves the dealer back out of ACTIVE — the commitment's own transitions are gated by the dealer's derived state."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 agreement is SUBMITTED, the commitment SUBMITTED, the dealer still PENDING_AGREEMENT."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/submit"
              payload: {}
              as: DealerNetworkManager
          trigger:
            - call: "POST /dealer-network/parts-commitments/${cm_id}/ready-for-orders"
              payload: {}
              as: PartsManager
            - call: "POST /dealer-network/parts-commitments/${cm_id}/suspend"
              payload: {}
              as: PartsManager
          assert:
            - "Dealer.${d_id}.status == PENDING_AGREEMENT before ready-for-orders"
            - "after ready-for-orders PartsCommitment.${cm_id}.status == ORDER_READY and Dealer.${d_id}.status == ACTIVE"
            - "after suspend PartsCommitment.${cm_id}.status == SUSPENDED and Dealer.${d_id}.status == SUSPENDED"
            - "Dealer.${d_id}.trusted_commitment_count == 0 once the commitment has left ORDER_READY"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exclusive_territory_interval_overlap_half_open_back_to_back
        grounds:
          - state_machines.DealerAgreement.DRAFT_to_SUBMITTED
          - errors.ERR_TERRITORY_OVERLAP
          - entities.DealerAgreement.fields.end_at
          - endpoints.POST_/dealer-network/dealer-agreements/{id}/submit
        distinguishing_aspect: "Half-open interval semantics on DealerAgreement: two EXCLUSIVE intervals abut at a single instant and do not collide, so [A, B) followed by [B, C) is accepted, while a third interval starting one second before B is refused with ERR_TERRITORY_OVERLAP — adjacency at the exclusive edge is the whole test."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. T-220 dealer with two EXCLUSIVE EXCAVATION agreement drafts on adjacent intervals."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - &c_agree_adj
              call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", territory_code: "T-220", exclusivity_level: "EXCLUSIVE", start_at: "2027-09-01T00:00:00Z", end_at: "2028-09-01T00:00:00Z", performance_plan_share_pct: 20, expected_dealer_version: "${d_v}" }
              as: DealerNetworkManager
              captures: { ag_adj: $.data.id }
            - *c_cert1
            - *c_cert2
          trigger:
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/submit"
              payload: {}
              as: DealerNetworkManager
            - call: "POST /dealer-network/dealer-agreements/${ag_adj}/submit"
              payload: {}
              as: DealerNetworkManager
            - call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EXCAVATION", territory_code: "T-220", exclusivity_level: "EXCLUSIVE", start_at: "2028-08-31T23:59:59Z", end_at: "2029-09-01T00:00:00Z", performance_plan_share_pct: 20, expected_dealer_version: "${d_v}" }
              as: DealerNetworkManager
              captures: { ag_bad: $.data.id }
            - call: "POST /dealer-network/dealer-agreements/${ag_bad}/submit"
              payload: {}
              as: DealerNetworkManager
              captures: { e_overlap: $.data.error_id }
          assert:
            - "the first two submits both return 200 with status SUBMITTED"
            - "the third submit returns 409 with error_id == ERR_TERRITORY_OVERLAP"
            - "DealerAgreement.${ag_bad}.status is still DRAFT"
            - "the abutment at 2028-09-01T00:00:00Z is not treated as a collision"

      - name: certified_credential_recurrence_buffer_semantics
        grounds:
          - entities.CertificationRecord.fields.recurrence_within_period
          - entities.CertificationRecord.fields.status
          - endpoints.POST_/dealer-network/certification-records
          - errors.ERR_TOOLING_INCOMPLETE
        distinguishing_aspect: "Buffer semantics on a different resource entity: a credential's validity window is [certified_at, certified_at + 12 months) and a recurrence strictly inside that window keeps the earlier record ACTIVE at the boundary instant, while a recurrence starting exactly 12 months later leaves the earlier record EXPIRED — the buffer is the open edge of the window."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. T-220 dealer with no credentials."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - &c_cert_edge
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-09", product_family: "EXCAVATION", credential_code: "DEALER_CERTIFIED", certified_at: "2024-09-01T00:00:00Z" }
              as: PartsManager
              captures: { cr_edge: $.data.id }
            - &c_cert_recur
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-09", product_family: "EXCAVATION", credential_code: "DEALER_CERTIFIED", certified_at: "2025-08-31T23:59:59Z" }
              as: PartsManager
              captures: { cr_recur: $.data.id }
            - &c_cert_late
              call: "POST /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-08", product_family: "EXCAVATION", credential_code: "DEALER_CERTIFIED", certified_at: "2024-09-01T00:00:00Z" }
              as: PartsManager
              captures: { cr_late: $.data.id }
          trigger:
            - call: "GET /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-09" }
              as: PartsManager
            - call: "GET /dealer-network/certification-records"
              payload: { dealer_id: "${d_id}", technician_name: "T-08" }
              as: PartsManager
          assert:
            - "CertificationRecord.${cr_edge}.recurrence_within_period == true and its status == ACTIVE on 2026-09-01"
            - "CertificationRecord.${cr_late}.recurrence_within_period == false and its status == EXPIRED on 2026-09-01"
            - "a recurrence starting exactly 12 months after certified_at does not extend the earlier record"
            - "the T-09 credential is still counted in GET /dealer-network/certification-records?status=ACTIVE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: core_credit_balance_round_trip_leaves_credit_unchanged
        grounds:
          - state_machines.PartsOrderBatch.CORE_PENDING_to_RECEIVED
          - state_machines.PartsOrderBatch.RECEIVED_to_CORE_PENDING
          - endpoints.POST_/dealer-network/parts-order-batches/{id}/cancel-core-return
          - calculations.certified_core_credit
        distinguishing_aspect: "The conserved quantity is money: PartsCommitment.credit_balance_cents after a core-return followed by its cancel-core-return equals the balance before the pair, and because the batch carries exactly one core the settlement adds 1610 in the forward leg and the compensating leg removes exactly that 1610 rather than a re-derived figure."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is ORDER_READY with a RECEIVED batch of 10 units carrying core return, and a zero credit balance."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
            - &c_batch
              call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 1, core_return_required: false, requested_at: "2026-08-25T00:00:00Z" }
              as: PartsManager
              captures: { bt_id: $.data.id }
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/place-order"
              payload: {}
              as: PartsManager
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/receive"
              payload: { ordered_ref: "OEM-ORD-7001" }
              as: PartsManager
            - &c_read_cm
              call: "GET /dealer-network/parts-commitments/${cm_id}"
              payload: {}
              as: PartsManager
              captures: { credit_before: $.data.credit_balance_cents }
          trigger:
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/core-return"
              payload: { core_units: 1 }
              as: PartsManager
            - call: "GET /dealer-network/parts-commitments/${cm_id}"
              payload: {}
              as: PartsManager
              captures: { credit_mid: $.data.credit_balance_cents }
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/cancel-core-return"
              payload: {}
              as: PartsManager
            - call: "GET /dealer-network/parts-commitments/${cm_id}"
              payload: {}
              as: PartsManager
              captures: { credit_after: $.data.credit_balance_cents }
          assert:
            - "PartsCommitment.${cm_id}.credit_balance_cents before the pair == 0"
            - "during the pair the balance reads credit_mid == 1610"
            - "after the pair the balance reads credit_after == 0, equal to the balance before"
            - "the compensating leg removes exactly the 1610 the forward leg added, drawn from the same core_purchase_value_cents 10000 pair and not from a re-derived figure"

      - name: batch_receipt_replay_leaves_units_and_credit_unchanged
        grounds:
          - state_machines.PartsOrderBatch.ORDERED_to_RECEIVED
          - state_machines.ServiceOrder.FILLED_to_RESOLVED
          - endpoints.POST_/dealer-network/parts-order-batches/{id}/receive
          - entities.PartsCommitment.fields.credited_settlement_units_increment
        distinguishing_aspect: "The conserved quantity is quantity plus money on a different pairing: the receipt credits 10 cores at 1610 each for 16100, and replaying the identical receipt leaves PartsCommitment.fulfilled_units and credit_balance_cents exactly as the first receipt left them while ServiceOrder.resolved_at keeps its first stamp, so the second identical request is a no-op rather than a second credit."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. The T-220 commitment is ORDER_READY with an ORDERED batch of 10 units that already has a FILLED order attached."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_agree
            - *c_cert1
            - *c_cert2
            - *c_read_dealer
            - *c_commit
            - *c_submit
            - *c_ready
            - &c_batch_rep
              call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 10, core_return_required: false, requested_at: "2026-08-25T00:00:00Z" }
              as: PartsManager
              captures: { bt_rep: $.data.id }
            - call: "POST /dealer-network/parts-order-batches/${bt_rep}/place-order"
              payload: {}
              as: PartsManager
            - &c_svc_rep
              call: "POST /dealer-network/service-orders"
              payload: { dealer_id: "${d_id}", commitment_id: "${cm_id}", kind: "EMERGENCY_FILL", product_family: "EXCAVATION", orderable_ref_enabled: true, restriction_scope: "HOURS_SPENT", sla_hours: 4.0 }
              as: ServiceTechnicianSupervisor
              captures: { so_rep: $.data.id }
            - call: "POST /dealer-network/service-orders/${so_rep}/begin"
              payload: {}
              as: ServiceTechnicianSupervisor
            - call: "POST /dealer-network/service-orders/${so_rep}/record-emergency-fill"
              payload: {}
              as: ServiceTechnicianSupervisor
          trigger:
            - call: "POST /dealer-network/parts-order-batches/${bt_rep}/receive"
              payload: { ordered_ref: "OEM-ORD-8001" }
              as: PartsManager
              captures: { fu_1: $.data.unfilled_units }
            - call: "POST /dealer-network/parts-order-batches/${bt_rep}/receive"
              payload: { ordered_ref: "OEM-ORD-8001" }
              as: PartsManager
              captures: { fu_2: $.data.unfilled_units }
            - call: "GET /dealer-network/parts-commitments/${cm_id}"
              payload: {}
              as: PartsManager
              captures: { fu_total: $.data.fulfilled_units, bal_total: $.data.credit_balance_cents }
            - call: "POST /dealer-network/service-orders/${so_rep}/resolve"
              payload: {}
              as: ServiceTechnicianSupervisor
              captures: { ra_1: $.data.resolved_at }
            - call: "POST /dealer-network/service-orders/${so_rep}/resolve"
              payload: {}
              as: ServiceTechnicianSupervisor
              captures: { ra_2: $.data.resolved_at }
          assert:
            - "the second receive reports the same unfilled_units value as the first, fu_1 == 0 and fu_2 == 0"
            - "the commitment reads fulfilled_units == 10 and credit_balance_cents == 16100 after both receipts"
            - "the second receive applies no second credit and no second consequence of the batch receipt"
            - "ServiceOrder.${so_rep}.resolved_at as captured on the second resolve equals ra_1, the first stamp"