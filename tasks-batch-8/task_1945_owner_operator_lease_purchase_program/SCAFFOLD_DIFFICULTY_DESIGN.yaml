  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activation_requires_operator_verified
        grounds:
          - state_machines.LeaseAgreement.APPLICATION_to_ACTIVE
          - state_machines.OwnerOperator.PENDING_REVIEW_to_VERIFIED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair LeaseAgreement -> OwnerOperator: activate is gated on the
          operator's derived classification_status (PENDING_REVIEW with 2 of 3 docs
          -> ERR_COMPLIANCE_REQUIREMENTS_UNMET; after the third verify -> VERIFIED
          -> activation succeeds).
        test_recipe:
          setup:
            - "Operator with W9 + OPERATING_AUTHORITY VERIFIED but INSURANCE_CERTIFICATE missing (classification PENDING_REVIEW)"
            - "Lease created (APPLICATION)"
          setup_api_calls:
