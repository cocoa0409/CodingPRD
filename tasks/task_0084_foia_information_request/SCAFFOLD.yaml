scenario: "FOIA Information Request: request intake, 9 exemptions, fee tiers (commercial/educational/public), response deadline, appeal, Glomar response, Reverse FOIA third-party denial"
domain_name: foia-information-request
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - rate_threshold_triggers          # fee free-allotment breakpoints + $250 advance-payment trigger
    - cascading_side_effects           # determination cascades into exemption records, third-party notices, deadline tolling
    - scheduled_actions                # working-day deadline clock with tolling windows + inspection bookings
    - optimistic_concurrency           # OCC on Request.version for determination issuance

  entity_topology: hybrid
  # FoiaRequest is the aggregate root; ResponsiveRecord, Exemption, FeeEstimate,
  # ProcessingDeadline are children. Appeal, ThirdPartyObjection cross-reference
  # the request and a record/submitter. AuditEvent is an append-only log child.

  state_machine_shape: branching
  # FoiaRequest: intake -> processing -> {GRANTED, PARTIALLY_GRANTED, DENIED,
  #   GLOMAR_INVOKED} with divergent side-effects per branch; Appeal cycles
  #   REMANDED -> request re-opens (cyclic across entities); ReverseFoiaObjection
  #   forks the disclosure path.

  relationship_patterns:
    - one_to_many          # FoiaRequest -> ResponsiveRecord, Exemption, AuditEvent
    - cross_aggregate      # Appeal -> FoiaRequest; ThirdPartyObjection -> ResponsiveRecord
    - polymorphic          # Exemption.applies_to_kind references RECORD or REQUEST (Glomar)

  role_model: segregation_of_duties
  # The FoiaOfficer who issues a determination cannot also adjudicate the appeal
  # of that same determination; appeals go to AppealAuthority. Requester and
  # Submitter are entity_backed external actors.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Name of the person or organization submitting requests"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across requesters"
        constraints: "unique, non-empty"
      - name: organization
        type: string
        source: input
        description: "Affiliated organization, if any"
        default: null
      - name: declared_category
        type: enum
        source: input
        description: "Self-declared fee category claimed at registration"
        constraints: "one of {COMMERCIAL, EDUCATIONAL, NEWS_MEDIA, OTHER}"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of FeeEstimate.assessed_fee_cents across this requester's FoiaRequests whose fee_payment_status == DUE, minus payments. Derived field reconciled on every fee assessment and payment."
        default: 0

  - name: FoiaOfficer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Name of the FOIA processing officer"
      - name: badge_id
        type: string
        source: input
        description: "Agency badge identifier; unique"
        constraints: "unique, non-empty"
      - name: can_invoke_glomar
        type: boolean
        source: input
        description: "Whether this officer is cleared to invoke Glomar responses on national-security/law-enforcement requests"
        default: false

  - name: AppealAuthority
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Name of the appellate adjudicator (agency Chief FOIA Officer designee)"
      - name: badge_id
        type: string
        source: input
        description: "Agency badge identifier; unique"
        constraints: "unique, non-empty"

  - name: Submitter
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Name of the third-party business that submitted records to the agency"
      - name: contact_email
        type: string
        source: input
        description: "Reverse-FOIA notice contact email; unique"
        constraints: "unique, non-empty"

  - name: FoiaRequest
    parent: null
    common_fields: true
    fields:
      - name: requester_id
        type: string
        source: input
        description: "FK -> Requester.id"
      - name: assigned_officer_id
        type: string
        source: system
        description: "FK -> FoiaOfficer.id; set when the request is assigned for processing"
        default: null
      - name: subject_description
        type: string
        source: input
        description: "Free-text description of the records sought"
        constraints: "non-empty"
      - name: fee_category
        type: enum
        source: system
        description: "Fee category the agency assigns at intake; may differ from Requester.declared_category if the officer recategorizes. One of {COMMERCIAL, EDUCATIONAL, NEWS_MEDIA, OTHER}"
      - name: expedited
        type: boolean
        source: input
        description: "Whether the requester invoked expedited processing (compelling need)"
        default: false
      - name: fee_waiver_requested
        type: boolean
        source: input
        description: "Whether a public-interest fee waiver was requested"
        default: false
      - name: fee_waiver_granted
        type: boolean
        source: system
        description: "Whether the agency granted the public-interest fee waiver"
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2"
        constraints: "one of {SUBMITTED, PERFECTED, PROCESSING, AWAITING_PAYMENT, GRANTED, PARTIALLY_GRANTED, DENIED, GLOMAR_INVOKED, WITHDRAWN}"
        default: SUBMITTED
      - name: deadline_status
        type: enum
        source: computed
        description: "Parallel deadline dimension independent of status; see §1.2. One of {RUNNING, TOLLED, EXTENDED, MET, MISSED}"
        default: RUNNING
      - name: glomar_exemption_basis
        type: enum
        source: system
        description: "Which exemption justifies the Glomar (neither confirm nor deny); set only on GLOMAR_INVOKED. One of {B1, B7}"
        default: null
      - name: fee_payment_status
        type: enum
        source: computed
        description: "Payment posture for this request's assessed fee. One of {NONE, DUE, PAID, WAIVED}"
        default: NONE
      - name: received_at
        type: datetime
        source: input
        description: "ISO 8601 UTC timestamp the agency logs as the receipt date; the working-day deadline clock anchors here"

  - name: ResponsiveRecord
    parent: FoiaRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id"
      - name: title
        type: string
        source: input
        description: "Short label for the located record"
      - name: page_count
        type: integer
        source: input
        description: "Number of pages in this record"
        constraints: ">= 1"
      - name: contains_submitter_info
        type: boolean
        source: input
        description: "Whether this record contains a third party's confidential business information (triggers Reverse FOIA notice)"
        default: false
      - name: submitter_id
        type: string
        source: input
        description: "FK -> Submitter.id; required when contains_submitter_info is true, else null"
        default: null
      - name: disposition
        type: enum
        source: system
        description: "Per-record outcome after review; see §1.2. One of {PENDING, RELEASABLE, REDACTED, WITHHELD}"
        default: PENDING

  - name: Exemption
    parent: FoiaRequest
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id"
      - name: record_id
        type: string
        source: input
        description: "FK -> ResponsiveRecord.id; null when applies_to_kind == REQUEST (Glomar applies to the existence question, not a record)"
        default: null
      - name: applies_to_kind
        type: enum
        source: input
        description: "Whether the exemption is asserted against a specific record or against the request itself (Glomar). One of {RECORD, REQUEST}"
      - name: exemption_code
        type: enum
        source: input
        description: "FOIA statutory exemption asserted. One of {B1, B2, B3, B4, B5, B6, B7, B8, B9}"
      - name: justification
        type: string
        source: input
        description: "Narrative basis for asserting this exemption"
        constraints: "non-empty"

  - name: FeeEstimate
    parent: FoiaRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id; one current FeeEstimate per request"
      - name: search_hours
        type: number
        source: input
        description: "Professional search time in hours (billed per quarter-hour)"
        constraints: ">= 0"
      - name: review_hours
        type: number
        source: input
        description: "Document review time in hours (commercial requests only)"
        constraints: ">= 0"
      - name: billable_pages
        type: integer
        source: input
        description: "Total pages eligible for duplication charges"
        constraints: ">= 0"
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: "Final assessed fee in cents; computed by the tiered fee calculation (§1.3 fee_assessment) keyed on the parent FoiaRequest.fee_category"
        default: 0
      - name: requires_advance_payment
        type: boolean
        source: computed
        description: "True when assessed_fee_cents > ADVANCE_PAYMENT_THRESHOLD_CENTS, which tolls the deadline pending payment"
        default: false

  - name: ProcessingDeadline
    parent: FoiaRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id; one ProcessingDeadline per request"
      - name: base_due_at
        type: datetime
        source: computed
        description: "received_at + 20 working days (skipping Sat/Sun), ISO 8601 UTC"
      - name: extension_days_added
        type: integer
        source: system
        description: "Working days added by a single unusual-circumstances extension (0 or 10)"
        default: 0
      - name: tolled_working_days
        type: integer
        source: computed
        description: "Cumulative working days the clock was paused (fee-clarification and advance-payment tolling windows)"
        default: 0
      - name: effective_due_at
        type: datetime
        source: computed
        description: "base_due_at + extension_days_added working days + tolled_working_days working days; the operative deadline (§1.3 deadline_projection)"

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id; the determination being appealed"
      - name: appellant_id
        type: string
        source: input
        description: "FK -> Requester.id; must equal the request's requester_id"
      - name: assigned_authority_id
        type: string
        source: system
        description: "FK -> AppealAuthority.id; set when the appeal is adjudicated"
        default: null
      - name: grounds
        type: string
        source: input
        description: "Narrative grounds for the appeal"
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle; see §1.2. One of {FILED, UNDER_REVIEW, AFFIRMED, REVERSED, REMANDED}"
        default: FILED
      - name: filed_at
        type: datetime
        source: input
        description: "ISO 8601 UTC timestamp the appeal was filed; must be within APPEAL_WINDOW_DAYS calendar days of the determination"

  - name: ThirdPartyObjection
    parent: null
    common_fields: true
    fields:
      - name: record_id
        type: string
        source: input
        description: "FK -> ResponsiveRecord.id; the record whose disclosure is objected to (Reverse FOIA)"
      - name: submitter_id
        type: string
        source: input
        description: "FK -> Submitter.id; must equal the record's submitter_id"
      - name: notice_sent_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp the agency sent the Reverse-FOIA notice"
      - name: objection_text
        type: string
        source: input
        description: "Submitter's stated basis (typically Exemption B4 confidential commercial info)"
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Objection lifecycle; see §1.2. One of {NOTICED, OBJECTED, SUSTAINED, OVERRULED, NO_RESPONSE}"
        default: NOTICED

  - name: ReadingRoom
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Reading-room label"
      - name: capacity
        type: integer
        source: input
        description: "Maximum simultaneous inspectors the room holds at any instant"
        constraints: ">= 1"

  - name: ReviewStation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Secure single-occupancy review terminal label"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Mandatory cleanup gap (minutes) that must separate consecutive bookings on this station"
        constraints: ">= 0"

  - name: ReadingRoomBooking
    parent: null
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: "FK -> ReadingRoom.id"
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id; the request whose released records are inspected"
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC inspection window start (half-open interval [starts_at, ends_at))"
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC inspection window end (exclusive)"
        constraints: "ends_at > starts_at"

  - name: ReviewStationBooking
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> ReviewStation.id"
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id; the request whose records the officer reviews at the station"
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC review window start (closed interval [starts_at, ends_at])"
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC review window end (inclusive)"
        constraints: "ends_at > starts_at"

  - name: AuditEvent
    parent: FoiaRequest
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> FoiaRequest.id"
      - name: event_type
        type: enum
        source: system
        description: "One of {SUBMITTED, PERFECTED, ASSIGNED, FEE_ASSESSED, EXTENDED, TOLLED, RESUMED, DETERMINATION, GLOMAR, APPEAL_FILED, APPEAL_DECIDED, REVERSE_NOTICE, REVERSE_DECIDED}"
      - name: detail
        type: string
        source: system
        description: "Human-readable summary of the event"
      - name: actor_role
        type: enum
        source: system
        description: "Role that triggered the event. One of {Requester, FoiaOfficer, AppealAuthority, Submitter, system}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- FoiaRequest: branching with appeal-driven cycle ----
  - entity: FoiaRequest
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: PERFECTED
        trigger: "POST /requests/{id}/perfect"
        actor: FoiaOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "subject_description is non-empty (request reasonably describes records)"
        side_effects:
          - "set fee_category := the value supplied by the officer (may differ from Requester.declared_category)"
          - "create the ProcessingDeadline child: base_due_at := received_at + 20 working days; effective_due_at recomputed (§1.3 deadline_projection)"
          - "set deadline_status := RUNNING"
          - "append AuditEvent(event_type=PERFECTED, actor_role=FoiaOfficer)"
        note: "Intake completeness gate; the 20-working-day clock formally starts here."

      - from: PERFECTED
        to: PROCESSING
        trigger: "POST /requests/{id}/assign"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PERFECTED"
        side_effects:
          - "set assigned_officer_id := the officer in X-User-ID"
          - "append AuditEvent(event_type=ASSIGNED, actor_role=FoiaOfficer)"

      - from: PROCESSING
        to: AWAITING_PAYMENT
        trigger: "POST /requests/{id}/fee-estimate"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PROCESSING"
          - "request.fee_waiver_granted == false"
          - "the resulting FeeEstimate.requires_advance_payment == true (assessed_fee_cents > ADVANCE_PAYMENT_THRESHOLD_CENTS)"
        side_effects:
          - "create/replace the FeeEstimate child and run §1.3 fee_assessment to set assessed_fee_cents"
          - "set requires_advance_payment := true; set fee_payment_status := DUE"
          - "recompute Requester.outstanding_balance_cents (§1.3 outstanding_balance_recompute)"
          - "set deadline_status := TOLLED and begin an advance-payment tolling window (§1.3 deadline_projection freezes effective_due_at)"
          - "append AuditEvent(event_type=FEE_ASSESSED), append AuditEvent(event_type=TOLLED)"
        note: "Fee estimate above the advance-payment threshold tolls the clock; sub-threshold estimates leave the request in PROCESSING (see fee-estimate-no-toll transition)."

      - from: PROCESSING
        to: PROCESSING
        trigger: "POST /requests/{id}/fee-estimate"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PROCESSING"
          - "the resulting FeeEstimate.requires_advance_payment == false (assessed_fee_cents <= ADVANCE_PAYMENT_THRESHOLD_CENTS) OR request.fee_waiver_granted == true"
        side_effects:
          - "create/replace the FeeEstimate child and run §1.3 fee_assessment"
          - "if fee_waiver_granted: set assessed_fee_cents := 0, fee_payment_status := WAIVED; else set fee_payment_status := DUE"
          - "recompute Requester.outstanding_balance_cents"
          - "append AuditEvent(event_type=FEE_ASSESSED); deadline_status unchanged (no tolling)"
        note: "Self-loop: a sub-threshold or waived fee estimate does not change status or toll the clock."

      - from: AWAITING_PAYMENT
        to: PROCESSING
        trigger: "POST /requests/{id}/payment"
        actor: Requester
        preconditions:
          - "request.status == AWAITING_PAYMENT"
          - "fee_payment_status == DUE"
        side_effects:
          - "set fee_payment_status := PAID"
          - "recompute Requester.outstanding_balance_cents"
          - "set deadline_status := RUNNING; close the advance-payment tolling window and add the elapsed working days to ProcessingDeadline.tolled_working_days (§1.3 deadline_projection)"
          - "append AuditEvent(event_type=RESUMED, actor_role=Requester)"

      - from: PROCESSING
        to: GRANTED
        trigger: "POST /requests/{id}/determination"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PROCESSING"
          - "request carries expected_request_version matching FoiaRequest.version (OCC)"
          - "every ResponsiveRecord.disposition == RELEASABLE"
          - "no record with contains_submitter_info == true is RELEASABLE while its ThirdPartyObjection.status is in {NOTICED, OBJECTED} (Reverse FOIA gate)"
        side_effects:
          - "increments FoiaRequest.version by 1"
          - "set deadline_status := MET if now <= ProcessingDeadline.effective_due_at else MISSED"
          - "append AuditEvent(event_type=DETERMINATION, detail='full grant')"

      - from: PROCESSING
        to: PARTIALLY_GRANTED
        trigger: "POST /requests/{id}/determination"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PROCESSING"
          - "request carries expected_request_version matching FoiaRequest.version (OCC)"
          - "at least one ResponsiveRecord.disposition == REDACTED or RELEASABLE AND at least one is REDACTED or WITHHELD"
          - "every REDACTED or WITHHELD record has >= 1 Exemption with applies_to_kind == RECORD citing that record_id"
          - "no record with contains_submitter_info == true is RELEASABLE while its ThirdPartyObjection.status is in {NOTICED, OBJECTED}"
        side_effects:
          - "increments FoiaRequest.version by 1"
          - "set deadline_status := MET if now <= effective_due_at else MISSED"
          - "append AuditEvent(event_type=DETERMINATION, detail='partial grant')"

      - from: PROCESSING
        to: DENIED
        trigger: "POST /requests/{id}/determination"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PROCESSING"
          - "request carries expected_request_version matching FoiaRequest.version (OCC)"
          - "every ResponsiveRecord.disposition == WITHHELD"
          - "every WITHHELD record has >= 1 Exemption with applies_to_kind == RECORD citing that record_id"
        side_effects:
          - "increments FoiaRequest.version by 1"
          - "set deadline_status := MET if now <= effective_due_at else MISSED"
          - "append AuditEvent(event_type=DETERMINATION, detail='full denial')"

      - from: PROCESSING
        to: GLOMAR_INVOKED
        trigger: "POST /requests/{id}/glomar"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PROCESSING"
          - "request carries expected_request_version matching FoiaRequest.version (OCC)"
          - "acting officer.can_invoke_glomar == true"
          - "exactly one Exemption exists with applies_to_kind == REQUEST and exemption_code in {B1, B7}"
          - "ResponsiveRecord count for this request == 0 (existence is neither confirmed nor denied)"
        side_effects:
          - "increments FoiaRequest.version by 1"
          - "set glomar_exemption_basis := the REQUEST-level exemption's code"
          - "set deadline_status := MET if now <= effective_due_at else MISSED"
          - "append AuditEvent(event_type=GLOMAR, actor_role=FoiaOfficer)"
        note: "Glomar: agency refuses to confirm or deny existence of records; no ResponsiveRecord may be logged."

      - from: PROCESSING
        to: PROCESSING
        trigger: "POST /requests/{id}/extend"
        actor: FoiaOfficer
        preconditions:
          - "request.status == PROCESSING"
          - "ProcessingDeadline.extension_days_added == 0 (only one extension allowed)"
        side_effects:
          - "set ProcessingDeadline.extension_days_added := 10; recompute effective_due_at (§1.3 deadline_projection)"
          - "set deadline_status := EXTENDED"
          - "append AuditEvent(event_type=EXTENDED, actor_role=FoiaOfficer)"
        note: "Single unusual-circumstances extension of 10 working days."

      - from: DENIED
        to: PROCESSING
        trigger: "system: Appeal transitions to REMANDED (cross-entity bubble)"
        actor: system
        preconditions:
          - "an Appeal for this request transitioned to REMANDED"
        side_effects:
          - "reset all ResponsiveRecord.disposition := PENDING for this request"
          - "set deadline_status := RUNNING"
          - "append AuditEvent(event_type=APPEAL_DECIDED, detail='remanded; reopened for reprocessing')"
        note: "Cyclic: a remand reopens a terminal-looking determination back into PROCESSING."

      - from: PARTIALLY_GRANTED
        to: PROCESSING
        trigger: "system: Appeal transitions to REMANDED (cross-entity bubble)"
        actor: system
        preconditions:
          - "an Appeal for this request transitioned to REMANDED"
        side_effects:
          - "reset all ResponsiveRecord.disposition := PENDING for this request"
          - "set deadline_status := RUNNING"
          - "append AuditEvent(event_type=APPEAL_DECIDED, detail='remanded; reopened for reprocessing')"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /requests/{id}/withdraw"
        actor: Requester
        preconditions:
          - "request.status in {SUBMITTED, PERFECTED, PROCESSING, AWAITING_PAYMENT}"
        side_effects:
          - "set deadline_status := MET (no further obligation)"
          - "append AuditEvent(event_type=DETERMINATION, detail='withdrawn by requester')"
        note: "Withdraw is reachable from any non-terminal pre-determination state; modeled as one transition with a state-set precondition."

  # ---- ResponsiveRecord: per-record disposition ----
  - entity: ResponsiveRecord
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: RELEASABLE
        trigger: "POST /records/{id}/review"
        actor: FoiaOfficer
        preconditions:
          - "parent FoiaRequest.status == PROCESSING"
          - "no Exemption cites this record_id with applies_to_kind == RECORD"
        side_effects:
          - "set disposition := RELEASABLE"
        note: "Disposition is mutable until the parent determination is issued; a remand resets it to PENDING."
      - from: PENDING
        to: REDACTED
        trigger: "POST /records/{id}/review"
        actor: FoiaOfficer
        preconditions:
          - "parent FoiaRequest.status == PROCESSING"
          - ">= 1 Exemption cites this record_id with applies_to_kind == RECORD"
        side_effects:
          - "set disposition := REDACTED"
      - from: PENDING
        to: WITHHELD
        trigger: "POST /records/{id}/review"
        actor: FoiaOfficer
        preconditions:
          - "parent FoiaRequest.status == PROCESSING"
          - ">= 1 Exemption cites this record_id with applies_to_kind == RECORD"
        side_effects:
          - "set disposition := WITHHELD"
      - from: RELEASABLE
        to: PENDING
        trigger: "system: parent FoiaRequest remand reset"
        actor: system
        preconditions:
          - "parent FoiaRequest transitioned {DENIED|PARTIALLY_GRANTED} -> PROCESSING via remand"
        side_effects:
          - "set disposition := PENDING"
      - from: REDACTED
        to: PENDING
        trigger: "system: parent FoiaRequest remand reset"
        actor: system
        preconditions: ["parent remand reset fired"]
        side_effects: ["set disposition := PENDING"]
      - from: WITHHELD
        to: PENDING
        trigger: "system: parent FoiaRequest remand reset"
        actor: system
        preconditions: ["parent remand reset fired"]
        side_effects: ["set disposition := PENDING"]

  # ---- Appeal: branching adjudication with remand back to request ----
  - entity: Appeal
    initial_state: FILED
    terminal_states: [AFFIRMED, REVERSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/assign"
        actor: AppealAuthority
        preconditions:
          - "appeal.status == FILED"
          - "the acting AppealAuthority.id != the FoiaRequest.assigned_officer_id (segregation of duties enforced via role separation: officers cannot act as appeal authorities)"
        side_effects:
          - "set assigned_authority_id := the authority in X-User-ID"
      - from: UNDER_REVIEW
        to: AFFIRMED
        trigger: "POST /appeals/{id}/decide"
        actor: AppealAuthority
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "decision == AFFIRM"
        side_effects:
          - "append AuditEvent(event_type=APPEAL_DECIDED, detail='affirmed') on the request"
        note: "Affirm: the original determination stands; the request stays in its determination state."
      - from: UNDER_REVIEW
        to: REVERSED
        trigger: "POST /appeals/{id}/decide"
        actor: AppealAuthority
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "decision == REVERSE"
        side_effects:
          - "set every ResponsiveRecord.disposition := RELEASABLE on the request"
          - "set FoiaRequest.status := GRANTED (full release ordered)"
          - "append AuditEvent(event_type=APPEAL_DECIDED, detail='reversed; full release')"
        note: "Reverse: appellate body orders release; cross-entity cascade to the request and its records."
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /appeals/{id}/decide"
        actor: AppealAuthority
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "decision == REMAND"
        side_effects:
          - "trigger the FoiaRequest {DENIED|PARTIALLY_GRANTED} -> PROCESSING remand reset (cross-entity), which itself resets all records to PENDING and deadline_status to RUNNING"
        note: "Remand cascades: Appeal->FoiaRequest->ResponsiveRecord (depth-3 chain)."

  # ---- ThirdPartyObjection: Reverse FOIA ----
  - entity: ThirdPartyObjection
    initial_state: NOTICED
    terminal_states: [SUSTAINED, OVERRULED, NO_RESPONSE]
    transitions:
      - from: NOTICED
        to: OBJECTED
        trigger: "POST /objections/{id}/object"
        actor: Submitter
        preconditions:
          - "objection.status == NOTICED"
          - "the acting Submitter.id == objection.submitter_id"
        side_effects:
          - "append AuditEvent(event_type=REVERSE_NOTICE, detail='submitter objected', actor_role=Submitter) on the record's request"
      - from: OBJECTED
        to: SUSTAINED
        trigger: "POST /objections/{id}/resolve"
        actor: FoiaOfficer
        preconditions:
          - "objection.status == OBJECTED"
          - "resolution == SUSTAIN"
        side_effects:
          - "set the linked ResponsiveRecord.disposition := WITHHELD"
          - "create an Exemption(applies_to_kind=RECORD, exemption_code=B4, record_id=objection.record_id) so the WITHHELD record has its citation"
          - "append AuditEvent(event_type=REVERSE_DECIDED, detail='objection sustained; record withheld')"
        note: "Sustain cascade: Objection->ResponsiveRecord disposition + Exemption creation (depth-2)."
      - from: OBJECTED
        to: OVERRULED
        trigger: "POST /objections/{id}/resolve"
        actor: FoiaOfficer
        preconditions:
          - "objection.status == OBJECTED"
          - "resolution == OVERRULE"
        side_effects:
          - "the linked ResponsiveRecord becomes eligible for RELEASABLE (the Reverse-FOIA gate on determination lifts)"
          - "append AuditEvent(event_type=REVERSE_DECIDED, detail='objection overruled; disclosure permitted')"
      - from: NOTICED
        to: NO_RESPONSE
        trigger: "POST /objections/{id}/lapse"
        actor: FoiaOfficer
        preconditions:
          - "objection.status == NOTICED"
          - "now >= notice_sent_at + REVERSE_NOTICE_DAYS calendar days"
        side_effects:
          - "the linked ResponsiveRecord becomes eligible for RELEASABLE (no timely objection)"
          - "append AuditEvent(event_type=REVERSE_DECIDED, detail='no timely objection; disclosure permitted')"

concurrency_rules:
  - rule_id: determination-stale-request
    parent_entity: FoiaRequest
    write_endpoint: "POST /requests/{id}/determination"
    occ_field: "expected_request_version"
    description: |
      Issuing a determination against a FoiaRequest whose version has advanced
      since the officer last read it is rejected with a stale-version error. The
      version advances whenever a prior write recategorized the fee tier, granted
      a fee waiver, or applied an extension — each of which can change which
      determination branch is valid — so a determination computed against a stale
      view of the request is refused.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: fee_assessment
    trigger: "POST /requests/{id}/fee-estimate (FoiaRequest PROCESSING self-loop or PROCESSING -> AWAITING_PAYMENT)"
    algorithm: tiered_pricing
    formula: |
      # All money in integer cents. fee_category is the PARENT FoiaRequest.fee_category.
      # Round each chargeable component to whole cents AFTER computing it from rates,
      # then SUM the rounded components. (Order is pinned: round-per-component, then sum.)
      search_qh    = ceil(search_hours * 4)          # bill search per quarter-hour, round UP
      review_qh    = ceil(review_hours * 4)
      search_cost  = round_half_up(search_qh * SEARCH_RATE_CENTS_PER_QH)
      review_cost  = round_half_up(review_qh * REVIEW_RATE_CENTS_PER_QH)
      dup_cost_full = round_half_up(billable_pages * DUP_CENTS_PER_PAGE)

      if fee_category == COMMERCIAL:
          # all three components, no free allotment
          assessed = search_cost + review_cost + dup_cost_full
      elif fee_category in {EDUCATIONAL, NEWS_MEDIA}:
          # duplication only; first FREE_PAGES pages free; no search/review charge
          free_pages  = FREE_PAGES
          chargeable_pages = max(0, billable_pages - free_pages)
          assessed = round_half_up(chargeable_pages * DUP_CENTS_PER_PAGE)
      else:  # OTHER (public / individual / non-commercial)
          # first FREE_SEARCH_HOURS search hours free + first FREE_PAGES pages free; no review charge
          free_search_qh    = FREE_SEARCH_HOURS * 4
          chargeable_qh     = max(0, search_qh - free_search_qh)
          search_cost_other = round_half_up(chargeable_qh * SEARCH_RATE_CENTS_PER_QH)
          chargeable_pages  = max(0, billable_pages - FREE_PAGES)
          dup_cost_other    = round_half_up(chargeable_pages * DUP_CENTS_PER_PAGE)
          assessed = search_cost_other + dup_cost_other

      if request.fee_waiver_granted: assessed = 0
      requires_advance_payment = (assessed > ADVANCE_PAYMENT_THRESHOLD_CENTS)
    input_set: "Inputs are the single current FeeEstimate's search_hours, review_hours, billable_pages plus the parent FoiaRequest.fee_category and fee_waiver_granted."
    constants:
      SEARCH_RATE_CENTS_PER_QH: 1000     # $40/hr = $10 per quarter-hour
      REVIEW_RATE_CENTS_PER_QH: 1000     # $40/hr = $10 per quarter-hour
      DUP_CENTS_PER_PAGE: 10             # $0.10/page
      FREE_PAGES: 100
      FREE_SEARCH_HOURS: 2
      ADVANCE_PAYMENT_THRESHOLD_CENTS: 25000   # $250.00
    precision: "integer cents; round_half_up where a fractional cent could appear; component costs rounded then summed"
    variants:
      - name: commercial_full_charge
        when: "fee_category == COMMERCIAL"
        difference: "Charges search + review + duplication with zero free allotment."
      - name: media_education_dup_only
        when: "fee_category in {EDUCATIONAL, NEWS_MEDIA}"
        difference: "Charges duplication only; first 100 pages free; no search or review charge."
      - name: other_partial_free
        when: "fee_category == OTHER"
        difference: "Charges search beyond first 2 hours + duplication beyond first 100 pages; no review charge."

  - name: fee_waiver_eligibility_score
    trigger: "POST /requests/{id}/fee-waiver (FoiaOfficer adjudicates a public-interest waiver request)"
    algorithm: weighted_scoring
    formula: |
      # Public-interest waiver: weighted multi-factor score in [0, 100].
      # Each factor is a 0/1 officer-asserted finding; weights pinned below.
      score = round_half_up(
                100 * ( W_PUBLIC_UNDERSTANDING * f_public_understanding
                      + W_NOT_COMMERCIAL_INTEREST * f_not_commercial_interest
                      + W_MEANINGFUL_CONTRIBUTION * f_meaningful_contribution
                      + W_ABILITY_TO_DISSEMINATE * f_ability_to_disseminate ) )
      granted = (score >= WAIVER_GRANT_THRESHOLD)   # >= , not >
    input_set: "Four boolean findings supplied in the waiver request body; weights are constants."
    constants:
      W_PUBLIC_UNDERSTANDING: 0.40
      W_NOT_COMMERCIAL_INTEREST: 0.30
      W_MEANINGFUL_CONTRIBUTION: 0.20
      W_ABILITY_TO_DISSEMINATE: 0.10
      WAIVER_GRANT_THRESHOLD: 70
    precision: "score is an integer 0..100, round_half_up"
    variants:
      - name: commercial_auto_fail
        when: "FoiaRequest.fee_category == COMMERCIAL"
        difference: "A commercial requester is statutorily ineligible: granted is forced false regardless of score (ERR_WAIVER_INELIGIBLE_COMMERCIAL)."

  - name: deadline_projection
    trigger: "Recomputed on FoiaRequest.perfect (base), .extend (extension), .fee-estimate->AWAITING_PAYMENT (toll start), .payment (toll close)"
    algorithm: interval_merge
    formula: |
      # Working-day arithmetic: add N working days = advance the date skipping
      # Saturdays and Sundays. base_due_at = add_working_days(received_at, 20).
      # effective_due_at = add_working_days(base_due_at,
      #                       extension_days_added + tolled_working_days).
      # A tolling window opens at TOLLED and closes at RESUMED; tolled_working_days
      # accumulates the count of working days strictly between window open and close
      # (open day counted, close day not). Multiple windows sum.
      def add_working_days(start, n):
          d = start; added = 0
          while added < n:
              d = d + 1 day
              if weekday(d) not in {SAT, SUN}: added += 1
          return d
    input_set: "ProcessingDeadline.base_due_at, extension_days_added, tolled_working_days; the request's received_at anchors base_due_at."
    constants:
      WORKING_DAYS_BASE: 20
      EXTENSION_WORKING_DAYS: 10
      WEEKEND_DAYS: ["SATURDAY", "SUNDAY"]
      APPEAL_WINDOW_DAYS: 90          # calendar days a requester has to file an appeal after a determination
      REVERSE_NOTICE_DAYS: 10         # calendar days a submitter has to object before a notice may lapse
    precision: "datetime at whole-day resolution; deadline at 23:59:59.999Z of the computed working day"
    variants:
      - name: deadline_met_vs_missed
        when: "determination issued"
        difference: "deadline_status := MET iff determination timestamp <= effective_due_at, else MISSED; boundary is <= (inclusive of the final instant)."

  - name: outstanding_balance_recompute
    trigger: "Recomputed on every fee-estimate assessment and on every payment (FoiaRequest .fee-estimate and .payment transitions)"
    algorithm: aggregation
    formula: |
      # Sum assessed fees across the requester's FoiaRequests whose
      # fee_payment_status == DUE; subtract amounts whose status == PAID is
      # excluded from the sum (PAID requests contribute 0). WAIVED contribute 0.
      outstanding = sum(
          fe.assessed_fee_cents
          for r in FoiaRequest where r.requester_id == this.requester_id
          for fe in [current FeeEstimate of r]
          if r.fee_payment_status == DUE
      )
    input_set: "All FoiaRequests for the requester whose fee_payment_status == DUE; each contributes its current FeeEstimate.assessed_fee_cents. PAID/WAIVED/NONE contribute 0."
    constants: {}
    precision: "integer cents; exact sum, no rounding"
    variants: []

  - name: booking_overlap_detection
    trigger: "POST /reading-rooms/{id}/bookings and POST /review-stations/{id}/bookings"
    algorithm: interval_merge
    formula: |
      # Two DIFFERENT interval geometries, one per resource entity:
      #
      # (A) ReadingRoom — AGGREGATE-CAPACITY semantics, half-open intervals.
      #     concurrent_count(t) := number of EXISTING room bookings whose
      #     half-open interval [b.starts_at, b.ends_at) contains instant t
      #     (the new booking is NOT counted). The new booking [s, e) is rejected
      #     iff there exists an instant t in [s, e) with
      #         concurrent_count(t) >= room.capacity
      #     i.e. the room is already full at some instant the new booking covers.
      #     Two bookings that merely touch at an endpoint
      #     (existing.ends_at == new.starts_at) do NOT overlap (half-open), so
      #     adjacency is always permitted regardless of capacity.
      #     overlap(a, b) := a.starts_at < b.ends_at AND b.starts_at < a.ends_at
      #
      # (B) ReviewStation — SINGLE-OCCUPANCY-WITH-BUFFER semantics, closed
      #     intervals plus a buffer. A new booking [s, e] is rejected when it
      #     comes within buffer_minutes of ANY existing booking on the station:
      #     reject_if exists existing s.t.
      #       new.starts_at <= existing.ends_at + buffer_minutes  AND
      #       existing.starts_at <= new.ends_at + buffer_minutes
      #     Adjacency (new.starts_at == existing.ends_at) is REJECTED whenever
      #     buffer_minutes >= 0, because the closed intervals share the endpoint
      #     and the buffer demands a strictly positive gap when buffer_minutes>0.
    input_set: "(A) all ReadingRoomBookings for the room; capacity from ReadingRoom. (B) all ReviewStationBookings for the station; buffer_minutes from ReviewStation."
    constants: {}
    precision: "datetime comparisons at second resolution; buffer arithmetic in whole minutes"
    variants:
      - name: room_aggregate_capacity
        when: "POST /reading-rooms/{id}/bookings"
        difference: "Half-open intervals; multiple concurrent bookings allowed up to capacity; touching endpoints never conflict."
      - name: station_buffer_closed
        when: "POST /review-stations/{id}/bookings"
        difference: "Closed intervals, single occupancy, plus a mandatory buffer_minutes gap; touching or near-adjacent bookings conflict."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For ownership-scoped operations the acting entity_backed user owns the resource: Requester.id == request.requester_id (payment, withdraw, appeal filing); Submitter.id == objection.submitter_id (object)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /requests/{id}/payment, POST /requests/{id}/withdraw, POST /requests/{id}/appeals, POST /objections/{id}/object"

  - priority: 4
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (request, record, appeal, objection, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Body foreign keys reference existing entities (requester_id, submitter_id, record_id, etc.)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"

  - priority: 6
    category: business_constraint
    check: "Required body fields present and well-typed; enums within declared sets; numeric fields satisfy declared bounds (page_count >= 1, hours >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 7
    category: state
    check: "Target resource is in a state that permits this transition (per §1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_safety
    check: "Glomar requires acting officer.can_invoke_glomar == true"
    error_id: ERR_GLOMAR_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /requests/{id}/glomar"

  - priority: 9
    category: business_safety
    check: "Glomar requires zero ResponsiveRecords logged for the request and exactly one REQUEST-level Exemption with code in {B1, B7}"
    error_id: ERR_GLOMAR_PRECONDITION
    http_status: 409
    applies_to: "POST /requests/{id}/glomar"

  - priority: 10
    category: business_referential
    check: "A record set to REDACTED/WITHHELD must have >= 1 Exemption citing its record_id; a determination that withholds/redacts an uncited record is rejected"
    error_id: ERR_EXEMPTION_REQUIRED
    http_status: 409
    applies_to: "POST /records/{id}/review, POST /requests/{id}/determination"

  - priority: 11
    category: business_referential
    check: "Reverse-FOIA gate: a record with contains_submitter_info==true cannot be made RELEASABLE (nor can a determination release it) while its ThirdPartyObjection.status in {NOTICED, OBJECTED}"
    error_id: ERR_REVERSE_FOIA_PENDING
    http_status: 409
    applies_to: "POST /records/{id}/review, POST /requests/{id}/determination"

  - priority: 12
    category: business_constraint
    check: "Exemption.exemption_code must be one of the nine statutory codes B1..B9; REQUEST-level (Glomar) exemptions are limited to {B1, B7}"
    error_id: ERR_INVALID_EXEMPTION_CODE
    http_status: 422
    applies_to: "POST /requests/{id}/exemptions"

  - priority: 13
    category: business_constraint
    check: "Only one unusual-circumstances extension permitted (ProcessingDeadline.extension_days_added already 10)"
    error_id: ERR_EXTENSION_ALREADY_USED
    http_status: 409
    applies_to: "POST /requests/{id}/extend"

  - priority: 14
    category: business_temporal
    check: "An appeal must be filed within APPEAL_WINDOW_DAYS calendar days of the determination (filed_at - determination_at <= 90 days)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /requests/{id}/appeals"

  - priority: 15
    category: state
    check: "An appeal can only be filed against a request in a determination state {GRANTED, PARTIALLY_GRANTED, DENIED, GLOMAR_INVOKED}"
    error_id: ERR_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /requests/{id}/appeals"

  - priority: 16
    category: business_fiscal
    check: "Payment amount must equal the assessed_fee_cents due (no partial payments)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /requests/{id}/payment"

  - priority: 17
    category: business_fiscal
    check: "A fee waiver cannot be granted to a COMMERCIAL fee_category request"
    error_id: ERR_WAIVER_INELIGIBLE_COMMERCIAL
    http_status: 409
    applies_to: "POST /requests/{id}/fee-waiver"

  - priority: 18
    category: business_constraint
    check: "A ResponsiveRecord with contains_submitter_info==true must carry a submitter_id; a ThirdPartyObjection's submitter_id must equal the record's submitter_id"
    error_id: ERR_SUBMITTER_MISMATCH
    http_status: 422
    applies_to: "POST /requests/{id}/records, POST /records/{id}/objection"

  - priority: 19
    category: business_temporal
    check: "Reading-room booking rejected when, at some instant in its half-open interval, the count of existing room bookings active there is >= capacity; touching endpoints never conflict (aggregate-capacity, half-open)"
    error_id: ERR_ROOM_AT_CAPACITY
    http_status: 409
    applies_to: "POST /reading-rooms/{id}/bookings"

  - priority: 20
    category: business_temporal
    check: "Review-station booking rejected when it falls within buffer_minutes of any existing booking on the station (single-occupancy, closed-interval + buffer); touching endpoints conflict"
    error_id: ERR_STATION_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /review-stations/{id}/bookings"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ---- Actor registration ----
  - method: POST
    path: "/requesters"
    description: "Register a requester"
    roles: [Requester, FoiaOfficer]
    code: 201
    input: [full_name, email, declared_category, "organization?"]
    output: Requester
    side_effects: ["outstanding_balance_cents initialized to 0"]

  - method: GET
    path: "/requesters/{id}"
    description: "Fetch a requester (includes computed outstanding_balance_cents)"
    roles: [Requester, FoiaOfficer]
    code: 200
    input: []
    output: Requester

  - method: POST
    path: "/officers"
    description: "Register a FOIA officer"
    roles: [FoiaOfficer]
    code: 201
    input: [full_name, badge_id, "can_invoke_glomar?"]
    output: FoiaOfficer

  - method: POST
    path: "/appeal-authorities"
    description: "Register an appeal authority"
    roles: [FoiaOfficer]
    code: 201
    input: [full_name, badge_id]
    output: AppealAuthority

  - method: POST
    path: "/submitters"
    description: "Register a third-party submitter"
    roles: [FoiaOfficer]
    code: 201
    input: [company_name, contact_email]
    output: Submitter

  # ---- Request intake & lifecycle ----
  - method: POST
    path: "/requests"
    description: "Submit a FOIA request"
    roles: [Requester, FoiaOfficer]
    code: 201
    input: [requester_id, subject_description, received_at, "expedited?", "fee_waiver_requested?"]
    output: FoiaRequest
    side_effects: ["status := SUBMITTED", "append AuditEvent(SUBMITTED)"]

  - method: GET
    path: "/requests/{id}"
    description: "Fetch a request"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: FoiaRequest

  - method: GET
    path: "/requests"
    description: "List requests (paginated, filterable by requester_id, assigned_officer_id and status; reverse-reachability for FoiaRequest.requester_id and FoiaRequest.assigned_officer_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: ["requester_id?", "assigned_officer_id?", "status?", "limit?", "offset?"]
    output: FoiaRequest[]

  - method: POST
    path: "/requests/{id}/perfect"
    description: "Perfect the request (intake complete), assign fee_category, start the 20-working-day clock"
    roles: [FoiaOfficer]
    code: 200
    input: [fee_category]
    output: FoiaRequest
    side_effects: ["status SUBMITTED -> PERFECTED", "create ProcessingDeadline", "set deadline_status RUNNING", "append AuditEvent(PERFECTED)"]

  - method: POST
    path: "/requests/{id}/assign"
    description: "Assign the request to the acting officer for processing"
    roles: [FoiaOfficer]
    code: 200
    input: []
    output: FoiaRequest
    side_effects: ["status PERFECTED -> PROCESSING", "set assigned_officer_id", "append AuditEvent(ASSIGNED)"]

  - method: POST
    path: "/requests/{id}/extend"
    description: "Apply the single 10-working-day unusual-circumstances extension"
    roles: [FoiaOfficer]
    code: 200
    input: []
    output: FoiaRequest
    side_effects: ["ProcessingDeadline.extension_days_added := 10", "recompute effective_due_at", "deadline_status := EXTENDED", "append AuditEvent(EXTENDED)"]

  - method: POST
    path: "/requests/{id}/withdraw"
    description: "Requester withdraws the request"
    roles: [Requester]
    code: 200
    input: []
    output: FoiaRequest
    side_effects: ["status -> WITHDRAWN", "deadline_status := MET", "append AuditEvent(DETERMINATION='withdrawn')"]

  # ---- Records & exemptions ----
  - method: POST
    path: "/requests/{id}/records"
    description: "Log a responsive record under a request"
    roles: [FoiaOfficer]
    code: 201
    input: [title, page_count, "contains_submitter_info?", "submitter_id?"]
    output: ResponsiveRecord
    side_effects: ["disposition := PENDING"]

  - method: GET
    path: "/requests/{id}/records"
    description: "List responsive records for a request (reverse-reachability for ResponsiveRecord.request_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ResponsiveRecord[]

  - method: GET
    path: "/records/{id}"
    description: "Fetch a responsive record"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ResponsiveRecord

  - method: GET
    path: "/records"
    description: "List responsive records filterable by submitter_id or request_id (reverse-reachability for ResponsiveRecord.submitter_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: ["submitter_id?", "request_id?", "limit?", "offset?"]
    output: ResponsiveRecord[]

  - method: POST
    path: "/records/{id}/review"
    description: "Set a record's disposition (RELEASABLE/REDACTED/WITHHELD) during processing"
    roles: [FoiaOfficer]
    code: 200
    input: [disposition]
    output: ResponsiveRecord
    side_effects: ["disposition transition per §1.2 (enforces exemption-citation and Reverse-FOIA gates)"]

  - method: POST
    path: "/requests/{id}/exemptions"
    description: "Assert a FOIA exemption against a record (RECORD) or the request itself (REQUEST/Glomar)"
    roles: [FoiaOfficer]
    code: 201
    input: [applies_to_kind, exemption_code, justification, "record_id?"]
    output: Exemption
    side_effects: []

  - method: GET
    path: "/requests/{id}/exemptions"
    description: "List exemptions for a request (reverse-reachability for Exemption.request_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: Exemption[]

  - method: GET
    path: "/exemptions/{id}"
    description: "Fetch a single exemption"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: Exemption

  - method: GET
    path: "/exemptions"
    description: "List exemptions filterable by record_id (reverse-reachability for Exemption.record_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: ["record_id?", "request_id?", "limit?", "offset?"]
    output: Exemption[]

  # ---- Fees ----
  - method: POST
    path: "/requests/{id}/fee-estimate"
    description: "Compute and record the tiered fee estimate; tolls the clock if above the advance-payment threshold"
    roles: [FoiaOfficer]
    code: 200
    input: [search_hours, review_hours, billable_pages, expected_request_version]
    output: FeeEstimate
    side_effects: ["run §1.3 fee_assessment", "set fee_payment_status (DUE/WAIVED)", "recompute Requester.outstanding_balance_cents", "increments FoiaRequest.version by 1", "if requires_advance_payment: status -> AWAITING_PAYMENT, deadline_status := TOLLED"]

  - method: GET
    path: "/requests/{id}/fee-estimate"
    description: "Fetch the current fee estimate (reverse-reachability for FeeEstimate.request_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: FeeEstimate[]

  - method: POST
    path: "/requests/{id}/fee-waiver"
    description: "Adjudicate a public-interest fee-waiver request via weighted scoring"
    roles: [FoiaOfficer]
    code: 200
    input: [f_public_understanding, f_not_commercial_interest, f_meaningful_contribution, f_ability_to_disseminate, expected_request_version]
    output: FoiaRequest
    side_effects: ["run §1.3 fee_waiver_eligibility_score", "set fee_waiver_granted", "increments FoiaRequest.version by 1"]

  - method: POST
    path: "/requests/{id}/payment"
    description: "Requester pays the assessed advance fee; resumes the clock"
    roles: [Requester]
    code: 200
    input: [amount_cents]
    output: FoiaRequest
    side_effects: ["status AWAITING_PAYMENT -> PROCESSING", "fee_payment_status := PAID", "close toll window, accrue tolled_working_days", "recompute outstanding_balance_cents", "append AuditEvent(RESUMED)"]

  - method: GET
    path: "/requests/{id}/deadline"
    description: "Fetch the processing deadline (reverse-reachability for ProcessingDeadline.request_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ProcessingDeadline[]

  # ---- Determination & Glomar ----
  - method: POST
    path: "/requests/{id}/determination"
    description: "Issue the determination (GRANTED/PARTIALLY_GRANTED/DENIED) derived from record dispositions; OCC-guarded"
    roles: [FoiaOfficer]
    code: 200
    input: [expected_request_version]
    output: FoiaRequest
    side_effects: ["status -> {GRANTED|PARTIALLY_GRANTED|DENIED} per record dispositions", "increments FoiaRequest.version by 1", "set deadline_status MET/MISSED", "append AuditEvent(DETERMINATION)"]

  - method: POST
    path: "/requests/{id}/glomar"
    description: "Invoke a Glomar response (neither confirm nor deny); OCC-guarded"
    roles: [FoiaOfficer]
    code: 200
    input: [expected_request_version]
    output: FoiaRequest
    side_effects: ["status PROCESSING -> GLOMAR_INVOKED", "set glomar_exemption_basis", "increments FoiaRequest.version by 1", "append AuditEvent(GLOMAR)"]

  # ---- Appeals ----
  - method: POST
    path: "/requests/{id}/appeals"
    description: "Requester files an administrative appeal of a determination"
    roles: [Requester]
    code: 201
    input: [appellant_id, grounds, filed_at]
    output: Appeal
    side_effects: ["status := FILED", "append AuditEvent(APPEAL_FILED)"]

  - method: GET
    path: "/appeals/{id}"
    description: "Fetch an appeal"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: Appeal

  - method: GET
    path: "/requests/{id}/appeals"
    description: "List appeals for a request (reverse-reachability for Appeal.request_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: Appeal[]

  - method: GET
    path: "/appeals"
    description: "List appeals filterable by appellant_id and assigned_authority_id (reverse-reachability for Appeal.appellant_id and Appeal.assigned_authority_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: ["appellant_id?", "assigned_authority_id?", "request_id?", "limit?", "offset?"]
    output: Appeal[]

  - method: POST
    path: "/appeals/{id}/assign"
    description: "Appeal authority takes up the appeal"
    roles: [AppealAuthority]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status FILED -> UNDER_REVIEW", "set assigned_authority_id"]

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Appeal authority decides (AFFIRM/REVERSE/REMAND); REVERSE and REMAND cascade to the request"
    roles: [AppealAuthority]
    code: 200
    input: [decision]
    output: Appeal
    side_effects: ["status UNDER_REVIEW -> {AFFIRMED|REVERSED|REMANDED}", "REVERSE: release all records, request -> GRANTED", "REMAND: request -> PROCESSING, records -> PENDING, deadline_status -> RUNNING"]

  # ---- Reverse FOIA ----
  - method: POST
    path: "/records/{id}/objection"
    description: "Open a Reverse-FOIA notice/objection for a submitter-info record"
    roles: [FoiaOfficer]
    code: 201
    input: [submitter_id, objection_text]
    output: ThirdPartyObjection
    side_effects: ["status := NOTICED", "set notice_sent_at", "append AuditEvent(REVERSE_NOTICE)"]

  - method: GET
    path: "/objections/{id}"
    description: "Fetch a Reverse-FOIA objection"
    roles: [Requester, FoiaOfficer, AppealAuthority, Submitter]
    code: 200
    input: []
    output: ThirdPartyObjection

  - method: GET
    path: "/objections"
    description: "List objections filterable by record_id or submitter_id (reverse-reachability for ThirdPartyObjection.record_id and .submitter_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority, Submitter]
    code: 200
    input: ["record_id?", "submitter_id?", "limit?", "offset?"]
    output: ThirdPartyObjection[]

  - method: POST
    path: "/objections/{id}/object"
    description: "Submitter formally objects to disclosure"
    roles: [Submitter]
    code: 200
    input: []
    output: ThirdPartyObjection
    side_effects: ["status NOTICED -> OBJECTED", "append AuditEvent(REVERSE_NOTICE)"]

  - method: POST
    path: "/objections/{id}/resolve"
    description: "Officer resolves the objection (SUSTAIN withholds the record / OVERRULE permits disclosure)"
    roles: [FoiaOfficer]
    code: 200
    input: [resolution]
    output: ThirdPartyObjection
    side_effects: ["status OBJECTED -> {SUSTAINED|OVERRULED}", "SUSTAIN: record -> WITHHELD + create Exemption(B4)", "append AuditEvent(REVERSE_DECIDED)"]

  - method: POST
    path: "/objections/{id}/lapse"
    description: "Officer marks a notice lapsed after the reverse-notice window with no objection"
    roles: [FoiaOfficer]
    code: 200
    input: []
    output: ThirdPartyObjection
    side_effects: ["status NOTICED -> NO_RESPONSE", "record becomes releasable", "append AuditEvent(REVERSE_DECIDED)"]

  # ---- Inspection facilities & bookings ----
  - method: POST
    path: "/reading-rooms"
    description: "Register a reading room (physical inspection space)"
    roles: [FoiaOfficer]
    code: 201
    input: [name, capacity]
    output: ReadingRoom

  - method: GET
    path: "/reading-rooms/{id}"
    description: "Fetch a reading room"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ReadingRoom

  - method: POST
    path: "/review-stations"
    description: "Register a secure review station with a cleanup buffer"
    roles: [FoiaOfficer]
    code: 201
    input: [name, buffer_minutes]
    output: ReviewStation

  - method: GET
    path: "/review-stations/{id}"
    description: "Fetch a review station"
    roles: [FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ReviewStation

  - method: POST
    path: "/reading-rooms/{id}/bookings"
    description: "Book a reading-room inspection slot (aggregate-capacity, half-open overlap rule)"
    roles: [Requester, FoiaOfficer]
    code: 201
    input: [request_id, starts_at, ends_at]
    output: ReadingRoomBooking
    side_effects: ["run §1.3 booking_overlap_detection variant room_aggregate_capacity"]

  - method: GET
    path: "/reading-rooms/{id}/bookings"
    description: "List bookings for a reading room (reverse-reachability for ReadingRoomBooking.room_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ReadingRoomBooking[]

  - method: GET
    path: "/reading-room-bookings/{id}"
    description: "Fetch a single reading-room booking"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ReadingRoomBooking

  - method: GET
    path: "/reading-room-bookings"
    description: "List reading-room bookings filterable by request_id (reverse-reachability for ReadingRoomBooking.request_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: ["request_id?", "room_id?", "limit?", "offset?"]
    output: ReadingRoomBooking[]

  - method: POST
    path: "/review-stations/{id}/bookings"
    description: "Book a review-station slot (single-occupancy, closed-interval + buffer overlap rule)"
    roles: [FoiaOfficer]
    code: 201
    input: [request_id, starts_at, ends_at]
    output: ReviewStationBooking
    side_effects: ["run §1.3 booking_overlap_detection variant station_buffer_closed"]

  - method: GET
    path: "/review-stations/{id}/bookings"
    description: "List bookings for a review station (reverse-reachability for ReviewStationBooking.station_id)"
    roles: [FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ReviewStationBooking[]

  - method: GET
    path: "/review-station-bookings/{id}"
    description: "Fetch a single review-station booking"
    roles: [FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: ReviewStationBooking

  - method: GET
    path: "/review-station-bookings"
    description: "List review-station bookings filterable by request_id (reverse-reachability for ReviewStationBooking.request_id)"
    roles: [FoiaOfficer, AppealAuthority]
    code: 200
    input: ["request_id?", "station_id?", "limit?", "offset?"]
    output: ReviewStationBooking[]

  # ---- Audit log ----
  - method: GET
    path: "/requests/{id}/audit-events"
    description: "List the append-only audit trail for a request (reverse-reachability for AuditEvent.request_id)"
    roles: [Requester, FoiaOfficer, AppealAuthority]
    code: 200
    input: []
    output: AuditEvent[]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's notion of 'now' (test-driving endpoint for deadline/appeal-window/reverse-notice arithmetic)"
    roles: [FoiaOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to the provided instant"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed user is not the owner of the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign key references a non-existent entity"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad type, enum out of set, or numeric bound violated"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits this transition"
  - id: ERR_STALE_REQUEST_VERSION
    http: 412
    condition: "expected_request_version does not match the current FoiaRequest.version (OCC)"
  - id: ERR_GLOMAR_NOT_AUTHORIZED
    http: 403
    condition: "Acting officer lacks can_invoke_glomar privilege"
  - id: ERR_GLOMAR_PRECONDITION
    http: 409
    condition: "Glomar attempted with responsive records logged or without exactly one REQUEST-level B1/B7 exemption"
  - id: ERR_EXEMPTION_REQUIRED
    http: 409
    condition: "A REDACTED/WITHHELD record has no Exemption citing its record_id"
  - id: ERR_REVERSE_FOIA_PENDING
    http: 409
    condition: "Attempt to release a submitter-info record while its objection is NOTICED or OBJECTED"
  - id: ERR_INVALID_EXEMPTION_CODE
    http: 422
    condition: "exemption_code not in B1..B9, or REQUEST-level exemption not in {B1,B7}"
  - id: ERR_EXTENSION_ALREADY_USED
    http: 409
    condition: "A second unusual-circumstances extension attempted"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "Appeal filed_at is more than APPEAL_WINDOW_DAYS calendar days after the determination"
  - id: ERR_NOT_APPEALABLE
    http: 409
    condition: "Appeal filed against a request not in a determination state"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "Payment amount_cents does not equal the assessed_fee_cents due"
  - id: ERR_WAIVER_INELIGIBLE_COMMERCIAL
    http: 409
    condition: "Fee-waiver requested on a COMMERCIAL fee_category request"
  - id: ERR_SUBMITTER_MISMATCH
    http: 422
    condition: "submitter_info record missing submitter_id, or objection submitter_id != record.submitter_id"
  - id: ERR_VALIDATION_NOT_PERFECTED
    http: 409
    condition: "Operation requires a perfected request but request is still SUBMITTED"
  - id: ERR_ROOM_AT_CAPACITY
    http: 409
    condition: "Reading-room booking would push peak concurrency to capacity at some instant in its half-open interval"
  - id: ERR_STATION_BUFFER_CONFLICT
    http: 409
    condition: "Review-station booking falls within buffer_minutes of an existing booking (closed interval)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Requester
    description: "External member of the public who submits FOIA requests, pays fees, withdraws, and files appeals"
    identity: "entity_backed:Requester"
    exclusive_operations:
      - "POST /requests/{id}/payment"
      - "POST /requests/{id}/withdraw"
      - "POST /requests/{id}/appeals"
    shared_operations:
      - "POST /requesters"
      - "POST /requests"
      - "POST /reading-rooms/{id}/bookings"
      - "GET /requests, GET /requests/{id}, GET /requests/{id}/records, GET /requests/{id}/exemptions, GET /requests/{id}/fee-estimate, GET /requests/{id}/deadline, GET /requests/{id}/appeals, GET /requests/{id}/audit-events, GET /appeals, GET /appeals/{id}, GET /objections, GET /objections/{id}, GET /records/{id}, GET /requesters/{id}, GET /exemptions, GET /reading-rooms/{id}, GET /reading-rooms/{id}/bookings, GET /reading-room-bookings"

  - name: FoiaOfficer
    description: "Agency officer who perfects, processes, assesses fees, sets dispositions, and issues determinations/Glomar; CANNOT adjudicate appeals of their own determinations (segregation of duties — officers and appeal authorities are disjoint roles)"
    identity: "entity_backed:FoiaOfficer"
    exclusive_operations:
      - "POST /requests/{id}/perfect"
      - "POST /requests/{id}/assign"
      - "POST /requests/{id}/extend"
      - "POST /requests/{id}/records"
      - "POST /records/{id}/review"
      - "POST /requests/{id}/exemptions"
      - "POST /requests/{id}/fee-estimate"
      - "POST /requests/{id}/fee-waiver"
      - "POST /requests/{id}/determination"
      - "POST /requests/{id}/glomar"
      - "POST /records/{id}/objection"
      - "POST /objections/{id}/resolve"
      - "POST /objections/{id}/lapse"
      - "POST /officers"
      - "POST /appeal-authorities"
      - "POST /submitters"
      - "POST /reading-rooms"
      - "POST /review-stations"
      - "POST /review-stations/{id}/bookings"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /requesters"
      - "POST /requests"
      - "POST /reading-rooms/{id}/bookings"
      - "all GET endpoints"

  - name: AppealAuthority
    description: "Appellate adjudicator who reviews and decides appeals; distinct from the processing officer (segregation of duties)"
    identity: "entity_backed:AppealAuthority"
    exclusive_operations:
      - "POST /appeals/{id}/assign"
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "GET /requests, GET /requests/{id}, GET /requests/{id}/records, GET /requests/{id}/exemptions, GET /requests/{id}/fee-estimate, GET /requests/{id}/deadline, GET /requests/{id}/appeals, GET /requests/{id}/audit-events, GET /appeals, GET /appeals/{id}, GET /objections, GET /objections/{id}, GET /records/{id}, GET /exemptions, GET /reading-rooms/{id}, GET /reading-rooms/{id}/bookings, GET /reading-room-bookings, GET /review-stations/{id}, GET /review-stations/{id}/bookings, GET /review-station-bookings"

  - name: Submitter
    description: "Third-party business whose confidential records may be disclosed; can object under Reverse FOIA"
    identity: "entity_backed:Submitter"
    exclusive_operations:
      - "POST /objections/{id}/object"
    shared_operations:
      - "GET /objections, GET /objections/{id}"
