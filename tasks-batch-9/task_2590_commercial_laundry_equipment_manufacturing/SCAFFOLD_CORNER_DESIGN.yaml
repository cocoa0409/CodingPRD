              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "PAYMENT_SYSTEMS", completed_on: "2026-07-21" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t202}", training_module: "INSTALLATION", completed_on: "2026-07-22" }
