# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# TSA PreCheck / Global Entry Enrollment — Expert
# Breadth probe across the claim-extraction-guide's nine sections.
# Every active instance's setup_api_calls is reachable from empty-DB via §1.5;
# excluded_because stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_application_returns_201_with_draft_status
        claim_type: Creation
        grounds: [entities.Application, endpoints]
        distinguishing_aspect: "POST /applications with applicant_id + program_code returns 201, status DRAFT, version 1, fee_due_cents 0, fee_paid_cents 0."
        test_recipe:
          setup:
            - "PRECHECK Program exists; one applicant exists."
          setup_api_calls:
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Alice Create", date_of_birth: "1990-01-01", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_status: $.data.status, app_version: $.data.version }
          assert:
            - "response.status == 201"
            - "Application.${app_id}.status == DRAFT"
            - "Application.${app_id}.version == 1"
            - "Application.${app_id}.fee_due_cents == 0"

      - name: get_application_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Application, endpoints]
        distinguishing_aspect: "GET /applications/{id} returns the stored application with matching id and applicant_id."
        test_recipe:
          setup:
            - "One PRECHECK application created in DRAFT."
          setup_api_calls:
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Bob Get", date_of_birth: "1990-01-02", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { got_id: $.data.id, got_applicant: $.data.applicant_id }
          assert:
            - "response.status == 200"
            - "Application.${app_id}.applicant_id == ${applicant_id}"

      - name: list_applications_paginated_envelope
        claim_type: Listing
        grounds: [entities.Application, endpoints]
        distinguishing_aspect: "GET /applications returns array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup:
            - "Two PRECHECK applications created for one applicant."
          setup_api_calls:
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Cara List", date_of_birth: "1990-01-03", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "GET /applications"
              payload: { applicant_id: "${applicant_id}", limit: 1, offset: 0 }
              as: SchedulingAdmin
          assert:
            - "response.response_type == array"
            - "response.meta has total_count == 2"
            - "response.meta has_more == true"

      - name: get_application_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /applications/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no application with the queried id)."
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchedulingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_application_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applications omitting program_code returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One applicant exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Dev Missing", date_of_birth: "1990-01-04", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: applicant_disqualifying_flag_defaults_false
        claim_type: Defaults
        grounds: [entities.Applicant.fields.disqualifying_flag]
        distinguishing_aspect: "POST /applicants omitting disqualifying_flag defaults it to false."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Eli Default", date_of_birth: "1990-01-05", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id, flag: $.data.disqualifying_flag }
          assert:
            - "response.status == 201"
            - "Applicant.${applicant_id}.disqualifying_flag == false"

      - name: biometric_status_computed_from_quality_input_ignored
        claim_type: Computed Fields
        grounds: [entities.BiometricCapture.fields.status]
        distinguishing_aspect: "BiometricCapture.status is computed (ACCEPTED when fingerprint_quality<=3 AND photo_captured); client cannot set it directly — quality 2 + photo true yields ACCEPTED."
        test_recipe:
          setup:
            - "Application CLEARED, slot booked -> Appointment CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /enrollment-centers"
              payload: { program_code: "PRECHECK", name: "Center BIO", daily_interview_capacity: 10, buffer_minutes: 0, lane_count: 1 }
              as: SchedulingAdmin
              captures: { center_id: $.data.id }
            - call: "POST /appointment-slots"
              payload: { center_id: "${center_id}", lane_index: 0, starts_at: "2026-06-20T09:00:00Z", ends_at: "2026-06-20T09:30:00Z" }
              as: SchedulingAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Fay Bio", date_of_birth: "1990-01-06", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 1, watchlist_hits: 0, prior_revocations: 0 }
              as: VettingOfficer
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", slot_id: "${slot_id}", expected_application_version: "${app_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /biometric-captures"
              payload: { appointment_id: "${appt_id}", fingerprint_quality: 2, photo_captured: true }
              as: EnrollmentOfficer
              captures: { bio_id: $.data.id, bio_status: $.data.status }
          assert:
            - "response.status == 201"
            - "BiometricCapture.${bio_id}.status == ACCEPTED"

      - name: program_code_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Program.fields.code, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /programs with code outside {PRECHECK, GLOBAL_ENTRY} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { code: "NEXUS", name: "Nexus", base_fee_cents: 5000, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30 }
              as: SchedulingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: fee_transaction_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.FeeTransaction]
        distinguishing_aspect: "FeeTransaction has common_fields:false — it carries id+created_at only, no version field and no update endpoint; created via POST /applications/{id}/pay."
        test_recipe:
          setup:
            - "One SUBMITTED application with a payment."
          setup_api_calls:
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Gil Fee", date_of_birth: "1990-01-07", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { tx_id: $.data.id, tx_kind: $.data.kind }
          assert:
            - "response.status == 201"
            - "FeeTransaction.${tx_id}.kind == PAYMENT"
            - "FeeTransaction.${tx_id}.amount_cents == 7800"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_application_already_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second POST /applications/{id}/submit on an already-SUBMITTED application returns ERR_INVALID_STATE (409); no second AuditEvent."
        test_recipe:
          setup:
            - "Application already SUBMITTED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Hal Submit", date_of_birth: "1990-01-08", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: revoke_superseded_ktn_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.KnownTravelerNumber.ACTIVE_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoking a KTN that is already in a terminal state (e.g. EXPIRED via sweep) returns ERR_INVALID_STATE (409) — no transitions out of a terminal/expired KTN."
        test_recipe:
          setup:
            - "Applicant APPROVED -> ACTIVE KTN; clock advanced past expiry; KTN expire-swept to EXPIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /enrollment-centers"
              payload: { program_code: "PRECHECK", name: "Center KTN", daily_interview_capacity: 10, buffer_minutes: 0, lane_count: 1 }
              as: SchedulingAdmin
              captures: { center_id: $.data.id }
            - call: "POST /appointment-slots"
              payload: { center_id: "${center_id}", lane_index: 0, starts_at: "2026-06-20T09:00:00Z", ends_at: "2026-06-20T09:30:00Z" }
              as: SchedulingAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ida KTN", date_of_birth: "1990-01-09", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 1, watchlist_hits: 0, prior_revocations: 0 }
              as: VettingOfficer
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", slot_id: "${slot_id}", expected_application_version: "${app_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /biometric-captures"
              payload: { appointment_id: "${appt_id}", fingerprint_quality: 2, photo_captured: true }
              as: EnrollmentOfficer
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: EnrollmentOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: EnrollmentOfficer
            - call: "GET /applications/${app_id}/known-traveler-numbers"
              payload: {}
              as: SchedulingAdmin
              captures: { ktn_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-06-10T00:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /known-traveler-numbers/${ktn_id}/expire-sweep"
              payload: {}
              as: SchedulingAdmin
          trigger:
            - call: "POST /known-traveler-numbers/${ktn_id}/revoke"
              payload: {}
              as: VettingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: no_show_before_appointment_elapsed_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Appointment.CONFIRMED_to_NO_SHOW, "errors[ERR_APPOINTMENT_NOT_ELAPSED]"]
        distinguishing_aspect: "POST /appointments/{id}/no-show before current clock reaches appointment.ends_at returns ERR_APPOINTMENT_NOT_ELAPSED (409)."
        test_recipe:
          setup:
            - "Application CLEARED, slot 2026-06-20T09:00..09:30 booked -> CONFIRMED; clock still 2026-06-09 (before ends_at)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /enrollment-centers"
              payload: { program_code: "PRECHECK", name: "Center NS", daily_interview_capacity: 10, buffer_minutes: 0, lane_count: 1 }
              as: SchedulingAdmin
              captures: { center_id: $.data.id }
            - call: "POST /appointment-slots"
              payload: { center_id: "${center_id}", lane_index: 0, starts_at: "2026-06-20T09:00:00Z", ends_at: "2026-06-20T09:30:00Z" }
              as: SchedulingAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Jay NoShow", date_of_birth: "1990-01-10", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 1, watchlist_hits: 0, prior_revocations: 0 }
              as: VettingOfficer
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", slot_id: "${slot_id}", expected_application_version: "${app_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/no-show"
              payload: {}
              as: EnrollmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_ELAPSED"

      - name: new_application_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.Application]
        distinguishing_aspect: "A freshly created Application has status DRAFT (initial_state)."
        test_recipe:
          setup:
            - "PRECHECK program + applicant exist."
          setup_api_calls:
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Kim Init", date_of_birth: "1990-01-11", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, st: $.data.status }
          assert:
            - "Application.${app_id}.status == DRAFT"

      - name: appeal_limit_second_appeal_rejected
        claim_type: Idempotency
        grounds: [state_machines.Application.DENIED_to_APPEAL_PENDING, "validations[priority=18]", "errors[ERR_APPEAL_LIMIT_REACHED]"]
        distinguishing_aspect: "After one appeal is filed and UPHELD (back to DENIED), a SECOND POST /applications/{id}/appeals returns ERR_APPEAL_LIMIT_REACHED (409) because appeal_count is already 1."
        test_recipe:
          setup:
            - "Application DENIED (ADVERSE), one appeal filed then UPHELD -> back to DENIED, appeal_count=1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Lou Appeal", date_of_birth: "1990-01-12", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 0, watchlist_hits: 2, prior_revocations: 0 }
              as: VettingOfficer
              as_user_id: "vetting-officer-1"
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
