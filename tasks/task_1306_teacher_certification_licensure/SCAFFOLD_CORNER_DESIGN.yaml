        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deficiency-plan-create-stale-application]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CredentialApplication.version: a second deficiency-plan create carrying the pre-first-create expected_application_version fails 412 ERR_STALE_VERSION; the first plan remains the only one."
        test_recipe:
          setup: ["ALTERNATIVE SCIENCE application in DEFICIENCY_PENDING at version ${app_v}"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Len Le", email: "len@x.com", date_of_birth: "1996-09-09T00:00:00Z", ssn_last4: "3009", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
