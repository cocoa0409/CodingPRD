  - rule_id: resource_temporal_overlap
    instances:

      - name: branch_session_half_open_overlap
        grounds:
          - validations[priority=13]
          - entities.TrainingSession.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics 1: half-open [start, end) room-overlap on
          TrainingSession per branch. A session 10:00-12:00 conflicts with
          11:00-13:00 (ERR_SESSION_OVERLAP) but a session starting exactly at
          12:00 (touching endpoint) is ACCEPTED — adjacency is not overlap.
        test_recipe:
          setup:
            - "Project exists; session S1 branch MAIN 2026-09-02T10:00-12:00Z; cancelled session S0 branch MAIN 2026-09-02T11:00-13:00Z (cancelled sessions do not block)."
          setup_api_calls:
