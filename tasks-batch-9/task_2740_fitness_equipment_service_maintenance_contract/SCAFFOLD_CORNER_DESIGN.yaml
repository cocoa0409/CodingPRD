            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Mira Osei", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { insp_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "BELT-STD", category: "WEAR", unit_price_cents: 8000, initial_on_hand_qty: 5 }, as: PartsPlanner, captures: { p1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-15T09:00:00Z", window_end: "2026-08-15T11:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:10:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/start", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "BELT_TENSION", result: "PASS", consumable_replaced: true }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "EMERGENCY_STOP", result: "PASS" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/safety-doc/submit", payload: { inspection_summary: "belt replaced, stop switch verified" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/safety-doc/certify", as: SafetyInspector, as_user_id: "${insp_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/complete", as: FieldTechnician, as_user_id: "${t1_id}", captures: { v1_credit: "$.data.pm_credit_earned" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-16T09:00:00Z", window_end: "2026-08-16T11:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v2_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T11:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/preventive-visits/${v2_id}/mark-missed", as: ServiceCoordinator, captures: { v2_status: "$.data.visit_status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T12:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_FRAY" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-16T12:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${p1_id}", qty: 2, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { o1_id: "$.data.id", o1_draw: "$.data.allowance_draw_cents", o1_billable: "$.data.club_billable_cents" } }
            - { call: "POST /fleetcare/part-orders/${o1_id}/install", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/resume", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T13:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_id}/resolve", payload: { resolution_code: "BELT_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
          trigger:
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { pre_completed: "$.data.pm_visits_completed_count", pre_missed: "$.data.pm_visits_missed_count", pre_compliance: "$.data.pm_compliance_pct", pre_remaining: "$.data.parts_allowance_remaining_cents", pre_total: "$.data.parts_allowance_total_cents", pre_prov: "$.data.credit_provisional_cents" } }
            - { call: "GET /fleetcare/clubs/${club_id}", as: ContractAdministrator, captures: { pre_units: "$.data.covered_unit_count" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-DR-3", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e3_id: "$.data.id" } }
            - { call: "GET /fleetcare/clubs/${club_id}", as: ContractAdministrator, captures: { post_units: "$.data.covered_unit_count" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { post_compliance: "$.data.pm_compliance_pct", post_remaining: "$.data.parts_allowance_remaining_cents", post_risk: "$.data.fleet_renewal_risk", post_candidates: "$.data.replacement_candidate_count" } }
            - { call: "GET /fleetcare/parts/${p1_id}", as: PartsPlanner, captures: { stock_on_hand: "$.data.on_hand_qty", stock_allocated: "$.data.allocated_qty" } }
          assert:
            - "${v1_credit} == true and ${v2_status} == 'MISSED'"
            - "${pre_completed} == 1, ${pre_missed} == 1 and ${pre_compliance} == 50.00 — derived from the two visit rows, not from the four contracted visits"
            - "${o1_draw} == 16000 and ${o1_billable} == 0 — two units at 8000 cents, fully covered under FULL"
            - "${pre_total} == 500000 and ${pre_remaining} == 484000, which equals parts_allowance_total_cents minus the draws on ALLOCATED and INSTALLED orders"
            - "${pre_prov} == 0 — the 60-minute call sits entirely inside the 180-minute GOLD grace window"
            - "${pre_units} == 2 and ${post_units} == 3 — the counter follows Equipment rows on the club"
            - "${post_compliance} == 50.00 — adding a unit changes no visit row, so compliance is untouched"
            - "${post_remaining} == 484000 — installing the order neither released nor re-drew the allowance"
            - "${stock_on_hand} == 3 and ${stock_allocated} == 0 — installation consumed the two reserved units and cleared the allocation"
            - "${post_candidates} == 0 and ${post_risk} == 'LOW' — 0/3 is below the 0.15 MODERATE ratio"

      - name: one_resolve_fans_out_across_five_aggregates
        claim_type: cascading_side_effects
        grounds:
          - state_machines[ServiceCall].transitions[ON_SITE->RESOLVED]
          - calculations.equipment_health_score
          - entities.ServiceContract.fields.fleet_renewal_risk
        excluded_because:
          difficulty_instance: third_critical_resolve_cascades_five_hops_to_fleet_renewal_risk
          rationale: "The §1.8 instance already walks the full five-hop chain from a single resolve — event closure, equipment downtime and health, replacement flag, contract candidate count and fleet risk — and asserts each hop's number, so a corner-level repeat would only restate it."

      - name: the_health_score_switches_formula_on_its_third_failure
        claim_type: dual_variant_calculation
        grounds:
          - calculations.equipment_health_score
          - entities.Equipment.fields.health_score_variant
        excluded_because:
          difficulty_instance: equipment_health_usage_based_vs_failure_based_after_third_call
          rationale: "Variant selection, divergence and the post-switch reconciliation of the stored score are all pinned by the §1.8 instance at the exact third-resolve boundary; the corner sections cover only the rounding of the same formulas."

      - name: the_sla_clock_trips_exactly_at_the_target_minute
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.sla_response_evaluation
          - entities.ServiceCall.fields.sla_met
        excluded_because:
          difficulty_instance: sla_met_is_true_at_exactly_the_target_minute
          rationale: "The threshold's inclusive edge and the breach counter it feeds into the renewal quote are both exercised by the §1.8 instance; duplicating the boundary here would add no new failure mode."

  - section: consistency_model
    instances:
      - name: the_write_response_and_the_next_read_already_agree
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[ServiceCall].transitions[ON_SITE->RESOLVED]
        distinguishing_aspect: "No cascade is deferred: the resolve response already carries the call's own recomputed SLA fields, and the reads that follow it in the same test — event, equipment, contract and club — show every cascaded number on the first attempt, with no retry, refresh or convergence delay."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH (open 05:00-23:00), unit e1 (installed 2024-03-01, 500 usage hours), ACTIVE GOLD/FULL contract with annual_base_cents 250000, technician T1."
            - "A MAJOR call is reported at 08:00 (GOLD target 120 minutes at factor 1.0), arrives at 08:30 and is resolved at 14:00 — 360 wall-clock minutes, 180 over the GOLD grace, 4800 cents provisional."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-IM-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_id: "$.data.id", target: "$.data.sla_target_minutes" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}", captures: { resp: "$.data.response_minutes", met: "$.data.sla_met" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T14:00:00Z" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_id}/resolve", payload: { resolution_code: "BELT_TENSIONED" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { w_status: "$.data.status", w_resolved: "$.data.resolved_at", w_resp: "$.data.response_minutes", w_met: "$.data.sla_met" } }
            - { call: "GET /fleetcare/downtime-events", payload: { service_call_id: "${call_id}" }, as: ContractAdministrator, captures: { r_ev_status: "$.data[0].status", r_ev_minutes: "$.data[0].downtime_minutes", r_ev_prov: "$.data[0].provisional_credit_cents", r_ev_period: "$.data[0].period_key" } }
            - { call: "GET /fleetcare/equipment/${e1_id}", as: ServiceCoordinator, captures: { r_life: "$.data.lifecycle_status", r_ytd: "$.data.downtime_minutes_ytd" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { r_prov: "$.data.credit_provisional_cents", r_accrued: "$.data.credit_accrued_cents" } }
            - { call: "GET /fleetcare/technicians/${t1_id}", as: ServiceCoordinator, captures: { r_committed: "$.data.committed_minutes" } }
          assert:
            - "${target} == 120 and, at arrival, ${resp} == 30 with ${met} == true — the response window closed in the arrive reply itself"
            - "${w_status} == 'RESOLVED' and ${w_resolved} == '2026-08-15T14:00:00Z' in the write's own response body"
            - "${w_resp} == 30 and ${w_met} == true — the resolve reply repeats the already-settled SLA fields rather than recomputing them from the resolve instant"
            - "${r_ev_status} == 'CLOSED', ${r_ev_minutes} == 360, ${r_ev_prov} == 4800 and ${r_ev_period} == '2026-08' on the very first read after the write"
            - "${r_life} == 'IN_SERVICE' and ${r_ytd} == 360 — the cascade into the unit was already durable"
            - "${r_prov} == 4800 and ${r_accrued} == 0 — the provisional roll-up is visible immediately, while accrual still waits for a reconciliation"
            - "${r_committed} == 0 — the assignment was released by the same write, with no delayed sweep"
            - "no read had to be repeated to observe any of these values, and no value changed between two consecutive reads"

