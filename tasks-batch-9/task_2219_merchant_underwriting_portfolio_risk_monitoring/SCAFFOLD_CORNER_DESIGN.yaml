      - name: application_info_request_and_resubmit_cycle_returns_to_verification
        claim_type: cyclic_loop
        grounds:
          - state_machines.MerchantApplication.transitions.IN_VERIFICATION_to_INFO_REQUESTED
          - state_machines.MerchantApplication.transitions.INFO_REQUESTED_to_SUBMITTED
          - calculations.business_verification_outcome
          - entities.MerchantApplication.fields.verification_attempt_count
          - entities.MerchantApplication.fields.outstanding_info_items
        distinguishing_aspect: "The application loops SUBMITTED -> IN_VERIFICATION -> INFO_REQUESTED -> SUBMITTED -> IN_VERIFICATION: the failed first attempt sets outstanding_info_items to exactly [REGISTRY_MATCH] (only the false check, in the declared order), the resubmit clears it to [], and the second attempt lands with attempt_index 2 while verification_attempt_count reaches 2 - the loop is bounded by nothing but leaves a monotonic attempt counter."
        test_recipe:
          setup:
            - "one application with one beneficial owner, submitted at clock 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Cobalt Garden", tax_id: "88-5000011", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
