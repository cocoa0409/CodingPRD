      - name: empty_batch_start_rejected_on_zero_members
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_EMPTY_BATCH]"
          - state_machines.LabBatch.OPEN_to_RUNNING
          - entities.LabBatch.fields.member_count
        distinguishing_aspect: |
          EMPTY-COLLECTION boundary (member_count == 0) on a DIFFERENT endpoint
          (POST /dna/lab-batches/{id}/start) and a DIFFERENT metric (a cardinality, not a
          numeric threshold): a batch created with sample_ids = [] is legal, but starting it
          must fail with ERR_EMPTY_BATCH (422) and leave the batch in OPEN.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. One ONLINE V5 instrument and one OPEN LabBatch created with sample_ids = [] (member_count = 0)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-7", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: [] }
              as: LabTechnician
              captures: { bat: $.data.id }
          trigger:
            - call: "POST /dna/lab-batches/${bat}/start"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_EMPTY_BATCH"
            - "LabBatch.${bat}.status == OPEN"
            - "LabBatch.${bat}.member_count == 0"
            - "LabBatch.${bat}.pass_rate == null"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: kit_activation_blocked_by_locked_subscription
        grounds:
          - state_machines.Kit.ORDERED_to_ACTIVATED
          - "validations[priority=24]"
          - "errors[ERR_SUBSCRIPTION_LOCKED]"
          - entities.Subscription.fields.access_status
        distinguishing_aspect: |
          Entity pair Kit -> Subscription: the Kit's own state is ORDERED (a perfectly valid
          from-state) and the barcode matches, yet the transition is rejected because a
          DIFFERENT entity — the owner's Subscription — has access_status = LOCKED.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer K holds a PLUS subscription and an ORDERED V5 kit."
            - "Two PAYMENT_FAILED events have driven the subscription to (PAST_DUE, LOCKED)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "k@dna.test", display_name: "Kai" }
              as: PlatformAdmin
              captures: { cK: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cK}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cK}"
              captures: { subK: $.data.id }
            - call: "POST /dna/kits"
              payload: { customer_id: "${cK}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cK}"
              captures: { kK: $.data.id, bcK: $.data.barcode }
            - call: "POST /dna/subscriptions/${subK}/billing-event"
              payload: { event_type: "PAYMENT_FAILED" }
              as: PlatformAdmin
            - call: "POST /dna/subscriptions/${subK}/billing-event"
              payload: { event_type: "PAYMENT_FAILED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dna/kits/${kK}/activate"
              payload: { barcode: "${bcK}" }
              as: Customer
              as_user_id: "${cK}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 402"
            - "${err} == ERR_SUBSCRIPTION_LOCKED"
            - "Kit.${kK}.status == ORDERED"
            - "Kit.${kK}.activated_at == null"

      - name: batch_creation_blocked_by_offline_instrument
        grounds:
          - state_machines.LabBatch.OPEN_to_RUNNING
          - "validations[priority=16]"
          - "errors[ERR_INSTRUMENT_OFFLINE]"
          - entities.LabInstrument.fields.status
        distinguishing_aspect: |
          Entity pair LabBatch -> LabInstrument — a DIFFERENT pair from Kit -> Subscription.
          The sample is EXTRACTED and chip-compatible (so ERR_SAMPLE_NOT_READY at p15 does not
          fire), but the instrument's status is MAINTENANCE, so batch creation is rejected with
          ERR_INSTRUMENT_OFFLINE at p16.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer M has an EXTRACTED V5 sample."
            - "The only instrument is a V5 instrument registered with status = MAINTENANCE."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "m@dna.test", display_name: "Mo" }
              as: PlatformAdmin
              captures: { cM: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cM}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cM}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${cM}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cM}"
              captures: { kM: $.data.id, bcM: $.data.barcode }
            - call: "POST /dna/kits/${kM}/activate"
              payload: { barcode: "${bcM}" }
              as: Customer
              as_user_id: "${cM}"
            - call: "POST /dna/kits/${kM}/receive"
              payload: {}
              as: LabTechnician
              captures: { sM: $.data.id }
            - call: "POST /dna/samples/${sM}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-OFFLINE", chip_version: "V5", status: "MAINTENANCE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${sM}"] }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INSTRUMENT_OFFLINE"
            - "Sample.${sM}.status == EXTRACTED and Sample.${sM}.batch_id == null"
            - "GET /dna/lab-batches?instrument_id=${inst} returns 0 batches"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lab_instrument_half_open_window_adjacency_allowed_overlap_rejected
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_BATCH_WINDOW_OVERLAP]"
          - entities.LabBatch.fields.run_start_at
          - entities.LabBatch.fields.run_end_at
        distinguishing_aspect: |
          Resource = LabInstrument; interval semantics = HALF-OPEN [run_start_at, run_end_at).
          A batch starting exactly at another's run_end_at (06:00) is ACCEPTED (adjacency is
          not overlap), while a window straddling 05:00-07:00 is REJECTED. This is the
          opposite adjacency rule from the CLOSED consent interval below.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. One ONLINE V5 instrument with no batches yet."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-8", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: [] }
              as: LabTechnician
              captures: { b1: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T06:00:00Z", run_end_at: "2026-05-01T08:00:00Z", sample_ids: [] }
              as: LabTechnician
              captures: { b2: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T05:00:00Z", run_end_at: "2026-05-01T07:00:00Z", sample_ids: [] }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "The first batch is created (201) with status OPEN"
            - "The second batch (starting exactly at the first's run_end_at) is created (201) — adjacency is legal under half-open semantics"
            - "The third call returns HTTP 409 and ${err} == ERR_BATCH_WINDOW_OVERLAP"
            - "GET /dna/lab-batches?instrument_id=${inst} returns exactly 2 batches"

      - name: consent_closed_interval_touching_endpoint_rejected
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_CONSENT_OVERLAP]"
          - entities.ConsentGrant.fields.effective_from
          - entities.ConsentGrant.fields.effective_until
        distinguishing_aspect: |
          Resource = (Customer, scope) consent slot — a DIFFERENT resource entity from
          LabInstrument — with CLOSED-interval semantics: a new grant whose effective_from
          equals an ACTIVE grant's effective_until DOES intersect and is rejected with
          ERR_CONSENT_OVERLAP. The identical geometry is accepted for lab batches.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer O holds one ACTIVE HEALTH_TRAITS ConsentGrant over the closed window [2026-05-01T00:00:00Z, 2026-06-01T00:00:00Z]."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "o@dna.test", display_name: "Otto" }
              as: PlatformAdmin
              captures: { cO: $.data.id }
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${cO}", scope: "HEALTH_TRAITS", effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-06-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cO}"
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${cO}", scope: "HEALTH_TRAITS", effective_from: "2026-06-01T00:00:00Z", effective_until: "2026-07-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cO}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_CONSENT_OVERLAP"
            - "GET /dna/consent-grants?customer_id=${cO}&scope=HEALTH_TRAITS returns exactly 1 grant (${g1}) with status ACTIVE"
            - "Customer.${cO}.health_opt_in == true"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: q1_monetary_wallet_plus_lifetime_charged_conserved_under_revert
        grounds:
          - state_machines.Subscription.tier_upgrade
          - state_machines.Subscription.revert_change
          - calculations.tier_change_charge
          - entities.Customer.fields.wallet_credit_cents
          - entities.Subscription.fields.lifetime_charged_cents
        distinguishing_aspect: |
          Conserved quantity Q1 is MONETARY: Customer.wallet_credit_cents +
          Subscription.lifetime_charged_cents == 10000 before change-tier, during (5184 + 4816)
          and after revert-change (10000 + 0). The compensating action leaves zero drift and
          also restores tier to PLUS and clears last_change_charge_cents.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer W on PLUS (period end 2026-05-31T00:00:00Z) with wallet_credit_cents = 10000 and lifetime_charged_cents = 0 (Q1 = 10000)."
            - "Clock advanced to 2026-05-05T00:00:00Z (26 remaining days)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "w@dna.test", display_name: "Wes" }
              as: PlatformAdmin
              captures: { cW: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cW}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cW}"
              captures: { subW: $.data.id }
            - call: "POST /dna/customers/${cW}/credits"
              payload: { amount_cents: 10000 }
              as: PlatformAdmin
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /dna/subscriptions/${subW}"
              payload: {}
              as: Customer
              as_user_id: "${cW}"
              captures: { svW: $.data.version }
          trigger:
            - call: "POST /dna/subscriptions/${subW}/change-tier"
              payload: { new_tier: "PRO", expected_subscription_version: "${svW}" }
              as: Customer
              as_user_id: "${cW}"
              captures: { midWallet: $.data.lifetime_charged_cents }
            - call: "POST /dna/subscriptions/${subW}/revert-change"
              payload: {}
              as: Customer
              as_user_id: "${cW}"
          assert:
            - "${midWallet} == 4816 (Q1 held mid-flight: 5184 wallet + 4816 charged == 10000)"
            - "Customer.${cW}.wallet_credit_cents == 10000"
            - "Subscription.${subW}.lifetime_charged_cents == 0"
            - "Subscription.${subW}.tier == PLUS"
            - "Subscription.${subW}.last_change_charge_cents == null"
            - "Subscription.${subW}.last_change_from_tier == null"

      - name: q2_counter_visible_match_count_conserved_under_withdraw_and_regrant
        grounds:
          - calculations.visible_match_count
          - state_machines.RelativeMatch.ACTIVE_to_SUPPRESSED
          - state_machines.RelativeMatch.SUPPRESSED_to_ACTIVE
          - state_machines.ConsentGrant.ACTIVE_to_WITHDRAWN
          - "validations[priority=18]"
        distinguishing_aspect: |
          Conserved quantity Q2 is a COUNTER, not money: SUM(Customer.visible_match_count)
          == 2 * count(RelativeMatch WHERE status = ACTIVE) at every observation point —
          2 == 2*1 after matching, 0 == 2*0 after the withdrawal, and 2 == 2*1 again after the
          re-grant (which is only legal once the 24h cooling-off buffer has elapsed).
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customers X and Y both DNA_READY (one batch, markers [1,2] each), both PLUS, both holding ACTIVE RELATIVE_MATCHING grants."
            - "A recompute has produced one ACTIVE RelativeMatch; visible_match_count = 1 on both (Q2 = 2 = 2 * 1)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "x@dna.test", display_name: "Xan" }
              as: PlatformAdmin
              captures: { cX: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cX}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cX}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${cX}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cX}"
              captures: { kX: $.data.id, bcX: $.data.barcode }
            - call: "POST /dna/kits/${kX}/activate"
              payload: { barcode: "${bcX}" }
              as: Customer
              as_user_id: "${cX}"
            - call: "POST /dna/kits/${kX}/receive"
              payload: {}
              as: LabTechnician
              captures: { sX: $.data.id }
            - call: "POST /dna/samples/${sX}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/customers"
              payload: { email: "y@dna.test", display_name: "Yuki" }
              as: PlatformAdmin
              captures: { cY: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cY}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cY}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${cY}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cY}"
              captures: { kY: $.data.id, bcY: $.data.barcode }
            - call: "POST /dna/kits/${kY}/activate"
              payload: { barcode: "${bcY}" }
              as: Customer
              as_user_id: "${cY}"
            - call: "POST /dna/kits/${kY}/receive"
              payload: {}
              as: LabTechnician
              captures: { sY: $.data.id }
            - call: "POST /dna/samples/${sY}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-9", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${sX}", "${sY}"] }
              as: LabTechnician
              captures: { bat: $.data.id }
            - call: "POST /dna/lab-batches/${bat}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${bat}/finalize"
              payload: { sample_results: [ { sample_id: "${sX}", call_rate: 0.99, population_scores: [ { population: "EUR", raw_score: 100 } ], genotype_markers: [1, 2] }, { sample_id: "${sY}", call_rate: 0.99, population_scores: [ { population: "EUR", raw_score: 100 } ], genotype_markers: [1, 2] } ] }
              as: LabTechnician
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${cX}", scope: "RELATIVE_MATCHING", effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cX}"
              captures: { gX: $.data.id }
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${cY}", scope: "RELATIVE_MATCHING", effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cY}"
            - call: "POST /dna/customers/${cX}/matches/recompute"
              payload: {}
              as: Customer
              as_user_id: "${cX}"
              captures: { mid: "$.data[0].id" }
          trigger:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/consent-grants/${gX}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${cX}"
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${cX}", scope: "RELATIVE_MATCHING", effective_from: "2026-05-03T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cX}"
              captures: { gX2: $.data.id }
          assert:
            - "Immediately after the withdraw: RelativeMatch.${mid}.status == SUPPRESSED, Customer.${cX}.visible_match_count == 0, Customer.${cY}.visible_match_count == 0 (Q2: 0 == 2 * 0)"
            - "The re-grant at exactly withdrawn_at + 24h is accepted (201) — the cooling-off boundary is inclusive"
            - "ConsentGrant.${gX2}.status == ACTIVE"
            - "RelativeMatch.${mid}.status == ACTIVE"
            - "Customer.${cX}.visible_match_count == 1"
            - "Customer.${cY}.visible_match_count == 1"
            - "Q2 restored with zero drift: 1 + 1 == 2 * 1 ACTIVE match; no duplicate RelativeMatch row was created (GET /dna/relative-matches?customer_a_id=${cX} plus GET /dna/relative-matches?customer_b_id=${cX} return 1 row in total)"
