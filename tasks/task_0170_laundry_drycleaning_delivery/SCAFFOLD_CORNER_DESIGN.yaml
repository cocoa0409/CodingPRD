              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/schedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est: $.data.estimate_total_cents }
          assert:
            - "Order.${order_id}.estimate_total_cents == 1800"
