              payload: { contract_id: "${cdo}", name: "Overlap Late", loop_minutes: 30, headway_minutes: 30, service_window_start_min: 440, service_window_end_min: 440, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rdo2: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3701", seat_capacity: 20, is_ada_accessible: false, odometer_km: 700, service_interval_km: 20000 }
