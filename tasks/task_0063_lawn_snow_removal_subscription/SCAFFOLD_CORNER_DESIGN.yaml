  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: equipment_rotate_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[equipment-rotate-stale-version]", entities.Equipment.fields.version, entities.Equipment.fields.assigned_route_id]
        distinguishing_aspect: "POST /equipment/{id}/rotate with expected_equipment_version equal to the current version succeeds, sets assigned_route_id to the new route, and bumps version to 2."
        test_recipe:
          setup: ["An IDLE equipment on route A (version 1) and a second route B."]
          setup_api_calls:
            - call: "POST /routes"
              payload: { region_zip: "70001", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { routeA_id: $.data.id }
            - call: "POST /routes"
              payload: { region_zip: "70002", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { routeB_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-OCC1", equipment_type: "PLOW", age_months: 4, assigned_route_id: "${routeA_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id, eq_v: $.data.version }
          trigger:
            - call: "POST /equipment/${eq_id}/rotate"
              payload: { assigned_route_id: "${routeB_id}", expected_equipment_version: "${eq_v}" }
              as: DispatchManager
              captures: { newv: $.data.version, newroute: $.data.assigned_route_id }
          assert:
            - "Equipment.${eq_id}.assigned_route_id == ${routeB_id}"
            - "Equipment.${eq_id}.version == 2"

      - name: equipment_rotate_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[equipment-rotate-stale-version]", "errors[ERR_STALE_VERSION]", "validations[priority=15]"]
        distinguishing_aspect: "A second rotate carrying the pre-first-rotate version (${eq_v} after version already advanced to 2) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Equipment rotated once already (version now 2); client still holds the version-1 token."]
          setup_api_calls:
            - call: "POST /routes"
              payload: { region_zip: "70003", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { routeA_id: $.data.id }
            - call: "POST /routes"
              payload: { region_zip: "70004", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { routeB_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-OCC2", equipment_type: "PLOW", age_months: 4, assigned_route_id: "${routeA_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id, eq_v: $.data.version }
            - call: "POST /equipment/${eq_id}/rotate"
              payload: { assigned_route_id: "${routeB_id}", expected_equipment_version: "${eq_v}" }
              as: DispatchManager
          trigger:
            - call: "POST /equipment/${eq_id}/rotate"
              payload: { assigned_route_id: "${routeA_id}", expected_equipment_version: "${eq_v}" }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: snow_dispatch_fanout_two_stops_two_visits
        claim_type: cascading_side_effects
        grounds: [state_machines.ServiceRoute.OPEN_to_DISPATCHED, state_machines.ServiceVisit.SCHEDULED_to_DISPATCHED]
        distinguishing_aspect: "Processing a >2.0 reading fans out one DISPATCHED SNOW visit per active non-opted-out stop; two stops yield two DISPATCHED visits and route -> DISPATCHED."
