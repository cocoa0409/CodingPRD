            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
