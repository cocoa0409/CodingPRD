      - name: capacity_units_conserved_under_start_complete_pair
        grounds:
          - calculations.capacity_allocation
          - entities.CapacityCommitment.fields.remaining_units
        distinguishing_aspect: |
          Conserved quantity: capacity units — committed_units ==
          allocated_units + remaining_units at all times. The forward action
          (home start allocates 1) paired with its compensating action
          (advance to COMPLETE releases 1) leaves the commitment exactly as
          before: committed 10, allocated 0, remaining 10.
        test_recipe:
          setup:
            - "Clock default; community open; plan max_starts 20; FRAMING commitment committed_units 10"
            - "Home H1 started (allocated 1, remaining 9)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
