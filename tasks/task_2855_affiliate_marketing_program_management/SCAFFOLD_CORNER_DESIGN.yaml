              as: Anonymous
              captures: { aff_std: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "SaverFeed Coupons LLC", contact_email: "saver@example.com", partner_type: "COUPON", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_res: "$.data.id" }
            - call: "POST /affiliates/${aff_std}/applications"
              payload: { site_url: "https://beacon.example", primary_traffic_source: "ORGANIC_SEARCH", monthly_traffic_estimate: 200000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_std: "$.data.id" }
            - call: "POST /affiliates/${aff_res}/applications"
              payload: { site_url: "https://saverfeed.example", primary_traffic_source: "ORGANIC_SEARCH", monthly_traffic_estimate: 200000, declared_promo_methods: ["COUPON_FEED"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_res: "$.data.id" }
          trigger:
            - call: "POST /affiliate-applications/${app_std}/screen"
              payload: { domain_authority: 72, content_originality_pct: 88, broken_link_ratio_bps: 450, brand_safety_flag_count: 5, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /affiliate-applications/${app_res}/screen"
              payload: { domain_authority: 72, content_originality_pct: 88, broken_link_ratio_bps: 450, brand_safety_flag_count: 5, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
          assert:
            - "AffiliateApplication.${app_std}.site_quality_score == 52.3 (82.3 * 1.00 - min(30, 50))"
            - "AffiliateApplication.${app_res}.site_quality_score == 29.1 (82.3 * 1.00 * 0.90 = 74.07, minus min(45, 50) = 45, rounded once)"
            - "both applications have brand_suitability_score == 40.0 (100 - 0 - 12 * 5)"
            - "both applications have screening_outcome == \"FAIL\" and review_state == \"SCREENED\" — the site-quality delta does not change the outcome here, so the two scores are the only falsifier"

      - name: attribution_credit_share_variants_both_materialised_with_delta
        claim_type: variant_divergence
        grounds:
          - calculations.attribution_resolution.variants
          - entities.AttributionDecision.fields.credit_share_bps
          - entities.AttributionDecision.fields.selected
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_attribution_credit_share_on_conversion
          rationale: "That instance already attributes the same 133000-cent order on a MEDIUM CONTENT partner and a LOW COUPON partner, asserting both AttributionDecision rows (10000 vs 3000 bps, 5320 vs 1596 cents) and that exactly one row is selected on each conversion — the full variant-divergence claim."
      - name: incrementality_score_clamps_at_zero_after_coupon_assisted_conversion
        claim_type: constants_applied
        grounds:
          - calculations.affiliate_incrementality_score.constants.PARTNER_TYPE_DISCOUNT_BPS
          - calculations.affiliate_incrementality_score.formula
          - entities.Affiliate.fields.incrementality_score_bps
          - entities.Affiliate.fields.incrementality_tier
        distinguishing_aspect: "A fresh COUPON partner is activated at exactly 4500 - 1500 = 3000 bps (LOW); after one returning-customer coupon-assisted conversion the raw expression is 0.55*0 + 0.45*(10000 - 10000) - 1500 = -1500, which must be clamped to 0 rather than stored negative or floored at the previous 3000."
