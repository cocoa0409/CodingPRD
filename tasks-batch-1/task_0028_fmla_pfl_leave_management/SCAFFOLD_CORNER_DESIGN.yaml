            - call: "POST /leave/employees"
              payload: { employer_id: "${e_id}", email: "inc@x.com", full_name: "INc", hire_date: "2024-01-01T00:00:00.000Z", hours_worked_trailing_12mo: 2000, home_state_code: "FED" }
              as: HRAdmin
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
