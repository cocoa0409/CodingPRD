              as_user_id: "fs-001"
              captures: { first_id: $.data.id, first_status: $.data.status }
          trigger:
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${facility_id}", population_count_id: "${count_id}", service_date: "2026-08-01", meal_slot: "LUNCH", forecast_variant: "ROSTER_DRIVEN" }
