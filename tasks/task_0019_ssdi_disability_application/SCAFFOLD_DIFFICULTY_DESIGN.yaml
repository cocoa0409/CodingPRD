  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: hearing_cancel_invariant_application_state_round_trip
        grounds:
          - state_machines.HearingRequest.transitions.REQUESTED_to_CANCELLED
          - state_machines.Application.transitions.RECONSIDERATION_to_ALJ_PENDING
        distinguishing_aspect: |
          Conserved quantity: Application.status (categorical conservation —
          state value before request-hearing and after request-hearing+cancel
          should be identical, i.e., RECONSIDERATION). Forward action:
          POST /applications/{id}/request-hearing. Compensating action:
          POST /hearings/{id}/cancel. Invariant pinned as:
          Application.status_at_T0 == Application.status_at_T2 ==
          RECONSIDERATION; and count(HearingRequest with
          application_id=this AND status != CANCELLED) == 0.
        test_recipe:
          setup:
            - "Claimant denied at MEDICAL_REVIEW, requests reconsideration → status=RECONSIDERATION."
            - "Capture snapshot of Application.status (must be RECONSIDERATION)."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "5555", full_name: "Round Trip", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
