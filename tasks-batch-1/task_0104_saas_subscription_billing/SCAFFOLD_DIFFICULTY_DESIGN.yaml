              captures: { sub_id: $.data.id }
            - call: "GET /subscriptions/${sub_id}"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/change-plan"
              payload: { plan_id: "${target_plan_id}", expected_subscription_version: "${sub_v}" }
