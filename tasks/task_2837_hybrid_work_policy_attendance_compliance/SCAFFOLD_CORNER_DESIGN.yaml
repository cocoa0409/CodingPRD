            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN8", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
