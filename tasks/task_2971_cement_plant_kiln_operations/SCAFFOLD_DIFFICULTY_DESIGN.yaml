          setup: >
            The canonical certificate chain through an ISSUED MC1 and LO1 for 120.00 t in
            [2026-08-05T06:00:00Z, 2026-08-05T08:00:00Z). The clock is moved into the window, the
            order is loaded and completed with loaded_tonnes 120.00, and the plant balance is read
            before and after.
