              as: Guardian
              as_user_id: "g1"
              captures: { o1: $.data.id }
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkg5}", quantity: 1 }
              as: Guardian
