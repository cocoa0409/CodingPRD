  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: change_order_apply_then_void_contract_conserved
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - state_machines.ChangeOrder.APPROVED_to_VOIDED
          - entities.Job.fields.contract_value_cents
        distinguishing_aspect: "Conserved quantity = Job.contract_value_cents. An APPLIED change order (+50000) raises it to 160000; voiding a SECOND, still-APPROVED change order leaves it unchanged at 160000 — the forward/compensating pair conserves contract value (a VOID of an unapplied CO must not touch the ledger)."
        test_recipe:
          setup:
            - "A CONTRACTED job (contract 110000); CO-A delta 50000 APPROVED then APPLIED; CO-B delta 30000 APPROVED but not applied."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
            - call: "POST /change-orders"
              payload: { job_id: "${job_id}", reason: "CO-A", delta_cents: 50000 }
              as: ProductionManager
              captures: { co_a: $.data.id }
            - call: "POST /change-orders/${co_a}/approve"
              payload: {}
              as: ProductionManager
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ProductionManager
              captures: { jv_pre_apply: $.data.version }
            - call: "POST /change-orders/${co_a}/apply"
              payload: { expected_job_version: "${jv_pre_apply}" }
              as: ProductionManager
            - call: "POST /change-orders"
              payload: { job_id: "${job_id}", reason: "CO-B", delta_cents: 30000 }
              as: ProductionManager
              captures: { co_b: $.data.id }
            - call: "POST /change-orders/${co_b}/approve"
              payload: {}
              as: ProductionManager
          trigger:
            - call: "POST /change-orders/${co_b}/void"
              payload: {}
              as: ProductionManager
          assert:
            - "ChangeOrder.${co_b}.status == VOIDED"
            - "Job.${job_id}.contract_value_cents == 160000"
            - "Job.${job_id}.remaining_billable_cents == 160000"

      - name: draw_ledger_gross_plus_remaining_conserved
        grounds:
          - state_machines.Draw.REQUESTED_to_DISBURSED
          - entities.Job.fields.disbursed_gross_cents
          - entities.Job.fields.remaining_billable_cents
          - entities.Job.fields.contract_value_cents
        distinguishing_aspect: "Different conserved quantity = the gross-billing ledger: after each DISBURSED draw, disbursed_gross_cents + remaining_billable_cents == contract_value_cents (110000) holds exactly. A draw at 40% leaves 44000 + 66000 == 110000."
