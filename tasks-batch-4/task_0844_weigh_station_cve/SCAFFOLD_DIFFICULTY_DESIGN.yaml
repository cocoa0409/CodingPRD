      - name: citation_safety_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_HAZMAT_BASIS_MISSING]
          - errors[ERR_FINE_CAP_EXCEEDED]
        distinguishing_aspect: "On POST /citations a HAZMAT citation with no HAZMAT-category violation (business_safety, p7) whose issuance would also push unpaid past FINE_CAP_CENTS (business_fiscal, p11) returns ERR_HAZMAT_BASIS_MISSING — safety outranks fiscal."
