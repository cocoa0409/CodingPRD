          - validations.p32
          - errors.ERR_COIL_INSUFFICIENT_MASS
          - errors.ERR_RUN_MASS_EXCEEDS_RESERVED
          - calculations.coil_mass_ledger
        distinguishing_aspect: "Both fiscal gates are at-or-below comparisons and both are probed one gram over and then exactly on the limit: planned_kg 30000.0 against remaining_kg 20000.0 is rejected, and consumed 6410.4 plus scrap 300.0 is rejected against a 6600.0 reservation while consumed 6410.4 plus scrap 189.6 - summing to exactly 6600.0 - is accepted. The completion also proves the ledger hands mass from reserved to consumed and scrap rather than double-counting it: remaining_kg is 13400.0 both while the run is SCHEDULED and after it is COMPLETED, from two different subtractions."
