scenario: |
  Generate task harder than expert level!
  2621. Fire Protection System Design & Hydraulic Calculation (fire protection engineering firm): hazard classification and occupancy commodity analysis driving density and design area, water supply testing with flow test data and safety margin evaluation, hydraulic calculation to demonstrate the most demanding area with pipe sizing iterations, fire pump sizing, standpipe and hose demand additions, special hazard systems for cooking, storage and hazardous materials, shop drawing coordination with structural, mechanical and lighting trades, authority having jurisdiction review comments and resubmittal cycles, acceptance testing witness and as-built documentation
domain_name: fire-protection-hydraulic-design
api_prefix: ""
difficulty_level: Expert

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers: [derived_field_reconciliation, cascading_side_effects, optimistic_concurrency, dual_variant_calculation]

  entity_topology: flat
  # Every entity is a top-level collection addressed as /<collection>/{id}; parentage is
  # expressed only through FK fields carried in request bodies. Two append-only child
  # segments (/hydraulic-calculations/{id}/iterations, /shop-drawings/{id}/trade-clearances)
  # are event logs under their owner, not a URL hierarchy over the whole model.

  state_machine_shape: cyclic
  # HydraulicCalculation (PRESSURE_DEFICIENT -> ITERATING -> CONVERGED -> ITERATING),
  # Submittal (UNDER_REVIEW -> COMMENTS_ISSUED -> RESPONSE_COMPLETE -> UNDER_REVIEW),
  # ReviewComment (OPEN -> RESPONDED -> OPEN), Project (ACCEPTANCE -> CORRECTIVE_ACTION ->
  # ACCEPTANCE) all loop. AcceptanceTest additionally carries two parallel dimensions
  # (witness_status x documentation_status) that advance independently.

  relationship_patterns:
    - one_to_many
    - self_referential      # Submittal.supersedes_submittal_id -> Submittal.id (resubmittal lineage)
    - cross_aggregate       # HydraulicCalculation <-> WaterSupplyEvaluation <-> FirePump reconcile across aggregates

  role_model: segregation_of_duties
  # The engineer who authored a HydraulicCalculation may not QC-review it; only the author
  # may seal it; the AHJ reviewer assigned to the project is the only actor who may review,
  # comment on, or witness that project's work.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Engineer
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: "Licensed design professional employed by the fire protection engineering firm"
      - name: license_state
        type: string
        source: input
        description: "Two-letter USPS state code in which the PE licence is registered"
        constraints: "exactly 2 uppercase letters"
      - name: license_number
        type: string
        source: input
        description: "Professional engineer licence number carried on the seal"
      - name: license_status
        type: enum
        source: input
        description: "Standing of the PE licence at the moment of sealing"
        default: ACTIVE
        constraints: "one of [ACTIVE, EXPIRED, SUSPENDED]"
      - name: discipline
        type: enum
        source: input
        description: "Engineering discipline the person practises"
        default: FIRE_PROTECTION
        constraints: "one of [FIRE_PROTECTION, MECHANICAL, ELECTRICAL]"

  - name: AhjReviewer
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: "Plan examiner acting for the authority having jurisdiction"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Code of the jurisdiction this examiner reviews for, e.g. TX-AUS"
      - name: discipline
        type: enum
        source: input
        description: "Review discipline the examiner is credentialled for"
        default: FIRE
        constraints: "one of [FIRE, BUILDING, ELECTRICAL]"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: project_number
        type: string
        source: input
        description: "Firm job number for the sprinkler design package"
      - name: building_name
        type: string
        source: input
        description: "Name of the protected building"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction whose fire code governs this design"
      - name: jurisdiction_state
        type: string
        source: input
        description: "Two-letter USPS state code whose PE registration is required to seal this package"
        constraints: "exactly 2 uppercase letters"
      - name: occupancy_type
        type: enum
        source: input
        description: "Occupancy classification of the protected building"
        constraints: "one of [STORAGE, MERCANTILE, INDUSTRIAL, ASSEMBLY, HEALTHCARE]"
      - name: building_height_ft
        type: number
        source: input
        description: "Height of the highest occupied floor above grade, used by the standpipe demand cap"
        constraints: "> 0"
      - name: underground_lead_in_loss_psi
        type: number
        source: input
        description: "Fixed friction allowance for the underground lead-in between the city main and the base of riser"
        default: 0.0
        constraints: ">= 0"
      - name: lead_engineer_id
        type: string
        source: input
        description: "FK -> Engineer.id; the only engineer permitted to author, seal and revise design objects on this project"
      - name: ahj_reviewer_id
        type: string
        source: input
        description: "FK -> AhjReviewer.id; the only plan examiner permitted to review, comment on and witness this project"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle stage of the permit and acceptance workflow"
        default: DESIGN
        constraints: "one of [DESIGN, PERMIT_REVIEW, PERMITTED, ACCEPTANCE, CORRECTIVE_ACTION, CLOSED_OUT]"
      - name: design_posture
        type: enum
        source: computed
        description: "Derived gate over child design mutations; recomputed by calculations.project_design_posture on every project, comment, calculation or acceptance-test write"
        default: OPEN
        constraints: "one of [OPEN, GATED, FROZEN]"
      - name: governing_hydraulic_calculation_id
        type: string
        source: computed
        description: "FK -> HydraulicCalculation.id; the most demanding eligible calculation selected by calculations.project_demand_ledger, null when no eligible calculation exists"
      - name: governing_demand_gpm
        type: number
        source: computed
        description: "hazard_total_demand_gpm of the governing calculation, 0.0 when there is none"
        default: 0.0
      - name: auxiliary_demand_gpm
        type: number
        source: computed
        description: "Sum of demand_gpm over this project's AuxiliarySystem rows whose status is not WITHDRAWN"
        default: 0.0
      - name: total_system_demand_gpm
        type: number
        source: computed
        description: "governing_demand_gpm + auxiliary_demand_gpm, the design demand the water supply must satisfy"
        default: 0.0
      - name: sealed_calculation_count
        type: integer
        source: computed
        description: "Count of this project's HydraulicCalculation rows whose state is SEALED"
        default: 0
      - name: open_major_comment_count
        type: integer
        source: computed
        description: "Count of ReviewComment rows with severity MAJOR and state in {OPEN, RESPONDED} across this project's submittals"
        default: 0
      - name: submittal_cycle_count
        type: integer
        source: computed
        description: "Number of Submittal rows created for this project, i.e. the cycle number of the newest submittal"
        default: 0
      - name: review_fee_balance_usd
        type: number
        source: computed
        description: "Unpaid resubmittal review fees; incremented by calculations.resubmittal_fee_schedule and decremented by fee payments"
        default: 0.0
      - name: pump_required_flag
        type: boolean
        source: computed
        description: "Set true when any supply-connection iteration lands in PRESSURE_DEFICIENT or the newest EVALUATED evaluation verdict is INADEQUATE_PUMP_REQUIRED"
        default: false

  - name: HazardArea
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project this hazard area belongs to"
      - name: label
        type: string
        source: input
        description: "Designer label for the area, e.g. Rack Zone A"
      - name: hazard_class
        type: enum
        source: input
        description: "Occupancy hazard classification declared by the designer before commodity escalation"
        constraints: "one of [LIGHT, ORDINARY_1, ORDINARY_2, EXTRA_1, EXTRA_2]"
      - name: commodity_class
        type: enum
        source: input
        description: "Stored commodity classification driving the escalation rule"
        constraints: "one of [CLASS_I, CLASS_II, CLASS_III, CLASS_IV, GROUP_A_PLASTIC]"
      - name: storage_height_ft
        type: number
        source: input
        description: "Height of the top of storage above the floor"
        constraints: ">= 0"
      - name: ceiling_height_ft
        type: number
        source: input
        description: "Height of the sprinkler deflector plane above the floor"
        constraints: "> 0"
      - name: area_sqft
        type: number
        source: input
        description: "Gross floor area of the hazard area; caps the design area"
        constraints: "> 0"
      - name: sprinkler_system_type
        type: enum
        source: input
        description: "System type; DRY and PREACTION incur the design-area increase"
        constraints: "one of [WET, DRY, PREACTION]"
      - name: ceiling_slope_pct
        type: number
        source: input
        description: "Ceiling slope as a percentage; above the slope threshold the design area is increased"
        default: 0.0
        constraints: ">= 0"
      - name: room_area_sqft
        type: number
        source: input
        description: "Floor area of the enclosing room, required by the ROOM_DESIGN variant of calculations.hazard_design_demand"
        default: null
        constraints: "> 0 when present"
      - name: enclosure_rating_hours
        type: number
        source: input
        description: "Fire resistance rating of the room enclosure in hours; ROOM_DESIGN requires at least ROOM_DESIGN_MIN_ENCLOSURE_HOURS"
        default: null
        constraints: ">= 0 when present"
      - name: room_has_unprotected_opening
        type: boolean
        source: input
        description: "True when the room has an unprotected opening, adding the ROOM_DESIGN opening penalty"
        default: false
      - name: effective_hazard_class
        type: enum
        source: computed
        description: "hazard_class after the commodity escalation rule of calculations.hazard_classification"
        constraints: "one of [LIGHT, ORDINARY_1, ORDINARY_2, EXTRA_1, EXTRA_2]"
      - name: design_density
        type: number
        source: computed
        description: "Design discharge density in gpm per square foot, 3 decimal places"
      - name: design_area_sqft
        type: number
        source: computed
        description: "Area of sprinkler operation after dry-system, slope and gross-area capping adjustments"
      - name: hose_allowance_gpm
        type: number
        source: computed
        description: "Inside and outside hose stream allowance implied by effective_hazard_class"
      - name: reclassification_count
        type: integer
        source: computed
        description: "Number of successful reclassify calls applied to this hazard area"
        default: 0

  - name: FlowTest
    parent: null
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose water supply was tested"
      - name: hydrant_tag
        type: string
        source: input
        description: "Field tag of the flowed hydrant"
      - name: static_psi
        type: number
        source: input
        description: "Static pressure observed with no flow"
        constraints: "> 0"
      - name: residual_psi
        type: number
        source: input
        description: "Residual pressure observed while flowing flow_gpm"
        constraints: "> 0 and < static_psi"
      - name: flow_gpm
        type: number
        source: input
        description: "Measured test flow in gallons per minute"
        constraints: "> 0"
      - name: tested_at
        type: datetime
        source: input
        description: "Instant the flow test was witnessed in the field; must be within FLOW_TEST_VALIDITY_DAYS of the logical clock when used"

  - name: WaterSupplyEvaluation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose supply is being evaluated"
      - name: flow_test_id
        type: string
        source: input
        description: "FK -> FlowTest.id; the flow test whose curve is projected to the design demand"
      - name: governing_hydraulic_calculation_id
        type: string
        source: input
        description: "FK -> HydraulicCalculation.id; the calculation whose demand and required pressure this evaluation is measured against"
      - name: evaluation_basis
        type: enum
        source: input
        description: "Which variant of calculations.water_supply_availability applies"
        constraints: "one of [RAW_TEST, SEASONAL_ADJUSTED]"
      - name: basis_static_psi
        type: number
        source: computed
        description: "Static pressure of the evaluation basis after the seasonal allowance, if any"
      - name: basis_residual_psi
        type: number
        source: computed
        description: "Residual pressure of the evaluation basis after the seasonal allowance, if any"
      - name: basis_test_flow_gpm
        type: number
        source: computed
        description: "Test flow of the evaluation basis after the seasonal derate, if any"
      - name: design_demand_gpm
        type: number
        source: computed
        description: "hazard_total_demand_gpm of the referenced calculation plus the project's auxiliary_demand_gpm"
      - name: required_psi_at_demand
        type: number
        source: computed
        description: "required_psi_at_base_of_riser of the referenced calculation plus the project's underground_lead_in_loss_psi"
      - name: available_psi_at_demand
        type: number
        source: computed
        description: "Pressure the supply can deliver at design_demand_gpm, from the projected test curve"
      - name: safety_margin_psi
        type: number
        source: computed
        description: "available_psi_at_demand minus required_psi_at_demand"
      - name: safety_margin_pct
        type: number
        source: computed
        description: "safety_margin_psi divided by available_psi_at_demand, expressed as a percentage to 1 decimal place"
      - name: margin_verdict
        type: enum
        source: computed
        description: "Threshold verdict over safety_margin_psi"
        constraints: "one of [ADEQUATE, MARGINAL, INADEQUATE_PUMP_REQUIRED]"
      - name: pinned_calculation_iteration_count
        type: integer
        source: computed
        description: "iteration_count of the referenced calculation at the instant of evaluation; part of the seal-time reconciliation triple"
      - name: pump_sized
        type: boolean
        source: computed
        description: "Set true when a FirePump has been sized against this evaluation"
        default: false
      - name: state
        type: enum
        source: computed
        description: "EVALUATED until a newer evaluation for the same project is created or the referenced calculation is reopened"
        default: EVALUATED
        constraints: "one of [EVALUATED, SUPERSEDED]"

  - name: HydraulicCalculation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project this calculation belongs to"
      - name: hazard_area_id
        type: string
        source: input
        description: "FK -> HazardArea.id; the most demanding area this calculation demonstrates"
      - name: authored_by_engineer_id
        type: string
        source: computed
        description: "FK -> Engineer.id; taken from the X-User-ID of the creating DesignEngineer"
      - name: qc_reviewed_by_engineer_id
        type: string
        source: computed
        description: "FK -> Engineer.id; the QcReviewer who dispositioned the calculation, null before QC"
        default: null
      - name: sealed_by_engineer_id
        type: string
        source: computed
        description: "FK -> Engineer.id; the engineer whose seal is applied, null until SEALED"
        default: null
      - name: reopened_by_submittal_id
        type: string
        source: computed
        description: "FK -> Submittal.id; the submittal whose MAJOR comments reopened this calculation, null otherwise"
        default: null
      - name: method
        type: enum
        source: input
        description: "Which variant of calculations.hazard_design_demand applies to this calculation"
        constraints: "one of [AREA_DENSITY, ROOM_DESIGN]"
      - name: k_factor
        type: number
        source: input
        description: "Discharge coefficient of the end sprinkler head used to convert flow to end-head pressure"
        constraints: "> 0"
      - name: design_flow_gpm
        type: number
        source: computed
        description: "Sprinkler demand of the hazard area under this calculation's method; the flow the supply-connection iteration must carry"
      - name: hose_allowance_gpm
        type: number
        source: computed
        description: "Hose allowance snapshot copied from the hazard area at creation and on reclassification"
      - name: room_design_penalty_gpm
        type: number
        source: computed
        description: "Unprotected-opening penalty added by the ROOM_DESIGN variant, 0.0 under AREA_DENSITY"
        default: 0.0
      - name: hazard_total_demand_gpm
        type: number
        source: computed
        description: "design_flow_gpm + hose_allowance_gpm; the figure the project demand ledger ranks calculations by"
      - name: chain_start_index
        type: integer
        source: computed
        description: "Lowest iteration_index belonging to the active chain; raised by a restart_chain iteration so superseded iterations stay on the record"
        default: 1
      - name: iteration_count
        type: integer
        source: computed
        description: "Number of iterations in the active chain, i.e. rows with iteration_index >= chain_start_index"
        default: 0
      - name: end_head_psi
        type: number
        source: computed
        description: "Pressure required at the end sprinkler head of the active chain, (flow of the first active iteration / k_factor) squared"
        default: 0.0
      - name: required_psi_at_base_of_riser
        type: number
        source: computed
        description: "Cumulative pressure after the newest active iteration, i.e. end head plus all friction and elevation losses"
        default: 0.0
      - name: deficiency_psi
        type: number
        source: computed
        description: "Shortfall recorded when a supply-connection iteration lands in PRESSURE_DEFICIENT, null otherwise"
        default: null
      - name: stale_reason
        type: enum
        source: computed
        description: "Why the calculation left a settled state, null while it has never been reopened or rejected"
        default: null
        constraints: "one of [HAZARD_RECLASSIFIED, MAJOR_COMMENT, QC_REJECTED]"
      - name: sealed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the seal was applied, null until SEALED"
        default: null
      - name: state
        type: enum
        source: computed
        description: "Design lifecycle of the calculation"
        default: DRAFT
        constraints: "one of [DRAFT, ITERATING, CONVERGED, PRESSURE_DEFICIENT, QC_PASSED, SEALED, REOPENED, ARCHIVED]"

  - name: PipeSizingIteration
    parent: HydraulicCalculation
    common_fields: false
    fields:
      - name: hydraulic_calculation_id
        type: string
        source: input
        description: "FK -> HydraulicCalculation.id; calculation this append-only iteration belongs to"
      - name: iteration_index
        type: integer
        source: input
        description: "Position of this segment in the chain; must equal the calculation's current iteration row count plus one"
        constraints: ">= 1"
      - name: pipe_size_in
        type: enum
        source: input
        description: "Nominal pipe size whose Schedule 40 internal diameter enters the friction formula"
        constraints: "one of ['1', '1.25', '1.5', '2', '2.5', '3', '4', '6', '8']"
      - name: length_ft
        type: number
        source: input
        description: "Centre-line pipe length of the segment"
        constraints: "> 0"
      - name: fitting_equivalent_ft
        type: number
        source: input
        description: "Equivalent length of the segment's fittings and valves"
        constraints: ">= 0"
      - name: flow_gpm
        type: number
        source: input
        description: "Flow carried by this segment"
        constraints: "> 0"
      - name: elevation_change_ft
        type: number
        source: input
        description: "Rise from the previous node to this node; negative values are drops"
      - name: is_supply_connection
        type: boolean
        source: input
        description: "True when this segment terminates at the base of riser and closes the chain against the water supply"
        default: false
      - name: restart_chain
        type: boolean
        source: input
        description: "True when this iteration opens a revised chain, raising the calculation's chain_start_index to this iteration_index"
        default: false
      - name: friction_loss_psi
        type: number
        source: computed
        description: "Hazen-Williams friction loss over length_ft + fitting_equivalent_ft at flow_gpm"
      - name: elevation_loss_psi
        type: number
        source: computed
        description: "elevation_change_ft multiplied by the elevation head constant"
      - name: velocity_fps
        type: number
        source: computed
        description: "Flow velocity in the segment; above VELOCITY_LIMIT_FPS the iteration is rejected"
      - name: cumulative_psi_after
        type: number
        source: computed
        description: "Running pressure at the downstream node of this segment, per-iteration rounded"
      - name: in_active_chain
        type: boolean
        source: computed
        description: "True while iteration_index >= the calculation's chain_start_index"
        default: true

  - name: FirePump
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project the pump is sized for"
      - name: water_supply_evaluation_id
        type: string
        source: input
        description: "FK -> WaterSupplyEvaluation.id; the evaluation whose deficiency the pump makes up"
      - name: model_tag
        type: string
        source: input
        description: "Manufacturer model tag recorded on the pump schedule"
        default: "TBD"
      - name: rated_flow_gpm
        type: number
        source: computed
        description: "Smallest catalogue rating that is >= the evaluation's design_demand_gpm"
      - name: suction_psi_at_rated
        type: number
        source: computed
        description: "Supply pressure available at rated_flow_gpm, not at design_demand_gpm"
      - name: required_discharge_psi
        type: number
        source: computed
        description: "Evaluation required_psi_at_demand plus the pump safety allowance"
      - name: rated_pressure_psi
        type: number
        source: computed
        description: "Selected rated pressure, rounded up to the catalogue step and floored at MIN_RATED_PRESSURE_PSI"
      - name: churn_discharge_psi
        type: number
        source: computed
        description: "Discharge pressure at churn, rated_pressure_psi * CHURN_FACTOR plus the basis static pressure"
      - name: flow_150_pct_gpm
        type: number
        source: computed
        description: "150 percent of rated_flow_gpm, the overload test point"
      - name: suction_psi_at_150_pct
        type: number
        source: computed
        description: "Supply pressure available at flow_150_pct_gpm"
      - name: available_psi_at_150_pct
        type: number
        source: computed
        description: "rated_pressure_psi * OVERLOAD_FACTOR plus suction_psi_at_150_pct"
      - name: sizing_verdict
        type: enum
        source: computed
        description: "Ordered verdict from calculations.fire_pump_sizing"
        constraints: "one of [ACCEPTABLE, REQUIRES_PRESSURE_RELIEF_VALVE, INSUFFICIENT_SUCTION_AT_150_PCT, INSUFFICIENT_AT_150_PCT]"
      - name: state
        type: enum
        source: computed
        description: "SIZED at creation, ACCEPTED once a PUMP_FLOW_TEST passes, SUPERSEDED when its evaluation is superseded"
        default: SIZED
        constraints: "one of [SIZED, ACCEPTED, SUPERSEDED]"

  - name: AuxiliarySystem
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project this auxiliary or special hazard system serves"
      - name: hazard_area_id
        type: string
        source: input
        description: "FK -> HazardArea.id; area protected by an IN_RACK system, null for system types that do not reference an area"
        default: null
      - name: system_type
        type: enum
        source: input
        description: "Which branch of calculations.auxiliary_system_demand applies"
        constraints: "one of [STANDPIPE_CLASS_I, STANDPIPE_CLASS_II, COOKING, IN_RACK, FOAM_DELUGE, HAZMAT_DELUGE]"
      - name: label
        type: string
        source: input
        description: "Designer label for the auxiliary system"
      - name: riser_count
        type: integer
        source: input
        description: "Number of standpipe risers; required for STANDPIPE_CLASS_I and STANDPIPE_CLASS_II"
        default: null
        constraints: ">= 1 when present"
      - name: appliance_count
        type: integer
        source: input
        description: "Number of protected cooking appliances; required for COOKING"
        default: null
        constraints: ">= 1 when present"
      - name: water_wash_enabled
        type: boolean
        source: input
        description: "True when the kitchen hood has a water-wash cycle, adding its fixed demand"
        default: false
      - name: in_rack_head_count
        type: integer
        source: input
        description: "Number of in-rack sprinklers assumed operating; required for IN_RACK"
        default: null
        constraints: ">= 1 when present"
      - name: protected_area_sqft
        type: number
        source: input
        description: "Area covered by a deluge system; required for FOAM_DELUGE and HAZMAT_DELUGE"
        default: null
        constraints: "> 0 when present"
      - name: agent_type
        type: enum
        source: input
        description: "Suppression agent used by a special hazard system"
        default: NONE
        constraints: "one of [WET_CHEMICAL, AFFF, HIGH_EXPANSION_FOAM, NONE]"
      - name: demand_gpm
        type: number
        source: computed
        description: "Water demand this system adds to the project ledger while its status is not WITHDRAWN"
      - name: interlock_required
        type: boolean
        source: computed
        description: "True for COOKING and HAZMAT_DELUGE, which may not be commissioned without a verified interlock"
      - name: interlock_verified
        type: boolean
        source: computed
        description: "Set from the commissioning request; the commissioning is rejected when interlock_required and this is not true"
        default: false
      - name: outage_start_at
        type: datetime
        source: computed
        description: "Start of the commissioning outage window, inclusive; null before commissioning"
        default: null
      - name: outage_end_at
        type: datetime
        source: computed
        description: "End of the commissioning outage window, exclusive; null before commissioning"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Commissioning lifecycle of the auxiliary system"
        default: PROPOSED
        constraints: "one of [PROPOSED, COMMISSIONED, DECOMMISSIONED_PENDING_RETEST, WITHDRAWN]"

  - name: ShopDrawing
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project the sheet belongs to"
      - name: hydraulic_calculation_id
        type: string
        source: input
        description: "FK -> HydraulicCalculation.id; the sealed calculation this sheet details"
      - name: sheet_number
        type: string
        source: input
        description: "Sheet number of the shop drawing, e.g. FP-101"
      - name: required_trade_count
        type: integer
        source: computed
        description: "Number of trades that must clear the sheet, fixed at REQUIRED_TRADES cardinality"
        default: 3
      - name: cleared_trade_count
        type: integer
        source: computed
        description: "Count of this sheet's TradeClearance rows whose state is CLEARED"
        default: 0
      - name: state
        type: enum
        source: computed
        description: "Coordination lifecycle of the sheet"
        default: DRAFT
        constraints: "one of [DRAFT, IN_COORDINATION, COORDINATED, CONFLICTED, STALE, ISSUED]"

  - name: TradeClearance
    parent: ShopDrawing
    common_fields: true
    fields:
      - name: shop_drawing_id
        type: string
        source: input
        description: "FK -> ShopDrawing.id; sheet being coordinated"
      - name: trade
        type: enum
        source: input
        description: "Trade whose work occupies the same ceiling space"
        constraints: "one of [STRUCTURAL, MECHANICAL, LIGHTING]"
      - name: elevation_low_in
        type: number
        source: input
        description: "Lowest elevation above finished floor claimed by the trade, in inches"
      - name: elevation_high_in
        type: number
        source: input
        description: "Highest elevation above finished floor claimed by the trade, in inches; must exceed elevation_low_in"
      - name: conflict_severity
        type: enum
        source: computed
        description: "Severity supplied when a conflict is recorded, null while the clearance carries no conflict"
        default: null
        constraints: "one of [BLOCKING, ADVISORY]"
      - name: note
        type: string
        source: computed
        description: "Free text recorded with the newest disposition, null until first recorded"
        default: null
      - name: state
        type: enum
        source: computed
        description: "Clearance lifecycle for one trade on one sheet"
        default: PENDING
        constraints: "one of [PENDING, CLEARED, CONFLICT_OPEN, STALE, LOCKED]"

  - name: Submittal
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose package is submitted for permit"
      - name: supersedes_submittal_id
        type: string
        source: input
        description: "FK -> Submittal.id; the prior cycle this package replaces, null on the first cycle"
        default: null
      - name: reviewed_by_ahj_reviewer_id
        type: string
        source: computed
        description: "FK -> AhjReviewer.id; examiner who opened review on this package, null before review starts"
        default: null
      - name: included_calculation_ids
        type: array
        source: input
        description: "FK -> HydraulicCalculation.id; ids of the sealed calculations bound into this package, at least one"
        constraints: "non-empty array of HydraulicCalculation ids, no duplicates"
      - name: cycle_number
        type: integer
        source: computed
        description: "Project submittal cycle this package represents, starting at 1"
      - name: review_fee_usd
        type: number
        source: computed
        description: "Fee charged for this cycle by calculations.resubmittal_fee_schedule"
      - name: open_comment_count
        type: integer
        source: computed
        description: "Count of this package's ReviewComment rows whose state is in {OPEN, RESPONDED}"
        default: 0
      - name: major_comment_count
        type: integer
        source: computed
        description: "Count of this package's ReviewComment rows with severity MAJOR whose state is in {OPEN, RESPONDED}"
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the package was submitted"
      - name: state
        type: enum
        source: computed
        description: "Permit review lifecycle of the package"
        default: SUBMITTED
        constraints: "one of [SUBMITTED, UNDER_REVIEW, COMMENTS_ISSUED, RESPONSE_COMPLETE, APPROVED, SUPERSEDED]"

  - name: ReviewComment
    parent: Submittal
    common_fields: true
    fields:
      - name: submittal_id
        type: string
        source: input
        description: "FK -> Submittal.id; package the comment was raised against"
      - name: raised_by_ahj_reviewer_id
        type: string
        source: computed
        description: "FK -> AhjReviewer.id; taken from the X-User-ID of the commenting examiner"
      - name: assigned_engineer_id
        type: string
        source: input
        description: "FK -> Engineer.id; engineer the examiner directs the comment to, null when unassigned"
        default: null
      - name: code_section
        type: string
        source: input
        description: "Code citation the comment is written against, e.g. NFPA 13 23.4.4.7"
      - name: severity
        type: enum
        source: input
        description: "Comment severity; MAJOR comments gate the project and reopen sealed calculations"
        constraints: "one of [MAJOR, MINOR, INFORMATIONAL]"
      - name: description
        type: string
        source: input
        description: "Body of the examiner's comment"
      - name: response_note
        type: string
        source: computed
        description: "Designer's written response, null until responded"
        default: null
      - name: close_note
        type: string
        source: computed
        description: "Examiner's note recorded with the disposition, null until closed"
        default: null
      - name: disposition
        type: enum
        source: computed
        description: "How the examiner closed or bounced the comment, null while the comment has never been dispositioned"
        default: null
        constraints: "one of [RESOLVED, REJECT_RESPONSE, WITHDRAWN]"
      - name: state
        type: enum
        source: computed
        description: "Comment lifecycle; REJECT_RESPONSE returns the comment to OPEN"
        default: OPEN
        constraints: "one of [OPEN, RESPONDED, RESOLVED, WITHDRAWN]"

  - name: AcceptanceTest
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project being accepted"
      - name: witness_reviewer_id
        type: string
        source: computed
        description: "FK -> AhjReviewer.id; examiner booked to witness the test, null while NOT_SCHEDULED"
        default: null
      - name: test_type
        type: enum
        source: input
        description: "Which acceptance test this row records"
        constraints: "one of [SYSTEM_FLOW_TEST, PUMP_FLOW_TEST, HYDROSTATIC_TEST, STANDPIPE_FLOW_TEST]"
      - name: required_flow_gpm
        type: number
        source: computed
        description: "Flow the witnessed test must reach, from calculations.acceptance_thresholds"
      - name: required_residual_psi
        type: number
        source: computed
        description: "Residual pressure the witnessed test must hold at required_flow_gpm"
      - name: measured_flow_gpm
        type: number
        source: computed
        description: "Flow recorded by the witnessing examiner, null before the witness is recorded"
        default: null
      - name: measured_residual_psi
        type: number
        source: computed
        description: "Residual pressure recorded by the witnessing examiner, null before the witness is recorded"
        default: null
      - name: witness_window_start
        type: datetime
        source: computed
        description: "Start of the booked witness window, inclusive; null while NOT_SCHEDULED"
        default: null
      - name: witness_window_end
        type: datetime
        source: computed
        description: "End of the booked witness window, inclusive; null while NOT_SCHEDULED"
        default: null
      - name: witness_status
        type: enum
        source: computed
        description: "Witness dimension of this row, independent of documentation_status"
        default: NOT_SCHEDULED
        constraints: "one of [NOT_SCHEDULED, SCHEDULED, WITNESSED_PASS, WITNESSED_FAIL]"
      - name: documentation_status
        type: enum
        source: computed
        description: "As-built documentation dimension of this row, independent of witness_status"
        default: PENDING
        constraints: "one of [PENDING, AS_BUILT_SUBMITTED, AS_BUILT_ACCEPTED, AS_BUILT_REJECTED]"
      - name: as_built_document_ref
        type: string
        source: computed
        description: "Reference of the newest as-built package submitted, null while PENDING"
        default: null
      - name: retest_count
        type: integer
        source: computed
        description: "Number of times this test has been rescheduled after a witnessed failure"
        default: 0

state_machines:
  - entity: Project
    state_field: status
    initial_state: DESIGN
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: DESIGN
        to: PERMIT_REVIEW
        trigger: "POST /submittals"
        actor: DesignEngineer
        preconditions:
          - "project.design_posture != FROZEN"
          - "project.open_major_comment_count == 0"
          - "every id in included_calculation_ids names a HydraulicCalculation with state == SEALED and project_id == this project"
          - "every ShopDrawing whose hydraulic_calculation_id is in included_calculation_ids has state in {COORDINATED, ISSUED}"
          - "expected_project_version equals project.version"
        side_effects:
          - "status := PERMIT_REVIEW"
          - "submittal_cycle_count := submittal_cycle_count + 1"
          - "review_fee_balance_usd := review_fee_balance_usd + calculations.resubmittal_fee_schedule output for the new cycle_number"
          - "recompute design_posture via calculations.project_design_posture"
          - "increments Project.version by 1"
      - from: PERMIT_REVIEW
        to: PERMITTED
        trigger: "POST /submittals/{id}/complete-review with submittal.open_comment_count == 0"
        actor: AhjReviewer
        preconditions:
          - "submittal.state == UNDER_REVIEW"
          - "submittal.open_comment_count == 0"
        side_effects:
          - "status := PERMITTED"
          - "submittal.state := APPROVED"
          - "each ShopDrawing whose hydraulic_calculation_id is in submittal.included_calculation_ids and whose state == COORDINATED becomes ISSUED"
          - "recompute design_posture via calculations.project_design_posture"
          - "increments Project.version by 1"
      - from: PERMITTED
        to: ACCEPTANCE
        trigger: "POST /acceptance-tests"
        actor: Contractor
        preconditions:
          - "project.status == PERMITTED or project.status == ACCEPTANCE"
          - "project.governing_hydraulic_calculation_id is not null"
          - "every ShopDrawing of this project has state == ISSUED"
        side_effects:
          - "status := ACCEPTANCE"
          - "AcceptanceTest created with required_flow_gpm and required_residual_psi from calculations.acceptance_thresholds"
          - "increments Project.version by 1"
      - from: ACCEPTANCE
        to: CORRECTIVE_ACTION
        trigger: "POST /acceptance-tests/{id}/record-witness whose measurement fails calculations.acceptance_thresholds"
        actor: AhjReviewer
        preconditions:
          - "acceptance_test.witness_status == SCHEDULED"
          - "X-User-ID == project.ahj_reviewer_id"
        side_effects:
          - "status := CORRECTIVE_ACTION"
          - "acceptance_test.witness_status := WITNESSED_FAIL"
          - "cascade link 2: every AuxiliarySystem of this project whose status == COMMISSIONED becomes DECOMMISSIONED_PENDING_RETEST with outage_start_at and outage_end_at cleared to null"
          - "design_posture := FROZEN"
          - "increments Project.version by 1"
      - from: CORRECTIVE_ACTION
        to: ACCEPTANCE
        trigger: "POST /acceptance-tests/{id}/schedule-witness on a WITNESSED_FAIL test"
        actor: AhjReviewer
        preconditions:
          - "acceptance_test.witness_status == WITNESSED_FAIL"
          - "witness window does not collide with the reviewer calendar per validations priority 40"
        side_effects:
          - "status := ACCEPTANCE"
          - "acceptance_test.witness_status := SCHEDULED"
          - "acceptance_test.retest_count := retest_count + 1"
          - "recompute design_posture via calculations.project_design_posture"
          - "increments Project.version by 1"
      - from: ACCEPTANCE
        to: CLOSED_OUT
        trigger: "POST /acceptance-tests/{id}/accept-as-built that makes every AcceptanceTest of the project WITNESSED_PASS and AS_BUILT_ACCEPTED"
        actor: AhjReviewer
        preconditions:
          - "after this write, every AcceptanceTest with this project_id has witness_status == WITNESSED_PASS and documentation_status == AS_BUILT_ACCEPTED"
        side_effects:
          - "status := CLOSED_OUT"
          - "design_posture := FROZEN"
          - "every HydraulicCalculation of this project whose state == SEALED becomes ARCHIVED"
          - "increments Project.version by 1"
        note: "Compound bubble-up: the parent transitions only when the full child set is terminal on both dimensions."

  - entity: HydraulicCalculation
    state_field: state
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ITERATING
        trigger: "POST /hydraulic-calculations/{id}/iterations"
        actor: DesignEngineer
        preconditions:
          - "project.design_posture != FROZEN"
          - "iteration_index == 1"
          - "restart_chain is false or absent"
          - "velocity_fps <= VELOCITY_LIMIT_FPS"
        side_effects:
          - "state := ITERATING"
          - "iteration_count := 1"
          - "end_head_psi and required_psi_at_base_of_riser recomputed by calculations.pipe_sizing_chain"
          - "increments HydraulicCalculation.version by 1"
      - from: ITERATING
        to: ITERATING
        trigger: "POST /hydraulic-calculations/{id}/iterations with is_supply_connection false"
        actor: DesignEngineer
        preconditions:
          - "iteration_index == count of existing iteration rows + 1"
          - "velocity_fps <= VELOCITY_LIMIT_FPS"
        side_effects:
          - "iteration_count := iteration_count + 1"
          - "required_psi_at_base_of_riser := cumulative_psi_after of this iteration"
          - "increments HydraulicCalculation.version by 1"
      - from: ITERATING
        to: CONVERGED
        trigger: "POST /hydraulic-calculations/{id}/iterations with is_supply_connection true, closing against an adequate supply"
        actor: DesignEngineer
        preconditions:
          - "flow_gpm == calculation.design_flow_gpm"
          - "a WaterSupplyEvaluation with this project_id and state == EVALUATED exists"
          - "round(cumulative_psi_after + project.underground_lead_in_loss_psi, 2) <= that evaluation's available_psi_at_demand"
        side_effects:
          - "state := CONVERGED"
          - "deficiency_psi := null"
          - "project.governing_hydraulic_calculation_id, governing_demand_gpm and total_system_demand_gpm recomputed by calculations.project_demand_ledger"
          - "increments HydraulicCalculation.version by 1"
      - from: ITERATING
        to: PRESSURE_DEFICIENT
        trigger: "POST /hydraulic-calculations/{id}/iterations with is_supply_connection true, closing against an inadequate supply"
        actor: DesignEngineer
        preconditions:
          - "flow_gpm == calculation.design_flow_gpm"
          - "a WaterSupplyEvaluation with this project_id and state == EVALUATED exists"
          - "round(cumulative_psi_after + project.underground_lead_in_loss_psi, 2) > that evaluation's available_psi_at_demand"
        side_effects:
          - "state := PRESSURE_DEFICIENT"
          - "deficiency_psi := round(required_psi_at_demand candidate - available_psi_at_demand, 2)"
          - "project.pump_required_flag := true"
          - "calculation is excluded from calculations.project_demand_ledger, so the ledger is recomputed without it"
          - "increments HydraulicCalculation.version by 1"
        note: "Divergent branch of the same trigger as ITERATING -> CONVERGED; the two branches write different fields on different entities."
      - from: PRESSURE_DEFICIENT
        to: ITERATING
        trigger: "POST /hydraulic-calculations/{id}/iterations with restart_chain true"
        actor: DesignEngineer
        preconditions:
          - "restart_chain == true"
          - "iteration_index == count of existing iteration rows + 1"
        side_effects:
          - "chain_start_index := iteration_index of this iteration"
          - "iteration_count := 1"
          - "all earlier iterations get in_active_chain false and remain on the record"
          - "end_head_psi recomputed from this iteration's flow_gpm"
          - "increments HydraulicCalculation.version by 1"
      - from: REOPENED
        to: ITERATING
        trigger: "POST /hydraulic-calculations/{id}/iterations with restart_chain true"
        actor: DesignEngineer
        preconditions:
          - "restart_chain == true"
          - "project.design_posture != FROZEN"
        side_effects:
          - "chain_start_index := iteration_index of this iteration"
          - "iteration_count := 1"
          - "stale_reason := null"
          - "increments HydraulicCalculation.version by 1"
      - from: CONVERGED
        to: QC_PASSED
        trigger: "POST /hydraulic-calculations/{id}/qc-review with disposition PASS"
        actor: QcReviewer
        preconditions:
          - "state == CONVERGED"
          - "X-User-ID != authored_by_engineer_id"
        side_effects:
          - "state := QC_PASSED"
          - "qc_reviewed_by_engineer_id := X-User-ID"
          - "increments HydraulicCalculation.version by 1"
      - from: CONVERGED
        to: ITERATING
        trigger: "POST /hydraulic-calculations/{id}/qc-review with disposition REJECT"
        actor: QcReviewer
        preconditions:
          - "state == CONVERGED"
          - "X-User-ID != authored_by_engineer_id"
        side_effects:
          - "state := ITERATING"
          - "stale_reason := QC_REJECTED"
          - "qc_reviewed_by_engineer_id := X-User-ID"
          - "calculation leaves the eligible set, so calculations.project_demand_ledger is recomputed without it"
          - "increments HydraulicCalculation.version by 1"
      - from: QC_PASSED
        to: SEALED
        trigger: "POST /hydraulic-calculations/{id}/seal"
        actor: DesignEngineer
        preconditions:
          - "state == QC_PASSED"
          - "X-User-ID == authored_by_engineer_id == project.lead_engineer_id"
          - "sealing engineer license_status == ACTIVE"
          - "sealing engineer license_state == project.jurisdiction_state"
          - "the newest WaterSupplyEvaluation of the project with state == EVALUATED reconciles per validations priority 23"
          - "that evaluation's margin_verdict != INADEQUATE_PUMP_REQUIRED, or a FirePump with state == SIZED and sizing_verdict == ACCEPTABLE references it"
        side_effects:
          - "state := SEALED"
          - "sealed_by_engineer_id := X-User-ID"
          - "sealed_at := logical clock"
          - "project.sealed_calculation_count := sealed_calculation_count + 1"
          - "increments HydraulicCalculation.version by 1"
      - from: SEALED
        to: REOPENED
        trigger: "POST /submittals/{id}/complete-review that issues at least one MAJOR comment"
        actor: system
        preconditions:
          - "calculation id appears in submittal.included_calculation_ids"
          - "state == SEALED"
        side_effects:
          - "state := REOPENED"
          - "stale_reason := MAJOR_COMMENT"
          - "reopened_by_submittal_id := submittal.id"
          - "project.sealed_calculation_count := sealed_calculation_count - 1"
          - "cascade link 3: every ShopDrawing with this hydraulic_calculation_id whose state == COORDINATED becomes STALE"
          - "increments HydraulicCalculation.version by 1"
        note: "Link 2 of cascade A; caused by the submittal's own transition to COMMENTS_ISSUED, not by the reviewer's request directly."
      - from: REOPENED
        to: SEALED
        trigger: "POST /review-comments/{id}/close with disposition WITHDRAWN that clears the last open comment of the submittal"
        actor: system
        preconditions:
          - "state == REOPENED"
          - "stale_reason == MAJOR_COMMENT"
          - "reopened_by_submittal_id == the comment's submittal_id"
        side_effects:
          - "state := SEALED"
          - "stale_reason := null"
          - "reopened_by_submittal_id := null"
          - "project.sealed_calculation_count := sealed_calculation_count + 1"
          - "every ShopDrawing with this hydraulic_calculation_id whose state == STALE returns to COORDINATED and its STALE TradeClearance rows return to CLEARED, restoring cleared_trade_count to required_trade_count"
          - "increments HydraulicCalculation.version by 1"
        note: "Compensating action for cascade A; reverses links 2, 3 and 4 with no drift in Project.sealed_calculation_count."
      - from: CONVERGED
        to: REOPENED
        trigger: "POST /hazard-areas/{id}/reclassify"
        actor: DesignEngineer
        preconditions:
          - "calculation.hazard_area_id == the reclassified hazard area"
        side_effects:
          - "state := REOPENED"
          - "stale_reason := HAZARD_RECLASSIFIED"
          - "design_flow_gpm, hose_allowance_gpm, room_design_penalty_gpm and hazard_total_demand_gpm re-snapshotted by calculations.hazard_design_demand"
          - "calculations.project_demand_ledger recomputed without this calculation"
          - "increments HydraulicCalculation.version by 1"
      - from: QC_PASSED
        to: REOPENED
        trigger: "POST /hazard-areas/{id}/reclassify"
        actor: DesignEngineer
        preconditions:
          - "calculation.hazard_area_id == the reclassified hazard area"
        side_effects:
          - "state := REOPENED"
          - "stale_reason := HAZARD_RECLASSIFIED"
          - "qc_reviewed_by_engineer_id := null"
          - "demand snapshots re-taken and calculations.project_demand_ledger recomputed"
          - "increments HydraulicCalculation.version by 1"
      - from: SEALED
        to: REOPENED
        trigger: "POST /hazard-areas/{id}/reclassify"
        actor: DesignEngineer
        preconditions:
          - "calculation.hazard_area_id == the reclassified hazard area"
        side_effects:
          - "state := REOPENED"
          - "stale_reason := HAZARD_RECLASSIFIED"
          - "sealed_by_engineer_id := null and sealed_at := null"
          - "project.sealed_calculation_count := sealed_calculation_count - 1"
          - "cascade link 2: every WaterSupplyEvaluation whose governing_hydraulic_calculation_id is this calculation and whose state == EVALUATED becomes SUPERSEDED"
          - "increments HydraulicCalculation.version by 1"
        note: "Link 1 of cascade C originates on HazardArea; this row is that cascade's second hop."
      - from: SEALED
        to: ARCHIVED
        trigger: "POST /acceptance-tests/{id}/accept-as-built that closes out the project"
        actor: system
        preconditions:
          - "project.status becomes CLOSED_OUT on this write"
        side_effects:
          - "state := ARCHIVED"
          - "increments HydraulicCalculation.version by 1"

  - entity: WaterSupplyEvaluation
    state_field: state
    initial_state: EVALUATED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: EVALUATED
        to: SUPERSEDED
        trigger: "POST /water-supply-evaluations for the same project_id"
        actor: system
        preconditions:
          - "a newer WaterSupplyEvaluation with the same project_id is created"
        side_effects:
          - "state := SUPERSEDED"
          - "cascade: every FirePump whose water_supply_evaluation_id is this evaluation and whose state == SIZED becomes SUPERSEDED"
          - "increments WaterSupplyEvaluation.version by 1"
      - from: EVALUATED
        to: SUPERSEDED
        trigger: "POST /hazard-areas/{id}/reclassify that reopens the referenced calculation"
        actor: system
        preconditions:
          - "governing_hydraulic_calculation_id names a calculation transitioning to REOPENED"
        side_effects:
          - "state := SUPERSEDED"
          - "cascade link 3: every FirePump whose water_supply_evaluation_id is this evaluation and whose state == SIZED becomes SUPERSEDED"
          - "increments WaterSupplyEvaluation.version by 1"
        note: "Link 3 of cascade C: HazardArea reclassify -> HydraulicCalculation REOPENED -> WaterSupplyEvaluation SUPERSEDED -> FirePump SUPERSEDED."

  - entity: FirePump
    state_field: state
    initial_state: SIZED
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: SIZED
        to: SUPERSEDED
        trigger: "WaterSupplyEvaluation transition EVALUATED -> SUPERSEDED"
        actor: system
        preconditions:
          - "water_supply_evaluation_id names the evaluation being superseded"
        side_effects:
          - "state := SUPERSEDED"
          - "increments FirePump.version by 1"
      - from: SIZED
        to: ACCEPTED
        trigger: "POST /acceptance-tests/{id}/record-witness on a PUMP_FLOW_TEST that passes"
        actor: AhjReviewer
        preconditions:
          - "acceptance_test.test_type == PUMP_FLOW_TEST"
          - "pump.project_id == acceptance_test.project_id"
          - "pump.state == SIZED"
        side_effects:
          - "state := ACCEPTED"
          - "increments FirePump.version by 1"

  - entity: AuxiliarySystem
    state_field: status
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: COMMISSIONED
        trigger: "POST /auxiliary-systems/{id}/commission"
        actor: Contractor
        preconditions:
          - "project.design_posture != FROZEN"
          - "outage_start_at < outage_end_at"
          - "interlock_verified == true when interlock_required"
          - "the half-open window does not raise the project's concurrent outage count above MAX_CONCURRENT_OUTAGES per validations priority 41"
        side_effects:
          - "status := COMMISSIONED"
          - "outage_start_at and outage_end_at recorded"
          - "interlock_verified recorded"
          - "increments AuxiliarySystem.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /auxiliary-systems/{id}/withdraw"
        actor: DesignEngineer
        preconditions:
          - "project.design_posture != FROZEN"
        side_effects:
          - "status := WITHDRAWN"
          - "project.auxiliary_demand_gpm and total_system_demand_gpm recomputed by calculations.project_demand_ledger without this system"
          - "increments AuxiliarySystem.version by 1"
      - from: COMMISSIONED
        to: DECOMMISSIONED_PENDING_RETEST
        trigger: "Project transition ACCEPTANCE -> CORRECTIVE_ACTION"
        actor: system
        preconditions:
          - "status == COMMISSIONED"
        side_effects:
          - "status := DECOMMISSIONED_PENDING_RETEST"
          - "outage_start_at := null and outage_end_at := null"
          - "demand_gpm is unchanged and the system stays in the ledger set because its status is not WITHDRAWN"
          - "increments AuxiliarySystem.version by 1"
        note: "Link 2 of cascade B; conditional cascade that skips PROPOSED and WITHDRAWN siblings."
      - from: DECOMMISSIONED_PENDING_RETEST
        to: COMMISSIONED
        trigger: "POST /auxiliary-systems/{id}/commission"
        actor: Contractor
        preconditions:
          - "project.design_posture != FROZEN"
          - "outage window passes validations priority 41"
        side_effects:
          - "status := COMMISSIONED"
          - "outage window re-recorded"
          - "increments AuxiliarySystem.version by 1"
      - from: DECOMMISSIONED_PENDING_RETEST
        to: WITHDRAWN
        trigger: "POST /auxiliary-systems/{id}/withdraw"
        actor: DesignEngineer
        preconditions:
          - "project.design_posture != FROZEN"
        side_effects:
          - "status := WITHDRAWN"
          - "project ledger recomputed without this system"
          - "increments AuxiliarySystem.version by 1"

  - entity: ShopDrawing
    state_field: state
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: IN_COORDINATION
        trigger: "POST /shop-drawings/{id}/trade-clearances"
        actor: Contractor
        preconditions:
          - "no TradeClearance with this shop_drawing_id and the same trade exists"
        side_effects:
          - "state := IN_COORDINATION"
          - "increments ShopDrawing.version by 1"
      - from: IN_COORDINATION
        to: COORDINATED
        trigger: "POST /trade-clearances/{id}/record with outcome CLEARED raising cleared_trade_count to required_trade_count"
        actor: DesignEngineer
        preconditions:
          - "cleared_trade_count + 1 == required_trade_count"
        side_effects:
          - "cleared_trade_count := required_trade_count"
          - "state := COORDINATED"
          - "increments ShopDrawing.version by 1"
      - from: IN_COORDINATION
        to: CONFLICTED
        trigger: "POST /trade-clearances/{id}/record with outcome CONFLICT_OPEN and conflict_severity BLOCKING"
        actor: DesignEngineer
        preconditions:
          - "conflict_severity == BLOCKING"
        side_effects:
          - "state := CONFLICTED"
          - "increments ShopDrawing.version by 1"
        note: "An ADVISORY conflict leaves the sheet IN_COORDINATION."
      - from: CONFLICTED
        to: IN_COORDINATION
        trigger: "POST /trade-clearances/{id}/record with outcome CLEARED while cleared_trade_count + 1 < required_trade_count"
        actor: DesignEngineer
        preconditions:
          - "no remaining TradeClearance of this sheet has state == CONFLICT_OPEN with conflict_severity BLOCKING"
        side_effects:
          - "state := IN_COORDINATION"
          - "cleared_trade_count := cleared_trade_count + 1"
          - "increments ShopDrawing.version by 1"
      - from: CONFLICTED
        to: COORDINATED
        trigger: "POST /trade-clearances/{id}/record with outcome CLEARED raising cleared_trade_count to required_trade_count"
        actor: DesignEngineer
        preconditions:
          - "cleared_trade_count + 1 == required_trade_count"
          - "no remaining TradeClearance of this sheet has state == CONFLICT_OPEN"
        side_effects:
          - "state := COORDINATED"
          - "increments ShopDrawing.version by 1"
      - from: COORDINATED
        to: STALE
        trigger: "HydraulicCalculation transition SEALED -> REOPENED"
        actor: system
        preconditions:
          - "hydraulic_calculation_id names the reopened calculation"
          - "state == COORDINATED"
        side_effects:
          - "state := STALE"
          - "cascade link 4: every TradeClearance of this sheet whose state == CLEARED becomes STALE"
          - "cleared_trade_count := 0"
          - "increments ShopDrawing.version by 1"
        note: "Link 3 of cascade A."
      - from: STALE
        to: IN_COORDINATION
        trigger: "POST /trade-clearances/{id}/record with outcome CLEARED while cleared_trade_count + 1 < required_trade_count"
        actor: DesignEngineer
        preconditions:
          - "the referenced calculation state is not REOPENED"
        side_effects:
          - "state := IN_COORDINATION"
          - "cleared_trade_count := cleared_trade_count + 1"
          - "increments ShopDrawing.version by 1"
      - from: STALE
        to: COORDINATED
        trigger: "HydraulicCalculation transition REOPENED -> SEALED by the withdraw compensation"
        actor: system
        preconditions:
          - "hydraulic_calculation_id names the restored calculation"
          - "state == STALE"
        side_effects:
          - "state := COORDINATED"
          - "every TradeClearance of this sheet whose state == STALE returns to CLEARED"
          - "cleared_trade_count := required_trade_count"
          - "increments ShopDrawing.version by 1"
      - from: COORDINATED
        to: ISSUED
        trigger: "Submittal transition UNDER_REVIEW -> APPROVED"
        actor: system
        preconditions:
          - "hydraulic_calculation_id appears in the approved submittal's included_calculation_ids"
          - "state == COORDINATED"
        side_effects:
          - "state := ISSUED"
          - "every TradeClearance of this sheet whose state == CLEARED becomes LOCKED"
          - "increments ShopDrawing.version by 1"

  - entity: TradeClearance
    state_field: state
    initial_state: PENDING
    terminal_states: [LOCKED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /trade-clearances/{id}/record with outcome CLEARED"
        actor: DesignEngineer
        preconditions:
          - "shop_drawing.state in {IN_COORDINATION, CONFLICTED, STALE}"
          - "X-User-ID == project.lead_engineer_id"
        side_effects:
          - "state := CLEARED"
          - "conflict_severity := null"
          - "shop_drawing.cleared_trade_count := cleared_trade_count + 1"
          - "increments TradeClearance.version by 1"
      - from: PENDING
        to: CONFLICT_OPEN
        trigger: "POST /trade-clearances/{id}/record with outcome CONFLICT_OPEN"
        actor: DesignEngineer
        preconditions:
          - "conflict_severity is supplied"
        side_effects:
          - "state := CONFLICT_OPEN"
          - "conflict_severity recorded"
          - "increments TradeClearance.version by 1"
      - from: CONFLICT_OPEN
        to: CLEARED
        trigger: "POST /trade-clearances/{id}/record with outcome CLEARED"
        actor: DesignEngineer
        preconditions:
          - "shop_drawing.state in {IN_COORDINATION, CONFLICTED, STALE}"
        side_effects:
          - "state := CLEARED"
          - "conflict_severity := null"
          - "shop_drawing.cleared_trade_count := cleared_trade_count + 1"
          - "increments TradeClearance.version by 1"
      - from: CLEARED
        to: STALE
        trigger: "ShopDrawing transition COORDINATED -> STALE"
        actor: system
        preconditions:
          - "state == CLEARED"
        side_effects:
          - "state := STALE"
          - "increments TradeClearance.version by 1"
        note: "Link 4 of cascade A."
      - from: STALE
        to: CLEARED
        trigger: "POST /trade-clearances/{id}/record with outcome CLEARED"
        actor: DesignEngineer
        preconditions:
          - "shop_drawing.state in {STALE, IN_COORDINATION}"
        side_effects:
          - "state := CLEARED"
          - "shop_drawing.cleared_trade_count := cleared_trade_count + 1"
          - "increments TradeClearance.version by 1"
      - from: CLEARED
        to: LOCKED
        trigger: "ShopDrawing transition COORDINATED -> ISSUED"
        actor: system
        preconditions:
          - "state == CLEARED"
        side_effects:
          - "state := LOCKED"
          - "increments TradeClearance.version by 1"

  - entity: Submittal
    state_field: state
    initial_state: SUBMITTED
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /submittals/{id}/begin-review"
        actor: AhjReviewer
        preconditions:
          - "X-User-ID == project.ahj_reviewer_id"
          - "project.review_fee_balance_usd == 0.0"
        side_effects:
          - "state := UNDER_REVIEW"
          - "reviewed_by_ahj_reviewer_id := X-User-ID"
          - "increments Submittal.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /submittals/{id}/complete-review with open_comment_count == 0"
        actor: AhjReviewer
        preconditions:
          - "open_comment_count == 0"
        side_effects:
          - "state := APPROVED"
          - "project.status := PERMITTED"
          - "every COORDINATED ShopDrawing of the included calculations becomes ISSUED"
          - "increments Submittal.version by 1"
      - from: UNDER_REVIEW
        to: COMMENTS_ISSUED
        trigger: "POST /submittals/{id}/complete-review with open_comment_count >= 1"
        actor: AhjReviewer
        preconditions:
          - "open_comment_count >= 1"
        side_effects:
          - "state := COMMENTS_ISSUED"
          - "cascade link 2 when major_comment_count >= 1: every SEALED HydraulicCalculation in included_calculation_ids becomes REOPENED"
          - "project.open_major_comment_count recomputed, driving design_posture to GATED"
          - "increments Submittal.version by 1"
        note: "Link 1 of cascade A."
      - from: COMMENTS_ISSUED
        to: RESPONSE_COMPLETE
        trigger: "POST /review-comments/{id}/respond that leaves no ReviewComment of this submittal in state OPEN"
        actor: DesignEngineer
        preconditions:
          - "after this write, no ReviewComment with this submittal_id has state == OPEN"
        side_effects:
          - "state := RESPONSE_COMPLETE"
          - "increments Submittal.version by 1"
        note: "Bubble-up from the child comment set."
      - from: RESPONSE_COMPLETE
        to: UNDER_REVIEW
        trigger: "POST /submittals/{id}/begin-review"
        actor: AhjReviewer
        preconditions:
          - "X-User-ID == project.ahj_reviewer_id"
          - "project.review_fee_balance_usd == 0.0"
        side_effects:
          - "state := UNDER_REVIEW"
          - "increments Submittal.version by 1"
        note: "Closes the review cycle: UNDER_REVIEW -> COMMENTS_ISSUED -> RESPONSE_COMPLETE -> UNDER_REVIEW."
      - from: COMMENTS_ISSUED
        to: UNDER_REVIEW
        trigger: "POST /review-comments/{id}/close with disposition WITHDRAWN that clears the last open comment"
        actor: system
        preconditions:
          - "after this write, open_comment_count == 0"
        side_effects:
          - "state := UNDER_REVIEW"
          - "compensating cascade: every HydraulicCalculation reopened by this submittal returns to SEALED, its STALE ShopDrawing rows return to COORDINATED and their STALE TradeClearance rows return to CLEARED"
          - "project.open_major_comment_count and sealed_calculation_count recomputed"
          - "increments Submittal.version by 1"
      - from: COMMENTS_ISSUED
        to: SUPERSEDED
        trigger: "POST /submittals/{id}/resubmit"
        actor: DesignEngineer
        preconditions:
          - "cycle_number < MAX_SUBMITTAL_CYCLES"
          - "X-User-ID == project.lead_engineer_id"
          - "expected_project_version equals project.version"
        side_effects:
          - "state := SUPERSEDED"
          - "a new Submittal is created in SUBMITTED with cycle_number + 1 and supersedes_submittal_id set to this submittal"
          - "project.review_fee_balance_usd increased by the new cycle's review_fee_usd"
          - "increments Submittal.version by 1"
      - from: RESPONSE_COMPLETE
        to: SUPERSEDED
        trigger: "POST /submittals/{id}/resubmit"
        actor: DesignEngineer
        preconditions:
          - "cycle_number < MAX_SUBMITTAL_CYCLES"
          - "expected_project_version equals project.version"
        side_effects:
          - "state := SUPERSEDED"
          - "successor Submittal created in SUBMITTED with cycle_number + 1"
          - "project.review_fee_balance_usd increased by the new cycle's review_fee_usd"
          - "increments Submittal.version by 1"

  - entity: ReviewComment
    state_field: state
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /review-comments/{id}/respond"
        actor: DesignEngineer
        preconditions:
          - "submittal.state == COMMENTS_ISSUED"
          - "X-User-ID == project.lead_engineer_id"
        side_effects:
          - "state := RESPONDED"
          - "response_note recorded"
          - "submittal.open_comment_count unchanged, submittal may bubble to RESPONSE_COMPLETE"
          - "increments ReviewComment.version by 1"
      - from: RESPONDED
        to: RESOLVED
        trigger: "POST /review-comments/{id}/close with disposition RESOLVED"
        actor: AhjReviewer
        preconditions:
          - "state == RESPONDED"
          - "X-User-ID == project.ahj_reviewer_id"
        side_effects:
          - "state := RESOLVED"
          - "disposition := RESOLVED"
          - "submittal.open_comment_count and major_comment_count recomputed"
          - "project.open_major_comment_count recomputed, possibly returning design_posture to OPEN"
          - "increments ReviewComment.version by 1"
      - from: RESPONDED
        to: OPEN
        trigger: "POST /review-comments/{id}/close with disposition REJECT_RESPONSE"
        actor: AhjReviewer
        preconditions:
          - "state == RESPONDED"
        side_effects:
          - "state := OPEN"
          - "disposition := REJECT_RESPONSE"
          - "response_note := null"
          - "submittal returns to COMMENTS_ISSUED if it had bubbled to RESPONSE_COMPLETE"
          - "increments ReviewComment.version by 1"
        note: "Revision cycle on the comment itself."
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /review-comments/{id}/close with disposition WITHDRAWN"
        actor: AhjReviewer
        preconditions:
          - "state == OPEN"
          - "X-User-ID == project.ahj_reviewer_id"
        side_effects:
          - "state := WITHDRAWN"
          - "disposition := WITHDRAWN"
          - "submittal.open_comment_count and major_comment_count recomputed"
          - "when open_comment_count reaches 0 the submittal returns to UNDER_REVIEW and the cascade A compensation runs"
          - "increments ReviewComment.version by 1"

  - entity: AcceptanceTest
    state_field: witness_status
    initial_state: NOT_SCHEDULED
    terminal_states: [WITNESSED_PASS]
    transitions:
      - from: NOT_SCHEDULED
        to: SCHEDULED
        trigger: "POST /acceptance-tests/{id}/schedule-witness"
        actor: AhjReviewer
        preconditions:
          - "witness_window_start < witness_window_end"
          - "witness_window_start >= logical clock"
          - "witness_reviewer_id == project.ahj_reviewer_id"
          - "the closed window inflated by WITNESS_BUFFER_MINUTES does not intersect another SCHEDULED window of the same reviewer"
        side_effects:
          - "witness_status := SCHEDULED"
          - "witness_reviewer_id, witness_window_start and witness_window_end recorded"
          - "documentation_status is not touched"
          - "increments AcceptanceTest.version by 1"
      - from: SCHEDULED
        to: WITNESSED_PASS
        trigger: "POST /acceptance-tests/{id}/record-witness with measured_flow_gpm >= required_flow_gpm and measured_residual_psi >= required_residual_psi"
        actor: AhjReviewer
        preconditions:
          - "witness_status == SCHEDULED"
          - "X-User-ID == witness_reviewer_id"
        side_effects:
          - "witness_status := WITNESSED_PASS"
          - "measured values recorded"
          - "when test_type == PUMP_FLOW_TEST every SIZED FirePump of the project becomes ACCEPTED"
          - "increments AcceptanceTest.version by 1"
      - from: SCHEDULED
        to: WITNESSED_FAIL
        trigger: "POST /acceptance-tests/{id}/record-witness with a measurement below either threshold"
        actor: AhjReviewer
        preconditions:
          - "witness_status == SCHEDULED"
        side_effects:
          - "witness_status := WITNESSED_FAIL"
          - "cascade link 1: project.status := CORRECTIVE_ACTION and design_posture := FROZEN"
          - "increments AcceptanceTest.version by 1"
        note: "Head of cascade B."
      - from: WITNESSED_FAIL
        to: SCHEDULED
        trigger: "POST /acceptance-tests/{id}/schedule-witness"
        actor: AhjReviewer
        preconditions:
          - "witness_status == WITNESSED_FAIL"
          - "the new window passes the reviewer calendar check"
        side_effects:
          - "witness_status := SCHEDULED"
          - "retest_count := retest_count + 1"
          - "project.status returns to ACCEPTANCE and design_posture is recomputed"
          - "increments AcceptanceTest.version by 1"

  - entity: AcceptanceTest
    state_field: documentation_status
    initial_state: PENDING
    terminal_states: [AS_BUILT_ACCEPTED]
    transitions:
      - from: PENDING
        to: AS_BUILT_SUBMITTED
        trigger: "POST /acceptance-tests/{id}/submit-as-built"
        actor: Contractor
        preconditions:
          - "project.status != CLOSED_OUT"
        side_effects:
          - "documentation_status := AS_BUILT_SUBMITTED"
          - "as_built_document_ref recorded"
          - "witness_status is not touched"
          - "increments AcceptanceTest.version by 1"
        note: "Independent of the witness dimension: legal from any witness_status other than the closed-out project lock."
      - from: AS_BUILT_SUBMITTED
        to: AS_BUILT_ACCEPTED
        trigger: "POST /acceptance-tests/{id}/accept-as-built with disposition ACCEPTED"
        actor: AhjReviewer
        preconditions:
          - "documentation_status == AS_BUILT_SUBMITTED"
          - "witness_status == WITNESSED_PASS"
          - "X-User-ID == project.ahj_reviewer_id"
        side_effects:
          - "documentation_status := AS_BUILT_ACCEPTED"
          - "project may bubble to CLOSED_OUT when every sibling test is terminal on both dimensions"
          - "increments AcceptanceTest.version by 1"
        note: "The only join point between the two dimensions."
      - from: AS_BUILT_SUBMITTED
        to: AS_BUILT_REJECTED
        trigger: "POST /acceptance-tests/{id}/accept-as-built with disposition REJECTED"
        actor: AhjReviewer
        preconditions:
          - "documentation_status == AS_BUILT_SUBMITTED"
        side_effects:
          - "documentation_status := AS_BUILT_REJECTED"
          - "increments AcceptanceTest.version by 1"
      - from: AS_BUILT_REJECTED
        to: AS_BUILT_SUBMITTED
        trigger: "POST /acceptance-tests/{id}/submit-as-built"
        actor: Contractor
        preconditions:
          - "documentation_status == AS_BUILT_REJECTED"
        side_effects:
          - "documentation_status := AS_BUILT_SUBMITTED"
          - "as_built_document_ref replaced"
          - "increments AcceptanceTest.version by 1"

concurrency_rules:
  - rule_id: submittal-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /submittals"
    occ_field: "expected_project_version"
    description: |
      Creating a Submittal against a Project whose version has advanced since
      the client last read it is rejected. A submittal package binds the project's
      sealed calculation set, demand ledger and fee balance as they stood when the
      client assembled the package; any intervening write - a new sealed calculation,
      a withdrawn auxiliary system, a fee payment - advances Project.version and makes
      the client's view of the package contents stale. The same guard covers
      POST /submittals/{id}/resubmit, which legitimately supersedes the prior cycle.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: pump-size-stale-evaluation
    parent_entity: WaterSupplyEvaluation
    write_endpoint: "POST /fire-pumps"
    occ_field: "expected_water_supply_evaluation_version"
    description: |
      Sizing a FirePump against a WaterSupplyEvaluation whose version has advanced
      since the client read it is rejected. A pump selection legitimately supersedes
      any prior selection made against the same evaluation, so the second writer's
      request would otherwise succeed on identical state; the stale version check
      makes the outcome deterministic by requiring the writer to have observed the
      evaluation as it stood, including its pump_sized flag.
    error_id: ERR_STALE_SUPPLY_EVALUATION_VERSION
    http_status: 412

calculations:
  - name: hazard_classification
    trigger: "POST /hazard-areas and POST /hazard-areas/{id}/reclassify"
    algorithm: threshold
    formula: |
      BASE = { LIGHT: (0.100, 1500), ORDINARY_1: (0.150, 1500), ORDINARY_2: (0.200, 1500),
               EXTRA_1: (0.300, 2500), EXTRA_2: (0.400, 2500) }              # (density, area)
      ORDER = [LIGHT, ORDINARY_1, ORDINARY_2, EXTRA_1, EXTRA_2]
      HOSE  = { LIGHT: 100.0, ORDINARY_1: 250.0, ORDINARY_2: 250.0, EXTRA_1: 500.0, EXTRA_2: 500.0 }

      # step 1 - commodity escalation, at most ONE step up ORDER, plastics tested first
      if commodity_class == GROUP_A_PLASTIC and storage_height_ft > PLASTIC_STORAGE_TRIGGER_FT:
          effective_hazard_class = ORDER[min(index_of(hazard_class) + 1, 4)]
      elif commodity_class == CLASS_IV and storage_height_ft > CLASS_IV_STORAGE_TRIGGER_FT:
          effective_hazard_class = ORDER[min(index_of(hazard_class) + 1, 4)]
      else:
          effective_hazard_class = hazard_class
      density, area = BASE[effective_hazard_class]

      # step 2 - design area adjustments, applied in exactly this order, multiplicatively
      if sprinkler_system_type in {DRY, PREACTION}: area = area * DRY_AREA_MULTIPLIER
      if ceiling_slope_pct > SLOPE_TRIGGER_PCT:     area = area * SLOPE_AREA_MULTIPLIER

      # step 3 - high ceiling density bump, stepwise and capped
      if ceiling_height_ft > HIGH_CEILING_TRIGGER_FT:
          steps   = floor((ceiling_height_ft - HIGH_CEILING_TRIGGER_FT) / CEILING_BUMP_STEP_FT)
          density = density + min(MAX_CEILING_DENSITY_BUMP, steps * CEILING_BUMP_PER_STEP)

      design_density     = round_half_up(density, 3)
      design_area_sqft   = min(round_half_up(area, 0), area_sqft)     # gross area caps the design area
      hose_allowance_gpm = HOSE[effective_hazard_class]
    input_set: "The single HazardArea row being created or reclassified; no other rows participate"
    constants:
      PLASTIC_STORAGE_TRIGGER_FT: 12.0
      CLASS_IV_STORAGE_TRIGGER_FT: 15.0
      DRY_AREA_MULTIPLIER: 1.30
      SLOPE_TRIGGER_PCT: 16.7
      SLOPE_AREA_MULTIPLIER: 1.30
      HIGH_CEILING_TRIGGER_FT: 30.0
      CEILING_BUMP_STEP_FT: 5.0
      CEILING_BUMP_PER_STEP: 0.02
      MAX_CEILING_DENSITY_BUMP: 0.06
    precision: "design_density 3 decimal places, design_area_sqft 0 decimal places, hose_allowance_gpm 1 decimal place, all round_half_up"

  - name: hazard_design_demand
    trigger: "POST /hydraulic-calculations, and re-snapshotted by POST /hazard-areas/{id}/reclassify on every calculation referencing that area"
    algorithm: aggregation
    formula: |
      # basis_area and penalty come from the variant selected by HydraulicCalculation.method
      design_flow_gpm         = round_half_up(hazard_area.design_density * basis_area * OVERDISCHARGE_FACTOR + room_design_penalty_gpm, 1)
      hose_allowance_gpm      = hazard_area.hose_allowance_gpm
      hazard_total_demand_gpm = round_half_up(design_flow_gpm + hose_allowance_gpm, 1)
    input_set: "One HazardArea row and the HydraulicCalculation.method that selects the variant"
    constants:
      OVERDISCHARGE_FACTOR: 1.10
      ROOM_OPENING_PENALTY_FACTOR: 0.25
      ROOM_DESIGN_MIN_ENCLOSURE_HOURS: 1.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: AREA_DENSITY
        when: "HydraulicCalculation.method == AREA_DENSITY"
        difference: "basis_area = hazard_area.design_area_sqft and room_design_penalty_gpm = 0.0; the opening penalty and the enclosure requirement do not apply"
      - name: ROOM_DESIGN
        when: "HydraulicCalculation.method == ROOM_DESIGN"
        difference: "basis_area = hazard_area.room_area_sqft, which is permitted only while room_area_sqft <= design_area_sqft and enclosure_rating_hours >= ROOM_DESIGN_MIN_ENCLOSURE_HOURS; room_design_penalty_gpm = round_half_up(design_density * ROOM_OPENING_PENALTY_FACTOR * room_area_sqft, 1) when room_has_unprotected_opening else 0.0"

  - name: pipe_sizing_chain
    trigger: "POST /hydraulic-calculations/{id}/iterations"
    algorithm: chronological
    formula: |
      ID_IN = { '1': 1.049, '1.25': 1.380, '1.5': 1.610, '2': 2.067, '2.5': 2.469,
                '3': 3.068, '4': 4.026, '6': 6.065, '8': 7.981 }              # Schedule 40 internal diameter, inches

      active = PipeSizingIteration rows of this calculation with iteration_index >= chain_start_index,
               ordered by iteration_index ASC (no ties are possible - iteration_index is unique per calculation)

      end_head_psi = round_half_up((active[0].flow_gpm / k_factor) ** 2, 2)
      running      = end_head_psi

      # ROUNDING ORDER IS PINNED: round each per-segment term to 2dp, add the rounded terms into the
      # running total, and round the running total again after each segment. Summing raw losses first
      # and rounding once at the end is NOT this scaffold's semantics and yields different results.
      for it in active:                                  # iteration_index ASC
          d = ID_IN[it.pipe_size_in]
          it.friction_loss_psi   = round_half_up(4.52 * it.flow_gpm ** HW_EXPONENT
                                                 / (HW_C ** HW_EXPONENT * d ** 4.87)
                                                 * (it.length_ft + it.fitting_equivalent_ft), 2)
          it.elevation_loss_psi  = round_half_up(it.elevation_change_ft * PSI_PER_FT, 2)
          it.velocity_fps        = round_half_up(0.4085 * it.flow_gpm / d ** 2, 2)
          running                = round_half_up(running + it.friction_loss_psi + it.elevation_loss_psi, 2)
          it.cumulative_psi_after = running

      iteration_count               = count(active)
      required_psi_at_base_of_riser = cumulative_psi_after of the newest active iteration
    input_set: "PipeSizingIteration rows of one HydraulicCalculation whose iteration_index >= chain_start_index; rows below chain_start_index stay on the record with in_active_chain false and never enter the sum"
    constants:
      HW_C: 120
      HW_EXPONENT: 1.85
      PSI_PER_FT: 0.433
      VELOCITY_LIMIT_FPS: 32.00
    precision: "2 decimal places per segment, round_half_up, accumulated in iteration_index order"

  - name: water_supply_availability
    trigger: "POST /water-supply-evaluations"
    algorithm: threshold
    formula: |
      # Ps, Pr, Qt are the basis values written by the selected variant
      basis_static_psi        = Ps
      basis_residual_psi      = Pr
      basis_test_flow_gpm     = Qt
      design_demand_gpm       = round_half_up(calculation.hazard_total_demand_gpm + project.auxiliary_demand_gpm, 1)
      required_psi_at_demand  = round_half_up(calculation.required_psi_at_base_of_riser + project.underground_lead_in_loss_psi, 2)
      available_psi_at_demand = round_half_up(Ps - (Ps - Pr) * (design_demand_gpm / Qt) ** HW_EXPONENT, 2)
      safety_margin_psi       = round_half_up(available_psi_at_demand - required_psi_at_demand, 2)
      safety_margin_pct       = round_half_up(safety_margin_psi / available_psi_at_demand * 100, 1)

      if   safety_margin_psi >= ADEQUATE_MARGIN_PSI: margin_verdict = ADEQUATE
      elif safety_margin_psi >= 0.00:               margin_verdict = MARGINAL
      else:                                         margin_verdict = INADEQUATE_PUMP_REQUIRED

      pinned_calculation_iteration_count = calculation.iteration_count
    input_set: "One FlowTest row, one HydraulicCalculation row named by governing_hydraulic_calculation_id in any state with iteration_count >= 1, and the project's auxiliary_demand_gpm over AuxiliarySystem rows whose status != WITHDRAWN"
    constants:
      HW_EXPONENT: 1.85
      ADEQUATE_MARGIN_PSI: 10.00
      SEASONAL_PRESSURE_ALLOWANCE_PSI: 10.0
      SEASONAL_FLOW_DERATE: 0.90
    precision: "pressures 2 decimal places, percentages 1 decimal place, flows 1 decimal place, all round_half_up"
    variants:
      - name: RAW_TEST
        when: "evaluation_basis == RAW_TEST"
        difference: "Ps = flow_test.static_psi, Pr = flow_test.residual_psi, Qt = flow_test.flow_gpm, exactly as witnessed"
      - name: SEASONAL_ADJUSTED
        when: "evaluation_basis == SEASONAL_ADJUSTED"
        difference: "Ps = round_half_up(static_psi - SEASONAL_PRESSURE_ALLOWANCE_PSI, 2), Pr = round_half_up(residual_psi - SEASONAL_PRESSURE_ALLOWANCE_PSI, 2), Qt = round_half_up(flow_gpm * SEASONAL_FLOW_DERATE, 1); the same FlowTest therefore yields a lower available_psi_at_demand and can flip margin_verdict"

  - name: fire_pump_sizing
    trigger: "POST /fire-pumps"
    algorithm: waterfall_allocation
    formula: |
      # Ps, Pr, Qt are the evaluation's basis_static_psi, basis_residual_psi, basis_test_flow_gpm,
      # so a SEASONAL_ADJUSTED evaluation propagates its derate into every pump figure below.
      candidates = [r for r in PUMP_CATALOG_GPM if r >= evaluation.design_demand_gpm]
      if candidates is empty: reject with ERR_PUMP_CAPACITY_UNAVAILABLE
      rated_flow_gpm = min(candidates)

      # the suction figure is taken AT THE CATALOGUE RATED FLOW, never at design_demand_gpm
      suction_psi_at_rated   = round_half_up(Ps - (Ps - Pr) * (rated_flow_gpm / Qt) ** HW_EXPONENT, 2)
      required_discharge_psi = round_half_up(evaluation.required_psi_at_demand + PUMP_SAFETY_ALLOWANCE_PSI, 2)
      rated_pressure_psi     = max(ceil((required_discharge_psi - suction_psi_at_rated) / RATED_PRESSURE_STEP_PSI)
                                   * RATED_PRESSURE_STEP_PSI, MIN_RATED_PRESSURE_PSI)

      churn_discharge_psi      = round_half_up(rated_pressure_psi * CHURN_FACTOR + Ps, 1)
      flow_150_pct_gpm         = round_half_up(rated_flow_gpm * 1.5, 1)
      suction_psi_at_150_pct   = round_half_up(Ps - (Ps - Pr) * (flow_150_pct_gpm / Qt) ** HW_EXPONENT, 2)
      available_psi_at_150_pct = round_half_up(rated_pressure_psi * OVERLOAD_FACTOR + suction_psi_at_150_pct, 2)

      # verdict is evaluated in exactly this order and stops at the first match
      if   suction_psi_at_150_pct   < MIN_SUCTION_PSI:                    sizing_verdict = INSUFFICIENT_SUCTION_AT_150_PCT
      elif churn_discharge_psi      > MAX_CHURN_PSI:                      sizing_verdict = REQUIRES_PRESSURE_RELIEF_VALVE
      elif available_psi_at_150_pct < evaluation.required_psi_at_demand:  sizing_verdict = INSUFFICIENT_AT_150_PCT
      else:                                                              sizing_verdict = ACCEPTABLE
    input_set: "One WaterSupplyEvaluation row with state == EVALUATED, margin_verdict != ADEQUATE and pump_sized == false"
    constants:
      PUMP_CATALOG_GPM: [500, 750, 1000, 1250, 1500, 2000, 2500]
      PUMP_SAFETY_ALLOWANCE_PSI: 10.0
      RATED_PRESSURE_STEP_PSI: 5
      MIN_RATED_PRESSURE_PSI: 40
      CHURN_FACTOR: 1.40
      OVERLOAD_FACTOR: 0.65
      MIN_SUCTION_PSI: 20.0
      MAX_CHURN_PSI: 175.0
      HW_EXPONENT: 1.85
    precision: "pressures 2 decimal places except churn_discharge_psi and flows at 1 decimal place; rated_pressure_psi is an exact multiple of RATED_PRESSURE_STEP_PSI; all round_half_up"

  - name: auxiliary_system_demand
    trigger: "POST /auxiliary-systems"
    algorithm: threshold
    formula: |
      if system_type == STANDPIPE_CLASS_I:
          cap    = 1000.0 if project.building_height_ft <= HIGH_RISE_TRIGGER_FT else 1250.0
          demand = min(500.0 + 250.0 * (riser_count - 1), cap)
      elif system_type == STANDPIPE_CLASS_II:
          demand = min(100.0 + 75.0 * (riser_count - 1), 400.0)
      elif system_type == COOKING:
          demand = 40.0 + 15.0 * appliance_count + (60.0 if water_wash_enabled else 0.0)
      elif system_type == IN_RACK:
          demand = min(max(30.0 * in_rack_head_count, IN_RACK_FLOOR_GPM), IN_RACK_CAP_GPM)
      elif system_type == FOAM_DELUGE:
          demand = max(FOAM_FLOOR_GPM, round_half_up(FOAM_DENSITY * protected_area_sqft, 1))
      elif system_type == HAZMAT_DELUGE:
          demand = max(HAZMAT_FLOOR_GPM, round_half_up(HAZMAT_DENSITY * protected_area_sqft, 1))
      demand_gpm         = round_half_up(demand, 1)
      interlock_required = system_type in {COOKING, HAZMAT_DELUGE}
    input_set: "The single AuxiliarySystem row being created plus project.building_height_ft"
    constants:
      HIGH_RISE_TRIGGER_FT: 150.0
      IN_RACK_FLOOR_GPM: 150.0
      IN_RACK_CAP_GPM: 480.0
      FOAM_FLOOR_GPM: 250.0
      FOAM_DENSITY: 0.16
      HAZMAT_FLOOR_GPM: 300.0
      HAZMAT_DENSITY: 0.30
    precision: "1 decimal place, round_half_up"

  - name: project_demand_ledger
    trigger: "Any write that changes a HydraulicCalculation state or demand snapshot, or an AuxiliarySystem status"
    algorithm: aggregation
    formula: |
      # step 1 - eligible set, pinned by state
      eligible = HydraulicCalculation rows with project_id == P and state IN {CONVERGED, QC_PASSED, SEALED}
                 (DRAFT, ITERATING, PRESSURE_DEFICIENT, REOPENED and ARCHIVED are excluded)

      # step 2 - governing selection: rank DESC by hazard_total_demand_gpm, tie-break created_at ASC
      if eligible is empty:
          governing_hydraulic_calculation_id = null ; governing_demand_gpm = 0.0
      else:
          governing = first row of eligible ordered by (hazard_total_demand_gpm DESC, created_at ASC)
          governing_hydraulic_calculation_id = governing.id
          governing_demand_gpm               = governing.hazard_total_demand_gpm

      # step 3 - auxiliary roll-up over every non-withdrawn system, including DECOMMISSIONED_PENDING_RETEST
      auxiliary_demand_gpm    = round_half_up(sum(a.demand_gpm for a in AuxiliarySystem
                                                  where a.project_id == P and a.status != WITHDRAWN), 1)
      total_system_demand_gpm = round_half_up(governing_demand_gpm + auxiliary_demand_gpm, 1)

      # PINNED EVALUATION ORDER for the circular-looking dependency between this ledger, the supply
      # evaluation and convergence: a WaterSupplyEvaluation reads
      #   calculation.hazard_total_demand_gpm + project.auxiliary_demand_gpm
      # DIRECTLY and never reads governing_demand_gpm or total_system_demand_gpm - the calculation it
      # references is still ITERATING at that moment and therefore not eligible. Convergence then reads
      # the evaluation's available_psi_at_demand, and only after the calculation reaches CONVERGED is this
      # ledger recomputed. The order ledger -> evaluation -> convergence -> ledger is therefore acyclic
      # and every field is well defined.
    input_set: "HydraulicCalculation rows of the project in states {CONVERGED, QC_PASSED, SEALED} and AuxiliarySystem rows of the project with status != WITHDRAWN"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: project_design_posture
    trigger: "Any write that changes Project.status or Project.open_major_comment_count"
    algorithm: threshold
    formula: |
      if   status IN {CORRECTIVE_ACTION, CLOSED_OUT}: design_posture = FROZEN
      elif open_major_comment_count > 0:              design_posture = GATED
      else:                                          design_posture = OPEN

      # FROZEN rejects every design mutation on the project with ERR_PROJECT_POSTURE_FROZEN:
      #   POST /hazard-areas, POST /hazard-areas/{id}/reclassify, POST /hydraulic-calculations,
      #   POST /hydraulic-calculations/{id}/iterations, /qc-review, /seal, POST /water-supply-evaluations,
      #   POST /fire-pumps, POST /auxiliary-systems, /commission, /withdraw, POST /shop-drawings,
      #   POST /shop-drawings/{id}/trade-clearances, POST /trade-clearances/{id}/record,
      #   POST /submittals, POST /submittals/{id}/resubmit
      # GATED rejects only the three package-advancing writes with ERR_PROJECT_POSTURE_GATED:
      #   POST /hydraulic-calculations/{id}/seal, POST /submittals, POST /acceptance-tests
      # so the designer can still revise geometry and answer the comment that caused the gate.
    input_set: "The single Project row; open_major_comment_count aggregates ReviewComment rows with severity MAJOR and state IN {OPEN, RESPONDED} across every Submittal of the project"
    constants: {}
    precision: "exact enum, no rounding"

  - name: resubmittal_fee_schedule
    trigger: "POST /submittals and POST /submittals/{id}/resubmit"
    algorithm: tiered_pricing
    formula: |
      if   cycle_number <= FREE_CYCLES:        review_fee_usd = 0.00
      elif cycle_number == 3:                  review_fee_usd = CYCLE_3_FEE_USD
      elif cycle_number == MAX_SUBMITTAL_CYCLES: review_fee_usd = CYCLE_4_FEE_USD
      else: reject with ERR_RESUBMITTAL_CYCLE_LIMIT

      project.review_fee_balance_usd = round_half_up(project.review_fee_balance_usd + review_fee_usd, 2)
      # POST /projects/{id}/fee-payments applies the reverse:
      #   amount_usd > review_fee_balance_usd -> ERR_FEE_PAYMENT_EXCEEDS_BALANCE
      #   otherwise review_fee_balance_usd = round_half_up(review_fee_balance_usd - amount_usd, 2)
      # begin-review is refused while review_fee_balance_usd > 0.00
    input_set: "The Submittal being created and the Project row carrying the running fee balance"
    constants:
      FREE_CYCLES: 2
      CYCLE_3_FEE_USD: 250.00
      CYCLE_4_FEE_USD: 500.00
      MAX_SUBMITTAL_CYCLES: 4
    precision: "2 decimal places, round_half_up"

  - name: acceptance_thresholds
    trigger: "POST /acceptance-tests, re-read by POST /acceptance-tests/{id}/record-witness"
    algorithm: threshold
    formula: |
      required_flow_gpm     = round_half_up(project.total_system_demand_gpm * ACCEPTANCE_FLOW_FACTOR, 1)
      required_residual_psi = required_psi_at_base_of_riser of the project's governing calculation
      # both thresholds are frozen on the AcceptanceTest row at creation and are NOT re-derived later
      witness_passes = measured_flow_gpm >= required_flow_gpm and measured_residual_psi >= required_residual_psi
    input_set: "The Project row and the HydraulicCalculation named by project.governing_hydraulic_calculation_id at the instant the test is created; a null governing calculation is rejected with ERR_NO_GOVERNING_CALCULATION"
    constants:
      ACCEPTANCE_FLOW_FACTOR: 0.95
    precision: "flows 1 decimal place, pressures 2 decimal places, round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-blank on every endpoint except POST /_clock/set_current_utc, which still requires X-User-Role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed in the endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For the entity_backed roles DesignEngineer, QcReviewer and AhjReviewer, X-User-ID equals the id of an existing Engineer (DesignEngineer, QcReviewer) or AhjReviewer (AhjReviewer)"
    error_id: ERR_IDENTITY_NOT_RECOGNIZED
    http_status: 403
    applies_to: "all endpoints whose roles include DesignEngineer, QcReviewer or AhjReviewer"
  - priority: 4
    category: existence
    check: "Every {id} path parameter resolves to an existing row, validated left to right"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_HAZARD_AREA_NOT_FOUND | ERR_CALCULATION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_FIRE_PUMP_NOT_FOUND | ERR_AUXILIARY_SYSTEM_NOT_FOUND | ERR_SHOP_DRAWING_NOT_FOUND | ERR_TRADE_CLEARANCE_NOT_FOUND | ERR_SUBMITTAL_NOT_FOUND | ERR_REVIEW_COMMENT_NOT_FOUND | ERR_ACCEPTANCE_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row of the declared parent entity, validated in the field order declared in §1.1"
    error_id: "ERR_ENGINEER_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_HAZARD_AREA_NOT_FOUND | ERR_FLOW_TEST_NOT_FOUND | ERR_CALCULATION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_SUBMITTAL_NOT_FOUND"
    http_status: 404
    applies_to: "POST /projects, POST /hazard-areas, POST /flow-tests, POST /water-supply-evaluations, POST /hydraulic-calculations, POST /fire-pumps, POST /auxiliary-systems, POST /shop-drawings, POST /submittals, POST /submittals/{id}/resubmit, POST /submittals/{id}/comments"
  - priority: 6
    category: auth
    check: "The acting DesignEngineer's X-User-ID equals project.lead_engineer_id of the project the target row belongs to"
    error_id: ERR_NOT_PROJECT_ENGINEER
    http_status: 403
    applies_to: "every DesignEngineer write: POST /hazard-areas, /hazard-areas/{id}/reclassify, /flow-tests, /water-supply-evaluations, /hydraulic-calculations, /hydraulic-calculations/{id}/iterations, /hydraulic-calculations/{id}/seal, /fire-pumps, /auxiliary-systems, /auxiliary-systems/{id}/withdraw, /trade-clearances/{id}/record, /submittals, /submittals/{id}/resubmit, /review-comments/{id}/respond"
  - priority: 7
    category: auth
    check: "The acting AhjReviewer's X-User-ID equals project.ahj_reviewer_id, and any witness_reviewer_id supplied in a request body equals project.ahj_reviewer_id"
    error_id: ERR_NOT_ASSIGNED_REVIEWER
    http_status: 403
    applies_to: "POST /submittals/{id}/begin-review, /submittals/{id}/comments, /submittals/{id}/complete-review, /review-comments/{id}/close, /acceptance-tests/{id}/schedule-witness, /acceptance-tests/{id}/record-witness, /acceptance-tests/{id}/accept-as-built"
  - priority: 8
    category: auth
    check: "The QcReviewer's X-User-ID differs from the calculation's authored_by_engineer_id - the author may not QC his own calculation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hydraulic-calculations/{id}/qc-review"
  - priority: 9
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, types correct, enum members valid, numeric ranges satisfied, elevation_high_in > elevation_low_in, included_calculation_ids non-empty and duplicate-free, residual_psi < static_psi"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
  - priority: 10
    category: business_constraint
    check: "The conditional fields required by AuxiliarySystem.system_type are present: riser_count for STANDPIPE_CLASS_I and STANDPIPE_CLASS_II, appliance_count for COOKING, in_rack_head_count and hazard_area_id for IN_RACK, protected_area_sqft for FOAM_DELUGE and HAZMAT_DELUGE"
    error_id: ERR_SYSTEM_TYPE_FIELD_REQUIRED
    http_status: 422
    applies_to: "POST /auxiliary-systems"
  - priority: 11
    category: state
    check: "expected_project_version equals the current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /submittals, POST /submittals/{id}/resubmit"
  - priority: 12
    category: state
    check: "expected_water_supply_evaluation_version equals the current WaterSupplyEvaluation.version"
    error_id: ERR_STALE_SUPPLY_EVALUATION_VERSION
    http_status: 412
    applies_to: "POST /fire-pumps"
  - priority: 13
    category: state
    check: "project.design_posture != FROZEN for every design mutation listed in calculations.project_design_posture"
    error_id: ERR_PROJECT_POSTURE_FROZEN
    http_status: 409
    applies_to: "every design mutation enumerated in calculations.project_design_posture"
  - priority: 14
    category: state
    check: "project.design_posture != GATED for the three package-advancing writes"
    error_id: ERR_PROJECT_POSTURE_GATED
    http_status: 409
    applies_to: "POST /hydraulic-calculations/{id}/seal, POST /submittals, POST /acceptance-tests"
  - priority: 15
    category: state
    check: "The target row is not in a terminal state of the dimension the request advances: HydraulicCalculation ARCHIVED, Submittal APPROVED or SUPERSEDED, ReviewComment RESOLVED or WITHDRAWN, AuxiliarySystem WITHDRAWN, TradeClearance LOCKED, ShopDrawing ISSUED, FirePump ACCEPTED or SUPERSEDED, WaterSupplyEvaluation SUPERSEDED, AcceptanceTest witness_status WITNESSED_PASS or documentation_status AS_BUILT_ACCEPTED, Project CLOSED_OUT"
    error_id: ERR_TERMINAL_STATE_LOCKED
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 16
    category: state
    check: "The requested transition is declared for the row's current state in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 17
    category: business_safety
    check: "The sealing engineer's license_status == ACTIVE"
    error_id: ERR_SEAL_LICENSE_INACTIVE
    http_status: 409
    applies_to: "POST /hydraulic-calculations/{id}/seal"
  - priority: 18
    category: business_safety
    check: "The sealing engineer's license_state equals project.jurisdiction_state"
    error_id: ERR_SEAL_LICENSE_JURISDICTION_MISMATCH
    http_status: 409
    applies_to: "POST /hydraulic-calculations/{id}/seal"
  - priority: 19
    category: business_safety
    check: "interlock_verified is true when the auxiliary system's interlock_required is true"
    error_id: ERR_INTERLOCK_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /auxiliary-systems/{id}/commission"
  - priority: 20
    category: business_safety
    check: "The iteration's computed velocity_fps is <= VELOCITY_LIMIT_FPS; exactly 32.00 is accepted and 32.01 is rejected"
    error_id: ERR_VELOCITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /hydraulic-calculations/{id}/iterations"
  - priority: 21
    category: business_safety
    check: "At seal time the newest EVALUATED WaterSupplyEvaluation of the project has margin_verdict != INADEQUATE_PUMP_REQUIRED, or a FirePump with state == SIZED and sizing_verdict == ACCEPTABLE references that evaluation"
    error_id: ERR_SAFETY_MARGIN_UNRESOLVED
    http_status: 409
    applies_to: "POST /hydraulic-calculations/{id}/seal"
  - priority: 22
    category: business_referential
    check: "flow_test.tested_at is no earlier than FLOW_TEST_VALIDITY_DAYS (365) before the logical clock"
    error_id: ERR_FLOW_TEST_STALE
    http_status: 422
    applies_to: "POST /water-supply-evaluations"
  - priority: 23
    category: business_referential
    check: "At seal time the newest EVALUATED WaterSupplyEvaluation of the project reconciles with the calculation on all three of pinned_calculation_iteration_count == calculation.iteration_count, required_psi_at_demand == round_half_up(calculation.required_psi_at_base_of_riser + project.underground_lead_in_loss_psi, 2), and design_demand_gpm == project.total_system_demand_gpm"
    error_id: ERR_EVALUATION_REFERENCE_STALE
    http_status: 409
    applies_to: "POST /hydraulic-calculations/{id}/seal"
  - priority: 24
    category: business_referential
    check: "An iteration with is_supply_connection true carries flow_gpm exactly equal to the calculation's design_flow_gpm"
    error_id: ERR_SUPPLY_FLOW_MISMATCH
    http_status: 422
    applies_to: "POST /hydraulic-calculations/{id}/iterations"
  - priority: 25
    category: business_referential
    check: "Every id in included_calculation_ids names a HydraulicCalculation of this project whose state == SEALED"
    error_id: ERR_CALCULATION_NOT_SEALED
    http_status: 409
    applies_to: "POST /submittals, POST /submittals/{id}/resubmit, POST /shop-drawings"
  - priority: 26
    category: business_referential
    check: "Every ShopDrawing whose hydraulic_calculation_id is in included_calculation_ids has state IN {COORDINATED, ISSUED}"
    error_id: ERR_DRAWING_NOT_COORDINATED
    http_status: 409
    applies_to: "POST /submittals, POST /submittals/{id}/resubmit"
  - priority: 27
    category: business_referential
    check: "Every ShopDrawing of the project has state == ISSUED before the first acceptance test is created"
    error_id: ERR_DRAWING_NOT_ISSUED
    http_status: 409
    applies_to: "POST /acceptance-tests"
  - priority: 28
    category: business_referential
    check: "project.governing_hydraulic_calculation_id is not null so the acceptance thresholds are defined"
    error_id: ERR_NO_GOVERNING_CALCULATION
    http_status: 409
    applies_to: "POST /acceptance-tests"
  - priority: 29
    category: business_referential
    check: "An IN_RACK auxiliary system references a hazard_area_id whose commodity_class IN {CLASS_IV, GROUP_A_PLASTIC}"
    error_id: ERR_IN_RACK_HAZARD_MISMATCH
    http_status: 422
    applies_to: "POST /auxiliary-systems"
  - priority: 30
    category: business_referential
    check: "The referenced WaterSupplyEvaluation has state == EVALUATED and margin_verdict != ADEQUATE - an adequate supply needs no pump"
    error_id: ERR_PUMP_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /fire-pumps"
  - priority: 31
    category: business_referential
    check: "The referenced WaterSupplyEvaluation has pump_sized == false"
    error_id: ERR_PUMP_ALREADY_SIZED
    http_status: 409
    applies_to: "POST /fire-pumps"
  - priority: 32
    category: business_constraint
    check: "A ROOM_DESIGN calculation's hazard area has room_area_sqft present, room_area_sqft <= design_area_sqft and enclosure_rating_hours >= ROOM_DESIGN_MIN_ENCLOSURE_HOURS"
    error_id: ERR_ROOM_DESIGN_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /hydraulic-calculations"
  - priority: 33
    category: business_constraint
    check: "iteration_index equals the calculation's current PipeSizingIteration row count plus one"
    error_id: ERR_ITERATION_OUT_OF_SEQUENCE
    http_status: 409
    applies_to: "POST /hydraulic-calculations/{id}/iterations"
  - priority: 34
    category: business_constraint
    check: "An iteration appended while the calculation state IN {PRESSURE_DEFICIENT, REOPENED} carries restart_chain true; an iteration appended while the state IN {DRAFT, ITERATING} carries restart_chain false or absent"
    error_id: ERR_CHAIN_RESTART_REQUIRED
    http_status: 409
    applies_to: "POST /hydraulic-calculations/{id}/iterations"
  - priority: 35
    category: business_constraint
    check: "The referenced calculation has iteration_count >= 1 so required_psi_at_base_of_riser is defined"
    error_id: ERR_NO_ITERATIONS_IN_CHAIN
    http_status: 409
    applies_to: "POST /water-supply-evaluations"
  - priority: 36
    category: business_constraint
    check: "No TradeClearance with the same shop_drawing_id and trade already exists"
    error_id: ERR_DUPLICATE_TRADE_CLEARANCE
    http_status: 409
    applies_to: "POST /shop-drawings/{id}/trade-clearances"
  - priority: 37
    category: business_constraint
    check: "PUMP_CATALOG_GPM contains a rating >= evaluation.design_demand_gpm"
    error_id: ERR_PUMP_CAPACITY_UNAVAILABLE
    http_status: 422
    applies_to: "POST /fire-pumps"
  - priority: 38
    category: business_temporal
    check: "The supplied window start is strictly before the window end"
    error_id: ERR_WINDOW_START_NOT_BEFORE_END
    http_status: 422
    applies_to: "POST /acceptance-tests/{id}/schedule-witness, POST /auxiliary-systems/{id}/commission"
  - priority: 39
    category: business_temporal
    check: "window_start is at or after the logical clock"
    error_id: ERR_WITNESS_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /acceptance-tests/{id}/schedule-witness"
  - priority: 40
    category: business_temporal
    check: "CLOSED-interval semantics with a symmetric travel buffer on the reviewer's calendar: the candidate window inflated by WITNESS_BUFFER_MINUTES (60) on both sides must not intersect any other AcceptanceTest window of the same witness_reviewer_id whose witness_status == SCHEDULED. Formally reject when candidate_start - 60min <= existing_end AND candidate_end + 60min >= existing_start, so a gap of exactly 60 minutes collides and 61 minutes does not"
    error_id: ERR_WITNESS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /acceptance-tests/{id}/schedule-witness"
  - priority: 41
    category: business_temporal
    check: "HALF-OPEN interval semantics with an aggregate capacity on the project: reject when some instant t in [outage_start_at, outage_end_at) is contained in the half-open outage windows of MAX_CONCURRENT_OUTAGES (2) or more other AuxiliarySystem rows of the same project whose status == COMMISSIONED. Touching endpoints do not collide and no travel buffer applies"
    error_id: ERR_OUTAGE_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /auxiliary-systems/{id}/commission"
  - priority: 42
    category: business_constraint
    check: "The superseded submittal's cycle_number is below MAX_SUBMITTAL_CYCLES (4)"
    error_id: ERR_RESUBMITTAL_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /submittals/{id}/resubmit"
  - priority: 43
    category: business_fiscal
    check: "project.review_fee_balance_usd == 0.00 before the authority opens review"
    error_id: ERR_REVIEW_FEE_OUTSTANDING
    http_status: 402
    applies_to: "POST /submittals/{id}/begin-review"
  - priority: 44
    category: business_fiscal
    check: "amount_usd <= project.review_fee_balance_usd"
    error_id: ERR_FEE_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /projects/{id}/fee-payments"

endpoints:
  # ---------------------------------------------------------------- directory
  - method: POST
    path: "/engineers"
    description: "Register a fire protection engineer of record. license_state and license_number are the seal credentials checked at validations priority 18; license_status defaults to ACTIVE."
    roles: [FirmAdmin]
    code: 201
    input: [full_name, license_state, license_number, "license_status?", "discipline?"]
    output: Engineer
    side_effects: []
  - method: POST
    path: "/ahj-reviewers"
    description: "Register an authority having jurisdiction plan reviewer. jurisdiction_code identifies the AHJ office; the reviewer's witness calendar is the set of AcceptanceTest rows naming this reviewer."
    roles: [FirmAdmin]
    code: 201
    input: [full_name, jurisdiction_code, "discipline?"]
    output: AhjReviewer
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; every flow-test staleness check (validations priority 22), witness-window past check (priority 39) and submitted_at / sealed_at stamp reads this clock."
    roles: [FirmAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["sets the logical clock used by every timestamp-producing and time-comparing rule"]
  # ---------------------------------------------------------------- project
  - method: POST
    path: "/projects"
    description: "Open a fire protection design project. underground_lead_in_loss_psi is the fixed loss between the base of riser and the supply connection and defaults to 0.0."
    roles: [FirmAdmin]
    code: 201
    input: [project_number, building_name, jurisdiction_code, jurisdiction_state, occupancy_type, building_height_ft, "underground_lead_in_loss_psi?", lead_engineer_id, ahj_reviewer_id]
    output: Project
    side_effects:
      - "status = DESIGN, design_posture = OPEN"
      - "governing_hydraulic_calculation_id = null; governing_demand_gpm, auxiliary_demand_gpm, total_system_demand_gpm = 0.0"
      - "sealed_calculation_count, open_major_comment_count, submittal_cycle_count = 0; review_fee_balance_usd = 0.00; pump_required_flag = false"
  - method: GET
    path: "/projects/{id}"
    description: "Read one project including the whole demand ledger, the posture and the version that POST /submittals must pin."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "List projects, filterable by lead engineer, assigned reviewer, governing calculation and status."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["lead_engineer_id?", "ahj_reviewer_id?", "governing_hydraulic_calculation_id?", "status?", "design_posture?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/fee-payments"
    description: "Pay down the accrued authority review fee balance. Overpayment is refused rather than clamped."
    roles: [FirmAdmin, Contractor]
    code: 200
    input: [amount_usd]
    output: Project
    side_effects:
      - "review_fee_balance_usd = round_half_up(review_fee_balance_usd - amount_usd, 2)"
      - "increments Project.version by 1"
  # ---------------------------------------------------------------- hazard areas
  - method: POST
    path: "/hazard-areas"
    description: "Declare a hazard area and derive its occupancy classification. Runs calculations.hazard_classification to set effective_hazard_class, design_density, design_area_sqft and hose_allowance_gpm."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, label, hazard_class, commodity_class, storage_height_ft, ceiling_height_ft, area_sqft, sprinkler_system_type, "ceiling_slope_pct?", "room_area_sqft?", "enclosure_rating_hours?", "room_has_unprotected_opening?"]
    output: HazardArea
    side_effects:
      - "runs calculations.hazard_classification and stores effective_hazard_class, design_density, design_area_sqft, hose_allowance_gpm"
      - "reclassification_count = 0"
  - method: GET
    path: "/hazard-areas/{id}"
    description: "Read one hazard area with its derived density and design area."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: HazardArea
    side_effects: []
  - method: GET
    path: "/hazard-areas"
    description: "List hazard areas, filterable by project and derived classification."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "effective_hazard_class?", "sprinkler_system_type?", "limit?", "offset?"]
    output: HazardArea[]
    side_effects: []
  - method: POST
    path: "/hazard-areas/{id}/reclassify"
    description: "Restate the commodity and geometry of a hazard area after a tenant change. Re-runs the classification and drives cascade C through every calculation that references the area."
    roles: [DesignEngineer]
    code: 200
    input: [hazard_class, commodity_class, storage_height_ft, ceiling_height_ft, area_sqft, "ceiling_slope_pct?", "room_area_sqft?", "enclosure_rating_hours?", "room_has_unprotected_opening?"]
    output: HazardArea
    side_effects:
      - "re-runs calculations.hazard_classification; increments reclassification_count by 1"
      - "every HydraulicCalculation of this hazard area in state IN {CONVERGED, QC_PASSED, SEALED} -> REOPENED with stale_reason = HAZARD_RECLASSIFIED and its demand snapshot re-derived from the new density and area"
      - "each SEALED calculation so reopened decrements Project.sealed_calculation_count by 1 and clears sealed_by_engineer_id and sealed_at"
      - "every EVALUATED WaterSupplyEvaluation naming a reopened calculation -> SUPERSEDED"
      - "every SIZED FirePump naming a superseded evaluation -> SUPERSEDED"
      - "recomputes calculations.project_demand_ledger"
      - "increments HazardArea.version by 1"
  # ---------------------------------------------------------------- flow tests
  - method: POST
    path: "/flow-tests"
    description: "Record an immutable hydrant flow test. residual_psi must be below static_psi; tested_at may be backdated to exercise the FLOW_TEST_VALIDITY_DAYS staleness rule."
    roles: [DesignEngineer, Contractor]
    code: 201
    input: [project_id, hydrant_tag, static_psi, residual_psi, flow_gpm, tested_at]
    output: FlowTest
    side_effects: []
  - method: GET
    path: "/projects/{id}/flow-tests"
    description: "List every flow test recorded for a project - the reverse-reachability channel for FlowTest.project_id."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: FlowTest[]
    side_effects: []
  # ---------------------------------------------------------------- supply evaluation
  - method: POST
    path: "/water-supply-evaluations"
    description: "Evaluate the municipal supply against the current hydraulic demand. evaluation_basis RAW_TEST uses the flow test as recorded; SEASONAL_ADJUSTED derates it per calculations.water_supply_availability. Runs the whole margin computation and pins the reconciliation triple that POST /hydraulic-calculations/{id}/seal re-checks."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, flow_test_id, governing_hydraulic_calculation_id, evaluation_basis]
    output: WaterSupplyEvaluation
    side_effects:
      - "any EVALUATED WaterSupplyEvaluation of the same project -> SUPERSEDED before this row is inserted"
      - "runs calculations.water_supply_availability: stores basis_static_psi, basis_residual_psi, basis_test_flow_gpm, design_demand_gpm, required_psi_at_demand, available_psi_at_demand, safety_margin_psi, safety_margin_pct, margin_verdict"
      - "pinned_calculation_iteration_count = the referenced calculation's iteration_count at this instant"
      - "pump_sized = false; state = EVALUATED"
      - "Project.pump_required_flag = (margin_verdict != ADEQUATE); increments Project.version by 1"
      - "every SIZED FirePump naming the superseded evaluation -> SUPERSEDED"
  - method: GET
    path: "/water-supply-evaluations/{id}"
    description: "Read one supply evaluation with its margin verdict and pinned reconciliation triple."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: WaterSupplyEvaluation
    side_effects: []
  - method: GET
    path: "/water-supply-evaluations"
    description: "List supply evaluations, filterable by project, source flow test and evaluated calculation - the reverse-reachability channel for all three of its foreign keys."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "flow_test_id?", "governing_hydraulic_calculation_id?", "state?", "margin_verdict?", "limit?", "offset?"]
    output: WaterSupplyEvaluation[]
    side_effects: []
  # ---------------------------------------------------------------- hydraulic calculation
  - method: POST
    path: "/hydraulic-calculations"
    description: "Open a hydraulic calculation over one hazard area. method AREA_DENSITY multiplies density by design area; ROOM_DESIGN uses the room area and is admissible only for an eligible compartment. Snapshots the demand from the hazard area's derived classification."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, hazard_area_id, method, k_factor]
    output: HydraulicCalculation
    side_effects:
      - "authored_by_engineer_id = the acting engineer"
      - "runs calculations.hazard_design_demand: stores design_flow_gpm, hose_allowance_gpm, room_design_penalty_gpm, hazard_total_demand_gpm"
      - "state = DRAFT; chain_start_index = 1; iteration_count = 0; end_head_psi = 0.0; required_psi_at_base_of_riser = 0.0"
  - method: GET
    path: "/hydraulic-calculations/{id}"
    description: "Read one hydraulic calculation with its demand snapshot, chain summary and seal metadata."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: HydraulicCalculation
    side_effects: []
  - method: GET
    path: "/hydraulic-calculations"
    description: "List hydraulic calculations, filterable by project, hazard area, author, QC reviewer, sealing engineer, reopening submittal and state - the reverse-reachability channel for all six of its foreign keys."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "hazard_area_id?", "authored_by_engineer_id?", "qc_reviewed_by_engineer_id?", "sealed_by_engineer_id?", "reopened_by_submittal_id?", "state?", "method?", "limit?", "offset?"]
    output: HydraulicCalculation[]
    side_effects: []
  - method: POST
    path: "/hydraulic-calculations/{id}/iterations"
    description: "Append one pipe-sizing iteration to the chain. iteration_index must equal the current row count plus one. restart_chain true opens a fresh active chain from this index after a deficient or reopened calculation; is_supply_connection true closes the chain and decides convergence against the newest EVALUATED supply evaluation."
    roles: [DesignEngineer]
    code: 201
    input: [iteration_index, pipe_size_in, length_ft, fitting_equivalent_ft, flow_gpm, elevation_change_ft, "is_supply_connection?", "restart_chain?"]
    output: PipeSizingIteration
    side_effects:
      - "runs calculations.pipe_sizing_chain: stores friction_loss_psi, elevation_loss_psi, velocity_fps, cumulative_psi_after"
      - "restart_chain true sets the calculation's chain_start_index to this iteration_index and marks every earlier iteration in_active_chain = false"
      - "the calculation's iteration_count, end_head_psi and required_psi_at_base_of_riser are re-derived over the active chain only"
      - "DRAFT -> ITERATING on the first iteration; ITERATING -> ITERATING while is_supply_connection is false"
      - "is_supply_connection true: ITERATING -> CONVERGED when the newest EVALUATED evaluation's available_psi_at_demand >= required_psi_at_base_of_riser + Project.underground_lead_in_loss_psi, else -> PRESSURE_DEFICIENT with deficiency_psi stored"
      - "reaching CONVERGED recomputes calculations.project_demand_ledger and calculations.acceptance_thresholds inputs on the Project"
      - "increments HydraulicCalculation.version by 1"
  - method: GET
    path: "/hydraulic-calculations/{id}/iterations"
    description: "List the pipe-sizing iterations of a calculation in iteration_index order, including superseded rows with in_active_chain false - the reverse-reachability channel for PipeSizingIteration.hydraulic_calculation_id."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["in_active_chain?", "limit?", "offset?"]
    output: PipeSizingIteration[]
    side_effects: []
  - method: GET
    path: "/hydraulic-calculations/{id}/submittals"
    description: "List every submittal package whose included_calculation_ids contains this calculation - the reverse-reachability channel for Submittal.included_calculation_ids."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: Submittal[]
    side_effects: []
  - method: POST
    path: "/hydraulic-calculations/{id}/qc-review"
    description: "Independent QC review of a converged calculation. disposition PASS advances it to QC_PASSED; REJECT returns it to ITERATING. The acting QcReviewer may not be the author (segregation of duties)."
    roles: [QcReviewer]
    code: 200
    input: [disposition, "review_note?"]
    output: HydraulicCalculation
    side_effects:
      - "qc_reviewed_by_engineer_id = the acting QC reviewer"
      - "disposition PASS: CONVERGED -> QC_PASSED; disposition REJECT: CONVERGED -> ITERATING and qc_reviewed_by_engineer_id is retained for audit"
      - "increments HydraulicCalculation.version by 1"
  - method: POST
    path: "/hydraulic-calculations/{id}/seal"
    description: "Apply the engineer's seal. Re-checks the sealing engineer's licence, the resolved safety margin and the three-part reconciliation against the newest EVALUATED supply evaluation before the seal is granted."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: HydraulicCalculation
    side_effects:
      - "QC_PASSED -> SEALED; sealed_by_engineer_id = the acting engineer; sealed_at = the logical clock"
      - "increments Project.sealed_calculation_count by 1 and Project.version by 1"
      - "recomputes calculations.project_demand_ledger"
      - "increments HydraulicCalculation.version by 1"
  # ---------------------------------------------------------------- fire pump
  - method: POST
    path: "/fire-pumps"
    description: "Size a fire pump against a deficient supply evaluation. Pins expected_water_supply_evaluation_version so a pump can never be sized against an evaluation that has already been superseded or already consumed. Runs the full catalogue selection, churn and 150 percent point checks."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, water_supply_evaluation_id, "model_tag?", expected_water_supply_evaluation_version]
    output: FirePump
    side_effects:
      - "runs calculations.fire_pump_sizing: stores rated_flow_gpm, suction_psi_at_rated, required_discharge_psi, rated_pressure_psi, churn_discharge_psi, flow_150_pct_gpm, suction_psi_at_150_pct, available_psi_at_150_pct, sizing_verdict"
      - "state = SIZED"
      - "WaterSupplyEvaluation.pump_sized = true; increments WaterSupplyEvaluation.version by 1"
      - "Project.pump_required_flag = true; increments Project.version by 1"
  - method: GET
    path: "/fire-pumps/{id}"
    description: "Read one fire pump with its full sizing worksheet and verdict."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: FirePump
    side_effects: []
  - method: GET
    path: "/fire-pumps"
    description: "List fire pumps, filterable by project and source supply evaluation - the reverse-reachability channel for both of its foreign keys."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "water_supply_evaluation_id?", "state?", "sizing_verdict?", "limit?", "offset?"]
    output: FirePump[]
    side_effects: []
  # ---------------------------------------------------------------- auxiliary systems
  - method: POST
    path: "/auxiliary-systems"
    description: "Add a special hazard or standpipe system to the project. The conditional fields required depend on system_type; demand_gpm and interlock_required are derived by calculations.auxiliary_system_demand and roll straight into the project demand ledger."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, "hazard_area_id?", system_type, label, "riser_count?", "appliance_count?", "water_wash_enabled?", "in_rack_head_count?", "protected_area_sqft?", "agent_type?"]
    output: AuxiliarySystem
    side_effects:
      - "runs calculations.auxiliary_system_demand: stores demand_gpm and interlock_required"
      - "status = PROPOSED; interlock_verified = false; outage_start_at and outage_end_at null"
      - "recomputes calculations.project_demand_ledger - auxiliary_demand_gpm and total_system_demand_gpm rise by demand_gpm"
      - "increments Project.version by 1"
  - method: GET
    path: "/auxiliary-systems/{id}"
    description: "Read one auxiliary system with its derived demand, interlock requirement and outage window."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: AuxiliarySystem
    side_effects: []
  - method: GET
    path: "/auxiliary-systems"
    description: "List auxiliary systems, filterable by project and protected hazard area - the reverse-reachability channel for both of its foreign keys."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "hazard_area_id?", "system_type?", "status?", "limit?", "offset?"]
    output: AuxiliarySystem[]
    side_effects: []
  - method: POST
    path: "/auxiliary-systems/{id}/commission"
    description: "Commission the system and book its water-supply outage window. The window is HALF-OPEN [outage_start_at, outage_end_at) and is refused when it would put MAX_CONCURRENT_OUTAGES or more other commissioned outages of the same project in flight at any instant. An interlocked system must present interlock_verified true."
    roles: [Contractor]
    code: 200
    input: [outage_start_at, outage_end_at, "interlock_verified?"]
    output: AuxiliarySystem
    side_effects:
      - "stores outage_start_at, outage_end_at and interlock_verified"
      - "PROPOSED -> COMMISSIONED or DECOMMISSIONED_PENDING_RETEST -> COMMISSIONED"
      - "increments AuxiliarySystem.version by 1"
  - method: POST
    path: "/auxiliary-systems/{id}/withdraw"
    description: "Withdraw a proposed or decommissioned auxiliary system from the design. Its demand leaves the ledger, which is the compensating half of the demand-invariant round trip."
    roles: [DesignEngineer]
    code: 200
    input: ["withdraw_note?"]
    output: AuxiliarySystem
    side_effects:
      - "status -> WITHDRAWN; outage_start_at and outage_end_at cleared"
      - "recomputes calculations.project_demand_ledger - auxiliary_demand_gpm and total_system_demand_gpm fall by demand_gpm"
      - "increments Project.version by 1 and AuxiliarySystem.version by 1"
  # ---------------------------------------------------------------- shop drawings
  - method: POST
    path: "/shop-drawings"
    description: "Issue a shop drawing sheet for a sealed calculation. required_trade_count is fixed at 3 - structural, mechanical and lighting must all clear before the sheet can be packaged."
    roles: [Contractor]
    code: 201
    input: [project_id, hydraulic_calculation_id, sheet_number]
    output: ShopDrawing
    side_effects:
      - "required_trade_count = 3; cleared_trade_count = 0; state = DRAFT"
  - method: GET
    path: "/shop-drawings/{id}"
    description: "Read one shop drawing with its coordination counters and state."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: ShopDrawing
    side_effects: []
  - method: GET
    path: "/shop-drawings"
    description: "List shop drawings, filterable by project and source calculation - the reverse-reachability channel for both of its foreign keys."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "hydraulic_calculation_id?", "state?", "limit?", "offset?"]
    output: ShopDrawing[]
    side_effects: []
  - method: POST
    path: "/shop-drawings/{id}/trade-clearances"
    description: "Open a trade coordination item on a sheet. One item per trade per sheet; the elevation band is the sprinkler main's reserved space checked against the other trade's occupancy."
    roles: [Contractor]
    code: 201
    input: [trade, elevation_low_in, elevation_high_in]
    output: TradeClearance
    side_effects:
      - "state = PENDING; conflict_severity and note null"
      - "ShopDrawing DRAFT -> IN_COORDINATION; increments ShopDrawing.version by 1"
  - method: GET
    path: "/shop-drawings/{id}/trade-clearances"
    description: "List the trade coordination items of a sheet - the reverse-reachability channel for TradeClearance.shop_drawing_id."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: TradeClearance[]
    side_effects: []
  - method: POST
    path: "/trade-clearances/{id}/record"
    description: "Record the outcome of a trade coordination item. outcome CLEARED advances the sheet's cleared_trade_count; outcome CONFLICT_OPEN with conflict_severity BLOCKING pushes the sheet into CONFLICTED."
    roles: [DesignEngineer]
    code: 200
    input: [outcome, "conflict_severity?", "note?"]
    output: TradeClearance
    side_effects:
      - "outcome CLEARED: PENDING | CONFLICT_OPEN | STALE -> CLEARED and the sheet's cleared_trade_count is recounted over its CLEARED clearances"
      - "outcome CONFLICT_OPEN: PENDING -> CONFLICT_OPEN, stores conflict_severity and note"
      - "ShopDrawing IN_COORDINATION | CONFLICTED | STALE -> COORDINATED when cleared_trade_count reaches required_trade_count, else IN_COORDINATION; CONFLICT_OPEN with conflict_severity BLOCKING drives IN_COORDINATION -> CONFLICTED"
      - "increments TradeClearance.version by 1 and ShopDrawing.version by 1"
  # ---------------------------------------------------------------- submittals
  - method: POST
    path: "/submittals"
    description: "Lodge the permit package with the authority. Every included calculation must be SEALED and every shop drawing over those calculations COORDINATED or ISSUED. expected_project_version pins the project the package was assembled against, so a design change landing between assembly and lodgement is refused with 412 rather than silently packaged."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, included_calculation_ids, expected_project_version]
    output: Submittal
    side_effects:
      - "cycle_number = Project.submittal_cycle_count + 1; runs calculations.resubmittal_fee_schedule to set review_fee_usd"
      - "submitted_at = the logical clock; state = SUBMITTED; open_comment_count = 0; major_comment_count = 0"
      - "Project.submittal_cycle_count = cycle_number; Project.review_fee_balance_usd += review_fee_usd"
      - "Project DESIGN -> PERMIT_REVIEW"
      - "increments Project.version by 1"
  - method: GET
    path: "/submittals/{id}"
    description: "Read one submittal with its cycle number, fee, comment counters and state."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: Submittal
    side_effects: []
  - method: GET
    path: "/submittals"
    description: "List submittals, filterable by project, superseded predecessor, reviewing official and included calculation - the reverse-reachability channel for all four of its foreign keys."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "supersedes_submittal_id?", "reviewed_by_ahj_reviewer_id?", "included_calculation_ids?", "state?", "limit?", "offset?"]
    output: Submittal[]
    side_effects: []
  - method: POST
    path: "/submittals/{id}/begin-review"
    description: "The authority opens or reopens review of the package. Refused while the project carries an outstanding review fee balance."
    roles: [AhjReviewer]
    code: 200
    input: []
    output: Submittal
    side_effects:
      - "SUBMITTED -> UNDER_REVIEW or RESPONSE_COMPLETE -> UNDER_REVIEW"
      - "reviewed_by_ahj_reviewer_id = the acting reviewer"
      - "increments Submittal.version by 1"
  - method: POST
    path: "/submittals/{id}/comments"
    description: "Raise one plan review comment against a package under review. A MAJOR comment gates the project as soon as it is raised, so the designer cannot seal, resubmit or move to acceptance while it is open."
    roles: [AhjReviewer]
    code: 201
    input: [code_section, severity, description, "assigned_engineer_id?"]
    output: ReviewComment
    side_effects:
      - "raised_by_ahj_reviewer_id = the acting reviewer; state = OPEN"
      - "Submittal.open_comment_count += 1 and, when severity == MAJOR, major_comment_count += 1"
      - "Project.open_major_comment_count is recounted over ReviewComment rows with severity MAJOR and state IN {OPEN, RESPONDED} across every submittal of the project"
      - "recomputes calculations.project_design_posture"
      - "increments Submittal.version by 1 and Project.version by 1"
  - method: POST
    path: "/submittals/{id}/complete-review"
    description: "Close out the review pass. With no open comments the package is approved, the permit is issued and the coordination record locks; with open comments the package returns for correction and, when at least one comment is MAJOR, cascade A invalidates the sealed calculations and the coordination downstream of them."
    roles: [AhjReviewer]
    code: 200
    input: []
    output: Submittal
    side_effects:
      - "open_comment_count == 0: UNDER_REVIEW -> APPROVED, Project PERMIT_REVIEW -> PERMITTED, every COORDINATED ShopDrawing of the project -> ISSUED, every CLEARED TradeClearance of those sheets -> LOCKED"
      - "open_comment_count >= 1: UNDER_REVIEW -> COMMENTS_ISSUED"
      - "with at least one MAJOR comment (cascade A, depth 4): every SEALED HydraulicCalculation in included_calculation_ids -> REOPENED with stale_reason = MAJOR_COMMENT and reopened_by_submittal_id = this submittal; Project.sealed_calculation_count decremented once per reopened calculation; every COORDINATED ShopDrawing over those calculations -> STALE; every CLEARED TradeClearance of those sheets -> STALE"
      - "recomputes calculations.project_demand_ledger and calculations.project_design_posture"
      - "increments Submittal.version by 1 and Project.version by 1"
  - method: POST
    path: "/submittals/{id}/resubmit"
    description: "Supersede a commented package with the next cycle. cycle_number advances by one and the tiered resubmittal fee is charged to the project; the fourth cycle is the last one the authority accepts."
    roles: [DesignEngineer]
    code: 201
    input: [included_calculation_ids, expected_project_version]
    output: Submittal
    side_effects:
      - "the target submittal COMMENTS_ISSUED | RESPONSE_COMPLETE -> SUPERSEDED"
      - "creates a new Submittal with supersedes_submittal_id = the target, cycle_number = target.cycle_number + 1, review_fee_usd from calculations.resubmittal_fee_schedule, submitted_at = the logical clock, state = SUBMITTED"
      - "Project.submittal_cycle_count = the new cycle_number; Project.review_fee_balance_usd += review_fee_usd"
      - "increments Project.version by 1 and the superseded Submittal.version by 1"
  # ---------------------------------------------------------------- review comments
  - method: GET
    path: "/review-comments/{id}"
    description: "Read one review comment with its response, disposition and state."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: ReviewComment
    side_effects: []
  - method: GET
    path: "/review-comments"
    description: "List review comments, filterable by submittal, raising official and assigned engineer - the reverse-reachability channel for all three of its foreign keys."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["submittal_id?", "raised_by_ahj_reviewer_id?", "assigned_engineer_id?", "severity?", "state?", "limit?", "offset?"]
    output: ReviewComment[]
    side_effects: []
  - method: POST
    path: "/review-comments/{id}/respond"
    description: "The engineer of record answers a comment. When the last OPEN comment of the submittal is answered the package moves to RESPONSE_COMPLETE and is ready for the authority to reopen review."
    roles: [DesignEngineer]
    code: 200
    input: [response_note]
    output: ReviewComment
    side_effects:
      - "OPEN -> RESPONDED; stores response_note"
      - "Submittal.open_comment_count is recounted over its ReviewComment rows in state OPEN; when it reaches 0 the Submittal COMMENTS_ISSUED -> RESPONSE_COMPLETE"
      - "increments ReviewComment.version by 1 and Submittal.version by 1"
  - method: POST
    path: "/review-comments/{id}/close"
    description: "The authority disposes of a comment. RESOLVED accepts the response; REJECT_RESPONSE sends it back to OPEN; WITHDRAWN retracts the comment entirely and, when it clears the last open comment of the package, compensates cascade A in full - the reopened calculations are resealed, the stale sheets return to COORDINATED and sealed_calculation_count returns to its pre-cascade value with no drift."
    roles: [AhjReviewer]
    code: 200
    input: [disposition, "close_note?"]
    output: ReviewComment
    side_effects:
      - "disposition RESOLVED: RESPONDED -> RESOLVED; disposition REJECT_RESPONSE: RESPONDED -> OPEN; disposition WITHDRAWN: OPEN -> WITHDRAWN"
      - "stores disposition and close_note"
      - "Submittal.open_comment_count and major_comment_count are recounted; Project.open_major_comment_count is recounted and calculations.project_design_posture recomputed"
      - "disposition WITHDRAWN that clears the last open comment of the submittal: Submittal COMMENTS_ISSUED -> UNDER_REVIEW; every HydraulicCalculation with reopened_by_submittal_id == this submittal REOPENED -> SEALED with its previous sealed_by_engineer_id and sealed_at restored and stale_reason cleared; Project.sealed_calculation_count incremented once per resealed calculation; every STALE ShopDrawing over those calculations -> COORDINATED; every STALE TradeClearance of those sheets -> CLEARED"
      - "recomputes calculations.project_demand_ledger"
      - "increments ReviewComment.version by 1, Submittal.version by 1 and Project.version by 1"
  # ---------------------------------------------------------------- acceptance testing
  - method: POST
    path: "/acceptance-tests"
    description: "Open an acceptance test against the permitted design. The pass thresholds are frozen on the row at creation from calculations.acceptance_thresholds and are never re-derived, so a later design change cannot move the bar a witnessed test was measured against."
    roles: [Contractor]
    code: 201
    input: [project_id, test_type]
    output: AcceptanceTest
    side_effects:
      - "runs calculations.acceptance_thresholds and freezes required_flow_gpm and required_residual_psi"
      - "witness_status = NOT_SCHEDULED; documentation_status = PENDING; retest_count = 0"
      - "Project PERMITTED -> ACCEPTANCE on the first acceptance test of the project; a project already in ACCEPTANCE keeps its status and the additional test is accepted"
      - "increments Project.version by 1"
  - method: GET
    path: "/acceptance-tests/{id}"
    description: "Read one acceptance test with its frozen thresholds, witness window and both status dimensions."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: []
    output: AcceptanceTest
    side_effects: []
  - method: GET
    path: "/acceptance-tests"
    description: "List acceptance tests, filterable by project and witnessing official - the reverse-reachability channel for both of its foreign keys - and by either status dimension."
    roles: [FirmAdmin, DesignEngineer, QcReviewer, Contractor, AhjReviewer]
    code: 200
    input: ["project_id?", "witness_reviewer_id?", "test_type?", "witness_status?", "documentation_status?", "limit?", "offset?"]
    output: AcceptanceTest[]
    side_effects: []
  - method: POST
    path: "/acceptance-tests/{id}/schedule-witness"
    description: "Book the authority's witness attendance. The window is a CLOSED interval inflated by WITNESS_BUFFER_MINUTES of travel on both sides and is refused when it collides with any other SCHEDULED window of the same reviewer - a gap of exactly the buffer collides, one minute more does not."
    roles: [AhjReviewer]
    code: 200
    input: [witness_window_start, witness_window_end]
    output: AcceptanceTest
    side_effects:
      - "witness_reviewer_id = the acting reviewer; stores witness_window_start and witness_window_end"
      - "NOT_SCHEDULED -> SCHEDULED, or WITNESSED_FAIL -> SCHEDULED with retest_count incremented by 1 and Project CORRECTIVE_ACTION -> ACCEPTANCE"
      - "recomputes calculations.project_design_posture; increments AcceptanceTest.version by 1 and Project.version by 1"
  - method: POST
    path: "/acceptance-tests/{id}/record-witness"
    description: "Record the witnessed measurement against the frozen thresholds. Both measurements must meet or exceed their threshold; a shortfall on either drives cascade B and freezes the project into corrective action."
    roles: [AhjReviewer]
    code: 200
    input: [measured_flow_gpm, measured_residual_psi]
    output: AcceptanceTest
    side_effects:
      - "stores measured_flow_gpm and measured_residual_psi"
      - "pass: SCHEDULED -> WITNESSED_PASS; on a PUMP_FLOW_TEST every SIZED FirePump of the project -> ACCEPTED"
      - "fail (cascade B, depth 3): SCHEDULED -> WITNESSED_FAIL, Project ACCEPTANCE -> CORRECTIVE_ACTION, design_posture -> FROZEN, every COMMISSIONED AuxiliarySystem of the project -> DECOMMISSIONED_PENDING_RETEST"
      - "recomputes calculations.project_design_posture; increments AcceptanceTest.version by 1 and Project.version by 1"
  - method: POST
    path: "/acceptance-tests/{id}/submit-as-built"
    description: "Lodge the as-built record drawing set for the witnessed test."
    roles: [Contractor]
    code: 200
    input: [as_built_document_ref]
    output: AcceptanceTest
    side_effects:
      - "stores as_built_document_ref; documentation_status PENDING | AS_BUILT_REJECTED -> AS_BUILT_SUBMITTED"
      - "increments AcceptanceTest.version by 1"
  - method: POST
    path: "/acceptance-tests/{id}/accept-as-built"
    description: "The authority disposes of the as-built package. Accepting the last outstanding test closes the project out, archives every sealed calculation and freezes the design permanently."
    roles: [AhjReviewer]
    code: 200
    input: [disposition]
    output: AcceptanceTest
    side_effects:
      - "disposition ACCEPTED: documentation_status AS_BUILT_SUBMITTED -> AS_BUILT_ACCEPTED; disposition REJECTED: AS_BUILT_SUBMITTED -> AS_BUILT_REJECTED"
      - "when every AcceptanceTest of the project is WITNESSED_PASS and AS_BUILT_ACCEPTED: Project ACCEPTANCE -> CLOSED_OUT, every SEALED HydraulicCalculation -> ARCHIVED, design_posture -> FROZEN"
      - "recomputes calculations.project_design_posture; increments AcceptanceTest.version by 1 and Project.version by 1"

errors:
  # ---- authentication and authorisation
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_IDENTITY_NOT_RECOGNIZED
    http: 403
    condition: "X-User-ID does not resolve to an Engineer (DesignEngineer, QcReviewer) or AhjReviewer (AhjReviewer)"
  - id: ERR_NOT_PROJECT_ENGINEER
    http: 403
    condition: "the acting engineer is not the project's lead_engineer_id"
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "the acting reviewer is not the project's ahj_reviewer_id, or a supplied witness_reviewer_id is not that reviewer"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the QC reviewer is the author of the calculation being reviewed"
  # ---- existence
  - id: ERR_ENGINEER_NOT_FOUND
    http: 404
    condition: "a referenced Engineer id does not exist"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "a referenced AhjReviewer id does not exist"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "a referenced Project id does not exist"
  - id: ERR_HAZARD_AREA_NOT_FOUND
    http: 404
    condition: "a referenced HazardArea id does not exist"
  - id: ERR_FLOW_TEST_NOT_FOUND
    http: 404
    condition: "a referenced FlowTest id does not exist"
  - id: ERR_CALCULATION_NOT_FOUND
    http: 404
    condition: "a referenced HydraulicCalculation id does not exist, including any member of included_calculation_ids"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "a referenced WaterSupplyEvaluation id does not exist"
  - id: ERR_FIRE_PUMP_NOT_FOUND
    http: 404
    condition: "a referenced FirePump id does not exist"
  - id: ERR_AUXILIARY_SYSTEM_NOT_FOUND
    http: 404
    condition: "a referenced AuxiliarySystem id does not exist"
  - id: ERR_SHOP_DRAWING_NOT_FOUND
    http: 404
    condition: "a referenced ShopDrawing id does not exist"
  - id: ERR_TRADE_CLEARANCE_NOT_FOUND
    http: 404
    condition: "a referenced TradeClearance id does not exist"
  - id: ERR_SUBMITTAL_NOT_FOUND
    http: 404
    condition: "a referenced Submittal id does not exist"
  - id: ERR_REVIEW_COMMENT_NOT_FOUND
    http: 404
    condition: "a referenced ReviewComment id does not exist"
  - id: ERR_ACCEPTANCE_TEST_NOT_FOUND
    http: 404
    condition: "a referenced AcceptanceTest id does not exist"
  # ---- request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, residual_psi >= static_psi, elevation_high_in <= elevation_low_in, or an empty or duplicate-bearing included_calculation_ids"
  - id: ERR_SYSTEM_TYPE_FIELD_REQUIRED
    http: 422
    condition: "the conditional field required by AuxiliarySystem.system_type is absent"
  # ---- optimistic concurrency
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not match the current Project.version"
  - id: ERR_STALE_SUPPLY_EVALUATION_VERSION
    http: 412
    condition: "expected_water_supply_evaluation_version does not match the current WaterSupplyEvaluation.version"
  # ---- posture and state
  - id: ERR_PROJECT_POSTURE_FROZEN
    http: 409
    condition: "a design mutation was attempted while the project's design_posture is FROZEN"
  - id: ERR_PROJECT_POSTURE_GATED
    http: 409
    condition: "seal, submittal or acceptance-test creation was attempted while the project's design_posture is GATED by an open MAJOR comment"
  - id: ERR_TERMINAL_STATE_LOCKED
    http: 409
    condition: "the target row is already in a terminal state of the dimension the request advances"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared for the row's current state"
  # ---- life safety
  - id: ERR_SEAL_LICENSE_INACTIVE
    http: 409
    condition: "the sealing engineer's license_status is not ACTIVE"
  - id: ERR_SEAL_LICENSE_JURISDICTION_MISMATCH
    http: 409
    condition: "the sealing engineer's license_state differs from the project's jurisdiction_state"
  - id: ERR_INTERLOCK_NOT_VERIFIED
    http: 409
    condition: "commissioning an interlock_required auxiliary system without interlock_verified true"
  - id: ERR_VELOCITY_LIMIT_EXCEEDED
    http: 422
    condition: "the iteration's computed velocity_fps exceeds VELOCITY_LIMIT_FPS"
  - id: ERR_SAFETY_MARGIN_UNRESOLVED
    http: 409
    condition: "sealing while the newest EVALUATED supply evaluation is INADEQUATE_PUMP_REQUIRED with no ACCEPTABLE sized pump against it"
  # ---- referential integrity between design artefacts
  - id: ERR_FLOW_TEST_STALE
    http: 422
    condition: "the flow test's tested_at is more than FLOW_TEST_VALIDITY_DAYS before the logical clock"
  - id: ERR_EVALUATION_REFERENCE_STALE
    http: 409
    condition: "at seal time the newest EVALUATED supply evaluation disagrees with the calculation on iteration count, required pressure at demand or design demand"
  - id: ERR_SUPPLY_FLOW_MISMATCH
    http: 422
    condition: "a supply-connection iteration's flow_gpm differs from the calculation's design_flow_gpm"
  - id: ERR_CALCULATION_NOT_SEALED
    http: 409
    condition: "a packaged or drawn calculation is not in state SEALED"
  - id: ERR_DRAWING_NOT_COORDINATED
    http: 409
    condition: "a shop drawing over a packaged calculation is not COORDINATED or ISSUED"
  - id: ERR_DRAWING_NOT_ISSUED
    http: 409
    condition: "an acceptance test was opened while some shop drawing of the project is not ISSUED"
  - id: ERR_NO_GOVERNING_CALCULATION
    http: 409
    condition: "an acceptance test was opened while the project has no governing hydraulic calculation"
  - id: ERR_IN_RACK_HAZARD_MISMATCH
    http: 422
    condition: "an IN_RACK system references a hazard area whose commodity_class is neither CLASS_IV nor GROUP_A_PLASTIC"
  - id: ERR_PUMP_NOT_REQUIRED
    http: 409
    condition: "a pump was sized against a supply evaluation whose margin_verdict is ADEQUATE"
  - id: ERR_PUMP_ALREADY_SIZED
    http: 409
    condition: "the supply evaluation already carries pump_sized true"
  # ---- domain constraints
  - id: ERR_ROOM_DESIGN_NOT_PERMITTED
    http: 422
    condition: "ROOM_DESIGN was requested for a hazard area with no room area, a room larger than the design area, or an enclosure below ROOM_DESIGN_MIN_ENCLOSURE_HOURS"
  - id: ERR_ITERATION_OUT_OF_SEQUENCE
    http: 409
    condition: "iteration_index is not the calculation's current iteration row count plus one"
  - id: ERR_CHAIN_RESTART_REQUIRED
    http: 409
    condition: "restart_chain does not match the calculation's state - true is required from PRESSURE_DEFICIENT or REOPENED and forbidden from DRAFT or ITERATING"
  - id: ERR_NO_ITERATIONS_IN_CHAIN
    http: 409
    condition: "a supply evaluation was requested against a calculation with no iterations"
  - id: ERR_DUPLICATE_TRADE_CLEARANCE
    http: 409
    condition: "a clearance for the same trade already exists on the sheet"
  - id: ERR_PUMP_CAPACITY_UNAVAILABLE
    http: 422
    condition: "no PUMP_CATALOG_GPM rating reaches the evaluated design demand"
  - id: ERR_RESUBMITTAL_CYCLE_LIMIT
    http: 409
    condition: "resubmitting from cycle MAX_SUBMITTAL_CYCLES"
  # ---- temporal
  - id: ERR_WINDOW_START_NOT_BEFORE_END
    http: 422
    condition: "the supplied window start is not strictly before the window end"
  - id: ERR_WITNESS_WINDOW_IN_PAST
    http: 422
    condition: "witness_window_start is before the logical clock"
  - id: ERR_WITNESS_WINDOW_CONFLICT
    http: 409
    condition: "the buffered witness window intersects another SCHEDULED window of the same reviewer"
  - id: ERR_OUTAGE_CONCURRENCY_EXCEEDED
    http: 409
    condition: "the half-open outage window would put MAX_CONCURRENT_OUTAGES or more other commissioned outages of the project in flight at some instant"
  # ---- fiscal
  - id: ERR_REVIEW_FEE_OUTSTANDING
    http: 402
    condition: "review was opened while the project's review_fee_balance_usd is above 0.00"
  - id: ERR_FEE_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_usd exceeds the project's review_fee_balance_usd"

roles:
  - name: FirmAdmin
    description: "Firm operations administrator: registers engineers and authority reviewers, opens projects, records fee payments and drives the logical clock in test scenarios."
    identity: "opaque"
    exclusive_operations:
      - "POST /engineers"
      - "POST /ahj-reviewers"
      - "POST /projects"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /projects/{id}/fee-payments (with Contractor)"
      - "every GET endpoint (with all roles)"
  - name: DesignEngineer
    description: "Engineer of record for the project. Owns hazard classification, hydraulic calculation, supply evaluation, pump sizing, sealing, trade clearance disposition, permit submittals and comment responses. Every write is refused unless the acting engineer is the project's lead_engineer_id."
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /hazard-areas"
      - "POST /hazard-areas/{id}/reclassify"
      - "POST /water-supply-evaluations"
      - "POST /hydraulic-calculations"
      - "POST /hydraulic-calculations/{id}/iterations"
      - "POST /hydraulic-calculations/{id}/seal"
      - "POST /fire-pumps"
      - "POST /auxiliary-systems"
      - "POST /auxiliary-systems/{id}/withdraw"
      - "POST /trade-clearances/{id}/record"
      - "POST /submittals"
      - "POST /submittals/{id}/resubmit"
      - "POST /review-comments/{id}/respond"
    shared_operations:
      - "POST /flow-tests (with Contractor)"
      - "every GET endpoint (with all roles)"
  - name: QcReviewer
    description: "Second engineer performing the independent QC check. Backed by the same Engineer table as DesignEngineer, but the acting QC reviewer may never be the author of the calculation under review - the segregation-of-duties rule."
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /hydraulic-calculations/{id}/qc-review"
    shared_operations:
      - "every GET endpoint (with all roles)"
  - name: Contractor
    description: "Installing sprinkler contractor: records hydrant flow tests, prepares shop drawings and trade coordination items, commissions auxiliary systems with their outage windows, opens acceptance tests, lodges as-built documentation and pays authority review fees."
    identity: "opaque"
    exclusive_operations:
      - "POST /shop-drawings"
      - "POST /shop-drawings/{id}/trade-clearances"
      - "POST /auxiliary-systems/{id}/commission"
      - "POST /acceptance-tests"
      - "POST /acceptance-tests/{id}/submit-as-built"
    shared_operations:
      - "POST /flow-tests (with DesignEngineer)"
      - "POST /projects/{id}/fee-payments (with FirmAdmin)"
      - "every GET endpoint (with all roles)"
  - name: AhjReviewer
    description: "Authority having jurisdiction plan reviewer and witness. Opens and closes review passes, raises and disposes of review comments, books and witnesses acceptance tests and accepts the as-built record. Every write is refused unless the acting reviewer is the project's ahj_reviewer_id."
    identity: "entity_backed:AhjReviewer"
    exclusive_operations:
      - "POST /submittals/{id}/begin-review"
      - "POST /submittals/{id}/comments"
      - "POST /submittals/{id}/complete-review"
      - "POST /review-comments/{id}/close"
      - "POST /acceptance-tests/{id}/schedule-witness"
      - "POST /acceptance-tests/{id}/record-witness"
      - "POST /acceptance-tests/{id}/accept-as-built"
    shared_operations:
      - "every GET endpoint (with all roles)"
