            - { call: "POST /underwriting-cases/${c}/quotes", payload: { plan_design_id: "${p}", funding_type: "FULLY_INSURED", rate_guarantee_months: 12, enrollment_change_threshold: 0.1, expected_case_version: "${cv1}" }, as: Underwriter, captures: { q1: "$.data.id" } }
            - { call: "GET /underwriting-cases/${c}", payload: {}, as: Underwriter, captures: { cv2: "$.data.version" } }
            - { call: "POST /underwriting-cases/${c}/quotes", payload: { plan_design_id: "${p}", funding_type: "FULLY_INSURED", rate_guarantee_months: 18, enrollment_change_threshold: 0.1, expected_case_version: "${cv2}" }, as: Underwriter, captures: { q2: "$.data.id" } }
