scenario: |
  2891. Game Development Milestone & Publisher Funding (video game developer): development
  agreement with milestone definitions, acceptance criteria and payment schedule, milestone
  build delivery with feature completeness, stability and content thresholds, publisher review
  with acceptance, conditional acceptance or rejection and cure periods, scope change management
  with additional funding or feature cuts against the ship date, recoupment terms with royalty
  rates applied after advance recovery and cost deductions, intellectual property ownership,
  sequel rights and reversion provisions, external contractor and outsourcing management within
  the milestone budget, post-launch support obligations and live operations funding

domain_name: "game-milestone-publisher-funding"

# Flat topology: every business collection is a top-level path segment and children carry
# foreign keys in the request body. `api_prefix: "/"` means endpoint paths below ARE the
# absolute paths (no extra mount segment is prepended by any downstream generator).
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections joined by FK fields in request bodies; only three read-only
  # sub-resource GETs exist (builds / invoices / royalty-statements) and they are
  # reverse-lookup channels, not ownership paths.

  state_machine_shape: cyclic
  # Milestone loops UNDER_REVIEW -> CURE_PENDING -> UNDER_REVIEW and
  # UNDER_REVIEW -> IN_DEVELOPMENT -> UNDER_REVIEW (rejection + resubmission rounds);
  # DevelopmentAgreement loops ACTIVE -> SUSPENDED -> ACTIVE; MilestonePayment loops
  # PENDING_AUTHORIZATION -> HELD_PENDING_CURE -> PENDING_AUTHORIZATION; ChangeOrder is a
  # branching fork with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - self_referential      # Milestone.depends_on_milestone_id -> Milestone.id
    - cross_aggregate       # ContractorEngagement.studio_id denormalises the agreement's studio

  role_model: segregation_of_duties
  # The PublisherUser who recorded the accepting PublisherReview may never authorize the
  # resulting MilestonePayment; PublisherUser.function must also match the acting role.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 48 endpoints / 67 error codes / 8 state machines / 11 calculations,
  # 2 of which carry named variants.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the developing studio."
        constraints: "1..120 chars, non-blank"
      - name: contact_email
        type: string
        source: input
        description: "Primary business contact address for the studio."
        constraints: "1..160 chars, must contain exactly one '@' and a non-empty local and domain part"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of incorporation."
        constraints: "exactly 2 uppercase letters"

  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the publisher."
        constraints: "1..120 chars, non-blank"
      - name: contact_email
        type: string
        source: input
        description: "Primary business contact address for the publisher."
        constraints: "1..160 chars, must contain exactly one '@' and a non-empty local and domain part"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 code of the publisher's primary distribution territory."
        constraints: "exactly 2 uppercase letters"

  - name: PublisherUser
    parent: null
    common_fields: true
    fields:
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; the publisher this operator acts for."
      - name: display_name
        type: string
        source: input
        description: "Operator display name."
        constraints: "1..80 chars, non-blank"
      - name: function
        type: enum
        source: input
        description: "Which publisher-side function this operator is licensed for. DUAL is licensed for both, which is what makes the payment-level segregation-of-duties check (priority 45) reachable."
        constraints: "one of {REVIEW, FINANCE, DUAL}"

  - name: DevelopmentAgreement
    parent: null
    common_fields: true
    fields:
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id; the developer party."
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; the funding party."
      - name: title
        type: string
        source: input
        description: "Working title of the funded game."
        constraints: "1..160 chars, non-blank"
      - name: advance_total_cents
        type: integer
        source: input
        description: "Total recoupable advance the publisher commits at signature, in cents."
        constraints: ">= 100000"
      - name: royalty_rate_bps
        type: integer
        source: input
        description: "Post-recoupment royalty rate in basis points applied to the developer's share."
        constraints: "500..5000"
      - name: recoupable_cost_cap_bps
        type: integer
        source: input
        default: 2000
        description: "Cap on deductible publisher costs, in basis points of distributable revenue."
        constraints: "0..4000"
      - name: platform_fee_bps
        type: integer
        source: input
        default: 3000
        description: "Storefront/platform fee withheld from net revenue before distribution, in basis points."
        constraints: "0..5000"
      - name: live_ops_quarterly_funding_cents
        type: integer
        source: input
        default: 0
        description: "Per-quarter live-operations funding envelope available after launch, in cents."
        constraints: ">= 0"
      - name: ship_date_original
        type: string
        source: input
        description: "Contractual ship date at signature, ISO 8601 date (YYYY-MM-DD)."
        constraints: "must be strictly after the logical clock date at creation"
      - name: ship_date_current
        type: string
        source: computed
        description: "Ship date after applying every decided ChangeOrder delta; see calculations.ship_date_schedule."
      - name: schedule_slip_days
        type: integer
        source: computed
        default: 0
        description: "ship_date_current minus ship_date_original in whole days; negative when scope cuts pulled the date in."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Agreement lifecycle state."
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, TERMINATED, COMPLETED}"
      - name: funding_posture
        type: enum
        source: computed
        default: OPEN
        description: "Derived funding gate; see calculations.agreement_funding_ledger."
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: recoupment_state
        type: enum
        source: computed
        default: PRE_RECOUP
        description: "Derived recoupment stage; see calculations.royalty_settlement."
        constraints: "one of {PRE_RECOUP, RECOUPING, RECOUPED}"
      - name: uplift_funded_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of requested_amount_cents over ChangeOrder rows in state APPROVED_UPLIFT."
      - name: funding_pool_cents
        type: integer
        source: computed
        description: "advance_total_cents + uplift_funded_cents."
      - name: committed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Milestone.funded_amount_cents + Milestone.uplift_cents over milestones whose status != CANCELLED."
      - name: available_funding_cents
        type: integer
        source: computed
        description: "funding_pool_cents - committed_cents; the conserved headroom of invariant funding_pool_conservation."
      - name: accepted_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of funded_amount_cents + uplift_cents over milestones whose status == ACCEPTED."
      - name: advance_disbursed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of MilestonePayment.net_amount_cents over payments whose status == AUTHORIZED."
      - name: holdback_reserve_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of MilestonePayment.holdback_cents over payments whose status == AUTHORIZED."
      - name: withheld_payment_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of MilestonePayment.scheduled_amount_cents over payments whose status IN {HELD_PENDING_CURE, WITHHELD}."
      - name: advance_recouped_cents
        type: integer
        source: computed
        default: 0
        description: "Life-to-date advance recovered from revenue; set by the FINAL variant of calculations.royalty_settlement."
      - name: unrecouped_advance_cents
        type: integer
        source: computed
        default: 0
        description: "advance_disbursed_cents - advance_recouped_cents; floor 0."
      - name: royalties_paid_to_date_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of RoyaltyStatement.final_royalty_payable_cents over statements whose state == FINALIZED."
      - name: breach_count
        type: integer
        source: computed
        default: 0
        description: "Count of Milestone rows on this agreement whose status == BREACHED."
      - name: accepted_milestone_ratio
        type: number
        source: computed
        default: 0.0
        description: "Accepted milestone count divided by total milestone count ever created, 4 decimal places; see calculations.ip_reversion_scope."
      - name: sequel_rights_holder
        type: enum
        source: computed
        default: PUBLISHER
        description: "Who holds sequel rights; recomputed on termination and on completion."
        constraints: "one of {PUBLISHER, SHARED, DEVELOPER}"
      - name: ip_reversion_state
        type: enum
        source: computed
        default: NONE
        description: "Reversion outcome recorded when the agreement leaves ACTIVE/SUSPENDED for good."
        constraints: "one of {NONE, PARTIAL_REVERSION, REVERTED_TO_DEVELOPER, RETAINED_BY_PUBLISHER}"
      - name: post_launch_support_state
        type: enum
        source: computed
        default: PENDING
        description: "Post-launch support obligation state; ACTIVE unlocks live-ops draws."
        constraints: "one of {PENDING, ACTIVE, EXPIRED}"
      - name: live_ops_drawn_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative live-operations funding drawn by the studio, in cents."
      - name: terminated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the agreement was terminated, ISO 8601 UTC with three fractional digits."

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> DevelopmentAgreement.id; the funding agreement this milestone belongs to."
      - name: depends_on_milestone_id
        type: string
        source: input
        default: null
        description: "FK -> Milestone.id; self-referential predecessor that must reach ACCEPTED before this milestone may leave DEFINED. Null for the first milestone."
      - name: sequence_index
        type: integer
        source: input
        description: "1-based position in the payment schedule; unique per agreement_id."
        constraints: ">= 1, unique per agreement_id"
      - name: title
        type: string
        source: input
        description: "Milestone name as written in the development agreement."
        constraints: "1..120 chars, non-blank"
      - name: gate_profile
        type: enum
        source: input
        description: "Acceptance-threshold profile applied to every build submitted against this milestone."
        constraints: "one of {ALPHA, BETA, GOLD}"
      - name: funded_amount_cents
        type: integer
        source: input
        description: "Scheduled payment for this milestone at signature, in cents."
        constraints: ">= 10000"
      - name: uplift_cents
        type: integer
        source: computed
        default: 0
        description: "Additional funding attached by ChangeOrder rows in state APPROVED_UPLIFT that target this milestone; reduced by APPROVED_CUT credits."
      - name: contractor_budget_cents
        type: integer
        source: input
        description: "Ceiling for external contractor commitments inside this milestone, in cents."
        constraints: ">= 0"
      - name: acceptance_criteria
        type: array
        source: input
        description: "Ordered list of acceptance-criteria strings; PublisherReview conditions are indexed into this list."
        constraints: "1..20 non-blank strings"
      - name: status
        type: enum
        source: system
        default: DEFINED
        description: "Milestone lifecycle state."
        constraints: "one of {DEFINED, IN_DEVELOPMENT, UNDER_REVIEW, CURE_PENDING, ACCEPTED, BREACHED, CANCELLED}"
      - name: content_threshold_relief_pct
        type: number
        source: computed
        default: 0.0
        description: "Percentage points subtracted from the content threshold by APPROVED_CUT change orders, 2 decimal places."
      - name: cure_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this milestone has entered CURE_PENDING; drives the cure penalty in calculations.payment_disbursement."
      - name: cure_deadline_at
        type: datetime
        source: computed
        default: null
        description: "Inclusive deadline for a cure resubmission, ISO 8601 UTC with three fractional digits; set when the milestone enters CURE_PENDING."
      - name: open_condition_indexes
        type: array
        source: computed
        description: "Acceptance-criteria indexes still outstanding from the latest CONDITIONAL review; empty when no cure is pending."
        default: []
      - name: latest_build_number
        type: integer
        source: computed
        default: 0
        description: "Highest build_number ever accepted onto this milestone; new builds must exceed it."
      - name: accepted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the milestone reached ACCEPTED, ISO 8601 UTC with three fractional digits."

  - name: MilestoneBuild
    parent: null
    common_fields: true
    fields:
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; the milestone this build is delivered against."
      - name: build_number
        type: integer
        source: input
        description: "Monotonically increasing build number within the milestone."
        constraints: ">= 1, must exceed Milestone.latest_build_number"
      - name: feature_completeness_pct
        type: number
        source: input
        description: "Share of milestone features implemented, 2 decimal places."
        constraints: "0.00..100.00"
      - name: crash_free_sessions_pct
        type: number
        source: input
        description: "Stability metric: percentage of crash-free play sessions, 2 decimal places."
        constraints: "0.00..100.00"
      - name: content_completeness_pct
        type: number
        source: input
        description: "Share of shippable content present, 2 decimal places."
        constraints: "0.00..100.00"
      - name: known_blocker_count
        type: integer
        source: input
        description: "Count of open blocker-severity defects declared by the studio."
        constraints: ">= 0"
      - name: addressed_condition_indexes
        type: array
        source: input
        default: []
        description: "Acceptance-criteria indexes this build claims to have cured; must cover Milestone.open_condition_indexes on a cure resubmission."
      - name: readiness_score
        type: number
        source: computed
        description: "Weighted readiness score, 2 decimal places; see calculations.build_gate_evaluation."
      - name: gate_state
        type: enum
        source: computed
        default: PASSED
        description: "PASSED while this is the build under review or the accepted build; SUPERSEDED once a newer build is submitted onto the same milestone."
        constraints: "one of {PASSED, SUPERSEDED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of submission, ISO 8601 UTC with three fractional digits."

  - name: PublisherReview
    parent: null
    common_fields: false
    fields:
      - name: build_id
        type: string
        source: input
        description: "FK -> MilestoneBuild.id; the build being reviewed."
      - name: reviewer_user_id
        type: string
        source: system
        description: "FK -> PublisherUser.id; copied from the X-User-ID header of the acting PublisherReviewer."
      - name: verdict
        type: enum
        source: input
        description: "Review outcome."
        constraints: "one of {ACCEPTED, CONDITIONAL, REJECTED}"
      - name: conditions
        type: array
        source: input
        default: []
        description: "Acceptance-criteria indexes that must be cured; required non-empty when verdict == CONDITIONAL, must be empty otherwise."
      - name: cure_days
        type: integer
        source: input
        default: 14
        description: "Length of the cure period in whole days; only meaningful when verdict == CONDITIONAL."
        constraints: "1..30"
      - name: review_window_start_at
        type: datetime
        source: input
        description: "Start of the reviewer's occupied review window, ISO 8601 UTC with three fractional digits."
      - name: review_window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the reviewer's occupied review window, ISO 8601 UTC with three fractional digits."
      - name: cure_deadline_at
        type: datetime
        source: computed
        default: null
        description: "decided_at + cure_days days when verdict == CONDITIONAL, else null; ISO 8601 UTC with three fractional digits."
      - name: notes
        type: string
        source: input
        default: null
        description: "Free-text reviewer notes."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant the verdict was recorded, ISO 8601 UTC with three fractional digits."

  - name: MilestonePayment
    parent: null
    common_fields: true
    fields:
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; the accepted milestone this payment settles. Created only by the acceptance cascade."
      - name: authorized_by_user_id
        type: string
        source: system
        default: null
        description: "FK -> PublisherUser.id; the PublisherFinance operator who authorized the disbursement."
      - name: scheduled_amount_cents
        type: integer
        source: computed
        description: "Milestone.funded_amount_cents + Milestone.uplift_cents at the instant of acceptance."
      - name: contractor_overrun_cents
        type: integer
        source: computed
        default: null
        description: "Contractor spend above the milestone contractor budget on the INCURRED basis; deducted at authorization."
      - name: gross_amount_cents
        type: integer
        source: computed
        default: null
        description: "scheduled_amount_cents - contractor_overrun_cents; step 1 of calculations.payment_disbursement."
      - name: holdback_bps
        type: integer
        source: computed
        default: null
        description: "Quality holdback rate selected from the gross-amount tier plus any cure penalty."
      - name: holdback_cents
        type: integer
        source: computed
        default: null
        description: "Holdback withheld from the gross amount, in cents."
      - name: net_amount_cents
        type: integer
        source: computed
        default: null
        description: "gross_amount_cents - holdback_cents; the amount actually disbursed."
      - name: status
        type: enum
        source: system
        default: PENDING_AUTHORIZATION
        description: "Payment lifecycle state."
        constraints: "one of {PENDING_AUTHORIZATION, HELD_PENDING_CURE, AUTHORIZED, WITHHELD}"
      - name: authorized_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of authorization, ISO 8601 UTC with three fractional digits."

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> DevelopmentAgreement.id; the agreement whose scope is being changed."
      - name: target_milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; the milestone whose funding or content scope changes."
      - name: order_type
        type: enum
        source: input
        description: "Branch selector: extra money, or scope removed."
        constraints: "one of {FUNDING_UPLIFT, FEATURE_CUT}"
      - name: requested_amount_cents
        type: integer
        source: input
        default: 0
        description: "Additional funding requested (FUNDING_UPLIFT) or funding credited back (FEATURE_CUT), in cents."
        constraints: ">= 0"
      - name: ship_date_delta_days
        type: integer
        source: input
        default: 0
        description: "Whole-day shift applied to DevelopmentAgreement.ship_date_current when this order is approved; may be negative."
        constraints: "-60..60"
      - name: content_threshold_relief_pct
        type: number
        source: input
        default: 0.0
        description: "Percentage points removed from the target milestone's content threshold when a FEATURE_CUT is approved, 2 decimal places."
        constraints: "0.00..25.00"
      - name: rationale
        type: string
        source: input
        description: "Justification recorded on the change order."
        constraints: "1..500 chars, non-blank"
      - name: state
        type: enum
        source: system
        default: PROPOSED
        description: "Change-order lifecycle state; SUPERSEDED is set when a newer proposal replaces this one on the same target milestone."
        constraints: "one of {PROPOSED, APPROVED_UPLIFT, APPROVED_CUT, DECLINED, SUPERSEDED}"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the publisher decision, ISO 8601 UTC with three fractional digits."

  - name: ContractorEngagement
    parent: null
    common_fields: true
    fields:
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; the milestone whose budget funds this engagement."
      - name: studio_id
        type: string
        source: system
        description: "FK -> Studio.id; copied from the milestone's agreement. Scope key for the vendor cooldown rule."
      - name: vendor_code
        type: string
        source: input
        description: "Stable code of the external contractor; overlap is evaluated per (studio_id, vendor_code)."
        constraints: "2..40 chars, uppercase letters, digits and dashes"
      - name: scope_summary
        type: string
        source: input
        description: "Outsourced scope description."
        constraints: "1..300 chars, non-blank"
      - name: committed_cents
        type: integer
        source: input
        description: "Amount of the milestone contractor budget committed to this engagement, in cents."
        constraints: ">= 1"
      - name: start_date
        type: string
        source: input
        description: "First calendar day of the engagement, ISO 8601 date (YYYY-MM-DD); interval is closed [start_date, end_date]."
      - name: end_date
        type: string
        source: input
        description: "Last calendar day of the engagement, ISO 8601 date (YYYY-MM-DD)."
        constraints: ">= start_date"
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle state; the initial state is PROPOSED when the milestone is DEFINED and ACTIVE otherwise."
        constraints: "one of {PROPOSED, ACTIVE, SUSPENDED, COMPLETED, CANCELLED, TERMINATED_EARLY}"
      - name: approved_invoice_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ContractorInvoice.amount_cents over invoices of this engagement whose status == APPROVED."

  - name: ContractorInvoice
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> ContractorEngagement.id; the engagement being billed."
      - name: invoice_number
        type: string
        source: input
        description: "Vendor invoice number; unique per engagement_id."
        constraints: "1..40 chars, unique per engagement_id"
      - name: amount_cents
        type: integer
        source: input
        description: "Invoice amount in cents."
        constraints: ">= 1"
      - name: period_end_date
        type: string
        source: input
        description: "Last day of the billed period, ISO 8601 date (YYYY-MM-DD)."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Invoice lifecycle state."
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, VOIDED}"
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: "Reason recorded when the publisher rejects the invoice."
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the publisher decision, ISO 8601 UTC with three fractional digits."

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> DevelopmentAgreement.id; the agreement this statement settles."
      - name: period_label
        type: string
        source: input
        description: "Reporting period label, e.g. 2027-Q3; at most one FINALIZED statement per (agreement_id, period_label)."
        constraints: "matches ^[0-9]{4}-Q[1-4]$"
      - name: revenue_lines
        type: array
        source: input
        description: "Per-platform revenue lines: objects { platform_code: string, gross_cents: integer >= 0, returns_cents: integer >= 0 }. May be empty."
        constraints: "0..12 objects; returns_cents <= gross_cents per line; platform_code unique within the statement"
      - name: recoupable_cost_cents
        type: integer
        source: input
        default: 0
        description: "Publisher costs claimed against this period before the cap is applied, in cents."
        constraints: ">= 0"
      - name: distributable_total_cents
        type: integer
        source: computed
        description: "Sum over lines of (net_line - per-line rounded platform fee); see calculations.royalty_settlement."
      - name: cost_deduction_cents
        type: integer
        source: computed
        description: "Allowed recoupable cost after the cap; basis differs per variant."
      - name: recoupment_base_cents
        type: integer
        source: computed
        description: "distributable_total_cents - cost_deduction_cents, floor 0 (PROVISIONAL basis)."
      - name: recoup_applied_cents
        type: integer
        source: computed
        description: "Advance recovered by this statement under the applied variant."
      - name: royalty_base_cents
        type: integer
        source: computed
        description: "recoupment_base_cents - recoup_applied_cents; the amount royalty is charged on."
      - name: provisional_royalty_payable_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant result: per-line rounded royalty summed across revenue lines."
      - name: final_royalty_payable_cents
        type: integer
        source: computed
        default: null
        description: "FINAL variant result at finalization: cumulative royalty owed minus royalties already paid."
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: "Statement lifecycle state; SUPERSEDED is set when a newer DRAFT replaces this one for the same period."
        constraints: "one of {DRAFT, FINALIZED, SUPERSEDED}"
      - name: finalized_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of finalization, ISO 8601 UTC with three fractional digits."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DevelopmentAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /development-agreements/{id}/activate"
        actor: PublisherFinance
        preconditions:
          - "agreement.status == DRAFT"
          - "at least one Milestone exists with agreement_id == agreement.id"
          - "committed_cents == funding_pool_cents (the milestone schedule must exhaust the advance exactly; validation priority 27)"
        side_effects:
          - "Sets status = ACTIVE and funding_posture = OPEN."
          - "Cascade step 1: every Milestone of this agreement with status == DEFINED and depends_on_milestone_id == null transitions DEFINED -> IN_DEVELOPMENT."
          - "Cascade step 2: because those milestones became IN_DEVELOPMENT, each ContractorEngagement of those milestones with status == PROPOSED transitions PROPOSED -> ACTIVE. At first activation this step is vacuous (POST /contractor-engagements requires an ACTIVE agreement by validation priority 23, so no engagement can predate activation); it is stated for symmetry with the dependent-milestone unlock, where PROPOSED -> ACTIVE does fire."
          - "Recomputes calculations.agreement_funding_ledger (committed_cents, available_funding_cents, funding_posture)."
          - "increments DevelopmentAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /development-agreements/{id}/suspend, or system cure-sweep breach escalation"
        actor: PublisherFinance | system
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "Sets status = SUSPENDED and funding_posture = FROZEN."
          - "Cascade step 1: every MilestonePayment of this agreement with status == PENDING_AUTHORIZATION transitions PENDING_AUTHORIZATION -> HELD_PENDING_CURE."
          - "Cascade step 2: because payments moved to HELD_PENDING_CURE, withheld_payment_cents is recomputed as the sum of their scheduled_amount_cents."
          - "Cascade step 3: every ContractorEngagement whose milestone belongs to this agreement and whose status == ACTIVE transitions ACTIVE -> SUSPENDED."
          - "increments DevelopmentAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /development-agreements/{id}/reinstate"
        actor: PublisherFinance
        preconditions:
          - "agreement.status == SUSPENDED"
          - "no Milestone of this agreement has status == BREACHED (breach_count == 0)"
        side_effects:
          - "Compensation of the SUSPEND transition, applied in this order."
          - "Cascade step 1: every MilestonePayment with status == HELD_PENDING_CURE transitions HELD_PENDING_CURE -> PENDING_AUTHORIZATION; withheld_payment_cents recomputed to 0."
          - "Cascade step 2: every ContractorEngagement with status == SUSPENDED is restored exactly, in this order: it STAYS SUSPENDED when the recomputed funding_posture == RESTRICTED and its milestone.status IN {DEFINED, IN_DEVELOPMENT}, or when its milestone.status IN {CANCELLED, BREACHED}; otherwise it returns to PROPOSED when milestone.status == DEFINED and to ACTIVE when milestone.status IN {IN_DEVELOPMENT, UNDER_REVIEW, CURE_PENDING, ACCEPTED}."
          - "Cascade step 3: funding_posture recomputed by calculations.agreement_funding_ledger (OPEN or RESTRICTED, never FROZEN)."
          - "Invariant payment_obligation_conservation holds: sum(MilestonePayment.scheduled_amount_cents) == accepted_value_cents before and after the suspend/reinstate pair."
          - "increments DevelopmentAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /development-agreements/{id}/terminate"
        actor: PublisherFinance
        preconditions:
          - "agreement.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "Sets status = TERMINATED, funding_posture = FROZEN, terminated_at = logical clock."
          - "Cascade step 1: every Milestone with status IN {DEFINED, IN_DEVELOPMENT, UNDER_REVIEW, CURE_PENDING} transitions to CANCELLED."
          - "Cascade step 2: every MilestonePayment of this agreement with status IN {PENDING_AUTHORIZATION, HELD_PENDING_CURE} transitions to WITHHELD (a terminated agreement disburses nothing further, whatever its milestone's status), and every ContractorEngagement of a CANCELLED milestone with status IN {PROPOSED, ACTIVE, SUSPENDED} transitions to TERMINATED_EARLY."
          - "Cascade step 3: because those engagements became TERMINATED_EARLY, every ContractorInvoice of theirs with status == SUBMITTED transitions to VOIDED."
          - "Cascade step 4: because the milestone set changed, committed_cents / available_funding_cents / accepted_milestone_ratio are recomputed, then ip_reversion_state and sequel_rights_holder are set by calculations.ip_reversion_scope."
          - "Invariant funding_pool_conservation holds after the cascade: available_funding_cents == funding_pool_cents - committed_cents."
          - "increments DevelopmentAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /development-agreements/{id}/terminate"
        actor: PublisherFinance
        preconditions:
          - "agreement.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "Identical cascade to the ACTIVE -> TERMINATED transition, including the four ordered cascade steps."
          - "increments DevelopmentAgreement.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: the Milestone with gate_profile == GOLD reaches ACCEPTED and every Milestone of the agreement has status IN {ACCEPTED, CANCELLED}"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "exists Milestone with gate_profile == GOLD and status == ACCEPTED"
          - "no Milestone with status IN {DEFINED, IN_DEVELOPMENT, UNDER_REVIEW, CURE_PENDING, BREACHED}"
        side_effects:
          - "Sets status = COMPLETED and post_launch_support_state = ACTIVE (unlocks live-ops draws)."
          - "Sets ip_reversion_state and sequel_rights_holder per calculations.ip_reversion_scope."
          - "MilestonePayment rows already in PENDING_AUTHORIZATION stay authorizable: authorization is permitted while status IN {ACTIVE, COMPLETED}."
          - "increments DevelopmentAgreement.version by 1"
        note: "Auto-transition evaluated at the end of the acceptance cascade, after the funding ledger is recomputed."

  - entity: Milestone
    initial_state: DEFINED
    terminal_states: [ACCEPTED, BREACHED, CANCELLED]
    transitions:
      - from: DEFINED
        to: IN_DEVELOPMENT
        trigger: "system: agreement activation (depends_on_milestone_id == null) or predecessor milestone reaching ACCEPTED"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "depends_on_milestone_id == null OR the predecessor Milestone.status == ACCEPTED"
        side_effects:
          - "Cascade: every ContractorEngagement of this milestone with status == PROPOSED transitions PROPOSED -> ACTIVE."
      - from: IN_DEVELOPMENT
        to: UNDER_REVIEW
        trigger: "POST /milestone-builds"
        actor: Developer
        preconditions:
          - "agreement.status == ACTIVE"
          - "milestone.status IN {IN_DEVELOPMENT, CURE_PENDING}"
          - "depends_on_milestone_id == null OR predecessor Milestone.status == ACCEPTED"
          - "build_number > milestone.latest_build_number"
          - "calculations.build_gate_evaluation returns pass == true"
        side_effects:
          - "Creates the MilestoneBuild with gate_state = PASSED and readiness_score."
          - "Cascade: every earlier MilestoneBuild of this milestone with gate_state == PASSED transitions PASSED -> SUPERSEDED."
          - "Sets milestone.latest_build_number = build.build_number."
      - from: CURE_PENDING
        to: UNDER_REVIEW
        trigger: "POST /milestone-builds (cure resubmission)"
        actor: Developer
        preconditions:
          - "agreement.status == ACTIVE"
          - "logical clock <= milestone.cure_deadline_at (inclusive)"
          - "build.addressed_condition_indexes is a superset of milestone.open_condition_indexes"
          - "calculations.build_gate_evaluation returns pass == true with the cure content uplift applied"
          - "build_number > milestone.latest_build_number"
        side_effects:
          - "Same build side effects as IN_DEVELOPMENT -> UNDER_REVIEW."
          - "Clears milestone.open_condition_indexes to [] and milestone.cure_deadline_at to null."
        note: "Cycle: a milestone may re-enter UNDER_REVIEW any number of times while each cure window is honored; cure_count is never decremented."
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /publisher-reviews with verdict == ACCEPTED"
        actor: PublisherReviewer
        preconditions:
          - "agreement.status == ACTIVE"
          - "the reviewed build has gate_state == PASSED and no PublisherReview already exists for it"
          - "reviewer's PublisherUser.publisher_id == agreement.publisher_id"
          - "no other PublisherReview of this reviewer_user_id occupies an overlapping review window"
        side_effects:
          - "Sets status = ACCEPTED, accepted_at = logical clock, open_condition_indexes = []."
          - "Cascade step 1: creates one MilestonePayment with status = PENDING_AUTHORIZATION and scheduled_amount_cents = funded_amount_cents + uplift_cents."
          - "Cascade step 2: because this milestone became ACCEPTED, every Milestone whose depends_on_milestone_id == this milestone and whose status == DEFINED transitions DEFINED -> IN_DEVELOPMENT (which in turn promotes their PROPOSED engagements to ACTIVE)."
          - "Cascade step 3: because accepted_value_cents grew, calculations.agreement_funding_ledger re-evaluates funding_posture; posture flips OPEN -> RESTRICTED once accepted_value_cents >= round_half_up(funding_pool_cents * RESTRICT_TRIGGER_BPS / 10000)."
          - "Cascade step 4: because funding_posture became RESTRICTED, every ContractorEngagement of this agreement whose status IN {PROPOSED, ACTIVE} and whose milestone.status IN {DEFINED, IN_DEVELOPMENT} transitions to SUSPENDED; engagements whose milestone.status == ACCEPTED are left untouched."
          - "Cascade step 5: the DevelopmentAgreement ACTIVE -> COMPLETED auto-transition is evaluated last."
          - "increments DevelopmentAgreement.version by 1"
        note: "Cascade steps run in the listed order: dependent unlock (step 2) happens before posture suspension (step 4), so an engagement promoted to ACTIVE in step 2 can still be suspended in step 4."
      - from: UNDER_REVIEW
        to: CURE_PENDING
        trigger: "POST /publisher-reviews with verdict == CONDITIONAL"
        actor: PublisherReviewer
        preconditions:
          - "agreement.status == ACTIVE"
          - "review.conditions is non-empty and every index is a valid acceptance_criteria index"
          - "the reviewed build has gate_state == PASSED and no PublisherReview already exists for it"
        side_effects:
          - "Sets status = CURE_PENDING, cure_count += 1, open_condition_indexes = review.conditions."
          - "Sets cure_deadline_at = review.decided_at + review.cure_days days (calculations.cure_window)."
          - "No MilestonePayment is created and no funding ledger field changes."
      - from: UNDER_REVIEW
        to: IN_DEVELOPMENT
        trigger: "POST /publisher-reviews with verdict == REJECTED"
        actor: PublisherReviewer
        preconditions:
          - "agreement.status == ACTIVE"
          - "review.conditions is empty"
          - "the reviewed build has gate_state == PASSED and no PublisherReview already exists for it"
        side_effects:
          - "Sets status = IN_DEVELOPMENT, open_condition_indexes = [], cure_deadline_at = null."
          - "Cascade: the reviewed MilestoneBuild transitions PASSED -> SUPERSEDED."
        note: "Cycle back to IN_DEVELOPMENT; the studio may submit a higher build_number and re-enter UNDER_REVIEW."
      - from: CURE_PENDING
        to: BREACHED
        trigger: "POST /development-agreements/{id}/cure-sweep"
        actor: PublisherFinance
        preconditions:
          - "agreement.status == ACTIVE"
          - "milestone.status == CURE_PENDING"
          - "logical clock > milestone.cure_deadline_at"
        side_effects:
          - "Sets status = BREACHED."
          - "Cascade step 1: because a milestone became BREACHED, agreement.breach_count is recomputed."
          - "Cascade step 2: because breach_count >= 1, the agreement transitions ACTIVE -> SUSPENDED with funding_posture = FROZEN."
          - "Cascade step 3: because the agreement became SUSPENDED, its PENDING_AUTHORIZATION payments become HELD_PENDING_CURE and its ACTIVE engagements become SUSPENDED."
          - "Cascade step 4: because payments moved to HELD_PENDING_CURE, withheld_payment_cents is recomputed."
      - from: IN_DEVELOPMENT
        to: CANCELLED
        trigger: "system: agreement termination cascade"
        actor: system
        preconditions:
          - "agreement.status == TERMINATED"
        side_effects:
          - "Releases committed funding: agreement.committed_cents and available_funding_cents recomputed."
      - from: DEFINED
        to: CANCELLED
        trigger: "system: agreement termination cascade"
        actor: system
        preconditions:
          - "agreement.status == TERMINATED"
        side_effects:
          - "Releases committed funding: agreement.committed_cents and available_funding_cents recomputed."
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "system: agreement termination cascade"
        actor: system
        preconditions:
          - "agreement.status == TERMINATED"
        side_effects:
          - "Releases committed funding and voids the pending review round; the build keeps gate_state == PASSED."
      - from: CURE_PENDING
        to: CANCELLED
        trigger: "system: agreement termination cascade"
        actor: system
        preconditions:
          - "agreement.status == TERMINATED"
        side_effects:
          - "Releases committed funding; cure_deadline_at is retained for audit."

  - entity: MilestoneBuild
    initial_state: PASSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PASSED
        to: SUPERSEDED
        trigger: "system: a newer MilestoneBuild is created on the same milestone, or a REJECTED PublisherReview is recorded on this build"
        actor: system
        preconditions:
          - "build.gate_state == PASSED"
        side_effects:
          - "No funding effect; the superseded build remains readable through GET /milestones/{id}/builds."

  - entity: MilestonePayment
    initial_state: PENDING_AUTHORIZATION
    terminal_states: [AUTHORIZED, WITHHELD]
    transitions:
      - from: PENDING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "POST /milestone-payments/{id}/authorize"
        actor: PublisherFinance
        preconditions:
          - "payment.status == PENDING_AUTHORIZATION"
          - "the payment's Milestone.status == ACCEPTED"
          - "the Milestone's DevelopmentAgreement.status IN {ACTIVE, COMPLETED}"
          - "X-User-ID != the reviewer_user_id of the PublisherReview whose verdict == ACCEPTED for this milestone (segregation of duties)"
          - "acting PublisherUser.function IN {FINANCE, DUAL} and PublisherUser.publisher_id == agreement.publisher_id"
        side_effects:
          - "Runs calculations.payment_disbursement and stores contractor_overrun_cents, gross_amount_cents, holdback_bps, holdback_cents, net_amount_cents."
          - "Sets status = AUTHORIZED, authorized_at = logical clock, authorized_by_user_id = X-User-ID."
          - "Cascade step 1: agreement.advance_disbursed_cents += net_amount_cents and agreement.holdback_reserve_cents += holdback_cents."
          - "Cascade step 2: because advance_disbursed_cents changed, unrecouped_advance_cents = advance_disbursed_cents - advance_recouped_cents and recoupment_state moves PRE_RECOUP -> RECOUPING once advance_disbursed_cents > 0."
          - "increments DevelopmentAgreement.version by 1"
      - from: PENDING_AUTHORIZATION
        to: HELD_PENDING_CURE
        trigger: "system: agreement suspension cascade (manual suspend or cure-sweep breach escalation)"
        actor: system
        preconditions:
          - "agreement.status == SUSPENDED"
        side_effects:
          - "agreement.withheld_payment_cents recomputed to include scheduled_amount_cents."
      - from: HELD_PENDING_CURE
        to: PENDING_AUTHORIZATION
        trigger: "system: agreement reinstatement cascade"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "agreement.withheld_payment_cents recomputed (drops back to 0 when no held or withheld payments remain)."
        note: "Cycle: a payment may be held and released repeatedly; scheduled_amount_cents never changes across the cycle."
      - from: PENDING_AUTHORIZATION
        to: WITHHELD
        trigger: "system: agreement termination cascade"
        actor: system
        preconditions:
          - "agreement.status == TERMINATED"
        side_effects:
          - "agreement.withheld_payment_cents recomputed."
      - from: HELD_PENDING_CURE
        to: WITHHELD
        trigger: "system: agreement termination cascade"
        actor: system
        preconditions:
          - "agreement.status == TERMINATED"
        side_effects:
          - "agreement.withheld_payment_cents recomputed."

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPROVED_UPLIFT, APPROVED_CUT, DECLINED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED_UPLIFT
        trigger: "POST /change-orders/{id}/decide with decision == APPROVE and order_type == FUNDING_UPLIFT"
        actor: PublisherFinance
        preconditions:
          - "change_order.state == PROPOSED"
          - "agreement.status == ACTIVE"
          - "target Milestone.status IN {DEFINED, IN_DEVELOPMENT, CURE_PENDING}"
          - "agreement.uplift_funded_cents + requested_amount_cents <= round_half_up(advance_total_cents * MAX_UPLIFT_BPS / 10000)"
          - "abs(resulting schedule_slip_days) <= MAX_SLIP_DAYS"
        side_effects:
          - "Branch A side-effect set. Sets state = APPROVED_UPLIFT, decided_at = logical clock."
          - "Milestone.uplift_cents += requested_amount_cents."
          - "agreement.uplift_funded_cents, funding_pool_cents, committed_cents, available_funding_cents recomputed."
          - "agreement.ship_date_current and schedule_slip_days recomputed by calculations.ship_date_schedule."
          - "agreement.funding_posture recomputed; a grown funding_pool_cents can flip RESTRICTED -> OPEN."
          - "increments DevelopmentAgreement.version by 1"
      - from: PROPOSED
        to: APPROVED_CUT
        trigger: "POST /change-orders/{id}/decide with decision == APPROVE and order_type == FEATURE_CUT"
        actor: PublisherFinance
        preconditions:
          - "change_order.state == PROPOSED"
          - "agreement.status == ACTIVE"
          - "target Milestone.status IN {DEFINED, IN_DEVELOPMENT, CURE_PENDING}"
          - "requested_amount_cents <= Milestone.funded_amount_cents + Milestone.uplift_cents (a cut may not push milestone funding below zero)"
          - "abs(resulting schedule_slip_days) <= MAX_SLIP_DAYS"
        side_effects:
          - "Branch B side-effect set, structurally different from Branch A. Sets state = APPROVED_CUT, decided_at = logical clock."
          - "Milestone.uplift_cents -= requested_amount_cents (funding credited back to the pool)."
          - "Milestone.content_threshold_relief_pct += change_order.content_threshold_relief_pct (lowers the content gate for future builds)."
          - "agreement.committed_cents and available_funding_cents recomputed; uplift_funded_cents is NOT changed."
          - "agreement.ship_date_current and schedule_slip_days recomputed by calculations.ship_date_schedule."
          - "increments DevelopmentAgreement.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /change-orders/{id}/decide with decision == DECLINE"
        actor: PublisherFinance
        preconditions:
          - "change_order.state == PROPOSED"
          - "agreement.status == ACTIVE"
        side_effects:
          - "Branch C side-effect set: only state = DECLINED and decided_at are written. No funding, content-threshold or ship-date field changes."
          - "increments DevelopmentAgreement.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: a newer ChangeOrder is created for the same target_milestone_id"
        actor: system
        preconditions:
          - "change_order.state == PROPOSED"
        side_effects:
          - "No funding, content-threshold or ship-date effect; the superseded proposal can never be decided."

  - entity: ContractorEngagement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED, TERMINATED_EARLY]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system: the engagement's Milestone enters IN_DEVELOPMENT"
        actor: system
        preconditions:
          - "engagement.status == PROPOSED"
          - "milestone.status == IN_DEVELOPMENT"
        side_effects:
          - "None beyond the status change; committed_cents stays reserved against the milestone contractor budget."
        note: "An engagement created while its milestone is already IN_DEVELOPMENT, UNDER_REVIEW or CURE_PENDING is born ACTIVE and never uses this transition."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: agreement suspension cascade, or acceptance cascade step 4 when funding_posture becomes RESTRICTED"
        actor: system
        preconditions:
          - "engagement.status == ACTIVE"
          - "agreement.status == SUSPENDED OR (agreement.funding_posture == RESTRICTED AND milestone.status IN {DEFINED, IN_DEVELOPMENT})"
        side_effects:
          - "No invoice is voided; SUBMITTED invoices stay pending but cannot be approved while the engagement is not ACTIVE."
      - from: PROPOSED
        to: SUSPENDED
        trigger: "system: acceptance cascade step 4 when funding_posture becomes RESTRICTED"
        actor: system
        preconditions:
          - "engagement.status == PROPOSED"
          - "agreement.funding_posture == RESTRICTED"
          - "milestone.status IN {DEFINED, IN_DEVELOPMENT}"
        side_effects:
          - "None beyond the status change."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: agreement reinstatement cascade"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "milestone.status IN {IN_DEVELOPMENT, UNDER_REVIEW, CURE_PENDING, ACCEPTED}"
          - "NOT (agreement.funding_posture == RESTRICTED AND milestone.status IN {DEFINED, IN_DEVELOPMENT})"
        side_effects:
          - "None beyond the status change."
      - from: SUSPENDED
        to: PROPOSED
        trigger: "system: agreement reinstatement cascade"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "milestone.status == DEFINED"
        side_effects:
          - "None beyond the status change."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /contractor-engagements/{id}/complete"
        actor: Developer
        preconditions:
          - "engagement.status == ACTIVE"
          - "no ContractorInvoice of this engagement has status == SUBMITTED"
        side_effects:
          - "committed_cents stays counted on the COMMITTED basis of calculations.contractor_budget_utilization."
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /contractor-engagements/{id}/cancel"
        actor: Developer
        preconditions:
          - "engagement.status IN {PROPOSED, ACTIVE, SUSPENDED}"
          - "engagement.approved_invoice_total_cents == 0"
        side_effects:
          - "Compensating action: the engagement leaves the COMMITTED basis, restoring Milestone contractor-budget headroom exactly (invariant contractor_budget_conservation)."
          - "Cascade: every ContractorInvoice of this engagement with status == SUBMITTED transitions to VOIDED."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /contractor-engagements/{id}/cancel"
        actor: Developer
        preconditions:
          - "engagement.status IN {PROPOSED, ACTIVE, SUSPENDED}"
          - "engagement.approved_invoice_total_cents == 0"
        side_effects:
          - "Same compensating effects as PROPOSED -> CANCELLED."
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /contractor-engagements/{id}/cancel"
        actor: Developer
        preconditions:
          - "engagement.status IN {PROPOSED, ACTIVE, SUSPENDED}"
          - "engagement.approved_invoice_total_cents == 0"
        side_effects:
          - "Same compensating effects as PROPOSED -> CANCELLED."
      - from: ACTIVE
        to: TERMINATED_EARLY
        trigger: "system: agreement termination cascade (its milestone became CANCELLED)"
        actor: system
        preconditions:
          - "milestone.status == CANCELLED"
        side_effects:
          - "Cascade: every ContractorInvoice of this engagement with status == SUBMITTED transitions to VOIDED."
      - from: PROPOSED
        to: TERMINATED_EARLY
        trigger: "system: agreement termination cascade (its milestone became CANCELLED)"
        actor: system
        preconditions:
          - "milestone.status == CANCELLED"
        side_effects:
          - "Cascade: every ContractorInvoice of this engagement with status == SUBMITTED transitions to VOIDED."
      - from: SUSPENDED
        to: TERMINATED_EARLY
        trigger: "system: agreement termination cascade (its milestone became CANCELLED)"
        actor: system
        preconditions:
          - "milestone.status == CANCELLED"
        side_effects:
          - "Cascade: every ContractorInvoice of this engagement with status == SUBMITTED transitions to VOIDED."

  - entity: ContractorInvoice
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /contractor-invoices/{id}/decide with decision == APPROVE"
        actor: PublisherFinance
        preconditions:
          - "invoice.status == SUBMITTED"
          - "engagement.status == ACTIVE"
          - "engagement's Milestone.status != CANCELLED"
          - "engagement.approved_invoice_total_cents + amount_cents <= round_half_up(engagement.committed_cents * INVOICE_TOLERANCE_BPS / 10000)"
        side_effects:
          - "Sets status = APPROVED, decided_at = logical clock."
          - "engagement.approved_invoice_total_cents += amount_cents."
          - "Milestone INCURRED-basis utilization grows (calculations.contractor_budget_utilization), which can create contractor_overrun_cents at payment authorization."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /contractor-invoices/{id}/decide with decision == REJECT"
        actor: PublisherFinance
        preconditions:
          - "invoice.status == SUBMITTED"
          - "rejection_reason is present and non-blank"
        side_effects:
          - "Sets status = REJECTED, decided_at, rejection_reason. No basis changes."
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: the engagement is cancelled or terminated early"
        actor: system
        preconditions:
          - "engagement.status IN {CANCELLED, TERMINATED_EARLY}"
        side_effects:
          - "No basis changes; the invoice can never be decided afterwards."

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /royalty-statements/{id}/finalize"
        actor: PublisherFinance
        preconditions:
          - "statement.state == DRAFT"
          - "agreement.status IN {ACTIVE, COMPLETED}"
          - "no other RoyaltyStatement of this agreement with the same period_label has state == FINALIZED"
        side_effects:
          - "Runs the FINAL variant of calculations.royalty_settlement and stores final_royalty_payable_cents; PROVISIONAL fields are retained unchanged for comparison."
          - "Cascade step 1: agreement.advance_recouped_cents = cumulative recoup applied, then unrecouped_advance_cents = advance_disbursed_cents - advance_recouped_cents."
          - "Cascade step 2: because unrecouped_advance_cents changed, recoupment_state moves RECOUPING -> RECOUPED when unrecouped_advance_cents == 0."
          - "Cascade step 3: agreement.royalties_paid_to_date_cents += final_royalty_payable_cents."
          - "Sets state = FINALIZED, finalized_at = logical clock."
          - "increments DevelopmentAgreement.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer DRAFT RoyaltyStatement is created for the same (agreement_id, period_label)"
        actor: system
        preconditions:
          - "statement.state == DRAFT"
        side_effects:
          - "No ledger effect; a SUPERSEDED statement can never be finalized."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on DevelopmentAgreement.version only)
# =============================================================================
concurrency_rules:
  - rule_id: change-order-create-stale-agreement
    parent_entity: DevelopmentAgreement
    write_endpoint: "POST /change-orders"
    occ_field: "expected_agreement_version"
    description: |
      Creating a ChangeOrder against a DevelopmentAgreement whose version has advanced since
      the client last read it is rejected. A newly created proposal legitimately supersedes any
      still-PROPOSED order on the same target milestone, so the write cannot be rejected by a
      state precondition; the stale-version check is the only thing that stops a client from
      superseding a proposal it never saw.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: royalty-statement-create-stale-agreement
    parent_entity: DevelopmentAgreement
    write_endpoint: "POST /royalty-statements"
    occ_field: "expected_agreement_version"
    description: |
      Creating a RoyaltyStatement for a period whose DRAFT statement would be superseded is
      rejected when the submitted expected_agreement_version no longer matches the agreement's
      current version. Because a fresh DRAFT legitimately supersedes the prior DRAFT for the
      same period_label, no state precondition rejects the second create; the ledger fields the
      statement is computed from (advance_disbursed_cents, unrecouped_advance_cents,
      royalties_paid_to_date_cents) may have moved, so a stale view must be refused.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: build_gate_evaluation
    trigger: "POST /milestone-builds, before the Milestone IN_DEVELOPMENT|CURE_PENDING -> UNDER_REVIEW transition is committed"
    algorithm: threshold
    formula: |
      t = GATE_THRESHOLDS[milestone.gate_profile]          # feature / crash / content / blockers

      # (1) content bar: contractual bar, minus approved feature-cut relief, plus the cure uplift
      effective_content_threshold =
          min(100.00,
              max(0.00,
                  t.content
                  - milestone.content_threshold_relief_pct
                  + (CURE_CONTENT_UPLIFT_PCT if milestone.status == "CURE_PENDING" else 0.00)))

      # (2) feature bar: a stability surplus buys feature slack, never for GOLD
      stability_surplus = (milestone.gate_profile != "GOLD")
                          and (build.crash_free_sessions_pct >= t.crash + STABILITY_SURPLUS_PCT)
      effective_feature_threshold = t.feature - (FEATURE_RELAXATION_PCT if stability_surplus else 0.00)

      # (3) all four conditions must hold; comparisons are inclusive (>=, <=)
      pass = (build.feature_completeness_pct  >= effective_feature_threshold)
         and (build.crash_free_sessions_pct   >= t.crash)
         and (build.content_completeness_pct  >= effective_content_threshold)
         and (build.known_blocker_count       <= t.blockers)

      readiness_score = round_half_up(0.45 * build.feature_completeness_pct
                                    + 0.35 * build.crash_free_sessions_pct
                                    + 0.20 * build.content_completeness_pct, 2)

      if pass is false -> reject the request with ERR_BUILD_GATE_NOT_MET (422); no MilestoneBuild row is persisted.
    input_set: "The single submitted build payload, the target Milestone's gate_profile / status / content_threshold_relief_pct. No other build rows participate."
    constants:
      GATE_THRESHOLDS:
        ALPHA: { feature: 70.00, crash: 95.00, content: 50.00, blockers: 20 }
        BETA:  { feature: 90.00, crash: 98.00, content: 80.00, blockers: 5 }
        GOLD:  { feature: 100.00, crash: 99.50, content: 100.00, blockers: 0 }
      STABILITY_SURPLUS_PCT: 0.50
      FEATURE_RELAXATION_PCT: 2.00
      CURE_CONTENT_UPLIFT_PCT: 5.00
    precision: "percentages carry 2 decimal places, compared exactly (no epsilon); readiness_score rounded to 2 decimal places, round_half_up"

  - name: royalty_settlement
    trigger: "POST /royalty-statements (PROVISIONAL variant) and POST /royalty-statements/{id}/finalize (FINAL variant)"
    algorithm: waterfall_allocation
    formula: |
      # ---- shared step: per-line distributable revenue (rounding is per line, then summed)
      for each line L in statement.revenue_lines (iterated in submitted array order):
          net_L           = L.gross_cents - L.returns_cents
          platform_fee_L  = round_half_up(net_L * agreement.platform_fee_bps / 10000)
          distributable_L = net_L - platform_fee_L
      distributable_total_cents = sum(distributable_L)            # 0 when revenue_lines is empty

      # ---- PROVISIONAL variant (period basis), computed at statement creation
      cost_cap_period      = round_half_up(distributable_total_cents * agreement.recoupable_cost_cap_bps / 10000)
      cost_deduction_cents = min(statement.recoupable_cost_cents, cost_cap_period)
      recoupment_base_cents = max(0, distributable_total_cents - cost_deduction_cents)
      recoup_applied_cents  = min(agreement.unrecouped_advance_cents, recoupment_base_cents)
      royalty_base_cents    = recoupment_base_cents - recoup_applied_cents
      # PINNED ROUNDING ORDER: royalty is pro-rated onto each revenue line, rounded PER LINE,
      # and only then summed. Summing first and rounding once is a different (forbidden) order.
      provisional_royalty_payable_cents =
          sum over lines of round_half_up(royalty_base_cents
                                          * distributable_L / distributable_total_cents
                                          * agreement.royalty_rate_bps / 10000)
      (when distributable_total_cents == 0 the per-line sum is 0 by definition of the empty sum)

      # ---- FINAL variant (life-to-date basis), computed at finalization
      S = { RoyaltyStatement rows of this agreement with state == FINALIZED } UNION { this statement }
      cum_distributable  = sum over S of distributable_total_cents
      cum_cost_claimed   = sum over S of recoupable_cost_cents
      cum_cost_allowed   = min(cum_cost_claimed,
                               round_half_up(cum_distributable * agreement.recoupable_cost_cap_bps / 10000))
      cum_recoupment_base = max(0, cum_distributable - cum_cost_allowed)
      cum_recoup_applied  = min(agreement.advance_disbursed_cents, cum_recoupment_base)
      cum_royalty_base    = cum_recoupment_base - cum_recoup_applied
      # PINNED ROUNDING ORDER for the FINAL variant: ONE rounding on the cumulative base.
      cum_royalty_owed    = round_half_up(cum_royalty_base * agreement.royalty_rate_bps / 10000)
      final_royalty_payable_cents = cum_royalty_owed - agreement.royalties_paid_to_date_cents
      # ledger writes at finalization
      agreement.advance_recouped_cents      = cum_recoup_applied
      agreement.unrecouped_advance_cents    = max(0, agreement.advance_disbursed_cents - cum_recoup_applied)
      agreement.royalties_paid_to_date_cents += final_royalty_payable_cents
    input_set: |
      PROVISIONAL: only this statement's revenue_lines and recoupable_cost_cents, against
      agreement.unrecouped_advance_cents as observed at creation time.
      FINAL: every RoyaltyStatement of the agreement whose state == FINALIZED (ordered by
      finalized_at ASC, tie-break created_at ASC) plus the statement being finalized; statements
      whose state == SUPERSEDED or DRAFT are excluded. The advance basis is the life-to-date
      agreement.advance_disbursed_cents, not the per-period unrecouped balance.
    constants:
      MIN_REVENUE_LINES: 0
      MAX_REVENUE_LINES: 12
    precision: "integer cents throughout; every division is rounded with round_half_up to whole cents at the points marked above and nowhere else"
    variants:
      - name: PROVISIONAL
        when: "At statement creation (POST /royalty-statements); stored in provisional_royalty_payable_cents and never overwritten."
        difference: "Period-scoped: the cost cap is 20% of THIS period's distributable revenue, the advance basis is the current unrecouped balance, and royalty is rounded per revenue line before summing."
      - name: FINAL
        when: "At finalization (POST /royalty-statements/{id}/finalize); stored in final_royalty_payable_cents and drives the agreement ledger."
        difference: "Life-to-date: the cost cap is 20% of CUMULATIVE distributable revenue (so costs disallowed in an earlier period can soak up a later period's headroom), the advance basis is total advance_disbursed_cents, royalty is rounded once on the cumulative base, and royalties already paid are subtracted."

  - name: payment_disbursement
    trigger: "POST /milestone-payments/{id}/authorize, during the MilestonePayment PENDING_AUTHORIZATION -> AUTHORIZED transition"
    algorithm: tiered_pricing
    formula: |
      # The holdback rate is keyed on the gross amount, but the gross amount is itself the
      # scheduled amount net of the contractor overrun deduction. Evaluation order is PINNED:
      # step 1 -> step 2 -> step 3 -> step 4. No other order is admissible.

      # step 1: gross
      incurred = contractor_budget_utilization(milestone, basis = "INCURRED")   # approved invoices only
      contractor_overrun_cents = max(0, incurred - milestone.contractor_budget_cents)
      gross_amount_cents = payment.scheduled_amount_cents - contractor_overrun_cents

      # step 2: tier selected FROM the step-1 gross (never from scheduled_amount_cents)
      tier_bps = 0    if gross_amount_cents <= HOLDBACK_TIER_1_MAX_CENTS
                 500  if gross_amount_cents <= HOLDBACK_TIER_2_MAX_CENTS
                 1000 otherwise

      # step 3: cure penalty added to the rate BEFORE the single rounding
      holdback_bps   = tier_bps + min(CURE_PENALTY_CAP_BPS, CURE_PENALTY_BPS * milestone.cure_count)
      holdback_cents = round_half_up(gross_amount_cents * holdback_bps / 10000)

      # step 4: net
      net_amount_cents = gross_amount_cents - holdback_cents
    input_set: "The payment's own scheduled_amount_cents, its Milestone's contractor_budget_cents and cure_count, and the APPROVED ContractorInvoice rows of every ContractorEngagement of that milestone."
    constants:
      HOLDBACK_TIER_1_MAX_CENTS: 2500000
      HOLDBACK_TIER_2_MAX_CENTS: 10000000
      CURE_PENALTY_BPS: 250
      CURE_PENALTY_CAP_BPS: 500
    precision: "integer cents; exactly one rounding, in step 3, round_half_up"

  - name: contractor_budget_utilization
    trigger: "POST /contractor-engagements (COMMITTED basis precheck), POST /milestone-payments/{id}/authorize (INCURRED basis overrun), GET /milestones/{id}/budget-summary (both)"
    algorithm: aggregation
    formula: |
      committed_basis_cents = sum of ContractorEngagement.committed_cents
                              over engagements with milestone_id == milestone.id
                              and status IN {PROPOSED, ACTIVE, SUSPENDED, COMPLETED}
      incurred_basis_cents  = sum of ContractorInvoice.amount_cents
                              over invoices whose engagement.milestone_id == milestone.id
                              and invoice.status == APPROVED
                              (engagement status is irrelevant on this basis)
      available_committed_cents = max(0, milestone.contractor_budget_cents - committed_basis_cents)
      overrun_cents             = max(0, incurred_basis_cents - milestone.contractor_budget_cents)
    input_set: "Engagements of one milestone filtered by the status sets above; CANCELLED and TERMINATED_EARLY engagements leave the COMMITTED basis but their APPROVED invoices stay on the INCURRED basis."
    constants:
      INVOICE_TOLERANCE_BPS: 12500
    precision: "integer cents; no rounding (pure summation)"
    variants:
      - name: COMMITTED_BASIS
        when: "Budget admission control at POST /contractor-engagements: committed_basis_cents + new.committed_cents <= milestone.contractor_budget_cents, else ERR_CONTRACTOR_BUDGET_EXCEEDED."
        difference: "Counts the full committed_cents of every non-terminated engagement whether or not a single invoice was ever approved; forward-looking."
      - name: INCURRED_BASIS
        when: "Overrun deduction at payment authorization and the overrun_cents field of the budget summary."
        difference: "Counts only APPROVED invoice amounts, which may legitimately exceed committed_cents up to INVOICE_TOLERANCE_BPS (125%), so the INCURRED figure can exceed both the COMMITTED figure and the milestone contractor budget."

  - name: agreement_funding_ledger
    trigger: "Every mutation that creates, funds, accepts, cancels or terminates a Milestone, decides a ChangeOrder, authorizes a MilestonePayment, or activates / suspends / reinstates / terminates the agreement"
    algorithm: aggregation
    formula: |
      uplift_funded_cents     = sum of ChangeOrder.requested_amount_cents
                                over orders with state == APPROVED_UPLIFT
      funding_pool_cents      = advance_total_cents + uplift_funded_cents
      committed_cents         = sum of (Milestone.funded_amount_cents + Milestone.uplift_cents)
                                over milestones with status != CANCELLED
      available_funding_cents = funding_pool_cents - committed_cents
      accepted_value_cents    = sum of (Milestone.funded_amount_cents + Milestone.uplift_cents)
                                over milestones with status == ACCEPTED
      advance_disbursed_cents = sum of MilestonePayment.net_amount_cents  over payments with status == AUTHORIZED
      holdback_reserve_cents  = sum of MilestonePayment.holdback_cents    over payments with status == AUTHORIZED
      withheld_payment_cents  = sum of MilestonePayment.scheduled_amount_cents
                                over payments with status IN {HELD_PENDING_CURE, WITHHELD}
      breach_count            = count of milestones with status == BREACHED
      funding_posture =
          "FROZEN"     if status IN {SUSPENDED, TERMINATED}
          "RESTRICTED" if accepted_value_cents >= round_half_up(funding_pool_cents * RESTRICT_TRIGGER_BPS / 10000)
          "OPEN"       otherwise
    input_set: "All Milestone, ChangeOrder and MilestonePayment rows of the one agreement, filtered by the status sets above. DRAFT agreements compute the same fields (committed_cents can be non-zero before activation)."
    constants:
      RESTRICT_TRIGGER_BPS: 3000
      MAX_UPLIFT_BPS: 2500
    precision: "integer cents; one round_half_up inside the RESTRICTED threshold comparison"

  - name: ship_date_schedule
    trigger: "POST /change-orders/{id}/decide when the decision approves the order (both branches)"
    algorithm: constraint_propagation
    formula: |
      applied = ChangeOrder rows of the agreement with state IN {APPROVED_UPLIFT, APPROVED_CUT},
                processed in decided_at ASC order, tie-break created_at ASC
      ship_date_current  = ship_date_original + sum over applied of ship_date_delta_days   (whole days)
      schedule_slip_days = (ship_date_current - ship_date_original) in whole days
      admission rule: an approval whose resulting abs(schedule_slip_days) > MAX_SLIP_DAYS is
      rejected with ERR_SHIP_DATE_SLIP_EXCEEDED and no field is written.
    input_set: "Only decided change orders in state APPROVED_UPLIFT or APPROVED_CUT; PROPOSED, DECLINED and SUPERSEDED orders never move the ship date."
    constants:
      MAX_SLIP_DAYS: 45
    precision: "whole calendar days; dates are ISO 8601 dates in UTC"

  - name: cure_window
    trigger: "POST /publisher-reviews with verdict == CONDITIONAL"
    algorithm: interval_merge
    formula: |
      review.cure_deadline_at    = review.decided_at + review.cure_days * 86400 seconds
      milestone.cure_deadline_at = review.cure_deadline_at
      A cure resubmission is admissible while logical_clock <= milestone.cure_deadline_at
      (INCLUSIVE upper bound, millisecond granularity); logical_clock strictly greater is
      ERR_CURE_WINDOW_EXPIRED, and the publisher may then sweep the milestone into BREACHED.
    input_set: "The single CONDITIONAL review that created the window; earlier windows on the same milestone are closed and never re-open."
    constants:
      CURE_DAYS_MIN: 1
      CURE_DAYS_MAX: 30
      CURE_DAYS_DEFAULT: 14
    precision: "ISO 8601 UTC instants with three fractional digits; comparisons at millisecond granularity"

  - name: ip_reversion_scope
    trigger: "DevelopmentAgreement ACTIVE|SUSPENDED -> TERMINATED and ACTIVE -> COMPLETED"
    algorithm: threshold
    formula: |
      accepted_count = count of Milestone rows of the agreement with status == ACCEPTED
      total_count    = count of ALL Milestone rows ever created for the agreement (every status,
                       CANCELLED and BREACHED included)
      accepted_milestone_ratio = round_half_up(accepted_count / total_count, 4)   # 0.0 when total_count == 0
      if accepted_milestone_ratio < 0.5000 -> ip_reversion_state = "REVERTED_TO_DEVELOPER", sequel_rights_holder = "DEVELOPER"
      elif accepted_milestone_ratio < 0.8000 -> ip_reversion_state = "PARTIAL_REVERSION",   sequel_rights_holder = "SHARED"
      else                                   -> ip_reversion_state = "RETAINED_BY_PUBLISHER", sequel_rights_holder = "PUBLISHER"
    input_set: "Every Milestone row of the agreement at the instant of termination or completion, counted after the termination cascade has cancelled non-terminal milestones."
    constants:
      REVERSION_FULL_THRESHOLD: 0.5000
      REVERSION_PARTIAL_THRESHOLD: 0.8000
    precision: "ratio rounded to 4 decimal places, round_half_up; boundary comparisons are inclusive on the upper band (exactly 0.5000 yields SHARED)"

  - name: live_ops_draw_allowance
    trigger: "POST /development-agreements/{id}/live-ops-draws"
    algorithm: threshold
    formula: |
      require agreement.post_launch_support_state == "ACTIVE"            else ERR_POST_LAUNCH_NOT_ACTIVE
      require amount_cents <= agreement.live_ops_quarterly_funding_cents else ERR_LIVE_OPS_CAP_EXCEEDED
      total_cap = agreement.live_ops_quarterly_funding_cents * LIVE_OPS_QUARTER_COUNT
      require agreement.live_ops_drawn_cents + amount_cents <= total_cap else ERR_LIVE_OPS_CAP_EXCEEDED
      agreement.live_ops_drawn_cents += amount_cents
      if agreement.live_ops_drawn_cents == total_cap -> post_launch_support_state = "EXPIRED"
    input_set: "The agreement's own live-ops fields; no milestone or payment rows participate."
    constants:
      LIVE_OPS_QUARTER_COUNT: 4
    precision: "integer cents; no rounding"

  - name: reviewer_window_occupancy
    trigger: "POST /publisher-reviews, before the verdict is applied"
    algorithm: interval_merge
    formula: |
      new = [review_window_start_at, review_window_end_at)          # HALF-OPEN instant interval
      require review_window_end_at > review_window_start_at         else ERR_INVALID_DATE_RANGE
      conflict = exists PublisherReview P with P.reviewer_user_id == X-User-ID and
                 new.start < P.review_window_end_at and P.review_window_start_at < new.end
      conflict -> ERR_REVIEWER_WINDOW_CONFLICT
      Back-to-back windows (new.start == P.end, or new.end == P.start) do NOT conflict.
    input_set: "Every PublisherReview row of the acting reviewer_user_id (reviews are immutable, so none are ever excluded), across all agreements."
    constants:
      REVIEWER_CONCURRENT_CAPACITY: 1
    precision: "ISO 8601 UTC instants with three fractional digits; strict inequality on both sides makes adjacency legal"

  - name: vendor_cooldown_occupancy
    trigger: "POST /contractor-engagements, before the budget precheck"
    algorithm: interval_merge
    formula: |
      new = [start_date, end_date]                                  # CLOSED calendar-date interval
      require end_date >= start_date                                else ERR_INVALID_DATE_RANGE
      candidates = ContractorEngagement rows with the same studio_id and the same vendor_code
                   and status IN {PROPOSED, ACTIVE, SUSPENDED, COMPLETED}
      conflict = exists candidate E with
                 new.start_date <= E.end_date   + VENDOR_COOLDOWN_DAYS days and
                 E.start_date   <= new.end_date + VENDOR_COOLDOWN_DAYS days
      conflict -> ERR_VENDOR_COOLDOWN_CONFLICT
      Because the interval is closed and both sides carry a symmetric VENDOR_COOLDOWN_DAYS
      buffer, adjacency is ILLEGAL: a new engagement must start at least 4 days after the prior
      end_date (E.end_date + 3 is still blocked, E.end_date + 4 is the first legal start).
    input_set: "Engagements of the same (studio_id, vendor_code) pair in status {PROPOSED, ACTIVE, SUSPENDED, COMPLETED}; CANCELLED and TERMINATED_EARLY engagements free their dates immediately."
    constants:
      VENDOR_COOLDOWN_DAYS: 3
    precision: "whole calendar days, inclusive on both endpoints"

# =============================================================================
# §1.4 Ordered Validation Rules
# The list is TOTALLY ORDERED. When one request violates several rules, the
# implementation MUST return the error of the LOWEST priority number and MUST NOT
# evaluate any later rule. Every priority number below is unique.
# =============================================================================
validations:
  - priority: 1
    rule_id: auth-headers-present
    category: auth
    condition: "X-User-ID or X-User-Role header is absent, empty, or whitespace-only"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    endpoints: ["ALL"]

  - priority: 2
    rule_id: role-recognized
    category: auth
    condition: "X-User-Role is not one of PlatformAdmin, Developer, PublisherReviewer, PublisherFinance (comparison is case-sensitive)"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    endpoints: ["ALL"]

  - priority: 3
    rule_id: actor-resolves
    category: auth
    condition: "For an entity_backed role, X-User-ID does not resolve to a row of the backing entity (Developer -> Studio.id, PublisherReviewer|PublisherFinance -> PublisherUser.id). PlatformAdmin is opaque and always resolves."
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 401
    endpoints: ["ALL except POST /studios, POST /publishers, POST /publisher-users, POST /_clock/set_current_utc"]

  - priority: 4
    rule_id: role-permitted-for-endpoint
    category: authorization
    condition: "The acting role is not listed in the endpoint's §1.7 allowed roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    endpoints: ["ALL"]

  - priority: 5
    rule_id: publisher-user-function-matches-role
    category: authorization
    condition: "The acting role is PublisherReviewer but PublisherUser.function NOT IN {REVIEW, DUAL}, or the acting role is PublisherFinance but PublisherUser.function NOT IN {FINANCE, DUAL}"
    error_id: ERR_ROLE_FUNCTION_MISMATCH
    http_status: 403
    endpoints: ["ALL endpoints whose allowed roles include PublisherReviewer or PublisherFinance"]

  - priority: 6
    rule_id: request-body-structural
    category: structural
    condition: |
      Missing required field, unknown enum value, wrong JSON type, integer outside its declared
      range, string failing its declared pattern, array longer than its declared maximum, or a
      malformed ISO 8601 instant/date. Conditionally required fields count as required once their
      trigger value is present:
        POST /contractor-invoices/{id}/decide with decision == REJECT -> rejection_reason must be present and non-blank
        POST /publisher-reviews with verdict == CONDITIONAL          -> conditions must be a non-empty array
        POST /publisher-reviews with verdict IN {ACCEPTED, REJECTED} -> conditions must be absent or an empty array
        POST /change-orders with order_type == FUNDING_UPLIFT        -> requested_amount_cents must be >= 1
        POST /change-orders with order_type == FEATURE_CUT           -> content_threshold_relief_pct must be present
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    endpoints: ["ALL endpoints with a request body"]
    note: "Fields declared source: system or source: computed are silently ignored when present in the payload; their presence is NOT a structural error."

  - priority: 7
    rule_id: path-studio-exists
    category: referential
    condition: "The {id} path parameter of a /studios/{id} route matches no Studio"
    error_id: ERR_STUDIO_NOT_FOUND
    http_status: 404
    endpoints: ["GET /studios/{id}"]

  - priority: 8
    rule_id: path-publisher-exists
    category: referential
    condition: "The {id} path parameter of a /publishers/{id} route matches no Publisher"
    error_id: ERR_PUBLISHER_NOT_FOUND
    http_status: 404
    endpoints: ["GET /publishers/{id}"]

  - priority: 9
    rule_id: path-publisher-user-exists
    category: referential
    condition: "The {id} path parameter of a /publisher-users/{id} route matches no PublisherUser"
    error_id: ERR_PUBLISHER_USER_NOT_FOUND
    http_status: 404
    endpoints: ["GET /publisher-users/{id}"]

  - priority: 10
    rule_id: path-agreement-exists
    category: referential
    condition: "The {id} path parameter of a /development-agreements/{id} route matches no DevelopmentAgreement"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    endpoints:
      - "GET /development-agreements/{id}"
      - "GET /development-agreements/{id}/royalty-statements"
      - "GET /development-agreements/{id}/recoupment-summary"
      - "POST /development-agreements/{id}/activate"
      - "POST /development-agreements/{id}/suspend"
      - "POST /development-agreements/{id}/reinstate"
      - "POST /development-agreements/{id}/terminate"
      - "POST /development-agreements/{id}/cure-sweep"
      - "POST /development-agreements/{id}/live-ops-draws"

  - priority: 11
    rule_id: path-milestone-exists
    category: referential
    condition: "The {id} path parameter of a /milestones/{id} route matches no Milestone"
    error_id: ERR_MILESTONE_NOT_FOUND
    http_status: 404
    endpoints:
      - "GET /milestones/{id}"
      - "GET /milestones/{id}/builds"
      - "GET /milestones/{id}/budget-summary"

  - priority: 12
    rule_id: path-build-exists
    category: referential
    condition: "The {id} path parameter of a /milestone-builds/{id} route matches no MilestoneBuild"
    error_id: ERR_BUILD_NOT_FOUND
    http_status: 404
    endpoints: ["GET /milestone-builds/{id}"]

  - priority: 13
    rule_id: path-review-exists
    category: referential
    condition: "The {id} path parameter of a /publisher-reviews/{id} route matches no PublisherReview"
    error_id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    endpoints: ["GET /publisher-reviews/{id}"]

  - priority: 14
    rule_id: path-payment-exists
    category: referential
    condition: "The {id} path parameter of a /milestone-payments/{id} route matches no MilestonePayment"
    error_id: ERR_PAYMENT_NOT_FOUND
    http_status: 404
    endpoints:
      - "GET /milestone-payments/{id}"
      - "POST /milestone-payments/{id}/authorize"

  - priority: 15
    rule_id: path-change-order-exists
    category: referential
    condition: "The {id} path parameter of a /change-orders/{id} route matches no ChangeOrder"
    error_id: ERR_CHANGE_ORDER_NOT_FOUND
    http_status: 404
    endpoints:
      - "GET /change-orders/{id}"
      - "POST /change-orders/{id}/decide"

  - priority: 16
    rule_id: path-engagement-exists
    category: referential
    condition: "The {id} path parameter of a /contractor-engagements/{id} route matches no ContractorEngagement"
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    endpoints:
      - "GET /contractor-engagements/{id}"
      - "GET /contractor-engagements/{id}/invoices"
      - "POST /contractor-engagements/{id}/complete"
      - "POST /contractor-engagements/{id}/cancel"

  - priority: 17
    rule_id: path-invoice-exists
    category: referential
    condition: "The {id} path parameter of a /contractor-invoices/{id} route matches no ContractorInvoice"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    endpoints:
      - "GET /contractor-invoices/{id}"
      - "POST /contractor-invoices/{id}/decide"

  - priority: 18
    rule_id: path-statement-exists
    category: referential
    condition: "The {id} path parameter of a /royalty-statements/{id} route matches no RoyaltyStatement"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    endpoints:
      - "GET /royalty-statements/{id}"
      - "POST /royalty-statements/{id}/finalize"

  - priority: 19
    rule_id: body-fk-exists
    category: referential
    condition: |
      A foreign key supplied in the request body matches no row of its parent entity. Body FKs are
      checked left-to-right in the order the fields are declared in §1.1 for that entity:
        POST /publisher-users        -> publisher_id           -> ERR_PUBLISHER_NOT_FOUND
        POST /development-agreements -> studio_id, publisher_id -> ERR_STUDIO_NOT_FOUND / ERR_PUBLISHER_NOT_FOUND
        POST /milestones             -> agreement_id, depends_on_milestone_id -> ERR_AGREEMENT_NOT_FOUND / ERR_MILESTONE_NOT_FOUND
        POST /milestone-builds       -> milestone_id           -> ERR_MILESTONE_NOT_FOUND
        POST /publisher-reviews      -> build_id               -> ERR_BUILD_NOT_FOUND
        POST /change-orders          -> agreement_id, target_milestone_id -> ERR_AGREEMENT_NOT_FOUND / ERR_MILESTONE_NOT_FOUND
        POST /contractor-engagements -> milestone_id           -> ERR_MILESTONE_NOT_FOUND
        POST /contractor-invoices    -> engagement_id          -> ERR_ENGAGEMENT_NOT_FOUND
        POST /royalty-statements     -> agreement_id           -> ERR_AGREEMENT_NOT_FOUND
    error_id: "ERR_<PARENT>_NOT_FOUND as mapped above"
    http_status: 404
    endpoints: ["ALL POST endpoints carrying a foreign key in the body"]

  - priority: 20
    rule_id: actor-is-agreement-party
    category: business_referential
    condition: |
      The acting principal is not a party to the agreement reached through the request:
        Developer  -> Studio.id != agreement.studio_id
        PublisherReviewer / PublisherFinance -> PublisherUser.publisher_id != agreement.publisher_id
      The agreement is reached transitively (build -> milestone -> agreement, invoice -> engagement ->
      milestone -> agreement, payment -> milestone -> agreement, statement -> agreement).
      PlatformAdmin is exempt.
    error_id: ERR_NOT_AGREEMENT_PARTY
    http_status: 403
    endpoints: ["ALL agreement-scoped reads and mutations"]
    note: "Deliberately ranked ABOVE every state and fiscal rule: an outsider must not be able to probe a milestone's internal state through the error code they receive."

  - priority: 21
    rule_id: agreement-version-fresh
    category: concurrency
    condition: "expected_agreement_version != DevelopmentAgreement.version (see §1.2.1)"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    endpoints:
      - "POST /change-orders"
      - "POST /royalty-statements"

  - priority: 22
    rule_id: agreement-must-be-draft
    category: state
    condition: "DevelopmentAgreement.status != DRAFT"
    error_id: ERR_AGREEMENT_NOT_DRAFT
    http_status: 409
    endpoints: ["POST /development-agreements/{id}/activate"]

  - priority: 23
    rule_id: agreement-must-be-active
    category: state
    condition: |
      DevelopmentAgreement.status != ACTIVE, with one declared exception: for
      POST /milestone-payments/{id}/authorize the admissible window is status IN {ACTIVE, COMPLETED},
      because the GOLD-acceptance cascade completes the agreement in the very request that creates
      the final MilestonePayment, and that payment must stay authorizable afterwards.
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    endpoints:
      - "POST /milestone-builds"
      - "POST /publisher-reviews"
      - "POST /milestone-payments/{id}/authorize"
      - "POST /change-orders"
      - "POST /change-orders/{id}/decide"
      - "POST /contractor-engagements"
      - "POST /contractor-invoices"
      - "POST /contractor-invoices/{id}/decide"
      - "POST /development-agreements/{id}/suspend"
      - "POST /development-agreements/{id}/cure-sweep"

  - priority: 24
    rule_id: agreement-must-be-suspended
    category: state
    condition: "DevelopmentAgreement.status != SUSPENDED"
    error_id: ERR_AGREEMENT_NOT_SUSPENDED
    http_status: 409
    endpoints: ["POST /development-agreements/{id}/reinstate"]

  - priority: 25
    rule_id: agreement-not-terminal
    category: state
    condition: "DevelopmentAgreement.status IN {TERMINATED, COMPLETED}"
    error_id: ERR_AGREEMENT_TERMINAL
    http_status: 409
    endpoints:
      - "POST /development-agreements/{id}/terminate"
      - "POST /milestones"
    note: "TERMINATED and COMPLETED are terminal for scope and lifecycle changes. Royalty statements and live-ops draws are deliberately NOT listed here: they are post-launch operations gated by priority 64 (revenue eligibility, ACTIVE or COMPLETED) and priority 44 (post_launch_support_state == ACTIVE) respectively."

  - priority: 26
    rule_id: agreement-has-milestones
    category: state
    condition: "The agreement has zero Milestone rows in status DEFINED"
    error_id: ERR_AGREEMENT_HAS_NO_MILESTONES
    http_status: 409
    endpoints: ["POST /development-agreements/{id}/activate"]

  - priority: 27
    rule_id: funding-fully-allocated-at-activation
    category: business_fiscal
    condition: "committed_cents != funding_pool_cents at activation (the milestone schedule must exhaust the advance exactly)"
    error_id: ERR_FUNDING_ALLOCATION_INCOMPLETE
    http_status: 422
    endpoints: ["POST /development-agreements/{id}/activate"]

  - priority: 28
    rule_id: milestone-sequence-index-unique
    category: uniqueness
    condition: "Another Milestone of the same agreement already uses the submitted sequence_index (CANCELLED milestones keep their index reserved)"
    error_id: ERR_SEQUENCE_INDEX_TAKEN
    http_status: 409
    endpoints: ["POST /milestones"]

  - priority: 29
    rule_id: milestone-dependency-same-agreement
    category: business_referential
    condition: "depends_on_milestone_id refers to a Milestone of a different agreement, or to the milestone itself, or to a milestone with a sequence_index >= the submitted sequence_index"
    error_id: ERR_INVALID_DEPENDENCY
    http_status: 422
    endpoints: ["POST /milestones"]

  - priority: 30
    rule_id: funding-posture-blocks-new-scope
    category: state
    condition: "DevelopmentAgreement.funding_posture == RESTRICTED (accepted_value_cents has reached RESTRICT_TRIGGER_BPS of the funding pool); new scope must then arrive as a ChangeOrder, not as a fresh Milestone"
    error_id: ERR_FUNDING_POSTURE_RESTRICTED
    http_status: 409
    endpoints: ["POST /milestones"]

  - priority: 31
    rule_id: milestone-open-for-build
    category: state
    condition: "Milestone.status NOT IN {DEFINED, IN_DEVELOPMENT, CURE_PENDING}"
    error_id: ERR_MILESTONE_NOT_OPEN_FOR_BUILD
    http_status: 409
    endpoints: ["POST /milestone-builds"]

  - priority: 32
    rule_id: milestone-open-for-outsourcing
    category: state
    condition: "Milestone.status NOT IN {DEFINED, IN_DEVELOPMENT, CURE_PENDING}"
    error_id: ERR_MILESTONE_NOT_OPEN_FOR_OUTSOURCING
    http_status: 409
    endpoints: ["POST /contractor-engagements"]
    note: "Conflict pair CP1 winner: ranked above the priority-60 contractor budget cap, so an over-budget engagement against an ACCEPTED milestone reports the state error, never the fiscal one."

  - priority: 33
    rule_id: milestone-under-review
    category: state
    condition: "Milestone.status != UNDER_REVIEW"
    error_id: ERR_MILESTONE_NOT_UNDER_REVIEW
    http_status: 409
    endpoints: ["POST /publisher-reviews"]

  - priority: 34
    rule_id: review-targets-current-build
    category: state
    condition: "MilestoneBuild.gate_state == SUPERSEDED, i.e. build.build_number != milestone.latest_build_number"
    error_id: ERR_BUILD_SUPERSEDED
    http_status: 409
    endpoints: ["POST /publisher-reviews"]

  - priority: 35
    rule_id: payment-pending-authorization
    category: state
    condition: "MilestonePayment.status != PENDING_AUTHORIZATION"
    error_id: ERR_PAYMENT_NOT_PENDING
    http_status: 409
    endpoints: ["POST /milestone-payments/{id}/authorize"]

  - priority: 36
    rule_id: change-order-proposed
    category: state
    condition: "ChangeOrder.state != PROPOSED"
    error_id: ERR_CHANGE_ORDER_NOT_PROPOSED
    http_status: 409
    endpoints: ["POST /change-orders/{id}/decide"]

  - priority: 37
    rule_id: change-order-target-open
    category: cross_entity_state
    condition: "The target Milestone.status NOT IN {DEFINED, IN_DEVELOPMENT, UNDER_REVIEW, CURE_PENDING} at creation or at decision time"
    error_id: ERR_MILESTONE_NOT_AMENDABLE
    http_status: 409
    endpoints:
      - "POST /change-orders"
      - "POST /change-orders/{id}/decide"

  - priority: 38
    rule_id: engagement-active-for-invoice
    category: cross_entity_state
    condition: |
      For POST /contractor-invoices: ContractorEngagement.status NOT IN {ACTIVE, COMPLETED}
      (a SUSPENDED, CANCELLED or TERMINATED_EARLY engagement accepts no new invoices).
      For POST /contractor-invoices/{id}/decide with decision == APPROVE: the engagement's
      status != ACTIVE, or the engagement's Milestone.status == CANCELLED. Rejecting an invoice
      is always permitted while the invoice is still SUBMITTED.
    error_id: ERR_ENGAGEMENT_NOT_INVOICEABLE
    http_status: 409
    endpoints:
      - "POST /contractor-invoices"
      - "POST /contractor-invoices/{id}/decide"

  - priority: 39
    rule_id: engagement-completable
    category: state
    condition: "ContractorEngagement.status != ACTIVE (for /complete) or ContractorEngagement.status NOT IN {PROPOSED, ACTIVE, SUSPENDED} (for /cancel)"
    error_id: ERR_ENGAGEMENT_STATE_INVALID
    http_status: 409
    endpoints:
      - "POST /contractor-engagements/{id}/complete"
      - "POST /contractor-engagements/{id}/cancel"

  - priority: 40
    rule_id: invoice-submitted
    category: state
    condition: "ContractorInvoice.status != SUBMITTED"
    error_id: ERR_INVOICE_NOT_SUBMITTED
    http_status: 409
    endpoints: ["POST /contractor-invoices/{id}/decide"]

  - priority: 41
    rule_id: invoice-number-unique
    category: uniqueness
    condition: "Another ContractorInvoice of the same engagement already uses the submitted invoice_number, in any status including VOIDED"
    error_id: ERR_INVOICE_NUMBER_TAKEN
    http_status: 409
    endpoints: ["POST /contractor-invoices"]

  - priority: 42
    rule_id: statement-draft
    category: state
    condition: "RoyaltyStatement.state != DRAFT"
    error_id: ERR_STATEMENT_NOT_DRAFT
    http_status: 409
    endpoints: ["POST /royalty-statements/{id}/finalize"]

  - priority: 43
    rule_id: period-not-already-finalized
    category: uniqueness
    condition: "A RoyaltyStatement of the same agreement with the same period_label is already in state FINALIZED"
    error_id: ERR_PERIOD_ALREADY_FINALIZED
    http_status: 409
    endpoints: ["POST /royalty-statements"]

  - priority: 44
    rule_id: post-launch-support-active
    category: state
    condition: "DevelopmentAgreement.post_launch_support_state != ACTIVE"
    error_id: ERR_POST_LAUNCH_NOT_ACTIVE
    http_status: 409
    endpoints: ["POST /development-agreements/{id}/live-ops-draws"]

  - priority: 45
    rule_id: reviewer-not-authorizer
    category: business_safety
    condition: "The PublisherFinance user authorizing a payment is the same PublisherUser that decided the ACCEPTED review of that milestone (segregation of duties across the review/pay boundary)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    endpoints: ["POST /milestone-payments/{id}/authorize"]

  - priority: 46
    rule_id: build-gate-thresholds-met
    category: business_safety
    condition: "build_gate_evaluation returns pass == false for the submitted build"
    error_id: ERR_BUILD_GATE_NOT_MET
    http_status: 422
    endpoints: ["POST /milestone-builds"]
    note: "Conflict pair CP2 winner: ranked above the priority-51 cure window, so a build that both misses its gate and arrives after the cure deadline reports the gate failure."

  - priority: 47
    rule_id: dependency-accepted-before-review
    category: cross_entity_state
    condition: "The milestone has depends_on_milestone_id set and that predecessor's status != ACCEPTED"
    error_id: ERR_DEPENDENCY_NOT_ACCEPTED
    http_status: 409
    endpoints: ["POST /milestone-builds"]

  - priority: 48
    rule_id: build-number-increasing
    category: business_safety
    condition: "build_number <= Milestone.latest_build_number"
    error_id: ERR_BUILD_NUMBER_NOT_INCREASING
    http_status: 409
    endpoints: ["POST /milestone-builds"]

  - priority: 49
    rule_id: cure-conditions-addressed
    category: business_safety
    condition: "Milestone.status == CURE_PENDING and addressed_condition_indexes does not cover every entry of Milestone.open_condition_indexes"
    error_id: ERR_CONDITIONS_NOT_ADDRESSED
    http_status: 422
    endpoints: ["POST /milestone-builds"]

  - priority: 50
    rule_id: cure-limit-not-exceeded
    category: business_safety
    condition: "Milestone.cure_count >= MAX_CURE_ROUNDS (2) and a further CONDITIONAL verdict is submitted"
    error_id: ERR_CURE_LIMIT_EXCEEDED
    http_status: 409
    endpoints: ["POST /publisher-reviews"]

  - priority: 51
    rule_id: cure-window-open
    category: business_temporal
    condition: "Milestone.status == CURE_PENDING and the logical clock is strictly after Milestone.cure_deadline_at"
    error_id: ERR_CURE_WINDOW_EXPIRED
    http_status: 409
    endpoints: ["POST /milestone-builds"]

  - priority: 52
    rule_id: cure-sweep-only-after-deadline
    category: business_temporal
    condition: "The swept milestone's cure_deadline_at is greater than or equal to the logical clock (nothing to sweep yet)"
    error_id: ERR_CURE_WINDOW_STILL_OPEN
    http_status: 409
    endpoints: ["POST /development-agreements/{id}/cure-sweep"]

  - priority: 53
    rule_id: reviewer-window-free
    category: business_temporal
    condition: "reviewer_window_occupancy reports an overlap with another PublisherReview of the same reviewer_user_id"
    error_id: ERR_REVIEWER_WINDOW_CONFLICT
    http_status: 409
    endpoints: ["POST /publisher-reviews"]

  - priority: 54
    rule_id: review-window-well-formed
    category: business_temporal
    condition: "review_window_end_at <= review_window_start_at"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    endpoints: ["POST /publisher-reviews"]
    note: "Ranked BELOW the overlap check on purpose: a degenerate window that also overlaps an existing one reports the conflict, matching the reviewer-capacity-first reading of the agreement."

  - priority: 55
    rule_id: engagement-dates-well-formed
    category: business_temporal
    condition: "end_date < start_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    endpoints: ["POST /contractor-engagements"]

  - priority: 56
    rule_id: vendor-cooldown-clear
    category: resource_temporal
    condition: "vendor_cooldown_occupancy reports a conflict for the same (studio_id, vendor_code) within VENDOR_COOLDOWN_DAYS of an existing engagement"
    error_id: ERR_VENDOR_COOLDOWN_CONFLICT
    http_status: 409
    endpoints: ["POST /contractor-engagements"]

  - priority: 57
    rule_id: uplift-cap-respected
    category: business_fiscal
    condition: "order_type == FUNDING_UPLIFT and uplift_funded_cents + requested_amount_cents > round_half_up(advance_total_cents * MAX_UPLIFT_BPS / 10000)"
    error_id: ERR_UPLIFT_CAP_EXCEEDED
    http_status: 422
    endpoints: ["POST /change-orders/{id}/decide"]

  - priority: 58
    rule_id: ship-date-slip-respected
    category: business_temporal
    condition: "The approval would make abs(schedule_slip_days) exceed MAX_SLIP_DAYS"
    error_id: ERR_SHIP_DATE_SLIP_EXCEEDED
    http_status: 422
    endpoints: ["POST /change-orders/{id}/decide"]

  - priority: 59
    rule_id: milestone-funding-within-pool
    category: business_fiscal
    condition: "funded_amount_cents > available_funding_cents of the agreement"
    error_id: ERR_AGREEMENT_FUNDING_EXCEEDED
    http_status: 422
    endpoints: ["POST /milestones"]

  - priority: 60
    rule_id: contractor-budget-respected
    category: business_fiscal
    condition: "contractor_budget_utilization COMMITTED basis + new committed_cents > Milestone.contractor_budget_cents"
    error_id: ERR_CONTRACTOR_BUDGET_EXCEEDED
    http_status: 422
    endpoints: ["POST /contractor-engagements"]

  - priority: 61
    rule_id: invoice-within-engagement-tolerance
    category: business_fiscal
    condition: "Sum of APPROVED invoice amounts for the engagement + this amount_cents > round_half_up(engagement.committed_cents * INVOICE_TOLERANCE_BPS / 10000)"
    error_id: ERR_INVOICE_EXCEEDS_ENGAGEMENT
    http_status: 422
    endpoints: ["POST /contractor-invoices/{id}/decide"]
    note: "Evaluated only for decision == APPROVE; rejecting an invoice never trips the tolerance."

  - priority: 62
    rule_id: live-ops-cap-respected
    category: business_fiscal
    condition: "live_ops_draw_allowance rejects the draw (single-draw cap or the four-quarter total cap)"
    error_id: ERR_LIVE_OPS_CAP_EXCEEDED
    http_status: 422
    endpoints: ["POST /development-agreements/{id}/live-ops-draws"]

  - priority: 63
    rule_id: statement-period-monotonic
    category: business_temporal
    condition: "period_label sorts strictly before the period_label of the agreement's most recently FINALIZED statement"
    error_id: ERR_PERIOD_OUT_OF_ORDER
    http_status: 422
    endpoints: ["POST /royalty-statements"]

  - priority: 64
    rule_id: royalty-agreement-revenue-eligible
    category: state
    condition: "DevelopmentAgreement.status NOT IN {ACTIVE, COMPLETED}; a DRAFT, SUSPENDED or TERMINATED agreement has no revenue-reporting surface"
    error_id: ERR_AGREEMENT_NOT_REVENUE_ELIGIBLE
    http_status: 409
    endpoints:
      - "POST /royalty-statements"
      - "POST /royalty-statements/{id}/finalize"
    note: "Ranked below the statement-level state rules (42, 43) on purpose: statement identity errors are reported before agreement eligibility."

  - priority: 65
    rule_id: engagement-complete-no-open-invoices
    category: business_safety
    condition: "A ContractorInvoice of the engagement still has status == SUBMITTED"
    error_id: ERR_ENGAGEMENT_HAS_OPEN_INVOICES
    http_status: 409
    endpoints: ["POST /contractor-engagements/{id}/complete"]

  - priority: 66
    rule_id: engagement-cancel-no-approved-invoices
    category: business_safety
    condition: "engagement.approved_invoice_total_cents > 0 (money already incurred cannot be un-committed)"
    error_id: ERR_ENGAGEMENT_HAS_APPROVED_INVOICES
    http_status: 409
    endpoints: ["POST /contractor-engagements/{id}/cancel"]

  - priority: 67
    rule_id: feature-cut-within-milestone-funding
    category: business_fiscal
    condition: "order_type == FEATURE_CUT and requested_amount_cents > Milestone.funded_amount_cents + Milestone.uplift_cents"
    error_id: ERR_CUT_EXCEEDS_MILESTONE_FUNDING
    http_status: 422
    endpoints: ["POST /change-orders/{id}/decide"]

  - priority: 68
    rule_id: reinstate-requires-no-breach
    category: state
    condition: "DevelopmentAgreement.breach_count > 0 (a BREACHED milestone must be resolved by a change order or termination, never by reinstatement)"
    error_id: ERR_AGREEMENT_HAS_BREACH
    http_status: 409
    endpoints: ["POST /development-agreements/{id}/reinstate"]

  - priority: 69
    rule_id: review-condition-indexes-valid
    category: business_referential
    condition: "A value in conditions is not a valid 0-based index into the target Milestone.acceptance_criteria array"
    error_id: ERR_INVALID_CONDITION_INDEX
    http_status: 422
    endpoints: ["POST /publisher-reviews"]

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "/" so every path below is absolute and flat.
# Logical clock: the server starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
# =============================================================================
endpoints:
  # ---- registry -------------------------------------------------------------
  - method: POST
    path: "/studios"
    description: "Register a development studio. The returned id is the X-User-ID a Developer acts with."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "contact_email", "country_code?"]
    output: Studio
    side_effects: ["Creates the Studio row."]

  - method: GET
    path: "/studios/{id}"
    description: "Read one studio."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: Studio
    side_effects: []

  - method: POST
    path: "/publishers"
    description: "Register a publisher."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "contact_email", "country_code?"]
    output: Publisher
    side_effects: ["Creates the Publisher row."]

  - method: GET
    path: "/publishers/{id}"
    description: "Read one publisher."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: Publisher
    side_effects: []

  - method: POST
    path: "/publisher-users"
    description: "Create a publisher-side user. function REVIEW backs the PublisherReviewer role, FINANCE backs PublisherFinance; the returned id is that role's X-User-ID."
    roles: [PlatformAdmin]
    code: 201
    input: [publisher_id, display_name, function]
    output: PublisherUser
    side_effects: ["Creates the PublisherUser row."]

  - method: GET
    path: "/publisher-users/{id}"
    description: "Read one publisher user."
    roles: [PlatformAdmin, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: PublisherUser
    side_effects: []

  - method: GET
    path: "/publisher-users"
    description: "List publisher users, optionally filtered by publisher_id (FK reverse lookup) and function."
    roles: [PlatformAdmin, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["publisher_id?", "function?", "limit?", "offset?"]
    output: PublisherUser[]
    side_effects: []

  # ---- development agreement ------------------------------------------------
  - method: POST
    path: "/development-agreements"
    description: "Create a DRAFT development agreement between a studio and a publisher."
    roles: [PlatformAdmin, PublisherFinance]
    code: 201
    input: ["studio_id", "publisher_id", "title", "advance_total_cents", "royalty_rate_bps", "live_ops_quarterly_funding_cents?", "ship_date_original", "recoupable_cost_cap_bps?", "platform_fee_bps?"]
    output: DevelopmentAgreement
    side_effects: ["Creates the agreement in status DRAFT, funding_posture OPEN, recoupment_state PRE_RECOUP, post_launch_support_state PENDING, version 1, and initialises the funding ledger fields (funding_pool_cents = advance_total_cents, committed_cents 0, available_funding_cents = advance_total_cents)."]

  - method: GET
    path: "/development-agreements/{id}"
    description: "Read one agreement including every derived funding, recoupment and rights field, plus version for OCC."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: DevelopmentAgreement
    side_effects: []

  - method: GET
    path: "/development-agreements"
    description: "List agreements, optionally filtered by studio_id or publisher_id (FK reverse lookup)."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["studio_id?", "publisher_id?", "status?", "limit?", "offset?"]
    output: DevelopmentAgreement[]
    side_effects: []

  - method: POST
    path: "/development-agreements/{id}/activate"
    description: "Activate a DRAFT agreement once its milestone schedule exhausts the advance exactly."
    roles: [PublisherFinance]
    code: 200
    input: []
    output: DevelopmentAgreement
    side_effects:
      - "DevelopmentAgreement DRAFT -> ACTIVE; funding_posture = OPEN."
      - "Cascade: Milestones with depends_on_milestone_id == null go DEFINED -> IN_DEVELOPMENT; their PROPOSED engagements go PROPOSED -> ACTIVE."
      - "increments DevelopmentAgreement.version by 1"

  - method: POST
    path: "/development-agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement, freezing funding."
    roles: [PublisherFinance]
    code: 200
    input: ["reason?"]
    output: DevelopmentAgreement
    side_effects:
      - "DevelopmentAgreement ACTIVE -> SUSPENDED; funding_posture = FROZEN."
      - "Cascade: PENDING_AUTHORIZATION payments -> HELD_PENDING_CURE, withheld_payment_cents recomputed, ACTIVE engagements -> SUSPENDED."
      - "increments DevelopmentAgreement.version by 1"

  - method: POST
    path: "/development-agreements/{id}/reinstate"
    description: "Reinstate a SUSPENDED agreement; the compensating counterpart of suspend."
    roles: [PublisherFinance]
    code: 200
    input: ["reason?"]
    output: DevelopmentAgreement
    side_effects:
      - "DevelopmentAgreement SUSPENDED -> ACTIVE."
      - "Cascade: HELD_PENDING_CURE payments -> PENDING_AUTHORIZATION, withheld_payment_cents back to 0, SUSPENDED engagements back to ACTIVE or PROPOSED per their milestone status, funding_posture recomputed (OPEN or RESTRICTED)."
      - "increments DevelopmentAgreement.version by 1"

  - method: POST
    path: "/development-agreements/{id}/terminate"
    description: "Terminate an ACTIVE or SUSPENDED agreement and settle IP reversion / sequel rights."
    roles: [PublisherFinance]
    code: 200
    input: ["reason?"]
    output: DevelopmentAgreement
    side_effects:
      - "DevelopmentAgreement -> TERMINATED, funding_posture = FROZEN, terminated_at set."
      - "Four-step cascade: non-terminal Milestones -> CANCELLED; their payments -> WITHHELD and engagements -> TERMINATED_EARLY; SUBMITTED invoices -> VOIDED; ledger, accepted_milestone_ratio, ip_reversion_state and sequel_rights_holder recomputed."
      - "increments DevelopmentAgreement.version by 1"

  - method: POST
    path: "/development-agreements/{id}/cure-sweep"
    description: "Sweep every CURE_PENDING milestone whose cure deadline has passed into BREACHED, escalating the agreement to SUSPENDED."
    roles: [PublisherFinance]
    code: 200
    input: []
    output: DevelopmentAgreement
    side_effects:
      - "Milestone CURE_PENDING -> BREACHED for each expired window; breach_count recomputed."
      - "Cascade: agreement ACTIVE -> SUSPENDED with funding_posture FROZEN, PENDING_AUTHORIZATION payments -> HELD_PENDING_CURE, ACTIVE engagements -> SUSPENDED, withheld_payment_cents recomputed."
      - "increments DevelopmentAgreement.version by 1"

  - method: POST
    path: "/development-agreements/{id}/live-ops-draws"
    description: "Draw post-launch live-operations funding against the quarterly commitment; only while post_launch_support_state == ACTIVE."
    roles: [PublisherFinance]
    code: 200
    input: ["amount_cents", "memo?"]
    output: DevelopmentAgreement
    side_effects:
      - "Runs calculations.live_ops_draw_allowance; live_ops_drawn_cents += amount_cents."
      - "post_launch_support_state -> EXPIRED once the four-quarter total cap is reached exactly."
      - "increments DevelopmentAgreement.version by 1"

  - method: GET
    path: "/development-agreements/{id}/recoupment-summary"
    description: "Computed read: the recoupment and rights position of one agreement."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: "{ agreement_id: string, funding_pool_cents: integer, advance_disbursed_cents: integer, advance_recouped_cents: integer, unrecouped_advance_cents: integer, royalties_paid_to_date_cents: integer, recoupment_state: string, accepted_milestone_ratio: number, ip_reversion_state: string, sequel_rights_holder: string, post_launch_support_state: string, live_ops_drawn_cents: integer }"
    side_effects: []

  # ---- milestones -----------------------------------------------------------
  - method: POST
    path: "/milestones"
    description: "Define a milestone with its acceptance criteria, funded amount, contractor budget and optional predecessor."
    roles: [PlatformAdmin, Developer, PublisherFinance]
    code: 201
    input: ["agreement_id", "sequence_index", "title", "gate_profile", "funded_amount_cents", "contractor_budget_cents", "acceptance_criteria", "depends_on_milestone_id?"]
    output: Milestone
    side_effects:
      - "Creates the Milestone in status DEFINED with uplift_cents 0, cure_count 0, content_threshold_relief_pct 0.00, latest_build_number 0, open_condition_indexes []."
      - "Recomputes agreement.committed_cents and available_funding_cents (calculations.agreement_funding_ledger)."

  - method: GET
    path: "/milestones/{id}"
    description: "Read one milestone including cure state and gate relief."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  - method: GET
    path: "/milestones"
    description: "List milestones, optionally filtered by agreement_id, by depends_on_milestone_id (FK reverse lookup) or by status."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["agreement_id?", "depends_on_milestone_id?", "status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  - method: GET
    path: "/milestones/{id}/budget-summary"
    description: "Computed read: both bases of calculations.contractor_budget_utilization for one milestone."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: "{ milestone_id: string, contractor_budget_cents: integer, committed_basis_cents: integer, incurred_basis_cents: integer, available_committed_cents: integer, overrun_cents: integer }"
    side_effects: []

  # ---- builds ---------------------------------------------------------------
  - method: POST
    path: "/milestone-builds"
    description: "Submit a milestone build for review; runs calculations.build_gate_evaluation and moves the milestone to UNDER_REVIEW."
    roles: [Developer]
    code: 201
    input: ["milestone_id", "build_number", "feature_completeness_pct", "crash_free_sessions_pct", "content_completeness_pct", "known_blocker_count", "addressed_condition_indexes?", "release_notes?"]
    output: MilestoneBuild
    side_effects:
      - "Creates the MilestoneBuild with gate_state PASSED, readiness_score and submitted_at."
      - "Milestone IN_DEVELOPMENT|CURE_PENDING -> UNDER_REVIEW; latest_build_number updated; earlier PASSED builds -> SUPERSEDED."
      - "On a cure resubmission: clears milestone.open_condition_indexes and cure_deadline_at."

  - method: GET
    path: "/milestone-builds/{id}"
    description: "Read one build including its readiness_score and gate_state."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: MilestoneBuild
    side_effects: []

  - method: GET
    path: "/milestones/{id}/builds"
    description: "List every build of one milestone, newest build_number first (FK reverse lookup for MilestoneBuild.milestone_id)."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["gate_state?", "limit?", "offset?"]
    output: MilestoneBuild[]
    side_effects: []

  # ---- publisher review -----------------------------------------------------
  - method: POST
    path: "/publisher-reviews"
    description: "Record the publisher's verdict on a build: ACCEPTED, CONDITIONAL (opens a cure window) or REJECTED. Immutable once written."
    roles: [PublisherReviewer]
    code: 201
    input: ["build_id", "verdict", "review_window_start_at", "review_window_end_at", "conditions?", "cure_days?", "notes?"]
    output: PublisherReview
    side_effects:
      - "Creates the PublisherReview with reviewer_user_id copied from X-User-ID and decided_at from the logical clock."
      - "ACCEPTED: Milestone -> ACCEPTED, one MilestonePayment created in PENDING_AUTHORIZATION, dependent DEFINED milestones -> IN_DEVELOPMENT, funding_posture re-evaluated, RESTRICTED posture suspends open engagements, agreement ACTIVE -> COMPLETED evaluated last."
      - "CONDITIONAL: Milestone -> CURE_PENDING, cure_count += 1, open_condition_indexes = conditions, cure_deadline_at from calculations.cure_window."
      - "REJECTED: Milestone -> IN_DEVELOPMENT and the reviewed build -> SUPERSEDED."
      - "increments DevelopmentAgreement.version by 1"

  - method: GET
    path: "/publisher-reviews/{id}"
    description: "Read one review."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: PublisherReview
    side_effects: []

  - method: GET
    path: "/publisher-reviews"
    description: "List reviews, optionally filtered by build_id or reviewer_user_id (FK reverse lookups)."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["build_id?", "reviewer_user_id?", "verdict?", "limit?", "offset?"]
    output: PublisherReview[]
    side_effects: []

  # ---- payments -------------------------------------------------------------
  - method: GET
    path: "/milestone-payments/{id}"
    description: "Read one milestone payment including every disbursement component."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: MilestonePayment
    side_effects: []

  - method: GET
    path: "/milestone-payments"
    description: "List payments, optionally filtered by milestone_id or authorized_by_user_id (FK reverse lookups). This is the only discovery channel for cascade-created payments."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["milestone_id?", "authorized_by_user_id?", "status?", "limit?", "offset?"]
    output: MilestonePayment[]
    side_effects: []

  - method: POST
    path: "/milestone-payments/{id}/authorize"
    description: "Authorize a pending milestone payment; runs calculations.payment_disbursement and enforces segregation of duties against the accepting reviewer."
    roles: [PublisherFinance]
    code: 200
    input: ["memo?"]
    output: MilestonePayment
    side_effects:
      - "Computes contractor_overrun_cents, gross_amount_cents, holdback_bps, holdback_cents, net_amount_cents."
      - "MilestonePayment PENDING_AUTHORIZATION -> AUTHORIZED with authorized_at and authorized_by_user_id."
      - "Cascade: agreement.advance_disbursed_cents += net_amount_cents, holdback_reserve_cents += holdback_cents, unrecouped_advance_cents recomputed, recoupment_state PRE_RECOUP -> RECOUPING."
      - "increments DevelopmentAgreement.version by 1"

  # ---- change orders --------------------------------------------------------
  - method: POST
    path: "/change-orders"
    description: "Propose a scope change against a milestone: FUNDING_UPLIFT (more money) or FEATURE_CUT (less content), each with a ship-date delta. Requires the last observed agreement version."
    roles: [Developer, PublisherReviewer, PublisherFinance]
    code: 201
    input: ["agreement_id", "target_milestone_id", "order_type", "requested_amount_cents?", "ship_date_delta_days?", "rationale", "expected_agreement_version", "content_threshold_relief_pct?"]
    output: ChangeOrder
    side_effects:
      - "Creates the ChangeOrder in state PROPOSED."
      - "Cascade: any other PROPOSED ChangeOrder with the same target_milestone_id -> SUPERSEDED."
      - "increments DevelopmentAgreement.version by 1"

  - method: GET
    path: "/change-orders/{id}"
    description: "Read one change order."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/change-orders"
    description: "List change orders, optionally filtered by agreement_id or target_milestone_id (FK reverse lookups)."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["agreement_id?", "target_milestone_id?", "state?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: POST
    path: "/change-orders/{id}/decide"
    description: "Approve or decline a proposed change order. Approval branches on order_type into three structurally different side-effect sets."
    roles: [PublisherFinance]
    code: 200
    input: ["decision", "decision_note?"]
    output: ChangeOrder
    side_effects:
      - "Branch A (APPROVE + FUNDING_UPLIFT): state -> APPROVED_UPLIFT, milestone.uplift_cents += requested_amount_cents, uplift_funded_cents / funding_pool_cents / committed_cents / available_funding_cents / funding_posture recomputed, ship date moved by calculations.ship_date_schedule."
      - "Branch B (APPROVE + FEATURE_CUT): state -> APPROVED_CUT, milestone.uplift_cents -= requested_amount_cents, milestone.content_threshold_relief_pct += content_threshold_relief_pct, ledger recomputed WITHOUT touching uplift_funded_cents, ship date moved."
      - "Branch C (DECLINE): state -> DECLINED and decided_at only; no funding, content or ship-date effect."
      - "increments DevelopmentAgreement.version by 1"

  # ---- contractors ----------------------------------------------------------
  - method: POST
    path: "/contractor-engagements"
    description: "Engage an outsourcing vendor against a milestone's contractor budget, over a closed date interval subject to the vendor cooldown."
    roles: [Developer]
    code: 201
    input: [milestone_id, vendor_code, scope_summary, committed_cents, start_date, end_date]
    output: ContractorEngagement
    side_effects:
      - "Runs calculations.vendor_cooldown_occupancy, then the COMMITTED basis of calculations.contractor_budget_utilization."
      - "Creates the engagement with studio_id denormalised from the milestone's agreement, approved_invoice_total_cents 0, and status PROPOSED (or ACTIVE when the milestone is already IN_DEVELOPMENT, UNDER_REVIEW or CURE_PENDING)."

  - method: GET
    path: "/contractor-engagements/{id}"
    description: "Read one engagement."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: ContractorEngagement
    side_effects: []

  - method: GET
    path: "/contractor-engagements"
    description: "List engagements, optionally filtered by milestone_id or studio_id (FK reverse lookups) and by vendor_code."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["milestone_id?", "studio_id?", "vendor_code?", "status?", "limit?", "offset?"]
    output: ContractorEngagement[]
    side_effects: []

  - method: POST
    path: "/contractor-engagements/{id}/complete"
    description: "Close out an ACTIVE engagement once no invoice is still SUBMITTED."
    roles: [Developer]
    code: 200
    input: []
    output: ContractorEngagement
    side_effects: ["ContractorEngagement ACTIVE -> COMPLETED; committed_cents stays on the COMMITTED basis."]

  - method: POST
    path: "/contractor-engagements/{id}/cancel"
    description: "Cancel an engagement that has never had an invoice approved; compensating action that restores contractor-budget headroom exactly."
    roles: [Developer]
    code: 200
    input: ["reason?"]
    output: ContractorEngagement
    side_effects:
      - "ContractorEngagement PROPOSED|ACTIVE|SUSPENDED -> CANCELLED; the engagement leaves the COMMITTED basis."
      - "Cascade: SUBMITTED invoices of this engagement -> VOIDED."

  - method: POST
    path: "/contractor-invoices"
    description: "Submit a vendor invoice against an engagement."
    roles: [Developer]
    code: 201
    input: ["engagement_id", "invoice_number", "amount_cents", "period_end_date", "description?"]
    output: ContractorInvoice
    side_effects: ["Creates the ContractorInvoice in status SUBMITTED."]

  - method: GET
    path: "/contractor-invoices/{id}"
    description: "Read one invoice."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: ContractorInvoice
    side_effects: []

  - method: GET
    path: "/contractor-engagements/{id}/invoices"
    description: "List every invoice of one engagement (FK reverse lookup for ContractorInvoice.engagement_id)."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContractorInvoice[]
    side_effects: []

  - method: POST
    path: "/contractor-invoices/{id}/decide"
    description: "Approve or reject a submitted invoice. Approval grows the milestone's INCURRED basis, up to the 125% engagement tolerance."
    roles: [PublisherFinance]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: ContractorInvoice
    side_effects:
      - "APPROVE: ContractorInvoice SUBMITTED -> APPROVED, engagement.approved_invoice_total_cents += amount_cents, milestone INCURRED basis grows (can create contractor_overrun_cents at payment authorization)."
      - "REJECT: ContractorInvoice SUBMITTED -> REJECTED with rejection_reason; no basis changes."

  # ---- royalties ------------------------------------------------------------
  - method: POST
    path: "/royalty-statements"
    description: "Create a DRAFT royalty statement for a period; computes the PROVISIONAL variant of calculations.royalty_settlement. Requires the last observed agreement version."
    roles: [PublisherFinance]
    code: 201
    input: ["agreement_id", "period_label", "revenue_lines", "recoupable_cost_cents?", "expected_agreement_version"]
    output: RoyaltyStatement
    side_effects:
      - "Creates the statement in state DRAFT with distributable_total_cents, cost_deduction_cents, recoupment_base_cents, recoup_applied_cents, royalty_base_cents and provisional_royalty_payable_cents."
      - "Cascade: any other DRAFT statement of the same (agreement_id, period_label) -> SUPERSEDED."
      - "increments DevelopmentAgreement.version by 1"

  - method: GET
    path: "/royalty-statements/{id}"
    description: "Read one statement including both the provisional and the final payable figures."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: GET
    path: "/development-agreements/{id}/royalty-statements"
    description: "List every royalty statement of one agreement (FK reverse lookup for RoyaltyStatement.agreement_id)."
    roles: [PlatformAdmin, Developer, PublisherReviewer, PublisherFinance]
    code: 200
    input: ["state?", "period_label?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []

  - method: POST
    path: "/royalty-statements/{id}/finalize"
    description: "Finalize a DRAFT statement; computes the FINAL (life-to-date) variant and posts it to the agreement ledger."
    roles: [PublisherFinance]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects:
      - "Runs the FINAL variant of calculations.royalty_settlement, storing final_royalty_payable_cents while keeping the provisional fields unchanged."
      - "RoyaltyStatement DRAFT -> FINALIZED with finalized_at."
      - "Cascade: agreement.advance_recouped_cents, unrecouped_advance_cents, recoupment_state (RECOUPING -> RECOUPED at zero) and royalties_paid_to_date_cents updated."
      - "increments DevelopmentAgreement.version by 1"

  # ---- test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every deadline, cure window and review window is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["Sets the logical clock; no entity is modified and no cascade runs."]

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is reachable from at least one §1.5 endpoint; the priority that
# selects it when several apply is fixed by §1.4.
# =============================================================================
errors:
  # ---- authentication / authorization ---------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role is absent, empty or whitespace-only"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the four roles declared in §1.7"
  - id: ERR_ACTOR_NOT_FOUND
    http: 401
    condition: "X-User-ID does not resolve to a row of the acting role's backing entity"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not in the called endpoint's roles list"
  - id: ERR_ROLE_FUNCTION_MISMATCH
    http: 403
    condition: "PublisherUser.function does not match the acting publisher-side role (REVIEW vs FINANCE)"
  - id: ERR_NOT_AGREEMENT_PARTY
    http: 403
    condition: "The acting studio or publisher user is not a party to the agreement the request reaches"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The PublisherFinance user authorizing a payment is the same PublisherUser who accepted that milestone's review"

  # ---- structural -----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required or conditionally required field, unknown enum value, wrong type, out-of-range integer, pattern mismatch, oversized array, or malformed ISO 8601 value"

  # ---- not found ------------------------------------------------------------
  - id: ERR_STUDIO_NOT_FOUND
    http: 404
    condition: "No Studio matches the supplied id (path or body studio_id)"
  - id: ERR_PUBLISHER_NOT_FOUND
    http: 404
    condition: "No Publisher matches the supplied id (path or body publisher_id)"
  - id: ERR_PUBLISHER_USER_NOT_FOUND
    http: 404
    condition: "No PublisherUser matches the supplied id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No DevelopmentAgreement matches the supplied id (path or body agreement_id)"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "No Milestone matches the supplied id (path, milestone_id, target_milestone_id or depends_on_milestone_id)"
  - id: ERR_BUILD_NOT_FOUND
    http: 404
    condition: "No MilestoneBuild matches the supplied id (path or body build_id)"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No PublisherReview matches the supplied id"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No MilestonePayment matches the supplied id"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "No ChangeOrder matches the supplied id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No ContractorEngagement matches the supplied id (path or body engagement_id)"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "No ContractorInvoice matches the supplied id"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "No RoyaltyStatement matches the supplied id"

  # ---- concurrency ----------------------------------------------------------
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not equal the agreement's current version on POST /change-orders or POST /royalty-statements"

  # ---- agreement lifecycle state -------------------------------------------
  - id: ERR_AGREEMENT_NOT_DRAFT
    http: 409
    condition: "Activation attempted on an agreement whose status is not DRAFT"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "An operation that requires an ACTIVE agreement (payment authorization also accepts COMPLETED) is attempted in another status"
  - id: ERR_AGREEMENT_NOT_SUSPENDED
    http: 409
    condition: "Reinstatement attempted on an agreement whose status is not SUSPENDED"
  - id: ERR_AGREEMENT_TERMINAL
    http: 409
    condition: "Scope change or lifecycle change attempted on a TERMINATED or COMPLETED agreement"
  - id: ERR_AGREEMENT_HAS_NO_MILESTONES
    http: 409
    condition: "Activation attempted with zero DEFINED milestones"
  - id: ERR_AGREEMENT_HAS_BREACH
    http: 409
    condition: "Reinstatement attempted while breach_count > 0"
  - id: ERR_AGREEMENT_NOT_REVENUE_ELIGIBLE
    http: 409
    condition: "Royalty statement creation or finalization attempted while the agreement is not ACTIVE or COMPLETED"
  - id: ERR_FUNDING_POSTURE_RESTRICTED
    http: 409
    condition: "A new Milestone is created while funding_posture == RESTRICTED"
  - id: ERR_POST_LAUNCH_NOT_ACTIVE
    http: 409
    condition: "A live-ops draw is attempted while post_launch_support_state is PENDING or EXPIRED"

  # ---- milestone / build / review state ------------------------------------
  - id: ERR_SEQUENCE_INDEX_TAKEN
    http: 409
    condition: "Another Milestone of the same agreement already uses the submitted sequence_index"
  - id: ERR_MILESTONE_NOT_OPEN_FOR_BUILD
    http: 409
    condition: "Build submitted against a milestone whose status is not DEFINED, IN_DEVELOPMENT or CURE_PENDING"
  - id: ERR_MILESTONE_NOT_OPEN_FOR_OUTSOURCING
    http: 409
    condition: "Contractor engagement created against a milestone whose status is not DEFINED, IN_DEVELOPMENT or CURE_PENDING"
  - id: ERR_MILESTONE_NOT_UNDER_REVIEW
    http: 409
    condition: "A review is recorded for a build whose milestone is not UNDER_REVIEW (covers a second review of the same build)"
  - id: ERR_MILESTONE_NOT_AMENDABLE
    http: 409
    condition: "A change order is created against, or decided for, a milestone in a terminal status"
  - id: ERR_BUILD_SUPERSEDED
    http: 409
    condition: "A review targets a build whose gate_state is SUPERSEDED"
  - id: ERR_BUILD_NUMBER_NOT_INCREASING
    http: 409
    condition: "build_number is less than or equal to the milestone's latest_build_number"
  - id: ERR_DEPENDENCY_NOT_ACCEPTED
    http: 409
    condition: "A build is submitted while the milestone's predecessor has not reached ACCEPTED"
  - id: ERR_CURE_LIMIT_EXCEEDED
    http: 409
    condition: "A third CONDITIONAL verdict is recorded on a milestone that already used its two cure rounds"
  - id: ERR_CURE_WINDOW_EXPIRED
    http: 409
    condition: "A cure resubmission arrives after the milestone's cure_deadline_at"
  - id: ERR_CURE_WINDOW_STILL_OPEN
    http: 409
    condition: "A cure sweep is requested while no CURE_PENDING milestone has passed its deadline"

  # ---- payment / change order / contractor state ---------------------------
  - id: ERR_PAYMENT_NOT_PENDING
    http: 409
    condition: "Authorization attempted on a payment whose status is not PENDING_AUTHORIZATION"
  - id: ERR_CHANGE_ORDER_NOT_PROPOSED
    http: 409
    condition: "A decision is submitted for a change order that is already decided or SUPERSEDED"
  - id: ERR_ENGAGEMENT_STATE_INVALID
    http: 409
    condition: "Completion or cancellation attempted from an engagement status the transition does not allow"
  - id: ERR_ENGAGEMENT_NOT_INVOICEABLE
    http: 409
    condition: "An invoice is submitted against a non-invoiceable engagement, or approval is attempted while the engagement is not ACTIVE or its milestone is CANCELLED"
  - id: ERR_ENGAGEMENT_HAS_OPEN_INVOICES
    http: 409
    condition: "Completion attempted while an invoice of the engagement is still SUBMITTED"
  - id: ERR_ENGAGEMENT_HAS_APPROVED_INVOICES
    http: 409
    condition: "Cancellation attempted while approved_invoice_total_cents > 0"
  - id: ERR_INVOICE_NOT_SUBMITTED
    http: 409
    condition: "A decision is submitted for an invoice that is already APPROVED, REJECTED or VOIDED"
  - id: ERR_INVOICE_NUMBER_TAKEN
    http: 409
    condition: "The engagement already has an invoice with the submitted invoice_number"
  - id: ERR_STATEMENT_NOT_DRAFT
    http: 409
    condition: "Finalization attempted on a statement that is FINALIZED or SUPERSEDED"
  - id: ERR_PERIOD_ALREADY_FINALIZED
    http: 409
    condition: "A statement is created for a period_label that already has a FINALIZED statement"

  # ---- fiscal / temporal business rules ------------------------------------
  - id: ERR_FUNDING_ALLOCATION_INCOMPLETE
    http: 422
    condition: "Activation attempted while committed_cents does not equal funding_pool_cents exactly"
  - id: ERR_AGREEMENT_FUNDING_EXCEEDED
    http: 422
    condition: "A milestone's funded_amount_cents exceeds the agreement's available_funding_cents"
  - id: ERR_UPLIFT_CAP_EXCEEDED
    http: 422
    condition: "An uplift approval would push uplift_funded_cents beyond MAX_UPLIFT_BPS of advance_total_cents"
  - id: ERR_CUT_EXCEEDS_MILESTONE_FUNDING
    http: 422
    condition: "A feature-cut approval would drive milestone funding below zero"
  - id: ERR_SHIP_DATE_SLIP_EXCEEDED
    http: 422
    condition: "An approval would push abs(schedule_slip_days) beyond MAX_SLIP_DAYS"
  - id: ERR_CONTRACTOR_BUDGET_EXCEEDED
    http: 422
    condition: "A new engagement's committed_cents would push the COMMITTED basis past the milestone's contractor_budget_cents"
  - id: ERR_INVOICE_EXCEEDS_ENGAGEMENT
    http: 422
    condition: "Approving an invoice would push approved_invoice_total_cents beyond INVOICE_TOLERANCE_BPS of the engagement's committed_cents"
  - id: ERR_LIVE_OPS_CAP_EXCEEDED
    http: 422
    condition: "A live-ops draw exceeds the quarterly amount or the four-quarter total cap"
  - id: ERR_BUILD_GATE_NOT_MET
    http: 422
    condition: "calculations.build_gate_evaluation returns pass == false for the submitted build"
  - id: ERR_CONDITIONS_NOT_ADDRESSED
    http: 422
    condition: "A cure resubmission does not address every open condition index"
  - id: ERR_INVALID_CONDITION_INDEX
    http: 422
    condition: "A conditions entry is not a valid index into the milestone's acceptance_criteria"
  - id: ERR_INVALID_DEPENDENCY
    http: 422
    condition: "depends_on_milestone_id points outside the agreement, at itself, or at a milestone with a sequence_index that is not strictly smaller"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "review_window_end_at is not after review_window_start_at, or engagement end_date precedes start_date"
  - id: ERR_REVIEWER_WINDOW_CONFLICT
    http: 409
    condition: "The reviewer already has a PublisherReview whose half-open window overlaps the submitted one"
  - id: ERR_VENDOR_COOLDOWN_CONFLICT
    http: 409
    condition: "The same studio/vendor_code pair has an engagement whose closed date interval is within VENDOR_COOLDOWN_DAYS of the submitted one"
  - id: ERR_PERIOD_OUT_OF_ORDER
    http: 422
    condition: "period_label sorts before the most recently FINALIZED period of the agreement"

# =============================================================================
# §1.7 RBAC Matrix
# Role model: segregation_of_duties. The publisher side is split into two
# functions that may never do each other's work, and the accepting reviewer may
# never authorize the payment their own acceptance created.
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator. Maintains the studio / publisher / publisher-user registry and drives the logical clock. Exempt from the agreement-party check, but owns no business decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /studios"
      - "POST /publishers"
      - "POST /publisher-users"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /development-agreements"
      - "POST /milestones"
      - "every GET in §1.5"

  - name: Developer
    description: "The game studio. Defines milestones while the agreement is DRAFT, submits builds, and manages outsourcing inside the milestone contractor budget."
    identity: "entity_backed:Studio"
    exclusive_operations:
      - "POST /milestone-builds"
      - "POST /contractor-engagements"
      - "POST /contractor-engagements/{id}/complete"
      - "POST /contractor-engagements/{id}/cancel"
      - "POST /contractor-invoices"
    shared_operations:
      - "POST /milestones"
      - "POST /change-orders"
      - "every GET in §1.5 for agreements whose studio_id equals the acting Studio.id"

  - name: PublisherReviewer
    description: "Publisher-side acceptance authority (PublisherUser.function IN {REVIEW, DUAL}). Decides ACCEPTED / CONDITIONAL / REJECTED on builds and may propose change orders, but can never move money."
    identity: "entity_backed:PublisherUser"
    exclusive_operations:
      - "POST /publisher-reviews"
    shared_operations:
      - "POST /change-orders"
      - "every GET in §1.5 for agreements whose publisher_id equals the acting PublisherUser.publisher_id"

  - name: PublisherFinance
    description: "Publisher-side funding authority (PublisherUser.function IN {FINANCE, DUAL}). Runs the agreement lifecycle, decides change orders and invoices, authorizes payments and settles royalties. Never records an acceptance verdict."
    identity: "entity_backed:PublisherUser"
    exclusive_operations:
      - "POST /development-agreements/{id}/activate"
      - "POST /development-agreements/{id}/suspend"
      - "POST /development-agreements/{id}/reinstate"
      - "POST /development-agreements/{id}/terminate"
      - "POST /development-agreements/{id}/cure-sweep"
      - "POST /development-agreements/{id}/live-ops-draws"
      - "POST /milestone-payments/{id}/authorize"
      - "POST /change-orders/{id}/decide"
      - "POST /contractor-invoices/{id}/decide"
      - "POST /royalty-statements"
      - "POST /royalty-statements/{id}/finalize"
    shared_operations:
      - "POST /development-agreements"
      - "POST /milestones"
      - "POST /change-orders"
      - "every GET in §1.5 for agreements whose publisher_id equals the acting PublisherUser.publisher_id"
    segregation_of_duties:
      - "The PublisherUser authorizing a MilestonePayment MUST differ from the PublisherUser whose ACCEPTED review created it (ERR_SEGREGATION_OF_DUTIES, priority 45)."
      - "A PublisherUser with function == FINANCE can never act as PublisherReviewer, and one with function == REVIEW can never act as PublisherFinance (ERR_ROLE_FUNCTION_MISMATCH, priority 5). Only a function == DUAL operator may act in both roles, and priority 45 then stops that operator from authorizing the payment created by its own ACCEPTED review."
