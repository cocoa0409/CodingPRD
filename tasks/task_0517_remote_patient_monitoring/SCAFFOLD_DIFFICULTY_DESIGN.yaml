              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-DC-1" }
