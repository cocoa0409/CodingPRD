      - name: escalation_exactly_on_the_cure_deadline_is_still_premature
        claim_type: temporal_validation
        grounds:
          - validations[priority=56]
          - calculations.contractual_time_windows
          - errors[ERR_CURE_WINDOW_VIOLATION]
          - endpoints[POST /ppp/enforcement-actions/{id}/escalate]
        distinguishing_aspect: |
          cure_allowed uses <= and escalate_allowed uses >, so the two predicates partition
          the timeline with the deadline instant belonging to the CURE side. With
          effective_date 2027-04-02 the deadline is 2027-07-01; escalating at exactly
          2027-07-01 must be refused, and the refusal must not mint the successor
          TERMINATION action that a successful escalation would create.
        test_recipe:
          setup:
