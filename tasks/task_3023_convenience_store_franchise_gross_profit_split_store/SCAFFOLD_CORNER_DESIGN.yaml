        distinguishing_aspect: "The count and finalize steps are split across FieldAuditor and FranchisorAdmin, so the same actor that records a physical count cannot finalize it: finalize presented under the FieldAuditor role returns 403 ERR_FORBIDDEN while the identical call under FranchisorAdmin succeeds."
