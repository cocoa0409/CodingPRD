        distinguishing_aspect: "The activate action refuses a DRAFT version outright, so the divergence gate and the segregation-of-duties check never even get a chance to run on an unmeasured policy."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z with a T2/VIOLENCE category and a freshly created DRAFT v1 authored by pm-alice."
