          - errors[ERR_GATES_BEFORE_OPEN_DATE]
          - errors[ERR_CREW_COVERAGE_INSUFFICIENT]
          - state_machines.RouteStop.transitions.CONFIRMED_to_SETUP.preconditions
          - state_machines.RouteStop.transitions.SETUP_to_OPEN.preconditions
        distinguishing_aspect: |
          One fixture walks the logical clock across both window edges and the posture gate: setup one hour early
          answers ERR_LOAD_IN_NOT_OPEN, setup one hour late succeeds, gates three days early answer
          ERR_GATES_BEFORE_OPEN_DATE, gates on time but with the only operator shift cancelled answer
          ERR_CREW_COVERAGE_INSUFFICIENT (posture LABOR_HOLD), and re-booking the identical shift lets the same
          call through. Every failure leaves the stop in the state it was already in.
        test_recipe:
