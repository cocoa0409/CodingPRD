# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3022_fixed_price_point_retail_multi_price_conversion
#
# Nine §0.5 difficulty rules, two instances each = 18 instances.
# Every grounds: ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every ${var} is bound by an earlier captures: in the same instance.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: break_even_ceiling_at_zero_unit_margin
        grounds:
          - calculations.break_even_units
          - entities.Item.fields.break_even_units
          - entities.Item.fields.net_contribution_cents_per_unit
          - validations[priority=18]
          - state_machines.Item.COST_PENDING_to_DELETE_REVIEW
        distinguishing_aspect: "The two Item cost states differ at the FLOOR: a 4-cent unit margin (retail 125, landed 120, variable 4) yields a finite break_even_units of 5, while a 0-cent unit margin (retail 125, landed 121, variable 4) has no finite break-even and the rule pins the sentinel 0 — not 0 from a division, and not a null."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents with target_landed_cost_ratio 0.90, one import vendor."
            - "Item SKU 1001 in PRICE_ASSIGNED at that price point: unit_retail_cents 125, base_landed_cost_cents 120, units_per_case 4, fixed_store_handling_cents 6, variable_store_cost_cents 4."
            - "Item SKU 1002 in PRICE_ASSIGNED at the same price point: unit_retail_cents 125, base_landed_cost_cents 121, units_per_case 4, fixed_store_handling_cents 6, variable_store_cost_cents 4."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "1001", description: "Bath Bar 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 120, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i1001_id: $.data.id }
            - call: "POST /merchandise/items/${i1001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "1002", description: "Sponge 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 121, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i1002_id: $.data.id }
            - call: "POST /merchandise/items/${i1002_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
          trigger:
            - call: "POST /merchandise/items/${i1001_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 120 }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i1002_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 121 }
              as: MerchandiseBuyer
          assert:
            - "Item.${i1001_id}.landed_cost_cents == 120 and Item.${i1001_id}.net_contribution_cents_per_unit == 1 and Item.${i1001_id}.break_even_units == 5"
            - "Item.${i1002_id}.landed_cost_cents == 121 and Item.${i1002_id}.net_contribution_cents_per_unit == 0 and Item.${i1002_id}.break_even_units == 0"
            - "Item.${i1001_id}.status == COST_PENDING and Item.${i1002_id}.status == DELETE_REVIEW"
            - "break_even_units on the 1-cent-margin item is 0 because the divergence regime was taken, NOT because ceil(486/0) evaluated to 0"
            - "after POST /merchandise/item-deletions/${i1002_id}/decision with decision RETAIN, Item.${i1002_id}.status == ACTIVE while Item.${i1002_id}.break_even_units is still 0"

      - name: freight_passthrough_three_regimes_same_freight
        grounds:
          - calculations.freight_pass_through_apportionment
          - calculations.net_contribution_cents_per_unit
          - entities.Item.fields.net_contribution_cents_per_unit
          - entities.Item.fields.break_even_units
          - state_machines.Item.PRICE_ASSIGNED_to_COST_PENDING
          - errors.ERR_COST_EXCEEDS_PRICE_POINT
        distinguishing_aspect: "One container's freight (200 cents over 80 allocable units, so exactly 2 cents per unit) produces three different Item outcomes from the SAME receipt, because the applied cost interacts with a different per-item base: SKU 3001 lands at 107 and goes COST_PENDING, SKU 3002 lands at 127 and goes DELETE_REVIEW, and SKU 3003 lands at 127 but is thrown ERR_COST_EXCEEDS_PRICE_POINT because it is cured by an ACTIVE exclusive pack program."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents with target_landed_cost_ratio 0.90, one import vendor."
            - "Three items in PRICE_ASSIGNED at that price point, each 4 units per case, fixed_store_handling_cents 6, variable_store_cost_cents 4, shelf_package_capacity 4.0 sqft, sqft_per_unit 0.1: SKU 3001 base_landed_cost_cents 105, SKU 3002 base_landed_cost_cents 125, SKU 3003 base_landed_cost_cents 125."
            - "An EXCLUSIVE_PACK program on the vendor for SKU 3003's price point, already ACTIVE with quoted_landed_cost_cents 100."
            - "One container from that vendor, in status RECEIVED, total_freight_cents 200, with one allocation line each for SKU 3001 (sequence 1, 300 units) and SKU 3002 (sequence 2, 200 units). Both lines place 40 units, so the container's allocable total is 80 and the freight rate floors to 2 cents per unit."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/exclusive-pack-programs"
              payload: { vendor_id: "${vendor_x_id}", price_point_id: "${pp125_id}", pack_qty: 6, case_pack_qty: 48, formulation_code: "LOW_SUDS_V3", quoted_landed_cost_cents: 100 }
              as: MerchandiseBuyer
              captures: { pack_3003_id: $.data.id }
            - call: "PATCH /merchandise/exclusive-pack-programs/${pack_3003_id}"
              payload: { status: "ACTIVE" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "3001", description: "Kitchen Towel 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i3001_id: $.data.id }
            - call: "POST /merchandise/items/${i3001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "3002", description: "Tumbler 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 125, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i3002_id: $.data.id }
            - call: "POST /merchandise/items/${i3002_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "3003", description: "Scrub Sponge 6ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 125, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i3003_id: $.data.id }
            - call: "POST /merchandise/items/${i3003_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 200 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i3001_id}", sequence: 1, requested_units: 300 }
              as: DistributionCenterOperator
              captures: { line_3001_id: $.data.id }
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i3002_id}", sequence: 2, requested_units: 200 }
              as: DistributionCenterOperator
              captures: { line_3002_id: $.data.id }
          trigger:
            - call: "POST /merchandise/items/${i3001_id}/landed-costs"
              payload: { method: "FREIGHT_PASS_THROUGH", applied_amount_cents: 107, container_id: "${cont_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i3002_id}/landed-costs"
              payload: { method: "FREIGHT_PASS_THROUGH", applied_amount_cents: 127, container_id: "${cont_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i3003_id}/landed-costs"
              payload: { method: "FREIGHT_PASS_THROUGH", applied_amount_cents: 127, container_id: "${cont_id}" }
              as: MerchandiseBuyer
              captures: { err_3003: $.data.error_id }
          assert:
            - "Item.${i3001_id}.landed_cost_cents == 107 and Item.${i3001_id}.net_contribution_cents_per_unit == 14 and Item.${i3001_id}.break_even_units == 4"
            - "Item.${i3001_id}.status == COST_PENDING"
            - "Item.${i3002_id}.landed_cost_cents == 127 and Item.${i3002_id}.net_contribution_cents_per_unit == -6 and Item.${i3002_id}.break_even_units == 0"
            - "Item.${i3002_id}.status == DELETE_REVIEW"
            - "the third request returns 422 and err_3003 == ERR_COST_EXCEEDS_PRICE_POINT"
            - "Item.${i3003_id}.status == COST_PENDING — the ACTIVE exclusive pack program kept it out of DELETE_REVIEW"
            - "Item.${i3003_id}.net_contribution_cents_per_unit == -6, identical to SKU 3002, which is the whole point: same number, different state"

      - name: pack_ceiling_reported_then_gating_on_identical_inputs
        grounds:
          - calculations.landed_cost_target_ceiling
          - entities.ExclusivePackProgram.fields.target_landed_cost_cents
          - entities.ExclusivePackProgram.fields.status
          - errors.ERR_PACK_COST_TARGET_MISSED
        distinguishing_aspect: "A DIFFERENT entity domain from the Item break-even instance: the same ceiling computation is a non-binding report while the pack program is DRAFT and a fatal gate on the very same 123-cent value once the advance to ACTIVE is attempted — so identical inputs yield 'the number is 123' in one context and 'the transition does not happen' in the other."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 400 cents with target_landed_cost_ratio 0.35, one import vendor, and one DRAFT exclusive pack program quoting 124 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "FOUR_DOLLAR", shelf_price_cents: 400, target_landed_cost_ratio: 0.35 }
              as: MerchandiseBuyer
              captures: { pp400_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp400_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/exclusive-pack-programs"
              payload: { vendor_id: "${vendor_x_id}", price_point_id: "${pp400_id}", pack_qty: 6, case_pack_qty: 48, formulation_code: "LOW_SUDS_V3", quoted_landed_cost_cents: 124 }
              as: MerchandiseBuyer
              captures: { pack_id: $.data.id }
          trigger:
            - call: "GET /merchandise/exclusive-pack-programs/${pack_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { ceiling_draft: $.data.target_landed_cost_cents, status_draft: $.data.status }
            - call: "PATCH /merchandise/exclusive-pack-programs/${pack_id}"
              payload: { status: "ACTIVE" }
              as: MerchandiseBuyer
              captures: { err_gate: $.data.error_id }
            - call: "PATCH /merchandise/exclusive-pack-programs/${pack_id}"
              payload: { status: "ACTIVE", quoted_landed_cost_cents: 123 }
              as: MerchandiseBuyer
              captures: { ceiling_active: $.data.target_landed_cost_cents, status_active: $.data.status }
          assert:
            - "ceiling_draft == 123 and status_draft == DRAFT — in the DRAFT regime the same 123-cent ceiling is reported and does not stop anything"
            - "floor(400 * 0.35 * 0.88) == floor(123.2) == 123, the pinned multiplication order"
            - "the ACTIVE advance on the 124-cent quote returns 422 and err_gate == ERR_PACK_COST_TARGET_MISSED — the same number is now fatal"
            - "ceiling_active == 123 and status_active == ACTIVE — once the quote is brought to 123 the identical gate passes"
            - "ExclusivePackProgram.${pack_id}.quoted_landed_cost_cents == 123 after the re-quote"
            - "Vendor.${vendor_x_id}.exclusivity_program_count == 1 — only the successful activation counted"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: waterfall_broken_case_allowance_arms_the_base_deck
        grounds:
          - calculations.shelf_allocation_waterfall
          - entities.Item.fields.broken_case_allowance
          - entities.AllocationLine.fields.overflow_units
          - entities.AllocationLine.fields.status
          - calculations.freight_pass_through_apportionment
        distinguishing_aspect: "Mode (a) non-linear interaction: the shelf ceiling is conditional on a state-transition input, so the identical 150-unit request against the identical 40-unit shelf yields allocated_units 140 (overflow 10) for the broken-case SKU 2001 and allocated_units 40 (overflow 110) for the fitting SKU 2002 — and the container's allocated total therefore differs by 100 units depending on which arm fires."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one import vendor, one store."
            - "SKU 2001: sqft_per_unit 0.1, shelf_package_capacity 4.0, units_per_case 100 — so 100 * 0.1 = 10.0 > 4.0 and broken_case_allowance is true."
            - "SKU 2002: sqft_per_unit 0.2, shelf_package_capacity 8.0, units_per_case 12 — so 12 * 0.2 = 2.4 <= 8.0 and broken_case_allowance is false."
            - "Both items PRICE_ASSIGNED and ACTIVE, both sourced from the same vendor, both on one RECEIVED container."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "2001", description: "Pine Cleaner 100ct", unit_retail_cents: 125, commodity_class: "HOUSEHOLD", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 100, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i2001_id: $.data.id }
            - call: "POST /merchandise/items/${i2001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i2001_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 105 }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i2001_id}/activations"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "2002", description: "Scrub Pad 12ct", unit_retail_cents: 125, commodity_class: "HOUSEHOLD", season_code: "HARVEST_2026", sqft_per_unit: 0.2, shelf_package_capacity: 8.0, units_per_case: 12, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i2002_id: $.data.id }
            - call: "POST /merchandise/items/${i2002_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i2002_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 105 }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i2002_id}/activations"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 1260 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
          trigger:
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i2001_id}", sequence: 1, requested_units: 150 }
              as: DistributionCenterOperator
              captures: { line_2001_id: $.data.id }
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i2002_id}", sequence: 2, requested_units: 150 }
              as: DistributionCenterOperator
              captures: { line_2002_id: $.data.id }
          assert:
            - "AllocationLine.${line_2001_id}.allocated_units == 140 and AllocationLine.${line_2001_id}.overflow_units == 10"
            - "AllocationLine.${line_2002_id}.allocated_units == 40 and AllocationLine.${line_2002_id}.overflow_units == 110"
            - "Item.${i2001_id}.broken_case_allowance == true and Item.${i2002_id}.broken_case_allowance == false"
            - "both lines report status ALLOCATED and neither carries the OVERFLOW status, because both placed at least one unit"
            - "the container's non-REVERSED allocated-unit total is 180, so floor(1260 / 180) == 7 cents of freight per unit"

      - name: freight_apportionment_floor_once_not_per_item
        grounds:
          - calculations.freight_pass_through_apportionment
          - entities.Container.fields.total_freight_cents
          - entities.Item.fields.base_landed_cost_cents
          - state_machines.Item.PRICE_ASSIGNED_to_COST_PENDING
        distinguishing_aspect: "Mode (b) nested rounding where the order decides the cents: 1260 cents over 500 allocable units is floored ONCE at container level to 2 cents per unit before any per-item application, so every item pays 2 and lands at 107 — the competing order, flooring each item's share of 1260 * units / 500 individually, pays 2.52 floored to 2.52 per unit outside integer cents or 3 outside integer cents, and the two orders disagree for identical inputs."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one import vendor, one store, one RECEIVED container of 1260 cents with two lines: SKU 3301 for 300 units at sequence 1 and SKU 3302 for 200 units at sequence 2, both placing their full request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/items"
