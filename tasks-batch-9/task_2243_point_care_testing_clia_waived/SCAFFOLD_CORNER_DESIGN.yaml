            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site with three trained operators: a PHYSICIAN (lab director of record), a NURSE (assessor) and a MEDICAL_TECHNOLOGIST (subject). All three are PROVISIONAL x ACTIVE, so posture is OPEN."
