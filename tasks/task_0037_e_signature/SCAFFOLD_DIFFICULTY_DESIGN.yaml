scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances on different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: signing_progress_chronological_vs_forward_looking
        grounds:
          - calculations.signing_progress_percent
          - state_machines.SigningStep.PENDING_to_ACTIVE
          - state_machines.SigningParty.AUTHENTICATING_to_SIGNED
          - endpoints["GET /contracts/{id}/progress"]
          - entities.Contract.fields.signing_progress_percent
          - entities.SigningStep.fields.status
        distinguishing_aspect: |
          Operates on the SigningStep × SigningParty domain. The chronological variant
          counts only parties whose parent SigningStep is in {ACTIVE, SIGNED, REJECTED};
          the forward_looking variant additionally includes parties in PENDING (non-SKIPPED)
          steps. With identical inputs (one fully-signed activated step plus one PENDING
          step, two parties each), chronological = 100.00 while forward_looking = 50.00.
        test_recipe:
          setup:
            - "Seed Template T (TemplateAdmin user U_admin), TemplateVersion TV1 PUBLISHED with one signature_position per role on page 1, page_count=1."
            - "Seed OrgUser U_init (initiator), four OrgUsers U1..U4 (signers), and EvidenceArchivist user U_arch — all distinct from U_admin."
            - "Initiator U_init creates Contract C with template_version_id=TV1.id, expires_at far in future."
            - "Append SigningStep S1 (step_index=1, mode=PARALLEL_COUNTERSIGN) and S2 (step_index=2, mode=PARALLEL_COUNTERSIGN)."
            - "Append two SigningParty rows under S1 (P1a→U1, P1b→U2) and two under S2 (P2a→U3, P2b→U4); each required_auth_factors=[SMS]."
          trigger:
            - "POST /contracts/{C.id}/activate (S1 → ACTIVE; S2 stays PENDING)."
            - "Pre-create IdentityVerification for U1 with factors_attempted=[{SMS,PASS}], real_name_match=true; POST /signing-parties/{P1a.id}/sign with valid TimestampToken (drift_seconds <= 5)."
            - "Pre-create IdentityVerification for U2 likewise; POST /signing-parties/{P1b.id}/sign."
            - "GET /contracts/{C.id}/progress (default chronological) and GET /contracts/{C.id}/progress?variant=forward_looking."
          assert:
            - "GET /contracts/{C.id}/progress returns progress_percent == 100.00."
            - "GET /contracts/{C.id}/progress?variant=forward_looking returns progress_percent == 50.00."
            - "Contract.signing_progress_percent stored value == 100.00 (the chronological variant is canonical)."

      - name: evidence_strength_provisional_vs_post_seal
        grounds:
          - calculations.evidence_strength_score
          - state_machines.EvidencePackage.GENERATING_to_SEALED
          - state_machines.Contract.PARTIALLY_SIGNED_to_COMPLETED
          - endpoints["GET /contracts/{id}/evidence/preview"]
          - endpoints["POST /contracts/{id}/evidence/seal"]
          - entities.Contract.fields.evidence_strength_score
          - entities.EvidencePackage.fields.notary_provider
        distinguishing_aspect: |
          Operates on the Contract × EvidencePackage domain (a different entity domain
          from instance 1). The provisional_pre_seal variant forces N=0 even when
          notary_provider=BLOCKCHAIN; the post-seal canonical variant computes N=90 then
          applies the NOTARIZED-tier bonus to raise it to N_final=100. With identical
          inputs (single party signed using CA_CERT+BANK_CARD, drift=3s, notary_provider
          configured as BLOCKCHAIN, hash matches), provisional final_score = 80.00 while
          post-seal Contract.evidence_strength_score = 100.00.
        test_recipe:
          setup:
            - "Seed Template T, PUBLISHED TV1 (page_count=1), distinct users U_admin, U_init, U1, U_arch."
            - "Initiator U_init creates Contract C; appends one SigningStep S1 (PARALLEL_COUNTERSIGN); appends one SigningParty P1 (signer_user_id=U1, required_auth_factors=[CA_CERT, BANK_CARD])."
            - "Initiator creates ReminderRule (any) and configures EvidencePackage notary_provider=BLOCKCHAIN with notary_reference='0xABCD' at seal time."
          trigger:
            - "POST /contracts/{C.id}/activate."
            - "Create IdentityVerification for U1 with factors_attempted=[{CA_CERT,PASS},{BANK_CARD,PASS}], real_name_match=true."
            - "POST /signing-parties/{P1.id}/sign with TimestampToken anchored within 3 seconds of server time → Contract → COMPLETED."
            - "GET /contracts/{C.id}/evidence/preview (returns provisional)."
            - "POST /contracts/{C.id}/evidence/seal with notary_provider=BLOCKCHAIN, notary_reference='0xABCD' (acted by U_arch)."
            - "GET /contracts/{C.id}."
          assert:
            - "GET /contracts/{C.id}/evidence/preview returns provisional_score == 80.00 and provisional_tier == 'GOLD'."
            - "After seal, Contract.evidence_strength_score == 100.00 and Contract.evidence_tier == 'NOTARIZED'."
            - "EvidencePackage.status == 'SEALED' and package_sha256 is non-null."

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances in different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: document_fingerprint_nested_hash_order
        grounds:
          - calculations.document_fingerprint_hash
          - state_machines.Contract.DRAFT_to_PENDING_SIGN
          - entities.TemplateVersion.fields.signature_positions
          - entities.TemplateVersion.fields.page_count
          - entities.Contract.fields.document_fingerprint_sha256
        distinguishing_aspect: |
          Mode (b): nested rounding/hashing where order matters. The scaffold pins
          per-page-hash FIRST then concat-then-hash; the forbidden alternative
          (hash-then-concat-then-hash on raw bodies) yields a different digest. Two
          contracts whose variable_values_on_page partitions differ between page 1 and
          page 2 produce different document_fingerprint_sha256 values under the pinned
          order, but identical fingerprints if the per-page partition were ignored.
        test_recipe:
          setup:
            - "Seed Template T1 with TV1: page_count=2, document_blob_sha256=H, signature_positions=[{role_key='A', page=1, ...}, {role_key='B', page=2, ...}], variable_fields=[{name='date', page=1},{name='amount', page=2}]."
            - "Initiator U_init creates Contract Ca with variable_values={'date':'2026-05-10','amount':'100.00'} and Contract Cb with variable_values={'date':'2026-05-11','amount':'100.00'}."
            - "Each contract gets its single SigningStep with one SigningParty."
          trigger:
            - "POST /contracts/{Ca.id}/activate."
            - "POST /contracts/{Cb.id}/activate."
            - "GET /contracts/{Ca.id} and GET /contracts/{Cb.id}."
          assert:
            - "Ca.document_fingerprint_sha256 != Cb.document_fingerprint_sha256 (the date variable lives on page 1, so per-page hash for page 1 differs)."
            - "Both fingerprints are 64-char lowercase hex (immutable post-activation)."
            - "Re-reading Ca after any later mutation (e.g., reminder firing) leaves Ca.document_fingerprint_sha256 unchanged."

      - name: evidence_score_circular_tier_bonus
        grounds:
          - calculations.evidence_strength_score
          - state_machines.EvidencePackage.GENERATING_to_SEALED
          - entities.Contract.fields.evidence_tier
          - entities.Contract.fields.evidence_strength_score
          - entities.EvidencePackage.fields.notary_provider
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where evaluation order is pinned. The
          tier is computed on the FIRST raw pass; only if the first-pass tier is
          NOTARIZED does the formula re-evaluate raw with N replaced by min(100, N+10).
          The bonus does NOT re-tier (no cascading). Two contracts at first-pass
          raw = 89.00 (just below NOTARIZED threshold 90) and raw = 90.00 (exactly at
          threshold) produce different final scores: 89.00 stays GOLD with no bonus,
          while 90.00 becomes NOTARIZED and gets bumped — the bonus is only applied
          conditionally on the first-pass result.
        test_recipe:
          setup:
            - "Seed two contracts C_below and C_at. Both have one SIGNED party with factors=[CA_CERT, BANK_CARD] (I_per_party=100), TimestampToken drift=3s (T=100), document_fingerprint matches (H=100), notary_provider=NOTARY_PUBLIC (N=60)."
            - "Engineer C_below by replacing one factor so I_per_party=90 (CA_CERT only) → I=90. Engineer C_at by leaving I_per_party=100. Adjust notary_provider for C_at to BLOCKCHAIN (N=90)."
            - "More precisely: C_below has I=90,T=100,H=100,N(NOTARY_PUBLIC)=60 → raw_pass1 = 0.30*90+0.30*100+0.20*100+0.20*60 = 27+30+20+12 = 89.00. C_at has I=100,T=100,H=100,N(BLOCKCHAIN)=90 → raw_pass1 = 30+30+20+18 = 98.00."
          trigger:
            - "Drive both contracts to COMPLETED with the engineered factor sets."
            - "Seal both EvidencePackages with their respective notary configs (acted by U_arch)."
            - "GET /contracts/{C_below.id} and GET /contracts/{C_at.id}."
          assert:
            - "C_below: evidence_strength_score == 89.00, evidence_tier == 'GOLD' (no bonus applied; below NOTARIZED threshold)."
            - "C_at: evidence_strength_score == 100.00, evidence_tier == 'NOTARIZED' (bonus applied: N_final = min(100, 90+10) = 100, raw_final = 30+30+20+20 = 100.00)."
            - "If the bonus were applied unconditionally, C_below would score 89.00 + 0.20*(min(100,60+10)-60) = 89.00 + 2.00 = 91.00 (which would tier-promote to NOTARIZED if cascading were allowed) — neither outcome matches the assertion."

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_branching_with_voided_reinitiation
        grounds:
          - state_machines.Contract.PENDING_SIGN_to_VOIDED
          - state_machines.Contract.PARTIALLY_SIGNED_to_VOIDED
          - state_machines.Contract.PARTIALLY_SIGNED_to_COMPLETED
          - state_machines.Contract.PENDING_SIGN_to_COMPLETED
          - entities.Contract.fields.reinitiated_from_contract_id
          - entities.Contract.fields.void_reason
          - endpoints["POST /contracts"]
          - endpoints["POST /contracts/{id}/void"]
        distinguishing_aspect: |
          Branching fork-join on the Contract entity: from PENDING_SIGN there are three
          divergent terminal branches (VOIDED via EXPIRED_AUTO, VOIDED via MANUAL,
          VOIDED via REJECTED_BY_PARTY), each carrying a distinct void_reason side-effect
          set. PENDING_SIGN can also fork forward to COMPLETED (single-party shortcut)
          or PARTIALLY_SIGNED. Re-initiation creates a new Contract whose
          reinitiated_from_contract_id points to a VOIDED predecessor — a self-referential
          edge. Linear A→B→C→D would not exhibit divergent void_reason side-effect sets.
        test_recipe:
          setup:
            - "Seed three independent Contracts C1, C2, C3 in PENDING_SIGN with different SigningParty rosters; each with a single signing step and one party."
          trigger:
            - "C1: advance clock to expires_at and POST /_sweep/run → C1 auto-voids."
            - "C2: POST /contracts/{C2.id}/void with no SIGNED parties → manual void."
            - "C3: POST /signing-parties/{p3.id}/decline → C3 → VOIDED via REJECTED_BY_PARTY."
            - "POST /contracts with reinitiated_from_contract_id=C1.id (re-initiate from voided predecessor)."
          assert:
            - "C1.void_reason == 'EXPIRED_AUTO'; C2.void_reason == 'MANUAL'; C3.void_reason == 'REJECTED_BY_PARTY' — three distinct values."
            - "All three contracts.status == 'VOIDED'; all have voided_at set."
            - "The newly created Contract has reinitiated_from_contract_id == C1.id and status == 'DRAFT'."

      - name: signing_step_diamond_with_branch_skip
        grounds:
          - state_machines.SigningStep.PENDING_to_ACTIVE
          - state_machines.SigningStep.PENDING_to_SKIPPED
          - state_machines.SigningStep.ACTIVE_to_SIGNED
          - state_machines.SigningStep.ACTIVE_to_REJECTED
          - entities.SigningStep.fields.branch_condition
          - entities.SigningStep.fields.mode
        distinguishing_aspect: |
          Branching fork-join on a different entity (SigningStep, not Contract):
          PENDING forks to {ACTIVE, SKIPPED} on branch evaluation, ACTIVE forks to
          {SIGNED, REJECTED} based on aggregate party outcome. Each fork has a distinct
          side-effect set (SKIPPED auto-cascades child parties to SKIPPED and advances
          to next step; REJECTED cascades to Contract void). Two SigningSteps in a
          contract with branch_condition resolving differently on the same evaluation
          produce divergent paths to terminal states.
        test_recipe:
          setup:
            - "Seed Contract C with three steps: S1 (no branch, one party), S2 (branch_condition={variable='amount', op='>=', value=10000, on_false_skip=true}, one party), S3 (no branch, one party). variable_values.amount = 5000 (so branch evaluates false)."
          trigger:
            - "POST /contracts/{C.id}/activate."
            - "Sign S1's party → S1 → SIGNED."
            - "System evaluates S2.branch_condition against amount=5000 → false."
          assert:
            - "S2.status == 'SKIPPED' (PENDING → SKIPPED branch taken); S2.completed_at is set."
            - "S2's child SigningParties cascade to status == 'SKIPPED'."
            - "S3.status == 'ACTIVE' (skipped step advanced flow)."
            - "Contract.status == 'PARTIALLY_SIGNED' (S1 signed, S3 active, no party DECLINED)."

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥ 2 chains, depth ≥3 and ≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: party_signed_to_evidence_generating_depth_4
        grounds:
          - state_machines.SigningParty.AUTHENTICATING_to_SIGNED
          - state_machines.SigningStep.ACTIVE_to_SIGNED
          - state_machines.Contract.PARTIALLY_SIGNED_to_COMPLETED
          - state_machines.Contract.PENDING_SIGN_to_COMPLETED
          - state_machines.EvidencePackage.PENDING_to_GENERATING
          - entities.Contract.fields.completed_at
          - entities.EvidencePackage.fields.status
        distinguishing_aspect: |
          Depth-4 chain originating at POST /signing-parties/{id}/sign:
          SigningParty(AUTHENTICATING→SIGNED) → SigningStep(ACTIVE→SIGNED, caused
          BY the party flip aggregating to all-signed within the step) →
          Contract(PARTIALLY_SIGNED or PENDING_SIGN → COMPLETED, caused BY the step
          flip making all-required-signed aggregate true) → EvidencePackage(PENDING →
          GENERATING, caused BY contract terminal state). Each link is caused by the
          previous link's mutation, not by the original API call.
        test_recipe:
          setup:
            - "Seed Contract C in PENDING_SIGN with one step S1 (PARALLEL_COUNTERSIGN), one party P1."
            - "Pre-create IdentityVerification for P1's signer with factors satisfying required_auth_factors."
          trigger:
            - "POST /signing-parties/{P1.id}/sign with valid TimestampToken (drift <= 5s)."
          assert:
            - "After the single API call: P1.status == 'SIGNED' (hop 1)."
            - "S1.status == 'SIGNED' and S1.completed_at non-null (hop 2, caused by P1 flip aggregating)."
            - "C.status == 'COMPLETED' and C.completed_at non-null (hop 3, caused by S1 flip)."
            - "EvidencePackage(C).status == 'GENERATING' (hop 4, caused by C reaching terminal)."

      - name: party_declined_to_contract_voided_depth_3
        grounds:
          - state_machines.SigningParty.AUTHENTICATING_to_DECLINED
          - state_machines.SigningStep.ACTIVE_to_REJECTED
          - state_machines.Contract.PENDING_SIGN_to_VOIDED
          - state_machines.EvidencePackage.PENDING_to_GENERATING
          - entities.Contract.fields.void_reason
        distinguishing_aspect: |
          Depth-3 chain (≥2 required) from a different trigger
          (POST /signing-parties/{id}/decline, not /sign):
          SigningParty(AUTHENTICATING→DECLINED) → SigningStep(ACTIVE→REJECTED, caused
          by the party flip propagating) → Contract(PENDING_SIGN→VOIDED with
          void_reason=REJECTED_BY_PARTY, caused by the step flip). EvidencePackage
          then transitions PENDING→GENERATING by the same contract-terminal trigger
          as instance 1, exhibiting the same branch from a structurally different
          starting transition (decline vs sign).
        test_recipe:
          setup:
            - "Seed Contract C in PENDING_SIGN with one step S1 (PARALLEL_COUNTERSIGN), two parties P1 (signer U1) and P2 (signer U2). Both required_auth_factors=[SMS]."
            - "Pre-create IdentityVerifications for U1 and U2."
          trigger:
            - "POST /signing-parties/{P1.id}/decline."
          assert:
            - "P1.status == 'DECLINED' (hop 1)."
            - "S1.status == 'REJECTED' (hop 2, caused by P1 decline)."
            - "C.status == 'VOIDED' and C.void_reason == 'REJECTED_BY_PARTY' (hop 3, caused by S1 rejection)."
            - "P2.status == 'SKIPPED' (sibling cascade); EvidencePackage(C).status == 'GENERATING'."

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥ 2 different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_sign
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
          - errors.ERR_AUTH_FACTORS_INSUFFICIENT
          - endpoints["POST /signing-parties/{id}/sign"]
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_referential
          (priority 9, ERR_AUTH_FACTORS_INSUFFICIENT). When a signer attempts to sign
          a party that is in a non-AUTHENTICATING state AND simultaneously presents
          an IdentityVerification missing required_auth_factors, both checks fail.
          The earlier priority MUST win — ERR_INVALID_STATE (or ERR_PARTY_NOT_ACTIVE
          at priority 6 for the granular variant) — never ERR_AUTH_FACTORS_INSUFFICIENT.
        test_recipe:
          setup:
            - "Seed Contract C in DRAFT (NOT activated). Append SigningStep S1 and SigningParty P1 (required_auth_factors=[CA_CERT, BANK_CARD])."
            - "Pre-create IdentityVerification for P1's signer with factors_attempted=[{SMS,PASS}] only (insufficient for required CA_CERT+BANK_CARD)."
          trigger:
            - "POST /signing-parties/{P1.id}/sign as the signer (Contract is DRAFT and party is WAITING; auth is also insufficient)."
          assert:
            - "Response status == 409."
            - "Response error_id == 'ERR_INVALID_STATE' (Contract is DRAFT — state precondition wins)."
            - "Response error_id != 'ERR_AUTH_FACTORS_INSUFFICIENT' (lower-priority check is suppressed)."

      - name: business_safety_vs_business_constraint_on_evidence_seal
        grounds:
          - validations[priority=8]
          - validations[priority=19]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_NOTARY_REFERENCE_REQUIRED
          - endpoints["POST /contracts/{id}/evidence/seal"]
        distinguishing_aspect: |
          Different category pair: business_safety (priority 8, ERR_SEGREGATION_OF_DUTIES)
          vs business_constraint (priority 19, ERR_NOTARY_REFERENCE_REQUIRED). When a
          user who is the same as Contract.initiator_user_id attempts to seal AND
          submits notary_provider=NOTARY_PUBLIC with empty notary_reference, both checks
          fail. The safety/SoD check at priority 8 MUST win, not the missing-reference
          constraint at priority 19.
        test_recipe:
          setup:
            - "Drive Contract C to COMPLETED via the standard cascade with U_init as the initiator."
            - "C's EvidencePackage is in GENERATING."
          trigger:
            - "POST /contracts/{C.id}/evidence/seal with notary_provider=NOTARY_PUBLIC and notary_reference='' (empty), as user U_init (the initiator) — even though U_arch is the proper EvidenceArchivist role assigned to U_init for this test, the SoD rule forbids the initiator from sealing."
          assert:
            - "Response status == 403."
            - "Response error_id == 'ERR_SEGREGATION_OF_DUTIES'."
            - "Response error_id != 'ERR_NOTARY_REFERENCE_REQUIRED'."

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥ 2 different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: contract_expires_at_strict_lt_on_sign
        grounds:
          - validations[priority=11]
          - errors.ERR_CONTRACT_EXPIRED
          - endpoints["POST /signing-parties/{id}/sign"]
          - endpoints["POST /_clock/advance"]
          - entities.Contract.fields.expires_at
        distinguishing_aspect: |
          Numeric/temporal boundary on Contract.expires_at metric, exposed through
          POST /signing-parties/{id}/sign. The check is strict less-than (now() <
          expires_at). At now() == expires_at, sign MUST be rejected; at now() ==
          expires_at - 1ms, sign MUST succeed.
        test_recipe:
          setup:
            - "Drive Contract C to PENDING_SIGN with one party P1; expires_at = '2026-06-01T00:00:00.000Z'. Pre-create valid IdentityVerification for P1's signer."
          trigger:
            - "POST /_clock/advance to '2026-06-01T00:00:00.000Z' exactly."
            - "POST /signing-parties/{P1.id}/sign (call A)."
            - "POST /_clock/advance to '2026-05-31T23:59:59.999Z' is impossible (clock only goes forward); instead replay the scenario in a fresh contract with a later expires_at and sign at expires_at - 1ms (call B)."
          assert:
            - "Call A response status == 409 with error_id == 'ERR_CONTRACT_EXPIRED' (now == expires_at fails strict-less-than)."
            - "Call B response status == 200 (1 ms before expiry succeeds)."

      - name: reminder_due_inclusive_threshold_and_strict_escalation
        grounds:
          - calculations.reminder_due_decision
          - entities.ReminderRule.fields.interval_hours
          - entities.ReminderRule.fields.escalation_after_misses
          - entities.ReminderRule.fields.misses_count
          - endpoints["POST /reminder-rules/{rid}/fire"]
          - endpoints["POST /_clock/advance"]
        distinguishing_aspect: |
          Different metric (misses_count and interval-elapsed) on a different endpoint
          (POST /reminder-rules/{rid}/fire and POST /_sweep/run). The threshold uses
          inclusive >= (firing at exactly threshold_at counts as due), while escalation
          uses strict > (escalation_after_misses=2 means escalation triggers on the 3rd
          miss, NOT on the 2nd). Two boundaries with different operators.
        test_recipe:
          setup:
            - "Seed Contract C in PENDING_SIGN with ReminderRule R: interval_hours=24, escalation_after_misses=2, channels=[SMS], enabled=true. Contract.activated_at = '2026-05-10T00:00:00.000Z'."
          trigger:
            - "Advance clock to '2026-05-11T00:00:00.000Z' (exactly 24h after activation) and POST /_sweep/run → 1st reminder fires (misses_count → 1)."
            - "Advance to '2026-05-12T00:00:00.000Z' and run sweep → 2nd reminder fires (misses_count → 2)."
            - "Advance to '2026-05-13T00:00:00.000Z' and run sweep → 3rd reminder fires (misses_count → 3)."
          assert:
            - "1st ReminderEvent: escalated == false (1 NOT > 2)."
            - "2nd ReminderEvent: escalated == false (2 NOT > 2 — strict greater-than)."
            - "3rd ReminderEvent: escalated == true (3 > 2) and channels_used contains 'INITIATOR_IM'."
            - "All three fires occurred at exactly 24h intervals (>= boundary inclusive — firing at the exact second the threshold is reached)."

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥ 2 different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_activate_requires_template_version_published
        grounds:
          - state_machines.Contract.DRAFT_to_PENDING_SIGN
          - state_machines.TemplateVersion.DRAFT_to_PUBLISHED
          - state_machines.TemplateVersion.PUBLISHED_to_DEPRECATED
          - validations[priority=4]
          - errors.ERR_TEMPLATE_NOT_PUBLISHED
          - endpoints["POST /contracts/{id}/activate"]
        distinguishing_aspect: |
          Pair: Contract → TemplateVersion. Contract's DRAFT → PENDING_SIGN transition
          is gated by TemplateVersion.status == PUBLISHED (the referenced
          template_version_id, not the contract itself). Activation of the same Contract
          succeeds when TV is PUBLISHED and fails when TV has been DEPRECATED before
          activation.
        test_recipe:
          setup:
            - "Seed Template T1 with TV1 PUBLISHED and TV2 DRAFT."
            - "Initiator U_init creates two Contracts: Ca with template_version_id=TV1.id (PUBLISHED), Cb with template_version_id=TV2.id (DRAFT)."
            - "Both contracts have at least one step + party in DRAFT."
          trigger:
            - "POST /contracts/{Ca.id}/activate (TV1 is PUBLISHED)."
            - "POST /contracts/{Cb.id}/activate (TV2 is DRAFT)."
          assert:
            - "Ca: response 200, Ca.status == 'PENDING_SIGN' (cross-entity precondition met)."
            - "Cb: response 409 with error_id == 'ERR_TEMPLATE_NOT_PUBLISHED'."

      - name: signing_party_sign_requires_identity_verification_verified
        grounds:
          - state_machines.SigningParty.AUTHENTICATING_to_SIGNED
          - state_machines.IdentityVerification
          - validations[priority=9]
          - errors.ERR_AUTH_FACTORS_INSUFFICIENT
          - endpoints["POST /signing-parties/{id}/sign"]
          - entities.IdentityVerification.fields.result
        distinguishing_aspect: |
          Different pair: SigningParty → IdentityVerification (a different entity pair
          from instance 1's Contract → TemplateVersion). SigningParty's AUTHENTICATING
          → SIGNED transition requires a referenced IdentityVerification whose
          result=VERIFIED with sufficient factors_passed. With result=FAILED on the
          referenced IV, the same sign call is rejected.
        test_recipe:
          setup:
            - "Drive Contract C to PENDING_SIGN with party P1 (required_auth_factors=[SMS, FACE])."
            - "Create IV1 for P1's signer with factors_attempted=[{SMS,PASS},{FACE,FAIL}] → factors_passed=[SMS], result=FAILED (because real_name_match is true but passed factors don't meet required set)."
            - "Create IV2 for the same signer with factors_attempted=[{SMS,PASS},{FACE,PASS}], real_name_match=true → result=VERIFIED, factors_passed=[SMS,FACE]."
          trigger:
            - "POST /signing-parties/{P1.id}/sign with identity_verification_id=IV1.id (call A)."
            - "POST /signing-parties/{P1.id}/sign with identity_verification_id=IV2.id (call B)."
          assert:
            - "Call A: response 422 with error_id == 'ERR_AUTH_FACTORS_INSUFFICIENT' (referenced IV has result=FAILED or factors_passed insufficient)."
            - "Call B: response 200, P1.status == 'SIGNED'."
            - "P1.identity_verification_id == IV2.id (consumption is recorded)."

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2 different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reminder_idempotency_slot_overlap_inclusive
        grounds:
          - concurrency_rules["Two ReminderRule firings under the same rule with the same idempotency_key"]
          - calculations.reminder_due_decision
          - validations[priority=14]
          - errors.ERR_DUPLICATE_REMINDER
          - entities.ReminderEvent.fields.idempotency_key
          - endpoints["POST /reminder-rules/{rid}/fire"]
        distinguishing_aspect: |
          Interval semantics 1: discrete-slot collision. The reminder occupation of a
          rule is a closed bucket keyed by idempotency_key = "{rule_id}:{epoch_floor}".
          Two POST /fire calls with the SAME idempotency_key collide and the second
          MUST be rejected. Two firings with adjacent (different-slot) idempotency_keys
          both succeed (no overlap on this resource — discrete buckets, not continuous
          intervals).
        test_recipe:
          setup:
            - "Seed ReminderRule R with interval_hours=24."
            - "Activate the parent Contract; advance clock past the first 24h boundary."
          trigger:
            - "POST /reminder-rules/{R.id}/fire with idempotency_key='R:0' (call A)."
            - "POST /reminder-rules/{R.id}/fire with idempotency_key='R:0' (call B, identical key)."
            - "Advance clock another 24h."
            - "POST /reminder-rules/{R.id}/fire with idempotency_key='R:1' (call C, adjacent slot)."
          assert:
            - "Call A: response 201, ReminderEvent created."
            - "Call B: response 409, error_id == 'ERR_DUPLICATE_REMINDER' (same-slot collision)."
            - "Call C: response 201, second ReminderEvent created (adjacent slot, no overlap)."

      - name: signing_party_sign_decline_window_collision
        grounds:
          - concurrency_rules["POST /signing-parties/{id}/sign and POST /signing-parties/{id}/decline arrive concurrently"]
          - state_machines.SigningParty.AUTHENTICATING_to_SIGNED
          - state_machines.SigningParty.AUTHENTICATING_to_DECLINED
          - errors.ERR_INVALID_STATE
          - endpoints["POST /signing-parties/{id}/sign"]
          - endpoints["POST /signing-parties/{id}/decline"]
        distinguishing_aspect: |
          Interval semantics 2: continuous-resource race on a different entity
          (SigningParty, not ReminderRule). Two non-idempotent operations target the
          AUTHENTICATING window of the same SigningParty: only the first writer wins,
          and the second sees a terminal state. Unlike the discrete-slot case, the
          loser is rejected because the AUTHENTICATING interval has been consumed
          atomically — there is no second slot to fall through to.
        test_recipe:
          setup:
            - "Drive Contract C to PENDING_SIGN with party P1 in AUTHENTICATING. Pre-create valid IdentityVerification."
          trigger:
            - "Issue POST /signing-parties/{P1.id}/sign (call A) and POST /signing-parties/{P1.id}/decline (call B) such that both arrive while P1 is in AUTHENTICATING. The server serializes; one wins."
          assert:
            - "Exactly one of {A, B} returns 200; P1.status is the winner's terminal state ('SIGNED' if A, 'DECLINED' if B)."
            - "The loser returns 409 with error_id == 'ERR_INVALID_STATE'."
            - "No ledger drift: TimestampToken count is 1 if A won, 0 if B won (first-writer-wins enforces single-resource consumption)."

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥ 2 different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contract_void_preserves_audit_log_chain
        grounds:
          - state_machines.Contract.PENDING_SIGN_to_VOIDED
          - state_machines.Contract.PARTIALLY_SIGNED_to_VOIDED
          - entities.AuditLog.fields.payload_sha256
          - entities.AuditLog.fields.prev_log_sha256
          - endpoints["POST /contracts/{id}/void"]
          - endpoints["GET /contracts/{id}/audit-logs"]
        distinguishing_aspect: |
          Conserved quantity #1: AuditLog chain integrity per contract — for every
          AuditLog row L_i (i >= 2) in the chain ordered by occurred_at,
          L_i.prev_log_sha256 == L_(i-1).payload_sha256. The forward action
          (POST /contracts/{id}/void) and its compensating bookkeeping (cascading step
          and party state changes, reminder disabling, EvidencePackage transition) MUST
          all append AuditLog entries while preserving the chain. After the void
          completes, the chain invariant holds end-to-end with no missing or rewritten
          links.
        test_recipe:
          setup:
            - "Drive Contract C to PARTIALLY_SIGNED with two steps S1 (signed) and S2 (one party WAITING, one AUTHENTICATING). The chain so far has entries for ACTIVATED and PARTY_SIGNED."
          trigger:
            - "POST /contracts/{C.id}/void (manual void with no SIGNED parties OK; here we ensure status is PARTIALLY_SIGNED so the void path is system-driven via a signing party rejection — POST /signing-parties/{authenticating_p.id}/decline)."
            - "GET /contracts/{C.id}/audit-logs."
          assert:
            - "The list contains entries in occurred_at-ascending order: CONTRACT_ACTIVATED, PARTY_SIGNED, PARTY_REJECTED, CONTRACT_VOIDED (and any cascading sub-events)."
            - "For every i >= 2, log[i].prev_log_sha256 == log[i-1].payload_sha256 (chain unchanged before AND after the void cascade)."
            - "No log payload was rewritten: the payload_sha256 of the pre-void entries matches the digest computed at original recording time."

      - name: contract_completion_preserves_party_signed_count
        grounds:
          - state_machines.SigningParty.AUTHENTICATING_to_SIGNED
          - state_machines.SigningParty.WAITING_to_SKIPPED
          - state_machines.SigningStep.PENDING_to_SKIPPED
          - state_machines.Contract.PARTIALLY_SIGNED_to_COMPLETED
          - calculations.signing_progress_percent
          - entities.Contract.fields.signing_progress_percent
        distinguishing_aspect: |
          Conserved quantity #2 (different from instance 1's audit-log chain): for
          a successful path to COMPLETED, the named global quantity is
          signed_count + skipped_count == total_party_count under the contract.
          Signing one party plus skipping one (via branch_condition=false) plus
          signing the remaining party MUST leave that invariant holding at COMPLETED
          time. A cascade that double-counts a SKIPPED party as both signed AND
          skipped, or a void that drops a party row, breaks the invariant.
        test_recipe:
          setup:
            - "Seed Contract C with three steps: S1 (1 party P1, no branch), S2 (1 party P2, branch_condition that evaluates false → SKIPPED), S3 (1 party P3, no branch). Total parties = 3."
          trigger:
            - "POST /contracts/{C.id}/activate."
            - "Sign P1 → S1 → SIGNED → S2 evaluates branch=false → SKIPPED → S3 → ACTIVE → P3 → AUTHENTICATING."
            - "Sign P3."
            - "GET /contracts/{C.id}."
          assert:
            - "Contract.status == 'COMPLETED', signing_progress_percent == 100.00 (chronological canonical: 2 SIGNED out of 2 included parties; SKIPPED step EXCLUDED)."
            - "Counting raw rows: |SigningParty where status='SIGNED'| == 2, |SigningParty where status='SKIPPED'| == 1, |SigningParty rows| == 3 — invariant 2 + 1 == 3 holds."
            - "No SigningParty row has been deleted; total_party_count is preserved by row count."
