            - "the second QC creation by a different analyst returns 201 and QualityControlReview.${qc935}.outcome == CLEAR"
            - "GET /wholesale-channel/loan-submissions/${l}/quality-control-reviews returns exactly 1 row"

      - name: any_role_can_read_but_no_role_can_read_without_context
        claim_type: RBAC denial
        grounds:
          - roles.Any.shared_operations
          - errors.ERR_MISSING_USER_CONTEXT
        distinguishing_aspect: "Read endpoints admit Any with no ownership filter, so a broker cannot see a foreign borrower through the loan list, and the same list read without headers is refused at priority 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with one submitted loan; Broker B2 submitted with none."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
