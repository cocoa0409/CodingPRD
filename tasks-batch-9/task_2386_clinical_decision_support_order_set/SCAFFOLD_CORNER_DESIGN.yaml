          - errors.ERR_ADHERENCE_VERDICT_UNSUPPORTED
          - errors.ERR_MEASUREMENT_NOT_PROVISIONAL
        distinguishing_aspect: "The verdict gate reads the intention-to-treat variant computed in the finalize request (61.82), not the per-protocol value stored at creation (exactly 70.00), so SUSTAIN is refused with ERR_ADHERENCE_VERDICT_UNSUPPORTED on a measurement whose stored percentage sits exactly on ADHERENCE_SUCCESS_FLOOR."
        test_recipe:
          setup:
            - "A PUBLISHED STANDARD order set against an ACTIVATED vendor release."
