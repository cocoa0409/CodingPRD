              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_v: $.data.version }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION"], winter_application_allowed: false, expected_operation_version: "${op_v}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /cafo/nutrient-plans/${pl_id}/certify"
              payload: {}
