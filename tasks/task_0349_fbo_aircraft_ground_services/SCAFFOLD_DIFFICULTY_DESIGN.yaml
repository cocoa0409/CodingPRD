            - "IntoPlaneTicket.${tk_id}.outcome == RECONCILED"
            - "FuelOrder.${fo_id}.reconciliation_status == RECONCILED"

      - name: fuel_tier_boundary_at_five_thousand_gallons
        grounds:
          - calculations.fuel_order_cost
          - state_machines.FuelOrder.REQUESTED_to_DISPATCHED
          - entities.Operator.fields.jeta_month_cumulative_gallons
        distinguishing_aspect: |
          With operator cumulative at exactly 4999 gal, a 2-gal order prices the
          first gallon at base 520 (tier1, g=4999 < 5000) and the second at 515
          (tier2, g=5000 >= 5000) = 1035 cents, proving the tier ceiling uses `<`
          at 5000. Different metric (cumulative-gallon tier) and endpoint
          (dispatch) than the variance-pct boundary.
        test_recipe:
          setup:
            - "Operator with jeta_month_cumulative_gallons == 4999 (one FUELED 4999-gal order), then a REQUESTED 2-gal order."
          setup_api_calls:
