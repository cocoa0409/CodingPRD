          assert:
            - "Ticket.${ticket_caa}.compare_at_cents == 19998 and compare_at_omitted == false (claim at exactly the gate substantiates)"
            - "Ticket.${ticket_cab}.compare_at_cents is null and compare_at_omitted == true (one cent below the gate omits compare-at, ticket still issued with 201)"
            - "both tickets have ticket_retail_cents == 9999"

      - name: hold_age_bucket_stale_boundary_at_270_days
        claim_type: Correct Result
        grounds:
          - calculations.hold_age_bucket
          - entities.PackawayHold.fields.age_bucket
        distinguishing_aspect: "The STALE threshold is also >=: at 269 days the bucket is AGING, at exactly 270 it is STALE — the second pinned integer boundary of the same calculation."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Seasons SS2027/FW2027 DRAFT. Vendor STANDARD. PACKAWAY lot accepted; hold 1 pallet entered 2026-09-01."
          setup_api_calls:
