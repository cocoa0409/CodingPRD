      - name: certification_depends_on_the_submission_state_of_another_entity
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_20_ERR_IN_OPERATION_DATA_MISSING
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / certification_requires_a_validated_denial_rates_submission_on_the_classification"
          rationale: "The refuse-then-permit pair around a VALIDATED DENIAL_RATES submission is asserted end-to-end there."

      - name: state_freeze_outranks_the_temporal_overlap_rule
        claim_type: Priority Ordering
        grounds:
          - validations.priority_15_ERR_PLAN_YEAR_NOT_OPEN
          - validations.priority_28_ERR_MEASUREMENT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_priority_15_beats_temporal_priority_28_on_classification_create"
          rationale: "That instance violates both rules with one payload and proves the temporal rule was live via a control plan year."

