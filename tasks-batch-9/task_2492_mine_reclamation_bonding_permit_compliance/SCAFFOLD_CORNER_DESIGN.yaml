        distinguishing_aspect: "Nominating an H1_EXTREME site with public_safety 80, water_quality 60 and 90 affected acres yields legacy_priority_score 90.50 = 50 + 24.00 + 12.00 + 4.50."
        test_recipe:
          setup:
            - "One MineSite created with site_class ABANDONED_LEGACY and funding_status NOT_APPLICABLE, which admits nomination."
          setup_api_calls:
            - call: "POST /mining/mine-sites"
              payload: { name: "Cinder Hollow Legacy Workings", county: "Fremont", total_acres: 400.00, site_class: "ABANDONED_LEGACY" }
              as: ProgramDirector
              captures: { c_lsite1_id: $.data.id }
          trigger:
            - call: "POST /mining/mine-sites/${c_lsite1_id}/nominate-legacy"
              payload: { hazard_class: "H1_EXTREME", public_safety_score: 80, water_quality_score: 60, acres_affected: 90.00, unfunded_reclamation_need: 1200000.00 }
              as: ProgramDirector
          assert:
            - "MineSite.${c_lsite1_id}.legacy_priority_score == 90.50 (50 hazard + 80*0.30 + 60*0.20 + min(90*0.05, 15))"
            - "MineSite.${c_lsite1_id}.funding_status == NOMINATED and site_class == ABANDONED_LEGACY"
            - "MineSite.${c_lsite1_id}.unfunded_reclamation_need == 1200000.00 and awarded_funding_amount == 0.00"

