scenario: |
  Generate task harder than expert level!

  2617. Residential Earthquake Coverage & Mitigation Incentive Program (California Earthquake
  Authority style residual insurer): policy availability through participating insurers with
  mandatory offer requirements, deductible options as a percentage of dwelling limits with
  coverage sublimits for contents and loss of use, hazard-based rating by soil, structure type,
  age and retrofit status, retrofit grant program eligibility, contractor certification and
  inspection verification, premium discount application upon documented retrofit, claim
  adjustment for structural versus cosmetic damage and deductible application, catastrophe
  capacity, reinsurance and post-event assessment mechanisms, public education and take-up rate
  campaigns
domain_name: residential-earthquake-coverage-mitigation
api_prefix: "/eqp"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under /eqp; parent linkage is
  # expressed exclusively through FK fields in request bodies and discovered through filtered-list
  # GETs. No entity is nested inside another entity's URL path.

  state_machine_shape: parallel
  # Policy carries two independent state dimensions (lifecycle_status x mitigation_status) that
  # advance on disjoint triggers; Claim likewise (adjustment_status x payment_status). Both
  # dimensions additionally contain cycles (Policy.lifecycle ACTIVE->ACTIVE on renew,
  # Policy.mitigation DISCOUNT_APPLIED->UNMITIGATED on revoke, RetrofitGrant
  # UNDER_REVIEW->RETURNED_FOR_INFO->SUBMITTED->UNDER_REVIEW, RetrofitProject
  # AWAITING_INSPECTION->REWORK_REQUIRED->IN_PROGRESS->AWAITING_INSPECTION).

  relationship_patterns:
    - one_to_many        # ParticipatingInsurer -> Policy, GrantCycle -> RetrofitGrant, CatastropheEvent -> Claim
    - many_to_many       # AssessmentAllocation is the junction of CatastropheEvent x ParticipatingInsurer
    - cross_aggregate    # Inspection result mutates Dwelling, RetrofitGrant, GrantCycle and Policy across aggregates
    - polymorphic: false

  role_model: segregation_of_duties
  # Two enforced separations tracked on X-User-ID: the GrantReviewer who APPROVEd a RetrofitGrant
  # may not be the GrantReviewer who reserves its funds; the ClaimAdjuster who produced the
  # provisional adjustment may not be the ClaimAdjuster who finalizes it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Policyholder
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the residential owner-occupant
      - name: email
        type: string
        source: input
        description: contact address used for public-education outreach targeting
        constraints: unique across Policyholder
      - name: county_code
        type: string
        source: input
        description: five-character county code of the mailing address
      - name: outreach_campaign_code
        type: string
        source: input
        default: "NONE"
        description: public-education campaign that produced this record; recorded for take-up reporting
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: registry status of the policyholder
        constraints: "ACTIVE | INACTIVE"

  - name: ParticipatingInsurer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the participating residential insurer
      - name: naic_code
        type: string
        source: input
        description: five-digit NAIC company code
        constraints: unique across ParticipatingInsurer
      - name: market_share_pct
        type: number
        source: input
        description: residential market share in percent; the sole allocation basis for post-event assessments
        constraints: "0 <= market_share_pct <= 100, at most 2 decimal places"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: participation status in the residual-insurer program
        constraints: "ACTIVE | WITHDRAWN"
      - name: compliance_status
        type: enum
        source: system
        default: COMPLIANT
        description: mandatory-offer compliance posture, written by take_up_rate_evaluation and by compliance actions
        constraints: "COMPLIANT | UNDER_REVIEW | SANCTIONED"
      - name: offers_recorded_count
        type: integer
        source: computed
        default: 0
        description: count of MandatoryOffer rows whose insurer_id is this insurer, in any status
      - name: undocumented_decline_count
        type: integer
        source: computed
        default: 0
        description: count of MandatoryOffer rows for this insurer with status DECLINED and decline_documented false
      - name: last_take_up_rate_bp
        type: integer
        source: computed
        default: 0
        description: take-up rate in basis points from the most recent take_up_rate_evaluation run
      - name: assessment_balance_cents
        type: integer
        source: computed
        default: 0
        description: cumulative sum of AssessmentAllocation.assessed_cents levied on this insurer
      - name: policies_bound_count
        type: integer
        source: computed
        default: 0
        description: count of Policy rows for this insurer whose lifecycle_status has ever reached ACTIVE

  - name: Dwelling
    parent: null
    common_fields: true
    fields:
      - name: policyholder_id
        type: string
        source: input
        description: "FK -> Policyholder.id; owner-occupant of this dwelling"
      - name: street_address
        type: string
        source: input
        description: street address of the insured structure
      - name: county_hazard_tier
        type: enum
        source: input
        description: seismic hazard tier of the county, drives BASE_RATE_PER_1000
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: soil_class
        type: enum
        source: input
        description: site soil classification from the geotechnical screen
        constraints: "ROCK | STIFF | SOFT | LIQUEFACTION"
      - name: structure_type
        type: enum
        source: input
        description: construction type of the dwelling
        constraints: "WOOD_FRAME_SLAB | WOOD_FRAME_CRIPPLE_WALL | MASONRY_URM | MOBILE_HOME"
      - name: year_built
        type: integer
        source: input
        description: year of original construction; 1979 and earlier is pre-code
        constraints: "1850 <= year_built <= 2026"
      - name: dwelling_limit_cents
        type: integer
        source: input
        description: Coverage A dwelling limit in cents; the exposure base for rating and deductible
        constraints: "5000000 <= dwelling_limit_cents <= 300000000"
      - name: retrofit_status
        type: enum
        source: system
        default: NONE
        description: mitigation posture of the structure; VERIFIED only via a passed Inspection
        constraints: "NONE | SELF_DECLARED | VERIFIED"
      - name: verified_retrofit_scope
        type: enum
        source: system
        default: NONE
        description: scope code of the retrofit currently claimed for this dwelling - written by a Policyholder self-attestation and overwritten by an inspection PASS; NONE until one of those happens
        constraints: "NONE | CRIPPLE_WALL_BRACING | EARTHQUAKE_BRACING_SYSTEM | ANCHOR_BOLT_ONLY"
      - name: grant_lifetime_count
        type: integer
        source: computed
        default: 0
        description: count of RetrofitGrant rows for this dwelling that reached FUNDS_RESERVED or beyond

  - name: MandatoryOffer
    parent: null
    common_fields: true
    fields:
      - name: insurer_id
        type: string
        source: input
        description: "FK -> ParticipatingInsurer.id; insurer discharging the mandatory-offer duty"
      - name: policyholder_id
        type: string
        source: input
        description: "FK -> Policyholder.id; recipient of the offer"
      - name: dwelling_id
        type: string
        source: input
        description: "FK -> Dwelling.id; structure the offer covers"
      - name: offered_at
        type: datetime
        source: system
        description: logical-clock instant at which the offer was recorded
      - name: expires_at
        type: datetime
        source: system
        description: offered_at plus OFFER_VALID_DAYS (60); after this instant the offer may be expired
      - name: status
        type: enum
        source: system
        default: PENDING
        description: response state of the mandatory offer
        constraints: "PENDING | ACCEPTED | DECLINED | EXPIRED"
      - name: decline_documented
        type: boolean
        source: input
        default: false
        description: true when the policyholder's written decline was captured; false declines feed the sanction counter
      - name: offer_round
        type: integer
        source: system
        default: 1
        description: number of times this offer row has been (re)issued; incremented on reoffer
      - name: campaign_code
        type: string
        source: input
        default: "NONE"
        description: public-education campaign attributed to this offer
      - name: responded_at
        type: datetime
        source: system
        description: logical-clock instant of the ACCEPTED or DECLINED response; null while PENDING

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: dwelling_id
        type: string
        source: input
        description: "FK -> Dwelling.id; rated structure"
      - name: insurer_id
        type: string
        source: input
        description: "FK -> ParticipatingInsurer.id; participating insurer that produced the quote"
      - name: policyholder_id
        type: string
        source: computed
        description: "FK -> Policyholder.id; copied from Dwelling.policyholder_id at quote time"
      - name: accepted_offer_id
        type: string
        source: input
        description: "FK -> MandatoryOffer.id; the offer whose ACCEPTED status authorises binding"
      - name: deductible_pct
        type: integer
        source: input
        description: deductible as a percentage of dwelling_limit_cents
        constraints: "one of 5 | 10 | 15 | 20 | 25"
      - name: contents_sublimit_cents
        type: integer
        source: input
        description: Coverage C sublimit in cents
        constraints: "contents_sublimit_cents > 0 and <= the named Dwelling's dwelling_limit_cents (a larger value is ERR_SUBLIMIT_EXCEEDS_LIMIT at priority 74)"
      - name: loss_of_use_sublimit_cents
        type: integer
        source: input
        description: Coverage D loss-of-use sublimit in cents
        constraints: "loss_of_use_sublimit_cents > 0 and <= the named Dwelling's dwelling_limit_cents (a larger value is ERR_SUBLIMIT_EXCEEDS_LIMIT at priority 74)"
      - name: rated_dwelling_limit_cents
        type: integer
        source: computed
        description: snapshot of Dwelling.dwelling_limit_cents pinned at quote time; the deductible basis for every claim on this term
      - name: base_premium_cents
        type: integer
        source: computed
        description: output of hazard_base_premium for the current term; excludes any mid-term mitigation discount
      - name: rating_variant
        type: enum
        source: computed
        default: QUOTE_TIME
        description: which hazard_base_premium variant produced base_premium_cents for the current term
        constraints: "QUOTE_TIME | RENEWAL_TIME"
      - name: mitigation_discount_cents
        type: integer
        source: computed
        default: 0
        description: output of mitigation_discount_application; reset to 0 on renew and on revoke
      - name: annual_premium_cents
        type: integer
        source: computed
        description: base_premium_cents minus mitigation_discount_cents; the billed premium
      - name: prorated_credit_cents
        type: integer
        source: computed
        default: 0
        description: unearned portion of mitigation_discount_cents credited when the discount is applied mid-term
      - name: lifecycle_status
        type: enum
        source: system
        default: QUOTED
        description: coverage lifecycle dimension of the policy
        constraints: "QUOTED | ACTIVE | LAPSED | CANCELLED | QUOTE_EXPIRED"
      - name: mitigation_status
        type: enum
        source: system
        default: UNMITIGATED
        description: retrofit-incentive dimension of the policy, independent of lifecycle_status
        constraints: "UNMITIGATED | RETROFIT_PENDING | RETROFIT_VERIFIED | DISCOUNT_APPLIED"
      - name: quote_expires_at
        type: datetime
        source: system
        description: created_at plus QUOTE_VALID_DAYS (30); binding after this instant is refused
      - name: effective_at
        type: datetime
        source: system
        description: logical-clock instant of binding; null while QUOTED
      - name: expires_at
        type: datetime
        source: system
        description: effective_at plus TERM_DAYS (365); null while QUOTED
      - name: term_number
        type: integer
        source: system
        default: 1
        description: incremented on every renew; term 1 is the bound original term

  - name: GrantCycle
    parent: null
    common_fields: true
    fields:
      - name: program_track
        type: enum
        source: input
        description: funding track of this cycle; windows may not overlap within a track
        constraints: "BRACE_AND_BOLT | MOBILE_HOME | SOFT_STORY"
      - name: label
        type: string
        source: input
        description: human label of the cycle, e.g. "2026 Fall"
      - name: opens_at
        type: datetime
        source: input
        description: inclusive start of the application window
      - name: closes_at
        type: datetime
        source: input
        description: inclusive end of the application window
      - name: total_pool_cents
        type: integer
        source: input
        description: total appropriated funding for the cycle in cents
        constraints: "total_pool_cents >= 100000"
      - name: reserved_cents
        type: integer
        source: computed
        default: 0
        description: sum of approved_amount_cents over this cycle's grants in status FUNDS_RESERVED
      - name: disbursed_cents
        type: integer
        source: computed
        default: 0
        description: sum of approved_amount_cents over this cycle's grants in status VERIFIED_COMPLETE
      - name: uncommitted_cents
        type: integer
        source: computed
        description: total_pool_cents minus reserved_cents minus disbursed_cents; the pool conservation residual
      - name: status
        type: enum
        source: system
        default: OPEN
        description: cycle status; CLOSED refuses new applications and new reservations
        constraints: "OPEN | CLOSED"

  - name: RetrofitGrant
    parent: null
    common_fields: true
    fields:
      - name: dwelling_id
        type: string
        source: input
        description: "FK -> Dwelling.id; structure to be retrofitted"
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the in-force policy that makes the dwelling grant-eligible"
      - name: grant_cycle_id
        type: string
        source: input
        description: "FK -> GrantCycle.id; funding cycle applied against"
      - name: income_tier
        type: enum
        source: input
        description: verified household income tier; selects the match percentage and the sub-pool
        constraints: "TIER_LOW | TIER_MID | TIER_ANY"
      - name: project_cost_estimate_cents
        type: integer
        source: input
        description: contractor estimate for the eligible retrofit scope in cents
        constraints: "project_cost_estimate_cents > 0"
      - name: requested_scope
        type: enum
        source: input
        description: retrofit scope the applicant intends to perform
        constraints: "CRIPPLE_WALL_BRACING | EARTHQUAKE_BRACING_SYSTEM | ANCHOR_BOLT_ONLY"
      - name: approved_amount_cents
        type: integer
        source: computed
        default: 0
        description: output of grant_award_amount, written on the APPROVE review decision
      - name: funded_from_bucket
        type: enum
        source: computed
        default: NONE
        description: which sub-pool the reservation drew from, per grant_pool_waterfall
        constraints: "NONE | TIER_LOW | TIER_MID | TIER_ANY"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: grant application state
        constraints: "SUBMITTED | UNDER_REVIEW | RETURNED_FOR_INFO | APPROVED | FUNDS_RESERVED | VERIFIED_COMPLETE | DENIED | WITHDRAWN"
      - name: review_round
        type: integer
        source: system
        default: 0
        description: incremented each time the grant enters UNDER_REVIEW; caps the revision cycle at MAX_REVIEW_ROUNDS
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the GrantReviewer who recorded the APPROVE decision; segregation-of-duties basis
      - name: reserved_by_user_id
        type: string
        source: system
        description: X-User-ID of the GrantReviewer who reserved the funds; must differ from approved_by_user_id
      - name: denial_reason
        type: string
        source: input
        default: ""
        description: free-text reason recorded on a DENY or RETURN decision

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: licensed business name
      - name: license_no
        type: string
        source: input
        description: state contractor license number
        constraints: unique across Contractor
      - name: certified_scopes
        type: array
        source: input
        description: retrofit scope codes this contractor is certified to perform
        constraints: "non-empty subset of {CRIPPLE_WALL_BRACING, EARTHQUAKE_BRACING_SYSTEM, ANCHOR_BOLT_ONLY}"
      - name: certification_status
        type: enum
        source: system
        default: CERTIFIED
        description: program certification posture; only CERTIFIED may start work
        constraints: "CERTIFIED | PROBATION | SUSPENDED"
      - name: certification_expires_at
        type: datetime
        source: input
        description: expiry instant of the certification; work start after this instant is refused
      - name: open_project_count
        type: integer
        source: computed
        default: 0
        description: count of RetrofitProject rows for this contractor in status SCHEDULED, IN_PROGRESS, AWAITING_INSPECTION or REWORK_REQUIRED
      - name: failed_inspection_count
        type: integer
        source: computed
        default: 0
        description: count of Inspection rows for this contractor with result FAIL

  - name: RetrofitProject
    parent: null
    common_fields: true
    fields:
      - name: grant_id
        type: string
        source: input
        description: "FK -> RetrofitGrant.id; the reserved grant funding this project"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; certified contractor performing the scope"
      - name: scope_code
        type: enum
        source: computed
        description: copied from RetrofitGrant.requested_scope at project creation
        constraints: "CRIPPLE_WALL_BRACING | EARTHQUAKE_BRACING_SYSTEM | ANCHOR_BOLT_ONLY"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: project execution state; cycles through REWORK_REQUIRED on a failed inspection
        constraints: "SCHEDULED | IN_PROGRESS | AWAITING_INSPECTION | REWORK_REQUIRED | VERIFIED | ABANDONED"
      - name: inspection_attempts
        type: integer
        source: computed
        default: 0
        description: count of Inspection rows for this project whose result is not PENDING
      - name: started_at
        type: datetime
        source: system
        description: logical-clock instant work started; null while SCHEDULED
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant the verifying PASS inspection was recorded; null otherwise

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RetrofitProject.id; project being inspected"
      - name: contractor_id
        type: string
        source: computed
        description: "FK -> Contractor.id; copied from RetrofitProject.contractor_id; the calendar resource for overlap checks"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the inspection appointment window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the inspection appointment window
      - name: result
        type: enum
        source: system
        default: PENDING
        description: verification outcome; PENDING windows are the only ones that occupy the contractor calendar
        constraints: "PENDING | PASS | FAIL | PARTIAL"
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the FieldInspector who recorded the result; null while PENDING
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant the result was recorded; null while PENDING
      - name: deficiency_note
        type: string
        source: input
        default: ""
        description: free-text note recorded with a FAIL or PARTIAL result

  - name: CatastropheEvent
    parent: null
    common_fields: true
    fields:
      - name: event_code
        type: string
        source: input
        description: program identifier of the earthquake event
        constraints: unique across CatastropheEvent
      - name: magnitude
        type: number
        source: input
        description: moment magnitude of the event
        constraints: "4.0 <= magnitude <= 9.5, one decimal place"
      - name: epicenter_county_code
        type: string
        source: input
        description: five-character county code of the epicenter; drives the binding moratorium scope
      - name: occurred_at
        type: datetime
        source: input
        description: instant the earthquake occurred; must not be after the logical clock
      - name: treaty_year
        type: integer
        source: computed
        description: calendar year of occurred_at; selects the ReinsuranceLayer set for the waterfall
      - name: retention_cents
        type: integer
        source: input
        description: the program's own retention below the first reinsurance attachment point
        constraints: "retention_cents >= 0"
      - name: status
        type: enum
        source: system
        default: MONITORING
        description: catastrophe response state
        constraints: "MONITORING | DECLARED | LOSS_AGGREGATION | CAPACITY_EXHAUSTED | ASSESSMENT_LEVIED | CLOSED"
      - name: aggregate_incurred_cents
        type: integer
        source: computed
        default: 0
        description: sum of Claim.final_payable_cents over this event's claims in adjustment_status FINAL_ADJUSTED or CLOSED
      - name: retained_cents
        type: integer
        source: computed
        default: 0
        description: min(aggregate_incurred_cents, retention_cents), recomputed by event_loss_waterfall
      - name: ceded_total_cents
        type: integer
        source: computed
        default: 0
        description: sum of ReinsuranceLayer.ceded_cents for this event's treaty_year after event_loss_waterfall
      - name: uncovered_cents
        type: integer
        source: computed
        default: 0
        description: aggregate_incurred_cents minus retained_cents minus ceded_total_cents, floored at 0
      - name: assessment_shortfall_cents
        type: integer
        source: computed
        default: 0
        description: uncovered_cents snapshot pinned when the assessment is levied
      - name: admin_loading_cents
        type: integer
        source: computed
        default: 0
        description: administrative loading added to the shortfall, per post_event_assessment
      - name: assessment_total_cents
        type: integer
        source: computed
        default: 0
        description: assessment_shortfall_cents plus admin_loading_cents; must equal the sum of allocations
      - name: claim_count
        type: integer
        source: computed
        default: 0
        description: count of Claim rows whose event_id is this event, in any adjustment_status

  - name: ReinsuranceLayer
    parent: null
    common_fields: true
    fields:
      - name: treaty_year
        type: integer
        source: input
        description: treaty year this layer belongs to; matched against CatastropheEvent.treaty_year
      - name: layer_index
        type: integer
        source: input
        description: waterfall position of the layer, ascending from 1; unique per treaty_year
        constraints: "layer_index >= 1, unique per (treaty_year, layer_index)"
      - name: attachment_point_cents
        type: integer
        source: input
        description: gross incurred loss at which this layer begins to respond
        constraints: "attachment_point_cents >= 0"
      - name: limit_cents
        type: integer
        source: input
        description: width of the layer in cents
        constraints: "limit_cents > 0"
      - name: ceded_pct
        type: number
        source: input
        description: fraction of the layer exposure ceded to reinsurers
        constraints: "0 < ceded_pct <= 1, at most 2 decimal places"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: only ACTIVE layers participate in event_loss_waterfall
        constraints: "ACTIVE | LAPSED"
      - name: ceded_cents
        type: integer
        source: computed
        default: 0
        description: cession produced by the most recent event_loss_waterfall run against this layer

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; policy under which the loss is claimed"
      - name: event_id
        type: string
        source: input
        description: "FK -> CatastropheEvent.id; declared earthquake event causing the loss"
      - name: structural_damage_cents
        type: integer
        source: input
        description: adjuster-verified structural damage to the dwelling in cents
        constraints: "structural_damage_cents >= 0"
      - name: cosmetic_damage_cents
        type: integer
        source: input
        description: cosmetic-only damage in cents; enters the loss basis solely under the FINAL variant
        constraints: "cosmetic_damage_cents >= 0"
      - name: contents_damage_cents
        type: integer
        source: input
        description: Coverage C contents damage in cents before the sublimit
        constraints: "contents_damage_cents >= 0"
      - name: loss_of_use_cents
        type: integer
        source: input
        description: Coverage D loss-of-use expense in cents before the sublimit
        constraints: "loss_of_use_cents >= 0"
      - name: deductible_applied_cents
        type: integer
        source: computed
        default: 0
        description: round_half_up(Policy.rated_dwelling_limit_cents * Policy.deductible_pct / 100)
      - name: dwelling_part_cents
        type: integer
        source: computed
        default: 0
        description: Coverage A share of the settlement under the currently effective variant
      - name: contents_part_cents
        type: integer
        source: computed
        default: 0
        description: Coverage C share of the settlement under the currently effective variant
      - name: loss_of_use_part_cents
        type: integer
        source: computed
        default: 0
        description: Coverage D share of the settlement; never reduced by the deductible
      - name: provisional_payable_cents
        type: integer
        source: computed
        default: 0
        description: output of claim_settlement variant PROVISIONAL
      - name: final_payable_cents
        type: integer
        source: computed
        default: 0
        description: output of claim_settlement variant FINAL; 0 until the adjustment is finalized
      - name: payable_cents
        type: integer
        source: computed
        default: 0
        description: final_payable_cents when adjustment_status is FINAL_ADJUSTED or CLOSED, else provisional_payable_cents
      - name: paid_cents
        type: integer
        source: computed
        default: 0
        description: cumulative recorded payments in cents; never exceeds payable_cents
      - name: adjustment_status
        type: enum
        source: system
        default: FNOL_RECEIVED
        description: adjustment dimension of the claim
        constraints: "FNOL_RECEIVED | PROVISIONAL_ADJUSTED | FINAL_ADJUSTED | CLOSED | DENIED"
      - name: payment_status
        type: enum
        source: system
        default: UNPAID
        description: payment dimension of the claim, independent of adjustment_status
        constraints: "UNPAID | PARTIALLY_PAID | PAID | WRITTEN_OFF"
      - name: provisional_adjuster_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimAdjuster who produced the provisional adjustment
      - name: final_adjuster_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimAdjuster who finalized; must differ from provisional_adjuster_user_id
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: number of times the claim has been reopened from FINAL_ADJUSTED
      - name: denial_reason
        type: string
        source: input
        default: ""
        description: free-text reason recorded when the claim is denied

  - name: AssessmentAllocation
    parent: null
    common_fields: false
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> CatastropheEvent.id; the event whose shortfall is being assessed"
      - name: insurer_id
        type: string
        source: input
        description: "FK -> ParticipatingInsurer.id; the assessed participating insurer"
      - name: market_share_pct_snapshot
        type: number
        source: computed
        description: insurer market_share_pct captured at levy time; the allocation basis
      - name: assessed_cents
        type: integer
        source: computed
        description: this insurer's share of CatastropheEvent.assessment_total_cents
      - name: allocation_rank
        type: integer
        source: computed
        description: 1-based position in the levy order (market_share_pct DESC, then created_at ASC)
      - name: absorbs_remainder
        type: boolean
        source: computed
        description: true for the last-ranked allocation, which absorbs the rounding residual

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
#   Policy and Claim each carry TWO independent state dimensions; each dimension
#   is declared as its own entry with an explicit `state_field:`.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Policy
    state_field: lifecycle_status
    initial_state: QUOTED
    terminal_states: [LAPSED, CANCELLED, QUOTE_EXPIRED]
    transitions:
      - from: QUOTED
        to: ACTIVE
        trigger: "POST /eqp/policies/{id}/bind"
        actor: ParticipatingInsurer
        preconditions:
          - "policy.lifecycle_status == QUOTED"
          - "clock_now <= policy.quote_expires_at (else ERR_QUOTE_EXPIRED)"
          - "MandatoryOffer[policy.accepted_offer_id].status == ACCEPTED (else ERR_MANDATORY_OFFER_NOT_ACCEPTED)"
          - "ParticipatingInsurer[policy.insurer_id].status == ACTIVE and compliance_status IN {COMPLIANT, UNDER_REVIEW} (else ERR_INSURER_SANCTIONED)"
          - "no other Policy with the same dwelling_id has lifecycle_status == ACTIVE (else ERR_DUPLICATE_ACTIVE_POLICY)"
          - "no CatastropheEvent with status IN {DECLARED, LOSS_AGGREGATION, CAPACITY_EXHAUSTED, ASSESSMENT_LEVIED} satisfies epicenter_county_code == Policyholder[policy.policyholder_id].county_code AND clock_now < occurred_at + MORATORIUM_DAYS (else ERR_BINDING_MORATORIUM)"
        side_effects:
          - "policy.effective_at = clock_now"
          - "policy.expires_at = clock_now + TERM_DAYS (365 days)"
          - "policy.rated_dwelling_limit_cents = Dwelling[policy.dwelling_id].dwelling_limit_cents (term snapshot; every claim deductible on this term uses the snapshot, not the live dwelling field)"
          - "ParticipatingInsurer[policy.insurer_id].policies_bound_count += 1"
          - "policy.version += 1"
        note: "base_premium_cents / annual_premium_cents were already computed at quote time by hazard_base_premium variant QUOTE_TIME; bind does not re-rate."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /eqp/policies/{id}/renew"
        actor: ParticipatingInsurer
        preconditions:
          - "policy.lifecycle_status == ACTIVE"
          - "clock_now >= policy.expires_at - RENEWAL_WINDOW_DAYS (45 days) and clock_now < policy.expires_at (else ERR_RENEWAL_WINDOW_NOT_OPEN)"
          - "ParticipatingInsurer[policy.insurer_id].compliance_status != SANCTIONED (else ERR_INSURER_SANCTIONED)"
          - "MandatoryOffer[policy.accepted_offer_id].status == ACCEPTED (a re-offer that has been sent back to PENDING must be re-accepted before the term rolls; else ERR_MANDATORY_OFFER_NOT_ACCEPTED)"
        side_effects:
          - "policy.term_number += 1"
          - "policy.effective_at = previous policy.expires_at; policy.expires_at = previous expires_at + TERM_DAYS"
          - "policy.rated_dwelling_limit_cents re-snapshotted from Dwelling.dwelling_limit_cents"
          - "policy.base_premium_cents recomputed by hazard_base_premium variant RENEWAL_TIME; policy.rating_variant = RENEWAL_TIME"
          - "policy.mitigation_discount_cents = 0 and policy.prorated_credit_cents = 0 (the mid-term discount channel is closed; a verified retrofit is reflected through the RENEWAL_TIME retrofit_factor instead, so the two channels never stack)"
          - "policy.annual_premium_cents = policy.base_premium_cents"
          - "if policy.mitigation_status == DISCOUNT_APPLIED then policy.mitigation_status = RETROFIT_VERIFIED"
          - "policy.version += 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /eqp/policies/{id}/cancel"
        actor: Policyholder | ParticipatingInsurer
        preconditions:
          - "policy.lifecycle_status == ACTIVE"
          - "acting Policyholder's X-User-ID == policy.policyholder_id, or acting ParticipatingInsurer's X-User-ID == policy.insurer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "conditional cascade: every RetrofitGrant with policy_id == policy.id and status IN {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED} transitions to WITHDRAWN; grants already in FUNDS_RESERVED or VERIFIED_COMPLETE are left untouched because their funds are committed"
          - "policy.mitigation_status is NOT changed by cancellation"
          - "policy.version += 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /eqp/policies/{id}/lifecycle-action with action=LAPSE"
        actor: ProgramAdmin
        preconditions:
          - "policy.lifecycle_status == ACTIVE"
        side_effects:
          - "same conditional grant cascade as cancellation (pre-reservation grants WITHDRAWN, reserved grants untouched)"
          - "policy.version += 1"
      - from: QUOTED
        to: QUOTE_EXPIRED
        trigger: "POST /eqp/policies/{id}/lifecycle-action with action=EXPIRE_QUOTE"
        actor: ProgramAdmin
        preconditions:
          - "policy.lifecycle_status == QUOTED"
          - "clock_now > policy.quote_expires_at (else ERR_QUOTE_STILL_VALID)"
        side_effects:
          - "policy.version += 1"

  - entity: Policy
    state_field: mitigation_status
    initial_state: UNMITIGATED
    terminal_states: []
    transitions:
      - from: UNMITIGATED
        to: RETROFIT_PENDING
        trigger: "system: cascade from RetrofitGrant APPROVED -> FUNDS_RESERVED (POST /eqp/retrofit-grants/{id}/reserve-funds)"
        actor: system
        preconditions:
          - "policy.id == RetrofitGrant.policy_id"
          - "policy.lifecycle_status == ACTIVE"
          - "policy.mitigation_status == UNMITIGATED"
        side_effects:
          - "policy.version += 1"
      - from: RETROFIT_PENDING
        to: UNMITIGATED
        trigger: "system: cascade from RetrofitGrant FUNDS_RESERVED -> WITHDRAWN (POST /eqp/retrofit-grants/{id}/withdraw)"
        actor: system
        preconditions:
          - "policy.mitigation_status == RETROFIT_PENDING"
        side_effects:
          - "policy.version += 1"
      - from: RETROFIT_PENDING
        to: RETROFIT_VERIFIED
        trigger: "system: cascade from Dwelling.retrofit_status -> VERIFIED, itself caused by RetrofitProject AWAITING_INSPECTION -> VERIFIED (POST /eqp/inspections/{id}/record-result with result=PASS)"
        actor: system
        preconditions:
          - "policy.mitigation_status == RETROFIT_PENDING"
          - "Dwelling[policy.dwelling_id].retrofit_status == VERIFIED"
        side_effects:
          - "policy.version += 1"
      - from: RETROFIT_VERIFIED
        to: DISCOUNT_APPLIED
        trigger: "system: continuation of the same PASS cascade, immediately after RETROFIT_PENDING -> RETROFIT_VERIFIED"
        actor: system
        preconditions:
          - "policy.mitigation_status == RETROFIT_VERIFIED"
          - "policy.lifecycle_status == ACTIVE (a LAPSED or CANCELLED policy stops at RETROFIT_VERIFIED and receives no discount)"
        side_effects:
          - "mitigation_discount_application runs: policy.mitigation_discount_cents, policy.annual_premium_cents and policy.prorated_credit_cents are written"
          - "policy.version += 1"
      - from: DISCOUNT_APPLIED
        to: UNMITIGATED
        trigger: "POST /eqp/policies/{id}/revoke-mitigation-discount"
        actor: ProgramAdmin
        preconditions:
          - "policy.mitigation_status == DISCOUNT_APPLIED (else ERR_NO_MITIGATION_DISCOUNT)"
        side_effects:
          - "policy.mitigation_discount_cents = 0; policy.prorated_credit_cents = 0; policy.annual_premium_cents = policy.base_premium_cents (exact restoration - see compensating invariant premium_ledger_conservation)"
          - "Dwelling.retrofit_status is deliberately NOT reverted: the physical verification stands, only the pricing incentive is withdrawn"
          - "policy.version += 1"
      - from: DISCOUNT_APPLIED
        to: RETROFIT_VERIFIED
        trigger: "system: cascade from POST /eqp/policies/{id}/renew"
        actor: system
        preconditions:
          - "policy.mitigation_status == DISCOUNT_APPLIED"
        side_effects:
          - "carried out inside the renew transition; the discount is folded into the RENEWAL_TIME retrofit_factor"

  - entity: MandatoryOffer
    state_field: status
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /eqp/mandatory-offers/{id}/respond with response=ACCEPT"
        actor: Policyholder
        preconditions:
          - "offer.status == PENDING (else ERR_OFFER_ALREADY_RESPONDED)"
          - "clock_now <= offer.expires_at (else ERR_OFFER_EXPIRED)"
          - "X-User-ID == offer.policyholder_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "offer.responded_at = clock_now"
          - "offer.version += 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /eqp/mandatory-offers/{id}/respond with response=DECLINE"
        actor: Policyholder
        preconditions:
          - "offer.status == PENDING (else ERR_OFFER_ALREADY_RESPONDED)"
          - "clock_now <= offer.expires_at (else ERR_OFFER_EXPIRED)"
          - "X-User-ID == offer.policyholder_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "offer.decline_documented = the request's decline_documented value (default false)"
          - "offer.responded_at = clock_now"
          - "if decline_documented == false then ParticipatingInsurer[offer.insurer_id].undocumented_decline_count += 1"
          - "offer.version += 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /eqp/mandatory-offers/{id}/expire"
        actor: ProgramAdmin
        preconditions:
          - "offer.status == PENDING (else ERR_OFFER_ALREADY_RESPONDED)"
          - "clock_now > offer.expires_at (else ERR_OFFER_STILL_VALID)"
        side_effects:
          - "offer.version += 1"
      - from: DECLINED
        to: PENDING
        trigger: "POST /eqp/mandatory-offers/{id}/reoffer"
        actor: ParticipatingInsurer
        preconditions:
          - "offer.status IN {DECLINED, ACCEPTED} (else ERR_OFFER_NOT_REOFFERABLE)"
          - "X-User-ID == offer.insurer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "offer.offer_round += 1; offer.offered_at = clock_now; offer.expires_at = clock_now + OFFER_VALID_DAYS"
          - "offer.responded_at = null; offer.decline_documented = false"
          - "if the previous status was DECLINED with decline_documented == false then ParticipatingInsurer[offer.insurer_id].undocumented_decline_count -= 1 (the decline is superseded by the new round)"
          - "offer.version += 1"
      - from: ACCEPTED
        to: PENDING
        trigger: "POST /eqp/mandatory-offers/{id}/reoffer"
        actor: ParticipatingInsurer
        preconditions:
          - "offer.status IN {DECLINED, ACCEPTED} (else ERR_OFFER_NOT_REOFFERABLE)"
          - "X-User-ID == offer.insurer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "same field writes as DECLINED -> PENDING"
          - "any Policy whose accepted_offer_id is this offer can no longer be renewed until the new round is ACCEPTED again (enforced as a renew precondition, not as a Policy mutation)"
        note: "This is the annual re-offer duty: the insurer must repeat the offer for the incoming term."

  - entity: RetrofitGrant
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [VERIFIED_COMPLETE, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /eqp/retrofit-grants/{id}/begin-review"
        actor: GrantReviewer
        preconditions:
          - "grant.status == SUBMITTED (else ERR_GRANT_INVALID_STATE)"
          - "GrantCycle[grant.grant_cycle_id].status == OPEN (else ERR_GRANT_CYCLE_CLOSED)"
        side_effects:
          - "grant.review_round += 1"
          - "grant.version += 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /eqp/retrofit-grants/{id}/review with decision=APPROVE"
        actor: GrantReviewer
        preconditions:
          - "grant.status == UNDER_REVIEW (else ERR_GRANT_INVALID_STATE)"
          - "Policy[grant.policy_id].lifecycle_status == ACTIVE (else ERR_POLICY_NOT_ACTIVE)"
          - "Dwelling[grant.dwelling_id].structure_type has a non-zero SCOPE_COST_CAP entry (else ERR_STRUCTURE_NOT_GRANT_ELIGIBLE)"
          - "GrantCycle[grant.grant_cycle_id].status == OPEN and clock_now within [opens_at, closes_at] (else ERR_GRANT_CYCLE_CLOSED)"
        side_effects:
          - "grant.approved_amount_cents = grant_award_amount(grant, dwelling)"
          - "grant.approved_by_user_id = acting X-User-ID"
          - "grant.version += 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /eqp/retrofit-grants/{id}/review with decision=RETURN"
        actor: GrantReviewer
        preconditions:
          - "grant.status == UNDER_REVIEW (else ERR_GRANT_INVALID_STATE)"
          - "grant.review_round < MAX_REVIEW_ROUNDS (3) (else ERR_GRANT_REVIEW_ROUNDS_EXHAUSTED)"
        side_effects:
          - "grant.denial_reason = the request's denial_reason"
          - "grant.version += 1"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /eqp/retrofit-grants/{id}/resubmit"
        actor: Policyholder
        preconditions:
          - "grant.status == RETURNED_FOR_INFO (else ERR_GRANT_INVALID_STATE)"
          - "X-User-ID == Dwelling[grant.dwelling_id].policyholder_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "grant.project_cost_estimate_cents and grant.requested_scope are overwritten when supplied"
          - "grant.version += 1"
        note: "Revision loop: SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED, bounded by MAX_REVIEW_ROUNDS."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /eqp/retrofit-grants/{id}/review with decision=DENY"
        actor: GrantReviewer
        preconditions:
          - "grant.status == UNDER_REVIEW (else ERR_GRANT_INVALID_STATE)"
        side_effects:
          - "grant.denial_reason = the request's denial_reason"
          - "grant.version += 1"
      - from: APPROVED
        to: FUNDS_RESERVED
        trigger: "POST /eqp/retrofit-grants/{id}/reserve-funds"
        actor: ProgramAdmin
        preconditions:
          - "grant.status == APPROVED (else ERR_GRANT_INVALID_STATE)"
          - "acting X-User-ID != grant.approved_by_user_id (else ERR_SOD_GRANT_REVIEWER_CONFLICT)"
          - "GrantCycle[grant.grant_cycle_id].status == OPEN (else ERR_GRANT_CYCLE_CLOSED)"
          - "request expected_grant_cycle_version == GrantCycle.version (else ERR_STALE_GRANT_CYCLE_VERSION)"
          - "grant_pool_waterfall resolves a drawing bucket (else ERR_GRANT_TIER_CAP_EXHAUSTED)"
          - "GrantCycle.reserved_cents + GrantCycle.disbursed_cents + grant.approved_amount_cents <= GrantCycle.total_pool_cents (else ERR_GRANT_CYCLE_POOL_EXHAUSTED)"
        side_effects:
          - "grant.funded_from_bucket = the bucket resolved by grant_pool_waterfall"
          - "grant.reserved_by_user_id = acting X-User-ID"
          - "GrantCycle.reserved_cents += grant.approved_amount_cents; GrantCycle.uncommitted_cents recomputed; GrantCycle.version += 1"
          - "Dwelling[grant.dwelling_id].grant_lifetime_count += 1"
          - "cascade: Policy[grant.policy_id].mitigation_status UNMITIGATED -> RETROFIT_PENDING"
          - "grant.version += 1"
      - from: FUNDS_RESERVED
        to: VERIFIED_COMPLETE
        trigger: "system: cascade from RetrofitProject AWAITING_INSPECTION -> VERIFIED (POST /eqp/inspections/{id}/record-result with result=PASS)"
        actor: system
        preconditions:
          - "grant.status == FUNDS_RESERVED"
          - "RetrofitProject.grant_id == grant.id and RetrofitProject.status == VERIFIED"
        side_effects:
          - "GrantCycle.reserved_cents -= grant.approved_amount_cents; GrantCycle.disbursed_cents += grant.approved_amount_cents; GrantCycle.uncommitted_cents unchanged; GrantCycle.version += 1"
          - "grant.version += 1"
      - from: FUNDS_RESERVED
        to: WITHDRAWN
        trigger: "POST /eqp/retrofit-grants/{id}/withdraw"
        actor: Policyholder | ProgramAdmin
        preconditions:
          - "grant.status IN {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED, FUNDS_RESERVED} (else ERR_GRANT_INVALID_STATE)"
          - "X-User-ID == Dwelling[grant.dwelling_id].policyholder_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "GrantCycle.reserved_cents -= grant.approved_amount_cents; GrantCycle.uncommitted_cents recomputed; GrantCycle.version += 1"
          - "grant.funded_from_bucket = NONE"
          - "cascade: every RetrofitProject with grant_id == grant.id and status IN {SCHEDULED, IN_PROGRESS, AWAITING_INSPECTION, REWORK_REQUIRED} -> ABANDONED"
          - "cascade: Policy[grant.policy_id].mitigation_status RETROFIT_PENDING -> UNMITIGATED"
          - "grant.version += 1"
        note: "Compensating action for reserve-funds - see compensating invariant grant_pool_conservation."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /eqp/retrofit-grants/{id}/withdraw"
        actor: Policyholder | ProgramAdmin
        preconditions:
          - "grant.status IN {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED, FUNDS_RESERVED}"
          - "X-User-ID == Dwelling[grant.dwelling_id].policyholder_id"
        side_effects:
          - "no GrantCycle ledger movement: nothing was reserved yet"
          - "grant.version += 1"
        note: "Same endpoint also serves UNDER_REVIEW -> WITHDRAWN, RETURNED_FOR_INFO -> WITHDRAWN and APPROVED -> WITHDRAWN, all without ledger movement."

  - entity: RetrofitProject
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /eqp/retrofit-projects/{id}/start-work"
        actor: CertifiedContractor
        preconditions:
          - "project.status == SCHEDULED (else ERR_PROJECT_INVALID_STATE)"
          - "X-User-ID == project.contractor_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Contractor[project.contractor_id].certification_status == CERTIFIED (else ERR_CONTRACTOR_NOT_CERTIFIED)"
          - "clock_now < Contractor.certification_expires_at (else ERR_CONTRACTOR_CERTIFICATION_EXPIRED)"
        side_effects:
          - "project.started_at = clock_now"
          - "project.version += 1"
      - from: REWORK_REQUIRED
        to: IN_PROGRESS
        trigger: "POST /eqp/retrofit-projects/{id}/start-work"
        actor: CertifiedContractor
        preconditions:
          - "project.status == REWORK_REQUIRED"
          - "X-User-ID == project.contractor_id"
          - "Contractor.certification_status IN {CERTIFIED, PROBATION} (a contractor on probation may finish work already begun but may not be attached to a new project; else ERR_CONTRACTOR_NOT_CERTIFIED)"
          - "clock_now < Contractor.certification_expires_at"
        side_effects:
          - "project.version += 1"
        note: "Rework loop: AWAITING_INSPECTION -> REWORK_REQUIRED -> IN_PROGRESS -> AWAITING_INSPECTION."
      - from: IN_PROGRESS
        to: AWAITING_INSPECTION
        trigger: "POST /eqp/retrofit-projects/{id}/request-inspection"
        actor: CertifiedContractor
        preconditions:
          - "project.status == IN_PROGRESS (else ERR_PROJECT_INVALID_STATE)"
          - "X-User-ID == project.contractor_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "project.version += 1"
      - from: AWAITING_INSPECTION
        to: VERIFIED
        trigger: "POST /eqp/inspections/{id}/record-result with result=PASS"
        actor: FieldInspector
        preconditions:
          - "project.status == AWAITING_INSPECTION (else ERR_PROJECT_INVALID_STATE)"
          - "inspection.result == PENDING (else ERR_INSPECTION_ALREADY_RECORDED)"
          - "clock_now >= inspection.window_start (else ERR_INSPECTION_WINDOW_NOT_REACHED)"
        side_effects:
          - "hop 1: inspection.result = PASS, inspection.inspector_user_id = X-User-ID, inspection.recorded_at = clock_now; project.status = VERIFIED; project.verified_at = clock_now; project.inspection_attempts += 1"
          - "hop 2 (caused by project reaching VERIFIED): Dwelling[grant.dwelling_id].retrofit_status = VERIFIED and Dwelling.verified_retrofit_scope = project.scope_code; RetrofitGrant[project.grant_id].status FUNDS_RESERVED -> VERIFIED_COMPLETE"
          - "hop 3 (caused by the grant reaching VERIFIED_COMPLETE): GrantCycle.reserved_cents -= approved_amount_cents, GrantCycle.disbursed_cents += approved_amount_cents, GrantCycle.version += 1"
          - "hop 3b (caused by Dwelling.retrofit_status reaching VERIFIED): Policy[grant.policy_id].mitigation_status RETROFIT_PENDING -> RETROFIT_VERIFIED"
          - "hop 4 (caused by the policy reaching RETROFIT_VERIFIED, only when lifecycle_status == ACTIVE): mitigation_discount_application writes policy.mitigation_discount_cents, policy.annual_premium_cents, policy.prorated_credit_cents and moves mitigation_status to DISCOUNT_APPLIED"
      - from: AWAITING_INSPECTION
        to: REWORK_REQUIRED
        trigger: "POST /eqp/inspections/{id}/record-result with result=FAIL"
        actor: FieldInspector
        preconditions:
          - "project.status == AWAITING_INSPECTION"
          - "inspection.result == PENDING"
          - "clock_now >= inspection.window_start"
        side_effects:
          - "inspection.result = FAIL, inspector_user_id, recorded_at set; project.inspection_attempts += 1"
          - "Contractor[project.contractor_id].failed_inspection_count += 1"
          - "conditional cascade: when the incremented failed_inspection_count >= PROBATION_FAIL_THRESHOLD (3) and Contractor.certification_status == CERTIFIED then Contractor.certification_status = PROBATION"
          - "no Dwelling, RetrofitGrant, GrantCycle or Policy field is touched"
      - from: AWAITING_INSPECTION
        to: AWAITING_INSPECTION
        trigger: "POST /eqp/inspections/{id}/record-result with result=PARTIAL"
        actor: FieldInspector
        preconditions:
          - "project.status == AWAITING_INSPECTION"
          - "inspection.result == PENDING"
          - "clock_now >= inspection.window_start"
        side_effects:
          - "inspection.result = PARTIAL, inspector_user_id, recorded_at set; project.inspection_attempts += 1"
          - "project.status is unchanged: a PARTIAL verification neither verifies the retrofit nor sends it back to rework, so a further Inspection must be scheduled"
      - from: SCHEDULED
        to: ABANDONED
        trigger: "POST /eqp/retrofit-projects/{id}/abandon"
        actor: ProgramAdmin
        preconditions:
          - "project.status IN {SCHEDULED, IN_PROGRESS, AWAITING_INSPECTION, REWORK_REQUIRED} (else ERR_PROJECT_INVALID_STATE)"
        side_effects:
          - "every Inspection for this project with result == PENDING is left in place but its window no longer blocks the contractor calendar (only PENDING inspections of non-ABANDONED projects occupy the calendar)"
          - "RetrofitGrant funds stay reserved; the grant must be withdrawn separately to release them"
          - "project.version += 1"
        note: "Same endpoint also serves IN_PROGRESS -> ABANDONED, AWAITING_INSPECTION -> ABANDONED and REWORK_REQUIRED -> ABANDONED."

  - entity: Claim
    state_field: adjustment_status
    initial_state: FNOL_RECEIVED
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: FNOL_RECEIVED
        to: PROVISIONAL_ADJUSTED
        trigger: "POST /eqp/claims/{id}/adjust-provisional"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status == FNOL_RECEIVED (else ERR_CLAIM_INVALID_STATE)"
          - "CatastropheEvent[claim.event_id].status IN {DECLARED, LOSS_AGGREGATION, CAPACITY_EXHAUSTED} (else ERR_EVENT_NOT_DECLARED)"
        side_effects:
          - "claim_settlement variant PROVISIONAL writes claim.deductible_applied_cents, claim.dwelling_part_cents, claim.contents_part_cents, claim.loss_of_use_part_cents, claim.provisional_payable_cents"
          - "claim.payable_cents = claim.provisional_payable_cents"
          - "claim.provisional_adjuster_user_id = acting X-User-ID"
          - "claim.payment_status is NOT changed (remains UNPAID)"
          - "claim.version += 1"
      - from: PROVISIONAL_ADJUSTED
        to: FINAL_ADJUSTED
        trigger: "POST /eqp/claims/{id}/finalize-adjustment"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status == PROVISIONAL_ADJUSTED (else ERR_CLAIM_INVALID_STATE)"
          - "acting X-User-ID != claim.provisional_adjuster_user_id (else ERR_SOD_ADJUSTER_CONFLICT)"
          - "CatastropheEvent[claim.event_id].status != CLOSED (else ERR_EVENT_CLOSED)"
        side_effects:
          - "hop 1: claim_settlement variant FINAL rewrites claim.dwelling_part_cents / contents_part_cents / loss_of_use_part_cents and writes claim.final_payable_cents; claim.payable_cents = claim.final_payable_cents; claim.final_adjuster_user_id = acting X-User-ID"
          - "hop 2 (caused by the claim reaching FINAL_ADJUSTED): CatastropheEvent.aggregate_incurred_cents += claim.final_payable_cents; CatastropheEvent.version += 1; if event.status == DECLARED then event.status = LOSS_AGGREGATION"
          - "hop 3 (caused by aggregate_incurred_cents changing): event_loss_waterfall reruns, rewriting CatastropheEvent.retained_cents, every matching ReinsuranceLayer.ceded_cents, CatastropheEvent.ceded_total_cents and CatastropheEvent.uncovered_cents"
          - "hop 4 (caused by uncovered_cents becoming > 0): CatastropheEvent.status LOSS_AGGREGATION -> CAPACITY_EXHAUSTED"
          - "claim.payment_status is NOT changed by finalization"
          - "claim.version += 1"
      - from: FINAL_ADJUSTED
        to: PROVISIONAL_ADJUSTED
        trigger: "POST /eqp/claims/{id}/reopen"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status == FINAL_ADJUSTED (else ERR_CLAIM_INVALID_STATE)"
          - "claim.reopen_count < MAX_REOPENS (2) (else ERR_CLAIM_REOPEN_LIMIT)"
          - "CatastropheEvent[claim.event_id].status NOT IN {ASSESSMENT_LEVIED, CLOSED} (else ERR_EVENT_ASSESSMENT_LOCKED)"
        side_effects:
          - "compensation hop 1: CatastropheEvent.aggregate_incurred_cents -= claim.final_payable_cents; CatastropheEvent.version += 1"
          - "compensation hop 2: event_loss_waterfall reruns over the reduced gross, rewriting retained_cents, every ReinsuranceLayer.ceded_cents, ceded_total_cents and uncovered_cents"
          - "compensation hop 3: when uncovered_cents returns to 0 and event.status == CAPACITY_EXHAUSTED then event.status = LOSS_AGGREGATION"
          - "claim.final_payable_cents = 0; claim.payable_cents = claim.provisional_payable_cents; claim.final_adjuster_user_id = null; claim.reopen_count += 1"
          - "claim.payment_status and claim.paid_cents are NOT changed - a PARTIALLY_PAID claim keeps its paid_cents; a fully PAID claim is refused outright by ERR_CLAIM_ALREADY_SETTLED"
          - "claim.version += 1"
      - from: FINAL_ADJUSTED
        to: CLOSED
        trigger: "POST /eqp/claims/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "claim.adjustment_status == FINAL_ADJUSTED (else ERR_CLAIM_INVALID_STATE)"
          - "claim.payment_status == PAID (cross-dimension guard; else ERR_CLAIM_NOT_FULLY_PAID)"
        side_effects:
          - "claim.version += 1"
      - from: FNOL_RECEIVED
        to: DENIED
        trigger: "POST /eqp/claims/{id}/deny"
        actor: ClaimAdjuster
        preconditions:
          - "claim.adjustment_status == FNOL_RECEIVED (else ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "claim.payable_cents = 0; claim.provisional_payable_cents = 0; claim.denial_reason = the request's denial_reason"
          - "cross-dimension cascade: claim.payment_status UNPAID -> WRITTEN_OFF"
          - "claim.version += 1"

  - entity: Claim
    state_field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /eqp/claims/{id}/record-payment where amount_cents < claim.payable_cents"
        actor: ProgramAdmin
        preconditions:
          - "claim.adjustment_status IN {PROVISIONAL_ADJUSTED, FINAL_ADJUSTED} (else ERR_CLAIM_INVALID_STATE)"
          - "claim.payment_status IN {UNPAID, PARTIALLY_PAID} (else ERR_CLAIM_ALREADY_SETTLED)"
          - "amount_cents > 0 (else ERR_INVALID_REQUEST)"
          - "claim.paid_cents + amount_cents <= claim.payable_cents (else ERR_PAYMENT_EXCEEDS_PAYABLE)"
        side_effects:
          - "claim.paid_cents += amount_cents"
          - "claim.adjustment_status is NOT changed"
          - "claim.version += 1"
      - from: UNPAID
        to: PAID
        trigger: "POST /eqp/claims/{id}/record-payment where claim.paid_cents + amount_cents == claim.payable_cents"
        actor: ProgramAdmin
        preconditions:
          - "same preconditions as UNPAID -> PARTIALLY_PAID"
        side_effects:
          - "claim.paid_cents = claim.payable_cents"
          - "claim.version += 1"
        note: "Boundary: equality settles the claim (PAID); one cent more is refused with ERR_PAYMENT_EXCEEDS_PAYABLE."
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /eqp/claims/{id}/record-payment where claim.paid_cents + amount_cents == claim.payable_cents"
        actor: ProgramAdmin
        preconditions:
          - "same preconditions as UNPAID -> PARTIALLY_PAID"
        side_effects:
          - "claim.paid_cents = claim.payable_cents"
          - "claim.version += 1"
      - from: UNPAID
        to: WRITTEN_OFF
        trigger: "system: cross-dimension cascade from POST /eqp/claims/{id}/deny"
        actor: system
        preconditions:
          - "claim.payment_status == UNPAID"
        side_effects:
          - "carried out inside the deny transition"

  - entity: CatastropheEvent
    state_field: status
    initial_state: MONITORING
    terminal_states: [CLOSED]
    transitions:
      - from: MONITORING
        to: DECLARED
        trigger: "POST /eqp/catastrophe-events/{id}/declare"
        actor: ProgramAdmin
        preconditions:
          - "event.status == MONITORING (else ERR_EVENT_INVALID_STATE)"
          - "event.magnitude >= DECLARATION_MIN_MAGNITUDE (5.0) (else ERR_MAGNITUDE_BELOW_DECLARATION_FLOOR)"
          - "at least one ReinsuranceLayer with treaty_year == event.treaty_year and status == ACTIVE exists (else ERR_NO_REINSURANCE_PROGRAM)"
        side_effects:
          - "claims may now be filed against this event"
          - "the binding moratorium becomes effective for epicenter_county_code until occurred_at + MORATORIUM_DAYS"
          - "event.version += 1"
      - from: DECLARED
        to: LOSS_AGGREGATION
        trigger: "system: cascade from the first Claim reaching FINAL_ADJUSTED (POST /eqp/claims/{id}/finalize-adjustment)"
        actor: system
        preconditions:
          - "event.status == DECLARED"
        side_effects:
          - "carried out inside the finalize-adjustment cascade (hop 2)"
      - from: LOSS_AGGREGATION
        to: CAPACITY_EXHAUSTED
        trigger: "system: cascade continuation when event_loss_waterfall leaves uncovered_cents > 0"
        actor: system
        preconditions:
          - "event.status == LOSS_AGGREGATION"
          - "event.uncovered_cents > 0 (strictly greater; an exactly-covered loss stays in LOSS_AGGREGATION)"
        side_effects:
          - "carried out inside the finalize-adjustment cascade (hop 4)"
      - from: CAPACITY_EXHAUSTED
        to: LOSS_AGGREGATION
        trigger: "system: compensation cascade from POST /eqp/claims/{id}/reopen when uncovered_cents returns to 0"
        actor: system
        preconditions:
          - "event.status == CAPACITY_EXHAUSTED"
          - "event.uncovered_cents == 0 after the waterfall rerun"
        side_effects:
          - "carried out inside the reopen compensation (hop 3)"
        note: "This is the cycle in the event machine: LOSS_AGGREGATION -> CAPACITY_EXHAUSTED -> LOSS_AGGREGATION."
      - from: CAPACITY_EXHAUSTED
        to: ASSESSMENT_LEVIED
        trigger: "POST /eqp/catastrophe-events/{id}/levy-assessment"
        actor: ProgramAdmin
        preconditions:
          - "event.status == CAPACITY_EXHAUSTED (else ERR_EVENT_CAPACITY_NOT_EXHAUSTED)"
          - "at least one assessable ParticipatingInsurer exists per post_event_assessment's eligibility filter (else ERR_NO_ASSESSABLE_INSURERS)"
        side_effects:
          - "post_event_assessment writes event.assessment_shortfall_cents, event.admin_loading_cents, event.assessment_total_cents"
          - "one AssessmentAllocation row is created per assessable insurer, with allocation_rank and absorbs_remainder set"
          - "each ParticipatingInsurer.assessment_balance_cents += its AssessmentAllocation.assessed_cents"
          - "event.version += 1"
      - from: ASSESSMENT_LEVIED
        to: CLOSED
        trigger: "POST /eqp/catastrophe-events/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "event.status IN {MONITORING, LOSS_AGGREGATION, ASSESSMENT_LEVIED} (else ERR_EVENT_INVALID_STATE)"
          - "no Claim for this event has adjustment_status IN {FNOL_RECEIVED, PROVISIONAL_ADJUSTED} (else ERR_EVENT_HAS_OPEN_CLAIMS)"
        side_effects:
          - "event.version += 1"
      - from: LOSS_AGGREGATION
        to: CLOSED
        trigger: "POST /eqp/catastrophe-events/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "same preconditions as ASSESSMENT_LEVIED -> CLOSED"
        side_effects:
          - "event.version += 1"
        note: "Closing straight from LOSS_AGGREGATION is the no-shortfall path; a CAPACITY_EXHAUSTED event must be levied first."
      - from: MONITORING
        to: CLOSED
        trigger: "POST /eqp/catastrophe-events/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "same preconditions as ASSESSMENT_LEVIED -> CLOSED"
        side_effects:
          - "event.version += 1"
        note: "A monitored tremor that never met the declaration floor is closed without loss."

  - entity: Contractor
    state_field: certification_status
    initial_state: CERTIFIED
    terminal_states: []
    transitions:
      - from: CERTIFIED
        to: PROBATION
        trigger: "system: cascade from POST /eqp/inspections/{id}/record-result with result=FAIL when failed_inspection_count reaches PROBATION_FAIL_THRESHOLD (3)"
        actor: system
        preconditions:
          - "contractor.certification_status == CERTIFIED"
          - "contractor.failed_inspection_count >= 3 after the increment"
        side_effects:
          - "the contractor may no longer be attached to a new RetrofitProject, but may resume work already in REWORK_REQUIRED"
          - "contractor.version += 1"
      - from: PROBATION
        to: CERTIFIED
        trigger: "POST /eqp/contractors/{id}/certification with certification_status=CERTIFIED"
        actor: ProgramAdmin
        preconditions:
          - "contractor.certification_status IN {PROBATION, SUSPENDED} (else ERR_CONTRACTOR_INVALID_CERTIFICATION_TRANSITION)"
        side_effects:
          - "contractor.failed_inspection_count is NOT reset - the audit counter is cumulative"
          - "contractor.certification_expires_at is overwritten when supplied"
          - "contractor.version += 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /eqp/contractors/{id}/certification with certification_status=SUSPENDED"
        actor: ProgramAdmin
        preconditions:
          - "contractor.certification_status IN {CERTIFIED, PROBATION}"
        side_effects:
          - "every RetrofitProject of this contractor keeps its status; only start-work is blocked"
          - "contractor.version += 1"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /eqp/contractors/{id}/certification with certification_status=CERTIFIED"
        actor: ProgramAdmin
        preconditions:
          - "contractor.certification_status IN {PROBATION, SUSPENDED}"
        side_effects:
          - "contractor.version += 1"

  - entity: ParticipatingInsurer
    state_field: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: UNDER_REVIEW
        trigger: "POST /eqp/insurers/{id}/take-up-evaluation"
        actor: ProgramAdmin
        preconditions:
          - "insurer.compliance_status == COMPLIANT"
          - "take_up_rate_evaluation reports offers_considered >= MIN_OFFER_SAMPLE (4) and take_up_rate_bp < TAKE_UP_FLOOR_BP (2500)"
        side_effects:
          - "insurer.last_take_up_rate_bp = the computed rate"
          - "insurer.version += 1"
      - from: COMPLIANT | UNDER_REVIEW
        to: SANCTIONED
        trigger: "POST /eqp/insurers/{id}/take-up-evaluation, or POST /eqp/insurers/{id}/compliance-action with action=SANCTION"
        actor: ProgramAdmin
        preconditions:
          - "insurer.compliance_status IN {COMPLIANT, UNDER_REVIEW}"
          - "for the evaluation path: insurer.undocumented_decline_count >= UNDOCUMENTED_DECLINE_LIMIT (3); this path may jump straight from COMPLIANT without passing through UNDER_REVIEW"
          - "for the manual compliance-action path: insurer.compliance_status == UNDER_REVIEW (else ERR_INSURER_NOT_SANCTIONED, validation priority 37)"
        side_effects:
          - "the insurer can no longer bind or renew policies (bind and renew preconditions)"
          - "the insurer is excluded from post_event_assessment's assessable pool"
          - "insurer.version += 1"
      - from: SANCTIONED
        to: COMPLIANT
        trigger: "POST /eqp/insurers/{id}/compliance-action with action=REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "insurer.compliance_status == SANCTIONED (else ERR_INSURER_NOT_SANCTIONED)"
        side_effects:
          - "insurer.undocumented_decline_count is NOT reset"
          - "insurer.version += 1"

  - entity: ParticipatingInsurer
    state_field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /eqp/insurers/{id}/compliance-action with action=WITHDRAW"
        actor: ProgramAdmin
        preconditions:
          - "insurer.status == ACTIVE (else ERR_INSURER_ALREADY_WITHDRAWN)"
        side_effects:
          - "the insurer can no longer bind policies; existing ACTIVE policies are untouched"
          - "a WITHDRAWN insurer remains assessable for events whose occurred_at precedes the withdrawal, so it stays in post_event_assessment's pool"
          - "insurer.version += 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: grant-reserve-stale-cycle
    parent_entity: GrantCycle
    write_endpoint: "POST /eqp/retrofit-grants/{id}/reserve-funds"
    occ_field: "expected_grant_cycle_version"
    description: |
      Reserving a grant's approved amount against a GrantCycle whose version has advanced since
      the reviewer last read the cycle is rejected. Two different APPROVED grants may each
      legitimately reserve from the same OPEN cycle while the pool has room, so the loser is not
      excluded by any state precondition; the stale expected_grant_cycle_version is the only
      thing that distinguishes a reviewer acting on a cycle balance that has already moved.
    error_id: ERR_STALE_GRANT_CYCLE_VERSION
    http_status: 412
  - rule_id: claim-fnol-stale-event
    parent_entity: CatastropheEvent
    write_endpoint: "POST /eqp/claims"
    occ_field: "expected_event_version"
    description: |
      Filing a first notice of loss against a CatastropheEvent whose version has advanced since
      the policyholder's client last read the event is rejected. Many claims may legitimately be
      filed against the same DECLARED event, so a second filing is never blocked by a state
      precondition; the stale expected_event_version is what marks a filer whose view of the
      event - including whether capacity has already been exhausted - predates another writer's
      loss aggregation.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
#   All money is integer cents. Every formula evaluates its factor product in
#   EXACT DECIMAL arithmetic in the order written, and rounds exactly once,
#   half-up, where the formula says round_half_up().
# ---------------------------------------------------------------------------
calculations:
  - name: hazard_base_premium
    trigger: "POST /eqp/policies (variant QUOTE_TIME) and POST /eqp/policies/{id}/renew (variant RENEWAL_TIME); writes Policy.base_premium_cents, Policy.rating_variant and Policy.annual_premium_cents"
    algorithm: weighted_scoring
    formula: |
      exposure_units      = dwelling.dwelling_limit_cents / 100000        # per $1,000 of Coverage A limit
      rate_per_1000       = BASE_RATE_PER_1000[dwelling.county_hazard_tier]
      soil_factor         = SOIL_FACTOR[dwelling.soil_class]
      structure_factor    = STRUCTURE_FACTOR[dwelling.structure_type]
      age_factor          = AGE_FACTOR_PRE_CODE if dwelling.year_built <= PRE_CODE_YEAR else 1.00
      effective_retrofit  = (variant QUOTE_TIME)   dwelling.retrofit_status as stored
                            (variant RENEWAL_TIME) dwelling.retrofit_status, except SELF_DECLARED is
                                                   downgraded to NONE - only an inspection-verified
                                                   retrofit survives into the renewal rating
      retrofit_factor     = 0.75 if effective_retrofit == VERIFIED
                                    and dwelling.structure_type == WOOD_FRAME_CRIPPLE_WALL
                                    and dwelling.verified_retrofit_scope == CRIPPLE_WALL_BRACING
                            0.90 if effective_retrofit == VERIFIED (any other structure/scope)
                            0.95 if effective_retrofit == SELF_DECLARED
                            1.00 if effective_retrofit == NONE
      deductible_factor   = DEDUCTIBLE_FACTOR[policy.deductible_pct]
      high_limit_factor   = HIGH_LIMIT_LOAD if dwelling.dwelling_limit_cents >= HIGH_LIMIT_THRESHOLD_CENTS else 1.00
      raw = rate_per_1000 * exposure_units * soil_factor * structure_factor
            * age_factor * retrofit_factor * deductible_factor * high_limit_factor
      base_premium_cents  = round_half_up( min( max(raw, MIN_PREMIUM_CENTS), MAX_PREMIUM_CENTS ) )
      annual_premium_cents = base_premium_cents - policy.mitigation_discount_cents
    input_set: |
      Reads exactly one Dwelling (policy.dwelling_id) and the policy's own deductible_pct. The
      dwelling fields are read LIVE at quote and at renew; policy.rated_dwelling_limit_cents (the
      claim-side snapshot) is written from the same live value at bind and re-snapshotted at renew.
      No other Policy, Claim or Grant participates.
    constants:
      BASE_RATE_PER_1000: { TIER_1: 180, TIER_2: 320, TIER_3: 520 }
      SOIL_FACTOR: { ROCK: 0.85, STIFF: 1.00, SOFT: 1.25, LIQUEFACTION: 1.55 }
      STRUCTURE_FACTOR: { WOOD_FRAME_SLAB: 1.00, WOOD_FRAME_CRIPPLE_WALL: 1.30, MASONRY_URM: 1.85, MOBILE_HOME: 1.45 }
      DEDUCTIBLE_FACTOR: { 5: 1.35, 10: 1.00, 15: 0.86, 20: 0.75, 25: 0.66 }
      AGE_FACTOR_PRE_CODE: 1.20
      PRE_CODE_YEAR: 1979
      HIGH_LIMIT_LOAD: 1.15
      HIGH_LIMIT_THRESHOLD_CENTS: 75000000
      MIN_PREMIUM_CENTS: 18000
      MAX_PREMIUM_CENTS: 4000000
    precision: "integer cents; the factor product is evaluated in exact decimal and rounded half-up exactly once, AFTER the min/max clamp"
    variants:
      - name: QUOTE_TIME
        when: "POST /eqp/policies - the initial quote"
        difference: "A SELF_DECLARED retrofit earns retrofit_factor 0.95 on the strength of the applicant's own attestation."
      - name: RENEWAL_TIME
        when: "POST /eqp/policies/{id}/renew"
        difference: "SELF_DECLARED is treated as NONE (factor 1.00), so an unverified attestation that discounted the first term costs 5% more at renewal on byte-identical dwelling data."

  - name: mitigation_discount_application
    trigger: "system, inside the PASS cascade of POST /eqp/inspections/{id}/record-result, at the hop that moves Policy.mitigation_status RETROFIT_VERIFIED -> DISCOUNT_APPLIED; writes Policy.mitigation_discount_cents, Policy.annual_premium_cents and Policy.prorated_credit_cents"
    algorithm: threshold
    formula: |
      scope_pct = 0.25 if dwelling.verified_retrofit_scope == CRIPPLE_WALL_BRACING
                          and dwelling.structure_type == WOOD_FRAME_CRIPPLE_WALL
                  0.20 if dwelling.verified_retrofit_scope == EARTHQUAKE_BRACING_SYSTEM
                          and dwelling.structure_type == MOBILE_HOME
                  0.10 otherwise
      grant_offset_pct = GRANT_OFFSET_PCT if RetrofitGrant.approved_amount_cents > 0 else 0.00
      effective_pct    = max(MIN_EFFECTIVE_DISCOUNT_PCT, scope_pct - grant_offset_pct)
      mitigation_discount_cents = round_half_up(policy.base_premium_cents * effective_pct)
      annual_premium_cents      = policy.base_premium_cents - mitigation_discount_cents
      remaining_days   = floor( (policy.expires_at - clock_now) / 1 day )   # 0 when already expired
      prorated_credit_cents = round_half_up(mitigation_discount_cents * min(remaining_days, TERM_DAYS) / TERM_DAYS)
    input_set: |
      Reads the single RetrofitGrant that the verifying RetrofitProject points at (project.grant_id),
      that grant's Dwelling, and the Policy named by grant.policy_id. Public money reduces the
      private incentive: any grant with approved_amount_cents > 0 costs the policyholder
      GRANT_OFFSET_PCT of discount, floored at MIN_EFFECTIVE_DISCOUNT_PCT.
    constants:
      GRANT_OFFSET_PCT: 0.05
      MIN_EFFECTIVE_DISCOUNT_PCT: 0.05
      TERM_DAYS: 365
    precision: "integer cents; the discount is rounded half-up first, then the credit is rounded half-up from the already-rounded discount (never from the unrounded product)"

  - name: claim_settlement
    trigger: "POST /eqp/claims/{id}/adjust-provisional (variant PROVISIONAL) and POST /eqp/claims/{id}/finalize-adjustment (variant FINAL); writes Claim.deductible_applied_cents, dwelling_part_cents, contents_part_cents, loss_of_use_part_cents and provisional_payable_cents / final_payable_cents"
    algorithm: waterfall_allocation
    formula: |
      limit_cents = policy.rated_dwelling_limit_cents          # the term snapshot, NOT the live dwelling field
      deductible_applied_cents = round_half_up(limit_cents * policy.deductible_pct / 100)

      # ---- variant PROVISIONAL ------------------------------------------------
      dwelling_basis   = min(claim.structural_damage_cents, limit_cents)   # cosmetic damage is NOT in the basis
      dwelling_part    = max(0, dwelling_basis - deductible_applied_cents) # deductible hits Coverage A only
      contents_part    = min(claim.contents_damage_cents, policy.contents_sublimit_cents)
      loss_of_use_part = min(claim.loss_of_use_cents, policy.loss_of_use_sublimit_cents)
      provisional_payable_cents = dwelling_part + contents_part + loss_of_use_part
      payable_cents             = provisional_payable_cents   # the currently effective payable

      # ---- variant FINAL ------------------------------------------------------
      cosmetic_allowed = min(claim.cosmetic_damage_cents,
                             round_half_up(COSMETIC_ALLOWANCE_PCT * claim.structural_damage_cents))
      dwelling_basis   = min(claim.structural_damage_cents + cosmetic_allowed, limit_cents)
      contents_basis   = min(claim.contents_damage_cents, policy.contents_sublimit_cents)
      combined_basis   = dwelling_basis + contents_basis
      after_deductible = max(0, combined_basis - deductible_applied_cents)   # deductible hits A+C combined
      # PINNED ROUNDING ORDER: round the Coverage C share half-up FIRST, then take Coverage A as the
      # residual. Rounding both shares independently and summing them is WRONG and can drift a cent.
      contents_part    = round_half_up(after_deductible * contents_basis / combined_basis) if combined_basis > 0 else 0
      dwelling_part    = after_deductible - contents_part
      loss_of_use_part = min(claim.loss_of_use_cents, policy.loss_of_use_sublimit_cents)   # never reduced by the deductible
      final_payable_cents = dwelling_part + contents_part + loss_of_use_part
      payable_cents       = final_payable_cents               # FINAL supersedes PROVISIONAL
    input_set: |
      Reads exactly one Claim's four reported damage figures - fixed at FNOL and never rewritten by
      either adjustment - plus its Policy's deductible_pct, contents_sublimit_cents,
      loss_of_use_sublimit_cents and rated_dwelling_limit_cents. No other claim on the same event
      or policy participates.
    constants:
      COSMETIC_ALLOWANCE_PCT: 0.10
    precision: "integer cents; exactly two roundings in the FINAL variant (cosmetic allowance, then the contents share), and Coverage A absorbs the residual"
    variants:
      - name: PROVISIONAL
        when: "POST /eqp/claims/{id}/adjust-provisional"
        difference: "Cosmetic damage is excluded from the basis entirely and the deductible is charged against Coverage A alone, so Coverage C and D pay out in full up to their sublimits."
      - name: FINAL
        when: "POST /eqp/claims/{id}/finalize-adjustment"
        difference: "Cosmetic damage enters the basis up to 10% of structural damage, and the deductible is charged against the combined Coverage A + Coverage C basis. On the same reported figures FINAL can land either above PROVISIONAL (cosmetic allowance dominates) or below it (the deductible now also eats Coverage C)."

  - name: grant_award_amount
    trigger: "POST /eqp/retrofit-grants/{id}/review with decision=APPROVE; writes RetrofitGrant.approved_amount_cents"
    algorithm: tiered_pricing
    formula: |
      scope_cap = SCOPE_COST_CAP[dwelling.structure_type]
      # scope_cap == 0 means the structure type is not grant-eligible at all -> ERR_STRUCTURE_NOT_GRANT_ELIGIBLE
      eligible_cost = min(grant.project_cost_estimate_cents, scope_cap)
      approved_amount_cents = min(round_half_up(eligible_cost * MATCH_PCT[grant.income_tier]), MAX_GRANT_CENTS)
    input_set: "Reads one RetrofitGrant and its Dwelling. Prior grants on the same dwelling do not reduce the award; they are refused earlier by the one-grant-per-dwelling uniqueness rule."
    constants:
      SCOPE_COST_CAP: { WOOD_FRAME_CRIPPLE_WALL: 1000000, MOBILE_HOME: 600000, WOOD_FRAME_SLAB: 0, MASONRY_URM: 0 }
      MATCH_PCT: { TIER_LOW: 1.00, TIER_MID: 0.75, TIER_ANY: 0.50 }
      MAX_GRANT_CENTS: 300000
    precision: "integer cents; round half-up after applying the match percentage, then clamp to MAX_GRANT_CENTS"

  - name: grant_pool_waterfall
    trigger: "POST /eqp/retrofit-grants/{id}/reserve-funds; writes RetrofitGrant.funded_from_bucket, GrantCycle.reserved_cents and GrantCycle.uncommitted_cents"
    algorithm: waterfall_allocation
    formula: |
      tier_cap(t)  = round_half_up(cycle.total_pool_cents * TIER_POOL_PCT[t])
      tier_used(t) = sum of approved_amount_cents over RetrofitGrant rows where
                        grant_cycle_id == cycle.id
                        AND funded_from_bucket == t
                        AND status IN {FUNDS_RESERVED, VERIFIED_COMPLETE}
                     (WITHDRAWN and DENIED grants release their bucket usage; SUBMITTED /
                      UNDER_REVIEW / RETURNED_FOR_INFO / APPROVED grants have never consumed any)
      a = grant.approved_amount_cents
      t = grant.income_tier
      # step 1 - own tier bucket
      if tier_used(t) + a <= tier_cap(t):            funded_from_bucket = t
      # step 2 - the open TIER_ANY bucket is the single fallback
      elif t != TIER_ANY and tier_used(TIER_ANY) + a <= tier_cap(TIER_ANY):
                                                     funded_from_bucket = TIER_ANY
      else:                                          reject ERR_GRANT_TIER_CAP_EXHAUSTED
      # step 3 - the hard pool ceiling, checked AFTER a bucket has been resolved
      if cycle.reserved_cents + cycle.disbursed_cents + a > cycle.total_pool_cents:
                                                     reject ERR_GRANT_CYCLE_POOL_EXHAUSTED
      cycle.reserved_cents   += a
      cycle.uncommitted_cents = cycle.total_pool_cents - cycle.reserved_cents - cycle.disbursed_cents
    input_set: "Reads every RetrofitGrant of the cycle in status FUNDS_RESERVED or VERIFIED_COMPLETE, grouped by funded_from_bucket. Order of arrival matters: buckets are consumed first-come, and TIER_POOL_PCT deliberately sums to 1.25, so the bucket caps over-subscribe the pool and the hard ceiling in step 3 can bite even when a bucket still has room."
    constants:
      TIER_POOL_PCT: { TIER_LOW: 0.60, TIER_MID: 0.40, TIER_ANY: 0.25 }
    precision: "integer cents; tier caps rounded half-up from the pool total"

  - name: event_loss_waterfall
    trigger: "system, inside the cascade of POST /eqp/claims/{id}/finalize-adjustment; also re-run by POST /eqp/claims/{id}/reopen. Writes CatastropheEvent.aggregate_incurred_cents, retained_cents, ceded_total_cents, uncovered_cents, ReinsuranceLayer.ceded_cents and can drive CatastropheEvent.status LOSS_AGGREGATION -> CAPACITY_EXHAUSTED"
    algorithm: waterfall_allocation
    formula: |
      gross = event.aggregate_incurred_cents      # sum of final_payable_cents over the event's FINAL_ADJUSTED / CLOSED claims
      retained_cents = min(gross, event.retention_cents)
      # layers of the SAME treaty_year as the event, status ACTIVE, ordered by layer_index ASC then created_at ASC
      for each layer in ordered_layers:
          exposure          = max(0, min(gross, layer.attachment_point_cents + layer.limit_cents) - layer.attachment_point_cents)
          layer.ceded_cents = round_half_up(exposure * layer.ceded_pct)
      ceded_total_cents = sum(layer.ceded_cents)
      uncovered_cents   = max(0, gross - retained_cents - ceded_total_cents)
      if uncovered_cents > 0 and event.status == LOSS_AGGREGATION: event.status = CAPACITY_EXHAUSTED
    input_set: |
      Reads every ReinsuranceLayer whose treaty_year equals the event's treaty_year AND whose status
      is ACTIVE. A LAPSED or EXHAUSTED layer contributes nothing and does NOT shift the layers above
      it downward - attachment points are absolute, so a lapsed lower layer leaves a permanent hole
      that lands in uncovered_cents. Claims still in FNOL_RECEIVED, PROVISIONAL_ADJUSTED or DENIED
      are excluded from gross.
    constants: {}
    precision: "integer cents; one half-up rounding per layer, and uncovered_cents is a residual (never independently rounded)"

  - name: post_event_assessment
    trigger: "POST /eqp/catastrophe-events/{id}/levy-assessment; writes CatastropheEvent.assessment_shortfall_cents, admin_loading_cents, assessment_total_cents and one AssessmentAllocation row per assessable insurer"
    algorithm: tiered_pricing
    formula: |
      shortfall = event.uncovered_cents
      # PINNED: the loading band is keyed on the BARE SHORTFALL, before any loading is added.
      # It is NOT keyed on assessment_total_cents (that reading is circular and is wrong here).
      rate = LOADING_RATE_SMALL  if shortfall <  BAND_1_CENTS
             LOADING_RATE_MID    if shortfall <  BAND_2_CENTS
             LOADING_RATE_LARGE  otherwise
      admin_loading_cents   = round_half_up(shortfall * rate)
      assessment_total_cents = shortfall + admin_loading_cents

      assessable = ParticipatingInsurer rows with compliance_status IN {COMPLIANT, UNDER_REVIEW}
                   AND market_share_pct > 0
                   # NOTE: status WITHDRAWN insurers remain assessable - withdrawal from new business
                   # does not release an insurer from a post-event assessment. SANCTIONED insurers are
                   # excluded, because the program cannot lawfully collect from them.
      if assessable is empty: reject ERR_NO_ASSESSABLE_INSURERS
      denom = sum(market_share_pct over assessable)
      order assessable by market_share_pct DESC, created_at ASC and assign allocation_rank 1..N
      each row records market_share_pct_snapshot = the insurer's market_share_pct at levy time
      for rank 1..N-1: assessed_cents = round_half_up(assessment_total_cents * market_share_pct / denom), absorbs_remainder = false
      for rank N:      assessed_cents = assessment_total_cents - sum(assessed_cents of ranks 1..N-1), absorbs_remainder = true
      each assessed insurer's assessment_balance_cents += its assessed_cents
    input_set: |
      Reads every ParticipatingInsurer in the program, filtered as above. denom is the sum of the
      ASSESSABLE shares only - it is NOT 100 - so excluding a sanctioned insurer re-spreads its share
      across the remainder rather than leaving the assessment short.
    constants:
      LOADING_RATE_SMALL: 0.02
      LOADING_RATE_MID: 0.035
      LOADING_RATE_LARGE: 0.05
      BAND_1_CENTS: 10000000000
      BAND_2_CENTS: 50000000000
    precision: "integer cents; the last allocation_rank absorbs the rounding remainder so the allocations sum EXACTLY to assessment_total_cents"

  - name: take_up_rate_evaluation
    trigger: "POST /eqp/insurers/{id}/take-up-evaluation; writes ParticipatingInsurer.last_take_up_rate_bp, offers_recorded_count, undocumented_decline_count and can drive compliance_status COMPLIANT -> UNDER_REVIEW"
    algorithm: threshold
    formula: |
      considered = count of MandatoryOffer rows where insurer_id == insurer.id
                     AND status IN {ACCEPTED, DECLINED, EXPIRED}
                     AND window_start <= offered_at < window_end          # half-open window
      accepted   = the same set filtered to status == ACCEPTED
      undocumented = the same set filtered to status == DECLINED AND decline_documented == false
      take_up_rate_bp = 0 if considered == 0 else round_half_up(10000 * accepted / considered)
      last_take_up_rate_bp       = take_up_rate_bp
      offers_recorded_count      = considered
      undocumented_decline_count = undocumented
      # two independent triggers, both evaluated, sanction wins if both fire
      if undocumented >= UNDOCUMENTED_DECLINE_LIMIT:
          compliance_status = SANCTIONED                     # via the compliance state machine
      elif considered >= MIN_OFFER_SAMPLE and take_up_rate_bp < TAKE_UP_FLOOR_BP and compliance_status == COMPLIANT:
          compliance_status = UNDER_REVIEW
      # considered < MIN_OFFER_SAMPLE is statistically meaningless: no downgrade at any rate,
      # including the considered == 0 case where take_up_rate_bp is reported as 0.
    input_set: |
      Reads the insurer's MandatoryOffer rows only. PENDING offers are excluded from both numerator
      and denominator, so re-offering a previously DECLINED offer (DECLINED -> PENDING) REMOVES it
      from the denominator and can raise the measured rate; a reoffer also resets offered_at, which
      can move a row out of an earlier window entirely.
    constants:
      MIN_OFFER_SAMPLE: 4
      TAKE_UP_FLOOR_BP: 2500
      UNDOCUMENTED_DECLINE_LIMIT: 3
    precision: "basis points, integer; round half-up once"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; the LOWEST priority number
#     wins whenever a single request violates several rules)
#   Ladder: 1-3 authentication -> 4-5 existence -> 6-9 resource-scoped
#   authorization (ownership + segregation of duties) -> 10-13 request shape ->
#   14-15 optimistic concurrency -> 16-34 state preconditions ->
#   35-44 safety / compliance -> 45-51 referential integrity ->
#   52-57 uniqueness and count constraints -> 58-69 temporal conflicts ->
#   70-72 capacity -> 73-75 fiscal.
#   Error ids are the same tokens used by the 1.2 transition preconditions.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-Role header is present and names a role declared in 1.7"
    error_id: ERR_MISSING_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the X-Role role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-ID header is present on the segregation-of-duties endpoints"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: "POST /eqp/retrofit-grants/{id}/review, POST /eqp/retrofit-grants/{id}/reserve-funds, POST /eqp/inspections/{id}/record-result, POST /eqp/claims/{id}/adjust-provisional, POST /eqp/claims/{id}/finalize-adjustment"
  - priority: 4
    category: existence
    check: "every id in the path exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "every FK id in the request body exists (insurer_id, policyholder_id, dwelling_id, policy_id, accepted_offer_id, grant_cycle_id, grant_id, contractor_id, project_id, event_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all creating and linking endpoints"
  - priority: 6
    category: auth
    check: "a Policyholder-role caller may only read or act on Dwelling, Policy, MandatoryOffer, RetrofitGrant and Claim rows that resolve to its own policyholder_id; a ParticipatingInsurer-role caller only on rows that resolve to its own insurer_id; a CertifiedContractor-role caller only on RetrofitProject and Inspection rows whose contractor_id is its own"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all entity_backed-role reads and writes"
  - priority: 7
    category: auth
    check: "segregation of duties: the X-User-ID reserving cycle funds must differ from RetrofitGrant.approved_by_user_id - whoever approved an award cannot also commit the money"
    error_id: ERR_SOD_GRANT_REVIEWER_CONFLICT
    http_status: 403
    applies_to: "POST /eqp/retrofit-grants/{id}/reserve-funds"
  - priority: 8
    category: auth
    check: "segregation of duties: the X-User-ID recording an inspection result must differ from the approved_by_user_id of the grant that funds the inspected project - the approver cannot self-certify the work"
    error_id: ERR_SOD_INSPECTOR_CONFLICT
    http_status: 403
    applies_to: "POST /eqp/inspections/{id}/record-result"
  - priority: 9
    category: auth
    check: "segregation of duties: the X-User-ID finalizing an adjustment must differ from Claim.provisional_adjuster_user_id - a second adjuster must sign the final number"
    error_id: ERR_SOD_ADJUSTER_CONFLICT
    http_status: 403
    applies_to: "POST /eqp/claims/{id}/finalize-adjustment"
  - priority: 10
    category: business_constraint
    check: "every required body field is present and non-null"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 11
    category: business_constraint
    check: "enum fields are in domain: county_hazard_tier in {TIER_1,TIER_2,TIER_3}; soil_class in {ROCK,STIFF,SOFT,LIQUEFACTION}; structure_type in {WOOD_FRAME_SLAB,WOOD_FRAME_CRIPPLE_WALL,MASONRY_URM,MOBILE_HOME}; deductible_pct in {5,10,15,20,25}; income_tier in {TIER_LOW,TIER_MID,TIER_ANY}; scope codes in {CRIPPLE_WALL_BRACING,EARTHQUAKE_BRACING_SYSTEM,ANCHOR_BOLT_ONLY}; grant decision in {APPROVE,RETURN,DENY}; inspection result in {PASS,PARTIAL,FAIL}; policy lifecycle action in {LAPSE,EXPIRE_QUOTE}; compliance action in {SANCTION,REINSTATE,WITHDRAW}; contractor certification_status in {CERTIFIED,SUSPENDED}; offer response in {ACCEPT,DECLINE}; reinsurance layer status in {ACTIVE,LAPSED}"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "every creating and action endpoint carrying an enum field"
  - priority: 12
    category: business_constraint
    check: "numeric domains: all *_cents >= 0; dwelling_limit_cents in [5000000, 300000000]; total_pool_cents >= 100000; project_cost_estimate_cents > 0; record-payment amount_cents > 0; market_share_pct in [0,100]; magnitude in [4.0,9.5]; ceded_pct in (0,1]; layer_index >= 1; year_built in [1850,2026]"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /eqp/dwellings, POST /eqp/insurers, POST /eqp/grant-cycles, POST /eqp/catastrophe-events, POST /eqp/reinsurance-layers, POST /eqp/retrofit-grants, POST /eqp/claims, POST /eqp/claims/{id}/record-payment"
  - priority: 13
    category: business_temporal
    check: "every declared interval is non-empty: GrantCycle.opens_at < closes_at, take-up window_start < window_end, Inspection.window_start < window_end"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /eqp/grant-cycles, POST /eqp/insurers/{id}/take-up-evaluation, POST /eqp/inspections"
  - priority: 14
    category: business_constraint
    check: "expected_grant_cycle_version equals the current GrantCycle.version"
    error_id: ERR_STALE_GRANT_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /eqp/retrofit-grants/{id}/reserve-funds"
  - priority: 15
    category: business_constraint
    check: "expected_event_version equals the current CatastropheEvent.version"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /eqp/claims"
  - priority: 16
    category: state
    check: "MandatoryOffer.status == PENDING to respond to it or to expire it"
    error_id: ERR_OFFER_ALREADY_RESPONDED
    http_status: 409
    applies_to: "POST /eqp/mandatory-offers/{id}/respond, POST /eqp/mandatory-offers/{id}/expire"
  - priority: 17
    category: state
    check: "MandatoryOffer.status in {DECLINED, ACCEPTED} to reoffer; a PENDING or EXPIRED offer cannot be reoffered"
    error_id: ERR_OFFER_NOT_REOFFERABLE
    http_status: 409
    applies_to: "POST /eqp/mandatory-offers/{id}/reoffer"
  - priority: 18
    category: state
    check: "Policy.lifecycle_status == QUOTED to bind it or to expire its quote"
    error_id: ERR_POLICY_NOT_QUOTED
    http_status: 409
    applies_to: "POST /eqp/policies/{id}/bind, POST /eqp/policies/{id}/lifecycle-action with action=EXPIRE_QUOTE"
  - priority: 19
    category: state
    check: "Policy.lifecycle_status == ACTIVE to renew, cancel, lapse, revoke a discount, or file a claim against it"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /eqp/policies/{id}/renew, POST /eqp/policies/{id}/cancel, POST /eqp/policies/{id}/lifecycle-action with action=LAPSE, POST /eqp/policies/{id}/revoke-mitigation-discount, POST /eqp/claims"
  - priority: 20
    category: state
    check: "Policy.mitigation_status == DISCOUNT_APPLIED and Policy.mitigation_discount_cents > 0 to revoke the mitigation discount"
    error_id: ERR_NO_MITIGATION_DISCOUNT
    http_status: 409
    applies_to: "POST /eqp/policies/{id}/revoke-mitigation-discount"
  - priority: 21
    category: state
    check: "GrantCycle.status == OPEN to submit a grant into it or to reserve funds from it"
    error_id: ERR_GRANT_CYCLE_CLOSED
    http_status: 409
    applies_to: "POST /eqp/retrofit-grants, POST /eqp/retrofit-grants/{id}/reserve-funds"
  - priority: 22
    category: state
    check: "the RetrofitGrant is in the status the action requires: SUBMITTED to begin-review, UNDER_REVIEW to review, RETURNED_FOR_INFO to resubmit, APPROVED to reserve-funds, and any of {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED, FUNDS_RESERVED} to withdraw"
    error_id: ERR_GRANT_INVALID_STATE
    http_status: 409
    applies_to: "POST /eqp/retrofit-grants/{id}/begin-review, POST /eqp/retrofit-grants/{id}/review, POST /eqp/retrofit-grants/{id}/resubmit, POST /eqp/retrofit-grants/{id}/reserve-funds, POST /eqp/retrofit-grants/{id}/withdraw"
  - priority: 23
    category: state
    check: "the RetrofitProject is in the status the action requires: SCHEDULED or REWORK_REQUIRED to start-work, IN_PROGRESS to request-inspection, AWAITING_INSPECTION when an Inspection is created against it, and any of {SCHEDULED, IN_PROGRESS, AWAITING_INSPECTION, REWORK_REQUIRED} to abandon"
    error_id: ERR_PROJECT_INVALID_STATE
    http_status: 409
    applies_to: "POST /eqp/retrofit-projects/{id}/start-work, POST /eqp/retrofit-projects/{id}/request-inspection, POST /eqp/retrofit-projects/{id}/abandon, POST /eqp/inspections"
  - priority: 24
    category: state
    check: "Inspection.result == PENDING to record a result"
    error_id: ERR_INSPECTION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /eqp/inspections/{id}/record-result"
  - priority: 25
    category: state
    check: "CatastropheEvent.status == MONITORING to declare it"
    error_id: ERR_EVENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /eqp/catastrophe-events/{id}/declare"
  - priority: 26
    category: state
    check: "CatastropheEvent.status != CLOSED for any operation that touches the event's loss aggregate"
    error_id: ERR_EVENT_CLOSED
    http_status: 409
    applies_to: "POST /eqp/claims, POST /eqp/claims/{id}/finalize-adjustment, POST /eqp/claims/{id}/reopen, POST /eqp/catastrophe-events/{id}/levy-assessment, POST /eqp/catastrophe-events/{id}/close"
  - priority: 27
    category: state
    check: "CatastropheEvent.status != ASSESSMENT_LEVIED for any operation that would move the loss aggregate after the assessment was struck - the allocations are already published"
    error_id: ERR_EVENT_ASSESSMENT_LOCKED
    http_status: 409
    applies_to: "POST /eqp/claims, POST /eqp/claims/{id}/finalize-adjustment, POST /eqp/claims/{id}/reopen, POST /eqp/catastrophe-events/{id}/levy-assessment"
  - priority: 28
    category: state
    check: "CatastropheEvent.status in {DECLARED, LOSS_AGGREGATION, CAPACITY_EXHAUSTED} to file a claim against it - an event still MONITORING accepts no claims"
    error_id: ERR_EVENT_NOT_DECLARED
    http_status: 409
    applies_to: "POST /eqp/claims"
  - priority: 29
    category: state
    check: "CatastropheEvent.status == CAPACITY_EXHAUSTED to levy an assessment"
    error_id: ERR_EVENT_CAPACITY_NOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /eqp/catastrophe-events/{id}/levy-assessment"
  - priority: 30
    category: state
    check: "every Claim of the event is in a terminal adjustment_status (CLOSED or DENIED) to close the event"
    error_id: ERR_EVENT_HAS_OPEN_CLAIMS
    http_status: 409
    applies_to: "POST /eqp/catastrophe-events/{id}/close"
  - priority: 31
    category: state
    check: "the Claim is in the status the action requires: FNOL_RECEIVED to adjust-provisional or deny, PROVISIONAL_ADJUSTED to finalize, PROVISIONAL_ADJUSTED or FINAL_ADJUSTED to record a payment, FINAL_ADJUSTED to reopen"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /eqp/claims/{id}/adjust-provisional, POST /eqp/claims/{id}/deny, POST /eqp/claims/{id}/finalize-adjustment, POST /eqp/claims/{id}/record-payment, POST /eqp/claims/{id}/reopen"
  - priority: 32
    category: state
    check: "Claim.payment_status == UNPAID or PARTIALLY_PAID to reopen - a fully settled claim cannot be reopened"
    error_id: ERR_CLAIM_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /eqp/claims/{id}/reopen"
  - priority: 33
    category: business_constraint
    check: "Claim.reopen_count < MAX_REOPENS (2) to reopen a finalized claim"
    error_id: ERR_CLAIM_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /eqp/claims/{id}/reopen"
  - priority: 34
    category: state
    check: "Claim.payment_status == PAID to close the claim"
    error_id: ERR_CLAIM_NOT_FULLY_PAID
    http_status: 409
    applies_to: "POST /eqp/claims/{id}/close"
  - priority: 35
    category: business_safety
    check: "ParticipatingInsurer.compliance_status != SANCTIONED to make a mandatory offer through that insurer, to quote, to bind or to renew"
    error_id: ERR_INSURER_SANCTIONED
    http_status: 409
    applies_to: "POST /eqp/mandatory-offers, POST /eqp/policies, POST /eqp/policies/{id}/bind, POST /eqp/policies/{id}/renew"
  - priority: 36
    category: business_safety
    check: "ParticipatingInsurer.status == ACTIVE to write NEW business through that insurer (offers, quotes, binds); a WITHDRAWN insurer may still renew its in-force book and remains assessable"
    error_id: ERR_INSURER_WITHDRAWN
    http_status: 409
    applies_to: "POST /eqp/mandatory-offers, POST /eqp/policies, POST /eqp/policies/{id}/bind"
  - priority: 37
    category: state
    check: "ParticipatingInsurer.compliance_status == SANCTIONED to apply compliance action REINSTATE, and == UNDER_REVIEW to apply SANCTION"
    error_id: ERR_INSURER_NOT_SANCTIONED
    http_status: 409
    applies_to: "POST /eqp/insurers/{id}/compliance-action"
  - priority: 38
    category: state
    check: "ParticipatingInsurer.status == ACTIVE to apply compliance action WITHDRAW"
    error_id: ERR_INSURER_ALREADY_WITHDRAWN
    http_status: 409
    applies_to: "POST /eqp/insurers/{id}/compliance-action"
  - priority: 39
    category: business_safety
    check: "the Contractor.certification_status == CERTIFIED when a project is created for it and again when an inspection is scheduled for that project - a PROBATION or SUSPENDED contractor can neither take on nor be inspected for retrofit work"
    error_id: ERR_CONTRACTOR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /eqp/retrofit-projects, POST /eqp/inspections"
  - priority: 40
    category: business_safety
    check: "Contractor.certification_expires_at > the current logical clock when a project is created for it and when an inspection is scheduled"
    error_id: ERR_CONTRACTOR_CERTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /eqp/retrofit-projects, POST /eqp/inspections"
  - priority: 41
    category: state
    check: "the requested certification_status is reachable from the current one: SUSPENDED only from CERTIFIED, CERTIFIED only from PROBATION or SUSPENDED (PROBATION itself is never set by this endpoint - only the FAIL cascade sets it)"
    error_id: ERR_CONTRACTOR_INVALID_CERTIFICATION_TRANSITION
    http_status: 409
    applies_to: "POST /eqp/contractors/{id}/certification"
  - priority: 42
    category: business_safety
    check: "recording result=PASS requires the inspected RetrofitProject.scope_code to appear in the inspecting Contractor.certified_scopes - work outside a contractor's certified scopes cannot be verified"
    error_id: ERR_RETROFIT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /eqp/inspections/{id}/record-result"
  - priority: 43
    category: business_safety
    check: "CatastropheEvent.magnitude >= DECLARATION_MIN_MAGNITUDE (5.0) to declare the event"
    error_id: ERR_MAGNITUDE_BELOW_DECLARATION_FLOOR
    http_status: 422
    applies_to: "POST /eqp/catastrophe-events/{id}/declare"
  - priority: 44
    category: business_safety
    check: "the Dwelling.structure_type must have a non-zero SCOPE_COST_CAP to receive an award - WOOD_FRAME_SLAB and MASONRY_URM are outside the retrofit program"
    error_id: ERR_STRUCTURE_NOT_GRANT_ELIGIBLE
    http_status: 422
    applies_to: "POST /eqp/retrofit-grants/{id}/review"
  - priority: 45
    category: business_referential
    check: "Policy.accepted_offer_id must name a MandatoryOffer whose status == ACCEPTED and whose insurer_id and dwelling_id match the policy's - checked at quote time, again at bind AND again at every renewal, so a reoffer (ACCEPTED -> PENDING) blocks the renewal until the policyholder re-accepts"
    error_id: ERR_MANDATORY_OFFER_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /eqp/policies, POST /eqp/policies/{id}/bind, POST /eqp/policies/{id}/renew"
  - priority: 46
    category: business_referential
    check: "MandatoryOffer.policyholder_id must equal Dwelling[dwelling_id].policyholder_id, and RetrofitGrant.policy_id (when supplied) must name a Policy whose dwelling_id equals the grant's dwelling_id"
    error_id: ERR_DWELLING_OWNER_MISMATCH
    http_status: 422
    applies_to: "POST /eqp/mandatory-offers, POST /eqp/retrofit-grants"
  - priority: 47
    category: business_referential
    check: "RetrofitProject.grant_id must name a RetrofitGrant in status FUNDS_RESERVED - work cannot start on money that is only approved"
    error_id: ERR_GRANT_FUNDS_NOT_RESERVED
    http_status: 409
    applies_to: "POST /eqp/retrofit-projects"
  - priority: 48
    category: business_referential
    check: "an Inspection is created only against a RetrofitProject in AWAITING_INSPECTION, and its contractor_id is copied from that project (a caller-supplied contractor_id that disagrees is rejected)"
    error_id: ERR_INSPECTION_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /eqp/inspections"
  - priority: 49
    category: business_referential
    check: "the CatastropheEvent's treaty_year must have at least one ReinsuranceLayer row with status == ACTIVE before the event can be declared and before claims can be filed against it"
    error_id: ERR_NO_REINSURANCE_PROGRAM
    http_status: 409
    applies_to: "POST /eqp/catastrophe-events/{id}/declare, POST /eqp/claims"
  - priority: 50
    category: business_referential
    check: "a ReinsuranceLayer's layer_index must be unique within its treaty_year"
    error_id: ERR_DUPLICATE_LAYER_INDEX
    http_status: 409
    applies_to: "POST /eqp/reinsurance-layers"
  - priority: 51
    category: business_referential
    check: "a ReinsuranceLayer with layer_index > 1 must attach at or above the previous index's attachment_point_cents + limit_cents within the same treaty_year (no downward-overlapping towers)"
    error_id: ERR_LAYER_ATTACHMENT_GAP
    http_status: 422
    applies_to: "POST /eqp/reinsurance-layers"
  - priority: 52
    category: business_constraint
    check: "at most one Policy per dwelling_id in lifecycle_status ACTIVE or QUOTED"
    error_id: ERR_DUPLICATE_ACTIVE_POLICY
    http_status: 409
    applies_to: "POST /eqp/policies, POST /eqp/policies/{id}/bind"
  - priority: 53
    category: business_constraint
    check: "at most one MandatoryOffer per (insurer_id, dwelling_id) in status PENDING"
    error_id: ERR_DUPLICATE_PENDING_OFFER
    http_status: 409
    applies_to: "POST /eqp/mandatory-offers, POST /eqp/mandatory-offers/{id}/reoffer"
  - priority: 54
    category: business_constraint
    check: "at most one RetrofitGrant per dwelling_id in a non-terminal status {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED, FUNDS_RESERVED}"
    error_id: ERR_DUPLICATE_OPEN_GRANT
    http_status: 409
    applies_to: "POST /eqp/retrofit-grants"
  - priority: 55
    category: business_constraint
    check: "at most one Claim per (policy_id, event_id) whose adjustment_status is not DENIED"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /eqp/claims"
  - priority: 56
    category: business_constraint
    check: "RetrofitGrant.review_round < MAX_REVIEW_ROUNDS (3) to return the grant for more information again"
    error_id: ERR_GRANT_REVIEW_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /eqp/retrofit-grants/{id}/review"
  - priority: 57
    category: business_constraint
    check: "a Contractor may hold at most MAX_OPEN_PROJECTS_PER_CONTRACTOR (3) RetrofitProject rows in status {SCHEDULED, IN_PROGRESS, AWAITING_INSPECTION, REWORK_REQUIRED}"
    error_id: ERR_CONTRACTOR_PROJECT_CAP
    http_status: 409
    applies_to: "POST /eqp/retrofit-projects"
  - priority: 58
    category: business_temporal
    check: "the Inspection window length (window_end - window_start) is between INSPECTION_MIN_MINUTES (30) and INSPECTION_MAX_MINUTES (240) inclusive"
    error_id: ERR_INSPECTION_DURATION_INVALID
    http_status: 422
    applies_to: "POST /eqp/inspections"
  - priority: 59
    category: business_temporal
    check: "Inspection.window_start >= the current logical clock"
    error_id: ERR_INSPECTION_IN_PAST
    http_status: 422
    applies_to: "POST /eqp/inspections"
  - priority: 60
    category: business_temporal
    check: "no Contractor double-booking: the requested half-open window [window_start, window_end), widened by INSPECTION_BUFFER_MINUTES (60) on BOTH sides, must not intersect the half-open window of any existing Inspection with result == PENDING for the same contractor_id whose RetrofitProject.status != ABANDONED"
    error_id: ERR_INSPECTION_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /eqp/inspections"
  - priority: 61
    category: business_temporal
    check: "the current logical clock is >= Inspection.window_start to record a result - an inspector cannot report on a visit that has not started"
    error_id: ERR_INSPECTION_WINDOW_NOT_REACHED
    http_status: 409
    applies_to: "POST /eqp/inspections/{id}/record-result"
  - priority: 62
    category: business_temporal
    check: "no GrantCycle window collision: the CLOSED interval [opens_at, closes_at] must not intersect that of any other GrantCycle with the same program_track, in ANY status (a CLOSED cycle still reserves its historical window) - two cycles that merely touch endpoints DO collide, and there is no buffer"
    error_id: ERR_GRANT_CYCLE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /eqp/grant-cycles"
  - priority: 63
    category: business_temporal
    check: "the current logical clock is < Policy.quote_expires_at (quoted_at + QUOTE_VALID_DAYS = 30 days) to bind the quote"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /eqp/policies/{id}/bind"
  - priority: 64
    category: business_temporal
    check: "the current logical clock is >= Policy.quote_expires_at to expire the quote administratively"
    error_id: ERR_QUOTE_STILL_VALID
    http_status: 409
    applies_to: "POST /eqp/policies/{id}/lifecycle-action with action=EXPIRE_QUOTE"
  - priority: 65
    category: business_temporal
    check: "the current logical clock is < MandatoryOffer.expires_at (offered_at + OFFER_VALID_DAYS = 60 days) to respond to the offer"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /eqp/mandatory-offers/{id}/respond"
  - priority: 66
    category: business_temporal
    check: "the current logical clock is >= MandatoryOffer.expires_at to expire the offer administratively"
    error_id: ERR_OFFER_STILL_VALID
    http_status: 409
    applies_to: "POST /eqp/mandatory-offers/{id}/expire"
  - priority: 67
    category: business_temporal
    check: "the current logical clock is inside [Policy.expires_at - RENEWAL_WINDOW_DAYS (45 days), Policy.expires_at) to renew"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /eqp/policies/{id}/renew"
  - priority: 68
    category: business_temporal
    check: "binding moratorium: no CatastropheEvent with status in {DECLARED, LOSS_AGGREGATION, CAPACITY_EXHAUSTED, ASSESSMENT_LEVIED} may have epicenter_county_code == Policyholder[policy.policyholder_id].county_code with the clock still inside the half-open window [occurred_at, occurred_at + MORATORIUM_DAYS (60 days))"
    error_id: ERR_BINDING_MORATORIUM
    http_status: 409
    applies_to: "POST /eqp/policies/{id}/bind"
  - priority: 69
    category: business_temporal
    check: "the event must have struck inside the policy term: CatastropheEvent.occurred_at in [Policy.effective_at, Policy.expires_at)"
    error_id: ERR_POLICY_NOT_IN_FORCE_AT_EVENT
    http_status: 409
    applies_to: "POST /eqp/claims"
  - priority: 71
    category: business_constraint
    check: "at least one ParticipatingInsurer is assessable (compliance_status in {COMPLIANT, UNDER_REVIEW} AND market_share_pct > 0)"
    error_id: ERR_NO_ASSESSABLE_INSURERS
    http_status: 409
    applies_to: "POST /eqp/catastrophe-events/{id}/levy-assessment"
  - priority: 72
    category: business_constraint
    check: "the grant's income_tier bucket, or the TIER_ANY fallback bucket, must have room for the award (grant_pool_waterfall steps 1-2)"
    error_id: ERR_GRANT_TIER_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /eqp/retrofit-grants/{id}/reserve-funds"
  - priority: 73
    category: business_fiscal
    check: "GrantCycle.reserved_cents + disbursed_cents + approved_amount_cents <= total_pool_cents - evaluated AFTER a tier bucket has been resolved, so a bucket with room can still hit the pool ceiling"
    error_id: ERR_GRANT_CYCLE_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /eqp/retrofit-grants/{id}/reserve-funds"
  - priority: 74
    category: business_fiscal
    check: "contents_sublimit_cents and loss_of_use_sublimit_cents must each be <= the dwelling's dwelling_limit_cents"
    error_id: ERR_SUBLIMIT_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /eqp/policies"
  - priority: 75
    category: business_fiscal
    check: "a payment amount_cents must be > 0 and <= Claim.payable_cents - Claim.paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_PAYABLE
    http_status: 422
    applies_to: "POST /eqp/claims/{id}/record-payment"
  - priority: 76
    category: state
    check: "Dwelling.retrofit_status != VERIFIED to self-declare a retrofit - an inspection-verified retrofit cannot be overwritten by an attestation. This rule is the only rule that can fire on its endpoint, so its ladder position carries no priority-conflict meaning."
    error_id: ERR_RETROFIT_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /eqp/dwellings/{id}/declare-retrofit"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table   (api_prefix /eqp on every path)
#   Every FK declared in 1.1 is reverse-reachable through a filtered list that
#   returns the child collection. Optional inputs carry a trailing "?".
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/eqp/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline in this domain (quote expiry, offer expiry, renewal window, binding moratorium, inspection windows, grant-cycle windows, certification expiry) is evaluated against this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["no entity is written; subsequent temporal validations read the new instant"]

  - method: POST
    path: "/eqp/insurers"
    description: "Enroll a participating insurer into the residual-market program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, naic_code, market_share_pct]
    output: ParticipatingInsurer
    side_effects: ["status = ACTIVE; compliance_status = COMPLIANT; all counters start at 0"]
  - method: GET
    path: "/eqp/insurers/{id}"
    description: "Read one participating insurer, including its take-up and assessment counters"
    roles: [ProgramAdmin, ParticipatingInsurer]
    code: 200
    input: []
    output: ParticipatingInsurer
    side_effects: []
  - method: GET
    path: "/eqp/insurers"
    description: "List participating insurers, filterable by compliance and participation status"
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "compliance_status?", "limit?", "offset?"]
    output: ParticipatingInsurer[]
    side_effects: []
  - method: POST
    path: "/eqp/insurers/{id}/compliance-action"
    description: "Apply a regulator action to the insurer: SANCTION, REINSTATE or WITHDRAW"
    roles: [ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: ParticipatingInsurer
    side_effects: ["compliance_status or status transition per 1.2; SANCTION removes the insurer from the assessable pool while WITHDRAW does not"]
  - method: POST
    path: "/eqp/insurers/{id}/take-up-evaluation"
    description: "Score the insurer's mandatory-offer take-up rate over a half-open window and apply the compliance consequence"
    roles: [ProgramAdmin]
    code: 200
    input: [window_start, window_end]
    output: ParticipatingInsurer
    side_effects: ["take_up_rate_evaluation; last_take_up_rate_bp, offers_recorded_count and undocumented_decline_count are rewritten; compliance_status may move COMPLIANT -> UNDER_REVIEW or UNDER_REVIEW -> SANCTIONED"]

  - method: POST
    path: "/eqp/policyholders"
    description: "Register a residential policyholder, optionally tagged with the public-education campaign that reached them"
    roles: [ProgramAdmin, ParticipatingInsurer]
    code: 201
    input: [full_name, email, county_code, "outreach_campaign_code?"]
    output: Policyholder
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/eqp/policyholders/{id}"
    description: "Read one policyholder"
    roles: [ProgramAdmin, ParticipatingInsurer, Policyholder]
    code: 200
    input: []
    output: Policyholder
    side_effects: []
  - method: GET
    path: "/eqp/policyholders"
    description: "List policyholders, filterable by county and outreach campaign"
    roles: [ProgramAdmin]
    code: 200
    input: ["county_code?", "outreach_campaign_code?", "limit?", "offset?"]
    output: Policyholder[]
    side_effects: []

  - method: POST
    path: "/eqp/dwellings"
    description: "Record a dwelling with its hazard characteristics (county tier, soil class, structure type, vintage, Coverage A limit)"
    roles: [ProgramAdmin, Policyholder]
    code: 201
    input: [policyholder_id, street_address, county_hazard_tier, soil_class, structure_type, year_built, dwelling_limit_cents]
    output: Dwelling
    side_effects: ["retrofit_status = NONE; verified_retrofit_scope = null; grant_lifetime_count = 0"]
  - method: GET
    path: "/eqp/dwellings/{id}"
    description: "Read one dwelling and its current retrofit status"
    roles: [ProgramAdmin, ParticipatingInsurer, Policyholder, GrantReviewer, FieldInspector]
    code: 200
    input: []
    output: Dwelling
    side_effects: []
  - method: GET
    path: "/eqp/dwellings"
    description: "List dwellings; filter by owner, structure type or retrofit status"
    roles: [ProgramAdmin, ParticipatingInsurer, Policyholder]
    code: 200
    input: ["policyholder_id?", "structure_type?", "retrofit_status?", "limit?", "offset?"]
    output: Dwelling[]
    side_effects: []
  - method: POST
    path: "/eqp/dwellings/{id}/declare-retrofit"
    description: "Policyholder self-attests to a completed retrofit scope with no inspection behind it. This is the ONLY way to reach retrofit_status = SELF_DECLARED, which the QUOTE_TIME rating variant honors and the RENEWAL_TIME variant discards."
    roles: [Policyholder]
    code: 200
    input: [declared_scope]
    output: Dwelling
    side_effects: ["retrofit_status NONE -> SELF_DECLARED; verified_retrofit_scope = declared_scope; rejected when retrofit_status is already VERIFIED"]

  - method: POST
    path: "/eqp/mandatory-offers"
    description: "Record the statutorily mandatory earthquake offer an insurer must extend to a residential policyholder"
    roles: [ParticipatingInsurer, ProgramAdmin]
    code: 201
    input: [insurer_id, policyholder_id, dwelling_id, "campaign_code?"]
    output: MandatoryOffer
    side_effects: ["status = PENDING; offered_at = clock_now; expires_at = offered_at + OFFER_VALID_DAYS (60); offer_round = 1; insurer.offers_recorded_count += 1"]
  - method: POST
    path: "/eqp/mandatory-offers/{id}/respond"
    description: "Policyholder accepts or declines the mandatory offer; a decline may be recorded as documented or undocumented"
    roles: [Policyholder]
    code: 200
    input: [response, "decline_documented?"]
    output: MandatoryOffer
    side_effects: ["status PENDING -> ACCEPTED or DECLINED; responded_at = clock_now; decline_documented defaults to false on a DECLINE"]
  - method: POST
    path: "/eqp/mandatory-offers/{id}/reoffer"
    description: "Insurer re-extends a previously declined or accepted offer, restarting the acceptance window. Reoffering an ACCEPTED offer un-accepts it and therefore blocks the renewal of any policy that names it."
    roles: [ParticipatingInsurer, ProgramAdmin]
    code: 200
    input: []
    output: MandatoryOffer
    side_effects: ["status DECLINED|ACCEPTED -> PENDING; offer_round += 1; offered_at = clock_now; expires_at = clock_now + OFFER_VALID_DAYS; responded_at = null; decline_documented = false; the row leaves the take-up denominator until it is answered again"]
  - method: POST
    path: "/eqp/mandatory-offers/{id}/expire"
    description: "Administratively expire an unanswered offer once its window has passed"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MandatoryOffer
    side_effects: ["status PENDING -> EXPIRED; the row counts in the take-up denominator but never in the numerator"]
  - method: GET
    path: "/eqp/mandatory-offers/{id}"
    description: "Read one mandatory offer"
    roles: [ProgramAdmin, ParticipatingInsurer, Policyholder]
    code: 200
    input: []
    output: MandatoryOffer
    side_effects: []
  - method: GET
    path: "/eqp/mandatory-offers"
    description: "List mandatory offers; filter by insurer, policyholder, dwelling or status"
    roles: [ProgramAdmin, ParticipatingInsurer, Policyholder]
    code: 200
    input: ["insurer_id?", "policyholder_id?", "dwelling_id?", "status?", "campaign_code?", "limit?", "offset?"]
    output: MandatoryOffer[]
    side_effects: []

  - method: POST
    path: "/eqp/policies"
    description: "Quote an earthquake policy against an accepted mandatory offer, rating the dwelling's hazard at QUOTE_TIME"
    roles: [ParticipatingInsurer, ProgramAdmin]
    code: 201
    input: [dwelling_id, insurer_id, accepted_offer_id, deductible_pct, contents_sublimit_cents, loss_of_use_sublimit_cents]
    output: Policy
    side_effects: ["hazard_base_premium variant QUOTE_TIME; rating_variant = QUOTE_TIME; rated_dwelling_limit_cents snapshots the dwelling limit; annual_premium_cents = base_premium_cents; lifecycle_status = QUOTED; mitigation_status = UNMITIGATED; quote_expires_at = clock_now + QUOTE_VALID_DAYS (30); term_number = 1"]
  - method: POST
    path: "/eqp/policies/{id}/bind"
    description: "Bind the quoted policy into force for a 365-day term"
    roles: [ParticipatingInsurer]
    code: 200
    input: []
    output: Policy
    side_effects: ["lifecycle_status QUOTED -> ACTIVE; effective_at = clock_now; expires_at = effective_at + TERM_DAYS (365); insurer.policies_bound_count += 1"]
  - method: POST
    path: "/eqp/policies/{id}/renew"
    description: "Renew the in-force policy for another term, re-rating the dwelling at RENEWAL_TIME"
    roles: [ParticipatingInsurer, ProgramAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: ["lifecycle_status ACTIVE -> ACTIVE; term_number += 1; effective_at = old expires_at; expires_at = effective_at + TERM_DAYS; rated_dwelling_limit_cents re-snapshotted; hazard_base_premium variant RENEWAL_TIME; rating_variant = RENEWAL_TIME; a SELF_DECLARED retrofit loses its credit; mitigation_status DISCOUNT_APPLIED -> RETROFIT_VERIFIED with mitigation_discount_cents reset to 0 and prorated_credit_cents reset to 0"]
  - method: POST
    path: "/eqp/policies/{id}/cancel"
    description: "Cancel the in-force policy"
    roles: [ParticipatingInsurer, ProgramAdmin, Policyholder]
    code: 200
    input: ["reason?"]
    output: Policy
    side_effects: ["lifecycle_status ACTIVE -> CANCELLED (terminal)"]
  - method: POST
    path: "/eqp/policies/{id}/lifecycle-action"
    description: "Administrative lifecycle move: LAPSE an in-force policy for non-payment, or EXPIRE_QUOTE once the quote window has closed"
    roles: [ProgramAdmin]
    code: 200
    input: [action]
    output: Policy
    side_effects: ["lifecycle_status ACTIVE -> LAPSED, or QUOTED -> QUOTE_EXPIRED; both targets are terminal"]
  - method: POST
    path: "/eqp/policies/{id}/revoke-mitigation-discount"
    description: "Revoke a mitigation discount that was granted on a retrofit later found deficient; the premium returns to its undiscounted base"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Policy
    side_effects: ["mitigation_status DISCOUNT_APPLIED -> UNMITIGATED; mitigation_discount_cents = 0; prorated_credit_cents = 0; annual_premium_cents = base_premium_cents (the compensating premium-ledger invariant)"]
  - method: GET
    path: "/eqp/policies/{id}"
    description: "Read one policy with its rating, discount and term fields"
    roles: [ProgramAdmin, ParticipatingInsurer, Policyholder, ClaimAdjuster, GrantReviewer]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/eqp/policies"
    description: "List policies; filter by dwelling, insurer, policyholder, the accepted offer behind them, or either state dimension"
    roles: [ProgramAdmin, ParticipatingInsurer, Policyholder, ClaimAdjuster]
    code: 200
    input: ["dwelling_id?", "insurer_id?", "policyholder_id?", "accepted_offer_id?", "lifecycle_status?", "mitigation_status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: POST
    path: "/eqp/grant-cycles"
    description: "Open a funding cycle for one retrofit program track with a fixed money pool and a closed application window"
    roles: [ProgramAdmin]
    code: 201
    input: [program_track, label, opens_at, closes_at, total_pool_cents]
    output: GrantCycle
    side_effects: ["status = OPEN; reserved_cents = 0; disbursed_cents = 0; uncommitted_cents = total_pool_cents; version = 1"]
  - method: POST
    path: "/eqp/grant-cycles/{id}/close"
    description: "Close a funding cycle to further applications and reservations"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GrantCycle
    side_effects: ["status OPEN -> CLOSED; version += 1; already-reserved grants stay reserved"]
  - method: GET
    path: "/eqp/grant-cycles/{id}"
    description: "Read one funding cycle with its pool ledger (uncommitted / reserved / disbursed) and version"
    roles: [ProgramAdmin, GrantReviewer, Policyholder]
    code: 200
    input: []
    output: GrantCycle
    side_effects: []
  - method: GET
    path: "/eqp/grant-cycles"
    description: "List funding cycles by program track and status"
    roles: [ProgramAdmin, GrantReviewer]
    code: 200
    input: ["program_track?", "status?", "limit?", "offset?"]
    output: GrantCycle[]
    side_effects: []

  - method: POST
    path: "/eqp/retrofit-grants"
    description: "Submit a retrofit grant application for a dwelling against an open funding cycle"
    roles: [Policyholder, ProgramAdmin]
    code: 201
    input: [dwelling_id, grant_cycle_id, income_tier, project_cost_estimate_cents, requested_scope, "policy_id?"]
    output: RetrofitGrant
    side_effects: ["status = SUBMITTED; review_round = 0; approved_amount_cents = 0; dwelling.grant_lifetime_count += 1"]
  - method: POST
    path: "/eqp/retrofit-grants/{id}/begin-review"
    description: "Grant reviewer takes the application up for review"
    roles: [GrantReviewer, ProgramAdmin]
    code: 200
    input: []
    output: RetrofitGrant
    side_effects: ["status SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/eqp/retrofit-grants/{id}/review"
    description: "Record the review decision: APPROVE (which computes the award), RETURN for more information, or DENY"
    roles: [GrantReviewer]
    code: 200
    input: [decision, "denial_reason?", "info_request?"]
    output: RetrofitGrant
    side_effects: ["grant_award_amount on APPROVE; approved_by_user_id = X-User-ID; status UNDER_REVIEW -> APPROVED | RETURNED_FOR_INFO (review_round += 1) | DENIED"]
  - method: POST
    path: "/eqp/retrofit-grants/{id}/resubmit"
    description: "Applicant answers the information request and puts the application back in the queue"
    roles: [Policyholder, ProgramAdmin]
    code: 200
    input: ["project_cost_estimate_cents?"]
    output: RetrofitGrant
    side_effects: ["status RETURNED_FOR_INFO -> SUBMITTED; project_cost_estimate_cents overwritten when supplied"]
  - method: POST
    path: "/eqp/retrofit-grants/{id}/reserve-funds"
    description: "Commit cycle money to the approved award. Optimistically concurrent on the funding cycle: expected_grant_cycle_version must match."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_grant_cycle_version]
    output: RetrofitGrant
    side_effects: ["grant_pool_waterfall; funded_from_bucket set; reserved_by_user_id = X-User-ID; status APPROVED -> FUNDS_RESERVED; cycle.reserved_cents += award; cycle.uncommitted_cents recomputed; cycle.version += 1; cascade: Policy[grant.policy_id].mitigation_status UNMITIGATED -> RETROFIT_PENDING"]
  - method: POST
    path: "/eqp/retrofit-grants/{id}/withdraw"
    description: "Withdraw the application or the reservation, releasing any committed money back to the cycle"
    roles: [ProgramAdmin, Policyholder]
    code: 200
    input: ["reason?"]
    output: RetrofitGrant
    side_effects: ["status SUBMITTED|FUNDS_RESERVED -> WITHDRAWN; from FUNDS_RESERVED: cycle.reserved_cents -= award, cycle.uncommitted_cents recomputed, cycle.version += 1, the tier bucket usage is released, and Policy.mitigation_status RETROFIT_PENDING -> UNMITIGATED"]
  - method: GET
    path: "/eqp/retrofit-grants/{id}"
    description: "Read one grant application with its award, funding bucket and review round"
    roles: [ProgramAdmin, GrantReviewer, Policyholder, FieldInspector]
    code: 200
    input: []
    output: RetrofitGrant
    side_effects: []
  - method: GET
    path: "/eqp/retrofit-grants"
    description: "List grant applications; filter by dwelling, policy, funding cycle, status or income tier"
    roles: [ProgramAdmin, GrantReviewer, Policyholder]
    code: 200
    input: ["dwelling_id?", "policy_id?", "grant_cycle_id?", "status?", "income_tier?", "funded_from_bucket?", "limit?", "offset?"]
    output: RetrofitGrant[]
    side_effects: []

  - method: POST
    path: "/eqp/contractors"
    description: "Certify a retrofit contractor for a set of retrofit scopes"
    roles: [ProgramAdmin]
    code: 201
    input: [business_name, license_no, certified_scopes, certification_expires_at]
    output: Contractor
    side_effects: ["certification_status = CERTIFIED; open_project_count = 0; failed_inspection_count = 0"]
  - method: POST
    path: "/eqp/contractors/{id}/certification"
    description: "Suspend or reinstate a contractor's certification"
    roles: [ProgramAdmin]
    code: 200
    input: [certification_status, "reason?", "certification_expires_at?"]
    output: Contractor
    side_effects: ["certification_status transition per 1.2; failed_inspection_count is never reset - it is a cumulative audit counter; certification_expires_at is overwritten when supplied"]
  - method: GET
    path: "/eqp/contractors/{id}"
    description: "Read one contractor with its certified scopes and inspection history counters"
    roles: [ProgramAdmin, GrantReviewer, FieldInspector, CertifiedContractor, Policyholder]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/eqp/contractors"
    description: "List contractors by certification status"
    roles: [ProgramAdmin, GrantReviewer, FieldInspector, Policyholder]
    code: 200
    input: ["certification_status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []

  - method: POST
    path: "/eqp/retrofit-projects"
    description: "Assign the funded retrofit work to a certified contractor"
    roles: [ProgramAdmin, CertifiedContractor]
    code: 201
    input: [grant_id, contractor_id]
    output: RetrofitProject
    side_effects: ["status = SCHEDULED; scope_code copied from grant.requested_scope; inspection_attempts = 0; contractor.open_project_count += 1"]
  - method: POST
    path: "/eqp/retrofit-projects/{id}/start-work"
    description: "Contractor starts (or restarts after rework) the retrofit work"
    roles: [CertifiedContractor, ProgramAdmin]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: ["status SCHEDULED|REWORK_REQUIRED -> IN_PROGRESS; started_at = clock_now on the first start only"]
  - method: POST
    path: "/eqp/retrofit-projects/{id}/request-inspection"
    description: "Contractor declares the work ready for verification"
    roles: [CertifiedContractor]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: ["status IN_PROGRESS -> AWAITING_INSPECTION"]
  - method: POST
    path: "/eqp/retrofit-projects/{id}/abandon"
    description: "Abandon a scheduled project that never started"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: RetrofitProject
    side_effects: ["status SCHEDULED -> ABANDONED (terminal); contractor.open_project_count -= 1; the contractor's PENDING inspections for this project stop blocking new slots"]
  - method: GET
    path: "/eqp/retrofit-projects/{id}"
    description: "Read one retrofit project"
    roles: [ProgramAdmin, GrantReviewer, FieldInspector, CertifiedContractor, Policyholder]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: []
  - method: GET
    path: "/eqp/retrofit-projects"
    description: "List retrofit projects; filter by funding grant, contractor or status"
    roles: [ProgramAdmin, GrantReviewer, FieldInspector, CertifiedContractor]
    code: 200
    input: ["grant_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: RetrofitProject[]
    side_effects: []

  - method: POST
    path: "/eqp/inspections"
    description: "Book a verification visit on the contractor's calendar. The requested window is half-open and is protected by a 60-minute buffer on both sides."
    roles: [FieldInspector, ProgramAdmin]
    code: 201
    input: [project_id, window_start, window_end]
    output: Inspection
    side_effects: ["result = PENDING; contractor_id copied from the project; project.inspection_attempts += 1"]
  - method: POST
    path: "/eqp/inspections/{id}/record-result"
    description: "Record PASS, PARTIAL or FAIL. A PASS drives the four-hop verification cascade all the way to the policyholder's premium; a FAIL can put the contractor on probation."
    roles: [FieldInspector]
    code: 200
    input: [result, "deficiency_note?"]
    output: Inspection
    side_effects: ["inspector_user_id = X-User-ID; recorded_at = clock_now; PASS: project -> VERIFIED, dwelling.retrofit_status = VERIFIED with verified_retrofit_scope = project.scope_code, grant FUNDS_RESERVED -> VERIFIED_COMPLETE, cycle.reserved_cents -= award and cycle.disbursed_cents += award (version += 1), policy.mitigation_status RETROFIT_PENDING -> RETROFIT_VERIFIED -> DISCOUNT_APPLIED, then mitigation_discount_application writes mitigation_discount_cents, annual_premium_cents and prorated_credit_cents; FAIL: project -> REWORK_REQUIRED and contractor.failed_inspection_count += 1, reaching 3 puts the contractor on PROBATION; PARTIAL: project stays AWAITING_INSPECTION"]
  - method: GET
    path: "/eqp/inspections/{id}"
    description: "Read one inspection"
    roles: [ProgramAdmin, FieldInspector, CertifiedContractor, GrantReviewer, Policyholder]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/eqp/inspections"
    description: "List inspections; filter by project, contractor or outcome. This is the contractor-calendar read used to reason about slot conflicts."
    roles: [ProgramAdmin, FieldInspector, CertifiedContractor]
    code: 200
    input: ["project_id?", "contractor_id?", "result?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/eqp/catastrophe-events"
    description: "Open a monitoring record for a seismic event, with the program's per-event retention"
    roles: [ProgramAdmin]
    code: 201
    input: [event_code, magnitude, epicenter_county_code, occurred_at, retention_cents]
    output: CatastropheEvent
    side_effects: ["status = MONITORING; treaty_year = calendar year of occurred_at; every loss aggregate starts at 0; version = 1"]
  - method: POST
    path: "/eqp/catastrophe-events/{id}/declare"
    description: "Declare the event, opening claim intake and starting the 60-day binding moratorium in the epicenter county"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects: ["status MONITORING -> DECLARED; version += 1; new binds are refused for dwellings whose policyholder county matches epicenter_county_code until occurred_at + MORATORIUM_DAYS"]
  - method: POST
    path: "/eqp/catastrophe-events/{id}/levy-assessment"
    description: "Levy the post-event assessment for the uncovered shortfall across the assessable insurers, in market-share order, with the last rank absorbing the rounding remainder"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects: ["post_event_assessment; assessment_shortfall_cents, admin_loading_cents and assessment_total_cents written; one immutable AssessmentAllocation row per assessable insurer; each insurer's assessment_balance_cents increased; status CAPACITY_EXHAUSTED -> ASSESSMENT_LEVIED; version += 1"]
  - method: POST
    path: "/eqp/catastrophe-events/{id}/close"
    description: "Close the event once every claim on it is terminal"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects: ["status MONITORING|LOSS_AGGREGATION|ASSESSMENT_LEVIED -> CLOSED (terminal); version += 1"]
  - method: GET
    path: "/eqp/catastrophe-events/{id}"
    description: "Read one event with its full loss waterfall (aggregate incurred, retained, ceded, uncovered) and assessment figures"
    roles: [ProgramAdmin, ClaimAdjuster, ParticipatingInsurer]
    code: 200
    input: []
    output: CatastropheEvent
    side_effects: []
  - method: GET
    path: "/eqp/catastrophe-events"
    description: "List events; filter by status, treaty year or epicenter county"
    roles: [ProgramAdmin, ClaimAdjuster, ParticipatingInsurer]
    code: 200
    input: ["status?", "treaty_year?", "epicenter_county_code?", "limit?", "offset?"]
    output: CatastropheEvent[]
    side_effects: []

  - method: POST
    path: "/eqp/reinsurance-layers"
    description: "Add a layer to a treaty year's reinsurance tower, with an absolute attachment point, a limit and a ceded share"
    roles: [ProgramAdmin]
    code: 201
    input: [treaty_year, layer_index, attachment_point_cents, limit_cents, ceded_pct]
    output: ReinsuranceLayer
    side_effects: ["status = ACTIVE; ceded_cents = 0"]
  - method: POST
    path: "/eqp/reinsurance-layers/{id}/status"
    description: "Lapse or reinstate a layer. A LAPSED layer cedes nothing and does NOT shift the layers above it downward, so it leaves a permanent hole in the tower."
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: ReinsuranceLayer
    side_effects: ["status ACTIVE <-> LAPSED; the next event_loss_waterfall run excludes or re-includes the layer"]
  - method: GET
    path: "/eqp/reinsurance-layers/{id}"
    description: "Read one reinsurance layer and the amount ceded to it"
    roles: [ProgramAdmin, ParticipatingInsurer]
    code: 200
    input: []
    output: ReinsuranceLayer
    side_effects: []
  - method: GET
    path: "/eqp/reinsurance-layers"
    description: "List the tower for a treaty year, in layer order"
    roles: [ProgramAdmin, ParticipatingInsurer]
    code: 200
    input: ["treaty_year?", "status?", "limit?", "offset?"]
    output: ReinsuranceLayer[]
    side_effects: []

  - method: POST
    path: "/eqp/claims"
    description: "File first notice of loss against an in-force policy and a declared event. Optimistically concurrent on the event: expected_event_version must match."
    roles: [ClaimAdjuster, ProgramAdmin, Policyholder]
    code: 201
    input: [policy_id, event_id, structural_damage_cents, cosmetic_damage_cents, contents_damage_cents, loss_of_use_cents, expected_event_version]
    output: Claim
    side_effects: ["adjustment_status = FNOL_RECEIVED; payment_status = UNPAID; every settlement figure starts at 0; event.claim_count += 1; event.version += 1"]
  - method: POST
    path: "/eqp/claims/{id}/adjust-provisional"
    description: "Post the provisional adjustment: structural damage only, deductible charged against Coverage A alone"
    roles: [ClaimAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_settlement variant PROVISIONAL; provisional_adjuster_user_id = X-User-ID; deductible_applied_cents, the three coverage parts, provisional_payable_cents and payable_cents written; adjustment_status FNOL_RECEIVED -> PROVISIONAL_ADJUSTED"]
  - method: POST
    path: "/eqp/claims/{id}/finalize-adjustment"
    description: "Post the final adjustment: cosmetic damage admitted up to 10% of structural, deductible charged against the combined Coverage A + C basis. Requires a different adjuster than the provisional one."
    roles: [ClaimAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_settlement variant FINAL; final_adjuster_user_id = X-User-ID; final_payable_cents and payable_cents written; adjustment_status PROVISIONAL_ADJUSTED -> FINAL_ADJUSTED; event.aggregate_incurred_cents += final_payable_cents; event DECLARED -> LOSS_AGGREGATION; event_loss_waterfall re-run; event LOSS_AGGREGATION -> CAPACITY_EXHAUSTED when uncovered_cents > 0; event.version += 1"]
  - method: POST
    path: "/eqp/claims/{id}/record-payment"
    description: "Record a payment against the finalized claim"
    roles: [ProgramAdmin]
    code: 200
    input: [amount_cents]
    output: Claim
    side_effects: ["paid_cents += amount_cents; payment_status UNPAID -> PARTIALLY_PAID or -> PAID exactly when paid_cents equals payable_cents"]
  - method: POST
    path: "/eqp/claims/{id}/deny"
    description: "Deny the claim at FNOL"
    roles: [ClaimAdjuster]
    code: 200
    input: [denial_reason]
    output: Claim
    side_effects: ["adjustment_status FNOL_RECEIVED -> DENIED (terminal); cross-dimension cascade: payment_status UNPAID -> WRITTEN_OFF; event.claim_count is NOT decremented"]
  - method: POST
    path: "/eqp/claims/{id}/reopen"
    description: "Reopen a finalized claim for re-adjustment, unwinding its contribution to the event's loss aggregate"
    roles: [ClaimAdjuster]
    code: 200
    input: ["reason?"]
    output: Claim
    side_effects: ["adjustment_status FINAL_ADJUSTED -> PROVISIONAL_ADJUSTED; reopen_count += 1; event.aggregate_incurred_cents -= the claim's final_payable_cents (loss-conservation compensation); event_loss_waterfall re-run; event CAPACITY_EXHAUSTED -> LOSS_AGGREGATION when uncovered_cents returns to 0; event.version += 1"]
  - method: POST
    path: "/eqp/claims/{id}/close"
    description: "Close the fully settled claim"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["adjustment_status FINAL_ADJUSTED -> CLOSED (terminal)"]
  - method: GET
    path: "/eqp/claims/{id}"
    description: "Read one claim with both adjustment variants' figures and its payment ledger"
    roles: [ProgramAdmin, ClaimAdjuster, ParticipatingInsurer, Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/eqp/claims"
    description: "List claims; filter by policy, event, adjustment status or payment status"
    roles: [ProgramAdmin, ClaimAdjuster, ParticipatingInsurer, Policyholder]
    code: 200
    input: ["policy_id?", "event_id?", "adjustment_status?", "payment_status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/eqp/assessment-allocations/{id}"
    description: "Read one immutable post-event assessment allocation"
    roles: [ProgramAdmin, ParticipatingInsurer]
    code: 200
    input: []
    output: AssessmentAllocation
    side_effects: []
  - method: GET
    path: "/eqp/assessment-allocations"
    description: "List the assessment allocations of an event or of an insurer, in allocation_rank order. Allocations are only ever created by levy-assessment, so this is their sole discovery channel."
    roles: [ProgramAdmin, ParticipatingInsurer]
    code: 200
    input: ["event_id?", "insurer_id?", "limit?", "offset?"]
    output: AssessmentAllocation[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
#   Ids and statuses are identical to the 1.4 ladder and the 1.2 transition
#   preconditions. Every id below is triggerable by at least one 1.5 endpoint.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_ROLE
    http: 401
    condition: "X-Role header is present and names a role declared in 1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the X-Role role appears in the target endpoint's roles list"
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID header is present on the segregation-of-duties endpoints"
  - id: ERR_POLICYHOLDER_NOT_FOUND
    http: 404
    condition: "the policyholder_id referenced in the path or body does not resolve to an existing row"
  - id: ERR_INSURER_NOT_FOUND
    http: 404
    condition: "the insurer_id referenced in the path or body does not resolve to an existing row"
  - id: ERR_DWELLING_NOT_FOUND
    http: 404
    condition: "the dwelling_id referenced in the path or body does not resolve to an existing row"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "the mandatory offer id referenced in the path or body does not resolve to an existing row"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "the policy_id referenced in the path or body does not resolve to an existing row"
  - id: ERR_GRANT_CYCLE_NOT_FOUND
    http: 404
    condition: "the grant_cycle_id referenced in the path or body does not resolve to an existing row"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "the retrofit grant id referenced in the path or body does not resolve to an existing row"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "the contractor_id referenced in the path or body does not resolve to an existing row"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "the retrofit project id referenced in the path or body does not resolve to an existing row"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "the inspection id referenced in the path or body does not resolve to an existing row"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "the event_id referenced in the path or body does not resolve to an existing row"
  - id: ERR_LAYER_NOT_FOUND
    http: 404
    condition: "the reinsurance layer id referenced in the path or body does not resolve to an existing row"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "the claim id referenced in the path or body does not resolve to an existing row"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "the assessment allocation id referenced in the path or body does not resolve to an existing row"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Policyholder-role caller may only read or act on Dwelling, Policy, MandatoryOffer, RetrofitGrant and Claim rows that resolve to its own policyholder_id; a ParticipatingInsurer-role caller only on rows that resolve to its own insurer_id; a CertifiedContractor-role caller only on RetrofitProject and Inspection rows whose contractor_id is its own"
  - id: ERR_SOD_GRANT_REVIEWER_CONFLICT
    http: 403
    condition: "segregation of duties: the X-User-ID reserving cycle funds must differ from RetrofitGrant.approved_by_user_id - whoever approved an award cannot also commit the money"
  - id: ERR_SOD_INSPECTOR_CONFLICT
    http: 403
    condition: "segregation of duties: the X-User-ID recording an inspection result must differ from the approved_by_user_id of the grant that funds the inspected project - the approver cannot self-certify the work"
  - id: ERR_SOD_ADJUSTER_CONFLICT
    http: 403
    condition: "segregation of duties: the X-User-ID finalizing an adjustment must differ from Claim.provisional_adjuster_user_id - a second adjuster must sign the final number"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "every required body field is present and non-null"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "enum fields are in domain: county_hazard_tier in {TIER_1,TIER_2,TIER_3}; soil_class in {ROCK,STIFF,SOFT,LIQUEFACTION}; structure_type in {WOOD_FRAME_SLAB,WOOD_FRAME_CRIPPLE_WALL,MASONRY_URM,MOBILE_HOME}; deductible_pct in {5,10,15,20,25}; income_tier in {TIER_LOW,TIER_MID,TIER_ANY}; scope codes in {CRIPPLE_WALL_BRACING,EARTHQUAKE_BRACING_SYSTEM,ANCHOR_BOLT_ONLY}; grant decision in {APPROVE,RETURN,DENY}; inspection result in {PASS,PARTIAL,FAIL}; policy lifecycle action in {LAPSE,EXPIRE_QUOTE}; compliance action in {SANCTION,REINSTATE,WITHDRAW}; contractor certification_status in {CERTIFIED,SUSPENDED}; offer response in {ACCEPT,DECLINE}; reinsurance layer status in {ACTIVE,LAPSED}"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "numeric domains: all *_cents >= 0; dwelling_limit_cents in [5000000, 300000000]; total_pool_cents >= 100000; project_cost_estimate_cents > 0; record-payment amount_cents > 0; market_share_pct in [0,100]; magnitude in [4.0,9.5]; ceded_pct in (0,1]; layer_index >= 1; year_built in [1850,2026]"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "every declared interval is non-empty: GrantCycle.opens_at < closes_at, take-up window_start < window_end, Inspection.window_start < window_end"
  - id: ERR_STALE_GRANT_CYCLE_VERSION
    http: 412
    condition: "expected_grant_cycle_version equals the current GrantCycle.version"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version equals the current CatastropheEvent.version"
  - id: ERR_OFFER_ALREADY_RESPONDED
    http: 409
    condition: "MandatoryOffer.status == PENDING to respond to it or to expire it"
  - id: ERR_OFFER_NOT_REOFFERABLE
    http: 409
    condition: "MandatoryOffer.status in {DECLINED, ACCEPTED} to reoffer; a PENDING or EXPIRED offer cannot be reoffered"
  - id: ERR_POLICY_NOT_QUOTED
    http: 409
    condition: "Policy.lifecycle_status == QUOTED to bind it or to expire its quote"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "Policy.lifecycle_status == ACTIVE to renew, cancel, lapse, revoke a discount, or file a claim against it"
  - id: ERR_NO_MITIGATION_DISCOUNT
    http: 409
    condition: "Policy.mitigation_status == DISCOUNT_APPLIED and Policy.mitigation_discount_cents > 0 to revoke the mitigation discount"
  - id: ERR_GRANT_CYCLE_CLOSED
    http: 409
    condition: "GrantCycle.status == OPEN to submit a grant into it or to reserve funds from it"
  - id: ERR_GRANT_INVALID_STATE
    http: 409
    condition: "the RetrofitGrant is in the status the action requires: SUBMITTED to begin-review, UNDER_REVIEW to review, RETURNED_FOR_INFO to resubmit, APPROVED to reserve-funds, and any of {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED, FUNDS_RESERVED} to withdraw"
  - id: ERR_PROJECT_INVALID_STATE
    http: 409
    condition: "the RetrofitProject is in the status the action requires: SCHEDULED or REWORK_REQUIRED to start-work, IN_PROGRESS to request-inspection, AWAITING_INSPECTION when an Inspection is created against it, and any of {SCHEDULED, IN_PROGRESS, AWAITING_INSPECTION, REWORK_REQUIRED} to abandon"
  - id: ERR_INSPECTION_ALREADY_RECORDED
    http: 409
    condition: "Inspection.result == PENDING to record a result"
  - id: ERR_EVENT_INVALID_STATE
    http: 409
    condition: "CatastropheEvent.status == MONITORING to declare it"
  - id: ERR_EVENT_CLOSED
    http: 409
    condition: "CatastropheEvent.status != CLOSED for any operation that touches the event's loss aggregate"
  - id: ERR_EVENT_ASSESSMENT_LOCKED
    http: 409
    condition: "CatastropheEvent.status != ASSESSMENT_LEVIED for any operation that would move the loss aggregate after the assessment was struck - the allocations are already published"
  - id: ERR_EVENT_NOT_DECLARED
    http: 409
    condition: "CatastropheEvent.status in {DECLARED, LOSS_AGGREGATION, CAPACITY_EXHAUSTED} to file a claim against it - an event still MONITORING accepts no claims"
  - id: ERR_EVENT_CAPACITY_NOT_EXHAUSTED
    http: 409
    condition: "CatastropheEvent.status == CAPACITY_EXHAUSTED to levy an assessment"
  - id: ERR_EVENT_HAS_OPEN_CLAIMS
    http: 409
    condition: "every Claim of the event is in a terminal adjustment_status (CLOSED or DENIED) to close the event"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "the Claim is in the status the action requires: FNOL_RECEIVED to adjust-provisional or deny, PROVISIONAL_ADJUSTED to finalize, PROVISIONAL_ADJUSTED or FINAL_ADJUSTED to record a payment, FINAL_ADJUSTED to reopen"
  - id: ERR_CLAIM_ALREADY_SETTLED
    http: 409
    condition: "Claim.payment_status == UNPAID or PARTIALLY_PAID to reopen - a fully settled claim cannot be reopened"
  - id: ERR_CLAIM_REOPEN_LIMIT
    http: 409
    condition: "Claim.reopen_count < MAX_REOPENS (2) to reopen a finalized claim"
  - id: ERR_CLAIM_NOT_FULLY_PAID
    http: 409
    condition: "Claim.payment_status == PAID to close the claim"
  - id: ERR_INSURER_SANCTIONED
    http: 409
    condition: "ParticipatingInsurer.compliance_status != SANCTIONED to make a mandatory offer through that insurer, to quote, to bind or to renew"
  - id: ERR_INSURER_WITHDRAWN
    http: 409
    condition: "ParticipatingInsurer.status == ACTIVE to write NEW business through that insurer (offers, quotes, binds); a WITHDRAWN insurer may still renew its in-force book and remains assessable"
  - id: ERR_INSURER_NOT_SANCTIONED
    http: 409
    condition: "ParticipatingInsurer.compliance_status == SANCTIONED to apply compliance action REINSTATE, and == UNDER_REVIEW to apply SANCTION"
  - id: ERR_INSURER_ALREADY_WITHDRAWN
    http: 409
    condition: "ParticipatingInsurer.status == ACTIVE to apply compliance action WITHDRAW"
  - id: ERR_CONTRACTOR_NOT_CERTIFIED
    http: 409
    condition: "the Contractor.certification_status == CERTIFIED when a project is created for it and again when an inspection is scheduled for that project - a PROBATION or SUSPENDED contractor can neither take on nor be inspected for retrofit work"
  - id: ERR_CONTRACTOR_CERTIFICATION_EXPIRED
    http: 409
    condition: "Contractor.certification_expires_at > the current logical clock when a project is created for it and when an inspection is scheduled"
  - id: ERR_CONTRACTOR_INVALID_CERTIFICATION_TRANSITION
    http: 409
    condition: "the requested certification_status is reachable from the current one: SUSPENDED only from CERTIFIED, CERTIFIED only from PROBATION or SUSPENDED (PROBATION itself is never set by this endpoint - only the FAIL cascade sets it)"
  - id: ERR_RETROFIT_SCOPE_MISMATCH
    http: 409
    condition: "recording result=PASS requires the inspected RetrofitProject.scope_code to appear in the inspecting Contractor.certified_scopes - work outside a contractor's certified scopes cannot be verified"
  - id: ERR_MAGNITUDE_BELOW_DECLARATION_FLOOR
    http: 422
    condition: "CatastropheEvent.magnitude >= DECLARATION_MIN_MAGNITUDE (5.0) to declare the event"
  - id: ERR_STRUCTURE_NOT_GRANT_ELIGIBLE
    http: 422
    condition: "the Dwelling.structure_type must have a non-zero SCOPE_COST_CAP to receive an award - WOOD_FRAME_SLAB and MASONRY_URM are outside the retrofit program"
  - id: ERR_MANDATORY_OFFER_NOT_ACCEPTED
    http: 409
    condition: "Policy.accepted_offer_id must name a MandatoryOffer whose status == ACCEPTED and whose insurer_id and dwelling_id match the policy's - checked at quote time, again at bind AND again at every renewal, so a reoffer (ACCEPTED -> PENDING) blocks the renewal until the policyholder re-accepts"
  - id: ERR_DWELLING_OWNER_MISMATCH
    http: 422
    condition: "MandatoryOffer.policyholder_id must equal Dwelling[dwelling_id].policyholder_id, and RetrofitGrant.policy_id (when supplied) must name a Policy whose dwelling_id equals the grant's dwelling_id"
  - id: ERR_GRANT_FUNDS_NOT_RESERVED
    http: 409
    condition: "RetrofitProject.grant_id must name a RetrofitGrant in status FUNDS_RESERVED - work cannot start on money that is only approved"
  - id: ERR_INSPECTION_PROJECT_MISMATCH
    http: 422
    condition: "an Inspection is created only against a RetrofitProject in AWAITING_INSPECTION, and its contractor_id is copied from that project (a caller-supplied contractor_id that disagrees is rejected)"
  - id: ERR_NO_REINSURANCE_PROGRAM
    http: 409
    condition: "the CatastropheEvent's treaty_year must have at least one ReinsuranceLayer row with status == ACTIVE before the event can be declared and before claims can be filed against it"
  - id: ERR_DUPLICATE_LAYER_INDEX
    http: 409
    condition: "a ReinsuranceLayer's layer_index must be unique within its treaty_year"
  - id: ERR_LAYER_ATTACHMENT_GAP
    http: 422
    condition: "a ReinsuranceLayer with layer_index > 1 must attach at or above the previous index's attachment_point_cents + limit_cents within the same treaty_year (no downward-overlapping towers)"
  - id: ERR_DUPLICATE_ACTIVE_POLICY
    http: 409
    condition: "at most one Policy per dwelling_id in lifecycle_status ACTIVE or QUOTED"
  - id: ERR_DUPLICATE_PENDING_OFFER
    http: 409
    condition: "at most one MandatoryOffer per (insurer_id, dwelling_id) in status PENDING"
  - id: ERR_DUPLICATE_OPEN_GRANT
    http: 409
    condition: "at most one RetrofitGrant per dwelling_id in a non-terminal status {SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, APPROVED, FUNDS_RESERVED}"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "at most one Claim per (policy_id, event_id) whose adjustment_status is not DENIED"
  - id: ERR_GRANT_REVIEW_ROUNDS_EXHAUSTED
    http: 409
    condition: "RetrofitGrant.review_round < MAX_REVIEW_ROUNDS (3) to return the grant for more information again"
  - id: ERR_CONTRACTOR_PROJECT_CAP
    http: 409
    condition: "a Contractor may hold at most MAX_OPEN_PROJECTS_PER_CONTRACTOR (3) RetrofitProject rows in status {SCHEDULED, IN_PROGRESS, AWAITING_INSPECTION, REWORK_REQUIRED}"
  - id: ERR_INSPECTION_DURATION_INVALID
    http: 422
    condition: "the Inspection window length (window_end - window_start) is between INSPECTION_MIN_MINUTES (30) and INSPECTION_MAX_MINUTES (240) inclusive"
  - id: ERR_INSPECTION_IN_PAST
    http: 422
    condition: "Inspection.window_start >= the current logical clock"
  - id: ERR_INSPECTION_SLOT_OVERLAP
    http: 409
    condition: "no Contractor double-booking: the requested half-open window [window_start, window_end), widened by INSPECTION_BUFFER_MINUTES (60) on BOTH sides, must not intersect the half-open window of any existing Inspection with result == PENDING for the same contractor_id whose RetrofitProject.status != ABANDONED"
  - id: ERR_INSPECTION_WINDOW_NOT_REACHED
    http: 409
    condition: "the current logical clock is >= Inspection.window_start to record a result - an inspector cannot report on a visit that has not started"
  - id: ERR_GRANT_CYCLE_WINDOW_OVERLAP
    http: 409
    condition: "no GrantCycle window collision: the CLOSED interval [opens_at, closes_at] must not intersect that of any other GrantCycle with the same program_track, in ANY status (a CLOSED cycle still reserves its historical window) - two cycles that merely touch endpoints DO collide, and there is no buffer"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "the current logical clock is < Policy.quote_expires_at (quoted_at + QUOTE_VALID_DAYS = 30 days) to bind the quote"
  - id: ERR_QUOTE_STILL_VALID
    http: 409
    condition: "the current logical clock is >= Policy.quote_expires_at to expire the quote administratively"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "the current logical clock is < MandatoryOffer.expires_at (offered_at + OFFER_VALID_DAYS = 60 days) to respond to the offer"
  - id: ERR_OFFER_STILL_VALID
    http: 409
    condition: "the current logical clock is >= MandatoryOffer.expires_at to expire the offer administratively"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 409
    condition: "the current logical clock is inside [Policy.expires_at - RENEWAL_WINDOW_DAYS (45 days), Policy.expires_at) to renew"
  - id: ERR_BINDING_MORATORIUM
    http: 409
    condition: "binding moratorium: no CatastropheEvent with status in {DECLARED, LOSS_AGGREGATION, CAPACITY_EXHAUSTED, ASSESSMENT_LEVIED} may have epicenter_county_code == Policyholder[policy.policyholder_id].county_code with the clock still inside the half-open window [occurred_at, occurred_at + MORATORIUM_DAYS (60 days))"
  - id: ERR_POLICY_NOT_IN_FORCE_AT_EVENT
    http: 409
    condition: "the event must have struck inside the policy term: CatastropheEvent.occurred_at in [Policy.effective_at, Policy.expires_at)"
  - id: ERR_NO_ASSESSABLE_INSURERS
    http: 409
    condition: "at least one ParticipatingInsurer is assessable (compliance_status in {COMPLIANT, UNDER_REVIEW} AND market_share_pct > 0)"
  - id: ERR_GRANT_TIER_CAP_EXHAUSTED
    http: 409
    condition: "the grant's income_tier bucket, or the TIER_ANY fallback bucket, must have room for the award (grant_pool_waterfall steps 1-2)"
  - id: ERR_GRANT_CYCLE_POOL_EXHAUSTED
    http: 409
    condition: "GrantCycle.reserved_cents + disbursed_cents + approved_amount_cents <= total_pool_cents - evaluated AFTER a tier bucket has been resolved, so a bucket with room can still hit the pool ceiling"
  - id: ERR_SUBLIMIT_EXCEEDS_LIMIT
    http: 422
    condition: "contents_sublimit_cents and loss_of_use_sublimit_cents must each be <= the dwelling's dwelling_limit_cents"
  - id: ERR_PAYMENT_EXCEEDS_PAYABLE
    http: 422
    condition: "a payment amount_cents must be > 0 and <= Claim.payable_cents - Claim.paid_cents"
  - id: ERR_RETROFIT_ALREADY_VERIFIED
    http: 409
    condition: "Dwelling.retrofit_status != VERIFIED to self-declare a retrofit - an inspection-verified retrofit cannot be overwritten by an attestation. This rule is the only rule that can fire on its endpoint, so its ladder position carries no priority-conflict meaning."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix   (role_model: segregation_of_duties)
#   X-Role names the role; X-User-ID names the acting identity. For the three
#   entity_backed roles the server compares X-User-ID against the resource's
#   own FK (ownership rule, 1.4 priority 6). For the four opaque roles X-User-ID
#   is an operator id that is only ever compared to ANOTHER operator id stored
#   on the row (grant approver vs fund reserver, provisional vs final adjuster).
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Residual-insurer program staff: enrolls insurers, runs funding cycles, certifies contractors, manages catastrophe events, the reinsurance tower, assessments, payments and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /eqp/_clock/set_current_utc"
      - "POST /eqp/insurers"
      - "GET /eqp/insurers"
      - "POST /eqp/insurers/{id}/compliance-action"
      - "POST /eqp/insurers/{id}/take-up-evaluation"
      - "GET /eqp/policyholders"
      - "POST /eqp/mandatory-offers/{id}/expire"
      - "POST /eqp/policies/{id}/lifecycle-action"
      - "POST /eqp/policies/{id}/revoke-mitigation-discount"
      - "POST /eqp/grant-cycles"
      - "POST /eqp/grant-cycles/{id}/close"
      - "POST /eqp/retrofit-grants/{id}/reserve-funds"
      - "POST /eqp/contractors"
      - "POST /eqp/contractors/{id}/certification"
      - "POST /eqp/retrofit-projects/{id}/abandon"
      - "POST /eqp/catastrophe-events"
      - "POST /eqp/catastrophe-events/{id}/declare"
      - "POST /eqp/catastrophe-events/{id}/levy-assessment"
      - "POST /eqp/catastrophe-events/{id}/close"
      - "POST /eqp/reinsurance-layers"
      - "POST /eqp/reinsurance-layers/{id}/status"
      - "POST /eqp/claims/{id}/record-payment"
      - "POST /eqp/claims/{id}/close"
    shared_operations:
      - "POST /eqp/policyholders (with ParticipatingInsurer)"
      - "POST /eqp/dwellings (with Policyholder)"
      - "POST /eqp/mandatory-offers (with ParticipatingInsurer)"
      - "POST /eqp/mandatory-offers/{id}/reoffer (with ParticipatingInsurer)"
      - "POST /eqp/policies (with ParticipatingInsurer)"
      - "POST /eqp/policies/{id}/renew (with ParticipatingInsurer)"
      - "POST /eqp/policies/{id}/cancel (with ParticipatingInsurer, Policyholder)"
      - "POST /eqp/retrofit-grants (with Policyholder)"
      - "POST /eqp/retrofit-grants/{id}/begin-review (with GrantReviewer)"
      - "POST /eqp/retrofit-grants/{id}/resubmit (with Policyholder)"
      - "POST /eqp/retrofit-grants/{id}/withdraw (with Policyholder)"
      - "POST /eqp/retrofit-projects (with CertifiedContractor)"
      - "POST /eqp/retrofit-projects/{id}/start-work (with CertifiedContractor)"
      - "POST /eqp/inspections (with FieldInspector)"
      - "POST /eqp/claims (with ClaimAdjuster, Policyholder)"
      - "all GET reads"

  - name: ParticipatingInsurer
    description: "An admitted residential insurer that must offer the earthquake product, quotes and binds it, and is exposed to post-event assessment"
    identity: "entity_backed:ParticipatingInsurer"
    exclusive_operations:
      - "POST /eqp/policies/{id}/bind"
    shared_operations:
      - "POST /eqp/policyholders (with ProgramAdmin)"
      - "POST /eqp/mandatory-offers (with ProgramAdmin)"
      - "POST /eqp/mandatory-offers/{id}/reoffer (with ProgramAdmin)"
      - "POST /eqp/policies (with ProgramAdmin)"
      - "POST /eqp/policies/{id}/renew (with ProgramAdmin)"
      - "POST /eqp/policies/{id}/cancel (with ProgramAdmin, Policyholder)"
      - "GET /eqp/insurers/{id}, GET /eqp/policyholders/{id}, GET /eqp/dwellings, GET /eqp/mandatory-offers, GET /eqp/policies, GET /eqp/claims, GET /eqp/catastrophe-events, GET /eqp/reinsurance-layers, GET /eqp/assessment-allocations (own rows only)"

  - name: Policyholder
    description: "A residential owner who receives the mandatory offer, buys the coverage, applies for a retrofit grant and files claims"
    identity: "entity_backed:Policyholder"
    exclusive_operations:
      - "POST /eqp/mandatory-offers/{id}/respond"
      - "POST /eqp/dwellings/{id}/declare-retrofit"
    shared_operations:
      - "POST /eqp/dwellings (with ProgramAdmin)"
      - "POST /eqp/policies/{id}/cancel (with ProgramAdmin, ParticipatingInsurer)"
      - "POST /eqp/retrofit-grants (with ProgramAdmin)"
      - "POST /eqp/retrofit-grants/{id}/resubmit (with ProgramAdmin)"
      - "POST /eqp/retrofit-grants/{id}/withdraw (with ProgramAdmin)"
      - "POST /eqp/claims (with ClaimAdjuster, ProgramAdmin)"
      - "GET /eqp/policyholders/{id}, GET /eqp/dwellings, GET /eqp/mandatory-offers, GET /eqp/policies, GET /eqp/retrofit-grants, GET /eqp/grant-cycles, GET /eqp/contractors, GET /eqp/retrofit-projects, GET /eqp/inspections, GET /eqp/claims (own rows only)"

  - name: GrantReviewer
    description: "Mitigation-program reviewer who adjudicates retrofit grant applications and sets the award amount, but may never commit cycle money to an award it approved"
    identity: "opaque"
    exclusive_operations:
      - "POST /eqp/retrofit-grants/{id}/review"
    shared_operations:
      - "POST /eqp/retrofit-grants/{id}/begin-review (with ProgramAdmin)"
      - "GET /eqp/retrofit-grants, GET /eqp/grant-cycles, GET /eqp/dwellings, GET /eqp/policies, GET /eqp/contractors, GET /eqp/retrofit-projects, GET /eqp/inspections"

  - name: FieldInspector
    description: "Program inspector who schedules verification visits on the contractor calendar and records PASS / PARTIAL / FAIL, driving the retrofit verification cascade"
    identity: "opaque"
    exclusive_operations:
      - "POST /eqp/inspections/{id}/record-result"
    shared_operations:
      - "POST /eqp/inspections (with ProgramAdmin)"
      - "GET /eqp/inspections, GET /eqp/retrofit-projects, GET /eqp/contractors, GET /eqp/dwellings, GET /eqp/retrofit-grants"

  - name: ClaimAdjuster
    description: "Catastrophe adjuster who posts the provisional and final adjustments; the final adjustment must be signed by a different adjuster identity than the provisional one"
    identity: "opaque"
    exclusive_operations:
      - "POST /eqp/claims/{id}/adjust-provisional"
      - "POST /eqp/claims/{id}/finalize-adjustment"
      - "POST /eqp/claims/{id}/deny"
      - "POST /eqp/claims/{id}/reopen"
    shared_operations:
      - "POST /eqp/claims (with ProgramAdmin, Policyholder)"
      - "GET /eqp/claims, GET /eqp/policies, GET /eqp/catastrophe-events"

  - name: CertifiedContractor
    description: "Certified retrofit contractor who performs the funded work and declares it ready for inspection"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /eqp/retrofit-projects/{id}/request-inspection"
    shared_operations:
      - "POST /eqp/retrofit-projects (with ProgramAdmin)"
      - "POST /eqp/retrofit-projects/{id}/start-work (with ProgramAdmin)"
      - "GET /eqp/retrofit-projects, GET /eqp/inspections, GET /eqp/contractors/{id} (own rows only)"
