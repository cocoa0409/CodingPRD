              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "656-56-5656", primary_owner_name: "Sue Persede" }
              as: TransferAgentOperator
              captures: { acc_su: $.data.id }
            - call: "POST /shareholder-accounts/${acc_su}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
              captures: { acc_su_v1: $.data.version }
            - call: "POST /systematic-plans"
              payload: { account_id: "${acc_su}", plan_type: "SYSTEMATIC_INVESTMENT", source_share_class_id: "${sc_a}", amount: 300.00, frequency: "MONTHLY", next_run_date: "2026-09-01", expected_account_version: "${acc_su_v1}" }
              as: TransferAgentOperator
              captures: { plan_old: $.data.id }
            - call: "GET /shareholder-accounts/${acc_su}"
              payload: {}
              as: TransferAgentOperator
              captures: { acc_su_v2: $.data.version }
          trigger:
            - call: "POST /systematic-plans"
              payload: { account_id: "${acc_su}", plan_type: "SYSTEMATIC_INVESTMENT", source_share_class_id: "${sc_a}", amount: 900.00, frequency: "MONTHLY", next_run_date: "2026-09-01", expected_account_version: "${acc_su_v2}" }
              as: TransferAgentOperator
              captures: { plan_new: $.data.id }
          assert:
            - "HTTP status is 201"
            - "SystematicPlan.${plan_old}.status == TERMINATED"
            - "SystematicPlan.${plan_new}.status == ACTIVE and amount == 900.00"
            - "GET /systematic-plans with account_id ${acc_su} and status ACTIVE returns total_count 1"
            - "ShareholderAccount.${acc_su}.version == ${acc_su_v2} + 1"

      - name: stale_nav_record_version_blocks_a_second_pricing_error_case
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[pricing-error-case-stale-nav]"
          - errors[ERR_STALE_NAV_RECORD_VERSION]
          - "validations[priority=70]"
        distinguishing_aspect: "Opening the first case advances NavRecord.version, so a second create still carrying the version observed at finalization is refused with 412 ERR_STALE_NAV_RECORD_VERSION and the first case is NOT superseded."
        test_recipe:
          setup:
            - "A share class seeded at 11.0000 with zero shares and a FINAL NAV for 2026-08-03 whose version was captured at finalization."
            - "One DETECTED case already opened with that captured version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Income Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "I", seed_nav_per_share: 11.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0}] }
              as: FundAccountant
              captures: { sc_i: $.data.id }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_i}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav_i: $.data.id }
            - call: "POST /nav-records/${nav_i}/finalize"
              payload: {}
              as: FundAccountant
              captures: { nav_i_v: $.data.version }
            - call: "POST /pricing-error-cases"
              payload: { nav_record_id: "${nav_i}", corrected_nav_per_share: 11.0600, error_reason: "First look at the mispricing", expected_nav_record_version: "${nav_i_v}" }
              as: FundAccountant
              as_user_id: "fa-1"
              captures: { case_a: $.data.id }
          trigger:
            - call: "POST /pricing-error-cases"
              payload: { nav_record_id: "${nav_i}", corrected_nav_per_share: 11.0900, error_reason: "Second look with a stale view", expected_nav_record_version: "${nav_i_v}" }
              as: FundAccountant
              as_user_id: "fa-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 412 with error_id ERR_STALE_NAV_RECORD_VERSION"
            - "PricingErrorCase.${case_a}.status == DETECTED"
            - "GET /pricing-error-cases with nav_record_id ${nav_i} returns total_count 1"
            - "NavRecord.${nav_i}.status == UNDER_ERROR_REVIEW"

      - name: household_basis_is_recomputed_on_settlement_not_on_nav_posting
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ShareholderAccount.fields.household_basis_amount
          - calculations.roa_household_basis
          - state_machines.Trade.UNSETTLED_to_SETTLED
        distinguishing_aspect: "household_basis_amount is recomputed only when a household position changes, so it reads 57300.00 after the settlement at the 10.0000 NAV and is still 57300.00 after a later 11.0000 NAV is struck and finalized, until the next position change moves it."
        test_recipe:
          setup:
            - "Class A, CA registration, account DR is DIRECT/CA and ACTIVE."
            - "NAV 2026-08-03 is 10.0000 FINAL and a 60000.00 purchase has settled for 5730.000 shares."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "666-66-6667", primary_owner_name: "Derek Rived" }
              as: TransferAgentOperator
              captures: { acc_dr: $.data.id }
            - call: "POST /shareholder-accounts/${acc_dr}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_dr}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_dr: $.data.id }
            - call: "POST /trades/${t_dr}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_dr}/settle"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: FundAccountant
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-04", total_net_assets: 63030.00 }
              as: FundAccountant
              captures: { nav2: $.data.id }
            - call: "POST /nav-records/${nav2}/finalize"
              payload: {}
              as: FundAccountant
            - call: "GET /shareholder-accounts/${acc_dr}"
              payload: {}
              as: TransferAgentOperator
              captures: { basis_after_nav: $.data.household_basis_amount }
          assert:
            - "immediately after the settlement ShareholderAccount.${acc_dr}.household_basis_amount == 57300.00"
            - "NavRecord.${nav2}.nav_per_share == 11.0000"
            - "${basis_after_nav} == 57300.00 (striking and finalizing a NAV is not a position change)"
            - "the Position of account ${acc_dr} has current_roa_tier_pct == 0.045"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: settlement_response_already_reflects_every_cascaded_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - "endpoints[POST /trades/{id}/settle]"
          - entities.ShareClass.fields.total_shares_outstanding
        distinguishing_aspect: "The consistency model is immediate: the settle response itself carries settlement_status SETTLED and shares_transacted 5730.000, and a GET issued straight afterwards already shows total_shares_outstanding 5730.000, the ledger row and the recomputed household basis with no intervening call."
        test_recipe:
          setup:
            - "Class A, CA registration, account IM is DIRECT/CA and ACTIVE, NAV 2026-08-03 at the 10.0000 seed and FINAL."
            - "A 60000.00 purchase priced to PRICED_FINAL and not yet settled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "676-76-7676", primary_owner_name: "Ivy Immediate" }
              as: TransferAgentOperator
              captures: { acc_im: $.data.id }
            - call: "POST /shareholder-accounts/${acc_im}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_im}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_im: $.data.id }
            - call: "POST /trades/${t_im}/price"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "POST /trades/${t_im}/settle"
              payload: {}
              as: TransferAgentOperator
              captures: { settled_status: $.data.settlement_status, settled_shares: $.data.shares_transacted }
            - call: "GET /share-classes/${sc_a}"
              payload: {}
              as: TransferAgentOperator
              captures: { tso_now: $.data.total_shares_outstanding }
          assert:
            - "${settled_status} == SETTLED"
            - "${settled_shares} == 5730.000"
            - "${tso_now} == 5730.000"
            - "GET /share-ledger-entries with trade_id ${t_im} returns total_count 1"
            - "ShareholderAccount.${acc_im}.household_basis_amount == 57300.00"
            - "BlueSkyRegistration.${bs_ca}.consumed_amount == 60000.00 and reserved_amount == 0.00"

  # =========================================================================
  - section: errors
    instances:
      - name: error_materiality_threshold_boundary
        claim_type: error_triggerable
        grounds:
          - calculations.pricing_error_materiality
        excluded_because:
          difficulty_instance: boundary_precision_check / materiality_threshold_is_inclusive_at_exactly_fifty_basis_points
          rationale: "The 50.00 bps inclusive boundary and its ERR_INVALID_CASE_STATE companion are both asserted by that difficulty instance."

      - name: error_blue_sky_capacity_exceeded_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BLUE_SKY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / blue_sky_capacity_accepts_exact_remaining_and_rejects_one_cent_more
          rationale: "The one-cent-over rejection is the failure path asserted by that difficulty instance."

      - name: error_account_not_active_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / closed_account_state_error_outranks_blue_sky_capacity_error
          rationale: "The CLOSED-account rejection is asserted as the winning error of that priority conflict."

      - name: error_as_of_window_exceeded_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_AS_OF_WINDOW_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / as_of_window_safety_error_outranks_unregistered_state_referential_error
          rationale: "The four-business-day rejection is asserted as the winning error of that priority conflict."

      - name: error_account_restricted_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ACCOUNT_RESTRICTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / purchase_blocked_but_redemption_allowed_on_restricted_account
          rationale: "The restricted-account purchase rejection is the failure half of that cross-entity instance."

      - name: error_nav_not_final_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NAV_NOT_FINAL]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / trade_pricing_depends_on_nav_record_not_being_under_error_review
          rationale: "The under-review pricing rejection is the asserted outcome of that instance."

      - name: error_blue_sky_window_overlap_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BLUE_SKY_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / blue_sky_windows_are_half_open_so_touching_endpoints_do_not_collide
          rationale: "The overlapping-window rejection is the negative half of that interval-semantics instance."

      - name: error_distribution_period_overlap_trigger
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DISTRIBUTION_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / distribution_periods_are_closed_so_touching_endpoints_do_collide
          rationale: "The touching-endpoint rejection is the negative half of that interval-semantics instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: calculation_distribution_rounding_order
        claim_type: precision
        grounds:
          - calculations.distribution_payment_amounts
        excluded_because:
          difficulty_instance: combinatorial_formula / distribution_rounds_each_payment_to_cents_before_summing_totals
          rationale: "The per-payment-then-sum rounding order and its 942.06 versus 942.07 divergence are asserted there."

      - name: calculation_roa_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.roa_household_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / roa_basis_variant_diverges_between_direct_and_omnibus_household
          rationale: "Both basis variants are computed against identical holdings and compared there."

      - name: calculation_purchase_pricing_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.purchase_trade_pricing
        excluded_because:
          difficulty_instance: dual_variant_calc / trade_pricing_variant_provisional_versus_final_share_quantity
          rationale: "Provisional versus final variant selection and the resulting share divergence are asserted there."

  # =========================================================================
  - section: state_machines
    instances:
      - name: state_machine_nav_record_stale_reprice_cycle
        claim_type: cyclic
        grounds:
          - state_machines.NavRecord.PRELIMINARY_to_STALE_REPRICE_REQUIRED
        excluded_because:
          difficulty_instance: transitive_cascade / material_reprocess_drives_five_link_chain_to_provisional_trade_rollback
          rationale: "The invalidation half of the PRELIMINARY to STALE_REPRICE_REQUIRED cycle is asserted as link 4 of that cascade."

      - name: state_machine_blue_sky_exhausted_to_active_cycle
        claim_type: cyclic
        grounds:
          - state_machines.BlueSkyRegistration.EXHAUSTED_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / capture_settle_cancel_reverse_conserve_registration_capacity_identity
          rationale: "The EXHAUSTED to ACTIVE return is asserted at the cancellation checkpoint of that invariant instance."
