            - "Product.${prod_id}.conformance_index_provisional == 0.00"
            - "Product.${prod_id}.components_complete_count == 0"
            - "Product.${prod_id}.publication_posture == OPEN"

      - name: publish_freezes_customer_disclosures_chain
        grounds:
          - state_machines.ConformanceReport.APPROVED_to_PUBLISHED
          - state_machines.KnownIssue.COMMITTED_to_PUBLISHED_COMMITTED
          - state_machines.QuestionnaireResponse.CURRENT_to_CORRECTION_REQUIRED
          - calculations.product_publication_posture
        distinguishing_aspect: |
          Cascade 3 of 3, triggered by report publication (neither run completion nor voiding),
          depth 4: publication moves the COMMITTED blocker to PUBLISHED_COMMITTED with a public
          target date (hop 1); that state change lifts overdue_committed_blocker_count to 1 (hop 2);
          that counter drives publication_posture into FROZEN (hop 3); the FROZEN posture flips the
          CURRENT questionnaire to CORRECTION_REQUIRED with correction_due_at 2026-09-11 (hop 4).
        test_recipe:
          setup:
            - "Product with one in-scope component at coverage 45.00, design review REVIEWED_PASS, and one ATTESTED SUPPORTS assessment, so the provisional index is 100.00 and the posture is OPEN"
            - "A BLOCKER known issue with target_remediation_date 2026-08-10 is COMMITTED to release train 2026.08 (window 2026-08-05..2026-08-20, freeze_days 2, capacity 10 points, budget 0 cents) and publish_intent INCLUDED"
