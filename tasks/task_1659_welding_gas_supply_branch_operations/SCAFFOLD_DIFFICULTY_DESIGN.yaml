              payload: { issued_asset_ids: ["${a3}", "${a4}"], returned_asset_ids: ["${a1}", "${a2}"] }
              as: CounterRep
              captures: { o2_status: $.data.fulfillment_status }
            - call: "GET /cylinder-assets/float-summary"
              as: CounterRep
              captures: { total_post: $.data.total_assets }
            - call: "GET /cylinder-assets/${a1}"
              as: CounterRep
              captures: { a1_status: $.data.status, a1_holder: $.data.holder_customer_id }
            - call: "GET /cylinder-assets/${a3}"
              as: CounterRep
              captures: { a3_status: $.data.status, a3_holder: $.data.holder_customer_id }
          assert:
            - "total_pre == 4 and total_post == 4  (register/retire are the ONLY total-changing ops)"
            - "float summary ARGON before swap: full 2, empty 0, out 2; after swap: full 0, empty 2, out 2 — out unchanged by the balanced exchange"
            - "o2_status == FULFILLED"
            - "a1_status == EMPTY and a1_holder == null  (returned to branch stock)"
            - "a3_status == OUT and a3_holder == ${cust_id}  (issued into customer custody)"

      - name: payment_waterfall_cash_conservation
        grounds:
          - calculations.payment_waterfall
          - entities.Invoice.fields.paid_cents
          - entities.Customer.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: applied cash cents — for every payment,
          Σ allocations + credit_added_cents == amount_cents exactly (12000 ==
          5000+5000+2000+0, then 99999 == 8000+91999). Different conserved
          quantity (money vs cylinder count) than the float instance.
        test_recipe:
          setup:
            - "NET30 customer, limit 10000000; products 10000 and 5000 cents, stock 5 each"
            - "Invoice Ib 5000 (due 2026-08-31, issued first), Ic 5000 (due 2026-08-31, issued second), Ia 10000 (due 2026-09-04) — waterfall order Ib -> Ic -> Ia (due_at ASC, tie issued_at ASC)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BranchManager
            - call: "POST /customers"
              payload: { account_no: "ACC-CI2", name: "Waterfall Co", terms: "NET30", credit_limit_cents: 10000000 }
              as: CounterRep
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-CI2A", name: "Grinder", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { p10: $.data.id }
            - call: "POST /products"
              payload: { sku: "HG-CI2B", name: "Disc Pack", category: "HARDGOOD", retail_price_cents: 5000 }
              as: BranchManager
              captures: { p5: $.data.id }
            - call: "POST /products/${p10}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /products/${p5}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${p5}", qty: 1 }] }
              as: CounterRep
              captures: { ob: $.data.id }
            - call: "POST /orders/${ob}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${ob}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${ob}/fulfill"
              payload: {}
              as: CounterRep
              captures: { inv_b: $.data.invoice_id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${p5}", qty: 1 }] }
              as: CounterRep
              captures: { oc: $.data.id }
            - call: "POST /orders/${oc}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oc}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oc}/fulfill"
              payload: {}
              as: CounterRep
              captures: { inv_c: $.data.invoice_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BranchManager
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${p10}", qty: 1 }] }
              as: CounterRep
              captures: { oa: $.data.id }
            - call: "POST /orders/${oa}/confirm"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oa}/stage"
              payload: {}
              as: CounterRep
            - call: "POST /orders/${oa}/fulfill"
              payload: {}
              as: CounterRep
              captures: { inv_a: $.data.invoice_id }
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { cust_v1: $.data.version }
          trigger:
            - call: "POST /customers/${cust_id}/payments"
              payload: { amount_cents: 12000, expected_customer_version: "${cust_v1}" }
              as: CounterRep
              captures: { credit1: $.data.credit_added_cents, out1: $.data.outstanding_balance_cents }
            - call: "GET /invoices/${inv_b}"
              as: CounterRep
              captures: { ib_status: $.data.status }
            - call: "GET /invoices/${inv_c}"
              as: CounterRep
              captures: { ic_status: $.data.status }
            - call: "GET /invoices/${inv_a}"
              as: CounterRep
              captures: { ia_status: $.data.status, ia_paid: $.data.paid_cents }
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { cust_v2: $.data.version }
            - call: "POST /customers/${cust_id}/payments"
              payload: { amount_cents: 99999, expected_customer_version: "${cust_v2}" }
              as: CounterRep
              captures: { credit2: $.data.credit_added_cents, out2: $.data.outstanding_balance_cents }
            - call: "GET /customers/${cust_id}"
              as: CounterRep
              captures: { credit_bal: $.data.credit_balance_cents }
          assert:
            - "credit1 == 0 and out1 == 8000 — allocations Ib 5000 + Ic 5000 + Ia 2000 conserve 12000 exactly (5000+5000+2000+0 == 12000)"
            - "ib_status == PAID and ic_status == PAID  (due_at tie broken by issued_at ASC: Ib before Ic)"
            - "ia_status == OPEN and ia_paid == 2000"
            - "credit2 == 91999 and out2 == 0 — second sweep pays Ia 8000 and conserves 99999 (8000 + 91999 == 99999)"
            - "credit_bal == 91999  (overpayment parked as customer credit)"
