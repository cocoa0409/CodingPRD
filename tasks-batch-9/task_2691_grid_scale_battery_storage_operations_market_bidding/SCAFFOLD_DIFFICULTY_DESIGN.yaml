            - "link 4 — ${r1_status} == RELEASED and ${r2_status} == RELEASED, both with released_reason BID_WITHDRAWN (${r1_reason} and ${r2_reason}), and the ledger is rewritten to ${reserved_after} == 0.0 with ${free_after} == 70.0 — back to the pre-reservation figure because soc_mwh never moved"
