          Conserved quantity #2 — premium cash (distinct from coverage capacity). Invariant
          net_premium_collected_cents == premium_cents - sum(COMPLETED Refund.amount_cents):
          recording payment sets it to premium_cents (20000), and the free-look refund
          (full 20000) drives it back to 0 — cash returns to its pre-payment state.
        test_recipe:
          setup:
            - "BASIC plan base_rate_bps=400, trip_cost 500000 -> base premium 20000, no loadings. Policy issued inside the free-look window, premium PAID."
          setup_api_calls:
