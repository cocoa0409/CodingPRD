# Task 2336 — Municipal Annexation & Boundary Adjustment
# §1.9 Scaffold Corner Design — breadth probe over §1.1–§1.7.
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the guide's nine
# sections; `claim_type:` values are that section's declared claim-type rows.
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * The logical clock's startup default is 2026-08-01T00:00:00Z; only POST /_clock/set_current_utc
#     moves it.
#   * Opaque-role X-User-IDs: StateLawAdmin "sla-01", FiscalAnalyst "fa-01",
#     BoundaryCommissioner "bc-01", CountyAssessor "cta-01".
#   * MunicipalPlanner / CityClerk act with as_user_id "${muni_*}" (identity
#     entity_backed:Municipality); PropertyOwner acts with as_user_id "${ow*}".
#   * Baseline municipality: population 40000, citywide_annual_service_cost_cents 800000000,
#     citywide_population 40000, general_fund_millage_rate 10.0,
#     corporate_boundary_perimeter_feet 80000 (tolerance 5.00, buffer 30 min, surcharge 0.50).
#   * Baseline territory: 4 parcels of 40,000,000 / 30,000,000 / 20,000,000 / 10,000,000 cents,
#     acreage 5.00 each, is_developed true, dwelling_units 2 each; case shared_boundary_feet
#     20000, total_lot_count 4, developed_lot_count 4, dwelling_units 8
#     -> contiguity_ratio 0.2500, territory_acreage 20.00,
#        territory_assessed_value_cents 100,000,000, qualification_index 100.00.
#   * Baseline healthy fiscal analysis: AVERAGE_COST, projected_population 5
#     -> property tax 1,000,000 + shared 60,000 = gross 1,060,000; base cost 100,000,
#        tier 0.12, overhead 12,000, total 112,000, net +948,000, deficit_ratio_pct 0.00.

scaffold_corner_design:

  # =====================================================================================
  # SECTION 1 — Entities
  # =====================================================================================
  - section: entities
    instances:
      - name: municipality_creation_echoes_inputs_and_starts_with_a_zero_tax_base
        claim_type: creation
        grounds:
          - endpoints[POST /municipalities]
          - entities.Municipality.fields.taxable_assessed_value_cents
          - entities.Municipality.fields.general_fund_millage_rate
        distinguishing_aspect: |
          POST /municipalities with every required input returns 201 with all inputs echoed
          verbatim and the computed tax base seeded to 0 — the municipal roll only grows when a
          case posts its tax roll, never at registration.
        test_recipe:
          setup:
            - "Empty database except for one StatuteProfile for state NC."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_mc: $.data.id }
          trigger:
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_mc}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_mc: $.data.id, muni_mc_base: $.data.taxable_assessed_value_cents, muni_mc_version: $.data.version }
          assert:
            - "trigger response status == 201"
            - "${muni_mc_base} == 0"
            - "${muni_mc_version} == 1"
            - "Municipality.${muni_mc}.name == Cedar Grove"
            - "Municipality.${muni_mc}.statute_profile_id == ${st_mc}"
            - "Municipality.${muni_mc}.general_fund_millage_rate == 10.0"
            - "Municipality.${muni_mc}.corporate_boundary_perimeter_feet == 80000"
            - "Municipality.${muni_mc}.taxable_assessed_value_cents == 0"

      - name: annexation_case_retrieval_returns_the_stored_case_with_its_aggregates
        claim_type: retrieval
        grounds:
          - endpoints[GET /annexation-cases/{caseId}]
          - entities.AnnexationCase.fields.parcel_count
          - entities.AnnexationCase.fields.territory_assessed_value_cents
        distinguishing_aspect: |
          GET /annexation-cases/{caseId} returns the same row the create and parcel calls built —
          parcel_count 4 and territory_assessed_value_cents 100,000,000 are read back unchanged,
          proving the read path serves persisted state rather than recomputing from the request.
        test_recipe:
          setup:
            - "One DRAFT AnnexationCase holding the baseline four parcels."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_rt: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_rt}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_rt: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_rt: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_rt}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_rt}"
              captures: { case_rt: $.data.id }
            - call: "POST /annexation-cases/${case_rt}/parcels"
              payload: { primary_owner_id: "${ow_rt}", parcel_apn: "RT-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_rt}"
            - call: "POST /annexation-cases/${case_rt}/parcels"
              payload: { primary_owner_id: "${ow_rt}", parcel_apn: "RT-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_rt}"
            - call: "POST /annexation-cases/${case_rt}/parcels"
              payload: { primary_owner_id: "${ow_rt}", parcel_apn: "RT-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_rt}"
            - call: "POST /annexation-cases/${case_rt}/parcels"
              payload: { primary_owner_id: "${ow_rt}", parcel_apn: "RT-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_rt}"
          trigger:
            - call: "GET /annexation-cases/${case_rt}"
              payload: {}
              as: CountyAssessor
              as_user_id: "cta-01"
              captures: { rt_status: $.data.status, rt_count: $.data.parcel_count, rt_value: $.data.territory_assessed_value_cents, rt_acreage: $.data.territory_acreage }
          assert:
            - "trigger response status == 200"
            - "${rt_status} == DRAFT"
            - "${rt_count} == 4"
            - "${rt_value} == 100000000"
            - "${rt_acreage} == 20.00"
            - "AnnexationCase.${case_rt}.municipality_id == ${muni_rt}"
            - "AnnexationCase.${case_rt}.case_type == ANNEXATION"

      - name: parcel_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /parcels]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /parcels filtered by annexation_case_id with limit 2 reports total_count 4 across
          both pages while has_more flips true on offset 0 and false on offset 2 — total_count
          counts the whole filtered set, not the returned page.
        test_recipe:
          setup:
            - "One DRAFT AnnexationCase holding the baseline four parcels, and a second case in the same municipality holding one parcel that must not leak into the filtered page."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_pg: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_pg}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_pg: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_pg: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_pg}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_pg}"
              captures: { case_pg: $.data.id }
            - call: "POST /annexation-cases/${case_pg}/parcels"
              payload: { primary_owner_id: "${ow_pg}", parcel_apn: "PG-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pg}"
            - call: "POST /annexation-cases/${case_pg}/parcels"
              payload: { primary_owner_id: "${ow_pg}", parcel_apn: "PG-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pg}"
            - call: "POST /annexation-cases/${case_pg}/parcels"
              payload: { primary_owner_id: "${ow_pg}", parcel_apn: "PG-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pg}"
            - call: "POST /annexation-cases/${case_pg}/parcels"
              payload: { primary_owner_id: "${ow_pg}", parcel_apn: "PG-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pg}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_pg}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pg}"
              captures: { case_pg2: $.data.id }
            - call: "POST /annexation-cases/${case_pg2}/parcels"
              payload: { primary_owner_id: "${ow_pg}", parcel_apn: "PG-9", assessed_value_cents: 5000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pg}"
          trigger:
            - call: "GET /parcels?annexation_case_id=${case_pg}&limit=2&offset=0"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "GET /parcels?annexation_case_id=${case_pg}&limit=2&offset=2"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
          assert:
            - "GET /parcels?annexation_case_id=${case_pg}&limit=2&offset=0 returns total_count == 4, has_more == true and exactly 2 items"
            - "GET /parcels?annexation_case_id=${case_pg}&limit=2&offset=2 returns total_count == 4, has_more == false and exactly 2 items"
            - "GET /parcels?annexation_case_id=${case_pg2} returns total_count == 1"
            - "GET /parcels returns total_count == 5"

      - name: get_annexation_case_with_an_unknown_id_returns_case_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CASE_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: |
          A syntactically valid but unknown caseId on GET /annexation-cases/{caseId} returns the
          entity-specific ERR_CASE_NOT_FOUND (404), not a generic 500 or an empty 200 body.
        test_recipe:
          setup:
            - "Empty database — no AnnexationCase row exists at all."
          setup_api_calls: []
          trigger:
            - call: "GET /annexation-cases/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { err_nf: $.data.error_id }
          assert:
            - "${err_nf} == ERR_CASE_NOT_FOUND"
            - "trigger response status == 404"
            - "GET /annexation-cases returns total_count == 0"

      - name: municipality_creation_missing_required_population_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /municipalities]
        distinguishing_aspect: |
          `population` carries source input with no default, so omitting it must fail with
          ERR_INVALID_REQUEST (400) and persist nothing — the endpoint must not silently default
          the population to 0.
        test_recipe:
          setup:
            - "One StatuteProfile for state NC and no Municipality rows."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_rq: $.data.id }
          trigger:
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_rq}", name: "Cedar Grove", state_code: "NC", citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { err_rq: $.data.error_id }
          assert:
            - "${err_rq} == ERR_INVALID_REQUEST"
            - "trigger response status == 400"
            - "GET /municipalities returns total_count == 0"

      - name: statute_profile_omitted_optionals_apply_every_declared_default
        claim_type: defaults
        grounds:
          - entities.StatuteProfile.fields.signature_threshold_pct
          - entities.StatuteProfile.fields.contiguity_min_ratio
          - entities.StatuteProfile.fields.required_service_types
          - entities.StatuteProfile.fields.effective_date_rule
        distinguishing_aspect: |
          Creating a StatuteProfile with only its two required inputs must materialise every
          declared default — protest_threshold_pct 20.00, contiguity_min_ratio 0.1250,
          min_qualification_index 60.00, required_service_types [POLICE, FIRE, WATER, SEWER],
          effective_date_rule IMMEDIATE and fiscal_year_end_month_day 12-31 — rather than nulls.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY", "INVOLUNTARY_ORDINANCE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_df: $.data.id, df_sig: $.data.signature_threshold_pct, df_prot: $.data.protest_threshold_pct, df_cont: $.data.contiguity_min_ratio, df_min: $.data.min_qualification_index }
          assert:
            - "${df_sig} == 50.00"
            - "${df_prot} == 20.00"
            - "${df_cont} == 0.125"
            - "${df_min} == 60.00"
            - "StatuteProfile.${st_df}.signature_basis == ASSESSED_VALUE"
            - "StatuteProfile.${st_df}.protest_basis == ASSESSED_VALUE"
            - "StatuteProfile.${st_df}.urban_density_min_units_per_acre == 2.00"
            - "StatuteProfile.${st_df}.subdivision_test_min_developed_ratio == 0.60"
            - "StatuteProfile.${st_df}.notice_min_days == 30"
            - "StatuteProfile.${st_df}.hearing_to_ordinance_min_days == 10"
            - "StatuteProfile.${st_df}.required_service_types == [POLICE, FIRE, WATER, SEWER]"
            - "StatuteProfile.${st_df}.police_fire_timeline_max_days == 60"
            - "StatuteProfile.${st_df}.water_sewer_timeline_max_days == 730"
            - "StatuteProfile.${st_df}.fiscal_method == AVERAGE_COST"
            - "StatuteProfile.${st_df}.per_capita_shared_revenue_cents == 12000"
            - "StatuteProfile.${st_df}.referendum_required_methods == []"
            - "StatuteProfile.${st_df}.boundary_commission_required == false"
            - "StatuteProfile.${st_df}.de_annexation_allowed == true"
            - "StatuteProfile.${st_df}.de_annexation_refund_basis == DAILY_PRORATION"
            - "StatuteProfile.${st_df}.msd_alternative_allowed == true"
            - "StatuteProfile.${st_df}.msd_cost_recovery_pct == 0.75"
            - "StatuteProfile.${st_df}.effective_date_rule == IMMEDIATE"
            - "StatuteProfile.${st_df}.fiscal_year_end_month_day == 12-31"

      - name: petition_circulation_deadline_is_computed_from_the_clock_and_circulation_days
        claim_type: computed_fields
        grounds:
          - entities.Petition.fields.circulation_deadline_at
          - entities.Petition.fields.circulation_started_at
          - state_machines.AnnexationCase.TERRITORY_CERTIFIED_to_PETITION_CIRCULATING
        distinguishing_aspect: |
          circulation_started_at is the logical clock at creation (2026-08-15T12:00:00Z) and
          circulation_deadline_at is that instant plus circulation_days — exactly
          2026-09-14T12:00:00Z for 30 days — so the deadline is derived, never supplied.
        test_recipe:
          setup:
            - "One certified AnnexationCase with method PETITION_MAJORITY."
            - "Logical clock moved to 2026-08-15T12:00:00Z before the petition is opened."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_cd: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_cd}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_cd: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_cd: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_cd}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_cd}"
              captures: { case_cd: $.data.id }
            - call: "POST /annexation-cases/${case_cd}/parcels"
              payload: { primary_owner_id: "${ow_cd}", parcel_apn: "CD-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cd}"
            - call: "POST /annexation-cases/${case_cd}/parcels"
              payload: { primary_owner_id: "${ow_cd}", parcel_apn: "CD-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cd}"
            - call: "POST /annexation-cases/${case_cd}/parcels"
              payload: { primary_owner_id: "${ow_cd}", parcel_apn: "CD-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cd}"
            - call: "POST /annexation-cases/${case_cd}/parcels"
              payload: { primary_owner_id: "${ow_cd}", parcel_apn: "CD-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cd}"
            - call: "POST /annexation-cases/${case_cd}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_cd}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:00:00Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
          trigger:
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_cd}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_cd}"
              captures: { pet_cd: $.data.id, cd_started: $.data.circulation_started_at, cd_deadline: $.data.circulation_deadline_at, cd_status: $.data.sufficiency_status }
          assert:
            - "${cd_started} == 2026-08-15T12:00:00Z"
            - "${cd_deadline} == 2026-09-14T12:00:00Z"
            - "${cd_status} == CIRCULATING"
            - "Petition.${pet_cd}.qualified_signature_assessed_value_cents == 0"
            - "Petition.${pet_cd}.signature_value_pct == 0.00"
            - "AnnexationCase.${case_cd}.status == PETITION_CIRCULATING"

      - name: notice_publication_published_at_is_system_stamped_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.NoticePublication.fields.published_at
          - entities.NoticePublication.fields.notice_status
          - endpoints[POST /public-hearings/{hearingId}/notice-publications]
        distinguishing_aspect: |
          published_at and notice_status carry source system, so a client-supplied
          published_at of 2020-01-01T00:00:00Z is ignored: the stored value is the logical clock
          reading 2026-08-01T00:00:00Z and notice_status is PUBLISHED.
        test_recipe:
          setup:
            - "One certified AnnexationCase with an ADOPTED PlanOfServices and a SCHEDULED hearing."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_sf: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_sf}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_sf: $.data.id }
            - call: "POST /municipalities/${muni_sf}/service-providers"
              payload: { provider_name: "Cedar Grove Police", service_types: ["POLICE"], concurrent_project_capacity: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_sf}"
              captures: { prov_sf: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_sf: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_sf}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_sf}"
              captures: { case_sf: $.data.id }
            - call: "POST /annexation-cases/${case_sf}/parcels"
              payload: { primary_owner_id: "${ow_sf}", parcel_apn: "SF-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_sf}"
            - call: "POST /annexation-cases/${case_sf}/parcels"
