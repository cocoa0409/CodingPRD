# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Privacy DSAR
# Expert band. 9 rules x >=2 instances each.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deadline_gdpr_vs_ccpa_diverge_for_identical_received_at
        grounds:
          - calculations.statutory_deadline
          - entities.Controller.fields.jurisdiction
          - entities.DsarRequest.fields.deadline_at
        distinguishing_aspect: |
          Identical received_at 2026-01-05T09:00:00Z yields deadline_at 2026-02-04T09:00:00Z
          under a GDPR controller (base 30 days) but 2026-02-19T09:00:00Z under a CCPA
          controller (base 45 days); the divergence lives on the Controller/DsarRequest domain.
        test_recipe:
          setup:
            - "Two controllers, one GDPR and one CCPA, each with one ACCESS request received at the same instant."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "EU Co", jurisdiction: "GDPR", dpo_email: "dpo@eu.example" }
              as: PrivacyOfficer
              captures: { ctrl_gdpr_id: $.data.id }
            - call: "POST /controllers"
              payload: { name: "US Co", jurisdiction: "CCPA", dpo_email: "dpo@us.example" }
              as: PrivacyOfficer
              captures: { ctrl_ccpa_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_gdpr_id}", email: "a@eu.example", full_name: "A EU", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_gdpr_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_ccpa_id}", email: "b@us.example", full_name: "B US", jurisdiction_residency: "CALIFORNIA" }
              as: IntakeAgent
              captures: { sub_ccpa_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_gdpr_id}", data_subject_id: "${sub_gdpr_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_gdpr_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_ccpa_id}", data_subject_id: "${sub_ccpa_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_ccpa_id: $.data.id }
          trigger:
            - call: "GET /dsar-requests/${req_gdpr_id}"
              as: PrivacyOfficer
              captures: { gdpr_deadline: $.data.deadline_at }
            - call: "GET /dsar-requests/${req_ccpa_id}"
              as: PrivacyOfficer
              captures: { ccpa_deadline: $.data.deadline_at }
          assert:
            - "DsarRequest.${req_gdpr_id}.deadline_at == 2026-02-04T09:00:00Z"
            - "DsarRequest.${req_ccpa_id}.deadline_at == 2026-02-19T09:00:00Z"
            - "DsarRequest.${req_gdpr_id}.deadline_at != DsarRequest.${req_ccpa_id}.deadline_at"

      - name: erasure_residual_diverges_completed_vs_uncompleted
        grounds:
          - calculations.erasure_exposure_score
          - entities.FulfillmentItem.fields.state
          - entities.FulfillmentItem.fields.data_category
        distinguishing_aspect: |
          The same two ERASE items (HEALTH x2, FINANCIAL x3) score 45.45 when only the FINANCIAL
          item is COMPLETED but 0.00 when both are COMPLETED; divergence lives on the FulfillmentItem
          risk domain, distinct from the DsarRequest deadline domain of the sibling dual-variant instance.
        test_recipe:
          setup:
            - "A DELETION request in FULFILLING with two ERASE items: HEALTH x2 still QUEUED, FINANCIAL x3 COMPLETED."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "Del Co", jurisdiction: "GDPR", dpo_email: "dpo@del.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "Proc1", notify_email: "p1@x.example", sla_ack_hours: 72 }
              as: PrivacyOfficer
              captures: { proc_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "del@x.example", full_name: "Del Subj", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "DELETION", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "passport-1" }
              as: IntakeAgent
              as_user_id: "intake-77"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "HEALTH", record_count: 2, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_health_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "FINANCIAL", record_count: 3, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_fin_id: $.data.id }
            - call: "POST /findings/${find_health_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /findings/${find_fin_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: $.data.version }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-9"
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${find_fin_id}" }
              as: PrivacyOfficer
              captures: { item_fin_id: "$.data[0].id", item_fin_v: "$.data[0].version" }
            - call: "POST /fulfillment-items/${item_fin_id}/dispatch"
              payload: { expected_item_version: "${item_fin_v}" }
              as: FulfillmentWorker
            - call: "GET /fulfillment-items/${item_fin_id}/notifications"
              as: FulfillmentWorker
              captures: { notif_fin_id: "$.data[0].id" }
            - call: "POST /processor-notifications/${notif_fin_id}/acknowledge"
              as: ProcessorAgent
            - call: "POST /fulfillment-items/${item_fin_id}/complete"
              as: FulfillmentWorker
          trigger:
            - call: "GET /dsar-requests/${req_id}/risk"
              as: PrivacyOfficer
              captures: { score: $.data.erasure_exposure_score }
          assert:
            - "GET /dsar-requests/${req_id}/risk .data.erasure_exposure_score == 45.45"
            - "GET /dsar-requests/${req_id}/risk .data.residual_weighted == 10"
            - "GET /dsar-requests/${req_id}/risk .data.total_weighted == 22"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: erasure_score_three_input_nonlinear_weighting
        grounds:
          - calculations.erasure_exposure_score
          - entities.FulfillmentItem.fields.record_count
          - entities.FulfillmentItem.fields.data_category
        distinguishing_aspect: |
          MODE (a): score = round(100 * SUM(weight[category]*record_count over residual states)
          / SUM(weight[category]*record_count over all ERASE items), 2) combines category weight,
          record_count, and per-item state filter in one non-linear formula — IDENTITY x1 BLOCKED plus
          CONTACT x2 COMPLETED gives 42.86, not a linear average of the two.
        test_recipe:
          setup:
            - "DELETION request in FULFILLING; one IDENTITY x1 ERASE item BLOCKED by a legal hold, one CONTACT x2 ERASE item COMPLETED."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C2", jurisdiction: "GDPR", dpo_email: "dpo@c2.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "P2", notify_email: "p2@x.example", sla_ack_hours: 72 }
              as: PrivacyOfficer
              captures: { proc_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "c2@x.example", full_name: "C2 Subj", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", matter_reference: "M-1", data_categories: ["IDENTITY"] }
              as: PrivacyOfficer
              captures: { hold_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "DELETION", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-1" }
              as: IntakeAgent
              as_user_id: "intake-1"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "IDENTITY", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_id_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "CONTACT", record_count: 2, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_ct_id: $.data.id }
            - call: "POST /findings/${find_id_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /findings/${find_ct_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: $.data.version }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-2"
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${find_ct_id}" }
              as: PrivacyOfficer
              captures: { item_ct_id: "$.data[0].id", item_ct_v: "$.data[0].version" }
            - call: "POST /fulfillment-items/${item_ct_id}/dispatch"
              payload: { expected_item_version: "${item_ct_v}" }
              as: FulfillmentWorker
            - call: "GET /fulfillment-items/${item_ct_id}/notifications"
              as: FulfillmentWorker
              captures: { notif_ct_id: "$.data[0].id" }
            - call: "POST /processor-notifications/${notif_ct_id}/acknowledge"
              as: ProcessorAgent
            - call: "POST /fulfillment-items/${item_ct_id}/complete"
              as: FulfillmentWorker
          trigger:
            - call: "GET /dsar-requests/${req_id}/risk"
              as: PrivacyOfficer
              captures: { score: $.data.erasure_exposure_score }
          assert:
            - "GET /dsar-requests/${req_id}/risk .data.erasure_exposure_score == 42.86"
            - "GET /dsar-requests/${req_id}/risk .data.residual_weighted == 3"
            - "GET /dsar-requests/${req_id}/risk .data.total_weighted == 7"

      - name: fulfillment_progress_sum_then_round_two_thirds
        grounds:
          - calculations.fulfillment_progress
          - entities.DsarRequest.fields.fulfillment_progress_pct
          - entities.FulfillmentItem.fields.state
        distinguishing_aspect: |
          MODE (b): progress pins ROUND-AFTER-DIVISION (sum-then-round) — 2 terminal of 3 items is
          round(100*2/3,2)=66.67, not per-item rounding (which would drift); a different combinatorial
          axis from the >=3-input non-linear weighting of the sibling instance.
        test_recipe:
          setup:
            - "ACCESS request in FULFILLING with three DISCLOSE items; two COMPLETED, one still QUEUED."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C3", jurisdiction: "GDPR", dpo_email: "dpo@c3.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "P3", notify_email: "p3@x.example", sla_ack_hours: 72 }
              as: PrivacyOfficer
              captures: { proc_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "c3@x.example", full_name: "C3 Subj", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-3" }
              as: IntakeAgent
              as_user_id: "intake-3"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "IDENTITY", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { f1: $.data.id }
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "CONTACT", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { f2: $.data.id }
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "BEHAVIORAL", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { f3: $.data.id }
            - call: "POST /findings/${f1}/confirm"
              as: PrivacyOfficer
            - call: "POST /findings/${f2}/confirm"
              as: PrivacyOfficer
            - call: "POST /findings/${f3}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: $.data.version }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-3"
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${f1}" }
              as: PrivacyOfficer
              captures: { item1_id: "$.data[0].id", item1_v: "$.data[0].version" }
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${f2}" }
              as: PrivacyOfficer
              captures: { item2_id: "$.data[0].id", item2_v: "$.data[0].version" }
            - call: "POST /fulfillment-items/${item1_id}/dispatch"
              payload: { expected_item_version: "${item1_v}" }
              as: FulfillmentWorker
            - call: "GET /fulfillment-items/${item1_id}/notifications"
              as: FulfillmentWorker
              captures: { n1: "$.data[0].id" }
            - call: "POST /processor-notifications/${n1}/acknowledge"
              as: ProcessorAgent
            - call: "POST /fulfillment-items/${item1_id}/complete"
              as: FulfillmentWorker
            - call: "POST /fulfillment-items/${item2_id}/dispatch"
              payload: { expected_item_version: "${item2_v}" }
              as: FulfillmentWorker
            - call: "GET /fulfillment-items/${item2_id}/notifications"
              as: FulfillmentWorker
              captures: { n2: "$.data[0].id" }
            - call: "POST /processor-notifications/${n2}/acknowledge"
              as: ProcessorAgent
            - call: "POST /fulfillment-items/${item2_id}/complete"
              as: FulfillmentWorker
          trigger:
            - call: "GET /dsar-requests/${req_id}"
              as: PrivacyOfficer
              captures: { pct: $.data.fulfillment_progress_pct }
          assert:
            - "DsarRequest.${req_id}.fulfillment_progress_pct == 66.67"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dsar_identity_verification_revision_cycle
        grounds:
          - state_machines.DsarRequest.PENDING_VERIFICATION_to_VERIFICATION_REJECTED
          - state_machines.DsarRequest.VERIFICATION_REJECTED_to_PENDING_VERIFICATION
          - entities.DsarRequest.fields.identity_attempts
        distinguishing_aspect: |
          The DsarRequest machine cycles PENDING_VERIFICATION -> VERIFICATION_REJECTED ->
          PENDING_VERIFICATION (a true loop, not a linear pipeline); identity_attempts increments to 2
          across one reject + a later second reject, proving the loop was traversed.
        test_recipe:
          setup:
            - "A request rejected once, resubmitted, then rejected again — back in VERIFICATION_REJECTED with identity_attempts=2."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C4", jurisdiction: "GDPR", dpo_email: "dpo@c4.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "c4@x.example", full_name: "C4 Subj", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/reject-identity"
              payload: { reason: "blurry id" }
              as: IntakeAgent
              as_user_id: "intake-4"
            - call: "POST /dsar-requests/${req_id}/resubmit-identity"
              as: IntakeAgent
              as_user_id: "intake-4"
          trigger:
            - call: "POST /dsar-requests/${req_id}/reject-identity"
              payload: { reason: "still blurry" }
              as: IntakeAgent
              as_user_id: "intake-4"
              captures: { status: $.data.status, attempts: $.data.identity_attempts }
          assert:
            - "DsarRequest.${req_id}.status == VERIFICATION_REJECTED"
            - "DsarRequest.${req_id}.identity_attempts == 2"

      - name: finding_confirm_then_redismiss_redecision_edge
        grounds:
          - state_machines.DiscoveryFinding.PENDING_to_CONFIRMED
          - state_machines.DiscoveryFinding.CONFIRMED_to_DISMISSED
          - entities.DiscoveryFinding.fields.state
        distinguishing_aspect: |
          The DiscoveryFinding machine (a different entity from DsarRequest) is non-linear via a
          CONFIRMED -> DISMISSED re-decision edge: a finding moves PENDING -> CONFIRMED then
          CONFIRMED -> DISMISSED, a backward branch impossible in a forward-only pipeline.
        test_recipe:
          setup:
            - "A request in DISCOVERY with one finding confirmed then later dismissed."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C5", jurisdiction: "GDPR", dpo_email: "dpo@c5.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "P5", notify_email: "p5@x.example" }
              as: PrivacyOfficer
              captures: { proc_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "c5@x.example", full_name: "C5 Subj", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-5" }
              as: IntakeAgent
              as_user_id: "intake-5"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "CONTACT", record_count: 1, confidence: "PROBABLE" }
              as: PrivacyOfficer
              captures: { find_id: $.data.id }
            - call: "POST /findings/${find_id}/confirm"
              as: PrivacyOfficer
          trigger:
            - call: "POST /findings/${find_id}/dismiss"
              as: PrivacyOfficer
              captures: { fstate: $.data.state }
          assert:
            - "DiscoveryFinding.${find_id}.state == DISMISSED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispatch_then_complete_suppress_cascades_consent_withdrawal
        grounds:
          - state_machines.FulfillmentItem.QUEUED_to_DISPATCHED
          - state_machines.FulfillmentItem.DISPATCHED_to_COMPLETED
          - state_machines.ConsentRecord.GRANTED_to_WITHDRAWN
          - entities.ConsentRecord.fields.state
        distinguishing_aspect: |
          Depth-3 cascade originating from item DISPATCH: dispatch creates a ProcessorNotification
          (hop 1) -> acknowledge enables complete which (hop 2) for a SUPPRESS item (hop 3) flips every
          GRANTED MARKETING/ANALYTICS/SALE_OF_DATA ConsentRecord of the subject to WITHDRAWN.
        test_recipe:
          setup:
            - "OPT_OUT request in FULFILLING with one SUPPRESS item DISPATCHED+acked; subject has a GRANTED MARKETING consent."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C6", jurisdiction: "CCPA", dpo_email: "dpo@c6.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
            - call: "POST /processors"
              payload: { controller_id: "${ctrl_id}", name: "P6", notify_email: "p6@x.example", sla_ack_hours: 72 }
              as: PrivacyOfficer
              captures: { proc_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { controller_id: "${ctrl_id}", email: "c6@x.example", full_name: "C6 Subj", jurisdiction_residency: "CALIFORNIA" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${sub_id}", purpose: "MARKETING" }
              as: IntakeAgent
              captures: { consent_id: $.data.id }
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "OPT_OUT", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-6" }
              as: IntakeAgent
              as_user_id: "intake-6"
            - call: "POST /dsar-requests/${req_id}/findings"
              payload: { processor_id: "${proc_id}", data_category: "BEHAVIORAL", record_count: 1, confidence: "EXACT" }
              as: PrivacyOfficer
              captures: { find_id: $.data.id }
            - call: "POST /findings/${find_id}/confirm"
              as: PrivacyOfficer
            - call: "POST /dsar-requests/${req_id}/complete-discovery"
              as: PrivacyOfficer
              captures: { req_v_review: $.data.version }
            - call: "POST /dsar-requests/${req_id}/dispatch-fulfillment"
              payload: { expected_request_version: "${req_v_review}" }
              as: PrivacyOfficer
              as_user_id: "officer-6"
            - call: "GET /fulfillment-items"
              payload: { discovery_finding_id: "${find_id}" }
              as: PrivacyOfficer
              captures: { item_id: "$.data[0].id", item_v: "$.data[0].version" }
            - call: "POST /fulfillment-items/${item_id}/dispatch"
              payload: { expected_item_version: "${item_v}" }
              as: FulfillmentWorker
            - call: "GET /fulfillment-items/${item_id}/notifications"
              as: FulfillmentWorker
              captures: { notif_id: "$.data[0].id" }
            - call: "POST /processor-notifications/${notif_id}/acknowledge"
              as: ProcessorAgent
          trigger:
