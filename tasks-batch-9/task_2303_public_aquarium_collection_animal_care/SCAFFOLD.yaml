# =============================================================================
# PRD Benchmark Seed Tables — task_2303_public_aquarium_collection_animal_care
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================

scenario: |
  2303. Public Aquarium Collection & Animal Care (public aquarium): collection plan by exhibit with species selection, acquisition source and sustainability sourcing standards, permits for protected species with import, transport and possession documentation, life support system monitoring with water quality parameters, alarm thresholds and redundancy testing, quarantine protocols for new arrivals with duration and clearance criteria, husbandry records including feeding, medical treatment and behavioral observations, veterinary care with preventive health programs and necropsy investigation, breeding programs and animal transfers with receiving institution standards, accreditation inspection readiness and public interaction program safety rules

domain_name: "public-aquarium-collection-care"
api_prefix: "/aquarium"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # graph: Specimen references Specimen (sire/dam breeding lineage); Exhibit and
  # LifeSupportSystem form a many-to-one service graph that CollectionPlanEntry,
  # Specimen and InteractionSession all cut across; TransferRequest links
  # Specimen × Institution × Permit (three-way cross-aggregate edge).

  state_machine_shape: parallel
  # Specimen carries two independent state dimensions (disposition_status and
  # health_status) that advance on separate triggers; Permit, TransferRequest,
  # QuarantineCase, LifeSupportSystem.alarm_state and AccreditationAudit are
  # cyclic; AcquisitionRequest forks on permit_required and rejoins at CLEARED;
  # Exhibit.posture is a derived compound field over its LifeSupportSystem and
  # its own bioload utilisation.

  relationship_patterns:
    - one_to_many
    - self_referential          # Specimen.sire_specimen_id / dam_specimen_id -> Specimen.id
    - cross_aggregate           # TransferRequest -> Specimen × Institution × Permit
    - many_to_one_shared_resource  # many Exhibit -> one LifeSupportSystem

  role_model: segregation_of_duties
  # The ComplianceDirector user id that approves a CollectionPlanEntry may not
  # clear an AcquisitionRequest beneath it; the director that opens an
  # AccreditationAudit may not close it. Curator / Veterinarian / Aquarist /
  # PermitOfficer own disjoint resource types; PartnerInstitutionLiaison is
  # entity-backed and scoped to its own Institution.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities · 63 endpoints · 48 ordered validation rows · 60 error codes ·
  # 13 calculations (2 dual-variant, 3 combinatorial modes) · 12 state machines
  # across 11 entities (Specimen carries two independent dimensions) ·
  # 3 OCC concurrency rules · 6 roles.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: LifeSupportSystem
    parent: null
    common_fields: true
    fields:
      - name: system_code
        type: string
        source: input
        description: Operator-facing identifier of the life support plant.
        constraints: "1-32 chars; unique across LifeSupportSystem"
      - name: system_type
        type: enum
        source: input
        description: Plant topology.
        constraints: "RECIRCULATING_MARINE | FLOW_THROUGH | CLOSED_FRESHWATER"
      - name: design_habitat
        type: enum
        source: input
        description: Habitat the plant is engineered for; selects the water-quality target band table in §1.3 water_quality_index.
        constraints: "COLD_MARINE | TROPICAL_MARINE | FRESHWATER | TOUCH_POOL"
      - name: redundancy_class
        type: enum
        source: input
        description: Redundancy design of pumps/chillers.
        constraints: "N | N_PLUS_1 | TWO_N"
      - name: redundancy_test_interval_days
        type: integer
        source: input
        description: Maximum number of days allowed between passing redundancy tests.
        default: 90
        constraints: ">= 7 and <= 365"
      - name: last_redundancy_test_at
        type: datetime
        source: computed
        description: performed_at of the most recent redundancy test with result PASS; null when none has passed.
        default: null
      - name: last_redundancy_test_result
        type: enum
        source: computed
        description: result of the most recent redundancy test regardless of outcome; null when none recorded.
        default: null
        constraints: "PASS | FAIL | null"
      - name: redundancy_overdue
        type: boolean
        source: computed
        description: "true when clock_now >= (last_redundancy_test_at ?? created_at) + redundancy_test_interval_days days."
        default: false
      - name: alarm_state
        type: enum
        source: computed
        description: Alarm posture driven by water-quality readings and redundancy tests (§1.2 LifeSupportSystem).
        default: NORMAL
        constraints: "NORMAL | WARNING | CRITICAL | OFFLINE"
      - name: consecutive_normal_readings
        type: integer
        source: computed
        description: Count of consecutive WaterQualityReading rows with severity NORMAL since the last non-NORMAL reading; never reset by an alarm_state downgrade.
        default: 0
      - name: consecutive_breach_readings
        type: integer
        source: computed
        description: Count of consecutive WaterQualityReading rows with severity WARNING or CRITICAL since the last NORMAL reading.
        default: 0
      - name: water_quality_index
        type: number
        source: computed
        description: water_quality_index_snapshot of the latest reading (§1.3 latest_reading_selector); 100.00 when the system has no readings.
        default: 100.00
        constraints: "0.00 - 100.00, 2 decimals"

  - name: WaterQualityReading
    parent: LifeSupportSystem
    common_fields: false
    fields:
      - name: life_support_system_id
        type: string
        source: system
        description: "FK -> LifeSupportSystem.id; taken from the path segment of POST /aquarium/life-support-systems/{id}/water-quality-readings."
      - name: taken_at
        type: datetime
        source: input
        description: Instant the sample was drawn; must be <= clock_now.
      - name: temperature_c
        type: number
        source: input
        description: Water temperature in degrees Celsius.
      - name: salinity_ppt
        type: number
        source: input
        description: Salinity in parts per thousand.
        constraints: ">= 0"
      - name: ph
        type: number
        source: input
        description: pH of the sample.
        constraints: "0 - 14"
      - name: dissolved_oxygen_mg_l
        type: number
        source: input
        description: Dissolved oxygen in mg/L.
        constraints: ">= 0"
      - name: ammonia_mg_l
        type: number
        source: input
        description: Total ammonia nitrogen in mg/L.
        constraints: ">= 0"
      - name: nitrite_mg_l
        type: number
        source: input
        description: Nitrite in mg/L.
        constraints: ">= 0"
      - name: severity
        type: enum
        source: computed
        description: Worst-parameter severity of this reading (§1.3 water_quality_index).
        constraints: "NORMAL | WARNING | CRITICAL"
      - name: breach_parameters
        type: array
        source: computed
        description: Parameter field names whose deviation ratio >= 1.0, emitted in the fixed canonical order [temperature_c, salinity_ppt, ph, dissolved_oxygen_mg_l, ammonia_mg_l, nitrite_mg_l]; empty array when severity is NORMAL.
      - name: water_quality_index_snapshot
        type: number
        source: computed
        description: Index value computed from this reading alone (§1.3 water_quality_index).
        constraints: "0.00 - 100.00, 2 decimals"

  - name: Exhibit
    parent: null
    common_fields: true
    fields:
      - name: exhibit_code
        type: string
        source: input
        description: Public gallery code of the exhibit.
        constraints: "unique across Exhibit"
      - name: name
        type: string
        source: input
        description: Public display name.
      - name: habitat_type
        type: enum
        source: input
        description: Habitat class of the exhibit; must equal the serving LifeSupportSystem.design_habitat.
        constraints: "COLD_MARINE | TROPICAL_MARINE | FRESHWATER | TOUCH_POOL"
      - name: life_support_system_id
        type: string
        source: input
        description: "FK -> LifeSupportSystem.id; the plant that serves this exhibit."
      - name: display_volume_liters
        type: number
        source: input
        description: Water volume on display.
        constraints: "> 0"
      - name: bioload_capacity_units
        type: number
        source: input
        description: Maximum summed specimen bioload the exhibit may hold.
        constraints: "> 0"
      - name: occupied_bioload_units
        type: number
        source: computed
        description: Sum of Specimen.bioload_units for specimens whose exhibit_id is this exhibit and disposition_status IN {ON_EXHIBIT, TRANSFER_PENDING} (§1.3 exhibit_bioload_ledger).
        default: 0.00
      - name: bioload_utilization_pct
        type: number
        source: computed
        description: round(occupied_bioload_units / bioload_capacity_units * 100, 2) (§1.3 exhibit_bioload_ledger).
        default: 0.00
      - name: posture
        type: enum
        source: computed
        description: Derived operating posture gating placements and interaction sessions (§1.3 exhibit_posture).
        default: OPEN
        constraints: "OPEN | RESTRICTED | CLOSED"
      - name: last_posture_reason
        type: string
        source: computed
        description: Machine code of the dominant posture driver; null while posture is OPEN.
        default: null
        constraints: "LSS_CRITICAL | LSS_OFFLINE | LSS_WARNING | REDUNDANCY_OVERDUE | BIOLOAD_PRESSURE | null"
      - name: interaction_program_enabled
        type: boolean
        source: input
        description: Whether guest interaction programmes may be scheduled on this exhibit; auto-set to false by the suspension-threshold cascade (§1.2 InteractionSession).
        default: false
      - name: suspended_session_count
        type: integer
        source: computed
        description: Lifetime count of InteractionSession rows on this exhibit that entered SUSPENDED.
        default: 0

  - name: Species
    parent: null
    common_fields: true
    fields:
      - name: scientific_name
        type: string
        source: input
        description: Binomial name.
        constraints: "unique across Species"
      - name: common_name
        type: string
        source: input
        description: Public-facing name.
      - name: taxon_group
        type: enum
        source: input
        description: Husbandry taxon group; selects TAXON_MULTIPLIER in §1.3 quarantine_required_days.
        constraints: "ELASMOBRANCH | TELEOST | INVERTEBRATE | MARINE_MAMMAL | REPTILE | BIRD"
      - name: protection_status
        type: enum
        source: input
        description: Regulatory protection listing.
        constraints: "UNLISTED | CITES_APPENDIX_II | CITES_APPENDIX_I | ESA_LISTED"
      - name: sustainability_rating
        type: enum
        source: input
        description: Sourcing sustainability rating of the species.
        constraints: "GREEN | YELLOW | RED"
      - name: bioload_units_per_specimen
        type: number
        source: input
        description: Bioload units one specimen of this species contributes to an exhibit.
        constraints: "> 0"
      - name: base_quarantine_days
        type: integer
        source: input
        description: Baseline quarantine duration before taxon and source adjustments.
        constraints: ">= 1 and <= 180"
      - name: wild_take_quota_annual
        type: integer
        source: input
        description: Annual wild-collection allowance in specimens; 0 means wild collection is not permitted for this species.
        default: 0
        constraints: ">= 0"
      - name: wild_take_quota_reserved
        type: integer
        source: computed
        description: Units of the annual wild-take quota currently held by cleared or fulfilled wild-collection acquisitions (§1.3 wild_take_quota_ledger).
        default: 0
      - name: permit_required
        type: boolean
        source: computed
        description: "true when protection_status != UNLISTED."
        default: false

  - name: Institution
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the partner institution.
      - name: institution_code
        type: string
        source: input
        description: Registry code.
        constraints: "unique across Institution"
      - name: accreditation_status
        type: enum
        source: input
        description: Current accreditation standing of the institution.
        constraints: "ACCREDITED | PROVISIONAL | NON_ACCREDITED | SUSPENDED"
      - name: welfare_audit_score
        type: number
        source: input
        description: Latest third-party welfare audit score.
        constraints: "0.00 - 100.00"
      - name: last_audit_at
        type: datetime
        source: input
        description: Instant of the latest welfare audit.
      - name: is_receiving_eligible
        type: boolean
        source: computed
        description: Receiving-institution standard (§1.3 institution_receiving_eligibility).
        default: false

  - name: CollectionPlanEntry
    parent: null
    common_fields: true
    fields:
      - name: exhibit_id
        type: string
        source: input
        description: "FK -> Exhibit.id; the exhibit this plan line stocks."
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; the selected species."
      - name: planned_count
        type: integer
        source: input
        description: Number of specimens the plan authorises for this exhibit/species pair.
        constraints: ">= 1"
      - name: sustainability_requirement
        type: enum
        source: input
        description: Sourcing standard this plan line imposes on acquisitions beneath it.
        constraints: "GREEN_ONLY | GREEN_OR_YELLOW | ANY_WITH_JUSTIFICATION"
      - name: status
        type: enum
        source: computed
        description: Plan-line lifecycle state (§1.2 CollectionPlanEntry).
        default: DRAFT
        constraints: "DRAFT | APPROVED | SUSPENDED | RETIRED"
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceDirector that approved this line; null while DRAFT. Pinned for the segregation-of-duties check on acquisition clearance.
        default: null
      - name: approved_at
        type: datetime
        source: computed
        description: Clock instant of approval; null while DRAFT.
        default: null
      - name: superseded_by_entry_id
        type: string
        source: computed
        description: "FK -> CollectionPlanEntry.id; set on the retired predecessor when a new entry for the same (exhibit_id, species_id) pair supersedes it."
        default: null
      - name: suspension_reason
        type: string
        source: computed
        description: Machine code of the last suspension driver.
        default: null
        constraints: "DIRECTOR_ACTION | LAST_SPECIMEN_LOST | null"

  - name: AcquisitionRequest
    parent: null
    common_fields: true
    fields:
      - name: collection_plan_entry_id
        type: string
        source: input
        description: "FK -> CollectionPlanEntry.id; the approved plan line this acquisition serves."
      - name: source_type
        type: enum
        source: input
        description: Acquisition source channel.
        constraints: "CAPTIVE_BRED | RESCUE_STRANDING | INSTITUTIONAL_TRANSFER | WILD_COLLECTION"
      - name: source_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; sourcing or collecting institution. Required when source_type is INSTITUTIONAL_TRANSFER, optional otherwise."
        default: null
      - name: requested_count
        type: integer
        source: input
        description: Number of specimens requested.
        constraints: ">= 1"
      - name: justification
        type: string
        source: input
        description: Written justification; required at submission when the plan line's sustainability_requirement is ANY_WITH_JUSTIFICATION.
        default: null
      - name: status
        type: enum
        source: computed
        description: Acquisition lifecycle state (§1.2 AcquisitionRequest).
        default: DRAFT
        constraints: "DRAFT | PENDING_PERMIT | READY_FOR_CLEARANCE | CLEARED | FULFILLED | REJECTED | CANCELLED"
      - name: permit_required
        type: boolean
        source: computed
        description: Snapshot of Species.permit_required taken at request creation.
        default: false
      - name: permit_deadline_at
        type: datetime
        source: computed
        description: Set only on the PENDING_PERMIT branch as clock_now + PERMIT_DEADLINE_DAYS days; null on the READY_FOR_CLEARANCE branch.
        default: null
      - name: sustainability_score
        type: number
        source: computed
        description: Sourcing sustainability score (§1.3 sustainability_score); PROVISIONAL at creation, recomputed as FINAL at clearance.
        constraints: "0.00 - 100.00, 2 decimals"
      - name: sustainability_score_variant
        type: enum
        source: computed
        description: Which §1.3 sustainability_score variant produced the stored value.
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: quota_units_reserved
        type: integer
        source: computed
        description: Wild-take quota units this request currently holds; 0 unless source_type is WILD_COLLECTION and status IN {CLEARED, FULFILLED}.
        default: 0
      - name: fulfilled_count
        type: integer
        source: computed
        description: Count of Specimen rows created against this request.
        default: 0
      - name: cleared_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceDirector that cleared the request; null before clearance.
        default: null
      - name: cleared_at
        type: datetime
        source: computed
        description: Clock instant of clearance; null before clearance.
        default: null
      - name: closure_reason
        type: string
        source: computed
        description: Machine code recorded when the request leaves the flow without fulfilment.
        default: null
        constraints: "CURATOR_CANCELLED | PLAN_SUSPENDED | PERMIT_EXPIRED | null"

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: acquisition_request_id
        type: string
        source: input
        description: "FK -> AcquisitionRequest.id; the acquisition this permit authorises."
      - name: permit_type
        type: enum
        source: input
        description: Regulatory instrument type.
        constraints: "IMPORT | TRANSPORT | POSSESSION"
      - name: authority_reference
        type: string
        source: input
        description: Issuing authority file reference.
      - name: document_codes
        type: array
        source: input
        description: Document codes attached to the dossier; each element one of HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE, TRANSPORT_PLAN, POSSESSION_AFFIDAVIT, CITES_PERMIT, ESA_AUTHORIZATION, ACQUISITION_PROVENANCE, CAPTIVE_BRED_CERT. The mandatory subset for a given dossier is decided by §1.3 permit_document_requirement.
        constraints: non-empty array of the codes above, no duplicates
      - name: status
        type: enum
        source: computed
        description: Permit lifecycle state (§1.2 Permit).
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | INFO_REQUESTED | ISSUED | DENIED | REVOKED | EXPIRED"
      - name: submission_round
        type: integer
        source: computed
        description: Number of times the dossier has been submitted; bounded by PERMIT_MAX_ROUNDS.
        default: 0
      - name: missing_document_codes
        type: array
        source: computed
        description: Required document codes absent from document_codes at the last submission attempt (§1.3 permit_document_requirement); empty array when complete.
      - name: valid_from
        type: datetime
        source: computed
        description: Start of the validity window, supplied on the ISSUE decision.
        default: null
      - name: valid_until
        type: datetime
        source: computed
        description: End of the validity window, supplied on the ISSUE decision; drives lazy expiry on clock advance.
        default: null
      - name: issued_at
        type: datetime
        source: computed
        description: Clock instant of issuance.
        default: null
      - name: decision_reason
        type: string
        source: computed
        description: Free-text reason recorded on the last REQUEST_INFO / DENY / REVOKE decision.
        default: null

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - name: accession_code
        type: string
        source: input
        description: Permanent accession number.
        constraints: "unique across Specimen"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; taxonomic identity of the animal."
      - name: acquisition_request_id
        type: string
        source: input
        description: "FK -> AcquisitionRequest.id; the cleared acquisition this arrival fulfils. Null for in-house births."
        default: null
      - name: exhibit_id
        type: string
        source: computed
        description: "FK -> Exhibit.id; exhibit the specimen currently occupies. Null while in quarantine or holding."
        default: null
      - name: holding_area
        type: string
        source: input
        description: Off-exhibit holding location label while not placed.
        default: null
      - name: arrival_at
        type: datetime
        source: input
        description: Instant the animal arrived on site; must be <= clock_now.
      - name: disposition_status
        type: enum
        source: computed
        description: Collection disposition dimension (§1.2 Specimen.disposition_status).
        default: QUARANTINE
        constraints: "QUARANTINE | CLEARED | ON_EXHIBIT | TRANSFER_PENDING | TRANSFERRED | DECEASED"
      - name: health_status
        type: enum
        source: computed
        description: Clinical dimension, advancing independently of disposition_status (§1.2 Specimen.health_status).
        default: HEALTHY
        constraints: "HEALTHY | UNDER_TREATMENT | CRITICAL_CARE | DECEASED_PENDING_NECROPSY | NECROPSY_COMPLETE"
      - name: pre_transfer_disposition
        type: enum
        source: computed
        description: disposition_status held immediately before entering TRANSFER_PENDING; used by the transfer-decline compensation to restore the prior value.
        default: null
        constraints: "CLEARED | ON_EXHIBIT | null"
      - name: bioload_units
        type: number
        source: computed
        description: Snapshot of Species.bioload_units_per_specimen taken at specimen creation; never re-read from Species afterwards.
        constraints: "> 0"
      - name: quarantine_required_days
        type: integer
        source: computed
        description: Quarantine duration in days for this arrival (§1.3 quarantine_required_days).
      - name: welfare_score
        type: number
        source: computed
        description: Welfare index (§1.3 welfare_score); null until the first qualifying husbandry log exists.
        default: null
        constraints: "0.00 - 100.00, 2 decimals"
      - name: welfare_score_variant
        type: enum
        source: computed
        description: Which §1.3 welfare_score variant produced the stored value.
        default: null
        constraints: "ROLLING | AUDIT_SNAPSHOT | null"
      - name: sire_specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; sire in the breeding programme. Null when unknown."
        default: null
      - name: dam_specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; dam in the breeding programme. Null when unknown."
        default: null
      - name: captive_bred
        type: boolean
        source: computed
        description: "true when both sire_specimen_id and dam_specimen_id are non-null."
        default: false
      - name: treatment_withdrawal_until
        type: datetime
        source: computed
        description: End of the latest recorded treatment withdrawal window (§1.3 treatment_withdrawal_window); null when no TREATMENT case exists.
        default: null

  - name: QuarantineCase
    parent: Specimen
    common_fields: true
    fields:
      - name: specimen_id
        type: string
        source: system
        description: "FK -> Specimen.id; the quarantined arrival. Created by the POST /aquarium/specimens cascade."
      - name: protocol_days
        type: integer
        source: computed
        description: Snapshot of Specimen.quarantine_required_days at case creation.
      - name: started_at
        type: datetime
        source: computed
        description: Equal to Specimen.arrival_at.
      - name: projected_release_at
        type: datetime
        source: computed
        description: started_at + (protocol_days + total_extension_days) days; recomputed on every EXTEND review.
      - name: status
        type: enum
        source: computed
        description: Quarantine case state (§1.2 QuarantineCase).
        default: ACTIVE
        constraints: "ACTIVE | EXTENDED | CLEARED | FAILED"
      - name: extension_count
        type: integer
        source: computed
        description: Number of EXTEND reviews applied; bounded by QUARANTINE_MAX_EXTENSIONS.
        default: 0
      - name: total_extension_days
        type: integer
        source: computed
        description: Sum of extension_days across all EXTEND reviews.
        default: 0
      - name: clearance_exam_count
        type: integer
        source: computed
        description: Count of VeterinaryCase rows for the specimen with case_type PREVENTIVE_EXAM, status CLOSED, findings_severity NONE and opened_at within [started_at, clock_now) (§1.3 quarantine_clearance_criteria).
        default: 0
      - name: cleared_by_user_id
        type: string
        source: computed
        description: X-User-ID of the VeterinaryOfficer that signed clearance.
        default: null
      - name: cleared_at
        type: datetime
        source: computed
        description: Clock instant of clearance.
        default: null
      - name: failure_reason
        type: string
        source: computed
        description: Reason recorded on a FAIL review.
        default: null

  - name: HusbandryLog
    parent: Specimen
    common_fields: false
    fields:
      - name: specimen_id
        type: string
        source: system
        description: "FK -> Specimen.id; taken from the path segment of POST /aquarium/specimens/{id}/husbandry-logs."
      - name: log_type
        type: enum
        source: input
        description: Kind of husbandry record.
        constraints: "FEEDING | BEHAVIOR | TREATMENT | WEIGHT"
      - name: logged_at
        type: datetime
        source: input
        description: Instant the observation was made; must be <= clock_now.
      - name: appetite_score
        type: integer
        source: input
        description: Appetite rating; required when log_type is FEEDING, forbidden otherwise.
        default: null
        constraints: "0 - 5"
      - name: behavior_code
        type: enum
        source: input
        description: Behavioural observation; required when log_type is BEHAVIOR, forbidden otherwise.
        default: null
        constraints: "NORMAL | LETHARGIC | AGGRESSIVE | ABNORMAL_SWIM"
      - name: feed_grams
        type: number
        source: input
        description: Mass of feed offered.
        default: null
        constraints: ">= 0"
      - name: weight_grams
        type: number
        source: input
        description: Recorded body mass; required when log_type is WEIGHT.
        default: null
        constraints: "> 0"
      - name: note
        type: string
        source: input
        description: Free-text remark.
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that recorded the entry.

  - name: VeterinaryCase
    parent: null
    common_fields: true
    fields:
      - name: specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; patient."
      - name: case_type
        type: enum
        source: input
        description: Kind of veterinary episode.
        constraints: "PREVENTIVE_EXAM | TREATMENT | NECROPSY"
      - name: opened_at
        type: datetime
        source: input
        description: Instant the case was opened; must be <= clock_now.
      - name: treatment_start_at
        type: datetime
        source: input
        description: Start of the treatment window; required when case_type is TREATMENT, forbidden otherwise.
        default: null
      - name: withdrawal_days
        type: integer
        source: input
        description: Withdrawal period in days following treatment_start_at; required when case_type is TREATMENT.
        default: null
        constraints: ">= 0 and <= 90"
      - name: diagnosis_code
        type: string
        source: input
        description: Clinical code.
        default: null
      - name: status
        type: enum
        source: computed
        description: Case state (§1.2 VeterinaryCase).
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: outcome
        type: enum
        source: computed
        description: Branch selected at closure; each value carries a different side-effect set.
        default: null
        constraints: "RESOLVED | CHRONIC_MANAGED | MORTALITY_REFERRED | NECROPSY_FINALIZED | null"
      - name: findings_severity
        type: enum
        source: computed
        description: Severity recorded at closure.
        default: null
        constraints: "NONE | MINOR | MAJOR | CRITICAL | null"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the VeterinaryOfficer that opened the case.
      - name: closed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the VeterinaryOfficer that closed the case.
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: Clock instant of closure.
        default: null

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; animal proposed for transfer."
      - name: receiving_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; receiving institution that must meet the receiving standard."
      - name: transport_permit_id
        type: string
        source: input
        description: "FK -> Permit.id; TRANSPORT permit covering the move. Null until attached."
        default: null
      - name: proposed_transfer_at
        type: datetime
        source: input
        description: Planned move instant; completion is blocked until clock_now >= this value.
      - name: welfare_conditions
        type: array
        source: input
        description: 'Condition codes offered to the receiving institution; each one of WATER_CHEMISTRY_MATCH, TRANSPORT_OXYGEN_PLAN, QUARANTINE_ON_ARRIVAL, CITES_TRANSPORT_CLEARANCE, DIET_TRANSITION_PLAN, NECROPSY_POLICY, NO_COMMERCIAL_RESALE, BREEDING_LOAN_TERMS. Which of them are mandatory is decided by §1.3 transfer_condition_requirement.'
        constraints: non-empty array of the codes above, no duplicates
      - name: counter_conditions
        type: array
        source: computed
        description: Condition codes the receiving institution demanded on its most recent COUNTER decision, drawn from the same vocabulary as welfare_conditions; empty array before any counter.
      - name: status
        type: enum
        source: computed
        description: Transfer negotiation state (§1.2 TransferRequest).
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | COUNTERED | APPROVED | DECLINED | WITHDRAWN | COMPLETED"
      - name: negotiation_round
        type: integer
        source: computed
        description: Number of COUNTER decisions recorded; bounded by TRANSFER_MAX_COUNTERS.
        default: 0
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID recorded on the most recent decision.
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: Clock instant of the most recent decision.
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: Clock instant of completion.
        default: null
      - name: decline_reason
        type: string
        source: computed
        description: Machine code or free text recorded on decline.
        default: null
        constraints: "LIAISON_DECLINED | RECEIVER_INELIGIBLE | TRANSPORT_PERMIT_EXPIRED | null"

  - name: InteractionSession
    parent: null
    common_fields: true
    fields:
      - name: exhibit_id
        type: string
        source: input
        description: "FK -> Exhibit.id; exhibit hosting the guest programme."
      - name: program_type
        type: enum
        source: input
        description: Guest interaction programme type; DIVE_ENCOUNTER additionally carries the in-water safety gate of §1.4 priority 20.
        constraints: "TOUCH_POOL_CONTACT | FEEDING_ENCOUNTER | DIVE_ENCOUNTER"
      - name: starts_at
        type: datetime
        source: input
        description: Inclusive session start.
      - name: ends_at
        type: datetime
        source: input
        description: Inclusive session end; must be > starts_at.
      - name: max_guests
        type: integer
        source: input
        description: Guest cap for this session.
        constraints: ">= 1"
      - name: guest_count
        type: integer
        source: input
        description: Booked guests.
        default: 0
        constraints: ">= 0"
      - name: safety_briefing_confirmed
        type: boolean
        source: input
        description: Whether the guest safety briefing has been delivered; required true to activate.
        default: false
      - name: status
        type: enum
        source: computed
        description: Session state (§1.2 InteractionSession).
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | COMPLETED | SUSPENDED | CANCELLED"
      - name: suspension_reason
        type: string
        source: computed
        description: Machine code of the suspension driver.
        default: null
        constraints: "EXHIBIT_CLOSED | DIRECTOR_ACTION | null"

  - name: AccreditationAudit
    parent: null
    common_fields: true
    fields:
      - name: audit_code
        type: string
        source: input
        description: Inspection reference code.
        constraints: "unique across AccreditationAudit"
      - name: scope
        type: enum
        source: input
        description: Inspection scope.
        constraints: "FULL | ANIMAL_CARE_ONLY | LIFE_SUPPORT_ONLY"
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned inspection instant; START requires clock_now >= scheduled_for.
      - name: status
        type: enum
        source: computed
        description: Audit state (§1.2 AccreditationAudit).
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | PASSED | CONDITIONAL | FAILED | CANCELLED"
      - name: readiness_score
        type: number
        source: computed
        description: Inspection readiness score (§1.3 readiness_score); null until START.
        default: null
        constraints: "0.00 - 100.00, 2 decimals"
      - name: domain_subscores
        type: object
        source: computed
        description: The five per-domain subscores, each already rounded to 2 decimals, keyed LIFE_SUPPORT, ANIMAL_HEALTH, RECORDS, PERMITS, PUBLIC_SAFETY; null until START.
        default: null
      - name: blocking_finding_count
        type: integer
        source: computed
        description: Count of blocking findings at the latest START/REOPEN (§1.3 readiness_score).
        default: 0
      - name: opened_by_user_id
        type: string
        source: computed
        description: X-User-ID of the director that ran START; pinned for the segregation-of-duties check at CLOSE.
        default: null
      - name: closed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the director that ran CLOSE.
        default: null
      - name: started_at
        type: datetime
        source: computed
        description: Clock instant of the latest START/REOPEN.
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: Clock instant of CLOSE.
        default: null
      - name: determination_note
        type: string
        source: computed
        description: Note recorded at CLOSE.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- LifeSupport
  - entity: LifeSupportSystem
    dimension: alarm_state
    initial_state: NORMAL
    terminal_states: []
    note: |
      Cyclic with hysteresis. Escalation is immediate on a single breaching
      reading; recovery needs consecutive NORMAL readings and always passes
      through WARNING. consecutive_normal_readings is NOT reset when
      alarm_state steps down from CRITICAL to WARNING, so the third NORMAL
      reading of a recovery run promotes the plant to NORMAL.
      The side effect written below as "water_quality_index =
      reading.water_quality_index_snapshot" is shorthand for "water_quality_index
      is recomputed by §1.3 latest_reading_selector". The two coincide whenever
      readings arrive in chronological order; when an out-of-order sample is
      appended, §1.3 wins and water_quality_index keeps the snapshot of the
      greatest taken_at, even though the appended reading's own severity still
      drives the alarm_state transition and the breach counters.
    transitions:
      - from: NORMAL
        to: WARNING
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is WARNING"
        actor: AquaristTechnician
        preconditions: ["alarm_state != OFFLINE", "reading.taken_at <= clock_now"]
        side_effects:
          - "consecutive_breach_readings += 1; consecutive_normal_readings = 0"
          - "water_quality_index = reading.water_quality_index_snapshot"
          - "Every Exhibit served by this system recomputes posture per §1.3 exhibit_posture (OPEN -> RESTRICTED, last_posture_reason = LSS_WARNING)"
          - "increments LifeSupportSystem.version by 1 and each mutated Exhibit.version by 1"
      - from: NORMAL
        to: CRITICAL
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is CRITICAL"
        actor: AquaristTechnician
        preconditions: ["alarm_state != OFFLINE", "reading.taken_at <= clock_now"]
        side_effects:
          - "CASCADE A link 1: consecutive_breach_readings += 1; consecutive_normal_readings = 0; water_quality_index = reading.water_quality_index_snapshot"
          - "CASCADE A link 2 (caused by link 1): every Exhibit with life_support_system_id == this system recomputes §1.3 exhibit_posture and lands on CLOSED with last_posture_reason = LSS_CRITICAL"
          - "CASCADE A link 3 (caused by link 2): for each exhibit that became CLOSED, every InteractionSession with status IN {SCHEDULED, ACTIVE} on that exhibit moves to SUSPENDED with suspension_reason = EXHIBIT_CLOSED, processed in created_at ASC order"
          - "CASCADE A link 4 (caused by link 3): each such suspension increments that Exhibit.suspended_session_count by 1"
          - "CASCADE A link 5 (caused by link 4): when Exhibit.suspended_session_count >= INTERACTION_AUTO_DISABLE_THRESHOLD (2) the exhibit's interaction_program_enabled is set to false"
          - "increments LifeSupportSystem.version, each mutated Exhibit.version and each suspended InteractionSession.version by 1"
      - from: WARNING
        to: CRITICAL
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is CRITICAL"
        actor: AquaristTechnician
        preconditions: ["alarm_state != OFFLINE"]
        side_effects: ["same CASCADE A links 1-5 as NORMAL -> CRITICAL"]
      - from: NORMAL
        to: NORMAL
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is NORMAL"
        actor: AquaristTechnician
        preconditions: ["alarm_state == NORMAL"]
        side_effects: ["consecutive_normal_readings += 1; consecutive_breach_readings = 0", "water_quality_index = reading.water_quality_index_snapshot", "exhibit postures unchanged"]
      - from: WARNING
        to: WARNING
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is NORMAL and consecutive_normal_readings + 1 < ALARM_CLEAR_NORMAL_READINGS"
        actor: AquaristTechnician
        preconditions: ["alarm_state == WARNING"]
        side_effects: ["consecutive_normal_readings += 1; consecutive_breach_readings = 0", "water_quality_index = reading.water_quality_index_snapshot", "exhibit postures unchanged (still RESTRICTED / LSS_WARNING)"]
      - from: WARNING
        to: WARNING
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is WARNING"
        actor: AquaristTechnician
        preconditions: ["alarm_state == WARNING"]
        side_effects: ["consecutive_breach_readings += 1; consecutive_normal_readings = 0", "water_quality_index = reading.water_quality_index_snapshot"]
      - from: WARNING
        to: NORMAL
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is NORMAL"
        actor: AquaristTechnician
        preconditions: ["consecutive_normal_readings + 1 >= ALARM_CLEAR_NORMAL_READINGS (3)"]
        side_effects:
          - "consecutive_normal_readings += 1; consecutive_breach_readings = 0; water_quality_index = reading.water_quality_index_snapshot"
          - "Every Exhibit served by this system recomputes posture; exhibits with no other restriction driver return to OPEN with last_posture_reason = null"
          - "InteractionSession rows suspended by CASCADE A are NOT reinstated automatically; they require the REINSTATE transition"
      - from: CRITICAL
        to: WARNING
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is NORMAL"
        actor: AquaristTechnician
        preconditions: ["consecutive_normal_readings + 1 >= ALARM_DEESCALATE_NORMAL_READINGS (2)"]
        side_effects:
          - "consecutive_normal_readings += 1 (NOT reset by this step-down); consecutive_breach_readings = 0"
          - "water_quality_index = reading.water_quality_index_snapshot"
          - "Every Exhibit served by this system recomputes posture: CLOSED -> RESTRICTED with last_posture_reason = LSS_WARNING"
      - from: CRITICAL
        to: CRITICAL
        trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings whose computed severity is NORMAL and consecutive_normal_readings + 1 < ALARM_DEESCALATE_NORMAL_READINGS"
        actor: AquaristTechnician
        preconditions: ["alarm_state == CRITICAL"]
        side_effects: ["consecutive_normal_readings += 1; consecutive_breach_readings = 0; water_quality_index updated; exhibit postures unchanged"]
      - from: NORMAL
        to: OFFLINE
        trigger: "POST /aquarium/life-support-systems/{id}/redundancy-tests with result FAIL"
        actor: AquaristTechnician
        preconditions: ["performed_at <= clock_now"]
        side_effects:
          - "last_redundancy_test_result = FAIL; last_redundancy_test_at unchanged"
          - "Every Exhibit served by this system recomputes posture -> CLOSED with last_posture_reason = LSS_OFFLINE, then CASCADE A links 3-5 run identically"
      - from: WARNING
        to: OFFLINE
        trigger: "POST /aquarium/life-support-systems/{id}/redundancy-tests with result FAIL"
        actor: AquaristTechnician
        preconditions: ["performed_at <= clock_now"]
        side_effects: ["same as NORMAL -> OFFLINE"]
      - from: CRITICAL
        to: OFFLINE
        trigger: "POST /aquarium/life-support-systems/{id}/redundancy-tests with result FAIL"
        actor: AquaristTechnician
        preconditions: ["performed_at <= clock_now"]
        side_effects: ["same as NORMAL -> OFFLINE"]
      - from: OFFLINE
        to: NORMAL
        trigger: "POST /aquarium/life-support-systems/{id}/redundancy-tests with result PASS while the latest reading severity is NORMAL or no reading exists"
        actor: AquaristTechnician
        preconditions: ["latest reading by §1.3 latest_reading_selector has severity NORMAL, or the system has zero readings"]
        side_effects:
          - "last_redundancy_test_at = performed_at; last_redundancy_test_result = PASS; redundancy_overdue recomputed to false"
          - "Every Exhibit served by this system recomputes posture and returns to OPEN when no other driver applies"
      - from: OFFLINE
        to: WARNING
        trigger: "POST /aquarium/life-support-systems/{id}/redundancy-tests with result PASS while the latest reading severity is WARNING"
        actor: AquaristTechnician
        preconditions: ["latest reading severity == WARNING"]
        side_effects: ["last_redundancy_test_at = performed_at; last_redundancy_test_result = PASS; exhibits recompute posture -> RESTRICTED"]
      - from: OFFLINE
        to: CRITICAL
        trigger: "POST /aquarium/life-support-systems/{id}/redundancy-tests with result PASS while the latest reading severity is CRITICAL"
        actor: AquaristTechnician
        preconditions: ["latest reading severity == CRITICAL"]
        side_effects: ["last_redundancy_test_at = performed_at; last_redundancy_test_result = PASS; exhibits stay CLOSED with last_posture_reason = LSS_CRITICAL"]

  # ------------------------------------------------------------------- Exhibit
  - entity: Exhibit
    dimension: posture
    initial_state: OPEN
    terminal_states: []
    note: |
      Compound derived dimension: posture is never set by a client field. It is
      recomputed by §1.3 exhibit_posture after (a) a serving LifeSupportSystem
      alarm_state change, (b) a redundancy test, (c) a clock advance that flips
      redundancy_overdue, (d) any change to occupied_bioload_units, or (e) a
      PATCH that changes bioload_capacity_units.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system recomputation of §1.3 exhibit_posture"
        actor: system
        preconditions: ["serving system alarm_state == WARNING, or redundancy_overdue == true, or bioload_utilization_pct > BIOLOAD_PRESSURE_PCT (95.00)"]
        side_effects:
          - "last_posture_reason set to the first matching driver in the fixed order [LSS_CRITICAL, LSS_OFFLINE, LSS_WARNING, REDUNDANCY_OVERDUE, BIOLOAD_PRESSURE]"
          - "increments Exhibit.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "system recomputation of §1.3 exhibit_posture"
        actor: system
        preconditions: ["serving system alarm_state IN {CRITICAL, OFFLINE}"]
        side_effects: ["last_posture_reason = LSS_CRITICAL or LSS_OFFLINE", "CASCADE A links 3-5 run", "increments Exhibit.version by 1"]
      - from: RESTRICTED
        to: CLOSED
        trigger: "system recomputation of §1.3 exhibit_posture"
        actor: system
        preconditions: ["serving system alarm_state IN {CRITICAL, OFFLINE}"]
        side_effects: ["same as OPEN -> CLOSED"]
      - from: RESTRICTED
        to: OPEN
        trigger: "system recomputation of §1.3 exhibit_posture"
        actor: system
        preconditions: ["serving system alarm_state == NORMAL", "redundancy_overdue == false", "bioload_utilization_pct <= 95.00"]
        side_effects: ["last_posture_reason = null", "increments Exhibit.version by 1"]
      - from: CLOSED
        to: RESTRICTED
        trigger: "system recomputation of §1.3 exhibit_posture"
        actor: system
        preconditions: ["serving system alarm_state == WARNING, or redundancy_overdue == true, or bioload_utilization_pct > 95.00"]
        side_effects: ["last_posture_reason recomputed", "suspended InteractionSession rows stay SUSPENDED", "increments Exhibit.version by 1"]
      - from: CLOSED
        to: OPEN
        trigger: "system recomputation of §1.3 exhibit_posture"
        actor: system
        preconditions: ["serving system alarm_state == NORMAL", "redundancy_overdue == false", "bioload_utilization_pct <= 95.00"]
        side_effects: ["last_posture_reason = null", "suspended InteractionSession rows stay SUSPENDED", "increments Exhibit.version by 1"]

  # -------------------------------------------------------- CollectionPlanEntry
  - entity: CollectionPlanEntry
    initial_state: DRAFT
    terminal_states: [RETIRED]
    note: "Cyclic APPROVED <-> SUSPENDED revision loop; RETIRED is reachable from any non-terminal state and is also written by the supersede path on create."
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /aquarium/collection-plan-entries/{id}/status-actions with action APPROVE"
        actor: ComplianceDirector
        preconditions: ["status == DRAFT", "exhibit.habitat_type == serving LifeSupportSystem.design_habitat"]
        side_effects: ["approved_by_user_id = X-User-ID; approved_at = clock_now", "increments CollectionPlanEntry.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /aquarium/collection-plan-entries/{id}/status-actions with action SUSPEND"
        actor: ComplianceDirector
        preconditions: ["status == APPROVED"]
        side_effects:
          - "suspension_reason = DIRECTOR_ACTION"
          - "every AcquisitionRequest with this collection_plan_entry_id and status IN {DRAFT, PENDING_PERMIT, READY_FOR_CLEARANCE, CLEARED} moves to CANCELLED with closure_reason = PLAN_SUSPENDED, processed created_at ASC"
          - "each cancelled request releases quota_units_reserved back to Species.wild_take_quota_reserved and sets quota_units_reserved = 0"
          - "every Permit of those requests with status IN {DRAFT, SUBMITTED, INFO_REQUESTED, ISSUED} moves to REVOKED with decision_reason = ACQUISITION_CANCELLED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /aquarium/collection-plan-entries/{id}/status-actions with action REINSTATE"
        actor: ComplianceDirector
        preconditions: ["status == SUSPENDED", "no other CollectionPlanEntry with the same (exhibit_id, species_id) has status IN {DRAFT, APPROVED}"]
        side_effects: ["suspension_reason = null", "approved_at = clock_now; approved_by_user_id = X-User-ID", "cancelled AcquisitionRequest rows are NOT restored"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /aquarium/collection-plan-entries/{id}/status-actions with action RETIRE"
        actor: ComplianceDirector
        preconditions: ["status IN {DRAFT, APPROVED, SUSPENDED}"]
        side_effects: ["increments CollectionPlanEntry.version by 1"]
      - from: APPROVED
        to: RETIRED
        trigger: "POST /aquarium/collection-plan-entries (supersede path) for the same (exhibit_id, species_id) pair, or action RETIRE"
        actor: CuratorOfCollections
        preconditions: ["status == APPROVED", "on the supersede path: expected_exhibit_version matches Exhibit.version"]
        side_effects:
          - "superseded_by_entry_id = id of the newly created entry (supersede path only)"
          - "AcquisitionRequest rows beneath the retired entry are left untouched"
          - "increments CollectionPlanEntry.version by 1 and Exhibit.version by 1"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /aquarium/collection-plan-entries/{id}/status-actions with action RETIRE"
        actor: ComplianceDirector
        preconditions: ["status == SUSPENDED"]
        side_effects: ["increments CollectionPlanEntry.version by 1"]

  # --------------------------------------------------------- AcquisitionRequest
  - entity: AcquisitionRequest
    initial_state: DRAFT
    terminal_states: [FULFILLED, REJECTED, CANCELLED]
    note: "Fork on permit_required at submission with divergent side-effect sets, rejoining at CLEARED."
    transitions:
      - from: DRAFT
        to: PENDING_PERMIT
        trigger: "POST /aquarium/acquisition-requests/{id}/submission when permit_required == true"
        actor: CuratorOfCollections
        preconditions:
          - "status == DRAFT"
          - "collection_plan_entry.status == APPROVED"
          - "justification is non-null when collection_plan_entry.sustainability_requirement == ANY_WITH_JUSTIFICATION"
        side_effects: ["permit_deadline_at = clock_now + PERMIT_DEADLINE_DAYS (30) days", "increments AcquisitionRequest.version by 1"]
      - from: DRAFT
        to: READY_FOR_CLEARANCE
        trigger: "POST /aquarium/acquisition-requests/{id}/submission when permit_required == false"
        actor: CuratorOfCollections
        preconditions:
          - "status == DRAFT"
          - "collection_plan_entry.status == APPROVED"
          - "justification is non-null when collection_plan_entry.sustainability_requirement == ANY_WITH_JUSTIFICATION"
        side_effects: ["permit_deadline_at stays null (branch discriminator)", "increments AcquisitionRequest.version by 1"]
      - from: PENDING_PERMIT
        to: CLEARED
        trigger: "POST /aquarium/acquisition-requests/{id}/clearance"
        actor: ComplianceDirector
        preconditions:
          - "status == PENDING_PERMIT"
          - "expected_species_version matches Species.version"
          - "at least one Permit of this request has status ISSUED and its permit_type is IMPORT when source_type == WILD_COLLECTION, POSSESSION otherwise"
          - "X-User-ID != collection_plan_entry.approved_by_user_id (segregation of duties)"
          - "FINAL sustainability_score >= MIN_CLEARANCE_SCORE"
          - "when source_type == WILD_COLLECTION: species.wild_take_quota_reserved + requested_count <= species.wild_take_quota_annual"
        side_effects:
          - "sustainability_score recomputed with the FINAL variant; sustainability_score_variant = FINAL"
          - "cleared_by_user_id = X-User-ID; cleared_at = clock_now"
          - "when source_type == WILD_COLLECTION: quota_units_reserved = requested_count and Species.wild_take_quota_reserved += requested_count"
          - "increments AcquisitionRequest.version by 1 and Species.version by 1"
      - from: READY_FOR_CLEARANCE
        to: CLEARED
        trigger: "POST /aquarium/acquisition-requests/{id}/clearance"
        actor: ComplianceDirector
        preconditions:
          - "status == READY_FOR_CLEARANCE"
          - "expected_species_version matches Species.version"
          - "X-User-ID != collection_plan_entry.approved_by_user_id (segregation of duties)"
          - "FINAL sustainability_score >= MIN_CLEARANCE_SCORE"
          - "when source_type == WILD_COLLECTION: species.wild_take_quota_reserved + requested_count <= species.wild_take_quota_annual"
        side_effects: ["identical to the PENDING_PERMIT -> CLEARED join, except no permit is consulted and no permit_bonus enters the FINAL score"]
      - from: CLEARED
        to: FULFILLED
        trigger: "POST /aquarium/specimens whose acquisition_request_id is this request and which brings fulfilled_count to requested_count"
        actor: CuratorOfCollections
        preconditions: ["status == CLEARED", "fulfilled_count + 1 == requested_count"]
        side_effects: ["fulfilled_count += 1", "quota_units_reserved retained (quota stays consumed for the annual period)", "increments AcquisitionRequest.version by 1"]
      - from: CLEARED
        to: CLEARED
        trigger: "POST /aquarium/specimens whose acquisition_request_id is this request and which leaves fulfilled_count < requested_count"
        actor: CuratorOfCollections
        preconditions: ["status == CLEARED", "fulfilled_count + 1 < requested_count"]
        side_effects: ["fulfilled_count += 1", "increments AcquisitionRequest.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /aquarium/acquisition-requests/{id}/cancellation"
        actor: CuratorOfCollections
        preconditions: ["status IN {DRAFT, PENDING_PERMIT, READY_FOR_CLEARANCE, CLEARED}", "fulfilled_count == 0"]
        side_effects: ["closure_reason = CURATOR_CANCELLED", "releases quota_units_reserved back to Species.wild_take_quota_reserved and sets quota_units_reserved = 0", "every Permit of this request with status IN {DRAFT, SUBMITTED, INFO_REQUESTED, ISSUED} moves to REVOKED with decision_reason = ACQUISITION_CANCELLED"]
      - from: PENDING_PERMIT
        to: CANCELLED
        trigger: "POST /aquarium/acquisition-requests/{id}/cancellation"
        actor: CuratorOfCollections
        preconditions: ["status == PENDING_PERMIT"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: READY_FOR_CLEARANCE
        to: CANCELLED
        trigger: "POST /aquarium/acquisition-requests/{id}/cancellation"
        actor: CuratorOfCollections
        preconditions: ["status == READY_FOR_CLEARANCE"]
        side_effects: ["same as DRAFT -> CANCELLED"]
      - from: CLEARED
        to: CANCELLED
        trigger: "POST /aquarium/acquisition-requests/{id}/cancellation"
        actor: CuratorOfCollections
        preconditions: ["status == CLEARED", "fulfilled_count == 0"]
        side_effects: ["closure_reason = CURATOR_CANCELLED", "COMPENSATION of the clearance quota reservation: Species.wild_take_quota_reserved -= quota_units_reserved; quota_units_reserved = 0", "increments Species.version by 1"]
      - from: PENDING_PERMIT
        to: REJECTED
        trigger: "system event on POST /_clock/set_current_utc when the request's ISSUED permit expires (CASCADE D link 2) or permit_deadline_at is passed with no ISSUED permit"
        actor: system
        preconditions: ["status IN {PENDING_PERMIT, CLEARED}"]
        side_effects: ["closure_reason = PERMIT_EXPIRED", "CASCADE D link 3 (caused by link 2): Species.wild_take_quota_reserved -= quota_units_reserved; quota_units_reserved = 0"]
      - from: CLEARED
        to: REJECTED
        trigger: "system event on POST /_clock/set_current_utc (CASCADE D link 2)"
        actor: system
        preconditions: ["status == CLEARED", "fulfilled_count == 0", "the request's ISSUED permit just moved to EXPIRED"]
        side_effects: ["same as PENDING_PERMIT -> REJECTED"]

  # -------------------------------------------------------------------- Permit
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [DENIED, REVOKED, EXPIRED]
    note: "Cyclic revision loop SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded by PERMIT_MAX_ROUNDS."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /aquarium/permits/{id}/submission"
        actor: PermitOfficer
        preconditions:
          - "status IN {DRAFT, INFO_REQUESTED}"
          - "when permit_type IN {IMPORT, POSSESSION}: acquisition_request.status == PENDING_PERMIT"
          - "when permit_type == TRANSPORT: acquisition_request.status IN {PENDING_PERMIT, CLEARED, FULFILLED} (a transport permit is filed after the animal is already in the collection)"
          - "submission_round + 1 <= PERMIT_MAX_ROUNDS (3)"
          - "document_codes (after the optional replacement in the request body) contains every code required by §1.3 permit_document_requirement"
        side_effects: ["submission_round += 1", "missing_document_codes = []", "increments Permit.version by 1"]
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /aquarium/permits/{id}/decisions with decision REQUEST_INFO"
        actor: ComplianceDirector
        preconditions: ["status == SUBMITTED"]
        side_effects: ["decision_reason = request body reason", "increments Permit.version by 1"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /aquarium/permits/{id}/submission (revision round)"
        actor: PermitOfficer
        preconditions: ["status == INFO_REQUESTED", "submission_round + 1 <= PERMIT_MAX_ROUNDS (3)", "document set complete"]
        side_effects: ["submission_round += 1", "decision_reason = null", "increments Permit.version by 1"]
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /aquarium/permits/{id}/decisions with decision ISSUE"
        actor: ComplianceDirector
        preconditions:
          - "status == SUBMITTED"
          - "when permit_type IN {IMPORT, POSSESSION}: acquisition_request.status == PENDING_PERMIT"
          - "when permit_type == TRANSPORT: acquisition_request.status IN {PENDING_PERMIT, CLEARED, FULFILLED}"
          - "valid_from and valid_until both present, valid_until > valid_from, and (valid_until - valid_from) <= PERMIT_MAX_VALIDITY_DAYS (730) days"
        side_effects: ["issued_at = clock_now; valid_from / valid_until stored", "increments Permit.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /aquarium/permits/{id}/decisions with decision DENY"
        actor: ComplianceDirector
        preconditions: ["status == SUBMITTED"]
        side_effects: ["decision_reason stored", "the acquisition_request stays PENDING_PERMIT and may still submit a fresh permit until permit_deadline_at"]
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /aquarium/permits/{id}/decisions with decision DENY"
        actor: ComplianceDirector
        preconditions: ["status == INFO_REQUESTED"]
        side_effects: ["decision_reason stored"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /aquarium/permits/{id}/decisions with decision REVOKE, or the AcquisitionRequest cancellation / plan-suspension cascade"
        actor: ComplianceDirector
        preconditions: ["status IN {DRAFT, SUBMITTED, INFO_REQUESTED, ISSUED}"]
        side_effects:
          - "decision_reason stored (ACQUISITION_CANCELLED when written by a cascade)"
          - "every TransferRequest with transport_permit_id == this permit and status IN {SUBMITTED, COUNTERED, APPROVED} moves to DECLINED with decline_reason = TRANSPORT_PERMIT_EXPIRED"
          - "increments Permit.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the clock to or past valid_until (CASCADE D link 1)"
        actor: system
        preconditions: ["status == ISSUED", "valid_until <= new clock_now"]
        side_effects:
          - "CASCADE D link 2 (caused by link 1): the linked AcquisitionRequest with status IN {PENDING_PERMIT, CLEARED} and fulfilled_count == 0 moves to REJECTED with closure_reason = PERMIT_EXPIRED"
          - "CASCADE D link 3 (caused by link 2): Species.wild_take_quota_reserved -= that request's quota_units_reserved, and the request's quota_units_reserved becomes 0"
          - "every TransferRequest with transport_permit_id == this permit and status IN {SUBMITTED, COUNTERED, APPROVED} moves to DECLINED with decline_reason = TRANSPORT_PERMIT_EXPIRED and its specimen's disposition is restored from pre_transfer_disposition"

  # ------------------------------------------------- Specimen (dimension 1 / 2)
  - entity: Specimen
    dimension: disposition_status
    initial_state: QUARANTINE
    terminal_states: [TRANSFERRED, DECEASED]
    note: |
      Independent of health_status: a specimen can be ON_EXHIBIT while
      UNDER_TREATMENT, or CLEARED while CRITICAL_CARE. The only coupling is
      pinned in the health_status machine (CRITICAL_CARE forces an
      ON_EXHIBIT -> CLEARED removal) and in placement/transfer preconditions.
    transitions:
      - from: QUARANTINE
        to: CLEARED
        trigger: "POST /aquarium/quarantine-cases/{id}/reviews with outcome CLEAR"
        actor: VeterinaryOfficer
        preconditions: ["quarantine_case.status == ACTIVE", "clock_now >= quarantine_case.projected_release_at", "quarantine_case.clearance_exam_count >= QUARANTINE_MIN_CLEAR_EXAMS (2)", "health_status == HEALTHY"]
        side_effects: ["quarantine_case.status = CLEARED, cleared_by_user_id, cleared_at set", "increments Specimen.version and QuarantineCase.version by 1"]
      - from: CLEARED
        to: ON_EXHIBIT
        trigger: "POST /aquarium/specimens/{id}/exhibit-placements"
        actor: AquaristTechnician
        preconditions:
          - "disposition_status == CLEARED"
          - "health_status == HEALTHY"
          - "expected_exhibit_version matches Exhibit.version"
          - "exhibit.posture != CLOSED; posture == RESTRICTED additionally requires restricted_posture_override == true"
          - "an APPROVED CollectionPlanEntry exists for (exhibit_id, specimen.species_id)"
          - "count of Specimen already ON_EXHIBIT or TRANSFER_PENDING in that exhibit for this species < that entry's planned_count"
          - "exhibit.occupied_bioload_units + specimen.bioload_units <= exhibit.bioload_capacity_units"
        side_effects:
          - "exhibit_id set; holding_area = null"
          - "Exhibit.occupied_bioload_units and bioload_utilization_pct recomputed per §1.3 exhibit_bioload_ledger"
          - "Exhibit.posture recomputed (may move OPEN -> RESTRICTED with last_posture_reason = BIOLOAD_PRESSURE)"
          - "increments Specimen.version by 1 and Exhibit.version by 1"
      - from: ON_EXHIBIT
        to: CLEARED
        trigger: "POST /aquarium/specimens/{id}/exhibit-removals, or the CRITICAL_CARE coupling cascade"
        actor: AquaristTechnician
        preconditions: ["disposition_status == ON_EXHIBIT", "expected_exhibit_version matches Exhibit.version when invoked through the endpoint"]
        side_effects:
          - "COMPENSATION of the placement: exhibit_id = null; holding_area = request value (or LAST_KNOWN_HOLDING when written by the cascade)"
          - "Exhibit.occupied_bioload_units and bioload_utilization_pct recomputed, restoring the pre-placement value exactly (§1.3 exhibit_bioload_ledger invariant)"
          - "Exhibit.posture recomputed (RESTRICTED -> OPEN when BIOLOAD_PRESSURE was the only driver)"
          - "increments Specimen.version by 1 and Exhibit.version by 1"
      - from: CLEARED
        to: TRANSFER_PENDING
        trigger: "POST /aquarium/transfer-requests/{id}/submission"
        actor: PermitOfficer
        preconditions: ["disposition_status IN {CLEARED, ON_EXHIBIT}", "health_status == HEALTHY", "receiving_institution.is_receiving_eligible == true"]
        side_effects: ["pre_transfer_disposition = previous disposition_status", "increments Specimen.version by 1"]
      - from: ON_EXHIBIT
        to: TRANSFER_PENDING
        trigger: "POST /aquarium/transfer-requests/{id}/submission"
        actor: PermitOfficer
        preconditions: ["same as CLEARED -> TRANSFER_PENDING"]
        side_effects: ["pre_transfer_disposition = ON_EXHIBIT", "exhibit_id retained and the exhibit ledger is unchanged because TRANSFER_PENDING still counts toward occupied_bioload_units"]
      - from: TRANSFER_PENDING
        to: CLEARED
        trigger: "POST /aquarium/transfer-requests/{id}/decisions with decision DECLINE, the institution-ineligibility cascade (CASCADE C link 3), or CASCADE D on the transport permit"
        actor: PartnerInstitutionLiaison
        preconditions: ["disposition_status == TRANSFER_PENDING", "pre_transfer_disposition == CLEARED"]
        side_effects: ["COMPENSATION: disposition restored from pre_transfer_disposition; pre_transfer_disposition = null", "increments Specimen.version by 1"]
      - from: TRANSFER_PENDING
        to: ON_EXHIBIT
        trigger: "POST /aquarium/transfer-requests/{id}/decisions with decision DECLINE, CASCADE C link 3, or CASCADE D"
        actor: PartnerInstitutionLiaison
        preconditions: ["disposition_status == TRANSFER_PENDING", "pre_transfer_disposition == ON_EXHIBIT"]
        side_effects: ["COMPENSATION: disposition restored to ON_EXHIBIT; exhibit ledger unchanged; pre_transfer_disposition = null"]
      - from: TRANSFER_PENDING
        to: TRANSFERRED
        trigger: "POST /aquarium/transfer-requests/{id}/completion"
        actor: PermitOfficer
        preconditions: ["transfer_request.status == APPROVED", "clock_now >= transfer_request.proposed_transfer_at"]
        side_effects:
          - "exhibit_id = null; holding_area = null"
          - "the former Exhibit recomputes occupied_bioload_units, bioload_utilization_pct and posture"
          - "increments Specimen.version by 1 and (when an exhibit was involved) Exhibit.version by 1"
      - from: QUARANTINE
        to: DECEASED
        trigger: "POST /aquarium/specimens/{id}/mortality"
        actor: VeterinaryOfficer
        preconditions: ["disposition_status IN {QUARANTINE, CLEARED, ON_EXHIBIT, TRANSFER_PENDING}", "occurred_at <= clock_now"]
        side_effects: ["CASCADE B link 1 (see ON_EXHIBIT -> DECEASED); when a quarantine case is ACTIVE or EXTENDED it moves to FAILED with failure_reason = MORTALITY"]
      - from: ON_EXHIBIT
        to: DECEASED
        trigger: "POST /aquarium/specimens/{id}/mortality"
        actor: VeterinaryOfficer
        preconditions: ["disposition_status IN {QUARANTINE, CLEARED, ON_EXHIBIT, TRANSFER_PENDING}", "occurred_at <= clock_now"]
        side_effects:
          - "CASCADE B link 1: health_status = DECEASED_PENDING_NECROPSY; exhibit_id = null; a VeterinaryCase with case_type NECROPSY, status OPEN, opened_at = occurred_at, opened_by_user_id = X-User-ID is created"
          - "CASCADE B link 2 (caused by link 1): the former Exhibit recomputes occupied_bioload_units, bioload_utilization_pct and posture"
          - "CASCADE B link 3 (caused by link 2): when the exhibit retains no Specimen of this species with disposition_status IN {ON_EXHIBIT, TRANSFER_PENDING, CLEARED}, the APPROVED CollectionPlanEntry for (exhibit_id, species_id) moves to SUSPENDED with suspension_reason = LAST_SPECIMEN_LOST"
          - "CASCADE B link 4 (caused by link 3): every AcquisitionRequest beneath that entry with status IN {DRAFT, PENDING_PERMIT, READY_FOR_CLEARANCE, CLEARED} moves to CANCELLED with closure_reason = PLAN_SUSPENDED and releases its quota_units_reserved to Species.wild_take_quota_reserved"
          - "CASCADE B link 5 (caused by link 4): every Permit of those requests with status IN {DRAFT, SUBMITTED, INFO_REQUESTED, ISSUED} moves to REVOKED with decision_reason = ACQUISITION_CANCELLED"
      - from: CLEARED
        to: DECEASED
        trigger: "POST /aquarium/specimens/{id}/mortality"
        actor: VeterinaryOfficer
        preconditions: ["occurred_at <= clock_now"]
        side_effects: ["CASCADE B links 1-5 with link 2 skipped when exhibit_id was already null"]
      - from: TRANSFER_PENDING
        to: DECEASED
        trigger: "POST /aquarium/specimens/{id}/mortality"
        actor: VeterinaryOfficer
        preconditions: ["occurred_at <= clock_now"]
        side_effects: ["CASCADE B links 1-5", "every TransferRequest for this specimen with status IN {SUBMITTED, COUNTERED, APPROVED} moves to WITHDRAWN"]

  - entity: Specimen
    dimension: health_status
    initial_state: HEALTHY
    terminal_states: [NECROPSY_COMPLETE]
    note: "Cyclic clinical dimension; HEALTHY <-> UNDER_TREATMENT <-> CRITICAL_CARE loops are allowed and advance on VeterinaryCase triggers only."
    transitions:
      - from: HEALTHY
        to: UNDER_TREATMENT
        trigger: "POST /aquarium/veterinary-cases with case_type TREATMENT"
        actor: VeterinaryOfficer
        preconditions: ["health_status IN {HEALTHY, CRITICAL_CARE}", "disposition_status NOT IN {TRANSFERRED, DECEASED}", "no withdrawal-window overlap per §1.3 treatment_withdrawal_window"]
        side_effects: ["treatment_withdrawal_until recomputed per §1.3 treatment_withdrawal_window", "increments Specimen.version by 1"]
      - from: CRITICAL_CARE
        to: UNDER_TREATMENT
        trigger: "POST /aquarium/veterinary-cases with case_type TREATMENT"
        actor: VeterinaryOfficer
        preconditions: ["health_status == CRITICAL_CARE"]
        side_effects: ["treatment_withdrawal_until recomputed"]
      - from: UNDER_TREATMENT
        to: UNDER_TREATMENT
        trigger: "POST /aquarium/veterinary-cases with case_type TREATMENT (a second concurrent treatment)"
        actor: VeterinaryOfficer
        preconditions: ["health_status == UNDER_TREATMENT", "no withdrawal-window overlap per §1.3 treatment_withdrawal_window"]
        side_effects:
          - "treatment_withdrawal_until = max over the specimen's OPEN TREATMENT windows"
          - "welfare_score recomputed with the ROLLING variant, now carrying OPEN_TREATMENT_PENALTY twice"
      - from: UNDER_TREATMENT
        to: HEALTHY
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with findings_severity IN {NONE, MINOR}"
        actor: VeterinaryOfficer
        preconditions: ["the closing case is the only VeterinaryCase for this specimen with status OPEN and case_type IN {TREATMENT, PREVENTIVE_EXAM}"]
        side_effects: ["welfare_score recomputed with the ROLLING variant (the open-treatment penalty term drops)", "increments Specimen.version by 1"]
      - from: UNDER_TREATMENT
        to: CRITICAL_CARE
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with findings_severity CRITICAL"
        actor: VeterinaryOfficer
        preconditions: ["case status == OPEN"]
        side_effects:
          - "CRITICAL_CARE COUPLING link 1: health_status = CRITICAL_CARE"
          - "COUPLING link 2 (caused by link 1): when disposition_status == ON_EXHIBIT the specimen is removed from the exhibit (disposition_status -> CLEARED, exhibit_id = null, holding_area = LAST_KNOWN_HOLDING)"
          - "COUPLING link 3 (caused by link 2): the former Exhibit recomputes occupied_bioload_units, bioload_utilization_pct and posture"
          - "COUPLING link 4 (caused by link 3): every InteractionSession on that exhibit with program_type DIVE_ENCOUNTER and status IN {SCHEDULED, ACTIVE} moves to SUSPENDED with suspension_reason = EXHIBIT_CLOSED only when the recomputed posture is CLOSED; otherwise sessions are untouched"
      - from: CRITICAL_CARE
        to: HEALTHY
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with case_type PREVENTIVE_EXAM and findings_severity NONE"
        actor: VeterinaryOfficer
        preconditions: ["health_status == CRITICAL_CARE", "no other VeterinaryCase for this specimen has status OPEN"]
        side_effects: ["welfare_score recomputed with the ROLLING variant", "increments Specimen.version by 1"]
      - from: HEALTHY
        to: DECEASED_PENDING_NECROPSY
        trigger: "POST /aquarium/specimens/{id}/mortality"
        actor: VeterinaryOfficer
        preconditions: ["health_status NOT IN {DECEASED_PENDING_NECROPSY, NECROPSY_COMPLETE}"]
        side_effects: ["CASCADE B link 1 creates the NECROPSY VeterinaryCase"]
      - from: UNDER_TREATMENT
        to: DECEASED_PENDING_NECROPSY
        trigger: "POST /aquarium/specimens/{id}/mortality"
        actor: VeterinaryOfficer
        preconditions: ["health_status NOT IN {DECEASED_PENDING_NECROPSY, NECROPSY_COMPLETE}"]
        side_effects: ["CASCADE B link 1; every OPEN TREATMENT case for this specimen is closed with outcome MORTALITY_REFERRED and findings_severity CRITICAL"]
      - from: CRITICAL_CARE
        to: DECEASED_PENDING_NECROPSY
        trigger: "POST /aquarium/specimens/{id}/mortality"
        actor: VeterinaryOfficer
        preconditions: ["health_status NOT IN {DECEASED_PENDING_NECROPSY, NECROPSY_COMPLETE}"]
        side_effects: ["CASCADE B link 1; every OPEN TREATMENT case closed with outcome MORTALITY_REFERRED"]
      - from: DECEASED_PENDING_NECROPSY
        to: NECROPSY_COMPLETE
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with outcome NECROPSY_FINALIZED"
        actor: VeterinaryOfficer
        preconditions: ["case_type == NECROPSY", "case status == OPEN", "X-User-ID != veterinary_case.opened_by_user_id (segregation of duties)", "findings_severity is non-null"]
        side_effects: ["case status = CLOSED, outcome = NECROPSY_FINALIZED, closed_by_user_id and closed_at set", "increments Specimen.version by 1 and VeterinaryCase.version by 1"]

  # ------------------------------------------------------------ QuarantineCase
  - entity: QuarantineCase
    initial_state: ACTIVE
    terminal_states: [CLEARED, FAILED]
    note: "Cyclic ACTIVE <-> EXTENDED loop; CLEAR is only legal from ACTIVE, so an extended case must be RESUMEd first."
    transitions:
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /aquarium/quarantine-cases/{id}/reviews with outcome EXTEND"
        actor: VeterinaryOfficer
        preconditions: ["status == ACTIVE", "extension_count + 1 <= QUARANTINE_MAX_EXTENSIONS (2)", "extension_days between 1 and 30"]
        side_effects: ["extension_count += 1; total_extension_days += extension_days", "projected_release_at = started_at + (protocol_days + total_extension_days) days", "increments QuarantineCase.version by 1"]
      - from: EXTENDED
        to: ACTIVE
        trigger: "POST /aquarium/quarantine-cases/{id}/reviews with outcome RESUME"
        actor: VeterinaryOfficer
        preconditions: ["status == EXTENDED"]
        side_effects: ["increments QuarantineCase.version by 1"]
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /aquarium/quarantine-cases/{id}/reviews with outcome CLEAR"
        actor: VeterinaryOfficer
        preconditions: ["status == ACTIVE", "clock_now >= projected_release_at", "clearance_exam_count >= QUARANTINE_MIN_CLEAR_EXAMS (2)", "specimen.health_status == HEALTHY"]
        side_effects: ["cleared_by_user_id = X-User-ID; cleared_at = clock_now", "specimen.disposition_status QUARANTINE -> CLEARED", "increments QuarantineCase.version and Specimen.version by 1"]
      - from: ACTIVE
        to: FAILED
        trigger: "POST /aquarium/quarantine-cases/{id}/reviews with outcome FAIL, or the mortality cascade"
        actor: VeterinaryOfficer
        preconditions: ["status IN {ACTIVE, EXTENDED}"]
        side_effects: ["failure_reason stored (MORTALITY when written by the mortality cascade)", "specimen.disposition_status stays QUARANTINE unless the mortality cascade moved it to DECEASED", "increments QuarantineCase.version by 1"]
      - from: EXTENDED
        to: FAILED
        trigger: "POST /aquarium/quarantine-cases/{id}/reviews with outcome FAIL, or the mortality cascade"
        actor: VeterinaryOfficer
        preconditions: ["status == EXTENDED"]
        side_effects: ["same as ACTIVE -> FAILED"]

  # ------------------------------------------------------------ VeterinaryCase
  - entity: VeterinaryCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Branching closure: the four outcome values carry different side-effect sets (welfare recompute, health escalation, exhibit removal, necropsy finalisation)."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with outcome RESOLVED"
        actor: VeterinaryOfficer
        preconditions: ["status == OPEN", "case_type IN {PREVENTIVE_EXAM, TREATMENT}", "findings_severity IN {NONE, MINOR}"]
        side_effects: ["specimen.health_status -> HEALTHY when no other OPEN case remains", "specimen.welfare_score recomputed with the ROLLING variant", "QuarantineCase.clearance_exam_count recomputed for the specimen's ACTIVE/EXTENDED case when case_type == PREVENTIVE_EXAM and findings_severity == NONE"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with outcome CHRONIC_MANAGED"
        actor: VeterinaryOfficer
        preconditions: ["status == OPEN", "case_type == TREATMENT", "findings_severity IN {MINOR, MAJOR}"]
        side_effects: ["specimen.health_status stays UNDER_TREATMENT", "specimen.welfare_score recomputed with the ROLLING variant (open-treatment penalty drops because the case is now CLOSED)"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with outcome MORTALITY_REFERRED"
        actor: VeterinaryOfficer
        preconditions: ["status == OPEN", "findings_severity == CRITICAL"]
        side_effects: ["specimen.health_status -> CRITICAL_CARE and the CRITICAL_CARE COUPLING links 1-4 run", "no necropsy case is created (mortality has not been declared)"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /aquarium/veterinary-cases/{id}/closure with outcome NECROPSY_FINALIZED"
        actor: VeterinaryOfficer
        preconditions: ["status == OPEN", "case_type == NECROPSY", "X-User-ID != opened_by_user_id", "findings_severity is non-null"]
        side_effects: ["specimen.health_status DECEASED_PENDING_NECROPSY -> NECROPSY_COMPLETE", "increments VeterinaryCase.version and Specimen.version by 1"]

  # ----------------------------------------------------------- TransferRequest
  - entity: TransferRequest
    initial_state: DRAFT
    terminal_states: [DECLINED, WITHDRAWN, COMPLETED]
    note: "Cyclic negotiation loop SUBMITTED -> COUNTERED -> SUBMITTED, bounded by TRANSFER_MAX_COUNTERS."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /aquarium/transfer-requests/{id}/submission"
        actor: PermitOfficer
        preconditions:
          - "status IN {DRAFT, COUNTERED}"
          - "receiving_institution.is_receiving_eligible == true"
          - "specimen.disposition_status IN {CLEARED, ON_EXHIBIT}"
          - "specimen.health_status == HEALTHY"
          - "welfare_conditions contains every code required by §1.3 transfer_condition_requirement"
        side_effects: ["specimen.disposition_status -> TRANSFER_PENDING with pre_transfer_disposition recorded", "increments TransferRequest.version and Specimen.version by 1"]
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /aquarium/transfer-requests/{id}/submission (resubmission with revised welfare_conditions)"
        actor: PermitOfficer
        preconditions: ["status == COUNTERED", "welfare_conditions contains every code in counter_conditions and every code required by §1.3 transfer_condition_requirement", "specimen.disposition_status == TRANSFER_PENDING"]
        side_effects: ["welfare_conditions replaced by the request body value", "increments TransferRequest.version by 1"]
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /aquarium/transfer-requests/{id}/decisions with decision COUNTER"
        actor: PartnerInstitutionLiaison
        preconditions: ["status == SUBMITTED", "X-User-ID == receiving_institution_id", "negotiation_round + 1 <= TRANSFER_MAX_COUNTERS (2)", "counter_conditions non-empty"]
        side_effects: ["negotiation_round += 1; counter_conditions stored; decided_by_user_id / decided_at set", "increments TransferRequest.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /aquarium/transfer-requests/{id}/decisions with decision APPROVE"
        actor: ComplianceDirector
        preconditions: ["status == SUBMITTED", "when specimen's species.permit_required == true: transport_permit_id is non-null, that permit's permit_type == TRANSPORT and its status == ISSUED", "receiving_institution.is_receiving_eligible == true"]
        side_effects: ["decided_by_user_id / decided_at set", "increments TransferRequest.version by 1"]
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /aquarium/transfer-requests/{id}/decisions with decision DECLINE, CASCADE C link 2, or CASCADE D"
        actor: PartnerInstitutionLiaison
        preconditions: ["status IN {SUBMITTED, COUNTERED, APPROVED}"]
        side_effects: ["decline_reason set (LIAISON_DECLINED, RECEIVER_INELIGIBLE or TRANSPORT_PERMIT_EXPIRED)", "COMPENSATION: specimen.disposition_status restored from pre_transfer_disposition and pre_transfer_disposition = null", "increments TransferRequest.version and Specimen.version by 1"]
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /aquarium/transfer-requests/{id}/decisions with decision DECLINE"
        actor: PartnerInstitutionLiaison
        preconditions: ["status == COUNTERED", "X-User-ID == receiving_institution_id"]
        side_effects: ["same as SUBMITTED -> DECLINED"]
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /aquarium/transfer-requests/{id}/completion"
        actor: PermitOfficer
        preconditions: ["status == APPROVED", "clock_now >= proposed_transfer_at", "specimen.disposition_status == TRANSFER_PENDING", "specimen.health_status == HEALTHY"]
        side_effects:
          - "completed_at = clock_now"
          - "specimen.disposition_status -> TRANSFERRED; exhibit_id = null"
          - "the former Exhibit recomputes occupied_bioload_units, bioload_utilization_pct and posture"
          - "increments TransferRequest.version, Specimen.version and (when an exhibit was involved) Exhibit.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "the mortality cascade on the specimen"
        actor: system
        preconditions: ["status IN {SUBMITTED, COUNTERED, APPROVED}", "specimen just moved to DECEASED"]
        side_effects: ["pre_transfer_disposition is NOT restored because the specimen is terminal", "increments TransferRequest.version by 1"]

  # --------------------------------------------------------- InteractionSession
  - entity: InteractionSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cyclic SCHEDULED <-> SUSPENDED loop; reinstatement is director-only and re-checks the exhibit posture."
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /aquarium/interaction-sessions/{id}/transitions with action ACTIVATE"
        actor: AquaristTechnician
        preconditions:
          - "status == SCHEDULED"
          - "safety_briefing_confirmed == true"
          - "exhibit.posture != CLOSED (priority 15; a merely RESTRICTED exhibit is filtered by the stricter plant gate below)"
          - "serving LifeSupportSystem.alarm_state == NORMAL and redundancy_overdue == false (priority 17)"
          - "guest_count <= max_guests"
          - "for program_type DIVE_ENCOUNTER: no Specimen with exhibit_id == this exhibit has health_status IN {CRITICAL_CARE, DECEASED_PENDING_NECROPSY}"
        side_effects: ["increments InteractionSession.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /aquarium/interaction-sessions/{id}/transitions with action COMPLETE"
        actor: AquaristTechnician
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments InteractionSession.version by 1"]
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "POST /aquarium/interaction-sessions/{id}/transitions with action SUSPEND, or CASCADE A link 3"
        actor: ComplianceDirector
        preconditions: ["status IN {SCHEDULED, ACTIVE}"]
        side_effects: ["suspension_reason = DIRECTOR_ACTION (endpoint) or EXHIBIT_CLOSED (cascade)", "CASCADE A links 4-5: Exhibit.suspended_session_count += 1 and, at INTERACTION_AUTO_DISABLE_THRESHOLD (2), Exhibit.interaction_program_enabled = false", "increments InteractionSession.version and Exhibit.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /aquarium/interaction-sessions/{id}/transitions with action SUSPEND, or CASCADE A link 3"
        actor: ComplianceDirector
        preconditions: ["status == ACTIVE"]
        side_effects: ["same as SCHEDULED -> SUSPENDED"]
      - from: SUSPENDED
        to: SCHEDULED
        trigger: "POST /aquarium/interaction-sessions/{id}/transitions with action REINSTATE"
        actor: ComplianceDirector
        preconditions: ["status == SUSPENDED", "exhibit.posture != CLOSED", "exhibit.interaction_program_enabled == true", "no §1.3 session_buffer_conflict against another SCHEDULED or ACTIVE session on the same exhibit"]
        side_effects: ["suspension_reason = null", "Exhibit.suspended_session_count is NOT decremented (lifetime counter)", "increments InteractionSession.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /aquarium/interaction-sessions/{id}/transitions with action CANCEL"
        actor: AquaristTechnician
        preconditions: ["status IN {SCHEDULED, SUSPENDED}"]
        side_effects: ["increments InteractionSession.version by 1"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /aquarium/interaction-sessions/{id}/transitions with action CANCEL"
        actor: AquaristTechnician
        preconditions: ["status == SUSPENDED"]
        side_effects: ["increments InteractionSession.version by 1"]

  # -------------------------------------------------------- AccreditationAudit
  - entity: AccreditationAudit
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    note: "Branching determination with a CONDITIONAL -> IN_PROGRESS re-inspection cycle; determination is derived from readiness_score, never supplied by the client."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /aquarium/accreditation-audits/{id}/progressions with action START"
        actor: ComplianceDirector
        preconditions: ["status == SCHEDULED", "clock_now >= scheduled_for"]
        side_effects:
          - "STEP 1: every Specimen with disposition_status IN {CLEARED, ON_EXHIBIT} has welfare_score recomputed with the AUDIT_SNAPSHOT variant and welfare_score_variant = AUDIT_SNAPSHOT"
          - "STEP 2 (strictly after step 1): domain_subscores, blocking_finding_count and readiness_score computed per §1.3 readiness_score using the step-1 values"
          - "opened_by_user_id = X-User-ID; started_at = clock_now"
          - "increments AccreditationAudit.version by 1 and each recomputed Specimen.version by 1"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /aquarium/accreditation-audits/{id}/progressions with action CLOSE"
        actor: ComplianceDirector
        preconditions: ["status == IN_PROGRESS", "X-User-ID != opened_by_user_id", "readiness_score >= AUDIT_PASS_SCORE (85.00)", "blocking_finding_count == 0"]
        side_effects: ["closed_by_user_id = X-User-ID; closed_at = clock_now; determination_note stored", "increments AccreditationAudit.version by 1"]
      - from: IN_PROGRESS
        to: CONDITIONAL
        trigger: "POST /aquarium/accreditation-audits/{id}/progressions with action CLOSE"
        actor: ComplianceDirector
        preconditions: ["status == IN_PROGRESS", "X-User-ID != opened_by_user_id", "readiness_score >= AUDIT_CONDITIONAL_SCORE (70.00) and (readiness_score < 85.00 or blocking_finding_count > 0)"]
        side_effects: ["closed_by_user_id / closed_at / determination_note set", "increments AccreditationAudit.version by 1"]
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /aquarium/accreditation-audits/{id}/progressions with action CLOSE"
        actor: ComplianceDirector
        preconditions: ["status == IN_PROGRESS", "X-User-ID != opened_by_user_id", "readiness_score < 70.00"]
        side_effects: ["closed_by_user_id / closed_at / determination_note set", "increments AccreditationAudit.version by 1"]
      - from: CONDITIONAL
        to: IN_PROGRESS
        trigger: "POST /aquarium/accreditation-audits/{id}/progressions with action REOPEN"
        actor: ComplianceDirector
        preconditions: ["status == CONDITIONAL"]
        side_effects:
          - "closed_by_user_id = null; closed_at = null"
          - "opened_by_user_id = X-User-ID; started_at = clock_now"
          - "STEP 1 and STEP 2 of the START transition run again against current state, so readiness_score and blocking_finding_count are refreshed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /aquarium/accreditation-audits/{id}/progressions with action CANCEL"
        actor: ComplianceDirector
        preconditions: ["status == SCHEDULED"]
        side_effects: ["increments AccreditationAudit.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: plan-entry-create-stale-exhibit
    parent_entity: Exhibit
    write_endpoint: "POST /aquarium/collection-plan-entries"
    occ_field: "expected_exhibit_version"
    description: |
      Creating a CollectionPlanEntry against an Exhibit whose version has
      advanced since the client last read it is rejected. The write is a
      legitimate supersede operation — a new entry for the same
      (exhibit_id, species_id) pair retires the previous APPROVED entry — so
      the second writer would otherwise succeed on stale information about
      which plan lines and bioload the exhibit already carries.
    error_id: ERR_STALE_EXHIBIT_VERSION
    http_status: 412

  - rule_id: clearance-stale-species-quota
    parent_entity: Species
    write_endpoint: "POST /aquarium/acquisition-requests/{id}/clearance"
    occ_field: "expected_species_version"
    description: |
      Clearing an AcquisitionRequest reserves wild-take quota on the Species
      row. A clearance whose expected_species_version is behind the stored
      Species.version is rejected, because the quota pool the director sized
      the decision against has already moved.
    error_id: ERR_STALE_SPECIES_VERSION
    http_status: 412

  - rule_id: exhibit-config-stale-version
    parent_entity: Exhibit
    write_endpoint: "PATCH /aquarium/exhibits/{id}"
    occ_field: "expected_exhibit_version"
    description: |
      Re-capacitating an exhibit or re-enabling its interaction programme is
      rejected when expected_exhibit_version is behind the stored value. The
      edit is legitimate on its own terms, but a stale version means the
      director's view of occupied_bioload_units and posture predates a
      placement or a posture cascade.
    error_id: ERR_STALE_EXHIBIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# All money-free scores are DECIMAL, 2 dp, round_half_up, applied ONCE at the
# step the formula names. Intermediate ratios/means are NEVER pre-rounded
# unless a STEP explicitly says so.
# =============================================================================
calculations:

  # ------------------------------------------------------------------ CALC 1
  - name: water_quality_index
    description: |
      Habitat-conditional composite index over six water parameters, plus the
      reading's severity band and the list of breaching parameter names.
      COMBINATORIAL (mode a): six inputs, a habitat-selected target table, a
      nested max() over per-parameter deviation ratios that feeds BOTH an
      additive and a worst-parameter term, and a contact-exhibit surcharge
      that applies only to TOUCH_POOL plants.
    trigger: "POST /aquarium/life-support-systems/{id}/water-quality-readings (before the alarm_state transition is evaluated)"
    inputs:
      - "WaterQualityReading.temperature_c, salinity_ppt, ph, dissolved_oxygen_mg_l, ammonia_mg_l, nitrite_mg_l"
      - "LifeSupportSystem.design_habitat (selects the HABITAT_TARGETS row)"
    algorithm: threshold
    formula: |
      h = HABITAT_TARGETS[system.design_habitat]

      r_temperature_c        = abs(temperature_c - h.temp_target) / h.temp_band
      r_salinity_ppt         = abs(salinity_ppt  - h.sal_target)  / h.sal_band
      r_ph                   = abs(ph            - h.ph_target)   / h.ph_band
      r_dissolved_oxygen_mg_l= max(0, h.do_warn - dissolved_oxygen_mg_l) / (h.do_warn - h.do_crit) * 2
      r_ammonia_mg_l         = max(0, ammonia_mg_l - AMMONIA_WARN) / (AMMONIA_CRIT - AMMONIA_WARN) * 2
      r_nitrite_mg_l         = max(0, nitrite_mg_l - NITRITE_WARN) / (NITRITE_CRIT - NITRITE_WARN) * 2

      ratios    = [r_temperature_c, r_salinity_ppt, r_ph,
                   r_dissolved_oxygen_mg_l, r_ammonia_mg_l, r_nitrite_mg_l]
      sum_ratio = sum(ratios)          # additive pressure term
      max_ratio = max(ratios)          # worst-parameter term (NESTED aggregate)

      raw = 100 - (SUM_WEIGHT * sum_ratio + MAX_WEIGHT * max_ratio)
      if system.design_habitat == TOUCH_POOL:
          raw = raw - TOUCH_CONTACT_WEIGHT * max(0, r_ammonia_mg_l - 0.5)

      water_quality_index_snapshot = round_half_up(clamp(raw, 0, 100), 2)

      severity = CRITICAL if max_ratio >= CRITICAL_RATIO   # 2.0
                 else WARNING if max_ratio >= WARNING_RATIO # 1.0
                 else NORMAL
      breach_parameters = the names of every parameter whose ratio >= WARNING_RATIO,
                          emitted in the fixed order
                          [temperature_c, salinity_ppt, ph,
                           dissolved_oxygen_mg_l, ammonia_mg_l, nitrite_mg_l]
      # A parameter at exactly its WARN limit has ratio 0.0 and is NOT a breach;
      # a parameter at exactly its CRIT limit has ratio 2.0 and IS a breach.
    constants:
      HABITAT_TARGETS:
        COLD_MARINE:     { temp_target: 12.0, temp_band: 1.5, sal_target: 33.0, sal_band: 1.0, ph_target: 8.10, ph_band: 0.20, do_warn: 7.0, do_crit: 5.5 }
        TROPICAL_MARINE: { temp_target: 25.0, temp_band: 1.5, sal_target: 35.0, sal_band: 1.0, ph_target: 8.20, ph_band: 0.20, do_warn: 6.0, do_crit: 4.5 }
        FRESHWATER:      { temp_target: 22.0, temp_band: 2.0, sal_target: 0.5,  sal_band: 0.5, ph_target: 7.20, ph_band: 0.30, do_warn: 6.5, do_crit: 5.0 }
        TOUCH_POOL:      { temp_target: 14.0, temp_band: 1.0, sal_target: 33.0, sal_band: 1.0, ph_target: 8.10, ph_band: 0.20, do_warn: 7.5, do_crit: 6.0 }
      AMMONIA_WARN: 0.020
      AMMONIA_CRIT: 0.050
      NITRITE_WARN: 0.100
      NITRITE_CRIT: 0.250
      SUM_WEIGHT: 6.0
      MAX_WEIGHT: 15.0
      TOUCH_CONTACT_WEIGHT: 10.0
      WARNING_RATIO: 1.0
      CRITICAL_RATIO: 2.0
      ALARM_DEESCALATE_NORMAL_READINGS: 2
      ALARM_CLEAR_NORMAL_READINGS: 3
    precision: "2 decimal places, round_half_up, applied only to water_quality_index_snapshot"
    worked_examples:
      - "COLD_MARINE at target (12.0, 33.0, 8.10, 7.4, 0.010, 0.020) -> 100.00, NORMAL, breach_parameters []"
      - "COLD_MARINE with ammonia exactly 0.050 -> ratio 2.0 -> 58.00, CRITICAL, breach_parameters [ammonia_mg_l]"
      - "COLD_MARINE with ammonia 0.0485 -> ratio 1.9 -> 60.10, WARNING, breach_parameters [ammonia_mg_l]"
      - "COLD_MARINE (13.65, 33.5, 8.15, 6.25, 0.020, 0.100) -> ratios 1.1/0.5/0.25/1.0/0.0/0.0 -> sum 2.85, max 1.1 -> 66.40, WARNING, breach_parameters [temperature_c, dissolved_oxygen_mg_l]"
      - "TOUCH_POOL (14.0, 33.0, 8.10, 7.8, 0.035, 0.020) -> r_ammonia 1.0, contact surcharge 10*0.5 = 5.00 -> 74.00, WARNING"

  # ------------------------------------------------------------------ CALC 2
  - name: latest_reading_selector
    description: "Deterministic 'latest reading' rule used by LifeSupportSystem.water_quality_index and by the OFFLINE -> {NORMAL, WARNING, CRITICAL} recovery fork."
    trigger: "any read or recomputation that needs the current reading of a plant"
    inputs: ["WaterQualityReading rows of the plant"]
    algorithm: chronological
    formula: |
      latest = the WaterQualityReading of this plant with the greatest taken_at;
               ties broken by greatest created_at; if still tied, by insertion order.
               id is NEVER used as a tiebreaker.
      LifeSupportSystem.water_quality_index = latest.water_quality_index_snapshot,
                                              or 100.00 when the plant has no readings.
    constants: {}
    precision: "inherits the snapshot's 2 dp"

  # ------------------------------------------------------------------ CALC 3
  - name: exhibit_posture
    description: "Priority-ordered derivation of Exhibit.posture and last_posture_reason from the serving plant and the exhibit's own bioload pressure."
    trigger: "serving plant alarm_state change, redundancy test, clock advance that flips redundancy_overdue, any change to occupied_bioload_units, PATCH of bioload_capacity_units"
    inputs: ["LifeSupportSystem.alarm_state", "LifeSupportSystem.redundancy_overdue", "Exhibit.bioload_utilization_pct"]
    algorithm: threshold
    formula: |
      # FIRST match wins — the order is normative.
      if   lss.alarm_state == CRITICAL      -> (CLOSED,     LSS_CRITICAL)
      elif lss.alarm_state == OFFLINE       -> (CLOSED,     LSS_OFFLINE)
      elif lss.alarm_state == WARNING       -> (RESTRICTED, LSS_WARNING)
      elif lss.redundancy_overdue == true   -> (RESTRICTED, REDUNDANCY_OVERDUE)
      elif bioload_utilization_pct > BIOLOAD_PRESSURE_PCT
                                            -> (RESTRICTED, BIOLOAD_PRESSURE)
      else                                  -> (OPEN,       null)
      # Strict '>' : utilisation of exactly 95.00 stays OPEN.
    constants:
      BIOLOAD_PRESSURE_PCT: 95.00
      INTERACTION_AUTO_DISABLE_THRESHOLD: 2
    precision: "n/a (enum result)"

  # ------------------------------------------------------------------ CALC 4
  - name: exhibit_bioload_ledger
    description: "Aggregation of specimen bioload onto the exhibit, with a compensating invariant across placement / removal."
    trigger: "placement, removal, transfer completion, mortality, CRITICAL_CARE coupling, PATCH of bioload_capacity_units"
    inputs: ["Specimen.bioload_units", "Specimen.exhibit_id", "Specimen.disposition_status", "Exhibit.bioload_capacity_units"]
    algorithm: aggregation
    formula: |
      occupied_bioload_units = round_half_up(
          sum(s.bioload_units for s in Specimen
              where s.exhibit_id == E.id
                and s.disposition_status IN {ON_EXHIBIT, TRANSFER_PENDING}), 2)
      bioload_utilization_pct = 0.00 if E.bioload_capacity_units == 0
          else round_half_up(occupied_bioload_units / E.bioload_capacity_units * 100, 2)
      # INVARIANT: for any placement followed by the matching removal, both
      # fields return to their exact pre-placement values (no drift), and the
      # ledger equals the recomputed sum at every point in between.
      # QUARANTINE, CLEARED, TRANSFERRED and DECEASED specimens contribute 0.
    constants: {}
    precision: "2 decimal places, round_half_up"

  # ------------------------------------------------------------------ CALC 5
  - name: quarantine_required_days
    description: |
      COMBINATORIAL (mode c): a six-step pipeline whose steps are NOT
      commutative. risk_tier is keyed on the STEP-2 taxon_days, not on the
      STEP-4 subtotal, so applying the tier extension to a surcharge-inflated
      subtotal produces a different (wrong) answer.
    trigger: "POST /aquarium/specimens — computes Specimen.quarantine_required_days and the auto-created QuarantineCase.protocol_days"
    inputs: ["Species.base_quarantine_days", "Species.taxon_group", "AcquisitionRequest.source_type", "Institution.accreditation_status of the source institution (may be absent)"]
    algorithm: tiered_pricing
    formula: |
      STEP 1  base_days   = species.base_quarantine_days
      STEP 2  taxon_days  = ceil(base_days * TAXON_MULTIPLIER[species.taxon_group])
      STEP 3  surcharge   = (WILD_SURCHARGE_DAYS if acquisition_request.source_type == WILD_COLLECTION else 0)
                          + (NON_ACCREDITED_SURCHARGE_DAYS if source_institution.accreditation_status == NON_ACCREDITED
                             else PROVISIONAL_SURCHARGE_DAYS if source_institution.accreditation_status == PROVISIONAL
                             else 0)
                          # 0 when the request has no source_institution_id
      STEP 4  subtotal    = taxon_days + surcharge
      STEP 5  risk_tier   = HIGH if taxon_days >= HIGH_TIER_TAXON_DAYS else STANDARD
                            # keyed on STEP 2 — NOT on subtotal
      STEP 6  quarantine_required_days = subtotal + (HIGH_TIER_EXTRA_DAYS if risk_tier == HIGH else 0)

      QuarantineCase.protocol_days        = specimen.quarantine_required_days
      QuarantineCase.started_at           = specimen.arrival_at
      QuarantineCase.projected_release_at = started_at + (protocol_days + total_extension_days) days
    constants:
      TAXON_MULTIPLIER: { ELASMOBRANCH: 1.5, TELEOST: 1.0, INVERTEBRATE: 0.5, MARINE_MAMMAL: 2.0, REPTILE: 1.25, BIRD: 1.25 }
      WILD_SURCHARGE_DAYS: 14
      NON_ACCREDITED_SURCHARGE_DAYS: 10
      PROVISIONAL_SURCHARGE_DAYS: 5
      HIGH_TIER_TAXON_DAYS: 45
      HIGH_TIER_EXTRA_DAYS: 7
    precision: "integer days; ceil at STEP 2 only"
    worked_examples:
      - "base 24, ELASMOBRANCH, WILD_COLLECTION, NON_ACCREDITED source -> taxon 36, surcharge 24, subtotal 60, tier STANDARD (36 < 45) -> 60. Keying the tier on subtotal 60 would wrongly yield 67."
      - "base 30, TELEOST, CAPTIVE_BRED, no institution -> taxon 30, surcharge 0, subtotal 30, STANDARD -> 30"
      - "base 30, ELASMOBRANCH, WILD_COLLECTION, ACCREDITED -> taxon 45, surcharge 14, subtotal 59, tier HIGH (45 >= 45) -> 66"
      - "base 30, TELEOST, WILD_COLLECTION, PROVISIONAL -> taxon 30, surcharge 19, subtotal 49, STANDARD -> 49"

  # ------------------------------------------------------------------ CALC 6
  - name: sustainability_score
    description: |
      DUAL VARIANT. PROVISIONAL is stamped at AcquisitionRequest creation from
      sourcing attributes alone. FINAL is recomputed at clearance and adds a
      permit bonus and a wild-take quota-pressure deduction. Both variants
      cap the additive part at 100 BEFORE the protection penalty and quota
      pressure are subtracted, so the cap and the penalties do not commute.
    trigger: "PROVISIONAL: POST /aquarium/acquisition-requests. FINAL: POST /aquarium/acquisition-requests/{id}/clearance."
    inputs: ["Species.sustainability_rating", "Species.protection_status", "AcquisitionRequest.source_type", "Institution.welfare_audit_score of the source institution (may be absent)", "Species.wild_take_quota_reserved / wild_take_quota_annual", "Permit.status of the request's permits (FINAL only)"]
    algorithm: weighted_scoring
    formula: |
      base = RATING_POINTS[species.sustainability_rating] + SOURCE_POINTS[source_type]
      institution_component = NO_INSTITUTION_POINTS if source_institution_id is null
                              else INSTITUTION_WEIGHT * source_institution.welfare_audit_score

      # variant-specific terms
      permit_bonus   = 0                       (PROVISIONAL)
                     = PERMIT_BONUS if any Permit of this request has status ISSUED else 0   (FINAL)
      quota_pressure = 0                       (PROVISIONAL)
                     = QUOTA_PRESSURE_WEIGHT * ((species.wild_take_quota_reserved + requested_count)
                                                / species.wild_take_quota_annual)            (FINAL,
                       only when source_type == WILD_COLLECTION and wild_take_quota_annual > 0; else 0)

      gross = min(100, base + institution_component + permit_bonus)
      sustainability_score = round_half_up(
          clamp(gross - PROTECTION_PENALTY[species.protection_status] - quota_pressure, 0, 100), 2)
      sustainability_score_variant = PROVISIONAL | FINAL
    constants:
      RATING_POINTS: { GREEN: 40.0, YELLOW: 24.0, RED: 8.0 }
      SOURCE_POINTS: { CAPTIVE_BRED: 35.0, RESCUE_STRANDING: 30.0, INSTITUTIONAL_TRANSFER: 22.0, WILD_COLLECTION: 10.0 }
      PROTECTION_PENALTY: { UNLISTED: 0.0, CITES_APPENDIX_II: 6.0, CITES_APPENDIX_I: 14.0, ESA_LISTED: 18.0 }
      INSTITUTION_WEIGHT: 0.25
      NO_INSTITUTION_POINTS: 20.0
      PERMIT_BONUS: 5.0
      QUOTA_PRESSURE_WEIGHT: 20.0
      MIN_CLEARANCE_SCORE: 40.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "stamped by POST /aquarium/acquisition-requests"
        difference: "no permit bonus and no quota-pressure deduction; reflects only rating, source type and source-institution welfare"
      - name: FINAL
        when: "recomputed by POST /aquarium/acquisition-requests/{id}/clearance and compared against MIN_CLEARANCE_SCORE"
        difference: "adds PERMIT_BONUS when an ISSUED permit exists and subtracts QUOTA_PRESSURE_WEIGHT * quota utilisation for wild collection; also re-reads the source institution's current welfare_audit_score, so an institution PATCH between creation and clearance moves the score"
    worked_examples:
      - "GREEN + INSTITUTIONAL_TRANSFER + UNLISTED, institution welfare 88.00 -> PROVISIONAL 84.00; after the institution is PATCHed to 60.00, FINAL = min(100, 62 + 15) - 0 - 0 = 77.00 (delta -7.00)"
      - "YELLOW + WILD_COLLECTION + CITES_APPENDIX_II, institution welfare 62.00, quota 1 of 4, ISSUED permit -> PROVISIONAL 43.50; FINAL = min(100, 34 + 15.5 + 5) - 6 - 20*(1/4) = 43.50 (numerically equal by construction)"
      - "RED + WILD_COLLECTION + ESA_LISTED, institution welfare 62.00, quota 1 of 4, ISSUED permit -> FINAL 15.50, below MIN_CLEARANCE_SCORE 40.00 -> clearance rejected"
      - "GREEN + CAPTIVE_BRED + UNLISTED, no source institution -> 40 + 35 + 20 = 95.00 for both variants"

  # ------------------------------------------------------------------ CALC 7
  - name: welfare_score
    description: |
      DUAL VARIANT on a different entity and a different input universe from
      CALC 6. ROLLING looks at the five most recent husbandry logs and
      penalises OPEN treatment cases. AUDIT_SNAPSHOT looks at a fixed 14-day
      calendar window, divides by the window length instead of the sample
      count, and penalises days with no feeding record instead of open cases.
    trigger: "ROLLING: POST /aquarium/specimens/{id}/husbandry-logs and every VeterinaryCase closure. AUDIT_SNAPSHOT: the START / REOPEN transition of an AccreditationAudit."
    inputs: ["HusbandryLog rows of the specimen (log_type FEEDING or BEHAVIOR)", "VeterinaryCase rows of the specimen with status OPEN and case_type TREATMENT", "clock_now (AUDIT_SNAPSHOT only)"]
    algorithm: aggregation
    formula: |
      # ---- shared components -------------------------------------------------
      behavior_component = mean(BEHAVIOR_POINTS[row.behavior_code] for BEHAVIOR rows in window)
                           or 0 when the window has no BEHAVIOR row

      # ---- ROLLING ----------------------------------------------------------
      window  = the ROLLING_WINDOW_SIZE most recent HusbandryLog rows of this
                specimen with log_type IN {FEEDING, BEHAVIOR}, ordered
                logged_at DESC then created_at DESC
      if window is empty: welfare_score = null and welfare_score_variant = null
      feeding_component   = mean(row.appetite_score for FEEDING rows in window) * APPETITE_WEIGHT
                            or 0 when the window has no FEEDING row
      open_treatment_count= count(VeterinaryCase of this specimen with status OPEN and case_type == TREATMENT)
      raw = BASE_WELFARE + feeding_component + behavior_component
            - OPEN_TREATMENT_PENALTY * open_treatment_count

      # ---- AUDIT_SNAPSHOT ---------------------------------------------------
      window  = every HusbandryLog of this specimen with log_type IN {FEEDING, BEHAVIOR}
                and logged_at in [clock_now - AUDIT_WINDOW_DAYS days, clock_now]
      feeding_component = (sum(row.appetite_score for FEEDING rows in window) / AUDIT_WINDOW_DAYS)
                          * APPETITE_WEIGHT
      missing_feed_days = AUDIT_WINDOW_DAYS
                          - count(distinct UTC calendar date of FEEDING rows in window)
      raw = BASE_WELFARE + feeding_component + behavior_component
            - MISSING_DAY_PENALTY * missing_feed_days
      # NOTE: no open-treatment penalty in AUDIT_SNAPSHOT, and no missing-day
      # penalty in ROLLING. This is the divergence, not an oversight.

      welfare_score = round_half_up(clamp(raw, 0, 100), 2)
    constants:
      BASE_WELFARE: 40.0
      APPETITE_WEIGHT: 8.0
      BEHAVIOR_POINTS: { NORMAL: 10.0, LETHARGIC: 4.0, AGGRESSIVE: 2.0, ABNORMAL_SWIM: 0.0 }
      OPEN_TREATMENT_PENALTY: 6.0
      MISSING_DAY_PENALTY: 3.0
      ROLLING_WINDOW_SIZE: 5
      AUDIT_WINDOW_DAYS: 14
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ROLLING
        when: "husbandry log append and veterinary case closure"
        difference: "sample-count mean over the 5 newest logs; OPEN TREATMENT cases each cost 6.00"
      - name: AUDIT_SNAPSHOT
        when: "AccreditationAudit START / REOPEN"
        difference: "14-day window, appetite sum divided by 14 (not by the sample count), and every calendar day without a feeding record costs 3.00"
    worked_examples:
      - "logs FEEDING 4, FEEDING 5, BEHAVIOR NORMAL, FEEDING 3, BEHAVIOR LETHARGIC (all 5 in the rolling window) -> feeding 4.0*8 = 32.00, behavior (10+4)/2 = 7.00 -> ROLLING 79.00"
      - "same five logs with one OPEN TREATMENT case -> 79.00 - 6.00 = 73.00"
      - "same five logs spread over 3 distinct feeding days inside the 14-day window -> feeding (4+5+3)/14*8 = 6.857142857..., behavior 7.00, missing 14 - 3 = 11 -> raw 40 + 6.857142857 + 7 - 33 = 20.857142857 -> AUDIT_SNAPSHOT 20.86"

  # ------------------------------------------------------------------ CALC 8
  - name: readiness_score
    description: |
      COMBINATORIAL (mode b): nested rounding. Each of the five domain
      subscores is rounded to 2 dp FIRST, the weighted sum of the ROUNDED
      subscores is then rounded to 2 dp, and only then is the blocking-finding
      deduction applied and clamped. Summing the unrounded subscores gives a
      different answer.
    trigger: "AccreditationAudit START and REOPEN transitions, strictly after every in-scope Specimen has been re-scored with the AUDIT_SNAPSHOT welfare variant"
    inputs: ["LifeSupportSystem rows", "Specimen rows", "HusbandryLog counts", "AcquisitionRequest + Permit rows", "InteractionSession + Exhibit rows"]
    algorithm: weighted_scoring
    formula: |
      # ---- STEP 1: five domain subscores, EACH rounded to 2 dp -------------
      plant_score(p) = clamp(p.water_quality_index
                             - (REDUNDANCY_PENALTY if p.redundancy_overdue else 0)
                             - (OFFLINE_PENALTY if p.alarm_state == OFFLINE else 0), 0, 100)
      LIFE_SUPPORT  = round_half_up(mean(plant_score(p) for p in LifeSupportSystem), 2)
                      or 100.00 when there is no LifeSupportSystem row
      ANIMAL_HEALTH = round_half_up(mean(s.welfare_score for s in Specimen
                          where s.disposition_status IN {CLEARED, ON_EXHIBIT}
                            and s.welfare_score is not null), 2)
                      or 100.00 when that set is empty
      RECORDS       = round_half_up(clamp(100 - RECORD_GAP_PENALTY * count(s in Specimen
                          where s.disposition_status IN {QUARANTINE, CLEARED, ON_EXHIBIT}
                            and s has zero HusbandryLog rows), 0, 100), 2)
      PERMITS       = round_half_up(clamp(100 - PERMIT_GAP_PENALTY * count(a in AcquisitionRequest
                          where a.status == CLEARED and a.permit_required == true
                            and no Permit of a has status ISSUED), 0, 100), 2)
      PUBLIC_SAFETY = round_half_up(clamp(100
                          - SUSPENSION_PENALTY * count(InteractionSession where status == SUSPENDED)
                          - DISABLED_EXHIBIT_PENALTY * count(Exhibit where interaction_program_enabled == false
                                                             and it has at least one InteractionSession),
                          0, 100), 2)
      domain_subscores = { LIFE_SUPPORT, ANIMAL_HEALTH, RECORDS, PERMITS, PUBLIC_SAFETY }

      # ---- STEP 2: weighted sum of the ROUNDED subscores, then round -------
      weighted = 0.30*LIFE_SUPPORT + 0.25*ANIMAL_HEALTH + 0.20*RECORDS
               + 0.15*PERMITS      + 0.10*PUBLIC_SAFETY
      weighted_rounded = round_half_up(weighted, 2)

      # ---- STEP 3: blocking findings, then clamp ---------------------------
      blocking_finding_count = count(LifeSupportSystem where alarm_state IN {CRITICAL, OFFLINE})
                             + count(Exhibit where posture == CLOSED)
                             + count(Specimen where health_status == DECEASED_PENDING_NECROPSY)
      readiness_score = round_half_up(max(0, weighted_rounded
                                          - BLOCKING_PENALTY * blocking_finding_count), 2)

      # ---- determination (§1.2 AccreditationAudit) -------------------------
      PASSED      when readiness_score >= AUDIT_PASS_SCORE and blocking_finding_count == 0
      CONDITIONAL when readiness_score >= AUDIT_CONDITIONAL_SCORE and not PASSED
      FAILED      when readiness_score <  AUDIT_CONDITIONAL_SCORE
    constants:
      DOMAIN_WEIGHTS: { LIFE_SUPPORT: 0.30, ANIMAL_HEALTH: 0.25, RECORDS: 0.20, PERMITS: 0.15, PUBLIC_SAFETY: 0.10 }
      REDUNDANCY_PENALTY: 10.00
      OFFLINE_PENALTY: 25.00
      RECORD_GAP_PENALTY: 5.00
      PERMIT_GAP_PENALTY: 20.00
      SUSPENSION_PENALTY: 15.00
      DISABLED_EXHIBIT_PENALTY: 25.00
      BLOCKING_PENALTY: 4.00
      AUDIT_PASS_SCORE: 85.00
      AUDIT_CONDITIONAL_SCORE: 70.00
    precision: "2 decimal places, round_half_up, applied at STEP 1 per subscore, again at STEP 2, and again at STEP 3"
    worked_examples:
      - "subscores 100.00 / 20.86 / 100.00 / 100.00 / 100.00, blocking 0 -> weighted 80.2150 -> 80.22 -> readiness_score 80.22, determination CONDITIONAL. Summing the UNROUNDED animal-health mean 20.857142857 instead gives 80.2142857 -> 80.21, which is the wrong answer."
      - "empty world (no plants, no specimens, no sessions) -> every subscore 100.00 -> 100.00, blocking 0 -> readiness_score 100.00, determination PASSED"
      - "one CRITICAL plant with water_quality_index 58.00, no specimens, 2 SUSPENDED sessions, 1 exhibit with interaction_program_enabled false -> subscores 58.00 / 100.00 / 100.00 / 100.00 / 45.00 -> weighted 81.9000 -> 81.90, blocking 2 -> 81.90 - 8.00 = 73.90, determination CONDITIONAL"

  # ------------------------------------------------------------------ CALC 9
  - name: session_buffer_conflict
    description: "Closed-interval overlap test on InteractionSession with a mandatory turnover buffer between consecutive sessions on the same exhibit."
    trigger: "POST /aquarium/interaction-sessions and the REINSTATE transition"
    inputs: ["candidate starts_at / ends_at", "InteractionSession rows on the same exhibit with status IN {SCHEDULED, ACTIVE, SUSPENDED}"]
    algorithm: interval_merge
    formula: |
      # intervals are CLOSED: [starts_at, ends_at], ends_at > starts_at required.
      conflict(C, S) = (C.starts_at < S.ends_at   + BUFFER_MINUTES)
                   and (S.starts_at < C.ends_at   + BUFFER_MINUTES)
      # Consequences:
      #   - any overlap conflicts
      #   - adjacency (C.starts_at == S.ends_at, gap 0) CONFLICTS
      #   - gap of exactly BUFFER_MINUTES does NOT conflict
      #   - gap of BUFFER_MINUTES - 1 minute CONFLICTS
      # COMPLETED and CANCELLED sessions are ignored.
    constants:
      BUFFER_MINUTES: 30
    precision: "whole minutes"

  # ----------------------------------------------------------------- CALC 10
  - name: treatment_withdrawal_window
    description: "HALF-OPEN interval test on veterinary treatment withdrawal periods for one specimen — deliberately the opposite boundary convention from CALC 9."
    trigger: "POST /aquarium/veterinary-cases with case_type TREATMENT"
    inputs: ["candidate treatment_start_at / withdrawal_days", "VeterinaryCase rows of the same specimen with case_type TREATMENT and status OPEN"]
    algorithm: interval_merge
    formula: |
      window(c) = [c.treatment_start_at, c.treatment_start_at + c.withdrawal_days days)   # upper bound EXCLUSIVE
      conflict(new, existing) = (new.start < existing.end) and (existing.start < new.end)
      # Consequences:
      #   - adjacency (new.start == existing.end) does NOT conflict
      #   - withdrawal_days == 0 yields an empty window that never conflicts
      Specimen.treatment_withdrawal_until = max(window(c).end
                                                over OPEN TREATMENT cases of the specimen),
                                            or null when there is none
    constants: {}
    precision: "whole days"

  # ----------------------------------------------------------------- CALC 11
  - name: permit_document_requirement
    description: "Conditional required-document set for a permit submission; drives Permit.missing_document_codes."
    trigger: "POST /aquarium/permits/{id}/submission"
    inputs: ["Permit.permit_type", "Permit.document_codes", "Species.protection_status of the request's plan entry species"]
    algorithm: threshold
    formula: |
      required = BASE_DOCUMENTS[permit.permit_type]
      if species.protection_status IN {CITES_APPENDIX_II, CITES_APPENDIX_I}: required += [CITES_PERMIT]
      if species.protection_status IN {CITES_APPENDIX_I, ESA_LISTED}:       required += [ESA_AUTHORIZATION]
      missing_document_codes = codes in `required` absent from permit.document_codes,
                               emitted in the order of `required`
      submission is rejected when missing_document_codes is non-empty
    constants:
      BASE_DOCUMENTS:
        IMPORT: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]
        TRANSPORT: [HEALTH_CERTIFICATE, TRANSPORT_PLAN]
        POSSESSION: [HEALTH_CERTIFICATE, POSSESSION_AFFIDAVIT]
    precision: "n/a (set result)"

  # ----------------------------------------------------------------- CALC 12
  - name: transfer_condition_requirement
    description: "Conditional required welfare-condition set for a transfer submission, including any conditions the receiving institution countered with."
    trigger: "POST /aquarium/transfer-requests/{id}/submission"
    inputs: ["TransferRequest.welfare_conditions", "TransferRequest.counter_conditions", "Institution.accreditation_status", "Species.protection_status", "VeterinaryCase history of the specimen"]
    algorithm: threshold
    formula: |
      required = [WATER_CHEMISTRY_MATCH, TRANSPORT_OXYGEN_PLAN]
      if receiving_institution.accreditation_status == PROVISIONAL: required += [QUARANTINE_ON_ARRIVAL]
      if species.protection_status != UNLISTED:                     required += [CITES_TRANSPORT_CLEARANCE]
      if the specimen has at least one VeterinaryCase with case_type == TREATMENT (any status):
                                                                    required += [DIET_TRANSITION_PLAN]
      required += every code in counter_conditions not already present
      submission is rejected when any code in `required` is absent from welfare_conditions
    constants: {}
    precision: "n/a (set result)"

  # ----------------------------------------------------------------- CALC 13
  - name: derived_flag_reconciliation
    description: "The small derivations that gate half of §1.4: institution eligibility, permit necessity, specimen bioload and captive-bred provenance."
    trigger: "on write of the owning entity and on every read of a dependent rule"
    inputs: ["Institution.accreditation_status / welfare_audit_score", "Species.protection_status", "AcquisitionRequest.source_type", "Specimen.sire_specimen_id / dam_specimen_id"]
    algorithm: threshold
    formula: |
      Institution.is_receiving_eligible =
          accreditation_status IN {ACCREDITED, PROVISIONAL}
          and welfare_audit_score >= MIN_RECEIVER_WELFARE_SCORE     # >= is inclusive
      Species.permit_required            = protection_status != UNLISTED
      AcquisitionRequest.permit_required = species.permit_required
                                           or source_type == WILD_COLLECTION
      Specimen.bioload_units             = species.bioload_units_per_specimen
                                           (snapshotted at creation; a later Species
                                            edit does NOT retro-change placed specimens)
      Specimen.captive_bred              = sire_specimen_id is not null
                                           and dam_specimen_id is not null
    constants:
      MIN_RECEIVER_WELFARE_SCORE: 70.00
    precision: "2 decimal places for the score comparison"

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending `priority`. The FIRST failing
# rule short-circuits the request; no later rule may mask an earlier one.
# =============================================================================
validations:

  # ---- auth / authz -------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all
    description: "Every endpoint, including GETs and POST /_clock/set_current_utc, requires a caller identity."
  - priority: 2
    category: auth
    check: "X-User-Role header present and equal to one of the six §1.7 role names"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all
    description: "An absent or unrecognised role string fails before any authorization decision."
  - priority: 3
    category: authz
    check: "the caller's role appears in the endpoint's `roles` list, and — for enum-driven action endpoints — in the action's own role restriction"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
    description: "Action-level restrictions are part of this rule: SUSPEND and REINSTATE on /interaction-sessions/{id}/transitions are ComplianceDirector-only, ACTIVATE / COMPLETE / CANCEL are AquaristTechnician-only; COUNTER and DECLINE on /transfer-requests/{id}/decisions are PartnerInstitutionLiaison-only, APPROVE is ComplianceDirector-only."
  - priority: 4
    category: authz
    check: "a PartnerInstitutionLiaison caller may only act on a TransferRequest whose receiving_institution_id equals X-User-ID"
    error_id: ERR_INSTITUTION_SCOPE_VIOLATION
    http_status: 403
    applies_to: ["POST /aquarium/transfer-requests/{id}/decisions", "GET /aquarium/transfer-requests", "GET /aquarium/transfer-requests/{id}"]
    description: "Entity-backed role scoping: the liaison's X-User-ID IS its Institution.id."

  # ---- existence ----------------------------------------------------------
  - priority: 5
    category: existence
    check: "every {id} path parameter resolves to an existing row of the expected entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: all
    description: "Resolved left-to-right; a sub-resource path checks the parent segment before the child segment."
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /aquarium/exhibits", "POST /aquarium/collection-plan-entries", "POST /aquarium/acquisition-requests", "POST /aquarium/permits", "POST /aquarium/specimens", "POST /aquarium/veterinary-cases", "POST /aquarium/transfer-requests", "POST /aquarium/interaction-sessions", "POST /aquarium/specimens/{id}/exhibit-placements"]
    description: "Body FKs are checked in the field order declared in §1.5 `input`."

  # ---- request shape ------------------------------------------------------
  - priority: 7
    category: request
    check: "required fields present; types, enum members and numeric ranges per §1.1 constraints"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
    description: "Also rejects any attempt to set a `source: computed` or `source: system` field from the request body — such fields are ignored on write and never echoed from input."
  - priority: 8
    category: request
    check: "limit in [1, 100] and offset >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: ["GET /aquarium/life-support-systems", "GET /aquarium/life-support-systems/{id}/water-quality-readings", "GET /aquarium/life-support-systems/{id}/exhibits", "GET /aquarium/exhibits", "GET /aquarium/exhibits/{id}/interaction-sessions", "GET /aquarium/species", "GET /aquarium/institutions", "GET /aquarium/collection-plan-entries", "GET /aquarium/acquisition-requests", "GET /aquarium/acquisition-requests/{id}/permits", "GET /aquarium/specimens", "GET /aquarium/specimens/{id}/quarantine-cases", "GET /aquarium/specimens/{id}/husbandry-logs", "GET /aquarium/specimens/{id}/veterinary-cases", "GET /aquarium/transfer-requests", "GET /aquarium/accreditation-audits"]
    description: "Defaults limit 10 / offset 0; every list response carries limit, offset, total_count and has_more."

  # ---- optimistic concurrency (§1.2.1) ------------------------------------
  - priority: 9
    category: concurrency
    check: "expected_<parent>_version equals the stored parent version"
    error_id: "ERR_STALE_EXHIBIT_VERSION | ERR_STALE_SPECIES_VERSION"
    http_status: 412
    applies_to: ["POST /aquarium/collection-plan-entries", "PATCH /aquarium/exhibits/{id}", "POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/specimens/{id}/exhibit-removals", "POST /aquarium/acquisition-requests/{id}/clearance"]
    description: "Checked after existence and shape but BEFORE any state or business rule, so a stale version always wins over a state or capacity complaint."

  # ---- state --------------------------------------------------------------
  - priority: 10
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /aquarium/collection-plan-entries/{id}/status-actions", "POST /aquarium/acquisition-requests/{id}/submission", "POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/acquisition-requests/{id}/cancellation", "POST /aquarium/permits/{id}/submission", "POST /aquarium/permits/{id}/decisions", "POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/specimens/{id}/exhibit-removals", "POST /aquarium/specimens/{id}/mortality", "POST /aquarium/quarantine-cases/{id}/reviews", "POST /aquarium/veterinary-cases/{id}/closure", "POST /aquarium/transfer-requests/{id}/submission", "POST /aquarium/transfer-requests/{id}/decisions", "POST /aquarium/transfer-requests/{id}/completion", "POST /aquarium/interaction-sessions/{id}/transitions", "POST /aquarium/accreditation-audits/{id}/progressions"]
    description: "PRIORITY PAIR A (high side): a placement onto a specimen that is not CLEARED returns ERR_INVALID_STATE even when the exhibit is also over its bioload capacity (priority 45)."
  - priority: 11
    category: state
    check: "the target entity is not already in one of its terminal states"
    error_id: ERR_ENTITY_TERMINAL
    http_status: 409
    applies_to: ["POST /aquarium/collection-plan-entries/{id}/status-actions", "POST /aquarium/acquisition-requests/{id}/cancellation", "POST /aquarium/permits/{id}/decisions", "POST /aquarium/specimens/{id}/mortality", "POST /aquarium/quarantine-cases/{id}/reviews", "POST /aquarium/veterinary-cases/{id}/closure", "POST /aquarium/transfer-requests/{id}/decisions", "POST /aquarium/interaction-sessions/{id}/transitions", "POST /aquarium/accreditation-audits/{id}/progressions"]
    description: "Distinguishes 'terminal, nothing is possible' from 'wrong non-terminal state' — a second mortality declaration on a DECEASED specimen is ERR_ENTITY_TERMINAL, not ERR_INVALID_STATE."
  - priority: 12
    category: state
    check: "the supplied `action` / `outcome` / `decision` enum value is legal from the entity's current state"
    error_id: ERR_INVALID_ACTION
    http_status: 422
    applies_to: ["POST /aquarium/collection-plan-entries/{id}/status-actions", "POST /aquarium/permits/{id}/decisions", "POST /aquarium/quarantine-cases/{id}/reviews", "POST /aquarium/veterinary-cases/{id}/closure", "POST /aquarium/transfer-requests/{id}/decisions", "POST /aquarium/interaction-sessions/{id}/transitions", "POST /aquarium/accreditation-audits/{id}/progressions"]
    description: "Example: outcome CLEAR on an EXTENDED QuarantineCase is ERR_INVALID_ACTION (RESUME first); outcome NECROPSY_FINALIZED on a TREATMENT case is ERR_INVALID_ACTION."

  # ---- business_safety ----------------------------------------------------
  - priority: 13
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from the user who performed the paired earlier step"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/accreditation-audits/{id}/progressions", "POST /aquarium/veterinary-cases/{id}/closure"]
    description: "Clearance actor != CollectionPlanEntry.approved_by_user_id; audit CLOSE actor != opened_by_user_id; NECROPSY closure actor != VeterinaryCase.opened_by_user_id."
  - priority: 14
    category: business_safety
    check: "specimen.health_status == HEALTHY"
    error_id: ERR_SPECIMEN_NOT_HEALTHY
    http_status: 409
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/transfer-requests/{id}/submission", "POST /aquarium/transfer-requests/{id}/completion", "POST /aquarium/quarantine-cases/{id}/reviews"]
    description: "CROSS-DIMENSION guard: the disposition dimension may be correct while the clinical dimension blocks the move."
  - priority: 15
    category: business_safety
    check: "the target exhibit's posture is not CLOSED"
    error_id: ERR_EXHIBIT_CLOSED
    http_status: 409
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
    description: "PRIORITY PAIR B (high side): a placement into a CLOSED exhibit returns ERR_EXHIBIT_CLOSED even when there is also no APPROVED CollectionPlanEntry for the (exhibit, species) pair (priority 24)."
  - priority: 16
    category: business_safety
    check: "when the exhibit's posture is RESTRICTED, restricted_posture_override == true"
    error_id: ERR_RESTRICTED_POSTURE_OVERRIDE_REQUIRED
    http_status: 409
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
    description: "CONDITIONAL rule: only evaluated when posture == RESTRICTED; an OPEN exhibit ignores the flag entirely."
  - priority: 17
    category: business_safety
    check: "the exhibit's serving LifeSupportSystem has alarm_state == NORMAL and redundancy_overdue == false"
    error_id: ERR_LIFE_SUPPORT_ALARM
    http_status: 409
    applies_to: ["POST /aquarium/interaction-sessions/{id}/transitions"]
    description: "ACTIVATE demands a fully quiet plant, which is stricter than the posture check at priority 15 (WARNING leaves the posture merely RESTRICTED)."
  - priority: 18
    category: business_safety
    check: "exhibit.interaction_program_enabled == true"
    error_id: ERR_INTERACTION_PROGRAM_DISABLED
    http_status: 409
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
    description: "The flag is switched off by CASCADE A link 5 and can only be restored by PATCH /aquarium/exhibits/{id}."
  - priority: 19
    category: business_safety
    check: "safety_briefing_confirmed == true"
    error_id: ERR_SAFETY_BRIEFING_REQUIRED
    http_status: 422
    applies_to: ["POST /aquarium/interaction-sessions/{id}/transitions"]
    description: "Only the ACTIVATE action enforces this; a session may be created with the flag false."
  - priority: 20
    category: business_safety
    check: "for program_type DIVE_ENCOUNTER, no Specimen assigned to the exhibit has health_status IN {CRITICAL_CARE, DECEASED_PENDING_NECROPSY}"
    error_id: ERR_DIVE_ENCOUNTER_BLOCKED
    http_status: 409
    applies_to: ["POST /aquarium/interaction-sessions/{id}/transitions"]
    description: "CONDITIONAL cross-entity rule keyed on the session's program_type."
  - priority: 21
    category: business_safety
    check: "clock_now >= quarantine_case.projected_release_at"
    error_id: ERR_QUARANTINE_NOT_COMPLETE
    http_status: 409
    applies_to: ["POST /aquarium/quarantine-cases/{id}/reviews"]
    description: "Only the CLEAR outcome enforces it; EXTEND, RESUME and FAIL are legal at any time. The boundary is inclusive: clock exactly at projected_release_at passes."
  - priority: 22
    category: business_safety
    check: "quarantine_case.clearance_exam_count >= QUARANTINE_MIN_CLEAR_EXAMS (2)"
    error_id: ERR_CLEARANCE_EXAMS_INSUFFICIENT
    http_status: 409
    applies_to: ["POST /aquarium/quarantine-cases/{id}/reviews"]
    description: "clearance_exam_count counts CLOSED PREVENTIVE_EXAM VeterinaryCase rows with findings_severity NONE recorded while the case was ACTIVE or EXTENDED."
  - priority: 23
    category: business_safety
    check: "the candidate treatment withdrawal window does not overlap an OPEN TREATMENT case's window per §1.3 treatment_withdrawal_window"
    error_id: ERR_TREATMENT_WITHDRAWAL_ACTIVE
    http_status: 409
    applies_to: ["POST /aquarium/veterinary-cases"]
    description: "HALF-OPEN interval: a new window starting exactly at the existing window's end is accepted."

  # ---- business_referential -----------------------------------------------
  - priority: 24
    category: business_referential
    check: "an APPROVED CollectionPlanEntry exists for (target exhibit_id, specimen.species_id)"
    error_id: ERR_NO_APPROVED_PLAN_ENTRY
    http_status: 409
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
    description: "PRIORITY PAIR B (low side): masked by ERR_EXHIBIT_CLOSED at priority 15."
  - priority: 25
    category: business_referential
    check: "exhibit.habitat_type equals the serving LifeSupportSystem.design_habitat"
    error_id: ERR_HABITAT_MISMATCH
    http_status: 422
    applies_to: ["POST /aquarium/exhibits", "POST /aquarium/collection-plan-entries/{id}/status-actions"]
    description: "Enforced at exhibit creation and re-checked at plan approval, because the exhibit's plant assignment can be edited in between."
  - priority: 26
    category: business_referential
    check: "the required permit exists in status ISSUED"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/transfer-requests/{id}/decisions"]
    description: "Clearance of a PENDING_PERMIT request needs an ISSUED permit of the right type; APPROVE of a transfer of a protected species needs an ISSUED TRANSPORT permit."
  - priority: 27
    category: business_referential
    check: "permit_type matches the context"
    error_id: ERR_PERMIT_TYPE_MISMATCH
    http_status: 422
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/transfer-requests"]
    description: "WILD_COLLECTION requires IMPORT, any other source requires POSSESSION; transport_permit_id must reference a TRANSPORT permit of the same specimen's acquisition request."
  - priority: 28
    category: business_referential
    check: "receiving_institution.is_receiving_eligible == true"
    error_id: ERR_RECEIVER_NOT_ELIGIBLE
    http_status: 409
    applies_to: ["POST /aquarium/transfer-requests/{id}/submission", "POST /aquarium/transfer-requests/{id}/decisions"]
    description: "Boundary: welfare_audit_score exactly 70.00 IS eligible; 69.99 is not. accreditation_status NON_ACCREDITED or SUSPENDED is never eligible regardless of score."
  - priority: 29
    category: business_referential
    check: "§1.3 permit_document_requirement yields an empty missing_document_codes set"
    error_id: ERR_MISSING_DOCUMENTS
    http_status: 422
    applies_to: ["POST /aquarium/permits/{id}/submission"]
    description: "The response body still exposes the recomputed missing_document_codes for the rejected submission."
  - priority: 30
    category: business_referential
    check: "§1.3 transfer_condition_requirement is fully satisfied by welfare_conditions"
    error_id: ERR_TRANSFER_CONDITIONS_INCOMPLETE
    http_status: 422
    applies_to: ["POST /aquarium/transfer-requests/{id}/submission"]
    description: "On a COUNTERED resubmission, every counter_conditions code is additionally required."

  # ---- business_temporal --------------------------------------------------
  - priority: 31
    category: business_temporal
    check: "client-supplied event instants are not in the future relative to clock_now"
    error_id: ERR_TIMESTAMP_IN_FUTURE
    http_status: 422
    applies_to: ["POST /aquarium/life-support-systems/{id}/water-quality-readings", "POST /aquarium/life-support-systems/{id}/redundancy-tests", "POST /aquarium/specimens", "POST /aquarium/specimens/{id}/husbandry-logs", "POST /aquarium/specimens/{id}/mortality", "POST /aquarium/veterinary-cases"]
    description: "Inclusive boundary: an instant exactly equal to clock_now is accepted."
  - priority: 32
    category: business_temporal
    check: "starts_at > clock_now at session creation"
    error_id: ERR_SESSION_IN_PAST
    http_status: 422
    applies_to: ["POST /aquarium/interaction-sessions"]
    description: "PRIORITY PAIR C (high side): a session created in the past with guest_count above max_guests returns ERR_SESSION_IN_PAST, not ERR_GUEST_CAPACITY_EXCEEDED (priority 38). Strict: starts_at exactly equal to clock_now is rejected."
  - priority: 33
    category: business_temporal
    check: "interval upper bound strictly greater than the lower bound"
    error_id: ERR_INTERVAL_INVALID
    http_status: 422
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/permits/{id}/decisions"]
    description: "ends_at > starts_at for sessions; valid_until > valid_from for a permit ISSUE decision."
  - priority: 34
    category: business_temporal
    check: "no §1.3 session_buffer_conflict against another SCHEDULED, ACTIVE or SUSPENDED session on the same exhibit"
    error_id: ERR_SESSION_BUFFER_CONFLICT
    http_status: 409
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
    description: "Closed intervals plus a 30-minute turnover buffer; a gap of exactly 30 minutes is accepted, adjacency is not."
  - priority: 35
    category: business_temporal
    check: "clock_now >= accreditation_audit.scheduled_for"
    error_id: ERR_AUDIT_NOT_DUE
    http_status: 409
    applies_to: ["POST /aquarium/accreditation-audits/{id}/progressions"]
    description: "Only the START action; REOPEN ignores scheduled_for."
  - priority: 36
    category: business_temporal
    check: "clock_now >= transfer_request.proposed_transfer_at"
    error_id: ERR_TRANSFER_DATE_NOT_REACHED
    http_status: 409
    applies_to: ["POST /aquarium/transfer-requests/{id}/completion"]
    description: "Inclusive boundary."
  - priority: 37
    category: business_temporal
    check: "(valid_until - valid_from) <= PERMIT_MAX_VALIDITY_DAYS (730 days)"
    error_id: ERR_PERMIT_VALIDITY_TOO_LONG
    http_status: 422
    applies_to: ["POST /aquarium/permits/{id}/decisions"]
    description: "Only the ISSUE decision; exactly 730 days is accepted."

  # ---- business_constraint ------------------------------------------------
  - priority: 38
    category: business_constraint
    check: "guest_count <= max_guests"
    error_id: ERR_GUEST_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
    description: "PRIORITY PAIR C (low side): masked by ERR_SESSION_IN_PAST at priority 32."
  - priority: 39
    category: business_constraint
    check: "the round counter would not exceed its ceiling"
    error_id: ERR_ROUND_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /aquarium/permits/{id}/submission", "POST /aquarium/transfer-requests/{id}/decisions", "POST /aquarium/quarantine-cases/{id}/reviews"]
    description: "PERMIT_MAX_ROUNDS 3 submissions, TRANSFER_MAX_COUNTERS 2 counters, QUARANTINE_MAX_EXTENSIONS 2 extensions. The ceiling itself is allowed; the next attempt fails."
  - priority: 40
    category: business_constraint
    check: "no other CollectionPlanEntry for the same (exhibit_id, species_id) is in status DRAFT or APPROVED"
    error_id: ERR_DUPLICATE_ACTIVE_PLAN_ENTRY
    http_status: 409
    applies_to: ["POST /aquarium/collection-plan-entries/{id}/status-actions"]
    description: "Guards REINSTATE. Creation is exempt because POST supersedes the previous APPROVED entry by design."
  - priority: 41
    category: business_constraint
    check: "the entity's unique code field is not already taken"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: ["POST /aquarium/life-support-systems", "POST /aquarium/exhibits", "POST /aquarium/species", "POST /aquarium/institutions", "POST /aquarium/specimens", "POST /aquarium/accreditation-audits"]
    description: "system_code, exhibit_code, scientific_name, institution_code, accession_code, audit_code."
  - priority: 42
    category: business_constraint
    check: "justification is present when the plan entry's sustainability_requirement is ANY_WITH_JUSTIFICATION"
    error_id: ERR_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: ["POST /aquarium/acquisition-requests/{id}/submission"]
    description: "CONDITIONAL rule driven by the parent plan entry's configuration, not by the request's own fields."
  - priority: 43
    category: business_constraint
    check: "the species' sustainability_rating satisfies the plan entry's sustainability_requirement"
    error_id: ERR_SUSTAINABILITY_REQUIREMENT_VIOLATION
    http_status: 409
    applies_to: ["POST /aquarium/acquisition-requests", "POST /aquarium/acquisition-requests/{id}/submission"]
    description: "GREEN_ONLY admits GREEN; GREEN_OR_YELLOW admits GREEN and YELLOW; ANY_WITH_JUSTIFICATION admits all three but pairs with priority 42."

  # ---- business_fiscal (quota / capacity ledgers) -------------------------
  - priority: 44
    category: business_fiscal
    check: "specimens of this species already ON_EXHIBIT or TRANSFER_PENDING in the exhibit < the plan entry's planned_count"
    error_id: ERR_PLANNED_COUNT_EXCEEDED
    http_status: 409
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
    description: "AGGREGATE rule: each placement is individually legal, the collection exceeds the plan."
  - priority: 45
    category: business_fiscal
    check: "exhibit.occupied_bioload_units + specimen.bioload_units <= exhibit.bioload_capacity_units"
    error_id: ERR_BIOLOAD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
    description: "PRIORITY PAIR A (low side): masked by ERR_INVALID_STATE at priority 10. Boundary: landing exactly ON capacity is allowed and may itself flip the posture to RESTRICTED when utilisation exceeds 95.00."
  - priority: 46
    category: business_fiscal
    check: "species.wild_take_quota_reserved + requested_count <= species.wild_take_quota_annual"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 409
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance"]
    description: "Only for source_type WILD_COLLECTION. The reservation is released again by cancellation, plan suspension and permit expiry, so the pool must reconcile exactly."
  - priority: 47
    category: business_fiscal
    check: "the FINAL sustainability_score >= MIN_CLEARANCE_SCORE (40.00)"
    error_id: ERR_CLEARANCE_SCORE_TOO_LOW
    http_status: 409
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance"]
    description: "CASCADING validation: the FINAL variant must be computed before this rule can be evaluated, and the score is NOT persisted when the rule fails."
  - priority: 48
    category: business_fiscal
    check: "acquisition_request.fulfilled_count < acquisition_request.requested_count"
    error_id: ERR_REQUESTED_COUNT_EXCEEDED
    http_status: 409
    applies_to: ["POST /aquarium/specimens"]
    description: "A FULFILLED request accepts no further specimens."

# =============================================================================
# §1.5 API Endpoints
# `input:` lists request-body / query fields; a trailing `?` marks optional.
# All reads and writes are immediately consistent: a write response already
# reflects every cascade it triggered.
# =============================================================================
logical_clock:
  endpoint: "POST /_clock/set_current_utc"
  default_current_utc: "2026-08-01T00:00:00Z"
  description: |
    The system clock is a settable logical clock. Before any call sets it, the
    current UTC instant is exactly 2026-08-01T00:00:00Z. Setting it forward
    runs the time-driven cascades (permit expiry -> acquisition rejection ->
    quota release, and redundancy_overdue -> posture recomputation) in that
    order. Setting it backwards is rejected with ERR_VALIDATION.

endpoints:

  # ---- logical clock (test-driving, priority-3 last resort) ---------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical UTC clock. Runs permit-expiry and redundancy-overdue cascades."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer, PartnerInstitutionLiaison]
    input: [current_utc]
    output: "{ current_utc: datetime, expired_permit_ids: string[], rejected_acquisition_request_ids: string[], recomputed_exhibit_ids: string[] }"
    success_code: 200
    side_effects:
      - "CASCADE D links 1-3 for every ISSUED Permit whose valid_until <= current_utc"
      - "recomputes redundancy_overdue on every LifeSupportSystem, then §1.3 exhibit_posture on every Exhibit"

  # ---- LifeSupportSystem --------------------------------------------------
  - method: POST
    path: /aquarium/life-support-systems
    description: "Register a life support plant."
    roles: [ComplianceDirector]
    input: [system_code, system_type, design_habitat, redundancy_class, "redundancy_test_interval_days?"]
    output: LifeSupportSystem
    success_code: 201
    side_effects: ["alarm_state NORMAL, water_quality_index 100.00, redundancy_overdue false"]
  - method: GET
    path: /aquarium/life-support-systems
    description: "List plants."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["alarm_state?", "design_habitat?", "limit?", "offset?"]
    output: "LifeSupportSystem[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/life-support-systems/{id}
    description: "Read one plant."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: LifeSupportSystem
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/life-support-systems/{id}/water-quality-readings
    description: "Append an immutable water-quality reading; drives the alarm state machine."
    roles: [AquaristTechnician]
    input: [taken_at, temperature_c, salinity_ppt, ph, dissolved_oxygen_mg_l, ammonia_mg_l, nitrite_mg_l]
    output: WaterQualityReading
    success_code: 201
    side_effects:
      - "computes §1.3 water_quality_index -> water_quality_index_snapshot, severity, breach_parameters"
      - "advances §1.2 LifeSupportSystem.alarm_state and runs CASCADE A when the result is CRITICAL"
  - method: GET
    path: /aquarium/life-support-systems/{id}/water-quality-readings
    description: "List a plant's readings, newest first."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["severity?", "limit?", "offset?"]
    output: "WaterQualityReading[]"
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/life-support-systems/{id}/redundancy-tests
    description: "Record a redundancy test; FAIL takes the plant OFFLINE, PASS returns it to the band implied by its latest reading."
    roles: [AquaristTechnician]
    input: [performed_at, result, "note?"]
    output: LifeSupportSystem
    success_code: 201
    side_effects:
      - "sets last_redundancy_test_result; sets last_redundancy_test_at only on PASS; recomputes redundancy_overdue"
      - "advances §1.2 LifeSupportSystem.alarm_state and recomputes §1.3 exhibit_posture on every served exhibit"
  - method: GET
    path: /aquarium/life-support-systems/{id}/exhibits
    description: "List the exhibits served by a plant."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["posture?", "limit?", "offset?"]
    output: "Exhibit[]"
    success_code: 200
    side_effects: []

  # ---- Exhibit ------------------------------------------------------------
  - method: POST
    path: /aquarium/exhibits
    description: "Create an exhibit on a plant."
    roles: [CuratorOfCollections]
    input: [exhibit_code, name, habitat_type, life_support_system_id, display_volume_liters, bioload_capacity_units, "interaction_program_enabled?"]
    output: Exhibit
    success_code: 201
    side_effects: ["posture derived immediately from the serving plant per §1.3 exhibit_posture"]
  - method: GET
    path: /aquarium/exhibits
    description: "List exhibits."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["life_support_system_id?", "posture?", "limit?", "offset?"]
    output: "Exhibit[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/exhibits/{id}
    description: "Read one exhibit including its bioload ledger and posture."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: Exhibit
    success_code: 200
    side_effects: []
  - method: PATCH
    path: /aquarium/exhibits/{id}
    description: "Re-capacitate an exhibit or re-enable its interaction programme (OCC-guarded)."
    roles: [ComplianceDirector]
    input: [expected_exhibit_version, "bioload_capacity_units?", "interaction_program_enabled?", "name?", "life_support_system_id?"]
    output: Exhibit
    success_code: 200
    side_effects:
      - "recomputes §1.3 exhibit_bioload_ledger and §1.3 exhibit_posture"
      - "resets suspended_session_count to 0 when interaction_program_enabled flips from false to true"
      - "increments Exhibit.version by 1"
  - method: GET
    path: /aquarium/exhibits/{id}/interaction-sessions
    description: "List the public-interaction sessions booked on an exhibit."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["status?", "program_type?", "limit?", "offset?"]
    output: "InteractionSession[]"
    success_code: 200
    side_effects: []

  # ---- Species ------------------------------------------------------------
  - method: POST
    path: /aquarium/species
    description: "Register a species with its sourcing, quota and quarantine parameters."
    roles: [CuratorOfCollections]
    input: [scientific_name, common_name, taxon_group, protection_status, sustainability_rating, bioload_units_per_specimen, base_quarantine_days, "wild_take_quota_annual?"]
    output: Species
    success_code: 201
    side_effects: ["derives permit_required per §1.3 derived_flag_reconciliation"]
  - method: GET
    path: /aquarium/species
    description: "List species."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["taxon_group?", "protection_status?", "sustainability_rating?", "limit?", "offset?"]
    output: "Species[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/species/{id}
    description: "Read one species including its live wild-take quota reservation."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: Species
    success_code: 200
    side_effects: []

  # ---- Institution --------------------------------------------------------
  - method: POST
    path: /aquarium/institutions
    description: "Register a peer institution as a source and/or receiver."
    roles: [ComplianceDirector]
    input: [name, institution_code, accreditation_status, welfare_audit_score, "last_audit_at?"]
    output: Institution
    success_code: 201
    side_effects: ["derives is_receiving_eligible per §1.3 derived_flag_reconciliation"]
  - method: GET
    path: /aquarium/institutions
    description: "List institutions."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer, PartnerInstitutionLiaison]
    input: ["accreditation_status?", "is_receiving_eligible?", "limit?", "offset?"]
    output: "Institution[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/institutions/{id}
    description: "Read one institution."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer, PartnerInstitutionLiaison]
    input: []
    output: Institution
    success_code: 200
    side_effects: []
  - method: PATCH
    path: /aquarium/institutions/{id}
    description: "Update an institution's accreditation or welfare audit result; may make it ineligible and unwind its inbound transfers."
    roles: [ComplianceDirector]
    input: ["accreditation_status?", "welfare_audit_score?", "last_audit_at?"]
    output: Institution
    success_code: 200
    side_effects:
      - "recomputes is_receiving_eligible"
      - "CASCADE C links 1-3 when eligibility flips to false: inbound TransferRequest rows in {SUBMITTED, COUNTERED, APPROVED} move to DECLINED with decline_reason RECEIVER_INELIGIBLE and each specimen's disposition is restored from pre_transfer_disposition"
      - "increments Institution.version by 1"

  # ---- CollectionPlanEntry ------------------------------------------------
  - method: POST
    path: /aquarium/collection-plan-entries
    description: "Add a species line to an exhibit's collection plan; supersedes the exhibit's existing APPROVED line for the same species (OCC-guarded on the exhibit)."
    roles: [CuratorOfCollections]
    input: [exhibit_id, species_id, planned_count, sustainability_requirement, expected_exhibit_version]
    output: CollectionPlanEntry
    success_code: 201
    side_effects:
      - "retires the previous APPROVED entry for the same (exhibit_id, species_id) and sets its superseded_by_entry_id"
      - "increments Exhibit.version by 1"
  - method: GET
    path: /aquarium/collection-plan-entries
    description: "List plan entries."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["exhibit_id?", "species_id?", "superseded_by_entry_id?", "status?", "limit?", "offset?"]
    output: "CollectionPlanEntry[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/collection-plan-entries/{id}
    description: "Read one plan entry."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: CollectionPlanEntry
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/collection-plan-entries/{id}/status-actions
    description: "APPROVE / SUSPEND / REINSTATE / RETIRE a plan entry."
    roles: [ComplianceDirector]
    input: [action, "reason?"]
    output: CollectionPlanEntry
    success_code: 200
    side_effects:
      - "APPROVE stamps approved_by_user_id (the segregation-of-duties anchor for clearance)"
      - "SUSPEND cancels the entry's live AcquisitionRequest rows, releases their wild-take quota and revokes their permits"

  # ---- AcquisitionRequest -------------------------------------------------
  - method: POST
    path: /aquarium/acquisition-requests
    description: "Open an acquisition request against an approved plan line."
    roles: [CuratorOfCollections]
    input: [collection_plan_entry_id, source_type, requested_count, "source_institution_id?", "justification?"]
    output: AcquisitionRequest
    success_code: 201
    side_effects:
      - "stamps the PROVISIONAL variant of §1.3 sustainability_score"
      - "derives permit_required per §1.3 derived_flag_reconciliation"
  - method: GET
    path: /aquarium/acquisition-requests
    description: "List acquisition requests."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["collection_plan_entry_id?", "source_institution_id?", "status?", "source_type?", "limit?", "offset?"]
    output: "AcquisitionRequest[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/acquisition-requests/{id}
    description: "Read one acquisition request including its score and variant."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: AcquisitionRequest
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/acquisition-requests/{id}/submission
    description: "Submit the request; forks on permit_required into PENDING_PERMIT or READY_FOR_CLEARANCE."
    roles: [CuratorOfCollections]
    input: ["justification?"]
    output: AcquisitionRequest
    success_code: 200
    side_effects: ["sets permit_deadline_at only on the PENDING_PERMIT branch"]
  - method: POST
    path: /aquarium/acquisition-requests/{id}/clearance
    description: "Clear the request for acquisition (OCC-guarded on the species quota pool); recomputes the FINAL score and reserves wild-take quota."
    roles: [ComplianceDirector]
    input: [expected_species_version, "note?"]
    output: AcquisitionRequest
    success_code: 200
    side_effects:
      - "recomputes §1.3 sustainability_score with the FINAL variant and compares it to MIN_CLEARANCE_SCORE"
      - "reserves quota_units_reserved on the Species for WILD_COLLECTION and increments Species.version by 1"
  - method: POST
    path: /aquarium/acquisition-requests/{id}/cancellation
    description: "Cancel the request and compensate its quota reservation and permits."
    roles: [CuratorOfCollections]
    input: ["reason?"]
    output: AcquisitionRequest
    success_code: 200
    side_effects: ["releases quota_units_reserved to Species.wild_take_quota_reserved", "revokes the request's non-terminal permits"]
  - method: GET
    path: /aquarium/acquisition-requests/{id}/permits
    description: "List the permits filed for a request."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["status?", "permit_type?", "limit?", "offset?"]
    output: "Permit[]"
    success_code: 200
    side_effects: []

  # ---- Permit -------------------------------------------------------------
  - method: POST
    path: /aquarium/permits
    description: "Draft a permit application for an acquisition request."
    roles: [PermitOfficer]
    input: [acquisition_request_id, permit_type, authority_reference, document_codes]
    output: Permit
    success_code: 201
    side_effects: ["computes missing_document_codes per §1.3 permit_document_requirement without blocking the draft"]
  - method: GET
    path: /aquarium/permits/{id}
    description: "Read one permit."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: Permit
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/permits/{id}/submission
    description: "Submit or resubmit the permit to the authority; bounded by PERMIT_MAX_ROUNDS."
    roles: [PermitOfficer]
    input: ["document_codes?"]
    output: Permit
    success_code: 200
    side_effects: ["replaces document_codes when supplied", "increments submission_round", "clears missing_document_codes and decision_reason"]
  - method: POST
    path: /aquarium/permits/{id}/decisions
    description: "ISSUE / DENY / REQUEST_INFO / REVOKE a submitted permit."
    roles: [ComplianceDirector]
    input: [decision, "reason?", "valid_from?", "valid_until?"]
    output: Permit
    success_code: 200
    side_effects: ["ISSUE stores the validity window and stamps issued_at", "REVOKE declines transfer requests that ride on this permit"]

  # ---- Specimen -----------------------------------------------------------
  - method: POST
    path: /aquarium/specimens
    description: "Accession a specimen against a cleared acquisition request; opens its quarantine case."
    roles: [CuratorOfCollections]
    input: [accession_code, species_id, acquisition_request_id, arrival_at, "holding_area?", "sire_specimen_id?", "dam_specimen_id?"]
    output: Specimen
    success_code: 201
    side_effects:
      - "computes §1.3 quarantine_required_days and auto-creates the ACTIVE QuarantineCase with protocol_days and projected_release_at"
      - "snapshots bioload_units and derives captive_bred"
      - "increments the request's fulfilled_count and moves it to FULFILLED at requested_count"
  - method: GET
    path: /aquarium/specimens
    description: "List specimens across both state dimensions."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["species_id?", "acquisition_request_id?", "exhibit_id?", "sire_specimen_id?", "dam_specimen_id?", "disposition_status?", "health_status?", "limit?", "offset?"]
    output: "Specimen[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/specimens/{id}
    description: "Read one specimen including welfare_score and its variant."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: Specimen
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/specimens/{id}/exhibit-placements
    description: "Place a cleared specimen on an exhibit (OCC-guarded on the exhibit)."
    roles: [AquaristTechnician]
    input: [exhibit_id, expected_exhibit_version, "restricted_posture_override?"]
    output: Specimen
    success_code: 200
    side_effects:
      - "recomputes §1.3 exhibit_bioload_ledger and §1.3 exhibit_posture"
      - "increments Specimen.version and Exhibit.version by 1"
  - method: POST
    path: /aquarium/specimens/{id}/exhibit-removals
    description: "Remove a specimen from its exhibit into holding (compensates the placement ledger)."
    roles: [AquaristTechnician]
    input: [expected_exhibit_version, "holding_area?"]
    output: Specimen
    success_code: 200
    side_effects: ["restores the exhibit's occupied_bioload_units and bioload_utilization_pct exactly", "recomputes §1.3 exhibit_posture"]
  - method: POST
    path: /aquarium/specimens/{id}/mortality
    description: "Declare a mortality; opens the necropsy investigation and runs CASCADE B."
    roles: [VeterinaryOfficer]
    input: [occurred_at, "cause_note?"]
    output: Specimen
    success_code: 200
    side_effects:
      - "CASCADE B links 1-5: necropsy case, exhibit ledger, plan-entry suspension, acquisition cancellation with quota release, permit revocation"
      - "fails the specimen's ACTIVE or EXTENDED QuarantineCase with failure_reason MORTALITY"
      - "withdraws the specimen's live TransferRequest rows"
  - method: POST
    path: /aquarium/specimens/{id}/husbandry-logs
    description: "Append an immutable husbandry record (feeding, behaviour, treatment note or weight)."
    roles: [AquaristTechnician, VeterinaryOfficer]
    input: [log_type, logged_at, "appetite_score?", "behavior_code?", "feed_grams?", "weight_grams?", "note?"]
    output: HusbandryLog
    success_code: 201
    side_effects: ["recomputes Specimen.welfare_score with the ROLLING variant and sets welfare_score_variant = ROLLING"]
  - method: GET
    path: /aquarium/specimens/{id}/husbandry-logs
    description: "List a specimen's husbandry records, newest first."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["log_type?", "limit?", "offset?"]
    output: "HusbandryLog[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/specimens/{id}/quarantine-cases
    description: "List a specimen's quarantine cases."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["status?", "limit?", "offset?"]
    output: "QuarantineCase[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/specimens/{id}/veterinary-cases
    description: "List a specimen's veterinary cases."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["status?", "case_type?", "limit?", "offset?"]
    output: "VeterinaryCase[]"
    success_code: 200
    side_effects: []

  # ---- QuarantineCase -----------------------------------------------------
  - method: GET
    path: /aquarium/quarantine-cases/{id}
    description: "Read one quarantine case."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: QuarantineCase
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/quarantine-cases/{id}/reviews
    description: "Record a quarantine review: EXTEND / RESUME / CLEAR / FAIL."
    roles: [VeterinaryOfficer]
    input: [outcome, "extension_days?", "reason?"]
    output: QuarantineCase
    success_code: 200
    side_effects:
      - "EXTEND recomputes projected_release_at from protocol_days + total_extension_days"
      - "CLEAR moves the specimen's disposition_status from QUARANTINE to CLEARED"

  # ---- VeterinaryCase -----------------------------------------------------
  - method: POST
    path: /aquarium/veterinary-cases
    description: "Open a preventive exam, a treatment or a necropsy investigation."
    roles: [VeterinaryOfficer]
    input: [specimen_id, case_type, opened_at, "treatment_start_at?", "withdrawal_days?", "diagnosis_code?"]
    output: VeterinaryCase
    success_code: 201
    side_effects:
      - "TREATMENT moves health_status to UNDER_TREATMENT and recomputes treatment_withdrawal_until per §1.3 treatment_withdrawal_window"
      - "recomputes Specimen.welfare_score with the ROLLING variant (open-treatment penalty)"
  - method: GET
    path: /aquarium/veterinary-cases/{id}
    description: "Read one veterinary case."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: VeterinaryCase
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/veterinary-cases/{id}/closure
    description: "Close a case with an outcome and findings severity; branches the specimen's clinical dimension."
    roles: [VeterinaryOfficer]
    input: [outcome, findings_severity, "note?"]
    output: VeterinaryCase
    success_code: 200
    side_effects:
      - "RESOLVED / CHRONIC_MANAGED recompute the ROLLING welfare_score"
      - "MORTALITY_REFERRED escalates health_status to CRITICAL_CARE and runs the CRITICAL_CARE COUPLING links 1-4"
      - "NECROPSY_FINALIZED closes the clinical dimension at NECROPSY_COMPLETE and enforces segregation of duties"
      - "PREVENTIVE_EXAM with findings_severity NONE increments the ACTIVE quarantine case's clearance_exam_count"

  # ---- TransferRequest ----------------------------------------------------
  - method: POST
    path: /aquarium/transfer-requests
    description: "Draft an outbound transfer of a specimen to a receiving institution."
    roles: [PermitOfficer]
    input: [specimen_id, receiving_institution_id, proposed_transfer_at, welfare_conditions, "transport_permit_id?"]
    output: TransferRequest
    success_code: 201
    side_effects: []
  - method: GET
    path: /aquarium/transfer-requests
    description: "List transfer requests; a PartnerInstitutionLiaison sees only its own institution's inbound rows."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer, PartnerInstitutionLiaison]
    input: ["specimen_id?", "receiving_institution_id?", "transport_permit_id?", "status?", "limit?", "offset?"]
    output: "TransferRequest[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/transfer-requests/{id}
    description: "Read one transfer request."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer, PartnerInstitutionLiaison]
    input: []
    output: TransferRequest
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/transfer-requests/{id}/submission
    description: "Submit or resubmit the transfer to the receiving institution."
    roles: [PermitOfficer]
    input: ["welfare_conditions?"]
    output: TransferRequest
    success_code: 200
    side_effects: ["moves the specimen to TRANSFER_PENDING and records pre_transfer_disposition on the first submission"]
  - method: POST
    path: /aquarium/transfer-requests/{id}/decisions
    description: "APPROVE (director) / COUNTER or DECLINE (receiving institution liaison)."
    roles: [ComplianceDirector, PartnerInstitutionLiaison]
    input: [decision, "counter_conditions?", "reason?"]
    output: TransferRequest
    success_code: 200
    side_effects: ["COUNTER increments negotiation_round and stores counter_conditions", "DECLINE compensates the specimen's disposition from pre_transfer_disposition"]
  - method: POST
    path: /aquarium/transfer-requests/{id}/completion
    description: "Complete an approved transfer on or after the proposed date."
    roles: [PermitOfficer]
    input: []
    output: TransferRequest
    success_code: 200
    side_effects: ["moves the specimen to the terminal TRANSFERRED disposition and recomputes the former exhibit's ledger and posture"]

  # ---- InteractionSession -------------------------------------------------
  - method: POST
    path: /aquarium/interaction-sessions
    description: "Book a public interaction session on an exhibit."
    roles: [AquaristTechnician]
    input: [exhibit_id, program_type, starts_at, ends_at, max_guests, "guest_count?", "safety_briefing_confirmed?"]
    output: InteractionSession
    success_code: 201
    side_effects: ["enforces §1.3 session_buffer_conflict against the exhibit's live sessions"]
  - method: GET
    path: /aquarium/interaction-sessions/{id}
    description: "Read one session."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: InteractionSession
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/interaction-sessions/{id}/transitions
    description: "ACTIVATE / COMPLETE / CANCEL (aquarist) or SUSPEND / REINSTATE (director)."
    roles: [AquaristTechnician, ComplianceDirector]
    input: [action, "reason?"]
    output: InteractionSession
    success_code: 200
    side_effects: ["SUSPEND increments Exhibit.suspended_session_count and can disable the exhibit's interaction programme", "REINSTATE re-checks posture, the programme flag and the turnover buffer"]

  # ---- AccreditationAudit -------------------------------------------------
  - method: POST
    path: /aquarium/accreditation-audits
    description: "Schedule an accreditation inspection."
    roles: [ComplianceDirector]
    input: [audit_code, scope, scheduled_for]
    output: AccreditationAudit
    success_code: 201
    side_effects: []
  - method: GET
    path: /aquarium/accreditation-audits
    description: "List audits."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: ["status?", "scope?", "limit?", "offset?"]
    output: "AccreditationAudit[]"
    success_code: 200
    side_effects: []
  - method: GET
    path: /aquarium/accreditation-audits/{id}
    description: "Read one audit including domain_subscores and readiness_score."
    roles: [CuratorOfCollections, ComplianceDirector, VeterinaryOfficer, AquaristTechnician, PermitOfficer]
    input: []
    output: AccreditationAudit
    success_code: 200
    side_effects: []
  - method: POST
    path: /aquarium/accreditation-audits/{id}/progressions
    description: "START / CLOSE / REOPEN / CANCEL an audit."
    roles: [ComplianceDirector]
    input: [action, "determination_note?"]
    output: AccreditationAudit
    success_code: 200
    side_effects:
      - "START and REOPEN re-score every in-scope specimen with the AUDIT_SNAPSHOT welfare variant, then compute §1.3 readiness_score from the rounded subscores"
      - "CLOSE derives the determination (PASSED / CONDITIONAL / FAILED) and enforces segregation of duties against opened_by_user_id"

# =============================================================================
# §1.6 Error Code Catalog — every code below is reachable from §1.4 and is
# exercised by at least one §1.8 or §1.9 instance.
# =============================================================================
errors:
  - id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    condition: "X-User-ID header absent or empty"
    applies_to: [all]
  - id: ERR_INVALID_ROLE
    http_status: 401
    condition: "X-User-Role absent or not one of the six §1.7 roles"
    applies_to: [all]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "role not permitted for the endpoint or for the requested action value"
    applies_to: [all]
  - id: ERR_INSTITUTION_SCOPE_VIOLATION
    http_status: 403
    condition: "PartnerInstitutionLiaison acting on a TransferRequest of another institution"
    applies_to: ["POST /aquarium/transfer-requests/{id}/decisions", "GET /aquarium/transfer-requests/{id}"]
  - id: ERR_LIFE_SUPPORT_SYSTEM_NOT_FOUND
    http_status: 404
    condition: "unknown LifeSupportSystem id in path or body"
    applies_to: ["GET /aquarium/life-support-systems/{id}", "POST /aquarium/life-support-systems/{id}/water-quality-readings", "POST /aquarium/life-support-systems/{id}/redundancy-tests", "GET /aquarium/life-support-systems/{id}/exhibits", "POST /aquarium/exhibits", "PATCH /aquarium/exhibits/{id}"]
  - id: ERR_EXHIBIT_NOT_FOUND
    http_status: 404
    condition: "unknown Exhibit id in path or body"
    applies_to: ["GET /aquarium/exhibits/{id}", "PATCH /aquarium/exhibits/{id}", "GET /aquarium/exhibits/{id}/interaction-sessions", "POST /aquarium/collection-plan-entries", "POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/interaction-sessions"]
  - id: ERR_SPECIES_NOT_FOUND
    http_status: 404
    condition: "unknown Species id in path or body"
    applies_to: ["GET /aquarium/species/{id}", "POST /aquarium/collection-plan-entries", "POST /aquarium/specimens"]
  - id: ERR_INSTITUTION_NOT_FOUND
    http_status: 404
    condition: "unknown Institution id in path or body"
    applies_to: ["GET /aquarium/institutions/{id}", "PATCH /aquarium/institutions/{id}", "POST /aquarium/acquisition-requests", "POST /aquarium/transfer-requests"]
  - id: ERR_COLLECTION_PLAN_ENTRY_NOT_FOUND
    http_status: 404
    condition: "unknown CollectionPlanEntry id in path or body"
    applies_to: ["GET /aquarium/collection-plan-entries/{id}", "POST /aquarium/collection-plan-entries/{id}/status-actions", "POST /aquarium/acquisition-requests"]
  - id: ERR_ACQUISITION_REQUEST_NOT_FOUND
    http_status: 404
    condition: "unknown AcquisitionRequest id in path or body"
    applies_to: ["GET /aquarium/acquisition-requests/{id}", "POST /aquarium/acquisition-requests/{id}/submission", "POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/acquisition-requests/{id}/cancellation", "GET /aquarium/acquisition-requests/{id}/permits", "POST /aquarium/permits", "POST /aquarium/specimens"]
  - id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    condition: "unknown Permit id in path or body"
    applies_to: ["GET /aquarium/permits/{id}", "POST /aquarium/permits/{id}/submission", "POST /aquarium/permits/{id}/decisions", "POST /aquarium/transfer-requests"]
  - id: ERR_SPECIMEN_NOT_FOUND
    http_status: 404
    condition: "unknown Specimen id in path or body"
    applies_to: ["GET /aquarium/specimens/{id}", "POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/specimens/{id}/exhibit-removals", "POST /aquarium/specimens/{id}/mortality", "POST /aquarium/specimens/{id}/husbandry-logs", "GET /aquarium/specimens/{id}/husbandry-logs", "GET /aquarium/specimens/{id}/quarantine-cases", "GET /aquarium/specimens/{id}/veterinary-cases", "POST /aquarium/veterinary-cases", "POST /aquarium/transfer-requests", "POST /aquarium/specimens"]
  - id: ERR_QUARANTINE_CASE_NOT_FOUND
    http_status: 404
    condition: "unknown QuarantineCase id"
    applies_to: ["GET /aquarium/quarantine-cases/{id}", "POST /aquarium/quarantine-cases/{id}/reviews"]
  - id: ERR_VETERINARY_CASE_NOT_FOUND
    http_status: 404
    condition: "unknown VeterinaryCase id"
    applies_to: ["GET /aquarium/veterinary-cases/{id}", "POST /aquarium/veterinary-cases/{id}/closure"]
  - id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http_status: 404
    condition: "unknown TransferRequest id"
    applies_to: ["GET /aquarium/transfer-requests/{id}", "POST /aquarium/transfer-requests/{id}/submission", "POST /aquarium/transfer-requests/{id}/decisions", "POST /aquarium/transfer-requests/{id}/completion"]
  - id: ERR_INTERACTION_SESSION_NOT_FOUND
    http_status: 404
    condition: "unknown InteractionSession id"
    applies_to: ["GET /aquarium/interaction-sessions/{id}", "POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_ACCREDITATION_AUDIT_NOT_FOUND
    http_status: 404
    condition: "unknown AccreditationAudit id"
    applies_to: ["GET /aquarium/accreditation-audits/{id}", "POST /aquarium/accreditation-audits/{id}/progressions"]
  - id: ERR_VALIDATION
    http_status: 422
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, or a clock move backwards"
    applies_to: [all]
  - id: ERR_INVALID_PAGINATION
    http_status: 400
    condition: "limit outside [1, 100] or offset < 0"
    applies_to: ["all list endpoints"]
  - id: ERR_STALE_EXHIBIT_VERSION
    http_status: 412
    condition: "expected_exhibit_version != Exhibit.version"
    applies_to: ["POST /aquarium/collection-plan-entries", "PATCH /aquarium/exhibits/{id}", "POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/specimens/{id}/exhibit-removals"]
  - id: ERR_STALE_SPECIES_VERSION
    http_status: 412
    condition: "expected_species_version != Species.version"
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance"]
  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "the requested transition is not declared from the entity's current non-terminal state"
    applies_to: ["all action endpoints"]
  - id: ERR_ENTITY_TERMINAL
    http_status: 409
    condition: "the entity is already in a terminal state"
    applies_to: ["all action endpoints"]
  - id: ERR_INVALID_ACTION
    http_status: 422
    condition: "the action / outcome / decision value is not legal from the current state"
    applies_to: ["all enum-driven action endpoints"]
  - id: ERR_SOD_VIOLATION
    http_status: 409
    condition: "the acting user already performed the paired earlier step"
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/accreditation-audits/{id}/progressions", "POST /aquarium/veterinary-cases/{id}/closure"]
  - id: ERR_SPECIMEN_NOT_HEALTHY
    http_status: 409
    condition: "specimen.health_status != HEALTHY"
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/transfer-requests/{id}/submission", "POST /aquarium/transfer-requests/{id}/completion", "POST /aquarium/quarantine-cases/{id}/reviews"]
  - id: ERR_EXHIBIT_CLOSED
    http_status: 409
    condition: "exhibit.posture == CLOSED"
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements", "POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_RESTRICTED_POSTURE_OVERRIDE_REQUIRED
    http_status: 409
    condition: "exhibit.posture == RESTRICTED and restricted_posture_override is not true"
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
  - id: ERR_LIFE_SUPPORT_ALARM
    http_status: 409
    condition: "the serving plant's alarm_state != NORMAL on ACTIVATE"
    applies_to: ["POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_INTERACTION_PROGRAM_DISABLED
    http_status: 409
    condition: "exhibit.interaction_program_enabled == false"
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_SAFETY_BRIEFING_REQUIRED
    http_status: 422
    condition: "ACTIVATE while safety_briefing_confirmed == false"
    applies_to: ["POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_DIVE_ENCOUNTER_BLOCKED
    http_status: 409
    condition: "DIVE_ENCOUNTER activation while a specimen on the exhibit is in CRITICAL_CARE or DECEASED_PENDING_NECROPSY"
    applies_to: ["POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_QUARANTINE_NOT_COMPLETE
    http_status: 409
    condition: "CLEAR before projected_release_at"
    applies_to: ["POST /aquarium/quarantine-cases/{id}/reviews"]
  - id: ERR_CLEARANCE_EXAMS_INSUFFICIENT
    http_status: 409
    condition: "CLEAR with clearance_exam_count < 2"
    applies_to: ["POST /aquarium/quarantine-cases/{id}/reviews"]
  - id: ERR_TREATMENT_WITHDRAWAL_ACTIVE
    http_status: 409
    condition: "a new TREATMENT window overlaps an OPEN treatment's withdrawal window"
    applies_to: ["POST /aquarium/veterinary-cases"]
  - id: ERR_NO_APPROVED_PLAN_ENTRY
    http_status: 409
    condition: "no APPROVED CollectionPlanEntry for the (exhibit, species) pair"
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
  - id: ERR_HABITAT_MISMATCH
    http_status: 422
    condition: "exhibit.habitat_type != serving plant design_habitat"
    applies_to: ["POST /aquarium/exhibits", "POST /aquarium/collection-plan-entries/{id}/status-actions"]
  - id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    condition: "the required permit is missing or not in status ISSUED"
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/transfer-requests/{id}/decisions"]
  - id: ERR_PERMIT_TYPE_MISMATCH
    http_status: 422
    condition: "permit_type does not match the source type or the transport context"
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance", "POST /aquarium/transfer-requests"]
  - id: ERR_RECEIVER_NOT_ELIGIBLE
    http_status: 409
    condition: "receiving institution is_receiving_eligible == false"
    applies_to: ["POST /aquarium/transfer-requests/{id}/submission", "POST /aquarium/transfer-requests/{id}/decisions"]
  - id: ERR_MISSING_DOCUMENTS
    http_status: 422
    condition: "permit submission with a non-empty missing_document_codes set"
    applies_to: ["POST /aquarium/permits/{id}/submission"]
  - id: ERR_TRANSFER_CONDITIONS_INCOMPLETE
    http_status: 422
    condition: "transfer submission missing a required welfare condition or a countered condition"
    applies_to: ["POST /aquarium/transfer-requests/{id}/submission"]
  - id: ERR_TIMESTAMP_IN_FUTURE
    http_status: 422
    condition: "a client-supplied event instant is later than clock_now"
    applies_to: ["POST /aquarium/life-support-systems/{id}/water-quality-readings", "POST /aquarium/life-support-systems/{id}/redundancy-tests", "POST /aquarium/specimens", "POST /aquarium/specimens/{id}/husbandry-logs", "POST /aquarium/specimens/{id}/mortality", "POST /aquarium/veterinary-cases"]
  - id: ERR_SESSION_IN_PAST
    http_status: 422
    condition: "starts_at <= clock_now at session creation"
    applies_to: ["POST /aquarium/interaction-sessions"]
  - id: ERR_INTERVAL_INVALID
    http_status: 422
    condition: "ends_at <= starts_at, or valid_until <= valid_from"
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/permits/{id}/decisions"]
  - id: ERR_SESSION_BUFFER_CONFLICT
    http_status: 409
    condition: "the 30-minute turnover buffer against another live session on the exhibit is violated"
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_AUDIT_NOT_DUE
    http_status: 409
    condition: "START before scheduled_for"
    applies_to: ["POST /aquarium/accreditation-audits/{id}/progressions"]
  - id: ERR_TRANSFER_DATE_NOT_REACHED
    http_status: 409
    condition: "completion before proposed_transfer_at"
    applies_to: ["POST /aquarium/transfer-requests/{id}/completion"]
  - id: ERR_PERMIT_VALIDITY_TOO_LONG
    http_status: 422
    condition: "ISSUE with a validity window longer than 730 days"
    applies_to: ["POST /aquarium/permits/{id}/decisions"]
  - id: ERR_GUEST_CAPACITY_EXCEEDED
    http_status: 422
    condition: "guest_count > max_guests"
    applies_to: ["POST /aquarium/interaction-sessions", "POST /aquarium/interaction-sessions/{id}/transitions"]
  - id: ERR_ROUND_LIMIT_EXCEEDED
    http_status: 409
    condition: "permit submission round, transfer counter round or quarantine extension ceiling exceeded"
    applies_to: ["POST /aquarium/permits/{id}/submission", "POST /aquarium/transfer-requests/{id}/decisions", "POST /aquarium/quarantine-cases/{id}/reviews"]
  - id: ERR_DUPLICATE_ACTIVE_PLAN_ENTRY
    http_status: 409
    condition: "REINSTATE while another DRAFT or APPROVED entry exists for the (exhibit, species) pair"
    applies_to: ["POST /aquarium/collection-plan-entries/{id}/status-actions"]
  - id: ERR_DUPLICATE_CODE
    http_status: 409
    condition: "a unique code field is already taken"
    applies_to: ["POST /aquarium/life-support-systems", "POST /aquarium/exhibits", "POST /aquarium/species", "POST /aquarium/institutions", "POST /aquarium/specimens", "POST /aquarium/accreditation-audits"]
  - id: ERR_JUSTIFICATION_REQUIRED
    http_status: 422
    condition: "submission of a request beneath an ANY_WITH_JUSTIFICATION plan line without justification"
    applies_to: ["POST /aquarium/acquisition-requests/{id}/submission"]
  - id: ERR_SUSTAINABILITY_REQUIREMENT_VIOLATION
    http_status: 409
    condition: "the species rating is not admitted by the plan line's sustainability_requirement"
    applies_to: ["POST /aquarium/acquisition-requests", "POST /aquarium/acquisition-requests/{id}/submission"]
  - id: ERR_PLANNED_COUNT_EXCEEDED
    http_status: 409
    condition: "placement would exceed the plan line's planned_count for that exhibit and species"
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
  - id: ERR_BIOLOAD_CAPACITY_EXCEEDED
    http_status: 409
    condition: "occupied_bioload_units + specimen.bioload_units > bioload_capacity_units"
    applies_to: ["POST /aquarium/specimens/{id}/exhibit-placements"]
  - id: ERR_QUOTA_EXCEEDED
    http_status: 409
    condition: "wild_take_quota_reserved + requested_count > wild_take_quota_annual"
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance"]
  - id: ERR_CLEARANCE_SCORE_TOO_LOW
    http_status: 409
    condition: "the FINAL sustainability_score is below MIN_CLEARANCE_SCORE (40.00)"
    applies_to: ["POST /aquarium/acquisition-requests/{id}/clearance"]
  - id: ERR_REQUESTED_COUNT_EXCEEDED
    http_status: 409
    condition: "accessioning beyond the request's requested_count"
    applies_to: ["POST /aquarium/specimens"]

# =============================================================================
# §1.7 RBAC Permission Matrix — role_model: segregation_of_duties
# X-User-ID is an opaque string for five roles; for PartnerInstitutionLiaison it
# IS the Institution.id it speaks for.
# =============================================================================
roles:
  - name: CuratorOfCollections
    description: "Owns the collection plan and the acquisition pipeline: exhibits, species, plan lines, acquisition requests and specimen accessioning."
    identity: opaque
    exclusive_operations:
      - "POST /aquarium/exhibits"
      - "POST /aquarium/species"
      - "POST /aquarium/collection-plan-entries"
      - "POST /aquarium/acquisition-requests"
      - "POST /aquarium/acquisition-requests/{id}/submission"
      - "POST /aquarium/acquisition-requests/{id}/cancellation"
      - "POST /aquarium/specimens"
    shared_operations: ["all GET endpoints except GET /aquarium/transfer-requests scoping", "POST /_clock/set_current_utc"]
  - name: ComplianceDirector
    description: "Approves plan lines, clears acquisitions, decides permits, approves transfers, suspends and reinstates public interaction sessions, and runs accreditation audits. May never act on both sides of a segregated pair."
    identity: opaque
    exclusive_operations:
      - "POST /aquarium/life-support-systems"
      - "PATCH /aquarium/exhibits/{id}"
      - "POST /aquarium/institutions"
      - "PATCH /aquarium/institutions/{id}"
      - "POST /aquarium/collection-plan-entries/{id}/status-actions"
      - "POST /aquarium/acquisition-requests/{id}/clearance"
      - "POST /aquarium/permits/{id}/decisions"
      - "POST /aquarium/accreditation-audits"
      - "POST /aquarium/accreditation-audits/{id}/progressions"
    shared_operations:
      - "POST /aquarium/transfer-requests/{id}/decisions (APPROVE only)"
      - "POST /aquarium/interaction-sessions/{id}/transitions (SUSPEND and REINSTATE only)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: VeterinaryOfficer
    description: "Owns clinical care: quarantine reviews, veterinary cases and their closures, mortality declarations and necropsy findings."
    identity: opaque
    exclusive_operations:
      - "POST /aquarium/quarantine-cases/{id}/reviews"
      - "POST /aquarium/veterinary-cases"
      - "POST /aquarium/veterinary-cases/{id}/closure"
      - "POST /aquarium/specimens/{id}/mortality"
    shared_operations: ["POST /aquarium/specimens/{id}/husbandry-logs", "all GET endpoints", "POST /_clock/set_current_utc"]
  - name: AquaristTechnician
    description: "Owns daily operations: water-quality readings, redundancy tests, exhibit placements and removals, husbandry logs and session floor control."
    identity: opaque
    exclusive_operations:
      - "POST /aquarium/life-support-systems/{id}/water-quality-readings"
      - "POST /aquarium/life-support-systems/{id}/redundancy-tests"
      - "POST /aquarium/specimens/{id}/exhibit-placements"
      - "POST /aquarium/specimens/{id}/exhibit-removals"
      - "POST /aquarium/interaction-sessions"
    shared_operations:
      - "POST /aquarium/specimens/{id}/husbandry-logs"
      - "POST /aquarium/interaction-sessions/{id}/transitions (ACTIVATE, COMPLETE and CANCEL only)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: PermitOfficer
    description: "Prepares permit applications and drives outbound transfers, but never decides either."
    identity: opaque
    exclusive_operations:
      - "POST /aquarium/permits"
      - "POST /aquarium/permits/{id}/submission"
      - "POST /aquarium/transfer-requests"
      - "POST /aquarium/transfer-requests/{id}/submission"
      - "POST /aquarium/transfer-requests/{id}/completion"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: PartnerInstitutionLiaison
    description: "Speaks for one receiving institution. Its X-User-ID is that Institution.id, and it may only see and answer transfer requests addressed to that institution."
    identity: "entity_backed:Institution"
    exclusive_operations:
      - "POST /aquarium/transfer-requests/{id}/decisions (COUNTER and DECLINE only)"
    shared_operations:
      - "GET /aquarium/transfer-requests (scoped to its own institution)"
      - "GET /aquarium/transfer-requests/{id} (scoped)"
      - "GET /aquarium/institutions"
      - "GET /aquarium/institutions/{id}"
      - "POST /_clock/set_current_utc"
