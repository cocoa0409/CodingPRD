        claim_type: correct_result
        grounds:
          - "calculations.eligible_population_identification"
          - "entities.MeasureSpecification.fields.age_min"
          - "entities.MeasureSpecification.fields.age_max"
        distinguishing_aspect: "Age bounds are whole-year INCLUSIVE at the anchor date: a member turning exactly 50 and a member turning exactly 74 on 2025-12-31 are both eligible; a member aged 75 years + 1 day is not."
        test_recipe:
          setup:
            - "Season MY2025, spec AB (ADMIN, age 50-74, gender ANY, 12-month window anchored 2025-12-31) ACTIVE, season OPEN"
            - "M-LO born 1975-12-31 (exactly 50 at anchor), M-HI born 1951-12-31 (exactly 74), M-OUT born 1950-12-30 (75 years + 1 day); all enrolled all 2025"
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "AB", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 50, age_max: 74, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M-LO", birth_date: "1975-12-31T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { mlo: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M-HI", birth_date: "1951-12-31T00:00:00Z", gender: "M" }, as: QualityAdmin, captures: { mhi: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M-OUT", birth_date: "1950-12-30T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { mout: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${mlo}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${mhi}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${mout}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst, captures: { den: $.data.denominator_count } }
            - { call: "GET /hedis/measure-runs/${run_id}/population-entries", as: QualityAnalyst, captures: { e0: "$.data[0].member_ref", e1: "$.data[1].member_ref" } }
          assert:
            - "den == 2 — exactly-50 and exactly-74 are both inside the inclusive bounds"
            - "e0 == 'M-HI' and e1 == 'M-LO' (member_ref ASC mint order); M-OUT is absent"

      - name: eligibility_gap_allowance_rules
        claim_type: input_set_filtering
        grounds:
          - "calculations.eligible_population_identification"
          - "entities.MeasureSpecification.fields.allowable_gap_days"
        distinguishing_aspect: "Continuous enrollment tolerates AT MOST ONE gap of <= 45 days inside the window: member A (one 45-day gap) is eligible; member B (one 46-day gap) and member C (two 10-day gaps) are not — denominator exactly 1."
        test_recipe:
          setup:
