scenario: "State Immunization Information System (IIS): childhood schedule, catch-up rules (CDC Catch-up), school enrollment proof, allergy record, lot recall, provider reporting, VAERS adverse events"
domain_name: immunization-information-system
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# ===========================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ===========================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation. OCC target for certificate issuance."
      - name: full_name
        type: string
        source: input
        description: "Child's legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date YYYY-MM-DD; drives age-based schedule computation. Immutable after creation."
        constraints: "Must be a calendar date on or before the current clock date."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of residence; selects the applicable school mandate antigen set."
        constraints: "Two uppercase letters."
      - name: schedule_status
        type: enum
        source: computed
        description: "Latest evaluated schedule posture, copied from the most recent ScheduleEvaluation.overall_status; UP_TO_DATE on a patient with no evaluation yet."
        default: UP_TO_DATE
        constraints: "One of {UP_TO_DATE, BEHIND, CONDITIONAL, NON_COMPLIANT}."
      - name: active_certificate_id
        type: string
        source: computed
        description: "Convenience pointer to the single non-superseded, non-revoked SchoolComplianceCertificate.id for this patient, or null; the patient's certificates are discovered via GET /patients/{id}/certificates. Not a child FK."
        default: null

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: name
        type: string
        source: input
        description: "Clinic or practitioner name."
      - name: vfc_pin
        type: string
        source: input
        description: "Vaccines-for-Children provider PIN; unique across providers."
        constraints: "Non-empty; unique."
      - name: authorized_product_codes
        type: array
        source: input
        description: "List of VaccineProduct.product_code values this provider is authorized to administer. A dose of a product not in this list is rejected at recording time."
        default: []
      - name: status
        type: enum
        source: input
        description: "Provider enrollment posture."
        default: ENROLLED
        constraints: "One of {ENROLLED, SUSPENDED}."

  - name: VaccineProduct
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: product_code
        type: string
        source: input
        description: "Stable code, e.g. DTAP, MMR, IPV, HEPB, VAR; unique."
        constraints: "Non-empty; unique."
      - name: antigen
        type: string
        source: input
        description: "Antigen family this product satisfies for school-mandate accounting, e.g. DTAP, MMR, POLIO. Multiple products may map to one antigen."
      - name: doses_in_series
        type: integer
        source: input
        description: "Number of valid doses required to complete the primary series."
        constraints: ">= 1."
      - name: min_age_days
        type: integer
        source: input
        description: "Minimum patient age in days at which dose 1 may be validly administered (the absolute minimum age, catch-up column)."
        constraints: ">= 0."
      - name: recommended_age_days
        type: integer
        source: input
        description: "Recommended age in days for dose 1 under the routine childhood schedule (>= min_age_days)."
        constraints: ">= min_age_days."
      - name: min_interval_days
        type: integer
        source: input
        description: "Minimum number of days that must elapse between two consecutive valid doses of this series (catch-up minimum interval)."
        constraints: ">= 0."
      - name: grace_period_days
        type: integer
        source: input
        description: "4-day grace window applied to BOTH min_age_days and min_interval_days under the CDC 4-day grace rule; a dose administered up to this many days early still counts as valid."
        default: 4
        constraints: ">= 0."
      - name: status
        type: enum
        source: input
        description: "Whether this product may back new lots and recordings."
        default: ACTIVE
        constraints: "One of {ACTIVE, RETIRED}."

  - name: VaccineLot
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: product_id
        type: string
        source: input
        description: "FK -> VaccineProduct.id; the product this lot contains."
      - name: lot_number
        type: string
        source: input
        description: "Manufacturer lot number; unique within product_id."
        constraints: "Non-empty; unique per product_id."
      - name: received_date
        type: string
        source: input
        description: "ISO date the lot entered inventory; the earliest valid administration date for doses drawn from this lot."
      - name: expiration_date
        type: string
        source: input
        description: "ISO date of lot expiry; the latest valid administration date. A dose whose administration date is after this is rejected as expired."
        constraints: "Must be strictly after received_date."
      - name: doses_total
        type: integer
        source: input
        description: "Total doses originally in the lot."
        constraints: ">= 1."
      - name: administered_count
        type: integer
        source: computed
        description: "Count of Immunization rows drawn from this lot whose status is in {RECORDED, AMENDED}. Reconciled on every record/invalidate/revalidate. Conserved quantity for the lot-inventory invariant."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE until a LotRecall is issued, then RECALLED; QUARANTINED when doses_total - administered_count reaches 0 is NOT used — capacity exhaustion uses AVAILABLE plus a count check."
        default: AVAILABLE
        constraints: "One of {AVAILABLE, RECALLED}."

  - name: Immunization
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits; chronological replay key for series ordering, with administered_date as the primary sort key."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the child who received the dose."
      - name: lot_id
        type: string
        source: input
        description: "FK -> VaccineLot.id; the lot the dose was drawn from."
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider that administered and reported the dose."
      - name: report_id
        type: string
        source: input
        description: "FK -> ProviderReport.id; the batch report this dose was recorded under, or null for a directly recorded dose."
        default: null
      - name: administered_date
        type: string
        source: input
        description: "ISO date the dose was given; primary sort key for series ordering and the input to interval/age validity checks."
      - name: dose_number
        type: integer
        source: computed
        description: "1-based position of this dose within the patient's valid-dose ordering for the product's antigen, assigned chronologically by administered_date then created_at. Recomputed when any sibling dose is invalidated or revalidated."
        default: 1
      - name: validity
        type: enum
        source: computed
        description: "VALID when the dose meets min-age and min-interval rules (with grace) and its lot is not recalled; INVALID_INTERVAL, INVALID_AGE, or INVALID_RECALL otherwise. Drives dose counting for compliance."
        default: VALID
        constraints: "One of {VALID, INVALID_INTERVAL, INVALID_AGE, INVALID_RECALL}."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status. RECORDED on creation; AMENDED after a correction; INVALIDATED when a lot recall strikes the dose; DELETED on retraction."
        default: RECORDED
        constraints: "One of {RECORDED, AMENDED, INVALIDATED, DELETED}."

  - name: AllergyRecord
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the child this contraindication belongs to."
      - name: antigen
        type: string
        source: input
        description: "Antigen family contraindicated for this patient; matches VaccineProduct.antigen. A new dose of any product mapping to this antigen is blocked while severity is CONTRAINDICATED."
      - name: severity
        type: enum
        source: input
        description: "CONTRAINDICATED blocks recording; PRECAUTION records a warning but allows the dose."
        default: CONTRAINDICATED
        constraints: "One of {CONTRAINDICATED, PRECAUTION}."
      - name: origin
        type: enum
        source: system
        description: "MANUAL for clinician-entered records; ADVERSE_EVENT when auto-created by a confirmed serious AdverseEvent cascade."
        default: MANUAL
        constraints: "One of {MANUAL, ADVERSE_EVENT}."
      - name: source_event_id
        type: string
        source: input
        description: "FK -> AdverseEvent.id; set only for origin ADVERSE_EVENT records, null otherwise."
        default: null

  - name: ProviderReport
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the reporting provider."
      - name: line_count
        type: integer
        source: input
        description: "Number of dose lines the provider claims to be submitting in this batch; the adjudication must process exactly this many lines."
        constraints: ">= 1."
      - name: accepted_count
        type: integer
        source: computed
        description: "Number of lines that adjudicated to a RECORDED Immunization on acceptance."
        default: 0
      - name: rejected_count
        type: integer
        source: computed
        description: "Number of lines rejected during adjudication (lot recalled, expired, unauthorized product, contraindication)."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle posture of the batch."
        default: DRAFT
        constraints: "One of {DRAFT, SUBMITTED, ACCEPTED, PARTIALLY_REJECTED, REJECTED}."

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: immunization_id
        type: string
        source: input
        description: "FK -> Immunization.id; the dose suspected of causing the event."
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the referenced Immunization at creation."
      - name: seriousness
        type: enum
        source: input
        description: "VAERS seriousness; SERIOUS events that are CONFIRMED auto-create a CONTRAINDICATED AllergyRecord on the patient for the dose's antigen."
        default: NON_SERIOUS
        constraints: "One of {SERIOUS, NON_SERIOUS}."
      - name: symptoms
        type: string
        source: input
        description: "Free-text VAERS symptom description."
      - name: status
        type: enum
        source: computed
        description: "VAERS report lifecycle."
        default: REPORTED
        constraints: "One of {REPORTED, UNDER_REVIEW, CONFIRMED, DISMISSED}."

  - name: ScheduleEvaluation
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits; latest-evaluation tie-break key."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the evaluated child."
      - name: as_of_date
        type: string
        source: input
        description: "ISO date the evaluation is computed against; defaults to the current clock date when omitted."
      - name: overall_status
        type: enum
        source: computed
        description: "UP_TO_DATE when every mandated antigen has its required valid doses and none is past-due; BEHIND when at least one antigen is missing doses that are already due; CONDITIONAL when behind but every behind antigen has its next valid dose scheduled in the future (not yet due); NON_COMPLIANT when an antigen is contraindicated and unsatisfiable."
        constraints: "One of {UP_TO_DATE, BEHIND, CONDITIONAL, NON_COMPLIANT}."
      - name: antigen_results
        type: array
        source: computed
        description: "Per-antigen result objects {antigen, valid_dose_count, required_doses, next_valid_due_date, next_recommended_due_date, satisfied}; the catch-up engine output."
      - name: completeness_pct
        type: number
        source: computed
        description: "Compliance percentage; antigen-average rounding order is pinned in §1.3 compliance_completeness."

  - name: SchoolComplianceCertificate
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the child the proof is issued for."
      - name: evaluation_id
        type: string
        source: input
        description: "FK -> ScheduleEvaluation.id; the evaluation snapshot the certificate was issued against."
      - name: certificate_type
        type: enum
        source: computed
        description: "COMPLETE when the evaluation overall_status is UP_TO_DATE; CONDITIONAL when overall_status is CONDITIONAL. Issuance is rejected for BEHIND or NON_COMPLIANT."
        constraints: "One of {COMPLETE, CONDITIONAL}."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on issuance; SUPERSEDED when a newer certificate is issued for the same patient; REVOKED when a recall/adverse-event cascade invalidates the underlying compliance."
        default: ACTIVE
        constraints: "One of {ACTIVE, SUPERSEDED, REVOKED}."

  - name: LotRecall
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
      - name: lot_id
        type: string
        source: input
        description: "FK -> VaccineLot.id; the recalled lot."
      - name: reason
        type: string
        source: input
        description: "Free-text recall reason."
      - name: invalidated_count
        type: integer
        source: computed
        description: "Number of Immunization rows transitioned RECORDED/AMENDED -> INVALIDATED by this recall's cascade."
        default: 0

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Immunization
    initial_state: RECORDED
    terminal_states: [DELETED]
    transitions:
      - from: RECORDED
        to: AMENDED
        trigger: "PATCH /immunizations/{id}"
        actor: RecordsClerk
        preconditions:
          - "Immunization.status == RECORDED"
          - "the corrected administered_date keeps the dose within the lot's [received_date, expiration_date] window"
        side_effects:
          - "recompute this dose's validity and dose_number and those of all same-antigen siblings of the patient (compute_dose_validity, §1.3)"
          - "reconcile VaccineLot.administered_count for the affected lot(s)"
          - "increments Immunization.version by 1"
        note: "AMENDED behaves identically to RECORDED for counting; the status distinguishes corrected rows for audit."
      - from: AMENDED
        to: AMENDED
        trigger: "PATCH /immunizations/{id}"
        actor: RecordsClerk
        preconditions:
          - "Immunization.status == AMENDED"
        side_effects:
          - "recompute validity and dose_number for the patient's same-antigen series"
          - "reconcile VaccineLot.administered_count"
          - "increments Immunization.version by 1"
      - from: RECORDED
        to: INVALIDATED
        trigger: "system event: LotRecall issued on this dose's lot"
        actor: system
        preconditions:
          - "Immunization.status IN {RECORDED, AMENDED}"
        side_effects:
          - "set validity = INVALID_RECALL"
          - "decrement VaccineLot.administered_count by 1 (lot-inventory invariant, §1.3 lot_inventory_balance)"
          - "recompute dose_number for the patient's remaining valid same-antigen doses"
          - "increments Immunization.version by 1"
          - "increments LotRecall.invalidated_count by 1"
      - from: AMENDED
        to: INVALIDATED
        trigger: "system event: LotRecall issued on this dose's lot"
        actor: system
        preconditions:
          - "Immunization.status IN {RECORDED, AMENDED}"
        side_effects:
          - "set validity = INVALID_RECALL"
          - "decrement VaccineLot.administered_count by 1"
          - "recompute dose_number for the patient's remaining valid same-antigen doses"
          - "increments Immunization.version by 1"
          - "increments LotRecall.invalidated_count by 1"
      - from: INVALIDATED
        to: RECORDED
        trigger: "POST /lots/{id}/recalls/{recall_id}/reverse"
        actor: ImmunizationRegistrar
        preconditions:
          - "Immunization.status == INVALIDATED"
          - "Immunization.validity == INVALID_RECALL"
          - "the dose's lot is the recall's lot"
        side_effects:
          - "recompute validity (compute_dose_validity) — may resolve to VALID or to an interval/age failure"
          - "increment VaccineLot.administered_count by 1"
          - "recompute dose_number for the patient's same-antigen series"
          - "increments Immunization.version by 1"
        note: "Revalidation cycle INVALIDATED -> RECORDED makes this machine non-linear (cycle on Immunization)."
      - from: RECORDED
        to: DELETED
        trigger: "DELETE /immunizations/{id}"
        actor: ImmunizationRegistrar
        preconditions:
          - "Immunization.status IN {RECORDED, AMENDED}"
          - "no AdverseEvent in status {REPORTED, UNDER_REVIEW, CONFIRMED} references this dose"
        side_effects:
          - "decrement VaccineLot.administered_count by 1"
          - "recompute dose_number and validity for the patient's same-antigen series"
          - "increments Immunization.version by 1"
      - from: AMENDED
        to: DELETED
        trigger: "DELETE /immunizations/{id}"
        actor: ImmunizationRegistrar
        preconditions:
          - "Immunization.status IN {RECORDED, AMENDED}"
          - "no AdverseEvent in status {REPORTED, UNDER_REVIEW, CONFIRMED} references this dose"
        side_effects:
          - "decrement VaccineLot.administered_count by 1"
          - "recompute dose_number and validity for the patient's same-antigen series"
          - "increments Immunization.version by 1"

  - entity: ProviderReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /provider-reports/{id}/submit"
        actor: Provider
        preconditions:
          - "ProviderReport.status == DRAFT"
          - "the count of attached report lines equals ProviderReport.line_count"
          - "the acting Provider is the report's provider and Provider.status == ENROLLED"
        side_effects:
          - "increments ProviderReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /provider-reports/{id}/adjudicate"
        actor: ImmunizationRegistrar
        preconditions:
          - "ProviderReport.status == SUBMITTED"
          - "every attached line adjudicates to a valid recording (no line is rejected)"
        side_effects:
          - "for each line, create an Immunization (status RECORDED) and run compute_dose_validity"
          - "increment each affected VaccineLot.administered_count by 1"
          - "set accepted_count = line_count, rejected_count = 0"
          - "increments ProviderReport.version by 1"
        note: "Branch A of the fork-join: all-accept path."
      - from: SUBMITTED
        to: PARTIALLY_REJECTED
        trigger: "POST /provider-reports/{id}/adjudicate"
        actor: ImmunizationRegistrar
        preconditions:
          - "ProviderReport.status == SUBMITTED"
          - "at least one line is rejected AND at least one line is accepted"
        side_effects:
          - "create Immunization rows only for accepted lines; increment those lots' administered_count"
          - "set accepted_count and rejected_count to the realized split"
          - "increments ProviderReport.version by 1"
        note: "Branch B: divergent side-effect set (only accepted lines materialize)."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /provider-reports/{id}/adjudicate"
        actor: ImmunizationRegistrar
        preconditions:
          - "ProviderReport.status == SUBMITTED"
          - "every attached line is rejected"
        side_effects:
          - "create no Immunization rows"
          - "set accepted_count = 0, rejected_count = line_count"
          - "increments ProviderReport.version by 1"
        note: "Branch C: no-accept path; terminal with zero materialized doses."

  - entity: AdverseEvent
    initial_state: REPORTED
    terminal_states: [DISMISSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /adverse-events/{id}/review"
        actor: ImmunizationRegistrar
        preconditions:
          - "AdverseEvent.status == REPORTED"
        side_effects:
          - "increments AdverseEvent.version by 1"
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /adverse-events/{id}/confirm"
        actor: ImmunizationRegistrar
        preconditions:
          - "AdverseEvent.status == UNDER_REVIEW"
        side_effects:
          - "if seriousness == SERIOUS: create an AllergyRecord (origin ADVERSE_EVENT, severity CONTRAINDICATED) for the patient on the dose's product antigen unless one already exists for that antigen"
          - "the new contraindication causes the patient's next ScheduleEvaluation to mark that antigen NON_COMPLIANT (cascade hop 2, §1.2 transitive)"
          - "increments AdverseEvent.version by 1"
        note: "Branch with divergent side effects: SERIOUS vs NON_SERIOUS differ — only SERIOUS spawns the AllergyRecord."
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /adverse-events/{id}/dismiss"
        actor: ImmunizationRegistrar
        preconditions:
          - "AdverseEvent.status == UNDER_REVIEW"
        side_effects:
          - "increments AdverseEvent.version by 1"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /adverse-events/{id}/dismiss"
        actor: ImmunizationRegistrar
        preconditions:
          - "AdverseEvent.status == REPORTED"
        side_effects:
          - "increments AdverseEvent.version by 1"

  - entity: SchoolComplianceCertificate
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: a newer SchoolComplianceCertificate is issued for the same patient"
        actor: system
        preconditions:
          - "SchoolComplianceCertificate.status == ACTIVE"
          - "a new certificate for the same patient_id is being created"
        side_effects:
          - "set Patient.active_certificate_id to the new certificate's id"
          - "increments SchoolComplianceCertificate.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system event: LotRecall or confirmed serious AdverseEvent cascade drops the patient's compliance below the certificate's level"
        actor: system
        preconditions:
          - "SchoolComplianceCertificate.status == ACTIVE"
          - "the recomputed ScheduleEvaluation.overall_status is BEHIND or NON_COMPLIANT"
        side_effects:
          - "set Patient.active_certificate_id = null"
          - "increments SchoolComplianceCertificate.version by 1"

  - entity: LotRecall
    initial_state: ISSUED
    terminal_states: [REVERSED]
    transitions:
      - from: ISSUED
        to: REVERSED
        trigger: "POST /lots/{id}/recalls/{recall_id}/reverse"
        actor: ImmunizationRegistrar
        preconditions:
          - "LotRecall.status == ISSUED"
          - "the lot is still RECALLED by this recall"
        side_effects:
          - "set VaccineLot.status = AVAILABLE"
          - "transition each Immunization invalidated by this recall INVALIDATED -> RECORDED (compensation, §1.3 lot_inventory_balance)"
          - "increments LotRecall.version by 1"

concurrency_rules:
  - rule_id: certificate-issue-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /patients/{id}/certificates"
    occ_field: "expected_patient_version"
    description: |
      Issuing a SchoolComplianceCertificate against a Patient whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A newly issued certificate legitimately supersedes the patient's prior
      ACTIVE certificate and bumps Patient.version (active_certificate_id changes);
      a second issuance still carrying the old expected_patient_version is therefore
      operating on a stale view and is refused.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: compute_dose_validity
    trigger: "on Immunization create (POST /immunizations, report adjudication accept), on PATCH /immunizations/{id}, on recall invalidate, and on recall reverse"
    algorithm: chronological
    formula: |
      # Per patient, per antigen (group products by VaccineProduct.antigen).
      # Order the patient's non-DELETED doses of the antigen by
      #   (administered_date ASC, created_at ASC).   # never by id
      # Walk in that order, maintaining last_valid_date = None and valid_index = 0.
      # For dose D drawn from lot L of product P, with grace = P.grace_period_days:
      #   age_days = days_between(patient.date_of_birth, D.administered_date)
      #   if L.status == RECALLED and D.status != INVALIDATED:  validity = INVALID_RECALL; skip counting
      #   elif age_days < (P.min_age_days - grace):              validity = INVALID_AGE;   skip counting
      #   elif last_valid_date is not None and
      #        days_between(last_valid_date, D.administered_date) < (P.min_interval_days - grace):
      #                                                          validity = INVALID_INTERVAL; skip counting
      #   else:
      #        validity = VALID
      #        valid_index += 1
      #        D.dose_number = valid_index
      #        last_valid_date = D.administered_date
      # Doses that are not VALID retain dose_number = their prior value but are excluded from counting.
    input_set: "All Immunization rows for the patient whose product antigen matches and whose status != DELETED; INVALIDATED-by-recall doses are treated as failing (INVALID_RECALL) until reversed."
    constants:
      DEFAULT_GRACE_DAYS: 4
    precision: "integer day counts; days_between is exact calendar-day difference (UTC date subtraction)."
    variants:
      - name: with_grace
        when: "always, under the CDC 4-day grace rule"
        difference: "min_age and min_interval thresholds are each reduced by grace_period_days before comparison."

  - name: schedule_next_due
    trigger: "on POST /patients/{id}/evaluations and on any recompute of a patient's ScheduleEvaluation"
    algorithm: forward_looking
    formula: |
      # For each mandated antigen (distinct VaccineProduct.antigen over ACTIVE products):
      #   valid_dose_count = count of the patient's VALID doses of that antigen (from compute_dose_validity)
      #   required = the VaccineProduct.doses_in_series of the antigen's product
      #   last_valid_date = administered_date of the highest VALID dose_number, or patient.date_of_birth if none
      #   # Two due-date VARIANTS, computed from DIFFERENT baselines:
      #   if valid_dose_count == 0:
      #     next_valid_due_date       = date_of_birth + (min_age_days - grace) days
      #     next_recommended_due_date = date_of_birth + recommended_age_days days
      #   else:
      #     next_valid_due_date       = last_valid_date + (min_interval_days - grace) days
      #     next_recommended_due_date = last_valid_date + min_interval_days days   # no grace on recommended cadence
      #   satisfied = (valid_dose_count >= required)
    input_set: "Per mandated antigen (distinct VaccineProduct.antigen over ACTIVE products); uses only VALID doses from compute_dose_validity."
    constants:
      DEFAULT_GRACE_DAYS: 4
    precision: "integer day arithmetic on calendar dates."
    variants:
      - name: minimum_interval
        when: "next_valid_due_date — the earliest date a catch-up dose may be given and still count"
        difference: "uses (min_interval_days - grace) / (min_age_days - grace) baseline."
      - name: recommended_age
        when: "next_recommended_due_date — the routine-schedule target date"
        difference: "uses recommended_age_days / un-graced min_interval_days; produces a LATER date than minimum_interval for identical patient data."

  - name: compliance_completeness
    trigger: "on POST /patients/{id}/evaluations; computes ScheduleEvaluation.completeness_pct and overall_status"
    algorithm: weighted_scoring
    formula: |
      # mandated = the distinct VaccineProduct.antigen values over all ACTIVE products
      #            (the school-mandate antigen set; each antigen weighted equally). state_code
      #            is recorded on the patient but the mandate set in this registry is the full
      #            active-product antigen set.
      # For each antigen a:
      #   antigen_pct[a] = round( 100 * min(valid_dose_count[a], required[a]) / required[a], 2 )   # ROUND PER ANTIGEN FIRST
      # completeness_pct = round( sum(antigen_pct[a] for a in mandated) / len(mandated), 2 )         # THEN AVERAGE, THEN ROUND
      # overall_status:
      #   if any mandated antigen has a CONTRAINDICATED AllergyRecord and is unsatisfied: NON_COMPLIANT
      #   elif all antigens satisfied:                                                    UP_TO_DATE
      #   elif every unsatisfied antigen has next_valid_due_date > as_of_date:            CONDITIONAL
      #   else:                                                                           BEHIND
      # NOTE: round-per-antigen-then-average is PINNED; averaging raw ratios then rounding once gives different cents.
    input_set: "Mandated antigens (distinct VaccineProduct.antigen over ACTIVE products); valid_dose_count from compute_dose_validity; due dates from schedule_next_due; contraindications from AllergyRecord where severity == CONTRAINDICATED."
    constants:
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up; per-antigen rounding precedes the average (order pinned)."
    variants:
      - name: complete
        when: "overall_status resolves to UP_TO_DATE"
        difference: "completeness_pct == 100.00; certificate_type would be COMPLETE."
      - name: conditional
        when: "overall_status resolves to CONDITIONAL"
        difference: "completeness_pct < 100.00 but every gap is not-yet-due; certificate_type would be CONDITIONAL."

  - name: lot_inventory_balance
    trigger: "on every Immunization create/amend/invalidate/revalidate/delete and on recall reverse"
    algorithm: aggregation
    formula: |
      # INVARIANT (conserved quantity): for every VaccineLot L,
      #   L.administered_count == count( Immunization I where I.lot_id == L.id
      #                                  AND I.status IN {RECORDED, AMENDED} )
      # Forward action (record/adjudicate-accept/revalidate): +1.
      # Compensating action (invalidate-by-recall / delete / recall-reverse-then-not): -1 or +1 to exactly undo.
      # available = L.doses_total - L.administered_count must stay >= 0 at all times.
    input_set: "Immunization rows with status IN {RECORDED, AMENDED} grouped by lot_id."
    constants: {}
    precision: "integer counts."

  - name: lot_capacity_remaining
    trigger: "on POST /immunizations and on report adjudication, before recording a dose against a lot"
    algorithm: threshold
    formula: |
      # remaining = VaccineLot.doses_total - VaccineLot.administered_count
      # A new dose is allowed only when remaining >= 1 (i.e. administered_count < doses_total).
      # Recording the (doses_total)-th dose is allowed; the (doses_total + 1)-th is rejected ERR_LOT_DEPLETED.
    input_set: "Single VaccineLot's doses_total and administered_count."
    constants: {}
    precision: "integer counts; boundary is administered_count < doses_total (strict)."

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per the §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path/body-referenced resource (patient, provider, lot, product, immunization, report, evaluation, recall, adverse_event) exists; validated left-to-right in the path."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "request body includes all required fields with valid types and enum members; date_of_birth is a calendar date not after the current clock date."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is defined (e.g. report SUBMITTED before adjudicate; immunization RECORDED/AMENDED before delete; recall ISSUED before reverse)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "the administering Provider's authorized_product_codes contains the lot's product_code (provider authorized for the product)."
    error_id: ERR_PRODUCT_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /immunizations, POST /provider-reports/{id}/adjudicate (per line)"
  - priority: 7
    category: state
    check: "the lot backing the dose is not RECALLED (VaccineLot.status != RECALLED)."
    error_id: ERR_LOT_RECALLED
    http_status: 409
    applies_to: "POST /immunizations, POST /provider-reports/{id}/adjudicate (per line)"
  - priority: 8
    category: business_temporal
    check: "the administered_date is within the lot's [received_date, expiration_date] window (containment): not before received_date and not after expiration_date."
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /immunizations, PATCH /immunizations/{id}, POST /provider-reports/{id}/adjudicate (per line)"
  - priority: 9
    category: business_safety
    check: "the patient has no CONTRAINDICATED AllergyRecord for the product's antigen (contraindication blocks the dose)."
    error_id: ERR_CONTRAINDICATED
    http_status: 422
    applies_to: "POST /immunizations, POST /provider-reports/{id}/adjudicate (per line)"
  - priority: 10
    category: business_temporal
    check: "the dose does not violate the minimum interval since the prior valid same-antigen dose (administered_date - last_valid_date >= min_interval_days - grace)."
    error_id: ERR_INTERVAL_TOO_SHORT
    http_status: 422
    applies_to: "POST /immunizations (when recorded as a strict, reject-on-violation dose)"
  - priority: 11
    category: business_fiscal
    check: "the lot has remaining capacity (administered_count < doses_total)."
    error_id: ERR_LOT_DEPLETED
    http_status: 422
    applies_to: "POST /immunizations, POST /provider-reports/{id}/adjudicate (per line)"
  - priority: 12
    category: business_constraint
    check: "certificate issuance requires the cited ScheduleEvaluation.overall_status to be UP_TO_DATE or CONDITIONAL; BEHIND/NON_COMPLIANT is rejected."
    error_id: ERR_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /patients/{id}/certificates"
  - priority: 13
    category: business_constraint
    check: "OCC: expected_patient_version equals the current Patient.version for certificate issuance."
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /patients/{id}/certificates"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Patients ----
  - method: POST
    path: "/patients"
    description: "Register a child."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 201
    input: [full_name, date_of_birth, state_code]
    output: Patient
    side_effects: ["create Patient with schedule_status UP_TO_DATE"]
  - method: GET
    path: "/patients/{id}"
    description: "Fetch a patient."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "List patients."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/immunizations"
    description: "List a patient's immunizations (reverse-reachability for Immunization.patient_id)."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: Immunization[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/allergy-records"
    description: "List a patient's allergy records (reverse-reachability for AllergyRecord.patient_id)."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: AllergyRecord[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/evaluations"
    description: "List a patient's schedule evaluations (reverse-reachability for ScheduleEvaluation.patient_id)."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ScheduleEvaluation[]
    side_effects: []
  - method: GET
    path: "/patients/{id}/certificates"
    description: "List a patient's certificates (reverse-reachability for SchoolComplianceCertificate.patient_id)."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: SchoolComplianceCertificate[]
    side_effects: []

  # ---- Providers ----
  - method: POST
    path: "/providers"
    description: "Enroll a provider."
    roles: [ImmunizationRegistrar]
    code: 201
    input: [name, vfc_pin, authorized_product_codes, "status?"]
    output: Provider
    side_effects: ["create Provider"]
  - method: GET
    path: "/providers/{id}"
    description: "Fetch a provider."
    roles: [ImmunizationRegistrar, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---- Vaccine products & lots ----
  - method: POST
    path: "/products"
    description: "Define a vaccine product / series."
    roles: [ImmunizationRegistrar]
    code: 201
    input: [product_code, antigen, doses_in_series, min_age_days, recommended_age_days, min_interval_days, "grace_period_days?", "status?"]
    output: VaccineProduct
    side_effects: ["create VaccineProduct"]
  - method: GET
    path: "/products/{id}"
    description: "Fetch a product."
    roles: [ImmunizationRegistrar, Provider, RecordsClerk]
    code: 200
    input: []
    output: VaccineProduct
    side_effects: []
  - method: POST
    path: "/lots"
    description: "Register a vaccine lot."
    roles: [ImmunizationRegistrar]
    code: 201
    input: [product_id, lot_number, received_date, expiration_date, doses_total]
    output: VaccineLot
    side_effects: ["create VaccineLot with administered_count 0, status AVAILABLE"]
  - method: GET
    path: "/lots/{id}"
    description: "Fetch a lot, including computed administered_count and status."
    roles: [ImmunizationRegistrar, Provider]
    code: 200
    input: []
    output: VaccineLot
    side_effects: []
  - method: GET
    path: "/lots"
    description: "List lots, optionally filtered by product (reverse-reachability for VaccineLot.product_id)."
    roles: [ImmunizationRegistrar, Provider]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: VaccineLot[]
    side_effects: []
  - method: GET
    path: "/lots/{id}/immunizations"
    description: "List immunizations drawn from a lot (reverse-reachability for Immunization.lot_id)."
    roles: [ImmunizationRegistrar, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: Immunization[]
    side_effects: []

  # ---- Lot recalls ----
  - method: POST
    path: "/lots/{id}/recalls"
    description: "Issue a recall on a lot; cascades to invalidate doses, recompute evaluations, revoke certificates."
    roles: [ImmunizationRegistrar]
    code: 201
    input: [reason]
    output: LotRecall
    side_effects:
      - "set VaccineLot.status = RECALLED"
      - "transition each RECORDED/AMENDED Immunization on the lot -> INVALIDATED (validity INVALID_RECALL), decrement lot.administered_count (cascade hop 1)"
      - "recompute each affected patient's latest ScheduleEvaluation and Patient.schedule_status (cascade hop 2)"
      - "revoke (REVOKE) any ACTIVE certificate whose patient dropped below its level (cascade hop 3)"
      - "set LotRecall.invalidated_count to the number of doses struck"
  - method: GET
    path: "/lots/{id}/recalls"
    description: "List recalls on a lot (reverse-reachability for LotRecall.lot_id)."
    roles: [ImmunizationRegistrar, Provider]
    code: 200
    input: ["limit?", "offset?"]
    output: LotRecall[]
    side_effects: []
  - method: POST
    path: "/lots/{id}/recalls/{recall_id}/reverse"
    description: "Reverse a recall: lot back to AVAILABLE, struck doses revalidated (compensation)."
    roles: [ImmunizationRegistrar]
    code: 200
    input: []
    output: LotRecall
    side_effects:
      - "set VaccineLot.status = AVAILABLE"
      - "transition each Immunization struck by this recall INVALIDATED -> RECORDED, increment lot.administered_count, recompute validity & dose_number"
      - "increments LotRecall.version by 1"

  # ---- Immunizations ----
  - method: POST
    path: "/immunizations"
    description: "Record a directly administered dose."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 201
    input: [patient_id, lot_id, provider_id, administered_date]
    output: Immunization
    side_effects:
      - "create Immunization status RECORDED"
      - "run compute_dose_validity for the patient's same-antigen series; assign dose_number & validity"
      - "increment VaccineLot.administered_count by 1 (lot_inventory_balance)"
  - method: GET
    path: "/immunizations/{id}"
    description: "Fetch an immunization."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: []
    output: Immunization
    side_effects: []
  - method: PATCH
    path: "/immunizations/{id}"
    description: "Correct a dose's administered_date; recompute validity/dose_number across the series."
    roles: [RecordsClerk]
    code: 200
    input: [administered_date]
    output: Immunization
    side_effects:
      - "status RECORDED -> AMENDED (or AMENDED -> AMENDED)"
      - "recompute validity & dose_number for the patient's same-antigen series"
      - "reconcile VaccineLot.administered_count"
      - "increments Immunization.version by 1"
  - method: DELETE
    path: "/immunizations/{id}"
    description: "Retract a dose (sets status DELETED)."
    roles: [ImmunizationRegistrar]
    code: 200
    input: []
    output: Immunization
    side_effects:
      - "status -> DELETED"
      - "decrement VaccineLot.administered_count, recompute series validity & dose_number"
      - "increments Immunization.version by 1"
  - method: GET
    path: "/immunizations"
    description: "List immunizations, optionally filtered by patient, lot, provider, or report (reverse-reachability for Immunization.patient_id, lot_id, provider_id, report_id)."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: ["patient_id?", "lot_id?", "provider_id?", "report_id?", "limit?", "offset?"]
    output: Immunization[]
    side_effects: []

  # ---- Allergy records ----
  - method: POST
    path: "/allergy-records"
    description: "Record a contraindication or precaution for a patient."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 201
    input: [patient_id, antigen, "severity?"]
    output: AllergyRecord
    side_effects: ["create AllergyRecord origin MANUAL"]
  - method: GET
    path: "/allergy-records/{id}"
    description: "Fetch an allergy record."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: []
    output: AllergyRecord
    side_effects: []
  - method: GET
    path: "/allergy-records"
    description: "List allergy records, optionally filtered by patient or source adverse event (reverse-reachability for AllergyRecord.patient_id and AllergyRecord.source_event_id)."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: ["patient_id?", "source_event_id?", "limit?", "offset?"]
    output: AllergyRecord[]
    side_effects: []

  # ---- Provider reports ----
  - method: POST
    path: "/provider-reports"
    description: "Open a draft batch report for a provider."
    roles: [Provider, ImmunizationRegistrar]
    code: 201
    input: [provider_id, line_count]
    output: ProviderReport
    side_effects: ["create ProviderReport status DRAFT, accepted_count 0, rejected_count 0"]
  - method: POST
    path: "/provider-reports/{id}/lines"
    description: "Attach one dose line to a draft report."
    roles: [Provider, ImmunizationRegistrar]
    code: 201
    input: [patient_id, lot_id, administered_date]
    output: ProviderReport
    side_effects: ["append a pending line to the report (line is materialized into an Immunization only on adjudicate-accept)"]
  - method: GET
    path: "/provider-reports/{id}"
    description: "Fetch a report."
    roles: [Provider, ImmunizationRegistrar]
    code: 200
    input: []
    output: ProviderReport
    side_effects: []
  - method: GET
    path: "/provider-reports"
    description: "List reports, optionally filtered by provider (reverse-reachability for ProviderReport.provider_id)."
    roles: [Provider, ImmunizationRegistrar]
    code: 200
    input: ["provider_id?", "limit?", "offset?"]
    output: ProviderReport[]
    side_effects: []
  - method: GET
    path: "/provider-reports/{id}/immunizations"
    description: "List immunizations materialized from a report (reverse-reachability for Immunization.report_id)."
    roles: [Provider, ImmunizationRegistrar]
    code: 200
    input: ["limit?", "offset?"]
    output: Immunization[]
    side_effects: []
  - method: POST
    path: "/provider-reports/{id}/submit"
    description: "Submit a draft report for adjudication."
    roles: [Provider]
    code: 200
    input: []
    output: ProviderReport
    side_effects: ["status DRAFT -> SUBMITTED; increments ProviderReport.version by 1"]
  - method: POST
    path: "/provider-reports/{id}/adjudicate"
    description: "Adjudicate a submitted report: accept passing lines, reject failing ones (fork-join)."
    roles: [ImmunizationRegistrar]
    code: 200
    input: []
    output: ProviderReport
    side_effects:
      - "per line, apply §1.4 line checks (authorization, recall, expiry, contraindication, capacity)"
      - "create Immunization (RECORDED) for each accepted line and increment its lot.administered_count"
      - "set accepted_count/rejected_count; status -> ACCEPTED | PARTIALLY_REJECTED | REJECTED"
      - "increments ProviderReport.version by 1"

  # ---- Adverse events (VAERS) ----
  - method: POST
    path: "/adverse-events"
    description: "File a VAERS adverse-event report against a dose."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 201
    input: [immunization_id, seriousness, symptoms]
    output: AdverseEvent
    side_effects: ["create AdverseEvent status REPORTED; copy patient_id from the immunization"]
  - method: GET
    path: "/adverse-events/{id}"
    description: "Fetch an adverse event."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []
  - method: GET
    path: "/adverse-events"
    description: "List adverse events, optionally filtered by immunization or patient (reverse-reachability for AdverseEvent.immunization_id and AdverseEvent.patient_id)."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: ["immunization_id?", "patient_id?", "limit?", "offset?"]
    output: AdverseEvent[]
    side_effects: []
  - method: POST
    path: "/adverse-events/{id}/review"
    description: "Move a report to UNDER_REVIEW."
    roles: [ImmunizationRegistrar]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: ["status REPORTED -> UNDER_REVIEW; increments AdverseEvent.version by 1"]
  - method: POST
    path: "/adverse-events/{id}/confirm"
    description: "Confirm a report; SERIOUS confirmations auto-create a contraindication and cascade to schedule/cert."
    roles: [ImmunizationRegistrar]
    code: 200
    input: []
    output: AdverseEvent
    side_effects:
      - "status UNDER_REVIEW -> CONFIRMED"
      - "if SERIOUS: create AllergyRecord (origin ADVERSE_EVENT, CONTRAINDICATED) for the dose's antigen unless one exists (cascade hop 1)"
      - "recompute the patient's latest ScheduleEvaluation -> antigen NON_COMPLIANT (cascade hop 2)"
      - "increments AdverseEvent.version by 1"
  - method: POST
    path: "/adverse-events/{id}/dismiss"
    description: "Dismiss a report."
    roles: [ImmunizationRegistrar]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: ["status -> DISMISSED; increments AdverseEvent.version by 1"]

  # ---- Schedule evaluations & certificates ----
  - method: POST
    path: "/patients/{id}/evaluations"
    description: "Run the catch-up engine: compute per-antigen results, due dates, completeness, overall status."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 201
    input: ["as_of_date?"]
    output: ScheduleEvaluation
    side_effects:
      - "compute antigen_results (schedule_next_due), completeness_pct & overall_status (compliance_completeness)"
      - "copy overall_status to Patient.schedule_status; increments Patient.version by 1"
  - method: GET
    path: "/evaluations/{id}"
    description: "Fetch a schedule evaluation."
    roles: [ImmunizationRegistrar, RecordsClerk]
    code: 200
    input: []
    output: ScheduleEvaluation
    side_effects: []
  - method: POST
    path: "/patients/{id}/certificates"
    description: "Issue a school compliance certificate against a cited evaluation; supersedes any prior ACTIVE one (OCC on Patient.version)."
    roles: [ImmunizationRegistrar]
    code: 201
    input: [evaluation_id, expected_patient_version]
    output: SchoolComplianceCertificate
    side_effects:
      - "create SchoolComplianceCertificate (COMPLETE or CONDITIONAL per evaluation)"
      - "supersede the patient's prior ACTIVE certificate (-> SUPERSEDED)"
      - "set Patient.active_certificate_id; increments Patient.version by 1"
  - method: GET
    path: "/certificates/{id}"
    description: "Fetch a certificate."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: []
    output: SchoolComplianceCertificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "List certificates, optionally filtered by patient or source evaluation (reverse-reachability for SchoolComplianceCertificate.patient_id and SchoolComplianceCertificate.evaluation_id)."
    roles: [ImmunizationRegistrar, RecordsClerk, Provider]
    code: 200
    input: ["patient_id?", "evaluation_id?", "limit?", "offset?"]
    output: SchoolComplianceCertificate[]
    side_effects: []

  # ---- Test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC instant (drives age and as_of_date defaults)."
    roles: [ImmunizationRegistrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set the server clock used for age computation and as_of_date default"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for the operation per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad type, invalid enum, or date_of_birth after the clock date."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which the requested transition is defined."
  - id: ERR_PRODUCT_NOT_AUTHORIZED
    http: 422
    condition: "the administering provider's authorized_product_codes lacks the lot's product_code."
  - id: ERR_LOT_RECALLED
    http: 409
    condition: "the lot backing the dose is RECALLED."
  - id: ERR_LOT_EXPIRED
    http: 422
    condition: "administered_date is outside the lot's [received_date, expiration_date] window."
  - id: ERR_CONTRAINDICATED
    http: 422
    condition: "the patient has a CONTRAINDICATED AllergyRecord for the product's antigen."
  - id: ERR_INTERVAL_TOO_SHORT
    http: 422
    condition: "a strict dose violates the minimum interval (with grace) since the prior valid same-antigen dose."
  - id: ERR_LOT_DEPLETED
    http: 422
    condition: "the lot has no remaining capacity (administered_count == doses_total)."
  - id: ERR_NOT_COMPLIANT
    http: 422
    condition: "certificate issuance cited an evaluation whose overall_status is BEHIND or NON_COMPLIANT."
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal the current Patient.version on certificate issuance."
  - id: ERR_LINE_COUNT_MISMATCH
    http: 422
    condition: "submitting a report whose attached line count differs from line_count."
  - id: ERR_PROVIDER_SUSPENDED
    http: 409
    condition: "the acting provider's status is SUSPENDED on submit/report operations."
  - id: ERR_DUPLICATE
    http: 409
    condition: "uniqueness violation: duplicate vfc_pin, product_code, or lot_number within product."
  - id: ERR_ADVERSE_EVENT_BLOCKS_DELETE
    http: 409
    condition: "attempting to delete an immunization referenced by a non-dismissed adverse event."
  - id: ERR_VALIDATION
    http: 422
    condition: "expiration_date not strictly after received_date, recommended_age_days < min_age_days, or other cross-field constraint."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ImmunizationRegistrar
    description: "State registry operator: manages products, lots, recalls, adjudicates reports, runs evaluations, issues certificates, reviews adverse events."
    identity: opaque
    exclusive_operations:
      - "POST /products"
      - "POST /lots"
      - "POST /providers"
      - "POST /lots/{id}/recalls"
      - "POST /lots/{id}/recalls/{recall_id}/reverse"
      - "POST /provider-reports/{id}/adjudicate"
      - "DELETE /immunizations/{id}"
      - "POST /adverse-events/{id}/review"
      - "POST /adverse-events/{id}/confirm"
      - "POST /adverse-events/{id}/dismiss"
      - "POST /patients/{id}/certificates"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /patients"
      - "POST /immunizations"
      - "POST /allergy-records"
      - "POST /provider-reports"
      - "POST /provider-reports/{id}/lines"
      - "POST /patients/{id}/evaluations"
      - "POST /adverse-events"
      - "GET reads"
  - name: RecordsClerk
    description: "Clinic records staff: registers patients, records and corrects doses, files allergies and adverse events, runs evaluations."
    identity: opaque
    exclusive_operations:
      - "PATCH /immunizations/{id}"
    shared_operations:
      - "POST /patients"
      - "POST /immunizations"
      - "POST /allergy-records"
      - "POST /patients/{id}/evaluations"
      - "POST /adverse-events"
      - "GET reads"
  - name: Provider
    description: "Administering provider: opens/submits batch reports, files adverse events, reads its own resources."
    identity: entity_backed:Provider
    exclusive_operations:
      - "POST /provider-reports/{id}/submit"
    shared_operations:
      - "POST /provider-reports"
      - "POST /provider-reports/{id}/lines"
      - "POST /adverse-events"
      - "GET reads"
