    description: "List RecallNotices; filterable by season_id and product_id (FK reverse reachability for RecallNotice.season_id / RecallNotice.product_id)"
    roles: [CouncilAdmin, TroopLeader]
    code: 200
    input: ["season_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "RecallNotice[]"
    side_effects: []

  - method: GET
    path: "/cookie-program/accounts/{accountId}"
    description: "Get one TroopAccount"
    roles: [CouncilAdmin, TroopLeader]
    code: 200
    input: []
    output: TroopAccount
    side_effects: []

