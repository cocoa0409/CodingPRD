              captures: { entry_id: $.data.id, v0: $.data.version }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 1000000, quantity: 1 }
              as: LicensedBroker
          trigger:
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
              captures: { v1: $.data.version }
          assert:
            - "CustomsEntry.${entry_id}.version == 2 after file (was 1 at creation)"

      - name: liquidate_reconciles_statement_total_to_final_owed
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.CustomsEntry.RELEASED_to_LIQUIDATED
          - entities.MonthlyStatement.fields.statement_total_cents
          - entities.CustomsEntry.fields.total_duties_owed_cents
        distinguishing_aspect: "Derived-field reconciliation on liquidation with a provisional→final swing: a USMCA-claimed CN apparel entry (provisional 520) liquidates to owed 69735; the scheduled statement's statement_total_cents recomputes from 520 to 69735."
        test_recipe:
          setup:
            - "A RELEASED CN apparel USMCA entry (provisional 520) scheduled on the 2026-06 statement (statement_total 520); clock 2026-06-05; bond high limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
