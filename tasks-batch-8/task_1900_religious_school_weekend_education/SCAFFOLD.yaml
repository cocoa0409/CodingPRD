scenario: |
  1900. Religious School & Weekend Education Administration (synagogue/parish religious school): enrollment & tuition/membership-linked pricing, class placement by grade & Hebrew/language level, teacher hiring & curriculum assignment, attendance & milestone (ceremony) readiness tracking, family volunteer requirement & tracking, calendar coordination with holidays & school breaks, tuition assistance application, security & safety plan

domain_name: religious-school-admin
api_prefix: /school

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine        # membership-linked tuition: sibling tiers, early-bird, assistance awards, late fees
  secondary_archetype: quota_allocation    # section capacity, grade+level placement, FULL/OPEN auto-transitions
  complexity_layers:
    - dual_variant_calculation             # provisional-vs-final tuition; PERCENT_OF_NET vs FLAT_CAP aid; current vs projected attendance
    - cascading_side_effects               # teacher separation -> section unstaffing -> session cancellation -> milestone re-eval
    - rate_threshold_triggers              # attendance >= 80% milestone gate; volunteer hours >= required -> FULFILLED
    - optimistic_concurrency               # OCC on Section.version (enroll) and Family.version (invoice issue)
  entity_topology: flat                    # peer entities joined by foreign keys; no URL nesting of the aggregate tree
  state_machine_shape: cyclic              # multiple revert loops: Milestone TRACKING<->ELIGIBLE, Application SUBMITTED<->UNDER_REVIEW, Commitment OPEN<->FULFILLED, Section OPEN<->FULL
  relationship_patterns:
    - one_to_many                          # Family->Students, Section->Sessions, Family->Invoices
    - cross_aggregate                      # Enrollment references Student/Section/Family/SchoolYear; Milestone gates on VolunteerCommitment
  role_model: approval_chain               # assistance: Parent submits -> AssistanceOfficer reviews -> SchoolAdmin decides (with segregation of duties)
  consistency_model: immediate             # every mutation + cascade visible in the same response

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: SchoolYear
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name, e.g. '2026-27'" }
      - { name: start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), first day of school year", constraints: "start_date < end_date" }
      - { name: end_date, type: string, source: input, description: "ISO date, last day of school year" }
      - { name: member_tuition_cents, type: integer, source: input, description: "Base per-student tuition for MEMBER families", constraints: "> 0" }
      - { name: non_member_tuition_cents, type: integer, source: input, description: "Base per-student tuition for NON_MEMBER families", constraints: "> 0" }
      - { name: early_bird_pct, type: number, source: input, description: "Early-bird discount fraction, e.g. 0.075", constraints: "0 <= p < 1" }
      - { name: early_bird_deadline, type: datetime, source: input, description: "Enrollments with created_at strictly before this instant get the early-bird discount" }
      - { name: sibling_discount_pcts, type: array, source: input, description: "Discount fraction by sibling rank, e.g. [0, 0.10, 0.20]; rank >= len uses last element" }
      - { name: activity_fee_cents, type: integer, source: input, description: "Flat per-family fee added to each issued invoice", constraints: ">= 0" }
      - { name: volunteer_hours_required, type: integer, source: input, description: "Hours each family must log per year", constraints: "> 0" }
      - { name: volunteer_buyout_fee_cents, type: integer, source: input, description: "Fee invoiced when a commitment DEFAULTS at year close", constraints: ">= 0" }
      - { name: late_fee_pct, type: number, source: input, description: "Late fee fraction of pre-fee balance per accrual run", constraints: "0 <= p <= 1" }
      - { name: late_fee_min_balance_cents, type: integer, source: input, description: "Balances strictly below this are exempt from late fees", constraints: ">= 0" }
      - { name: tuition_due_date, type: string, source: input, description: "ISO date; invoices copied onto this due_date at issue" }
      - { name: withdrawal_deadline, type: string, source: input, description: "ISO date; withdrawal before this date earns 100% credit" }
      - { name: refund_pct_after_deadline, type: number, source: input, description: "Credit fraction for withdrawals on/after deadline and before end_date", constraints: "0 <= p <= 1" }
      - { name: attendance_threshold_pct, type: number, source: input, description: "Milestone eligibility threshold, e.g. 80 (inclusive >=)", constraints: "0 < t <= 100" }
      - { name: status, type: enum, source: system, description: "SETUP | OPEN | CLOSED", default: SETUP }

  - name: SecurityPlan
    parent: null
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id; the year this plan covers" }
      - { name: plan_document, type: string, source: input, description: "Narrative of the security & safety plan" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | SUPERSEDED", default: DRAFT }
      - { name: approved_at, type: datetime, source: system, description: "Set when status enters ACTIVE; null otherwise", constraints: "nullable" }

  - name: CalendarClosure
    parent: null
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id" }
      - { name: start_date, type: string, source: input, description: "ISO date, first closed day (INCLUSIVE — closed interval semantics)" }
      - { name: end_date, type: string, source: input, description: "ISO date, last closed day (INCLUSIVE)", constraints: "end_date >= start_date" }
      - { name: reason, type: string, source: input, description: "Holiday / break label" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: family_name, type: string, source: input, description: "Family display name" }
      - { name: primary_email, type: string, source: input, description: "Contact email" }
      - { name: membership_status, type: enum, source: input, description: "MEMBER | NON_MEMBER; drives tuition base rate", constraints: "immutable after creation in v1" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of balance_cents over invoices with status IN {ISSUED, PARTIALLY_PAID}", default: 0 }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Unapplied payment remainders + withdrawal credits; consumed at invoice issue", default: 0 }
      - { name: version, type: integer, source: system, description: "Bumps ONLY on balance-affecting mutations: invoice issue, payment post/void, late-fee accrual, withdrawal credit, year-close buyout fee. Student/enrollment creation does NOT bump it." }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id" }
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: grade, type: enum, source: input, description: "K | G1 | G2 | G3 | G4 | G5 | G6 | G7" }
      - { name: hebrew_level, type: enum, source: input, description: "BEGINNER | INTERMEDIATE | ADVANCED" }

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Teacher name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: background_check_cleared, type: boolean, source: input, description: "Compliance flag required for vetting", default: false }
      - { name: status, type: enum, source: system, description: "APPLIED | VETTED | HIRED | SEPARATED", default: APPLIED }

  - name: Section
    parent: null
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id" }
      - { name: teacher_id, type: string, source: input, description: "FK -> Teacher.id; nullable — omit to create an unstaffed section", constraints: "nullable" }
      - { name: grade, type: enum, source: input, description: "K | G1 | G2 | G3 | G4 | G5 | G6 | G7; placement requires exact match with Student.grade" }
      - { name: hebrew_level, type: enum, source: input, description: "BEGINNER | INTERMEDIATE | ADVANCED; placement requires exact match with Student.hebrew_level" }
      - { name: capacity, type: integer, source: input, description: "Maximum enrolled students", constraints: ">= 1" }
      - { name: room, type: string, source: input, description: "Room identifier; room+day+time overlap is rejected" }
      - { name: day_of_week, type: enum, source: input, description: "SUN | MON | TUE | WED | THU | FRI | SAT" }
      - { name: start_time, type: string, source: input, description: "HH:MM 24h; HALF-OPEN interval [start_time, end_time)", constraints: "start_time < end_time" }
      - { name: end_time, type: string, source: input, description: "HH:MM 24h, exclusive bound" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of enrollments with status IN {REGISTERED, ACTIVE} on this section", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CLOSED; OPEN<->FULL automatic at capacity boundary", default: OPEN }
      - { name: staffing_status, type: enum, source: computed, description: "STAFFED iff teacher_id set and that Teacher.status == HIRED; else UNSTAFFED", default: UNSTAFFED }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: section_id, type: string, source: system, description: "FK -> Section.id; taken from the path" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; denormalized from Student at creation" }
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id; denormalized from Section at creation" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | WITHDRAWN | COMPLETED", default: REGISTERED }
      - { name: sibling_rank, type: integer, source: computed, description: "0-based rank among family's enrollments in this year with status IN {REGISTERED, ACTIVE, COMPLETED}, ordered by Enrollment.created_at ASC; identical timestamps broken by server request-arrival order (the earlier-processed create ranks first); WITHDRAWN excluded" }
      - { name: estimated_tuition_cents, type: integer, source: computed, description: "PROVISIONAL per-line tuition frozen at creation (see enrollment_net_tuition); used for withdrawal credit base" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Clock timestamp of withdrawal; null until WITHDRAWN", constraints: "nullable" }
      - { name: withdrawal_credit_pct, type: number, source: computed, description: "1.0 if withdrawn before withdrawal_deadline; refund_pct_after_deadline if before end_date; 0.0 otherwise; null until WITHDRAWN", constraints: "nullable" }
      - { name: credit_applied, type: boolean, source: system, description: "True once a withdrawal credit has been granted to Family.credit_balance_cents", default: false }

  - name: TuitionInvoice
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; taken from the path" }
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | VOID", default: ISSUED }
      - { name: kind, type: enum, source: system, description: "TUITION (endpoint-issued, supersedable) | VOLUNTEER_FEE (year-close sweep, never superseded, never blocks re-issue)", default: TUITION }
      - { name: line_items, type: array, source: system, description: "Array of { enrollment_id, student_id, line_cents } — one per billable enrollment, each line pre-rounded; empty for VOLUNTEER_FEE invoices" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of line_cents (sum of already-rounded lines — round-per-line-then-sum)" }
      - { name: activity_fee_cents, type: integer, source: computed, description: "Year's flat family fee copied at issue" }
      - { name: award_cents, type: integer, source: computed, description: "Assistance award applied (see assistance_award_amount); 0 when no APPROVED application" }
      - { name: assistance_application_id, type: string, source: system, description: "FK -> AssistanceApplication.id; the approved application applied, or null", constraints: "nullable" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Family credit consumed at issue = min(credit_balance, total_due)" }
      - { name: total_due_cents, type: integer, source: computed, description: "gross_cents + activity_fee_cents - award_cents" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of non-voided payment applications to this invoice", default: 0 }
      - { name: late_fees_cents, type: integer, source: computed, description: "Accumulated late fees", default: 0 }
      - { name: balance_cents, type: integer, source: computed, description: "total_due_cents - credit_applied_cents - paid_cents + late_fees_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issue" }
      - { name: due_date, type: string, source: system, description: "Copied from SchoolYear.tuition_due_date at issue" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; taken from the path" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: "> 0" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK | ACH" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED", default: POSTED }
      - { name: applications, type: array, source: system, description: "Array of { invoice_id, applied_cents } in waterfall order (oldest open invoice first)" }
      - { name: remainder_cents, type: integer, source: computed, description: "Unapplied remainder moved to Family.credit_balance_cents", default: 0 }

  - name: AssistanceApplication
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; taken from the path" }
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id" }
      - { name: reason, type: string, source: input, description: "Statement of need" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Optional requested amount", constraints: "nullable, > 0 when present" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED", default: SUBMITTED }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the AssistanceOfficer who started review; decide rejects the same id (segregation of duties)", constraints: "nullable" }
      - { name: award_method, type: enum, source: system, description: "PERCENT_OF_NET | FLAT_CAP; set at approval", constraints: "nullable" }
      - { name: award_percent, type: number, source: system, description: "Fraction of gross tuition awarded when method=PERCENT_OF_NET", constraints: "nullable, 0 < p <= 1" }
      - { name: award_amount_cents, type: integer, source: system, description: "Flat award cap when method=FLAT_CAP", constraints: "nullable, > 0" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the deciding SchoolAdmin", constraints: "nullable" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: section_id, type: string, source: system, description: "FK -> Section.id; taken from the path" }
      - { name: session_date, type: string, source: input, description: "ISO date of the class meeting" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CANCELLED", default: SCHEDULED }
      - { name: cancel_reason, type: enum, source: system, description: "CLOSURE | TEACHER_SEPARATION | MANUAL | YEAR_CLOSE; null until CANCELLED", constraints: "nullable" }
      - { name: attendance, type: array, source: system, description: "Embedded array of { student_id, status: PRESENT | ABSENT | EXCUSED }; upserted by POST attendance; entries of CANCELLED sessions are excluded from all calculations", default: [] }

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; auto-created on the student's first enrollment in a year" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; denormalized at creation for the volunteer gate" }
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id" }
      - { name: milestone_name, type: string, source: system, description: "Ceremony label; defaults to ANNUAL_CEREMONY", default: ANNUAL_CEREMONY }
      - { name: status, type: enum, source: system, description: "TRACKING | ELIGIBLE | SCHEDULED | COMPLETED", default: TRACKING }
      - { name: current_attendance_pct, type: number, source: computed, description: "attendance_percentage variant=current, 2-decimal percent" }
      - { name: projected_attendance_pct, type: number, source: computed, description: "attendance_percentage variant=projected (best case), 2-decimal percent" }
      - { name: ceremony_date, type: string, source: input, description: "ISO date of ceremony; optional at schedule", constraints: "nullable" }

  - name: VolunteerCommitment
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; auto-created on the family's first enrollment in a year" }
      - { name: school_year_id, type: string, source: system, description: "FK -> SchoolYear.id" }
      - { name: required_hours, type: integer, source: system, description: "Copied from SchoolYear.volunteer_hours_required at creation" }
      - { name: logged_hours, type: number, source: computed, description: "Sum of hours over entries with status ACTIVE (VOIDED excluded)", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FULFILLED | DEFAULTED | WAIVED", default: OPEN }
      - { name: entries, type: array, source: system, description: "Embedded array of { entry_id, hours, note, status: ACTIVE | VOIDED, created_at }", default: [] }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SchoolYear
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /school/school-years/{id}/open"
        actor: SchoolAdmin
        preconditions:
          - "At least one SecurityPlan for this year has status ACTIVE (ERR_SECURITY_PLAN_NOT_ACTIVE)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /school/school-years/{id}/close"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "Every SCHEDULED Session of every Section in this year -> CANCELLED (cancel_reason=YEAR_CLOSE)"
          - "Every VolunteerCommitment in this year with status OPEN and logged_hours < required_hours -> DEFAULTED; for each, system creates a fee-only TuitionInvoice (kind=VOLUNTEER_FEE, line_items=[], activity_fee_cents=0, gross_cents=0, award_cents=0, credit_applied_cents=0, total_due_cents=volunteer_buyout_fee_cents, due_date=SchoolYear.tuition_due_date, status=ISSUED) which bumps Family.outstanding_balance_cents and Family.version"
          - "VolunteerCommitment with status OPEN and logged_hours >= required_hours -> FULFILLED (no fee)"
          - "Every Section in this year with status IN {OPEN, FULL} -> CLOSED"
          - "Every Enrollment in this year with status IN {REGISTERED, ACTIVE} -> COMPLETED"

  - entity: SecurityPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /school/security-plans/{id}/submit"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /school/security-plans/{id}/approve"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "Any other SecurityPlan for the same school_year_id with status ACTIVE -> SUPERSEDED"
          - "approved_at set to logical clock"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /school/security-plans/{id}/reject"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []
        note: "Revision loop: DRAFT -> SUBMITTED -> DRAFT is allowed repeatedly"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /school/security-plans/{id}/retire | system (another plan for the same year approved)"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "The year is left with no ACTIVE plan; session hold and further opens are blocked until a new plan is approved"

  - entity: Teacher
    initial_state: APPLIED
    terminal_states: [SEPARATED]
    transitions:
      - from: APPLIED
        to: VETTED
        trigger: "POST /school/teachers/{id}/vet"
        actor: SchoolAdmin
        preconditions:
          - "background_check_cleared == true (ERR_BACKGROUND_CHECK_REQUIRED)"
        side_effects: []
      - from: VETTED
        to: HIRED
        trigger: "POST /school/teachers/{id}/hire"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []
      - from: VETTED
        to: SEPARATED
        trigger: "POST /school/teachers/{id}/separate"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []
      - from: HIRED
        to: SEPARATED
        trigger: "POST /school/teachers/{id}/separate"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "Cascade hop 1: every Section with teacher_id == this teacher and status IN {OPEN, FULL} gets teacher_id=null and staffing_status=UNSTAFFED (Section.version bumps)"
          - "Cascade hop 2: each such Section's Sessions with status SCHEDULED -> CANCELLED (cancel_reason=TEACHER_SEPARATION)"
          - "Cascade hop 3: for each cancelled Session, attendance of its enrolled students is recomputed (cancelled sessions excluded) and each affected Milestone is re-evaluated (TRACKING<->ELIGIBLE per threshold)"

  - entity: Section
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (enrollment create raises enrolled_count to == capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (withdrawal lowers enrolled_count below capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (SchoolYear close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: CLOSED
        trigger: "system (SchoolYear close)"
        actor: system
        preconditions: []
        side_effects: []
    note: "staffing_status (STAFFED | UNSTAFFED) is an independent derived dimension parallel to status; it never changes status and status never changes it"

  - entity: Enrollment
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "system (first Session of the section transitions to HELD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /school/enrollments/{id}/withdraw"
        actor: "SchoolAdmin | Parent (own family)"
        preconditions: []
        side_effects:
          - "Section.enrolled_count -= 1; if Section.status == FULL and enrolled_count < capacity -> Section.status = OPEN (Section.version bumps)"
          - "withdrawn_at = logical clock; withdrawal_credit_pct computed per refund tiers"
          - "If a non-VOID TuitionInvoice for this family+year contains a positive line for this enrollment AND that invoice has paid_cents > 0: Family.credit_balance_cents += round_half_up(estimated_tuition_cents * withdrawal_credit_pct), credit_applied=true, Family.version bumps; otherwise no credit"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /school/enrollments/{id}/withdraw"
        actor: "SchoolAdmin | Parent (own family)"
        preconditions: []
        side_effects:
          - "Same side effects as REGISTERED -> WITHDRAWN"
      - from: REGISTERED
        to: COMPLETED
        trigger: "system (SchoolYear close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (SchoolYear close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TuitionInvoice
    initial_state: ISSUED
    terminal_states: [VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (payment application leaves 0 < paid_cents and balance_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "system (payment application brings balance_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (payment application brings balance_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "system (payment void restores a positive balance with paid_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "system (payment void restores paid_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "system (superseded by a new invoice issue for the same family+year; requires paid_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "NEVER — re-issue with paid_cents > 0 is rejected (ERR_INVOICE_HAS_PAYMENTS)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Declared as unreachable-on-purpose: the validation rejects it, so no transition exists"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /school/payments/{id}/void"
        actor: SchoolAdmin
        preconditions:
          - "Family.credit_balance_cents >= remainder_cents (ERR_CREDIT_ALREADY_APPLIED)"
        side_effects:
          - "Reverse every application: invoice.paid_cents -= applied_cents, balance_cents += applied_cents, status regresses PAID->PARTIALLY_PAID or PARTIALLY_PAID->ISSUED as paid_cents reaches 0"
          - "Family.credit_balance_cents -= remainder_cents; Family.outstanding_balance_cents recomputed; Family.version bumps"

  - entity: AssistanceApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /school/assistance-applications/{id}/start-review"
        actor: AssistanceOfficer
        preconditions: []
        side_effects:
          - "reviewed_by_user_id = caller's X-User-ID"
      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /school/assistance-applications/{id}/request-info"
        actor: AssistanceOfficer
        preconditions: []
        side_effects:
          - "reviewed_by_user_id retained (the reviewing officer remains the segregated party)"
        note: "Revision loop SUBMITTED -> UNDER_REVIEW -> SUBMITTED is allowed repeatedly"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /school/assistance-applications/{id}/decide with decision=APPROVED"
        actor: SchoolAdmin
        preconditions:
          - "decider's X-User-ID != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "award_method present with matching award field (ERR_AWARD_PARAMS_INVALID)"
        side_effects:
          - "award_method/award_percent/award_amount_cents persisted; decided_by_user_id set"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /school/assistance-applications/{id}/decide with decision=DENIED"
        actor: SchoolAdmin
        preconditions:
          - "decider's X-User-ID != reviewed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id set"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /school/sessions/{id}/hold"
        actor: SchoolAdmin
        preconditions:
          - "The year's SecurityPlan: at least one ACTIVE exists (ERR_SECURITY_PLAN_NOT_ACTIVE)"
          - "session_date <= logical-clock current date (ERR_SESSION_DATE_IN_FUTURE)"
        side_effects:
          - "Every Enrollment of this section with status REGISTERED -> ACTIVE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /school/sessions/{id}/cancel (MANUAL) | system (CalendarClosure cascade, CLOSURE) | system (teacher separation, TEACHER_SEPARATION) | system (year close, YEAR_CLOSE)"
        actor: "SchoolAdmin | system"
        preconditions: []
        side_effects:
          - "cancel_reason set per trigger"
          - "For each student enrolled in the section: attendance_percentage recomputed excluding this session; Milestone re-evaluated (ELIGIBLE -> TRACKING if current_attendance_pct drops below threshold)"

  - entity: Milestone
    initial_state: TRACKING
    terminal_states: [COMPLETED]
    transitions:
      - from: TRACKING
        to: ELIGIBLE
        trigger: "system (attendance post / session cancel / POST evaluate recompute: current_attendance_pct >= SchoolYear.attendance_threshold_pct)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ELIGIBLE
        to: TRACKING
        trigger: "system (recompute: current_attendance_pct < attendance_threshold_pct)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Threshold cycle TRACKING <-> ELIGIBLE may repeat arbitrarily"
      - from: ELIGIBLE
        to: SCHEDULED
        trigger: "POST /school/milestones/{id}/schedule"
        actor: SchoolAdmin
        preconditions:
          - "Checked in this order within the business_constraint band: (1) Milestone.status == ELIGIBLE (ERR_MILESTONE_NOT_ELIGIBLE), then (2) the family's VolunteerCommitment for this year has status FULFILLED (ERR_VOLUNTEER_REQUIREMENT_UNMET)"
        side_effects: []
      - from: SCHEDULED
        to: ELIGIBLE
        trigger: "system (family VolunteerCommitment regresses FULFILLED -> OPEN via entry void)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /school/milestones/{id}/complete"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []

  - entity: VolunteerCommitment
    initial_state: OPEN
    terminal_states: [WAIVED, DEFAULTED]
    transitions:
      - from: OPEN
        to: FULFILLED
        trigger: "system (entry add: logged_hours >= required_hours)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULFILLED
        to: OPEN
        trigger: "system (entry void drops logged_hours < required_hours)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Milestone of this family in this year with status SCHEDULED -> ELIGIBLE"
      - from: OPEN
        to: DEFAULTED
        trigger: "system (SchoolYear close with logged_hours < required_hours)"
        actor: system
        preconditions: []
        side_effects:
          - "Fee-only TuitionInvoice created for the buyout fee (see SchoolYear close)"
      - from: OPEN
        to: WAIVED
        trigger: "POST /school/volunteer-commitments/{id}/waive"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []
      - from: DEFAULTED
        to: WAIVED
        trigger: "POST /school/volunteer-commitments/{id}/waive"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "The buyout fee invoice created at default -> VOID"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: enroll-stale-section
    parent_entity: Section
    write_endpoint: "POST /school/sections/{id}/enrollments"
    occ_field: "expected_section_version"
    description: |
      Creating an Enrollment against a Section whose version has advanced since the
      client last observed it is rejected. Another writer may have just enrolled a
      student (legitimately, while seats remained), advancing Section.version; the
      current writer's capacity view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-issue-stale-family
    parent_entity: Family
    write_endpoint: "POST /school/families/{id}/invoices"
    occ_field: "expected_family_version"
    description: |
      Issuing a TuitionInvoice against a Family whose version has advanced since the
      client last observed it is rejected. A prior issue, payment, void, accrual, or
      withdrawal credit legitimately mutates the family's balances; issuing from a
      stale balance view would supersede the wrong invoice.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: enrollment_net_tuition
    trigger: "enrollment creation (provisional -> estimated_tuition_cents) and invoice issue (final -> line_cents)"
    algorithm: tiered_pricing
    formula: |
      base = member_tuition_cents if Family.membership_status == MEMBER else non_member_tuition_cents
      rank_set = family enrollments in this SchoolYear with status IN {REGISTERED, ACTIVE, COMPLETED}, ordered by Enrollment.created_at ASC (identical timestamps broken by server request-arrival order)
      sibling_rank = index of this enrollment in rank_set (WITHDRAWN excluded — ranks shift on withdrawal)
      disc = sibling_discount_pcts[min(sibling_rank, len-1)]
      after_sibling = round_half_up(base * (1 - disc))          # round step 1 (per-line, to whole cents)
      early = enrollment.created_at < early_bird_deadline        # STRICT <
      line = round_half_up(after_sibling * (1 - early_bird_pct)) if early else after_sibling   # round step 2
    input_set: "Enrollments with status IN {REGISTERED, ACTIVE, COMPLETED} for the family+year; WITHDRAWN excluded"
    constants:
      ROUNDING: "round_half_up to whole cents at each starred step"
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional
        when: "at enrollment creation -> stored as Enrollment.estimated_tuition_cents, frozen thereafter"
        difference: "computed against the rank set as it exists at creation; later withdrawals shift siblings' ranks, so provisional != final"
      - name: final
        when: "at invoice issue -> TuitionInvoice.line_items[].line_cents"
        difference: "recomputed against the rank set at issue time; may differ from the frozen estimate"

  - name: invoice_gross_total
    trigger: "invoice issue"
    algorithm: aggregation
    formula: |
      line_items = [ enrollment_net_tuition(final) for each billable enrollment ]   # each line already rounded
      billable = family enrollments in year with status IN {REGISTERED, ACTIVE, COMPLETED}
      gross_cents = sum(line_cents)                    # SUM OF PRE-ROUNDED LINES — never round(sum(unrounded))
      total_due_cents = gross_cents + activity_fee_cents - award_cents
      credit_applied_cents = min(Family.credit_balance_cents, total_due_cents)
      balance_cents = total_due_cents - credit_applied_cents - paid_cents + late_fees_cents
    input_set: "billable enrollments as above; exactly one activity fee per invoice; award per assistance_award_amount"
    precision: "integer cents"

  - name: assistance_award_amount
    trigger: "invoice issue, when the family has an APPROVED AssistanceApplication for the year"
    algorithm: threshold
    formula: |
      PERCENT_OF_NET: award_cents = round_half_up(award_percent * gross_cents)         # gross only, NOT the activity fee
      FLAT_CAP:       award_cents = min(award_amount_cents, gross_cents)
    input_set: "the single APPROVED application for family+year (uniqueness enforced); gross_cents from invoice_gross_total"
    precision: "integer cents, round_half_up"
    variants:
      - name: percent_of_net
        when: "committee approves with award_method=PERCENT_OF_NET"
        difference: "award scales with gross tuition; percent applies to gross_cents only (activity fee excluded)"
      - name: flat_cap
        when: "committee approves with award_method=FLAT_CAP"
        difference: "award is the flat amount, capped at gross_cents; identical gross yields a different award than percent_of_net"

  - name: late_fee_accrual
    trigger: "POST /school/school-years/{id}/accrue-late-fees"
    algorithm: threshold
    formula: |
      for each invoice of the year with status IN {ISSUED, PARTIALLY_PAID}:
        eligible = (logical clock current date > invoice.due_date) AND (balance_cents >= late_fee_min_balance_cents)   # strict >, inclusive >=
        if eligible:
          snapshot = balance_cents                      # PRE-FEE SNAPSHOT — the fee being added this run is excluded
          fee = round_half_up(snapshot * late_fee_pct)  # no same-run compounding: fee never feeds its own base
          late_fees_cents += fee; balance_cents += fee
      one fee per invoice per call; a later call may add another fee if still eligible
    input_set: "invoices with status IN {ISSUED, PARTIALLY_PAID} for the year; PAID and VOID excluded"
    precision: "integer cents, round_half_up"

  - name: attendance_percentage
    trigger: "attendance post, session cancel, session hold, milestone evaluate"
    algorithm: aggregation
    formula: |
      weights: PRESENT = 1.0, EXCUSED = 0.5, ABSENT = 0.0
      eligible_sessions(s) = Sessions of the student's enrolled section with status HELD AND non-empty attendance array,
                             while the student's enrollment status was IN {REGISTERED, ACTIVE}
      denominator = count(eligible_sessions)
      numerator = sum over eligible_sessions of weight(student's entry); a student with no entry in a posted session weights 0.0 (treated ABSENT)
      current_pct = round_half_up(100 * numerator / denominator, 2 decimals); denominator == 0 -> 0.0
    input_set: "HELD sessions with posted attendance only; CANCELLED sessions and HELD-without-attendance excluded"
    precision: "2 decimal places percent, round_half_up"
    variants:
      - name: current
        when: "Milestone.current_attendance_pct; the ONLY variant used for the ELIGIBLE threshold"
        difference: "denominator counts only HELD sessions with posted attendance"
      - name: projected
        when: "Milestone.projected_attendance_pct (planning view)"
        difference: "best case: numerator += count(SCHEDULED sessions of the section), denominator += count(SCHEDULED sessions); identical data, different value"

  - name: volunteer_hours_total
    trigger: "entry add, entry void"
    algorithm: aggregation
    formula: |
      logged_hours = sum(entries[].hours where entry.status == ACTIVE)
      OPEN -> FULFILLED when logged_hours >= required_hours   # inclusive boundary
      FULFILLED -> OPEN when void drops logged_hours < required_hours
    input_set: "entries with status ACTIVE only; VOIDED excluded"
    precision: "hours are numbers, no rounding"

  - name: payment_waterfall
    trigger: "POST /school/families/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      open = family invoices with status IN {ISSUED, PARTIALLY_PAID}, sorted issued_at ASC (tie: created_at ASC)
      remaining = amount_cents
      for inv in open: applied = min(remaining, inv.balance_cents); inv.paid_cents += applied; inv.balance_cents -= applied; remaining -= applied
        inv.status: balance==0 -> PAID; 0<paid<total -> PARTIALLY_PAID
      remainder_cents = remaining -> Family.credit_balance_cents += remainder
    input_set: "invoices with status IN {ISSUED, PARTIALLY_PAID} only"
    precision: "integer cents"

  - name: withdrawal_credit
    trigger: "POST /school/enrollments/{id}/withdraw"
    algorithm: chronological
    formula: |
      pct = 1.0 if withdrawn_at < withdrawal_deadline
            else refund_pct_after_deadline if withdrawn_at < end_date
            else 0.0                                     # boundaries: exactly AT deadline -> second tier; exactly AT end_date -> 0
      billed = exists non-VOID invoice for family+year whose line_items contain a positive line for this enrollment
      collected = billed and that invoice.paid_cents > 0
      if collected and not credit_applied:
        credit = round_half_up(estimated_tuition_cents * pct)   # base is the FROZEN provisional estimate
        Family.credit_balance_cents += credit; credit_applied = true
    input_set: "the withdrawing enrollment, its family+year invoices (VOID excluded), year deadline dates"
    precision: "integer cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role appears in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership: Parent may only touch own family's subtree (family_id == X-User-ID); Teacher may only post attendance for sections where teacher_id == X-User-ID", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "family-scoped and attendance endpoints" }
  - { priority: 4, category: existence, check: "Path resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: request, check: "Required fields present; types, enum members, ranges valid (capacity >= 1, amount_cents > 0, hours > 0, start_time < end_time, start_date <= end_date, grade/level/day/method enum membership, decide payload conditional award fields)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /school/sections/{id}/enrollments, POST /school/families/{id}/invoices" }
  - { priority: 7, category: state, check: "State preconditions: transition's from-state holds; year OPEN where required (enroll, invoice issue, session create, assistance apply); session SCHEDULED for hold/cancel; session HELD for attendance; invoice supersede allowed; enrollment REGISTERED/ACTIVE for withdraw; application UNDER_REVIEW for decide; commitment OPEN/DEFAULTED for waive", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 7, category: state, check: "SchoolYear.status == OPEN for enrollment create, invoice issue, session create, assistance application create", error_id: ERR_SCHOOL_YEAR_NOT_OPEN, http_status: 409, applies_to: "year-gated endpoints" }
  - { priority: 8, category: business_safety, check: "Security & safety: ACTIVE SecurityPlan exists for year open and session hold; background_check_cleared for teacher vet; segregation of duties on assistance decide (decider != reviewed_by_user_id)", error_id: "ERR_SECURITY_PLAN_NOT_ACTIVE | ERR_BACKGROUND_CHECK_REQUIRED | ERR_SEGREGATION_OF_DUTIES", http_status: 409, applies_to: "year open, session hold, teacher vet, assistance decide" }
  - { priority: 9, category: business_temporal, check: "Calendar conflicts: closure closed-interval overlap; session_date inside a closure; session_date outside year start/end; hold of future-dated session", error_id: "ERR_CLOSURE_OVERLAP | ERR_SESSION_DATE_CLOSED | ERR_SESSION_DATE_OUT_OF_YEAR | ERR_SESSION_DATE_IN_FUTURE", http_status: 409, applies_to: "closure create, session create, session hold" }
  - { priority: 10, category: business_referential, check: "Cross-entity integrity: assigned teacher must be HIRED; section must be STAFFED for session create; attendance entries must reference students enrolled (REGISTERED/ACTIVE) in the section", error_id: "ERR_TEACHER_NOT_HIRED | ERR_SECTION_UNSTAFFED | ERR_STUDENT_NOT_ENROLLED", http_status: 422, applies_to: "section create/patch, session create, attendance post" }
  - { priority: 11, category: business_constraint, check: "Domain constraints: capacity (enrolled_count >= capacity), grade+hebrew_level exact match, duplicate enrollment (same student+year with status IN {REGISTERED, ACTIVE}), room/day/time half-open overlap, capacity patch below enrolled_count, at most one non-DENIED application per family+year, milestone ELIGIBLE for schedule, volunteer commitment FULFILLED for schedule, >= 1 billable enrollment for invoice issue", error_id: "ERR_SECTION_FULL | ERR_PLACEMENT_MISMATCH | ERR_DUPLICATE_ENROLLMENT | ERR_ROOM_TIME_CONFLICT | ERR_CAPACITY_BELOW_ENROLLED | ERR_APPLICATION_ALREADY_OPEN | ERR_MILESTONE_NOT_ELIGIBLE | ERR_VOLUNTEER_REQUIREMENT_UNMET | ERR_NO_BILLABLE_ENROLLMENTS", http_status: 409, applies_to: "enroll, section create/patch, assistance create, milestone schedule, invoice issue" }
  - { priority: 12, category: business_fiscal, check: "Money rules: re-issue requires the family's open TUITION invoice for the year to have paid_cents == 0; payment void requires remainder still in credit; award fields consistent with method", error_id: "ERR_INVOICE_HAS_PAYMENTS | ERR_CREDIT_ALREADY_APPLIED | ERR_AWARD_PARAMS_INVALID", http_status: 409, applies_to: "invoice issue, payment void, assistance decide" }

# =============================================================================
# 1.5 API Endpoint Table (59 endpoints)
# =============================================================================
endpoints:
  # --- SchoolYear ---
  - { method: POST, path: "/school/school-years", description: "Create a school year with full pricing/calendar config", roles: [SchoolAdmin], code: 201, input: [name, start_date, end_date, member_tuition_cents, non_member_tuition_cents, early_bird_pct, early_bird_deadline, sibling_discount_pcts, activity_fee_cents, volunteer_hours_required, volunteer_buyout_fee_cents, late_fee_pct, late_fee_min_balance_cents, tuition_due_date, withdrawal_deadline, refund_pct_after_deadline, attendance_threshold_pct], output: SchoolYear, side_effects: ["status=SETUP"] }
  - { method: GET, path: "/school/school-years/{id}", description: "Get a school year", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: [], output: SchoolYear, side_effects: [] }
  - { method: POST, path: "/school/school-years/{id}/open", description: "SETUP -> OPEN; requires an ACTIVE SecurityPlan", roles: [SchoolAdmin], code: 200, input: [], output: SchoolYear, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/school/school-years/{id}/close", description: "OPEN -> CLOSED with full sweep", roles: [SchoolAdmin], code: 200, input: [], output: SchoolYear, side_effects: ["SCHEDULED sessions -> CANCELLED (YEAR_CLOSE)", "volunteer sweep: OPEN+shortfall -> DEFAULTED + fee-only invoice (bumps Family.version); OPEN+met -> FULFILLED", "sections -> CLOSED", "enrollments REGISTERED/ACTIVE -> COMPLETED"] }
  - { method: POST, path: "/school/school-years/{id}/accrue-late-fees", description: "Ops checkpoint: one late-fee pass over eligible invoices", roles: [SchoolAdmin], code: 200, input: [], output: "{ accrued_invoice_ids: array, total_fees_cents: integer }", side_effects: ["late_fee_accrual on each eligible invoice (bumps invoice + Family.version)"] }

  # --- SecurityPlan ---
  - { method: POST, path: "/school/school-years/{id}/security-plan", description: "Create a security plan for the year (DRAFT)", roles: [SchoolAdmin], code: 201, input: [plan_document], output: SecurityPlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/school/school-years/{id}/security-plan", description: "List security plans for the year (0..n)", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: [], output: "SecurityPlan[]", side_effects: [] }
  - { method: POST, path: "/school/security-plans/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [SchoolAdmin], code: 200, input: [], output: SecurityPlan, side_effects: [] }
  - { method: POST, path: "/school/security-plans/{id}/approve", description: "SUBMITTED -> ACTIVE; supersedes prior ACTIVE plan of the year", roles: [SchoolAdmin], code: 200, input: [], output: SecurityPlan, side_effects: ["other ACTIVE plans for year -> SUPERSEDED", "approved_at set"] }
  - { method: POST, path: "/school/security-plans/{id}/reject", description: "SUBMITTED -> DRAFT (revision loop)", roles: [SchoolAdmin], code: 200, input: [], output: SecurityPlan, side_effects: [] }
  - { method: POST, path: "/school/security-plans/{id}/retire", description: "ACTIVE -> SUPERSEDED; leaves the year with no ACTIVE plan", roles: [SchoolAdmin], code: 200, input: [], output: SecurityPlan, side_effects: ["status ACTIVE -> SUPERSEDED"] }

  # --- CalendarClosure ---
  - { method: POST, path: "/school/school-years/{id}/closures", description: "Create a closure (holiday/break); closed-interval inclusive; cancels covered SCHEDULED sessions", roles: [SchoolAdmin], code: 201, input: [start_date, end_date, reason], output: CalendarClosure, side_effects: ["Sessions of the year's sections with session_date inside [start_date, end_date] inclusive and status SCHEDULED -> CANCELLED (CLOSURE)", "attendance recompute + milestone re-eval per affected student"] }
  - { method: GET, path: "/school/school-years/{id}/closures", description: "List closures for the year", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: [], output: "CalendarClosure[]", side_effects: [] }

  # --- Family / Student ---
  - { method: POST, path: "/school/families", description: "Create a family", roles: [SchoolAdmin], code: 201, input: [family_name, primary_email, membership_status], output: Family, side_effects: ["balances 0, version 1"] }
  - { method: GET, path: "/school/families/{id}", description: "Get a family (Parent: own only)", roles: [SchoolAdmin, Parent], code: 200, input: [], output: Family, side_effects: [] }
  - { method: POST, path: "/school/families/{id}/students", description: "Create a student (Parent: own family only)", roles: [SchoolAdmin, Parent], code: 201, input: [full_name, grade, hebrew_level], output: Student, side_effects: [] }
  - { method: GET, path: "/school/families/{id}/students", description: "List a family's students", roles: [SchoolAdmin, Parent], code: 200, input: [], output: "Student[]", side_effects: [] }

  # --- Teacher ---
  - { method: POST, path: "/school/teachers", description: "Create a teacher (APPLIED)", roles: [SchoolAdmin], code: 201, input: [full_name, email, "background_check_cleared?"], output: Teacher, side_effects: ["status=APPLIED"] }
  - { method: GET, path: "/school/teachers/{id}", description: "Get a teacher", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: [], output: Teacher, side_effects: [] }
  - { method: POST, path: "/school/teachers/{id}/vet", description: "APPLIED -> VETTED; requires background_check_cleared", roles: [SchoolAdmin], code: 200, input: [], output: Teacher, side_effects: [] }
  - { method: POST, path: "/school/teachers/{id}/hire", description: "VETTED -> HIRED", roles: [SchoolAdmin], code: 200, input: [], output: Teacher, side_effects: [] }
  - { method: POST, path: "/school/teachers/{id}/separate", description: "VETTED|HIRED -> SEPARATED; unstaffs sections and cancels their SCHEDULED sessions", roles: [SchoolAdmin], code: 200, input: [], output: Teacher, side_effects: ["Sections (OPEN/FULL) -> teacher_id=null, UNSTAFFED", "their SCHEDULED sessions -> CANCELLED (TEACHER_SEPARATION)", "attendance recompute + milestone re-eval"] }

  # --- Section ---
  - { method: POST, path: "/school/school-years/{id}/sections", description: "Create a section; room/day/time half-open overlap rejected", roles: [SchoolAdmin], code: 201, input: [grade, hebrew_level, capacity, room, day_of_week, start_time, end_time, "teacher_id?"], output: Section, side_effects: ["status=OPEN, enrolled_count=0, staffing derived"] }
  - { method: GET, path: "/school/sections/{id}", description: "Get a section", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: [], output: Section, side_effects: [] }
  - { method: GET, path: "/school/sections", description: "List sections with filters", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: ["school_year_id?", "teacher_id?", "status?"], output: "Section[]", side_effects: [] }
  - { method: PATCH, path: "/school/sections/{id}", description: "Reassign teacher (must be HIRED; re-staffs) and/or change capacity (>= enrolled_count); not on CLOSED", roles: [SchoolAdmin], code: 200, input: ["teacher_id?", "capacity?"], output: Section, side_effects: ["teacher set -> staffing_status=STAFFED", "increments Section.version"] }

  # --- Enrollment ---
  - { method: POST, path: "/school/sections/{id}/enrollments", description: "Enroll a student (OCC on Section.version); auto-creates Milestone + VolunteerCommitment on first use", roles: [SchoolAdmin, Parent], code: 201, input: [student_id, expected_section_version], output: Enrollment, side_effects: ["validates year OPEN, grade+level match, capacity, duplicate", "enrolled_count += 1; Section.status OPEN->FULL at capacity", "increments Section.version by 1", "estimated_tuition_cents = enrollment_net_tuition(provisional)", "Milestone auto-created (TRACKING) if student's first enrollment this year", "VolunteerCommitment auto-created (OPEN) if family's first enrollment this year"] }
  - { method: GET, path: "/school/enrollments/{id}", description: "Get an enrollment", roles: [SchoolAdmin, Parent], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: GET, path: "/school/enrollments", description: "List enrollments with filters (Parent: own family only)", roles: [SchoolAdmin, Parent], code: 200, input: ["family_id?", "student_id?", "section_id?", "school_year_id?", "status?"], output: "Enrollment[]", side_effects: [] }
  - { method: POST, path: "/school/enrollments/{id}/withdraw", description: "REGISTERED|ACTIVE -> WITHDRAWN with refund-tier credit", roles: [SchoolAdmin, Parent], code: 200, input: [], output: Enrollment, side_effects: ["Section.enrolled_count -= 1; FULL->OPEN if below capacity (Section.version bumps)", "withdrawal_credit_pct set per tiers", "conditional Family credit per withdrawal_credit calc (Family.version bumps when credited)"] }

  # --- TuitionInvoice ---
  - { method: POST, path: "/school/families/{id}/invoices", description: "Issue (or re-issue/supersede) the family's TUITION invoice for a year (OCC on Family.version)", roles: [SchoolAdmin], code: 201, input: [school_year_id, expected_family_version], output: TuitionInvoice, side_effects: ["kind=TUITION; prior open (ISSUED/PARTIALLY_PAID) TUITION invoice for family+year must have paid_cents == 0 and -> VOID (supersede); VOLUNTEER_FEE invoices untouched", "lines = enrollment_net_tuition(final) per billable enrollment", "award applied when APPROVED application exists", "Family credit consumed (credit_applied_cents)", "Family.outstanding_balance_cents recomputed; increments Family.version by 1"] }
  - { method: GET, path: "/school/invoices/{id}", description: "Get an invoice", roles: [SchoolAdmin, Parent], code: 200, input: [], output: TuitionInvoice, side_effects: [] }
  - { method: GET, path: "/school/invoices", description: "List invoices with filters (Parent: own family only)", roles: [SchoolAdmin, Parent], code: 200, input: ["family_id?", "school_year_id?", "status?", "assistance_application_id?"], output: "TuitionInvoice[]", side_effects: [] }

  # --- Payment ---
  - { method: POST, path: "/school/families/{id}/payments", description: "Post a payment; waterfall to open invoices oldest-first; remainder to credit", roles: [SchoolAdmin, Parent], code: 201, input: [amount_cents, method], output: Payment, side_effects: ["payment_waterfall applications", "invoice status auto-transitions (ISSUED/PARTIALLY_PAID/PAID)", "Family balances recomputed; Family.version bumps"] }
  - { method: GET, path: "/school/families/{id}/payments", description: "List a family's payments", roles: [SchoolAdmin, Parent], code: 200, input: [], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/school/payments/{id}/void", description: "Void a POSTED payment; reverses applications and remainder", roles: [SchoolAdmin], code: 200, input: [], output: Payment, side_effects: ["applications reversed; invoice status regresses PAID->PARTIALLY_PAID->ISSUED", "remainder withdrawn from Family credit", "Family.version bumps"] }

  # --- AssistanceApplication ---
  - { method: POST, path: "/school/families/{id}/assistance-applications", description: "Apply for tuition assistance (Parent: own family)", roles: [SchoolAdmin, Parent], code: 201, input: [school_year_id, reason, "requested_amount_cents?"], output: AssistanceApplication, side_effects: ["status=SUBMITTED", "rejects when any non-DENIED application exists for family+year"] }
  - { method: GET, path: "/school/families/{id}/assistance-applications", description: "List a family's applications", roles: [SchoolAdmin, Parent], code: 200, input: [], output: "AssistanceApplication[]", side_effects: [] }
  - { method: GET, path: "/school/assistance-applications/{id}", description: "Get an application", roles: [SchoolAdmin, AssistanceOfficer, Parent], code: 200, input: [], output: AssistanceApplication, side_effects: [] }
  - { method: GET, path: "/school/assistance-applications", description: "List applications with filters (review queue)", roles: [SchoolAdmin, AssistanceOfficer], code: 200, input: ["family_id?", "school_year_id?", "status?"], output: "AssistanceApplication[]", side_effects: [] }
  - { method: POST, path: "/school/assistance-applications/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW; records reviewed_by_user_id", roles: [AssistanceOfficer], code: 200, input: [], output: AssistanceApplication, side_effects: ["reviewed_by_user_id = X-User-ID"] }
  - { method: POST, path: "/school/assistance-applications/{id}/request-info", description: "UNDER_REVIEW -> SUBMITTED (info-request loop)", roles: [AssistanceOfficer], code: 200, input: [], output: AssistanceApplication, side_effects: [] }
  - { method: POST, path: "/school/assistance-applications/{id}/decide", description: "UNDER_REVIEW -> APPROVED | DENIED; segregation of duties enforced", roles: [SchoolAdmin], code: 200, input: [decision, "award_method?", "award_percent?", "award_amount_cents?"], output: AssistanceApplication, side_effects: ["award snapshot persisted on APPROVED", "decided_by_user_id set"] }

  # --- Session / Attendance ---
  - { method: POST, path: "/school/sections/{id}/sessions", description: "Schedule a session; requires STAFFED section, OPEN year, no closure", roles: [SchoolAdmin], code: 201, input: [session_date], output: Session, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/school/sections/{id}/sessions", description: "List a section's sessions", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: [], output: "Session[]", side_effects: [] }
  - { method: GET, path: "/school/sessions/{id}", description: "Get a session (includes attendance array)", roles: [SchoolAdmin, AssistanceOfficer, Teacher, Parent], code: 200, input: [], output: Session, side_effects: [] }
  - { method: POST, path: "/school/sessions/{id}/hold", description: "SCHEDULED -> HELD; requires ACTIVE plan and date reached", roles: [SchoolAdmin], code: 200, input: [], output: Session, side_effects: ["REGISTERED enrollments of section -> ACTIVE"] }
  - { method: POST, path: "/school/sessions/{id}/cancel", description: "SCHEDULED -> CANCELLED (MANUAL)", roles: [SchoolAdmin], code: 200, input: [], output: Session, side_effects: ["attendance recompute + milestone re-eval per enrolled student"] }
  - { method: POST, path: "/school/sessions/{id}/attendance", description: "Upsert attendance entries on a HELD session (Teacher: own section only)", roles: [SchoolAdmin, Teacher], code: 200, input: [entries], output: Session, side_effects: ["attendance array upserted by student_id", "attendance_percentage recompute + milestone re-eval per enrolled student"] }

  # --- Milestone ---
  - { method: GET, path: "/school/milestones/{id}", description: "Get a milestone", roles: [SchoolAdmin, Parent], code: 200, input: [], output: Milestone, side_effects: [] }
  - { method: GET, path: "/school/milestones", description: "List milestones with filters (Parent: own family only)", roles: [SchoolAdmin, Parent], code: 200, input: ["student_id?", "family_id?", "school_year_id?", "status?"], output: "Milestone[]", side_effects: [] }
  - { method: POST, path: "/school/milestones/{id}/evaluate", description: "Recompute attendance pcts and apply TRACKING<->ELIGIBLE", roles: [SchoolAdmin], code: 200, input: [], output: Milestone, side_effects: ["current/projected pcts refreshed", "status may flip per threshold"] }
  - { method: POST, path: "/school/milestones/{id}/schedule", description: "ELIGIBLE -> SCHEDULED; requires family VolunteerCommitment FULFILLED", roles: [SchoolAdmin], code: 200, input: ["ceremony_date?"], output: Milestone, side_effects: [] }
  - { method: POST, path: "/school/milestones/{id}/complete", description: "SCHEDULED -> COMPLETED", roles: [SchoolAdmin], code: 200, input: [], output: Milestone, side_effects: [] }

  # --- VolunteerCommitment ---
  - { method: GET, path: "/school/volunteer-commitments/{id}", description: "Get a commitment (includes entries array)", roles: [SchoolAdmin, Parent], code: 200, input: [], output: VolunteerCommitment, side_effects: [] }
  - { method: GET, path: "/school/volunteer-commitments", description: "List commitments with filters (Parent: own family only)", roles: [SchoolAdmin, Parent], code: 200, input: ["family_id?", "school_year_id?", "status?"], output: "VolunteerCommitment[]", side_effects: [] }
  - { method: POST, path: "/school/volunteer-commitments/{id}/entries", description: "Log volunteer hours (Parent: own family); auto FULFILLED at threshold", roles: [SchoolAdmin, Parent], code: 201, input: [hours, note], output: VolunteerCommitment, side_effects: ["entry appended (entry_id server-minted)", "logged_hours recomputed", "OPEN -> FULFILLED at >= required_hours"] }
  - { method: POST, path: "/school/volunteer-commitments/{id}/entries/{entry_id}/void", description: "Void an entry; may regress FULFILLED -> OPEN and revert SCHEDULED milestones", roles: [SchoolAdmin], code: 200, input: [], output: VolunteerCommitment, side_effects: ["entry.status -> VOIDED", "logged_hours recomputed", "FULFILLED -> OPEN when below required", "family SCHEDULED milestones -> ELIGIBLE on regression"] }
  - { method: POST, path: "/school/volunteer-commitments/{id}/waive", description: "OPEN|DEFAULTED -> WAIVED (hardship); voids buyout fee invoice when DEFAULTED", roles: [SchoolAdmin], code: 200, input: [], output: VolunteerCommitment, side_effects: ["DEFAULTED -> WAIVED voids the buyout fee invoice"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/school/_clock/set_current_utc", description: "Set the logical clock. Server default at startup is exactly 2026-08-01T00:00:00Z (never wall-clock); all deadline/expiry/session-date rules read this clock.", roles: [SchoolAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog (27 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Parent touches another family's subtree, or Teacher posts attendance for a section they do not teach" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, or range violation (capacity < 1, amount_cents <= 0, hours <= 0, start_time >= end_time, start_date > end_date)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_SCHOOL_YEAR_NOT_OPEN, http: 409, condition: "Operation requires SchoolYear.status == OPEN" }
  - { id: ERR_SECURITY_PLAN_NOT_ACTIVE, http: 409, condition: "No ACTIVE SecurityPlan for the year (year open, session hold)" }
  - { id: ERR_BACKGROUND_CHECK_REQUIRED, http: 409, condition: "Vetting a teacher whose background_check_cleared is false" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "decide caller's X-User-ID equals reviewed_by_user_id" }
  - { id: ERR_CLOSURE_OVERLAP, http: 409, condition: "Closure overlaps an existing closure under closed-interval inclusive semantics (adjacent start == end+1 day is allowed)" }
  - { id: ERR_SESSION_DATE_CLOSED, http: 409, condition: "session_date falls inside a CalendarClosure" }
  - { id: ERR_SESSION_DATE_OUT_OF_YEAR, http: 409, condition: "session_date outside [SchoolYear.start_date, SchoolYear.end_date]" }
  - { id: ERR_SESSION_DATE_IN_FUTURE, http: 409, condition: "Holding a session whose session_date is after the logical-clock current date" }
  - { id: ERR_TEACHER_NOT_HIRED, http: 422, condition: "Assigned teacher is not HIRED (APPLIED/VETTED/SEPARATED)" }
  - { id: ERR_SECTION_UNSTAFFED, http: 422, condition: "Creating a session on a section whose staffing_status is UNSTAFFED" }
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 422, condition: "Attendance entry references a student without a REGISTERED/ACTIVE enrollment in the section" }
  - { id: ERR_SECTION_FULL, http: 409, condition: "Enrollment would exceed capacity (enrolled_count >= capacity)" }
  - { id: ERR_PLACEMENT_MISMATCH, http: 409, condition: "Student grade or hebrew_level does not exactly match the section" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Student already has an enrollment this year with status IN {REGISTERED, ACTIVE}" }
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "Same year+room+day_of_week with half-open [start_time, end_time) overlap (back-to-back allowed)" }
  - { id: ERR_CAPACITY_BELOW_ENROLLED, http: 409, condition: "PATCH capacity below current enrolled_count" }
  - { id: ERR_APPLICATION_ALREADY_OPEN, http: 409, condition: "Family already has a non-DENIED application for the year" }
  - { id: ERR_MILESTONE_NOT_ELIGIBLE, http: 409, condition: "schedule requires Milestone.status == ELIGIBLE" }
  - { id: ERR_VOLUNTEER_REQUIREMENT_UNMET, http: 409, condition: "schedule requires the family's VolunteerCommitment.status == FULFILLED" }
  - { id: ERR_NO_BILLABLE_ENROLLMENTS, http: 409, condition: "Invoice issue requires >= 1 billable enrollment (status IN {REGISTERED, ACTIVE, COMPLETED})" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "Re-issue blocked: the open invoice for family+year has paid_cents > 0" }
  - { id: ERR_CREDIT_ALREADY_APPLIED, http: 409, condition: "Payment void blocked: remainder_cents already consumed from Family credit" }
  - { id: ERR_AWARD_PARAMS_INVALID, http: 409, condition: "decision=APPROVED without award_method, or method's matching award field missing/invalid" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "School administrator; operates the entire surface"
    identity: opaque
    exclusive_operations:
      - "SchoolYear create/open/close/accrue-late-fees"
      - "SecurityPlan create/submit/approve/reject/retire"
      - "CalendarClosure create"
      - "Family create; Teacher create/vet/hire/separate"
      - "Section create/patch; Session create/hold/cancel"
      - "Invoice issue; Payment void"
      - "Assistance decide"
      - "Milestone evaluate/schedule/complete"
      - "Volunteer entry void; commitment waive"
      - "POST /school/_clock/set_current_utc"
    shared_operations:
      - "Student create; Enrollment create/withdraw; Payment post; Assistance application create"
      - "Attendance post; all GET endpoints"
  - name: AssistanceOfficer
    description: "Tuition assistance committee reviewer; reviews but cannot decide (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "Assistance start-review; request-info"
    shared_operations:
      - "GET /school/assistance-applications (review queue); GET school-years, sections, sessions, teachers, security plans, closures"
  - name: Teacher
    description: "Section teacher; takes attendance for own sections"
    identity: "entity_backed:Teacher"
    exclusive_operations: []
    shared_operations:
      - "POST /school/sessions/{id}/attendance (own sections: section.teacher_id == X-User-ID)"
      - "GET school-years, sections, sessions, teachers, security plans, closures"
  - name: Parent
    description: "Family parent/guardian; manages own family's enrollment, payments, assistance, volunteering"
    identity: "entity_backed:Family"
    exclusive_operations: []
    shared_operations:
      - "Family/Student/Enrollment/Invoice/Payment/Assistance/Milestone/Volunteer reads and writes scoped to X-User-ID == family_id"
      - "GET school-years, sections, sessions, teachers, security plans, closures"
