scenario: |
  Used car trading platform: vehicle assessment with VIN-based history query, accident and maintenance
  record retrieval, on-site inspection report, mileage verification, and price valuation; seller listing
  with vehicle information submission, document authenticity check, photo upload requirements, listing
  review, and shelving/delisting management; buyer bidding and fixed-price purchase with bid increment
  rules, deposit hold, fixed-price reservation, and multi-buyer queue handling; ownership transfer
  process with required document checklist, appointment scheduling at vehicle administration office,
  transfer status tracking, license plate handling, and transfer-failure rollback; loan application and
  approval with lender selection, credit check, down-payment ratio validation, loan-amount and term
  calculation, approval workflow, and disbursement tracking; warranty period calculation with
  warranty-package selection, coverage scope definition, effective-date and expiration management, and
  claim handling; dispute mediation with complaint submission, evidence collection, multi-stage
  mediation, third-party inspection arrangement, and refund or compensation execution; event-driven
  synchronization with vehicle administration, banking, insurance, and payment systems; audit logging
  for transaction status and ownership changes.

domain_name: used-car-trading
api_prefix: /vehicles

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - idempotency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: saga

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the seller (individual or business)
      - name: id_document_number
        type: string
        source: input
        description: Government-issued ID or business registration number
        constraints: "unique"
      - name: phone
        type: string
        source: input
        description: Contact phone number
      - name: kyc_status
        type: enum
        source: system
        description: KYC verification status
        default: PENDING
        constraints: "one of {PENDING, VERIFIED, REJECTED}"
      - name: total_listings
        type: integer
        source: computed
        description: Count of listings ever created by this seller
        default: 0

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the buyer
      - name: id_document_number
        type: string
        source: input
        description: Government-issued ID
        constraints: "unique"
      - name: phone
        type: string
        source: input
        description: Contact phone number
      - name: deposit_balance_cents
        type: integer
        source: computed
        description: Sum of currently HELD deposit amounts across this buyer's bids and reservations, in cents
        default: 0
      - name: deposit_held_cents
        type: integer
        source: computed
        description: Total deposit currently held against this buyer (must equal deposit_balance_cents at all times — invariant)
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: Vehicle Identification Number, 17 characters
        constraints: "exactly 17 alphanumeric chars excluding I/O/Q; unique"
      - name: make
        type: string
        source: input
        description: Manufacturer brand
      - name: model
        type: string
        source: input
        description: Model name
      - name: model_year
        type: integer
        source: input
        description: Calendar year of manufacture
        constraints: "1980 <= model_year <= current_year"
      - name: declared_mileage_km
        type: integer
        source: input
        description: Mileage declared by seller at submission, in kilometers
        constraints: ">= 0"
      - name: verified_mileage_km
        type: integer
        source: computed
        description: Verified mileage from latest inspection (overwrites declared)
        default: null
      - name: color
        type: string
        source: input
        description: Exterior color
      - name: vehicle_status
        type: enum
        source: system
        description: Lifecycle status of the vehicle record
        default: REGISTERED
        constraints: "one of {REGISTERED, ASSESSED, LISTED, SOLD, ARCHIVED}"
      - name: ownership_seller_id
        type: string
        source: computed
        description: Current owner — points to the seller's id while LISTED/ASSESSED, becomes the new buyer's seller-twin id post-transfer
      - name: assessment_score
        type: integer
        source: computed
        description: Latest assessment composite score (0..100); null until first AssessmentReport finalized
        default: null
      - name: valuation_cents
        type: integer
        source: computed
        description: Latest finalized price valuation in cents
        default: null

  - name: AssessmentReport
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: Foreign key to Vehicle.id
      - name: vin_history_records
        type: array
        source: input
        description: Each item {date, source, event_type ∈ {ACCIDENT, MAINTENANCE, RECALL, REGISTRATION}, severity ∈ {NONE, MINOR, MAJOR}}
      - name: accident_count
        type: integer
        source: computed
        description: Count of items in vin_history_records where event_type=ACCIDENT
        default: 0
      - name: major_accident_count
        type: integer
        source: computed
        description: Count of accident records with severity=MAJOR
        default: 0
      - name: maintenance_count
        type: integer
        source: computed
        description: Count of items with event_type=MAINTENANCE
        default: 0
      - name: inspector_user_id
        type: string
        source: input
        description: Opaque inspector id; required to finalize on-site inspection
      - name: onsite_findings
        type: object
        source: input
        description: "{exterior_grade ∈ {A,B,C,D}, interior_grade, mechanical_grade, mileage_km_observed}"
      - name: declared_mileage_km
        type: integer
        source: system
        description: Snapshot of Vehicle.declared_mileage_km at finalization for verification audit
        default: null
      - name: mileage_discrepancy_flag
        type: boolean
        source: computed
        description: True if abs(onsite_findings.mileage_km_observed - declared_mileage_km) / max(declared_mileage_km,1) > 0.05 OR observed < declared
        default: false
      - name: provisional_valuation_cents
        type: integer
        source: computed
        description: Estimate produced at draft stage (uses declared mileage and history record counts only)
        default: null
      - name: final_valuation_cents
        type: integer
        source: computed
        description: Valuation produced at FINALIZED state (uses verified mileage, on-site grades, and discrepancy penalty)
        default: null
      - name: status
        type: enum
        source: system
        description: Report lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ONSITE_PENDING, FINALIZED, SUPERSEDED}"

  - name: Listing
    parent: Vehicle
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: Foreign key to Vehicle.id
      - name: seller_id
        type: string
        source: input
        description: Foreign key to Seller.id
      - name: assessment_report_id
        type: string
        source: input
        description: Pinned report; must be FINALIZED at the time of submit_for_review
      - name: assessment_report_version
        type: integer
        source: system
        description: Frozen version of the AssessmentReport at submit time (version-pinning)
      - name: sale_mode
        type: enum
        source: input
        description: Sale model
        constraints: "one of {AUCTION, FIXED_PRICE}"
      - name: ask_price_cents
        type: integer
        source: input
        description: For FIXED_PRICE — the fixed price; for AUCTION — the starting price
      - name: reserve_price_cents
        type: integer
        source: input
        description: For AUCTION only — minimum acceptable winning bid; null for FIXED_PRICE
        default: null
      - name: photo_urls
        type: array
        source: input
        description: List of image URLs; minimum 6 required to submit_for_review
      - name: documents_authentic_flag
        type: boolean
        source: input
        description: Seller's attestation; combined with admin doc-authenticity check
        default: false
      - name: doc_check_status
        type: enum
        source: system
        description: Admin documentation authenticity outcome
        default: NOT_RUN
        constraints: "one of {NOT_RUN, PASS, FAIL}"
      - name: status
        type: enum
        source: system
        description: Listing lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_REVIEW, ACTIVE, RESERVED, SOLD, DELISTED, REJECTED}"
      - name: active_bid_id
        type: string
        source: computed
        description: For AUCTION — id of current highest LIVE Bid; null until first bid
        default: null
      - name: reservation_buyer_id
        type: string
        source: computed
        description: For FIXED_PRICE — buyer at the head of the reservation queue (current holder), null otherwise
        default: null

  - name: Bid
    parent: Listing
    common_fields: false
    fields:
      - name: listing_id
        type: string
        source: input
        description: Foreign key to Listing.id (must be AUCTION mode, ACTIVE)
      - name: buyer_id
        type: string
        source: input
        description: Foreign key to Buyer.id
      - name: amount_cents
        type: integer
        source: input
        description: Bid amount in cents
      - name: deposit_cents
        type: integer
        source: computed
        description: Deposit held against this bid = ceil(amount_cents * 0.10), held while LIVE
      - name: status
        type: enum
        source: system
        description: Bid status
        default: LIVE
        constraints: "one of {LIVE, OUTBID, WON, LOST, CANCELLED}"
      - name: placed_at
        type: datetime
        source: system
        description: ISO 8601 timestamp at placement (server-minted)

  - name: Reservation
    parent: Listing
    common_fields: false
    fields:
      - name: listing_id
        type: string
        source: input
        description: Foreign key to Listing.id (must be FIXED_PRICE mode)
      - name: buyer_id
        type: string
        source: input
        description: Foreign key to Buyer.id
      - name: queue_position
        type: integer
        source: system
        description: 1-based position; position 1 is the active holder
      - name: deposit_cents
        type: integer
        source: computed
        description: Held deposit = ceil(Listing.ask_price_cents * 0.05)
      - name: status
        type: enum
        source: system
        description: Reservation status
        default: QUEUED
        constraints: "one of {QUEUED, HOLDING, EXPIRED, CONVERTED, CANCELLED}"
      - name: hold_expires_at
        type: datetime
        source: system
        description: When position-1 holder's window expires; null while QUEUED at position > 1
        default: null
      - name: created_at
        type: datetime
        source: system
        description: Used as tie-break (FIFO) when ranking queue position

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: Foreign key to Listing.id
      - name: vehicle_id
        type: string
        source: system
        description: Snapshot of Listing.vehicle_id at order creation
      - name: seller_id
        type: string
        source: system
        description: Snapshot
      - name: buyer_id
        type: string
        source: system
        description: Buyer fulfilling this order
      - name: agreed_price_cents
        type: integer
        source: system
        description: Final accepted price in cents (winning bid amount, or fixed price)
      - name: payment_method
        type: enum
        source: input
        description: How the purchase is funded
        default: FULL_PAYMENT
        constraints: "one of {FULL_PAYMENT, LOAN}"
      - name: loan_id
        type: string
        source: computed
        description: Foreign key to Loan when payment_method=LOAN
        default: null
      - name: down_payment_cents
        type: integer
        source: computed
        description: For LOAN, agreed_price_cents - approved loan principal; for FULL_PAYMENT equals agreed_price_cents
      - name: status
        type: enum
        source: system
        description: Purchase order lifecycle
        default: PENDING_PAYMENT
        constraints: "one of {PENDING_PAYMENT, PAID, AWAITING_TRANSFER, COMPLETED, CANCELLED, REFUNDED}"
      - name: paid_at
        type: datetime
        source: system
        description: Timestamp at which payment_received event finalized
        default: null

  - name: TransferCase
    parent: PurchaseOrder
    common_fields: true
    fields:
      - name: purchase_order_id
        type: string
        source: input
        description: Foreign key to PurchaseOrder.id
      - name: required_documents
        type: array
        source: computed
        description: "Checklist items, each {doc_type ∈ {ID_BUYER, ID_SELLER, TITLE, REGISTRATION, RELEASE_OF_LIEN, EMISSIONS_CERT}, submitted: bool, doc_url: string|null}"
      - name: appointment_at
        type: datetime
        source: input
        description: Scheduled DMV slot (ISO 8601)
        default: null
      - name: dmv_office_code
        type: string
        source: input
        description: Identifier for vehicle administration office
        default: null
      - name: status
        type: enum
        source: system
        description: Transfer lifecycle
        default: DOCS_PENDING
        constraints: "one of {DOCS_PENDING, APPOINTMENT_BOOKED, IN_PROGRESS, SUCCEEDED, FAILED, ROLLED_BACK}"
      - name: license_plate_action
        type: enum
        source: input
        description: How the buyer wants the plate handled
        default: REASSIGN
        constraints: "one of {KEEP_OLD, REASSIGN, NEW_NUMBER}"
      - name: new_plate_number
        type: string
        source: input
        description: Required when license_plate_action=NEW_NUMBER, otherwise must be null
        default: null
      - name: failure_reason
        type: string
        source: input
        description: Set on FAILED transitions; null otherwise
        default: null
      - name: rolled_back_at
        type: datetime
        source: system
        description: Set when rollback completes
        default: null

  - name: Loan
    parent: PurchaseOrder
    common_fields: true
    fields:
      - name: purchase_order_id
        type: string
        source: input
        description: Foreign key to PurchaseOrder.id (1:1)
      - name: buyer_id
        type: string
        source: input
        description: Borrower
      - name: lender_code
        type: string
        source: input
        description: One of supported lenders {LENDER_A, LENDER_B, LENDER_C}
        constraints: "one of {LENDER_A, LENDER_B, LENDER_C}"
      - name: requested_principal_cents
        type: integer
        source: input
        description: Principal the buyer requests
      - name: approved_principal_cents
        type: integer
        source: computed
        description: Principal the lender approves; <= requested
        default: null
      - name: down_payment_ratio_bp
        type: integer
        source: input
        description: Down-payment ratio in basis points (e.g., 2000 = 20%); must be >= lender's minimum
      - name: term_months
        type: integer
        source: input
        description: Loan term, integer months, 12..72
        constraints: "one of {12,24,36,48,60,72}"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: Computed amortization payment per month
        default: null
      - name: total_interest_cents
        type: integer
        source: computed
        description: Total interest over the term
        default: null
      - name: credit_score
        type: integer
        source: input
        description: Buyer's credit score from external credit-check event (300..850)
        default: null
      - name: status
        type: enum
        source: system
        description: Loan lifecycle
        default: APPLIED
        constraints: "one of {APPLIED, CREDIT_CHECKING, APPROVED, REJECTED, DISBURSED, CANCELLED}"
      - name: disbursed_at
        type: datetime
        source: system
        description: Timestamp of bank disbursement event
        default: null

  - name: Warranty
    parent: PurchaseOrder
    common_fields: true
    fields:
      - name: purchase_order_id
        type: string
        source: input
        description: Foreign key to PurchaseOrder.id (1:1)
      - name: package_code
        type: enum
        source: input
        description: Selected warranty package
        constraints: "one of {BASIC, STANDARD, PREMIUM}"
      - name: coverage_scope
        type: array
        source: computed
        description: Components covered, derived from package_code
      - name: effective_at
        type: datetime
        source: system
        description: Warranty start — equals PurchaseOrder.paid_at moment
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: effective_at + package_code.duration_months; null until effective_at set
        default: null
      - name: status
        type: enum
        source: system
        description: Warranty lifecycle
        default: PENDING_ACTIVATION
        constraints: "one of {PENDING_ACTIVATION, ACTIVE, EXPIRED, VOIDED}"
      - name: claims_count
        type: integer
        source: computed
        description: Count of claims linked to this warranty
        default: 0
      - name: total_claim_payout_cents
        type: integer
        source: computed
        description: Sum of approved claim payouts
        default: 0

  - name: WarrantyClaim
    parent: Warranty
    common_fields: true
    fields:
      - name: warranty_id
        type: string
        source: input
        description: Foreign key to Warranty.id
      - name: component
        type: string
        source: input
        description: Component for which the claim is filed (must be in coverage_scope)
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Repair amount requested
      - name: approved_amount_cents
        type: integer
        source: computed
        description: Amount approved per warranty rules; null while PENDING
        default: null
      - name: status
        type: enum
        source: system
        description: Claim lifecycle
        default: PENDING
        constraints: "one of {PENDING, APPROVED, REJECTED, PAID}"

  - name: DisputeCase
    parent: PurchaseOrder
    common_fields: true
    fields:
      - name: purchase_order_id
        type: string
        source: input
        description: Foreign key to PurchaseOrder.id
      - name: complainant_role
        type: enum
        source: input
        description: Who filed the complaint
        constraints: "one of {BUYER, SELLER}"
      - name: complaint_text
        type: string
        source: input
        description: Free-text description of the issue
      - name: evidence_items
        type: array
        source: input
        description: "List of {url, kind ∈ {PHOTO, VIDEO, DOC, MESSAGE_LOG}}"
        default: []
      - name: stage
        type: enum
        source: system
        description: Mediation stage; cyclic between SUBMITTED and EVIDENCE_REVIEW until resolution
        default: SUBMITTED
        constraints: "one of {SUBMITTED, EVIDENCE_REVIEW, THIRD_PARTY_INSPECTION, RESOLUTION_PROPOSED, CLOSED}"
      - name: round_count
        type: integer
        source: computed
        description: Number of times we re-entered EVIDENCE_REVIEW; capped at 3
        default: 0
      - name: third_party_report_url
        type: string
        source: input
        description: Set when a third-party inspection finalizes
        default: null
      - name: resolution
        type: enum
        source: system
        description: Final outcome
        default: null
        constraints: "one of {REFUND_FULL, REFUND_PARTIAL, COMPENSATE_SELLER, NO_ACTION}"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: Refund/compensation actually executed; computed from resolution + dispute_compensation calc
        default: null

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - name: source
        type: enum
        source: input
        description: Originating external system
        constraints: "one of {DMV, BANK, INSURANCE, PAYMENT}"
      - name: event_type
        type: string
        source: input
        description: "e.g. payment_received, transfer_succeeded, transfer_failed, credit_check_returned, disbursement_completed"
      - name: idempotency_key
        type: string
        source: input
        description: Unique key per external event; duplicate keys are no-ops
        constraints: "unique"
      - name: payload
        type: object
        source: input
        description: Event-specific JSON payload
      - name: processed
        type: boolean
        source: system
        description: True after event has been applied; duplicates set processed=true with no further effect
        default: false

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the caller (or "system" for automatic transitions)
      - name: actor_id
        type: string
        source: system
        description: X-User-ID of the caller
      - name: target_entity
        type: string
        source: system
        description: Entity name affected
      - name: target_id
        type: string
        source: system
        description: Affected entity id
      - name: event_type
        type: enum
        source: system
        description: Audit category
        constraints: "one of {STATE_TRANSITION, OWNERSHIP_CHANGE, FINANCIAL_HOLD, FINANCIAL_RELEASE, EXTERNAL_SYNC}"
      - name: from_value
        type: string
        source: system
        description: Previous value (status, owner_id, balance, etc.)
        default: null
      - name: to_value
        type: string
        source: system
        description: New value
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: ISO 8601 timestamp of the event

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Vehicle
    initial_state: REGISTERED
    terminal_states: [ARCHIVED]
    transitions:
      - from: REGISTERED
        to: ASSESSED
        trigger: "First AssessmentReport for this vehicle transitions to FINALIZED"
        actor: system
        preconditions:
          - "AssessmentReport.vehicle_id = this.id"
          - "AssessmentReport.status transitions DRAFT/ONSITE_PENDING → FINALIZED"
        side_effects:
          - "Vehicle.assessment_score := AssessmentReport.onsite composite (see calc vehicle_assessment_score)"
          - "Vehicle.valuation_cents := AssessmentReport.final_valuation_cents"
      - from: ASSESSED
        to: LISTED
        trigger: "POST /listings transitions a Listing of this vehicle to ACTIVE"
        actor: system
        preconditions:
          - "Listing.vehicle_id = this.id"
          - "Listing.status transitions UNDER_REVIEW → ACTIVE"
        side_effects: ["No vehicle field changes other than updated_at and vehicle_status"]
      - from: LISTED
        to: ASSESSED
        trigger: "Listing transitions ACTIVE → DELISTED with no successor active listing"
        actor: system
        preconditions: ["No other Listing for this vehicle in {UNDER_REVIEW, ACTIVE, RESERVED}"]
        side_effects: []
      - from: LISTED
        to: SOLD
        trigger: "PurchaseOrder for this vehicle transitions PENDING_PAYMENT → PAID"
        actor: system
        preconditions: ["PurchaseOrder.vehicle_id = this.id and PurchaseOrder.status becomes PAID"]
        side_effects:
          - "All other Listings for this vehicle in {DRAFT, UNDER_REVIEW, ACTIVE, RESERVED} → DELISTED"
      - from: SOLD
        to: LISTED
        trigger: "TransferCase rolled back → PurchaseOrder REFUNDED — primary listing reactivates"
        actor: system
        preconditions:
          - "PurchaseOrder.status transitions COMPLETED|AWAITING_TRANSFER → REFUNDED via transfer rollback"
        side_effects:
          - "Original Listing transitions SOLD → ACTIVE"
          - "Vehicle.ownership_seller_id reverts to original Seller.id (cross-cascade)"
      - from: SOLD
        to: ARCHIVED
        trigger: "TransferCase transitions IN_PROGRESS → SUCCEEDED"
        actor: system
        preconditions: ["TransferCase.purchase_order_id maps to PurchaseOrder for this vehicle"]
        side_effects: ["Vehicle.ownership_seller_id := buyer's principal id"]

  - entity: AssessmentReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ONSITE_PENDING
        trigger: "POST /assessments/{id}/request-onsite"
        actor: Inspector
        preconditions: ["vin_history_records is non-empty"]
        side_effects:
          - "AssessmentReport.provisional_valuation_cents := provisional_price_valuation result (uses declared_mileage, history counts)"
      - from: ONSITE_PENDING
        to: FINALIZED
        trigger: "POST /assessments/{id}/finalize"
        actor: Inspector
        preconditions:
          - "onsite_findings present with all four sub-grades"
          - "inspector_user_id present"
        side_effects:
          - "AssessmentReport.declared_mileage_km := snapshot of Vehicle.declared_mileage_km"
          - "Compute mileage_discrepancy_flag (see vehicle_mileage_verification calc)"
          - "AssessmentReport.final_valuation_cents := final_price_valuation result"
          - "Vehicle transitions REGISTERED → ASSESSED on first finalize; subsequent finalize keeps Vehicle in ASSESSED but updates assessment_score and valuation_cents"
          - "Any prior FINALIZED report for this vehicle transitions FINALIZED → SUPERSEDED"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "A newer AssessmentReport for the same vehicle transitions to FINALIZED"
        actor: system
        preconditions: ["This is a non-active assessment for the vehicle"]
        side_effects: []

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [SOLD, DELISTED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /listings/{id}/submit"
        actor: Seller
        preconditions:
          - "len(photo_urls) >= 6"
          - "documents_authentic_flag = true"
          - "AssessmentReport.status = FINALIZED"
        side_effects:
          - "Listing.assessment_report_version := AssessmentReport.version (version-pinning)"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /listings/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "doc_check_status = PASS"
          - "AssessmentReport.version = Listing.assessment_report_version (pinned version still valid)"
        side_effects:
          - "Vehicle transitions ASSESSED → LISTED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /listings/{id}/reject"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Listing.doc_check_status := FAIL"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /listings/{id}/return-for-revision"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RESERVED
        trigger: "FIXED_PRICE: Reservation queue position 1 holds (HOLDING). AUCTION: auction window closes with active_bid valid"
        actor: system
        preconditions:
          - "FIXED_PRICE branch: a Reservation has just transitioned QUEUED → HOLDING with queue_position=1"
          - "AUCTION branch: clock advance triggers auction close and active_bid_id is set"
        side_effects: []
      - from: RESERVED
        to: SOLD
        trigger: "PurchaseOrder for this listing transitions PENDING_PAYMENT → PAID"
        actor: system
        preconditions: []
        side_effects:
          - "Vehicle transitions LISTED → SOLD"
          - "Refund deposits of all losing bidders/queued reservations (release deposit holds)"
      - from: RESERVED
        to: ACTIVE
        trigger: "Position-1 Reservation expires (clock advance past hold_expires_at) OR winning Bid's PurchaseOrder times out"
        actor: system
        preconditions: ["No PurchaseOrder in PAID for this listing"]
        side_effects:
          - "FIXED_PRICE: Reservation status QUEUED→HOLDING for the next queue_position"
          - "AUCTION: Bid.status WON→LOST, deposit released, second-highest LIVE bid promoted (if exists) else listing returns to ACTIVE without active_bid_id"
      - from: ACTIVE
        to: DELISTED
        trigger: "POST /listings/{id}/delist"
        actor: Seller
        preconditions: ["No Bid in LIVE state and no Reservation in HOLDING for this listing"]
        side_effects:
          - "Vehicle transitions LISTED → ASSESSED if no other active listings"
          - "Cancel any QUEUED Reservations and release their deposits"

  - entity: Bid
    initial_state: LIVE
    terminal_states: [WON, LOST, CANCELLED]
    transitions:
      - from: LIVE
        to: OUTBID
        trigger: "Another LIVE Bid is placed with higher amount_cents on same Listing"
        actor: system
        preconditions: []
        side_effects:
          - "Release deposit hold on this Bid (Buyer.deposit_held_cents -= deposit_cents)"
      - from: LIVE
        to: WON
        trigger: "Auction closes (POST /listings/{id}/close-auction or clock-advance-driven close)"
        actor: system
        preconditions:
          - "Bid is the highest LIVE bid AND amount_cents >= Listing.reserve_price_cents"
        side_effects:
          - "Listing transitions ACTIVE → RESERVED"
          - "Create PurchaseOrder in PENDING_PAYMENT"
      - from: OUTBID
        to: LIVE
        trigger: "POST /bids — buyer revives a previously OUTBID bid by placing a new bid; the new bid replaces the old (cyclic OUTBID↔LIVE through bid placement)"
        actor: Buyer
        preconditions: ["new bid amount_cents >= Listing.active_bid.amount_cents + bid_increment"]
        side_effects:
          - "Re-acquire deposit hold; previous LIVE bid transitions LIVE→OUTBID"
        note: "This represents the cyclic shape — buyer A is OUTBID by B, A bids again, A is LIVE while B becomes OUTBID. The LIVE↔OUTBID round trips are bid-by-bid auction rounds."
      - from: LIVE
        to: LOST
        trigger: "Auction closes and this bid is not the highest, OR reserve_price not met"
        actor: system
        preconditions: []
        side_effects: ["Release deposit hold"]
      - from: LIVE
        to: CANCELLED
        trigger: "POST /bids/{id}/cancel by buyer (only allowed before close)"
        actor: Buyer
        preconditions: ["Listing.status = ACTIVE"]
        side_effects: ["Release deposit hold"]

  - entity: Reservation
    initial_state: QUEUED
    terminal_states: [EXPIRED, CONVERTED, CANCELLED]
    transitions:
      - from: QUEUED
        to: HOLDING
        trigger: "Promotion to position 1 (initial reservation creation when queue empty, or previous holder expires/cancels)"
        actor: system
        preconditions: ["queue_position recomputed = 1"]
        side_effects:
          - "Set hold_expires_at := now + 24h"
          - "Acquire deposit hold (Buyer.deposit_held_cents += deposit_cents)"
          - "Listing transitions ACTIVE → RESERVED"
      - from: HOLDING
        to: CONVERTED
        trigger: "Buyer creates and pays for PurchaseOrder while HOLDING"
        actor: Buyer
        preconditions: ["PurchaseOrder.status reaches PAID"]
        side_effects: ["Listing transitions RESERVED → SOLD; cascade to all queued reservations: status→CANCELLED with deposit release"]
      - from: HOLDING
        to: EXPIRED
        trigger: "Clock advances past hold_expires_at without payment"
        actor: system
        preconditions: ["now >= hold_expires_at"]
        side_effects:
          - "Release deposit"
          - "If next-position Reservation exists: promote (HOLDING transition above)"
          - "Else: Listing transitions RESERVED → ACTIVE"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel by buyer while queued"
        actor: Buyer
        preconditions: []
        side_effects: ["No deposit was held while QUEUED — nothing to release"]
      - from: HOLDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel by buyer while holding"
        actor: Buyer
        preconditions: []
        side_effects:
          - "Release deposit"
          - "Promote next-position Reservation, or Listing → ACTIVE"

  - entity: PurchaseOrder
    initial_state: PENDING_PAYMENT
    terminal_states: [COMPLETED, CANCELLED, REFUNDED]
    transitions:
      - from: PENDING_PAYMENT
        to: PAID
        trigger: "ExternalEvent payment_received with idempotency_key for this order"
        actor: system
        preconditions:
          - "If payment_method=LOAN, Loan.status = DISBURSED"
          - "ExternalEvent.idempotency_key not previously processed"
        side_effects:
          - "Listing transitions RESERVED → SOLD"
          - "Vehicle transitions LISTED → SOLD"
          - "Bid winning → WON; Reservation HOLDING → CONVERTED; refund losers (compensating deposit release)"
          - "Activate Warranty (PENDING_ACTIVATION → ACTIVE), set effective_at := now, expires_at := now + package_duration"
          - "Move to AWAITING_TRANSFER"
        note: "Two-step: PAID is set first, then AWAITING_TRANSFER is auto-set when Warranty activation finishes"
      - from: PAID
        to: AWAITING_TRANSFER
        trigger: "Auto-transition immediately after PAID side_effects complete"
        actor: system
        preconditions: []
        side_effects: ["Create TransferCase in DOCS_PENDING with required_documents checklist seeded"]
      - from: AWAITING_TRANSFER
        to: COMPLETED
        trigger: "TransferCase transitions IN_PROGRESS → SUCCEEDED"
        actor: system
        preconditions: ["TransferCase.purchase_order_id = this.id"]
        side_effects: ["Vehicle transitions SOLD → ARCHIVED"]
      - from: AWAITING_TRANSFER
        to: REFUNDED
        trigger: "TransferCase transitions FAILED → ROLLED_BACK"
        actor: system
        preconditions: []
        side_effects:
          - "Refund agreed_price_cents to buyer (compensation; restores Buyer.deposit_balance_cents to 0 net)"
          - "Listing transitions SOLD → ACTIVE; Vehicle transitions SOLD → LISTED"
          - "Warranty status ACTIVE → VOIDED"
          - "If Loan in DISBURSED → cancel loan disbursement claim, lender to be reimbursed (CANCELLED)"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel before payment"
        actor: Buyer
        preconditions: []
        side_effects:
          - "Release Bid/Reservation deposit hold"
          - "Listing transitions RESERVED → ACTIVE"
          - "Cancel Loan if any (Loan.status → CANCELLED)"

  - entity: TransferCase
    initial_state: DOCS_PENDING
    terminal_states: [SUCCEEDED, ROLLED_BACK]
    transitions:
      - from: DOCS_PENDING
        to: APPOINTMENT_BOOKED
        trigger: "POST /transfers/{id}/book-appointment"
        actor: Buyer
        preconditions:
          - "All required_documents items have submitted=true"
          - "appointment_at > now and dmv_office_code present"
          - "If license_plate_action=NEW_NUMBER then new_plate_number is non-empty; else new_plate_number is null"
        side_effects: []
      - from: APPOINTMENT_BOOKED
        to: IN_PROGRESS
        trigger: "Clock advances past appointment_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: SUCCEEDED
        trigger: "ExternalEvent transfer_succeeded from DMV"
        actor: system
        preconditions: []
        side_effects:
          - "PurchaseOrder transitions AWAITING_TRANSFER → COMPLETED"
          - "Vehicle transitions SOLD → ARCHIVED"
          - "Vehicle.ownership_seller_id := buyer (audit OWNERSHIP_CHANGE)"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "ExternalEvent transfer_failed from DMV"
        actor: system
        preconditions: []
        side_effects:
          - "Set failure_reason from event payload"
      - from: FAILED
        to: ROLLED_BACK
        trigger: "POST /transfers/{id}/rollback"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "PurchaseOrder transitions AWAITING_TRANSFER → REFUNDED (cascade triggers Listing/Vehicle/Warranty/Loan reverts as defined under PurchaseOrder REFUNDED)"
          - "Set rolled_back_at := now"

  - entity: Loan
    initial_state: APPLIED
    terminal_states: [DISBURSED, REJECTED, CANCELLED]
    transitions:
      - from: APPLIED
        to: CREDIT_CHECKING
        trigger: "POST /loans/{id}/run-credit-check"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: CREDIT_CHECKING
        to: APPROVED
        trigger: "ExternalEvent credit_check_returned from BANK with sufficient score"
        actor: system
        preconditions:
          - "credit_score >= lender minimum (LENDER_A:680, LENDER_B:640, LENDER_C:600)"
          - "down_payment_ratio_bp >= lender minimum (LENDER_A:1500, LENDER_B:2000, LENDER_C:2500)"
        side_effects:
          - "Compute approved_principal_cents and monthly_payment_cents (loan_amortization calc)"
      - from: CREDIT_CHECKING
        to: REJECTED
        trigger: "ExternalEvent credit_check_returned with insufficient score OR ratio fails"
        actor: system
        preconditions: []
        side_effects: ["Set approved_principal_cents := 0"]
      - from: APPROVED
        to: DISBURSED
        trigger: "ExternalEvent disbursement_completed from BANK"
        actor: system
        preconditions: []
        side_effects:
          - "Set disbursed_at := now"
      - from: APPLIED
        to: CANCELLED
        trigger: "PurchaseOrder.cancel cascades, OR POST /loans/{id}/cancel by buyer"
        actor: Buyer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "PurchaseOrder cancelled before disbursement"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISBURSED
        to: CANCELLED
        trigger: "PurchaseOrder REFUNDED via transfer rollback"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Warranty
    initial_state: PENDING_ACTIVATION
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "PurchaseOrder transitions PENDING_PAYMENT → PAID"
        actor: system
        preconditions: []
        side_effects:
          - "Set effective_at := PurchaseOrder.paid_at"
          - "Set expires_at := effective_at + package_duration_months (warranty_duration calc)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "Clock advances past expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: VOIDED
        trigger: "PurchaseOrder REFUNDED (transfer rollback) OR DisputeCase resolution = REFUND_FULL"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: PENDING
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Warranty.status = ACTIVE"
          - "component IN Warranty.coverage_scope"
          - "now < Warranty.expires_at"
        side_effects:
          - "Compute approved_amount_cents (warranty_claim_payout calc — package coverage cap)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/reject"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "ExternalEvent payment from PAYMENT system referencing this claim"
        actor: system
        preconditions: []
        side_effects:
          - "Increment Warranty.claims_count and Warranty.total_claim_payout_cents (recompute)"

  - entity: DisputeCase
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: EVIDENCE_REVIEW
        trigger: "POST /disputes/{id}/start-review"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Increment round_count by 1"]
      - from: EVIDENCE_REVIEW
        to: SUBMITTED
        trigger: "POST /disputes/{id}/request-more-evidence (cyclic — bumps another round)"
        actor: PlatformAdmin
        preconditions: ["round_count < 3"]
        side_effects: []
      - from: EVIDENCE_REVIEW
        to: THIRD_PARTY_INSPECTION
        trigger: "POST /disputes/{id}/request-third-party"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: THIRD_PARTY_INSPECTION
        to: RESOLUTION_PROPOSED
        trigger: "POST /disputes/{id}/submit-third-party-report"
        actor: PlatformAdmin
        preconditions: ["third_party_report_url present"]
        side_effects: []
      - from: EVIDENCE_REVIEW
        to: RESOLUTION_PROPOSED
        trigger: "POST /disputes/{id}/propose-resolution (skip third-party path)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: RESOLUTION_PROPOSED
        to: CLOSED
        trigger: "POST /disputes/{id}/execute"
        actor: PlatformAdmin
        preconditions: ["resolution is set"]
        side_effects:
          - "Compute refund_amount_cents (dispute_compensation calc)"
          - "If resolution=REFUND_FULL: PurchaseOrder transitions to REFUNDED (full cascade) and Warranty → VOIDED"
          - "If resolution=REFUND_PARTIAL: refund refund_amount_cents to Buyer (partial; Vehicle/Listing untouched)"
          - "If resolution=COMPENSATE_SELLER: pay refund_amount_cents to Seller from Buyer"
          - "If resolution=NO_ACTION: no monetary movement"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two buyers place AUCTION bids of equal amount on same Listing within microseconds"
    guarantee: "First-writer-wins; the later request fails since amount must strictly exceed the current LIVE max"
    error_id: ERR_BID_TOO_LOW
    http_status: 409
    serialization: "Bid placement serialized on Listing.id; Listing.active_bid_id update is monotone in amount_cents"

  - scenario: "Buyer A and Buyer B simultaneously create the FIRST Reservation on a FIXED_PRICE listing (queue empty)"
    guarantee: "Exactly one becomes HOLDING at queue_position=1; the other becomes QUEUED at queue_position=2"
    error_id: ERR_RESERVATION_QUEUED_NOT_HOLDING
    http_status: 200
    serialization: "FIFO by Reservation.created_at; if equal, lexicographic by Reservation.id"
    note: "Not strictly an error — encoded as a status outcome rather than rejection. The error_id is reserved for clients that requested HOLDING-only mode (idempotency_key conflict variant)"

  - scenario: "Listing seller delists at the same instant a buyer creates a Reservation"
    guarantee: "Exactly one wins; second sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Listing.status"

  - scenario: "Two PlatformAdmins simultaneously approve and reject the same Listing under review"
    guarantee: "First-writer-wins on Listing.status; the loser sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Listing.status"

  - scenario: "TransferCase rollback initiated while Vehicle.ownership_seller_id has already been updated by transfer_succeeded"
    guarantee: "Rollback rejected — cannot rollback a SUCCEEDED transfer; only FAILED is rollback-eligible"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TransferCase.status"

  - scenario: "Two ExternalEvent submissions arrive with identical idempotency_key"
    guarantee: "First processes the event; second is a no-op returning the original processed event id"
    error_id: ERR_IDEMPOTENCY_REPLAY
    http_status: 200
    serialization: "Unique constraint on ExternalEvent.idempotency_key; replay returns 200 with original event resource"
    note: "Idempotent replay — uses ERR_IDEMPOTENCY_REPLAY as a marker, not a rejection. Listed here so downstream tests can assert replay semantics."

  - scenario: "Buyer attempts simultaneous cancel of their winning Bid while auction-close timer fires"
    guarantee: "First-writer-wins on Bid.status; if auction-close wins, cancel sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Bid.status"

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: provisional_price_valuation
    trigger: "AssessmentReport transitions DRAFT → ONSITE_PENDING"
    algorithm: weighted_scoring
    formula: |
      base = base_price_for_make_model_year(make, model, model_year)   # external table; treat constants as: assume base = 1_000_000 cents per unit-year reference; for tests, base supplied via vehicle.declared_base_price_cents stored in payload OR derived constants
      mileage_factor = max(0.5, 1 - (declared_mileage_km / REFERENCE_MILEAGE_KM) * MILEAGE_DECAY)
      history_penalty = (accident_count * ACCIDENT_PENALTY_BP + maintenance_count * MAINT_PENALTY_BP) / 10000
      provisional = base * mileage_factor * (1 - history_penalty)
      provisional_valuation_cents = round_half_up(provisional)         # to integer cents
    input_set: "AssessmentReport.vin_history_records (counts only); declared_mileage_km from Vehicle"
    constants:
      REFERENCE_MILEAGE_KM: 200000
      MILEAGE_DECAY: 0.5
      ACCIDENT_PENALTY_BP: 800
      MAINT_PENALTY_BP: 50
      BASE_PRICE_CENTS: 1000000
    precision: "integer cents, round_half_up at the final step"
    variants:
      - name: provisional_no_onsite
        when: "Status DRAFT → ONSITE_PENDING (uses declared mileage and history counts only)"
        difference: "Uses declared_mileage_km; ignores onsite grades and discrepancy"

  - name: final_price_valuation
    trigger: "AssessmentReport transitions ONSITE_PENDING → FINALIZED"
    algorithm: weighted_scoring
    formula: |
      base = BASE_PRICE_CENTS
      verified_mileage = onsite_findings.mileage_km_observed
      mileage_factor = max(0.5, 1 - (verified_mileage / REFERENCE_MILEAGE_KM) * MILEAGE_DECAY)
      grade_avg = (grade_value(exterior_grade) + grade_value(interior_grade) + grade_value(mechanical_grade)) / 3
        # grade_value: A=1.0, B=0.9, C=0.8, D=0.6
      history_penalty = (accident_count * ACCIDENT_PENALTY_BP + major_accident_count * MAJOR_ACCIDENT_EXTRA_BP + maintenance_count * MAINT_PENALTY_BP) / 10000
      discrepancy_penalty = DISCREPANCY_PENALTY if mileage_discrepancy_flag else 0
      final = base * mileage_factor * grade_avg * (1 - history_penalty) * (1 - discrepancy_penalty)
      final_valuation_cents = round_half_up(final)
    input_set: "AssessmentReport with onsite_findings filled"
    constants:
      REFERENCE_MILEAGE_KM: 200000
      MILEAGE_DECAY: 0.5
      ACCIDENT_PENALTY_BP: 800
      MAJOR_ACCIDENT_EXTRA_BP: 1200
      MAINT_PENALTY_BP: 50
      DISCREPANCY_PENALTY: 0.15
      BASE_PRICE_CENTS: 1000000
    precision: "integer cents, round_half_up at the final step"
    variants:
      - name: final_with_discrepancy
        when: "mileage_discrepancy_flag=true"
        difference: "Multiplies by (1 - DISCREPANCY_PENALTY); produces materially lower valuation than the provisional"
      - name: final_no_discrepancy
        when: "mileage_discrepancy_flag=false"
        difference: "No discrepancy multiplier; relies only on grades and history"

  - name: vehicle_mileage_verification
    trigger: "AssessmentReport transitions ONSITE_PENDING → FINALIZED"
    algorithm: threshold
    formula: |
      delta = onsite_findings.mileage_km_observed - declared_mileage_km
      if delta < 0 OR (declared_mileage_km > 0 and abs(delta) / declared_mileage_km > MILEAGE_DISCREPANCY_TOLERANCE):
        mileage_discrepancy_flag = true
      else:
        mileage_discrepancy_flag = false
      Vehicle.verified_mileage_km = onsite_findings.mileage_km_observed
    input_set: "AssessmentReport.onsite_findings.mileage_km_observed and Vehicle.declared_mileage_km"
    constants:
      MILEAGE_DISCREPANCY_TOLERANCE: 0.05
    precision: "integer kilometers; ratio compared at full float precision"

  - name: vehicle_assessment_score
    trigger: "AssessmentReport transitions ONSITE_PENDING → FINALIZED"
    algorithm: weighted_scoring
    formula: |
      grade_pts = (grade_value(exterior_grade) + grade_value(interior_grade) + grade_value(mechanical_grade)) / 3 * 100
      mileage_pts = max(0, 100 - (verified_mileage_km / REFERENCE_MILEAGE_KM) * 100)
      history_pts = max(0, 100 - accident_count*10 - major_accident_count*15 - (1 if mileage_discrepancy_flag else 0)*20)
      assessment_score = round_half_up( W_GRADE * grade_pts + W_MILEAGE * mileage_pts + W_HISTORY * history_pts )
    input_set: "Same as final_price_valuation inputs"
    constants:
      W_GRADE: 0.5
      W_MILEAGE: 0.2
      W_HISTORY: 0.3
      REFERENCE_MILEAGE_KM: 200000
    precision: "integer 0..100, round_half_up at final step"

  - name: bid_increment_rule
    trigger: "POST /listings/{id}/bids — validates new_bid.amount_cents"
    algorithm: tiered_pricing
    formula: |
      current_max = Listing.active_bid.amount_cents OR Listing.ask_price_cents (if no LIVE bid)
      if current_max < TIER_1_CEILING:    increment = INCR_LOW
      elif current_max < TIER_2_CEILING:  increment = INCR_MID
      else:                               increment = INCR_HIGH
      required_min = current_max + increment
      reject if new_bid.amount_cents < required_min   # boundary: equal is rejected
    input_set: "Current LIVE bid for the Listing"
    constants:
      TIER_1_CEILING: 5000000          # 50,000.00 currency units
      TIER_2_CEILING: 20000000         # 200,000.00
      INCR_LOW: 50000                  # 500.00
      INCR_MID: 200000                 # 2,000.00
      INCR_HIGH: 500000                # 5,000.00
    precision: "integer cents"

  - name: loan_amortization
    trigger: "Loan transitions CREDIT_CHECKING → APPROVED"
    algorithm: tiered_pricing
    formula: |
      lender_apr_bp = lender_apr(lender_code, credit_score):
        LENDER_A: 480 if credit_score >= 740 else 580 if credit_score >= 680 else null
        LENDER_B: 580 if credit_score >= 700 else 680 if credit_score >= 640 else null
        LENDER_C: 780 if credit_score >= 660 else 880 if credit_score >= 600 else null
      if lender_apr_bp is null: REJECTED branch (not this calc)
      max_principal = agreed_price_cents - ceil(agreed_price_cents * down_payment_ratio_bp / 10000)
      approved_principal_cents = min(requested_principal_cents, max_principal)
      monthly_rate = lender_apr_bp / 10000 / 12
      n = term_months
      monthly_payment_cents = ceil( approved_principal_cents * monthly_rate / (1 - (1+monthly_rate)^(-n)) )
      total_interest_cents = monthly_payment_cents * n - approved_principal_cents
    input_set: "Loan.lender_code, credit_score, requested_principal_cents, down_payment_ratio_bp, term_months, PurchaseOrder.agreed_price_cents"
    constants:
      LENDER_A_MIN_CREDIT: 680
      LENDER_A_MIN_DOWN_BP: 1500
      LENDER_B_MIN_CREDIT: 640
      LENDER_B_MIN_DOWN_BP: 2000
      LENDER_C_MIN_CREDIT: 600
      LENDER_C_MIN_DOWN_BP: 2500
    precision: "monthly_payment_cents = ceil() per line; total_interest_cents derived. The pinned evaluation order is: (1) compute lender_apr_bp, (2) compute max_principal with ceil() on down-payment, (3) compute approved_principal_cents, (4) compute monthly_payment_cents with single ceil() at end, (5) total = monthly_payment * n - approved_principal."
    variants:
      - name: amortization_at_minimum_down
        when: "down_payment_ratio_bp equals lender minimum exactly"
        difference: "Boundary: must succeed; any value below — even by 1 bp — fails ERR_DOWN_PAYMENT_INSUFFICIENT"

  - name: warranty_duration
    trigger: "Warranty transitions PENDING_ACTIVATION → ACTIVE"
    algorithm: threshold
    formula: |
      package_months = {BASIC: 6, STANDARD: 12, PREMIUM: 24}[package_code]
      coverage_scope = {
        BASIC:    [POWERTRAIN],
        STANDARD: [POWERTRAIN, ELECTRICAL, COOLING],
        PREMIUM:  [POWERTRAIN, ELECTRICAL, COOLING, INFOTAINMENT, SUSPENSION, INTERIOR]
      }[package_code]
      effective_at = PurchaseOrder.paid_at
      expires_at = effective_at + package_months months  # use calendar months, EOM clamp
    input_set: "Warranty.package_code, PurchaseOrder.paid_at"
    constants:
      BASIC_MONTHS: 6
      STANDARD_MONTHS: 12
      PREMIUM_MONTHS: 24
    precision: "datetime arithmetic with EOM clamp (e.g., effective Jan 31 + 1 month = Feb 28/29)"

  - name: warranty_claim_payout
    trigger: "WarrantyClaim transitions PENDING → APPROVED"
    algorithm: threshold
    formula: |
      cap = {BASIC: 200000, STANDARD: 500000, PREMIUM: 1500000}[package_code]   # cents per claim
      remaining_under_total = max(0, cap_total[package_code] - Warranty.total_claim_payout_cents)
      approved_amount_cents = min(claimed_amount_cents, cap, remaining_under_total)
    input_set: "Warranty.package_code, claimed_amount_cents, Warranty.total_claim_payout_cents (running sum of prior approved claims)"
    constants:
      BASIC_PER_CLAIM_CAP: 200000
      STANDARD_PER_CLAIM_CAP: 500000
      PREMIUM_PER_CLAIM_CAP: 1500000
      BASIC_TOTAL_CAP: 500000
      STANDARD_TOTAL_CAP: 2000000
      PREMIUM_TOTAL_CAP: 6000000
    precision: "integer cents"

  - name: dispute_compensation
    trigger: "DisputeCase transitions RESOLUTION_PROPOSED → CLOSED"
    algorithm: threshold
    formula: |
      switch resolution:
        REFUND_FULL:        refund_amount_cents = PurchaseOrder.agreed_price_cents
        REFUND_PARTIAL:
          base_pct = 0.10 if (no third_party_report_url) else 0.30
          if AssessmentReport.mileage_discrepancy_flag was true at sale time: base_pct += 0.10
          refund_amount_cents = round_half_up(PurchaseOrder.agreed_price_cents * base_pct)
        COMPENSATE_SELLER:  refund_amount_cents = round_half_up(PurchaseOrder.agreed_price_cents * 0.05)
        NO_ACTION:          refund_amount_cents = 0
    input_set: "DisputeCase.resolution, PurchaseOrder.agreed_price_cents, third_party_report_url presence, latest AssessmentReport.mileage_discrepancy_flag"
    constants:
      PARTIAL_BASE_PCT_NO_3P: 0.10
      PARTIAL_BASE_PCT_WITH_3P: 0.30
      DISCREPANCY_BUMP: 0.10
      SELLER_COMPENSATION_PCT: 0.05
    precision: "integer cents, round_half_up"

  - name: deposit_balance_reconciliation
    trigger: "Any Bid or Reservation status change"
    algorithm: aggregation
    formula: |
      Buyer.deposit_held_cents =
        SUM( Bid.deposit_cents WHERE Bid.buyer_id = Buyer.id AND Bid.status IN {LIVE} )
        + SUM( Reservation.deposit_cents WHERE Reservation.buyer_id = Buyer.id AND Reservation.status IN {HOLDING} )
      Buyer.deposit_balance_cents := Buyer.deposit_held_cents   # invariant: equal at all times
    input_set: "All Bid and Reservation rows for the Buyer"
    constants: {}
    precision: "integer cents; sum order is buyer-scoped FIFO by created_at, but result is order-independent (sum)"
    variants:
      - name: deposit_full_recompute
        when: "On any state transition affecting Bid or Reservation status"
        difference: "Full recompute over the buyer's open holds (HELD set is filtered to status enum); ensures eventual consistency despite cross-transaction races"

# =============================================================================
# §1.4 Validations (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is recognized and X-User-ID is non-empty UUID"
    error_id: ERR_AUTH_INVALID
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All path-parameter ids resolve, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys (vehicle_id, listing_id, etc.) resolve to existing records"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 6
    category: state
    check: "Acting Seller owns the resource (Vehicle/Listing.seller_id = X-User-ID); acting Buyer owns Bid/Reservation/PO/Loan etc."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "[POST/PATCH/DELETE on Vehicle, Listing, Bid, Reservation, PurchaseOrder, Loan, WarrantyClaim, DisputeCase]"

  - priority: 7
    category: state
    check: "Target resource is in a state that admits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_referential
    check: "When creating Listing, AssessmentReport.status = FINALIZED and AssessmentReport.vehicle_id = listing.vehicle_id"
    error_id: ERR_ASSESSMENT_NOT_FINALIZED
    http_status: 422
    applies_to: "[POST /listings, POST /listings/{id}/submit]"

  - priority: 9
    category: business_referential
    check: "Listing.assessment_report_version equals current AssessmentReport.version at approve time (version-pinning re-validation)"
    error_id: ERR_ASSESSMENT_VERSION_STALE
    http_status: 409
    applies_to: "[POST /listings/{id}/approve]"

  - priority: 10
    category: business_safety
    check: "VIN format is 17 alphanumeric chars with no I, O, or Q"
    error_id: ERR_VIN_INVALID
    http_status: 422
    applies_to: "[POST /vehicles, PATCH /vehicles/{id}]"

  - priority: 11
    category: business_safety
    check: "Photos count >= 6 AND documents_authentic_flag = true at submit-for-review"
    error_id: ERR_LISTING_DOCS_INSUFFICIENT
    http_status: 422
    applies_to: "[POST /listings/{id}/submit]"

  - priority: 12
    category: business_constraint
    check: "Bid.amount_cents >= current_max + bid_increment (per bid_increment_rule)"
    error_id: ERR_BID_TOO_LOW
    http_status: 422
    applies_to: "[POST /listings/{id}/bids]"

  - priority: 13
    category: business_constraint
    check: "Reservation cannot be created when listing.status NOT IN {ACTIVE, RESERVED}"
    error_id: ERR_LISTING_NOT_RESERVABLE
    http_status: 409
    applies_to: "[POST /listings/{id}/reservations]"

  - priority: 14
    category: business_fiscal
    check: "Loan.down_payment_ratio_bp >= lender minimum (LENDER_A:1500, LENDER_B:2000, LENDER_C:2500)"
    error_id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http_status: 422
    applies_to: "[POST /purchase-orders/{id}/loans, POST /loans/{id}/run-credit-check]"

  - priority: 15
    category: business_fiscal
    check: "Loan.term_months ∈ {12,24,36,48,60,72}; requested_principal_cents > 0; requested_principal_cents <= agreed_price_cents - down_payment minimum"
    error_id: ERR_LOAN_PARAMS_INVALID
    http_status: 422
    applies_to: "[POST /purchase-orders/{id}/loans]"

  - priority: 16
    category: business_fiscal
    check: "Buyer.deposit_held_cents on existing holds + new bid/reservation deposit_cents must not exceed Buyer balance limit (BUYER_DEPOSIT_LIMIT_CENTS = 50_000_000); this surfaces as ERR_DEPOSIT_LIMIT_EXCEEDED"
    error_id: ERR_DEPOSIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "[POST /listings/{id}/bids, POST /listings/{id}/reservations]"

  - priority: 17
    category: business_temporal
    check: "TransferCase.appointment_at must be strictly in the future (now < appointment_at) and within DMV scheduling window (appointment_at - now <= 60 days)"
    error_id: ERR_APPOINTMENT_OUT_OF_WINDOW
    http_status: 422
    applies_to: "[POST /transfers/{id}/book-appointment]"

  - priority: 18
    category: business_temporal
    check: "WarrantyClaim must be filed while Warranty.status = ACTIVE and now < expires_at"
    error_id: ERR_WARRANTY_NOT_ACTIVE
    http_status: 409
    applies_to: "[POST /warranties/{id}/claims]"

  - priority: 19
    category: business_referential
    check: "WarrantyClaim.component must be in Warranty.coverage_scope"
    error_id: ERR_COMPONENT_NOT_COVERED
    http_status: 422
    applies_to: "[POST /warranties/{id}/claims]"

  - priority: 20
    category: business_constraint
    check: "TransferCase.required_documents — every item must have submitted=true before book-appointment; if license_plate_action=NEW_NUMBER then new_plate_number must be non-empty, else null"
    error_id: ERR_TRANSFER_DOCS_INCOMPLETE
    http_status: 422
    applies_to: "[POST /transfers/{id}/book-appointment]"

  - priority: 21
    category: business_constraint
    check: "DisputeCase round_count cannot exceed MAX_MEDIATION_ROUNDS = 3 (cyclic SUBMITTED↔EVIDENCE_REVIEW)"
    error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "[POST /disputes/{id}/start-review, POST /disputes/{id}/request-more-evidence]"

  - priority: 22
    category: business_referential
    check: "DisputeCase.purchase_order_id must reference a PurchaseOrder in status IN {COMPLETED, AWAITING_TRANSFER}; cannot dispute pre-payment"
    error_id: ERR_DISPUTE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "[POST /purchase-orders/{id}/disputes]"

  - priority: 23
    category: business_referential
    check: "ExternalEvent.idempotency_key uniqueness; duplicate is no-op (returns ERR_IDEMPOTENCY_REPLAY marker, http 200, original payload)"
    error_id: ERR_IDEMPOTENCY_REPLAY
    http_status: 200
    applies_to: "[POST /_events/emit]"

  - priority: 24
    category: business_constraint
    check: "Pagination: limit in [1,100]; offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "[all GET list endpoints]"

# =============================================================================
# §1.5 Endpoints
# =============================================================================
endpoints:
  # --- Sellers / Buyers ---
  - method: POST
    path: "/sellers"
    description: "Register a seller"
    roles: [PlatformAdmin, Seller]
    code: 201
    input: [legal_name, id_document_number, phone]
    output: Seller
    side_effects: []

  - method: POST
    path: "/buyers"
    description: "Register a buyer"
    roles: [PlatformAdmin, Buyer]
    code: 201
    input: [legal_name, id_document_number, phone]
    output: Buyer
    side_effects: []

  - method: GET
    path: "/buyers/{id}"
    description: "Read buyer (deposit_balance_cents reflects current holds)"
    roles: [PlatformAdmin, Buyer]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  # --- Vehicles & Assessments ---
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle (seller submits VIN + declared info)"
    roles: [Seller]
    code: 201
    input: [vin, make, model, model_year, declared_mileage_km, color]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Read vehicle"
    roles: [PlatformAdmin, Seller, Buyer, Inspector]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles (filter by status, seller_id; paginated)"
    roles: [PlatformAdmin, Seller, Buyer]
    code: 200
    input: ["status?", "seller_id?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/assessments"
    description: "Create AssessmentReport (DRAFT) with VIN history + inspector"
    roles: [Inspector]
    code: 201
    input: [vin_history_records, inspector_user_id]
    output: AssessmentReport
    side_effects: []

  - method: POST
    path: "/assessments/{id}/request-onsite"
    description: "Transition DRAFT → ONSITE_PENDING; computes provisional_valuation_cents"
    roles: [Inspector]
    code: 200
    input: ["version?"]
    output: AssessmentReport
    side_effects: ["calc:provisional_price_valuation"]

  - method: POST
    path: "/assessments/{id}/finalize"
    description: "Submit on-site findings; transitions ONSITE_PENDING → FINALIZED"
    roles: [Inspector]
    code: 200
    input: [onsite_findings, "version?"]
    output: AssessmentReport
    side_effects:
      - "calc:vehicle_mileage_verification"
      - "calc:final_price_valuation"
      - "calc:vehicle_assessment_score"
      - "Vehicle: REGISTERED→ASSESSED on first finalize"
      - "Prior FINALIZED for vehicle → SUPERSEDED"

  - method: GET
    path: "/assessments/{id}"
    description: "Read AssessmentReport"
    roles: [PlatformAdmin, Seller, Buyer, Inspector]
    code: 200
    input: []
    output: AssessmentReport
    side_effects: []

  # --- Listings ---
  - method: POST
    path: "/listings"
    description: "Create listing in DRAFT (seller pins assessment_report_id)"
    roles: [Seller]
    code: 201
    input: [vehicle_id, assessment_report_id, sale_mode, ask_price_cents, "reserve_price_cents?", photo_urls, documents_authentic_flag]
    output: Listing
    side_effects: []

  - method: POST
    path: "/listings/{id}/submit"
    description: "Submit listing for admin review (DRAFT → UNDER_REVIEW)"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Listing
    side_effects: ["pin assessment_report_version"]

  - method: POST
    path: "/listings/{id}/approve"
    description: "Approve listing (UNDER_REVIEW → ACTIVE); cascades Vehicle ASSESSED→LISTED"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Listing
    side_effects: ["Vehicle ASSESSED→LISTED", "doc_check_status := PASS"]

  - method: POST
    path: "/listings/{id}/reject"
    description: "Reject listing (UNDER_REVIEW → REJECTED)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Listing
    side_effects: ["doc_check_status := FAIL"]

  - method: POST
    path: "/listings/{id}/return-for-revision"
    description: "Return for revision (UNDER_REVIEW → DRAFT)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Listing
    side_effects: []

  - method: POST
    path: "/listings/{id}/delist"
    description: "Seller delists (ACTIVE → DELISTED)"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Listing
    side_effects: ["cancel queued reservations and release deposits", "Vehicle LISTED→ASSESSED if no other active listings"]

  - method: GET
    path: "/listings"
    description: "List listings with filters"
    roles: [PlatformAdmin, Seller, Buyer]
    code: 200
    input: ["status?", "sale_mode?", "vehicle_id?", "seller_id?", "limit?", "offset?"]
    output: "Listing[]"
    side_effects: []

  - method: GET
    path: "/listings/{id}"
    description: "Read listing"
    roles: [PlatformAdmin, Seller, Buyer]
    code: 200
    input: []
    output: Listing
    side_effects: []

  # --- Bids (AUCTION) ---
  - method: POST
    path: "/listings/{id}/bids"
    description: "Place a bid on AUCTION listing; previous LIVE bid → OUTBID"
    roles: [Buyer]
    code: 201
    input: [amount_cents]
    output: Bid
    side_effects:
      - "calc:bid_increment_rule (validation)"
      - "previous LIVE bid (if any) → OUTBID, release prev deposit"
      - "calc:deposit_balance_reconciliation"

  - method: POST
    path: "/listings/{id}/close-auction"
    description: "Close an active AUCTION (ACTIVE → RESERVED if highest bid >= reserve else returns to ACTIVE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: ["winning bid → WON", "create PurchaseOrder PENDING_PAYMENT", "non-winning LIVE bids → LOST and releases"]

  - method: POST
    path: "/bids/{id}/cancel"
    description: "Buyer cancels their LIVE bid"
    roles: [Buyer]
    code: 200
    input: ["version?"]
    output: Bid
    side_effects: ["release deposit", "calc:deposit_balance_reconciliation"]

  - method: GET
    path: "/listings/{id}/bids"
    description: "List bids on a listing"
    roles: [PlatformAdmin, Seller, Buyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Bid[]"
    side_effects: []

  # --- Reservations (FIXED_PRICE) ---
  - method: POST
    path: "/listings/{id}/reservations"
    description: "Reserve a FIXED_PRICE listing; creates QUEUED or auto-promotes to HOLDING"
    roles: [Buyer]
    code: 201
    input: []
    output: Reservation
    side_effects:
      - "FIFO queue assignment"
      - "If queue empty: HOLDING + deposit hold + Listing ACTIVE→RESERVED"
      - "calc:deposit_balance_reconciliation"

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Buyer cancels reservation"
    roles: [Buyer]
    code: 200
    input: ["version?"]
    output: Reservation
    side_effects: ["release deposit if HOLDING", "promote next queued or Listing RESERVED→ACTIVE"]

  - method: GET
    path: "/listings/{id}/reservations"
    description: "List reservations on a listing"
    roles: [PlatformAdmin, Seller, Buyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Reservation[]"
    side_effects: []

  # --- Purchase Orders ---
  - method: POST
    path: "/purchase-orders"
    description: "Create purchase order from a winning Bid or HOLDING Reservation; sets payment_method"
    roles: [Buyer]
    code: 201
    input: [listing_id, payment_method]
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/purchase-orders/{id}"
    description: "Read purchase order"
    roles: [PlatformAdmin, Seller, Buyer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: POST
    path: "/purchase-orders/{id}/cancel"
    description: "Cancel before PAID"
    roles: [Buyer]
    code: 200
    input: ["version?"]
    output: PurchaseOrder
    side_effects: ["release deposits, Listing RESERVED→ACTIVE, Loan→CANCELLED"]

  # --- Loans ---
  - method: POST
    path: "/purchase-orders/{id}/loans"
    description: "Apply for a loan against a PurchaseOrder"
    roles: [Buyer]
    code: 201
    input: [lender_code, requested_principal_cents, down_payment_ratio_bp, term_months]
    output: Loan
    side_effects: []

  - method: POST
    path: "/loans/{id}/run-credit-check"
    description: "APPLIED → CREDIT_CHECKING (admin triggers external credit-check)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: POST
    path: "/loans/{id}/cancel"
    description: "Cancel a loan (only valid in APPLIED or APPROVED)"
    roles: [Buyer]
    code: 200
    input: ["version?"]
    output: Loan
    side_effects: []

  - method: GET
    path: "/loans/{id}"
    description: "Read loan"
    roles: [PlatformAdmin, Buyer]
    code: 200
    input: []
    output: Loan
    side_effects: []

  # --- Transfers ---
  - method: GET
    path: "/transfers/{id}"
    description: "Read TransferCase"
    roles: [PlatformAdmin, Seller, Buyer]
    code: 200
    input: []
    output: TransferCase
    side_effects: []

  - method: PATCH
    path: "/transfers/{id}/documents"
    description: "Upload/mark a checklist document submitted=true"
    roles: [Buyer, Seller]
    code: 200
    input: [doc_type, doc_url, "version?"]
    output: TransferCase
    side_effects: []

  - method: POST
    path: "/transfers/{id}/book-appointment"
    description: "DOCS_PENDING → APPOINTMENT_BOOKED"
    roles: [Buyer]
    code: 200
    input: [appointment_at, dmv_office_code, license_plate_action, "new_plate_number?", "version?"]
    output: TransferCase
    side_effects: []

  - method: POST
    path: "/transfers/{id}/rollback"
    description: "FAILED → ROLLED_BACK; cascades PurchaseOrder REFUND, Listing reactivation, Vehicle owner revert, Warranty void, Loan cancel"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: TransferCase
    side_effects: ["full compensation cascade"]

  # --- Warranties / Claims ---
  - method: GET
    path: "/warranties/{id}"
    description: "Read warranty"
    roles: [PlatformAdmin, Buyer, Seller]
    code: 200
    input: []
    output: Warranty
    side_effects: []

  - method: POST
    path: "/warranties/{id}/claims"
    description: "File a claim"
    roles: [Buyer]
    code: 201
    input: [component, claimed_amount_cents]
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "PENDING → APPROVED, computes approved_amount_cents"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: WarrantyClaim
    side_effects: ["calc:warranty_claim_payout"]

  - method: POST
    path: "/warranty-claims/{id}/reject"
    description: "PENDING → REJECTED"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: WarrantyClaim
    side_effects: []

  # --- Disputes ---
  - method: POST
    path: "/purchase-orders/{id}/disputes"
    description: "File a dispute on a completed/awaiting-transfer PurchaseOrder"
    roles: [Buyer, Seller]
    code: 201
    input: [complainant_role, complaint_text, "evidence_items?"]
    output: DisputeCase
    side_effects: []

  - method: POST
    path: "/disputes/{id}/start-review"
    description: "SUBMITTED → EVIDENCE_REVIEW (round_count++)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: DisputeCase
    side_effects: []

  - method: POST
    path: "/disputes/{id}/request-more-evidence"
    description: "EVIDENCE_REVIEW → SUBMITTED (cyclic; capped at MAX_ROUNDS=3)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: DisputeCase
    side_effects: []

  - method: POST
    path: "/disputes/{id}/request-third-party"
    description: "EVIDENCE_REVIEW → THIRD_PARTY_INSPECTION"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: DisputeCase
    side_effects: []

  - method: POST
    path: "/disputes/{id}/submit-third-party-report"
    description: "THIRD_PARTY_INSPECTION → RESOLUTION_PROPOSED"
    roles: [PlatformAdmin]
    code: 200
    input: [third_party_report_url, "version?"]
    output: DisputeCase
    side_effects: []

  - method: POST
    path: "/disputes/{id}/propose-resolution"
    description: "EVIDENCE_REVIEW → RESOLUTION_PROPOSED (skip third-party)"
    roles: [PlatformAdmin]
    code: 200
    input: [resolution, "version?"]
    output: DisputeCase
    side_effects: []

  - method: POST
    path: "/disputes/{id}/execute"
    description: "RESOLUTION_PROPOSED → CLOSED; computes refund_amount_cents and applies cascade"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: DisputeCase
    side_effects: ["calc:dispute_compensation", "PurchaseOrder REFUNDED on REFUND_FULL", "Warranty VOIDED on REFUND_FULL"]

  # --- External events (test-driving endpoints) ---
  - method: POST
    path: "/_events/emit"
    description: "Emit an external event (DMV, BANK, INSURANCE, PAYMENT). Idempotent on idempotency_key."
    roles: [PlatformAdmin]
    code: 201
    input: [source, event_type, idempotency_key, payload]
    output: ExternalEvent
    side_effects: ["routes to handlers — drives state machines from external systems"]

  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance virtual clock (drives time-gated transitions: reservation expiry, auction close, transfer appointment, warranty expiry)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso_8601]
    output: "{ now: ISO8601 }"
    side_effects: ["sweep: HOLDING reservations past hold_expires_at → EXPIRED + promote next or Listing→ACTIVE", "APPOINTMENT_BOOKED past appointment_at → IN_PROGRESS", "ACTIVE Warranty past expires_at → EXPIRED"]

  # --- Audit ---
  - method: GET
    path: "/audit-logs"
    description: "List audit log entries"
    roles: [PlatformAdmin]
    code: 200
    input: ["target_entity?", "target_id?", "event_type?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing X-User-Role or X-User-ID header"
  - id: ERR_AUTH_INVALID
    http: 401
    condition: "Unrecognized X-User-Role or malformed X-User-ID"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource id does not resolve"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting user is not the owner of the targeted resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state that allows this transition (per §1.2)"
  - id: ERR_VIN_INVALID
    http: 422
    condition: "VIN does not match 17-char alphanumeric (excluding I/O/Q) format"
  - id: ERR_ASSESSMENT_NOT_FINALIZED
    http: 422
    condition: "AssessmentReport.status is not FINALIZED at listing-creation/submit time"
  - id: ERR_ASSESSMENT_VERSION_STALE
    http: 409
    condition: "Listing.assessment_report_version != current AssessmentReport.version at approval"
  - id: ERR_LISTING_DOCS_INSUFFICIENT
    http: 422
    condition: "Listing has fewer than 6 photos or documents_authentic_flag=false at submit"
  - id: ERR_BID_TOO_LOW
    http: 422
    condition: "Bid amount below current_max + bid_increment per tiered rule"
  - id: ERR_LISTING_NOT_RESERVABLE
    http: 409
    condition: "Listing not in {ACTIVE, RESERVED} when reservation requested"
  - id: ERR_RESERVATION_QUEUED_NOT_HOLDING
    http: 409
    condition: "Reservation client demanded HOLDING-only mode but was placed at queue_position > 1"
  - id: ERR_DEPOSIT_LIMIT_EXCEEDED
    http: 422
    condition: "Buyer's deposit_held_cents would exceed BUYER_DEPOSIT_LIMIT_CENTS"
  - id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http: 422
    condition: "Loan.down_payment_ratio_bp below lender minimum"
  - id: ERR_LOAN_PARAMS_INVALID
    http: 422
    condition: "Loan term not in allowed set, or principal invalid given price/down-payment"
  - id: ERR_APPOINTMENT_OUT_OF_WINDOW
    http: 422
    condition: "TransferCase.appointment_at not in (now, now+60d]"
  - id: ERR_TRANSFER_DOCS_INCOMPLETE
    http: 422
    condition: "Required documents missing or new_plate_number rule violated for license_plate_action"
  - id: ERR_WARRANTY_NOT_ACTIVE
    http: 409
    condition: "WarrantyClaim filed when Warranty not ACTIVE or now >= expires_at"
  - id: ERR_COMPONENT_NOT_COVERED
    http: 422
    condition: "Claim component not in Warranty.coverage_scope"
  - id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http: 409
    condition: "DisputeCase round_count would exceed MAX_MEDIATION_ROUNDS=3"
  - id: ERR_DISPUTE_NOT_ELIGIBLE
    http: 422
    condition: "PurchaseOrder not in {COMPLETED, AWAITING_TRANSFER} at dispute filing"
  - id: ERR_IDEMPOTENCY_REPLAY
    http: 200
    condition: "Replay marker for ExternalEvent.idempotency_key duplicates (informational, not a rejection)"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit out of [1,100] or offset < 0"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: client-supplied version != server version"

# =============================================================================
# §1.7 RBAC
# =============================================================================
roles:
  - name: Seller
    description: "Owner of vehicles and listings"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /vehicles"
      - "POST /listings"
      - "POST /listings/{id}/submit"
      - "POST /listings/{id}/delist"
    shared_operations:
      - "POST /sellers (with PlatformAdmin)"
      - "GET on owned vehicles, listings, transfers, warranties"
      - "PATCH /transfers/{id}/documents (with Buyer)"
      - "POST /purchase-orders/{id}/disputes (with Buyer)"

  - name: Buyer
    description: "Bidder / purchaser"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /listings/{id}/bids"
      - "POST /bids/{id}/cancel"
      - "POST /listings/{id}/reservations"
      - "POST /reservations/{id}/cancel"
      - "POST /purchase-orders"
      - "POST /purchase-orders/{id}/cancel"
      - "POST /purchase-orders/{id}/loans"
      - "POST /loans/{id}/cancel"
      - "POST /transfers/{id}/book-appointment"
      - "POST /warranties/{id}/claims"
    shared_operations:
      - "POST /buyers (with PlatformAdmin)"
      - "GET on owned bids, reservations, purchase-orders, loans, transfers, warranties"
      - "PATCH /transfers/{id}/documents (with Seller)"
      - "POST /purchase-orders/{id}/disputes (with Seller)"

  - name: Inspector
    description: "Performs assessments"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles/{id}/assessments"
      - "POST /assessments/{id}/request-onsite"
      - "POST /assessments/{id}/finalize"
    shared_operations:
      - "GET /assessments/{id}"
      - "GET /vehicles/{id}"

  - name: PlatformAdmin
    description: "Operator. Reviews listings, runs credit checks, executes transfer rollback and dispute mediation, replays external events, advances clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /listings/{id}/approve"
      - "POST /listings/{id}/reject"
      - "POST /listings/{id}/return-for-revision"
      - "POST /listings/{id}/close-auction"
      - "POST /loans/{id}/run-credit-check"
      - "POST /transfers/{id}/rollback"
      - "POST /warranty-claims/{id}/approve"
      - "POST /warranty-claims/{id}/reject"
      - "POST /disputes/{id}/start-review"
      - "POST /disputes/{id}/request-more-evidence"
      - "POST /disputes/{id}/request-third-party"
      - "POST /disputes/{id}/submit-third-party-report"
      - "POST /disputes/{id}/propose-resolution"
      - "POST /disputes/{id}/execute"
      - "POST /_events/emit"
      - "POST /_clock/advance"
      - "GET /audit-logs"
    shared_operations:
      - "GET on all entities"
      - "POST /sellers and POST /buyers (with their respective roles)"
