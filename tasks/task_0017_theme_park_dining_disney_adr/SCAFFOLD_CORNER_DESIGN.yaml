        grounds:
          - errors[ERR_PARTY_SIZE_PATCH_INFEASIBLE]
          - validations[priority=19]
          - endpoints.POST_/v1/reservations/{id}/party-size
        distinguishing_aspect: |
          Restaurant capacity_per_slot=4 with an existing CONFIRMED party_size=2 reservation;
          patching to party_size=5 would require 5 + 2 = 7 > 4 → ERR_PARTY_SIZE_PATCH_INFEASIBLE.
        test_recipe:
          setup:
            - "Restaurant capacity_per_slot=4."
            - "Two guests share the same slot: guest A has CONFIRMED party_size=2 reservation."
            - "Guest B has its own CONFIRMED reservation at party_size=1 for the same slot — slot total = 3 confirmed seats."
            - "Guest B attempts patch to party_size=4 — slot would become 2 (from A) + 4 = 6 > 4."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/restaurants"
              payload: { name: "Rpsp", park_code: "EPCOT", capacity_per_slot: 4, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/guests"
              payload: { email: "g_psp_a@x.com", full_name: "PSP A", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_a_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_a_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_a_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_a_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_a_id}"
              captures: { ps_a_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_a_id}", restaurant_id: "${r_id}", park_session_id: "${ps_a_id}", dining_plan_id: "${dp_a_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 2 }
              as: Guest
              as_user_id: "${g_a_id}"
              captures: { res_a_id: $.data.id }
            - call: "POST /v1/reservations/${res_a_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_a_id}"
            - call: "POST /v1/guests"
              payload: { email: "g_psp_b@x.com", full_name: "PSP B", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_b_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_b_id}", tier: "DELUXE", table_service_credits_initial: 20, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_b_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_b_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_b_id}"
              captures: { ps_b_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_b_id}", restaurant_id: "${r_id}", park_session_id: "${ps_b_id}", dining_plan_id: "${dp_b_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_b_id}"
              captures: { res_b_id: $.data.id }
            - call: "POST /v1/reservations/${res_b_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_b_id}"
          trigger:
            - call: "POST /v1/reservations/${res_b_id}/party-size"
              payload: { party_size: 4 }
              as: Guest
              as_user_id: "${g_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 422"
            - "response.data.error_id == 'ERR_PARTY_SIZE_PATCH_INFEASIBLE'"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: guest_cannot_seat_reservation_returns_forbidden
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - roles[Restaurant]
          - endpoints.POST_/v1/reservations/{id}/seat
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          POST /v1/reservations/{id}/seat is exclusive to Restaurant. Guest invoking it
          returns ERR_FORBIDDEN (403).
        test_recipe:
          setup:
            - "Reservation CHECKED_IN by Guest."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_rb1@x.com", full_name: "RB1", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rrb1", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T17:55:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/park-sessions/${ps_id}/activate"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /v1/reservations/${res_id}/check-in"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /v1/reservations/${res_id}/seat"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 403"
            - "response.data.error_id == 'ERR_FORBIDDEN'"

      - name: restaurant_cannot_create_dining_plan_returns_forbidden
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - roles[PlatformAdmin]
          - endpoints.POST_/v1/dining-plans
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: |
          POST /v1/dining-plans is exclusive to PlatformAdmin. Restaurant invoking it
          returns ERR_FORBIDDEN.
        test_recipe:
          setup:
            - "Restaurant entity exists; cast member acts as Restaurant role."
            - "Target guest exists."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/restaurants"
              payload: { name: "Rrb2", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/guests"
              payload: { email: "g_rb2@x.com", full_name: "RB2", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: Restaurant
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 403"
            - "response.data.error_id == 'ERR_FORBIDDEN'"

      - name: unauthenticated_request_without_user_role_returns_401
        claim_type: Authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.GET_/v1/restaurants
        distinguishing_aspect: |
          Request missing X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401),
          regardless of endpoint.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/restaurants"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 401"
            - "response.data.error_id == 'ERR_UNAUTHENTICATED'"

  # =========================================================================
  # Section: complexity_layers (OCC, cascade, scheduled actions, threshold)
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: occ_correct_version_succeeds_on_cancel
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-cancel-stale-version]
          - endpoints.POST_/v1/reservations/{id}/cancel
        distinguishing_aspect: |
          Positive companion to the OCC stale-version test: when client passes the CURRENT
          Reservation.version, the cancel succeeds. Demonstrates OCC discrimination.
        test_recipe:
          setup:
            - "Reservation CONFIRMED; client captured current version immediately afterward."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_occ@x.com", full_name: "OCC", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rocc", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v_current: $.data.version }
          trigger:
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: { expected_reservation_version: "${res_v_current}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v_after_cancel: $.data.version }
          assert:
            - "Response HTTP status == 200"
            - "Reservation.${res_id}.status == 'CANCELLED'"
            - "${res_v_after_cancel} > ${res_v_current}"

      - name: clock_set_changes_validation_outcome_scheduled_action
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/v1/_clock/set_current_utc
          - calculations.reservation_window_open_at
        distinguishing_aspect: |
          POST /v1/_clock/set_current_utc shifts the virtual current_utc; a booking that
          would have failed ERR_OUTSIDE_BOOKING_WINDOW BEFORE the clock advance SUCCEEDS
          AFTER the clock advance to a time inside the window.
        test_recipe:
          setup:
            - "Restaurant, Guest, DiningPlan, ParkSession provisioned for visit_date 2026-02-15."
            - "Clock initially at 2025-11-01T00:00:00Z (well outside window)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_sa@x.com", full_name: "SA", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rsa", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2025-11-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            # Confirm clock currently rejects:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          assert:
            - "Response HTTP status == 201"
            - "Reservation.${res_id}.status == 'PENDING'"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_dining_plan_balance_reflected_in_same_response
        claim_type: immediate
        grounds:
          - calculations.dining_plan_credit_debit
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - endpoints.POST_/v1/reservations/{id}/confirm
        distinguishing_aspect: |
          After POST /v1/reservations/{id}/confirm, the next GET /v1/dining-plans/{id}
          (same client, no delay) sees table_service_credits_held updated. Demonstrates
          immediate consistency model.
        test_recipe:
          setup:
