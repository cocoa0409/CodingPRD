              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "GET /subscriptions/${sub_id}/weekly-boxes"
              as: Member
              as_user_id: "${member_id}"
