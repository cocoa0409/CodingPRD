# =============================================================================
# PRD Benchmark Seed Tables — Fertility Benefit Network Management &
# Treatment Bundle Administration
# task_3113_fertility_benefit_network_management_treatment_bundle_administration
# =============================================================================
scenario: |
  Fertility Benefit Network Management & Treatment Bundle Administration (Progyny): employer benefit design in treatment bundles rather than dollar caps with bundle consumption rules, member intake with a care advocate assigned to guide clinic selection and treatment planning, clinic network contracting with quality criteria and negotiated bundle pricing, pre-authorization of a bundle with clinical appropriateness review and cycle sequencing, pharmacy benefit integration for fertility medications with specialty dispensing, coverage of preservation, donor and surrogacy pathways with differing rules, outcome tracking on live birth and multiple-birth rates informing network management, claim adjudication against bundle components and member cost share

domain_name: "fertility-benefit-network"
api_prefix: ""   # every endpoint path is an absolute top-level collection, e.g. /members, /clinics, /claims

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - selector_policy
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: expert
  entity_count: 13
  state_machine_count: 10
  calculation_count: 8
  endpoint_count: 65
  error_code_count: 30
  role_count: 6

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: EmployerAccount
    parent: null
    common_fields: true
    fields:
      - name: employer_name
        type: string
        source: input
        description: "Legal employer name sponsoring the fertility benefit"
      - name: plan_year
        type: integer
        source: input
        description: "Benefit plan year the bundle design is priced for"
      - name: funding_type
        type: enum
        source: input
        description: "How the employer funds the benefit"
        constraints: "SELF_FUNDED | FULLY_INSURED"
      - name: allocation_method
        type: enum
        source: input
        description: "How concurrent bundle liabilities are netted: SEQUENTIAL_BUNDLE nets consumed cycles only; CONCURRENT_BUNDLE also nets approved-but-unconsumed cycles"
        constraints: "SEQUENTIAL_BUNDLE | CONCURRENT_BUNDLE"
      - name: enrollment_limit
        type: integer
        source: input
        description: "Maximum number of covered members"
      - name: account_status
        type: enum
        source: system
        description: "Account state; starts ACTIVE on creation"
        constraints: "ACTIVE | SUSPENDED"
        default: "ACTIVE"
      - name: active_member_count
        type: integer
        source: computed
        description: "Count of Member rows on this account whose member_status IN {INTAKE, CARE_ACTIVE, CARE_COMPLETE}"
      - name: entitlement_count
        type: integer
        source: computed
        description: "Count of BundleEntitlement rows on this account with bundle_status IN {ACTIVE, EXHAUSTED}"

  - name: BundleEntitlement
    parent: EmployerAccount
    common_fields: true
    fields:
      - name: employer_account_id
        type: string
        source: system
        description: "FK -> EmployerAccount.id; sponsoring account"
      - name: bundle_type
        type: enum
        source: input
        description: "Treatment bundle this entitlement grants"
        constraints: "DIAGNOSTIC_IUI | IVF_RETRIEVAL_TRANSFER | PRESERVATION | DONOR_EGG | DONOR_SPERM | SURROGACY | MEDICATION"
      - name: lifetime_max_cycles
        type: integer
        source: input
        description: "Lifetime cycle allowance for the bundle"
      - name: max_cycles_per_year
        type: integer
        source: input
        description: "Annual cycle allowance inside the lifetime allowance"
      - name: max_transfers_per_cycle
        type: integer
        source: input
        description: "Maximum embryo transfers permitted within a single cycle"
      - name: pharmacy_pool_cents
        type: integer
        source: input
        description: "Lifetime specialty-pharmacy pool for fertility medications"
      - name: copay_max
        type: boolean
        source: input
        description: "Whether the bundle applies the maximum copay reduction to the negotiated bundle price"
        default: false
      - name: effective_from
        type: datetime
        source: input
        description: "Bundle start instant (inclusive)"
      - name: effective_to
        type: datetime
        source: input
        description: "Bundle end instant (exclusive)"
      - name: cycles_consumed
        type: integer
        source: computed
        description: "FINAL variant counter: count of TreatmentCycle rows linked to this bundle whose consumption marker is CONSUMED"
      - name: cycles_committed
        type: integer
        source: computed
        description: "PROVISIONAL variant counter: count of cycles in {APPROVED_UNCONSUMED, CONSUMED} across Preauthorizations linked to this bundle"
      - name: cycles_remaining
        type: integer
        source: computed
        description: "Allowance net of the employer's allocation_method variant; never below 0"
      - name: pharmacy_consumed_cents
        type: integer
        source: computed
        description: "Sum of plan_paid_cents over MEDICATION Claims in claim_status PAID linked to this bundle"
      - name: pharmacy_remaining_cents
        type: integer
        source: computed
        description: "pharmacy_pool_cents - pharmacy_consumed_cents; never below 0"
      - name: bundle_status
        type: enum
        source: computed
        description: "Derived posture: EXHAUSTED when cycles_remaining == 0 and pharmacy_remaining_cents == 0"
        constraints: "DRAFT | ACTIVE | SUSPENDED | EXHAUSTED"

  - name: CareAdvocate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Advocate name"
      - name: states_licensed
        type: array
        source: input
        description: "US state codes the advocate is licensed to guide members in"
      - name: specializations
        type: array
        source: input
        description: "Bundle types the advocate is specialized in"
      - name: caseload_limit
        type: integer
        source: input
        description: "Maximum concurrent members this advocate may carry"
      - name: credentials_expire_on
        type: datetime
        source: input
        description: "Instant the advocate's clinical credential lapses"
      - name: current_caseload
        type: integer
        source: computed
        description: "Count of Member rows with care_advocate_id == this advocate and member_status IN {CARE_ACTIVE, CARE_COMPLETE}"
      - name: assignments_completed
        type: integer
        source: computed
        description: "Count of Member rows with care_advocate_id == this advocate and member_status == CARE_COMPLETE"
      - name: advocate_status
        type: enum
        source: computed
        description: "ACTIVE while current_caseload < caseload_limit and the credential has not lapsed; AT_CAPACITY when current_caseload >= caseload_limit; INACTIVE otherwise"
        constraints: "ACTIVE | AT_CAPACITY | INACTIVE"

  - name: Member
    parent: EmployerAccount
    common_fields: true
    fields:
      - name: employer_account_id
        type: string
        source: system
        description: "FK -> EmployerAccount.id; sponsoring account"
      - name: external_ref
        type: string
        source: input
        description: "Employer-side member reference; unique per employer_account_id"
      - name: full_name
        type: string
        source: input
        description: "Member name"
      - name: state_code
        type: string
        source: input
        description: "Member's state of residence, used as the licensing gate for advocate selection"
      - name: required_track
        type: enum
        source: input
        description: "Treatment track the member needs a care advocate to be specialized in; drives the advocate selector's specialization filter"
        constraints: "STANDARD_IVF | DIAGNOSTIC_IUI | PRESERVATION | DONOR_EGG | DONOR_SPERM | SURROGACY"
      - name: member_status
        type: enum
        source: system
        description: "Member lifecycle; starts INTAKE"
        constraints: "INTAKE | CARE_ACTIVE | CARE_COMPLETE"
        default: "INTAKE"
      - name: care_advocate_id
        type: string
        source: system
        description: "FK -> CareAdvocate.id; currently assigned care advocate, null while member_status == INTAKE"
      - name: clinic_id
        type: string
        source: system
        description: "FK -> Clinic.id; member's current clinic of record, null until first set by POST /members/{id}/select-clinic"
      - name: pathway_selected
        type: enum
        source: computed
        description: "NONE while no PathwayRequest is APPROVED/ACTIVE; otherwise the pathway_type of the earliest-created such request"
        constraints: "NONE | PRESERVATION | DONOR_EGG | DONOR_SPERM | SURROGACY"
      - name: completed_cycles
        type: integer
        source: computed
        description: "Count of TreatmentCycle rows for this member with cycle_status == OUTCOME_RECORDED"
      - name: live_births_recorded
        type: integer
        source: computed
        description: "Sum of births_count over OutcomeRecord rows for this member with outcome_status IN {RECORDED, AMENDED}"
      - name: intake_completed_at
        type: datetime
        source: system
        description: "Instant intake finished; null while member_status == INTAKE"

  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Clinic legal name"
      - name: npi
        type: string
        source: input
        description: "Ten-digit National Provider Identifier; globally unique"
      - name: required_quality_report_count
        type: integer
        source: input
        description: "Number of outcome records the clinic must accumulate before its contract may be activated"
      - name: state_code
        type: string
        source: input
        description: "Clinic state of operation"
      - name: network_tier
        type: enum
        source: input
        description: "Contracted network tier"
        constraints: "PREFERRED | STANDARD | OUT_OF_NETWORK"
      - name: min_live_birth_rate_bps
        type: integer
        source: input
        description: "Quality floor in basis points; breaching it demotes the clinic posture"
      - name: max_multiple_birth_rate_bps
        type: integer
        source: input
        description: "Quality ceiling on multiple-birth rate in basis points"
      - name: maturity_report_threshold
        type: integer
        source: input
        description: "Number of reported cycles a clinic must accumulate before its quality readings are allowed to drive posture"
      - name: live_birth_rate_bps
        type: computed
        source: computed
        description: "Round-half-up of 10000 * live-birth cycles / reported cycles"
      - name: multiple_birth_rate_bps
        type: computed
        source: computed
        description: "Round-half-up of 10000 * multiple-birth cycles / live-birth cycles"
      - name: composite_quality_bps
        type: computed
        description: "Weighted quality score, see network_quality_score"
        source: computed
      - name: cycles_reported
        type: integer
        source: computed
        description: "Count of OutcomeRecord rows for this clinic with outcome_status IN {RECORDED, AMENDED}"
      - name: clinic_status
        type: enum
        source: computed
        description: "Posture derived from contract states and the quality readings; PROBATION when the quality floor/ceiling is breached"
        constraints: "IN_REVIEW | CONTRACTED | PROBATION | SUSPENDED | TERMINATED"

  - name: ClinicContract
    parent: Clinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: system
        description: "FK -> Clinic.id; contracting clinic"
      - name: effective_from
        type: datetime
        source: input
        description: "Contract start instant (inclusive)"
      - name: effective_to
        type: datetime
        source: input
        description: "Contract end instant (exclusive)"
      - name: bundle_rates
        type: object
        source: input
        description: "Negotiated per-bundle price map, e.g. {IVF_RETRIEVAL_TRANSFER: 1450000, DIAGNOSTIC_IUI: 220000}"
      - name: contracting_status
        type: enum
        source: system
        description: "Contract lifecycle; starts IN_REVIEW"
        constraints: "IN_REVIEW | ACTIVE | FROZEN | TERMINATED"
        default: "IN_REVIEW"
      - name: frozen_reason
        type: string
        source: system
        description: "Populated only while contracting_status == FROZEN; null otherwise"

  - name: TreatmentPlan
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; member this plan serves"
      - name: care_advocate_id
        type: string
        source: system
        description: "FK -> CareAdvocate.id; guiding advocate, snapshotted from the member at creation"
      - name: bundle_entitlement_id
        type: string
        source: system
        description: "FK -> BundleEntitlement.id; entitlement this plan draws on"
      - name: clinic_id
        type: string
        source: system
        description: "FK -> Clinic.id; selected clinic, null until CLINIC_SELECTED"
      - name: pathway_type
        type: enum
        source: input
        description: "Pathway the plan follows"
        constraints: "STANDARD_IVF | DIAGNOSTIC_IUI | PRESERVATION | DONOR_EGG | DONOR_SPERM | SURROGACY"
      - name: plan_status
        type: enum
        source: system
        description: "Plan lifecycle; starts PLAN_DRAFT"
        constraints: "PLAN_DRAFT | CLINIC_SELECTED | AUTHORIZATION_PENDING | IN_PROGRESS | PLANNING_REVISION | COMPLETED | ABANDONED"
        default: "PLAN_DRAFT"
      - name: planned_cycles
        type: integer
        source: input
        description: "Number of cycles the plan intends to run"
      - name: min_inter_cycle_days
        type: integer
        source: input
        description: "Minimum number of whole days that must separate this plan's consecutive cycles; a new cycle's stimulation start must be at least this many days after the plan's latest prior transfer instant"
      - name: selected_bundle_price_cents
        type: integer
        source: computed
        description: "Negotiated price snapshotted from the selected ClinicContract bundle_rates at CLINIC_SELECTED"
      - name: cycles_completed
        type: integer
        source: computed
        description: "Count of TreatmentCycle rows for this plan with cycle_status == OUTCOME_RECORDED"
      - name: plan_blocked_reason
        type: string
        source: system
        description: "Populated by the clinic-posture cascade while the selected clinic is not CONTRACTED"

  - name: Preauthorization
    parent: TreatmentPlan
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: system
        description: "FK -> TreatmentPlan.id; plan this authorization covers"
      - name: cycle_sequence_index
        type: integer
        source: input
        description: "One-based position of the authorized cycle in the plan's cycle sequence"
      - name: criteria_inputs
        type: object
        source: input
        description: "Clinical inputs for appropriateness scoring; keys are age_years, amh_ng_ml, prior_cycles, prior_live_birth, fsh_iu_l"
      - name: member_cost_share_pct
        type: integer
        source: input
        description: "Member responsibility percentage (0-100) applied to this bundle"
      - name: review_status
        type: enum
        source: system
        description: "Clinical review dimension; starts SUBMITTED"
        constraints: "SUBMITTED | CLINICAL_REVIEW | APPROVED | DENIED | EXPIRED"
        default: "SUBMITTED"
      - name: consumption_status
        type: enum
        source: system
        description: "Independent consumption dimension on the same row; starts UNCONSUMED"
        constraints: "UNCONSUMED | PARTIALLY_CONSUMED | EXHAUSTED"
        default: "UNCONSUMED"
      - name: clinical_criteria_score
        type: integer
        source: computed
        description: "Appropriateness score from clinical_criteria_gate"
      - name: approved_cycles
        type: integer
        source: computed
        description: "Cycles this authorization approves: 1 while APPROVED, else 0"
      - name: consumed_cycles
        type: integer
        source: computed
        description: "Count of TreatmentCycle rows linked to this authorization with consumption marker CONSUMED"
      - name: bundle_price_snapshot_cents
        type: integer
        source: computed
        description: "Negotiated bundle price frozen at APPROVED (version-pinning); 0 until then"
      - name: effective_from
        type: datetime
        source: system
        description: "Authorization validity start (inclusive); set at APPROVED"
      - name: effective_to
        type: datetime
        source: system
        description: "Authorization validity end (exclusive); set at APPROVED"
      - name: denial_reason_code
        type: string
        source: system
        description: "Set on DENIED; cleared when the authorization returns to CLINICAL_REVIEW"
      - name: decision_actor
        type: string
        source: system
        description: "X-User-ID of the reviewer who rendered the last decision"

  - name: TreatmentCycle
    parent: TreatmentPlan
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: system
        description: "FK -> TreatmentPlan.id; owning plan"
      - name: preauthorization_id
        type: string
        source: system
        description: "FK -> Preauthorization.id; authorization that admitted this cycle"
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; member undergoing the cycle"
      - name: cycle_index
        type: integer
        source: computed
        description: "One-based ordinal within the plan, assigned by creation order of created_at ascending"
      - name: cycle_status
        type: enum
        source: system
        description: "Cycle lifecycle; starts SCHEDULED"
        constraints: "SCHEDULED | STIMULATION | RETRIEVAL | FERTILIZATION | TRANSFER | OUTCOME_PENDING | OUTCOME_RECORDED | CANCELLED"
        default: "SCHEDULED"
      - name: retrieval_date
        type: datetime
        source: input
        description: "Planned oocyte retrieval instant"
      - name: transfer_date
        type: datetime
        source: input
        description: "Planned embryo transfer instant"
      - name: embryos_transferred
        type: integer
        source: input
        description: "Number of embryos transferred in this cycle"
      - name: consumption_marker
        type: enum
        source: system
        description: "UNCONSUMED until OUTCOME_RECORDED; CONSUMED once recorded; released back to UNCONSUMED by a compensation"
        constraints: "UNCONSUMED | CONSUMED"
        default: "UNCONSUMED"

  - name: MedicationOrder
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; member the medication is for"
      - name: care_advocate_id
        type: string
        source: system
        description: "FK -> CareAdvocate.id; advocate who placed the order"
      - name: preauthorization_id
        type: string
        source: system
        description: "FK -> Preauthorization.id; medication-benefit authorization the order draws on"
      - name: medication_code
        type: string
        source: input
        description: "Specialty drug code"
      - name: specialty_drug
        type: boolean
        source: input
        description: "True when the drug must ship from the specialty pharmacy network"
      - name: quantity
        type: integer
        source: input
        description: "Dispensed quantity in the drug's unit of measure"
      - name: days_supply
        type: integer
        source: input
        description: "Days of therapy the fill covers"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "Specialty pharmacy acquisition cost"
      - name: dispensing_pharmacy
        type: string
        source: input
        description: "Specialty dispensing pharmacy identifier"
      - name: pharmacy_status
        type: enum
        source: system
        description: "Fulfillment lifecycle; starts PRESCRIBED"
        constraints: "PRESCRIBED | DISPENSING | DISPENSED | SHIPPED | DELIVERED | CANCELLED"
        default: "PRESCRIBED"
      - name: plan_paid_cents
        type: integer
        source: computed
        description: "Pharmacy-pool portion, see pharmacy_pool_allocation"
      - name: member_cost_cents
        type: integer
        source: computed
        description: "Member portion of acquisition_cost_cents, the exact complement of plan_paid_cents"
      - name: dispensed_on
        type: datetime
        source: system
        description: "Instant the fill left the specialty pharmacy; null before DISPENSED"

  - name: PathwayRequest
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; requesting member"
      - name: care_advocate_id
        type: string
        source: system
        description: "FK -> CareAdvocate.id; advocate who filed the request"
      - name: pathway_type
        type: enum
        source: input
        description: "Non-standard pathway being requested"
        constraints: "PRESERVATION | DONOR_EGG | DONOR_SPERM | SURROGACY"
      - name: pathway_status
        type: enum
        source: system
        description: "Request lifecycle; starts DRAFT"
        constraints: "DRAFT | CLINICAL_REVIEW | APPROVED | DENIED | ACTIVE | COMPLETED | WITHDRAWN"
        default: "DRAFT"
      - name: consent_signed
        type: boolean
        source: input
        description: "Whether the pathway-specific consent packet has been executed"
      - name: consent_signed_on
        type: datetime
        source: input
        description: "Instant consent was executed; null when consent_signed is false"
      - name: gestational_carrier_ref
        type: string
        source: input
        description: "Surrogacy carrier reference; required for SURROGACY, ignored otherwise"
      - name: donor_agency_ref
        type: string
        source: input
        description: "Donor agency reference; required for DONOR_EGG and DONOR_SPERM, ignored otherwise"
      - name: coverage_pct
        type: integer
        source: input
        description: "Plan coverage percentage for this pathway (0-100)"
      - name: pathway_cost_cents
        type: integer
        source: computed
        description: "Plan-covered cost derived from coverage_pct and the pathway's rule-set baseline"

  - name: Claim
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; member whose benefit pays"
      - name: preauthorization_id
        type: string
        source: system
        description: "FK -> Preauthorization.id; authorization the claim is adjudicated against"
      - name: treatment_cycle_id
        type: string
        source: system
        description: "FK -> TreatmentCycle.id; cycle the billed service belongs to"
      - name: service_category
        type: enum
        source: input
        description: "Bundle component being billed"
        constraints: "CLINIC_BUNDLE | MEDICATION | LAB | STORAGE | DONOR_MATERIAL | SURROGACY_FEE"
      - name: billed_cents
        type: integer
        source: input
        description: "Provider billed charge"
      - name: claim_status
        type: enum
        source: system
        description: "Adjudication lifecycle; starts RECEIVED"
        constraints: "RECEIVED | PENDED | ADJUDICATED | DENIED | APPEALED | PAID | REVERSED"
        default: "RECEIVED"
      - name: allowed_cents
        type: integer
        source: computed
        description: "Negotiated/contractual allowance from claim_allowed_amount"
      - name: member_cost_share_cents
        type: integer
        source: computed
        description: "Member responsibility from member_cost_share (PROVISIONAL before adjudication, FINAL after)"
      - name: plan_paid_cents
        type: integer
        source: computed
        description: "allowed_cents - member_cost_share_cents; never negative"
      - name: member_accumulator_before_cents
        type: integer
        source: computed
        description: "Member out-of-pocket running total on the authorization before this claim"
      - name: member_accumulator_after_cents
        type: integer
        source: computed
        description: "Member out-of-pocket running total after this claim"
      - name: adjudication_basis
        type: string
        source: system
        description: "Which rule produced allowed_cents, e.g. CONTRACT_RATE or BUNDLE_COMPONENT_RULE"
      - name: pended_reason
        type: string
        source: system
        description: "Set while claim_status == PENDED; null otherwise"

  - name: OutcomeRecord
    parent: Clinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: system
        description: "FK -> Clinic.id; reporting clinic"
      - name: treatment_cycle_id
        type: string
        source: system
        description: "FK -> TreatmentCycle.id; cycle the outcome belongs to"
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; member the cycle belongs to"
      - name: live_birth
        type: boolean
        source: input
        description: "Whether the cycle produced a live birth"
      - name: births_count
        type: integer
        source: input
        description: "Number of live-born infants; 0 when live_birth is false"
      - name: multiple_birth
        type: boolean
        source: input
        description: "Whether the live birth was a multiple birth; false when live_birth is false"
      - name: gestational_weeks
        type: integer
        source: input
        description: "Gestational age at delivery in completed weeks"
      - name: outcome_recorded_on
        type: datetime
        source: system
        description: "Instant the outcome was recorded"
      - name: outcome_status
        type: enum
        source: system
        description: "Record lifecycle; starts RECORDED"
        constraints: "RECORDED | AMENDED | VOIDED"
        default: "RECORDED"
      - name: amendment_reason
        type: string
        source: system
        description: "Populated only while outcome_status == AMENDED"
      - name: void_reason
        type: string
        source: system
        description: "Populated only while outcome_status == VOIDED"

  - name: SurrenderRoute
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; member the surrender route belongs to"
      - name: pathway_type
        type: enum
        source: input
        description: "Pathway the route is filed under"
        constraints: "PRESERVATION | DONOR_EGG | DONOR_SPERM | SURROGACY"
      - name: carrier_kind
        type: enum
        source: input
        description: "Who carries the arrangement: the member, a gestational carrier, or a frozen-asset custodian"
        constraints: "MEMBER | GESTATIONAL_CARRIER | CUSTODIAN"
      - name: route_from
        type: datetime
        source: input
        description: "Route occupancy start instant, inclusive; the cycle-retention period begins here"
      - name: route_to
        type: datetime
        source: input
        description: "Route occupancy end instant, exclusive; the cycle-retention period ends here"
      - name: route_status
        type: enum
        source: system
        description: "Route lifecycle; starts SUBMITTED"
        constraints: "SUBMITTED | ROUTED | RETIRED | WITHDRAWN"
        default: "SUBMITTED"
      - name: surrender_cost_cents
        type: computed
        source: computed
        description: "Route cost from the pathway rule-set round, see pathway_coverage_rule"
      - name: raw_cost_cents
        type: integer
        source: input
        description: "Route cost before the pathway rule-set round, used only for rule-set probing"# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: EmployerAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /employer-accounts/{id}/suspend"
        actor: PlanAdministrator
        preconditions:
          - "EmployerAccount.account_status == ACTIVE"
        side_effects:
          - "recompute EmployerAccount.active_member_count and EmployerAccount.entitlement_count"
          - "each BundleEntitlement on this account with bundle_status == ACTIVE recomputes cycles_remaining and pharmacy_remaining_cents and is read as DRAFT while the account is SUSPENDED"
          - "each Preauthorization whose treatment_plan belongs to a Member on this account and whose review_status == SUBMITTED transitions SUBMITTED -> EXPIRED with denial_reason_code ACCOUNT_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /employer-accounts/{id}/reactivate"
        actor: PlanAdministrator
        preconditions:
          - "EmployerAccount.account_status == SUSPENDED"
        side_effects:
          - "recompute EmployerAccount.active_member_count and EmployerAccount.entitlement_count"
          - "each BundleEntitlement on this account with bundle_status == DRAFT and a non-empty remaining allowance is read as ACTIVE again"

  - entity: BundleEntitlement
    initial_state: DRAFT
    terminal_states: [EXHAUSTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /bundle-entitlements/{id}/activate"
        actor: PlanAdministrator
        preconditions:
          - "BundleEntitlement.bundle_status == DRAFT"
          - "BundleEntitlement.effective_from <= the logical clock"
          - "employer account of BundleEntitlement.employer_account_id has account_status == ACTIVE"
        side_effects:
          - "BundleEntitlement.cycles_remaining recomputed under the employer's allocation_method"
          - "BundleEntitlement.pharmacy_remaining_cents recomputed"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system recompute on any mutation of a linked TreatmentCycle or Preauthorization (an in-place refresh of the counter fields; version advances by one only when at least one counter field actually changes)"
        actor: system
        preconditions:
          - "BundleEntitlement.bundle_status == ACTIVE"
        side_effects:
          - "cycles_consumed recomputed as count of linked TreatmentCycle rows with consumption_marker == CONSUMED"
          - "cycles_committed recomputed as count of Preauthorization cycles in {APPROVED_UNCONSUMED, CONSUMED} across the bundle's plans"
          - "cycles_remaining recomputed; BundleEntitlement.bundle_status -> EXHAUSTED when cycles_remaining == 0 and pharmacy_remaining_cents == 0"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system recompute after a TreatmentCycle reaches OUTCOME_RECORDED and consumption_marker becomes CONSUMED"
        actor: system
        preconditions:
          - "BundleEntitlement.bundle_status == ACTIVE"
          - "cycles_remaining == 0"
          - "pharmacy_remaining_cents == 0"
        side_effects:
          - "any Preauthorization on a plan drawing this bundle with review_status == SUBMITTED transitions SUBMITTED -> DENIED with denial_reason_code BUNDLE_EXHAUSTED"
          - "TreatmentPlan.selected_bundle_price_cents on every plan drawing this bundle is recomputed from the pinned ClinicContract.bundle_rates"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /bundle-entitlements/{id}/reinstate"
        actor: PlanAdministrator
        preconditions:
          - "BundleEntitlement.bundle_status == EXHAUSTED"
          - "EmployerAccount.account_status == ACTIVE"
        side_effects:
          - "BundleEntitlement.cycles_remaining recomputed; EXHAUSTED is a derived posture so a positive remainder returns the bundle to ACTIVE"

  - entity: Clinic
    initial_state: IN_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: IN_REVIEW
        to: CONTRACTED
        trigger: "POST /clinic-contracts/{id}/activate"
        actor: NetworkManager
        preconditions:
          - "the ContractingClinic record of Clinic.npi has contracting_status == IN_REVIEW"
          - "Clinic.required_quality_report_count >= 3"
          - "the logical clock is < ClinicContract.effective_to"
        side_effects:
          - "ClinicContract of the triggering contract -> ACTIVE"
          - "Clinic.clinic_status -> CONTRACTED"
      - from: CONTRACTED
        to: PROBATION
        trigger: "system quality recompute after POST /clinics/{id}/report-outcome"
        actor: system
        preconditions:
          - "Clinic.clinic_status == CONTRACTED"
          - "Clinic.cycles_reported >= Clinic.maturity_report_threshold"
          - "live_birth_rate_bps < Clinic.min_live_birth_rate_bps OR multiple_birth_rate_bps > Clinic.max_multiple_birth_rate_bps"
        side_effects:
          - "each ClinicContract of this clinic with contracting_status == ACTIVE -> FROZEN with frozen_reason = QUALITY_BREACH"
          - "each TreatmentPlan whose clinic_id == Clinic.id and plan_status == CLINIC_SELECTED -> PLANNING_REVISION with plan_blocked_reason = CLINIC_NOT_CONTRACTED"
          - "each TreatmentPlan whose clinic_id == Clinic.id and plan_status == AUTHORIZATION_PENDING -> PLANNING_REVISION with plan_blocked_reason = CLINIC_NOT_CONTRACTED"
      - from: PROBATION
        to: CONTRACTED
        trigger: "system quality recompute after POST /outcome-records/{id}/amend"
        actor: system
        preconditions:
          - "Clinic.clinic_status == PROBATION"
          - "live_birth_rate_bps >= Clinic.min_live_birth_rate_bps"
          - "multiple_birth_rate_bps <= Clinic.max_multiple_birth_rate_bps"
        side_effects:
          - "each ClinicContract of this clinic with contracting_status == FROZEN and frozen_reason == QUALITY_BREACH -> ACTIVE with frozen_reason cleared"
      - from: CONTRACTED
        to: SUSPENDED
        trigger: "POST /clinics/{id}/suspend"
        actor: NetworkManager
        preconditions:
          - "Clinic.clinic_status IN {CONTRACTED, PROBATION}"
        side_effects:
          - "each ClinicContract of this clinic with contracting_status IN {ACTIVE, FROZEN} -> TERMINATED"
          - "each TreatmentPlan whose clinic_id == Clinic.id and plan_status IN {CLINIC_SELECTED, AUTHORIZATION_PENDING} -> PLANNING_REVISION with plan_blocked_reason = CLINIC_NOT_CONTRACTED"
          - "each Preauthorization on a plan of this clinic with review_status IN {SUBMITTED, CLINICAL_REVIEW} -> DENIED with denial_reason_code CLINIC_NOT_CONTRACTED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /clinics/{id}/terminate"
        actor: NetworkManager
        preconditions:
          - "Clinic.clinic_status == SUSPENDED"
        side_effects:
          - "Clinic.clinic_status is terminal; no further contract or plan may reference this clinic"

  - entity: ClinicContract
    initial_state: IN_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: IN_REVIEW
        to: ACTIVE
        trigger: "POST /clinic-contracts/{id}/activate"
        actor: NetworkManager
        preconditions:
          - "ClinicContract.contracting_status == IN_REVIEW"
          - "the clinic of ClinicContract.clinic_id has clinic_status == IN_REVIEW"
          - "the logical clock is inside [effective_from, effective_to)"
        side_effects:
          - "Clinic.clinic_status -> CONTRACTED"
      - from: ACTIVE
        to: FROZEN
        trigger: "system quality recompute on the owning clinic"
        actor: system
        preconditions:
          - "ClinicContract.contracting_status == ACTIVE"
          - "Clinic.clinic_status == PROBATION"
        side_effects:
          - "frozen_reason = QUALITY_BREACH"
      - from: FROZEN
        to: ACTIVE
        trigger: "system quality recompute on the owning clinic"
        actor: system
        preconditions:
          - "ClinicContract.contracting_status == FROZEN"
          - "Clinic.clinic_status == CONTRACTED"
        side_effects:
          - "frozen_reason cleared to null"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /clinic-contracts/{id}/terminate"
        actor: NetworkManager
        preconditions:
          - "ClinicContract.contracting_status IN {ACTIVE, FROZEN}"
        side_effects:
          - "Clinic.clinic_status -> TERMINATED"
          - "each TreatmentPlan whose clinic_id == this clinic and plan_status IN {CLINIC_SELECTED, AUTHORIZATION_PENDING} -> PLANNING_REVISION with plan_blocked_reason = CLINIC_NOT_CONTRACTED"

  - entity: Member
    initial_state: INTAKE
    terminal_states: [CARE_COMPLETE]
    transitions:
      - from: INTAKE
        to: CARE_ACTIVE
        trigger: "POST /members/{id}/complete-intake"
        actor: CareAdvocate
        preconditions:
          - "Member.member_status == INTAKE"
          - "Member.care_advocate_id is set (intake cannot complete before POST /members/{id}/assign-advocate)"
          - "the assigned CareAdvocate.advocate_status IN {ACTIVE, AT_CAPACITY}"
          - "the logical clock < CareAdvocate.credentials_expire_on"
        side_effects:
          - "Member.intake_completed_at set to the logical clock"
          - "CareAdvocate.current_caseload recomputed for the assigned advocate"
          - "EmployerAccount.active_member_count recomputed for the sponsoring account"
      - from: CARE_ACTIVE
        to: CARE_COMPLETE
        trigger: "POST /members/{id}/complete-care"
        actor: CareAdvocate
        preconditions:
          - "Member.member_status == CARE_ACTIVE"
          - "no TreatmentPlan of this member has plan_status IN {PLAN_DRAFT, CLINIC_SELECTED, AUTHORIZATION_PENDING, IN_PROGRESS, PLANNING_REVISION}"
          - "no PathwayRequest of this member has pathway_status IN {DRAFT, CLINICAL_REVIEW, APPROVED, ACTIVE}"
        side_effects:
          - "CareAdvocate.current_caseload and CareAdvocate.assignments_completed recomputed for the assigned advocate"
          - "EmployerAccount.active_member_count recomputed for the sponsoring account"

  - entity: TreatmentPlan
    initial_state: PLAN_DRAFT
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: PLAN_DRAFT
        to: CLINIC_SELECTED
        trigger: "POST /treatment-plans/{id}/select-clinic"
        actor: CareAdvocate
        preconditions:
          - "TreatmentPlan.plan_status == PLAN_DRAFT"
          - "the selected clinic has clinic_status == CONTRACTED"
          - "the selected clinic has a ClinicContract with contracting_status == ACTIVE covering the logical clock"
          - "that ClinicContract.bundle_rates contains an entry for the member's bundle_type"
        side_effects:
          - "TreatmentPlan.clinic_id set"
          - "TreatmentPlan.selected_bundle_price_cents snapshotted from ClinicContract.bundle_rates[bundle_type]"
      - from: CLINIC_SELECTED
        to: AUTHORIZATION_PENDING
        trigger: "POST /treatment-plans/{id}/preauthorizations"
        actor: CareAdvocate
        preconditions:
          - "TreatmentPlan.plan_status IN {CLINIC_SELECTED, AUTHORIZATION_PENDING, IN_PROGRESS}"
          - "Preauthorization.cycle_sequence_index is greater than every existing Preauthorization.cycle_sequence_index on this plan"
          - "the bundle entitlement draws a remaining cycle under the employer's allocation_method"
        side_effects:
          - "Preauthorization created in review_status SUBMITTED with consumption_status UNCONSUMED"
          - "TreatmentPlan.plan_status -> AUTHORIZATION_PENDING"
      - from: IN_PROGRESS
        to: AUTHORIZATION_PENDING
        trigger: "POST /treatment-plans/{id}/preauthorizations"
        actor: CareAdvocate
        preconditions:
          - "TreatmentPlan.plan_status IN {CLINIC_SELECTED, AUTHORIZATION_PENDING, IN_PROGRESS}"
          - "Preauthorization.cycle_sequence_index is greater than every existing Preauthorization.cycle_sequence_index on this plan"
          - "the bundle entitlement draws a remaining cycle under the employer's allocation_method"
        side_effects:
          - "Preauthorization created in review_status SUBMITTED with consumption_status UNCONSUMED"
          - "TreatmentPlan.plan_status -> AUTHORIZATION_PENDING"

      - from: AUTHORIZATION_PENDING
        to: IN_PROGRESS
        trigger: "system recompute when the plan's first Preauthorization reaches review_status APPROVED"
        actor: system
        preconditions:
          - "TreatmentPlan.plan_status == AUTHORIZATION_PENDING"
          - "at least one Preauthorization of this plan has review_status == APPROVED"
        side_effects:
          - "TreatmentPlan.plan_status -> IN_PROGRESS"
      - from: CLINIC_SELECTED
        to: PLANNING_REVISION
        trigger: "system clinic-posture cascade while TreatmentPlan.clinic_id is not CONTRACTED"
        actor: system
        preconditions:
          - "TreatmentPlan.plan_status IN {CLINIC_SELECTED, AUTHORIZATION_PENDING}"
          - "the clinic of TreatmentPlan.clinic_id has clinic_status != CONTRACTED"
        side_effects:
          - "plan_blocked_reason = CLINIC_NOT_CONTRACTED"
          - "each Preauthorization of this plan with review_status IN {SUBMITTED, CLINICAL_REVIEW} -> DENIED with denial_reason_code CLINIC_NOT_CONTRACTED"

      - from: AUTHORIZATION_PENDING
        to: PLANNING_REVISION
        trigger: "system clinic-posture cascade while TreatmentPlan.clinic_id is not CONTRACTED"
        actor: system
        preconditions:
          - "TreatmentPlan.plan_status IN {CLINIC_SELECTED, AUTHORIZATION_PENDING}"
          - "the clinic of TreatmentPlan.clinic_id has clinic_status != CONTRACTED"
        side_effects:
          - "plan_blocked_reason = CLINIC_NOT_CONTRACTED"
          - "each Preauthorization of this plan with review_status IN {SUBMITTED, CLINICAL_REVIEW} -> DENIED with denial_reason_code CLINIC_NOT_CONTRACTED"

      - from: IN_PROGRESS
        to: PLANNING_REVISION
        trigger: "system clinic-posture cascade while TreatmentPlan.clinic_id is not CONTRACTED"
        actor: system
        preconditions:
          - "TreatmentPlan.plan_status == IN_PROGRESS"
          - "the clinic of TreatmentPlan.clinic_id has clinic_status != CONTRACTED"
        side_effects:
          - "plan_blocked_reason = CLINIC_NOT_CONTRACTED"
          - "each Preauthorization of this plan with review_status IN {SUBMITTED, CLINICAL_REVIEW} -> DENIED with denial_reason_code CLINIC_NOT_CONTRACTED"
      - from: PLANNING_REVISION
        to: AUTHORIZATION_PENDING
        trigger: "POST /treatment-plans/{id}/resubmit-plan"
        actor: CareAdvocate
        preconditions:
          - "TreatmentPlan.plan_status == PLANNING_REVISION"
          - "the clinic of TreatmentPlan.clinic_id has clinic_status == CONTRACTED"
          - "TreatmentPlan.clinic_id is unchanged by this request"
        side_effects:
          - "plan_blocked_reason cleared to null"
          - "each Preauthorization of this plan with review_status == DENIED and denial_reason_code == CLINIC_NOT_CONTRACTED -> CLINICAL_REVIEW with denial_reason_code cleared"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system recompute when TreatmentPlan.cycles_completed reaches TreatmentPlan.planned_cycles"
        actor: system
        preconditions:
          - "TreatmentPlan.plan_status == IN_PROGRESS"
          - "TreatmentPlan.cycles_completed >= TreatmentPlan.planned_cycles"
        side_effects:
          - "Member.completed_cycles recomputed"
      - from: PLAN_DRAFT
        to: ABANDONED
        trigger: "POST /treatment-plans/{id}/abandon"
        actor: CareAdvocate
        preconditions:
          - "TreatmentPlan.plan_status IN {PLAN_DRAFT, CLINIC_SELECTED, PLANNING_REVISION}"
        side_effects:
          - "each Preauthorization of this plan with review_status IN {SUBMITTED, CLINICAL_REVIEW, APPROVED} -> EXPIRED"
          - "each TreatmentCycle of this plan with cycle_status != OUTCOME_RECORDED -> CANCELLED with consumption_marker UNCONSUMED"
      - from: CLINIC_SELECTED
        to: ABANDONED
        trigger: "POST /treatment-plans/{id}/abandon"
        actor: CareAdvocate
        preconditions:
          - "TreatmentPlan.plan_status IN {PLAN_DRAFT, CLINIC_SELECTED, PLANNING_REVISION}"
        side_effects:
          - "each Preauthorization of this plan with review_status IN {SUBMITTED, CLINICAL_REVIEW, APPROVED} -> EXPIRED"
          - "each TreatmentCycle of this plan with cycle_status != OUTCOME_RECORDED -> CANCELLED with consumption_marker UNCONSUMED"
      - from: PLANNING_REVISION
        to: ABANDONED
        trigger: "POST /treatment-plans/{id}/abandon"
        actor: CareAdvocate
        preconditions:
          - "TreatmentPlan.plan_status IN {PLAN_DRAFT, CLINIC_SELECTED, PLANNING_REVISION}"
        side_effects:
          - "each Preauthorization of this plan with review_status IN {SUBMITTED, CLINICAL_REVIEW, APPROVED} -> EXPIRED"
          - "each TreatmentCycle of this plan with cycle_status != OUTCOME_RECORDED -> CANCELLED with consumption_marker UNCONSUMED"

  - entity: Preauthorization
    initial_state: "SUBMITTED / UNCONSUMED"
    terminal_states: ["EXPIRED / UNCONSUMED"]
    note: "Compound machine: review_status and consumption_status are two independent dimensions on one row. review_status: SUBMITTED -> CLINICAL_REVIEW -> {APPROVED | DENIED}; DENIED -> CLINICAL_REVIEW (revision loop); SUBMITTED|CLINICAL_REVIEW|APPROVED -> EXPIRED. consumption_status: UNCONSUMED -> PARTIALLY_CONSUMED -> EXHAUSTED, and every consumption dimension can be released back by the compensation on Claim reversal."
    transitions:
      - from: "SUBMITTED / UNCONSUMED"
        to: "CLINICAL_REVIEW / UNCONSUMED"
        trigger: "POST /preauthorizations/{id}/begin-clinical-review"
        actor: ClinicalReviewer
        preconditions:
          - "Preauthorization.review_status == SUBMITTED"
          - "Preauthorization.decision_actor is null or different from the X-User-ID of this caller"
        side_effects:
          - "clinical_criteria_score computed via clinical_criteria_gate"
      - from: "CLINICAL_REVIEW / UNCONSUMED"
        to: "APPROVED / UNCONSUMED"
        trigger: "POST /preauthorizations/{id}/decide"
        actor: ClinicalReviewer
        preconditions:
          - "Preauthorization.review_status == CLINICAL_REVIEW"
          - "clinical_criteria_score >= 70"
          - "the TreatmentPlan of Preauthorization.treatment_plan_id has plan_status == AUTHORIZATION_PENDING"
          - "the bundle the plan draws has cycles_remaining >= 1"
          - "the plan's TreatmentCycle count with cycle_index > Preauthorization.cycle_sequence_index is 0"
        side_effects:
          - "bundle_price_snapshot_cents pinned from TreatmentPlan.selected_bundle_price_cents"
          - "effective_from = logical clock; effective_to = effective_from + AUTHORIZATION_WINDOW_DAYS"
          - "approved_cycles = 1"
          - "BundleEntitlement.cycles_committed recomputed and cycles_remaining recomputed"
          - "TreatmentPlan.plan_status -> IN_PROGRESS"
          - "decision_actor = X-User-ID of the reviewer"
      - from: "CLINICAL_REVIEW / UNCONSUMED"
        to: "DENIED / UNCONSUMED"
        trigger: "POST /preauthorizations/{id}/decide"
        actor: ClinicalReviewer
        preconditions:
          - "Preauthorization.review_status == CLINICAL_REVIEW"
          - "clinical_criteria_score < 70"
        side_effects:
          - "denial_reason_code = CLINICAL_CRITERIA_NOT_MET"
          - "decision_actor = X-User-ID of the reviewer"
      - from: "DENIED / UNCONSUMED"
        to: "CLINICAL_REVIEW / UNCONSUMED"
        trigger: "POST /preauthorizations/{id}/revise-request"
        actor: CareAdvocate
        preconditions:
          - "Preauthorization.review_status == DENIED"
          - "denial_reason_code IN {CLINICAL_CRITERIA_NOT_MET, BUNDLE_EXHAUSTED}"
        side_effects:
          - "denial_reason_code cleared"
          - "clinical_criteria_score recomputed from the newly supplied criteria_inputs"
          - "decision_actor unchanged"
          - "BundleEntitlement.cycles_committed and cycles_remaining recomputed, so a retry against an allowance the requester has since earned is admitted"
      - from: "SUBMITTED / UNCONSUMED"
        to: "EXPIRED / UNCONSUMED"
        trigger: "POST /_system/tick"
        actor: system
        preconditions:
          - "Preauthorization.review_status IN {SUBMITTED, CLINICAL_REVIEW}"
          - "the logical clock is >= the submitted_at instant of the authorization plus SUBMITTED_EXPIRY_HOURS"
        side_effects:
          - "denial_reason_code = EXPIRED_NO_DECISION"
          - "TreatmentPlan.plan_status -> AUTHORIZATION_PENDING unchanged"
      - from: "CLINICAL_REVIEW / UNCONSUMED"
        to: "EXPIRED / UNCONSUMED"
        trigger: "POST /_system/tick"
        actor: system
        preconditions:
          - "Preauthorization.review_status IN {SUBMITTED, CLINICAL_REVIEW}"
          - "the logical clock is >= the submitted_at instant of the authorization plus SUBMITTED_EXPIRY_HOURS"
        side_effects:
          - "denial_reason_code = EXPIRED_NO_DECISION"
      - from: "APPROVED / UNCONSUMED"
        to: "APPROVED / PARTIALLY_CONSUMED"
        trigger: "system consumption recompute after POST /treatment-cycles/{id}/record-outcome"
        actor: system
        preconditions:
          - "Preauthorization.review_status == APPROVED"
          - "consumed_cycles == 1 and approved_cycles == 1"
        side_effects: []
      - from: "APPROVED / PARTIALLY_CONSUMED"
        to: "APPROVED / EXHAUSTED"
        trigger: "system consumption recompute after POST /treatment-cycles/{id}/record-outcome"
        actor: system
        preconditions:
          - "Preauthorization.review_status == APPROVED"
          - "consumed_cycles == 2 and approved_cycles == 1"
        side_effects:
          - "consumption_status -> EXHAUSTED on the compensating-reversal rule that two cycles were consumed against a single-cycle approval"
      - from: "APPROVED / PARTIALLY_CONSUMED"
        to: "APPROVED / UNCONSUMED"
        trigger: "POST /claims/{id}/reverse on a REVERSED Claim whose treatment_cycle_id is this authorization's cycle"
        actor: ClaimsProcessor
        preconditions:
          - "Claim.claim_status == PAID"
          - "Preauthorization.review_status == APPROVED"
        side_effects:
          - "TreatmentCycle.consumption_marker -> UNCONSUMED"
          - "consumed_cycles decremented; consumption_status -> UNCONSUMED"
          - "BundleEntitlement.cycles_consumed recomputed and cycles_remaining recomputed"
          - "plan_paid_cents on the reversed Claim -> 0 and member_cost_share_cents -> 0"

  - entity: TreatmentCycle
    initial_state: SCHEDULED
    terminal_states: [OUTCOME_RECORDED, CANCELLED]
    note: "Linear pipeline with a branch: RETRIEVAL -> FERTILIZATION -> {TRANSFER -> OUTCOME_PENDING -> OUTCOME_RECORDED} or {CANCELLED}. Cycle index ordering is enforced: a cycle may not pass RETRIEVAL while another cycle of the same plan with a smaller cycle_index is not yet OUTCOME_RECORDED or CANCELLED."
    transitions:
      - from: SCHEDULED
        to: STIMULATION
        trigger: "POST /treatment-cycles/{id}/start-stimulation"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status == SCHEDULED"
          - "the Preauthorization of TreatmentCycle.preauthorization_id has review_status == APPROVED"
          - "the logical clock is inside [Preauthorization.effective_from, Preauthorization.effective_to)"
          - "no other TreatmentCycle of the same TreatmentPlan has cycle_status == STIMULATION"
        side_effects:
          - "no bundle consumption yet; cycles_committed already counted this cycle at APPROVED"
      - from: STIMULATION
        to: RETRIEVAL
        trigger: "POST /treatment-cycles/{id}/record-retrieval"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status == STIMULATION"
          - "every other TreatmentCycle of the same TreatmentPlan with cycle_index < TreatmentCycle.cycle_index has cycle_status IN {OUTCOME_RECORDED, CANCELLED}"
        side_effects: []
      - from: RETRIEVAL
        to: FERTILIZATION
        trigger: "POST /treatment-cycles/{id}/record-fertilization"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status == RETRIEVAL"
        side_effects: []
      - from: FERTILIZATION
        to: TRANSFER
        trigger: "POST /treatment-cycles/{id}/record-transfer"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status == FERTILIZATION"
          - "embryos_transferred >= 1"
          - "embryos_transferred <= the bundle entitlement's max_transfers_per_cycle"
        side_effects: []
      - from: TRANSFER
        to: OUTCOME_PENDING
        trigger: "POST /_system/tick"
        actor: system
        preconditions:
          - "TreatmentCycle.cycle_status == TRANSFER"
          - "the logical clock is >= TreatmentCycle.transfer_date + PREGNANCY_TEST_DAYS"
        side_effects: []
      - from: OUTCOME_PENDING
        to: OUTCOME_RECORDED
        trigger: "POST /treatment-cycles/{id}/record-outcome"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status == OUTCOME_PENDING"
        side_effects:
          - "TreatmentCycle.consumption_marker -> CONSUMED"
          - "Preauthorization.consumed_cycles incremented and consumption_status recomputed"
          - "BundleEntitlement.cycles_consumed recomputed and cycles_remaining recomputed"
          - "BundleEntitlement.bundle_status -> EXHAUSTED when cycles_remaining == 0 and pharmacy_remaining_cents == 0"
          - "Member.completed_cycles recomputed"
          - "TreatmentPlan.cycles_completed recomputed; plan_status -> COMPLETED when cycles_completed >= planned_cycles"
          - "the clinic-side network-quality record is NOT created here; only POST /clinics/{id}/report-outcome creates an OutcomeRecord"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /treatment-cycles/{id}/cancel"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status IN {SCHEDULED, STIMULATION, RETRIEVAL, FERTILIZATION, TRANSFER}"
        side_effects:
          - "consumption_marker stays UNCONSUMED"
          - "BundleEntitlement.cycles_committed recomputed; the cycle is released from the committed count"
      - from: STIMULATION
        to: CANCELLED
        trigger: "POST /treatment-cycles/{id}/cancel"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status IN {SCHEDULED, STIMULATION, RETRIEVAL, FERTILIZATION, TRANSFER}"
        side_effects:
          - "consumption_marker stays UNCONSUMED"
          - "BundleEntitlement.cycles_committed recomputed; the cycle is released from the committed count"
      - from: RETRIEVAL
        to: CANCELLED
        trigger: "POST /treatment-cycles/{id}/cancel"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status IN {SCHEDULED, STIMULATION, RETRIEVAL, FERTILIZATION, TRANSFER}"
        side_effects:
          - "consumption_marker stays UNCONSUMED"
          - "BundleEntitlement.cycles_committed recomputed; the cycle is released from the committed count"
      - from: FERTILIZATION
        to: CANCELLED
        trigger: "POST /treatment-cycles/{id}/cancel"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status IN {SCHEDULED, STIMULATION, RETRIEVAL, FERTILIZATION, TRANSFER}"
        side_effects:
          - "consumption_marker stays UNCONSUMED"
          - "BundleEntitlement.cycles_committed recomputed; the cycle is released from the committed count"
      - from: TRANSFER
        to: CANCELLED
        trigger: "POST /treatment-cycles/{id}/cancel"
        actor: ClinicCoordinator
        preconditions:
          - "TreatmentCycle.cycle_status IN {SCHEDULED, STIMULATION, RETRIEVAL, FERTILIZATION, TRANSFER}"
        side_effects:
          - "consumption_marker stays UNCONSUMED"
          - "BundleEntitlement.cycles_committed recomputed; the cycle is released from the committed count"

  - entity: MedicationOrder
    initial_state: PRESCRIBED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PRESCRIBED
        to: DISPENSING
        trigger: "POST /medication-orders/{id}/dispense"
        actor: SpecialtyPharmacist
        preconditions:
          - "MedicationOrder.pharmacy_status == PRESCRIBED"
          - "the Preauthorization of MedicationOrder.preauthorization_id has review_status == APPROVED"
          - "the bundle's medication entitlement has pharmacy_remaining_cents >= 1, so a pool of exactly 0 admits nothing (ERR_PHARMACY_POOL_EXHAUSTED)"
        side_effects:
          - "plan_paid_cents computed via pharmacy_pool_allocation"
          - "member_cost_cents computed as acquisition_cost_cents - plan_paid_cents"
          - "dispensed_on set to the logical clock"
          - "BundleEntitlement.pharmacy_consumed_cents recomputed and pharmacy_remaining_cents recomputed"
          - "BundleEntitlement.bundle_status -> EXHAUSTED when cycles_remaining == 0 and pharmacy_remaining_cents == 0"
      - from: DISPENSING
        to: DISPENSED
        trigger: "POST /medication-orders/{id}/ship"
        actor: SpecialtyPharmacist
        preconditions:
          - "MedicationOrder.pharmacy_status == DISPENSING"
        side_effects: []
      - from: DISPENSED
        to: SHIPPED
        trigger: "POST /medication-orders/{id}/deliver"
        actor: SpecialtyPharmacist
        preconditions:
          - "MedicationOrder.pharmacy_status IN {DISPENSED, SHIPPED}"
        side_effects:
          - "the member_cost_cents charge converts to a MEDICATION Claim in claim_status RECEIVED"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /medication-orders/{id}/deliver"
        actor: SpecialtyPharmacist
        preconditions:
          - "MedicationOrder.pharmacy_status IN {DISPENSED, SHIPPED}"
        side_effects:
          - "the member_cost_cents charge converts to a MEDICATION Claim in claim_status RECEIVED"
      - from: PRESCRIBED
        to: CANCELLED
        trigger: "POST /medication-orders/{id}/cancel"
        actor: SpecialtyPharmacist
        preconditions:
          - "MedicationOrder.pharmacy_status == PRESCRIBED"
        side_effects: []
      - from: DISPENSING
        to: CANCELLED
        trigger: "POST /medication-orders/{id}/cancel"
        actor: SpecialtyPharmacist
        preconditions:
          - "MedicationOrder.pharmacy_status == DISPENSING"
        side_effects:
          - "BundleEntitlement.pharmacy_consumed_cents recomputed downward by this order's plan_paid_cents; pharmacy_remaining_cents recomputed"
          - "plan_paid_cents -> 0 and member_cost_cents -> 0 on the cancelled order"

  - entity: PathwayRequest
    initial_state: DRAFT
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: CLINICAL_REVIEW
        trigger: "POST /pathway-requests/{id}/begin-clinical-review"
        actor: ClinicalReviewer
        preconditions:
          - "PathwayRequest.pathway_status == DRAFT"
          - "PathwayRequest.consent_signed == true"
          - "PathwayRequest.consent_signed_on is not null"
          - "pathway_type == SURROGACY implies gestational_carrier_ref is set"
          - "pathway_type IN {DONOR_EGG, DONOR_SPERM} implies donor_agency_ref is set"
        side_effects: []
      - from: CLINICAL_REVIEW
        to: APPROVED
        trigger: "POST /pathway-requests/{id}/decide"
        actor: ClinicalReviewer
        preconditions:
          - "PathwayRequest.pathway_status == CLINICAL_REVIEW"
          - "the member's EmployerAccount has account_status == ACTIVE"
          - "pathway coverage for this pathway_type is not barred by a SURROGACY rule conflict"
        side_effects:
          - "pathway_cost_cents computed via pathway_coverage_rule"
          - "Member.pathway_selected recomputed"
      - from: CLINICAL_REVIEW
        to: DENIED
        trigger: "POST /pathway-requests/{id}/decide"
        actor: ClinicalReviewer
        preconditions:
          - "PathwayRequest.pathway_status == CLINICAL_REVIEW"
          - "the member's EmployerAccount has account_status == SUSPENDED"
        side_effects: []
      - from: DENIED
        to: CLINICAL_REVIEW
        trigger: "POST /pathway-requests/{id}/begin-clinical-review"
        actor: ClinicalReviewer
        preconditions:
          - "PathwayRequest.pathway_status == DENIED"
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /pathway-requests/{id}/activate"
        actor: CareAdvocate
        preconditions:
          - "PathwayRequest.pathway_status == APPROVED"
          - "the member's EmployerAccount has account_status == ACTIVE"
        side_effects:
          - "Member.pathway_selected recomputed"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /pathway-requests/{id}/complete"
        actor: CareAdvocate
        preconditions:
          - "PathwayRequest.pathway_status == ACTIVE"
        side_effects:
          - "Member.pathway_selected recomputed"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /pathway-requests/{id}/withdraw"
        actor: CareAdvocate
        preconditions:
          - "PathwayRequest.pathway_status IN {DRAFT, CLINICAL_REVIEW, APPROVED, ACTIVE}"
        side_effects:
          - "Member.pathway_selected recomputed"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /pathway-requests/{id}/withdraw"
        actor: CareAdvocate
        preconditions:
          - "PathwayRequest.pathway_status IN {DRAFT, CLINICAL_REVIEW, APPROVED, ACTIVE}"
        side_effects:
          - "Member.pathway_selected recomputed"
      - from: CLINICAL_REVIEW
        to: WITHDRAWN
        trigger: "POST /pathway-requests/{id}/withdraw"
        actor: CareAdvocate
        preconditions:
          - "PathwayRequest.pathway_status IN {DRAFT, CLINICAL_REVIEW, APPROVED, ACTIVE}"
        side_effects:
          - "Member.pathway_selected recomputed"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /pathway-requests/{id}/withdraw"
        actor: CareAdvocate
        preconditions:
          - "PathwayRequest.pathway_status IN {DRAFT, CLINICAL_REVIEW, APPROVED, ACTIVE}"
        side_effects:
          - "Member.pathway_selected recomputed"

  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [PAID, DENIED, REVERSED]
    transitions:
      - from: RECEIVED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: ClaimsProcessor
        preconditions:
          - "Claim.claim_status == RECEIVED"
          - "the Preauthorization of Claim.preauthorization_id has review_status == APPROVED"
          - "Claim.service_date_iso is inside [Preauthorization.effective_from, Preauthorization.effective_to)"
        side_effects:
          - "allowed_cents computed via claim_allowed_amount"
          - "member_cost_share_cents computed via member_cost_share (FINAL variant)"
          - "plan_paid_cents = allowed_cents - member_cost_share_cents"
          - "member_accumulator_after_cents = member_accumulator_before_cents + member_cost_share_cents"
          - "adjudication_basis set"
      - from: RECEIVED
        to: PENDED
        trigger: "POST /_system/tick"
        actor: system
        preconditions:
          - "Claim.claim_status == RECEIVED"
          - "the logical clock is >= the date-of-service instant plus CLAIM_PEND_AFTER_DAYS"
        side_effects:
          - "pended_reason = SUBMITTED_LATE_REQUIRES_DOCUMENTATION"
      - from: RECEIVED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsProcessor
        preconditions:
          - "Claim.claim_status IN {RECEIVED, PENDED}"
          - "the logical clock is >= Preauthorization.effective_to"
        side_effects:
          - "Claim.claim_status -> DENIED"
          - "monthly_claim_liability_cents recomputed for the member"
      - from: PENDED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsProcessor
        preconditions:
          - "Claim.claim_status IN {RECEIVED, PENDED}"
          - "the logical clock is >= Preauthorization.effective_to"
        side_effects:
          - "Claim.claim_status -> DENIED"
          - "monthly_claim_liability_cents recomputed for the member"
      - from: PENDED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: ClaimsProcessor
        preconditions:
          - "Claim.claim_status == PENDED"
          - "pended_reason is resolved by a re-adjudication request that carries service_date_iso"
        side_effects:
          - "allowed_cents computed via claim_allowed_amount"
          - "member_cost_share_cents computed via member_cost_share (FINAL variant)"
          - "plan_paid_cents = allowed_cents - member_cost_share_cents"
          - "member_accumulator_after_cents = member_accumulator_before_cents + member_cost_share_cents"
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /claims/{id}/pay"
        actor: ClaimsProcessor
        preconditions:
          - "Claim.claim_status == ADJUDICATED"
        side_effects:
          - "BundleEntitlement.pharmacy_consumed_cents recomputed when service_category == MEDICATION"
          - "BundleEntitlement.pharmacy_remaining_cents recomputed"
          - "monthly_claim_liability_cents recomputed for the member"
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: CareAdvocate
        preconditions:
          - "Claim.claim_status == DENIED"
          - "the logical clock is < Preauthorization.effective_to + APPEAL_WINDOW_DAYS"
        side_effects: []
      - from: APPEALED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/appeal-decide"
        actor: ClaimsReviewer
        preconditions:
          - "Claim.claim_status == APPEALED"
          - "the X-User-ID of this caller differs from the decision_actor recorded on the last adjudication of this claim"
        side_effects:
          - "allowed_cents computed via claim_allowed_amount"
          - "member_cost_share_cents computed via member_cost_share (FINAL variant)"
          - "Claim.claim_status -> ADJUDICATED"
      - from: PAID
        to: REVERSED
        trigger: "POST /claims/{id}/reverse"
        actor: ClaimsProcessor
        preconditions:
          - "Claim.claim_status == PAID"
          - "the logical clock is < Claim.paid_at + REVERSAL_WINDOW_DAYS"
        side_effects:
          - "member_accumulator_after_cents recomputed as member_accumulator_before_cents"
          - "TreatmentCycle.consumption_marker of Claim.treatment_cycle_id -> UNCONSUMED"
          - "Preauthorization.consumed_cycles decremented and consumption_status recomputed"
          - "BundleEntitlement.cycles_consumed recomputed and cycles_remaining recomputed"
          - "BundleEntitlement.pharmacy_consumed_cents recomputed downward when service_category == MEDICATION"

  - entity: OutcomeRecord
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: RECORDED
        trigger: "POST /clinics/{id}/report-outcome"
        actor: ClinicCoordinator
        preconditions:
          - "the TreatmentCycle of the reported treatment_cycle_id has cycle_status == OUTCOME_RECORDED"
          - "no OutcomeRecord with outcome_status IN {RECORDED, AMENDED} already exists for that treatment_cycle_id"
        side_effects:
          - "an OutcomeRecord is created in outcome_status RECORDED for the cycle's clinic"
          - "Clinic.cycles_reported recomputed"
          - "Clinic.live_birth_rate_bps, multiple_birth_rate_bps, composite_quality_bps recomputed"
          - "Member.live_births_recorded recomputed"
          - "the clinic recompute may drive Clinic.clinic_status CONTRACTED -> PROBATION"
      - from: RECORDED
        to: AMENDED
        trigger: "POST /outcome-records/{id}/amend"
        actor: NetworkManager
        preconditions:
          - "OutcomeRecord.outcome_status == RECORDED"
          - "the logical clock is < OutcomeRecord.outcome_recorded_on + AMENDMENT_WINDOW_DAYS"
        side_effects:
          - "amendment_reason set from the request"
          - "Clinic metrics recomputed"
          - "Member.live_births_recorded recomputed"
          - "Clinic-defined quality recompute may drive Clinic.clinic_status PROBATION -> CONTRACTED"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /outcome-records/{id}/void"
        actor: NetworkManager
        preconditions:
          - "OutcomeRecord.outcome_status IN {RECORDED, AMENDED}"
          - "no Claim referencing this treatment_cycle_id has claim_status == PAID"
        side_effects:
          - "Clinic.cycles_reported recomputed excluding this record"
          - "Clinic metrics recomputed"
          - "Member.live_births_recorded recomputed"
      - from: AMENDED
        to: VOIDED
        trigger: "POST /outcome-records/{id}/void"
        actor: NetworkManager
        preconditions:
          - "OutcomeRecord.outcome_status IN {RECORDED, AMENDED}"
          - "no Claim referencing this treatment_cycle_id has claim_status == PAID"
        side_effects:
          - "Clinic.cycles_reported recomputed excluding this record"
          - "Clinic metrics recomputed"
          - "Member.live_births_recorded recomputed"


  - entity: SurrenderRoute
    initial_state: SUBMITTED
    terminal_states: [RETIRED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ROUTED
        trigger: "POST /_system/tick once the route's preroute lead time has elapsed"
        actor: system
        preconditions:
          - "SurrenderRoute.route_status == SUBMITTED"
          - "the logical clock is >= SurrenderRoute.route_from minus PREROUTE_LEAD_DAYS"
        side_effects:
          - "the member's lifecycle entry into routed-pathway custody moves the member's completed_cycles and live_births_recorded into the read-only routed-custody set; Member.pathway_selected recomputed"
          - "Member.version incremented, so any in-flight plan change carrying a stale expected_member_version is rejected"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /members/{id}/surrender-routes/withdraw"
        actor: CareAdvocate
        preconditions:
          - "SurrenderRoute.route_status == SUBMITTED"
        side_effects:
          - "SurrenderRoute.route_status -> WITHDRAWN; Member.version incremented"
      - from: ROUTED
        to: RETIRED
        trigger: "POST /members/{id}/surrender-routes/retire once the retention period has closed"
        actor: CareAdvocate
        preconditions:
          - "SurrenderRoute.route_status == ROUTED"
          - "the logical clock is >= SurrenderRoute.route_to + STORAGE_RETENTION_DAYS"
        side_effects:
          - "the member's lifecycle state is restored to the read-write plan set; Member.version incremented"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: preauth-decide-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /preauthorizations/{id}/decide"
    occ_field: "expected_treatment_plan_version"
    description: |
      Rendering a decision on a Preauthorization whose parent TreatmentPlan has
      advanced its version since the client last observed it is rejected. This
      captures the case where another writer has just changed the plan's state
      (for example selecting a different clinic or entering PLANNING_REVISION),
      so the authorization decision carried by this request was computed against
      a plan shape that no longer holds.
    error_id: ERR_PLAN_VERSION_STALE
    http_status: 412

  - rule_id: claim-pay-stale-auth
    parent_entity: Preauthorization
    write_endpoint: "POST /claims/{id}/pay"
    occ_field: "expected_preauthorization_version"
    description: |
      Paying a Claim against a Preauthorization whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      authorization has been freshly consumed or released by another writer since
      the claim was adjudicated, so the adjudicated allowance no longer reflects
      the authorization the payment would be drawn against.
    error_id: ERR_PREAUTH_VERSION_STALE
    http_status: 412

  - rule_id: outcome-report-stale-cycle
    parent_entity: TreatmentCycle
    write_endpoint: "POST /clinics/{id}/report-outcome"
    occ_field: "expected_treatment_cycle_version"
    description: |
      Reporting an outcome against a TreatmentCycle whose version has advanced
      since the client last observed it is rejected. This captures the case where
      the cycle has been cancelled by another writer since the clinic read it, so
      the reported outcome no longer describes a live cycle.
    error_id: ERR_CYCLE_VERSION_STALE
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- C1 -------------------------------------------------------------------
  - name: bundle_cycle_allowance
    trigger: "every mutation of a TreatmentCycle or Preauthorization linked to a BundleEntitlement, and every POST /bundle-entitlements/{id}/activate; recomputes BundleEntitlement.cycles_consumed, cycles_committed and cycles_remaining"
    algorithm: dual_variant_projection
    formula: |
      # Inclusion sets, pinned.
      consumed_set := { c in TreatmentCycle : c.treatment_plan.bundle_entitlement_id == B.id
                        AND c.consumption_marker == CONSUMED }
      approved_live_set := { p in Preauthorization : p.treatment_plan.bundle_entitlement_id == B.id
                        AND p.review_status == APPROVED
                        AND carbon_not_expired(p) }
      committed_set := { p in Preauthorization : p.treatment_plan.bundle_entitlement_id == B.id
                        AND ( (p.review_status == APPROVED AND carbon_not_expired(p))
                              OR p.review_status IN {SUBMITTED, CLINICAL_REVIEW} )
                        AND NOT bundle_cascade_denied(p) }

      B.cycles_consumed  := cardinality(consumed_set)
      B.cycles_committed := cardinality(committed_set)

      allowance_base := B.lifetime_max_cycles
                      - B.cycles_consumed_this_plan_year   # annual slice, future-dated = 0 for the whole benchmark
      netted := (E = employer(B) ; E.allocation_method == SEQUENTIAL_BUNDLE)
                  ? B.cycles_consumed
                  : B.cycles_committed
      B.cycles_remaining := max(0, min(allowance_base, B.max_cycles_per_year) - netted)

      # carbon_not_expired(p)  : the logical clock < p.effective_to
      # bundle_cascade_denied(p): p was moved to DENIED by the BUNDLE_EXHAUSTED cascade
      #                           without the reviewer changing the score
    input_set: "TreatmentCycle rows with consumption_marker CONSUMED set cycles_consumed. cycles_committed counts Preauthorization rows whose review_status is APPROVED-but-unexpired plus every not-yet-decided authorization that was not cascade-denied. CANCELLED cycles and EXPIRED authorizations never consume. Bundles whose owning EmployerAccount has account_status SUSPENDED are read as DRAFT and compute no netting at all."
    constants:
      SEQUENTIAL_NETTING: "consumed only"
      CONCURRENT_NETTING: "consumed + approved-but-unconsumed + pending"
      FLOOR: 0
    precision: "integer cycles, no rounding"
    variants:
      - name: sequential_consumed
        when: "employer(B).allocation_method == SEQUENTIAL_BUNDLE"
        difference: "nets only cycles already recorded (consumption_marker CONSUMED); approved-but-unconsumed and pending authorizations leave cycles_remaining untouched, so the same rows yield a strictly larger cycles_remaining than concurrent netting."
      - name: concurrent_committed
        when: "employer(B).allocation_method == CONCURRENT_BUNDLE"
        difference: "nets every committed cycle, so two APPROVED-but-unconsumed authorizations against a 3-cycle bundle leave cycles_remaining == 1 while sequential netting leaves it at 3."

  # --- C2 -------------------------------------------------------------------
  - name: cycle_sequence_validity_and_consumption
    trigger: "POST /treatment-cycles (cycle creation), POST /treatment-cycles/{id}/record-outcome, and POST /claims/{id}/reverse"
    algorithm: chronological_ordering_projection
    formula: |
      # Ordering. Sort key: created_at ASC. Tie-break: the row with the
      # lower X-User-ID of its creating actor first; if those are equal,
      # the row whose retrieval_date is earlier. `id` is never a sort key.
      ordered := sort(TreatmentCycle where treatment_plan_id == P.id, by created_at ASC, then creator_user_id ASC, then retrieval_date ASC)
      for k, c in enumerate(ordered, start=1):
          c.cycle_index := k            # one-based, recomputed on every creation
      valid_sequence := forall c in ordered:
          (c.predecessor exists) implies
              (c.predecessor.cycle_status IN {OUTCOME_RECORDED, CANCELLED}
               OR c.predecessor.consumption_marker == UNCONSUMED AND c.predecessor is in a recorded outcome)

      consumption_marks := forall c in ordered:
          c.cycle_status == OUTCOME_RECORDED  => c.consumption_marker == CONSUMED
          c.cycle_status == CANCELLED         => c.consumption_marker == UNCONSUMED
          otherwise                           => c.consumption_marker == UNCONSUMED

      # Compensation: reversing a PAID claim for cycle c sets
      # c.consumption_marker := UNCONSUMED, and the mark is NOT re-applied
      # unless a fresh POST /clinics/{id}/report-outcome re-records it.
    input_set: "Only cycles of the same TreatmentPlan participate in the ordering. CANCELLED cycles keep their position in the ordering so that a later cycle does not silently renumber ahead of them."
    constants:
      FIRST_INDEX: 1
      CONSUMED_ONLY_AT: "OUTCOME_RECORDED"
    precision: "integer index, no rounding"
    variants:
      - name: creation_order_index
        when: "the plan has cycles created in the order the clinic scheduled them"
        difference: "cycle_index follows created_at, so two cycles created in the same second are ordered by creating actor id then retrieval_date rather than by insertion order."
      - name: reordered_by_cancellation
        when: "an earlier cycle is CANCELLED and a later one reaches OUTCOME_RECORDED"
        difference: "the cancelled cycle holds index 1 and blocks nothing, while the recorded cycle holds index 2 — so cycles_completed counts 1 while cycle_index reads 2, and a naive dense-rank implementation would report 1."

  # --- C3 -------------------------------------------------------------------
  - name: network_quality_score
    trigger: "POST /clinics/{id}/report-outcome, POST /outcome-records/{id}/amend, POST /outcome-records/{id}/void"
    algorithm: weighted_scoring_with_tiebreak
    formula: |
      workset := { o in OutcomeRecord : o.clinic_id == C.id AND o.outcome_status IN {RECORDED, AMENDED} }
      n := cardinality(workset)
      C.cycles_reported := n

      q_live     := (n == 0) ? 0 : round_half_up(10000 * cardinality({o in workset : o.live_birth}) / n)
      q_multiple := (M == 0) ? 0 : round_half_up(10000 * cardinality({o in workset : o.multiple_birth}) / M)
          where M := cardinality({o in workset : o.live_birth})
      C.live_birth_rate_bps     := q_live
      C.multiple_birth_rate_bps := q_multiple

      # Eligibility, ranked: the gates below are evaluated in this order and
      # the first satisfied gate produces CONTRACTED.
      #   G1: n >= C.maturity_report_threshold AND q_live >= C.min_live_birth_rate_bps
      #       AND q_multiple <= C.max_multiple_birth_rate_bps
      #   G2: n == 0                        # no reporting at all, treated as contracted by default
      #   G3: n == C.maturity_report_threshold - 1   # one report short of the maturity window
      # never_eligible : no gate satisfied.
      # Tie between two gates cannot occur: the gates are evaluated as an
      # ordered list, not as a set.

      C.composite_quality_bps := round_half_up(
            LIVE_BIRTH_WEIGHT_BPS * min(q_live, 10000)
          - MULTIPLE_BIRTH_PENALTY_BPS * q_multiple
          + MATURITY_BONUS_BPS * min(n, MATURITY_CAP))
    input_set: "workset includes RECORDED and AMENDED records only; VOIDED records are excluded from both the numerator and the denominator, and a record is counted once whether it is RECORDED or AMENDED. A clinic with zero records reports q_live == 0 and q_multiple == 0 rather than erroring, and takes gate G2."
    constants:
      LIVE_BIRTH_WEIGHT_BPS: 60
      MULTIPLE_BIRTH_PENALTY_BPS: 45
      MATURITY_BONUS_BPS: 20
      MATURITY_CAP: 5
      GATES: "G1 then G2 then G3, first satisfied wins"
    precision: "0 decimal places, round_half_up"
    variants:
      - name: immutable_reported
        when: "the clinic has accumulated reporting records that are all RECORDED"
        difference: "VOIDED records drop out of both numerator and denominator, so voiding a non-live-birth record raises the live-birth rate while voiding a live-birth record lowers it — numerator-only removal would raise it in both cases."
      - name: amended_shifts_workset
        when: "a RECORDED record is AMENDED with a different live_birth / multiple_birth / births_count"
        difference: "amending recomputes the whole workset in place at the new values, so the rate moves to the amended value rather than being averaged with the superseded one; an implementation that appends instead of replacing drifts."

  # --- C4 -------------------------------------------------------------------
  - name: member_cost_share
    trigger: "POST /claims/{id}/adjudicate, POST /claims/{id}/appeal-decide, POST /claims/{id}/reverse, and as the provisional read on Claim creation"
    algorithm: dual_variant_threshold
    formula: |
      def member_cost_share(allowed_cents, auth, member, accumulator_before_cents, variant):
          pct := auth.member_cost_share_pct          # 0..100, integer
          # Evaluation order is pinned: the percentage applies to the member's
          # own remaining share of the member out-of-pocket maximum FIRST,
          # then the specialty-pharmacy differential applies, then rounding.
          share := round_half_up(allowed_cents * pct / 100)
          # MEMBER_OOP_MAX_CENTS applies to this member across all their
          # authorizations in the plan year; accumulator_before_cents is the
          # member's running out-of-pocket total BEFORE this claim.
          remaining_oop := max(0, MEMBER_OOP_MAX_CENTS - accumulator_before_cents)
          capped := min(share, remaining_oop)
          differential := (service_category in {MEDICATION, DONOR_MATERIAL}) ? round_half_up(capped * SPECIALTY_DIFFERENTIAL_PCT / 100) : 0
          base := capped + differential
          if variant == PROVISIONAL:
              # provisional keeps the difference in place; nothing is netted out
              return base
          # FINAL nets the part of the member share that the cost-difference cap
          # already covers, in cents, then floors at 0
          netted := base - min(base, COST_DIFFERENCE_CAP_CENTS)
          return max(0, netted)
    input_set: "allowed_cents comes from claim_allowed_amount for the same claim. accumulator_before_cents is the sum of member_cost_share_cents over this member's claims whose claim_status IN {ADJUDICATED, PAID}, ordered by paid_at ascending with created_at ascending as the tie-break. Claims in RECEIVED, PENDED, DENIED, APPEALED and REVERSED contribute nothing."
    constants:
      MEMBER_OOP_MAX_CENTS: 250000
      SPECIALTY_DIFFERENTIAL_PCT: 12
      COST_DIFFERENCE_CAP_CENTS: 15000
      ROUNDING: "round_half_up, applied after the percentage step and again after the differential step"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_on_creation
        when: "the member share is read on a Claim before adjudication"
        difference: "the PREVISIONAL variant keeps the specialty differential inside the member share and applies no cost-difference cap, so a 20000-cent allowed MEDICATION claim at 20% reports 4480 rather than the 0 the FINAL variant reports."
      - name: final_on_adjudication
        when: "POST /claims/{id}/adjudicate or POST /claims/{id}/appeal-decide succeeds"
        difference: "the FINAL variant nets COST_DIFFERENCE_CAP_CENTS 15000 out of the member share and floors at 0, so the same inputs produce 0 while the provisional read produced 4480 — the two variants diverge by more than the cap itself."

  # --- C5 -------------------------------------------------------------------
  - name: clinical_criteria_gate
    trigger: "POST /preauthorizations/{id}/begin-clinical-review and POST /preauthorizations/{id}/revise-request"
    algorithm: weighted_scoring_threshold
    formula: |
      I := auth.criteria_inputs
      score := 100
      score := score - AGE_BANDS.first_band_over(I.age_years)     # 0 under 35, 20 at 35..37, 40 at 38..40, 60 at 41 and over
      score := score - ((I.amh_ng_ml < 0.5) ? 20 : ((I.amh_ng_ml < 1.0) ? 10 : 0))
      score := score + ((I.prior_live_birth) ? 15 : 0)
      score := score - ((I.prior_cycles >= 3) ? 25 : ((I.prior_cycles == 2) ? 15 : 0))
      score := score - ((I.fsh_iu_l > 12) ? 10 : 0)
      auth.clinical_criteria_score := max(0, min(100, score))
      approves := auth.clinical_criteria_score >= APPROVAL_FLOOR    # 70 inclusive
    input_set: "criteria_inputs is required on POST /treatment-plans/{id}/preauthorizations; missing keys are read as the neutral values age_years 30, amh_ng_ml 2.0, prior_cycles 0, prior_live_birth false, fsh_iu_l 6."
    constants:
      BASE: 100
      AGE_35_37_PENALTY: 20
      AGE_38_40_PENALTY: 40
      AGE_41_PLUS_PENALTY: 60
      AMH_UNDER_0_5_PENALTY: 20
      AMH_UNDER_1_0_PENALTY: 10
      PRIOR_LIVE_BIRTH_BONUS: 15
      PRIOR_CYCLES_2_PENALTY: 15
      PRIOR_CYCLES_3_PLUS_PENALTY: 25
      FSH_OVER_12_PENALTY: 10
      APPROVAL_FLOOR: 70
    precision: "integer score, clamped to [0, 100], no rounding"
    variants:
      - name: bulk_per_rounding
        when: "the score is displayed at the approval floor"
        difference: "penalties are summed before the clamp rather than clamped per step, so inputs totalling 74 approve while the same inputs clamped after each penalty would land on 70 and also approve — the divergence appears one step later at exactly 70 vs 69."
      - name: imputed_defaults
        when: "an authorization is created without the optional criteria keys"
        difference: "imputed neutral inputs produce 100 - 0 - 0 - 0 + 0 = 100 and approve, whereas an implementation that treats a missing age_years as the maximum band produces 40 and denies."

  # --- C6 -------------------------------------------------------------------
  - name: clinic_bundle_price
    trigger: "POST /preauthorizations/{id}/decide on APPROVED, and the BundleEntitlement EXHAUSTED cascade over TreatmentPlan.selected_bundle_price_cents"
    algorithm: version_pinned_lookup_with_rounding
    formula: |
      # Step 1 — the agreed-price slice, pinned at the contract's own rate.
      rate := active_contract_rate(P.clinic_id, bundle_type)
              where active_contract_rate picks the ClinicContract row with
              contracting_status IN {ACTIVE, FROZEN} whose
              [effective_from, effective_to) contains the logical clock;
              when several qualify the row with the greater effective_from
              wins and created_at ASC breaks a tie.
      list_price := rate.bundle_rates[bundle_type]
      price_snapshot := list_price

      # Step 2 — the effective-price slice. Copay maximization applies the
      # bundle's maximum copay reduction per member, and the reduction is a
      # percentage of the MANAGER fee, not of the bundle price.
      manager_fee := round_half_up(price_snapshot * MANAGER_FEE_PCT / 100)
      member_copay_reduction := copay_max ? COPAY_MAX_REDUCTION_CENTS : 0
      delta := manager_fee - member_copay_reduction          # may be negative
      P.selected_bundle_price_cents := max(0, price_snapshot - delta)

      # Evaluation order is pinned: manager_fee is computed off the pinned
      # list price first, then the copay reduction is subtracted from the FEE,
      # then the (possibly negative) delta is applied to the price.
    input_set: "bundle_rates maps bundle_type to cents and is required to contain the member's bundle_type before the clinic may be selected. A contract in IN_REVIEW or TERMINATED contributes no rate; a FROZEN contract still contributes its rate so the price remains readable but new authorizations against it are rejected at priority 8."
    constants:
      MANAGER_FEE_PCT: 8
      COPAY_MAX_REDUCTION_CENTS: 25000
    precision: "integer cents, round_half_up on the manager fee step only"
    variants:
      - name: copay_max_applied
        when: "the bundle entitlement carries copay_max == true"
        difference: "the reduction is netted out of the manager fee, so a 1450000-cent IVF rate at 8% (116000 fee) with copay_max produces 1349000, whereas subtracting the reduction from the price directly produces 1425000."
      - name: copay_max_absent
        when: "copay_max is false"
        difference: "the delta collapses to the full manager fee, so the same rate produces 1334000 — lower than the copay_max case, which is the counter-intuitive direction a naive 'reduction increases price' implementation gets backwards."

  # --- C7 -------------------------------------------------------------------
  - name: pharmacy_pool_allocation
    trigger: "POST /medication-orders/{id}/dispense, POST /medication-orders/{id}/cancel on a DISPENSING order, POST /claims/{id}/pay with service_category MEDICATION, and POST /claims/{id}/reverse"
    algorithm: waterfall_allocation_with_remainder
    formula: |
      E := bundle_entitlement(M.preauthorization_id)
      remaining := E.pharmacy_remaining_cents
      claimable := min(O.acquisition_cost_cents, remaining)
      # Specialty dispensing splits the claimable amount across two buckets
      # in a pinned order.
      ingredient := round_half_up(claimable * INGREDIENT_PCT / 100)
      dispensing_fee := claimable - ingredient
      # The remainder from the ingredient split is absorbed by the fee bucket,
      # never left as drift: ingredient + dispensing_fee == claimable is an
      # invariant of this allocation.
      O.plan_paid_cents := claimable
      O.member_cost_cents := O.acquisition_cost_cents - claimable
      E.pharmacy_consumed_cents := E.pharmacy_consumed_cents + claimable
      E.pharmacy_remaining_cents := max(0, E.pharmacy_pool_cents - E.pharmacy_consumed_cents)
    input_set: "Only MedicationOrder rows in pharmacy_status DISPENSING feed pharmacy_consumed_cents. CANCELLED orders release their plan_paid_cents back into the pool. A claim is capped at the pool remainder, so acquisition cost above the remainder falls entirely to the member."
    constants:
      INGREDIENT_PCT: 82
      FLOOR: 0
    precision: "integer cents, round_half_up on the ingredient step; the fee bucket absorbs the remainder"
    variants:
      - name: pool_covers_fill
        when: "pharmacy_remaining_cents >= acquisition_cost_cents"
        difference: "plan_paid_cents equals the full acquisition cost and member_cost_cents is 0."
      - name: pool_exhausted_mid_fill
        when: "pharmacy_remaining_cents < acquisition_cost_cents"
        difference: "plan_paid_cents equals the remainder exactly (never more), so the member absorbs the excess; the pool reaches exactly 0 rather than going negative, and a second fill then reports plan_paid_cents 0 with the entire acquisition cost on the member."

  # --- C8 -------------------------------------------------------------------
  - name: claim_allowed_amount
    trigger: "POST /claims/{id}/adjudicate, POST /claims/{id}/appeal-decide"
    algorithm: tiered_pricing
    formula: |
      if service_category == MEDICATION:
          allowed := O.plan_paid_cents            # the pharmacy pool result IS the allowance
          basis := BUNDLE_COMPONENT_RULE
      else:
          ceiling := P.selected_bundle_price_cents
          if service_category == CLINIC_BUNDLE:
              covered := min(C.billed_cents, ceiling)
              basis := (C.billed_cents > ceiling) ? BUNDLE_COMPONENT_RULE : CONTRACT_RATE
          else:
              # LAB, STORAGE, DONOR_MATERIAL and SURROGACY_FEE are ancillary:
              # each is capped at its own share of the bundle ceiling
              share_pct := ANCILLARY_SHARE_PCT[service_category]
              ancillary_ceiling := round_half_up(ceiling * share_pct / 100)
              covered := min(C.billed_cents, ancillary_ceiling)
              basis := BUNDLE_COMPONENT_RULE
          allowed := covered
      C.allowed_cents := allowed
      C.adjudication_basis := basis
    input_set: "The ceiling is the pinned clinic bundle price for the plan, so a partially consumed bundle never raises the ceiling and a bundle-price recompute after contract change re-reads at the CURRENT pinned price rather than the price at authorization. Ancillary categories are capped at their own percentage slice of the ceiling, and the slices are NOT additive — four ancillary claims may each reach their slice."
    constants:
      ANCILLARY_SHARE_PCT: "LAB 12, STORAGE 4, DONOR_MATERIAL 18, SURROGACY_FEE 25"
      FLOOR_CENTS: 0
    precision: "integer cents, round_half_up on each ancillary slice independently"
    variants:
      - name: under_ceiling_billed
        when: "billed_cents <= the applicable ceiling"
        difference: "allowed equals the billed amount, so a member sees the full contractual discount appear as a zero difference rather than as a plan payment."
      - name: over_ceiling_billed
        when: "billed_cents > the applicable ceiling"
        difference: "allowed clamps to the ceiling and adjudication_basis reads BUNDLE_COMPONENT_RULE, so a 200000-cent LAB bill against a 174000-cent ceiling (1450000 * 12 / 100) is allowed at 174000 with 26000 written off — a member share computed off billed_cents rather than allowed_cents overstates the member's responsibility."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc and POST /_system/tick"

  - priority: 2
    category: auth
    check: "the role named by X-User-Role is permitted for this operation per §1.5 roles and §1.7 exclusive_operations"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "every resource id appearing in the request path resolves, checked left to right along the path; the miss carries the entity-specific id for the segment that failed — ERR_EMPLOYER_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_ADVOCATE_NOT_FOUND, ERR_CLINIC_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_BUNDLE_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_PREAUTH_NOT_FOUND, ERR_CYCLE_NOT_FOUND or ERR_CLAIM_NOT_FOUND"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 4
    category: state
    check: "the actor identity satisfies the segregation-of-duties rule for this operation: X-User-ID must differ from the decision_actor already recorded on the resource, so no reviewer decides a request they previously handled and no reviewer decides an appeal on a claim they adjudicated"
    error_id: ERR_SOD_CONFLICT
    http_status: 403
    applies_to: "[POST /preauthorizations/{id}/decide, POST /preauthorizations/{id}/begin-clinical-review, POST /pathway-requests/{id}/decide, POST /claims/{id}/appeal-decide]"

  - priority: 5
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2, including the sequence guard that ERR_SEQUENCE_OUT_OF_ORDER covers when a cycle or authorization is filed at a sequence index that is not the plan's next"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves (a miss carries the generic ERR_NOT_FOUND); every required input is present and inside its declared enum (a miss carries ERR_INVALID_REQUEST); and each pathway-specific reference is present for its own enum member — ERR_SURROGACY_CARRIER_REQUIRED for SURROGACY without gestational_carrier_ref, ERR_DONOR_AGENCY_REQUIRED for DONOR_EGG or DONOR_SPERM without donor_agency_ref"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "[POST /bundle-entitlements, POST /members, POST /treatment-plans, POST /preauthorizations, POST /treatment-cycles, POST /medication-orders, POST /pathway-requests, POST /claims, POST /clinics/{id}/report-outcome, POST /clinics/{id}/contracts, POST /members/{id}/assign-advocate]"

  - priority: 7
    category: business_constraint
    check: "the clinic a covered operation names is contracted on the requested terms: the selected clinic is CONTRACTED, has an ACTIVE contract covering the logical clock, and that contract carries a negotiated rate for the member's bundle type; the clinic has accumulated the required outcome reports before its contract may be activated"
    error_id: ERR_CLINIC_NOT_CONTRACTED
    http_status: 422
    applies_to: "[POST /treatment-plans/{id}/select-clinic, POST /clinic-contracts/{id}/activate, POST /treatment-plans/{id}/resubmit-plan]"

  - priority: 8
    category: business_safety
    check: "the authorization window and the requested service instant lie inside the clinic contract's coverage: the window derived at approval must fall inside [ClinicContract.effective_from, ClinicContract.effective_to) and the billed service instant must fall inside [Preauthorization.effective_from, Preauthorization.effective_to); a window that would extend past the contract end is rejected rather than silently truncated"
    error_id: ERR_PREAUTH_WINDOW_OUTSIDE_COVERAGE
    http_status: 422
    applies_to: "[POST /preauthorizations/{id}/decide, POST /treatment-cycles, POST /claims, POST /claims/{id}/adjudicate]"

  - priority: 9
    category: business_constraint
    check: "the clinic's active contract is not FROZEN by a quality breach at the instant the covered service is authorized"
    error_id: ERR_CLINIC_CONTRACT_FROZEN
    http_status: 422
    applies_to: "[POST /preauthorizations/{id}/decide, POST /treatment-cycles, POST /medication-orders]"

  - priority: 10
    category: business_constraint
    check: "the employer account sponsoring the resource has account_status == ACTIVE; the bundle entitlement carries bundle_status IN {ACTIVE, DRAFT} and is not SUSPENDED"
    error_id: ERR_BENEFIT_INACTIVE
    http_status: 422
    applies_to: "[POST /preauthorizations/{id}/decide, POST /pathway-requests/{id}/decide, POST /bundle-entitlements/{id}/activate, POST /members/{id}/complete-intake]"

  - priority: 11
    category: business_constraint
    check: "the surrender route is clinically and administratively admissible: the acting advocate's credential is unexpired at the logical clock and the advocate has not reached caseload_limit (ERR_ADVOCATE_CREDENTIAL_LAPSED), and the requested surrender route does not disagree with an overlapping route already on file for this member (ERR_SURRENDER_ROUTE_CONFLICT)"
    error_id: ERR_SURRENDER_ROUTE_CONFLICT
    http_status: 409
    applies_to: "[POST /members/{id}/surrender-routes]"

  - priority: 12
    category: business_temporal
    check: "the new cycle's stimulation start respects the plan's configured minimum inter-cycle spacing: the logical clock must be at least TreatmentPlan.min_inter_cycle_days whole days after the plan's latest prior transfer instant, and the cycle may not occupy a retention window already reserved by a ROUTED SurrenderRoute of the same member"
    error_id: ERR_CYCLE_SLOT_OVERLAP
    http_status: 409
    applies_to: "[POST /treatment-plans/{id}/treatment-cycles]"

  - priority: 13
    category: business_constraint
    check: "the requested action fits inside the carried allowance of its bundle: life-path route allowance, bundle cycle allowance (ERR_BUNDLE_EXHAUSTED when both the cycle allowance and the specialty-pharmacy pool read zero), or specialty-pharmacy pool (ERR_PHARMACY_POOL_EXHAUSTED when the pool holds no cents)"
    error_id: ERR_NO_REMAINING_ALLOWANCE
    http_status: 422
    applies_to: "[POST /treatment-plans/{id}/preauthorizations]"

  - priority: 14
    category: business_fiscal
    check: "the clinical appropriateness score meets the approval floor of 70 at the exact boundary for this bundle's pathway"
    error_id: ERR_CLINICAL_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "[POST /preauthorizations/{id}/decide]"

  - priority: 15
    category: business_constraint
    check: "the bundle price for the member's bundle type has been pinned, and the claim's billed charge is a positive amount"
    error_id: ERR_BUNDLE_PRICE_UNPINNED
    http_status: 422
    applies_to: "[POST /preauthorizations/{id}/decide, POST /claims/{id}/adjudicate]"

  - priority: 16
    category: business_fiscal
    check: "the paid claim is still inside its reversal window (ERR_REVERSAL_WINDOW_CLOSED) and the outcome record is still inside its amendment window (ERR_AMENDMENT_WINDOW_CLOSED)"
    error_id: ERR_REVERSAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "[POST /claims/{id}/reverse, POST /outcome-records/{id}/amend]"

  - priority: 17
    category: business_constraint
    check: "the operation is idempotency-protected and this occurrence of the operation has already been carried out"
    error_id: ERR_DUPLICATE_OPERATION
    http_status: 409
    applies_to: "[POST /clinics/{id}/report-outcome, POST /outcome-records/{id}/amend, POST /outcome-records/{id}/void, POST /preauthorizations/{id}/decide]"
# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- System / test-driving ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any call here the logical clock reads that fixed instant and never falls back to real wall-clock time."
    roles: [PlanAdministrator, NetworkManager, ClaimsProcessor]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["every time-dependent read (advocate credential, contract coverage window, authorization validity, appeal and reversal windows, expiry sweeps) is evaluated against the new instant"]

  - method: POST
    path: "/_system/tick"
    description: "Advance the logical clock to the earliest pending scheduled instant and fire every time-driven transition whose deadline has been reached; returns without advancing when no deadline is pending."
    roles: [PlanAdministrator, NetworkManager, ClaimsProcessor]
    code: 200
    input: []
    output: { advanced_to: datetime, transitions_fired: integer }
    side_effects:
      - "Preauthorization rows in SUBMITTED or CLINICAL_REVIEW past SUBMITTED_EXPIRY_HOURS -> EXPIRED with denial_reason_code EXPIRED_NO_DECISION"
      - "TreatmentCycle rows in TRANSFER whose transfer_date + PREGNANCY_TEST_DAYS has been reached -> OUTCOME_PENDING"
      - "Claim rows in RECEIVED past service_date + CLAIM_PEND_AFTER_DAYS -> PENDED with pended_reason SUBMITTED_LATE_REQUIRES_DOCUMENTATION"

  # --- EmployerAccount -----------------------------------------------------
  - method: POST
    path: "/employer-accounts"
    description: "Create an employer benefit account"
    roles: [PlanAdministrator]
    code: 201
    input: [employer_name, plan_year, funding_type, allocation_method, enrollment_limit]
    output: EmployerAccount
    side_effects: ["account_status=ACTIVE, active_member_count=0, entitlement_count=0"]

  - method: GET
    path: "/employer-accounts/{id}"
    description: "Read one employer account"
    roles: [PlanAdministrator, NetworkManager, CareAdvocate, ClaimsProcessor, ClinicalReviewer]
    code: 200
    input: []
    output: EmployerAccount
    side_effects: []

  - method: GET
    path: "/employer-accounts"
    description: "List employer accounts"
    roles: [PlanAdministrator, NetworkManager, ClaimsProcessor]
    code: 200
    input: ["account_status?", "plan_year?", "allocation_method?", "limit?", "offset?"]
    output: EmployerAccount[]
    side_effects: []

  - method: POST
    path: "/employer-accounts/{id}/suspend"
    description: "Suspend an employer account, cascading to its entitlements and pending authorizations"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: EmployerAccount
    side_effects:
      - "account_status -> SUSPENDED"
      - "each BundleEntitlement on this account reads as DRAFT; its cycles_remaining and pharmacy_remaining_cents recompute to 0"
      - "each Preauthorization on a plan of this account with review_status == SUBMITTED -> EXPIRED with denial_reason_code ACCOUNT_SUSPENDED"
      - "active_member_count and entitlement_count recomputed; version incremented"

  - method: POST
    path: "/employer-accounts/{id}/reactivate"
    description: "Reactivate a suspended employer account"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: EmployerAccount
    side_effects:
      - "account_status -> ACTIVE"
      - "each BundleEntitlement on this account with a non-empty remaining allowance reads as ACTIVE again"
      - "active_member_count and entitlement_count recomputed; version incremented"

  # --- BundleEntitlement ---------------------------------------------------
  - method: POST
    path: "/bundle-entitlements"
    description: "Define a treatment-bundle entitlement for an employer account"
    roles: [PlanAdministrator]
    code: 201
    input: [employer_account_id, bundle_type, lifetime_max_cycles, max_cycles_per_year, max_transfers_per_cycle, pharmacy_pool_cents, copay_max, effective_from, effective_to]
    output: BundleEntitlement
    side_effects:
      - "bundle_status=DRAFT; cycles_consumed=0; cycles_committed=0; cycles_remaining=0; pharmacy_consumed_cents=0; pharmacy_remaining_cents=0"
      - "EmployerAccount.entitlement_count recomputed; EmployerAccount.version incremented"

  - method: GET
    path: "/bundle-entitlements/{id}"
    description: "Read one bundle entitlement"
    roles: [PlanAdministrator, CareAdvocate, ClinicalReviewer, ClaimsProcessor, SpecialtyPharmacist]
    code: 200
    input: []
    output: BundleEntitlement
    side_effects: []

  - method: GET
    path: "/bundle-entitlements"
    description: "List bundle entitlements"
    roles: [PlanAdministrator, CareAdvocate, ClinicalReviewer, ClaimsProcessor]
    code: 200
    input: ["employer_account_id?", "bundle_type?", "bundle_status?", "limit?", "offset?"]
    output: BundleEntitlement[]
    side_effects: []

  - method: POST
    path: "/bundle-entitlements/{id}/activate"
    description: "Activate a bundle entitlement so it can net cycles"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: BundleEntitlement
    side_effects:
      - "bundle_status -> ACTIVE"
      - "cycles_consumed, cycles_committed, cycles_remaining recomputed under the employer's allocation_method"
      - "pharmacy_consumed_cents and pharmacy_remaining_cents recomputed; version incremented"

  - method: POST
    path: "/bundle-entitlements/{id}/reinstate"
    description: "Reinstate an exhausted bundle entitlement"
    roles: [PlanAdministrator]
    code: 200
    input: []
