  - name: error_changeover_conflict_overlapping_family_window_returns_409
    claim_type: Violation → Error
    grounds:
    - validations[priority=12]
    - errors[ERR_CHANGEOVER_CONFLICT]
    - entities.CarType.fields.line_count_family
    - POST /api/v1/production-lines/{line}/changeover
    distinguishing_aspect: A changeover request for [2026-09-11, 2026-09-13) is rejected 409 ERR_CHANGEOVER_CONFLICT
      because it overlaps the incumbent [2026-09-10, 2026-09-12) by one day even though it names a different
      line segment, while the touching window [2026-09-12, 2026-09-14) on that same segment is accepted
      — so the collision is judged on the car type's line_count_family.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-M (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-M) with
        one WHEELSET WS-M row at qty_per_car 1; 100 units on hand via a received ComponentReceipt.
      - Two SOLD orders of 2 cars each (planned_shop_days 2), priorities 1 and 2, are both reserved and
        released; order 1 takes the family first with [2026-09-10, 2026-09-12), leaving order 2 as the
        head of the remaining backlog.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-M
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-M
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-M
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 100
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_ws: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_ws}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_ws}
          component_id: ${ws_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_ws: $.data.id
      - call: POST /api/v1/component-receipts/${rc_ws}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 2
          planned_shop_days: 2
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_1: $.data.id
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 2
          planned_shop_days: 2
          disposition: SOLD
          priority_rank: 2
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_2: $.data.id
      - call: POST /api/v1/production-orders/${po_1}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_1}/release
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_2}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_2}/release
        payload: {}
        as: ProductionPlanner
        captures:
          po_2_status: $.data.status
      trigger:
      - call: POST /api/v1/production-lines/LINE-M-A/changeover
        payload:
          production_order_id: ${po_1}
          scheduled_start_date: '2026-09-10'
          scheduled_end_date: '2026-09-12'
        as: ProductionPlanner
        captures:
          po_1_status: $.data.status
      - call: POST /api/v1/production-lines/LINE-M-B/changeover
        payload:
          production_order_id: ${po_2}
          scheduled_start_date: '2026-09-11'
          scheduled_end_date: '2026-09-13'
        as: ProductionPlanner
        captures:
          err_conflict: $.data.error_id
      - call: GET /api/v1/production-orders/${po_2}
        payload: {}
        as: PlatformAdmin
        captures:
          po_2_after: $.data.status
      - call: POST /api/v1/production-lines/LINE-M-B/changeover
        payload:
          production_order_id: ${po_2}
          scheduled_start_date: '2026-09-12'
          scheduled_end_date: '2026-09-14'
        as: ProductionPlanner
        captures:
          po_2_final: $.data.status
      assert:
      - 'The incumbent changeover was accepted on segment LINE-M-A: ProductionOrder.${po_1}.status ==
        ${po_1_status} == "IN_PRODUCTION" with window [2026-09-10, 2026-09-12)'
      - The overlapping request on the differently-named segment LINE-M-B returns HTTP 409 with data.error_id
        == ${err_conflict} == "ERR_CHANGEOVER_CONFLICT"
      - 'The overlap is one day: max(2026-09-10, 2026-09-11) = 2026-09-11 is before min(2026-09-12, 2026-09-13)
        = 2026-09-12, so the half-open windows genuinely intersect'
      - The rejection is judged on the car type's line_count_family LINE-M rather than on the path's line
        segment, since LINE-M-A and LINE-M-B are different strings
      - 'The rejected call disturbed nothing: ProductionOrder.${po_2}.status == ${po_2_after} == ${po_2_status}
        == "RELEASED"'
      - 'The touching window is accepted: [2026-09-12, 2026-09-14) starts exactly at the incumbent''s
        end, so the intersection is empty and ProductionOrder.${po_2}.status == ${po_2_final} == "IN_PRODUCTION"'
