            - "Loan.${lcap}.renewed == false"
      - name: waitlist_claim_after_offer_expiry_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED_OFFER
          - validations[priority=16]
        distinguishing_aspect: "After the sweep flips the entry to EXPIRED_OFFER, a claim fails with ERR_INVALID_STATE (not ERR_OFFER_EXPIRED) because the state check at priority 4 precedes the temporal check at priority 16."
        test_recipe:
          setup:
            - "Work Woe with one item; patron P-O's entry was OFFERED at 2026-09-01T00:00:00Z; clock advanced to 2026-09-04T00:00:00Z and sweep run (entry now EXPIRED_OFFER)."
