      assert:
      - OBSERVATION POINT 1 — ${o1_status} == ASSIGNED to ${o1_neuro} == ${n1_id} with ${o1_declines} == 0; ${o1_a1} == 1, ${o1_a2} == 0, so sum(active_consult_count) == 1 == the number of consults in {ASSIGNED, IN_SESSION}; ${o1_agr} == 1
      - 'OBSERVATION POINT 1 — ${o1_s1} == ON_CALL and ${o1_s2} == ON_CALL: an ASSIGNED consult raises the load counter WITHOUT moving on_call_state, which is exactly the pair a naive implementation conflates'
      - OBSERVATION POINT 2 — after the decline, ${o2_status} == ASSIGNED with ${o2_neuro} == ${n2_id}, ${o2_declines} == 1 and ${o2_attempts} == 2, and N1 is recorded in excluded_neurologist_ids
      - 'OBSERVATION POINT 2 — ${o2_a1} == 0 and ${o2_a2} == 1: the unit MOVED. sum(active_consult_count) is still 1 and still equals the single consult in {ASSIGNED, IN_SESSION}; ${o2_agr} == 1 as well, since the consult never left the agreement''s {REQUESTED, ASSIGNED, IN_SESSION} set even while it was momentarily back in REQUESTED'
      - 'OBSERVATION POINT 2 — ${o2_s1} == ON_CALL and ${o2_s2} == ON_CALL: declining did not park N1 off duty and re-assignment did not put N2 in session'
      - OBSERVATION POINT 3 — after acceptance and completion, ${o3_status} == COMPLETED with ${o3_neuro} == ${n2_id} RETAINED for audit
      - 'OBSERVATION POINT 3 — ${o3_a1} == 0 and ${o3_a2} == 0: sum(active_consult_count) == 0 == the number of consults in {ASSIGNED, IN_SESSION}; ${o3_agr} == 0 on the agreement side too, so both halves of the identity retire together'
      - 'the completion credit lands on the ACCEPTER only: ${o3_d2} == 1 with ${o3_l2} == 2026-09-01T08:32:00Z, while ${o3_d1} == 0 and ${o3_l1} == null — the decliner accrues no completion and no cooldown'
      - ${o1_d1} == 0 throughout, and ${o3_s1} == ON_CALL, ${o3_s2} == ON_CALL
      - 'no ProtocolDeviation was created at any point: CodeStrokeCase.${cv_id}.deviation_count == 0, because a decline that successfully re-routes is not an unfilled consult'
