      - name: an_expired_lease_refuses_a_further_obligation_event
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Lease.PRIMARY_TERM_to_EXPIRED
          - validations[priority=49, error_id=ERR_TERMINAL_STATE]
          - endpoints.POST_/land-admin/leases/{lease_id}/obligation-events
          - endpoints.POST_/land-admin/obligation-runs
        distinguishing_aspect: |
          EXPIRED is the tenure dimension's terminal state: after the obligation run expires L-003 on
          2026-07-01, a CONTINUOUS_OPERATION event returns ERR_TERMINAL_STATE 409 at priority 49,
          ahead of the transition's own tenure precondition, and last_operation_end_date stays null.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z"
            - "Lease L-003 with 160.00 gross acres and primary term 2026-06-30, no allocations at all"
            - "One obligation run has already expired it (tenure_status EXPIRED, obligation_status IN_BREACH, held_acres 0.00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-003", lessor_name: "Gamma Minerals", gross_acres: 160.00, royalty_rate: 0.200000, primary_term_end_date: "2026-06-30" }
              as: LandAdministrator
              captures: { lease3_id: $.data.id }
            - call: "POST /land-admin/obligation-runs"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /land-admin/leases/${lease3_id}/obligation-events"
              payload: { event_type: "CONTINUOUS_OPERATION", event_date: "2026-07-01" }
              as: LandAdministrator
          assert:
            - "the setup obligation run reports leases_expired == 1"
            - "HTTP 409 with data.error_id == \"ERR_TERMINAL_STATE\""
            - "Lease.${lease3_id}.tenure_status == EXPIRED and obligation_status == IN_BREACH"
            - "Lease.${lease3_id}.held_acres == 0.00"
            - "Lease.${lease3_id}.last_operation_end_date == null and continuous_dev_deadline == null"

