            - call: "GET /install-crews/${c3}"
              payload: {}
              as: InstallCoordinator
              captures: { cv3: $.data.version }
          trigger:
            - call: "POST /install-appointments"
              payload: { preorder_id: "${p3}", crew_id: "${c3}", appointment_type: "DROP_BURY", window_start_at: "2026-10-05T10:30:00Z", window_end_at: "2026-10-05T11:30:00Z", expected_crew_version: "${cv3}" }
