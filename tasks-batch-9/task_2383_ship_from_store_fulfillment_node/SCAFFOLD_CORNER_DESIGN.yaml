          assert:
            - "every one of the nine reads returns HTTP 404 with response_type error and a data block carrying exactly error_id and message"
            - "${e_inv} == ERR_INVENTORY_NOT_FOUND"
            - "${e_pkg} == ERR_PACKAGING_NOT_FOUND"
            - "${e_pickup} == ERR_PICKUP_NOT_FOUND"
            - "${e_line} == ERR_ORDER_LINE_NOT_FOUND"
            - "${e_run} == ERR_ROUTING_RUN_NOT_FOUND"
            - "${e_cand} == ERR_CANDIDATE_NOT_FOUND"
            - "${e_aline} == ERR_ASSIGNMENT_LINE_NOT_FOUND"
            - "${e_window} == ERR_WINDOW_NOT_FOUND"
            - "${e_notif} == ERR_NOTIFICATION_NOT_FOUND"
            - "no code is a generic ERR_NOT_FOUND and none of the nine reads returns 200"

      - name: duplicate_natural_keys_are_rejected_per_row_type
