- section: validations
  instances:
  - name: missing_auth_headers_returns_unauthenticated
    claim_type: Violation → Error
    grounds:
    - validations[priority=1]
    - errors.ERR_UNAUTHENTICATED
    distinguishing_aspect: Missing X-User-Role/X-User-ID is a 401 ERR_UNAUTHENTICATED before any other check — even on a valid endpoint with a valid body.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /care/employers
        payload:
          name: NoAuth
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 100000
          emo_benefit_enabled: false
        as: Member
        captures:
          error_id: $.data.error_id
      assert:
      - request sent without auth headers yields 401 ERR_UNAUTHENTICATED (headers absent, so role/identity never evaluated)
      - no employer is created
  - name: wrong_role_on_platform_admin_endpoint_returns_unauthorized
    claim_type: Violation → Error
    grounds:
    - validations[priority=2]
    - errors.ERR_UNAUTHORIZED_ROLE
    distinguishing_aspect: 'Role gating: EmployerAdmin cannot create employers (PlatformAdmin-only) -> 403 ERR_UNAUTHORIZED_ROLE; priority 2 beats body validation (a body missing name still yields 403,
      not 400).'
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /care/employers
        payload: {}
        as: EmployerAdmin
        as_user_id: ea-x
        captures:
          error_id: $.data.error_id
      assert:
      - status 403, error_id == ERR_UNAUTHORIZED_ROLE (not 400 ERR_INVALID_REQUEST despite the empty body)
  - name: member_acting_on_other_members_resource_returns_member_mismatch
    claim_type: Violation → Error
    grounds:
    - entities.Member
    - errors.ERR_MEMBER_MISMATCH
    - validations[priority=2]
    distinguishing_aspect: 'Entity-backed identity: Member role with X-User-ID of member A creating a consent under member B''s path is 403 ERR_MEMBER_MISMATCH.'
    test_recipe:
      setup:
      - Employer with members A and B.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: MismatchCo
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 100000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: A One
          date_of_birth: '1990-01-01'
          relationship: SELF
          external_member_ref: MM-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          ma: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: B Two
          date_of_birth: '1991-01-01'
          relationship: SELF
          external_member_ref: MM-2
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          mb: $.data.id
      trigger:
      - call: POST /care/members/${mb}/consents
        payload:
          scope: APPOINTMENT_BOOKING
          expires_at: '2027-01-01T00:00:00Z'
        as: Member
        as_user_id: ${ma}
        captures:
          error_id: $.data.error_id
      assert:
      - status 403, error_id == ERR_MEMBER_MISMATCH
  - name: inactive_member_blocked_from_new_consent
    claim_type: Violation → Error
    grounds:
    - validations[priority=5]
    - errors.ERR_MEMBER_INELIGIBLE
    distinguishing_aspect: 'Eligibility gate precedes consent checks: an INACTIVE member cannot even grant a consent (which would otherwise be required for downstream actions).'
    test_recipe:
      setup:
      - Member created then deactivated.
      setup_api_calls:
