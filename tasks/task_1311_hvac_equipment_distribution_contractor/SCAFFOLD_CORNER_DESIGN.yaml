  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: invalid_system_pairing_refrigerant_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_INVALID_SYSTEM_PAIRING]"]
        distinguishing_aspect: "Pairing an R454B condenser with an R410A air handler violates refrigerant compatibility -> ERR_INVALID_SYSTEM_PAIRING; a FURNACE as indoor unit also violates the type rule."
        test_recipe:
          setup: ["condenser OU-R454B, air handler AH-R410A, furnace F-1"]
          setup_api_calls:
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "OU-MIS", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-C", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { oum_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "AH-MIS", equipment_type: "AIR_HANDLER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-C", list_price_cents: 300000 }
              as: DistributorAdmin
              captures: { ahm_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "FU-MIS", equipment_type: "FURNACE", refrigerant_type: "NONE", capacity_btuh: 80000, family_code: "FAM-C", list_price_cents: 400000 }
              as: DistributorAdmin
              captures: { fum_id: $.data.id }
          trigger:
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-MIS1", outdoor_unit_id: "${oum_id}", indoor_unit_id: "${ahm_id}", seer2: 16.0, eer2: 12.0 }
              as: DistributorAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-MIS2", outdoor_unit_id: "${oum_id}", indoor_unit_id: "${fum_id}", seer2: 16.0, eer2: 12.0 }
              as: DistributorAdmin
              captures: { e2: $.data.error_id }
          assert:
            - "first trigger error_id == ERR_INVALID_SYSTEM_PAIRING (refrigerant mismatch R454B vs R410A)"
            - "second trigger error_id == ERR_INVALID_SYSTEM_PAIRING (FURNACE not allowed as indoor unit)"

      - name: invalid_line_both_ids_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_INVALID_LINE]"]
        distinguishing_aspect: "A line carrying both ahri_rating_id and equipment_model_id (or neither) fails ERR_INVALID_LINE; quantity 0 fails the same rule."
        test_recipe:
          setup: ["contractor C-L, model M-L, DRAFT order O-L"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Line Co", license_number: "LIC-C400" }
              as: DistributorAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-L400", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-B", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { ml_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cl_id}" }
              as: ContractorUser
              as_user_id: "${cl_id}"
              captures: { ol_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders/${ol_id}/lines"
              payload: { equipment_model_id: "${ml_id}", quantity: 0 }
              as: ContractorUser
              as_user_id: "${cl_id}"
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_LINE (quantity < 1)"

      - name: discontinued_model_not_orderable
        claim_type: conditional_validation
        grounds: ["validations[priority=16]", "errors[ERR_MODEL_NOT_ORDERABLE]"]
        distinguishing_aspect: "A line referencing a DISCONTINUED model fails ERR_MODEL_NOT_ORDERABLE; the same model at ACTIVE succeeds — the rule is conditional on model status."
        test_recipe:
          setup: ["contractor C-M, model M-D created DISCONTINUED, DRAFT order O-M"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Model Co", license_number: "LIC-C401" }
              as: DistributorAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-D401", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-A", list_price_cents: 500000, status: "DISCONTINUED" }
              as: DistributorAdmin
              captures: { mdisc_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cm_id}" }
              as: ContractorUser
              as_user_id: "${cm_id}"
              captures: { om_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders/${om_id}/lines"
              payload: { equipment_model_id: "${mdisc_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cm_id}"
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_MODEL_NOT_ORDERABLE"

      - name: rebate_reference_to_absent_rating_line_mismatch
        claim_type: cross_entity_validation
        grounds: ["validations[priority=17]", "errors[ERR_REBATE_MISMATCH]"]
        distinguishing_aspect: "A dossier whose ahri_rating_id is not on any line of the referenced order fails ERR_REBATE_MISMATCH even though both resources exist."
        test_recipe:
          setup: ["contractor C-RB; delivered order O-RB containing rating R1 line; second rating R2 not on the order"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Mismatch Co", license_number: "LIC-C402" }
              as: DistributorAdmin
              captures: { crb_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "OU-M402", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-A1", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { oum2_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "IU-M402", equipment_type: "COIL", refrigerant_type: "NONE", capacity_btuh: 36000, family_code: "FAM-A1", list_price_cents: 100000 }
              as: DistributorAdmin
              captures: { ium2_id: $.data.id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-M402A", outdoor_unit_id: "${oum2_id}", indoor_unit_id: "${ium2_id}", seer2: 17.0, eer2: 12.5 }
              as: DistributorAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-M402B", outdoor_unit_id: "${oum2_id}", indoor_unit_id: "${ium2_id}", seer2: 16.0, eer2: 12.0 }
              as: DistributorAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${crb_id}" }
              as: ContractorUser
              as_user_id: "${crb_id}"
              captures: { orb_id: $.data.id }
            - call: "POST /api/v1/orders/${orb_id}/lines"
              payload: { ahri_rating_id: "${r1_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${crb_id}"
            - call: "POST /api/v1/orders/${orb_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${crb_id}"
            - call: "POST /api/v1/orders/${orb_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${orb_id}/deliver"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/rebate-submissions"
              payload: { contractor_id: "${crb_id}", order_id: "${orb_id}", ahri_rating_id: "${r2_id}", program_type: "UTILITY_REBATE", homeowner_name: "M", install_address: "9 Pine", install_date: "2026-08-01T00:00:00Z" }
              as: ContractorUser
              as_user_id: "${crb_id}"
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_REBATE_MISMATCH"

      - name: body_fk_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "Creating an order with a non-existent contractor_id returns ERR_REFERENCE_NOT_FOUND (404), distinct from path ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "00000000-0000-4000-8000-000000000000" }
              as: ContractorUser
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_REFERENCE_NOT_FOUND and http status 404"

      - name: cylinder_weight_below_tare_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_CYLINDER_WEIGHT]"]
        distinguishing_aspect: "Returning a cylinder at 19.99 lbs when tare is 20.00 fails ERR_INVALID_CYLINDER_WEIGHT."
        test_recipe:
          setup: ["cylinder issued to contractor"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Weight Co", license_number: "LIC-C403" }
              as: DistributorAdmin
              captures: { cwt_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders"
              payload: { cylinder_tag: "CYL-W403", refrigerant_type: "R32", tare_weight_lbs: 20.00, full_weight_lbs: 50.00 }
              as: DistributorAdmin
              captures: { cyw_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders/${cyw_id}/issue"
              payload: { contractor_id: "${cwt_id}" }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/refrigerant-cylinders/${cyw_id}/return"
              payload: { returned_weight_lbs: 19.99 }
              as: DistributorAdmin
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_CYLINDER_WEIGHT"
            - "RefrigerantCylinder.${cyw_id}.status remains ISSUED"

      - name: pool_aggregate_capacity_validation
        claim_type: aggregate_validation
        grounds: ["validations[priority=12]", "errors[ERR_POOL_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Individually valid pools become collectively invalid: two overlapping FAM-X2 pools of 100 each are fine (200 <= 2x100), but adding a third overlapping pool of 100 makes the aggregate 300 > 2x100 -> ERR_POOL_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["two overlapping pools FAM-X2 total_qty 100 each covering August"]
          setup_api_calls:
            - call: "POST /api/v1/allocation-pools"
              payload: { family_code: "FAM-X2", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", total_qty: 100 }
              as: DistributorAdmin
            - call: "POST /api/v1/allocation-pools"
              payload: { family_code: "FAM-X2", season_start: "2026-08-10T00:00:00Z", season_end: "2026-09-10T00:00:00Z", total_qty: 100 }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/allocation-pools"
              payload: { family_code: "FAM-X2", season_start: "2026-08-15T00:00:00Z", season_end: "2026-08-25T00:00:00Z", total_qty: 100 }
              as: DistributorAdmin
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_POOL_CAPACITY_EXCEEDED (at instants in [2026-08-15, 2026-08-25) three pools overlap: 300 > 2x100)"

      - name: coop_approval_above_eligible_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_ACCRUAL_EXCEEDED]"]
        distinguishing_aspect: "Approving 60000 when eligible_amount_cents computed 50000 fails ERR_ACCRUAL_EXCEEDED."
        test_recipe:
          setup: ["contractor with final accrual 200000; claim spend 50000 verified (eligible 50000)"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Accrue Co", license_number: "LIC-C404" }
              as: DistributorAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-A404", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-Z9", list_price_cents: 10000000 }
              as: DistributorAdmin
