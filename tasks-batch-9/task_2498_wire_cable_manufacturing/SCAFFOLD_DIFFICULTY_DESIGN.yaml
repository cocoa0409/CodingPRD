              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "SPARK", faults_detected: 0, duration_sec: 60 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "HIPOT", test_voltage_kv: 2.5, breakdown_detected: false, duration_sec: 300 }
              as: QualityEngineer
              as_user_id: "qe-001"
          assert:
            - "immediately after the disposition: ProductionLot.${lot_id}.process_state == STRANDED"
            - "immediately after the disposition: ProductionLot.${lot_id}.quality_state == PENDING"
            - "immediately after the disposition: ProductionLot.${lot_id}.rework_count == 1"
            - "immediately after the disposition: ProductionLot.${lot_id}.concentricity_pct == null and ProductionLot.${lot_id}.measured_min_wall_mils == null"
            - "after the second EXTRUSION: ProductionLot.${lot_id}.process_state == EXTRUDED"
            - "after the second EXTRUSION: ProductionLot.${lot_id}.concentricity_pct == 85.00"
            - "after the second EXTRUSION: ProductionLot.${lot_id}.quality_state == PENDING"
            - "after both tests: ProductionLot.${lot_id}.process_state == TESTED and ProductionLot.${lot_id}.quality_state == PENDING (a complete PASS test set advances only the process dimension; CONFORMING is minted by the release)"
            - "ProductionLot.${lot_id}.rework_count == 1 (the rewind did not reset it)"
            - "GET /production-lots/${lot_id}/tests returns exactly 2 CableTest rows, both result PASS"

