      - name: tenant_isolation_is_enforced_on_point_reads_and_by_filtering_lists
        claim_type: multi_tenancy
        grounds:
          - "validations[9]: when X-User-Role == TenantRepresentative, X-User-ID must equal the Tenant id that owns the addressed Cage, Rack or ReleasePacket, and tenant-scoped list endpoints are filtered to that tenant -> ERR_TENANT_SCOPE_VIOLATION 403"
          - "endpoints[GET /cages | GET /racks | GET /release-packets].description: TenantRepresentative callers see only their own rows"
          - "roles[TenantRepresentative].shared_operations includes GET /tenants/{tenant_id}, which validations[9].applies_to does NOT list"
        distinguishing_aspect: "Isolation has two different shapes on the same data: a point read of a foreign row is a 403, while a LIST containing foreign rows must silently shrink rather than 403 — an implementation that applies one shape to both either leaks foreign cages in lists or 403s every tenant list that happens to span tenants. The instance also pins the two gaps in the predicate: a rack with tenant_id null belongs to no tenant and is therefore foreign to every TenantRepresentative, and GET /tenants/{tenant_id} is deliberately outside applies_to."
