        distinguishing_aspect: "Two lines land exactly on the half cent: 90 miles gives 211.5 and 30 miles gives 70.5 millicent-derived cents. ROUND_HALF_UP must return 212 and 71; banker's rounding would return 212 and 70, so the pair pins the mode rather than merely the digit count."
