# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Volunteer Application, Country Placement & Medical Clearance
# Breadth walk over §1.1–§1.7 claims not already covered by §1.8.
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_applicant_persists_fields_and_defaults
        claim_type: creation
        grounds: ["entities.Applicant", "endpoints[POST /volunteer-portal/applicants]"]
        distinguishing_aspect: "POST with all required fields returns 201 with the persisted fields; omitted languages defaults to []; system stamps use the logical clock."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z (set explicitly for determinism)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH", "MATH_SCIENCE"] }
              as: SystemAdmin
              captures: { applicant_id: $.data.id }
          assert:
            - "HTTP 201; response_type object; data.id is a server-minted UUID"
            - "data.full_name == Ana Ruiz; data.email == ana@x.com; data.skills == [TEACHING_ENGLISH, MATH_SCIENCE]"
            - "data.languages == [] (default applied when omitted)"
            - "data.version == 1 and data.created_at == 2026-09-01T00:00:00Z (logical clock, not wall clock)"

      - name: create_opening_initializes_computed_counters
        claim_type: computed_fields
        grounds: ["entities.AssignmentOpening.fields.seats_provisional", "entities.AssignmentOpening.fields.seats_committed"]
        distinguishing_aspect: "A freshly created opening reports seats_provisional == 0 and seats_committed == 0 and status OPEN — computed counters initialized, not client-supplied."
        test_recipe:
          setup:
            - "PE program exists (OPEN)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
          trigger:
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "Secondary English Teacher", required_skills: ["TEACHING_ENGLISH"], seats_total: 3, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { opening_id: $.data.id }
          assert:
            - "HTTP 201; data.status == OPEN; data.seats_provisional == 0; data.seats_committed == 0; data.version == 1"
            - "data.preferred_skills == [] (default applied)"

      - name: applicant_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Applicant"]
        distinguishing_aspect: "Client-supplied id/version/created_at values in the create body are ignored: the server mints its own id and stamps version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["IT"], id: "11111111-1111-4111-8111-111111111111", version: 99 }
              as: SystemAdmin
              captures: { applicant_id: $.data.id, applicant_version: $.data.version }
          assert:
            - "HTTP 201; data.id != 11111111-1111-4111-8111-111111111111 (client id ignored, server mints)"
            - "data.version == 1 (client version 99 ignored)"

      - name: create_application_rejects_unknown_references
        claim_type: type_constraints
        grounds: ["errors[ERR_APPLICANT_NOT_FOUND]", "errors[ERR_PROGRAM_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Body-supplied FK references are existence-checked: bogus applicant_id, bogus country_preference_ids entry, and bogus country_program_id on opening creation each yield the entity-specific 404."
        test_recipe:
          setup:
            - "Applicant Ana exists; logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["IT"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
          trigger:
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "99999999-9999-4999-8999-999999999999", sector_preferences: ["EDUCATION"] }
              as: Applicant
              as_user_id: "99999999-9999-4999-8999-999999999999"
              captures: { err1: $.data.error_id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION"], country_preference_ids: ["99999999-9999-4999-8999-999999999999"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "99999999-9999-4999-8999-999999999999", sector: "EDUCATION", title: "X", required_skills: [], seats_total: 1, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_APPLICANT_NOT_FOUND (404)"
            - "err2 == ERR_PROGRAM_NOT_FOUND (404) — every element of country_preference_ids is validated"
            - "err3 == ERR_PROGRAM_NOT_FOUND (404)"

      - name: list_applications_paginates_with_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /volunteer-portal/applications]"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope; default limit is 10."
        test_recipe:
          setup:
            - "Three applicants each with one DRAFT application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["IT"] }
              as: SystemAdmin
              captures: { a1: $.data.id }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Bob Cole", email: "bob@x.com", date_of_birth: "1993-03-10T00:00:00Z", citizenship_country: "US", skills: ["IT"] }
              as: SystemAdmin
              captures: { a2: $.data.id }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Cy Dara", email: "cy@x.com", date_of_birth: "1990-11-02T00:00:00Z", citizenship_country: "US", skills: ["IT"] }
              as: SystemAdmin
              captures: { a3: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${a1}", sector_preferences: ["EDUCATION"] }
              as: Applicant
              as_user_id: "${a1}"
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${a2}", sector_preferences: ["HEALTH"] }
              as: Applicant
              as_user_id: "${a2}"
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${a3}", sector_preferences: ["AGRICULTURE"] }
              as: Applicant
              as_user_id: "${a3}"
          trigger:
            - call: "GET /volunteer-portal/applications?limit=2&offset=0"
              as: PlacementOfficer
            - call: "GET /volunteer-portal/applications?limit=2&offset=2"
              as: PlacementOfficer
          assert:
            - "First page: exactly 2 data elements, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: exactly 1 data element, total_count == 3, has_more == false, offset == 2"
            - "Pages do not overlap and together cover all 3 applications"

  - section: calculations
    instances:
      - name: interview_overall_recommend_tier_rounding
        claim_type: correct_result
        grounds: ["calculations.interview_overall_score"]
        distinguishing_aspect: "Scores 4.0/3.0/3.0/3.0 produce overall 3.30 (round_half_up to 2dp of exactly 3.30) and recommendation RECOMMEND — the mid tier, complementing the §1.8 cap case."
        test_recipe:
          setup:
            - "Applicant Ana; application UNDER_REVIEW with one SCHEDULED interview"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /volunteer-portal/applications/${app_id}/interviews"
              payload: { interviewer_id: "officer-1", scheduled_start: "2026-09-05T14:00:00Z", scheduled_end: "2026-09-05T15:00:00Z" }
              as: PlacementOfficer
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /volunteer-portal/interviews/${int_id}/complete"
              payload: { motivation_score: 4.0, adaptability_score: 3.0, skill_competency_score: 3.0, cross_cultural_score: 3.0 }
              as: PlacementOfficer
          assert:
            - "Interview.${int_id}.overall_score == 3.3 and recommendation == RECOMMEND (3.0 <= 3.30 < 4.0, no dimension below 2.0)"
            - "Interview status == COMPLETED; Application.${app_id}.status == EVALUATED"

      - name: matches_selector_tiebreak_departure_then_created_at
        claim_type: correct_result
        grounds: ["calculations.skill_match_score"]
        distinguishing_aspect: "Three equally-scored openings (all weighted 1.0) are ordered by departure_date ASC, and the two sharing a departure date are ordered by created_at ASC — deterministic selector ranking without any id-based tiebreak."
        test_recipe:
          setup:
            - "PE program; three OPEN EDUCATION openings requiring [TEACHING_ENGLISH]: O1 departs 2027-02-01; O2 departs 2027-01-15; O3 departs 2027-01-15 created AFTER O2"
            - "Applicant Ana (skill TEACHING_ENGLISH) SUBMITTED with country prefs [PE] and sector prefs [EDUCATION]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "O1", required_skills: ["TEACHING_ENGLISH"], seats_total: 1, departure_date: "2027-02-01T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { o1: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "O2", required_skills: ["TEACHING_ENGLISH"], seats_total: 1, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { o2: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "O3", required_skills: ["TEACHING_ENGLISH"], seats_total: 1, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { o3: $.data.id }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION"], country_preference_ids: ["${prog_pe}"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
          trigger:
            - call: "GET /volunteer-portal/applications/${app_id}/matches"
              as: PlacementOfficer
          assert:
            - "matches has exactly 3 elements; every element's weighted_score == 1.0 (0.7 + 0.2 + 0.1*1.0) — a full three-way tie"
            - "matches[0].assignment_opening_id == ${o2} and matches[1].assignment_opening_id == ${o3} (departure 2027-01-15 before 2027-02-01; O2 before O3 by created_at ASC)"
            - "matches[2].assignment_opening_id == ${o1}"

      - name: matches_excludes_skill_gap_and_unpreferred_country
        claim_type: input_set_filtering
        grounds: ["calculations.skill_match_score"]
        distinguishing_aspect: "The eligibility filter drops openings whose required skills are not fully held (strict < 1.0) and openings in programs outside a non-empty country preference list — only the fully-eligible opening is returned."
        test_recipe:
          setup:
            - "Programs PE and EC; openings: O1 PE EDUCATION requires [TEACHING_ENGLISH] (eligible); O2 PE HEALTH requires [NURSING] (skill gap); O3 EC HEALTH requires [] (country EC not preferred)"
            - "Applicant Ana (skills [TEACHING_ENGLISH]) SUBMITTED with country prefs [PE], sector prefs [EDUCATION, HEALTH]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "EC", name: "Ecuador", medical_support_tier: 2, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_ec: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "O1", required_skills: ["TEACHING_ENGLISH"], seats_total: 1, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { o1: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "HEALTH", title: "O2", required_skills: ["NURSING"], seats_total: 1, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { o2: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_ec}", sector: "HEALTH", title: "O3", required_skills: [], seats_total: 1, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { o3: $.data.id }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION", "HEALTH"], country_preference_ids: ["${prog_pe}"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
          trigger:
            - call: "GET /volunteer-portal/applications/${app_id}/matches"
              as: PlacementOfficer
          assert:
            - "matches has exactly 1 element: assignment_opening_id == ${o1}"
            - "${o2} excluded (applicant lacks NURSING: strict_score 0.0 < 1.0)"
            - "${o3} excluded (EC is not in the non-empty country preference list, even though its required_skills is empty and sector is preferred)"

      - name: service_duration_half_month_rounding_boundary
        claim_type: precision
        grounds: ["calculations.service_duration"]
        excluded_because:
          difficulty_instance: nce_eligibility_twelve_month_boundary
          rationale: "That instance pins months_served == 11 at exactly 344 days and == 12 at exactly 345 days, which is precisely the floor((days+15)/30) half-month round-up rule at its decisive boundary."

  - section: state_machines
    instances:
      - name: application_double_submit_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Application.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_APPLICATION_STATE]"
        distinguishing_aspect: "Submit is only valid from DRAFT; a second submit on the SUBMITTED application is rejected and leaves state untouched."
        test_recipe:
          setup:
            - "Applicant Ana with a SUBMITTED application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["IT"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
          trigger:
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_APPLICATION_STATE (HTTP 409); Application.${app_id}.status remains SUBMITTED"

      - name: withdrawn_application_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Application.DRAFT_to_WITHDRAWN"
          - "errors[ERR_INVALID_APPLICATION_STATE]"
        distinguishing_aspect: "WITHDRAWN is terminal: submit and begin-review on the withdrawn application are both rejected; no transition leaves a terminal state."
        test_recipe:
          setup:
            - "Applicant Ana with a WITHDRAWN application (withdrawn from DRAFT)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["IT"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
          trigger:
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_APPLICATION_STATE and err2 == ERR_INVALID_APPLICATION_STATE (both 409)"
            - "Application.${app_id}.status remains WITHDRAWN"

      - name: interview_cancel_reverts_application_to_under_review
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Interview.SCHEDULED_to_CANCELLED"
          - "state_machines.Application.INTERVIEWING_to_UNDER_REVIEW"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling the LAST scheduled interview reverts the application to UNDER_REVIEW (conditional cascade); a completed-or-cancelled interview cannot be completed; the reverted application accepts a fresh interview (review loop)."
        test_recipe:
          setup:
            - "Applicant Ana; application INTERVIEWING with exactly one SCHEDULED interview"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["IT"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /volunteer-portal/applications/${app_id}/interviews"
