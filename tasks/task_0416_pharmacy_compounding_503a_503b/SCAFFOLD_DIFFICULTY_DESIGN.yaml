              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_NO_INGREDIENTS_CHARGED (empty BatchIngredientUsage set)"
            - "CompoundingBatch.${batch_id}.status == DRAFT (start rejected)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_start_blocked_by_quarantined_lot_pair_batch_lot
        grounds:
          - state_machines.CompoundingBatch.DRAFT_to_IN_PROCESS
          - entities.IngredientLot.fields.status
          - errors[ERR_LOT_NOT_AVAILABLE]
        distinguishing_aspect: |
          CompoundingBatch's DRAFT->IN_PROCESS transition depends on a different
          entity's state: a charged IngredientLot must be AVAILABLE. With the lot
          QUARANTINED (set by a failed sterility test on a prior batch), start is
          rejected ERR_LOT_NOT_AVAILABLE (409) — the CompoundingBatch↔IngredientLot pair.
        test_recipe:
          setup:
            - "503B facility, sterile MFR. A first OFFICE_USE batch charged the lot and a STERILITY test FAILED, quarantining the lot (status QUARANTINED)."
            - "A second DRAFT OFFICE_USE batch charges the SAME now-quarantined lot."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "XEnt1 B", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Cefazolin 10mg/mL Inj", dosage_form: "STERILE_AQUEOUS", default_bud_days_nonsterile: 1, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Cefazolin", lot_number: "CZ-1", labeled_potency_pct: 100, initial_grams: 100, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch1_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch1_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch1_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch1_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch1_id}", test_type: "STERILITY" }
              as: QualityAssurancePharmacist
              captures: { qc_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc_id}/record"
              payload: { pass: false }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch2_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch2_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch2_id}/start"
              payload: {}
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_LOT_NOT_AVAILABLE (charged lot ${lot_id} is QUARANTINED)"
            - "CompoundingBatch.${batch2_id}.status == DRAFT"

      - name: dispense_blocked_by_prescription_not_active_pair_prep_prescription
        grounds:
          - state_machines.FinishedPreparation.IN_INVENTORY_to_DISPENSED
          - entities.Prescription.fields.status
          - validations[priority=14]
          - errors[ERR_DISPENSE_CHANNEL_MISMATCH]
        distinguishing_aspect: |
          FinishedPreparation's IN_INVENTORY->DISPENSED transition depends on a
          different entity pair (FinishedPreparation↔Prescription): the referenced
          503A prescription must be ACTIVE. A CANCELLED prescription makes the
          dispense fail ERR_DISPENSE_CHANNEL_MISMATCH (422) — a distinct entity pair
          from instance 1's batch↔lot.
