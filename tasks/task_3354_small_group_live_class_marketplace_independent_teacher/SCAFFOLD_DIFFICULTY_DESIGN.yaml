# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Depth probe: the nine §0.5 Difficulty Rules, two instances each (18 total).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is directly executable
# against the §1.5 endpoint surface from empty-DB.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_tier_timing_vs_format_on_enrollment
        grounds:
          - calculations.refund_amount_cents
          - entities.Enrollment.fields.refund_category
          - entities.Enrollment.fields.refund_cents
          - state_machines.Enrollment.RESERVED_to_CANCELLED_BY_TEACHER
        distinguishing_aspect: |
          The two declared selectors disagree for this exact request: at 50 hours before a
          MULTI_DAY section the timing selector returns NONE (50 is below the 336-hour FULL
          cutoff and also below the 72-hour PARTIAL_HALF cutoff), while the format selector
          returns PARTIAL_HALF, so the asserted refund_cents of 0 discriminates the applied
          timing variant from the rejected format variant, whose value would be 1000.
        test_recipe:
          setup:
            - "Teacher ada is ACTIVE; a MULTI_DAY listing priced 2000 is POLICY_APPROVED and PUBLISHED"
            - "A section of that listing starts 2026-10-15T14:00:00Z, min_learners 1, capacity 6, status OPEN_FOR_ENROLLMENT"
            - "Learner ln_1 (born 2016-05-01, parent p_1) holds a RESERVED enrollment on that section with discounted_price_cents 2000"
            - "The logical clock reads 2026-10-13T12:00:00Z, exactly 50 hours before the section start"
          setup_api_calls:
            - call: "POST /outschool/teacher-applications"
              payload: { applicant_user_id: "u_ada", applicant_email: "ada@example.com", display_name: "Ada Lovelace", teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada: $.data.id }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s1: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit-sample"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s2: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/review"
              payload: { stage: "SAMPLE", verdict: "PASS" }
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { app_ada_s3: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/approve"
              payload: {}
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { t_ada: $.data.id }
            - call: "POST /outschool/teachers/${t_ada}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { t_ada_status: $.data.status }
            - call: "POST /outschool/class-listings"
              payload: { teacher_id: "${t_ada}", title: "Algebra Club", format: "MULTI_DAY", min_age: 8, max_age: 12, max_learners: 6, list_price_cents: 2000 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { l_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/policy-review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { l_1_review: $.data.content_review_state }
            - call: "POST /outschool/class-listings/${l_1}/publish"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
            - call: "POST /outschool/class-listings/${l_1}/sections"
              payload: { timezone: "America/New_York", start_utc: "2026-10-15T14:00:00Z", end_utc: "2026-10-15T16:00:00Z", min_learners: 1, capacity: 6 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { s_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/sections/${s_1}/open"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
            - call: "POST /outschool/learners"
              payload: { display_name: "Learner One", birth_date: "2016-05-01T00:00:00Z", parent_user_id: "p_1" }
              as: Parent
              as_user_id: "p_1"
              captures: { ln_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/sections/${s_1}/enrollments"
              payload: { learner_id: "${ln_1}" }
              as: Parent
              as_user_id: "p_1"
              captures: { e_1: $.data.id, e_1_dp: $.data.discounted_price_cents }
            - call: "POST /outschool/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /outschool/enrollments/${e_1}/cancel"
              payload: {}
              as: Parent
              as_user_id: "p_1"
          assert:
            - "Enrollment.${e_1}.discounted_price_cents == 2000"
            - "Enrollment.${e_1}.status == CANCELLED_BY_TEACHER"
            - "Enrollment.${e_1}.refund_category == NONE"
            - "Enrollment.${e_1}.refund_cents == 0"
            - "Enrollment.${e_1}.cash_refund_cents == 0"
            - "The rejected format selector would have produced refund_category == PARTIAL_HALF and refund_cents == 1000 for this same request, so refund_cents == 0 discriminates the applied timing selector from the rejected format selector"

      - name: payout_gross_accrual_vs_posted_on_teacherpayout
        grounds:
          - calculations.expected_payout_gross_cents
          - entities.TeacherPayout.fields.gross_earnings_cents
