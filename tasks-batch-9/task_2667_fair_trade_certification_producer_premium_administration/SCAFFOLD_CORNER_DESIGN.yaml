              payload: {}
              as: CertificationOfficer
              captures: { holder_v: $.data.version }
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${prod_id}", auditor_user_id: "auditor-1", audit_type: "INITIAL", window_start: "2026-08-01", window_end: "2026-08-08" }
              as: CertificationOfficer
              captures: { audit_id: $.data.id }
            - call: "POST /fairtrade/audits/${audit_id}/start"
              payload: {}
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/audits/${audit_id}/nonconformities"
              payload: { clause_code: "4.2.1", grade: "MAJOR", description: "Wage records incomplete" }
              as: Auditor
              as_user_id: "auditor-1"
              captures: { nc_id: $.data.id, nc_v: $.data.version }
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/compliance-sweeps"
              payload: {}
              as: CertificationOfficer
          assert:
            - "HTTP 200 with swept_at == 2026-08-05T00:00:00Z"
            - "overdue_count == 0, escalated_count == 0, suspended_holder_count == 0, suspended_node_count == 0, disputed_transaction_count == 0 and decertified_holder_count == 0"
            - "Nonconformity.${nc_id}.status == OPEN, deadline_at == 2026-09-15T00:00:00Z and version == ${nc_v}"
            - "CertificateHolder.${prod_id}.certificate_status == CERTIFIED and version == ${holder_v}"

      - name: node_create_links_the_upstream_node_and_is_listable_by_that_link
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /fairtrade/supply-chain-nodes]
          - endpoints[GET /fairtrade/supply-chain-nodes]
          - calculations.upstream_traceability_chain
        distinguishing_aspect: "A three-deep chain is built and then read back through the upstream_node_id filter: the filter returns only the single direct child of the cooperative, not the grandchild, and chain_depth counts 0, 1, 2 down the link."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer holder and CERTIFIED brand holder"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
