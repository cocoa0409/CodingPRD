  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_half_open_adjacency_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_PERMIT_INTERVAL_OVERLAP]
          - entities.EmergencyPermit.fields.valid_from
        distinguishing_aspect: |
          Half-open semantics on EmergencyPermit (per applicant+district): a permit starting
          exactly at the previous permit's valid_until does NOT overlap, while one day earlier
          does — [2026-09-01, 2027-03-01) then [2027-03-01, 2027-09-01) is accepted.
        test_recipe:
          setup: ["ALTERNATIVE SCIENCE application in DEFICIENCY_PENDING with ACCEPTED plan; permit P1 ISSUED [2026-09-01, 2027-03-01) district D07"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Pat Pa", email: "pat@x.com", date_of_birth: "1996-02-02T00:00:00Z", ssn_last4: "1122", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "DEFICIENCY_PENDING" }, as: CredentialEvaluator, captures: { app_v: $.data.version } }
            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { plan: $.data.id } }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "ACCEPTED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/emergency-permits", payload: { district_code: "D07", valid_from: "2026-09-01T00:00:00Z", valid_until: "2027-03-01T00:00:00Z" }, as: CredentialEvaluator, captures: { perm1: $.data.id } }
          trigger:
            - { call: "POST /licensure/applications/${app}/emergency-permits", payload: { district_code: "D07", valid_from: "2027-02-28T00:00:00Z", valid_until: "2027-08-28T00:00:00Z" }, as: CredentialEvaluator, captures: { err: $.data.error_id } }
            - { call: "POST /licensure/applications/${app}/emergency-permits", payload: { district_code: "D07", valid_from: "2027-03-01T00:00:00Z", valid_until: "2027-09-01T00:00:00Z" }, as: CredentialEvaluator, captures: { perm2: $.data.id } }
          assert:
            - "first overlapping attempt error_id == 'ERR_PERMIT_INTERVAL_OVERLAP'"
            - "adjacent permit ${perm2} created with status == 'ISSUED'"

      - name: suspension_closed_interval_touching_overlaps
        grounds:
          - validations[priority=7]
          - errors[ERR_SUSPENSION_INTERVAL_OVERLAP]
          - entities.DisciplinaryAction.fields.suspension_start
        distinguishing_aspect: |
          Closed-interval semantics on DisciplinaryAction (different resource than
          EmergencyPermit): a second SUSPENSION whose start equals the first suspension's
          end DOES overlap ([2027-01-01, 2027-06-30] vs start 2027-06-30), the opposite
          adjacency rule from half-open permits.
        test_recipe:
          setup: ["License ACTIVE; misconduct case ADJUDICATED SUBSTANTIATED; SUSPENSION action A1 PROPOSED for [2027-01-01, 2027-06-30]"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Qua Qu", email: "qua@x.com", date_of_birth: "1983-01-01T00:00:00Z", ssn_last4: "3344", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "APPROVED" }, as: CredentialEvaluator }
            - { call: "GET /licensure/licenses?application_id=${app}", payload: {}, as: CredentialEvaluator, captures: { lic: "$.data[0].id" } }
            - { call: "POST /licensure/licenses/${lic}/misconduct-cases", payload: { allegation_category: "INCOMPETENCE" }, as: LegalOfficer, captures: { mc: $.data.id } }
            - { call: "POST /licensure/misconduct-cases/${mc}/state", payload: { to_status: "INVESTIGATING" }, as: BackgroundInvestigator, as_user_id: "inv_2" }
            - { call: "POST /licensure/misconduct-cases/${mc}/state", payload: { to_status: "HEARING" }, as: LegalOfficer }
            - { call: "POST /licensure/misconduct-cases/${mc}/state", payload: { to_status: "ADJUDICATED", finding: "SUBSTANTIATED" }, as: LegalOfficer, as_user_id: "legal_2" }
            - { call: "POST /licensure/misconduct-cases/${mc}/disciplinary-actions", payload: { sanction_type: "SUSPENSION", suspension_start: "2027-01-01T00:00:00Z", suspension_end: "2027-06-30T00:00:00Z" }, as: LegalOfficer, captures: { da1: $.data.id } }
          trigger:
            - { call: "POST /licensure/misconduct-cases/${mc}/disciplinary-actions", payload: { sanction_type: "SUSPENSION", suspension_start: "2027-06-30T00:00:00Z", suspension_end: "2027-12-31T00:00:00Z" }, as: LegalOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_SUSPENSION_INTERVAL_OVERLAP'"
            - "DisciplinaryAction.${da1}.status == 'PROPOSED'"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ce_credit_void_reinstate_conserves_audit_total
        grounds:
          - state_machines.CECredit.VERIFIED_to_VOIDED
          - state_machines.CECredit.VOIDED_to_VERIFIED
          - calculations.ce_credit_audit_total
        distinguishing_aspect: |
          Conserved quantity: audited verified_hours. Determination totals go 50 -> 30 after
          voiding the PEDAGOGY 20 credit -> back to exactly 50 after reinstating it; the
          forward VOID paired with the compensating reinstate leaves the audit total unchanged.
        test_recipe:
