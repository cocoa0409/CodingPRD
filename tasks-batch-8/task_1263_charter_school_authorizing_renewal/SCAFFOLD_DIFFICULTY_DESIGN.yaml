              as: ApplicationReviewer
              as_user_id: rev_cf3
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "COMMUNITY_SUPPORT", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_cf3
            - call: "POST /authorizer/applications/${app_id}/interviews"
              payload: { scheduled_start: "2026-05-14T10:00:00Z", scheduled_end: "2026-05-14T11:00:00Z", panelist_user_ids: ["rev_panel_cf3"] }
              as: AuthorizerStaff
