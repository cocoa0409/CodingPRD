              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { lotu: $.data.id }
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "TEXTILE_BALE", item_ids: ["${w3}", "${w4}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { lotv: $.data.id }
          trigger:
            - call: "POST /donated-goods/salvage-lots/${lotu}/sell"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
            - call: "POST /donated-goods/salvage-lots/${lotv}/sell"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
          assert:
            - "the 49-lb bale is rejected with ERR_BALE_UNDERWEIGHT (${err}) and lot U remains OPEN"
            - "the 50-lb bale sells with sale_revenue_cents == 600 (boundary weight accepted)"

      - name: ewaste_lot_prices_per_item_not_per_pound
        claim_type: Constants Applied
        grounds: [calculations.salvage_pricing]
        distinguishing_aspect: "EWASTE revenue is item_count * 150 with weight irrelevant: 7 items totalling 3.5 lbs sell for 1050 cents, demonstrating the channel constant rather than the by-the-pound rates."
        test_recipe:
          setup: ["Org with seven SALVAGED EWASTE items of 0.5 lbs each in one EWASTE lot."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org EW", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site EW", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DEW", item_count_declared: 7 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 0.5 }, { category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 0.5 }, { category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 0.5 }, { category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 0.5 }, { category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 0.5 }, { category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 0.5 }, { category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 0.5 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { e1: $.data.0.id, e2: $.data.1.id, e3: $.data.2.id, e4: $.data.3.id, e5: $.data.4.id, e6: $.data.5.id, e7: $.data.6.id }
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "EWASTE", item_ids: ["${e1}", "${e2}", "${e3}", "${e4}", "${e5}", "${e6}", "${e7}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/salvage-lots/${lot_id}/sell"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
          assert:
            - "SalvageLot.${lot_id}.item_count == 7 and sale_revenue_cents == 1050 (7 * 150)"
            - "GET /donated-goods/member-orgs/${org_id} shows total_diverted_lbs == 3.5 (weight still counted for diversion)"

      - name: diversion_empty_denominator_defaults_fully_diverted
        claim_type: Correct Result
        grounds: [calculations.diversion_rate, entities.MemberOrg.fields.diversion_rate_bps]
        distinguishing_aspect: "With no diversion and no disposal recorded, the rate is defined as 10000 bps (not a division error), so a brand-new org is compliant."
        test_recipe:
          setup: ["Freshly created org; no lots sold, no disposal tickets."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Fresh", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "diversion_rate_bps == 10000 and diversion_compliant == true with total_diverted_lbs == 0 and total_disposed_lbs == 0"

      - name: compliance_posture_exactly_quarter_missed_stays_at_risk
        claim_type: Correct Result
        grounds: [calculations.compliance_posture, state_machines.ContractMilestone.PENDING_to_MISSED]
        distinguishing_aspect: "The BREACH rule is strictly greater than 25%: with 1 of 4 milestones MISSED (exactly 25%, 1*4 > 4 is false) the posture is AT_RISK, not BREACH."
        test_recipe:
          setup: ["Clock default 2026-09-01. Org with a contract holding 4 milestones: M1 target 2026-08-01 (overdue), M2-M4 target 2026-12-01."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org CP", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/workforce-contracts"
              payload: { member_org_id: "${org_id}", funding_agency: "DOL", start_date: "2026-03-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", contract_value_cents: 200000, enrolled_headcount: 50, milestones: [{ description: "M1", target_date: "2026-08-01T00:00:00Z", min_headcount: 10, payout_cents: 10000 }, { description: "M2", target_date: "2026-12-01T00:00:00Z", min_headcount: 10, payout_cents: 10000 }, { description: "M3", target_date: "2026-12-01T00:00:00Z", min_headcount: 10, payout_cents: 10000 }, { description: "M4", target_date: "2026-12-01T00:00:00Z", min_headcount: 10, payout_cents: 10000 }] }
              as: ContractManager
              as_user_id: "cm-1"
              captures: { con_id: $.data.id }
            - call: "POST /donated-goods/workforce-contracts/${con_id}/reviews"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /donated-goods/workforce-contracts/${con_id}/reviews"
              payload: { action: "CLOSE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the CLOSE sweep marks only M1 MISSED (target 2026-08-01 < clock); M2-M4 remain PENDING"
            - "contract.missed_count == 1 and compliance_posture == AT_RISK (exactly 25% missed is not BREACH)"
            - "contract status returns to ACTIVE (not CLOSED — three milestones still PENDING)"

      - name: disposal_cost_uses_per_material_rates
        claim_type: Constants Applied
        grounds: [calculations.disposal_cost]
        distinguishing_aspect: "Disposal cost is weight times the per-material rate: 10 lbs of HAZARD costs 400 cents while 10 lbs of MIXED_UNSALABLE costs 90, and both accumulate into total_disposed_lbs."
        test_recipe:
          setup: ["Fresh org."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org DC", reserve_floor_cents: 0, diversion_floor_bps: 10000 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/disposal-tickets"
              payload: { member_org_id: "${org_id}", material: "HAZARD", weight_lbs: 10 }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { t1: $.data.id }
            - call: "POST /donated-goods/disposal-tickets"
              payload: { member_org_id: "${org_id}", material: "MIXED_UNSALABLE", weight_lbs: 10 }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { t2: $.data.id }
          assert:
            - "DisposalTicket.${t1}.cost_cents == 400 (10 * 40) and DisposalTicket.${t2}.cost_cents == 90 (10 * 9)"
            - "GET /donated-goods/member-orgs/${org_id} shows total_disposed_lbs == 20 and diversion_rate_bps == 0 (all disposal, no diversion)"

      - name: actual_costing_falls_back_to_standard_without_closed_runs
        claim_type: Variant Selection
        grounds: [calculations.unit_costing]
        distinguishing_aspect: "An ACTUAL-costing org with zero CLOSED runs in the category falls back to the STANDARD formula (hourly/target = 30) rather than failing or costing 0."
        test_recipe:
          setup: ["Clock default. Org with costing_method ACTUAL, standard TEXTILES, no processing runs; one SORTED grade-A item."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org AF", costing_method: "ACTUAL", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site AF", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DA", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
          trigger:
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
          assert:
            - "DonatedItem.${it}.unit_cost_cents == 30 (STANDARD fallback: 1800/60) despite costing_method ACTUAL"

      - name: price_point_assignment_clamps_to_floor_and_ceiling
        claim_type: Correct Result
        grounds: [calculations.unit_costing, entities.ProductionStandard.fields.price_floor_cents, entities.ProductionStandard.fields.price_ceiling_cents]
        distinguishing_aspect: "The grade price map is clamped into [floor, ceiling]: grade A mapping 9999 lands on the 5000 ceiling and grade C mapping 50 lands on the 100 floor."
        test_recipe:
          setup: ["Clock default. Org with TEXTILES standard whose grade_price_map {A:9999, B:700, C:50} exceeds its own floor 100 / ceiling 5000; two SORTED items (grade A and grade C)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Clamp", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site CL", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 9999, B: 700, C: 50 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DCLA", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { dona_id: $.data.id }
            - call: "POST /donated-goods/donations/${dona_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${dona_id}" }
              as: StoreAssociate
              captures: { ia: $.data.0.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DCLC", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { donc_id: $.data.id }
            - call: "POST /donated-goods/donations/${donc_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "C", estimated_value_cents: 40, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${donc_id}" }
              as: StoreAssociate
              captures: { ic: $.data.0.id }
          trigger:
            - call: "POST /donated-goods/donated-items/${ia}/price"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donated-items/${ic}/price"
              payload: {}
              as: StoreAssociate
          assert:
            - "grade-A item priced at 5000 (ceiling clamp of 9999), current_selling_price_cents == 5000"
            - "grade-C item priced at 100 (floor clamp of 50), current_selling_price_cents == 100"

  # ===========================================================================
  - section: validations
    instances:

      - name: request_without_auth_headers_returns_unauthenticated
        claim_type: "Violation → Error"
        grounds: ["validations[priority=2]", errors.ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request missing X-User-Role / X-User-ID fails before any role or existence check with 401 ERR_UNAUTHENTICATED — priority 2 beats the not-found the path id would otherwise produce."
        test_recipe:
          setup: ["Empty database (the path id deliberately does not exist, proving auth runs first)."]
          setup_api_calls: []
          trigger:
            - call: "GET /donated-goods/member-orgs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "response status 401 with data.error_id == ERR_UNAUTHENTICATED (${err}), not 404"

      - name: store_associate_cannot_create_salvage_lot
        claim_type: "Violation → Error"
        grounds: [roles.StoreAssociate, "validations[priority=3]", errors.ERR_FORBIDDEN]
        distinguishing_aspect: "RBAC denial precedes business checks: a StoreAssociate posting a salvage lot gets 403 ERR_FORBIDDEN even though the payload is well-formed and the org is compliant."
        test_recipe:
          setup: ["Org in good standing."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org RB", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "OUTLET_BIN", item_ids: [] }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with data.error_id == ERR_FORBIDDEN (${err})"

      - name: attendant_posting_at_other_site_rejected
        claim_type: "Violation → Error"
        grounds: [roles.DonationAttendant, "validations[priority=4]", errors.ERR_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "DonationAttendant identity is site-backed: the attendant of site A posting an intake naming site B gets 403 ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Org with two ADC sites A and B."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org OM", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site A", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { sitea: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site B", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { siteb: $.data.id }
          trigger:
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${siteb}", donor_name: "Sneaky", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${sitea}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with data.error_id == ERR_OWNERSHIP_MISMATCH (${err})"

      - name: member_admin_of_other_org_cannot_create_site
        claim_type: "Violation → Error"
        grounds: [roles.MemberAdmin, "validations[priority=4]", errors.ERR_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "MemberAdmin identity is org-backed: an admin of org 1 creating a site for org 2 is 403 ERR_OWNERSHIP_MISMATCH — cross-tenant writes are blocked even between two healthy orgs."
        test_recipe:
          setup: ["Two orgs."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org One", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Two", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org2: $.data.id }
          trigger:
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org2}", name: "Intrusion", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org1}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with data.error_id == ERR_OWNERSHIP_MISMATCH (${err})"

      - name: get_unknown_donated_item_returns_not_found
        claim_type: "Violation → Error"
        grounds: ["endpoints.GET_/donated-goods/donated-items/{id}", errors.ERR_NOT_FOUND, response_envelope]
        distinguishing_aspect: "Reading a well-formed but unallocated item id returns 404 ERR_NOT_FOUND with the full error envelope (data.error_id plus data.message)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /donated-goods/donated-items/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response status 404, response_type == error, data.error_id == ERR_NOT_FOUND (${err}), data.message non-empty"

      - name: sort_with_wrong_item_count_rejected
        claim_type: "Violation → Error"
        grounds: ["validations[priority=14]", errors.ERR_ITEM_COUNT_MISMATCH]
        distinguishing_aspect: "The sorter's manifest must match the donor-declared count exactly: 1 item against item_count_declared 2 fails with ERR_ITEM_COUNT_MISMATCH and the donation stays RECEIVED."
        test_recipe:
          setup: ["Org, ADC site, donation declared 2."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org IC", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site IC", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DIC", item_count_declared: 2 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "MEDIA", condition_grade: "B", estimated_value_cents: 60, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { err: $.data.error_id }
          assert:
            - "sort rejected with ERR_ITEM_COUNT_MISMATCH (${err})"
            - "Donation.${don_id} remains RECEIVED; GET /donated-goods/donated-items?donation_id=${don_id} returns 0 rows"

      - name: channel_incompatible_item_rejected_from_lot
        claim_type: "Violation → Error"
        grounds: ["validations[priority=12]", errors.ERR_ITEM_CHANNEL_MISMATCH]
        distinguishing_aspect: "Channel membership is category-checked: an EWASTE item cannot be loaded into a TEXTILE_BALE lot (textile bales accept TEXTILES only)."
        test_recipe:
          setup: ["Org with one SALVAGED EWASTE item."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org CM", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site CM", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DCM", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "EWASTE", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 4 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { ew: $.data.0.id }
          trigger:
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "TEXTILE_BALE", item_ids: ["${ew}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "lot creation rejected with ERR_ITEM_CHANNEL_MISMATCH (${err})"
            - "item ${ew} keeps salvage_lot_id null and no lot is persisted"

      - name: item_already_in_lot_rejected_from_second_lot
        claim_type: "Violation → Error"
        grounds: ["validations[priority=12]", errors.ERR_ITEM_ALREADY_IN_LOT, entities.DonatedItem.fields.salvage_lot_id]
        distinguishing_aspect: "An item already linked to lot 1 cannot be loaded into lot 2 — ERR_ITEM_ALREADY_IN_LOT prevents double-counting weight across salvage channels."
        test_recipe:
          setup: ["Org with one SALVAGED TEXTILES item already loaded into OPEN lot 1."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org AL", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site AL", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DAL", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 12.0 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { s1: $.data.0.id }
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "OUTLET_BIN", item_ids: ["${s1}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "OUTLET_BIN", item_ids: ["${s1}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second lot create rejected with ERR_ITEM_ALREADY_IN_LOT (${err})"
            - "GET /donated-goods/member-orgs/${org_id}/salvage-lots returns exactly 1 lot (SalvageLot.${lot1}) with item_count == 1"

      - name: headcount_shortfall_blocks_attestation
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=14]
          - errors.ERR_HEADCOUNT_SHORTFALL
        distinguishing_aspect: "Attestation requires the contract's enrolled_headcount >= milestone.min_headcount: a 10-person contract cannot attest a 40-person milestone even though every other gate passes."
        test_recipe:
          setup: ["Clock default. Org; contract (headcount 10) with one milestone (min_headcount 40, target 2026-12-01, payout 5000)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org HC", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/workforce-contracts"
              payload: { member_org_id: "${org_id}", funding_agency: "DOL", start_date: "2026-03-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", contract_value_cents: 50000, enrolled_headcount: 10, milestones: [{ description: "M1", target_date: "2026-12-01T00:00:00Z", min_headcount: 40, payout_cents: 5000 }] }
              as: ContractManager
              as_user_id: "cm-1"
              captures: { con_id: $.data.id }
            - call: "GET /donated-goods/milestones"
              payload: { contract_id: "${con_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { m1: $.data.0.id }
          trigger:
            - call: "POST /donated-goods/milestones/${m1}/attest"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "attestation rejected with ERR_HEADCOUNT_SHORTFALL (${err})"
            - "milestone remains PENDING and contract_revenue_cents stays 0"

      - name: allocation_creator_cannot_approve
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=11]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.FundingAllocation.fields.created_by_user_id
        distinguishing_aspect: "Segregation of duties: the ProgramDirector who created the allocation cannot also approve it — MemberCFO presenting the same X-User-ID is rejected with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Clock default. Org (reserve_floor 0), program inside window, allocation 500 created by pd-1."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org SoD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Prog SoD", program_type: "SUPPORT", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 50000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 500, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/approve"
              payload: {}
              as: MemberCFO
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "approve rejected with ERR_SEGREGATION_OF_DUTIES (${err})"
            - "allocation remains PENDING and reserved_cents stays 0"

      - name: contract_creator_cannot_attest_own_milestone
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=11]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.WorkforceContract.fields.created_by_user_id
        distinguishing_aspect: "The workforce-contract side of segregation: the ContractManager who created the contract cannot attest its milestones even while wearing the ComplianceOfficer role — the X-User-ID match is what fails."
        test_recipe:
          setup: ["Clock default. Org; contract (headcount 50) with one milestone (min 40), created by cm-1."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org SoD2", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/workforce-contracts"
              payload: { member_org_id: "${org_id}", funding_agency: "DOL", start_date: "2026-03-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", contract_value_cents: 50000, enrolled_headcount: 50, milestones: [{ description: "M1", target_date: "2026-12-01T00:00:00Z", min_headcount: 40, payout_cents: 5000 }] }
              as: ContractManager
              as_user_id: "cm-1"
              captures: { con_id: $.data.id }
            - call: "GET /donated-goods/milestones"
              payload: { contract_id: "${con_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { m1: $.data.0.id }
          trigger:
            - call: "POST /donated-goods/milestones/${m1}/attest"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "attestation rejected with ERR_SEGREGATION_OF_DUTIES (${err})"
            - "milestone remains PENDING and contract_revenue_cents stays 0"

      - name: approve_beyond_available_margin_rejected
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=15]
          - errors.ERR_INSUFFICIENT_MARGIN
        distinguishing_aspect: "Approval is the fiscal gate: amount 2000 against pool 970 with nothing reserved fails with 402 ERR_INSUFFICIENT_MARGIN and no reservation is created."
        test_recipe:
          setup: ["Clock default. Org (reserve_floor 0) with pool 970 (one grade-A sale); program inside window; allocation of 2000 created."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org IM", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site IM", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v0}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DIM", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donated-items/${it}/sell"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Prog IM", program_type: "JOB_TRAINING", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 100000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { org_v1: $.data.version }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 2000, expected_member_org_version: "${org_v1}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/approve"
              payload: {}
              as: MemberCFO
              as_user_id: "cfo-1"
              captures: { err: $.data.error_id }
          assert:
            - "approve rejected with 402 ERR_INSUFFICIENT_MARGIN (${err}) because 2000 > 970 - 0"
            - "allocation remains PENDING; reserved_cents stays 0; pool stays 970"

      - name: stale_org_version_rejected_on_standard_create
        claim_type: "Violation → Error"
        grounds:
          - concurrency_rules[standard-create-stale-org]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on MemberOrg.version: after the first standard create bumps the org to version 2, replaying a create with the previously observed version 1 fails with 412 ERR_STALE_VERSION and does NOT supersede the ACTIVE standard."
        test_recipe:
          setup: ["Fresh org (version 1 captured)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org OCC", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
          trigger:
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { std1: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 80, hourly_cost_cents: 2000, grade_price_map: { A: 1200, B: 800, C: 500 }, price_floor_cents: 100, price_ceiling_cents: 6000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds with 201 and bumps MemberOrg.version to 2"
            - "second create with the stale version is rejected with 412 ERR_STALE_VERSION (${err})"
            - "ProductionStandard.${std1} remains ACTIVE (the failed create superseded nothing): GET /donated-goods/member-orgs/${org_id}/production-standards?status=ACTIVE returns exactly 1 row"

      - name: stale_org_version_rejected_on_allocation_create
        claim_type: "Violation → Error"
        grounds:
          - concurrency_rules[allocation-create-stale-org]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on the second guarded endpoint: two allocation creates carrying the same observed org version — the first succeeds and bumps the version, the second replay fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Clock default. Org (reserve_floor 0, version 1 captured) with a program inside its window."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org OCC2", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Prog OCC", program_type: "SUPPORT", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 50000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 100, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc1: $.data.id }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 200, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds (201) and bumps MemberOrg.version to 2"
            - "second create with the stale version rejected with 412 ERR_STALE_VERSION (${err})"
            - "GET /donated-goods/funding-allocations?mission_program_id=${prog_id} returns exactly 1 row (FundingAllocation.${alloc1})"

      - name: approve_after_program_window_closed_rejected
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=13]
          - errors.ERR_PROGRAM_WINDOW_CLOSED
        distinguishing_aspect: "The funding window is re-checked at approval time, not just at creation: an allocation created inside the window cannot be approved after end_date."
        test_recipe:
          setup: ["Clock starts 2026-03-01 (inside the program window 2026-01-01..2026-06-30). Org (reserve_floor 0), program, allocation of 100 created. Clock then advanced to 2026-09-01 (past the window)."]
          setup_api_calls:
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Win", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Prog Win", program_type: "PLACEMENT", start_date: "2026-01-01T00:00:00Z", end_date: "2026-06-30T00:00:00Z", funding_goal_cents: 50000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 100, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/approve"
              payload: {}
              as: MemberCFO
              as_user_id: "cfo-1"
              captures: { err: $.data.error_id }
          assert:
            - "approve rejected with ERR_PROGRAM_WINDOW_CLOSED (${err})"
            - "allocation remains PENDING with reserved_cents == 0"

      - name: pricing_without_active_standard_rejected
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=12]
          - errors.ERR_NO_ELIGIBLE_STANDARD
        distinguishing_aspect: "Price-point assignment needs an ACTIVE standard for the item's (org, category): pricing a HOUSEWARES item when only TEXTILES standards exist fails with ERR_NO_ELIGIBLE_STANDARD."
        test_recipe:
          setup: ["Clock default. Org with a TEXTILES-only standard; one SORTED HOUSEWARES item."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org NS", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site NS", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DNS", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "HOUSEWARES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 2 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
          trigger:
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "pricing rejected with ERR_NO_ELIGIBLE_STANDARD (${err}); item remains SORTED with price_cents null"

      - name: run_open_with_superseded_standard_rejected
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=12]
          - errors.ERR_NO_ELIGIBLE_STANDARD
          - state_machines.ProductionStandard.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: "Runs pin the standard that was ACTIVE at open: after v2 supersedes v1, opening a run against v1 fails with ERR_NO_ELIGIBLE_STANDARD — supersession never retargets existing runs but blocks new ones."
        test_recipe:
          setup: ["Clock default. Org with TEXTILES standard v1 created then superseded by v2 (fresh version read between creates)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org SS", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site SS", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v0}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { std1: $.data.id }
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { org_v1: $.data.version }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 80, hourly_cost_cents: 2000, grade_price_map: { A: 1200, B: 800, C: 500 }, price_floor_cents: 100, price_ceiling_cents: 6000, expected_member_org_version: "${org_v1}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { std2: $.data.id }
          trigger:
            - call: "POST /donated-goods/processing-runs"
              payload: { site_id: "${site_id}", production_standard_id: "${std1}" }
              as: ProductionLead
              captures: { err: $.data.error_id }
          assert:
            - "run open against the SUPERSEDED v1 rejected with ERR_NO_ELIGIBLE_STANDARD (${err})"
            - "GET /donated-goods/member-orgs/${org_id}/production-standards shows v1 SUPERSEDED and v2 ACTIVE"
            - "GET /donated-goods/processing-runs?site_id=${site_id} returns 0 rows"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_defaults_to_fixed_epoch_and_drives_timestamps
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/donated-goods/_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-09-01T00:00:00Z (not wall-clock): an org created first carries that created_at, and after advancing the clock a site carries the new timestamp."
        test_recipe:
          setup: ["Fresh server; no clock calls yet."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Clock", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:30:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site Clock", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
          assert:
            - "MemberOrg.${org_id}.created_at == 2026-09-01T00:00:00Z (fixed default, wall-clock independent)"
            - "DonationSite.${site_id}.created_at == 2026-10-15T08:30:00Z (driven by the advanced logical clock)"

      - name: markdown_event_returns_applied_counts
        claim_type: Computed read
        grounds:
          - endpoints.POST_/donated-goods/member-orgs/{id}/markdown-events
        excluded_because:
          difficulty_instance: rotation_pulls_at_exactly_four_weeks
          rationale: "That difficulty instance asserts the inline summary (applied_week == 4, pulled_count == 1, marked_down_count == 1) from the event response."

  # ===========================================================================
  - section: errors
    instances:

      - name: error_org_suspended_triggerable
        claim_type: "Violation → Error"
        grounds: [errors.ERR_ORG_SUSPENDED]
        excluded_because:
          difficulty_instance: item_price_blocked_when_org_suspended
          rationale: "Asserted as the failure path of that difficulty instance."

      - name: error_diversion_breach_triggerable
        claim_type: "Violation → Error"
        grounds: [errors.ERR_DIVERSION_BREACH]
        excluded_because:
          difficulty_instance: disposal_ticket_diversion_breach_gate
          rationale: "Asserted as the gate rejection in that difficulty instance."

      - name: error_margin_reserve_breach_triggerable
        claim_type: "Violation → Error"
        grounds: [errors.ERR_MARGIN_RESERVE_BREACH]
        excluded_because:
          difficulty_instance: allocation_disburse_margin_health_gate
          rationale: "Asserted as the gate rejection in that difficulty instance."

      - name: error_program_window_closed_triggerable
        claim_type: "Violation → Error"
        grounds: [errors.ERR_PROGRAM_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: allocation_window_beats_margin
          rationale: "Asserted as the winning error of that priority-conflict instance; also re-exercised by corner approve_after_program_window_closed_rejected."

      - name: error_territory_window_overlap_triggerable
        claim_type: "Violation → Error"
        grounds: [errors.ERR_TERRITORY_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: territory_half_open_adjacency
          rationale: "Asserted as the rejection in that difficulty instance."

      - name: error_contract_window_overlap_triggerable
        claim_type: "Violation → Error"
