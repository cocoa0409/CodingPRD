              captures: { memo_id: $.data.id }
            - call: "POST /re-underwriting/ic-memos/${memo_id}/submit"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/submit-ic"
