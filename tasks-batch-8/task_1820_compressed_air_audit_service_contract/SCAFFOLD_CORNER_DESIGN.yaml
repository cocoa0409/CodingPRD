            - { call: "POST /service-tickets/${t1}/record-response", as: ServiceTech }
            - { call: "GET /service-credits?contract_id=${sc}", as: ContractManager, captures: { cr1: "$.data[0].id", exp1: "$.data[0].expires_at" } }
