# =============================================================================
# §1.9 Scaffold Corner Design — Heavy Truck Uptime Case Management &
# Warranty Administration
#
# Breadth probe: enumerates testable claims from §1.1–§1.7 NOT already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners that §1.8 covers appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: fleet_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Fleet
          - endpoints.POST_/fleets
        distinguishing_aspect: "A fleet created with only fleet_name+home_region returns 201 with fleet_status ACTIVE, reliability_score 1000, open_case_count 0, total_downtime_hours 0, version 1, and system id/created_at/updated_at — none of the computed fields are client-settable."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
          trigger:
            - call: "POST /fleets"
              payload: { fleet_name: "Acme Haulage", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-a"
              captures: { fleet_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Fleet.${fleet_id}.fleet_name == 'Acme Haulage' and home_region == 'SE'"
            - "Fleet.${fleet_id}.fleet_status == ACTIVE"
            - "Fleet.${fleet_id}.reliability_score == 1000"
            - "Fleet.${fleet_id}.open_case_count == 0"
            - "Fleet.${fleet_id}.total_downtime_hours == 0"
            - "Fleet.${fleet_id}.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: truck_get_returns_stored_data_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Truck
          - endpoints.GET_/fleets/{fleetId}/trucks/{truckId}
        distinguishing_aspect: "Every Truck input field round-trips through GET exactly as posted (vin, model_code, in_service_on, odometer_miles, base_warranty_until_miles, base_warranty_until_on)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One fleet created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Retrieval Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-r"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0200", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 123456, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
          assert:
            - "the response status is 200"
            - "Truck.${truck_id}.vin == '1FUJGBDV8CLBP0200'"
            - "Truck.${truck_id}.model_code == 'CASCADIA_126'"
            - "Truck.${truck_id}.odometer_miles == 123456"
            - "Truck.${truck_id}.truck_status == IN_SERVICE"
            - "Truck.${truck_id}.repeat_repair_flag == false"

      - name: cases_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/fleets/{fleetId}/trucks/{truckId}/cases
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three cases on a truck, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false. Default limit is 10."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Page Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-pg"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0201", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 100, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3226_FMI4" }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN168_FMI4" }
              as: UptimeCoordinator
          trigger:
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { limit: 2, offset: 0 }
              as: FleetManager
              as_user_id: "${fleet_id}"
          assert:
            - "the response status is 200 and response_type is array"
            - "returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET with no query params returns 3 rows (default limit=10 covers all)"

      - name: truck_get_with_unknown_id_returns_truck_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/fleets/{fleetId}/trucks/{truckId}
          - errors.ERR_TRUCK_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated truck UUID under an existing fleet returns 404 ERR_TRUCK_NOT_FOUND (not a generic 400, not ERR_FLEET_NOT_FOUND)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One fleet, no trucks."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "NF Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-nf"
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "GET /fleets/${fleet_id}/trucks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "err == ERR_TRUCK_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: truck_create_missing_vin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Truck.fields.vin
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "vin is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One fleet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "RQ Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-rq"
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 100, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err == ERR_INVALID_REQUEST"
            - "GET /fleets/${fleet_id}/trucks returns 0 rows"

      - name: truck_create_defaults_repeat_repair_flag_to_false
        claim_type: Defaults
        grounds:
          - entities.Truck.fields.repeat_repair_flag
        distinguishing_aspect: "repeat_repair_flag is computed with default false; a freshly created truck reads false regardless of no client input, and the field remains false until the repeat-repair window actually crosses the threshold."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One fleet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Default Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-df"
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0202", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Truck.${truck_id}.repeat_repair_flag == false"

      - name: case_downtime_hours_computed_at_close
        claim_type: Computed Fields
        grounds:
          - entities.Case.fields.downtime_hours
          - calculations.truck_downtime_hours
        distinguishing_aspect: "downtime_hours is computed only at CLOSED = (closed_at - opened_at) rounded to 2 decimals half-up; while the case is open it is 0.00, and the field is not client-settable."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay; case opened at 13:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "CF Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-cf"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0203", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "CF Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}"
              payload: {}
              as: UptimeCoordinator
              captures: { open_downtime: $.data.downtime_hours }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/triage"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_v: $.data.version }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/schedule"
              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T14:00:00Z", scheduled_end_at: "2026-09-01T17:00:00Z", expected_truck_version: "${truck_v}" }
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders"
              payload: {}
              as: UptimeCoordinator
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/authorize"
              payload: { diagnostic_minutes_authorized: 30 }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/start-service"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/complete"
              payload: { labor_minutes_actual: 60, repair_outcome: "FIXED" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/request-close"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T15:30:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/close"
              payload: {}
              as: UptimeCoordinator
          assert:
            - "open_downtime == 0.00 (case open)"
            - "after close, Case.${case_id}.downtime_hours == 2.50 (13:00 → 15:30)"

      - name: fault_event_is_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.FaultEvent
        distinguishing_aspect: "FaultEvent has common_fields: false (append-only); it carries no version field, and there is no PUT/PATCH endpoint — only create + dismiss (a state transition) are exposed."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Fleet/Truck."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Imm Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-im"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0204", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/fault-events"
              payload: { fault_code: "SPN3216_FMI4", severity: "CRITICAL", recommended_action: "STOP_IMMEDIATELY", occurred_at: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
              captures: { fe_id: $.data.id }
          assert:
            - "FaultEvent.${fe_id} response carries id and created_at but no version and no updated_at"
            - "event_status == UNLINKED"
            - "no PUT or PATCH endpoint exists on /fault-events/{id} (the §1.5 surface only declares POST/GET/dismiss)"

      - name: fleet_suspend_blocks_mutating_child_operations
        claim_type: Parent Relationships
        grounds:
          - validations.priority_5_state (ERR_FLEET_NOT_ACTIVE)
          - entities.Fleet.fields.fleet_status
        distinguishing_aspect: "Once Fleet.fleet_status == SUSPENDED, mutating child endpoints under /fleets/{id}/... are rejected with 409 ERR_FLEET_NOT_ACTIVE — the parent state gates the child surface."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Fleet/Truck."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Susp Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-ss"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0205", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/suspend"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "err == ERR_FLEET_NOT_ACTIVE"

      - name: truck_create_with_out_of_range_priority_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Truck.fields.vin
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "VIN must be a 17-character string; a 5-character string is rejected with 400 ERR_INVALID_REQUEST before any state check runs."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One fleet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "TC Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-tc"
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "SHORT", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: case_close_from_open_returns_invalid_state_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.Case.OPEN_to_CLOSED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "A case in OPEN cannot transition directly to CLOSED — close is only valid from PENDING_CLOSE. Calling close on OPEN is a 409 ERR_INVALID_STATE_TRANSITION with no side effects."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Fleet/Truck; case in OPEN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "IT Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-it"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0206", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/close"
              payload: {}
              as: UptimeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "Case.${case_id}.case_status == OPEN"

      - name: work_order_complete_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "WorkOrder can only be COMPLETED from IN_PROGRESS. Calling complete on a DRAFT work order returns 409 ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay; case SCHEDULED with DRAFT work order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "WOIT Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-woit"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0207", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "WOIT Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
