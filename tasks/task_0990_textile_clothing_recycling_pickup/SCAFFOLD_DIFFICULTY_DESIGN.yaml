# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 0990: Textile & Clothing-Recycling Pickup
# 9 rules x 2 instances = 18 instances. Every instance replays from empty-DB
# using only §1.5 endpoints; all ${id} placeholders are bound by captures.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (WeightTicket/DiversionCredit vs Partner).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: credit_projection_provisional_vs_final
        grounds:
          - calculations.projected_credit_cents_rule
          - calculations.diversion_credit_value
          - entities.WeightTicket.fields.projected_credit_cents
          - entities.DiversionCredit.fields.gross_cents
        distinguishing_aspect: |
          Entity domain WeightTicket/DiversionCredit: the provisional variant
          (field-scale weight 40.0 kg, assumed RECYCLE grade, severity NONE,
          uncapped sponsor bonus) yields 2480 cents for the same load whose
          final variant (certified 12.5 kg RESALE) yields 1650 cents — two
          valid algorithms over one collection event, different numbers.
        test_recipe:
          setup:
            - "Zone Z; resident R with one DELIVERED BAG kit"
            - "Pickup P (10 bags, window 2026-05-10T10:00:00Z..12:00:00Z) ROUTED to driver drv-1 on 2026-05-10"
            - "Logical clock never set: reads the fixed default 2026-05-01T00:00:00Z, so the window is in the future"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone DV1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Rita Ray", email: "rita@x.com", address: "1 Main St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
          trigger:
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id, t_proj: $.data.projected_credit_cents }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id, c_proj: $.data.projected_cents }
          assert:
            - "WeightTicket.${id}.projected_credit_cents == 2480   # 40.0*45 + 500 bulk + 180 bonus"
            - "DiversionCredit.${id}.projected_cents == 1650       # 12.5*120 + 0 bulk + 150 bonus"
            - "captured ${id} == 2480 and ${id} == 1650 and the two differ for the identical load"

      - name: partner_score_rolling_vs_decay
        grounds:
          - calculations.partner_quality_scores
          - entities.Partner.fields.routing_score
          - entities.Partner.fields.report_score
        distinguishing_aspect: |
          Entity domain Partner (different from instance 1's credit domain):
          one UPHELD MAJOR finding, read 40 days later — rolling_window variant
          (routing_score) forgets it (100) while decay_weighted variant
          (report_score) still counts it at half-life weight (94.05).
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; partner PT (THRIFT, grades [RESALE, RECYCLE], capacity 1000)"
            - "Pickup collected and certified 12.5 kg RESALE; ticket T routed to PT, PT accepted and completed"
            - "One MAJOR contamination report on T adjudicated UPHELD at logical time 2026-05-01T00:00:00Z (default clock)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone DV2" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Sam Sew", email: "sam@x.com", address: "2 Oak Ave" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /partners"
              payload: { name: "ThriftCo", partner_type: "THRIFT", accepted_grades: ["RESALE", "RECYCLE"], capacity_kg: 1000 }
              as: ZoneOperator
              captures: { pt_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BIN" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/routing-assignments"
              payload: {}
              as: ZoneOperator
              captures: { a_id: $.data.id, a_partner: $.data.partner_id }
            - call: "POST /routing-assignments/${id}/accept"
              payload: {}
              as: PartnerManager
              as_user_id: "${id}"
            - call: "POST /routing-assignments/${id}/complete"
              payload: {}
              as: PartnerManager
              as_user_id: "${id}"
            - call: "POST /weight-tickets/${id}/contamination-reports"
              payload: { severity: "MAJOR", notes: "damp load" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { rep_id: $.data.id }
            - call: "POST /contamination-reports/${id}/adjudicate"
              payload: { outcome: "UPHELD" }
              as: ZoneOperator
          trigger:
            - call: "GET /partners/${id}"
              as: ZoneOperator
              captures: { score_day0: $.data.routing_score, report_day0: $.data.report_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: ZoneOperator
            - call: "GET /partners/${id}"
              as: ZoneOperator
              captures: { score_day40: $.data.routing_score, report_day40: $.data.report_score }
          assert:
            - "${id} == ${id}"
            - "at adjudication day: routing_score == 85 and report_score == 85 (100 - 15)"
            - "40 days later: Partner.routing_score == 100 (finding older than the 30-day rolling window)"
            - "40 days later: Partner.report_score == 94.05 (100 - 15 * 0.5^(40/30) = 94.0473 -> 94.05)"
            - "Partner.status remains ELIGIBLE throughout (score never below 40, MAJOR never quarantines)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes
  # (mode (a) nested-min/tiered/conditional vs mode (b) rounding order).
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: credit_value_fund_capped_sponsor_bonus
        grounds:
          - calculations.diversion_credit_value
          - entities.SponsorFund.fields.available_cents
          - entities.DiversionCredit.fields.gross_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (certified weight, grade tier rate, bulk
          threshold conditional, fund headroom) interacting non-linearly through
          nested min()/max() — the sponsor bonus is capped by fund headroom at
          finalize, so projected (2480, uncapped bonus 180) and final gross
          (2400, bonus capped to 100) diverge for identical ticket data.
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup ROUTED"
            - "Sponsor fund F in zone Z with initial_cents 2400"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone CF1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Amy Ada", email: "amy@x.com", address: "3 Pine Rd" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 2400 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 40.0, grade: "RECYCLE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id, c_proj: $.data.projected_cents }
          trigger:
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
              captures: { c_gross: $.data.gross_cents, c_hold: $.data.has_hold }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { f_held: $.data.held_cents, f_avail: $.data.available_cents }
          assert:
            - "DiversionCredit.${id}.projected_cents == 2480  # 1800 base + 500 bulk + 180 uncapped bonus"
            - "DiversionCredit.${id}.gross_cents == 2400     # bonus capped: min(180, max(0, 2400-1800-500)=100)"
            - "SponsorFund.${id}.held_cents == 2400 and available_cents == 0"
            - "${id} == true; pinned evaluation order (base -> contamination -> bulk -> capped bonus) makes gross well-defined"

      - name: charity_split_per_line_floor_remainder
        grounds:
          - calculations.charity_split_allocation
          - entities.ServiceZone.fields.charity_splits
          - entities.DiversionCredit.fields.charity_allocations
          - entities.DiversionCredit.fields.resident_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order (different mode from instance 1's
          nested-min formula): per-line floor THEN remainder-to-resident is
          pinned; with gross 1629 and splits 33/33 the pinned order yields
          537/537/555, while the rejected round-total order would yield
          1075 to charities and 554 to the resident — a one-cent difference
          that only the pinned order gets right.
        test_recipe:
          setup:
            - "Zone Z with charities CH1 (created first) and CH2, splits [{CH1,33},{CH2,33}] (sum 66 <= 100)"
            - "Fund F initial 100000; resident R with DELIVERED kit; pickup collected, certified 12.34 kg RESALE"
            - "Credit C created and finalized at gross 1629"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone CF2" }
              as: ZoneOperator
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /charities"
              payload: { name: "ClothesAid" }
              as: ZoneOperator
              captures: { ch1: $.data.id }
            - call: "POST /charities"
              payload: { name: "FiberFund" }
              as: ZoneOperator
              captures: { ch2: $.data.id }
            - call: "PUT /service-zones/${id}/charity-split"
              payload: { charity_splits: [{ charity_id: "${id}", pct: 33 }, { charity_id: "${id}", pct: 33 }], expected_zone_version: "${id}" }
              as: ZoneOperator
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 100000 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Bob Bay", email: "bob@x.com", address: "4 Elm St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 4 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 12.34 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.34, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id }
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
          trigger:
            - call: "POST /diversion-credits/${id}/settle"
              payload: {}
              as: ZoneOperator
              captures: { c_allocs: $.data.charity_allocations, c_res: $.data.resident_share_cents }
            - call: "GET /charities/${id}/allocations"
              as: CharityAdmin
              as_user_id: "${id}"
              captures: { ch1_total: $.data.total_received_cents }
          assert:
            - "DiversionCredit.${id}.gross_cents == 1629  # round_half_up(12.34*120)=1481 base + 148 bonus"
            - "charity_allocations == [{charity_id: ${id}, pct: 33, amount_cents: 537}, {charity_id: ${id}, pct: 33, amount_cents: 537}]  # floor(1629*0.33)=537 per line"
            - "resident_share_cents == 555  # 1629 - 1074; remainder goes to the resident beneficiary"
            - "Charity.${id}.total_received_cents == 537 (captured ${id})"
            - "rejected round-total order would give charities 1075 and resident 554 — asserts pin per-line floor"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: cyclic PickupRequest vs branching
  # DiversionCredit — two different entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: pickup_no_show_rebook_cycle
        grounds:
          - state_machines.PickupRequest.ROUTED_to_NO_SHOW
          - state_machines.PickupRequest.NO_SHOW_to_SCHEDULED
          - state_machines.PickupRequest.SCHEDULED_to_ROUTED
        distinguishing_aspect: |
          Cyclic machine on PickupRequest: SCHEDULED -> ROUTED -> NO_SHOW ->
          (rebook) SCHEDULED -> ROUTED -> COLLECTED traverses the cycle edge and
          re-enters SCHEDULED with rebook_count advanced — a pure linear pipeline
          cannot express re-entering SCHEDULED.
        test_recipe:
          setup:
            - "Zone Z; resident R (ACTIVE) with DELIVERED kit; pickup P created for 2026-05-10"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone NL1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Cora Coy", email: "cora@x.com", address: "5 Birch Ln" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 5 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id, p_status0: $.data.status }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
          trigger:
            - call: "POST /pickup-requests/${id}/mark-no-show"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { p_status_ns: $.data.status, p_driver_ns: $.data.driver_id }
            - call: "POST /pickup-requests/${id}/rebook"
              payload: { window_start: "2026-05-11T10:00:00Z", window_end: "2026-05-11T12:00:00Z" }
              as: Resident
              as_user_id: "${id}"
              captures: { p_status_rb: $.data.status, p_rebooks: $.data.rebook_count }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-2", service_date: "2026-05-11" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 30.0 }
              as: Driver
              as_user_id: "drv-2"
              captures: { t_id: $.data.id, t_status: $.data.status }
          assert:
            - "initial status ${id} == SCHEDULED"
            - "after no-show: ${id} == NO_SHOW and driver_id cleared (${id} == null)"
            - "after rebook: ${id} == SCHEDULED and rebook_count == 1 — cycle edge re-entered SCHEDULED"
            - "after re-route to drv-2 and collection by drv-2: ticket ${id} created PROVISIONAL (${id} == PROVISIONAL); GET pickup shows COLLECTED"

      - name: credit_dispute_refinalize_branch_no_double_hold
        grounds:
          - state_machines.DiversionCredit.FINALIZED_to_DISPUTED
          - state_machines.DiversionCredit.DISPUTED_to_FINALIZED
          - entities.DiversionCredit.fields.has_hold
        distinguishing_aspect: |
          Branching fork-join on DiversionCredit (different entity from
          PickupRequest): PROVISIONAL -> FINALIZED -> DISPUTED -> FINALIZED ->
          SETTLED exercises the dispute branch and rejoin; the dispute branch
          retains the fund hold and re-finalization must NOT place a second
          hold (held_cents stays 1650, not 3300).
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE"
            - "Fund F initial 100000; credit C created (projected 1650)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone NL2" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 100000 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Drew Dix", email: "drew@x.com", address: "6 Cedar Ct" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
              captures: { c_st1: $.data.status, c_hold1: $.data.has_hold }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { f_held1: $.data.held_cents }
            - call: "POST /diversion-credits/${id}/dispute"
              payload: { reason: "resident contests certified weight" }
              as: Resident
              as_user_id: "${id}"
              captures: { c_st2: $.data.status, c_hold2: $.data.has_hold }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { f_held2: $.data.held_cents, f_avail2: $.data.available_cents }
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
              captures: { c_st3: $.data.status }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { f_held3: $.data.held_cents }
            - call: "POST /diversion-credits/${id}/settle"
              payload: {}
              as: ZoneOperator
              captures: { c_st4: $.data.status }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { f_held4: $.data.held_cents, f_paid4: $.data.paid_cents, f_avail4: $.data.available_cents }
          assert:
            - "first finalize: ${id} == FINALIZED, has_hold == true, fund held == 1650"
            - "dispute: ${id} == DISPUTED and hold retained (${id} == true, fund held still 1650: ${id} == 1650, available 98350)"
            - "re-finalize from DISPUTED: ${id} == FINALIZED and NO second hold (${id} == 1650, not 3300)"
            - "settle: ${id} == SETTLED; fund held 0, paid 1650, available 98350"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers
  # (adjudicate-UPHELD-SEVERE vs ticket void), each depth >= 3.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: severe_adjudication_ticket_credit_fund_cascade
        grounds:
          - state_machines.ContaminationReport.OPEN_to_ADJUDICATED
          - state_machines.WeightTicket.CERTIFIED_to_QUARANTINED
          - state_machines.DiversionCredit.FINALIZED_to_VOIDED
          - state_machines.Partner.ELIGIBLE_to_QUARANTINED
          - calculations.sponsor_fund_ledger
        distinguishing_aspect: |
          Trigger = POST /contamination-reports/{id}/adjudicate (UPHELD, SEVERE).
          Chain depth 3 by causation, not fan-out: adjudication quarantines the
          ticket (L1); the ticket's quarantine voids its FINALIZED credit (L2);
          the credit's voiding releases the sponsor-fund hold (L3). A parallel
          branch quarantines the partner holding the COMPLETED assignment.
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE (ticket T)"
            - "Partner PT completed the routing assignment for T; fund F (100000) holds credit C (FINALIZED, 1650)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone TC1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 100000 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
            - call: "POST /partners"
              payload: { name: "BrandBack", partner_type: "BRAND", accepted_grades: ["RESALE"], capacity_kg: 1000 }
              as: ZoneOperator
              captures: { pt_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Eli Ebb", email: "eli@x.com", address: "7 Ash Way" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/routing-assignments"
              payload: {}
              as: ZoneOperator
              captures: { a_id: $.data.id }
