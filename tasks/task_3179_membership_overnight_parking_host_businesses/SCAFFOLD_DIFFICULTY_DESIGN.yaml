            - call: "GET /api/hosts/${h_cs}"
              payload: {}
              as: HostOperator
              captures: { h_cs_v1: $.data.version }
            - call: "POST /api/hosts/${h_cs}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_cs_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "ma@x.com", full_name: "Member A", plan_tier: "PLUS", home_state_code: "TX" }
