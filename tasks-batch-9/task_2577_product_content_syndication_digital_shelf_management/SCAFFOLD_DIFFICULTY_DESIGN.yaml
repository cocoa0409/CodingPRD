              payload: { retailer_listing_id: "${lb_id}", content_version_id: "${vb1_id}", slot_count: 6, window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-21T00:00:00Z", expected_retailer_version: "${rb_v}" }
              as: SyndicationOperator
              captures: { jb_id: $.data.id }
            - call: "POST /digital-shelf/syndication-jobs/${jb_id}/transmit"
              payload: {}
              as: SyndicationOperator
            - call: "POST /digital-shelf/syndication-jobs/${jb_id}/retailer-response"
              payload: { outcome: "REJECTED", errors: [ { retailer_error_code: "DESC_LEN", attribute_key: "description", severity: "BLOCKING", message: "description rejected by the retailer feed" } ] }
              as: RetailerIntegration
              as_user_id: "${rb_id}"
            - call: "GET /digital-shelf/syndication-jobs/${jb_id}/rejection-errors"
              payload: {}
              as: SyndicationOperator
              captures: { errb_id: "$.data[0].id" }
          trigger:
            - call: "POST /digital-shelf/rejection-errors/${errb_id}/resolve"
              payload: { resolution_mode: "FIX", resolution_note: "description shortened for the retailer ceiling" }
              as: SyndicationOperator
              captures: { err_state: $.data.state, err_mode: $.data.resolution_mode }
            - call: "GET /digital-shelf/retailer-listings/${lb_id}"
              payload: {}
              as: SyndicationOperator
              captures: { syn_after_fix: $.data.syndication_state, ready_after_fix: $.data.readiness_score, blocking_after_fix: $.data.open_blocking_error_count }
            - call: "GET /digital-shelf/retailers/${rb_id}"
              payload: {}
              as: SyndicationOperator
              captures: { rb_v2: $.data.version }
            - call: "POST /digital-shelf/syndication-jobs/${jb_id}/requeue"
              payload: { slot_count: 6, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", expected_retailer_version: "${rb_v2}" }
              as: SyndicationOperator
              captures: { job_state_2: $.data.state, attempt_2: $.data.attempt_no, fee_2: $.data.service_fee_cents }
          assert:
            - "${err_state} == \"RESOLVED\" and ${err_mode} == \"FIX\""
            - "${syn_after_fix} == \"NOT_SYNDICATED\" and ${blocking_after_fix} == 0 and ${ready_after_fix} == 51.00 — closing the last BLOCKING row lifts the ERROR_HOLD and drops the penalty tier"
            - "${rb_v2} == 3 — Retailer.version advanced on the queue and on the rejection release, not on the RejectionError closure"
            - "${job_state_2} == \"QUEUED\" and ${attempt_2} == 2 and ${fee_2} == 16200"
            - "SyndicationJob.${jb_id}.service_fee_cents == 16200 (recomputed for the 6-hour rush window: subtotal 15000 -> 0.10 discount -> 13500 -> 0.20 rush surcharge 2700), not the 13500 frozen at attempt 1"
            - "SyndicationJob.${jb_id}.transmitted_at is null and responded_at is null — the requeue reset both stamps"
            - "RetailerListing.${lb_id}.syndication_state == \"PENDING\" and readiness_score == 51.00"
            - "Retailer.${rb_id}.feed_slots_reserved == 6 and Retailer.${rb_id}.version == 4"

  - rule_id: transitive_cascade
    instances:
      - name: observation_ingest_cascades_projection_then_alerts_then_product_rollup
        grounds:
          - calculations.listing_shelf_projection
          - state_machines.RetailerListing.shelf_OK_to_shelf_OOS_WATCH
          - calculations.alert_rollup
          - calculations.retailer_readiness_score
          - entities.Product.fields.governance_flag
          - entities.ShelfAlert.fields.assigned_account_team_user_id
        distinguishing_aspect: |
          One observation POST drives four dependent hops in a fixed order: projection writes the
          listing's latest-observation fields, the projected in_stock false moves shelf_state to
          OOS_WATCH, the OOS_WATCH write plus the sub-threshold accuracy raise two ShelfAlerts, and
          those alert rows roll up into Product.open_alert_count and governance_flag. Because
          shelf_state left OK in hop 2, readiness must use the capped accuracy 60.00 and land on
          84.00 rather than the uncapped 88.00.
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1, feed_slot_capacity 10, enhanced_content_requires_approval true and a single REQUIRED requirement row title (weight 40), so D == 40 + IMAGE_WEIGHT 20 == 60"
            - "product SKU-D-1 has one APPROVED HERO_IMAGE asset and revision 1 PINNED on the SimpleMart listing through an APPROVED ChangeRequest, so completeness_score_certified == 100.00, completeness_score_declared == 100.00 and readiness_score == 60.00"
            - "ContentVersion revision 1 has pin_count 1 (the single listing reference), Product.status is ACTIVE and Product.last_pinned_at == 2026-08-10T00:00:00Z"
            - "the listing is syndication_state NOT_SYNDICATED / shelf_state OK with no deployment and no observation; the logical clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rd_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rd_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-D-1", gtin: "00012345678936", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pd_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", account_team_user_id: "acct_simplemart_1" }
              as: ContentAuthor
              captures: { ld_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pd_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/d/hero.jpg" }
              as: ContentAuthor
              captures: { md1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${md1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rd_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pd_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vd1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vd1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", target_content_version_id: "${vd1_id}", rationale: "pin revision 1 on SimpleMart" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crd_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${crd_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pd_v1: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pd_v1}" }
              as: LegalReviewer
              as_user_id: "legal_1"
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pd_v2: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "BRAND", decision: "APPROVED", expected_product_version: "${pd_v2}" }
              as: BrandGovernanceApprover
              as_user_id: "brand_1"
          trigger:
            - call: "POST /digital-shelf/retailer-listings/${ld_id}/observations"
              payload: { observed_at: "2026-08-11T00:00:00Z", in_stock: false, content_accuracy_pct: 70.00, rating_avg: 4.00, rating_count: 120, unauthorized_seller_count: 0, conversion_rate_pct: 2.00, units_sold: 40, search_rank: 3 }
              as: ShelfAdmin
              captures: { obs_id: $.data.id }
          assert:
            - "RetailerListing.${ld_id}.search_rank_latest == 3 and content_accuracy_pct == 70.00 and rating_avg == 4.00 and in_stock == false (hop 1, calculations.listing_shelf_projection)"
            - "RetailerListing.${ld_id}.shelf_state == \"OOS_WATCH\" and syndication_state == \"NOT_SYNDICATED\" (hop 2; the two dimensions never write each other)"
            - "RetailerListing.${ld_id}.readiness_score == 84.00 — 0.60*100.00 + 0.40*min(70.00, ACCURACY_CAP_WHEN_NOT_OK 60.00) == 84.00, not the 88.00 an uncapped accuracy would give"
            - "GET /digital-shelf/shelf-alerts?retailer_listing_id=${ld_id} returns total_count 2 (hop 3): one alert_type OUT_OF_STOCK severity MEDIUM and one alert_type CONTENT_DRIFT severity LOW, both state OPEN with source_observation_id == \"${obs_id}\" and assigned_account_team_user_id == \"acct_simplemart_1\""
            - "Product.${pd_id}.open_alert_count == 2 and governance_flag == \"CONTENT_AT_RISK\" (hop 4; no UNAUTHORIZED_LISTING alert exists so the precedence stops at CONTENT_AT_RISK)"
            - "Product.${pd_id}.shelf_health_index == 0.00 and no HEALTH_DEGRADED ShelfAlert exists — the listing is NOT_SYNDICATED so it never entered the health input set"
            - "Product.${pd_id}.conversion_lift_pct == 0.00 — the single observation sits after last_pinned_at so BASE is empty"
            - "Product.${pd_id}.version == 4 (one increment per review decision in setup, one for this ingest)"

      - name: cr_join_supersedes_version_invalidates_queued_job_and_releases_feed_slots
        grounds:
          - state_machines.ChangeRequest.IN_REVIEW_to_APPROVED
          - state_machines.ContentVersion.PINNED_to_SUPERSEDED
          - state_machines.SyndicationJob.QUEUED_to_INVALIDATED
          - calculations.feed_slot_reservation_ledger
          - calculations.version_pin_reference_ledger
          - state_machines.RetailerListing.syndication_PENDING_to_syndication_NOT_SYNDICATED
        distinguishing_aspect: |
          The join fires a four-hop chain whose last hop is two entities away from the write: pinning
          revision 2 supersedes revision 1, the supersede invalidates the QUEUED job that referenced
          revision 1, and the invalidation releases that job's 6 feed slots so
          Retailer.feed_slots_reserved returns to 0. Stopping the cascade at the supersede would leave
          reserved at 6 and the job at QUEUED.
        test_recipe:
          setup:
            - "Retailer BigBox is ACTIVE with min_image_count 4, feed_slot_capacity 10, max_concurrent_feed_windows 2 and three REQUIRED requirement rows (title weight 40, description weight 30, brand weight 10), so the completeness denominator D == 80 + IMAGE_WEIGHT 20 == 100"
            - "product SKU-B-1 has revision 1 PINNED on the BigBox listing with title and description present, brand ABSENT and image_count 4, and exactly three APPROVED image assets against min_image_count 4"
            - "therefore RetailerListing.completeness_score_certified == 85.00, completeness_score_declared == 90.00, readiness_score == 51.00, syndication_state == NOT_SYNDICATED, shelf_state == OK"
            - "Retailer.feed_slots_reserved == 0, Retailer.version == 1 and the logical clock stands at 2026-08-10T00:00:00Z"
            - "one SyndicationJob of 6 slots is QUEUED against revision 1 for the window 2026-08-20T00:00:00Z..2026-08-21T00:00:00Z, so Retailer.feed_slots_reserved == 6, Retailer.version == 2 and the listing is syndication_state PENDING"
            - "a second revision (revision 2, supersedes revision 1) carries title, description AND brand with image_count 4, and a second ChangeRequest targeting it has been submitted, so revision 2 is IN_REVIEW with both tracks PENDING"
            - "revision 1 is still PINNED with pin_count 1 and Product.version == 3"
