              payload: { full_name: "Dee Posit", email: "dee@x.com", date_of_birth: "1981-08-19" }
              as: Renter
              captures: { r_id: $.data.id }
            - call: "POST /renters/${r_id}/certificates"
              payload: { cert_number: "C-1100", issuing_authority: "NASBLA", issued_on: "2026-01-15", expires_on: "2027-06-30" }
              as: Renter
              as_user_id: "${r_id}"
              captures: { c_id: $.data.id }
            - call: "POST /certificates/${c_id}/decision"
              payload: { decision: "VERIFY" }
              as: DockStaff
            - call: "POST /bookings"
              payload: { vessel_id: "${v_id}", renter_id: "${r_id}", start_date: "2026-08-10", end_date: "2026-08-15", party_size: 2 }
              as: Renter
              as_user_id: "${r_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /geo-zones"
              payload: { zone_code: "ZP-GUNSIGHT", name: "Gunsight Bay", max_vessels_per_night: 5, allowed_size_classes: ["STANDARD_44"] }
              as: FleetManager
              captures: { z_id: $.data.id }
            - call: "PUT /bookings/${b_id}/itinerary"
              payload: { waypoints: [ { zone_id: "${z_id}", night_date: "2026-08-10" } ] }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "SAFETY_BRIEF" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "DOCKING" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "ANCHORING" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "GENERATOR_OPS" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/countersign"
              payload: { approved: true }
              as: DockStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: FleetManager
            - call: "POST /bookings/${b_id}/checkout"
              payload: { fuel_gauge_percent: 80, pump_out_done: true }
              as: DockStaff
            - call: "POST /bookings/${b_id}/return"
              payload: { fuel_gauge_percent: 60, pump_out_done: false, actual_return_at: "2026-08-15T12:00:00Z" }
              as: DockStaff
            - call: "GET /bookings/${b_id}/cleaning-turns"
              payload: {}
              as: DockStaff
              captures: { t_id: "$.data[0].id" }
            - call: "POST /cleaning-turns/${t_id}/inspect"
              payload: { passed: true }
              as: DockStaff
          trigger:
            - call: "POST /bookings/${b_id}/settle"
              payload: {}
              as: DockStaff
              captures: { held: $.data.deposit_held_cents, applied: $.data.deposit_applied_cents, released: $.data.deposit_released_cents, dep_status: $.data.deposit_status, final: $.data.final_settlement_cents }
          assert:
            - "Booking.${b_id}.deposit_held_cents == 200000 (captured at confirm)"
            - "final_settlement_cents == 78000 (fuel 40.0 gal x 700 = 28000 + pump-out 15000 + cleaning 25000 + late 2h x 5000 = 10000)"
            - "deposit_applied_cents == 78000 and deposit_released_cents == 122000"
            - "INVARIANT: deposit_applied_cents + deposit_released_cents == deposit_held_cents (78000 + 122000 == 200000)"
            - "deposit_status == PARTIALLY_APPLIED; settlement_status == FINALIZED; status == CLOSED"

      - name: vessel_night_partition_survives_create_cancel
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - validations[priority=12]
          - calculations.cancellation_refund
          - concurrency_rules[booking-cancel-stale-version]
        distinguishing_aspect: |
          Conserved quantity is the per-vessel per-date night partition: the forward action (confirm
          occupies 2026-09-01..2026-09-04) paired with the compensating action (cancel) restores the
          partition exactly, proven by an identical stay being creatable afterwards with no
          ERR_VESSEL_DATE_CONFLICT. Inventory conservation, unlike the sibling's money conservation.
        test_recipe:
          setup:
            - "STANDARD_44 vessel with SHOULDER rate (47000); qualified renter; booking N CONFIRMED 2026-09-01 -> 2026-09-05 (quoted 188000)"
            - "Clock at default 2026-08-01 (31 days before start -> 90% tier)"
          setup_api_calls:
            - call: "POST /vessels"
              payload: { name: "Standard Sixteen", size_class: "STANDARD_44", berth_count: 6, home_marina: "Bullfrog", fuel_tank_capacity_gallons: 200 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /season-rates"
              payload: { size_class: "STANDARD_44", season: "SHOULDER", start_date: "2026-09-01", end_date: "2026-10-31", nightly_rate_cents: 47000, weekly_discount_pct: 10 }
              as: FleetManager
            - call: "POST /renters"
              payload: { full_name: "Nia Nights", email: "nia@x.com", date_of_birth: "1989-03-15" }
              as: Renter
              captures: { r_id: $.data.id }
            - call: "POST /renters/${r_id}/certificates"
              payload: { cert_number: "C-1200", issuing_authority: "STATE", issued_on: "2026-01-15", expires_on: "2027-06-30" }
              as: Renter
              as_user_id: "${r_id}"
              captures: { c_id: $.data.id }
            - call: "POST /certificates/${c_id}/decision"
              payload: { decision: "VERIFY" }
              as: DockStaff
            - call: "POST /bookings"
              payload: { vessel_id: "${v_id}", renter_id: "${r_id}", start_date: "2026-09-01", end_date: "2026-09-05", party_size: 2 }
              as: Renter
              as_user_id: "${r_id}"
              captures: { n_id: $.data.id }
            - call: "POST /bookings/${n_id}/confirm"
              payload: {}
              as: Renter
              as_user_id: "${r_id}"
              captures: { n_v: $.data.version }
          trigger:
            - call: "POST /bookings/${n_id}/cancel"
              payload: { expected_booking_version: "${n_v}" }
              as: Renter
              as_user_id: "${r_id}"
              captures: { n_status: $.data.status, n_refund: $.data.refund_issued_cents }
            - call: "POST /bookings"
              payload: { vessel_id: "${v_id}", renter_id: "${r_id}", start_date: "2026-09-01", end_date: "2026-09-05", party_size: 2 }
              as: Renter
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id, o_status: $.data.status }
          assert:
            - "Booking.${n_id}.status == CANCELLED and refund_issued_cents == 169200 (188000 x 90% at 31 days before start)"
            - "Booking.${o_id} created 201 with status == HELD over the identical interval 2026-09-01 -> 2026-09-05"
            - "INVARIANT: create + cancel conserves vessel-night availability — no night in [2026-09-01, 2026-09-05) remains occupied by the CANCELLED booking (CANCELLED is outside the blocking set)"
