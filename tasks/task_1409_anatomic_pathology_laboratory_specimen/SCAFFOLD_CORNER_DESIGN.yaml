            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr O2", subspecialties: ["GI"] }, as: LabAdmin, captures: { p2: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr O3", subspecialties: ["GI"] }, as: LabAdmin, captures: { p3: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-CL1", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin, captures: { cv: $.data.version } }
            - { call: "POST /pathology/cases/${c1}/reassign", payload: { pathologist_id: "${p2}", expected_case_version: "${cv}" }, as: LabAdmin }
          trigger:
            - { call: "POST /pathology/cases/${c1}/reassign", payload: { pathologist_id: "${p3}", expected_case_version: "${cv}" }, as: LabAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_CASE_VERSION (http 412): the first reassign bumped Case.version past the replayed ${cv}"
            - "Case.${c1}.assigned_pathologist_id == ${p2} (the stale request changed nothing)"
      - name: occ_stale_reflex_rule_update_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reflex-rule-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on ReflexRule.version: a successful PUT advances the rule version, and a replayed PUT with the previously observed expected_reflex_rule_version fails with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["one ACTIVE reflex rule; its version ${rv} captured before a first successful PUT"]
          setup_api_calls:
            - { call: "POST /pathology/reflex-rules", payload: { name: "R", trigger_stain_type: "HER2_IHC", trigger_result: "POSITIVE", followup_stain_type: "KI67", priority: 1 }, as: LabAdmin, captures: { rr: $.data.id, rv: $.data.version } }
            - { call: "PUT /pathology/reflex-rules/${rr}", payload: { expected_reflex_rule_version: "${rv}", priority: 5 }, as: LabAdmin }
          trigger:
            - { call: "PUT /pathology/reflex-rules/${rr}", payload: { expected_reflex_rule_version: "${rv}", priority: 9 }, as: LabAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION (http 412)"
            - "ReflexRule.${rr}.priority == 5 (the stale PUT changed nothing) and version advanced exactly once from the successful PUT"
      - name: cascade_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.StainOrder.IN_PROGRESS_to_RESULTED
        excluded_because:
          difficulty_instance: stain_result_reflex_complexity_cascade
          rationale: "The 4-hop cascade (result -> reflex child -> complexity -> deadline) is asserted end-to-end in the named §1.8 instance."
      - name: scheduled_sweeps_covered_in_state_machines_section
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /pathology/_clock/set_current_utc]
        excluded_because:
          difficulty_instance: tat_breach_strict_greater_than_deadline
          rationale: "Clock-driven behavior is exercised by consultation_expiry_sweep_strict_boundary and release_overdue_sweep_and_late_return in this file, and the clock boundary semantics by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_visibility_of_mutation_and_derived_fields
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.case_complexity_classification
        distinguishing_aspect: "Immediate consistency: the block-creation response already shows status CREATED and tissue_remaining_pct 100.0, and a GET on the parent case issued right after shows complexity_score 2.0 (BIOPSY base 1 + one block)."
        test_recipe:
          setup: ["WORKUP case with one grossed BIOPSY specimen"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-CM1", full_name: "Cons One", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-CM1", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
          trigger:
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id, bstatus: $.data.status } }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
          assert:
            - "creation response: Block.${b1}.status == CREATED and tissue_remaining_pct == 100.0 in the same response body"
            - "immediately after: Case.${c1}.complexity_score == 2.0 and complexity_class == SIMPLE; Specimen.${sp1}.status == PROCESSING"
