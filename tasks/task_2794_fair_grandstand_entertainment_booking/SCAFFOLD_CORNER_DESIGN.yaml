              payload: { expected_show_booking_version: "${bkv_ab}", seating_type: "RESERVED", tier_name: "GOLD", face_price_cents: 6295, allotment_seats: 2000, bundled_with_gate_admission: false, facility_fee_cents: 400 }
              as: BoxOfficeManager
