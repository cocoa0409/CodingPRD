# =============================================================================
# 1.9 Scaffold Corner Design - Coverage Index for Non-Difficulty Tests
#
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml. Section names and
# claim_type values come from references/claim-extraction-guide.md; nothing is
# invented here. Corners already asserted by an instance in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no
# test_recipe.
#
# Shared fixture vocabulary (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml so the
# two files can share pytest fixtures):
#   PlanYear 2027 - open enrollment [2026-10-15T00:00:00Z, 2026-11-15T00:00:00Z),
#     coverage_start 2027-01-01T00:00:00Z, hra_credit_pre_medicare_cents 185000,
#     hra_credit_medicare_cents 209500, carryover_cap_pct 0.5,
#     premium_grace_period_days 31, reinstatement_window_days 60,
#     notice_lead_days 60, discount_rate_bps 500,
#     assumed_annual_subsidy_cents 240000, assumed_payment_years 20
#   PlanOption PRE65-CORE  - PRE_MEDICARE_GROUP,  monthly_premium_cents 74500
#   PlanOption MED-WRAP    - MEDICARE_GROUP_WRAP, monthly_premium_cents 32900,
#     requires_medicare_part_b true, subsidy_vehicle EGWP
#   PlanOption EXCH-HRA    - INDIVIDUAL_EXCHANGE_HRA, monthly_premium_cents 0
#   Retiree R1 "Rosa Alvarez"      birth 1963-06-01, hire 1990-06-01,
#     retirement 2026-12-31, credited_service_months 150 -> GRANDFATHERED_A,
#     points 75, ELIGIBLE
#   Retiree R2 "Walter Nkemelu"    birth 1958-03-01, hire 1988-09-01,
#     retirement 2023-03-31, credited_service_months 402, MEDICARE_ENROLLED
#     -> GRANDFATHERED_A, points 98, ELIGIBLE
#   Retiree R3 "Priya Raghunathan" birth 1963-06-01, hire 1990-06-01,
#     retirement 2026-12-31, credited_service_months 143 -> GRANDFATHERED_A,
#     points 74, INELIGIBLE
#   Retiree R4 "Bertrand Okonkwo"  birth 1961-01-01, hire 1990-06-01,
#     retirement 2026-12-31, credited_service_months 402 -> GRANDFATHERED_A,
#     points 98, ELIGIBLE
#   Retiree R5 "Ingrid Sorenson"   birth 1962-04-01, hire 1998-04-01,
#     retirement 2026-12-31, credited_service_months 344 -> TRANSITION_B,
#     age 64, service_years 28, ELIGIBLE under AGE_60_SERVICE_15
#   Retiree R6 "Tomas Ferreira"    birth 1962-04-01, hire 2008-04-01,
#     retirement 2026-12-31, credited_service_months 224 -> STANDARD_C,
#     age 64 (< 65), service_years 18 -> INELIGIBLE under AGE_65_SERVICE_10
#
# Segregation-of-duties user ids (opaque roles): admin-01, analyst-01,
# analyst-02, counselor-01, counselor-02, hra-admin-01, hra-admin-02,
# billing-01, actuary-01, compliance-01.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: plan_year_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.PlanYear
          - endpoints["POST /retiree-benefits/plan-years"]
          - response_envelope
        distinguishing_aspect: |
          A POST carrying every required input plus the three optional day-count
          knobs returns 201 with the full PlanYear projection: the ten supplied
          values echoed, status seeded to DRAFT, the four valuation aggregates
          seeded to 0, liability_valued_at null, and the four common_fields
          present. The success envelope must carry meta.api_request_id,
          meta.api_request_timestamp, response_type "object" and data.
        test_recipe:
          setup:
            - "Empty database. Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20, premium_grace_period_days: 31, reinstatement_window_days: 60, notice_lead_days: 60 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are present"
            - "data.year == 2027 and data.status == DRAFT"
            - "data.hra_credit_pre_medicare_cents == 185000 and data.hra_credit_medicare_cents == 209500"
            - "data.carryover_cap_pct == 0.5"
            - "data.premium_grace_period_days == 31, data.reinstatement_window_days == 60, data.notice_lead_days == 60"
            - "data.measured_retiree_count == 0, data.epbo_total_cents == 0, data.apbo_total_cents == 0, data.service_cost_total_cents == 0"
            - "data.liability_method is null and data.liability_valued_at is null"
            - "data.id, data.created_at, data.updated_at are present and data.version == 1"

      - name: retiree_retrieval_returns_stored_row_with_derived_group
        claim_type: Retrieval
        grounds:
          - entities.Retiree
          - endpoints["GET /retiree-benefits/retirees/{retiree_id}"]
        distinguishing_aspect: |
          GET by id returns the row exactly as stored, including the two
          derived fields grandfathered_group and eligibility_points, and the
          defaults that the creation call never supplied. It is the read path
          for a resource created through a different endpoint, so a handler that
          re-derives instead of reading would be visible in eligibility_points,
          which is still 0 before any determination exists.
        test_recipe:
          setup:
            - "One Retiree R1 created with only the five required inputs."
            - "No EligibilityDetermination exists for R1."
          setup_api_calls:
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "GET /retiree-benefits/retirees/${r1_id}"
              payload: {}
              as: EnrollmentCounselor
              as_user_id: "counselor-01"
          assert:
            - "HTTP status is 200 and data.id == ${r1_id}"
            - "data.full_name == Rosa Alvarez and data.credited_service_months == 150"
            - "data.grandfathered_group == GRANDFATHERED_A, derived from hire_date 1990-06-01 preceding GRANDFATHER_CUTOFF_A 1993-01-01"
            - "data.eligibility_status == UNDETERMINED and data.eligibility_points == 0"
            - "data.determination_sequence == 0"
            - "data.version == 1"

      - name: retirees_listing_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /retiree-benefits/retirees"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three retirees exist; limit 2 offset 0 must return 2 rows with
          total_count 3 and has_more true, and limit 2 offset 2 must return the
          remaining 1 row with total_count 3 and has_more false. total_count
          counts the whole filtered set, not the page, so an implementation that
          returns len(page) fails the first call.
        test_recipe:
          setup:
            - "Exactly three Retiree rows exist: R1, R3 and R4, created in that order."
          setup_api_calls:
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id }
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Priya Raghunathan", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 143 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r3_id: $.data.id }
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Bertrand Okonkwo", birth_date: "1961-01-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 402 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r4_id: $.data.id }
          trigger:
            - call: "GET /retiree-benefits/retirees"
              payload: { limit: 2, offset: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "GET /retiree-benefits/retirees"
              payload: { limit: 2, offset: 2 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
          assert:
            - "PAGE 1: HTTP 200, response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "PAGE 1: the two rows are ${r1_id} then ${r3_id} in created_at ASC order"
            - "PAGE 2: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "PAGE 2: the single row is ${r4_id}"
            - "No retiree appears on both pages"

      - name: plan_option_not_found_for_unknown_id
        claim_type: Not Found
        grounds:
          - errors.ERR_PLAN_OPTION_NOT_FOUND
          - validations[priority=5]
          - endpoints["GET /retiree-benefits/plan-options/{plan_option_id}"]
        distinguishing_aspect: |
          A syntactically valid but unused UUID must produce the entity-specific
          404 ERR_PLAN_OPTION_NOT_FOUND, not a generic 404 and not
          ERR_INVALID_REQUEST. The database is non-empty (a PlanYear exists), so
          a handler that returns 404 for everything cannot be told apart by an
          empty-DB test.
        test_recipe:
          setup:
            - "One PlanYear exists in DRAFT so the database is non-empty."
            - "No PlanOption row exists at all."
          setup_api_calls:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "GET /retiree-benefits/plan-options/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "data.error_id == ERR_PLAN_OPTION_NOT_FOUND"
            - "response_type == error"
            - "The existing PlanYear ${py_id} is unaffected"

      - name: plan_year_creation_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=12]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /retiree-benefits/plan-years"]
        distinguishing_aspect: |
          carryover_cap_pct has source input and no default, so omitting it must
          raise ERR_INVALID_REQUEST (400) rather than silently defaulting to 0
          or null. The omitted field is a fraction rather than an id, so a
          handler that only null-checks the obvious foreign keys still fails.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /retiree-benefits/plan-years returns total_count == 0, so nothing was persisted"

      - name: plan_year_day_count_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.PlanYear.fields.premium_grace_period_days
          - entities.PlanYear.fields.reinstatement_window_days
          - entities.PlanYear.fields.notice_lead_days
          - entities.Retiree.fields.other_group_coverage_employer_size
        distinguishing_aspect: |
          The three optional day-count knobs carry declared defaults 31, 60 and
          60, and Retiree carries defaults 0 / false / false for the
          other-coverage attributes. Omitting all of them must materialise those
          exact declared values rather than null, because downstream arithmetic
          (grace period, reinstatement deadline, notice lead time, MSP employer
          size comparison) reads them directly.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id }
          assert:
            - "PlanYear.${py_id}.premium_grace_period_days == 31"
            - "PlanYear.${py_id}.reinstatement_window_days == 60"
            - "PlanYear.${py_id}.notice_lead_days == 60"
            - "Retiree.${r1_id}.medicare_status == PRE_MEDICARE"
            - "Retiree.${r1_id}.other_group_coverage_employer_size == 0"
            - "Retiree.${r1_id}.active_employment_flag == false and esrd_flag == false and disability_entitlement_flag == false"
            - "None of these fields is null"

      - name: retiree_grandfathered_group_input_ignored_and_recomputed
        claim_type: Computed Fields
        grounds:
          - entities.Retiree.fields.grandfathered_group
          - entities.Retiree.fields.eligibility_points
          - calculations.retiree_grandfather_group_assignment
        distinguishing_aspect: |
          grandfathered_group has source computed and is not in the creation
          endpoint's declared input, so a client attempt to force
          STANDARD_C must be ignored and the value derived from hire_date must
          win. hire_date 1990-06-01 precedes GRANDFATHER_CUTOFF_A, so the stored
          group is GRANDFATHERED_A regardless of what the body says.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150, grandfathered_group: "STANDARD_C", eligibility_points: 999 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id }
          assert:
            - "data.grandfathered_group == GRANDFATHERED_A, not STANDARD_C"
            - "data.eligibility_points == 0, not 999"
            - "data.eligibility_status == UNDETERMINED"
            - "GET /retiree-benefits/retirees/${r1_id} confirms the same values are persisted, not just echoed"

      - name: hra_account_system_fields_generated_server_side
        claim_type: System Fields
        grounds:
          - entities.HraAccount.common_fields
          - entities.HraAccount.fields.status
          - endpoints["POST /retiree-benefits/hra-accounts"]
        distinguishing_aspect: |
          id, created_at, updated_at, version and status are all system-sourced
          on HraAccount. The client supplies only retiree_id, plan_year_id and
          covered_months, so id must be a server-generated identifier distinct
          from any input, version must start at 1, created_at and updated_at
          must equal the logical clock 2026-11-01T00:00:00Z rather than wall
          time, and status must be OPEN.
        test_recipe:
          setup:
            - "PlanYear 2027 in status OPEN."
            - "Retiree R1 with a CERTIFIED ELIGIBLE determination for 2027."
            - "Logical clock at 2026-11-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r1_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det1_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", covered_months: 12 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { hra1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.id is a server-generated identifier and is not equal to ${r1_id} or ${py_id}"
            - "data.version == 1"
            - "data.created_at == 2026-11-01T00:00:00.000Z and data.updated_at == 2026-11-01T00:00:00.000Z, the logical clock"
            - "data.status == OPEN and data.closed_at is null"
            - "data.pending_hold_cents == 0, substantiated_paid_cents == 0, premium_offset_cents == 0, forfeited_cents == 0"
            - "data.carryover_in_cents == 0 because prior_year_account_id was omitted"

      - name: plan_option_invalid_coverage_class_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.PlanOption.fields.coverage_class
          - validations[priority=12]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          coverage_class is an enum constrained to three members. An undeclared
          member must raise ERR_INVALID_REQUEST (400), and so must a negative
          money value and an interval whose start is not before its end - three
          distinct type-constraint shapes behind one error_id, all of which the
          scaffold folds into priority 12.
        test_recipe:
          setup:
            - "One PlanYear 2027 exists in DRAFT."
          setup_api_calls:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py_id}", plan_code: "BAD-CLASS", coverage_class: "CATASTROPHIC_ONLY", monthly_premium_cents: 74500, requires_medicare_part_b: false, allowed_grandfather_groups: ["GRANDFATHERED_A"], subsidy_vehicle: "NONE", rx_gross_value_bps: 0, rx_net_value_bps: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_enum: $.data.error_id }
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py_id}", plan_code: "NEG-MONEY", coverage_class: "PRE_MEDICARE_GROUP", monthly_premium_cents: -1, requires_medicare_part_b: false, allowed_grandfather_groups: ["GRANDFATHERED_A"], subsidy_vehicle: "NONE", rx_gross_value_bps: 0, rx_net_value_bps: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_money: $.data.error_id }
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2028, open_enrollment_start: "2027-11-15T00:00:00Z", open_enrollment_end: "2027-10-15T00:00:00Z", coverage_start: "2028-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_interval: $.data.error_id }
          assert:
            - "UNDECLARED ENUM: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "NEGATIVE MONEY: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "INVERTED INTERVAL: HTTP 400 with data.error_id == ERR_INVALID_REQUEST, because open_enrollment_start is after open_enrollment_end"
            - "GET /retiree-benefits/plan-options?plan_year_id=${py_id} returns total_count == 0"
            - "GET /retiree-benefits/plan-years returns total_count == 1, so the 2028 row was never created"

      - name: election_event_unknown_retiree_foreign_key_not_found
        claim_type: foreign_key_references_validated
        grounds:
          - complexity_profile.entity_topology
          - entities.ElectionEvent.fields.retiree_id
          - errors.ERR_RETIREE_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: |
          The topology is flat, so every cross-entity link is a validated
          foreign key in the body rather than a path segment. An ElectionEvent
          body whose plan_year_id and requested_plan_option_id both resolve but
          whose retiree_id does not must fail with ERR_RETIREE_NOT_FOUND (404)
          and must not fall through to any business rule - existence at
          priority 4 precedes every state and business check.
        test_recipe:
          setup:
            - "PlanYear 2027 in status OPEN and PlanOption PRE65-CORE in status ACTIVE."
            - "Logical clock at 2026-10-20T00:00:00Z, inside the open enrollment window."
            - "No Retiree row exists."
          setup_api_calls:
