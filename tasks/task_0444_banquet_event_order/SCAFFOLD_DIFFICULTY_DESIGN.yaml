              as: SalesManager
              captures: { booking_a: $.data.id }
            - call: "POST /events/${event_a}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_a}/bookings/${booking_a}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events"
              payload: { account_name: "Iota B", event_date: "2027-04-01", setup_style: "ROUNDS", expected_attendance: 100 }
              as: SalesManager
              captures: { event_b: $.data.id, evb_v0: $.data.version }
            - call: "POST /events/${event_b}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-04-01T21:00:00Z", end_utc: "2027-04-01T23:00:00Z", expected_event_version: "${evb_v0}" }
