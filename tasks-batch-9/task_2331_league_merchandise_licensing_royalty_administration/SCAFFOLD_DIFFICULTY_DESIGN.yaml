              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_m}"
              as: LeagueLicensingManager
              captures: { lic_m_v: $.data.version }
            - call: "POST /licensing/licensees/${lic_m}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: true, expected_licensee_version: "${lic_m_v}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_m: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_m}/status"
