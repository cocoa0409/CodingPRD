            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2035-07-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/leases/${lease}/expiration-plans", as: GSALeasingOfficer, captures: { plan: $.data.id } }
            - { call: "POST /leasing/expiration-plans/${plan}/select-option", payload: { option: "SUCCEEDING_LEASE", succeeding_shell_rate: 3200, succeeding_operating_rate: 950, succeeding_term_years: 10, relocation_move_cost_cents: 50000000, relocation_downtime_cost_cents: 0, market_shell_rate: 3300, market_operating_rate: 900, construction_cost_cents: 5000000000, construction_operating_rate: 700 }, as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/expiration-plans/${plan}/execute", as: GSALeasingOfficer, captures: { new_lease: $.data.outcome_lease_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2037-01-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "GET /leasing/leases/${lease}", as: GSAAdmin, captures: { old_status: $.data.status } }
            - { call: "GET /leasing/leases", payload: { succeeds_lease_id: "${lease}" }, as: GSAAdmin, captures: { succ_id: "$.data[0].id" } }
          assert:
            - "Execute: plan status EXECUTED; ${new_lease} is non-null and ${succ_id} == ${new_lease} (self-referential link via succeeds_lease_id)"
            - "Old lease ${lease}: executed_option == SUCCEEDING_LEASE; after the sweep ${old_status} == SUCCEEDED (not EXPIRED)"
            - "Successor lease: status == AWARDED, building_id == ${bld}, shell_rate_per_sf_yr_cents == 3200, term_months == 120"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_security_level_insufficient_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SECURITY_LEVEL_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: offer_select_security_gate_beats_offer_expiry
          rationale: "Asserted as the winning error of the safety-vs-temporal priority instance."
      - name: error_building_capacity_exceeded_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUILDING_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: owned_building_aggregate_capacity_overlapping_oas
          rationale: "Asserted as the rejection of the 25,000-sf OA in the aggregate-capacity instance."
      - name: error_alteration_window_conflict_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALTERATION_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: alteration_work_windows_buffer_exclusion
          rationale: "Asserted as the rejection of the 10-day-gap estimate in the buffer-semantics instance."
      - name: error_lease_not_commenced_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEASE_NOT_COMMENCED]"]
        excluded_because:
          difficulty_instance: oa_activation_gated_on_lease_commencement
          rationale: "Asserted as the failure of the first activate in the OA->Lease dependency instance."
      - name: error_oa_not_active_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_OA_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: alteration_lifecycle_gated_on_oa_active
          rationale: "Asserted as the failure of alteration create on a DRAFT OA in the Alteration->OA dependency instance."
      - name: error_invalid_state_transition_and_overpayment_triggers
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE_TRANSITION]", "errors[ERR_PAYMENT_EXCEEDS_BALANCE]"]
        excluded_because:
          difficulty_instance: bill_pay_state_lockdown_beats_overpayment_fiscal
          rationale: "Both errors' polarity is asserted by the priority instance; ERR_INVALID_STATE_TRANSITION is additionally asserted by many invalid_transition corners."
      - name: error_requirement_not_soliciting_on_select_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUIREMENT_NOT_SOLICITING]", "state_machines.LeaseOffer.UNDER_EVALUATION_to_SELECTED"]
        distinguishing_aspect: "Select after the requirement has already been awarded to another offer is impossible (sibling is REJECTED first); the reachable trigger is select while the requirement is still VALIDATED — but offer creation is gated on SOLICITING, so the reachable path is: offer created during SOLICITING, a sibling gets selected (requirement -> AWARDED, this offer -> REJECTED), then select on the REJECTED offer fails as an invalid transition. ERR_REQUIREMENT_NOT_SOLICITING on CREATE is covered by offer_create_before_solicitation_rejected."
        test_recipe:
          setup: ["requirement SOLICITING; two offers UNDER_EVALUATION"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-373", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Riverside Annex", address: "200 River Rd", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off1: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld2}", lessor_name: "River Properties Inc", shell_rate_per_sf_yr_cents: 3100, operating_rate_per_sf_yr_cents: 880, base_year_tax_per_sf_yr_cents: 410, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 4500, free_rent_months: 2, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off2: $.data.id } }
            - { call: "POST /leasing/offers/${off1}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off2}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off1}/select", as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/offers/${off2}/select", as: GSALeasingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION (REJECTED is terminal; the solicitation gate is unreachable at this point, which is itself the documented precedence)"

