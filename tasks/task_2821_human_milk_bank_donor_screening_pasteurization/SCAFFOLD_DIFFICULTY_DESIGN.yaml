        grounds:
          - validations[priority=55]
          - validations[priority=81]
          - errors.ERR_LOT_EXPIRED
          - errors.ERR_SUBSIDY_CAP_EXCEEDED
          - calculations.lot_expiration_date
          - calculations.dispense_fee_allocation
          - entities.SubsidyProgram.fields.annual_cap_cents
        distinguishing_aspect: |
          A different category pair — business_temporal (priority 55) versus business_fiscal
          (priority 81) — and a different HTTP-status pair (409 must win over 402). The chosen
          lot expired on 2026-08-20 while the clock reads 2026-08-25, and the subsidy program
          has only 1000 cents of headroom against an uncapped subsidy of 1440. The response must
          be ERR_LOT_EXPIRED with HTTP 409; returning ERR_SUBSIDY_CAP_EXCEEDED with 402 tells the
          pharmacist to find more money instead of discarding expired human milk.
