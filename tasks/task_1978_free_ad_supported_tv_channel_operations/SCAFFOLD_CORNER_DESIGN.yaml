        test_recipe:
          setup:
            - "Channel ch (600s); loop lp 2026-09-01 tiled (entry ct570 + 30s break br), VALIDATED"
            - "Campaigns lo (cpm 400) with creative cr_lo and hi (cpm 600) with creative cr_hi, both ACTIVE, categories IAB-7 and IAB-8"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch RK", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 570", content_type: "MOVIE", runtime_seconds: 570, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
