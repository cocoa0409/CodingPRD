# =============================================================================
# task_0406_ambulance_ems_billing — §1.8 Scaffold Difficulty Design
# Test Targeting Index — 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves to SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls
# chain drives empty-DB -> the asserted state using only §1.5 endpoints. All
# formula-derived asserts are pre-computed literals (see inline notes).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: adjudicated_allowed_payer_reported_vs_fee_schedule
        grounds:
          - calculations.adjudicated_allowed
          - entities.Claim.fields.allowed_amount_cents
          - state_machines.Claim.SUBMITTED_to_PAID
        distinguishing_aspect: "On the Claim adjudication domain, a remittance that supplies reported_allowed_cents uses it verbatim (variant payer_reported_allowed) while a remittance with null reported_allowed_cents derives allowed from the fee schedule (variant fee_schedule_derived_allowed); identical claims diverge — 50000 reported vs 50600 derived for the same ALS1-emergency 12-mile Medicare claim."
        test_recipe:
          setup:
            - "Agency (not No-Surprises) ACTIVE; Medicare PayerPlan ACTIVE; patient with Medicare primary coverage; two transports both ALS1-emergency 12.0mi non-rural, both fully documented, each with a SUBMITTED primary Medicare claim (billed 101000 each)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Metro EMS", npi: "1234567890", state_code: "TX", base_state_is_no_surprises: false, charity_fpl_threshold_pct: 200 }
              as: BillingAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${agency_id}", full_name: "Dee Patcher", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp_id: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${agency_id}", full_name: "Cody Coder", role: "Coder" }
              as: BillingAdmin
              captures: { coder_id: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${agency_id}", full_name: "Cara Compliance", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${agency_id}", full_name: "Bill Biller", role: "Biller" }
              as: BillingAdmin
              captures: { biller_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Medicare Part B", payer_type: "MEDICARE", allows_balance_billing: false }
              as: BillingAdmin
              captures: { medicare_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat One", date_of_birth: "1950-01-01", coverages: [ { payer_plan_id: "${medicare_id}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${agency_id}", patient_id: "${patient_id}", run_number: "RUN-A", dispatch_iso: "2026-06-01T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp_id}"
              captures: { t_a: $.data.id }
            - call: "POST /transports/${t_a}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder_id}"
            - call: "POST /transports/${t_a}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder_id}"
            - call: "POST /transports/${t_a}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp_id}"
            - call: "GET /transports/${t_a}"
              payload: {}
              as: Biller
              as_user_id: "${biller_id}"
              captures: { ta_v: $.data.version }
            - call: "POST /transports/${t_a}/claims"
              payload: { payer_plan_id: "${medicare_id}", expected_transport_version: "${ta_v}" }
              as: Biller
              as_user_id: "${biller_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${agency_id}", patient_id: "${patient_id}", run_number: "RUN-B", dispatch_iso: "2026-06-01T09:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp_id}"
              captures: { t_b: $.data.id }
            - call: "POST /transports/${t_b}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder_id}"
            - call: "POST /transports/${t_b}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder_id}"
            - call: "POST /transports/${t_b}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp_id}"
            - call: "GET /transports/${t_b}"
              payload: {}
              as: Biller
              as_user_id: "${biller_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /transports/${t_b}/claims"
              payload: { payer_plan_id: "${medicare_id}", expected_transport_version: "${tb_v}" }
              as: Biller
              as_user_id: "${biller_id}"
              captures: { claim_b: $.data.id }
          trigger:
            - call: "POST /claims/${claim_a}/remittances"
              payload: { outcome: "PAID", reported_allowed_cents: 50000, paid_cents: 40000 }
              as: Biller
              as_user_id: "${biller_id}"
            - call: "POST /claims/${claim_b}/remittances"
              payload: { outcome: "PAID", paid_cents: 40000 }
              as: Biller
              as_user_id: "${biller_id}"
          assert:
            - "Claim.${claim_a}.allowed_amount_cents == 50000"
            - "Claim.${claim_b}.allowed_amount_cents == 50600"
            - "Claim.${claim_a}.allowed_amount_cents != Claim.${claim_b}.allowed_amount_cents"

      - name: patient_responsibility_standard_vs_no_surprises
        grounds:
          - calculations.patient_responsibility
          - calculations.balance_billing_cap_writeoff
          - entities.Transport.fields.patient_responsibility_cents
          - validations[priority=23]
        distinguishing_aspect: "On the Transport patient-liability domain (different entity than adjudicated_allowed's Claim domain), an identical commercial claim yields patient_responsibility 52424 under the standard_balance_bill variant (agency not protected) vs 12144 under no_surprises_protected once a BALANCE_BILLING_CAP Adjustment of 40280 is filed (agency protected)."
        test_recipe:
          setup:
            - "Two agencies — agency_std NOT No-Surprises, agency_ns IS No-Surprises. Commercial PayerPlan qpa_multiplier=1.2 allows_balance_billing=true ACTIVE. Two patients each with that plan primary. Two transports (ALS1-emergency 12.0mi non-rural, billed 101000) fully documented, each with a SUBMITTED commercial primary claim, each PAID 48576 with reported_allowed null (allowed 60720)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Std EMS", npi: "1111111111", state_code: "TX", base_state_is_no_surprises: false }
              as: BillingAdmin
              captures: { ag_std: $.data.id }
            - call: "POST /agencies"
              payload: { name: "NS EMS", npi: "2222222222", state_code: "CA", base_state_is_no_surprises: true }
              as: BillingAdmin
              captures: { ag_ns: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag_std}", full_name: "D1", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp1: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag_std}", full_name: "C1", role: "Coder" }
              as: BillingAdmin
              captures: { coder1: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag_std}", full_name: "O1", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp1: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag_std}", full_name: "B1", role: "Biller" }
              as: BillingAdmin
              captures: { biller1: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Commercial PPO", payer_type: "COMMERCIAL", qpa_multiplier: 1.2, allows_balance_billing: true }
              as: BillingAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat Std", date_of_birth: "1970-01-01", coverages: [ { payer_plan_id: "${comm_id}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { pat_std: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat NS", date_of_birth: "1971-01-01", coverages: [ { payer_plan_id: "${comm_id}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { pat_ns: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag_std}", patient_id: "${pat_std}", run_number: "S1", dispatch_iso: "2026-06-02T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp1}"
              captures: { t_std: $.data.id }
            - call: "POST /transports/${t_std}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder1}"
            - call: "POST /transports/${t_std}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder1}"
            - call: "POST /transports/${t_std}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp1}"
            - call: "GET /transports/${t_std}"
              payload: {}
              as: Biller
              as_user_id: "${biller1}"
              captures: { tstd_v: $.data.version }
            - call: "POST /transports/${t_std}/claims"
              payload: { payer_plan_id: "${comm_id}", expected_transport_version: "${tstd_v}" }
              as: Biller
              as_user_id: "${biller1}"
              captures: { claim_std: $.data.id }
            - call: "POST /claims/${claim_std}/remittances"
              payload: { outcome: "PAID", paid_cents: 48576 }
              as: Biller
              as_user_id: "${biller1}"
            - call: "POST /transports"
              payload: { agency_id: "${ag_ns}", patient_id: "${pat_ns}", run_number: "N1", dispatch_iso: "2026-06-02T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp1}"
              captures: { t_ns: $.data.id }
            - call: "POST /transports/${t_ns}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder1}"
            - call: "POST /transports/${t_ns}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder1}"
            - call: "POST /transports/${t_ns}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp1}"
            - call: "GET /transports/${t_ns}"
              payload: {}
              as: Biller
              as_user_id: "${biller1}"
              captures: { tns_v: $.data.version }
            - call: "POST /transports/${t_ns}/claims"
              payload: { payer_plan_id: "${comm_id}", expected_transport_version: "${tns_v}" }
              as: Biller
              as_user_id: "${biller1}"
              captures: { claim_ns: $.data.id }
            - call: "POST /claims/${claim_ns}/remittances"
              payload: { outcome: "PAID", paid_cents: 48576 }
              as: Biller
              as_user_id: "${biller1}"
          trigger:
            - call: "POST /transports/${t_ns}/adjustments"
              payload: { adjustment_type: "BALANCE_BILLING_CAP" }
              as: ComplianceOfficer
              as_user_id: "${comp1}"
              captures: { cap_id: $.data.id }
          assert:
            - "Transport.${t_std}.patient_responsibility_cents == 52424"
            - "Adjustment.${cap_id}.amount_cents == 40280"
            - "Transport.${t_ns}.patient_responsibility_cents == 12144"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mileage_round_per_tier_then_sum_rural
        grounds:
          - calculations.compute_charge_billed_amount
          - entities.Charge.fields.billed_amount_cents
          - state_machines.Transport.IMPORTED_to_CODED
        distinguishing_aspect: "MODE (b) nested rounding: the rural mileage line rounds the rural tier (first 17 miles * 1750 * 1.5) and the normal tier (excess miles * 1750) separately BEFORE summing; for 20.0 rural miles that yields 44625 + 5250 = 49875, distinct from a sum-then-round computation."
        test_recipe:
          setup:
            - "Agency ACTIVE; a fully-importable BLS non-emergency transport with loaded_miles 20.0 and is_rural_pickup true, ready to code."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Rural EMS", npi: "3333333333", state_code: "MT" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Rural Pat", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "R20", dispatch_iso: "2026-06-03T08:00:00.000Z", origin_modifier: "R", destination_modifier: "H", loaded_miles: 20.0, is_rural_pickup: true, emergency_indicator: false }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
          trigger:
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "BLS" }
              as: Coder
              as_user_id: "${coder}"
          assert:
            - "Transport.${t}.total_billed_cents == 94875"
            - "Charge for ${t} with charge_type==MILEAGE has billed_amount_cents == 49875"
            - "Charge for ${t} with charge_type==BASE_RATE has billed_amount_cents == 45000"

      - name: charity_fpl_threshold_three_input_branch
        grounds:
          - calculations.charity_writeoff
          - entities.Agency.fields.charity_fpl_threshold_pct
          - entities.Patient.fields.annual_household_income_cents
          - validations[priority=22]
        distinguishing_aspect: "MODE (a) >=3-input non-linear branch: charity qualification combines patient income, household_size, and agency charity_fpl_threshold_pct into income_pct_of_fpl = round_half_up(income*100/fpl_base) then compares <= threshold; for income 4080000, household_size 2, threshold 200, fpl_base 2040000 -> exactly 200% qualifies and writes off the full patient balance."
        test_recipe:
          setup:
            - "Agency charity_fpl_threshold_pct=200 (not No-Surprises); Medicare plan; patient household_size=2 income 4080000; ALS1-emergency 12.0mi non-rural transport fully billed to Medicare (PAID 40480) leaving patient_responsibility 10120."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Charity EMS", npi: "4444444444", state_code: "TX", charity_fpl_threshold_pct: 200 }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "O", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Medicare", payer_type: "MEDICARE", allows_balance_billing: false }
              as: BillingAdmin
              captures: { med: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Poor Pat", date_of_birth: "1955-01-01", household_size: 2, annual_household_income_cents: 4080000, coverages: [ { payer_plan_id: "${med}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "CH1", dispatch_iso: "2026-06-03T10:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
            - call: "GET /transports/${t}"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { t_v: $.data.version }
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${med}", expected_transport_version: "${t_v}" }
              as: Biller
              as_user_id: "${biller}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/remittances"
              payload: { outcome: "PAID", paid_cents: 40480 }
              as: Biller
              as_user_id: "${biller}"
          trigger:
            - call: "POST /transports/${t}/adjustments"
              payload: { adjustment_type: "CHARITY" }
              as: ComplianceOfficer
              as_user_id: "${comp}"
              captures: { adj: $.data.id }
          assert:
            - "Adjustment.${adj}.amount_cents == 10120"
            - "Transport.${t}.patient_responsibility_cents == 0"
            - "Transport.${t}.billing_status == CLOSED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transport_parallel_documentation_and_billing_dimensions
        grounds:
          - state_machines.Transport.IMPORTED_to_CODED
          - state_machines.Transport.UNBILLED_to_BILLING_IN_PROGRESS
          - entities.Transport.fields.documentation_status
          - entities.Transport.fields.billing_status
        distinguishing_aspect: "Transport carries two independent state dimensions: documentation_status advances IMPORTED->CODED while billing_status stays UNBILLED, proving the two axes evolve independently on the same row (parallel non-linear shape, distinct from Claim's cyclic shape)."
        test_recipe:
          setup:
            - "Agency ACTIVE; one IMPORTED transport ready to code."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Par EMS", npi: "5555555555", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "PAR1", dispatch_iso: "2026-06-04T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
          trigger:
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "BLS" }
              as: Coder
              as_user_id: "${coder}"
          assert:
            - "Transport.${t}.documentation_status == CODED"
            - "Transport.${t}.billing_status == UNBILLED"

      - name: claim_cyclic_denied_appeal_resubmit_loop
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.DENIED_to_APPEALED
          - state_machines.Claim.APPEALED_to_SUBMITTED
          - entities.Claim.fields.status
        distinguishing_aspect: "Claim revisits SUBMITTED after a cycle SUBMITTED->DENIED->APPEALED->SUBMITTED, proving a true cyclic shape on a different entity than Transport; allowed_amount_cents resets to 0 on resubmit."
        test_recipe:
          setup:
            - "Agency ACTIVE; Medicare plan; patient Medicare primary; ALS1-emergency 12.0mi transport fully documented with a SUBMITTED primary claim; first remittance DENIED (NOT_MEDICALLY_NECESSARY)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Cyc EMS", npi: "6666666666", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "O", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Medicare", payer_type: "MEDICARE", allows_balance_billing: false }
              as: BillingAdmin
              captures: { med: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01", coverages: [ { payer_plan_id: "${med}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "CYC1", dispatch_iso: "2026-06-04T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
            - call: "GET /transports/${t}"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { t_v: $.data.version }
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${med}", expected_transport_version: "${t_v}" }
              as: Biller
              as_user_id: "${biller}"
