              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/stay-requests/${sr_id}/check-in"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { stay_id: $.data.id }
            - call: "POST /api/stays/${stay_id}/contribution-requests"
              payload: { nightly_rate_cents: 2500, planned_nights: 3, hardship_tier: "NONE" }
