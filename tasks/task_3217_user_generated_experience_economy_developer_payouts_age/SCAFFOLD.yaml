    roles: [Creator, SafetyAgent]
    code: 201
    input: [subject_type, subject_id]
    output: ModerationSubmission
    side_effects: ["status=QUEUED; automated classifier runs asynchronously and moves it to AUTO_REVIEWED -> final state per thresholds"]

  - method: GET
    path: "/ugc/moderation-submissions/{id}"
    description: "Get submission"
    roles: [Creator, PlatformAdmin, Moderator, AppealsReviewer, SafetyAgent]
    code: 200
    input: []
    output: ModerationSubmission
    side_effects: []

  - method: GET
    path: "/ugc/moderation-submissions"
    description: "List submissions"
    roles: [PlatformAdmin, Moderator, AppealsReviewer, SafetyAgent]
    code: 200
    input: ["status?", "subject_type?", "submitted_by_user_id?", "reviewer_user_id?", "limit?", "offset?"]
    output: "ModerationSubmission[]"
    side_effects: []

  - method: POST
    path: "/ugc/moderation-submissions/{id}/decide"
    description: "Human decision on a submission"
    roles: [Moderator]
    code: 200
    input: [decision]
    output: ModerationSubmission
    side_effects: ["Status per state machine; reviewer_user_id pinned"]

  - method: POST
