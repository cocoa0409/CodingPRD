      - name: referral_at_exactly_the_divergence_threshold_rejected_then_settles
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RentRevaluation.PROPOSALS_EXCHANGED_to_ARBITRATION_REFERRED
          - errors.ERR_DIVERGENCE_BELOW_THRESHOLD
          - calculations.revaluation_reset_rent.constants.ARBITRATION_DIVERGENCE_THRESHOLD_BPS
        distinguishing_aspect: |
          The referral gate is strictly greater-than: appraisals of 11000000 and 10000000 diverge by
          exactly 1000 bps, which equals ARBITRATION_DIVERGENCE_THRESHOLD_BPS and must be refused, while
          the midpoint settlement carries no divergence condition at all and succeeds on the same row. A
          >= implementation would open an arbitration here.
        test_recipe:
          setup:
            - "One lease with a PROPOSALS_EXCHANGED revaluation at LESSOR 11000000 / LESSEE 10000000, divergence exactly 1000 bps."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
