scenario: "2218. Camp Accreditation & Health Care Compliance (American Camp Association accreditation): standards applicability determination by camp type, program elements and population served, self-assessment documentation and written plan verification for supervision, health care and emergency response, visit scheduling with trained visitor teams and scoring of mandatory standards, health center staffing, medication administration and record requirements, aquatics, adventure and transportation activity-specific standards, deficiency correction plans and accreditation decision levels, annual reporting between visit cycles and incident disclosure, state health department licensing interaction"
domain_name: camp-accreditation-health-compliance
api_prefix: /accreditation

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /accreditation with explicit
  # FK body fields; no entity is nested inside another entity's URL path.

  state_machine_shape: parallel
  # Camp carries two independent status axes (accreditation_status x
  # state_license_status) and StandardEvaluation carries two more
  # (self_status x visit_status); AccreditationCycle forks three ways at
  # decision; Deficiency and WrittenPlan and AnnualReport all cycle.

  relationship_patterns:
    - one_to_many          # Camp -> AccreditationCycle, AnnualReport, WrittenPlan, MedicationAdministrationRecord
    - many_to_many         # Visitor <-> AccreditationVisit via VisitAssignment
    - self_referential     # WrittenPlan.supersedes_plan_id -> WrittenPlan.id
    - cross_aggregate      # StandardEvaluation binds AccreditationCycle, Standard, AccreditationVisit, Visitor, WrittenPlan
    - polymorphic: false

  role_model: segregation_of_duties
  # The AccreditationOfficer user id that scheduled a visit may not be the user
  # id that issues that cycle's accreditation decision; Visitors score but never
  # adjudicate correction plans; CampDirector authors but never verifies.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: Camp
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal operating name of the camp
        constraints: "1..160 chars, non-blank"
      - name: camp_type
        type: enum
        source: input
        description: ACA camp-type classification driving standards applicability
        constraints: "one of RESIDENT, DAY, TRAVEL_TRIP, FAMILY, SPECIAL_NEEDS"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the primary site
        constraints: "exactly 2 uppercase letters"
      - name: population_served
        type: enum
        source: input
        description: camper population category driving standards applicability
        constraints: "one of YOUTH_ONLY, ADULT_INCLUSIVE, MEDICALLY_FRAGILE"
      - name: program_elements
        type: array
        source: input
        description: activity program elements offered, driving activity-specific standards
        default: []
        constraints: "distinct members of AQUATICS_POOL, AQUATICS_OPEN_WATER, ADVENTURE_CHALLENGE_COURSE, ADVENTURE_CLIMBING, HORSEBACK, TRANSPORTATION, TRIP_CAMPING"
      - name: resident_census
        type: integer
        source: input
        description: peak overnight camper census
        default: 0
        constraints: ">= 0"
      - name: distance_to_hospital_km
        type: number
        source: input
        description: road distance from the health center to the nearest emergency department
        default: 0
        constraints: ">= 0"
      - name: max_daily_census
        type: integer
        source: input
        description: maximum campers on site on any single day
        default: 0
        constraints: ">= 0"
      - name: health_staffing_level
        type: enum
        source: input
        description: staffing level actually provided at the camp health center
        default: NONE
        constraints: "one of NONE, FIRST_AIDER_ONLY, LPN_ONSITE, RN_ONSITE, PHYSICIAN_ONSITE"
      - name: required_health_staffing_level
        type: enum
        source: computed
        description: minimum health center staffing level demanded by calculations.required_health_staffing_level
        default: NONE
        constraints: "same enum as health_staffing_level"
      - name: prior_accredited_cycle_count
        type: integer
        source: input
        description: consecutive prior cycles closed with decision_level ACCREDITED; seeded at registration for camps migrating from paper records and incremented by the system on each cycle closed at ACCREDITED
        default: 0
        constraints: ">= 0"
      - name: state_license_number
        type: string
        source: system
        description: state health department license number; null until a StateLicensingAgent supplies one
        default: null
      - name: state_license_status
        type: enum
        source: system
        description: state health department licensing axis, independent of the accreditation axis
        default: NONE
        constraints: "one of NONE, PENDING, ACTIVE, PROBATION, SUSPENDED"
      - name: accreditation_status
        type: enum
        source: computed
        description: ACA accreditation axis, independent of state_license_status
        default: NOT_ACCREDITED
        constraints: "one of NOT_ACCREDITED, ACCREDITED, ACCREDITED_WITH_CORRECTION, PROVISIONAL, REVOKED"
      - name: compliance_posture
        type: enum
        source: computed
        description: derived gate over both status axes per calculations.camp_compliance_posture
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: penalty_point_balance
        type: integer
        source: computed
        description: conserved quantity - sum of Deficiency.penalty_points over this camp's deficiencies whose status is in {OPEN, PLAN_SUBMITTED, ESCALATED}
        default: 0
        constraints: ">= 0"
      - name: health_intake_status
        type: enum
        source: computed
        description: whether the health center may accept new medication administration records
        default: OPEN
        constraints: "one of OPEN, SUSPENDED"
      - name: controlled_intake_units
        type: integer
        source: computed
        description: cumulative controlled-substance units received into the health center stock
        default: 0
        constraints: ">= 0"
      - name: controlled_on_hand_units
        type: integer
        source: computed
        description: conserved quantity - controlled_intake_units minus units consumed by RECORDED CONTROLLED medication records
        default: 0
        constraints: ">= 0"
      - name: risk_index
        type: number
        source: computed
        description: dual-variant risk score per calculations.camp_risk_index
        default: 0
        constraints: "0.00 .. 100.00, two decimals"
      - name: risk_index_variant
        type: enum
        source: computed
        description: which variant of calculations.camp_risk_index produced the current risk_index
        default: PRE_VISIT
        constraints: "one of PRE_VISIT, POST_VISIT"
      - name: last_accredited_year
        type: integer
        source: computed
        description: cycle_year of the most recent cycle closed with decision_level ACCREDITED; null when none
        default: null

  - name: StandardsSet
    parent: null
    common_fields: true
    fields:
      - name: edition_code
        type: string
        source: input
        description: unique edition identifier of the published standards book
        constraints: "unique across StandardsSet, 1..40 chars"
      - name: effective_year
        type: integer
        source: input
        description: first accreditation year this edition governs
        constraints: "2000 .. 2100"
      - name: status
        type: enum
        source: system
        description: publication lifecycle of the edition
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, RETIRED"
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant at which the edition was published; null while DRAFT
        default: null
      - name: standard_count
        type: integer
        source: computed
        description: number of Standard rows whose standards_set_id is this set
        default: 0
      - name: mandatory_count
        type: integer
        source: computed
        description: number of Standard rows in this set with mandatory true
        default: 0

  - name: Standard
    parent: StandardsSet
    common_fields: true
    fields:
      - name: standards_set_id
        type: string
        source: input
        description: "FK -> StandardsSet.id; the edition this standard belongs to"
      - name: code
        type: string
        source: input
        description: standard code such as HW.7 or PA.2
        constraints: "unique within standards_set_id, 1..16 chars"
      - name: title
        type: string
        source: input
        description: short human title of the standard
        constraints: "1..200 chars"
      - name: domain
        type: enum
        source: input
        description: standards domain used for severity classification and fee surcharges
        constraints: "one of SUPERVISION, HEALTH_WELLNESS, EMERGENCY_RESPONSE, AQUATICS, ADVENTURE, TRANSPORTATION, OPERATIONS"
      - name: mandatory
        type: boolean
        source: input
        description: whether this standard is a mandatory standard for accreditation
        default: false
      - name: scoring_weight
        type: integer
        source: input
        description: weight of this standard in the weighted compliance percentage
        default: 1
        constraints: "1 .. 5"
      - name: written_plan_type_required
        type: enum
        source: input
        description: WrittenPlan.plan_type that must be VERIFIED before this standard may be self-scored MET; null when no written plan is demanded
        default: null
        constraints: "null or one of SUPERVISION, HEALTH_CARE, EMERGENCY_RESPONSE, AQUATICS_SAFETY, TRANSPORTATION_SAFETY, ADVENTURE_OPERATIONS"
      - name: applies_to_camp_types
        type: array
        source: input
        description: camp_type gate; empty array means the standard applies to every camp type
        default: []
        constraints: "distinct members of the Camp.camp_type enum"
      - name: requires_program_elements_any
        type: array
        source: input
        description: program-element gate; empty array means no program element is required
        default: []
        constraints: "distinct members of the Camp.program_elements enum"
      - name: applies_to_populations
        type: array
        source: input
        description: population gate; empty array means the standard applies to every population served
        default: []
        constraints: "distinct members of the Camp.population_served enum"
      - name: requires_state_licensed
        type: boolean
        source: input
        description: when true the standard applies only to camps whose state_license_status is in {ACTIVE, PROBATION}
        default: false

  - name: AccreditationCycle
    parent: null
    common_fields: true
    fields:
      - name: camp_id
        type: string
        source: input
        description: "FK -> Camp.id; the camp under review in this cycle"
      - name: standards_set_id
        type: string
        source: input
        description: "FK -> StandardsSet.id; edition version-pinned at cycle creation and never re-read afterwards"
      - name: cycle_year
        type: integer
        source: input
        description: accreditation year this cycle decides
        constraints: "2000 .. 2100, unique per camp_id"
      - name: status
        type: enum
        source: system
        description: cycle lifecycle
        default: SELF_ASSESSMENT
        constraints: "one of SELF_ASSESSMENT, VISIT_SCHEDULED, VISIT_COMPLETED, IN_CORRECTION, CLOSED, TERMINATED"
      - name: decision_level
        type: enum
        source: computed
        description: accreditation decision level per calculations.accreditation_decision_level; null before the decision
        default: null
        constraints: "null or one of ACCREDITED, ACCREDITED_WITH_CORRECTION, PROVISIONAL, DENIED"
      - name: applicable_standard_count
        type: integer
        source: computed
        description: number of StandardEvaluation rows on this cycle with applicable true
        default: 0
      - name: applicable_mandatory_count
        type: integer
        source: computed
        description: number of StandardEvaluation rows on this cycle with applicable true and mandatory true
        default: 0
      - name: self_assessment_submitted_at
        type: datetime
        source: system
        description: logical-clock instant the camp submitted its self-assessment; null until submitted
        default: null
      - name: provisional_mandatory_pct
        type: number
        source: computed
        description: visit_provisional variant of calculations.mandatory_compliance_score, stamped at visit finalize
        default: null
        constraints: "0.00 .. 100.00, two decimals"
      - name: final_mandatory_pct
        type: number
        source: computed
        description: office_final variant of calculations.mandatory_compliance_score, stamped at decision
        default: null
        constraints: "0.00 .. 100.00, two decimals"
      - name: final_weighted_pct
        type: number
        source: computed
        description: weighted compliance percentage over all applicable evaluations, stamped at decision
        default: null
        constraints: "0.00 .. 100.00, two decimals"
      - name: open_deficiency_count
        type: integer
        source: computed
        description: number of Deficiency rows on this cycle's non-RESCINDED visit whose status is in {OPEN, PLAN_SUBMITTED, PLAN_ACCEPTED}
        default: 0
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: accreditation fee per calculations.accreditation_fee_assessment, stamped at decision
        default: null
      - name: correction_deadline_at
        type: datetime
        source: computed
        description: latest Deficiency.correction_due_date on this cycle at 23:59:59.999Z; null when no deficiency is open
        default: null
      - name: decision_issued_at
        type: datetime
        source: system
        description: logical-clock instant of the accreditation decision; null before
        default: null
      - name: decision_issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the AccreditationOfficer that issued the decision; segregation-of-duties counterpart of AccreditationVisit.scheduled_by_user_id
        default: null

  - name: StandardEvaluation
    parent: AccreditationCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: "FK -> AccreditationCycle.id; the cycle this evaluation belongs to"
      - name: standard_id
        type: string
        source: system
        description: "FK -> Standard.id; the standard being evaluated"
      - name: visit_id
        type: string
        source: system
        description: "FK -> AccreditationVisit.id; set when a visitor first scores this evaluation; null before"
        default: null
      - name: scored_by_visitor_id
        type: string
        source: system
        description: "FK -> Visitor.id; visitor that recorded visitor_score; null before"
        default: null
      - name: written_plan_id
        type: string
        source: input
        description: "FK -> WrittenPlan.id; plan the camp cites as evidence for this standard; null when none cited"
        default: null
      - name: applicable
        type: boolean
        source: computed
        description: applicability verdict from calculations.standard_applicability_determination, frozen at cycle creation
      - name: mandatory
        type: boolean
        source: computed
        description: copy of Standard.mandatory pinned at cycle creation, never re-read from Standard afterwards
      - name: scoring_weight
        type: integer
        source: computed
        description: copy of Standard.scoring_weight pinned at cycle creation, never re-read from Standard afterwards
      - name: self_score
        type: enum
        source: input
        description: camp's own self-assessment verdict
        default: null
        constraints: "null or one of NOT_MET, PARTIAL, MET"
      - name: self_status
        type: enum
        source: system
        description: self-assessment dimension; evolves independently of visit_status on the same row
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, VERIFIED, REJECTED"
      - name: visitor_score
        type: enum
        source: input
        description: visiting team's verdict
        default: null
        constraints: "null or one of MET, NOT_MET, NOT_APPLICABLE"
      - name: score_source
        type: enum
        source: input
        description: evidence channel behind visitor_score; drives the visit_provisional inclusion set
        default: null
        constraints: "null or one of OBSERVED, DOCUMENT, INTERVIEW"
      - name: visit_status
        type: enum
        source: system
        description: visit-scoring dimension; evolves independently of self_status on the same row
        default: UNSCORED
        constraints: "one of UNSCORED, SCORED, LOCKED"
      - name: note
        type: string
        source: input
        description: free-text annotation attached by whichever actor last wrote this row
        default: null

  - name: WrittenPlan
    parent: Camp
    common_fields: true
    fields:
      - name: camp_id
        type: string
        source: input
        description: "FK -> Camp.id; camp that owns this written plan"
      - name: plan_type
        type: enum
        source: input
        description: which written plan this document is
        constraints: "one of SUPERVISION, HEALTH_CARE, EMERGENCY_RESPONSE, AQUATICS_SAFETY, TRANSPORTATION_SAFETY, ADVENTURE_OPERATIONS"
      - name: body_ref
        type: string
        source: input
        description: opaque document reference the camp supplies
        constraints: "1..200 chars"
      - name: physician_reviewed
        type: boolean
        source: input
        description: whether a licensed physician signed off; required before a HEALTH_CARE plan may be VERIFIED
        default: false
      - name: effective_date
        type: string
        source: input
        description: first date the plan governs, ISO 8601 calendar date
        constraints: "YYYY-MM-DD"
      - name: expires_at
        type: string
        source: input
        description: last date the plan governs, ISO 8601 calendar date
        constraints: "YYYY-MM-DD, strictly after effective_date"
      - name: status
        type: enum
        source: system
        description: verification lifecycle; VERIFIED can revert to REVALIDATION_REQUIRED and back
        default: SUBMITTED
        constraints: "one of SUBMITTED, VERIFIED, REJECTED, REVALIDATION_REQUIRED, SUPERSEDED"
      - name: supersedes_plan_id
        type: string
        source: system
        description: "FK -> WrittenPlan.id; prior plan of the same plan_type that this plan superseded; null when none existed"
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent VERIFY review; null when never verified
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the AccreditationOfficer that last reviewed this plan
        default: null
      - name: verification_note
        type: string
        source: input
        description: reviewer annotation recorded on the last review
        default: null

  - name: Visitor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: visitor's name
        constraints: "1..120 chars"
      - name: home_state_code
        type: string
        source: input
        description: two-letter US state code of the visitor's residence
        constraints: "exactly 2 uppercase letters"
      - name: trained_through_year
        type: integer
        source: input
        description: last calendar year for which the visitor's ACA visitor training is current
        constraints: "2000 .. 2100"
      - name: certifications
        type: array
        source: input
        description: specialist endorsements the visitor holds
        default: []
        constraints: "distinct members of LEAD_VISITOR, AQUATICS_SPECIALIST, ADVENTURE_SPECIALIST, HEALTH_SPECIALIST"
      - name: employer_camp_id
        type: string
        source: input
        description: "FK -> Camp.id; camp that employs this visitor, creating a conflict of interest; null when independent"
        default: null
      - name: status
        type: enum
        source: system
        description: roster availability
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"
      - name: committed_travel_days
        type: integer
        source: computed
        description: conserved quantity - sum of VisitAssignment.travel_days over this visitor's assignments whose status is in {ASSIGNED, COMPLETED}
        default: 0
        constraints: ">= 0"
      - name: deactivated_reason
        type: string
        source: input
        description: reason recorded when the visitor was deactivated
        default: null

  - name: AccreditationVisit
    parent: AccreditationCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> AccreditationCycle.id; cycle this visit serves"
      - name: window_start_date
        type: string
        source: input
        description: first date of the agreed visit window, ISO 8601 calendar date
        constraints: "YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: input
        description: last date of the agreed visit window, ISO 8601 calendar date
        constraints: "YYYY-MM-DD, on or after window_start_date"
      - name: status
        type: enum
        source: system
        description: visit lifecycle; SCHEDULED can revert to DRAFT when the team decomposes
        default: DRAFT
        constraints: "one of DRAFT, SCHEDULED, IN_PROGRESS, SCORED, RESCINDED"
      - name: lead_visitor_id
        type: string
        source: computed
        description: "FK -> Visitor.id; visitor holding the LEAD team_role on an ASSIGNED assignment; null when no LEAD is seated"
        default: null
      - name: team_size
        type: integer
        source: computed
        description: number of VisitAssignment rows on this visit with status ASSIGNED
        default: 0
      - name: required_specialist_domains
        type: array
        source: computed
        description: specialist domains the team must seat, derived from the camp's program elements and health staffing requirement
        default: []
        constraints: "distinct members of AQUATICS, ADVENTURE, HEALTH_WELLNESS"
      - name: mandatory_scored_count
        type: integer
        source: computed
        description: number of applicable mandatory evaluations on the cycle with visitor_score not null
        default: 0
      - name: mandatory_met_count
        type: integer
        source: computed
        description: number of applicable mandatory evaluations on the cycle with visitor_score MET
        default: 0
      - name: provisional_mandatory_pct
        type: number
        source: computed
        description: visit_provisional variant of calculations.mandatory_compliance_score stamped on this visit at finalize
        default: null
        constraints: "0.00 .. 100.00, two decimals"
      - name: scheduled_by_user_id
        type: string
        source: system
        description: X-User-ID of the AccreditationOfficer that scheduled this visit; segregation-of-duties counterpart of AccreditationCycle.decision_issued_by_user_id
        default: null
      - name: scheduled_note
        type: string
        source: input
        description: scheduling annotation
        default: null
      - name: scored_at
        type: datetime
        source: system
        description: logical-clock instant scoring was finalized; null before
        default: null

  - name: VisitAssignment
    parent: AccreditationVisit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> AccreditationVisit.id; visit this seat belongs to"
      - name: visitor_id
        type: string
        source: input
        description: "FK -> Visitor.id; visitor seated"
      - name: team_role
        type: enum
        source: input
        description: seat on the visiting team
        constraints: "one of LEAD, MEMBER, SPECIALIST_AQUATICS, SPECIALIST_ADVENTURE, SPECIALIST_HEALTH"
      - name: travel_block_start_date
        type: string
        source: input
        description: first date the visitor is committed to travel, ISO 8601 calendar date
        constraints: "YYYY-MM-DD"
      - name: travel_block_end_date
        type: string
        source: input
        description: last date the visitor is committed to travel, ISO 8601 calendar date
        constraints: "YYYY-MM-DD, on or after travel_block_start_date"
      - name: travel_days
        type: integer
        source: computed
        description: inclusive day count travel_block_end_date minus travel_block_start_date plus one
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: seat lifecycle
        default: ASSIGNED
        constraints: "one of ASSIGNED, WITHDRAWN, COMPLETED"
      - name: withdrawal_reason
        type: string
        source: input
        description: reason recorded on withdrawal
        default: null

  - name: Deficiency
    parent: AccreditationVisit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: system
        description: "FK -> AccreditationVisit.id; visit that produced this finding"
      - name: standard_id
        type: string
        source: system
        description: "FK -> Standard.id; standard found not met"
      - name: severity
        type: enum
        source: computed
        description: severity class per calculations.deficiency_penalty_and_deadline
        constraints: "one of MANDATORY_CRITICAL, MANDATORY, SCORED"
      - name: base_points
        type: integer
        source: computed
        description: severity points times pinned scoring_weight, before the escalation surcharge
        constraints: ">= 1"
      - name: penalty_points
        type: integer
        source: computed
        description: base_points plus the escalation surcharge selected from the batch base total
        constraints: ">= 1"
      - name: correction_due_date
        type: string
        source: computed
        description: last date a correction may be verified, ISO 8601 calendar date
        constraints: "YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: correction lifecycle; PLAN_SUBMITTED returns to OPEN on rejection
        default: OPEN
        constraints: "one of OPEN, PLAN_SUBMITTED, PLAN_ACCEPTED, CORRECTED, ESCALATED, WAIVED"
      - name: plan_revision_count
        type: integer
        source: computed
        description: number of correction plans submitted against this deficiency
        default: 0
      - name: correction_plan_text
        type: string
        source: input
        description: most recent correction plan narrative
        default: null
      - name: last_plan_submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent correction plan submission
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the AccreditationOfficer that last reviewed this deficiency
        default: null
      - name: reviewer_note
        type: string
        source: input
        description: reviewer annotation from the last review
        default: null

  - name: MedicationAdministrationRecord
    parent: Camp
    common_fields: true
    fields:
      - name: camp_id
        type: string
        source: input
        description: "FK -> Camp.id; camp whose health center administered the dose"
      - name: camper_reference
        type: string
        source: input
        description: de-identified camper handle used for per-camper dosing windows
        constraints: "1..64 chars"
      - name: medication_class
        type: enum
        source: input
        description: regulatory class of the medication administered
        constraints: "one of OTC, PRESCRIPTION, CONTROLLED"
      - name: dose_units
        type: integer
        source: input
        description: units dispensed from stock
        constraints: ">= 1"
      - name: administered_at
        type: datetime
        source: input
        description: instant of administration, ISO 8601 UTC with three fractional digits
      - name: administered_by_role
        type: enum
        source: input
        description: licensure of the person administering
        constraints: "one of RN, LPN, FIRST_AIDER, PHYSICIAN, UNLICENSED_DESIGNEE"
      - name: second_signature_present
        type: boolean
        source: input
        description: whether a witness co-signature was recorded
        default: false
      - name: record_status
        type: enum
        source: system
        description: record lifecycle
        default: RECORDED
        constraints: "one of RECORDED, VOIDED"
      - name: compliance_flag
        type: enum
        source: computed
        description: documentation completeness verdict stamped at creation
        constraints: "one of COMPLIANT, DOCUMENTATION_INCOMPLETE"
      - name: void_reason
        type: string
        source: input
        description: reason recorded when the record was voided
        default: null

  - name: AnnualReport
    parent: Camp
    common_fields: true
    fields:
      - name: camp_id
        type: string
        source: input
        description: "FK -> Camp.id; reporting camp"
      - name: report_year
        type: integer
        source: input
        description: season year being reported between visit cycles
        constraints: "2000 .. 2100, unique per camp_id"
      - name: due_date
        type: string
        source: computed
        description: filing deadline, fixed at March 1 of report_year plus one, ISO 8601 calendar date
        constraints: "YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: reporting lifecycle; ACCEPTED reverts to REOPENED when a late incident surfaces
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, LATE, ACCEPTED, REJECTED, REOPENED, ARCHIVED"
      - name: declared_incident_count
        type: integer
        source: input
        description: incident count the camp attests to at submission
        default: 0
        constraints: ">= 0"
      - name: disclosed_incident_count
        type: integer
        source: computed
        description: number of IncidentDisclosure rows whose annual_report_id is this report
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submission; null before
        default: null
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the CampDirector that last submitted this report
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: number of times an accepted report was reopened by a late disclosure
        default: 0
      - name: reviewer_note
        type: string
        source: input
        description: reviewer annotation from the last review
        default: null

  - name: IncidentDisclosure
    parent: AnnualReport
    common_fields: true
    fields:
      - name: annual_report_id
        type: string
        source: input
        description: "FK -> AnnualReport.id; report this incident is disclosed under"
      - name: incident_type
        type: enum
        source: input
        description: category of the disclosed incident
        constraints: "one of SERIOUS_INJURY, HOSPITALIZATION, DEATH, ABUSE_ALLEGATION, MEDICATION_ERROR, AQUATICS_RESCUE, TRANSPORTATION_COLLISION, COMMUNICABLE_DISEASE_OUTBREAK"
      - name: occurred_at
        type: datetime
        source: input
        description: instant the incident occurred, ISO 8601 UTC with three fractional digits
      - name: disclosed_at
        type: datetime
        source: system
        description: logical-clock instant the disclosure was filed
      - name: severity_weight
        type: integer
        source: computed
        description: incident severity weight from calculations.camp_risk_index constants
        constraints: ">= 1"
      - name: state_notification_required
        type: boolean
        source: computed
        description: true when incident_type is in {DEATH, ABUSE_ALLEGATION, HOSPITALIZATION, COMMUNICABLE_DISEASE_OUTBREAK} and the camp's state_license_status is in {ACTIVE, PROBATION}
      - name: status
        type: enum
        source: computed
        description: whether the disclosure arrived before or after its report was accepted
        constraints: "one of REPORTED, LATE_DISCLOSED"

# ============================================================================
# 1.2 State Machine Table
# ============================================================================
state_machines:

  # --- Camp: two independent status axes on one row -------------------------
  - entity: Camp
    dimension: accreditation_status
    initial_state: NOT_ACCREDITED
    terminal_states: []
    note: "Evolves only through AccreditationCycle decisions and escalations; entirely independent of the state_license_status axis on the same row."
    transitions:
      - from: NOT_ACCREDITED
        to: ACCREDITED
        trigger: "POST /accreditation/cycles/{cycleId}/decision resolving decision_level ACCREDITED"
        actor: AccreditationOfficer
        preconditions: ["cycle.camp_id == camp.id", "cycle.status == VISIT_COMPLETED"]
        side_effects:
          - "camp.prior_accredited_cycle_count += 1"
          - "camp.last_accredited_year = cycle.cycle_year"
          - "recompute calculations.camp_compliance_posture"
      - from: NOT_ACCREDITED
        to: ACCREDITED_WITH_CORRECTION
        trigger: "POST /accreditation/cycles/{cycleId}/decision resolving decision_level ACCREDITED_WITH_CORRECTION"
        actor: AccreditationOfficer
        preconditions: ["cycle.status == VISIT_COMPLETED"]
        side_effects: ["recompute calculations.camp_compliance_posture"]
      - from: NOT_ACCREDITED
        to: PROVISIONAL
        trigger: "POST /accreditation/cycles/{cycleId}/decision resolving decision_level PROVISIONAL"
        actor: AccreditationOfficer
        preconditions: ["cycle.status == VISIT_COMPLETED"]
        side_effects: ["recompute calculations.camp_compliance_posture"]
      - from: NOT_ACCREDITED
        to: REVOKED
        trigger: "POST /accreditation/cycles/{cycleId}/decision resolving decision_level DENIED"
        actor: AccreditationOfficer
        preconditions: ["cycle.status == VISIT_COMPLETED"]
        side_effects:
          - "every Deficiency on the cycle's non-RESCINDED visit with status in {OPEN, PLAN_SUBMITTED, PLAN_ACCEPTED} -> ESCALATED"
          - "recompute camp.penalty_point_balance then calculations.camp_compliance_posture"
      - from: ACCREDITED
        to: REVOKED
        trigger: "POST /_clock/set_current_utc advancing past a Deficiency.correction_due_date on an IN_CORRECTION cycle"
        actor: system
        preconditions: ["a Deficiency of this camp escalated on the clock advance"]
        side_effects: ["recompute calculations.camp_compliance_posture (FROZEN via the ESCALATED clause)"]
      - from: ACCREDITED_WITH_CORRECTION
        to: ACCREDITED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/review with decision VERIFY_CORRECTION that clears the cycle's last open deficiency"
        actor: AccreditationOfficer
        preconditions: ["cycle.status == IN_CORRECTION", "cycle.open_deficiency_count becomes 0"]
        side_effects: ["camp.prior_accredited_cycle_count += 1", "camp.last_accredited_year = cycle.cycle_year"]
      - from: PROVISIONAL
        to: REVOKED
        trigger: "POST /_clock/set_current_utc advancing past a Deficiency.correction_due_date on an IN_CORRECTION cycle"
        actor: system
        preconditions: ["a Deficiency of this camp escalated on the clock advance"]
        side_effects: ["recompute calculations.camp_compliance_posture"]
      - from: ACCREDITED_WITH_CORRECTION
        to: REVOKED
        trigger: "POST /_clock/set_current_utc advancing past a Deficiency.correction_due_date on an IN_CORRECTION cycle"
        actor: system
        preconditions: ["a Deficiency of this camp escalated on the clock advance"]
        side_effects: ["recompute calculations.camp_compliance_posture"]

  - entity: Camp
    dimension: state_license_status
    initial_state: NONE
    terminal_states: []
    note: "Written only by StateLicensingAgent; every write recomputes applicability-independent derived fields but never touches accreditation_status."
    transitions:
      - from: NONE
        to: PENDING
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status PENDING"
        actor: StateLicensingAgent
        preconditions: []
        side_effects: ["recompute calculations.camp_compliance_posture", "recompute calculations.camp_risk_index", "increments Camp.version by 1"]
      - from: PENDING
        to: ACTIVE
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status ACTIVE"
        actor: StateLicensingAgent
        preconditions: ["state_license_number present on the request or already stored"]
        side_effects: ["recompute calculations.camp_compliance_posture", "recompute calculations.camp_risk_index", "increments Camp.version by 1"]
      - from: NONE
        to: ACTIVE
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status ACTIVE"
        actor: StateLicensingAgent
        preconditions: ["state_license_number present on the request"]
        side_effects: ["recompute calculations.camp_compliance_posture", "recompute calculations.camp_risk_index", "increments Camp.version by 1"]
      - from: ACTIVE
        to: PROBATION
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status PROBATION"
        actor: StateLicensingAgent
        preconditions: []
        side_effects: ["recompute calculations.camp_compliance_posture (RESTRICTED via the PROBATION clause)", "recompute calculations.camp_risk_index", "increments Camp.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status SUSPENDED"
        actor: StateLicensingAgent
        preconditions: []
        side_effects:
          - "recompute calculations.camp_compliance_posture -> FROZEN"
          - "posture FROZEN sets camp.health_intake_status = SUSPENDED"
          - "posture FROZEN flips every WrittenPlan of this camp with status VERIFIED to REVALIDATION_REQUIRED"
          - "each such WrittenPlan transition flips every StandardEvaluation with written_plan_id equal to that plan and self_status VERIFIED to self_status REJECTED"
          - "recompute calculations.camp_risk_index"
          - "increments Camp.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status SUSPENDED"
        actor: StateLicensingAgent
        preconditions: []
        side_effects: ["same cascade as ACTIVE -> SUSPENDED", "increments Camp.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status ACTIVE"
        actor: StateLicensingAgent
        preconditions: ["state_license_number present on the request or already stored"]
        side_effects:
          - "recompute calculations.camp_compliance_posture"
          - "when the recomputed posture is not FROZEN, camp.health_intake_status = OPEN"
          - "recompute calculations.camp_risk_index"
          - "increments Camp.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "PATCH /accreditation/camps/{campId}/state-license with state_license_status ACTIVE"
        actor: StateLicensingAgent
        preconditions: []
        side_effects: ["recompute calculations.camp_compliance_posture", "recompute calculations.camp_risk_index", "increments Camp.version by 1"]

  # --- AccreditationCycle: branching fork at the decision -------------------
  - entity: AccreditationCycle
    initial_state: SELF_ASSESSMENT
    terminal_states: [CLOSED, TERMINATED]
    note: "VISIT_COMPLETED forks three ways with disjoint side-effect sets; VISIT_SCHEDULED can revert to SELF_ASSESSMENT when the visit team decomposes."
    transitions:
      - from: SELF_ASSESSMENT
        to: VISIT_SCHEDULED
        trigger: "POST /accreditation/visits/{visitId}/schedule"
        actor: AccreditationOfficer
        preconditions: ["visit.cycle_id == cycle.id", "visit.status == DRAFT", "cycle.self_assessment_submitted_at is not null"]
        side_effects: ["visit.status = SCHEDULED", "visit.scheduled_by_user_id = X-User-ID"]
      - from: VISIT_SCHEDULED
        to: SELF_ASSESSMENT
        trigger: "system event - the cycle's SCHEDULED visit reverts to DRAFT because a withdrawal broke team completeness"
        actor: system
        preconditions: ["visit.status was SCHEDULED", "visit team completeness no longer holds"]
        side_effects: ["visit.status = DRAFT", "visit.scheduled_by_user_id = null"]
      - from: VISIT_SCHEDULED
        to: VISIT_COMPLETED
        trigger: "POST /accreditation/visits/{visitId}/finalize-scoring"
        actor: Visitor
        preconditions: ["visit.status == IN_PROGRESS", "every applicable mandatory StandardEvaluation has visitor_score not null"]
        side_effects:
          - "visit.status = SCORED and visit.scored_at = current logical clock"
          - "every StandardEvaluation on the cycle with visit_status SCORED -> LOCKED"
          - "every VisitAssignment on the visit with status ASSIGNED -> COMPLETED"
          - "compute calculations.mandatory_compliance_score variant visit_provisional into visit.provisional_mandatory_pct and cycle.provisional_mandatory_pct"
          - "for every applicable StandardEvaluation with visitor_score NOT_MET create a Deficiency (status OPEN) per calculations.deficiency_penalty_and_deadline"
          - "each Deficiency creation recomputes camp.penalty_point_balance and then calculations.camp_compliance_posture"
          - "a recomputed posture of FROZEN sets camp.health_intake_status = SUSPENDED and flips every WrittenPlan of the camp with status VERIFIED to REVALIDATION_REQUIRED"
          - "each WrittenPlan flip to REVALIDATION_REQUIRED flips every StandardEvaluation whose written_plan_id is that plan and whose self_status is VERIFIED to self_status REJECTED"
          - "recompute calculations.camp_risk_index under variant post_visit"
      - from: VISIT_COMPLETED
        to: CLOSED
        trigger: "POST /accreditation/cycles/{cycleId}/decision when decision_level != DENIED and cycle.open_deficiency_count == 0"
        actor: AccreditationOfficer
        preconditions: ["X-User-ID != visit.scheduled_by_user_id", "cycle has exactly one non-RESCINDED visit with status SCORED"]
        side_effects:
          - "compute calculations.mandatory_compliance_score variant office_final into cycle.final_mandatory_pct"
          - "compute cycle.final_weighted_pct"
          - "compute calculations.accreditation_decision_level into cycle.decision_level"
          - "compute calculations.accreditation_fee_assessment into cycle.assessed_fee_cents"
          - "camp.accreditation_status = decision_level mapping"
          - "every AnnualReport of the camp with status ACCEPTED and report_year < cycle.cycle_year -> ARCHIVED"
          - "cycle.decision_issued_at and cycle.decision_issued_by_user_id stamped"
      - from: VISIT_COMPLETED
        to: IN_CORRECTION
        trigger: "POST /accreditation/cycles/{cycleId}/decision when decision_level != DENIED and cycle.open_deficiency_count > 0"
        actor: AccreditationOfficer
        preconditions: ["X-User-ID != visit.scheduled_by_user_id", "cycle has exactly one non-RESCINDED visit with status SCORED"]
        side_effects:
          - "same four calculations as the CLOSED branch"
          - "camp.accreditation_status = decision_level mapping"
          - "cycle.correction_deadline_at = latest Deficiency.correction_due_date on the visit at 23:59:59.999Z"
          - "cycle.decision_issued_at and cycle.decision_issued_by_user_id stamped"
      - from: VISIT_COMPLETED
        to: TERMINATED
        trigger: "POST /accreditation/cycles/{cycleId}/decision when decision_level == DENIED"
        actor: AccreditationOfficer
        preconditions: ["X-User-ID != visit.scheduled_by_user_id", "cycle has exactly one non-RESCINDED visit with status SCORED"]
        side_effects:
          - "same four calculations as the CLOSED branch"
          - "camp.accreditation_status = REVOKED"
          - "every Deficiency on the visit with status in {OPEN, PLAN_SUBMITTED, PLAN_ACCEPTED} -> ESCALATED"
          - "recompute camp.penalty_point_balance then calculations.camp_compliance_posture"
          - "cycle.decision_issued_at and cycle.decision_issued_by_user_id stamped"
      - from: IN_CORRECTION
        to: CLOSED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/review with decision VERIFY_CORRECTION or WAIVE clearing the last open deficiency"
        actor: AccreditationOfficer
        preconditions: ["cycle.open_deficiency_count becomes 0"]
        side_effects:
          - "when cycle.decision_level == ACCREDITED_WITH_CORRECTION then camp.accreditation_status = ACCREDITED and camp.prior_accredited_cycle_count += 1 and camp.last_accredited_year = cycle.cycle_year"
          - "every AnnualReport of the camp with status ACCEPTED and report_year < cycle.cycle_year -> ARCHIVED"
          - "cycle.correction_deadline_at = null"
      - from: IN_CORRECTION
        to: TERMINATED
        trigger: "POST /_clock/set_current_utc advancing the logical clock date past a Deficiency.correction_due_date on this cycle"
        actor: system
        preconditions: ["at least one Deficiency on the cycle has status in {OPEN, PLAN_ACCEPTED} and correction_due_date < new clock date - a Deficiency sitting in PLAN_SUBMITTED is sheltered from clock escalation because the national office holds the pending plan"]
        side_effects:
          - "each such Deficiency -> ESCALATED"
          - "camp.accreditation_status = REVOKED"
          - "recompute camp.penalty_point_balance then calculations.camp_compliance_posture -> FROZEN"
      - from: SELF_ASSESSMENT
        to: TERMINATED
        trigger: "POST /accreditation/cycles superseding this cycle for the same camp"
        actor: AccreditationOfficer
        preconditions: ["the superseding request carries a current expected_camp_version"]
        side_effects: ["cycle.status = TERMINATED", "the cycle's DRAFT or SCHEDULED visit -> RESCINDED with its ASSIGNED assignments -> WITHDRAWN"]

  # --- AccreditationVisit: forward pipeline with a revert edge --------------
  - entity: AccreditationVisit
    initial_state: DRAFT
    terminal_states: [SCORED, RESCINDED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /accreditation/visits/{visitId}/schedule"
        actor: AccreditationOfficer
        preconditions:
          - "visit team completeness holds: lead_visitor_id is not null AND team_size >= 2 AND for every domain D in required_specialist_domains an ASSIGNED assignment exists whose team_role is SPECIALIST_<D> and whose visitor holds the matching certification"
          - "camp.state_license_status in {NONE, ACTIVE, PROBATION}"
          - "camp.compliance_posture != FROZEN"
          - "cycle.self_assessment_submitted_at is not null"
        side_effects: ["cycle.status SELF_ASSESSMENT -> VISIT_SCHEDULED", "visit.scheduled_by_user_id = X-User-ID"]
      - from: SCHEDULED
        to: DRAFT
        trigger: "system event - a VisitAssignment withdrawal breaks team completeness"
        actor: system
        preconditions: ["the withdrawn assignment held team_role LEAD or a SPECIALIST_<D> seat for a domain D in required_specialist_domains, or team_size fell below 2"]
        side_effects: ["visit.lead_visitor_id = null when the LEAD seat was withdrawn", "visit.scheduled_by_user_id = null", "cycle.status VISIT_SCHEDULED -> SELF_ASSESSMENT"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /accreditation/visits/{visitId}/start"
        actor: Visitor
        preconditions:
          - "X-User-ID == visit.lead_visitor_id"
          - "the logical clock calendar date is within [window_start_date, window_end_date] inclusive"
          - "camp.compliance_posture != FROZEN"
        side_effects: []
      - from: IN_PROGRESS
        to: SCORED
        trigger: "POST /accreditation/visits/{visitId}/finalize-scoring"
        actor: Visitor
        preconditions:
          - "X-User-ID == visit.lead_visitor_id"
          - "every applicable mandatory StandardEvaluation on the cycle has visitor_score not null"
        side_effects: ["see AccreditationCycle VISIT_SCHEDULED -> VISIT_COMPLETED for the full five-hop cascade"]
      - from: DRAFT
        to: RESCINDED
        trigger: "POST /accreditation/visits creating a superseding visit for the same cycle"
        actor: AccreditationOfficer
        preconditions: ["the superseding request carries a current expected_cycle_version"]
        side_effects: ["every VisitAssignment on this visit with status ASSIGNED -> WITHDRAWN", "each withdrawal decrements the visitor's committed_travel_days by that assignment's travel_days"]
      - from: SCHEDULED
        to: RESCINDED
        trigger: "POST /accreditation/visits creating a superseding visit for the same cycle"
        actor: AccreditationOfficer
        preconditions: ["the superseding request carries a current expected_cycle_version"]
        side_effects:
          - "every VisitAssignment on this visit with status ASSIGNED -> WITHDRAWN"
          - "each withdrawal decrements the visitor's committed_travel_days by that assignment's travel_days"
          - "cycle.status VISIT_SCHEDULED -> SELF_ASSESSMENT"

  # --- VisitAssignment ------------------------------------------------------
  - entity: VisitAssignment
    initial_state: ASSIGNED
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "POST /accreditation/visit-assignments/{assignmentId}/withdraw"
        actor: AccreditationOfficer
        preconditions: ["visit.status in {DRAFT, SCHEDULED}"]
        side_effects:
          - "visitor.committed_travel_days -= assignment.travel_days"
          - "visit.team_size -= 1"
          - "visit.lead_visitor_id = null when team_role == LEAD"
          - "when visit.status == SCHEDULED and team completeness no longer holds, visit -> DRAFT which in turn drives cycle VISIT_SCHEDULED -> SELF_ASSESSMENT"
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "POST /accreditation/visitors/{visitorId}/deactivate cascading to every ASSIGNED seat of that visitor"
        actor: system
        preconditions: ["visitor.status transitioned ACTIVE -> INACTIVE"]
        side_effects:
          - "visitor.committed_travel_days -= assignment.travel_days"
          - "visit.team_size -= 1 and visit.lead_visitor_id = null when team_role == LEAD"
          - "when the seat's visit was SCHEDULED and completeness broke, visit -> DRAFT which in turn drives cycle VISIT_SCHEDULED -> SELF_ASSESSMENT"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /accreditation/visits/{visitId}/finalize-scoring"
        actor: Visitor
        preconditions: ["visit.status == IN_PROGRESS"]
        side_effects: ["visitor.committed_travel_days is unchanged because COMPLETED remains inside the committed set"]

  # --- Visitor --------------------------------------------------------------
  - entity: Visitor
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /accreditation/visitors/{visitorId}/deactivate"
        actor: AccreditationOfficer
        preconditions: ["visitor.status == ACTIVE"]
        side_effects:
          - "every VisitAssignment of this visitor with status ASSIGNED -> WITHDRAWN"
          - "each of those withdrawals decrements visitor.committed_travel_days and may drive its AccreditationVisit SCHEDULED -> DRAFT"
          - "each such visit revert drives its AccreditationCycle VISIT_SCHEDULED -> SELF_ASSESSMENT"

  # --- StandardEvaluation: two independent dimensions on one row ------------
  - entity: StandardEvaluation
    dimension: self_status
    initial_state: DRAFT
    terminal_states: []
    note: "The self-assessment dimension. It moves on camp-side and plan-side events only; a write here never reads or writes visit_status on the same row."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment"
        actor: CampDirector
        preconditions:
          - "cycle.status == SELF_ASSESSMENT"
          - "evaluation.applicable == true"
          - "when self_score == MET and the pinned Standard.written_plan_type_required is not null, written_plan_id must reference a WrittenPlan of that plan_type belonging to the same camp with status VERIFIED"
        side_effects: ["recompute calculations.camp_risk_index under variant pre_visit"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment"
        actor: CampDirector
        preconditions: ["cycle.status == SELF_ASSESSMENT", "evaluation.applicable == true"]
        side_effects: ["recompute calculations.camp_risk_index under variant pre_visit"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /accreditation/cycles/{cycleId}/submit-self-assessment"
        actor: CampDirector
        preconditions: ["every applicable mandatory evaluation on the cycle has self_status == SUBMITTED"]
        side_effects: ["cycle.self_assessment_submitted_at = current logical clock", "recompute calculations.camp_risk_index under variant pre_visit"]
      - from: VERIFIED
        to: REJECTED
        trigger: "system event - the WrittenPlan referenced by written_plan_id transitioned VERIFIED -> REVALIDATION_REQUIRED"
        actor: system
        preconditions: ["evaluation.written_plan_id is not null", "that plan just entered REVALIDATION_REQUIRED"]
        side_effects: ["cycle.self_assessment_submitted_at is left untouched"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/written-plans/{planId}/review with decision REJECT on the plan referenced by written_plan_id"
        actor: AccreditationOfficer
        preconditions: ["evaluation.written_plan_id == planId"]
        side_effects: ["recompute calculations.camp_risk_index under variant pre_visit"]

  - entity: StandardEvaluation
    dimension: visit_status
    initial_state: UNSCORED
    terminal_states: [LOCKED]
    note: "The visit-scoring dimension. It moves on visitor events only; a write here never reads or writes self_status on the same row."
    transitions:
      - from: UNSCORED
        to: SCORED
        trigger: "PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"
        actor: Visitor
        preconditions:
          - "the cycle's non-RESCINDED visit has status IN_PROGRESS"
          - "an ASSIGNED VisitAssignment exists on that visit for X-User-ID"
          - "evaluation.applicable == true"
          - "when the pinned Standard.domain is in {AQUATICS, ADVENTURE, HEALTH_WELLNESS} the acting visitor must hold the matching certification (AQUATICS_SPECIALIST, ADVENTURE_SPECIALIST, HEALTH_SPECIALIST)"
        side_effects: ["evaluation.visit_id and evaluation.scored_by_visitor_id set", "recompute visit.mandatory_scored_count and visit.mandatory_met_count"]
      - from: SCORED
        to: SCORED
        trigger: "PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score re-scoring before finalize"
        actor: Visitor
        preconditions: ["visit.status == IN_PROGRESS", "evaluation.visit_status != LOCKED"]
        side_effects: ["evaluation.scored_by_visitor_id overwritten", "recompute visit.mandatory_scored_count and visit.mandatory_met_count"]
      - from: SCORED
        to: LOCKED
        trigger: "POST /accreditation/visits/{visitId}/finalize-scoring"
        actor: Visitor
        preconditions: ["visit.status == IN_PROGRESS"]
        side_effects: ["no further visitor_score writes are accepted on this row"]
      - from: UNSCORED
        to: LOCKED
        trigger: "POST /accreditation/visits/{visitId}/finalize-scoring for a non-mandatory applicable evaluation left unscored"
        actor: Visitor
        preconditions: ["evaluation.mandatory == false"]
        side_effects: ["the row enters the office_final denominator with visitor_score null, contributing zero to the numerator"]

  # --- WrittenPlan: VERIFIED can revert and be re-verified ------------------
  - entity: WrittenPlan
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /accreditation/written-plans/{planId}/review with decision VERIFY"
        actor: AccreditationOfficer
        preconditions: ["plan.status in {SUBMITTED, REVALIDATION_REQUIRED}", "when plan_type == HEALTH_CARE then physician_reviewed == true"]
        side_effects: ["plan.verified_at = current logical clock", "plan.reviewer_user_id = X-User-ID"]
      - from: REVALIDATION_REQUIRED
        to: VERIFIED
        trigger: "POST /accreditation/written-plans/{planId}/review with decision VERIFY"
        actor: AccreditationOfficer
        preconditions: ["camp.compliance_posture != FROZEN", "when plan_type == HEALTH_CARE then physician_reviewed == true"]
        side_effects: ["plan.verified_at = current logical clock", "plan.reviewer_user_id = X-User-ID"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/written-plans/{planId}/review with decision REJECT"
        actor: AccreditationOfficer
        preconditions: ["plan.status == SUBMITTED"]
        side_effects: ["every StandardEvaluation with written_plan_id == plan.id and self_status SUBMITTED -> REJECTED"]
      - from: VERIFIED
        to: REVALIDATION_REQUIRED
        trigger: "system event - camp.compliance_posture recomputed to FROZEN"
        actor: system
        preconditions: ["plan.status == VERIFIED", "the camp's posture just became FROZEN"]
        side_effects: ["every StandardEvaluation with written_plan_id == plan.id and self_status VERIFIED -> self_status REJECTED"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /accreditation/written-plans creating a newer plan of the same plan_type for the same camp"
        actor: CampDirector
        preconditions: ["the superseding request carries a current expected_camp_version"]
        side_effects: ["new plan.supersedes_plan_id = this plan.id"]
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "POST /accreditation/written-plans creating a newer plan of the same plan_type for the same camp"
        actor: CampDirector
        preconditions: ["the superseding request carries a current expected_camp_version"]
        side_effects: ["new plan.supersedes_plan_id = this plan.id", "every StandardEvaluation with written_plan_id == this plan and self_status VERIFIED -> self_status REJECTED"]
      - from: REVALIDATION_REQUIRED
        to: SUPERSEDED
        trigger: "POST /accreditation/written-plans creating a newer plan of the same plan_type for the same camp"
        actor: CampDirector
        preconditions: ["the superseding request carries a current expected_camp_version"]
        side_effects: ["new plan.supersedes_plan_id = this plan.id"]
      - from: REJECTED
        to: SUPERSEDED
        trigger: "POST /accreditation/written-plans creating a newer plan of the same plan_type for the same camp"
        actor: CampDirector
        preconditions: ["the superseding request carries a current expected_camp_version"]
        side_effects: ["new plan.supersedes_plan_id = this plan.id"]

  # --- Deficiency: revision loop PLAN_SUBMITTED -> OPEN -> PLAN_SUBMITTED ---
  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [CORRECTED, ESCALATED, WAIVED]
    transitions:
      - from: OPEN
        to: PLAN_SUBMITTED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/correction-plan"
        actor: CampDirector
        preconditions:
          - "cycle.status == IN_CORRECTION"
          - "the logical clock calendar date <= deficiency.correction_due_date"
          - "deficiency.plan_revision_count < 3"
        side_effects:
          - "deficiency.plan_revision_count += 1"
          - "deficiency.last_plan_submitted_at = current logical clock"
          - "camp.penalty_point_balance is unchanged because PLAN_SUBMITTED remains inside the counted set"
      - from: PLAN_SUBMITTED
        to: PLAN_SUBMITTED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/correction-plan replacing the pending plan before the office reviews it"
        actor: CampDirector
        preconditions:
          - "cycle.status == IN_CORRECTION"
          - "the logical clock calendar date <= deficiency.correction_due_date"
          - "deficiency.plan_revision_count < 3"
        side_effects:
          - "deficiency.plan_revision_count += 1"
          - "deficiency.correction_plan_text and deficiency.last_plan_submitted_at are overwritten"
          - "camp.penalty_point_balance is unchanged"
        note: "Self-loop: the camp may replace an unreviewed plan, which spends revision budget without any office action, so the fourth submission is refused by ERR_PLAN_REVISION_LIMIT."
      - from: PLAN_SUBMITTED
        to: OPEN
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/review with decision REJECT_PLAN"
        actor: AccreditationOfficer
        preconditions: ["deficiency.status == PLAN_SUBMITTED", "deficiency.plan_revision_count < 3"]
        side_effects: ["deficiency.reviewer_user_id = X-User-ID", "camp.penalty_point_balance is unchanged"]
        note: "This is the revision loop edge; the camp may resubmit a plan from OPEN."
      - from: PLAN_SUBMITTED
        to: ESCALATED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/review with decision REJECT_PLAN on the third revision"
        actor: AccreditationOfficer
        preconditions: ["deficiency.plan_revision_count == 3"]
        side_effects:
          - "cycle.status IN_CORRECTION -> TERMINATED"
          - "camp.accreditation_status = REVOKED"
          - "recompute camp.penalty_point_balance then calculations.camp_compliance_posture -> FROZEN"
      - from: PLAN_SUBMITTED
        to: PLAN_ACCEPTED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/review with decision ACCEPT_PLAN"
        actor: AccreditationOfficer
        preconditions: ["deficiency.status == PLAN_SUBMITTED"]
        side_effects:
          - "deficiency.penalty_points leave camp.penalty_point_balance because PLAN_ACCEPTED is outside the counted set"
          - "recompute calculations.camp_compliance_posture"
      - from: PLAN_ACCEPTED
        to: CORRECTED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/review with decision VERIFY_CORRECTION"
        actor: AccreditationOfficer
        preconditions: ["deficiency.status == PLAN_ACCEPTED", "the logical clock calendar date <= deficiency.correction_due_date"]
        side_effects: ["recompute cycle.open_deficiency_count", "when it reaches 0 the cycle moves IN_CORRECTION -> CLOSED"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /accreditation/deficiencies/{deficiencyId}/review with decision WAIVE"
        actor: AccreditationOfficer
        preconditions: ["deficiency.severity == SCORED"]
        side_effects:
          - "deficiency.penalty_points leave camp.penalty_point_balance"
          - "recompute calculations.camp_compliance_posture"
          - "recompute cycle.open_deficiency_count; when it reaches 0 the cycle moves IN_CORRECTION -> CLOSED"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /_clock/set_current_utc advancing the logical clock date past deficiency.correction_due_date"
        actor: system
        preconditions: ["deficiency.status == OPEN - a Deficiency in PLAN_SUBMITTED is sheltered from clock escalation while the office holds the pending plan, and is instead refused at review time by ERR_CORRECTION_WINDOW_EXPIRED", "correction_due_date < new clock calendar date"]
        side_effects: ["cycle.status IN_CORRECTION -> TERMINATED", "camp.accreditation_status = REVOKED", "recompute calculations.camp_compliance_posture -> FROZEN"]
      - from: PLAN_ACCEPTED
        to: ESCALATED
        trigger: "POST /_clock/set_current_utc advancing the logical clock date past deficiency.correction_due_date"
        actor: system
        preconditions: ["correction_due_date < new clock calendar date"]
        side_effects: ["deficiency.penalty_points re-enter camp.penalty_point_balance", "cycle.status IN_CORRECTION -> TERMINATED", "camp.accreditation_status = REVOKED"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /accreditation/cycles/{cycleId}/decision resolving decision_level DENIED"
        actor: AccreditationOfficer
        preconditions: ["cycle.status == VISIT_COMPLETED"]
        side_effects: ["recompute camp.penalty_point_balance then calculations.camp_compliance_posture"]

  # --- AnnualReport: ACCEPTED reverts to REOPENED on late disclosure --------
  - entity: AnnualReport
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/annual-reports/{reportId}/submit when the logical clock calendar date <= due_date"
        actor: CampDirector
        preconditions: ["report.status in {DRAFT, REJECTED, REOPENED}", "declared_incident_count >= report.disclosed_incident_count"]
        side_effects: ["report.submitted_at = current logical clock", "report.attested_by_user_id = X-User-ID"]
      - from: DRAFT
        to: LATE
        trigger: "POST /accreditation/annual-reports/{reportId}/submit when the logical clock calendar date > due_date"
        actor: CampDirector
        preconditions: ["report.status in {DRAFT, REJECTED, REOPENED}", "declared_incident_count >= report.disclosed_incident_count"]
        side_effects: ["report.submitted_at = current logical clock", "report.attested_by_user_id = X-User-ID"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /accreditation/annual-reports/{reportId}/submit when the logical clock calendar date <= due_date"
        actor: CampDirector
        preconditions: ["declared_incident_count >= report.disclosed_incident_count"]
        side_effects: ["report.submitted_at and report.attested_by_user_id restamped"]
      - from: REOPENED
        to: LATE
        trigger: "POST /accreditation/annual-reports/{reportId}/submit when the logical clock calendar date > due_date"
        actor: CampDirector
        preconditions: ["declared_incident_count >= report.disclosed_incident_count"]
        side_effects: ["report.submitted_at and report.attested_by_user_id restamped"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with decision ACCEPT"
        actor: AccreditationOfficer
        preconditions: ["report.status in {SUBMITTED, LATE}"]
        side_effects: []
      - from: LATE
        to: ACCEPTED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with decision ACCEPT"
        actor: AccreditationOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with decision REJECT"
        actor: AccreditationOfficer
        preconditions: ["report.status in {SUBMITTED, LATE}"]
        side_effects: []
      - from: LATE
        to: REJECTED
        trigger: "POST /accreditation/annual-reports/{reportId}/review with decision REJECT"
        actor: AccreditationOfficer
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: REOPENED
        trigger: "POST /accreditation/incident-disclosures against an ACCEPTED report"
        actor: CampDirector
        preconditions: ["the disclosure's occurred_at calendar year == report.report_year"]
        side_effects:
          - "the new IncidentDisclosure is stamped status LATE_DISCLOSED"
          - "report.reopen_count += 1"
          - "recompute report.disclosed_incident_count"
          - "recompute calculations.camp_risk_index (the late-disclosure multiplier now applies)"
      - from: ACCEPTED
        to: ARCHIVED
        trigger: "system event - an AccreditationCycle of the same camp with a later cycle_year reaches CLOSED"
        actor: system
        preconditions: ["report.status == ACCEPTED", "report.report_year < cycle.cycle_year"]
        side_effects: ["no further submissions or disclosures are accepted against this report"]

# ============================================================================
# 1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: cycle-create-stale-camp
    parent_entity: Camp
    write_endpoint: "POST /accreditation/cycles"
    occ_field: "expected_camp_version"
    description: |
      Opening an AccreditationCycle for a Camp whose version has advanced since
      the client last observed it is rejected. A newly opened cycle legitimately
      supersedes any prior cycle of the same camp still in SELF_ASSESSMENT
      (terminating it and rescinding its visit), so a second create against a
      stale camp view would silently discard a cycle the client never saw.
    error_id: ERR_STALE_CAMP_VERSION
    http_status: 412

  - rule_id: written-plan-create-stale-camp
    parent_entity: Camp
    write_endpoint: "POST /accreditation/written-plans"
    occ_field: "expected_camp_version"
    description: |
      Filing a WrittenPlan whose plan_type already exists on the Camp is a
      supersede: the prior plan of that type moves to SUPERSEDED and any
      StandardEvaluation citing it as VERIFIED evidence is knocked back to
      REJECTED. A request carrying a camp version older than the stored one is
      rejected, because the client's view of which plan is currently in force is
      stale.
    error_id: ERR_STALE_CAMP_VERSION
    http_status: 412

  - rule_id: visit-create-stale-cycle
    parent_entity: AccreditationCycle
    write_endpoint: "POST /accreditation/visits"
    occ_field: "expected_cycle_version"
    description: |
      Creating an AccreditationVisit for a cycle that already carries a DRAFT or
      SCHEDULED visit is a supersede: the prior visit moves to RESCINDED and its
      seats are withdrawn. A request carrying a cycle version older than the
      stored one is rejected, because the client's view of the standing visit and
      its seated team is stale.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================
calculations:

  - name: standard_applicability_determination
    trigger: "POST /accreditation/cycles - once per Standard in the pinned StandardsSet, materializing one StandardEvaluation row each"
    algorithm: constraint_propagation
    formula: |
      # Evaluated per (camp, standard) in exactly this gate order. The verdict is
      # frozen onto StandardEvaluation.applicable and never recomputed, even if
      # the camp later changes program_elements or state_license_status.
      applicable = TRUE
      # gate 1 - camp type
      if standard.applies_to_camp_types is non-empty
         and camp.camp_type NOT IN standard.applies_to_camp_types:
             applicable = FALSE
      # gate 2 - program element (any-of)
      if standard.requires_program_elements_any is non-empty
         and intersection(camp.program_elements,
                          standard.requires_program_elements_any) is empty:
             applicable = FALSE
      # gate 3 - population served
      if standard.applies_to_populations is non-empty
         and camp.population_served NOT IN standard.applies_to_populations:
             applicable = FALSE
      # gate 4 - state licensure
      if standard.requires_state_licensed == TRUE
         and camp.state_license_status NOT IN {ACTIVE, PROBATION}:
             applicable = FALSE

      evaluation.applicable      = applicable
      evaluation.mandatory       = standard.mandatory        # pinned copy
      evaluation.scoring_weight  = standard.scoring_weight   # pinned copy

      cycle.applicable_standard_count  = count(rows with applicable == TRUE)
      cycle.applicable_mandatory_count = count(rows with applicable == TRUE
                                                     and mandatory == TRUE)
    input_set: "every Standard whose standards_set_id equals the cycle's pinned standards_set_id, regardless of the Standard's own creation order; an empty gate array means the gate does not exclude"
    constants:
      LICENSED_STATUSES: [ACTIVE, PROBATION]
    precision: "boolean verdict; counts are integers"

  - name: required_health_staffing_level
    trigger: "POST /accreditation/camps and PATCH /accreditation/camps/{campId}/health-center"
    algorithm: threshold
    formula: |
      LEVEL_RANK = {NONE:0, FIRST_AIDER_ONLY:1, LPN_ONSITE:2, RN_ONSITE:3,
                    PHYSICIAN_ONSITE:4}

      r_type   = 1 if camp.camp_type == DAY
                 else 3 if camp.camp_type == RESIDENT
                 else 2                                    # TRAVEL_TRIP, FAMILY, SPECIAL_NEEDS
      r_pop    = 4 if camp.population_served == MEDICALLY_FRAGILE
                 else 2 if camp.population_served == ADULT_INCLUSIVE
                 else 1                                    # YOUTH_ONLY
      r_census = 1 if camp.resident_census <= 50
                 else 2 if camp.resident_census <= 120
                 else 3
      r_dist   = 3 if camp.distance_to_hospital_km >= 40
                 else 2 if camp.distance_to_hospital_km >= 20
                 else 1
      r_prog   = 3 if (AQUATICS_OPEN_WATER in camp.program_elements
                       or ADVENTURE_CLIMBING in camp.program_elements)
                 else 1

      components = [r_type, r_pop, r_census, r_dist, r_prog]
      base = max(components)
      bump = 1 if count(c in components where c >= 2) >= 3 else 0
      required_rank = min(4, base + bump)
      camp.required_health_staffing_level = the level whose LEVEL_RANK == required_rank
    input_set: "the five camp configuration fields listed; no other entity is read"
    constants:
      LEVEL_RANK: { NONE: 0, FIRST_AIDER_ONLY: 1, LPN_ONSITE: 2, RN_ONSITE: 3, PHYSICIAN_ONSITE: 4 }
      CENSUS_BREAKS: [50, 120]
      DISTANCE_BREAKS_KM: [20, 40]
      COMBINATION_BUMP_MIN_COMPONENTS: 3
      COMBINATION_BUMP_RANK_FLOOR: 2
    precision: "integer rank, then enum lookup; min/max evaluated after every component branch resolves"

  - name: mandatory_compliance_score
    trigger: "variant visit_provisional on POST /accreditation/visits/{visitId}/finalize-scoring; variant office_final on POST /accreditation/cycles/{cycleId}/decision"
    algorithm: aggregation
    formula: |
      # Both variants read the SAME StandardEvaluation rows of the SAME cycle.
      # They differ only in the inclusion set, and therefore produce different
      # percentages for identical stored data.
      pct(numerator, denominator) =
          100.00 if denominator == 0
          else round_half_up(100 * numerator / denominator, 2)
    input_set: "StandardEvaluation rows where cycle_id == cycle.id AND applicable == TRUE AND mandatory == TRUE; the two variants filter this base set differently"
    constants:
      EMPTY_DENOMINATOR_RESULT: 100.00
      PROVISIONAL_SOURCES: [OBSERVED, DOCUMENT]
    precision: "2 decimal places, round_half_up"
    variants:
      - name: visit_provisional
        when: "computed by the visiting team at POST /accreditation/visits/{visitId}/finalize-scoring; written to AccreditationVisit.provisional_mandatory_pct and AccreditationCycle.provisional_mandatory_pct"
        difference: |
          denominator = count(base rows where score_source IN {OBSERVED, DOCUMENT}
                                          AND visitor_score != NOT_APPLICABLE
                                          AND visitor_score IS NOT NULL)
          numerator   = count(those rows where visitor_score == MET)
          INTERVIEW-sourced rows are excluded entirely, and a visitor's
          NOT_APPLICABLE call removes the row from both sides.
      - name: office_final
        when: "computed by the national office at POST /accreditation/cycles/{cycleId}/decision; written to AccreditationCycle.final_mandatory_pct"
        difference: |
          denominator = count(base rows)          # every applicable mandatory row
          numerator   = count(base rows where visitor_score == MET)
          INTERVIEW-sourced MET rows now count in the numerator, and rows the
          visitor marked NOT_APPLICABLE or left unscored stay in the denominator
          with no numerator credit - the office does not accept a field
          not-applicable call on a mandatory standard.

  - name: camp_risk_index
    trigger: "POST /accreditation/camps, PATCH /accreditation/camps/{campId}/state-license, PATCH /accreditation/camps/{campId}/health-center, PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment, POST /accreditation/cycles, POST /accreditation/cycles/{cycleId}/submit-self-assessment, POST /accreditation/visits/{visitId}/finalize-scoring, POST /accreditation/incident-disclosures"
    algorithm: weighted_scoring
    formula: |
      INCIDENT_WEIGHT = {DEATH:25, ABUSE_ALLEGATION:20, HOSPITALIZATION:12,
                         SERIOUS_INJURY:8, COMMUNICABLE_DISEASE_OUTBREAK:8,
                         TRANSPORTATION_COLLISION:6, AQUATICS_RESCUE:5,
                         MEDICATION_ERROR:4}
      ELEMENT_WEIGHT  = {AQUATICS_OPEN_WATER:8, ADVENTURE_CLIMBING:7,
                         ADVENTURE_CHALLENGE_COURSE:6, HORSEBACK:6,
                         AQUATICS_POOL:5, TRANSPORTATION:4, TRIP_CAMPING:3}
      POPULATION_MULT = {MEDICALLY_FRAGILE:1.4, ADULT_INCLUSIVE:1.1, YOUTH_ONLY:1.0}
      LICENSE_PENALTY = {NONE:6, PENDING:4, ACTIVE:0, PROBATION:10, SUSPENDED:20}
      LATE_DISCLOSURE_MULT = 1.5
      LEVEL_RANK = as in calculations.required_health_staffing_level

      # (1) incident component - disclosures under this camp's AnnualReports whose
      #     occurred_at calendar year >= (logical clock calendar year - 2)
      incident_component =
          sum over qualifying IncidentDisclosure d of
              round_half_up(INCIDENT_WEIGHT[d.incident_type]
                            * (LATE_DISCLOSURE_MULT if d.status == LATE_DISCLOSED else 1.0), 2)
          # per-disclosure rounding first, then summation

      # (2) program component
      program_component = sum over e in camp.program_elements of ELEMENT_WEIGHT[e]

      # (3) staffing gap
      staffing_gap_penalty =
          15 if LEVEL_RANK[camp.health_staffing_level]
               < LEVEL_RANK[camp.required_health_staffing_level] else 0

      # (4) licensing
      license_penalty = LICENSE_PENALTY[camp.state_license_status]

      # (5) compliance component - variant dependent, see variants below
      raw = RISK_BASE + incident_component + program_component
            + staffing_gap_penalty + license_penalty + compliance_component
      camp.risk_index = round_half_up(min(100.00, raw * POPULATION_MULT[camp.population_served]), 2)
    input_set: "the camp row, its program_elements, every IncidentDisclosure under its AnnualReports inside the three-year window, and - per variant - either the StandardEvaluation self scores or the Deficiency rows of the camp's newest cycle by cycle_year DESC then created_at ASC"
    constants:
      RISK_BASE: 10.0
      COMPLIANCE_COMPONENT_MAX: 30
      INCIDENT_WINDOW_YEARS: 3
      LATE_DISCLOSURE_MULT: 1.5
      STAFFING_GAP_PENALTY: 15
      RISK_CEILING: 100.00
    precision: "2 decimal places, round_half_up; per-disclosure incident weights are rounded before summation"
    variants:
      - name: pre_visit
        when: "the camp's newest AccreditationCycle has status in {SELF_ASSESSMENT, VISIT_SCHEDULED}, or the camp has no cycle at all; stamps camp.risk_index_variant = PRE_VISIT"
        difference: |
          compliance_component = round_half_up(
              30 * count(StandardEvaluation of the newest cycle where applicable
                         AND mandatory AND (self_score IS NULL OR self_score != MET))
                 / max(1, cycle.applicable_mandatory_count), 2)
          With no cycle at all the compliance_component is 0.
      - name: post_visit
        when: "the camp's newest AccreditationCycle has status in {VISIT_COMPLETED, IN_CORRECTION, CLOSED, TERMINATED}; stamps camp.risk_index_variant = POST_VISIT"
        difference: |
          compliance_component = round_half_up(
              30 * count(Deficiency on the cycle's non-RESCINDED visit where
                         severity IN {MANDATORY_CRITICAL, MANDATORY}
                         AND status IN {OPEN, PLAN_SUBMITTED, ESCALATED})
                 / max(1, cycle.applicable_mandatory_count), 2)
          Self-assessment scores are ignored entirely; the same stored rows
          therefore yield a different index than the pre_visit variant.

  - name: deficiency_penalty_and_deadline
    trigger: "POST /accreditation/visits/{visitId}/finalize-scoring - one pass over every applicable StandardEvaluation with visitor_score NOT_MET"
    algorithm: tiered_pricing
    formula: |
      SEVERITY_POINTS       = {MANDATORY_CRITICAL: 8, MANDATORY: 5, SCORED: 2}
      CRITICAL_DOMAINS      = {HEALTH_WELLNESS, EMERGENCY_RESPONSE, AQUATICS}
      ESCALATION_SURCHARGE  = {0: 0, 1: 2, 2: 5}
      CORRECTION_WINDOW_DAYS= {0: 90, 1: 60, 2: 30}

      # step 0 - severity per finding
      severity = MANDATORY_CRITICAL if evaluation.mandatory
                                       and standard.domain IN CRITICAL_DOMAINS
                 else MANDATORY      if evaluation.mandatory
                 else SCORED

      # step 1 - base points per finding, using the PINNED scoring_weight
      base_points = SEVERITY_POINTS[severity] * evaluation.scoring_weight

      # step 2 - tier selected from the BASE total of this finalize batch only.
      #          The surcharge is deliberately NOT keyed on the post-surcharge
      #          total, which would be circular; evaluation order is pinned here.
      batch_base_total = sum of base_points over every finding created by THIS
                         finalize-scoring call
      tier = 0 if batch_base_total <= 9
             else 1 if batch_base_total <= 19
             else 2

      # step 3 - surcharge applied uniformly to each finding in the batch
      penalty_points = base_points + ESCALATION_SURCHARGE[tier]

      # step 4 - deadline, from the same tier
      correction_due_date = (logical clock calendar date)
                            + CORRECTION_WINDOW_DAYS[tier] days

      # step 5 - ledger roll-up
      camp.penalty_point_balance = sum of penalty_points over every Deficiency of
          this camp whose status IN {OPEN, PLAN_SUBMITTED, ESCALATED}
    input_set: "applicable StandardEvaluation rows of the cycle with visitor_score == NOT_MET, processed in created_at ASC order; the batch tier is computed once from the complete batch before any penalty_points is written"
    constants:
      SEVERITY_POINTS: { MANDATORY_CRITICAL: 8, MANDATORY: 5, SCORED: 2 }
      CRITICAL_DOMAINS: [HEALTH_WELLNESS, EMERGENCY_RESPONSE, AQUATICS]
      TIER_BASE_BREAKS: [9, 19]
      ESCALATION_SURCHARGE: { 0: 0, 1: 2, 2: 5 }
      CORRECTION_WINDOW_DAYS: { 0: 90, 1: 60, 2: 30 }
    precision: "integer points; dates are calendar dates in UTC"

  - name: camp_compliance_posture
    trigger: "every write that changes camp.penalty_point_balance, camp.state_license_status, camp.health_staffing_level, camp.required_health_staffing_level, or any Deficiency.status of the camp"
    algorithm: threshold
    formula: |
      LEVEL_RANK = as in calculations.required_health_staffing_level
      escalated_exists = EXISTS Deficiency d of this camp with d.status == ESCALATED

      if camp.penalty_point_balance >= 12
         or camp.state_license_status == SUSPENDED
         or escalated_exists:
             posture = FROZEN
      elif camp.penalty_point_balance >= 5
         or camp.state_license_status IN {PENDING, PROBATION}
         or LEVEL_RANK[camp.health_staffing_level]
            < LEVEL_RANK[camp.required_health_staffing_level]:
             posture = RESTRICTED
      else:
             posture = OPEN

      # posture side effects, applied in this order
      if posture == FROZEN:
          camp.health_intake_status = SUSPENDED
          every WrittenPlan of the camp with status VERIFIED -> REVALIDATION_REQUIRED
          every StandardEvaluation whose written_plan_id is one of those plans and
              whose self_status == VERIFIED -> self_status = REJECTED
      else:
          camp.health_intake_status = OPEN
    input_set: "the camp row plus every Deficiency of the camp reached through Deficiency.visit_id -> AccreditationVisit.cycle_id -> AccreditationCycle.camp_id"
    constants:
      FROZEN_POINT_THRESHOLD: 12
      RESTRICTED_POINT_THRESHOLD: 5
    precision: "integer comparisons; both thresholds are inclusive (>=)"

  - name: accreditation_decision_level
    trigger: "POST /accreditation/cycles/{cycleId}/decision, after mandatory_compliance_score variant office_final has been stamped"
    algorithm: threshold
    formula: |
      applicable_rows = StandardEvaluation where cycle_id == cycle.id and applicable

      cycle.final_weighted_pct = round_half_up(
          100 * sum(r.scoring_weight for r in applicable_rows if r.visitor_score == MET)
              / sum(r.scoring_weight for r in applicable_rows), 2)
      # when the applicable weight total is 0 the weighted percentage is 100.00

      if camp.state_license_status == SUSPENDED
         or cycle.final_mandatory_pct < 90.00:                level = DENIED
      elif cycle.final_mandatory_pct < 100.00:                level = PROVISIONAL
      elif cycle.final_weighted_pct  < 95.00:                 level = ACCREDITED_WITH_CORRECTION
      else:                                                   level = ACCREDITED

      target cycle status = TERMINATED           if level == DENIED
                            else IN_CORRECTION   if cycle.open_deficiency_count > 0
                            else CLOSED
      camp.accreditation_status = {ACCREDITED: ACCREDITED,
                                   ACCREDITED_WITH_CORRECTION: ACCREDITED_WITH_CORRECTION,
                                   PROVISIONAL: PROVISIONAL,
                                   DENIED: REVOKED}[level]
    input_set: "every applicable StandardEvaluation of the cycle (mandatory and non-mandatory alike) plus the camp's state_license_status read at decision time"
    constants:
      MANDATORY_FLOOR_PCT: 90.00
      MANDATORY_FULL_PCT: 100.00
      WEIGHTED_ACCREDITED_PCT: 95.00
      EMPTY_WEIGHT_RESULT: 100.00
    precision: "2 decimal places, round_half_up; all three thresholds are inclusive on the upper side (>=)"

  - name: accreditation_fee_assessment
    trigger: "POST /accreditation/cycles/{cycleId}/decision - on every branch, including DENIED"
    algorithm: tiered_pricing
    formula: |
      BASE_FEE_CENTS      = 95000
      PER_STANDARD_CENTS  = 350
      VISITOR_DAY_CENTS   = 24000
      VISITOR_DAY_FACTOR  = 0.75
      DOMAIN_SURCHARGE_CENTS = {AQUATICS: 18125, ADVENTURE: 22125,
                                TRANSPORTATION: 12125, HEALTH_WELLNESS: 15125,
                                SUPERVISION: 0, EMERGENCY_RESPONSE: 0,
                                OPERATIONS: 0}
      MULTI_YEAR_DISCOUNT_PCT = {0: 0.00, 1: 0.05, 2: 0.10}

      discount_pct = MULTI_YEAR_DISCOUNT_PCT[min(2, camp.prior_accredited_cycle_count)]
      team_travel_days = sum of VisitAssignment.travel_days over the cycle's
                         non-RESCINDED visit where status IN {ASSIGNED, COMPLETED}
      domains_present  = the DISTINCT set of Standard.domain values over the
                         cycle's applicable StandardEvaluation rows

      # ROUNDING ORDER IS PINNED: each line item is rounded to whole cents with
      # round_half_up FIRST, and only then are the line items summed. Summing the
      # raw products and rounding once at the end is NOT the rule and yields a
      # different total (it differs by 1 cent whenever four .75-fraction domain
      # lines are present under a 5 percent discount).
      L1 = BASE_FEE_CENTS
      L2 = round_half_up(PER_STANDARD_CENTS * cycle.applicable_standard_count
                         * (1 - discount_pct))
      L3 = sum over d in domains_present, ordered by the DOMAIN_SURCHARGE_CENTS key
           order above, of round_half_up(DOMAIN_SURCHARGE_CENTS[d] * (1 - discount_pct))
      L4 = round_half_up(VISITOR_DAY_CENTS * team_travel_days * VISITOR_DAY_FACTOR
                         * (1 - discount_pct))
      cycle.assessed_fee_cents = L1 + L2 + L3 + L4
    input_set: "cycle.applicable_standard_count, the distinct domains of the cycle's applicable evaluations, the ASSIGNED plus COMPLETED assignment travel days of the cycle's non-RESCINDED visit, and camp.prior_accredited_cycle_count read at decision time"
    constants:
      BASE_FEE_CENTS: 95000
      PER_STANDARD_CENTS: 350
      VISITOR_DAY_CENTS: 24000
      VISITOR_DAY_FACTOR: 0.75
      DOMAIN_SURCHARGE_CENTS: { AQUATICS: 18125, ADVENTURE: 22125, TRANSPORTATION: 12125, HEALTH_WELLNESS: 15125, SUPERVISION: 0, EMERGENCY_RESPONSE: 0, OPERATIONS: 0 }
      MULTI_YEAR_DISCOUNT_PCT: { 0: 0.00, 1: 0.05, 2: 0.10 }
    precision: "whole cents, round_half_up, applied per line item before summation"

  - name: controlled_substance_ledger
    trigger: "PATCH /accreditation/camps/{campId}/health-center with controlled_intake_units_added, POST /accreditation/medication-records, POST /accreditation/medication-records/{recordId}/void"
    algorithm: aggregation
    formula: |
      consumed = sum of MedicationAdministrationRecord.dose_units where
                 camp_id == camp.id
                 AND medication_class == CONTROLLED
                 AND record_status == RECORDED
      camp.controlled_on_hand_units = camp.controlled_intake_units - consumed

      # CONSERVED QUANTITY (must hold after every request, including the
      # compensating void):
      #   camp.controlled_on_hand_units + consumed == camp.controlled_intake_units
    input_set: "every MedicationAdministrationRecord of the camp with medication_class CONTROLLED and record_status RECORDED; VOIDED records leave the consumed set entirely"
    constants:
      MAX_CONTROLLED_PER_24H: 2
      CONTROLLED_WINDOW_HOURS: 24
    precision: "integer units; camp.controlled_on_hand_units may never go negative"

  - name: visitor_travel_commitment
    trigger: "POST /accreditation/visit-assignments, POST /accreditation/visit-assignments/{assignmentId}/withdraw, POST /accreditation/visitors/{visitorId}/deactivate, POST /accreditation/visits (supersede path), POST /accreditation/visits/{visitId}/finalize-scoring"
    algorithm: aggregation
    formula: |
      assignment.travel_days = (travel_block_end_date - travel_block_start_date)
                               in whole days + 1          # closed interval
      visitor.committed_travel_days =
          sum of travel_days over VisitAssignment where visitor_id == visitor.id
          AND status IN {ASSIGNED, COMPLETED}

      # CONSERVED QUANTITY: for any assign-then-withdraw pair on the same visitor,
      #   visitor.committed_travel_days after the withdrawal
      #   == visitor.committed_travel_days before the assignment
      # A finalize-scoring pass moves ASSIGNED -> COMPLETED, which is inside the
      # counted set, so the quantity is deliberately unchanged there.
    input_set: "VisitAssignment rows of the visitor with status in {ASSIGNED, COMPLETED}; WITHDRAWN rows are excluded"
    constants:
      TRAVEL_BUFFER_DAYS: 2
    precision: "integer days, closed inclusive interval arithmetic"

# ============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# ============================================================================
validations:

  # --- auth (1-2) -----------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in section 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # --- schema (3) -----------------------------------------------------------
  - priority: 3
    category: business_constraint
    check: "request body parses, every required input field is present and non-null, every enum value belongs to its declared domain, integers are non-negative where declared, dates are ISO-8601 calendar dates and timestamps are ISO-8601 UTC instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints and every endpoint with query parameters"

  # --- existence (4-16), validated left-to-right in the path then in input order
  - priority: 4
    category: existence
    check: "campId path parameter or camp_id input resolves to a Camp"
    error_id: ERR_CAMP_NOT_FOUND
    http_status: 404
    applies_to: "GET/PATCH /accreditation/camps/{campId}*, POST /accreditation/cycles, POST /accreditation/written-plans, POST /accreditation/visitors, POST /accreditation/medication-records, POST /accreditation/annual-reports"
  - priority: 5
    category: existence
    check: "setId path parameter or standards_set_id input resolves to a StandardsSet"
    error_id: ERR_STANDARDS_SET_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/standards-sets/{setId}, POST /accreditation/standards-sets/{setId}/publish, POST /accreditation/standards, POST /accreditation/cycles"
  - priority: 6
    category: existence
    check: "standardId path parameter resolves to a Standard"
    error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/standards/{standardId}"
  - priority: 7
    category: existence
    check: "cycleId path parameter or cycle_id input resolves to an AccreditationCycle"
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/cycles/{cycleId}, GET /accreditation/cycles/{cycleId}/compliance-summary, POST /accreditation/cycles/{cycleId}/submit-self-assessment, POST /accreditation/cycles/{cycleId}/decision, POST /accreditation/visits"
  - priority: 8
    category: existence
    check: "evaluationId path parameter resolves to a StandardEvaluation"
    error_id: ERR_EVALUATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/standard-evaluations/{evaluationId}, PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment, PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"
  - priority: 9
    category: existence
    check: "planId path parameter or written_plan_id input resolves to a WrittenPlan"
    error_id: ERR_WRITTEN_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/written-plans/{planId}, POST /accreditation/written-plans/{planId}/review, PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment"
  - priority: 10
    category: existence
    check: "visitorId path parameter or visitor_id input resolves to a Visitor"
    error_id: ERR_VISITOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/visitors/{visitorId}, POST /accreditation/visitors/{visitorId}/deactivate, POST /accreditation/visit-assignments"
  - priority: 11
    category: existence
    check: "visitId path parameter or visit_id input resolves to an AccreditationVisit"
    error_id: ERR_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/visits/{visitId}, POST /accreditation/visits/{visitId}/schedule, POST /accreditation/visits/{visitId}/start, POST /accreditation/visits/{visitId}/finalize-scoring, POST /accreditation/visit-assignments"
  - priority: 12
    category: existence
    check: "assignmentId path parameter resolves to a VisitAssignment"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/visit-assignments/{assignmentId}, POST /accreditation/visit-assignments/{assignmentId}/withdraw"
  - priority: 13
    category: existence
    check: "deficiencyId path parameter resolves to a Deficiency"
    error_id: ERR_DEFICIENCY_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/deficiencies/{deficiencyId}, POST /accreditation/deficiencies/{deficiencyId}/correction-plan, POST /accreditation/deficiencies/{deficiencyId}/review"
  - priority: 14
    category: existence
    check: "recordId path parameter resolves to a MedicationAdministrationRecord"
    error_id: ERR_MED_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/medication-records/{recordId}, POST /accreditation/medication-records/{recordId}/void"
  - priority: 15
    category: existence
    check: "reportId path parameter or annual_report_id input resolves to an AnnualReport"
    error_id: ERR_ANNUAL_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/annual-reports/{reportId}, POST /accreditation/annual-reports/{reportId}/submit, POST /accreditation/annual-reports/{reportId}/review, POST /accreditation/incident-disclosures"
  - priority: 16
    category: existence
    check: "disclosureId path parameter resolves to an IncidentDisclosure"
    error_id: ERR_DISCLOSURE_NOT_FOUND
    http_status: 404
    applies_to: "GET /accreditation/incident-disclosures/{disclosureId}"

  # --- ownership / segregation of duties (17-18) ----------------------------
  - priority: 17
    category: auth
    check: "for CampDirector and HealthCareStaff, X-User-ID equals the camp_id reached from the target resource; for Visitor, X-User-ID must equal visit.lead_visitor_id on POST /accreditation/visits/{visitId}/start and POST /accreditation/visits/{visitId}/finalize-scoring, and must hold an ASSIGNED VisitAssignment on the cycle's IN_PROGRESS visit on PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "every camp-scoped and visitor-scoped read and write"
  - priority: 18
    category: auth
    check: "on POST /accreditation/cycles/{cycleId}/decision the acting X-User-ID must differ from the visit's scheduled_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /accreditation/cycles/{cycleId}/decision"

  # --- optimistic concurrency (19-20) --------------------------------------
  - priority: 19
    category: state
    check: "expected_camp_version equals the Camp's current version"
    error_id: ERR_STALE_CAMP_VERSION
    http_status: 412
    applies_to: "POST /accreditation/cycles, POST /accreditation/written-plans"
  - priority: 20
    category: state
    check: "expected_cycle_version equals the AccreditationCycle's current version"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /accreditation/visits"

  # --- state preconditions (21-29) -----------------------------------------
  - priority: 21
    category: state
    check: "the StandardsSet status is DRAFT when a standard is added to it or when it is published"
    error_id: ERR_STANDARDS_SET_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /accreditation/standards, POST /accreditation/standards-sets/{setId}/publish"
  - priority: 22
    category: state
    check: "the StandardsSet a cycle pins has status PUBLISHED"
    error_id: ERR_STANDARDS_SET_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /accreditation/cycles"
  - priority: 23
    category: state
    check: "the AccreditationCycle is in the status the operation requires - SELF_ASSESSMENT for self-assessment edits, submit-self-assessment and visit creation; VISIT_COMPLETED for decision"
    error_id: ERR_CYCLE_NOT_IN_SELF_ASSESSMENT
    http_status: 409
    applies_to: "PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment, POST /accreditation/cycles/{cycleId}/submit-self-assessment, POST /accreditation/visits, POST /accreditation/cycles/{cycleId}/decision"
  - priority: 24
    category: state
    check: "the AccreditationVisit is in the status the operation requires - DRAFT for schedule and assignment changes, SCHEDULED for start, IN_PROGRESS for visitor scoring and finalize-scoring"
    error_id: ERR_VISIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /accreditation/visits/{visitId}/schedule, POST /accreditation/visits/{visitId}/start, POST /accreditation/visits/{visitId}/finalize-scoring, POST /accreditation/visit-assignments, POST /accreditation/visit-assignments/{assignmentId}/withdraw, PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"
  - priority: 25
    category: state
    check: "the Deficiency is in the status the operation requires - OPEN or PLAN_SUBMITTED for correction-plan, PLAN_SUBMITTED for ACCEPT_PLAN and REJECT_PLAN, PLAN_ACCEPTED for VERIFY_CORRECTION, OPEN for WAIVE"
    error_id: ERR_DEFICIENCY_INVALID_STATE
    http_status: 409
    applies_to: "POST /accreditation/deficiencies/{deficiencyId}/correction-plan, POST /accreditation/deficiencies/{deficiencyId}/review"
  - priority: 26
    category: state
    check: "the AnnualReport is in the status the operation requires - DRAFT, REJECTED or REOPENED for submit; SUBMITTED or LATE for review; anything but ARCHIVED for incident-disclosure creation"
    error_id: ERR_ANNUAL_REPORT_INVALID_STATE
    http_status: 409
    applies_to: "POST /accreditation/annual-reports/{reportId}/submit, POST /accreditation/annual-reports/{reportId}/review, POST /accreditation/incident-disclosures"
  - priority: 27
    category: state
    check: "the StandardEvaluation's visit_status is not LOCKED when a visitor score is written, and its self_status is not VERIFIED when a self score is written"
    error_id: ERR_EVALUATION_LOCKED
    http_status: 409
    applies_to: "PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score, PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment"
  - priority: 28
    category: state
    check: "every Visitor referenced by an assignment has status ACTIVE, and a deactivation target has status ACTIVE"
    error_id: ERR_VISITOR_INACTIVE
    http_status: 409
    applies_to: "POST /accreditation/visit-assignments, POST /accreditation/visitors/{visitorId}/deactivate"
  - priority: 29
    category: state
    check: "the Camp's compliance_posture is not FROZEN when a new AccreditationCycle is opened, a visit is scheduled or started, or a CONTROLLED or PRESCRIPTION medication record is created"
    error_id: ERR_CAMP_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /accreditation/cycles, POST /accreditation/visits/{visitId}/schedule, POST /accreditation/visits/{visitId}/start, POST /accreditation/medication-records"

  # --- business_safety (30-38) ---------------------------------------------
  - priority: 30
    category: business_safety
    check: "the Camp's state_license_status is in {NONE, ACTIVE, PROBATION} when a visit is scheduled; SUSPENDED and PENDING block scheduling"
    error_id: ERR_STATE_LICENSE_BLOCKS_VISIT
    http_status: 422
    applies_to: "POST /accreditation/visits/{visitId}/schedule"
  - priority: 31
    category: business_safety
    check: "a self_score of MET on a standard whose written_plan_type_required is non-null requires written_plan_id to reference a WrittenPlan of that plan_type with status VERIFIED"
    error_id: ERR_WRITTEN_PLAN_NOT_VERIFIED
    http_status: 422
    applies_to: "PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment"
  - priority: 32
    category: business_safety
    check: "the Camp's health_staffing_level rank is at least the medication class minimum - CONTROLLED requires rank 3, PRESCRIPTION rank 2, OTC rank 1 - and at least required_health_staffing_level when a self-assessment is submitted"
    error_id: ERR_HEALTH_STAFFING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /accreditation/medication-records, POST /accreditation/cycles/{cycleId}/submit-self-assessment"
  - priority: 33
    category: business_safety
    check: "a WrittenPlan of plan_type HEALTH_CARE may only be VERIFIED when physician_reviewed is true"
    error_id: ERR_PHYSICIAN_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /accreditation/written-plans/{planId}/review"
  - priority: 34
    category: business_safety
    check: "the seated Visitor's employer_camp_id must not equal the camp under review, and for a LEAD seat the visitor's home_state_code must not equal the camp's state_code"
    error_id: ERR_VISITOR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /accreditation/visit-assignments"
  - priority: 35
    category: business_safety
    check: "when the pinned Standard.domain is AQUATICS, ADVENTURE or HEALTH_WELLNESS the acting visitor must hold AQUATICS_SPECIALIST, ADVENTURE_SPECIALIST or HEALTH_SPECIALIST respectively"
    error_id: ERR_SPECIALIST_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"
  - priority: 36
    category: business_safety
    check: "administered_by_role is permitted for the medication_class - CONTROLLED accepts RN and PHYSICIAN only, PRESCRIPTION accepts LPN, RN and PHYSICIAN, OTC accepts FIRST_AIDER, LPN, RN and PHYSICIAN but never UNLICENSED_DESIGNEE"
    error_id: ERR_MED_ROLE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /accreditation/medication-records"
  - priority: 37
    category: business_safety
    check: "second_signature_present is true for a CONTROLLED medication record"
    error_id: ERR_CONTROLLED_SECOND_SIGNATURE_REQUIRED
    http_status: 422
    applies_to: "POST /accreditation/medication-records"
  - priority: 38
    category: business_safety
    check: "dose_units for a CONTROLLED record does not exceed the camp's controlled_on_hand_units"
    error_id: ERR_CONTROLLED_STOCK_INSUFFICIENT
    http_status: 422
    applies_to: "POST /accreditation/medication-records"

  # --- business_constraint (39-47) -----------------------------------------
  - priority: 39
    category: business_constraint
    check: "the visitor holds no other ASSIGNED or COMPLETED VisitAssignment whose travel block, widened by TRAVEL_BUFFER_DAYS on both sides, overlaps the requested closed travel block"
    error_id: ERR_VISITOR_TRAVEL_CONFLICT
    http_status: 422
    applies_to: "POST /accreditation/visit-assignments"
  - priority: 40
    category: business_constraint
    check: "at most MAX_CONTROLLED_PER_24H RECORDED CONTROLLED records exist for the same camper_reference in the half-open window [administered_at minus 24 hours, administered_at)"
    error_id: ERR_CONTROLLED_DOSE_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /accreditation/medication-records"
  - priority: 41
    category: business_constraint
    check: "the visit team is complete - lead_visitor_id is not null, team_size >= 2, and for every domain in required_specialist_domains an ASSIGNED SPECIALIST seat exists whose visitor holds the matching certification"
    error_id: ERR_TEAM_COMPOSITION_INCOMPLETE
    http_status: 422
    applies_to: "POST /accreditation/visits/{visitId}/schedule"
  - priority: 42
    category: business_constraint
    check: "the seated visitor's trained_through_year is at least the calendar year of the visit's window_start_date"
    error_id: ERR_VISITOR_TRAINING_EXPIRED
    http_status: 422
    applies_to: "POST /accreditation/visit-assignments"
  - priority: 43
    category: business_constraint
    check: "no other AccreditationCycle exists for the same camp_id and cycle_year, and no other AnnualReport exists for the same camp_id and report_year"
    error_id: ERR_DUPLICATE_CYCLE_YEAR
    http_status: 409
    applies_to: "POST /accreditation/cycles, POST /accreditation/annual-reports"
  - priority: 44
    category: business_constraint
    check: "the Deficiency's plan_revision_count is below PLAN_REVISION_LIMIT of 3 before another correction plan is submitted"
    error_id: ERR_PLAN_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /accreditation/deficiencies/{deficiencyId}/correction-plan"
  - priority: 45
    category: business_constraint
    check: "every applicable StandardEvaluation of the cycle has a non-null self_score and self_status SUBMITTED before the self-assessment may be submitted"
    error_id: ERR_SELF_ASSESSMENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /accreditation/cycles/{cycleId}/submit-self-assessment"
  - priority: 46
    category: business_constraint
    check: "every applicable mandatory StandardEvaluation of the cycle has a non-null visitor_score before scoring may be finalized"
    error_id: ERR_MANDATORY_SCORING_INCOMPLETE
    http_status: 422
    applies_to: "POST /accreditation/visits/{visitId}/finalize-scoring"
  - priority: 47
    category: business_constraint
    check: "declared_incident_count is at least the report's disclosed_incident_count at submission"
    error_id: ERR_DECLARED_COUNT_BELOW_DISCLOSED
    http_status: 422
    applies_to: "POST /accreditation/annual-reports/{reportId}/submit"

  # --- business_referential (48-50) ----------------------------------------
  - priority: 48
    category: business_referential
    check: "the StandardEvaluation's applicable flag is true before any self_score or visitor_score is written"
    error_id: ERR_STANDARD_NOT_APPLICABLE
    http_status: 422
    applies_to: "PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment, PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"
  - priority: 49
    category: business_referential
    check: "the WrittenPlan named by written_plan_id belongs to the same camp as the evaluation's cycle"
    error_id: ERR_PLAN_CAMP_MISMATCH
    http_status: 422
    applies_to: "PATCH /accreditation/standard-evaluations/{evaluationId}/self-assessment"
  - priority: 50
    category: business_referential
    check: "the evaluation being scored belongs to the same cycle as the visitor's ASSIGNED visit"
    error_id: ERR_VISIT_CYCLE_MISMATCH
    http_status: 422
    applies_to: "PATCH /accreditation/standard-evaluations/{evaluationId}/visitor-score"

  # --- business_temporal (51-55) -------------------------------------------
  - priority: 51
    category: business_temporal
    check: "window_start_date is on or before window_end_date, the window spans at most VISIT_WINDOW_MAX_DAYS of 14 days inclusive, and window_start_date is on or after the logical clock calendar date"
    error_id: ERR_VISIT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /accreditation/visits"
  - priority: 52
    category: business_temporal
    check: "the requested travel block is a subset of the visit window - travel_block_start_date on or after window_start_date and travel_block_end_date on or before window_end_date"
    error_id: ERR_TRAVEL_BLOCK_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /accreditation/visit-assignments"
  - priority: 53
    category: business_temporal
    check: "the logical clock calendar date lies inside [window_start_date, window_end_date] inclusive when the visit is started"
    error_id: ERR_OUTSIDE_VISIT_WINDOW
    http_status: 422
    applies_to: "POST /accreditation/visits/{visitId}/start"
  - priority: 54
    category: business_temporal
    check: "the logical clock calendar date is on or before the Deficiency's correction_due_date when a correction plan is submitted or a correction is verified"
    error_id: ERR_CORRECTION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /accreditation/deficiencies/{deficiencyId}/correction-plan, POST /accreditation/deficiencies/{deficiencyId}/review"
  - priority: 55
    category: business_temporal
    check: "the disclosure's occurred_at calendar year equals the parent AnnualReport's report_year, and a WrittenPlan's effective_date is strictly before its expires_at"
    error_id: ERR_INCIDENT_OUTSIDE_REPORT_YEAR
    http_status: 422
    applies_to: "POST /accreditation/incident-disclosures, POST /accreditation/written-plans"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
