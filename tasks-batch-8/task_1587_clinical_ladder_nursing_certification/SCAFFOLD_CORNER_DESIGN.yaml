  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: payroll_officer_cannot_decide_application
        claim_type: rbac_denial
        grounds: [roles.PayrollOfficer, roles.ProgramAdmin]
        distinguishing_aspect: "PayrollOfficer invoking POST /applications/{id}/decide (ProgramAdmin exclusive) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Application IN_REVIEW with quorum scored (reuse minimal flow)"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RBP", full_name: "Rbp Nurse", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { rbp_id: $.data.id, rbp_nv: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RBPR", full_name: "Rbp Rev", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
