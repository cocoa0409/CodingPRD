  - section: endpoints
    instances:

      - name: cost_summary_is_read_only_and_does_not_bump_version
        claim_type: computed_read
        grounds: ["endpoints.GET_/hhw/programs/{id}/cost-summary", "entities.Program.fields.version"]
        distinguishing_aspect: "GET /hhw/programs/{id}/cost-summary is a pure projection: calling it twice leaves Program.version unchanged at 1 and mutates no counters."
        test_recipe:
          setup: ["One freshly created program"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "GET /hhw/programs/${prog_id}/cost-summary"
              as: EventCoordinator
            - call: "GET /hhw/programs/${prog_id}/cost-summary"
              as: ProgramAdmin
            - call: "GET /hhw/programs/${prog_id}"
              as: ProgramAdmin
              captures: { v1: $.data.version }
          assert:
            - "${v0} == 1 and ${v1} == 1"
            - "HTTP status == 200 for both cost-summary reads"
            - "Program.${prog_id}.budget_encumbered_cents == 0"

      - name: clock_set_echoes_the_new_logical_instant
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/hhw/_clock/set_current_utc"]
        distinguishing_aspect: "POST /hhw/_clock/set_current_utc returns the new logical instant in current_utc and mutates no entity, so a program created beforehand keeps version 1."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /hhw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T09:00:00.000Z" }
              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          assert:
            - "HTTP status == 200"
            - "${now} == 2026-09-12T09:00:00.000Z"
            - "Program.${prog_id}.version == 1"

