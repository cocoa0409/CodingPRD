              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /statutory-conflicts"
              payload: { drafting_request_id: "${dr_id}", code_citation: "11-1-101", conflict_type: "STYLE_VIOLATION", severity: "ADVISORY" }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /statutory-conflicts"
              payload: { drafting_request_id: "${dr_id}", code_citation: "11-1-102", conflict_type: "AMENDS_SAME_SECTION", severity: "ADVISORY" }
              as: Drafter
              as_user_id: "${d1_id}"
