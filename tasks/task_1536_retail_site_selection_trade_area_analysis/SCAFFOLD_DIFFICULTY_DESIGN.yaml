# =============================================================================
# §1.8 Scaffold Difficulty Design — Retail Site Selection & Trade Area Analysis
# Test Targeting Index: 9 Difficulty Rules x instances, all grounded in
# SCAFFOLD.yaml §1.1-§1.7. All money in whole cents; logical clock default
# 2026-08-01T00:00:00Z unless a recipe advances it.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_gravity_vs_analog_divergence
        grounds:
          - calculations.sales_forecast_gross
          - entities.SalesForecast.fields.gross_annual_sales_cents
          - entities.SalesForecast.fields.model_variant
        distinguishing_aspect: |
          Two variants on the SalesForecast domain: identical site, model, and
          competitor listings yield gross 5724375000 cents under GRAVITY
          (attraction share) but 1100000000 cents under ANALOG (same-format
          OPERATING store mean x format factor 1.00). This instance sits on the
          SalesForecast entity domain, distinct from the TradeAreaModel domain
          of the sibling instance.
        test_recipe:
          setup:
            - "QUALIFIED market with two OPERATING STANDARD stores (1200000000 and 1000000000 cents annual sales)"
            - "Site STANDARD 10000 sqft MODELED via a LOCKED FLAT_BAND model (drive_time 15, population 50000, per_capita 300000)"
            - "Model carries two COMPETITOR listings: 8000 sqft at 4 min, 12000 sqft at 9 min"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro G", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "A1", format_type: "STANDARD", annual_sales_cents: 1200000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "A2", format_type: "STANDARD", annual_sales_cents: 1000000000 }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "1 Main St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "POST /api/competitor-listings"
              payload: { trade_area_model_id: "${mdl_id}", listing_type: "COMPETITOR", brand_name: "Alpha", estimated_sqft: 8000, distance_minutes: 4 }
              as: RealEstateAnalyst
            - call: "POST /api/competitor-listings"
              payload: { trade_area_model_id: "${mdl_id}", listing_type: "COMPETITOR", brand_name: "Beta", estimated_sqft: 12000, distance_minutes: 9 }
              as: RealEstateAnalyst
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
          trigger:
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "GRAVITY" }
              as: RealEstateAnalyst
              captures: { fc_g: $.data.id, gross_g: $.data.gross_annual_sales_cents }
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "ANALOG" }
              as: RealEstateAnalyst
              captures: { fc_a: $.data.id, gross_a: $.data.gross_annual_sales_cents }
          assert:
            - "SalesForecast.${fc_g}.gross_annual_sales_cents == 5724375000 (capture 0.381625 x 50000 x 300000)"
            - "SalesForecast.${fc_a}.gross_annual_sales_cents == 1100000000 (mean(1200000000, 1000000000) x 1.00)"
            - "SalesForecast.${fc_g}.gross_annual_sales_cents != SalesForecast.${fc_a}.gross_annual_sales_cents"
            - "Both forecasts have forecast_status == DRAFT"

      - name: cannibalization_flat_band_vs_distance_decay
        grounds:
          - calculations.cannibalization_impact
          - entities.TradeAreaModel.fields.cannibalization_variant
          - entities.TradeAreaModel.fields.cannibalized_sales_cents
        distinguishing_aspect: |
          Two variants on the TradeAreaModel domain (distinct from the
          SalesForecast instance): the same five-store drive-time set yields
          cannibalized_sales_cents 350000000 under FLAT_BAND versus 230533333
          under DISTANCE_DECAY, proving per-store rounding before summation and
          the exclusion of CLOSED and out-of-contour stores in both variants.
        test_recipe:
          setup:
            - "QUALIFIED market; stores S1 800000000 @3min, S2 600000000 @8min, S3 400000000 @12min, S4 900000000 @20min (beyond D), S5 700000000 @2min CLOSED"
            - "Site MODELED via model M1 (FLAT_BAND, D=15) whose store_drive_times cover all five stores"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro C", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "S1", format_type: "STANDARD", annual_sales_cents: 800000000 }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "S2", format_type: "STANDARD", annual_sales_cents: 600000000 }
              as: PlatformAdmin
              captures: { st2: $.data.id }
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "S3", format_type: "STANDARD", annual_sales_cents: 400000000 }
              as: PlatformAdmin
              captures: { st3: $.data.id }
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "S4", format_type: "STANDARD", annual_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { st4: $.data.id }
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "S5", format_type: "EXPRESS", annual_sales_cents: 700000000 }
              as: PlatformAdmin
              captures: { st5: $.data.id }
            - call: "POST /api/stores/${st5}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "9 Oak Ave", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND", store_drive_times: [ { store_id: "${st1}", drive_minutes: 3 }, { store_id: "${st2}", drive_minutes: 8 }, { store_id: "${st3}", drive_minutes: 12 }, { store_id: "${st4}", drive_minutes: 20 }, { store_id: "${st5}", drive_minutes: 2 } ] }
              as: RealEstateAnalyst
              captures: { mdl1: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v1: $.data.version }
            - call: "POST /api/trade-area-models/${mdl1}/lock"
              payload: { expected_site_version: "${site_v1}" }
              as: RealEstateAnalyst
              captures: { cann1: $.data.cannibalized_sales_cents }
          trigger:
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "DISTANCE_DECAY", store_drive_times: [ { store_id: "${st1}", drive_minutes: 3 }, { store_id: "${st2}", drive_minutes: 8 }, { store_id: "${st3}", drive_minutes: 12 }, { store_id: "${st4}", drive_minutes: 20 }, { store_id: "${st5}", drive_minutes: 2 } ] }
              as: RealEstateAnalyst
              captures: { mdl2: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v2: $.data.version }
            - call: "POST /api/trade-area-models/${mdl2}/lock"
              payload: { expected_site_version: "${site_v2}" }
              as: RealEstateAnalyst
              captures: { cann2: $.data.cannibalized_sales_cents }
          assert:
            - "TradeAreaModel.${mdl1}.cannibalized_sales_cents == 350000000 (240000000 + 90000000 + 20000000; S4 out-of-contour and S5 CLOSED excluded)"
            - "TradeAreaModel.${mdl2}.cannibalized_sales_cents == 230533333 (179200000 + 45733333 + 5600000 with per-store round_half_up before sum)"
            - "TradeAreaModel.${mdl1}.model_status == SUPERSEDED and TradeAreaModel.${mdl2}.model_status == LOCKED after the second lock"
            - "350000000 != 230533333 for identical store set and drive times"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: market_screening_circular_order
        grounds:
          - calculations.market_screening_evaluation
          - entities.Market.fields.screening_tier
          - entities.Market.fields.target_store_count
          - entities.Market.fields.penetration_index
          - entities.Market.fields.final_score
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          tier derives from raw_score, target_store_count derives from tier,
          penetration_index derives from target_store_count and live
          open_store_count, and final_score subtracts the penetration penalty —
          with 3 open stores the pinned order yields final_score 80.83, whereas
          evaluating penetration against base_target_stores (4) would yield
          73.33, so the order is observable.
        test_recipe:
          setup:
            - "Market inputs pop 400000, income 8000000, growth 250bp, psycho 110, base_target_stores 4"
            - "Three OPERATING stores registered BEFORE evaluation so open_store_count == 3 at evaluate time"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro Circ", state_code: "OH", population: 400000, median_household_income_cents: 8000000, population_growth_bp: 250, psychographic_index: 110, base_target_stores: 4, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "P1", format_type: "STANDARD", annual_sales_cents: 900000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "P2", format_type: "STANDARD", annual_sales_cents: 900000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "P3", format_type: "STANDARD", annual_sales_cents: 900000000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
              captures: { raw: $.data.raw_score, tier: $.data.screening_tier, tgt: $.data.target_store_count, pen: $.data.penetration_index, fin: $.data.final_score, st: $.data.market_status }
          assert:
            - "Market.${mkt_id}.raw_score == 88.33 (0.30*100 + 0.30*100 + 0.20*50 + 0.20*91.6667 rounded half-up 2dp)"
            - "Market.${mkt_id}.screening_tier == A and target_store_count == 8 (base 4 + tier-A bonus 4)"
            - "Market.${mkt_id}.penetration_index == 0.375000 (3 / 8, evaluated AFTER the tier bonus inflates the target)"
            - "Market.${mkt_id}.final_score == 80.83 (88.33 - min(0.375, 1.0)*20 = 88.33 - 7.50)"
            - "Market.${mkt_id}.market_status == QUALIFIED (80.83 >= 60.00)"

      - name: loi_effective_rent_pinned_rounding
        grounds:
          - calculations.loi_effective_rent
          - entities.LOI.fields.effective_annual_rent_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: per-year psf rounded to whole cents
          BEFORE multiplying by sqft, per-year rent rounded before summation,
          year-1 monthly rent rounded before multiplying by free months —
          pinned order yields 19125555 cents; summing unrounded year psf first
          would yield 19124889, so the order is observable in whole cents.
        test_recipe:
          setup:
            - "APPROVED site (STANDARD, 10000 sqft) with committee chain completed (sponsor + chair + 3 voters, E=4, votes A/A/R/Ab -> APPROVE, chair ratifies)"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro R", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N1", format_type: "STANDARD", annual_sales_cents: 1200000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N2", format_type: "STANDARD", annual_sales_cents: 1000000000 }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
            - call: "POST /api/site-visits"
              payload: { site_id: "${site_id}", visited_on: "2026-08-05", visibility_score: 80, access_score: 90, parking_score: 70, cotenancy_score: 85 }
              as: RealEstateAnalyst
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "ANALOG" }
              as: RealEstateAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /api/sales-forecasts/${fc_id}/lock"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/committee-members"
              payload: { display_name: "Sponsor", is_chair: false }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Chair", is_chair: true }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Voter1" }
              as: PlatformAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Voter2" }
              as: PlatformAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Voter3" }
              as: PlatformAdmin
              captures: { v3_id: $.data.id }
            - call: "POST /api/sites/${site_id}/submit-committee"
              payload: { sales_forecast_id: "${fc_id}", sponsor_member_id: "${sp_id}", expires_at: "2026-08-15T00:00:00Z" }
              as: RealEstateManager
              captures: { rev_id: $.data.id, rv0: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "APPROVE", expected_review_version: "${rv0}" }
              as: CommitteeMember
              as_user_id: "${v1_id}"
            - call: "GET /api/committee-reviews/${rev_id}"
              as: RealEstateManager
              captures: { rv1: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "APPROVE", expected_review_version: "${rv1}" }
              as: CommitteeMember
              as_user_id: "${v2_id}"
            - call: "GET /api/committee-reviews/${rev_id}"
              as: RealEstateManager
              captures: { rv2: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "REJECT", expected_review_version: "${rv2}" }
              as: CommitteeMember
              as_user_id: "${v3_id}"
            - call: "GET /api/committee-reviews/${rev_id}"
              as: RealEstateManager
              captures: { rv3: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "ABSTAIN", expected_review_version: "${rv3}" }
              as: CommitteeChair
              as_user_id: "${ch_id}"
            - call: "POST /api/committee-reviews/${rev_id}/ratify"
              payload: {}
              as: CommitteeChair
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /api/lois"
              payload: { site_id: "${site_id}", rent_psf_cents: 2000, escalation_pct_bp: 200, term_years: 3, ti_allowance_cents: 500000, free_rent_months: 2, exclusivity_start_date: "2026-09-01", exclusivity_end_date: "2026-10-01" }
              as: RealEstateManager
              captures: { loi_id: $.data.id }
            - call: "POST /api/lois/${loi_id}/send"
              payload: {}
              as: RealEstateManager
              captures: { eff: $.data.effective_annual_rent_cents }
          assert:
            - "LOI.${loi_id}.effective_annual_rent_cents == 19125555 (psf years 2000/2040/2081 -> year rents 20000000/20400000/20810000; monthly year-1 rounds to 1666667; free value 3333334; total 57376666; /3 rounds to 19125555)"
            - "LOI.${loi_id}.loi_status == SENT and Site.${site_id}.site_status == LOI_ACTIVE"

      - name: occupancy_ratio_tiered_branching
        grounds:
          - calculations.occupancy_cost_ratio
          - entities.SalesForecast.fields.occupancy_ratio_bp
          - entities.SalesForecast.fields.occupancy_band
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction and state-conditional
          branches: (rent+cam+tax) x sqft over net sales lands ratio 1800 bp
          (YELLOW), and the submission branch then depends on chair_override —
          rejected without it (ERR_CHAIR_OVERRIDE_REQUIRED), accepted with it.
        test_recipe:
          setup:
            - "QUALIFIED market; ANALOG stores 900000000 and 1100000000 STANDARD -> net 1000000000 (empty store_drive_times -> cannibalization 0)"
            - "Site STANDARD 10000 sqft, asking 18000, cam 0, tax 0 -> annual occupancy 180000000 -> ratio 1800 bp YELLOW"
            - "Committee: sponsor + chair (E=1)"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro Y", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "B1", format_type: "STANDARD", annual_sales_cents: 900000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "B2", format_type: "STANDARD", annual_sales_cents: 1100000000 }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "7 Pine Rd", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 18000, cam_psf_cents: 0, tax_psf_cents: 0, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
            - call: "POST /api/site-visits"
              payload: { site_id: "${site_id}", visited_on: "2026-08-05", visibility_score: 80, access_score: 90, parking_score: 70, cotenancy_score: 85 }
              as: RealEstateAnalyst
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "ANALOG" }
              as: RealEstateAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /api/sales-forecasts/${fc_id}/lock"
              payload: {}
              as: RealEstateAnalyst
              captures: { ratio: $.data.occupancy_ratio_bp, band: $.data.occupancy_band }
            - call: "POST /api/committee-members"
              payload: { display_name: "Sponsor", is_chair: false }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Chair", is_chair: true }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/submit-committee"
              payload: { sales_forecast_id: "${fc_id}", sponsor_member_id: "${sp_id}", expires_at: "2026-08-15T00:00:00Z" }
              as: RealEstateManager
              captures: { err1: $.data.error_id }
            - call: "POST /api/sites/${site_id}/submit-committee"
              payload: { sales_forecast_id: "${fc_id}", sponsor_member_id: "${sp_id}", expires_at: "2026-08-15T00:00:00Z", chair_override: true }
              as: RealEstateManager
              captures: { rev_id: $.data.id }
          assert:
            - "SalesForecast.${fc_id}.occupancy_ratio_bp == 1800 (180000000 x 10000 / 1000000000)"
            - "SalesForecast.${fc_id}.occupancy_band == YELLOW (1501..2200)"
