  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_requires_order_booked_state
        grounds:
          - state_machines.VesselOrder.BOOKED_to_DISPATCHED
          - validations[priority=7]
        distinguishing_aspect: |
          Pair Assignment->VesselOrder: assignment creation via dispatch is gated on the
          ORDER's state; once the order left BOOKED (already DISPATCHED), a second
          dispatch is rejected with ERR_ORDER_NOT_DISPATCHABLE and no second assignment.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; O1 already dispatched once (DISPATCHED)"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
          trigger:
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          trigger_note: "second dispatch attempt on the same DISPATCHED order"
          assert:
            - "err == ERR_ORDER_NOT_DISPATCHABLE"
            - "count of Assignments with order_id == o1_id remains 1"

      - name: invoice_finalize_blocked_by_open_incident
        grounds:
          - state_machines.Invoice.ISSUED_to_FINALIZED
          - validations[priority=12]
        distinguishing_aspect: |
          Pair Invoice->Incident (different pair than dispatch's Assignment->VesselOrder):
          finalize is gated on the absence of REPORTED/UNDER_REVIEW incidents on the
          invoice's assignment; dismissing the incident unblocks the very same finalize.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 endorsed cap 100000; boat BA"
            - "A1 completed -> invoice I1 ISSUED; incident N1 on A1 in REPORTED"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/board", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/complete", payload: { detention_minutes: 0, delay_minutes: 0 }, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "GET /pilotage/invoices", payload: { assignment_id: "${a1_id}" }, as: FinanceOfficer, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /pilotage/incidents", payload: { assignment_id: "${a1_id}", incident_type: EQUIPMENT, description: "radio failure reported" }, as: Dispatcher, captures: { n1_id: $.data.id } }
          trigger:
            - { call: "POST /pilotage/invoices/${i1_id}/finalize", payload: {}, as: FinanceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /pilotage/incidents/${n1_id}/open-review", payload: {}, as: Investigator }
            - { call: "POST /pilotage/incidents/${n1_id}/dismiss", payload: {}, as: Investigator }
            - { call: "POST /pilotage/invoices/${i1_id}/finalize", payload: {}, as: FinanceOfficer, captures: { fin_status: $.data.status } }
          assert:
            - "err == ERR_INCIDENT_HOLD_ACTIVE while N1 was REPORTED (and it would also hold in UNDER_REVIEW)"
            - "fin_status == FINALIZED after N1 dismissed"
            - "Invoice(i1_id).finalized_at == 2026-08-01T00:00:00Z (logical clock default)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: boat_halfopen_buffer_adjacency_vs_inside_buffer
        grounds:
          - calculations.boat_interval_overlap
          - errors[ERR_NO_ELIGIBLE_BOAT]
        distinguishing_aspect: |
          Resource PilotBoat, HALF-OPEN intervals with a 45-minute end-side buffer:
          new_start == existing_end + 45 is ALLOWED (adjacent at the buffer edge) while
          new_start one minute earlier empties the selector pool -> ERR_NO_ELIGIBLE_BOAT.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 and P2 both endorsed cap 100000; single boat BA"
            - "A1 (order O1) ASSIGNED to P1 on BA, window [2026-08-10T10:00Z, 2026-08-10T12:00Z] -> BA occupied [10:00, 12:45)"
            - "orders O2 and O3 exist BOOKED"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot Two", license_number: "LIC-2", share_units: 1 }, as: AssociationAdmin, captures: { p2_id: $.data.id, p2_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p2_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p2_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin, captures: { ba_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Two", gt: 8000, draft_dm: 90, order_type: DEPARTURE, eta: "2026-08-10T06:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o2_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Three", gt: 8000, draft_dm: 90, order_type: SHIFT, eta: "2026-08-10T06:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o3_id: $.data.id } }
          trigger:
            - { call: "POST /pilotage/vessel-orders/${o2_id}/dispatch", payload: { scheduled_start: "2026-08-10T12:45:00Z", scheduled_end: "2026-08-10T14:00:00Z" }, as: Dispatcher, captures: { a2_pilot: $.data.pilot_id } }
            - { call: "POST /pilotage/vessel-orders/${o3_id}/dispatch", payload: { scheduled_start: "2026-08-10T12:44:00Z", scheduled_end: "2026-08-10T14:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "O2 dispatch succeeds at the exact buffer edge (12:45 == 12:00 + 45min) and a2_pilot == Pilot Two id (P2 at position 2; P1 demoted after A1)"
            - "err == ERR_NO_ELIGIBLE_BOAT (12:44 lies inside BA's buffered occupation)"
            - "VesselOrder(o3_id).status remains BOOKED (empty pool writes nothing)"

      - name: pilot_closed_interval_touching_collides
        grounds:
          - calculations.pilot_interval_overlap
          - errors[ERR_PILOT_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource Pilot, CLOSED intervals with NO buffer (different geometry than the
          boat rule): new_start == existing_end COLLIDES (touching endpoints count),
          while new_start one minute later is accepted.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 and P2 both endorsed cap 100000; boats BA and BB"
            - "A1 (order O1) ASSIGNED to P1 on BA, window [2026-08-10T10:00Z, 2026-08-10T12:00Z]"
            - "A2 (order O2) ASSIGNED to P2 on BB, window [2026-08-11T10:00Z, 2026-08-11T11:00Z], then recalled to RECALLED"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot Two", license_number: "LIC-2", share_units: 1 }, as: AssociationAdmin, captures: { p2_id: $.data.id, p2_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p2_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p2_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin, captures: { ba_id: $.data.id } }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat B", capacity_persons: 6 }, as: AssociationAdmin, captures: { bb_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Two", gt: 8000, draft_dm: 90, order_type: DEPARTURE, eta: "2026-08-11T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o2_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o2_id}/dispatch", payload: { scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T11:00:00Z", boat_id: "${bb_id}" }, as: Dispatcher, captures: { a2_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a2_id}/recall", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /pilotage/assignments/${a2_id}/reassign", payload: { pilot_id: "${p1_id}", scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /pilotage/assignments/${a2_id}/reassign", payload: { pilot_id: "${p1_id}", scheduled_start: "2026-08-10T12:01:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: Dispatcher, captures: { ok_pilot: $.data.pilot_id } }
          assert:
            - "err == ERR_PILOT_TIME_CONFLICT (touching at 12:00 collides under closed-interval semantics)"
            - "ok_pilot == Pilot One id (12:01 start accepted; boat BB's buffer rule independently satisfied)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: dispatch_then_cancel_restores_rotation_ordering
        grounds:
          - state_machines.Assignment.ASSIGNED_to_CANCELLED
          - entities.RotationEntry.fields.position
          - entities.RotationEntry.fields.previous_position
        distinguishing_aspect: |
          Conserved quantity: the rotation board's ordering. Dispatch demotes the picked
          pilot to the bottom (position 1 -> 3); the compensating cancel MUST restore the
          exact pre-dispatch ordering — position 1 for P1, 2 for P2, previous_position
          null — with zero drift in the board's position multiset {1, 2}.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 (position 1) and P2 (position 2) endorsed cap 100000; boat BA"
            - "O1 dispatched: selector picked P1; P1 entry now position 3, previous_position 1"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot Two", license_number: "LIC-2", share_units: 1 }, as: AssociationAdmin, captures: { p2_id: $.data.id, p2_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p2_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p2_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id, a1_pilot: $.data.pilot_id } }
            - { call: "GET /pilotage/pilots/${p1_id}/rotation-entries", payload: {}, as: Dispatcher, captures: { mid_pos: "$.data[0].position" } }
          trigger:
            - { call: "POST /pilotage/assignments/${a1_id}/cancel", payload: {}, as: Dispatcher }
          assert:
            - "a1_pilot == Pilot One id (front of board picked)"
            - "mid_pos == 3 (dispatch demoted P1 to bottom: max(1,2)+1)"
            - "after cancel: RotationEntry(p1_id).position == 1 and previous_position == null"
            - "RotationEntry(p2_id).position == 2; position multiset {1,2} conserved"
            - "Assignment(a1_id).service_status == CANCELLED and VesselOrder(o1_id).status == BOOKED (revert for re-dispatch)"

      - name: distribution_create_then_void_conserves_invoice_fiscal_state
        grounds:
          - state_machines.DistributionRun.COMPUTED_to_VOID
          - calculations.revenue_distribution
          - entities.Invoice.fields.status
        distinguishing_aspect: |
          Conserved quantity: money and fiscal state. At COMPUTED, gross == levy + sum of
          shares to the cent (950000 == 76000 + 874000); the compensating void returns the
          run to VOID while every swept invoice remains FINALIZED and every assignment
          remains INVOICED — zero monetary drift.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 endorsed cap 100000 (share_units 1); boat BA"
            - "A1 completed (order gt 82500 draft 90) -> invoice I1 total 950000, FINALIZED at default clock 2026-08-01T00:00Z"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 82500, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/board", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/complete", payload: { detention_minutes: 0, delay_minutes: 0 }, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "GET /pilotage/invoices", payload: { assignment_id: "${a1_id}" }, as: FinanceOfficer, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /pilotage/invoices/${i1_id}/finalize", payload: {}, as: FinanceOfficer }
            - { call: "POST /pilotage/distribution-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z" }, as: FinanceOfficer, captures: { run_id: $.data.id, run_gross: $.data.gross_pool_cents, run_levy: $.data.levy_cents, run_net: $.data.net_pool_cents } }
          trigger:
            - { call: "POST /pilotage/distribution-runs/${run_id}/void", payload: {}, as: FinanceOfficer, captures: { run_status: $.data.status } }
          assert:
            - "run_gross == 950000 and run_levy == 76000 (8% of gross, below the 10000000 threshold) and run_net == 874000"
            - "single-pilot share == 874000 and 76000 + 874000 == 950000 (cent-exact conservation at COMPUTED)"
            - "run_status == VOID"
            - "Invoice(i1_id).status == FINALIZED (not DISTRIBUTED) after the void compensation"
            - "Assignment(a1_id).billing_status == INVOICED (not SETTLED) after the void compensation"
