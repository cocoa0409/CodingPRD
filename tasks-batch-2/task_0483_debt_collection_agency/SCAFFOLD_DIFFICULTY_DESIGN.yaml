            - "response status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: call_window_closed_open_daily_interval
        grounds:
          - validations[priority=8]
          - entities.Consumer.fields.timezone_offset_minutes
          - errors[ERR_OUTSIDE_CALL_WINDOW]
        distinguishing_aspect: |
          The consumer call-window resource is a daily recurring CLOSED-OPEN interval [08:00:00, 21:00:00)
          in consumer local time: an attempt at local 21:00:00 collides with the open end and is rejected,
          while 08:00:00 (closed start) is allowed — interval semantics = recurring daily closed-open window
          on the Consumer resource.
        test_recipe:
          setup:
            - "Consumer offset -300 (UTC-5)."
            - "WORKING account, CONTACTABLE, no prior conversation."
            - "Clock at 2026-03-01T02:00:00Z which is local 21:00:00 the prior day (open end of window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T02:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: -300 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T02:00:00Z", outcome: "LOGGED" }
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "attempted_at 2026-03-01T02:00:00Z = consumer local 21:00:00 -> ${err} == ERR_OUTSIDE_CALL_WINDOW"
            - "response status == 409"

      - name: post_conversation_cooldown_forward_7day_buffer
        grounds:
          - validations[priority=9]
          - entities.Account.fields.last_conversation_at
          - errors[ERR_POST_CONVERSATION_COOLDOWN]
        distinguishing_aspect: |
          The post-conversation cooldown is a one-shot FORWARD half-open buffer [last_conversation_at,
          last_conversation_at+7d) anchored on the Account: an attempt at +7d-minus-1s collides with the
          buffer and is rejected — interval semantics = single forward 7-day buffer on the Account resource,
          distinct from the Consumer's recurring daily window.
        test_recipe:
          setup:
            - "WORKING account, CONTACTABLE, consumer offset 0."
            - "A CONVERSATION attempt logged at 2026-02-01T12:00:00Z -> last_conversation_at set; cooldown to 2026-02-08T12:00:00Z."
            - "Clock at 2026-02-08T11:59:59Z (still in cooldown, daytime local)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T12:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-02-01T12:00:00Z", outcome: "CONVERSATION" }
              as: Collector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-08T11:59:59Z" }
              as: System
          trigger:
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-02-08T11:59:59Z", outcome: "LOGGED" }
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "Account.${acct}.last_conversation_at == 2026-02-01T12:00:00Z"
            - "${err} == ERR_POST_CONVERSATION_COOLDOWN"
            - "response status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_conserves_balance_plus_collected
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - calculations.account_balance
          - entities.Account.fields.amount_collected_cents
        distinguishing_aspect: |
          Posting then reversing a 30000-cent payment leaves the conserved money quantity
          (balance_cents + amount_collected_cents) equal to 100000 both before and after — the reverse
          fully compensates the post with zero ledger drift.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account, principal 100000; one 30000-cent payment POSTED (balance 70000, collected 30000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 30000 }
              as: Collector
              captures: { pay: $.data.id }
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Collector
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /payments/${pay}/reverse"
              payload: { expected_account_version: "${v_pre}" }
              as: Collector
          assert:
            - "before reverse: Account.${acct}.balance_cents + amount_collected_cents == 100000 (70000+30000)"
            - "Payment.${pay}.status == REVERSED"
            - "Account.${acct}.amount_collected_cents == 0"
            - "Account.${acct}.balance_cents == 100000"
            - "after reverse: balance_cents + amount_collected_cents == 100000 (invariant conserved)"

      - name: recall_cancel_conserves_attempt_window_count
        grounds:
          - state_machines.Account.ANY_NON_TERMINAL_to_RECALLED
          - calculations.cadence_window_count
          - entities.Account.fields.attempts_in_window_count
        distinguishing_aspect: |
          The conserved quantity here is a COUNT, not money: voiding cascade-affected payments on recall
          does not change attempts_in_window_count, and the cadence count after recall equals the count
          before (2), proving the recall cascade leaves the attempt-window counter undisturbed — a
          different conserved quantity (call-attempt count) than the money ledger invariant.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T15:00:00Z (daytime, offset 0)."
            - "WORKING account; two PHONE LOGGED attempts in the trailing 7-day window (attempts_in_window_count==2)."
            - "An ACCEPTED PLAN arrangement with one 30000-cent payment POSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T15:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T09:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T10:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /arrangements"
              payload: { account_id: "${acct}", arrangement_type: "PLAN", installment_count: 4 }
              as: Collector
              captures: { arr: $.data.id }
            - call: "POST /arrangements/${arr}/accept"
              payload: {}
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 30000, arrangement_id: "${arr}" }
              as: Collector
              captures: { pay: $.data.id }
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Creditor
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /accounts/${acct}/recall"
              payload: { expected_account_version: "${v_pre}" }
              as: Creditor
              captures: { post_count: $.data.attempts_in_window_count }
          assert:
            - "before recall: Account.${acct}.attempts_in_window_count == 2"
            - "Account.${acct}.work_status == RECALLED"
            - "Payment.${pay}.status == VOIDED"
            - "Account.${acct}.attempts_in_window_count == 2 (cadence count conserved across recall cascade)"
            - "${post_count} == 2"
