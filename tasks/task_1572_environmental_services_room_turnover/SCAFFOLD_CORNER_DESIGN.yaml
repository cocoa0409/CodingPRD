  # ===========================================================================
  # Section: validations (Table 4 claims: violation->error, priority ordering
  # for pairs NOT exercised by §1.8)
  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_header_rejected_before_everything
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: |
          Priority 1: a request carrying neither X-User-ID nor X-User-Role is
          rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even
          on a harmless GET — context validation precedes role, existence,
          and state checks.
        test_recipe:
          setup:
            - "Empty DB; clock pinned"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
          trigger:
            # Sent with NO X-User-ID / X-User-Role headers (no `as:` binding).
            - { call: "GET /evs/units", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: malformed_body_beats_role_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_AUDIT_METHOD_FIELD_MISMATCH]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          Pair (request_format, auth) — distinct from §1.8's two pairs: an
          ATP_SWAB audit body missing rlu_reading submitted by an UNAUTHORIZED
          role (EVSDispatcher) returns the 400 format error, not the 403 role
          error; and the mirrored mismatch (FLUORESCENT_MARKER carrying the
          forbidden rlu_reading) from a valid auditor also returns 400.
        test_recipe:
          setup:
            - "Clock 08:00; auditor A1 (AUDIT capability) for the well-roled second trigger"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "00000000-0000-0000-0000-000000000000", audit_method: "ATP_SWAB" }
              as: EVSDispatcher
              captures: { e1: $.data.error_id }
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "00000000-0000-0000-0000-000000000000", audit_method: "FLUORESCENT_MARKER", marker_fraction_removed: 0.9, rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${a1}"
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_AUDIT_METHOD_FIELD_MISMATCH (400): priority 2 format check beats priority 3 role check (EVSDispatcher is not in the endpoint's roles yet the 400 wins)"
            - "e2 == ERR_AUDIT_METHOD_FIELD_MISMATCH (400): FLUORESCENT_MARKER must not carry rlu_reading (forbidden-field branch)"

      - name: unknown_staff_beats_state_check_on_assign
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_STAFF_NOT_FOUND]
          - errors[ERR_REQUEST_NOT_QUEUED]
        distinguishing_aspect: |
          Pair (existence, state): assigning an IN_PROGRESS request to a
          non-existent staff_id returns 404 ERR_STAFF_NOT_FOUND, not the 409
          ERR_REQUEST_NOT_QUEUED the request's state would otherwise produce.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; DISINFECTANT/CLOTH; tech T1 ON_SHIFT; bed B1"
            - "R1 assigned to T1 and started -> IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "00000000-0000-0000-0000-000000000000" }
              as: EVSDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STAFF_NOT_FOUND (404): body FK existence (priority 4) beats the state gate (priority 5)"
            - "CleanRequest.${r1}.status == IN_PROGRESS AND assigned_staff_id == ${t1} (unchanged)"

      - name: stale_version_beats_state_check_on_reassign
        claim_type: priority_ordering
        grounds:
          - validations[priority=4.8]
          - validations[priority=5]
          - errors[ERR_STALE_REQUEST_VERSION]
          - errors[ERR_REQUEST_NOT_QUEUED]
        distinguishing_aspect: |
          Pair (OCC state, wrong-state): reassigning a QUEUED request while
          carrying a stale expected_clean_request_version returns 412
          ERR_STALE_REQUEST_VERSION — the OCC layer (priority 4.8) fires
          before the state machine's ERR_REQUEST_NOT_QUEUED (priority 5).
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; tech T1 exists; bed B1; R1 QUEUED (version 1 captured at creation)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id, r1_ver: $.data.version }
          trigger:
            - call: "POST /evs/clean-requests/${r1}/reassign"
              payload: { staff_id: "${t1}", expected_clean_request_version: "${r1_ver} + 1" }
              as: EVSDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_REQUEST_VERSION (412): OCC priority 4.8 beats state priority 5"
            - "CleanRequest.${r1}.status == QUEUED AND version == ${r1_ver} (rejected write bumps nothing)"

      - name: open_request_blocks_manual_create_and_window_activation
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_OPEN_REQUEST_EXISTS]
        distinguishing_aspect: |
          The referential guard fires identically on both declared paths: a
          second manual clean request on a bed whose first request is still
          QUEUED (bed still VACANT_DIRTY, so the state gate passes), and a
          window activation on a bed with an open request.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; beds B1, B2; R1 QUEUED on B1; R2 QUEUED on B2; window W1 on B2 SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B2", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b2: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b2}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r2: $.data.id }
            - call: "POST /evs/maintenance-windows"
              payload: { bed_id: "${b2}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z" }
              as: EVSAdministrator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { e_create: $.data.error_id }
            - call: "POST /evs/maintenance-windows/${w1}/activate"
              payload: {}
              as: EVSAdministrator
              captures: { e_activate: $.data.error_id }
          assert:
            - "e_create == ERR_OPEN_REQUEST_EXISTS (409): bed B1 already has R1 QUEUED"
            - "e_activate == ERR_OPEN_REQUEST_EXISTS (409): window activation blocked by R2 QUEUED"
            - "GET /evs/clean-requests?bed_id=${b1} returns exactly 1 row; MaintenanceWindow.${w1}.status == SCHEDULED AND Bed.${b2}.bed_status == VACANT_DIRTY"

      - name: manual_create_requires_vacant_dirty_bed
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_BED_NOT_DIRTY]
        distinguishing_aspect: |
          Manual creation is VACANT_DIRTY-only: with the bed sitting READY
          after a verified clean (no open request — the referential gate
          passes), the state gate fires ERR_BED_NOT_DIRTY.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; DISINFECTANT/CLOTH; tech T1 ON_SHIFT; auditor A1; bed B1; no demands"
            - "R1 run to VERIFIED 08:45 -> B1 READY (unmatched: no OPEN demands)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "A1", display_name: "Auditor One", capabilities: ["AUDIT"], certifications: [] }
              as: EVSAdministrator
              captures: { a1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:45:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${r1}/complete"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/quality-audits"
              payload: { clean_request_id: "${r1}", audit_method: "ATP_SWAB", rlu_reading: 100 }
              as: QualityAuditor
              as_user_id: "${a1}"
          trigger:
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Bed.${b1}.bed_status == READY (setup reached the non-dirty state with no open request)"
            - "err == ERR_BED_NOT_DIRTY (409)"
            - "GET /evs/clean-requests?bed_id=${b1} still returns exactly 1 row (the VERIFIED R1)"

  # ===========================================================================
  # Section: endpoints (Table 5 claims: listing/pagination envelope, computed
  # reads)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_endpoints_filter_paginate_and_envelope
        claim_type: listing
        grounds:
          - entities.Bed.fields.unit_id
          - entities.Bed.fields.bed_kind
        distinguishing_aspect: |
          The list surface composes filters with offset pagination under the
          fixed envelope: unit_id + bed_kind narrow the set, limit/offset page
          it (total_count 3, has_more true then false), and every response
          carries meta.api_request_id with response_type "array".
        test_recipe:
          setup:
            - "Clock 08:00; unit U1 with beds B1 (STANDARD), B2 (ISOLATION), B3 (ICU); unit U2 with bed B4 (STANDARD)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/units"
              payload: { unit_code: "U2", display_name: "Unit Two" }
              as: EVSAdministrator
              captures: { u2: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B2", bed_kind: "ISOLATION" }
              as: EVSAdministrator
              captures: { b2: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B3", bed_kind: "ICU" }
              as: EVSAdministrator
              captures: { b3: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u2}", bed_code: "B4", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b4: $.data.id }
          trigger:
            - call: "GET /evs/beds"
              payload: { unit_id: "${u1}", bed_kind: "STANDARD" }
              as: Any
              captures: { only_std: "$.data[0].id" }
            - call: "GET /evs/beds"
              payload: { unit_id: "${u1}", limit: 2, offset: 0 }
              as: Any
            - call: "GET /evs/beds"
              payload: { unit_id: "${u1}", limit: 2, offset: 2 }
              as: Any
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "only_std == ${b1} (unit_id + bed_kind compose to exactly one row)"
            - "Filtered list (U1, STANDARD) has total_count == 1 and has_more == false"
            - "U1 list with limit 2 offset 0: response_type == 'array', total_count == 3, has_more == true, 2 rows returned"
            - "U1 list with limit 2 offset 2: exactly 1 row (page2_first present), has_more == false, total_count == 3"
            - "Every response envelope carries meta.api_request_id (non-empty) and meta.api_request_timestamp"
            - "Default pagination (no limit/offset) applies limit 10 / offset 0"

      - name: productivity_endpoint_fresh_staff_defaults
        claim_type: computed_read
        grounds:
          - entities.StaffMember.fields.productivity_score
          - entities.StaffMember.fields.stat_eligible
        distinguishing_aspect: |
          The computed read on a brand-new staff member returns the zeroed
          breakdown — and the stat_eligible exemption clause shows through:
          completed_clean_count == 0 forces stat_eligible true despite the
          0.00 score.
        test_recipe:
          setup:
            - "Clock 08:00; tech T1 (CLEAN) registered, never clocked in"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
          trigger:
            - call: "GET /evs/staff/${t1}/productivity"
              payload: {}
              as: Any
              captures: { score: $.data.productivity_score, credits: $.data.verified_credit_total, fails: $.data.qa_fail_count, secs: $.data.shift_seconds_today, eligible: $.data.stat_eligible, done: $.data.completed_clean_count }
          assert:
            - "score == 0.0 AND credits == 0 AND fails == 0 AND secs == 0 AND done == 0"
            - "eligible == true (completed_clean_count == 0 exemption applies before the 80.00 threshold)"

  # ===========================================================================
  # Section: errors (Table 6 backstop: every catalog id gets at least one
  # triggering test; instances here cover ids not triggered elsewhere)
  # ===========================================================================
  - section: errors
    instances:
      - name: insufficient_supply_atomic_and_names_item
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - calculations.supply_consumption_bom
          - errors[ERR_INSUFFICIENT_SUPPLY]
        distinguishing_aspect: |
          The BOM check is all-lines-or-nothing: with SEALANT at 0 the
          TERMINAL start fails naming the first failing line, and NO line's
          reserved_quantity moves — partial reservation is forbidden.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; all three standards; DISINFECTANT 100, PPE_PACK 50, CLOTH 200, SEALANT 0"
            - "Tech T1 (TERMINAL_CERT) ON_SHIFT; bed B1; R1 TERMINAL assigned to T1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ISOLATION", base_minutes: 60, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 150 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "TERMINAL", base_minutes: 90, outbreak_multiplier_bps: 20000, atp_rlu_threshold: 100 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
              captures: { sd: $.data.id }
            - call: "POST /evs/supply-items"
              payload: { item_code: "PPE_PACK", display_name: "PPE packs", initial_on_hand: 50, reorder_threshold: 8 }
              as: EVSAdministrator
              captures: { sp: $.data.id }
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
              captures: { sc: $.data.id }
            - call: "POST /evs/supply-items"
              payload: { item_code: "SEALANT", display_name: "Sealant", initial_on_hand: 0, reorder_threshold: 2 }
              as: EVSAdministrator
              captures: { ss: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: ["TERMINAL_CERT"] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "TERMINAL" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}" }
              as: EVSDispatcher
          trigger:
            - call: "POST /evs/clean-requests/${r1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${t1}"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "err == ERR_INSUFFICIENT_SUPPLY (422) AND msg contains 'SEALANT' (the failing BOM line: need 1, have 0 - 0)"
            - "SupplyItem.${sd}.reserved_quantity == 0 AND .${sp}.reserved_quantity == 0 AND .${sc}.reserved_quantity == 0 AND .${ss}.reserved_quantity == 0 (atomic: no partial reservation)"
            - "CleanRequest.${r1}.status == ASSIGNED AND supply_reserved == false AND Bed.${b1}.bed_status == VACANT_DIRTY"

      - name: duplicate_clean_standard_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - entities.CleanStandard.fields.clean_type
          - errors[ERR_DUPLICATE_STANDARD]
        distinguishing_aspect: |
          clean_type uniqueness is a hard 409: a second POST for ROUTINE fails
          with ERR_DUPLICATE_STANDARD and the original row's version stays 1.
        test_recipe:
          setup:
            - "Clock 08:00; ROUTINE standard exists (version captured)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
              captures: { std_v: $.data.version }
          trigger:
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 99, outbreak_multiplier_bps: 10000, atp_rlu_threshold: 500 }
              as: EVSAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_STANDARD (409)"
            - "GET /evs/clean-standards/ROUTINE still shows base_minutes 45, atp_rlu_threshold 250, version == ${std_v} (the duplicate write changed nothing)"

      - name: clock_regression_rejected_and_equality_allowed
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_CLOCK_REGRESSION]
        distinguishing_aspect: |
          The logical clock is monotonic non-decreasing: setting it backwards
          fails 400 ERR_CLOCK_REGRESSION, while re-setting the SAME instant is
          accepted (>= comparison, not >).
        test_recipe:
          setup:
            - "Clock advanced to 08:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:59:00Z" }, as: EVSAdministrator, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator, captures: { now: $.data.current_utc } }
          assert:
            - "err == ERR_CLOCK_REGRESSION (400)"
            - "now == 2026-08-01T08:00:00Z (equality re-set accepted; clock unmoved by the rejected call)"

      - name: stat_assignment_requires_eligible_staff
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - entities.StaffMember.fields.stat_eligible
          - errors[ERR_STAFF_NOT_STAT_ELIGIBLE]
        distinguishing_aspect: |
          The dispatcher-driven assign path enforces the STAT gate directly
          (the pull path only filters): a technician whose computed score is
          50.00 (one verified ROUTINE clean over a closed 2h shift) cannot be
          assigned a STAT-tier request.
        test_recipe:
          setup:
            - "Clock 08:00; unit U1; ROUTINE standard; DISINFECTANT/CLOTH; auditor A1; beds B1, B2"
            - "T1: clock-in 08:00, ROUTINE clean R1 08:00-08:45 PASS (credit 1.00), clock-out 10:00 (7200s -> score 50.00), clock back in 10:00"
            - "STAT demand (STANDARD, needed_by 20:00) then R2 ROUTINE on B2 -> priority_tier STAT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
