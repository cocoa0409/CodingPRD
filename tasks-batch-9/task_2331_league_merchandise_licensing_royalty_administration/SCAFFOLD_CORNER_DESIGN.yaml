          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z, i.e. inside 2026Q3"
            - "licensee LIC_W2 ACTIVE with an ACTIVE agreement AGR_W2 (term 2026-01-01..2027-12-31) and an AUTHORIZED DEPARTMENT authorization"
