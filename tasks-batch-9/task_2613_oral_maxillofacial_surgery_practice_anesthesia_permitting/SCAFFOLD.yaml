scenario: |
  Generate task harder than expert level!

  2613. Oral & Maxillofacial Surgery Practice & Anesthesia Permitting (oral and maxillofacial
  surgery practice): office anesthesia permit level, facility inspection and emergency drill
  records, pre-anesthesia evaluation, fasting verification and escort requirement, surgical
  scheduling with block time, sedation staffing ratios and recovery capacity, medical versus
  dental benefit determination for procedures such as pathology and trauma, implant inventory,
  sizing and manufacturer consignment, third-molar and orthognathic case coordination with
  referring dentists and orthodontists, adverse event reporting and morbidity review,
  radiography and cone-beam imaging protocol and retention

domain_name: oms-anesthesia-permitting
api_prefix: ""   # flat topology: every collection is a top-level path segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys declared in the request body; no nested
  # ownership URLs except two action sub-collections that read naturally
  # (`/surgical-cases/{caseId}/pre-anesthesia-evaluations`).

  state_machine_shape: branching
  # AnesthesiaPermit.status is cyclic (ACTIVE->PROBATION->ACTIVE,
  # SUSPENDED->INSPECTION_PENDING->ACTIVE); SurgicalCase carries two independent
  # dimensions (scheduling_status x clearance_status); FacilityInspection and
  # AdverseEvent fork on outcome with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Practice -> permits / staff / patients / blocks / lots
    - self_referential     # SurgicalCase.prerequisite_case_id -> SurgicalCase.id
    - cross_aggregate      # BenefitDetermination reads Patient + SurgicalCase; sweep reads Practice + Permit + Case + Reservation + Block
    - polymorphic          # ImagingStudy attaches to a Patient always and to a SurgicalCase optionally

  role_model: segregation_of_duties
  # The primary surgeon of a case may not day-of-verify its own pre-anesthesia
  # evaluation, may not be its sedation monitor, and may not sign off its own
  # morbidity review.

  consistency_model: immediate
  difficulty_level: expert   # 14 entities / 64 endpoints / 40 error codes / 11 calculations / 9 state machines / 3 OCC rules

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: Practice
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the oral & maxillofacial surgery practice
        constraints: 1..120 chars, required
      - name: state_code
        type: string
        source: input
        description: two-letter licensing state of the office anesthesia permit
        constraints: exactly 2 uppercase letters
      - name: recovery_bay_count
        type: integer
        source: input
        description: number of physical post-anesthesia recovery bays in the office
        constraints: ">= 1, <= 12"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        default: 15
        description: room turnover/decontamination buffer applied around every case in the same room_code
        constraints: ">= 0, <= 120"
      - name: consignment_credit_limit_cents
        type: integer
        source: input
        default: 500000
        description: ceiling on the practice's outstanding consignment liability across HELD reservations
        constraints: ">= 0"
      - name: sedation_privilege_state
        type: enum
        source: computed
        default: UNPERMITTED
        description: >-
          derived gate over every sedation operation; recomputed from the practice's open
          AnesthesiaPermit on every permit status change
        constraints: >-
          UNPERMITTED | PERMITTED | RESTRICTED | SUSPENDED; mapping = no open permit or
          permit.status IN {APPLIED, INSPECTION_PENDING} or permit.status IN {EXPIRED, REVOKED}
          -> UNPERMITTED; ACTIVE -> PERMITTED; PROBATION -> RESTRICTED; SUSPENDED -> SUSPENDED
      - name: open_adverse_event_count
        type: integer
        source: computed
        default: 0
        description: count of AdverseEvent rows whose case_id belongs to this practice and whose status != CLOSED
      - name: consignment_committed_cents
        type: integer
        source: computed
        default: 0
        description: >-
          sum of ImplantReservation.consignment_liability_cents over every reservation on a lot of
          this practice whose status IN {HELD, CONSUMED} (see calculations.consignment_liability);
          RELEASED and SHORTED rows drop out, and an owned lot contributes its full subtotal
          because is_consignment only suppresses the credit, not the exposure

  - name: AnesthesiaPermit
    parent: null
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; the permitted office
      - name: permit_level
        type: enum
        source: input
        description: office anesthesia permit level applied for
        constraints: MINIMAL_SEDATION | MODERATE_SEDATION | DEEP_SEDATION_GENERAL
      - name: applied_on
        type: datetime
        source: input
        description: ISO 8601 UTC date-time the application was filed; must be <= logical clock
      - name: status
        type: enum
        source: computed
        default: APPLIED
        description: permit lifecycle state (see 1.2 AnesthesiaPermit machine)
        constraints: APPLIED | INSPECTION_PENDING | ACTIVE | PROBATION | SUSPENDED | EXPIRED | REVOKED
      - name: issued_at
        type: datetime
        source: computed
        description: logical-clock instant of the first PASSED inspection result; null until then
      - name: expires_at
        type: datetime
        source: computed
        description: issued_at + 24 calendar months; never extended by remediation or re-inspection
      - name: required_drill_types
        type: array
        source: computed
        description: >-
          drill-type set required for permit_level (MINIMAL_SEDATION -> [AIRWAY_OBSTRUCTION,
          LOCAL_ANESTHETIC_TOXICITY]; MODERATE_SEDATION -> those two plus [LARYNGOSPASM,
          CARDIAC_ARREST]; DEEP_SEDATION_GENERAL -> those four plus [MALIGNANT_HYPERTHERMIA])
      - name: drill_compliance_ratio
        type: number
        source: computed
        default: 0.00
        description: output of calculations.drill_compliance_ratio; 2 decimal places
        constraints: 0.00 .. 1.00
      - name: probation_count
        type: integer
        source: computed
        default: 0
        description: number of times this permit has entered PROBATION
      - name: remediation_deadline_at
        type: datetime
        source: computed
        description: set to clock + 30 days on every entry into PROBATION; cleared (null) on return to ACTIVE
      - name: last_enforcement_reason
        type: enum
        source: computed
        description: reason of the most recent PROBATION / SUSPENDED / REVOKED entry; null while never enforced
        constraints: CRITICAL_DEFICIENCY | DEFICIENCY_SCORE | SENTINEL_EVENT | DRILL_LAPSE | PERMIT_EXPIRY

  - name: FacilityInspection
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> AnesthesiaPermit.id; the permit under inspection
      - name: scheduled_for
        type: datetime
        source: input
        description: ISO 8601 UTC instant the on-site inspection is booked for
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: inspection lifecycle state (see 1.2 FacilityInspection machine)
        constraints: SCHEDULED | PASSED | FAILED_CORRECTABLE | FAILED_CRITICAL
      - name: minor_deficiency_count
        type: integer
        source: input
        default: 0
        description: minor deficiencies recorded on the result form; -2 points each
        constraints: ">= 0"
      - name: major_deficiency_count
        type: integer
        source: input
        default: 0
        description: major deficiencies recorded on the result form; -7 points each
        constraints: ">= 0"
      - name: critical_deficiency_count
        type: integer
        source: input
        default: 0
        description: critical (immediate-jeopardy) deficiencies; -25 points each and dominate the outcome
        constraints: ">= 0"
      - name: inspection_score
        type: number
        source: computed
        description: output of calculations.inspection_score; floored at 0
      - name: outcome_recorded_at
        type: datetime
        source: computed
        description: logical-clock instant the result was posted; null while SCHEDULED

  - name: EmergencyDrill
    parent: null
    common_fields: false
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; office that ran the drill
      - name: drill_type
        type: enum
        source: input
        description: emergency scenario rehearsed
        constraints: >-
          AIRWAY_OBSTRUCTION | LARYNGOSPASM | MALIGNANT_HYPERTHERMIA | CARDIAC_ARREST |
          LOCAL_ANESTHETIC_TOXICITY
      - name: conducted_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the drill was run; must be <= logical clock
      - name: participant_staff_ids
        type: array
        source: input
        description: ids of StaffMember rows who took part; every id must belong to practice_id
        constraints: length >= 2
      - name: deficiency_noted
        type: boolean
        source: input
        default: false
        description: >-
          true when the drill debrief recorded an unresolved deficiency; such drills are
          EXCLUDED from calculations.drill_compliance_ratio

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; employing office
      - name: full_name
        type: string
        source: input
        description: staff member display name
        constraints: 1..120 chars
      - name: role_type
        type: enum
        source: input
        description: clinical function inside the office
        constraints: SURGEON | ANESTHESIA_MONITOR | RECOVERY_NURSE | INVENTORY_TECH
      - name: monitoring_certified
        type: boolean
        source: input
        default: false
        description: holds the anesthesia-assistant monitoring certificate (DAANCE-equivalent)
      - name: acls_expires_on
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC expiry of the ACLS/PALS card; null means never certified. Compared
          against the logical clock by calculations.sedation_staffing_requirement

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; treating office
      - name: full_name
        type: string
        source: input
        description: patient display name
      - name: date_of_birth
        type: datetime
        source: input
        description: ISO 8601 UTC birth instant; drives age_years and imaging retention
      - name: asa_class
        type: integer
        source: input
        description: ASA physical status class on record
        constraints: 1 .. 4
      - name: airway_class
        type: integer
        source: input
        description: Mallampati airway class on record
        constraints: 1 .. 4
      - name: weight_kg
        type: number
        source: input
        description: body weight in kilograms
        constraints: "> 0"
      - name: medical_plan_active
        type: boolean
        source: input
        default: false
        description: patient carries an active medical benefit plan
      - name: dental_plan_active
        type: boolean
        source: input
        default: false
        description: patient carries an active dental benefit plan
      - name: dental_annual_remaining_cents
        type: integer
        source: input
        default: 150000
        description: unspent dental annual maximum; the waterfall ceiling in calculations.benefit_allocation
        constraints: ">= 0"
      - name: age_years
        type: integer
        source: computed
        description: whole years between date_of_birth and the logical clock, floored

  - name: BlockTime
    parent: null
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; office owning the block
      - name: surgeon_id
        type: string
        source: input
        description: FK -> StaffMember.id; block owner, must have role_type == SURGEON
      - name: room_code
        type: string
        source: input
        description: operatory identifier the block occupies; room conflicts are keyed on (practice_id, room_code)
        constraints: 1..16 chars
      - name: block_start
        type: datetime
        source: input
        description: inclusive ISO 8601 UTC start of the block interval
      - name: block_end
        type: datetime
        source: input
        description: exclusive ISO 8601 UTC end of the block interval; must be > block_start
      - name: release_deadline_hours
        type: integer
        source: input
        default: 48
        description: hours before block_start at which unused block minutes become releasable
        constraints: ">= 0, <= 336"
      - name: status
        type: enum
        source: computed
        default: RESERVED
        description: block release state (see 1.2 BlockTime notes and calculations.block_utilization)
        constraints: RESERVED | PARTIALLY_RELEASED | RELEASED
      - name: block_duration_minutes
        type: integer
        source: computed
        description: whole minutes between block_start and block_end
      - name: committed_minutes
        type: integer
        source: computed
        default: 0
        description: >-
          sum of SurgicalCase.duration_minutes over cases whose block_id is this block and whose
          scheduling_status IN {BLOCK_HELD, CONFIRMED, IN_RECOVERY, COMPLETED}
      - name: released_minutes
        type: integer
        source: computed
        default: 0
        description: minutes surrendered by the release action or the compliance sweep
      - name: open_minutes
        type: integer
        source: computed
        description: block_duration_minutes - committed_minutes - released_minutes; never negative
      - name: utilization_pct
        type: number
        source: computed
        default: 0.00
        description: output of calculations.block_utilization; 2 decimal places

  - name: SurgicalCase
    parent: null
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; operating office
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; subject of the operation
      - name: primary_surgeon_id
        type: string
        source: input
        description: FK -> StaffMember.id; operating surgeon, must have role_type == SURGEON
      - name: monitor_staff_id
        type: string
        source: input
        description: >-
          FK -> StaffMember.id; dedicated sedation monitor; null is only legal when
          planned_anesthesia_level == LOCAL_ONLY
      - name: block_id
        type: string
        source: input
        description: FK -> BlockTime.id; null until the case holds block time
      - name: prerequisite_case_id
        type: string
        source: input
        description: >-
          FK -> SurgicalCase.id; staged-treatment predecessor (e.g. third-molar removal before
          orthognathic surgery) that must reach COMPLETED first; null when unstaged. Settable at
          creation and re-pointable through POST /surgical-cases/{caseId}/prerequisite while the
          case is still DRAFT or BLOCK_HELD
      - name: procedure_category
        type: enum
        source: input
        description: clinical category driving benefit orientation and referral coordination
        constraints: THIRD_MOLAR | ORTHOGNATHIC | PATHOLOGY | TRAUMA | IMPLANT | TMJ
      - name: planned_anesthesia_level
        type: enum
        source: input
        description: sedation depth planned for the case
        constraints: LOCAL_ONLY | MINIMAL_SEDATION | MODERATE_SEDATION | DEEP_SEDATION_GENERAL
      - name: planned_start
        type: datetime
        source: input
        description: inclusive ISO 8601 UTC operative start
      - name: planned_end
        type: datetime
        source: input
        description: exclusive ISO 8601 UTC operative end; must be > planned_start
      - name: total_charge_cents
        type: integer
        source: input
        description: gross professional charge for the case; the conserved total in calculations.benefit_allocation
        constraints: ">= 0"
      - name: referring_provider_npi
        type: string
        source: input
        description: >-
          optional 10-digit NPI of the referring dentist or orthodontist; supplying it on a
          THIRD_MOLAR or ORTHOGNATHIC case is what makes referral coordination mandatory before
          confirmation (see referral_coordination_status), and a case filed without it is simply
          uncoordinated
      - name: duration_minutes
        type: integer
        source: computed
        description: whole minutes between planned_start and planned_end
      - name: scheduling_status
        type: enum
        source: computed
        default: DRAFT
        description: scheduling dimension (see 1.2 SurgicalCase.scheduling_status machine)
        constraints: DRAFT | BLOCK_HELD | CONFIRMED | IN_RECOVERY | COMPLETED | CANCELLED
      - name: clearance_status
        type: enum
        source: computed
        default: NOT_EVALUATED
        description: anesthesia-clearance dimension, independent of scheduling_status (see 1.2)
        constraints: NOT_EVALUATED | EVALUATED | CLEARED | DEFERRED
      - name: referral_coordination_status
        type: enum
        source: computed
        default: NOT_REQUIRED
        description: >-
          PENDING at creation when procedure_category IN {THIRD_MOLAR, ORTHOGNATHIC} AND
          referring_provider_npi is non-null, otherwise NOT_REQUIRED; ACKNOWLEDGED once the
          referring provider's plan acknowledgement is posted
        constraints: NOT_REQUIRED | PENDING | ACKNOWLEDGED
      - name: recovery_minutes_required
        type: integer
        source: computed
        description: >-
          per planned_anesthesia_level: LOCAL_ONLY 0, MINIMAL_SEDATION 20, MODERATE_SEDATION 45,
          DEEP_SEDATION_GENERAL 90; drives the recovery-bay occupancy interval
      - name: recovery_started_at
        type: datetime
        source: computed
        description: logical-clock instant of the IN_RECOVERY transition; null before it
      - name: cancellation_reason
        type: enum
        source: computed
        description: reason recorded on the CANCELLED transition; null otherwise
        constraints: PATIENT_REQUEST | CLINICAL | PRIVILEGE_SUSPENDED

  - name: PreAnesthesiaEvaluation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SurgicalCase.id; evaluated case
      - name: evaluator_staff_id
        type: string
        source: input
        description: >-
          FK -> StaffMember.id; author of the evaluation, must belong to the case's practice and
          have role_type IN {SURGEON, ANESTHESIA_MONITOR}
      - name: asa_class_recorded
        type: integer
        source: input
        description: ASA class recorded at the pre-anesthesia visit (may differ from Patient.asa_class)
        constraints: 1 .. 4
      - name: airway_class_recorded
        type: integer
        source: input
        description: Mallampati class recorded at the pre-anesthesia visit
        constraints: 1 .. 4
      - name: comorbidity_count
        type: integer
        source: input
        default: 0
        description: number of active comorbidities documented; capped inside the risk formula
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: evaluation lifecycle state (see 1.2 PreAnesthesiaEvaluation machine)
        constraints: DRAFT | SIGNED | VERIFIED | SUPERSEDED | VOIDED
      - name: provisional_risk_score
        type: number
        source: computed
        description: variant provisional_preop of calculations.pre_anesthesia_risk_score; 2 decimals; set on SIGN
      - name: final_risk_score
        type: number
        source: computed
        description: variant final_day_of of calculations.pre_anesthesia_risk_score; null until day-of verification
      - name: risk_band
        type: enum
        source: computed
        description: >-
          band of final_risk_score when VERIFIED, otherwise of provisional_risk_score; LOW < 25,
          ELEVATED 25..39.99, HIGH 40..54.99, PROHIBITIVE >= 55
        constraints: LOW | ELEVATED | HIGH | PROHIBITIVE
      - name: fasting_solids_last_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of last solid intake, supplied at day-of verification
      - name: fasting_clears_last_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of last clear-liquid intake, supplied at day-of verification
      - name: npo_solids_minutes
        type: integer
        source: computed
        description: whole minutes between fasting_solids_last_at and the logical clock at verification
      - name: npo_clears_minutes
        type: integer
        source: computed
        description: whole minutes between fasting_clears_last_at and the logical clock at verification
      - name: escort_confirmed
        type: boolean
        source: input
        default: false
        description: responsible adult escort confirmed for discharge
      - name: escort_name
        type: string
        source: input
        description: name of the confirmed escort; null when escort_confirmed is false
      - name: signed_at
        type: datetime
        source: computed
        description: logical-clock instant of the SIGN transition
      - name: verified_at
        type: datetime
        source: computed
        description: logical-clock instant of the day-of VERIFY transition

  - name: BenefitDetermination
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SurgicalCase.id; case being adjudicated
      - name: service_lines
        type: array
        source: input
        description: >-
          ordered array of {code: string, charge_cents: integer >= 0, benefit_class: MEDICAL|DENTAL};
          array order IS the waterfall order of calculations.benefit_allocation
        constraints: length 1..8; sum(charge_cents) must equal SurgicalCase.total_charge_cents
      - name: route
        type: enum
        source: computed
        description: coordination-of-benefits route derived from patient coverage flags (see calculations.benefit_route)
        constraints: MEDICAL_PRIMARY | DENTAL_PRIMARY | SPLIT | SELF_PAY
      - name: primary_payer
        type: enum
        source: computed
        description: >-
          which plan pays first (see calculations.benefit_route); on route == SPLIT it is MEDICAL
          when procedure_category IN {PATHOLOGY, TRAUMA, TMJ, ORTHOGNATHIC} and DENTAL otherwise,
          on the single-plan routes it mirrors the only active plan, and it is null on SELF_PAY
        constraints: MEDICAL | DENTAL
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: determination lifecycle state (see 1.2 BenefitDetermination machine)
        constraints: DRAFT | SUBMITTED | PENDED | APPROVED | DENIED
      - name: submission_count
        type: integer
        source: computed
        default: 0
        description: number of times the determination has entered SUBMITTED
      - name: medical_allowed_cents
        type: integer
        source: computed
        default: 0
        description: medical plan allowance from calculations.benefit_allocation
      - name: dental_allowed_cents
        type: integer
        source: computed
        default: 0
        description: dental plan allowance from calculations.benefit_allocation, capped by the annual maximum waterfall
      - name: patient_responsibility_cents
        type: integer
        source: computed
        default: 0
        description: total_charge_cents - medical_allowed_cents - dental_allowed_cents
      - name: dental_annual_remaining_snapshot_cents
        type: integer
        source: computed
        description: Patient.dental_annual_remaining_cents read at each SUBMITTED entry; the waterfall ceiling actually used
      - name: pend_reason
        type: enum
        source: computed
        description: payer pend reason recorded on the PENDED transition; null otherwise
        constraints: MISSING_OP_REPORT | MEDICAL_NECESSITY_REVIEW | COORDINATION_OF_BENEFITS
      - name: denial_reason
        type: enum
        source: computed
        description: payer denial reason recorded on the DENIED transition; null otherwise
        constraints: NOT_COVERED_BENEFIT | EXCEEDS_ANNUAL_MAX | NO_MEDICAL_NECESSITY

  - name: ImplantLot
    parent: null
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; stocking office
      - name: manufacturer_code
        type: string
        source: input
        description: manufacturer short code (e.g. "NBL", "STM")
      - name: catalog_reference
        type: string
        source: input
        description: manufacturer catalog reference of the fixture
      - name: diameter_mm
        type: number
        source: input
        description: fixture diameter in millimetres; exact-match key for auto sizing
        constraints: "> 0"
      - name: length_mm
        type: number
        source: input
        description: fixture length in millimetres; auto sizing requires length_mm >= requested length
        constraints: "> 0"
      - name: is_consignment
        type: boolean
        source: input
        default: false
        description: true when the lot is manufacturer consignment stock (unpaid until consumed)
      - name: unit_cost_cents
        type: integer
        source: input
        description: per-fixture cost used by calculations.consignment_liability
        constraints: ">= 0"
      - name: quantity_on_hand
        type: integer
        source: input
        description: >-
          physical fixtures in the cabinet; decremented when a reservation becomes CONSUMED or
          SHORTED, and deliberately untouched by a RELEASED disposition
        constraints: ">= 0"
      - name: expiry_date
        type: datetime
        source: input
        description: ISO 8601 UTC sterility expiry; lots expiring within 30 days of the clock are ineligible
      - name: quantity_reserved
        type: integer
        source: computed
        default: 0
        description: sum of quantity over this lot's ImplantReservation rows whose status == HELD
      - name: available_quantity
        type: integer
        source: computed
        description: quantity_on_hand - quantity_reserved; never negative
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: lot usability state
        constraints: AVAILABLE | QUARANTINED

  - name: ImplantReservation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SurgicalCase.id; case the fixtures are held for
      - name: lot_id
        type: string
        source: input
        description: FK -> ImplantLot.id; explicitly requested lot, or the lot chosen by the auto-sizing selector
      - name: quantity
        type: integer
        source: input
        description: fixtures held
        constraints: ">= 1"
      - name: requested_diameter_mm
        type: number
        source: input
        description: diameter asked for on the auto-sizing endpoint; null for explicit reservations
      - name: requested_length_mm
        type: number
        source: input
        description: minimum length asked for on the auto-sizing endpoint; null for explicit reservations
      - name: selection_mode
        type: enum
        source: computed
        description: EXPLICIT when the caller named lot_id, AUTO_SIZED when the selector chose it
        constraints: EXPLICIT | AUTO_SIZED
      - name: status
        type: enum
        source: computed
        default: HELD
        description: reservation lifecycle state (see 1.2 ImplantReservation machine)
        constraints: HELD | CONSUMED | RELEASED | SHORTED
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: quantity * ImplantLot.unit_cost_cents, frozen at creation
      - name: restocking_fee_cents
        type: integer
        source: computed
        default: 0
        description: tiered restocking fee, non-zero only once the reservation reaches RELEASED
      - name: consignment_credit_cents
        type: integer
        source: computed
        default: 0
        description: consignment credit applied while HELD or CONSUMED; 0 for owned lots and for RELEASED/SHORTED
      - name: consignment_liability_cents
        type: integer
        source: computed
        default: 0
        description: output of calculations.consignment_liability for the current status

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> SurgicalCase.id; case during which the event occurred
      - name: reviewer_staff_id
        type: string
        source: computed
        description: >-
          FK -> StaffMember.id; morbidity reviewer recorded by
          POST /adverse-events/{eventId}/morbidity-review with action == OPEN; null until then
      - name: event_type
        type: enum
        source: input
        description: adverse event classification
        constraints: >-
          AIRWAY_OBSTRUCTION | HYPOXEMIA | PROLONGED_RECOVERY | UNPLANNED_INTUBATION |
          NERVE_INJURY | DEATH
      - name: severity
        type: enum
        source: input
        description: harm severity; drives the reporting deadline and the permit enforcement branch
        constraints: MINOR | MODERATE | SEVERE | SENTINEL
      - name: occurred_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the event; must be <= logical clock
      - name: narrative
        type: string
        source: input
        description: free-text description filed with the report
      - name: reported_at
        type: datetime
        source: computed
        description: logical-clock instant the report was filed
      - name: reporting_deadline_at
        type: datetime
        source: computed
        description: >-
          occurred_at + 24 hours for SENTINEL, + 72 hours for SEVERE, + 7 days for MODERATE,
          + 30 days for MINOR
      - name: late_report
        type: boolean
        source: computed
        description: true when reported_at > reporting_deadline_at
      - name: status
        type: enum
        source: computed
        default: REPORTED
        description: event lifecycle state (see 1.2 AdverseEvent machine)
        constraints: REPORTED | UNDER_MORBIDITY_REVIEW | REVIEW_SIGNED_OFF | CLOSED
      - name: regulator_notified
        type: boolean
        source: computed
        default: false
        description: >-
          independent notification track flag; set by the regulator-notification action. CLOSED
          requires this to be true whenever severity IN {SEVERE, SENTINEL}
      - name: corrective_action_required
        type: boolean
        source: computed
        description: recorded on the review sign-off; null before sign-off

  - name: ImagingStudy
    parent: null
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; imaged patient
      - name: case_id
        type: string
        source: input
        description: FK -> SurgicalCase.id; case the study was taken for; null for diagnostic-only studies
      - name: modality
        type: enum
        source: input
        description: radiographic modality
        constraints: PANORAMIC | CEPHALOMETRIC | CBCT_SMALL_FOV | CBCT_LARGE_FOV
      - name: justification_code
        type: enum
        source: input
        description: documented clinical justification; large-FOV CBCT is restricted to a subset
        constraints: >-
          IMPLANT_PLANNING | THIRD_MOLAR_ASSESSMENT | PATHOLOGY_STAGING | TRAUMA_SURVEY |
          ORTHOGNATHIC_PLANNING
      - name: acquired_at
        type: datetime
        source: input
        description: ISO 8601 UTC acquisition instant; must be <= logical clock
      - name: dose_mgy_cm2
        type: number
        source: input
        description: dose-area product recorded by the unit
        constraints: "> 0"
      - name: dose_flag
        type: enum
        source: computed
        description: >-
          WITHIN_PROTOCOL when dose_mgy_cm2 <= the modality reference level of
          calculations.imaging_retention_until (PANORAMIC 100.0, CEPHALOMETRIC 60.0,
          CBCT_SMALL_FOV 250.0, CBCT_LARGE_FOV 900.0), else ABOVE_REFERENCE_LEVEL
        constraints: WITHIN_PROTOCOL | ABOVE_REFERENCE_LEVEL
      - name: retention_until
        type: datetime
        source: computed
        description: output of calculations.imaging_retention_until

# ============================================================================
# 1.2 State Machine Table
# ============================================================================
state_machines:

  - entity: AnesthesiaPermit
    state_field: status
    initial_state: APPLIED
    terminal_states: [EXPIRED, REVOKED]
    shape: cyclic
    transitions:
      - from: APPLIED
        to: INSPECTION_PENDING
        trigger: "POST /facility-inspections"
        actor: PracticeAdministrator
        preconditions:
          - "permit.status IN {APPLIED, ACTIVE, PROBATION, SUSPENDED}"
          - "no FacilityInspection of this permit has status == SCHEDULED"
          - "scheduled_for > logical clock"
        side_effects:
          - "FacilityInspection created with status SCHEDULED"
          - "increments AnesthesiaPermit.version by 1"
          - "Practice.sedation_privilege_state recomputed (remains UNPERMITTED)"
        note: >-
          Only the APPLIED origin moves the permit. Scheduling a routine or complaint inspection
          while the permit is ACTIVE, PROBATION or SUSPENDED creates the SCHEDULED inspection and
          leaves permit.status unchanged.
      - from: INSPECTION_PENDING
        to: ACTIVE
        trigger: "POST /facility-inspections/{inspectionId}/result -> computed outcome PASSED"
        actor: PracticeAdministrator
        preconditions:
          - "inspection.status == SCHEDULED and inspection.scheduled_for <= logical clock"
          - "critical_deficiency_count == 0 and calculations.inspection_score >= 70"
          - "permit.drill_compliance_ratio >= 0.75 recomputed at this instant"
        side_effects:
          - "AnesthesiaPermit.issued_at := logical clock when currently null"
          - "AnesthesiaPermit.expires_at := issued_at + 24 calendar months when currently null"
          - "AnesthesiaPermit.last_enforcement_reason := null, remediation_deadline_at := null"
          - "Practice.sedation_privilege_state := PERMITTED"
          - "increments AnesthesiaPermit.version by 1 and Practice.version by 1"
      - from: INSPECTION_PENDING
        to: PROBATION
        trigger: "POST /facility-inspections/{inspectionId}/result -> computed outcome PASSED with drill lapse"
        actor: PracticeAdministrator
        preconditions:
          - "inspection outcome computes to PASSED"
          - "permit.drill_compliance_ratio < 0.75"
        side_effects:
          - "AnesthesiaPermit.issued_at / expires_at set exactly as on the ACTIVE branch"
          - "last_enforcement_reason := DRILL_LAPSE, probation_count += 1"
          - "remediation_deadline_at := logical clock + 30 days"
          - "Practice.sedation_privilege_state := RESTRICTED"
          - "cascade: every SurgicalCase of this practice with planned_anesthesia_level == DEEP_SEDATION_GENERAL and clearance_status == CLEARED moves to clearance_status DEFERRED"
      - from: INSPECTION_PENDING
        to: APPLIED
        trigger: "POST /facility-inspections/{inspectionId}/result -> computed outcome FAILED_CORRECTABLE"
        actor: PracticeAdministrator
        preconditions:
          - "critical_deficiency_count == 0 and calculations.inspection_score < 70"
        side_effects:
          - "last_enforcement_reason := DEFICIENCY_SCORE"
          - "Practice.sedation_privilege_state recomputed to UNPERMITTED"
          - "increments AnesthesiaPermit.version by 1"
        note: "Revision cycle - the applicant may schedule a fresh inspection from APPLIED again."
      - from: INSPECTION_PENDING
        to: REVOKED
        trigger: "POST /facility-inspections/{inspectionId}/result -> computed outcome FAILED_CRITICAL"
        actor: PracticeAdministrator
        preconditions:
          - "critical_deficiency_count >= 1"
          - "permit.issued_at is null (the permit was never issued)"
        side_effects:
          - "last_enforcement_reason := CRITICAL_DEFICIENCY"
          - "Practice.sedation_privilege_state recomputed to UNPERMITTED"
          - "increments AnesthesiaPermit.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /facility-inspections/{inspectionId}/result -> computed outcome FAILED_CRITICAL"
        actor: PracticeAdministrator
        preconditions:
          - "critical_deficiency_count >= 1"
        side_effects:
          - "last_enforcement_reason := CRITICAL_DEFICIENCY"
          - "hop 1: Practice.sedation_privilege_state := SUSPENDED"
          - "hop 2: because the practice privilege is SUSPENDED, every SurgicalCase of the practice with scheduling_status == CONFIRMED and planned_anesthesia_level != LOCAL_ONLY reverts to scheduling_status BLOCK_HELD and clearance_status DEFERRED"
          - "hop 3: because those cases left CONFIRMED, each of their ImplantReservation rows with status == HELD moves to RELEASED (restocking fee applied, consignment credit dropped to 0)"
          - "hop 4: because those reservations left HELD, each parent ImplantLot.quantity_reserved is decremented by the released quantity, available_quantity recomputed, and ImplantLot.version incremented"
          - "hop 5: because reservation liabilities changed, Practice.consignment_committed_cents is recomputed"
          - "increments AnesthesiaPermit.version by 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /facility-inspections/{inspectionId}/result -> computed outcome FAILED_CORRECTABLE"
        actor: PracticeAdministrator
        preconditions:
          - "critical_deficiency_count == 0 and calculations.inspection_score < 70"
        side_effects:
          - "last_enforcement_reason := DEFICIENCY_SCORE, probation_count += 1"
          - "remediation_deadline_at := logical clock + 30 days"
          - "Practice.sedation_privilege_state := RESTRICTED"
          - "cascade: DEEP_SEDATION_GENERAL cases of this practice with clearance_status == CLEARED move to DEFERRED"
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /adverse-events with severity == SENTINEL"
        actor: system
        preconditions:
          - "the event's case belongs to this permit's practice"
          - "permit.status == ACTIVE"
        side_effects:
          - "last_enforcement_reason := SENTINEL_EVENT, probation_count += 1"
          - "remediation_deadline_at := logical clock + 30 days"
          - "hop 1: Practice.sedation_privilege_state := RESTRICTED"
          - "hop 2: because the practice privilege is RESTRICTED, every SurgicalCase of the practice with planned_anesthesia_level == DEEP_SEDATION_GENERAL and clearance_status == CLEARED moves to clearance_status DEFERRED"
          - "hop 3: because those cases lost clearance, their VERIFIED PreAnesthesiaEvaluation rows keep status VERIFIED but the case can no longer be confirmed - confirmation now fails validation priority 41"
          - "increments AnesthesiaPermit.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /adverse-events with severity == SENTINEL"
        actor: system
        preconditions:
          - "permit.status == PROBATION"
        side_effects:
          - "last_enforcement_reason := SENTINEL_EVENT"
          - "the same hop 1..hop 5 chain as the ACTIVE -> SUSPENDED transition"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /anesthesia-permits/{permitId}/remediation"
        actor: PracticeAdministrator
        preconditions:
          - "permit.status == PROBATION"
          - "logical clock <= permit.remediation_deadline_at"
          - "permit.drill_compliance_ratio recomputed at this instant >= 0.75"
        side_effects:
          - "last_enforcement_reason := null, remediation_deadline_at := null"
          - "Practice.sedation_privilege_state := PERMITTED"
          - "increments AnesthesiaPermit.version by 1"
        note: >-
          Reinstatement is forward-only: SurgicalCase rows already pushed to clearance_status
          DEFERRED are NOT restored, and reservations already RELEASED are NOT re-held.
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /_ops/run-compliance-sweep (remediation window lapsed)"
        actor: system
        preconditions:
          - "permit.status == PROBATION"
          - "logical clock > permit.remediation_deadline_at"
        side_effects:
          - "last_enforcement_reason := DRILL_LAPSE"
          - "the same hop 1..hop 5 chain as the ACTIVE -> SUSPENDED transition"
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /_ops/run-compliance-sweep (drill compliance recomputed below threshold)"
        actor: system
        preconditions:
          - "permit.status == ACTIVE"
          - "calculations.drill_compliance_ratio recomputed at sweep time < 0.75"
        side_effects:
          - "last_enforcement_reason := DRILL_LAPSE, probation_count += 1"
          - "remediation_deadline_at := logical clock + 30 days"
          - "Practice.sedation_privilege_state := RESTRICTED"
          - "cascade: DEEP_SEDATION_GENERAL cases with clearance_status == CLEARED move to DEFERRED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /facility-inspections/{inspectionId}/result -> computed outcome PASSED"
        actor: PracticeAdministrator
        preconditions:
          - "permit.status == SUSPENDED"
          - "inspection outcome computes to PASSED"
          - "permit.drill_compliance_ratio >= 0.75"
        side_effects:
          - "last_enforcement_reason := null"
          - "Practice.sedation_privilege_state := PERMITTED"
          - "increments AnesthesiaPermit.version by 1"
        note: "Reinstatement cycle; expires_at is NOT extended."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_ops/run-compliance-sweep (term elapsed)"
        actor: system
        preconditions:
          - "logical clock >= permit.expires_at"
        side_effects:
          - "last_enforcement_reason := PERMIT_EXPIRY"
          - "Practice.sedation_privilege_state := UNPERMITTED"
          - "the same hop 2..hop 5 case/reservation/lot chain as the ACTIVE -> SUSPENDED transition"
      - from: PROBATION
        to: EXPIRED
        trigger: "POST /_ops/run-compliance-sweep (term elapsed)"
        actor: system
        preconditions:
          - "logical clock >= permit.expires_at"
        side_effects:
          - "identical to the ACTIVE -> EXPIRED transition"

  - entity: FacilityInspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED_CORRECTABLE, FAILED_CRITICAL]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /facility-inspections/{inspectionId}/result"
        actor: PracticeAdministrator
        preconditions:
          - "inspection.status == SCHEDULED"
          - "inspection.scheduled_for <= logical clock"
          - "critical_deficiency_count == 0"
          - "calculations.inspection_score >= 70"
        side_effects:
          - "inspection_score persisted, outcome_recorded_at := logical clock"
          - "drives the permit branch INSPECTION_PENDING -> ACTIVE / PROBATION or SUSPENDED -> ACTIVE"
      - from: SCHEDULED
        to: FAILED_CORRECTABLE
        trigger: "POST /facility-inspections/{inspectionId}/result"
        actor: PracticeAdministrator
        preconditions:
          - "critical_deficiency_count == 0"
          - "calculations.inspection_score < 70"
        side_effects:
          - "inspection_score persisted, outcome_recorded_at := logical clock"
          - "drives the permit branch INSPECTION_PENDING -> APPLIED or ACTIVE -> PROBATION"
      - from: SCHEDULED
        to: FAILED_CRITICAL
        trigger: "POST /facility-inspections/{inspectionId}/result"
        actor: PracticeAdministrator
        preconditions:
          - "critical_deficiency_count >= 1"
        side_effects:
          - "inspection_score persisted (critical count dominates the outcome irrespective of score)"
          - "drives the permit branch INSPECTION_PENDING -> REVOKED or ACTIVE/PROBATION -> SUSPENDED"

  - entity: SurgicalCase
    state_field: scheduling_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching_with_revert
    note: >-
      scheduling_status evolves independently of clearance_status (next machine). Neither
      dimension's transitions read or write the other except where a precondition says so.
    transitions:
      - from: DRAFT
        to: BLOCK_HELD
        trigger: "POST /surgical-cases/{caseId}/hold-block"
        actor: SchedulingCoordinator
        preconditions:
          - "case.scheduling_status == DRAFT"
          - "BlockTime exists, block.practice_id == case.practice_id"
          - "block.surgeon_id == case.primary_surgeon_id"
          - "block.status != RELEASED"
          - "[case.planned_start, case.planned_end) is contained in [block.block_start, block.block_end)"
          - "no room-turnover collision in the same room_code per validations[priority=76]"
          - "case.duration_minutes <= block.open_minutes per validations[priority=79]"
        side_effects:
          - "SurgicalCase.block_id := the held block"
          - "BlockTime.committed_minutes += case.duration_minutes; open_minutes and utilization_pct recomputed"
          - "increments BlockTime.version by 1"
      - from: BLOCK_HELD
        to: CONFIRMED
        trigger: "POST /surgical-cases/{caseId}/confirm"
        actor: SchedulingCoordinator
        preconditions:
          - "case.scheduling_status == BLOCK_HELD"
          - "expected_block_version == BlockTime.version (concurrency_rules[case-confirm-stale-block])"
          - "case.clearance_status == CLEARED"
          - "validations[priority=50] admits the case: the practice's sedation_privilege_state permits planned_anesthesia_level, so a level above LOCAL_ONLY requires PERMITTED (or RESTRICTED for anything below DEEP_SEDATION_GENERAL) while a LOCAL_ONLY case is admitted even when the practice is UNPERMITTED or SUSPENDED"
          - "permit.permit_level rank >= planned_anesthesia_level rank (LOCAL_ONLY 0 < MINIMAL_SEDATION 1 < MODERATE_SEDATION 2 < DEEP_SEDATION_GENERAL 3; a LOCAL_ONLY case needs no permit level)"
          - "calculations.sedation_staffing_requirement is satisfied"
          - "prerequisite_case_id is null OR that case has scheduling_status == COMPLETED"
          - "referral_coordination_status != PENDING"
          - "calculations.recovery_capacity_projection admits the case"
        side_effects:
          - "increments BlockTime.version by 1 (utilization_pct re-published against the confirmed roster)"
          - "increments SurgicalCase.version by 1"
      - from: CONFIRMED
        to: BLOCK_HELD
        trigger: "system reversion when Practice.sedation_privilege_state leaves PERMITTED"
        actor: system
        preconditions:
          - "case.planned_anesthesia_level != LOCAL_ONLY"
          - "case.scheduling_status == CONFIRMED"
        side_effects:
          - "clearance_status := DEFERRED"
          - "every ImplantReservation of this case with status == HELD moves to RELEASED, which decrements its lot's quantity_reserved and increments ImplantLot.version"
          - "BlockTime.committed_minutes is unchanged (BLOCK_HELD still counts as committed)"
      - from: CONFIRMED
        to: IN_RECOVERY
        trigger: "POST /surgical-cases/{caseId}/start-recovery"
        actor: Surgeon
        preconditions:
          - "case.scheduling_status == CONFIRMED"
          - "X-User-ID == case.primary_surgeon_id"
          - "logical clock >= case.planned_start"
        side_effects:
          - "recovery_started_at := logical clock"
          - "the case now occupies a recovery bay for recovery_minutes_required minutes"
          - "increments SurgicalCase.version by 1"
      - from: IN_RECOVERY
        to: COMPLETED
        trigger: "POST /surgical-cases/{caseId}/complete"
        actor: Surgeon
        preconditions:
          - "case.scheduling_status == IN_RECOVERY"
          - "X-User-ID == case.primary_surgeon_id"
          - "logical clock >= recovery_started_at + recovery_minutes_required minutes"
          - "no ImplantReservation of this case remains in status HELD"
        side_effects:
          - "the recovery bay is freed for capacity projections"
          - "the case becomes eligible as a prerequisite_case_id for staged successors"
          - "increments SurgicalCase.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "case.scheduling_status IN {DRAFT, BLOCK_HELD, CONFIRMED}"
        side_effects:
          - "cancellation_reason := the posted reason"
          - "every PreAnesthesiaEvaluation of this case with status IN {DRAFT, SIGNED, VERIFIED} moves to VOIDED"
          - "clearance_status is deliberately left untouched"
      - from: BLOCK_HELD
        to: CANCELLED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "case.scheduling_status IN {DRAFT, BLOCK_HELD, CONFIRMED}"
        side_effects:
          - "hop 1: BlockTime.committed_minutes -= case.duration_minutes; open_minutes and utilization_pct recomputed; increments BlockTime.version by 1"
          - "hop 2: because the case left the committed roster, each of its ImplantReservation rows with status == HELD moves to RELEASED with restocking fee applied and consignment_credit_cents reset to 0"
          - "hop 3: because those reservations left HELD, each parent ImplantLot.quantity_reserved is decremented and ImplantLot.version incremented"
          - "hop 4: because lot liabilities changed, Practice.consignment_committed_cents is recomputed"
          - "PreAnesthesiaEvaluation rows of this case in {DRAFT, SIGNED, VERIFIED} move to VOIDED"
          - "clearance_status is deliberately left untouched"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "case.scheduling_status IN {DRAFT, BLOCK_HELD, CONFIRMED}"
        side_effects:
          - "identical hop 1..hop 4 chain as the BLOCK_HELD -> CANCELLED transition"
          - "PreAnesthesiaEvaluation rows of this case in {DRAFT, SIGNED, VERIFIED} move to VOIDED with their computed scores retained"
          - "clearance_status is deliberately left untouched"
          - "the recovery bay projection for this case is dropped"

  - entity: SurgicalCase
    state_field: clearance_status
    initial_state: NOT_EVALUATED
    terminal_states: []
    shape: cyclic
    note: >-
      Second, independent state dimension on the same row. A case may be CANCELLED with
      clearance_status CLEARED, or COMPLETED-blocked while DEFERRED; the dimensions only meet in
      the confirm precondition and in the privilege cascades.
    transitions:
      - from: NOT_EVALUATED
        to: EVALUATED
        trigger: "POST /pre-anesthesia-evaluations/{evaluationId}/sign"
        actor: AnesthesiaCoordinator
        preconditions:
          - "evaluation.status == DRAFT and evaluation.case_id == case.id"
          - "X-User-ID == evaluation.evaluator_staff_id"
        side_effects:
          - "evaluation.provisional_risk_score and risk_band computed"
          - "increments SurgicalCase.version by 1"
      - from: EVALUATED
        to: CLEARED
        trigger: "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification with intent == CLEAR"
        actor: AnesthesiaCoordinator
        preconditions:
          - "evaluation.status == SIGNED"
          - "X-User-ID != case.primary_surgeon_id (segregation of duties)"
          - "npo_solids_minutes >= 480 and npo_clears_minutes >= 120 whenever planned_anesthesia_level != LOCAL_ONLY"
          - "escort_confirmed == true whenever planned_anesthesia_level != LOCAL_ONLY"
          - "risk_band computed from final_risk_score != PROHIBITIVE"
        side_effects:
          - "evaluation.status := VERIFIED, final_risk_score and risk_band published"
          - "increments SurgicalCase.version by 1"
      - from: EVALUATED
        to: DEFERRED
        trigger: "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification with intent == DEFER"
        actor: AnesthesiaCoordinator
        preconditions:
          - "evaluation.status == SIGNED"
          - "X-User-ID != case.primary_surgeon_id"
        side_effects:
          - "evaluation.status := VERIFIED with final_risk_score published; no clinical gate is enforced on this branch"
      - from: CLEARED
        to: DEFERRED
        trigger: "system cascade when the practice permit enters PROBATION / SUSPENDED / EXPIRED"
        actor: system
        preconditions:
          - "cascade scope rule: PROBATION defers only DEEP_SEDATION_GENERAL cases; SUSPENDED and EXPIRED defer every case whose planned_anesthesia_level != LOCAL_ONLY"
        side_effects:
          - "the case can no longer satisfy the confirm precondition until a fresh evaluation is signed and verified"
      - from: CLEARED
        to: NOT_EVALUATED
        trigger: "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations (supersede)"
        actor: AnesthesiaCoordinator
        preconditions:
          - "expected_case_version == SurgicalCase.version (concurrency_rules[evaluation-create-stale-case])"
          - "the case has an existing PreAnesthesiaEvaluation with status IN {SIGNED, VERIFIED}"
        side_effects:
          - "the prior SIGNED/VERIFIED evaluation moves to SUPERSEDED"
          - "clearance_status resets to NOT_EVALUATED - the new evaluation must be signed and verified again"
          - "increments SurgicalCase.version by 1"
      - from: DEFERRED
        to: NOT_EVALUATED
        trigger: "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations (supersede)"
        actor: AnesthesiaCoordinator
        preconditions:
          - "expected_case_version == SurgicalCase.version"
        side_effects:
          - "identical to the CLEARED -> NOT_EVALUATED transition; this is the revision loop that lets a deferred case be re-cleared"
      - from: EVALUATED
        to: NOT_EVALUATED
        trigger: "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations (supersede)"
        actor: AnesthesiaCoordinator
        preconditions:
          - "expected_case_version == SurgicalCase.version"
        side_effects:
          - "identical to the CLEARED -> NOT_EVALUATED transition"

  - entity: PreAnesthesiaEvaluation
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    shape: branching
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /pre-anesthesia-evaluations/{evaluationId}/sign"
        actor: AnesthesiaCoordinator
        preconditions:
          - "evaluation.status == DRAFT"
          - "X-User-ID == evaluation.evaluator_staff_id"
          - "case.scheduling_status NOT IN {COMPLETED, CANCELLED}"
        side_effects:
          - "signed_at := logical clock"
          - "provisional_risk_score := calculations.pre_anesthesia_risk_score variant provisional_preop"
          - "risk_band derived from provisional_risk_score"
          - "SurgicalCase.clearance_status := EVALUATED"
      - from: SIGNED
        to: VERIFIED
        trigger: "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
        actor: AnesthesiaCoordinator
        preconditions:
          - "evaluation.status == SIGNED"
          - "case.scheduling_status NOT IN {COMPLETED, CANCELLED}"
          - "X-User-ID != case.primary_surgeon_id"
          - "when intent == CLEAR: fasting, escort and risk-band gates all pass"
        side_effects:
          - "verified_at := logical clock; npo_solids_minutes and npo_clears_minutes computed"
          - "final_risk_score := calculations.pre_anesthesia_risk_score variant final_day_of; risk_band re-derived from it"
          - "SurgicalCase.clearance_status := CLEARED (intent CLEAR) or DEFERRED (intent DEFER)"
      - from: SIGNED
        to: SUPERSEDED
        trigger: "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations"
        actor: AnesthesiaCoordinator
        preconditions:
          - "a newer evaluation is created for the same case"
        side_effects:
          - "SurgicalCase.clearance_status := NOT_EVALUATED"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations"
        actor: AnesthesiaCoordinator
        preconditions:
          - "a newer evaluation is created for the same case"
        side_effects:
          - "SurgicalCase.clearance_status := NOT_EVALUATED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "the parent case moves to CANCELLED"
        side_effects:
          - "no score is published on a voided evaluation"
      - from: SIGNED
        to: VOIDED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "the parent case moves to CANCELLED"
        side_effects:
          - "provisional_risk_score is retained for the record; final_risk_score stays null"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /surgical-cases/{caseId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "the parent case moves to CANCELLED"
        side_effects:
          - "both scores are retained for the record"

  - entity: BenefitDetermination
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /benefit-determinations/{determinationId}/submit"
        actor: BenefitsSpecialist
        preconditions:
          - "determination.status IN {DRAFT, PENDED}"
          - "the case has a PreAnesthesiaEvaluation with status == VERIFIED"
          - "sum(service_lines[].charge_cents) == SurgicalCase.total_charge_cents"
        side_effects:
          - "submission_count += 1"
          - "dental_annual_remaining_snapshot_cents := Patient.dental_annual_remaining_cents at this instant"
          - "route, primary_payer, medical_allowed_cents, dental_allowed_cents and patient_responsibility_cents recomputed by calculations.benefit_allocation"
      - from: PENDED
        to: SUBMITTED
        trigger: "POST /benefit-determinations/{determinationId}/submit (resubmission)"
        actor: BenefitsSpecialist
        preconditions:
          - "determination.status == PENDED"
        side_effects:
          - "pend_reason := null; submission_count += 1"
          - "the whole allocation is recomputed against a fresh dental_annual_remaining_snapshot_cents"
          - "the conserved identity medical_allowed_cents + dental_allowed_cents + patient_responsibility_cents == SurgicalCase.total_charge_cents holds again after the recompute"
        note: "Revision loop - a determination may bounce SUBMITTED -> PENDED -> SUBMITTED any number of times."
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /benefit-determinations/{determinationId}/payer-response with outcome == PENDED"
        actor: BenefitsSpecialist
        preconditions:
          - "determination.status == SUBMITTED"
          - "pend_reason is supplied"
        side_effects:
          - "pend_reason persisted; allowances and patient_responsibility_cents are frozen as computed at submission"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /benefit-determinations/{determinationId}/payer-response with outcome == APPROVED"
        actor: BenefitsSpecialist
        preconditions:
          - "determination.status == SUBMITTED"
        side_effects:
          - "Patient.dental_annual_remaining_cents -= dental_allowed_cents (never below 0)"
          - "increments Patient.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /benefit-determinations/{determinationId}/payer-response with outcome == DENIED"
        actor: BenefitsSpecialist
        preconditions:
          - "determination.status == SUBMITTED"
          - "denial_reason is supplied"
        side_effects:
          - "medical_allowed_cents := 0, dental_allowed_cents := 0"
          - "patient_responsibility_cents := SurgicalCase.total_charge_cents (the conserved money identity is preserved on the denial branch)"
          - "Patient.dental_annual_remaining_cents is NOT decremented"

  - entity: ImplantReservation
    state_field: status
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED, SHORTED]
    shape: branching
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /implant-reservations/{reservationId}/consume"
        actor: InventoryManager
        preconditions:
          - "reservation.status == HELD"
          - "SurgicalCase.scheduling_status IN {CONFIRMED, IN_RECOVERY}"
          - "ImplantLot.status == AVAILABLE"
        side_effects:
          - "ImplantLot.quantity_on_hand -= reservation.quantity"
          - "ImplantLot.quantity_reserved -= reservation.quantity; available_quantity recomputed"
          - "increments ImplantLot.version by 1"
          - "consignment_liability_cents := line_subtotal_cents - consignment_credit_cents (unchanged from HELD)"
          - "Practice.consignment_committed_cents recomputed (this reservation drops out of the HELD sum)"
      - from: HELD
        to: RELEASED
        trigger: "POST /implant-reservations/{reservationId}/release with disposition == RELEASED"
        actor: InventoryManager
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "ImplantLot.quantity_on_hand is unchanged; quantity_reserved -= reservation.quantity"
          - "increments ImplantLot.version by 1"
          - "restocking_fee_cents := calculations.consignment_liability tiered fee; consignment_credit_cents := 0; consignment_liability_cents := restocking_fee_cents"
          - "Practice.consignment_committed_cents recomputed"
      - from: HELD
        to: SHORTED
        trigger: "POST /implant-reservations/{reservationId}/release with disposition == SHORTED"
        actor: InventoryManager
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "ImplantLot.quantity_on_hand -= reservation.quantity AND quantity_reserved -= reservation.quantity (the fixtures are physically unaccounted for)"
          - "restocking_fee_cents := 0; consignment_credit_cents := 0; consignment_liability_cents := line_subtotal_cents"
          - "increments ImplantLot.version by 1; Practice.consignment_committed_cents recomputed"
      - from: HELD
        to: RELEASED
        trigger: "system cascade from SurgicalCase leaving the committed roster (cancel, or privilege-driven reversion)"
        actor: system
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "identical field arithmetic to the operator-driven RELEASED transition, including the restocking fee"

  - entity: AdverseEvent
    state_field: status
    initial_state: REPORTED
    terminal_states: [CLOSED]
    shape: fork_join
    note: >-
      Two tracks leave REPORTED with different side-effect sets: the morbidity-review track walks
      status REPORTED -> UNDER_MORBIDITY_REVIEW -> REVIEW_SIGNED_OFF, while the regulator track
      only flips the regulator_notified flag. CLOSED is the join point.
    transitions:
      - from: REPORTED
        to: UNDER_MORBIDITY_REVIEW
        trigger: "POST /adverse-events/{eventId}/morbidity-review with action == OPEN"
        actor: QualityReviewer
        preconditions:
          - "event.status == REPORTED"
          - "reviewer_staff_id belongs to the same practice as the event's case"
          - "reviewer_staff_id != SurgicalCase.primary_surgeon_id (segregation of duties)"
        side_effects:
          - "reviewer_staff_id persisted on the event"
      - from: UNDER_MORBIDITY_REVIEW
        to: REVIEW_SIGNED_OFF
        trigger: "POST /adverse-events/{eventId}/morbidity-review with action == SIGN_OFF"
        actor: QualityReviewer
        preconditions:
          - "event.status == UNDER_MORBIDITY_REVIEW"
          - "X-User-ID == event.reviewer_staff_id"
        side_effects:
          - "corrective_action_required persisted from the request"
      - from: REVIEW_SIGNED_OFF
        to: CLOSED
        trigger: "POST /adverse-events/{eventId}/close"
        actor: QualityReviewer
        preconditions:
          - "event.status == REVIEW_SIGNED_OFF"
          - "join condition: severity IN {SEVERE, SENTINEL} implies regulator_notified == true"
        side_effects:
          - "Practice.open_adverse_event_count recomputed (this event drops out)"
          - "increments Practice.version by 1"
      - from: REPORTED
        to: REPORTED
        trigger: "POST /adverse-events/{eventId}/regulator-notification"
        actor: QualityReviewer
        preconditions:
          - "event.status IN {REPORTED, UNDER_MORBIDITY_REVIEW, REVIEW_SIGNED_OFF}"
          - "regulator_notified == false"
        side_effects:
          - "regulator_notified := true; status is deliberately NOT advanced - this is the independent notification track"
          - "increments AdverseEvent.version by 1"

  - entity: BlockTime
    state_field: status
    initial_state: RESERVED
    terminal_states: [RELEASED]
    shape: branching
    transitions:
      - from: RESERVED
        to: PARTIALLY_RELEASED
        trigger: "POST /block-times/{blockId}/release"
        actor: SchedulingCoordinator
        preconditions:
          - "block.status == RESERVED"
          - "block.committed_minutes > 0"
        side_effects:
          - "released_minutes += open_minutes; open_minutes := 0"
          - "utilization_pct recomputed against block_duration_minutes (committed_minutes unchanged)"
          - "the conserved identity committed_minutes + released_minutes + open_minutes == block_duration_minutes holds"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /block-times/{blockId}/release"
        actor: SchedulingCoordinator
        preconditions:
          - "block.status == RESERVED"
          - "block.committed_minutes == 0"
        side_effects:
          - "released_minutes := block_duration_minutes; open_minutes := 0"
          - "no further case may hold this block (hold-block precondition block.status != RELEASED)"
      - from: RESERVED
        to: PARTIALLY_RELEASED
        trigger: "POST /_ops/run-compliance-sweep (release deadline reached with low utilization)"
        actor: system
        preconditions:
          - "logical clock >= block_start - release_deadline_hours hours"
          - "utilization_pct < 60.00"
          - "committed_minutes > 0"
        side_effects:
          - "released_minutes += open_minutes; open_minutes := 0"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /_ops/run-compliance-sweep (release deadline reached with nothing committed)"
        actor: system
        preconditions:
          - "logical clock >= block_start - release_deadline_hours hours"
          - "committed_minutes == 0"
        side_effects:
          - "released_minutes := block_duration_minutes; open_minutes := 0"

# ============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ============================================================================
concurrency_rules:
  - rule_id: case-confirm-stale-block
    parent_entity: BlockTime
    write_endpoint: "POST /surgical-cases/{caseId}/confirm"
    occ_field: "expected_block_version"
    description: |
      Confirming a case against a block whose version has advanced since the client last read it
      is rejected. This captures the writer whose view of the block predates another case holding
      or confirming block minutes - an operation that legitimately changes the block's committed
      and open minutes, so the second confirmation would otherwise succeed against a block roster
      it never observed.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
  - rule_id: reservation-create-stale-lot
    parent_entity: ImplantLot
    write_endpoint: "POST /implant-reservations"
    occ_field: "expected_lot_version"
    description: |
      Creating an explicit implant reservation against a lot whose version has advanced since the
      client last read it is rejected. This captures the writer whose view of the lot predates
      another reservation, consumption or quarantine action on the same lot - each of which
      legitimately supersedes the caller's availability snapshot.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: evaluation-create-stale-case
    parent_entity: SurgicalCase
    write_endpoint: "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations"
    occ_field: "expected_case_version"
    description: |
      Creating a pre-anesthesia evaluation for a case whose version has advanced since the client
      last read it is rejected. Creation legitimately supersedes any prior SIGNED or VERIFIED
      evaluation and resets clearance_status, so a writer holding a stale view of the case would
      silently discard an evaluation it never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules
# ============================================================================
calculations:
  - name: pre_anesthesia_risk_score
    trigger: >-
      Recomputed on POST /surgical-cases/{caseId}/pre-anesthesia-evaluations (provisional variant),
      on POST /pre-anesthesia-evaluations/{evaluationId}/sign (provisional variant, refreshed
      against the case's current planned_anesthesia_level) and on
      POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification (final variant).
    algorithm: weighted_scoring
    formula: |
      # ---- factor block (identical in both variants) ----
      base_points        = 10 * asa_class_recorded
      airway_points      = 8 * max(0, airway_class_recorded - 2)
      age_points         = 6 if Patient.age_years >= 70
                           else 4 if Patient.age_years < 3
                           else 0
      comorbidity_points = min(COMORBIDITY_POINT_CAP, 3 * comorbidity_count)
      weight_points      = 5 if Patient.weight_kg >= HEAVY_WEIGHT_KG else 0

      factor_subtotal = base_points + airway_points + age_points
                      + comorbidity_points + weight_points

      level_multiplier = LEVEL_MULTIPLIER[SurgicalCase.planned_anesthesia_level]

      core_score = round_half_up(factor_subtotal * level_multiplier, 2)

      # ---- provisional variant stops here ----
      provisional_risk_score = core_score

      # ---- final variant adds flat penalties AFTER the multiplier ----
      penalty = 0
      if npo_solids_minutes < NPO_SOLIDS_MINUTES_MIN: penalty += 15
      if escort_confirmed == false
         and SurgicalCase.planned_anesthesia_level != 'LOCAL_ONLY': penalty += 10
      if Practice.sedation_privilege_state == 'RESTRICTED': penalty += 6

      final_risk_score = round_half_up(core_score + penalty, 2)

      # ---- band comes from whichever score the variant produced ----
      score = final_risk_score if the final variant ran else provisional_risk_score
      risk_band = 'LOW'         if score <  25
                  'ELEVATED'    if 25 <= score < 40
                  'HIGH'        if 40 <= score < 55
                  'PROHIBITIVE' if score >= 55
    input_set: >-
      The evaluation's own recorded asa_class_recorded / airway_class_recorded /
      comorbidity_count (never the Patient's asa_class and airway_class, which are only the intake
      snapshot), the Patient's age_years and weight_kg, the parent SurgicalCase's
      planned_anesthesia_level, and - for the final variant only - the evaluation's fasting and
      escort fields plus the Practice's current sedation_privilege_state. Evaluations in status
      SUPERSEDED or VOIDED are never rescored.
    constants:
      COMORBIDITY_POINT_CAP: 12
      HEAVY_WEIGHT_KG: 120
      NPO_SOLIDS_MINUTES_MIN: 480
      NPO_CLEARS_MINUTES_MIN: 120
      LEVEL_MULTIPLIER:
        LOCAL_ONLY: 0.5
        MINIMAL_SEDATION: 0.8
        MODERATE_SEDATION: 1.0
        DEEP_SEDATION_GENERAL: 1.3
      BAND_ELEVATED_FLOOR: 25
      BAND_HIGH_FLOOR: 40
      BAND_PROHIBITIVE_FLOOR: 55
    precision: "2 decimal places, round_half_up; the multiplication is rounded once, then the integer penalties are added"
    variants:
      - name: provisional_preop
        when: "evaluation creation and signature, before the day of surgery"
        difference: >-
          Fasting, escort and privilege penalties are NOT applied - only the multiplied factor
          block counts, so the score is strictly the core score.
      - name: final_day_of
        when: "day-of-surgery verification (POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification)"
        difference: >-
          The three flat penalties (15 fasting / 10 escort / 6 restricted privilege) are added to
          the already-rounded core score. Because they are added AFTER the level multiplier they
          are never scaled by it, so an identical evaluation can sit two bands apart between the
          two variants.

  - name: benefit_route
    trigger: "POST /benefit-determinations (initial computation) and every POST /benefit-determinations/{determinationId}/submit"
    algorithm: threshold
    formula: |
      medical = Patient.medical_plan_active
      dental  = Patient.dental_plan_active

      if      medical and dental: route = 'SPLIT'
      elif    medical:            route = 'MEDICAL_PRIMARY'
      elif    dental:             route = 'DENTAL_PRIMARY'
      else:                       route = 'SELF_PAY'

      # primary_payer only exists on the SPLIT route; on the single-plan routes it mirrors
      # the only active plan, and on SELF_PAY it is null.
      if route == 'SPLIT':
          primary_payer = 'MEDICAL' if SurgicalCase.procedure_category
                                       IN MEDICAL_PRIMARY_CATEGORIES
                          else 'DENTAL'
      elif route == 'MEDICAL_PRIMARY': primary_payer = 'MEDICAL'
      elif route == 'DENTAL_PRIMARY':  primary_payer = 'DENTAL'
      else:                            primary_payer = null
    input_set: "The parent SurgicalCase's procedure_category and the Patient's two plan-active flags as they stand at the moment of the call."
    constants:
      MEDICAL_PRIMARY_CATEGORIES: [PATHOLOGY, TRAUMA, TMJ, ORTHOGNATHIC]
      DENTAL_PRIMARY_CATEGORIES: [THIRD_MOLAR, IMPLANT]
    precision: "not applicable (categorical)"

  - name: benefit_allocation
    trigger: "POST /benefit-determinations (initial computation) and every POST /benefit-determinations/{determinationId}/submit, including resubmission out of PENDED"
    algorithm: waterfall_allocation
    formula: |
      remaining_dental = dental_annual_remaining_snapshot_cents   # frozen at submit time
      lines            = service_lines IN THE ORDER SUPPLIED BY THE CLIENT (never re-sorted)

      if route == 'SELF_PAY':
          medical_allowed_cents = 0
          dental_allowed_cents  = 0

      elif primary_payer == 'MEDICAL':
          # medical pays first, per line, on the full line charge
          medical_allowed_cents = SUM over lines of
              round_half_up(line.charge_cents * MEDICAL_COINSURANCE)
          # dental then looks only at each line's residual, still per line, and is
          # capped by the running annual remainder in line order. This residual pass
          # runs ONLY on the SPLIT route; on MEDICAL_PRIMARY the dental plan is
          # inactive, so dental_allowed_cents stays 0 no matter what
          # dental_annual_remaining_snapshot_cents holds.
          dental_allowed_cents = 0
          if route == 'SPLIT':
              for line in lines:
                  residual = line.charge_cents
                           - round_half_up(line.charge_cents * MEDICAL_COINSURANCE)
                  want     = round_half_up(residual * DENTAL_COINSURANCE)
                  paid     = min(want, remaining_dental)
                  remaining_dental     -= paid
                  dental_allowed_cents += paid

      else:   # primary_payer == 'DENTAL'  (covers DENTAL_PRIMARY and dental-primary SPLIT)
          # dental pays first, per line, on the full line charge, capped in line order
          dental_paid_per_line = []
          for line in lines:
              want = round_half_up(line.charge_cents * DENTAL_COINSURANCE)
              paid = min(want, remaining_dental)
              remaining_dental      -= paid
              dental_allowed_cents  += paid
              dental_paid_per_line.append(paid)
          # medical then looks at each line's residual (only if a medical plan is active)
          if route == 'SPLIT':
              medical_allowed_cents = SUM over lines of
                  round_half_up((line.charge_cents - dental_paid_for_that_line)
                                * MEDICAL_COINSURANCE)
          else:
              medical_allowed_cents = 0

      total_charge_cents           = SUM of line.charge_cents
      patient_responsibility_cents = total_charge_cents
                                   - medical_allowed_cents
                                   - dental_allowed_cents

      # conserved invariant, true from creation onward in every status (validations
      # priority 90 forces the service lines to sum to the case total, so it holds
      # even for a DRAFT determination that has never been submitted):
      #   medical_allowed_cents + dental_allowed_cents + patient_responsibility_cents
      #     == SurgicalCase.total_charge_cents
    input_set: >-
      The determination's own service_lines array in client-supplied order, the route and
      primary_payer from benefit_route, and dental_annual_remaining_snapshot_cents (the Patient's
      dental_annual_remaining_cents copied at submit time - NOT the live patient field, which may
      already have been decremented by another APPROVED determination).
    constants:
      MEDICAL_COINSURANCE: 0.80
      DENTAL_COINSURANCE: 0.50
    precision: >-
      Every coinsurance product is rounded to whole cents with round_half_up PER SERVICE LINE
      before any summation. Summing the residuals first and rounding once at the end is wrong and
      can differ by one cent.
    variants:
      - name: medical_first_waterfall
        when: "primary_payer == 'MEDICAL'"
        difference: "Medical coinsurance is applied to the gross line charge and dental only sees the post-medical residual."
      - name: dental_first_waterfall
        when: "primary_payer == 'DENTAL'"
        difference: >-
          Dental coinsurance is applied to the gross line charge (and is therefore what consumes
          the annual maximum), and medical only sees the post-dental residual. For identical
          service lines the two variants produce different medical_allowed_cents,
          dental_allowed_cents and patient_responsibility_cents.

  - name: drill_compliance_ratio
    trigger: >-
      Recomputed on POST /emergency-drills, on POST /facility-inspections/{inspectionId}/result,
      on every read of GET /practices/{practiceId}/compliance-summary and during
      POST /_ops/run-compliance-sweep.
    algorithm: aggregation
    formula: |
      required = REQUIRED_DRILL_TYPES[AnesthesiaPermit.permit_level]

      qualifying = EmergencyDrill rows where
                     practice_id  == permit.practice_id
                 AND deficiency_noted == false
                 AND conducted_at >  current_utc - 365 days      # strictly inside the window
                 AND conducted_at <= current_utc
                 AND drill_type IN required

      covered = COUNT OF DISTINCT drill_type IN qualifying
      drill_compliance_ratio = round_half_up(covered / LENGTH(required), 2)
      drill_compliant = drill_compliance_ratio >= DRILL_COMPLIANCE_FLOOR
    input_set: >-
      Emergency drills for the practice whose conducted_at falls in the trailing 365-day window
      measured from the logical clock. A drill with deficiency_noted == true never counts, and a
      repeated drill of an already-covered type adds nothing (distinct types, not row count).
      Drill types outside the permit level's required set are ignored entirely.
    constants:
      DRILL_WINDOW_DAYS: 365
      DRILL_COMPLIANCE_FLOOR: 0.75
      REQUIRED_DRILL_TYPES:
        MINIMAL_SEDATION: [AIRWAY_OBSTRUCTION, LOCAL_ANESTHETIC_TOXICITY]
        MODERATE_SEDATION: [AIRWAY_OBSTRUCTION, LARYNGOSPASM, LOCAL_ANESTHETIC_TOXICITY, CARDIAC_ARREST]
        DEEP_SEDATION_GENERAL: [AIRWAY_OBSTRUCTION, LARYNGOSPASM, LOCAL_ANESTHETIC_TOXICITY, CARDIAC_ARREST, MALIGNANT_HYPERTHERMIA]
    precision: "2 decimal places, round_half_up; the floor comparison is >= so exactly 0.75 is compliant"

  - name: inspection_score
    trigger: "POST /facility-inspections/{inspectionId}/result"
    algorithm: threshold
    formula: |
      raw = 100
          - (MINOR_WEIGHT    * minor_deficiency_count)
          - (MAJOR_WEIGHT    * major_deficiency_count)
          - (CRITICAL_WEIGHT * critical_deficiency_count)
      inspection_score = max(0, raw)          # floored, never negative

      if critical_deficiency_count > 0:
          status = 'FAILED_CRITICAL'
      elif inspection_score >= PASSING_SCORE:
          status = 'PASSED'
      else:
          status = 'FAILED_CORRECTABLE'
    input_set: "The three deficiency counts submitted with the result call; the counts on the inspection row are overwritten by the submitted values before scoring."
    constants:
      MINOR_WEIGHT: 2
      MAJOR_WEIGHT: 7
      CRITICAL_WEIGHT: 25
      PASSING_SCORE: 70
    precision: "integer arithmetic; the >= comparison means a score of exactly 70 passes"

  - name: sedation_staffing_requirement
    trigger: "POST /surgical-cases/{caseId}/confirm, and re-evaluated by POST /_ops/run-compliance-sweep for cases still in CONFIRMED"
    algorithm: constraint_propagation
    formula: |
      level = SurgicalCase.planned_anesthesia_level
      req   = STAFFING_MATRIX[level]
      # req = { monitor_required, monitor_must_be_certified,
      #         surgeon_acls_required, dedicated_recovery_nurse_required,
      #         minimum_permit_rank }

      checks, in this order:
        1. if req.monitor_required and SurgicalCase.monitor_staff_id is null      -> unmet
        2. if req.monitor_required and monitor.role_type != 'ANESTHESIA_MONITOR'  -> unmet
        3. if req.monitor_must_be_certified
              and monitor.monitoring_certified == false                          -> unmet
        4. if req.surgeon_acls_required
              and primary_surgeon.acls_expires_on <= SurgicalCase.planned_start   -> unmet
        5. if req.dedicated_recovery_nurse_required and COUNT of the practice's
              StaffMember rows with role_type == 'RECOVERY_NURSE' == 0            -> unmet
        6. if PERMIT_RANK[open permit.permit_level] < req.minimum_permit_rank     -> insufficient

      Checks 1-5 raise ERR_STAFFING_RATIO_UNMET; check 6 raises
      ERR_PERMIT_LEVEL_INSUFFICIENT and is evaluated after them.
    input_set: >-
      The case's monitor and primary surgeon rows, the practice's recovery-nurse roster (all
      StaffMember rows for the practice, regardless of any other case), and the practice's single
      open AnesthesiaPermit (status IN {ACTIVE, PROBATION}).
    constants:
      PERMIT_RANK:
        MINIMAL_SEDATION: 1
        MODERATE_SEDATION: 2
        DEEP_SEDATION_GENERAL: 3
      STAFFING_MATRIX:
        LOCAL_ONLY:
          monitor_required: false
          monitor_must_be_certified: false
          surgeon_acls_required: false
          dedicated_recovery_nurse_required: false
          minimum_permit_rank: 0
        MINIMAL_SEDATION:
          monitor_required: true
          monitor_must_be_certified: false
          surgeon_acls_required: false
          dedicated_recovery_nurse_required: false
          minimum_permit_rank: 1
        MODERATE_SEDATION:
          monitor_required: true
          monitor_must_be_certified: true
          surgeon_acls_required: true
          dedicated_recovery_nurse_required: false
          minimum_permit_rank: 2
        DEEP_SEDATION_GENERAL:
          monitor_required: true
          monitor_must_be_certified: true
          surgeon_acls_required: true
          dedicated_recovery_nurse_required: true
          minimum_permit_rank: 3
    precision: "not applicable (boolean matrix)"

  - name: recovery_capacity_projection
    trigger: "POST /surgical-cases/{caseId}/confirm"
    algorithm: interval_merge
    formula: |
      recovery_minutes_required = RECOVERY_MINUTES[planned_anesthesia_level]

      # a case occupies a recovery bay over the HALF-OPEN interval
      #   [planned_end, planned_end + recovery_minutes_required)
      candidate = [this_case.planned_end,
                   this_case.planned_end + recovery_minutes_required minutes)

      occupying = SurgicalCase rows where
                    practice_id == this_case.practice_id
                AND id          != this_case.id
                AND scheduling_status IN {CONFIRMED, IN_RECOVERY}
                AND recovery_minutes_required > 0
                AND [planned_end, planned_end + recovery_minutes_required)
                      overlaps candidate            # touching endpoints do NOT overlap

      # peak concurrency is evaluated at every interval start inside the candidate window,
      # in chronological order of planned_end (created_at breaks exact ties)
      peak = max over t IN {candidate.start} UNION {o.start for o in occupying
                                                    if o.start IN candidate}
                 of 1 + COUNT of occupying whose interval contains t

      if recovery_minutes_required > 0 and peak > Practice.recovery_bay_count:
          -> ERR_RECOVERY_CAPACITY_EXCEEDED
    input_set: >-
      Every other case in the same practice already in CONFIRMED or IN_RECOVERY whose recovery
      interval overlaps the candidate's. Cases in DRAFT, BLOCK_HELD, COMPLETED or CANCELLED are
      excluded, and LOCAL_ONLY cases (recovery_minutes_required == 0) never consume a bay.
    constants:
      RECOVERY_MINUTES:
        LOCAL_ONLY: 0
        MINIMAL_SEDATION: 20
        MODERATE_SEDATION: 45
        DEEP_SEDATION_GENERAL: 90
    precision: "whole minutes; intervals are half-open [start, end) so a recovery ending exactly when another begins is not an overlap"

  - name: consignment_liability
    trigger: "POST /implant-reservations, POST /surgical-cases/{caseId}/implant-reservations/auto-size, POST /implant-reservations/{reservationId}/consume, POST /implant-reservations/{reservationId}/release"
    algorithm: tiered_pricing
    formula: |
      line_subtotal_cents = ImplantLot.unit_cost_cents * reservation.quantity   # pinned at HELD

      # the restocking tier is keyed on line_subtotal_cents - NOT on the liability
      restocking_pct = 0.15 if line_subtotal_cents <= TIER_1_CEILING_CENTS
                       0.10 if line_subtotal_cents <= TIER_2_CEILING_CENTS
                       0.05 otherwise
      restocking_fee_cents = round_half_up(line_subtotal_cents * restocking_pct)

      consignment_credit_cents = round_half_up(line_subtotal_cents * CONSIGNMENT_CREDIT_RATE)
                                 if ImplantLot.is_consignment else 0

      status-dependent liability:
        HELD      : consignment_liability_cents = line_subtotal_cents - consignment_credit_cents
        CONSUMED  : consignment_liability_cents = line_subtotal_cents - consignment_credit_cents
        RELEASED  : consignment_liability_cents = restocking_fee_cents
                    (and consignment_credit_cents is reset to 0)
        SHORTED   : consignment_liability_cents = line_subtotal_cents
                    (restocking_fee_cents and consignment_credit_cents are both 0)

      # practice-level rolling exposure, checked against the credit limit at HELD time
      Practice.consignment_committed_cents =
          SUM of consignment_liability_cents over the practice's reservations
          whose status IN {HELD, CONSUMED}
      if that sum would exceed Practice.consignment_credit_limit_cents
          -> ERR_CONSIGNMENT_CREDIT_LIMIT_EXCEEDED
    input_set: >-
      The reservation's own quantity and its lot's unit_cost_cents and is_consignment flag, both
      pinned at HELD time (a later change to the lot never re-prices an existing reservation),
      plus the practice's HELD and CONSUMED reservations for the rolling exposure. RELEASED and
      SHORTED reservations drop out of consignment_committed_cents.
    constants:
      TIER_1_CEILING_CENTS: 50000
      TIER_2_CEILING_CENTS: 150000
      TIER_1_RATE: 0.15
      TIER_2_RATE: 0.10
      TIER_3_RATE: 0.05
      CONSIGNMENT_CREDIT_RATE: 0.20
    precision: "whole cents, round_half_up; the tier is selected once from the whole subtotal (average rate, not marginal - there is no per-tier split)"

  - name: implant_auto_size_selection
    trigger: "POST /surgical-cases/{caseId}/implant-reservations/auto-size"
    algorithm: threshold
    formula: |
      candidates = ImplantLot rows where
                     practice_id == SurgicalCase.practice_id
                 AND status            == 'AVAILABLE'
                 AND expiry_date       >  SurgicalCase.planned_start
                 AND available_quantity >= requested quantity
                 AND abs(diameter_mm - requested_diameter_mm) <= DIAMETER_TOLERANCE_MM
                 AND abs(length_mm   - requested_length_mm)   <= LENGTH_TOLERANCE_MM

      if candidates is empty:
          -> ERR_NO_ELIGIBLE_IMPLANT_LOT

      selected = FIRST row of candidates ordered by
                   diameter_mm ASC, length_mm ASC, expiry_date ASC, created_at ASC
    input_set: >-
      Every ImplantLot of the case's practice. QUARANTINED and EXPENDED lots, lots expiring on or
      before the case's planned_start, and lots whose available_quantity (on hand minus reserved)
      is short of the request are all excluded before the ordering runs. The tolerance is measured
      against the requested dimensions, never against the case's other reservations.
    constants:
      DIAMETER_TOLERANCE_MM: 0.5
      LENGTH_TOLERANCE_MM: 2.0
    precision: >-
      Dimensions are compared to one decimal place and both tolerance comparisons are inclusive
      (<=), so a lot exactly 0.5 mm off the requested diameter is eligible while one 0.6 mm off is
      not. The four-key ordering is total, so the selection is deterministic.

  - name: imaging_retention_until
    trigger: "POST /imaging-studies"
    algorithm: threshold
    formula: |
      age_at_acquisition = whole years from Patient.date_of_birth to acquired_at

      acquisition_floor = acquired_at + RETENTION_YEARS years

      if age_at_acquisition >= ADULT_AGE_YEARS:
          retention_until = acquisition_floor
      else:
          majority_floor  = (Patient.date_of_birth + ADULT_AGE_YEARS years)
                            + RETENTION_YEARS years
          retention_until = max(acquisition_floor, majority_floor)

      dose_flag = 'ABOVE_REFERENCE_LEVEL'
                  if dose_mgy_cm2 > DOSE_REFERENCE_LEVEL[modality]
                  else 'WITHIN_PROTOCOL'
    input_set: "The study's acquired_at and dose_mgy_cm2, its modality, and the patient's date_of_birth. The logical clock is irrelevant - retention is anchored to acquisition, not to the moment of upload."
    constants:
      RETENTION_YEARS: 7
      ADULT_AGE_YEARS: 18
      DOSE_REFERENCE_LEVEL:
        PANORAMIC: 100.0
        CEPHALOMETRIC: 60.0
        CBCT_SMALL_FOV: 250.0
        CBCT_LARGE_FOV: 900.0
    precision: >-
      Whole years added by calendar arithmetic (same month and day, clamped to the last day of the
      month for 29 February); the comparison in dose_flag is strictly greater-than, so a dose
      exactly at the reference level is WITHIN_PROTOCOL.

  - name: block_utilization
    trigger: "POST /surgical-cases/{caseId}/hold-block, /confirm, /cancel, POST /block-times/{blockId}/release and POST /_ops/run-compliance-sweep"
    algorithm: aggregation
    formula: |
      block_duration_minutes = whole minutes from block_start to block_end

      committed_minutes = SUM of duration_minutes over the block's SurgicalCase rows
                          whose scheduling_status IN {BLOCK_HELD, CONFIRMED,
                                                      IN_RECOVERY, COMPLETED}
      # released_minutes is a stored counter, only ever increased by a release action
      open_minutes      = block_duration_minutes - committed_minutes - released_minutes

      utilization_pct = round_half_up(
                          100 * committed_minutes / block_duration_minutes, 2)

      # conserved invariant on every write:
      #   committed_minutes + released_minutes + open_minutes == block_duration_minutes
      # and a hold is refused when duration_minutes > open_minutes

      sweep release condition:
        current_utc >= block_start - release_deadline_hours hours
        AND utilization_pct < SWEEP_RELEASE_UTILIZATION_PCT
        -> the still-open minutes are moved into released_minutes
    input_set: >-
      Cases attached to the block via block_id whose scheduling_status is one of the four
      committing states. DRAFT and CANCELLED cases contribute nothing, so cancelling a case
      returns its minutes to open_minutes rather than to released_minutes.
    constants:
      SWEEP_RELEASE_UTILIZATION_PCT: 60.00
    precision: "utilization to 2 decimal places, round_half_up; minute counters are integers and the release comparison is strictly less-than"

# ============================================================================
# 1.4 Validation Rules (evaluated strictly in ascending priority order;
#     the first violated rule decides the response)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the seven declared roles; X-User-ID present whenever the acting role is entity_backed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.7 role list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id resolves to a live row, validated left to right (e.g. /surgical-cases/{caseId}/pre-anesthesia-evaluations resolves caseId before reading the body)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "required body fields present, JSON well formed, no unknown fields; service_lines non-empty and at most 8 entries"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: existence
    check: >-
      each supplied field satisfies its declared type, enum and range constraints
      (asa_class 1..4, airway_class 1..4, recovery_bay_count 1..12, state_code two uppercase
      letters, block_end > block_start, planned_end > planned_start, quantity >= 1,
      charge_cents >= 0, participant_staff_ids length >= 2)
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 6
    category: business_referential
    check: "every foreign key in the body resolves to a live row (practice_id, patient_id, primary_surgeon_id, monitor_staff_id, block_id, prerequisite_case_id, lot_id, case_id, reviewer_staff_id, evaluator_staff_id, participant_staff_ids members)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying a foreign key"
  - priority: 7
    category: business_referential
    check: >-
      every referenced row belongs to the same practice as the operation's anchor row - the
      patient, surgeon, monitor and block of a case; the lot of a reservation; the drill
      participants; the reviewer of an adverse event; the case of an imaging study and its patient
    error_id: ERR_PRACTICE_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /surgical-cases, POST /implant-reservations, POST /emergency-drills, POST /imaging-studies, POST /adverse-events, POST /adverse-events/{eventId}/morbidity-review, POST /surgical-cases/{caseId}/pre-anesthesia-evaluations, POST /block-times"
  - priority: 8
    category: auth
    check: "for entity_backed roles the X-User-ID must be the staff member the operation is bound to (the case's primary_surgeon_id for surgeon actions, the evaluation's evaluator_staff_id for signing, the event's reviewer_staff_id for sign-off)"
    error_id: ERR_ACTOR_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /pre-anesthesia-evaluations/{evaluationId}/sign, POST /adverse-events/{eventId}/morbidity-review, POST /surgical-cases/{caseId}/start-recovery, POST /surgical-cases/{caseId}/complete"
  - priority: 9
    category: auth
    check: >-
      the same StaffMember may not both perform and review a case: the morbidity reviewer must not
      be the case's primary_surgeon_id, and the day-of verifier must not be the evaluation's
      evaluator_staff_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /adverse-events/{eventId}/morbidity-review, POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
  - priority: 10
    category: business_constraint
    check: "a practice may hold at most one permit whose status is not in {EXPIRED, REVOKED}"
    error_id: ERR_PERMIT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /anesthesia-permits"
  - priority: 20
    category: state
    check: "expected_block_version equals BlockTime.version"
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 21
    category: state
    check: "expected_lot_version equals ImplantLot.version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /implant-reservations"
  - priority: 22
    category: state
    check: "expected_case_version equals SurgicalCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations"
  - priority: 30
    category: business_temporal
    check: "the requested logical clock value is greater than or equal to the current logical clock"
    error_id: ERR_CLOCK_MONOTONIC_VIOLATION
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"
  - priority: 40
    category: state
    check: "the anchor row's state_field permits the requested transition (see §1.2); includes repeat calls of a one-shot action"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 41
    category: state
    check: "the case's clearance_status is CLEARED at confirmation time"
    error_id: ERR_CASE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 42
    category: state
    check: "the parent lot is not QUARANTINED when a reservation is created or consumed"
    error_id: ERR_LOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /implant-reservations, POST /surgical-cases/{caseId}/implant-reservations/auto-size, POST /implant-reservations/{reservationId}/consume"
  - priority: 43
    category: state
    check: "a benefit determination may only be submitted when the case has a VERIFIED pre-anesthesia evaluation"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /benefit-determinations/{determinationId}/submit"
  - priority: 50
    category: business_safety
    check: "the practice's sedation_privilege_state permits the case's planned_anesthesia_level: SUSPENDED or UNPERMITTED blocks every level above LOCAL_ONLY, RESTRICTED blocks DEEP_SEDATION_GENERAL"
    error_id: ERR_SEDATION_PRIVILEGE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/hold-block, POST /surgical-cases/{caseId}/confirm"
  - priority: 55
    category: business_safety
    check: "PERMIT_RANK[open permit.permit_level] >= the rank the case's planned_anesthesia_level requires (calculations.sedation_staffing_requirement check 6)"
    error_id: ERR_PERMIT_LEVEL_INSUFFICIENT
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 58
    category: business_temporal
    check: "a permit on PROBATION may only be remediated while the logical clock is at or before remediation_deadline_at"
    error_id: ERR_REMEDIATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /anesthesia-permits/{permitId}/remediation"
  - priority: 59
    category: business_safety
    check: "drill_compliance_ratio >= 0.75 for the practice's open permit before a sedated case may be confirmed or a permit remediated"
    error_id: ERR_DRILL_COMPLIANCE_LAPSED
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm, POST /anesthesia-permits/{permitId}/remediation"
  - priority: 60
    category: business_safety
    check: "checks 1-5 of calculations.sedation_staffing_requirement are all satisfied"
    error_id: ERR_STAFFING_RATIO_UNMET
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 62
    category: business_safety
    check: "npo_solids_minutes >= 480 and npo_clears_minutes >= 120 at a day-of verification submitted with intent == CLEAR for any level above LOCAL_ONLY"
    error_id: ERR_FASTING_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
  - priority: 64
    category: business_safety
    check: "escort_confirmed is true (with a non-empty escort_name) at a day-of verification submitted with intent == CLEAR for any level above LOCAL_ONLY"
    error_id: ERR_ESCORT_REQUIRED
    http_status: 409
    applies_to: "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
  - priority: 66
    category: business_safety
    check: >-
      the final risk_band is not PROHIBITIVE when intent == CLEAR; a PROHIBITIVE band is only
      recordable through intent == DEFER, which parks the case at clearance_status DEFERRED
    error_id: ERR_RISK_BAND_PROHIBITIVE
    http_status: 409
    applies_to: "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
  - priority: 68
    category: business_safety
    check: >-
      the cone-beam field of view matches its justification_code: a CBCT_LARGE_FOV study accepts
      only justification_code IN {ORTHOGNATHIC_PLANNING, PATHOLOGY_STAGING, TRAUMA_SURVEY}, and a
      CBCT_SMALL_FOV study accepts only justification_code IN {IMPLANT_PLANNING,
      THIRD_MOLAR_ASSESSMENT, PATHOLOGY_STAGING, TRAUMA_SURVEY}. PANORAMIC and CEPHALOMETRIC
      studies accept any of the five codes.
    error_id: ERR_CBCT_JUSTIFICATION_INVALID
    http_status: 422
    applies_to: "POST /imaging-studies"
  - priority: 70
    category: business_constraint
    check: "if prerequisite_case_id is set, that case's scheduling_status is COMPLETED before this case may be confirmed"
    error_id: ERR_PREREQUISITE_CASE_INCOMPLETE
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 71
    category: business_constraint
    check: "prerequisite_case_id must not close a cycle in the prerequisite chain (a case may never be its own transitive prerequisite); the chain is walked from the proposed predecessor before the write"
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 409
    applies_to: "POST /surgical-cases, POST /surgical-cases/{caseId}/prerequisite"
  - priority: 72
    category: business_constraint
    check: "a THIRD_MOLAR or ORTHOGNATHIC case carrying a referring_provider_npi must reach referral_coordination_status ACKNOWLEDGED before confirmation"
    error_id: ERR_REFERRAL_ACKNOWLEDGEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 73
    category: business_constraint
    check: "an adverse event with severity SEVERE or SENTINEL must have regulator_notified == true before it may be closed"
    error_id: ERR_REGULATOR_NOTIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /adverse-events/{eventId}/close"
  - priority: 74
    category: business_temporal
    check: "the case's [planned_start, planned_end) window lies inside the block's [block_start, block_end) window"
    error_id: ERR_CASE_OUTSIDE_BLOCK_WINDOW
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/hold-block"
  - priority: 75
    category: business_referential
    check: "the case's primary_surgeon_id equals the block's surgeon_id"
    error_id: ERR_BLOCK_SURGEON_MISMATCH
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/hold-block"
  - priority: 76
    category: business_temporal
    check: >-
      no other BLOCK_HELD, CONFIRMED, IN_RECOVERY or COMPLETED case in the same room_code overlaps
      this case's [planned_start, planned_end + Practice.turnover_buffer_minutes) window; the
      buffer is appended to the incumbent AND to the candidate, so a gap shorter than the buffer
      is a conflict while a gap exactly equal to it is not
    error_id: ERR_ROOM_TURNOVER_CONFLICT
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/hold-block"
  - priority: 77
    category: business_temporal
    check: >-
      the monitor_staff_id is not already assigned to another BLOCK_HELD, CONFIRMED or IN_RECOVERY
      case whose [planned_start, planned_end) half-open window overlaps this one; no turnover
      buffer applies to people, so back-to-back monitoring is legal
    error_id: ERR_MONITOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 78
    category: business_constraint
    check: "calculations.recovery_capacity_projection peak concurrency does not exceed Practice.recovery_bay_count"
    error_id: ERR_RECOVERY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/confirm"
  - priority: 79
    category: business_constraint
    check: "the case's duration_minutes does not exceed the block's open_minutes"
    error_id: ERR_BLOCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/hold-block"
  - priority: 80
    category: business_constraint
    check: "ImplantLot.available_quantity >= requested quantity, and the lot's expiry_date is after the case's planned_start"
    error_id: ERR_IMPLANT_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /implant-reservations"
  - priority: 82
    category: business_constraint
    check: "calculations.implant_auto_size_selection found at least one AVAILABLE lot in the practice inside the +/- 0.5 mm diameter and +/- 2.0 mm length tolerance whose expiry_date is after the case planned_start and whose available_quantity covers the request"
    error_id: ERR_NO_ELIGIBLE_IMPLANT_LOT
    http_status: 409
    applies_to: "POST /surgical-cases/{caseId}/implant-reservations/auto-size"
  - priority: 90
    category: business_fiscal
    check: "sum(service_lines[].charge_cents) equals SurgicalCase.total_charge_cents"
    error_id: ERR_CHARGE_TOTAL_MISMATCH
    http_status: 422
    applies_to: "POST /benefit-determinations, POST /benefit-determinations/{determinationId}/submit"
  - priority: 92
    category: business_fiscal
    check: "Practice.consignment_committed_cents plus this reservation's liability does not exceed Practice.consignment_credit_limit_cents"
    error_id: ERR_CONSIGNMENT_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /implant-reservations, POST /surgical-cases/{caseId}/implant-reservations/auto-size"

# ============================================================================
# 1.5 API Endpoints
#   `ALL_ROLES` is spelled out on every read endpoint:
#   PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist,
#   InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer
# ============================================================================
endpoints:

  # ---- Practice ------------------------------------------------------------
  - method: POST
    path: "/practices"
    description: "Register an oral & maxillofacial surgery practice. sedation_privilege_state starts UNPERMITTED because no permit exists yet."
    roles: [PracticeAdministrator]
    code: 201
    input: [name, state_code, recovery_bay_count, "turnover_buffer_minutes?", "consignment_credit_limit_cents?"]
    output: Practice
    side_effects:
      - "sedation_privilege_state := UNPERMITTED; open_adverse_event_count := 0; consignment_committed_cents := 0"
  - method: GET
    path: "/practices/{practiceId}"
    description: "Read one practice, including its derived privilege state and rolling consignment exposure."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: Practice
    side_effects: []
  - method: GET
    path: "/practices/{practiceId}/compliance-summary"
    description: "Computed read: current privilege state, the open permit's drill compliance ratio, the required and covered drill types, and the open adverse-event count."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output:
      practice_id: string
      sedation_privilege_state: string
      open_permit_id: string
      permit_status: string
      permit_level: string
      required_drill_types: string[]
      covered_drill_types: string[]
      drill_compliance_ratio: number
      drill_compliant: boolean
      open_adverse_event_count: integer
      consignment_committed_cents: integer
      consignment_credit_limit_cents: integer
    side_effects:
      - "recomputes calculations.drill_compliance_ratio against the current logical clock (read-only, no persisted change)"

  # ---- AnesthesiaPermit ----------------------------------------------------
  - method: POST
    path: "/anesthesia-permits"
    description: "Apply for an office anesthesia permit at a given level. Refused when the practice already has a permit outside {EXPIRED, REVOKED}."
    roles: [PracticeAdministrator]
    code: 201
    input: [practice_id, permit_level, applied_on]
    output: AnesthesiaPermit
    side_effects:
      - "status := APPLIED; required_drill_types := REQUIRED_DRILL_TYPES[permit_level]"
      - "drill_compliance_ratio computed from the practice's existing drills"
  - method: GET
    path: "/anesthesia-permits/{permitId}"
    description: "Read one permit with its status, expiry, probation count and last enforcement reason."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: AnesthesiaPermit
    side_effects: []
  - method: GET
    path: "/anesthesia-permits"
    description: "List permits, optionally filtered by practice."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["practice_id?", "status?"]
    output: AnesthesiaPermit[]
    side_effects: []
  - method: POST
    path: "/anesthesia-permits/{permitId}/remediation"
    description: "Close out a probation by attesting that the deficiencies were corrected. Requires the remediation window to still be open and drill compliance to be restored."
    roles: [PracticeAdministrator]
    code: 200
    input: [attestation_note]
    output: AnesthesiaPermit
    side_effects:
      - "status PROBATION -> ACTIVE; remediation_deadline_at := null; last_enforcement_reason := null (probation_count is the permanent history and is never decremented)"
      - "Practice.sedation_privilege_state RESTRICTED -> PERMITTED (cascade re-opens DEEP_SEDATION_GENERAL scheduling)"
      - "increments Practice.version by 1"

  # ---- FacilityInspection --------------------------------------------------
  - method: POST
    path: "/facility-inspections"
    description: "Schedule a facility inspection against a permit. Moves the permit from APPLIED to INSPECTION_PENDING."
    roles: [PracticeAdministrator]
    code: 201
    input: [permit_id, scheduled_for]
    output: FacilityInspection
    side_effects:
      - "status := SCHEDULED"
      - "permit.status APPLIED -> INSPECTION_PENDING (no change when the permit is already ACTIVE or on PROBATION - a re-inspection does not reopen the permit)"
  - method: GET
    path: "/facility-inspections/{inspectionId}"
    description: "Read one inspection with its deficiency counts and computed score."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: FacilityInspection
    side_effects: []
  - method: GET
    path: "/facility-inspections"
    description: "List inspections, optionally filtered by permit and outcome, oldest first by created_at."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["permit_id?", "status?"]
    output: FacilityInspection[]
    side_effects: []
  - method: POST
    path: "/facility-inspections/{inspectionId}/result"
    description: "Record the inspector's deficiency counts. Scores the inspection and drives the permit's status branch (PASSED -> ACTIVE, FAILED_CORRECTABLE -> PROBATION, FAILED_CRITICAL -> SUSPENDED)."
    roles: [PracticeAdministrator]
    code: 200
    input: [minor_deficiency_count, major_deficiency_count, critical_deficiency_count]
    output: FacilityInspection
    side_effects:
      - "inspection_score and status computed by calculations.inspection_score; outcome_recorded_at := current logical clock"
      - "permit.status advanced per §1.2; issued_at/expires_at stamped on the PASSED branch; remediation_deadline_at stamped on the PROBATION branch"
      - "Practice.sedation_privilege_state recomputed; on the FAILED_CRITICAL branch the full 5-hop suspension cascade runs over cases, evaluations and implant reservations"
      - "increments Practice.version by 1"

  # ---- EmergencyDrill (immutable) -----------------------------------------
  - method: POST
    path: "/emergency-drills"
    description: "Log an emergency drill with its participants. Immutable once written - a mistake is corrected by logging a new drill, never by editing this one."
    roles: [PracticeAdministrator, AnesthesiaCoordinator]
    code: 201
    input: [practice_id, drill_type, conducted_at, participant_staff_ids, "deficiency_noted?"]
    output: EmergencyDrill
    side_effects:
      - "the open permit's drill_compliance_ratio is recomputed by calculations.drill_compliance_ratio"
      - "increments AnesthesiaPermit.version by 1"
  - method: GET
    path: "/emergency-drills/{drillId}"
    description: "Read one drill record. There is no update or delete - the entity is immutable and carries no version field."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: EmergencyDrill
    side_effects: []
  - method: GET
    path: "/emergency-drills"
    description: "List drills, optionally filtered by practice, type and deficiency flag; oldest first by conducted_at then created_at."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["practice_id?", "drill_type?", "deficiency_noted?"]
    output: EmergencyDrill[]
    side_effects: []

  # ---- StaffMember ---------------------------------------------------------
  - method: POST
    path: "/staff-members"
    description: "Add a staff member. Surgeon, AnesthesiaCoordinator and QualityReviewer identities are these rows (X-User-ID)."
    roles: [PracticeAdministrator]
    code: 201
    input: [practice_id, full_name, role_type, "monitoring_certified?", "acls_expires_on?"]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/staff-members/{staffId}"
    description: "Read one staff member."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/staff-members"
    description: "List staff, optionally filtered by practice and role type."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["practice_id?", "role_type?"]
    output: StaffMember[]
    side_effects: []

  # ---- Patient -------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient with intake ASA/airway class, weight, plan coverage flags and remaining dental annual maximum."
    roles: [PracticeAdministrator, SchedulingCoordinator]
    code: 201
    input: [practice_id, full_name, date_of_birth, asa_class, airway_class, weight_kg, "medical_plan_active?", "dental_plan_active?", "dental_annual_remaining_cents?"]
    output: Patient
    side_effects:
      - "age_years computed from date_of_birth against the current logical clock"
  - method: GET
    path: "/patients/{patientId}"
    description: "Read one patient."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "List patients, optionally filtered by practice."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["practice_id?"]
    output: Patient[]
    side_effects: []

  # ---- BlockTime -----------------------------------------------------------
  - method: POST
    path: "/block-times"
    description: "Reserve operating-room block time for one surgeon. block_duration_minutes, open_minutes and utilization_pct are derived at creation."
    roles: [SchedulingCoordinator, PracticeAdministrator]
    code: 201
    input: [practice_id, surgeon_id, room_code, block_start, block_end, "release_deadline_hours?"]
    output: BlockTime
    side_effects:
      - "status := RESERVED; block_duration_minutes := minutes(block_end - block_start)"
      - "committed_minutes := 0; released_minutes := 0; open_minutes := block_duration_minutes; utilization_pct := 0.00"
  - method: GET
    path: "/block-times/{blockId}"
    description: "Read one block with its live minute ledger and utilization."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: BlockTime
    side_effects: []
  - method: GET
    path: "/block-times"
    description: "List blocks, optionally filtered by practice, surgeon and status."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["practice_id?", "surgeon_id?", "status?"]
    output: BlockTime[]
    side_effects: []
  - method: POST
    path: "/block-times/{blockId}/release"
    description: "Give back the block's still-open minutes. Fully releases the block when nothing is committed, otherwise marks it PARTIALLY_RELEASED."
    roles: [SchedulingCoordinator]
    code: 200
    input: ["release_note?"]
    output: BlockTime
    side_effects:
      - "released_minutes += open_minutes; open_minutes := 0; status := RELEASED when committed_minutes == 0 else PARTIALLY_RELEASED"
      - "utilization_pct recomputed by calculations.block_utilization; the minute conservation identity is preserved"

  # ---- SurgicalCase --------------------------------------------------------
  - method: POST
    path: "/surgical-cases"
    description: "Draft a surgical case. Starts in scheduling_status DRAFT and clearance_status NOT_EVALUATED; referral_coordination_status is PENDING for a THIRD_MOLAR or ORTHOGNATHIC case carrying a referring provider, otherwise NOT_REQUIRED."
    roles: [SchedulingCoordinator]
    code: 201
    input: [practice_id, patient_id, primary_surgeon_id, planned_anesthesia_level, procedure_category, planned_start, planned_end, total_charge_cents, "monitor_staff_id?", "block_id?", "prerequisite_case_id?", "referring_provider_npi?"]
    output: SurgicalCase
    side_effects:
      - "duration_minutes := minutes(planned_end - planned_start); recovery_minutes_required := RECOVERY_MINUTES[planned_anesthesia_level]"
      - "scheduling_status := DRAFT; clearance_status := NOT_EVALUATED"
      - "referral_coordination_status := PENDING or NOT_REQUIRED per the rule above"
      - "prerequisite_case_id is checked for cycles before insert"
  - method: GET
    path: "/surgical-cases/{caseId}"
    description: "Read one case with both of its independent status dimensions plus referral and recovery fields."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: []
  - method: GET
    path: "/surgical-cases"
    description: "List cases with any combination of foreign-key and status filters. This is the reverse-reachability channel for all six of SurgicalCase's foreign keys, including the self-referential prerequisite link."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["practice_id?", "patient_id?", "primary_surgeon_id?", "monitor_staff_id?", "block_id?", "prerequisite_case_id?", "scheduling_status?", "clearance_status?"]
    output: SurgicalCase[]
    side_effects: []
  - method: POST
    path: "/surgical-cases/{caseId}/hold-block"
    description: "Attach the case to a block and hold minutes against it. Enforces the block window, the surgeon match, room turnover with buffer, and block capacity."
    roles: [SchedulingCoordinator]
    code: 200
    input: [block_id]
    output: SurgicalCase
    side_effects:
      - "scheduling_status DRAFT -> BLOCK_HELD; block_id persisted"
      - "BlockTime.committed_minutes += duration_minutes; open_minutes and utilization_pct recomputed"
      - "increments BlockTime.version by 1"
  - method: POST
    path: "/surgical-cases/{caseId}/confirm"
    description: "Commit the case for surgery. The heaviest gate in the system: privilege, permit rank, drill compliance, staffing ratios, clearance, prerequisites, referral acknowledgement, monitor availability and recovery-bay capacity are all checked, in that priority order."
    roles: [SchedulingCoordinator]
    code: 200
    input: [expected_block_version]
    output: SurgicalCase
    side_effects:
      - "scheduling_status BLOCK_HELD -> CONFIRMED"
      - "calculations.sedation_staffing_requirement and calculations.recovery_capacity_projection are evaluated"
      - "BlockTime.utilization_pct recomputed (the minutes were already committed at hold time); increments BlockTime.version by 1"
  - method: POST
    path: "/surgical-cases/{caseId}/cancel"
    description: "Cancel a case from DRAFT, BLOCK_HELD or CONFIRMED. Returns block minutes to open and releases every HELD implant reservation."
    roles: [SchedulingCoordinator]
    code: 200
    input: [cancellation_reason]
    output: SurgicalCase
    side_effects:
      - "scheduling_status -> CANCELLED; cancellation_reason persisted"
      - "BlockTime.committed_minutes -= duration_minutes; open_minutes and utilization_pct recomputed; increments BlockTime.version by 1"
      - "every HELD ImplantReservation for the case -> RELEASED with its restocking fee; each lot's quantity_reserved is returned and Practice.consignment_committed_cents is recomputed"
      - "any DRAFT or SIGNED PreAnesthesiaEvaluation for the case -> VOIDED"
  - method: POST
    path: "/surgical-cases/{caseId}/start-recovery"
    description: "Move a confirmed case into recovery, stamping the recovery clock. Only the case's own primary surgeon may do this, and only once the logical clock has reached planned_start."
    roles: [Surgeon]
    code: 200
    input: []
    output: SurgicalCase
    side_effects:
      - "scheduling_status CONFIRMED -> IN_RECOVERY; recovery_started_at := current logical clock"
  - method: POST
    path: "/surgical-cases/{caseId}/complete"
    description: "Close out the case. Only the case's own primary surgeon may complete it."
    roles: [Surgeon]
    code: 200
    input: []
    output: SurgicalCase
    side_effects:
      - "scheduling_status IN_RECOVERY -> COMPLETED"
      - "the case's recovery bay is freed for capacity projection; any case blocked on it as a prerequisite becomes confirmable"
  - method: POST
    path: "/surgical-cases/{caseId}/referral-coordination"
    description: "Record the referring dentist's or orthodontist's acknowledgement of the coordinated plan."
    roles: [SchedulingCoordinator]
    code: 200
    input: [acknowledged_by_npi]
    output: SurgicalCase
    side_effects:
      - "referral_coordination_status PENDING -> ACKNOWLEDGED (rejected with ERR_INVALID_STATE_TRANSITION when the status is NOT_REQUIRED)"
  - method: POST
    path: "/surgical-cases/{caseId}/prerequisite"
    description: "Attach or re-point the staged-treatment predecessor of a case that has not been confirmed yet. The chain is walked before the write so a case can never become its own transitive prerequisite."
    roles: [SchedulingCoordinator]
    code: 200
    input: [prerequisite_case_id]
    output: SurgicalCase
    side_effects:
      - "prerequisite_case_id := the supplied case, which must belong to the same practice and must not close a cycle per validations[priority=71]"
      - "allowed only while scheduling_status IN {DRAFT, BLOCK_HELD}; increments SurgicalCase.version by 1"

  # ---- PreAnesthesiaEvaluation --------------------------------------------
  - method: POST
    path: "/surgical-cases/{caseId}/pre-anesthesia-evaluations"
    description: "Create a pre-anesthesia evaluation for the case. Supersedes any prior SIGNED or VERIFIED evaluation and resets the case's clearance_status, so the caller must present the case's current version."
    roles: [AnesthesiaCoordinator]
    code: 201
    input: [evaluator_staff_id, asa_class_recorded, airway_class_recorded, expected_case_version, "comorbidity_count?", "fasting_solids_last_at?", "fasting_clears_last_at?", "escort_confirmed?", "escort_name?"]
    output: PreAnesthesiaEvaluation
    side_effects:
      - "status := DRAFT; provisional_risk_score and risk_band computed by the provisional_preop variant"
      - "any prior evaluation for the case in status SIGNED or VERIFIED -> SUPERSEDED"
      - "SurgicalCase.clearance_status -> NOT_EVALUATED; increments SurgicalCase.version by 1"
  - method: GET
    path: "/pre-anesthesia-evaluations/{evaluationId}"
    description: "Read one evaluation with both risk scores, the band, and the derived NPO intervals."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: PreAnesthesiaEvaluation
    side_effects: []
  - method: GET
    path: "/pre-anesthesia-evaluations"
    description: "List evaluations, optionally filtered by case, evaluator and status."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["case_id?", "evaluator_staff_id?", "status?"]
    output: PreAnesthesiaEvaluation[]
    side_effects: []
  - method: POST
    path: "/pre-anesthesia-evaluations/{evaluationId}/sign"
    description: "The evaluator signs the evaluation, rescoring the provisional variant against the case's current anesthesia level and moving the case to EVALUATED."
    roles: [AnesthesiaCoordinator]
    code: 200
    input: []
    output: PreAnesthesiaEvaluation
    side_effects:
      - "status DRAFT -> SIGNED; signed_at := current logical clock"
      - "provisional_risk_score and risk_band recomputed by the provisional_preop variant"
      - "SurgicalCase.clearance_status NOT_EVALUATED -> EVALUATED; increments SurgicalCase.version by 1"
  - method: POST
    path: "/pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
    description: "Day-of-surgery verification: records the actual fasting times and escort, then rescores with the final_day_of variant. `intent` is CLEAR (run every clinical gate and clear the case) or DEFER (publish the final score and park the case at clearance_status DEFERRED without running the gates). A second staff member must do this - the verifier may not be the evaluation's author, and may not be the case's operating surgeon."
    roles: [AnesthesiaCoordinator]
    code: 200
    input: [intent, fasting_solids_last_at, fasting_clears_last_at, escort_confirmed, "escort_name?"]
    output: PreAnesthesiaEvaluation
    side_effects:
      - "npo_solids_minutes and npo_clears_minutes computed against the case's planned_start"
      - "final_risk_score and risk_band recomputed by the final_day_of variant BEFORE the fasting, escort and band gates are evaluated; the gates only run when intent == CLEAR"
      - "status SIGNED -> VERIFIED; verified_at := current logical clock"
      - "SurgicalCase.clearance_status EVALUATED -> CLEARED on intent CLEAR, or -> DEFERRED on intent DEFER (which publishes the final score and skips every clinical gate); increments SurgicalCase.version by 1"

  # ---- BenefitDetermination -----------------------------------------------
  - method: POST
    path: "/benefit-determinations"
    description: "Open a medical-versus-dental benefit determination for a case. Routes the claim and prices the allocation immediately so the operator can see the split before submitting."
    roles: [BenefitsSpecialist]
    code: 201
    input: [case_id, service_lines]
    output: BenefitDetermination
    side_effects:
      - "status := DRAFT; submission_count := 0"
      - "route and primary_payer computed by calculations.benefit_route"
      - "dental_annual_remaining_snapshot_cents := Patient.dental_annual_remaining_cents; the allocation is computed by calculations.benefit_allocation"
  - method: GET
    path: "/benefit-determinations/{determinationId}"
    description: "Read one determination with its route, allocation and reason codes."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: BenefitDetermination
    side_effects: []
  - method: GET
    path: "/benefit-determinations"
    description: "List determinations, optionally filtered by case, route and status."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["case_id?", "route?", "status?"]
    output: BenefitDetermination[]
    side_effects: []
  - method: POST
    path: "/benefit-determinations/{determinationId}/submit"
    description: "Submit or resubmit the determination to the payers. Requires a VERIFIED pre-anesthesia evaluation on the case and re-prices the whole allocation against a fresh annual-maximum snapshot."
    roles: [BenefitsSpecialist]
    code: 200
    input: []
    output: BenefitDetermination
    side_effects:
      - "status DRAFT|PENDED -> SUBMITTED; submission_count += 1; pend_reason := null"
      - "dental_annual_remaining_snapshot_cents refreshed and the full allocation recomputed by calculations.benefit_allocation"
  - method: POST
    path: "/benefit-determinations/{determinationId}/payer-response"
    description: "Record the payer's answer: APPROVED, DENIED, or PENDED for more information (which sends the determination back for resubmission)."
    roles: [BenefitsSpecialist]
    code: 200
    input: [outcome, "pend_reason?", "denial_reason?"]
    output: BenefitDetermination
    side_effects:
      - "status SUBMITTED -> APPROVED | DENIED | PENDED per outcome"
      - "on APPROVED: Patient.dental_annual_remaining_cents -= dental_allowed_cents (floored at 0); increments Patient.version by 1"
      - "on DENIED: allowances zeroed and patient_responsibility_cents := SurgicalCase.total_charge_cents, preserving the money identity"

  # ---- ImplantLot ----------------------------------------------------------
  - method: POST
    path: "/implant-lots"
    description: "Receive an implant lot into inventory, owned or on manufacturer consignment, with its fixture geometry and unit cost."
    roles: [InventoryManager]
    code: 201
    input: [practice_id, manufacturer_code, catalog_reference, diameter_mm, length_mm, unit_cost_cents, quantity_on_hand, expiry_date, "is_consignment?"]
    output: ImplantLot
    side_effects:
      - "status := AVAILABLE; quantity_reserved := 0; available_quantity := quantity_on_hand"
  - method: GET
    path: "/implant-lots/{lotId}"
    description: "Read one lot with its live on-hand, reserved and available quantities."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: ImplantLot
    side_effects: []
  - method: GET
    path: "/implant-lots"
    description: "List lots, optionally filtered by practice, manufacturer, consignment flag and status."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["practice_id?", "manufacturer_code?", "is_consignment?", "status?"]
    output: ImplantLot[]
    side_effects: []
  - method: POST
    path: "/implant-lots/{lotId}/quarantine"
    description: "Quarantine a lot on a manufacturer recall or sterility concern. Existing HELD reservations against it are released with no restocking fee."
    roles: [InventoryManager]
    code: 200
    input: [quarantine_reason]
    output: ImplantLot
    side_effects:
      - "status AVAILABLE -> QUARANTINED; available_quantity := 0"
      - "every HELD ImplantReservation on the lot -> RELEASED with restocking_fee_cents := 0 (a recall is not the practice's fault), quantity_reserved returned"
      - "Practice.consignment_committed_cents recomputed; increments Practice.version by 1"

  # ---- ImplantReservation --------------------------------------------------
  - method: POST
    path: "/implant-reservations"
    description: "Explicitly reserve fixtures from a named lot for a case. The caller must present the lot's current version because availability and consignment exposure both move with it."
    roles: [InventoryManager]
    code: 201
    input: [case_id, lot_id, quantity, expected_lot_version]
    output: ImplantReservation
    side_effects:
      - "selection_mode := EXPLICIT; status := HELD"
      - "line_subtotal_cents, restocking_fee_cents, consignment_credit_cents and consignment_liability_cents computed by calculations.consignment_liability"
      - "ImplantLot.quantity_reserved += quantity; available_quantity recomputed; increments ImplantLot.version by 1"
      - "Practice.consignment_committed_cents recomputed and checked against consignment_credit_limit_cents; increments Practice.version by 1"
  - method: POST
    path: "/surgical-cases/{caseId}/implant-reservations/auto-size"
    description: "Let the system pick the lot per calculations.implant_auto_size_selection: among the practice's AVAILABLE lots inside the +/- 0.5 mm diameter and +/- 2.0 mm length tolerance, unexpired at the case planned_start and with enough available_quantity, choose the smallest diameter, then the smallest length, then the earliest expiry_date, then the earliest created_at. No lot version is presented because the caller has not named a lot."
    roles: [InventoryManager]
    code: 201
    input: [requested_diameter_mm, requested_length_mm, quantity]
    output: ImplantReservation
    side_effects:
      - "selection_mode := AUTO_SIZED; status := HELD; lot_id := the selected lot"
      - "identical pricing and lot/practice ledger effects to the explicit reservation endpoint"
      - "ERR_NO_ELIGIBLE_IMPLANT_LOT when the candidate pool is empty"
  - method: GET
    path: "/implant-reservations/{reservationId}"
    description: "Read one reservation with its pinned subtotal, restocking fee, consignment credit and liability."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: ImplantReservation
    side_effects: []
  - method: GET
    path: "/implant-reservations"
    description: "List reservations, optionally filtered by case, lot, selection mode and status."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["case_id?", "lot_id?", "selection_mode?", "status?"]
    output: ImplantReservation[]
    side_effects: []
  - method: POST
    path: "/implant-reservations/{reservationId}/consume"
    description: "Record that the fixtures were actually placed. Draws the units off the shelf permanently."
    roles: [InventoryManager]
    code: 200
    input: []
    output: ImplantReservation
    side_effects:
      - "status HELD -> CONSUMED"
      - "ImplantLot.quantity_on_hand -= quantity and quantity_reserved -= quantity; available_quantity recomputed; increments ImplantLot.version by 1"
      - "Practice.consignment_committed_cents recomputed (a CONSUMED reservation still counts toward exposure); increments Practice.version by 1"
  - method: POST
    path: "/implant-reservations/{reservationId}/release"
    description: "Return unused fixtures to the manufacturer (RELEASED, tiered restocking fee) or report them unaccounted for (SHORTED, full subtotal liability)."
    roles: [InventoryManager]
    code: 200
    input: [disposition]
    output: ImplantReservation
    side_effects:
      - "status HELD -> RELEASED or SHORTED per disposition"
      - "on RELEASED: quantity_reserved returned, quantity_on_hand unchanged, consignment_liability_cents := restocking_fee_cents, consignment_credit_cents := 0"
      - "on SHORTED: both quantity_reserved and quantity_on_hand are decremented and consignment_liability_cents := line_subtotal_cents"
      - "increments ImplantLot.version by 1; Practice.consignment_committed_cents recomputed; increments Practice.version by 1"

  # ---- AdverseEvent --------------------------------------------------------
  - method: POST
    path: "/adverse-events"
    description: "Report an adverse anesthesia or surgical event against a case. Stamps the reporting deadline and flags a late report."
    roles: [QualityReviewer, AnesthesiaCoordinator, Surgeon]
    code: 201
    input: [case_id, event_type, severity, occurred_at, narrative]
    output: AdverseEvent
    side_effects:
      - "status := REPORTED; regulator_notified := false; reported_at := current logical clock"
      - "reporting_deadline_at := occurred_at + 24h for SENTINEL, + 72h for SEVERE, + 7 days for MODERATE, + 30 days for MINOR; late_report := reported_at > reporting_deadline_at"
      - "Practice.open_adverse_event_count += 1; increments Practice.version by 1"
      - "a SENTINEL event additionally drives the practice permit ACTIVE -> PROBATION (RESTRICTED privilege, DEEP cases deferred) or PROBATION -> SUSPENDED (full 5-hop suspension cascade)"
  - method: GET
    path: "/adverse-events/{eventId}"
    description: "Read one adverse event with its review status and notification flag."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []
  - method: GET
    path: "/adverse-events"
    description: "List adverse events, optionally filtered by case, reviewer, severity and status."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["case_id?", "reviewer_staff_id?", "severity?", "status?"]
    output: AdverseEvent[]
    side_effects: []
  - method: POST
    path: "/adverse-events/{eventId}/morbidity-review"
    description: "Open the morbidity and mortality review (action OPEN) or sign it off (action SIGN_OFF). The reviewer may not be the operating surgeon."
    roles: [QualityReviewer]
    code: 200
    input: [action, "reviewer_staff_id?", "corrective_action_required?"]
    output: AdverseEvent
    side_effects:
      - "on OPEN: status REPORTED -> UNDER_MORBIDITY_REVIEW; reviewer_staff_id persisted"
      - "on SIGN_OFF: status UNDER_MORBIDITY_REVIEW -> REVIEW_SIGNED_OFF; corrective_action_required persisted"
  - method: POST
    path: "/adverse-events/{eventId}/regulator-notification"
    description: "Record the notification sent to the state dental board. Runs on its own track and deliberately does not advance the review status."
    roles: [QualityReviewer, PracticeAdministrator]
    code: 200
    input: [notified_at, notification_reference]
    output: AdverseEvent
    side_effects:
      - "regulator_notified := true; status unchanged; increments AdverseEvent.version by 1"
  - method: POST
    path: "/adverse-events/{eventId}/close"
    description: "Close a signed-off event. A SEVERE or SENTINEL event cannot close until the regulator notification has been recorded - this is the join point of the two tracks."
    roles: [QualityReviewer]
    code: 200
    input: []
    output: AdverseEvent
    side_effects:
      - "status REVIEW_SIGNED_OFF -> CLOSED"
      - "Practice.open_adverse_event_count -= 1; increments Practice.version by 1"

  # ---- ImagingStudy (immutable) -------------------------------------------
  - method: POST
    path: "/imaging-studies"
    description: "Register a radiographic or cone-beam study with its clinical justification and dose. Immutable: the retention date is computed once at acquisition and never recomputed."
    roles: [Surgeon, AnesthesiaCoordinator, PracticeAdministrator]
    code: 201
    input: [patient_id, modality, justification_code, acquired_at, dose_mgy_cm2, "case_id?"]
    output: ImagingStudy
    side_effects:
      - "retention_until and dose_flag computed by calculations.imaging_retention_until"
  - method: GET
    path: "/imaging-studies/{studyId}"
    description: "Read one imaging study. There is no update or delete - the entity is immutable and carries no version field."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: []
    output: ImagingStudy
    side_effects: []
  - method: GET
    path: "/imaging-studies"
    description: "List imaging studies, optionally filtered by patient, case, modality and dose flag."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: ["patient_id?", "case_id?", "modality?", "dose_flag?"]
    output: ImagingStudy[]
    side_effects: []

  # ---- Test-driving endpoints ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to wall-clock time. The clock may only move forward or stay put."
    roles: [PracticeAdministrator, SchedulingCoordinator, BenefitsSpecialist, InventoryManager, Surgeon, AnesthesiaCoordinator, QualityReviewer]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
      previous_utc: string
    side_effects:
      - "every window, deadline and expiry rule is evaluated against the new value; no entity is mutated by this call"
  - method: POST
    path: "/_ops/run-compliance-sweep"
    description: "Run the periodic compliance sweep at the current logical clock: expire permits past expires_at, suspend permits whose remediation window lapsed or whose drill compliance fell below the floor, and release under-utilised blocks past their release deadline."
    roles: [PracticeAdministrator]
    code: 200
    input: ["practice_id?"]
    output:
      swept_at: string
      permits_expired: integer
      permits_suspended: integer
      permits_expired_ids: string[]
      permits_suspended_ids: string[]
      blocks_released: integer
      blocks_partially_released: integer
      cases_cancelled: integer
      reservations_released: integer
    side_effects:
      - "permits with expires_at <= now -> EXPIRED with last_enforcement_reason PERMIT_EXPIRY"
      - "permits on PROBATION past remediation_deadline_at -> SUSPENDED with last_enforcement_reason DRILL_LAPSE (the enum has no dedicated remediation-lapse reason, and the state machine pins this value)"
      - "ACTIVE permits whose drill_compliance_ratio fell below 0.75 -> PROBATION with last_enforcement_reason DRILL_LAPSE"
      - "each suspension or expiry runs the privilege cascade: Practice.sedation_privilege_state, then non-terminal sedated cases -> CANCELLED with reason PRIVILEGE_SUSPENDED, then their evaluations -> VOIDED, then their HELD reservations -> RELEASED, then the practice's consignment and adverse-event counters"
      - "blocks at or past block_start - release_deadline_hours with utilization_pct < 60.00 have their open minutes released"
      - "processed in ascending created_at order within each entity class so the outcome never depends on identifiers"
      - "each permit is tested for expiry FIRST; only permits still ACTIVE after that pass are re-checked for drill compliance, so an expired permit is never also counted as newly on probation"

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the seven declared roles, or X-User-ID missing for an entity_backed role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint in §1.5"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an id in the request path does not resolve; path ids are resolved left to right"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unknown field, or service_lines empty or longer than 8"
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "a supplied value violates its type, enum or range constraint, including block_end <= block_start and planned_end <= planned_start"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key in the body does not resolve to a live row"
  - id: ERR_PRACTICE_SCOPE_MISMATCH
    http: 409
    condition: "a referenced row belongs to a different practice than the operation's anchor row"
  - id: ERR_ACTOR_NOT_ASSIGNED
    http: 403
    condition: "an entity_backed role's X-User-ID is not the staff member the operation is bound to"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting staff member may not both perform and review this step (morbidity reviewer equals the operating surgeon, or day-of verifier equals the evaluation's author)"
  - id: ERR_PERMIT_ALREADY_OPEN
    http: 409
    condition: "the practice already holds a permit whose status is not EXPIRED or REVOKED"
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_block_version does not equal the block's current version"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal the lot's current version"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the case's current version"
  - id: ERR_CLOCK_MONOTONIC_VIOLATION
    http: 409
    condition: "the requested logical clock value is earlier than the current logical clock"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared for the row's current state, including repeating a one-shot action and acknowledging a referral that is NOT_REQUIRED"
  - id: ERR_CASE_NOT_CLEARED
    http: 409
    condition: "the case's clearance_status is not CLEARED at confirmation"
  - id: ERR_LOT_UNAVAILABLE
    http: 409
    condition: "the implant lot is QUARANTINED"
  - id: ERR_SEDATION_PRIVILEGE_UNAVAILABLE
    http: 409
    condition: "the practice's sedation_privilege_state does not permit the case's planned anesthesia level"
  - id: ERR_PERMIT_LEVEL_INSUFFICIENT
    http: 409
    condition: "the open permit's level ranks below the level the case requires"
  - id: ERR_REMEDIATION_WINDOW_EXPIRED
    http: 409
    condition: "the probation remediation window closed before the attestation was filed"
  - id: ERR_DRILL_COMPLIANCE_LAPSED
    http: 409
    condition: "the practice's drill_compliance_ratio is below 0.75"
  - id: ERR_STAFFING_RATIO_UNMET
    http: 409
    condition: "the sedation staffing matrix is unsatisfied: missing monitor, wrong monitor role_type, uncertified monitor, lapsed surgeon ACLS, or no recovery nurse on the roster"
  - id: ERR_FASTING_REQUIREMENT_UNMET
    http: 409
    condition: "npo_solids_minutes is below 480 or npo_clears_minutes is below 120 at day-of verification of a sedated case"
  - id: ERR_ESCORT_REQUIRED
    http: 409
    condition: "escort_confirmed is false (or escort_name is empty) at day-of verification of a sedated case"
  - id: ERR_RISK_BAND_PROHIBITIVE
    http: 409
    condition: "the final risk band computes to PROHIBITIVE on a day-of verification submitted with intent == CLEAR"
  - id: ERR_CBCT_JUSTIFICATION_INVALID
    http: 422
    condition: "a cone-beam study's justification_code is not allowed for its field of view"
  - id: ERR_PREREQUISITE_CASE_INCOMPLETE
    http: 409
    condition: "the case's prerequisite case has not reached COMPLETED"
  - id: ERR_PREREQUISITE_CYCLE
    http: 409
    condition: "the requested prerequisite link would make a case its own transitive prerequisite"
  - id: ERR_REFERRAL_ACKNOWLEDGEMENT_REQUIRED
    http: 409
    condition: "a referred third-molar or orthognathic case is still awaiting the referring provider's acknowledgement"
  - id: ERR_REGULATOR_NOTIFICATION_REQUIRED
    http: 409
    condition: "a SEVERE or SENTINEL adverse event cannot be closed before the regulator notification is recorded"
  - id: ERR_CASE_OUTSIDE_BLOCK_WINDOW
    http: 409
    condition: "the case's planned window is not contained in the block's window"
  - id: ERR_BLOCK_SURGEON_MISMATCH
    http: 409
    condition: "the case's primary surgeon is not the block's surgeon"
  - id: ERR_ROOM_TURNOVER_CONFLICT
    http: 409
    condition: "another committed case in the same room overlaps this case's window once the practice's turnover buffer is applied"
  - id: ERR_MONITOR_DOUBLE_BOOKED
    http: 409
    condition: "the monitor is already assigned to an overlapping committed case"
  - id: ERR_RECOVERY_CAPACITY_EXCEEDED
    http: 409
    condition: "the projected peak recovery occupancy would exceed the practice's recovery_bay_count"
  - id: ERR_BLOCK_CAPACITY_EXCEEDED
    http: 409
    condition: "the case's duration exceeds the block's remaining open minutes"
  - id: ERR_IMPLANT_STOCK_INSUFFICIENT
    http: 409
    condition: "the lot's available_quantity is below the requested quantity, or the lot expires before the case's planned start"
  - id: ERR_NO_ELIGIBLE_IMPLANT_LOT
    http: 409
    condition: "calculations.implant_auto_size_selection produced an empty candidate pool - no available, unexpired, sufficiently stocked lot inside the +/- 0.5 mm / +/- 2.0 mm tolerance"
  - id: ERR_CHARGE_TOTAL_MISMATCH
    http: 422
    condition: "the service lines do not sum to the case's total_charge_cents"
  - id: ERR_CONSIGNMENT_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "the reservation would push the practice's consignment exposure past its credit limit"

# ============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# ============================================================================
roles:
  - name: PracticeAdministrator
    description: "Owns the practice record, the anesthesia permit lifecycle, facility inspections and the compliance sweep."
    identity: opaque
    exclusive_operations:
      - "POST /practices"
      - "POST /anesthesia-permits"
      - "POST /anesthesia-permits/{permitId}/remediation"
      - "POST /facility-inspections"
      - "POST /facility-inspections/{inspectionId}/result"
      - "POST /staff-members"
      - "POST /_ops/run-compliance-sweep"
    shared_operations:
      - "POST /emergency-drills (with AnesthesiaCoordinator)"
      - "POST /patients (with SchedulingCoordinator)"
      - "POST /block-times (with SchedulingCoordinator)"
      - "POST /imaging-studies (with Surgeon and AnesthesiaCoordinator)"
      - "POST /adverse-events/{eventId}/regulator-notification (with QualityReviewer)"
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: SchedulingCoordinator
    description: "Builds the surgical schedule: block time, case drafting, block holds, confirmation, cancellation and referral coordination."
    identity: opaque
    exclusive_operations:
      - "POST /surgical-cases"
      - "POST /surgical-cases/{caseId}/hold-block"
      - "POST /surgical-cases/{caseId}/confirm"
      - "POST /surgical-cases/{caseId}/cancel"
      - "POST /surgical-cases/{caseId}/referral-coordination"
      - "POST /block-times/{blockId}/release"
    shared_operations:
      - "POST /patients (with PracticeAdministrator)"
      - "POST /block-times (with PracticeAdministrator)"
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: BenefitsSpecialist
    description: "Determines medical versus dental benefit routing and manages the payer conversation."
    identity: opaque
    exclusive_operations:
      - "POST /benefit-determinations"
      - "POST /benefit-determinations/{determinationId}/submit"
      - "POST /benefit-determinations/{determinationId}/payer-response"
    shared_operations:
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: InventoryManager
    description: "Owns implant lots, manufacturer consignment and every reservation disposition."
    identity: opaque
    exclusive_operations:
      - "POST /implant-lots"
      - "POST /implant-lots/{lotId}/quarantine"
      - "POST /implant-reservations"
      - "POST /surgical-cases/{caseId}/implant-reservations/auto-size"
      - "POST /implant-reservations/{reservationId}/consume"
      - "POST /implant-reservations/{reservationId}/release"
    shared_operations:
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: Surgeon
    description: "The operating surgeon. X-User-ID is a StaffMember id; a surgeon may only complete a case where they are the primary_surgeon_id."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /surgical-cases/{caseId}/start-recovery"
      - "POST /surgical-cases/{caseId}/complete"
    shared_operations:
      - "POST /adverse-events (with AnesthesiaCoordinator and QualityReviewer)"
      - "POST /imaging-studies (with AnesthesiaCoordinator and PracticeAdministrator)"
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: AnesthesiaCoordinator
    description: "Runs the anesthesia programme: drills, pre-anesthesia evaluations, signatures, day-of verification and recovery hand-off. X-User-ID is a StaffMember id."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /surgical-cases/{caseId}/pre-anesthesia-evaluations"
      - "POST /pre-anesthesia-evaluations/{evaluationId}/sign"
      - "POST /pre-anesthesia-evaluations/{evaluationId}/day-of-verification"
    shared_operations:
      - "POST /emergency-drills (with PracticeAdministrator)"
      - "POST /adverse-events (with Surgeon and QualityReviewer)"
      - "POST /imaging-studies (with Surgeon and PracticeAdministrator)"
      - "every GET endpoint and POST /_clock/set_current_utc"
  - name: QualityReviewer
    description: "Runs morbidity and mortality review and the regulator notification track. X-User-ID is a StaffMember id and may never be the case's operating surgeon."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /adverse-events/{eventId}/morbidity-review"
      - "POST /adverse-events/{eventId}/close"
    shared_operations:
      - "POST /adverse-events (with Surgeon and AnesthesiaCoordinator)"
      - "POST /adverse-events/{eventId}/regulator-notification (with PracticeAdministrator)"
      - "every GET endpoint and POST /_clock/set_current_utc"
