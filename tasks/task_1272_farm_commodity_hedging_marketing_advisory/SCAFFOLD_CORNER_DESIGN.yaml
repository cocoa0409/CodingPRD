# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Farm Commodity Hedging & Marketing Advisory
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Same recipe contract as §1.8.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: operation_create_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.GrowerOperation.fields.yield_method]
        distinguishing_aspect: "Omitting optional yield_method applies the APH default; system stamps id (UUID), created_at, version == 1 and ignores client-supplied computed fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/operations", payload: { name: "Default Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id, ym: $.data.yield_method, v: $.data.version, osf: $.data.over_sold_flag } }
          assert:
            - "response 201; yield_method == APH (default applied), version == 1, over_sold_flag == false (computed default)"
            - "id is a UUID and created_at is present (system fields), response_type == object per envelope"
      - name: operation_missing_risk_profile_returns_400
        claim_type: required_fields
        grounds: [entities.GrowerOperation.fields.risk_profile, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A create missing required enum risk_profile fails schema validation with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/operations", payload: { name: "Bad Farm", primary_commodity: CORN, crop_year: 2026 }, as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "rejected ERR_VALIDATION (400); no operation persisted (GET list-free check: subsequent POST with same payload + risk_profile succeeds)"
      - name: get_operation_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404), never a panic or empty 200."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /advisory/operations/11111111-2222-4333-8444-555555555555", as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "ERR_NOT_FOUND with http 404 in the error envelope shape"
      - name: baseline_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.ProductionBaseline.fields.expected_bushels]
        distinguishing_aspect: "Client-smuggled expected_bushels is ignored; the server computes 20000 from acres x APH yield."
        test_recipe:
          setup: ["operation exists"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Smuggle Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
          trigger:
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}", expected_bushels: 999 }, as: CommodityAdvisor, captures: { exp: $.data.expected_bushels } }
          assert:
            - "response expected_bushels == 20000 (server-computed), not the smuggled 999"
      - name: list_contracts_filtered_by_buyer
        claim_type: parent_relationships
        grounds: [entities.SalesContract.fields.buyer_id]
        distinguishing_aspect: "FK reverse-reachability: GET /advisory/sales-contracts?buyer_id= returns exactly that buyer's contracts as an array envelope."
        test_recipe:
          setup: ["ACTIVE plan (AGGRESSIVE, expected 20000); buyers B1, B2 APPROVED; contract C1 for B1 (3000 bu Oct), C2 for B2 (2000 bu Oct)"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "FK Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "B1", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { b1: $.data.id } }
            - { call: "POST /advisory/buyers", payload: { name: "B2", buyer_type: PROCESSOR, credit_rating: B }, as: CommodityAdvisor, captures: { b2: $.data.id } }
            - { call: "POST /advisory/buyers/${b1}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/buyers/${b2}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${b1}", contract_type: FLAT_PRICE, bushels: 3000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${b2}", contract_type: FLAT_PRICE, bushels: 2000, fixed_price: 4.60, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c2: $.data.id } }
          trigger:
            - { call: "GET /advisory/sales-contracts", payload: { buyer_id: "${b1}" }, as: CommodityAdvisor, captures: { first_id: "$.data[0].id" } }
          assert:
            - "response_type == array; exactly 1 element; element id == C1; C2 absent (filter respected)"
      - name: market_tick_append_only_no_update_endpoint
        claim_type: immutability
        grounds: [entities.MarketTick]
        distinguishing_aspect: "MarketTick is an append-only event (common_fields false): creation returns the recorded fields and §1.5 declares no PUT/PATCH/DELETE for ticks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.60, kind: SETTLEMENT, price_date: "2026-06-01" }, as: PlatformAdmin, captures: { tick_id: $.data.id, px: $.data.price } }
          assert:
            - "201 with id, created_at, price == 4.60; no update/delete endpoint exists for market-ticks in the API surface"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: baseline_initial_state_provisional
        claim_type: initial_state
        grounds: [state_machines.ProductionBaseline]
        distinguishing_aspect: "A newly created baseline starts PROVISIONAL and is excluded from plan activation until certified."
        test_recipe:
          setup: ["operation exists"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Init Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
          trigger:
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { st: $.data.status } }
          assert:
            - "status == PROVISIONAL at creation"
      - name: superseded_baseline_certify_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProductionBaseline.CERTIFIED_to_SUPERSEDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUPERSEDED is terminal: certifying a superseded baseline is rejected and produces no status change."
        test_recipe:
          setup: ["operation with baseline B1 superseded by baseline B2"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Term Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { b1: $.data.id } }
            - { call: "GET /advisory/operations/${op_id}", as: CommodityAdvisor, captures: { op_v2: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 110, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v2}" }, as: CommodityAdvisor, captures: { b2: $.data.id } }
          trigger:
            - { call: "POST /advisory/production-baselines/${b1}/certify", as: Grower, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "certify on SUPERSEDED B1 rejected with ERR_INVALID_STATE (409); B1 remains SUPERSEDED"
      - name: accepted_recommendation_cannot_be_rejected
        claim_type: invalid_transition
        grounds: [state_machines.HedgeRecommendation.PROPOSED_to_ACCEPTED]
        distinguishing_aspect: "From ACCEPTED there is no reject edge: reject returns ERR_INVALID_STATE and the recommendation stays ACCEPTED."
        test_recipe:
          setup: ["ACTIVE plan (BALANCED, expected 200000, cap 160000) with one ACCEPTED recommendation 1000 bu"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "InvT Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 1000 }, as: CommodityAdvisor, captures: { rec: $.data.id } }
            - { call: "POST /advisory/hedge-recommendations/${rec}/accept", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /advisory/hedge-recommendations/${rec}/reject", as: Grower, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "reject from ACCEPTED rejected with ERR_INVALID_STATE; status remains ACCEPTED"
      - name: target_double_cancel_rejected
        claim_type: idempotency
        grounds: [state_machines.PriceTarget.PENDING_to_CANCELLED]
        distinguishing_aspect: "Repeating the same cancel trigger on an already-CANCELLED target fails with ERR_INVALID_STATE — transitions are not idempotent."
        test_recipe:
          setup: ["ACTIVE plan with one PENDING target"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Idem Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/price-targets", payload: { plan_id: "${plan_id}", contract_month: "2026-12", target_price: 4.80, increment_bushels: 2000 }, as: CommodityAdvisor, captures: { tgt: $.data.id } }
          trigger:
            - { call: "POST /advisory/price-targets/${tgt}/cancel", as: CommodityAdvisor, captures: { st1: $.data.status } }
            - { call: "POST /advisory/price-targets/${tgt}/cancel", as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "First cancel: CANCELLED; second cancel: ERR_INVALID_STATE (no double-transition)"
      - name: plan_close_blocked_with_open_contract
        claim_type: precondition_enforcement
        grounds: [state_machines.MarketingPlan.ACTIVE_to_CLOSED]
        distinguishing_aspect: "Manual close requires zero OPEN/PARTIALLY_DELIVERED contracts; with one OPEN contract the close is rejected and the plan stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE plan (AGGRESSIVE, expected 20000) with one OPEN FLAT contract 5000 bu"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "CloseBlock Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "CB Buyer", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 5000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor }
          trigger:
            - { call: "POST /advisory/marketing-plans/${plan_id}/close", as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "close rejected ERR_INVALID_STATE; plan remains ACTIVE"
      - name: buyer_suspend_preserves_existing_contract
        claim_type: side_effect_execution
        grounds: [state_machines.Buyer.APPROVED_to_SUSPENDED]
        distinguishing_aspect: "Suspension is prospective only: an existing OPEN contract on the suspended buyer is untouched (no cascade cancel)."
        test_recipe:
          setup: ["ACTIVE plan; buyer APPROVED; contract C OPEN with that buyer"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Susp Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Susp Buyer", buyer_type: EXPORTER, credit_rating: B }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 4000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /advisory/buyers/${buyer_id}/suspend", as: ComplianceOfficer }
            - { call: "GET /advisory/sales-contracts/${c_id}", as: CommodityAdvisor, captures: { fs: $.data.fulfillment_status } }
          assert:
            - "After buyer suspension: contract fulfillment_status still == OPEN (no retroactive cascade)"
      - name: offset_relieves_margin_call
        claim_type: side_effect_execution
        grounds: [state_machines.BrokeragePosition.OPEN_to_OFFSET, state_machines.MarginAccount]
        distinguishing_aspect: "Offsetting the only OPEN position realizes pnl into cash and re-evaluates the account: with no positions left, maintenance is 0 and the account returns to FUNDED."
        test_recipe:
          setup: ["BALANCED operation expected 200000; ACTIVE plan; margin account funded 20000.00; position 50000 bu OPEN @4.50; tick 4.70 has driven equity to 10000.00 -> CALL_OUTSTANDING (call 5000.00)"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Offset Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/margin-accounts", payload: { operation_id: "${op_id}", initial_funding: 20000 }, as: CommodityAdvisor, captures: { acct: $.data.id } }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.50, kind: SETTLEMENT, price_date: "2026-06-01" }, as: PlatformAdmin }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 50000 }, as: CommodityAdvisor, captures: { rec: $.data.id } }
