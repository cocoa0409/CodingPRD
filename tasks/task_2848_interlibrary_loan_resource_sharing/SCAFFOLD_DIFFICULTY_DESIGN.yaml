# ===========================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2848 — Interlibrary Loan & Resource Sharing
#
# Every instance grounds ONLY in elements already declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the scaffold's declared behaviour
# identical; it only makes coverage harder to audit.
#
# Clock discipline: the server's logical clock starts at 2026-08-01T00:00:00Z
# and moves forward only, via POST /_clock/set_current_utc.
# Test user ids: admin-01, ill-staff-01, ill-staff-02, acq-01, acq-02, acct-01.
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: invoice_net_variant_flips_direction_where_gross_variant_bills_the_borrower
        grounds:
          - calculations.partner_invoice_reconciliation
          - entities.PartnerInvoice.fields.settlement_variant
          - entities.PartnerInvoice.fields.net_amount_cents
          - entities.PartnerInvoice.fields.direction
          - entities.PartnerInvoice.fields.gross_amount_cents
          - state_machines.PartnerInvoice.DRAFT_to_SUPERSEDED
          - concurrency_rules[invoice-draft-regenerate-stale-partner]
        distinguishing_aspect: |
          This instance exercises the cost-accounting domain on PartnerInvoice: over one identical
          month of borrow and lend lines the gross_settlement variant reports net_amount_cents ==
          3440 with direction PAYABLE while the net_settlement variant reports net_amount_cents ==
          -2831 with direction RECEIVABLE, and gross_amount_cents is 3440 under both — the variant
          switch changes which party owes money, not merely the magnitude.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z for all fulfilment, then advanced to 2026-08-25T00:00:00Z before the lend lines are booked."
            - "Patron P-8001 with unpaid_balance_cap_cents 100000, max_open_requests 5, max_concurrent_loans 3."
            - "Partner NORTHU with base_lending_fee_cents 2000, avg_turnaround_days 4, loan_period_days 28, max_renewals 2, ships_physical and supplies_electronic true."
            - "NORTHU carries one ACTIVE ReciprocityAgreement [2026-01-01, 2027-01-01) with fee_waiver_mode NONE and settlement_mode NET."
            - "Two LOAN rotas, each holding exactly one NORTHU entry: rota A quoted 2000 cents, rota B quoted 1200 cents, both quoted_turnaround_days 4."
            - "Two IllRequests, one per rota, both sourced to NORTHU, accepted, shipped and received on 2026-08-01 — committed_fee_cents 2000 and 1200, fulfilled_at 2026-08-01T00:00:00Z."
            - "Two OPEN LendingCharge rows against NORTHU inside 2026-08: 2500 cents on 2026-08-05 and 3333 cents on 2026-08-20."
            - "A DRAFT invoice for 2026-08 already generated under the NET agreement, which is then superseded by a GROSS agreement over the identical window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8001", full_name: "Ada Faculty", email: "ada@u.edu", patron_type: "FACULTY", department: "PHYS", max_open_requests: 5, max_concurrent_loans: 3, unpaid_balance_cap_cents: 100000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id, northu_v0: $.data.version }
            - call: "POST /ill/reciprocity-agreements"
              payload: { partner_id: "${northu_id}", expected_partner_version: "${northu_v0}", fee_waiver_mode: "NONE", settlement_mode: "NET", turnaround_guarantee_days: 5, balance_tolerance_items: 3, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { agr_net_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota A", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_a_id: $.data.id, rota_a_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_a_id}", expected_rota_version: "${rota_a_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota B", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_b_id: $.data.id, rota_b_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_b_id}", expected_rota_version: "${rota_b_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 1200, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Structural Dynamics", item_type: "BOOK", publication_year: 2019, isbn: "978-0-000-00001-1", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_book_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_book_id}", rota_id: "${rota_a_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req1_id: $.data.id }
            - call: "POST /ill/requests/${req1_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer1_id: $.data.id }
            - call: "POST /ill/supply-offers/${offer1_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${northu_id}"
            - call: "POST /ill/supply-offers/${offer1_id}/shipments"
              payload: { carrier: "UPS", tracking_code: "1Z-NU-0001", insured_value_cents: 9000 }
              as: PartnerAgent
              as_user_id: "${northu_id}"
              captures: { ship1_id: $.data.id }
            - call: "POST /ill/shipments/${ship1_id}/receive"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_book_id}", rota_id: "${rota_b_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req2_id: $.data.id }
            - call: "POST /ill/requests/${req2_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer2_id: $.data.id }
            - call: "POST /ill/supply-offers/${offer2_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${northu_id}"
            - call: "POST /ill/supply-offers/${offer2_id}/shipments"
              payload: { carrier: "UPS", tracking_code: "1Z-NU-0002", insured_value_cents: 9000 }
              as: PartnerAgent
              as_user_id: "${northu_id}"
              captures: { ship2_id: $.data.id }
            - call: "POST /ill/shipments/${ship2_id}/receive"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${northu_id}", item_title: "Fluid Mechanics vol 2", service_type: "LOAN", charge_cents: 2500, incurred_at: "2026-08-05T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${northu_id}", item_title: "Optics Letters scan", service_type: "COPY", charge_cents: 3333, incurred_at: "2026-08-20T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { northu_v1: $.data.version }
            - call: "POST /ill/partners/${northu_id}/invoices"
              payload: { expected_partner_version: "${northu_v1}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_net_id: $.data.id }
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_v2: $.data.version }
            - call: "POST /ill/reciprocity-agreements"
              payload: { partner_id: "${northu_id}", expected_partner_version: "${northu_v2}", supersedes_agreement_id: "${agr_net_id}", fee_waiver_mode: "NONE", settlement_mode: "GROSS", turnaround_guarantee_days: 5, balance_tolerance_items: 3, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { agr_gross_id: $.data.id }
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { northu_v3: $.data.version }
          trigger:
            - call: "POST /ill/partners/${northu_id}/invoices"
              payload: { expected_partner_version: "${northu_v3}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_gross_id: $.data.id }
          assert:
            - "PartnerInvoice.${inv_net_id}.settlement_variant == NET"
            - "PartnerInvoice.${inv_net_id}.borrow_line_count == 2"
            - "PartnerInvoice.${inv_net_id}.lend_line_count == 2"
            - "PartnerInvoice.${inv_net_id}.payable_total_cents == 3440"
            - "PartnerInvoice.${inv_net_id}.receivable_total_cents == 6271"
            - "PartnerInvoice.${inv_net_id}.gross_amount_cents == 3440"
            - "PartnerInvoice.${inv_net_id}.net_amount_cents == -2831"
            - "PartnerInvoice.${inv_net_id}.direction == RECEIVABLE"
            - "PartnerInvoice.${inv_net_id}.status == SUPERSEDED"
            - "PartnerInvoice.${inv_gross_id}.settlement_variant == GROSS"
            - "PartnerInvoice.${inv_gross_id}.borrow_line_count == 2"
            - "PartnerInvoice.${inv_gross_id}.lend_line_count == 2"
            - "PartnerInvoice.${inv_gross_id}.payable_total_cents == 3440"
            - "PartnerInvoice.${inv_gross_id}.receivable_total_cents == 6271"
            - "PartnerInvoice.${inv_gross_id}.gross_amount_cents == 3440"
            - "PartnerInvoice.${inv_gross_id}.net_amount_cents == 3440"
            - "PartnerInvoice.${inv_gross_id}.direction == PAYABLE"
            - "PartnerInvoice.${inv_gross_id}.status == DRAFT"
            - "ReciprocityAgreement.${agr_net_id}.status == SUPERSEDED and ReciprocityAgreement.${agr_gross_id}.status == ACTIVE"
            - "The two invoices share gross_amount_cents (3440) and differ in net_amount_cents by exactly 6271, the receivable side"

      - name: patron_standing_provisional_admits_intake_that_final_variant_blocks
        grounds:
          - calculations.patron_standing_score
          - entities.Patron.fields.provisional_risk_score
          - entities.Patron.fields.final_risk_score
          - entities.Patron.fields.status
          - validations[priority=60]
        distinguishing_aspect: |
          This instance exercises the borrower risk-scoring domain on Patron, a different entity and a
          different quantity from the PartnerInvoice money instance: with lost_count 1, late_return_count
          1 and unpaid_balance_cents 5000 the provisional_standing variant scores 36 and lets intake
          through, while the final_standing variant scores 42 on the identical stored data — because it
          alone adds W_OVERDUE_IN_FLIGHT for the loan the patron still holds past due_at — and drives
          Patron.status to BLOCKED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z during intake and fulfilment, advanced to 2026-09-05T00:00:00Z before the sweep."
            - "Patron P-8002 with unpaid_balance_cap_cents 5000 and pre-loaded migrated history: 1 LOST, 1 LATE_RETURN, 5000 cents UNPAID_CHARGE."
            - "Partner NORTHU (base_lending_fee_cents 2000, avg_turnaround_days 4, loan_period_days 28, max_renewals 2, allows_renewals true) on a single-entry LOAN rota quoted 2000 / 4 days."
            - "One IllRequest taken in on 2026-08-01 with needed_by 2026-08-09, sourced, accepted, shipped, received and picked up — LoanRecord custody WITH_PATRON, due_at 2026-08-29T00:00:00Z."
            - "No ops-run has been executed yet, so final_risk_score has not been recomputed against the now-overdue loan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8002", full_name: "Ben Grad", email: "ben@u.edu", patron_type: "GRAD", department: "CHEM", max_open_requests: 5, max_concurrent_loans: 3, unpaid_balance_cap_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/patrons/${patron_id}/infraction-records"
              payload: { kind: "LOST", count: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons/${patron_id}/infraction-records"
              payload: { kind: "LATE_RETURN", count: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons/${patron_id}/infraction-records"
              payload: { kind: "UNPAID_CHARGE", unpaid_amount_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Structural Dynamics", item_type: "BOOK", publication_year: 2019, isbn: "978-0-000-00001-1", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_book_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_book_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id }
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_id: $.data.id }
            - call: "POST /ill/supply-offers/${offer_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${northu_id}"
            - call: "POST /ill/supply-offers/${offer_id}/shipments"
              payload: { carrier: "UPS", tracking_code: "1Z-NU-0011", insured_value_cents: 9000 }
              as: PartnerAgent
              as_user_id: "${northu_id}"
              captures: { ship_id: $.data.id }
            - call: "POST /ill/shipments/${ship_id}/receive"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { loan_id: $.data.id }
            - call: "POST /ill/loans/${loan_id}/pickup"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /ill/ops-runs"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { blocked_count: $.data.patrons_blocked }
          assert:
            - "Patron.${patron_id}.lost_count == 1 and Patron.${patron_id}.late_return_count == 1 and Patron.${patron_id}.unpaid_balance_cents == 5000"
            - "Patron.${patron_id}.provisional_risk_score == 36"
            - "Patron.${patron_id}.final_risk_score == 42"
            - "Patron.${patron_id}.status == BLOCKED"
            - "${blocked_count} == 1"
            - "IllRequest.${req_id}.status == WITH_PATRON — the request admitted under the provisional variant is untouched by the block"
            - "LoanRecord.${loan_id}.custody_status == WITH_PATRON and LoanRecord.${loan_id}.due_at == 2026-08-29T00:00:00Z"
            - "The two variants differ by exactly 6, the single W_OVERDUE_IN_FLIGHT term the final variant adds"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: charge_assembly_subsidy_tier_keyed_on_gross_not_on_post_subsidy_net
        grounds:
          - calculations.patron_charge_assembly
          - calculations.lender_landed_cost_ranking
          - entities.IllRequest.fields.gross_charge_cents
          - entities.IllRequest.fields.subsidy_cents
          - entities.IllRequest.fields.net_patron_charge_cents
          - entities.IllRequest.fields.rush_surcharge_cents
          - entities.IllRequest.fields.days_available_at_source
        distinguishing_aspect: |
          Mode (c) — order of operations inside one formula: the subsidy tier is looked up on
          gross_charge_cents (3200, tier 0.60) BEFORE the subsidy is subtracted, yielding subsidy 1920
          and net 1280; keying the same tier table on the resulting net (1280, tier 0.80) instead
          produces subsidy 2560 and net 640, so the two readings of the identical inputs disagree by
          640 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Patron P-8003, default caps, no infraction history."
            - "Partner NORTHU with base_lending_fee_cents 2000, avg_turnaround_days 4, loan_period_days 28, ships_physical true; no ReciprocityAgreement, so no fee waiver applies."
            - "Single-entry LOAN rota with selection_policy LANDED_COST: NORTHU quoted_fee_cents 2000, quoted_turnaround_days 4."
            - "IllRequest with needed_by 2026-08-04T00:00:00Z, i.e. days_available 3 at sourcing — exactly at RUSH_THRESHOLD_DAYS, so the 1200-cent rush surcharge applies."
            - "The offer is open (status OFFERED) and has not yet been accepted, so no charge has been assembled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8003", full_name: "Cara Undergrad", email: "cara@u.edu", patron_type: "UNDERGRAD", department: "HIST", max_open_requests: 5, max_concurrent_loans: 3, unpaid_balance_cap_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Structural Dynamics", item_type: "BOOK", publication_year: 2019, isbn: "978-0-000-00001-1", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_book_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_book_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-04T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id }
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_id: $.data.id, offer_landed: $.data.landed_cost_cents }
          trigger:
            - call: "POST /ill/supply-offers/${offer_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${northu_id}"
          assert:
            - "SupplyOffer.${offer_id}.effective_fee_cents == 2000"
            - "SupplyOffer.${offer_id}.landed_cost_cents == 2250"
            - "${offer_landed} == 2250"
            - "IllRequest.${req_id}.days_available_at_source == 3"
            - "IllRequest.${req_id}.committed_fee_cents == 2000"
            - "IllRequest.${req_id}.rush_surcharge_cents == 1200"
            - "IllRequest.${req_id}.royalty_cents == 0"
            - "IllRequest.${req_id}.gross_charge_cents == 3200"
            - "IllRequest.${req_id}.subsidy_cents == 1920"
            - "IllRequest.${req_id}.net_patron_charge_cents == 1280"
            - "IllRequest.${req_id}.net_patron_charge_cents != 640 — 640 is the value produced by keying the subsidy tier on the post-subsidy net (tier(1280) = 0.80, subsidy 2560)"
            - "Patron.${patron_id}.pending_charge_cents == 1280"
            - "IllRequest.${req_id}.status == SUPPLY_COMMITTED and SupplyOffer.${offer_id}.status == ACCEPTED"

      - name: invoice_consortium_surcharge_rounded_per_line_before_summation
        grounds:
          - calculations.partner_invoice_reconciliation
          - entities.PartnerInvoice.fields.receivable_total_cents
          - entities.PartnerInvoice.fields.lend_line_count
          - entities.LendingCharge.fields.charge_cents
          - concurrency_rules[invoice-draft-regenerate-stale-partner]
        distinguishing_aspect: |
          Mode (b) — rounding order inside an aggregate: the 7.5% consortium surcharge is rounded
          round_half_up ONCE PER LINE and only then summed, giving receivable_total_cents 8421 over
          lines 2000, 2500 and 3333; summing the three raw charges to 7833 and rounding
          7833 * 0.075 = 587.475 once gives 8420, so the two orders differ by exactly 1 cent.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-25T00:00:00Z so all three lend lines are already incurred."
            - "Partner SOUTHC with NO ReciprocityAgreement at all, so settlement_variant defaults to GROSS."
            - "Three OPEN LendingCharge rows against SOUTHC inside 2026-08: 2000 cents (2026-08-02), 2500 cents (2026-08-11) and 3333 cents (2026-08-19)."
            - "No IllRequest is committed to SOUTHC, so the borrow side of the invoice is empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "SOUTHC", name: "South College Library", consortium_code: "MIDWEST", base_lending_fee_cents: 1200, avg_turnaround_days: 9, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { southc_id: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${southc_id}", item_title: "Thermodynamics 4e", service_type: "LOAN", charge_cents: 2000, incurred_at: "2026-08-02T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { lc1_id: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${southc_id}", item_title: "Journal of Optics scan", service_type: "COPY", charge_cents: 2500, incurred_at: "2026-08-11T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { lc2_id: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${southc_id}", item_title: "Rare Maps folio", service_type: "LOAN", charge_cents: 3333, incurred_at: "2026-08-19T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { lc3_id: $.data.id }
            - call: "GET /ill/partners/${southc_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { southc_v1: $.data.version }
          trigger:
            - call: "POST /ill/partners/${southc_id}/invoices"
              payload: { expected_partner_version: "${southc_v1}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_id: $.data.id, inv_receivable: $.data.receivable_total_cents }
          assert:
            - "PartnerInvoice.${inv_id}.settlement_variant == GROSS"
            - "PartnerInvoice.${inv_id}.lend_line_count == 3"
            - "PartnerInvoice.${inv_id}.borrow_line_count == 0"
            - "PartnerInvoice.${inv_id}.receivable_total_cents == 8421"
            - "${inv_receivable} == 8421"
            - "PartnerInvoice.${inv_id}.receivable_total_cents != 8420 — 8420 is the sum-then-round-once result (7833 raw, surcharge 587)"
            - "PartnerInvoice.${inv_id}.payable_total_cents == 0"
            - "PartnerInvoice.${inv_id}.gross_amount_cents == 0"
            - "PartnerInvoice.${inv_id}.net_amount_cents == 0"
            - "PartnerInvoice.${inv_id}.direction == PAYABLE"
            - "PartnerInvoice.${inv_id}.status == DRAFT"
            - "Partner.${southc_id}.lend_receivable_cents == 7833 — the raw, un-surcharged conserved total"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: request_cycles_sourcing_offer_pending_twice_then_pod_rejection_resets_attempt_budget
        grounds:
          - state_machines.IllRequest.SOURCING_to_OFFER_PENDING
          - state_machines.IllRequest.OFFER_PENDING_to_SOURCING
          - state_machines.IllRequest.SOURCING_to_ESCALATED_POD
          - state_machines.IllRequest.ESCALATED_POD_to_SOURCING
          - entities.IllRequest.fields.attempt_count
          - entities.IllRequest.fields.unfilled_reason
          - validations[priority=74]
          - calculations.lender_landed_cost_ranking
        distinguishing_aspect: |
          IllRequest is the cyclic machine: it enters SOURCING three separate times over one lifetime
          (intake, two declines, one POD rejection), and the ESCALATED_POD -> SOURCING edge is not a
          plain revert — it resets attempt_count from 2 back to 0 and unfilled_reason to NONE, so the
          rota budget that had already raised ERR_ROTA_ATTEMPTS_EXHAUSTED becomes spendable again while
          the permanently-excluded declined partners stay excluded.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z throughout; no ops-run is executed."
            - "Patron P-8004 with default caps."
            - "Three ACTIVE partners, all ships_physical true: NORTHU (quoted 2000 / 4 days), WESTA (quoted 2500 / 2 days), SOUTHC (quoted 1200 / 9 days)."
            - "One LOAN rota, selection_policy LANDED_COST, max_attempts 2, auto_escalate_pod false, holding one entry per partner."
            - "One IllRequest with needed_by 2026-08-04T00:00:00Z, i.e. days_available 3, and max_supply_fee_cents 5000 — landed costs are NORTHU 2250, WESTA 2500, SOUTHC 2700."
            - "Rota round 1 offered to NORTHU and declined; round 2 offered to WESTA and declined; a third round already refused with ERR_ROTA_ATTEMPTS_EXHAUSTED; the request then escalated to a PROPOSED purchase-on-demand order raised by ill-staff-01."
