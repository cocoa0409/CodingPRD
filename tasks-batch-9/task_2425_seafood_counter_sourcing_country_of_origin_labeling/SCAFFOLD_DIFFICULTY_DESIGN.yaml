            - "after trigger call 3: SupplierLot.${lot_2}.intake_status == CASED and SupplierLot.${lot_2}.case_slot == 1"
            - "SupplierLot.${lot_2}.cased_at == 2026-08-01T10:30:00Z"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: counter_shrink_ledger_zeroes_after_post_then_reverse
        grounds:
          - state_machines.ShrinkEvent.CONVERTED_to_POSTED
          - state_machines.ShrinkEvent.POSTED_to_REVERSED
          - entities.Counter.fields.shrink_gross_cents
          - entities.Counter.fields.shrink_net_cents
          - entities.Counter.fields.recovered_conversion_cents
          - calculations.shrink_valuation
        distinguishing_aspect: |
          The counter shrink ledger must satisfy shrink_gross_cents == shrink_net_cents +
          recovered_conversion_cents both after the post (15285 == 6192 + 9093) and after the
          reversal (0 == 0 + 0), and the reversal must also return the 8.375 kg to
          remaining_weight_kg, so a reversal that forgets the recovery leg leaves 9093 cents
          of drift.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of Atlantic Cod, 30.000 kg, CASED in slot 1"
            - "ShrinkEvent reason UNSOLD_FRESH, shrink_weight_kg 8.375, conversion_requested_kg 6.000, driven to status CONVERTED"
            - "Counter ledger at 0 / 0 / 0 before the post"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 30.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "UNSOLD_FRESH", shrink_weight_kg: 8.375, conversion_requested_kg: 6.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { se_id: $.data.id }
            - call: "POST /seafood-ops/shrink-events/${se_id}/approve-conversion"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events/${se_id}/convert"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
          trigger:
            - call: "POST /seafood-ops/shrink-events/${se_id}/post"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events/${se_id}/reverse"
              payload: { reversal_note: "cook-and-sell batch was condemned at the hot case" }
              as: ComplianceOfficer
              as_user_id: "officer-ledger-4"
          assert:
            - "after trigger call 1: Counter.${counter_id}.shrink_gross_cents == 15285"
            - "after trigger call 1: Counter.${counter_id}.shrink_net_cents == 6192"
            - "after trigger call 1: Counter.${counter_id}.recovered_conversion_cents == 9093"
            - "after trigger call 1: SupplierLot.${lot_id}.remaining_weight_kg == 21.625"
            - "after trigger call 2: Counter.${counter_id}.shrink_gross_cents == 0"
            - "after trigger call 2: Counter.${counter_id}.shrink_net_cents == 0"
            - "after trigger call 2: Counter.${counter_id}.recovered_conversion_cents == 0"
            - "after trigger call 2: Counter.${counter_id}.shrink_gross_cents == Counter.${counter_id}.shrink_net_cents + Counter.${counter_id}.recovered_conversion_cents"
            - "after trigger call 2: SupplierLot.${lot_id}.remaining_weight_kg == 30.000"
            - "ShrinkEvent.${se_id}.status == REVERSED"

      - name: supplier_chargeback_ledger_identity_after_reversal
        grounds:
          - state_machines.SupplierLot.chargeback_status.ASSESSED_to_REVERSED
          - entities.Supplier.fields.chargeback_assessed_total_cents
          - entities.Supplier.fields.chargeback_outstanding_cents
          - entities.Supplier.fields.chargeback_reversed_cents
          - calculations.supplier_chargeback_assessment
        distinguishing_aspect: |
          This compensating pair guards a different ledger from the counter shrink ledger -
          the Supplier chargeback ledger - and its invariant is conservation rather than
          return to zero: chargeback_assessed_total_cents stays at 47840 after the reversal
          while outstanding drops to 0 and reversed rises to 47840, so assessed_total ==
          outstanding + settled + reversed still holds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of Tilapia, 10.000 kg, retail 2300 cents/kg, CASED in slot 1 with a PUBLISHED CaseLabel"
            - "verification sample resolved MISMATCH against Atlantic Cod, so chargeback_status is ASSESSED at 47840 cents and the Supplier ledger reads assessed_total 47840 / outstanding 47840 / settled 0 / reversed 0"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Tilapia", scientific_name: "Oreochromis niloticus", acceptable_market_names: ["Tilapia"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { tilapia_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${tilapia_id}", lot_code: "TIL-0801-B", harvest_method: "AQUACULTURE_POND", production_method: "FARMED", origin_country_code: "EC", previously_frozen: false, fresh_claim: false, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2300, cooked_retail_price_cents_per_kg: 2500 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_v: $.data.version }
            - call: "POST /seafood-ops/case-labels"
              payload: { lot_id: "${lot_id}", expected_lot_version: "${lot_v}" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { label_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_id}/send-to-lab"
              payload: { lab_reference: "LAB-B-0001" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
            - call: "POST /seafood-ops/verification-samples/${sample_id}/result"
              payload: { observed_species_id: "${cod_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          trigger:
            - call: "POST /seafood-ops/lots/${lot_id}/reverse-chargeback"
              payload: { reversal_note: "laboratory accession was traced to the wrong tote" }
              as: ComplianceOfficer
              as_user_id: "officer-ledger-4"
          assert:
            - "SupplierLot.${lot_id}.chargeback_status == REVERSED"
            - "SupplierLot.${lot_id}.chargeback_assessed_cents == 47840"
            - "Supplier.${supplier_id}.chargeback_assessed_total_cents == 47840"
            - "Supplier.${supplier_id}.chargeback_outstanding_cents == 0"
            - "Supplier.${supplier_id}.chargeback_settled_cents == 0"
            - "Supplier.${supplier_id}.chargeback_reversed_cents == 47840"
            - "Supplier.${supplier_id}.chargeback_assessed_total_cents == Supplier.${supplier_id}.chargeback_outstanding_cents + Supplier.${supplier_id}.chargeback_settled_cents + Supplier.${supplier_id}.chargeback_reversed_cents"
            - "Supplier.${supplier_id}.status == GOOD_STANDING"
