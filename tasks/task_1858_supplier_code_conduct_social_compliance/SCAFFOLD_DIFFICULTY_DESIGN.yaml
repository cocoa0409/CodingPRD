            - "after void: ${void_status} == VOIDED and ${min_post} == 0 while ${zt_post} == 1 and ${maj_post} == 1 (sum 2 == 2 non-VOIDED findings; the voided record remains listed, not deleted: ${voided0} == ${f_min})"
            - "compensation restores the score: ${ver_post} == 50 (100 - 40 - 10; the voided MINOR's 3 points are restored in both variants)"

      - name: reimbursement_balance_conservation_on_reverse
        grounds:
          - calculations.reimbursement_balance
          - state_machines.Reimbursement.RECORDED_to_REVERSED
          - state_machines.RecruitmentFeeReview.VIOLATION_CONFIRMED_to_REIMBURSED
          - state_machines.RecruitmentFeeReview.REIMBURSED_to_VIOLATION_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity: reimbursement cents — total_reimbursement_cents MUST
          equal reimbursed_cents + outstanding_reimbursement_cents at every step;
          recording a payment (forward) and reversing it (compensating) restore the
          balance and flip the review REIMBURSED -> VIOLATION_CONFIRMED. Different
          quantity (money, not counts) than the finding-tally instance.
        test_recipe:
          setup:
            - "Supplier ACTIVE; facility US / 10 workers; audit IN_PROGRESS; review with 3 fee items of 300 BDT each (total 9 cents) confirmed -> VIOLATION_CONFIRMED, outstanding 9"
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Romeo Foods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "Y Am", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Modesto Plant", country_code: "US", worker_count: 10, processes: ["canning"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/recruitment-fee-reviews", payload: { workers_assessed: 3, fee_items: [{ worker_ref: "W1", amount_minor_units: 300, currency: "BDT" }, { worker_ref: "W2", amount_minor_units: 300, currency: "BDT" }, { worker_ref: "W3", amount_minor_units: 300, currency: "BDT" }] }, as: Auditor, as_user_id: "${aud_id}", captures: { rev_id: $.data.id, total0: $.data.total_reimbursement_cents } }
            - { call: "POST /recruitment-fee-reviews/${rev_id}/confirm-violation", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /recruitment-fee-reviews/${rev_id}/reimbursements", payload: { amount_cents: 5, worker_ref: "W1" }, as: ComplianceOfficer, captures: { reb1: $.data.id } }
            - { call: "GET /recruitment-fee-reviews/${rev_id}", payload: {}, as: ComplianceOfficer, captures: { paid1: $.data.reimbursed_cents, out1: $.data.outstanding_reimbursement_cents, st1: $.data.status } }
            - { call: "POST /recruitment-fee-reviews/${rev_id}/reimbursements", payload: { amount_cents: 4, worker_ref: "W2" }, as: ComplianceOfficer, captures: { reb2: $.data.id } }
            - { call: "GET /recruitment-fee-reviews/${rev_id}", payload: {}, as: ComplianceOfficer, captures: { paid2: $.data.reimbursed_cents, out2: $.data.outstanding_reimbursement_cents, st2: $.data.status } }
            - { call: "POST /reimbursements/${reb2}/reverse", payload: {}, as: ComplianceOfficer, captures: { reb2_status: $.data.status } }
            - { call: "GET /recruitment-fee-reviews/${rev_id}", payload: {}, as: ComplianceOfficer, captures: { paid3: $.data.reimbursed_cents, out3: $.data.outstanding_reimbursement_cents, st3: $.data.status } }
          assert:
            - "${total0} == 9 and the invariant holds at every step: 9 == ${paid1} + ${out1} (5+4), 9 == ${paid2} + ${out2} (9+0), 9 == ${paid3} + ${out3} (5+4)"
            - "${st1} == VIOLATION_CONFIRMED, ${st2} == REIMBURSED (auto-transition at outstanding 0), ${reb2_status} == REVERSED, ${st3} == VIOLATION_CONFIRMED (reversal flips it back)"
