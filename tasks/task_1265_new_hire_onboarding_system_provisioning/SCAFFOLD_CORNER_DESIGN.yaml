        as: HRAdmin
        captures:
          nh_id: $.data.id
        payload:
          full_name: NH
          personal_email: nh-x2@x.com
          start_date: '2026-05-04'
          department: Engineering
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_id: $.data.id
        payload:
          new_hire_id: ${nh_id}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          signing_bonus_cents: 10000
          relocation_stipend_cents: 2500
          benefits_tier: PLUS
      - call: GET /api/onboarding-cases/${case_id}/tasks
        as: HRAdmin
        captures:
          t1: $.data[0].id
          t2: $.data[1].id
      - call: POST /api/onboarding-tasks/${t1}/submit
        as: NewHire
        as_user_id: ${nh_id}
        payload:
          document_ref: doc://id-1
      - call: POST /api/onboarding-tasks/${t1}/review
        as: HRAdmin
        payload:
          decision: APPROVE
      - call: POST /api/onboarding-tasks/${t2}/submit
        as: NewHire
        as_user_id: ${nh_id}
        payload:
          note: signed
      - call: POST /api/onboarding-tasks/${t2}/review
        as: HRAdmin
        payload:
          decision: APPROVE
      - call: POST /api/onboarding-cases/${case_id}/submit-for-clearance
        as: HRAdmin
        as_user_id: hr-1
      - call: GET /api/onboarding-cases/${case_id}/clearance-cases
        as: HRAdmin
        captures:
          cl_id: $.data[0].id
      - call: POST /api/clearance-cases/${cl_id}/record-result
        as: HRAdmin
        payload:
          component: BACKGROUND
          result: PASSED
      - call: POST /api/clearance-cases/${cl_id}/record-result
        as: HRAdmin
        payload:
          component: REFERENCE
          result: PASSED
      - call: GET /api/onboarding-cases/${case_id}/provisioning-orders
        as: HRAdmin
        captures:
          ord_id: $.data[0].id
      - call: GET /api/provisioning-orders/${ord_id}/items
        as: HRAdmin
        captures:
          i1: $.data[0].id
          i2: $.data[1].id
      - call: POST /api/provisioning-orders/${ord_id}/submit
        as: HRAdmin
      - call: POST /api/provisioning-items/${i1}/transition
        as: ITProvisioner
        payload:
          to: IN_FULFILLMENT
      - call: POST /api/provisioning-items/${i1}/transition
        as: ITProvisioner
        payload:
          to: DONE
      - call: POST /api/provisioning-items/${i2}/transition
        as: ITProvisioner
        payload:
          to: IN_FULFILLMENT
      - call: POST /api/provisioning-items/${i2}/transition
        as: ITProvisioner
        payload:
          to: DONE
      - call: POST /api/orientation-sessions
        as: HRAdmin
        captures:
          s_id: $.data.id
        payload:
          room: R1
          starts_at: '2026-05-04T09:00:00Z'
          ends_at: '2026-05-04T12:00:00Z'
          capacity: 10
      - call: POST /api/onboarding-cases/${case_id}/orientation-booking
        as: HRAdmin
        payload:
          session_id: ${s_id}
      - call: POST /api/_clock/set_current_utc
        as: HRAdmin
        payload:
          to_iso8601: '2026-05-03T23:00:00Z'
      - call: GET /api/onboarding-cases/${case_id}
        as: HRAdmin
        captures:
          ph_pre: $.data.phase
      trigger:
      - call: POST /api/_clock/set_current_utc
        as: HRAdmin
        payload:
          to_iso8601: '2026-05-04T00:00:00Z'
      - call: GET /api/onboarding-cases/${case_id}
        as: HRAdmin
        captures:
          ph: $.data.phase
      - call: GET /api/new-hires/${nh_id}
        as: HRAdmin
        captures:
          nh_st: $.data.status
      - call: GET /api/onboarding-cases/${case_id}/surveys
        as: HRAdmin
        captures:
          sv_st: $.data[0].status
          sv_exp: $.data[0].expires_at
      assert:
      - 'before the sweep: phase == DAY_ONE_READY (clock before start_date)'
      - 'after: phase == IN_PROGRESS and NewHire.status == EMPLOYED'
      - survey created with status SENT and expires_at == 2026-05-18T00:00:00Z (sent_at + 14 days)
  - name: cascading_side_effects_covered
    claim_type: cascading_side_effects
    grounds:
    - state_machines.ClearanceCase.ESCALATED_to_REJECTED
    - state_machines.Employee.ACTIVE_to_INACTIVE
    excluded_because:
      difficulty_instance: clearance_rejection_three_link_cascade
      rationale: N-level cascades asserted by the named §1.8 instance and manager_deactivation_two_link_cascade.
  - name: dual_variant_layer_covered
    claim_type: dual_variant_calculation
    grounds:
    - calculations.time_to_productivity
    - calculations.provisioning_sla_elapsed
    excluded_because:
      difficulty_instance: ttp_estimated_forward_vs_actual_chronological
      rationale: Both dual-variant calculations asserted by the named §1.8 instances.
  - name: compensating_invariants_covered
    claim_type: derived_field_reconciliation
    grounds:
    - entities.OrientationSession.fields.booked_count
    - entities.PayrollHandoff.fields.status
    excluded_because:
      difficulty_instance: orientation_seat_count_conserved_under_book_cancel
      rationale: Derived-count invariants asserted by the named §1.8 instance and open_handoff_count_conserved_under_create_withdraw_supersede.
- section: consistency_model
  instances:
  - name: mutation_responses_reflect_final_state_immediately
    claim_type: immediate
    grounds:
    - state_machines.OnboardingCase.PRE_BOARDING_to_CLEARANCE_IN_PROGRESS
    distinguishing_aspect: 'Immediate consistency: the submit-for-clearance response itself shows phase CLEARANCE_IN_PROGRESS and a follow-up
      GET returns the same value; no read-repair or lag.'
    test_recipe:
      setup:
      - Case PRE_BOARDING with both required tasks APPROVED
      setup_api_calls:
      - call: POST /api/role-profiles
        as: HRAdmin
        captures:
          p_id: $.data.id
        payload:
          name: SE
          preboarding_tasks: *id001
          training_modules: *id002
          equipment_items: *id003
          access_grants: *id004
          probation_days: 90
          max_probation_extensions: 1
          extension_days: 30
          buddy_checkin_interval_days: 7
          buddy_checkin_count: 2
          manager_checkin_offsets_days: *id005
          provisioning_sla_hours: 48
      - call: POST /api/role-profiles/${p_id}/publish
        as: HRAdmin
      - call: POST /api/employees
        as: HRAdmin
        captures:
          mgr_id: $.data.id
        payload:
          full_name: Mgr
          email: mgr-m1@x.com
      - call: POST /api/employees
        as: HRAdmin
        captures:
          bud_id: $.data.id
        payload:
          full_name: Bud
          email: bud-m1@x.com
          manager_id: ${mgr_id}
      - call: POST /api/new-hires
        as: HRAdmin
        captures:
          nh_id: $.data.id
        payload:
          full_name: NH
          personal_email: nh-m1@x.com
          start_date: '2026-05-04'
          department: Engineering
      - call: POST /api/onboarding-cases
        as: HRAdmin
        captures:
          case_id: $.data.id
        payload:
          new_hire_id: ${nh_id}
          role_profile_id: ${p_id}
          manager_id: ${mgr_id}
          buddy_id: ${bud_id}
          start_date: '2026-05-04'
          base_salary_cents: 90000
          signing_bonus_cents: 10000
          relocation_stipend_cents: 2500
          benefits_tier: PLUS
      - call: GET /api/onboarding-cases/${case_id}/tasks
        as: HRAdmin
        captures:
          t1: $.data[0].id
          t2: $.data[1].id
      - call: POST /api/onboarding-tasks/${t1}/submit
        as: NewHire
        as_user_id: ${nh_id}
        payload:
          document_ref: doc://id-1
      - call: POST /api/onboarding-tasks/${t1}/review
        as: HRAdmin
        payload:
          decision: APPROVE
      - call: POST /api/onboarding-tasks/${t2}/submit
        as: NewHire
        as_user_id: ${nh_id}
        payload:
          note: signed
      - call: POST /api/onboarding-tasks/${t2}/review
        as: HRAdmin
        payload:
          decision: APPROVE
      trigger:
      - call: POST /api/onboarding-cases/${case_id}/submit-for-clearance
        as: HRAdmin
        as_user_id: hr-1
        captures:
          ph1: $.data.phase
      - call: GET /api/onboarding-cases/${case_id}
        as: HRAdmin
        captures:
          ph2: $.data.phase
      assert:
      - mutation response phase == CLEARANCE_IN_PROGRESS (visible in the same request)
      - subsequent GET phase == CLEARANCE_IN_PROGRESS (no drift)
