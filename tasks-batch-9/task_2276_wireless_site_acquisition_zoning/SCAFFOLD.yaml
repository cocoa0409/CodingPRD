    code: 200
    input: []
    output: StructuralAnalysis
    side_effects: ["capacity_utilization_pct = calculations.structural_capacity_utilization", "result set from the utilization thresholds", "status = COMPLETED", "PASS clears the candidate to STRUCTURALLY_CLEARED", "FAIL disqualifies the candidate, withdraws its non-terminal zoning applications, cancels that candidate's open backhaul orders and recomputes UtilityProvider.committed_crew_days and SearchRing.committed_capex_usd", "increments StructuralAnalysis.version by 1"]
  - method: POST
    path: "/modification-designs"
    description: "Creates a modification design against a completed PASS_WITH_MOD analysis."
    roles: [StructuralEngineer]
    code: 201
    input: [structural_analysis_id, scope, estimated_cost_usd, designed_by_user_id]
    output: ModificationDesign
    side_effects: ["status = DRAFT", "revision_count = 0"]
  - method: GET
    path: "/modification-designs/{id}"
    description: "Reads one modification design."
    roles: [RfEngineer, SiteAcquisitionAgent, ZoningPlanner, StructuralEngineer, EnvironmentalReviewer, ConstructionManager, ProgramDirector]
    code: 200
    input: []
    output: ModificationDesign
    side_effects: []
  - method: GET
    path: "/modification-designs"
    description: "Lists modification designs with pagination; filterable by analysis and status."
    roles: [RfEngineer, SiteAcquisitionAgent, ZoningPlanner, StructuralEngineer, EnvironmentalReviewer, ConstructionManager, ProgramDirector]
    code: 200
    input: ["structural_analysis_id?", "status?", "limit?", "offset?"]
    output: ModificationDesign[]
    side_effects: []
  - method: POST
    path: "/modification-designs/{id}/peer-review"
    description: "Drives the peer-review cycle (SUBMIT, CERTIFY, REJECT, REVISE). CERTIFY enforces segregation of duties and the ring capex budget."
    roles: [StructuralEngineer]
    code: 200
    input: [action, "rejection_reason?"]
    output: ModificationDesign
    side_effects: ["status follows the peer-review cycle", "CERTIFY stores certified_by_user_id = X-User-ID, recomputes SearchRing.committed_capex_usd (calculations.ring_committed_capex) and clears the candidate to STRUCTURALLY_CLEARED", "REVISE increments revision_count and returns to DRAFT", "increments ModificationDesign.version by 1"]

