# =============================================================================
# Task 1344: Restaurant Equipment Dealer & Kitchen Design-Build (TriMark-style)
# =============================================================================

scenario: |
  Restaurant Equipment Dealer & Kitchen Design-Build (TriMark style dealer):
  kitchen layout & equipment schedule, quote with freight/installation/startup,
  long-lead custom fabrication, permit/health-department spec compliance,
  delivery & rigging into space, startup/demo & warranty registration,
  service-agency assignment, punch list & final retainage

domain_name: restaurant-equipment-dealer
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal business name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Approved credit limit in cents (>= 0)" }
      - { name: outstanding_exposure_cents, type: integer, source: computed, description: "Read-only: sum of retainage-held plus accepted-quote net balances across non-terminal projects", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: project_name, type: string, source: input, description: "Project name (e.g., Downtown Bistro Build-Out)" }
      - { name: site_address, type: string, source: input, description: "Job site street address" }
      - { name: health_jurisdiction, type: enum, source: input, description: "Jurisdiction code: CITY_HEALTH | COUNTY_HEALTH | STATE_HEALTH" }
      - { name: quote_baseline_cents, type: integer, source: computed, description: "Read-only: accepted quote grand total frozen at acceptance; 0 until a Quote reaches ACCEPTED", default: 0 }
      - { name: retainage_pct, type: number, source: input, description: "Retainage percent withheld until punch-list closure (0 < retainage_pct <= 0.20)", default: 0.10 }
      - { name: retainage_held_cents, type: integer, source: computed, description: "Read-only: portion of quote_baseline_cents withheld until punch list closes; 0 after release", default: 0 }
      - { name: warranty_registered_count, type: integer, source: computed, description: "Read-only: count of EquipmentItems with warranty_status == REGISTERED", default: 0 }
      - { name: status, type: enum, source: system, description: "DESIGN → QUOTED → CONTRACTED → FABRICATION → DELIVERED → COMMISSIONED → PUNCH_CLOSED → COMPLETED | CANCELLED" }

  - name: KitchenLayout
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: layout_label, type: string, source: input, description: "Layout revision label (e.g., Rev-A)" }
      - { name: drawing_ref, type: string, source: input, description: "CAD drawing reference string" }
      - { name: hood_required, type: boolean, source: input, description: "Whether a Type-I hood is required by design", default: false }
      - { name: revision_no, type: integer, source: system, description: "Monotonic revision counter within the project, starts at 1" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED | SUPERSEDED" }

  - name: EquipmentItem
    parent: KitchenLayout
    common_fields: true
    fields:
      - { name: layout_id, type: string, source: system, description: "FK -> KitchenLayout.id; parent layout" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; denormalized parent project for filtered reads" }
      - { name: model_no, type: string, source: input, description: "Manufacturer model number" }
      - { name: item_kind, type: enum, source: input, description: "STOCK | CUSTOM_FABRICATION" }
      - { name: quantity, type: integer, source: input, description: "Units required (>= 1)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit sell price in cents (>= 0)" }
      - { name: lead_time_days, type: integer, source: input, description: "Manufacturer quoted lead time in days (>= 0)" }
      - { name: requires_hood, type: boolean, source: input, description: "Whether this item must sit under a hood per health code", default: false }
      - { name: warranty_status, type: enum, source: system, description: "UNREGISTERED → REGISTERED", default: "UNREGISTERED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → ORDERED → RECEIVED → INSTALLED → STARTED | CANCELLED" }

  - name: FabricationOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: equipment_item_id, type: string, source: input, description: "FK -> EquipmentItem.id; the CUSTOM_FABRICATION item being built" }
      - { name: shop_drawing_ref, type: string, source: input, description: "Fabrication shop drawing reference" }
      - { name: quoted_fab_cost_cents, type: integer, source: input, description: "Quoted fabrication cost in cents (>= 0)" }
      - { name: final_fab_cost_cents, type: integer, source: computed, description: "Read-only: reconciled fabrication cost set at FAB_COMPLETE; null until then" }
      - { name: status, type: enum, source: system, description: "PENDING_SHOP_DRAWING → SHOP_DRAWING_APPROVED → IN_PRODUCTION → FAB_COMPLETE | CANCELLED" }

  - name: Quote
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: layout_id, type: string, source: input, description: "FK -> KitchenLayout.id; layout revision this quote prices" }
      - { name: equipment_subtotal_cents, type: integer, source: computed, description: "Read-only: sum over layout items of round(quantity * unit_price_cents) — per-line half-up, then summed" }
      - { name: freight_cents, type: integer, source: computed, description: "Read-only: freight tier amount from freight_tier_calc" }
      - { name: installation_cents, type: integer, source: computed, description: "Read-only: installation charge from installation_calc" }
      - { name: startup_cents, type: integer, source: computed, description: "Read-only: startup/demo charge from startup_calc" }
      - { name: grand_total_cents, type: integer, source: computed, description: "Read-only: equipment_subtotal_cents + freight_cents + installation_cents + startup_cents" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL (priced on current layout snapshot) | FINAL (recomputed at acceptance)", default: "PROVISIONAL" }
      - { name: revision_no, type: integer, source: system, description: "Monotonic quote revision counter within project; supersedes prior revisions", default: 1 }
      - { name: status, type: enum, source: system, description: "DRAFT → PRESENTED → ACCEPTED | REJECTED | SUPERSEDED" }

  - name: PermitFiling
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: layout_id, type: string, source: input, description: "FK -> KitchenLayout.id; layout this permit package submits" }
      - { name: authority, type: enum, source: input, description: "Filing authority: HEALTH_DEPT | BUILDING_DEPT | FIRE_MARSHAL" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp when filing entered SUBMITTED" }
      - { name: review_cycle_no, type: integer, source: system, description: "Number of submission rounds; increments on each resubmission", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED | REJECTED (cyclic: REJECTED → SUBMITTED on resubmission)" }

  - name: DeliveryJob
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: scheduled_start, type: datetime, source: input, description: "Delivery window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Delivery window end; must be > scheduled_start" }
      - { name: rigging_required, type: boolean, source: input, description: "Whether rigging crew is required (crane, stair-walk, etc.)", default: false }
      - { name: rigging_crew_size, type: integer, source: input, description: "Riggers required when rigging_required=true (>= 2); ignored otherwise", default: 0 }
      - { name: status, type: enum, source: system, description: "PLANNED → DISPATCHED → SITE_COMPLETE | CANCELLED" }

  - name: StartupSession
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: equipment_item_id, type: string, source: input, description: "FK -> EquipmentItem.id; item being commissioned" }
      - { name: technician_name, type: string, source: input, description: "Factory-authorized technician performing startup" }
      - { name: demo_minutes, type: integer, source: input, description: "Operator-demo duration in minutes (>= 15 for startup to count)" }
      - { name: warranty_registered, type: boolean, source: computed, description: "Read-only: true when this session flipped the linked EquipmentItem.warranty_status to REGISTERED", default: false }
      - { name: status, type: enum, source: system, description: "SCHEDULED → COMPLETE | VOID" }

  - name: ServiceAgency
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, description: "Authorized service agency name" }
      - { name: covered_jurisdictions, type: array, source: input, description: "Array of jurisdiction codes this agency covers (CITY_HEALTH | COUNTY_HEALTH | STATE_HEALTH)" }
      - { name: capacity, type: integer, source: input, description: "Max simultaneous open assignments (>= 1)" }
      - { name: open_assignment_count, type: integer, source: computed, description: "Read-only: count of ServiceAssignments with status == OPEN", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE" }

  - name: ServiceAssignment
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: agency_id, type: string, source: input, description: "FK -> ServiceAgency.id; agency chosen by selector" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp when assignment opened" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED | TRANSFERRED" }

  - name: PunchListItem
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project" }
      - { name: description, type: string, source: input, description: "Punch item description" }
      - { name: severity, type: enum, source: input, description: "COSMETIC | FUNCTIONAL | LIFE_SAFETY" }
      - { name: status, type: enum, source: system, description: "OPEN → VERIFIED | VOID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DESIGN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DESIGN
        to: QUOTED
        trigger: "POST /design-build-projects/{id}/quotes/{quoteId}/present (first Quote reaches PRESENTED)"
        actor: SalesRep
        preconditions:
          - "Project must be in DESIGN (ERR_PROJECT_NOT_IN_DESIGN)"
          - "Quote being presented must reference an APPROVED KitchenLayout (ERR_LAYOUT_NOT_APPROVED)"
        side_effects:
          - "Project.status → QUOTED"

      - from: QUOTED
        to: CONTRACTED
        trigger: "POST /design-build-projects/{id}/quotes/{quoteId}/accept"
        actor: Customer
        preconditions:
          - "Project must be in QUOTED (ERR_PROJECT_NOT_QUOTED)"
          - "Quote must be in PRESENTED (ERR_QUOTE_NOT_PRESENTED)"
          - "Customer.status must be ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "Customer.outstanding_exposure_cents + quote.grand_total_cents <= Customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Quote variant flips PROVISIONAL → FINAL and all monetary fields recomputed at acceptance snapshot"
          - "Quote.status → ACCEPTED; all sibling Quotes on this project in DRAFT or PRESENTED → SUPERSEDED"
          - "Project.quote_baseline_cents = FINAL grand_total_cents"
          - "Project.retainage_held_cents = round_half_up(quote_baseline_cents * retainage_pct)"
          - "Project.status → CONTRACTED"
          - "Increments Project.version by 1"

      - from: CONTRACTED
        to: FABRICATION
        trigger: "system (automatic when first FabricationOrder transitions to IN_PRODUCTION)"
        actor: system
        preconditions: []
        side_effects:
          - "Project.status → FABRICATION"

      - from: FABRICATION
        to: DELIVERED
        trigger: "system (automatic when last non-CANCELLED DeliveryJob reaches SITE_COMPLETE)"
        actor: system
        preconditions:
          - "Every FabricationOrder for the project must be in FAB_COMPLETE or CANCELLED"
        side_effects:
          - "Project.status → DELIVERED"
          - "All EquipmentItems referenced by completed DeliveryJobs → INSTALLED (ledger sync on items)"

      - from: DELIVERED
        to: COMMISSIONED
        trigger: "system (automatic when every non-CANCELLED EquipmentItem has reached STARTED and warranty_status == REGISTERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Project.status → COMMISSIONED"
          - "Auto-open ServiceAssignment via service_agency_selector (see calculations)"

      - from: COMMISSIONED
        to: PUNCH_CLOSED
        trigger: "POST /design-build-projects/{id}/close-punch-list"
        actor: ProjectManager
        preconditions:
          - "Project must be in COMMISSIONED (ERR_PROJECT_NOT_COMMISSIONED)"
          - "No PunchListItem with status == OPEN and severity IN {FUNCTIONAL, LIFE_SAFETY} (ERR_OPEN_BLOCKING_PUNCH_ITEMS)"
          - "PermitFiling with authority == HEALTH_DEPT must be in APPROVED (ERR_HEALTH_PERMIT_NOT_APPROVED)"
        side_effects:
          - "Project.status → PUNCH_CLOSED"
          - "All OPEN COSMETIC PunchListItems → VOID (conditional cascade)"
          - "Project.retainage_held_cents → 0 (retainage released)"
          - "Customer.outstanding_exposure_cents debited by the released retainage amount"
          - "Increments Project.version by 1"

      - from: PUNCH_CLOSED
        to: COMPLETED
        trigger: "POST /design-build-projects/{id}/complete"
        actor: ProjectManager
        preconditions:
          - "Project must be in PUNCH_CLOSED (ERR_PROJECT_NOT_PUNCH_CLOSED)"
          - "Every ServiceAssignment must be in CLOSED or TRANSFERRED (ERR_OPEN_SERVICE_ASSIGNMENT)"
        side_effects:
          - "Project.status → COMPLETED"
          - "Customer.outstanding_exposure_cents debited by quote_baseline_cents"

      - from: DESIGN
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "Project must not be in COMPLETED (ERR_PROJECT_ALREADY_TERMINAL)"
        side_effects:
          - "All non-terminal Quotes → SUPERSEDED; non-terminal FabricationOrders → CANCELLED; non-terminal DeliveryJobs → CANCELLED; non-terminal EquipmentItems → CANCELLED; OPEN PunchListItems → VOID; OPEN ServiceAssignments → CLOSED"
          - "Project.retainage_held_cents → 0 if set"
          - "Customer.outstanding_exposure_cents reduced by this project's contribution"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Same cascade as DESIGN → CANCELLED"]

      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Same cascade as DESIGN → CANCELLED"]

      - from: FABRICATION
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Same cascade as DESIGN → CANCELLED"]

      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Same cascade as DESIGN → CANCELLED"]

      - from: COMMISSIONED
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Same cascade as DESIGN → CANCELLED"]

  - entity: KitchenLayout
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /design-build-projects/{id}/layouts/{layoutId}/submit"
        actor: KitchenDesigner
        preconditions:
          - "Layout must be in DRAFT (ERR_LAYOUT_NOT_DRAFT)"
          - "Layout must reference at least one EquipmentItem (ERR_LAYOUT_EMPTY)"
          - "If layout.hood_required == true then at least one EquipmentItem on the layout must have requires_hood == true (ERR_HOOD_SPEC_INCONSISTENT)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /design-build-projects/{id}/layouts/{layoutId}/approve"
        actor: ProjectManager
        preconditions:
          - "Layout must be in SUBMITTED (ERR_LAYOUT_NOT_SUBMITTED)"
        side_effects:
          - "All sibling KitchenLayouts on the same project in SUBMITTED or APPROVED → SUPERSEDED"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /design-build-projects/{id}/layouts/{layoutId}/return-for-revision"
        actor: ProjectManager
        preconditions:
          - "Layout must be in SUBMITTED (ERR_LAYOUT_NOT_SUBMITTED)"
        side_effects:
          - "Layout.revision_no incremented by 1 (cyclic revision loop)"

  - entity: EquipmentItem
    initial_state: SCHEDULED
    terminal_states: [STARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ORDERED
        trigger: "system (automatic when a Quote referencing this item's layout is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "For item_kind == CUSTOM_FABRICATION, a FabricationOrder is created in PENDING_SHOP_DRAWING"

      - from: ORDERED
        to: RECEIVED
        trigger: "system (automatic when linked FabricationOrder reaches FAB_COMPLETE; or immediate for STOCK items when first DeliveryJob dispatching the item is created)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: INSTALLED
        trigger: "system (automatic when a DeliveryJob covering this item reaches SITE_COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INSTALLED
        to: STARTED
        trigger: "POST /design-build-projects/{id}/startup-sessions (creates StartupSession that COMPLETEs)"
        actor: StartupTechnician
        preconditions:
          - "EquipmentItem must be in INSTALLED (ERR_ITEM_NOT_INSTALLED)"
        side_effects:
          - "EquipmentItem.status → STARTED"
          - "EquipmentItem.warranty_status → REGISTERED"
          - "Project.warranty_registered_count incremented by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from Project cancel or layout supersede)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ORDERED
        to: CANCELLED
        trigger: "system (cascade from Project cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FabricationOrder
    initial_state: PENDING_SHOP_DRAWING
    terminal_states: [FAB_COMPLETE, CANCELLED]
    transitions:
      - from: PENDING_SHOP_DRAWING
        to: SHOP_DRAWING_APPROVED
        trigger: "POST /design-build-projects/{id}/fabrication-orders/{fabId}/approve-shop-drawing"
        actor: ProjectManager
        preconditions:
          - "FabricationOrder must be in PENDING_SHOP_DRAWING (ERR_FAB_NOT_PENDING_DRAWING)"
          - "shop_drawing_ref must be non-empty (ERR_SHOP_DRAWING_MISSING)"
        side_effects: []

      - from: SHOP_DRAWING_APPROVED
        to: IN_PRODUCTION
        trigger: "POST /design-build-projects/{id}/fabrication-orders/{fabId}/start-production"
        actor: FabricationLead
        preconditions:
          - "FabricationOrder must be in SHOP_DRAWING_APPROVED (ERR_FAB_NOT_APPROVED)"
          - "Project must be in CONTRACTED or FABRICATION (ERR_PROJECT_NOT_READY_FOR_FABRICATION)"
        side_effects:
          - "If Project.status == CONTRACTED, Project transitions to FABRICATION (cascade up)"

      - from: IN_PRODUCTION
        to: FAB_COMPLETE
        trigger: "POST /design-build-projects/{id}/fabrication-orders/{fabId}/complete"
        actor: FabricationLead
        preconditions:
          - "FabricationOrder must be in IN_PRODUCTION (ERR_FAB_NOT_IN_PRODUCTION)"
        side_effects:
          - "final_fab_cost_cents reconciled per fabrication_cost_reconciliation calculation"
          - "Linked EquipmentItem.status → RECEIVED"

      - from: PENDING_SHOP_DRAWING
        to: CANCELLED
        trigger: "system (cascade from Project cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SHOP_DRAWING_APPROVED
        to: CANCELLED
        trigger: "system (cascade from Project cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "system (cascade from Project cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /design-build-projects/{id}/quotes/{quoteId}/present"
        actor: SalesRep
        preconditions:
          - "Quote must be in DRAFT (ERR_QUOTE_NOT_DRAFT)"
          - "Referenced KitchenLayout must be APPROVED (ERR_LAYOUT_NOT_APPROVED)"
          - "Project must be in DESIGN (ERR_PROJECT_NOT_IN_DESIGN)"
        side_effects:
          - "Quote pricing fields recomputed from PROVISIONAL variant formula"
          - "Project.status transitions DESIGN → QUOTED"

      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /design-build-projects/{id}/quotes/{quoteId}/accept"
        actor: Customer
        preconditions:
          - "Quote must be in PRESENTED (ERR_QUOTE_NOT_PRESENTED)"
          - "Project must be in QUOTED (ERR_PROJECT_NOT_QUOTED)"
          - "Credit check: Customer.outstanding_exposure_cents + Quote.grand_total_cents <= Customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Variant flips PROVISIONAL → FINAL and all money fields recomputed with FINAL formula"
          - "Sibling Quotes on same project → SUPERSEDED"
          - "All EquipmentItems on the referenced layout → ORDERED"
          - "For each CUSTOM_FABRICATION EquipmentItem, spawn FabricationOrder in PENDING_SHOP_DRAWING"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /design-build-projects/{id}/quotes/{quoteId}/reject"
        actor: Customer
        preconditions:
          - "Quote must be in DRAFT or PRESENTED (ERR_QUOTE_NOT_OPEN)"
        side_effects: []

      - from: PRESENTED
        to: REJECTED
        trigger: "POST /design-build-projects/{id}/quotes/{quoteId}/reject"
        actor: Customer
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (when another Quote on the same Project is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system (when another Quote on the same Project is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PermitFiling
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /design-build-projects/{id}/permit-filings/{filingId}/submit"
        actor: PermitCoordinator
        preconditions:
          - "PermitFiling must be in DRAFT (ERR_FILING_NOT_DRAFT)"
          - "Referenced KitchenLayout must be APPROVED (ERR_LAYOUT_NOT_APPROVED)"
        side_effects:
          - "review_cycle_no incremented by 1"
          - "submitted_at stamped from the logical clock"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /design-build-projects/{id}/permit-filings/{filingId}/record-decision with decision=APPROVED"
        actor: PermitCoordinator
        preconditions:
          - "PermitFiling must be in SUBMITTED (ERR_FILING_NOT_SUBMITTED)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /design-build-projects/{id}/permit-filings/{filingId}/record-decision with decision=REJECTED"
        actor: PermitCoordinator
        preconditions:
          - "PermitFiling must be in SUBMITTED (ERR_FILING_NOT_SUBMITTED)"
        side_effects: []

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /design-build-projects/{id}/permit-filings/{filingId}/resubmit"
        actor: PermitCoordinator
        preconditions:
          - "PermitFiling must be in REJECTED (ERR_FILING_NOT_REJECTED)"
          - "review_cycle_no < MAX_REVIEW_CYCLES (ERR_REVIEW_CYCLE_LIMIT_REACHED)"
        side_effects:
          - "review_cycle_no incremented by 1"
          - "submitted_at stamped from the logical clock"

  - entity: DeliveryJob
    initial_state: PLANNED
    terminal_states: [SITE_COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /design-build-projects/{id}/delivery-jobs/{jobId}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "DeliveryJob must be in PLANNED (ERR_JOB_NOT_PLANNED)"
          - "Project must be in FABRICATION or CONTRACTED with all CUSTOM_FABRICATION EquipmentItems already RECEIVED (ERR_FABRICATION_INCOMPLETE)"
          - "No overlap with another non-CANCELLED DeliveryJob on the same Project unless rigging_required differs OR windows are disjoint with a >= 2-hour buffer (ERR_DELIVERY_WINDOW_CONFLICT)"
        side_effects: []

      - from: DISPATCHED
        to: SITE_COMPLETE
        trigger: "POST /design-build-projects/{id}/delivery-jobs/{jobId}/mark-site-complete"
        actor: LogisticsCoordinator
        preconditions:
          - "DeliveryJob must be in DISPATCHED (ERR_JOB_NOT_DISPATCHED)"
        side_effects:
          - "EquipmentItems covered by this job → INSTALLED"
          - "If this was the last non-CANCELLED DeliveryJob, Project transitions FABRICATION → DELIVERED (bubble up)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/delivery-jobs/{jobId}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "DeliveryJob must be in PLANNED or DISPATCHED (ERR_JOB_NOT_CANCELLABLE)"
        side_effects: []

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /design-build-projects/{id}/delivery-jobs/{jobId}/cancel"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "EquipmentItems this job had marked RECEIVED but not yet INSTALLED remain RECEIVED"

  - entity: StartupSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, VOID]
    transitions:
      - from: SCHEDULED
        to: COMPLETE
        trigger: "POST /design-build-projects/{id}/startup-sessions/{sessionId}/complete"
        actor: StartupTechnician
        preconditions:
          - "StartupSession must be in SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
          - "Linked EquipmentItem must be in INSTALLED (ERR_ITEM_NOT_INSTALLED)"
          - "demo_minutes >= 15 (ERR_DEMO_TOO_SHORT)"
        side_effects:
          - "EquipmentItem.status INSTALLED → STARTED"
          - "EquipmentItem.warranty_status UNREGISTERED → REGISTERED; this session's warranty_registered flips true"
          - "Project.warranty_registered_count incremented"
          - "If all non-CANCELLED EquipmentItems STARTED+REGISTERED, Project transitions DELIVERED → COMMISSIONED (bubble up), which itself triggers ServiceAssignment auto-open (depth-3 cascade)"

      - from: SCHEDULED
        to: VOID
        trigger: "POST /design-build-projects/{id}/startup-sessions/{sessionId}/void"
        actor: StartupTechnician
        preconditions:
          - "StartupSession must be in SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects: []

  - entity: ServiceAssignment
    initial_state: OPEN
    terminal_states: [CLOSED, TRANSFERRED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /design-build-projects/{id}/service-assignments/{assignmentId}/close"
        actor: ServiceManager
        preconditions:
          - "ServiceAssignment must be in OPEN (ERR_ASSIGNMENT_NOT_OPEN)"
        side_effects:
          - "ServiceAgency.open_assignment_count decremented by 1"

      - from: OPEN
        to: TRANSFERRED
        trigger: "POST /design-build-projects/{id}/service-assignments/{assignmentId}/transfer"
        actor: ServiceManager
        preconditions:
          - "ServiceAssignment must be in OPEN (ERR_ASSIGNMENT_NOT_OPEN)"
          - "Target agency must be ACTIVE and have open_assignment_count < capacity (ERR_AGENCY_AT_CAPACITY)"
        side_effects:
          - "Original ServiceAgency.open_assignment_count decremented by 1"
          - "New ServiceAssignment created in OPEN referencing target agency; target agency open_assignment_count incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-project
    parent_entity: Project
    write_endpoint: "POST /design-build-projects/{id}/quotes/{quoteId}/accept"
    occ_field: "expected_project_version"
    description: |
      Accepting a Quote against a Project whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just accepted a sibling Quote (which legitimately supersedes
      the current one under the Quote state machine) and the current writer's
      view of the project is therefore stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: close-punch-stale-project
    parent_entity: Project
    write_endpoint: "POST /design-build-projects/{id}/close-punch-list"
    occ_field: "expected_project_version"
    description: |
      Closing the punch list against a Project whose version has advanced since
      the client last observed it is rejected. The retainage release mutates
      Project.retainage_held_cents and Customer.outstanding_exposure_cents;
      submitting the close with a stale version mask those deltas.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: equipment_subtotal_calc
    trigger: "Quote create, quote present, quote accept"
    algorithm: aggregation
    formula: |
      equipment_subtotal_cents = Σ over EquipmentItems of the Quote's referenced
      KitchenLayout where EquipmentItem.status != CANCELLED of:
        round_half_up(quantity * unit_price_cents)
      Rounding rule (pinned): round each line item FIRST to whole cents using
      round_half_up, THEN sum the per-line cents. Do NOT sum the raw products
      and round once at the end; the two orders produce different cents when
      unit_price_cents * quantity is non-integral across lines.
    input_set: "EquipmentItems on the referenced KitchenLayout with status != CANCELLED"
    precision: "0 decimal places (integer cents), per-line round_half_up then sum"

  - name: freight_tier_calc
    trigger: "Quote create, quote present, quote accept (after equipment_subtotal_calc)"
    algorithm: tiered_pricing
    formula: |
      Inputs: equipment_subtotal_cents (S), project.health_jurisdiction, item composition.
      Constants:
        TIER_1_CEILING_CENTS: 5000000   # $50,000
        TIER_2_CEILING_CENTS: 25000000  # $250,000
        TIER_1_RATE: 0.06
        TIER_2_RATE: 0.045
        TIER_3_RATE: 0.03
        CUSTOM_FAB_SURCHARGE_CENTS: 150000  # flat $1,500 when any CUSTOM_FABRICATION line exists
      If S <= TIER_1_CEILING_CENTS:        base = round_half_up(S * TIER_1_RATE)
      elif S <= TIER_2_CEILING_CENTS:      base = round_half_up(TIER_1_CEILING_CENTS * TIER_1_RATE + (S - TIER_1_CEILING_CENTS) * TIER_2_RATE)
      else:                                base = round_half_up(TIER_1_CEILING_CENTS * TIER_1_RATE + (TIER_2_CEILING_CENTS - TIER_1_CEILING_CENTS) * TIER_2_RATE + (S - TIER_2_CEILING_CENTS) * TIER_3_RATE)
      If any EquipmentItem on the layout has item_kind == CUSTOM_FABRICATION and status != CANCELLED:
        freight_cents = base + CUSTOM_FAB_SURCHARGE_CENTS
      else:
        freight_cents = base
      Boundary: rates are inclusive at the lower bound and exclusive at the upper bound of each tier
      (S == TIER_1_CEILING_CENTS exactly is charged entirely at TIER_1_RATE).
    input_set: "Project's referenced approved KitchenLayout; EquipmentItems with status != CANCELLED"
    constants:
      TIER_1_CEILING_CENTS: 5000000
      TIER_2_CEILING_CENTS: 25000000
      TIER_1_RATE: 0.06
      TIER_2_RATE: 0.045
      TIER_3_RATE: 0.03
      CUSTOM_FAB_SURCHARGE_CENTS: 150000
    precision: "0 decimal places (integer cents), round_half_up applied once on the marginal-tier sum, surcharge added after rounding"
    variants:
      - name: PROVISIONAL
        when: "Quote.variant == PROVISIONAL (created and presented)"
        difference: "Rates read off the layout snapshot at Quote creation time; does not re-read current EquipmentItem prices"
      - name: FINAL
        when: "Quote.variant == FINAL (at acceptance)"
        difference: "Rates recomputed against current EquipmentItem.unit_price_cents and item_kind as of the accept call"

  - name: installation_calc
    trigger: "Quote create, quote present, quote accept (after equipment_subtotal_calc)"
    algorithm: threshold
    formula: |
      Inputs: count of EquipmentItems with requires_hood == true and status != CANCELLED (H),
              total quantity of EquipmentItems (Q), project.health_jurisdiction.
      Constants:
        BASE_INSTALL_CENTS: 250000        # $2,500
        PER_ITEM_CENTS: 45000             # $450 per unit
        HOOD_PREMIUM_CENTS: 120000        # $1,200 per hood-requiring item
        COUNTY_UPLIFT_PCT: 0.10           # 10% uplift when health_jurisdiction == COUNTY_HEALTH
      base = BASE_INSTALL_CENTS + (Q * PER_ITEM_CENTS) + (H * HOOD_PREMIUM_CENTS)
      if project.health_jurisdiction == COUNTY_HEALTH:
        installation_cents = round_half_up(base * (1 + COUNTY_UPLIFT_PCT))
      else:
        installation_cents = base
      Boundary: the uplift applies only when jurisdiction is exactly COUNTY_HEALTH;
      CITY_HEALTH and STATE_HEALTH do not receive it (>= vs > distinction on jurisdiction equality).
    input_set: "EquipmentItems on the referenced KitchenLayout with status != CANCELLED"
    constants:
      BASE_INSTALL_CENTS: 250000
      PER_ITEM_CENTS: 45000
      HOOD_PREMIUM_CENTS: 120000
      COUNTY_UPLIFT_PCT: 0.10
    precision: "0 decimal places, round_half_up applied once after jurisdiction uplift"
    variants:
      - name: PROVISIONAL
        when: "Quote.variant == PROVISIONAL"
        difference: "Uses layout snapshot at Quote creation"
      - name: FINAL
        when: "Quote.variant == FINAL"
        difference: "Recomputes against current EquipmentItem state at accept"

  - name: startup_calc
    trigger: "Quote create, quote present, quote accept"
    algorithm: aggregation
    formula: |
      Inputs: count of non-CANCELLED EquipmentItems on the layout (N), project.health_jurisdiction.
      Constants:
        STARTUP_BASE_CENTS: 180000    # $1,800 per project
        STARTUP_PER_ITEM_CENTS: 30000 # $300 per item
      startup_cents = STARTUP_BASE_CENTS + (N * STARTUP_PER_ITEM_CENTS)
    input_set: "EquipmentItems on the referenced KitchenLayout with status != CANCELLED"
    constants:
      STARTUP_BASE_CENTS: 180000
      STARTUP_PER_ITEM_CENTS: 30000
    precision: "0 decimal places, no rounding needed (integer multiplication)"
    variants:
      - name: PROVISIONAL
        when: "Quote.variant == PROVISIONAL"
        difference: "Uses layout snapshot"
      - name: FINAL
        when: "Quote.variant == FINAL"
        difference: "Recomputes N at accept time"

  - name: fabrication_cost_reconciliation
    trigger: "FabricationOrder transitions IN_PRODUCTION → FAB_COMPLETE"
    algorithm: waterfall_allocation
    formula: |
      Inputs: quoted_fab_cost_cents (Q), linked EquipmentItem's lead_time_days (L),
              actual calendar days elapsed between SHOP_DRAWING_APPROVED and FAB_COMPLETE (D).
      Constants:
        SCHEDULE_ALLOWANCE_DAYS: 30
        OVERTIME_PENALTY_RATE: 0.04       # 4% of Q per day past allowance
        MAX_OVERTIME_PENALTY_PCT: 0.40    # cap at 40% of Q
      over = max(0, D - (L + SCHEDULE_ALLOWANCE_DAYS))
      raw_penalty = Q * OVERTIME_PENALTY_RATE * over
      penalty = min(raw_penalty, Q * MAX_OVERTIME_PENALTY_PCT)
      final_fab_cost_cents = round_half_up(Q + penalty)
      The cap applies AFTER the per-day accrual; rounding applies once at the end.
      Evaluation order (pinned): compute over → compute raw_penalty → apply cap → add Q → round.
    input_set: "The FabricationOrder being completed; its linked EquipmentItem"
    constants:
      SCHEDULE_ALLOWANCE_DAYS: 30
      OVERTIME_PENALTY_RATE: 0.04
      MAX_OVERTIME_PENALTY_PCT: 0.40
    precision: "0 decimal places, round_half_up after the cap"

  - name: service_agency_selector
    trigger: "Project transitions DELIVERED → COMMISSIONED"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter: ServiceAgency.status == ACTIVE AND
                          project.health_jurisdiction IN agency.covered_jurisdictions AND
                          agency.open_assignment_count < agency.capacity
      Ranking expression: open_assignment_count ASC (least loaded first)
      Tie-break: agency.created_at ASC (oldest first); never use id
      Fallback: if the candidate set is empty, the Project remains in DELIVERED
      and the bubble-up to COMMISSIONED is deferred until a qualifying agency
      becomes available; no error is raised.
      On selection: create ServiceAssignment(status=OPEN, agency_id=winner);
      increment winner.open_assignment_count by 1.
    input_set: "All ServiceAgency rows"
    precision: "n/a (selection, not arithmetic)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be authorized for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-template id must resolve to an existing resource, validated left-to-right"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_LAYOUT_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: state
    check: "Target resource must be in a state that permits this transition"
    error_id: "ERR_PROJECT_NOT_IN_DESIGN | ERR_PROJECT_NOT_QUOTED | ERR_PROJECT_NOT_COMMISSIONED | ERR_PROJECT_NOT_PUNCH_CLOSED | ERR_LAYOUT_NOT_DRAFT | ERR_LAYOUT_NOT_SUBMITTED | ERR_LAYOUT_NOT_APPROVED | ERR_QUOTE_NOT_DRAFT | ERR_QUOTE_NOT_PRESENTED | ERR_FILING_NOT_DRAFT | ERR_FILING_NOT_SUBMITTED | ERR_FILING_NOT_REJECTED | ERR_JOB_NOT_PLANNED | ERR_JOB_NOT_DISPATCHED | ERR_JOB_NOT_CANCELLABLE | ERR_SESSION_NOT_SCHEDULED | ERR_ITEM_NOT_INSTALLED | ERR_FAB_NOT_PENDING_DRAWING | ERR_FAB_NOT_APPROVED | ERR_FAB_NOT_IN_PRODUCTION | ERR_ASSIGNMENT_NOT_OPEN | ERR_PROJECT_ALREADY_TERMINAL | ERR_PROJECT_NOT_READY_FOR_FABRICATION"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Permit/health compliance: hood_required layouts must include at least one requires_hood EquipmentItem; HEALTH_DEPT PermitFiling must be APPROVED before punch close"
    error_id: "ERR_HOOD_SPEC_INCONSISTENT | ERR_HEALTH_PERMIT_NOT_APPROVED"
    http_status: 422
    applies_to: "layout submit; project close-punch-list"

  - priority: 6
    category: business_constraint
    check: "Structural constraints: layout must contain at least one item; review_cycle_no < MAX_REVIEW_CYCLES; demo_minutes >= 15; scheduled_end > scheduled_start; no delivery-window overlap on same project with same rigging_required and < 2h buffer"
    error_id: "ERR_LAYOUT_EMPTY | ERR_REVIEW_CYCLE_LIMIT_REACHED | ERR_DEMO_TOO_SHORT | ERR_INVALID_JOB_WINDOW | ERR_DELIVERY_WINDOW_CONFLICT"
    http_status: 422
    applies_to: "layout submit, filing resubmit, startup complete, delivery create/dispatch"

  - priority: 7
    category: business_referential
    check: "Referential integrity: every FK (customer_id, layout_id, equipment_item_id, agency_id) must resolve to a live record; CUSTOM_FABRICATION items must have a FabricationOrder before DELIVERED"
    error_id: "ERR_FABRICATION_INCOMPLETE"
    http_status: 422
    applies_to: "delivery dispatch, startup session create"

  - priority: 8
    category: business_fiscal
    check: "Fiscal guardrails: Customer.status must be ACTIVE and outstanding_exposure_cents + new grand_total_cents <= credit_limit_cents at quote accept; ServiceAgency.open_assignment_count < capacity at assignment open/transfer"
    error_id: "ERR_CUSTOMER_SUSPENDED | ERR_CREDIT_LIMIT_EXCEEDED | ERR_AGENCY_AT_CAPACITY"
    http_status: 402
    applies_to: "quote accept, service assignment open/transfer"

  - priority: 9
    category: state
    check: "OCC: expected_project_version must equal the current Project.version on endpoints that declare the field"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "quote accept, close-punch-list"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving / platform ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: advance the server's logical clock. Default time before any call is 2026-08-01T00:00:00Z; never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock updated; subsequent created_at/updated_at/submitted_at stamps use the new time"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, contact_email, credit_limit_cents]
    output: Customer
    side_effects: ["status = ACTIVE; outstanding_exposure_cents = 0"]

  - method: GET
    path: "/customers"
    description: "List Customers"
    roles: [PlatformAdmin, ProjectManager, SalesRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a Customer"
    roles: [PlatformAdmin, ProjectManager, SalesRep, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{customerId}/suspend"
    description: "Suspend a Customer (blocks quote acceptance)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → SUSPENDED"]

  # --- Project ---
  - method: POST
    path: "/design-build-projects"
    description: "Create a Project"
    roles: [ProjectManager]
    code: 201
    input: [customer_id, project_name, site_address, health_jurisdiction, "retainage_pct?"]
    output: Project
    side_effects: ["status = DESIGN; quote_baseline_cents = 0; retainage_held_cents = 0"]

  - method: GET
    path: "/design-build-projects"
    description: "List Projects"
    roles: [PlatformAdmin, ProjectManager, SalesRep, KitchenDesigner, Customer]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "status?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/design-build-projects/{id}"
    description: "Get a Project"
    roles: [PlatformAdmin, ProjectManager, SalesRep, KitchenDesigner, Customer, PermitCoordinator, LogisticsCoordinator, FabricationLead, StartupTechnician, ServiceManager]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/design-build-projects/{id}/cancel"
    description: "Cancel a Project and cascade to children"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["All non-terminal children → terminal CANCELLED/SUPERSEDED/VOID/CLOSED per Project state machine"]

  - method: POST
    path: "/design-build-projects/{id}/close-punch-list"
    description: "Close the punch list, void OPEN COSMETIC items, release retainage"
    roles: [ProjectManager]
    code: 200
    input: [expected_project_version]
    output: Project
    side_effects:
      - "status → PUNCH_CLOSED"
      - "OPEN COSMETIC PunchListItems → VOID"
      - "retainage_held_cents → 0; Customer.outstanding_exposure_cents debited"
      - "Increments Project.version by 1"

  - method: POST
    path: "/design-build-projects/{id}/complete"
    description: "Mark Project COMPLETED"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status → COMPLETED; Customer.outstanding_exposure_cents debited by quote_baseline_cents"]

  # --- KitchenLayout ---
  - method: POST
    path: "/design-build-projects/{id}/layouts"
    description: "Create a KitchenLayout"
    roles: [KitchenDesigner]
    code: 201
    input: [layout_label, drawing_ref, "hood_required?"]
    output: KitchenLayout
    side_effects: ["status = DRAFT; revision_no = 1"]

  - method: GET
    path: "/design-build-projects/{id}/layouts"
    description: "List KitchenLayouts for a Project"
    roles: [PlatformAdmin, ProjectManager, SalesRep, KitchenDesigner, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "KitchenLayout[]"
    side_effects: []

  - method: GET
    path: "/design-build-projects/{id}/layouts/{layoutId}"
    description: "Get a KitchenLayout"
    roles: [PlatformAdmin, ProjectManager, SalesRep, KitchenDesigner, Customer]
    code: 200
    input: []
    output: KitchenLayout
    side_effects: []

  - method: POST
    path: "/design-build-projects/{id}/layouts/{layoutId}/submit"
    description: "Submit a layout for review"
    roles: [KitchenDesigner]
    code: 200
    input: []
    output: KitchenLayout
    side_effects: ["status → SUBMITTED (if validations pass)"]

  - method: POST
    path: "/design-build-projects/{id}/layouts/{layoutId}/approve"
    description: "Approve a layout; supersedes siblings"
    roles: [ProjectManager]
    code: 200
    input: []
    output: KitchenLayout
    side_effects: ["status → APPROVED; siblings → SUPERSEDED"]

  - method: POST
    path: "/design-build-projects/{id}/layouts/{layoutId}/return-for-revision"
    description: "Return a SUBMITTED layout to DRAFT (revision loop)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: KitchenLayout
    side_effects: ["status → DRAFT; revision_no incremented by 1"]

  # --- EquipmentItem ---
  - method: POST
    path: "/design-build-projects/{id}/layouts/{layoutId}/equipment-items"
    description: "Add an EquipmentItem to a layout"
    roles: [KitchenDesigner, SalesRep]
    code: 201
    input: [model_no, item_kind, quantity, unit_price_cents, lead_time_days, "requires_hood?"]
    output: EquipmentItem
    side_effects: ["status = SCHEDULED; warranty_status = UNREGISTERED; layout_id and project_id denormalized"]

  - method: GET
    path: "/design-build-projects/{id}/layouts/{layoutId}/equipment-items"
    description: "List EquipmentItems on a layout"
    roles: [PlatformAdmin, ProjectManager, SalesRep, KitchenDesigner, Customer, FabricationLead, StartupTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "item_kind?"]
    output: "EquipmentItem[]"
    side_effects: []

  - method: GET
    path: "/design-build-projects/{id}/equipment-items"
    description: "List EquipmentItems across all layouts of a project (filtered-list form)"
    roles: [PlatformAdmin, ProjectManager, SalesRep, KitchenDesigner, Customer, FabricationLead, StartupTechnician]
    code: 200
    input: ["limit?", "offset?", "layout_id?", "status?"]
    output: "EquipmentItem[]"
    side_effects: []

  - method: GET
    path: "/design-build-projects/{id}/equipment-items/{itemId}"
    description: "Get an EquipmentItem"
    roles: [PlatformAdmin, ProjectManager, SalesRep, KitchenDesigner, Customer, FabricationLead, StartupTechnician]
    code: 200
    input: []
    output: EquipmentItem
    side_effects: []

  # --- Quote ---
  - method: POST
    path: "/design-build-projects/{id}/quotes"
    description: "Create a Quote (PROVISIONAL) against an APPROVED layout"
    roles: [SalesRep]
    code: 201
    input: [layout_id]
    output: Quote
    side_effects: ["Computes equipment_subtotal/freight/installation/startup/grand_total with PROVISIONAL variant; variant = PROVISIONAL; revision_no assigned"]

  - method: GET
    path: "/design-build-projects/{id}/quotes"
    description: "List Quotes on a Project"
    roles: [PlatformAdmin, ProjectManager, SalesRep, Customer]
    code: 200
    input: ["limit?", "offset?", "status?", "variant?"]
    output: "Quote[]"
    side_effects: []

  - method: GET
    path: "/design-build-projects/{id}/quotes/{quoteId}"
    description: "Get a Quote"
    roles: [PlatformAdmin, ProjectManager, SalesRep, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/design-build-projects/{id}/quotes/{quoteId}/present"
    description: "Present a Quote to the Customer"
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects: ["status → PRESENTED; Project DESIGN → QUOTED"]

  - method: POST
    path: "/design-build-projects/{id}/quotes/{quoteId}/accept"
    description: "Customer accepts a Quote (OCC on Project.version)"
    roles: [Customer]
    code: 200
    input: [expected_project_version]
    output: Quote
    side_effects:
      - "Recompute money fields with FINAL variant"
      - "Quote → ACCEPTED; sibling Quotes → SUPERSEDED"
      - "Project QUOTED → CONTRACTED; quote_baseline_cents set; retainage_held_cents computed"
      - "EquipmentItems on layout → ORDERED; CUSTOM_FABRICATION items spawn FabricationOrder"
      - "Increments Project.version by 1"

  - method: POST
    path: "/design-build-projects/{id}/quotes/{quoteId}/reject"
    description: "Customer rejects a Quote"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["status → REJECTED"]

