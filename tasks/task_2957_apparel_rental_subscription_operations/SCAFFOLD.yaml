    side_effects: ["reservation IN_POSSESSION -> RETURN_INITIATED", "unit OUT -> INBOUND", "INBOUND Shipment created in CREATED", "planned_ship_date defaults to the current logical clock date"]
  - method: POST
    path: "/reservations/{reservation_id}/fit-feedback"
