              payload: { company_name: "Southline Installers", certification_level: "MASTER", certified_categories: ["POST", "DECK", "PLASTIC_SLIDE"], crew_capacity_per_day: 6, certification_expires_on: "2030-12-31", region_code: "SL" }
              as: ManufacturerAdmin
