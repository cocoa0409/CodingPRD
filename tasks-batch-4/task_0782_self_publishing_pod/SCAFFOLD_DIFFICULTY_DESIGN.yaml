      - name: statement_issue_empty_sales_set_boundary
        grounds:
          - validations[priority=6]
          - errors[ERR_NO_SALES_IN_PERIOD]
          - state_machines.RoyaltyStatement.ACCRUING_to_ISSUED
        distinguishing_aspect: "A different metric on a different endpoint: the swept-sales COUNT is exactly 0 at POST /royalty-statements/{id}/issue (period ended so temporal passes), so ERR_NO_SALES_IN_PERIOD fires — an empty-collection edge, not a numeric threshold."
