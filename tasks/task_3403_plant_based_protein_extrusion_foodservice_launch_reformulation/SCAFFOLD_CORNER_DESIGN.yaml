      - name: cn_val_fefo_violation_then_earliest_first
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FEFO_VIOLATION]"
          - "entities.FinishedGoodsBatch.fields.expiry_date"
        distinguishing_aspect: "FEFO rotation: reserving the LATER-expiring batch while an earlier-expiring batch of the same product+channel still has availability is a 409; after the earliest is fully reserved the later one reserves cleanly."
        test_recipe:
          setup:
            - "Canonical chain. Two non-dedicated FOODSERVICE runs complete: batch B1 produced at clock 2026-09-01 (expiry 2026-10-16) and batch B2 produced at clock 2026-09-03 (expiry 2026-10-18), 10 cases each."
            - "LTO program PROG-K-32 (partner CHAIN-K32, window 2026-09-01..2026-10-31, committed 10) ACTIVE."
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "FOODSERVICE", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run1: $.data.id }
            - call: "POST /protein-ops/production-runs/${run1}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run1}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
            - call: "POST /protein-ops/production-lines/${line_id}/operational-transitions"
              payload: { target_status: "IDLE" }
              as: PlantManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_v2: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "FOODSERVICE", planned_quantity_kg: 100, scheduled_start: "2026-09-06T08:00:00Z", scheduled_end: "2026-09-06T12:00:00Z", expected_line_version: "${line_v2}" }
              as: PlantManager
              captures: { run2: $.data.id }
            - call: "POST /protein-ops/production-runs/${run2}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run2}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
            - call: "GET /protein-ops/finished-goods-batches"
              payload: { production_run_id: "${run1}" }
              as: ChannelManager
              captures: { b1: "$.data[0].id" }
            - call: "GET /protein-ops/finished-goods-batches"
              payload: { production_run_id: "${run2}" }
              as: ChannelManager
              captures: { b2: "$.data[0].id" }
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-32", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K32", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 10, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/finished-goods-batches/${b2}/reserve"
              payload: { program_id: "${prog_id}", quantity_cases: 5 }
              as: ChannelManager
              captures: { err: $.data.error_id }
            - call: "POST /protein-ops/finished-goods-batches/${b1}/reserve"
              payload: { program_id: "${prog_id}", quantity_cases: 10 }
              as: ChannelManager
            - call: "POST /protein-ops/finished-goods-batches/${b2}/reserve"
              payload: { program_id: "${prog_id}", quantity_cases: 5 }
              as: ChannelManager
          assert:
            - "first reserve on B2 fails 409 ERR_FEFO_VIOLATION (B1 expires 2026-10-16 < 2026-10-18 and still has 10 available)"
            - "reserving all 10 of B1 succeeds"
            - "afterwards reserving 5 of B2 succeeds (B1 available_cases == 0, so B2 is next in FEFO order)"
            - "FinishedGoodsBatch.${b2}.reserved_cases == 5 and reserved_for_program_id == ${prog_id}"

      - name: cn_val_batch_already_reserved_other_program
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BATCH_ALREADY_RESERVED]"
        distinguishing_aspect: "A batch holds reservations for exactly one program at a time: once PROG-A holds 4 cases, reserving to PROG-B fails 409 even though availability remains."
        test_recipe:
          setup: ["Canonical FOODSERVICE batch of 10 cases; LTO programs PROG-K-A (partner CHAIN-KA) and PROG-K-B (partner CHAIN-KB) both ACTIVE; 4 cases already reserved to PROG-K-A."]
