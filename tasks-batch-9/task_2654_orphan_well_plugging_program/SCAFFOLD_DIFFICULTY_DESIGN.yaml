              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_v: $.data.version }
            - call: "POST /wells/${w_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_id: $.data.id }
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-11077", bond_amount_cents: 2500000, performance_score: 89 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "single orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c_id}", cement_per_sack_cents: 4137, rig_day_rate_cents: 849999, casing_per_ft_cents: 1213, mobilization_fee_cents: 2499999, technical_score: 92 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bid_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bid_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
              as: AwardAuthority
              as_user_id: "u_award"
              captures: { contract_id: $.data.id }
            - call: "POST /plugging-jobs"
              payload: { well_id: "${w_id}", contract_id: "${contract_id}", scheduled_start: "2026-09-01T00:00:00Z", planned_cement_sacks: 100, planned_rig_days: 3, planned_casing_ft: 500 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { job_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "FORFEITED_BOND", name: "Forfeited bond - Powder River Orphans", authorized_cents: 1000000, expires_at: "2027-12-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"], bond_operator_id: "${op_id}" }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_bond_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "FEDERAL_GRANT", name: "IIJA orphan well formula grant FY26", authorized_cents: 10000000, expires_at: "2027-06-30T00:00:00Z", allowable_cost_categories: ["PLUGGING"], federal_match_required_pct: 40 }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_fed_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Wyoming orphan well account", authorized_cents: 10000000, expires_at: "2027-12-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_state_id: $.data.id }
            - call: "POST /plugging-jobs/${job_id}/funding-commitments"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { alloc_bond_id: "$.data[0].id", alloc_fed_id: "$.data[1].id", alloc_state_id: "$.data[2].id" }
          trigger:
            - call: "POST /funding-allocations/${alloc_bond_id}/transitions"
              payload: { action: "DEOBLIGATE" }
              as: FundingOfficer
              as_user_id: "u_fund1"
          assert:
            - "before the trigger FundingSource.${fs_bond_id}.committed_cents == 1000000 and status == EXHAUSTED"
            - "FundingAllocation.${alloc_bond_id}.status == DEOBLIGATED and deobligated_at == 2026-08-01T00:00:00Z"
            - "FundingSource.${fs_bond_id}.committed_cents == 0 (exactly its pre-commitment value) and status == ACTIVE"
            - "FundingSource.${fs_fed_id}.committed_cents == 1500000 and FundingSource.${fs_state_id}.committed_cents == 3570196 (untouched)"
            - "FundingAllocation.${alloc_fed_id}.status == COMMITTED and FundingAllocation.${alloc_state_id}.status == COMMITTED"
            - "PluggingJob.${job_id}.funded_cents == 5070196"
            - "invariant: FundingSource.${fs_bond_id}.committed_cents + FundingSource.${fs_fed_id}.committed_cents + FundingSource.${fs_state_id}.committed_cents == 5070196 == the sum of allocated_cents over the job's non-DEOBLIGATED allocations"
            - "FundingSource.${fs_bond_id}.disbursed_cents == 0 (deobligation is not a payment)"
      - name: voiding_a_transfer_restores_both_operators_assurance_aggregates
        grounds:
          - state_machines.WellTransfer.PENDING_to_APPROVED
          - state_machines.WellTransfer.APPROVED_to_VOIDED
          - calculations.operator_financial_assurance_requirement
          - entities.Operator.fields.active_well_count
          - entities.WellTransfer.fields.transferee_required_bond_cents
        distinguishing_aspect: |
          Approving the transfer of the 8000 ft well moves 1000000 cents of capped exposure from O1 to
          O2 (O1 required 1250000 -> 250000, O2 250000 -> 1250000); VOIDing it restores both operators
          to exactly 1250000 and 250000 with active_well_count 2 and 1, and the cross-operator
          invariant O1.active_well_count + O2.active_well_count == 3 holds at every step - a
          well-population conservation law rather than a cents conservation law.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "Operator O1 tier INDIVIDUAL with bond_amount_cents 1250000, holding a 2500 ft well and an 8000 ft well: required_bond_cents 1250000, active_well_count 2, status ACTIVE"
            - "Operator O2 tier INDIVIDUAL with bond_amount_cents 2000000, holding one 2500 ft well: required_bond_cents 250000, active_well_count 1, status ACTIVE"
            - "one PENDING WellTransfer of the 8000 ft well from O1 to O2"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Uinta Basin Legacy", region_code: "UT", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 1250000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { o1_id: $.data.id }
            - call: "POST /operators"
              payload: { name: "Wasatch Acquisition Co", region_code: "UT", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { o2_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "43-001-01500", operator_id: "${o1_id}", spud_year: 1981, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 50, groundwater_depth_ft: 600, population_within_1000ft: 1, surface_disturbance_acres: 0.5 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_shallow_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "43-001-01501", operator_id: "${o1_id}", spud_year: 1969, total_depth_ft: 8000, casing_strings: 3, methane_scfd: 310, groundwater_depth_ft: 180, population_within_1000ft: 3, surface_disturbance_acres: 1.25 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_deep_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "43-001-01502", operator_id: "${o2_id}", spud_year: 1985, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 50, groundwater_depth_ft: 600, population_within_1000ft: 1, surface_disturbance_acres: 0.5 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_o2_id: $.data.id }
            - call: "POST /wells/${w_deep_id}/transfers"
              payload: { to_operator_id: "${o2_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /well-transfers/${tr_id}/decision"
              payload: { action: "APPROVE", rationale: "transferee assurance verified" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /well-transfers/${tr_id}/decision"
              payload: { action: "VOID", rationale: "title defect discovered in the assignment" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "WellTransfer.${tr_id}.from_operator_id == ${o1_id}, to_operator_id == ${o2_id}, transferee_required_bond_cents == 1250000"
            - "after APPROVE: Well.${w_deep_id}.operator_id == ${o2_id}; Operator.${o1_id}.required_bond_cents == 250000 and active_well_count == 1; Operator.${o2_id}.required_bond_cents == 1250000 and active_well_count == 2; both ACTIVE"
            - "after APPROVE: WellTransfer.${tr_id}.status == APPROVED and approved_at == 2026-08-01T00:00:00Z"
            - "after VOID: Well.${w_deep_id}.operator_id == ${o1_id}; Operator.${o1_id}.required_bond_cents == 1250000 and active_well_count == 2 and status == ACTIVE; Operator.${o2_id}.required_bond_cents == 250000 and active_well_count == 1 and status == ACTIVE"
            - "after VOID: WellTransfer.${tr_id}.status == VOIDED, voided_at == 2026-08-01T00:00:00Z, void_reason == 'title defect discovered in the assignment'"
            - "invariant at every step: Operator.${o1_id}.active_well_count + Operator.${o2_id}.active_well_count == 3"
            - "Well.${w_shallow_id}.operator_id == ${o1_id} and Well.${w_o2_id}.operator_id == ${o2_id} throughout"
