  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (FabOrder<->DrillProgram; FabOrder<->ImpedanceCoupon)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_requires_drill_approved
        grounds:
          - state_machines.FabOrder.AWAITING_LAMINATE_to_RELEASED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair FabOrder -> DrillProgram: release is rejected while the
          order's drill program is UNDER_REVIEW (ERR_DRILL_NOT_APPROVED) and succeeds
          once that other entity reaches APPROVED — the order's transition set is
          gated by the drill program's state.
        test_recipe:
          setup:
            - "Order AWAITING_LAMINATE with RELEASED array and 34 RESERVED panels; drill program sitting in UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Nu Circuits", contact_email: "ops@nu.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-N1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner, captures: { rel: $.data.fab_status } }
          assert:
            - "first release rejected: error_id == ERR_DRILL_NOT_APPROVED while DrillProgram.${drl}.status == UNDER_REVIEW"
            - "after approve, second release succeeds: FabOrder.${ord}.fab_status == RELEASED"
      - name: complete_fab_requires_coupons_passed
        grounds:
          - state_machines.FabOrder.IN_PRODUCTION_to_AWAITING_ETEST
          - validations[priority=13]
        distinguishing_aspect: |
          Entity pair FabOrder -> ImpedanceCoupon (different pair than the drill
          instance): complete-fab is rejected with ERR_COUPON_NOT_PASSED while the
          order's coupon is FAILED, and the order stays IN_PRODUCTION.
        test_recipe:
          setup:
            - "Order IN_PRODUCTION (1 coupon_required SINGLE_ENDED line); coupon measured 60.0 -> FAILED (retest_count 0)"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Xi Circuits", contact_email: "ops@xi.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: true }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L1", target_ohms: 50.0, tolerance_plus_ohms: 5.0, tolerance_minus_ohms: 5.0, line_type: "SINGLE_ENDED", coupon_required: true }, as: CAMOperator, captures: { line: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-X1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/coupons", payload: { spec_line_id: "${line}", panel_ref: "P01" }, as: QualityInspector, captures: { cpn: $.data.id } }
            - { call: "POST /pcb/lab-slot-bookings", payload: { coupon_id: "${cpn}", station: "MICROSECTION_A", starts_at: "2026-07-31T23:30:00Z", ends_at: "2026-08-01T00:30:00Z" }, as: QualityInspector, captures: { bk: $.data.id } }
            - { call: "POST /pcb/coupons/${cpn}/measurements", payload: { measured_ohms: 60.0, lab_slot_booking_id: "${bk}" }, as: QualityInspector }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/complete-fab", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COUPON_NOT_PASSED while ImpedanceCoupon.${cpn}.status == FAILED"
            - "GET FabOrder.${ord}.fab_status == IN_PRODUCTION (unchanged)"

