    instances:
      - name: staff_window_buffer_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_STAFF_DOUBLE_BOOKED]
          - entities.CleanRequest.fields.planned_start_at
        distinguishing_aspect: |
          Pairwise-buffer interval semantics on resource StaffMember: a new
          planned window must clear every existing ASSIGNED/IN_PROGRESS window
          by a symmetric 10-minute buffer — 5-minute gap rejected
          (ERR_STAFF_DOUBLE_BOOKED), exactly-10-minute gap accepted (the
          buffer is strict <, so equality passes).
        test_recipe:
          setup:
            - "Unit U, standards, supplies, beds B1+B2, tech T1 (CLEAN)"
            - "ROUTINE request R1 assigned to T1 with planned window [09:00, 09:45)"
            - "ROUTINE request R2 (bed B2) QUEUED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
              payload: { unit_code: "U1", display_name: "Unit One" }
              as: EVSAdministrator
              captures: { u1: $.data.id }
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ROUTINE", base_minutes: 45, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 250 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "ISOLATION", base_minutes: 60, outbreak_multiplier_bps: 15000, atp_rlu_threshold: 150 }
              as: EVSAdministrator
            - call: "POST /evs/clean-standards"
              payload: { clean_type: "TERMINAL", base_minutes: 90, outbreak_multiplier_bps: 20000, atp_rlu_threshold: 100 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "DISINFECTANT", display_name: "Disinfectant", initial_on_hand: 100, reorder_threshold: 10 }
              as: EVSAdministrator
            - call: "POST /evs/supply-items"
              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B1", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b1: $.data.id }
            - call: "POST /evs/beds"
              payload: { unit_id: "${u1}", bed_code: "B2", bed_kind: "STANDARD" }
              as: EVSAdministrator
              captures: { b2: $.data.id }
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b1}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r1: $.data.id }
            - call: "POST /evs/clean-requests/${r1}/assign"
              payload: { staff_id: "${t1}", planned_start_at: "2026-08-01T09:00:00Z" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests"
              payload: { bed_id: "${b2}", clean_type: "ROUTINE" }
              as: EVSDispatcher
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /evs/clean-requests/${r2}/assign"
              payload: { staff_id: "${t1}", planned_start_at: "2026-08-01T09:50:00Z" }
              as: EVSDispatcher
              captures: { err: $.data.error_id }
            - call: "POST /evs/clean-requests/${r2}/assign"
              payload: { staff_id: "${t1}", planned_start_at: "2026-08-01T09:55:00Z" }
              as: EVSDispatcher
          assert:
            - "err == ERR_STAFF_DOUBLE_BOOKED (409): 09:50 < 09:45 + 10min violates the buffer"
            - "Second assign at 09:55 succeeds: 09:55 >= 09:45 + 10min exactly satisfies the buffer (boundary equality allowed)"
            - "CleanRequest.${r2}.status == ASSIGNED with planned_start_at == 2026-08-01T09:55:00Z"
            - "StaffMember.${t1}.active_clean_count == 2"

      - name: maintenance_aggregate_capacity_cap
        grounds:
          - calculations.maintenance_capacity_check
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.MaintenanceWindow.fields.status
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on resource Unit (different
          resource AND different semantics than the staff pairwise buffer):
          pairwise overlap between windows is legal up to cap =
          max(1, floor(0.20 * 10 beds)) = 2; a third window overlapping the
          same instant is rejected, while a window merely TOUCHING at an
          endpoint (half-open adjacency) does not even count as overlap.
        test_recipe:
          setup:
            - "Unit U with 10 STANDARD beds"
            - "Windows W1 (bed 1) and W2 (bed 2) both [10:00, 11:00) — 2 overlapping, at cap"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/units"
