  - rule_id: compensating_invariant
    instances:
      - name: parts_reserve_release_conserves_availability
        grounds:
          - calculations.parts_availability
          - state_machines.WorkOrder.AUTHORIZED_to_CANCELLED
          - entities.PartItem.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity = parts stock: the invariant available_qty == on_hand_qty -
          reserved_qty must hold after every step, and the reserve(2) / release(2) pair must
          return both on_hand_qty (5) and available_qty (5) to their pre-reserve values with
          zero drift. Distinct conserved quantity from the BRC money invariant.
        test_recipe:
          setup:
            - "Part P-500 with on_hand_qty 5, reorder_threshold 0"
            - "Authorized work order planning 2 x P-500 (reserve), then cancelled before start (release)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops"
              payload: { name: "Shop R", stalls: 2, stall_daily_hours: 8, dwell_free_hours: 48, dwell_rate_cents_per_hour: 500, warranty_days: 90, counter_window_days: 30 }
              as: ShopAdmin
              captures: { s: $.data.id }
            - call: "POST /car-owners"
              payload: { shop_id: "${s}", name: "Owner A", scac_code: "OWNA" }
              as: ShopAdmin
              captures: { o: $.data.id }
            - call: "POST /handling-lines"
              payload: { shop_id: "${s}", name: "Line A", mark: "LNA" }
              as: ShopAdmin
              captures: { l: $.data.id }
            - call: "POST /price-master-entries"
              payload: { shop_id: "${s}", job_code: "J-AIR-HOSE", description: "Air hose replacement", labor_rate_cents_per_hour: 9000, mobile_labor_rate_cents_per_hour: 11000, standard_labor_hours: 1.5, mobile_trip_surcharge_cents: 25000, mobile_eligible: true, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: ShopAdmin
            - call: "POST /parts"
              payload: { shop_id: "${s}", part_number: "P-500", description: "Brake pipe bracket", unit_price_cents: 1000, on_hand_qty: 5, reorder_threshold: 0 }
              as: ShopAdmin
              captures: { p_inv: $.data.id }
            - call: "POST /railcars"
              payload: { shop_id: "${s}", reporting_mark: "OWNA", car_number: "1818", owner_id: "${o}", handling_line_id: "${l}", built_date: "2004-04-04" }
              as: YardClerk
              captures: { car: $.data.id, car_v: $.data.version }
            - call: "POST /railcars/${car}/inspections"
              payload: {}
              as: CarInspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/defects"
              payload: { aar_defect_code: "AAR-1204", defect_group: "AIR_HOSE", cause_code: "WEAR", severity: "MAJOR", location: "A-end" }
              as: CarInspector
              captures: { d1: $.data.id }
            - call: "POST /inspections/${insp}/complete"
              payload: {}
              as: CarInspector
            - call: "POST /work-orders"
              payload: { railcar_id: "${car}", inspection_id: "${insp}", routing: "SHOP", expected_railcar_version: "${car_v}" }
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/lines"
              payload: { defect_finding_id: "${d1}", job_code: "J-AIR-HOSE", planned_parts: [{ part_item_id: "${p_inv}", quantity: 2 }] }
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "POST /work-orders/${wo}/submit"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo}/authorize"
              payload: { expected_work_order_version: "${wo_v}" }
              as: CarOwnerRep
              as_user_id: "${o}"
          trigger:
            - call: "GET /parts/${p_inv}"
              as: Any
              captures: { oh_mid: $.data.on_hand_qty, rs_mid: $.data.reserved_qty, av_mid: $.data.available_qty }
            - call: "POST /work-orders/${wo}/cancel"
              payload: {}
              as: RepairForeman
              as_user_id: "foreman-1"
            - call: "GET /parts/${p_inv}"
              as: Any
          assert:
            - "after authorize: on_hand_qty == 5, reserved_qty == 2, available_qty == 3 (invariant 5 - 2 == 3 holds)"
            - "after cancel: on_hand_qty == 5, reserved_qty == 0, available_qty == 5 — reserve+release conserves stock exactly"
            - "PartItem.${p_inv}.status == ACTIVE after release (available 5 > threshold 0)"
            - "WorkOrder.${wo}.auth_status == CANCELLED and exec_status == CANCELLED"

      - name: brc_money_conservation_through_counter_and_settle
        grounds:
          - calculations.brc_total_aggregation
          - state_machines.BillingRepairCard.SUBMITTED_to_ACCEPTED
          - state_machines.BillingRepairCard.ACCEPTED_to_SETTLED
          - state_machines.CounterBill.OPEN_to_ACCEPTED
