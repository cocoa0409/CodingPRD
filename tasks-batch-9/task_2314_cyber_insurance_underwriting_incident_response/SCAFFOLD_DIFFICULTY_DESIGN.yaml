scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: control_posture_attested_versus_verified_diverge_on_application
        grounds:
          - calculations.control_posture_score
          - calculations.premium_quote
          - entities.Application.fields.attested_control_score
          - entities.Application.fields.verified_control_score
          - entities.Application.fields.indicative_premium_usd
          - entities.Application.fields.premium_usd
          - entities.ControlAttestation.fields.verified_level
          - state_machines.Application.SUBMITTED_to_UNDERWRITING
        distinguishing_aspect: |
          This instance is the control-posture domain of the dual-variant pair: both variants score the
          same ControlAttestation rows of one Application, and attested_basis reads attested_level while
          verified_basis reads min(attested_level, scan-observed level), so the identical attestation set
          scores 95.00 on one variant and 87.50 on the other and prices two different premiums off the same
          application.
        test_recipe:
          setup:
            - "Control catalog holds all five ControlRequirement rows (MFA_PRIVILEGED w30 mandatory min FULL, OFFLINE_BACKUPS w25 mandatory min FULL, EDR_COVERAGE w20 mandatory min PARTIAL, EMAIL_FILTERING w15 non-mandatory min PARTIAL, INCIDENT_RESPONSE_PLAN w10 non-mandatory min PARTIAL); weights sum to 100."
            - "InsuredAccount Aurora Health: HEALTHCARE, annual_revenue_usd 43800000, primary_dependency_key CSP_ALPHA."
            - "Application requests aggregate 5000000 with retention 250000; attestations are FULL/FULL/FULL/FULL/PARTIAL, so attested_control_score is 95.00 and indicative_premium_usd is 25398.00."
            - "Application.status is SUBMITTED with one PENDING ExternalScan and verified_control_score still null."
            - "Logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "OFFLINE_BACKUPS", min_level_required: "FULL", weight: 25, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EDR_COVERAGE", min_level_required: "PARTIAL", weight: 20, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EMAIL_FILTERING", min_level_required: "PARTIAL", weight: 15, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", min_level_required: "PARTIAL", weight: 10, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 5000000, requested_retention_usd: 250000, dependent_bi_definition: "NAMED_PLUS_SUPPLY_CHAIN" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_id: "$.data.id" }
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "MFA_PRIVILEGED", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "OFFLINE_BACKUPS", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EDR_COVERAGE", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EMAIL_FILTERING", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", attested_level: "PARTIAL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/external-scans"
              payload: { scan_vendor_name: "Perimeter Signal", scan_score: 68 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { scan_a_id: "$.data.id" }
          trigger:
            - call: "POST /cyber/external-scans/${scan_a_id}/complete"
              payload: { outcome: "COMPLETED", findings: [{ control_key: "EMAIL_FILTERING", severity: "HIGH", observed_level: "PARTIAL" }] }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "GET /cyber/applications/${app_a_id}/control-posture"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "GET /cyber/applications/${app_a_id}"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_v1: "$.data.version" }
            - call: "POST /cyber/applications/${app_a_id}/quote"
              payload: { expected_application_version: "${app_a_v1}" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          assert:
            - "Application.${app_a_id}.attested_control_score == 95.00"
            - "Application.${app_a_id}.indicative_premium_usd == 25398.00"
            - "Application.${app_a_id}.verified_control_score == 87.50"
            - "Application.${app_a_id}.mandatory_gap_count == 0"
            - "ControlAttestation for control_key EMAIL_FILTERING on ${app_a_id} has verified_level == PARTIAL while attested_level stays FULL"
            - "ControlAttestation for control_key MFA_PRIVILEGED on ${app_a_id} has verified_level == FULL"
            - "GET /cyber/applications/${app_a_id}/control-posture returns attested_score == 95.00, verified_score == 87.50, quotable == true"
            - "Application.${app_a_id}.status == QUOTED and Application.${app_a_id}.premium_usd == 28458.00"
            - "premium_usd 28458.00 minus indicative_premium_usd 25398.00 == 3060.00, the exact divergence caused by the variant switch"
      - name: bi_indemnity_trailing_versus_prior_year_diverge_on_proof_of_loss
        grounds:
          - calculations.bi_indemnity_quantification
          - entities.ProofOfLoss.fields.baseline_method_applied
          - entities.ProofOfLoss.fields.bi_component_usd
          - entities.ProofOfLoss.fields.extra_expense_component_usd
          - entities.ProofOfLoss.fields.assessed_indemnity_usd
          - entities.Policy.fields.bi_baseline_method
          - state_machines.ProofOfLoss.UNDER_REVIEW_to_ACCEPTED
        distinguishing_aspect: |
          This instance is the indemnity-money domain of the dual-variant pair, a different entity domain
          from the control-posture instance: both variants read the same ProofOfLoss revenue inputs and the
          same 72-hour outage, but TRAILING_12M divides annual revenue by 8760 while SAME_PERIOD_PRIOR_YEAR
          divides the prior-year window revenue by its own hour count, producing 212500.00 against
          259000.00 on byte-identical proof payloads.
        test_recipe:
          setup:
            - "Full catalog, Aurora Health account and a bound Policy with aggregate 5000000, retention 250000, bi_baseline_method TRAILING_12M and the five-section tower (FIRST_PARTY_RESPONSE 1000000/prio 10, BUSINESS_INTERRUPTION 2000000/wait 12/coins 0.10/prio 20, DEPENDENT_BI 500000/wait 24/coins 0.20/prio 30, THIRD_PARTY_LIABILITY 3000000/prio 40, CYBER_EXTORTION 500000/prio 50)."
            - "Logical clock at 2026-09-10T00:00:00Z."
            - "Two RANSOMWARE claims on that policy, each with outage 2026-09-05T00:00:00Z to 2026-09-08T00:00:00Z (72.00 hours) and covered_section_keys [FIRST_PARTY_RESPONSE, BUSINESS_INTERRUPTION]."
            - "Each claim carries one UNDER_REVIEW ProofOfLoss with trailing_12m_revenue_usd 43800000, prior_year_same_period_revenue_usd 1200000, prior_year_same_period_hours 200, gross_profit_margin_pct 0.62, extra_expense_usd 60000, mitigation_savings_usd 20000."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "OFFLINE_BACKUPS", min_level_required: "FULL", weight: 25, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EDR_COVERAGE", min_level_required: "PARTIAL", weight: 20, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EMAIL_FILTERING", min_level_required: "PARTIAL", weight: 15, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", min_level_required: "PARTIAL", weight: 10, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_a_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_a_id}", requested_aggregate_limit_usd: 5000000, requested_retention_usd: 250000, dependent_bi_definition: "NAMED_PLUS_SUPPLY_CHAIN" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_id: "$.data.id" }
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "MFA_PRIVILEGED", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "OFFLINE_BACKUPS", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EDR_COVERAGE", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "EMAIL_FILTERING", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/control-attestations"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", attested_level: "PARTIAL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_a_id}/external-scans"
              payload: { scan_vendor_name: "Perimeter Signal", scan_score: 68 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { scan_app_a_id: "$.data.id" }
            - call: "POST /cyber/external-scans/${scan_app_a_id}/complete"
              payload: { outcome: "COMPLETED", findings: [{ control_key: "EMAIL_FILTERING", severity: "HIGH", observed_level: "PARTIAL" }] }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "GET /cyber/applications/${app_a_id}"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_v1: "$.data.version" }
            - call: "POST /cyber/applications/${app_a_id}/quote"
              payload: { expected_application_version: "${app_a_v1}" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_a_v2: "$.data.version" }
            - call: "POST /cyber/applications/${app_a_id}/bind"
              payload: { expected_application_version: "${app_a_v2}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z", bi_baseline_method: "TRAILING_12M", coverage_sections: [{ section_key: "FIRST_PARTY_RESPONSE", sublimit_usd: 1000000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 10 }, { section_key: "BUSINESS_INTERRUPTION", sublimit_usd: 2000000, waiting_period_hours: 12, coinsurance_pct: 0.1, erosion_priority: 20 }, { section_key: "DEPENDENT_BI", sublimit_usd: 500000, waiting_period_hours: 24, coinsurance_pct: 0.2, erosion_priority: 30 }, { section_key: "THIRD_PARTY_LIABILITY", sublimit_usd: 3000000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 40 }, { section_key: "CYBER_EXTORTION", sublimit_usd: 500000, waiting_period_hours: null, coinsurance_pct: 0.0, erosion_priority: 50 }], named_dependency_keys: ["CSP_ALPHA"] }
              as: Underwriter
              as_user_id: "u-underwriter-2"
              captures: { pol_a_id: "$.data.id" }
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/incident-claims"
              payload: { policy_id: "${pol_a_id}", incident_type: "RANSOMWARE", incident_discovered_at: "2026-09-05T00:00:00Z", outage_start_at: "2026-09-05T00:00:00Z", outage_end_at: "2026-09-08T00:00:00Z", affected_record_count: 12345 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { clm_1_id: "$.data.id" }
            - call: "POST /cyber/incident-claims/${clm_1_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
            - call: "POST /cyber/incident-claims/${clm_1_id}/confirm-coverage"
              payload: { covered_section_keys: ["FIRST_PARTY_RESPONSE", "BUSINESS_INTERRUPTION"], initial_reserve_usd: 250000 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { clm_1_v: "$.data.version" }
            - call: "POST /cyber/incident-claims/${clm_1_id}/proofs-of-loss"
              payload: { expected_claim_version: "${clm_1_v}", claimed_bi_loss_usd: 250000, trailing_12m_revenue_usd: 43800000, prior_year_same_period_revenue_usd: 1200000, prior_year_same_period_hours: 200, gross_profit_margin_pct: 0.62, extra_expense_usd: 60000, mitigation_savings_usd: 20000 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { pol_1_id: "$.data.id" }
            - call: "POST /cyber/incident-claims"
              payload: { policy_id: "${pol_a_id}", incident_type: "RANSOMWARE", incident_discovered_at: "2026-09-05T00:00:00Z", outage_start_at: "2026-09-05T00:00:00Z", outage_end_at: "2026-09-08T00:00:00Z", affected_record_count: 12345 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { clm_2_id: "$.data.id" }
            - call: "POST /cyber/incident-claims/${clm_2_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
            - call: "POST /cyber/incident-claims/${clm_2_id}/confirm-coverage"
              payload: { covered_section_keys: ["FIRST_PARTY_RESPONSE", "BUSINESS_INTERRUPTION"], initial_reserve_usd: 250000 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { clm_2_v: "$.data.version" }
            - call: "POST /cyber/incident-claims/${clm_2_id}/proofs-of-loss"
              payload: { expected_claim_version: "${clm_2_v}", claimed_bi_loss_usd: 250000, trailing_12m_revenue_usd: 43800000, prior_year_same_period_revenue_usd: 1200000, prior_year_same_period_hours: 200, gross_profit_margin_pct: 0.62, extra_expense_usd: 60000, mitigation_savings_usd: 20000 }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-1"
              captures: { pol_2_id: "$.data.id" }
          trigger:
            - call: "POST /cyber/proofs-of-loss/${pol_1_id}/accept"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-2"
            - call: "POST /cyber/proofs-of-loss/${pol_2_id}/accept"
              payload: { baseline_method_override: "SAME_PERIOD_PRIOR_YEAR" }
              as: ClaimsAdjuster
              as_user_id: "u-adjuster-2"
          assert:
            - "ProofOfLoss.${pol_1_id}.baseline_method_applied == TRAILING_12M"
            - "ProofOfLoss.${pol_1_id}.compensable_hours == 60.00 and outage_hours == 72.00"
            - "ProofOfLoss.${pol_1_id}.bi_component_usd == 186000.00"
            - "ProofOfLoss.${pol_1_id}.mitigation_component_usd == 20000.00"
            - "ProofOfLoss.${pol_1_id}.extra_expense_component_usd == 46500.00"
            - "ProofOfLoss.${pol_1_id}.assessed_indemnity_usd == 212500.00"
            - "ProofOfLoss.${pol_2_id}.baseline_method_applied == SAME_PERIOD_PRIOR_YEAR"
            - "ProofOfLoss.${pol_2_id}.bi_component_usd == 223200.00"
            - "ProofOfLoss.${pol_2_id}.extra_expense_component_usd == 55800.00"
            - "ProofOfLoss.${pol_2_id}.assessed_indemnity_usd == 259000.00"
            - "assessed_indemnity_usd differs by exactly 46500.00 between the two variants on identical inputs"
  - rule_id: combinatorial_formula
    instances:
      - name: premium_layer_banding_with_stacked_modifiers_mode_a
        grounds:
          - calculations.premium_quote
          - entities.Application.fields.premium_usd
          - entities.InsuredAccount.fields.annual_revenue_usd
          - entities.InsuredAccount.fields.primary_dependency_key
          - state_machines.Application.UNDERWRITING_to_QUOTED
        distinguishing_aspect: |
          Mode (a): five independent inputs (industry_code, annual_revenue_usd, requested_aggregate_limit_usd,
          verified_control_score, requested_retention_usd) interact non-linearly through a nested
          min/max three-band layer split (1.00 / 0.60 / 0.35), a tiered revenue factor and three additive
          modifiers, so no input can be varied without re-deriving the whole product.
        test_recipe:
          setup:
            - "Full five-row control catalog."
            - "InsuredAccount Redstone Capital: FINANCIAL (base rate 8000 per million), annual_revenue_usd 300000000 (revenue tier 3, factor 1.35), primary_dependency_key NONE (no dependency load)."
            - "Application requests aggregate 10000000 (layer_units = 1*1.00 + 4*0.60 + 5*0.35 = 5.15) with retention 100000 (retention modifier -0.05)."
            - "Attestations FULL/FULL/FULL/PARTIAL/PARTIAL and a COMPLETED scan with no findings, so verified_control_score is 87.50 (control modifier -0.05) and there is no mandatory gap."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "OFFLINE_BACKUPS", min_level_required: "FULL", weight: 25, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EDR_COVERAGE", min_level_required: "PARTIAL", weight: 20, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "EMAIL_FILTERING", min_level_required: "PARTIAL", weight: 15, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", min_level_required: "PARTIAL", weight: 10, is_mandatory: false }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Redstone Capital", industry_code: "FINANCIAL", annual_revenue_usd: 300000000, record_count: 5000, primary_dependency_key: "NONE" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_r_id: "$.data.id" }
            - call: "POST /cyber/applications"
              payload: { insured_account_id: "${acct_r_id}", requested_aggregate_limit_usd: 10000000, requested_retention_usd: 100000, dependent_bi_definition: "NAMED_PLUS_SUPPLY_CHAIN" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { app_r_id: "$.data.id" }
            - call: "POST /cyber/applications/${app_r_id}/control-attestations"
              payload: { control_key: "MFA_PRIVILEGED", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_r_id}/control-attestations"
              payload: { control_key: "OFFLINE_BACKUPS", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_r_id}/control-attestations"
              payload: { control_key: "EDR_COVERAGE", attested_level: "FULL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_r_id}/control-attestations"
              payload: { control_key: "EMAIL_FILTERING", attested_level: "PARTIAL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_r_id}/control-attestations"
              payload: { control_key: "INCIDENT_RESPONSE_PLAN", attested_level: "PARTIAL" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_r_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/applications/${app_r_id}/external-scans"
              payload: { scan_vendor_name: "Perimeter Signal", scan_score: 68 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { scan_r_id: "$.data.id" }
            - call: "POST /cyber/external-scans/${scan_r_id}/complete"
              payload: { outcome: "COMPLETED", findings: [] }
