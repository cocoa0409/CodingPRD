            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-FORF", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
