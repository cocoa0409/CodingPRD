  # ===================================================================================
  # RULE 3 - non_linear_state_machine
  # Differentiation: three different entities and three different non-linear shapes -
  # a bounded CYCLE on Application, PARALLEL independent dimensions on Residency, and a
  # second, differently-bounded CYCLE (an unbounded RFE loop with a monotone counter) on
  # VisaCase.
  # ===================================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_revision_cycle_bounded_at_max_revision_rounds
        grounds: "§1.2 Application.status transitions SUBMITTED -> REVISION_REQUESTED and REVISION_REQUESTED -> SUBMITTED; §1.1 Application.revision_round; §1.4 P21 ERR_REVISION_LIMIT_REACHED; §1.0 constants.MAX_REVISION_ROUNDS"
        distinguishing_aspect: |
          Entity: Application. Shape: a genuine CYCLE - the pair SUBMITTED -> REVISION_REQUESTED
          -> SUBMITTED returns the entity to a state it already occupied, so the state alone can
          never tell you how far the application has travelled. Termination is carried by a
          monotone counter (revision_round) checked against MAX_REVISION_ROUNDS = 2, not by the
          state graph, so the SAME edge is legal twice and illegal the third time. An
          implementation that models the graph correctly but forgets the counter loops forever;
          one that blocks the reverse edge outright never lets an application be revised at all.
        test_recipe:
          setup: |
            CHAIN-PANEL truncated at the screening stage: one cycle, one discipline SCULPT with
            portfolio_min_items 1, one applicant, one application with a waived fee and one
            portfolio item, submitted while the cycle is OPEN and then advanced to SCREENING.
            The loop is then traversed twice - REQUEST_REVISION / submit, REQUEST_REVISION /
            submit - leaving the application in SUBMITTED with revision_round == 2.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { artist: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${artist}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${artist}"
              captures: { app: "$.data.id" }
            - call: "POST /portfolio-items"
              payload: { application_id: "${app}", media_type: "IMAGE", title: "Plate I", file_size_mb: 12.5 }
              as: Applicant
              as_user_id: "${artist}"
            - call: "POST /applications/${app}/fee-resolution"
              payload: { action: "WAIVE", reason: "income tested" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${artist}"
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "SCREENING" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications/${app}/screening-decision"
              payload: { decision: "REQUEST_REVISION", note: "tighten the budget narrative" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${artist}"
            - call: "POST /applications/${app}/screening-decision"
              payload: { decision: "REQUEST_REVISION", note: "still needs a fabrication plan" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${artist}"
          trigger:
            - call: "POST /applications/${app}/screening-decision"
              payload: { decision: "REQUEST_REVISION", note: "third pass" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "after the first REQUEST_REVISION: status == 'REVISION_REQUESTED' and revision_round == 1"
            - "after the first resubmission: status == 'SUBMITTED' and revision_round stays 1 - the counter advances on the REQUEST edge, not on the return edge"
            - "after the second REQUEST_REVISION: status == 'REVISION_REQUESTED' and revision_round == 2, so the entity has visited REVISION_REQUESTED twice and SUBMITTED three times"
            - "after the second resubmission: status == 'SUBMITTED' and revision_round == 2 == MAX_REVISION_ROUNDS"
            - "the trigger returns 409 with error_id == 'ERR_REVISION_LIMIT_REACHED' - the identical edge that succeeded twice is now refused"
            - "the trigger leaves status == 'SUBMITTED' and revision_round == 2 unchanged: a rejected transition has no side effects"
            - "a subsequent screening-decision with decision == 'ADVANCE' still succeeds from the same SUBMITTED state, proving the cap is on the revision edge only and not a lock on the state"
            - "the cycle is only traversable while Cycle.status == 'SCREENING' (P18), so the loop is bounded on two independent axes - the counter and the parent's stage"

      - name: residency_status_and_compliance_dimensions_advance_independently
        grounds: "§1.2 two state machines on Residency - status (SCHEDULED/IN_RESIDENCE/COMPLETED/TERMINATED/WITHDRAWN) and compliance_status (TRAINING_PENDING/CLEARED/SUSPENDED, terminal_states: []); §1.1 Residency.required_training_types / completed_training_types"
        distinguishing_aspect: |
          Entity: Residency. Shape: PARALLEL state dimensions. One entity carries two state
          fields that advance on unrelated triggers - the lifecycle axis moves on
          POST /residencies/{id}/lifecycle, the safety axis on POST /residencies/{id}/trainings
          and POST /residencies/{id}/compliance - and the combined state is the pair. The axes are
          not merely independent, they are asymmetrically coupled: compliance gates the lifecycle
          (CHECK_IN needs CLEARED) while the lifecycle does NOT gate compliance (a residency can
          be suspended mid-session and stays IN_RESIDENCE). The compliance axis also has
          terminal_states: [] - it can oscillate CLEARED <-> SUSPENDED forever - whereas the
          lifecycle axis has three terminal states. Flattening the two into one enum is the
          natural mistake and it makes the 3x2 reachable grid unrepresentable.
        test_recipe:
          setup: |
            CHAIN-SHORT with an 8-week session starting 2026-11-02. required_training_types is
            ["EQUIPMENT_WELDING", "SAFETY_ORIENTATION"]. Both trainings are recorded, which drives
            the safety axis TRAINING_PENDING -> CLEARED while the lifecycle axis is still
            SCHEDULED. The clock is moved to the session start and the residency is checked in,
            so the pair is (IN_RESIDENCE, CLEARED) when the trigger fires.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: true,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { artist: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${artist}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /residencies/${res}/compliance"
              payload: { action: "SUSPEND", reason: "unattended hot work observed in the shop" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/compliance"
              payload: { action: "REINSTATE", reason: "retraining completed and shop walk-through signed off" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "GET /residencies/${res}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "after the first training call: compliance_status == 'TRAINING_PENDING' (one of two required trainings covered) while status is still 'SCHEDULED' - one axis moved, the other did not"
            - "after the second training call: compliance_status == 'CLEARED' and status is STILL 'SCHEDULED', so the pair is (SCHEDULED, CLEARED)"
            - "after CHECK_IN: status == 'IN_RESIDENCE' and compliance_status is unchanged at 'CLEARED' - the lifecycle transition does not touch the safety axis"
            - "the first trigger call returns 200 with compliance_status == 'SUSPENDED' and status STILL == 'IN_RESIDENCE' - suspension does not end the residency"
            - "the second trigger call returns 200 with compliance_status back to 'CLEARED' and status still 'IN_RESIDENCE': the compliance axis has terminal_states: [] and may oscillate without limit"
            - "the final GET confirms completed_training_types == ['EQUIPMENT_WELDING', 'SAFETY_ORIENTATION'] (sorted, de-duplicated) and that REINSTATE was permitted only because that list still covered required_training_types (P34)"
            - "the reachable combined states exercised are (SCHEDULED, TRAINING_PENDING), (SCHEDULED, CLEARED), (IN_RESIDENCE, CLEARED) and (IN_RESIDENCE, SUSPENDED) - four cells of the 3x2 grid that a single flattened enum could not express"
            - "the suspension released no studio in this instance because none was assigned; the axes stay orthogonal even where their side effects would interact"

      - name: visa_case_rfe_cycle_increments_round_on_every_pass
        grounds: "§1.2 VisaCase.status transitions DOCS_SUBMITTED -> DOCS_REQUESTED (the reverse edge) and DOCS_REQUESTED -> DOCS_SUBMITTED; §1.1 VisaCase.rfe_round / requested_doc_list / submitted_doc_list; §1.4 P40 ERR_VISA_DOCS_INCOMPLETE"
        distinguishing_aspect: |
          Entity: VisaCase. Shape: a CYCLE again, but with the opposite bounding discipline from
          instance 1 - the request-for-evidence loop DOCS_SUBMITTED -> DOCS_REQUESTED ->
          DOCS_SUBMITTED is UNBOUNDED by design (a consulate may keep asking), so rfe_round is a
          pure observability counter rather than a cap, and the only exit is the FILE edge or the
          hard temporal wall of filing_deadline_date. The loop also mutates its own guard:
          requested_doc_list grows on each pass, so the SUBMIT edge that was satisfiable last
          round is not satisfiable with the same payload this round. A cycle whose precondition
          strengthens each lap cannot be replayed from a recorded transcript.
        test_recipe:
          setup: |
            CHAIN-SHORT with the clock at 2026-06-01 and a cycle whose open_at is 2026-05-01, and
            a FRENCH applicant, so Applicant.is_international is true and POST /residencies
            auto-creates a VisaCase in INITIATED. The 8-week session starting 2026-11-02 makes
            case_type 'B1_SHORT_TERM' (8 < VISA_J1_MIN_SESSION_WEEKS 9), backlog_days 21 (FR is
            not in HIGH_VOLUME_VISA_COUNTRIES) and filing_deadline_date
            2026-11-02 - (90 + 21) days = 2026-07-14. One full RFE lap is then completed:
            REQUEST two documents, SUBMIT both, REQUEST three documents, SUBMIT all three.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-05-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
