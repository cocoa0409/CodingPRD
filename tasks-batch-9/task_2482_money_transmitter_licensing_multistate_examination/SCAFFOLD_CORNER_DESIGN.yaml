  - section: endpoints
    instances:
      - name: delegate_create_read_and_filtered_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /delegates]
          - endpoints[GET /delegates/{id}]
          - endpoints[GET /delegates]
        distinguishing_aspect: "The create response, the single read and the filtered list all agree on the same server-assigned defaults (status ONBOARDING, oversight_score 0, active_authorization_count 0), and the status filter partitions the collection rather than ignoring the parameter."
        test_recipe:
          setup: ["One licensee with two delegates: an AUTHORIZED_DELEGATE and an AGENT."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /delegates"
              payload: { licensee_id: "${lic_id}", legal_name: "Sunrise Checks Inc", delegate_type: "AUTHORIZED_DELEGATE" }
              as: LicensingManager
              captures: { del_one: "$.data.id", del_one_status: "$.data.status", del_one_score: "$.data.oversight_score" }
            - call: "POST /delegates"
              payload: { licensee_id: "${lic_id}", legal_name: "Copper Kettle Grocery", delegate_type: "AGENT" }
              as: LicensingManager
              captures: { del_two: "$.data.id" }
          trigger:
            - call: "GET /delegates/${del_one}"
              as: LicensingManager
              captures: { read_status: "$.data.status", read_type: "$.data.delegate_type" }
            - call: "GET /delegates?licensee_id=${lic_id}&status=ONBOARDING"
              as: ComplianceOfficer
              as_user_id: "user-co-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "${del_one_status} == ONBOARDING, ${del_one_score} == 0 and the create response carries active_authorization_count == 0"
            - "${read_status} == ONBOARDING and ${read_type} == AUTHORIZED_DELEGATE; the read response repeats licensee_id == ${lic_id}"
            - "the filtered list returns exactly 2 rows with total_count == 2 and has_more == false, and ${first_id} is one of ${del_one} / ${del_two}"

      - name: financials_patch_replaces_net_worth_and_bumps_the_version
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /licensees/{id}/financials]
          - entities.Licensee.fields.reported_tangible_net_worth_cents
        distinguishing_aspect: "The financials patch overwrites rather than accumulates (500000000 becomes 60000000, not 560000000) and increments Licensee.version, which is exactly the value the permissible-investment-test OCC field is compared against."
        test_recipe:
          setup: ["One licensee created with 500000000 of tangible net worth."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id", v0: "$.data.version" }
          trigger:
            - call: "PATCH /licensees/${lic_id}/financials"
              payload: { reported_tangible_net_worth_cents: 60000000, net_worth_statement_date: "2026-07-31T00:00:00Z" }
              as: LicensingManager
              captures: { v1: "$.data.version", nw: "$.data.reported_tangible_net_worth_cents" }
            - call: "GET /licensees/${lic_id}"
              as: StateRegulator
              as_user_id: "user-sr-any"
              captures: { nw_read: "$.data.reported_tangible_net_worth_cents", v_read: "$.data.version" }
          assert:
            - "${nw} == 60000000 (replacement, not 560000000) and net_worth_statement_date == 2026-07-31T00:00:00Z"
            - "${v1} == ${v0} + 1 and ${v_read} == ${v1}"
            - "${nw_read} == 60000000; aggregate_outstanding_obligations_cents is unchanged at 0"

      - name: coverage_summary_is_a_pure_computed_read
        claim_type: Computed read
        grounds:
          - endpoints[GET /licensees/{id}/coverage-summary]
          - calculations.permissible_investment_coverage
          - calculations.licensee_coverage_posture
        distinguishing_aspect: "The summary recomputes both variants on read and mutates nothing: 2000000 CASH plus 2000000 US_TREASURY against 4000000 of obligations gives book 4000000 / 10000 bps but eligible 3960000 / 9900 bps (200 bps treasury haircut), posture WATCH, and the licensee version is identical before and after the read."
        test_recipe:
