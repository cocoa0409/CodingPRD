            - { call: "POST /title-i/monitoring-visits/${v}/issue-report", payload: {}, as: SEAMonitor, as_user_id: "monitor-1" }
          trigger:
            - call: "POST /title-i/monitoring-findings/${ff}/close-no-action"
              payload: {}
              as: SEAMonitor
              captures: { err: "$.data.error_id" }
            - { call: "POST /title-i/monitoring-findings/${fo}/close-no-action", payload: {}, as: SEAMonitor, as_user_id: "monitor-1", captures: { ok: "$.data.status" } }
            - { call: "GET /title-i/monitoring-visits/${v}", payload: {}, as: SEAMonitor, captures: { vst: "$.data.status" } }
          assert:
