            - call: "POST /subsidy-periods/${sp_id}/close"
              payload: { allocation_basis: "HOURS", revenue_cents: 500000 }
              as: ProgramDirector
          assert:
            - "first close: HTTP 409 with data.error_id == \"ERR_OPEN_ASSIGNMENTS_BLOCK_CLOSE\"; GET /subsidy-periods/${sp_id} still reports status == \"OPEN\""
            - "the release returns status == \"RELEASED\" with released_reason == \"MANUAL_RELEASE\" and leaves ws1 assigned_count == 0"
            - "second close: HTTP 200 with data.status == \"CLOSED\" and data.revenue_cents == 500000"
            - "the closed period reports trainee_hours == 0.000 (no COMPLETED assignment ever existed), mission_share == 0.0000, total_cost_cents == 0 and both true-cost ratios null"
            - "margin_pct == 1.0000 ((500000 - 0) / 500000), subsidy_rate == 0.50 and subsidy_draw_cents == 0 (0.50 * mission_cost 0)"

      - name: unpermitted_role_on_unknown_business_line_returns_forbidden
        claim_type: priority_ordering
        grounds:
          - validations[priority 2]
          - validations[priority 3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_BUSINESS_LINE_NOT_FOUND]
        distinguishing_aspect: |
          Two rules are violated at once -- the caller's role is not on the endpoint and the path id
          matches no row. Priority 2 must win, so the answer is 403 ERR_ROLE_NOT_PERMITTED and the
          404 stays hidden; only when the role is corrected does the same id surface
          ERR_BUSINESS_LINE_NOT_FOUND. An implementation that loads the row before authorising
          returns 404 and fails this claim.
        test_recipe:
          setup:
            - "Empty database. ${unknown_bl_id} is a well-formed id that matches no BusinessLine row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /business-lines/${unknown_bl_id}/review"
              payload: { decision: "APPROVED" }
              as: FunderAnalyst
              captures: { err_role: $.data.error_id }
            - call: "POST /business-lines/${unknown_bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
              captures: { err_missing: $.data.error_id }
          assert:
            - "FunderAnalyst on the unknown id: HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\" (priority 2 pre-empts priority 3)"
            - "ProgramDirector on the same unknown id: HTTP 404 with data.error_id == \"ERR_BUSINESS_LINE_NOT_FOUND\""
            - "neither call creates or mutates any row: GET /business-lines reports total_count == 0"

      - name: stale_version_outranks_intake_closed_covered_by_difficulty
        claim_type: priority_conflict
        grounds:
          - validations[priority 9]
          - validations[priority 19]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / stale_business_line_version_outranks_intake_closed"
          rationale: |
            §1.8 already builds the double violation (a stale expected_business_line_version on a line
            whose intake_posture has gone CLOSED) and asserts the 412 ERR_STALE_BUSINESS_LINE_VERSION
            plus the fixed-version rerun that then surfaces ERR_INTAKE_CLOSED.

      - name: shift_not_started_outranks_hours_grace_covered_by_difficulty
        claim_type: priority_conflict
        grounds:
          - validations[priority 17]
          - validations[priority 34]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / shift_not_started_outranks_actual_hours_exceed_shift"
          rationale: |
            §1.8 completes an unstarted shift with actual_hours beyond duration_hours + 0.5 and asserts
            ERR_SHIFT_NOT_STARTED first, then advances the clock to expose
            ERR_ACTUAL_HOURS_EXCEED_SHIFT with the same body.

      - name: weekly_hours_cap_aggregate_covered_by_difficulty
        claim_type: aggregate_validation
        grounds:
          - validations[priority 38]
        excluded_because:
          difficulty_instance: "boundary_precision_check / weekly_hours_cap_boundary_28_000_inclusive"
          rationale: |
            §1.8 accumulates committed ISO-week hours to exactly 28.000 (accepted) and then to 28.001+
            (rejected), which is precisely the aggregate-validation claim for this rule.

      - name: rest_buffer_temporal_validation_covered_by_difficulty
        claim_type: temporal_validation
        grounds:
          - validations[priority 27]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / participant_rest_buffer_accepts_60_rejects_59_minute_gap"
          rationale: |
            §1.8 tests both sides of the buffered exclusion (a 60-minute gap accepted, 59 minutes
            rejected) on the same participant, so a duplicate corner test adds nothing.

      - name: supervision_capacity_aggregate_covered_by_difficulty
        claim_type: aggregate_validation
        grounds:
          - validations[priority 28]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / supervision_capacity_rejects_overlap_allows_adjacency"
          rationale: |
            §1.8 drives the concurrent-seat aggregate over overlapping shifts to supervisor_capacity + 1
            (rejected) and shows that merely adjacent shifts never contend (accepted).

