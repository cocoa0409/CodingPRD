  - rule_id: transitive_cascade
    instances:

      - name: complaint_uphold_cascades_to_standing_suspension_booking_and_entry
        grounds:
          - state_machines.Complaint.TRIAGED_to_UPHELD
          - calculations.performer_conduct_scoring
          - state_machines.Permit.CLEAR_to_SUSPENDED
          - state_machines.SessionBooking.RESERVED_to_CANCELLED_BY_SUSPENSION
          - state_machines.LotteryEntry.SUBMITTED_to_FORFEITED
          - entities.Permit.fields.season_minutes_used
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /busking/complaints/{id}/adjudicate: the UPHELD write
          (L1) forces the conduct rescore that flips standing to BARRED (L2); that standing flip
          forces compliance_status CLEAR -> SUSPENDED (L3); that suspension forces the RESERVED
          booking to CANCELLED_BY_SUSPENSION and the SUBMITTED entry to FORFEITED, crediting
          season_minutes_used back to 0 (L4). Each link is caused by the previous write, not by
          the adjudication itself.
        test_recipe:
          setup:
            - "Performer Ada holds an ACTIVE, CLEAR 2026 permit with the 5400-cent invoice paid."
            - "A 90-minute booking on RP-01 for 2026-08-25T10:00:00Z to 11:30:00Z is RESERVED, so season_minutes_used is 90."
            - "Ada has a SUBMITTED lottery entry in an OPEN draw on the PREMIUM pitch RP-P1."
            - "One MAJOR complaint has already been upheld, so conduct_score is 75 and standing is WATCH; a second MAJOR complaint sits in TRIAGED, triaged by officer-alpha."
