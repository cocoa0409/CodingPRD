          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Northwind Wallet has one PASSED FeatureMapping (feature_code ACCOUNT_DELETION) against EFFECTIVE PRIVACY rule 5.1.1; index 100.00, posture OPEN, distribution_state NOT_DISTRIBUTED."
            - "A DRAFT rule 5.1.2 with supersedes_rule_id pointing at 5.1.1 and effective_from 2026-08-01T00:00:00Z."
