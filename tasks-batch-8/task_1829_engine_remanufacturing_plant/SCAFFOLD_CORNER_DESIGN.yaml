  # =================================================================
  # Section: endpoints
  # =================================================================
  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type 'object' for single-entity endpoints, and the entity under data."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { distributor_code: "D-ENV", name: "Envelope Co", emissions_requirement: "FEDERAL", credit_limit_cents: 1000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { env_id: $.data.id }
          assert:
            - "response.meta.api_request_id is a non-empty string"
            - "response.meta.api_request_timestamp is an ISO8601 timestamp"
            - "response.response_type == 'object' and data.id == captured env_id"

      - name: error_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Every error response has response_type 'error' and data carries both error_id and message."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /distributors/00000000-0000-0000-0000-000000000000"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.response_type == 'error'"
            - "captured err == ERR_NOT_FOUND and data.message is a non-empty string"

      - name: list_endpoints_filter_and_shape
        claim_type: list_filtering
        grounds: [response_envelope, entities.CoreReturn]
        distinguishing_aspect: "List endpoints apply filters server-side (status=GRADED returns only graded returns, including none of the RECEIVED ones) and report pagination fields total_count and has_more."
        test_recipe:
          setup: ["Distributor D-LF with two returns: R1 GRADED, R2 still RECEIVED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-LF", name: "List Filter Co", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "C1500-1993", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r2: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_B", missing_components: [] }
              as: CoreInspector
          trigger:
            - call: "GET /core-returns"
              payload: { distributor_id: "${d1}", status: "GRADED" }
              as: PlantAdmin
              captures: { g0: $.data.0.id }
            - call: "GET /core-returns"
              payload: { distributor_id: "${d1}" }
              as: PlantAdmin
          assert:
            - "filtered list contains exactly 1 row and captured g0 == ${r1}"
            - "unfiltered list for distributor contains exactly 2 rows"
            - "both responses report total_count and has_more pagination fields"

  # =================================================================
  # Section: errors
  # (Trigger coverage for error ids already exercised as the failure
  #  path of a §1.8 difficulty instance; all other catalog errors are
  #  triggered by validations/rbac/cross-cutting corner instances.)
  # =================================================================
  - section: errors
    instances:
      - name: err_distributor_credit_hold_triggered
        claim_type: error_trigger_coverage
        grounds: ["errors[ERR_DISTRIBUTOR_CREDIT_HOLD]"]
        excluded_because:
          difficulty_instance: sell_credit_hold_masks_credit_limit
          rationale: "Asserted as the winning error of the state-vs-fiscal priority pair."
      - name: err_component_quarantined_triggered
        claim_type: error_trigger_coverage
        grounds: ["errors[ERR_COMPONENT_QUARANTINED]"]
        excluded_because:
          difficulty_instance: consume_quarantine_masks_interchange
          rationale: "Asserted as the winning error of the safety-vs-referential priority pair."
      - name: err_core_return_not_graded_triggered
        claim_type: error_trigger_coverage
        grounds: ["errors[ERR_CORE_RETURN_NOT_GRADED]"]
