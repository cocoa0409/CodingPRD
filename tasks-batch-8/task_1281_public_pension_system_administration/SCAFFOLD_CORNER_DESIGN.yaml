# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1281_public_pension_system_administration
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_member_missing_employer_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Member.fields.employer_id
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "employer_id has source=input and no default; omitting it must fail with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Fund and employer exist"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
          trigger:
            - call: "POST /members"
              payload: { full_name: "No Employer Ned", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: MemberServicesAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: create_contribution_line_default_service_months_applied
        claim_type: defaults
        grounds: [entities.ContributionLine.fields.service_months]
        distinguishing_aspect: "service_months defaults to 12 when omitted from the create payload."
        test_recipe:
          setup: ["Fund, Employer, Member, DRAFT report"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Default Dee", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /contribution-reports/${rep1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 6000000, contribution_amount_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { line_months: $.data.service_months, line_status: $.data.status }
          assert:
            - "response line.service_months == 12 (default applied)"
            - "response line.status == PENDING (initial state)"

      - name: create_member_computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Member.fields.total_service_years, entities.Member.fields.status]
        distinguishing_aspect: "Client-supplied total_service_years/status/id are ignored; server computes them (status ACTIVE, service 0)."
        test_recipe:
          setup: ["Fund and employer exist"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Sneaky Sam", date_of_birth: "1990-01-01", hire_date: "2020-01-01", total_service_years: 99, status: "RETIRED" }
              as: MemberServicesAnalyst
              captures: { m_status: $.data.status, m_years: $.data.total_service_years }
          assert:
            - "response status == ACTIVE (input RETIRED ignored)"
            - "response total_service_years == 0 (input 99 ignored)"

      - name: get_member_not_found_returns_error_envelope
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - response_envelope
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns the §1.0 error envelope with ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Fund exists"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
          trigger:
            - call: "GET /members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MemberServicesAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404, envelope has meta + response_type == error"

      - name: list_lines_pagination_limit_offset_interaction
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints[GET /contribution-reports/{id}/lines]
        distinguishing_aspect: "limit=4&offset=4 over a 6-line report returns the last 2 items with total_count 6 and has_more false."
        test_recipe:
          setup: ["Fund, Employer, Member, DRAFT report with 6 lines (FY2018-2023)"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Page Polly", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2018-01-01", period_end: "2024-01-01", declared_total_cents: 2400000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2018, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2019, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2020, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2021, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2022, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep1}/lines", payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 5000000, contribution_amount_cents: 400000 }, as: EmployerClerk, as_user_id: "${emp_id}" }
          trigger:
            - call: "GET /contribution-reports/${rep1}/lines"
              payload: { limit: 4, offset: 4 }
              as: MemberServicesAnalyst
          assert:
            - "response data array length == 2"
            - "pagination fields present: total_count == 6, has_more == false, limit == 4, offset == 4"

      - name: create_purchase_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.ServicePurchase.fields.purchase_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "purchase_type outside {MILITARY, PRIOR_SERVICE} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Fund, Employer, Member"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Enum Ed", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "SPACE_TRAVEL", service_period_start: "2005-01-01", service_period_end: "2006-12-31", years_purchased: 2.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: employer_code_uniqueness_enforced
        claim_type: type_constraints
        grounds: [entities.Employer.fields.employer_code]
        distinguishing_aspect: "Second employer with the same employer_code is rejected (uniqueness constraint)."
        test_recipe:
          setup: ["Fund exists; employer with code DUP exists"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "First", employer_code: "DUP" }
              as: FundAdmin
          trigger:
            - call: "POST /employers"
              payload: { name: "Second", employer_code: "DUP" }
              as: FundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (duplicate employer_code)"

      - name: fk_reverse_reachability_lists_children
        claim_type: parent_relationships
        grounds: [entities.ContributionReport.fields.employer_id, entities.ContributionLine.fields.report_id]
        distinguishing_aspect: "GET /employers/{id}/contribution-reports and GET /contribution-reports/{id}/lines return exactly the children of the named parent."
        test_recipe:
          setup: ["Fund; employers E1 (2 reports) and E2 (1 report); R1 has 1 line, R2 has 0"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "E1", employer_code: "E1" }
              as: FundAdmin
              captures: { e1: $.data.id }
            - call: "POST /employers"
              payload: { name: "E2", employer_code: "E2" }
              as: FundAdmin
              captures: { e2: $.data.id }
            - call: "POST /employers/${e1}/contribution-reports"
              payload: { period_start: "2022-01-01", period_end: "2023-01-01", declared_total_cents: 100 }
              as: EmployerClerk
              as_user_id: "${e1}"
              captures: { r1: $.data.id }
            - call: "POST /employers/${e1}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 100 }
              as: EmployerClerk
              as_user_id: "${e1}"
            - call: "POST /employers/${e2}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 100 }
              as: EmployerClerk
              as_user_id: "${e2}"
            - call: "POST /members"
              payload: { employer_id: "${e1}", full_name: "Child Chuck", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /contribution-reports/${r1}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2022, period_salary_cents: 1250, contribution_amount_cents: 100 }
              as: EmployerClerk
              as_user_id: "${e1}"
          trigger:
            - call: "GET /employers/${e1}/contribution-reports"
              payload: {}
              as: MemberServicesAnalyst
            - call: "GET /contribution-reports/${r1}/lines"
              payload: {}
              as: MemberServicesAnalyst
          assert:
            - "GET /employers/${e1}/contribution-reports total_count == 2 (E2's report not leaked)"
            - "GET /contribution-reports/${r1}/lines total_count == 1 and the line's report_id == ${r1}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_draft_application_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RetirementApplication
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DRAFT -> APPROVED is not in the transition list; the approve endpoint must reject with ERR_INVALID_STATE (409) before any side effects."
        test_recipe:
          setup: ["Fund, Employer, Member (ACTIVE), application created in DRAFT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Draft Dan", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "SINGLE_LIFE" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_id: $.data.id, app_ver: $.data.version }
          trigger:
            - call: "POST /retirement-applications/${app_id}/approve"
              payload: { expected_application_version: "${app_ver}" }
              as: BenefitApprover
              as_user_id: "approver-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "Application remains DRAFT; no Benefit created"

      - name: cancel_cancelled_application_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.RetirementApplication
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal; a second cancel must fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Fund, Employer, Member, application cancelled once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Terminal Tina", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "SINGLE_LIFE" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /retirement-applications/${app_id}/cancel", payload: {}, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - call: "POST /retirement-applications/${app_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; status remains CANCELLED"

      - name: revoke_revoked_beneficiary_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Beneficiary
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REVOKED is terminal; a second revoke fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Fund, Employer, Member, beneficiary designated then revoked"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Revoke Rhonda", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/beneficiaries"
              payload: { full_name: "Kid Ken", relationship: "child", date_of_birth: "1995-01-01" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { beny_id: $.data.id, beny_status0: $.data.status }
            - { call: "POST /beneficiaries/${beny_id}/revoke", payload: {}, as: Member, as_user_id: "${mem_id}" }
          trigger:
            - call: "POST /beneficiaries/${beny_id}/revoke"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Initial status was DESIGNATED; first revoke -> REVOKED"
            - "Second revoke: error_id == ERR_INVALID_STATE, HTTP 409"

      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.ServicePurchase, state_machines.ContributionReport, state_machines.RetirementApplication, state_machines.DisabilityApplication]
        distinguishing_aspect: "Newly created purchase is REQUESTED, report is DRAFT, retirement application is DRAFT, disability application is UNDER_MEDICAL_REVIEW (auto-advanced at creation)."
        test_recipe:
          setup: ["Fund, Employer, Member ACTIVE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Initial Irene", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 100 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep_status: $.data.status }
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "MILITARY", service_period_start: "2005-01-01", service_period_end: "2006-12-31", years_purchased: 2.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { pur_status: $.data.status }
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "SINGLE_LIFE" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_status: $.data.status }
            - call: "POST /members/${mem_id}/disability-applications"
              payload: { disability_type: "DUTY" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { dis_status: $.data.status }
          assert:
            - "report status == DRAFT; purchase status == REQUESTED; retirement application status == DRAFT; disability application status == UNDER_MEDICAL_REVIEW"

      - name: submit_requires_member_active_guarded_transition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RetirementApplication.DRAFT_to_SUBMITTED
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: "Cross-entity guard on submit (distinct from the approve guard covered by difficulty instance approve_requires_member_active): INACTIVE member's DRAFT application cannot submit."
        test_recipe:
          setup: ["Fund, Employer, Member INACTIVE with application DRAFT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Inactive Ivan", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/retirement-applications"
              payload: { option_election: "SINGLE_LIFE" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { app_id: $.data.id }
            - { call: "PATCH /members/${mem_id}", payload: { status: "INACTIVE" }, as: MemberServicesAnalyst }
          trigger:
            - call: "POST /retirement-applications/${app_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_ACTIVE (409); application stays DRAFT, provisional_monthly_cents null"

      - name: finalize_draft_report_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ContributionReport
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "finalize is only declared from SUBMITTED; a DRAFT report finalize fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Fund, Employer, DRAFT report with one line"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Draft Fiona", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
