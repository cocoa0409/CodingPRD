          Every filter is probed by an element that must be EXCLUDED while a
          near-identical sibling is included: a PLANNED ZONE_B build worth 80000
          sits next to a READY ZONE_A build worth 220000 (cost base 380000, never
          460000), and a CANCELLED booking is invisible to PROVISIONAL revenue yet
          contributes its 55872 fee to FINAL revenue. Completing the event flips
          both builds' states (READY -> CLOSED, PLANNED -> CANCELLED) without
          moving the cost base at all, which is only true if the filter is the
          declared three-state set rather than "not cancelled". The report is also
