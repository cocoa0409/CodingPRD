      - name: transfer_dispatch_and_create_gated_by_the_other_stores_status
        grounds:
          - validations[priority:26]
          - state_machines[Store].transitions[ACTIVE->REMODEL]
          - state_machines[Store].transitions[REMODEL->ACTIVE]
          - errors.ERR_STORE_NOT_ELIGIBLE
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/dispatch
        distinguishing_aspect: |
          A TransferRecommendation in APPROVED is perfectly dispatchable by its own state machine, yet the
          call fails because a different entity - the receiving Store - is in REMODEL. Returning that store
          to ACTIVE makes the identical call succeed with no change to the recommendation, and the
          asymmetry of the rule is visible on the third store: CLOSING blocks 0103 from RECEIVING but still
          lets it DONATE.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with transfer_min_ratio_bp 0; stores 0101(A,URBAN,6500), 0102(B,URBAN,5800), 0103(C,SUBURBAN,4200)"
            - "Shelf plans 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 15 / pmin 8"
            - "Positions: 0101 holds 4 units (S 0, M 3, L 1, XL 0); 0102 holds 30 units (S 8, M 10, L 8, XL 4); 0103 holds 5 units (M 2, L 2, XL 1) so its S is out"
            - "A 6-unit REBALANCE 0102 -> 0101 has been created and APPROVED while every store is ACTIVE"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH", transfer_min_ratio_bp: 0 }
