              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/absence-reports"
              payload: { post_assignment_id: "${asg1_id}", absence_date: "2026-09-09", reason: "ILLNESS", note: "Flu." }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/absence-reports"
              payload: { post_assignment_id: "${asg1_id}", absence_date: "2026-09-10", reason: "ILLNESS", note: "Flu." }
              as: CrossingSupervisor
              as_user_id: "sup-1"
          assert:
            - "Guard.${g1_id}.reliability_score_rolling_90d == 91.00"
            - "Guard.${g1_id}.reliability_score_season_to_date == 95.50"
            - "Guard.${g1_id}.reliability_score_season_to_date - Guard.${g1_id}.reliability_score_rolling_90d == 4.50"
            - "Guard.${g1_id}.certification_status == CERTIFIED (91.00 is above the 75.00 rolling floor, so no suspension fires)"
            - "Guard.${g1_id}.training_hours_completed == 12"

  - rule_id: combinatorial_formula
    instances:
      - name: project_score_nested_caps_and_cost_factor_floor
        grounds:
          - calculations.project_benefit_cost_score
          - entities.InfrastructureProject.fields.benefit_points
          - entities.InfrastructureProject.fields.cost_factor
          - entities.InfrastructureProject.fields.benefit_cost_score
          - entities.Intersection.fields.crash_severity_points
        distinguishing_aspect: |
          Mode (a) — a four-input formula with non-linear interaction: three independent
          min() caps (crash 60.0, students 50.0, complaints 30.0) feed a weighted sum
          that is then divided by a cost_factor clamped from below by max(1.00, ...).
          With students_benefited 500 sitting exactly on the 50.0 student cap and a
          3,000,000-cent request landing at ratio 0.60 below the cost floor,
          benefit_points is 42.2260 and benefit_cost_score is 42.23 — not 70.38, which
          is what an unclamped cost_factor of 0.60 would produce.
        test_recipe:
          setup:
            - "School 2026-08-24 -> 2027-06-11; one UNCONTROLLED 30 mph intersection."
            - "Intersection crash history: INJURY 2023-10-01 (pedestrian) and SEVERE_INJURY 2025-05-14 (pedestrian) -> crash_severity_points 23."
            - "A finalized WARRANTED study giving latest_warrant_score 66.19."
            - "Logical clock advanced to 2026-09-30T09:00:00Z so the 1095-day crash window is exactly [2023-10-01, 2026-09-30]."
            - "One grant program with a 12,000,000-cent pool and one PROPOSED project: 500 students benefited, 3,000,000 cents requested, no cited complaint."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Maple St & 3rd Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { isx_id: $.data.id }
            - call: "POST /srts/intersections/${isx_id}/crash-records"
              payload: { crash_date: "2023-10-01", severity: "INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/intersections/${isx_id}/crash-records"
              payload: { crash_date: "2025-05-14", severity: "SEVERE_INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { isx_v: $.data.version }
            - call: "POST /srts/warrant-studies"
              payload: { intersection_id: "${isx_id}", count_window_start: "2026-09-08", count_window_end: "2026-09-30", expected_intersection_version: "${isx_v}" }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { study_id: $.data.id }
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-08", period: "AM_ARRIVAL", observed_minutes: 60, child_count: 70, adult_count: 10, vehicle_count: 500, adequate_gaps: 28 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/count-sessions"
              payload: { session_date: "2026-09-09", period: "PM_DISMISSAL", observed_minutes: 60, child_count: 50, adult_count: 8, vehicle_count: 380, adequate_gaps: 20 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/analyze"
              payload: {}
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_id}/finalize"
              payload: { engineer_note: "Adopt WARRANTED determination." }
              as: TrafficEngineer
              as_user_id: "eng-2"
            - call: "POST /srts/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-1"
            - call: "POST /srts/grant-programs"
              payload: { program_name: "FY27 SRTS Infrastructure", fiscal_year: 2027, total_cents: 12000000, application_deadline: "2026-10-15" }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { grant_id: $.data.id }
            - call: "POST /srts/infrastructure-projects"
              payload: { grant_program_id: "${grant_id}", intersection_id: "${isx_id}", project_type: "RRFB", scope_summary: "Rectangular rapid flashing beacon at Maple & 3rd.", requested_cost_cents: 3000000, students_benefited: 500 }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /srts/infrastructure-projects/${proj_id}/score"
              payload: {}
              as: TrafficEngineer
              as_user_id: "eng-1"
          assert:
            - "Intersection.${isx_id}.crash_severity_points == 23"
            - "Intersection.${isx_id}.latest_warrant_score == 66.19"
            - "InfrastructureProject.${proj_id}.referred_complaint_count_at_scoring == 0"
            - "InfrastructureProject.${proj_id}.benefit_points == 42.2260"
            - "InfrastructureProject.${proj_id}.cost_factor == 1.00"
            - "InfrastructureProject.${proj_id}.benefit_cost_score == 42.23"
            - "InfrastructureProject.${proj_id}.status == SCORED"

      - name: route_hazard_rounds_per_segment_before_summing
        grounds:
          - calculations.route_hazard_score
          - entities.WalkingRoute.fields.segments
          - entities.WalkingRoute.fields.hazard_score
          - entities.WalkingRoute.fields.segment_count
        distinguishing_aspect: |
          Mode (b) — pinned nested-rounding order. Three NO_SIDEWALK segments of 133 ft
          each contribute 1.25*133/100 = 1.6625, which rounds to 1.66 per segment;
          adding a 60 ft UNCONTROLLED_CROSSING (2.10) and a mitigated 80 ft
          RAIL_CROSSING (0.00) the pinned round-then-sum order yields hazard_score
          7.08, whereas sum-then-round yields 7.09. The scaffold pins 7.08.
        test_recipe:
          setup:
            - "School 2026-08-24 -> 2027-06-11 with one UNCONTROLLED intersection finalized WARRANTED (score 66.19)."
            - "No guard posts, so the school stays coverage_posture OPEN and the route can publish."
