      - name: replenishment_receive_gated_by_part_obsolete
        grounds:
          - state_machines.ReplenishmentOrder."logistics_status=IN_TRANSIT"_to_"logistics_status=RECEIVED"
          - state_machines.Part.LTB_CLOSED_to_OBSOLETE
          - errors[ERR_PART_LIFECYCLE_INVALID]
        distinguishing_aspect: |
          A DIFFERENT entity pair — ReplenishmentOrder -> Part: an order already IN_TRANSIT
          becomes unreceivable purely because the Part it points at was walked through
          LTB_CLOSED to OBSOLETE while the goods were on the water; the order's own two status
          dimensions never moved.
