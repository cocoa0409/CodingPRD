            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
