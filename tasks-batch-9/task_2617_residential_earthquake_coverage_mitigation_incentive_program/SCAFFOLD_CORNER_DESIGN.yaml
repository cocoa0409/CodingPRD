              as: ProgramAdmin
              captures: { dw_1: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "112 Ladder Lane", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 2000, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_2: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "114 Ladder Lane", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 2000, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_3: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "116 Ladder Lane", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 2000, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_4: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "118 Ladder Lane", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 2000, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_5: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_1}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_1: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_1}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_2}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_2: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_2}/respond"
              payload: { response: "DECLINE", decline_documented: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_3}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_3: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_3}/respond"
              payload: { response: "DECLINE", decline_documented: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_4}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_4: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_4}/respond"
              payload: { response: "DECLINE", decline_documented: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_5}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_5: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_5}/respond"
