# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Opaque operator that drives the logical clock and the deferred-action epoch"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-cycle"
    shared_operations: []

  - name: ManufacturingQA
    description: "Releases manufacturing batches into the distribution network and owns the product presentation"
    identity: opaque
    exclusive_operations:
      - "POST /product-configurations"
      - "POST /allocation-batches"
      - "POST /allocation-batches/{id}/release"
    shared_operations:
      - "GET /product-configurations, GET /allocation-batches"

  - name: RegulatoryAffairsOfficer
    description: "Owns jurisdiction programs, batch recalls, dose accountability reporting and the appeal decision"
    identity: opaque
    exclusive_operations:
      - "POST /jurisdiction-programs"
      - "POST /allocation-batches/{id}/recall"
      - "POST /reporting-periods, POST /reporting-periods/{id}/submit, POST /reporting-periods/{id}/reopen"
      - "POST /temperature-excursions/{id}/appeals/{appealId}/accept, POST /temperature-excursions/{id}/appeals/{appealId}/deny"
      - "POST /doses-affected-slices/{id}/reopen"
      - "POST /excursion-adjudications/{id}/withdraw"
    shared_operations:
      - "GET /program-standings, GET /reporting-periods/{id}/accountability"
      - "POST /cartons/{id}/destroy, POST /allocation-windows/{id}/close"

  - name: DistributionPlanner
    description: "Owns allocation windows, site orders and the redistribution of cartons between sites"
    identity: opaque
    exclusive_operations:
      - "POST /allocation-windows, POST /allocation-windows/{id}/open"
      - "POST /site-orders/{id}/accept, POST /site-orders/{id}/reject, POST /site-orders/{id}/fulfillment/reverse"
      - "POST /site-transfers, POST /site-transfers/{id}/approve, POST /site-transfers/{id}/cancel"
      - "POST /dose-ledger-entries/{id}/reverse"
      - "POST /storage-sites"
    shared_operations:
      - "POST /carton-storage-reservations"
      - "POST /allocation-windows/{id}/close"

  - name: SiteCoordinator
    description: "Acts for a storage site: submits orders, receives shipments, dispenses doses and files excursions and wastage"
    identity: entity_backed:StorageSite
    exclusive_operations:
      - "POST /site-orders, POST /site-orders/{id}/submit"
      - "POST /dispatches/{id}/deliver, POST /dispatches/{id}/reject-at-dock"
      - "POST /site-transfers/{id}/receive"
      - "POST /cartons/{id}/puncture"
      - "POST /temperature-excursions"
      - "POST /wastage-reports"
      - "POST /temperature-excursions/{id}/appeals"
    shared_operations:
      - "POST /cartons/{id}/thaw"
      - "POST /dose-ledger-entries, GET /dose-ledger-entries"
      - "GET /storage-sites/{id}/usable-doses"

  - name: LogisticsOperator
    description: "Packs, seals and dispatches cold chain shippers"
    identity: opaque
    exclusive_operations:
      - "POST /dispatches, POST /dispatches/{id}/pack, POST /dispatches/{id}/dispatch"
      - "POST /shippers, POST /shippers/{id}/attach-carton, POST /shippers/{id}/seal"
      - "POST /site-transfers/{id}/dispatch"
      - "POST /logger-readings"
    shared_operations:
      - "POST /cartons/{id}/thaw"
      - "POST /carton-storage-reservations"

  - name: ColdChainReviewer
    description: "Adjudicates cold chain posture: equipment qualification, shipper holds, transfers, excursion review and wastage reconciliation"
    identity: opaque
    exclusive_operations:
      - "POST /site-equipment-verifications"
      - "POST /shippers/{id}/hold, POST /shippers/{id}/release"
      - "POST /temperature-excursions/{id}/review"
      - "POST /cartons/{id}/refreeze, POST /cartons/{id}/advance-logical-state"
      - "POST /wastage-reports/{id}/reconcile"
      - "POST /carton-families"
    shared_operations:
      - "POST /cartons/{id}/destroy"
      - "POST /site-transfers/{id}/reject"
      - "POST /allocation-windows/{id}/close"
      - "POST /logger-readings"

  - name: MedicalScienceLiaison
    description: "Decides whether product in an excursion remains usable and closes dose-affected slices"
    identity: opaque
    exclusive_operations:
      - "POST /temperature-excursions/{id}/adjudicate"
      - "POST /doses-affected-slices/{id}/close"
    shared_operations:
      - "GET /temperature-excursions/{id}, GET /temperature-excursions/{id}/readiness, GET /temperature-excursions/{id}/audit"
