              captures: { err_pair: "$.data.error_id" }
          assert:
            - "the control pack of the still-PICKED a2 returns HTTP 422 and ${err_low} == ERR_PACKAGING_DEPLETED"
            - "the pack of the already-PACKED a1 returns HTTP 409 and ${err_pair} == ERR_ASSIGNMENT_STATE_INVALID"
            - "FulfillmentAssignment.${a1}.status == PACKED"
