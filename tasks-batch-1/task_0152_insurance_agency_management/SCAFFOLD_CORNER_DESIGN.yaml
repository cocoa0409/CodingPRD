        claim_type: Standard CRUD
        grounds:
          - "endpoints"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "GET /carriers?limit=1&offset=0 with 2 carriers returns total_count 2, has_more true, and one item."
        test_recipe:
          setup: ["two carriers exist"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "List A", naic_code: "19191", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "List B", naic_code: "19192", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
          trigger:
            - call: "GET /carriers?limit=1&offset=0"
              payload: {}
              as: AgencyAdmin
          assert:
            - "response meta.total_count == 2"
            - "response has_more == true"
            - "response data array length == 1"

      - name: list_policies_filtered_by_account
        claim_type: Computed read
        grounds:
          - "endpoints"
          - "entities.Policy.fields.account_id"
        distinguishing_aspect: "GET /policies?account_id={id} returns only policies for that account (FK reverse-reachability filtered list)."
        test_recipe:
          setup: ["one account with one QUOTED policy; a second account with none"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "Car LF", naic_code: "20202", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id }
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto LF", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod LF", npn: "NPN-LF1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Acct LF1", servicing_producer_id: "${wp_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct1_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct1_id}", product_id: "${prod_id}", writing_producer_id: "${wp_id}", state_code: "CA", annual_premium_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
