  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: scholarship_revoke_restores_invoice_subtotal
        grounds:
          - state_machines.ScholarshipAward.REQUESTED_to_APPROVED
          - state_machines.ScholarshipAward.APPROVED_to_REVOKED
          - calculations.compute_line_tuition
          - calculations.compute_invoice_totals
        distinguishing_aspect: |
          Conserved quantity = Invoice.subtotal_cents in money terms: approving then revoking a
          PARTIAL scholarship must return subtotal_cents to exactly its pre-approval value
          (21500 -> 11500 -> 21500), with zero drift in the dollar subtotal.
        test_recipe:
          setup:
            - "OPEN CAMP session base 20000; one CONFIRMED child with a REQUESTED PARTIAL scholarship; DRAFT invoice subtotal 21500."
