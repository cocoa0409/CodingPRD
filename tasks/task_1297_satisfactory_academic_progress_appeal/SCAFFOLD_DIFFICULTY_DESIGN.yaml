            - { call: "GET /sap/students/${stu_x}", as: AidOfficer, captures: { sx_v: $.data.version } }
            - { call: "GET /sap/students/${stu_y}", as: AidOfficer, captures: { sy_v: $.data.version } }
          trigger:
            - { call: "POST /sap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: AidAdministrator }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${evx}", reason_category: "MEDICAL", statement: "On-time appeal", documents: [{ doc_type: "NOTE", description: "Doctor note" }], expected_student_version: "${sx_v}" }, as: Student, as_user_id: "${stu_x}", captures: { ap_x: $.data.id } }
