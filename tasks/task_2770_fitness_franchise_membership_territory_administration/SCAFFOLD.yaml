  - method: GET
    path: "/franchise/members"
    description: "Lists members, optionally filtered by status or home state."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["status?", "home_state_code?", "limit?", "offset?"]
