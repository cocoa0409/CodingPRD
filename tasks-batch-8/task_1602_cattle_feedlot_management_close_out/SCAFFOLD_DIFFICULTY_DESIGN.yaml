  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ship_state_precondition_beats_withdrawal_safety
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair state x business_safety: a ship request on an
          OPEN lot with an active withdrawal violates both ERR_LOT_NOT_MARKETED
          (priority 7) and ERR_WITHDRAWAL_NOT_CLEARED (priority 8); the state
          error must win.
        test_recipe:
          setup:
            - "Lot L-901: 5 steers, arrival 2026-08-01, still OPEN; health event 2026-08-01 with withdrawal_days 30 (clear date 2026-08-31); clock 2026-08-05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-901", billing_email: "o901@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-901", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "BAYTRIL", withdrawal_days: 30, head_treated: 1, treatment_cost_cents: 1000 }
              as: CattleHealthTech
          trigger:
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-05", out_weight_total_lbs: 3700 }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LOT_NOT_MARKETED (priority 7 state beats priority 8 business_safety, even though the withdrawal hold is also violated)"

      - name: commingle_referential_beats_capacity_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair business_referential x business_temporal
          (different pair than state x business_safety): a new assignment that
          is BOTH commingle-incompatible (heifer lot, commingle_allowed false)
          AND capacity-exceeding (5+1 > 5) must fail with
          ERR_COMMINGLE_RULE_VIOLATION (priority 9), not
          ERR_PEN_CAPACITY_EXCEEDED (priority 10).
        test_recipe:
          setup:
            - "Pen E-01 capacity 5 fully occupied by lot L-902 (5 steers); lot L-903 is 1 heifer with commingle_allowed omitted (false)"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-902", billing_email: "o902@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "E-01", capacity_head: 5 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-902", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { la: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-903", sex_class: "HEIFER", head_count_in: 1, in_weight_total_lbs: 700, purchase_cost_cents: 140000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { lb: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${la}", head_count: 5, start_date: "2026-08-01" }
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${lb}", head_count: 1, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMINGLE_RULE_VIOLATION (priority 9 referential beats priority 10 temporal capacity, even though 5+1 > 5 also holds)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: hedge_coverage_exactly_full_allowed
        grounds:
          - calculations.hedge_coverage
        distinguishing_aspect: |
          Metric: hedge coverage ratio in cwt. Coverage of exactly 1.0
          (1200 cwt open vs 1200 cwt marketable) is allowed (<=, not <); one
          more 400-cwt contract (1600 > 1200) is rejected. Reached via
          POST /feedlot/hedges.
        test_recipe:
          setup:
            - "Lot L-801: 80 steers, 80000 lbs in (avg 1000), arrival 2026-08-01 -> marketable = round_half_up(80 x 80000 x 3 / (80 x 200)) = 1200 cwt"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-801", billing_email: "o801@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-801", sex_class: "STEER", head_count_in: 80, in_weight_total_lbs: 80000, purchase_cost_cents: 9600000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /feedlot/hedges"
              payload: { lot_id: "${l_id}", contract_month: "2026-12", quantity_contracts: 3, entry_price_cents_per_cwt: 19000, expected_lot_version: "${lot_v}" }
              as: RiskManager
              captures: { h1_status: $.data.status }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { lot_v2: $.data.version }
            - call: "POST /feedlot/hedges"
              payload: { lot_id: "${l_id}", contract_month: "2026-12", quantity_contracts: 1, entry_price_cents_per_cwt: 19000, expected_lot_version: "${lot_v2}" }
              as: RiskManager
              captures: { err: $.data.error_id }
          assert:
            - "h1_status == OPEN (3 contracts x 400 cwt = 1200 <= 1200: exact 100% coverage is allowed)"
            - "err == ERR_HEDGE_OVER_COVERED (one more contract -> 1600 > 1200)"

      - name: pen_capacity_exactly_at_limit_allowed
        grounds:
          - validations[priority=10]
          - entities.Pen.fields.capacity_head
        distinguishing_aspect: |
          Metric: integer head count vs pen capacity (different metric than
          the hedge coverage ratio), reached via POST /feedlot/assignments
