              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E802", full_name: "Pax P5B", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/sifl-rate-periods"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", terminal_charge_cents: 5000, rate_band_1_cents_per_mile: 30, rate_band_2_cents_per_mile: 20, rate_band_3_cents_per_mile: 10, control_employee_multiplier_pct: 400 }
              as: FinanceAdmin
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N802CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C803", full_name: "P P", seat_qualification: "PIC", type_ratings: ["LIGHT_JET"], training_valid_until: "2027-01-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { pic_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C804", full_name: "P S", seat_qualification: "SIC", type_ratings: ["LIGHT_JET"], training_valid_until: "2027-01-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { sic_id: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "PERSONAL", purpose: "Personal", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"], personal_use_flag: true }
              as: ExecutiveRequester
              as_user_id: "${pax}"
