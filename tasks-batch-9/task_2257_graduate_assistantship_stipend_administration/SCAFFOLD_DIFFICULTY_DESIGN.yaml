  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: appointment_parallel_axes_pay_suspend_leaves_lifecycle_active
        grounds:
          - state_machines.Appointment.SCHEDULED_to_PAY_SUSPENDED
          - state_machines.Appointment.PAY_SUSPENDED_to_SCHEDULED
          - entities.Appointment.fields.lifecycle_status
          - entities.Appointment.fields.payroll_status
        distinguishing_aspect: |
          Appointment carries two independent state dimensions: suspend-pay then resume-pay drives
          payroll_status NOT_SCHEDULED -> SCHEDULED -> PAY_SUSPENDED -> SCHEDULED while
          lifecycle_status stays ACTIVE for every one of those calls, and no StipendDisbursement row
          leaves SCHEDULED - so the payroll axis is provably not a slice of the approval axis.
        test_recipe:
          setup:
            - "Term PAR2026 (2026-09-01..2026-12-31, CALENDAR_DAY) OPEN with four whole-month pay periods."
            - "StipendPolicy (RESEARCH, DOCTORAL): min_fte_monthly_stipend_cents 400000, per_credit_tuition_cents 50000, max_remission_cents_per_term 500000, term_insurance_premium_cents 0."
            - "DOCTORAL student, enrolled_credit_hours 0, non-international."
            - "One GRANT source authorized 5000000 funding the appointment at 100.00 percent."
            - "Appointment: RESEARCH, effort_pct 75, 2026-09-01..2026-12-31, monthly_stipend_cents 300000, driven to lifecycle_status ACTIVE and payroll_status SCHEDULED with four SCHEDULED StipendDisbursement rows of 300000 cents each."
