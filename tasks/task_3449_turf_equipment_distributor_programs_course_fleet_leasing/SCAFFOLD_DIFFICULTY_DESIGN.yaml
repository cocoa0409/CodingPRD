              captures: { m1: $.data.id }
            - call: "POST /turf/parts"
              payload: { sku: "P1-BEDKNIFE", name: "Bedknife 11-blade", primary_model_id: "${m1}", unit_cost_cents: 12000, min_stock_qty: 4 }
              as: CorporateAdmin
              captures: { p1: $.data.id }
            - call: "POST /turf/parts-orders"
              payload: { order_type: "STOCK", lines: [{ part_id: "${p1}", qty: 100 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /turf/parts-orders/${o1}/transition"
              payload: { to: "SUBMITTED" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "GET /turf/distributors/${d1}"
              as: CorporateAdmin
              captures: { committed_after_submit: $.data.committed_parts_cents }
            - call: "POST /turf/parts-orders/${o1}/transition"
              payload: { to: "CANCELLED" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "GET /turf/distributors/${d1}"
              as: CorporateAdmin
              captures: { committed_after_cancel: $.data.committed_parts_cents }
          assert:
            - "committed_after_submit == 1200000 (in-season: no discount)"
            - "PartsOrder.${o1}.total_cents == 1200000 and status == CANCELLED"
            - "committed_after_cancel == 0 (submit + cancel pair conserves the pre-action value)"
