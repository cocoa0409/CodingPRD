  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_info_request_cycle_capped_at_three_review_rounds
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Dispute.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.Dispute.fields.review_round
          - validations[priority=75].ERR_DISPUTE_ROUND_LIMIT
        distinguishing_aspect: |
          Cyclic shape: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW is a genuine loop on the same row, and the
          loop is bounded by review_round < MAX_DISPUTE_ROUNDS (3) rather than by the state graph. The third
          re-entry succeeds, the fourth is refused with ERR_DISPUTE_ROUND_LIMIT while the dispute stays parked in
          INFO_REQUESTED - a state a linear reading of the machine would treat as already progressed past.
