            - { call: "POST /refund-allocations", payload: { tax_return_id: "${ret_id}", account_type: CHECKING, routing_number: "021000021", account_number_mask: "****0003", amount_cents: 50000 }, as: Preparer, as_user_id: "${prep_id}" }
