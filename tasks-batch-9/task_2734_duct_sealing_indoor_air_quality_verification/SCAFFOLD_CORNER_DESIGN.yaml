          - validations[priority=50]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Two separate priority-50 sub-clauses on the same endpoint: an out-of-range enum (condition_grade 'Z') and a non-positive quantity (design_cfm 0.0) both return 400 ERR_INVALID_REQUEST while a valid grade C at 800.0 CFM succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one UtilityProgram and one Project"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
