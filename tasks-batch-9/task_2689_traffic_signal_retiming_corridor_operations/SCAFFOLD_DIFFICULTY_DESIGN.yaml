          assert:
            - "${chk_req_pc} == 17.8"
            - "${chk_prov_pc} == 17.7"
            - "${chk_pre_result} == FAIL"
            - "${chk_pre_reason} == PED_CLEAR_SHORT"
            - "${chk_post_result} == WAIVED"
            - "${chk_waived_by} == cert-1"
            - "${st_after_waive} == COORDINATED"
            - "${ped_after_waive} == WAIVED"
            - "${st_after_submit} == SUBMITTED"
            - "${ped_after_submit} == WAIVED"
            - "${st_after_certify} == CERTIFIED"
            - "${ped_after_certify} == WAIVED"
            - "TimingPlan.${pl1_id}.certified_by_user_id == cert-1"
            - "TimingPlan.${pl1_id}.return_count == 0"

