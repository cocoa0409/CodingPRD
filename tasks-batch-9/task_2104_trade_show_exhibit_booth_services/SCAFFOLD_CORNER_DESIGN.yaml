      - ExhibitAsset.${asset_id}.status == IN_STORAGE
      - ExhibitAsset.${asset_id}.refurb_cycles_count == 1
      - ExhibitAsset.${asset_id}.condition_grade == A
      - ExhibitAsset.${asset_id}.current_warehouse_id == ${wh_id}
