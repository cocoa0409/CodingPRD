  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: sample_adequacy_ratio_exactly_at_eight_tenths_closes_the_deployment
        grounds:
          - calculations.deployment_sample_adequacy_ratio
          - calculations.deployment_evasion_rate_bps
          - calculations.deployment_enforcement_cost_cents
          - validations[priority=47]
          - state_machines.InspectionDeployment.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          The gate is inclusive at 4-decimal precision: 3 of 5 sampled riders gives 0.6000 and the
          close is refused, while the 4th encounter lands the ratio on exactly 0.8000 and the close
          succeeds. Boundary resource: InspectionDeployment.sample_adequacy_ratio. The successful
          close is also where the ratio's precision matters — an implementation that stores
          0.8 as a 1-decimal float or that compares with a strict `>` never closes this deployment.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED (12000 bps), line L1 assigned, deployment D1 ACTIVE 2026-08-05T06:00:00Z..14:00:00Z with 3 planned inspectors and target_sample_size 5."
            - "Three resolved encounters exist: e1 COMPLIANT (VALID smartcard), e2 WARNING_ISSUED (NO_PROOF), e3 COMPLIANT (VALID smartcard); no PENDING encounters remain."
            - "sample_adequacy_ratio == 0.6000 (3 / 5). Logical clock at 2026-08-05T09:00:00Z."
