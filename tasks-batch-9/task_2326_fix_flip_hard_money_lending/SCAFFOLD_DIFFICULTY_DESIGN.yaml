  - rule_id: boundary_precision_check
    instances:
      - name: experience_tier_boundary_exactly_65_00_versus_64_88
        grounds:
          - calculations.borrower_experience_score
          - calculations.borrower_experience_score.constants.TIER_B_MIN
          - entities.Borrower.fields.intake_experience_score
          - entities.Borrower.fields.experience_tier
        distinguishing_aspect: |
          One point of credit score moves the sponsor across the TIER_B floor: 696 scores
          exactly 65.00 and lands in TIER_B because the comparison is >=, while 695 scores
          64.88 (25 * 0.475 = 11.875, not 12) and drops to TIER_C, which later changes
          every sizing cap by five percentage points. Truncating instead of ROUND_HALF_UP
          at two decimals, or using a strict > at the floor, flips one of the two rows.
        test_recipe:
          setup:
            - "logical clock 2026-08-10T09:00:00Z"
            - "two otherwise identical LLC sponsors: flips_last_24mo 3, flips_lifetime 6, liquidity 3,000,000, declared target 30,000,000, no prior defaults"
            - "the only difference is credit_score: 696 versus 695"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /lending/borrowers"
