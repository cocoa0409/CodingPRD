            - "PartsInventory.${pi_id}.reserved_qty stays 0 and on_hand_qty stays 5"
            - "ServiceOrder.${so_id}.status stays DISPATCHED with part_id null"
            - "this is a business_referential failure, not a business_safety one, so ERR_PART_MISMATCH_SAFETY does not appear"

      - name: on_demand_enrollment_outside_the_library_window_is_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=7]
          - errors[ERR_CLASS_CAPACITY_EXCEEDED]
          - state_machines.ClassSession.PUBLISHED_to_ARCHIVED
        distinguishing_aspect: "An on-demand enrollment attempted after the session archived is refused, and the refusal is a temporal-window failure rather than a capacity failure, even though both surface through the same error id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T09:30:00Z. Membership ACTIVE with a verified OWNER and a delivered linked ACTIVE device; a PUBLISHED ON_DEMAND session whose ends_at has already elapsed."
          setup_api_calls:
