            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-16T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { cb: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${ca}", severity: "FORMAL", subject: "E1", body: "Escalation one." }, as: NoiseAnalyst, captures: { n1: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${cb}", severity: "FORMAL", subject: "E2", body: "Escalation two." }, as: NoiseAnalyst, captures: { n2: $.data.id } }
            - { call: "POST /noise-program/operator-notifications/${n1}/send", payload: {}, as: NoiseAnalyst }
