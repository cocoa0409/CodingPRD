    roles: [SalesRep, ComplianceOfficer, QaManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SubscriptionAllocation[]"
    side_effects: []

  - method: GET
    path: "/finished-lots/{id}/recall-notices"
    description: "Recall notices raised for this lot"
    roles: [SalesRep, ComplianceOfficer, QaManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RecallNotice[]"
    side_effects: []

  # ------------------------------------------------------------ Keg
  - method: POST
    path: "/kegs"
    description: "Register a keg asset in IN_STOCK"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [asset_code, capacity_liters]
    output: Keg
    side_effects: ["status = IN_STOCK; deposit_state = NONE"]

  - method: POST
    path: "/kegs/{id}/fill"
