  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: panel_effectivity_half_open_interval_strict_greater_boundary
        grounds:
          - validations.priority_23_ERR_PANEL_EFFECTIVE_DATE_OVERLAP
          - state_machines.MapPanel.LFD_ISSUED_to_EFFECTIVE
          - state_machines.MapPanel.EFFECTIVE_to_SUPERSEDED
          - calculations.effective_panel_selector
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_date, superseded_at) on the
          resource "the effective FIRM panel for one (community_id,
          map_panel_number)". Two successor panels are walked identically and
          differ by exactly one day of effective_date; the equal-date one
          overlaps (a zero-length window would exist) and is refused, the
          +1-day one is accepted. The other instance uses a CLOSED window on a
          different resource entity (ComplianceNotice obligation slots).
        test_recipe:
          setup:
            - "one FL community holding two independent panel families"
            - "family A: panel 12086C0312K seq 1, effective_date 2020-06-05, created EFFECTIVE"
            - "family B: panel 12086C0314K seq 1, effective_date 2020-06-05, created EFFECTIVE"
            - "successor A2: seq 2, supersedes A1, effective_date 2020-06-05 (EQUAL to A1 - the boundary case)"
            - "successor B2: seq 2, supersedes B1, effective_date 2020-06-06 (exactly one day GREATER)"
            - "both successors walked PRELIMINARY -> APPEAL_OPEN -> LFD_ISSUED at 2026-10-30, then clock 2027-05-01 so both clear the 180-day LFD wait (2027-04-28) and priority 22 cannot fire"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { a1_id: $.data.id, a1_status: $.data.revision_status }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0314K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 8.25, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { b1_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2020-06-05T00:00:00Z", supersedes_panel_id: "${a1_id}", study_case_number: "26-04-1234P" }
              as: AgencyOfficer
              captures: { a2_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0314K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2020-06-06T00:00:00Z", supersedes_panel_id: "${b1_id}", study_case_number: "26-04-1235P" }
              as: AgencyOfficer
              captures: { b2_id: $.data.id }
            - call: "POST /flood-zone/map-panels/${a2_id}/appeal-period"
              payload: { appeal_period_end_date: "2026-10-30T00:00:00Z" }
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels/${b2_id}/appeal-period"
              payload: { appeal_period_end_date: "2026-10-30T00:00:00Z" }
              as: AgencyOfficer
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels/${a2_id}/appeal-decision"
              payload: { outcome: "LFD_ISSUED" }
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels/${b2_id}/appeal-decision"
              payload: { outcome: "LFD_ISSUED" }
              as: AgencyOfficer
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T00:00:00Z" }
              as: AgencyOfficer
          trigger:
            - call: "POST /flood-zone/map-panels/${a2_id}/effective"
              payload: {}
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels/${b2_id}/effective"
              payload: {}
              as: AgencyOfficer
              captures: { b2_status: $.data.revision_status }
          assert:
            - "OVERLAP side: effective_date 2020-06-05 is not strictly greater than A1's 2020-06-05 -> 409 ERR_PANEL_EFFECTIVE_DATE_OVERLAP"
            - "the refusal is priority 23, not priority 22 (both panels cleared appeal_period_end_date 2026-10-30 <= clock and lfd_issued_at + 180d == 2027-04-28 <= 2027-05-01) and not priority 25 (sequence 2 == 1 + 1, and the successor's own supersession keeps exactly one EFFECTIVE panel per family)"
            - "the whole 5-hop cascade is suppressed by the rejection: MapPanel.${a2_id}.revision_status == LFD_ISSUED and MapPanel.${a1_id}.revision_status == EFFECTIVE with MapPanel.${a1_id}.superseded_at == null"
            - "NON-OVERLAP side: MapPanel.${b2_id}.revision_status == EFFECTIVE and MapPanel.${b1_id}.revision_status == SUPERSEDED with MapPanel.${b1_id}.superseded_at == 2027-05-01T00:00:00Z"
            - "so family B's half-open intervals are [2020-06-05, 2027-05-01) then [2020-06-06, null) - they overlap in wall-clock time but the ORDERING constraint is on effective_date, not on superseded_at"
            - "the two families are independent resources: A2's rejection did not touch B1/B2, and GET /flood-zone/map-panels?community_id=${c_fl_id} shows exactly two EFFECTIVE panels (${a1_id} and ${b2_id}), one per map_panel_number"
            - "a re-attempt of POST /flood-zone/map-panels/${a2_id}/effective at any later clock value still returns 409 - the defect is in the stored effective_date and there is no update endpoint to repair it"

      - name: notice_cooldown_closed_window_inclusive_upper_bound
        grounds:
          - validations.priority_24_ERR_NOTICE_WINDOW_ACTIVE
          - entities.ComplianceNotice.response_deadline_at
          - calculations.compliance_posture
        distinguishing_aspect: |
          Interval semantics: CLOSED [sent_at, response_deadline_at +
          NOTICE_COOLDOWN_DAYS] - the upper bound is INCLUSIVE, so the last
          blocked instant and the first free instant are one day apart. The
          resource is a per-(loan_folio, notice_type) obligation slot, not the
          per-(community, map_panel_number) panel slot of the other instance,
