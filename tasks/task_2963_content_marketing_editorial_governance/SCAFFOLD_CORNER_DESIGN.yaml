  - section: rbac
    # Table 7 of the claim-extraction guide states its two claims as bullets rather than a
    # claim_type table, so the two labels below are those bullets verbatim; the third label
    # is the "Segregation of duties" row of the same table's role-model matrix, selected by
    # complexity_profile.role_model = segregation_of_duties.
    instances:
      - name: every_exclusive_write_denies_all_five_other_roles_with_the_same_code
        claim_type: "Cannot perform other roles' exclusive_operations"
        grounds:
          - rbac.ManagingEditor
          - rbac.LegalReviewer
          - rbac.AnalyticsService
