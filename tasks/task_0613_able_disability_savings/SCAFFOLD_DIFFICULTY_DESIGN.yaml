              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2026-06-30" }
