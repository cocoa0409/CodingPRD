# =============================================================================
# Task 1588: Rice Mill & Drying Facility — §1.8 Scaffold Difficulty Design
# (Test Targeting Index: 9 Difficulty Rules x >=2 instances, 24 instances)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: shrink_handheld_vs_official_moisture
        grounds:
          - calculations.paddy_dry_weight
          - entities.PaddyLot.fields.provisional_dry_weight_cwt
          - entities.PaddyLot.fields.dry_weight_cwt
        distinguishing_aspect: |
          Weight-domain dual variant on PaddyLot: the same truckload yields
          provisional_dry_weight_cwt = 340.32 from the scale handheld reading
          (18.0%) but dry_weight_cwt = 338.24 from the official lab reading
          (18.5%); a 0.5-point moisture basis difference moves 2.08 cwt.
        test_recipe:
          setup:
            - "Season INTAKE_OPEN, spot cap 2, intake window 2026-08-01..2026-10-31"
            - "Grower FARM-001 with no advance"
            - "One SPOT lot: gross 48300 lbs, tare 12000 lbs (net 363.00 cwt), handheld moisture 18.0"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 18.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l_id: $.data.id, prov_dry: $.data.provisional_dry_weight_cwt, net_wet: $.data.net_wet_cwt }
          trigger:
            - call: "POST /mill/lots/${l_id}/grade"
              payload: { moisture_pct_official: 18.5, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
              captures: { final_dry: $.data.dry_weight_cwt, grade: $.data.grade, charge: $.data.drying_charge_cents, score: $.data.grade_score }
          assert:
            - "captured prov_dry == 340.32 (handheld 18.0: shrink 5.0/87 + 0.5% handling)"
            - "captured net_wet == 363.00"
            - "captured final_dry == 338.24 (official 18.5: shrink 5.5/87 + 0.5% handling)"
            - "captured score == 4.0 and captured grade == US_NO_2"
            - "captured charge == 10709 (points 5.5: 3*4 + 2.5*7 = 29.5 cents/cwt x 363.00 cwt = 10708.5, round_half_up)"
            - "GET /mill/lots/${l_id}: provisional_dry_weight_cwt still 340.32 while dry_weight_cwt == 338.24 (both variants retained)"

      - name: settlement_checkoff_per_line_vs_aggregate
        grounds:
          - calculations.settlement_amount
          - entities.Settlement.fields.provisional_checkoff_cents
          - entities.Settlement.fields.final_checkoff_cents
        distinguishing_aspect: |
          Money-domain dual variant on Settlement (different entity domain than
          PaddyLot shrink): identical lots produce provisional_checkoff_cents
          = 1003 (per-line round then sum) but final_checkoff_cents = 1002
          (sum exact then round once), a 1-cent divergence.
        test_recipe:
          setup:
            - "Season INTAKE_OPEN; Grower FARM-002 no advance; contract 250.00 cwt LONG_GRAIN base 1000 cents, all grade_adjustments 0"
            - "Lot A net 100.10 cwt and Lot B net 100.30 cwt, both official moisture 13.0, grade US_NO_1; both BINNED in bin B (cap 500)"
            - "Season INTAKE_CLOSED; settlement created over period 2026-08-01..2026-08-31 (graded_date == 2026-08-01 default clock)"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-002", legal_name: "Bayou Grain" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/contracts"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", contracted_cwt: 250.00, base_price_cents_per_cwt: 1000, grade_adjustments: { US_NO_1: 0, US_NO_2: 0, US_NO_3: 0, US_NO_4: 0, US_NO_5: 0, SAMPLE: 0 } }
              as: Merchandiser
              captures: { c_id: $.data.id, c_ver: $.data.version }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${c_ver}", gross_weight_lbs: 22010, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 13.0 }
              as: ScaleOperator
              captures: { la_id: $.data.id }
            - call: "POST /mill/lots/${la_id}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${la_id}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "GET /mill/contracts/${c_id}"
              as: Merchandiser
              captures: { c_ver2: $.data.version }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${c_ver2}", gross_weight_lbs: 22030, tare_weight_lbs: 12000, scheduled_date: "2026-08-11", moisture_pct_handheld: 13.0 }
              as: ScaleOperator
              captures: { lb_id: $.data.id }
            - call: "POST /mill/lots/${lb_id}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${lb_id}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "POST /mill/seasons/${s_id}/close-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/settlements"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: SettlementClerk
              as_user_id: "clerk-1"
              captures: { st_id: $.data.id, prov_net: $.data.provisional_net_cents, prov_chk: $.data.provisional_checkoff_cents }
          trigger:
            - call: "POST /mill/settlements/${st_id}/issue-provisional"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-1"
            - call: "POST /mill/seasons/${s_id}/begin-settlement-review"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/settlements/${st_id}/approve"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-2"
              captures: { fin_net: $.data.final_net_cents, fin_chk: $.data.final_checkoff_cents, fin_gross: $.data.final_gross_cents }
          assert:
            - "captured prov_chk == 1003 (round(100100*0.005)=501 + round(100300*0.005)=502)"
            - "captured prov_net == 199397 (200400 - 0 drying - 1003 - 0 advance)"
            - "captured fin_gross == 200400"
            - "captured fin_chk == 1002 (round(200400*0.005) rounded once)"
            - "captured fin_net == 199398"
            - "fin_net - prov_net == 1 cent (rounding-variant divergence on identical lots)"

      - name: mill_yield_estimated_vs_actual
        grounds:
          - calculations.milling_yield_split
          - entities.MillRun.fields.est_head_cwt
          - entities.MillRun.fields.act_head_cwt
        distinguishing_aspect: |
          Inventory-domain dual variant on MillRun (third distinct entity
          domain): completing a 200.00 cwt LONG_GRAIN run credits standard
          estimates (head 81.60) while verification with measured outputs
          replaces them (head 80.00) and posts a signed inventory delta.
        test_recipe:
          setup:
            - "Season INTAKE_OPEN; grower; SPOT lot net 300.00 cwt, official moisture 13.0 (no shrink); stored in bin B (cap 500) -> stock 300.00"
            - "Mill run over bin B with input_cwt 200.00, started"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 42000, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 13.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { l_id: $.data.id }
            - call: "POST /mill/lots/${l_id}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${l_id}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "POST /mill/mill-runs"
              payload: { season_id: "${s_id}", input_bin_id: "${b_id}", input_cwt: 200.00 }
              as: MillSupervisor
              captures: { mr_id: $.data.id }
            - call: "POST /mill/mill-runs/${mr_id}/start"
              payload: {}
              as: MillSupervisor
            - call: "POST /mill/mill-runs/${mr_id}/complete"
              payload: {}
              as: MillSupervisor
              captures: { est_head: $.data.est_head_cwt, est_broken: $.data.est_broken_cwt, est_brewers: $.data.est_brewers_cwt, est_bran: $.data.est_bran_cwt, est_hull: $.data.est_hull_cwt, est_loss: $.data.est_loss_cwt }
          trigger:
            - call: "POST /mill/mill-runs/${mr_id}/verify"
              payload: { act_head_cwt: 80.00, act_broken_cwt: 48.00, act_brewers_cwt: 7.00, act_bran_cwt: 16.50, act_hull_cwt: 44.50 }
              as: MillSupervisor
              captures: { act_loss: $.data.act_loss_cwt, mr_status: $.data.status }
            - call: "GET /mill/seasons/${s_id}/byproduct-inventory"
              as: MillSupervisor
              captures: { inv_head: $.data.HEAD_RICE, inv_bran: $.data.BRAN }
          assert:
            - "captured est_head == 81.60, est_brewers == 6.80, est_broken == 47.60 (plug), est_bran == 16.00, est_loss == 4.00, est_hull == 44.00 (plug)"
            - "conservation at complete: 81.60 + 47.60 + 6.80 + 16.00 + 44.00 + 4.00 == 200.00"
            - "captured mr_status == VERIFIED and captured act_loss == 4.00 (200.00 - 196.00 plug)"
            - "captured inv_head.produced_cwt == 80.00 (actual replaces estimate, delta -1.60)"
            - "captured inv_bran.produced_cwt == 16.50 (delta +0.50)"

  - rule_id: combinatorial_formula
    instances:
      - name: drying_charge_tiered_marginal_rates
        grounds:
          - calculations.drying_charge
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >=3 inputs (moisture points, wet
          weight, three tier breakpoints/rates) with non-linear marginal tier
          selection; points exactly 3.0 stays entirely in tier 1 (charge 4356)
          while 6.5 points straddles all three tiers (charge 14157).
        test_recipe:
          setup:
            - "Season INTAKE_OPEN, spot cap 2; grower FARM-001"
            - "Lot A net 363.00 cwt graded at official moisture 16.0 (exactly 3.0 points over base)"
            - "Lot B net 363.00 cwt graded at official moisture 19.5 (6.5 points over base)"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 16.0, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { la_id: $.data.id }
            - call: "POST /mill/lots/${la_id}/grade"
              payload: { moisture_pct_official: 16.0, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
              captures: { charge_a: $.data.drying_charge_cents }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "SPOT", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-11", moisture_pct_handheld: 19.5, spot_price_cents_per_cwt: 1300 }
              as: ScaleOperator
              captures: { lb_id: $.data.id }
            - call: "POST /mill/lots/${lb_id}/grade"
              payload: { moisture_pct_official: 19.5, foreign_matter_pct: 0.4, damage_pct: 0.4, broken_pct: 2.0 }
              as: QualityLabTech
              captures: { charge_b: $.data.drying_charge_cents, dry_b: $.data.dry_weight_cwt }
          trigger: []
          assert:
            - "captured charge_a == 4356 (points 3.0 exactly: rate 3*4 = 12 cents/cwt; 363.00 * 12)"
            - "captured charge_b == 14157 (points 6.5: 3*4 + 3*7 + 0.5*12 = 39 cents/cwt; 363.00 * 39)"
            - "captured dry_b == 334.06 (shrink 100*6.5/87 = 7.4712644% + 0.5 handling = 7.9712644%; 363.00 * 0.9202874 = 334.06)"
            - "tier boundary honored: exactly 3.0 points uses only tier-1 rate"

      - name: settlement_three_line_rounding_order
        grounds:
          - calculations.settlement_amount
        distinguishing_aspect: |
          Mode (b) combinatorial formula: nested rounding where order matters —
          per-line checkoff rounding then sum (1507) vs sum-then-round (1505)
          diverge by 2 cents over three lots; the scaffold pins per-line for
          provisional and aggregate for final.
        test_recipe:
          setup:
            - "Season; grower FARM-002; contract 400.00 cwt LONG_GRAIN base 1000, adjustments 0"
            - "Three BINNED contract lots graded US_NO_1 with net/dry 100.10, 100.30, 100.50 cwt (M 13.0, no shrink)"
            - "Settlement over the period, issued then approved"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-002", legal_name: "Bayou Grain" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/contracts"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", contracted_cwt: 400.00, base_price_cents_per_cwt: 1000, grade_adjustments: { US_NO_1: 0, US_NO_2: 0, US_NO_3: 0, US_NO_4: 0, US_NO_5: 0, SAMPLE: 0 } }
              as: Merchandiser
              captures: { c_id: $.data.id, cv1: $.data.version }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${cv1}", gross_weight_lbs: 22010, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 13.0 }
              as: ScaleOperator
              captures: { l1: $.data.id }
            - call: "POST /mill/lots/${l1}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${l1}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "GET /mill/contracts/${c_id}"
              as: Merchandiser
              captures: { cv2: $.data.version }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${cv2}", gross_weight_lbs: 22030, tare_weight_lbs: 12000, scheduled_date: "2026-08-11", moisture_pct_handheld: 13.0 }
              as: ScaleOperator
              captures: { l2: $.data.id }
            - call: "POST /mill/lots/${l2}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${l2}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "GET /mill/contracts/${c_id}"
              as: Merchandiser
              captures: { cv3: $.data.version }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${cv3}", gross_weight_lbs: 22050, tare_weight_lbs: 12000, scheduled_date: "2026-08-12", moisture_pct_handheld: 13.0 }
              as: ScaleOperator
              captures: { l3: $.data.id }
            - call: "POST /mill/lots/${l3}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "POST /mill/lots/${l3}/store"
              payload: { bin_id: "${b_id}" }
              as: ScaleOperator
            - call: "POST /mill/seasons/${s_id}/close-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/settlements"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: SettlementClerk
              as_user_id: "clerk-1"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /mill/settlements/${st_id}/issue-provisional"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-1"
            - call: "GET /mill/settlements/${st_id}"
              as: SettlementClerk
              captures: { prov_chk: $.data.provisional_checkoff_cents, prov_net: $.data.provisional_net_cents }
            - call: "POST /mill/seasons/${s_id}/begin-settlement-review"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/settlements/${st_id}/approve"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-2"
              captures: { fin_chk: $.data.final_checkoff_cents, fin_net: $.data.final_net_cents }
          assert:
            - "captured prov_chk == 1507 (501 + 503 + 503 per-line round_half_up of x.5 values)"
            - "captured prov_net == 299393 (300900 - 1507)"
            - "captured fin_chk == 1505 (round_half_up(300900 * 0.005) = round_half_up(1504.5))"
            - "captured fin_net == 299395 (300900 - 1505)"
            - "rounding-order divergence == 2 cents on identical input set"

      - name: settlement_advance_waterfall_order_pinned
        grounds:
          - calculations.settlement_amount
          - entities.Grower.fields.advance_outstanding_cents
        distinguishing_aspect: |
          Mode (c) combinatorial formula: the evaluation order gross -> drying
          -> checkoff -> advance -> net is pinned to break the circular-looking
          dependency (advance sized on net-after-fees while net subtracts the
          advance); with advance 119500 and fees 600, repay clamps to 119400
          and net lands exactly 0 instead of going negative.
        test_recipe:
          setup:
            - "Season; grower FARM-003 with advance_issued_cents 119500"
            - "Contract 200.00 cwt LONG_GRAIN base 1200 adjustments 0; one BINNED lot dry 100.00 cwt US_NO_1 (value 120000)"
            - "Settlement approved and paid"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-003", legal_name: "Prairie Rice Co", advance_issued_cents: 119500 }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/contracts"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", contracted_cwt: 200.00, base_price_cents_per_cwt: 1200, grade_adjustments: { US_NO_1: 0, US_NO_2: 0, US_NO_3: 0, US_NO_4: 0, US_NO_5: 0, SAMPLE: 0 } }
              as: Merchandiser
              captures: { c_id: $.data.id, cv1: $.data.version }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
            - call: "POST /mill/lots"
