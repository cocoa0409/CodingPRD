            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R14", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r14: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r14}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r14}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 20.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/packaging-lines", payload: { name: "LP-5", line_type: "LOOSE_PACK" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { ln: $.data.id } }
            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-05T08:00:00Z", planned_end: "2026-08-05T10:00:00Z", planned_units: 100 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { run1: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-05T10:00:00Z", planned_end: "2026-08-05T12:00:00Z", planned_units: 100 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { run2: $.data.id } }
            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-05T09:30:00Z", planned_end: "2026-08-05T10:30:00Z", planned_units: 100 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { err: $.data.error_id } }
          assert:
            - "adjacent window 10:00-12:00 after 08:00-10:00 is ACCEPTED (half-open): ProductionRun created (${run2} present)"
            - "overlapping window 09:30-10:30 is rejected: ${err} == ERR_LINE_WINDOW_CONFLICT"

      - name: certificate_closed_interval_adjacency_rejected
        grounds:
          - state_machines.CertificateGrant
          - validations[priority=9]
          - errors[ERR_CERT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource = CertificateGrant scoped to (supplier_id, cert_type),
          interval semantics = CLOSED [valid_from, valid_until]: a second
          grant whose valid_from equals the first grant's valid_until
          (2026-06-30 == 2026-06-30) OVERLAPS and is rejected — the opposite
          adjacency treatment from the line's half-open windows — while a
          FAIR_TRADE grant over the same dates is accepted.
        test_recipe:
          setup:
            - "Supplier ACTIVE; one ACTIVE ORGANIC grant covering 2026-01-01..2026-06-30"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Cert Co", origin_region: "Yunnan" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/certificates", payload: { supplier_id: "${sup}", cert_type: "ORGANIC", total_volume_kg: 5000.0, valid_from: "2026-01-01", valid_until: "2026-06-30" }, as: CertificationOfficer, as_user_id: "co-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/certificates", payload: { supplier_id: "${sup}", cert_type: "ORGANIC", total_volume_kg: 5000.0, valid_from: "2026-06-30", valid_until: "2026-12-31" }, as: CertificationOfficer, as_user_id: "co-1", captures: { err: $.data.error_id } }
            - { call: "POST /tea-ops/certificates", payload: { supplier_id: "${sup}", cert_type: "FAIR_TRADE", total_volume_kg: 5000.0, valid_from: "2026-03-01", valid_until: "2026-09-30" }, as: CertificationOfficer, as_user_id: "co-1", captures: { c3: $.data.id } }
          assert:
            - "adjacent ORGANIC grant (valid_from 2026-06-30 == existing valid_until 2026-06-30) rejected: ${err} == ERR_CERT_WINDOW_CONFLICT (closed intervals share the boundary date)"
            - "overlapping FAIR_TRADE grant for the same supplier is ACCEPTED (${c3} present) — the conflict scope is (supplier_id, cert_type)"

  # ------------------------------------------------------------- Rule 9 ----
  - rule_id: compensating_invariant
    instances:
      - name: lot_mass_conservation_on_batch_cancel
        grounds:
          - entities.LeafLot.fields.remaining_weight_kg
          - state_machines.BlendBatch.RECIPE_LOCKED_to_CANCELLED
          - state_machines.LeafLot.RELEASED_to_DEPLETED
        distinguishing_aspect: |
          Conserved quantity = leaf mass per lot: remaining_weight_kg ==
          weight_kg - sum(ACTIVE allocations). Allocation drains (60 -> 40 ->
          0 with auto-DEPLETED); the compensating batch cancel restores
          (0 -> 20) and auto-releases the lot, leaving zero drift.
        test_recipe:
          setup:
            - "Supplier ACTIVE; lots L1 60.0 kg and L2 40.0 kg BLACK RELEASED; CONVENTIONAL TEA_BAG recipe ACTIVE; batch1 target 20.0 allocated 20.0 from L1; batch2 target 80.0 allocated 40.0 (L1) + 40.0 (L2) — both lots fully drained"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Mass Co", origin_region: "Jorhat" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-01-15", weight_kg: 60.0, cost_per_kg_cents: 1000, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l1: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l1}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l1}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-01-16", weight_kg: 40.0, cost_per_kg_cents: 1000, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l2: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l2}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${l2}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R15", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "BLACK", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r15: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r15}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r15}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b1: $.data.id } }
            - { call: "POST /tea-ops/batches/${b1}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { b1v: $.data.version } }
            - { call: "POST /tea-ops/batches/${b1}/allocations", payload: { lot_id: "${l1}", allocated_kg: 20.0, expected_batch_version: "${b1v}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/leaf-lots/${l1}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { rem1: $.data.remaining_weight_kg } }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r15}", target_weight_kg: 80.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b2: $.data.id } }
            - { call: "POST /tea-ops/batches/${b2}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { b2v: $.data.version } }
            - { call: "POST /tea-ops/batches/${b2}/allocations", payload: { lot_id: "${l1}", allocated_kg: 40.0, expected_batch_version: "${b2v}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/batches/${b2}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { b2v3: $.data.version } }
            - { call: "POST /tea-ops/batches/${b2}/allocations", payload: { lot_id: "${l2}", allocated_kg: 40.0, expected_batch_version: "${b2v3}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/leaf-lots/${l1}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { rem2: $.data.remaining_weight_kg, st2: $.data.status } }
          trigger:
            - { call: "POST /tea-ops/batches/${b1}/cancel", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { b1_st: $.data.status } }
            - { call: "GET /tea-ops/leaf-lots/${l1}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { rem3: $.data.remaining_weight_kg, st3: $.data.status } }
            - { call: "GET /tea-ops/leaf-lots/${l1}/allocations", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
          assert:
            - "after 20.0 allocation: ${rem1} == 40.0 (60.0 - 20.0)"
            - "after batch2 drains the rest: ${rem2} == 0.0 and L1 auto-transitions to DEPLETED (${st2} == DEPLETED)"
            - "after batch1 cancel compensation: ${rem3} == 20.0 and ${st3} == RELEASED — invariant remaining == weight - sum(ACTIVE allocations) holds at every step"
            - "cancelled batch1 status: ${b1_st} == CANCELLED; batch2 and its allocations are untouched"

      - name: certificate_volume_conservation_on_recall
        grounds:
          - calculations.certificate_volume_ledger
          - state_machines.BlendBatch.QC_REVIEW_to_RELEASED
          - state_machines.BlendBatch.RELEASED_to_RECALLED
        distinguishing_aspect: |
          Conserved quantity = certified mass-balance volume (different from
          instance 1's leaf mass): release consumes 50.0 kg of ORGANIC volume;
          the compensating recall restores exactly 50.0 kg, returning
          consumed_volume_kg to 0.0 with no drift.
        test_recipe:
          setup:
            - "Supplier ACTIVE with ORGANIC cert (1000.0 kg, window covers default clock 2026-08-01); GREEN lots 35.0 + 15.0 kg RELEASED; ORGANIC LOOSE_PACK recipe ACTIVE; batch target 50.0 (allocations 35.0 + 15.0, max share exactly 70%)"
          setup_api_calls:
