# =============================================================================
# task_1059 — Self-Serve Event Ticketing & Registration (Eventbrite style)
# Seed tables §1.0–§1.7
# =============================================================================

scenario: |
  1059. Self-Serve Event Ticketing & Registration (Eventbrite style): event & ticket
  type/tier, order & fee (pass-on), promo & reserved-seating, check-in/scan & attendee,
  payout & rolling-reserve, refund/transfer, waitlist, organizer reporting

domain_name: event-ticketing-selfserve
api_prefix: /api

complexity_profile:
  difficulty: Expert
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_free
  role_model: segregation_of_duties
  consistency_model: immediate

  entity_count: 15
  state_machine_count: 7
  calculation_count: 7
  endpoint_count: 68
  error_code_count: 53
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Global constants (every constant referenced in any formula or rule)
# =============================================================================
global_constants:
  DEFAULT_CLOCK_UTC: "2026-07-01T00:00:00Z"
  FEE_TIER_1_MAX_FACE_CENTS: 2500
  FEE_TIER_1_RATE: 0.020
  FEE_TIER_2_MAX_FACE_CENTS: 10000
  FEE_TIER_2_RATE: 0.037
  FEE_TIER_3_RATE: 0.050
  PLATFORM_FEE_FLAT_CENTS: 179
  PLATFORM_FEE_MIN_CENTS: 99
  PLATFORM_FEE_CAP_CENTS: 2500
  PROMO_MIN_SUBTOTAL_CENTS: 5000
  PROMO_MAX_DISCOUNT_PCT: 0.30
  SEAT_HOLD_MINUTES: 15
  VENUE_TURNAROUND_MINUTES: 90
  WAITLIST_OFFER_TTL_HOURS: 24
  TRANSFER_OFFER_TTL_HOURS: 72
  MAX_TICKETS_PER_BUYER_PER_EVENT: 10
  CHECK_IN_WINDOW_BEFORE_MINUTES: 120
  CHECK_IN_WINDOW_AFTER_MINUTES: 60
  REFUND_REQUEST_WINDOW_DAYS: 30
  RELIABILITY_TRAILING_EVENTS: 2
  RELIABILITY_DEFAULT_SCORE: 75
  RELIABILITY_WEIGHT_REFUND: 0.45
  RELIABILITY_WEIGHT_CHECKIN: 0.35
  RELIABILITY_WEIGHT_CANCEL: 0.20
  RESERVE_TIER_A_MIN_SCORE: 90
  RESERVE_TIER_A_RATE: 0.00
  RESERVE_TIER_B_MIN_SCORE: 70
  RESERVE_TIER_B_RATE: 0.05
  RESERVE_TIER_C_MIN_SCORE: 50
  RESERVE_TIER_C_RATE: 0.10
  RESERVE_TIER_D_RATE: 0.20
  ROLLING_RESERVE_RELEASE_DAYS: 90

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organizer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Public organizer name" }
      - { name: contact_email, type: string, source: input, description: "Billing/contact email" }
      - { name: lifetime_gross_cents, type: integer, source: computed, default: 0, description: "Running sum of Order.organizer_gross_cents over every Order whose payment_status entered PAID for any Event owned by this Organizer" }
      - { name: lifetime_refunds_cents, type: integer, source: computed, default: 0, description: "Running sum of RefundRequest.organizer_charged_cents over every RefundRequest that reached SETTLED for any Event owned by this Organizer" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: city, type: string, source: input, description: "City name" }
      - { name: seated_capacity, type: integer, source: input, description: "Physical capacity of the venue", constraints: ">= 1" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Buyer email, unique across Buyers" }
      - { name: display_name, type: string, source: input, description: "Buyer display name" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: organizer_id, type: string, source: input, description: "FK -> Organizer.id; owning organizer" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue this event occupies" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC event start instant" }
      - { name: ends_at, type: datetime, source: input, description: "ISO 8601 UTC event end instant", constraints: "must be strictly after starts_at" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle state", constraints: "DRAFT | ONSALE | PAUSED | SALES_CLOSED | COMPLETED | CANCELLED" }
      - { name: fee_mode, type: enum, source: input, default: PASS_ON, description: "Who bears the platform fee", constraints: "PASS_ON | ABSORB" }
      - { name: refund_policy, type: enum, source: input, default: FEE_RETAINED, description: "Default refund variant applied when a RefundRequest omits policy", constraints: "FEE_RETAINED | FEE_INCLUDED" }
      - { name: gross_cents, type: integer, source: computed, default: 0, description: "Sum of Order.organizer_gross_cents for Orders of this Event whose payment_status IN {PAID, REFUND_PENDING, PARTIALLY_REFUNDED, REFUNDED}" }
      - { name: refunds_cents, type: integer, source: computed, default: 0, description: "Sum of RefundRequest.organizer_charged_cents for SETTLED RefundRequests on Orders of this Event" }
      - { name: issued_count, type: integer, source: computed, default: 0, description: "Count of Attendee rows for this Event with status IN {ISSUED, CHECKED_IN, TRANSFERRED}" }
      - { name: checked_in_count, type: integer, source: computed, default: 0, description: "Count of Attendee rows for this Event with status == CHECKED_IN" }

  - name: TicketType
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event this tier belongs to" }
      - { name: name, type: string, source: input, description: "Tier name (e.g. General, VIP)" }
      - { name: tier_rank, type: integer, source: input, description: "Ordinal rank of the tier; 1 is the lowest tier", constraints: ">= 1" }
      - { name: price_cents, type: integer, source: input, description: "Face value per ticket in cents", constraints: ">= 0" }
      - { name: quantity_total, type: integer, source: input, description: "Total sellable inventory for this tier", constraints: ">= 1" }
      - { name: seating_mode, type: enum, source: input, default: GA, description: "Seating model for this tier", constraints: "GA | RESERVED" }
      - { name: sold_count, type: integer, source: computed, default: 0, description: "Count of Attendee rows for this TicketType with status IN {ISSUED, CHECKED_IN, TRANSFERRED}" }
      - { name: held_count, type: integer, source: computed, default: 0, description: "Sum of OrderItem.quantity across Orders of this TicketType with fulfillment_status == HELD and hold_expires_at > current_utc, plus sum of WaitlistEntry.requested_quantity for entries with status == OFFERED and offer_expires_at > current_utc" }

  - name: SeatBlock
    parent: TicketType
    common_fields: true
    fields:
      - { name: ticket_type_id, type: string, source: input, description: "FK -> TicketType.id; the RESERVED tier this block of seats belongs to" }
      - { name: row_label, type: string, source: input, description: "Row label, unique per ticket_type_id" }
      - { name: seat_from, type: integer, source: input, description: "First seat number in the block, inclusive", constraints: ">= 1" }
      - { name: seat_to, type: integer, source: input, description: "Last seat number in the block, inclusive", constraints: ">= seat_from" }
      - { name: seats_total, type: integer, source: computed, description: "seat_to - seat_from + 1" }
      - { name: seats_taken, type: integer, source: computed, default: 0, description: "Count of seat numbers in this block currently occupied: occupied by an Attendee with status IN {ISSUED, CHECKED_IN, TRANSFERRED}, or reserved by an OrderItem of an Order with fulfillment_status == HELD and hold_expires_at > current_utc" }

  - name: PromoCode
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event this code is scoped to" }
      - { name: code, type: string, source: input, description: "Promo code string, unique per event_id" }
      - { name: kind, type: enum, source: input, description: "Discount kind", constraints: "PERCENT | FIXED" }
      - { name: percent_bp, type: integer, source: input, default: 0, description: "Discount in basis points when kind == PERCENT (1000 = 10%)", constraints: "0..10000" }
      - { name: amount_cents, type: integer, source: input, default: 0, description: "Flat discount in cents when kind == FIXED", constraints: ">= 0" }
      - { name: max_uses, type: integer, source: input, description: "Maximum number of Orders that may consume this code", constraints: ">= 1" }
      - { name: uses_count, type: integer, source: computed, default: 0, description: "Count of Orders with promo_code_id == this.id and fulfillment_status IN {HELD, ISSUED, CHECKED_IN_PARTIAL, CHECKED_IN_FULL}" }
      - { name: valid_from, type: datetime, source: input, description: "Redemption window opens at this instant, inclusive" }
      - { name: valid_until, type: datetime, source: input, description: "Redemption window closes at this instant, exclusive" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event being purchased" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; purchasing buyer" }
      - { name: promo_code_id, type: string, source: computed, default: null, description: "FK -> PromoCode.id; resolved from the promo_code string supplied at creation, null when none" }
      - { name: payment_status, type: enum, source: system, default: PENDING, description: "Payment dimension of the parallel state machine", constraints: "PENDING | PAID | REFUND_PENDING | PARTIALLY_REFUNDED | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, default: HELD, description: "Fulfillment dimension of the parallel state machine", constraints: "HELD | ISSUED | EXPIRED | VOIDED | CHECKED_IN_PARTIAL | CHECKED_IN_FULL" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderItem.line_face_cents" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Promo discount applied to subtotal_cents" }
      - { name: fee_total_cents, type: integer, source: computed, description: "Sum of OrderItem.line_fee_cents" }
      - { name: buyer_total_cents, type: integer, source: computed, description: "Amount the buyer is charged" }
      - { name: organizer_gross_cents, type: integer, source: computed, description: "Amount credited to the organizer before reserve" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Running sum of RefundRequest.refund_amount_cents for SETTLED refunds on this Order" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "current_utc + SEAT_HOLD_MINUTES at creation; the hold is live while current_utc < hold_expires_at" }
      - { name: paid_at, type: datetime, source: computed, default: null, description: "Instant the order reached payment_status PAID" }

  - name: OrderItem
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: computed, description: "FK -> Order.id; owning order" }
      - { name: ticket_type_id, type: string, source: input, description: "FK -> TicketType.id; tier purchased on this line" }
      - { name: seat_block_id, type: string, source: input, default: null, description: "FK -> SeatBlock.id; required when the tier's seating_mode == RESERVED, null for GA" }
      - { name: quantity, type: integer, source: input, description: "Number of tickets on this line", constraints: ">= 1" }
      - { name: seat_numbers, type: array, source: input, default: [], description: "Explicit seat numbers within seat_block_id; length MUST equal quantity when seating_mode == RESERVED, MUST be empty for GA" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of TicketType.price_cents at order creation" }
      - { name: per_ticket_fee_cents, type: integer, source: computed, description: "Platform fee charged per ticket on this line" }
      - { name: line_face_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: line_fee_cents, type: integer, source: computed, description: "per_ticket_fee_cents * quantity" }

  - name: Attendee
    parent: OrderItem
    common_fields: true
    fields:
      - { name: order_id, type: string, source: computed, description: "FK -> Order.id; order that minted this attendee" }
      - { name: order_item_id, type: string, source: computed, description: "FK -> OrderItem.id; line that minted this attendee" }
      - { name: ticket_type_id, type: string, source: computed, description: "FK -> TicketType.id; tier of the admission" }
      - { name: event_id, type: string, source: computed, description: "FK -> Event.id; event the admission is valid for" }
      - { name: buyer_id, type: string, source: computed, description: "FK -> Buyer.id; current holder of the admission" }
      - { name: seat_block_id, type: string, source: computed, default: null, description: "FK -> SeatBlock.id; null for GA admissions" }
      - { name: seat_number, type: integer, source: computed, default: null, description: "Occupied seat number within seat_block_id, null for GA" }
      - { name: holder_email, type: string, source: computed, description: "Email of the current holder; equals Buyer.email of buyer_id" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "Admission state", constraints: "ISSUED | CHECKED_IN | TRANSFERRED | VOIDED" }
      - { name: checked_in_at, type: datetime, source: computed, default: null, description: "Instant of the accepted scan that set status CHECKED_IN" }

  - name: ScanRecord
    parent: Attendee
    common_fields: false
    fields:
      - { name: attendee_id, type: string, source: input, description: "FK -> Attendee.id; admission that was scanned" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event whose gate performed the scan" }
      - { name: gate_code, type: string, source: input, description: "Gate identifier that performed the scan" }
      - { name: scanned_at, type: datetime, source: computed, description: "current_utc at the moment the scan was accepted" }
      - { name: scanned_by_user_id, type: string, source: system, description: "X-User-ID of the GateStaff operator that performed the scan" }

  - name: RefundRequest
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being refunded" }
      - { name: policy, type: enum, source: input, description: "Refund calculation variant; defaults to the Event.refund_policy of the order's event when omitted", constraints: "FEE_RETAINED | FEE_INCLUDED" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Refund lifecycle state", constraints: "REQUESTED | APPROVED | REJECTED | SETTLED" }
      - { name: item_refunds, type: array, source: input, description: "List of { order_item_id, quantity } objects naming which line items and how many tickets are refunded" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Cents returned to the buyer" }
      - { name: platform_retained_cents, type: integer, source: computed, description: "Cents of platform fee the platform keeps" }
      - { name: organizer_charged_cents, type: integer, source: computed, description: "Cents debited from the organizer" }
      - { name: reason, type: string, source: input, description: "Free-text refund reason" }
      - { name: settled_at, type: datetime, source: computed, default: null, description: "Instant the refund reached SETTLED" }

  - name: TransferRequest
    parent: Attendee
    common_fields: true
    fields:
      - { name: attendee_id, type: string, source: input, description: "FK -> Attendee.id; admission being transferred" }
      - { name: from_buyer_id, type: string, source: computed, description: "FK -> Buyer.id; holder at the time the request was created" }
      - { name: to_buyer_id, type: string, source: computed, default: null, description: "FK -> Buyer.id; accepting buyer, set on ACCEPTED" }
      - { name: to_email, type: string, source: input, description: "Email the transfer offer was sent to" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Transfer lifecycle state", constraints: "DRAFT | SENT | ACCEPTED | DECLINED | EXPIRED" }
      - { name: offer_expires_at, type: datetime, source: computed, default: null, description: "current_utc + TRANSFER_OFFER_TTL_HOURS, refreshed on every send" }
      - { name: resend_count, type: integer, source: computed, default: 0, description: "Number of times the offer moved into SENT after a DECLINED" }

  - name: WaitlistEntry
    parent: TicketType
    common_fields: true
    fields:
      - { name: ticket_type_id, type: string, source: input, description: "FK -> TicketType.id; tier waited on" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; waiting buyer" }
      - { name: claimed_order_id, type: string, source: computed, default: null, description: "FK -> Order.id; order created by claiming the offer" }
      - { name: requested_quantity, type: integer, source: input, description: "Tickets the buyer wants", constraints: "1..MAX_TICKETS_PER_BUYER_PER_EVENT" }
      - { name: status, type: enum, source: system, default: WAITING, description: "Waitlist state", constraints: "WAITING | OFFERED | CLAIMED | EXPIRED" }
      - { name: offered_at, type: datetime, source: computed, default: null, description: "Instant the sweep offered capacity to this entry" }
      - { name: offer_expires_at, type: datetime, source: computed, default: null, description: "offered_at + WAITLIST_OFFER_TTL_HOURS; the offer is live while current_utc < offer_expires_at" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: organizer_id, type: string, source: input, description: "FK -> Organizer.id; payee" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event being settled" }
      - { name: status, type: enum, source: system, default: ACCRUING, description: "Payout lifecycle state", constraints: "ACCRUING | ELIGIBLE | ON_HOLD | APPROVED | RELEASED" }
      - { name: gross_cents, type: integer, source: computed, description: "Step 1 of payout_net_amount" }
      - { name: refunds_cents, type: integer, source: computed, description: "Step 2 of payout_net_amount" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Step 3 of payout_net_amount" }
      - { name: reserve_basis_cents, type: integer, source: computed, description: "Step 4 of payout_net_amount" }
      - { name: reserve_rate, type: number, source: computed, description: "Step 5 of payout_net_amount; tier rate selected from reliability_score_snapshot" }
      - { name: reserve_cents, type: integer, source: computed, description: "Step 6 of payout_net_amount" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Step 7 of payout_net_amount" }
      - { name: reliability_score_snapshot, type: integer, source: computed, description: "organizer_reliability_score TRAILING variant, frozen at payout creation and never recomputed" }
      - { name: reserve_release_at, type: datetime, source: computed, description: "Event.ends_at + ROLLING_RESERVE_RELEASE_DAYS" }
      - { name: reserve_released_cents, type: integer, source: computed, default: 0, description: "Reserve cents already paid out by release-reserve" }
      - { name: approved_by_user_id, type: string, source: computed, default: null, description: "X-User-ID of the FinanceOfficer that approved this payout" }
      - { name: released_by_user_id, type: string, source: computed, default: null, description: "X-User-ID of the FinanceOfficer that released this payout" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Event: cyclic (ONSALE <-> PAUSED) ------------------------------------
  - entity: Event
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ONSALE
        trigger: "POST /api/events/{id}/publish"
        actor: Organizer
        preconditions:
          - "Event.status == DRAFT"
          - "at least one TicketType exists with ticket_type.event_id == Event.id"
          - "Event.starts_at > current_utc"
        side_effects:
          - "increments Event.version by 1"
      - from: ONSALE
        to: PAUSED
        trigger: "POST /api/events/{id}/pause"
        actor: Organizer
        preconditions:
          - "Event.status == ONSALE"
        side_effects:
          - "increments Event.version by 1"
          - "existing Orders with fulfillment_status == HELD keep their hold_expires_at unchanged"
      - from: PAUSED
        to: ONSALE
        trigger: "POST /api/events/{id}/resume"
        actor: Organizer
        preconditions:
          - "Event.status == PAUSED"
          - "Event.starts_at > current_utc"
        side_effects:
          - "increments Event.version by 1"
        note: "Cycle: ONSALE -> PAUSED -> ONSALE may repeat without bound."
      - from: ONSALE
        to: SALES_CLOSED
        trigger: "POST /api/events/{id}/close-sales"
        actor: Organizer
        preconditions:
          - "Event.status IN {ONSALE, PAUSED}"
        side_effects:
          - "increments Event.version by 1"
          - "every Order of this Event with fulfillment_status == HELD is set to fulfillment_status EXPIRED and its held seats are released, decrementing SeatBlock.seats_taken by the released seat count and recomputing TicketType.held_count"
      - from: PAUSED
        to: SALES_CLOSED
        trigger: "POST /api/events/{id}/close-sales"
        actor: Organizer
        preconditions:
          - "Event.status IN {ONSALE, PAUSED}"
        side_effects:
          - "increments Event.version by 1"
          - "every Order of this Event with fulfillment_status == HELD is set to fulfillment_status EXPIRED and its held seats are released, decrementing SeatBlock.seats_taken by the released seat count and recomputing TicketType.held_count"
      - from: SALES_CLOSED
        to: COMPLETED
        trigger: "POST /api/events/{id}/complete"
        actor: Organizer
        preconditions:
          - "Event.status == SALES_CLOSED"
          - "Event.ends_at <= current_utc"
        side_effects:
          - "increments Event.version by 1"
          - "recomputes Event.gross_cents, Event.refunds_cents, Event.issued_count, Event.checked_in_count"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/events/{id}/cancel"
        actor: Organizer
        preconditions:
          - "Event.status IN {DRAFT, ONSALE, PAUSED, SALES_CLOSED}"
        side_effects:
          - "increments Event.version by 1"
      - from: ONSALE
        to: CANCELLED
        trigger: "POST /api/events/{id}/cancel"
        actor: Organizer
        preconditions:
          - "Event.status IN {DRAFT, ONSALE, PAUSED, SALES_CLOSED}"
        side_effects:
          - "CASCADE HOP 1 — increments Event.version by 1 and sets Event.status CANCELLED"
          - "CASCADE HOP 2 (caused by hop 1) — every Order of this Event with fulfillment_status IN {HELD, ISSUED, CHECKED_IN_PARTIAL, CHECKED_IN_FULL} is set to fulfillment_status VOIDED; every such Order with payment_status == PAID is set to payment_status REFUND_PENDING"
          - "CASCADE HOP 3 (caused by hop 2's Order VOIDED) — every Attendee whose order_id is one of those voided Orders and whose status IN {ISSUED, CHECKED_IN} is set to status VOIDED"
          - "CASCADE HOP 4 (caused by hop 3's Attendee VOIDED) — for each voided Attendee with a non-null seat_block_id, SeatBlock.seats_taken is decremented by 1 and TicketType.sold_count is decremented by 1"
          - "CASCADE HOP 5 (caused by hop 2's payment_status REFUND_PENDING) — for each Order that entered REFUND_PENDING, a RefundRequest is created with status APPROVED, policy FEE_INCLUDED, item_refunds covering every OrderItem at full remaining quantity, and its refund_amount_cents / platform_retained_cents / organizer_charged_cents computed by refund_amount"
          - "every WaitlistEntry with status IN {WAITING, OFFERED} on a TicketType of this Event is set to status EXPIRED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /api/events/{id}/cancel"
        actor: Organizer
        preconditions:
          - "Event.status IN {DRAFT, ONSALE, PAUSED, SALES_CLOSED}"
        side_effects:
          - "identical cascade to the ONSALE -> CANCELLED transition (hops 1-5)"
      - from: SALES_CLOSED
        to: CANCELLED
        trigger: "POST /api/events/{id}/cancel"
        actor: Organizer
        preconditions:
          - "Event.status IN {DRAFT, ONSALE, PAUSED, SALES_CLOSED}"
        side_effects:
          - "identical cascade to the ONSALE -> CANCELLED transition (hops 1-5)"

  # ---- Order: parallel dimensions (payment x fulfillment) -------------------
  - entity: Order
    initial_state: "payment_status=PENDING, fulfillment_status=HELD"
    terminal_states: ["fulfillment_status=EXPIRED", "fulfillment_status=VOIDED"]
    shape: parallel
    dimensions:
      payment_status: [PENDING, PAID, REFUND_PENDING, PARTIALLY_REFUNDED, REFUNDED]
      fulfillment_status: [HELD, ISSUED, EXPIRED, VOIDED, CHECKED_IN_PARTIAL, CHECKED_IN_FULL]
    transitions:
      - from: "payment_status=PENDING"
        to: "payment_status=PAID"
        trigger: "POST /api/orders/{id}/pay"
        actor: Buyer
        preconditions:
          - "Order.payment_status == PENDING"
          - "Order.fulfillment_status == HELD"
          - "current_utc < Order.hold_expires_at"
          - "Event.status == ONSALE (cross-entity: the Order's event_id must be ONSALE)"
        side_effects:
          - "sets Order.paid_at = current_utc"
          - "sets Order.fulfillment_status = ISSUED (the fulfillment dimension advances on the same call)"
          - "mints one Attendee per ticket across all OrderItems, each with status ISSUED; RESERVED lines mint one Attendee per entry in OrderItem.seat_numbers"
          - "increments TicketType.sold_count and recomputes TicketType.held_count for every affected tier"
          - "increments Organizer.lifetime_gross_cents by Order.organizer_gross_cents and increments Organizer.version by 1"
          - "recomputes Event.gross_cents and Event.issued_count"
          - "increments Order.version by 1"
      - from: "fulfillment_status=HELD"
        to: "fulfillment_status=ISSUED"
        trigger: "POST /api/orders/{id}/pay (same call as the payment dimension transition)"
        actor: Buyer
        preconditions:
          - "Order.fulfillment_status == HELD"
          - "current_utc < Order.hold_expires_at"
        side_effects:
          - "held seats become permanently occupied seats; SeatBlock.seats_taken is unchanged because the same seat numbers move from held to issued occupancy"
      - from: "fulfillment_status=HELD"
        to: "fulfillment_status=EXPIRED"
        trigger: "POST /api/orders/{id}/release"
        actor: Buyer
        preconditions:
          - "Order.fulfillment_status == HELD"
          - "Order.payment_status == PENDING"
        side_effects:
          - "releases every reserved seat: SeatBlock.seats_taken decremented by the number of seat_numbers on each OrderItem of this Order"
          - "recomputes TicketType.held_count"
          - "decrements PromoCode.uses_count by 1 when Order.promo_code_id is non-null"
          - "increments Order.version by 1"
      - from: "fulfillment_status=ISSUED"
        to: "fulfillment_status=CHECKED_IN_PARTIAL"
        trigger: "POST /api/scans (system re-derivation after an accepted scan)"
        actor: system
        preconditions:
          - "at least one Attendee of this Order has status CHECKED_IN and at least one has status ISSUED"
        side_effects:
          - "increments Order.version by 1"
      - from: "fulfillment_status=CHECKED_IN_PARTIAL"
        to: "fulfillment_status=CHECKED_IN_FULL"
        trigger: "POST /api/scans (system re-derivation after an accepted scan)"
        actor: system
        preconditions:
          - "every Attendee of this Order with status != VOIDED has status CHECKED_IN"
        side_effects:
          - "increments Order.version by 1"
      - from: "fulfillment_status=CHECKED_IN_FULL"
        to: "fulfillment_status=CHECKED_IN_PARTIAL"
        trigger: "POST /api/attendees/{id}/undo-check-in (system re-derivation)"
        actor: system
        preconditions:
          - "after the undo, at least one Attendee of this Order has status ISSUED and at least one has status CHECKED_IN"
        side_effects:
          - "increments Order.version by 1"
        note: "Cycle on the fulfillment dimension: ISSUED -> CHECKED_IN_PARTIAL -> CHECKED_IN_FULL -> CHECKED_IN_PARTIAL -> ISSUED."
      - from: "fulfillment_status=CHECKED_IN_PARTIAL"
        to: "fulfillment_status=ISSUED"
        trigger: "POST /api/attendees/{id}/undo-check-in (system re-derivation)"
        actor: system
        preconditions:
          - "after the undo, no Attendee of this Order has status CHECKED_IN"
        side_effects:
          - "increments Order.version by 1"
      - from: "payment_status=PAID"
        to: "payment_status=PARTIALLY_REFUNDED"
        trigger: "POST /api/refund-requests/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "Order.payment_status IN {PAID, REFUND_PENDING, PARTIALLY_REFUNDED}"
          - "Order.refunded_cents + RefundRequest.refund_amount_cents < Order.buyer_total_cents"
        side_effects:
          - "see the RefundRequest APPROVED -> SETTLED cascade"
      - from: "payment_status=PAID"
        to: "payment_status=REFUNDED"
        trigger: "POST /api/refund-requests/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "Order.refunded_cents + RefundRequest.refund_amount_cents == Order.buyer_total_cents"
        side_effects:
          - "see the RefundRequest APPROVED -> SETTLED cascade"
          - "sets Order.fulfillment_status = VOIDED"
      - from: "payment_status=REFUND_PENDING"
        to: "payment_status=REFUNDED"
        trigger: "POST /api/refund-requests/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "Order.payment_status == REFUND_PENDING"
          - "Order.refunded_cents + RefundRequest.refund_amount_cents == Order.buyer_total_cents"
        side_effects:
          - "see the RefundRequest APPROVED -> SETTLED cascade"

  # ---- Attendee: cyclic (ISSUED <-> CHECKED_IN) -----------------------------
  - entity: Attendee
    initial_state: ISSUED
    terminal_states: [VOIDED]
    shape: cyclic
    transitions:
      - from: ISSUED
        to: CHECKED_IN
        trigger: "POST /api/scans"
        actor: GateStaff
        preconditions:
          - "Attendee.status == ISSUED"
          - "Attendee.event_id == the scan's event_id"
          - "Event.status IN {ONSALE, PAUSED, SALES_CLOSED} (cross-entity gate)"
          - "Event.starts_at - CHECK_IN_WINDOW_BEFORE_MINUTES <= current_utc <= Event.ends_at + CHECK_IN_WINDOW_AFTER_MINUTES"
        side_effects:
          - "sets Attendee.checked_in_at = current_utc"
          - "creates a ScanRecord"
          - "recomputes Event.checked_in_count"
          - "re-derives Order.fulfillment_status to CHECKED_IN_PARTIAL or CHECKED_IN_FULL"
      - from: CHECKED_IN
        to: ISSUED
        trigger: "POST /api/attendees/{id}/undo-check-in"
        actor: GateStaff
        preconditions:
          - "Attendee.status == CHECKED_IN"
        side_effects:
          - "sets Attendee.checked_in_at = null"
          - "recomputes Event.checked_in_count"
          - "re-derives Order.fulfillment_status"
        note: "Cycle: ISSUED -> CHECKED_IN -> ISSUED may repeat without bound."
      - from: ISSUED
        to: TRANSFERRED
        trigger: "POST /api/transfer-requests/{id}/accept"
        actor: Buyer
        preconditions:
          - "Attendee.status == ISSUED"
        side_effects:
          - "sets Attendee.buyer_id = TransferRequest.to_buyer_id and Attendee.holder_email = the accepting Buyer.email"
          - "sets Attendee.status = TRANSFERRED, which remains scannable exactly like ISSUED"
      - from: TRANSFERRED
        to: CHECKED_IN
        trigger: "POST /api/scans"
        actor: GateStaff
        preconditions:
          - "Attendee.status == TRANSFERRED"
          - "same window and event-match preconditions as the ISSUED -> CHECKED_IN transition"
        side_effects:
          - "identical side effects to the ISSUED -> CHECKED_IN transition"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /api/attendees/{id}/void"
        actor: Organizer
        preconditions:
          - "Attendee.status IN {ISSUED, CHECKED_IN, TRANSFERRED}"
          - "Event.status != COMPLETED"
        side_effects:
          - "decrements TicketType.sold_count by 1"
          - "when Attendee.seat_block_id is non-null, decrements SeatBlock.seats_taken by 1"
          - "recomputes Event.issued_count and Event.checked_in_count"
      - from: CHECKED_IN
        to: VOIDED
        trigger: "POST /api/attendees/{id}/void"
        actor: Organizer
        preconditions:
          - "Attendee.status IN {ISSUED, CHECKED_IN, TRANSFERRED}"
          - "Event.status != COMPLETED"
        side_effects:
          - "identical side effects to the ISSUED -> VOIDED transition"
      - from: TRANSFERRED
        to: VOIDED
        trigger: "POST /api/attendees/{id}/void"
        actor: Organizer
        preconditions:
          - "Attendee.status IN {ISSUED, CHECKED_IN, TRANSFERRED}"
          - "Event.status != COMPLETED"
        side_effects:
          - "identical side effects to the ISSUED -> VOIDED transition"

  # ---- RefundRequest: branching -------------------------------------------
  - entity: RefundRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, SETTLED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/refund-requests/{id}/approve"
        actor: Organizer
        preconditions:
          - "RefundRequest.status == REQUESTED"
          - "Order.payment_status IN {PAID, REFUND_PENDING, PARTIALLY_REFUNDED} (cross-entity)"
        side_effects:
          - "recomputes refund_amount_cents, platform_retained_cents and organizer_charged_cents with refund_amount using RefundRequest.policy"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/refund-requests/{id}/reject"
        actor: Organizer
        preconditions:
          - "RefundRequest.status == REQUESTED"
        side_effects:
          - "sets refund_amount_cents, platform_retained_cents, organizer_charged_cents to 0"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /api/refund-requests/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "RefundRequest.status == APPROVED"
        side_effects:
          - "CASCADE HOP 1 — sets RefundRequest.status = SETTLED and settled_at = current_utc"
          - "CASCADE HOP 2 (caused by hop 1) — increments Order.refunded_cents by refund_amount_cents; sets Order.payment_status to REFUNDED when refunded_cents == buyer_total_cents else PARTIALLY_REFUNDED; sets every Attendee named by item_refunds to status VOIDED, releasing their seats (SeatBlock.seats_taken decremented, TicketType.sold_count decremented); increments Organizer.lifetime_refunds_cents by organizer_charged_cents and increments Organizer.version by 1"
          - "CASCADE HOP 3 (caused by hop 2's Order refund fields) — the Payout whose event_id equals the Order's event_id and whose status IN {ACCRUING, ELIGIBLE} recomputes gross_cents, refunds_cents, platform_fee_cents, reserve_basis_cents, reserve_cents and net_amount_cents via payout_net_amount using its frozen reliability_score_snapshot"
          - "CASCADE HOP 4 (caused by hop 3's recompute) — when the recomputed Payout.net_amount_cents < 0, Payout.status is set to ON_HOLD"

  # ---- TransferRequest: cyclic (SENT -> DECLINED -> SENT) -------------------
  - entity: TransferRequest
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /api/transfer-requests/{id}/send"
        actor: Buyer
        preconditions:
          - "TransferRequest.status IN {DRAFT, DECLINED}"
          - "Attendee.status IN {ISSUED, TRANSFERRED} (cross-entity)"
          - "Event.status IN {ONSALE, PAUSED, SALES_CLOSED} (cross-entity)"
        side_effects:
          - "sets offer_expires_at = current_utc + TRANSFER_OFFER_TTL_HOURS"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /api/transfer-requests/{id}/accept"
        actor: Buyer
        preconditions:
          - "TransferRequest.status == SENT"
          - "current_utc < TransferRequest.offer_expires_at"
          - "the accepting Buyer's email equals TransferRequest.to_email"
        side_effects:
          - "sets to_buyer_id to the accepting buyer"
          - "sets the linked Attendee.buyer_id and holder_email to the accepting buyer and Attendee.status to TRANSFERRED"
      - from: SENT
        to: DECLINED
        trigger: "POST /api/transfer-requests/{id}/decline"
        actor: Buyer
        preconditions:
          - "TransferRequest.status == SENT"
          - "the declining Buyer's email equals TransferRequest.to_email"
        side_effects:
          - "clears offer_expires_at to null"
      - from: DECLINED
        to: SENT
        trigger: "POST /api/transfer-requests/{id}/send"
        actor: Buyer
        preconditions:
          - "TransferRequest.status IN {DRAFT, DECLINED}"
          - "Attendee.status IN {ISSUED, TRANSFERRED}"
          - "Event.status IN {ONSALE, PAUSED, SALES_CLOSED}"
        side_effects:
          - "sets offer_expires_at = current_utc + TRANSFER_OFFER_TTL_HOURS"
          - "increments resend_count by 1"
        note: "Cycle: SENT -> DECLINED -> SENT may repeat without bound."
      - from: SENT
        to: EXPIRED
        trigger: "POST /api/transfer-requests/{id}/accept or /decline evaluated at or after offer_expires_at (lazy expiry)"
        actor: Buyer
        preconditions:
          - "TransferRequest.status == SENT"
          - "current_utc >= TransferRequest.offer_expires_at"
        side_effects:
          - "sets status = EXPIRED and the triggering call is rejected with ERR_TRANSFER_TTL_EXPIRED"

  # ---- WaitlistEntry: cyclic (OFFERED -> EXPIRED -> WAITING) ---------------
  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [CLAIMED]
    shape: cyclic
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /api/ticket-types/{id}/waitlist-sweep"
        actor: Organizer
        preconditions:
          - "WaitlistEntry.status == WAITING"
          - "WaitlistEntry.requested_quantity <= the remaining sweep capacity"
        side_effects:
          - "sets offered_at = current_utc and offer_expires_at = current_utc + WAITLIST_OFFER_TTL_HOURS"
          - "increments TicketType.held_count by requested_quantity"
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /api/waitlist-entries/{id}/claim"
        actor: Buyer
        preconditions:
          - "WaitlistEntry.status == OFFERED"
          - "current_utc < WaitlistEntry.offer_expires_at"
          - "Event.status == ONSALE (cross-entity)"
        side_effects:
          - "creates an Order with one GA OrderItem of quantity == requested_quantity on the waited TicketType, fulfillment_status HELD, payment_status PENDING"
          - "sets claimed_order_id to the new Order.id"
          - "increments Event.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /api/ticket-types/{id}/waitlist-sweep (lazy expiry of stale offers evaluated at sweep time)"
        actor: Organizer
        preconditions:
          - "WaitlistEntry.status == OFFERED"
          - "current_utc >= WaitlistEntry.offer_expires_at"
        side_effects:
          - "decrements TicketType.held_count by requested_quantity"
      - from: EXPIRED
        to: WAITING
        trigger: "POST /api/waitlist-entries/{id}/requeue"
        actor: Buyer
        preconditions:
          - "WaitlistEntry.status == EXPIRED"
          - "Event.status IN {ONSALE, PAUSED} (cross-entity)"
        side_effects:
          - "clears offered_at and offer_expires_at to null"
          - "the entry re-enters the sweep candidate pool ranked by its ORIGINAL created_at, not by the requeue instant"
        note: "Cycle: WAITING -> OFFERED -> EXPIRED -> WAITING may repeat without bound."

  # ---- Payout: cyclic (ELIGIBLE <-> ON_HOLD) -------------------------------
  - entity: Payout
    initial_state: ACCRUING
    terminal_states: [RELEASED]
    shape: cyclic
    transitions:
      - from: ACCRUING
        to: ELIGIBLE
        trigger: "POST /api/payouts/{id}/mark-eligible"
        actor: FinanceOfficer
        preconditions:
          - "Payout.status == ACCRUING"
          - "Event.status == COMPLETED (cross-entity)"
          - "no RefundRequest on any Order of this Event has status IN {REQUESTED, APPROVED}"
          - "Payout.net_amount_cents >= 0"
        side_effects:
          - "recomputes the full payout_net_amount chain"
      - from: ELIGIBLE
        to: ON_HOLD
        trigger: "POST /api/payouts/{id}/hold, or the settle cascade when net_amount_cents < 0"
        actor: FinanceOfficer
        preconditions:
          - "Payout.status IN {ACCRUING, ELIGIBLE}"
        side_effects:
          - "freezes approve and release"
      - from: ON_HOLD
        to: ELIGIBLE
        trigger: "POST /api/payouts/{id}/resume"
        actor: FinanceOfficer
        preconditions:
          - "Payout.status == ON_HOLD"
          - "Payout.net_amount_cents >= 0"
        side_effects:
          - "recomputes the full payout_net_amount chain"
        note: "Cycle: ELIGIBLE -> ON_HOLD -> ELIGIBLE may repeat without bound."
      - from: ELIGIBLE
        to: APPROVED
        trigger: "POST /api/payouts/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "Payout.status == ELIGIBLE"
          - "Payout.net_amount_cents >= 0"
        side_effects:
          - "sets approved_by_user_id = the acting X-User-ID"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /api/payouts/{id}/release"
        actor: FinanceOfficer
        preconditions:
          - "Payout.status == APPROVED"
          - "the acting X-User-ID differs from Payout.approved_by_user_id (segregation of duties)"
        side_effects:
          - "sets released_by_user_id = the acting X-User-ID"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-event
    parent_entity: Event
    write_endpoint: "POST /api/orders"
    occ_field: "expected_event_version"
    description: |
      Creating an Order against an Event whose version has advanced since the
      client last observed it is rejected with a stale-version error. This
      captures the case where the tier lineup, pricing, or remaining inventory
      changed after the client rendered its checkout page — every prior Order
      creation and every TicketType price change advances Event.version, so the
      client's cached view is provably out of date.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

  - rule_id: payout-create-stale-organizer
    parent_entity: Organizer
    write_endpoint: "POST /api/payouts"
    occ_field: "expected_organizer_version"
    description: |
      Creating a Payout for an Organizer whose version has advanced since the
      client last observed it is rejected with a stale-version error. A newly
      created Payout legitimately supersedes any prior draft settlement for the
      same organizer, so the operation is valid on its own terms; the OCC check
      exists because Organizer.version advances on every settled refund and
      every paid order, which changes the amounts the new Payout would compute.
    error_id: ERR_STALE_ORGANIZER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: order_fee_breakdown
    trigger: "POST /api/orders — runs once per OrderItem while the Order is created, before promo_discount"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — per-ticket fee, computed and ROUNDED PER TICKET (pinned order).
      face = ticket_type.price_cents
      if face <= FEE_TIER_1_MAX_FACE_CENTS:        rate = FEE_TIER_1_RATE      # 2500 -> 0.020
      elif face <= FEE_TIER_2_MAX_FACE_CENTS:      rate = FEE_TIER_2_RATE      # 10000 -> 0.037
      else:                                        rate = FEE_TIER_3_RATE      # 0.050
      raw = round_half_up(face * rate) + PLATFORM_FEE_FLAT_CENTS
      per_ticket_fee_cents = min(max(raw, PLATFORM_FEE_MIN_CENTS), PLATFORM_FEE_CAP_CENTS)

      # STEP 2 — line aggregation. Multiply the ALREADY ROUNDED per-ticket fee.
      line_face_cents = face * quantity
      line_fee_cents  = per_ticket_fee_cents * quantity

      # STEP 3 — order aggregation.
      subtotal_cents  = sum(line_face_cents over all OrderItems of the Order)
      fee_total_cents = sum(line_fee_cents  over all OrderItems of the Order)

      # PINNED ROUNDING ORDER: round-per-ticket THEN multiply THEN sum.
      # The alternative (sum face * rate across the order, then round once,
      # then add the flat component) is explicitly NOT used and yields a
      # different cent total for mixed-price orders.
    input_set: "Every OrderItem of the Order being created. Tier selection uses TicketType.price_cents snapshotted into OrderItem.unit_price_cents at creation; later PATCHes of TicketType.price_cents never re-price an existing Order."
    constants:
      FEE_TIER_1_MAX_FACE_CENTS: 2500
      FEE_TIER_1_RATE: 0.020
      FEE_TIER_2_MAX_FACE_CENTS: 10000
      FEE_TIER_2_RATE: 0.037
      FEE_TIER_3_RATE: 0.050
      PLATFORM_FEE_FLAT_CENTS: 179
      PLATFORM_FEE_MIN_CENTS: 99
      PLATFORM_FEE_CAP_CENTS: 2500
    precision: "integer cents, round_half_up applied exactly once per ticket"
    variants:
      - name: PASS_ON
        when: "Event.fee_mode == PASS_ON"
        difference: "buyer_total_cents = subtotal_cents - discount_cents + fee_total_cents; organizer_gross_cents = subtotal_cents - discount_cents"
      - name: ABSORB
        when: "Event.fee_mode == ABSORB"
        difference: "buyer_total_cents = subtotal_cents - discount_cents; organizer_gross_cents = subtotal_cents - discount_cents - fee_total_cents"

  - name: promo_discount
    trigger: "POST /api/orders when a promo_code string is supplied — runs AFTER order_fee_breakdown STEP 3 and BEFORE the variant selection"
    algorithm: threshold
    formula: |
      # Eligibility gate — INCLUSIVE lower bound.
      if subtotal_cents < PROMO_MIN_SUBTOTAL_CENTS: reject ERR_PROMO_NOT_APPLICABLE
      if not (promo.valid_from <= current_utc < promo.valid_until): reject ERR_PROMO_WINDOW_CLOSED
      if promo.uses_count >= promo.max_uses: reject ERR_PROMO_EXHAUSTED
      if promo.event_id != order.event_id: reject ERR_PROMO_EVENT_MISMATCH

      raw = round_half_up(subtotal_cents * promo.percent_bp / 10000) if promo.kind == PERCENT
            else promo.amount_cents
      cap = round_half_up(subtotal_cents * PROMO_MAX_DISCOUNT_PCT)
      discount_cents = min(raw, cap, subtotal_cents)

      # PINNED EVALUATION ORDER (circular-looking dependency):
      #   fee_total_cents is computed from UNDISCOUNTED face values and is
      #   NEVER recomputed after the discount is known, even though
      #   buyer_total_cents = subtotal - discount + fee under PASS_ON makes it
      #   look as though the fee should follow the total. The order is:
      #   (1) per-ticket fee from face -> (2) subtotal -> (3) discount from
      #   subtotal -> (4) buyer_total / organizer_gross. No back-propagation.
    input_set: "The single PromoCode resolved by (event_id, code); the Order's own OrderItems only."
    constants:
      PROMO_MIN_SUBTOTAL_CENTS: 5000
      PROMO_MAX_DISCOUNT_PCT: 0.30
    precision: "integer cents, round_half_up"

  - name: refund_amount
    trigger: "POST /api/refund-requests/{id}/approve, and the auto-created RefundRequest in the Event cancel cascade (hop 5)"
    algorithm: waterfall_allocation
    formula: |
      # refunded_face is the face value of the tickets named by item_refunds.
      refunded_face_cents = sum over item_refunds of (order_item.unit_price_cents * entry.quantity)
      refunded_fee_cents  = sum over item_refunds of (order_item.per_ticket_fee_cents * entry.quantity)
      prorated_discount_cents = round_half_up(order.discount_cents * refunded_face_cents / order.subtotal_cents)

      if policy == FEE_RETAINED:
          refund_amount_cents     = refunded_face_cents - prorated_discount_cents
          platform_retained_cents = refunded_fee_cents
          organizer_charged_cents = refunded_face_cents - prorated_discount_cents
      elif policy == FEE_INCLUDED:
          refund_amount_cents     = refunded_face_cents - prorated_discount_cents + refunded_fee_cents
          platform_retained_cents = 0
          organizer_charged_cents = refunded_face_cents - prorated_discount_cents + refunded_fee_cents
      # Under ABSORB fee_mode the buyer never paid the fee, so refund_amount_cents
      # for BOTH policies is refunded_face_cents - prorated_discount_cents; the
      # policies then differ only in platform_retained_cents (refunded_fee_cents
      # for FEE_RETAINED, 0 for FEE_INCLUDED) and organizer_charged_cents
      # (refunded_face - prorated_discount for FEE_RETAINED, that value MINUS
      # refunded_fee_cents for FEE_INCLUDED, since the platform hands the fee back).
    input_set: "Only OrderItems named in item_refunds, and only up to the quantity not already covered by a SETTLED RefundRequest on the same Order."
    constants: {}
    precision: "integer cents, round_half_up on the prorated discount only"
    variants:
      - name: FEE_RETAINED
        when: "RefundRequest.policy == FEE_RETAINED (the default from Event.refund_policy)"
        difference: "the platform keeps the whole per-ticket fee; the buyer gets back face minus prorated discount only"
      - name: FEE_INCLUDED
        when: "RefundRequest.policy == FEE_INCLUDED, and unconditionally for the RefundRequests auto-created by the Event cancel cascade"
        difference: "the platform returns the fee too; under PASS_ON fee_mode the buyer receives strictly MORE than under FEE_RETAINED for identical inputs"

  - name: organizer_reliability_score
    trigger: "GET /api/organizers/{id}/reliability, and once at POST /api/payouts to freeze Payout.reliability_score_snapshot"
    algorithm: weighted_scoring
    formula: |
      # Per qualifying Event e:
      refund_rate_e  = (e.gross_cents == 0) ? 0.0 : e.refunds_cents / e.gross_cents
      checkin_rate_e = (e.issued_count == 0) ? 0.0 : e.checked_in_count / e.issued_count
      cancel_flag_e  = 1 if e.status == CANCELLED else 0
      event_score_e  = 100 * ( RELIABILITY_WEIGHT_REFUND  * (1 - refund_rate_e)
                             + RELIABILITY_WEIGHT_CHECKIN * checkin_rate_e
                             + RELIABILITY_WEIGHT_CANCEL  * (1 - cancel_flag_e) )

      qualifying = Events with organizer_id == this organizer AND status IN {COMPLETED, CANCELLED}
      if qualifying is empty: score = RELIABILITY_DEFAULT_SCORE
      else: score = round_half_up( mean(event_score_e over the variant's input set) )
    input_set: "LIFETIME: all qualifying Events. TRAILING: the first RELIABILITY_TRAILING_EVENTS qualifying Events ordered by ends_at DESC, tie-break created_at DESC."
    constants:
      RELIABILITY_WEIGHT_REFUND: 0.45
      RELIABILITY_WEIGHT_CHECKIN: 0.35
      RELIABILITY_WEIGHT_CANCEL: 0.20
      RELIABILITY_TRAILING_EVENTS: 2
      RELIABILITY_DEFAULT_SCORE: 75
    precision: "integer 0..100, round_half_up applied once to the mean"
    variants:
      - name: LIFETIME
        when: "GET /api/organizers/{id}/reliability?variant=LIFETIME (the default when the query parameter is omitted)"
        difference: "averages event_score over every qualifying Event"
      - name: TRAILING
        when: "GET /api/organizers/{id}/reliability?variant=TRAILING, and always for Payout.reliability_score_snapshot"
        difference: "averages event_score over only the RELIABILITY_TRAILING_EVENTS most recently ended qualifying Events, so an organizer with a bad recent event scores strictly lower than its LIFETIME score"

  - name: payout_net_amount
    trigger: "POST /api/payouts, POST /api/payouts/{id}/mark-eligible, POST /api/payouts/{id}/resume, and cascade hop 3 of the RefundRequest settle transition"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER — steps run exactly 1..7, no back-propagation.
      # 1
      gross_cents = sum of Order.organizer_gross_cents over Orders where
                    order.event_id == payout.event_id AND
                    order.payment_status IN {PAID, REFUND_PENDING, PARTIALLY_REFUNDED, REFUNDED}
      # 2
      refunds_cents = sum of RefundRequest.organizer_charged_cents over RefundRequests
                      whose order.event_id == payout.event_id AND status == SETTLED
      # 3
      platform_fee_cents = (event.fee_mode == ABSORB)
                           ? sum of Order.fee_total_cents over the same Orders as step 1
                           : 0
      # 4
      reserve_basis_cents = gross_cents - refunds_cents - platform_fee_cents
      # 5  reserve_rate is selected from the FROZEN snapshot, never from a live recompute
      s = payout.reliability_score_snapshot
      if   s >= RESERVE_TIER_A_MIN_SCORE: reserve_rate = RESERVE_TIER_A_RATE   # >= 90 -> 0.00
      elif s >= RESERVE_TIER_B_MIN_SCORE: reserve_rate = RESERVE_TIER_B_RATE   # >= 70 -> 0.05
      elif s >= RESERVE_TIER_C_MIN_SCORE: reserve_rate = RESERVE_TIER_C_RATE   # >= 50 -> 0.10
      else:                               reserve_rate = RESERVE_TIER_D_RATE   # 0.20
      # 6
      reserve_cents = max(0, round_half_up(reserve_rate * reserve_basis_cents))
      # 7
      net_amount_cents = reserve_basis_cents - reserve_cents

      # The circular look: reserve_rate depends on the reliability score, which
      # is derived from the same refund data that feeds step 2. The cycle is
      # broken by FREEZING reliability_score_snapshot at payout creation; later
      # settled refunds change steps 2/4/6/7 but NEVER step 5.
    input_set: "Orders and RefundRequests scoped to payout.event_id only; Orders with payment_status PENDING and fulfillment_status EXPIRED are excluded."
    constants:
      RESERVE_TIER_A_MIN_SCORE: 90
      RESERVE_TIER_A_RATE: 0.00
      RESERVE_TIER_B_MIN_SCORE: 70
      RESERVE_TIER_B_RATE: 0.05
      RESERVE_TIER_C_MIN_SCORE: 50
      RESERVE_TIER_C_RATE: 0.10
      RESERVE_TIER_D_RATE: 0.20
      ROLLING_RESERVE_RELEASE_DAYS: 90
    precision: "integer cents, round_half_up on the reserve only"

  - name: ticket_type_availability
    trigger: "POST /api/orders, POST /api/waitlist-entries, POST /api/ticket-types/{id}/waitlist-sweep, GET /api/ticket-types/{id}"
    algorithm: aggregation
    formula: |
      sold  = count(Attendee where attendee.ticket_type_id == T.id
                    AND attendee.status IN {ISSUED, CHECKED_IN, TRANSFERRED})
      held  = sum(OrderItem.quantity where order.fulfillment_status == HELD
                  AND current_utc < order.hold_expires_at
                  AND order_item.ticket_type_id == T.id)
            + sum(WaitlistEntry.requested_quantity where status == OFFERED
                  AND current_utc < offer_expires_at
                  AND ticket_type_id == T.id)
      available = T.quantity_total - sold - held
      # Boundaries: an order for q tickets requires available >= q (inclusive).
      # available == 0 is the SOLD-OUT edge: ERR_SOLD_OUT.
      # 0 < available < q is the short edge: ERR_INSUFFICIENT_CAPACITY.
    input_set: "Attendees in {ISSUED, CHECKED_IN, TRANSFERRED} plus live holds; VOIDED attendees and expired holds are excluded."
    constants:
      SEAT_HOLD_MINUTES: 15
      WAITLIST_OFFER_TTL_HOURS: 24
    precision: "integer tickets"

  - name: event_report
    trigger: "GET /api/events/{id}/report"
    algorithm: aggregation
    formula: |
      tickets_sold_count  = count(Attendee where event_id == E.id
                                  AND status IN {ISSUED, CHECKED_IN, TRANSFERRED})
      checked_in_count    = count(Attendee where event_id == E.id AND status == CHECKED_IN)
      voided_count        = count(Attendee where event_id == E.id AND status == VOIDED)
      gross_cents         = E.gross_cents
      refunds_cents       = E.refunds_cents
      net_to_organizer_cents = gross_cents - refunds_cents
      check_in_rate       = (tickets_sold_count == 0) ? 0.0
                            : round_half_up(checked_in_count / tickets_sold_count, 4)
      waitlist_depth      = count(WaitlistEntry where ticket_type.event_id == E.id
                                  AND status == WAITING)
    input_set: "All Attendees and WaitlistEntries reachable from the Event via ticket_type_id / event_id."
    constants: {}
    precision: "check_in_rate is a number with exactly 4 decimal places, round_half_up; all *_cents are integers"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the declared roles (Anonymous requires no X-User-ID)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body/query conforms to the endpoint's input schema: required fields present, types correct, enum members valid, integers within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 10
    category: existence
    check: "Organizer named in the path or body exists"
    error_id: ERR_ORGANIZER_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/events, GET /api/organizers/{id}, GET /api/organizers/{id}/reliability, POST /api/payouts"

  - priority: 11
    category: existence
    check: "Venue named in the body exists"
    error_id: ERR_VENUE_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/events, GET /api/venues/{id}"

  - priority: 12
    category: existence
    check: "Buyer named in the path or body exists"
    error_id: ERR_BUYER_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/orders, POST /api/waitlist-entries, GET /api/buyers/{id}"

  - priority: 13
    category: existence
    check: "Event named in the path or body exists"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all /api/events/{id}* endpoints, POST /api/ticket-types, POST /api/promo-codes, POST /api/orders, POST /api/scans, POST /api/payouts"

  - priority: 14
    category: existence
    check: "TicketType named in the path or body exists"
    error_id: ERR_TICKET_TYPE_NOT_FOUND
    http_status: 404
    applies_to: "GET/PATCH /api/ticket-types/{id}, POST /api/ticket-types/{id}/waitlist-sweep, POST /api/seat-blocks, POST /api/orders, POST /api/waitlist-entries"

  - priority: 15
    category: existence
    check: "SeatBlock named in the path or body exists"
    error_id: ERR_SEAT_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "GET /api/seat-blocks/{id}, POST /api/orders"

  - priority: 16
    category: existence
    check: "PromoCode resolvable from (event_id, promo_code) exists"
    error_id: ERR_PROMO_CODE_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/orders, GET /api/promo-codes/{id}"

  - priority: 17
    category: existence
    check: "Order named in the path or body exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /api/orders/{id}, POST /api/orders/{id}/pay, POST /api/orders/{id}/release, POST /api/refund-requests"

  - priority: 18
    category: existence
    check: "OrderItem named in item_refunds or in the path exists"
    error_id: ERR_ORDER_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/refund-requests, GET /api/order-items/{id}"

  - priority: 19
    category: existence
    check: "Attendee named in the path or body exists"
    error_id: ERR_ATTENDEE_NOT_FOUND
    http_status: 404
    applies_to: "GET /api/attendees/{id}, POST /api/attendees/{id}/void, POST /api/attendees/{id}/undo-check-in, POST /api/scans, POST /api/transfer-requests"

  - priority: 20
    category: existence
    check: "RefundRequest / TransferRequest / WaitlistEntry / Payout / ScanRecord named in the path exists"
    error_id: ERR_REFUND_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all /api/refund-requests/{id}* endpoints"

  - priority: 21
    category: existence
    check: "TransferRequest named in the path exists"
    error_id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all /api/transfer-requests/{id}* endpoints"

  - priority: 22
    category: existence
    check: "WaitlistEntry named in the path exists"
    error_id: ERR_WAITLIST_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "all /api/waitlist-entries/{id}* endpoints"

  - priority: 23
    category: existence
    check: "Payout named in the path exists"
    error_id: ERR_PAYOUT_NOT_FOUND
    http_status: 404
    applies_to: "all /api/payouts/{id}* endpoints"

  - priority: 24
    category: existence
    check: "ScanRecord named in the path exists"
    error_id: ERR_SCAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /api/scans/{id}"

  - priority: 30
    category: auth
    check: "ownership — an acting Organizer's X-User-ID must equal the Event's organizer_id (or the organizer_id of the event reached via ticket_type/promo_code/order); an acting Buyer's X-User-ID must equal Order.buyer_id / WaitlistEntry.buyer_id / Attendee.buyer_id as applicable"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all Organizer-scoped and Buyer-scoped mutating endpoints"

  - priority: 40
    category: state
    check: "the Event is in a state that permits selling: Event.status == ONSALE"
    error_id: ERR_EVENT_NOT_ONSALE
    http_status: 409
    applies_to: "POST /api/orders, POST /api/orders/{id}/pay, POST /api/waitlist-entries/{id}/claim"

  - priority: 41
    category: state
    check: "the requested Event lifecycle transition is declared in §1.2 for the current Event.status AND that transition's declared preconditions hold (for example publish requires at least one TicketType on the Event)"
    error_id: ERR_INVALID_EVENT_TRANSITION
    http_status: 409
    applies_to: "POST /api/events/{id}/publish|pause|resume|close-sales|complete|cancel"

  - priority: 42
    category: state
    check: "Order.fulfillment_status == HELD and Order.payment_status == PENDING"
    error_id: ERR_ORDER_NOT_HELD
    http_status: 409
    applies_to: "POST /api/orders/{id}/pay, POST /api/orders/{id}/release"

  - priority: 43
    category: state
    check: "Order.payment_status IN {PAID, REFUND_PENDING, PARTIALLY_REFUNDED}"
    error_id: ERR_ORDER_NOT_PAID
    http_status: 409
    applies_to: "POST /api/refund-requests"

  - priority: 44
    category: state
    check: "RefundRequest.status matches the transition's from state"
    error_id: ERR_INVALID_REFUND_STATE
    http_status: 409
    applies_to: "POST /api/refund-requests/{id}/approve|reject|settle"

  - priority: 45
    category: state
    check: "TransferRequest.status matches the transition's from state"
    error_id: ERR_INVALID_TRANSFER_STATE
    http_status: 409
    applies_to: "POST /api/transfer-requests/{id}/send|accept|decline"

  - priority: 46
    category: state
    check: "WaitlistEntry.status matches the transition's from state"
    error_id: ERR_INVALID_WAITLIST_STATE
    http_status: 409
    applies_to: "POST /api/waitlist-entries/{id}/claim, POST /api/waitlist-entries/{id}/requeue"

  - priority: 47
    category: state
    check: "Payout.status matches the transition's from state"
    error_id: ERR_INVALID_PAYOUT_STATE
    http_status: 409
    applies_to: "POST /api/payouts/{id}/mark-eligible|hold|resume|approve|release|release-reserve"

  - priority: 48
    category: state
    check: "Attendee.status IN {ISSUED, TRANSFERRED} for scan and transfer operations; Attendee.status == CHECKED_IN for undo-check-in"
    error_id: ERR_ATTENDEE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /api/transfer-requests, POST /api/attendees/{id}/undo-check-in"

  - priority: 50
    category: business_temporal
    check: "venue temporal overlap — for POST /api/events, the interval [starts_at, ends_at + VENUE_TURNAROUND_MINUTES) MUST NOT intersect the same interval of any other Event on the same venue_id whose status != CANCELLED. Both intervals are half-open, so a new event starting exactly at (existing.ends_at + 90 min) is accepted."
    error_id: ERR_VENUE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /api/events"

  - priority: 51
    category: business_temporal
    check: "the Order's hold is live: current_utc < Order.hold_expires_at"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /api/orders/{id}/pay"

  - priority: 52
    category: business_temporal
    check: "promo redemption window: promo.valid_from <= current_utc < promo.valid_until"
    error_id: ERR_PROMO_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/orders"

  - priority: 53
    category: business_temporal
    check: "check-in window: Event.starts_at - CHECK_IN_WINDOW_BEFORE_MINUTES <= current_utc <= Event.ends_at + CHECK_IN_WINDOW_AFTER_MINUTES (both bounds inclusive)"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/scans"

  - priority: 54
    category: business_temporal
    check: "refund request window: current_utc < Order.paid_at + REFUND_REQUEST_WINDOW_DAYS AND current_utc < Event.starts_at"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/refund-requests"

  - priority: 55
    category: business_temporal
    check: "transfer offer TTL: current_utc < TransferRequest.offer_expires_at"
    error_id: ERR_TRANSFER_TTL_EXPIRED
    http_status: 409
    applies_to: "POST /api/transfer-requests/{id}/accept, POST /api/transfer-requests/{id}/decline"

  - priority: 56
    category: business_temporal
    check: "waitlist offer TTL: current_utc < WaitlistEntry.offer_expires_at"
    error_id: ERR_WAITLIST_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /api/waitlist-entries/{id}/claim"

  - priority: 57
    category: business_temporal
    check: "rolling reserve maturity: current_utc >= Payout.reserve_release_at (Event.ends_at + ROLLING_RESERVE_RELEASE_DAYS)"
    error_id: ERR_RESERVE_NOT_MATURED
    http_status: 409
    applies_to: "POST /api/payouts/{id}/release-reserve"

  - priority: 58
    category: business_temporal
    check: "an Event may only be completed after it has ended: Event.ends_at <= current_utc"
    error_id: ERR_EVENT_NOT_ENDED
    http_status: 409
    applies_to: "POST /api/events/{id}/complete"

  - priority: 59
    category: business_temporal
    check: "an Event's starts_at must be strictly after current_utc at creation and at publish, and ends_at strictly after starts_at"
    error_id: ERR_EVENT_START_IN_PAST
    http_status: 422
    applies_to: "POST /api/events, POST /api/events/{id}/publish, POST /api/events/{id}/resume"

  - priority: 60
    category: business_referential
    check: "the scanned Attendee's event_id equals the scan's event_id"
    error_id: ERR_ATTENDEE_EVENT_MISMATCH
    http_status: 422
    applies_to: "POST /api/scans"

  - priority: 61
    category: business_referential
    check: "the PromoCode's event_id equals the Order's event_id; the TicketType's event_id equals the Order's event_id; the SeatBlock's ticket_type_id equals the OrderItem's ticket_type_id"
    error_id: ERR_PROMO_EVENT_MISMATCH
    http_status: 422
    applies_to: "POST /api/orders"

  - priority: 65
    category: business_safety
    check: "the Attendee has not been voided: Attendee.status != VOIDED"
    error_id: ERR_TICKET_VOIDED
    http_status: 409
    applies_to: "POST /api/scans, POST /api/transfer-requests, POST /api/attendees/{id}/void"

  - priority: 66
    category: business_safety
    check: "the Attendee has not already been checked in: Attendee.status != CHECKED_IN"
    error_id: ERR_ALREADY_CHECKED_IN
    http_status: 409
    applies_to: "POST /api/scans"

  - priority: 67
    category: business_safety
    check: "segregation of duties: the X-User-ID releasing a Payout MUST differ from Payout.approved_by_user_id"
    error_id: ERR_SOD_SAME_ACTOR
    http_status: 403
    applies_to: "POST /api/payouts/{id}/release"

  - priority: 70
    category: business_constraint
    check: "reserved-seat occupancy overlap — every seat number requested on a RESERVED OrderItem MUST be free at current_utc. A seat is occupied when an Attendee with status IN {ISSUED, CHECKED_IN, TRANSFERRED} holds it, or when an OrderItem of an Order with fulfillment_status == HELD holds it over the half-open interval [order.created_at, order.hold_expires_at). A request made at exactly hold_expires_at finds the seat free."
    error_id: ERR_SEAT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /api/orders"

  - priority: 71
    category: business_constraint
    check: "seat range validity — every requested seat number lies within [SeatBlock.seat_from, SeatBlock.seat_to]; len(seat_numbers) == quantity for RESERVED tiers; seat_numbers is empty and seat_block_id is null for GA tiers; SeatBlock.seat_to >= seat_from at block creation"
    error_id: ERR_SEAT_RANGE_INVALID
    http_status: 422
    applies_to: "POST /api/orders, POST /api/seat-blocks"

  - priority: 72
    category: business_constraint
    check: "per-buyer ticket limit — the buyer's total live tickets for the event (sum of OrderItem.quantity over Orders with fulfillment_status IN {HELD, ISSUED, CHECKED_IN_PARTIAL, CHECKED_IN_FULL} plus the requested quantity) MUST NOT exceed MAX_TICKETS_PER_BUYER_PER_EVENT"
    error_id: ERR_TICKET_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /api/orders, POST /api/waitlist-entries/{id}/claim"

  - priority: 73
    category: business_constraint
    check: "uniqueness — PromoCode.code unique per event_id; SeatBlock.row_label unique per ticket_type_id; Buyer.email unique"
    error_id: ERR_DUPLICATE_PROMO_CODE
    http_status: 409
    applies_to: "POST /api/promo-codes, POST /api/seat-blocks, POST /api/buyers"

  - priority: 80
    category: business_fiscal
    check: "ticket_type_availability.available == 0 for a requested tier"
    error_id: ERR_SOLD_OUT
    http_status: 409
    applies_to: "POST /api/orders, POST /api/waitlist-entries/{id}/claim"

  - priority: 81
    category: business_fiscal
    check: "0 < ticket_type_availability.available < requested quantity"
    error_id: ERR_INSUFFICIENT_CAPACITY
    http_status: 409
    applies_to: "POST /api/orders, POST /api/waitlist-entries/{id}/claim"

  - priority: 82
    category: business_fiscal
    check: "a buyer may only join the waitlist for a tier that is fully exhausted: ticket_type_availability.available MUST equal 0"
    error_id: ERR_CAPACITY_AVAILABLE
    http_status: 409
    applies_to: "POST /api/waitlist-entries"

  - priority: 83
    category: business_fiscal
    check: "promo eligibility floor — subtotal_cents >= PROMO_MIN_SUBTOTAL_CENTS (inclusive)"
    error_id: ERR_PROMO_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /api/orders"

  - priority: 84
    category: business_fiscal
    check: "promo redemption budget — promo.uses_count < promo.max_uses"
    error_id: ERR_PROMO_EXHAUSTED
    http_status: 409
    applies_to: "POST /api/orders"

  - priority: 85
    category: business_fiscal
    check: "refund quantity ceiling — for each item_refunds entry, quantity <= OrderItem.quantity minus the quantity already covered by SETTLED RefundRequests on the same OrderItem"
    error_id: ERR_REFUND_EXCEEDS_ORDER
    http_status: 422
    applies_to: "POST /api/refund-requests"

  - priority: 85.5
    category: state
    check: "Payout creation requires Event.status IN {SALES_CLOSED, COMPLETED}"
    error_id: ERR_INVALID_EVENT_TRANSITION
    http_status: 409
    applies_to: "POST /api/payouts"

  - priority: 86
    category: business_fiscal
    check: "payout eligibility — Event.status == COMPLETED and Payout.net_amount_cents >= 0"
    error_id: ERR_PAYOUT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /api/payouts/{id}/mark-eligible, POST /api/payouts/{id}/resume, POST /api/payouts/{id}/approve"

  - priority: 87
    category: business_fiscal
    check: "no RefundRequest on any Order of the Payout's Event has status IN {REQUESTED, APPROVED}"
    error_id: ERR_PAYOUT_PENDING_REFUNDS
    http_status: 409
    applies_to: "POST /api/payouts/{id}/mark-eligible"

  - priority: 90
    category: business_constraint
    check: "optimistic concurrency — expected_event_version must equal Event.version (POST /api/orders); expected_organizer_version must equal Organizer.version (POST /api/payouts)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /api/orders, POST /api/payouts"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving logical clock ------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary ISO 8601 UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-07-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time. No sweeps, expiries or transitions fire as a side effect of moving the clock — every expiry in this scaffold is evaluated lazily by the next business call that reads it."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock; no entity is mutated"]

  # ---- Organizer ------------------------------------------------------------
  - method: POST
    path: "/api/organizers"
    description: "Register an organizer account."
    roles: [PlatformAdmin]
    code: 201
    input: ["display_name", "contact_email"]
    output: Organizer
    side_effects: ["creates Organizer with lifetime_gross_cents 0 and lifetime_refunds_cents 0"]

  - method: GET
    path: "/api/organizers/{id}"
    description: "Read an organizer."
    roles: [Organizer, PlatformAdmin, FinanceOfficer]
    code: 200
    input: []
    output: Organizer
    side_effects: []

  - method: GET
    path: "/api/organizers/{id}/reliability"
    description: "Computes organizer_reliability_score. The variant query parameter selects LIFETIME (default) or TRAILING."
    roles: [Organizer, PlatformAdmin, FinanceOfficer]
    code: 200
    input: ["variant?"]
    output: "{ organizer_id: string, variant: string, score: integer, events_counted: integer }"
    side_effects: ["none — pure read"]

  # ---- Venue ----------------------------------------------------------------
  - method: POST
    path: "/api/venues"
    description: "Register a venue."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "city", "seated_capacity"]
    output: Venue
    side_effects: []

  - method: GET
    path: "/api/venues/{id}"
    description: "Read a venue."
    roles: [Organizer, PlatformAdmin, FinanceOfficer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---- Buyer ----------------------------------------------------------------
  - method: POST
    path: "/api/buyers"
    description: "Self-serve buyer registration."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: ["email", "display_name"]
    output: Buyer
    side_effects: ["creates Buyer; email must be unique"]

  - method: GET
    path: "/api/buyers/{id}"
    description: "Read a buyer."
    roles: [Buyer, PlatformAdmin, Organizer]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  # ---- Event ----------------------------------------------------------------
  - method: POST
    path: "/api/events"
    description: "Create an event in DRAFT. Enforces the venue temporal-overlap rule with a VENUE_TURNAROUND_MINUTES buffer."
    roles: [Organizer]
    code: 201
    input: ["organizer_id", "venue_id", "title", "starts_at", "ends_at", "fee_mode?", "refund_policy?"]
    output: Event
    side_effects: ["creates Event in status DRAFT with version 1"]

  - method: GET
    path: "/api/events/{id}"
    description: "Read an event including its computed roll-ups."
    roles: [Organizer, Buyer, GateStaff, FinanceOfficer, PlatformAdmin, Anonymous]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: GET
    path: "/api/events"
    description: "List events, filterable by organizer, venue and status."
    roles: [Organizer, Buyer, GateStaff, FinanceOfficer, PlatformAdmin, Anonymous]
    code: 200
    input: ["organizer_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  - method: POST
    path: "/api/events/{id}/publish"
    description: "DRAFT -> ONSALE."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["increments Event.version by 1"]

  - method: POST
    path: "/api/events/{id}/pause"
    description: "ONSALE -> PAUSED."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["increments Event.version by 1"]

  - method: POST
    path: "/api/events/{id}/resume"
    description: "PAUSED -> ONSALE (cycle)."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["increments Event.version by 1"]

  - method: POST
    path: "/api/events/{id}/close-sales"
    description: "ONSALE|PAUSED -> SALES_CLOSED; expires every live hold."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["increments Event.version by 1", "expires HELD Orders and releases their seats"]

  - method: POST
    path: "/api/events/{id}/complete"
    description: "SALES_CLOSED -> COMPLETED; freezes the reporting roll-ups."
    roles: [Organizer]
    code: 200
    input: []
    output: Event
    side_effects: ["increments Event.version by 1", "recomputes gross_cents, refunds_cents, issued_count, checked_in_count"]

  - method: POST
    path: "/api/events/{id}/cancel"
    description: "Cancels the event and runs the 5-hop cancellation cascade."
    roles: [Organizer]
    code: 200
    input: ["reason?"]
    output: Event
    side_effects: ["voids orders and attendees", "releases seats", "auto-creates APPROVED FEE_INCLUDED RefundRequests", "expires waitlist entries", "increments Event.version by 1"]

  - method: GET
    path: "/api/events/{id}/report"
    description: "Organizer reporting roll-up computed by event_report."
    roles: [Organizer, PlatformAdmin, FinanceOfficer]
    code: 200
    input: []
    output: "{ event_id: string, tickets_sold_count: integer, checked_in_count: integer, voided_count: integer, gross_cents: integer, refunds_cents: integer, net_to_organizer_cents: integer, check_in_rate: number, waitlist_depth: integer }"
    side_effects: []

  # ---- TicketType -----------------------------------------------------------
  - method: POST
    path: "/api/ticket-types"
    description: "Create a ticket tier on a DRAFT or ONSALE event."
    roles: [Organizer]
    code: 201
    input: ["event_id", "name", "tier_rank", "price_cents", "quantity_total", "seating_mode?"]
    output: TicketType
    side_effects: ["increments Event.version by 1"]

  - method: GET
    path: "/api/ticket-types/{id}"
    description: "Read a ticket tier including sold_count, held_count and the derived available count."
    roles: [Organizer, Buyer, GateStaff, FinanceOfficer, PlatformAdmin, Anonymous]
    code: 200
    input: []
    output: TicketType
    side_effects: []

  - method: GET
    path: "/api/ticket-types"
    description: "List ticket tiers, filterable by event."
    roles: [Organizer, Buyer, GateStaff, FinanceOfficer, PlatformAdmin, Anonymous]
    code: 200
    input: ["event_id?", "seating_mode?", "limit?", "offset?"]
    output: TicketType[]
    side_effects: []

  - method: PATCH
    path: "/api/ticket-types/{id}"
    description: "Reprice or resize a tier. Existing Orders keep their snapshotted unit_price_cents."
    roles: [Organizer]
    code: 200
    input: ["price_cents?", "quantity_total?"]
    output: TicketType
    side_effects: ["increments Event.version by 1", "increments TicketType.version by 1"]

  - method: POST
    path: "/api/ticket-types/{id}/waitlist-sweep"
    description: "Offers currently-available capacity to WAITING entries in created_at ASC order, tie-broken by requested_quantity ASC. Expires stale OFFERED entries first."
    roles: [Organizer]
    code: 200
    input: []
    output: "{ ticket_type_id: string, expired_entry_ids: string[], offered_entry_ids: string[], offered_count: integer, remaining_available: integer }"
    side_effects: ["moves OFFERED entries past their TTL to EXPIRED", "moves selected WAITING entries to OFFERED", "increments TicketType.held_count"]

  # ---- SeatBlock ------------------------------------------------------------
  - method: POST
    path: "/api/seat-blocks"
    description: "Declare a contiguous seat block on a RESERVED tier."
    roles: [Organizer]
    code: 201
    input: ["ticket_type_id", "row_label", "seat_from", "seat_to"]
    output: SeatBlock
    side_effects: ["creates SeatBlock with seats_taken 0"]

  - method: GET
    path: "/api/seat-blocks/{id}"
    description: "Read a seat block including seats_taken."
    roles: [Organizer, Buyer, GateStaff, FinanceOfficer, PlatformAdmin, Anonymous]
    code: 200
    input: []
    output: SeatBlock
    side_effects: []

  - method: GET
    path: "/api/seat-blocks"
    description: "List seat blocks, filterable by ticket tier."
    roles: [Organizer, Buyer, GateStaff, FinanceOfficer, PlatformAdmin, Anonymous]
    code: 200
    input: ["ticket_type_id?", "limit?", "offset?"]
    output: SeatBlock[]
    side_effects: []

  # ---- PromoCode ------------------------------------------------------------
  - method: POST
    path: "/api/promo-codes"
    description: "Create a promo code scoped to one event."
    roles: [Organizer]
    code: 201
    input: ["event_id", "code", "kind", "percent_bp?", "amount_cents?", "max_uses", "valid_from", "valid_until"]
    output: PromoCode
    side_effects: []

  - method: GET
    path: "/api/promo-codes/{id}"
    description: "Read a promo code including uses_count."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: []
    output: PromoCode
    side_effects: []

  - method: GET
    path: "/api/promo-codes"
    description: "List promo codes, filterable by event and code."
    roles: [Organizer, PlatformAdmin]
    code: 200
    input: ["event_id?", "code?", "limit?", "offset?"]
    output: PromoCode[]
    side_effects: []

  # ---- Order ----------------------------------------------------------------
  - method: POST
    path: "/api/orders"
    description: "Create an order with a live seat/inventory hold. Runs order_fee_breakdown then promo_discount. Requires expected_event_version for optimistic concurrency."
    roles: [Buyer]
    code: 201
    input: ["event_id", "buyer_id", "items", "promo_code?", "expected_event_version"]
    output: Order
    side_effects: ["creates one OrderItem per items[] entry", "sets hold_expires_at = current_utc + SEAT_HOLD_MINUTES", "increments SeatBlock.seats_taken and TicketType.held_count", "increments PromoCode.uses_count when a code is applied", "increments Event.version by 1"]

  - method: GET
    path: "/api/orders/{id}"
    description: "Read an order and its money breakdown."
    roles: [Buyer, Organizer, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/api/orders"
    description: "List orders, filterable by event, buyer, promo code and payment status."
    roles: [Buyer, Organizer, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["event_id?", "buyer_id?", "promo_code_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/api/orders/{id}/pay"
    description: "Captures payment: payment_status PENDING -> PAID and fulfillment_status HELD -> ISSUED, minting one Attendee per ticket."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["mints Attendees", "increments TicketType.sold_count", "increments Organizer.lifetime_gross_cents and Organizer.version", "recomputes Event.gross_cents / issued_count", "increments Order.version by 1"]

  - method: POST
    path: "/api/orders/{id}/release"
    description: "Voluntarily releases a live hold: fulfillment_status HELD -> EXPIRED."
    roles: [Buyer, Organizer]
    code: 200
    input: []
    output: Order
    side_effects: ["decrements SeatBlock.seats_taken and TicketType.held_count", "decrements PromoCode.uses_count when a code was applied", "increments Order.version by 1"]

  # ---- OrderItem ------------------------------------------------------------
  - method: GET
    path: "/api/order-items/{id}"
    description: "Read one order line including its fee breakdown."
    roles: [Buyer, Organizer, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: OrderItem
    side_effects: []

  - method: GET
    path: "/api/order-items"
    description: "List order lines, filterable by order, tier and seat block."
    roles: [Buyer, Organizer, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["order_id?", "ticket_type_id?", "seat_block_id?", "limit?", "offset?"]
    output: OrderItem[]
    side_effects: []

  # ---- Attendee -------------------------------------------------------------
  - method: GET
    path: "/api/attendees/{id}"
    description: "Read one admission."
    roles: [Buyer, Organizer, GateStaff, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Attendee
    side_effects: []

  - method: GET
    path: "/api/attendees"
    description: "List admissions, filterable by order, line, tier, event, buyer and seat block."
    roles: [Buyer, Organizer, GateStaff, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["order_id?", "order_item_id?", "ticket_type_id?", "event_id?", "buyer_id?", "seat_block_id?", "status?", "limit?", "offset?"]
    output: Attendee[]
    side_effects: []

  - method: POST
    path: "/api/attendees/{id}/void"
    description: "Organizer voids one admission, releasing its seat and inventory."
    roles: [Organizer]
    code: 200
    input: ["reason?"]
    output: Attendee
    side_effects: ["decrements TicketType.sold_count", "decrements SeatBlock.seats_taken when seated", "recomputes Event.issued_count and Event.checked_in_count"]

  - method: POST
    path: "/api/attendees/{id}/undo-check-in"
    description: "Reverts a check-in: CHECKED_IN -> ISSUED, and re-derives the order's fulfillment_status."
    roles: [GateStaff, Organizer]
    code: 200
    input: []
    output: Attendee
    side_effects: ["clears checked_in_at", "recomputes Event.checked_in_count", "re-derives Order.fulfillment_status"]

  # ---- ScanRecord -----------------------------------------------------------
  - method: POST
    path: "/api/scans"
    description: "Gate scan. Accepts an ISSUED or TRANSFERRED admission inside the check-in window and marks it CHECKED_IN."
    roles: [GateStaff]
    code: 201
    input: ["attendee_id", "event_id", "gate_code"]
    output: ScanRecord
    side_effects: ["sets Attendee.status CHECKED_IN and checked_in_at", "recomputes Event.checked_in_count", "re-derives Order.fulfillment_status"]

  - method: GET
    path: "/api/scans/{id}"
    description: "Read one scan record."
    roles: [GateStaff, Organizer, PlatformAdmin]
    code: 200
    input: []
    output: ScanRecord
    side_effects: []

  - method: GET
    path: "/api/scans"
    description: "List scan records, filterable by admission and event."
    roles: [GateStaff, Organizer, PlatformAdmin]
    code: 200
    input: ["attendee_id?", "event_id?", "limit?", "offset?"]
    output: ScanRecord[]
    side_effects: []

  # ---- RefundRequest --------------------------------------------------------
  - method: POST
    path: "/api/refund-requests"
    description: "Open a refund request against a paid order. policy defaults to the event's refund_policy."
    roles: [Buyer, Organizer]
    code: 201
    input: ["order_id", "item_refunds", "reason", "policy?"]
    output: RefundRequest
    side_effects: ["creates RefundRequest in status REQUESTED"]

  - method: GET
    path: "/api/refund-requests/{id}"
    description: "Read a refund request including its money breakdown."
    roles: [Buyer, Organizer, FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []

  - method: GET
    path: "/api/refund-requests"
    description: "List refund requests, filterable by order and status."
    roles: [Buyer, Organizer, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: RefundRequest[]
    side_effects: []

  - method: POST
    path: "/api/refund-requests/{id}/approve"
    description: "REQUESTED -> APPROVED; computes refund_amount using the request's policy."
    roles: [Organizer]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["computes refund_amount_cents, platform_retained_cents, organizer_charged_cents"]

  - method: POST
    path: "/api/refund-requests/{id}/reject"
    description: "REQUESTED -> REJECTED."
    roles: [Organizer]
    code: 200
    input: ["reason?"]
    output: RefundRequest
    side_effects: ["zeroes the money fields"]

  - method: POST
    path: "/api/refund-requests/{id}/settle"
    description: "APPROVED -> SETTLED; runs the 4-hop settlement cascade into Order, Organizer and Payout."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["increments Order.refunded_cents and advances Order.payment_status", "voids the refunded Attendees and releases their seats", "increments Organizer.lifetime_refunds_cents and Organizer.version", "recomputes the event's Payout", "holds the Payout when net_amount_cents < 0"]

  # ---- TransferRequest ------------------------------------------------------
  - method: POST
    path: "/api/transfer-requests"
    description: "Create a ticket transfer offer in DRAFT."
    roles: [Buyer]
    code: 201
    input: ["attendee_id", "to_email"]
    output: TransferRequest
    side_effects: ["sets from_buyer_id to the current holder"]

  - method: GET
    path: "/api/transfer-requests/{id}"
    description: "Read a transfer request."
    roles: [Buyer, Organizer, PlatformAdmin]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  - method: GET
    path: "/api/transfer-requests"
    description: "List transfer requests, filterable by admission, sender, recipient and status."
    roles: [Buyer, Organizer, PlatformAdmin]
    code: 200
    input: ["attendee_id?", "from_buyer_id?", "to_buyer_id?", "status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []

  - method: POST
    path: "/api/transfer-requests/{id}/send"
    description: "DRAFT|DECLINED -> SENT; (re)starts the TRANSFER_OFFER_TTL_HOURS clock."
    roles: [Buyer]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["sets offer_expires_at", "increments resend_count when coming from DECLINED"]

  - method: POST
    path: "/api/transfer-requests/{id}/accept"
    description: "SENT -> ACCEPTED; moves the admission to the accepting buyer."
    roles: [Buyer]
    code: 200
    input: ["to_buyer_id"]
    output: TransferRequest
    side_effects: ["sets Attendee.buyer_id, holder_email and status TRANSFERRED"]

  - method: POST
    path: "/api/transfer-requests/{id}/decline"
    description: "SENT -> DECLINED."
    roles: [Buyer]
    code: 200
    input: ["to_buyer_id"]
    output: TransferRequest
    side_effects: ["clears offer_expires_at"]

  # ---- WaitlistEntry --------------------------------------------------------
  - method: POST
    path: "/api/waitlist-entries"
    description: "Join the waitlist for a tier that is exactly sold out (available == 0)."
    roles: [Buyer]
    code: 201
    input: ["ticket_type_id", "buyer_id", "requested_quantity"]
    output: WaitlistEntry
    side_effects: ["creates WaitlistEntry in status WAITING"]

  - method: GET
    path: "/api/waitlist-entries/{id}"
    description: "Read a waitlist entry."
    roles: [Buyer, Organizer, PlatformAdmin]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/api/waitlist-entries"
    description: "List waitlist entries, filterable by tier, buyer, claimed order and status."
    roles: [Buyer, Organizer, PlatformAdmin]
    code: 200
    input: ["ticket_type_id?", "buyer_id?", "claimed_order_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: POST
    path: "/api/waitlist-entries/{id}/claim"
    description: "OFFERED -> CLAIMED; creates the corresponding held Order."
    roles: [Buyer]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["creates an Order with one GA OrderItem of quantity == requested_quantity", "sets claimed_order_id", "increments Event.version by 1"]

  - method: POST
    path: "/api/waitlist-entries/{id}/requeue"
    description: "EXPIRED -> WAITING; the entry re-enters the sweep pool ranked by its original created_at."
    roles: [Buyer]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["clears offered_at and offer_expires_at"]

  # ---- Payout ---------------------------------------------------------------
  - method: POST
    path: "/api/payouts"
    description: "Open a payout for an event whose sales have finished (Event.status IN {SALES_CLOSED, COMPLETED}); freezes reliability_score_snapshot and computes the payout_net_amount chain. Requires expected_organizer_version for optimistic concurrency."
    roles: [FinanceOfficer]
    code: 201
    input: ["organizer_id", "event_id", "expected_organizer_version"]
    output: Payout
    side_effects: ["freezes reliability_score_snapshot from organizer_reliability_score TRAILING", "computes gross/refunds/platform_fee/reserve/net", "sets reserve_release_at = Event.ends_at + ROLLING_RESERVE_RELEASE_DAYS", "increments Organizer.version by 1"]

  - method: GET
    path: "/api/payouts/{id}"
    description: "Read a payout including the full reserve breakdown."
    roles: [FinanceOfficer, Organizer, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/api/payouts"
    description: "List payouts, filterable by organizer, event and status."
    roles: [FinanceOfficer, Organizer, PlatformAdmin]
    code: 200
    input: ["organizer_id?", "event_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []

  - method: POST
    path: "/api/payouts/{id}/mark-eligible"
    description: "ACCRUING -> ELIGIBLE once the event is COMPLETED and no refund is pending."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["recomputes the payout_net_amount chain"]

  - method: POST
    path: "/api/payouts/{id}/hold"
    description: "ACCRUING|ELIGIBLE -> ON_HOLD."
    roles: [FinanceOfficer]
    code: 200
    input: ["reason?"]
    output: Payout
    side_effects: []

  - method: POST
    path: "/api/payouts/{id}/resume"
    description: "ON_HOLD -> ELIGIBLE (cycle)."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["recomputes the payout_net_amount chain"]

  - method: POST
    path: "/api/payouts/{id}/approve"
    description: "ELIGIBLE -> APPROVED; records approved_by_user_id."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets approved_by_user_id to the acting X-User-ID"]

  - method: POST
    path: "/api/payouts/{id}/release"
    description: "APPROVED -> RELEASED. Segregation of duties: the acting X-User-ID must differ from approved_by_user_id."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets released_by_user_id to the acting X-User-ID"]

  - method: POST
    path: "/api/payouts/{id}/release-reserve"
    description: "Pays out the withheld rolling reserve once current_utc >= reserve_release_at."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets reserve_released_cents = reserve_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role not recognised" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "acting role not permitted for the endpoint, or acting user does not own the resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown enum member, or out-of-range integer" }

  - { id: ERR_ORGANIZER_NOT_FOUND, http: 404, condition: "organizer_id does not resolve" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "venue_id does not resolve" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "buyer_id does not resolve" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event_id does not resolve" }
  - { id: ERR_TICKET_TYPE_NOT_FOUND, http: 404, condition: "ticket_type_id does not resolve" }
  - { id: ERR_SEAT_BLOCK_NOT_FOUND, http: 404, condition: "seat_block_id does not resolve" }
  - { id: ERR_PROMO_CODE_NOT_FOUND, http: 404, condition: "promo_code string does not resolve to a PromoCode" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order_id does not resolve" }
  - { id: ERR_ORDER_ITEM_NOT_FOUND, http: 404, condition: "order_item_id in item_refunds or in the path does not resolve" }
  - { id: ERR_ATTENDEE_NOT_FOUND, http: 404, condition: "attendee_id does not resolve" }
  - { id: ERR_SCAN_NOT_FOUND, http: 404, condition: "scan id does not resolve" }
  - { id: ERR_REFUND_REQUEST_NOT_FOUND, http: 404, condition: "refund request id does not resolve" }
  - { id: ERR_TRANSFER_REQUEST_NOT_FOUND, http: 404, condition: "transfer request id does not resolve" }
  - { id: ERR_WAITLIST_ENTRY_NOT_FOUND, http: 404, condition: "waitlist entry id does not resolve" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "payout id does not resolve" }

  - { id: ERR_EVENT_NOT_ONSALE, http: 409, condition: "selling operation attempted while Event.status != ONSALE" }
  - { id: ERR_INVALID_EVENT_TRANSITION, http: 409, condition: "requested Event lifecycle transition is not declared from the current status" }
  - { id: ERR_ORDER_NOT_HELD, http: 409, condition: "pay or release attempted on an Order that is not HELD/PENDING" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "refund requested on an Order whose payment_status is not in {PAID, REFUND_PENDING, PARTIALLY_REFUNDED}" }
  - { id: ERR_INVALID_REFUND_STATE, http: 409, condition: "approve/reject/settle attempted from the wrong RefundRequest.status" }
  - { id: ERR_INVALID_TRANSFER_STATE, http: 409, condition: "send/accept/decline attempted from the wrong TransferRequest.status" }
  - { id: ERR_INVALID_WAITLIST_STATE, http: 409, condition: "claim/requeue attempted from the wrong WaitlistEntry.status" }
  - { id: ERR_INVALID_PAYOUT_STATE, http: 409, condition: "payout transition attempted from the wrong Payout.status" }
  - { id: ERR_ATTENDEE_NOT_ISSUED, http: 409, condition: "operation requires Attendee.status IN {ISSUED, TRANSFERRED} (or CHECKED_IN for undo-check-in) and it is not" }

  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "the new Event's [starts_at, ends_at + VENUE_TURNAROUND_MINUTES) interval intersects a non-CANCELLED Event on the same venue" }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "pay attempted at or after Order.hold_expires_at" }
  - { id: ERR_PROMO_WINDOW_CLOSED, http: 409, condition: "current_utc outside [promo.valid_from, promo.valid_until)" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "scan attempted outside the inclusive check-in window around the event" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 409, condition: "refund requested more than REFUND_REQUEST_WINDOW_DAYS after paid_at, or at/after Event.starts_at" }
  - { id: ERR_TRANSFER_TTL_EXPIRED, http: 409, condition: "accept/decline attempted at or after TransferRequest.offer_expires_at" }
  - { id: ERR_WAITLIST_OFFER_EXPIRED, http: 409, condition: "claim attempted at or after WaitlistEntry.offer_expires_at" }
  - { id: ERR_RESERVE_NOT_MATURED, http: 409, condition: "release-reserve attempted before Payout.reserve_release_at" }
  - { id: ERR_EVENT_NOT_ENDED, http: 409, condition: "complete attempted before Event.ends_at" }
  - { id: ERR_EVENT_START_IN_PAST, http: 422, condition: "starts_at is not strictly after current_utc, or ends_at is not strictly after starts_at" }

  - { id: ERR_ATTENDEE_EVENT_MISMATCH, http: 422, condition: "the scanned Attendee.event_id differs from the scan's event_id" }
  - { id: ERR_PROMO_EVENT_MISMATCH, http: 422, condition: "the PromoCode, TicketType or SeatBlock referenced by an order does not belong to the order's event / tier" }

  - { id: ERR_TICKET_VOIDED, http: 409, condition: "operation attempted on an Attendee whose status is VOIDED" }
  - { id: ERR_ALREADY_CHECKED_IN, http: 409, condition: "scan attempted on an Attendee already in status CHECKED_IN" }
  - { id: ERR_SOD_SAME_ACTOR, http: 403, condition: "the X-User-ID releasing a Payout equals approved_by_user_id" }

  - { id: ERR_SEAT_UNAVAILABLE, http: 409, condition: "a requested seat number is occupied by an issued admission or by a live hold" }
  - { id: ERR_SEAT_RANGE_INVALID, http: 422, condition: "seat numbers outside the block range, seat_numbers length != quantity, seats supplied for a GA tier, or seat_to < seat_from" }
  - { id: ERR_TICKET_LIMIT_EXCEEDED, http: 409, condition: "buyer's live ticket count for the event would exceed MAX_TICKETS_PER_BUYER_PER_EVENT" }
  - { id: ERR_DUPLICATE_PROMO_CODE, http: 409, condition: "PromoCode.code already exists for the event, SeatBlock.row_label already exists for the tier, or Buyer.email already exists" }

  - { id: ERR_SOLD_OUT, http: 409, condition: "ticket_type_availability.available == 0 for the requested tier" }
  - { id: ERR_INSUFFICIENT_CAPACITY, http: 409, condition: "0 < available < requested quantity" }
  - { id: ERR_CAPACITY_AVAILABLE, http: 409, condition: "waitlist join attempted while available > 0" }
  - { id: ERR_PROMO_NOT_APPLICABLE, http: 422, condition: "subtotal_cents < PROMO_MIN_SUBTOTAL_CENTS" }
  - { id: ERR_PROMO_EXHAUSTED, http: 409, condition: "promo.uses_count >= promo.max_uses" }
  - { id: ERR_REFUND_EXCEEDS_ORDER, http: 422, condition: "requested refund quantity exceeds the unrefunded quantity on an order line" }
  - { id: ERR_PAYOUT_NOT_ELIGIBLE, http: 409, condition: "payout transition attempted while Event.status != COMPLETED or net_amount_cents < 0" }
  - { id: ERR_PAYOUT_PENDING_REFUNDS, http: 409, condition: "mark-eligible attempted while a RefundRequest on the event is REQUESTED or APPROVED" }

  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "expected_event_version does not equal Event.version" }
  - { id: ERR_STALE_ORGANIZER_VERSION, http: 412, condition: "expected_organizer_version does not equal Organizer.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Organizer
    description: "Owns events, tiers, seat blocks, promo codes; approves or rejects refunds; voids admissions; runs waitlist sweeps and reads reporting."
    identity: "entity_backed:Organizer"
    exclusive_operations:
      - "POST /api/events"
      - "POST /api/events/{id}/publish"
      - "POST /api/events/{id}/pause"
      - "POST /api/events/{id}/resume"
      - "POST /api/events/{id}/close-sales"
      - "POST /api/events/{id}/complete"
      - "POST /api/events/{id}/cancel"
      - "POST /api/ticket-types"
      - "PATCH /api/ticket-types/{id}"
      - "POST /api/ticket-types/{id}/waitlist-sweep"
      - "POST /api/seat-blocks"
      - "POST /api/promo-codes"
      - "POST /api/attendees/{id}/void"
      - "POST /api/refund-requests/{id}/approve"
      - "POST /api/refund-requests/{id}/reject"
      - "GET /api/events/{id}/report"
    shared_operations:
      - "POST /api/refund-requests (shared with Buyer)"
      - "POST /api/orders/{id}/release (shared with Buyer)"
      - "POST /api/attendees/{id}/undo-check-in (shared with GateStaff)"
      - "all GET reads on its own events, orders, attendees, payouts"

  - name: Buyer
    description: "Purchases tickets, pays, releases holds, requests refunds, transfers admissions, joins and claims waitlist offers."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /api/orders"
      - "POST /api/orders/{id}/pay"
      - "POST /api/transfer-requests"
      - "POST /api/transfer-requests/{id}/send"
      - "POST /api/transfer-requests/{id}/accept"
      - "POST /api/transfer-requests/{id}/decline"
      - "POST /api/waitlist-entries"
      - "POST /api/waitlist-entries/{id}/claim"
      - "POST /api/waitlist-entries/{id}/requeue"
    shared_operations:
      - "POST /api/refund-requests (shared with Organizer)"
      - "POST /api/orders/{id}/release (shared with Organizer)"
      - "GET reads on its own orders, order items, attendees, transfers and waitlist entries"

  - name: GateStaff
    description: "Operates the door: scans admissions and reverses mistaken check-ins."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/scans"
    shared_operations:
      - "POST /api/attendees/{id}/undo-check-in (shared with Organizer)"
      - "GET /api/scans, GET /api/attendees, GET /api/events"

  - name: FinanceOfficer
    description: "Settles refunds and administers payouts and the rolling reserve. Segregation of duties applies between approving and releasing a payout."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/refund-requests/{id}/settle"
      - "POST /api/payouts"
      - "POST /api/payouts/{id}/mark-eligible"
      - "POST /api/payouts/{id}/hold"
      - "POST /api/payouts/{id}/resume"
      - "POST /api/payouts/{id}/approve"
      - "POST /api/payouts/{id}/release"
      - "POST /api/payouts/{id}/release-reserve"
    shared_operations:
      - "GET reads on organizers, events, orders, refund requests, payouts and reports"

  - name: PlatformAdmin
    description: "Platform operations: creates organizers and venues and drives the logical clock. Holds no business approval power over payouts or refunds."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/organizers"
      - "POST /api/venues"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /api/buyers (shared with Anonymous)"
      - "GET reads across all collections"

  - name: Anonymous
    description: "Unauthenticated public surface: buyer self-registration and public event/tier browsing."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /api/buyers (shared with PlatformAdmin)"
      - "GET /api/events, GET /api/events/{id}, GET /api/ticket-types, GET /api/ticket-types/{id}, GET /api/seat-blocks, GET /api/seat-blocks/{id}"

