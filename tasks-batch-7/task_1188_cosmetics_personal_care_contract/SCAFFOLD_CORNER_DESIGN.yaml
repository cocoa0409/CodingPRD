  # ===================================================================
  # Section: cross-cutting complexity layers
  # ===================================================================
  - section: cross_cutting_layers
    instances:
      - name: layer_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.formula_cost_estimate
          - calculations.fulfillable_units
          - calculations.batch_closure_charge
        excluded_because:
          difficulty_instance: formula_cost_standard_vs_current_lot
          rationale: "Variant divergence and selection are asserted across the three §1.8 dual_variant_calc instances."

      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RegulatoryReview.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ShortfallCase.OPEN_to_ESCALATED
        excluded_because:
          difficulty_instance: review_changes_cascade_depth3
          rationale: "N-level cascade ordering is asserted end-to-end by the three §1.8 transitive_cascade instances."

      - name: layer_derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Customer.fields.outstanding_balance_cents
          - entities.ComponentLot.fields.quantity_available
        excluded_because:
          difficulty_instance: customer_outstanding_confirm_cancel_reconciles
          rationale: "Derived-field recompute on confirm/cancel is asserted there; lot reconciliation is asserted in lot_quantity_conservation_reserve_release."

      - name: version_pinning_on_confirm
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.ProductionOrder.DRAFT_to_CONFIRMED
          - entities.ProductionOrder.fields.formula_version_seq
        distinguishing_aspect: "Version-pinning on approval: confirming an order pins formula_version_seq = 1; a later revision creates version_seq 2, but the order's pinned value remains 1."
        test_recipe:
          setup:
            - "Customer; ACTIVE formula (version_seq 1); CONFIRMED order of 1000 units"
          setup_api_calls:
            - call: "POST /cosmfg/customers"
              payload: { name: "Acme Beauty", tier: "STANDARD", minimum_run_units: 1000, credit_limit_cents: 100000000 }
              as: PlantDirector
              captures: { cust: $.data.id }
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { ca: $.data.id }
            - call: "POST /cosmfg/formulas"
              payload: { customer_id: "${cust}", name: "F", ownership: "CUSTOMER_OWNED", confidentiality: "STANDARD", product_class: "SKIN", allergen_flag: false, bulk_mass_per_unit_kg: 0.05, viscosity_target_cps: 4000, viscosity_tolerance_pct: 10, ph_target: 5.5, ph_tolerance: 0.5, ingredients: [{ inci_name: "AQUA", component_id: "${ca}", percentage: 100 }], required_components: [] }
              as: FormulationChemist
              captures: { fm: $.data.id }
            - call: "POST /cosmfg/formulas/${fm}/submit"
              as: FormulationChemist
            - call: "POST /cosmfg/formulas/${fm}/reviews"
              payload: { review_scope: "INCI_LIST" }
              as: FormulationChemist
              captures: { rv: $.data.id }
            - call: "POST /cosmfg/reviews/${rv}/claim"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/reviews/${rv}/approve"
              as: RegulatoryAffairs
            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 1000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /cosmfg/production-orders/${ord}/confirm"
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { pin: $.data.formula_version_seq }
            - call: "GET /cosmfg/formulas/${fm}"
              as: FormulationChemist
              captures: { fm_v: $.data.version }
          trigger:
            - call: "POST /cosmfg/formulas/${fm}/revisions"
              payload: { expected_formula_version: "${fm_v}", name: "F v2" }
              as: FormulationChemist
              captures: { rev: $.data.id, rev_seq: $.data.version_seq }
            - call: "GET /cosmfg/production-orders/${ord}"
              as: ProductionPlanner
              captures: { pin_after: $.data.formula_version_seq }
          assert:
            - "Order pinned formula_version_seq == 1 at confirm"
            - "New revision ${rev} has version_seq == 2"
            - "Order still reports formula_version_seq == 1 after the revision exists"

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - "endpoints.POST /cosmfg/components"
          - "endpoints.GET /cosmfg/components/{id}"
        distinguishing_aspect: "Immediate consistency: a component read in the next request after creation returns exactly the persisted field values, with server-minted id/created_at/updated_at/version present."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /cosmfg/components"
              payload: { name: "Water", kind: "RAW_MATERIAL", supply_mode: "MANUFACTURER_SUPPLIED", standard_cost_per_kg_cents: 1000 }
              as: ProductionPlanner
              captures: { comp: $.data.id }
          trigger:
            - call: "GET /cosmfg/components/${comp}"
              as: ProductionPlanner
              captures: { nm: $.data.name, kd: $.data.kind, v: $.data.version }
          assert:
            - "GET returns name == Water, kind == RAW_MATERIAL, version == 1 with system id/created_at/updated_at populated"

