  # ===========================================================================
  - section: errors
    instances:

      - name: err_lane_certification_lapsed_is_reachable_beyond_its_priority_pair_use
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LANE_CERTIFICATION_LAPSED]
          - endpoints.POST_/airhub/packages/{package_id}/secondary-sort
        distinguishing_aspect: "The certification error is reachable from the secondary sort as well as the primary sort, and on the secondary path it is the ONLY violated check, so it is not merely the winner of a priority conflict."
        test_recipe:
          setup:
            - "Clock 1601. SDF hub, lane P-01 (GENERAL, certified_until 1700) and lane S-01 (GENERAL, certified_until 1560), BANK_A with N701UP landed and unloaded, shift N-B, and one GENERAL package primary-sorted onto P-01 at minute 1401."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1560, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - call: "POST /airhub/shifts"
              payload: { hub_id: "${hub_id}", shift_code: "N-B", start_minutes: 1380, end_minutes: 1630, headcount: 64, productivity_grams_per_operator_hour: 4200, forecast_volume_grams: 380000, certified_for_hazmat: true }
              as: SortSupervisor
              captures: { shift_id: $.data.id }
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-CL-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_cl: $.data.id }
            - call: "POST /airhub/packages/${pkg_cl}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_cl}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:01:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/packages/${pkg_cl}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_LANE_CERTIFICATION_LAPSED"
            - "the lane's capability GENERAL matches the package's GENERAL, so no capability conflict exists and the certification check is the sole failure"
            - "SortLane.${lane_s1_id}.certified_until_minutes == 1560 and the clock reads 1801"
            - "Package.${pkg_cl}.sort_status is still PRIMARY_SORTED"

      - name: err_stale_version_surfaces_via_the_downgrade_write_endpoint
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[downgrade-stale-package]
          - endpoints.POST_/airhub/packages/{package_id}/downgrade-commitment
        distinguishing_aspect: "The OCC error is reachable through the declared write endpoint rather than only through the load path, and it is distinguishable from any state error because the same call succeeds when the version matches."
        test_recipe:
          setup:
            - "Clock 1540. SDF hub, lane P-01, BANK_A with N701UP landed and unloaded, shift N-A, and one NEXT_DAY_AIR package."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-SV-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_sv: $.data.id, pkg_sv_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:40:00Z" }
              as: HubOpsManager
            - call: "POST /airhub/packages/${pkg_sv}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_sv_v2: $.data.version }
          trigger:
            - call: "POST /airhub/packages/${pkg_sv}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_sv_v}" }
              as: CommitmentController
              captures: { err_stale: $.data.error_id }
            - call: "POST /airhub/packages/${pkg_sv}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_sv_v2}" }
              as: CommitmentController
              captures: { ok_status: $.data.commitment_status }
          assert:
            - "the induction bumped the package version from ${pkg_sv_v} to ${pkg_sv_v2}, making the first request stale"
            - "the stale request returns 412 with ${err_stale} == ERR_STALE_VERSION"
            - "Package.${pkg_sv}.commitment_status is still COMMITTED after the stale attempt"
            - "the request carrying the current version ${pkg_sv_v2} succeeds with ${ok_status} == DOWNGRADED, so the 412 was version staleness and not a state refusal"

      - name: err_unload_face_occupied_and_err_late_unload_regression_are_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNLOAD_FACE_OCCUPIED]
          - errors[ERR_LATE_UNLOAD_REGRESSION]
          - endpoints.POST_/airhub/aircraft/{aircraft_id}/begin-unload
        distinguishing_aspect: "Two aircraft-level errors are reachable on the same bank: only one unload face may be open, and an unload completion stamped before the aircraft's own arrival is refused so unload_completed_minutes can never precede actual_arrival_minutes."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, BANK_A with hydraulic crew available and both N701UP (scheduled 1395) and N702UP (scheduled 1402) landed, shift N-A."
          setup_api_calls:
            - *c_clock
