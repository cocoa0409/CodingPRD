  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_to_wallet_conserves_money_cents
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Dispute.UNDER_REVIEW_to_APPROVED
          - calculations.invoice_reconciliation
          - entities.Customer.fields.wallet_credit_cents
