scenario: "Dividend Reinvestment & Direct Stock Purchase Plan (issuer DRIP administrator): enrollment & participation election, dividend reinvestment pricing & discount application, optional cash purchase windows & limits, fractional share accounting & sale on termination, fee structure & waiver, tax reporting & cost basis tracking, plan suspension/modification communication, transfer & gifting of plan shares"

domain_name: drip-administration
api_prefix: /drip

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - conditional_feature_flags
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# Money is integer cents. Share quantities are decimal, 4dp, round_half_up.
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: issuer_name, type: string, source: input, description: "Legal name of the issuing company" }
      - { name: ticker, type: string, source: input, description: "Exchange ticker symbol" }
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | ACTIVE | SUSPENDED | TERMINATED", description: "Plan lifecycle state" }
      - { name: discount_pct, type: number, source: input, description: "Reinvestment discount fraction applied to reference price (e.g. 0.05 = 5%)" }
      - { name: pricing_basis, type: enum, source: input, default: MARKET_CLOSE, constraints: "MARKET_CLOSE | FIVE_DAY_AVERAGE", description: "Which reference price the reinvestment discount applies to" }
      - { name: basis_method, type: enum, source: input, default: FIFO, constraints: "FIFO | AVERAGE_COST", description: "Tax-lot relief method for dispositions" }
      - { name: ocp_min_cents, type: integer, source: input, description: "Minimum optional cash purchase per order" }
      - { name: ocp_max_cents, type: integer, source: input, description: "Maximum cumulative optional cash purchases per enrollment per window" }
      - { name: ocp_fee_pct, type: number, source: input, description: "Proportional OCP fee fraction (e.g. 0.05)" }
      - { name: ocp_fee_min_cents, type: integer, source: input, description: "Floor for OCP fee" }
      - { name: sale_fee_cents, type: integer, source: input, description: "Flat fee on fractional-share sale at termination" }
      - { name: transfer_fee_cents, type: integer, source: input, description: "Flat fee charged to source enrollment on executed transfer/gift" }
      - { name: enrollment_fee_cents, type: integer, source: input, description: "One-time fee assessed at enrollment activation" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Investor legal name" }
      - { name: email, type: string, source: input, description: "Investor email; unique across participants" }
      - { name: fee_waiver_eligible, type: boolean, source: input, default: false, description: "When true, OCP fees are auto-waived (conditional feature flag)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; owner of this plan account" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan enrolled in" }
      - { name: status, type: enum, source: system, default: PENDING, constraints: "PENDING | ACTIVE | SUSPENDED | TERMINATED", description: "Enrollment lifecycle state; SUSPENDED mirrors plan suspension" }
      - { name: election, type: enum, source: input, constraints: "FULL_REINVEST | PARTIAL_REINVEST | CASH_ONLY", description: "Participation election for dividends" }
      - { name: reinvest_pct, type: number, source: input, description: "Fraction of each dividend reinvested; required iff election == PARTIAL_REINVEST, must be in (0, 1) exclusive" , constraints: "0 < reinvest_pct < 1 when PARTIAL_REINVEST; must be absent otherwise" }
      - { name: share_balance, type: number, source: computed, default: 0, description: "Sum of ShareLedgerEntry.quantity over all entries of this enrollment; 4dp" }
      - { name: total_cost_basis_cents, type: integer, source: computed, default: 0, description: "Sum over TaxLot of round(remaining_quantity * cost_per_share_cents) with last-lot remainder reconciliation" }
      - { name: terminated_at, type: datetime, source: system, description: "Set on termination; null otherwise" }

  - name: DividendEvent
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan paying the dividend" }
      - { name: amount_per_share_cents, type: integer, source: input, description: "Declared dividend per share, integer cents" }
      - { name: record_date, type: datetime, source: input, description: "Holders of record at end of this date (23:59:59Z) are eligible" }
      - { name: payable_date, type: datetime, source: input, description: "Reinvestment executes on/after this date" }
      - { name: status, type: enum, source: system, default: DECLARED, constraints: "DECLARED | PRICED | REINVESTED | SETTLED", description: "Dividend processing state" }
      - { name: closing_price_cents, type: integer, source: input, description: "Market close reference price supplied at pricing step" }
      - { name: avg5_price_cents, type: integer, source: input, description: "Five-day average reference price supplied at pricing step" }
      - { name: reinvestment_price_cents, type: integer, source: computed, description: "round_half_up(selected_reference * (1 - discount_pct)) to integer cents; set by pricing step" }

  - name: PurchaseWindow
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan offering the window" }
      - { name: opens_at, type: datetime, source: input, description: "Window opens at this instant (inclusive lower bound of half-open interval)" }
      - { name: closes_at, type: datetime, source: input, description: "Window closes at this instant (exclusive upper bound of half-open interval [opens_at, closes_at))" }
      - { name: price_cents, type: integer, source: input, description: "Fixed execution price for all orders settled in this window" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | OPEN | CLOSED | SETTLED", description: "Window lifecycle state" }
      - { name: submitted_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this window's PurchaseOrders with status SUBMITTED; reconciled on every order mutation" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: input, description: "FK -> PurchaseWindow.id; window this order is placed in" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; purchasing enrollment" }
      - { name: amount_cents, type: integer, source: input, description: "Cash amount of the optional cash purchase" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "SUBMITTED | SETTLED | CANCELLED | REJECTED", description: "Order lifecycle state" }
      - { name: settled_shares, type: number, source: computed, description: "round_half_up((amount_cents - fee_charged_cents) / window.price_cents, 4); set at settlement, null before" }

  - name: ShareLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; account this movement belongs to" }
      - { name: entry_type, type: enum, source: system, constraints: "INITIAL | REINVEST | CASH_PAYOUT | OCP_PURCHASE | FRACTIONAL_SALE | WHOLE_SHARE_WITHDRAWAL | TRANSFER_OUT | TRANSFER_IN", description: "Kind of share/cash movement" }
      - { name: quantity, type: number, source: system, description: "Signed share delta, 4dp; 0 for CASH_PAYOUT" }
      - { name: price_cents, type: integer, source: system, description: "Execution/reference price per share; null when not applicable" }
      - { name: cash_cents, type: integer, source: system, description: "Cash paid out (CASH_PAYOUT full amount, FRACTIONAL_SALE net proceeds); null otherwise" }
      - { name: source_type, type: string, source: system, description: "Origin tag: DEPOSIT | DIVIDEND | WINDOW | TERMINATION | TRANSFER (plain provenance label, not a foreign key)" }
      - { name: source_id, type: string, source: system, description: "Id of originating DividendEvent/PurchaseOrder/TransferInstruction record; plain provenance label, not a foreign key" }

  - name: TaxLot
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; holder of the lot" }
      - { name: acquired_at, type: datetime, source: system, description: "Acquisition timestamp (clock time of the acquiring event)" }
      - { name: quantity, type: number, source: system, description: "Original shares in the lot, 4dp" }
      - { name: remaining_quantity, type: number, source: system, description: "Shares not yet disposed, 4dp" }
      - { name: cost_per_share_cents, type: integer, source: system, description: "Per-share basis; TRANSFER_IN lots carry over the source lot's value" }
      - { name: total_basis_cents, type: integer, source: system, description: "Original lot basis; for REINVEST lots equals the reinvested cash cents" }
      - { name: acquisition_type, type: enum, source: system, constraints: "INITIAL | REINVEST | OCP | TRANSFER_IN", description: "How the lot was acquired" }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; account charged" }
      - { name: fee_type, type: enum, source: system, constraints: "ENROLLMENT | OCP | SALE | TRANSFER", description: "Fee category" }
      - { name: computed_cents, type: integer, source: system, description: "Fee computed by the applicable calculation before waiver" }
      - { name: waived, type: boolean, source: system, default: false, description: "True when auto-waived (fee_waiver_eligible) or waived by PlanAdmin" }
      - { name: waived_reason, type: string, source: system, description: "AUTO_ELIGIBLE or admin-supplied reason; null when not waived" }
      - { name: charged_cents, type: integer, source: system, description: "0 when waived, else computed_cents" }
      - { name: source_type, type: string, source: system, description: "Origin tag: ACTIVATION | WINDOW | TERMINATION | TRANSFER (plain provenance label, not a foreign key)" }
      - { name: source_id, type: string, source: system, description: "Id of originating record; plain provenance label, not a foreign key" }

  - name: PlanNotice
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id; plan the notice concerns" }
      - { name: notice_type, type: enum, source: input, constraints: "MODIFICATION | SUSPENSION | TERMINATION", description: "What the notice communicates" }
      - { name: message, type: string, source: input, description: "Free-text communication body" }
      - { name: effective_at, type: datetime, source: input, description: "When the noticed change takes effect" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | PUBLISHED | EFFECTIVE", description: "Notice lifecycle state" }
      - { name: published_at, type: datetime, source: system, description: "Set on publication; null otherwise" }

  - name: TransferInstruction
    parent: null
    common_fields: true
    fields:
      - { name: source_enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; account shares leave from" }
      - { name: recipient_enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; required for transfer_type TRANSFER, must be null for GIFT" , constraints: "nullable" }
      - { name: transfer_type, type: enum, source: input, constraints: "TRANSFER | GIFT", description: "TRANSFER = in-plan move to another enrollment; GIFT = shares leave the plan to an external recipient" }
      - { name: quantity, type: number, source: input, description: "Shares to move, 4dp, must be > 0" }
      - { name: recipient_name, type: string, source: input, description: "External recipient name; required for GIFT, null for TRANSFER", constraints: "nullable" }
      - { name: recipient_address, type: string, source: input, description: "External recipient address; required for GIFT, null for TRANSFER", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "SUBMITTED | EXECUTED | CANCELLED", description: "Instruction lifecycle state" }
      - { name: fmv_per_share_cents, type: integer, source: input, description: "Fair market value per share supplied at execution; used for gift valuation/reporting", constraints: "null until execution" }
      - { name: executed_at, type: datetime, source: system, description: "Set on execution; null otherwise" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /drip/plans/{id}/publish"
        actor: PlanAdmin
        preconditions: ["plan.status == DRAFT"]
        side_effects: ["increments Plan.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /drip/plans/{id}/suspend OR POST /drip/notices/{id}/take-effect on a PUBLISHED SUSPENSION notice"
        actor: PlanAdmin
        preconditions: ["plan.status == ACTIVE"]
        side_effects:
          - "Cascade link 1 -> Enrollment: every Enrollment of this plan with status ACTIVE transitions to SUSPENDED"
          - "Cascade link 2 -> PurchaseOrder: every PurchaseOrder whose enrollment was just suspended and whose status == SUBMITTED transitions to REJECTED"
          - "Cascade link 3 -> PurchaseWindow: each REJECTED order is removed from its window's submitted_total_cents (derived field reconciliation)"
          - "increments Plan.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /drip/plans/{id}/resume"
        actor: PlanAdmin
        preconditions: ["plan.status == SUSPENDED"]
        side_effects:
          - "Cascade: every Enrollment of this plan with status SUSPENDED transitions back to ACTIVE"
          - "REJECTED PurchaseOrders are NOT restored (asymmetric compensation)"
          - "increments Plan.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /drip/plans/{id}/terminate OR take-effect of a PUBLISHED TERMINATION notice"
        actor: PlanAdmin
        preconditions: ["plan.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "Cascade: every non-terminal Enrollment of this plan terminates, each running the full Enrollment termination cascade (fractional sale, lot relief, fee)"
          - "increments Plan.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /drip/plans/{id}/terminate"
        actor: PlanAdmin
        preconditions: ["plan.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "Cascade: every non-terminal Enrollment of this plan terminates, each running the full Enrollment termination cascade"
          - "increments Plan.version by 1"

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /drip/enrollments/{id}/activate"
        actor: PlanAdmin
        preconditions: ["enrollment.status == PENDING", "plan.status == ACTIVE (cross-entity guard via enrollment.plan_id)"]
        side_effects:
          - "Creates FeeAssessment fee_type ENROLLMENT with computed_cents = plan.enrollment_fee_cents"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from Plan ACTIVE->SUSPENDED"
        actor: system
        preconditions: ["enrollment.status == ACTIVE", "plan suspension transition is executing"]
        side_effects:
          - "Cascade link 2: this enrollment's SUBMITTED PurchaseOrders transition to REJECTED, and each rejection decrements its window's submitted_total_cents"
          - "increments Enrollment.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade from Plan SUSPENDED->ACTIVE (resume)"
        actor: system
        preconditions: ["enrollment.status == SUSPENDED", "plan resume transition is executing"]
        side_effects: ["increments Enrollment.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /drip/enrollments/{id}/terminate OR cascade from Plan terminate"
        actor: Participant
        preconditions: ["enrollment.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "Cascade link 1 -> ShareLedgerEntry: termination_settlement runs; if fractional part of share_balance > 0, creates FRACTIONAL_SALE entry (quantity = -frac, price_cents = sale_price_cents, cash_cents = net proceeds); always creates WHOLE_SHARE_WITHDRAWAL entry for the whole-share part"
          - "Cascade link 2 -> TaxLot: the FRACTIONAL_SALE/WITHDRAWAL disposes all lots per plan.basis_method relief order, setting every TaxLot.remaining_quantity to 0"
          - "Cascade link 2 -> FeeAssessment: the FRACTIONAL_SALE entry (only when fractional part > 0) creates a SALE fee with computed_cents = plan.sale_fee_cents"
          - "sets terminated_at; increments Enrollment.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /drip/enrollments/{id}/terminate OR cascade from Plan terminate"
        actor: Participant
        preconditions: ["enrollment.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "Same termination cascade as ACTIVE->TERMINATED"
          - "sets terminated_at; increments Enrollment.version by 1"

  - entity: DividendEvent
    initial_state: DECLARED
    terminal_states: [SETTLED]
    transitions:
      - from: DECLARED
        to: PRICED
        trigger: "POST /drip/dividend-events/{id}/price"
        actor: PlanAdmin
        preconditions: ["dividend.status == DECLARED"]
        side_effects:
          - "reinvestment_allocation pricing step: reinvestment_price_cents = round_half_up(selected_reference * (1 - plan.discount_pct)) where selected_reference is closing_price_cents or avg5_price_cents per plan.pricing_basis"
          - "increments DividendEvent.version by 1"
      - from: PRICED
        to: REINVESTED
        trigger: "POST /drip/dividend-events/{id}/execute"
        actor: PlanAdmin
        preconditions: ["dividend.status == PRICED", "plan.status == ACTIVE", "logical clock >= payable_date"]
        side_effects:
          - "For every Enrollment of the plan with status ACTIVE and record-date-eligible shares > 0: runs dividend_cash_split then reinvestment_allocation, creating REINVEST ShareLedgerEntry + TaxLot (acquisition_type REINVEST) for the reinvested portion and a CASH_PAYOUT entry for the cash portion (full amount when election == CASH_ONLY)"
          - "increments DividendEvent.version by 1"
      - from: REINVESTED
        to: SETTLED
        trigger: "POST /drip/dividend-events/{id}/settle"
        actor: PlanAdmin
        preconditions: ["dividend.status == REINVESTED"]
        side_effects: ["increments DividendEvent.version by 1"]

  - entity: PurchaseWindow
    initial_state: SCHEDULED
    terminal_states: [SETTLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /drip/purchase-windows/{id}/open"
        actor: PlanAdmin
        preconditions: ["window.status == SCHEDULED", "plan.status == ACTIVE", "opens_at <= logical clock < closes_at"]
        side_effects: ["increments PurchaseWindow.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /drip/purchase-windows/{id}/close"
        actor: PlanAdmin
        preconditions: ["window.status == OPEN", "logical clock >= closes_at"]
        side_effects: ["increments PurchaseWindow.version by 1"]
      - from: CLOSED
        to: SETTLED
        trigger: "POST /drip/purchase-windows/{id}/settle"
        actor: PlanAdmin
        preconditions: ["window.status == CLOSED"]
        side_effects:
          - "For every SUBMITTED PurchaseOrder of the window: ocp_fee_assessment runs (creates FeeAssessment fee_type OCP), order transitions to SETTLED with settled_shares set, and an OCP_PURCHASE ShareLedgerEntry + TaxLot (acquisition_type OCP, cost_per_share_cents = window.price_cents) are created on the order's enrollment"
          - "increments PurchaseWindow.version by 1"

  - entity: PurchaseOrder
    initial_state: SUBMITTED
    terminal_states: [SETTLED, CANCELLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /drip/purchase-orders/{id}/cancel"
        actor: Participant
        preconditions: ["order.status == SUBMITTED", "window.status == OPEN", "acting participant owns order.enrollment_id"]
        side_effects:
          - "order amount_cents removed from window.submitted_total_cents"
          - "increments PurchaseOrder.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system cascade from Plan suspension via Enrollment suspension"
        actor: system
        preconditions: ["order.status == SUBMITTED", "enrollment suspension cascade is executing"]
        side_effects:
          - "order amount_cents removed from window.submitted_total_cents"
          - "increments PurchaseOrder.version by 1"
      - from: SUBMITTED
        to: SETTLED
        trigger: "system cascade from PurchaseWindow CLOSED->SETTLED"
        actor: system
        preconditions: ["order.status == SUBMITTED", "window settlement is executing"]
        side_effects:
          - "settled_shares computed; OCP_PURCHASE ledger entry and OCP TaxLot created on the enrollment"
          - "increments PurchaseOrder.version by 1"

  - entity: PlanNotice
    initial_state: DRAFT
    terminal_states: [EFFECTIVE]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /drip/notices/{id}/publish"
        actor: PlanAdmin
        preconditions: ["notice.status == DRAFT", "effective_at - logical clock >= 10 days (MIN_NOTICE_DAYS)"]
        side_effects: ["sets published_at; increments PlanNotice.version by 1"]
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "POST /drip/notices/{id}/take-effect"
        actor: PlanAdmin
        preconditions: ["notice.status == PUBLISHED", "logical clock >= effective_at"]
        side_effects:
          - "When notice_type == SUSPENSION: triggers Plan ACTIVE->SUSPENDED transition with its full cascade (guarded: plan must be ACTIVE)"
          - "When notice_type == TERMINATION: triggers Plan ->TERMINATED transition with its full cascade"
          - "When notice_type == MODIFICATION: no plan transition (the modification was already applied by PATCH /drip/plans/{id})"
          - "increments PlanNotice.version by 1"

  - entity: TransferInstruction
    initial_state: SUBMITTED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: EXECUTED
        trigger: "POST /drip/transfer-instructions/{id}/execute"
        actor: PlanAdmin
        preconditions:
          - "instruction.status == SUBMITTED"
          - "source enrollment status == ACTIVE and plan.status == ACTIVE"
          - "source share_balance >= quantity (re-checked at execution)"
          - "for TRANSFER: recipient enrollment exists, belongs to the same plan, status == ACTIVE"
        side_effects:
          - "Creates TRANSFER_OUT ShareLedgerEntry (quantity = -quantity, price_cents = fmv_per_share_cents) on source enrollment"
          - "Relieves source TaxLots per plan.basis_method order (FIFO: oldest acquired_at first; AVERAGE_COST: pro-rata across all lots at weighted average cost)"
          - "For TRANSFER: creates TRANSFER_IN entry (+quantity) on recipient and a TRANSFER_IN TaxLot carrying over the source relief cost_per_share_cents"
          - "For GIFT: no recipient entry; disposition is reported at fmv_per_share_cents"
          - "Creates FeeAssessment fee_type TRANSFER on source enrollment, computed_cents = plan.transfer_fee_cents"
          - "sets executed_at; increments TransferInstruction.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /drip/transfer-instructions/{id}/cancel"
        actor: Participant
        preconditions: ["instruction.status == SUBMITTED", "acting participant owns source_enrollment_id"]
        side_effects: ["increments TransferInstruction.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-modify-stale-version
    parent_entity: Plan
    write_endpoint: "PATCH /drip/plans/{id}"
    occ_field: expected_plan_version
    description: |
      Modifying a Plan whose version has advanced since the client last
      observed it is rejected: the client's edits were computed against a
      stale configuration (discount, limits, fees) and applying them would
      silently overwrite the intervening modification.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
  - rule_id: enrollment-election-stale-version
    parent_entity: Enrollment
    write_endpoint: "PATCH /drip/enrollments/{id}/election"
    occ_field: expected_enrollment_version
    description: |
      Changing the participation election of an Enrollment whose version has
      advanced since the client last observed it is rejected: an intervening
      mutation (e.g. a suspension cascade or a prior election change) makes
      the client's view stale.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reinvestment_allocation
    trigger: "DividendEvent DECLARED->PRICED (pricing step) and PRICED->REINVESTED (allocation step)"
    algorithm: threshold
    formula: |
      # Pricing step (at price time):
      selected_reference = closing_price_cents if plan.pricing_basis == MARKET_CLOSE else avg5_price_cents
      reinvestment_price_cents = round_half_up(selected_reference * (1 - plan.discount_pct))   # ROUND PRICE FIRST, integer cents
      # Allocation step (at execute time), per eligible enrollment:
      eligible_shares = sum of ShareLedgerEntry.quantity for entries with created_at <= record_date 23:59:59Z
      total_cash_cents = round_half_up(eligible_shares * amount_per_share_cents)               # integer cents
      reinvest_cash_cents, cash_payout_cents = dividend_cash_split(total_cash_cents, election, reinvest_pct)
      # NESTED ROUNDING ORDER IS PINNED: price is rounded to integer cents BEFORE the share division.
      reinvested_shares = round_half_up(reinvest_cash_cents / reinvestment_price_cents, 4)
      REINVEST TaxLot: quantity = reinvested_shares, cost_per_share_cents = reinvestment_price_cents,
                       total_basis_cents = reinvest_cash_cents (actual cash spent, not shares*price)
    input_set: "Enrollments of the dividend's plan with status == ACTIVE at execution time AND eligible_shares > 0; SUSPENDED enrollments are unreachable because execute requires plan ACTIVE"
    constants:
      SHARE_DECIMALS: 4
    precision: "money: integer cents round_half_up; shares: 4 decimal places round_half_up"
    variants:
      - name: market_close_basis
        when: "plan.pricing_basis == MARKET_CLOSE"
        difference: "selected_reference = closing_price_cents"
      - name: five_day_average_basis
        when: "plan.pricing_basis == FIVE_DAY_AVERAGE"
        difference: "selected_reference = avg5_price_cents; identical dividend data yields a different reinvestment_price_cents and therefore a different share count"

  - name: dividend_cash_split
    trigger: "inside reinvestment_allocation at DividendEvent execute time, per eligible enrollment"
    algorithm: aggregation
    formula: |
      if election == FULL_REINVEST:  reinvest_cash_cents = total_cash_cents; cash_payout_cents = 0
      if election == CASH_ONLY:      reinvest_cash_cents = 0;               cash_payout_cents = total_cash_cents
      if election == PARTIAL_REINVEST:
        reinvest_cash_cents = round_half_up(total_cash_cents * reinvest_pct)   # round the reinvested part FIRST
        cash_payout_cents   = total_cash_cents - reinvest_cash_cents           # remainder takes the rounding residue
      # invariant: reinvest_cash_cents + cash_payout_cents == total_cash_cents exactly
    input_set: "Per-enrollment total_cash_cents computed in reinvestment_allocation"
    constants: {}
    precision: "integer cents, round_half_up on the reinvested portion only"

  - name: disposition_basis_relief
    trigger: "TransferInstruction SUBMITTED->EXECUTED and Enrollment ->TERMINATED (fractional sale / whole withdrawal)"
    algorithm: chronological
    formula: |
      # Determine which lots are relieved and the basis that leaves the enrollment.
      # FIFO variant: relieve lots ordered by acquired_at ASC, ties by created_at ASC; take min(needed, lot.remaining)
      #   from each until `quantity` is covered; basis_out = round_half_up(sum over lots of qty_taken * lot.cost_per_share_cents);
      #   when a lot is fully consumed its contribution is (lot.total_basis_cents - already_relieved_from_that_lot) to prevent drift.
      # AVERAGE_COST variant: avg_cost = round_half_up(sum(remaining_i * cost_i) / sum(remaining_i)) computed ONCE over all
      #   lots with remaining_quantity > 0 before relief; basis_out = round_half_up(quantity * avg_cost); lots are relieved
      #   pro-rata: each lot loses round_half_up(quantity * lot.remaining / total_remaining, 4), oldest lot absorbs any 4dp residue.
      # gain_cents (for tax report) = proceeds_cents - basis_out, where proceeds_cents = round_half_up(quantity * fmv_or_sale_price)
    input_set: "TaxLots of the enrollment with remaining_quantity > 0"
    constants: {}
    precision: "integer cents round_half_up; share quantities 4dp round_half_up"
    variants:
      - name: fifo
        when: "plan.basis_method == FIFO"
        difference: "relieves oldest lots first at their own cost_per_share_cents"
      - name: average_cost
        when: "plan.basis_method == AVERAGE_COST"
        difference: "relieves all lots pro-rata at a single weighted-average cost; identical lots and quantity yield a different basis_out and gain than FIFO"

  - name: ocp_fee_assessment
    trigger: "PurchaseWindow CLOSED->SETTLED, per SUBMITTED PurchaseOrder"
    algorithm: tiered_pricing
    formula: |
      # Three-plus inputs with non-linear interaction: amount, proportional rate, floor, waiver flag.
      computed_cents = max(plan.ocp_fee_min_cents, round_half_up(order.amount_cents * plan.ocp_fee_pct))
      if enrollment.participant.fee_waiver_eligible:  waived = true;  waived_reason = AUTO_ELIGIBLE; charged_cents = 0
      else:                                           waived = false; charged_cents = computed_cents
      settled_shares = round_half_up((order.amount_cents - charged_cents) / window.price_cents, 4)
    input_set: "PurchaseOrders of the settling window with status == SUBMITTED"
    constants: {}
    precision: "integer cents round_half_up; shares 4dp round_half_up"

  - name: window_purchase_limit
    trigger: "POST /drip/purchase-windows/{window_id}/purchase-orders (validation time)"
    algorithm: threshold
    formula: |
      existing_cents = sum of amount_cents over PurchaseOrders where window_id == this window
                       AND enrollment_id == request.enrollment_id AND status == SUBMITTED
      # BOUNDARY: equality is allowed; only a strict overshoot is rejected.
      if existing_cents + request.amount_cents > plan.ocp_max_cents: reject ERR_PURCHASE_LIMIT_EXCEEDED
    input_set: "SUBMITTED PurchaseOrders only (CANCELLED/REJECTED release their reservation)"
    constants: {}
    precision: "integer cents, exact comparison"

  - name: termination_settlement
    trigger: "Enrollment ACTIVE->TERMINATED or SUSPENDED->TERMINATED"
    algorithm: aggregation
    formula: |
      whole_shares = floor(share_balance)                 # 4dp balance; integer part
      frac_shares  = round_half_up(share_balance - whole_shares, 4)
      # BOUNDARY: frac_shares == 0.0000 -> NO FRACTIONAL_SALE entry and NO sale fee at all.
      if frac_shares > 0:
        gross_cents = round_half_up(frac_shares * sale_price_cents)   # ROUND GROSS FIRST
        fee_cents   = plan.sale_fee_cents                             # SALE FeeAssessment (waivable by admin only)
        net_cents   = gross_cents - fee_cents                         # fee subtracted AFTER gross rounding (pinned order)
        create FRACTIONAL_SALE ShareLedgerEntry(quantity = -frac_shares, price_cents = sale_price_cents, cash_cents = net_cents)
      create WHOLE_SHARE_WITHDRAWAL ShareLedgerEntry(quantity = -whole_shares, price_cents = null, cash_cents = null) when whole_shares > 0
      run disposition_basis_relief for the FULL disposed quantity (all lots -> remaining_quantity = 0)
    input_set: "The terminating enrollment's share_balance and TaxLots"
    constants: {}
    precision: "integer cents round_half_up; shares 4dp round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on the endpoint per RBAC; Participant-role callers may only touch resources whose owning participant_id == X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path-templated resource id resolves, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "Request body shape: required fields present, enum members valid, numeric ranges sane (quantity > 0, amounts > 0, reinvest_pct rules)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "State machine: the trigger is valid from the entity's current state (covers all invalid-from rejections and terminal lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Plan must be ACTIVE for: enrollment create/activate, dividend create/execute, window create/open, order submit, transfer create/execute", error_id: ERR_PLAN_NOT_ACTIVE, http_status: 409, applies_to: ["POST /drip/plans/{plan_id}/enrollments", "POST /drip/enrollments/{id}/activate", "POST /drip/plans/{plan_id}/dividend-events", "POST /drip/dividend-events/{id}/execute", "POST /drip/plans/{plan_id}/purchase-windows", "POST /drip/purchase-windows/{id}/open", "POST /drip/purchase-windows/{window_id}/purchase-orders", "POST /drip/enrollments/{enrollment_id}/transfers", "POST /drip/transfer-instructions/{id}/execute"] }
  - { priority: 5, category: state, check: "Window must be OPEN for order submit and order cancel", error_id: ERR_WINDOW_NOT_OPEN, http_status: 409, applies_to: ["POST /drip/purchase-windows/{window_id}/purchase-orders", "POST /drip/purchase-orders/{id}/cancel"] }
  - { priority: 5, category: state, check: "Enrollment must be ACTIVE for: deposit, election change, order submit, transfer create", error_id: ERR_ENROLLMENT_NOT_ACTIVE, http_status: 409, applies_to: ["POST /drip/enrollments/{enrollment_id}/deposits", "PATCH /drip/enrollments/{id}/election", "POST /drip/purchase-windows/{window_id}/purchase-orders", "POST /drip/enrollments/{enrollment_id}/transfers"] }
  - { priority: 6, category: business_temporal, check: "Window schedule sanity: opens_at < closes_at and opens_at >= logical clock (no windows opening in the past)", error_id: ERR_WINDOW_SCHEDULE_INVALID, http_status: 422, applies_to: ["POST /drip/plans/{plan_id}/purchase-windows"] }
  - { priority: 6, category: business_temporal, check: "Window must not intersect any dividend blackout of the same plan: blackout is the CLOSED interval [record_date - 2 days 00:00:00Z, payable_date 23:59:59Z] of any non-SETTLED DividendEvent; touching either blackout boundary counts as intersection", error_id: ERR_WINDOW_DIVIDEND_BLACKOUT, http_status: 422, applies_to: ["POST /drip/plans/{plan_id}/purchase-windows"] }
  - { priority: 6, category: business_temporal, check: "Notice publication lead time: effective_at - logical clock >= 10 days", error_id: ERR_NOTICE_LEAD_TIME_SHORT, http_status: 422, applies_to: ["POST /drip/notices/{id}/publish"] }
  - { priority: 6, category: business_temporal, check: "Window open timing: logical clock must satisfy opens_at <= now < closes_at", error_id: ERR_WINDOW_OPEN_TOO_EARLY, http_status: 422, applies_to: ["POST /drip/purchase-windows/{id}/open"] }
  - { priority: 7, category: business_constraint, check: "Window overlap: the new window's HALF-OPEN interval [opens_at, closes_at) must not intersect any existing non-SETTLED window of the same plan; adjacency (one closes exactly when the other opens) is allowed", error_id: ERR_WINDOW_OVERLAP, http_status: 422, applies_to: ["POST /drip/plans/{plan_id}/purchase-windows"] }
  - { priority: 7, category: business_constraint, check: "One non-terminal enrollment per participant per plan: no second enrollment while one with status IN {PENDING, ACTIVE, SUSPENDED} exists", error_id: ERR_ALREADY_ENROLLED, http_status: 409, applies_to: ["POST /drip/plans/{plan_id}/enrollments"] }
  - { priority: 7, category: business_constraint, check: "Election payload: reinvest_pct present and in (0,1) iff election == PARTIAL_REINVEST, absent otherwise", error_id: ERR_INVALID_ELECTION, http_status: 422, applies_to: ["POST /drip/plans/{plan_id}/enrollments", "PATCH /drip/enrollments/{id}/election"] }
  - { priority: 7, category: business_constraint, check: "Order amount must be >= plan.ocp_min_cents", error_id: ERR_PURCHASE_BELOW_MIN, http_status: 422, applies_to: ["POST /drip/purchase-windows/{window_id}/purchase-orders"] }
  - { priority: 8, category: business_fiscal, check: "window_purchase_limit: cumulative SUBMITTED total for (window, enrollment) + new amount must be <= plan.ocp_max_cents", error_id: ERR_PURCHASE_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /drip/purchase-windows/{window_id}/purchase-orders"] }
  - { priority: 8, category: business_fiscal, check: "Transfer quantity must be <= source enrollment share_balance (checked at create and re-checked at execute)", error_id: ERR_INSUFFICIENT_SHARES, http_status: 422, applies_to: ["POST /drip/enrollments/{enrollment_id}/transfers", "POST /drip/transfer-instructions/{id}/execute"] }
  - { priority: 9, category: business_referential, check: "TRANSFER requires recipient_enrollment_id pointing to an ACTIVE enrollment of the same plan; GIFT forbids recipient_enrollment_id and requires recipient_name + recipient_address", error_id: ERR_RECIPIENT_NOT_ENROLLED, http_status: 422, applies_to: ["POST /drip/enrollments/{enrollment_id}/transfers", "POST /drip/transfer-instructions/{id}/execute"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/drip/plans", description: "Create a plan (starts DRAFT)", roles: [PlanAdmin], code: 201, input: [issuer_name, ticker, name, discount_pct, "pricing_basis?", "basis_method?", ocp_min_cents, ocp_max_cents, ocp_fee_pct, ocp_fee_min_cents, sale_fee_cents, transfer_fee_cents, enrollment_fee_cents], output: Plan, side_effects: [] }
  - { method: GET, path: "/drip/plans", description: "List plans", roles: [PlanAdmin, Participant], code: 200, input: ["status?"], output: "Plan[]", side_effects: [] }
  - { method: GET, path: "/drip/plans/{id}", description: "Get one plan", roles: [PlanAdmin, Participant], code: 200, input: [], output: Plan, side_effects: [] }
  - { method: PATCH, path: "/drip/plans/{id}", description: "Modify plan configuration (discount, limits, fees, basis methods). OCC-guarded. When plan is ACTIVE, auto-creates a DRAFT MODIFICATION PlanNotice that must be published.", roles: [PlanAdmin], code: 200, input: [expected_plan_version, "name?", "discount_pct?", "pricing_basis?", "basis_method?", "ocp_min_cents?", "ocp_max_cents?", "ocp_fee_pct?", "ocp_fee_min_cents?", "sale_fee_cents?", "transfer_fee_cents?", "enrollment_fee_cents?"], output: Plan, side_effects: ["increments Plan.version by 1", "creates DRAFT MODIFICATION PlanNotice when plan.status == ACTIVE"] }
  - { method: POST, path: "/drip/plans/{id}/publish", description: "DRAFT -> ACTIVE", roles: [PlanAdmin], code: 200, input: [], output: Plan, side_effects: ["increments Plan.version by 1"] }
  - { method: POST, path: "/drip/plans/{id}/suspend", description: "ACTIVE -> SUSPENDED with enrollment/order cascade", roles: [PlanAdmin], code: 200, input: [], output: Plan, side_effects: ["Plan suspend cascade (Enrollment SUSPENDED, SUBMITTED orders REJECTED, window totals reconciled)", "increments Plan.version by 1"] }
  - { method: POST, path: "/drip/plans/{id}/resume", description: "SUSPENDED -> ACTIVE; enrollments restored, REJECTED orders stay REJECTED", roles: [PlanAdmin], code: 200, input: [], output: Plan, side_effects: ["Plan resume cascade", "increments Plan.version by 1"] }
  - { method: POST, path: "/drip/plans/{id}/terminate", description: "ACTIVE|SUSPENDED -> TERMINATED; terminates all non-terminal enrollments", roles: [PlanAdmin], code: 200, input: [], output: Plan, side_effects: ["per-enrollment termination cascade", "increments Plan.version by 1"] }
  - { method: POST, path: "/drip/participants", description: "Register a participant", roles: [PlanAdmin], code: 201, input: [full_name, email, "fee_waiver_eligible?"], output: Participant, side_effects: [] }
  - { method: GET, path: "/drip/participants/{id}", description: "Get one participant (Participant role limited to own id)", roles: [PlanAdmin, Participant], code: 200, input: [], output: Participant, side_effects: [] }
  - { method: GET, path: "/drip/participants/{id}/enrollments", description: "List enrollments of a participant", roles: [PlanAdmin, Participant], code: 200, input: [], output: "Enrollment[]", side_effects: [] }
  - { method: POST, path: "/drip/plans/{plan_id}/enrollments", description: "Enroll the acting participant (creates PENDING enrollment)", roles: [Participant], code: 201, input: [participant_id, election, "reinvest_pct?"], output: Enrollment, side_effects: [] }
  - { method: GET, path: "/drip/plans/{id}/enrollments", description: "List enrollments of a plan", roles: [PlanAdmin], code: 200, input: ["status?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/drip/enrollments/{id}", description: "Get one enrollment (owner or admin)", roles: [PlanAdmin, Participant], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/drip/enrollments/{id}/activate", description: "PENDING -> ACTIVE; assesses enrollment fee", roles: [PlanAdmin], code: 200, input: [], output: Enrollment, side_effects: ["creates ENROLLMENT FeeAssessment", "increments Enrollment.version by 1"] }
  - { method: PATCH, path: "/drip/enrollments/{id}/election", description: "Change participation election (OCC-guarded, owner only)", roles: [Participant], code: 200, input: [expected_enrollment_version, election, "reinvest_pct?"], output: Enrollment, side_effects: ["increments Enrollment.version by 1"] }
  - { method: POST, path: "/drip/enrollments/{id}/terminate", description: "Terminate enrollment; sells fractional shares, withdraws whole shares, relieves all tax lots", roles: [PlanAdmin, Participant], code: 200, input: [sale_price_cents], output: Enrollment, side_effects: ["termination_settlement cascade (ledger entries, lot relief, SALE fee when fractional part > 0)", "increments Enrollment.version by 1"] }
  - { method: POST, path: "/drip/enrollments/{enrollment_id}/deposits", description: "Record an initial share deposit into the plan (creates INITIAL ledger entry + INITIAL TaxLot)", roles: [PlanAdmin], code: 201, input: [quantity, cost_per_share_cents], output: ShareLedgerEntry, side_effects: ["creates INITIAL TaxLot", "recomputes enrollment share_balance and total_cost_basis_cents", "increments Enrollment.version by 1"] }
  - { method: GET, path: "/drip/enrollments/{id}/ledger-entries", description: "Share/cash movement log of an enrollment", roles: [PlanAdmin, Participant], code: 200, input: ["entry_type?"], output: "ShareLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/drip/enrollments/{id}/tax-lots", description: "Tax lots of an enrollment", roles: [PlanAdmin, Participant], code: 200, input: [], output: "TaxLot[]", side_effects: [] }
  - { method: GET, path: "/drip/enrollments/{id}/fees", description: "Fee assessments of an enrollment", roles: [PlanAdmin, Participant], code: 200, input: ["fee_type?"], output: "FeeAssessment[]", side_effects: [] }
  - { method: GET, path: "/drip/enrollments/{id}/transfers", description: "Transfer instructions sourced from an enrollment", roles: [PlanAdmin, Participant], code: 200, input: ["status?"], output: "TransferInstruction[]", side_effects: [] }
  - { method: GET, path: "/drip/enrollments/{enrollment_id}/tax-report", description: "Computed per-year tax report: dividends declared, disposition proceeds/basis/gain under the plan's basis method", roles: [PlanAdmin, Participant], code: 200, input: [year], output: "{ year: integer, dividends_cents: integer, proceeds_cents: integer, basis_cents: integer, gain_cents: integer, basis_method: string }", side_effects: [] }
  - { method: POST, path: "/drip/fee-assessments/{id}/waive", description: "Administratively waive a fee assessment (sets waived, zeroes charged_cents)", roles: [PlanAdmin], code: 200, input: [reason], output: FeeAssessment, side_effects: ["sets waived = true, waived_reason = reason, charged_cents = 0", "increments FeeAssessment.version by 1"] }
  - { method: POST, path: "/drip/plans/{plan_id}/dividend-events", description: "Declare a dividend (starts DECLARED)", roles: [PlanAdmin], code: 201, input: [amount_per_share_cents, record_date, payable_date], output: DividendEvent, side_effects: [] }
  - { method: GET, path: "/drip/plans/{id}/dividend-events", description: "List dividends of a plan", roles: [PlanAdmin, Participant], code: 200, input: ["status?"], output: "DividendEvent[]", side_effects: [] }
  - { method: POST, path: "/drip/dividend-events/{id}/price", description: "Supply both reference prices; system selects per plan.pricing_basis and sets reinvestment_price_cents (DECLARED -> PRICED)", roles: [PlanAdmin], code: 200, input: [closing_price_cents, avg5_price_cents], output: DividendEvent, side_effects: ["reinvestment_allocation pricing step", "increments DividendEvent.version by 1"] }
  - { method: POST, path: "/drip/dividend-events/{id}/execute", description: "Run reinvestment for eligible ACTIVE enrollments (PRICED -> REINVESTED)", roles: [PlanAdmin], code: 200, input: [], output: DividendEvent, side_effects: ["dividend_cash_split + reinvestment_allocation per eligible enrollment", "creates REINVEST/CASH_PAYOUT ledger entries and REINVEST TaxLots", "increments DividendEvent.version by 1"] }
  - { method: POST, path: "/drip/dividend-events/{id}/settle", description: "REINVESTED -> SETTLED", roles: [PlanAdmin], code: 200, input: [], output: DividendEvent, side_effects: ["increments DividendEvent.version by 1"] }
  - { method: POST, path: "/drip/plans/{plan_id}/purchase-windows", description: "Create an optional cash purchase window (SCHEDULED); validates schedule sanity, dividend blackout, and window overlap", roles: [PlanAdmin], code: 201, input: [opens_at, closes_at, price_cents], output: PurchaseWindow, side_effects: [] }
  - { method: GET, path: "/drip/plans/{id}/purchase-windows", description: "List windows of a plan", roles: [PlanAdmin, Participant], code: 200, input: ["status?"], output: "PurchaseWindow[]", side_effects: [] }
  - { method: GET, path: "/drip/purchase-windows/{id}", description: "Get one window", roles: [PlanAdmin, Participant], code: 200, input: [], output: PurchaseWindow, side_effects: [] }
  - { method: POST, path: "/drip/purchase-windows/{id}/open", description: "SCHEDULED -> OPEN (requires opens_at <= clock < closes_at)", roles: [PlanAdmin], code: 200, input: [], output: PurchaseWindow, side_effects: ["increments PurchaseWindow.version by 1"] }
  - { method: POST, path: "/drip/purchase-windows/{id}/close", description: "OPEN -> CLOSED (requires clock >= closes_at)", roles: [PlanAdmin], code: 200, input: [], output: PurchaseWindow, side_effects: ["increments PurchaseWindow.version by 1"] }
  - { method: POST, path: "/drip/purchase-windows/{id}/settle", description: "CLOSED -> SETTLED; fees, settles all SUBMITTED orders, creates OCP ledger entries and tax lots", roles: [PlanAdmin], code: 200, input: [], output: PurchaseWindow, side_effects: ["ocp_fee_assessment per SUBMITTED order", "orders -> SETTLED with settled_shares", "creates OCP_PURCHASE entries and OCP TaxLots", "increments PurchaseWindow.version by 1"] }
  - { method: POST, path: "/drip/purchase-windows/{window_id}/purchase-orders", description: "Submit an optional cash purchase order (owner only; window OPEN; enrollment ACTIVE; min + cumulative limit)", roles: [Participant], code: 201, input: [enrollment_id, amount_cents], output: PurchaseOrder, side_effects: ["adds amount_cents to window.submitted_total_cents"] }
  - { method: GET, path: "/drip/purchase-windows/{id}/purchase-orders", description: "List orders of a window", roles: [PlanAdmin], code: 200, input: ["status?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: GET, path: "/drip/purchase-orders/{id}", description: "Get one order (owner or admin)", roles: [PlanAdmin, Participant], code: 200, input: [], output: PurchaseOrder, side_effects: [] }
  - { method: GET, path: "/drip/purchase-orders", description: "List orders filtered by enrollment/window/status", roles: [PlanAdmin, Participant], code: 200, input: ["enrollment_id?", "window_id?", "status?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: POST, path: "/drip/purchase-orders/{id}/cancel", description: "SUBMITTED -> CANCELLED (owner only; window still OPEN)", roles: [Participant], code: 200, input: [], output: PurchaseOrder, side_effects: ["removes amount_cents from window.submitted_total_cents", "increments PurchaseOrder.version by 1"] }
  - { method: POST, path: "/drip/plans/{plan_id}/notices", description: "Create a plan communication notice (DRAFT)", roles: [PlanAdmin], code: 201, input: [notice_type, effective_at, message], output: PlanNotice, side_effects: [] }
  - { method: GET, path: "/drip/plans/{id}/notices", description: "List notices of a plan", roles: [PlanAdmin, Participant], code: 200, input: ["notice_type?", "status?"], output: "PlanNotice[]", side_effects: [] }
  - { method: POST, path: "/drip/notices/{id}/publish", description: "DRAFT -> PUBLISHED (requires >= 10 days lead time)", roles: [PlanAdmin], code: 200, input: [], output: PlanNotice, side_effects: ["sets published_at", "increments PlanNotice.version by 1"] }
  - { method: POST, path: "/drip/notices/{id}/take-effect", description: "PUBLISHED -> EFFECTIVE at/after effective_at; SUSPENSION/TERMINATION notices drive the plan transition", roles: [PlanAdmin], code: 200, input: [], output: PlanNotice, side_effects: ["SUSPENSION notice triggers Plan suspend cascade; TERMINATION notice triggers Plan terminate cascade", "increments PlanNotice.version by 1"] }
  - { method: POST, path: "/drip/enrollments/{enrollment_id}/transfers", description: "Create a transfer or gift instruction (owner only; source ACTIVE)", roles: [Participant], code: 201, input: [transfer_type, quantity, "recipient_enrollment_id?", "recipient_name?", "recipient_address?"], output: TransferInstruction, side_effects: [] }
  - { method: GET, path: "/drip/transfer-instructions/{id}", description: "Get one transfer instruction (source owner or admin)", roles: [PlanAdmin, Participant], code: 200, input: [], output: TransferInstruction, side_effects: [] }
  - { method: GET, path: "/drip/transfer-instructions", description: "List transfer instructions filtered by recipient/source/status", roles: [PlanAdmin], code: 200, input: ["recipient_enrollment_id?", "source_enrollment_id?", "status?"], output: "TransferInstruction[]", side_effects: [] }
  - { method: POST, path: "/drip/transfer-instructions/{id}/execute", description: "Execute instruction: moves shares, relieves lots per basis method, assesses transfer fee", roles: [PlanAdmin], code: 200, input: [fmv_per_share_cents], output: TransferInstruction, side_effects: ["TRANSFER_OUT entry on source (+ TRANSFER_IN entry and carryover TaxLot on recipient for TRANSFER)", "disposition_basis_relief on source lots", "creates TRANSFER FeeAssessment", "increments TransferInstruction.version by 1"] }
  - { method: POST, path: "/drip/transfer-instructions/{id}/cancel", description: "SUBMITTED -> CANCELLED (source owner only)", roles: [Participant], code: 200, input: [], output: TransferInstruction, side_effects: ["increments TransferInstruction.version by 1"] }
  - { method: POST, path: "/drip/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [PlanAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or Participant touches a resource owned by another participant" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-templated resource id does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum member, non-positive quantity/amount" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Trigger not valid from the entity's current state (includes terminal lockdown and repeated transitions)" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires the plan to be ACTIVE (enroll, activate, dividend declare/execute, window create/open, order submit, transfer create/execute)" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Order submit/cancel requires window status OPEN" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Operation requires enrollment status ACTIVE (deposit, election change, order, transfer create)" }
  - { id: ERR_WINDOW_SCHEDULE_INVALID, http: 422, condition: "opens_at >= closes_at, or opens_at is before the logical clock" }
  - { id: ERR_WINDOW_DIVIDEND_BLACKOUT, http: 422, condition: "Window intersects the closed blackout interval [record_date - 2 days, payable_date] of a non-SETTLED dividend of the same plan" }
  - { id: ERR_NOTICE_LEAD_TIME_SHORT, http: 422, condition: "Notice publish requested with effective_at less than 10 days after the logical clock" }
  - { id: ERR_WINDOW_OPEN_TOO_EARLY, http: 422, condition: "Window open requested before opens_at or at/after closes_at" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "Window's half-open interval [opens_at, closes_at) intersects another non-SETTLED window of the same plan" }
  - { id: ERR_ALREADY_ENROLLED, http: 409, condition: "Participant already has a non-terminal enrollment in this plan" }
  - { id: ERR_INVALID_ELECTION, http: 422, condition: "reinvest_pct missing/out of (0,1) for PARTIAL_REINVEST, or present for another election" }
  - { id: ERR_PURCHASE_BELOW_MIN, http: 422, condition: "Order amount below plan.ocp_min_cents" }
  - { id: ERR_PURCHASE_LIMIT_EXCEEDED, http: 422, condition: "Cumulative SUBMITTED orders for (window, enrollment) plus new amount would strictly exceed plan.ocp_max_cents" }
  - { id: ERR_INSUFFICIENT_SHARES, http: 422, condition: "Transfer quantity exceeds source enrollment share_balance at create or re-check at execute" }
  - { id: ERR_RECIPIENT_NOT_ENROLLED, http: 422, condition: "TRANSFER recipient enrollment missing, in another plan, or not ACTIVE" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version does not match the plan's current version (OCC)" }
  - { id: ERR_STALE_ENROLLMENT_VERSION, http: 412, condition: "expected_enrollment_version does not match the enrollment's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Issuer DRIP administrator operator; manages plans, dividends, windows, notices, fees, deposits, and executes transfers"
    identity: opaque
    exclusive_operations:
      - "POST /drip/plans, PATCH /drip/plans/{id}, publish/suspend/resume/terminate"
      - "POST /drip/participants"
      - "POST /drip/enrollments/{id}/activate, POST /drip/enrollments/{enrollment_id}/deposits"
      - "dividend declare/price/execute/settle"
      - "purchase-window create/open/close/settle"
      - "notice create/publish/take-effect"
      - "POST /drip/fee-assessments/{id}/waive"
      - "POST /drip/transfer-instructions/{id}/execute"
      - "POST /drip/_clock/set_current_utc"
    shared_operations:
      - "GET reads of plans, enrollments, orders, dividends, windows, notices, ledger entries, tax lots, fees, transfers, tax reports"
      - "POST /drip/enrollments/{id}/terminate"
  - name: Participant
    description: "Investor holding plan enrollments; acts only on own resources (X-User-ID == Participant.id)"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /drip/plans/{plan_id}/enrollments (self-enroll)"
      - "PATCH /drip/enrollments/{id}/election (own enrollment)"
      - "POST /drip/purchase-windows/{window_id}/purchase-orders, POST /drip/purchase-orders/{id}/cancel (own orders)"
      - "POST /drip/enrollments/{enrollment_id}/transfers, POST /drip/transfer-instructions/{id}/cancel (own instructions)"
    shared_operations:
      - "GET reads of plans, own enrollments, own orders, dividends, windows, notices, own ledger entries, own tax lots, own fees, own transfers, own tax reports"
      - "POST /drip/enrollments/{id}/terminate (own enrollment)"
