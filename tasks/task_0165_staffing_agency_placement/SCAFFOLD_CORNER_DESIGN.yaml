  # ---------------------------------------------------------------------------
  # excluded_because stubs — corners already exercised by §1.8 instances.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_credit_limit_exceeded_on_placement
        claim_type: Violation → Error
        grounds: ["errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_placement
          rationale: "ERR_CREDIT_LIMIT_EXCEEDED is the fiscal failure path probed (and its boundary asserted) by the credit_limit_equality_allowed and state_beats_fiscal_on_placement §1.8 instances."

      - name: error_timesheet_week_overlap
        claim_type: Violation → Error
        grounds: ["errors[ERR_TIMESHEET_WEEK_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / timesheet_week_overlap_halfopen_adjacency_ok
          rationale: "ERR_TIMESHEET_WEEK_OVERLAP is asserted as the rejection path of the half-open overlap §1.8 instance."

      - name: error_skill_mismatch_on_submission
        claim_type: Violation → Error
        grounds: ["errors[ERR_SKILL_MISMATCH]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / skill_referential_beats_temporal_on_submission_vs_placement
          rationale: "ERR_SKILL_MISMATCH is the lower-priority referential failure paired against ERR_VALIDATION in the named §1.8 priority-conflict instance."

      - name: error_stale_job_order_version
        claim_type: Violation → Error
        grounds: ["errors[ERR_STALE_JOB_ORDER_VERSION]"]
        excluded_because:
          difficulty_instance: transitive_cascade / place_fills_order_rejects_siblings
          rationale: "OCC version freshness is exercised in §1.8 (place uses a re-read jo_v2); the stale-version rejection is additionally probed by §1.9 occ_version_increments_on_placement_create."
