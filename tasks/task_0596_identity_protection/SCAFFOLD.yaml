scenario: "Identity Theft Protection & Credit Monitoring (LifeLock/Aura style): plan tier & enrollment, tri-bureau monitoring & score, dark-web/SSN/account alert, identity-restoration case & specialist, identity-theft insurance reimbursement, lost-wallet & freeze assist, family/child monitoring, alert escalation & resolution"
domain_name: "identity-theft-protection"
api_prefix: "/idp"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: Expert
  notes: |
    Graph topology: Alert -> RestorationCase -> InsuranceClaim and
    RestorationCase -> Specialist -> SpecialistEngagement -> RestorationCase form
    cross-aggregate reference cycles. Subscriber carries two independent state
    dimensions (enrollment_status x monitoring_status); BureauProfile's freeze
    lifecycle is a true cycle; RestorationCase loops IN_PROGRESS <-> PENDING_SUBSCRIBER.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Product tier of the protection plan"
        constraints: "one of STANDARD | ADVANTAGE | ULTIMATE"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring subscription fee in cents"
        constraints: ">= 0"
      - name: insurance_limit_cents
        type: integer
        source: input
        description: "Lifetime identity-theft insurance reimbursement ceiling in cents"
        constraints: "> 0"
      - name: max_family_members
        type: integer
        source: input
        description: "Maximum number of FamilyMember rows allowed under one Subscriber"
        constraints: ">= 0"
      - name: child_monitoring_included
        type: boolean
        source: input
        description: "Whether CHILD relationship family members are monitored under this plan"
        default: false
      - name: bureau_scope
        type: enum
        source: input
        description: "SINGLE creates only an EQUIFAX BureauProfile at verification; TRI creates EQUIFAX, EXPERIAN and TRANSUNION"
        constraints: "one of SINGLE | TRI"
      - name: min_specialist_tier
        type: enum
        source: input
        description: "Floor applied to RestorationCase.required_specialist_tier for cases opened by this plan's subscribers"
        default: TIER1
        constraints: "one of TIER1 | TIER2 | TIER3"

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Account email, unique across subscribers"
      - name: full_name
        type: string
        source: input
        description: "Legal name of the account holder"
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD"
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of the subscriber SSN"
        constraints: "exactly 4 decimal digits"
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan this subscriber enrolled under"
      - name: enrollment_status
        type: enum
        source: system
        description: "Enrollment dimension of the Subscriber state machine"
        default: PENDING_VERIFICATION
        constraints: "one of PENDING_VERIFICATION | ACTIVE | SUSPENDED"
      - name: monitoring_status
        type: enum
        source: system
        description: "Monitoring dimension of the Subscriber state machine; evolves independently of enrollment_status"
        default: NOT_ENROLLED
        constraints: "one of NOT_ENROLLED | PENDING_DATA | MONITORED | PAUSED"
      - name: verification_token
        type: string
        source: system
        description: "Server-issued token returned on enrollment; consumed by POST /idp/subscribers/{id}/verify"
      - name: composite_credit_score
        type: integer
        source: computed
        description: "Tri-bureau weighted composite score; null until at least one BureauProfile has a credit_score (see calculations.composite_credit_score)"
      - name: baseline_composite_credit_score
        type: integer
        source: computed
        description: "Value of composite_credit_score the first time it became non-null; never updated afterwards; used by the score-drop term of identity_risk_score"
      - name: risk_score
        type: integer
        source: computed
        description: "LIVE variant of calculations.identity_risk_score, range 0..100"
      - name: underwriting_risk_score
        type: integer
        source: computed
        description: "UNDERWRITING variant of calculations.identity_risk_score, range 0..100; gates insurance-claim submission"
      - name: insurance_remaining_cents
        type: integer
        source: computed
        description: "Plan.insurance_limit_cents minus the sum of approved_cents over this subscriber's PAID claims (see calculations.insurance_remaining). Stays 0 until verify provisions the plan limit."
        default: 0
      - name: insurance_status
        type: enum
        source: computed
        description: "AVAILABLE while insurance_remaining_cents > 0; EXHAUSTED once it reaches 0"
        default: AVAILABLE
        constraints: "one of AVAILABLE | EXHAUSTED"
      - name: suspension_reason
        type: string
        source: system
        description: "Reason recorded by the last suspend call; null when never suspended"

  - name: FamilyMember
    parent: Subscriber
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; taken from the path, not the body"
      - name: full_name
        type: string
        source: input
        description: "Legal name of the family member"
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD"
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of the family member SSN"
        constraints: "exactly 4 decimal digits"
      - name: relationship
        type: enum
        source: input
        description: "Whether this dependent is an adult or a child"
        constraints: "one of ADULT | CHILD"
      - name: monitoring_status
        type: enum
        source: computed
        description: "MONITORED for ADULT always, and for CHILD only when the subscriber's Plan.child_monitoring_included is true; otherwise NOT_COVERED"
        constraints: "one of MONITORED | NOT_COVERED"

  - name: BureauProfile
    parent: Subscriber
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; profiles are created by the verify cascade, never directly"
      - name: bureau
        type: enum
        source: system
        description: "Credit bureau this profile tracks"
        constraints: "one of EQUIFAX | EXPERIAN | TRANSUNION"
      - name: credit_score
        type: integer
        source: system
        description: "Latest score pulled from this bureau; null until the first score-refresh"
        constraints: "300..850 when non-null"
      - name: score_pulled_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the last score-refresh; null until the first refresh"
      - name: freeze_status
        type: enum
        source: system
        description: "Freeze lifecycle of this bureau file"
        default: UNFROZEN
        constraints: "one of UNFROZEN | FREEZE_PENDING | FROZEN | THAW_PENDING"

  - name: ThawWindow
    parent: BureauProfile
    common_fields: true
    fields:
      - name: bureau_profile_id
        type: string
        source: system
        description: "FK -> BureauProfile.id; taken from the path"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the temporary thaw interval (ISO 8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the temporary thaw interval (ISO 8601 UTC)"
      - name: purpose
        type: string
        source: input
        description: "Why the subscriber needs the file briefly thawed (e.g. MORTGAGE_APPLICATION)"
      - name: is_currently_open
        type: boolean
        source: computed
        description: "True when window_start <= logical clock <= window_end (both endpoints inclusive)"

  - name: Alert
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; the protected account this alert belongs to"
      - name: family_member_id
        type: string
        source: input
        description: "FK -> FamilyMember.id; null when the alert concerns the subscriber themself"
      - name: alert_type
        type: enum
        source: input
        description: "Monitoring signal class"
        constraints: "one of DARK_WEB | SSN_TRACE | ACCOUNT_TAKEOVER | CREDIT_INQUIRY"
      - name: severity
        type: enum
        source: input
        description: "Severity assigned by the monitoring feed"
        constraints: "one of LOW | MEDIUM | HIGH | CRITICAL"
      - name: source_detail
        type: string
        source: input
        description: "Free-text provenance of the signal (breach name, creditor name, wallet-item reference)"
      - name: status
        type: enum
        source: system
        description: "Alert triage lifecycle"
        default: NEW
        constraints: "one of NEW | ACKNOWLEDGED | CONFIRMED_FRAUD | DISMISSED | ESCALATED | RESOLVED"
      - name: escalation_tier
        type: enum
        source: computed
        description: "Tier picked by calculations.alert_escalation_tier at escalation time; null before escalation"
        constraints: "one of TIER1 | TIER2 | TIER3"
      - name: escalation_deadline
        type: datetime
        source: computed
        description: "Logical clock at escalation plus SLA_HOURS[escalation_tier]; null before escalation"
      - name: dismissal_reason
        type: string
        source: system
        description: "Reason supplied to the dismiss endpoint; null otherwise"

  - name: Specialist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Restoration specialist name"
      - name: tier
        type: enum
        source: input
        description: "Competency tier; TIER1 < TIER2 < TIER3 by tier_rank 1/2/3"
        constraints: "one of TIER1 | TIER2 | TIER3"
      - name: max_caseload
        type: integer
        source: input
        description: "Number of non-terminal cases this specialist may hold at once"
        constraints: ">= 1"
      - name: max_concurrent_engagements
        type: integer
        source: input
        description: "Number of SpecialistEngagement intervals (buffer-extended) that may overlap at any instant"
        default: 1
        constraints: ">= 1"
      - name: active_case_count
        type: integer
        source: computed
        description: "Count of RestorationCase rows with specialist_id = this id and status in {ASSIGNED, IN_PROGRESS, PENDING_SUBSCRIBER}"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "AT_CAPACITY when active_case_count >= max_caseload, otherwise AVAILABLE"
        default: AVAILABLE
        constraints: "one of AVAILABLE | AT_CAPACITY"

  - name: RestorationCase
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; copied from the originating Alert"
      - name: origin_alert_id
        type: string
        source: system
        description: "FK -> Alert.id; the alert whose confirm-fraud transition created this case"
      - name: specialist_id
        type: string
        source: system
        description: "FK -> Specialist.id; null while status is OPEN"
      - name: status
        type: enum
        source: system
        description: "Restoration case lifecycle"
        default: OPEN
        constraints: "one of OPEN | ASSIGNED | IN_PROGRESS | PENDING_SUBSCRIBER | RESOLVED"
      - name: required_specialist_tier
        type: enum
        source: computed
        description: "Minimum specialist tier that may take this case (see calculations.required_specialist_tier); recomputed by alert escalation"
        constraints: "one of TIER1 | TIER2 | TIER3"
      - name: info_request
        type: string
        source: system
        description: "Text of the last specialist information request; null otherwise"
      - name: info_response
        type: string
        source: system
        description: "Text of the last subscriber response; null otherwise"
      - name: resolution_summary
        type: string
        source: system
        description: "Summary supplied at resolve; null before RESOLVED"

  - name: SpecialistEngagement
    parent: Specialist
    common_fields: true
    fields:
      - name: specialist_id
        type: string
        source: input
        description: "FK -> Specialist.id; the specialist whose calendar this engagement occupies"
      - name: case_id
        type: string
        source: input
        description: "FK -> RestorationCase.id; the case being worked in this window"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the engagement interval (ISO 8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the engagement interval (ISO 8601 UTC)"

  - name: InsuranceClaim
    parent: RestorationCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RestorationCase.id; the restoration case this claim reimburses"
      - name: subscriber_id
        type: string
        source: computed
        description: "FK -> Subscriber.id; copied from RestorationCase.subscriber_id at creation"
      - name: expenses
        type: array
        source: input
        description: "Line items, each an object { category, amount_cents, documented }; category one of LEGAL_FEES | LOST_WAGES | TRAVEL | CHILDCARE | NOTARY | POSTAGE"
        constraints: "at least 1 element; amount_cents > 0; documented is boolean"
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculations.claim_reimbursement, written at submit; null while DRAFT"
      - name: approved_cents
        type: integer
        source: computed
        description: "FINAL variant of calculations.claim_reimbursement, written at approve; null before APPROVED"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle"
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | APPROVED | DENIED | PAID | REVERSED | SUPERSEDED"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsAdjuster who approved; null before APPROVED; used by the segregation-of-duties check on pay"
      - name: denial_reason
        type: string
        source: system
        description: "Reason supplied at deny; null otherwise"
      - name: reversal_reason
        type: string
        source: system
        description: "Reason supplied at reverse; null otherwise"

  - name: WalletItem
    parent: Subscriber
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; taken from the path"
      - name: item_type
        type: enum
        source: input
        description: "Kind of document or card stored in the protected wallet"
        constraints: "one of CREDIT_CARD | DEBIT_CARD | DRIVERS_LICENSE | PASSPORT | SSN_CARD | INSURANCE_CARD"
      - name: issuer
        type: string
        source: input
        description: "Issuing institution or authority"
      - name: last4
        type: string
        source: input
        description: "Last four characters of the card/document number"
      - name: status
        type: enum
        source: system
        description: "Wallet item lifecycle"
        default: ACTIVE
        constraints: "one of ACTIVE | REPORTED_LOST"
      - name: reported_lost_at
        type: datetime
        source: system
        description: "Logical clock at which report-lost fired; null while ACTIVE"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscriber
    field: enrollment_status
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    note: "Dimension 1 of 2 on Subscriber. Evolves on verify/suspend/reactivate only."
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /idp/subscribers/{id}/verify"
        actor: Subscriber
        preconditions:
          - "verification_token in the body equals Subscriber.verification_token"
        side_effects:
          - "Creates BureauProfile rows in this order: EQUIFAX, EXPERIAN, TRANSUNION when Plan.bureau_scope == TRI; only EQUIFAX when Plan.bureau_scope == SINGLE. Each starts credit_score = null, freeze_status = UNFROZEN."
          - "Sets Subscriber.monitoring_status := PENDING_DATA (dimension 2)."
          - "Sets Subscriber.insurance_remaining_cents := Plan.insurance_limit_cents and insurance_status := AVAILABLE."
          - "Runs calculations.identity_risk_score (both variants): risk_score := 10, underwriting_risk_score := 10."
          - "increments Subscriber.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /idp/subscribers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "Sets Subscriber.suspension_reason := body.reason."
          - "If Subscriber.monitoring_status in {PENDING_DATA, MONITORED} it becomes PAUSED (dimension 2)."
          - "increments Subscriber.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /idp/subscribers/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.enrollment_status == SUSPENDED"
        side_effects:
          - "Sets Subscriber.suspension_reason := null."
          - "Restores dimension 2: monitoring_status := MONITORED when composite_credit_score is non-null, else PENDING_DATA."
          - "increments Subscriber.version by 1"

  - entity: Subscriber
    field: monitoring_status
    initial_state: NOT_ENROLLED
    terminal_states: []
    note: "Dimension 2 of 2 on Subscriber. Advances on score-refresh independently of enrollment_status; PENDING_DATA -> MONITORED never touches enrollment_status."
    transitions:
      - from: NOT_ENROLLED
        to: PENDING_DATA
        trigger: "POST /idp/subscribers/{id}/verify (same request that moves dimension 1 to ACTIVE)"
        actor: Subscriber
        preconditions:
          - "Subscriber.monitoring_status == NOT_ENROLLED"
        side_effects:
          - "See the verify transition on dimension 1."
      - from: PENDING_DATA
        to: MONITORED
        trigger: "POST /idp/bureau-profiles/{id}/score-refresh (first refresh that makes composite_credit_score non-null)"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.enrollment_status == ACTIVE"
          - "calculations.composite_credit_score over the subscriber's BureauProfiles yields a non-null value"
        side_effects:
          - "Sets Subscriber.composite_credit_score."
          - "Sets Subscriber.baseline_composite_credit_score := composite_credit_score (only on this first non-null transition; never rewritten)."
          - "Recomputes Subscriber.risk_score and underwriting_risk_score."
          - "increments Subscriber.version by 1"
      - from: MONITORED
        to: MONITORED
        trigger: "POST /idp/bureau-profiles/{id}/score-refresh (subsequent refreshes)"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "Recomputes Subscriber.composite_credit_score (baseline_composite_credit_score is NOT rewritten)."
          - "Recomputes Subscriber.risk_score and underwriting_risk_score; the score-drop term fires when baseline_composite_credit_score - composite_credit_score >= 40."
          - "increments Subscriber.version by 1"
      - from: MONITORED
        to: PAUSED
        trigger: "POST /idp/subscribers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "See the suspend transition on dimension 1."
      - from: PENDING_DATA
        to: PAUSED
        trigger: "POST /idp/subscribers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "See the suspend transition on dimension 1."
      - from: PAUSED
        to: MONITORED
        trigger: "POST /idp/subscribers/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.composite_credit_score is non-null"
        side_effects:
          - "See the reactivate transition on dimension 1."
      - from: PAUSED
        to: PENDING_DATA
        trigger: "POST /idp/subscribers/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "Subscriber.composite_credit_score is null"
        side_effects:
          - "See the reactivate transition on dimension 1."

  - entity: BureauProfile
    field: freeze_status
    initial_state: UNFROZEN
    terminal_states: []
    note: "Cyclic: UNFROZEN -> FREEZE_PENDING -> FROZEN -> THAW_PENDING -> UNFROZEN -> ... The same confirm endpoint completes whichever direction is pending."
    transitions:
      - from: UNFROZEN
        to: FREEZE_PENDING
        trigger: "POST /idp/bureau-profiles/{id}/freeze-request with action = FREEZE"
        actor: Subscriber
        preconditions:
          - "Subscriber.enrollment_status == ACTIVE"
          - "BureauProfile.freeze_status == UNFROZEN"
        side_effects:
          - "increments BureauProfile.version by 1"
      - from: FREEZE_PENDING
        to: FROZEN
        trigger: "POST /idp/bureau-profiles/{id}/confirm (bureau callback)"
        actor: PlatformAdmin
        preconditions:
          - "BureauProfile.freeze_status == FREEZE_PENDING"
        side_effects:
          - "increments BureauProfile.version by 1"
      - from: FROZEN
        to: THAW_PENDING
        trigger: "POST /idp/bureau-profiles/{id}/freeze-request with action = THAW"
        actor: Subscriber
        preconditions:
          - "Subscriber.enrollment_status == ACTIVE"
          - "BureauProfile.freeze_status == FROZEN"
        side_effects:
          - "increments BureauProfile.version by 1"
      - from: THAW_PENDING
        to: UNFROZEN
        trigger: "POST /idp/bureau-profiles/{id}/confirm (bureau callback)"
        actor: PlatformAdmin
        preconditions:
          - "BureauProfile.freeze_status == THAW_PENDING"
        side_effects:
          - "All ThawWindow rows of this profile remain, but is_currently_open is irrelevant once the file is UNFROZEN."
          - "increments BureauProfile.version by 1"

  - entity: Alert
    field: status
    initial_state: NEW
    terminal_states: [DISMISSED, RESOLVED]
    note: "Branching: ACKNOWLEDGED forks into CONFIRMED_FRAUD (opens a case, raises risk) and DISMISSED (no case, no risk change) with disjoint side-effect sets."
    transitions:
      - from: NEW
        to: ACKNOWLEDGED
        trigger: "POST /idp/alerts/{id}/acknowledge"
        actor: Subscriber
        preconditions:
          - "Alert.status == NEW"
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "Recomputes Subscriber.risk_score and underwriting_risk_score (DARK_WEB alerts begin counting in the LIVE variant at ACKNOWLEDGED)."
          - "increments Alert.version by 1; increments Subscriber.version by 1"
      - from: ACKNOWLEDGED
        to: CONFIRMED_FRAUD
        trigger: "POST /idp/alerts/{id}/confirm-fraud"
        actor: Subscriber
        preconditions:
          - "Alert.status == ACKNOWLEDGED"
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "Creates a RestorationCase with status OPEN, subscriber_id = Alert.subscriber_id, origin_alert_id = Alert.id, specialist_id = null, required_specialist_tier = calculations.required_specialist_tier(Alert.severity, Plan.min_specialist_tier)."
          - "Recomputes Subscriber.risk_score and underwriting_risk_score."
          - "increments Alert.version by 1; increments Subscriber.version by 1"
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /idp/alerts/{id}/dismiss"
        actor: Subscriber
        preconditions:
          - "Alert.status == ACKNOWLEDGED"
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "Sets Alert.dismissal_reason := body.dismissal_reason. NO RestorationCase is created."
          - "Recomputes Subscriber.risk_score and underwriting_risk_score (a DISMISSED alert contributes nothing in either variant)."
          - "increments Alert.version by 1; increments Subscriber.version by 1"
      - from: CONFIRMED_FRAUD
        to: ESCALATED
        trigger: "POST /idp/alerts/{id}/escalate"
        actor: PlatformAdmin
        preconditions:
          - "Alert.status == CONFIRMED_FRAUD"
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "Runs calculations.alert_escalation_tier in its pinned order: snapshot the persisted Subscriber.risk_score BEFORE this transition, derive escalation_tier from that snapshot, then persist the new status."
          - "Sets Alert.escalation_deadline := logical clock + SLA_HOURS[escalation_tier]."
          - "Sets RestorationCase.required_specialist_tier := max(escalation_tier, existing required_specialist_tier) on the case whose origin_alert_id == Alert.id; increments that case's version by 1."
          - "Recomputes Subscriber.risk_score and underwriting_risk_score AFTER the status flip (the ESCALATED alert now adds ESCALATION_WEIGHT)."
          - "increments Alert.version by 1; increments Subscriber.version by 1"
      - from: CONFIRMED_FRAUD
        to: RESOLVED
        trigger: "system: the RestorationCase whose origin_alert_id == Alert.id reaches RESOLVED"
        actor: system
        preconditions:
          - "Alert.status == CONFIRMED_FRAUD"
        side_effects:
          - "Recomputes Subscriber.risk_score and underwriting_risk_score (a RESOLVED alert contributes nothing in either variant)."
          - "increments Alert.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "system: the RestorationCase whose origin_alert_id == Alert.id reaches RESOLVED"
        actor: system
        preconditions:
          - "Alert.status == ESCALATED"
        side_effects:
          - "Recomputes Subscriber.risk_score and underwriting_risk_score (the ESCALATION_WEIGHT term drops out)."
          - "increments Alert.version by 1"

  - entity: RestorationCase
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    note: "Cyclic: IN_PROGRESS <-> PENDING_SUBSCRIBER may repeat any number of times before RESOLVED."
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /idp/restoration-cases/{id}/assign"
        actor: PlatformAdmin
        preconditions:
          - "RestorationCase.status == OPEN"
          - "Subscriber.enrollment_status == ACTIVE (cross-entity: the case's subscriber)"
          - "When specialist_id is supplied: Specialist tier_rank >= tier_rank(required_specialist_tier) AND Specialist.active_case_count < Specialist.max_caseload"
          - "When specialist_id is omitted: calculations.specialist_selection yields a non-empty candidate set"
        side_effects:
          - "Sets RestorationCase.specialist_id (supplied, or picked by calculations.specialist_selection)."
          - "CASCADE hop 2: the specialist_id now pointing at this non-terminal case makes calculations.specialist_active_case_count recompute Specialist.active_case_count = old + 1."
          - "CASCADE hop 3: the new active_case_count causes Specialist.status := AT_CAPACITY when active_case_count >= max_caseload (>= , not >), otherwise it stays AVAILABLE."
          - "CASCADE hop 4: a Specialist whose status became AT_CAPACITY is excluded from the eligibility filter of calculations.specialist_selection for every later auto-assign."
          - "increments RestorationCase.version by 1; increments Specialist.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /idp/specialist-engagements (creating the first engagement for this case)"
        actor: RestorationSpecialist
        preconditions:
          - "RestorationCase.status == ASSIGNED"
          - "SpecialistEngagement.specialist_id == RestorationCase.specialist_id"
        side_effects:
          - "increments RestorationCase.version by 1"
        note: "Creating an engagement against a case already in IN_PROGRESS or PENDING_SUBSCRIBER records the engagement but leaves the case status unchanged."
      - from: IN_PROGRESS
        to: PENDING_SUBSCRIBER
        trigger: "POST /idp/restoration-cases/{id}/request-info"
        actor: RestorationSpecialist
        preconditions:
          - "RestorationCase.status == IN_PROGRESS"
          - "acting Specialist.id == RestorationCase.specialist_id"
        side_effects:
          - "Sets RestorationCase.info_request := body.info_request."
          - "increments RestorationCase.version by 1"
      - from: PENDING_SUBSCRIBER
        to: IN_PROGRESS
        trigger: "POST /idp/restoration-cases/{id}/provide-info"
        actor: Subscriber
        preconditions:
          - "RestorationCase.status == PENDING_SUBSCRIBER"
          - "acting Subscriber.id == RestorationCase.subscriber_id"
        side_effects:
          - "Sets RestorationCase.info_response := body.info_response."
          - "increments RestorationCase.version by 1"
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /idp/restoration-cases/{id}/resolve"
        actor: RestorationSpecialist
        preconditions:
          - "RestorationCase.status == IN_PROGRESS"
          - "acting Specialist.id == RestorationCase.specialist_id"
        side_effects:
          - "Sets RestorationCase.resolution_summary := body.resolution_summary."
          - "COMPENSATION hop: the case leaving the {ASSIGNED, IN_PROGRESS, PENDING_SUBSCRIBER} set makes calculations.specialist_active_case_count recompute Specialist.active_case_count = old - 1, which in turn flips Specialist.status back to AVAILABLE when the new count < max_caseload."
          - "CROSS-ENTITY hop: the origin Alert transitions CONFIRMED_FRAUD -> RESOLVED or ESCALATED -> RESOLVED, which in turn recomputes Subscriber.risk_score and underwriting_risk_score."
          - "increments RestorationCase.version by 1; increments Specialist.version by 1; increments Alert.version by 1; increments Subscriber.version by 1"

  - entity: InsuranceClaim
    field: status
    initial_state: DRAFT
    terminal_states: [DENIED, REVERSED, SUPERSEDED]
    note: "Branching at SUBMITTED (APPROVED vs DENIED). SUPERSEDED is written by the create-with-supersede rule in §1.2.1."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /idp/insurance-claims/{id}/submit"
        actor: Subscriber
        preconditions:
          - "InsuranceClaim.status == DRAFT"
          - "RestorationCase.status == RESOLVED (cross-entity: the claim's case)"
          - "Subscriber.insurance_status == AVAILABLE"
          - "Subscriber.underwriting_risk_score <= 75"
        side_effects:
          - "Runs calculations.claim_reimbursement variant PROVISIONAL and writes InsuranceClaim.provisional_amount_cents."
          - "increments InsuranceClaim.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer InsuranceClaim is created on the same RestorationCase"
        actor: system
        preconditions:
          - "InsuranceClaim.status == DRAFT"
        side_effects:
          - "increments InsuranceClaim.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /idp/insurance-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
        side_effects:
          - "Runs calculations.claim_reimbursement variant FINAL and writes InsuranceClaim.approved_cents."
          - "Sets InsuranceClaim.approved_by_user_id := X-User-ID of the acting ClaimsAdjuster."
          - "increments InsuranceClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /idp/insurance-claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
        side_effects:
          - "Sets InsuranceClaim.denial_reason := body.denial_reason; approved_cents stays null."
          - "increments InsuranceClaim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /idp/insurance-claims/{id}/pay"
        actor: PlatformAdmin
        preconditions:
          - "InsuranceClaim.status == APPROVED"
          - "X-User-ID of the acting PlatformAdmin != InsuranceClaim.approved_by_user_id (segregation of duties)"
        side_effects:
          - "CASCADE hop 2: the claim entering status PAID puts approved_cents into the PAID sum, so calculations.insurance_remaining recomputes Subscriber.insurance_remaining_cents = Plan.insurance_limit_cents - sum(approved_cents over PAID claims)."
          - "CASCADE hop 3: the new insurance_remaining_cents reaching 0 sets Subscriber.insurance_status := EXHAUSTED."
          - "CASCADE hop 4: a Subscriber with insurance_status == EXHAUSTED can no longer submit any claim - POST /idp/insurance-claims/{id}/submit now fails with ERR_INSURANCE_EXHAUSTED."
          - "increments InsuranceClaim.version by 1; increments Subscriber.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /idp/insurance-claims/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "InsuranceClaim.status == PAID"
        side_effects:
          - "Sets InsuranceClaim.reversal_reason := body.reversal_reason."
          - "COMPENSATION: the claim leaves the PAID set, so calculations.insurance_remaining recomputes Subscriber.insurance_remaining_cents back to its pre-pay value, and insurance_status returns to AVAILABLE when the recomputed remaining is > 0."
          - "increments InsuranceClaim.version by 1; increments Subscriber.version by 1"

  - entity: WalletItem
    field: status
    initial_state: ACTIVE
    terminal_states: [REPORTED_LOST]
    transitions:
      - from: ACTIVE
        to: REPORTED_LOST
        trigger: "POST /idp/wallet-items/{id}/report-lost"
        actor: Subscriber
        preconditions:
          - "WalletItem.status == ACTIVE"
          - "Subscriber.enrollment_status == ACTIVE"
        side_effects:
          - "Sets WalletItem.reported_lost_at := logical clock."
          - "Creates an Alert on the owning subscriber with family_member_id = null, source_detail = 'LOST_WALLET_ITEM:' + WalletItem.id, status = NEW, and: alert_type = SSN_TRACE / severity = CRITICAL when item_type == SSN_CARD; alert_type = ACCOUNT_TAKEOVER / severity = HIGH when item_type in {CREDIT_CARD, DEBIT_CARD}; alert_type = DARK_WEB / severity = MEDIUM otherwise."
          - "Freeze assist: when item_type == SSN_CARD, every BureauProfile of this subscriber whose freeze_status == UNFROZEN moves to FREEZE_PENDING (each such profile's version increments by 1)."
          - "Recomputes Subscriber.risk_score and underwriting_risk_score."
          - "increments WalletItem.version by 1; increments Subscriber.version by 1"

  - entity: Specialist
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Compound/derived: status is a pure function of active_case_count vs max_caseload; there is no endpoint that sets it directly."
    transitions:
      - from: AVAILABLE
        to: AT_CAPACITY
        trigger: "system: calculations.specialist_active_case_count raises active_case_count to >= max_caseload (triggered by a case assign)"
        actor: system
        preconditions:
          - "active_case_count >= max_caseload after recomputation"
        side_effects:
          - "The specialist drops out of calculations.specialist_selection's eligibility filter."
          - "increments Specialist.version by 1"
      - from: AT_CAPACITY
        to: AVAILABLE
        trigger: "system: calculations.specialist_active_case_count lowers active_case_count below max_caseload (triggered by a case resolve)"
        actor: system
        preconditions:
          - "active_case_count < max_caseload after recomputation"
        side_effects:
          - "The specialist re-enters calculations.specialist_selection's eligibility filter."
          - "increments Specialist.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-case
    parent_entity: RestorationCase
    write_endpoint: "POST /idp/insurance-claims"
    occ_field: "expected_case_version"
    description: |
      Creating an InsuranceClaim against a RestorationCase whose version has
      advanced since the client last observed it is rejected with 412. A case
      carries at most one non-terminal claim: a newly created claim legitimately
      supersedes any DRAFT claim already on that case (moving it to SUPERSEDED),
      so a writer holding a stale view of the case must re-read before creating.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: engagement-create-stale-specialist
    parent_entity: Specialist
    write_endpoint: "POST /idp/specialist-engagements"
    occ_field: "expected_specialist_version"
    description: |
      Creating a SpecialistEngagement against a Specialist whose version has
      advanced since the client last observed it is rejected with 412. An
      engagement consumes a slot of the specialist's buffer-extended concurrent
      capacity, so a client whose view of the specialist (caseload, capacity,
      existing engagements) is stale must re-read before booking.
    error_id: ERR_STALE_SPECIALIST_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: composite_credit_score
    trigger: "On POST /idp/bureau-profiles/{id}/score-refresh, and re-evaluated on read by GET /idp/subscribers/{id}/credit-summary"
    algorithm: weighted_scoring
    formula: |
      scored = [bp for bp in BureauProfile
                where bp.subscriber_id == S.id and bp.credit_score is not null]
      if len(scored) == 0:
          composite_credit_score = null          # empty-set boundary: null, NOT 0
          monitoring_status stays PENDING_DATA
      else:
          w_sum    = sum(BUREAU_WEIGHT[bp.bureau] for bp in scored)      # renormalisation base
          weighted = sum(BUREAU_WEIGHT[bp.bureau] * bp.credit_score for bp in scored)
          composite_credit_score = round_half_up(weighted / w_sum)       # integer
      # baseline_composite_credit_score is written exactly once: on the first
      # evaluation that yields a non-null composite. It is never rewritten.
    input_set: "BureauProfile rows of the subscriber whose credit_score is non-null. Profiles with credit_score == null are EXCLUDED and their weight is excluded from w_sum (renormalisation), not treated as zero."
    constants:
      BUREAU_WEIGHT: { EQUIFAX: 0.35, EXPERIAN: 0.35, TRANSUNION: 0.30 }
    precision: "integer, round_half_up on the final quotient only"

  - name: identity_risk_score
    trigger: "After every Alert status transition (acknowledge, confirm-fraud, dismiss, escalate, system-resolve), after every score-refresh, after verify, and after wallet report-lost"
    algorithm: weighted_scoring
    formula: |
      # Shared skeleton; the two variants differ only in COUNTED_STATUSES and
      # in whether the family multiplier is applied.
      raw = BASE                                                  # 10
      for t in [SSN_TRACE, ACCOUNT_TAKEOVER, DARK_WEB, CREDIT_INQUIRY]:
          n = count(Alert where subscriber_id == S.id
                          and alert_type == t
                          and status in COUNTED_STATUSES[variant][t])
          raw += TYPE_WEIGHT[t] * n
      raw += ESCALATION_WEIGHT * count(Alert where subscriber_id == S.id
                                             and status == ESCALATED)
      if S.baseline_composite_credit_score is not null
         and S.composite_credit_score is not null
         and (S.baseline_composite_credit_score - S.composite_credit_score) >= 40:
          raw += SCORE_DROP_WEIGHT
      if variant == LIVE
         and exists FamilyMember F where F.subscriber_id == S.id
                                     and F.relationship == CHILD
                                     and F.monitoring_status == MONITORED
         and exists Alert A where A.family_member_id == F.id
                              and A.status in {CONFIRMED_FRAUD, ESCALATED}:
          raw = raw * FAMILY_CHILD_MULTIPLIER
      score = min(SCORE_CEILING, max(SCORE_FLOOR, round_half_up(raw)))
    input_set: "All Alert rows of the subscriber, filtered per variant by COUNTED_STATUSES; all FamilyMember rows of the subscriber for the LIVE multiplier."
    constants:
      BASE: 10
      TYPE_WEIGHT: { SSN_TRACE: 25, ACCOUNT_TAKEOVER: 20, DARK_WEB: 15, CREDIT_INQUIRY: 8 }
      ESCALATION_WEIGHT: 10
      SCORE_DROP_WEIGHT: 12
      FAMILY_CHILD_MULTIPLIER: 1.20
      SCORE_CEILING: 100
      SCORE_FLOOR: 0
      COUNTED_STATUSES_LIVE:
        SSN_TRACE: [CONFIRMED_FRAUD, ESCALATED]
        ACCOUNT_TAKEOVER: [CONFIRMED_FRAUD, ESCALATED]
        DARK_WEB: [ACKNOWLEDGED, CONFIRMED_FRAUD, ESCALATED]
        CREDIT_INQUIRY: [NEW, ACKNOWLEDGED, CONFIRMED_FRAUD, ESCALATED]
      COUNTED_STATUSES_UNDERWRITING:
        SSN_TRACE: [CONFIRMED_FRAUD, ESCALATED]
        ACCOUNT_TAKEOVER: [CONFIRMED_FRAUD, ESCALATED]
        DARK_WEB: [CONFIRMED_FRAUD, ESCALATED]
        CREDIT_INQUIRY: [CONFIRMED_FRAUD, ESCALATED]
    precision: "integer, round_half_up after the multiplier, then clamped to [0, 100]"
    variants:
      - name: LIVE
        when: "Always; written to Subscriber.risk_score. Consumer-facing 'how exposed are you right now' number."
        difference: "Counts un-triaged and merely-acknowledged signals (a NEW CREDIT_INQUIRY, an ACKNOWLEDGED DARK_WEB hit) and applies FAMILY_CHILD_MULTIPLIER."
      - name: UNDERWRITING
        when: "Always; written to Subscriber.underwriting_risk_score. Used by the insurance gate on claim submit (must be <= 75)."
        difference: "Counts only alerts the subscriber has confirmed as fraud (CONFIRMED_FRAUD or ESCALATED) for every alert_type, and never applies FAMILY_CHILD_MULTIPLIER. Identical data therefore yields a strictly lower number whenever any NEW/ACKNOWLEDGED alert exists."

  - name: claim_reimbursement
    trigger: "Variant PROVISIONAL on POST /idp/insurance-claims/{id}/submit (writes provisional_amount_cents); variant FINAL on POST /idp/insurance-claims/{id}/approve (writes approved_cents)"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER — round per line item FIRST, then sum, then
      # sublimit, then deductible, then remaining-insurance cap. Summing the
      # unrounded products and rounding once at the end is WRONG and yields a
      # different number in cents.
      #
      # step 1 (per expense, rounded individually):
      for e in claim.expenses:
          pct = COVERAGE_PCT[e.category]
          if e.documented:            f = 1.00
          elif variant == PROVISIONAL: f = UNDOCUMENTED_FACTOR_PROVISIONAL   # 0.50
          else:                        f = UNDOCUMENTED_FACTOR_FINAL         # 0.00
          e.eligible_cents = round_half_up(e.amount_cents * pct * f)
      # step 2 (sum per category, over the already-rounded line items):
      per_category[c] = sum(e.eligible_cents for e in claim.expenses if e.category == c)
      # step 3 (category sublimit):
      capped[c] = min(per_category[c], CATEGORY_SUBLIMIT_CENTS[c])
                  if c in CATEGORY_SUBLIMIT_CENTS else per_category[c]
      # step 4 (gross, then deductible, floored at 0):
      gross           = sum(capped[c] for every category c present)
      after_deductible = max(0, gross - DEDUCTIBLE_CENTS)
      # step 5 (cap at what is left of the lifetime limit):
      result = min(after_deductible, Subscriber.insurance_remaining_cents)
    input_set: "Every element of InsuranceClaim.expenses (no state filter — expenses are immutable once the claim is created). Subscriber.insurance_remaining_cents is read at the moment the variant runs."
    constants:
      COVERAGE_PCT: { LEGAL_FEES: 1.00, LOST_WAGES: 0.80, TRAVEL: 0.50, CHILDCARE: 0.50, NOTARY: 1.00, POSTAGE: 1.00 }
      CATEGORY_SUBLIMIT_CENTS: { LOST_WAGES: 250000, TRAVEL: 100000, CHILDCARE: 100000 }
      UNDOCUMENTED_FACTOR_PROVISIONAL: 0.50
      UNDOCUMENTED_FACTOR_FINAL: 0.00
      DEDUCTIBLE_CENTS: 2500
    precision: "whole cents; round_half_up applied per line item in step 1 and nowhere else"
    variants:
      - name: PROVISIONAL
        when: "Claim submit. Shown to the subscriber as the estimated reimbursement."
        difference: "Undocumented expenses are credited at UNDOCUMENTED_FACTOR_PROVISIONAL = 0.50 of their covered amount."
      - name: FINAL
        when: "Claims-adjuster approval. Written to approved_cents and used by the payment ledger."
        difference: "Undocumented expenses are credited at UNDOCUMENTED_FACTOR_FINAL = 0.00 — they drop out entirely. Identical expense data therefore produces a strictly smaller number than PROVISIONAL whenever any expense has documented == false."

  - name: alert_escalation_tier
    trigger: "POST /idp/alerts/{id}/escalate"
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, ORDER PINNED:
      #   identity_risk_score counts ESCALATED alerts (ESCALATION_WEIGHT = 10),
      #   and the tier chosen here is read from risk_score. The order below is
      #   normative: the tier is decided from the PRE-transition snapshot, and
      #   risk_score is only recomputed afterwards.
      #
      # step 1 — snapshot (read persisted value BEFORE any mutation):
      r0 = Subscriber.risk_score            # as persisted before this request
      # step 2 — tier from the snapshot only:
      if   r0 >= TIER3_RISK_THRESHOLD or Alert.severity == CRITICAL: tier = TIER3
      elif r0 >= TIER2_RISK_THRESHOLD or Alert.severity == HIGH:     tier = TIER2
      else:                                                          tier = TIER1
      # step 3 — persist the transition:
      Alert.status          = ESCALATED
      Alert.escalation_tier = tier
      Alert.escalation_deadline = logical_clock + SLA_HOURS[tier]
      # step 4 — only NOW recompute both identity_risk_score variants; the alert
      #          just became ESCALATED so ESCALATION_WEIGHT enters the sum.
      # step 5 — lift the origin case's floor:
      RestorationCase.required_specialist_tier = max_by_tier_rank(tier,
                                                 RestorationCase.required_specialist_tier)
    input_set: "The single Alert being escalated, plus the Subscriber.risk_score value persisted before this request."
    constants:
      TIER2_RISK_THRESHOLD: 40
      TIER3_RISK_THRESHOLD: 70
      SLA_HOURS: { TIER1: 72, TIER2: 24, TIER3: 4 }
    precision: "exact integer comparison; >= at both thresholds"

  - name: required_specialist_tier
    trigger: "At RestorationCase creation (the confirm-fraud cascade), and again on alert escalation"
    algorithm: threshold
    formula: |
      from_severity = TIER3 if Alert.severity == CRITICAL
                 else TIER2 if Alert.severity == HIGH
                 else TIER1
      required_specialist_tier = max_by_tier_rank(from_severity, Plan.min_specialist_tier)
      # tier_rank: TIER1 = 1, TIER2 = 2, TIER3 = 3
    input_set: "The originating Alert's severity and the subscriber's Plan.min_specialist_tier."
    constants:
      TIER_RANK: { TIER1: 1, TIER2: 2, TIER3: 3 }
    precision: "exact enum"

  - name: specialist_selection
    trigger: "POST /idp/restoration-cases/{id}/assign when the body omits specialist_id"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter — explicit predicate over entity fields:
      candidates = [sp for sp in Specialist
                    where sp.status == AVAILABLE
                      and TIER_RANK[sp.tier] >= TIER_RANK[case.required_specialist_tier]
                      and sp.active_case_count < sp.max_caseload]
      # (b) ranking expression (ascending on each key, in order):
      #     1. sp.active_case_count            ASC   (spread the load)
      #     2. TIER_RANK[sp.tier]              ASC   (do not burn a TIER3 on a TIER1 case)
      # (c) tie-break when both keys tie:
      #     3. sp.created_at                   ASC   (never sp.id)
      # (d) empty candidate set:
      if candidates is empty: reject with ERR_NO_ELIGIBLE_SPECIALIST (409)
      chosen = candidates sorted by (active_case_count ASC, TIER_RANK[tier] ASC, created_at ASC)[0]
    input_set: "All Specialist rows. Specialists with status == AT_CAPACITY are excluded — which is exactly how the assign cascade's hop-3 flip changes the outcome of later auto-assigns."
    constants:
      TIER_RANK: { TIER1: 1, TIER2: 2, TIER3: 3 }
    precision: "deterministic total order; created_at is the final tie-break, never id"

  - name: specialist_active_case_count
    trigger: "After a RestorationCase assign and after a RestorationCase resolve"
    algorithm: aggregation
    formula: |
      Specialist.active_case_count = count(RestorationCase
                                           where specialist_id == Specialist.id
                                             and status in {ASSIGNED, IN_PROGRESS, PENDING_SUBSCRIBER})
      Specialist.status = AT_CAPACITY if active_case_count >= Specialist.max_caseload
                          else AVAILABLE
      # CONSERVED QUANTITY (open-caseload conservation):
      #   sum(sp.active_case_count for every Specialist sp)
      #   == count(RestorationCase where specialist_id is not null
      #            and status in {ASSIGNED, IN_PROGRESS, PENDING_SUBSCRIBER})
      # assign (+1) followed by resolve (-1) MUST return both sides to their
      # pre-assign values, and Specialist.status back to its pre-assign value.
    input_set: "RestorationCase rows with a non-null specialist_id and status in {ASSIGNED, IN_PROGRESS, PENDING_SUBSCRIBER}. OPEN cases (no specialist) and RESOLVED cases are excluded."
    constants:
      ACTIVE_CASE_STATUSES: [ASSIGNED, IN_PROGRESS, PENDING_SUBSCRIBER]
    precision: "exact integer; the >= comparison against max_caseload is inclusive"

  - name: insurance_remaining
    trigger: "After POST /idp/insurance-claims/{id}/pay and after POST /idp/insurance-claims/{id}/reverse"
    algorithm: aggregation
    formula: |
      paid_sum = sum(c.approved_cents for c in InsuranceClaim
                     where c.subscriber_id == S.id and c.status == PAID)
      S.insurance_remaining_cents = Plan.insurance_limit_cents - paid_sum
      S.insurance_status = EXHAUSTED if S.insurance_remaining_cents <= 0 else AVAILABLE
      # CONSERVED QUANTITY (reimbursement-budget conservation):
      #   Plan.insurance_limit_cents
      #   == S.insurance_remaining_cents + sum(approved_cents over PAID claims)
      # pay followed by reverse MUST restore insurance_remaining_cents and
      # insurance_status to their exact pre-pay values (zero drift).
    input_set: "InsuranceClaim rows of this subscriber with status == PAID. Claims in DRAFT, SUBMITTED, APPROVED, DENIED, REVERSED and SUPERSEDED are excluded."
    constants:
      EXHAUSTION_THRESHOLD_CENTS: 0
    precision: "whole cents; exhaustion test is <= 0 (a remaining of exactly 0 IS exhausted)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the roles declared in §1.7; X-User-ID present for every role except Anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource named in the path, then every FK supplied in the body, exists — validated left-to-right (path before body)"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_SUBSCRIBER_NOT_FOUND | ERR_FAMILY_MEMBER_NOT_FOUND | ERR_BUREAU_PROFILE_NOT_FOUND | ERR_ALERT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_SPECIALIST_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_WALLET_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id or a body FK"

  - priority: 4
    category: auth
    check: "Ownership. Role Subscriber: X-User-ID must equal the Subscriber.id that owns the target resource (directly, or via subscriber_id on FamilyMember / BureauProfile / Alert / RestorationCase / InsuranceClaim / WalletItem, or via BureauProfile.subscriber_id for ThawWindow). Role RestorationSpecialist: X-User-ID must equal RestorationCase.specialist_id for case actions, and SpecialistEngagement.specialist_id for engagement creation."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints reachable by Subscriber or RestorationSpecialist that target an owned resource"

  - priority: 5
    category: business_constraint
    check: "Request body schema: required fields present, enum members valid, integers non-negative, ssn_last4 exactly 4 digits, expenses a non-empty array of {category, amount_cents, documented}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with an input body"

  - priority: 6
    category: business_constraint
    check: "Verification token supplied to POST /idp/subscribers/{id}/verify equals the stored Subscriber.verification_token"
    error_id: ERR_INVALID_VERIFICATION_TOKEN
    http_status: 422
    applies_to: "POST /idp/subscribers/{id}/verify"

  - priority: 7
    category: business_constraint
    check: "OCC. expected_case_version equals RestorationCase.version (concurrency_rules[claim-create-stale-case]); expected_specialist_version equals Specialist.version (concurrency_rules[engagement-create-stale-specialist])"
    error_id: "ERR_STALE_CASE_VERSION | ERR_STALE_SPECIALIST_VERSION"
    http_status: 412
    applies_to: "POST /idp/insurance-claims, POST /idp/specialist-engagements"

  - priority: 8
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2 (Alert, RestorationCase, InsuranceClaim, BureauProfile, WalletItem, Subscriber)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "Cross-entity state: the RestorationCase referenced by an InsuranceClaim being submitted is in status RESOLVED"
    error_id: ERR_CASE_NOT_RESOLVED
    http_status: 409
    applies_to: "POST /idp/insurance-claims/{id}/submit"

  - priority: 10
    category: business_safety
    check: "Cross-entity state: the Subscriber owning the target resource has enrollment_status == ACTIVE"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /idp/alerts, POST /idp/alerts/{id}/* , POST /idp/restoration-cases/{id}/* , POST /idp/bureau-profiles/{id}/freeze-request, POST /idp/bureau-profiles/{id}/thaw-windows, POST /idp/bureau-profiles/{id}/score-refresh, POST /idp/wallet-items/{id}/report-lost, POST /idp/insurance-claims, POST /idp/insurance-claims/{id}/submit"

  - priority: 11
    category: business_safety
    check: "Specialist competency: TIER_RANK[Specialist.tier] >= TIER_RANK[RestorationCase.required_specialist_tier] for the explicitly supplied specialist_id"
    error_id: ERR_SPECIALIST_TIER_INSUFFICIENT
    http_status: 409
    applies_to: "POST /idp/restoration-cases/{id}/assign"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: the X-User-ID paying a claim must differ from InsuranceClaim.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /idp/insurance-claims/{id}/pay"

  - priority: 13
    category: business_referential
    check: "A family_member_id supplied on POST /idp/alerts belongs to the subscriber_id supplied in the same body"
    error_id: ERR_FAMILY_MEMBER_MISMATCH
    http_status: 409
    applies_to: "POST /idp/alerts"

  - priority: 14
    category: business_referential
    check: "An Alert may not be raised against a FamilyMember whose monitoring_status == NOT_COVERED (i.e. a CHILD on a plan with child_monitoring_included == false). The family member row itself is still created; only monitoring coverage is withheld."
    error_id: ERR_CHILD_MONITORING_NOT_INCLUDED
    http_status: 409
    applies_to: "POST /idp/alerts"

  - priority: 15
    category: business_temporal
    check: "window_end must be strictly after window_start, and window_start must be >= the logical clock"
    error_id: "ERR_INVALID_WINDOW | ERR_WINDOW_IN_PAST"
    http_status: 422
    applies_to: "POST /idp/bureau-profiles/{id}/thaw-windows, POST /idp/specialist-engagements"

  - priority: 16
    category: business_temporal
    check: "ThawWindow overlap (CLOSED intervals, capacity 1): reject when an existing ThawWindow W on the same BureauProfile satisfies new.window_start <= W.window_end AND W.window_start <= new.window_end. Endpoints that merely touch (new.window_start == W.window_end) DO collide."
    error_id: ERR_THAW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /idp/bureau-profiles/{id}/thaw-windows"

  - priority: 17
    category: business_temporal
    check: "SpecialistEngagement capacity (HALF-OPEN intervals [start, end) each extended by ENGAGEMENT_BUFFER_MINUTES = 60 after end, aggregate capacity = Specialist.max_concurrent_engagements): reject when, at any instant, the count of the specialist's buffer-extended engagement intervals containing that instant would exceed max_concurrent_engagements once the new one is added. Two engagements that merely touch at end == start DO collide, because the buffer extends the earlier one 60 minutes past its end."
    error_id: ERR_ENGAGEMENT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /idp/specialist-engagements"

  - priority: 18
    category: business_constraint
    check: "Specialist caseload: Specialist.active_case_count < Specialist.max_caseload for the explicitly supplied specialist_id"
    error_id: ERR_SPECIALIST_AT_CAPACITY
    http_status: 409
    applies_to: "POST /idp/restoration-cases/{id}/assign"

  - priority: 19
    category: business_constraint
    check: "Auto-assign: calculations.specialist_selection's candidate set is non-empty when the assign body omits specialist_id"
    error_id: ERR_NO_ELIGIBLE_SPECIALIST
    http_status: 409
    applies_to: "POST /idp/restoration-cases/{id}/assign"

  - priority: 20
    category: business_constraint
    check: "Family size: count(FamilyMember of this subscriber) < Plan.max_family_members before insert"
    error_id: ERR_FAMILY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /idp/subscribers/{id}/family-members"

  - priority: 21
    category: business_fiscal
    check: "Insurance budget: Subscriber.insurance_status == AVAILABLE"
    error_id: ERR_INSURANCE_EXHAUSTED
    http_status: 409
    applies_to: "POST /idp/insurance-claims/{id}/submit"

  - priority: 22
    category: business_fiscal
    check: "Underwriting gate: Subscriber.underwriting_risk_score <= 75 (strictly greater is rejected)"
    error_id: ERR_UNDERWRITING_RISK_TOO_HIGH
    http_status: 409
    applies_to: "POST /idp/insurance-claims/{id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Plans -------------------------------------------------------------
  - method: POST
    path: "/idp/plans"
    description: "Create a protection plan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [tier, monthly_fee_cents, insurance_limit_cents, max_family_members, "child_monitoring_included?", bureau_scope, "min_specialist_tier?"]
    output: Plan
    side_effects: []

  - method: GET
    path: "/idp/plans/{id}"
    description: "Read a plan"
    roles: [Anonymous, Subscriber, PlatformAdmin, ClaimsAdjuster, RestorationSpecialist]
    code: 200
    input: []
    output: Plan
    side_effects: []

  # ---- Subscribers -------------------------------------------------------
  - method: POST
    path: "/idp/subscribers"
    description: "Enroll. Creates the Subscriber in PENDING_VERIFICATION / NOT_ENROLLED and returns verification_token."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [email, full_name, date_of_birth, ssn_last4, plan_id]
    output: Subscriber
    side_effects: ["mints verification_token", "no BureauProfile rows yet"]

  - method: GET
    path: "/idp/subscribers"
    description: "List subscribers; reverse-reachability for Subscriber.plan_id"
    roles: [PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["plan_id?", "enrollment_status?", "limit?", "offset?"]
    output: Subscriber[]
    side_effects: []

  - method: GET
    path: "/idp/subscribers/{id}"
    description: "Read a subscriber"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster, RestorationSpecialist]
    code: 200
    input: []
    output: Subscriber
    side_effects: []

  - method: POST
    path: "/idp/subscribers/{id}/verify"
    description: "Consume the verification token; activates enrollment and provisions BureauProfiles"
    roles: [Anonymous, Subscriber]
    code: 200
    input: [verification_token]
    output: Subscriber
    side_effects:
      - "enrollment_status PENDING_VERIFICATION -> ACTIVE"
      - "monitoring_status NOT_ENROLLED -> PENDING_DATA"
      - "creates BureauProfile rows (EQUIFAX, EXPERIAN, TRANSUNION for TRI plans; EQUIFAX only for SINGLE plans) in that order"
      - "insurance_remaining_cents := Plan.insurance_limit_cents; insurance_status := AVAILABLE"
      - "risk_score := 10; underwriting_risk_score := 10"
      - "increments Subscriber.version by 1"

  - method: POST
    path: "/idp/subscribers/{id}/suspend"
    description: "Suspend enrollment (non-payment, fraud hold)"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Subscriber
    side_effects: ["enrollment_status ACTIVE -> SUSPENDED", "monitoring_status -> PAUSED", "increments Subscriber.version by 1"]

  - method: POST
    path: "/idp/subscribers/{id}/reactivate"
    description: "Lift a suspension"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscriber
    side_effects: ["enrollment_status SUSPENDED -> ACTIVE", "monitoring_status PAUSED -> MONITORED or PENDING_DATA", "increments Subscriber.version by 1"]

  - method: GET
    path: "/idp/subscribers/{id}/credit-summary"
    description: "Computed read: composite score, how many bureaus have reported, and the two risk variants"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: "{ subscriber_id: string, composite_credit_score: integer, baseline_composite_credit_score: integer, bureau_count: integer, scored_bureau_count: integer, monitoring_status: string, risk_score: integer, underwriting_risk_score: integer, insurance_remaining_cents: integer, insurance_status: string }"
    side_effects: []

  # ---- Family ------------------------------------------------------------
  - method: POST
    path: "/idp/subscribers/{id}/family-members"
    description: "Add a family member under the subscriber's plan allowance"
    roles: [Subscriber, PlatformAdmin]
    code: 201
    input: [full_name, date_of_birth, ssn_last4, relationship]
    output: FamilyMember
    side_effects: ["monitoring_status computed from relationship and Plan.child_monitoring_included"]

  - method: GET
    path: "/idp/subscribers/{id}/family-members"
    description: "Reverse-reachability for FamilyMember.subscriber_id; ordered by created_at ASC"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: FamilyMember[]
    side_effects: []

  # ---- Bureau profiles ---------------------------------------------------
  - method: GET
    path: "/idp/subscribers/{id}/bureau-profiles"
    description: "Reverse-reachability for BureauProfile.subscriber_id; ordered by created_at ASC (EQUIFAX, EXPERIAN, TRANSUNION)"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: BureauProfile[]
    side_effects: []

  - method: GET
    path: "/idp/bureau-profiles/{id}"
    description: "Read one bureau profile"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: BureauProfile
    side_effects: []

  - method: POST
    path: "/idp/bureau-profiles/{id}/score-refresh"
    description: "Monitoring feed pushes a fresh score pull for this bureau file"
    roles: [PlatformAdmin]
    code: 200
    input: [credit_score]
    output: BureauProfile
    side_effects:
      - "sets credit_score and score_pulled_at := logical clock"
      - "recomputes Subscriber.composite_credit_score (calculations.composite_credit_score)"
      - "writes Subscriber.baseline_composite_credit_score on the first non-null composite only"
      - "monitoring_status PENDING_DATA -> MONITORED on that first non-null composite"
      - "recomputes Subscriber.risk_score and underwriting_risk_score"
      - "increments BureauProfile.version by 1; increments Subscriber.version by 1"

  - method: POST
    path: "/idp/bureau-profiles/{id}/freeze-request"
    description: "Request a freeze or a thaw of this bureau file"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: [action]
    output: BureauProfile
    side_effects: ["UNFROZEN -> FREEZE_PENDING (action FREEZE) or FROZEN -> THAW_PENDING (action THAW)", "increments BureauProfile.version by 1"]

  - method: POST
    path: "/idp/bureau-profiles/{id}/confirm"
    description: "Bureau callback confirming whichever freeze/thaw request is pending"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BureauProfile
    side_effects: ["FREEZE_PENDING -> FROZEN or THAW_PENDING -> UNFROZEN", "increments BureauProfile.version by 1"]

  - method: POST
    path: "/idp/bureau-profiles/{id}/thaw-windows"
    description: "Schedule a temporary thaw interval on a FROZEN bureau file (closed interval, capacity 1)"
    roles: [Subscriber, PlatformAdmin]
    code: 201
    input: [window_start, window_end, purpose]
    output: ThawWindow
    side_effects: ["is_currently_open computed against the logical clock"]

  - method: GET
    path: "/idp/bureau-profiles/{id}/thaw-windows"
    description: "Reverse-reachability for ThawWindow.bureau_profile_id; ordered by window_start ASC"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ThawWindow[]
    side_effects: []

  # ---- Wallet ------------------------------------------------------------
  - method: POST
    path: "/idp/subscribers/{id}/wallet-items"
    description: "Store a card or document in the protected wallet"
    roles: [Subscriber, PlatformAdmin]
    code: 201
    input: [item_type, issuer, last4]
    output: WalletItem
    side_effects: []

  - method: GET
    path: "/idp/subscribers/{id}/wallet-items"
    description: "Reverse-reachability for WalletItem.subscriber_id; ordered by created_at ASC"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: WalletItem[]
    side_effects: []

  - method: POST
    path: "/idp/wallet-items/{id}/report-lost"
    description: "Lost-wallet assist: flags the item, raises an Alert, and for an SSN_CARD fires freeze requests on every UNFROZEN bureau file"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: []
    output: WalletItem
    side_effects:
      - "status ACTIVE -> REPORTED_LOST; reported_lost_at := logical clock"
      - "creates one Alert (type/severity derived from item_type) in status NEW"
      - "SSN_CARD only: every UNFROZEN BureauProfile of the subscriber -> FREEZE_PENDING"
      - "recomputes Subscriber.risk_score and underwriting_risk_score"
      - "increments WalletItem.version by 1; increments Subscriber.version by 1"

  # ---- Alerts ------------------------------------------------------------
  - method: POST
    path: "/idp/alerts"
    description: "Monitoring feed ingestion: dark-web hit, SSN trace, account takeover, credit inquiry"
    roles: [PlatformAdmin]
    code: 201
    input: [subscriber_id, "family_member_id?", alert_type, severity, source_detail]
    output: Alert
    side_effects: ["recomputes Subscriber.risk_score and underwriting_risk_score", "increments Subscriber.version by 1"]

  - method: GET
    path: "/idp/alerts"
    description: "Reverse-reachability for Alert.subscriber_id and Alert.family_member_id; ordered by created_at ASC"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster, RestorationSpecialist]
    code: 200
    input: ["subscriber_id?", "family_member_id?", "status?", "limit?", "offset?"]
    output: Alert[]
    side_effects: []

  - method: GET
    path: "/idp/alerts/{id}"
    description: "Read one alert"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster, RestorationSpecialist]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: POST
    path: "/idp/alerts/{id}/acknowledge"
    description: "Subscriber acknowledges the alert (NEW -> ACKNOWLEDGED)"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: []
    output: Alert
    side_effects: ["recomputes both identity_risk_score variants", "increments Alert.version and Subscriber.version by 1"]

  - method: POST
    path: "/idp/alerts/{id}/confirm-fraud"
    description: "Branch A: subscriber confirms the alert is fraud; opens a RestorationCase"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: []
    output: Alert
    side_effects:
      - "status ACKNOWLEDGED -> CONFIRMED_FRAUD"
      - "creates a RestorationCase (OPEN, specialist_id null, required_specialist_tier from calculations.required_specialist_tier)"
      - "recomputes both identity_risk_score variants"
      - "increments Alert.version and Subscriber.version by 1"

  - method: POST
    path: "/idp/alerts/{id}/dismiss"
    description: "Branch B: subscriber dismisses the alert as a false positive; NO case is created"
    roles: [Subscriber, PlatformAdmin]
    code: 200
    input: [dismissal_reason]
    output: Alert
    side_effects:
      - "status ACKNOWLEDGED -> DISMISSED; dismissal_reason recorded"
      - "recomputes both identity_risk_score variants"
      - "increments Alert.version and Subscriber.version by 1"

  - method: POST
    path: "/idp/alerts/{id}/escalate"
    description: "Escalate a confirmed-fraud alert; tier from calculations.alert_escalation_tier using the PRE-transition risk_score snapshot"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Alert
    side_effects:
      - "status CONFIRMED_FRAUD -> ESCALATED; escalation_tier and escalation_deadline written"
      - "raises RestorationCase.required_specialist_tier on the origin case"
      - "recomputes both identity_risk_score variants AFTER the flip"
      - "increments Alert.version, RestorationCase.version and Subscriber.version by 1"

  # ---- Restoration cases -------------------------------------------------
  - method: GET
    path: "/idp/restoration-cases"
    description: "Reverse-reachability for RestorationCase.subscriber_id / origin_alert_id / specialist_id; ordered by created_at ASC"
    roles: [Subscriber, PlatformAdmin, RestorationSpecialist, ClaimsAdjuster]
    code: 200
    input: ["subscriber_id?", "origin_alert_id?", "specialist_id?", "status?", "limit?", "offset?"]
    output: RestorationCase[]
    side_effects: []

  - method: GET
    path: "/idp/restoration-cases/{id}"
    description: "Read one restoration case"
    roles: [Subscriber, PlatformAdmin, RestorationSpecialist, ClaimsAdjuster]
    code: 200
    input: []
    output: RestorationCase
    side_effects: []

  - method: POST
    path: "/idp/restoration-cases/{id}/assign"
    description: "Assign a specialist. Omit specialist_id to let calculations.specialist_selection pick one."
    roles: [PlatformAdmin]
    code: 200
    input: ["specialist_id?"]
    output: RestorationCase
    side_effects:
      - "status OPEN -> ASSIGNED; specialist_id set"
      - "cascade: Specialist.active_case_count += 1 -> Specialist.status AT_CAPACITY at >= max_caseload -> specialist excluded from later auto-assign"
      - "increments RestorationCase.version and Specialist.version by 1"

  - method: POST
    path: "/idp/restoration-cases/{id}/request-info"
    description: "Assigned specialist asks the subscriber for documents (IN_PROGRESS -> PENDING_SUBSCRIBER)"
    roles: [RestorationSpecialist]
    code: 200
    input: [info_request]
    output: RestorationCase
    side_effects: ["increments RestorationCase.version by 1"]

  - method: POST
    path: "/idp/restoration-cases/{id}/provide-info"
    description: "Subscriber responds; the case loops back to IN_PROGRESS (PENDING_SUBSCRIBER -> IN_PROGRESS)"
    roles: [Subscriber]
    code: 200
    input: [info_response]
    output: RestorationCase
    side_effects: ["increments RestorationCase.version by 1"]

  - method: POST
    path: "/idp/restoration-cases/{id}/resolve"
    description: "Assigned specialist closes the case out"
    roles: [RestorationSpecialist]
    code: 200
    input: [resolution_summary]
    output: RestorationCase
    side_effects:
      - "status IN_PROGRESS -> RESOLVED"
      - "compensation: Specialist.active_case_count -= 1 -> Specialist.status back to AVAILABLE when below max_caseload"
      - "origin Alert -> RESOLVED -> recomputes both identity_risk_score variants"
      - "increments RestorationCase.version, Specialist.version, Alert.version, Subscriber.version by 1"

  # ---- Specialists -------------------------------------------------------
  - method: POST
    path: "/idp/specialists"
    description: "Register a restoration specialist"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, tier, max_caseload, "max_concurrent_engagements?"]
    output: Specialist
    side_effects: ["active_case_count := 0; status := AVAILABLE"]

  - method: GET
    path: "/idp/specialists/{id}"
    description: "Read one specialist (source of expected_specialist_version)"
    roles: [PlatformAdmin, RestorationSpecialist, ClaimsAdjuster]
    code: 200
    input: []
    output: Specialist
    side_effects: []

  - method: POST
    path: "/idp/specialist-engagements"
    description: "Book a work window on a specialist's calendar for one case. OCC-guarded on Specialist.version."
    roles: [PlatformAdmin, RestorationSpecialist]
    code: 201
    input: [specialist_id, case_id, window_start, window_end, expected_specialist_version]
    output: SpecialistEngagement
    side_effects:
      - "RestorationCase ASSIGNED -> IN_PROGRESS on the first engagement for that case"
      - "increments Specialist.version by 1; increments RestorationCase.version by 1 when the case status changed"

  - method: GET
    path: "/idp/specialist-engagements"
    description: "Reverse-reachability for SpecialistEngagement.specialist_id / case_id; ordered by window_start ASC"
    roles: [PlatformAdmin, RestorationSpecialist]
    code: 200
    input: ["specialist_id?", "case_id?", "limit?", "offset?"]
    output: SpecialistEngagement[]
    side_effects: []

  - method: GET
    path: "/idp/specialist-engagements/{id}"
    description: "Read one engagement"
    roles: [PlatformAdmin, RestorationSpecialist]
    code: 200
    input: []
    output: SpecialistEngagement
    side_effects: []

  # ---- Insurance claims --------------------------------------------------
  - method: POST
    path: "/idp/insurance-claims"
    description: "Open a DRAFT reimbursement claim against a restoration case. OCC-guarded on RestorationCase.version; supersedes any existing DRAFT claim on that case."
    roles: [Subscriber]
    code: 201
    input: [case_id, expected_case_version, expenses]
    output: InsuranceClaim
    side_effects:
      - "any existing DRAFT claim on the same case -> SUPERSEDED"
      - "increments RestorationCase.version by 1"

  - method: GET
    path: "/idp/insurance-claims"
    description: "Reverse-reachability for InsuranceClaim.case_id / subscriber_id; ordered by created_at ASC"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["subscriber_id?", "case_id?", "status?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []

  - method: GET
    path: "/idp/insurance-claims/{id}"
    description: "Read one claim"
    roles: [Subscriber, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/idp/insurance-claims/{id}/submit"
    description: "Submit the claim; runs calculations.claim_reimbursement variant PROVISIONAL"
    roles: [Subscriber]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status DRAFT -> SUBMITTED", "writes provisional_amount_cents", "increments InsuranceClaim.version by 1"]

  - method: POST
    path: "/idp/insurance-claims/{id}/approve"
    description: "Adjuster approves; runs calculations.claim_reimbursement variant FINAL"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status SUBMITTED -> APPROVED", "writes approved_cents and approved_by_user_id", "increments InsuranceClaim.version by 1"]

  - method: POST
    path: "/idp/insurance-claims/{id}/deny"
    description: "Adjuster denies the claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: [denial_reason]
    output: InsuranceClaim
    side_effects: ["status SUBMITTED -> DENIED", "increments InsuranceClaim.version by 1"]

  - method: POST
    path: "/idp/insurance-claims/{id}/pay"
    description: "Disburse an approved claim. Segregation of duties: the paying X-User-ID must differ from approved_by_user_id."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "status APPROVED -> PAID"
      - "cascade: Subscriber.insurance_remaining_cents recomputed -> insurance_status EXHAUSTED at 0 -> further submits rejected with ERR_INSURANCE_EXHAUSTED"
      - "increments InsuranceClaim.version and Subscriber.version by 1"

  - method: POST
    path: "/idp/insurance-claims/{id}/reverse"
    description: "Compensating action: claw a paid claim back; insurance_remaining_cents returns to its exact pre-pay value"
    roles: [PlatformAdmin]
    code: 200
    input: [reversal_reason]
    output: InsuranceClaim
    side_effects:
      - "status PAID -> REVERSED"
      - "compensation: Subscriber.insurance_remaining_cents recomputed; insurance_status back to AVAILABLE when > 0"
      - "increments InsuranceClaim.version and Subscriber.version by 1"

  # ---- Test-driving ------------------------------------------------------
  - method: POST
    path: "/idp/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent score_pulled_at, reported_lost_at, escalation_deadline and is_currently_open evaluations use the new clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing/unknown, or X-User-ID missing for a non-Anonymous role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Subscriber acts on a resource owned by a different subscriber, or RestorationSpecialist acts on a case not assigned to them"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID paying a claim equals InsuranceClaim.approved_by_user_id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id does not resolve to a Plan"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "subscriber id in path or body does not resolve"
  - id: ERR_FAMILY_MEMBER_NOT_FOUND
    http: 404
    condition: "family_member_id does not resolve"
  - id: ERR_BUREAU_PROFILE_NOT_FOUND
    http: 404
    condition: "bureau profile id in path does not resolve"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "alert id in path does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "restoration case id in path or case_id in body does not resolve"
  - id: ERR_SPECIALIST_NOT_FOUND
    http: 404
    condition: "specialist id in path or specialist_id in body does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "insurance claim id in path does not resolve"
  - id: ERR_WALLET_ITEM_NOT_FOUND
    http: 404
    condition: "wallet item id in path does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, negative amount, malformed ssn_last4, or an empty/ill-formed expenses array"
  - id: ERR_INVALID_VERIFICATION_TOKEN
    http: 422
    condition: "verification_token does not match the stored token"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version != RestorationCase.version on POST /idp/insurance-claims"
  - id: ERR_STALE_SPECIALIST_VERSION
    http: 412
    condition: "expected_specialist_version != Specialist.version on POST /idp/specialist-engagements"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The transition requested is not declared from the resource's current state in §1.2"
  - id: ERR_CASE_NOT_RESOLVED
    http: 409
    condition: "A claim is submitted while its RestorationCase is not RESOLVED"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "The owning Subscriber's enrollment_status is not ACTIVE"
  - id: ERR_SPECIALIST_TIER_INSUFFICIENT
    http: 409
    condition: "Explicitly supplied specialist's tier_rank is below the case's required_specialist_tier"
  - id: ERR_SPECIALIST_AT_CAPACITY
    http: 409
    condition: "Explicitly supplied specialist already holds max_caseload non-terminal cases"
  - id: ERR_NO_ELIGIBLE_SPECIALIST
    http: 409
    condition: "Auto-assign found an empty candidate set in calculations.specialist_selection"
  - id: ERR_ENGAGEMENT_CAPACITY_EXCEEDED
    http: 409
    condition: "The new engagement would push buffer-extended overlap above Specialist.max_concurrent_engagements at some instant"
  - id: ERR_THAW_WINDOW_OVERLAP
    http: 409
    condition: "The new thaw window collides (closed intervals, touching endpoints included) with an existing window on the same bureau profile"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "window_start is before the logical clock"
  - id: ERR_FAMILY_LIMIT_EXCEEDED
    http: 409
    condition: "Adding this family member would exceed Plan.max_family_members"
  - id: ERR_FAMILY_MEMBER_MISMATCH
    http: 409
    condition: "family_member_id on POST /idp/alerts belongs to a different subscriber than subscriber_id"
  - id: ERR_CHILD_MONITORING_NOT_INCLUDED
    http: 409
    condition: "An alert is raised against a FamilyMember whose monitoring_status == NOT_COVERED"
  - id: ERR_INSURANCE_EXHAUSTED
    http: 409
    condition: "Claim submit while Subscriber.insurance_status == EXHAUSTED"
  - id: ERR_UNDERWRITING_RISK_TOO_HIGH
    http: 409
    condition: "Claim submit while Subscriber.underwriting_risk_score > 75"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; may read plans, enroll, and verify with a token"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /idp/subscribers"
      - "POST /idp/subscribers/{id}/verify"
      - "GET /idp/plans/{id}"

  - name: Subscriber
    description: "The protected account holder; X-User-ID is the Subscriber.id"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /idp/restoration-cases/{id}/provide-info"
      - "POST /idp/insurance-claims"
      - "POST /idp/insurance-claims/{id}/submit"
    shared_operations:
      - "POST /idp/subscribers/{id}/verify"
      - "GET /idp/subscribers/{id}"
      - "GET /idp/subscribers/{id}/credit-summary"
      - "POST /idp/subscribers/{id}/family-members"
      - "GET /idp/subscribers/{id}/family-members"
      - "GET /idp/subscribers/{id}/bureau-profiles"
      - "GET /idp/bureau-profiles/{id}"
      - "POST /idp/bureau-profiles/{id}/freeze-request"
      - "POST /idp/bureau-profiles/{id}/thaw-windows"
      - "GET /idp/bureau-profiles/{id}/thaw-windows"
      - "POST /idp/subscribers/{id}/wallet-items"
      - "GET /idp/subscribers/{id}/wallet-items"
      - "POST /idp/wallet-items/{id}/report-lost"
      - "GET /idp/alerts"
      - "GET /idp/alerts/{id}"
      - "POST /idp/alerts/{id}/acknowledge"
      - "POST /idp/alerts/{id}/confirm-fraud"
      - "POST /idp/alerts/{id}/dismiss"
      - "GET /idp/restoration-cases"
      - "GET /idp/restoration-cases/{id}"
      - "GET /idp/insurance-claims"
      - "GET /idp/insurance-claims/{id}"

  - name: RestorationSpecialist
    description: "Identity-restoration specialist; X-User-ID is the Specialist.id. Works only cases assigned to them."
    identity: "entity_backed:Specialist"
    exclusive_operations:
      - "POST /idp/restoration-cases/{id}/request-info"
