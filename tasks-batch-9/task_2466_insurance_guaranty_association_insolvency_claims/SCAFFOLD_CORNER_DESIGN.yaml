              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /member-insurers"
              payload: { naic_code: "20001", insurer_name: "Huron Standard Insurance", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 10000000 }
              as: AssociationAdmin
            - call: "POST /assessments"
              payload: { insolvency_id: "${ins_id}", assessable_line: "PERSONAL_AUTO", base_year: 2025, needed_amount_cents: 150000 }
              as: AssessmentOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/certify"
              payload: {}
              as: AssessmentOfficer
          trigger:
            - call: "POST /assessments/${asmt_id}/certify"
              payload: {}
              as: AssessmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ASSESSMENT_INVALID_STATE"
