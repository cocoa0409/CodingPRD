scenario: |
  Generate task harder than expert level!

  2515. Correctional Food Service Operations (Aramark Correctional Services): meal plan built to a
  contracted nutrition standard and cost per meal-day, religious and medical diet order management
  with verification, population count feeds and meal forecasting including segregation and satellite
  feeding, inmate worker assignment, tool control and sharps accountability, cook-chill production,
  transport and reheat temperature logging, commissary interaction and contraband control in the
  kitchen, contract performance metrics and liquidated damages for missed meals, grievance response
  and menu substitution documentation

domain_name: correctional-food-service-operations
api_prefix: "/cfs"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Junction-style and cross-aggregate references dominate: MenuSubstitution joins MenuCycleItem to
  # MealServiceRecord; ContrabandIncident joins InmateWorker to ToolIssuance; DietOrder references
  # itself through supersedes_diet_order_id. URL paths stay flat except for four owned sub-resources.

  state_machine_shape: parallel
  # ProductionBatch carries two independent axes (production_stage x qa_status) that interlock only
  # through explicit cross-dimension preconditions. DietOrder is cyclic
  # (PENDING_VERIFICATION -> ACTIVE -> SUSPENDED -> PENDING_VERIFICATION), ServiceContract is cyclic
  # (ACTIVE -> RECONCILING -> ACTIVE), Grievance is branching fork-join, ToolIssuance branches.

  relationship_patterns:
    - one_to_many        # Facility -> Inmate / MealForecast / ProductionBatch / ToolIssuance
    - many_to_many       # MenuSubstitution joins MenuCycleItem x MealServiceRecord
    - self_referential   # DietOrder.supersedes_diet_order_id -> DietOrder.id
    - cross_aggregate    # ContrabandIncident -> ToolIssuance, Grievance -> MealServiceRecord (refeed)

  role_model: segregation_of_duties
  # Three enforced separations, each on a different artifact:
  #   MenuCycle: nutrition_signed_by_user_id != activated_by_user_id
  #   DietOrder: requested_by_user_id != verified_by_user_id
  #   ToolIssuance: issued_by_user_id != return_certified_by_user_id

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - name: contract_code
        type: string
        source: input
        description: Human-readable contract identifier; globally unique.
        constraints: "unique across ServiceContract; 3-32 chars"
      - name: vendor_name
        type: string
        source: input
        description: Food service vendor legal name.
      - name: status
        type: enum
        source: system
        description: Contract lifecycle state.
        default: DRAFT
        constraints: "DRAFT | ACTIVE | RECONCILING | CLOSED"
      - name: contracted_kcal_per_meal_day
        type: integer
        source: input
        description: Minimum kcal per inmate per meal-day the menu must deliver.
        constraints: ">= 1200"
      - name: contracted_protein_grams_per_meal_day
        type: number
        source: input
        description: Minimum grams of protein per inmate per meal-day.
        constraints: ">= 40"
      - name: contracted_sodium_mg_cap_per_meal_day
        type: integer
        source: input
        description: Maximum milligrams of sodium per inmate per meal-day.
        constraints: ">= 1000"
      - name: cost_ceiling_cents_per_meal_day
        type: integer
        source: input
        description: Contractual raw-food cost ceiling in cents per meal-day.
        constraints: "> 0"
      - name: ld_cents_per_missed_meal
        type: integer
        source: input
        description: Liquidated damages rate in cents charged per missed-meal unit.
        constraints: ">= 0"
      - name: ld_monthly_cap_cents
        type: integer
        source: input
        description: Hard cap in cents on liquidated damages for the contract period.
        constraints: ">= 0"
      - name: substitution_allowance_pct
        type: number
        source: input
        description: Menu substitution rate (percent of trays served) tolerated before a surcharge applies.
        constraints: ">= 0 and <= 100; 2 decimal places"
      - name: ld_variant
        type: enum
        source: system
        description: Liquidated-damages algorithm selected at the most recent reconcile call.
        default: null
        constraints: "INCIDENT_BASED | POPULATION_WEIGHTED | null before first reconcile"
      - name: total_trays_served
        type: integer
        source: computed
        description: Sum of MealServiceRecord.total_trays_served over records in status CLOSED or DISPUTED under this contract.
        default: 0
      - name: meal_days_served
        type: integer
        source: computed
        description: floor(total_trays_served / MEALS_PER_DAY); see calculations.contract_liquidated_damages.
        default: 0
      - name: missed_meal_total
        type: integer
        source: computed
        description: Sum of MealServiceRecord.missed_meal_count over records in status CLOSED or DISPUTED under this contract; incremented by cascade and fully recomputed at reconcile.
        default: 0
      - name: substitution_total
        type: integer
        source: computed
        description: Count of MenuSubstitution rows in approval_status APPROVED across every MealServiceRecord under this contract.
        default: 0
      - name: substitution_rate_pct
        type: number
        source: computed
        description: substitution_total as a percent of total_trays_served, 2 decimal places.
        default: 0.00
      - name: grievance_sla_breach_count
        type: integer
        source: computed
        description: Count of Grievance rows under this contract with sla_breached == true.
        default: 0
      - name: raw_liquidated_damages_cents
        type: integer
        source: computed
        description: Step-3 liquidated damages before surcharge, SLA adders and cap.
        default: 0
      - name: substitution_surcharge_cents
        type: integer
        source: computed
        description: Step-4 surcharge applied when substitution_rate_pct exceeds substitution_allowance_pct.
        default: 0
      - name: liquidated_damages_cents
        type: integer
        source: computed
        description: Step-6 capped liquidated damages (gross of any cost-recovery credit).
        default: 0
      - name: gross_food_cost_cents
        type: integer
        source: computed
        description: approved_cost_cents_per_meal_day of the ACTIVE MenuCycle multiplied by meal_days_served.
        default: 0
      - name: cost_cents_per_meal_day_actual
        type: number
        source: computed
        description: Step-7 realised raw-food cost per meal-day, computed from gross_food_cost_cents only (never net of damages).
        default: 0.00
      - name: cost_recovery_credit_cents
        type: integer
        source: computed
        description: Step-8 credit earned when cost_cents_per_meal_day_actual is at or under the ceiling.
        default: 0
      - name: net_liquidated_damages_cents
        type: integer
        source: computed
        description: Step-9 liquidated_damages_cents minus cost_recovery_credit_cents; the amount actually withheld.
        default: 0
      - name: performance_score
        type: number
        source: computed
        description: Contract performance metric, 2 decimal places, floored at 0.00.
        default: 0.00
      - name: reconciled_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent successful reconcile; null before the first one.
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the contract entered CLOSED.
        default: null

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: facility_code
        type: string
        source: input
        description: Institution identifier; globally unique.
        constraints: "unique across Facility"
      - name: name
        type: string
        source: input
        description: Institution name.
      - name: contract_id
        type: string
        source: input
        description: "FK -> ServiceContract.id; the contract this facility is served under."
      - name: satellite_site_count
        type: integer
        source: input
        description: Number of satellite feeding sites served from this kitchen; drives the menu cost overhead tier.
        default: 0
        constraints: ">= 0"
      - name: blast_chiller_capacity
        type: integer
        source: input
        description: Number of production batches whose buffered cook-chill occupancy intervals may overlap.
        default: 2
        constraints: ">= 1"
      - name: sharps_authorized_count
        type: integer
        source: input
        description: Total sharps on the shadow board when the kitchen is fully accounted for.
        constraints: ">= 0"
      - name: sharps_issued_count
        type: integer
        source: computed
        description: Count of ToolIssuance rows at this facility with status == ISSUED and tool_class in {SHARP_KNIFE, MEAT_SAW, SCISSORS}.
        default: 0
      - name: sharps_unaccounted_count
        type: integer
        source: computed
        description: Count of ToolIssuance rows at this facility with status == UNACCOUNTED and tool_class in {SHARP_KNIFE, MEAT_SAW, SCISSORS}.
        default: 0
      - name: sharps_audit_shortfall
        type: integer
        source: computed
        description: Shortfall recorded by the most recent sharps audit; persists until the next audit overwrites it.
        default: 0
      - name: sharps_on_board_count
        type: integer
        source: computed
        description: Tools physically on the shadow board. Initialised to sharps_authorized_count when the Facility is created, decremented by 1 on each issue, incremented by 1 on each return (including a recovery return out of UNACCOUNTED), and overwritten wholesale by counted_on_board on a sharps audit.
        default: sharps_authorized_count at creation
      - name: open_sharps_discrepancy_count
        type: integer
        source: computed
        description: sharps_unaccounted_count + sharps_audit_shortfall; any positive value forces LOCKDOWN.
        default: 0
      - name: open_contraband_incident_count
        type: integer
        source: computed
        description: Count of ContrabandIncident rows at this facility with status == OPEN.
        default: 0
      - name: corrective_action_required
        type: boolean
        source: computed
        description: Set true by contract close when performance_score < CORRECTIVE_ACTION_SCORE_FLOOR, or by the missed-meal escalation cascade.
        default: false
      - name: kitchen_posture
        type: enum
        source: computed
        description: Derived security posture that gates kitchen operations; see calculations.facility_kitchen_posture.
        default: OPEN
        constraints: "OPEN | RESTRICTED | LOCKDOWN"
      - name: active_special_diet_count
        type: integer
        source: computed
        description: Count of DietOrder rows with status == ACTIVE whose inmate has facility_id == this facility and status == IN_CUSTODY.
        default: 0
      - name: last_sharps_audit_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent sharps audit; null when never audited.
        default: null

  - name: MenuCycle
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the kitchen this cycle is built for."
      - name: cycle_code
        type: string
        source: input
        description: Cycle identifier; unique per facility.
        constraints: "unique per (facility_id, cycle_code)"
      - name: cycle_length_days
        type: integer
        source: input
        description: Number of distinct cycle days; each day needs exactly one item per meal slot.
        constraints: ">= 1 and <= 7"
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle state.
        default: DRAFT
        constraints: "DRAFT | NUTRITION_APPROVED | ACTIVE | RETIRED"
      - name: item_count
        type: integer
        source: computed
        description: Count of MenuCycleItem rows with menu_cycle_id == this cycle.
        default: 0
      - name: approved_kcal_per_meal_day
        type: integer
        source: computed
        description: Nutrition-signed kcal per meal-day; null while status == DRAFT.
        default: null
      - name: approved_protein_grams_per_meal_day
        type: number
        source: computed
        description: Nutrition-signed protein grams per meal-day, 2 decimal places; null while status == DRAFT.
        default: null
      - name: approved_sodium_mg_per_meal_day
        type: integer
        source: computed
        description: Nutrition-signed sodium mg per meal-day; null while status == DRAFT.
        default: null
      - name: approved_cost_cents_per_meal_day
        type: integer
        source: computed
        description: Nutrition-signed raw-food cost in cents per meal-day including the satellite overhead tier; null while status == DRAFT.
        default: null
      - name: nutrition_signed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegisteredDietitian who signed nutrition adequacy; cleared when the cycle reverts to DRAFT.
        default: null
      - name: activated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAdministrator who activated the cycle.
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant the cycle entered ACTIVE.
        default: null

  - name: MenuCycleItem
    parent: MenuCycle
    common_fields: true
    fields:
      - name: menu_cycle_id
        type: string
        source: input
        description: "FK -> MenuCycle.id; owning cycle."
      - name: cycle_day
        type: integer
        source: input
        description: Cycle day this component is served on.
        constraints: ">= 1 and <= MenuCycle.cycle_length_days"
      - name: meal_slot
        type: enum
        source: input
        description: Meal slot the component belongs to.
        constraints: "BREAKFAST | LUNCH | DINNER"
      - name: component_name
        type: string
        source: input
        description: Menu component name as printed on the production sheet.
      - name: kcal_per_100g
        type: number
        source: input
        description: Energy density in kcal per 100 g of the component as served.
        constraints: "> 0"
      - name: protein_grams_per_100g
        type: number
        source: input
        description: Protein grams per 100 g of the component as served.
        constraints: ">= 0"
      - name: sodium_mg_per_100g
        type: number
        source: input
        description: Sodium mg per 100 g of the component as served.
        constraints: ">= 0"
      - name: portion_grams
        type: number
        source: input
        description: Served portion weight in grams.
        constraints: "> 0"
      - name: raw_cost_cents
        type: integer
        source: input
        description: Raw-food cost in cents of one served portion.
        constraints: ">= 0"
      - name: therapeutic_safe
        type: boolean
        source: input
        description: Whether the component may be served on therapeutic medical diet trays.
        default: true
      - name: religious_tags
        type: array
        source: input
        description: Religious diet codes this component satisfies, drawn from the DietOrder.diet_code enum.
        default: []

  - name: Inmate
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; institution of custody."
      - name: booking_number
        type: string
        source: input
        description: Booking identifier; unique per facility.
        constraints: "unique per (facility_id, booking_number)"
      - name: housing_unit
        type: enum
        source: input
        description: Feeding location class; drives which forecast bucket the inmate lands in.
        constraints: "GENERAL | SEGREGATION | SATELLITE | MEDICAL"
      - name: religious_affiliation
        type: string
        source: input
        description: Declared religious affiliation; empty string means none declared.
        default: ""
      - name: status
        type: enum
        source: system
        description: Custody status; only IN_CUSTODY inmates enter roster forecasts.
        default: IN_CUSTODY
        constraints: "IN_CUSTODY | RELEASED | TRANSFERRED"
      - name: active_diet_order_count
        type: integer
        source: computed
        description: Count of DietOrder rows for this inmate with status == ACTIVE; the supersede invariant pins this at most 1.
        default: 0

  - name: DietOrder
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the inmate the diet is ordered for."
      - name: order_type
        type: enum
        source: input
        description: Whether the order is a religious accommodation or a clinical therapeutic diet.
        constraints: "RELIGIOUS | MEDICAL"
      - name: diet_code
        type: enum
        source: input
        description: Specific diet; must belong to the family implied by order_type.
        constraints: "KOSHER | HALAL | VEGETARIAN_RELIGIOUS | RENAL | DIABETIC_2000 | GLUTEN_FREE | MECHANICAL_SOFT"
      - name: status
        type: enum
        source: system
        description: Diet order lifecycle state.
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | ACTIVE | SUSPENDED | EXPIRED | REVOKED"
      - name: clinical_indication
        type: string
        source: input
        description: Clinical justification; required when order_type == MEDICAL, must be omitted or empty when RELIGIOUS.
        default: null
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the diet's effective window.
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the diet's effective window; must be strictly after effective_from.
      - name: supersedes_diet_order_id
        type: string
        source: input
        description: "FK -> DietOrder.id; the incumbent order this one replaces on verification. Null for a first order."
        default: null
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegisteredDietitian who created the order.
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the verifier who attested the order; cleared on reverification request.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent successful verification.
        default: null
      - name: verification_expires_at
        type: datetime
        source: computed
        description: verified_at plus the per-order_type validity window; null while unverified.
        default: null
      - name: reverification_count
        type: integer
        source: system
        description: Number of times this order has re-entered PENDING_VERIFICATION from SUSPENDED.
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: Free-text reason captured when the order was suspended.
        default: null

  - name: PopulationCount
    parent: Facility
    common_fields: false
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; facility the count was taken at."
      - name: general_population
        type: integer
        source: input
        description: Heads counted in general population housing.
        constraints: ">= 0"
      - name: segregation_population
        type: integer
        source: input
        description: Heads counted in segregation housing; every head is served a mandatory tray.
        constraints: ">= 0"
      - name: satellite_population
        type: integer
        source: input
        description: Heads counted at satellite feeding sites.
        constraints: ">= 0"
      - name: medical_population
        type: integer
        source: input
        description: Heads counted in medical housing; every head is served a tray.
        constraints: ">= 0"
      - name: source
        type: enum
        source: input
        description: Whether the count came from a formal standing count or an emergency count.
        constraints: "FORMAL_COUNT | EMERGENCY_COUNT"
      - name: total_population
        type: integer
        source: computed
        description: general_population + segregation_population + satellite_population + medical_population.
      - name: count_at
        type: datetime
        source: system
        description: Logical-clock instant the count was submitted; drives forecast staleness.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the CorrectionalOfficer who submitted the count.

  - name: MealForecast
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; facility being forecast."
      - name: population_count_id
        type: string
        source: input
        description: "FK -> PopulationCount.id; the count feed this forecast is provenance-linked to."
      - name: service_date
        type: string
        source: input
        description: Service date in YYYY-MM-DD form.
        constraints: "ISO 8601 calendar date"
      - name: meal_slot
        type: enum
        source: input
        description: Meal slot being forecast.
        constraints: "BREAKFAST | LUNCH | DINNER"
      - name: forecast_variant
        type: enum
        source: input
        description: Which forecasting algorithm produced the tray numbers.
        constraints: "COUNT_DRIVEN | ROSTER_DRIVEN"
      - name: status
        type: enum
        source: system
        description: Forecast lifecycle state.
        default: DRAFT
        constraints: "DRAFT | LOCKED | SUPERSEDED"
      - name: line_trays
        type: integer
        source: computed
        description: Serving-line tray demand before the waste allowance; see calculations.meal_forecast_trays.
      - name: waste_allowance_trays
        type: integer
        source: computed
        description: Tiered waste allowance added on top of line_trays.
      - name: total_forecast_trays
        type: integer
        source: computed
        description: line_trays + waste_allowance_trays.
      - name: forecast_special_diet_trays
        type: integer
        source: computed
        description: Count of ACTIVE DietOrder rows for IN_CUSTODY inmates at the facility at forecast time.
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant the forecast was locked.
        default: null

  - name: ProductionBatch
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; kitchen running the batch."
      - name: meal_forecast_id
        type: string
        source: input
        description: "FK -> MealForecast.id; the locked forecast this batch is produced against."
      - name: recipe_component
        type: string
        source: input
        description: Component being produced in cook-chill.
      - name: planned_trays
        type: integer
        source: input
        description: Trays planned for this batch.
        constraints: "> 0"
      - name: produced_trays
        type: integer
        source: system
        description: Trays actually produced, captured when the batch reaches COOKED.
        default: 0
      - name: scheduled_cook_start_at
        type: datetime
        source: input
        description: Scheduled start of the cook step; anchors the blast-chiller occupancy interval.
      - name: chill_deadline_at
        type: datetime
        source: computed
        description: scheduled_cook_start_at + COOK_CHILL_TOTAL_MINUTES; the close of the occupancy interval.
      - name: buffered_release_at
        type: datetime
        source: computed
        description: chill_deadline_at + SANITATION_BUFFER_MINUTES; the close of the buffered occupancy interval used for conflict detection.
      - name: service_site
        type: enum
        source: input
        description: Where the batch will be served; satellite and segregation sites require transport and reheat logs.
        constraints: "MAIN_KITCHEN | SATELLITE_A | SEGREGATION_UNIT"
      - name: production_stage
        type: enum
        source: system
        description: Production axis of the batch's parallel state machine.
        default: PLANNED
        constraints: "PLANNED | COOKED | CHILLED | STAGED | SERVED | DISCARDED"
      - name: qa_status
        type: enum
        source: system
        description: Quality-assurance axis of the batch's parallel state machine; evolves independently of production_stage.
        default: QA_PENDING
        constraints: "QA_PENDING | QA_PASSED | QA_HELD | QA_CONDEMNED"
      - name: cook_end_at
        type: datetime
        source: system
        description: logged_at of the COOK_END temperature log.
        default: null
      - name: chill_final_at
        type: datetime
        source: system
        description: logged_at of the CHILL_FINAL temperature log.
        default: null
      - name: chill_minutes
        type: integer
        source: computed
        description: Whole minutes from cook_end_at to chill_final_at; null until both exist.
        default: null
      - name: cook_chill_compliant
        type: boolean
        source: computed
        description: Whether every cook-chill temperature and time gate was met; see calculations.cook_chill_compliance.
        default: false
      - name: qa_reason
        type: string
        source: system
        description: Reason recorded with the most recent qa_status change.
        default: null

  - name: TemperatureLog
    parent: ProductionBatch
    common_fields: false
    fields:
      - name: production_batch_id
        type: string
        source: input
        description: "FK -> ProductionBatch.id; batch the reading belongs to."
      - name: log_point
        type: enum
        source: input
        description: Which HACCP control point the reading was taken at.
        constraints: "COOK_END | CHILL_INTERMEDIATE | CHILL_FINAL | TRANSPORT_DEPART | TRANSPORT_ARRIVE | REHEAT_SERVE"
      - name: temperature_f
        type: number
        source: input
        description: Reading in degrees Fahrenheit, 1 decimal place.
        constraints: ">= -40.0 and <= 500.0"
      - name: site
        type: enum
        source: input
        description: Where the reading was taken.
        constraints: "MAIN_KITCHEN | SATELLITE_A | SEGREGATION_UNIT"
      - name: logged_at
        type: datetime
        source: system
        description: Logical-clock instant the reading was posted; never client-supplied.
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the FoodServiceSupervisor who posted the reading.
      - name: minutes_since_cook_end
        type: integer
        source: computed
        description: Whole minutes from the batch's cook_end_at to logged_at; null for the COOK_END reading itself.
      - name: in_range
        type: boolean
        source: computed
        description: Whether this reading satisfied both the temperature gate and the elapsed-time gate for its log_point.

  - name: InmateWorker
    parent: Facility
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the inmate holding the kitchen detail."
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; kitchen the detail is at; must equal the inmate's facility_id."
      - name: clearance_status
        type: enum
        source: system
        description: Security clearance for kitchen work.
        default: CLEARED
        constraints: "CLEARED | SUSPENDED | BARRED"
      - name: assignment_status
        type: enum
        source: system
        description: Whether the worker currently holds a work area.
        default: UNASSIGNED
        constraints: "UNASSIGNED | ASSIGNED"
      - name: work_area
        type: enum
        source: system
        description: Assigned kitchen area; null while UNASSIGNED.
        default: null
        constraints: "BAKERY | COOK_CHILL | SERVING_LINE | SANITATION | null"
      - name: medical_clearance_expires_at
        type: datetime
        source: input
        description: Instant the food-handler medical clearance lapses.
      - name: sharps_eligible
        type: boolean
        source: input
        description: Whether this worker may be issued a sharp tool class.
        default: false
      - name: contraband_strike_count
        type: integer
        source: computed
        description: Count of ContrabandIncident rows with inmate_worker_id == this worker and status == SANCTIONED.
        default: 0

  - name: ToolIssuance
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; kitchen whose shadow board the tool hangs on."
      - name: issued_to_worker_id
        type: string
        source: input
        description: "FK -> InmateWorker.id; worker the tool is signed out to."
      - name: tool_class
        type: enum
        source: input
        description: Accountability class of the tool; the first three are sharps.
        constraints: "SHARP_KNIFE | MEAT_SAW | SCISSORS | NON_SHARP"
      - name: tool_serial
        type: string
        source: input
        description: Etched serial number; unique among ToolIssuance rows at the facility whose status is ISSUED or UNACCOUNTED.
      - name: shadow_board_slot
        type: integer
        source: input
        description: Shadow board slot the tool belongs to; unique among ToolIssuance rows at the facility whose status is ISSUED or UNACCOUNTED.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Tool accountability state.
        default: ISSUED
        constraints: "ISSUED | UNACCOUNTED | RETURNED"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the FoodServiceSupervisor who signed the tool out.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: returned_at
        type: datetime
        source: system
        description: Logical-clock instant the tool was certified back onto the board.
        default: null
      - name: return_certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the CorrectionalOfficer who certified the return count.
        default: null
      - name: unaccounted_at
        type: datetime
        source: system
        description: Logical-clock instant the tool was declared unaccounted.
        default: null
      - name: recovered
        type: boolean
        source: system
        description: True when the tool reached RETURNED from UNACCOUNTED rather than directly from ISSUED.
        default: false

  - name: ContrabandIncident
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; kitchen where the item was found."
      - name: inmate_worker_id
        type: string
        source: input
        description: "FK -> InmateWorker.id; worker implicated; null when the item is unattributed."
        default: null
      - name: related_tool_issuance_id
        type: string
        source: input
        description: "FK -> ToolIssuance.id; the issuance this incident was auto-raised from; null for officer-reported incidents."
        default: null
      - name: item_class
        type: enum
        source: input
        description: Class of contraband found.
        constraints: "SHARP | YEAST_ALCOHOL | FOOD_DIVERSION | COMMISSARY_ITEM"
      - name: severity
        type: enum
        source: input
        description: Severity assessment.
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: narrative
        type: string
        source: input
        description: Officer narrative of the find.
      - name: status
        type: enum
        source: system
        description: Incident disposition state.
        default: OPEN
        constraints: "OPEN | SANCTIONED | CLEARED"
      - name: sanction_type
        type: enum
        source: system
        description: Sanction imposed at disposition; null while OPEN or when CLEARED.
        default: null
        constraints: "WARNING | WORK_SUSPENSION | WORK_BAR | REFERRAL | null"
      - name: discovered_by_user_id
        type: string
        source: system
        description: X-User-ID of the reporter; the literal "system" for cascade-raised incidents.
      - name: discovered_at
        type: datetime
        source: system
        description: Logical-clock instant of discovery.
      - name: disposition_by_user_id
        type: string
        source: system
        description: X-User-ID of the CorrectionalOfficer who dispositioned the incident.
        default: null

  - name: MealServiceRecord
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; facility that served the meal."
      - name: meal_forecast_id
        type: string
        source: input
        description: "FK -> MealForecast.id; the locked forecast this service is measured against."
      - name: service_date
        type: string
        source: input
        description: Service date in YYYY-MM-DD form; must equal the forecast's service_date.
      - name: meal_slot
        type: enum
        source: input
        description: Meal slot served; must equal the forecast's meal_slot.
        constraints: "BREAKFAST | LUNCH | DINNER"
      - name: trays_served_general
        type: integer
        source: input
        description: Trays actually served on the general population line.
        constraints: ">= 0"
      - name: trays_served_segregation
        type: integer
        source: input
        description: Trays actually delivered to segregation.
        constraints: ">= 0"
      - name: trays_served_satellite
        type: integer
        source: input
        description: Trays actually delivered to satellite sites.
        constraints: ">= 0"
      - name: special_diet_trays_served
        type: integer
        source: input
        description: Pre-plated religious and therapeutic trays actually served.
        constraints: ">= 0"
      - name: expected_service_trays
        type: integer
        source: computed
        description: MealForecast.total_forecast_trays minus MealForecast.waste_allowance_trays at record creation.
      - name: total_trays_served
        type: integer
        source: computed
        description: trays_served_general + trays_served_segregation + trays_served_satellite.
      - name: missed_meal_count
        type: integer
        source: computed
        description: Weighted missed-meal units for this service; see calculations.meal_service_missed_meals.
        default: 0
      - name: substitution_count
        type: integer
        source: computed
        description: Count of MenuSubstitution rows with meal_service_record_id == this record and approval_status == APPROVED.
        default: 0
      - name: dispute_tray_count
        type: integer
        source: system
        description: Refeed trays attested by a grievance response that disputed this record.
        default: 0
      - name: status
        type: enum
        source: system
        description: Service record lifecycle state.
        default: OPEN
        constraints: "OPEN | CLOSED | DISPUTED"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the record was closed.
        default: null

  - name: MenuSubstitution
    parent: MenuCycleItem
    common_fields: true
    fields:
      - name: menu_cycle_item_id
        type: string
        source: input
        description: "FK -> MenuCycleItem.id; the planned component that was not served."
      - name: meal_service_record_id
        type: string
        source: input
        description: "FK -> MealServiceRecord.id; the service the substitution was documented against."
      - name: substitute_component_name
        type: string
        source: input
        description: Component actually served in place of the planned one.
      - name: substitute_kcal_per_100g
        type: number
        source: input
        description: Energy density of the substitute per 100 g.
        constraints: "> 0"
      - name: substitute_protein_grams_per_100g
        type: number
        source: input
        description: Protein grams of the substitute per 100 g.
        constraints: ">= 0"
      - name: substitute_sodium_mg_per_100g
        type: number
        source: input
        description: Sodium mg of the substitute per 100 g.
        constraints: ">= 0"
      - name: substitute_portion_grams
        type: number
        source: input
        description: Served portion weight of the substitute in grams.
        constraints: "> 0"
      - name: substitute_cost_cents
        type: integer
        source: input
        description: Raw-food cost in cents of one substitute portion.
        constraints: ">= 0"
      - name: reason
        type: enum
        source: input
        description: Documented reason for the substitution.
        constraints: "SUPPLY_OUTAGE | EQUIPMENT_FAILURE | SECURITY_LOCKDOWN | QA_CONDEMNATION"
      - name: kcal_delta_pct
        type: number
        source: computed
        description: Percent change in served kcal versus the planned component, 2 decimal places.
      - name: protein_delta_pct
        type: number
        source: computed
        description: Percent change in served protein grams versus the planned component, 2 decimal places.
      - name: sodium_delta_mg
        type: number
        source: computed
        description: Absolute change in served sodium mg versus the planned component, 2 decimal places.
      - name: cost_variance_cents
        type: integer
        source: computed
        description: substitute_cost_cents minus MenuCycleItem.raw_cost_cents.
      - name: nutrition_equivalent
        type: boolean
        source: computed
        description: Whether all three nutrition deltas fall inside the equivalence band; see calculations.substitution_nutrition_equivalence.
      - name: approval_status
        type: enum
        source: system
        description: Dietitian decision state.
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED"
      - name: documented_by_user_id
        type: string
        source: system
        description: X-User-ID of the FoodServiceSupervisor who documented the substitution.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegisteredDietitian who approved or rejected it.
        default: null

  - name: Grievance
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the grievant."
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; facility the grievance is against; must equal the inmate's facility_id."
      - name: category
        type: enum
        source: input
        description: Grievance category; the first two carry an expedited response window.
        constraints: "RELIGIOUS_DIET_DENIAL | DIET_NOT_HONORED | PORTION_SIZE | FOOD_TEMPERATURE | FOREIGN_OBJECT"
      - name: narrative
        type: string
        source: input
        description: Grievant's statement.
      - name: diet_order_id
        type: string
        source: input
        description: FK -> DietOrder.id; the diet order the grievance disputes; null when the grievance names no diet order.
        default: null
      - name: meal_service_record_id
        type: string
        source: input
        description: FK -> MealServiceRecord.id; the service record the grievance disputes; null when the grievance names no service.
        default: null
      - name: refeed_tray_count
        type: integer
        source: system
        description: Trays ordered re-served by a MEAL_REFEED remedy; stays 0 for every other remedy.
        default: 0
      - name: responded_by_user_id
        type: string
        source: system
        description: X-User-ID of the GrievanceCoordinator who issued the response.
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant the grievance was filed.
      - name: response_due_at
        type: datetime
        source: computed
        description: filed_at plus the category's response window; see calculations.grievance_response_sla.
      - name: status
        type: enum
        source: system
        description: Grievance lifecycle state across the fork-join.
        default: FILED
        constraints: "FILED | UNDER_INVESTIGATION | DIET_REVIEW | DUAL_TRACK | READY_FOR_RESPONSE | RESPONDED | ESCALATED | CLOSED"
      - name: routed_branch
        type: enum
        source: system
        description: Which branches the coordinator forked the grievance into.
        default: null
        constraints: "INVESTIGATION | DIET_REVIEW | BOTH | null"
      - name: investigation_complete
        type: boolean
        source: system
        description: Whether the security investigation branch has been completed.
        default: false
      - name: diet_review_complete
        type: boolean
        source: system
        description: Whether the clinical diet review branch has been completed.
        default: false
      - name: diet_remedy_required
        type: boolean
        source: system
        description: Set true when the diet review branch closed with a finding against the kitchen.
        default: false
      - name: remedy
        type: enum
        source: system
        description: Remedy granted in the response.
        default: null
        constraints: "NO_ACTION | MENU_CORRECTION | MEAL_REFEED | DIET_REINSTATEMENT | null"
      - name: response_at
        type: datetime
        source: system
        description: Logical-clock instant the response was issued.
        default: null
      - name: sla_breached
        type: boolean
        source: computed
        description: Whether response_at fell strictly after response_due_at.
        default: false

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cfs/service-contracts/{id}/activate"
        actor: ContractAdministrator
        preconditions:
          - "ServiceContract.status == DRAFT"
          - "count(Facility where contract_id == this contract) >= 1"
        side_effects:
          - "ServiceContract.status := ACTIVE; version incremented by 1; updated_at refreshed"
        note: "A contract cannot go ACTIVE before at least one facility is attached to it."
      - from: ACTIVE
        to: RECONCILING
        trigger: "POST /cfs/service-contracts/{id}/reconcile"
        actor: ContractAdministrator
        preconditions:
          - "ServiceContract.status == ACTIVE"
          - "count(MealServiceRecord where facility_id in facilities(contract) and status == OPEN) == 0"
          - "count(MealServiceRecord where facility_id in facilities(contract) and status in {CLOSED, DISPUTED}) >= 1"
        side_effects:
          - "ServiceContract.ld_variant set from the request body"
          - "recompute calculations.contract_liquidated_damages steps 1-9 in the pinned order, overwriting total_trays_served, meal_days_served, missed_meal_total, substitution_rate_pct, grievance_sla_breach_count, raw_liquidated_damages_cents, substitution_surcharge_cents, liquidated_damages_cents, gross_food_cost_cents, cost_cents_per_meal_day_actual, cost_recovery_credit_cents, net_liquidated_damages_cents, performance_score"
          - "ServiceContract.reconciled_at := logical clock now"
          - "ServiceContract.version incremented by 1"
        note: "Full recompute from MealServiceRecord source rows; the incrementally maintained missed_meal_total is overwritten, not added to."
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /cfs/service-contracts/{id}/close"
        actor: ContractAdministrator
        preconditions:
          - "ServiceContract.status == RECONCILING"
          - "count(MenuSubstitution where meal_service_record_id in records(contract) and approval_status == PENDING) == 0"
        side_effects:
          - "ServiceContract.status := CLOSED; closed_at := logical clock now; version incremented by 1"
          - "CASCADE hop 1 - because the contract reached CLOSED, every Facility with contract_id == this contract has corrective_action_required := (ServiceContract.performance_score < CORRECTIVE_ACTION_SCORE_FLOOR)"
          - "CASCADE hop 2 - because corrective_action_required flipped to true on those facilities, calculations.facility_kitchen_posture is re-evaluated and each such Facility with kitchen_posture == OPEN becomes RESTRICTED"
      - from: RECONCILING
        to: ACTIVE
        trigger: "system event: POST /cfs/menu-substitutions/{id}/decision resolves a substitution while the contract is RECONCILING"
        actor: system
        preconditions:
          - "ServiceContract.status == RECONCILING"
          - "the decided MenuSubstitution's meal_service_record_id belongs to a facility with contract_id == this contract"
        side_effects:
          - "ServiceContract.status := ACTIVE (the reconciliation is invalidated because the substitution population changed)"
          - "ServiceContract.ld_variant := null; reconciled_at := null"
          - "raw_liquidated_damages_cents, substitution_surcharge_cents, liquidated_damages_cents, cost_recovery_credit_cents, net_liquidated_damages_cents, gross_food_cost_cents := 0; cost_cents_per_meal_day_actual, substitution_rate_pct, performance_score := 0.00"
          - "ServiceContract.version incremented by 1"
        note: "This is the cycle in the contract machine: ACTIVE -> RECONCILING -> ACTIVE. total_trays_served, meal_days_served, missed_meal_total and grievance_sla_breach_count are NOT zeroed - they are incrementally maintained ledgers, not reconciliation outputs."

  - entity: MenuCycle
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: NUTRITION_APPROVED
        trigger: "POST /cfs/menu-cycles/{id}/nutrition-sign"
        actor: RegisteredDietitian
        preconditions:
          - "MenuCycle.status == DRAFT"
          - "MenuCycle.item_count == MenuCycle.cycle_length_days * MEAL_SLOTS_PER_DAY"
          - "calculations.menu_cycle_nutrition_adequacy yields approved_kcal_per_meal_day >= contract.contracted_kcal_per_meal_day"
          - "calculations.menu_cycle_nutrition_adequacy yields approved_protein_grams_per_meal_day >= contract.contracted_protein_grams_per_meal_day"
          - "calculations.menu_cycle_nutrition_adequacy yields approved_sodium_mg_per_meal_day <= contract.contracted_sodium_mg_cap_per_meal_day"
        side_effects:
          - "MenuCycle.approved_kcal_per_meal_day, approved_protein_grams_per_meal_day, approved_sodium_mg_per_meal_day set from calculations.menu_cycle_nutrition_adequacy"
          - "MenuCycle.approved_cost_cents_per_meal_day set from calculations.menu_cycle_cost_per_meal_day"
          - "MenuCycle.nutrition_signed_by_user_id := X-User-ID of the caller"
          - "MenuCycle.version incremented by 1"
      - from: NUTRITION_APPROVED
        to: DRAFT
        trigger: "system event: POST /cfs/menu-cycles/{id}/items adds an item to an already signed cycle"
        actor: system
        preconditions:
          - "MenuCycle.status == NUTRITION_APPROVED"
        side_effects:
          - "MenuCycle.approved_kcal_per_meal_day, approved_protein_grams_per_meal_day, approved_sodium_mg_per_meal_day, approved_cost_cents_per_meal_day := null"
          - "MenuCycle.nutrition_signed_by_user_id := null"
          - "MenuCycle.item_count incremented by 1; version incremented by 1"
        note: "Changing the menu content revokes the dietitian's signature; the cycle must be re-signed before it can be activated."
      - from: NUTRITION_APPROVED
        to: ACTIVE
        trigger: "POST /cfs/menu-cycles/{id}/activate"
        actor: ContractAdministrator
        preconditions:
          - "MenuCycle.status == NUTRITION_APPROVED"
          - "ServiceContract.status == ACTIVE for the contract of MenuCycle.facility_id"
          - "X-User-ID != MenuCycle.nutrition_signed_by_user_id"
          - "MenuCycle.approved_cost_cents_per_meal_day <= contract.cost_ceiling_cents_per_meal_day"
        side_effects:
          - "MenuCycle.status := ACTIVE; activated_by_user_id := X-User-ID; activated_at := logical clock now; version incremented by 1"
          - "CASCADE hop 1 - because this cycle became ACTIVE, the other MenuCycle at the same facility whose status was ACTIVE transitions to RETIRED (at most one, guaranteed by this same rule)"
      - from: ACTIVE
        to: RETIRED
        trigger: "system event: another MenuCycle at the same facility is activated"
        actor: system
        preconditions:
          - "MenuCycle.status == ACTIVE"
        side_effects:
          - "MenuCycle.version incremented by 1"

  - entity: DietOrder
    initial_state: PENDING_VERIFICATION
    terminal_states: [EXPIRED, REVOKED]
    shape: cyclic
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /cfs/diet-orders/{id}/verify"
        actor: ChaplainDesignee | MedicalProvider
        preconditions:
          - "DietOrder.status == PENDING_VERIFICATION"
          - "Inmate.status == IN_CUSTODY for DietOrder.inmate_id"
          - "X-User-Role == ChaplainDesignee when order_type == RELIGIOUS, X-User-Role == MedicalProvider when order_type == MEDICAL"
          - "X-User-ID != DietOrder.requested_by_user_id"
          - "logical clock now < DietOrder.effective_to"
        side_effects:
          - "DietOrder.status := ACTIVE; verified_by_user_id := X-User-ID; verified_at := logical clock now"
          - "DietOrder.verification_expires_at := verified_at + DIET_VALIDITY_DAYS_RELIGIOUS days when order_type == RELIGIOUS, + DIET_VALIDITY_DAYS_MEDICAL days when order_type == MEDICAL"
          - "Inmate.active_diet_order_count incremented by 1; Facility.active_special_diet_count incremented by 1"
          - "CASCADE hop 1 - when supersedes_diet_order_id is non-null, that incumbent DietOrder transitions ACTIVE -> REVOKED"
          - "CASCADE hop 2 - because the incumbent left ACTIVE, Inmate.active_diet_order_count is decremented by 1 and Facility.active_special_diet_count is decremented by 1, leaving both counters at their pre-verification value (see calculations.special_diet_census_invariant)"
          - "DietOrder.version incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cfs/diet-orders/{id}/suspend"
        actor: FoodServiceSupervisor | CorrectionalOfficer
        preconditions:
          - "DietOrder.status == ACTIVE"
        side_effects:
          - "DietOrder.status := SUSPENDED; suspension_reason := request.suspension_reason; version incremented by 1"
          - "Inmate.active_diet_order_count decremented by 1; Facility.active_special_diet_count decremented by 1"
      - from: SUSPENDED
        to: PENDING_VERIFICATION
        trigger: "POST /cfs/diet-orders/{id}/request-reverification"
        actor: RegisteredDietitian
        preconditions:
          - "DietOrder.status == SUSPENDED"
          - "DietOrder.reverification_count < MAX_REVERIFICATIONS"
        side_effects:
          - "DietOrder.status := PENDING_VERIFICATION; reverification_count incremented by 1"
          - "DietOrder.verified_by_user_id := null; verified_at := null; verification_expires_at := null; suspension_reason := null"
          - "DietOrder.requested_by_user_id := X-User-ID of the caller (the reverification requester becomes the new requester for segregation-of-duties purposes)"
          - "DietOrder.version incremented by 1"
        note: "This edge closes the cycle PENDING_VERIFICATION -> ACTIVE -> SUSPENDED -> PENDING_VERIFICATION, bounded by MAX_REVERIFICATIONS."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /cfs/meal-forecasts sweeps expired verifications before counting special diets"
        actor: system
        preconditions:
          - "DietOrder.status == ACTIVE"
          - "DietOrder.verification_expires_at <= logical clock now"
        side_effects:
          - "DietOrder.status := EXPIRED; version incremented by 1"
          - "Inmate.active_diet_order_count decremented by 1; Facility.active_special_diet_count decremented by 1"
        note: "The sweep runs over the forecast's facility only, and runs BEFORE forecast_special_diet_trays is counted."
      - from: PENDING_VERIFICATION
        to: REVOKED
        trigger: "POST /cfs/diet-orders/{id}/revoke"
        actor: RegisteredDietitian
        preconditions:
          - "DietOrder.status == PENDING_VERIFICATION"
        side_effects:
          - "DietOrder.status := REVOKED; suspension_reason := request.revocation_reason; version incremented by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /cfs/diet-orders/{id}/revoke"
        actor: RegisteredDietitian
        preconditions:
          - "DietOrder.status == ACTIVE"
        side_effects:
          - "DietOrder.status := REVOKED; suspension_reason := request.revocation_reason; version incremented by 1"
          - "Inmate.active_diet_order_count decremented by 1; Facility.active_special_diet_count decremented by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /cfs/diet-orders/{id}/revoke"
        actor: RegisteredDietitian
        preconditions:
          - "DietOrder.status == SUSPENDED"
        side_effects:
          - "DietOrder.status := REVOKED; suspension_reason := request.revocation_reason; version incremented by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system event: POST /cfs/inmates/{id}/movement sets Inmate.status to RELEASED or TRANSFERRED"
        actor: system
        preconditions:
          - "DietOrder.status in {PENDING_VERIFICATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "DietOrder.status := REVOKED; version incremented by 1"
          - "Inmate.active_diet_order_count decremented by 1 and Facility.active_special_diet_count decremented by 1 for orders that were ACTIVE"

  - entity: MealForecast
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /cfs/meal-forecasts/{id}/lock"
        actor: FoodServiceSupervisor
        preconditions:
          - "MealForecast.status == DRAFT"
          - "exists MenuCycle with facility_id == MealForecast.facility_id and status == ACTIVE"
        side_effects:
          - "MealForecast.status := LOCKED; locked_at := logical clock now; version incremented by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /cfs/inmates/{id}/movement changes a roster fact at the facility"
        actor: system
        preconditions:
          - "MealForecast.status == DRAFT"
          - "MealForecast.forecast_variant == ROSTER_DRIVEN"
          - "MealForecast.facility_id == the moved inmate's facility_id"
        side_effects:
          - "MealForecast.status := SUPERSEDED; version incremented by 1"
        note: "COUNT_DRIVEN drafts are provenance-locked to a PopulationCount and are NOT superseded by roster movement."

  - entity: ProductionBatch
    dimension: production_stage
    initial_state: PLANNED
    terminal_states: [SERVED, DISCARDED]
    shape: parallel
    transitions:
      - from: PLANNED
        to: COOKED
        trigger: "POST /cfs/production-batches/{id}/advance-stage with to_stage == COOKED"
        actor: FoodServiceSupervisor
        preconditions:
          - "ProductionBatch.production_stage == PLANNED"
          - "ProductionBatch.qa_status != QA_CONDEMNED"
          - "exists TemperatureLog for this batch with log_point == COOK_END and in_range == true"
          - "request.produced_trays is present and > 0"
        side_effects:
          - "ProductionBatch.produced_trays := request.produced_trays; production_stage := COOKED; version incremented by 1"
      - from: COOKED
        to: CHILLED
        trigger: "POST /cfs/production-batches/{id}/advance-stage with to_stage == CHILLED"
        actor: FoodServiceSupervisor
        preconditions:
          - "ProductionBatch.production_stage == COOKED"
          - "ProductionBatch.qa_status != QA_CONDEMNED"
          - "exists TemperatureLog for this batch with log_point == CHILL_FINAL"
        side_effects:
          - "ProductionBatch.production_stage := CHILLED; version incremented by 1"
          - "ProductionBatch.cook_chill_compliant recomputed via calculations.cook_chill_compliance"
      - from: CHILLED
        to: STAGED
        trigger: "POST /cfs/production-batches/{id}/advance-stage with to_stage == STAGED"
        actor: FoodServiceSupervisor
        preconditions:
          - "ProductionBatch.production_stage == CHILLED"
          - "ProductionBatch.qa_status == QA_PASSED"
        side_effects:
          - "ProductionBatch.production_stage := STAGED; version incremented by 1"
        note: "Cross-dimension guard: the production axis cannot pass STAGED until the QA axis has reached QA_PASSED."
      - from: STAGED
        to: SERVED
        trigger: "POST /cfs/production-batches/{id}/advance-stage with to_stage == SERVED"
        actor: FoodServiceSupervisor
        preconditions:
          - "ProductionBatch.production_stage == STAGED"
          - "ProductionBatch.qa_status == QA_PASSED"
          - "when ProductionBatch.service_site != MAIN_KITCHEN: exists TemperatureLog for this batch with log_point == REHEAT_SERVE and in_range == true"
        side_effects:
          - "ProductionBatch.production_stage := SERVED; version incremented by 1"
      - from: PLANNED
        to: DISCARDED
        trigger: "system event: a sharp tool at the facility is declared unaccounted (kitchen_posture becomes LOCKDOWN)"
        actor: system
        preconditions:
          - "ProductionBatch.production_stage in {PLANNED, COOKED, CHILLED}"
        side_effects:
          - "ProductionBatch.production_stage := DISCARDED; qa_status := QA_HELD when qa_status == QA_PENDING; version incremented by 1"
        note: "STAGED and SERVED batches are already out of the kitchen and are NOT discarded by the lockdown cascade - this is a conditional cascade."
      - from: CHILLED
        to: DISCARDED
        trigger: "system event: the batch's qa_status becomes QA_CONDEMNED"
        actor: system
        preconditions:
          - "ProductionBatch.production_stage != SERVED"
        side_effects:
          - "ProductionBatch.production_stage := DISCARDED; version incremented by 1"

  - entity: ProductionBatch
    dimension: qa_status
    initial_state: QA_PENDING
    terminal_states: [QA_CONDEMNED]
    shape: parallel
    transitions:
      - from: QA_PENDING
        to: QA_PASSED
        trigger: "POST /cfs/production-batches/{id}/qa-decision with qa_decision == QA_PASSED"
        actor: FoodServiceSupervisor | RegisteredDietitian
        preconditions:
          - "ProductionBatch.qa_status in {QA_PENDING, QA_HELD}"
          - "ProductionBatch.cook_chill_compliant == true"
        side_effects:
          - "ProductionBatch.qa_status := QA_PASSED; qa_reason := request.reason; version incremented by 1"
        note: "Independent of production_stage: a batch may be QA_PASSED while still COOKED."
      - from: QA_PENDING
        to: QA_HELD
        trigger: "POST /cfs/production-batches/{id}/qa-decision with qa_decision == QA_HELD"
        actor: FoodServiceSupervisor | RegisteredDietitian
        preconditions:
          - "ProductionBatch.qa_status in {QA_PENDING, QA_PASSED}"
        side_effects:
          - "ProductionBatch.qa_status := QA_HELD; qa_reason := request.reason; version incremented by 1"
      - from: QA_PENDING
        to: QA_HELD
        trigger: "system event: POST /cfs/production-batches/{id}/temperature-logs records a CHILL_INTERMEDIATE or CHILL_FINAL reading with in_range == false"
        actor: system
        preconditions:
          - "ProductionBatch.qa_status in {QA_PENDING, QA_PASSED}"
        side_effects:
          - "ProductionBatch.qa_status := QA_HELD; qa_reason := 'CHILL_GATE_FAILED'; version incremented by 1"
      - from: QA_HELD
        to: QA_CONDEMNED
        trigger: "POST /cfs/production-batches/{id}/qa-decision with qa_decision == QA_CONDEMNED"
        actor: FoodServiceSupervisor | RegisteredDietitian
        preconditions:
          - "ProductionBatch.qa_status in {QA_PENDING, QA_HELD, QA_PASSED}"
        side_effects:
          - "ProductionBatch.qa_status := QA_CONDEMNED; qa_reason := request.reason; version incremented by 1"
          - "CASCADE hop 1 - because qa_status reached QA_CONDEMNED, production_stage transitions to DISCARDED unless it is already SERVED"
      - from: QA_PASSED
        to: QA_CONDEMNED
        trigger: "system event: POST /cfs/production-batches/{id}/temperature-logs records a TRANSPORT_ARRIVE or REHEAT_SERVE reading with in_range == false"
        actor: system
        preconditions:
          - "ProductionBatch.qa_status != QA_CONDEMNED"
        side_effects:
          - "ProductionBatch.qa_status := QA_CONDEMNED; qa_reason := 'TRANSPORT_REHEAT_GATE_FAILED'; version incremented by 1"
          - "CASCADE hop 1 - because qa_status reached QA_CONDEMNED, production_stage transitions to DISCARDED unless it is already SERVED"

  - entity: ToolIssuance
    initial_state: ISSUED
    terminal_states: [RETURNED]
    shape: branching
    transitions:
      - from: ISSUED
        to: RETURNED
        trigger: "POST /cfs/tool-issuances/{id}/return"
        actor: CorrectionalOfficer
        preconditions:
          - "ToolIssuance.status == ISSUED"
          - "X-User-ID != ToolIssuance.issued_by_user_id"
          - "request.returned_count_verified == 1"
        side_effects:
          - "ToolIssuance.status := RETURNED; returned_at := logical clock now; return_certified_by_user_id := X-User-ID; version incremented by 1"
          - "Facility.sharps_issued_count recomputed (decreases by 1 for sharp classes); Facility.sharps_on_board_count recomputed (increases by 1)"
          - "Facility.kitchen_posture recomputed via calculations.facility_kitchen_posture; Facility.version incremented by 1"
      - from: ISSUED
        to: UNACCOUNTED
        trigger: "POST /cfs/tool-issuances/{id}/declare-unaccounted"
        actor: CorrectionalOfficer
        preconditions:
          - "ToolIssuance.status == ISSUED"
        side_effects:
          - "ToolIssuance.status := UNACCOUNTED; unaccounted_at := logical clock now; version incremented by 1"
          - "CASCADE hop 1 - because the tool left ISSUED for UNACCOUNTED, Facility.sharps_unaccounted_count increases by 1 for sharp classes (SHARP_KNIFE, MEAT_SAW, SCISSORS) and Facility.open_sharps_discrepancy_count increases by 1; for tool_class == NON_SHARP neither sharps counter moves"
          - "CASCADE hop 2 - because open_sharps_discrepancy_count became >= 1, calculations.facility_kitchen_posture sets Facility.kitchen_posture := LOCKDOWN for sharp classes; for NON_SHARP the posture becomes RESTRICTED instead (divergent side-effect set per branch)"
          - "CASCADE hop 3 - because kitchen_posture became LOCKDOWN, every ProductionBatch at that facility whose production_stage is in {PLANNED, COOKED, CHILLED} transitions to DISCARDED (and its qa_status to QA_HELD when it was QA_PENDING). This hop does NOT run for the RESTRICTED (NON_SHARP) branch."
          - "CASCADE hop 4 - because those batches became DISCARDED, every InmateWorker at that facility with assignment_status == ASSIGNED and work_area in {COOK_CHILL, SERVING_LINE} becomes assignment_status := UNASSIGNED with work_area := null"
          - "FAN-OUT (not part of the hop chain) - a ContrabandIncident is created with facility_id == this facility, related_tool_issuance_id == this issuance, inmate_worker_id == issued_to_worker_id, item_class := SHARP for sharp classes else FOOD_DIVERSION, severity := CRITICAL for sharp classes else MAJOR, status := OPEN, discovered_by_user_id := 'system'"
      - from: UNACCOUNTED
        to: RETURNED
        trigger: "POST /cfs/tool-issuances/{id}/return"
        actor: CorrectionalOfficer
        preconditions:
          - "ToolIssuance.status == UNACCOUNTED"
          - "X-User-ID != ToolIssuance.issued_by_user_id"
          - "request.returned_count_verified == 1"
        side_effects:
          - "ToolIssuance.status := RETURNED; recovered := true; returned_at := logical clock now; return_certified_by_user_id := X-User-ID; version incremented by 1"
          - "Facility.sharps_unaccounted_count decreases by 1 and open_sharps_discrepancy_count decreases by 1 for sharp classes; sharps_on_board_count increases by 1"
          - "Facility.kitchen_posture recomputed - it returns to OPEN only when open_sharps_discrepancy_count == 0 and no other RESTRICTED condition holds; Facility.version incremented by 1"
        note: "Compensating action for declare-unaccounted. It restores the sharps conservation identity but deliberately does NOT un-discard batches or re-assign workers - discarded food and cleared details are not recoverable."

  - entity: ContrabandIncident
    initial_state: OPEN
    terminal_states: [SANCTIONED, CLEARED]
    shape: branching
    transitions:
      - from: OPEN
        to: SANCTIONED
        trigger: "POST /cfs/contraband-incidents/{id}/disposition with disposition == SANCTIONED"
        actor: CorrectionalOfficer
        preconditions:
          - "ContrabandIncident.status == OPEN"
          - "request.sanction_type is present"
          - "ContrabandIncident.inmate_worker_id is non-null"
          - "X-User-ID != ContrabandIncident.discovered_by_user_id"
        side_effects:
          - "ContrabandIncident.status := SANCTIONED; sanction_type := request.sanction_type; disposition_by_user_id := X-User-ID; version incremented by 1"
          - "Facility.open_contraband_incident_count decreases by 1; kitchen_posture recomputed; Facility.version incremented by 1"
          - "CASCADE hop 1 - because the incident became SANCTIONED, InmateWorker.contraband_strike_count increases by 1"
          - "CASCADE hop 2 - because contraband_strike_count reached CONTRABAND_STRIKE_BAR_THRESHOLD or sanction_type == WORK_BAR, InmateWorker.clearance_status := BARRED; when sanction_type == WORK_SUSPENSION and the strike count is still below the threshold, clearance_status := SUSPENDED instead; in either case assignment_status := UNASSIGNED and work_area := null"
        note: "This cascade deliberately does NOT touch ToolIssuance rows - tools must be physically returned through POST /cfs/tool-issuances/{id}/return."
      - from: OPEN
        to: CLEARED
        trigger: "POST /cfs/contraband-incidents/{id}/disposition with disposition == CLEARED"
        actor: CorrectionalOfficer
        preconditions:
          - "ContrabandIncident.status == OPEN"
          - "X-User-ID != ContrabandIncident.discovered_by_user_id"
        side_effects:
          - "ContrabandIncident.status := CLEARED; sanction_type stays null; disposition_by_user_id := X-User-ID; version incremented by 1"
          - "Facility.open_contraband_incident_count decreases by 1; kitchen_posture recomputed (RESTRICTED returns to OPEN once the count falls below CONTRABAND_RESTRICT_THRESHOLD and no other condition holds); Facility.version incremented by 1"
          - "InmateWorker.contraband_strike_count is unchanged (divergent side-effect set versus the SANCTIONED branch)"

  - entity: InmateWorker
    dimension: assignment_status
    initial_state: UNASSIGNED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /cfs/inmate-workers/{id}/assign"
        actor: FoodServiceSupervisor
        preconditions:
          - "InmateWorker.assignment_status == UNASSIGNED"
          - "InmateWorker.clearance_status == CLEARED"
          - "InmateWorker.medical_clearance_expires_at > logical clock now"
          - "count(ContrabandIncident where inmate_worker_id == this worker and status == OPEN) == 0"
          - "Facility.kitchen_posture == OPEN"
        side_effects:
          - "InmateWorker.assignment_status := ASSIGNED; work_area := request.work_area; version incremented by 1"
      - from: ASSIGNED
        to: UNASSIGNED
        trigger: "system event: lockdown batch-discard cascade, contraband sanction, or inmate movement"
        actor: system
        preconditions:
          - "InmateWorker.assignment_status == ASSIGNED"
        side_effects:
          - "InmateWorker.assignment_status := UNASSIGNED; work_area := null; version incremented by 1"

  - entity: InmateWorker
    dimension: clearance_status
    initial_state: CLEARED
    terminal_states: [BARRED]
    shape: linear
    transitions:
      - from: CLEARED
        to: SUSPENDED
        trigger: "system event: contraband sanction with sanction_type == WORK_SUSPENSION below the bar threshold, or POST /cfs/inmates/{id}/movement into SEGREGATION"
        actor: system
        preconditions:
          - "InmateWorker.clearance_status == CLEARED"
        side_effects:
          - "InmateWorker.clearance_status := SUSPENDED; assignment_status := UNASSIGNED; work_area := null; version incremented by 1"
      - from: CLEARED
        to: BARRED
        trigger: "system event: contraband sanction with sanction_type == WORK_BAR or contraband_strike_count >= CONTRABAND_STRIKE_BAR_THRESHOLD"
        actor: system
        preconditions:
          - "InmateWorker.clearance_status in {CLEARED, SUSPENDED}"
        side_effects:
          - "InmateWorker.clearance_status := BARRED; assignment_status := UNASSIGNED; work_area := null; version incremented by 1"
      - from: SUSPENDED
        to: BARRED
        trigger: "system event: a second contraband sanction reaches CONTRABAND_STRIKE_BAR_THRESHOLD"
        actor: system
        preconditions:
          - "InmateWorker.clearance_status == SUSPENDED"
        side_effects:
          - "InmateWorker.clearance_status := BARRED; version incremented by 1"

  - entity: MealServiceRecord
    initial_state: OPEN
    terminal_states: [DISPUTED]
    shape: branching
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /cfs/meal-service-records/{id}/close"
        actor: FoodServiceSupervisor
        preconditions:
          - "MealServiceRecord.status == OPEN"
          - "count(ProductionBatch where meal_forecast_id == MealServiceRecord.meal_forecast_id and production_stage in {PLANNED, COOKED, CHILLED, STAGED}) == 0"
        side_effects:
          - "MealServiceRecord.missed_meal_count := calculations.meal_service_missed_meals; status := CLOSED; closed_at := logical clock now; version incremented by 1"
          - "CASCADE hop 1 - because the record closed, ServiceContract.total_trays_served increases by MealServiceRecord.total_trays_served, ServiceContract.meal_days_served recomputed and ServiceContract.missed_meal_total increases by missed_meal_count; ServiceContract.liquidated_damages_cents recomputed via calculations.contract_liquidated_damages; ServiceContract.performance_score recomputed; ServiceContract.version incremented by 1"
          - "CASCADE hop 2 - because ServiceContract.missed_meal_total reached MISSED_MEAL_ESCALATION_THRESHOLD, every Facility with contract_id == this contract gets corrective_action_required := true and Facility.version incremented by 1"
          - "CASCADE hop 3 - because corrective_action_required became true, every such Facility whose kitchen_posture == OPEN becomes kitchen_posture := RESTRICTED; facilities already RESTRICTED or LOCKDOWN keep their stricter posture (conditional cascade)"
      - from: CLOSED
        to: DISPUTED
        trigger: "system event: POST /cfs/grievances/{id}/respond with remedy == MEAL_REFEED naming this record"
        actor: system
        preconditions:
          - "MealServiceRecord.status == CLOSED"
        side_effects:
          - "MealServiceRecord.status := DISPUTED; dispute_tray_count := Grievance.refeed_tray_count; missed_meal_count increases by Grievance.refeed_tray_count; version incremented by 1"
          - "ServiceContract.missed_meal_total increases by Grievance.refeed_tray_count; liquidated_damages_cents and performance_score recomputed; ServiceContract.version incremented by 1"
        note: "A DISPUTED record is terminal: it can no longer be closed or re-disputed."

  - entity: MenuSubstitution
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    shape: branching
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /cfs/menu-substitutions/{id}/decision with decision == APPROVED"
        actor: RegisteredDietitian
        preconditions:
          - "MenuSubstitution.approval_status == PENDING"
          - "MenuSubstitution.nutrition_equivalent == true OR MenuSubstitution.reason == QA_CONDEMNATION"
          - "X-User-ID != MenuSubstitution.documented_by_user_id"
        side_effects:
          - "MenuSubstitution.approval_status := APPROVED; decided_by_user_id := X-User-ID; version incremented by 1"
          - "MealServiceRecord.substitution_count increases by 1 and MealServiceRecord.version incremented by 1"
          - "CASCADE hop 1 - because an approved substitution changes the served menu of record, ServiceContract.substitution_total increases by 1 and ServiceContract.version incremented by 1"
          - "CASCADE hop 2 - because substitution_total changed, a ServiceContract in status RECONCILING transitions back to ACTIVE (the cycle edge in the ServiceContract machine); a contract already ACTIVE stays ACTIVE"
      - from: PENDING
        to: REJECTED
        trigger: "POST /cfs/menu-substitutions/{id}/decision with decision == REJECTED"
        actor: RegisteredDietitian
        preconditions:
          - "MenuSubstitution.approval_status == PENDING"
          - "X-User-ID != MenuSubstitution.documented_by_user_id"
        side_effects:
          - "MenuSubstitution.approval_status := REJECTED; decided_by_user_id := X-User-ID; version incremented by 1"
          - "MealServiceRecord.substitution_count is unchanged and ServiceContract is untouched (divergent side-effect set versus the APPROVED branch)"

  - entity: Grievance
    initial_state: FILED
    terminal_states: [RESPONDED, ESCALATED, CLOSED]
    shape: branching
    transitions:
      - from: FILED
        to: UNDER_INVESTIGATION
        trigger: "POST /cfs/grievances/{id}/route with route == INVESTIGATION"
        actor: GrievanceCoordinator
        preconditions:
          - "Grievance.status == FILED"
        side_effects:
          - "Grievance.status := UNDER_INVESTIGATION; routed_branch := INVESTIGATION; version incremented by 1"
      - from: FILED
        to: DIET_REVIEW
        trigger: "POST /cfs/grievances/{id}/route with route == DIET_REVIEW"
        actor: GrievanceCoordinator
        preconditions:
          - "Grievance.status == FILED"
          - "Grievance.diet_order_id is non-null"
        side_effects:
          - "Grievance.status := DIET_REVIEW; routed_branch := DIET_REVIEW; version incremented by 1"
      - from: FILED
        to: DUAL_TRACK
        trigger: "POST /cfs/grievances/{id}/route with route == DUAL_TRACK"
        actor: GrievanceCoordinator
        preconditions:
          - "Grievance.status == FILED"
          - "Grievance.diet_order_id is non-null"
          - "Grievance.meal_service_record_id is non-null"
        side_effects:
          - "Grievance.status := DUAL_TRACK; routed_branch := BOTH; version incremented by 1"
        note: "FORK: DUAL_TRACK requires both branch flags before the join to READY_FOR_RESPONSE."
      - from: UNDER_INVESTIGATION
        to: READY_FOR_RESPONSE
        trigger: "POST /cfs/grievances/{id}/complete-branch with branch == INVESTIGATION"
        actor: GrievanceCoordinator
        preconditions:
          - "Grievance.status == UNDER_INVESTIGATION"
        side_effects:
          - "Grievance.investigation_complete := true; Grievance.status := READY_FOR_RESPONSE; version incremented by 1"
      - from: DIET_REVIEW
        to: READY_FOR_RESPONSE
        trigger: "POST /cfs/grievances/{id}/complete-branch with branch == DIET_REVIEW"
        actor: RegisteredDietitian
        preconditions:
          - "Grievance.status == DIET_REVIEW"
        side_effects:
          - "Grievance.diet_review_complete := true; Grievance.status := READY_FOR_RESPONSE; version incremented by 1"
          - "when request.finding == KITCHEN_AT_FAULT: Grievance.diet_remedy_required := true (divergent side effect - the INVESTIGATION branch never sets this flag)"
      - from: DUAL_TRACK
        to: DUAL_TRACK
        trigger: "POST /cfs/grievances/{id}/complete-branch when the other branch flag is still false"
        actor: GrievanceCoordinator | RegisteredDietitian
        preconditions:
          - "Grievance.status == DUAL_TRACK"
          - "the flag named by request.branch is false"
        side_effects:
          - "the flag named by request.branch (investigation_complete or diet_review_complete) := true; status stays DUAL_TRACK because the join is not satisfied; version incremented by 1"
          - "when request.branch == DIET_REVIEW and request.finding == KITCHEN_AT_FAULT: Grievance.diet_remedy_required := true"
      - from: DUAL_TRACK
        to: READY_FOR_RESPONSE
        trigger: "POST /cfs/grievances/{id}/complete-branch when it makes both branch flags true"
        actor: GrievanceCoordinator | RegisteredDietitian
        preconditions:
          - "Grievance.status == DUAL_TRACK"
          - "the flag named by request.branch is false and the other branch flag is already true"
        side_effects:
          - "the flag named by request.branch := true; JOIN satisfied so status := READY_FOR_RESPONSE; version incremented by 1"
      - from: READY_FOR_RESPONSE
        to: CLOSED
        trigger: "POST /cfs/grievances/{id}/respond with remedy == NO_ACTION on or before response_due_at"
        actor: GrievanceCoordinator
        preconditions:
          - "Grievance.status == READY_FOR_RESPONSE"
          - "logical clock now <= Grievance.response_due_at"
          - "Grievance.diet_remedy_required == false"
        side_effects:
          - "Grievance.status := CLOSED; remedy := NO_ACTION; response_at := logical clock now; responded_by_user_id := X-User-ID; sla_breached := false; version incremented by 1"
      - from: READY_FOR_RESPONSE
        to: RESPONDED
        trigger: "POST /cfs/grievances/{id}/respond with a substantive remedy on or before response_due_at"
        actor: GrievanceCoordinator
        preconditions:
          - "Grievance.status == READY_FOR_RESPONSE"
          - "logical clock now <= Grievance.response_due_at"
          - "request.remedy in {MENU_CORRECTION, MEAL_REFEED, DIET_REINSTATEMENT}"
          - "when request.remedy == MEAL_REFEED: Grievance.meal_service_record_id is non-null and that record's status == CLOSED and request.refeed_tray_count > 0"
        side_effects:
          - "Grievance.status := RESPONDED; remedy := request.remedy; refeed_tray_count := request.refeed_tray_count; response_at := logical clock now; responded_by_user_id := X-User-ID; sla_breached := false; version incremented by 1"
          - "CASCADE hop 1 - when remedy == MEAL_REFEED, the named MealServiceRecord transitions CLOSED -> DISPUTED with dispute_tray_count := refeed_tray_count and missed_meal_count increased by refeed_tray_count"
          - "CASCADE hop 2 - because that record's missed_meal_count grew, ServiceContract.missed_meal_total increases by refeed_tray_count and liquidated_damages_cents plus performance_score are recomputed; ServiceContract.version incremented by 1"
          - "CASCADE hop 3 - because missed_meal_total reached MISSED_MEAL_ESCALATION_THRESHOLD, every Facility under the contract gets corrective_action_required := true and any OPEN kitchen_posture becomes RESTRICTED"
          - "when remedy == DIET_REINSTATEMENT and Grievance.diet_order_id is non-null: that DietOrder transitions SUSPENDED -> PENDING_VERIFICATION with reverification_count incremented by 1 and verified_by_user_id plus verified_at cleared to null"
      - from: READY_FOR_RESPONSE
        to: ESCALATED
        trigger: "POST /cfs/grievances/{id}/respond after response_due_at"
        actor: GrievanceCoordinator
        preconditions:
          - "Grievance.status == READY_FOR_RESPONSE"
          - "logical clock now > Grievance.response_due_at"
        side_effects:
          - "Grievance.status := ESCALATED; remedy := request.remedy; response_at := logical clock now; responded_by_user_id := X-User-ID; sla_breached := true; version incremented by 1"
          - "CASCADE hop 1 - because sla_breached became true, ServiceContract.grievance_sla_breach_count increases by 1, liquidated_damages_cents and performance_score are recomputed, and ServiceContract.version incremented by 1"
          - "CASCADE hop 2 - because grievance_sla_breach_count reached GRIEVANCE_BREACH_ESCALATION_THRESHOLD, every Facility under the contract gets corrective_action_required := true and any OPEN kitchen_posture becomes RESTRICTED"
        note: "The late-response branch overrides the remedy branching entirely: even remedy == NO_ACTION yields ESCALATED, not CLOSED."

concurrency_rules:
  - rule_id: diet-order-create-stale-inmate
    parent_entity: Inmate
    write_endpoint: "POST /cfs/diet-orders"
    occ_field: "expected_inmate_version"
    description: |
      Creating a DietOrder for an Inmate whose version has advanced since the
      client last read that inmate is rejected. A create may legitimately carry
      supersedes_diet_order_id and retire the incumbent order, so a second create
      that arrives strictly after the first has completed still observes an inmate
      whose diet picture permits another supersede and would otherwise succeed on
      a stale view of active_diet_order_count. OCC on Inmate.version reduces this
      to a deterministic stale-version rejection.
    error_id: ERR_STALE_INMATE_VERSION
    http_status: 412
  - rule_id: batch-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /cfs/production-batches"
    occ_field: "expected_facility_version"
    description: |
      Creating a ProductionBatch against a Facility whose version has advanced
      since the client last read it is rejected. A sharps audit that finds no
      shortfall advances Facility.version and rewrites sharps_on_board_count while
      leaving kitchen_posture at OPEN, so a batch create issued strictly after that
      audit completes observes an identical posture and would otherwise be accepted
      against a stale chiller-occupancy and sharps view. OCC on Facility.version
      forces the client to re-read the facility first.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
  - rule_id: service-record-close-stale-contract
    parent_entity: ServiceContract
    write_endpoint: "POST /cfs/meal-service-records/{id}/close"
    occ_field: "expected_service_contract_version"
    description: |
      Closing a MealServiceRecord whose parent ServiceContract has advanced since
      the client last read that contract is rejected. Closing a different service
      record, or a grievance response that disputes an already-closed record, both
      advance ServiceContract.version and mutate missed_meal_total without changing
      the contract's status, so a close issued strictly afterwards observes the same
      contract status and would otherwise post its liquidated-damages delta onto a
      stale ledger snapshot. OCC on ServiceContract.version makes the rejection
      deterministic.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

calculations:
  - name: menu_cycle_nutrition_adequacy
    trigger: "Recomputed whenever a MenuCycleItem is added to or removed from a DRAFT MenuCycle, and re-evaluated by POST /cfs/menu-cycles/{id}/nutrition-sign."
    algorithm: weighted_scoring
    formula: |
      # STEP ORDER IS NORMATIVE. Per-item rounding happens BEFORE any summation.
      for each MenuCycleItem i of the cycle (input set below):
        item_kcal(i)    = round_half_up(i.kcal_per_100g          * i.portion_grams / 100, 0)   # whole kcal
        item_protein(i) = round_half_up(i.protein_grams_per_100g * i.portion_grams / 100, 2)   # 2 dp grams
        item_sodium(i)  = round_half_up(i.sodium_mg_per_100g     * i.portion_grams / 100, 0)   # whole mg
      cycle_kcal_total    = sum of item_kcal(i)
      cycle_protein_total = sum of item_protein(i)
      cycle_sodium_total  = sum of item_sodium(i)
      approved_kcal_per_meal_day          = round_half_up(cycle_kcal_total    / MenuCycle.cycle_length_days, 0)
      approved_protein_grams_per_meal_day = round_half_up(cycle_protein_total / MenuCycle.cycle_length_days, 2)
      approved_sodium_mg_per_meal_day     = round_half_up(cycle_sodium_total  / MenuCycle.cycle_length_days, 0)
      # Adequacy gates evaluated against the facility's ServiceContract, in this order:
      #   1. approved_kcal_per_meal_day          >= contracted_kcal_per_meal_day            else ERR_NUTRITION_BELOW_STANDARD
      #   2. approved_protein_grams_per_meal_day >= contracted_protein_grams_per_meal_day   else ERR_NUTRITION_BELOW_STANDARD
      #   3. approved_sodium_mg_per_meal_day     <= contracted_sodium_mg_cap_per_meal_day   else ERR_SODIUM_CAP_EXCEEDED
      # FORBIDDEN ALTERNATIVE ORDER: summing the unrounded per-item values and rounding once at
      # the end. With portion-scaled values that land on .5, the two orders differ by whole kcal
      # (worked example: 210.5 + 688.5 + 1900.0 rounds per item to 211 + 689 + 1900 = 2800, but
      # rounds after summing to 2799), which flips the adequacy gate at contracted 2800.
    input_set: "Every MenuCycleItem with menu_cycle_id == this cycle, regardless of meal_slot or cycle_day. Items are never excluded; a cycle with item_count == 0 fails gate 1 with approved_kcal_per_meal_day = 0."
    constants:
      KCAL_DECIMALS: 0
      PROTEIN_DECIMALS: 2
      SODIUM_DECIMALS: 0
      MEAL_SLOTS_PER_DAY: 3
    precision: "kcal and sodium: whole units, round_half_up. protein: 2 decimal places, round_half_up. Rounding is applied per item first, then to the per-meal-day quotient."

  - name: menu_cycle_cost_per_meal_day
    trigger: "Recomputed with menu_cycle_nutrition_adequacy whenever the cycle's item set changes, and re-evaluated by POST /cfs/menu-cycles/{id}/activate."
    algorithm: tiered_pricing
    formula: |
      raw_cost_total = sum of MenuCycleItem.raw_cost_cents over the cycle's items   # integer cents
      base_cost_per_meal_day = raw_cost_total / MenuCycle.cycle_length_days          # exact rational, NOT yet rounded
      satellite_multiplier = tier on Facility.satellite_site_count of the cycle's facility:
        satellite_site_count == 0                                  -> SATELLITE_TIER_0_MULTIPLIER (1.00)
        satellite_site_count >= 1 and satellite_site_count <= 2    -> SATELLITE_TIER_1_MULTIPLIER (1.02)
        satellite_site_count >= 3                                  -> SATELLITE_TIER_2_MULTIPLIER (1.05)
      approved_cost_cents_per_meal_day = ceil(base_cost_per_meal_day * satellite_multiplier)
      # Activation gate: approved_cost_cents_per_meal_day <= ServiceContract.cost_ceiling_cents_per_meal_day
      # else ERR_COST_CEILING_EXCEEDED.
      # The multiplier is a whole-tier step, not interpolated: 2 satellites and 1 satellite both use 1.02.
    input_set: "Every MenuCycleItem with menu_cycle_id == this cycle. The multiplier comes from the Facility named by MenuCycle.facility_id, read at calculation time (not frozen at cycle creation)."
    constants:
      SATELLITE_TIER_0_MULTIPLIER: 1.00
      SATELLITE_TIER_1_MULTIPLIER: 1.02
      SATELLITE_TIER_2_MULTIPLIER: 1.05
      SATELLITE_TIER_1_MAX_SITES: 2
    precision: "Whole cents, ceiling. The multiplier is applied to the unrounded quotient; ceiling is taken exactly once, at the end."

  - name: meal_forecast_trays
    trigger: "Computed on POST /cfs/meal-forecasts and frozen by POST /cfs/meal-forecasts/{id}/lock."
    algorithm: tiered_pricing
    formula: |
      # Segment populations come from the variant (see variants below).
      line_base            = general_population + medical_population
      general_line_trays   = ceil(line_base * PARTICIPATION_RATE)
      segregation_trays    = segregation_population                      # in-cell feeding, no participation discount
      satellite_trays      = ceil(satellite_population * (1 + TRANSPORT_LOSS_RATE))
      line_trays           = general_line_trays + segregation_trays + satellite_trays
      waste_allowance_trays = tier on line_trays:
        line_trays <= WASTE_TIER_1_CEIL (500)                     -> WASTE_FLAT_TRAYS (8)
        line_trays >  500 and line_trays <= WASTE_TIER_2_CEIL (2000) -> ceil(line_trays * WASTE_TIER_2_RATE (0.02))
        line_trays >  2000                                        -> ceil(line_trays * WASTE_TIER_3_RATE (0.015))
      total_forecast_trays = line_trays + waste_allowance_trays
      forecast_special_diet_trays = count of DietOrder rows d where
          d.status == ACTIVE
          AND the Inmate named by d.inmate_id has status == IN_CUSTODY and facility_id == MealForecast.facility_id
          AND d.effective_from <= MealForecast.service_date T00:00:00Z
          AND d.effective_to   >  MealForecast.service_date T00:00:00Z          # half-open window
      # The tier is selected from line_trays only - never from total_forecast_trays - so the
      # allowance never feeds back into its own tier selection.
    input_set: "COUNT_DRIVEN reads the four population fields off the PopulationCount named by population_count_id. ROSTER_DRIVEN ignores those stored numbers and counts Inmate rows with status == IN_CUSTODY and facility_id == MealForecast.facility_id, bucketed by housing_unit (GENERAL -> general, SEGREGATION -> segregation, SATELLITE -> satellite, MEDICAL -> medical). Both variants use the same DietOrder input set for forecast_special_diet_trays."
    constants:
      PARTICIPATION_RATE: 0.94
      TRANSPORT_LOSS_RATE: 0.03
      WASTE_TIER_1_CEIL: 500
      WASTE_TIER_2_CEIL: 2000
      WASTE_FLAT_TRAYS: 8
      WASTE_TIER_2_RATE: 0.02
      WASTE_TIER_3_RATE: 0.015
    precision: "Whole trays throughout; every division or rate multiplication is closed with ceiling, applied per segment before the segments are summed."
    variants:
      - name: COUNT_DRIVEN
        when: "MealForecast.forecast_variant == COUNT_DRIVEN - the standard path, driven by the formal count feed."
        difference: "Segment populations are read from the referenced PopulationCount row, which is immutable (common_fields: false). The forecast therefore stays pinned to the count even when the roster later changes, and roster movement does NOT supersede the draft."
      - name: ROSTER_DRIVEN
        when: "MealForecast.forecast_variant == ROSTER_DRIVEN - used when the count feed is stale and the roster of record governs."
        difference: "Segment populations are recounted from Inmate rows at calculation time. A PopulationCount row is still required for provenance but its numbers are ignored. Because the roster governs, a subsequent POST /cfs/inmates/{id}/movement at the facility transitions any DRAFT ROSTER_DRIVEN forecast to SUPERSEDED. Identical fixtures diverge from COUNT_DRIVEN whenever the roster and the count disagree."

  - name: temperature_log_in_range
    trigger: "Computed on POST /cfs/production-batches/{id}/temperature-logs for the reading being posted."
    algorithm: threshold
    formula: |
      minutes_since_cook_end = null when log_point == COOK_END, otherwise
                               whole minutes from ProductionBatch.cook_end_at to TemperatureLog.logged_at
                               (integer floor of the elapsed seconds divided by 60)
      in_range by log_point:
        COOK_END           -> temperature_f >= COOK_END_MIN_F (165.0)
        CHILL_INTERMEDIATE -> temperature_f <= CHILL_INTERMEDIATE_MAX_F (80.0) AND minutes_since_cook_end <= CHILL_INTERMEDIATE_MAX_MINUTES (120)
        CHILL_FINAL        -> temperature_f <= CHILL_FINAL_MAX_F (40.0)        AND minutes_since_cook_end <= CHILL_FINAL_MAX_MINUTES (360)
        TRANSPORT_DEPART   -> temperature_f <= COLD_CHAIN_MAX_F (41.0)
        TRANSPORT_ARRIVE   -> temperature_f <= COLD_CHAIN_MAX_F (41.0)
        REHEAT_SERVE       -> temperature_f >= REHEAT_MIN_F (165.0) AND whole minutes from the batch's
                              most recent TRANSPORT_ARRIVE log (by logged_at, tie-break earliest created_at)
                              to this reading <= REHEAT_WINDOW_MINUTES (30); when no TRANSPORT_ARRIVE log
                              exists the elapsed-time clause is treated as satisfied and only the
                              temperature gate applies.
      # All comparisons are inclusive at the limit: exactly 80.0 F at exactly 120 minutes is in range;
      # 80.1 F or 121 minutes is not.
    input_set: "The single reading being posted, plus the batch's cook_end_at and its existing TRANSPORT_ARRIVE readings. Readings on a batch whose production_stage == DISCARDED are rejected by validation before this calculation runs."
    constants:
      COOK_END_MIN_F: 165.0
      CHILL_INTERMEDIATE_MAX_F: 80.0
      CHILL_INTERMEDIATE_MAX_MINUTES: 120
      CHILL_FINAL_MAX_F: 40.0
      CHILL_FINAL_MAX_MINUTES: 360
      COLD_CHAIN_MAX_F: 41.0
      REHEAT_MIN_F: 165.0
      REHEAT_WINDOW_MINUTES: 30
    precision: "Temperatures compared at 1 decimal place; elapsed time in whole floored minutes."

  - name: cook_chill_compliance
    trigger: "Recomputed after every temperature log is posted and re-evaluated on POST /cfs/production-batches/{id}/advance-stage to CHILLED and on any QA_PASSED decision."
    algorithm: aggregation
    formula: |
      chill_minutes = null when cook_end_at or chill_final_at is null, otherwise
                      whole floored minutes from cook_end_at to chill_final_at
      cook_chill_compliant = true if and only if ALL THREE hold:
        (a) exists a TemperatureLog for this batch with log_point == COOK_END           and in_range == true
        (b) exists a TemperatureLog for this batch with log_point == CHILL_INTERMEDIATE and in_range == true
        (c) exists a TemperatureLog for this batch with log_point == CHILL_FINAL        and in_range == true
      # A later in-range reading at the same log_point rehabilitates an earlier out-of-range one for
      # the purposes of this flag (existence, not universality), but the out-of-range reading has
      # already driven qa_status to QA_HELD, and only an explicit QA decision can leave QA_HELD.
      cook_end_at    := the logged_at of the batch's earliest COOK_END    reading (tie-break earliest created_at)
      chill_final_at := the logged_at of the batch's earliest in_range CHILL_FINAL reading, or when none is
                        in range, the logged_at of the earliest CHILL_FINAL reading (tie-break earliest created_at)
    input_set: "Every TemperatureLog with production_batch_id == this batch. Logs are immutable (common_fields: false) so the flag is a pure function of the posted readings."
    constants:
      REQUIRED_LOG_POINTS: 3
    precision: "Boolean; chill_minutes in whole floored minutes."

  - name: blast_chiller_occupancy
    trigger: "Evaluated on POST /cfs/production-batches before the batch row is created."
    algorithm: interval_merge
    formula: |
      chill_deadline_at   = scheduled_cook_start_at + COOK_CHILL_TOTAL_MINUTES (360) minutes
      buffered_release_at = chill_deadline_at       + SANITATION_BUFFER_MINUTES (30) minutes
      occupancy(b)        = the CLOSED interval [b.scheduled_cook_start_at, b.buffered_release_at]
      overlap(new, b)     = new.scheduled_cook_start_at <= b.buffered_release_at
                            AND b.scheduled_cook_start_at <= new.buffered_release_at
      concurrent_occupancy = count of existing ProductionBatch rows b where
          b.facility_id == new.facility_id
          AND b.production_stage in {PLANNED, COOKED, CHILLED}
          AND overlap(new, b)
      # Gate: concurrent_occupancy < Facility.blast_chiller_capacity, else ERR_CHILLER_CAPACITY_EXCEEDED.
      # CLOSED-interval semantics: a new batch whose scheduled_cook_start_at equals an existing
      # batch's buffered_release_at DOES overlap it. Contrast calculations.diet_order_coverage_window,
      # whose windows are half-open so touching endpoints do NOT overlap.
    input_set: "ProductionBatch rows at the same facility whose production_stage is PLANNED, COOKED or CHILLED. Rows in STAGED, SERVED or DISCARDED have released the chiller and are excluded, so discarding a batch immediately frees its slot."
    constants:
      COOK_CHILL_TOTAL_MINUTES: 360
      SANITATION_BUFFER_MINUTES: 30
    precision: "Whole minutes; interval endpoints compared inclusively."

  - name: diet_order_coverage_window
    trigger: "Evaluated on POST /cfs/diet-orders and recomputed on POST /cfs/diet-orders/{id}/verify."
    algorithm: interval_merge
    formula: |
      coverage(d)     = the HALF-OPEN interval [d.effective_from, d.effective_to)
      overlap(new, d) = new.effective_from < d.effective_to AND d.effective_from < new.effective_to
      conflicting = the set of DietOrder rows d where
          d.inmate_id  == new.inmate_id
          AND d.order_type == new.order_type
          AND d.status in {PENDING_VERIFICATION, ACTIVE, SUSPENDED}
          AND overlap(new, d)
          AND d.id != new.supersedes_diet_order_id
      # Gate: conflicting must be empty, else ERR_DIET_ORDER_WINDOW_CONFLICT.
      # HALF-OPEN semantics: an incumbent [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z) and a new
      # order [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z) are adjacent, not overlapping, and both
      # may exist. Backing the new order up by one second creates a conflict.
      verification_expires_at = verified_at + (DIET_VALIDITY_DAYS_MEDICAL (30) days when order_type == MEDICAL,
                                               DIET_VALIDITY_DAYS_RELIGIOUS (180) days when order_type == RELIGIOUS)
      # An order is stale for the expiry sweep when logical clock now >= verification_expires_at.
    input_set: "DietOrder rows for the same inmate and the same order_type in status PENDING_VERIFICATION, ACTIVE or SUSPENDED. EXPIRED and REVOKED rows never conflict, and the single row named by supersedes_diet_order_id is exempt so a supersede is always legal."
    constants:
      DIET_VALIDITY_DAYS_MEDICAL: 30
      DIET_VALIDITY_DAYS_RELIGIOUS: 180
      MAX_REVERIFICATIONS: 2
    precision: "Instant comparison at whole-second resolution; window start inclusive, window end exclusive."

  - name: sharps_accountability_reconciliation
    trigger: "Recomputed on every tool issuance, return, unaccounted declaration, and on POST /cfs/facilities/{id}/sharps-audit."
    algorithm: constraint_propagation
    formula: |
      SHARP_CLASSES = {SHARP_KNIFE, MEAT_SAW, SCISSORS}      # NON_SHARP is excluded from every sharps counter
      sharps_issued_count      = count of ToolIssuance at the facility with tool_class in SHARP_CLASSES and status == ISSUED
      sharps_unaccounted_count = count of ToolIssuance at the facility with tool_class in SHARP_CLASSES and status == UNACCOUNTED
      open_sharps_discrepancy_count = sharps_unaccounted_count
      # CONSERVATION IDENTITY (must hold after every one of the operations above):
      #   sharps_on_board_count + sharps_issued_count + sharps_unaccounted_count == sharps_authorized_count
      # sharps_on_board_count is maintained as the residual: it decreases by 1 on issue and increases
      # by 1 on return (including the recovery return out of UNACCOUNTED), and is overwritten wholesale
      # by an audit.
      # AUDIT (the only operation that may break and then re-record the identity):
      #   sharps_on_board_count  := request.counted_on_board
      #   sharps_audit_shortfall := sharps_authorized_count
      #                             - (request.counted_on_board + sharps_issued_count + sharps_unaccounted_count)
      #   last_sharps_audit_at   := logical clock now
      #   A shortfall > 0 drives kitchen_posture to LOCKDOWN via calculations.facility_kitchen_posture.
      #   A shortfall < 0 (more tools counted than authorized) is rejected with ERR_SHARPS_COUNT_OVER_AUTHORIZED
      #   before anything is written.
    input_set: "Every ToolIssuance with facility_id == this facility. Rows in status RETURNED contribute to neither counter regardless of the recovered flag."
    constants:
      SHARP_CLASSES: "SHARP_KNIFE, MEAT_SAW, SCISSORS"
    precision: "Whole counts; no rounding."

  - name: facility_kitchen_posture
    trigger: "Recomputed after every sharps operation, contraband disposition, sharps audit, and after any contract-level corrective-action cascade."
    algorithm: waterfall_allocation
    formula: |
      # The first matching clause wins. Clause order is normative - a facility that satisfies both
      # clause 1 and clause 3 is LOCKDOWN, never RESTRICTED.
      1. exists a ToolIssuance at the facility with status == UNACCOUNTED and tool_class in SHARP_CLASSES -> LOCKDOWN
      2. sharps_audit_shortfall >= 1                                                                     -> LOCKDOWN
      3. corrective_action_required == true                                                              -> RESTRICTED
      4. open_contraband_incident_count >= CONTRABAND_RESTRICT_THRESHOLD (2)                              -> RESTRICTED
      5. exists a ToolIssuance at the facility with status == UNACCOUNTED and tool_class == NON_SHARP      -> RESTRICTED
      6. otherwise                                                                                        -> OPEN
      # Posture is a pure derived field: it is never set directly by any endpoint, and it is
      # recomputed from scratch (not incrementally adjusted) on every trigger, so clearing the last
      # cause returns it to OPEN without an explicit release operation.
      open_contraband_incident_count = count of ContrabandIncident at the facility with status == OPEN
    input_set: "The facility's own counters plus every ToolIssuance and ContrabandIncident with facility_id == this facility. ServiceContract.corrective_action_required is not a contract field - the flag lives on Facility and is written by the contract-level cascades."
    constants:
      CONTRABAND_RESTRICT_THRESHOLD: 2
    precision: "Enum; deterministic first-match evaluation."

  - name: meal_service_missed_meals
    trigger: "Computed on POST /cfs/meal-service-records/{id}/close and increased again if the record is later DISPUTED by a MEAL_REFEED grievance remedy."
    algorithm: threshold
    formula: |
      expected_service_trays = MealForecast.total_forecast_trays - MealForecast.waste_allowance_trays   # frozen at record creation
      total_trays_served     = trays_served_general + trays_served_segregation + trays_served_satellite
      tray_shortfall         = max(0, expected_service_trays - total_trays_served)
      tolerance_trays        = floor(expected_service_trays * MISSED_MEAL_TOLERANCE_RATE (0.02))
      special_shortfall      = max(0, MealForecast.forecast_special_diet_trays - special_diet_trays_served)
      if tray_shortfall <= tolerance_trays AND special_shortfall == 0:
        missed_meal_count = 0
      else:
        missed_meal_count = max(0, tray_shortfall - tolerance_trays)
                            + special_shortfall * SPECIAL_DIET_MISS_WEIGHT (3)
      # The tolerance absorbs general shortfall only. A single unserved religious or therapeutic tray
      # is never absorbed: it always contributes 3 weighted units even when tray_shortfall is inside
      # tolerance. Boundary: at expected 156 the tolerance is 3, so 153 served yields 0 and 152 served
      # yields 1.
      # On dispute: missed_meal_count increases by Grievance.refeed_tray_count with no tolerance relief,
      # because the refeed is an admitted service failure.
    input_set: "The single MealServiceRecord being closed, plus the LOCKED MealForecast named by meal_forecast_id. Trays from batches that were DISCARDED are simply absent from the served counts - there is no separate discard adjustment."
    constants:
      MISSED_MEAL_TOLERANCE_RATE: 0.02
      SPECIAL_DIET_MISS_WEIGHT: 3
    precision: "Whole weighted units; the tolerance is floored, never rounded up."

  - name: contract_liquidated_damages
    trigger: "Recomputed whenever a MealServiceRecord closes or is disputed, whenever a MenuSubstitution is approved, whenever a Grievance response breaches its SLA, and fully from source rows on POST /cfs/service-contracts/{id}/reconcile."
    algorithm: waterfall_allocation
    formula: |
      # STEP ORDER IS NORMATIVE. Each step may read only the outputs of earlier steps.
      step 1: total_trays_served = sum of MealServiceRecord.total_trays_served over the input set
      step 2: meal_days_served   = floor(total_trays_served / MEALS_PER_DAY (3))
      step 3: missed_meal_total  = sum of MealServiceRecord.missed_meal_count over the input set
              grievance_sla_breach_count = count of Grievance rows under the contract with sla_breached == true
      step 4: substitution_total    = count of MenuSubstitution rows in approval_status APPROVED whose
                                      meal_service_record_id is in the input set
              substitution_rate_pct = round_half_up(substitution_total * 100 / max(1, total_trays_served), 2)
      step 5: reference_cost_cents  = approved_cost_cents_per_meal_day of the reference MenuCycle, where the
                                      candidate set is every MenuCycle in status ACTIVE whose Facility has
                                      contract_id == this contract, ranked by approved_cost_cents_per_meal_day
                                      descending, tie-broken by earliest created_at, and when the candidate
                                      set is empty reference_cost_cents := cost_ceiling_cents_per_meal_day
              gross_food_cost_cents          = meal_days_served * reference_cost_cents
              cost_cents_per_meal_day_actual = round_half_up(gross_food_cost_cents / max(1, meal_days_served), 2)
      step 6: if substitution_rate_pct > substitution_allowance_pct:
                excess_pct = round_half_up(substitution_rate_pct - substitution_allowance_pct, 2)
                substitution_surcharge_cents = ceil(gross_food_cost_cents * excess_pct / 100 * SURCHARGE_RATE (0.15))
              else substitution_surcharge_cents = 0
      step 7: raw_liquidated_damages_cents = <variant formula, see variants>
                                             + grievance_sla_breach_count * SLA_BREACH_CENTS (25000)
              # When ServiceContract.ld_variant is still null - every incremental recompute that
              # fires before the first reconcile - the INCIDENT_BASED formula is the default.
      step 8: pre_cap_cents            = raw_liquidated_damages_cents + substitution_surcharge_cents
              liquidated_damages_cents = min(pre_cap_cents, ld_monthly_cap_cents)
      step 9: cost_recovery_credit_cents    = floor(min(liquidated_damages_cents, gross_food_cost_cents)
                                                   * COST_RECOVERY_CREDIT_RATE (0.20))
              net_liquidated_damages_cents  = max(0, liquidated_damages_cents - cost_recovery_credit_cents)
              performance_score = clamp(round_half_up(
                                    100
                                    - missed_meal_total           * MISSED_MEAL_SCORE_WEIGHT (2.5)
                                    - grievance_sla_breach_count  * BREACH_SCORE_WEIGHT (5.0)
                                    - max(0, cost_cents_per_meal_day_actual - cost_ceiling_cents_per_meal_day)
                                          * COST_OVERRUN_SCORE_WEIGHT (0.1),
                                    2), 0.00, 100.00)
      # THE CAP MUST BE APPLIED BEFORE THE COST-RECOVERY CREDIT (step 8 before step 9). Computing the
      # credit from pre_cap_cents and capping the net afterwards is a DIFFERENT and FORBIDDEN result:
      # with pre_cap 29571, cap 20000 and gross food cost 31500, the normative order yields
      # net 16000 while the forbidden order yields net 20000.
    input_set: "MealServiceRecord rows in status CLOSED or DISPUTED whose facility_id belongs to a Facility with contract_id == this contract. OPEN records are excluded entirely. Grievance rows are counted across every facility under the contract regardless of grievance status, keyed only on sla_breached."
    constants:
      MEALS_PER_DAY: 3
      SURCHARGE_RATE: 0.15
      SLA_BREACH_CENTS: 25000
      COST_RECOVERY_CREDIT_RATE: 0.20
      MISSED_MEAL_SCORE_WEIGHT: 2.5
      BREACH_SCORE_WEIGHT: 5.0
      COST_OVERRUN_SCORE_WEIGHT: 0.1
      CORRECTIVE_ACTION_SCORE_FLOOR: 70.0
      MISSED_MEAL_ESCALATION_THRESHOLD: 25
      GRIEVANCE_BREACH_ESCALATION_THRESHOLD: 3
    precision: "Whole cents. Surcharge uses ceiling; the cost-recovery credit uses floor; percentages and the performance score are round_half_up to 2 decimal places."
    variants:
      - name: INCIDENT_BASED
        when: "ServiceContract.ld_variant == INCIDENT_BASED - the default variant, set by the first POST /cfs/service-contracts/{id}/reconcile that supplies ld_variant == INCIDENT_BASED."
        difference: "step 7 uses raw = missed_meal_total * ld_cents_per_missed_meal. Each missed weighted meal costs the flat contract rate regardless of how concentrated the failures were."
      - name: POPULATION_WEIGHTED
        when: "ServiceContract.ld_variant == POPULATION_WEIGHTED - selected at reconcile when the agency prices failures against the served population."
        difference: "step 7 uses raw = ceil(missed_meal_total * ld_cents_per_missed_meal * severity_multiplier) where severity_multiplier = 1 + round_half_up(missed_meal_total / max(1, meal_days_served), 2). Identical fixtures diverge: with missed_meal_total 6, ld_cents_per_missed_meal 750 and meal_days_served 100, INCIDENT_BASED yields 4500 while POPULATION_WEIGHTED yields ceil(4500 * 1.06) = 4770."

  - name: substitution_nutrition_equivalence
    trigger: "Computed on POST /cfs/menu-substitutions and re-read by POST /cfs/menu-substitutions/{id}/decision."
    algorithm: threshold
    formula: |
      planned_kcal    = round_half_up(item.kcal_per_100g          * item.portion_grams / 100, 2)
      planned_protein = round_half_up(item.protein_grams_per_100g * item.portion_grams / 100, 2)
      planned_sodium  = round_half_up(item.sodium_mg_per_100g     * item.portion_grams / 100, 2)
      sub_kcal    = round_half_up(substitute_kcal_per_100g          * substitute_portion_grams / 100, 2)
      sub_protein = round_half_up(substitute_protein_grams_per_100g * substitute_portion_grams / 100, 2)
      sub_sodium  = round_half_up(substitute_sodium_mg_per_100g     * substitute_portion_grams / 100, 2)
      kcal_delta_pct    = round_half_up((sub_kcal    - planned_kcal)    * 100 / planned_kcal, 2)
      protein_delta_pct = round_half_up((sub_protein - planned_protein) * 100 / max(0.01, planned_protein), 2)
      sodium_delta_mg   = round_half_up(sub_sodium - planned_sodium, 2)
      cost_variance_cents = substitute_cost_cents - item.raw_cost_cents
      nutrition_equivalent = abs(kcal_delta_pct) <= KCAL_BAND_PCT (10.00)
                             AND protein_delta_pct >= PROTEIN_FLOOR_PCT (-5.00)
                             AND sodium_delta_mg   <= SODIUM_HEADROOM_MG (200.00)
      # All three bands are inclusive: exactly 10.00, exactly -5.00 and exactly 200.00 are equivalent;
      # 10.01, -5.01 and 200.01 are not.
    input_set: "The MenuCycleItem named by menu_cycle_item_id (the planned component) and the substitute figures supplied in the request. The item's own MenuCycle status is irrelevant to equivalence but is checked separately by validation."
    constants:
      KCAL_BAND_PCT: 10.00
      PROTEIN_FLOOR_PCT: -5.00
      SODIUM_HEADROOM_MG: 200.00
    precision: "2 decimal places, round_half_up, applied to the portion-scaled values before the deltas are taken."

  - name: grievance_response_sla
    trigger: "response_due_at is computed on POST /cfs/grievances; sla_breached is computed on POST /cfs/grievances/{id}/respond."
    algorithm: chronological
    formula: |
      window_days = EXPEDITED_WINDOW_DAYS (5) when category in {RELIGIOUS_DIET_DENIAL, DIET_NOT_HONORED}
                    else STANDARD_WINDOW_DAYS (10)
      response_due_at = filed_at + window_days * 24 hours
      sla_breached    = (logical clock now > response_due_at) at the moment of POST .../respond
      # Inclusive deadline: responding at exactly response_due_at is NOT a breach; one second later is.
      # A breach forces status ESCALATED regardless of the remedy chosen, and adds SLA_BREACH_CENTS to
      # the contract's raw liquidated damages via calculations.contract_liquidated_damages step 7.
    input_set: "The single Grievance being filed or answered. Time spent in any particular branch is irrelevant - only filed_at and the response instant matter."
    constants:
      EXPEDITED_WINDOW_DAYS: 5
      STANDARD_WINDOW_DAYS: 10
    precision: "Whole-second instant comparison; deadline inclusive."

  - name: special_diet_census_invariant
    trigger: "Recomputed on every DietOrder create, verify, suspend, revoke and expiry sweep, and on POST /cfs/inmates/{id}/movement."
    algorithm: aggregation
    formula: |
      Inmate.active_diet_order_count      = count of DietOrder with inmate_id == this inmate and status == ACTIVE
      Facility.active_special_diet_count  = count of DietOrder d with status == ACTIVE whose Inmate has
                                            facility_id == this facility and status == IN_CUSTODY
      # COMPENSATING INVARIANT: a verify that carries supersedes_diet_order_id promotes the new order to
      # ACTIVE and, in the same operation, revokes the incumbent. Both counters must therefore read
      # exactly the same value before and after the verify - the +1 and the -1 cancel. A verify without
      # supersedes_diet_order_id raises both counters by exactly 1.
      # An inmate whose status leaves IN_CUSTODY drops out of the facility census while
      # Inmate.active_diet_order_count is unchanged, so the two counters legitimately disagree after a
      # release or transfer.
    input_set: "Every DietOrder row for the inmate (for the inmate counter) and every DietOrder row joined to IN_CUSTODY inmates at the facility (for the facility census). PENDING_VERIFICATION, SUSPENDED, EXPIRED and REVOKED rows are excluded from both counters."
    constants:
      COUNTED_STATUS: ACTIVE
    precision: "Whole counts; both counters are recomputed from source rows, never incremented blindly."

validations:
  # ---- 1-4: authentication and authorization -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty."
    error_id: ERR_MISSING_USER_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role header is present and non-empty."
    error_id: ERR_MISSING_ROLE_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role names one of the eight roles declared in roles."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 4
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  # ---- 5-7: request shape ---------------------------------------------------------------------
  - priority: 5
    category: business_constraint
    check: "Every field marked required in the endpoint's input is present and of the declared JSON type; fields with source system or computed are ignored when supplied."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: business_constraint
    check: "Every enum-typed field carries a value inside its declared domain."
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 7
    category: business_constraint
    check: "Every numeric field satisfies its declared range constraint, and pagination limit is within 1..100 with offset >= 0."
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all"
  # ---- 8-10: existence and referential coherence ---------------------------------------------
  - priority: 8
    category: existence
    check: "Every resource named by a path segment exists, validated left to right."
    error_id: "ERR_SERVICE_CONTRACT_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_MENU_CYCLE_NOT_FOUND | ERR_MENU_CYCLE_ITEM_NOT_FOUND | ERR_INMATE_NOT_FOUND | ERR_DIET_ORDER_NOT_FOUND | ERR_POPULATION_COUNT_NOT_FOUND | ERR_MEAL_FORECAST_NOT_FOUND | ERR_PRODUCTION_BATCH_NOT_FOUND | ERR_INMATE_WORKER_NOT_FOUND | ERR_TOOL_ISSUANCE_NOT_FOUND | ERR_CONTRABAND_INCIDENT_NOT_FOUND | ERR_MEAL_SERVICE_RECORD_NOT_FOUND | ERR_MENU_SUBSTITUTION_NOT_FOUND | ERR_GRIEVANCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 9
    category: business_referential
    check: "Every foreign key supplied in the request body names an existing row, validated in the field order declared by the endpoint's input list."
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"
  - priority: 10
    category: business_referential
    check: "Cross-parent coherence: Grievance.facility_id equals the grievant inmate's facility_id; MealServiceRecord.facility_id equals the forecast's facility_id; ProductionBatch.facility_id equals the forecast's facility_id; InmateWorker.facility_id equals the inmate's facility_id; ToolIssuance.facility_id equals the worker's facility_id; MenuSubstitution.menu_cycle_item_id belongs to a MenuCycle at the service record's facility; DietOrder.supersedes_diet_order_id names an order for the same inmate and the same order_type."
    error_id: ERR_FACILITY_MISMATCH
    http_status: 409
    applies_to: "POST /cfs/grievances, POST /cfs/meal-service-records, POST /cfs/production-batches, POST /cfs/inmate-workers, POST /cfs/tool-issuances, POST /cfs/menu-substitutions, POST /cfs/diet-orders"
  - priority: 11
    category: business_constraint
    check: "MenuCycleItem.cycle_day is between 1 and the parent MenuCycle.cycle_length_days inclusive."
    error_id: ERR_CYCLE_DAY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /cfs/menu-cycles/{id}/items"
  - priority: 12
    category: business_constraint
    check: "Uniqueness: ServiceContract.contract_code globally; Facility.facility_code globally; (facility_id, cycle_code) for MenuCycle; (facility_id, booking_number) for Inmate; (menu_cycle_id, cycle_day, meal_slot) for MenuCycleItem; (inmate_id) for InmateWorker; (facility_id, tool_serial) across ToolIssuance rows in status ISSUED or UNACCOUNTED; (facility_id, shadow_board_slot) across ToolIssuance rows in status ISSUED."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /cfs/service-contracts, POST /cfs/facilities, POST /cfs/menu-cycles, POST /cfs/menu-cycles/{id}/items, POST /cfs/inmates, POST /cfs/inmate-workers, POST /cfs/tool-issuances"
  # ---- 13-15: optimistic concurrency ----------------------------------------------------------
  - priority: 13
    category: state
    check: "expected_inmate_version equals the current Inmate.version (concurrency_rules[diet-order-create-stale-inmate])."
    error_id: ERR_STALE_INMATE_VERSION
    http_status: 412
    applies_to: "POST /cfs/diet-orders"
  - priority: 14
    category: state
    check: "expected_facility_version equals the current Facility.version (concurrency_rules[batch-create-stale-facility])."
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    applies_to: "POST /cfs/production-batches"
  - priority: 15
    category: state
    check: "expected_service_contract_version equals the current ServiceContract.version of the record's facility (concurrency_rules[service-record-close-stale-contract])."
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /cfs/meal-service-records/{id}/close"
  # ---- 16-18: state preconditions -------------------------------------------------------------
  - priority: 16
    category: state
    check: "The target resource is not already in a terminal state for its machine (ServiceContract CLOSED; MenuCycle RETIRED; DietOrder EXPIRED or REVOKED; MealForecast LOCKED or SUPERSEDED; ProductionBatch production_stage SERVED or DISCARDED; ProductionBatch qa_status QA_CONDEMNED; ToolIssuance RETURNED; ContrabandIncident SANCTIONED or CLEARED; InmateWorker clearance_status BARRED; MealServiceRecord DISPUTED; MenuSubstitution APPROVED or REJECTED; Grievance RESPONDED, ESCALATED or CLOSED)."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 17
    category: state
    check: "The target resource occupies one of the from-states declared for the requested transition in state_machines."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 18
    category: state
    check: "The requested transition target is legal for the current state: advance-stage may only move one step along PLANNED -> COOKED -> CHILLED -> STAGED -> SERVED, and a qa-decision may not move QA_CONDEMNED anywhere."
    error_id: ERR_ILLEGAL_TRANSITION
    http_status: 409
    applies_to: "POST /cfs/production-batches/{id}/advance-stage, POST /cfs/production-batches/{id}/qa-decision"
  # ---- 19-32: safety, security and compliance -------------------------------------------------
  - priority: 19
    category: business_safety
    check: "Facility.kitchen_posture is OPEN for operations that put food or people into the kitchen: creating a ProductionBatch, assigning an InmateWorker, issuing a tool. Carve-out for POST /cfs/tool-issuances only: on that endpoint the posture gate is evaluated against clauses 2, 3 and 4 of calculations.facility_kitchen_posture (audit shortfall, corrective action required, contraband threshold) and NOT against the UNACCOUNTED-tool clauses 1 and 5, because an UNACCOUNTED tool is reported by priority 20 as the more specific ERR_SHARPS_DISCREPANCY_OPEN. Facility.kitchen_posture itself is unaffected - it still reads LOCKDOWN or RESTRICTED - only which error this endpoint reports changes."
    error_id: ERR_KITCHEN_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /cfs/production-batches, POST /cfs/inmate-workers/{id}/assign, POST /cfs/tool-issuances"
  - priority: 20
    category: business_safety
    check: "No ToolIssuance at the facility is in status UNACCOUNTED when a new tool is issued. This is the tool-issue-specific reporting of posture clauses 1 and 5, which priority 19 defers to on this endpoint; it fires for an unaccounted tool of any tool_class, sharp or not."
    error_id: ERR_SHARPS_DISCREPANCY_OPEN
    http_status: 409
    applies_to: "POST /cfs/tool-issuances"
  - priority: 21
    category: business_safety
    check: "A tool with tool_class in {SHARP_KNIFE, MEAT_SAW, SCISSORS} may only be issued to an InmateWorker whose sharps_eligible is true."
    error_id: ERR_WORKER_NOT_SHARPS_ELIGIBLE
    http_status: 409
    applies_to: "POST /cfs/tool-issuances"
  - priority: 22
    category: business_safety
    check: "The InmateWorker receiving a tool or an assignment has clearance_status == CLEARED."
    error_id: ERR_WORKER_NOT_CLEARED
    http_status: 409
    applies_to: "POST /cfs/tool-issuances, POST /cfs/inmate-workers/{id}/assign"
  - priority: 23
    category: business_safety
    check: "The InmateWorker's medical_clearance_expires_at is strictly after the logical clock now."
    error_id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http_status: 409
    applies_to: "POST /cfs/inmate-workers/{id}/assign, POST /cfs/tool-issuances"
  - priority: 24
    category: business_safety
    check: "The InmateWorker has no ContrabandIncident in status OPEN."
    error_id: ERR_OPEN_CONTRABAND_HOLD
    http_status: 409
    applies_to: "POST /cfs/inmate-workers/{id}/assign, POST /cfs/tool-issuances"
  - priority: 25
    category: business_safety
    check: "A DietOrder with order_type == MEDICAL carries a non-empty clinical_indication before it may be verified."
    error_id: ERR_CLINICAL_INDICATION_REQUIRED
    http_status: 422
    applies_to: "POST /cfs/diet-orders/{id}/verify"
  - priority: 26
    category: business_safety
    check: "The verifying role matches the order type: ChaplainDesignee for RELIGIOUS, MedicalProvider for MEDICAL."
    error_id: ERR_VERIFIER_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /cfs/diet-orders/{id}/verify"
  - priority: 27
    category: business_safety
    check: "Segregation of duties on a single artifact: DietOrder.requested_by_user_id != the verifying X-User-ID; MenuCycle.nutrition_signed_by_user_id != the activating X-User-ID; ToolIssuance.issued_by_user_id != the returning X-User-ID; ContrabandIncident.discovered_by_user_id != the dispositioning X-User-ID; MenuSubstitution.documented_by_user_id != the deciding X-User-ID."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /cfs/diet-orders/{id}/verify, POST /cfs/menu-cycles/{id}/activate, POST /cfs/tool-issuances/{id}/return, POST /cfs/contraband-incidents/{id}/disposition, POST /cfs/menu-substitutions/{id}/decision"
  - priority: 28
    category: business_safety
    check: "The Inmate named by a DietOrder or Grievance has status == IN_CUSTODY."
    error_id: ERR_INMATE_NOT_IN_CUSTODY
    http_status: 409
    applies_to: "POST /cfs/diet-orders, POST /cfs/diet-orders/{id}/verify, POST /cfs/grievances"
  - priority: 29
    category: business_safety
    check: "MenuCycle nutrition adequacy: approved_kcal_per_meal_day >= contracted_kcal_per_meal_day and approved_protein_grams_per_meal_day >= contracted_protein_grams_per_meal_day (calculations.menu_cycle_nutrition_adequacy)."
    error_id: ERR_NUTRITION_BELOW_STANDARD
    http_status: 422
    applies_to: "POST /cfs/menu-cycles/{id}/nutrition-sign"
  - priority: 30
    category: business_safety
    check: "MenuCycle sodium ceiling: approved_sodium_mg_per_meal_day <= contracted_sodium_mg_cap_per_meal_day."
    error_id: ERR_SODIUM_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /cfs/menu-cycles/{id}/nutrition-sign"
  - priority: 31
    category: business_safety
    check: "A batch may only be marked QA_PASSED when cook_chill_compliant is true (all three HACCP readings present and in range)."
    error_id: ERR_COOK_CHILL_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /cfs/production-batches/{id}/qa-decision"
  - priority: 32
    category: business_safety
    check: "Stage prerequisites: advancing to COOKED requires an in-range COOK_END log; advancing to CHILLED requires a CHILL_FINAL log; advancing to STAGED requires qa_status == QA_PASSED; advancing to SERVED for service_site in {SATELLITE_A, SEGREGATION_UNIT} requires an in-range REHEAT_SERVE log."
    error_id: "ERR_COOK_LOG_MISSING | ERR_CHILL_LOG_MISSING | ERR_QA_NOT_PASSED | ERR_REHEAT_LOG_MISSING"
    http_status: 409
    applies_to: "POST /cfs/production-batches/{id}/advance-stage"
  - priority: 33
    category: business_safety
    check: "A temperature reading may not be posted out of sequence: CHILL_INTERMEDIATE, CHILL_FINAL, TRANSPORT_DEPART, TRANSPORT_ARRIVE and REHEAT_SERVE all require an existing COOK_END reading, TRANSPORT_ARRIVE requires an existing TRANSPORT_DEPART reading, and REHEAT_SERVE requires an existing TRANSPORT_ARRIVE reading when service_site != MAIN_KITCHEN."
    error_id: ERR_LOG_POINT_OUT_OF_SEQUENCE
    http_status: 409
    applies_to: "POST /cfs/production-batches/{id}/temperature-logs"
  - priority: 34
    category: business_safety
    check: "No temperature reading may be posted against a batch whose production_stage is DISCARDED."
    error_id: ERR_BATCH_DISCARDED
    http_status: 409
    applies_to: "POST /cfs/production-batches/{id}/temperature-logs"
  - priority: 35
    category: business_safety
    check: "A MenuSubstitution may only be APPROVED when nutrition_equivalent is true or reason == QA_CONDEMNATION."
    error_id: ERR_SUBSTITUTION_NOT_EQUIVALENT
    http_status: 409
    applies_to: "POST /cfs/menu-substitutions/{id}/decision"
  - priority: 36
    category: business_safety
    check: "A sharps audit may not report more tools on board than the facility authorizes: counted_on_board + sharps_issued_count + sharps_unaccounted_count <= sharps_authorized_count."
    error_id: ERR_SHARPS_COUNT_OVER_AUTHORIZED
    http_status: 422
    applies_to: "POST /cfs/facilities/{id}/sharps-audit"
  # ---- 37-43: temporal and constraint satisfaction -------------------------------------------
  - priority: 37
    category: business_temporal
    check: "effective_from is strictly before effective_to on a DietOrder, and effective_to is strictly after the logical clock now."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /cfs/diet-orders"
  - priority: 38
    category: business_temporal
    check: "No conflicting DietOrder covers an overlapping half-open window for the same inmate and order_type (calculations.diet_order_coverage_window)."
    error_id: ERR_DIET_ORDER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cfs/diet-orders"
  - priority: 39
    category: business_temporal
    check: "A DietOrder may not be re-verified more than MAX_REVERIFICATIONS times."
    error_id: ERR_REVERIFICATION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /cfs/diet-orders/{id}/request-reverification"
  - priority: 40
    category: business_temporal
    check: "Blast-chiller occupancy: the count of overlapping PLANNED, COOKED or CHILLED batches at the facility is strictly less than Facility.blast_chiller_capacity (calculations.blast_chiller_occupancy, closed intervals)."
    error_id: ERR_CHILLER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cfs/production-batches"
  - priority: 41
    category: business_temporal
    check: "A MealForecast's service_date is not before the logical clock's calendar date at lock time, and a MealServiceRecord's service_date and meal_slot equal those of its forecast."
    error_id: "ERR_FORECAST_DATE_PAST | ERR_SERVICE_WINDOW_MISMATCH"
    http_status: 422
    applies_to: "POST /cfs/meal-forecasts/{id}/lock, POST /cfs/meal-service-records"
  - priority: 42
    category: business_constraint
    check: "A MealForecast may only be locked when its facility has a MenuCycle in status ACTIVE; a MealServiceRecord may only be created against a MealForecast in status LOCKED; a ProductionBatch may only be created against a MealForecast in status LOCKED."
    error_id: "ERR_NO_ACTIVE_MENU_CYCLE | ERR_FORECAST_NOT_LOCKED"
    http_status: 409
    applies_to: "POST /cfs/meal-forecasts/{id}/lock, POST /cfs/meal-service-records, POST /cfs/production-batches"
  - priority: 43
    category: business_constraint
    check: "A MenuCycle may only be activated while its facility's ServiceContract.status == ACTIVE, and a cycle must carry exactly cycle_length_days * MEAL_SLOTS_PER_DAY items before it can be signed."
    error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_MENU_CYCLE_INCOMPLETE"
    http_status: 409
    applies_to: "POST /cfs/menu-cycles/{id}/nutrition-sign, POST /cfs/menu-cycles/{id}/activate"
  - priority: 44
    category: business_constraint
    check: "At most one MealForecast per (facility_id, service_date, meal_slot) may exist in status DRAFT or LOCKED, and at most one MealServiceRecord per meal_forecast_id."
    error_id: "ERR_DUPLICATE_FORECAST | ERR_DUPLICATE_SERVICE_RECORD"
    http_status: 409
    applies_to: "POST /cfs/meal-forecasts, POST /cfs/meal-service-records"
  - priority: 45
    category: business_constraint
    check: "A MealServiceRecord may only be closed when no ProductionBatch tied to its forecast is still in production_stage PLANNED, COOKED, CHILLED or STAGED."
    error_id: ERR_OPEN_BATCHES_REMAIN
    http_status: 409
    applies_to: "POST /cfs/meal-service-records/{id}/close"
  - priority: 46
    category: business_constraint
    check: "A Grievance may only be answered from READY_FOR_RESPONSE, which for route == DUAL_TRACK requires both investigation_complete and diet_review_complete."
    error_id: ERR_BRANCHES_INCOMPLETE
    http_status: 409
    applies_to: "POST /cfs/grievances/{id}/respond"
  - priority: 47
    category: business_constraint
    check: "Remedy admissibility: remedy == NO_ACTION is rejected when diet_remedy_required is true; remedy == MEAL_REFEED requires meal_service_record_id non-null, that record in status CLOSED, and refeed_tray_count >= 1; remedy == DIET_REINSTATEMENT requires diet_order_id non-null and that order in status SUSPENDED."
    error_id: "ERR_REMEDY_NOT_PERMITTED | ERR_REFEED_TARGET_INVALID | ERR_REINSTATEMENT_TARGET_INVALID"
    http_status: 409
    applies_to: "POST /cfs/grievances/{id}/respond"
  - priority: 48
    category: business_constraint
    check: "A reconcile request must name a valid ld_variant, and a contract may only be closed from RECONCILING."
    error_id: ERR_LD_VARIANT_REQUIRED
    http_status: 422
    applies_to: "POST /cfs/service-contracts/{id}/reconcile"
  # ---- 49-50: fiscal ---------------------------------------------------------------------------
  - priority: 49
    category: business_fiscal
    check: "The sum of planned_trays over ProductionBatch rows for a MealForecast whose production_stage is not DISCARDED, including the batch being created, does not exceed MealForecast.total_forecast_trays."
    error_id: ERR_TRAY_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /cfs/production-batches"
  - priority: 50
    category: business_fiscal
    check: "MenuCycle.approved_cost_cents_per_meal_day <= ServiceContract.cost_ceiling_cents_per_meal_day at activation (calculations.menu_cycle_cost_per_meal_day, recomputed against the facility's current satellite_site_count)."
    error_id: ERR_COST_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /cfs/menu-cycles/{id}/activate"

endpoints:
  # ---- logical clock (test-driving endpoint, §1.5 priority ladder step 3) ---------------------
  - method: POST
    path: "/cfs/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary UTC instant. Every deadline, expiry, window and elapsed-minute rule in this domain reads this clock and never the wall clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z, which is at or before every default fixture date, so an unset clock is a fixed earliest instant rather than a drifting wall-clock time."
    roles: [ContractAdministrator, FoodServiceSupervisor, RegisteredDietitian, CorrectionalOfficer, MedicalProvider, ChaplainDesignee, GrievanceCoordinator, ComplianceAuditor]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock repositioned; no entity is mutated and no sweep is triggered by the clock move itself"]

  # ---- ServiceContract ------------------------------------------------------------------------
  - method: POST
    path: "/cfs/service-contracts"
    description: "Creates a food service contract in DRAFT with its nutrition standard, cost ceiling and liquidated-damages terms."
    roles: [ContractAdministrator]
    code: 201
    input: [contract_code, vendor_name, contracted_kcal_per_meal_day, contracted_protein_grams_per_meal_day, contracted_sodium_mg_cap_per_meal_day, cost_ceiling_cents_per_meal_day, ld_cents_per_missed_meal, ld_monthly_cap_cents, substitution_allowance_pct]
    output: ServiceContract
    side_effects: ["ServiceContract created with status DRAFT, all computed ledgers at 0 and ld_variant null"]
  - method: GET
    path: "/cfs/service-contracts/{id}"
    description: "Reads one contract including its liquidated-damages ledger and performance score."
    roles: [ContractAdministrator, ComplianceAuditor, FoodServiceSupervisor, RegisteredDietitian, GrievanceCoordinator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: GET
    path: "/cfs/service-contracts"
    description: "Lists contracts with pagination and optional status filter."
    roles: [ContractAdministrator, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: POST
    path: "/cfs/service-contracts/{id}/activate"
    description: "Moves a DRAFT contract to ACTIVE so its facilities may activate menu cycles."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["ServiceContract.status := ACTIVE; version incremented by 1"]
  - method: POST
    path: "/cfs/service-contracts/{id}/reconcile"
    description: "Pins the liquidated-damages variant and recomputes the whole ledger from source rows via calculations.contract_liquidated_damages steps 1-9."
    roles: [ContractAdministrator]
    code: 200
    input: [ld_variant]
    output: ServiceContract
    side_effects: ["ServiceContract.status := RECONCILING; ld_variant := request.ld_variant; every computed ledger field and performance_score overwritten from source rows; reconciled_at set; version incremented by 1"]
  - method: POST
    path: "/cfs/service-contracts/{id}/close"
    description: "Closes a reconciled contract, freezes the ledger and pushes the corrective-action verdict down to every facility."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["ServiceContract.status := CLOSED; closed_at set; version incremented by 1", "CASCADE: every Facility under the contract has corrective_action_required recomputed against CORRECTIVE_ACTION_SCORE_FLOOR, then kitchen_posture recomputed"]
  - method: GET
    path: "/cfs/service-contracts/{id}/performance-summary"
    description: "Computed read of the contract's performance metrics and liquidated-damages waterfall without exposing the entity's mutable rows."
    roles: [ContractAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: "{ total_trays_served: integer, meal_days_served: integer, missed_meal_total: integer, substitution_rate_pct: number, grievance_sla_breach_count: integer, raw_liquidated_damages_cents: integer, substitution_surcharge_cents: integer, liquidated_damages_cents: integer, cost_recovery_credit_cents: integer, net_liquidated_damages_cents: integer, performance_score: number, ld_variant: string }"
    side_effects: []

  # ---- Facility -------------------------------------------------------------------------------
  - method: POST
    path: "/cfs/facilities"
    description: "Registers a kitchen facility under a contract with its satellite count, chiller capacity and authorized sharps inventory."
    roles: [ContractAdministrator]
    code: 201
    input: [contract_id, facility_code, name, sharps_authorized_count, "satellite_site_count?", "blast_chiller_capacity?"]
    output: Facility
    side_effects: ["Facility created with kitchen_posture OPEN, sharps_on_board_count := sharps_authorized_count, every other counter 0"]
  - method: GET
    path: "/cfs/facilities/{id}"
    description: "Reads one facility including its sharps counters and derived kitchen_posture."
    roles: [ContractAdministrator, ComplianceAuditor, FoodServiceSupervisor, CorrectionalOfficer, RegisteredDietitian, GrievanceCoordinator]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/cfs/facilities"
    description: "Lists facilities, optionally filtered by contract or current posture."
    roles: [ContractAdministrator, ComplianceAuditor, FoodServiceSupervisor, CorrectionalOfficer]
    code: 200
    input: ["contract_id?", "kitchen_posture?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []
  - method: POST
    path: "/cfs/facilities/{id}/sharps-audit"
    description: "Records a physical shadow-board count, recomputes the sharps conservation identity and drives the posture."
    roles: [CorrectionalOfficer]
    code: 200
    input: [counted_on_board]
    output: Facility
    side_effects: ["Facility.sharps_on_board_count := counted_on_board; sharps_audit_shortfall recomputed via calculations.sharps_accountability_reconciliation; last_sharps_audit_at set; kitchen_posture recomputed; version incremented by 1"]
  - method: GET
    path: "/cfs/facilities/{id}/sharps-summary"
    description: "Computed read of the sharps conservation identity for one facility."
    roles: [CorrectionalOfficer, ComplianceAuditor, ContractAdministrator]
    code: 200
    input: []
    output: "{ sharps_authorized_count: integer, sharps_on_board_count: integer, sharps_issued_count: integer, sharps_unaccounted_count: integer, sharps_audit_shortfall: integer, open_sharps_discrepancy_count: integer, kitchen_posture: string }"
    side_effects: []
  - method: GET
    path: "/cfs/facilities/{id}/production-batches"
    description: "Sub-resource listing of every production batch at a facility."
    roles: [FoodServiceSupervisor, ComplianceAuditor, RegisteredDietitian]
    code: 200
    input: ["production_stage?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []
  - method: GET
    path: "/cfs/facilities/{id}/tool-issuances"
    description: "Sub-resource listing of every tool issuance at a facility, including recovered and unaccounted rows."
    roles: [CorrectionalOfficer, ComplianceAuditor, FoodServiceSupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ToolIssuance[]
    side_effects: []

  # ---- MenuCycle and MenuCycleItem ------------------------------------------------------------
  - method: POST
    path: "/cfs/menu-cycles"
    description: "Creates a DRAFT menu cycle for a facility."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [facility_id, cycle_code, cycle_length_days]
    output: MenuCycle
    side_effects: ["MenuCycle created with status DRAFT, item_count 0 and every approved_* field null"]
  - method: GET
    path: "/cfs/menu-cycles/{id}"
    description: "Reads one menu cycle including its approved nutrition and cost figures."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ContractAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: MenuCycle
    side_effects: []
  - method: GET
    path: "/cfs/menu-cycles"
    description: "Lists menu cycles, optionally filtered by facility and status."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ContractAdministrator, ComplianceAuditor]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: MenuCycle[]
    side_effects: []
  - method: POST
    path: "/cfs/menu-cycles/{id}/items"
    description: "Adds one component to a menu cycle; adding to a signed cycle revokes the dietitian's signature."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [cycle_day, meal_slot, component_name, kcal_per_100g, protein_grams_per_100g, sodium_mg_per_100g, portion_grams, raw_cost_cents, "therapeutic_safe?", "religious_tags?"]
    output: MenuCycleItem
    side_effects: ["MenuCycleItem created; MenuCycle.item_count incremented by 1 and version incremented by 1", "when the cycle was NUTRITION_APPROVED it reverts to DRAFT and every approved_* field plus nutrition_signed_by_user_id is cleared"]
  - method: GET
    path: "/cfs/menu-cycles/{id}/items"
    description: "Sub-resource listing of the components of one menu cycle."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor]
    code: 200
    input: ["meal_slot?", "limit?", "offset?"]
    output: MenuCycleItem[]
    side_effects: []
  - method: GET
    path: "/cfs/menu-cycle-items/{id}"
    description: "Reads one menu component."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor]
    code: 200
    input: []
    output: MenuCycleItem
    side_effects: []
  - method: GET
    path: "/cfs/menu-cycle-items"
    description: "Lists menu components across cycles with an optional cycle filter."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor]
    code: 200
    input: ["menu_cycle_id?", "meal_slot?", "limit?", "offset?"]
    output: MenuCycleItem[]
    side_effects: []
  - method: POST
    path: "/cfs/menu-cycles/{id}/nutrition-sign"
    description: "Dietitian attests that the cycle meets the contracted nutrition standard; freezes the approved nutrition and cost figures."
    roles: [RegisteredDietitian]
    code: 200
    input: []
    output: MenuCycle
    side_effects: ["MenuCycle.status := NUTRITION_APPROVED; approved_kcal_per_meal_day, approved_protein_grams_per_meal_day, approved_sodium_mg_per_meal_day from calculations.menu_cycle_nutrition_adequacy; approved_cost_cents_per_meal_day from calculations.menu_cycle_cost_per_meal_day; nutrition_signed_by_user_id := X-User-ID; version incremented by 1"]
  - method: POST
    path: "/cfs/menu-cycles/{id}/activate"
    description: "Contract administrator puts a signed cycle into service, re-checking the cost ceiling against the facility's current satellite tier."
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: MenuCycle
    side_effects: ["MenuCycle.status := ACTIVE; activated_by_user_id := X-User-ID; activated_at set; version incremented by 1", "CASCADE: the facility's previously ACTIVE MenuCycle transitions to RETIRED"]

  # ---- Inmate ---------------------------------------------------------------------------------
  - method: POST
    path: "/cfs/inmates"
    description: "Books an inmate into a facility with a housing unit and optional religious affiliation."
    roles: [CorrectionalOfficer]
    code: 201
    input: [facility_id, booking_number, housing_unit, "religious_affiliation?"]
    output: Inmate
    side_effects: ["Inmate created with status IN_CUSTODY and active_diet_order_count 0"]
  - method: GET
    path: "/cfs/inmates/{id}"
    description: "Reads one inmate including the count of active diet orders."
    roles: [CorrectionalOfficer, FoodServiceSupervisor, RegisteredDietitian, MedicalProvider, ChaplainDesignee, GrievanceCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: Inmate
    side_effects: []
  - method: GET
    path: "/cfs/inmates"
    description: "Lists inmates, optionally filtered by facility, housing unit or custody status."
    roles: [CorrectionalOfficer, FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor]
    code: 200
    input: ["facility_id?", "housing_unit?", "status?", "limit?", "offset?"]
    output: Inmate[]
    side_effects: []
  - method: POST
    path: "/cfs/inmates/{id}/movement"
    description: "Records a housing change, release or transfer; the roster move ripples into diet orders, worker assignments and roster-driven forecasts."
    roles: [CorrectionalOfficer]
    code: 200
    input: [movement_type, "housing_unit?"]
    output: Inmate
    side_effects: ["Inmate.status := RELEASED for movement_type RELEASE, TRANSFERRED for TRANSFER, unchanged for HOUSING_CHANGE; housing_unit := request.housing_unit for HOUSING_CHANGE; version incremented by 1", "CASCADE: on RELEASE or TRANSFER every DietOrder for the inmate in PENDING_VERIFICATION, ACTIVE or SUSPENDED transitions to REVOKED and both diet counters are corrected", "CASCADE: on a HOUSING_CHANGE into SEGREGATION the inmate's InmateWorker (if any) has clearance_status := SUSPENDED, assignment_status := UNASSIGNED and work_area := null", "CASCADE: every MealForecast at the facility in status DRAFT with forecast_variant ROSTER_DRIVEN transitions to SUPERSEDED"]

  # ---- DietOrder ------------------------------------------------------------------------------
  - method: POST
    path: "/cfs/diet-orders"
    description: "Requests a religious or medical diet order for an inmate, optionally superseding an incumbent order of the same type. Guarded by OCC on the inmate."
    roles: [RegisteredDietitian]
    code: 201
    input: [inmate_id, order_type, diet_code, effective_from, effective_to, expected_inmate_version, "clinical_indication?", "supersedes_diet_order_id?"]
    output: DietOrder
    side_effects: ["DietOrder created with status PENDING_VERIFICATION and requested_by_user_id := X-User-ID", "increments Inmate.version by 1 (the inmate's diet picture changed even though active_diet_order_count only moves at verification)"]
  - method: GET
    path: "/cfs/diet-orders/{id}"
    description: "Reads one diet order including its verification expiry."
    roles: [RegisteredDietitian, MedicalProvider, ChaplainDesignee, FoodServiceSupervisor, CorrectionalOfficer, GrievanceCoordinator, ComplianceAuditor]
    code: 200
    input: []
    output: DietOrder
    side_effects: []
  - method: GET
    path: "/cfs/diet-orders"
    description: "Lists diet orders, optionally filtered by inmate, superseded predecessor, status or type."
    roles: [RegisteredDietitian, MedicalProvider, ChaplainDesignee, FoodServiceSupervisor, ComplianceAuditor]
    code: 200
    input: ["inmate_id?", "supersedes_diet_order_id?", "status?", "order_type?", "limit?", "offset?"]
    output: DietOrder[]
    side_effects: []
  - method: POST
    path: "/cfs/diet-orders/{id}/verify"
    description: "Chaplain designee or medical provider verifies the order, activating it and revoking any order it supersedes."
    roles: [ChaplainDesignee, MedicalProvider]
    code: 200
    input: ["verification_note?"]
    output: DietOrder
    side_effects: ["DietOrder.status := ACTIVE; verified_by_user_id := X-User-ID; verified_at set; verification_expires_at from calculations.diet_order_coverage_window; version incremented by 1", "Inmate.active_diet_order_count and Facility.active_special_diet_count incremented by 1", "CASCADE: the order named by supersedes_diet_order_id transitions ACTIVE -> REVOKED and both counters are decremented, leaving them at their pre-verification value"]
  - method: POST
    path: "/cfs/diet-orders/{id}/suspend"
    description: "Suspends an active diet order, for example after a contraband or refusal finding."
    roles: [FoodServiceSupervisor, CorrectionalOfficer]
    code: 200
    input: [suspension_reason]
    output: DietOrder
    side_effects: ["DietOrder.status := SUSPENDED; suspension_reason set; version incremented by 1", "Inmate.active_diet_order_count and Facility.active_special_diet_count decremented by 1"]
  - method: POST
    path: "/cfs/diet-orders/{id}/request-reverification"
    description: "Returns a suspended order to the verification queue, bounded by MAX_REVERIFICATIONS."
    roles: [RegisteredDietitian]
    code: 200
    input: []
    output: DietOrder
    side_effects: ["DietOrder.status := PENDING_VERIFICATION; reverification_count incremented by 1; verified_by_user_id, verified_at, verification_expires_at and suspension_reason cleared; requested_by_user_id := X-User-ID; version incremented by 1"]
  - method: POST
    path: "/cfs/diet-orders/{id}/revoke"
    description: "Revokes a diet order from any non-terminal state."
    roles: [RegisteredDietitian]
    code: 200
    input: [revocation_reason]
    output: DietOrder
    side_effects: ["DietOrder.status := REVOKED; suspension_reason := revocation_reason; version incremented by 1", "both diet counters decremented when the order had been ACTIVE"]

  # ---- PopulationCount ------------------------------------------------------------------------
  - method: POST
    path: "/cfs/population-counts"
    description: "Submits an immutable population count feed for a facility, broken out by housing segment."
    roles: [CorrectionalOfficer]
    code: 201
    input: [facility_id, general_population, segregation_population, satellite_population, medical_population, source]
    output: PopulationCount
    side_effects: ["PopulationCount created with total_population computed and count_at stamped from the logical clock; the row is immutable and carries no version field"]
  - method: GET
    path: "/cfs/population-counts/{id}"
    description: "Reads one population count."
    roles: [CorrectionalOfficer, FoodServiceSupervisor, ComplianceAuditor]
    code: 200
    input: []
    output: PopulationCount
    side_effects: []
  - method: GET
    path: "/cfs/population-counts"
    description: "Lists population counts, optionally filtered by facility or count source."
    roles: [CorrectionalOfficer, FoodServiceSupervisor, ComplianceAuditor]
    code: 200
    input: ["facility_id?", "source?", "limit?", "offset?"]
    output: PopulationCount[]
    side_effects: []

  # ---- MealForecast ---------------------------------------------------------------------------
  - method: POST
    path: "/cfs/meal-forecasts"
    description: "Builds a tray forecast for one facility, service date and meal slot under the chosen variant; sweeps expired diet verifications at that facility first."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [facility_id, population_count_id, service_date, meal_slot, forecast_variant]
    output: MealForecast
    side_effects: ["every ACTIVE DietOrder at the facility whose verification_expires_at has passed transitions to EXPIRED before any counting happens", "MealForecast created in DRAFT with line_trays, waste_allowance_trays, total_forecast_trays and forecast_special_diet_trays from calculations.meal_forecast_trays"]
  - method: GET
    path: "/cfs/meal-forecasts/{id}"
    description: "Reads one forecast including its tray breakdown."
    roles: [FoodServiceSupervisor, ContractAdministrator, ComplianceAuditor, RegisteredDietitian]
    code: 200
    input: []
    output: MealForecast
    side_effects: []
  - method: GET
    path: "/cfs/meal-forecasts"
    description: "Lists forecasts, optionally filtered by facility, source count, status or service date."
    roles: [FoodServiceSupervisor, ContractAdministrator, ComplianceAuditor]
    code: 200
    input: ["facility_id?", "population_count_id?", "status?", "service_date?", "limit?", "offset?"]
    output: MealForecast[]
    side_effects: []
  - method: POST
    path: "/cfs/meal-forecasts/{id}/lock"
    description: "Locks a forecast so production batches and the service record can be measured against it."
    roles: [FoodServiceSupervisor]
    code: 200
    input: []
    output: MealForecast
    side_effects: ["MealForecast.status := LOCKED; locked_at set; version incremented by 1"]

  # ---- ProductionBatch and TemperatureLog -----------------------------------------------------
  - method: POST
    path: "/cfs/production-batches"
    description: "Schedules a cook-chill batch against a locked forecast. Guarded by OCC on the facility, by chiller occupancy and by the tray budget."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [facility_id, meal_forecast_id, recipe_component, planned_trays, scheduled_cook_start_at, service_site, expected_facility_version]
    output: ProductionBatch
    side_effects: ["ProductionBatch created with production_stage PLANNED, qa_status QA_PENDING, produced_trays 0, chill_deadline_at and buffered_release_at from calculations.blast_chiller_occupancy", "increments Facility.version by 1 (the facility's chiller occupancy changed)"]
  - method: GET
    path: "/cfs/production-batches/{id}"
    description: "Reads one batch including both state axes and the HACCP compliance flag."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor, ContractAdministrator]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []
  - method: GET
    path: "/cfs/production-batches"
    description: "Lists batches, optionally filtered by facility, forecast, production stage or QA status."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor]
    code: 200
    input: ["facility_id?", "meal_forecast_id?", "production_stage?", "qa_status?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []
  - method: POST
    path: "/cfs/production-batches/{id}/temperature-logs"
    description: "Posts an immutable HACCP temperature reading at one control point; an out-of-range reading drives the batch's QA axis."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [log_point, temperature_f, site]
    output: TemperatureLog
    side_effects: ["TemperatureLog created with logged_at stamped from the logical clock, minutes_since_cook_end and in_range from calculations.temperature_log_in_range; the row is immutable and carries no version field", "the batch's cook_end_at or chill_final_at is set when the corresponding log point is posted, and cook_chill_compliant plus chill_minutes are recomputed", "an out-of-range CHILL_INTERMEDIATE or CHILL_FINAL reading drives qa_status to QA_HELD; an out-of-range TRANSPORT_ARRIVE or REHEAT_SERVE reading drives qa_status to QA_CONDEMNED and production_stage to DISCARDED"]
  - method: GET
    path: "/cfs/production-batches/{id}/temperature-logs"
    description: "Sub-resource listing of every temperature reading posted against one batch."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor]
    code: 200
    input: ["log_point?", "limit?", "offset?"]
    output: TemperatureLog[]
    side_effects: []
  - method: POST
    path: "/cfs/production-batches/{id}/advance-stage"
    description: "Advances the batch one step along the production axis, enforcing the HACCP log and QA prerequisites for that step."
    roles: [FoodServiceSupervisor]
    code: 200
    input: [to_stage, "produced_trays?"]
    output: ProductionBatch
    side_effects: ["ProductionBatch.production_stage := request.to_stage; produced_trays set when advancing to COOKED; cook_chill_compliant recomputed when advancing to CHILLED; version incremented by 1"]
  - method: POST
    path: "/cfs/production-batches/{id}/qa-decision"
    description: "Records a QA verdict on the independent QA axis; condemnation discards the food."
    roles: [FoodServiceSupervisor, RegisteredDietitian]
    code: 200
    input: [qa_decision, reason]
    output: ProductionBatch
    side_effects: ["ProductionBatch.qa_status := request.qa_decision; qa_reason := request.reason; version incremented by 1", "CASCADE: a QA_CONDEMNED verdict drives production_stage to DISCARDED unless the batch was already SERVED"]

  # ---- InmateWorker ---------------------------------------------------------------------------
  - method: POST
    path: "/cfs/inmate-workers"
    description: "Enrolls an inmate as a kitchen worker with a medical clearance expiry and a sharps eligibility flag."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [inmate_id, facility_id, medical_clearance_expires_at, "sharps_eligible?"]
    output: InmateWorker
    side_effects: ["InmateWorker created with clearance_status CLEARED, assignment_status UNASSIGNED, work_area null and contraband_strike_count 0"]
  - method: GET
    path: "/cfs/inmate-workers/{id}"
    description: "Reads one kitchen worker including both status axes and the strike count."
    roles: [FoodServiceSupervisor, CorrectionalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: InmateWorker
    side_effects: []
  - method: GET
    path: "/cfs/inmate-workers"
    description: "Lists kitchen workers, optionally filtered by inmate, facility, clearance or assignment."
    roles: [FoodServiceSupervisor, CorrectionalOfficer, ComplianceAuditor]
    code: 200
    input: ["inmate_id?", "facility_id?", "clearance_status?", "assignment_status?", "limit?", "offset?"]
    output: InmateWorker[]
    side_effects: []
  - method: POST
    path: "/cfs/inmate-workers/{id}/assign"
    description: "Assigns a cleared worker to a work area; blocked unless the kitchen posture is OPEN and every clearance gate passes."
    roles: [FoodServiceSupervisor]
    code: 200
    input: [work_area]
    output: InmateWorker
    side_effects: ["InmateWorker.assignment_status := ASSIGNED; work_area := request.work_area; version incremented by 1"]

  # ---- ToolIssuance ---------------------------------------------------------------------------
  - method: POST
    path: "/cfs/tool-issuances"
    description: "Signs a tool out of the shadow board to a kitchen worker."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [facility_id, issued_to_worker_id, tool_class, tool_serial, shadow_board_slot]
    output: ToolIssuance
    side_effects: ["ToolIssuance created with status ISSUED, issued_by_user_id := X-User-ID and issued_at stamped from the logical clock", "Facility.sharps_issued_count incremented and sharps_on_board_count decremented for sharp classes; kitchen_posture recomputed; Facility.version incremented by 1"]
  - method: GET
    path: "/cfs/tool-issuances/{id}"
    description: "Reads one tool issuance including the recovery flag."
    roles: [FoodServiceSupervisor, CorrectionalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: ToolIssuance
    side_effects: []
  - method: GET
    path: "/cfs/tool-issuances"
    description: "Lists tool issuances, optionally filtered by facility, holder, status or tool class."
    roles: [FoodServiceSupervisor, CorrectionalOfficer, ComplianceAuditor]
    code: 200
    input: ["facility_id?", "issued_to_worker_id?", "status?", "tool_class?", "limit?", "offset?"]
    output: ToolIssuance[]
    side_effects: []
  - method: POST
    path: "/cfs/tool-issuances/{id}/return"
    description: "Certifies a tool back onto the shadow board; a different officer than the issuer must certify the count. Also the compensating action for an unaccounted tool."
    roles: [CorrectionalOfficer]
    code: 200
    input: [returned_count_verified]
    output: ToolIssuance
    side_effects: ["ToolIssuance.status := RETURNED; returned_at stamped; return_certified_by_user_id := X-User-ID; recovered := true when the row was UNACCOUNTED; version incremented by 1", "Facility sharps counters restored to satisfy the conservation identity and kitchen_posture recomputed; Facility.version incremented by 1", "discarded batches and cleared work assignments are NOT restored"]
  - method: POST
    path: "/cfs/tool-issuances/{id}/declare-unaccounted"
    description: "Declares a tool unaccounted for at shift-end count, locking the kitchen down and cascading four hops deep."
    roles: [CorrectionalOfficer]
    code: 200
    input: [narrative]
    output: ToolIssuance
    side_effects: ["ToolIssuance.status := UNACCOUNTED; unaccounted_at stamped; version incremented by 1", "CASCADE hop 1: Facility.sharps_unaccounted_count and open_sharps_discrepancy_count increase for sharp classes; Facility.version incremented by 1", "CASCADE hop 2: kitchen_posture := LOCKDOWN for sharp classes, RESTRICTED for NON_SHARP", "CASCADE hop 3: under LOCKDOWN every ProductionBatch at the facility in PLANNED, COOKED or CHILLED becomes DISCARDED with qa_status QA_HELD", "CASCADE hop 4: every ASSIGNED InmateWorker at the facility with work_area COOK_CHILL or SERVING_LINE becomes UNASSIGNED with work_area null", "FAN-OUT: a ContrabandIncident is auto-created in status OPEN with discovered_by_user_id 'system' and related_tool_issuance_id set"]

  # ---- ContrabandIncident ---------------------------------------------------------------------
  - method: POST
    path: "/cfs/contraband-incidents"
    description: "Reports contraband found in the kitchen, optionally tied to a worker and a tool issuance."
    roles: [CorrectionalOfficer]
    code: 201
    input: [facility_id, item_class, severity, narrative, "inmate_worker_id?", "related_tool_issuance_id?"]
    output: ContrabandIncident
    side_effects: ["ContrabandIncident created in status OPEN with discovered_by_user_id := X-User-ID and discovered_at stamped", "Facility.open_contraband_incident_count incremented; kitchen_posture recomputed; Facility.version incremented by 1"]
  - method: GET
    path: "/cfs/contraband-incidents/{id}"
    description: "Reads one contraband incident including its sanction."
    roles: [CorrectionalOfficer, FoodServiceSupervisor, ComplianceAuditor]
    code: 200
    input: []
    output: ContrabandIncident
    side_effects: []
  - method: GET
    path: "/cfs/contraband-incidents"
    description: "Lists contraband incidents, optionally filtered by facility, worker, related tool issuance or status."
    roles: [CorrectionalOfficer, FoodServiceSupervisor, ComplianceAuditor]
    code: 200
    input: ["facility_id?", "inmate_worker_id?", "related_tool_issuance_id?", "status?", "limit?", "offset?"]
    output: ContrabandIncident[]
    side_effects: []
  - method: POST
    path: "/cfs/contraband-incidents/{id}/disposition"
    description: "Dispositions an open incident as sanctioned or cleared; a different officer than the reporter must decide."
    roles: [CorrectionalOfficer]
    code: 200
    input: [disposition, "sanction_type?"]
    output: ContrabandIncident
    side_effects: ["ContrabandIncident.status := SANCTIONED or CLEARED; sanction_type and disposition_by_user_id set; version incremented by 1", "Facility.open_contraband_incident_count decremented; kitchen_posture recomputed; Facility.version incremented by 1", "CASCADE on SANCTIONED only: InmateWorker.contraband_strike_count incremented, then clearance_status := BARRED or SUSPENDED with assignment_status := UNASSIGNED and work_area := null"]

  # ---- MealServiceRecord ----------------------------------------------------------------------
  - method: POST
    path: "/cfs/meal-service-records"
    description: "Opens the service record for one locked forecast and freezes the expected tray count."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [facility_id, meal_forecast_id, service_date, meal_slot, trays_served_general, trays_served_segregation, trays_served_satellite, special_diet_trays_served]
    output: MealServiceRecord
    side_effects: ["MealServiceRecord created in OPEN with expected_service_trays frozen from the forecast and total_trays_served computed; missed_meal_count stays 0 until close"]
  - method: GET
    path: "/cfs/meal-service-records/{id}"
    description: "Reads one service record including its weighted missed-meal count."
    roles: [FoodServiceSupervisor, ContractAdministrator, ComplianceAuditor, GrievanceCoordinator]
    code: 200
    input: []
    output: MealServiceRecord
    side_effects: []
  - method: GET
    path: "/cfs/meal-service-records"
    description: "Lists service records, optionally filtered by facility, forecast, status or service date."
    roles: [FoodServiceSupervisor, ContractAdministrator, ComplianceAuditor, GrievanceCoordinator]
    code: 200
    input: ["facility_id?", "meal_forecast_id?", "status?", "service_date?", "limit?", "offset?"]
    output: MealServiceRecord[]
    side_effects: []
  - method: PATCH
    path: "/cfs/meal-service-records/{id}"
    description: "Corrects the served tray counts on an OPEN record before it is closed."
    roles: [FoodServiceSupervisor]
    code: 200
    input: ["trays_served_general?", "trays_served_segregation?", "trays_served_satellite?", "special_diet_trays_served?"]
    output: MealServiceRecord
    side_effects: ["the supplied tray counts are replaced, total_trays_served recomputed and version incremented by 1; rejected unless status == OPEN"]
  - method: POST
    path: "/cfs/meal-service-records/{id}/close"
    description: "Closes the service record, computes the weighted missed-meal count and posts it onto the contract ledger. Guarded by OCC on the contract."
    roles: [FoodServiceSupervisor]
    code: 200
    input: [expected_service_contract_version]
    output: MealServiceRecord
    side_effects: ["MealServiceRecord.missed_meal_count from calculations.meal_service_missed_meals; status := CLOSED; closed_at stamped; version incremented by 1", "CASCADE hop 1: ServiceContract ledgers and performance_score recomputed via calculations.contract_liquidated_damages; increments ServiceContract.version by 1", "CASCADE hop 2: on crossing MISSED_MEAL_ESCALATION_THRESHOLD every Facility under the contract gets corrective_action_required := true", "CASCADE hop 3: those facilities' kitchen_posture moves OPEN -> RESTRICTED"]

  # ---- MenuSubstitution -----------------------------------------------------------------------
  - method: POST
    path: "/cfs/menu-substitutions"
    description: "Documents that a substitute component was served in place of a planned menu component, computing the nutrition equivalence band."
    roles: [FoodServiceSupervisor]
    code: 201
    input: [menu_cycle_item_id, meal_service_record_id, substitute_component_name, substitute_kcal_per_100g, substitute_protein_grams_per_100g, substitute_sodium_mg_per_100g, substitute_portion_grams, substitute_cost_cents, reason]
    output: MenuSubstitution
    side_effects: ["MenuSubstitution created in approval_status PENDING with documented_by_user_id := X-User-ID and all four deltas plus nutrition_equivalent from calculations.substitution_nutrition_equivalence"]
  - method: GET
    path: "/cfs/menu-substitutions/{id}"
    description: "Reads one documented substitution including its equivalence verdict."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor, GrievanceCoordinator]
    code: 200
    input: []
    output: MenuSubstitution
    side_effects: []
  - method: GET
    path: "/cfs/menu-substitutions"
    description: "Lists documented substitutions, optionally filtered by planned component, service record or approval status."
    roles: [FoodServiceSupervisor, RegisteredDietitian, ComplianceAuditor, GrievanceCoordinator]
    code: 200
    input: ["menu_cycle_item_id?", "meal_service_record_id?", "approval_status?", "limit?", "offset?"]
    output: MenuSubstitution[]
    side_effects: []
  - method: POST
    path: "/cfs/menu-substitutions/{id}/decision"
    description: "Dietitian approves or rejects a documented substitution; approval feeds the contract's substitution rate and can invalidate a reconciliation."
    roles: [RegisteredDietitian]
    code: 200
    input: [decision, "decision_note?"]
    output: MenuSubstitution
    side_effects: ["MenuSubstitution.approval_status := APPROVED or REJECTED; decided_by_user_id := X-User-ID; version incremented by 1", "CASCADE on APPROVED only: MealServiceRecord.substitution_count incremented, ServiceContract.substitution_total incremented and substitution_rate_pct recomputed, and a RECONCILING contract reverts to ACTIVE"]

  # ---- Grievance ------------------------------------------------------------------------------
  - method: POST
    path: "/cfs/grievances"
    description: "Files a food service grievance and computes its response deadline from the category's SLA window."
    roles: [GrievanceCoordinator]
    code: 201
    input: [inmate_id, facility_id, category, narrative, "diet_order_id?", "meal_service_record_id?"]
    output: Grievance
    side_effects: ["Grievance created in FILED with filed_at stamped and response_due_at from calculations.grievance_response_sla"]
  - method: GET
    path: "/cfs/grievances/{id}"
    description: "Reads one grievance including its branch flags and SLA verdict."
    roles: [GrievanceCoordinator, RegisteredDietitian, ContractAdministrator, ComplianceAuditor]
    code: 200
    input: []
    output: Grievance
    side_effects: []
  - method: GET
    path: "/cfs/grievances"
    description: "Lists grievances, optionally filtered by inmate, facility, disputed diet order, disputed service record or status."
    roles: [GrievanceCoordinator, RegisteredDietitian, ContractAdministrator, ComplianceAuditor]
    code: 200
    input: ["inmate_id?", "facility_id?", "diet_order_id?", "meal_service_record_id?", "status?", "limit?", "offset?"]
    output: Grievance[]
    side_effects: []
  - method: POST
    path: "/cfs/grievances/{id}/route"
    description: "Forks the grievance into the security investigation branch, the clinical diet review branch, or both."
    roles: [GrievanceCoordinator]
    code: 200
    input: [route]
    output: Grievance
    side_effects: ["Grievance.status := UNDER_INVESTIGATION, DIET_REVIEW or DUAL_TRACK; routed_branch set; version incremented by 1"]
  - method: POST
    path: "/cfs/grievances/{id}/complete-branch"
    description: "Completes one branch of the fork; the grievance joins to READY_FOR_RESPONSE only when every routed branch is complete."
    roles: [GrievanceCoordinator, RegisteredDietitian]
    code: 200
    input: [branch, "finding?"]
    output: Grievance
    side_effects: ["the named branch flag is set; status := READY_FOR_RESPONSE once the join is satisfied, otherwise the grievance stays in DUAL_TRACK; version incremented by 1", "a DIET_REVIEW branch closing with finding KITCHEN_AT_FAULT also sets diet_remedy_required := true"]
  - method: POST
    path: "/cfs/grievances/{id}/respond"
    description: "Issues the grievance response. A response after the deadline escalates regardless of remedy; a MEAL_REFEED remedy disputes the named service record."
    roles: [GrievanceCoordinator]
    code: 200
    input: [remedy, "refeed_tray_count?", "response_note?"]
    output: Grievance
    side_effects: ["Grievance.status := CLOSED, RESPONDED or ESCALATED per calculations.grievance_response_sla; remedy, response_at, responded_by_user_id and sla_breached set; version incremented by 1", "CASCADE on MEAL_REFEED: the named MealServiceRecord moves CLOSED -> DISPUTED, its missed_meal_count grows by refeed_tray_count, and the contract ledger plus performance_score are recomputed", "CASCADE on a breach: ServiceContract.grievance_sla_breach_count incremented, ledger recomputed, and on crossing GRIEVANCE_BREACH_ESCALATION_THRESHOLD every facility under the contract gets corrective_action_required := true with OPEN postures moving to RESTRICTED", "CASCADE on DIET_REINSTATEMENT: the named SUSPENDED DietOrder returns to PENDING_VERIFICATION with its verification fields cleared"]

errors:
  # ---- authentication and authorization -------------------------------------------------------
  - id: ERR_MISSING_USER_HEADER
    http: 401
    condition: "X-User-ID header absent or empty on any request."
  - id: ERR_MISSING_ROLE_HEADER
    http: 401
    condition: "X-User-Role header absent or empty on any request."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role does not name one of the eight declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed for the endpoint being called."
  - id: ERR_VERIFIER_ROLE_MISMATCH
    http: 403
    condition: "A RELIGIOUS diet order is verified by a MedicalProvider, or a MEDICAL diet order by a ChaplainDesignee."
  # ---- request shape ---------------------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing or has the wrong JSON type."
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "An enum-typed field carries a value outside its declared domain."
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "A numeric field violates its declared range, or pagination limit/offset is out of bounds."
  - id: ERR_CYCLE_DAY_OUT_OF_RANGE
    http: 422
    condition: "A menu item's cycle_day is below 1 or above the cycle's cycle_length_days."
  # ---- existence -------------------------------------------------------------------------------
  - id: ERR_SERVICE_CONTRACT_NOT_FOUND
    http: 404
    condition: "No ServiceContract exists for the supplied id."
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "No Facility exists for the supplied id."
  - id: ERR_MENU_CYCLE_NOT_FOUND
    http: 404
    condition: "No MenuCycle exists for the supplied id."
  - id: ERR_MENU_CYCLE_ITEM_NOT_FOUND
    http: 404
    condition: "No MenuCycleItem exists for the supplied id."
  - id: ERR_INMATE_NOT_FOUND
    http: 404
    condition: "No Inmate exists for the supplied id."
  - id: ERR_DIET_ORDER_NOT_FOUND
    http: 404
    condition: "No DietOrder exists for the supplied id, including a supersedes_diet_order_id that names nothing."
  - id: ERR_POPULATION_COUNT_NOT_FOUND
    http: 404
    condition: "No PopulationCount exists for the supplied id."
  - id: ERR_MEAL_FORECAST_NOT_FOUND
    http: 404
    condition: "No MealForecast exists for the supplied id."
  - id: ERR_PRODUCTION_BATCH_NOT_FOUND
    http: 404
    condition: "No ProductionBatch exists for the supplied id."
  - id: ERR_INMATE_WORKER_NOT_FOUND
    http: 404
    condition: "No InmateWorker exists for the supplied id."
  - id: ERR_TOOL_ISSUANCE_NOT_FOUND
    http: 404
    condition: "No ToolIssuance exists for the supplied id."
  - id: ERR_CONTRABAND_INCIDENT_NOT_FOUND
    http: 404
    condition: "No ContrabandIncident exists for the supplied id."
  - id: ERR_MEAL_SERVICE_RECORD_NOT_FOUND
    http: 404
    condition: "No MealServiceRecord exists for the supplied id."
  - id: ERR_MENU_SUBSTITUTION_NOT_FOUND
    http: 404
    condition: "No MenuSubstitution exists for the supplied id."
  - id: ERR_GRIEVANCE_NOT_FOUND
    http: 404
    condition: "No Grievance exists for the supplied id."
  # ---- referential coherence and uniqueness ---------------------------------------------------
  - id: ERR_FACILITY_MISMATCH
    http: 409
    condition: "Two references in one request resolve to different facilities, or a superseded diet order belongs to another inmate or another order_type."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A uniqueness key is already taken: contract_code, facility_code, (facility_id, cycle_code), (facility_id, booking_number), (menu_cycle_id, cycle_day, meal_slot), one worker row per inmate, an open issuance of the same tool_serial, or an occupied shadow_board_slot."
  - id: ERR_DUPLICATE_FORECAST
    http: 409
    condition: "A DRAFT or LOCKED MealForecast already exists for the same facility, service_date and meal_slot."
  - id: ERR_DUPLICATE_SERVICE_RECORD
    http: 409
    condition: "A MealServiceRecord already exists for the named forecast."
  # ---- optimistic concurrency -----------------------------------------------------------------
  - id: ERR_STALE_INMATE_VERSION
    http: 412
    condition: "expected_inmate_version does not equal the inmate's current version on POST /cfs/diet-orders."
  - id: ERR_STALE_FACILITY_VERSION
    http: 412
    condition: "expected_facility_version does not equal the facility's current version on POST /cfs/production-batches."
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_service_contract_version does not equal the contract's current version on POST /cfs/meal-service-records/{id}/close."
  # ---- state -----------------------------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a from-state declared for the requested transition."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target resource already sits in a terminal state for the machine being driven."
  - id: ERR_ILLEGAL_TRANSITION
    http: 409
    condition: "advance-stage was asked to skip or reverse a production step, or a qa-decision was asked to move a condemned batch."
  # ---- safety, security and compliance --------------------------------------------------------
  - id: ERR_KITCHEN_POSTURE_BLOCKED
    http: 409
    condition: "The facility's kitchen_posture is RESTRICTED or LOCKDOWN when a batch, an assignment or a tool issuance is attempted - except on POST /cfs/tool-issuances when the posture is driven only by an UNACCOUNTED tool, which reports ERR_SHARPS_DISCREPANCY_OPEN instead (validations priority 19 carve-out)."
  - id: ERR_SHARPS_DISCREPANCY_OPEN
    http: 409
    condition: "A tool issuance is attempted while any tool at the facility is still UNACCOUNTED."
  - id: ERR_WORKER_NOT_SHARPS_ELIGIBLE
    http: 409
    condition: "A SHARP_KNIFE, MEAT_SAW or SCISSORS issuance is attempted for a worker whose sharps_eligible is false."
  - id: ERR_WORKER_NOT_CLEARED
    http: 409
    condition: "The worker's clearance_status is SUSPENDED or BARRED when an assignment or issuance is attempted."
  - id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http: 409
    condition: "The worker's medical_clearance_expires_at is at or before the logical clock now."
  - id: ERR_OPEN_CONTRABAND_HOLD
    http: 409
    condition: "The worker has a ContrabandIncident still in status OPEN."
  - id: ERR_CLINICAL_INDICATION_REQUIRED
    http: 422
    condition: "A MEDICAL diet order is verified without a clinical_indication."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID already performed the paired step on the same artifact (diet request vs verify, nutrition sign vs activate, tool issue vs return certification, incident report vs disposition, substitution documentation vs decision)."
  - id: ERR_INMATE_NOT_IN_CUSTODY
    http: 409
    condition: "A diet order or grievance operation names an inmate whose status is RELEASED or TRANSFERRED."
  - id: ERR_NUTRITION_BELOW_STANDARD
    http: 422
    condition: "The cycle's approved kcal or protein per meal-day falls below the contracted minimum."
  - id: ERR_SODIUM_CAP_EXCEEDED
    http: 422
    condition: "The cycle's approved sodium per meal-day exceeds the contracted cap."
  - id: ERR_MENU_CYCLE_INCOMPLETE
    http: 409
    condition: "The cycle does not carry exactly cycle_length_days * MEAL_SLOTS_PER_DAY items at nutrition-sign time."
  - id: ERR_COOK_CHILL_NONCOMPLIANT
    http: 409
    condition: "A QA_PASSED verdict is attempted while cook_chill_compliant is false."
  - id: ERR_COOK_LOG_MISSING
    http: 409
    condition: "advance-stage to COOKED is attempted without an in-range COOK_END temperature log."
  - id: ERR_CHILL_LOG_MISSING
    http: 409
    condition: "advance-stage to CHILLED is attempted without a CHILL_FINAL temperature log."
  - id: ERR_QA_NOT_PASSED
    http: 409
    condition: "advance-stage to STAGED or SERVED is attempted while qa_status is not QA_PASSED."
  - id: ERR_REHEAT_LOG_MISSING
    http: 409
    condition: "advance-stage to SERVED is attempted for a SATELLITE_A or SEGREGATION_UNIT batch without an in-range REHEAT_SERVE log."
  - id: ERR_LOG_POINT_OUT_OF_SEQUENCE
    http: 409
    condition: "A temperature log is posted before its prerequisite control point has been logged."
  - id: ERR_BATCH_DISCARDED
    http: 409
    condition: "A temperature log is posted against a batch whose production_stage is DISCARDED."
  - id: ERR_SUBSTITUTION_NOT_EQUIVALENT
    http: 409
    condition: "A substitution outside the nutrition equivalence band is approved for a reason other than QA_CONDEMNATION."
  - id: ERR_SHARPS_COUNT_OVER_AUTHORIZED
    http: 422
    condition: "A sharps audit reports more tools on board plus issued plus unaccounted than the facility authorizes."
  # ---- temporal and constraint satisfaction ---------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "A diet order's effective_from is at or after its effective_to, or its effective_to is not in the future."
  - id: ERR_DIET_ORDER_WINDOW_CONFLICT
    http: 409
    condition: "An overlapping non-terminal diet order of the same order_type already covers the inmate and is not the one being superseded."
  - id: ERR_REVERIFICATION_LIMIT_REACHED
    http: 409
    condition: "A suspended diet order has already been re-verified MAX_REVERIFICATIONS times."
  - id: ERR_CHILLER_CAPACITY_EXCEEDED
    http: 409
    condition: "The new batch's buffered occupancy interval overlaps blast_chiller_capacity or more live batches at the facility."
  - id: ERR_FORECAST_DATE_PAST
    http: 422
    condition: "A forecast lock is attempted for a service_date earlier than the logical clock's calendar date."
  - id: ERR_SERVICE_WINDOW_MISMATCH
    http: 422
    condition: "A service record's service_date or meal_slot differs from its forecast's."
  - id: ERR_NO_ACTIVE_MENU_CYCLE
    http: 409
    condition: "A forecast lock is attempted at a facility with no MenuCycle in status ACTIVE."
  - id: ERR_FORECAST_NOT_LOCKED
    http: 409
    condition: "A production batch or a service record is created against a forecast that is still DRAFT or already SUPERSEDED."
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "A menu cycle activation is attempted while its facility's contract is not ACTIVE."
  - id: ERR_OPEN_BATCHES_REMAIN
    http: 409
    condition: "A service record close is attempted while a batch tied to its forecast is still PLANNED, COOKED, CHILLED or STAGED."
  - id: ERR_BRANCHES_INCOMPLETE
    http: 409
    condition: "A grievance response is attempted before every routed branch has been completed."
  - id: ERR_REMEDY_NOT_PERMITTED
    http: 409
    condition: "Remedy NO_ACTION is chosen for a grievance whose diet review found the kitchen at fault."
  - id: ERR_REFEED_TARGET_INVALID
    http: 409
    condition: "A MEAL_REFEED remedy names no service record, names one that is not CLOSED, or supplies refeed_tray_count below 1."
  - id: ERR_REINSTATEMENT_TARGET_INVALID
    http: 409
    condition: "A DIET_REINSTATEMENT remedy names no diet order or names one that is not SUSPENDED."
  - id: ERR_LD_VARIANT_REQUIRED
    http: 422
    condition: "A reconcile request omits ld_variant or supplies a value outside {INCIDENT_BASED, POPULATION_WEIGHTED}."
  # ---- fiscal ----------------------------------------------------------------------------------
  - id: ERR_TRAY_BUDGET_EXCEEDED
    http: 409
    condition: "The batch's planned_trays would push the forecast's live batch total above total_forecast_trays."
  - id: ERR_COST_CEILING_EXCEEDED
    http: 422
    condition: "The cycle's approved cost per meal-day exceeds the contract's cost ceiling at activation."

roles:
  - name: ContractAdministrator
    description: "Agency-side contract owner: creates contracts and facilities, activates menu cycles, reconciles and closes the liquidated-damages ledger."
    identity: "opaque"
    exclusive_operations:
      - "POST /cfs/service-contracts"
      - "POST /cfs/service-contracts/{id}/activate"
      - "POST /cfs/service-contracts/{id}/reconcile"
      - "POST /cfs/service-contracts/{id}/close"
      - "POST /cfs/facilities"
      - "POST /cfs/menu-cycles/{id}/activate"
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "GET /cfs/service-contracts, GET /cfs/service-contracts/{id}, GET /cfs/service-contracts/{id}/performance-summary"
      - "GET /cfs/facilities, GET /cfs/facilities/{id}, GET /cfs/facilities/{id}/sharps-summary"
      - "GET /cfs/menu-cycles, GET /cfs/menu-cycles/{id}, GET /cfs/meal-forecasts, GET /cfs/meal-forecasts/{id}"
      - "GET /cfs/production-batches/{id}, GET /cfs/meal-service-records, GET /cfs/meal-service-records/{id}, GET /cfs/grievances, GET /cfs/grievances/{id}"
  - name: FoodServiceSupervisor
    description: "Vendor-side kitchen manager: builds menu cycles, forecasts trays, runs cook-chill production, logs temperatures, issues tools, staffs the line and documents substitutions."
    identity: "opaque"
    exclusive_operations:
      - "POST /cfs/menu-cycles"
      - "POST /cfs/menu-cycles/{id}/items"
      - "POST /cfs/meal-forecasts"
      - "POST /cfs/meal-forecasts/{id}/lock"
      - "POST /cfs/production-batches"
      - "POST /cfs/production-batches/{id}/temperature-logs"
      - "POST /cfs/production-batches/{id}/advance-stage"
      - "POST /cfs/inmate-workers"
      - "POST /cfs/inmate-workers/{id}/assign"
      - "POST /cfs/tool-issuances"
      - "POST /cfs/meal-service-records"
      - "PATCH /cfs/meal-service-records/{id}"
      - "POST /cfs/meal-service-records/{id}/close"
      - "POST /cfs/menu-substitutions"
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "POST /cfs/production-batches/{id}/qa-decision (with RegisteredDietitian)"
      - "POST /cfs/diet-orders/{id}/suspend (with CorrectionalOfficer)"
      - "every GET in the kitchen, forecast, worker, tool, batch, service-record and substitution families"
  - name: RegisteredDietitian
    description: "Clinical nutrition authority: signs menu cycles for nutrition adequacy, raises diet orders, decides substitutions, closes the clinical branch of grievances and can condemn food on QA grounds."
    identity: "opaque"
    exclusive_operations:
      - "POST /cfs/menu-cycles/{id}/nutrition-sign"
      - "POST /cfs/diet-orders"
      - "POST /cfs/diet-orders/{id}/request-reverification"
      - "POST /cfs/diet-orders/{id}/revoke"
      - "POST /cfs/menu-substitutions/{id}/decision"
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "POST /cfs/production-batches/{id}/qa-decision (with FoodServiceSupervisor)"
      - "POST /cfs/grievances/{id}/complete-branch (with GrievanceCoordinator)"
      - "GET /cfs/menu-cycles/{id}/items, GET /cfs/menu-cycle-items, GET /cfs/diet-orders, GET /cfs/production-batches, GET /cfs/menu-substitutions, GET /cfs/grievances"
  - name: CorrectionalOfficer
    description: "Security staff: books inmates, submits population counts, audits the shadow board, certifies tool returns, declares tools unaccounted and dispositions contraband."
    identity: "opaque"
    exclusive_operations:
      - "POST /cfs/inmates"
      - "POST /cfs/inmates/{id}/movement"
      - "POST /cfs/population-counts"
      - "POST /cfs/facilities/{id}/sharps-audit"
      - "POST /cfs/tool-issuances/{id}/return"
      - "POST /cfs/tool-issuances/{id}/declare-unaccounted"
      - "POST /cfs/contraband-incidents"
      - "POST /cfs/contraband-incidents/{id}/disposition"
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "POST /cfs/diet-orders/{id}/suspend (with FoodServiceSupervisor)"
      - "GET /cfs/facilities, GET /cfs/facilities/{id}/sharps-summary, GET /cfs/facilities/{id}/tool-issuances, GET /cfs/inmates, GET /cfs/inmate-workers, GET /cfs/tool-issuances, GET /cfs/contraband-incidents, GET /cfs/population-counts"
  - name: MedicalProvider
    description: "Licensed provider who verifies therapeutic diet orders; may not verify religious orders and holds no other write authority."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "POST /cfs/diet-orders/{id}/verify (MEDICAL orders only; shared with ChaplainDesignee for RELIGIOUS orders)"
      - "GET /cfs/diet-orders, GET /cfs/diet-orders/{id}, GET /cfs/inmates/{id}"
  - name: ChaplainDesignee
    description: "Religious accommodation authority who verifies religious diet orders; may not verify medical orders."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "POST /cfs/diet-orders/{id}/verify (RELIGIOUS orders only; shared with MedicalProvider for MEDICAL orders)"
      - "GET /cfs/diet-orders, GET /cfs/diet-orders/{id}, GET /cfs/inmates/{id}"
  - name: GrievanceCoordinator
    description: "Owns the grievance lifecycle: files, routes into one or both branches, completes the security branch and issues the response."
    identity: "opaque"
    exclusive_operations:
      - "POST /cfs/grievances"
      - "POST /cfs/grievances/{id}/route"
      - "POST /cfs/grievances/{id}/respond"
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "POST /cfs/grievances/{id}/complete-branch (with RegisteredDietitian)"
      - "GET /cfs/grievances, GET /cfs/grievances/{id}, GET /cfs/meal-service-records, GET /cfs/meal-service-records/{id}, GET /cfs/diet-orders/{id}, GET /cfs/menu-substitutions, GET /cfs/inmates/{id}, GET /cfs/facilities/{id}, GET /cfs/service-contracts/{id}"
  - name: ComplianceAuditor
    description: "Read-only oversight role with no write authority anywhere; reads every ledger, log and summary to audit contract performance."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /cfs/_clock/set_current_utc"
      - "every GET endpoint in the domain, including GET /cfs/service-contracts/{id}/performance-summary, GET /cfs/facilities/{id}/sharps-summary and GET /cfs/production-batches/{id}/temperature-logs"
