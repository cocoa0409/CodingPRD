        grounds:
          - state_machines.Manuscript.DECISION_PENDING_to_REJECTED
          - state_machines.ReviewInvitation.ACCEPTED_to_WITHDRAWN
          - state_machines.EditorAssignment.ACTIVE_to_RELEASED
          - calculations.reviewer_reliability_score
          - entities.Reviewer.fields.open_invitation_count
          - entities.Reviewer.fields.status
        distinguishing_aspect: |
          Depth-4 chain fired by POST /manuscripts/{id}/decisions: (1) the Decision resolves to
          REJECT and the Manuscript moves DECISION_PENDING -> REJECTED, which (2) withdraws reviewer
          C's still-ACCEPTED invitation with closed_reason DECISION_CASCADE, which (3) decrements
          C.open_invitation_count and re-runs reviewer_reliability_score over a set that now holds
          three CLOSED invitations, which (4) trips the PROBATION guard and moves C from ACTIVE to
          PROBATION — link 4 is impossible without link 3, which is impossible without link 2.
