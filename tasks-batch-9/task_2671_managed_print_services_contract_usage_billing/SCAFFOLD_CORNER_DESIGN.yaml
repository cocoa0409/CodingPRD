        distinguishing_aspect: "All three uniqueness scopes are per-contract: the same asset tag is rejected inside contract A (409) yet accepted under contract B, and a CostTier band that merely overlaps an existing band conflicts without sharing its tier_index."
        test_recipe:
          setup:
            - "contract C1 (DRAFT) with MONO tier 1 covering pages 1..20000, site S1 and device D1 with asset_tag MPS-0001"
            - "a QuarterlyReview for C1 labelled 2026-Q3"
