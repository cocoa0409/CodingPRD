            - "GET /labeling/registry/${grant_par_code} while WITHHELD -> ERR_REGISTRY_CODE_NOT_FOUND (404)"
            - "after the second PUBLISHED decision LabelGrant.${grant_par_id}.registry_publication_status == PUBLISHED and grant_status is still ACTIVE"
            - "RegistryEntry.${reg_par_id}.published_at == 2026-08-01T00:00:00Z, NOT 2026-08-05T00:00:00Z"
            - "LabelGrant.${grant_par_id}.valid_from == 2026-08-01T00:00:00Z and valid_until == 2027-08-01T00:00:00Z, unchanged by the withhold-republish cycle"
            - "GET /labeling/registry/${grant_par_code} after republication -> 200 with grant_status ACTIVE"

  # =========================================================================
  # RULE 4 — transitive cascades from DIFFERENT triggers
  #   instance 1: depth 3 from a product spec change
  #   instance 2: depth 3 from an enforcement adjudication
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: spec_change_suspends_grant_withdraws_display_and_demotes_retailer
        depth: 3
        grounds:
          - state_machines.Product.transitions.CURRENT_to_STALE
          - state_machines.LabelGrant.transitions.ACTIVE_to_SUSPENDED_on_spec_change
          - state_machines.RetailerDisplayAuthorization.transitions.AUTHORIZED_to_WITHDRAWN_on_grant_cascade
          - calculations.retailer_participation_tier
          - endpoints.POST_labeling_products_id_spec_changes.side_effects
        chain:
          - "LINK 1: POST /labeling/products/{id}/spec-changes bumps spec_revision to 1 and moves Product.conformance_currency CURRENT -> STALE."
          - "LINK 2: caused by link 1 — every ACTIVE LabelGrant of that product moves to SUSPENDED with suspension_reason PRODUCT_SPEC_CHANGED and renewal_required true."
          - "LINK 3: caused by link 2 — every AUTHORIZED RetailerDisplayAuthorization of each newly SUSPENDED grant moves to WITHDRAWN with withdrawal_reason GRANT_SUSPENDED, which drops the retailer's active_display_count from 2 to 0 and re-derives participation_tier from GOLD down to BASELINE."
        distinguishing_aspect: |
          A manufacturer-side firmware change reaches an unrelated retailer's participation tier three
          hops away: product -> grant -> display authorizations -> retailer tier. Link 3 is caused by
          link 2 only (the retailer is never named in the request) and the demotion is a recomputation,
          not a decrement, so an implementation that only cascades one hop leaves the retailer at GOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_1 tier, ELIGIBLE SMART_SPEAKER category, five-criterion catalogue."
            - "One SMALL manufacturer with an ELIGIBLE speaker product approved on a self-attestation assessment and an ACTIVE PUBLISHED label grant."
            - "One retailer with education_materials_ack true holding TWO AUTHORIZED display authorizations on that grant, one IN_STORE and one ONLINE, so active_display_count is 2 and participation_tier is GOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 730 }
              as: ProgramAdministrator
              captures: { cat_speaker_id: $.data.id }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 60, requires_lab_verification: true, criterion_text: "Unique per-device credentials or forced change at first use" }, { criterion_code: "AUTH-2", practice_area: "AUTHENTICATION", weight: 40, requires_lab_verification: false, criterion_text: "Brute-force resistant authentication with lockout" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 100, requires_lab_verification: true, criterion_text: "Signed automatic security updates for the declared support period" }, { criterion_code: "DATA-1", practice_area: "DATA_PROTECTION", weight: 100, requires_lab_verification: false, criterion_text: "Personal data encrypted in transit and at rest" }, { criterion_code: "VDP-1", practice_area: "VULN_DISCLOSURE", weight: 100, requires_lab_verification: false, criterion_text: "Published vulnerability disclosure policy with monitored contact" } ] }
              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/retailers"
              payload: { retailer_name: "Cedar Home Retail" }
              as: ProgramAdministrator
              captures: { retailer_id: $.data.id }
            - call: "POST /labeling/retailers/${retailer_id}/education-ack"
              payload: { education_program_version: "EDU-2026.1" }
              as: Retailer
              as_user_id: "${retailer_id}"
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_speaker_id}", model_name: "Northwind Speaker S1", sku: "NW-SPK-S1", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 12000 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_speaker_id: $.data.id, prod_speaker_v: $.data.version }
            - call: "POST /labeling/products/${prod_speaker_id}/assessments"
