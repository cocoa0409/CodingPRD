        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint: effective_units against
          Jurisdiction.permit_unit_threshold 250.00 at POST /projects. 249.99
          units gives NOT_REQUIRED / NOT_REQUIRED while EXACTLY 250.00 gives
          RETAILER / PENDING_APPLICATION, because the unit test is an inclusive
          lower bound. The two projects also pin the two-decimal tier arithmetic
          (120228 versus 120233 cents) so a truncating implementation is caught
          on the money as well as on the enum.
        test_recipe:
          setup:
            - "ServiceCategory FLOOR-LVP with trade_code FLOORING and permit_policy BY_JURISDICTION."
