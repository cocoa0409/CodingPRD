        grounds:
          - validations[priority=18]
          - errors.ERR_PERIOD_OUTSIDE_CONTRACT_TERM
          - endpoints[POST /gpo/price-activations]
        distinguishing_aspect: "A price window that is well formed on its own (effective_to after effective_from) is still illegal because it runs 15 days past the contract's effective_to. Containment is checked against the parent term, both endpoints inclusive, so [2026-12-01, 2026-12-31] passes while [2026-12-01, 2027-01-15] does not — and the request that fails is rejected before the identical window is ever compared to other activations."
