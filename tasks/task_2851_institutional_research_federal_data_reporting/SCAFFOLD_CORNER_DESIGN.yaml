  - section: validations
    instances:
      - name: corner_val_metric_key_must_belong_to_the_component_domain_except_shared_fte
        claim_type: Violation -> Error
        grounds:
          - validations[priority=17]
          - errors[ERR_METRIC_DOMAIN_MISMATCH]
          - endpoints[POST /ir/survey-components/{component_id}/metrics]
          - endpoints[POST /ir/external-submissions]
        distinguishing_aspect: |
          The domain table is not a single global metric list: TOTAL_COMPLETIONS is refused on an
          ENROLLMENT component and TOTAL_HEADCOUNT on a FINANCE one, yet FTE_ENROLLMENT is
          accepted by both because the per-FTE expense figure needs it on FINANCE. The same table
          gates an ExternalSubmission's metric_key against its source component.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with an ENROLLMENT extract and a FINANCE extract."
            - "DRAFT components exist for ENROLLMENT and FINANCE."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60140", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ffe: $.data.id }
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: RegistrarOfficer
              captures: { cyc_v2: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "FINANCE", record_count: 12, coverage_start_date: "2026-07-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60141", expected_cycle_version: "${cyc_v2}" }
              as: RegistrarOfficer
              captures: { fff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ffe}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp_e: $.data.id }
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${fff}", component_code: "FINANCE" }
              as: IRAnalyst
              captures: { comp_f: $.data.id }
          trigger:
            - call: "POST /ir/survey-components/${comp_e}/metrics"
              payload: { metric_key: "TOTAL_COMPLETIONS", reported_value: 500, source_field_path: "sis.completions.total" }
              as: IRAnalyst
              captures: { err1: $.data.error_id }
            - call: "POST /ir/survey-components/${comp_f}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
              captures: { err2: $.data.error_id }
            - call: "POST /ir/survey-components/${comp_e}/metrics"
              payload: { metric_key: "FTE_ENROLLMENT", reported_value: 940, prior_year_value: 940, source_field_path: "sis.enrollment.fte" }
              as: IRAnalyst
              captures: { m_e: $.data.id }
            - call: "POST /ir/survey-components/${comp_f}/metrics"
              payload: { metric_key: "FTE_ENROLLMENT", reported_value: 940, prior_year_value: 940, source_field_path: "fin.fte.reported" }
              as: IRAnalyst
              captures: { m_f: $.data.id }
            - call: "POST /ir/external-submissions"
              payload: { cycle_id: "${cyc}", component_id: "${comp_e}", target_type: "STATE", target_name: "State Board of Higher Education", metric_key: "INSTRUCTIONAL_STAFF_HEADCOUNT", reported_value: 300 }
              as: IRAnalyst
              captures: { err3: $.data.error_id }
          assert:
            - "First call: HTTP status == 422 and response.error_id == \"ERR_METRIC_DOMAIN_MISMATCH\" (COMPLETIONS key on an ENROLLMENT component)"
            - "Second call: HTTP status == 422 and response.error_id == \"ERR_METRIC_DOMAIN_MISMATCH\" (ENROLLMENT key on a FINANCE component)"
            - "Third call: HTTP status == 201, ComponentMetric.${m_e}.metric_key == FTE_ENROLLMENT"
            - "Fourth call: HTTP status == 201, ComponentMetric.${m_f}.metric_key == FTE_ENROLLMENT (the shared key is legal on FINANCE too)"
            - "Fifth call: HTTP status == 422 and response.error_id == \"ERR_METRIC_DOMAIN_MISMATCH\" (HR key against an ENROLLMENT source component)"
            - "GET /ir/component-metrics?component_id=${comp_e} -> total_count == 1"
            - "GET /ir/external-submissions?cycle_id=${cyc} -> total_count == 0"

      - name: corner_val_exclusion_code_is_the_closed_federal_list
        claim_type: Violation -> Error
        grounds:
          - validations[priority=18]
          - errors[ERR_INVALID_EXCLUSION_CODE]
          - state_machines.CohortMember.NONE_to_CLAIMED
        distinguishing_aspect: |
          MEDICAL_WITHDRAWAL is a plausible institutional reason but is not one of the five
          allowable federal exclusions, so the claim is refused and exclusion_status stays NONE;
          the same call with PERMANENTLY_DISABLED is accepted.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is OPEN with a DRAFT GRAD_RATE_150 cohort for FALL2020 holding one member S001."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id }
            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "GRAD_RATE_150", entry_term: "FALL2020", publication_metric_key: "GRAD_RATE_150_FALL2020" }
              as: RegistrarOfficer
              captures: { coh: $.data.id }
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S001", entry_status: "FULL_TIME", outcome: "NO_LONGER_ENROLLED" }
              as: RegistrarOfficer
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /ir/cohort-members/${m1}/exclusion-claim"
              payload: { exclusion_code: "MEDICAL_WITHDRAWAL", exclusion_evidence_note: "Student withdrew for documented medical reasons in the second year." }
              as: RegistrarOfficer
              as_user_id: "registrar-1"
              captures: { err: $.data.error_id }
            - call: "POST /ir/cohort-members/${m1}/exclusion-claim"
              payload: { exclusion_code: "PERMANENTLY_DISABLED", exclusion_evidence_note: "Disability services letter dated 2024-03-11 is on file for this student." }
              as: RegistrarOfficer
              as_user_id: "registrar-1"
          assert:
            - "First call: HTTP status == 422 and response.error_id == \"ERR_INVALID_EXCLUSION_CODE\""
            - "CohortMember.${m1}.exclusion_status == NONE, exclusion_code is null, exclusion_evidence_note is null, version == 1"
            - "Second call: HTTP status == 200, exclusion_status == CLAIMED, exclusion_code == PERMANENTLY_DISABLED, exclusion_claimed_by_user_id == \"registrar-1\", version == 2"
            - "CohortDefinition.${coh}.exclusion_count == 0 and adjusted_count == 1 (a CLAIMED member is not yet excluded)"

      - name: corner_val_every_value_map_target_must_sit_in_the_federal_value_domain
        claim_type: Violation -> Error
        grounds:
          - validations[priority=16]
          - errors[ERR_VALUE_DOMAIN_VIOLATION]
          - state_machines.DataElementMapping.PROPOSED_to_VALIDATED
          - state_machines.DataElementMapping.REJECTED_to_PROPOSED
        distinguishing_aspect: |
          The closed-domain check guards both ends of the revision loop: an APPROVE of a map whose
          target HISPANIC is absent from the domain is refused, and so is a revise that reintroduces
          it — the mapping cannot sneak a bad code back in through the REJECTED -> PROPOSED edge.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 exists; FederalDefinition RACE_ETHNICITY (ENROLLMENT, not required) has value_domain [ASIAN, BLACK, WHITE, UNKNOWN]."
            - "A PROPOSED SIS mapping targets it with value_map {A: ASIAN, B: BLACK, H: HISPANIC}."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id }
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "EF_RACE_ETHNICITY", survey_component: "ENROLLMENT", value_domain: ["ASIAN", "BLACK", "WHITE", "UNKNOWN"], required: false, unit_of_measure: "CODE", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { fd: $.data.id }
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${fd}", local_system_code: "SIS", local_field_path: "SIS.STUDENT.ETHNICITY", transform_expression: "UPPER(TRIM(x))", value_map: { A: "ASIAN", B: "BLACK", H: "HISPANIC" } }
              as: IRAnalyst
              captures: { map1: $.data.id }
          trigger:
            - call: "POST /ir/element-mappings/${map1}/validate"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "steward-1"
              captures: { err1: $.data.error_id }
            - call: "POST /ir/element-mappings/${map1}/validate"
              payload: { decision: "REJECT", rejection_reason: "HISPANIC is not a code in the federal race/ethnicity value domain for this cycle." }
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /ir/element-mappings/${map1}/revise"
              payload: { transform_expression: "UPPER(TRIM(x))", value_map: { A: "ASIAN", B: "BLACK", H: "HISPANIC" } }
              as: IRAnalyst
              captures: { err2: $.data.error_id }
            - call: "POST /ir/element-mappings/${map1}/revise"
              payload: { transform_expression: "UPPER(TRIM(x))", value_map: { A: "ASIAN", B: "BLACK", H: "UNKNOWN" } }
              as: IRAnalyst
            - call: "POST /ir/element-mappings/${map1}/validate"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "steward-1"
          assert:
            - "First call: HTTP status == 422, response.error_id == \"ERR_VALUE_DOMAIN_VIOLATION\", DataElementMapping.${map1}.status == PROPOSED and version == 1"
            - "Second call: HTTP status == 200, status == REJECTED, rejection_reason stored, validated_by_user_id == \"steward-1\", version == 2"
            - "Third call: HTTP status == 422, response.error_id == \"ERR_VALUE_DOMAIN_VIOLATION\", status is still REJECTED, revision_round == 0, version == 2"
            - "Fourth call: HTTP status == 200, status == PROPOSED, revision_round == 1, rejection_reason is null, version == 3"
            - "Fifth call: HTTP status == 200, status == VALIDATED, version == 4"
            - "GET /ir/element-mappings?cycle_id=${cyc}&status=VALIDATED -> total_count == 1"

