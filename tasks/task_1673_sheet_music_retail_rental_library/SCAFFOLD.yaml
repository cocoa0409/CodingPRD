# =============================================================================
# SCAFFOLD.yaml — Sheet Music Retail & Rental Library (music publisher rental library)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling files.
# =============================================================================

scenario: |
  Sheet Music Retail & Rental Library (music publisher rental library): catalog & publisher
  relationships, rental set inventory & performance material tracking, condition assessment
  on return & damage billing, perusal scores & approval-copy policy, digital vs print
  licensing rules, school/institution account & purchase orders, out-of-print sourcing,
  performance rights advisory

domain_name: sheet-music-rental-library
api_prefix: /library

complexity_profile:
  primary_archetype: quota_allocation        # finite rental-set copies competed across overlapping loan windows
  secondary_archetype: compliance_audit      # licensing rules, damage billing with segregation of duties, advisory trail
  complexity_layers:
    - optimistic_concurrency                 # OCC on RentalOrder.version and CustomerAccount.version
    - cascading_side_effects                 # return check-in → condition report → damage invoice → account standing
    - dual_variant_calculation               # provisional vs final rental fee; provisional vs settled account exposure
    - rate_threshold_triggers                # late-return surcharge tiers, credit-limit boundary
  entity_topology: hybrid                    # flat peers (Publisher, Work, CustomerAccount) + child aggregates (RentalSet under Work, orders under account)
  state_machine_shape: cyclic                # RentalOrder renewal loop + DamageInvoice dispute loop + PO credit-hold loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # RentalOrder references RentalSet (inventory aggregate) and PurchaseOrder (billing aggregate)
    - polymorphic                            # PerusalRequest.converted_target references RentalOrder or SaleRecord by kind
  role_model: segregation_of_duties          # ReturnsClerk assesses condition; BillingManager approves/waives damage invoices — never the same actor on the same line
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Publisher legal name" }
      - { name: rental_discount_pct, type: number, source: input, default: 0, description: "Negotiated discount percent applied to base rental rate, 0–0.60 inclusive" }
      - { name: allows_digital_perusal, type: boolean, source: input, default: false, description: "Whether this publisher's works may be perused as licensed digital watermarked copies" }
      - { name: print_only_rental, type: boolean, source: input, default: false, description: "When true, rentals of this publisher's works must be fulfilled from physical sets; digital fulfillment license is unavailable" }
      - { name: out_of_print, type: boolean, source: input, default: false, description: "Publisher declares its catalog out of print; new stock orders blocked, sourcing workflow enabled" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "SUSPENDED blocks all new rental/perusal/purchase activity on its works" }

  - name: Work
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; owning publisher" }
      - { name: title, type: string, source: input, description: "Work title" }
      - { name: catalog_number, type: string, source: input, description: "Publisher catalog number; unique per publisher" }
      - { name: ensemble_tier, type: enum, source: input, description: "CHAMBER | BAND | ORCHESTRA", constraints: "Drives base rental rate tier" }
      - { name: base_rental_rate_cents, type: integer, source: input, description: "Base rental rate per copy per loan period in cents; must be > 0" }
      - { name: sale_price_cents, type: integer, source: input, description: "Retail sale price per copy in cents; must be > 0" }
      - { name: license_format, type: enum, source: input, description: "PRINT_ONLY | DIGITAL_ONLY | PRINT_AND_DIGITAL", constraints: "Rental fulfillment format must be licensed: PRINT_ONLY excludes digital fulfillment; DIGITAL_ONLY excludes physical-set dispatch" }
      - { name: perusal_allowed, type: boolean, source: input, default: true, description: "Whether perusal/approval copies may be requested for this work" }
      - { name: rights_class, type: enum, source: input, default: STANDARD, description: "STANDARD | GRAND_RIGHTS | RESTRICTED", constraints: "GRAND_RIGHTS and RESTRICTED works require a cleared RightsAdvisoryCase before dispatch" }
      - { name: status, type: enum, source: system, description: "CATALOGED | WITHDRAWN", constraints: "WITHDRAWN blocks new rental/perusal/purchase; existing loans unaffected" }

  - name: RentalSet
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; work this set performs" }
      - { name: set_code, type: string, source: input, description: "Human-readable shelf code; unique across the library" }
      - { name: copy_count, type: integer, source: input, description: "Total physical copies owned in this set; must be >= 1", constraints: "immutable after creation" }
      - { name: available_copy_count, type: integer, source: computed, description: "copy_count minus copies held by RentalLines in RESERVED/DISPATCHED/ON_LOAN/OVERDUE status; maintained by rental ledger sync" }
      - { name: condition_grade, type: enum, source: system, default: A, description: "A | B | C | D — worst current grade across returned lines; D = unrentable until repaired" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Full-set replacement value in cents; caps damage charges; must be > 0" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | UNDER_REPAIR | RETIRED", constraints: "Only IN_SERVICE sets are allocatable; condition_grade D auto-moves set to UNDER_REPAIR" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Institution or individual name" }
      - { name: account_kind, type: enum, source: input, description: "INDIVIDUAL | SCHOOL | INSTITUTION", constraints: "SCHOOL/INSTITION may raise purchase orders and perusal requests; INDIVIDUAL may not raise purchase orders" }
      - { name: credit_tier, type: enum, source: input, default: STANDARD, description: "PREFERRED | STANDARD | PREPAY", constraints: "PREPAY accounts must prepay rentals before dispatch; credit_limit_cents forced to 0" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Maximum open exposure in cents; exposure = sum(unpaid issued DamageInvoice.amount_cents) + sum(active rental estimated_fee_cents) + sum(outstanding sale balance)" }
      - { name: open_exposure_cents, type: integer, source: computed, description: "Provisional exposure per account_exposure calculation (includes DRAFT damage invoices)" }
      - { name: settled_exposure_cents, type: integer, source: computed, description: "Settled exposure per account_exposure calculation (excludes DRAFT damage invoices, includes only ISSUED+DISPUTED invoices and fees on non-terminal rentals)" }
      - { name: standing, type: enum, source: system, default: GOOD, description: "GOOD | HOLD | BARRED", constraints: "HOLD at overdue rentals or exposure >= credit limit; BARRED is manual; non-GOOD standing blocks dispatch and new reservations" }
      - { name: requires_purchase_order, type: boolean, source: input, default: false, description: "When true, every rental order must reference an APPROVED PurchaseOrder before dispatch" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; issuing institution" }
      - { name: po_number, type: string, source: input, description: "Institution's PO number; unique per account" }
      - { name: authorized_amount_cents, type: integer, source: input, description: "Spending ceiling in cents; must be > 0" }
      - { name: encumbered_cents, type: integer, source: computed, description: "Sum of estimated fees of non-terminal RentalOrders referencing this PO plus invoiced damage billed to it" }
      - { name: valid_from, type: datetime, source: input, description: "PO validity start, ISO8601 date" }
      - { name: valid_until, type: datetime, source: input, description: "PO validity end, ISO8601 date; must be > valid_from" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | SUSPENDED | EXPIRED | CLOSED | REJECTED", constraints: "SUSPENDED when account standing flips to HOLD/BARRED while APPROVED; returns to APPROVED when standing returns to GOOD (cyclic)" }

  - name: RentalOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; renting customer" }
      - { name: rental_set_id, type: string, source: input, description: "FK -> RentalSet.id; set being rented" }
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; required when account.requires_purchase_order, else optional" }
      - { name: fulfillment_format, type: enum, source: input, default: PHYSICAL, description: "PHYSICAL | DIGITAL", constraints: "DIGITAL requires Work.license_format in {DIGITAL_ONLY, PRINT_AND_DIGITAL} and Publisher.print_only_rental == false" }
      - { name: copies_requested, type: integer, source: input, description: "Number of copies to rent; must be >= 1" }
      - { name: checkout_date, type: datetime, source: input, description: "Loan start date (ISO8601 date)" }
      - { name: due_date, type: datetime, source: input, description: "Loan due date; must be > checkout_date", constraints: "extended in place by RENEW transition" }
      - { name: loan_periods, type: integer, source: computed, description: "Number of 30-day loan periods spanned by [checkout_date, due_date): ceil((due_date - checkout_date) / 30d), minimum 1" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Provisional fee at reservation per rental_fee_estimate (includes PREPAY prepayment basis)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final fee at return per rental_fee_final (late surcharges, damage-independent); null until RETURNED" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of RENEW cycles applied; hard cap 2" }
      - { name: prepayment_cents, type: integer, source: system, default: 0, description: "Amount prepaid by PREPAY accounts before dispatch" }
      - { name: status, type: enum, source: system, description: "DRAFT | RESERVED | DISPATCHED | ON_LOAN | OVERDUE | RETURNED | DISPUTED | SETTLED | CANCELLED", constraints: "cyclic renewal ON_LOAN→ON_LOAN; dispute loop RETURNED→DISPUTED→RETURNED" }

  - name: RentalLine
    parent: null
    common_fields: true
    fields:
      - { name: rental_order_id, type: string, source: system, description: "FK -> RentalOrder.id; owning order" }
      - { name: copy_seq, type: integer, source: system, description: "Copy sequence number within the set allocation (1..copies_requested)" }
      - { name: checkout_condition, type: enum, source: input, default: A, description: "A | B | C | D — condition recorded at dispatch" }
      - { name: return_condition, type: enum, source: system, description: "A | B | C | D | LOST — recorded at check-in; null until returned" }
      - { name: status, type: enum, source: system, description: "RESERVED | DISPATCHED | ON_LOAN | OVERDUE | RETURNED | LOST | RELEASED", constraints: "drives RentalSet.available_copy_count ledger" }

  - name: ConditionReport
    parent: null
    common_fields: true
    fields:
      - { name: rental_line_id, type: string, source: input, description: "FK -> RentalLine.id; line being assessed" }
      - { name: assessor_user_id, type: string, source: system, description: "X-User-ID of the ReturnsClerk who performed assessment; recorded for segregation-of-duties check" }
      - { name: observed_grade, type: enum, source: input, description: "A | B | C | D | LOST" }
      - { name: findings, type: string, source: input, description: "Free-text damage findings; required when observed_grade is C, D, or LOST" }
      - { name: assessed_charge_cents, type: integer, source: computed, description: "Charge per damage_charge calculation; 0 when grade >= checkout grade (no degradation)" }
      - { name: status, type: enum, source: system, description: "FILED | INVOICED | SUPERSEDED", constraints: "SUPERSEDED when a re-assessment replaces it during DISPUTED" }

  - name: DamageInvoice
    parent: null
    common_fields: true
    fields:
      - { name: rental_line_id, type: string, source: input, description: "FK -> RentalLine.id; damaged line" }
      - { name: condition_report_id, type: string, source: input, description: "FK -> ConditionReport.id; supporting assessment" }
      - { name: account_id, type: string, source: system, description: "FK -> CustomerAccount.id; copied from the rental order for exposure rollup" }
      - { name: amount_cents, type: integer, source: computed, description: "Billed amount; copied from ConditionReport.assessed_charge_cents at issuance" }
      - { name: issuer_user_id, type: string, source: system, description: "X-User-ID of BillingManager who issued" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | DISPUTED | RESOLVED_ACCEPTED | RESOLVED_WAIVED", constraints: "dispute loop DISPUTED→ISSUED allowed on re-assessment; RESOLVED_WAIVED zeroes the collected amount but preserves audit" }

  - name: PerusalRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; requesting school/institution" }
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; work to peruse" }
      - { name: format, type: enum, source: input, description: "PHYSICAL | DIGITAL", constraints: "DIGITAL requires Work.perusal_allowed, Publisher.allows_digital_perusal, and Work.license_format != PRINT_ONLY" }
      - { name: ship_date, type: datetime, source: system, description: "Date the perusal copy shipped / digital grant issued" }
      - { name: return_due_date, type: datetime, source: system, description: "ship_date + PERUSAL_WINDOW_DAYS (21 days)" }
      - { name: hold_start, type: datetime, source: system, description: "Start of perusal-copy hold interval (== ship_date)" }
      - { name: hold_end, type: datetime, source: system, description: "End of perusal-copy hold interval (== return_due_date + QUARANTINE_DAYS); closed interval — a new perusal hold on the same work requires hold_start > prior hold_end" }
      - { name: converted_target_kind, type: enum, source: system, description: "NONE | RENTAL | PURCHASE", default: NONE, constraints: "polymorphic target of the conversion" }
      - { name: converted_target_id, type: string, source: system, description: "id of the created RentalOrder or SaleRecord when converted" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | SHIPPED | OVERDUE_PERUSAL | RETURNED | CONVERTED | EXPIRED | REJECTED", constraints: "OVERDUE_PERUSAL set by daily sweep when now > return_due_date" }

  - name: SaleRecord
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; buyer" }
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; work purchased" }
      - { name: quantity, type: integer, source: input, description: "Copies purchased; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Work.sale_price_cents net of perusal conversion discount when applicable" }
      - { name: total_cents, type: integer, source: computed, description: "Per perusal_conversion_credit: per-line rounding then sum" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Unsettled portion; contributes to account exposure" }
      - { name: perusal_request_id, type: string, source: input, description: "FK -> PerusalRequest.id; set when the sale is a perusal conversion (grants discount), else null" }
      - { name: status, type: enum, source: system, description: "INVOICED | PAID | WRITTEN_OFF" }

  - name: RightsAdvisoryCase
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; requesting customer" }
      - { name: work_id, type: string, source: input, description: "FK -> Work.id; work whose performance rights are in question" }
      - { name: venue_kind, type: enum, source: input, description: "EDUCATIONAL | CONCERT | COMPETITION | RELIGIOUS", constraints: "venue classification feeds the rights determination" }
      - { name: question, type: string, source: input, description: "Free-text rights question" }
      - { name: determination, type: enum, source: system, description: "PENDING | CLEARED | LICENSE_REQUIRED | PROHIBITED", constraints: "PENDING until decided; CLEARED required before dispatch of GRAND_RIGHTS/RESTRICTED works" }
      - { name: decided_by_user_id, type: string, source: system, description: "RightsAdvisor who issued the determination" }
      - { name: status, type: enum, source: system, description: "OPEN | DECIDED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RentalOrder
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /library/rental-orders/{id}/reserve"
        actor: LibraryClerk
        preconditions:
          - "CustomerAccount.standing == GOOD (ERR_ACCOUNT_NOT_IN_GOOD_STANDING)"
          - "RentalSet.status == IN_SERVICE and RentalSet.condition_grade != D (ERR_RENTAL_SET_NOT_RENTABLE)"
          - "Work.status == CATALOGED and Publisher.status == ACTIVE (ERR_WORK_NOT_RENTABLE)"
          - "fulfillment_format == DIGITAL implies Work.license_format in {DIGITAL_ONLY, PRINT_AND_DIGITAL} and Publisher.print_only_rental == false (ERR_LICENSE_FORMAT_NOT_AVAILABLE)"
          - "Temporal overlap: for PHYSICAL orders, copies_requested <= copies whose [checkout_date, due_date) does not overlap existing RESERVED/DISPATCHED/ON_LOAN/OVERDUE lines on this set, half-open adjacency allowed (ERR_INSUFFICIENT_COPIES)"
          - "If account.requires_purchase_order: purchase_order_id present, PO.status == APPROVED, now within [valid_from, valid_until], and po.encumbered_cents + estimated_fee_cents <= po.authorized_amount_cents (ERR_PO_NOT_USABLE / ERR_PO_AMOUNT_EXCEEDED)"
          - "If account.credit_tier == PREPAY: account exposure check skipped at reserve (payment due at dispatch)"
          - "Else: settled_exposure_cents + estimated_fee_cents <= credit_limit_cents unless credit_limit_cents == 0 treated as no-credit (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Allocate copies_requested copies: create RentalLine rows (status RESERVED, copy_seq 1..N)"
          - "Recompute RentalSet.available_copy_count (decrement by copies_requested)"
          - "Compute estimated_fee_cents via rental_fee_estimate"
          - "If PO referenced: po.encumbered_cents += estimated_fee_cents; increments PurchaseOrder.version by 1"
          - "Recompute account open_exposure_cents and settled_exposure_cents; increments CustomerAccount.version by 1"
          - "increments RentalOrder.version by 1"
      - from: RESERVED
        to: DISPATCHED
        trigger: "POST /library/rental-orders/{id}/dispatch"
        actor: LibraryClerk
        preconditions:
          - "RentalOrder.status == RESERVED (ERR_INVALID_STATE)"
          - "CustomerAccount.standing == GOOD (ERR_ACCOUNT_NOT_IN_GOOD_STANDING)"
          - "If PO referenced: PO.status == APPROVED (ERR_PO_NOT_USABLE)"
          - "If Work.rights_class in {GRAND_RIGHTS, RESTRICTED}: exists RightsAdvisoryCase for (account_id, work_id) with determination == CLEARED and status == DECIDED (ERR_RIGHTS_NOT_CLEARED)"
          - "If account.credit_tier == PREPAY: prepayment_cents >= estimated_fee_cents (ERR_PREPAYMENT_REQUIRED)"
        side_effects:
          - "All lines RESERVED → DISPATCHED (checkout_condition recorded per line)"
          - "increments RentalOrder.version by 1"
      - from: DISPATCHED
        to: ON_LOAN
        trigger: "POST /library/rental-orders/{id}/confirm-receipt"
        actor: Customer
        preconditions:
          - "RentalOrder.status == DISPATCHED (ERR_INVALID_STATE)"
          - "Acting Customer belongs to the order's account (ERR_FORBIDDEN_ACCOUNT)"
        side_effects:
          - "All lines DISPATCHED → ON_LOAN"
          - "increments RentalOrder.version by 1"
      - from: ON_LOAN
        to: ON_LOAN
        trigger: "POST /library/rental-orders/{id}/renew"
        actor: LibraryClerk
        preconditions:
          - "RentalOrder.status == ON_LOAN (ERR_INVALID_STATE)"
          - "renewal_count < RENEWAL_CAP (2) (ERR_RENEWAL_CAP_REACHED)"
          - "CustomerAccount.standing == GOOD (ERR_ACCOUNT_NOT_IN_GOOD_STANDING)"
          - "Temporal overlap re-check: extended [checkout_date, new due_date) must not collide with other RESERVED/DISPATCHED/ON_LOAN/OVERDUE lines on the same set (ERR_RENEWAL_CONFLICT)"
          - "If PO referenced: PO.status == APPROVED and new total estimated fee within authorized_amount_cents (ERR_PO_AMOUNT_EXCEEDED)"
        side_effects:
          - "due_date += 30 days; loan_periods recomputed"
          - "renewal_count += 1"
          - "estimated_fee_cents recomputed via rental_fee_estimate; PO encumbrance delta applied; increments PurchaseOrder.version by 1 when PO referenced"
          - "Recompute account exposures; increments CustomerAccount.version by 1"
          - "increments RentalOrder.version by 1"
      - from: ON_LOAN
        to: OVERDUE
        trigger: "system (daily sweep POST /library/_sweep/run_daily when now > due_date)"
        actor: system
        preconditions:
          - "now > due_date"
        side_effects:
          - "All lines ON_LOAN → OVERDUE"
          - "CustomerAccount.standing → HOLD when it was GOOD (account now has an overdue rental); increments CustomerAccount.version by 1"
          - "If the order references a PO and the account flip puts PO into SUSPENDED, PO cascade fires; increments PurchaseOrder.version by 1"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /library/rental-orders/{id}/check-in"
        actor: ReturnsClerk
        preconditions:
          - "RentalOrder.status in {ON_LOAN, OVERDUE} (ERR_INVALID_STATE)"
        side_effects:
          - "All non-LOST lines → RETURNED (return_condition set per ConditionReport filed in the same request)"
          - "final_fee_cents computed via rental_fee_final (late days = max(0, return_date - due_date) in whole days)"
          - "Recompute RentalSet.available_copy_count (increment by returned copies)"
          - "RentalSet.condition_grade = worst grade across all RETURNED lines of the set; if D present, RentalSet.status → UNDER_REPAIR; increments RentalSet.version by 1"
          - "For each line whose observed grade degraded: create ConditionReport (status FILED) with assessed_charge_cents via damage_charge"
          - "If no damage: order proceeds toward SETTLED eligibility (account exposure recompute); increments CustomerAccount.version by 1"
      - from: ON_LOAN
        to: RETURNED
        trigger: "POST /library/rental-orders/{id}/check-in"
        actor: ReturnsClerk
        preconditions:
          - "RentalOrder.status in {ON_LOAN, OVERDUE}"
        side_effects:
          - "Same as OVERDUE → RETURNED cascade"
      - from: RETURNED
        to: DISPUTED
        trigger: "POST /library/rental-orders/{id}/dispute"
        actor: Customer
        preconditions:
          - "RentalOrder.status == RETURNED (ERR_INVALID_STATE)"
          - "At least one DamageInvoice on the order's lines in ISSUED status (ERR_NOTHING_TO_DISPUTE)"
        side_effects:
          - "All ISSUED DamageInvoices on the order's lines → DISPUTED"
          - "increments RentalOrder.version by 1"
      - from: DISPUTED
        to: RETURNED
        trigger: "POST /library/rental-orders/{id}/resolve-dispute"
        actor: BillingManager
        preconditions:
          - "RentalOrder.status == DISPUTED (ERR_INVALID_STATE)"
          - "Every DISPUTED DamageInvoice resolved to RESOLVED_ACCEPTED or RESOLVED_WAIVED, or re-assessed (report SUPERSEDED and invoice re-ISSUED) (ERR_UNRESOLVED_DISPUTES)"
        side_effects:
          - "Order returns to RETURNED; re-assessed invoices resume ISSUED"
          - "increments RentalOrder.version by 1"
      - from: RETURNED
        to: SETTLED
        trigger: "POST /library/rental-orders/{id}/settle"
        actor: BillingManager
        preconditions:
          - "RentalOrder.status == RETURNED (ERR_INVALID_STATE)"
          - "Every DamageInvoice on the order's lines in {PAID, RESOLVED_ACCEPTED, RESOLVED_WAIVED} — none in DRAFT/ISSUED/DISPUTED (ERR_UNSETTLED_DAMAGE_INVOICES)"
          - "For PREPAY accounts: final_fee_cents <= prepayment_cents + sum(collected damage) OR top-up recorded (ERR_PREPAYMENT_SHORTFALL)"
        side_effects:
          - "Order → SETTLED; PO encumbrance released (encumbered_cents -= estimated_fee_cents); increments PurchaseOrder.version by 1 when PO referenced"
          - "Account exposures recomputed; if no remaining OVERDUE orders and exposure < credit limit, standing HOLD → GOOD; increments CustomerAccount.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /library/rental-orders/{id}/cancel"
        actor: LibraryClerk
        preconditions:
          - "RentalOrder.status in {DRAFT, RESERVED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Lines (if any) → RELEASED; RentalSet.available_copy_count restored; PO encumbrance released; exposures recomputed"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /library/rental-orders/{id}/cancel"
        actor: LibraryClerk
        preconditions:
          - "RentalOrder.status in {DRAFT, RESERVED}"
        side_effects:
          - "Same compensation cascade as DRAFT → CANCELLED"

  - entity: RentalLine
    initial_state: RESERVED
    terminal_states: [RETURNED, LOST, RELEASED]
    transitions:
      - from: RESERVED
        to: DISPATCHED
        trigger: "system (cascade from RentalOrder dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: ON_LOAN
        trigger: "system (cascade from RentalOrder confirm-receipt)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_LOAN
        to: OVERDUE
        trigger: "system (cascade from RentalOrder overdue sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_LOAN
        to: RETURNED
        trigger: "system (cascade from RentalOrder check-in; return_condition recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "RentalSet.available_copy_count incremented by 1 per returned line"
      - from: OVERDUE
        to: RETURNED
        trigger: "system (cascade from RentalOrder check-in)"
        actor: system
        preconditions: []
        side_effects:
          - "RentalSet.available_copy_count incremented by 1 per returned line"
      - from: RESERVED
        to: RELEASED
        trigger: "system (cascade from RentalOrder cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "RentalSet.available_copy_count incremented by 1 per released line"
      - from: ON_LOAN
        to: LOST
        trigger: "POST /library/rental-lines/{id}/report-lost"
        actor: LibraryClerk
        preconditions:
          - "RentalLine.status in {ON_LOAN, OVERDUE} (ERR_INVALID_STATE)"
        side_effects:
          - "ConditionReport auto-filed with observed_grade LOST; assessed_charge_cents = RentalSet.replacement_value_cents / RentalSet.copy_count (integer division, round_half_up) per damage_charge LOST rule"
          - "RentalSet.available_copy_count NOT incremented (copy never returns)"
      - from: OVERDUE
        to: LOST
        trigger: "POST /library/rental-lines/{id}/report-lost"
        actor: LibraryClerk
        preconditions:
          - "RentalLine.status in {ON_LOAN, OVERDUE}"
        side_effects:
          - "Same as ON_LOAN → LOST"

  - entity: PurchaseOrder
    initial_state: SUBMITTED
    terminal_states: [CLOSED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /library/purchase-orders/{id}/approve"
        actor: BillingManager
        preconditions:
          - "PurchaseOrder.status == SUBMITTED (ERR_INVALID_STATE)"
          - "CustomerAccount.account_kind in {SCHOOL, INSTITUTION} (ERR_PO_REQUIRES_INSTITUTION)"
          - "CustomerAccount.standing == GOOD (ERR_ACCOUNT_NOT_IN_GOOD_STANDING)"
        side_effects: ["increments PurchaseOrder.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /library/purchase-orders/{id}/reject"
        actor: BillingManager
        preconditions:
          - "PurchaseOrder.status == SUBMITTED"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "system (cascade when CustomerAccount.standing flips GOOD → HOLD/BARRED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PurchaseOrder.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "system (cascade when CustomerAccount.standing returns to GOOD)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PurchaseOrder.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (daily sweep when now > valid_until)"
        actor: system
        preconditions:
          - "No non-terminal RentalOrders reference this PO (ERR_PO_HAS_OPEN_ORDERS)"
        side_effects: []
      - from: APPROVED
        to: CLOSED
        trigger: "POST /library/purchase-orders/{id}/close"
        actor: BillingManager
        preconditions:
          - "PurchaseOrder.status == APPROVED (ERR_INVALID_STATE)"
          - "No non-terminal RentalOrders reference this PO (ERR_PO_HAS_OPEN_ORDERS)"
        side_effects: ["increments PurchaseOrder.version by 1"]

  - entity: DamageInvoice
    initial_state: DRAFT
    terminal_states: [PAID, RESOLVED_ACCEPTED, RESOLVED_WAIVED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /library/damage-invoices/{id}/issue"
        actor: BillingManager
        preconditions:
          - "DamageInvoice.status == DRAFT (ERR_INVALID_STATE)"
          - "Segregation of duties: issuer X-User-ID != ConditionReport.assessor_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ConditionReport.status → INVOICED"
          - "CustomerAccount.open_exposure_cents and settled_exposure_cents recompute (invoice now counts in both); increments CustomerAccount.version by 1"
          - "If settled_exposure_cents >= credit_limit_cents (and credit_limit_cents > 0): CustomerAccount.standing → HOLD, cascading PO suspension; increments CustomerAccount.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "system (cascade from RentalOrder dispute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /library/damage-invoices/{id}/record-payment"
        actor: BillingManager
        preconditions:
          - "DamageInvoice.status in {ISSUED, DISPUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "Account exposures recompute (invoice leaves both exposure sets); increments CustomerAccount.version by 1"
      - from: DISPUTED
        to: PAID
        trigger: "POST /library/damage-invoices/{id}/record-payment"
        actor: BillingManager
        preconditions:
          - "DamageInvoice.status in {ISSUED, DISPUTED}"
        side_effects: ["Same exposure recompute as ISSUED → PAID"]
      - from: DISPUTED
        to: RESOLVED_ACCEPTED
        trigger: "POST /library/damage-invoices/{id}/resolve"
        actor: BillingManager
        preconditions:
          - "DamageInvoice.status == DISPUTED (ERR_INVALID_STATE)"
          - "Segregation of duties: resolver X-User-ID != ConditionReport.assessor_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["Amount stands; exposures recompute as if PAID"]
      - from: DISPUTED
        to: RESOLVED_WAIVED
        trigger: "POST /library/damage-invoices/{id}/resolve"
        actor: BillingManager
        preconditions:
          - "DamageInvoice.status == DISPUTED"
          - "Segregation of duties check as above"
        side_effects: ["Amount waived (collected 0); exposures recompute; compensating invariant on outstanding balance holds"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /library/damage-invoices/{id}/reissue"
        actor: BillingManager
        preconditions:
          - "DamageInvoice.status == DISPUTED (ERR_INVALID_STATE)"
          - "A SUPERSEDING ConditionReport (status FILED) exists for the same line with a different assessed_charge_cents (ERR_REASSESSMENT_REQUIRED)"
        side_effects:
          - "Old ConditionReport → SUPERSEDED; new report → INVOICED; amount_cents updated to new assessed_charge_cents"
          - "Exposures recompute; increments CustomerAccount.version by 1"

  - entity: PerusalRequest
    initial_state: REQUESTED
    terminal_states: [RETURNED, CONVERTED, EXPIRED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /library/perusal-requests/{id}/approve"
        actor: LibraryClerk
        preconditions:
          - "PerusalRequest.status == REQUESTED (ERR_INVALID_STATE)"
          - "Work.perusal_allowed == true and Work.status == CATALOGED and Publisher.status == ACTIVE (ERR_PERUSAL_NOT_ALLOWED)"
          - "format == DIGITAL implies Publisher.allows_digital_perusal and Work.license_format != PRINT_ONLY (ERR_LICENSE_FORMAT_NOT_AVAILABLE)"
          - "CustomerAccount.account_kind in {SCHOOL, INSTITUTION} (ERR_PERUSAL_REQUIRES_INSTITUTION)"
          - "CustomerAccount.standing == GOOD (ERR_ACCOUNT_NOT_IN_GOOD_STANDING)"
          - "Temporal overlap (closed interval with buffer): no other APPROVED/SHIPPED/OVERDUE_PERUSAL perusal on the same work whose [hold_start, hold_end] intersects the new [ship_date, ship_date + 21d + 3d] — adjacency forbidden, requires new.hold_start > existing.hold_end (ERR_PERUSAL_HOLD_CONFLICT)"
        side_effects:
          - "ship_date = now; return_due_date = now + 21d; hold interval [ship_date, ship_date + 24d] reserved"
          - "increments PerusalRequest.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /library/perusal-requests/{id}/reject"
        actor: LibraryClerk
        preconditions:
          - "PerusalRequest.status == REQUESTED"
        side_effects: []
      - from: APPROVED
        to: SHIPPED
        trigger: "POST /library/perusal-requests/{id}/ship"
        actor: LibraryClerk
        preconditions:
          - "PerusalRequest.status == APPROVED (ERR_INVALID_STATE)"
        side_effects: ["increments PerusalRequest.version by 1"]
      - from: SHIPPED
        to: OVERDUE_PERUSAL
        trigger: "system (daily sweep when now > return_due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "CustomerAccount.standing → HOLD if GOOD; increments CustomerAccount.version by 1"
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /library/perusal-requests/{id}/record-return"
        actor: ReturnsClerk
        preconditions:
          - "PerusalRequest.status in {SHIPPED, OVERDUE_PERUSAL} (ERR_INVALID_STATE)"
        side_effects:
          - "If account standing was HOLD solely due to this perusal and no other overdue items, restore GOOD; increments CustomerAccount.version by 1"
      - from: OVERDUE_PERUSAL
        to: RETURNED
        trigger: "POST /library/perusal-requests/{id}/record-return"
        actor: ReturnsClerk
        preconditions:
          - "PerusalRequest.status in {SHIPPED, OVERDUE_PERUSAL}"
        side_effects: ["Same standing restoration check as SHIPPED → RETURNED"]
      - from: SHIPPED
        to: CONVERTED
        trigger: "POST /library/perusal-requests/{id}/convert"
        actor: LibraryClerk
        preconditions:
          - "PerusalRequest.status == SHIPPED (ERR_INVALID_STATE)"
          - "converted_target_kind in {RENTAL, PURCHASE} supplied in request"
          - "For RENTAL: all RentalOrder reserve preconditions hold (delegates to reserve chain)"
          - "For PURCHASE: CustomerAccount.standing == GOOD (ERR_ACCOUNT_NOT_IN_GOOD_STANDING)"
        side_effects:
          - "Creates RentalOrder (RESERVED) or SaleRecord (INVOICED with perusal conversion discount per perusal_conversion_credit); converted_target_id recorded"
          - "increments PerusalRequest.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (daily sweep when APPROVED for > 10 days without ship)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerAccount
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: HOLD
        trigger: "system (overdue sweep, invoice issuance crossing credit limit, or overdue perusal)"
        actor: system
        preconditions: []
        side_effects:
          - "All APPROVED PurchaseOrders of the account → SUSPENDED; increments each PurchaseOrder.version by 1"
          - "increments CustomerAccount.version by 1"
      - from: HOLD
        to: GOOD
        trigger: "system (when no OVERDUE rentals, no OVERDUE_PERUSAL perusals, and settled_exposure_cents < credit_limit_cents or credit_limit_cents == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "All SUSPENDED PurchaseOrders of the account → APPROVED; increments each PurchaseOrder.version by 1"
          - "increments CustomerAccount.version by 1"
      - from: HOLD
        to: BARRED
        trigger: "POST /library/customer-accounts/{id}/bar"
        actor: BillingManager
        preconditions:
          - "CustomerAccount.standing == HOLD (ERR_INVALID_STATE)"
        side_effects: ["increments CustomerAccount.version by 1"]
      - from: BARRED
        to: GOOD
        trigger: "POST /library/customer-accounts/{id}/reinstate"
        actor: BillingManager
        preconditions:
          - "CustomerAccount.standing == BARRED"
          - "No OVERDUE rentals and no OVERDUE_PERUSAL perusals (ERR_ACCOUNT_STILL_DELINQUENT)"
        side_effects:
          - "SUSPENDED POs → APPROVED; increments CustomerAccount.version by 1"

  - entity: RightsAdvisoryCase
    initial_state: OPEN
    terminal_states: [DECIDED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "POST /library/rights-advisory-cases/{id}/decide"
        actor: RightsAdvisor
        preconditions:
          - "RightsAdvisoryCase.status == OPEN (ERR_INVALID_STATE)"
          - "determination in {CLEARED, LICENSE_REQUIRED, PROHIBITED} supplied (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by_user_id recorded; determination set"
          - "increments RightsAdvisoryCase.version by 1"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /library/rights-advisory-cases/{id}/withdraw"
        actor: Customer
        preconditions:
          - "RightsAdvisoryCase.status == OPEN"
          - "Acting Customer belongs to the case account (ERR_FORBIDDEN_ACCOUNT)"
        side_effects: []

  - entity: Publisher
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /library/publishers/{id}"
        actor: LibraryAdmin
        preconditions:
          - "Publisher.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "increments Publisher.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /library/publishers/{id}"
        actor: LibraryAdmin
        preconditions:
          - "Publisher.status == SUSPENDED"
        side_effects: ["increments Publisher.version by 1"]

  - entity: RentalSet
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: UNDER_REPAIR
        trigger: "system (when any RETURNED line grades D at check-in) or PATCH /library/rental-sets/{id}"
        actor: system
        preconditions: []
        side_effects: ["increments RentalSet.version by 1"]
      - from: UNDER_REPAIR
        to: IN_SERVICE
        trigger: "PATCH /library/rental-sets/{id} (repair complete: condition_grade lifted above D)"
        actor: LibraryAdmin
        preconditions:
          - "RentalSet.status == UNDER_REPAIR (ERR_INVALID_STATE)"
        side_effects: ["increments RentalSet.version by 1"]
      - from: IN_SERVICE
        to: RETIRED
        trigger: "PATCH /library/rental-sets/{id}"
        actor: LibraryAdmin
        preconditions:
          - "RentalSet.status == IN_SERVICE"
          - "No lines in RESERVED/DISPATCHED/ON_LOAN/OVERDUE (ERR_SET_HAS_OPEN_LOANS)"
        side_effects: ["increments RentalSet.version by 1"]

  - entity: SaleRecord
    initial_state: INVOICED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: INVOICED
        to: PAID
        trigger: "POST /library/sale-records/{id}/record-payment"
        actor: BillingManager
        preconditions:
          - "SaleRecord.status == INVOICED (ERR_INVALID_STATE)"
        side_effects: ["balance_due_cents → 0; account exposures recompute; increments CustomerAccount.version by 1"]
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "POST /library/sale-records/{id}/write-off"
        actor: BillingManager
        preconditions:
          - "SaleRecord.status == INVOICED"
        side_effects: ["balance_due_cents → 0 (written off); exposures recompute; increments CustomerAccount.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: rental-order-amend-stale-version
    parent_entity: RentalOrder
    write_endpoint: "POST /library/rental-orders/{id}/renew"
    occ_field: "expected_rental_order_version"
    description: |
      Renewing a RentalOrder whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just renewed, checked in, disputed, or otherwise mutated the same order
      (each legitimately advancing the version) and the current writer's view
      of the order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: account-credit-adjust-stale-version
    parent_entity: CustomerAccount
    write_endpoint: "POST /library/customer-accounts/{id}/credit-adjustments"
    occ_field: "expected_customer_account_version"
    description: |
      Applying a manual credit-limit adjustment to a CustomerAccount whose
      version has advanced since the client last observed it is rejected. This
      captures the case where a cascade (invoice issuance, sweep-driven standing
      flip, exposure recompute) has just mutated the account and the current
      writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_fee_estimate
    trigger: "RentalOrder reserve and renew (provisional)"
    algorithm: tiered_pricing
    formula: |
      loan_periods = max(1, ceil((due_date - checkout_date) / 30 days))
      tier_rate = base rate for Work.ensemble_tier:
        CHAMBER → Work.base_rental_rate_cents
        BAND    → Work.base_rental_rate_cents * BAND_TIER_MULT (1.5)
        ORCHESTRA → Work.base_rental_rate_cents * ORCH_TIER_MULT (2.0)
      per_copy_per_period = round_half_up(tier_rate)
      volume_discount_pct = tiered on copies_requested:
        1–9 copies   → 0%
        10–24 copies → 10%
        25+ copies   → 20%
      gross = per_copy_per_period * loan_periods * copies_requested
      net = round_half_up(gross * (1 - volume_discount_pct) * (1 - Publisher.rental_discount_pct))
      if fulfillment_format == DIGITAL: net = round_half_up(net * DIGITAL_FEE_FACTOR (0.80))
      estimated_fee_cents = net
    input_set: "the RentalOrder, its Work, and its Publisher; no other orders"
    constants:
      LOAN_PERIOD_DAYS: 30
      BAND_TIER_MULT: 1.5
      ORCH_TIER_MULT: 2.0
      VOLUME_TIER_1_QTY: 10
      VOLUME_TIER_1_DISC: 0.10
      VOLUME_TIER_2_QTY: 25
      VOLUME_TIER_2_DISC: 0.20
      DIGITAL_FEE_FACTOR: 0.80
    precision: "integer cents, round_half_up at each annotated rounding step; rounding order: per-copy-per-period tier rate first, then gross, then net, then digital factor"
    variants:
      - name: provisional
        when: "at reserve and renew"
        difference: "assumes on-time return at current due_date; no late surcharge"
      - name: at_settlement_projection
        when: "returned by GET /library/rental-orders/{id}/settlement-preview while ON_LOAN/OVERDUE"
        difference: "same formula but loan_periods recomputed against max(due_date, current clock date) so an overdue order projects extended-period fees"

  - name: rental_fee_final
    trigger: "RentalOrder check-in"
    algorithm: chronological
    formula: |
      base = rental_fee_estimate(provisional) evaluated against the FINAL
             [checkout_date, due_date] window (renewals already folded into due_date)
      late_days = max(0, whole_days(return_date - due_date))
      late surcharge (tiered per copy per day, applied to ALL copies on the order):
        LATE_TIER_1_DAYS (1–7):   per_copy_day = round_half_up(base / (loan_periods * copies_requested * LOAN_PERIOD_DAYS) * LATE_RATE_1 (0.10))
        LATE_TIER_2_DAYS (8–30):  per_copy_day = round_half_up(same daily base * LATE_RATE_2 (0.25))
        LATE_TIER_3_DAYS (31+):   per_copy_day = round_half_up(same daily base * LATE_RATE_3 (0.50))
      daily_base = round_half_up(base / (loan_periods * copies_requested * LOAN_PERIOD_DAYS))
      late_cents = late_days_in_tier1 * copies * rate1
                 + late_days_in_tier2 * copies * rate2
                 + late_days_in_tier3 * copies * rate3
      where late_days split chronologically: first 7 late days at tier 1,
      next 23 at tier 2, remainder at tier 3
      final_fee_cents = base + late_cents
    input_set: "the RentalOrder and its final dates; return_date = current clock date at check-in"
    constants:
      LOAN_PERIOD_DAYS: 30
      LATE_TIER_1_DAYS: 7
      LATE_TIER_2_DAYS: 30
      LATE_RATE_1: 0.10
      LATE_RATE_2: 0.25
      LATE_RATE_3: 0.50
    precision: "integer cents, round_half_up; daily_base rounded once before tier rates are derived from it"
    variants:
      - name: on_time
        when: "return_date <= due_date"
        difference: "late_cents == 0; final == provisional base"
      - name: late
        when: "return_date > due_date"
        difference: "adds tiered late surcharge; always >= provisional estimate"

  - name: damage_charge
    trigger: "ConditionReport filed at check-in or line reported lost"
    algorithm: tiered_pricing
    formula: |
      if observed_grade <= checkout_condition in quality order A>B>C>D (LOST handled separately):
        assessed_charge_cents = 0   # no degradation
      else:
        per_copy_value = round_half_up(RentalSet.replacement_value_cents / RentalSet.copy_count)
        grade_fraction:
          checkout A → return B: 0.10
          checkout A → return C: 0.30
          checkout A → return D: 0.60
          checkout B → return C: 0.25
          checkout B → return D: 0.50
          checkout C → return D: 0.35
        raw = round_half_up(per_copy_value * grade_fraction)
        floor = min(raw, DAMAGE_CAP_CENTS (200000))
        assessed_charge_cents = max(floor, DAMAGE_FLOOR_CENTS (1500))
      if observed_grade == LOST:
        assessed_charge_cents = round_half_up(RentalSet.replacement_value_cents / RentalSet.copy_count)
    input_set: "the RentalLine's checkout_condition, the ConditionReport.observed_grade, and the RentalSet"
    constants:
      DAMAGE_CAP_CENTS: 200000
      DAMAGE_FLOOR_CENTS: 1500
    precision: "integer cents, round_half_up; per_copy_value rounded before multiplying by fraction"

  - name: account_exposure
    trigger: "any mutation touching invoices, rentals, or sales of the account"
    algorithm: aggregation
    formula: |
      open_exposure_cents =
          sum(DamageInvoice.amount_cents where status in {DRAFT, ISSUED, DISPUTED})
        + sum(RentalOrder.estimated_fee_cents where status in {RESERVED, DISPATCHED, ON_LOAN, OVERDUE})
        + sum(RentalOrder.final_fee_cents where status in {RETURNED, DISPUTED} and final_fee_cents set)
        + sum(SaleRecord.balance_due_cents where status == INVOICED)
      settled_exposure_cents =
          sum(DamageInvoice.amount_cents where status in {ISSUED, DISPUTED})
        + sum(RentalOrder.estimated_fee_cents where status in {DISPATCHED, ON_LOAN, OVERDUE})
        + sum(RentalOrder.final_fee_cents where status in {RETURNED, DISPUTED} and final_fee_cents set)
        + sum(SaleRecord.balance_due_cents where status == INVOICED)
      (DRAFT invoices and RESERVED-order estimates are excluded from settled;
      RESERVED orders have not yet created an obligation)
    input_set: "all invoices/orders/sales of the account filtered by the status sets above"
    constants: {}
    precision: "integer cents"
    variants:
      - name: open
        when: "displayed as open_exposure_cents; used for informational reads"
        difference: "includes DRAFT damage invoices and RESERVED rental estimates"
      - name: settled
        when: "credit-limit enforcement at reserve/dispatch; displayed as settled_exposure_cents"
        difference: "excludes DRAFT invoices and RESERVED orders; the two variants diverge whenever either exists"

  - name: perusal_conversion_credit
    trigger: "PerusalRequest convert to PURCHASE (SaleRecord creation)"
    algorithm: aggregation
    formula: |
      discount_pct = PERUSAL_DISCOUNT (0.15) when the sale is a conversion, else 0
      per_line_price = round_half_up(Work.sale_price_cents * (1 - discount_pct))   # round PER LINE first
      total_cents = per_line_price * quantity                                      # then multiply
      unit_price_cents = per_line_price
      balance_due_cents = total_cents
      (Pinned rounding order: round per unit BEFORE multiplying by quantity.
       round(sum) vs sum(round-per-line) diverge by up to (quantity-1)/2 cents;
       this scaffold pins per-unit-then-multiply.)
    input_set: "the Work and the converting PerusalRequest"
    constants:
      PERUSAL_DISCOUNT: 0.15
    precision: "integer cents, round_half_up, per-unit rounding pinned before quantity multiply"

  - name: set_availability_projection
    trigger: "reserve / renew overlap evaluation (selector + capacity)"
    algorithm: interval_merge
    formula: |
      candidate copies = RentalSet.copy_count - count(RentalLine where
        status in {RESERVED, DISPATCHED, ON_LOAN, OVERDUE}
        and [line_order.checkout_date, line_order.due_date) overlaps
            [new.checkout_date, new.due_date)  — half-open: touching endpoints
            (existing.due_date == new.checkout_date or new.due_date == existing.checkout_date)
            do NOT overlap)
      allocation feasible iff copies_requested <= candidate copies
      selector (which existing lines block): ALL overlapping non-terminal lines;
      processing order for any batch sweep: due_date ASC, then created_at ASC
    input_set: "all RentalLines of the set in the listed statuses, interval-overlap filtered"
    constants: {}
    precision: "whole days; dates compared as ISO dates at day granularity"
    variants:
      - name: renewal_recheck
        when: "renew"
        difference: "the order's own lines are excluded from the blocker set (an order never blocks itself)"

  - name: out_of_print_sourcing_eta
    trigger: "GET /library/works/{id}/sourcing-quote when Publisher.out_of_print == true"
    algorithm: forward_looking
    formula: |
      base_days = OOP_BASE_DAYS (45)
      if Work.rights_class == GRAND_RIGHTS: base_days += 30
      if Work.rights_class == RESTRICTED:   base_days += 60
      if RentalSet for the work exists with condition_grade in {A, B}: base_days -= 15 (floor 7)
      estimated_days = max(base_days, 7)
      quoted_expiry = now + estimated_days
    input_set: "the Work, its Publisher, its RentalSets (status IN_SERVICE or UNDER_REPAIR)"
    constants:
      OOP_BASE_DAYS: 45
    precision: "whole days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints except POST /library/_clock/set_current_utc and POST /library/_sweep/run_daily (system endpoints require LibraryAdmin anyway)"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (account before order before line)"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_PUBLISHER_NOT_FOUND | ERR_WORK_NOT_FOUND | ERR_RENTAL_SET_NOT_FOUND | ERR_PO_NOT_FOUND | ERR_RENTAL_ORDER_NOT_FOUND | ERR_RENTAL_LINE_NOT_FOUND | ERR_CONDITION_REPORT_NOT_FOUND | ERR_DAMAGE_INVOICE_NOT_FOUND | ERR_PERUSAL_REQUEST_NOT_FOUND | ERR_SALE_RECORD_NOT_FOUND | ERR_RIGHTS_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: state
    check: "Target resource in a state that permits the transition (per §1.2 from-states)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: DamageInvoice issue/resolve actor must differ from the ConditionReport assessor on the same line"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /library/damage-invoices/{id}/issue, POST /library/damage-invoices/{id}/resolve"
  - priority: 6
    category: business_safety
    check: "Rights clearance: dispatch of GRAND_RIGHTS/RESTRICTED works requires a DECIDED RightsAdvisoryCase with determination == CLEARED for (account, work)"
    error_id: ERR_RIGHTS_NOT_CLEARED
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/dispatch"
  - priority: 7
    category: business_constraint
    check: "License format: DIGITAL fulfillment/perusal only when work license_format and publisher flags permit (evaluated at reserve for rentals, at approve for perusals; creation stores the request unchecked)"
    error_id: ERR_LICENSE_FORMAT_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /library/rental-orders/{id}/reserve, POST /library/perusal-requests/{id}/approve"
  - priority: 8
    category: business_constraint
    check: "Rentability: set IN_SERVICE and grade != D; work CATALOGED; publisher ACTIVE"
    error_id: "ERR_RENTAL_SET_NOT_RENTABLE | ERR_WORK_NOT_RENTABLE"
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/reserve"
  - priority: 9
    category: business_temporal
    check: "Copy overlap (half-open): requested window must leave copies_requested allocatable copies on the set"
    error_id: ERR_INSUFFICIENT_COPIES
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/reserve"
  - priority: 10
    category: business_temporal
    check: "Renewal overlap (half-open, self-excluding): extended window must not collide with other orders on the set"
    error_id: ERR_RENEWAL_CONFLICT
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/renew"
  - priority: 11
    category: business_temporal
    check: "Perusal hold overlap (closed + 3-day quarantine buffer): new hold must satisfy new.hold_start > existing.hold_end for every other live perusal on the work"
    error_id: ERR_PERUSAL_HOLD_CONFLICT
    http_status: 409
    applies_to: "POST /library/perusal-requests/{id}/approve"
  - priority: 12
    category: business_referential
    check: "PO usability: present when required, APPROVED, within validity window"
    error_id: ERR_PO_NOT_USABLE
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/reserve, POST /library/rental-orders/{id}/dispatch"
  - priority: 13
    category: business_fiscal
    check: "PO amount: encumbered_cents + estimated_fee_cents <= authorized_amount_cents"
    error_id: ERR_PO_AMOUNT_EXCEEDED
    http_status: 402
    applies_to: "POST /library/rental-orders/{id}/reserve, POST /library/rental-orders/{id}/renew"
  - priority: 14
    category: business_fiscal
    check: "Credit limit: settled_exposure_cents + estimated_fee_cents <= credit_limit_cents (when credit_limit_cents > 0); PREPAY accounts skip this check and instead must prepay at dispatch"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /library/rental-orders/{id}/reserve"
  - priority: 15
    category: business_fiscal
    check: "PREPAY prepayment: prepayment_cents >= estimated_fee_cents at dispatch"
    error_id: ERR_PREPAYMENT_REQUIRED
    http_status: 402
    applies_to: "POST /library/rental-orders/{id}/dispatch"
  - priority: 16
    category: business_referential
    check: "Standing gate: account standing must be GOOD for reserve / dispatch / PO approve / perusal approve"
    error_id: ERR_ACCOUNT_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/reserve, POST /library/rental-orders/{id}/dispatch, POST /library/purchase-orders/{id}/approve, POST /library/perusal-requests/{id}/approve, POST /library/rental-orders/{id}/renew"
  - priority: 17
    category: business_constraint
    check: "Institution-only operations: POs and perusal requests require SCHOOL/INSTITUTION accounts"
    error_id: "ERR_PO_REQUIRES_INSTITUTION | ERR_PERUSAL_REQUIRES_INSTITUTION"
    http_status: 422
    applies_to: "POST /library/purchase-orders (create), POST /library/purchase-orders/{id}/approve, POST /library/perusal-requests, POST /library/perusal-requests/{id}/approve"
  - priority: 18
    category: business_constraint
    check: "Renewal cap: renewal_count < 2"
    error_id: ERR_RENEWAL_CAP_REACHED
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/renew"
  - priority: 19
    category: business_constraint
    check: "Input shape: required fields present, enums valid, due_date > checkout_date, quantities >= 1, dates well-formed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 20
    category: state
    check: "OCC: expected_<parent>_version equals current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /library/rental-orders/{id}/renew, POST /library/customer-accounts/{id}/credit-adjustments"
  - priority: 21
    category: business_constraint
    check: "Dispute/settle integrity: dispute requires an ISSUED invoice; settle requires all invoices terminal; resolve-dispute requires all disputes resolved"
    error_id: "ERR_NOTHING_TO_DISPUTE | ERR_UNSETTLED_DAMAGE_INVOICES | ERR_UNRESOLVED_DISPUTES"
    http_status: 409
    applies_to: "POST /library/rental-orders/{id}/dispute, POST /library/rental-orders/{id}/settle, POST /library/rental-orders/{id}/resolve-dispute"
  - priority: 22
    category: business_referential
    check: "Ownership: Customer role may act only on resources of its own account"
    error_id: ERR_FORBIDDEN_ACCOUNT
    http_status: 403
    applies_to: "POST /library/rental-orders/{id}/confirm-receipt, POST /library/rental-orders/{id}/dispute, POST /library/rights-advisory-cases/{id}/withdraw"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock & sweep (test-driving/system) ---
  - method: POST
    path: "/library/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [LibraryAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced"]
  - method: POST
    path: "/library/_sweep/run_daily"
    description: "Run the daily batch: overdue rentals → OVERDUE, overdue perusals → OVERDUE_PERUSAL, stale APPROVED perusals → EXPIRED, PO expiry, standing recompute with PO cascade"
    roles: [LibraryAdmin]
    code: 200
    output: { swept_rentals: integer, swept_perusals: integer, swept_pos: integer, standing_flips: integer }
    input: []
    side_effects: ["all daily system transitions in §1.2"]

  # --- Publisher ---
  - method: POST
    path: "/library/publishers"
    description: "Create publisher"
    roles: [LibraryAdmin]
    code: 201
    input: [name, "rental_discount_pct?", "allows_digital_perusal?", "print_only_rental?", "out_of_print?"]
    output: Publisher
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/library/publishers"
    description: "List publishers"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Publisher[]"
    side_effects: []
  - method: GET
    path: "/library/publishers/{id}"
    description: "Get publisher"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: []
    output: Publisher
    side_effects: []
  - method: PATCH
    path: "/library/publishers/{id}"
    description: "Update publisher flags or suspend/reactivate"
    roles: [LibraryAdmin]
    code: 200
    input: ["rental_discount_pct?", "allows_digital_perusal?", "print_only_rental?", "out_of_print?", "status?"]
    output: Publisher
    side_effects: ["status transition per §1.2 Publisher; increments Publisher.version by 1"]

  # --- Work ---
  - method: POST
    path: "/library/works"
    description: "Catalog a work"
    roles: [LibraryAdmin]
    code: 201
    input: [publisher_id, title, catalog_number, ensemble_tier, base_rental_rate_cents, sale_price_cents, license_format, "perusal_allowed?", "rights_class?"]
    output: Work
    side_effects: ["status = CATALOGED"]
  - method: GET
    path: "/library/works"
    description: "List works"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: ["publisher_id?", "limit?", "offset?"]
    output: "Work[]"
    side_effects: []
  - method: GET
    path: "/library/works/{id}"
    description: "Get work"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: []
    output: Work
    side_effects: []
  - method: GET
    path: "/library/works/{id}/sourcing-quote"
    description: "Out-of-print sourcing ETA quote"
    roles: [LibraryAdmin, LibraryClerk]
    code: 200
    input: []
    output: { estimated_days: integer, quoted_expiry: string }
    side_effects: []
  - method: PATCH
    path: "/library/works/{id}"
    description: "Withdraw or re-catalog a work, or update pricing"
    roles: [LibraryAdmin]
    code: 200
    input: ["status?", "base_rental_rate_cents?", "sale_price_cents?", "perusal_allowed?", "rights_class?"]
    output: Work
    side_effects: ["increments Work.version by 1"]

  # --- RentalSet ---
