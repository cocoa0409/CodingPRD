  - rule_id: cross_entity_state_dependency
    instances:
      - name: appraisal_intake_blocked_by_suspended_amc
        grounds:
          - validations.priority_23_ERR_AMC_NOT_ELIGIBLE
          - entities.AMC.fields.panel_status
          - state_machines.AMC.ACTIVE_to_SUSPENDED
          - endpoints.POST_appraisals
          - errors.ERR_AMC_NOT_ELIGIBLE
        distinguishing_aspect: |
          Entity pair Appraisal -> AMC: whether an appraisal may be received depends on a state
          field of a THIRD entity (the ordering AMC), not on anything in the request or in the
          loan file. Every field of the request is individually valid and the appraiser is
          properly panelled; only the AMC's panel_status makes the write illegal.
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z."
            - "AMC created directly in panel_status SUSPENDED (panel_status is an input field with default ACTIVE)."
            - "One ACTIVE appraiser holding an ACTIVE PanelMembership with that AMC -- membership creation is not gated on AMC standing, so this succeeds and rules 24/25 cannot fire."
            - "A fresh STANDARD loan file whose collateral_status is still PENDING_APPRAISAL, read immediately before the trigger so the OCC version is current and rule 10 cannot fire."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Lapsed Appraisal Management", panel_status: "SUSPENDED" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-7001", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-7A1", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Kai Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
          trigger:
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 7, narrative_text: "Average condition, typical marketability for the market area.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
          assert:
            - "HTTP 422 with error_id == ERR_AMC_NOT_ELIGIBLE"
            - "GET /appraisal-desk/appraisals filtered by loan_file_id == ${lf1_id} returns total_count == 0"
            - "LoanFile.${lf1_id}.collateral_status == PENDING_APPRAISAL and value_of_record_appraisal_id is null"
            - "LoanFile.${lf1_id}.version is unchanged from ${lf1_v}"
            - "Appraiser.${apr_a_id}.total_appraisal_count == 0 and panel_membership_count == 1"

      - name: second_appraisal_assignment_blocked_by_probation_appraiser
        grounds:
          - validations.priority_26_ERR_APPRAISER_INELIGIBLE
          - entities.Appraiser.fields.panel_status
