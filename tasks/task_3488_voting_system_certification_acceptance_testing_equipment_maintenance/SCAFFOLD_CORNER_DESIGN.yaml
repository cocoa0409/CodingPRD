  # ===========================================================================
  - section: endpoints
    instances:
      - name: procurements_list_paginates_with_total_count
        claim_type: Standard CRUD
        grounds: ["endpoints.GET_/evote/procurements", "response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "With three procurements, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["Certified system; jurisdiction (budget 100,000,000) with three PLACED procurements."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_proc
            - call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 5, unit_price_cents: 1000000 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 2, unit_price_cents: 500000 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "GET /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", limit: 2, offset: 0 }
              as: Auditor
            - call: "GET /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", limit: 2, offset: 2 }
              as: Auditor
          assert:
            - "page 1: 2 rows, meta.total_count == 3, meta.has_more == true"
            - "page 2 (offset 2): 1 row, meta.total_count == 3, meta.has_more == false"

      - name: success_envelope_shape_on_create
        claim_type: Standard CRUD
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type and data; every error response carries response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["Logical clock set."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /evote/jurisdictions"
              payload: { name: "Envelope County", state_code: "CA", budget_total_cents: 1000 }
              as: PlatformAdmin
              captures: { env_id: $.data.id }
            - call: "GET /evote/jurisdictions/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "create response: meta.api_request_id and meta.api_request_timestamp present, response_type == object"
            - "error response: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

      - name: public_documentation_reflects_published_audits
        claim_type: Computed Read
        grounds: ["endpoints.GET_/evote/public/voting-systems/{id}/documentation", "entities.PostElectionAudit.fields.report_public"]
        distinguishing_aspect: "The public transparency read counts only published audits: public_audit_count is 0 while the closed audit is unpublished and becomes 1 after the publish endpoint runs — public access needs no jurisdiction identity."
        test_recipe:
          setup: ["Certified system; CANVASSING definition; audit CLOSED_CONFIRMED but not yet published."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_off2
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - *k_hwtest
            - *k_caltest
            - *k_accept
            - *k_ed
            - *k_layout
            - *k_program
            - *k_la
            - *k_la_cert
            - call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "LA_PASSED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - *k_lock
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T08:00:00Z" }
              as: PlatformAdmin
            - *k_canvass
            - call: "POST /evote/post-election-audits"
              payload: { election_definition_id: "${ed_id}", audit_type: "RISK_LIMITING" }
              as: Auditor
              captures: { aud_id: $.data.id }
            - call: "POST /evote/post-election-audits/${aud_id}/transitions"
              payload: { to_state: "FINDINGS_FILED", critical_findings: 0, major_findings: 1, minor_findings: 0 }
              as: Auditor
            - call: "POST /evote/post-election-audits/${aud_id}/transitions"
              payload: { to_state: "CLOSED_CONFIRMED" }
              as: Auditor
          trigger:
            - call: "GET /evote/public/voting-systems/${sys_id}/documentation"
              payload: {}
              as: PublicRequester
              captures: { pre_count: $.data.public_audit_count }
            - call: "POST /evote/post-election-audits/${aud_id}/publish"
              payload: {}
              as: Auditor
            - call: "GET /evote/public/voting-systems/${sys_id}/documentation"
              payload: {}
              as: PublicRequester
              captures: { post_count: $.data.public_audit_count, doc_status: $.data.system_status }
          assert:
            - "before publish: public_audit_count == 0"
            - "after publish: public_audit_count == 1"
            - "documentation shows system_status == FIELDED, active_certificate_count == 1, campaign_count == 1"
            - "PostElectionAudit.${aud_id}.report_public == true and published_at == 2026-11-03T08:00:00Z"

  # ===========================================================================
  - section: rbac
    instances:
      - name: vendor_cannot_certify_campaign
        claim_type: Role Denial
        grounds: ["roles.VendorRep", "roles.CertificationAuthority", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "CERTIFIED is the CertificationAuthority's transition: a VendorRep (allowed on the endpoint for resubmit/withdraw) is still denied at transition level with 403."
        test_recipe:
          setup: ["Campaign IN_TEST with zero open deficiencies."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
          trigger:
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: VendorRep
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 with error_id == ERR_UNAUTHORIZED"
            - "campaign remains IN_TEST"

      - name: public_requester_cannot_create_procurement
        claim_type: Role Denial
        grounds: ["roles.PublicRequester", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "PublicRequester is read-only: POST /evote/procurements is 403 regardless of payload validity."
        test_recipe:
          setup: ["Certified system, jurisdiction, certificate."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
          trigger:
            - call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 1, unit_price_cents: 100 }
              as: PublicRequester
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED"

      - name: auditor_cannot_create_equipment_unit
        claim_type: Role Denial
        grounds: ["roles.Auditor", "roles.ElectionOfficial", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Equipment operations belong to ElectionOfficial; the Auditor's write surface is audits only (403)."
        test_recipe:
          setup: ["FIELDED system and jurisdiction with official."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_jur
            - *k_off1
          trigger:
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-9001", initial_custodian_id: "${off1_id}" }
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED"

      - name: official_cannot_classify_modification
        claim_type: Role Denial
        grounds: ["roles.CertificationAuthority", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Modification classification is reserved to the CertificationAuthority; an ElectionOfficial hitting the classify transition is 403."
        test_recipe:
          setup: ["System with one PROPOSED modification."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - call: "GET /evote/voting-systems/${sys_id}"
              payload: {}
              as: VendorRep
              captures: { sys_v: $.data.version }
            - call: "POST /evote/software-modifications"
              payload: { voting_system_id: "${sys_id}", description: "EMS tweak", component_codes: ["ELECTION_MANAGEMENT_UI"], expected_voting_system_version: "${sys_v}" }
              as: VendorRep
              captures: { mod_id: $.data.id }
          trigger:
            - call: "POST /evote/software-modifications/${mod_id}/transitions"
              payload: { to_state: "DE_MINIMIS_APPROVED" }
              as: ElectionOfficial
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED"

      - name: lab_agent_cannot_certify_campaign
        claim_type: Role Denial
        grounds: ["roles.LabAgent", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "LabAgent may begin testing and file deficiencies but may not certify: CERTIFIED as LabAgent is 403 even on its own laboratory's campaign."
        test_recipe:
          setup: ["Campaign IN_TEST."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
          trigger:
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: LabAgent
              as_user_id: "${lab_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_layout_write_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-election-definition-layout]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Layout writes are OCC-guarded on the definition version: a writer replaying version 1 after a successful write advanced it to 2 gets 412 ERR_STALE_VERSION; a writer carrying the fresh version succeeds and layout_revision increments."
        test_recipe:
          setup: ["Election definition DRAFT, version 1."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_proc
            - *k_deliver
            - *k_beginacc
            - *k_hwtest
            - *k_caltest
            - *k_accept
            - *k_ed
          trigger:
            - call: "PUT /evote/election-definitions/${ed_id}/layout"
              payload: { ballot_layout: { contests: [{ code: "PRES", choices: 4 }] }, paper_weight_gsm: 90, paper_thickness_microns: 100, paper_coating: "UNCOATED", expected_election_definition_version: "${ed_v}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "PUT /evote/election-definitions/${ed_id}/layout"
              payload: { ballot_layout: { contests: [{ code: "SEN", choices: 2 }] }, paper_weight_gsm: 90, paper_thickness_microns: 100, paper_coating: "UNCOATED", expected_election_definition_version: "${ed_v}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
            - call: "PUT /evote/election-definitions/${ed_id}/layout"
              payload: { ballot_layout: { contests: [{ code: "SEN", choices: 2 }] }, paper_weight_gsm: 90, paper_thickness_microns: 100, paper_coating: "UNCOATED", expected_election_definition_version: "${ed_v} + 1" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          assert:
            - "first write with version 1: 200, layout_revision == 1, version == 2"
            - "second write replaying version 1: 412 ERR_STALE_VERSION"
            - "third write with the fresh version (2): 200, layout_revision == 2"

      - name: occ_modification_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-voting-system-modification-create]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two modification proposals created against the same observed system version: the first succeeds and advances VotingSystem.version, the second replaying the stale version is 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["REGISTERED system at version 1 (no certification yet, so no FIELDED bump intervenes)."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - call: "GET /evote/voting-systems/${sys_id}"
              payload: {}
              as: VendorRep
              captures: { sys_v: $.data.version }
          trigger:
            - call: "POST /evote/software-modifications"
              payload: { voting_system_id: "${sys_id}", description: "mod one", component_codes: ["AUDIT_LOG_SERVICE"], expected_voting_system_version: "${sys_v}" }
              as: VendorRep
              captures: { mod1_id: $.data.id }
            - call: "POST /evote/software-modifications"
              payload: { voting_system_id: "${sys_id}", description: "mod two", component_codes: ["SECURITY_MODULE"], expected_voting_system_version: "${sys_v}" }
              as: VendorRep
              captures: { err: $.data.error_id }
          assert:
            - "first create (expected version ${sys_v} == 1): 201, modification PROPOSED"
            - "second create replaying version 1: 412 ERR_STALE_VERSION — the first create bumped VotingSystem.version to 2"
            - "VotingSystem.${sys_id}.version == 2 afterwards"

      - name: version_pinning_records_placement_certificate_version
        claim_type: version_pinning_on_approval
        grounds: ["entities.Procurement.fields.certificate_version_pinned", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "certificate_version_pinned freezes the certificate's version at placement (1); later certificate mutations (suspend -> reinstate bumps it to 3) never rewrite the pin."
        test_recipe:
          setup: ["Certificate ACTIVE at version 1; procurement placed."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_proc
          trigger:
            - call: "POST /evote/certificates/${cert_id}/transitions"
              payload: { to_state: "SUSPENDED", reason: "audit" }
              as: CertificationAuthority
            - call: "POST /evote/certificates/${cert_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: CertificationAuthority
            - call: "GET /evote/procurements/${proc_id}"
              payload: {}
              as: Auditor
              captures: { pinned: $.data.certificate_version_pinned }
          assert:
            - "Certificate.${cert_id}.version == 3 after suspend + reinstate"
            - "Procurement.${proc_id}.certificate_version_pinned == 1 (placement-time pin unchanged)"

      - name: recertification_cascade
        claim_type: cascading_side_effects
        grounds: ["state_machines.SoftwareModification.PROPOSED_to_RECERTIFICATION_PENDING"]
        excluded_because:
          difficulty_instance: "transitive_cascade / recert_classification_cascades_cert_suspend_definition_revert_la_challenge"
          rationale: "Three-hop cascade asserted hop-by-hop in the difficulty instance."

      - name: audit_escalation_cascade
        claim_type: cascading_side_effects
        grounds: ["state_machines.PostElectionAudit.FINDINGS_FILED_to_CLOSED_ESCALATED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / audit_escalation_quarantines_units_and_aborts_work_orders"
          rationale: "Quarantine-then-abort cascade asserted in the difficulty instance."

      - name: dual_variant_conformity
        claim_type: dual_variant_calculation
        grounds: ["calculations.campaign_conformity_score"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / campaign_conformity_screen_vs_final_diverge"
          rationale: "Both conformity variants asserted with literal values."

      - name: dual_variant_readiness
        claim_type: dual_variant_calculation
        grounds: ["calculations.fleet_readiness"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / fleet_readiness_optimistic_exceeds_conservative"
          rationale: "Both readiness variants asserted with literal counts."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "entities.Jurisdiction"]
        distinguishing_aspect: "Immediate consistency: a jurisdiction read in the same logical instant returns exactly the written fields plus derived ledger initialization, with no asynchronous lag."
