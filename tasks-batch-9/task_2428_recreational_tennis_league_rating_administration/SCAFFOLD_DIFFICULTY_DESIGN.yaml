  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Three DIFFERENT modes, as §0.5 requires:
  #   2a: mode (b) nested rounding whose ORDER changes the answer
  #   2c: mode (c) circular-looking dependency resolved by a pinned step order
  #   2b: mode (a) >= 3 inputs combined non-linearly (max/min/ceil clamp)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: year_end_weighted_mean_rounds_each_line_before_weighting
        grounds:
          - calculations.player_dynamic_rating
          - calculations.year_end_rating_recalculation
          - entities.Player.fields.proposed_recalc_dynamic
          - entities.RosterSpot.fields.level_at_add
          - entities.Match.fields.stage
        distinguishing_aspect: |
          Player h1's two lines are 4.000 (REGULAR, weight 1.0) and 3.5657894736... (PLAYOFF,
          weight 1.5): rounding each line_rating to 3 decimals BEFORE weighting yields
          proposed_recalc_dynamic == 3.740, while carrying the unrounded line value into the
          weighted mean yields 3.739, so the pinned order is observable in the last decimal.
        test_recipe:
          setup:
            - "h1's REGULAR line: opp_level_avg round((4.0+3.5)/2,3) = 3.750, games 12-4, game_diff_ratio 8/16 = 0.5, line_rating round(3.750 + 0.5*0.5, 3) = 4.000."
            - "h1's PLAYOFF line: opp_level_avg 3.750, games 6-13, game_diff_ratio -7/19 = -0.368421..., line_rating round(3.750 - 0.184210..., 3) = 3.566."
            - "year_end_final weights: REGULAR 1.0, PLAYOFF 1.5, so SUM(w*line_rating) = 4.000 + 5.349 = 9.349 over SUM(w) = 2.5."
