  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two cascades, DIFFERENT triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: late_deposit_confirm_cascade
        grounds:
          - state_machines.LateContributionAssessment.ASSESSED_to_CONFIRMED
          - calculations.posture_rule
          - state_machines.Form5500Filing.READY_TO_FILE_to_SCHEDULES_COMPLETE
        distinguishing_aspect: |
          Trigger = assessment confirm. Depth-4 chain: confirm flips the
          assessment CONFIRMED (link 1); the confirmation auto-creates an OPEN
          HIGH AuditFinding because business_days_late 13 > 10 (link 2); the
          new finding recomputes Engagement.posture to BLOCKED (link 3); the
          posture change reverts the READY_TO_FILE filing to
          SCHEDULES_COMPLETE (link 4). Different trigger from the test-failure
          cascade.
