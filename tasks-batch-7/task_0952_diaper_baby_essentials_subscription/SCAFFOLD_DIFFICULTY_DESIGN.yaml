  # =======================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: past_cutoff_beats_skip_allowance_exhausted
        grounds:
          - validations[priority=35]
          - validations[priority=51]
          - calculations.skip_allowance_remaining
          - errors[ERR_PAST_CUTOFF]
          - errors[ERR_SKIP_ALLOWANCE_EXHAUSTED]
        distinguishing_aspect: |
          Category pair business_temporal (priority 35, ERR_PAST_CUTOFF) versus business_constraint
          (priority 51, ERR_SKIP_ALLOWANCE_EXHAUSTED): a single request violates BOTH and must
          return ERR_PAST_CUTOFF because gate G8_TEMPORAL outranks gate G9_POLICY_FISCAL.
        test_recipe:
          setup:
            - "Subscription activated on 2026-06-01T00:00:00Z with cadence_interval_days 20, so anchor_date is 2026-06-08T00:00:00Z."
            - "Cycles 1 and 2 are both skipped before their cutoffs, consuming the full allowance of 2 inside the 180-day window."
            - "Cycle 3 covers [2026-08-27, 2026-09-16) with cutoff_at 2026-08-25T00:00:00Z, and the logical clock is moved to 2026-08-26T00:00:00Z — past that cutoff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
