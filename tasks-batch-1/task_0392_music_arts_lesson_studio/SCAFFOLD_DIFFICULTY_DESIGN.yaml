# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Music & Arts Lesson Studio — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tuition_provisional_vs_finalized_diverge
        grounds:
          - calculations.tuition_provisional
          - calculations.tuition_finalized
          - state_machines.TuitionInvoice.ISSUED_to_FINALIZED
          - entities.TuitionInvoice.fields.provisional_amount_cents
          - entities.TuitionInvoice.fields.finalized_amount_cents
        distinguishing_aspect: |
          Same enrollment+period: provisional prorates the whole monthly_tuition once
          (24999) while finalized rounds per-session-rate (6250) then sums 4 -> 25000,
          so finalized_amount_cents (25000) != provisional_amount_cents (24999) on the
          Invoice domain.
        test_recipe:
          setup:
            - "Studio (defaults), one Family (autopay off), one Student, one Instructor hourly_rate_cents=8333 teaching PIANO available Monday all day, one PIANO Room"
            - "Enrollment 45-min Monday lesson, ACTIVE; monthly_tuition_cents=24999"
            - "Exactly 4 SCHEDULED occurrences in 2026-01, all COMPLETED; clock advanced to 2026-02-01"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Aria" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "Kid A" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Ms P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 8333 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 45 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version, mt: $.data.monthly_tuition_cents }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-05T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o1: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-12T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o2: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-19T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o3: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-26T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o4: $.data.id }
            - call: "POST /studios/${sid}/invoices"
              payload: { enrollment_id: "${enr}", billing_period: "2026-01" }
              as: BillingClerk
              captures: { inv: $.data.id, prov: $.data.provisional_amount_cents }
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-27T00:00:00.000Z" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences/${o1}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o2}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o3}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o4}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studios/${sid}/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { fin: $.data.finalized_amount_cents, prov_after: $.data.provisional_amount_cents }
          assert:
            - "TuitionInvoice.${inv}.provisional_amount_cents == 24999"
            - "TuitionInvoice.${inv}.finalized_amount_cents == 25000"
            - "TuitionInvoice.${inv}.finalized_amount_cents != TuitionInvoice.${inv}.provisional_amount_cents"

      - name: practice_weighted_vs_raw_diverge
        grounds:
          - calculations.weighted_progress_score
          - calculations.total_practice_minutes
          - entities.Student.fields.weighted_progress_score
          - entities.Student.fields.total_practice_minutes
        distinguishing_aspect: |
          Same two practice logs on the Student domain: total_practice_minutes is the
          undecayed sum 180, but weighted_progress_score decays the 10-day-old 60-min
          log by 0.95**10 yielding 2.60 hours, so the two metrics diverge.
        test_recipe:
          setup:
            - "Studio with clock at 2026-02-01T00:00:00Z, one Family, one Student"
            - "Two practice logs: 60 min logged 2026-01-22 (10 days old), 120 min logged 2026-02-01 (same day)"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Bell" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "Kid B" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/students/${stu}/practice-logs"
              payload: { minutes: 60, logged_utc: "2026-01-22T00:00:00.000Z" }
              as: Instructor
            - call: "POST /studios/${sid}/students/${stu}/practice-logs"
              payload: { minutes: 120, logged_utc: "2026-02-01T00:00:00.000Z" }
              as: Instructor
          trigger:
            - call: "GET /studios/${sid}/students/${stu}"
              payload: {}
              as: StudioAdmin
              captures: { tot: $.data.total_practice_minutes, wp: $.data.weighted_progress_score }
          assert:
            - "Student.${stu}.total_practice_minutes == 180"
            - "Student.${stu}.weighted_progress_score == 2.60"
            - "Student.${stu}.total_practice_minutes != Student.${stu}.weighted_progress_score * 60"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: family_discount_tier_selection
        grounds:
          - calculations.family_discount_pct
          - entities.Family.fields.active_enrollment_count
          - entities.Family.fields.family_discount_pct
          - state_machines.Enrollment.PENDING_MATCH_to_ACTIVE
        distinguishing_aspect: |
          Mode (a): tiered selection over 3+ inputs (active_enrollment_count vs each
          tier's min_active_enrollments). Activating a 3rd ACTIVE enrollment selects the
          tier with greatest min<=3 -> discount_pct 0.10, not the 2-enrollment 0.05 tier.
        test_recipe:
          setup:
            - "Studio with default tiers, one Family, three Students, one Instructor teaching PIANO available Monday 09:00-18:00, three PIANO Rooms"
            - "Three enrollments at non-overlapping Monday slots; activate all three"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Cole" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "C1" }
              as: StudioAdmin
              captures: { s1: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "C2" }
              as: StudioAdmin
              captures: { s2: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "C3" }
              as: StudioAdmin
              captures: { s3: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Mr Q", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 540, end_min: 1080 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { r1: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R2", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { r2: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R3", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { r3: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${s1}", instructor_id: "${ins}", room_id: "${r1}", instrument: "PIANO", weekday: 0, start_min: 540, duration_min: 60 }
              as: StudioAdmin
              captures: { e1: $.data.id, e1v: $.data.version }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${s2}", instructor_id: "${ins}", room_id: "${r2}", instrument: "PIANO", weekday: 0, start_min: 660, duration_min: 60 }
              as: StudioAdmin
              captures: { e2: $.data.id, e2v: $.data.version }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${s3}", instructor_id: "${ins}", room_id: "${r3}", instrument: "PIANO", weekday: 0, start_min: 780, duration_min: 60 }
              as: StudioAdmin
              captures: { e3: $.data.id, e3v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${e1}/activate"
              payload: { expected_enrollment_version: "${e1v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/enrollments/${e2}/activate"
              payload: { expected_enrollment_version: "${e2v}" }
              as: StudioAdmin
          trigger:
            - call: "POST /studios/${sid}/enrollments/${e3}/activate"
              payload: { expected_enrollment_version: "${e3v}" }
              as: StudioAdmin
            - call: "GET /studios/${sid}/families/${fid}"
              payload: {}
              as: StudioAdmin
              captures: { aec: $.data.active_enrollment_count, disc: $.data.family_discount_pct }
          assert:
            - "Family.${fid}.active_enrollment_count == 3"
            - "Family.${fid}.family_discount_pct == 0.10"

      - name: finalized_round_per_session_then_sum_order
        grounds:
          - calculations.tuition_finalized
          - calculations.tuition_provisional
          - state_machines.TuitionInvoice.ISSUED_to_FINALIZED
        distinguishing_aspect: |
          Mode (b): rounding order pinned. monthly_tuition_cents=24999 -> per_session_rate
          rounds to 6250 first, summed over 4 = 25000; the provisional prorate-then-round
          path yields 24999. The 1-cent gap exists ONLY because finalized rounds per
          session before summing.
        test_recipe:
          setup:
            - "Same fixture as tuition_provisional_vs_finalized_diverge (hourly_rate_cents=8333, 45-min lesson, 4 completed Jan sessions, clock at 2026-02-01)"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Dao" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "Kid D" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Ms P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 8333 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 45 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version, mt: $.data.monthly_tuition_cents }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-05T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o1: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-12T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o2: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-19T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o3: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-26T10:00:00.000Z" }
              as: StudioAdmin
              captures: { o4: $.data.id }
            - call: "POST /studios/${sid}/invoices"
              payload: { enrollment_id: "${enr}", billing_period: "2026-01" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-27T00:00:00.000Z" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences/${o1}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o2}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o3}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/lesson-occurrences/${o4}/complete"
              payload: {}
              as: Instructor
            - call: "POST /studios/${sid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studios/${sid}/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { fin: $.data.finalized_amount_cents }
          assert:
            - "TuitionInvoice.${inv}.finalized_amount_cents == 25000"
            - "Enrollment.${enr}.monthly_tuition_cents == 24999"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_parallel_lifecycle_x_billing
        grounds:
          - state_machines.Enrollment.lifecycle_status
          - state_machines.Enrollment.billing_status
          - state_machines.Enrollment.UNBILLED_to_BILLED
          - state_machines.Enrollment.ACTIVE_to_FROZEN
        distinguishing_aspect: |
          On the SAME Enrollment row, billing_status advances UNBILLED->BILLED (invoice
          issued) independently while lifecycle_status moves ACTIVE->FROZEN; after freeze
          the enrollment is FROZEN yet still BILLED, proving the two dimensions evolve
          independently.
        test_recipe:
          setup:
            - "Studio, Family, Student, PIANO Instructor available Monday, PIANO Room"
            - "Enrollment ACTIVE; invoice issued (billing_status BILLED); then freeze"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Eve" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "Kid E" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Ms P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/invoices"
              payload: { enrollment_id: "${enr}", billing_period: "2026-01" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "GET /studios/${sid}/enrollments/${enr}"
              payload: {}
              as: StudioAdmin
              captures: { v_after_inv: $.data.version }
          trigger:
            - call: "POST /studios/${sid}/enrollments/${enr}/freeze"
              payload: {}
              as: StudioAdmin
              captures: { lc: $.data.lifecycle_status, bs: $.data.billing_status }
          assert:
            - "Enrollment.${enr}.lifecycle_status == FROZEN"
            - "Enrollment.${enr}.billing_status == BILLED"

      - name: occurrence_cyclic_makeup_pending_roundtrip
        grounds:
          - state_machines.LessonOccurrence.SCHEDULED_to_MAKEUP_PENDING
          - state_machines.LessonOccurrence.MAKEUP_PENDING_to_SCHEDULED
          - entities.MakeupCredit.fields.status
          - entities.LessonOccurrence.fields.is_makeup
        distinguishing_aspect: |
          LessonOccurrence cycles SCHEDULED->MAKEUP_PENDING (request-makeup) and back
          MAKEUP_PENDING->SCHEDULED when a makeup occurrence consumes the minted credit;
          a true non-linear cycle on a different entity than Enrollment.
        test_recipe:
          setup:
            - "Studio clock 2026-01-01, Family, Student, PIANO Instructor available Mon+Tue, PIANO Room, ACTIVE enrollment"
            - "One SCHEDULED occurrence far in the future (2026-01-26); request makeup -> MAKEUP_PENDING + OUTSTANDING credit"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Fox" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "Kid F" }
              as: StudioAdmin
              captures: { stu: $.data.id }
            - call: "POST /studios/${sid}/instructors"
              payload: { full_name: "Ms P", instruments: ["PIANO"], weekly_availability: [{ weekday: 0, start_min: 0, end_min: 1440 }, { weekday: 1, start_min: 0, end_min: 1440 }], hourly_rate_cents: 6000 }
              as: StudioAdmin
              captures: { ins: $.data.id }
            - call: "POST /studios/${sid}/rooms"
              payload: { room_name: "R1", supported_instruments: ["PIANO"] }
              as: StudioAdmin
              captures: { room: $.data.id }
            - call: "POST /studios/${sid}/enrollments"
              payload: { student_id: "${stu}", instructor_id: "${ins}", room_id: "${room}", instrument: "PIANO", weekday: 0, start_min: 600, duration_min: 60 }
              as: StudioAdmin
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /studios/${sid}/enrollments/${enr}/activate"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: StudioAdmin
            - call: "POST /studios/${sid}/lesson-occurrences"
              payload: { enrollment_id: "${enr}", scheduled_start_utc: "2026-01-26T10:00:00.000Z" }
              as: StudioAdmin
              captures: { occ: $.data.id }
            - call: "POST /studios/${sid}/lesson-occurrences/${occ}/request-makeup"
              payload: {}
              as: StudioAdmin
              captures: { occ_status: $.data.status }
            - call: "GET /studios/${sid}/makeup-credits"
              payload: {}
              as: StudioAdmin
              captures: { cr: $.data.0.id }
          trigger:
            - call: "POST /studios/${sid}/make-up-occurrences"
              payload: { credit_id: "${cr}", scheduled_start_utc: "2026-01-27T10:00:00.000Z" }
              as: StudioAdmin
              captures: { makeup_occ: $.data.id, is_mk: $.data.is_makeup }
            - call: "GET /studios/${sid}/lesson-occurrences/${occ}"
              payload: {}
              as: StudioAdmin
              captures: { origin_status: $.data.status }
          assert:
            - "LessonOccurrence.${occ}.status == SCHEDULED"
            - "LessonOccurrence.${makeup_occ}.is_makeup == true"
            - "MakeupCredit.${cr}.status == CONSUMED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: freeze_cascade_occurrence_credit_discount
        grounds:
          - state_machines.Enrollment.ACTIVE_to_FROZEN
          - state_machines.LessonOccurrence.SCHEDULED_to_MAKEUP_PENDING
          - calculations.family_discount_pct
          - entities.MakeupCredit.fields.status
          - entities.Family.fields.family_discount_pct
        distinguishing_aspect: |
          Depth-3 chain from the freeze trigger: freeze -> future SCHEDULED occurrence
          becomes CANCELLED_NOTICE (hop1) -> that cancellation mints an OUTSTANDING
          MakeupCredit (hop2) -> the now-non-ACTIVE enrollment recomputes the family
          from 2 ACTIVE to 1 ACTIVE so family_discount_pct drops 0.05 -> 0.00 (hop3).
        test_recipe:
          setup:
            - "Family with TWO ACTIVE enrollments (discount 0.05); one of them has a future SCHEDULED occurrence"
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioAdmin
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/families"
              payload: { household_name: "Gee" }
              as: StudioAdmin
              captures: { fid: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "G1" }
              as: StudioAdmin
              captures: { s1: $.data.id }
            - call: "POST /studios/${sid}/students"
              payload: { family_id: "${fid}", full_name: "G2" }
              as: StudioAdmin
