          - errors[ERR_QUESTIONNAIRE_INVALID_STATE]
          - validations[priority=5]
          - concurrency_rules.assessment-create-stale-questionnaire
        distinguishing_aspect: |
          Entity pair = PortabilityAssessment reading LateralQuestionnaire — a different
          pair from the IntegrationPlan/Candidate instance, and a subtler one because the
          dependency is entangled with optimistic concurrency. The first attempt carries the
          CORRECT questionnaire version (captured while SUBMITTED), so priority 5 cannot
          intercept it and the 409 must come from the parent's state alone; start-review
          then bumps nothing, but the successful create itself increments the LPQ version,
          so the captured lpq_v0 is stale afterwards.
