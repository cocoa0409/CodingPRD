          - errors[ERR_LANE_STACKING_FULL]
        distinguishing_aspect: "Selector eligibility filter: with lane A full (1/1) the app merge skips it regardless of projected clear time and lands in lane B; the per-lane capacity eligibility — not the ranking — decides."
