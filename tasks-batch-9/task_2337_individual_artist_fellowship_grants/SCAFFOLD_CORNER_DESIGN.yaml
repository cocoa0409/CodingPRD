            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
            - { call: "POST /grants/recommendation-slots/${slot}/board-action", payload: { action: STRIKE, expected_cycle_version: "${cyc_v}", struck_reason_code: BUDGET_CONSTRAINT }, as: CouncilBoardMember, as_user_id: "board-1" }
            - { call: "POST /grants/appeals", payload: { application_id: "${app}", grounds_code: PANEL_COMPOSITION_DEFECT, statement: "The panel seated no reader from my region." }, as: Artist, as_user_id: "${art}", captures: { ap3: "$.data.id" } }
            - { call: "POST /grants/appeals/${ap3}/screen", payload: {}, as: AppealsOfficer, as_user_id: "appeals-1" }
          trigger:
            - { call: "POST /grants/appeals/${ap3}/decide", payload: { decision: UPHOLD, remedy_code: REISSUE_SLATE }, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "GET /grants/recommendation-slots/${slot}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { rcyc_v3: "$.data.version" } }
            - { call: "POST /grants/recommendation-slots/${slot}/board-action", payload: { action: APPROVE, expected_cycle_version: "${rcyc_v3}" }, as: CouncilBoardMember, as_user_id: "board-1" }
          assert:
            - "The decision returns 200 with status \"UPHELD\" and remedy_code \"REISSUE_SLATE\""
            - "The slot read shows status \"PROPOSED\" with board_action_by null, struck_reason_code null and awarded_amount_cents null"
            - "The application is back to \"SCORED\" with final_composite_score 7.30 and its three reviews still \"SUBMITTED\""
            - "The board approval returns 200 with awarded_amount_cents == 1500000 and creates an Award in \"OFFERED\" / \"UNPAID\" / \"NOT_DUE\""

