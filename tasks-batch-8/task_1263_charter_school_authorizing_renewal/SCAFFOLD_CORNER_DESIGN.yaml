              payload: {}
              as: AuthorizerStaff
          trigger:
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "GOVERNANCE", score: 70 }
              as: ApplicationReviewer
              as_user_id: rev_k1
              captures: { resp_rubric: $.data.rubric_score, resp_ver: $.data.version }
            - call: "GET /authorizer/applications/${app_id}"
              as: AuthorizerStaff
              captures: { get_rubric: $.data.rubric_score, get_ver: $.data.version }
          assert:
            - "mutation response already shows rubric_score == 70.0 (single criterion present)"
            - "immediate GET shows identical rubric_score == 70.0 and version == captured mutation version (no drift, no lag)"
