      - name: core_size_share_threshold_inclusive_and_zero_core_sizes_is_complete
        grounds:
          - entities.SizeProfile.fields.core_size_min_share_bp
          - entities.SizeProfile.fields.core_size_count
          - calculations.assortment_health_derivation
          - calculations.markdown_depth_bp
          - endpoints.POST /allocation/store-positions
        distinguishing_aspect: |
          Two profiles carry the identical eight-size curve at 1250bp each and differ only in
          core_size_min_share_bp: 1500 yields core_size_count 0 and 1250 - exactly equal to every share -
          yields 8, because the test is share_bp >= threshold. The consequence is a degenerate but
          mandated verdict: a completely empty position on the 1500 profile is COMPLETE with
          broken_size_count 0, while the identical empty position on the 1250 profile is BROKEN with
          broken_size_count 8. The third position is one size short of full and lands on the other pinned
          count boundary, SIZE_OUT_RISK at broken_size_count exactly 1.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A,URBAN) and 0102(B,URBAN), both with an APPAREL_TOP shelf plan of capacity 24 / pmin 8 effective 2026-07-01 open-ended"
            - "SizeProfile TOP-8SZ-NONE: XS/S/M/L/XL/XXL/XXXL/4XL at 1250bp each (sum 10000), core_size_min_share_bp 1500"
            - "SizeProfile TOP-8SZ-ALL: the same eight shares, core_size_min_share_bp 1250"
            - "SKU-3001 uses TOP-8SZ-NONE and SKU-3002 uses TOP-8SZ-ALL; both are SEASONAL APPAREL_TOP"
            - "No position exists yet - the three creations are the trigger"
