scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: penalty_provisional_projection_vs_final_cure
        grounds:
          - calculations.civil_penalty_accrual
          - entities.ViolationPenalty.fields.provisional_amount_cents
          - entities.ViolationPenalty.fields.final_amount_cents
        distinguishing_aspect: "On the ViolationPenalty domain, the provisional variant prices the violation at a fixed 30-day projection (AGGRAVATED 4353000 x 30 = 130590000) while the final variant prices the identical assessment at the actual 10-day cure (43530000) — same severity, same detected_on, different results; the other dual-variant instance lives on the RedressFund/Claim domain."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; company with 60 complaints; investigation advanced to NEGOTIATING; consent order (max_penalty_cents 500000000) proposed, comment period swept closed at 2026-10-01T00:00:00Z, order FINAL then IN_MONITORING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - call: "POST /enforcement/investigations"
              payload: { subject_company_id: "${company_id}", origin: "REFERRAL", summary: "Deceptive billing practices" }
              as: StaffAttorney
              captures: { inv_id: $.data.id }
            - call: "POST /enforcement/investigations/${inv_id}/transition"
              payload: { target_state: "PRELIMINARY_REVIEW" }
              as: StaffAttorney
            - call: "POST /enforcement/investigations/${inv_id}/transition"
              payload: { target_state: "EVIDENCE_GATHERING" }
              as: StaffAttorney
            - call: "POST /enforcement/investigations/${inv_id}/transition"
              payload: { target_state: "NEGOTIATING" }
              as: StaffAttorney
            - call: "POST /enforcement/investigations/${inv_id}/consent-orders"
              payload: { monetary_relief_cents: 3000000, max_penalty_cents: 500000000, reporting_frequency_months: 6, monitoring_term_years: 5, conduct_prohibitions: ["NO_UNSUBSTANTIATED_CLAIMS"] }
              as: StaffAttorney
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "IN_PUBLIC_COMMENT", expected_consent_order_version: "${order_v1}" }
              as: StaffAttorney
              captures: { order_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "FINAL", expected_consent_order_version: "${order_v2}" }
              as: Commissioner
              captures: { order_v3: $.data.version }
            - call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "IN_MONITORING", expected_consent_order_version: "${order_v3}" }
              as: Commissioner
            - call: "POST /enforcement/consent-orders/${order_id}/violation-penalties"
              payload: { severity: "AGGRAVATED", detected_on: "2026-10-01T00:00:00Z", description: "Billing disclosures still deceptive" }
              as: ComplianceMonitor
              as_user_id: "cm-1"
              captures: { penalty_id: $.data.id }
          trigger:
            - call: "POST /enforcement/violation-penalties/${penalty_id}/transition"
              payload: { target_state: "CONFIRMED", cured_on: "2026-10-11T00:00:00Z" }
              as: ComplianceMonitor
              as_user_id: "cm-2"
          assert:
            - "the assessment response carried provisional_days == 30 and provisional_amount_cents == 130590000"
            - "ViolationPenalty.${penalty_id}.status == CONFIRMED"
            - "ViolationPenalty.${penalty_id}.final_days == 10"
            - "ViolationPenalty.${penalty_id}.final_amount_cents == 43530000"
            - "provisional_amount_cents (130590000) != final_amount_cents (43530000) for identical severity and detected_on"

      - name: claim_provisional_award_shrinks_at_final_waterfall
        grounds:
          - calculations.redress_waterfall
          - entities.Claim.fields.provisional_award_cents
          - entities.Claim.fields.final_award_cents
        distinguishing_aspect: "On the RedressFund/Claim domain, claim A's provisional award at its own approval is 2500000 (it is the only approved claim and the 2750000 pool covers it) while its final award after the second approval freezes at 1892858 — same documented loss, same fund, different variants; this is a different entity domain from the penalty accrual instance."
