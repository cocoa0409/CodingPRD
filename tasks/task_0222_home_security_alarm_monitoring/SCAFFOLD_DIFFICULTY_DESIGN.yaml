# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Home Security & Alarm Monitoring — 9 rules x 2 instances = 18
# All numeric asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ----- Instance 1: proration forward_estimate vs final (Account cost) -----
      - name: proration_forward_quote_vs_final_chronological
        grounds:
          - calculations.monitoring_proration
          - calculations.monitoring_balance
          - entities.Account.fields.monitoring_balance_cents
          - state_machines.Account.ACTIVE_to_CANCELLATION_REQUESTED
        distinguishing_aspect: |
          The dual variant is on the Account-cost domain: forward_estimate rounds per
          whole-cycle SEGMENT (2727) while final_chronological rounds per day then sums
          (2719) for the same BASIC->PLUS change at day 7; the authoritative
          monitoring_balance reflects 2719, NOT 2727.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; BASIC plan (1500c/30d) and PLUS plan (3100c/30d) exist."
            - "Account activated on BASIC at day 0 (cycle_anchor = 2026-06-01)."
            - "At day 7 (2026-06-08) the plan is changed to PLUS; clock advanced to day 30 (2026-07-01) and account read."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { basic_plan_id: $.data.id }
            - call: "POST /monitoring-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 3100, police_dispatch_included: true, max_sensors: 16, cellular_backup_included: true }
              as: Administrator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${basic_plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
              captures: { acct_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-08T00:00:00Z" }
              as: Administrator
          trigger:
            - call: "POST /accounts/${acct_id}/change-plan"
              payload: { new_plan_id: "${plus_plan_id}", expected_account_version: "${acct_v}" }
              as: Administrator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: Administrator
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Administrator
              captures: { bal: $.data.monitoring_balance_cents }
          assert:
            - "Account.${acct_id}.monitoring_balance_cents == 2719"
            - "Account.${acct_id}.monitoring_balance_cents != 2727"
            - "Account.${acct_id}.current_tier == PLUS"

      # ----- Instance 2: chargeable_ordinal net_of_waived vs gross (Fine/AlarmEvent ordinal) -----
      - name: fine_ordinal_net_of_waived_vs_gross
        grounds:
          - calculations.chargeable_ordinal
          - calculations.false_alarm_fine
          - entities.Fine.fields.amount_cents
          - state_machines.Fine.ASSESSED_to_WAIVED
        distinguishing_aspect: |
          Dual variant on the Fine-ordinal domain (distinct entity from Account cost):
          after the 1st false-alarm fine is WAIVED, the 3rd raw false alarm is priced at
          net ordinal 2 (FREE -> 0) rather than gross ordinal 3 (WARN -> 5000).
        test_recipe:
          setup:
            - "Activated RESIDENTIAL account on PRO plan with an ACTIVE permit; system DISARMED is irrelevant — events are ingested then armed-away path used; three sequential burglary false alarms dispatched."
            - "Fine of the 1st false alarm is WAIVED before the 3rd false alarm resolves."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { pro_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pro_plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /permits"
              payload: { account_id: "${acct_id}", permit_number: "P-NET-1", filed_days_late: 0 }
              as: Administrator
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev1: $.data.id }
            - call: "POST /alarm-events/${ev1}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev1}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev1}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
              captures: { fine1_event: $.data.id }
            - call: "GET /fines?alarm_event_id=${ev1}"
              payload: {}
              as: Administrator
              captures: { fine1_id: "$.data[0].id" }
            - call: "POST /fines/${fine1_id}/waive"
              payload: {}
              as: Administrator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:10:00Z" }
              as: Administrator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev2: $.data.id }
            - call: "POST /alarm-events/${ev2}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev2}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev2}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:20:00Z" }
              as: Administrator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev3: $.data.id }
            - call: "POST /alarm-events/${ev3}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev3}/dispatch"
              payload: {}
              as: MonitoringOperator
          trigger:
            - call: "POST /alarm-events/${ev3}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
              captures: { ev3_ord: $.data.chargeable_ordinal }
            - call: "GET /fines?alarm_event_id=${ev3}"
              payload: {}
              as: Administrator
              captures: { fine3_amt: "$.data[0].amount_cents" }
          assert:
            - "AlarmEvent.${ev3}.chargeable_ordinal == 2"
            - "Fine(alarm_event_id=${ev3}).amount_cents == 0"
            - "Fine(alarm_event_id=${ev3}).amount_cents != 5000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ----- Instance 1: permit_fee mode (a) — >=3 inputs, conditional branches -----
      - name: permit_fee_commercial_uplift_plus_capped_late_penalty
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.fee_total_cents
          - entities.Account.fields.premises_type
        distinguishing_aspect: |
          Mode (a): permit_fee is a >=3-input non-linear formula combining premises_type
          branch (commercial uplift), a ceil-based late-period count, and a min() cap;
          COMMERCIAL + 200 days late yields 8000 + min(round(5000*0.2*ceil(200/30)),4000)
          = 8000 + 4000 = 12000 (penalty hits the cap, not 7000).
        test_recipe:
          setup:
            - "A COMMERCIAL account exists; a permit is issued 200 days late."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "COMMERCIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { account_id: "${acct_id}", permit_number: "P-COMM-200", filed_days_late: 200 }
              as: Administrator
              captures: { permit_fee: $.data.fee_total_cents }
          assert:
            - "Permit.fee_total_cents == 12000"
            - "Permit.fee_total_cents != 15000"

      # ----- Instance 2: monitoring_proration mode (b) — nested rounding order -----
      - name: proration_rounding_order_per_day_vs_per_segment
        grounds:
          - calculations.monitoring_proration
          - entities.Account.fields.monitoring_balance_cents
          - state_machines.Account.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Mode (b): the pinned rounding ORDER (round each day then sum) produces 2719 for a
          BASIC->PLUS day-7 change, whereas the sum-then-round / per-segment order produces
          2727; the scaffold pins per-day, so monitoring_balance is 2719.
        test_recipe:
          setup:
            - "Account activated on BASIC at day0; changed to PLUS at day7; read at day30."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { basic_plan_id: $.data.id }
            - call: "POST /monitoring-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 3100, police_dispatch_included: true, max_sensors: 16, cellular_backup_included: true }
              as: Administrator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${basic_plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
              captures: { acct_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-08T00:00:00Z" }
              as: Administrator
            - call: "POST /accounts/${acct_id}/change-plan"
              payload: { new_plan_id: "${plus_plan_id}", expected_account_version: "${acct_v}" }
              as: Administrator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: Administrator
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Administrator
              captures: { bal: $.data.monitoring_balance_cents }
          assert:
            - "Account.${acct_id}.monitoring_balance_cents == 2719"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ----- Instance 1: SecuritySystem cyclic arming -----
      - name: system_arming_cycle_disarmed_armed_disarmed
        grounds:
          - state_machines.SecuritySystem.DISARMED_to_ARMED_AWAY
          - state_machines.SecuritySystem.ARMED_AWAY_to_DISARMED
          - state_machines.SecuritySystem.DISARMED_to_ARMED_STAY
        distinguishing_aspect: |
          Cyclic shape on SecuritySystem: DISARMED -> ARMED_AWAY -> DISARMED -> ARMED_STAY,
          the same row can re-enter DISARMED and re-arm, unlike a linear pipeline.
        test_recipe:
          setup:
            - "Activated account with a HEALTHY system, DISARMED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { s1: $.data.arming_state }
            - call: "POST /systems/${sys_id}/disarm"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { s2: $.data.arming_state }
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_STAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { s3: $.data.arming_state }
          assert:
            - "after 1st trigger SecuritySystem.${sys_id}.arming_state == ARMED_AWAY"
            - "after 2nd trigger SecuritySystem.${sys_id}.arming_state == DISARMED"
            - "after 3rd trigger SecuritySystem.${sys_id}.arming_state == ARMED_STAY"

      # ----- Instance 2: AlarmEvent branching fork-join -----
      - name: alarm_event_fork_real_vs_false_divergent_effects
        grounds:
          - state_machines.AlarmEvent.DISPATCHED_to_RESOLVED_REAL
          - state_machines.AlarmEvent.DISPATCHED_to_RESOLVED_FALSE
          - state_machines.AlarmEvent.RECEIVED_to_SUPPRESSED
        distinguishing_aspect: |
          Branching fork-join on AlarmEvent (distinct entity from SecuritySystem): the
          DISPATCHED branch forks to RESOLVED_REAL (no Fine) vs RESOLVED_FALSE (Fine
          created) with divergent side-effects; a separate RECEIVED->SUPPRESSED branch
          fires no dispatch at all.
        test_recipe:
          setup:
            - "Activated PRO account, ACTIVE permit, armed-away system; one event resolved REAL, an independent event resolved FALSE_ALARM."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /permits"
              payload: { account_id: "${acct_id}", permit_number: "P-FORK-1", filed_days_late: 0 }
              as: Administrator
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev_real: $.data.id }
            - call: "POST /alarm-events/${ev_real}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev_real}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:05:00Z" }
              as: Administrator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev_false: $.data.id }
            - call: "POST /alarm-events/${ev_false}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev_false}/dispatch"
              payload: {}
              as: MonitoringOperator
          trigger:
            - call: "POST /alarm-events/${ev_real}/resolve"
              payload: { resolution: "REAL" }
              as: MonitoringOperator
              captures: { real_status: $.data.status }
            - call: "POST /alarm-events/${ev_false}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
              captures: { false_status: $.data.status }
            - call: "GET /fines?alarm_event_id=${ev_real}"
              payload: {}
              as: Administrator
            - call: "GET /fines?alarm_event_id=${ev_false}"
              payload: {}
              as: Administrator
              captures: { false_fine_amt: "$.data[0].amount_cents" }
          assert:
            - "AlarmEvent.${ev_real}.status == RESOLVED_REAL"
            - "AlarmEvent.${ev_false}.status == RESOLVED_FALSE"
            - "GET /fines?alarm_event_id=${ev_real} returns total_count == 0 (no Fine on REAL branch)"
            - "Fine(alarm_event_id=${ev_false}).amount_cents == 0 (ordinal 1, FREE; permit active)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ----- Instance 1: depth-3 from finalize-cancellation -----
      - name: finalize_cancellation_account_system_event_dispatch_chain
        grounds:
          - state_machines.Account.CANCELLATION_REQUESTED_to_CANCELLED
          - state_machines.SecuritySystem.ARMED_AWAY_to_DISARMED
          - state_machines.AlarmEvent.DISPATCHED_to_SUPPRESSED
          - state_machines.Dispatch.ORDERED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by finalize-cancellation: Account->CANCELLED forces
          System->DISARMED (hop1), which forces the system's open DISPATCHED AlarmEvent
          ->SUPPRESSED (hop2, caused by the disarm), which cancels that event's ORDERED
          Dispatch and reverses its fee (hop3, caused by the suppression). Each link is
          caused by the previous link, not directly by the finalize action.
        test_recipe:
          setup:
            - "Activated PRO account, armed-away system, one FIRE event ROUTED then DISPATCHED (ORDERED Dispatch, fee 4000 on balance) and left open (unresolved)."
            - "A request-cancellation precedes finalize. Finalize force-disarms the system, sweeps the open DISPATCHED event to SUPPRESSED, and cancels its ORDERED dispatch reversing the 4000 fee."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "SMOKE" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "FIRE" }
              as: MonitoringOperator
              captures: { ev_open: $.data.id }
            - call: "POST /alarm-events/${ev_open}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev_open}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "GET /dispatches?alarm_event_id=${ev_open}"
              payload: {}
              as: Administrator
              captures: { disp_id: "$.data[0].id" }
            - call: "POST /accounts/${acct_id}/request-cancellation"
              payload: {}
              as: Administrator
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/finalize-cancellation"
              payload: { expected_account_version: "${acct_v}" }
              as: Administrator
              captures: { final_status: $.data.contract_status, final_bal: $.data.monitoring_balance_cents }
            - call: "GET /systems/${sys_id}"
              payload: {}
              as: Administrator
              captures: { sys_arm: $.data.arming_state }
            - call: "GET /alarm-events/${ev_open}"
              payload: {}
              as: Administrator
              captures: { ev_status: $.data.status }
            - call: "GET /dispatches/${disp_id}"
              payload: {}
              as: Administrator
              captures: { disp_status: $.data.status }
          assert:
            - "Account.${acct_id}.contract_status == CANCELLED"
            - "SecuritySystem.${sys_id}.arming_state == DISARMED"
            - "AlarmEvent.${ev_open}.status == SUPPRESSED"
            - "Dispatch.${disp_id}.status == CANCELLED"
            - "Account.${acct_id}.monitoring_balance_cents == 0 (FIRE 4000 dispatch fee reversed; proration day0 read == 0)"

      # ----- Instance 2: depth-2 from resolve FALSE_ALARM -----
      - name: false_alarm_resolution_count_then_fine_chain
        grounds:
          - state_machines.AlarmEvent.DISPATCHED_to_RESOLVED_FALSE
          - calculations.chargeable_ordinal
          - calculations.false_alarm_fine
          - entities.Account.fields.false_alarm_count_cycle
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (resolve FALSE_ALARM): the resolution
          increments Account.false_alarm_count_cycle (hop1); that count change in turn
          determines this event's chargeable_ordinal and the resulting Fine.amount_cents
          (hop2, caused by the count increment). Distinct propagation pattern and origin
          from the finalize-cancellation depth-3 chain.
        test_recipe:
          setup:
            - "Activated PRO account WITHOUT a permit (so a no-permit surcharge applies), armed system; two prior false alarms already resolved (ordinals 1,2), then a third FIRE? no — third BURGLARY false alarm is the trigger and lands at ordinal 3 (WARN)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev1: $.data.id }
            - call: "POST /alarm-events/${ev1}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev1}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev1}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:10:00Z" }
              as: Administrator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev2: $.data.id }
            - call: "POST /alarm-events/${ev2}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev2}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev2}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:20:00Z" }
              as: Administrator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev3: $.data.id }
            - call: "POST /alarm-events/${ev3}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev3}/dispatch"
              payload: {}
              as: MonitoringOperator
          trigger:
            - call: "POST /alarm-events/${ev3}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
              captures: { ev3_ord: $.data.chargeable_ordinal }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Administrator
              captures: { fac: $.data.false_alarm_count_cycle }
            - call: "GET /fines?alarm_event_id=${ev3}"
              payload: {}
              as: Administrator
              captures: { fine3_amt: "$.data[0].amount_cents" }
          assert:
            - "Account.${acct_id}.false_alarm_count_cycle == 3"
            - "AlarmEvent.${ev3}.chargeable_ordinal == 3"
            - "Fine(alarm_event_id=${ev3}).amount_cents == 12500 (WARN 5000 + no-permit surcharge 7500)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ----- Instance 1: state (pri6) vs business_safety (pri7) -----
      - name: route_invalid_state_beats_test_mode_active
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TEST_MODE_ACTIVE]
        distinguishing_aspect: |
          Category pair {state (pri6) vs business_safety (pri7)}: routing an event that is
          BOTH already terminal (SUPPRESSED, so not RECEIVED) AND on a test-mode system
          returns the higher-priority ERR_INVALID_STATE, not ERR_TEST_MODE_ACTIVE.
        test_recipe:
          setup:
            - "Activated account; system put in test mode; a BURGLARY signal ingested under test mode is auto-SUPPRESSED (terminal)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sys_id}/enter-test-mode"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /alarm-events/${ev_id}/route"
              payload: {}
              as: MonitoringOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "data.error_id != ERR_TEST_MODE_ACTIVE"

      # ----- Instance 2: business_referential (pri5) vs business_safety (pri8) -----
      - name: arm_owner_check_beats_communicator_offline
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_NOT_ACCOUNT_OWNER]
          - errors[ERR_COMMUNICATOR_OFFLINE]
        distinguishing_aspect: |
          Category pair {business_referential (pri5) vs business_safety (pri8)}: a Subscriber
          who is NOT the owner arms a system whose communicator is OFFLINE; the owner check
          (pri5) fires first, returning ERR_NOT_ACCOUNT_OWNER, not ERR_COMMUNICATOR_OFFLINE.
        test_recipe:
          setup:
            - "Account A owns an OFFLINE system (last_checkin 9999 min). A different account B exists; B's subscriber attempts to arm A's system."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_a: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_b: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_a}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 9999 }
              as: Administrator
              captures: { sys_a: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_a}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /systems/${sys_a}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_NOT_ACCOUNT_OWNER"
            - "data.error_id != ERR_COMMUNICATOR_OFFLINE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ----- Instance 1: communicator_health signal_dbm >= -85 boundary (PATCH /systems) -----
      - name: communicator_signal_dbm_boundary_minus85_healthy
        grounds:
          - calculations.communicator_health
          - entities.SecuritySystem.fields.communicator_health
          - entities.SecuritySystem.fields.cellular_signal_dbm
        distinguishing_aspect: |
          Numeric >= boundary on the signal metric: cellular_signal_dbm == -85 is HEALTHY
          (inclusive), -86 is DEGRADED; reached via PATCH /systems/{id}.
        test_recipe:
          setup:
            - "A system exists with healthy battery/checkin; signal set to exactly -85, then to -86."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -50, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
          trigger:
            - call: "PATCH /systems/${sys_id}"
              payload: { cellular_signal_dbm: -85 }
              as: MonitoringOperator
              captures: { h85: $.data.communicator_health }
            - call: "PATCH /systems/${sys_id}"
              payload: { cellular_signal_dbm: -86 }
              as: MonitoringOperator
              captures: { h86: $.data.communicator_health }
          assert:
            - "after signal=-85 SecuritySystem.${sys_id}.communicator_health == HEALTHY"
            - "after signal=-86 SecuritySystem.${sys_id}.communicator_health == DEGRADED"

      # ----- Instance 2: sensor_count == max_sensors boundary (POST /sensors) -----
      - name: sensor_enrollment_at_max_sensors_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_SENSOR_LIMIT_EXCEEDED]
          - entities.MonitoringPlan.fields.max_sensors
          - entities.SecuritySystem.fields.sensor_count
        distinguishing_aspect: |
          Count/cardinality boundary on a different metric and endpoint: with max_sensors==2,
          enrolling the 2nd sensor succeeds (count reaches the limit, not over) and the 3rd is
          rejected ERR_SENSOR_LIMIT_EXCEEDED; reached via POST /sensors.
        test_recipe:
          setup:
            - "Plan with max_sensors=2; a system with one sensor already enrolled."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 2, cellular_backup_included: false }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
          trigger:
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 2, sensor_type: "MOTION" }
              as: Administrator
              captures: { s2: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 3, sensor_type: "GLASS_BREAK" }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "2nd enrollment (zone 2) returns 201 and SecuritySystem.${sys_id}.sensor_count == 2"
            - "3rd enrollment (zone 3) returns 409 with data.error_id == ERR_SENSOR_LIMIT_EXCEEDED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # ----- Instance 1: AlarmEvent route depends on Account.monitoring_status -----
      - name: route_requires_account_monitoring_status_active
        grounds:
          - state_machines.AlarmEvent.RECEIVED_to_ROUTED
          - calculations.monitoring_status
          - entities.Account.fields.monitoring_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair AlarmEvent->Account: an event cannot be ROUTED when the owning
          Account.monitoring_status != ACTIVE (here SUSPENDED because the system is OFFLINE),
          a dependency on a DIFFERENT entity's derived state.
        test_recipe:
          setup:
            - "Account active; an event already RECEIVED (ingested while system was DISARMED but FIRE so not suppressed); then system telemetry pushed OFFLINE so monitoring_status -> SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "SMOKE" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "FIRE" }
              as: MonitoringOperator
              captures: { ev_id: $.data.id }
            - call: "PATCH /systems/${sys_id}"
              payload: { last_checkin_minutes_ago: 9999 }
              as: MonitoringOperator
          trigger:
            - call: "POST /alarm-events/${ev_id}/route"
              payload: {}
              as: MonitoringOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "AlarmEvent.${ev_id}.status == RECEIVED (route rejected)"

      # ----- Instance 2: SecuritySystem arm depends on Account.contract_status -----
      - name: arm_requires_account_contract_active
        grounds:
          - state_machines.SecuritySystem.DISARMED_to_ARMED_AWAY
          - entities.Account.fields.contract_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair SecuritySystem->Account (different pair from AlarmEvent->Account):
          arming is rejected while the owning Account.contract_status == CANCELLATION_REQUESTED
          (not ACTIVE), a precondition on a different entity's lifecycle column.
        test_recipe:
          setup:
            - "Activated account with a HEALTHY DISARMED system; cancellation is then requested (contract_status CANCELLATION_REQUESTED)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /accounts/${acct_id}/request-cancellation"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "SecuritySystem.${sys_id}.arming_state == DISARMED (arm rejected)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ----- Instance 1: test-mode window half-open overlap (SecuritySystem) -----
      - name: test_mode_window_overlap_half_open_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_TEST_MODE_ALREADY_OPEN]
          - state_machines.SecuritySystem.DISARMED_to_DISARMED
          - calculations.signal_routing
        distinguishing_aspect: |
          Half-open [enter, expires) interval semantics on SecuritySystem: a 2nd enter-test-mode
          60 minutes into a 120-minute window (still open) is rejected ERR_TEST_MODE_ALREADY_OPEN,
          but re-entry exactly at +120 min (window boundary, adjacency allowed) succeeds.
        test_recipe:
          setup:
            - "Activated account with a system; enter test mode at T0 (window [T0, T0+120m)); clock advanced to T0+60m, then to T0+120m."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sys_id}/enter-test-mode"
              payload: {}
              as: MonitoringOperator
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T01:00:00Z" }
              as: Administrator
          trigger:
            - call: "POST /systems/${sys_id}/enter-test-mode"
              payload: {}
              as: MonitoringOperator
              captures: { err_mid: $.data.error_id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T02:00:00Z" }
              as: Administrator
            - call: "POST /systems/${sys_id}/enter-test-mode"
              payload: {}
              as: MonitoringOperator
              captures: { tm: $.data.test_mode }
          assert:
            - "2nd enter at +60m returns 409 with data.error_id == ERR_TEST_MODE_ALREADY_OPEN"
            - "3rd enter at +120m (window boundary) returns 200 and SecuritySystem.${sys_id}.test_mode == true"

      # ----- Instance 2: signal debounce buffer overlap (AlarmEvent) -----
      - name: signal_debounce_buffer_window_same_sensor
        grounds:
          - validations[priority=14]
          - errors[ERR_SIGNAL_DEBOUNCED]
          - calculations.signal_routing
          - entities.AlarmEvent.fields.raised_utc
        distinguishing_aspect: |
          Buffer/gap interval semantics on AlarmEvent (different resource and arithmetic from
          the half-open test-mode window): a 2nd signal from the same sensor 30s after a
          still-open prior event is rejected ERR_SIGNAL_DEBOUNCED, but a 3rd signal 61s after
          (gap strictly > 60s) is accepted.
        test_recipe:
          setup:
            - "Activated armed-away system; first BURGLARY event ingested at T0 (still open/RECEIVED)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev1: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:30Z" }
              as: Administrator
          trigger:
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { err_dup: $.data.error_id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:01:01Z" }
              as: Administrator
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev3: $.data.id }
          assert:
            - "2nd ingest at +30s returns 409 with data.error_id == ERR_SIGNAL_DEBOUNCED"
            - "3rd ingest at +61s returns 201 (gap > 60s, accepted)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ----- Instance 1: monitoring_balance_cents conserved across dispatch+cancel -----
      - name: dispatch_then_cancel_conserves_monitoring_balance
        grounds:
          - state_machines.AlarmEvent.ROUTED_to_DISPATCHED
          - state_machines.Dispatch.ORDERED_to_CANCELLED
          - calculations.dispatch_fee
          - entities.Account.fields.monitoring_balance_cents
        distinguishing_aspect: |
          Conserved quantity = monitoring_balance_cents (money): ordering a FIRE dispatch
          debits 4000 then cancelling it credits 4000, leaving the balance identical to its
          pre-dispatch value (proration-only) per the pinned invariant
          balance_after == balance_before.
        test_recipe:
          setup:
            - "Activated armed system at day0 (proration 0); a FIRE event routed and dispatched (balance 4000), then the dispatch cancelled."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "SMOKE" }
              as: Administrator
              captures: { sensor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sys_id}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Administrator
              captures: { bal_before: $.data.monitoring_balance_cents }
            - call: "POST /alarm-events"
              payload: { system_id: "${sys_id}", sensor_id: "${sensor_id}", signal_type: "FIRE" }
              as: MonitoringOperator
              captures: { ev_id: $.data.id }
            - call: "POST /alarm-events/${ev_id}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev_id}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "GET /dispatches?alarm_event_id=${ev_id}"
              payload: {}
              as: Administrator
              captures: { disp_id: "$.data[0].id", mid_bal: "$.data[0].fee_cents" }
          trigger:
            - call: "POST /dispatches/${disp_id}/cancel"
              payload: {}
              as: MonitoringOperator
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Administrator
              captures: { bal_after: $.data.monitoring_balance_cents }
          assert:
            - "monitoring_balance_cents before dispatch == 0"
            - "Dispatch.${disp_id}.fee_cents == 4000 while ORDERED"
            - "Account.${acct_id}.monitoring_balance_cents after cancel == 0 (== pre-dispatch value)"

      # ----- Instance 2: sensor_count conserved across enroll+remove -----
      - name: enroll_then_remove_conserves_sensor_count
        grounds:
          - state_machines.Sensor.ENROLLED_to_REMOVED
          - entities.SecuritySystem.fields.sensor_count
          - validations[priority=10]
        distinguishing_aspect: |
          Conserved quantity = sensor_count (an integer inventory count, NOT money): enrolling
          a sensor raises sensor_count by 1, removing it lowers it by 1, leaving sensor_count
          equal to its pre-enrollment value — a different conserved quantity from the monetary
          balance invariant.
        test_recipe:
          setup:
            - "A system with one sensor already enrolled (sensor_count 1)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${plan_id}", contract_term_months: 12 }
              as: Administrator
              captures: { acct_id: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sys_id: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "GET /systems/${sys_id}"
              payload: {}
              as: Administrator
              captures: { count_before: $.data.sensor_count }
          trigger:
            - call: "POST /sensors"
              payload: { system_id: "${sys_id}", zone_number: 2, sensor_type: "MOTION" }
              as: Administrator
              captures: { s2: $.data.id }
            - call: "POST /sensors/${s2}/remove"
              payload: {}
              as: Administrator
            - call: "GET /systems/${sys_id}"
              payload: {}
              as: Administrator
              captures: { count_after: $.data.sensor_count }
          assert:
            - "SecuritySystem.${sys_id}.sensor_count before enroll == 1"
            - "SecuritySystem.${sys_id}.sensor_count after enroll+remove == 1 (conserved)"
