      - name: trailing_avg_normalizes_over_two_records
        claim_type: Correct Result
        grounds:
          - "calculations.household_consumption_model"
        distinguishing_aspect: "With only 2 records the 3/2/1 weights normalize over the present weights (sum 5): (3*300+2*100)/5 == 220.00 — absent periods are skipped, not zero-filled."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Household with records 2026-07=100 and 2026-08=300 only."]
          setup_api_calls:
            - call: "POST /households"
              payload: { region: "NW", size: 2 }
              as: PlatformAdmin
              captures: { ca1_hh: $.data.id }
            - call: "POST /households/${ca1_hh}/consumption-records"
              payload: { period: "2026-07", pods_brewed: 100 }
              as: PlatformAdmin
            - call: "POST /households/${ca1_hh}/consumption-records"
              payload: { period: "2026-08", pods_brewed: 300 }
              as: PlatformAdmin
          trigger:
            - call: "GET /households/${ca1_hh}"
              payload: {}
              as: PlatformAdmin
              captures: { ca1_avg: $.data.trailing_avg_pods }
          assert:
            - "trailing_avg_pods == 220.00 ((3*300 + 2*100) / (3+2))"

