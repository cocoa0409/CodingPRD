scaffold_corner_design:
  # ===========================================================================
  # §1.9.1 Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_season_returns_201_with_all_fields
        claim_type: Creation
        grounds: ["entities.Season", "endpoints"]
        distinguishing_aspect: "POST /seasons with all required fields → 201; response data has status DRAFT, confirmed_share_count 0, version 1, server-minted id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { name: "Fall 2026", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-08-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
          assert:
            - "response code == 201"
            - "Season.${season_id}.status == DRAFT"
            - "Season.${season_id}.confirmed_share_count == 0"
            - "Season.${season_id}.version == 1"

      - name: get_season_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Season", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /seasons/{random-uuid} for a non-existent id → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /seasons/00000000-0000-4000-8000-000000000000"
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_subscription_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Subscription.fields.share_type_id", "validations[priority=15]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /subscriptions omitting share_type_id → ERR_INVALID_REQUEST (422); no Subscription created."
        test_recipe:
          setup: ["OPEN season with a site; a registered member"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-req", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-08-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "req@x.com", full_name: "Req", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_member_default_sliding_scale_tier_baseline
        claim_type: Defaults
        grounds: ["entities.Member.fields.sliding_scale_tier"]
        distinguishing_aspect: "POST /members omitting sliding_scale_tier → tier defaults to BASELINE; wallet_credit_cents 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "def@x.com", full_name: "Def" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
          assert:
            - "Member.${member_id}.sliding_scale_tier == BASELINE"
            - "Member.${member_id}.wallet_credit_cents == 0"

      - name: confirm_ignores_client_supplied_season_price_computes_it
        claim_type: Computed Fields
        grounds: ["entities.Subscription.fields.season_price_cents", "calculations.season_share_price"]
        distinguishing_aspect: "season_price_cents is computed from ShareType.base_price × tier multiplier at confirm; a SOLIDARITY member on a 50000 share yields 40000 regardless of any client input."
        test_recipe:
          setup: ["OPEN season, MEDIUM share base 50000, SOLIDARITY member, PICKUP site"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-comp", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "sol@x.com", full_name: "Sol", sliding_scale_tier: "SOLIDARITY" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: "$.data.version" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
          assert:
            - "Subscription.${sub_id}.season_price_cents == 40000 (50000 × 0.80 SOLIDARITY)"

      - name: create_share_type_invalid_size_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.ShareType.fields.size", "validations[priority=15]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /share-types with size 'JUMBO' (not in {SMALL,MEDIUM,LARGE}) → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT season exists"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-enum", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-08-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "JUMBO", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.LedgerEntry"]
        distinguishing_aspect: "LedgerEntry has common_fields:false — append-only; it has id and created_at but no version/updated_at and no update/delete endpoint in §1.5."
        test_recipe:
          setup: ["A CONFIRMED subscription has at least one LedgerEntry (CHARGE_SEASON)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-imm", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "imm@x.com", full_name: "Imm", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
          trigger:
            - call: "GET /subscriptions/${sub_id}/ledger-entries"
              as: FarmManager
              captures: { entry_type0: "$.data[0].entry_type" }
          assert:
            - "at least one LedgerEntry has entry_type == CHARGE_SEASON with amount_cents == 50000"
            - "LedgerEntry response objects expose no version field (common_fields:false)"

      - name: flat_topology_fk_season_mismatch_share_type
        claim_type: Parent Relationships
        grounds: ["entities.Subscription.fields.share_type_id", "validations[priority=5]", "errors[ERR_SEASON_MISMATCH]"]
        distinguishing_aspect: "Flat-topology FK integrity: subscribing with a ShareType belonging to a different Season → ERR_SEASON_MISMATCH (409)."
        test_recipe:
          setup: ["Season A (OPEN) with site A; Season B with a ShareType B; a member"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "SeasonA", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_a: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_a}", name: "SiteA", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_a: "$.data.id" }
            - call: "POST /seasons/${season_a}/open"
              payload: {}
              as: FarmManager
            - call: "POST /seasons"
              payload: { name: "SeasonB", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_b: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_b}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_b: "$.data.id" }
            - call: "POST /members"
              payload: { email: "mismatch@x.com", full_name: "Mis", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { season_id: "${season_a}", member_id: "${member_id}", share_type_id: "${share_b}", current_site_id: "${site_a}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 409"
            - "response error_id == ERR_SEASON_MISMATCH"

  # ===========================================================================
  # §1.9.2 State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: pack_box_from_held_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.WeeklyBox", "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Packing a box that is HELD (not SCHEDULED) → ERR_INVALID_STATE (409); status stays HELD."
        test_recipe:
          setup: ["CONFIRMED subscription, clock 2026-08-25; box week 1 placed on a REFUND hold (status HELD)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-pack", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-08-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "pack@x.com", full_name: "Pack", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "GET /subscriptions/${sub_id}/weekly-boxes"
              as: FarmManager
              captures: { box_w1_id: "$.data[0].id" }
            - call: "POST /vacation-holds"
              payload: { subscription_id: "${sub_id}", held_box_id: "${box_w1_id}" }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /weekly-boxes/${box_w1_id}/pack"
              payload: {}
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "WeeklyBox.${box_w1_id}.status == HELD (unchanged)"

      - name: open_already_closed_season_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Season", "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-opening a CLOSED season (terminal) → ERR_INVALID_STATE; CLOSED is terminal so no transition fires."
        test_recipe:
          setup: ["A season opened then closed (status CLOSED)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-term", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-08-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /seasons/${season_id}/close"
              payload: {}
              as: FarmManager
          trigger:
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: new_subscription_initial_states_pending_and_not_started
        claim_type: Initial State
        grounds: ["state_machines.Subscription", "entities.Subscription.fields.billing_status", "entities.Subscription.fields.fulfillment_status"]
        distinguishing_aspect: "A freshly created Subscription starts billing_status PENDING_PAYMENT and fulfillment_status NOT_STARTED (both axes at their initial state)."
        test_recipe:
          setup: ["OPEN season, site, share, member"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-init", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 50 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "init@x.com", full_name: "Init", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.billing_status == PENDING_PAYMENT"
            - "Subscription.${sub_id}.fulfillment_status == NOT_STARTED"

      - name: clock_expires_offer_to_expired_system_transition
        claim_type: Side Effect Execution
        grounds: ["state_machines.WaitlistEntry.OFFERED_to_EXPIRED", "entities.WaitlistEntry.fields.offer_expires_at", "endpoints"]
        distinguishing_aspect: "Advancing the clock past offer_expires_at fires the system transition OFFERED→EXPIRED; the entry becomes EXPIRED and the slot reopens."
        test_recipe:
          setup: ["Season cap 5, site cap 5; a WAITING entry promoted to OFFERED at clock 2026-06-01 (offer_expires_at 2026-06-03)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-exp", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 5 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 5 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "exp@x.com", full_name: "Exp", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /waitlist-entries"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", requested_site_id: "${site_id}" }
              as: Anonymous
              captures: { wl_id: "$.data.id" }
            - call: "GET /seasons/${season_id}"
              as: DeliveryCoordinator
              captures: { sea_v: "$.data.version" }
            - call: "POST /seasons/${season_id}/promote-waitlist"
              payload: { share_type_id: "${share_id}", requested_site_id: "${site_id}", expected_season_version: "${sea_v}" }
              as: DeliveryCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "WaitlistEntry.${wl_id}.status == EXPIRED (clock past offer_expires_at fires system transition)"

      - name: accept_waitlist_when_waiting_not_offered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.WaitlistEntry", "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a WaitlistEntry still in WAITING (never promoted to OFFERED) → ERR_INVALID_STATE."
        test_recipe:
          setup: ["A WAITING waitlist entry (not promoted)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S-acc", week_count: 10, first_delivery_date: "2026-09-01T00:00:00Z", signup_close_date: "2026-12-25T00:00:00Z", total_share_capacity: 5 }
              as: FarmManager
              captures: { season_id: "$.data.id" }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Site", kind: "PICKUP", weekly_capacity: 5 }
              as: DeliveryCoordinator
              captures: { site_id: "$.data.id" }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "acc@x.com", full_name: "Acc", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: "$.data.id" }
            - call: "POST /waitlist-entries"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", requested_site_id: "${site_id}" }
              as: Anonymous
              captures: { wl_id: "$.data.id" }
          trigger:
            - call: "POST /waitlist-entries/${wl_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_covered_by_difficulty
        claim_type: Idempotency
        grounds: ["state_machines.Subscription", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / not_owner_beats_invalid_state_auth_vs_state
          rationale: "The owner-vs-state precedence on a second cancel of a CANCELLED subscription is exercised by that §1.8 instance; the owner path reaches the ERR_INVALID_STATE corner."

  # ===========================================================================
  # §1.9.3 Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: home_delivery_surcharge_charged_full_season
        claim_type: Correct Result
        grounds: ["entities.PickupSite.fields.delivery_surcharge_cents", "state_machines.Subscription.PENDING_PAYMENT_to_CONFIRMED", "entities.LedgerEntry"]
        distinguishing_aspect: "Confirming on a HOME_DELIVERY site posts CHARGE_SURCHARGE = delivery_surcharge_cents 500 × week_count 10 = 5000, added to outstanding."
        test_recipe:
