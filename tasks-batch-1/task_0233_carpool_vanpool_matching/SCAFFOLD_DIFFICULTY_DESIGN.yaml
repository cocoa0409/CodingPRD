# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Carpool & Vanpool Matching — Expert tier
# 9 rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_share_estimate_vs_final_diverges_on_no_show
        grounds:
          - calculations.cost_share
          - entities.Reservation.fields.estimate_cost_share_cents
          - entities.Reservation.fields.final_cost_share_cents
          - state_machines.Trip.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Same trip, same rider seat: ESTIMATE divides cost over forward-looking RESERVED seats while FINAL divides over only COMPLETED seats, so a co-rider no-show makes final_cost_share_cents (3200) strictly exceed estimate_cost_share_cents (1600) on the Reservation domain."
        test_recipe:
          setup:
            - "EmployerProgram ACTIVE; driver Member can_drive; Vehicle seat_capacity=6; Pool ACTIVE base_cost_cents=2000 per_mile_cents=120."
            - "Trip SCHEDULED distance_miles=10.0 (total_cost_cents=3200)."
            - "Rider R1 and Rider R2 each reserve 1 seat pay_now (R1 estimate=3200 then R2 reduces nothing on R1 — R1 estimate stays as computed at its own create=3200, R2 estimate=1600)."
            - "Trip opens boarding; R1 checks in; R2 stays RESERVED; on depart R2 -> NO_SHOW; on complete only R1 completes (N_final=1)."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee Driver", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae One", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 10000 }
              as: ProgramAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae Two", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 10000 }
              as: ProgramAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6, hov_eligible: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r1_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r1_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0, hov_lane_used: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r1_id}", expected_trip_version: "${trip_v0}", seat_count: 1, pay_now: true }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { res1_id: $.data.id, res1_est: $.data.estimate_cost_share_cents, trip_v1: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r2_id}", expected_trip_version: "${trip_v1}", seat_count: 1, pay_now: true }
              as: Rider
              as_user_id: "${r2_id}"
              captures: { res2_id: $.data.id }
            - call: "POST /trips/${trip_id}/open-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /reservations/${res1_id}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: { hov_lane_used: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_status: $.data.status }
          assert:
            - "Reservation.${res1_id}.estimate_cost_share_cents == 3200"
            - "Reservation.${res1_id}.final_cost_share_cents == 3200"
            - "Reservation.${res2_id}.reservation_status == NO_SHOW"
            - "Reservation.${res1_id}.final_cost_share_cents != Reservation.${res2_id}.estimate_cost_share_cents"

      - name: reliability_provisional_vs_confirmed_diverges_on_pending
        grounds:
          - calculations.reliability_score
          - entities.Member.fields.reliability_score
          - state_machines.Reservation.RESERVED_to_NO_SHOW
        distinguishing_aspect: "On the Member domain (distinct from cost_share's Reservation domain), CONFIRMED reliability counts only realized events (85.0 after one NO_SHOW) while PROVISIONAL adds +2.0 per outstanding RESERVED reservation, yielding 87.0 — a non-zero delta driven purely by pending state."
        test_recipe:
          setup:
            - "Rider R with one realized NO_SHOW (reliability_score CONFIRMED = 85.0)."
            - "R holds one additional RESERVED reservation on a different future trip (no realized event yet)."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee Driver", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip1_id: $.data.id, trip1_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip1_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip1_v0}", seat_count: 1 }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /trips/${trip1_id}/open-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip1_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-10T15:00:00Z", duration_min: 40, distance_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip2_id: $.data.id, trip2_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip2_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip2_v0}", seat_count: 1 }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res2_id: $.data.id }
          trigger:
            - call: "GET /members/${r_id}/reliability?mode=confirmed"
              payload: {}
              as: Rider
              as_user_id: "${r_id}"
              captures: { confirmed_score: $.data.reliability_score }
            - call: "GET /members/${r_id}/reliability?mode=provisional"
              payload: {}
              as: Rider
              as_user_id: "${r_id}"
              captures: { provisional_score: $.data.reliability_score }
          assert:
            - "Member.${r_id}.reliability_score == 85.0"
            - "confirmed_score == 85.0"
            - "provisional_score == 87.0"
            - "provisional_score != confirmed_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cost_share_tiered_occupancy_nonlinear_mode_a
        grounds:
          - calculations.cost_share
          - calculations.trip_total_cost
          - entities.Trip.fields.total_cost_cents
        distinguishing_aspect: "Mode (a): cost_share takes ≥3 inputs (total_cost, occupancy N, seat_count) with a non-linear tiered factor branch (0.80/0.90/1.00) selected by N, so N=4 yields 1000 cents while N=3 yields 1500 cents on the same 5000-cent trip."
        test_recipe:
          setup:
            - "Pool ACTIVE base_cost_cents=3000 per_mile_cents=100; Trip distance_miles=20.0 (total_cost_cents=5000)."
            - "Four riders reserve 1 seat each so the 4th reservation sees forward-looking N=4 (tier 0.80)."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "R1", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "R2", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "R3", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r3_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "R4", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r4_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 3000, per_mile_cents: 100 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r1_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r1_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 20.0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r1_id}", expected_trip_version: "${trip_v0}", seat_count: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { res1_id: $.data.id, trip_v1: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r2_id}", expected_trip_version: "${trip_v1}", seat_count: 1 }
              as: Rider
              as_user_id: "${r2_id}"
              captures: { res2_id: $.data.id, trip_v2: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r3_id}", expected_trip_version: "${trip_v2}", seat_count: 1 }
              as: Rider
              as_user_id: "${r3_id}"
              captures: { res3_id: $.data.id, trip_v3: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r4_id}", expected_trip_version: "${trip_v3}", seat_count: 1 }
              as: Rider
              as_user_id: "${r4_id}"
              captures: { res4_id: $.data.id, res4_est: $.data.estimate_cost_share_cents }
          assert:
            - "Trip.${trip_id}.total_cost_cents == 5000"
            - "Reservation.${res4_id}.estimate_cost_share_cents == 1000"
            - "res4_est == 1000"

      - name: subsidy_per_layer_rounding_order_mode_b
        grounds:
          - calculations.subsidy
          - entities.Reservation.fields.final_subsidy_cents
          - state_machines.Trip.IN_TRANSIT_to_COMPLETED
        distinguishing_aspect: "Mode (b): subsidy pins per-layer rounding (round hov_part then round match_part then sum) so final_subsidy_cents == 1001 for a 1505-cent share at hov_pct=0.50/match_pct=0.33, which differs from the single-round naive value 1249."
        test_recipe:
          setup:
            - "EmployerProgram hov_discount_pct=0.50 employer_match_pct=0.33 monthly_benefit_cap_cents=100000 subsidy_budget_cents=1000000."
            - "Pool base_cost_cents=505 per_mile_cents=100 distance=10.0 -> total_cost_cents=1505; single rider completes alone (N_final=1) so final cost_share=1505; HOV used."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.33, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6, hov_eligible: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 505, per_mile_cents: 100 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0, hov_lane_used: true }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip_v0}", seat_count: 1, pay_now: true }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_id: $.data.id }
            - call: "POST /trips/${trip_id}/open-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: { hov_lane_used: true }
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "Reservation.${res_id}.final_cost_share_cents == 1505"
            - "Reservation.${res_id}.final_subsidy_cents == 1001"
            - "Reservation.${res_id}.net_charge_cents == 504"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_status_axes_evolve_independently
        grounds:
          - state_machines.Reservation
          - entities.Reservation.fields.reservation_status
          - entities.Reservation.fields.payment_status
        distinguishing_aspect: "Reservation carries two independent axes: after pay_now reservation_status==RESERVED while payment_status==CHARGED, then a no-show advances reservation_status to NO_SHOW and payment_status to SETTLED — the two axes hold different values at the same instant, proving parallelism on the Reservation entity."
        test_recipe:
          setup:
            - "Rider reserves 1 seat pay_now on a SCHEDULED trip (reservation_status=RESERVED, payment_status=CHARGED)."
            - "Trip opens boarding and departs with the rider still RESERVED -> NO_SHOW; charged amount retained as penalty -> payment_status SETTLED."
          setup_api_calls:
            - call: "POST /employer-programs"
              payload: { employer_name: "Acme", hov_discount_pct: 0.50, employer_match_pct: 0.30, monthly_benefit_cap_cents: 100000, grh_annual_cap_cents: 20000, grh_per_event_cap_cents: 6000, subsidy_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Dee", home_zone: "Z-N", work_zone: "Z-DT", can_drive: true }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /members"
              payload: { employer_program_id: "${prog_id}", full_name: "Rae", home_zone: "Z-N", work_zone: "Z-DT", wallet_balance_cents: 50000 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_member_id: "${drv_id}", plate: "VAN-1", seat_capacity: 6 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /pools"
              payload: { employer_program_id: "${prog_id}", driver_member_id: "${drv_id}", vehicle_id: "${veh_id}", kind: "VANPOOL", origin_zone: "Z-N", dest_zone: "Z-DT", departure_days: ["MON","TUE","WED","THU","FRI"], base_cost_cents: 2000, per_mile_cents: 120 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { pool_id: $.data.id, pool_v0: $.data.version }
            - call: "POST /memberships"
              payload: { pool_id: "${pool_id}", rider_member_id: "${r_id}", expected_pool_version: "${pool_v0}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /pools/${pool_id}/activate"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { pool_id: "${pool_id}", departure_at: "2026-06-09T15:00:00Z", duration_min: 40, distance_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", rider_member_id: "${r_id}", expected_trip_version: "${trip_v0}", seat_count: 1, pay_now: true }
              as: Rider
              as_user_id: "${r_id}"
              captures: { res_id: $.data.id, res_pay: $.data.payment_status, res_resv: $.data.reservation_status }
            - call: "POST /trips/${trip_id}/open-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "res_resv == RESERVED"
            - "res_pay == CHARGED"
            - "Reservation.${res_id}.reservation_status == NO_SHOW"
            - "Reservation.${res_id}.payment_status == SETTLED"

      - name: matchrequest_cyclic_matched_to_open_revert
        grounds:
          - state_machines.MatchRequest.MATCHED_to_OPEN
          - state_machines.MatchRequest.OPEN_to_MATCHED
          - calculations.match_score
        distinguishing_aspect: "MatchRequest (distinct entity from Reservation) is cyclic: match selects PoolA -> MATCHED, reject reverts MATCHED -> OPEN and excludes PoolA, and a second match selects the next-best PoolB, proving an A->B->A loop returns to OPEN rather than a terminal state."
