        distinguishing_aspect: "On LOT-A (5 units: 3 from Northwind, 2 from Southpaw) with exactly one traced Northwind unit, TRACE_ATTRIBUTED counts 1 unit for 2500 while LOT_PRORATED counts 1 * 3/5 = 0.60 units for 1500."
        test_recipe:
          setup: ["Northwind shipped SN-0001/SN-0003/SN-0004 and Southpaw shipped SN-0005/SN-0006, all in lot LOT-A; SN-0001 is TRACED_UNAUTHORIZED; Northwind diversion_score 0 so the tier is 2500."]
