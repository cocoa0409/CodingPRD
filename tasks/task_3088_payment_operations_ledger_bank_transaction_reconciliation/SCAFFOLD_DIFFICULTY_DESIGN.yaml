- rule_id: resource_temporal_overlap
  instances:
  - name: calendar_cell_second_cutoff_rejected_within_buffer
    grounds:
    - validations[priority=18]
    - errors[ERR_LINE_ALREADY_MATCHED]
    - entities.BankingCalendar.fields.cutoffs
    - entities.BankingCalendar.fields.calendar_date
