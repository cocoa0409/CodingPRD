            - "the refusal does not consume the token: Appraiser.${apr_a_id}.version is still ${apr_a_v2} and panel_membership_count is still 1"
            - "NV enrolment: HTTP 201 with status ACTIVE and coverage_state NV"
            - "Appraiser.${apr_a_id}.panel_membership_count == 2 and version == ${apr_a_v2} + 1 after the accepted enrolment"

      - name: error_revision_exceeds_cap_at_and_above_the_bound_rejected
