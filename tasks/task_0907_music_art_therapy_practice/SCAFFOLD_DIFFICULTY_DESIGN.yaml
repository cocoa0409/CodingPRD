            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/enrollments"
