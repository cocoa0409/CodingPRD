              payload: { member_label: "dev1" }
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /seat-subscriptions/${sub_id}/assign"
              payload: { member_label: "dev2" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEAT_CAPACITY"
            - "SeatSubscription.${sub_id}.subscription_status == EXHAUSTED"
            - "SeatSubscription.${sub_id}.available_seats == 0 and active_seats == 1"

