              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-12" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /procurement/vendor-scorecards"
              payload: { vendor_id: "${v_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", on_time_variant: "STRICT" }
              as: ProcurementAdmin
              captures: { sc_id: $.data.id }
          assert:
            - "VendorScorecard.${sc_id}.on_time_rate_pct == 100 (empty receipt set defaults to 100)"

  # ===========================================================================
  # RULE 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rfq_award_requires_requisition_approved
        grounds:
          - state_machines.RFQ.transitions.OPEN_to_AWARDED
          - validations[priority=8]
          - errors[ERR_REQUISITION_NOT_APPROVED]
          - entities.Requisition.fields.status
        distinguishing_aspect: |
          PAIR RFQ -> Requisition: an RFQ can only move OPEN->AWARDED while its parent
          Requisition.status == APPROVED. Awarding while the requisition is still
          PENDING_APPROVAL is rejected with ERR_REQUISITION_NOT_APPROVED. A different entity
          pair than GoodsReceipt -> PurchaseOrder.
        test_recipe:
          setup:
            - "A Requisition is PENDING_APPROVAL (submitted, not yet approved) with an OPEN RFQ and one SUBMITTED Quote."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-13" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE13", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Nails", lines: [ { sku: "A", description: "Nail", quantity: 3, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-10T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-02T00:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_REQUISITION_NOT_APPROVED"
            - "RFQ.${rfq_id}.status == OPEN (unchanged)"

      - name: goods_receipt_requires_purchase_order_issued
        grounds:
          - state_machines.GoodsReceipt.transitions.POSTED_creation
          - state_machines.PurchaseOrder.transitions.ISSUED_to_CLOSED
          - entities.PurchaseOrder.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          PAIR GoodsReceipt -> PurchaseOrder: posting a GoodsReceipt requires
          PurchaseOrder.status == ISSUED. Posting against a CLOSED PO is rejected with
          ERR_INVALID_STATE. A different entity pair than RFQ -> Requisition.
        test_recipe:
          setup:
            - "A STANDARD PO is fully received then CLOSED (status CLOSED)."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-14" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE14", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Screws", lines: [ { sku: "A", description: "Screw", quantity: 2, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 2 } ], received_at: "2026-03-02T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr1_id: $.data.id }
            - call: "POST /procurement/purchase-orders/${po_id}/close"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
          trigger:
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 1 } ], received_at: "2026-03-03T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "PurchaseOrder.${po_id}.status == CLOSED (unchanged)"

  # ===========================================================================
  # RULE 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: blanket_po_closed_interval_adjacency_counts_as_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_BLANKET_PERIOD_OVERLAP]
          - entities.PurchaseOrder.fields.valid_from
          - entities.PurchaseOrder.fields.valid_to
        distinguishing_aspect: |
          CLOSED-interval semantics on PurchaseOrder: blanket validity is [valid_from, valid_to]
          inclusive at BOTH ends for the same (vendor, spend_category), so adjacency COUNTS as
          overlap — a second blanket starting exactly on the first's valid_to is rejected with
          ERR_BLANKET_PERIOD_OVERLAP. Different interval arithmetic and resource than the
          half-open scorecard period.
        test_recipe:
          setup:
            - "An ISSUED BLANKET PO for (vendor V, category CAT) with valid_from=2026-03-01 valid_to=2026-03-31 exists."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-15" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE15", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "BLANKET", ceiling_amount_cents: 1000000, valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-03-31T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po1_id: $.data.id }
          trigger:
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "BLANKET", ceiling_amount_cents: 500000, valid_from: "2026-03-31T00:00:00Z", valid_to: "2026-04-30T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_BLANKET_PERIOD_OVERLAP (adjacency at valid_to == new valid_from collides under closed-interval semantics)"

      - name: scorecard_half_open_period_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_SCORECARD_PERIOD_OVERLAP]
          - entities.VendorScorecard.fields.period_start
          - entities.VendorScorecard.fields.period_end
        distinguishing_aspect: |
          HALF-OPEN interval semantics on VendorScorecard: periods are [period_start, period_end)
          for one vendor, so adjacency (new period_start == prior period_end) is ALLOWED, but a
          true interior overlap is rejected with ERR_SCORECARD_PERIOD_OVERLAP. The geometric
          treatment of adjacency is opposite to the closed-interval blanket rule, on a different
          resource.
        test_recipe:
          setup:
            - "A FINAL VendorScorecard for vendor V covers [2026-03-01, 2026-03-31)."
            - "An adjacent scorecard [2026-03-31, 2026-04-30) is created successfully (adjacency allowed)."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-16" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/vendor-scorecards"
              payload: { vendor_id: "${v_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", on_time_variant: "STRICT" }
              as: ProcurementAdmin
              captures: { sc1_id: $.data.id }
            - call: "POST /procurement/vendor-scorecards"
              payload: { vendor_id: "${v_id}", period_start: "2026-03-31T00:00:00Z", period_end: "2026-04-30T00:00:00Z", on_time_variant: "STRICT" }
              as: ProcurementAdmin
              captures: { sc2_id: $.data.id }
          trigger:
            - call: "POST /procurement/vendor-scorecards"
              payload: { vendor_id: "${v_id}", period_start: "2026-03-15T00:00:00Z", period_end: "2026-04-15T00:00:00Z", on_time_variant: "STRICT" }
              as: ProcurementAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent scorecard sc2 was created with HTTP 201 (period_start == prior period_end is allowed under half-open semantics)"
            - "the interior-overlap trigger returns HTTP 409 with error_id == ERR_SCORECARD_PERIOD_OVERLAP"

  # ===========================================================================
  # RULE 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: blanket_remaining_ceiling_conserved_on_release_create_then_cancel
        grounds:
          - state_machines.PurchaseOrder.transitions.ISSUED_creation
          - state_machines.ReleaseOrder.transitions.OPEN_to_CANCELLED
          - entities.PurchaseOrder.fields.remaining_amount_cents
          - concurrency_rules[release-create-stale-blanket]
        distinguishing_aspect: |
          CONSERVED QUANTITY = blanket remaining_amount_cents. Forward action (create release
          drawing amount_cents) debits remaining_amount_cents; the compensating action (cancel the
          OPEN release) restores it by += amount_cents. The invariant
          remaining_amount_cents == ceiling_amount_cents - sum(non-cancelled ReleaseOrder.amount_cents)
          MUST hold exactly after the round trip: ceiling 1000000 -> 700000 after a 300000 release
          -> back to 1000000 after cancel. A different conserved quantity than the PO received-qty
          ledger.
        test_recipe:
          setup:
            - "An ISSUED BLANKET PO with ceiling_amount_cents=1000000 and remaining_amount_cents=1000000 (version 1)."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-17" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE17", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "BLANKET", ceiling_amount_cents: 1000000, valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-03-31T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id, po_v0: $.data.version }
            - call: "POST /procurement/release-orders"
              payload: { blanket_po_id: "${po_id}", amount_cents: 300000, lines: [ { sku: "A", quantity: 3, unit_price_cents: 100000 } ], expected_purchase_order_version: "${po_v0}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /procurement/release-orders/${rel_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "GET /procurement/purchase-orders/${po_id}"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { remaining_final: $.data.remaining_amount_cents }
          assert:
            - "after the release create, PurchaseOrder.${po_id}.remaining_amount_cents == 700000"
            - "after the cancel, PurchaseOrder.${po_id}.remaining_amount_cents == 1000000 (fully restored to ceiling)"
            - "ReleaseOrder.${rel_id}.status == CANCELLED"

      - name: po_received_quantity_ledger_conserved_on_receipt_post_then_reverse
        grounds:
          - state_machines.GoodsReceipt.transitions.POSTED_creation
          - state_machines.GoodsReceipt.transitions.POSTED_to_REVERSED
          - entities.PurchaseOrder.fields.lines
        distinguishing_aspect: |
          CONSERVED QUANTITY = the PO line received_total ledger (a quantity, not money). Posting a
          receipt increments received_total by received_qty per sku; reversing it decrements by the
          same per-sku quantity. After post(2)+reverse the sku=A received_total MUST return to 0,
          leaving zero drift. A different conserved quantity than the blanket money ceiling.
        test_recipe:
          setup:
            - "A STANDARD PO with sku=A ordered qty=5 unit_price_cents=1000, no receipts yet (received_total 0)."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-18" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE18", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Rods", lines: [ { sku: "A", description: "Rod", quantity: 5, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 2 } ], received_at: "2026-03-02T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr_id: $.data.id }
          trigger:
            - call: "POST /procurement/goods-receipts/${gr_id}/reverse"
              payload: {}
              as: Receiver
              as_user_id: "receiver-r1"
            - call: "GET /procurement/purchase-orders/${po_id}"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
          assert:
            - "after the receipt post, the PO line for sku=A has received_total == 2"
            - "after the reverse, the PO line for sku=A has received_total == 0 (ledger fully restored, no drift)"
            - "GoodsReceipt.${gr_id}.status == REVERSED"
