            - "Interview.${iv_id}.status == SCHEDULED with completed_at == null and attested_at == null"
            - "ReclassificationCase.${case_id}.pay_conversion_status == PENDING"
            - "ReclassificationCase.${case_id}.communication_status == NOT_STARTED"
            - "ReclassificationCase.${case_id}.case_status == OPEN"
            - "ReclassificationCase.${case_id}.exposure_cents == 0 and converted_hourly_rate_cents == null"
