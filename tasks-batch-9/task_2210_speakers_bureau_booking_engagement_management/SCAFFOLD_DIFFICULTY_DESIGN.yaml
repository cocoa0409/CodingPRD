            - "the ROLLING read returns score == 3.98 (0.625 * 3.60 + 0.375 * 4.60 == 3.975, round_half_up to 2dp) with feedback_count == 2"
            - "the LIFETIME read returns score == 4.10 ((4.60 + 3.60) / 2)"
            - "GET /speakers/${sp} returns rolling_score == 3.98 and lifetime_score == 4.10 — the stored fields match the two variant reads"
            - "the two variants differ by exactly 0.12 on identical input rows, and the ROLLING variant is the one that gates roster_tier: roster_tier == BRONZE because rolling_score 3.98 < 4.00 even though lifetime_score 4.10 clears it"

  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_surcharge_rounds_each_invoice_line_before_summing
        grounds:
          - calculations.invoice_surcharge_rounding
          - entities.Invoice.fields.surcharge_cents
          - entities.Invoice.fields.amount_due_cents
          - state_machines.Engagement.CONTRACTED_to_DELIVERED
        distinguishing_aspect: |
          Mode (b) — rounding-order sensitivity. The scaffold pins round-then-sum across the
          three invoice lines: 22313 + 6125 + 1116 == 29554, while the equally plausible
          sum-then-round reading round_half_up(1688750 * 0.0175) == 29553 differs by exactly
          one cent, which then propagates into amount_due_cents.
        test_recipe:
          setup:
            - "Engagement CONTRACTED with quoted_fee_cents 1275000, recording_fee_cents 350000 and one APPROVED travel expense worth 63750"
            - "Logical clock moved past event_end_utc so delivery is permitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
            - call: "POST /proposal-options"
              payload: { proposal_id: "${pr}", speaker_id: "${sp}", quoted_fee_cents: 1275000, rank_no: 1, travel_allowance_cents: 70000 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { opt: $.data.id }
            - call: "POST /proposals/${pr}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /proposals/${pr}/select"
              payload: { option_id: "${opt}" }
              as: Client
              as_user_id: "${cl}"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/confirm"
              payload: {}
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /engagements/${eng}/contracts"
              payload: { cancellation_schedule_code: "STANDARD", travel_policy_code: "POLICY_A", recording_rights: "FULL_BUY_OUT", recording_fee_cents: 350000, technical_rider_code: "STAGE_PLUS", exclusivity_days: 90 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/send"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "Dana Reyes" }
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "M. Okafor" }
              as: Client
              as_user_id: "${cl}"
            - call: "POST /engagements/${eng}/travel-expenses"
              payload: { receipts_cents: 63750, travel_days: 1, distance_band: "REGIONAL", memo: "rail + hotel" }
              as: Speaker
              as_user_id: "${sp}"
              captures: { tx: $.data.id }
            - call: "POST /travel-expenses/${tx}/approve"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { reimb: $.data.reimbursable_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T20:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /engagements/${eng}/deliver"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "GET /invoices?engagement_id=${eng}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inv: "$.data[0].id", sur: "$.data[0].surcharge_cents", due: "$.data[0].amount_due_cents" }
          assert:
            - "the approved travel expense carries reimbursable_cents == 63750"
            - "the invoice lines are fee_line_cents == 1275000, recording_line_cents == 350000, travel_line_cents == 63750"
            - "surcharge_cents == 29554 — round_half_up(1275000*0.0175)=22313 plus round_half_up(350000*0.0175)=6125 plus round_half_up(63750*0.0175)=1116"
            - "surcharge_cents is NOT 29553, the sum-then-round result of round_half_up(1688750 * 0.0175)"
            - "amount_due_cents == 1718304 == 1275000 + 350000 + 63750 + 29554, and amount_paid_cents == 0 with status ISSUED"

      - name: combinatorial_cancellation_rebate_precedes_commission_on_net
        grounds:
          - calculations.cancellation_settlement
          - entities.Engagement.fields.retention_net_cents
          - entities.Engagement.fields.retention_commission_cents
          - state_machines.Engagement.CONTRACTED_to_CANCELLED_BY_CLIENT
        distinguishing_aspect: |
          Mode (c) — multi-step pinned evaluation order. Six steps run days_before ->
          retention_pct -> gross retention -> rebate tier keyed on the GROSS figure -> net
          retention -> commission on the NET figure. Keying the rebate on the net figure or
          commissioning the gross figure both produce different stored numbers (commission on
          gross would be 159375 instead of 143438), so the ordering itself is what is asserted.
          Distinct from the surcharge instance, which pins rounding granularity, not step order.
        test_recipe:
          setup:
            - "Engagement CONTRACTED under a STANDARD cancellation ladder with quoted_fee_cents 1275000, no recording rights and no travel expenses"
            - "Logical clock at 2026-09-25T16:00:00Z — exactly 20 whole days before the 2026-10-15T16:00:00Z event start"
