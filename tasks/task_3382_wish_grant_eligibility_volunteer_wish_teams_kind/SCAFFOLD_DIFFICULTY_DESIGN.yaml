              payload: { wish_team_id: "${team2_id}", scheduled_start: "2026-09-06T09:00:00Z", scheduled_end: "2026-09-06T11:00:00Z", visit_method: "PLAY_BASED" }
              as: Volunteer
              as_user_id: "${v2_id}"
              captures: { visit2_id: $.data.id }
            - call: "POST /wish-grant/wish-visits/${visit2_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "a shopping spree", captured_wish_type: "RECEIVE_ITEM" }
              as: Volunteer
              as_user_id: "${v2_id}"
            - call: "GET /wish-grant/wishes/${wish2_id}"
              as: WishCoordinator
              captures: { wish2_v2: $.data.version }
            - call: "POST /wish-grant/fulfillment-plans"
              payload: { wish_id: "${wish2_id}", cash_cost_cents: 1000001, expected_wish_version: "${wish2_v2}" }
              as: WishCoordinator
              as_user_id: "coord-1"
              captures: { plan2_id: $.data.id }
            - call: "POST /wish-grant/fulfillment-plans/${plan2_id}/submit"
              payload: {}
              as: WishCoordinator
              as_user_id: "coord-1"
          trigger:
