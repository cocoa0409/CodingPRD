              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: IntakeCoordinator
              captures: { ver2: $.data.version }
            - call: "POST /psych-services/eligibility-meetings"
              payload: { evaluation_id: "${eval1}", school_id: "${s1}", scheduled_start_at: "2026-09-20T15:00:00Z", scheduled_end_at: "2026-09-20T16:00:00Z", expected_evaluation_version: "${ver2}" }
              as: IntakeCoordinator
              captures: { m1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
