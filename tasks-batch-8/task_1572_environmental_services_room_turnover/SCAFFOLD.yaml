  - method: GET
    path: "/evs/bed-ready-notifications"
    description: "List bed-ready notifications (filterable)"
    roles: [Any]
    code: 200
    input: ["bed_id?", "demand_id?", "status?", "limit?", "offset?"]
    output: "BedReadyNotification[]"
    side_effects: []

  - method: GET
    path: "/evs/bed-ready-notifications/{notification_id}"
    description: "Get a bed-ready notification"
    roles: [Any]
    code: 200
    input: []
    output: BedReadyNotification
    side_effects: []

  - method: POST
    path: "/evs/bed-ready-notifications/{notification_id}/acknowledge"
    description: "Acknowledge a SENT notification"
    roles: [BedPlacementCoordinator]
    code: 200
    input: []
    output: BedReadyNotification
    side_effects: ["status -> ACKNOWLEDGED"]

  # --- Placement demands ---
  - method: POST
    path: "/evs/placement-demands"
    description: "Create a placement demand (bed request from admission/transfer)"
    roles: [BedPlacementCoordinator]
    code: 201
    input: [unit_id, required_bed_kind, urgency_tier, needed_by]
    output: PlacementDemand
    side_effects: ["priority_score computed; matching-kind QUEUED CleanRequests in the unit recompute tier/score"]

  - method: GET
    path: "/evs/placement-demands"
    description: "List placement demands (filterable)"
    roles: [Any]
    code: 200
    input: ["unit_id?", "status?", "matched_bed_id?", "required_bed_kind?", "limit?", "offset?"]
    output: "PlacementDemand[]"
    side_effects: []

  - method: GET
    path: "/evs/placement-demands/{demand_id}"
    description: "Get a placement demand"
    roles: [Any]
    code: 200
    input: []
    output: PlacementDemand
    side_effects: []

  - method: POST
    path: "/evs/placement-demands/{demand_id}/cancel"
    description: "Cancel an OPEN or MATCHED demand (MATCHED cancel retracts the notification)"
    roles: [BedPlacementCoordinator]
    code: 200
    input: []
    output: PlacementDemand
    side_effects: ["status -> CANCELLED; notification RETRACTED if matched; queue scores recomputed"]

  - method: POST
    path: "/evs/placement-demands/{demand_id}/regrade"
    description: "Change a demand's urgency tier (recomputes its score and matching-kind queue priorities)"
    roles: [BedPlacementCoordinator]
    code: 200
    input: [urgency_tier]
    output: PlacementDemand
    side_effects: ["urgency_tier updated; priority_score recomputed"]

  # --- Clean standards ---
  - method: POST
    path: "/evs/clean-standards"
    description: "Create the standard row for a clean type (one per type)"
    roles: [EVSAdministrator]
    code: 201
    input: [clean_type, base_minutes, outbreak_multiplier_bps, atp_rlu_threshold]
    output: CleanStandard
    side_effects: []

  - method: GET
    path: "/evs/clean-standards"
    description: "List clean standards"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CleanStandard[]"
    side_effects: []

  - method: GET
    path: "/evs/clean-standards/{clean_type}"
    description: "Get the standard for a clean type"
    roles: [Any]
    code: 200
    input: []
    output: CleanStandard
    side_effects: []

  - method: PUT
    path: "/evs/clean-standards/{clean_type}"
    description: "Update a clean standard (OCC-guarded; in-flight requests keep their pinned values)"
    roles: [EVSAdministrator]
    code: 200
    input: [base_minutes, outbreak_multiplier_bps, atp_rlu_threshold, expected_standard_version]
    output: CleanStandard
    side_effects: ["increments CleanStandard.version by 1; future pins and current_estimate_minutes use the new row"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / context ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, out-of-range value, or unknown enum member in the request body" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "MaintenanceWindow end_at <= start_at" }
  - { id: ERR_AUDIT_METHOD_FIELD_MISMATCH, http: 400, condition: "ATP_SWAB audit missing rlu_reading (or carrying marker_fraction_removed); FLUORESCENT_MARKER audit missing marker_fraction_removed (or carrying rlu_reading)" }
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "set_current_utc with to_iso8601 earlier than the current logical time" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "X-User-Role not in the endpoint's role list" }
  - { id: ERR_ROLE_CAPABILITY_MISMATCH, http: 403, condition: "Entity-backed role's StaffMember lacks the required capability (CLEAN for EVSTechnician, AUDIT for QualityAuditor)" }
  - { id: ERR_NOT_ASSIGNED_TECHNICIAN, http: 403, condition: "start/complete attempted by an EVSTechnician whose X-User-ID is not the request's assigned_staff_id" }
  - { id: ERR_STAFF_IDENTITY_MISMATCH, http: 403, condition: "clock-in/clock-out/break-start/break-end with X-User-ID != path staff_id" }

  # --- Existence (404) ---
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "unit_id does not exist" }
  - { id: ERR_BED_NOT_FOUND, http: 404, condition: "bed_id does not exist" }
  - { id: ERR_CLEAN_REQUEST_NOT_FOUND, http: 404, condition: "request_id / clean_request_id does not exist" }
  - { id: ERR_PLACEMENT_DEMAND_NOT_FOUND, http: 404, condition: "demand_id does not exist" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "staff_id (path, body, or X-User-ID for entity-backed roles) does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "audit_id does not exist" }
  - { id: ERR_SUPPLY_ITEM_NOT_FOUND, http: 404, condition: "item_id does not exist" }
  - { id: ERR_OUTBREAK_NOT_FOUND, http: 404, condition: "event_id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "notification_id does not exist" }
  - { id: ERR_STANDARD_NOT_FOUND, http: 404, condition: "clean_type path value has no CleanStandard row, or a clean request is created for a clean_type with no standard" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "window_id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "snapshot_id does not exist" }

  # --- State (409) ---
  - { id: ERR_REQUEST_ALREADY_TERMINAL, http: 409, condition: "CleanRequest is VERIFIED or CANCELLED; checked before wrong-state errors" }
  - { id: ERR_REQUEST_NOT_QUEUED, http: 409, condition: "assign requires status QUEUED or NEEDS_RECLEAN" }
  - { id: ERR_REQUEST_NOT_ASSIGNED, http: 409, condition: "start/unassign/reassign require status ASSIGNED" }
  - { id: ERR_REQUEST_NOT_IN_PROGRESS, http: 409, condition: "complete requires status IN_PROGRESS" }
  - { id: ERR_REQUEST_NOT_PENDING_QA, http: 409, condition: "audit submission requires status PENDING_QA" }
  - { id: ERR_BED_NOT_OCCUPIED, http: 409, condition: "discharge requires bed_status OCCUPIED" }
  - { id: ERR_BED_NOT_READY, http: 409, condition: "admit and mark-soiled require bed_status READY" }
  - { id: ERR_BED_NOT_DIRTY, http: 409, condition: "manual clean-request creation requires bed_status VACANT_DIRTY" }
  - { id: ERR_BED_NOT_AVAILABLE_FOR_MAINTENANCE, http: 409, condition: "maintenance activation requires bed_status IN {VACANT_DIRTY, READY}" }
  - { id: ERR_STAFF_NOT_ON_SHIFT, http: 409, condition: "start/pull require ON_SHIFT; break-start requires ON_SHIFT" }
  - { id: ERR_STAFF_NOT_ON_BREAK, http: 409, condition: "break-end requires ON_BREAK" }
  - { id: ERR_STAFF_ALREADY_ON_SHIFT, http: 409, condition: "clock-in requires OFF_SHIFT" }
  - { id: ERR_STAFF_HAS_ACTIVE_CLEANS, http: 409, condition: "clock-out blocked by ASSIGNED/IN_PROGRESS cleans; break-start blocked by IN_PROGRESS cleans" }
  - { id: ERR_DEMAND_NOT_OPEN, http: 409, condition: "regrade requires OPEN; cancel requires OPEN or MATCHED" }
  - { id: ERR_NOTIFICATION_NOT_SENT, http: 409, condition: "acknowledge requires SENT" }
  - { id: ERR_OUTBREAK_INVALID_STATE, http: 409, condition: "activate/cancel require DECLARED; lift requires ACTIVE" }
  - { id: ERR_WINDOW_INVALID_STATE, http: 409, condition: "activate/cancel require SCHEDULED; close requires ACTIVE" }
  - { id: ERR_AUDIT_NOT_SUBMITTED, http: 409, condition: "void requires audit_status SUBMITTED" }
  - { id: ERR_AUDIT_NOT_VOIDABLE, http: 409, condition: "void requires result FAIL and linked request still NEEDS_RECLEAN" }
  - { id: ERR_AUDIT_VOID_WINDOW_CLOSED, http: 409, condition: "void requires created_ops_run_index == unit.ops_run_index (an ops-run has since closed)" }

  # --- Business: safety (422) ---
  - { id: ERR_STAFF_CERTIFICATION_MISMATCH, http: 422, condition: "Staff certifications do not cover the clean_type (ISOLATION needs ISO_CERT, TERMINAL needs TERMINAL_CERT)" }
  - { id: ERR_STAFF_NOT_STAT_ELIGIBLE, http: 422, condition: "STAT-tier assignment requires staff.stat_eligible == true" }
  - { id: ERR_RECLEAN_SAME_TECHNICIAN, http: 422, condition: "Reclean assignment from NEEDS_RECLEAN must target a different staff member than last_completed_by_staff_id" }
  - { id: ERR_AUDITOR_IS_CLEANER, http: 422, condition: "Segregation of duties: the auditor (X-User-ID) equals the request's last_completed_by_staff_id" }

  # --- Business: temporal / referential / constraint ---
  - { id: ERR_STAFF_DOUBLE_BOOKED, http: 409, condition: "Planned window violates the 10-minute buffer rule against the staff's other ASSIGNED/IN_PROGRESS windows" }
  - { id: ERR_OPEN_REQUEST_EXISTS, http: 409, condition: "Bed already has an open CleanRequest, or maintenance activation attempted with one open" }
  - { id: ERR_INSUFFICIENT_SUPPLY, http: 422, condition: "A BOM line fails on_hand_quantity - reserved_quantity >= line quantity at start" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Maintenance window would push the unit past its aggregate out-of-service cap" }
  - { id: ERR_DUPLICATE_STANDARD, http: 409, condition: "A CleanStandard row already exists for this clean_type" }
  - { id: ERR_OUTBREAK_ALREADY_ACTIVE, http: 409, condition: "Unit already has an ACTIVE OutbreakEvent" }
  - { id: ERR_QUEUE_EMPTY, http: 409, condition: "pull found no eligible QUEUED request for the pulling technician" }

  # --- Concurrency (412) ---
  - { id: ERR_STALE_REQUEST_VERSION, http: 412, condition: "expected_clean_request_version does not match the request's current version" }
  - { id: ERR_STALE_SUPPLY_VERSION, http: 412, condition: "expected_supply_item_version does not match the item's current version" }
  - { id: ERR_STALE_STANDARD_VERSION, http: 412, condition: "expected_standard_version does not match the standard's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EVSAdministrator
    description: "EVS department administrator; owns configuration (units, beds, staff registry, clean standards, supplies), maintenance windows, ops-runs, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /evs/units"
      - "POST /evs/units/{unit_id}/ops-runs"
      - "POST /evs/beds"
      - "POST /evs/maintenance-windows (+ activate/close/cancel)"
      - "POST /evs/staff"
      - "POST /evs/supply-items (+ restock, recount)"
      - "POST /evs/clean-standards; PUT /evs/clean-standards/{clean_type}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (via Any)"

  - name: EVSDispatcher
    description: "EVS dispatcher; works the clean-request queue: manual creation, assignment, reassignment, unassignment, cancellation"
    identity: "opaque"
    exclusive_operations:
      - "POST /evs/clean-requests"
      - "POST /evs/clean-requests/{id}/assign, /reassign, /unassign, /cancel"
    shared_operations:
      - "All GET endpoints (via Any)"

  - name: EVSTechnician
    description: "EVS cleaning technician; starts/completes own assigned cleans, pulls work from the queue, manages own shift"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /evs/clean-requests/{id}/start, /complete (self-assigned only)"
      - "POST /evs/clean-requests/pull"
    shared_operations:
      - "POST /evs/staff/{id}/clock-in, /clock-out, /break-start, /break-end (shared with QualityAuditor; self only)"
      - "All GET endpoints (via Any)"

  - name: QualityAuditor
    description: "Infection-control quality auditor; submits ATP/fluorescent audit results. Segregation of duties: must not audit a clean they completed"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /evs/quality-audits"
    shared_operations:
      - "POST /evs/staff/{id}/clock-in, /clock-out, /break-start, /break-end (shared with EVSTechnician; self only)"
      - "All GET endpoints (via Any)"

  - name: BedPlacementCoordinator
    description: "Bed placement / patient flow coordinator; discharges and admits beds, manages placement demands, acknowledges bed-ready notifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /evs/beds/{id}/discharge, /admit, /mark-soiled"
      - "POST /evs/placement-demands (+ cancel, regrade)"
      - "POST /evs/bed-ready-notifications/{id}/acknowledge"
    shared_operations:
      - "All GET endpoints (via Any)"

  - name: InfectionPreventionist
    description: "Infection prevention officer; declares/activates/lifts outbreaks and voids erroneous audits"
    identity: "opaque"
    exclusive_operations:
      - "POST /evs/outbreak-events (+ activate, lift, cancel)"
      - "POST /evs/quality-audits/{id}/void"
    shared_operations:
      - "All GET endpoints (via Any)"

  - name: Any
    description: "Shared read access across all roles (used as the role value for all GET endpoints)"
    identity: "opaque"
    shared_operations:
      - "GET /evs/units(+/{id}, +/{id}/turnaround-snapshots), GET /evs/turnaround-snapshots/{id}"
      - "GET /evs/beds(+/{id}), GET /evs/maintenance-windows(+/{id})"
      - "GET /evs/clean-requests(+/{id}), GET /evs/staff(+/{id}, +/{id}/productivity)"
      - "GET /evs/quality-audits(+/{id}), GET /evs/supply-items(+/{id}), GET /evs/supply-ledger-entries(+/{id})"
      - "GET /evs/outbreak-events(+/{id}), GET /evs/bed-ready-notifications(+/{id})"
      - "GET /evs/placement-demands(+/{id}), GET /evs/clean-standards(+/{clean_type})"
