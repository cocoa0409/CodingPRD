            - call: "POST /sample-panels/${pn1}/submit"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { e21: "$.data.error_id" }
            - call: "POST /blends/${b1}/certify"
              payload: {}
              as: QualityManager
              as_user_id: "qual-001"
              captures: { b1_status: "$.data.status", delta_e: "$.data.panel_delta_e", certified_at: "$.data.certified_at" }
            - call: "POST /orders"
              payload: { order_code: "O2", jobsite_grid_x: 30, jobsite_grid_y: 30, requested_units: 2000, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { o2: "$.data.id", o2_flag: "$.data.requires_panel_approval" }
            - call: "POST /orders/${o2}/assign-plant"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
            - call: "POST /orders/${o2}/blends"
              payload: { blend_code: "B2", target_color_index_min: 48.00, target_color_index_max: 54.00, requested_units: 2000 }
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { b2: "$.data.id", b2v1: "$.data.version" }
            - call: "POST /blends/${b2}/components"
              payload: { fired_lot_id: "${l1}", units: 2000, expected_blend_version: "${b2v1}" }
              as: BlendTechnician
              as_user_id: "blend-001"
            - call: "POST /blends/${b2}/compose"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
            - call: "POST /blends/${b2}/certify"
              payload: {}
              as: QualityManager
              as_user_id: "qual-001"
              captures: { b2_status: "$.data.status", b2_delta: "$.data.panel_delta_e" }
          assert:
            - "${net} == 11600 and ${l1_units} == 11600 - one lot large enough to feed both orders (9600 + 2000)"
            - "${o1_flag} == true and ${o1_lead} == 22 == 14 + PANEL_APPROVAL_LEAD_DAYS 7 + ceil(9600 / 40000)"
            - "${pn1_status} == DRAFT then ${pn1_status_2} == SUBMITTED"
            - "${e22} == ERR_PANEL_NOT_APPROVED with HTTP 422 - the blend is COMPOSED and otherwise certifiable, but a SUBMITTED panel is not an APPROVED one"
            - "${pn1_status_3} == APPROVED with ${pinned_ver} == ${f1v3}, ${pinned_dye} == ${l1_dye}, ${approved_ci} == 52.00 and ${expires} == 2027-01-28T00:00:00Z"
            - "${e21} == ERR_PANEL_STATE_INVALID with HTTP 409 - submit only admits DRAFT or REVISION_REQUESTED, so an approved panel cannot be resubmitted"
            - "${b1_status} == CERTIFIED with ${delta_e} == 0.18 == abs(${b1_wci} 52.18 - 52.00), inside tolerance_delta_e 2.00"
            - "${certified_at} == 2026-08-01T00:00:00Z"
            - "${o2_flag} == false by default, and ${b2_status} == CERTIFIED with ${b2_delta} == null - certify never asks for a panel when the order did not request one"

  # =======================================================================
  # SECTION 5 - Endpoints
  # =======================================================================
  # There are no bulk endpoints in section 1.5, so the Bulk action row of the
  # extraction guide has no applicable instance in this domain.
  - section: endpoints
    instances:
      - name: formulation_create_read_and_filtered_list_are_the_whole_crud_surface
        claim_type: standard_crud
        grounds:
          - endpoints[POST /formulations]
          - endpoints[GET /formulations/{id}]
          - endpoints[GET /formulations]
        distinguishing_aspect: "This API exposes no PUT and no DELETE anywhere, so CRUD here means create, single read and filtered list only; the list endpoint must honour three independent filters plus pagination against the same three rows."
        test_recipe:
          setup:
            - "One ACTIVE plant and three DRAFT formulations: F1 and F3 target RED, F2 targets BROWN"
            - "No components are appended, so all three stay DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1_code: "$.data.formulation_code", f1_status: "$.data.status", f1_total: "$.data.component_share_total_pct", f1_ver: "$.data.version" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F2", target_color_family: "BROWN", target_cdi: 24.00, target_soak_hours: 4.0, clay_tons_per_thousand_units: 3.40 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f2: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F3", target_color_family: "RED", target_cdi: 21.00, target_soak_hours: 3.5, clay_tons_per_thousand_units: 3.30 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f3: "$.data.id" }
          trigger:
            - call: "GET /formulations/${f1}"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { r_id: "$.data.id", r_code: "$.data.formulation_code", r_cdi: "$.data.target_cdi", r_clay: "$.data.clay_tons_per_thousand_units", r_ver: "$.data.version" }
            - call: "GET /formulations"
              payload: { plant_id: "${p1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { all_first: "$.data[0].id" }
            - call: "GET /formulations"
              payload: { target_color_family: "RED" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { red_first: "$.data[0].id" }
            - call: "GET /formulations"
              payload: { status: "DRAFT", limit: 2, offset: 0 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /formulations"
              payload: { status: "DRAFT", limit: 2, offset: 2 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "${r_id} == ${f1}, ${r_code} == ${f1_code} == F1, ${r_cdi} == 20.00 and ${r_clay} == 3.20 - the single read echoes the stored row exactly"
            - "${r_ver} == ${f1_ver} == 1 and ${f1_status} == DRAFT with ${f1_total} == 0.00 at creation"
            - "GET /formulations with plant_id returns total_count == 3 with has_more false, and ${all_first} == ${f1} (created_at ASC)"
            - "GET /formulations with target_color_family RED returns total_count == 2 holding ${f1} and ${f3} but not ${f2}, and ${red_first} == ${f1}"
            - "The first DRAFT page returns 2 rows with total_count == 3 and has_more true, and ${page1_first} == ${f1}"
            - "The second page returns 1 row with has_more false and ${page2_first} == ${f3}"
            - "No PUT or DELETE route exists for /formulations/{id}: the only way to change a formulation is POST /formulations/{id}/components or POST /formulations/{id}/qualify"

      - name: plant_idle_action_endpoint_is_terminal_and_seals_the_plant_for_writes
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /plants/{id}/idle]
          - state_machines.Plant
          - validations[priority=10]
        distinguishing_aspect: "The action is exercised on a bare plant with no children, so every cascade hop is a no-op and only the endpoint's own contract is under test: the transition, the idled_at stamp, the version bump, its own terminality and the seal it puts on child creation."
        test_recipe:
          setup:
            - "A single ACTIVE plant with no clay pits, kilns, cars, runs or formulations"
            - "Logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id", v1: "$.data.version", status_0: "$.data.status", idled_0: "$.data.idled_at" }
          trigger:
            - call: "POST /plants/${p1}/idle"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { status_1: "$.data.status", idled_1: "$.data.idled_at", v2: "$.data.version" }
            - call: "POST /plants/${p1}/idle"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { e_repeat: "$.data.error_id" }
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { e_child: "$.data.error_id" }
            - call: "GET /plants/${p1}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { status_2: "$.data.status", v3: "$.data.version" }
          assert:
            - "${status_0} == ACTIVE with ${idled_0} == null"
            - "${status_1} == IDLED, ${idled_1} == 2026-08-01T00:00:00Z from the logical clock, and ${v2} == ${v1} + 1 == 2"
            - "${e_repeat} == ERR_PLANT_IDLED with HTTP 409 - IDLED is terminal, so the action is not idempotent"
            - "${e_child} == ERR_PLANT_IDLED with HTTP 409 - the seal covers child creation as well as the action itself"
            - "${status_2} == IDLED and ${v3} == ${v2} == 2 - neither rejected call bumped the version"
            - "GET /plants/${p1}/kilns returns total_count == 0"

      - name: formulation_component_link_needs_both_sides_present_and_co_located
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /formulations/{id}/components]
          - validations[priority=8]
          - validations[priority=32]
        distinguishing_aspect: "The junction is attacked from three sides in one run - a dead path id, a dead body id and a live id belonging to the wrong plant - so passing requires checking existence and co-location separately rather than a single lookup."
        test_recipe:
          setup:
            - "Plant P1 owns pit A; plant P2 owns pit Z"
            - "Formulation F1 belongs to P1 and is DRAFT with no components"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants"
              payload: { plant_code: "P2", name: "Sandhill Brick", grid_x: 200, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 40, base_capacity_green_units_per_day: 30000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p2: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p2}/clay-pits"
              payload: { pit_name: "PIT-CLAY-Z", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.000, lime_pct: 1.100 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_z: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
          trigger:
            - call: "POST /formulations/00000000-0000-4000-8000-0000000000ff/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_path: "$.data.error_id" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "00000000-0000-4000-8000-0000000000fe", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_body: "$.data.error_id" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_z}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_plant: "$.data.error_id" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { total_1: "$.data.component_share_total_pct", f1v2: "$.data.version" }
            - call: "GET /formulations/${f1}"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { comps: "$.data.components", total_2: "$.data.component_share_total_pct" }
          assert:
            - "${e_path} == ERR_FORMULATION_NOT_FOUND with HTTP 404 - the path id is resolved before the body"
            - "${e_body} == ERR_CLAY_PIT_NOT_FOUND with HTTP 404 - priority 8 covers body foreign keys"
            - "${e_plant} == ERR_PIT_PLANT_MISMATCH with HTTP 422 - pit Z exists but belongs to ${p2}, not ${p1}"
            - "The successful append returns HTTP 200 with ${total_1} == 50.00 and ${f1v2} == ${f1v1} + 1 == 2"
            - "${comps} holds exactly one entry naming ${pit_a} with share_pct 50.00, and ${total_2} == 50.00"
            - "All three rejected attempts left component_share_total_pct at 0.00 and the version at 1"

      - name: order_read_after_assignment_returns_the_full_derived_freight_and_lead_time_block
        claim_type: computed_read
        grounds:
          - endpoints[GET /orders/{id}]
          - calculations.order_freight_cost
          - calculations.order_lead_time
          - calculations.plant_assignment_selector
        distinguishing_aspect: "A plain read is compared field by field against three independent calculations that ran during assignment, which catches an implementation that computes the numbers on the fly at read time or drops the rounded intermediates."
        test_recipe:
          setup:
            - "Plant P1 at (0,0) with freight_rate_cents_per_ton_mile 42, market_radius_miles 300 and a QUALIFIED SW/RED formulation"
            - "Order O1 for 12000 units to a jobsite at (30,30): rectilinear distance 60 miles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["TRUCK_MOUNTED_FORKLIFT"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /orders"
              payload: { order_code: "O1", jobsite_grid_x: 30, jobsite_grid_y: 30, requested_units: 12000, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { o1: "$.data.id", freight_status_0: "$.data.freight_status", dist_0: "$.data.distance_miles" }
            - call: "POST /orders/${o1}/assign-plant"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { assigned_plant: "$.data.plant_id" }
          trigger:
            - call: "GET /orders/${o1}"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { dist: "$.data.distance_miles", tons: "$.data.estimated_billable_tons", base: "$.data.estimated_base_freight_cents", sur: "$.data.estimated_fuel_surcharge_cents", tot: "$.data.estimated_freight_cents", lead: "$.data.lead_time_days", promised: "$.data.promised_ship_date", fstatus: "$.data.freight_status", ustatus: "$.data.fulfillment_status", final_tot: "$.data.final_freight_cents" }
          assert:
            - "${freight_status_0} == UNQUOTED and ${dist_0} == null before assignment - nothing is derived at creation"
            - "${assigned_plant} == ${p1} and ${dist} == 60 == abs(30 - 0) + abs(30 - 0)"
            - "${tons} == 27.00 == round(12000 * 4.5 / 2000, 2)"
            - "${base} == 68040 == round_half_up(60 * 42 * 27.00)"
            - "${sur} == 3062 == round_half_up(68040 * 4.5 / 100) - base 68040 lands in tier 2 (50000 <= base < 150000)"
            - "${tot} == 71102 == 68040 + 3062"
            - "${lead} == 15 == 14 + ceil(12000 / 40000) with neither the special-order nor the panel surcharge"
            - "${promised} == 2026-08-16T00:00:00Z == 2026-08-01 plus 15 whole days"
            - "${fstatus} == ESTIMATED, ${ustatus} == ASSIGNED and ${final_tot} == null - only the ESTIMATED variant has run"

      - name: qualify_is_allowed_only_when_the_component_shares_total_exactly_one_hundred
        claim_type: conditional_action
        grounds:
          - endpoints[POST /formulations/{id}/qualify]
          - validations[priority=35]
        distinguishing_aspect: "One rule guards two different endpoints with two different comparisons - append may not push the running total above 100.00, while qualify demands exact equality - and the same duplicate-pit clause applies to both."
        test_recipe:
          setup:
            - "Plant P1 with three pits: CLAY A, SHALE B and CLAY C"
            - "Formulation F1 DRAFT with A at 50.00 and B at 40.00, so the running total is 90.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
