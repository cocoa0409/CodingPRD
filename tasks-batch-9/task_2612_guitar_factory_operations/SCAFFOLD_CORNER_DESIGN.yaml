            scrap_http_status: 200
            cmp1_status_after_scrap: "SCRAPPED"
            cmp1_qc_hold_reason_after_scrap: "NONE"
            blt1_status_after_scrap: "QUARANTINED"
            lot1_board_feet_scrapped_after_scrap: 99.10
