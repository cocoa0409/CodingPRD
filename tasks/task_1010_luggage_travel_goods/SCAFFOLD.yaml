# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for operation, or Customer acting on another customer's resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or body foreign key does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_PRODUCT_RECALLED
    http: 409
    condition: "operation blocked because referenced Product.status == RECALLED"
  - id: ERR_REGISTRATION_NOT_ACTIVE
    http: 409
    condition: "warranty claim action on a registration not in ACTIVE status"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "warranty claim review after warranty_expiry"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "trade-in accept after expires_at"
  - id: ERR_NO_REPAIR_LINES
    http: 422
    condition: "quote requested on a repair order with zero repair lines"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "bench or monogram-station window overlaps an existing occupation per the resource's interval semantics"
  - id: ERR_DUPLICATE
    http: 409
    condition: "unique constraint violated (customer email, product sku, registration serial per product)"
  - id: ERR_ORDER_NOT_CAPTURED
    http: 409
    condition: "start-monogram before parent SalesOrder.payment_status == CAPTURED"
  - id: ERR_MONOGRAM_PENDING
    http: 409
    condition: "fulfill while a monogrammed line is not DONE"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_*_version does not equal the parent's current version"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad enum, or out-of-range value"
  - id: ERR_OPEN_SPECIAL_ORDER
    http: 409
    condition: "discontinue attempted while an OPEN special order references the product"
  - id: ERR_CLAIM_OPEN_ON_REGISTRATION
    http: 409
    condition: "void a registration while a claim is in UNDER_REVIEW or NEEDS_INFO"
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "numeric range violated (qty < 1, negative cents, discount outside 0..1)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Self-service loyalty account holder; acts only on own resources"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "approve own RepairOrder quote"
      - "decline own RepairOrder quote"
    shared_operations:
      - "create own WarrantyRegistration / WarrantyClaim / RepairOrder / SalesOrder / SalesOrderLine / SpecialOrder"
      - "decline own TradeIn"
      - "read own resources; read products, airlines, recall notices"
  - name: Associate
    description: "Store staff; day-to-day operations"
    identity: "opaque"
    exclusive_operations:
      - "quote/schedule/start/parts-hold/resume/ready/close repairs"
      - "review/request-info/resubmit warranty claims"
      - "capture/fulfill/cancel sales orders"
      - "schedule/start/complete monograms"
      - "source/arrive/fulfill/cancel special orders"
      - "create trade-in offers"
    shared_operations:
      - "create products, airlines, customers, registrations, claims, repair orders, sales orders, lines, special orders"
  - name: Manager
    description: "Supervisor; superset of Associate plus fiscal/compliance exclusives"
    identity: "opaque"
    exclusive_operations:
      - "publish/close recall notices; discontinue products"
      - "resolve warranty claims; void registrations"
      - "accept/void trade-ins; refund sales orders"
      - "set logical clock"
    shared_operations:
      - "all Associate operations (hierarchical override)"
