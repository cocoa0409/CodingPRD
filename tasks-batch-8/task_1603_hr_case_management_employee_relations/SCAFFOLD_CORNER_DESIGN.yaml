            - call: "POST /er/findings/${f1}/submit-for-calibration"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv2}"
            - call: "POST /er/findings/${f1}/approve"
              payload: {}
              as: Investigator
              as_user_id: "${inv3}"
            - call: "POST /er/cases/${c1}/closure-notices"
              payload: { recipient_employee_id: "${sub}", recipient_role: "SUBJECT", confidentiality_tier: "TIER_2_LIMITED", body_text: "The safety investigation concerning you has concluded." }
              as: ERManager
              captures: { n1s: $.data.id }
            - call: "POST /er/closure-notices/${n1s}/send"
              payload: {}
              as: ERManager
            - call: "GET /er/cases/${c1}"
              as: LegalCounsel
              captures: { c1_v2: $.data.version }
          trigger:
            - call: "POST /er/cases/${c1}/close"
              payload: { expected_case_version: "${c1_v2}" }
              as: LegalCounsel
              captures: { err_id: $.data.error_id }
          assert:
            - "LegalCounsel could read the case (GET succeeded)"
            - "close attempt: error_id == ERR_UNAUTHORIZED (403) — authorization precedes the OCC check"
            - "Case.${c1}.status remains PENDING_CLOSURE"

      - name: segregation_of_duties_author_cannot_be_second_vote
        claim_type: segregation_of_duties
        grounds:
          - roles
          - validations[priority=8]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_sod_vs_documentation_priority
          rationale: "The author-approval rejection (ERR_SEGREGATION_OF_DUTIES) is asserted as the primary observable of the named §1.8 instance."

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_assign_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[case-assign-stale-version]
          - errors[ERR_STALE_VERSION]
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: "Assigning with expected_case_version one behind current (case version bumped by a prior successful assign+unassign round trip) returns 412 ERR_STALE_VERSION; the assign is not applied."
        test_recipe:
          setup:
            - "A TRIAGE case C (version V0 captured at creation). INV1 and INV2 exist with capacity."
            - "C is assigned to INV1 (version advances to V0+1) then unassigned (version advances to V0+2); the client still holds V0."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hot OCC", default_category: "HARASSMENT", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "R-9850", full_name: "Rep OCC", email: "r9850@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { rep: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9850", full_name: "Sub OCC", email: "s9850@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9850", full_name: "Inv OCC1", email: "i9850@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9851", full_name: "Inv OCC2", email: "i9851@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei2: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei2}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv2: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id, c1_v0: $.data.version }
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v0}" }
              as: ERManager
            - call: "GET /er/cases/${c1}"
              as: ERManager
              captures: { c1_v1: $.data.version }
            - call: "POST /er/cases/${c1}/unassign"
              payload: { expected_case_version: "${c1_v1}" }
              as: ERManager
          trigger:
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv2}", expected_case_version: "${c1_v0}" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (case version is ${c1_v0} + 2 after the assign/unassign round trip)"
            - "http status == 412"
            - "Case.${c1}.status remains TRIAGE with assigned_investigator_id == null"

      - name: occ_correct_version_succeeds_and_increments
        claim_type: occ_happy_path
        grounds:
          - concurrency_rules[case-assign-stale-version]
          - concurrency_rules[case-assign-stale-version]
        distinguishing_aspect: "Assigning with the case's CURRENT version succeeds and the response carries version incremented by exactly 1 relative to the pre-call value."
        test_recipe:
          setup:
            - "A TRIAGE case; INV1 with capacity; the client has just re-read the case version."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "HOTLINE", display_name: "Hot OCC2", default_category: "HARASSMENT", default_severity: "LOW", sla_business_days: 10 }
              as: ERManager
              captures: { ch1: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "S-9860", full_name: "Sub OCC2", email: "s9860@example.com", location_code: "SF", department: "Ops", hire_date: "2019-01-01T00:00:00Z" }
              as: ERManager
              captures: { sub: $.data.id }
            - call: "POST /er/employees"
              payload: { employee_number: "I-9860", full_name: "Inv OCC2a", email: "i9860@example.com", location_code: "HQ", department: "ER", hire_date: "2018-01-01T00:00:00Z" }
              as: ERManager
              captures: { ei1: $.data.id }
            - call: "POST /er/investigators"
              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 10 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", subject_employee_id: "${sub}", category: "HARASSMENT", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id, c1_v0: $.data.version }
          trigger:
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v0}" }
              as: ERManager
              captures: { c1_after: $.data.version, c1_status: $.data.status }
          assert:
            - "Case.${c1}.status == ASSIGNED"
            - "response version == ${c1_v0} + 1 (increments by exactly one per mutation)"

      - name: cascading_hold_then_resume_restores_investigating
        claim_type: cascade_layer
        grounds:
          - state_machines.Case.ON_HOLD_to_INVESTIGATING
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / hold_cascades_to_interviews_then_interviewer_recompute
          rationale: "The hold cascade (Case -> Interview CANCELLED -> interviewer recomputation) is the primary observable of the named §1.8 instance; resume semantics ride along in its setup chain."

      - name: dual_variant_layer_asserted
        claim_type: dual_variant_layer
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / credibility_variants_diverge_on_same_inputs
          rationale: "Variant divergence, selection, and the active_variant default are asserted by both §1.8 dual_variant_calc instances."

      - name: rate_threshold_layer_trend_stale_on_close
        claim_type: rate_threshold_layer
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - entities.TrendSnapshot.fields.is_stale
        excluded_because:
          difficulty_instance: transitive_cascade / close_cascades_investigator_count_then_trend_stale
          rationale: "The closure-triggered is_stale flip (threshold-trigger freshness mechanism) is asserted by the named §1.8 instance."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_close_response_reflects_all_side_effects
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Case.PENDING_CLOSURE_to_CLOSED
        distinguishing_aspect: "Under the immediate consistency model, the close response itself shows status == CLOSED with closed_at and days_to_close stamped; a follow-up GET of the investigator shows active_case_count already decremented — no asynchronous lag."
        test_recipe:
          setup:
            - "A case in PENDING_CLOSURE with all closure gates satisfied (anonymous intake: subject notice SENT); INV1 active_case_count == 1."
          setup_api_calls:
            - call: "POST /er/intake-channels"
              payload: { channel_code: "ANONYMOUS_LETTER", display_name: "Anon IMM", default_category: "SAFETY", default_severity: "MEDIUM", sla_business_days: 10 }
              as: ERManager
