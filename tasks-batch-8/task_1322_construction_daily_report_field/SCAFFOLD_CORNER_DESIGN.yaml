            - "QE2.status == ACTIVE with rounded_quantity == 12.0"

      - name: fk_reverse_reachability_lists
        claim_type: cross_reference
        grounds: [entities.CrewEntry.fields.report_id, entities.CrewEntry.fields.work_area_id]
