  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: floater_term_temporal_beats_jobsite_overlap_constraint
        grounds:
          - validations[priority=55]
          - validations[priority=63]
          - errors[ERR_FLOATER_OUTSIDE_POLICY_TERM]
          - errors[ERR_JOBSITE_FLOATER_OVERLAP]
          - endpoints.POST /inland-marine/coverage-parts/{id}/installation-floaters
        distinguishing_aspect: |
          One create call violates priority 55 (business_temporal:
          ERR_FLOATER_OUTSIDE_POLICY_TERM, coverage_end_date 2027-09-30 past the
          2027-08-01 expiration) AND priority 63 (business_constraint:
          ERR_JOBSITE_FLOATER_OVERLAP, 2026-11-01..2026-12-01 intersects the
          standing floater) and must return the temporal error, not the
          constraint error - a business_temporal / business_constraint pair.
        test_recipe:
          setup:
            - "One SURVEYED Jobsite J1 in T2_URBAN (fenced, lighting, alarm_monitored true, guarded_24h false: security_tier TIER_2)."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE INSTALLATION_FLOATER CoveragePart on it: valuation_basis ACV, aggregate_limit_cents 200000000."
            - "One PENDING InstallationFloater F1 on J1 covering 2026-09-01..2026-12-01, installed_value_limit_cents 20000000; Jobsite.active_floater_count 1."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/jobsites"
              payload: { name: "J1 tower site", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js1: $.data.id }
            - call: "POST /inland-marine/jobsites/${js1}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: false }
              as: Underwriter
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Installers", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "INSTALLATION_FLOATER", valuation_basis: "ACV", aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp_fl: $.data.id }
            - call: "POST /inland-marine/coverage-parts/${cp_fl}/installation-floaters"
              payload: { jobsite_id: "${js1}", project_name: "Tower A fit-out", installed_value_limit_cents: 20000000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-12-01" }
              as: Underwriter
              captures: { flt_1: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp_fl}/installation-floaters"
              payload: { jobsite_id: "${js1}", project_name: "Tower B fit-out", installed_value_limit_cents: 15000000, coverage_start_date: "2026-11-01", coverage_end_date: "2027-09-30" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_FLOATER_OUTSIDE_POLICY_TERM"
            - "trigger[0] response error_id != ERR_JOBSITE_FLOATER_OVERLAP"
            - "Jobsite.${js1}.active_floater_count == 1 (unchanged)"
            - "InstallationFloater.${flt_1}.status == PENDING"
            - "GET /inland-marine/installation-floaters with jobsite_id == ${js1} returns exactly 1 row"
            - "Policy.${pol}.status == DRAFT and Policy.${pol}.written_premium_cents == 0"

      - name: jobsite_safety_beats_floater_aggregate_fiscal
        grounds:
