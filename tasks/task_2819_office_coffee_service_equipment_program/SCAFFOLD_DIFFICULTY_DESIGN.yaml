  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: visit_void_restores_the_par_unit_ledger_and_route_minutes_without_drift
        grounds:
          - state_machines.ServiceVisit.COMPLETED_to_VOIDED
          - entities.ParLevel.fields.on_hand_units
          - entities.ParLevel.fields.cumulative_delivered_units
          - entities.ParLevel.fields.cumulative_consumed_units
          - entities.Route.fields.booked_minutes_total
          - endpoints[POST /ocs/service-visits/{visit_id}/void]
        distinguishing_aspect: |
          Conserved quantity: the ParLevel UNIT ledger, on_hand_units ==
          cumulative_delivered_units - cumulative_consumed_units, together with
          Route.booked_minutes_total. Voiding a COMPLETED visit must unwind BOTH its delivery credit
          and its modeled consumption debit AND rewind ParLevel.last_service_at, so replaying the
          identical visit afterwards reproduces byte-identical numbers - a void that forgets the
          consumption side or the last_service_at rewind leaves observable drift.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route with capacity 480; catalog holds exactly one COFFEE product"
            - "one account, one planned site; its single FORECAST ParLevel row was PATCHed to par_units 28 and reorder_point_units 10, so the modeled draw is 2 units per day"
            - "visit 1 on 2026-08-03 09:00-09:45 requested 28 and delivered 20 with elapsed_days 0, leaving on_hand_units 20 / cumulative_delivered 20 / cumulative_consumed 0 and last_service_at 2026-08-03T09:00:00Z"
            - "visit 2 on 2026-08-10 09:00-09:45 requested 28 and delivered 8 with elapsed_days 7, consuming min(20, floor(2*7)) == 14 and leaving on_hand_units 14 / cumulative_delivered 28 / cumulative_consumed 14; Route.booked_minutes_total is 90"
            - "no invoice exists for the account, so the void precondition is satisfied"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "GET /ocs/par-levels"
              payload: { site_id: "${site_id}", product_id: "${p_cof_id}" }
              as: AccountManager
              captures: { par_id: "$.data[0].id" }
            - call: "PATCH /ocs/par-levels/${par_id}"
              payload: { par_units: 28, reorder_point_units: 10 }
              as: AccountManager
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_1_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_1_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 28 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${visit_1_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_2_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_2_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 28 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${visit_2_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 8 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
          trigger:
            - call: "POST /ocs/service-visits/${visit_2_id}/void"
              payload: { void_reason: "Technician logged the wrong site" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_3_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_3_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 28 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_3_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 8 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
          assert:
            - "the void is HTTP 200 with visit_status VOIDED and void_reason stamped"
            - "immediately after the void the ParLevel row reads cumulative_delivered_units == 20, cumulative_consumed_units == 0, on_hand_units == 20 and stock_status == IN_STOCK - the delivery credit AND the 14-unit consumption debit are both reversed"
            - "the invariant on_hand_units == cumulative_delivered_units - cumulative_consumed_units holds exactly (20 == 20 - 0) with no drift"
            - "ParLevel.${par_id}.last_service_at reverts to 2026-08-03T09:00:00Z, the window_start of the only remaining COMPLETED visit"
            - "Route.${route_id}.booked_minutes_total == 45 after the void (90 minus the voided visit's 45)"
            - "the replayed visit 3, identical to the voided visit 2 and completed at the same clock 2026-08-10T09:30:00Z, again consumes exactly 14 units and ends at on_hand_units == 14, cumulative_delivered_units == 28, cumulative_consumed_units == 14 - proving the rewind was complete"
            - "Route.${route_id}.booked_minutes_total == 90 again, and the VOIDED visit 2 never blocked the identical 09:00-09:45 window under route_window_conflict"

      - name: credit_line_restores_account_receivable_after_an_unreturned_asset_writeoff
        grounds:
          - state_machines.ConsolidatedInvoice.ISSUED_to_FULLY_CREDITED
          - entities.Account.fields.receivable_balance_cents
          - calculations.unreturned_asset_charge
          - state_machines.EquipmentPlacement.RETRIEVAL_SCHEDULED_to_UNRETURNED_BILLED
          - endpoints[POST /ocs/consolidated-invoices/{invoice_id}/credit]
        distinguishing_aspect: |
          A different conserved quantity: the MONEY ledger Account.receivable_balance_cents, not the
          ParLevel unit ledger. An unreturned brewer is written off for 118200 + 7500 == 125700
          cents, issuing adds it to the receivable, physical retrieval afterwards deliberately does
          NOT auto-credit it, and only an explicit full CREDIT line brings the receivable back to 0
          while the invoice becomes FULLY_CREDITED with total_cents 0 - the credit is the
          compensating action, retrieval is not.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; model URN-30 with list_value_cents 120000; asset URN30-0001; one CONSOLIDATED account with receivable_balance_cents 0"
            - "one planned site with a LOAN placement (minimum_purchase_cents 100000) placed at 2026-08-03T08:00:00Z; evaluate-compliance is never called, so no SHORTFALL line can be emitted"
            - "the account was cancelled at 2026-08-03T09:00:00Z with retrieval_due_by 2026-08-31T00:00:00Z, moving the placement to RETRIEVAL_SCHEDULED and the site to SUSPENDED"
            - "the clock then stands at 2026-09-05T12:00:00Z, which is 33 days after placement and past retrieval_due_by, so months_in_service == floor(33/30) == 1 and depreciated_bps == 10000 - 150 == 9850"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "LOAN", minimum_purchase_cents: 100000, min_term_months: 12, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { pl_id: "$.data.id" }
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/accounts/${acct_id}/cancel"
              payload: { cancel_reason: "Tenant vacated the building", retrieval_due_by: "2026-08-31T00:00:00Z" }
              as: AccountManager
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: ProgramAdmin
            - call: "GET /ocs/accounts/${acct_id}"
              payload: {}
              as: BillingSpecialist
              captures: { acct_v: "$.data.version" }
          trigger:
            - call: "POST /ocs/consolidated-invoices"
              payload: { account_id: "${acct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", expected_account_version: "${acct_v}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data.id" }
            - call: "POST /ocs/consolidated-invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "GET /ocs/invoice-lines"
              payload: { invoice_id: "${inv_id}", line_type: "UNRETURNED_ASSET" }
              as: BillingSpecialist
              captures: { writeoff_line_id: "$.data[0].id" }
            - call: "POST /ocs/equipment-placements/${pl_id}/retrieve"
              payload: { retrieved_asset_condition: "SERVICEABLE" }
              as: AccountManager
            - call: "POST /ocs/consolidated-invoices/${inv_id}/credit"
              payload: { target_line_id: "${writeoff_line_id}", amount_cents: 125700, credit_reason: "Brewer recovered intact after the write-off" }
              as: BillingSpecialist
              captures: { credit_line_id: "$.data.id" }
          assert:
            - "the draft carries exactly one UNRETURNED_ASSET line of 125700 cents (round_half_up(120000 * 9850 / 10000) == 118200 plus the 7500 retrieval trip fee), pre_freight_total_cents == 125700, allied_discount_cents == 0, freight_cents == 0 (125700 >= 50000), total_cents == 125700 and line_count == 1"
            - "the draft assembly moved EquipmentPlacement.${pl_id} to placement_status UNRETURNED_BILLED with unreturned_billed_cents == 125700 and EquipmentAsset.${asset_id}.asset_status == UNRETURNED"
            - "immediately after issue, Account.${acct_id}.receivable_balance_cents == 125700 and invoice_status == ISSUED"
            - "after POST /ocs/equipment-placements/${pl_id}/retrieve the placement is RETRIEVED, the asset is RECONDITIONING, Account.${acct_id}.program_posture == CLOSED and Site.${site_id}.service_posture == CLOSED, yet Account.${acct_id}.receivable_balance_cents is STILL 125700 - retrieval never auto-credits"
            - "the credit call is HTTP 201 and appends a CREDIT InvoiceLine with amount_cents == -125700 and target_line_id == ${writeoff_line_id}"
            - "ConsolidatedInvoice.${inv_id}.invoice_status == FULLY_CREDITED with total_cents == 0 and line_count == 2, and InvoiceLine.${writeoff_line_id}.credits_applied_cents == 125700"
            - "Account.${acct_id}.receivable_balance_cents == 0 - the money ledger is conserved end to end (0 -> +125700 -> 0) with no residue"
