            - "the 900-cent payment for ${ms1_id} returns 422 with data.error_id == 'ERR_DUES_AMOUNT_MISMATCH' - with the membership gate cleared and no prior week-1 payment, priority 47 is the first rule violated"
            - "the 1200-cent payment returns 201 with data.week_number == 1, data.amount_cents == 1200, data.prize_share_cents == 700 == 1200 - 500 and data.expense_share_cents == 500, and the response body carries no version field"
