              payload: { full_name: "Dana Ruiz", badge_number: "INS-3014", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-70160", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { sal_title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${sal_title_id}", declared_repair_cost_cents: 800000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "RECEIPT", part_class: "STRUCTURAL", source_type: "NEW", amount_cents: 200000, vendor_name: "Basin Frame Supply", part_serial_number: "SF-8801" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc_struct_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
