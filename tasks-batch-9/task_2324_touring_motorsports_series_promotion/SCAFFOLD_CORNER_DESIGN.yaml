      - name: corner_endpoint_logistics_patch_is_partial_and_show_timing_is_bounded
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/tour-stops/{id}/logistics
          - validations[order=35]
          - errors.ERR_SHOW_TIMING_INVALID
        distinguishing_aspect: "The only update surface on a TourStop is a PATCH whose every field is optional, so a request that carries just pit_party_price_cents must leave the previously set timing intact. The timing rule is a conjunction of three conditions, each independently fatal: doors before show, at least one whole hour between them (exactly one hour is legal), and show_start inside the booking's occupancy interval."
