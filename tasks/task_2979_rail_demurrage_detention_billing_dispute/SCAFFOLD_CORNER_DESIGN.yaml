            - "limit=101: 400 with error_id ERR_INVALID_PAGINATION"
            - "limit=100: 200 with an empty data array, meta.total_count 0 and meta.has_more FALSE — 100 is the inclusive upper bound"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: placement_cycle_starts_ordered_and_unbilled_on_both_axes
        claim_type: initial_state
        grounds:
          - state_machines.PlacementCycle.movement_status
          - state_machines.PlacementCycle.billing_status
        distinguishing_aspect: |
          The entity carries TWO independent machines, so a fresh cycle must
          report movement_status ORDERED and billing_status UNBILLED
          simultaneously; an implementation that models one status column
          cannot satisfy both.
        test_recipe:
          setup:
            - "one customer, one INDUSTRY_TRACK facility, one PUBLISHED ANY-scope tariff, one RAILROAD_OWNED car"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9S1-CUST", name: "Initial State Iron", serving_station_code: "STN40", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9S1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9S1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9S1-IRX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
          trigger:
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9S1-1", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
          assert:
            - "201 with movement_status ORDERED and billing_status UNBILLED"
            - "every placement instant is null: constructive_placement_at, notification_sent_at, actual_placement_at, released_at, clock_start_at, free_time_expires_at"
            - "clock_basis NONE, free_days 0, chargeable_days 0, early_release_days 0, refusal_count 0"
            - "no DemurrageCharge exists yet: GET /demurrage/charges?placement_cycle_id=${cyc_id} returns meta.total_count 0"
            - "RailCar.${car_id}.active_cycle_count is 1 and its version advanced past ${car_v}"

      - name: valid_transition_ordered_to_constructively_placed_creates_a_provisional_charge
        claim_type: valid_transition
        grounds:
          - state_machines.PlacementCycle.movement_status.ORDERED_to_CONSTRUCTIVELY_PLACED
          - calculations.demurrage_clock_basis_resolution
        distinguishing_aspect: |
          The transition succeeds and spawns a PROVISIONAL charge, yet
          clock_basis must stay NONE: no notification has landed, so the
          constructive clock has not started even though the constructive
          instant is recorded.
        test_recipe:
          setup:
            - "the C9S1 chain: one ORDERED cycle on an INDUSTRY_TRACK facility with a RAILROAD_OWNED car"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9S2-CUST", name: "Valid Transition Talc", serving_station_code: "STN41", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9S2-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9S2-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9S2-TCX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9S2-1", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_id}&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
              captures: { chg_id: "$.data[0].id" }
          assert:
            - "200 with movement_status CONSTRUCTIVELY_PLACED and billing_status still UNBILLED"
            - "constructive_placement_at 2026-08-03T08:00:00.000Z and constructive_reason_code TRACK_FULL"
            - "clock_basis NONE, clock_start_at null and free_time_expires_at null: the constructive clock waits for a notification"
            - "exactly one charge now exists with charge_kind DEMURRAGE, status PROVISIONAL, chargeable_days 0, gross_amount_cents 0, credit_applied_cents 0, net_amount_cents 0"
            - "that charge has invoice_id null and computation_basis null"

      - name: notify_side_effect_stamps_sequence_number_and_delivery_status_failed_on_channel_mismatch
        claim_type: side_effect_execution
        grounds:
          - state_machines.PlacementCycle.movement_status.CONSTRUCTIVELY_PLACED_to_CONSTRUCTIVELY_PLACED
          - entities.CarNotification
        distinguishing_aspect: |
          The self-loop's side effect is three-valued: channel EMAIL against an
          EDI customer is FAILED, and a FAILED notice must NOT start the clock,
          so the second notice on channel EDI is what sets
          notification_sent_at while taking sequence_number 2.
        test_recipe:
          setup:
            - "a CONSTRUCTIVELY_PLACED cycle at 2026-08-03T08:00:00Z for an EDI customer"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
