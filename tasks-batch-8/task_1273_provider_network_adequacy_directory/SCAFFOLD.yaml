    code: 200
    input: [to_iso8601]
    output: { current_utc: string, effectuated_provider_ids: array }
    side_effects: ["provider effectuation sweep: PENDING_LOAD -> EFFECTIVE where contract_effective_date <= new clock date; each effectuated provider version += 1"]

