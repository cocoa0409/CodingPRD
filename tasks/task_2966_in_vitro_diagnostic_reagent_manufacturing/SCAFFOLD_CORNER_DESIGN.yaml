        distinguishing_aspect: "Calendar-month addition is not 30-day addition and it is not day-of-month-preserving either: 2026-08-31 plus six months has no 31st to land on, so it must clamp to 2027-02-28 while keeping the 10:30 wall time and the three-digit millisecond width. A lot completed three days earlier, on 2026-08-28, lands on the very same expiry date — which a naive day-count implementation can never reproduce."
