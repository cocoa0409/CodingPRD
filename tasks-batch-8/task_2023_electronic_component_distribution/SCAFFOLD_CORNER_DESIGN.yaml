              captures: { err_oq: $.data.error_id }
          assert:
            - "OrderLine.${l_oq}.allocated_qty == 5 after publish (shortage: supply 5 < demand 10)"
            - "${err_oq} == ERR_QUANTITY_EXCEEDS_AVAILABLE (6 > 5 allocated remainder)"
            - "OrderLine.${l_oq}.shipped_qty == 0 and .allocated_qty == 5 (unchanged)"

      - name: publish_after_supply_drop_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUANTITY_EXCEEDS_AVAILABLE]", state_machines.AllocationRun.PROVISIONAL_to_PUBLISHED]
        distinguishing_aspect: "Publish revalidates supply at publish time: a run computed against 100 units fails once a quarantine has taken supply to 0."
        test_recipe:
          setup: ["Part floor_life_hours 100; lot 100 AVAILABLE; ACKNOWLEDGED line qty 60; PROVISIONAL run computed (supply 100); exposure opened; clock advanced 100h so the lot is QUARANTINED"]
          setup_api_calls:
