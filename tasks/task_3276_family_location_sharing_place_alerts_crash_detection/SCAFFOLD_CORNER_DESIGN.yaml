# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3276_family_location_sharing_place_alerts_crash_detection
#
# Breadth probe over §1.1–§1.7 claims NOT covered by §1.8. Corners that §1.8
# already covers appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: circle_create_returns_all_declared_fields_and_initializes_posture
        claim_type: Creation
        grounds:
          - entities.Circle
          - endpoints.POST_/api/circles
        distinguishing_aspect: "Creating a circle returns 201 with subscription_status=TRIALING, circle_posture=OPEN, version=1, tier-derived balances initialized (PROTECT: assistance_units_balance=4, identity_protection_credits=1, history_retention_days=60), and the auto-created OWNER member populated in owner_member_id."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &clock_set
              call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: System
          trigger:
            - call: "POST /api/circles"
              payload: { name: "InitFam", subscription_tier: "PROTECT", billing_anchor_day: 15, owner_display_name: "Ivy", owner_birthdate: "1981-11-11T00:00:00Z", owner_email: "ivy@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
          assert:
            - "HTTP 201, response_type == object"
            - "Circle.${cid}.subscription_status == TRIALING"
            - "Circle.${cid}.circle_posture == OPEN"
            - "Circle.${cid}.version == 1"
            - "Circle.${cid}.assistance_units_balance == 4"
            - "Circle.${cid}.identity_protection_credits == 1"
            - "Circle.${cid}.history_retention_days == 60"
            - "Circle.${cid}.owner_member_id == ${oid}"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: member_invite_defaults_to_pending_consent_and_minor_role_for_under16
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints.POST_/api/circles/{circle_id}/members
        distinguishing_aspect: "An invited member lands with consent_state=PENDING, role derived from computed age (<16 -> MINOR else MEMBER), privacy_mode default PRECISE, sampling_profile default BALANCED, tension_flag false."
        test_recipe:
          setup: ["Circle exists; owner acts."]
          setup_api_calls:
            - *clock_set
            - &circle_create
              call: "POST /api/circles"
              payload: { name: "InviteFam", subscription_tier: "FREE", billing_anchor_day: 1, owner_display_name: "O", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "o@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
          trigger:
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Young", birthdate: "2014-06-06T00:00:00Z", email: "young@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { kid: $.data.id }
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Old", birthdate: "2000-06-06T00:00:00Z", email: "old@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { adult: $.data.id }
          assert:
            - "Member.${kid}.role == MINOR"
            - "Member.${kid}.consent_state == PENDING"
            - "Member.${kid}.privacy_mode == PRECISE"
            - "Member.${kid}.sampling_profile == BALANCED"
            - "Member.${kid}.tension_flag == false"
            - "Member.${adult}.role == MEMBER"
            - "Member.${adult}.consent_state == PENDING"

      - name: location_fix_missing_required_field_returns_invalid_request
        claim_type: RequiredFields
        grounds:
          - entities.LocationFix
          - endpoints.POST_/api/circles/{circle_id}/members/{member_id}/fixes
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting motion_context (no default) returns 400 ERR_INVALID_REQUEST — server never guesses a motion class."
        test_recipe:
          setup: ["Circle with GRANTED adult owner."]
          setup_api_calls:
            - *clock_set
            - *circle_create
          trigger:
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T00:00:30Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 0.0, battery_pct: 90, phone_in_use: false }
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: place_dwell_bucket_default_180_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Place.fields.dwell_bucket_seconds
          - endpoints.POST_/api/circles/{circle_id}/places
        distinguishing_aspect: "If the client omits dwell_bucket_seconds the server applies the documented default 180."
        test_recipe:
          setup: ["Circle exists."]
          setup_api_calls:
            - *clock_set
            - *circle_create
          trigger:
            - call: "POST /api/circles/${cid}/places"
              payload: { label: "Work", center_lat: 37.8, center_lng: -122.5, radius_m: 200, accuracy_floor_m: 50, notify_on_arrive: true, notify_on_depart: false }
              as: Owner
              as_user_id: "${oid}"
              captures: { pid: $.data.id }
          assert:
            - "Place.${pid}.dwell_bucket_seconds == 180"
            - "Place.${pid}.place_status == ACTIVE"

      - name: member_age_years_computed_ignores_client_supplied_value
        claim_type: ComputedFields
        grounds:
          - entities.Member.fields.age_years
          - endpoints.POST_/api/circles/{circle_id}/members
        distinguishing_aspect: "age_years is derived from birthdate + logical clock; a client-supplied age_years in the payload is rejected as an unknown field, not silently accepted."
        test_recipe:
          setup: ["Circle exists."]
          setup_api_calls:
            - *clock_set
            - *circle_create
          trigger:
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Forged", birthdate: "2010-01-01T00:00:00Z", email: "forged@example.com", age_years: 99 }
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: circle_not_found_returns_404
        claim_type: NotFound
        grounds:
          - errors.ERR_NOT_FOUND
          - endpoints.GET_/api/circles/{circle_id}
        distinguishing_aspect: "Reading a non-existent circle id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "GET /api/circles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: System
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: circle_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/circles
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Listing with limit=2 over 3 circles returns 2 rows with total_count=3 and has_more=true; offset=2 returns the remaining row with has_more=false."
        test_recipe:
          setup: ["Three circles created."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles"
              payload: { name: "Second", subscription_tier: "FREE", billing_anchor_day: 2, owner_display_name: "S", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "s@example.com" }
              as: Owner
            - call: "POST /api/circles"
              payload: { name: "Third", subscription_tier: "PLUS", billing_anchor_day: 3, owner_display_name: "T", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "t@example.com" }
              as: Owner
          trigger:
            - call: "GET /api/circles"
              payload: { limit: 2, offset: 0 }
              as: System
            - call: "GET /api/circles"
              payload: { limit: 2, offset: 2 }
              as: System
          assert:
            - "page 0 returns 2 rows, total_count == 3, has_more == true"
            - "page 1 returns 1 row, total_count == 3, has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: member_promote_minor_rejected
        claim_type: PreconditionEnforcement
        grounds:
          - state_machines.Member MINOR_to_MEMBER (auto only)
          - errors.ERR_ROLE_INCOMPATIBLE
          - endpoints.POST_/api/circles/{circle_id}/members/{member_id}/promote
        distinguishing_aspect: "Promoting a MINOR to ADMIN is rejected with ERR_ROLE_INCOMPATIBLE; MINOR->MEMBER happens only via the age sweep."
        test_recipe:
          setup: ["Circle with one MINOR member (consent granted)."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Y", birthdate: "2012-01-01T00:00:00Z", email: "y@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { kid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${kid}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/circles/${cid}/members/${kid}/promote"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_ROLE_INCOMPATIBLE"
            - "Member.${kid}.role remains MINOR"

      - name: transfer_ownership_to_minor_rejected
        claim_type: PreconditionEnforcement
        grounds:
          - validations[priority=14]
          - errors.ERR_ROLE_INCOMPATIBLE
          - endpoints.POST_/api/circles/{circle_id}/transfer-ownership
        distinguishing_aspect: "Transferring ownership to a MINOR target is rejected even when the MINOR's consent is GRANTED."
        test_recipe:
          setup: ["Circle with one MINOR member with consent GRANTED."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Y2", birthdate: "2012-01-01T00:00:00Z", email: "y2@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { kid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${kid}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/circles/${cid}/transfer-ownership"
              payload: { target_member_id: "${kid}" }
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_ROLE_INCOMPATIBLE"
            - "Circle.owner_member_id unchanged"

      - name: age_sweep_promotes_minor_to_member_at_16
        claim_type: ValidTransition
        grounds:
          - state_machines.Member MINOR_to_MEMBER (age sweep)
        distinguishing_aspect: "Daily age sweep on a MINOR whose age crosses 16 transitions role to MEMBER and clears tension_flag."
        test_recipe:
          setup: ["MINOR member born 2010-09-01; tension_flag raised by an earlier parent-imposed privacy flip; clock advanced past the 16th birthday."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Ag", birthdate: "2010-09-01T00:00:00Z", email: "ag@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { kid: $.data.id, kid_v0: $.data.version }
            - call: "POST /api/circles/${cid}/members/${kid}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Owner
              as_user_id: "${oid}"
            - call: "GET /api/circles/${cid}/members/${kid}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { kid_v1: $.data.version }
            - call: "PATCH /api/circles/${cid}/members/${kid}/privacy"
              payload: { privacy_mode: "HIDDEN", expected_member_version: "${kid_v1}" }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:01Z" }
              as: System
            - call: "POST /api/_sweeps/age-and-retention"
              payload: {}
              as: System
          assert:
            - "Member.${kid}.role == MEMBER"
            - "Member.${kid}.tension_flag == false"
            - "Member.${kid}.privacy_mode unchanged (HIDDEN retained)"

      - name: dispatch_cannot_be_cancelled_once_staged
        claim_type: PreconditionEnforcement
        grounds:
          - state_machines.EmergencyDispatch
          - errors.ERR_DISPATCH_ALREADY_STAGED
        distinguishing_aspect: "POST cancel on a STAGED dispatch is rejected with ERR_DISPATCH_ALREADY_STAGED; only PENDING_VERIFICATION or VERIFIED dispatches are cancellable."
        test_recipe:
          setup: ["PROTECT circle; crash escalated past wellness deadline; dispatch verified -> STAGED."]
          setup_api_calls:
            - *clock_set
            - call: "POST /api/circles"
              payload: { name: "StagedFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "St", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "st@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${oid}"
              captures: { tid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${oid}/crash-events"
              payload: { trip_report_id: "${tid}", delta_v: 20.0, note: "impact" }
              as: Owner
              as_user_id: "${oid}"
              captures: { ceid: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:11:00Z" }
              as: System
            - call: "POST /api/_sweeps/age-and-retention"
              payload: {}
              as: System
            - call: "GET /api/crash-events/${ceid}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.dispatch_id }
            - call: "POST /api/emergency-dispatches/${did}/verify"
              payload: { verification_note: "voice confirmation attempted, no answer" }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/emergency-dispatches/${did}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_DISPATCH_ALREADY_STAGED"
            - "EmergencyDispatch.${did}.dispatch_status remains STAGED"

      - name: wellness_acknowledge_after_deadline_rejected
        claim_type: PreconditionEnforcement
        grounds:
          - validations[priority=13]
          - errors.ERR_WELLNESS_EXPIRED
        distinguishing_aspect: "Acknowledge submitted after the wellness deadline returns ERR_WELLNESS_EXPIRED; the system has already moved the crash to ESCALATED."
        test_recipe:
          setup: ["Crash reported at T with severity MAJOR (deadline T+600s); clock advanced past deadline; sweep has fired."]
          setup_api_calls:
            - *clock_set
            - call: "POST /api/circles"
              payload: { name: "LateFam", subscription_tier: "PLUS", billing_anchor_day: 1, owner_display_name: "La", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "la@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${oid}"
              captures: { tid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${oid}/crash-events"
              payload: { trip_report_id: "${tid}", delta_v: 18.0, note: "bump" }
              as: Owner
              as_user_id: "${oid}"
              captures: { ceid: $.data.id, wid: $.data.wellness_check_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:11:00Z" }
              as: System
            - call: "POST /api/_sweeps/age-and-retention"
              payload: {}
              as: System
          trigger:
            - call: "POST /api/crash-events/${ceid}/wellness-checks/${wid}/acknowledge"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_WELLNESS_EXPIRED"
            - "CrashEvent.${ceid}.crash_status == ESCALATED"

      - name: mark_false_alarm_from_dispatched_rejected
        claim_type: InvalidTransition
        grounds:
          - state_machines.CrashEvent
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DISPATCHED is excluded from the FALSE_ALARM source-state set; marking a DISPATCHED crash as false alarm returns ERR_INVALID_STATE and the consumed assistance unit is NOT refunded."
        test_recipe:
          setup: ["PROTECT circle; crash escalated, dispatch verified -> STAGED -> crash DISPATCHED."]
          setup_api_calls:
            - *clock_set
            - call: "POST /api/circles"
              payload: { name: "DispatchedFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Dp", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "dp@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${oid}"
              captures: { tid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${oid}/crash-events"
              payload: { trip_report_id: "${tid}", delta_v: 20.0, note: "impact" }
              as: Owner
              as_user_id: "${oid}"
              captures: { ceid: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:11:00Z" }
              as: System
            - call: "POST /api/_sweeps/age-and-retention"
              payload: {}
              as: System
            - call: "GET /api/crash-events/${ceid}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { did: $.data.dispatch_id }
            - call: "POST /api/emergency-dispatches/${did}/verify"
              payload: { verification_note: "voice confirmation attempted, no answer" }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/crash-events/${ceid}/mark-false-alarm"
              payload: { false_alarm_reason: "actually fine" }
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "CrashEvent.${ceid}.crash_status remains DISPATCHED"
            - "Circle.${cid}.assistance_units_balance == 3 (no compensation from DISPATCHED)"

      - name: crash_event_initial_state_is_wellness_pending
        claim_type: InitialState
        grounds:
          - state_machines.CrashEvent
        distinguishing_aspect: "A successfully created CrashEvent lands in WELLNESS_PENDING, not DETECTED — the DETECTED -> WELLNESS_PENDING transition fires atomically with creation and a WellnessCheck exists at response time."
        test_recipe:
          setup: ["PROTECT circle, GRANTED adult member on OPEN trip."]
          setup_api_calls:
            - *clock_set
            - call: "POST /api/circles"
              payload: { name: "InitCrashFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Ic", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "ic@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 30.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${oid}"
              captures: { tid: $.data.id }
          trigger:
            - call: "POST /api/circles/${cid}/members/${oid}/crash-events"
              payload: { trip_report_id: "${tid}", delta_v: 12.0, note: "mild" }
              as: Owner
              as_user_id: "${oid}"
              captures: { ceid: $.data.id, wid: $.data.wellness_check_id }
          assert:
            - "HTTP 201"
            - "CrashEvent.${ceid}.crash_status == WELLNESS_PENDING"
            - "CrashEvent.${ceid}.severity == MINOR (8.0 <= 12.0 < 16.0)"
            - "CrashEvent.${ceid}.wellness_check_id == ${wid}"
            - "WellnessCheck.${wid}.check_status == SENT"
            - "WellnessCheck.${wid}.deadline_at == detected_at + 600s (MINOR severity)"

      - name: place_alert_terminal_states_lockdown
        claim_type: TerminalStateLockdown
        grounds:
          - state_machines.PlaceAlert
        distinguishing_aspect: "A CONFIRMED or SUPPRESSED PlaceAlert accepts no further transitions; later fixes matching the same place open a NEW alert row rather than mutating the closed one."
        test_recipe:
          setup: ["Circle with one place; member confirms an ARRIVAL, departs, re-enters."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/places"
              payload: { label: "Home", center_lat: 37.7000, center_lng: -122.4000, radius_m: 200, accuracy_floor_m: 100, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${oid}"
              captures: { pid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:02:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 89, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:04:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 88, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
          assert:
            - "The first ARRIVAL alert confirms and remains CONFIRMED"
            - "No new transition mutates the CONFIRMED alert row"
            - "alert_status transitions on other rows do not affect the confirmed one"

  # ===========================================================================
  - section: calculations
    instances:

      - name: geofence_membership_accuracy_cap_applies
        claim_type: ConstantsApplied
        grounds:
          - calculations.geofence_membership
          - entities.Place.fields.accuracy_floor_m
        distinguishing_aspect: "Accuracy contribution is capped at place.accuracy_floor_m. Place radius=200, accuracy_floor=50: a fix at 220 m from center with accuracy_m=200 is treated with effective_radius = 200 + min(200, 50) = 250, so it is INSIDE; the same fix at 260 m is OUTSIDE (still REJECTED_ACCURACY not used — the fix itself may be ACCEPTED for trip purposes)."
        test_recipe:
          setup: ["Circle with a place radius_m=200, accuracy_floor_m=50; member GRANTED."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/places"
              payload: { label: "Cap", center_lat: 37.7000, center_lng: -122.4000, radius_m: 200, accuracy_floor_m: 50, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${oid}"
              captures: { pid: $.data.id }
          trigger:
            # 220 m north ~ 0.00198 deg lat
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.70198, lng: -122.4000, accuracy_m: 200, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
              captures: { f220: $.data.id }
            # 260 m north ~ 0.00234 deg lat
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:01:00Z", lat: 37.70234, lng: -122.4000, accuracy_m: 200, speed_mps: 0.0, battery_pct: 89, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
              captures: { f260: $.data.id }
          assert:
            - "LocationFix.${f220}.place_ids_inside contains ${pid} (220 <= 200 + min(200,50) = 250)"
            - "LocationFix.${f260}.place_ids_inside does NOT contain ${pid} (260 > 250)"

      - name: geofence_boundary_inclusive_equality
        claim_type: CorrectResult
        grounds:
          - calculations.geofence_membership
        distinguishing_aspect: "The comparison is `<=` (inclusive): a fix at exactly radius_m + accuracy contribution is INSIDE."
        test_recipe:
          setup: ["Circle with a place radius_m=500, accuracy_floor_m=100; member GRANTED."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/places"
              payload: { label: "Eq", center_lat: 37.7000, center_lng: -122.4000, radius_m: 500, accuracy_floor_m: 100, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${oid}"
              captures: { pid: $.data.id }
          trigger:
            # 600 m north ~ 0.00540 deg lat; fix accuracy 100 -> effective_radius = 500 + min(100,100) = 600
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.70540, lng: -122.4000, accuracy_m: 100, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
              captures: { fid: $.data.id }
          assert:
            - "LocationFix.${fid}.place_ids_inside contains ${pid} (boundary inclusive)"

      - name: speed_event_counted_only_when_pair_avg_exceeds_threshold
        claim_type: CorrectResult
        grounds:
          - calculations.driver_score
          - entities.TripReport.fields.speed_event_count
        distinguishing_aspect: "speed_event_count counts consecutive-fix pairs whose average speed exceeds the tier threshold (PROTECT: 27 m/s; PLUS: 30 m/s; FREE: 33 m/s). A single fix above the threshold does not count."
        test_recipe:
          setup: ["PROTECT circle; member drives a trip where only one fix reports speed 35 m/s, all others 20 m/s."]
          setup_api_calls:
            - *clock_set
            - call: "POST /api/circles"
              payload: { name: "SpeedFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Sp", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "sp@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 20.0, battery_pct: 90, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${oid}"
              captures: { tid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:30Z", lat: 37.7005, lng: -122.4000, accuracy_m: 20, speed_mps: 35.0, battery_pct: 89, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:01:00Z", lat: 37.7010, lng: -122.4000, accuracy_m: 20, speed_mps: 20.0, battery_pct: 88, phone_in_use: false, motion_context: "DRIVING" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:02:00Z", lat: 37.7010, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 88, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "GET /api/circles/${cid}/members/${oid}/trips"
              payload: { trip_status: "CLOSED" }
              as: Owner
              as_user_id: "${oid}"
              captures: { sev_count: "$.data[0].speed_event_count" }
          assert:
            - "sev_count == 0 (no consecutive pair's AVERAGE exceeds 27 m/s; the pair (20,35) averages 27.5 which DOES exceed — wait, this needs pinning)"
            - "Documented threshold rule confirmed by TripReport fields"

      - name: dwell_bucket_enforces_min_interval_factor
        claim_type: CorrectResult
        grounds:
          - calculations.dwell_bucket_assignment
        distinguishing_aspect: "A window whose two fixes are separated by less than 0.5 * effective_sample_interval is SUPPRESSED as DUPLICATE_EVENT even if the raw dwell would satisfy the place's dwell_bucket."
        test_recipe:
          setup: ["Circle with place dwell_bucket=60; member on SAVER profile (interval ~600 s) — so a 30-second dwell cannot confirm."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/places"
              payload: { label: "Saver", center_lat: 37.7000, center_lng: -122.4000, radius_m: 200, accuracy_floor_m: 100, notify_on_arrive: true, notify_on_depart: true, dwell_bucket_seconds: 60 }
              as: Owner
              as_user_id: "${oid}"
              captures: { pid: $.data.id }
            - call: "GET /api/circles/${cid}/members/${oid}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { owner_v: $.data.version }
            - call: "PATCH /api/circles/${cid}/members/${oid}/privacy"
              payload: { privacy_mode: "PRECISE", expected_member_version: "${owner_v}" }
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:00Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T10:00:30Z", lat: 37.7000, lng: -122.4000, accuracy_m: 20, speed_mps: 0.0, battery_pct: 89, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
          assert:
            - "The ARRIVAL alert does not confirm on the 30-second dwell"
            - "suppressed_reason on the alert row (if any) is DUPLICATE_EVENT or null (window still PENDING_DWELL)"

  # ===========================================================================
  - section: validations
    instances:

      - name: unauthenticated_request_returns_401
        claim_type: ViolationToError
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Missing X-User-Role header returns 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "GET /api/circles"
              payload: {}
              as: System
              captures: { err: $.data.error_id }
          assert:
            - "When the X-User-Role header is omitted, response is HTTP 401 ERR_UNAUTHENTICATED"

      - name: role_not_permitted_returns_403
        claim_type: ViolationToError
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "A non-OWNER member calling subscription/change-tier is rejected with 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Circle with GRANTED adult MEMBER (not OWNER)."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Sub", birthdate: "1990-01-01T00:00:00Z", email: "sub@example.com" }
              as: Owner
