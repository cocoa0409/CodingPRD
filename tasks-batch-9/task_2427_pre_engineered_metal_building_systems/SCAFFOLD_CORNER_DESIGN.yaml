              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /builders/${b1_id}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { b1_v_susp: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
              captures: { b1_v_reauth: $.data.version }
            - call: "POST /builders/${b1_id}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { b1_v_susp2: $.data.version }
            - call: "POST /builders/${b1_id}/suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after the first suspend Builder.${b1_id}.status == SUSPENDED and Jurisdiction.${j1_id}.authorized_builder_count == 0"
            - "after the re-authorize Builder.${b1_id}.status == AUTHORIZED and authorized_at == 2026-08-25T00:00:00.000Z, replacing the 2026-08-05 stamp"
            - "Jurisdiction.${j1_id}.authorized_builder_count == 1 again"
            - "${b1_v_reauth} == ${b1_v_susp} + 1 and ${b1_v_susp2} == ${b1_v_reauth} + 1"
            - "the second consecutive suspend returns 409 with data.error_id == ERR_INVALID_STATE_TRANSITION and leaves version at ${b1_v_susp2}"
            - "neither action endpoint accepts a request body — both declare an empty input list"

