            - "Buffer, backward direction, exactly 180 minutes of clearance: the second call returns HTTP 201 with PWHTBatch.${b2_id}.status == SCHEDULED and required_soak_minutes == 45 — the comparison is scheduled_end > existing.scheduled_start - 180min, so touching the buffer edge is admitted"
            - "Buffer, forward direction, 179 minutes of clearance: ${err_after_by_179} == ERR_FURNACE_WINDOW_CONFLICT — the requested start 14:59 is earlier than B-1's end 12:00 plus 180 minutes (15:00)"
            - "Buffer, forward direction, exactly 180 minutes of clearance: the fourth call returns HTTP 201 with PWHTBatch.${b3_id}.status == SCHEDULED; it must ALSO clear B-2, which it does trivially because 15:00 is not before B-2's end 05:00 plus 180 minutes (08:00)"
            - "Full containment: ${err_contained} == ERR_FURNACE_WINDOW_CONFLICT for the 09:00-10:00 window wholly inside B-1 — containment is a conflict, not a special case"
            - "Different resource key: the identical 09:00-10:00 window in FURNACE_B returns HTTP 201 with PWHTBatch.${b4_id}.furnace_code == FURNACE_B, proving the conflict scope is furnace_code and not the job"
            - "GET /pwht-batches?job_id=${job_id} returns exactly 4 rows (B-1 plus the three admitted charges); the three refused requests created nothing and left W-004's pwht_batch_id pointing only at ${b4_id}"
            - "ProductionWeld.${w5_id}.pwht_batch_id is still null, since W-005 was never named in an admitted charge"

      - name: resource_temporal_test_bay_half_open_windows_with_aggregate_capacity
        grounds:
          - validations[priority=100]
          - entities.PressureTest.fields.test_bay_code
          - entities.PressureTest.fields.test_type
          - calculations.test_pressure
          - endpoints.POST_/pressure-tests
        distinguishing_aspect: |
          The test bay uses completely different interval arithmetic from the furnace: HALF-OPEN
          windows with no buffer, so a window starting exactly when another ends is admitted, and the
          constraint is an AGGREGATE CAPACITY (at most 2 concurrent hydrostatic tests) rather than
          mutual exclusion — with a type-asymmetric twist, since a pneumatic test must overlap
          nothing at all. The same clock instant therefore means different things per test_type, and
          the occupancy count only includes tests still at result = PENDING.
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers (SoD), one WeldingEngineer, one QCInspector."
            - "TWO HEAT_EXCHANGER jobs under the same ACTIVE certificate CA-U-8801, each with required_test_sides [SHELL_SIDE, TUBE_SIDE] so four distinct test slots exist in total: J-2885-15 (job X) and J-2885-16 (job Y). Job Y also carries a non-blank pneumatic_justification, so it may schedule a pneumatic test."
            - "Each job has all three required components (SHELL, HEAD, TUBESHEET) APPROVED, three ISSUED parts from ACCEPTED heat H-4471, and one category C FILLET joint that is WELDED with its MT examination ACCEPT, so both jobs sit in FABRICATION with every examination satisfied and no PWHT owed (WPS-1 has pwht_required false)."
            - "No PressureTest exists anywhere, so bay BAY_2 starts empty."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
            - call: "POST /personnel"
