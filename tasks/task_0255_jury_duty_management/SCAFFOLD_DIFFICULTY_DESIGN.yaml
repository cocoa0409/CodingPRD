          - entities.Trial.fields.status
        distinguishing_aspect: |
          Panel→Trial dependency: a REPORTING summons can be seated only while the panel's
          Trial.status == READY. With the trial still SCHEDULED the seat is rejected
          ERR_TRIAL_NOT_READY; readying the trial then allows it — Summons transition gated by
          Trial state (entity pair Panel/Summons → Trial).
