            - { call: "POST /newsroom/breaking-events/${ev_id}/activate", payload: {}, as: NewsDirector }
            - { call: "GET /newsroom/breaking-events/${ev_id}/call-ins", payload: {}, as: NewsDirector, captures: { ci_id: "$.data[0].id", ci_exp: "$.data[0].expires_at" } }
