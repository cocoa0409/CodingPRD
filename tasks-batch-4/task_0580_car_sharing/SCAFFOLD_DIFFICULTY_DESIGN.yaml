            - { call: "GET /vehicles/${vehicle_id}", payload: {}, as: PlatformAdmin, captures: { vehicle_v2: "$.data.version" } }
          trigger:
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-05", end_date: "2026-06-10", expected_vehicle_version: "${vehicle_v2}" }, as: Guest, as_user_id: "${guest_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_DATES_UNAVAILABLE"
            - "http status == 409"

      - name: pricing_closed_interval_adjacent_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_PRICING_RULE_OVERLAP]
          - entities.PricingRule.fields.start_date
          - entities.PricingRule.fields.end_date
        distinguishing_aspect: "PricingRule uses CLOSED [start,end] intervals on a different resource entity: [2026-06-01,06-07] and [2026-06-07,06-10] share the endpoint 2026-06-07 so the second is rejected with ERR_PRICING_RULE_OVERLAP — adjacency-forbidden, opposite of the availability half-open semantics."
        test_recipe:
          setup:
            - "A vehicle with an ACTIVE pricing rule covering 2026-06-01..2026-06-07 (inclusive)."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host P", email: "hp@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /pricing-rules", payload: { vehicle_id: "${vehicle_id}", start_date: "2026-06-01", end_date: "2026-06-07", daily_price_cents: 15000 }, as: Host, as_user_id: "${host_id}", captures: { rule1_id: "$.data.id" } }
          trigger:
            - { call: "POST /pricing-rules", payload: { vehicle_id: "${vehicle_id}", start_date: "2026-06-07", end_date: "2026-06-10", daily_price_cents: 18000 }, as: Host, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PRICING_RULE_OVERLAP"
            - "http status == 409"

  - rule_id: compensating_invariant
    instances:
      - name: host_pending_balance_book_cancel_conserved
        grounds:
          - calculations.host_pending_balance
          - state_machines.Trip.REQUESTED_to_CONFIRMED
          - state_machines.Trip.CONFIRMED_to_CANCELLED
          - entities.Host.fields.pending_balance_cents
        distinguishing_aspect: "Conserved quantity Host.pending_balance_cents: approve credits +50400, cancel of the CONFIRMED trip debits exactly -50400, so after approve+cancel pending_balance returns to its pre-approval value 0 (no drift)."
        test_recipe:
          setup:
            - "CONFIRMED 7-night trip; Host.pending_balance_cents == 50400 (pre-approval value was 0)."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host Q", email: "hq@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest Q", email: "gq@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-16", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /trips/${trip_id}/cancel", payload: { reason: "conservation check" }, as: Host, as_user_id: "${host_id}" }
          assert:
            - "Host.${host_id}.pending_balance_cents == 0"

      - name: vehicle_booked_nights_book_cancel_conserved
        grounds:
          - calculations.vehicle_booked_nights
          - state_machines.Trip.REQUESTED_to_CANCELLED
          - state_machines.AvailabilityBlock.ACTIVE_to_RELEASED
          - entities.Vehicle.fields.booked_night_count
        distinguishing_aspect: "Conserved quantity Vehicle.booked_night_count (calendar nights, not money): booking adds +7 via a BOOKED block, cancel releases it removing -7, so after book+cancel booked_night_count returns to pre-booking value 0."
        test_recipe:
          setup:
            - "REQUESTED 7-night trip; Vehicle.booked_night_count == 7 (pre-booking value was 0)."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host R", email: "hr@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest R", email: "gr@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-17", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
          trigger:
            - { call: "POST /trips/${trip_id}/cancel", payload: { reason: "calendar conservation" }, as: Guest, as_user_id: "${guest_id}" }
          assert:
            - "Vehicle.${vehicle_id}.booked_night_count == 0"
            - "AvailabilityBlock for trip_id ${trip_id} has status == RELEASED"
