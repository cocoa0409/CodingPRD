# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Package Locker & Mailbox Rental — Expert tier
# 9 rule_ids x 2 instances = 18 difficulty instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls
# chain is empty-DB executable; every formula-derived assert is a precomputed literal.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- (1) Package overstay: provisional vs final on different clock anchors ---
      - name: overstay_provisional_diverges_from_final_on_package
        grounds:
          - calculations.overstay_fee
          - state_machines.Package.NOTIFIED_to_PICKED_UP
          - entities.Package.fields.overstay_fee_cents
        distinguishing_aspect: "Same Package: the provisional overstay (600c at clock day4) differs from the final overstay (1500c posted at pickup on clock day7) because the provisional uses live current_utc and the final freezes resolved_at — divergence on the Package domain."
        test_recipe:
          setup:
            - "Facility tz UTC, clock 2026-06-01. MEDIUM mailbox monthly_fee 3000, 3-month rental, autopay OFF, activated 2026-06-01."
            - "MEDIUM locker available. Package (MEDIUM, dim 40, weight 3000 -> oversize 0) received and NOTIFIED at 2026-06-01."
            - "Clock advanced to 2026-06-05 (stored 4 days -> provisional overstay 600c)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F1", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "Cust One", email: "c1@x.com", phone: "111" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "Cust One", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 3, autopay_enabled: false }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { pkg: $.data.id, code: $.data.pickup_code }
            - call: "POST /packages/${pkg}/notify"
              payload: {}
              as: FacilityOperator
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00.000Z" }
              as: FacilityOperator
            - call: "GET /packages/${pkg}"
              payload: {}
              as: FacilityOperator
              captures: { prov_overstay: $.data.overstay_fee_cents, pkg_v: $.data.version }
          trigger:
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-08T00:00:00.000Z" }
              as: FacilityOperator
            - call: "GET /packages/${pkg}"
              payload: {}
              as: FacilityOperator
              captures: { pkg_v2: $.data.version }
            - call: "POST /packages/${pkg}/pickup"
              payload: { pickup_code: "${code}", expected_package_version: "${pkg_v2}" }
              as: FacilityOperator
          assert:
            - "Package.${pkg}.overstay_fee_cents observed at GET after clock day4 (prov_overstay) == 600"
            - "Package.${pkg}.overstay_fee_cents == 1500 after PICKED_UP (final, stored 7 days, 5 overstay days * 300)"
            - "1500 != 600 (final diverges from provisional on the same Package)"

      # --- (2) RentalAgreement prorated refund: chronological vs forward_looking ---
      - name: refund_chronological_diverges_from_forward_looking_on_agreement
        grounds:
          - calculations.prorated_refund
          - state_machines.RentalAgreement.ACTIVE_to_CLOSED
          - entities.RentalAgreement.fields.monthly_fee_cents
        distinguishing_aspect: "Same RentalAgreement closed at used_days=20: chronological refund (7000c, posted by CLOSE) diverges from forward_looking refund (6000c, quoted by refund-quote) — dual-variant on the RentalAgreement money domain, distinct from the Package overstay variant."
        test_recipe:
          setup:
            - "Facility tz UTC, clock 2026-06-01. MEDIUM mailbox monthly_fee 3000, 3-month rental (term_days 90), autopay OFF, activated 2026-06-01 (term_start 06-01)."
            - "Clock advanced to 2026-06-21 (used 20 days)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F2", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "Cust Two", email: "c2@x.com", phone: "222" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "Cust Two", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 3, autopay_enabled: false }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-21T00:00:00.000Z" }
              as: FacilityOperator
          trigger:
            - call: "GET /rental-agreements/${agr}/refund-quote"
              payload: {}
              as: FacilityOperator
              captures: { chrono_q: $.data.chronological_refund_cents, fwd_q: $.data.forward_looking_refund_cents }
            - call: "POST /rental-agreements/${agr}/close"
              payload: {}
              as: FacilityOperator
          assert:
            - "refund-quote chronological_refund_cents == 7000 and forward_looking_refund_cents == 6000 (chrono != fwd)"
            - "A PRORATED_REFUND CREDIT LedgerEntry with amount_cents == 7000 posts on the agreement Invoice (chronological variant pinned)"
            - "No LedgerEntry with reason==PRORATED_REFUND and amount_cents==6000 exists (forward_looking is quote-only)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- (1) mode (a): oversize fee — 3 inputs, nested max/ceil, tier select, cap ---
      - name: oversize_fee_nonlinear_three_input_tiered
        grounds:
          - calculations.oversize_fee
          - entities.Package.fields.oversize_fee_cents
          - state_machines.Package.RECEIVED_to_NOTIFIED
        distinguishing_aspect: "Mode (a): oversize_fee combines longest_dim_cm, weight_g, and LockerUnit.size_tier via tier-keyed thresholds, two independent ceil bucket counts, and a final min-cap — a >=3-input non-linear formula (distinct mode from the rounding-order instance)."
        test_recipe:
          setup:
            - "Facility, MEDIUM locker, ACTIVE rental. Package received MEDIUM with dim 72 (over 50 -> 3 buckets) and weight 6200 (over 5000 -> 2 buckets)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F3", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "C3", email: "c3@x.com", phone: "333" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "C3", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1 }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
          trigger:
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "FEDEX", size_tier: "MEDIUM", longest_dim_cm: 72, weight_g: 6200 }
              as: FacilityOperator
              captures: { pkg: $.data.id, ofee: $.data.oversize_fee_cents }
          assert:
            - "Package.${pkg}.oversize_fee_cents == 610 (3*150 dim + 2*80 weight)"

      # --- (2) mode (b): invoice balance — round-per-line-then-sum order pinned ---
      - name: invoice_balance_round_per_line_then_sum
        grounds:
          - calculations.invoice_balance
          - calculations.oversize_fee
          - calculations.overstay_fee
          - entities.Invoice.fields.balance_cents
        distinguishing_aspect: "Mode (b): invoice balance is the sum of already-cent-rounded line items (RENTAL 9000 + OVERSIZE 610 + OVERSTAY 1500 = 11110), pinned to round-per-line-then-sum so no running dollar subtotal is re-rounded — distinct combinatorial mode from oversize's nonlinear formula."
        test_recipe:
          setup:
            - "Facility tz UTC clock 2026-06-01. MEDIUM mailbox 3000c, 3-month rental autopay OFF activated 2026-06-01 (RENTAL charge 9000)."
            - "Package MEDIUM dim 72 weight 6200 (oversize 610), NOTIFIED 2026-06-01, clock advanced to 2026-06-08 (stored 7, overstay 1500)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F4", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "C4", email: "c4@x.com", phone: "444" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "C4", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 3, autopay_enabled: false }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "FEDEX", size_tier: "MEDIUM", longest_dim_cm: 72, weight_g: 6200 }
              as: FacilityOperator
              captures: { pkg: $.data.id, code: $.data.pickup_code }
            - call: "POST /packages/${pkg}/notify"
              payload: {}
              as: FacilityOperator
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-08T00:00:00.000Z" }
              as: FacilityOperator
            - call: "GET /packages/${pkg}"
              payload: {}
              as: FacilityOperator
              captures: { pkg_v: $.data.version }
          trigger:
            - call: "POST /packages/${pkg}/pickup"
              payload: { pickup_code: "${code}", expected_package_version: "${pkg_v}" }
              as: FacilityOperator
              captures: { agr_after: $.data.rental_agreement_id }
            - call: "GET /invoices?rental_agreement_id=${agr}"
              payload: {}
              as: FacilityOperator
              captures: { inv0: "$.data[0].id" }
            - call: "GET /invoices/${inv0}"
              payload: {}
              as: FacilityOperator
              captures: { chg: $.data.charges_total_cents }
          assert:
            - "Invoice for agreement ${agr} has charges_total_cents == 11110 (9000 + 610 + 1500, each a pre-rounded line item)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- (1) RentalAgreement cycle ACTIVE<->SUSPENDED ---
      - name: rental_agreement_active_suspended_cycle
        grounds:
          - state_machines.RentalAgreement.ACTIVE_to_SUSPENDED
          - state_machines.RentalAgreement.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "RentalAgreement returns to ACTIVE after SUSPENDED (a true cycle ACTIVE->SUSPENDED->ACTIVE), proving non-linear shape on the RentalAgreement entity."
        test_recipe:
          setup:
            - "ACTIVE 1-month rental (monthly 3000) on Facility F5; autopay OFF; invoice balance 3000 (<= 5000 threshold)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F5", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "C5", email: "c5@x.com", phone: "555" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "STATE_ID", address_proof_type: "UTILITY_BILL" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "C5", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1, autopay_enabled: false }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /rental-agreements/${agr}/suspend"
              payload: {}
              as: FacilityOperator
              captures: { st_susp: $.data.status }
          trigger:
            - call: "POST /rental-agreements/${agr}/reactivate"
              payload: {}
              as: FacilityOperator
              captures: { st_re: $.data.status }
          assert:
            - "RentalAgreement.${agr}.status == SUSPENDED after suspend, then == ACTIVE after reactivate (cycle closed)"

      # --- (2) Package branching fork-join with divergent side effects ---
      - name: package_fork_join_divergent_branches
        grounds:
          - state_machines.Package.NOTIFIED_to_PICKED_UP
          - state_machines.Package.NOTIFIED_to_FORWARDED
          - calculations.forwarding_fee
        distinguishing_aspect: "From NOTIFIED, Package forks to PICKED_UP vs FORWARDED with divergent side-effects (FORWARDED additionally posts a FORWARDING charge of 1200c that PICKED_UP does not), proving branching non-linear shape on the Package entity (different entity from RentalAgreement)."
        test_recipe:
          setup:
            - "Two NOTIFIED packages on the same ACTIVE rental F6, each MEDIUM dim 40 weight 3000 (oversize 0), notified and picked up/forwarded same day (overstay 0)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F6", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr1: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L2", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr2: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "C6", email: "c6@x.com", phone: "666" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "C6", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1 }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { pkgA: $.data.id, codeA: $.data.pickup_code }
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { pkgB: $.data.id }
            - call: "POST /packages/${pkgA}/notify"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages/${pkgB}/notify"
              payload: {}
              as: FacilityOperator
            - call: "GET /packages/${pkgA}"
              payload: {}
              as: FacilityOperator
              captures: { vA: $.data.version }
          trigger:
            - call: "POST /packages/${pkgA}/pickup"
              payload: { pickup_code: "${codeA}", expected_package_version: "${vA}" }
              as: FacilityOperator
              captures: { stA: $.data.status }
            - call: "POST /packages/${pkgB}/forward"
              payload: { destination_address: "1 Main St" }
              as: FacilityOperator
              captures: { stB: $.data.status }
          assert:
            - "Package.${pkgA}.status == PICKED_UP and Package.${pkgB}.status == FORWARDED"
            - "Invoice for ${agr} has exactly one LedgerEntry reason==FORWARDING amount_cents==1200 (from the FORWARDED branch; the PICKED_UP branch posts none)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- (1) depth-3: pickup -> overstay/oversize charge -> balance rise -> autopay capture ---
      - name: pickup_charge_balance_autopay_depth3
        grounds:
          - state_machines.Package.NOTIFIED_to_PICKED_UP
          - calculations.invoice_balance
          - calculations.autopay_capture
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: "Depth-3 chain triggered by pickup: PICKED_UP posts OVERSIZE+OVERSTAY charges (link1) -> Invoice.balance_cents rises (link2 caused by link1) -> autopay captures a Payment of exactly the new balance (link3 caused by link2). Originates from the pickup transition."
        test_recipe:
          setup:
            - "Facility tz UTC clock 2026-06-01. MEDIUM mailbox 3000c, 3-month rental, autopay ON, activated 2026-06-01 (RENTAL 9000 -> autopay captured -> balance 0)."
            - "Package MEDIUM dim 72 weight 6200 (oversize 610), NOTIFIED 2026-06-01, clock advanced to 2026-06-08 (overstay 1500)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F7", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "C7", email: "c7@x.com", phone: "777" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
