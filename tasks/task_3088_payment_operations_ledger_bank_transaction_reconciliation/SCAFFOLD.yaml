  input: []
  output: CounterpartyRelationship
  side_effects: []
- method: GET
  path: /counterparty-relationships
  description: List counterparty relationships with filtering on either side of the pair
  roles:
  - PlatformAdmin
  - LedgerController
  - PaymentOpsAnalyst
  - PaymentApprover
  - Auditor
  code: 200
  input:
