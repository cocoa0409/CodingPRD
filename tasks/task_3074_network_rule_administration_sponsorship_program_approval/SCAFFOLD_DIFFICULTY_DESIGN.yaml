            - "Merchant.${mc1}.status == TERMINATED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_single_open_window_cardinality
        grounds:
          - state_machines.SettlementWindow.SCHEDULED_to_OPEN
          - errors[ERR_WINDOW_NOT_OPEN]
          - entities.SettlementWindow.fields.opens_at
        distinguishing_aspect: |
          Cardinality/resource-exclusion semantics (not half-open adjacency): opening any second window
          while one is OPEN is rejected with ERR_WINDOW_NOT_OPEN regardless of whether their
          [opens_at, closes_at) intervals overlap — even a window whose interval lies entirely in the
          future conflicts, because the resource is the single open-window slot, not the time geometry.
        test_recipe:
          setup:
            - "Window W1 [2026-08-31T23:00Z, 2026-09-02T00:00Z) opened at default clock 2026-09-01"
            - "Window W2 [2026-09-05T00:00Z, 2026-09-06T00:00Z) SCHEDULED, entirely disjoint from W1 in time"
          setup_api_calls:
            - call: "POST /network/settlement-windows"
              payload: { window_date: "2026-09-01", opens_at: "2026-08-31T23:00:00Z", closes_at: "2026-09-02T00:00:00Z" }
              as: SettlementOperator
              captures: { w1: $.data.id }
            - call: "POST /network/settlement-windows/${w1}/open"
              payload: {}
              as: SettlementOperator
            - call: "POST /network/settlement-windows"
              payload: { window_date: "2026-09-05", opens_at: "2026-09-05T00:00:00Z", closes_at: "2026-09-06T00:00:00Z" }
              as: SettlementOperator
              captures: { w2: $.data.id }
          trigger:
            - call: "POST /network/settlement-windows/${w2}/open"
              payload: {}
              as: SettlementOperator
              captures: { open_err: $.data.error_id }
          assert:
            - "Opening W2 while W1 is OPEN -> ERR_WINDOW_NOT_OPEN (409) even though [W2] and [W1] do not overlap in time"
            - "SettlementWindow.${w2}.status == SCHEDULED"
            - "SettlementWindow.${w1}.status == OPEN"

      - name: rule_publication_supersede_adjacency_semantics
        grounds:
          - state_machines.NetworkRule.DRAFT_to_PUBLISHED
          - state_machines.NetworkRule.PUBLISHED_to_SUPERSEDED
          - entities.NetworkRule.fields.effective_from
        distinguishing_aspect: |
          Chronological-supersession interval semantics on the rule resource (a different geometric
          treatment than the settlement slot): a rule's effective lifetime is the half-open interval
          [effective_from, next_same_code_effective_from); publishing a later-effective rule with the same
          rule_code and same region scope supersedes the current one, while a rule with an EARLIER
          effective_from does NOT supersede it — direction and boundary of the interval decide the
          supersede, and the evaluation window of a violation selects whichever rule's interval contains
          the citation time.
        test_recipe:
          setup:
            - "Member M ACTIVE"
            - "Rule RA: code R-SUP-1 GLOBAL effective 2026-09-10, published -> PUBLISHED"
            - "Rule RB: code R-SUP-1 GLOBAL effective 2026-09-05 (earlier), published -> both RA and RB remain PUBLISHED (no supersede of the later-effective RA)"
            - "Rule RC: code R-SUP-1 GLOBAL effective 2026-09-20, published -> RA supersedes (RC later-effective)"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "R Bank", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/rules"
              payload:
                rule_code: "R-SUP-1"
                title: "A"
                body: "a"
                region_scope: "GLOBAL"
                effective_from: "2026-09-10T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 100 } ]
              as: RulesAdministrator
              captures: { ra: $.data.id }
            - call: "POST /network/rules/${ra}/publish"
              payload: {}
              as: RulesAdministrator
            - call: "POST /network/rules"
              payload:
                rule_code: "R-SUP-1"
                title: "B"
                body: "b"
                region_scope: "GLOBAL"
                effective_from: "2026-09-05T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 50 } ]
              as: RulesAdministrator
              captures: { rb: $.data.id }
            - call: "POST /network/rules/${rb}/publish"
              payload: {}
              as: RulesAdministrator
            - call: "POST /network/rules"
              payload:
                rule_code: "R-SUP-1"
                title: "C"
                body: "c"
                region_scope: "GLOBAL"
                effective_from: "2026-09-20T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 200 } ]
              as: RulesAdministrator
              captures: { rc: $.data.id }
            - call: "POST /network/rules/${rc}/publish"
              payload: {}
              as: RulesAdministrator
          trigger:
            - call: "GET /network/rules/${ra}"
              payload: {}
              as: RulesAdministrator
              captures: { ra_st: $.data.status }
            - call: "GET /network/rules/${rb}"
              payload: {}
              as: RulesAdministrator
              captures: { rb_st: $.data.status }
            - call: "GET /network/rules/${rc}"
              payload: {}
              as: RulesAdministrator
              captures: { rc_st: $.data.status }
          assert:
            - "Earlier-effective RB did NOT supersede RA: after RB publish, RA stayed PUBLISHED"
            - "Later-effective RC superseded RA: NetworkRule.${ra}.status == SUPERSEDED"
            - "NetworkRule.${rb}.status == PUBLISHED (its interval [09-05, 09-10) precedes RA's)"
            - "NetworkRule.${rc}.status == PUBLISHED"

  - rule_id: compensating_invariant
    instances:
      - name: settlement_commit_reverse_conserves_positions
        grounds:
          - calculations.settlement_net_position
          - state_machines.SettlementLine.DRAFT_to_COMMITTED
          - state_machines.SettlementLine.COMMITTED_to_REVERSED
          - entities.Member.fields.settled_balance_cents
        distinguishing_aspect: |
          Conserved quantity: per-member settled_balance_cents and window total_settled_cents. A commit
          (M1 -5000, M2 +5000, window +5000) followed by its reverse MUST restore both member balances to
          exactly 0 and the window total to exactly 0 — forward action + compensating action leave the
          named quantities unchanged.
        test_recipe:
          setup:
            - "Members M1, M2 ACTIVE (balances 0); window W open covering default clock; line L 5000 cents M1 -> M2 committed"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B1", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "B2", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m2: $.data.id }
            - call: "POST /network/members/${m2}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/settlement-windows"
              payload: { window_date: "2026-09-01", opens_at: "2026-08-31T23:00:00Z", closes_at: "2026-09-02T00:00:00Z" }
              as: SettlementOperator
              captures: { w1: $.data.id }
            - call: "POST /network/settlement-windows/${w1}/open"
              payload: {}
              as: SettlementOperator
            - call: "POST /network/settlement-lines"
              payload: { window_id: "${w1}", from_member_id: "${m1}", to_member_id: "${m2}", amount_cents: 5000, currency: "USD", reference: "r1" }
              as: SettlementOperator
              captures: { l1: $.data.id }
            - call: "POST /network/settlement-lines/${l1}/commit"
              payload: {}
              as: SettlementOperator
            - call: "GET /network/members/${m1}"
              payload: {}
              as: SettlementOperator
              captures: { m1_bal_mid: $.data.settled_balance_cents }
            - call: "GET /network/settlement-windows/${w1}"
              payload: {}
              as: SettlementOperator
              captures: { w_tot_mid: $.data.total_settled_cents }
          trigger:
            - call: "POST /network/settlement-lines/${l1}/reverse"
              payload: {}
              as: SettlementOperator
            - call: "GET /network/members/${m1}"
              payload: {}
              as: SettlementOperator
              captures: { m1_bal_end: $.data.settled_balance_cents }
            - call: "GET /network/members/${m2}"
              payload: {}
              as: SettlementOperator
              captures: { m2_bal_end: $.data.settled_balance_cents }
            - call: "GET /network/settlement-windows/${w1}"
              payload: {}
              as: SettlementOperator
              captures: { w_tot_end: $.data.total_settled_cents }
          assert:
            - "Mid-check: Member.${m1}.settled_balance_cents == -5000 and window total == 5000 after commit"
            - "After reverse: Member.${m1}.settled_balance_cents == 0"
            - "After reverse: Member.${m2}.settled_balance_cents == 0"
            - "After reverse: SettlementWindow.${w1}.total_settled_cents == 0"
            - "SettlementLine.${l1}.status == REVERSED"
            - "GET positions on ${w1}: total_check_cents == 0"

      - name: fine_waive_conserves_collected_total
        grounds:
          - state_machines.RuleViolation.ASSESSED_to_WAIVED
          - state_machines.RuleViolation.ASSESSED_to_CONFIRMED
          - entities.RuleViolation.fields.fine_cents
        distinguishing_aspect: |
          Conserved quantity of a different type (fine ledger, not funds balances): the aggregate
          outstanding-fine total over non-terminal violations plus confirmed fines must be invariant under
          assess-then-waive — assessing computes fine_cents (50000) and waiving resets it to 0, so the
          sum of fine_cents over the member's violations after the compensating waive equals exactly the
          sum before assessment (0), while a confirmed twin keeps its 50000.
        test_recipe:
          setup:
            - "Member M ACTIVE; published rule R (single tier fine 50000)"
            - "Violations V1 and V2 cited on M (severity MINOR, amount 150000); both assessed by ra-2 (cited by ra-1)"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "F Bank", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/rules"
              payload:
                rule_code: "R-FIN-1"
                title: "Fine rule"
                body: "b"
                region_scope: "GLOBAL"
                effective_from: "2026-09-01T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 50000 } ]
              as: RulesAdministrator
              captures: { r1: $.data.id }
            - call: "POST /network/rules/${r1}/publish"
              payload: {}
              as: RulesAdministrator
            - call: "POST /network/rule-violations"
              payload: { rule_id: "${r1}", subject_member_id: "${m1}", severity: "MINOR", transaction_amount_minor: 150000 }
              as: RulesAdministrator
              as_user_id: "ra-1"
              captures: { v1: $.data.id }
            - call: "POST /network/rule-violations"
              payload: { rule_id: "${r1}", subject_member_id: "${m1}", severity: "MINOR", transaction_amount_minor: 150000 }
              as: RulesAdministrator
              as_user_id: "ra-1"
              captures: { v2: $.data.id }
            - call: "POST /network/rule-violations/${v1}/assess"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-2"
            - call: "POST /network/rule-violations/${v2}/assess"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-2"
          trigger:
            - call: "POST /network/rule-violations/${v1}/waive"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-3"
            - call: "POST /network/rule-violations/${v2}/confirm"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-3"
          assert:
            - "RuleViolation.${v1}.fine_cents == 0 after waive (assess-then-waive nets to zero outstanding for V1)"
            - "RuleViolation.${v1}.status == WAIVED"
            - "RuleViolation.${v2}.fine_cents == 50000 and status == CONFIRMED"
            - "Sum of fine_cents over M's violations == 50000 (waived contributes 0, confirmed contributes 50000)"
