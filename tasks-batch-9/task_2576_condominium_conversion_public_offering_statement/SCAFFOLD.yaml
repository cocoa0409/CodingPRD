  - method: PATCH
    path: "/major-components/{id}"
    description: "Adjustment endpoint for a component's engineering inputs. Editing any component
      of an ACCEPTED report drives that report ACCEPTED -> SUPERSEDED and clears the project's
      suitability gate, which is how a test reaches the SUPERSEDED state and the re-review loop."
    roles: [LicensedEngineer]
    code: 200
    input: ["remaining_useful_life_years?", "effective_age_years?", "replacement_cost_cents?",
            "funded_pct_bp?", "condition_rating?", "planned_remediation_gain_years?", "is_life_safety?",
            "is_structural?"]
    output: MajorComponent
    side_effects: ["EngineeringReport.total_replacement_cost_cents and verified_component_count
        recomputed", "EngineeringReport ACCEPTED -> SUPERSEDED when the parent report was
        ACCEPTED", "ConversionProject.suitability_gate := UNEVALUATED on that supersede",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/major-components/{id}/verification"
    description: "Marks a component VERIFIED (or back to UNVERIFIED with verified == false) so it
