              captures: { acct_y: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_x}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_y}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_x}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_y}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_x}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_y}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_x}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
              captures: { inc_x: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_y}", reporter_type: "THIRD_PARTY", incident_category: "SAFETY_VIOLATION", aggravator_codes: ["S3_INJURY"] }
              as: SafetyInvestigator
              captures: { inc_y: $.data.id }
          trigger:
            - call: "POST /safety/regulator-reports/rollup-sweep"
              payload: { incident_id: "${inc_x}" }
              as: RegulatorLiaison
              captures: { x_report_id: "$.data[0].id", x_report_status: "$.data[0].report_status", x_report_region: "$.data[0].region_code" }
            - call: "PATCH /safety/platform-policies/${policy_id}"
              payload: { expected_policy_version: "${policy_v}", rollup_threshold: 4 }
              as: PlatformAdmin
            - call: "POST /safety/regulator-reports/rollup-sweep"
