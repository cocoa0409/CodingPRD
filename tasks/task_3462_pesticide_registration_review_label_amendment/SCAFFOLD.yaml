        actor: CertificationAuthority
        preconditions: ["new_certified_until strictly after the logical clock (ERR_CERTIFICATION_RENEWAL_INVALID otherwise)"]
        side_effects: ["certified_until := new_certified_until; renewed_count += 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST .../applicator-certifications/{id}/renew (early renewal)"
        actor: CertificationAuthority
        preconditions: ["new_certified_until strictly after the logical clock"]
        side_effects: ["certified_until := new_certified_until; renewed_count += 1"]

  - entity: EndangeredSpeciesBulletin
    initial_state: IN_EFFECT
    terminal_states: [LIFTED]
    transitions:
      - from: IN_EFFECT
        to: LIFTED
        trigger: "POST .../endangered-species-bulletins/{id}/lift"
        actor: RegistrationReviewer
        preconditions: ["Bulletin in IN_EFFECT (ERR_BULLETIN_NOT_LIFTABLE otherwise)"]
        side_effects: ["lifted_at := clock"]

  - entity: RegistrationReviewCase
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, REFERRED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (clock sweep: opened_at <= clock)"
        actor: system
        preconditions: []
        side_effects: ["Product REGISTERED -> UNDER_REVIEW (no-op when product SUSPENDED)"]
      - from: OPEN
        to: DCI_PENDING
        trigger: "POST /pesticide-registry/data-call-ins (first data call of the case)"
        actor: RegistrationReviewer
        preconditions: ["Case in OPEN or UNDER_REVIEW (ERR_CASE_NOT_OPEN otherwise)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: DCI_PENDING
        trigger: "POST /pesticide-registry/data-call-ins (subsequent data call)"
        actor: RegistrationReviewer
        preconditions: ["Case in OPEN or UNDER_REVIEW (ERR_CASE_NOT_OPEN otherwise)"]
        side_effects: []
      - from: DCI_PENDING
        to: UNDER_REVIEW
        trigger: "system (all DCIs of the case reached SATISFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "POST .../registration-review-cases/{id}/complete"
        actor: RegistrationReviewer
        preconditions:
          - "Case in OPEN, DCI_PENDING or UNDER_REVIEW (ERR_CASE_NOT_COMPLETABLE otherwise)"
          - "No DataCallIn of this case in ISSUED/RESPONDED/DEFICIENT/DELINQUENT (ERR_DCI_OUTSTANDING) — from DCI_PENDING this check is the one that fires, since a DCI_PENDING case always has a non-SATISFIED DCI; success is therefore only possible from OPEN (no DCIs) or UNDER_REVIEW"
        side_effects:
          - "completed_at := clock"
          - "Product UNDER_REVIEW -> REGISTERED when no other non-terminal case exists for the product"
          - "Next cycle auto-scheduled: new case cycle_number+1, SCHEDULED, opened_at = completed_at + 5475 days, due_at = opened_at + 180 days"
      - from: UNDER_REVIEW
        to: COMPLETED
        trigger: "POST .../registration-review-cases/{id}/complete"
        actor: RegistrationReviewer
        preconditions: ["same as OPEN -> COMPLETED"]
        side_effects: ["same as OPEN -> COMPLETED"]
      - from: DCI_PENDING
        to: REFERRED
        trigger: "system (a DCI of this case became DELINQUENT in the clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Hop 2 of the delinquency cascade: system creates a CancellationProceeding {type: SUSPENSION, reason: DCI_DELINQUENCY, status: EFFECTIVE, auto_created: true, initiated_by_ref: 'system', effective_at := clock, stocks fields null} unless the product is already SUSPENDED or CANCELLED"
          - "Hop 3 (caused by hop 2's EFFECTIVE suspension): Product REGISTERED/UNDER_REVIEW -> SUSPENDED"
          - "Hop 4 (caused by hop 3): StateRegistrations of the product in SUBMITTED -> DENIED"
      - from: UNDER_REVIEW
        to: REFERRED
        trigger: "system (a DCI of this case became DELINQUENT in the clock sweep)"
        actor: system
        preconditions: []
        side_effects: ["same delinquency cascade as DCI_PENDING -> REFERRED"]

  - entity: DataCallIn
    initial_state: ISSUED
    terminal_states: [SATISFIED]
    transitions:
      - from: ISSUED
        to: RESPONDED
        trigger: "POST .../data-call-ins/{id}/respond"
        actor: RegistrantRepresentative
        preconditions:
          - "DCI in ISSUED/RESPONDED/DEFICIENT/DELINQUENT (ERR_DCI_NOT_RESPONDABLE from SATISFIED)"
          - "Every id in study_submission_ids exists, has data_call_in_id == this DCI, and belongs to the registrant's product (ERR_STUDY_PARENT_MISMATCH)"
        side_effects:
          - "responded_at := clock; satisfied/pending/outstanding recomputed; if every required study type is satisfied -> SATISFIED immediately (and case DCI_PENDING -> UNDER_REVIEW if all case DCIs SATISFIED)"
      - from: RESPONDED
        to: RESPONDED
        trigger: "POST .../data-call-ins/{id}/respond (additional studies)"
        actor: RegistrantRepresentative
        preconditions: ["same as ISSUED -> RESPONDED"]
        side_effects: ["same as ISSUED -> RESPONDED"]
      - from: DEFICIENT
        to: RESPONDED
        trigger: "POST .../data-call-ins/{id}/respond (cure response)"
        actor: RegistrantRepresentative
        preconditions: ["same as ISSUED -> RESPONDED"]
        side_effects: ["same as ISSUED -> RESPONDED"]
      - from: DELINQUENT
        to: RESPONDED
        trigger: "POST .../data-call-ins/{id}/respond (late cure; the fired suspension cascade is NOT undone)"
        actor: RegistrantRepresentative
        preconditions: ["same as ISSUED -> RESPONDED"]
        side_effects: ["same as ISSUED -> RESPONDED; case stays REFERRED"]
      - from: RESPONDED
        to: SATISFIED
        trigger: "system (linked study ACCEPTED completes the last unsatisfied required type)"
        actor: system
        preconditions: ["satisfied_study_types == required_study_types (every required type has >= 1 ACCEPTED linked study)"]
        side_effects: ["Case DCI_PENDING -> UNDER_REVIEW when all of the case's DCIs are SATISFIED"]
      - from: DEFICIENT
        to: SATISFIED
        trigger: "system (linked study ACCEPTED completes the last outstanding type)"
        actor: system
        preconditions: ["outstanding_study_types empty"]
        side_effects: ["Case DCI_PENDING -> UNDER_REVIEW when all of the case's DCIs are SATISFIED"]
      - from: RESPONDED
        to: DEFICIENT
        trigger: "system (a linked StudySubmission was REJECTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: DELINQUENT
        trigger: "system (clock sweep: response_deadline < clock)"
        actor: system
        preconditions: []
        side_effects: ["Hop 1 of the delinquency cascade: owning case -> REFERRED (see RegistrationReviewCase machine)"]
      - from: RESPONDED
        to: DELINQUENT
        trigger: "system (clock sweep: response_deadline < clock while not SATISFIED)"
        actor: system
        preconditions: []
        side_effects: ["same delinquency cascade"]
      - from: DEFICIENT
        to: DELINQUENT
        trigger: "system (clock sweep: response_deadline < clock while not SATISFIED)"
        actor: system
        preconditions: []
        side_effects: ["same delinquency cascade"]

  - entity: CancellationProceeding
    initial_state: INITIATED
    terminal_states: [VACATED]
    transitions:
      - from: INITIATED
        to: HEARING_HELD
        trigger: "POST .../cancellation-proceedings/{id}/hear"
        actor: RegistrationReviewer
        preconditions:
          - "Proceeding in INITIATED (ERR_PROCEEDING_INVALID_STEP otherwise)"
          - "proceeding_type == CANCELLATION (suspensions take effect without a hearing; ERR_PROCEEDING_INVALID_STEP)"
        side_effects: ["hearing_held_at := clock"]
      - from: HEARING_HELD
        to: EFFECTIVE
        trigger: "POST .../cancellation-proceedings/{id}/issue-order (CANCELLATION)"
        actor: RegistrationReviewer
        preconditions:
          - "Proceeding in HEARING_HELD for CANCELLATION (ERR_PROCEEDING_INVALID_STEP otherwise)"
          - "Segregation of duties: X-User-ID != initiated_by_ref (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "existing_stocks_authorized_units and stocks_method present; depletion_rate_units_per_month present iff stocks_method == DEPLETION (ERR_INVALID_REQUEST)"
        side_effects:
          - "effective_at := clock; pre_effective_product_status := Product.status; allow_sale_until / allow_use_until computed per calculations.existing_stocks_deadlines"
          - "Product -> CANCELLED cascade (see Product machine, hops 1-3)"
      - from: INITIATED
        to: EFFECTIVE
        trigger: "POST .../cancellation-proceedings/{id}/issue-order (SUSPENSION — emergency order, no hearing)"
        actor: RegistrationReviewer
        preconditions:
          - "Proceeding in INITIATED and proceeding_type == SUSPENSION (ERR_PROCEEDING_INVALID_STEP otherwise)"
          - "Segregation of duties: X-User-ID != initiated_by_ref (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "existing-stocks fields MUST be absent (ERR_INVALID_REQUEST)"
        side_effects:
          - "effective_at := clock; pre_effective_product_status := Product.status"
          - "Product REGISTERED/UNDER_REVIEW -> SUSPENDED (hop A: SUBMITTED StateRegistrations -> DENIED)"
      - from: INITIATED
        to: VACATED
        trigger: "POST .../cancellation-proceedings/{id}/vacate"
        actor: RegistrationReviewer
        preconditions: ["Proceeding in INITIATED/HEARING_HELD/EFFECTIVE (ERR_PROCEEDING_INVALID_STEP otherwise)"]
        side_effects: ["vacated_at := clock; no other effects (nothing to restore before EFFECTIVE)"]
      - from: HEARING_HELD
        to: VACATED
        trigger: "POST .../cancellation-proceedings/{id}/vacate"
        actor: RegistrationReviewer
        preconditions: ["Proceeding in INITIATED/HEARING_HELD/EFFECTIVE"]
        side_effects: ["vacated_at := clock"]
      - from: EFFECTIVE
        to: VACATED
        trigger: "POST .../cancellation-proceedings/{id}/vacate (court vacatur / order withdrawn)"
        actor: RegistrationReviewer
        preconditions: ["Proceeding EFFECTIVE"]
        side_effects:
          - "vacated_at := clock"
          - "CANCELLATION: full restore per Product machine's CANCELLED -> * vacatur transition (product to pre_effective_product_status, tolerances to pre_revocation_status, ACTIVE-removed use sites restored; state registrations, withdrawn applications, and cascade-rejected amendments NOT restored)"
          - "SUSPENSION: no restore — the product remains SUSPENDED until POST .../products/{id}/reinstate (documented asymmetry)"

  - entity: StateRegistration
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST .../state-registrations/{id}/review-decisions with decision=GRANT"
        actor: StateLeadAgency
        preconditions:
          - "StateRegistration in SUBMITTED (ERR_STATE_REG_NOT_DECIDABLE otherwise)"
          - "Product in REGISTERED at decision time (ERR_PRODUCT_NOT_REGISTERED otherwise — re-checked at decision, not just at submission)"
          - "Product classification RESTRICTED_USE requires >= 1 ApplicatorCertification with state_code == this registration's state_code and status ACTIVE and certified_until >= clock (ERR_NO_VALID_APPLICATOR_CERTIFICATION)"
        side_effects:
          - "granted_at := clock; renewal_due_at := clock + 365 days; annual_fee_cents stamped; additional_restrictions stored from payload (default [])"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST .../state-registrations/{id}/review-decisions with decision=DENY, or system cascade when the product is SUSPENDED"
        actor: StateLeadAgency | system
        preconditions: ["StateRegistration in SUBMITTED"]
        side_effects: []
      - from: GRANTED
        to: LAPSED
        trigger: "system (clock sweep: renewal_due_at + 30 days < clock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: GRANTED
        trigger: "POST .../state-registrations/{id}/renew (with late fee)"
        actor: RegistrantRepresentative
        preconditions:
          - "StateRegistration in GRANTED or LAPSED (ERR_STATE_REG_NOT_DECIDABLE otherwise)"
          - "Product in REGISTERED or UNDER_REVIEW (ERR_PRODUCT_NOT_REGISTERED otherwise; CANCELLED -> ERR_PRODUCT_TERMINAL)"
          - "payment_cents == computed renewal fee per calculations.state_registration_renewal_fee (ERR_INCORRECT_FEE_PAYMENT)"
        side_effects:
          - "renewal_due_at := previous renewal_due_at + 365 days (NEVER clock + 365); last_renewal_at := clock; renewal_count += 1"
      - from: GRANTED
        to: GRANTED
        trigger: "POST .../state-registrations/{id}/renew (early or on-time renewal)"
        actor: RegistrantRepresentative
        preconditions: ["same as LAPSED -> GRANTED"]
        side_effects: ["same as LAPSED -> GRANTED"]
      - from: GRANTED
        to: REVOKED
        trigger: "POST .../state-registrations/{id}/revoke, or system cascade on product CANCELLATION"
        actor: StateLeadAgency | system
        preconditions: ["StateRegistration in GRANTED or LAPSED (ERR_STATE_REG_NOT_DECIDABLE otherwise)"]
        side_effects: []
      - from: LAPSED
        to: REVOKED
        trigger: "POST .../state-registrations/{id}/revoke, or system cascade on product CANCELLATION"
        actor: StateLeadAgency | system
        preconditions: ["StateRegistration in GRANTED or LAPSED"]
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on the parent's version only
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /pesticide-registry/label-amendments"
    occ_field: "expected_product_version"
    description: |
      Creating a LabelAmendment against a Product whose version has advanced
      since the client last observed it is rejected. The product's version
      advances on every amendment creation, so a client holding a stale
      observed version is filing against a label record that no longer
      matches its view; the request fails with a stale-version error even
      though every state precondition on the product still holds.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: dietary_exposure_and_risk_quotient
    trigger: "POST /pesticide-registry/risk-assessments (at RiskAssessment creation)"
    algorithm: aggregation
    formula: |
      input_set: distinct commodity_code values over the product's Tolerances
      in status PROPOSED or ESTABLISHED at assessment time.
      For each commodity:
        SCREENING tier: term = round_half_up(tolerance_ppm * CONSUMPTION_G_DAY[commodity], 4)
        REFINED tier:  if >= 1 ACCEPTED StudySubmission with study_type == RESIDUE_CHEMISTRY,
                       this commodity_code, and application_id == this application exists:
                         mean_residue = round_half_up(mean of those studies' field_trial_residue_ppm, 4)
                         term = round_half_up(mean_residue * CONSUMPTION_G_DAY[commodity] * pct_crop_treated, 4)
                       else (fallback): term = round_half_up(tolerance_ppm * CONSUMPTION_G_DAY[commodity], 4)
      ROUNDING ORDER PINNED: round each per-commodity term to 4 dp FIRST, then sum,
      then round the sum to 3 dp: dietary_exposure_mg_day = round_half_up(sum(terms), 3).
      dietary_rq = round_half_up(dietary_exposure_mg_day / (reference_dose_mg_kg_day * BODY_WEIGHT_KG), 3)
      Empty input set -> dietary_exposure_mg_day = 0.000, dietary_rq = 0.000.
    input_set: "Product's Tolerances in PROPOSED|ESTABLISHED; ACCEPTED residue studies of the same application (REFINED only)"
    constants:
      BODY_WEIGHT_KG: 70
      CONSUMPTION_G_DAY: { CORN: 12.5, SOYBEAN: 8.0, WHEAT: 20.0, APPLE: 15.0, COTTON: 0.0 }
    precision: "per-term 4 dp round_half_up; sum 3 dp round_half_up; quotient 3 dp round_half_up"
    variants:
      - name: SCREENING
        when: "tier == SCREENING"
        difference: "Uses the legal maximum residue (tolerance_ppm) and assumes 100% crop treated; pct_crop_treated forbidden"
      - name: REFINED
        when: "tier == REFINED"
        difference: "Uses mean ACCEPTED field-trial residues scaled by pct_crop_treated where such studies exist; per-commodity fallback to the SCREENING term otherwise — identical inputs therefore yield a lower (or equal) exposure than SCREENING"

  - name: occupational_risk_quotient
    trigger: "POST /pesticide-registry/risk-assessments"
    algorithm: aggregation
    formula: |
      max_rate = max(max_application_rate_lbs_acre) over the product's UseSites in PROPOSED or ACTIVE; 0 when none
      occupational_rq = round_half_up(max_rate * OCC_EXPOSURE_FACTOR / (reference_dose_mg_kg_day * BODY_WEIGHT_KG), 3)
      Identical across tiers.
    input_set: "Product's UseSites in PROPOSED|ACTIVE"
    constants:
      OCC_EXPOSURE_FACTOR: 0.01   # mg/day per lb/acre
      BODY_WEIGHT_KG: 70
    precision: "3 dp round_half_up"

  - name: ecological_risk_quotient
    trigger: "POST /pesticide-registry/risk-assessments"
    algorithm: aggregation
    formula: |
      EEC = max over the product's UseSites in PROPOSED or ACTIVE of
            (max_application_rate_lbs_acre * RUNOFF_FACTOR[application_method]); 0 when none
      ecological_rq = round_half_up(EEC / ActiveIngredient.aquatic_lc50_ppm, 3)
      Identical across tiers.
    input_set: "Product's UseSites in PROPOSED|ACTIVE"
    constants:
      RUNOFF_FACTOR: { GROUND: 0.05, AERIAL: 0.15, CHEMIGATION: 0.10, SEED_TREATMENT: 0.02 }
    precision: "3 dp round_half_up"

  - name: level_of_concern_determination
    trigger: "POST /pesticide-registry/risk-assessments (after the three quotients are computed)"
    algorithm: threshold
    formula: |
      level_of_concern_exceeded =
          (dietary_rq >= LOC_DIETARY) OR (occupational_rq >= LOC_OCCUPATIONAL) OR (ecological_rq >= LOC_ECOLOGICAL)
      Comparison uses the ROUNDED stored quotient values (so dietary_rq == 1.000 exactly exceeds).
    input_set: "the three computed quotients on the same RiskAssessment"
    constants:
      LOC_DIETARY: 1.0
      LOC_OCCUPATIONAL: 1.0
      LOC_ECOLOGICAL: 0.5
    precision: "comparison on 3-dp rounded values, inclusive >="

  - name: amendment_review_timeline
    trigger: "POST /pesticide-registry/label-amendments (at creation)"
    algorithm: tiered_pricing
    formula: |
      total_days = BASE_DAYS[amendment_type]
      if Product.classification == RESTRICTED_USE: total_days += RUP_ADDER_DAYS
      if amendment_type == NEW_USE and payload.tolerance_ppm is present: total_days += NEW_FOOD_USE_ADDER_DAYS
      if any EndangeredSpeciesBulletin of the product is IN_EFFECT: total_days += BULLETIN_ADDER_DAYS
      if payload.expedited == true (METHOD_CHANGE only; on any other type -> ERR_INVALID_REQUEST):
          total_days = ceil(total_days / 2)
      review_due_at = submitted_at + total_days
      priia_category = amendment_type, suffixed '-EXPEDITED' when the halving applied
    input_set: "amendment_type, product classification, payload keys, bulletin presence"
    constants:
      BASE_DAYS: { NEW_USE: 365, RATE_CHANGE: 180, METHOD_CHANGE: 91 }
      RUP_ADDER_DAYS: 90
      NEW_FOOD_USE_ADDER_DAYS: 180
      BULLETIN_ADDER_DAYS: 60
    precision: "integer days; halving rounds up (ceil)"

  - name: state_registration_renewal_fee
    trigger: "POST /pesticide-registry/state-registrations/{id}/renew"
    algorithm: threshold
    formula: |
      EVALUATION ORDER PINNED (circular-looking; due date is both input and output):
      (1) months_overdue = 0 when clock <= renewal_due_at, else floor((clock - renewal_due_at) days / 30) + 1
      (2) subtotal = StateRegistration.annual_fee_cents (stamped at grant)
      (3) late_penalty_cents = round_half_up(subtotal * LATE_MONTHLY_RATE * months_overdue, 0)
      (4) fee_due_cents = subtotal + late_penalty_cents; payment_cents must equal fee_due_cents exactly
      (5) only AFTER the fee is fixed: renewal_due_at := (previous renewal_due_at) + 365 days
      — never clock + 365, so chronically late renewals do not reset the anniversary.
    input_set: "the StateRegistration row, the logical clock"
    constants:
      LATE_MONTHLY_RATE: 0.10
      RENEWAL_PERIOD_DAYS: 365
      RENEWAL_GRACE_DAYS: 30
      STATE_BASE_FEE_CENTS: { CA: 40000, TX: 25000, IA: 18000, FL: 30000 }
      RUP_SURCHARGE_CENTS: 10000
    precision: "integer cents; round_half_up"

  - name: existing_stocks_deadlines
    trigger: "POST .../cancellation-proceedings/{id}/issue-order on a CANCELLATION proceeding"
    algorithm: threshold
    formula: |
      FIXED variant:     allow_sale_until = effective_at + 365 days; allow_use_until = effective_at + 730 days
      DEPLETION variant: sale_days = ceil(existing_stocks_authorized_units / depletion_rate_units_per_month * 30)
                         allow_sale_until = effective_at + sale_days; allow_use_until = effective_at + 2 * sale_days
      Variant selected by the order's stocks_method. The two variants give different
      deadlines for the same authorized units (e.g. 12000 units at 2000/month:
      DEPLETION sale window 180 days vs FIXED 365 days).
    input_set: "order payload + effective_at"
    constants:
      FIXED_SALE_DAYS: 365
      FIXED_USE_DAYS: 730
    precision: "integer days (ceil); datetime arithmetic on the logical clock"
    variants:
      - name: FIXED
        when: "stocks_method == FIXED"
        difference: "Statutory fixed windows independent of the authorized quantity"
      - name: DEPLETION
        when: "stocks_method == DEPLETION"
        difference: "Windows derived from the authorized quantity and the declared monthly depletion rate; the use window is exactly twice the sale window"

  - name: application_review_due_date
    trigger: "first submit (DRAFT -> IN_REVIEW)"
    algorithm: threshold
    formula: |
      review_due_at = submitted_at + APPLICATION_REVIEW_DAYS[use_pattern]
      Resubmission from DATA_DEFICIENCY does NOT recompute it.
    input_set: "application use_pattern, first submit clock"
    constants:
      APPLICATION_REVIEW_DAYS: { FOOD_USE: 540, NON_FOOD_USE: 270, MIXED_USE: 540 }
      APPLICATION_FEE_CENTS: { FOOD_USE: 500000, NON_FOOD_USE: 150000, MIXED_USE: 500000 }
    precision: "datetime"

  - name: registration_review_case_scheduling
    trigger: "application APPROVE; case complete; clock sweep; manual POST /registration-review-cases"
    algorithm: chronological
    formula: |
      On application approval: create case cycle_number 1, SCHEDULED,
        opened_at = clock + REVIEW_CYCLE_DAYS, due_at = opened_at + REVIEW_COMPLETION_DAYS.
      On case completion: create case cycle_number+1, SCHEDULED,
        opened_at = completed_at + REVIEW_CYCLE_DAYS, due_at = opened_at + REVIEW_COMPLETION_DAYS.
      On clock sweep: every SCHEDULED case with opened_at <= clock -> OPEN.
      cycle_number is always 1 + count of pre-existing cases of the product (creation order
      is therefore fully determined by created_at ASC; ids never participate).
    input_set: "product's cases"
    constants:
      REVIEW_CYCLE_DAYS: 5475
      REVIEW_COMPLETION_DAYS: 180
    precision: "datetime"

  - name: dci_obligation_reconciliation
    trigger: "DCI respond; study review-decision ACCEPT/REJECT on a DCI-linked study"
    algorithm: aggregation
    formula: |
      satisfied = required types with >= 1 ACCEPTED StudySubmission bearing this data_call_in_id
      pending   = required types with no ACCEPTED but >= 1 RECEIVED StudySubmission bearing this data_call_in_id
      outstanding = required - satisfied - pending
      INVARIANT (set partition): required_study_types == satisfied U pending U outstanding at all times.
      Auto-transitions: DCI in RESPONDED/DEFICIENT with satisfied == required -> SATISFIED
      (and case DCI_PENDING -> UNDER_REVIEW when all case DCIs SATISFIED);
      a REJECT on a linked study while the DCI is RESPONDED -> DEFICIENT.
    input_set: "StudySubmissions bearing this data_call_in_id"
    constants: {}
    precision: "set semantics; no rounding"

  - name: clock_sweep_batch
    trigger: "POST /_clock/set_current_utc"
    algorithm: chronological
    formula: |
      The logical clock starts at 2026-09-01T00:00:00Z before any set call and never moves
      backward (to_iso8601 strictly before the current value -> ERR_INVALID_REQUEST; equal
      is an idempotent no-op). On each set, apply
      these steps IN THIS ORDER:
      1. RegistrationReviewCase SCHEDULED with opened_at <= now -> OPEN (product REGISTERED -> UNDER_REVIEW)
      2. DataCallIn in ISSUED/RESPONDED/DEFICIENT with response_deadline < now -> DELINQUENT
         (fires the referral/auto-suspension cascade per the state machines)
      3. ApplicatorCertification ACTIVE with certified_until < now -> EXPIRED
      4. StateRegistration GRANTED with renewal_due_at + 30 days < now -> LAPSED
    input_set: "all entities in the swept states"
    constants:
      DEFAULT_CLOCK: "2026-09-01T00:00:00Z"
      RENEWAL_GRACE_DAYS: 30
    precision: "datetime comparisons; step 2 uses strict <, step 1 uses inclusive <="

  - name: existing_stocks_disposed_total
    trigger: "POST .../cancellation-proceedings/{id}/existing-stocks-disposals"
    algorithm: aggregation
    formula: |
      existing_stocks_disposed_units = sum of units over existing_stocks_disposals (0 when empty)
      A disposal is accepted only when the proceeding is EFFECTIVE with a stocks provision,
      clock <= allow_use_until (and clock <= allow_sale_until for method SALE or RETURN),
      and existing_stocks_disposed_units + units <= existing_stocks_authorized_units.
    input_set: "the proceeding's disposal records"
    constants: {}
    precision: "integer units"

  - name: signal_word_and_registration_number
    trigger: "application APPROVE"
    algorithm: aggregation
    formula: |
      signal_word = SIGNAL_WORD_BY_TOX[ActiveIngredient.tox_category]
      epa_registration_number = 'EPA-RR-' + zero_pad(count of previously APPROVED
      RegistrationApplications + 1, 6) — e.g. the first approval mints EPA-RR-000001.
    input_set: "ActiveIngredient, global approval count"
    constants:
      SIGNAL_WORD_BY_TOX: { I: DANGER_POISON, II: WARNING, III: CAUTION, IV: CAUTION }
    precision: "exact strings"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the six declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: request_schema
    check: "Required body fields present; types correct; enum values in their declared sets; unknown keys rejected; conditional requiredness (final_classification on APPROVE; pct_crop_treated on REFINED and forbidden on SCREENING; rate_cap_lbs_acre iff RATE_CAP; commodity_code + field_trial_residue_ppm iff RESIDUE_CHEMISTRY; depletion_rate_units_per_month iff DEPLETION; stocks fields present on CANCELLATION issue-order and forbidden on SUSPENSION; expedited only on METHOD_CHANGE; study parent XOR: exactly one of application_id/data_call_in_id); to_iso8601 not before the current clock"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; then body-supplied FK ids exist"
    error_id: "ERR_PRODUCT_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_STATE_REGISTRATION_NOT_FOUND / ERR_NOT_FOUND (generic, for all other resources)"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: ownership
    check: "RegistrantRepresentative may act only on rows whose owning Product.registrant_ref == X-User-ID (application submit/withdraw, amendment create/withdraw, tolerance create, study create, DCI respond, state-registration create/renew)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "registrant-scoped mutation endpoints"

  - priority: 6
    category: concurrency
    check: "expected_product_version equals Product.version (checked before any business validation)"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /pesticide-registry/label-amendments"

  - priority: 7
    category: state
    check: "State-machine from-state and cross-entity state preconditions (application DRAFT/IN_REVIEW gates, product UNREGISTERED/REGISTERED/SUSPENDED gates, ERR_PRODUCT_TERMINAL on CANCELLED, case OPEN/DCI gates, proceeding step gates, certification/study/amendment decidability)"
    error_id: "ERR_APPLICATION_NOT_SUBMITTABLE | ERR_APPLICATION_NOT_IN_REVIEW | ERR_APPLICATION_ALREADY_DECIDED | ERR_PRODUCT_NOT_UNREGISTERED | ERR_PRODUCT_NOT_REGISTERED | ERR_PRODUCT_TERMINAL | ERR_PRODUCT_NOT_SUSPENDED | ERR_REINSTATEMENT_BLOCKED | ERR_STUDY_NOT_DECIDABLE | ERR_AMENDMENT_NOT_PENDING | ERR_CASE_NOT_OPEN | ERR_CASE_NOT_COMPLETABLE | ERR_DCI_OUTSTANDING | ERR_DCI_NOT_RESPONDABLE | ERR_PROCEEDING_INVALID_STEP | ERR_STATE_REG_NOT_DECIDABLE | ERR_BULLETIN_NOT_LIFTABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "max_application_rate_lbs_acre <= 8.0 (ABSOLUTE_RATE_CAP_LBS_ACRE) on application creation and NEW_USE/RATE_CHANGE amendment payloads (ERR_RATE_EXCEEDS_SAFETY_CAP); IN_EFFECT PROHIBITED bulletin blocks NEW_USE amendments and IN_EFFECT RATE_CAP bulletin caps RATE_CHANGE/NEW_USE rates (ERR_ESA_PROHIBITION_CONFLICT); RESTRICTED_USE state grant requires a valid certification (ERR_NO_VALID_APPLICATOR_CERTIFICATION); required-study completeness at submit/approve (ERR_MISSING_REQUIRED_STUDIES); approval risk gates (ERR_NO_RISK_ASSESSMENT, ERR_LOC_EXCEEDED, ERR_NO_PROPOSED_TOLERANCE)"
    error_id: "ERR_RATE_EXCEEDS_SAFETY_CAP | ERR_ESA_PROHIBITION_CONFLICT | ERR_NO_VALID_APPLICATOR_CERTIFICATION | ERR_MISSING_REQUIRED_STUDIES | ERR_NO_RISK_ASSESSMENT | ERR_LOC_EXCEEDED | ERR_NO_PROPOSED_TOLERANCE"
    http_status: 422
    applies_to: "application create/submit/review-decisions, amendment create, state-registration review-decisions"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and overlap: one open application per product (ERR_DUPLICATE_OPEN_APPLICATION); one PROPOSED/ESTABLISHED tolerance per (product, commodity_code) (ERR_DUPLICATE_TOLERANCE); no IN_EFFECT bulletin of the same product+county sharing a calendar month (ERR_BULLETIN_WINDOW_OVERLAP); no half-open [opened_at, due_at) intersection with a non-terminal case of the same product (ERR_REVIEW_CASE_WINDOW_OVERLAP); one non-terminal state registration per (product, state_code) (ERR_DUPLICATE_STATE_REGISTRATION); one non-terminal proceeding per product via the manual create endpoint (ERR_DUPLICATE_OPEN_PROCEEDING); segregation of duties on approve and issue-order (ERR_SEGREGATION_OF_DUTIES_VIOLATION); disposal quantity within authorized stocks (ERR_EXISTING_STOCKS_QUANTITY_EXCEEDED)"
    error_id: "ERR_DUPLICATE_OPEN_APPLICATION | ERR_DUPLICATE_TOLERANCE | ERR_BULLETIN_WINDOW_OVERLAP | ERR_REVIEW_CASE_WINDOW_OVERLAP | ERR_DUPLICATE_STATE_REGISTRATION | ERR_DUPLICATE_OPEN_PROCEEDING | ERR_SEGREGATION_OF_DUTIES_VIOLATION | ERR_EXISTING_STOCKS_QUANTITY_EXCEEDED"
    http_status: 409
    applies_to: "submit, tolerance/bulletin/case/state-registration/proceeding create, review-decisions, issue-order, disposals"

  - priority: 10
    category: business_referential
    check: "Cross-references resolve and belong: study's application or DCI belongs to the acting registrant's product and study type matches declared commodity rules (ERR_STUDY_PARENT_MISMATCH); amendment payload use_site_id is a UseSite of the same product (ERR_USE_SITE_PRODUCT_MISMATCH); commodity_code exists in CONSUMPTION_G_DAY (ERR_UNKNOWN_COMMODITY); state_code exists in STATE_BASE_FEE_CENTS (ERR_INVALID_REQUEST)"
    error_id: "ERR_STUDY_PARENT_MISMATCH | ERR_USE_SITE_PRODUCT_MISMATCH | ERR_UNKNOWN_COMMODITY | ERR_INVALID_REQUEST"
    http_status: 400
    applies_to: "study create, DCI respond, amendment create, tolerance create, state-registration create"

  - priority: 11
    category: business_temporal
    check: "Existing-stocks disposal within allow_sale_until (SALE/RETURN) and allow_use_until (all methods) (ERR_EXISTING_STOCKS_WINDOW_CLOSED); certification renewal new_certified_until strictly after the clock (ERR_CERTIFICATION_RENEWAL_INVALID); bulletin months in 1..12 (ERR_INVALID_REQUEST); case opened_at <= due_at (ERR_INVALID_REQUEST)"
    error_id: "ERR_EXISTING_STOCKS_WINDOW_CLOSED | ERR_CERTIFICATION_RENEWAL_INVALID | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "disposals, certification renew, bulletin create, case create"

  - priority: 12
    category: business_fiscal
    check: "payment_cents equals the computed fee exactly (first submit: APPLICATION_FEE_CENTS[use_pattern]; renewal: state_registration_renewal_fee)"
    error_id: ERR_INCORRECT_FEE_PAYMENT
    http_status: 402
    applies_to: "application submit, state-registration renew"

# =============================================================================
# Response Envelope (§1.0 — FIXED, emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Platform (unprefixed logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Before any call the clock reads exactly 2026-09-01T00:00:00Z (the fixed server default — never wall-clock). to_iso8601 must not be strictly before the current value; an equal value is an idempotent no-op, a strictly earlier value fails ERR_INVALID_REQUEST. Runs the four-step clock_sweep_batch (cases open, DCIs delinquent, certifications expire, state registrations lapse) in that pinned order."
    roles: [SystemAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["clock_sweep_batch steps 1-4"]

  # --- Active Ingredients (reference data) ---
  - method: POST
    path: "/pesticide-registry/active-ingredients"
    description: "Register an active ingredient (reference data)"
    roles: [SystemAdministrator]
    code: 201
    input: [common_name, cas_number, tox_category, reference_dose_mg_kg_day, aquatic_lc50_ppm]
    output: ActiveIngredient
    side_effects: []

  - method: GET
    path: "/pesticide-registry/active-ingredients"
    description: "List active ingredients"
    roles: &all_roles [SystemAdministrator, RegistrantRepresentative, RegistrationReviewer, RiskAssessor, StateLeadAgency, CertificationAuthority]
    code: 200
    input: ["limit?", "offset?"]
    output: "ActiveIngredient[]"
    side_effects: []

  # --- Products ---
  - method: POST
    path: "/pesticide-registry/products"
    description: "Create a product shell (status UNREGISTERED, classification GENERAL_USE, registrant_ref := X-User-ID)"
    roles: [RegistrantRepresentative]
    code: 201
    input: [product_name, active_ingredient_id, formulation_type]
    output: Product
    side_effects: []

  - method: GET
    path: "/pesticide-registry/products"
    description: "List products with filters"
    roles: *all_roles
    code: 200
    input: ["active_ingredient_id?", "registrant_ref?", "status?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/products/{id}"
    description: "Get a product"
    roles: *all_roles
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/pesticide-registry/products/{id}/reinstate"
    description: "Lift a suspension after cure: SUSPENDED -> REGISTERED (or UNDER_REVIEW when a non-terminal case exists)"
    roles: [RegistrationReviewer]
    code: 200
    input: []
    output: Product
    side_effects: ["Product.status transition per state machine"]

  - method: GET
    path: "/pesticide-registry/products/{id}/use-sites"
    description: "List the product's label use sites"
    roles: *all_roles
    code: 200
    input: ["status?"]
    output: "UseSite[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/products/{id}/tolerances"
    description: "List the product's tolerances"
    roles: *all_roles
    code: 200
    input: ["status?"]
    output: "Tolerance[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/products/{id}/endangered-species-bulletins"
    description: "List the product's endangered-species bulletins"
    roles: *all_roles
    code: 200
    input: ["county_fips?", "status?"]
    output: "EndangeredSpeciesBulletin[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/products/{id}/registration-review-cases"
    description: "List the product's registration review cases"
    roles: *all_roles
    code: 200
    input: ["status?"]
    output: "RegistrationReviewCase[]"
    side_effects: []

  # --- Registration Applications ---
  - method: POST
    path: "/pesticide-registry/registration-applications"
    description: "Create an application in DRAFT; proposed_use_sites mint PROPOSED UseSite rows (origin INITIAL_APPLICATION); rates must respect the 8.0 lbs/acre absolute cap"
    roles: [RegistrantRepresentative]
    code: 201
    input: [product_id, use_pattern, requested_classification, proposed_use_sites]
    output: RegistrationApplication
    side_effects: ["UseSite rows created in PROPOSED"]

  - method: GET
    path: "/pesticide-registry/registration-applications"
    description: "List applications"
    roles: *all_roles
    code: 200
    input: ["product_id?", "registrant_ref?", "status?", "limit?", "offset?"]
    output: "RegistrationApplication[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/registration-applications/{id}"
    description: "Get an application"
    roles: *all_roles
    code: 200
    input: []
    output: RegistrationApplication
    side_effects: []

  - method: POST
    path: "/pesticide-registry/registration-applications/{id}/submit"
    description: "Submit (DRAFT->IN_REVIEW, fee charged) or resubmit (DATA_DEFICIENCY->IN_REVIEW, payment_cents omitted, review_due_at unchanged)"
    roles: [RegistrantRepresentative]
    code: 200
    input: ["payment_cents?"]
    output: RegistrationApplication
    side_effects: ["submitted_at, review_due_at (first submit only), payment_cents stamped"]

  - method: POST
    path: "/pesticide-registry/registration-applications/{id}/withdraw"
    description: "Withdraw a non-terminal application; PROPOSED use sites/tolerances cleaned up"
    roles: [RegistrantRepresentative]
    code: 200
    input: ["reason?"]
    output: RegistrationApplication
    side_effects: ["PROPOSED UseSites -> REMOVED, PROPOSED Tolerances -> REVOKED (pre_*_status left null)"]

  - method: POST
    path: "/pesticide-registry/registration-applications/{id}/review-decisions"
    description: "Reviewer decision: APPROVE (gates: accepted studies, latest assessment LOC clear, proposed tolerance for food uses, SoD vs assessor), DENY, or DEFICIENCY (revision loop)"
    roles: [RegistrationReviewer]
    code: 200
    input: [decision, "deficiency_notes?", "final_classification?"]
    output: RegistrationApplication
    side_effects: ["per RegistrationApplication and Product state machines"]

  - method: GET
    path: "/pesticide-registry/registration-applications/{id}/study-submissions"
    description: "List studies attached to the application"
    roles: *all_roles
    code: 200
    input: ["study_type?", "status?"]
    output: "StudySubmission[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/registration-applications/{id}/risk-assessments"
    description: "List risk assessments of the application (assessment_seq order)"
    roles: *all_roles
    code: 200
    input: []
    output: "RiskAssessment[]"
    side_effects: []

  # --- Study Submissions ---
  - method: POST
    path: "/pesticide-registry/study-submissions"
    description: "Submit a study against an application (DRAFT/IN_REVIEW/DATA_DEFICIENCY only) or a data call-in (exactly one parent)"
    roles: [RegistrantRepresentative]
    code: 201
    input: ["application_id?", "data_call_in_id?", study_type, guideline_reference, "commodity_code?", "field_trial_residue_ppm?"]
    output: StudySubmission
    side_effects: []

  - method: GET
    path: "/pesticide-registry/study-submissions"
    description: "List studies with filters"
    roles: *all_roles
    code: 200
    input: ["application_id?", "data_call_in_id?", "study_type?", "status?", "limit?", "offset?"]
    output: "StudySubmission[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/study-submissions/{id}"
    description: "Get a study"
    roles: *all_roles
    code: 200
    input: []
    output: StudySubmission
    side_effects: []

  - method: POST
    path: "/pesticide-registry/study-submissions/{id}/review-decisions"
    description: "RiskAssessor accepts or rejects a study; DCI linkage auto-updates (SATISFIED/DEFICIENT, case UNDER_REVIEW)"
    roles: [RiskAssessor]
    code: 200
    input: [decision, "decision_notes?"]
    output: StudySubmission
    side_effects: ["dci_obligation_reconciliation auto-transitions"]

  # --- Risk Assessments ---
  - method: POST
    path: "/pesticide-registry/risk-assessments"
    description: "Run a SCREENING or REFINED risk assessment for an application in IN_REVIEW or DATA_DEFICIENCY"
    roles: [RiskAssessor]
    code: 201
    input: [application_id, tier, "pct_crop_treated?"]
    output: RiskAssessment
    side_effects: ["dietary/occupational/ecological quotients and level_of_concern_exceeded computed"]

  # --- Tolerances ---
  - method: POST
    path: "/pesticide-registry/tolerances"
    description: "Propose a tolerance for a non-CANCELLED product owned by the registrant; one PROPOSED/ESTABLISHED per (product, commodity)"
    roles: [RegistrantRepresentative]
    code: 201
    input: [product_id, commodity_code, tolerance_ppm]
    output: Tolerance
    side_effects: []

  # --- Label Amendments ---
  - method: POST
    path: "/pesticide-registry/label-amendments"
    description: "File a label amendment (OCC-guarded by expected_product_version); product must be REGISTERED or UNDER_REVIEW; computes review_due_at and priia_category"
    roles: [RegistrantRepresentative]
    code: 201
    input: [product_id, amendment_type, payload, expected_product_version]
    output: LabelAmendment
    side_effects: ["increments Product.version by 1", "amendment_review_timeline computed"]

  - method: GET
    path: "/pesticide-registry/label-amendments"
    description: "List label amendments"
    roles: *all_roles
    code: 200
    input: ["product_id?", "amendment_type?", "status?", "limit?", "offset?"]
    output: "LabelAmendment[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/label-amendments/{id}"
    description: "Get a label amendment"
    roles: *all_roles
    code: 200
    input: []
    output: LabelAmendment
    side_effects: []

  - method: POST
    path: "/pesticide-registry/label-amendments/{id}/withdraw"
    description: "Withdraw a pending amendment"
    roles: [RegistrantRepresentative]
    code: 200
    input: ["reason?"]
    output: LabelAmendment
    side_effects: []

  - method: POST
    path: "/pesticide-registry/label-amendments/{id}/review-decisions"
    description: "Approve (applies the payload to the label) or reject a pending amendment"
    roles: [RegistrationReviewer]
    code: 200
    input: [decision, "decision_notes?"]
    output: LabelAmendment
    side_effects: ["per LabelAmendment state machine"]

  # --- Applicator Certifications ---
  - method: POST
    path: "/pesticide-registry/applicator-certifications"
    description: "Issue an applicator certification (certified_until must be in the future)"
    roles: [CertificationAuthority]
    code: 201
    input: [applicator_name, state_code, category, certified_until]
    output: ApplicatorCertification
    side_effects: []

  - method: GET
    path: "/pesticide-registry/applicator-certifications"
    description: "List applicator certifications"
    roles: *all_roles
    code: 200
    input: ["state_code?", "category?", "status?", "limit?", "offset?"]
    output: "ApplicatorCertification[]"
    side_effects: []

  - method: POST
    path: "/pesticide-registry/applicator-certifications/{id}/renew"
    description: "Renew a certification (ACTIVE or EXPIRED) to a new future certified_until"
    roles: [CertificationAuthority]
    code: 200
    input: [new_certified_until]
    output: ApplicatorCertification
    side_effects: ["status -> ACTIVE; renewed_count += 1"]

  # --- Endangered Species Bulletins ---
  - method: POST
    path: "/pesticide-registry/endangered-species-bulletins"
    description: "Publish a county-level use restriction bulletin (IN_EFFECT at creation); same product+county windows sharing a calendar month are rejected"
    roles: [RegistrationReviewer]
    code: 201
    input: [product_id, county_fips, restriction_code, "rate_cap_lbs_acre?", window_start_month, window_end_month, consultation_reference]
    output: EndangeredSpeciesBulletin
    side_effects: []

  - method: POST
    path: "/pesticide-registry/endangered-species-bulletins/{id}/lift"
    description: "Lift an IN_EFFECT bulletin"
    roles: [RegistrationReviewer]
    code: 200
    input: ["lift_reason?"]
    output: EndangeredSpeciesBulletin
    side_effects: ["status -> LIFTED, lifted_at := clock"]

  # --- Registration Review Cases ---
  - method: POST
    path: "/pesticide-registry/registration-review-cases"
    description: "Manually schedule a review case for a REGISTERED product; half-open [opened_at, due_at) must not intersect another non-terminal case of the product (adjacent is allowed)"
    roles: [RegistrationReviewer]
    code: 201
    input: [product_id, opened_at, "due_at?"]
    output: RegistrationReviewCase
    side_effects: ["cycle_number := 1 + existing case count"]

  - method: GET
    path: "/pesticide-registry/registration-review-cases/{id}"
    description: "Get a review case"
    roles: *all_roles
    code: 200
    input: []
    output: RegistrationReviewCase
    side_effects: []

  - method: POST
    path: "/pesticide-registry/registration-review-cases/{id}/complete"
    description: "Complete an OPEN/UNDER_REVIEW case with no outstanding DCIs; auto-schedules the next cycle"
    roles: [RegistrationReviewer]
    code: 200
    input: ["completion_summary?"]
    output: RegistrationReviewCase
    side_effects: ["completed_at := clock; product UNDER_REVIEW -> REGISTERED when last case closes; next cycle SCHEDULED"]

  - method: GET
    path: "/pesticide-registry/registration-review-cases/{id}/data-call-ins"
    description: "List the case's data call-ins"
    roles: *all_roles
    code: 200
    input: []
    output: "DataCallIn[]"
    side_effects: []

  # --- Data Call-Ins ---
  - method: POST
    path: "/pesticide-registry/data-call-ins"
    description: "Issue a data call-in against an OPEN or UNDER_REVIEW case (case -> DCI_PENDING)"
    roles: [RegistrationReviewer]
    code: 201
    input: [review_case_id, required_study_types, response_deadline]
    output: DataCallIn
    side_effects: ["case -> DCI_PENDING"]

  - method: GET
    path: "/pesticide-registry/data-call-ins/{id}"
    description: "Get a data call-in including computed satisfied/pending/outstanding study types"
    roles: *all_roles
    code: 200
    input: []
    output: DataCallIn
    side_effects: []

  - method: POST
    path: "/pesticide-registry/data-call-ins/{id}/respond"
    description: "Respond to a DCI with DCI-linked studies (allowed from ISSUED/RESPONDED/DEFICIENT/DELINQUENT)"
    roles: [RegistrantRepresentative]
    code: 200
    input: [study_submission_ids]
    output: DataCallIn
    side_effects: ["dci_obligation_reconciliation auto-transitions"]

  # --- Cancellation / Suspension Proceedings ---
  - method: POST
    path: "/pesticide-registry/cancellation-proceedings"
    description: "Open a proceeding against a REGISTERED/UNDER_REVIEW/SUSPENDED product; one non-terminal proceeding per product via this endpoint"
    roles: [RegistrationReviewer]
    code: 201
    input: [product_id, proceeding_type, reason]
    output: CancellationProceeding
    side_effects: []

  - method: GET
    path: "/pesticide-registry/cancellation-proceedings"
    description: "List proceedings"
    roles: *all_roles
    code: 200
    input: ["product_id?", "proceeding_type?", "status?", "limit?", "offset?"]
    output: "CancellationProceeding[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/cancellation-proceedings/{id}"
    description: "Get a proceeding"
    roles: *all_roles
    code: 200
    input: []
    output: CancellationProceeding
    side_effects: []

  - method: POST
    path: "/pesticide-registry/cancellation-proceedings/{id}/hear"
    description: "Hold the hearing (CANCELLATION only): INITIATED -> HEARING_HELD"
    roles: [RegistrationReviewer]
    code: 200
    input: ["hearing_notes?"]
    output: CancellationProceeding
    side_effects: ["hearing_held_at := clock"]

  - method: POST
    path: "/pesticide-registry/cancellation-proceedings/{id}/issue-order"
    description: "Issue the order: CANCELLATION from HEARING_HELD (stocks provision required), SUSPENSION from INITIATED (stocks forbidden); SoD vs initiated_by_ref"
    roles: [RegistrationReviewer]
    code: 200
    input: ["existing_stocks_authorized_units?", "stocks_method?", "depletion_rate_units_per_month?"]
    output: CancellationProceeding
    side_effects: ["effective_at, deadlines computed; product cascade per state machine"]

  - method: POST
    path: "/pesticide-registry/cancellation-proceedings/{id}/vacate"
    description: "Vacate a proceeding; from EFFECTIVE CANCELLATION restores product/tolerances/use-sites (not state registrations); from EFFECTIVE SUSPENSION leaves the product SUSPENDED"
    roles: [RegistrationReviewer]
    code: 200
    input: [vacatur_reason]
    output: CancellationProceeding
    side_effects: ["vacatur restore rules per state machine"]

  - method: POST
    path: "/pesticide-registry/cancellation-proceedings/{id}/existing-stocks-disposals"
    description: "Record an existing-stocks disposal (SALE/RETURN within the sale window, DESTRUCTION within the use window, quantity within authorized)"
    roles: [RegistrationReviewer]
    code: 200
    input: [units, method]
    output: CancellationProceeding
    side_effects: ["disposal appended; existing_stocks_disposed_units recomputed"]

  # --- State Registrations ---
  - method: POST
    path: "/pesticide-registry/state-registrations"
    description: "Apply for state registration of a REGISTERED product owned by the registrant; one non-terminal row per (product, state)"
    roles: [RegistrantRepresentative]
    code: 201
    input: [product_id, state_code]
    output: StateRegistration
    side_effects: []

  - method: GET
    path: "/pesticide-registry/state-registrations"
    description: "List state registrations"
    roles: *all_roles
    code: 200
    input: ["product_id?", "state_code?", "status?", "limit?", "offset?"]
    output: "StateRegistration[]"
    side_effects: []

  - method: GET
    path: "/pesticide-registry/state-registrations/{id}"
    description: "Get a state registration"
    roles: *all_roles
    code: 200
    input: []
    output: StateRegistration
    side_effects: []

  - method: POST
    path: "/pesticide-registry/state-registrations/{id}/review-decisions"
    description: "State decision: GRANT (re-checks product REGISTERED; RUP requires a valid certification in that state; stamps fees and renewal_due_at) or DENY"
    roles: [StateLeadAgency]
    code: 200
    input: [decision, "additional_restrictions?"]
    output: StateRegistration
    side_effects: ["grant stamps annual_fee_cents, granted_at, renewal_due_at, additional_restrictions"]

  - method: POST
    path: "/pesticide-registry/state-registrations/{id}/revoke"
    description: "Revoke a GRANTED or LAPSED state registration"
    roles: [StateLeadAgency]
    code: 200
    input: ["reason?"]
    output: StateRegistration
    side_effects: []

  - method: POST
    path: "/pesticide-registry/state-registrations/{id}/renew"
    description: "Renew a GRANTED or LAPSED registration; exact fee per state_registration_renewal_fee; renewal_due_at advances 365 days from its previous value"
    roles: [RegistrantRepresentative]
    code: 200
    input: [payment_cents]
    output: StateRegistration
    side_effects: ["renewal_due_at, last_renewal_at, renewal_count updated; LAPSED -> GRANTED"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  # --- Authn/Authz/ownership ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the six declared roles" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not listed for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "RegistrantRepresentative acting on a resource whose Product.registrant_ref != X-User-ID" }
  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic: referenced resource id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "RegistrationApplication id does not exist" }
  - { id: ERR_STATE_REGISTRATION_NOT_FOUND, http: 404, condition: "StateRegistration id does not exist" }
  # --- Request schema ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, type mismatch, invalid enum member, violated conditional requiredness, non-monotonic clock set, or other schema-level failure" }
  # --- Concurrency ---
  - { id: ERR_STALE_PRODUCT_VERSION, http: 412, condition: "expected_product_version != Product.version on label-amendment creation" }
  # --- State ---
  - { id: ERR_APPLICATION_NOT_SUBMITTABLE, http: 409, condition: "submit called on an application not in DRAFT or DATA_DEFICIENCY" }
  - { id: ERR_APPLICATION_NOT_IN_REVIEW, http: 409, condition: "review-decision or risk assessment requires IN_REVIEW (assessments also allow DATA_DEFICIENCY); withdraw/decision on terminal application" }
  - { id: ERR_APPLICATION_ALREADY_DECIDED, http: 409, condition: "withdraw or new study against an APPROVED/DENIED/WITHDRAWN application" }
  - { id: ERR_PRODUCT_NOT_UNREGISTERED, http: 409, condition: "First submit requires the product UNREGISTERED" }
  - { id: ERR_PRODUCT_NOT_REGISTERED, http: 409, condition: "Operation requires the product REGISTERED (or REGISTERED/UNDER_REVIEW where stated) and it is not" }
  - { id: ERR_PRODUCT_TERMINAL, http: 409, condition: "Operation forbidden because the product is CANCELLED" }
  - { id: ERR_PRODUCT_NOT_SUSPENDED, http: 409, condition: "reinstate called on a product not SUSPENDED" }
  - { id: ERR_REINSTATEMENT_BLOCKED, http: 409, condition: "reinstate blocked by an EFFECTIVE proceeding or an unsatisfied/delinquent DCI" }
  - { id: ERR_STUDY_NOT_DECIDABLE, http: 409, condition: "study review-decision on a study not in RECEIVED" }
  - { id: ERR_AMENDMENT_NOT_PENDING, http: 409, condition: "amendment decision/withdraw on a non-SUBMITTED amendment" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "DCI issuance requires the case OPEN or UNDER_REVIEW" }
  - { id: ERR_CASE_NOT_COMPLETABLE, http: 409, condition: "complete requires the case OPEN or UNDER_REVIEW" }
  - { id: ERR_DCI_OUTSTANDING, http: 409, condition: "complete blocked by a DCI in ISSUED/RESPONDED/DEFICIENT/DELINQUENT" }
  - { id: ERR_DCI_NOT_RESPONDABLE, http: 409, condition: "respond called on a SATISFIED DCI" }
  - { id: ERR_PROCEEDING_INVALID_STEP, http: 409, condition: "hear/issue-order/vacate/disposal not valid from the proceeding's current status or type; disposal on a proceeding without a stocks provision" }
  - { id: ERR_STATE_REG_NOT_DECIDABLE, http: 409, condition: "state decision/revoke/renew not valid from the registration's current status" }
  - { id: ERR_BULLETIN_NOT_LIFTABLE, http: 409, condition: "lift called on a bulletin not IN_EFFECT" }
  # --- Business safety ---
  - { id: ERR_RATE_EXCEEDS_SAFETY_CAP, http: 422, condition: "A proposed or amended rate exceeds ABSOLUTE_RATE_CAP_LBS_ACRE (8.0 lbs/acre)" }
  - { id: ERR_ESA_PROHIBITION_CONFLICT, http: 422, condition: "Amendment conflicts with an IN_EFFECT endangered-species bulletin (PROHIBITED blocks NEW_USE; RATE_CAP caps new rates)" }
  - { id: ERR_NO_VALID_APPLICATOR_CERTIFICATION, http: 422, condition: "GRANT of a RESTRICTED_USE product without an ACTIVE certification in that state with certified_until >= clock" }
  - { id: ERR_MISSING_REQUIRED_STUDIES, http: 422, condition: "Required study types for the use pattern not present (submit) or not ACCEPTED (approve)" }
  - { id: ERR_NO_RISK_ASSESSMENT, http: 422, condition: "APPROVE without any RiskAssessment on the application" }
  - { id: ERR_LOC_EXCEEDED, http: 422, condition: "APPROVE while the latest RiskAssessment has level_of_concern_exceeded true" }
  - { id: ERR_NO_PROPOSED_TOLERANCE, http: 422, condition: "APPROVE of a FOOD_USE/MIXED_USE application without a PROPOSED tolerance" }
  # --- Business constraint ---
  - { id: ERR_DUPLICATE_OPEN_APPLICATION, http: 409, condition: "Submit while another application of the product is in DRAFT/IN_REVIEW/DATA_DEFICIENCY" }
  - { id: ERR_DUPLICATE_TOLERANCE, http: 409, condition: "A PROPOSED or ESTABLISHED tolerance already exists for (product, commodity_code)" }
  - { id: ERR_BULLETIN_WINDOW_OVERLAP, http: 409, condition: "An IN_EFFECT bulletin for the same product+county shares a calendar month with the proposed window" }
  - { id: ERR_REVIEW_CASE_WINDOW_OVERLAP, http: 409, condition: "Proposed half-open [opened_at, due_at) intersects a non-terminal case of the same product" }
  - { id: ERR_DUPLICATE_STATE_REGISTRATION, http: 409, condition: "A SUBMITTED/GRANTED/LAPSED registration already exists for (product, state_code)" }
  - { id: ERR_DUPLICATE_OPEN_PROCEEDING, http: 409, condition: "Manual create while another proceeding of the product is INITIATED/HEARING_HELD/EFFECTIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver is the assessor of the latest RiskAssessment, or order issuer is the proceeding's initiated_by_ref" }
  - { id: ERR_EXISTING_STOCKS_QUANTITY_EXCEEDED, http: 422, condition: "Disposal would push disposed units past existing_stocks_authorized_units" }
  # --- Business referential ---
  - { id: ERR_STUDY_PARENT_MISMATCH, http: 400, condition: "Study's application/DCI does not belong to the acting registrant's product, or a respond references a study linked to a different DCI" }
  - { id: ERR_USE_SITE_PRODUCT_MISMATCH, http: 400, condition: "Amendment payload's use_site_id belongs to a different product" }
  - { id: ERR_UNKNOWN_COMMODITY, http: 422, condition: "commodity_code absent from CONSUMPTION_G_DAY" }
  # --- Business temporal ---
  - { id: ERR_EXISTING_STOCKS_WINDOW_CLOSED, http: 422, condition: "Disposal after allow_use_until, or SALE/RETURN after allow_sale_until" }
  - { id: ERR_CERTIFICATION_RENEWAL_INVALID, http: 400, condition: "new_certified_until not strictly after the logical clock" }
  # --- Business fiscal ---
  - { id: ERR_INCORRECT_FEE_PAYMENT, http: 402, condition: "payment_cents differs from the computed fee (first submit or renewal)" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: SystemAdministrator
    description: "Platform operator; owns the logical clock and active-ingredient reference data"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /pesticide-registry/active-ingredients"
    shared_operations: ["all GET endpoints"]

  - name: RegistrantRepresentative
    description: "Applicant company representative; owns products (via registrant_ref == X-User-ID) and files applications, studies, tolerances, amendments, DCI responses, state applications and renewals"
    identity: opaque
    exclusive_operations:
      - "POST /pesticide-registry/products"
      - "POST /pesticide-registry/registration-applications"
      - "POST /pesticide-registry/registration-applications/{id}/submit"
      - "POST /pesticide-registry/registration-applications/{id}/withdraw"
      - "POST /pesticide-registry/study-submissions"
      - "POST /pesticide-registry/tolerances"
      - "POST /pesticide-registry/label-amendments"
      - "POST /pesticide-registry/label-amendments/{id}/withdraw"
      - "POST /pesticide-registry/data-call-ins/{id}/respond"
      - "POST /pesticide-registry/state-registrations"
      - "POST /pesticide-registry/state-registrations/{id}/renew"
    shared_operations: ["all GET endpoints"]

  - name: RegistrationReviewer
    description: "EPA registration division reviewer; decides applications and amendments, issues bulletins/cases/DCIs, runs proceedings, reinstates products"
    identity: opaque
    exclusive_operations:
      - "POST /pesticide-registry/registration-applications/{id}/review-decisions"
      - "POST /pesticide-registry/label-amendments/{id}/review-decisions"
      - "POST /pesticide-registry/endangered-species-bulletins"
      - "POST /pesticide-registry/endangered-species-bulletins/{id}/lift"
      - "POST /pesticide-registry/registration-review-cases"
      - "POST /pesticide-registry/registration-review-cases/{id}/complete"
      - "POST /pesticide-registry/data-call-ins"
      - "POST /pesticide-registry/cancellation-proceedings"
      - "POST /pesticide-registry/cancellation-proceedings/{id}/hear"
      - "POST /pesticide-registry/cancellation-proceedings/{id}/issue-order"
      - "POST /pesticide-registry/cancellation-proceedings/{id}/vacate"
      - "POST /pesticide-registry/cancellation-proceedings/{id}/existing-stocks-disposals"
      - "POST /pesticide-registry/products/{id}/reinstate"
    shared_operations: ["all GET endpoints"]

  - name: RiskAssessor
    description: "EPA risk assessment branch scientist; runs risk assessments and decides study acceptability (segregated from approval authority)"
    identity: opaque
    exclusive_operations:
      - "POST /pesticide-registry/risk-assessments"
      - "POST /pesticide-registry/study-submissions/{id}/review-decisions"
    shared_operations: ["all GET endpoints"]

  - name: StateLeadAgency
    description: "State pesticide lead agency; grants/denies/revokes state registrations and sets additional state restrictions"
    identity: opaque
    exclusive_operations:
      - "POST /pesticide-registry/state-registrations/{id}/review-decisions"
      - "POST /pesticide-registry/state-registrations/{id}/revoke"
    shared_operations: ["all GET endpoints"]

  - name: CertificationAuthority
    description: "State/tribal certification authority; issues and renews applicator certifications"
    identity: opaque
    exclusive_operations:
      - "POST /pesticide-registry/applicator-certifications"
      - "POST /pesticide-registry/applicator-certifications/{id}/renew"
    shared_operations: ["all GET endpoints"]
