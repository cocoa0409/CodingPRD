      - name: reclassification_forces_investigation_back_to_unassigned
        grounds:
          - state_machines.Complaint.CLASSIFIED_to_CLASSIFIED
          - calculations.investigation_window
          - calculations.complaint_classification_and_routing
          - entities.Investigation.fields.required_certification_level
          - entities.Officer.fields.open_case_load
        distinguishing_aspect: |
          Overriding a CLASS_III complaint to CLASS_I in one classify call cascades three levels
          deep: the investigation's statutory_days moves 90 to 180 with due_at recomputed from
          received_at to 2027-01-28, the required certification rises 1 to 3 above the assignee's
          level so the investigation is forced back to UNASSIGNED, and the former assignee's
          open_case_load falls from 1 to 0 - and the routing target moves from the subject unit to
          internal affairs in the same request.
        test_recipe:
          setup:
            - "A CLASS_III DISCOURTESY complaint from the PUBLIC channel was received at 2026-08-01T00:00:00Z, routed to the subject patrol unit because it has intake_enabled true, and has one allegation."
            - "Its Investigation has statutory_days 90, due_at 2026-10-30T00:00:00Z and required_certification_level 1, and is ASSIGNED to Investigator Bell, whose certification_level is 1 and whose open_case_load is therefore 1."
            - "No interview has been scheduled, so the investigation is still in ASSIGNED."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-201", full_name: "Investigator Bell", rank: "OFFICER", assignment_type: "INVESTIGATIVE", annual_salary_cents: 9500000, demographic_code: "DG_D", hire_date: "2021-08-30T00:00:00Z", is_investigator: true, certification_level: 1, max_case_load: 2 }
              as: SystemAdmin
              captures: { inv_b_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", narrative: "Officer was rude during a traffic stop.", incident_datetime: "2026-07-25T14:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Dana Whitfield", complainant_contact: "dana@example.com", complainant_demographic_code: "DG_B" }
              as: Complainant
              captures: { c1_id: $.data.id, c1_class: $.data.classification, c1_priority: $.data.priority, c1_assigned_unit: $.data.assigned_unit_id }
            - call: "POST /complaints/${c1_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "DISCOURTESY", narrative: "Profanity used toward the driver.", offense_class: "D" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/investigations"
              payload: { opening_note: "Minor complaint file." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_id: $.data.id, i1_v: $.data.version, i1_statutory: $.data.statutory_days, i1_due: $.data.due_at, i1_required_cert: $.data.required_certification_level }
            - call: "POST /investigations/${i1_id}/assignments"
              payload: { expected_investigation_version: "${i1_v}", investigator_officer_id: "${inv_b_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { assigned_status: $.data.status, assigned_to: $.data.assigned_investigator_officer_id }
            - call: "GET /officers/${inv_b_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { load_before: $.data.open_case_load }
          trigger:
            - call: "POST /complaints/${c1_id}/classify"
              payload: { screening_outcome: "ACCEPT", classification_override: "CLASS_I" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { new_class: $.data.classification, new_priority: $.data.priority, new_unit: $.data.assigned_unit_id, recount: $.data.reclassification_count, complaint_status: $.data.status }
          assert:
            - "${c1_class} == CLASS_III, ${c1_priority} == 3 and ${c1_assigned_unit} == ${patrol_unit_id}"
            - "${i1_statutory} == 90, ${i1_due} == 2026-10-30T00:00:00Z and ${i1_required_cert} == 1"
            - "${assigned_status} == ASSIGNED, ${assigned_to} == ${inv_b_id} and ${load_before} == 1"
            - "${new_class} == CLASS_I, ${new_priority} == 1, ${recount} == 1"
            - "${new_unit} == ${ia_unit_id} (a Class I complaint is never investigated by the subject unit)"
            - "${complaint_status} == UNDER_INVESTIGATION (the reclassification self-loop does not rewind the complaint lifecycle)"
            - "cascade level 1 - Investigation.${i1_id}.statutory_days == 180 and Investigation.${i1_id}.required_certification_level == 3"
            - "cascade level 1 - Investigation.${i1_id}.due_at == 2027-01-28T00:00:00Z, recomputed from received_at rather than from the previous due_at"
            - "cascade level 2 - Investigation.${i1_id}.status == UNASSIGNED and Investigation.${i1_id}.assigned_investigator_officer_id is null"
            - "cascade level 3 - Officer.${inv_b_id}.open_case_load == 0"
            - "Investigation.${i1_id}.tolled_days == 0 and Investigation.${i1_id}.assignment_count == 1"

