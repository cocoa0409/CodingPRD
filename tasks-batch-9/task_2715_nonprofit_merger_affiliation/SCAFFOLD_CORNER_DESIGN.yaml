            - "Restructuring.${deal}.unresolved_restricted_fund_count == 0"
            - "Restructuring.${deal}.restricted_asset_posture == CLEARED"

      - name: clearing_a_finding_that_was_never_responded_to_is_refused
        claim_type: invalid_transitions
        grounds:
          - state_machines.DiligenceRequest.RESPONDED_to_CLEARED
          - validations.priority_22_ERR_INVALID_DILIGENCE_STATE
        distinguishing_aspect: |
          clear is declared only from RESPONDED, so an OPEN finding cannot be closed
          however impeccable the clearing lead's segregation of duties. The rejection
          must come from the diligence state rule at priority 22 and must leave the
          deal in DILIGENCE - a bubble-up that fired on a refused clear would close
          diligence on an unanswered question. The same call succeeds unchanged once a
          response is on file, which isolates the state gate from the SoD gate.
        test_recipe:
          setup:
            - "A Restructuring in DILIGENCE with exactly one OPEN FINANCE finding raised by dl-001"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
