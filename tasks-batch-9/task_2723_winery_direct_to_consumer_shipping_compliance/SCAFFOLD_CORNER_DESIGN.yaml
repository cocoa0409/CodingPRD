      - name: cascade_down_from_permit_revocation_to_orders_and_subscriptions
        claim_type: cascade_down
        grounds:
          - state_machines.StatePermit.ACTIVE_to_REVOKED
          - state_machines.Order.CLEARED_to_SUSPENDED_PERMIT
          - state_machines.ClubSubscription.ACTIVE_to_SUSPENDED_COMPLIANCE
        excluded_because:
          difficulty_instance: transitive_cascade / permit_revoke_three_hop_cascade_to_winery_counter
          rationale: "The named \u00a71.8 instance walks the whole downward cascade \u2014 permit -> order -> subscription -> winery counter \u2014 and asserts each hop's fields, so a separate cascade_down corner would be a duplicate."
      - name: conditional_cascade_skips_orders_that_already_shipped
        claim_type: conditional_cascade
        grounds:
          - state_machines.Order.CLEARED_to_SUSPENDED_PERMIT
          - entities.Order.fields.fulfillment_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_parallel_dimensions_compliance_and_fulfillment_independent
          rationale: "The named \u00a71.8 instance revokes a permit while one order is IN_TRANSIT and another UNFULFILLED, asserting that only the UNFULFILLED one is suspended \u2014 exactly the conditional-cascade claim."
      - name: parallel_dimensions_change_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Order.dimension.compliance_status
          - state_machines.Order.dimension.fulfillment_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_parallel_dimensions_compliance_and_fulfillment_independent
          rationale: "The shape claim for the two-dimensional Order is the whole point of the named \u00a71.8 instance, which pins both dimensions before and after the trigger."
      - name: return_to_sender_compensation_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_RETURNED
          - entities.Order.fields.excise_reversed_cents
          - entities.VolumeLedgerEntry.fields.event_type
        excluded_because:
          difficulty_instance: compensating_invariant / liters_ledger_nets_to_zero_on_return_and_is_re_debited_on_reship
          rationale: "The named \u00a71.8 instance asserts the netting to 0.000, the money reversal and the absence of drift after the reship, which is the compensation pattern in full."

