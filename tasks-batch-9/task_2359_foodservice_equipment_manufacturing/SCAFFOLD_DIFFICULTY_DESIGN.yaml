  - rule_id: compensating_invariant
    instances:
      - name: build_line_committed_units_reconciles_with_active_slots_after_cancellation
        grounds:
          - entities.BuildLine.fields.committed_units
          - endpoints["POST /production-slots"].side_effects
          - endpoints["POST /production-slots/{id}/cancellation"].side_effects
          - state_machines.ProductionSlot.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: BuildLine.committed_units must always equal the sum of ProductionSlot
          .units over that line's slots in {RESERVED, CONFIRMED, IN_BUILD}. Cancelling the larger of
          two reservations must decrement by exactly that slot's units and leave the other
          reservation untouched, and cancelling the second must land the ledger back on 0 -- no
          double-decrement and no drift, verified against the reconstructed sum rather than a
          hardcoded delta.
