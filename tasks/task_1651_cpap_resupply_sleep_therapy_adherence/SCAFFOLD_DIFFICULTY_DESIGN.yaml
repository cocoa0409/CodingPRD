              as: OpsAdmin
              captures: { pp16: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Sixteen", date_of_birth: "1974-07-07", payer_policy_id: "${pp16}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat16: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat16}", device_serial: "SN-016", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { de16: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de16}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de16}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat16}", component_type: "MASK" }
              as: OpsAdmin
              captures: { mask16: "$.data[0].id" }
            # --- Window 1 (anchor 2026-08-01): exchange A completes 2026-08-10 ---
            - call: "POST /sleep-therapy/mask-exchanges"
              payload: { patient_id: "${pat16}", device_enrollment_id: "${de16}", original_mask_plan_id: "${mask16}", reason_code: "FIT_LEAK" }
              as: IntakeCoordinator
              captures: { meA: $.data.id, meA_anchor: $.data.window_anchor_on }
            - call: "POST /sleep-therapy/mask-exchanges/${meA}/approve"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/mask-exchanges/${meA}/ship"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges/${meA}/complete"
              payload: {}
              as: IntakeCoordinator
            # --- Window 1 (anchor still 2026-08-01): exchange B completes 2026-08-15 ---
            - call: "POST /sleep-therapy/mask-exchanges"
              payload: { patient_id: "${pat16}", device_enrollment_id: "${de16}", original_mask_plan_id: "${mask16}", reason_code: "WRONG_SIZE" }
              as: IntakeCoordinator
              captures: { meB: $.data.id, meB_anchor: $.data.window_anchor_on }
            - call: "POST /sleep-therapy/mask-exchanges/${meB}/approve"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/mask-exchanges/${meB}/ship"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges/${meB}/complete"
              payload: {}
              as: IntakeCoordinator
            # --- Window 1 expired 2026-08-31; exchange C requested 2026-09-05 rolls anchor to B.completed_on=2026-08-15 ---
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges"
              payload: { patient_id: "${pat16}", device_enrollment_id: "${de16}", original_mask_plan_id: "${mask16}", reason_code: "SKIN_IRRITATION" }
              as: IntakeCoordinator
              captures: { meC: $.data.id, meC_anchor: $.data.window_anchor_on }
            - call: "POST /sleep-therapy/mask-exchanges/${meC}/approve"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/mask-exchanges/${meC}/ship"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges/${meC}/complete"
              payload: {}
              as: IntakeCoordinator
            # --- Exchange D requested in same window as C (anchor 2026-08-15); only C has completed here (1 < 2) ---
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/mask-exchanges"
              payload: { patient_id: "${pat16}", device_enrollment_id: "${de16}", original_mask_plan_id: "${mask16}", reason_code: "PRESSURE_INTOLERANCE" }
              as: IntakeCoordinator
              captures: { meD: $.data.id, meD_anchor: $.data.window_anchor_on }
          trigger:
            - call: "POST /sleep-therapy/mask-exchanges/${meD}/approve"
              payload: {}
              as: RespiratoryTherapist
              captures: { meD_status: $.data.exchange_status }
            - call: "GET /sleep-therapy/mask-exchanges/${meA}"
              payload: {}
              as: OpsAdmin
              captures: { meA_sup: $.data.superseded_by_exchange_id }
            - call: "GET /sleep-therapy/mask-exchanges/${meB}"
              payload: {}
              as: OpsAdmin
              captures: { meB_sup: $.data.superseded_by_exchange_id }
          assert:
            - "MaskExchange.${meA}.window_anchor_on == '2026-08-01'   # first exchange anchored at setup_completed_on"
            - "MaskExchange.${meB}.window_anchor_on == '2026-08-01' (${meB_anchor})   # window still open -> anchor stays fixed"
            - "MaskExchange.${meC}.window_anchor_on == '2026-08-15' (${meC_anchor})   # window 1 expired -> anchor rolled to B.completed_on"
            - "MaskExchange.${meD}.window_anchor_on == '2026-08-15' (${meD_anchor})   # same window as C"
            - "MaskExchange.${meA}.superseded_by_exchange_id == ${meB}   # A superseded by B (${meA_sup})"
            - "MaskExchange.${meB}.superseded_by_exchange_id == ${meC}   # B superseded by C (${meB_sup})"
            - "approve of D succeeds: ${meD_status} == 'APPROVED'   # C's window has 1 prior completion (< max=2)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: ≥2 instances on DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: patient_balance_invariant_on_invoice_vs_return
        grounds:
          - calculations.outstanding_balance_aggregation
          - calculations.patient_coinsurance_share
          - entities.Patient.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Patient.outstanding_balance_cents. Invariant:
          outstanding_balance_cents == SUM(patient_responsibility_cents over
          INVOICED orders). Forward action (invoice) increments by the computed
          share; compensating action (mark-returned on a DELIVERED order BEFORE
          invoice) leaves the balance unchanged. DELIVERED -> RETURNED must not
          add to outstanding_balance_cents.
        test_recipe:
          setup:
            - "PayerPolicy p1; Patient pat17 PURCHASE setup complete"
            - "ResupplyOrder ro17 created/cleared/authorized/shipped/delivered; not yet invoiced"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 3, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
              as: OpsAdmin
              captures: { pp17: $.data.id }
            - call: "POST /sleep-therapy/patients"
              payload: { full_name: "Pat Seventeen", date_of_birth: "1966-04-18", payer_policy_id: "${pp17}", prescribing_clinician_npi: "1234567890" }
              as: IntakeCoordinator
              captures: { pat17: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat17}", device_serial: "SN-017", device_model: "Airsense-11", acquisition_type: "PURCHASE" }
              as: IntakeCoordinator
              captures: { de17: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de17}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de17}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat17}", component_type: "FILTER" }
              as: OpsAdmin
              captures: { filt17: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pat17}"
              payload: {}
              as: OpsAdmin
              captures: { pat17_v1: $.data.version, pat17_bal0: $.data.outstanding_balance_cents }
            - call: "POST /sleep-therapy/resupply-orders"
              payload: { patient_id: "${pat17}", component_supply_plan_id: "${filt17}", requested_quantity: 1, expected_patient_version: "${pat17_v1}" }
              as: IntakeCoordinator
              captures: { ro17: $.data.id }
            - call: "POST /sleep-therapy/resupply-orders/${ro17}/clinical-clear"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/resupply-orders/${ro17}/authorize"
              payload: { expected_patient_version: "${pat17_v1}" }
              as: BillingSpecialist
            - call: "GET /sleep-therapy/patients/${pat17}"
              payload: {}
              as: OpsAdmin
              captures: { pat17_v2: $.data.version }
            - call: "POST /sleep-therapy/resupply-orders/${ro17}/ship"
              payload: { expected_patient_version: "${pat17_v2}" }
              as: IntakeCoordinator
            - call: "POST /sleep-therapy/resupply-orders/${ro17}/mark-delivered"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /sleep-therapy/patients/${pat17}"
              payload: {}
              as: OpsAdmin
              captures: { pat17_bal_pre_return: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /sleep-therapy/resupply-orders/${ro17}/mark-returned"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /sleep-therapy/patients/${pat17}"
              payload: {}
              as: OpsAdmin
              captures: { pat17_bal_post_return: $.data.outstanding_balance_cents }
          assert:
            - "balance before delivery: ${pat17_bal0} == 0"
            - "balance after delivery (pre-invoice): ${pat17_bal_pre_return} == 0"
            - "balance after mark-returned: ${pat17_bal_post_return} == ${pat17_bal_pre_return}   # compensating action invariant: RETURNED before INVOICED adds zero"

      - name: rental_months_billed_invariant_on_pause_resume_cycle
        grounds:
          - calculations.rental_month_accrual_dual_variant
          - state_machines.RentalContract
          - entities.RentalContract.fields.rental_months_billed
        distinguishing_aspect: |
          Conserved quantity = RentalContract.rental_months_billed. Invariant:
          a NON_COMPLIANT_HOLD pause followed by an ACTIVE_THERAPY resume must
          leave rental_months_billed unchanged — the pause/resume pair is
          compensating with respect to the billed-month counter. Any drift
          (e.g., billing during pause) violates the invariant.
        test_recipe:
          setup:
            - "PayerPolicy p1 rental_months_to_own=5; Patient pat18 RENTAL setup 2026-08-01; rc18 created"
            - "Advance to 2026-09-01; sweep; bill month 1 (rental_months_billed=1)"
            - "Capture rental_months_billed before pause"
            - "Finalize non-compliant report -> PAUSED_NON_COMPLIANCE"
            - "Finalize compliant report -> BILLING"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/payer-policies"
              payload: { payer_name: "Payer A", plan_code: "PAYER-A", compliance_threshold_pct: 70, compliance_min_hours_per_night: 4.0, compliance_window_days: 30, compliance_min_nights: 21, rental_months_to_own: 5, mask_cadence_days: 90, cushion_cadence_days: 30, filter_cadence_days: 14, tubing_cadence_days: 90, mask_exchange_window_days: 30, max_exchanges_per_window: 1, requires_prior_auth: false }
