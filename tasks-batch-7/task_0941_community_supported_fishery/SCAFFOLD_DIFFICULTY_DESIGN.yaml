scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: prepaid_vs_installment_commitment_diverge
        grounds:
          - calculations.subscription_commitment_total
          - calculations.promised_delivery_count
          - entities.Subscription.fields.commitment_cents
          - entities.Subscription.fields.price_per_delivery_cents
          - entities.Subscription.fields.payment_basis
        distinguishing_aspect: |
          This dual variant lives on the Subscription entity domain: two subscriptions on the
          same SharePlan joining at the same week 11 receive commitment_cents 45000 against
          82800 and price_per_delivery_cents 4500 against 4140, while promised_delivery_count
          is 10 on both, because the installment branch prorates onto remaining deliveries and
          the prepaid branch charges the full-season count at a discounted unit price.
        test_recipe:
          setup:
            - "one OPEN season CSF-2026 with 20 weeks starting 2026-05-04T00:00:00Z"
            - "one SharePlan MEDIUM x PREMIUM_FINFISH x WEEKLY priced at 4500 cents per delivery"
            - "one pickup hub and two distinct members"
            - "two PENDING subscriptions on that plan, both joining at week 11, one INSTALLMENT and one PREPAID_FULL_SEASON"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD", "HADDOCK", "HALIBUT", "SALMON", "LOBSTER"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
              captures: { plan_med_id: $.data.id }
            - call: "POST /csf/pickup-hubs"
              payload: { hub_code: "HUB-A", cooler_slots_default: 4, grace_minutes: 90 }
              as: CsfAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /csf/members"
              payload: { full_name: "Mara One", email: "m1@csf.test" }
              as: CsfAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /csf/members"
              payload: { full_name: "Nils Two", email: "m2@csf.test" }
              as: CsfAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
          trigger:
            - call: "POST /csf/subscriptions"
              payload: { member_id: "${m1_id}", share_plan_id: "${plan_med_id}", season_id: "${season_id}", fulfillment_mode: "HUB_PICKUP", payment_basis: "INSTALLMENT", join_week_index: 11, pickup_hub_id: "${hub_id}" }
              as: CsfAdmin
              captures: { sub_inst_id: $.data.id }
            - call: "POST /csf/subscriptions"
              payload: { member_id: "${m2_id}", share_plan_id: "${plan_med_id}", season_id: "${season_id}", fulfillment_mode: "HUB_PICKUP", payment_basis: "PREPAID_FULL_SEASON", join_week_index: 11, pickup_hub_id: "${hub_id}" }
              as: CsfAdmin
              captures: { sub_prep_id: $.data.id }
          assert:
            - "SharePlan.${plan_med_id}.price_per_delivery_cents == 4500"
            - "SharePlan.${plan_med_id}.scheduled_delivery_count == 20"
            - "SharePlan.${plan_med_id}.target_pounds_per_delivery == 5.00"
            - "Subscription.${sub_inst_id}.price_per_delivery_cents == 4500"
            - "Subscription.${sub_inst_id}.commitment_cents == 45000"
            - "Subscription.${sub_inst_id}.promised_delivery_count == 10"
            - "Subscription.${sub_prep_id}.price_per_delivery_cents == 4140"
            - "Subscription.${sub_prep_id}.commitment_cents == 82800"
            - "Subscription.${sub_prep_id}.promised_delivery_count == 10"

      - name: settlement_holdback_provisional_vs_final
        grounds:
          - calculations.settlement_holdback
          - calculations.vendor_settlement_gross
          - entities.SettlementStatement.fields.net_payable_cents
          - entities.SettlementStatement.fields.variant
          - state_machines.SettlementStatement.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          This dual variant lives on the SettlementStatement entity domain, not on Subscription:
          the identical lot yields net_payable_cents 6048 under the PROVISIONAL variant, which
          withholds the whole 914 cent holdback, and 6962 under the FINAL variant, which
          releases it once the lot's quality_status is CLEAR.
        test_recipe:
          setup:
            - "an OPEN season with one share plan so the season could be opened"
            - "a COMPLIANT vessel with a COD entitlement of 500.00 lb in area GOM-2"
            - "a trip landed with 10.04 lb of COD at 850 cents per pound ex-vessel and 12 offload minutes, giving a GREEN band"
            - "the trip verified as accepted so settlement creation is permitted"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD", "SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "COD", management_area: "GOM-2", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_cod_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_cod_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "COD", landed_pounds_gross: 10.04, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/verify"
              payload: { accepted: true }
              as: CsfAdmin
              captures: { trip_v: $.data.version }
          trigger:
            - call: "POST /csf/trips/${trip_id}/settlements"
              payload: { expected_trip_version: "${trip_v}" }
              as: CsfAdmin
              captures: { stmt_id: $.data.id }
            - call: "POST /csf/settlement-statements/${stmt_id}/finalize"
              payload: {}
              as: CsfAdmin
          assert:
            - "LandingLot.${lot_id}.landed_pounds_net == 10.04"
            - "SettlementStatement.${stmt_id}.gross_cents == 9136"
            - "SettlementStatement.${stmt_id}.holdback_cents == 914"
            - "SettlementStatement.${stmt_id}.net_payable_cents == 6962"
            - "SettlementStatement.${stmt_id}.holdback_released_cents == 914"
            - "SettlementStatement.${stmt_id}.holdback_forfeited_cents == 0"
            - "SettlementStatement.${stmt_id}.offset_cents == 0"
            - "SettlementStatement.${stmt_id}.variant == FINAL"
            - "SettlementStatement.${stmt_id}.status == FINAL"
            - "the settlement create response, read before finalize, carried variant PROVISIONAL and net_payable_cents 6048"

  - rule_id: combinatorial_formula
    instances:
      - name: deduction_lines_rounded_before_summing
        grounds:
          - calculations.vendor_settlement_deductions
          - entities.SettlementStatement.fields.deductions_cents
          - entities.SettlementStatement.fields.handling_levy_cents
          - entities.SettlementStatement.fields.ice_handling_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order changes the cents. The raw deduction lines
          are 800, 120.48, 1140 and 114.20; rounding each line first and then summing gives
          deductions_cents 2174, while summing first and rounding once gives 2175. The scaffold
          pins per-line rounding, so 2174 is the only correct answer.
        test_recipe:
          setup:
            - "an OPEN season with one share plan"
            - "a COMPLIANT vessel with a 500.00 lb COD entitlement in GOM-2 and HOOK_AND_LINE permitted"
            - "a trip landed with exactly 10.04 lb at 850 cents ex-vessel and 12 offload minutes, verified as accepted"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "LRG-WHITE-W", share_size: "LARGE", delivery_frequency: "WEEKLY", species_tier: "WHITEFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "COD", management_area: "GOM-2", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_cod_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_cod_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "COD", landed_pounds_gross: 10.04, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
            - call: "POST /csf/trips/${trip_id}/verify"
              payload: { accepted: true }
              as: CsfAdmin
              captures: { trip_v: $.data.version }
          trigger:
            - call: "POST /csf/trips/${trip_id}/settlements"
              payload: { expected_trip_version: "${trip_v}" }
              as: CsfAdmin
              captures: { stmt_id: $.data.id }
          assert:
            - "SettlementStatement.${stmt_id}.dock_fee_cents == 800"
            - "SettlementStatement.${stmt_id}.ice_handling_cents == 120"
            - "SettlementStatement.${stmt_id}.offload_labor_cents == 1140"
            - "SettlementStatement.${stmt_id}.handling_levy_cents == 114"
            - "SettlementStatement.${stmt_id}.deductions_cents == 2174"
            - "SettlementStatement.${stmt_id}.deductions_cents != 2175"
            - "SettlementStatement.${stmt_id}.ex_vessel_cents == 8534"
            - "SettlementStatement.${stmt_id}.premium_cents == 602"

      - name: surcharge_waiver_reads_subtotal_before_fees
        grounds:
          - calculations.member_week_invoice
          - calculations.gel_pack_count
          - calculations.pack_size_selection
          - entities.ShareDelivery.fields.surcharge_cents
          - entities.ShareDelivery.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by evaluation order. The surcharge is a
          component of delivery_fee_cents which is a component of invoice_total_cents, yet the
          waiver test reads subtotal_cents only. subtotal 5200 is below the 6000 threshold, so
          surcharge_cents is 250 and invoice_total_cents is 6950, even though the pre-surcharge
          running total 5200 + 500 + 1000 = 6700 already clears the threshold and would have
          waived it under the tempting alternative reading.
        test_recipe:
          setup:
            - "an OPEN HOT-band season with a LARGE x WHITEFISH x WEEKLY plan priced at 5200"
            - "a TIER_1 delivery zone with transit_hours 6.0"
            - "one member on a HOME_DELIVERY INSTALLMENT subscription joining at week 1, fully paid at 104000 cents"
            - "a COD lot of exactly 6.00 lb allocated to the member's week-1 box and split onto the route"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "LRG-WHITE-W", share_size: "LARGE", delivery_frequency: "WEEKLY", species_tier: "WHITEFISH" }
              as: CsfAdmin
              captures: { plan_lrg_id: $.data.id }
            - call: "POST /csf/delivery-zones"
              payload: { zone_code: "ZONE-1", fee_tier: "TIER_1", transit_hours: 6.0, is_serviceable: true }
              as: CsfAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /csf/members"
              payload: { full_name: "Mara One", email: "m1@csf.test" }
              as: CsfAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/subscriptions"
              payload: { member_id: "${m1_id}", share_plan_id: "${plan_lrg_id}", season_id: "${season_id}", fulfillment_mode: "HOME_DELIVERY", payment_basis: "INSTALLMENT", join_week_index: 1, delivery_zone_id: "${zone_id}" }
              as: CsfAdmin
              captures: { sub1_id: $.data.id }
            - call: "POST /csf/subscriptions/${sub1_id}/payments"
              payload: { amount_cents: 104000 }
              as: CsfAdmin
            - call: "POST /csf/subscriptions/${sub1_id}/activate"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "COD", management_area: "GOM-2", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_cod_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_cod_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "COD", landed_pounds_gross: 6.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /csf/landing-lots/${lot_id}/allocations"
              payload: { week_index: 1, expected_landing_lot_version: "${lot_v}" }
              as: CsfAdmin
            - call: "POST /csf/landing-lots/${lot_id}/splits"
              payload: { destinations: [{ destination_type: "ROUTE", destination_id: "${zone_id}", pounds: 6.00 }] }
              as: CsfAdmin
            - call: "GET /csf/share-deliveries"
              payload: { subscription_id: "${sub1_id}", week_index: 1 }
              as: CsfAdmin
              captures: { d1_id: "$.data[0].id" }
          trigger:
            - call: "POST /csf/share-deliveries/${d1_id}/pack"
              payload: {}
              as: HubOperator
          assert:
            - "ShareDelivery.${d1_id}.allocated_pounds == 6.00"
            - "ShareDelivery.${d1_id}.box_pounds == 6.00"
            - "ShareDelivery.${d1_id}.pack_size == SMALL"
            - "ShareDelivery.${d1_id}.gel_pack_count == 4"
            - "ShareDelivery.${d1_id}.subtotal_cents == 5200"
            - "ShareDelivery.${d1_id}.surcharge_cents == 250"
            - "ShareDelivery.${d1_id}.delivery_fee_cents == 1750"
            - "ShareDelivery.${d1_id}.invoice_total_cents == 6950"
            - "ShareDelivery.${d1_id}.charged_cents == 6950"

  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_lifecycle_and_billing_axes_loop_independently
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - state_machines.Subscription.CURRENT_to_DUNNING
          - state_machines.Subscription.DUNNING_to_CURRENT
          - entities.Subscription.fields.billing_status
        distinguishing_aspect: |
          Subscription carries two parallel state axes on one row and both are re-entrant:
          packing an unpaid box drives lifecycle_status ACTIVE -> PAST_DUE while billing_status
          moves CURRENT -> DUNNING, and a single payment returns both to ACTIVE and CURRENT.
          The two axes are written by different rules and neither is a function of the other.
        test_recipe:
          setup:
            - "an OPEN season with a MEDIUM x PREMIUM_FINFISH x WEEKLY plan"
            - "one member on a HUB_PICKUP INSTALLMENT subscription joining at week 1 with paid_cents 0"
            - "the subscription ACTIVE with billing_status CURRENT and its 20 ShareDelivery rows created"
            - "a 5.00 lb SALMON lot allocated to the week-1 box and split to the hub"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
              captures: { plan_med_id: $.data.id }
            - call: "POST /csf/pickup-hubs"
              payload: { hub_code: "HUB-A", cooler_slots_default: 4, grace_minutes: 90 }
              as: CsfAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /csf/members"
              payload: { full_name: "Mara One", email: "m1@csf.test" }
              as: CsfAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/subscriptions"
              payload: { member_id: "${m1_id}", share_plan_id: "${plan_med_id}", season_id: "${season_id}", fulfillment_mode: "HUB_PICKUP", payment_basis: "INSTALLMENT", join_week_index: 1, pickup_hub_id: "${hub_id}" }
              as: CsfAdmin
              captures: { sub1_id: $.data.id }
            - call: "POST /csf/subscriptions/${sub1_id}/activate"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-1" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "SALMON", landed_pounds_gross: 5.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /csf/landing-lots/${lot_id}/allocations"
              payload: { week_index: 1, expected_landing_lot_version: "${lot_v}" }
              as: CsfAdmin
            - call: "POST /csf/landing-lots/${lot_id}/splits"
              payload: { destinations: [{ destination_type: "HUB", destination_id: "${hub_id}", pounds: 5.00 }] }
              as: CsfAdmin
            - call: "GET /csf/share-deliveries"
              payload: { subscription_id: "${sub1_id}", week_index: 1 }
              as: CsfAdmin
              captures: { d1_id: "$.data[0].id" }
          trigger:
            - call: "POST /csf/share-deliveries/${d1_id}/pack"
              payload: {}
              as: HubOperator
            - call: "POST /csf/subscriptions/${sub1_id}/payments"
              payload: { amount_cents: 4500 }
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "the pack response left Subscription.${sub1_id}.lifecycle_status == PAST_DUE and billing_status == DUNNING"
            - "Subscription.${sub1_id}.lifecycle_status == ACTIVE"
            - "Subscription.${sub1_id}.billing_status == CURRENT"
            - "Subscription.${sub1_id}.paid_cents == 4500"
            - "ShareDelivery.${d1_id}.charged_cents == 4500"
            - "ShareDelivery.${d1_id}.billing_status == CHARGED"
            - "ShareDelivery.${d1_id}.fulfillment_status == PACKED"

      - name: share_delivery_skip_then_revoke_returns_to_scheduled
        grounds:
          - state_machines.ShareDelivery.SCHEDULED_to_SKIPPED
          - state_machines.ShareDelivery.SKIPPED_to_SCHEDULED
          - state_machines.SkipRequest.CREDITED_to_REVOKED
          - calculations.skip_settlement
          - entities.Subscription.fields.skip_credit_balance_cents
        distinguishing_aspect: |
          ShareDelivery is the second non-linear machine and it belongs to a different entity
          than Subscription: its fulfillment axis loops SCHEDULED -> SKIPPED -> SCHEDULED while
          its money axis loops PENDING -> CREDITED -> PENDING in the same two requests, and the
          subscription's skip counters return to their pre-skip values.
        test_recipe:
          setup:
