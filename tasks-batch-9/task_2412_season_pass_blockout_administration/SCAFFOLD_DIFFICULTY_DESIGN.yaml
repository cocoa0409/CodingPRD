      - name: gate_entry_antipassback_closed_buffer_on_pass
        grounds:
          - validations[priority=62]
          - calculations.pass_sharing_risk_score
          - entities.Visit.fields.entry_at
          - errors[ERR_ANTIPASSBACK_VIOLATION]
          - endpoints[POST /visits]
        distinguishing_aspect: |
          A different resource entity (SeasonPass, not ParkDay) and different interval semantics: a
          closed backward buffer of ANTIPASSBACK_MINUTES 90 anchored on the pass's own previous entry,
          rather than a half-open window compared against a shared capacity. Because the buffer is
          closed, +90 minutes is a violation and +91 minutes is admitted — the inverse inclusivity of
          the half-open reservation window.
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED GOLD tier; ParkDay 2026-08-05 STANDARD (100/1000) with no blockouts."
            - "Processed ACTIVE GOLD pass bought PAY_IN_FULL."
