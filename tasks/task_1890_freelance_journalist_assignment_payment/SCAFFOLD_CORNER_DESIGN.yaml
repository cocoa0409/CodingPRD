          assert:
            - "add-invoice response total_gross_cents == 55000 (50000 fee + 5000 expense)"
            - "total_withholding_cents == 12000 (24% backup on fee portion only)"
            - "total_net_cents == 43000 (55000 - 12000; no late fee yet)"
            - "Invoice.${inv_ivan}.status == BATCHED in the same-request world (immediate consistency)"

