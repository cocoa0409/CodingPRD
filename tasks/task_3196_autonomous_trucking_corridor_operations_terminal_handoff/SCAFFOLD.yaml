# =============================================================================
# PRD-bench scaffold seed tables — autonomous trucking corridor operations
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Autonomous Trucking Corridor Operations & Terminal Handoff (Aurora): corridor
  selection with mapped routes, weather profiles and terminal placement at each
  end, transfer hub operations where human drivers handle first and last mile
  and autonomous systems run the highway segment, launch readiness checks
  including sensor calibration, route validation and load securement
  verification, remote support monitoring with intervention protocols and
  safe-stop procedures, carrier and shipper partnership models with capacity
  commitments and pricing, safety case documentation, incident reporting and
  regulatory engagement by state, maintenance and inspection programs for
  autonomous hardware alongside standard vehicle inspection, driver workforce
  transition and terminal staffing.

domain_name: autonomous-trucking-corridor-operations
api_prefix: /api

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: compliance / audit
  complexity_layers:
    - cascading_side_effects        # incident → posture → corridor status → run plan abort → apron window displacement
    - derived_field_reconciliation  # posture, check_pass_count and inspection_programs_status recomputed upward
    - rate_threshold_triggers       # safety_score bands drive carrier tier and committed discount
    - optimistic_concurrency        # OCC on Corridor.version, RunPlan.version, ShippingInstruction.version, FleetUnit.version, SecurityRecord.version
    - idempotency                   # readiness checks deduplicated on (corridor_id, correlation_key, epoch_start_at)
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many       # WriteSurface + HoldSurface paired with MultiDayHold; Corridor ↔ StateAuthority via RegulatoryEngagement
    - self_referential   # Carrier.backup_carrier_id fallback chain between carriers
    - cross_aggregate    # MaintenanceProgram / IncidentReport / RunPlan span corridor, terminal, fleet and carrier boundaries
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity Relationships
# =============================================================================
entities:
  - name: Corridor
    parent: null
    common_fields: true
    fields:
      - { name: corridor_name, type: string, source: input, description: "Human-readable corridor name, e.g. Sun Belt I-10" }
      - { name: origin_terminal_id, type: string, source: input, description: "FK -> Terminal.id; terminal where the autonomous highway segment begins (loaded inbound at the origin hub)" }
      - { name: destination_terminal_id, type: string, source: input, description: "FK -> Terminal.id; terminal where the autonomous highway segment ends (loaded outbound at the destination hub)" }
      - { name: highway_segment_miles, type: number, source: input, description: "Autonomous highway segment length in miles, exclusive of terminal aprons" }
      - { name: mapped_route, type: object, source: input, description: "Mapped route descriptor: { route_code, waypoint_count, has_hov_lane, requires_tunnel_clearance } validated during launch readiness" }
      - { name: weather_profile, type: enum, source: input, description: "CLEAR_DEFAULT | HIGH_WIND | HEAVY_PRECIPITATION | LOW_VISIBILITY | WINTER_SURFACE" }
      - { name: weather_risk_score, type: integer, source: input, default: 0, description: "0–100 risk weight of the corridor weather profile; HIGH_WIND and LOW_VISIBILITY profiles are the high-risk classes" }
      - { name: corridor_status, type: enum, source: system, description: "PLANNED → READINESS_REVIEW → ACTIVE → LIMITED → SUSPENDED → RETIRED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from check_pass_count, has_blocking_incident and weather_risk_score; gates every child operation" }
      - { name: check_pass_count, type: integer, source: computed, default: 0, description: "Number of LaunchReadinessCheck rows on this corridor in status CALIBRATION_PASSED or later" }
      - { name: check_count, type: integer, source: computed, default: 0, description: "Number of LaunchReadinessCheck rows on this corridor in any non-terminal status" }
      - { name: has_blocking_incident, type: boolean, source: computed, default: false, description: "True when at least one IncidentReport on this corridor is in status INVESTIGATING or SUBMITTED with severity == CRITICAL" }
      - { name: route_validation_calculated_at, type: datetime, source: system, description: "Server timestamp of the most recent mapped-route validation sweep for this corridor" }
      - { name: launch_authorized_at, type: datetime, source: system, description: "Null until the corridor first reaches ACTIVE; cleared again when the corridor returns to READINESS_REVIEW" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "Read-only corridor launch readiness score from the corridor_readiness_score calculation; 0 when no check is included" }

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: terminal_code, type: string, source: input, description: "Unique terminal code, uppercase, e.g. PHX-WEST" }
      - { name: terminal_name, type: string, source: input, description: "Display name of the transfer hub" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state where the terminal and its apron sit; regulatory engagement is tracked per state" }
      - { name: apron_capacity, type: integer, source: input, description: "Maximum number of trucks the apron can hold at once; reserved lane mileage cannot exceed it" }
      - { name: reserved_apron_units, type: number, source: computed, default: 0, description: "Read-only reserved apron occupancy; SUM over TerminalServiceWindow rows in status APPROVED of round_half_up(window_length_minutes / 60, 2), compared against apron_capacity" }
      - { name: terminal_state, type: enum, source: system, description: "COMMISSIONING → OPERATIONAL → DEGRADED → CLOSED" }
      - { name: staffing_status, type: enum, source: computed, description: "STAFFED | UNDERSTAFFED — finalize-time reconciliation of DriverTransition.status against managed fleet unit count" }
      - { name: transfer_turnaround_minutes, type: integer, source: computed, default: 0, description: "Read-only = round(total_handoff_minutes * roundtrip_factor / max(1, approved_window_count), 3); 0 when no APPROVED window exists" }
      - { name: total_handoff_minutes, type: integer, source: computed, default: 0, description: "Sum of handoff_duration_minutes across TerminalServiceWindow rows in status APPROVED" }
      - { name: approved_window_count, type: integer, source: computed, default: 0, description: "Count of TerminalServiceWindow rows on this terminal whose status is APPROVED" }

  - name: DriverProspect
    parent: null
    common_fields: true
    fields:
      - { name: prospect_name, type: string, source: input, description: "Full name of the human driver entering the workforce transition program" }
      - { name: home_terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: pathway, type: enum, source: input, description: "FIRST_LAST_MILE | REMOTE_SUPPORT | FLEET_TECHNICIAN | TRANSFER_HUB | RIDE_ALONG_EVALUATOR" }
      - { name: hours_worked, type: integer, source: computed, default: 0, description: "Sum of hours_recorded across DriverTransition rows for this prospect" }
      - { name: enrollments_on_file, type: integer, source: computed, default: 0, description: "Count of DriverTransition rows for this prospect in a non-CANCELLED, non-REJECTED status" }
      - { name: safety_reliability_score, type: number, source: computed, default: 1000, description: "Starts at 1000; credential lapse costs 50 via the DriverProspect transition; floor 0" }

  - name: StateAuthority
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Unique two-letter state code" }
      - { name: authority_name, type: string, source: input, description: "Name of the state motor carrier / autonomous vehicle authority" }
      - { name: autonomous_hours_allowed, type: integer, source: input, default: 24, description: "Hours per epoch the state permits autonomous highway operation on corridors it supervises" }
      - { name: requires_safety_case_filed, type: boolean, source: input, default: true, description: "When true, a corridor touching this state cannot pass launch readiness without a FILED SafetyCase" }
      - { name: engagement_window_days, type: integer, source: input, default: 30, description: "Maximum age in days of a SafetyCase filed_date for the corridor's readiness gate; exactly engagement_window_days is still valid, one day more fails" }
      - { name: hours_used, type: integer, source: computed, default: 0, description: "Sum of autonomous_hours_logged across StateEngagement rows whose state_status is SUBMITTED and whose engaged_at falls in the current epoch" }
      - { name: remaining_autonomous_hours, type: integer, source: computed, description: "Read-only = autonomous_hours_allowed - hours_used" }
      - { name: filing_required_next, type: boolean, source: computed, default: false, description: "Set true by suspension transition, cleared false by reinstatement transition" }

  - name: LaunchReadinessCheck
    parent: Corridor
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id" }
      - { name: check_type, type: enum, source: input, description: "SENSOR_CALIBRATION | ROUTE_VALIDATION | LOAD_SECUREMENT" }
      - { name: check_result, type: enum, source: input, description: "PASS | FAIL | PENDING" }
      - { name: suite_latitude, type: number, source: input, default: 0, description: "GPS latitude of the calibration or validation run, degrees; rounded to 3 decimals on write" }
      - { name: suite_longitude, type: number, source: input, default: 0, description: "GPS longitude of the calibration or validation run, degrees; rounded to 3 decimals on write" }
      - { name: calibration_variance_ms, type: number, source: computed, default: 0, description: "Read-only sensor calibration variance in milliseconds; floor(2.4 * suite_latitude + 1.6 * suite_longitude, 3)" }
      - { name: load_payload_lbs, type: integer, source: input, default: 0, description: "Secured load weight in pounds; load securement requires >= 40000 lbs" }
      - { name: prior_run_plan_id, type: string, source: input, description: "FK -> RunPlan.id; optional locally stored last-mile run plan — prohibits a second run plan from the same corridor" }
      - { name: valid_window_days, type: integer, source: input, default: 180, description: "Days a calibration or validation result stays valid; measured from the ledger epoch start stamped on this row" }
      - { name: valid_window_start_at, type: datetime, source: system, description: "Server-stamped epoch start (the logical clock at creation) from which valid_window_days is measured" }
      - { name: check_status, type: enum, source: system, description: "INITIALIZED → CALIBRATION_PASSED → VALIDATED → EXPIRED_FAILED" }
      - { name: check_contribution, type: number, source: computed, default: 0, description: "Read-only per-check readiness contribution from the check_level variant of corridor_readiness_score: PASS 60, PENDING 20, FAIL 0, plus calibration_variance_ms, capped at the VARIANCE_CAP of 40 when variance is within the 150 ms tolerance" }
      - { name: is_test_payload, type: boolean, source: input, default: false, description: "Marks a synthetic load fixture; a check carrying this flag never blocks a corridor and never counts toward check_pass_count" }
      - { name: correlation_key, type: string, source: input, description: "Idempotency key: SENSOR_CALIBRATION and ROUTE_VALIDATION rows are deduplicated on (corridor_id, correlation_key, epoch_start_at) and return the original row with http 200 when the current epoch matches" }
      - { name: epoch_start_at, type: datetime, source: system, description: "Ledger epoch start stamped by the ledger checkpoint at creation; the idempotency dedup key component" }

  - name: RunPlan
    parent: Corridor
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the carrier partnership that supplies the autonomous fleet unit" }
      - { name: origin_terminal_id, type: string, source: input, description: "FK -> Terminal.id; must differ from destination_terminal_id (round trip is ERR_INVALID_ROUTE)" }
      - { name: destination_terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: shipper_commitment_id, type: string, source: input, description: "FK -> ShipperCommitment.id; the capacity commitment this run plan draws against" }
      - { name: window_start_epoch_day, type: integer, source: input, description: "Inclusive start day of the scheduling window, counted from the ledger epoch start" }
      - { name: window_end_epoch_day, type: integer, source: input, description: "Exclusive end day of the scheduling window; window_end_epoch_day must be > window_start_epoch_day" }
      - { name: trailer_count, type: integer, source: input, description: "Trailers moved on this run; 1 or 2 accepted, every other value is ERR_INVALID_TRAILER_COUNT" }
      - { name: hauler_team_id, type: string, source: input, description: "FK -> DriverProspect.id; the driver workforce transition unit that handles first and last mile at both terminals" }
      - { name: sacra_loadboard_slot_held, type: boolean, source: input, default: false, description: "Whether the run claims the sacra loadboard slot; consumes exactly one committed slot from the named ShipperCommitment" }
      - { name: run_status, type: enum, source: system, description: "DRAFT → READINESS_PENDING → DISPATCH_READY → IN_TRANSIT → COMPLETED / ABORTED" }
      - { name: posted_per_mile_cents, type: number, source: input, description: "Carrier posted all-in rate for the run, in cents per mile; the commitment floor check compares this value against the shipper floor" }
      - { name: per_mile_rate_cents, type: number, source: computed, default: 0, description: "Read-only carrier rate; posted_per_mile_cents + ceil(trailer_count / 2) * HEAVY_TRAILER_SURCHARGE_CENTS for trailer_count >= 1, recomputed whenever the run plan is repriced" }
      - { name: committed_rate_cents, type: number, source: computed, default: 0, description: "Read-only commitment-floor rate; MAX_of(per_mile_rate_cents, shipper_floor_per_mile_cents) - committed_discount_cents, with the discount derived from the carrier's safety_score band" }
      - { name: scenario_rate_cents, type: number, source: computed, default: 0, description: "Read-only worst-case planning rate; MAX_of(per_mile_rate_cents, shipper_floor_per_mile_cents) + (weather_risk_score * weather_adjustment_cents)" }
      - { name: run_window_rate_cents, type: number, source: computed, default: 0, description: "Read-only chassis holding rate cascaded from the owning RunPlanChassis recompute; MAX(MIN_CHASSIS_RATE_CENTS, per_mile_rate_cents) * coverage_days" }
      - { name: safety_score, type: integer, source: computed, default: 50, description: "Run-level safety score in 0–100; initialized 50 from the carrier baseline, banded LOW/MEDIUM/HIGH/CRITICAL" }
      - { name: safety_band, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | CRITICAL — derived from safety_score with bands LOW < 40, MEDIUM 40–79, HIGH 80–99, CRITICAL >= 100" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Motor carrier partnership legal name" }
      - { name: dot_number, type: string, source: input, description: "Unique USDOT number; the carrier partnership natural key" }
      - { name: safety_score, type: integer, source: computed, default: 900, description: "Carrier safety score in 0–1000, starting at 900 and debited 25 per recordable incident counted in previous_epoch_incidents; never below 0. Band HIGH >= 800, MEDIUM 500–799, LOW < 500" }
      - { name: rate_settlement_cents, type: number, source: computed, default: 0, description: "Read-only settled net carrier rate from the carrier_rate_reconciliation settled_net variant; strictly larger than the provisional quote for any positive quote" }
      - { name: safety_tier, type: enum, source: computed, description: "HIGH | MEDIUM | LOW — band of safety_score; committed_discount_cents is 0 at HIGH, 15 at MEDIUM, 40 at LOW" }
      - { name: committed_discount_cents, type: number, source: computed, default: 0, description: "Read-only discount applied to every new RunPlan.committed_rate_cents; derived from safety_tier" }
      - { name: recordable_incidents_last_epoch, type: integer, source: computed, default: 0, description: "Sum of recordable_incidents across IncidentReport rows on this carrier for the current ledger epoch" }
      - { name: previous_epoch_incidents, type: integer, source: system, default: 0, description: "Frozen copy of recordable_incidents_last_epoch written by the ledger checkpoint at each epoch rollover" }
      - { name: incident_band, type: enum, source: computed, description: "CLEAN | WATCH | SUSPENDED — SUSPENDED at recordable_incidents_last_epoch >= 5, WATCH at >= 2, CLEAN below 2" }
      - { name: backup_carrier_id, type: string, source: input, description: "FK -> Carrier.id; self-referential fallback carrier consulted when this carrier cannot dispatch, default null" }
      - { name: backup_carrier_score, type: integer, source: computed, default: 0, description: "Read-only safety_score of the carrier named by backup_carrier_id; 0 when backup_carrier_id is null" }
      - { name: carrier_status, type: enum, source: system, description: "ONBOARDING → ACTIVE → SUSPENDED → OFFBOARDED" }

  - name: ShipperCommitment
    parent: null
    common_fields: true
    fields:
      - { name: shipper_name, type: string, source: input, description: "Shipper partnership legal name" }
      - { name: shipper_floor_per_mile_cents, type: number, source: input, description: "Contractual floor the carrier may not price a run below" }
      - { name: reserved_window_start_epoch_day, type: integer, source: input, description: "Inclusive start day of the commitment's reserved capacity window" }
      - { name: reserved_window_end_epoch_day, type: integer, source: input, description: "Exclusive end day of the reserved capacity window; the commitment capacity slot is a half-open interval [start, end)" }
      - { name: committed_slots, type: integer, source: input, description: "Committed loadboard capacity slots; must be >= 1 and at most 50 per commitment" }
      - { name: ride_along_credit_cents, type: number, source: computed, default: 0, description: "Read-only credit; floor(PER_VERIFIED_RIDE_ALONG_CENTS * verified_ride_along_count / 2, 2) with PER_VERIFIED_RIDE_ALONG_CENTS pinned at 1200.00" }
      - { name: billed_ride_along_cents, type: number, source: computed, default: 0, description: "Read-only reversal ledger; on commitment revoke it takes the whole of ride_along_credit_cents and ride_along_credit_cents recomputes to 0, so (ride_along_credit_cents + billed_ride_along_cents) is conserved" }
      - { name: consumed_slots, type: integer, source: computed, default: 0, description: "Number of RunPlan rows claiming this commitment's loadboard slot: run_status IN {READINESS_PENDING, DISPATCH_READY, IN_TRANSIT, COMPLETED}. ABORTED rows release their slot." }
      - { name: remaining_slots, type: integer, source: computed, description: "Read-only = committed_slots - consumed_slots; a claim at exactly zero is rejected" }
      - { name: verified_ride_along_count, type: integer, source: computed, default: 0, description: "Count of DriverTransition rows on this commitment's runs that reached RIDE_ALONG_VERIFIED" }
      - { name: commitment_status, type: enum, source: system, description: "DRAFT → CONFIRMED → SHIPPED / REVOKED" }
      - { name: shipped_at, type: datetime, source: system, description: "Stamped when the commitment flips CONFIRMED → SHIPPED" }

  - name: TerminalServiceWindow
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: run_plan_id, type: string, source: input, description: "FK -> RunPlan.id; the run this apron window serves" }
      - { name: service_type, type: enum, source: input, description: "HANDOFF_INBOUND | HANDOFF_OUTBOUND | YARD_TRANSFER | MAINTENANCE_STAGING" }
      - { name: window_start_minute, type: integer, source: input, description: "Inclusive start minute of the apron occupation relative to the terminal shift start" }
      - { name: window_end_minute, type: integer, source: input, description: "Exclusive end minute of the apron occupation; must be > window_start_minute" }
      - { name: handoff_duration_minutes, type: integer, source: input, default: 0, description: "Planned human handoff duration, summed into Terminal.total_handoff_minutes when the window is APPROVED" }
      - { name: buffer_minutes, type: integer, source: input, default: 0, description: "Yard re-positioning buffer appended to the end of the window" }
      - { name: yield_to_transit, type: boolean, source: input, default: false, description: "When true and the run is DISPATCH_READY, the window is DISPLACED without a buffer overlap check" }
      - { name: window_status, type: enum, source: system, description: "REQUESTED → APPROVED → IN_SERVICE → COMPLETED / DISPLACED / CANCELLED" }
      - { name: buffer_seconds, type: integer, source: computed, default: 0, description: "Read-only = ROUND_BUFFER(window_end_minute - window_start_minute, 0) computed as floor((end - start) + 0.49) for HANDOFF_INBOUND, and floor((end - start) + 0.51) for every other service_type; rounded to whole seconds by the shared buffer rounder" }

  - name: RemoteSupportAssignment
    parent: Corridor
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id" }
      - { name: run_plan_id, type: string, source: input, description: "FK -> RunPlan.id; the monitored run" }
      - { name: monitoring_start_at, type: datetime, source: input, description: "ISO 8601 UTC start of the remote support monitoring window" }
      - { name: monitoring_end_at, type: datetime, source: input, description: "ISO 8601 UTC end of the exclusive monitoring window; must be strictly after monitoring_start_at" }
      - { name: remote_operator_id, type: string, source: input, description: "FK -> DriverProspect.id; the human remote operator holding the window" }
      - { name: safety_support_operator_id, type: string, source: input, description: "FK -> DriverProspect.id; second operator jointly staffed on the window — the same operator cannot fill both seats" }
      - { name: geofence_type, type: enum, source: input, description: "GEOFENCE_ONLY (overlap measured on exact intervals) | GEOFENCE_PLUS_BUFFER (overlap measured with the §1.3 terminal_hold_buffer expansion, a 1.5x multiplicative expansion of the interval against other windows)" }
      - { name: intervention_protocol, type: enum, source: input, description: "MONITOR_ONLY | VOICE_ADVISORY | STANDBY_TAKEOVER | REMOTE_DISENGAGE" }
      - { name: intervention_count, type: integer, source: computed, default: 0, description: "Number of remote interventions logged against this monitoring window" }
      - { name: safe_stop_required, type: boolean, source: system, default: false, description: "Set true by the safe-stop transition; blocks IN_TRANSIT → COMPLETED for the referenced run plan" }
      - { name: safe_stop_fee_cents, type: number, source: computed, default: 0, description: "Read-only = 0 when run exposure < 1000, 25000 when 1000 <= run exposure < 5000, 60000 when >= 5000, where run exposure = ROUND_CHAIN(corridor highway_segment_miles * weather_risk_score * trailer_count * health_factor, 2) and health_factor = 1.0 when carrier incident_band is CLEAN, 1.5 when WATCH, 2.0 when SUSPENDED" }
      - { name: assignment_status, type: enum, source: system, description: "SCHEDULED → MONITORING → EXPIRED / RELEASED" }
      - { name: closure_source, type: enum, source: system, default: null, description: "Null until the window closes; REPOSITIONED_ACKNOWLEDGED on acknowledgement, SAFE_STOP_EXPIRED on a safe stop, RELEASED on release" }
  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id" }
      - { name: run_plan_id, type: string, source: input, description: "FK -> RunPlan.id; the run during which the event occurred" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | CRITICAL; CRITICAL reports block corridor readiness while open" }
      - { name: recordable_incidents, type: integer, source: input, default: 0, description: "Regulator-recordable incident count carried by this report, accumulated onto the owning carrier" }
      - { name: corrective_action_count, type: integer, source: input, default: 0, description: "Number of corrective actions filed with the report; must be >= 1 to close a CRITICAL report" }
      - { name: incident_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 band selected from the corridor's weather profile and the applied criteria table" }
      - { name: review_days_allowed, type: integer, source: input, default: 0, description: "Business days allowed for the investigation; 3 when the assigned tier requires regulatory notice, otherwise 5" }
      - { name: report_status, type: enum, source: system, description: "FILED → INVESTIGATING → CORRECTIVE_ACTION → CLOSED / SUBMITTED" }
      - { name: regulatory_notice_required, type: boolean, source: computed, description: "True when incident_tier is TIER_1 or TIER_2, or when severity is CRITICAL; drives review_days_allowed" }
      - { name: report_sequence_number, type: integer, source: system, description: "Monotonic 1-based per-corridor sequence assigned at filing in created_at order" }

  - name: RegulatoryEngagement
    parent: Corridor
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id" }
      - { name: state_authority_id, type: string, source: input, description: "FK -> StateAuthority.id; the state whose authority supervises this corridor segment" }
      - { name: engagement_type, type: enum, source: input, description: "SAFETY_BRIEFING | OPERATIONAL_NOTICE | INCIDENT_DISCLOSURE | HOURS_ALLOCATION_REQUEST" }
      - { name: autonomous_hours_requested, type: integer, source: input, description: "Additional autonomous operating hours requested from the state for the current epoch" }
      - { name: autonomous_hours_logged, type: integer, source: input, default: 0, description: "Autonomous hours actually logged under this engagement, accumulated onto StateAuthority.hours_used on submission" }
      - { name: engaged_at, type: datetime, source: input, description: "ISO 8601 UTC moment of the engagement; must fall inside the closed-open epoch window [epoch_start_at, epoch_end_at)" }
      - { name: engagement_status, type: enum, source: system, description: "DRAFT → SUBMITTED → ACCEPTED / REJECTED" }
      - { name: state_status, type: enum, source: computed, description: "FORMAL | INFORMAL | EXEMPT — formal for SAFETY_BRIEFING and INCIDENT_DISCLOSURE, informal for OPERATIONAL_NOTICE when the corridor weather profile is CLEAR_DEFAULT, exempt otherwise" }
      - { name: hours_charge_allowed, type: boolean, source: computed, default: false, description: "True when the submission may debit the state's autonomous hour budget — requires state_status FORMAL or INFORMAL and an ACCEPTED prior engagement in the same epoch" }

  - name: SafetyCase
    parent: Corridor
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id" }
      - { name: safety_case_version, type: integer, source: input, description: "Client-supplied safety case revision number; must exceed the current latest version (ERR_INVALID_VERSION)" }
      - { name: case_status, type: enum, source: system, description: "DRAFT → SUBMITTED → FILED / SUPERSEDED" }
      - { name: filed_date, type: datetime, source: input, description: "ISO 8601 UTC date the safety case was filed with the state authority; null until filed" }
      - { name: hazard_count, type: integer, source: input, description: "Number of hazards enumerated in the case; must be >= 1" }
      - { name: open_hazard_count, type: integer, source: input, default: 0, description: "Hazards still without mitigation; must be 0 before the case can be FILED" }
      - { name: residual_risk_score, type: number, source: computed, default: 0, description: "Read-only = floor((1 + hazard_count) * (1 + floor(corridor.highway_segment_miles / 100, 3)), 2) evaluated at filing time" }
      - { name: case_status_summary, type: enum, source: computed, description: "NOT_FILED | CURRENT | STALE | SUPERSEDED — NOT_FILED when the corridor has no FILED case, STALE when filed_date is strictly more than the supervising state's engagement_window_days before the ledger clock" }

  - name: MaintenanceProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Name of the inspection program on the autonomous fleet unit" }
      - { name: fleet_unit_id, type: string, source: input, description: "FK -> FleetUnit.id; the autonomous fleet unit inspected by this program" }
      - { name: state_code, type: string, source: input, description: "Two-letter state where the unit is registered; regulatory engagement is tracked per state" }
      - { name: inspection_interval_days, type: integer, source: input, description: "Days between required inspections per the program schedule; 0 selects the default program length (3 days) and every value below 1 or above 365 is rejected" }
      - { name: inspection_odometer_miles, type: integer, source: input, default: 0, description: "Odometer reading in whole miles at the inspection" }
      - { name: standard_inspection_due_date, type: datetime, source: computed, description: "Read-only = the date exactly inspection_interval_days after the scheduled inspection anchor, formatted as an ISO 8601 UTC datetime at midnight" }
      - { name: inspection_programs_status, type: enum, source: computed, description: "PENDING | COMPLIANT | OVERDUE — UNFILLED for a unit with no program; OVERDUE when the anchor plus inspection_interval_days is strictly before the ledger clock" }
      - { name: program_status, type: enum, source: system, description: "DRAFT → SCHEDULED → INSPECTED → CLOSED / VOIDED" }
      - { name: last_inspection_at, type: datetime, source: system, description: "Server-stamped epoch of the most recent inspection recorded on the unit" }

  - name: MultiDayHold
    parent: null
    common_fields: true
    fields:
      - { name: coverage_date, type: datetime, source: system, description: "Auto-filled onward chain day; when the client sends a null or blank coverage_date the server fills it from the chain's start date and the local consecutive-run count" }
      - { name: hold_start_epoch_day, type: integer, source: input, description: "Inclusive start day of the hold" }
      - { name: hold_end_epoch_day, type: integer, source: input, description: "Exclusive end day of the hold; the hold is a half-open interval [start, end)" }
      - { name: single_day_hold, type: boolean, source: input, description: "When true the hold occupies a single day and must be booked one day at a time (ERR_MULTI_DAY_NOT_ALLOWED otherwise)" }
      - { name: sequence_in_chain, type: integer, source: system, description: "1-based position of this hold inside its MultiDayHold chain, assigned in created_at order" }
      - { name: hold_type, type: enum, source: input, description: "WINDOW_BLOCK | MAINTENANCE | REGULATORY_INSPECTION" }
      - { name: hold_status, type: enum, source: system, description: "REQUESTED → INSERTED → REMOVED / DECLINED" }

  - name: DriverTransition
    parent: DriverProspect
    common_fields: true
    fields:
      - { name: prospect_id, type: string, source: input, description: "FK -> DriverProspect.id" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; the terminal being staffed by this transition" }
      - { name: pathway, type: enum, source: input, description: "FIRST_LAST_MILE | REMOTE_SUPPORT | FLEET_TECHNICIAN | TRANSFER_HUB | RIDE_ALONG_EVALUATOR" }
      - { name: transition_start_epoch_day, type: integer, source: input, description: "Inclusive epoch day the transition begins" }
      - { name: transition_days_count, type: integer, source: input, description: "Days of the transition program; must be at least 1" }
      - { name: transition_end_epoch_day, type: integer, source: computed, description: "Read-only = transition_start_epoch_day + transition_days_count - 1" }
      - { name: hours_recorded, type: integer, source: input, default: 0, description: "Hours of supervised work recorded, accumulated onto DriverProspect.hours_worked" }
      - { name: credential_event_count, type: integer, source: computed, default: 0, description: "Number of credential-lapse events applied to this transition; the first lapse debits 50 from the prospect's safety_reliability_score" }
      - { name: transition_status, type: enum, source: system, description: "ENROLLED → RIDE_ALONG_VERIFIED → CREDENTIAL_LAPSED → CANCELLED / REJECTED" }

  - name: LedgerCheckpoint
    parent: null
    common_fields: true
    fields:
      - { name: checkpoint_code, type: string, source: input, description: "Free-form checkpoint label; the ledger keeps the earliest checkpoint_code carrying a given epoch_start_at" }
      - { name: epoch_start_at, type: datetime, source: input, description: "ISO 8601 UTC start of the ledger epoch being opened" }
      - { name: epoch_end_at, type: datetime, source: input, description: "ISO 8601 UTC end of the epoch; must be strictly after epoch_start_at" }
      - { name: hours_per_epoch, type: integer, source: input, default: 24, description: "Autonomous hours made available per state authority for this epoch" }
      - { name: adopted_at, type: datetime, source: system, description: "Server-stamped moment the epoch was adopted; the earlier of two same-epoch checkpoints wins the debits" }
      - { name: checkpoint_status, type: enum, source: system, description: "OPEN → ADOPTED → ROLLED_OVER" }
      - { name: rolled_over_at, type: datetime, source: system, description: "Stamped when the epoch squashes and the next epoch opens" }

  - name: FleetUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "Autonomous fleet unit identifier, uppercase fleet prefix plus number, e.g. AUR-2214; unique across the fleet" }
      - { name: fleet_name, type: string, source: input, description: "Name of the autonomous fleet the unit belongs to" }
      - { name: home_terminal_id, type: string, source: input, description: "FK -> Terminal.id; the hub the unit is staged at between highway segments" }
      - { name: curated_at, type: datetime, source: input, description: "ISO 8601 UTC moment the unit entered the curated fleet roster" }
      - { name: inspection_anchor_at, type: datetime, source: input, description: "ISO 8601 UTC anchor the standard inspection cadence is measured from" }
      - { name: weather_clearance_hours, type: integer, source: input, description: "Autonomous hours the unit is cleared for between hardware inspections; must be at least 1" }
      - { name: is_watch_squad, type: boolean, source: input, default: false, description: "Marks a watch-squad unit whose route-driven hours are recorded at the double-shift reading" }
      - { name: hours_posted_total, type: integer, source: computed, default: 0, description: "Accumulated autonomous hours posted against the unit in the current clearance cycle" }
      - { name: route_driven_hours_cents, type: number, source: computed, default: 0, description: "Read-only route-driven hours reading in cents; floor((auto_hours_per_day_quota + mileage_hours_quota + route_load_hours_quota) * 100, 2), where route_load_hours_quota is doubled for a watch-squad unit before the sum" }
      - { name: maint_projection_cents, type: number, source: computed, default: 0, description: "Read-only maintenance projection in cents, evaluated second in the pinned order: floor(to_decimal(maint_charges) * weather_condition_discount, 2), where the discount is 1.08 for HIGH_WIND or LOW_VISIBILITY corridors and 1.0 otherwise" }
      - { name: maint_charges, type: integer, source: computed, default: 0, description: "Read-only integer maintenance charge count, evaluated first in the pinned order: floor(to_decimal(hours_posted_total) * MAINT_UNIT_RATE, 2)" }
      - { name: remain_hours, type: integer, source: computed, description: "Read-only = weather_clearance_hours - hours_posted_total, floored at 0" }
      - { name: unit_status, type: enum, source: system, description: "ACTIVE → MAINTENANCE_HOLD → RETIRED" }

  - name: RunPlanChassis
    parent: RunPlan
    common_fields: true
    fields:
      - { name: run_plan_id, type: string, source: input, description: "FK -> RunPlan.id" }
      - { name: chassis_code, type: string, source: input, description: "Intermodal chassis identifier staged for the run" }
      - { name: coverage_days, type: integer, source: input, description: "Days the chassis is held for the run; must be at least 1" }
      - { name: holding_rate_cents, type: number, source: computed, default: 0, description: "Read-only = MAX(MIN_CHASSIS_RATE_CENTS, per_mile_rate_cents) * coverage_days, cascading into the owning run plan's run_window_rate_cents" }
      - { name: chassis_status, type: enum, source: system, description: "HELD → RELEASED" }

  - name: ShippingInstruction
    parent: null
    common_fields: true
    fields:
      - { name: run_plan_id, type: string, source: input, description: "FK -> RunPlan.id; the highway run the booked containers travel on" }
      - { name: container_unit_ids, type: array, source: input, description: "Container unit ids attached to the instruction at booking" }
      - { name: booked_vgm_kg_sum, type: number, source: computed, default: 0, description: "Read-only sum of gross_weight_kg across attached container units in status INGATED, LOADED, ON_VESSEL or DISCHARGED" }
      - { name: booked_line_total_cents, type: number, source: computed, default: 0, description: "Read-only line total in cents; the per-row charge rounded per row then summed, with a per-line freight rate and the length tier of the highest attached container" }
      - { name: vgm_override_fee_cents, type: number, source: computed, default: 0, description: "Read-only verification charge; ceil(OVERRIDE_BASE_CENTS / booked_vgm_kg_sum) rounded to 2 decimals" }
      - { name: container_discount_cents, type: number, source: computed, default: 0, description: "Read-only discount applied to carried line totals, keyed on the length tier of the highest attached container" }
      - { name: instruction_status, type: enum, source: system, description: "BOOKED → HOLD_PLACED → VGM_VERIFIED → CARRIED / REJECTED / CANCELLED" }

  - name: ContainerUnit
    parent: ShippingInstruction
    common_fields: true
    fields:
      - { name: instruction_id, type: string, source: input, description: "FK -> ShippingInstruction.id; null while the container is unallocated" }
      - { name: container_number, type: string, source: input, description: "ISO 6346 container number" }
      - { name: length_feet, type: integer, source: input, description: "Container length in feet: 20, 40 or 45; selects the length tier that drives container_discount_cents" }
      - { name: gross_weight_kg, type: number, source: input, description: "Container gross mass in kilograms; unit_rate_cents derives from this" }
      - { name: verified_gross_mass_kg, type: number, source: input, default: 0, description: "Verified gross mass in kilograms; verification requires at least 100" }
      - { name: unit_rate_cents, type: number, source: computed, default: 0, description: "Read-only booking unit rate; floor(SLOT_BASE_CENTS * length_feet / 40, 2) with SLOT_BASE_CENTS pinned at 20000.00" }
      - { name: unit_status, type: enum, source: system, description: "PENDING → INGATED → LOADED → ON_VESSEL → DISCHARGED → OFFLOADED → GATED_OUT" }

  - name: RunPlanHauler
    parent: RunPlan
    common_fields: true
    fields:
      - { name: run_plan_id, type: string, source: input, description: "FK -> RunPlan.id" }
      - { name: driver_transition_id, type: string, source: input, description: "FK -> DriverTransition.id; the transition enrollment that supplies the hauler unit" }
      - { name: hauler_role, type: enum, source: input, description: "FIRST_MILE_DRIVER | LAST_MILE_DRIVER | YARD_SHUTTLE" }
      - { name: hauler_status, type: enum, source: system, description: "TRUCK_HOLDER_BLENDED → HAULER_ON_SITE → RECEIVED_ON_SITE / OFF_TARIFF" }

  - name: SecurityRecord
    parent: null
    common_fields: true
    fields:
      - { name: security_code, type: string, source: input, description: "Unique code for the road transport security record under the international convention" }
      - { name: origin_terminal_id, type: string, source: input, description: "FK -> Terminal.id; the security record's origin" }
      - { name: destination_terminal_id, type: string, source: input, description: "FK -> Terminal.id; the security record's destination, default null until routed" }
      - { name: security_classification, type: enum, source: input, description: "NORMAL | SENSITIVE | HIGH_CONSEQUENCE — the security reading for the movement" }
      - { name: clearance_required, type: boolean, source: input, default: false, description: "Whether the security classification requires an operational clearance" }
      - { name: high_consequence_clearance, type: boolean, source: input, default: false, description: "Whether a high-consequence clearance has been granted" }
      - { name: convention_status, type: enum, source: input, description: "NORMAL | SENSITIVE | HIGH_CONSEQUENCE — the record's conventional status; clamped to NORMAL when in transit, and clamped to HIGH_CONSEQUENCE once the high-consequence clearance lands" }
      - { name: consignor_code, type: string, source: input, description: "Consignor code; rolling the consignor copies the security record's own code into this field" }
      - { name: outbound_lane_code, type: string, source: input, description: "Outbound movement lane code, default null" }
      - { name: record_status, type: enum, source: system, description: "PENDING → ACTIVE → REPORTING → CLOSED" }

  - name: ClauseVariant
    parent: null
    common_fields: true
    fields:
      - { name: clause_stem, type: string, source: input, description: "Stem of the carrier arbitration clause the variant is derived from" }
      - { name: wildcard, type: boolean, source: input, default: false, description: "The wildcard variant reading; electing the wildcard swaps a base measure for an unused YAML measure in the rendered clause" }
      - { name: variant_code, type: string, source: system, description: "Derived code = clause_stem with the wildcard segment (the first digit-to-digit segment) removed when wildcard is true, otherwise the clause stem verbatim" }
      - { name: variant_status, type: enum, source: system, description: "PENDING → ELECTED → DECLINED" }
      - { name: variant_status_summary, type: enum, source: computed, description: "NOT_ELECTED | ELECTED | DECLINED_PENDING — the summary reading used in the clause register, distinct from the raw variant_status" }
      - { name: decline_reason, type: string, source: input, description: "Reason recorded when the variant is declined, default null" }

  - name: AgreementCode
    parent: null
    common_fields: true
    fields:
      - { name: code_value, type: string, source: input, description: "Hours-of-service agreement code value; sanitized on execution" }
      - { name: display_value, type: string, source: input, description: "The value shown in the agreement register, kept verbatim when the code value is sanitized" }
      - { name: code_status, type: enum, source: system, description: "ACTIVE → EXECUTED" }
      - { name: exec_sequence, type: integer, source: computed, default: 0, description: "Read-only code sequence number surfaced in the execution response" }
      - { name: order_sentinel, type: string, source: computed, default: "AA", description: "Read-only deterministic order sentinel fixed at \"AA\" for every execution; ranked by this exact string, never by a random id" }

# =============================================================================
# Table 2: State Machines
# =============================================================================
state_machines:
  - entity: Corridor
    initial_state: PLANNED
    terminal_states: [RETIRED]
    shape: posture_driven
    transitions:
      - from: PLANNED
        to: READINESS_REVIEW
        trigger: "POST /api/corridors/{id}/launch-readiness/start"
        actor: CorridorOperationsManager
        preconditions:
          - "corridor_status == PLANNED (ERR_INVALID_STATE otherwise)"
          - "origin_terminal_id and destination_terminal_id reference Terminal rows in terminal_state OPERATIONAL"
          - "highway_segment_miles > 0"
        side_effects:
          - "posture recomputes to RESTRICTED (check_pass_count is 0)"
          - "launch_authorized_at cleared to null"

      - from: READINESS_REVIEW
        to: ACTIVE
        trigger: "POST /api/corridors/{id}/launch-readiness/validate"
        actor: CorridorOperationsManager
        preconditions:
          - "check_pass_count >= check_count with check_count >= 1 (ERR_READINESS_CHECK_FAILED)"
          - "no failing check (check_result == FAIL) exists on the corridor (ERR_READINESS_CHECK_FAILED)"
          - "a SafetyCase on this corridor has case_status FILED and filed_date within the supervising state's engagement_window_days of the ledger clock, inclusive (ERR_SAFETY_CASE_STALE)"
          - "corridor weather_risk_score <= 80 (ERR_WEATHER_RESTRICTED)"
          - "validate_mapped_route ran; mapped_route.has_hov_lane or mapped_route.requires_tunnel_clearance false (ERR_ROUTE_NOT_VALIDATED)"
        side_effects:
          - "launch_authorized_at = ledger clock"
          - "posture recomputes; OPEN when weather_risk_score < 40"
          - "each LaunchReadinessCheck in CALIBRATION_PASSED advances to VALIDATED"

      - from: ACTIVE
        to: LIMITED
        trigger: "system recompute at ledger checkpoint rollover or POST /api/incident-reports on a CRITICAL corridor incident"
        actor: system
        preconditions:
          - "weather_risk_score >= 80, or the corridor carries at least one MaintenanceProgram whose inspection_programs_status is OVERDUE, or a maintenance program on the corridor's fleet unit was voided and that unit's inspection_programs_status is now UNFILLED"
        side_effects:
          - "posture recomputes to RESTRICTED"
          - "every RunPlan in READINESS_PENDING or DISPATCH_READY on this corridor moves to ABORTED"
          - "every TerminalServiceWindow REQUESTED on a run plan of this corridor moves to DISPLACED"

      - from: LIMITED
        to: ACTIVE
        trigger: "POST /api/corridors/{id}/launch-readiness/validate"
        actor: CorridorOperationsManager
        preconditions:
          - "no MaintenanceProgram in OVERDUE status"
          - "weather_risk_score < 80"
          - "has_blocking_incident == false"
        side_effects:
          - "posture recomputes; OPEN when weather_risk_score < 40"
          - "Displaced TerminalServiceWindow rows are not automatically restored — operators must re-request"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system on CRITICAL incident with regulatory_notice_required, or POST /api/corridors/{id}/launch-readiness/fail"
        actor: system
        preconditions:
          - "has_blocking_incident == true (ERR_BLOCKED_BY_INCIDENT) when triggered by readiness failure"
        side_effects:
          - "posture recomputes to FROZEN"
          - "every RunPlan on the corridor in DRAFT, READINESS_PENDING or DISPATCH_READY moves to ABORTED"
          - "referenced StateAuthority rows set filing_required_next = true"
          - "SafetyCase case_status_summary recomputes to STALE"

      - from: LIMITED
        to: SUSPENDED
        trigger: "system on CRITICAL incident with regulatory_notice_required"
        actor: system
        preconditions:
          - "has_blocking_incident == true"
        side_effects:
          - "posture recomputes to FROZEN"
          - "every RunPlan in READINESS_PENDING or DISPATCH_READY on this corridor moves to ABORTED"
          - "referenced StateAuthority rows set filing_required_next = true"

      - from: SUSPENDED
        to: READINESS_REVIEW
        trigger: "POST /api/corridors/{id}/launch-readiness/start"
        actor: CorridorOperationsManager
        preconditions:
          - "no IncidentReport on the corridor remains in INVESTIGATING or SUBMITTED (ERR_BLOCKED_BY_INCIDENT)"
        side_effects:
          - "posture recomputes to RESTRICTED"
          - "every non-terminal LaunchReadinessCheck on the corridor moves to EXPIRED_FAILED"
          - "check_pass_count resets to 0"

      - from: READINESS_REVIEW
        to: RETIRED
        trigger: "POST /api/corridors/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "no RunPlan on the corridor in IN_TRANSIT (ERR_RUN_PLAN_IN_TRANSIT)"
        side_effects:
          - "posture recomputes to FROZEN (terminal)"
          - "every non-terminal RunPlan on the corridor moves to ABORTED"
          - "every TerminalServiceWindow REQUESTED or APPROVED on those run plans moves to CANCELLED"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/corridors/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "no RunPlan on the corridor in IN_TRANSIT (ERR_RUN_PLAN_IN_TRANSIT)"
        side_effects:
          - "posture recomputes to FROZEN (terminal)"
          - "every non-terminal RunPlan on the corridor moves to ABORTED"
          - "every TerminalServiceWindow REQUESTED or APPROVED on those run plans moves to CANCELLED"
          - "referenced Carrier rows move carrier_status to OFFBOARDED when the carrier has no other ACTIVE corridor"

  - entity: RunPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABORTED]
    shape: branching
    transitions:
      - from: DRAFT
        to: READINESS_PENDING
        trigger: "POST /api/run-plans/{id}/submit"
        actor: CarrierDispatcher
        preconditions:
          - "owning Corridor.posture != FROZEN (ERR_CORRIDOR_FROZEN)"
          - "trailer_count is 1 or 2 (ERR_INVALID_TRAILER_COUNT)"
          - "commitment has remaining_slots >= 1 (ERR_COMMITMENT_CAPACITY_EXHAUSTED)"
          - "every LaunchReadinessCheck in CALIBRATION_PASSED or VALIDATED carries calibration_variance_ms <= 150 (ERR_LOAD_SECUREMENT_FAILED / ERR_CALIBRATION_FAILED)"
          - "no SafetyCase on the corridor has case_status DRAFT only while the corridor posture is RESTRICTED (ERR_SAFETY_CASE_STALE)"
        side_effects:
          - "owning ShipperCommitment.consumed_slots += 1"
          - "owning ShipperCommitment.remaining_slots recomputes"
          - "owning ShipperCommitment.commitment_status → CONFIRMED when it was DRAFT"
          - "corridor.check_pass_count recomputes"

      - from: READINESS_PENDING
        to: DISPATCH_READY
        trigger: "POST /api/run-plans/{id}/dispatch-ready"
        actor: CarrierDispatcher
        preconditions:
          - "every LaunchReadinessCheck on the corridor in ROUTE_VALIDATION has check_result PASS"
          - "the owning corridor's mapped route validation is current (route_validation_calculated_at within valid_window_days)"
          - "RunPlan.per_mile_rate_cents is the current carrier price (carrier_reprice recomputed it)"
        side_effects:
          - "every LaunchReadinessCheck in VALIDATED on the corridor moves to EXPIRED_FAILED when its valid_window elapsed"
          - "TerminalServiceWindow rows REQUESTED for this run plan are re-evaluated: DISPLACED when yield_to_transit and the run is DISPATCH_READY, else APPROVED"
          - "owning Terminal.reserved_apron_units recomputes"
          - "owning Terminal.transfer_turnaround_minutes recomputes"

      - from: DISPATCH_READY
        to: READINESS_PENDING
        trigger: "POST /api/run-plans/{id}/requeue"
        actor: CarrierDispatcher
        preconditions:
          - "the corridor posture is RESTRICTED (ERR_INVALID_STATE when OPEN or FROZEN, ERR_CORRIDOR_FROZEN when FROZEN)"
        side_effects:
          - "every TerminalServiceWindow on this run plan in APPROVED moves to REQUESTED"
          - "owning Terminal.reserved_apron_units recomputes downward"
          - "owning ShipperCommitment.consumed_slots recomputes (a requeued run still holds its slot; only DRAFT releases it)"

      - from: DISPATCH_READY
        to: ABORTED
        trigger: "POST /api/run-plans/{id}/abort"
        actor: ComplianceOfficer
        preconditions:
          - "the run plan is in DRAFT, READINESS_PENDING or DISPATCH_READY (ERR_RUN_PLAN_TERMINAL when terminal, ERR_INVALID_STATE otherwise)"
        side_effects:
          - "every TerminalServiceWindow REQUESTED or APPROVED on this run plan moves to CANCELLED"
          - "owning ShipperCommitment.consumed_slots recomputes downward by one — the aborted run releases its loadboard slot"
          - "owning ShipperCommitment.remaining_slots recomputes"
          - "corridor.check_pass_count recomputes"

      - from: DISPATCH_READY
        to: IN_TRANSIT
        trigger: "POST /api/run-plans/{id}/start-highway-segment"
        actor: CarrierDispatcher
        preconditions:
          - "owning corridor posture == OPEN (ERR_CORRIDOR_RESTRICTED when RESTRICTED, ERR_CORRIDOR_FROZEN when FROZEN)"
          - "at least one TerminalServiceWindow on this run plan is APPROVED (ERR_NO_APPROVED_HANDOFF_WINDOW)"
          - "no RemoteSupportAssignment on this run plan in status SCHEDULED or MONITORING with intervention_protocol STANDBY_TAKEOVER"
        side_effects:
          - "every approved TerminalServiceWindow on this run plan moves to IN_SERVICE"
          - "remote_support_handoff_sequence recomputes for the run plan"

      - from: IN_TRANSIT
        to: READINESS_PENDING
        trigger: "POST /api/run-plans/{id}/safe-stop"
        actor: RemoteSupportOperator
        preconditions:
          - "a RemoteSupportAssignment on this run plan is in status MONITORING (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "the monitoring RemoteSupportAssignment sets safe_stop_required = true and moves to EXPIRED"
          - "the referenced Carrier.previous_epoch_incidents stays frozen; Carrier.recordable_incidents_last_epoch recomputes"
          - "every TerminalServiceWindow on this run plan moves to CANCELLED"
          - "owning corridor.has_blocking_incident recomputes; corridor may move LIMITED → ACTIVE (bubble up)"

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /api/run-plans/{id}/complete"
        actor: CarrierDispatcher
        side_effects:
          - "every DriverTransition on this run plan in RIDE_ALONG_VERIFIED increments the commitment's verified_ride_along_count"
          - "owning ShipperCommitment.ride_along_credit_cents recomputes"
          - "owning ShipperCommitment.billed_ride_along_cents recomputes"
          - "owning ShipperCommitment.commitment_status → SHIPPED and shipped_at stamps"
          - "owning Carrier.safety_score recomputes from its run plans"
          - "owning Carrier.safety_tier and committed_discount_cents recompute"

  - entity: TerminalServiceWindow
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/terminal-service-windows/{id}/approve"
        actor: TerminalManager
        preconditions:
          - "the referenced RunPlan.run_status is DISPATCH_READY or IN_TRANSIT (ERR_INVALID_STATE)"
          - "window_start_minute < window_end_minute"
          - "Terminal.reserved_apron_units + (window_length_minutes with buffer) <= Terminal.apron_capacity (ERR_APRON_CAPACITY_EXCEEDED)"
          - "the apron is not already held by an overlapping approved block (ERR_APRON_OVERLAP)"
        side_effects:
          - "Terminal.total_handoff_minutes recomputes"
          - "Terminal.approved_window_count recomputes"
          - "Terminal.transfer_turnaround_minutes recomputes"
          - "Terminal.reserved_apron_units recomputes"

      - from: REQUESTED
        to: DISPLACED
        trigger: "system during the run plan's dispatch-ready transition"
        actor: system
        preconditions:
          - "yield_to_transit == true and the referenced run plan moved to DISPATCH_READY"
        side_effects:
          - "owning Terminal.reserved_apron_units recomputes"
          - "owning Terminal.approved_window_count recomputes"
          - "owning Terminal.transfer_turnaround_minutes recomputes"

      - from: APPROVED
        to: IN_SERVICE
        trigger: "system when the referenced run plan enters IN_TRANSIT"
        actor: system
        side_effects:
          - "Terminal.reserved_apron_units recomputes"
          - "Terminal.transfer_turnaround_minutes recomputes"

      - from: APPROVED
        to: REQUESTED
        trigger: "system when the referenced run plan requeues"
        actor: system
        side_effects:
          - "Terminal.reserved_apron_units recomputes downward"
          - "Terminal.approved_window_count recomputes"
          - "Terminal.total_handoff_minutes recomputes"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/terminal-service-windows/{id}/cancel"
        actor: TerminalManager
        preconditions:
          - "window_status == APPROVED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Terminal.reserved_apron_units recomputes downward"
          - "Terminal.approved_window_count recomputes"
          - "Terminal.total_handoff_minutes recomputes"

      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /api/terminal-service-windows/{id}/complete-handoff"
        actor: TerminalManager
        preconditions:
          - "the referenced run plan is IN_TRANSIT or READINESS_PENDING after a safe stop"
        side_effects:
          - "Terminal.total_handoff_minutes recomputes"
          - "Terminal.transfer_turnaround_minutes recomputes"

  - entity: MaintenanceProgram
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/maintenance-programs/{id}/schedule"
        actor: FleetMaintenanceTech
        preconditions:
          - "inspection_interval_days is 0 (default program length, resolved to 3) or 1..365 (ERR_INVALID_INSPECTION_INTERVAL)"
          - "standard_inspection_due_date parses as a valid date on or after the ledger clock"
        side_effects:
          - "inspection_programs_status recomputes to PENDING"
          - "owning Carrier.safety_score recomputes when the unit's overdue status clears"

      - from: SCHEDULED
        to: INSPECTED
        trigger: "POST /api/maintenance-programs/{id}/record-inspection"
        actor: FleetMaintenanceTech
        preconditions:
          - "inspection_odometer_miles >= 0"
          - "the ledger clock is on or after the scheduled inspection anchor"
        side_effects:
          - "last_inspection_at = ledger clock"
          - "inspection_programs_status recomputes to COMPLIANT"
          - "the corridor restricted by this unit's overdue status moves LIMITED → ACTIVE (bubble up)"

      - from: INSPECTED
        to: SCHEDULED
        trigger: "POST /api/maintenance-programs/{id}/reschedule"
        actor: FleetMaintenanceTech
        preconditions:
          - "inspection_interval_days is 0 or 1..365"
        side_effects:
          - "standard_inspection_due_date recomputes forward by inspection_interval_days"
          - "last_inspection_at is retained in inspection history and inspection_programs_status recomputes"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /api/maintenance-programs/{id}/void"
        actor: FleetMaintenanceTech
        preconditions:
          - "inspection_programs_status != COMPLIANT for the current epoch (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "inspection_programs_status recomputes to UNFILLED"
          - "every corridor carrying this unit's program moves ACTIVE → LIMITED as a cross-entity consequence of the void"

      - from: INSPECTED
        to: CLOSED
        trigger: "POST /api/maintenance-programs/{id}/close"
        actor: ComplianceOfficer
        side_effects:
          - "inspection_programs_status recomputes to UNFILLED (program closed)"

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [CLOSED, SUBMITTED]
    shape: cyclic
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /api/incident-reports/{id}/investigate"
        actor: ComplianceOfficer
        preconditions:
          - "the corridor's mapped route has been identified; incident_tier resolves from the criteria table"
        side_effects:
          - "owning corridor.has_blocking_incident recomputes (true for CRITICAL)"
          - "owning corridor posture recomputes; corridor may move ACTIVE → LIMITED or LIMITED → SUSPENDED"

      - from: INVESTIGATING
        to: CORRECTIVE_ACTION
        trigger: "POST /api/incident-reports/{id}/corrective-action"
        actor: ComplianceOfficer
        preconditions:
          - "corrective_action_count >= 1 (ERR_CORRECTIVE_ACTION_REQUIRED)"
        side_effects:
          - "regulatory_notice_required recomputes from incident_tier"
          - "review_days_allowed recomputes to 3 when regulatory_notice_required else 5"
          - "owning corridor.has_blocking_incident recomputes; corridor may move SUSPENDED → LIMITED (bubble up)"

      - from: CORRECTIVE_ACTION
        to: CLOSED
        trigger: "POST /api/incident-reports/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "corrective_action_count >= 1 (ERR_CORRECTIVE_ACTION_REQUIRED)"
        side_effects:
          - "owning corridor.has_blocking_incident recomputes; corridor may move LIMITED → ACTIVE (bubble up)"
          - "owning Carrier.recordable_incidents_last_epoch recomputes"
          - "owning Carrier.incident_band recomputes"

      - from: CORRECTIVE_ACTION
        to: INVESTIGATING
        trigger: "POST /api/incident-reports/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "the incident is within review_days_allowed of its filing epoch (ERR_REVIEW_WINDOW_LAPSED)"
        side_effects:
          - "owning corridor.has_blocking_incident recomputes; corridor may move LIMITED → SUSPENDED"

      - from: INVESTIGATING
        to: SUBMITTED
        trigger: "POST /api/incident-reports/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "regulatory_notice_required == true (ERR_INVALID_STATE otherwise)"
          - "the ledger clock is within review_days_allowed of the filing epoch (ERR_REVIEW_WINDOW_LAPSED)"
        side_effects:
          - "owning corridor.has_blocking_incident recomputes; corridor may move LIMITED → ACTIVE when no other blocking report remains (bubble up)"
          - "owning Carrier.recordable_incidents_last_epoch recomputes"
          - "owning Carrier.incident_band recomputes"

      - from: SUBMITTED
        to: INVESTIGATING
        trigger: "POST /api/incident-reports/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "the incident is within review_days_allowed of its filing epoch (ERR_REVIEW_WINDOW_LAPSED)"
        side_effects:
          - "owning corridor.has_blocking_incident recomputes; corridor may move ACTIVE → LIMITED"

  - entity: Carrier
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    shape: cyclic
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /api/carriers/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "at least one SafetyCase anywhere on the platform has case_status FILED"
          - "dot_number is unique among carriers"
        side_effects:
          - "safety_score recomputes from previous_epoch_incidents: MAX(900 - 25 * previous_epoch_incidents, 0)"
          - "safety_tier and committed_discount_cents recompute"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system when incident_band recomputes to SUSPENDED"
        actor: system
        preconditions:
          - "recordable_incidents_last_epoch >= 5"
        side_effects:
          - "committed_discount_cents recomputes to 40"
          - "every RunPlan on this carrier in DRAFT or READINESS_PENDING moves to ABORTED"
          - "every RemoteSupportAssignment on those run plans in SCHEDULED moves to EXPIRED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/carriers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "recordable_incidents_last_epoch dropped below 5 via the ledger checkpoint rollover that froze previous_epoch_incidents"
        side_effects:
          - "safety_score recomputes from previous_epoch_incidents: MAX(900 - 25 * previous_epoch_incidents, 0)"
          - "incident_band recomputes"
          - "committed_discount_cents recomputes from safety_tier"

      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /api/carriers/{id}/offboard"
        actor: ComplianceOfficer
        preconditions:
          - "the carrier has no RunPlan in READINESS_PENDING, DISPATCH_READY or IN_TRANSIT (ERR_CARRIER_HAS_LIVE_RUN_PLANS)"
        side_effects:
          - "every ShipperCommitment the carrier dispatches against keeps its consumed_slots frozen"
          - "backup_carrier_score of any carrier naming this carrier as backup recomputes to 0"

  - entity: ShippingInstruction
    initial_state: BOOKED
    terminal_states: [CARRIED, REJECTED, CANCELLED]
    shape: linear_with_revert
    transitions:
      - from: BOOKED
        to: HOLD_PLACED
        trigger: "POST /api/shipping-instructions/{id}/place-holds"
        actor: BookingClerk
        preconditions:
          - "instruction_status == BOOKED (ERR_INVALID_STATE otherwise)"
          - "each container_id in the request references a ContainerUnit on this instruction"
        side_effects:
          - "each named ContainerUnit moves PENDING → INGATED when it was PENDING"
          - "each named ContainerUnit.version increments by 1; owning shipping instruction version increments"
          - "owning line booked_vgm_kg_sum recomputes"

      - from: HOLD_PLACED
        to: BOOKED
        trigger: "POST /api/shipping-instructions/{id}/cancel-holds"
        actor: BookingClerk
        side_effects:
          - "each ContainerUnit in INGATED moves back to PENDING; version increments"
          - "owning line booked_vgm_kg_sum recomputes downward"

      - from: HOLD_PLACED
        to: VGM_VERIFIED
        trigger: "POST /api/shipping-instructions/{id}/verify-vgm"
        actor: BookingClerk
        preconditions:
          - "each unit has verified_gross_mass_kg >= 100 (ERR_VGM_VERIFICATION_FAILED otherwise)"
          - "no ContainerUnit on the instruction is already OFFLOADED"
        side_effects:
          - "line booked_vgm_kg_sum recomputes"
          - "line booked_line_total_cents recomputes; vgm_override_fee_cents recomputes"

      - from: VGM_VERIFIED
        to: CARRIED
        trigger: "POST /api/shipping-instructions/{id}/complete-carriage"
        actor: ComplianceOfficer
        preconditions:
          - "no ContainerUnit on the instruction is in OFFLOADED or PENDING"
        side_effects:
          - "line booked_line_total_cents recomputes from carried units only"
          - "owning booking_record.line_booked_total_cents recomputes"

      - from: VGM_VERIFIED
        to: REJECTED
        trigger: "POST /api/shipping-instructions/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "an active hold on a unit of this instruction was declined (ERR_HOLD_NOT_ACTIVE otherwise)"
        side_effects:
          - "each ContainerUnit in INGATED or LOADED moves to PENDING; version increments"
          - "owning line booked_vgm_kg_sum recomputes to 0"

  - entity: ContainerUnit
    initial_state: PENDING
    terminal_states: [GATED_OUT]
    shape: cyclic
    transitions:
      - from: PENDING
        to: INGATED
        trigger: "system on hold placement, or POST /api/container-units/{id}/gate-in"
        actor: TerminalOperator
        side_effects:
          - "unit.version increments by 1"
          - "owning line booked_vgm_kg_sum recomputes"
          - "owning line booked_line_total_cents recomputes; unit_rate_cents recomputes from gross_weight_kg"

      - from: INGATED
        to: LOADED
        trigger: "POST /api/container-units/{id}/load"
        actor: TerminalOperator
        preconditions:
          - "owning instruction is in HOLD_PLACED or VGM_VERIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "unit.version increments by 1"
          - "owning line booked_vgm_kg_sum and booked_line_total_cents recompute"
          - "owning carrier booking_count recomputes"

      - from: LOADED
        to: ON_VESSEL
        trigger: "system when the owning instruction reaches VGM_VERIFIED and the vessel departs"
        actor: system
        side_effects:
          - "unit.version increments by 1"

      - from: ON_VESSEL
        to: DISCHARGED
        trigger: "POST /api/container-units/{id}/discharge"
        actor: TerminalOperator
        side_effects:
          - "unit.version increments by 1"
          - "owning line booked_line_total_cents recomputes; container_discount_cents recomputes"
          - "owning carrier booking_rebate_cents recomputes; booking_count recomputes"

      - from: DISCHARGED
        to: OFFLOADED
        trigger: "POST /api/container-units/{id}/offload"
        actor: TerminalOperator
        preconditions:
          - "owning instruction is not in CARRIED (ERR_INVALID_STATE)"
        side_effects:
          - "unit.version increments by 1"
          - "owning line booked_vgm_kg_sum recomputes downward"
          - "owning carrier refund_from_carrier_cents recomputes; booking_rebate_cents recomputes"

      - from: OFFLOADED
        to: LOADED
        trigger: "POST /api/container-units/{id}/load"
        actor: TerminalOperator
        side_effects:
          - "unit.version increments by 1"
          - "owning line booked_vgm_kg_sum recomputes upward"
          - "owning carrier refund_from_carrier_cents recomputes"

      - from: DISCHARGED
        to: GATED_OUT
        trigger: "POST /api/container-units/{id}/gate-out"
        actor: TerminalOperator
        side_effects:
          - "unit.version increments by 1"
          - "owning line booked_vgm_kg_sum recomputes downward"
          - "owning carrier booking_count recomputes"

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, resolved by OCC on version
# =============================================================================
concurrency_rules:
  - rule_id: corridor-launch-readiness-stale
    parent_entity: Corridor
    write_endpoint: "POST /api/corridors/{id}/launch-readiness/validate"
    occ_field: "expected_corridor_version"
    description: |
      Validating a corridor's launch readiness against a corridor whose
      version has advanced since the client last observed it is rejected.
      This captures the case where a maintenance program, incident report or
      readiness check has already moved the corridor's derived posture, so the
      caller's readiness decision is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: run-plan-dispatch-stale
    parent_entity: RunPlan
    write_endpoint: "POST /api/run-plans/{id}/dispatch-ready"
    occ_field: "expected_run_plan_version"
    description: |
      Promoting a run plan to dispatch-ready against a run plan whose version
      has advanced since the client last observed it is rejected. This captures
      the case where an apron window approval or a rate recalculation has
      already touched the run plan, so the caller's dispatch decision is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules
# =============================================================================
calculations:
  - name: corridor_readiness_score
    trigger: "corridor launch readiness review, readiness check mutation, incident state change, maintenance overdue recompute and ledger checkpoint rollover"
    algorithm: weighted_scoring
    formula: |
      Part A — per-check score:
        weighted = (check_result == PASS)        ? 60
                 : (check_result == PENDING)     ? 20
                 :                                 0
        base     = ROUND_HALF_UP(weighted + calibration_variance_ms, 2)
        if calibration_variance_ms <= 150 and base > 100:
            final_check_score = 40          # capped when variance is within tolerance
        else:
            final_check_score = base
      Part B — corridor score:
        included  = every LaunchReadinessCheck on the corridor with is_test_payload == false
                    AND check_status IN {CALIBRATION_PASSED, VALIDATED}
        if included is empty:  readiness_score = 0
        else:                  readiness_score = ROUND_HALF_UP(sum(final_check_score) / len(included), 2)
    input_set: "LaunchReadinessCheck rows on the corridor: check_status IN {CALIBRATION_PASSED, VALIDATED} and is_test_payload == false. INITIALIZED and EXPIRED_FAILED rows are excluded; rows carrying is_test_payload == true are excluded from both the numerator and the denominator."
    constants:
      PASS_WEIGHT: 60
      PENDING_WEIGHT: 20
      VARIANCE_TOLERANCE_MS: 150
      VARIANCE_CAP: 40
      SCORE_FLOOR: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: check_level
        when: "evaluated for a single LaunchReadinessCheck, surfaced on that check's readiness contribution"
        difference: "reports final_check_score for one row; the variance cap applies per row, so two rows at variance 140 and 160 contribute 40 and 100 respectively"
      - name: corridor_level
        when: "evaluated for the corridor's posture gate"
        difference: "sums the per-check scores of included rows and divides by the included count; the denominator counts only rows with is_test_payload == false"
    note: |
      The landscape tail of an individual check (base 100 plus its variance) is not
      contained in the corridor aggregation — per-row bases above 100 are pulled
      down by the shared cap, while the corridor average is not separately capped.

  - name: carrier_rate_reconciliation
    trigger: "run plan pricing and the settled-rate reconciliation at carrier invoicing"
    algorithm: aggregation
    formula: |
      discount = (carrier.safety_tier == "HIGH")   ? 0
               : (carrier.safety_tier == "MEDIUM") ? MEDIUM_DISCOUNT
               :                                     LOW_DISCOUNT
      net_provisional_cents = ROUND_HALF_UP(posted_per_mile_cents - discount, 2)
      settled_cents         = ROUND_HALF_UP(net_provisional_cents
                                + net_provisional_cents * COMMISSION_BPS / 10000, 2)
      The two readings are both valid and differ for identical inputs: the first is the
      binding quote the dispatcher sees at tendering, the second is the settled net rate
      the carrier is invoiced at after the platform commission is applied.
    input_set: "the single RunPlan being priced plus its owning Carrier; no aggregation across run plans"
    constants:
      MEDIUM_DISCOUNT: 15
      LOW_DISCOUNT: 40
      COMMISSION_BPS: 125
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_quote
        when: "the run plan is priced or re-quoted before dispatch"
        difference: "returns posted_per_mile_cents minus the band discount, without the platform commission"
      - name: settled_net
        when: "the carrier invoice is settled"
        difference: "adds COMMISSION_BPS of the provisional quote on top, so the settled reading is strictly larger for any positive provisional quote"

  - name: committed_rate_resolution
    trigger: "run plan creation and re-pricing after the carrier rate changes"
    algorithm: threshold
    formula: |
      floor_rate = MAX(per_mile_rate_cents, shipper_floor_per_mile_cents)
      committed_rate_cents = ROUND_HALF_UP(floor_rate - committed_discount_cents, 2)
      committed_discount_cents is selected from the carrier's safety_tier band:
        HIGH (safety_score >= 800)   -> 0
        MEDIUM (500 <= score < 800)  -> 15
        LOW (safety_score < 500)     -> 40
      The selection is inclusive at the lower bound: a carrier at exactly 800 is HIGH,
      a carrier at exactly 500 is MEDIUM.
      Post-condition: committed_rate_cents >= shipper_floor_per_mile_cents - 40
    input_set: "the single RunPlan being priced plus its owning Carrier and ShipperCommitment; the floor comparison reads the client-supplied posted_per_mile_cents, while committed_rate_cents derives from it; no aggregation"
    constants:
      HIGH_TIER_THRESHOLD: 800
      MEDIUM_TIER_THRESHOLD: 500
      DISCOUNT_HIGH: 0
      DISCOUNT_MEDIUM: 15
      DISCOUNT_LOW: 40
    precision: "2 decimal places, round_half_up"
    variants:
      - name: commitment_floor_dominant
        when: "shipper_floor_per_mile_cents is the larger of the two inputs"
        difference: "the commitment floor sets the pre-discount rate, so the committed rate tracks the shipper contract rather than the carrier"
      - name: carrier_rate_dominant
        when: "per_mile_rate_cents is the larger of the two inputs"
        difference: "the carrier rate sets the pre-discount rate; the same discount band produces a strictly larger committed rate"

  - name: scenario_rate_estimate
    trigger: "run plan creation, and every weather profile or rollout-effort change on the corridor"
    algorithm: forward_looking
    formula: |
      base    = MAX(per_mile_rate_cents, shipper_floor_per_mile_cents)
      months  = COVERAGE_MONTHS                       # fixed at one month per priced run
      working = ROUND_HALF_UP(base * months, 2)
      effort  = ROUND_HALF_UP(weather_risk_score * weather_adjustment_cents, 2)
      scenario_rate_cents = ROUND_HALF_UP(working + effort, 2)
    input_set: "the single RunPlan being priced; projected, so no terminal run plan is excluded"
    constants:
      COVERAGE_MONTHS: 1
      WEATHER_ADJUSTMENT_CENTS: 8
    precision: "2 decimal places, round_half_up"
    variants:
      - name: per_run_estimate
        when: "a run plan is priced before dispatch"
        difference: "adds the whole weather effort term to a single month of base rate"
      - name: one_month_only
        when: "the pricing engine is asked for the near-term projection"
        difference: "drops the weather effort term, returning only the rounded one-month base"

  - name: transfer_turnaround_index
    trigger: "terminal service window approval, cancellation, requeue and handoff completion"
    algorithm: aggregation
    formula: |
      approved = TerminalServiceWindow rows on the terminal with window_status == APPROVED
      count    = len(approved)
      total_handoff_minutes = sum(handoff_duration_minutes for w in approved)
      roundtrip_factor      = 0.5
      if count == 0:
          transfer_turnaround_minutes = 0
      else:
          transfer_turnaround_minutes = ROUND_HALF_UP(
              total_handoff_minutes * roundtrip_factor / count, 3)
    input_set: "TerminalServiceWindow rows on the terminal in status APPROVED only. REQUESTED, DISPLACED, IN_SERVICE, COMPLETED and CANCELLED rows are excluded from both the sum and the count."
    constants:
      ROUNDTRIP_FACTOR: 0.5
      EMPTY_DEFAULT: 0
    precision: "3 decimal places, round_half_up"
    variants:
      - name: approval_snapshot
        when: "recomputed at window approval"
        difference: "includes the newly approved window in both the numerator and the count"
      - name: requeue_snapshot
        when: "recomputed when approved windows revert to REQUESTED"
        difference: "drops reverted windows from both terms; a terminal whose last approved window requeues collapses to the empty default 0 rather than the previous average"

  - name: terminal_hold_buffer
    trigger: "terminal apron overlap screening and remote support monitoring overlap screening"
    algorithm: interval_merge
    formula: |
      window_length   = window_end_minute - window_start_minute      # half-open [start, end)
      effective_end   = window_end_minute + buffer_minutes
      The apron occupation occupies [window_start_minute, effective_end + 1)
      for screening against other approved windows.
      Adjacency rule: touching windows do NOT occupy — a new window whose
      window_start_minute equals an existing window's effective_end is permitted,
      and any window that would share a single minute with an existing window is
      rejected with ERR_APRON_OVERLAP.
    input_set: "TerminalServiceWindow rows on the same terminal in status APPROVED or IN_SERVICE; DISPLACED and CANCELLED rows are already released and excluded"
    constants:
      ADJACENCY_ALLOWANCE_MINUTES: 0
      GEOMETRY: "half-open [start, end + buffer); touching windows do not occupy"
    precision: "whole minutes; no rounding"
    variants:
      - name: exact_interval
        when: "geofence_type == GEOFENCE_ONLY"
        difference: "collision is measured on exact intervals after adding the apron buffer; no multiplicative expansion is applied"
      - name: buffered_expansion
        when: "geofence_type == GEOFENCE_PLUS_BUFFER"
        difference: "the interval is expanded multiplicatively by 1.5x before screening, so a window that clears under exact_interval is rejected here"

  - name: safe_stop_fee
    trigger: "remote support safe-stop procedure and monitoring window expiry"
    algorithm: threshold
    formula: |
      health_factor = (carrier.incident_band == "CLEAN")    ? 1.0
                    : (carrier.incident_band == "WATCH")    ? 1.5
                    :                                          2.0
      run_exposure  = ROUND_HALF_UP(
          corridor.highway_segment_miles * weather_risk_score
          * trailer_count * health_factor, 2)
      safe_stop_fee_cents = (run_exposure <  1000) ? 0
                          : (run_exposure <  5000) ? 25000
                          :                          60000
      Runner-up variant replaces the run_exposure term with
      transit_minutes = corridor.highway_segment_miles * 1.6 and applies the same bands.
    input_set: "the single RunPlan being safe-stopped, its corridor and its carrier; no aggregation"
    constants:
      LOW_BAND_LIMIT: 1000
      HIGH_BAND_LIMIT: 5000
      FEE_MID: 25000
      FEE_HIGH: 60000
      HEALTH_CLEAN: 1.0
      HEALTH_WATCH: 1.5
      HEALTH_SUSPENDED: 2.0
      MINUTES_PER_MILE: 1.6
    precision: "2 decimal places, round_half_up on the exposure; exact integer cents on the fee"
    variants:
      - name: exposure_based
        when: "a safe stop is initiated on a monitored run"
        difference: "bands on rounded weighted exposure; a run at exactly 1000 falls in the 25000 band while a run at 999.99 stays at 0"
      - name: transit_minutes_based
        when: "the near-variant transit-minutes reading is requested"
        difference: "substitutes mileage-scaled transit minutes for weighted exposure, so a short high-wind run crosses the 5000 band under exposure_based but not under transit_minutes_based"

  - name: driver_reroute_risk
    trigger: "run plan submission and the driver workforce transition re-check"
    algorithm: weighted_scoring
    formula: |
      group = RunPlan rows on the same corridor in status READINESS_PENDING or IN_TRANSIT
              sharing one hauler_team_id
      max_score   = MAX(safety_score for r in group)          # 0 when the group is empty
      driver_risk = MAX(max_score * DRIVER_WEIGHT - CREDENTIAL_EVENT_PENALTY * credential_event_count, 0)
      DRIVER_WEIGHT = 0.5 ; CREDENTIAL_EVENT_PENALTY = 50
      The penalty is capped at one application per transition row: a transition whose
      credential_event_count exceeds 1 still debits exactly 50 once, and the excess is
      not carried forward — a figure not included in the count.
    input_set: "RunPlan rows sharing hauler_team_id across the corridor in READINESS_PENDING or IN_TRANSIT; DRAFT and DISPATCH_READY rows are excluded because they are not yet tendered"
    constants:
      DRIVER_WEIGHT: 0.5
      CREDENTIAL_EVENT_PENALTY: 50
      FLOOR: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: corridor_scoped
        when: "the risk reading is requested for a corridor"
        difference: "maximises safety_score only across run plans on the named corridor"
      - name: fleet_scoped
        when: "the risk reading is requested for the whole fleet transition review"
        difference: "maximises safety_score across every non-terminal run plan, so a high-scoring run on another corridor raises the fleet reading but not the corridor reading"

  - name: regulatory_charge_allocation
    trigger: "GoTime creation, engagement submission and the engagement-hour checkpoint rollover"
    algorithm: waterfall_allocation
    formula: |
      budgeted  = checkpoint.hours_per_epoch
      used      = sum(autonomous_hours_logged for engagements on the state whose
                      state_status == SUBMITTED
                      and engaged_at falls in [checkpoint.epoch_start_at, checkpoint.epoch_end_at))
      remaining = budgeted - used
      remaining_autonomous_hours = MAX(remaining, 0)
      hours_charge_allowed = True when the engagement's state_status is FORMAL or INFORMAL
                             and an ACCEPTED prior engagement exists in the same epoch
    input_set: "RegulatoryEngagement rows on the state with engagement_status SUBMITTED and engaged_at inside the current epoch window. DRAFT and REJECTED rows never debit; ACCEPTED rows count once regardless of the number of later submissions."
    constants:
      EPOCH_WINDOW: "[epoch_start_at, epoch_end_at) — closed-open"
      FLOOR: 0
    precision: "whole hours; no rounding"
    variants:
      - name: cumulative_charge
        when: "the running epoch budget is read"
        difference: "reports the remaining whole-hour balance after every SUBMITTED engagement in the epoch, floored at zero, so a negative running total reads 0 rather than the deficit"
      - name: immediate_charge
        when: "a single submission is adjudicated"
        difference: "charges only this engagement and ignores earlier submissions in the same epoch that are still DRAFT"

  - name: run_plan_exposure
    trigger: "carrier liability attribution and safe-stop fee staging"
    algorithm: combinatorial
    formula: |
      applicable_cents = ROUND_HALF_UP(committed_rate_cents - committed_discount_cents, 2)
      late_fee_cents   = ROUND_HALF_UP(LATE_RATE * committed_rate_cents * late_count, 2)
      weather_fee_cents= weather_risk_score * WEATHER_ATTRIBUTION_CENTS
      run_plan_exposure_cents = applicable_cents + late_fee_cents + weather_fee_cents
      late_count = number of days the run plan's window_start_epoch_day trails the
                   current ledger epoch day, floored at 0
    input_set: "the single RunPlan being attributed; weather_fee_cents folds in a corridor field, so the term cannot be evaluated before the corridor is resolved"
    constants:
      LATE_RATE: 0.0105
      WEATHER_ATTRIBUTION_CENTS: 8.037
    precision: "2 decimal places, round_half_up, applied per term before summing"
    variants:
      - name: per_line_rounded
        when: "fees are attributed line by line for carrier invoicing"
        difference: "each of applicable_cents, late_fee_cents and weather_fee_cents is rounded to 2 decimals before summing, so 310 + round(10.2375) + round(442.035) = 762.28"
      - name: aggregate_rounded
        when: "the rolled-up attribution total is read"
        difference: "the unrounded terms are summed and rounded once, so round(310 + 10.2375 + 442.035) = 762.27 for the same inputs — one cent below per_line_rounded"

# =============================================================================
# Table 4: Validation Rules (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present on every request; the role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "the role is permitted for the operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "the corridor named in the path exists"
    error_id: ERR_CORRIDOR_NOT_FOUND
    http_status: 404
    applies_to: "paths beginning /corridors/{id}"

  - priority: 4
    category: existence
    check: "the run plan named in the path exists"
    error_id: ERR_RUN_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "paths beginning /run-plans/{id}"

  - priority: 5
    category: existence
    check: "the terminal named in the path exists"
    error_id: ERR_TERMINAL_NOT_FOUND
    http_status: 404
    applies_to: "paths beginning /terminals/{id}"

  - priority: 6
    category: existence
    check: "the carrier named in the path exists"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "paths beginning /carriers/{id}"

  - priority: 7
    category: existence
    check: "the shipper commitment named in the path exists"
    error_id: ERR_COMMITMENT_NOT_FOUND
    http_status: 404
    applies_to: "paths beginning /shipper-commitments/{id}"

  - priority: 8
    category: existence
    check: "the incident report named in the path exists"
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "paths beginning /incident-reports/{id}"

  - priority: 9
    category: existence
    check: "every referenced resource named outside the path — origin_terminal_id, destination_terminal_id, carrier_id, shipper_commitment_id, hauler_team_id, state_authority_id, run_plan_id, prospect_id, terminal_id — resolves to a row of the declared entity"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /api/corridors, POST /api/run-plans, POST /api/shipper-commitments, POST /api/driver-transitions, POST /api/regulatory-engagements, POST /api/multi-day-holds, POST /api/remote-support-assignments, POST /api/safety-cases"

  - priority: 10
    category: state
    check: "the owning corridor posture is OPEN for the operation; a RESTRICTED corridor rejects every operation that must be pinned to live weather"
    error_id: ERR_CORRIDOR_RESTRICTED
    http_status: 409
    applies_to: "POST /api/run-plans/{id}/start-highway-segment"

  - priority: 11
    category: state
    check: "the owning corridor posture is OPEN or RESTRICTED; a FROZEN corridor rejects every operation"
    error_id: ERR_CORRIDOR_FROZEN
    http_status: 409
    applies_to: "POST /api/run-plans, POST /api/run-plans/{id}/submit, POST /api/run-plans/{id}/start-highway-segment, POST /api/run-plans/{id}/safe-stop, POST /api/carriers/{id}/activate"

  - priority: 12
    category: state
    check: "the target row is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint in §1.5"

  - priority: 13
    category: state
    check: "the run plan is not already terminal; COMPLETED and ABORTED run plans reject further transitions"
    error_id: ERR_RUN_PLAN_TERMINAL
    http_status: 409
    applies_to: "POST /api/run-plans/{id}/submit, POST /api/run-plans/{id}/dispatch-ready, POST /api/run-plans/{id}/requeue, POST /api/run-plans/{id}/abort, POST /api/run-plans/{id}/start-highway-segment, POST /api/run-plans/{id}/complete, POST /api/run-plans/{id}/safe-stop"

  - priority: 14
    category: business_safety
    check: "every LaunchReadinessCheck on the corridor in CALIBRATION_PASSED or VALIDATED carries calibration_variance_ms <= 150 and no check carries check_result FAIL"
    error_id: ERR_CALIBRATION_FAILED
    http_status: 409
    applies_to: "POST /api/corridors/{id}/launch-readiness/validate, POST /api/run-plans/{id}/submit, POST /api/run-plans/{id}/dispatch-ready"

  - priority: 15
    category: business_safety
    check: "load securement verification passes: the corridor carries at least one LOAD_SECUREMENT check with load_payload_lbs >= 40000 and check_result PASS"
    error_id: ERR_LOAD_SECUREMENT_FAILED
    http_status: 409
    applies_to: "POST /api/run-plans/{id}/submit, POST /api/corridors/{id}/launch-readiness/validate"

  - priority: 16
    category: business_safety
    check: "the corridor carries a FILED SafetyCase whose filed_date is within the supervising state's engagement_window_days of the ledger clock, inclusive at exactly engagement_window_days"
    error_id: ERR_SAFETY_CASE_STALE
    http_status: 409
    applies_to: "POST /api/corridors/{id}/launch-readiness/validate, POST /api/run-plans/{id}/submit, POST /api/carriers/{id}/activate"

  - priority: 17
    category: business_safety
    check: "the corridor weather_risk_score is at or below 80 and the request is not pinned to a live high-wind profile"
    error_id: ERR_WEATHER_RESTRICTED
    http_status: 409
    applies_to: "POST /api/corridors/{id}/launch-readiness/validate, POST /api/run-plans/{id}/start-highway-segment"

  - priority: 18
    category: business_safety
    check: "the corridor has no unresolved blocking incident: no IncidentReport in INVESTIGATING with severity CRITICAL"
    error_id: ERR_BLOCKED_BY_INCIDENT
    http_status: 409
    applies_to: "POST /api/corridors/{id}/launch-readiness/validate, POST /api/corridors/{id}/launch-readiness/start, POST /api/run-plans/{id}/start-highway-segment"

  - priority: 19
    category: business_constraint
    check: "the mapped route is validated: mapped_route.has_hov_lane is true or mapped_route.requires_tunnel_clearance is false, and route_validation_calculated_at is within the check's valid_window_days"
    error_id: ERR_ROUTE_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /api/corridors/{id}/launch-readiness/validate, POST /api/run-plans/{id}/dispatch-ready"

  - priority: 20
    category: business_constraint
    check: "the carrier has no MaintenanceProgram in OVERDUE status for any unit assigned to the corridor"
    error_id: ERR_MAINTENANCE_OVERDUE
    http_status: 409
    applies_to: "POST /api/corridors/{id}/launch-readiness/validate, POST /api/run-plans/{id}/start-highway-segment"

  - priority: 21
    category: business_constraint
    check: "the corridor has no covered run plan already in IN_TRANSIT when a second plan for the same coverage window is tendered"
    error_id: ERR_RUN_PLAN_OVERLAP
    http_status: 409
    applies_to: "POST /api/run-plans/{id}/submit"

  - priority: 22
    category: business_constraint
    check: "the apron occupation does not collide with an already approved window on the same terminal"
    error_id: ERR_APRON_OVERLAP
    http_status: 409
    applies_to: "POST /api/terminal-service-windows/{id}/approve"

  - priority: 23
    category: business_constraint
    check: "the remote support monitoring window collides with another active monitoring assignment for the same operator — same operator, same corridor, any flight, both directions"
    error_id: ERR_MONITOR_OVERLAP
    http_status: 409
    applies_to: "POST /api/remote-support-assignments, POST /api/remote-support-assignments/{id}/acknowledge"

  - priority: 24
    category: business_constraint
    check: "a coverage date is carried on the next chain day for a CoverageDate's onward chain of daily holds"
    error_id: ERR_COVERAGE_DATE_REQUIRED
    http_status: 422
    applies_to: "POST /api/multi-day-holds"

  - priority: 25
    category: business_constraint
    check: "a single-day hold is booked one day at a time; a multi-day request against a single_day_hold row is rejected"
    error_id: ERR_MULTI_DAY_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /api/multi-day-holds"

  - priority: 26
    category: business_fiscal
    check: "the anticlockwise entry window is rejected — a MultiDayHold whose hold_start_epoch_day is strictly before hold_end_epoch_day is honoured, but a hold whose end precedes its start by more than zero days cannot be inserted"
    error_id: ERR_HOLD_WINDOW_INVERTED
    http_status: 422
    applies_to: "POST /api/multi-day-holds"

  - priority: 27
    category: business_fiscal
    check: "the shipper commitment has at least one unconsumed loadboard slot"
    error_id: ERR_COMMITMENT_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /api/run-plans/{id}/submit"

  - priority: 28
    category: business_fiscal
    check: "the carrier posted rate is at or above the shipper commitment floor minus the maximum band discount of 40: posted_per_mile_cents >= shipper_floor_per_mile_cents - 40"
    error_id: ERR_RATE_BELOW_COMMITMENT_FLOOR
    http_status: 422
    applies_to: "POST /api/run-plans, POST /api/run-plans/{id}/submit"

  - priority: 29
    category: business_fiscal
    check: "the run is priced against a shipper commitment whose capacity slot covers the run window, measured as a half-open interval at the end and closed-inclusive at the start"
    error_id: ERR_NO_ELIGIBLE_COMMITMENT
    http_status: 409
    applies_to: "POST /api/run-plans"

  - priority: 30
    category: business_fiscal
    check: "the autonomous-hour charge is permitted: the engagement state_status is FORMAL or INFORMAL and an ACCEPTED prior engagement exists in the same epoch"
    error_id: ERR_CHARGE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /api/regulatory-engagements/{id}/submit"

  - priority: 31
    category: business_temporal
    check: "the requested autonomous hours do not exceed the state authority's remaining_autonomous_hours for the epoch"
    error_id: ERR_HOURS_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /api/regulatory-engagements"

  - priority: 32
    category: business_temporal
    check: "the engagement moment falls inside the current epoch window [epoch_start_at, epoch_end_at)"
    error_id: ERR_OUTSIDE_EPOCH_WINDOW
    http_status: 422
    applies_to: "POST /api/regulatory-engagements"

  - priority: 33
    category: business_temporal
    check: "the incident is still inside its allowed review window, measured inclusively at review_days_allowed business days from the filing epoch"
    error_id: ERR_REVIEW_WINDOW_LAPSED
    http_status: 409
    applies_to: "POST /api/incident-reports/{id}/submit, POST /api/incident-reports/{id}/reopen"

  - priority: 34
    category: business_temporal
    check: "the requested dispatch window does not collide with an existing committed dispatch window on the same corridor"
    error_id: ERR_DISPATCH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/run-plans/{id}/dispatch-ready"

  - priority: 35
    category: business_referential
    check: "the corridor origin and destination terminals are distinct"
    error_id: ERR_INVALID_ROUTE
    http_status: 422
    applies_to: "POST /api/corridors, POST /api/run-plans"

  - priority: 36
    category: business_referential
    check: "trailer_count is exactly 1 or exactly 2"
    error_id: ERR_INVALID_TRAILER_COUNT
    http_status: 422
    applies_to: "POST /api/run-plans, POST /api/run-plans/{id}/submit"

  - priority: 37
    category: business_referential
    check: "the safety case version is greater than the corridor's current highest safety case version"
    error_id: ERR_INVALID_VERSION
    http_status: 422
    applies_to: "POST /api/safety-cases, POST /api/safety-cases/{id}/file"

  - priority: 38
    category: business_referential
    check: "the remote operator and the safety support operator on one monitoring window are different people"
    error_id: ERR_DUPLICATE_OPERATOR
    http_status: 422
    applies_to: "POST /api/remote-support-assignments"

  - priority: 39
    category: business_referential
    check: "the required request fields are present and well typed for the endpoint"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a body"

  - priority: 40
    category: business_referential
    check: "the reproduction case for a compensatory formula run is labelled a reproduction, not a replication"
    error_id: ERR_REPRO_NOT_REPLICATION
    http_status: 422
    applies_to: "POST /api/incident-reports/{id}/corrective-action"

  - priority: 41
    category: business_referential
    check: "given logs are populated before a coordinated-dispatch claim is made"
    error_id: ERR_MISSING_LOGS
    http_status: 422
    applies_to: "POST /api/corridors/{id}/launch-readiness/validate"

# =============================================================================
# §1.0 Response Envelope (fixed)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoints
# =============================================================================
endpoints:
  # --- Platform controls ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Move the logical clock. The server's startup default clock is exactly 2026-09-01T00:00:00Z and every epoch, validity window, review window and staleness rule is measured against this clock, never wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock advances", "no entity fields mutate"]

  - method: POST
    path: "/api/ledger-checkpoints"
    description: "Open a ledger epoch for autonomous-hour budgets and incident counters"
    roles: [PlatformAdmin]
    code: 201
    input: [checkpoint_code, epoch_start_at, epoch_end_at, "hours_per_epoch?"]
    output: LedgerCheckpoint
    side_effects: ["checkpoint_status = OPEN"]

  - method: GET
    path: "/api/ledger-checkpoints"
    description: "List ledger checkpoints"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "LedgerCheckpoint[]"
    side_effects: []

  - method: GET
    path: "/api/ledger-checkpoints/{id}"
    description: "Read one ledger checkpoint"
    roles: [Any]
    code: 200
    input: []
    output: LedgerCheckpoint
    side_effects: []

  - method: POST
    path: "/api/ledger-checkpoints/{id}/adopt"
    description: "Adopt the epoch as the active ledger epoch"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LedgerCheckpoint
    side_effects: ["checkpoint_status → ADOPTED", "adopted_at = ledger clock"]

  - method: POST
    path: "/api/ledger-checkpoints/{id}/roll-over"
    description: "Squash the epoch and open the next one"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LedgerCheckpoint
    side_effects:
      - "checkpoint_status → ROLLED_OVER and rolled_over_at stamps"
      - "every Carrier.previous_epoch_incidents = recordable_incidents_last_epoch then recordable_incidents_last_epoch = 0"
      - "every Carrier.incident_band recomputes from previous_epoch_incidents"
      - "every StateAuthority.hours_used resets to 0 and remaining_autonomous_hours recomputes"
      - "every Carrier.rate_settlement_cents recomputes"
      - "every LaunchReadinessCheck in CALIBRATION_PASSED or VALIDATED whose valid window has elapsed moves to EXPIRED_FAILED"
      - "every LaunchReadinessCheck in CALIBRATION_PASSED advances to VALIDATED when the readiness review produced a launch authorization for its corridor"
      - "every LaunchReadinessCheck in INITIALIZED whose valid window has elapsed moves to EXPIRED_FAILED"
      - "corridor.check_pass_count recomputes for every corridor carrying a mutated check"
      - "every Carrier whose carrier_status is ACTIVE and whose incident_band recomputes to SUSPENDED moves to SUSPENDED"
      - "every RunPlan on a carrier that just moved to SUSPENDED, in DRAFT or READINESS_PENDING, moves to ABORTED"
      - "every TerminalServiceWindow REQUESTED on those run plans moves to DISPLACED"

  # --- Terminals ---
  - method: POST
    path: "/api/terminals"
    description: "Commission a transfer hub terminal"
    roles: [TerminalManager]
    code: 201
    input: [terminal_code, terminal_name, state_code, apron_capacity]
    output: Terminal
    side_effects: ["terminal_state = COMMISSIONING", "reserved_apron_units = 0", "transfer_turnaround_minutes = 0"]

  - method: GET
    path: "/api/terminals"
    description: "List terminals"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Terminal[]"
    side_effects: []

  - method: GET
    path: "/api/terminals/{id}"
    description: "Get a terminal"
    roles: [Any]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: POST
    path: "/api/terminals/{id}/operate"
    description: "Move a terminal into service as the origin or destination hub of a corridor"
    roles: [TerminalManager]
    code: 200
    input: []
    output: Terminal
    side_effects: ["terminal_state → OPERATIONAL", "staffing_status recomputes"]

  # --- State authorities ---
  - method: POST
    path: "/api/state-authorities"
    description: "Register a state authority for regulatory engagement"
    roles: [RegulatoryLiaison]
    code: 201
    input: [state_code, authority_name, "autonomous_hours_allowed?", "requires_safety_case_filed?", "engagement_window_days?"]
    output: StateAuthority
    side_effects: ["hours_used = 0", "filing_required_next = false"]

  - method: GET
    path: "/api/state-authorities"
    description: "List state authorities"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "StateAuthority[]"
    side_effects: []

  - method: GET
    path: "/api/state-authorities/{id}"
    description: "Get a state authority"
    roles: [Any]
    code: 200
    input: []
    output: StateAuthority
    side_effects: []

  - method: GET
    path: "/api/state-authorities/{id}/regulatory-engagements"
    description: "List the engagements filed with this state authority"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RegulatoryEngagement[]"
    side_effects: []

  # --- Carriers ---
  - method: POST
    path: "/api/carriers"
    description: "Onboard a motor carrier partnership"
    roles: [ComplianceOfficer]
    code: 201
    input: [carrier_name, dot_number, "backup_carrier_id?"]
    output: Carrier
    side_effects: ["carrier_status = ONBOARDING", "safety_score = 500", "safety_tier = MEDIUM", "committed_discount_cents = 15"]

  - method: GET
    path: "/api/carriers"
    description: "List carriers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  - method: GET
    path: "/api/carriers/{id}"
    description: "Get a carrier"
    roles: [Any]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/api/carriers/{id}/incident-reports"
    description: "List incident reports attributed to this carrier"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []

