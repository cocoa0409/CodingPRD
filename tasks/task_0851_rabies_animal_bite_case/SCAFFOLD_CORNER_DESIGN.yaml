scaffold_corner_design:
  # -------------------------------------------------------------------------
  # Entities
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: owner_creation_returns_201_compliant_zero_balance
        claim_type: creation
        grounds: [entities.Owner.fields.compliance_status, entities.Owner.fields.outstanding_fines_cents]
        distinguishing_aspect: "A newly created Owner is COMPLIANT with outstanding_fines_cents 0 and a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Mia Owner", phone: "555-0200" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
          assert:
            - "response http status == 201"
            - "Owner.${owner_id}.compliance_status == COMPLIANT"
            - "Owner.${owner_id}.outstanding_fines_cents == 0"

      - name: bite_case_unidentified_animal_risk_high_empty_set
        claim_type: computed_fields
        grounds: [calculations.risk_level, entities.BiteCase.fields.risk_level, entities.BiteCase.fields.animal_id]
        distinguishing_aspect: "Empty-animal edge: a CATEGORY_III case with animal_id null yields risk_level HIGH and pep_indication INITIATE (unavailable animal cannot be observed)."
        test_recipe:
          setup: ["Empty DB; no animal linked to the case."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C1", incident_datetime: "2026-03-01T09:00:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_III", victim_name: "W1", victim_age: 40 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", risk: "$.data.risk_level", ind: "$.data.pep_indication" }
          assert:
            - "BiteCase.${case_id}.risk_level == HIGH"
            - "BiteCase.${case_id}.pep_indication == INITIATE"
            - "BiteCase.${case_id}.status == OPEN"

      - name: animal_creation_defaults_vaccination_unknown_status_reported
        claim_type: defaults
        grounds: [entities.Animal.fields.vaccination_status, entities.Animal.fields.status]
        distinguishing_aspect: "Omitting vaccination_status applies default UNKNOWN; a new Animal starts in REPORTED with control_status NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/animals"
              payload: { species: "CAT", animal_class: "DOMESTIC" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
          assert:
            - "Animal.${animal_id}.vaccination_status == UNKNOWN"
            - "Animal.${animal_id}.status == REPORTED"
            - "Animal.${animal_id}.control_status == NONE"

      - name: bite_case_missing_required_wound_category_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.BiteCase.fields.wound_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required wound_category on intake -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C2", incident_datetime: "2026-03-01T09:00:00Z", exposure_type: "BITE", body_site: "HAND", victim_name: "W2", victim_age: 30 }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: bite_case_invalid_enum_exposure_type_rejected
        claim_type: type_constraints
        grounds: [entities.BiteCase.fields.exposure_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An illegal exposure_type enum value -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C3", incident_datetime: "2026-03-01T09:00:00Z", exposure_type: "HUG", body_site: "HAND", wound_category: "CATEGORY_II", victim_name: "W3", victim_age: 30 }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_owner_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_OWNER_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent owner id -> ERR_OWNER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/owners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HealthDeptAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 404"
            - "response error_id == ERR_OWNER_NOT_FOUND"

  # -------------------------------------------------------------------------
  # State machines
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: breach_already_breached_order_rejected
        claim_type: invalid_transition
        grounds: [state_machines.QuarantineOrder.ACTIVE_to_BREACHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second breach on an already-BREACHED (terminal) order -> ERR_INVALID_STATE (409); no second citation is issued."
        test_recipe:
          setup: ["Owner, owned DOG, FACILITY; clock 2026-03-01; a FACILITY order issued then BREACHED."]
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Ned Owner", phone: "555-0201" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "NONE" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "F1", facility_type: "SHELTER", capacity: 3, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C4", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "LEG", wound_category: "CATEGORY_II", victim_name: "W4", victim_age: 40, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-orders/${order_id}/breach"
              payload: {}
              as: AnimalControlOfficer
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/breach"
              payload: {}
              as: AnimalControlOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: close_open_case_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BiteCase.CLEARED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a case still in OPEN (not CONFIRMED_RABID/CLEARED) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A single OPEN BiteCase."]
          setup_api_calls:
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C5", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "SCRATCH", body_site: "HAND", wound_category: "CATEGORY_I", victim_name: "W5", victim_age: 30 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/close"
              payload: {}
              as: Epidemiologist
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: specimen_submission_for_live_animal_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=22]", "errors[ERR_ANIMAL_NOT_DECEASED]"]
        distinguishing_aspect: "Cross-entity Specimen<-Animal: submitting a specimen for an animal not DECEASED/EUTHANIZED -> ERR_ANIMAL_NOT_DECEASED (409)."
        test_recipe:
          setup: ["A live (REPORTED) DOG and an OPEN case referencing it."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "UNKNOWN" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C6", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_III", victim_name: "W6", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/specimens"
              payload: { animal_id: "${animal_id}", collected_datetime: "2026-03-01T09:00:00Z", condition: "SATISFACTORY" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_ANIMAL_NOT_DECEASED"

      - name: report_result_on_autolyzed_rejected_specimen_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Specimen.SUBMITTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A specimen created AUTOLYZED is persisted REJECTED; reporting a result on it -> ERR_INVALID_STATE (409) since it is not SUBMITTED."
        test_recipe:
          setup: ["A EUTHANIZED DOG, an OPEN case, and an AUTOLYZED specimen (auto REJECTED)."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "NONE" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/animals/${animal_id}/disposition"
              payload: { disposition: "EUTHANIZED" }
              as: AnimalControlOfficer
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C7", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "HEAD_NECK", wound_category: "CATEGORY_III", victim_name: "W7", victim_age: 10, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases/${case_id}/specimens"
              payload: { animal_id: "${animal_id}", collected_datetime: "2026-03-01T09:00:00Z", condition: "AUTOLYZED" }
              as: Veterinarian
              captures: { spec_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/specimens/${spec_id}/report-result"
              payload: { test_method: "DFA", result: "NEGATIVE" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "Specimen.${spec_id}.status == REJECTED (from creation)"
            - "response http status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: animal_capture_at_large_transitions_to_captured
        claim_type: valid_transition
        grounds: [state_machines.Animal.AT_LARGE_to_CAPTURED, entities.Animal.fields.control_status]
        distinguishing_aspect: "Animal-control linkage: an unidentified animal marked AT_LARGE then captured moves to CAPTURED with control_status CAPTURED."
        test_recipe:
          setup: ["An unidentified (identified=false) RACCOON marked AT_LARGE."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "RACCOON", animal_class: "WILD", identified: false, vaccination_status: "NONE" }
              as: AnimalControlOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/animals/${animal_id}/disposition"
              payload: { escaped: true }
              as: AnimalControlOfficer
          trigger:
            - call: "POST /api/v1/animals/${animal_id}/capture"
              payload: {}
              as: AnimalControlOfficer
          assert:
            - "Animal.${animal_id}.status == CAPTURED"
            - "Animal.${animal_id}.control_status == CAPTURED"

  # -------------------------------------------------------------------------
  # Validations / Errors
  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_region_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_REGION_CODE]"]
        distinguishing_aspect: "Creating a second SurveillanceRegion with an existing region_code -> ERR_DUPLICATE_REGION_CODE (409)."
        test_recipe:
          setup: ["One SurveillanceRegion with region_code RB-DUP."]
          setup_api_calls:
            - call: "POST /api/v1/surveillance-regions"
              payload: { region_code: "RB-DUP", positive_threshold: 3 }
              as: HealthDeptAdmin
              captures: { region_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/surveillance-regions"
              payload: { region_code: "RB-DUP", positive_threshold: 2 }
              as: HealthDeptAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_DUPLICATE_REGION_CODE"

      - name: facility_order_missing_facility_id_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_FACILITY_REQUIRED]"]
        distinguishing_aspect: "A FACILITY order_type with no facility_id -> ERR_FACILITY_REQUIRED (422)."
        test_recipe:
          setup: ["An identified DOG and an OPEN case for it."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C8", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_II", victim_name: "W8", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 422"
            - "response error_id == ERR_FACILITY_REQUIRED"

      - name: citation_payment_amount_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=70]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "The correct Owner paying the wrong amount (fiscal check in isolation) -> ERR_PAYMENT_AMOUNT_MISMATCH (422)."
        test_recipe:
          setup: ["An Owner, a CATEGORY_I case, and a Citation (total 54250) owned by that owner."]
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Oli Owner", phone: "555-0202" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C9", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "SCRATCH", body_site: "HAND", wound_category: "CATEGORY_I", victim_name: "W9", victim_age: 30 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
            - call: "POST /api/v1/citations"
              payload: { owner_id: "${owner_id}", case_id: "${case_id}", violations: ["QUARANTINE_BREACH"] }
              as: AnimalControlOfficer
              captures: { cit_id: "$.data.id", total: "$.data.total_fine_cents" }
          trigger:
            - call: "POST /api/v1/citations/${cit_id}/pay"
              payload: { payment_amount_cents: 999 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Citation.${cit_id}.total_fine_cents == 54250"
            - "response http status == 422"
            - "response error_id == ERR_PAYMENT_AMOUNT_MISMATCH"

      - name: complete_symptomatic_active_order_returns_safety_error
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_ANIMAL_SYMPTOMATIC]"]
        distinguishing_aspect: "Safety check in isolation: completing an ACTIVE order past its window but with observation_outcome SYMPTOMATIC -> ERR_ANIMAL_SYMPTOMATIC (409); state check passes."
        test_recipe:
          setup: ["Owner, owned DOG, FACILITY; a FACILITY order ACTIVE; clock advanced to 2026-03-11."]
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Pam Owner", phone: "555-0203" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", owner_id: "${owner_id}", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/quarantine-facilities"
              payload: { name: "F2", facility_type: "SHELTER", capacity: 3, daily_boarding_cents: 4000 }
              as: HealthDeptAdmin
              captures: { facility_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C10", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "FOOT", wound_category: "CATEGORY_II", victim_name: "W10", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "FACILITY", facility_id: "${facility_id}", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: HealthDeptAdmin
          trigger:
            - call: "POST /api/v1/quarantine-orders/${order_id}/complete"
              payload: { observation_outcome: "SYMPTOMATIC" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 409"
            - "response error_id == ERR_ANIMAL_SYMPTOMATIC"
            - "QuarantineOrder.${order_id}.status == ACTIVE (unchanged)"

  # -------------------------------------------------------------------------
  # RBAC
  # -------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: intake_officer_cannot_issue_quarantine_order_unauthorized
        claim_type: unauthorized_denial
        grounds: [roles.IntakeOfficer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "IntakeOfficer is not in the quarantine-order issue role set -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An identified DOG and an OPEN case for it."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C11", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_II", victim_name: "W11", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "HOME_CONFINEMENT", start_date: "2026-03-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 403"
            - "response error_id == ERR_UNAUTHORIZED"

      - name: owner_cannot_resolve_citation_unauthorized
        claim_type: unauthorized_denial
        grounds: [roles.Owner, roles.Epidemiologist, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Hearing resolution is Epidemiologist-exclusive; an Owner attempting resolve -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An Owner, a case, a Citation owned by the owner, contested."]
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Qi Owner", phone: "555-0204" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C12", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "SCRATCH", body_site: "HAND", wound_category: "CATEGORY_I", victim_name: "W12", victim_age: 30 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
            - call: "POST /api/v1/citations"
              payload: { owner_id: "${owner_id}", case_id: "${case_id}", violations: ["UNLICENSED_ANIMAL"] }
              as: AnimalControlOfficer
              captures: { cit_id: "$.data.id" }
            - call: "POST /api/v1/citations/${cit_id}/contest"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /api/v1/citations/${cit_id}/resolve"
              payload: { resolution: "DISMISSED" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 403"
            - "response error_id == ERR_UNAUTHORIZED"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: unauthorized_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no valid role header -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/owners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

  # -------------------------------------------------------------------------
  # Endpoints (side effects, listing)
  # -------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: wildlife_report_increments_region_wildlife_count
        claim_type: side_effect
        grounds: [entities.SurveillanceRegion.fields.wildlife_exposure_count, entities.WildlifeExposureReport.fields.region_id]
        distinguishing_aspect: "Filing a WildlifeExposureReport increments its SurveillanceRegion.wildlife_exposure_count by 1."
        test_recipe:
          setup: ["One SurveillanceRegion RB-WL."]
          setup_api_calls:
            - call: "POST /api/v1/surveillance-regions"
              payload: { region_code: "RB-WL", positive_threshold: 3 }
              as: HealthDeptAdmin
              captures: { region_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/surveillance-regions/${region_id}/wildlife-exposure-reports"
              payload: { species: "BAT", exposure_datetime: "2026-03-01T20:00:00Z", exposure_type: "INDOOR_FOUND_BAT" }
              as: IntakeOfficer
              captures: { report_id: "$.data.id" }
          assert:
            - "WildlifeExposureReport.${report_id}.region_id == ${region_id}"
            - "SurveillanceRegion.${region_id}.wildlife_exposure_count == 1"

      - name: citation_contest_then_uphold_keeps_owner_delinquent
        claim_type: side_effect
        grounds: [state_machines.Citation.CONTESTED_to_UPHELD, entities.Owner.fields.compliance_status]
        distinguishing_aspect: "Resolving a contested citation as UPHELD leaves the citation owed and the Owner DELINQUENT."
        test_recipe:
          setup: ["An Owner, a case, a Citation ([QUARANTINE_BREACH]) contested."]
          setup_api_calls:
            - call: "POST /api/v1/owners"
              payload: { full_name: "Ravi Owner", phone: "555-0205" }
              as: IntakeOfficer
              captures: { owner_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C13", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "SCRATCH", body_site: "HAND", wound_category: "CATEGORY_I", victim_name: "W13", victim_age: 30 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
            - call: "POST /api/v1/citations"
              payload: { owner_id: "${owner_id}", case_id: "${case_id}", violations: ["QUARANTINE_BREACH"] }
              as: AnimalControlOfficer
              captures: { cit_id: "$.data.id" }
            - call: "POST /api/v1/citations/${cit_id}/contest"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /api/v1/citations/${cit_id}/resolve"
              payload: { resolution: "UPHELD" }
              as: Epidemiologist
          assert:
            - "Citation.${cit_id}.status == UPHELD"
            - "Owner.${owner_id}.outstanding_fines_cents == 54250"
            - "Owner.${owner_id}.compliance_status == DELINQUENT"

      - name: list_bite_cases_returns_paginated_array_envelope
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /bite-cases returns a response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One BiteCase exists."]
          setup_api_calls:
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C14", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_II", victim_name: "W14", victim_age: 30 }
              as: IntakeOfficer
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "GET /api/v1/bite-cases"
              payload: {}
              as: Epidemiologist
          assert:
            - "response_type == array"
            - "response envelope includes total_count and has_more"

  # -------------------------------------------------------------------------
  # Cross-cutting complexity layers — optimistic concurrency
  # -------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: pep_recommendation_stale_case_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pep-recommendation-supersede-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "Creating a second PEPRecommendation with the pre-first-create version -> ERR_STALE_CASE_VERSION (412); the first create already bumped BiteCase.version."
        test_recipe:
          setup: ["An identified DOG (EXPIRED), a CATEGORY_II case (version 1 at creation), and one PEPRecommendation already created (case version now 2)."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "EXPIRED" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C15", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "ARM", wound_category: "CATEGORY_II", victim_name: "W15", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/bite-cases/${case_id}/pep-recommendations"
              payload: { expected_bite_case_version: "${case_v}" }
              as: Epidemiologist
              captures: { pep1_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/pep-recommendations"
              payload: { expected_bite_case_version: "${case_v}" }
              as: Epidemiologist
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 412"
            - "response error_id == ERR_STALE_CASE_VERSION"

      - name: quarantine_order_stale_case_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quarantine-order-reissue-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "Issuing a second QuarantineOrder carrying the pre-first-issue version -> ERR_STALE_CASE_VERSION (412); the first issue bumped BiteCase.version."
        test_recipe:
          setup: ["An identified DOG, a case (version 1), and one HOME_CONFINEMENT order already issued (case version now 2)."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C16", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "HAND", wound_category: "CATEGORY_II", victim_name: "W16", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "HOME_CONFINEMENT", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order1_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "HOME_CONFINEMENT", start_date: "2026-03-20T00:00:00Z" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response http status == 412"
            - "response error_id == ERR_STALE_CASE_VERSION"

  # -------------------------------------------------------------------------
  # Consistency model — immediate
  # -------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: quarantine_issue_immediately_flips_case_and_animal
        claim_type: immediate
        grounds: [state_machines.BiteCase.OPEN_to_OBSERVATION_PENDING, state_machines.Animal.REPORTED_to_UNDER_OBSERVATION]
        distinguishing_aspect: "Immediate consistency: right after issuing an order, the case reads OBSERVATION_PENDING and the animal UNDER_OBSERVATION in the same request cycle."
        test_recipe:
          setup: ["An identified DOG and an OPEN case; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /api/v1/animals"
              payload: { species: "DOG", animal_class: "DOMESTIC", identified: true, vaccination_status: "CURRENT" }
              as: IntakeOfficer
              captures: { animal_id: "$.data.id" }
            - call: "POST /api/v1/bite-cases"
              payload: { region_code: "RB-C17", incident_datetime: "2026-03-01T08:00:00Z", exposure_type: "BITE", body_site: "LEG", wound_category: "CATEGORY_II", victim_name: "W17", victim_age: 30, animal_id: "${animal_id}" }
              as: IntakeOfficer
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HealthDeptAdmin
          trigger:
            - call: "POST /api/v1/bite-cases/${case_id}/quarantine-orders"
              payload: { expected_bite_case_version: "${case_v}", animal_id: "${animal_id}", order_type: "HOME_CONFINEMENT", start_date: "2026-03-01T00:00:00Z" }
              as: Veterinarian
              captures: { order_id: "$.data.id" }
          assert:
            - "BiteCase.${case_id}.status == OBSERVATION_PENDING"
            - "Animal.${animal_id}.status == UNDER_OBSERVATION"

