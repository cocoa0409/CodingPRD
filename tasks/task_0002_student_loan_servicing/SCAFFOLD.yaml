scenario: |
  Federal Student Loan Servicing System: loan types (Direct Sub/Unsub/PLUS),
  income-driven repayment (IBR/PAYE/SAVE), PSLF public service forgiveness,
  grace/deferment/forbearance, default collection, veteran discharge

domain_name: student-loan-servicing
api_prefix: "/v1"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency

  entity_topology: flat
  # flat: Borrower, Loan, RepaymentPlan, Payment, ServicingEvent, PSLFTracker,
  # EmploymentCertification, DischargeApplication, DelinquencyRecord — all peer
  # entities with foreign-key references; URLs are flat /loans/{id}, /payments/{id}, etc.

  state_machine_shape: branching
  # Loan: IN_SCHOOL → GRACE → REPAYMENT → {DEFERMENT, FORBEARANCE, DELINQUENT, PAID_OFF,
  # DEFAULT, DISCHARGED}; with reverts from DEFERMENT/FORBEARANCE → REPAYMENT and
  # DELINQUENT → REPAYMENT, plus compound rollups onto Borrower.borrower_status.

  relationship_patterns:
    - one_to_many        # Borrower has many Loans; Loan has many Payments
    - cross_aggregate    # PSLFTracker references Payment + EmploymentCertification across aggregates

  role_model: segregation_of_duties
  # LoanServicer schedules payments, certifies employment; PSLFAdjudicator approves
  # forgiveness; VADischargeOfficer approves veteran discharge. SoD: the same
  # X-User-ID may NOT be both the LoanServicer who recorded a payment AND the
  # PSLFAdjudicator who counts it toward forgiveness on that same loan.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: ssn_last4
        type: string
        source: input
        description: Last four digits of SSN (used for matching, not full SSN).
        constraints: exactly 4 numeric digits
      - name: full_name
        type: string
        source: input
        description: Legal name on file.
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD).
      - name: email
        type: string
        source: input
        description: Contact email; unique across all Borrowers.
      - name: military_status
        type: enum
        source: input
        description: Military / veteran status used for discharge eligibility.
        default: NONE
        constraints: one of [NONE, ACTIVE_DUTY, VETERAN, DISABLED_VETERAN]
      - name: aggregate_outstanding_principal_cents
        type: integer
        source: computed
        description: Sum of Loan.outstanding_principal_cents across all non-terminal Loans.
      - name: borrower_status
        type: enum
        source: computed
        description: |
          Compound rollup over child Loans. CURRENT iff every non-terminal Loan is in
          {IN_SCHOOL, GRACE, REPAYMENT, DEFERMENT, FORBEARANCE} with no DELINQUENT loan;
          AT_RISK iff any Loan is DELINQUENT; IN_DEFAULT iff any Loan is DEFAULT;
          CLEARED iff every Loan is in {PAID_OFF, DISCHARGED}.
        constraints: one of [CURRENT, AT_RISK, IN_DEFAULT, CLEARED]

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK → Borrower.id; immutable after creation.
      - name: loan_type
        type: enum
        source: input
        description: Federal Direct Loan product type.
        constraints: one of [DIRECT_SUBSIDIZED, DIRECT_UNSUBSIDIZED, DIRECT_PLUS]
      - name: original_principal_cents
        type: integer
        source: input
        description: Principal disbursed at origination.
        constraints: ">= 1 and <= 200000000"
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: Current principal, updated by payments and capitalization events.
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: Unpaid interest accumulated since the last capitalization or payment.
      - name: interest_rate_bps
        type: integer
        source: input
        description: Annual interest rate in basis points (e.g., 533 = 5.33%).
        constraints: ">= 0 and <= 5000"
      - name: disbursement_date
        type: string
        source: input
        description: ISO 8601 date the loan was disbursed; anchors grace clock.
      - name: status
        type: enum
        source: computed
        description: Current Loan lifecycle state — see §1.2 Loan state machine.
        default: IN_SCHOOL
        constraints: one of [IN_SCHOOL, GRACE, REPAYMENT, DEFERMENT, FORBEARANCE, DELINQUENT, PAID_OFF, DEFAULT, DISCHARGED]
      - name: subsidy_active
        type: boolean
        source: computed
        description: True iff loan_type == DIRECT_SUBSIDIZED AND status IN {IN_SCHOOL, GRACE, DEFERMENT}. When true, interest accrual is paid by the government (i.e., accrued_interest_cents does NOT increment).
      - name: days_delinquent
        type: integer
        source: computed
        description: Days since last covered payment due date when status == DELINQUENT; reset to 0 on REPAYMENT re-entry, deferment, forbearance, or payoff.
      - name: capitalized_interest_cents
        type: integer
        source: computed
        description: Cumulative interest that has been capitalized into principal across the loan's lifetime.

  - name: RepaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK → Loan.id; a Loan has at most one ACTIVE RepaymentPlan at a time.
      - name: plan_type
        type: enum
        source: input
        description: Repayment plan family.
        constraints: one of [STANDARD_10YR, IBR, PAYE, SAVE]
      - name: agi_cents
        type: integer
        source: input
        description: Adjusted gross income (annual, cents). Required for IDR plans; must be null for STANDARD_10YR.
      - name: family_size
        type: integer
        source: input
        description: Household size for poverty-line calc. Required for IDR plans; must be null for STANDARD_10YR.
        constraints: ">= 1 and <= 20"
      - name: state_of_residence
        type: enum
        source: input
        description: Two-letter US state code (drives poverty line constant lookup; CONTIGUOUS uses the 48-state table; AK and HI use elevated tables).
        constraints: one of [CONTIGUOUS, AK, HI]
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: Server-computed monthly payment from §1.3 plan_monthly_payment.
      - name: status
        type: enum
        source: computed
        description: Plan lifecycle — see §1.2 RepaymentPlan state machine.
        default: PENDING
        constraints: one of [PENDING, ACTIVE, SUPERSEDED, EXPIRED]
      - name: certification_expires_on
        type: string
        source: computed
        description: ISO 8601 date; IDR plans require annual AGI recertification. Set to disbursement-aligned date + 365 days at activation; null for STANDARD_10YR.

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK → Loan.id.
      - name: amount_cents
        type: integer
        source: input
        description: Gross payment in cents.
        constraints: ">= 1"
      - name: posted_on
        type: string
        source: input
        description: ISO 8601 date (effective date the payment is applied; may be back-dated for processing within 15 days).
      - name: source
        type: enum
        source: input
        description: Where the payment originated.
        constraints: one of [ACH, CHECK, PAYROLL_DEDUCT, EMPLOYER_BENEFIT, TREASURY_OFFSET]
      - name: applied_to_interest_cents
        type: integer
        source: computed
        description: Portion of amount_cents allocated to accrued interest under the waterfall in §1.3 payment_allocation.
      - name: applied_to_principal_cents
        type: integer
        source: computed
        description: Portion allocated to principal.
      - name: applied_to_fees_cents
        type: integer
        source: computed
        description: Portion allocated to collection fees (only nonzero for loans in DEFAULT routed via TREASURY_OFFSET).
      - name: status
        type: enum
        source: computed
        description: Payment posting state.
        default: PENDING
        constraints: one of [PENDING, POSTED, REVERSED]
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the LoanServicer who created this Payment record (used for SoD checks in PSLF counting).
      - name: pslf_qualifying
        type: boolean
        source: computed
        description: True iff this Payment satisfies the PSLF criteria defined in §1.3 pslf_qualifying_payment (active EmploymentCertification, IDR or 10YR plan, on-time within +15/-0 days, full scheduled amount, status POSTED).

  - name: ServicingEvent
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK → Loan.id.
      - name: event_type
        type: enum
        source: input
        description: Servicing action that changes the loan's lifecycle.
        constraints: one of [GRACE_BEGIN, REPAYMENT_BEGIN, DEFERMENT_BEGIN, DEFERMENT_END, FORBEARANCE_BEGIN, FORBEARANCE_END, DELINQUENT_BEGIN, REPAYMENT_RESUME, DEFAULT_DECLARED, CAPITALIZATION, RECERTIFY_IDR]
      - name: effective_on
        type: string
        source: input
        description: ISO 8601 date the event takes effect.
      - name: reason_code
        type: enum
        source: input
        description: Documented justification.
        constraints: one of [SCHOOL_ENROLLMENT, ECONOMIC_HARDSHIP, MILITARY_SERVICE, MEDICAL, NATURAL_DISASTER, ADMIN_FORBEARANCE, GRACE_EXPIRY, MISSED_PAYMENTS_270D, IDR_ANNUAL_RECERT, OTHER]
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the LoanServicer who logged this event.

  - name: EmploymentCertification
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK → Borrower.id.
      - name: employer_ein
        type: string
        source: input
        description: Employer Identification Number (9 digits).
        constraints: exactly 9 numeric digits
      - name: employer_type
        type: enum
        source: input
        description: Employer category for PSLF eligibility.
        constraints: one of [GOVERNMENT_FEDERAL, GOVERNMENT_STATE_LOCAL_TRIBAL, NONPROFIT_501C3, OTHER_NONPROFIT_QUALIFYING, FOR_PROFIT, NOT_QUALIFYING]
      - name: period_start_on
        type: string
        source: input
        description: ISO 8601 date employment began.
      - name: period_end_on
        type: string
        source: input
        description: ISO 8601 date employment ended (or far-future sentinel 2999-12-31 for ongoing).
      - name: weekly_hours
        type: number
        source: input
        description: Average weekly hours worked during this period.
        constraints: ">= 0 and <= 80"
      - name: status
        type: enum
        source: computed
        description: Certification approval state — see §1.2.
        default: PENDING
        constraints: one of [PENDING, APPROVED, REJECTED]
      - name: pslf_qualifying_employer
        type: boolean
        source: computed
        description: True iff status == APPROVED AND employer_type IN {GOVERNMENT_FEDERAL, GOVERNMENT_STATE_LOCAL_TRIBAL, NONPROFIT_501C3, OTHER_NONPROFIT_QUALIFYING} AND weekly_hours >= 30.

  - name: PSLFTracker
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK → Borrower.id; at most one PSLFTracker per Borrower.
      - name: qualifying_payment_count
        type: integer
        source: computed
        description: Number of distinct Payment rows whose pslf_qualifying flag is true at the moment of the most recent recount.
      - name: required_payment_count
        type: integer
        source: system
        description: Statutory PSLF target.
        default: 120
      - name: status
        type: enum
        source: computed
        description: Forgiveness eligibility state — see §1.2.
        default: TRACKING
        constraints: one of [TRACKING, ELIGIBLE_FOR_FORGIVENESS, FORGIVEN, DENIED]
      - name: last_recount_on
        type: string
        source: computed
        description: ISO 8601 date the qualifying_payment_count was last recomputed.

  - name: DischargeApplication
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: FK → Borrower.id.
      - name: discharge_type
        type: enum
        source: input
        description: Type of discharge requested.
        constraints: one of [VETERAN_TOTAL_PERMANENT_DISABILITY, PSLF_FORGIVENESS, DEATH, CLOSED_SCHOOL]
      - name: va_certification_doc_id
        type: string
        source: input
        description: Identifier of VA disability certification document; REQUIRED iff discharge_type == VETERAN_TOTAL_PERMANENT_DISABILITY, otherwise must be null.
      - name: filed_on
        type: string
        source: input
        description: ISO 8601 date filed.
      - name: status
        type: enum
        source: computed
        description: Application lifecycle — see §1.2.
        default: SUBMITTED
        constraints: one of [SUBMITTED, UNDER_REVIEW, APPROVED, DENIED]
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the role officer (VADischargeOfficer or PSLFAdjudicator) who approved this application; null until approval.
      - name: total_discharged_principal_cents
        type: integer
        source: computed
        description: Sum of outstanding_principal_cents across all Loans transitioned to DISCHARGED by this application; set only on APPROVED.

  - name: DelinquencyRecord
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK → Loan.id.
      - name: opened_on
        type: string
        source: input
        description: ISO 8601 date the loan first crossed into DELINQUENT (first missed scheduled payment due date).
      - name: closed_on
        type: string
        source: computed
        description: ISO 8601 date the delinquency ended (cured, forborne, or escalated to DEFAULT). Null while open.
      - name: cumulative_days
        type: integer
        source: computed
        description: Running count of days the loan has been continuously delinquent since opened_on through the simulation clock.
      - name: outcome
        type: enum
        source: computed
        description: How the delinquency closed.
        default: OPEN
        constraints: one of [OPEN, CURED, FORBORNE, DEFAULTED]

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    initial_state: IN_SCHOOL
    terminal_states: [PAID_OFF, DEFAULT, DISCHARGED]
    transitions:
      - from: IN_SCHOOL
        to: GRACE
        trigger: "POST /loans/{id}/servicing-events with event_type=GRACE_BEGIN"
        actor: LoanServicer
        preconditions:
          - "loan.status == IN_SCHOOL"
          - "effective_on >= loan.disbursement_date"
        side_effects:
          - "loan.status := GRACE"
          - "loan.subsidy_active recomputed (still true for DIRECT_SUBSIDIZED)"
          - "increments loan.version by 1"

      - from: GRACE
        to: REPAYMENT
        trigger: "POST /loans/{id}/servicing-events with event_type=REPAYMENT_BEGIN (reason GRACE_EXPIRY)"
        actor: LoanServicer
        preconditions:
          - "loan.status == GRACE"
          - "effective_on >= grace_begin_date"
        side_effects:
          - "loan.status := REPAYMENT"
          - "loan.subsidy_active flips to false for DIRECT_SUBSIDIZED — accrued_interest_cents begins incrementing on the daily accrual job"
          - "creates a CAPITALIZATION ServicingEvent capitalizing accrued_interest_cents into outstanding_principal_cents (see §1.3 capitalization_amount)"
          - "increments loan.version by 1"

      - from: REPAYMENT
        to: DEFERMENT
        trigger: "POST /loans/{id}/servicing-events with event_type=DEFERMENT_BEGIN"
        actor: LoanServicer
        preconditions:
          - "loan.status == REPAYMENT"
          - "reason_code IN {SCHOOL_ENROLLMENT, ECONOMIC_HARDSHIP, MILITARY_SERVICE, MEDICAL}"
          - "no open DelinquencyRecord on this loan"
        side_effects:
          - "loan.status := DEFERMENT"
          - "loan.subsidy_active recomputed (true if DIRECT_SUBSIDIZED, else false)"
          - "loan.days_delinquent := 0"
          - "increments loan.version by 1"

      - from: DEFERMENT
        to: REPAYMENT
        trigger: "POST /loans/{id}/servicing-events with event_type=DEFERMENT_END"
        actor: LoanServicer
        preconditions:
          - "loan.status == DEFERMENT"
        side_effects:
          - "loan.status := REPAYMENT"
          - "creates a CAPITALIZATION ServicingEvent (capitalizes accrued unsubsidized interest only — never capitalizes subsidized portion)"
          - "increments loan.version by 1"

      - from: REPAYMENT
        to: FORBEARANCE
        trigger: "POST /loans/{id}/servicing-events with event_type=FORBEARANCE_BEGIN"
        actor: LoanServicer
        preconditions:
          - "loan.status == REPAYMENT OR loan.status == DELINQUENT"
          - "reason_code IN {ECONOMIC_HARDSHIP, NATURAL_DISASTER, ADMIN_FORBEARANCE, MEDICAL}"
        side_effects:
          - "loan.status := FORBEARANCE"
          - "loan.subsidy_active := false (forbearance NEVER subsidizes interest)"
          - "if previously DELINQUENT: close the open DelinquencyRecord with outcome=FORBORNE"
          - "loan.days_delinquent := 0"
          - "increments loan.version by 1"

      - from: FORBEARANCE
        to: REPAYMENT
        trigger: "POST /loans/{id}/servicing-events with event_type=FORBEARANCE_END"
        actor: LoanServicer
        preconditions:
          - "loan.status == FORBEARANCE"
        side_effects:
          - "loan.status := REPAYMENT"
          - "creates a CAPITALIZATION ServicingEvent capitalizing ALL accrued_interest_cents into outstanding_principal_cents"
          - "increments loan.version by 1"

      - from: REPAYMENT
        to: DELINQUENT
        trigger: "POST /_clock/advance crossing a scheduled monthly due date with no qualifying Payment posted"
        actor: system
        preconditions:
          - "loan.status == REPAYMENT"
          - "an ACTIVE RepaymentPlan exists with monthly_payment_cents > 0"
          - "as of the new clock, the scheduled monthly due date has passed without a POSTED Payment whose amount_cents >= monthly_payment_cents and posted_on falls within [due_date - 0d, due_date + 15d]"
        side_effects:
          - "loan.status := DELINQUENT"
          - "open a new DelinquencyRecord with opened_on = the missed due_date"
          - "loan.days_delinquent := (current clock date - missed_due_date)"
          - "increments loan.version by 1"

      - from: DELINQUENT
        to: REPAYMENT
        trigger: "POST /payments — payment posts that cures the missed schedule"
        actor: LoanServicer
        preconditions:
          - "loan.status == DELINQUENT"
          - "incoming Payment.amount_cents >= every missed scheduled monthly_payment_cents since DelinquencyRecord.opened_on (cures the full arrears)"
        side_effects:
          - "loan.status := REPAYMENT"
          - "close the open DelinquencyRecord with outcome=CURED"
          - "loan.days_delinquent := 0"
          - "increments loan.version by 1"

      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /_clock/advance crossing day-271 of an open DelinquencyRecord (or explicit POST /loans/{id}/servicing-events event_type=DEFAULT_DECLARED reason=MISSED_PAYMENTS_270D)"
        actor: system
        preconditions:
          - "loan.status == DELINQUENT"
          - "open DelinquencyRecord.cumulative_days >= 270 (boundary: 270 days triggers; 269 does NOT — per §1.4 priority 30)"
        side_effects:
          - "loan.status := DEFAULT"
          - "close the open DelinquencyRecord with outcome=DEFAULTED"
          - "creates a CAPITALIZATION ServicingEvent capitalizing all accrued interest into outstanding_principal_cents"
          - "any ACTIVE RepaymentPlan transitions to EXPIRED"
          - "borrower.borrower_status recomputes to IN_DEFAULT (cross-entity bubble-up)"
          - "increments loan.version by 1"

      - from: REPAYMENT
        to: PAID_OFF
        trigger: "POST /payments — payment posts that brings outstanding_principal_cents + accrued_interest_cents to 0"
        actor: LoanServicer
        preconditions:
          - "loan.status IN {REPAYMENT, DELINQUENT, FORBEARANCE, DEFERMENT}"
          - "applied_to_principal_cents + applied_to_interest_cents >= outstanding_principal_cents + accrued_interest_cents at posting"
        side_effects:
          - "loan.status := PAID_OFF"
          - "loan.outstanding_principal_cents := 0"
          - "loan.accrued_interest_cents := 0"
          - "any open DelinquencyRecord closes with outcome=CURED"
          - "any ACTIVE RepaymentPlan transitions to EXPIRED"
          - "increments loan.version by 1"

      - from: REPAYMENT
        to: DISCHARGED
        trigger: "DischargeApplication transitions to APPROVED (auto-cascade)"
        actor: system
        preconditions:
          - "loan.status NOT IN {PAID_OFF, DISCHARGED}"
          - "the approved DischargeApplication.borrower_id == loan.borrower_id"
          - "if DischargeApplication.discharge_type == PSLF_FORGIVENESS, the loan's borrower has PSLFTracker.status == ELIGIBLE_FOR_FORGIVENESS"
        side_effects:
          - "loan.status := DISCHARGED"
          - "loan.outstanding_principal_cents and accrued_interest_cents preserved (history) but no further accrual"
          - "any open DelinquencyRecord closes with outcome=CURED"
          - "any ACTIVE RepaymentPlan transitions to EXPIRED"
          - "increments loan.version by 1"

  - entity: RepaymentPlan
    initial_state: PENDING
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /repayment-plans (synchronous activation when created against a Loan with no other ACTIVE plan)"
        actor: LoanServicer
        preconditions:
          - "loan.status IN {GRACE, REPAYMENT, DEFERMENT, FORBEARANCE, DELINQUENT}"
          - "no other RepaymentPlan with status=ACTIVE exists for this loan_id"
          - "if plan_type IN {IBR, PAYE, SAVE}: agi_cents and family_size are provided and family_size >= 1"
          - "if plan_type == STANDARD_10YR: agi_cents and family_size are both null"
          - "expected_loan_version matches loan.version"
        side_effects:
          - "plan.monthly_payment_cents := result of §1.3 plan_monthly_payment"
          - "plan.status := ACTIVE"
          - "plan.certification_expires_on := (clock_date + 365 days) if plan_type IN {IBR, PAYE, SAVE}, else null"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /repayment-plans creating a new plan against the same loan (with matching expected_loan_version)"
        actor: LoanServicer
        preconditions:
          - "another RepaymentPlan for the same loan_id is moving from PENDING to ACTIVE"
        side_effects:
          - "prior plan.status := SUPERSEDED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "Loan transitions to PAID_OFF, DEFAULT, or DISCHARGED (cascade)"
        actor: system
        preconditions:
          - "parent loan.status IN {PAID_OFF, DEFAULT, DISCHARGED}"
        side_effects:
          - "plan.status := EXPIRED"

  - entity: EmploymentCertification
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /employment-certifications/{id}/approve"
        actor: LoanServicer
        preconditions:
          - "employer_ein is exactly 9 digits"
          - "period_end_on >= period_start_on"
        side_effects:
          - "certification.status := APPROVED"
          - "certification.pslf_qualifying_employer recomputed"
          - "all PSLFTracker rows for borrower_id re-evaluate qualifying_payment_count via §1.3 pslf_qualifying_payment (cross-entity propagation; may also flip PSLFTracker.status — see PSLFTracker machine)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /employment-certifications/{id}/reject"
        actor: LoanServicer
        preconditions:
          - "certification.status == PENDING"
        side_effects:
          - "certification.status := REJECTED"

  - entity: PSLFTracker
    initial_state: TRACKING
    terminal_states: [FORGIVEN, DENIED]
    transitions:
      - from: TRACKING
        to: ELIGIBLE_FOR_FORGIVENESS
        trigger: "system recount after Payment.POSTED, EmploymentCertification.APPROVED, or POST /pslf-trackers/{id}/recount"
        actor: system
        preconditions:
          - "qualifying_payment_count (recomputed via §1.3 pslf_qualifying_payment) >= required_payment_count (default 120; boundary: 120 triggers, 119 does NOT)"
        side_effects:
          - "tracker.status := ELIGIBLE_FOR_FORGIVENESS"
          - "tracker.last_recount_on := clock_date"

      - from: ELIGIBLE_FOR_FORGIVENESS
        to: FORGIVEN
        trigger: "DischargeApplication.discharge_type == PSLF_FORGIVENESS transitions to APPROVED"
        actor: system
        preconditions:
          - "tracker.status == ELIGIBLE_FOR_FORGIVENESS"
        side_effects:
          - "tracker.status := FORGIVEN"
          - "all non-terminal Loans for borrower_id cascade to DISCHARGED (see Loan REPAYMENT→DISCHARGED)"

      - from: TRACKING
        to: DENIED
        trigger: "POST /pslf-trackers/{id}/deny"
        actor: PSLFAdjudicator
        preconditions:
          - "tracker.status == TRACKING"
        side_effects:
          - "tracker.status := DENIED"

  - entity: DischargeApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /discharge-applications/{id}/begin-review"
        actor: VADischargeOfficer | PSLFAdjudicator
        preconditions:
          - "application.status == SUBMITTED"
          - "actor role matches discharge_type (VADischargeOfficer for VETERAN_TOTAL_PERMANENT_DISABILITY; PSLFAdjudicator for PSLF_FORGIVENESS; LoanServicer for DEATH or CLOSED_SCHOOL is rejected here)"
        side_effects:
          - "application.status := UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /discharge-applications/{id}/approve"
        actor: VADischargeOfficer | PSLFAdjudicator
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "if discharge_type == VETERAN_TOTAL_PERMANENT_DISABILITY: borrower.military_status IN {VETERAN, DISABLED_VETERAN} AND va_certification_doc_id is non-null AND actor role == VADischargeOfficer"
          - "if discharge_type == PSLF_FORGIVENESS: PSLFTracker.status == ELIGIBLE_FOR_FORGIVENESS AND actor role == PSLFAdjudicator AND the acting X-User-ID has NOT recorded any Payment counted toward qualifying_payment_count for this borrower (segregation of duties — see §1.4 priority 12)"
        side_effects:
          - "application.status := APPROVED"
          - "application.approved_by_user_id := X-User-ID"
          - "cascade: each non-terminal Loan for borrower_id transitions to DISCHARGED (see Loan REPAYMENT→DISCHARGED)"
          - "application.total_discharged_principal_cents := sum of outstanding_principal_cents across all cascaded Loans, computed BEFORE the cascade resets them"
          - "borrower.borrower_status recomputes (bubble-up)"
          - "if discharge_type == PSLF_FORGIVENESS: PSLFTracker.status := FORGIVEN (see PSLFTracker machine)"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /discharge-applications/{id}/deny"
        actor: VADischargeOfficer | PSLFAdjudicator
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "application.status := DENIED"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /payments (synchronous on creation when the parent Loan is in a postable status)"
        actor: LoanServicer
        preconditions:
          - "loan.status IN {GRACE, REPAYMENT, DEFERMENT, FORBEARANCE, DELINQUENT, DEFAULT}"
          - "amount_cents >= 1"
          - "posted_on >= (clock_date - 15 days) AND posted_on <= clock_date (no future-dated payments; back-date window 15 days)"
        side_effects:
          - "applied_to_interest_cents, applied_to_principal_cents, applied_to_fees_cents computed via §1.3 payment_allocation"
          - "loan.accrued_interest_cents decreases by applied_to_interest_cents"
          - "loan.outstanding_principal_cents decreases by applied_to_principal_cents"
          - "if loan.outstanding_principal_cents + loan.accrued_interest_cents == 0: cascade Loan → PAID_OFF (see Loan machine)"
          - "if loan.status == DELINQUENT and incoming Payment cures: cascade DELINQUENT → REPAYMENT (see Loan machine)"
          - "trigger PSLFTracker recount (system recomputes pslf_qualifying flag for this Payment via §1.3 pslf_qualifying_payment)"
          - "increments loan.version by 1"

      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: LoanServicer
        preconditions:
          - "payment.status == POSTED"
          - "payment.posted_on >= (clock_date - 30 days)"
        side_effects:
          - "payment.status := REVERSED"
          - "loan.outstanding_principal_cents increases by applied_to_principal_cents"
          - "loan.accrued_interest_cents increases by applied_to_interest_cents"
          - "trigger PSLFTracker recount (this Payment no longer contributes to qualifying_payment_count)"
          - "if recount drops qualifying_payment_count below required_payment_count AND tracker.status == ELIGIBLE_FOR_FORGIVENESS: tracker.status reverts to TRACKING"
          - "increments loan.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /repayment-plans"
    occ_field: "expected_loan_version"
    description: |
      Creating a new RepaymentPlan against a Loan whose version has advanced
      since the client last observed it is rejected. The product semantics
      legitimately permit a new plan to supersede the prior ACTIVE plan
      (ACTIVE → SUPERSEDED transition), so two sequential creates with the
      same observed version are both natural successes — until OCC catches
      the second one as having a stale view of the loan. The second create
      uses expected_loan_version equal to the value the client saw before
      the first create bumped it, so it is deterministically rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: discharge-approve-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /discharge-applications/{id}/approve"
    occ_field: "expected_loan_version"
    description: |
      Approving a DischargeApplication carries an OCC check against the
      borrower's loan(s): the request body lists each non-terminal loan_id
      with its observed version. If any loan's version advanced since
      observation (because a payment was posted, a servicing event fired,
      or another plan change ran on it), the discharge approval is
      rejected to prevent silent overwrites of cascaded state. Without OCC
      the loser would otherwise succeed (the loan is still non-terminal
      and the discharge_type's eligibility still holds).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: plan_monthly_payment
    trigger: "On POST /repayment-plans (Plan PENDING → ACTIVE transition); on POST /repayment-plans/{id}/recertify (annual recert)"
    algorithm: tiered_pricing
    formula: |
      # Anchor inputs
      P = loan.outstanding_principal_cents                       # cents
      r_monthly = loan.interest_rate_bps / 10000 / 12            # monthly rate
      n = 120                                                    # 10-yr default term in months

      if plan.plan_type == "STANDARD_10YR":
          # Standard amortization
          if r_monthly == 0:
              monthly = P / n
          else:
              monthly = P * r_monthly * (1 + r_monthly)**n / ((1 + r_monthly)**n - 1)
          return round_half_up(monthly)

      # IDR plans: compute discretionary income first
      POVERTY_LINE = POVERTY_LINES_BY_STATE[plan.state_of_residence][plan.family_size]   # ANNUAL cents
      if plan.plan_type == "IBR":
          discretionary_annual = max(0, plan.agi_cents - 150 * POVERTY_LINE / 100)       # AGI minus 150% poverty
          idr_monthly = round_half_up((discretionary_annual * 0.15) / 12)                # 15% of discretionary, monthly
          # IBR cap: never exceeds STANDARD_10YR payment
          standard = plan_monthly_payment_standard_10yr(loan)                            # recursive call
          return min(idr_monthly, standard)
      elif plan.plan_type == "PAYE":
          discretionary_annual = max(0, plan.agi_cents - 150 * POVERTY_LINE / 100)
          idr_monthly = round_half_up((discretionary_annual * 0.10) / 12)
          standard = plan_monthly_payment_standard_10yr(loan)
          return min(idr_monthly, standard)
      elif plan.plan_type == "SAVE":
          # SAVE protects MORE income: 225% poverty line, then 5% (undergrad-style assumption)
          discretionary_annual = max(0, plan.agi_cents - 225 * POVERTY_LINE / 100)
          idr_monthly = round_half_up((discretionary_annual * 0.05) / 12)
          return idr_monthly   # SAVE has NO standard-payment cap
    input_set: "loan.outstanding_principal_cents at the moment of plan creation/recert; plan.agi_cents and family_size from request body; POVERTY_LINES_BY_STATE constant table"
    constants:
      POVERTY_LINES_BY_STATE_CONTIGUOUS:    # ANNUAL cents per family_size (2024 HHS approximation; FIXED here for determinism)
        1: 1506000      # $15,060
        2: 2034000      # $20,340
        3: 2562000      # $25,620
        4: 3090000      # $30,900
        5: 3618000
      POVERTY_LINES_BY_STATE_AK:
        1: 1883000
        2: 2542000
        3: 3201000
        4: 3860000
        5: 4519000
      POVERTY_LINES_BY_STATE_HI:
        1: 1732000
        2: 2339000
        3: 2946000
        4: 3553000
        5: 4160000
      IBR_DISCRETIONARY_THRESHOLD_PCT: 150
      PAYE_DISCRETIONARY_THRESHOLD_PCT: 150
      SAVE_DISCRETIONARY_THRESHOLD_PCT: 225
      IBR_PAYMENT_PCT: 0.15
      PAYE_PAYMENT_PCT: 0.10
      SAVE_PAYMENT_PCT: 0.05
      STANDARD_TERM_MONTHS: 120
    precision: "monthly payments rounded to whole cents, round_half_up; intermediate division on cents kept exact (Python Decimal)"
    variants:
      - name: standard_amortization
        when: "plan.plan_type == STANDARD_10YR"
        difference: "Uses textbook amortization with no discretionary-income concept; ignores agi_cents and family_size (which must be null)."
      - name: idr_with_standard_cap
        when: "plan.plan_type IN {IBR, PAYE}"
        difference: "Computes IDR formula, then takes min(idr, standard_10yr). For a borrower with high principal and modest AGI, idr_monthly < standard so the cap is inactive; for a borrower with small principal and modest AGI, idr_monthly may exceed standard so the cap binds — same AGI/family/state inputs produce different active formulas."
      - name: idr_uncapped_save
        when: "plan.plan_type == SAVE"
        difference: "Uses 225% poverty threshold + 5% rate, with NO standard cap, so SAVE can produce a payment SMALLER than IBR/PAYE on the same inputs (or LARGER than STANDARD_10YR on high principals, which IBR/PAYE would have capped)."

  - name: payment_allocation
    trigger: "On Payment PENDING → POSTED transition"
    algorithm: waterfall_allocation
    formula: |
      # Strict waterfall, applied IN THIS ORDER (rounding occurs per-bucket as integer cents):
      remaining = payment.amount_cents

      # Bucket 1: collection fees — ONLY if loan.status == DEFAULT AND payment.source == TREASURY_OFFSET
      if loan.status == "DEFAULT" and payment.source == "TREASURY_OFFSET":
          fees_due = floor(payment.amount_cents * 0.1825)        # 18.25% statutory collection fee on offsets
          applied_to_fees = min(remaining, fees_due)
      else:
          applied_to_fees = 0
      remaining -= applied_to_fees

      # Bucket 2: accrued interest
      applied_to_interest = min(remaining, loan.accrued_interest_cents)
      remaining -= applied_to_interest

      # Bucket 3: outstanding principal
      applied_to_principal = min(remaining, loan.outstanding_principal_cents)
      remaining -= applied_to_principal

      # Bucket 4: overpayment is REJECTED — payment with leftover after principal is full payoff;
      # if any remaining > 0 after these three buckets and the loan is not paid off,
      # the request fails with ERR_PAYMENT_EXCEEDS_BALANCE (see §1.4 priority 27).
      assert remaining == 0 OR (loan.outstanding_principal_cents - applied_to_principal == 0 AND loan.accrued_interest_cents - applied_to_interest == 0)
    input_set: "amount_cents from request body; loan.accrued_interest_cents and outstanding_principal_cents AT THE INSTANT of posting (no batching with other pending Payments)"
    constants:
      TREASURY_OFFSET_FEE_PCT: 0.1825
    precision: "All allocations integer cents; fees computed as floor(amount * 0.1825) (per-payment, NOT per-line-item)."

  - name: capitalization_amount
    trigger: "On Loan transitions GRACE→REPAYMENT, FORBEARANCE→REPAYMENT, DEFERMENT→REPAYMENT, DELINQUENT→DEFAULT; or explicit CAPITALIZATION ServicingEvent"
    algorithm: chronological
    formula: |
      # PINNED EVALUATION ORDER (combinatorial rule 2c — circular-looking dependency):
      # 1. Daily accrual job has already run up through the day-before the transition's effective_on.
      # 2. Compute capitalizable amount per the transition type:
      capitalizable = loan.accrued_interest_cents
      if transition == "DEFERMENT_END" and loan.loan_type == "DIRECT_SUBSIDIZED":
          # Subsidized portion accrued during deferment is paid by the government — DO NOT capitalize it.
          # Only the portion accrued during any unsubsidized period within the deferment window capitalizes.
          # In this scaffold's model, DIRECT_SUBSIDIZED during DEFERMENT has subsidy_active=true throughout,
          # so capitalizable = 0.
          capitalizable = 0
      # 3. ORDER MATTERS: first add to principal, THEN zero out accrued interest, THEN bump version.
      loan.outstanding_principal_cents += capitalizable
      loan.capitalized_interest_cents += capitalizable
      loan.accrued_interest_cents = 0
      loan.version += 1
    input_set: "loan.accrued_interest_cents AT effective_on; loan.loan_type; transition reason"
    constants:
      DAILY_ACCRUAL_BASIS_DAYS: 365   # 365 (not 360) for federal direct loans

  - name: pslf_qualifying_payment
    trigger: "On Payment.POSTED, on Payment.REVERSED, on EmploymentCertification.APPROVED, on POST /pslf-trackers/{id}/recount"
    algorithm: aggregation
    formula: |
      # A Payment counts as PSLF-qualifying iff ALL of the following hold at recount time:
      #   (a) payment.status == POSTED (REVERSED payments do not count)
      #   (b) payment.posted_on falls within an APPROVED EmploymentCertification whose
      #       pslf_qualifying_employer == true AND borrower_id matches payment.loan_id's borrower
      #       (i.e., certification.period_start_on <= payment.posted_on <= certification.period_end_on)
      #   (c) the Loan tied to payment.loan_id had an ACTIVE RepaymentPlan with plan_type IN
      #       {STANDARD_10YR, IBR, PAYE, SAVE} on payment.posted_on
      #   (d) payment.amount_cents >= the plan.monthly_payment_cents in force on payment.posted_on
      #   (e) payment.posted_on is within [scheduled_due_date - 0d, scheduled_due_date + 15d]
      #       for the monthly billing cycle that contains posted_on
      #   (f) SEGREGATION OF DUTIES: payment.recorded_by_user_id != tracker.last_recount_actor_id
      #       (this check is operational on the FORGIVENESS approval step, not on the per-payment flag)
      # qualifying_payment_count = COUNT(distinct Payment.id satisfying (a)-(e))
    input_set: "All Payments for all Loans of this borrower; all APPROVED EmploymentCertifications for this borrower; all active RepaymentPlans on payment.posted_on"
    constants:
      ON_TIME_BACK_WINDOW_DAYS: 0
      ON_TIME_FORWARD_WINDOW_DAYS: 15
      PSLF_REQUIRED_COUNT: 120
    precision: "Integer count; no rounding."
    variants:
      - name: per_payment_strict_match
        when: "Recount triggered immediately after Payment.POSTED — uses the exact monthly_payment_cents recorded in plan history"
        difference: |
          Payment qualifies only if amount_cents >= plan.monthly_payment_cents AS OF payment.posted_on.
          A subsequent plan recertification that lowers monthly_payment_cents does NOT retroactively make
          an earlier underpayment qualify.
      - name: per_payment_lookback_relaxed
        when: "Recount triggered after EmploymentCertification.APPROVED that retroactively covers older payments"
        difference: |
          The relaxed-lookback variant evaluates Payments by their posted_on against the NEWLY-APPROVED
          certification window; payments previously excluded because no certification covered their date
          may now qualify. The strict per_payment_strict_match variant evaluates each payment ONCE at
          POSTED time and never re-flips. The two variants produce DIFFERENT qualifying_payment_count
          values on the SAME stored data: strict undercounts retroactive certifications, relaxed picks
          them up. The scaffold PINS the relaxed variant for the official tracker recount.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present on every request to a non-public endpoint."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all except [POST /borrowers]

  - priority: 2
    category: auth
    check: "X-User-Role is one of [Borrower, LoanServicer, PSLFAdjudicator, VADischargeOfficer]."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 10
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 11
    category: business_referential
    check: "For a Borrower acting on their own resources, X-User-ID equals the Loan/Payment/etc.'s borrower_id (entity_backed identity)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Borrower-role endpoints"

  - priority: 12
    category: business_safety
    check: |
      Segregation of duties on DischargeApplication APPROVAL for PSLF_FORGIVENESS: the acting
      PSLFAdjudicator's X-User-ID MUST NOT appear in any Payment.recorded_by_user_id for this
      borrower's payments that contributed to qualifying_payment_count.
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /discharge-applications/{id}/approve"

  - priority: 20
    category: existence
    check: "Every entity referenced by path or body (borrower_id, loan_id, payment_id, certification_id, application_id, tracker_id) exists; validated left-to-right in the URL path before body refs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 21
    category: state
    check: |
      State precondition for the requested action holds (e.g., creating a Payment requires
      loan.status IN {GRACE, REPAYMENT, DEFERMENT, FORBEARANCE, DELINQUENT, DEFAULT};
      DEFERMENT_END requires loan.status == DEFERMENT; GRACE_BEGIN requires loan.status == IN_SCHOOL;
      REPAYMENT_BEGIN requires loan.status == GRACE).
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints, payments, plan creation, certifications

  - priority: 22
    category: state
    check: "Cross-entity state precondition: creating a Payment requires the Loan's borrower not to be on a fully DISCHARGED roster (every Loan for borrower in {DISCHARGED, PAID_OFF})."
    error_id: ERR_BORROWER_DISCHARGED
    http_status: 409
    applies_to: "POST /payments"

  - priority: 23
    category: state
    check: "Cross-entity state precondition: creating a DischargeApplication with discharge_type=VETERAN_TOTAL_PERMANENT_DISABILITY requires Borrower.military_status IN {VETERAN, DISABLED_VETERAN}."
    error_id: ERR_NOT_VETERAN
    http_status: 422
    applies_to: "POST /discharge-applications"

  - priority: 24
    category: state
    check: "Creating a RepaymentPlan requires no other RepaymentPlan with status=ACTIVE on the same loan_id (the supersede semantics is the explicit OCC path through §1.2.1 plan-create-stale-loan; without OCC the second create still must observe the prior plan)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /repayment-plans"

  - priority: 25
    category: business_constraint
    check: |
      RepaymentPlan body schema by plan_type:
        - if plan_type == STANDARD_10YR: agi_cents == null AND family_size == null
        - if plan_type IN {IBR, PAYE, SAVE}: agi_cents > 0 AND family_size >= 1 AND family_size <= 20
        - state_of_residence is one of [CONTIGUOUS, AK, HI]
    error_id: ERR_PLAN_FIELDS_INVALID
    http_status: 422
    applies_to: "POST /repayment-plans, POST /repayment-plans/{id}/recertify"

  - priority: 26
    category: business_temporal
    check: "Payment.posted_on falls in [clock_date - 15 days, clock_date] (no future-dated payments; back-date window 15 days). Half-open boundary: posted_on == clock_date - 15 PASSES; posted_on == clock_date - 16 FAILS."
    error_id: ERR_PAYMENT_DATE_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /payments"

  - priority: 27
    category: business_fiscal
    check: "Payment.amount_cents does not exceed loan.outstanding_principal_cents + loan.accrued_interest_cents (+ fees due if DEFAULT/TREASURY_OFFSET). Strict inequality boundary: amount == sum-of-buckets PASSES (full payoff); amount > sum FAILS."
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /payments"

  - priority: 28
    category: business_safety
    check: "EmploymentCertification.weekly_hours <= 80 AND >= 0; period_end_on >= period_start_on; employer_ein is exactly 9 digits."
    error_id: ERR_CERTIFICATION_FIELDS_INVALID
    http_status: 422
    applies_to: "POST /employment-certifications"

  - priority: 29
    category: business_referential
    check: |
      Cross-entity reference rule for DischargeApplication.va_certification_doc_id:
        - REQUIRED (non-null) iff discharge_type == VETERAN_TOTAL_PERMANENT_DISABILITY
        - MUST be null otherwise
    error_id: ERR_VA_DOC_REQUIRED_OR_FORBIDDEN
    http_status: 422
    applies_to: "POST /discharge-applications"

  - priority: 30
    category: business_temporal
    check: "DEFAULT_DECLARED via servicing-events requires DelinquencyRecord.cumulative_days >= 270 (boundary: 270 triggers, 269 does NOT)."
    error_id: ERR_DEFAULT_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /loans/{id}/servicing-events with event_type=DEFAULT_DECLARED"

  - priority: 31
    category: business_constraint
    check: "Borrower.email is unique across all Borrowers (case-insensitive)."
    error_id: ERR_EMAIL_DUPLICATE
    http_status: 409
    applies_to: "POST /borrowers"

  - priority: 40
    category: state
    check: "OCC: expected_loan_version on POST /repayment-plans and POST /discharge-applications/{id}/approve matches loan.version. Mismatch returns ERR_STALE_VERSION (412) per §1.2.1."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /repayment-plans, POST /discharge-applications/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Borrowers ----
  - method: POST
    path: "/v1/borrowers"
    description: "Create a new Borrower."
    roles: [LoanServicer]
    code: 201
    input: [ssn_last4, full_name, date_of_birth, email, "military_status?"]
    output: Borrower
    side_effects:
      - "Borrower row created; borrower_status initialized to CURRENT (no loans yet)"

  - method: GET
    path: "/v1/borrowers/{borrower_id}"
    description: "Fetch a Borrower including computed aggregate_outstanding_principal_cents and borrower_status."
    roles: [LoanServicer, PSLFAdjudicator, VADischargeOfficer, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: GET
    path: "/v1/borrowers"
    description: "List Borrowers (paginated)."
    roles: [LoanServicer, PSLFAdjudicator, VADischargeOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Borrower[]
    side_effects: []

  - method: PATCH
    path: "/v1/borrowers/{borrower_id}/military-status"
    description: "Update a Borrower's military_status (used to flag VETERAN/DISABLED_VETERAN for discharge eligibility)."
    roles: [LoanServicer]
    code: 200
    input: [military_status]
    output: Borrower
    side_effects:
      - "Borrower.military_status updated"

  # ---- Loans ----
  - method: POST
    path: "/v1/loans"
    description: "Create a new Loan (originate)."
    roles: [LoanServicer]
    code: 201
    input: [borrower_id, loan_type, original_principal_cents, interest_rate_bps, disbursement_date]
    output: Loan
    side_effects:
      - "Loan row created with status=IN_SCHOOL, outstanding_principal_cents=original_principal_cents, accrued_interest_cents=0, capitalized_interest_cents=0"
      - "Borrower.aggregate_outstanding_principal_cents recomputed"

  - method: GET
    path: "/v1/loans/{loan_id}"
    description: "Fetch a Loan."
    roles: [LoanServicer, PSLFAdjudicator, VADischargeOfficer, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/v1/loans"
    description: "List Loans (paginated, filterable by borrower_id and status)."
    roles: [LoanServicer, PSLFAdjudicator, VADischargeOfficer, Borrower]
    code: 200
    input: ["borrower_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/v1/loans/{loan_id}/servicing-events"
    description: "Log a ServicingEvent and apply its lifecycle transition to the Loan (drives GRACE_BEGIN, REPAYMENT_BEGIN, DEFERMENT_BEGIN/END, FORBEARANCE_BEGIN/END, DEFAULT_DECLARED, CAPITALIZATION, RECERTIFY_IDR)."
    roles: [LoanServicer]
    code: 201
    input: [event_type, effective_on, reason_code]
    output: ServicingEvent
    side_effects:
      - "Loan.status transitions per the §1.2 Loan machine for the given event_type"
      - "Per-transition side effects (capitalization, subsidy_active recompute, delinquency-record close/open, version bump) fire"
      - "Borrower.borrower_status recomputed (bubble-up)"
      - "increments loan.version by 1"

  - method: GET
    path: "/v1/loans/{loan_id}/servicing-events"
    description: "List ServicingEvents for a Loan in chronological order (by effective_on, then created_at as tie-break)."
    roles: [LoanServicer, PSLFAdjudicator, VADischargeOfficer, Borrower]
    code: 200
    input: ["limit?", "offset?"]
    output: ServicingEvent[]
    side_effects: []

  # ---- Repayment Plans ----
  - method: POST
    path: "/v1/repayment-plans"
    description: "Create a RepaymentPlan; activates synchronously and supersedes any prior ACTIVE plan for the same loan_id."
    roles: [LoanServicer, Borrower]
    code: 201
    input: [loan_id, plan_type, "agi_cents?", "family_size?", state_of_residence, expected_loan_version]
    output: RepaymentPlan
    side_effects:
      - "monthly_payment_cents computed via §1.3 plan_monthly_payment"
      - "Prior ACTIVE plan for this loan transitions to SUPERSEDED (if any)"
      - "New plan.status := ACTIVE"
      - "increments loan.version by 1"
      - "OCC: rejects with ERR_STALE_VERSION (412) per §1.2.1 plan-create-stale-loan if expected_loan_version != loan.version"

  - method: POST
    path: "/v1/repayment-plans/{plan_id}/recertify"
    description: "Annual AGI recertification for IDR plans; recomputes monthly_payment_cents and resets certification_expires_on."
    roles: [LoanServicer, Borrower]
    code: 200
    input: [agi_cents, family_size]
    output: RepaymentPlan
    side_effects:
      - "monthly_payment_cents recomputed"
      - "certification_expires_on := clock_date + 365 days"

  - method: GET
    path: "/v1/repayment-plans/{plan_id}"
    description: "Fetch a RepaymentPlan."
    roles: [LoanServicer, PSLFAdjudicator, Borrower]
    code: 200
    input: []
    output: RepaymentPlan
    side_effects: []

  - method: GET
    path: "/v1/repayment-plans"
    description: "List RepaymentPlans (paginated, filterable by loan_id and status)."
    roles: [LoanServicer, PSLFAdjudicator, Borrower]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: RepaymentPlan[]
    side_effects: []

  # ---- Payments ----
  - method: POST
    path: "/v1/payments"
    description: "Record a Payment; posts synchronously, applies waterfall, may cascade Loan state."
    roles: [LoanServicer]
    code: 201
    input: [loan_id, amount_cents, posted_on, source]
    output: Payment
    side_effects:
      - "applied_to_fees_cents, applied_to_interest_cents, applied_to_principal_cents computed via §1.3 payment_allocation"
      - "loan.accrued_interest_cents and outstanding_principal_cents decrease"
      - "Payment.recorded_by_user_id := X-User-ID"
      - "if loan now fully paid: cascade Loan → PAID_OFF (close any open delinquency)"
      - "if loan was DELINQUENT and arrears cured: cascade DELINQUENT → REPAYMENT, close DelinquencyRecord with outcome=CURED"
      - "PSLFTracker for this borrower recomputes qualifying_payment_count and may transition TRACKING → ELIGIBLE_FOR_FORGIVENESS"
      - "Borrower.borrower_status recomputed (bubble-up)"
      - "increments loan.version by 1"

  - method: GET
    path: "/v1/payments/{payment_id}"
    description: "Fetch a Payment."
    roles: [LoanServicer, PSLFAdjudicator, Borrower]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/v1/payments"
    description: "List Payments (filter by loan_id, status; paginated)."
    roles: [LoanServicer, PSLFAdjudicator, Borrower]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/v1/payments/{payment_id}/reverse"
    description: "Reverse a previously POSTED Payment (within 30 days)."
    roles: [LoanServicer]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Payment.status := REVERSED"
      - "loan balances un-applied"
      - "PSLFTracker recount fires; tracker may revert ELIGIBLE_FOR_FORGIVENESS → TRACKING"
      - "increments loan.version by 1"

  # ---- Employment Certifications ----
  - method: POST
    path: "/v1/employment-certifications"
    description: "Submit an EmploymentCertification (PSLF employer attestation)."
    roles: [LoanServicer, Borrower]
    code: 201
    input: [borrower_id, employer_ein, employer_type, period_start_on, period_end_on, weekly_hours]
    output: EmploymentCertification
    side_effects:
      - "Certification row created with status=PENDING"

  - method: POST
    path: "/v1/employment-certifications/{certification_id}/approve"
    description: "Approve a PENDING certification."
    roles: [LoanServicer]
    code: 200
    input: []
    output: EmploymentCertification
    side_effects:
      - "certification.status := APPROVED"
      - "pslf_qualifying_employer recomputed"
      - "PSLFTracker for borrower recomputes qualifying_payment_count (may transition TRACKING → ELIGIBLE_FOR_FORGIVENESS)"

  - method: POST
    path: "/v1/employment-certifications/{certification_id}/reject"
    description: "Reject a PENDING certification."
    roles: [LoanServicer]
    code: 200
    input: []
    output: EmploymentCertification
    side_effects:
      - "certification.status := REJECTED"

  - method: GET
    path: "/v1/employment-certifications"
    description: "List certifications (filter by borrower_id, status; paginated)."
    roles: [LoanServicer, PSLFAdjudicator, Borrower]
    code: 200
    input: ["borrower_id?", "status?", "limit?", "offset?"]
    output: EmploymentCertification[]
    side_effects: []

  # ---- PSLF Trackers ----
  - method: POST
    path: "/v1/pslf-trackers"
    description: "Initialize a PSLFTracker for a Borrower (one per borrower)."
    roles: [LoanServicer, PSLFAdjudicator]
    code: 201
    input: [borrower_id]
    output: PSLFTracker
    side_effects:
      - "Tracker row created with status=TRACKING, qualifying_payment_count=0"

  - method: POST
    path: "/v1/pslf-trackers/{tracker_id}/recount"
    description: "Force recomputation of qualifying_payment_count and re-evaluate forgiveness eligibility (idempotent)."
    roles: [LoanServicer, PSLFAdjudicator]
    code: 200
    input: []
    output: PSLFTracker
    side_effects:
      - "tracker.qualifying_payment_count recomputed via §1.3 pslf_qualifying_payment"
      - "tracker.last_recount_on := clock_date"
      - "if count >= required_payment_count: tracker.status := ELIGIBLE_FOR_FORGIVENESS"

  - method: POST
    path: "/v1/pslf-trackers/{tracker_id}/deny"
    description: "Adjudicator denies PSLF tracking (e.g., evidence of ineligibility)."
    roles: [PSLFAdjudicator]
    code: 200
    input: []
    output: PSLFTracker
    side_effects:
      - "tracker.status := DENIED"

  - method: GET
    path: "/v1/pslf-trackers/{tracker_id}"
    description: "Fetch a PSLFTracker."
    roles: [LoanServicer, PSLFAdjudicator, Borrower]
    code: 200
    input: []
    output: PSLFTracker
    side_effects: []

  # ---- Discharge Applications ----
  - method: POST
    path: "/v1/discharge-applications"
    description: "Submit a DischargeApplication."
    roles: [LoanServicer, Borrower]
    code: 201
    input: [borrower_id, discharge_type, "va_certification_doc_id?", filed_on]
    output: DischargeApplication
    side_effects:
      - "Application created with status=SUBMITTED"

  - method: POST
    path: "/v1/discharge-applications/{application_id}/begin-review"
    description: "Move a SUBMITTED application to UNDER_REVIEW (role-gated by discharge_type)."
    roles: [VADischargeOfficer, PSLFAdjudicator]
    code: 200
    input: []
    output: DischargeApplication
    side_effects:
      - "application.status := UNDER_REVIEW"

  - method: POST
    path: "/v1/discharge-applications/{application_id}/approve"
    description: "Approve an UNDER_REVIEW application; cascades all non-terminal Loans for the borrower to DISCHARGED."
    roles: [VADischargeOfficer, PSLFAdjudicator]
    code: 200
    input: [expected_loan_version_by_loan_id]
    output: DischargeApplication
    side_effects:
      - "application.status := APPROVED"
      - "application.approved_by_user_id := X-User-ID"
      - "application.total_discharged_principal_cents := sum of outstanding_principal_cents across cascaded Loans, captured PRE-cascade"
      - "all non-terminal Loans for borrower cascade to DISCHARGED (each: status:=DISCHARGED, ACTIVE plan → EXPIRED, open DelinquencyRecord → CURED, loan.version += 1)"
      - "Borrower.borrower_status recomputed (bubble-up: CLEARED if all Loans now in {PAID_OFF, DISCHARGED})"
      - "if discharge_type == PSLF_FORGIVENESS: PSLFTracker.status := FORGIVEN"
      - "OCC: rejects with ERR_STALE_VERSION (412) per §1.2.1 discharge-approve-stale-loan if any loan's expected_loan_version != loan.version"
      - "SoD: rejects with ERR_SOD_VIOLATION (403) per §1.4 priority 12 if PSLF_FORGIVENESS and acting X-User-ID appears in any contributing Payment.recorded_by_user_id"

  - method: POST
    path: "/v1/discharge-applications/{application_id}/deny"
    description: "Deny an UNDER_REVIEW application."
    roles: [VADischargeOfficer, PSLFAdjudicator]
    code: 200
    input: []
    output: DischargeApplication
    side_effects:
      - "application.status := DENIED"

  - method: GET
    path: "/v1/discharge-applications/{application_id}"
    description: "Fetch a DischargeApplication."
    roles: [LoanServicer, VADischargeOfficer, PSLFAdjudicator, Borrower]
    code: 200
    input: []
    output: DischargeApplication
    side_effects: []

  - method: GET
    path: "/v1/discharge-applications"
    description: "List discharge applications (filter by borrower_id, status; paginated)."
    roles: [LoanServicer, VADischargeOfficer, PSLFAdjudicator, Borrower]
    code: 200
    input: ["borrower_id?", "status?", "limit?", "offset?"]
    output: DischargeApplication[]
    side_effects: []

  # ---- Delinquency Records ----
  - method: GET
    path: "/v1/loans/{loan_id}/delinquency-records"
    description: "List DelinquencyRecords for a Loan (most recent first by opened_on, tie-break created_at ASC)."
    roles: [LoanServicer, PSLFAdjudicator, Borrower]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: DelinquencyRecord[]
    side_effects: []

  # ---- Clock (test-driving endpoint) ----
  - method: POST
    path: "/v1/_clock/advance"
    description: "Test-driving endpoint to advance the system clock to a specific ISO 8601 instant. Drives time-gated transitions (DELINQUENT_BEGIN from missed scheduled due dates; DEFAULT_DECLARED at day-270; daily interest accrual). Required because no real-world endpoint advances wall-clock time, and downstream tests need deterministic clock control."
    roles: [LoanServicer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "system clock advances to to_iso8601 (must be strictly greater than current clock)"
      - "daily interest accrual job runs for each elapsed day on every Loan with subsidy_active=false (accrued_interest_cents += round_half_up(outstanding_principal_cents * interest_rate_bps / 10000 / 365))"
      - "for each REPAYMENT Loan with ACTIVE plan: if a scheduled monthly due_date was crossed without qualifying Payment, transition to DELINQUENT and open a DelinquencyRecord"
      - "for each open DelinquencyRecord: update cumulative_days; if cumulative_days >= 270 transition Loan → DEFAULT (close DelinquencyRecord with outcome=DEFAULTED, capitalize interest)"
      - "Borrower.borrower_status recomputed for every affected borrower"

  - method: GET
    path: "/v1/_clock"
    description: "Test-driving endpoint to read the current simulation clock."
    roles: [LoanServicer, PSLFAdjudicator, VADischargeOfficer, Borrower]
    code: 200
    input: []
    output: null
    side_effects: []

  - method: POST
    path: "/v1/_pslf-trackers/{tracker_id}/force-state"
    description: |
      Test-driving endpoint that forces a PSLFTracker's qualifying_payment_count
      and status. Required because reaching ELIGIBLE_FOR_FORGIVENESS via the
      business path requires 120 qualifying payments — impractical for a single
      test setup. No real-world business endpoint exists for this operation
      (regulators set the threshold, servicers count up to it), so this is a
      pure test-driving endpoint under the /_ namespace.
    roles: [PSLFAdjudicator]
    code: 200
    input: [qualifying_payment_count, status]
    output: PSLFTracker
    side_effects:
      - "tracker.qualifying_payment_count := request.qualifying_payment_count"
      - "tracker.status := request.status (must be one of TRACKING, ELIGIBLE_FOR_FORGIVENESS)"
      - "tracker.last_recount_on := clock_date"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-ID / X-User-Role headers."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role not in the recognized set."

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role lacks permission to invoke this endpoint per §1.7 RBAC."

  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Borrower-role X-User-ID does not equal the resource's borrower_id."

  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Segregation of duties: the PSLFAdjudicator approving a PSLF_FORGIVENESS DischargeApplication has previously recorded a contributing Payment (their X-User-ID appears in Payment.recorded_by_user_id of a payment counted in qualifying_payment_count)."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced entity (borrower, loan, payment, plan, certification, application, tracker, delinquency record) does not exist."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state that permits the requested transition (e.g., DEFERMENT_END on a REPAYMENT loan; creating a second ACTIVE plan without supersede; reversing a PENDING payment)."

  - id: ERR_BORROWER_DISCHARGED
    http: 409
    condition: "Cannot create a Payment for a Borrower whose every Loan is in {DISCHARGED, PAID_OFF}."

  - id: ERR_NOT_VETERAN
    http: 422
    condition: "DischargeApplication with discharge_type=VETERAN_TOTAL_PERMANENT_DISABILITY but borrower.military_status is not in {VETERAN, DISABLED_VETERAN}."

  - id: ERR_VA_DOC_REQUIRED_OR_FORBIDDEN
    http: 422
    condition: "va_certification_doc_id missing for veteran discharge OR provided for non-veteran discharge type."

  - id: ERR_PLAN_FIELDS_INVALID
    http: 422
    condition: "RepaymentPlan body violates plan_type field rules (e.g., agi_cents on STANDARD_10YR; missing agi_cents on IBR/PAYE/SAVE; family_size out of range; invalid state_of_residence)."

  - id: ERR_PAYMENT_DATE_OUT_OF_WINDOW
    http: 422
    condition: "Payment.posted_on outside [clock_date - 15, clock_date]."

  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "Payment.amount_cents > loan.outstanding_principal_cents + loan.accrued_interest_cents (+ fees if DEFAULT/TREASURY_OFFSET)."

  - id: ERR_CERTIFICATION_FIELDS_INVALID
    http: 422
    condition: "EmploymentCertification field validation: employer_ein not 9 digits, weekly_hours out of [0, 80], period_end_on < period_start_on."

  - id: ERR_DEFAULT_THRESHOLD_NOT_MET
    http: 409
    condition: "Explicit DEFAULT_DECLARED ServicingEvent attempted before DelinquencyRecord.cumulative_days reaches 270."

  - id: ERR_EMAIL_DUPLICATE
    http: 409
    condition: "Borrower.email already exists (case-insensitive)."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch on POST /repayment-plans (expected_loan_version) or POST /discharge-applications/{id}/approve (expected_loan_version_by_loan_id)."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body or missing required field that does not have a more specific error."

  - id: ERR_INVALID_CLOCK
    http: 422
    condition: "POST /_clock/advance with to_iso8601 <= current clock."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Borrower
    description: "The student loan recipient acting on their own loans."
    identity: "entity_backed:Borrower"
    exclusive_operations: []
    shared_operations:
      - "GET /v1/borrowers/{self_id}"
      - "GET /v1/loans (filtered to self)"
      - "GET /v1/loans/{own_loan_id}"
      - "GET /v1/loans/{own_loan_id}/servicing-events"
      - "GET /v1/loans/{own_loan_id}/delinquency-records"
      - "GET /v1/payments (filtered to own loans)"
      - "GET /v1/payments/{own_payment_id}"
      - "POST /v1/repayment-plans (for own loan)"
      - "POST /v1/repayment-plans/{own_plan_id}/recertify"
      - "GET /v1/repayment-plans (filtered to own)"
      - "POST /v1/employment-certifications (for self)"
      - "GET /v1/employment-certifications (filtered to self)"
      - "POST /v1/discharge-applications (for self)"
      - "GET /v1/discharge-applications (filtered to self)"
      - "GET /v1/pslf-trackers/{own_tracker_id}"
      - "GET /v1/_clock"

  - name: LoanServicer
    description: "Operational staff who originate loans, record payments, log servicing events, manage certifications, and run delinquency. Bound by SoD on PSLF discharge approval."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/borrowers"
      - "PATCH /v1/borrowers/{borrower_id}/military-status"
      - "POST /v1/loans"
      - "POST /v1/loans/{loan_id}/servicing-events"
      - "POST /v1/payments"
      - "POST /v1/payments/{payment_id}/reverse"
      - "POST /v1/employment-certifications/{certification_id}/approve"
      - "POST /v1/employment-certifications/{certification_id}/reject"
      - "POST /v1/_clock/advance"
    shared_operations:
      - "GET /v1/borrowers, GET /v1/borrowers/{id}"
      - "GET /v1/loans, GET /v1/loans/{id}, GET /v1/loans/{id}/servicing-events, GET /v1/loans/{id}/delinquency-records"
      - "POST /v1/repayment-plans, POST /v1/repayment-plans/{id}/recertify"
      - "GET /v1/repayment-plans, GET /v1/repayment-plans/{id}"
      - "POST /v1/employment-certifications"
      - "GET /v1/employment-certifications"
      - "POST /v1/pslf-trackers, POST /v1/pslf-trackers/{id}/recount"
      - "GET /v1/pslf-trackers/{id}"
      - "POST /v1/discharge-applications"
      - "GET /v1/discharge-applications, GET /v1/discharge-applications/{id}"
      - "GET /v1/payments, GET /v1/payments/{id}"
      - "GET /v1/_clock"

  - name: PSLFAdjudicator
    description: "Adjudicates PSLF forgiveness applications. May recount, deny tracker, and approve/deny PSLF discharge applications — but per SoD MUST NOT be the X-User-ID that recorded any contributing Payment."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/pslf-trackers/{tracker_id}/deny"
    shared_operations:
      - "POST /v1/pslf-trackers, POST /v1/pslf-trackers/{id}/recount"
      - "POST /v1/discharge-applications/{id}/begin-review (PSLF_FORGIVENESS only)"
      - "POST /v1/discharge-applications/{id}/approve (PSLF_FORGIVENESS only)"
      - "POST /v1/discharge-applications/{id}/deny (PSLF_FORGIVENESS only)"
      - "GET /v1/* (read-only across borrowers/loans/payments/certifications/applications/trackers)"
      - "GET /v1/_clock"

  - name: VADischargeOfficer
    description: "Adjudicates veteran total-and-permanent-disability discharge applications. Requires VA certification document and borrower military_status IN {VETERAN, DISABLED_VETERAN}."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/discharge-applications/{id}/begin-review (VETERAN_TOTAL_PERMANENT_DISABILITY only)"
      - "POST /v1/discharge-applications/{id}/approve (VETERAN_TOTAL_PERMANENT_DISABILITY only)"
      - "POST /v1/discharge-applications/{id}/deny (VETERAN_TOTAL_PERMANENT_DISABILITY only)"
      - "GET /v1/* (read-only across borrowers/loans/payments/certifications/applications)"
      - "GET /v1/_clock"
