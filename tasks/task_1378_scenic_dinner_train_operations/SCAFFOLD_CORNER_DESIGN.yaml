            - { call: "POST /railroad/crew-members", payload: { name: "Svr One", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s1: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr Two", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s2: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_k}", position: "CHEF" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s1}", position: "SERVER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s2}", position: "SERVER" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
          trigger:
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "big@x.com", class_code: "DINING", party_size: 5, dining_service: "EARLY" }, as: StationAgent, captures: { err: "$.data.error_id" } }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "ok@x.com", class_code: "COACH", party_size: 5 }, as: StationAgent, captures: { ok_status: "$.data.status" } }
          assert:
            - "${err} == ERR_PARTY_TOO_LARGE_FOR_DINING (DINING cap is 4)"
            - "same size in COACH succeeds: ${ok_status} == HELD"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: holiday_surge_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SURGE_MULTIPLIER_INVALID]"]
        distinguishing_aspect: "HOLIDAY excursions must price at >= 12000 bp: 11999 is rejected with ERR_SURGE_MULTIPLIER_INVALID."
        test_recipe:
          setup: ["ACTIVE agreement with one OPEN slot"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/excursions", payload: { title: "Cheap Holiday", slot_id: "${slot}", event_type: "HOLIDAY", surge_multiplier_bp: 11999 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_SURGE_MULTIPLIER_INVALID"
      - name: regular_surge_must_equal_base
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SURGE_MULTIPLIER_INVALID]"]
        distinguishing_aspect: "REGULAR excursions are pinned to exactly 10000 bp: 10001 fails, proving the conditional rule keys on event_type."
        test_recipe:
          setup: ["ACTIVE agreement with one OPEN slot"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/excursions", payload: { title: "Sneaky Surge", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10001 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_SURGE_MULTIPLIER_INVALID"
      - name: daily_train_cap_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DAILY_TRAIN_CAP_REACHED]", entities.TrackRightsAgreement.fields.max_trains_per_day]
        distinguishing_aspect: "Aggregate validation: three slots on one date are fine under max_trains_per_day 3; the fourth is rejected even though its interval is disjoint."
        test_recipe:
          setup: ["ACTIVE agreement (cap 3) with three non-overlapping slots on 2026-10-15: 600-780, 780-900, 900-1020"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 780, end_minute: 900 }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 900, end_minute: 1020 }, as: Scheduler }
          trigger:
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 1020, end_minute: 1140 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DAILY_TRAIN_CAP_REACHED (4th slot on the date exceeds the cap of 3)"
      - name: slot_duration_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SLOT_DURATION_TOO_SHORT]"]
        distinguishing_aspect: "Slot of 45 minutes violates min_slot_minutes 60."
        test_recipe:
          setup: ["ACTIVE agreement (min_slot_minutes 60)"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
          trigger:
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 645 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_SLOT_DURATION_TOO_SHORT"
      - name: slot_outside_agreement_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SLOT_OUTSIDE_AGREEMENT_WINDOW]"]
        distinguishing_aspect: "service_date 2027-02-01 is past valid_until 2026-12-31 -> ERR_SLOT_OUTSIDE_AGREEMENT_WINDOW."
        test_recipe:
          setup: ["ACTIVE agreement valid 2026-01-01..2026-12-31"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
          trigger:
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2027-02-01", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_SLOT_OUTSIDE_AGREEMENT_WINDOW"
      - name: slot_create_on_draft_agreement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Slots require an ACTIVE agreement; creating under a DRAFT agreement fails with ERR_AGREEMENT_NOT_ACTIVE."
        test_recipe:
          setup: ["Agreement left in DRAFT (never activated)"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_AGREEMENT_NOT_ACTIVE"
      - name: booking_with_unknown_excursion_reference_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_REFERENCE]"]
        distinguishing_aspect: "A body FK that does not resolve (bogus excursion_id UUID) fails with ERR_INVALID_REFERENCE 422, distinct from path-level ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /railroad/bookings", payload: { excursion_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", customer_email: "x@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REFERENCE with HTTP 422"
      - name: crew_double_booking_same_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CREW_DATE_CONFLICT]"]
        distinguishing_aspect: "Date-granularity crew overlap: a member ASSIGNED to one excursion on 2026-10-15 cannot be ASSIGNED to another excursion the same date, even though the two slot intervals do not overlap."
        test_recipe:
          setup: ["Two DRAFT excursions on 2026-10-15 (slots 600-780 and 780-900); engineer Ed assigned to the first"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot1: "$.data.id" } }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 780, end_minute: 900 }, as: Scheduler, captures: { slot2: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run 1", slot_id: "${slot1}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex1: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run 2", slot_id: "${slot2}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex2: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex1}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
          trigger:
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex2}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CREW_DATE_CONFLICT (same service_date, disjoint slot minutes still conflict)"
      - name: certification_expired_before_service_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CERTIFICATION_EXPIRED]"]
        distinguishing_aspect: "ENGINEER cert expiring 2026-09-01 cannot cover a 2026-10-15 service date -> ERR_CERTIFICATION_EXPIRED at assignment time."
        test_recipe:
          setup: ["DRAFT excursion on 2026-10-15; engineer whose cert_expires_on is 2026-09-01"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Cert Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Old Cert", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2026-09-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CERTIFICATION_EXPIRED"
      - name: position_role_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_POSITION_ROLE_MISMATCH]"]
        distinguishing_aspect: "A CHEF member cannot be assigned into a SERVER position -> ERR_POSITION_ROLE_MISMATCH."
        test_recipe:
          setup: ["DRAFT excursion; one CHEF member"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Mismatch Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Chef Ana", role: "CHEF", is_volunteer: false }, as: CrewManager, captures: { cm_k: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_k}", position: "SERVER" }, as: CrewManager, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_POSITION_ROLE_MISMATCH"
      - name: engineer_without_cert_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CERTIFICATION_REQUIRED]"]
        distinguishing_aspect: "Creating an ENGINEER without cert_expires_on fails with ERR_CERTIFICATION_REQUIRED; the same body with role SERVER succeeds."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /railroad/crew-members", payload: { name: "No Cert Ned", role: "ENGINEER", is_volunteer: false }, as: CrewManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr One", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { ok_status: "$.data.status" } }
          assert:
            - "${err} == ERR_CERTIFICATION_REQUIRED"
            - "SERVER without cert succeeds: ${ok_status} == ACTIVE"
