            - "err3 == ERR_SITE_CAPACITY_EXCEEDED (3 + 1 > 3 on occupied date 2026-07-06)"
            - "Two SCHEDULED tasks remain listed for the site (second capture resolves: ${n_tasks} is the second task's id)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: specline_drawdown_create_then_cancel_restores_remaining_qty
        grounds:
          - calculations.specline_remaining_qty
          - state_machines.POLine.ORDERED_to_CANCELLED
          - entities.SpecLine.fields.remaining_qty
        distinguishing_aspect: |
          Conserved quantity: furniture units on a SpecLine — qty == remaining_qty + sum(active
          ordered_qty). Forward action (create line qty 50: remaining 150 -> 100) paired with its
          compensating action (cancel that line: remaining 100 -> 150) leaves the invariant exact;
          a different conserved quantity than crew-days.
        test_recipe:
          setup:
            - "District D1; spec line qty 500 cap 13000; flat award accepted; PO (RECEIVED) with lines L1 qty 200 and L2 qty 150 -> remaining_qty 150"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 200 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 150 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "GET /v1/spec-lines/${slA}", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { rem_before: $.data.remaining_qty } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 50 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l3: $.data.id } }
            - { call: "GET /v1/spec-lines/${slA}", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { rem_mid: $.data.remaining_qty } }
            - { call: "POST /v1/po-lines/${l3}/cancel", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "GET /v1/spec-lines/${slA}", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { rem_after: $.data.remaining_qty } }
            - { call: "GET /v1/purchase-orders/${po1}", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { po_total: $.data.total_cents } }
          assert:
            - "rem_before == 150 (500 - 200 - 150)"
            - "rem_mid == 100 (forward action debited 50)"
            - "rem_after == 150 (compensating cancel credited 50 back; invariant 500 == 150 + 200 + 150 holds)"
            - "po_total == 3850000 (200*11000 + 150*11000 after L3's 550000 was removed)"

      - name: crew_booked_days_assign_then_unassign_restores_zero
        grounds:
          - calculations.crew_booked_days
          - state_machines.InstallTask.SCHEDULED_to_CANCELLED
          - entities.Crew.fields.booked_days
        distinguishing_aspect: |
          Conserved quantity: crew-day capacity on a Crew — booked_days == sum of crew_days over
          the crew's SCHEDULED/IN_PROGRESS tasks. Forward action (assign task of 2 crew x 3 days:
          0 -> 6) paired with its compensating action (unassign: 6 -> 0) leaves the ledger exact;
          a different conserved quantity than spec-line furniture units.
        test_recipe:
          setup:
            - "District D1; flat award; PO line qty 10 delivered 2026-07-01; crew Alpha booked_days == 0; site capacity 5; clock 2026-06-20"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${d1}", name: "West ES", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { site1: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Alpha" }, as: ContractorAdmin, captures: { crew1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "GET /v1/crews/${crew1}", payload: {}, as: FulfillmentCoordinator, captures: { booked_before: $.data.booked_days } }
          trigger:
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${ship1}", crew_id: "${crew1}", school_site_id: "${site1}", room_label: "W-1", start_date: "2026-07-06", end_date: "2026-07-09", crew_count: 2 }, as: FulfillmentCoordinator, captures: { t1: $.data.id, t1_days: $.data.crew_days } }
            - { call: "GET /v1/crews/${crew1}", payload: {}, as: FulfillmentCoordinator, captures: { booked_mid: $.data.booked_days } }
            - { call: "POST /v1/install-tasks/${t1}/unassign", payload: {}, as: FulfillmentCoordinator, captures: { t1_status: $.data.status } }
            - { call: "GET /v1/crews/${crew1}", payload: {}, as: FulfillmentCoordinator, captures: { booked_after: $.data.booked_days } }
          assert:
            - "booked_before == 0"
            - "t1_days == 6 (2 crew x 3 dates in [2026-07-06, 2026-07-09)) and booked_mid == 6 (forward debit)"
            - "t1_status == CANCELLED and booked_after == 0 (compensating credit; invariant booked_days == sum over SCHEDULED/IN_PROGRESS == 0 holds)"
