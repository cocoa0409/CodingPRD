            - call: "POST /epr/skus/${sku_f2_id}/components"
              payload: { material_type: "PLASTIC", unit_weight_grams: 100, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 100, is_reusable: true }
              as: ProducerComplianceOfficer
