# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3410_oilseed_crush_margin_management_origination_contracts
#
# Breadth probe over every claim §1.1–§1.7 declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml
# does not already exercise. Corners §1.8 covers appear as excluded_because stubs.
# Logical clock default: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: farmer_create_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Farmer, endpoints.POST_/api/farmers]
        distinguishing_aspect: "A farmer created with only legal_name and county returns 201 with the inputs round-tripped, version 1, and server-minted id / created_at / updated_at."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_farm
              call: "POST /api/farmers"
              payload: { legal_name: "A. Farmer", county: "Macoupin" }
              as: PlatformAdmin
              captures: { k_farm_id: $.data.id }
          assert:
            - "response status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "Farmer.${k_farm_id}.legal_name == \"A. Farmer\" and county == \"Macoupin\""
            - "Farmer.${k_farm_id}.version == 1 with non-null id, created_at, updated_at"

      - name: farmer_id_is_uuid_without_type_prefix
        claim_type: System Fields
        grounds: [entities.Farmer]
        distinguishing_aspect: "The server-minted id is a bare UUID (eight-hex groups, no entity-type prefix like farm_); identity only."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - *k_farm
          assert:
            - "Farmer.${k_farm_id}.id matches ^[0-9a-f-]{36}$ with no alphabetic type prefix"

      - name: elevator_create_derived_counters_start_at_zero
        claim_type: Defaults
        grounds: [entities.Elevator.fields.stored_bushels, entities.Elevator.fields.receiving_open]
        distinguishing_aspect: "A new elevator starts with stored_bushels 0, certified_stored_bushels 0, receiving_open true — derived fields initialized, never client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One PUBLISHED schedule."]
          setup_api_calls:
            - *k_clock
            - &k_sched
              call: "POST /api/quality-discount-schedules"
              payload: { name: "Fall Std", moisture_base_pct: 13.0, moisture_shrink_pct_per_point: 1.3, moisture_discount_cents_per_point: 4, damage_free_pct: 2.0, damage_discount_cents_per_point: 3, fm_free_pct: 1.0, fm_discount_cents_per_point: 3, reject_moisture_pct: 18.0 }
              as: PlatformAdmin
              captures: { k_sched_id: $.data.id }
            - &k_sched_pub
              call: "POST /api/quality-discount-schedules/${k_sched_id}/publish"
              payload: {}
              as: PlatformAdmin
          trigger:
            - &k_elev
              call: "POST /api/elevators"
              payload: { name: "Riverbend", region: "IL", storage_capacity_bushels: 100000, active_discount_schedule_id: "${k_sched_id}" }
              as: PlatformAdmin
              captures: { k_elev_id: $.data.id }
          assert:
            - "response 201; Elevator.${k_elev_id}.stored_bushels == 0 and certified_stored_bushels == 0"
            - "Elevator.${k_elev_id}.receiving_open == true (0 < 100000 capacity)"
            - "Elevator.${k_elev_id}.active_discount_schedule_id == ${k_sched_id}"

      - name: elevator_create_computed_field_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Elevator.fields.stored_bushels, endpoints.POST_/api/elevators]
        distinguishing_aspect: "A client-supplied stored_bushels: 999 in the create body is ignored — the server computes 0; computed fields are never writable."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One PUBLISHED schedule."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
          trigger:
            - call: "POST /api/elevators"
              payload: { name: "Cheater", region: "IL", storage_capacity_bushels: 100000, active_discount_schedule_id: "${k_sched_id}", stored_bushels: 999 }
              as: PlatformAdmin
              captures: { k_elev_bad: $.data.id }
          assert:
            - "response 201 (unknown/computed input ignored, not an error)"
            - "Elevator.${k_elev_bad}.stored_bushels == 0, not 999"

      - name: market_quotes_append_and_filter_by_month
        claim_type: Listing
        grounds: [entities.MarketQuote, endpoints.GET_/api/market-quotes]
        distinguishing_aspect: "MarketQuote is append-only (common_fields false: id + created_at, no updated_at/version); the list endpoint filters by commodity and quote_month."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
            - &k_q_bean_nov
              call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1200, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1210, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/market-quotes"
              payload: { commodity: "BEAN" }
              as: PlatformAdmin
            - call: "GET /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12" }
              as: PlatformAdmin
          assert:
            - "unfiltered-by-month list returns 2 rows, total_count == 2"
            - "quote_month == 2026-12 filter returns exactly 1 row with price_cents == 1210"
            - "each row carries id and created_at but no version field (common_fields: false)"

      - name: contract_create_cash_born_priced
        claim_type: Initial State
        grounds: [entities.OriginationContract.fields.pricing_status, state_machines.OriginationContract.pricing_status]
        distinguishing_aspect: "A CASH contract is born PRICED with priced_bushels == quantity_bushels and one seeded election at cash_price_cents_per_bushel — no election endpoint call is needed or possible."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Elevator, farmer."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
          trigger:
            - &k_ctr_cash
              call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "CASH", quantity_bushels: 100, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { k_ctr_cash_id: $.data.id }
          assert:
            - "OriginationContract.${k_ctr_cash_id}.pricing_status == PRICED and fulfillment_status == OPEN"
            - "priced_bushels == 100 and priced_value_cents == 100000 (100 x 1000)"
            - "elections array holds exactly one entry with bushels 100, unit_price_cents 1000, origin CLIENT"

      - name: contract_create_deferred_born_unpriced
        claim_type: Initial State
        grounds: [entities.OriginationContract.fields.pricing_status]
        distinguishing_aspect: "A DEFERRED contract is born UNPRICED with priced_bushels 0, priced_value_cents 0, unpriced_pool_bushels 0 and an empty elections array."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Elevator, farmer."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
          trigger:
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 2000, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
              captures: { k_ctr_def_id: $.data.id }
          assert:
            - "OriginationContract.${k_ctr_def_id}.pricing_status == UNPRICED"
            - "priced_bushels == 0, priced_value_cents == 0, elections == []"
            - "fulfillment_status == OPEN"

      - name: contract_create_cash_with_basis_field_rejected
        claim_type: Type Constraints
        grounds: [entities.OriginationContract.fields.basis_cents_per_bushel, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "Type-matched field discipline: a CASH contract carrying basis_cents_per_bushel is rejected 400 ERR_INVALID_REQUEST — the field is forbidden outside BASIS."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Elevator, farmer."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
          trigger:
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "CASH", quantity_bushels: 100, cash_price_cents_per_bushel: 1000, basis_cents_per_bushel: -25 }
              as: OriginationMerchandiser
              captures: { k_err: $.data.error_id }
          assert:
            - "response 400 with error_id ERR_INVALID_REQUEST"
            - "no contract is persisted (subsequent GET list for the farmer returns 0 rows)"

      - name: contract_create_missing_required_quantity_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.OriginationContract.fields.quantity_bushels, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required quantity_bushels yields 400 ERR_INVALID_REQUEST — required input fields are enforced at creation."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Elevator, farmer."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
          trigger:
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "CASH", cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { k_err2: $.data.error_id }
          assert:
            - "response 400 with error_id ERR_INVALID_REQUEST"

      - name: contract_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/api/origination-contracts/{id}", errors.ERR_CONTRACT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path yields 404 with the entity-specific ERR_CONTRACT_NOT_FOUND, not a generic 404."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty contract table."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /api/origination-contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OriginationMerchandiser
              captures: { k_err3: $.data.error_id }
          assert:
            - "response 404, response_type error, data.error_id == ERR_CONTRACT_NOT_FOUND"

      - name: contracts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET_/api/origination-contracts, response_envelope.pagination_defaults]
        distinguishing_aspect: "With three contracts on file: limit=2&offset=0 returns 2 rows, total_count 3, has_more true; offset=2 returns the last row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One farmer with three CASH contracts."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_ctr_cash
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "CASH", quantity_bushels: 200, cash_price_cents_per_bushel: 1001 }
              as: OriginationMerchandiser
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "CASH", quantity_bushels: 300, cash_price_cents_per_bushel: 1002 }
              as: OriginationMerchandiser
          trigger:
            - call: "GET /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", limit: 2, offset: 0 }
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", limit: 2, offset: 2 }
              as: OriginationMerchandiser
          assert:
            - "first page: 2 rows, total_count == 3, has_more == true"
            - "second page: 1 row, total_count == 3, has_more == false"
            - "unfiltered GET /api/origination-contracts returns all 3 rows with default limit 10 / offset 0"

      - name: ticket_create_received_with_null_computed_fields
        claim_type: Computed Fields
        grounds: [entities.DeliveryTicket.fields.net_bushels, entities.DeliveryTicket.fields.schedule_id]
        distinguishing_aspect: "A freshly created ticket is RECEIVED with null shrink_bushels / net_bushels / discount_cents_per_bushel / premium_cents_per_bushel / schedule_id — grading happens only at apply; elevator_id is copied from the contract."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. CASH contract for 100 bu."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_ctr_cash
          trigger:
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_cash_id}", gross_bushels: 50, moisture_pct: 14.0, damage_pct: 1.0, foreign_material_pct: 0.5 }
              as: OriginationMerchandiser
              captures: { k_tkt_id: $.data.id }
          assert:
            - "DeliveryTicket.${k_tkt_id}.status == RECEIVED"
            - "net_bushels, shrink_bushels, discount_cents_per_bushel, premium_cents_per_bushel, schedule_id are all null"
            - "DeliveryTicket.${k_tkt_id}.elevator_id == ${k_elev_id} (copied from the contract)"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: schedule_publish_then_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.QualityDiscountSchedule.DRAFT_to_PUBLISHED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "PUBLISHED is terminal: a second publish on the same schedule fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
            - *k_sched
          trigger:
            - *k_sched_pub
            - call: "POST /api/quality-discount-schedules/${k_sched_id}/publish"
              payload: {}
              as: PlatformAdmin
              captures: { k_err4: $.data.error_id }
          assert:
            - "first publish returns 200 with status PUBLISHED and version 2"
            - "second publish returns 409 with error_id ERR_INVALID_STATE"

      - name: program_close_then_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SustainabilityProgram.ACTIVE_to_CLOSED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal: a second close on the same program fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One ACTIVE program."]
          setup_api_calls:
            - *k_clock
            - &k_prog
              call: "POST /api/sustainability-programs"
              payload: { name: "Regen Prairies", cert_standard: "REGEN", premium_cents_per_bushel: 25 }
              as: PlatformAdmin
              captures: { k_prog_id: $.data.id }
          trigger:
            - call: "POST /api/sustainability-programs/${k_prog_id}/close"
              payload: {}
              as: SustainabilityAuditor
            - call: "POST /api/sustainability-programs/${k_prog_id}/close"
              payload: {}
              as: SustainabilityAuditor
              captures: { k_err5: $.data.error_id }
          assert:
            - "first close returns 200 with status CLOSED"
            - "second close returns 409 with error_id ERR_INVALID_STATE"

      - name: crush_run_revert_cycle_scheduled_to_planned
        claim_type: Valid Transition
        grounds: [state_machines.CrushRun.SCHEDULED_to_PLANNED]
        distinguishing_aspect: "The SCHEDULED -> PLANNED revert frees the day's aggregate capacity: after reverting a 40000-bu run, a different 40000-bu run schedules onto the same plant and date that was previously full (cap 50000)."
        test_recipe:
          setup: ["ACTIVE plant cap 50000; quotes 1200/55/17; run A 40000 bu on 2026-09-10 SCHEDULED; run B 40000 bu same date PLANNED (its schedule would fail while A holds capacity)."]
          setup_api_calls:
            - *k_clock
            - &k_plant
              call: "POST /api/crush-plants"
              payload: { name: "Decatur", daily_crush_capacity_bushels: 50000, daily_refinery_capacity_lbs: 1000000, biodiesel_feedstock_share_pct: 10 }
              as: PlatformAdmin
              captures: { k_plant_id: $.data.id }
            - &k_qb
              call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1200, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_qo
              call: "POST /api/market-quotes"
              payload: { commodity: "OIL", quote_month: "2026-11", price_cents: 55, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_qm
              call: "POST /api/market-quotes"
              payload: { commodity: "MEAL", quote_month: "2026-11", price_cents: 17, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${k_plant_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 40000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { k_run_a: $.data.id, k_run_a_v: $.data.version }
            - call: "POST /api/crush-runs/${k_run_a}/schedule"
              payload: { expected_run_version: "${k_run_a_v}" }
              as: PlantScheduler
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${k_plant_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 40000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { k_run_b: $.data.id }
          trigger:
            - call: "POST /api/crush-runs/${k_run_a}/transitions"
              payload: { to_status: "PLANNED" }
              as: PlantScheduler
            - call: "GET /api/crush-runs/${k_run_b}"
              payload: {}
              as: PlantScheduler
              captures: { k_run_b_v: $.data.version }
            - call: "POST /api/crush-runs/${k_run_b}/schedule"
              payload: { expected_run_version: "${k_run_b_v}" }
              as: PlantScheduler
          assert:
            - "run A returns to PLANNED (the revert half of the cycle)"
            - "run B then schedules 200 — the revert freed the 2026-09-10 aggregate capacity"
            - "CrushRun.${k_run_a}.status == PLANNED and CrushRun.${k_run_b}.status == SCHEDULED"

      - name: crush_run_cancelled_terminal_rejects_start
        claim_type: Invalid Transitions
        grounds: [state_machines.CrushRun, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal: a transitions call with to_status RUNNING on a cancelled run fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE plant; quotes; run PLANNED for 2026-09-10."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_qb
            - *k_qo
            - *k_qm
            - call: "POST /api/crush-runs"
              payload: { plant_id: "${k_plant_id}", run_date: "2026-09-10T00:00:00Z", planned_bushels: 1000, futures_month: "2026-11" }
              as: PlantScheduler
              captures: { k_run_x: $.data.id }
          trigger:
            - call: "POST /api/crush-runs/${k_run_x}/transitions"
              payload: { to_status: "CANCELLED" }
              as: PlantScheduler
            - call: "POST /api/crush-runs/${k_run_x}/transitions"
              payload: { to_status: "RUNNING" }
              as: PlantScheduler
              captures: { k_err6: $.data.error_id }
          assert:
            - "the cancel succeeds: status CANCELLED"
            - "the subsequent start fails 409 ERR_INVALID_STATE"
            - "CrushRun.${k_run_x}.status remains CANCELLED"

      - name: ticket_apply_above_reject_moisture_returns_rejected_outcome
        claim_type: Valid Transition
        grounds: [state_machines.DeliveryTicket.RECEIVED_to_REJECTED]
        distinguishing_aspect: "Moisture 18.5 strictly above reject_moisture_pct 18.0 takes the REJECTED branch: the apply returns 200 with status REJECTED and performs NO contract, position, or elevator mutation."
        test_recipe:
          setup: ["CASH contract 100 bu; one ticket gross 100, moisture 18.5."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_ctr_cash
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_cash_id}", gross_bushels: 100, moisture_pct: 18.5, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_rj: $.data.id }
          trigger:
            - call: "POST /api/delivery-tickets/${k_tkt_rj}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/storage-positions"
              payload: { elevator_id: "${k_elev_id}" }
              as: OriginationMerchandiser
          assert:
            - "apply returns 200 with DeliveryTicket.${k_tkt_rj}.status == REJECTED (business outcome, not an error)"
            - "OriginationContract.${k_ctr_cash_id}.delivered_bushels == 0 and fulfillment_status == OPEN"
            - "GET /api/storage-positions?elevator_id=${k_elev_id} returns 0 rows and Elevator.${k_elev_id}.stored_bushels == 0"

      - name: ticket_apply_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.DeliveryTicket.RECEIVED_to_APPLIED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "APPLIED is terminal: applying the same ticket twice fails 409 ERR_INVALID_STATE on the second call; the first apply's side effects are not duplicated."
        test_recipe:
          setup: ["CASH contract 100 bu; one clean 50-bu ticket applied once."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_ctr_cash
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_cash_id}", gross_bushels: 50, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_2x: $.data.id }
            - call: "POST /api/delivery-tickets/${k_tkt_2x}/apply"
              payload: {}
              as: OriginationMerchandiser
          trigger:
            - call: "POST /api/delivery-tickets/${k_tkt_2x}/apply"
              payload: {}
              as: OriginationMerchandiser
              captures: { k_err7: $.data.error_id }
          assert:
            - "second apply fails 409 ERR_INVALID_STATE"
