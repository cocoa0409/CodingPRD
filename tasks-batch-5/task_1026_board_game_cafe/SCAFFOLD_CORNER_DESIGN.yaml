scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_table_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Table, endpoints]
        distinguishing_aspect: "POST /tables with all required fields returns 201 and status defaults to AVAILABLE."
        test_recipe:
          setup: ["No tables exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /tables"
              payload: { label: "C1", seats: 6, half_hour_rate_cents: 500, day_pass_cents: 6000, cover_fee_cents: 300, min_spend_cents: 2000, zone: "PATIO" }
              as: Manager
              captures: { tid: $.data.id, st: $.data.status }
          assert:
            - "response code == 201 and Table.${tid}.status == AVAILABLE"
            - "Table.${tid}.zone == PATIO"

      - name: get_membership_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Membership, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /memberships/{id} for an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No membership with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND and http_status == 404"

      - name: create_reservation_missing_start_at_returns_validation
        claim_type: Required Fields
        grounds: [entities.Reservation, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /reservations without required start_at returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Table exists."]
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "C2", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, end_at: "2026-07-05T20:00:00Z" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION and http_status == 400"

      - name: create_membership_duplicate_email_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Membership.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A second membership with an already-used email returns ERR_VALIDATION (uniqueness)."
        test_recipe:
          setup: ["A membership with email dup@x.com already exists."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Staff
          trigger:
            - call: "POST /memberships"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION and http_status == 400"

      - name: game_copy_default_condition_good_when_omitted
        claim_type: Defaults
        grounds: [entities.GameCopy.fields.condition]
        distinguishing_aspect: "Creating a game copy without condition applies the default GOOD and status AVAILABLE."
        test_recipe:
          setup: ["No game copies exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /game-copies"
              payload: { title: "Azul", barcode: "BC-AZ-1", replacement_value_cents: 3500 }
              as: Manager
              captures: { gc: $.data.id, cond: $.data.condition, st: $.data.status }
          assert:
            - "GameCopy.${gc}.condition == GOOD (default applied)"
            - "GameCopy.${gc}.status == AVAILABLE"

      - name: retail_order_total_is_quantity_times_unit_price
        claim_type: Computed Fields
        grounds: [entities.RetailOrder.fields.total_cents, calculations.retail_order_total]
        distinguishing_aspect: "POST /retail-orders computes total_cents = quantity * unit_price_cents (3 * 1500 = 4500), ignoring any client-supplied total."
        test_recipe:
          setup: ["No retail orders exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /retail-orders"
              payload: { product_title: "Gloomhaven", fulfillment_type: "IN_STOCK", quantity: 3, unit_price_cents: 1500 }
              as: Staff
              captures: { ro: $.data.id, tot: $.data.total_cents, st: $.data.status }
          assert:
            - "RetailOrder.${ro}.total_cents == 4500"
            - "RetailOrder.${ro}.status == READY (IN_STOCK starts READY)"

      - name: list_memberships_is_paginated
        claim_type: Listing
        grounds: [entities.Membership, endpoints]
        distinguishing_aspect: "GET /memberships returns an array with pagination meta (total_count, has_more) honoring limit/offset."
        test_recipe:
          setup: ["Two memberships exist."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "p1@x.com", full_name: "P1" }
              as: Staff
            - call: "POST /memberships"
              payload: { email: "p2@x.com", full_name: "P2" }
              as: Staff
          trigger:
            - call: "GET /memberships"
              payload: { limit: 1, offset: 0 }
              as: Staff
          assert:
            - "response_type == array; meta.total_count == 2 and meta.has_more == true with a single returned element"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: close_reservation_from_booked_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.transitions.SEATED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a BOOKED (never-seated) reservation returns ERR_INVALID_STATE; no bill is computed."
        test_recipe:
          setup: ["Reservation is BOOKED (not seated)."]
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "C3", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
          trigger:
            - call: "POST /reservations/${resv}/close"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE and http_status == 409"

      - name: seat_cancelled_reservation_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Reservation.transitions.BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED reservation (terminal) cannot be seated; seat returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Reservation booked then cancelled before cutoff (terminal CANCELLED)."]
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "C4", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T20:00:00Z", end_at: "2026-07-05T22:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/cancel"
              payload: {}
              as: Staff
          trigger:
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE and http_status == 409"

      - name: void_already_void_order_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines, "errors[ERR_INVALID_STATE]", entities.FnbOrder.fields.status]
        distinguishing_aspect: "Voiding an already-VOID F&B order a second time returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SEATED reservation has one F&B order already VOID."]
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "C5", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
            - call: "POST /fnb-orders"
              payload: { reservation_id: "${resv}", description: "Fries", total_cents: 700 }
              as: Staff
              captures: { o: $.data.id }
            - call: "POST /fnb-orders/${o}/void"
              payload: {}
              as: Staff
          trigger:
            - call: "POST /fnb-orders/${o}/void"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE and http_status == 409"

      - name: checkout_damaged_copy_returns_game_not_available
        claim_type: Precondition Enforcement
        grounds: [state_machines.GameCopy.transitions.AVAILABLE_to_CHECKED_OUT, "validations[priority=8]", "errors[ERR_GAME_NOT_AVAILABLE]"]
        distinguishing_aspect: "A DAMAGED game copy is not lendable; POST /checkouts returns ERR_GAME_NOT_AVAILABLE even to a seated session."
        test_recipe:
          setup: ["GameCopy created DAMAGED; a SEATED reservation exists."]
          setup_api_calls:
            - call: "POST /game-copies"
              payload: { title: "Risk", barcode: "BC-RK-1", replacement_value_cents: 3000, condition: "DAMAGED" }
              as: Manager
              captures: { gc: $.data.id }
            - call: "POST /tables"
              payload: { label: "C6", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
          trigger:
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc}", reservation_id: "${resv}" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_GAME_NOT_AVAILABLE and http_status == 409"

      - name: close_with_active_checkout_returns_session_has_open_checkouts
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.transitions.SEATED_to_COMPLETED, "errors[ERR_SESSION_HAS_OPEN_CHECKOUTS]"]
        distinguishing_aspect: "Closing a session with an ACTIVE checkout still outstanding returns ERR_SESSION_HAS_OPEN_CHECKOUTS."
        test_recipe:
          setup: ["A SEATED reservation has an ACTIVE checkout of a game copy."]
          setup_api_calls:
            - call: "POST /game-copies"
              payload: { title: "Dixit", barcode: "BC-DX-1", replacement_value_cents: 3000 }
              as: Manager
              captures: { gc: $.data.id }
            - call: "POST /tables"
              payload: { label: "C7", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc}", reservation_id: "${resv}" }
              as: Staff
          trigger:
            - call: "POST /reservations/${resv}/close"
              payload: {}
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_HAS_OPEN_CHECKOUTS and http_status == 409"

      - name: report_lost_retires_copy_and_sets_lost
        claim_type: Side Effect Execution
        grounds: [state_machines.Checkout.transitions.ACTIVE_to_LOST, entities.GameCopy.fields.status, entities.GameCopy.fields.condition]
        distinguishing_aspect: "Reporting a checkout lost sets condition_fee_cents = replacement_value_cents and drives GameCopy to condition LOST / status RETIRED."
        test_recipe:
          setup: ["A SEATED reservation has an ACTIVE checkout of a copy with replacement_value 5000."]
          setup_api_calls:
            - call: "POST /game-copies"
              payload: { title: "Root", barcode: "BC-RT-1", replacement_value_cents: 5000 }
              as: Manager
              captures: { gc: $.data.id }
            - call: "POST /tables"
              payload: { label: "C8", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc}", reservation_id: "${resv}" }
              as: Staff
              captures: { co: $.data.id }
          trigger:
            - call: "POST /checkouts/${co}/report-lost"
              payload: {}
              as: Staff
              captures: { fee: $.data.condition_fee_cents, st: $.data.status }
            - call: "GET /game-copies/${gc}"
              payload: {}
              as: Staff
              captures: { gcond: $.data.condition, gst: $.data.status }
          assert:
            - "Checkout.${co}.condition_fee_cents == 5000 and Checkout.${co}.status == LOST"
            - "GameCopy.${gc}.condition == LOST and GameCopy.${gc}.status == RETIRED"

      - name: cancel_open_tournament_refunds_all_registrations
        claim_type: Side Effect Execution
        grounds: [state_machines.Tournament.transitions.OPEN_to_CANCELLED, entities.Registration.fields.status, entities.Registration.fields.refunded_cents]
        distinguishing_aspect: "Cancelling an OPEN tournament moves every REGISTERED entry to REFUNDED with refunded_cents == fee_paid_cents."
        test_recipe:
          setup: ["OPEN tournament (entry_fee 1000) with one REGISTERED entry."]
          setup_api_calls:
            - call: "POST /tournaments"
              payload: { name: "Refund Cup", game_title: "Carcassonne", format: "CASUAL", capacity: 8, entry_fee_cents: 1000, start_at: "2026-07-15T18:00:00Z" }
              as: Manager
              captures: { trn: $.data.id }
            - call: "POST /tournaments/${trn}/open"
              payload: {}
              as: Manager
            - call: "POST /memberships"
              payload: { email: "r1@x.com", full_name: "R1" }
              as: Staff
              captures: { m: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${trn}", membership_id: "${m}" }
              as: Staff
              captures: { reg: $.data.id }
          trigger:
            - call: "POST /tournaments/${trn}/cancel"
              payload: {}
              as: Manager
            - call: "GET /registrations/${reg}"
              payload: {}
              as: Staff
              captures: { rst: $.data.status, rref: $.data.refunded_cents }
          assert:
            - "Registration.${reg}.status == REFUNDED and Registration.${reg}.refunded_cents == 1000"

      - name: reinstate_suspended_member_resets_strikes
        claim_type: Valid Transition
        grounds: [state_machines.Membership.transitions.SUSPENDED_to_ACTIVE, entities.Membership.fields.no_show_strikes]
        distinguishing_aspect: "PATCH /memberships/{id} status=ACTIVE on a SUSPENDED member returns it to ACTIVE and resets no_show_strikes to 0."
        test_recipe:
          setup: ["A SUSPENDED membership exists (suspended manually)."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "susp@x.com", full_name: "Susp" }
              as: Staff
              captures: { m: $.data.id }
            - call: "PATCH /memberships/${m}"
              payload: { status: "SUSPENDED" }
              as: Manager
          trigger:
            - call: "PATCH /memberships/${m}"
              payload: { status: "ACTIVE" }
              as: Manager
              captures: { st: $.data.status, strikes: $.data.no_show_strikes }
          assert:
            - "Membership.${m}.status == ACTIVE and Membership.${m}.no_show_strikes == 0"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: condition_fee_worn_from_good_is_one_step
        claim_type: Correct Result
        grounds: [calculations.condition_fee, entities.Checkout.fields.condition_fee_cents]
        distinguishing_aspect: "Returning a GOOD-checkout copy as WORN charges (2-1)*CONDITION_STEP_CENTS = 800."
        test_recipe:
          setup: ["A SEATED reservation has an ACTIVE checkout of a GOOD copy."]
          setup_api_calls:
            - call: "POST /game-copies"
              payload: { title: "Splendor", barcode: "BC-SP-1", replacement_value_cents: 3000, condition: "GOOD" }
              as: Manager
              captures: { gc: $.data.id }
            - call: "POST /tables"
              payload: { label: "C9", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 2, start_at: "2026-07-05T12:00:00Z", end_at: "2026-07-05T14:00:00Z" }
              as: Staff
              captures: { resv: $.data.id }
            - call: "POST /reservations/${resv}/seat"
              payload: {}
              as: Staff
            - call: "POST /checkouts"
              payload: { game_copy_id: "${gc}", reservation_id: "${resv}" }
              as: Staff
              captures: { co: $.data.id }
          trigger:
            - call: "POST /checkouts/${co}/return"
              payload: { return_condition: "WORN" }
              as: Staff
              captures: { fee: $.data.condition_fee_cents }
          assert:
            - "Checkout.${co}.condition_fee_cents == 800  # (ord WORN 2 - ord GOOD 1) * 800"
            - "GameCopy.${gc}.condition == WORN after return"

      - name: private_booking_quote_and_deposit
        claim_type: Correct Result
        grounds: [calculations.private_booking_quote, entities.PrivateBooking.fields.quoted_total_cents, entities.PrivateBooking.fields.deposit_cents]
        distinguishing_aspect: "A 2-hour, 8-head hold on an 8000/hr room quotes 33040 and a 8260 deposit (per-component rounding, then sum)."
        test_recipe:
          setup: ["Room (8000/hr, capacity 20) exists."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Quote Room", capacity: 20, hourly_rate_cents: 8000 }
              as: Manager
              captures: { room: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T18:00:00Z", end_at: "2026-07-09T20:00:00Z", headcount: 8, expected_room_version: "${rv}" }
              as: Staff
              captures: { pb: $.data.id, q: $.data.quoted_total_cents, dep: $.data.deposit_cents }
          assert:
            - "PrivateBooking.${pb}.quoted_total_cents == 33040  # room 2*8000=16000 + catering 8*1500=12000 + service round(28000*0.18)=5040"
            - "PrivateBooking.${pb}.deposit_cents == 8260  # round(33040*0.25)"

      - name: membership_tier_gold_at_threshold
        claim_type: Constants Applied
        grounds: [calculations.membership_tier, entities.Membership.fields.tier]
        distinguishing_aspect: "A grant lifting lifetime_points to exactly 2000 re-derives tier GOLD (inclusive lower bound)."
        test_recipe:
          setup: ["A fresh member exists."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "gold@x.com", full_name: "Goldie" }
              as: Staff
              captures: { m: $.data.id }
          trigger:
            - call: "POST /memberships/${m}/loyalty-adjustments"
              payload: { points_delta: 2000, reason: "big grant" }
              as: Manager
              captures: { tier: $.data.tier, lp: $.data.lifetime_points }
          assert:
            - "Membership.${m}.lifetime_points == 2000 and Membership.${m}.tier == GOLD"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: reservation_party_exceeds_seats_returns_capacity
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_TABLE_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Booking party_size 5 on a 4-seat table returns ERR_TABLE_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["A 4-seat table exists."]
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "C10", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations"
              payload: { table_id: "${t}", party_size: 5, start_at: "2026-07-05T18:00:00Z", end_at: "2026-07-05T20:00:00Z" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TABLE_CAPACITY_EXCEEDED and http_status == 409"

      - name: book_out_of_service_table_returns_out_of_service
        claim_type: Violation to Error
        grounds: ["validations[priority=10]", "errors[ERR_TABLE_OUT_OF_SERVICE]", entities.Table.fields.status]
        distinguishing_aspect: "Booking a table whose status is OUT_OF_SERVICE returns ERR_TABLE_OUT_OF_SERVICE."
        test_recipe:
          setup: ["A table set OUT_OF_SERVICE via PATCH."]
          setup_api_calls:
            - call: "POST /tables"
              payload: { label: "C11", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Manager
              captures: { t: $.data.id }
            - call: "PATCH /tables/${t}"
              payload: { status: "OUT_OF_SERVICE" }
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: Manager
