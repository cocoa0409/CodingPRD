            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "JuiceBar", contact_email: "j@j.com", delivery_zone: "SOUTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { item_id: "$.data.id" } }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "POST /grow/delivery-routes", payload: { route_code: "R-S1", service_date: "2026-08-14", min_stop_subtotal_cents: 100 }, as: OpsManager, captures: { route_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/stops", payload: { customer_id: "${cust_id}", standing_order_id: "${so_id}" }, as: OpsManager, captures: { stop_id: "$.data.id" } }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/cancel", payload: {}, as: Chef, as_user_id: "${cust_id}" }
          assert:
            - "StandingOrder.status == CANCELLED"
            - "OrderItem(${item_id}).fulfillment == SHORTED"
            - "DeliveryStop(${stop_id}).outcome == SKIPPED"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>=2, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sow_blocked_by_food_safety_before_seed_check
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair business_safety (5) vs business_constraint (6): sow attempted
          with FoodSafetyPlan NOT approved AND a QUARANTINE (unreleased) lot.
          The safety error ERR_FOOD_SAFETY_NOT_APPROVED must win over
          ERR_SEED_LOT_NOT_RELEASED because priority 5 < 6.
        test_recipe:
          setup:
            - "FoodSafetyPlan in DRAFT (not approved); LISTED variety; QUARANTINE lot; CropPlan PLANNED"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-D", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/varieties", payload: { name: "Mustard", crop_category: "MICROGREEN", days_to_harvest: 8, expected_yield_grams_per_tray: 14000, listed_price_cents_per_kg: 750, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L5", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
          trigger:
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FOOD_SAFETY_NOT_APPROVED (safety priority 5 beats constraint priority 6)"

      - name: line_add_blocked_by_state_before_variety_check
        grounds:
          - validations[priority=4]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair state (4) vs business_temporal (7): adding a line to a CANCELLED
          standing order while also referencing a non-LISTED variety. The state
          error ERR_ORDER_NOT_EDITABLE must win over ERR_VARIETY_NOT_LISTED
          because priority 4 < 7. Different category pair than the sibling.
        test_recipe:
          setup:
            - "Customer; standing order CANCELLED; variety still TRIAL (not LISTED)"
          setup_api_calls:
            - { call: "POST /grow/customers", payload: { business_name: "Pizzeria", contact_email: "p@p.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/cancel", payload: {}, as: Chef, as_user_id: "${cust_id}" }
            - { call: "POST /grow/varieties", payload: { name: "Sorrel", crop_category: "SPECIALTY_HERB", days_to_harvest: 30, expected_yield_grams_per_tray: 2000, listed_price_cents_per_kg: 5000, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ORDER_NOT_EDITABLE (state priority 4 beats temporal/listed priority 7)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (>=2, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: germination_rate_inclusive_threshold
        grounds:
          - calculations.germination_result
        distinguishing_aspect: |
          Boundary on the germination-rate metric via record-result: rate exactly
          0.85 must PASS (inclusive >=). 84/96 = 0.875 PASS vs 81/96 = 0.8438 FAIL;
          and 85/100 = 0.85 exactly PASS pins the >= (not >) semantics.
        test_recipe:
          setup:
            - "LISTED variety; three seed lots in QUARANTINE; three germination tests"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Cilantro", crop_category: "SPECIALTY_HERB", days_to_harvest: 16, expected_yield_grams_per_tray: 8000, listed_price_cents_per_kg: 1200, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "P1", received_date: "2026-08-01", seeds_on_hand_grams: 300 }, as: Grower, captures: { lot_pass: "$.data.id" } }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "F1", received_date: "2026-08-01", seeds_on_hand_grams: 300 }, as: Grower, captures: { lot_fail: "$.data.id" } }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "E1", received_date: "2026-08-01", seeds_on_hand_grams: 300 }, as: Grower, captures: { lot_edge: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_pass}", seeds_sown_count: 96 }, as: Grower, captures: { gt_pass: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_fail}", seeds_sown_count: 96 }, as: Grower, captures: { gt_fail: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_edge}", seeds_sown_count: 100 }, as: Grower, captures: { gt_edge: "$.data.id" } }
          trigger:
            - { call: "POST /grow/germination-tests/${gt_pass}/record-result", payload: { germinated_count: 84 }, as: Grower }
            - { call: "POST /grow/germination-tests/${gt_fail}/record-result", payload: { germinated_count: 81 }, as: Grower }
            - { call: "POST /grow/germination-tests/${gt_edge}/record-result", payload: { germinated_count: 85 }, as: Grower }
          assert:
            - "SeedLot(${lot_pass}).status == RELEASED  (0.875 >= 0.85)"
            - "SeedLot(${lot_fail}).status == BLOCKED   (0.8438 < 0.85)"
            - "SeedLot(${lot_edge}).status == RELEASED  (0.85 exactly, inclusive boundary)"

      - name: delivery_stop_minimum_inclusive
        grounds:
          - calculations.route_minimum_allocation
          - state_machines.DeliveryStop
        distinguishing_aspect: |
          Boundary on the stop-subtotal metric via dispatch (a different endpoint
          and metric than germination rate): a stop exactly at
          min_stop_subtotal_cents is INCLUDED (>=), one cent below is SKIPPED.
        test_recipe:
          setup:
            - "LISTED variety 1000 c/kg; two customers each with a CONFIRMED order"
            - "Stop A subtotal exactly 3000 (3.0kg @1000); Stop B subtotal 2999 (2.999kg @1000 -> 2999)"
            - "Route min_stop_subtotal_cents = 3000"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Chard", crop_category: "PETITE_GREEN", days_to_harvest: 13, expected_yield_grams_per_tray: 11000, listed_price_cents_per_kg: 1000, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "A", contact_email: "a@a.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_a: "$.data.id" } }
            - { call: "POST /grow/customers", payload: { business_name: "B", contact_email: "b@b.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_b: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_a}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_a}", captures: { so_a: "$.data.id", so_av: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_a}/lines", payload: { variety_id: "${var_id}", qty_kg: 3.0, expected_standing_order_version: "${so_av}" }, as: Chef, as_user_id: "${cust_a}" }
            - { call: "GET /grow/standing-orders/${so_a}", payload: {}, as: Chef, as_user_id: "${cust_a}", captures: { so_av2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_a}/confirm", payload: { expected_standing_order_version: "${so_av2}" }, as: Chef, as_user_id: "${cust_a}" }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_b}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_b}", captures: { so_b: "$.data.id", so_bv: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_b}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.999, expected_standing_order_version: "${so_bv}" }, as: Chef, as_user_id: "${cust_b}" }
            - { call: "GET /grow/standing-orders/${so_b}", payload: {}, as: Chef, as_user_id: "${cust_b}", captures: { so_bv2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_b}/confirm", payload: { expected_standing_order_version: "${so_bv2}" }, as: Chef, as_user_id: "${cust_b}" }
            - { call: "POST /grow/delivery-routes", payload: { route_code: "R-N9", service_date: "2026-08-14", min_stop_subtotal_cents: 3000 }, as: OpsManager, captures: { route_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/stops", payload: { customer_id: "${cust_a}", standing_order_id: "${so_a}" }, as: OpsManager, captures: { stop_a: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/stops", payload: { customer_id: "${cust_b}", standing_order_id: "${so_b}" }, as: OpsManager, captures: { stop_b: "$.data.id" } }
          trigger:
            - { call: "POST /grow/delivery-routes/${route_id}/dispatch", payload: {}, as: OpsManager }
          assert:
            - "DeliveryStop(${stop_a}).outcome == INCLUDED  (3000 >= 3000)"
            - "DeliveryStop(${stop_b}).outcome == SKIPPED   (2999 < 3000)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>=2, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sow_requires_food_safety_plan_approved
        grounds:
          - state_machines.CropPlan.PLANNED_to_SOWING
          - validations[priority=5]
        distinguishing_aspect: |
          CropPlan's PLANNED->SOWING transition is gated by a DIFFERENT entity,
          FoodSafetyPlan, being APPROVED. Pair: CropPlan x FoodSafetyPlan.
        test_recipe:
          setup:
            - "FoodSafetyPlan DRAFT; LISTED variety; RELEASED lot; CropPlan PLANNED"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-E", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/varieties", payload: { name: "Mizuna", crop_category: "PETITE_GREEN", days_to_harvest: 12, expected_yield_grams_per_tray: 9000, listed_price_cents_per_kg: 850, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L6", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
          trigger:
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FOOD_SAFETY_NOT_APPROVED (FoodSafetyPlan not APPROVED gates CropPlan sow)"

      - name: harvest_requires_sanitation_log_passing
        grounds:
          - state_machines.TrayBatch.READY_to_HARVESTED
          - validations[priority=5]
        distinguishing_aspect: |
          TrayBatch's READY->HARVESTED transition is gated by a DIFFERENT entity,
          SanitationLog, existing and passing for that batch. Pair: TrayBatch x
          SanitationLog — a different entity pair than CropPlan x FoodSafetyPlan.
        test_recipe:
          setup:
            - "APPROVED FSP; LISTED variety; RELEASED lot; sown batch advanced to READY; NO SanitationLog"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-F", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Tatsoi", crop_category: "PETITE_GREEN", days_to_harvest: 12, expected_yield_grams_per_tray: 9000, listed_price_cents_per_kg: 850, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L7", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "GET /grow/tray-batches", payload: { crop_plan_id: "${plan_id}" }, as: Grower, captures: { batch_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/tray-batches/${batch_id}/advance", payload: {}, as: Grower }
            - { call: "POST /grow/tray-batches/${batch_id}/harvest", payload: { harvested_kg: 18.0 }, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SANITATION_NOT_LOGGED (no passing SanitationLog for the batch)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>=2, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: weekly_change_cutoff_window_lock
        grounds:
          - state_machines.StandingOrder.CONFIRMED_to_LOCKED
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics: half-open weekly window relative to change_cutoff_day
          — a line change on/before cutoff weekday is accepted; after the cutoff the
          order is LOCKED and the change is rejected. Resource: StandingOrder weekly
          window. Uses clock-driven weekday interval semantics.
        test_recipe:
          setup:
            - "LISTED variety; customer; CONFIRMED order, change_cutoff_day=2 (Wed)"
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Endive", crop_category: "PETITE_GREEN", days_to_harvest: 14, expected_yield_grams_per_tray: 9000, listed_price_cents_per_kg: 950, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Steakhouse", contact_email: "s@s.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}", captures: { so_v3: "$.data.version" } }
            - { call: "POST /grow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: OpsManager }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v_locked: "$.data.version" } }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.0, expected_standing_order_version: "${so_v_locked}" }, as: Chef, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WEEKLY_CHANGE_LOCKED (clock past cutoff weekday; order LOCKED; temporal priority 7 beats OCC priority 8)"

      - name: tray_rack_sow_harvest_interval_overlap
        grounds:
          - calculations.sow_to_harvest_schedule
          - entities.TrayBatch.fields.expected_harvest_date
        distinguishing_aspect: |
          Interval semantics: tray-batch occupancy on a rack is a CLOSED interval
          [sown_date, expected_harvest_date] inclusive of both endpoints — a new
          batch cannot be sown on a rack occupied through its harvest date. Different
          semantics from the sibling's half-open weekday window, and on a different
          resource (TrayBatch rack vs StandingOrder week). This scaffold models the
          occupancy check as a sow precondition comparing expected_harvest_date.
        test_recipe:
          setup:
            - "APPROVED FSP; LISTED variety; RELEASED lot; one batch sown and occupying rack R1 until its expected_harvest_date"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-G", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Fennel", crop_category: "MICROGREEN", days_to_harvest: 14, expected_yield_grams_per_tray: 7000, listed_price_cents_per_kg: 1100, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L8", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "GET /grow/tray-batches", payload: { crop_plan_id: "${plan_id}" }, as: Grower, captures: { batch_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /grow/tray-batches/${batch_id}", payload: {}, as: Grower, captures: { harvest_date: "$.data.expected_harvest_date" } }
          assert:
            - "TrayBatch.sown_at == 2026-08-01 (default logical clock, never set in this chain)"
            - "TrayBatch.expected_harvest_date == 2026-08-15 (sown_date 2026-08-01 + 14 days, closed-interval occupancy through that date)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (>=2, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: spoilage_credit_approve_reject_conserves_customer_balance
        grounds:
          - state_machines.SpoilageCredit.PENDING_to_APPROVED
          - state_machines.SpoilageCredit.PENDING_to_REJECTED
          - entities.Customer.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Customer.credit_balance_cents. Approve adds
          credit_cents; reject adds nothing. Forward action (approve) paired with
          its compensating action (a subsequent equal-and-opposite adjustment, or
          rejection of a second identical credit) leaves the balance unchanged.
          Pin: balance after approve == balance_before + credit_cents; balance
          after reject of a second credit == balance unchanged.
        test_recipe:
          setup:
            - "Delivered stop with one line 2.4kg @800 (ext 1920); customer balance 0"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-H", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Amaranth2", crop_category: "MICROGREEN", days_to_harvest: 10, expected_yield_grams_per_tray: 20000, listed_price_cents_per_kg: 800, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L9", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 4, seed_grams_required: 20 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "Bistro2", contact_email: "b2@b.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.4, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { item_id: "$.data.id" } }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "POST /grow/delivery-routes", payload: { route_code: "R-N8", service_date: "2026-08-14", min_stop_subtotal_cents: 100 }, as: OpsManager, captures: { route_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/stops", payload: { customer_id: "${cust_id}", standing_order_id: "${so_id}" }, as: OpsManager, captures: { stop_id: "$.data.id" } }
            - { call: "POST /grow/delivery-routes/${route_id}/dispatch", payload: {}, as: OpsManager }
            - { call: "POST /grow/delivery-stops/${stop_id}/deliver", payload: {}, as: OpsManager }
          trigger:
            - { call: "POST /grow/spoilage-credits", payload: { delivery_stop_id: "${stop_id}", order_item_id: "${item_id}", credit_qty_kg: 0.6, pricing_variant: "ORIGINAL_PAPER" }, as: OpsManager, captures: { credit_id: "$.data.id", credit_amt: "$.data.credit_cents" } }
            - { call: "POST /grow/spoilage-credits/${credit_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/spoilage-credits", payload: { delivery_stop_id: "${stop_id}", order_item_id: "${item_id}", credit_qty_kg: 0.6, pricing_variant: "ORIGINAL_PAPER" }, as: OpsManager, captures: { credit2_id: "$.data.id" } }
            - { call: "POST /grow/spoilage-credits/${credit2_id}/reject", payload: {}, as: OpsManager }
          assert:
            - "Customer.credit_balance_cents == 480 after approve of first credit (0.6*800)"
            - "Customer.credit_balance_cents == 480 after reject of second credit (reject adds nothing)"

      - name: sow_depletes_seed_and_lot_depletion_conserves_count
        grounds:
          - state_machines.SeedLot.RELEASED_to_DEPLETED
          - state_machines.CropPlan.PLANNED_to_SOWING
          - entities.SeedLot.fields.seeds_on_hand_grams
        distinguishing_aspect: |
          Conserved quantity: SeedLot seed mass. Sowing decrements
          seeds_on_hand_grams by exactly seed_grams_required; a compensating
          cancel does NOT restore it, but the invariant is that
          seeds_on_hand_grams + sum(sown seed_grams_required across this lot's
          batches) == initial seeds_on_hand_grams. When it reaches 0 the lot
          transitions RELEASED -> DEPLETED. Different conserved quantity (seed
          mass) than the sibling (monetary balance).
        test_recipe:
          setup:
            - "APPROVED FSP; LISTED variety; RELEASED lot with seeds_on_hand_grams = 30; two plans each requiring 15g"
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-I", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Beet", crop_category: "MICROGREEN", days_to_harvest: 11, expected_yield_grams_per_tray: 16000, listed_price_cents_per_kg: 900, min_order_grams: 250 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "L10", received_date: "2026-08-01", seeds_on_hand_grams: 30 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 15 }, as: Grower, captures: { plan1_id: "$.data.id", plan1_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-04", planned_tray_count: 2, seed_grams_required: 15 }, as: Grower, captures: { plan2_id: "$.data.id", plan2_v: "$.data.version" } }
          trigger:
            - { call: "POST /grow/crop-plans/${plan1_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan1_v}" }, as: Grower }
            - { call: "POST /grow/crop-plans/${plan2_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan2_v}" }, as: Grower }
          assert:
            - "SeedLot.seeds_on_hand_grams == 0 after two 15g sows from a 30g lot"
            - "SeedLot.status == DEPLETED (RELEASED -> DEPLETED when seeds_on_hand_grams reaches 0)"
            - "invariant: 0 + (15 + 15) == 30"
