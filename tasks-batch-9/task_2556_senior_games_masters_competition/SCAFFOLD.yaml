scenario: "2556. Senior Games & Masters Competition (senior games organizing committee): athlete registration with age group assignment, sport selection and qualification from local or state qualifying events, sport-specific rules adaptation with age-based equipment and format modifications, venue and schedule construction across many sports with conflict avoidance for multi-sport athletes, medical screening recommendations, on-site medical coverage and emergency protocols, volunteer recruitment and official assignment by sport with certification requirements, results, records and national qualification tracking with age group record ratification, social programming, athlete village and accommodation coordination, sponsorship and municipal support with economic impact reporting"
domain_name: "senior-games-masters-competition"
api_prefix: "/senior-games"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Junction entities (SportEntry links Athlete<->SportEvent, PersonnelAssignment links
  # Personnel<->SessionSlot, VillageStay links Athlete<->AccommodationBlock) plus a
  # self-referential supersede chain on AgeGroupRecord. No URL nesting deeper than one
  # action segment; all relationships are carried by FK fields, not by path hierarchy.

  state_machine_shape: branching
  # Non-linear in three independent ways: SportEntry carries a REVISION_REQUESTED ->
  # SUBMITTED revision cycle and an ACCEPTED <-> MEDICAL_HOLD cycle; Athlete carries two
  # independent dimensions (registration_status x medical_status); CompetitionResult forks
  # VERIFIED -> {RECORD_PENDING, PUBLISHED} with divergent side-effect sets and loops back
  # through PROTESTED -> SUBMITTED.

  relationship_patterns:
    - one_to_many        # GamesEdition -> Venue / Athlete / Personnel / AccommodationBlock
    - many_to_many       # SportEntry, PersonnelAssignment, VillageStay junctions
    - self_referential   # AgeGroupRecord.superseded_record_id -> AgeGroupRecord.id
    - cross_aggregate    # SportEntry acceptance reads Athlete.medical_status across aggregates

  role_model: segregation_of_duties
  # A CompetitionResult's verifier (verified_by_user_id) may not be the operator who
  # ratifies the AgeGroupRecord derived from it, and the Personnel who submitted the
  # result may not hold the ratifying claim. Enforced by §1.4 priority 58 / 59.

  consistency_model: immediate

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: GamesEdition
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Public name of the games edition, e.g. 'Silverline State Senior Games 2026'."
      - name: host_city
        type: string
        source: input
        description: "Host municipality name, printed on the economic impact report."
      - name: host_state_code
        type: string
        source: input
        description: "Two-letter host state code; drives residency-based qualification exemptions."
        constraints: "exactly 2 uppercase letters"
      - name: competition_start_date
        type: string
        source: input
        description: "First competition day (calendar date, YYYY-MM-DD). Basis for the FIRST_COMPETITION_DAY age variant."
      - name: competition_end_date
        type: string
        source: input
        description: "Last competition day (YYYY-MM-DD)."
        constraints: "must be >= competition_start_date"
      - name: age_reference_date
        type: string
        source: input
        description: "Masters age reference date (YYYY-MM-DD); age on this date fixes the ratification age group."
        constraints: "must be >= competition_end_date"
      - name: age_basis
        type: enum
        source: input
        description: "Which age basis the registration path uses when assigning Athlete.age_group_code."
        default: REFERENCE_DATE
        constraints: "one of {REFERENCE_DATE, FIRST_COMPETITION_DAY}"
      - name: registration_deadline_utc
        type: datetime
        source: input
        description: "Instant after which POST /sport-entries is refused and unpaid athletes expire on the next ops-run."
      - name: municipal_support_cents
        type: integer
        source: input
        description: "Cash support pledged by the host municipality, reported alongside sponsorship recognition."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Edition lifecycle state; gates registration, scheduling, and impact finalization."
        default: DRAFT
        constraints: "one of {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED, IN_PROGRESS, COMPLETED, IMPACT_FINALIZED}"
      - name: ops_epoch
        type: integer
        source: system
        description: "Monotonic counter incremented by each ops-run checkpoint; stamped on promotions and expiries."
        default: 0
      - name: sponsorship_recognized_cents
        type: integer
        source: computed
        description: "Ledger of recognized sponsorship value; equals the sum of recognized_cents over SponsorshipCommitment rows with status == ALLOCATED."
        default: 0
      - name: provisional_impact_cents
        type: integer
        source: computed
        description: "Forward-looking economic impact estimate, refreshed by every ops-run."
        default: 0
      - name: final_impact_cents
        type: integer
        source: computed
        description: "Chronological actual-stay economic impact; null until POST /finalize-impact succeeds."
        default: null

  - name: Sport
    parent: null
    common_fields: true
    fields:
      - name: sport_code
        type: string
        source: input
        description: "Short sport code, globally unique across Sport rows, e.g. 'TF', 'SWIM', 'PBALL'."
        constraints: "unique; 2-8 uppercase letters"
      - name: name
        type: string
        source: input
        description: "Human-readable sport name."
      - name: contact_class
        type: enum
        source: input
        description: "Physical-contact class used by the medical risk load term."
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: mark_direction
        type: enum
        source: input
        description: "Whether a numerically lower or higher mark_value is the better performance; drives seeding rank and record comparison."
        constraints: "one of {LOWER_IS_BETTER, HIGHER_IS_BETTER}"
      - name: required_certification_level
        type: integer
        source: input
        description: "Minimum Personnel.certification_level for an OFFICIAL assigned to a slot of this sport."
        constraints: "0..4"
      - name: min_age
        type: integer
        source: input
        description: "Sport-specific minimum basis age; may exceed the games-wide floor of 50."
        default: 50
        constraints: ">= 50"
      - name: equipment_profile
        type: object
        source: input
        description: "Age-group keyed equipment modifications, e.g. {'70-74': {'implement_weight_kg': 3.0}}. Opaque to the engine; echoed on read."
        default: {}
      - name: format_modifications
        type: object
        source: input
        description: "Age-group keyed format modifications, e.g. {'80-84': {'heat_length_m': 60}}. Opaque to the engine; echoed on read."
        default: {}

  - name: SportEvent
    parent: Sport
    common_fields: true
    fields:
      - name: sport_id
        type: string
        source: input
        description: "FK -> Sport.id; supplies mark_direction, contact_class, and required_certification_level."
      - name: games_edition_id
        type: string
        source: input
        description: "FK -> GamesEdition.id; the edition this event belongs to."
      - name: event_code
        type: string
        source: input
        description: "Event code within the sport, e.g. '100M', '5K_ROAD', 'DOUBLES'."
      - name: age_group_code
        type: string
        source: input
        description: "Five-year age band this event is contested in, e.g. '60-64' or '100+'."
        constraints: "matches ^(5[0-9]|[6-9][0-9])-(5[0-9]|[6-9][0-9])$ or the literal '100+'"
      - name: gender_division
        type: enum
        source: input
        description: "Division the event is contested in."
        constraints: "one of {MEN, WOMEN, MIXED}"
      - name: entry_fee_cents
        type: integer
        source: input
        description: "Per-event fee added to the athlete's fee settlement for each non-terminal entry."
        constraints: ">= 0"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of ACCEPTED entries the event can hold."
        constraints: ">= 1"
      - name: min_entries_to_stage
        type: integer
        source: input
        description: "Accepted-entry floor; dropping below it drives the event to UNDERSUBSCRIBED."
        default: 3
        constraints: ">= 1"
      - name: national_qualifying_standard
        type: number
        source: input
        description: "Mark that a verified result must beat (per Sport.mark_direction) to set CompetitionResult.national_qualifying = true. Null disables national qualification for this event."
        default: null
      - name: accepted_entry_count
        type: integer
        source: computed
        description: "Count of SportEntry rows for this event with status == ACCEPTED. Maintained incrementally by every entry transition into or out of ACCEPTED."
        default: 0
      - name: available_slots
        type: integer
        source: computed
        description: "capacity - accepted_entry_count; never negative. Conserved-quantity partner of accepted_entry_count."
        default: 0
      - name: current_record_id
        type: string
        source: computed
        description: "FK -> AgeGroupRecord.id; denormalized pointer to the single RATIFIED record for this event, null until one is ratified."
        default: null
      - name: status
        type: enum
        source: system
        description: "Event lifecycle state; gates entry review, seeding, and slot scheduling."
        default: OPEN
        constraints: "one of {OPEN, SEEDED, UNDERSUBSCRIBED, SCHEDULE_HOLD, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: seeded_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the event was seeded; null before seeding, reset to null when the event returns to OPEN."
        default: null

  - name: Venue
    parent: GamesEdition
    common_fields: true
    fields:
      - name: games_edition_id
        type: string
        source: input
        description: "FK -> GamesEdition.id; the edition this venue serves."
      - name: name
        type: string
        source: input
        description: "Venue name."
      - name: competition_area_count
        type: integer
        source: input
        description: "Number of independently usable competition areas; the aggregate concurrency capacity for overlapping session slots."
        constraints: ">= 1"
      - name: spectator_capacity
        type: integer
        source: input
        description: "Seated spectator capacity; reported in the economic impact packet."
        constraints: ">= 0"
      - name: has_onsite_medical_bay
        type: boolean
        source: input
        description: "Whether a staffed medical bay is present; required for events whose sport contact_class == HIGH."
        default: false
      - name: emergency_protocol_code
        type: enum
        source: input
        description: "On-site emergency protocol tier in force at this venue."
        constraints: "one of {EP_BASIC, EP_ADVANCED, EP_CARDIAC}"
      - name: status
        type: enum
        source: system
        description: "Venue availability; CLOSED displaces every scheduled slot at the venue."
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: closed_reason
        type: string
        source: system
        description: "Free-text reason recorded when the venue is closed; null while OPEN."
        default: null

  - name: SessionSlot
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue occupied by this slot."
      - name: sport_event_id
        type: string
        source: input
        description: "FK -> SportEvent.id; the event contested in this slot."
      - name: start_utc
        type: datetime
        source: input
        description: "Inclusive start instant of the competition block."
      - name: end_utc
        type: datetime
        source: input
        description: "Exclusive end instant of the competition block."
        constraints: "must be > start_utc"
      - name: teardown_buffer_minutes
        type: integer
        source: input
        description: "Minutes of field-of-play teardown appended to end_utc when testing venue-area occupancy."
        default: 15
        constraints: "0..120"
      - name: required_official_count
        type: integer
        source: input
        description: "Number of CONFIRMED OFFICIAL assignments the slot needs before it may start."
        default: 2
        constraints: ">= 1"
      - name: confirmed_official_count
        type: integer
        source: computed
        description: "Count of PersonnelAssignment rows on this slot with status == CONFIRMED and Personnel.personnel_type == OFFICIAL."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle state; RELEASED and DISPLACED both free the venue interval."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, DISPLACED, RELEASED}"

  - name: Athlete
    parent: GamesEdition
    common_fields: true
    fields:
      - name: games_edition_id
        type: string
        source: input
        description: "FK -> GamesEdition.id; the edition this registration belongs to."
      - name: full_name
        type: string
        source: input
        description: "Athlete legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique per games_edition_id."
        constraints: "unique within (games_edition_id, email)"
      - name: date_of_birth
        type: string
        source: input
        description: "Birth date (YYYY-MM-DD); the sole input to both age variants."
      - name: residency_state_code
        type: string
        source: input
        description: "Two-letter state of residence; must equal GamesEdition.host_state_code unless qualification_source == ORGANIZER_INVITE on every entry."
        constraints: "exactly 2 uppercase letters"
      - name: age_at_reference
        type: integer
        source: computed
        description: "Whole years elapsed from date_of_birth to GamesEdition.age_reference_date, inclusive of a birthday landing on that date."
        default: 0
      - name: age_at_first_day
        type: integer
        source: computed
        description: "Whole years elapsed from date_of_birth to GamesEdition.competition_start_date, inclusive of a birthday landing on that date."
        default: 0
      - name: age_group_code
        type: string
        source: computed
        description: "Five-year band derived from the basis age selected by GamesEdition.age_basis."
        default: null
      - name: registration_status
        type: enum
        source: system
        description: "Registration dimension of the athlete's parallel state; independent of medical_status."
        default: PENDING_PAYMENT
        constraints: "one of {PENDING_PAYMENT, REGISTERED, CHECKED_IN, WITHDRAWN, EXPIRED}"
      - name: medical_status
        type: enum
        source: system
        description: "Medical dimension of the athlete's parallel state; independent of registration_status."
        default: NOT_SCREENED
        constraints: "one of {NOT_SCREENED, SCREENED_CLEARED, SCREENED_RESTRICTED, SCREENED_HOLD, CLEARED_BY_APPEAL}"
      - name: fee_total_cents
        type: integer
        source: computed
        description: "Settled registration fee produced by the pinned six-step fee settlement; recomputed at pay-fees time only."
        default: 0
      - name: fee_paid_cents
        type: integer
        source: computed
        description: "Cents actually collected; equals fee_total_cents after a successful pay-fees call."
        default: 0
      - name: fee_breakdown
        type: object
        source: computed
        description: "Pinned intermediate values of the fee settlement: {entry_count, event_fees_cents, subtotal_cents, discount_pct, discount_cents, discounted_cents, surcharge_cents}."
        default: {}

  - name: QualifyingResult
    parent: Athlete
    common_fields: false
    fields:
      - name: athlete_id
        type: string
        source: input
        description: "FK -> Athlete.id; the athlete who produced this qualifying mark."
      - name: sport_id
        type: string
        source: input
        description: "FK -> Sport.id; the sport the qualifying meet was contested in."
      - name: event_code
        type: string
        source: input
        description: "Event code at the qualifying meet; must equal the SportEvent.event_code of any entry that cites this result."
      - name: mark_value
        type: number
        source: input
        description: "Performance mark achieved at the qualifying meet."
        constraints: "> 0"
      - name: meet_date
        type: string
        source: input
        description: "Calendar date of the qualifying meet (YYYY-MM-DD); must fall inside the qualifying window."
      - name: meet_level
        type: enum
        source: input
        description: "Whether the meet was a local or a state qualifier; fixes the entry's qualification priority."
        constraints: "one of {LOCAL, STATE}"
      - name: sanctioned
        type: boolean
        source: input
        description: "Whether the meet was sanctioned by the state association; unsanctioned marks cannot support an entry."

  - name: SportEntry
    parent: null
    common_fields: true
    fields:
      - name: athlete_id
        type: string
        source: input
        description: "FK -> Athlete.id; the entering athlete."
      - name: sport_event_id
        type: string
        source: input
        description: "FK -> SportEvent.id; the event entered."
      - name: qualifying_result_id
        type: string
        source: input
        description: "FK -> QualifyingResult.id; required when qualification_source IN {STATE_QUALIFIER, LOCAL_QUALIFIER}, must be null otherwise."
        default: null
      - name: qualification_source
        type: enum
        source: input
        description: "How the athlete qualified for this event."
        constraints: "one of {STATE_QUALIFIER, LOCAL_QUALIFIER, AGE_EXEMPT, ORGANIZER_INVITE}"
      - name: qualification_priority
        type: integer
        source: computed
        description: "Rank weight derived from qualification_source: STATE_QUALIFIER=1, LOCAL_QUALIFIER=2, AGE_EXEMPT=3, ORGANIZER_INVITE=4."
        default: 4
      - name: qualifying_mark
        type: number
        source: computed
        description: "Copied from QualifyingResult.mark_value at creation; null for AGE_EXEMPT and ORGANIZER_INVITE entries."
        default: null
      - name: revision_round
        type: integer
        source: system
        description: "Number of completed REVISION_REQUESTED -> SUBMITTED loops; a third request is refused."
        default: 0
      - name: review_note
        type: string
        source: system
        description: "Reviewer note recorded by the most recent review decision; null before first review."
        default: null
      - name: status
        type: enum
        source: system
        description: "Entry lifecycle state; ACCEPTED occupies one SportEvent capacity slot."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, ACCEPTED, WAITLISTED, MEDICAL_HOLD, REJECTED, WITHDRAWN}"

  - name: MedicalScreening
    parent: Athlete
    common_fields: false
    fields:
      - name: athlete_id
        type: string
        source: input
        description: "FK -> Athlete.id; the screened athlete."
      - name: screened_by_user_id
        type: string
        source: input
        description: "Opaque MedicalDirector operator identifier; NOT a foreign key to any entity."
      - name: systolic_bp
        type: integer
        source: input
        description: "Resting systolic blood pressure in mmHg; feeds the bp term of the risk score."
        constraints: "60..260"
      - name: resting_hr
        type: integer
        source: input
        description: "Resting heart rate in bpm; feeds the hr term of the risk score."
        constraints: "30..200"
      - name: prior_cardiac_event
        type: boolean
        source: input
        description: "Whether the athlete reports a prior cardiac event; applies the 1.6 multiplier."
      - name: contact_sport_count
        type: integer
        source: computed
        description: "Count of the athlete's non-terminal SportEntry rows whose SportEvent's Sport.contact_class == HIGH, snapshotted at screening time."
        default: 0
      - name: risk_score
        type: number
        source: computed
        description: "Composite risk score, one decimal place, clamped to 100.0."
        default: 0
      - name: recommendation
        type: enum
        source: computed
        description: "Screening recommendation derived from risk_score bands."
        constraints: "one of {CLEARED, CLEARED_WITH_RESTRICTION, HOLD_PENDING_PHYSICIAN_REVIEW}"
      - name: screened_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the screening was recorded."

  - name: Personnel
    parent: GamesEdition
    common_fields: true
    fields:
      - name: games_edition_id
        type: string
        source: input
        description: "FK -> GamesEdition.id; the edition this official or volunteer serves."
      - name: full_name
        type: string
        source: input
        description: "Personnel name."
      - name: personnel_type
        type: enum
        source: input
        description: "OFFICIAL rows count toward SessionSlot.confirmed_official_count and are certification-gated; VOLUNTEER rows are not."
        constraints: "one of {OFFICIAL, VOLUNTEER}"
      - name: certification_level
        type: integer
        source: input
        description: "Officiating certification level; compared against Sport.required_certification_level on assignment."
        default: 0
        constraints: "0..4"
      - name: certified_sport_codes
        type: array
        source: input
        description: "Sport codes this person is certified for; an OFFICIAL assignment requires the slot's Sport.sport_code to be a member."
        default: []
      - name: assigned_minutes_total
        type: integer
        source: computed
        description: "Sum of duration_minutes over this person's PersonnelAssignment rows with status IN {ASSIGNED, CONFIRMED, COMPLETED}."
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: "Count of this person's PersonnelAssignment rows with status == NO_SHOW."
        default: 0

  - name: PersonnelAssignment
    parent: null
    common_fields: true
    fields:
      - name: personnel_id
        type: string
        source: input
        description: "FK -> Personnel.id; the assigned official or volunteer."
      - name: session_slot_id
        type: string
        source: input
        description: "FK -> SessionSlot.id; the slot being staffed."
      - name: role_at_event
        type: enum
        source: input
        description: "Duty performed at the slot."
        constraints: "one of {CHIEF_JUDGE, JUDGE, TIMER, MARSHAL, RUNNER}"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between the slot's start_utc and end_utc, snapshotted at assignment creation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state."
        default: ASSIGNED
        constraints: "one of {ASSIGNED, CONFIRMED, COMPLETED, RELEASED, NO_SHOW}"

  - name: CompetitionResult
    parent: null
    common_fields: true
    fields:
      - name: sport_entry_id
        type: string
        source: input
        description: "FK -> SportEntry.id; the entry the mark belongs to."
      - name: session_slot_id
        type: string
        source: input
        description: "FK -> SessionSlot.id; the slot the mark was produced in."
      - name: submitted_by_personnel_id
        type: string
        source: input
        description: "FK -> Personnel.id; the OFFICIAL who recorded the mark."
      - name: mark_value
        type: number
        source: input
        description: "Recorded performance mark."
        constraints: "> 0"
      - name: placement
        type: integer
        source: input
        description: "Finishing place within the event; 1 = gold."
        constraints: ">= 1"
      - name: verified_by_user_id
        type: string
        source: system
        description: "Opaque RegistrationOfficer identifier stamped on verification; NOT a foreign key. Segregation of duties compares it against the ratifier."
        default: null
      - name: national_qualifying
        type: boolean
        source: computed
        description: "True when the verified mark beats SportEvent.national_qualifying_standard per Sport.mark_direction; computed on the verify transition, false while SUBMITTED."
        default: false
      - name: protest_round
        type: integer
        source: system
        description: "Number of completed PROTESTED -> SUBMITTED loops; a second protest on the same result is refused."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Result lifecycle state; the verify transition forks on record eligibility."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, VERIFIED, RECORD_PENDING, PUBLISHED, PROTESTED, VOIDED}"

  - name: AgeGroupRecord
    parent: null
    common_fields: true
    fields:
      - name: sport_event_id
        type: string
        source: input
        description: "FK -> SportEvent.id; the record scope is (sport_event_id) exactly."
      - name: competition_result_id
        type: string
        source: input
        description: "FK -> CompetitionResult.id; the result being claimed as a record."
      - name: holder_athlete_id
        type: string
        source: computed
        description: "FK -> Athlete.id; resolved from the cited result's SportEntry.athlete_id at claim time."
      - name: superseded_record_id
        type: string
        source: computed
        description: "FK -> AgeGroupRecord.id; the previously RATIFIED record for the same sport_event_id, or null when this is the first record in the scope."
        default: null
      - name: age_group_code
        type: string
        source: computed
        description: "Copied from the SportEvent.age_group_code at claim time."
      - name: mark_value
        type: number
        source: computed
        description: "Copied from CompetitionResult.mark_value at claim time."
      - name: claimed_by_user_id
        type: string
        source: input
        description: "Opaque RecordsRatifier identifier that filed the claim; NOT a foreign key."
      - name: ratified_by_user_id
        type: string
        source: system
        description: "Opaque RecordsRatifier identifier that ratified the claim; NOT a foreign key. Must differ from both claimed_by_user_id and the cited result's verified_by_user_id."
        default: null
      - name: status
        type: enum
        source: system
        description: "Ratification state; SUPERSEDED is written by a later ratification in the same scope."
        default: PENDING_RATIFICATION
        constraints: "one of {PENDING_RATIFICATION, RATIFIED, REJECTED, SUPERSEDED}"

  - name: AccommodationBlock
    parent: GamesEdition
    common_fields: true
    fields:
      - name: games_edition_id
        type: string
        source: input
        description: "FK -> GamesEdition.id; the edition this village block serves."
      - name: name
        type: string
        source: input
        description: "Block name, e.g. 'Maple Hall'."
      - name: bed_capacity
        type: integer
        source: input
        description: "Beds available on any single night; the aggregate per-night occupancy ceiling."
        constraints: ">= 1"
      - name: nightly_rate_cents
        type: integer
        source: input
        description: "Charge per bed-night, used for VillageStay.total_charge_cents."
        constraints: ">= 0"
      - name: accessible_units
        type: integer
        source: input
        description: "Subset of beds that are step-free; reported but not separately allocated."
        default: 0
        constraints: ">= 0"
      - name: reserved_bed_nights
        type: integer
        source: computed
        description: "Sum of nights over VillageStay rows on this block with status IN {RESERVED, CHECKED_IN, COMPLETED}; the conserved bed-night ledger."
        default: 0

  - name: VillageStay
    parent: null
    common_fields: true
    fields:
      - name: athlete_id
        type: string
        source: input
        description: "FK -> Athlete.id; the athlete housed."
      - name: accommodation_block_id
        type: string
        source: input
        description: "FK -> AccommodationBlock.id; the block holding the bed."
      - name: check_in_date
        type: string
        source: input
        description: "Inclusive first night (YYYY-MM-DD)."
      - name: check_out_date
        type: string
        source: input
        description: "Exclusive departure date (YYYY-MM-DD); the night of check_out_date is NOT occupied."
        constraints: "must be > check_in_date"
      - name: nights
        type: integer
        source: computed
        description: "check_out_date - check_in_date in whole days; the bed-night quantity this stay consumes."
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: "nights * AccommodationBlock.nightly_rate_cents, snapshotted at reservation time."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Stay lifecycle state; RESERVED, CHECKED_IN and COMPLETED all hold bed-nights, CANCELLED releases them."
        default: RESERVED
        constraints: "one of {RESERVED, CHECKED_IN, COMPLETED, CANCELLED}"

  - name: SponsorshipCommitment
    parent: GamesEdition
    common_fields: true
    fields:
      - name: games_edition_id
        type: string
        source: input
        description: "FK -> GamesEdition.id; the edition supported."
      - name: sponsor_name
        type: string
        source: input
        description: "Sponsor or municipal department name."
      - name: sponsor_kind
        type: enum
        source: input
        description: "Category of support, reported separately in the impact packet."
        constraints: "one of {CORPORATE, MUNICIPAL, FOUNDATION}"
      - name: tier
        type: enum
        source: input
        description: "Recognition tier; fixes the in-kind multiplier used by the allocation."
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"
      - name: pledged_cents
        type: integer
        source: input
        description: "Cash pledged by the sponsor."
        constraints: ">= 1"
      - name: recognized_cents
        type: integer
        source: computed
        description: "Sum of the four per-bucket rounded allocations; 0 before allocation and reset to 0 on withdrawal."
        default: 0
      - name: allocation_map
        type: object
        source: computed
        description: "Per-bucket recognized cents: {VENUE_SIGNAGE, ATHLETE_SERVICES, MEDICAL_COVERAGE, SOCIAL_PROGRAM}; empty object before allocation and reset to empty on withdrawal."
        default: {}
      - name: status
        type: enum
        source: system
        description: "Commitment lifecycle state."
        default: PLEDGED
        constraints: "one of {PLEDGED, ALLOCATED, WITHDRAWN}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: GamesEdition
    initial_state: DRAFT
    terminal_states: [IMPACT_FINALIZED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /senior-games/games-editions/{games_edition_id}/open-registration"
        actor: GamesAdmin
        preconditions:
          - "edition.status == DRAFT"
          - "at least one SportEvent with games_edition_id == edition.id exists with status == OPEN"
          - "logical clock < edition.registration_deadline_utc"
        side_effects:
          - "edition.status = REGISTRATION_OPEN"
          - "increments GamesEdition.version by 1"
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /senior-games/games-editions/{games_edition_id}/ops-run when the logical clock is >= edition.registration_deadline_utc"
        actor: system
        preconditions:
          - "edition.status == REGISTRATION_OPEN"
          - "logical clock >= edition.registration_deadline_utc"
        side_effects:
          - "edition.status = REGISTRATION_CLOSED"
          - "every Athlete of this edition with registration_status == PENDING_PAYMENT and fee_paid_cents < fee_total_cents moves to EXPIRED (see Athlete PENDING_PAYMENT_to_EXPIRED, which itself cascades that athlete's non-terminal SportEntry rows to WITHDRAWN)"
          - "increments GamesEdition.ops_epoch by 1"
          - "recomputes edition.provisional_impact_cents via calculations.economic_impact_projection variant provisional_forward_looking"
          - "increments GamesEdition.version by 1"
      - from: REGISTRATION_CLOSED
        to: IN_PROGRESS
        trigger: "POST /senior-games/games-editions/{games_edition_id}/ops-run when the logical clock date >= edition.competition_start_date"
        actor: system
        preconditions:
          - "edition.status == REGISTRATION_CLOSED"
          - "logical clock date >= edition.competition_start_date"
        side_effects:
          - "edition.status = IN_PROGRESS"
          - "increments GamesEdition.ops_epoch by 1"
          - "recomputes edition.provisional_impact_cents"
          - "increments GamesEdition.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /senior-games/games-editions/{games_edition_id}/ops-run when the logical clock date > edition.competition_end_date"
        actor: system
        preconditions:
          - "edition.status == IN_PROGRESS"
          - "logical clock date > edition.competition_end_date"
        side_effects:
          - "edition.status = COMPLETED"
          - "every SessionSlot of this edition with status == IN_PROGRESS moves to COMPLETED"
          - "increments GamesEdition.ops_epoch by 1"
          - "increments GamesEdition.version by 1"
      - from: COMPLETED
        to: IMPACT_FINALIZED
        trigger: "POST /senior-games/games-editions/{games_edition_id}/finalize-impact"
        actor: SponsorLiaison
        preconditions:
          - "edition.status == COMPLETED"
          - "edition.final_impact_cents == null"
        side_effects:
          - "sets edition.final_impact_cents via calculations.economic_impact_projection variant final_chronological"
          - "edition.status = IMPACT_FINALIZED"
          - "increments GamesEdition.version by 1"
        note: "provisional_impact_cents is left untouched so the two variants remain independently observable on the same row."

  - entity: SportEvent
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: SEEDED
        trigger: "POST /senior-games/sport-events/{sport_event_id}/seed"
        actor: RegistrationOfficer
        preconditions:
          - "event.status == OPEN"
          - "event.accepted_entry_count >= event.min_entries_to_stage"
          - "the candidate set of SportEntry rows with sport_event_id == event.id and status == ACCEPTED is non-empty"
        side_effects:
          - "event.status = SEEDED"
          - "event.seeded_at_utc = logical clock"
          - "increments SportEvent.version by 1"
      - from: OPEN
        to: UNDERSUBSCRIBED
        trigger: "system: an entry leaves ACCEPTED (SportEntry ACCEPTED_to_WITHDRAWN or ACCEPTED_to_MEDICAL_HOLD) and drives accepted_entry_count below event.min_entries_to_stage"
        actor: system
        preconditions:
          - "event.status == OPEN"
          - "event.accepted_entry_count < event.min_entries_to_stage after the decrement"
        side_effects:
          - "event.status = UNDERSUBSCRIBED"
          - "every SessionSlot with sport_event_id == event.id and status == SCHEDULED moves to RELEASED (see SessionSlot SCHEDULED_to_RELEASED, which itself releases that slot's PersonnelAssignment rows)"
          - "increments SportEvent.version by 1"
      - from: SEEDED
        to: UNDERSUBSCRIBED
        trigger: "system: same decrement path as OPEN_to_UNDERSUBSCRIBED, evaluated on a seeded event"
        actor: system
        preconditions:
          - "event.status == SEEDED"
          - "event.accepted_entry_count < event.min_entries_to_stage after the decrement"
        side_effects:
          - "event.status = UNDERSUBSCRIBED"
          - "event.seeded_at_utc = null"
          - "every SessionSlot with sport_event_id == event.id and status == SCHEDULED moves to RELEASED"
          - "increments SportEvent.version by 1"
      - from: UNDERSUBSCRIBED
        to: OPEN
        trigger: "system: a waitlist promotion during POST /games-editions/{games_edition_id}/ops-run, or a SportEntry review ACCEPT, lifts accepted_entry_count back to >= event.min_entries_to_stage"
        actor: system
        preconditions:
          - "event.status == UNDERSUBSCRIBED"
          - "event.accepted_entry_count >= event.min_entries_to_stage after the increment"
        side_effects:
          - "event.status = OPEN"
          - "increments SportEvent.version by 1"
        note: "Closes the UNDERSUBSCRIBED <-> OPEN revision cycle; released SessionSlot rows are NOT auto-restored and must be re-created."
      - from: SEEDED
        to: SCHEDULE_HOLD
        trigger: "system: every SessionSlot of the event has moved to DISPLACED as a consequence of Venue OPEN_to_CLOSED"
        actor: system
        preconditions:
          - "event.status == SEEDED"
          - "the event has at least one SessionSlot and none of them has status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "event.status = SCHEDULE_HOLD"
          - "increments SportEvent.version by 1"
      - from: SCHEDULE_HOLD
        to: SEEDED
        trigger: "POST /senior-games/session-slots/{session_slot_id}/reschedule on a DISPLACED slot of this event"
        actor: system
        preconditions:
          - "event.status == SCHEDULE_HOLD"
          - "the rescheduled slot's status becomes SCHEDULED"
        side_effects:
          - "event.status = SEEDED"
          - "increments SportEvent.version by 1"
      - from: SEEDED
        to: IN_PROGRESS
        trigger: "system: the first SessionSlot of the event moves SCHEDULED_to_IN_PROGRESS"
        actor: system
        preconditions:
          - "event.status == SEEDED"
        side_effects:
          - "event.status = IN_PROGRESS"
          - "increments SportEvent.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system: every SessionSlot of the event has status IN {COMPLETED, RELEASED}"
        actor: system
        preconditions:
          - "event.status == IN_PROGRESS"
          - "no SessionSlot of the event has status IN {SCHEDULED, IN_PROGRESS, DISPLACED}"
        side_effects:
          - "event.status = COMPLETED"
          - "increments SportEvent.version by 1"
      - from: UNDERSUBSCRIBED
        to: CANCELLED
        trigger: "POST /senior-games/sport-events/{sport_event_id}/cancel"
        actor: GamesAdmin
        preconditions:
          - "event.status == UNDERSUBSCRIBED"
        side_effects:
          - "event.status = CANCELLED"
          - "every SportEntry with sport_event_id == event.id and status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, ACCEPTED, WAITLISTED, MEDICAL_HOLD} moves to WITHDRAWN"
          - "event.accepted_entry_count = 0 and event.available_slots = event.capacity"
          - "increments SportEvent.version by 1"

  - entity: Venue
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /senior-games/venues/{venue_id}/close"
        actor: GamesAdmin
        preconditions:
          - "venue.status == OPEN"
        side_effects:
          - "venue.status = CLOSED and venue.closed_reason = request.reason"
          - "LINK 1: every SessionSlot with venue_id == venue.id and status IN {SCHEDULED, IN_PROGRESS} moves to DISPLACED"
          - "LINK 2: each of those DISPLACED slots itself releases every PersonnelAssignment on it with status IN {ASSIGNED, CONFIRMED} to RELEASED, and each release itself decrements that Personnel.assigned_minutes_total by the assignment's duration_minutes"
          - "LINK 3: each DISPLACED slot itself re-evaluates its SportEvent; an event whose slot set now contains no SCHEDULED or IN_PROGRESS slot moves SEEDED_to_SCHEDULE_HOLD"
          - "increments Venue.version by 1"

  - entity: SessionSlot
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /senior-games/session-slots/{session_slot_id}/advance with to_status == IN_PROGRESS"
        actor: GamesAdmin
        preconditions:
          - "slot.status == SCHEDULED"
          - "Venue(slot.venue_id).status == OPEN"
          - "SportEvent(slot.sport_event_id).status IN {SEEDED, IN_PROGRESS}"
          - "slot.confirmed_official_count >= slot.required_official_count"
          - "logical clock >= slot.start_utc"
        side_effects:
          - "slot.status = IN_PROGRESS"
          - "SportEvent(slot.sport_event_id) moves SEEDED_to_IN_PROGRESS when still SEEDED"
          - "increments SessionSlot.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /senior-games/session-slots/{session_slot_id}/advance with to_status == COMPLETED"
        actor: GamesAdmin
        preconditions:
          - "slot.status == IN_PROGRESS"
        side_effects:
          - "slot.status = COMPLETED"
          - "every PersonnelAssignment on this slot with status == CONFIRMED moves to COMPLETED"
          - "every PersonnelAssignment on this slot with status == ASSIGNED moves to NO_SHOW, and each such transition itself increments that Personnel.no_show_count by 1 and decrements Personnel.assigned_minutes_total by duration_minutes"
          - "SportEvent(slot.sport_event_id) moves IN_PROGRESS_to_COMPLETED when no sibling slot remains in {SCHEDULED, IN_PROGRESS, DISPLACED}"
          - "increments SessionSlot.version by 1"
      - from: SCHEDULED
        to: RELEASED
        trigger: "system: SportEvent moves to UNDERSUBSCRIBED or CANCELLED"
        actor: system
        preconditions:
          - "slot.status == SCHEDULED"
        side_effects:
          - "slot.status = RELEASED (the venue-area interval it held is freed for calculations.venue_area_occupancy)"
          - "every PersonnelAssignment on this slot with status IN {ASSIGNED, CONFIRMED} moves to RELEASED, and each such release itself decrements that Personnel.assigned_minutes_total by duration_minutes"
          - "slot.confirmed_official_count = 0"
          - "increments SessionSlot.version by 1"
      - from: SCHEDULED
        to: DISPLACED
        trigger: "system: Venue moves OPEN_to_CLOSED"
        actor: system
        preconditions:
          - "slot.status == SCHEDULED"
        side_effects:
          - "slot.status = DISPLACED"
          - "every PersonnelAssignment on this slot with status IN {ASSIGNED, CONFIRMED} moves to RELEASED, each release itself decrementing Personnel.assigned_minutes_total by duration_minutes"
          - "slot.confirmed_official_count = 0"
          - "increments SessionSlot.version by 1"
      - from: IN_PROGRESS
        to: DISPLACED
        trigger: "system: Venue moves OPEN_to_CLOSED while the slot is running"
        actor: system
        preconditions:
          - "slot.status == IN_PROGRESS"
        side_effects:
          - "slot.status = DISPLACED"
          - "every PersonnelAssignment on this slot with status IN {ASSIGNED, CONFIRMED} moves to RELEASED, each release itself decrementing Personnel.assigned_minutes_total by duration_minutes"
          - "increments SessionSlot.version by 1"
      - from: DISPLACED
        to: SCHEDULED
        trigger: "POST /senior-games/session-slots/{session_slot_id}/reschedule"
        actor: GamesAdmin
        preconditions:
          - "slot.status == DISPLACED"
          - "Venue(request.venue_id).status == OPEN"
          - "the new interval passes calculations.venue_area_occupancy for the target venue"
          - "the new interval passes the athlete recovery-gap check for every ACCEPTED entry of the slot's event"
        side_effects:
          - "slot.venue_id = request.venue_id, slot.start_utc = request.start_utc, slot.end_utc = request.end_utc"
          - "slot.status = SCHEDULED"
          - "SportEvent(slot.sport_event_id) moves SCHEDULE_HOLD_to_SEEDED when it was on hold"
          - "increments SessionSlot.version by 1"
        note: "Closes the SCHEDULED -> DISPLACED -> SCHEDULED cycle. Personnel assignments are NOT restored."

  - entity: Athlete
    dimension: registration_status
    initial_state: PENDING_PAYMENT
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: PENDING_PAYMENT
        to: REGISTERED
        trigger: "POST /senior-games/athletes/{athlete_id}/pay-fees"
        actor: Athlete
        preconditions:
          - "athlete.registration_status == PENDING_PAYMENT"
          - "GamesEdition(athlete.games_edition_id).status == REGISTRATION_OPEN"
          - "request.amount_cents equals the fee_total_cents produced by calculations.athlete_fee_settlement for this athlete"
        side_effects:
          - "recomputes athlete.fee_total_cents and athlete.fee_breakdown via calculations.athlete_fee_settlement"
          - "athlete.fee_paid_cents = athlete.fee_total_cents"
          - "athlete.registration_status = REGISTERED"
          - "increments Athlete.version by 1"
        note: "Independent of medical_status: an athlete may be REGISTERED while still NOT_SCREENED."
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /senior-games/athletes/{athlete_id}/check-in"
        actor: GamesAdmin
        preconditions:
          - "athlete.registration_status == REGISTERED"
          - "athlete.medical_status IN {SCREENED_CLEARED, SCREENED_RESTRICTED, CLEARED_BY_APPEAL}"
          - "GamesEdition(athlete.games_edition_id).status IN {REGISTRATION_CLOSED, IN_PROGRESS}"
        side_effects:
          - "athlete.registration_status = CHECKED_IN"
          - "every VillageStay of this athlete with status == RESERVED whose check_in_date <= logical clock date moves to CHECKED_IN"
          - "increments Athlete.version by 1"
      - from: PENDING_PAYMENT
        to: EXPIRED
        trigger: "system: POST /games-editions/{games_edition_id}/ops-run observes logical clock >= edition.registration_deadline_utc and athlete.fee_paid_cents < athlete.fee_total_cents"
        actor: system
        preconditions:
          - "athlete.registration_status == PENDING_PAYMENT"
          - "logical clock >= GamesEdition.registration_deadline_utc"
        side_effects:
          - "athlete.registration_status = EXPIRED"
          - "every SportEntry of this athlete with status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, ACCEPTED, WAITLISTED, MEDICAL_HOLD} moves to WITHDRAWN, and each ACCEPTED-to-WITHDRAWN itself decrements SportEvent.accepted_entry_count"
          - "increments Athlete.version by 1"
      - from: PENDING_PAYMENT
        to: WITHDRAWN
        trigger: "POST /senior-games/athletes/{athlete_id}/withdraw"
        actor: Athlete
        preconditions:
          - "athlete.registration_status == PENDING_PAYMENT"
        side_effects:
          - "athlete.registration_status = WITHDRAWN"
          - "every SportEntry of this athlete with status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, WAITLISTED} moves to WITHDRAWN"
          - "every VillageStay of this athlete with status == RESERVED moves to CANCELLED, each cancellation itself decrementing AccommodationBlock.reserved_bed_nights by that stay's nights"
          - "increments Athlete.version by 1"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /senior-games/athletes/{athlete_id}/withdraw"
        actor: Athlete
        preconditions:
          - "athlete.registration_status == REGISTERED"
        side_effects:
          - "LINK 1: athlete.registration_status = WITHDRAWN"
          - "LINK 2: every SportEntry of this athlete with status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, ACCEPTED, WAITLISTED, MEDICAL_HOLD} moves to WITHDRAWN; each entry leaving ACCEPTED itself decrements SportEvent.accepted_entry_count by 1 and increments SportEvent.available_slots by 1"
          - "LINK 3: each such SportEvent whose accepted_entry_count has fallen below min_entries_to_stage itself moves OPEN_to_UNDERSUBSCRIBED (or SEEDED_to_UNDERSUBSCRIBED)"
          - "LINK 4: each UNDERSUBSCRIBED event itself moves every SessionSlot of that event with status == SCHEDULED to RELEASED"
          - "LINK 5: each RELEASED slot itself moves every PersonnelAssignment on it with status IN {ASSIGNED, CONFIRMED} to RELEASED and decrements that Personnel.assigned_minutes_total by duration_minutes"
          - "every VillageStay of this athlete with status IN {RESERVED, CHECKED_IN} moves to CANCELLED, each cancellation decrementing AccommodationBlock.reserved_bed_nights by that stay's nights"
          - "increments Athlete.version by 1"
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /senior-games/athletes/{athlete_id}/withdraw"
        actor: Athlete
        preconditions:
          - "athlete.registration_status == CHECKED_IN"
          - "no CompetitionResult with status IN {VERIFIED, RECORD_PENDING, PUBLISHED} exists for any SportEntry of this athlete"
        side_effects:
          - "same five-link cascade as REGISTERED_to_WITHDRAWN"
          - "increments Athlete.version by 1"

  - entity: Athlete
    dimension: medical_status
    initial_state: NOT_SCREENED
    terminal_states: []
    transitions:
      - from: NOT_SCREENED
        to: SCREENED_CLEARED
        trigger: "POST /senior-games/medical-screenings with a computed recommendation of CLEARED"
        actor: MedicalDirector
        preconditions:
          - "athlete.medical_status == NOT_SCREENED"
          - "calculations.medical_risk_score yields recommendation == CLEARED"
        side_effects:
          - "athlete.medical_status = SCREENED_CLEARED"
          - "increments Athlete.version by 1"
      - from: NOT_SCREENED
        to: SCREENED_RESTRICTED
        trigger: "POST /senior-games/medical-screenings with a computed recommendation of CLEARED_WITH_RESTRICTION"
        actor: MedicalDirector
        preconditions:
          - "athlete.medical_status == NOT_SCREENED"
          - "calculations.medical_risk_score yields recommendation == CLEARED_WITH_RESTRICTION"
        side_effects:
          - "athlete.medical_status = SCREENED_RESTRICTED"
          - "every SportEntry of this athlete with status == ACCEPTED whose SportEvent's Sport.contact_class == HIGH moves to MEDICAL_HOLD, each transition itself decrementing SportEvent.accepted_entry_count"
          - "increments Athlete.version by 1"
      - from: NOT_SCREENED
        to: SCREENED_HOLD
        trigger: "POST /senior-games/medical-screenings with a computed recommendation of HOLD_PENDING_PHYSICIAN_REVIEW"
        actor: MedicalDirector
        preconditions:
          - "athlete.medical_status == NOT_SCREENED"
          - "calculations.medical_risk_score yields recommendation == HOLD_PENDING_PHYSICIAN_REVIEW"
        side_effects:
          - "LINK 1: athlete.medical_status = SCREENED_HOLD"
          - "LINK 2: every SportEntry of this athlete with status == ACCEPTED moves to MEDICAL_HOLD, each transition itself decrementing SportEvent.accepted_entry_count by 1 and incrementing SportEvent.available_slots by 1"
          - "LINK 3: each such SportEvent whose accepted_entry_count has fallen below min_entries_to_stage itself moves to UNDERSUBSCRIBED"
          - "increments Athlete.version by 1"
      - from: SCREENED_HOLD
        to: CLEARED_BY_APPEAL
        trigger: "POST /senior-games/athletes/{athlete_id}/medical-appeal with decision == GRANT"
        actor: MedicalDirector
        preconditions:
          - "athlete.medical_status == SCREENED_HOLD"
          - "at least one MedicalScreening exists for this athlete"
        side_effects:
          - "athlete.medical_status = CLEARED_BY_APPEAL"
          - "every SportEntry of this athlete with status == MEDICAL_HOLD moves back to ACCEPTED when SportEvent.available_slots > 0, each transition incrementing SportEvent.accepted_entry_count by 1; entries whose event has available_slots == 0 move to WAITLISTED instead"
          - "increments Athlete.version by 1"
        note: "Closes the ACCEPTED -> MEDICAL_HOLD -> ACCEPTED cycle on SportEntry via the medical dimension."
      - from: SCREENED_RESTRICTED
        to: CLEARED_BY_APPEAL
        trigger: "POST /senior-games/athletes/{athlete_id}/medical-appeal with decision == GRANT"
        actor: MedicalDirector
        preconditions:
          - "athlete.medical_status == SCREENED_RESTRICTED"
        side_effects:
          - "athlete.medical_status = CLEARED_BY_APPEAL"
          - "every SportEntry of this athlete with status == MEDICAL_HOLD moves back to ACCEPTED when SportEvent.available_slots > 0, otherwise to WAITLISTED"
          - "increments Athlete.version by 1"
      - from: SCREENED_HOLD
        to: SCREENED_HOLD
        trigger: "POST /senior-games/athletes/{athlete_id}/medical-appeal with decision == DENY"
        actor: MedicalDirector
        preconditions:
          - "athlete.medical_status == SCREENED_HOLD"
        side_effects:
          - "athlete.medical_status is unchanged"
          - "increments Athlete.version by 1"
        note: "A denied appeal is recorded (version bump) without changing the medical dimension."

  - entity: SportEntry
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/review with decision == TAKE_UP"
        actor: RegistrationOfficer
        preconditions:
          - "entry.status == SUBMITTED"
          - "SportEvent(entry.sport_event_id).status IN {OPEN, UNDERSUBSCRIBED}"
        side_effects:
          - "entry.status = UNDER_REVIEW"
          - "increments SportEntry.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/review with decision == ACCEPT"
        actor: RegistrationOfficer
        preconditions:
          - "entry.status == UNDER_REVIEW"
          - "Athlete(entry.athlete_id).registration_status == REGISTERED"
          - "Athlete(entry.athlete_id).medical_status IN {SCREENED_CLEARED, SCREENED_RESTRICTED, CLEARED_BY_APPEAL}"
          - "SportEvent(entry.sport_event_id).available_slots > 0"
          - "the athlete's already-scheduled SessionSlot set satisfies the recovery-gap rule in calculations.athlete_multisport_gap"
        side_effects:
          - "entry.status = ACCEPTED and entry.review_note = request.review_note"
          - "increments SportEvent.accepted_entry_count by 1 and decrements SportEvent.available_slots by 1"
          - "SportEvent moves UNDERSUBSCRIBED_to_OPEN when accepted_entry_count reaches min_entries_to_stage"
          - "increments SportEntry.version by 1"
      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/review with decision == WAITLIST"
        actor: RegistrationOfficer
        preconditions:
          - "entry.status == UNDER_REVIEW"
        side_effects:
          - "entry.status = WAITLISTED and entry.review_note = request.review_note"
          - "increments SportEntry.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/review with decision == REQUEST_REVISION"
        actor: RegistrationOfficer
        preconditions:
          - "entry.status == UNDER_REVIEW"
          - "entry.revision_round < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "entry.status = REVISION_REQUESTED and entry.review_note = request.review_note"
          - "increments SportEntry.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/resubmit"
        actor: Athlete
        preconditions:
          - "entry.status == REVISION_REQUESTED"
          - "entry.revision_round < MAX_REVISION_ROUNDS (2)"
          - "logical clock < GamesEdition.registration_deadline_utc"
        side_effects:
          - "entry.qualifying_result_id = request.qualifying_result_id and entry.qualification_source = request.qualification_source"
          - "recomputes entry.qualification_priority and entry.qualifying_mark"
          - "increments entry.revision_round by 1"
          - "entry.status = SUBMITTED"
          - "increments SportEntry.version by 1"
        note: "Closes the SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED cycle; at most two loops."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/review with decision == REJECT"
        actor: RegistrationOfficer
        preconditions:
          - "entry.status == UNDER_REVIEW"
        side_effects:
          - "entry.status = REJECTED and entry.review_note = request.review_note"
          - "increments SportEntry.version by 1"
      - from: WAITLISTED
        to: ACCEPTED
        trigger: "system: waitlist promotion during POST /games-editions/{games_edition_id}/ops-run per calculations.waitlist_promotion_order"
        actor: system
        preconditions:
          - "entry.status == WAITLISTED"
          - "Athlete(entry.athlete_id).registration_status == REGISTERED"
          - "Athlete(entry.athlete_id).medical_status IN {SCREENED_CLEARED, SCREENED_RESTRICTED, CLEARED_BY_APPEAL}"
          - "SportEvent.available_slots > 0 at the moment this entry is reached in rank order"
        side_effects:
          - "entry.status = ACCEPTED"
          - "increments SportEvent.accepted_entry_count by 1 and decrements SportEvent.available_slots by 1"
          - "SportEvent moves UNDERSUBSCRIBED_to_OPEN when accepted_entry_count reaches min_entries_to_stage"
          - "increments SportEntry.version by 1"
      - from: ACCEPTED
        to: MEDICAL_HOLD
        trigger: "system: Athlete medical dimension enters SCREENED_HOLD, or enters SCREENED_RESTRICTED for a HIGH contact_class event"
        actor: system
        preconditions:
          - "entry.status == ACCEPTED"
        side_effects:
          - "entry.status = MEDICAL_HOLD"
          - "decrements SportEvent.accepted_entry_count by 1 and increments SportEvent.available_slots by 1"
          - "SportEvent moves to UNDERSUBSCRIBED when accepted_entry_count falls below min_entries_to_stage"
          - "increments SportEntry.version by 1"
      - from: MEDICAL_HOLD
        to: ACCEPTED
        trigger: "system: Athlete medical dimension enters CLEARED_BY_APPEAL and SportEvent.available_slots > 0"
        actor: system
        preconditions:
          - "entry.status == MEDICAL_HOLD"
          - "SportEvent.available_slots > 0"
        side_effects:
          - "entry.status = ACCEPTED"
          - "increments SportEvent.accepted_entry_count by 1 and decrements SportEvent.available_slots by 1"
          - "increments SportEntry.version by 1"
      - from: MEDICAL_HOLD
        to: WAITLISTED
        trigger: "system: Athlete medical dimension enters CLEARED_BY_APPEAL while SportEvent.available_slots == 0"
        actor: system
        preconditions:
          - "entry.status == MEDICAL_HOLD"
          - "SportEvent.available_slots == 0"
        side_effects:
          - "entry.status = WAITLISTED"
          - "increments SportEntry.version by 1"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/withdraw, or the athlete-withdraw / event-cancel cascade"
        actor: Athlete
        preconditions:
          - "entry.status == ACCEPTED"
          - "no CompetitionResult with status IN {VERIFIED, RECORD_PENDING, PUBLISHED} cites this entry"
        side_effects:
          - "entry.status = WITHDRAWN"
          - "decrements SportEvent.accepted_entry_count by 1 and increments SportEvent.available_slots by 1"
          - "SportEvent moves to UNDERSUBSCRIBED when accepted_entry_count falls below min_entries_to_stage"
          - "increments SportEntry.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/withdraw"
        actor: Athlete
        preconditions:
          - "entry.status == SUBMITTED"
        side_effects:
          - "entry.status = WITHDRAWN"
          - "increments SportEntry.version by 1"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/withdraw"
        actor: Athlete
        preconditions:
          - "entry.status == WAITLISTED"
        side_effects:
          - "entry.status = WITHDRAWN"
          - "increments SportEntry.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/withdraw"
        actor: Athlete
        preconditions:
          - "entry.status == UNDER_REVIEW"
        side_effects:
          - "entry.status = WITHDRAWN"
          - "increments SportEntry.version by 1"
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/withdraw"
        actor: Athlete
        preconditions:
          - "entry.status == REVISION_REQUESTED"
        side_effects:
          - "entry.status = WITHDRAWN"
          - "increments SportEntry.version by 1"
      - from: MEDICAL_HOLD
        to: WITHDRAWN
        trigger: "POST /senior-games/sport-entries/{sport_entry_id}/withdraw, or the athlete-withdraw / event-cancel cascade"
        actor: Athlete
        preconditions:
          - "entry.status == MEDICAL_HOLD"
        side_effects:
          - "entry.status = WITHDRAWN"
          - "increments SportEntry.version by 1"

  - entity: PersonnelAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, RELEASED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /senior-games/personnel-assignments/{personnel_assignment_id}/confirm"
        actor: SportOfficial
        preconditions:
          - "assignment.status == ASSIGNED"
          - "SessionSlot(assignment.session_slot_id).status == SCHEDULED"
          - "X-User-ID equals assignment.personnel_id"
        side_effects:
          - "assignment.status = CONFIRMED"
          - "increments SessionSlot.confirmed_official_count by 1 when Personnel.personnel_type == OFFICIAL"
          - "increments PersonnelAssignment.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: SessionSlot moves IN_PROGRESS_to_COMPLETED"
        actor: system
        preconditions:
          - "assignment.status == CONFIRMED"
        side_effects:
          - "assignment.status = COMPLETED"
          - "Personnel.assigned_minutes_total is unchanged (COMPLETED still counts toward the served-minutes ledger)"
          - "increments PersonnelAssignment.version by 1"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system: SessionSlot moves IN_PROGRESS_to_COMPLETED with the assignment never confirmed"
        actor: system
        preconditions:
          - "assignment.status == ASSIGNED"
        side_effects:
          - "assignment.status = NO_SHOW"
          - "increments Personnel.no_show_count by 1"
          - "decrements Personnel.assigned_minutes_total by assignment.duration_minutes"
          - "increments PersonnelAssignment.version by 1"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /senior-games/personnel-assignments/{personnel_assignment_id}/release, or the slot RELEASED / DISPLACED cascade"
        actor: GamesAdmin
        preconditions:
          - "assignment.status == ASSIGNED"
        side_effects:
          - "assignment.status = RELEASED"
          - "decrements Personnel.assigned_minutes_total by assignment.duration_minutes"
          - "increments PersonnelAssignment.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /senior-games/personnel-assignments/{personnel_assignment_id}/release, or the slot RELEASED / DISPLACED cascade"
        actor: GamesAdmin
        preconditions:
          - "assignment.status == CONFIRMED"
          - "SessionSlot(assignment.session_slot_id).status != IN_PROGRESS unless the release originates from the venue-close cascade"
        side_effects:
          - "assignment.status = RELEASED"
          - "decrements Personnel.assigned_minutes_total by assignment.duration_minutes"
          - "decrements SessionSlot.confirmed_official_count by 1 when Personnel.personnel_type == OFFICIAL"
          - "increments PersonnelAssignment.version by 1"

  - entity: CompetitionResult
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    note: "PUBLISHED is a settled but re-openable state, not a terminal one: it still admits PUBLISHED -> PROTESTED for one bounded protest round, so the lockdown of a published result is enforced by the priority-84 protest_round rule rather than by the priority-38 terminal check."
    transitions:
      - from: SUBMITTED
        to: RECORD_PENDING
        trigger: "POST /senior-games/competition-results/{competition_result_id}/verify — RECORD branch"
        actor: RegistrationOfficer
        preconditions:
          - "result.status == SUBMITTED"
          - "SessionSlot(result.session_slot_id).status == COMPLETED"
          - "the mark beats the current record: SportEvent.current_record_id == null, or the mark is better than AgeGroupRecord(current_record_id).mark_value per Sport.mark_direction"
        side_effects:
          - "result.status = RECORD_PENDING"
          - "result.verified_by_user_id = X-User-ID"
          - "sets result.national_qualifying per calculations.national_qualification_flag"
          - "increments CompetitionResult.version by 1"
        note: "Fork branch A of the verify trigger. Divergent from branch B: this branch makes the result eligible for POST /age-group-records and does NOT publish it."
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /senior-games/competition-results/{competition_result_id}/verify — NON-RECORD branch"
        actor: RegistrationOfficer
        preconditions:
          - "result.status == SUBMITTED"
          - "SessionSlot(result.session_slot_id).status == COMPLETED"
          - "the mark does NOT beat AgeGroupRecord(SportEvent.current_record_id).mark_value per Sport.mark_direction"
        side_effects:
          - "result.status = VERIFIED"
          - "result.verified_by_user_id = X-User-ID"
          - "sets result.national_qualifying per calculations.national_qualification_flag"
          - "increments CompetitionResult.version by 1"
        note: "Fork branch B. Divergent side-effect set: no record eligibility is conferred."
      - from: VERIFIED
        to: PUBLISHED
        trigger: "POST /senior-games/competition-results/{competition_result_id}/publish"
        actor: RegistrationOfficer
        preconditions:
          - "result.status == VERIFIED"
        side_effects:
          - "result.status = PUBLISHED"
          - "increments CompetitionResult.version by 1"
      - from: RECORD_PENDING
        to: PUBLISHED
        trigger: "POST /senior-games/competition-results/{competition_result_id}/publish"
        actor: RegistrationOfficer
        preconditions:
          - "result.status == RECORD_PENDING"
          - "an AgeGroupRecord citing this result exists with status IN {PENDING_RATIFICATION, RATIFIED}"
        side_effects:
          - "result.status = PUBLISHED"
          - "increments CompetitionResult.version by 1"
        note: "Join point of the fork: both branches converge on PUBLISHED, but the RECORD_PENDING branch additionally requires a filed record claim."
      - from: VERIFIED
        to: PROTESTED
        trigger: "POST /senior-games/competition-results/{competition_result_id}/protest"
        actor: Athlete
        preconditions:
          - "result.status == VERIFIED"
          - "result.protest_round == 0"
          - "X-User-ID equals SportEntry(result.sport_entry_id).athlete_id"
        side_effects:
          - "result.status = PROTESTED"
          - "increments CompetitionResult.version by 1"
      - from: PUBLISHED
        to: PROTESTED
        trigger: "POST /senior-games/competition-results/{competition_result_id}/protest"
        actor: Athlete
        preconditions:
          - "result.status == PUBLISHED"
          - "result.protest_round == 0"
          - "X-User-ID equals SportEntry(result.sport_entry_id).athlete_id"
        side_effects:
          - "result.status = PROTESTED"
          - "every AgeGroupRecord citing this result with status == PENDING_RATIFICATION moves to REJECTED"
          - "increments CompetitionResult.version by 1"
      - from: PROTESTED
        to: SUBMITTED
        trigger: "POST /senior-games/competition-results/{competition_result_id}/resolve-protest with decision == REMEASURE"
        actor: RegistrationOfficer
        preconditions:
          - "result.status == PROTESTED"
        side_effects:
          - "result.mark_value = request.mark_value and result.placement = request.placement"
          - "result.status = SUBMITTED"
          - "result.verified_by_user_id = null and result.national_qualifying = false"
          - "increments result.protest_round by 1"
          - "increments CompetitionResult.version by 1"
        note: "Closes the SUBMITTED -> VERIFIED/RECORD_PENDING -> PROTESTED -> SUBMITTED cycle; at most one loop."
      - from: PROTESTED
        to: VOIDED
        trigger: "POST /senior-games/competition-results/{competition_result_id}/resolve-protest with decision == VOID"
        actor: RegistrationOfficer
        preconditions:
          - "result.status == PROTESTED"
        side_effects:
          - "result.status = VOIDED"
          - "every AgeGroupRecord citing this result with status IN {PENDING_RATIFICATION, RATIFIED} moves to REJECTED; a RATIFIED record leaving the scope also resets SportEvent.current_record_id to that record's superseded_record_id"
          - "increments CompetitionResult.version by 1"

  - entity: AgeGroupRecord
    initial_state: PENDING_RATIFICATION
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING_RATIFICATION
        to: RATIFIED
        trigger: "POST /senior-games/age-group-records/{age_group_record_id}/ratify with decision == RATIFY"
        actor: RecordsRatifier
        preconditions:
          - "record.status == PENDING_RATIFICATION"
          - "CompetitionResult(record.competition_result_id).status IN {RECORD_PENDING, PUBLISHED}"
          - "X-User-ID != record.claimed_by_user_id"
          - "X-User-ID != CompetitionResult(record.competition_result_id).verified_by_user_id"
        side_effects:
          - "record.status = RATIFIED and record.ratified_by_user_id = X-User-ID"
          - "SportEvent(record.sport_event_id).current_record_id = record.id"
          - "the prior record identified by record.superseded_record_id, when non-null, moves RATIFIED_to_SUPERSEDED"
          - "increments AgeGroupRecord.version by 1"
      - from: PENDING_RATIFICATION
        to: REJECTED
        trigger: "POST /senior-games/age-group-records/{age_group_record_id}/ratify with decision == REJECT, or the protest / void cascade on the cited result"
        actor: RecordsRatifier
        preconditions:
          - "record.status == PENDING_RATIFICATION"
        side_effects:
          - "record.status = REJECTED and record.ratified_by_user_id = X-User-ID when the transition came from the ratify endpoint, null when it came from the cascade"
          - "increments AgeGroupRecord.version by 1"
      - from: RATIFIED
        to: SUPERSEDED
        trigger: "system: a later AgeGroupRecord in the same sport_event_id scope is ratified and names this record as its superseded_record_id"
        actor: system
        preconditions:
          - "record.status == RATIFIED"
        side_effects:
          - "record.status = SUPERSEDED"
          - "increments AgeGroupRecord.version by 1"
      - from: RATIFIED
        to: REJECTED
        trigger: "system: CompetitionResult PROTESTED_to_VOIDED cascade"
        actor: system
        preconditions:
          - "record.status == RATIFIED"
        side_effects:
          - "record.status = REJECTED"
          - "SportEvent.current_record_id = record.superseded_record_id"
          - "the record named by record.superseded_record_id, when non-null, moves SUPERSEDED back to RATIFIED"
          - "increments AgeGroupRecord.version by 1"

  - entity: VillageStay
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "system: Athlete moves REGISTERED_to_CHECKED_IN and the stay's check_in_date <= logical clock date"
        actor: system
        preconditions:
          - "stay.status == RESERVED"
          - "Athlete(stay.athlete_id).registration_status == CHECKED_IN"
        side_effects:
          - "stay.status = CHECKED_IN"
          - "AccommodationBlock.reserved_bed_nights is unchanged (RESERVED and CHECKED_IN both hold bed-nights)"
          - "increments VillageStay.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system: POST /games-editions/{games_edition_id}/ops-run observes logical clock date >= stay.check_out_date"
        actor: system
        preconditions:
          - "stay.status == CHECKED_IN"
          - "logical clock date >= stay.check_out_date"
        side_effects:
          - "stay.status = COMPLETED"
          - "AccommodationBlock.reserved_bed_nights is unchanged"
          - "increments VillageStay.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /senior-games/village-stays/{village_stay_id}/cancel, or the athlete-withdraw cascade"
        actor: Athlete
        preconditions:
          - "stay.status == RESERVED"
        side_effects:
          - "stay.status = CANCELLED"
          - "decrements AccommodationBlock.reserved_bed_nights by stay.nights (the compensating action of the reservation)"
          - "stay.total_charge_cents = 0"
          - "increments VillageStay.version by 1"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /senior-games/village-stays/{village_stay_id}/cancel, or the athlete-withdraw cascade"
        actor: Athlete
        preconditions:
          - "stay.status == CHECKED_IN"
        side_effects:
          - "stay.status = CANCELLED"
          - "decrements AccommodationBlock.reserved_bed_nights by stay.nights"
          - "stay.total_charge_cents = 0"
          - "increments VillageStay.version by 1"

  - entity: SponsorshipCommitment
    initial_state: PLEDGED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PLEDGED
        to: ALLOCATED
        trigger: "POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/allocate"
        actor: SponsorLiaison
        preconditions:
          - "commitment.status == PLEDGED"
          - "GamesEdition(commitment.games_edition_id).status != IMPACT_FINALIZED"
          - "request.expected_games_edition_version equals the current GamesEdition.version"
        side_effects:
          - "sets commitment.allocation_map and commitment.recognized_cents via calculations.sponsorship_recognition_allocation"
          - "commitment.status = ALLOCATED"
          - "increments GamesEdition.sponsorship_recognized_cents by commitment.recognized_cents"
          - "increments GamesEdition.version by 1"
          - "increments SponsorshipCommitment.version by 1"
      - from: PLEDGED
        to: WITHDRAWN
        trigger: "POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/withdraw"
        actor: SponsorLiaison
        preconditions:
          - "commitment.status == PLEDGED"
        side_effects:
          - "commitment.status = WITHDRAWN"
          - "GamesEdition.sponsorship_recognized_cents is unchanged (nothing had been recognized)"
          - "increments SponsorshipCommitment.version by 1"
      - from: ALLOCATED
        to: WITHDRAWN
        trigger: "POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/withdraw"
        actor: SponsorLiaison
        preconditions:
          - "commitment.status == ALLOCATED"
          - "GamesEdition(commitment.games_edition_id).status != IMPACT_FINALIZED"
        side_effects:
          - "decrements GamesEdition.sponsorship_recognized_cents by commitment.recognized_cents (the exact compensating action of the allocation)"
          - "commitment.recognized_cents = 0 and commitment.allocation_map = {}"
          - "commitment.status = WITHDRAWN"
          - "increments GamesEdition.version by 1"
          - "increments SponsorshipCommitment.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =====================================================================
concurrency_rules:
  - rule_id: record-claim-stale-sport-event
    parent_entity: SportEvent
    write_endpoint: "POST /senior-games/age-group-records"
    occ_field: "expected_sport_event_version"
    description: |
      Filing an AgeGroupRecord claim against a SportEvent whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has already filed and ratified a claim in the
      same scope (which legitimately supersedes the prior record and rewrites
      SportEvent.current_record_id), so the current writer's view of the event —
      and therefore the superseded_record_id it would compute — is stale.
    error_id: ERR_STALE_SPORT_EVENT_VERSION
    http_status: 412
  - rule_id: stay-create-stale-block
    parent_entity: AccommodationBlock
    write_endpoint: "POST /senior-games/village-stays"
    occ_field: "expected_block_version"
    description: |
      Reserving a VillageStay against an AccommodationBlock whose version has
      advanced since the client last observed it is rejected. Bed-night
      occupancy is an aggregate over sibling stays, so an earlier writer that
      consumed beds leaves the current writer's per-night availability view
      stale even when beds still remain and the reservation would otherwise
      legitimately succeed.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
  - rule_id: sponsorship-allocate-stale-games-edition
    parent_entity: GamesEdition
    write_endpoint: "POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/allocate"
    occ_field: "expected_games_edition_version"
    description: |
      Allocating recognition for a SponsorshipCommitment against a GamesEdition
      whose version has advanced since the client last observed it is rejected.
      The recognition ledger GamesEdition.sponsorship_recognized_cents is a
      shared running total, so an allocation computed against a stale edition
      view would post onto a balance the client never saw.
    error_id: ERR_STALE_GAMES_EDITION_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: athlete_age_group_assignment
    trigger: "POST /senior-games/athletes — sets Athlete.age_at_reference, Athlete.age_at_first_day and Athlete.age_group_code before the row is persisted"
    algorithm: threshold
    formula: |
      # whole_years(dob, on_date): calendar years elapsed; a birthday landing exactly
      # on `on_date` counts as having been reached (>=, not >).
      whole_years(dob, on) = (on.year - dob.year)
                             - (1 if (on.month, on.day) < (dob.month, dob.day) else 0)

      age_at_reference = whole_years(athlete.date_of_birth, edition.age_reference_date)
      age_at_first_day = whole_years(athlete.date_of_birth, edition.competition_start_date)

      basis_age = age_at_reference   if edition.age_basis == "REFERENCE_DATE"
                  age_at_first_day   if edition.age_basis == "FIRST_COMPETITION_DAY"

      if basis_age < MIN_ELIGIBLE_AGE:            -> ERR_ATHLETE_UNDER_MINIMUM_AGE
      if basis_age >= OPEN_BAND_FLOOR:            age_group_code = "100+"
      else:
          floor = MIN_ELIGIBLE_AGE + BAND_WIDTH_YEARS * ((basis_age - MIN_ELIGIBLE_AGE) // BAND_WIDTH_YEARS)
          age_group_code = f"{floor}-{floor + BAND_WIDTH_YEARS - 1}"
    input_set: "Exactly one Athlete row's date_of_birth plus the parent GamesEdition's age_reference_date, competition_start_date and age_basis. No other rows participate."
    constants:
      MIN_ELIGIBLE_AGE: 50
      BAND_WIDTH_YEARS: 5
      OPEN_BAND_FLOOR: 100
    precision: "integer years; band floors are exact multiples of 5 offset from 50"
    variants:
      - name: reference_date_basis
        when: "edition.age_basis == REFERENCE_DATE (the default, and always the basis used for record ratification)"
        difference: "Uses age_at_reference. An athlete whose birthday falls after competition_start_date but on or before age_reference_date lands one band higher than the other variant."
      - name: first_competition_day_basis
        when: "edition.age_basis == FIRST_COMPETITION_DAY"
        difference: "Uses age_at_first_day. For date_of_birth 1971-11-20 with competition_start_date 2026-09-10 and age_reference_date 2026-12-31, this variant yields age 54 / band '50-54' while the reference-date variant yields age 55 / band '55-59' — same row, different assignment, and an athlete at exactly 49-going-on-50 is rejected under this variant but admitted under the other."

  - name: athlete_fee_settlement
    trigger: "POST /senior-games/athletes/{athlete_id}/pay-fees — sets Athlete.fee_total_cents, Athlete.fee_breakdown and Athlete.fee_paid_cents"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The surcharge is part of fee_total_cents, but its
      # tier is keyed on the PRE-SURCHARGE discounted amount; and the discount tier is
      # keyed on the entry COUNT while the surcharge tier is keyed on the amount the
      # discount itself produces. Any other order yields a different total.

      STEP 1  entry_count = count(SportEntry where athlete_id == A.id and status IN
                {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, WAITLISTED, ACCEPTED})
              # MEDICAL_HOLD, REJECTED and WITHDRAWN entries are excluded.
      STEP 2  event_fees_cents = sum over those same entries of
                SportEvent(entry.sport_event_id).entry_fee_cents      # integer cents, no rounding
      STEP 3  subtotal_cents = BASE_REGISTRATION_FEE_CENTS + event_fees_cents
      STEP 4  discount_pct = 0.00 if entry_count <= 1
                             0.05 if 2 <= entry_count <= 3
                             0.12 if 4 <= entry_count <= 5
                             0.20 if entry_count >= 6
              discount_cents    = round_half_up(subtotal_cents * discount_pct)   # the ONLY rounding step
              discounted_cents  = subtotal_cents - discount_cents
      STEP 5  surcharge_cents = 0                            if discounted_cents <  25000
                              = ADMIN_SURCHARGE_LOW_CENTS    if 25000 <= discounted_cents < 60000
                              = ADMIN_SURCHARGE_HIGH_CENTS   if discounted_cents >= 60000
      STEP 6  fee_total_cents = discounted_cents + surcharge_cents
              fee_breakdown = { entry_count, event_fees_cents, subtotal_cents,
                                discount_pct, discount_cents, discounted_cents, surcharge_cents }
    input_set: "SportEntry rows of this athlete with status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, WAITLISTED, ACCEPTED}, joined to their SportEvent for entry_fee_cents. Order of summation is irrelevant (integer cents)."
    constants:
      BASE_REGISTRATION_FEE_CENTS: 9500
      ADMIN_SURCHARGE_LOW_CENTS: 1500
      ADMIN_SURCHARGE_HIGH_CENTS: 4000
      SURCHARGE_LOW_THRESHOLD_CENTS: 25000
      SURCHARGE_HIGH_THRESHOLD_CENTS: 60000
    precision: "integer cents; round_half_up at STEP 4 only"
    variants: []

  - name: sponsorship_recognition_allocation
    trigger: "POST /senior-games/sponsorship-commitments/{sponsorship_commitment_id}/allocate — sets SponsorshipCommitment.allocation_map and recognized_cents, then posts to GamesEdition.sponsorship_recognized_cents"
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER IS PINNED: round EACH bucket to whole cents FIRST, then SUM the
      # four rounded buckets. The forbidden alternative — multiply then round the total
      # once (round_half_up(pledged_cents * multiplier)) — differs by cents on many
      # inputs and MUST NOT be used.
      multiplier = 1.00 (BRONZE) | 1.05 (SILVER) | 1.12 (GOLD) | 1.25 (PLATINUM)

      buckets, in this declared order:
        VENUE_SIGNAGE     weight 0.40
        ATHLETE_SERVICES  weight 0.30
        MEDICAL_COVERAGE  weight 0.20
        SOCIAL_PROGRAM    weight 0.10

      for bucket b in the declared order:
          allocation_map[b] = round_half_up(commitment.pledged_cents * weight_b * multiplier)

      recognized_cents = allocation_map[VENUE_SIGNAGE] + allocation_map[ATHLETE_SERVICES]
                       + allocation_map[MEDICAL_COVERAGE] + allocation_map[SOCIAL_PROGRAM]

      edition.sponsorship_recognized_cents += recognized_cents
      # Worked check: pledged_cents 250100, tier SILVER ->
      #   105042 + 78782 + 52521 + 26261 = 262606,
      #   whereas round_half_up(250100 * 1.05) = 262605. One cent apart.
    input_set: "Exactly one SponsorshipCommitment row with status == PLEDGED. No sibling commitments participate."
    constants:
      WEIGHT_VENUE_SIGNAGE: 0.40
      WEIGHT_ATHLETE_SERVICES: 0.30
      WEIGHT_MEDICAL_COVERAGE: 0.20
      WEIGHT_SOCIAL_PROGRAM: 0.10
      MULTIPLIER_BRONZE: 1.00
      MULTIPLIER_SILVER: 1.05
      MULTIPLIER_GOLD: 1.12
      MULTIPLIER_PLATINUM: 1.25
    precision: "whole cents per bucket, round_half_up, applied per bucket before summation"
    variants: []

  - name: economic_impact_projection
    trigger: "POST /senior-games/games-editions/{games_edition_id}/ops-run (provisional variant, every epoch) and POST /senior-games/games-editions/{games_edition_id}/finalize-impact (final variant, once)"
    algorithm: forward_looking
    formula: |
      # VARIANT provisional_forward_looking — writes edition.provisional_impact_cents
      registered_heads = count(Athlete where games_edition_id == G.id and
                               registration_status IN {PENDING_PAYMENT, REGISTERED, CHECKED_IN})
      visitor_heads    = registered_heads * ACCOMPANYING_VISITOR_FACTOR       # no rounding yet
      direct_spend_cents = round_half_up((registered_heads + visitor_heads)
                                         * DAILY_SPEND_CENTS * PROJECTED_NIGHTS_PER_ATHLETE)
      provisional_impact_cents = round_half_up(direct_spend_cents * ECONOMIC_MULTIPLIER)

      # VARIANT final_chronological — writes edition.final_impact_cents
      actual_heads = count(Athlete where games_edition_id == G.id and
                           registration_status == CHECKED_IN)
      actual_room_nights = 0
      for stay in VillageStay rows whose AccommodationBlock.games_edition_id == G.id
                  and stay.status IN {CHECKED_IN, COMPLETED},
                  processed in order check_in_date ASC, then created_at ASC:
          actual_room_nights += stay.nights
      nights_per_head   = actual_room_nights / max(actual_heads, 1)          # exact rational
      visitor_heads     = actual_heads * ACCOMPANYING_VISITOR_FACTOR
      direct_spend_cents = round_half_up((actual_heads + visitor_heads)
                                         * DAILY_SPEND_CENTS * nights_per_head)
      final_impact_cents = round_half_up(direct_spend_cents * ECONOMIC_MULTIPLIER)
    input_set: "provisional: Athlete rows of the edition with registration_status IN {PENDING_PAYMENT, REGISTERED, CHECKED_IN}; WITHDRAWN and EXPIRED are excluded, and no VillageStay row participates. final: Athlete rows with registration_status == CHECKED_IN only, plus VillageStay rows with status IN {CHECKED_IN, COMPLETED} (RESERVED and CANCELLED excluded), ordered check_in_date ASC then created_at ASC."
    constants:
      ACCOMPANYING_VISITOR_FACTOR: 1.8
      PROJECTED_NIGHTS_PER_ATHLETE: 4
      DAILY_SPEND_CENTS: 18500
      ECONOMIC_MULTIPLIER: 1.45
    precision: "whole cents; round_half_up applied twice — once on direct spend, once on the multiplied impact"
    variants:
      - name: provisional_forward_looking
        when: "every ops-run checkpoint, and any read of GET /games-editions/{id}/economic-impact before finalization"
        difference: "Counts every not-yet-terminal registrant as a head and assumes a flat PROJECTED_NIGHTS_PER_ATHLETE of 4, ignoring actual VillageStay rows entirely."
      - name: final_chronological
        when: "POST /finalize-impact on an edition whose status == COMPLETED"
        difference: "Counts only athletes who actually reached CHECKED_IN and replays real stays in check-in order to derive nights_per_head. On the same database with 3 registrants of whom 1 checked in for a 5-night stay, provisional_impact_cents == 901320 while final_impact_cents == 375550."

  - name: medical_risk_score
    trigger: "POST /senior-games/medical-screenings — sets MedicalScreening.contact_sport_count, risk_score and recommendation, then drives the Athlete medical dimension"
    algorithm: weighted_scoring
    formula: |
      contact_sport_count = count(SportEntry where athlete_id == A.id
                              and status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED,
                                             WAITLISTED, ACCEPTED}
                              and Sport(SportEvent(entry.sport_event_id).sport_id).contact_class == "HIGH")

      age_points  = min(AGE_POINT_CAP, max(0, athlete.age_at_reference - AGE_POINT_FLOOR)
                                        * AGE_POINTS_PER_YEAR)
      bp_points   = 0                     if systolic_bp <  130
                  = BP_POINTS_ELEVATED    if 130 <= systolic_bp < 150
                  = BP_POINTS_HIGH        if systolic_bp >= 150
      hr_points   = max(0, resting_hr - HR_POINT_FLOOR) * HR_POINTS_PER_BPM
      load_points = min(LOAD_POINT_CAP, contact_sport_count * LOAD_POINTS_PER_CONTACT_ENTRY)
      cardiac_multiplier = CARDIAC_MULTIPLIER if prior_cardiac_event else 1.0

      raw        = (age_points + bp_points + hr_points + load_points) * cardiac_multiplier
      risk_score = round_half_up(min(100.0, raw), 1 decimal place)

      recommendation = "CLEARED"                        if risk_score <  25.0
                     = "CLEARED_WITH_RESTRICTION"       if 25.0 <= risk_score < 60.0
                     = "HOLD_PENDING_PHYSICIAN_REVIEW"  if risk_score >= 60.0
    input_set: "One Athlete row (age_at_reference only), the three request vitals, and the athlete's non-terminal SportEntry rows joined through SportEvent to Sport for contact_class. Prior MedicalScreening rows are NOT inputs."
    constants:
      AGE_POINT_FLOOR: 55
      AGE_POINTS_PER_YEAR: 1.5
      AGE_POINT_CAP: 30
      BP_POINTS_ELEVATED: 12
      BP_POINTS_HIGH: 25
      HR_POINT_FLOOR: 70
      HR_POINTS_PER_BPM: 0.4
      LOAD_POINTS_PER_CONTACT_ENTRY: 7
      LOAD_POINT_CAP: 20
      CARDIAC_MULTIPLIER: 1.6
      RESTRICTION_THRESHOLD: 25.0
      HOLD_THRESHOLD: 60.0
    precision: "one decimal place, round_half_up, clamped to a 100.0 ceiling"
    variants: []

  - name: venue_area_occupancy
    trigger: "POST /senior-games/session-slots and POST /senior-games/session-slots/{session_slot_id}/reschedule — gate before the slot is persisted"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS #1 — HALF-OPEN intervals, teardown-buffer EXTENDED at the END
      # only, with AGGREGATE per-venue concurrency capacity.
      occupied_window(slot) = [ slot.start_utc , slot.end_utc + slot.teardown_buffer_minutes )
      intersects(A, B)      = A.lo <  B.hi  AND  B.lo <  A.hi
                              # touching endpoints do NOT intersect: A.hi == B.lo is legal.

      candidate_window = [ request.start_utc , request.end_utc + request.teardown_buffer_minutes )
      concurrent = count(SessionSlot where venue_id == request.venue_id
                         and status IN {SCHEDULED, IN_PROGRESS}
                         and id != the slot being rescheduled
                         and intersects(occupied_window(that slot), candidate_window))
      if concurrent >= Venue(request.venue_id).competition_area_count:
          -> ERR_VENUE_AREA_CAPACITY_EXCEEDED
    input_set: "SessionSlot rows on the target venue with status IN {SCHEDULED, IN_PROGRESS}. DISPLACED, RELEASED and COMPLETED slots do NOT occupy areas. On reschedule the slot being moved is excluded from its own comparison set."
    constants: {}
    precision: "whole minutes; buffer is added to end_utc only, never subtracted from start_utc"
    variants: []

  - name: personnel_conflict_window
    trigger: "POST /senior-games/personnel-assignments — gate before the assignment is persisted"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS #2 — CLOSED intervals, SYMMETRICALLY expanded by a travel
      # buffer whose size is CONDITIONAL on whether the two slots share a venue, with
      # a SEPARATE aggregate per-calendar-date minutes cap. Capacity is always 1 (a
      # person cannot be in two places), so there is no concurrency count here.
      candidate = SessionSlot(request.session_slot_id)
      for each existing PersonnelAssignment X of Personnel(request.personnel_id)
          with X.status IN {ASSIGNED, CONFIRMED} and slot_X = SessionSlot(X.session_slot_id)
          and slot_X.status IN {SCHEDULED, IN_PROGRESS}:
              buffer = 0 if slot_X.venue_id == candidate.venue_id
                       else PERSONNEL_TRAVEL_BUFFER_MINUTES
              lo = slot_X.start_utc - buffer ; hi = slot_X.end_utc + buffer
              # CLOSED comparison: touching endpoints DO conflict.
              if lo <= candidate.end_utc AND candidate.start_utc <= hi:
                  -> ERR_PERSONNEL_DOUBLE_BOOKED

      # aggregate daily cap, evaluated on the UTC calendar date of candidate.start_utc
      duration_minutes = whole minutes between candidate.start_utc and candidate.end_utc
      same_date_minutes = sum of duration_minutes over the same person's assignments with
                          status IN {ASSIGNED, CONFIRMED} whose slot's start_utc falls on
                          the same UTC calendar date
      if same_date_minutes + duration_minutes > MAX_DAILY_ASSIGNED_MINUTES:
          -> ERR_PERSONNEL_DAILY_LIMIT_EXCEEDED
    input_set: "PersonnelAssignment rows of the target person with status IN {ASSIGNED, CONFIRMED} whose SessionSlot status IN {SCHEDULED, IN_PROGRESS}. RELEASED, COMPLETED and NO_SHOW assignments are excluded from both the overlap scan and the daily cap."
    constants:
      PERSONNEL_TRAVEL_BUFFER_MINUTES: 45
      MAX_DAILY_ASSIGNED_MINUTES: 480
    precision: "whole minutes; comparison is inclusive on both ends (<= / <=)"
    variants: []

  - name: athlete_multisport_gap
    trigger: "POST /senior-games/sport-entries/{sport_entry_id}/review with decision == ACCEPT, and POST /senior-games/session-slots (and its reschedule) for events that already hold ACCEPTED entries"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS #3 — CLOSED intervals with a MANDATORY MINIMUM GAP measured
      # between the two intervals rather than any expansion of them; no aggregate
      # capacity term and no venue-conditional behaviour.
      for the athlete A being accepted (or for every ACCEPTED entry of the event whose
      slot is being created), let S = the set of SessionSlot rows with status IN
      {SCHEDULED, IN_PROGRESS} whose sport_event_id is the event of any ACCEPTED
      SportEntry of A:
          for every unordered pair (X, Y) in S with X != Y:
              gap_minutes = whole minutes from min(X.end_utc, Y.end_utc)
                            to max(X.start_utc, Y.start_utc)
              # negative gap means the two blocks overlap outright
              if gap_minutes < ATHLETE_RECOVERY_GAP_MINUTES:  -> ERR_ATHLETE_SCHEDULE_CONFLICT
      # gap_minutes exactly equal to ATHLETE_RECOVERY_GAP_MINUTES is ACCEPTED (>=).
    input_set: "SessionSlot rows with status IN {SCHEDULED, IN_PROGRESS} belonging to SportEvent rows for which the athlete holds a SportEntry with status == ACCEPTED. WAITLISTED, MEDICAL_HOLD and WITHDRAWN entries contribute no slots."
    constants:
      ATHLETE_RECOVERY_GAP_MINUTES: 30
    precision: "whole minutes; the boundary is inclusive — a gap of exactly 30 minutes passes"
    variants: []

  - name: bed_night_occupancy
    trigger: "POST /senior-games/village-stays — gate before the stay is persisted"
    algorithm: aggregation
    formula: |
      # INTERVAL SEMANTICS #4 — HALF-OPEN on DATE granularity with a per-night aggregate
      # bed capacity. Unlike #1 the capacity test is evaluated night by night rather
      # than against a single merged window, so a long stay can fail on one night only.
      for each date d with request.check_in_date <= d < request.check_out_date:
          occupied(d) = count(VillageStay where accommodation_block_id == request.accommodation_block_id
                              and status IN {RESERVED, CHECKED_IN, COMPLETED}
                              and check_in_date <= d < check_out_date)
          if occupied(d) >= AccommodationBlock.bed_capacity:  -> ERR_BLOCK_NIGHT_FULL

      nights            = (check_out_date - check_in_date) in whole days
      total_charge_cents = nights * AccommodationBlock.nightly_rate_cents
      block.reserved_bed_nights += nights
    input_set: "VillageStay rows on the target block with status IN {RESERVED, CHECKED_IN, COMPLETED}. CANCELLED stays occupy nothing. The night of check_out_date is never occupied."
    constants: {}
    precision: "whole days and whole cents"
    variants: []

  - name: waitlist_promotion_order
    trigger: "POST /senior-games/games-editions/{games_edition_id}/ops-run — promotes WAITLISTED entries into freed capacity"
    algorithm: waterfall_allocation
    formula: |
      # Events are processed in a pinned order, and within each event candidates are
      # ranked by a fully specified key. No random field participates.
      for each SportEvent E where E.games_edition_id == G.id
          and E.status IN {OPEN, SEEDED, UNDERSUBSCRIBED}
          and E.available_slots > 0,
          processed in order E.created_at ASC:

          eligibility filter -> candidates = SportEntry rows where
                sport_event_id == E.id
            and status == WAITLISTED
            and Athlete(athlete_id).registration_status == REGISTERED
            and Athlete(athlete_id).medical_status IN {SCREENED_CLEARED, SCREENED_RESTRICTED,
                                                       CLEARED_BY_APPEAL}

          ranking expression (ascending, lexicographic over the tuple):
                1. entry.qualification_priority            ASC   (1 best .. 4 worst)
                2. mark_rank, defined as
                     entry.qualifying_mark          ASC  when Sport.mark_direction == LOWER_IS_BETTER
                     (-1 * entry.qualifying_mark)   ASC  when Sport.mark_direction == HIGHER_IS_BETTER
                     entries whose qualifying_mark is null sort AFTER every non-null mark
                3. entry.created_at                        ASC   (final tie-break; never `id`)

          promote candidates in rank order while E.available_slots > 0, each promotion
          firing SportEntry WAITLISTED_to_ACCEPTED.
          empty candidate set -> no promotion for E, no error, ops-run continues.
    input_set: "SportEntry rows with status == WAITLISTED on events of this edition with available_slots > 0, filtered by the athlete's registration and medical dimensions. Entries in any other status never participate."
    constants: {}
    precision: "exact integer capacity accounting; no partial promotions"
    variants: []

  - name: national_qualification_flag
    trigger: "the CompetitionResult verify transitions (SUBMITTED_to_VERIFIED and SUBMITTED_to_RECORD_PENDING) — sets CompetitionResult.national_qualifying"
    algorithm: threshold
    formula: |
      standard = SportEvent(SportEntry(result.sport_entry_id).sport_event_id).national_qualifying_standard
      if standard == null:
          national_qualifying = false
      else if Sport.mark_direction == "LOWER_IS_BETTER":
          national_qualifying = (result.mark_value <= standard)     # meeting the standard exactly qualifies
      else:
          national_qualifying = (result.mark_value >= standard)     # meeting the standard exactly qualifies
    input_set: "One CompetitionResult row plus the SportEvent standard and Sport.mark_direction reached through its SportEntry."
    constants: {}
    precision: "direct numeric comparison; the boundary is inclusive on both directions"
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared role names in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 5
    category: auth
    check: "the acting role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 10
    category: business_constraint
    check: "every required body field of the called endpoint is present, correctly typed, within its declared numeric range, and (for enum fields) a declared member; unknown body fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 12
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"
  - priority: 14
    category: existence
    check: "every id in the request path resolves to an existing row, validated left-to-right"
    error_id: "ERR_GAMES_EDITION_NOT_FOUND | ERR_SPORT_NOT_FOUND | ERR_SPORT_EVENT_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_SESSION_SLOT_NOT_FOUND | ERR_ATHLETE_NOT_FOUND | ERR_QUALIFYING_RESULT_NOT_FOUND | ERR_SPORT_ENTRY_NOT_FOUND | ERR_MEDICAL_SCREENING_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND | ERR_PERSONNEL_ASSIGNMENT_NOT_FOUND | ERR_COMPETITION_RESULT_NOT_FOUND | ERR_AGE_GROUP_RECORD_NOT_FOUND | ERR_ACCOMMODATION_BLOCK_NOT_FOUND | ERR_VILLAGE_STAY_NOT_FOUND | ERR_SPONSORSHIP_COMMITMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 18
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "the matching ERR_*_NOT_FOUND from the priority-14 list"
    http_status: 404
    applies_to: "POST /sport-events, POST /venues, POST /session-slots, POST /athletes, POST /qualifying-results, POST /sport-entries, POST /medical-screenings, POST /personnel, POST /personnel-assignments, POST /competition-results, POST /age-group-records, POST /accommodation-blocks, POST /village-stays, POST /sponsorship-commitments"
  - priority: 22
    category: auth
    check: "for an entity_backed role, X-User-ID equals the owning foreign key of the target resource: Athlete -> athlete_id (or the athlete's own id on /athletes/{id}/... paths); SportOfficial -> PersonnelAssignment.personnel_id and CompetitionResult.submitted_by_personnel_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /athletes/{athlete_id}/pay-fees, POST /athletes/{athlete_id}/withdraw, POST /sport-entries, POST /sport-entries/{sport_entry_id}/resubmit, POST /sport-entries/{sport_entry_id}/withdraw, POST /competition-results, POST /competition-results/{competition_result_id}/protest, POST /personnel-assignments/{personnel_assignment_id}/confirm, POST /village-stays, POST /village-stays/{village_stay_id}/cancel"
  - priority: 26
    category: state
    check: "the OCC field expected_<parent>_version equals the current version of the named parent row (concurrency_rules record-claim-stale-sport-event, stay-create-stale-block, sponsorship-allocate-stale-games-edition)"
    error_id: "ERR_STALE_SPORT_EVENT_VERSION | ERR_STALE_BLOCK_VERSION | ERR_STALE_GAMES_EDITION_VERSION"
    http_status: 412
    applies_to: "POST /age-group-records, POST /village-stays, POST /sponsorship-commitments/{sponsorship_commitment_id}/allocate"
  - priority: 30
    category: state
    check: "the governing GamesEdition is in a status that permits this operation (REGISTRATION_OPEN for registration writes; REGISTRATION_CLOSED or IN_PROGRESS for check-in; COMPLETED for finalize-impact; any status other than IMPACT_FINALIZED for sponsorship writes)"
    error_id: ERR_EDITION_STATE_INVALID
    http_status: 409
    applies_to: "POST /athletes, POST /athletes/{athlete_id}/pay-fees, POST /athletes/{athlete_id}/check-in, POST /sport-entries, POST /games-editions/{games_edition_id}/open-registration, POST /games-editions/{games_edition_id}/finalize-impact, POST /sponsorship-commitments/{sponsorship_commitment_id}/allocate"
  - priority: 34
    category: state
    check: "the target row's own status is a declared `from:` state of the requested transition in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint (paths ending in /open-registration, /seed, /cancel, /close, /reschedule, /advance, /pay-fees, /check-in, /withdraw, /medical-appeal, /review, /resubmit, /confirm, /release, /verify, /publish, /protest, /resolve-protest, /ratify, /allocate, /finalize-impact)"
  - priority: 38
    category: state
    check: "the target row is not already in a terminal state for its machine (SportEntry REJECTED/WITHDRAWN, CompetitionResult VOIDED, AgeGroupRecord REJECTED/SUPERSEDED, VillageStay COMPLETED/CANCELLED, Athlete WITHDRAWN/EXPIRED, SponsorshipCommitment WITHDRAWN)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint"
    note: "GamesEdition is deliberately absent from this list: its post-finalization guard lives at priority 100, so an ops-run on an IMPACT_FINALIZED edition answers ERR_IMPACT_ALREADY_FINALIZED and a repeat finalize-impact answers ERR_EDITION_STATE_INVALID from priority 30."
  - priority: 42
    category: state
    check: "cross-entity gate SportEntry -> Athlete: the entering athlete's registration_status == REGISTERED when an entry is accepted or promoted"
    error_id: ERR_ATHLETE_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /sport-entries/{sport_entry_id}/review with decision == ACCEPT"
  - priority: 44
    category: state
    check: "cross-entity gate SessionSlot -> Venue: Venue(request.venue_id).status == OPEN"
    error_id: ERR_VENUE_CLOSED
    http_status: 409
    applies_to: "POST /session-slots, POST /session-slots/{session_slot_id}/reschedule, POST /session-slots/{session_slot_id}/advance"
  - priority: 46
    category: state
    check: "cross-entity gate AgeGroupRecord -> CompetitionResult: the cited result's status IN {RECORD_PENDING, PUBLISHED} when a claim is filed or ratified"
    error_id: ERR_RESULT_NOT_RECORD_ELIGIBLE
    http_status: 409
    applies_to: "POST /age-group-records, POST /age-group-records/{age_group_record_id}/ratify"
  - priority: 48
    category: state
    check: "cross-entity gate CompetitionResult -> SessionSlot: the slot cited by the result has status IN {IN_PROGRESS, COMPLETED} at submission and status == COMPLETED at verification"
    error_id: ERR_SLOT_NOT_COMPETED
    http_status: 409
    applies_to: "POST /competition-results, POST /competition-results/{competition_result_id}/verify"
  - priority: 50
    category: business_safety
    check: "the athlete's medical dimension does not block competition: medical_status != SCREENED_HOLD when submitting or accepting an entry, and medical_status IN {SCREENED_CLEARED, SCREENED_RESTRICTED, CLEARED_BY_APPEAL} at check-in"
    error_id: ERR_ATHLETE_MEDICAL_HOLD
    http_status: 422
    applies_to: "POST /sport-entries, POST /sport-entries/{sport_entry_id}/review, POST /athletes/{athlete_id}/check-in"
  - priority: 52
    category: business_safety
    check: "a SessionSlot for an event whose Sport.contact_class == HIGH may only be placed at a Venue with has_onsite_medical_bay == true"
    error_id: ERR_MEDICAL_COVERAGE_REQUIRED
    http_status: 422
    applies_to: "POST /session-slots, POST /session-slots/{session_slot_id}/reschedule"
  - priority: 54
    category: business_safety
    check: "a SessionSlot for an event whose age_group_code floor is >= 75 may only be placed at a Venue whose emergency_protocol_code == EP_CARDIAC"
    error_id: ERR_EMERGENCY_PROTOCOL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /session-slots, POST /session-slots/{session_slot_id}/reschedule"
  - priority: 58
    category: business_constraint
    check: "segregation of duties on record ratification: X-User-ID differs from AgeGroupRecord.claimed_by_user_id AND from CompetitionResult.verified_by_user_id of the cited result"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /age-group-records/{age_group_record_id}/ratify"
  - priority: 60
    category: business_referential
    check: "the cited QualifyingResult belongs to the entering athlete, was contested in the same Sport as the target event, has event_code equal to the target SportEvent.event_code, has sanctioned == true, and has meet_level == STATE when qualification_source == STATE_QUALIFIER (LOCAL or STATE when LOCAL_QUALIFIER); qualifying_result_id must be null exactly when qualification_source IN {AGE_EXEMPT, ORGANIZER_INVITE}"
    error_id: ERR_QUALIFYING_RESULT_INVALID
    http_status: 422
    applies_to: "POST /sport-entries, POST /sport-entries/{sport_entry_id}/resubmit"
  - priority: 62
    category: business_referential
    check: "the target SportEvent.age_group_code equals the athlete's computed age_group_code, and the event's Sport.min_age <= athlete's basis age; qualification_source == AGE_EXEMPT additionally requires the athlete's basis age >= AGE_EXEMPT_FLOOR (75)"
    error_id: ERR_AGE_GROUP_MISMATCH
    http_status: 422
    applies_to: "POST /sport-entries, POST /sport-entries/{sport_entry_id}/resubmit"
  - priority: 64
    category: business_constraint
    check: "an assignment whose Personnel.personnel_type == OFFICIAL requires Personnel.certification_level >= Sport.required_certification_level of the slot's event AND the slot's Sport.sport_code to be a member of Personnel.certified_sport_codes"
    error_id: ERR_CERTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /personnel-assignments"
  - priority: 66
    category: business_temporal
    check: "calculations.personnel_conflict_window finds no travel-buffer-expanded closed-interval collision with the person's existing ASSIGNED or CONFIRMED assignments"
    error_id: ERR_PERSONNEL_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /personnel-assignments"
  - priority: 68
    category: business_temporal
    check: "calculations.athlete_multisport_gap finds every pair of the athlete's scheduled slots separated by at least ATHLETE_RECOVERY_GAP_MINUTES"
    error_id: ERR_ATHLETE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /sport-entries/{sport_entry_id}/review with decision == ACCEPT, POST /session-slots, POST /session-slots/{session_slot_id}/reschedule"
  - priority: 70
    category: business_temporal
    check: "the logical clock is strictly before GamesEdition.registration_deadline_utc"
    error_id: ERR_REGISTRATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /athletes, POST /sport-entries, POST /sport-entries/{sport_entry_id}/resubmit, POST /games-editions/{games_edition_id}/open-registration"
  - priority: 72
    category: business_temporal
    check: "a VillageStay interval lies inside [GamesEdition.competition_start_date - VILLAGE_LEAD_DAYS, GamesEdition.competition_end_date + VILLAGE_TRAIL_DAYS] with VILLAGE_LEAD_DAYS = 2 and VILLAGE_TRAIL_DAYS = 2, and check_out_date > check_in_date"
    error_id: ERR_STAY_OUTSIDE_VILLAGE_WINDOW
    http_status: 422
    applies_to: "POST /village-stays"
  - priority: 74
    category: business_constraint
    check: "the athlete has no other SportEntry on the same sport_event_id with status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, ACCEPTED, WAITLISTED, MEDICAL_HOLD}"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /sport-entries"
  - priority: 76
    category: business_constraint
    check: "calculations.venue_area_occupancy reports fewer concurrent SCHEDULED/IN_PROGRESS slots than Venue.competition_area_count for the candidate buffered window"
    error_id: ERR_VENUE_AREA_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /session-slots, POST /session-slots/{session_slot_id}/reschedule"
  - priority: 78
    category: business_constraint
    check: "calculations.bed_night_occupancy finds every night of the candidate stay below AccommodationBlock.bed_capacity"
    error_id: ERR_BLOCK_NIGHT_FULL
    http_status: 409
    applies_to: "POST /village-stays"
  - priority: 80
    category: business_constraint
    check: "adding this assignment keeps the person's same-UTC-date assigned minutes at or below MAX_DAILY_ASSIGNED_MINUTES"
    error_id: ERR_PERSONNEL_DAILY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /personnel-assignments"
  - priority: 82
    category: business_constraint
    check: "SportEntry.revision_round < MAX_REVISION_ROUNDS (2) when a revision is requested or a resubmission is filed"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /sport-entries/{sport_entry_id}/review with decision == REQUEST_REVISION, POST /sport-entries/{sport_entry_id}/resubmit"
  - priority: 84
    category: business_constraint
    check: "CompetitionResult.protest_round == 0 when a protest is filed"
    error_id: ERR_PROTEST_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /competition-results/{competition_result_id}/protest"
  - priority: 86
    category: business_constraint
    check: "the seeding candidate set (SportEntry rows with status == ACCEPTED on the event) is non-empty"
    error_id: ERR_NO_ELIGIBLE_ENTRIES
    http_status: 422
    applies_to: "POST /sport-events/{sport_event_id}/seed"
  - priority: 88
    category: business_constraint
    check: "SportEvent.accepted_entry_count >= SportEvent.min_entries_to_stage at seeding time"
    error_id: ERR_MIN_ENTRIES_NOT_MET
    http_status: 422
    applies_to: "POST /sport-events/{sport_event_id}/seed"
  - priority: 90
    category: business_constraint
    check: "uniqueness: Sport.sport_code is unique across all Sport rows; (games_edition_id, email) is unique across Athlete rows; (personnel_id, session_slot_id) is unique across PersonnelAssignment rows with status IN {ASSIGNED, CONFIRMED, COMPLETED}; (sport_entry_id) admits at most one CompetitionResult with status IN {SUBMITTED, VERIFIED, RECORD_PENDING, PUBLISHED}"
    error_id: "ERR_SPORT_CODE_TAKEN | ERR_ATHLETE_EMAIL_TAKEN | ERR_ASSIGNMENT_DUPLICATE | ERR_RESULT_ALREADY_RECORDED"
    http_status: 409
    applies_to: "POST /sports, POST /athletes, POST /personnel-assignments, POST /competition-results"
  - priority: 92
    category: business_constraint
    check: "the athlete's basis age is at least MIN_ELIGIBLE_AGE (50) under the edition's age_basis"
    error_id: ERR_ATHLETE_UNDER_MINIMUM_AGE
    http_status: 422
    applies_to: "POST /athletes"
  - priority: 94
    category: business_constraint
    check: "SportEvent.capacity >= SportEvent.min_entries_to_stage at creation, and end_utc > start_utc on any SessionSlot write"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /sport-events, POST /session-slots, POST /session-slots/{session_slot_id}/reschedule"
  - priority: 96
    category: business_fiscal
    check: "SportEvent.available_slots > 0 when an entry is accepted"
    error_id: ERR_EVENT_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /sport-entries/{sport_entry_id}/review with decision == ACCEPT"
  - priority: 98
    category: business_fiscal
    check: "request.amount_cents equals the fee_total_cents produced by calculations.athlete_fee_settlement for this athlete"
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /athletes/{athlete_id}/pay-fees"
  - priority: 100
    category: business_fiscal
    check: "GamesEdition.final_impact_cents is still null when finalize-impact runs, and no further ops-run checkpoint is accepted once it is non-null (the impact ledger is frozen)"
    error_id: ERR_IMPACT_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /games-editions/{games_edition_id}/finalize-impact, POST /games-editions/{games_edition_id}/ops-run"

# =====================================================================
# §1.5 API Endpoint Table   (all paths are prefixed with /senior-games)
# =====================================================================
endpoints:
  # ---------------- GamesEdition ----------------
  - method: POST
    path: "/senior-games/games-editions"
    description: "Create a games edition in DRAFT."
    roles: [GamesAdmin]
    code: 201
    input: [name, host_city, host_state_code, competition_start_date, competition_end_date, age_reference_date, registration_deadline_utc, "age_basis?", "municipal_support_cents?"]
    output: GamesEdition
    side_effects: ["status = DRAFT", "ops_epoch = 0", "sponsorship_recognized_cents = 0", "provisional_impact_cents = 0", "final_impact_cents = null"]
  - method: GET
    path: "/senior-games/games-editions/{games_edition_id}"
    description: "Read one games edition, including its version for OCC and both impact figures."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: GamesEdition
    side_effects: []
  - method: GET
    path: "/senior-games/games-editions"
    description: "List games editions, filterable by status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["status?", "host_state_code?", "limit?", "offset?"]
    output: GamesEdition[]
    side_effects: []
  - method: POST
    path: "/senior-games/games-editions/{games_edition_id}/open-registration"
    description: "Move the edition DRAFT -> REGISTRATION_OPEN."
    roles: [GamesAdmin]
    code: 200
    input: []
    output: GamesEdition
    side_effects: ["status = REGISTRATION_OPEN", "increments GamesEdition.version by 1"]
  - method: POST
    path: "/senior-games/games-editions/{games_edition_id}/ops-run"
    description: "Ops-run checkpoint, executed in this pinned phase order: (1) increment ops_epoch; (2) expire unpaid registrations whose deadline has passed; (3) promote WAITLISTED entries per calculations.waitlist_promotion_order; (4) complete village stays whose check_out_date has arrived; (5) advance the edition status by AT MOST ONE step (DRAFT is advanced only by open-registration; REGISTRATION_OPEN -> REGISTRATION_CLOSED, REGISTRATION_CLOSED -> IN_PROGRESS and IN_PROGRESS -> COMPLETED each require their own ops-run call even when the logical clock already satisfies several guards); (6) recompute provisional_impact_cents."
    roles: [GamesAdmin]
    code: 200
    input: []
    output: GamesEdition
    side_effects: ["increments ops_epoch by 1", "Athlete PENDING_PAYMENT_to_EXPIRED cascade", "SportEntry WAITLISTED_to_ACCEPTED promotions", "VillageStay CHECKED_IN_to_COMPLETED", "edition status advance", "recomputes provisional_impact_cents", "increments GamesEdition.version by 1"]
  - method: POST
    path: "/senior-games/games-editions/{games_edition_id}/finalize-impact"
    description: "Compute the chronological final economic impact and move the edition COMPLETED -> IMPACT_FINALIZED."
    roles: [SponsorLiaison]
    code: 200
    input: []
    output: GamesEdition
    side_effects: ["sets final_impact_cents via calculations.economic_impact_projection variant final_chronological", "status = IMPACT_FINALIZED", "increments GamesEdition.version by 1"]
  - method: GET
    path: "/senior-games/games-editions/{games_edition_id}/economic-impact"
    description: "Computed read of both impact variants side by side plus the sponsorship and municipal ledgers."
    roles: [GamesAdmin, SponsorLiaison]
    code: 200
    input: []
    output: { provisional_impact_cents: integer, final_impact_cents: integer, sponsorship_recognized_cents: integer, municipal_support_cents: integer, registered_heads: integer, checked_in_heads: integer, actual_room_nights: integer }
    side_effects: []

  # ---------------- Sport ----------------
  - method: POST
    path: "/senior-games/sports"
    description: "Register a sport with its age-based equipment and format modification profiles."
    roles: [GamesAdmin]
    code: 201
    input: [sport_code, name, contact_class, mark_direction, required_certification_level, "min_age?", "equipment_profile?", "format_modifications?"]
    output: Sport
    side_effects: []
  - method: GET
    path: "/senior-games/sports/{sport_id}"
    description: "Read one sport including its age-keyed equipment_profile and format_modifications."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: Sport
    side_effects: []
  - method: GET
    path: "/senior-games/sports"
    description: "List the sport catalogue, filterable by contact class."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["contact_class?", "limit?", "offset?"]
    output: Sport[]
    side_effects: []

  # ---------------- SportEvent ----------------
  - method: POST
    path: "/senior-games/sport-events"
    description: "Create a sport event directly in OPEN."
    roles: [GamesAdmin]
    code: 201
    input: [sport_id, games_edition_id, event_code, age_group_code, gender_division, entry_fee_cents, capacity, "min_entries_to_stage?", "national_qualifying_standard?"]
    output: SportEvent
    side_effects: ["status = OPEN", "accepted_entry_count = 0", "available_slots = capacity", "current_record_id = null"]
  - method: GET
    path: "/senior-games/sport-events/{sport_event_id}"
    description: "Read one sport event including capacity accounting, current_record_id and version for OCC."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: SportEvent
    side_effects: []
  - method: GET
    path: "/senior-games/sport-events"
    description: "List sport events, filterable by sport, edition, current record pointer, or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["sport_id?", "games_edition_id?", "current_record_id?", "status?", "limit?", "offset?"]
    output: SportEvent[]
    side_effects: []
  - method: POST
    path: "/senior-games/sport-events/{sport_event_id}/seed"
    description: "Seed the event from its ACCEPTED entries and move OPEN -> SEEDED."
    roles: [RegistrationOfficer]
    code: 200
    input: []
    output: SportEvent
    side_effects: ["status = SEEDED", "seeded_at_utc = logical clock", "increments SportEvent.version by 1"]
  - method: POST
    path: "/senior-games/sport-events/{sport_event_id}/cancel"
    description: "Cancel an UNDERSUBSCRIBED event, withdrawing every non-terminal entry."
    roles: [GamesAdmin]
    code: 200
    input: [reason]
    output: SportEvent
    side_effects: ["status = CANCELLED", "non-terminal SportEntry rows move to WITHDRAWN", "accepted_entry_count = 0 and available_slots = capacity", "increments SportEvent.version by 1"]

  # ---------------- Venue ----------------
  - method: POST
    path: "/senior-games/venues"
    description: "Create a venue with its competition-area count, medical bay flag and emergency protocol tier."
    roles: [GamesAdmin]
    code: 201
    input: [games_edition_id, name, competition_area_count, spectator_capacity, emergency_protocol_code, "has_onsite_medical_bay?"]
    output: Venue
    side_effects: ["status = OPEN", "closed_reason = null"]
  - method: GET
    path: "/senior-games/venues/{venue_id}"
    description: "Read one venue."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: GET
    path: "/senior-games/venues"
    description: "List venues, filterable by edition or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["games_edition_id?", "status?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []
  - method: POST
    path: "/senior-games/venues/{venue_id}/close"
    description: "Close a venue for weather or emergency; displaces every scheduled or running slot at the venue and cascades to their personnel and events."
    roles: [GamesAdmin]
    code: 200
    input: [reason]
    output: Venue
    side_effects: ["status = CLOSED", "SessionSlot SCHEDULED/IN_PROGRESS -> DISPLACED", "PersonnelAssignment ASSIGNED/CONFIRMED -> RELEASED with Personnel.assigned_minutes_total decrements", "SportEvent SEEDED -> SCHEDULE_HOLD", "increments Venue.version by 1"]

  # ---------------- SessionSlot ----------------
  - method: POST
    path: "/senior-games/session-slots"
    description: "Schedule a competition block, gated by venue-area occupancy, medical coverage, emergency protocol tier and the multi-sport athlete recovery gap."
    roles: [GamesAdmin]
    code: 201
    input: [venue_id, sport_event_id, start_utc, end_utc, "teardown_buffer_minutes?", "required_official_count?"]
    output: SessionSlot
    side_effects: ["status = SCHEDULED", "confirmed_official_count = 0"]
  - method: GET
    path: "/senior-games/session-slots/{session_slot_id}"
    description: "Read one session slot."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: SessionSlot
    side_effects: []
  - method: GET
    path: "/senior-games/session-slots"
    description: "List session slots, filterable by venue, event or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["venue_id?", "sport_event_id?", "status?", "limit?", "offset?"]
    output: SessionSlot[]
    side_effects: []
  - method: POST
    path: "/senior-games/session-slots/{session_slot_id}/reschedule"
    description: "Move a DISPLACED slot to a new venue and interval, re-running every scheduling gate."
    roles: [GamesAdmin]
    code: 200
    input: [venue_id, start_utc, end_utc, "teardown_buffer_minutes?"]
    output: SessionSlot
    side_effects: ["status = SCHEDULED", "SportEvent SCHEDULE_HOLD -> SEEDED", "increments SessionSlot.version by 1"]
  - method: POST
    path: "/senior-games/session-slots/{session_slot_id}/advance"
    description: "Advance a slot to IN_PROGRESS or COMPLETED. COMPLETED converts CONFIRMED assignments to COMPLETED and unconfirmed ASSIGNED ones to NO_SHOW."
    roles: [GamesAdmin]
    code: 200
    input: [to_status]
    output: SessionSlot
    side_effects: ["status = to_status", "SportEvent SEEDED -> IN_PROGRESS or IN_PROGRESS -> COMPLETED", "PersonnelAssignment CONFIRMED -> COMPLETED and ASSIGNED -> NO_SHOW with Personnel counter updates", "increments SessionSlot.version by 1"]

  # ---------------- Athlete ----------------
  - method: POST
    path: "/senior-games/athletes"
    description: "Register an athlete; assigns age_at_reference, age_at_first_day and age_group_code via calculations.athlete_age_group_assignment."
    roles: [GamesAdmin, RegistrationOfficer]
    code: 201
    input: [games_edition_id, full_name, email, date_of_birth, residency_state_code]
    output: Athlete
    side_effects: ["registration_status = PENDING_PAYMENT", "medical_status = NOT_SCREENED", "sets age_at_reference, age_at_first_day, age_group_code", "fee_total_cents = 0", "fee_paid_cents = 0"]
  - method: GET
    path: "/senior-games/athletes/{athlete_id}"
    description: "Read one athlete including both parallel status dimensions, both computed ages and the fee breakdown."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: Athlete
    side_effects: []
  - method: GET
    path: "/senior-games/athletes"
    description: "List athletes, filterable by edition and by either status dimension."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["games_edition_id?", "registration_status?", "medical_status?", "age_group_code?", "limit?", "offset?"]
    output: Athlete[]
    side_effects: []
  - method: POST
    path: "/senior-games/athletes/{athlete_id}/pay-fees"
    description: "Settle the registration fee via calculations.athlete_fee_settlement and move the registration dimension PENDING_PAYMENT -> REGISTERED."
    roles: [Athlete, GamesAdmin]
    code: 200
    input: [amount_cents]
    output: Athlete
    side_effects: ["recomputes fee_total_cents and fee_breakdown", "fee_paid_cents = fee_total_cents", "registration_status = REGISTERED", "increments Athlete.version by 1"]
  - method: POST
    path: "/senior-games/athletes/{athlete_id}/check-in"
    description: "Check an athlete in on site; also checks in any reserved village stay whose first night has arrived."
    roles: [GamesAdmin]
    code: 200
    input: []
    output: Athlete
    side_effects: ["registration_status = CHECKED_IN", "VillageStay RESERVED -> CHECKED_IN", "increments Athlete.version by 1"]
  - method: POST
    path: "/senior-games/athletes/{athlete_id}/withdraw"
    description: "Withdraw an athlete, firing the five-link entry / event / slot / personnel cascade and cancelling their village stays."
    roles: [Athlete, GamesAdmin]
    code: 200
    input: ["reason?"]
    output: Athlete
    side_effects: ["registration_status = WITHDRAWN", "non-terminal SportEntry rows -> WITHDRAWN with SportEvent capacity restoration", "SportEvent -> UNDERSUBSCRIBED where the floor is breached", "SessionSlot SCHEDULED -> RELEASED", "PersonnelAssignment -> RELEASED with assigned_minutes_total decrements", "VillageStay -> CANCELLED with reserved_bed_nights decrements", "increments Athlete.version by 1"]
  - method: POST
    path: "/senior-games/athletes/{athlete_id}/medical-appeal"
    description: "Rule on a physician-review appeal; GRANT moves the medical dimension to CLEARED_BY_APPEAL and restores MEDICAL_HOLD entries, DENY records the decision without changing the dimension."
    roles: [MedicalDirector]
    code: 200
    input: [decision, "note?"]
    output: Athlete
    side_effects: ["medical_status = CLEARED_BY_APPEAL on GRANT", "SportEntry MEDICAL_HOLD -> ACCEPTED or WAITLISTED", "increments Athlete.version by 1"]

  # ---------------- QualifyingResult (immutable) ----------------
  - method: POST
    path: "/senior-games/qualifying-results"
    description: "Record an immutable qualifying mark from a local or state qualifying meet."
    roles: [GamesAdmin, RegistrationOfficer]
    code: 201
    input: [athlete_id, sport_id, event_code, mark_value, meet_date, meet_level, sanctioned]
    output: QualifyingResult
    side_effects: []
  - method: GET
    path: "/senior-games/qualifying-results/{qualifying_result_id}"
    description: "Read one qualifying result. The row is immutable: it carries only id and created_at, no updated_at and no version."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: QualifyingResult
    side_effects: []
  - method: GET
    path: "/senior-games/qualifying-results"
    description: "List qualifying results, filterable by athlete or sport."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["athlete_id?", "sport_id?", "meet_level?", "limit?", "offset?"]
    output: QualifyingResult[]
    side_effects: []

  # ---------------- SportEntry ----------------
  - method: POST
    path: "/senior-games/sport-entries"
    description: "Enter an athlete in a sport event, citing a qualifying result or an age/invite exemption."
    roles: [Athlete, RegistrationOfficer]
    code: 201
    input: [athlete_id, sport_event_id, qualification_source, "qualifying_result_id?"]
    output: SportEntry
    side_effects: ["status = SUBMITTED", "revision_round = 0", "sets qualification_priority and qualifying_mark"]
  - method: GET
    path: "/senior-games/sport-entries/{sport_entry_id}"
    description: "Read one sport entry."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: SportEntry
    side_effects: []
  - method: GET
    path: "/senior-games/sport-entries"
    description: "List sport entries, filterable by athlete, event, cited qualifying result, or status."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["athlete_id?", "sport_event_id?", "qualifying_result_id?", "status?", "limit?", "offset?"]
    output: SportEntry[]
    side_effects: []
  - method: POST
    path: "/senior-games/sport-entries/{sport_entry_id}/review"
    description: "Registration review decision: TAKE_UP, ACCEPT, WAITLIST, REQUEST_REVISION or REJECT."
    roles: [RegistrationOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: SportEntry
    side_effects: ["status per decision", "ACCEPT increments SportEvent.accepted_entry_count and decrements available_slots", "ACCEPT may move SportEvent UNDERSUBSCRIBED -> OPEN", "increments SportEntry.version by 1"]
  - method: POST
    path: "/senior-games/sport-entries/{sport_entry_id}/resubmit"
    description: "Athlete answers a revision request with corrected qualification data, closing one revision loop."
    roles: [Athlete]
    code: 200
    input: [qualification_source, "qualifying_result_id?"]
    output: SportEntry
    side_effects: ["status = SUBMITTED", "increments revision_round by 1", "recomputes qualification_priority and qualifying_mark", "increments SportEntry.version by 1"]
  - method: POST
    path: "/senior-games/sport-entries/{sport_entry_id}/withdraw"
    description: "Withdraw a single entry, restoring the event's capacity accounting."
    roles: [Athlete, RegistrationOfficer]
    code: 200
    input: ["reason?"]
    output: SportEntry
    side_effects: ["status = WITHDRAWN", "restores SportEvent.accepted_entry_count and available_slots when leaving ACCEPTED", "may move SportEvent to UNDERSUBSCRIBED", "increments SportEntry.version by 1"]

  # ---------------- MedicalScreening (immutable) ----------------
  - method: POST
    path: "/senior-games/medical-screenings"
    description: "Record a pre-participation screening; computes contact_sport_count, risk_score and recommendation, then drives the athlete's medical dimension and any resulting entry cascade."
    roles: [MedicalDirector]
    code: 201
    input: [athlete_id, screened_by_user_id, systolic_bp, resting_hr, prior_cardiac_event]
    output: MedicalScreening
    side_effects: ["sets contact_sport_count, risk_score, recommendation, screened_at_utc", "Athlete medical dimension moves per recommendation", "SportEntry ACCEPTED -> MEDICAL_HOLD cascade with SportEvent capacity restoration and possible UNDERSUBSCRIBED transitions"]
  - method: GET
    path: "/senior-games/medical-screenings/{medical_screening_id}"
    description: "Read one screening. The row is immutable: only id and created_at are server-managed, there is no updated_at and no version."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: []
    output: MedicalScreening
    side_effects: []
  - method: GET
    path: "/senior-games/medical-screenings"
    description: "List screenings, filterable by athlete or recommendation."
    roles: [GamesAdmin, RegistrationOfficer, Athlete, MedicalDirector, SportOfficial, RecordsRatifier, SponsorLiaison]
    code: 200
    input: ["athlete_id?", "recommendation?", "limit?", "offset?"]
    output: MedicalScreening[]
    side_effects: []

  # ---------------- Personnel ----------------
  - method: POST
    path: "/senior-games/personnel"
    description: "Recruit an official or a volunteer with their certification level and certified sport codes."
    roles: [GamesAdmin]
    code: 201
    input: [games_edition_id, full_name, personnel_type, "certification_level?", "certified_sport_codes?"]
