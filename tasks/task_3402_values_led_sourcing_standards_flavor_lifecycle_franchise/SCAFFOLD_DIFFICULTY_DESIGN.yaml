              as: FranchiseAdmin
            - call: "POST /creamery/scoop-shops/${shop_id}/open"
              as: FranchiseAdmin
            - call: "POST /creamery/flavors"
              payload: { name: "Priority Pecan", base_type: "DAIRY", chunk_load_pct: 5, swirl_load_pct: 5, pint_price_cents: 199 }
              as: FlavorManager
              captures: { f_id: $.data.id }
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "TEST_BATCH" }
              as: FlavorManager
            - call: "POST /creamery/flavors/${f_id}/promote"
              payload: { target_state: "LIMITED_RUN" }
              as: FlavorManager
            - call: "POST /creamery/scoop-shops/${shop_id}/supply-orders"
              payload: { production_date: "2026-10-05", lines: [{ flavor_id: "${f_id}", quantity_pints: 10 }] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { o_id: $.data.id }
            - call: "POST /creamery/supply-orders/${o_id}/cancel"
              as: ShopOperator
              as_user_id: "${shop_id}"
          trigger:
