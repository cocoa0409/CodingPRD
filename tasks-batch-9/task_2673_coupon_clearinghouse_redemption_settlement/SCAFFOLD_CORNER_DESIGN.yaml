      - name: lot_can_be_disputed_again_after_the_first_dispute_closes
        claim_type: cyclic
        grounds:
          - state_machines.SubmissionLot.transitions.LOT_REJECTED_to_DISPUTED
          - state_machines.SubmissionLot.transitions.DISPUTED_to_LOT_REJECTED
          - state_machines.SubmissionLot.transitions.DISPUTED_to_REINSTATED
