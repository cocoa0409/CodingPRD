# =============================================================================
# SCAFFOLD — Children's Product Testing & Certification
# Sections §1.0 – §1.7. Difficulty design (§1.8) and corner design (§1.9) live
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "2203. Children's Product Testing & Certification (juvenile products compliance team): applicable rule identification by product category including lead, phthalates and mechanical hazards, third-party laboratory accreditation verification for each test method, sampling plan for initial certification and periodic testing with material change triggers, children's product certificate issuance with required content and accompaniment of shipments, tracking label requirements with production batch identification on the product and packaging, component part testing certificates from suppliers with reliance documentation, undue influence prevention policies over testing laboratories, noncompliance response with stop-distribution, retest and corrective action"

domain_name: "childrens-product-testing-certification"

api_prefix: "/compliance"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Graph constraint"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # Rule identification traverses ProductCategory -> CategoryRuleMapping -> ApplicableRule
  # (many-to-many junction); evidence traverses Product -> ComponentPart ->
  # ComponentPartCertificate -> ApplicableRule; certificates are self-referential via
  # supersedes_certificate_id. URL paths stay shallow (max one nesting level).

  state_machine_shape: cyclic
  # NoncomplianceCase loops RETEST_ORDERED -> RETEST_FAILED -> RETEST_ORDERED,
  # SamplingPlan loops ACTIVE -> RESAMPLE_DUE -> ACTIVE, ProductionBatch loops
  # RELEASED -> STOP_DISTRIBUTION -> RELEASED, Product loops
  # CERTIFIED -> SUSPENDED -> REMEDIATION -> EVIDENCE_COMPLETE.

  relationship_patterns:
    - one_to_many        # Product -> ComponentPart, Product -> ProductionBatch
    - many_to_many       # CategoryRuleMapping junction (ProductCategory x ApplicableRule)
    - self_referential   # ChildrensProductCertificate.supersedes_certificate_id
    - polymorphic        # MaterialChangeEvent.subject_type in {PRODUCT, COMPONENT_PART}
    - cross_aggregate    # TestOrder references Laboratory, ApplicableRule, SamplingPlan

  role_model: segregation_of_duties
  # The X-User-ID that ordered the testing evidence for a rule may not be the
  # X-User-ID that issues the certificate relying on it; the officer who opened a
  # NoncomplianceCase may not approve its closure.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: ApplicableRule
    parent: null
    common_fields: true
    fields:
      - name: rule_code
        type: string
        source: input
        description: Stable regulatory rule code, unique across all ApplicableRule rows.
        constraints: "uppercase snake, 3..40 chars, unique"
      - name: hazard_class
        type: enum
        source: input
        description: Hazard family the rule governs.
        constraints: "one of {LEAD_PAINT, LEAD_CONTENT, PHTHALATES, MECHANICAL_HAZARD, FLAMMABILITY}"
      - name: test_method_code
        type: string
        source: input
        description: The single laboratory test method a lab must be accredited for to run this rule.
        constraints: "uppercase alnum with dashes, 3..40 chars"
      - name: limit_value
        type: number
        source: input
        description: Numeric compliance limit the measured value is compared against.
        constraints: ">= 0"
      - name: limit_unit
        type: enum
        source: input
        description: Unit of limit_value.
        constraints: "one of {PPM, PERCENT_BY_WEIGHT, NEWTON, MILLIMETRE}"
      - name: limit_comparator
        type: enum
        source: input
        description: Comparison direction used by the pass/fail decision; AT_OR_BELOW means measured_value <= limit_value passes.
        default: AT_OR_BELOW
        constraints: "one of {AT_OR_BELOW, AT_OR_ABOVE}"
      - name: periodic_interval_months
        type: integer
        source: input
        description: Months between periodic verification tests for this rule.
        constraints: ">= 1 and <= 60"
      - name: base_method_fee_cents
        type: integer
        source: input
        description: Base laboratory fee in cents for one sample under this test method.
        constraints: ">= 0"
      - name: component_reliance_allowed
        type: boolean
        source: input
        description: Whether a supplier component part certificate may substitute for finished-product testing of this rule.
        default: true
      - name: severity_weight
        type: integer
        source: input
        description: Weight of an uncovered or failing rule in the product risk-weighted gap score.
        constraints: ">= 1 and <= 10"

  - name: ProductCategory
    parent: null
    common_fields: true
    fields:
      - name: category_code
        type: string
        source: input
        description: Stable juvenile-product category code, unique across all ProductCategory rows.
        constraints: "uppercase snake, 3..40 chars, unique"
      - name: display_name
        type: string
        source: input
        description: Human-readable category name.
        constraints: "1..120 chars"
      - name: durable_infant_product
        type: boolean
        source: input
        description: Whether the category is a durable infant or toddler product (drives stricter sampling floors).
        default: false
      - name: intended_age_max_months
        type: integer
        source: input
        description: Upper bound of the intended-user age range in months.
        constraints: ">= 0 and <= 168"
      - name: sampling_floor_units
        type: integer
        source: input
        description: Minimum number of sample units any SamplingPlan for a product in this category must authorize.
        constraints: ">= 1"

  - name: CategoryRuleMapping
    parent: null
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> ProductCategory.id; the category this mapping applies to."
      - name: rule_id
        type: string
        source: input
        description: "FK -> ApplicableRule.id; the rule made applicable to the category."
      - name: applicability_condition
        type: enum
        source: input
        description: Predicate evaluated against the product's ComponentPart rows to decide whether the rule is actually required.
        constraints: "one of {ALWAYS, IF_PAINTED_SURFACE, IF_PLASTICIZED_PART, IF_SMALL_PART_PRESENT, IF_ACCESSIBLE_METAL}"
      - name: effective_from
        type: datetime
        source: input
        description: Instant from which the mapping participates in rule identification (inclusive).
      - name: mapping_state
        type: enum
        source: system
        description: Whether the mapping is counted by rule identification.
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Supplier legal entity name.
        constraints: "1..160 chars"
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the supplier's manufacturing site.
        constraints: "exactly 2 uppercase letters"
      - name: reliance_agreement_state
        type: enum
        source: system
        description: Whether a signed component-part reliance agreement is on file, permitting the certifier to rely on this supplier's certificates.
        default: NOT_ON_FILE
        constraints: "one of {NOT_ON_FILE, ON_FILE}"
      - name: certificates_issued_count
        type: integer
        source: computed
        description: Count of ComponentPartCertificate rows whose supplier_id is this supplier and whose reliance_state is in {SUBMITTED, RELIED_UPON}.
        default: 0

  - name: Laboratory
    parent: null
    common_fields: true
    fields:
      - name: lab_name
        type: string
        source: input
        description: Laboratory legal name.
        constraints: "1..160 chars"
      - name: accreditation_body_code
        type: string
        source: input
        description: Code of the accreditation body that assessed the laboratory.
        constraints: "uppercase alnum, 2..20 chars"
      - name: independence_class
        type: enum
        source: input
        description: Independence category of the laboratory relative to the certifying manufacturer.
        constraints: "one of {INDEPENDENT, FIREWALLED_GOVERNMENT, MANUFACTURER_OWNED}"
      - name: operational_state
        type: enum
        source: system
        description: Whether the laboratory may take on new testing work.
        default: ACTIVE
        constraints: "one of {ACTIVE, BARRED}"
      - name: influence_attestation_state
        type: enum
        source: system
        description: State of the standing undue-influence prevention attestation required before this laboratory may be assigned work.
        default: MISSING
        constraints: "one of {MISSING, CURRENT, EXPIRED}"
      - name: influence_attestation_valid_through
        type: datetime
        source: system
        description: Inclusive last instant at which the standing influence attestation is honoured; null while influence_attestation_state is MISSING.
        default: null
      - name: concurrent_slot_capacity
        type: integer
        source: input
        description: Maximum number of TestOrder rows in states {SCHEDULED, IN_TESTING} whose testing windows may overlap at any instant for this laboratory.
        constraints: ">= 1 and <= 10"
      - name: billed_fee_cents_total
        type: integer
        source: computed
        description: Cumulative cents billed to this laboratory ledger by TestOrder rows that reached IN_TESTING.
        default: 0
      - name: credited_fee_cents_total
        type: integer
        source: computed
        description: Cumulative cents credited back on TestOrder cancellation or invalidation.
        default: 0

  - name: LabAccreditation
    parent: Laboratory
    common_fields: true
    fields:
      - name: laboratory_id
        type: string
        source: input
        description: "FK -> Laboratory.id; the accredited laboratory."
      - name: rule_id
        type: string
        source: input
        description: "FK -> ApplicableRule.id; the rule whose test_method_code this accreditation scopes."
      - name: test_method_code
        type: string
        source: computed
        description: Copied from ApplicableRule.test_method_code at creation; the accreditation scope key.
      - name: valid_from
        type: datetime
        source: input
        description: First instant of the accreditation coverage interval (inclusive).
      - name: valid_through
        type: datetime
        source: input
        description: Last instant of the accreditation coverage interval (inclusive).
      - name: accreditation_state
        type: enum
        source: system
        description: Lifecycle state of the accreditation record.
        default: ACCREDITED
        constraints: "one of {ACCREDITED, SUSPENDED, EXPIRED}"
      - name: suspension_reason
        type: string
        source: input
        description: Free-text reason recorded when the accreditation is suspended; null while ACCREDITED.
        default: null
      - name: fee_surcharge_basis_points
        type: integer
        source: input
        description: Surcharge in basis points applied to the base method fee when testing under this accreditation.
        default: 0
        constraints: ">= 0 and <= 5000"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> ProductCategory.id; the juvenile-product category that drives rule identification."
      - name: model_name
        type: string
        source: input
        description: Manufacturer model name of the children's product.
        constraints: "1..160 chars"
      - name: manufacture_site_code
        type: string
        source: input
        description: Code of the manufacturing site, printed inside the tracking label.
        constraints: "uppercase alnum, 2..12 chars"
      - name: projected_annual_units
        type: integer
        source: input
        description: Manufacturer's projected annual production volume, the input to the INITIAL variant of sample sizing.
        constraints: ">= 1"
      - name: testing_budget_cents
        type: integer
        source: input
        description: Ceiling on the cumulative outstanding laboratory invoice total this product may carry across its non-terminal TestOrder rows.
        default: 2000000
        constraints: ">= 0"
      - name: certification_state
        type: enum
        source: system
        description: Certification workflow state of the product.
        default: DRAFT
        constraints: "one of {DRAFT, SCOPED, EVIDENCE_RELIANCE, FULL_TEST_PROGRAM, EVIDENCE_COMPLETE, CERTIFIED, SUSPENDED, REMEDIATION, ARCHIVED}"
      - name: evidence_path
        type: enum
        source: input
        description: Branch chosen at submit-for-certification; decides which fork of the certification state machine the product enters.
        default: null
        constraints: "one of {COMPONENT_RELIANCE, FULL_PRODUCT_TEST}; null while certification_state is DRAFT"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gate over the product's evidence children; recomputed by calculation product_compliance_posture on every child mutation that touches evidence.
        default: UNSCOPED
        constraints: "one of {UNSCOPED, CLEARED, RESTRICTED, SUSPENDED}"
      - name: required_rule_ids
        type: array
        source: computed
        description: Ordered array of ApplicableRule ids produced by calculation applicable_rule_set_derivation; recomputed on scoping and on every ComponentPart mutation.
        default: []
      - name: risk_weighted_gap_score
        type: integer
        source: computed
        description: Integer 0..100 produced by calculation product_risk_weighted_gap_score; 0 means every required rule is covered by current evidence.
        default: 0
      - name: units_held
        type: integer
        source: computed
        description: Sum of ProductionBatch.quantity for this product's batches whose distribution_state is HELD.
        default: 0
      - name: units_released
        type: integer
        source: computed
        description: Sum of ProductionBatch.quantity for this product's batches whose distribution_state is RELEASED.
        default: 0
      - name: units_stopped
        type: integer
        source: computed
        description: Sum of ProductionBatch.quantity for this product's batches whose distribution_state is STOP_DISTRIBUTION.
        default: 0
      - name: units_destroyed
        type: integer
        source: computed
        description: Sum of ProductionBatch.quantity for this product's batches whose distribution_state is DESTROYED.
        default: 0
      - name: material_change_count
        type: integer
        source: computed
        description: Count of MaterialChangeEvent rows whose product_id is this product.
        default: 0

  - name: ComponentPart
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the finished product this part belongs to."
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier that manufactures the part."
      - name: part_name
        type: string
        source: input
        description: Descriptive part name as it appears in the bill of materials.
        constraints: "1..120 chars"
      - name: material_class
        type: enum
        source: input
        description: Material family of the part; the predicate input for CategoryRuleMapping.applicability_condition.
        constraints: "one of {PAINTED_COATING, PLASTICIZED_PLASTIC, ACCESSIBLE_METAL, TEXTILE, RIGID_UNPAINTED_PLASTIC}"
      - name: accessible_to_child
        type: boolean
        source: input
        description: Whether the part is accessible to a child during reasonably foreseeable use.
        default: true
      - name: small_part_when_detached
        type: boolean
        source: input
        description: Whether the part fits the small-parts cylinder when detached, triggering mechanical-hazard rules.
        default: false
      - name: reliance_status
        type: enum
        source: system
        description: Whether the certifier may currently rely on this part's supplier certificates.
        default: PENDING
        constraints: "one of {PENDING, VALID, SUPERSEDED}"
      - name: last_material_change_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent MaterialChangeEvent naming this part; null when none.
        default: null

  - name: ComponentPartCertificate
    parent: ComponentPart
    common_fields: true
    fields:
      - name: component_part_id
        type: string
        source: input
        description: "FK -> ComponentPart.id; the part the supplier certifies."
      - name: supplier_id
        type: string
        source: computed
        description: "FK -> Supplier.id; copied from ComponentPart.supplier_id at creation."
      - name: laboratory_id
        type: string
        source: input
        description: "FK -> Laboratory.id; the third-party laboratory that produced the underlying test data."
      - name: rule_id
        type: string
        source: input
        description: "FK -> ApplicableRule.id; the rule the part is certified against."
      - name: measured_value
        type: number
        source: input
        description: Measured result the supplier certifies for this rule, in ApplicableRule.limit_unit.
        constraints: ">= 0"
      - name: coverage_from
        type: datetime
        source: input
        description: First instant of the closed coverage interval this certificate attests to (inclusive).
      - name: coverage_through
        type: datetime
        source: input
        description: Last instant of the closed coverage interval this certificate attests to (inclusive).
      - name: reliance_state
        type: enum
        source: system
        description: Lifecycle state of the certifier's reliance on this certificate.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RELIED_UPON, REJECTED, RELIANCE_VOID}"
      - name: reliance_documentation_ref
        type: string
        source: input
        description: Identifier of the reliance documentation package recorded by the certifier; null while reliance_state is SUBMITTED.
        default: null
      - name: reliance_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationOfficer who recorded the reliance documentation; null until recorded.
        default: null

  - name: SamplingPlan
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product the plan samples."
      - name: plan_type
        type: enum
        source: input
        description: Which sample-sizing variant the plan uses.
        constraints: "one of {INITIAL, PERIODIC}"
      - name: baseline_units_produced
        type: integer
        source: input
        description: Units actually produced in the trailing periodic interval; the input to the PERIODIC variant of sample sizing. Required when plan_type is PERIODIC.
        default: 0
        constraints: ">= 0"
      - name: units_authorized
        type: integer
        source: computed
        description: Sample units this plan authorizes, produced by calculation sampling_plan_required_sample_size at creation and on every RESAMPLE_DUE re-entry.
        default: 0
      - name: units_committed
        type: integer
        source: computed
        description: Sum of TestOrder.sample_count for this plan's orders in states {SCHEDULED, IN_TESTING, REPORTED_PASS, REPORTED_FAIL}.
        default: 0
      - name: units_available
        type: integer
        source: computed
        description: units_authorized minus units_committed; the conserved-quantity complement asserted by invariant sample_unit_ledger.
        default: 0
      - name: plan_state
        type: enum
        source: system
        description: Lifecycle state of the sampling plan.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RESAMPLE_DUE, LAPSED, SUPERSEDED}"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant at which the plan became ACTIVE; null while DRAFT.
        default: null
      - name: last_verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent REPORTED_PASS TestOrder under this plan, else activated_at; the periodic clock baseline.
        default: null
      - name: periodic_due_at
        type: datetime
        source: computed
        description: Instant at which periodic verification becomes due, produced by calculation periodic_retest_due_date; null while DRAFT.
        default: null
      - name: resample_trigger
        type: enum
        source: system
        description: Why the plan most recently entered RESAMPLE_DUE.
        default: NONE
        constraints: "one of {NONE, PERIODIC_INTERVAL, MATERIAL_CHANGE, RELIANCE_VOID}"
      - name: resample_grace_days
        type: integer
        source: input
        description: Days after periodic_due_at before an unserviced RESAMPLE_DUE plan lapses.
        default: 30
        constraints: ">= 0 and <= 365"

  - name: TestOrder
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product being tested."
      - name: sampling_plan_id
        type: string
        source: input
        description: "FK -> SamplingPlan.id; the plan whose authorized units this order commits."
      - name: laboratory_id
        type: string
        source: input
        description: "FK -> Laboratory.id; the third-party laboratory performing the test."
      - name: rule_id
        type: string
        source: input
        description: "FK -> ApplicableRule.id; the rule under test."
      - name: sample_count
        type: integer
        source: input
        description: Number of sample units committed to this order.
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: First instant of the half-open laboratory testing window [window_start, window_end).
      - name: window_end
        type: datetime
        source: input
        description: Exclusive upper bound of the half-open laboratory testing window.
      - name: order_state
        type: enum
        source: system
        description: Lifecycle state of the test order.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_TESTING, REPORTED_PASS, REPORTED_FAIL, CANCELLED, INVALIDATED}"
      - name: ordered_by_user_id
        type: string
        source: system
        description: X-User-ID of the TestCoordinator that created the order; consumed by the segregation-of-duties check at certificate issuance.
      - name: is_retest
        type: boolean
        source: input
        description: Whether this order services a NoncomplianceCase retest round rather than an initial or periodic test.
        default: false
      - name: retest_case_id
        type: string
        source: input
        description: Identifier of the NoncomplianceCase this retest services; null when is_retest is false. Not a foreign key column — the authoritative link is NoncomplianceCase.active_retest_order_id.
        default: null
      - name: line_fee_cents
        type: integer
        source: computed
        description: Per-rule line fee produced by calculation lab_test_line_fee_cents at creation.
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: Order invoice total produced by calculation test_order_invoice_total_cents at creation.
        default: 0
      - name: expedite_requested
        type: boolean
        source: input
        description: Whether the coordinator requested expedited turnaround, an input to the invoice evaluation order.
        default: false
      - name: measured_value
        type: number
        source: system
        description: Measured result reported by the laboratory; null until the report is filed.
        default: null
      - name: result
        type: enum
        source: computed
        description: Pass/fail decision produced by calculation test_result_decision when the laboratory files its report.
        default: null
        constraints: "one of {PASS, FAIL}; null while order_state is in {SCHEDULED, IN_TESTING, CANCELLED, INVALIDATED}"
      - name: reported_at
        type: datetime
        source: system
        description: Logical-clock instant at which the laboratory filed the report; null until filed.
        default: null
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the LaboratoryUser that filed the report; null until filed.
        default: null

  - name: ChildrensProductCertificate
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the certified product."
      - name: supersedes_certificate_id
        type: string
        source: computed
        description: "FK -> ChildrensProductCertificate.id; self-referential link to the prior ISSUED certificate for the same product that this row supersedes; null when there was none."
        default: null
      - name: issuance_status
        type: enum
        source: system
        description: First independent state dimension — the issuance lifecycle of the certificate.
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, SUPERSEDED, WITHDRAWN, VOIDED}"
      - name: accompaniment_status
        type: enum
        source: system
        description: Second independent state dimension — whether the certificate accompanies outbound shipments; evolves independently of issuance_status.
        default: NOT_FURNISHED
        constraints: "one of {NOT_FURNISHED, FURNISHED, RECALLED_FROM_SHIPMENTS}"
      - name: certifier_legal_name
        type: string
        source: input
        description: Required certificate content — legal name of the certifying party.
        constraints: "1..160 chars"
      - name: certifier_contact_email
        type: string
        source: input
        description: Required certificate content — contact for the recordkeeper.
        constraints: "must contain '@', 5..160 chars"
      - name: manufacture_place
        type: string
        source: input
        description: Required certificate content — place of manufacture.
        constraints: "1..120 chars"
      - name: manufacture_date_month
        type: string
        source: input
        description: Required certificate content — date of manufacture as YYYY-MM.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: testing_place
        type: string
        source: input
        description: Required certificate content — place where the supporting testing occurred.
        constraints: "1..120 chars"
      - name: cited_rule_ids
        type: array
        source: computed
        description: Array of ApplicableRule ids the certificate cites; set at creation to the product's required_rule_ids snapshot.
        default: []
      - name: cited_evidence_count
        type: integer
        source: computed
        description: Number of distinct evidence rows (REPORTED_PASS TestOrder plus RELIED_UPON ComponentPartCertificate) backing cited_rule_ids at creation.
        default: 0
      - name: content_completeness_pct
        type: integer
        source: computed
        description: Integer 0..100 produced by calculation certificate_content_completeness; must equal 100 before issuance.
        default: 0
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationOfficer that issued the certificate; null while DRAFT.
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which issuance_status became ISSUED; null while DRAFT.
        default: null
      - name: expected_product_version_seen
        type: integer
        source: system
        description: The Product.version value the client supplied in expected_product_version when this certificate was created.

  - name: ProductionBatch
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product produced in this batch."
      - name: certificate_id
        type: string
        source: input
        description: "FK -> ChildrensProductCertificate.id; the certificate that must accompany shipments of this batch."
      - name: batch_code
        type: string
        source: input
        description: Production batch identifier printed in the tracking label.
        constraints: "matches ^[A-Z0-9]{3,10}-[0-9]{6}$"
      - name: produced_on
        type: datetime
        source: input
        description: Logical instant of production completion; must fall inside the certificate's coverage.
      - name: quantity
        type: integer
        source: input
        description: Units produced in this batch; the conserved quantity of invariant distribution_unit_ledger.
        constraints: ">= 1"
      - name: label_on_product
        type: boolean
        source: input
        description: Whether the permanent tracking label is affixed to the product itself.
        default: false
      - name: label_on_packaging
        type: boolean
        source: input
        description: Whether the tracking label is printed on the packaging.
        default: false
      - name: label_batch_code_printed
        type: boolean
        source: input
        description: Whether the batch_code itself appears in the tracking label text.
        default: false
      - name: tracking_label_compliant
        type: boolean
        source: computed
        description: Produced by calculation tracking_label_compliance_flag; gates release.
        default: false
      - name: distribution_state
        type: enum
        source: system
        description: Distribution lifecycle state of the batch.
        default: HELD
        constraints: "one of {HELD, RELEASED, STOP_DISTRIBUTION, DESTROYED}"
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent transition into RELEASED; null while never released.
        default: null
      - name: release_rescind_count
        type: integer
        source: system
        description: Number of times a release of this batch has been rescinded back to HELD.
        default: 0

  - name: NoncomplianceCase
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: system
        description: "FK -> Product.id; the product whose evidence failed."
      - name: triggering_test_order_id
        type: string
        source: system
        description: "FK -> TestOrder.id; the REPORTED_FAIL order that opened the case."
      - name: failed_rule_id
        type: string
        source: system
        description: "FK -> ApplicableRule.id; copied from the triggering order's rule_id."
      - name: case_state
        type: enum
        source: system
        description: Lifecycle state of the noncompliance response.
        default: OPEN
        constraints: "one of {OPEN, STOP_DISTRIBUTION_ISSUED, RETEST_ORDERED, RETEST_FAILED, RETEST_PASSED, CORRECTIVE_ACTION_APPROVED, CLOSED, ESCALATED_RECALL}"
      - name: retest_round_count
        type: integer
        source: system
        description: Number of retest rounds ordered so far; the threshold input for escalation.
        default: 0
      - name: active_retest_order_id
        type: string
        source: system
        description: "FK -> TestOrder.id; the retest order currently servicing this case; null when no retest is outstanding."
        default: null
      - name: scope_variant
        type: enum
        source: system
        description: Which corrective-scope variant the case uses; set when the stop-distribution order is issued.
        default: BATCH_SCOPED
        constraints: "one of {BATCH_SCOPED, LOT_TRACEBACK}"
      - name: scope_units
        type: integer
        source: computed
        description: Units inside the corrective scope, produced by calculation noncompliance_corrective_scope_units.
        default: 0
      - name: corrective_action_ref
        type: string
        source: input
        description: Identifier of the approved corrective action plan; null until approved.
        default: null
      - name: corrective_action_revision
        type: integer
        source: system
        description: Number of corrective action plans recorded against this case; each new plan supersedes the prior one.
        default: 0
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose report filing opened the case; may not be the actor that closes it.
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationOfficer that closed the case; null until CLOSED.
        default: null

  - name: MaterialChangeEvent
    parent: Product
    common_fields: false
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product affected by the material change."
      - name: component_part_id
        type: string
        source: input
        description: "FK -> ComponentPart.id; the part that changed. Required when subject_type is COMPONENT_PART, null when subject_type is PRODUCT."
        default: null
      - name: subject_type
        type: enum
        source: input
        description: Polymorphic subject discriminator for the change.
        constraints: "one of {PRODUCT, COMPONENT_PART}"
      - name: change_kind
        type: enum
        source: input
        description: Nature of the material change.
        constraints: "one of {SUPPLIER_SWITCH, MATERIAL_SUBSTITUTION, COATING_CHANGE, DESIGN_GEOMETRY_CHANGE, PACKAGING_ONLY}"
      - name: description
        type: string
        source: input
        description: Narrative of the change recorded for the audit file.
        constraints: "1..400 chars"
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant at which the event was recorded.
      - name: triggers_resample
        type: boolean
        source: computed
        description: Produced by calculation material_change_resample_decision; PACKAGING_ONLY changes do not trigger resampling.
        default: false
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that recorded the event.

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # ---------------------------------------------------------------------------
  # Product — fork/join on evidence_path, plus a remediation cycle
  #   DRAFT -> SCOPED -> {EVIDENCE_RELIANCE | FULL_TEST_PROGRAM} -> EVIDENCE_COMPLETE
  #   -> CERTIFIED -> SUSPENDED -> REMEDIATION -> EVIDENCE_COMPLETE (cycle)
  # ---------------------------------------------------------------------------
  - entity: Product
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:

      - from: DRAFT
        to: SCOPED
        trigger: "POST /compliance/products/{product_id}/submit-for-certification"
        actor: TestCoordinator
        preconditions:
          - "product.certification_state == DRAFT"
          - "at least one ComponentPart row exists with product_id == product.id"
          - "calculation applicable_rule_set_derivation yields a non-empty rule set"
        side_effects:
          - "sets Product.evidence_path to the submitted evidence_path value"
          - "recomputes Product.required_rule_ids via calculation applicable_rule_set_derivation"
          - "recomputes Product.risk_weighted_gap_score via calculation product_risk_weighted_gap_score"
          - "recomputes Product.compliance_posture via calculation product_compliance_posture (UNSCOPED -> RESTRICTED while gap score > 0)"
          - "increments Product.version by 1"
        note: "The fork point. The submitted evidence_path decides which of the two successor states the next system transition enters."

      - from: SCOPED
        to: EVIDENCE_RELIANCE
        trigger: "system event: immediately after SCOPED when Product.evidence_path == COMPONENT_RELIANCE"
        actor: system
        preconditions:
          - "product.evidence_path == COMPONENT_RELIANCE"
          - "every rule id in Product.required_rule_ids has ApplicableRule.component_reliance_allowed == true"
        side_effects:
          - "sets ComponentPart.reliance_status from PENDING to VALID for every ComponentPart row with product_id == product.id"
          - "increments Product.version by 1"
        note: "Reliance branch side-effect set: parts become relianceable; no laboratory fee is billed on this branch."

      - from: SCOPED
        to: FULL_TEST_PROGRAM
        trigger: "system event: immediately after SCOPED when Product.evidence_path == FULL_PRODUCT_TEST"
        actor: system
        preconditions:
          - "product.evidence_path == FULL_PRODUCT_TEST"
        side_effects:
          - "leaves every ComponentPart.reliance_status at PENDING"
          - "increments Product.version by 1"
        note: "Test branch side-effect set: parts are NOT made relianceable, so finished-product TestOrder evidence is the only admissible evidence. Divergent from the reliance branch."

      - from: EVIDENCE_RELIANCE
        to: EVIDENCE_COMPLETE
        trigger: "system event: on ComponentPartCertificate reliance recording, when calculation product_risk_weighted_gap_score returns 0"
        actor: system
        preconditions:
          - "product.certification_state == EVIDENCE_RELIANCE"
          - "risk_weighted_gap_score computed over current evidence == 0"
        side_effects:
          - "sets Product.compliance_posture to CLEARED"
          - "increments Product.version by 1"

      - from: FULL_TEST_PROGRAM
        to: EVIDENCE_COMPLETE
        trigger: "system event: on TestOrder report filing, when calculation product_risk_weighted_gap_score returns 0"
        actor: system
        preconditions:
          - "product.certification_state == FULL_TEST_PROGRAM"
          - "risk_weighted_gap_score computed over current evidence == 0"
        side_effects:
          - "sets Product.compliance_posture to CLEARED"
          - "increments Product.version by 1"
        note: "The join point. Both branches converge here, but only after their branch-specific evidence kinds are counted by product_risk_weighted_gap_score."

      - from: EVIDENCE_COMPLETE
        to: CERTIFIED
        trigger: "POST /compliance/certificates/{certificate_id}/issue"
        actor: CertificationOfficer
        preconditions:
          - "product.certification_state == EVIDENCE_COMPLETE"
          - "product.compliance_posture == CLEARED"
        side_effects:
          - "increments Product.version by 1"

      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system event: cascade hop 2 of failed_test_stop_distribution_cascade, caused by a TestOrder entering REPORTED_FAIL"
        actor: system
        preconditions:
          - "product.certification_state == CERTIFIED"
          - "the failing TestOrder.rule_id is a member of Product.required_rule_ids"
        side_effects:
          - "sets Product.compliance_posture to SUSPENDED"
          - "recomputes Product.risk_weighted_gap_score"
          - "cascade hop 3: every ChildrensProductCertificate with product_id == product.id and issuance_status == ISSUED transitions to WITHDRAWN"
          - "increments Product.version by 1"

      - from: EVIDENCE_COMPLETE
        to: SUSPENDED
        trigger: "system event: cascade hop 2 of failed_test_stop_distribution_cascade, caused by a TestOrder entering REPORTED_FAIL"
        actor: system
        preconditions:
          - "product.certification_state == EVIDENCE_COMPLETE"
          - "the failing TestOrder.rule_id is a member of Product.required_rule_ids"
        side_effects:
          - "sets Product.compliance_posture to SUSPENDED"
          - "recomputes Product.risk_weighted_gap_score"
          - "increments Product.version by 1"

      - from: SUSPENDED
        to: REMEDIATION
        trigger: "POST /compliance/noncompliance-cases/{case_id}/order-retest"
        actor: TestCoordinator
        preconditions:
          - "product.certification_state == SUSPENDED"
          - "the case's product_id == product.id"
        side_effects:
          - "sets Product.compliance_posture to RESTRICTED"
          - "increments Product.version by 1"

      - from: REMEDIATION
        to: EVIDENCE_COMPLETE
        trigger: "POST /compliance/noncompliance-cases/{case_id}/close"
        actor: CertificationOfficer
        preconditions:
          - "product.certification_state == REMEDIATION"
          - "case.case_state == CORRECTIVE_ACTION_APPROVED"
          - "risk_weighted_gap_score computed over current evidence == 0"
        side_effects:
          - "sets Product.compliance_posture to CLEARED"
          - "increments Product.version by 1"
        note: "Closes the remediation cycle: the product can be re-certified without re-entering DRAFT."

      - from: CERTIFIED
        to: ARCHIVED
        trigger: "POST /compliance/products/{product_id}/archive"
        actor: ComplianceAdministrator
        preconditions:
          - "product.certification_state == CERTIFIED"
          - "no ProductionBatch with product_id == product.id has distribution_state in {RELEASED, STOP_DISTRIBUTION}"
        side_effects:
          - "sets Product.compliance_posture to UNSCOPED"
          - "sets every SamplingPlan with product_id == product.id and plan_state in {DRAFT, ACTIVE, RESAMPLE_DUE} to SUPERSEDED"
          - "increments Product.version by 1"

  # ---------------------------------------------------------------------------
  # TestOrder — branching on the reported result
  # ---------------------------------------------------------------------------
  - entity: TestOrder
    initial_state: SCHEDULED
    terminal_states: [REPORTED_PASS, REPORTED_FAIL, CANCELLED, INVALIDATED]
    transitions:

      - from: SCHEDULED
        to: IN_TESTING
        trigger: "POST /compliance/test-orders/{order_id}/start-testing"
        actor: LaboratoryUser
        preconditions:
          - "order.order_state == SCHEDULED"
          - "laboratory.operational_state == ACTIVE"
          - "laboratory.influence_attestation_state == CURRENT"
          - "a LabAccreditation row exists with laboratory_id == order.laboratory_id, test_method_code == the order rule's test_method_code, accreditation_state == ACCREDITED, and coverage interval containing the logical clock"
          - "X-User-ID == order.laboratory_id"
        side_effects:
          - "adds TestOrder.invoice_total_cents to Laboratory.billed_fee_cents_total"
          - "increments Laboratory.version by 1"

      - from: IN_TESTING
        to: REPORTED_PASS
        trigger: "POST /compliance/test-orders/{order_id}/report-result"
        actor: LaboratoryUser
        preconditions:
          - "order.order_state == IN_TESTING"
          - "X-User-ID == order.laboratory_id"
          - "calculation test_result_decision returns PASS for the submitted measured_value"
        side_effects:
          - "sets TestOrder.result to PASS, measured_value, reported_at, reported_by_user_id"
          - "sets SamplingPlan.last_verified_at to the logical clock and recomputes SamplingPlan.periodic_due_at"
          - "recomputes Product.risk_weighted_gap_score and Product.compliance_posture"
          - "when the product is in FULL_TEST_PROGRAM and the recomputed gap score is 0, the product transitions FULL_TEST_PROGRAM -> EVIDENCE_COMPLETE"
          - "when order.is_retest is true, the servicing NoncomplianceCase transitions RETEST_ORDERED -> RETEST_PASSED"
          - "increments SamplingPlan.version and Product.version by 1 each"

      - from: IN_TESTING
        to: REPORTED_FAIL
        trigger: "POST /compliance/test-orders/{order_id}/report-result"
        actor: LaboratoryUser
        preconditions:
          - "order.order_state == IN_TESTING"
          - "X-User-ID == order.laboratory_id"
          - "calculation test_result_decision returns FAIL for the submitted measured_value"
        side_effects:
          - "sets TestOrder.result to FAIL, measured_value, reported_at, reported_by_user_id"
          - "cascade hop 1: when order.is_retest is false, creates a NoncomplianceCase in OPEN with product_id, triggering_test_order_id, failed_rule_id and opened_by_user_id set from this order and actor"
          - "cascade hop 1 (retest form): when order.is_retest is true, the servicing NoncomplianceCase transitions RETEST_ORDERED -> RETEST_FAILED instead of a new case being created"
          - "cascade hop 2: caused by this order entering REPORTED_FAIL, the Product transitions CERTIFIED -> SUSPENDED or EVIDENCE_COMPLETE -> SUSPENDED"
          - "recomputes Product.risk_weighted_gap_score"
          - "increments Product.version by 1"
        note: "Divergent branch side-effect set from REPORTED_PASS: this branch opens a case and starts the four-hop stop-distribution cascade; the PASS branch resets the periodic clock instead."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /compliance/test-orders/{order_id}/cancel"
        actor: TestCoordinator
        preconditions:
          - "order.order_state == SCHEDULED"
        side_effects:
          - "releases order.sample_count from SamplingPlan.units_committed and adds it back to SamplingPlan.units_available"
          - "increments SamplingPlan.version by 1"
        note: "Compensating half of invariant sample_unit_ledger. No laboratory credit is issued because nothing was billed before IN_TESTING."

      - from: IN_TESTING
        to: CANCELLED
        trigger: "POST /compliance/test-orders/{order_id}/cancel"
        actor: TestCoordinator
        preconditions:
          - "order.order_state == IN_TESTING"
        side_effects:
          - "releases order.sample_count from SamplingPlan.units_committed and adds it back to SamplingPlan.units_available"
          - "adds TestOrder.invoice_total_cents to Laboratory.credited_fee_cents_total"
          - "increments SamplingPlan.version and Laboratory.version by 1 each"
        note: "Compensating half of both invariant sample_unit_ledger and invariant laboratory_fee_ledger."

      - from: SCHEDULED
        to: INVALIDATED
        trigger: "system event: cascade hop 2 of accreditation_suspension_cascade, caused by a LabAccreditation entering SUSPENDED"
        actor: system
        preconditions:
          - "order.order_state == SCHEDULED"
          - "order.laboratory_id == the suspended accreditation's laboratory_id"
          - "the order rule's test_method_code == the suspended accreditation's test_method_code"
        side_effects:
          - "releases order.sample_count from SamplingPlan.units_committed and adds it back to SamplingPlan.units_available"
          - "cascade hop 3: caused by this order entering INVALIDATED, the SamplingPlan transitions ACTIVE -> RESAMPLE_DUE with resample_trigger RELIANCE_VOID"
          - "increments SamplingPlan.version by 1"

      - from: IN_TESTING
        to: INVALIDATED
        trigger: "system event: cascade hop 2 of accreditation_suspension_cascade, caused by a LabAccreditation entering SUSPENDED"
        actor: system
        preconditions:
          - "order.order_state == IN_TESTING"
          - "order.laboratory_id == the suspended accreditation's laboratory_id"
          - "the order rule's test_method_code == the suspended accreditation's test_method_code"
        side_effects:
          - "releases order.sample_count from SamplingPlan.units_committed and adds it back to SamplingPlan.units_available"
          - "adds TestOrder.invoice_total_cents to Laboratory.credited_fee_cents_total"
          - "cascade hop 3: caused by this order entering INVALIDATED, the SamplingPlan transitions ACTIVE -> RESAMPLE_DUE with resample_trigger RELIANCE_VOID"
          - "increments SamplingPlan.version and Laboratory.version by 1 each"

  # ---------------------------------------------------------------------------
  # ChildrensProductCertificate — PARALLEL state dimensions on one row:
  #   issuance_status      : DRAFT -> ISSUED -> {SUPERSEDED | WITHDRAWN}; DRAFT -> VOIDED
  #   accompaniment_status : NOT_FURNISHED -> FURNISHED -> RECALLED_FROM_SHIPMENTS
  # The two axes advance independently; no transition on one axis constrains the
  # other except where a precondition says so explicitly.
  # ---------------------------------------------------------------------------
  - entity: ChildrensProductCertificate
    initial_state: "issuance_status=DRAFT and accompaniment_status=NOT_FURNISHED"
    terminal_states: [SUPERSEDED, WITHDRAWN, VOIDED, RECALLED_FROM_SHIPMENTS]
    transitions:

      - from: DRAFT
        to: ISSUED
        dimension: issuance_status
        trigger: "POST /compliance/certificates/{certificate_id}/issue"
        actor: CertificationOfficer
        preconditions:
          - "certificate.issuance_status == DRAFT"
          - "certificate.content_completeness_pct == 100"
          - "product.compliance_posture == CLEARED"
          - "product.certification_state == EVIDENCE_COMPLETE"
          - "X-User-ID differs from TestOrder.ordered_by_user_id for every TestOrder cited as evidence by this certificate"
        side_effects:
          - "sets ChildrensProductCertificate.issued_by_user_id and issued_at"
          - "when certificate.supersedes_certificate_id is non-null, that prior certificate transitions ISSUED -> SUPERSEDED on the issuance axis"
          - "the Product transitions EVIDENCE_COMPLETE -> CERTIFIED"
          - "increments ChildrensProductCertificate.version and Product.version by 1 each"
        note: "Leaves accompaniment_status untouched at NOT_FURNISHED — the axes are independent."

      - from: DRAFT
        to: VOIDED
        dimension: issuance_status
        trigger: "POST /compliance/certificates/{certificate_id}/void"
        actor: CertificationOfficer
        preconditions:
          - "certificate.issuance_status == DRAFT"
        side_effects:
          - "no Product state change; the product stays in EVIDENCE_COMPLETE"
          - "increments ChildrensProductCertificate.version by 1"

      - from: ISSUED
        to: SUPERSEDED
        dimension: issuance_status
        trigger: "system event: a newer certificate for the same product is issued and names this row in supersedes_certificate_id"
        actor: system
        preconditions:
          - "certificate.issuance_status == ISSUED"
        side_effects:
          - "sets accompaniment_status to RECALLED_FROM_SHIPMENTS when accompaniment_status == FURNISHED at that moment"
          - "increments ChildrensProductCertificate.version by 1"

      - from: ISSUED
        to: WITHDRAWN
        dimension: issuance_status
        trigger: "system event: cascade hop 3 of failed_test_stop_distribution_cascade, caused by the Product entering SUSPENDED"
        actor: system
        preconditions:
          - "certificate.issuance_status == ISSUED"
          - "certificate.product_id == the suspended product's id"
        side_effects:
          - "cascade hop 4: caused by this certificate entering WITHDRAWN, every ProductionBatch with certificate_id == certificate.id and distribution_state == RELEASED transitions RELEASED -> STOP_DISTRIBUTION"
          - "increments ChildrensProductCertificate.version by 1"

      - from: NOT_FURNISHED
        to: FURNISHED
        dimension: accompaniment_status
        trigger: "POST /compliance/certificates/{certificate_id}/furnish"
        actor: DistributionManager
        preconditions:
          - "certificate.issuance_status == ISSUED"
          - "certificate.accompaniment_status == NOT_FURNISHED"
        side_effects:
          - "increments ChildrensProductCertificate.version by 1"
        note: "The only cross-axis coupling: furnishing requires the issuance axis to have reached ISSUED."

      - from: FURNISHED
        to: RECALLED_FROM_SHIPMENTS
        dimension: accompaniment_status
        trigger: "POST /compliance/certificates/{certificate_id}/recall-accompaniment"
        actor: DistributionManager
        preconditions:
          - "certificate.accompaniment_status == FURNISHED"
        side_effects:
          - "leaves issuance_status unchanged; an ISSUED certificate stays ISSUED"
          - "increments ChildrensProductCertificate.version by 1"

  # ---------------------------------------------------------------------------
  # NoncomplianceCase — CYCLIC retest loop
  #   RETEST_ORDERED -> RETEST_FAILED -> RETEST_ORDERED (repeat)
  #   escapes to ESCALATED_RECALL once retest_round_count reaches MAX_RETEST_ROUNDS
  # ---------------------------------------------------------------------------
  - entity: NoncomplianceCase
    initial_state: OPEN
    terminal_states: [CLOSED, ESCALATED_RECALL]
    transitions:

      - from: OPEN
        to: STOP_DISTRIBUTION_ISSUED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution"
        actor: DistributionManager
        preconditions:
          - "case.case_state == OPEN"
          - "the case's product has at least one ProductionBatch with distribution_state in {HELD, RELEASED}"
        side_effects:
          - "sets NoncomplianceCase.scope_variant to the submitted scope_variant"
          - "recomputes NoncomplianceCase.scope_units via calculation noncompliance_corrective_scope_units"
          - "transitions every in-scope ProductionBatch to STOP_DISTRIBUTION"
          - "recomputes Product.units_held, units_released and units_stopped"
          - "increments NoncomplianceCase.version and Product.version by 1 each"

      - from: STOP_DISTRIBUTION_ISSUED
        to: RETEST_ORDERED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/order-retest"
        actor: TestCoordinator
        preconditions:
          - "case.case_state == STOP_DISTRIBUTION_ISSUED"
          - "case.retest_round_count < MAX_RETEST_ROUNDS"
          - "the referenced SamplingPlan has units_available >= the submitted sample_count"
        side_effects:
          - "creates a TestOrder in SCHEDULED with is_retest true, retest_case_id == case.id and rule_id == case.failed_rule_id"
          - "sets NoncomplianceCase.active_retest_order_id to the new order id"
          - "increments NoncomplianceCase.retest_round_count by 1"
          - "commits sample_count to SamplingPlan.units_committed and deducts it from units_available"
          - "the Product transitions SUSPENDED -> REMEDIATION"
          - "increments NoncomplianceCase.version, SamplingPlan.version and Product.version by 1 each"

      - from: RETEST_ORDERED
        to: RETEST_FAILED
        trigger: "system event: the active retest TestOrder enters REPORTED_FAIL"
        actor: system
        preconditions:
          - "case.case_state == RETEST_ORDERED"
          - "the reporting order id == case.active_retest_order_id"
        side_effects:
          - "clears NoncomplianceCase.active_retest_order_id to null"
          - "increments NoncomplianceCase.version by 1"

      - from: RETEST_FAILED
        to: RETEST_ORDERED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/order-retest"
        actor: TestCoordinator
        preconditions:
          - "case.case_state == RETEST_FAILED"
          - "case.retest_round_count < MAX_RETEST_ROUNDS"
          - "the referenced SamplingPlan has units_available >= the submitted sample_count"
        side_effects:
          - "creates another retest TestOrder in SCHEDULED and sets active_retest_order_id"
          - "increments NoncomplianceCase.retest_round_count by 1"
          - "commits sample_count to SamplingPlan.units_committed and deducts it from units_available"
          - "increments NoncomplianceCase.version and SamplingPlan.version by 1 each"
        note: "The cycle edge. Rounds accumulate on retest_round_count; the Product stays in REMEDIATION across loop iterations."

      - from: RETEST_FAILED
        to: ESCALATED_RECALL
        trigger: "POST /compliance/noncompliance-cases/{case_id}/order-retest"
        actor: TestCoordinator
        preconditions:
          - "case.case_state == RETEST_FAILED"
          - "case.retest_round_count >= MAX_RETEST_ROUNDS"
        side_effects:
          - "sets NoncomplianceCase.scope_variant to LOT_TRACEBACK and recomputes scope_units"
          - "transitions every ProductionBatch for the product with distribution_state in {HELD, RELEASED, STOP_DISTRIBUTION} to DESTROYED"
          - "recomputes Product.units_held, units_released, units_stopped and units_destroyed"
          - "increments NoncomplianceCase.version and Product.version by 1 each"
        note: "Loop-termination edge: the same endpoint that continues the cycle terminates it once the round threshold is reached."

      - from: RETEST_ORDERED
        to: RETEST_PASSED
        trigger: "system event: the active retest TestOrder enters REPORTED_PASS"
        actor: system
        preconditions:
          - "case.case_state == RETEST_ORDERED"
          - "the reporting order id == case.active_retest_order_id"
        side_effects:
          - "clears NoncomplianceCase.active_retest_order_id to null"
          - "increments NoncomplianceCase.version by 1"

      - from: RETEST_PASSED
        to: CORRECTIVE_ACTION_APPROVED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/corrective-actions"
        actor: CertificationOfficer
        preconditions:
          - "case.case_state == RETEST_PASSED"
          - "the submitted expected_case_version equals case.version"
        side_effects:
          - "sets NoncomplianceCase.corrective_action_ref to the submitted reference"
          - "increments NoncomplianceCase.corrective_action_revision by 1"
          - "increments NoncomplianceCase.version by 1"

      - from: CORRECTIVE_ACTION_APPROVED
        to: CORRECTIVE_ACTION_APPROVED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/corrective-actions"
        actor: CertificationOfficer
        preconditions:
          - "case.case_state == CORRECTIVE_ACTION_APPROVED"
          - "the submitted expected_case_version equals case.version"
        side_effects:
          - "replaces NoncomplianceCase.corrective_action_ref with the submitted reference, superseding the prior plan"
          - "increments NoncomplianceCase.corrective_action_revision by 1"
          - "increments NoncomplianceCase.version by 1"
        note: "Self-loop; the OCC guard corrective-action-supersede governs it."

      - from: CORRECTIVE_ACTION_APPROVED
        to: CLOSED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/close"
        actor: CertificationOfficer
        preconditions:
          - "case.case_state == CORRECTIVE_ACTION_APPROVED"
          - "X-User-ID != case.opened_by_user_id"
          - "every ProductionBatch for the product with distribution_state == STOP_DISTRIBUTION has tracking_label_compliant == true"
        side_effects:
          - "sets NoncomplianceCase.closed_by_user_id"
          - "transitions every ProductionBatch for the product from STOP_DISTRIBUTION back to HELD"
          - "recomputes Product.units_held and units_stopped"
          - "the Product transitions REMEDIATION -> EVIDENCE_COMPLETE"
          - "increments NoncomplianceCase.version and Product.version by 1 each"

  # ---------------------------------------------------------------------------
  # SamplingPlan — CYCLIC: ACTIVE -> RESAMPLE_DUE -> ACTIVE
  # ---------------------------------------------------------------------------
  - entity: SamplingPlan
    initial_state: DRAFT
    terminal_states: [LAPSED, SUPERSEDED]
    transitions:

      - from: DRAFT
        to: ACTIVE
        trigger: "POST /compliance/sampling-plans/{plan_id}/activate"
        actor: TestCoordinator
        preconditions:
          - "plan.plan_state == DRAFT"
          - "product.certification_state in {SCOPED, EVIDENCE_RELIANCE, FULL_TEST_PROGRAM, EVIDENCE_COMPLETE, CERTIFIED, REMEDIATION}"
          - "plan.units_authorized >= the product category's sampling_floor_units"
        side_effects:
          - "sets SamplingPlan.activated_at and last_verified_at to the logical clock"
          - "recomputes SamplingPlan.periodic_due_at via calculation periodic_retest_due_date"
          - "sets any other SamplingPlan for the same product_id and plan_type whose plan_state is in {DRAFT, ACTIVE, RESAMPLE_DUE} to SUPERSEDED"
          - "increments SamplingPlan.version by 1"

      - from: ACTIVE
        to: RESAMPLE_DUE
        trigger: "POST /compliance/sampling-plans/{plan_id}/periodic-review"
        actor: TestCoordinator
        preconditions:
          - "plan.plan_state == ACTIVE"
          - "logical clock >= plan.periodic_due_at (inclusive boundary)"
        side_effects:
          - "sets SamplingPlan.resample_trigger to PERIODIC_INTERVAL"
          - "recomputes SamplingPlan.units_authorized via calculation sampling_plan_required_sample_size and refreshes units_available"
          - "sets Product.compliance_posture to RESTRICTED"
          - "increments SamplingPlan.version and Product.version by 1 each"

      - from: ACTIVE
        to: RESAMPLE_DUE
        trigger: "system event: cascade hop 3 of material_change_resample_cascade, caused by a ComponentPartCertificate entering RELIANCE_VOID"
        actor: system
        preconditions:
          - "plan.plan_state == ACTIVE"
          - "the voided certificate's component part has product_id == plan.product_id"
        side_effects:
          - "sets SamplingPlan.resample_trigger to RELIANCE_VOID"
          - "sets SamplingPlan.periodic_due_at to the logical clock"
          - "recomputes SamplingPlan.units_authorized via calculation sampling_plan_required_sample_size"
          - "cascade hop 4: caused by this plan entering RESAMPLE_DUE, Product.compliance_posture is recomputed to RESTRICTED and Product.risk_weighted_gap_score is recomputed"
          - "increments SamplingPlan.version and Product.version by 1 each"

      - from: RESAMPLE_DUE
        to: ACTIVE
        trigger: "system event: a TestOrder under this plan enters REPORTED_PASS"
        actor: system
        preconditions:
          - "plan.plan_state == RESAMPLE_DUE"
          - "the passing order's sampling_plan_id == plan.id"
        side_effects:
          - "sets SamplingPlan.resample_trigger to NONE"
          - "sets SamplingPlan.last_verified_at to the logical clock and recomputes periodic_due_at"
          - "increments SamplingPlan.version by 1"
        note: "The cycle edge — a plan can pass through RESAMPLE_DUE any number of times."

      - from: RESAMPLE_DUE
        to: LAPSED
        trigger: "POST /compliance/sampling-plans/{plan_id}/periodic-review"
        actor: TestCoordinator
        preconditions:
          - "plan.plan_state == RESAMPLE_DUE"
          - "logical clock > plan.periodic_due_at plus plan.resample_grace_days days"
        side_effects:
          - "sets Product.compliance_posture to SUSPENDED"
          - "increments SamplingPlan.version and Product.version by 1 each"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: a newer SamplingPlan for the same product_id and plan_type is activated"
        actor: system
        preconditions:
          - "plan.plan_state == ACTIVE"
        side_effects:
          - "cancels no orders; existing TestOrder rows keep their committed units against the superseded plan"
          - "increments SamplingPlan.version by 1"

  # ---------------------------------------------------------------------------
  # ProductionBatch — CYCLIC: RELEASED -> STOP_DISTRIBUTION -> HELD -> RELEASED
  # ---------------------------------------------------------------------------
  - entity: ProductionBatch
    initial_state: HELD
    terminal_states: [DESTROYED]
    transitions:

      - from: HELD
        to: RELEASED
        trigger: "POST /compliance/production-batches/{batch_id}/release"
        actor: DistributionManager
        preconditions:
          - "batch.distribution_state == HELD"
          - "batch.tracking_label_compliant == true"
          - "the referenced certificate has issuance_status == ISSUED"
          - "the referenced certificate has accompaniment_status == FURNISHED"
          - "product.compliance_posture == CLEARED"
        side_effects:
          - "sets ProductionBatch.released_at to the logical clock"
          - "moves batch.quantity from Product.units_held to Product.units_released"
          - "increments ProductionBatch.version and Product.version by 1 each"

      - from: RELEASED
        to: HELD
        trigger: "POST /compliance/production-batches/{batch_id}/rescind-release"
        actor: DistributionManager
        preconditions:
          - "batch.distribution_state == RELEASED"
        side_effects:
          - "moves batch.quantity from Product.units_released back to Product.units_held"
          - "increments ProductionBatch.release_rescind_count by 1"
          - "increments ProductionBatch.version and Product.version by 1 each"
        note: "Compensating half of invariant distribution_unit_ledger."

      - from: RELEASED
        to: STOP_DISTRIBUTION
        trigger: "system event: cascade hop 4 of failed_test_stop_distribution_cascade, caused by the certificate entering WITHDRAWN; also the direct effect of POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution"
        actor: system
        preconditions:
          - "batch.distribution_state == RELEASED"
          - "batch.certificate_id == the withdrawn certificate's id, or the batch is inside the case's corrective scope"
        side_effects:
          - "moves batch.quantity from Product.units_released to Product.units_stopped"
          - "increments ProductionBatch.version and Product.version by 1 each"

      - from: HELD
        to: STOP_DISTRIBUTION
        trigger: "POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution"
        actor: DistributionManager
        preconditions:
          - "batch.distribution_state == HELD"
          - "the batch is inside the case's corrective scope per calculation noncompliance_corrective_scope_units"
        side_effects:
          - "moves batch.quantity from Product.units_held to Product.units_stopped"
          - "increments ProductionBatch.version and Product.version by 1 each"

      - from: STOP_DISTRIBUTION
        to: HELD
        trigger: "POST /compliance/noncompliance-cases/{case_id}/close"
        actor: CertificationOfficer
        preconditions:
          - "batch.distribution_state == STOP_DISTRIBUTION"
          - "batch.tracking_label_compliant == true"
        side_effects:
          - "moves batch.quantity from Product.units_stopped back to Product.units_held"
          - "increments ProductionBatch.version and Product.version by 1 each"
        note: "The cycle edge — a batch may be stopped and reinstated repeatedly."

      - from: STOP_DISTRIBUTION
        to: DESTROYED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/order-retest (escalation edge to ESCALATED_RECALL)"
        actor: system
        preconditions:
          - "batch.distribution_state == STOP_DISTRIBUTION"
          - "case.retest_round_count >= MAX_RETEST_ROUNDS"
        side_effects:
          - "moves batch.quantity from Product.units_stopped to Product.units_destroyed"
          - "increments ProductionBatch.version and Product.version by 1 each"

      - from: HELD
        to: DESTROYED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/order-retest (escalation edge to ESCALATED_RECALL)"
        actor: system
        preconditions:
          - "batch.distribution_state == HELD"
          - "case.retest_round_count >= MAX_RETEST_ROUNDS"
        side_effects:
          - "moves batch.quantity from Product.units_held to Product.units_destroyed"
          - "increments ProductionBatch.version and Product.version by 1 each"

      - from: RELEASED
        to: DESTROYED
        trigger: "POST /compliance/noncompliance-cases/{case_id}/order-retest (escalation edge to ESCALATED_RECALL)"
        actor: system
        preconditions:
          - "batch.distribution_state == RELEASED"
          - "case.retest_round_count >= MAX_RETEST_ROUNDS"
        side_effects:
          - "moves batch.quantity from Product.units_released to Product.units_destroyed"
          - "increments ProductionBatch.version and Product.version by 1 each"

  # ---------------------------------------------------------------------------
  # LabAccreditation — linear with a system expiry edge
  # ---------------------------------------------------------------------------
  - entity: LabAccreditation
    initial_state: ACCREDITED
    terminal_states: [SUSPENDED, EXPIRED]
    transitions:

      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /compliance/lab-accreditations/{accreditation_id}/suspend"
        actor: ComplianceAdministrator
        preconditions:
          - "accreditation.accreditation_state == ACCREDITED"
        side_effects:
          - "sets LabAccreditation.suspension_reason to the submitted reason"
          - "cascade hop 1: caused by this accreditation entering SUSPENDED, every TestOrder with the same laboratory_id whose rule shares this test_method_code and whose order_state is in {SCHEDULED, IN_TESTING} transitions to INVALIDATED"
          - "increments LabAccreditation.version by 1"

      - from: ACCREDITED
        to: EXPIRED
        trigger: "POST /compliance/lab-accreditations/{accreditation_id}/suspend with reason 'COVERAGE_ELAPSED' when the logical clock is already past valid_through"
        actor: ComplianceAdministrator
        preconditions:
          - "accreditation.accreditation_state == ACCREDITED"
          - "logical clock > accreditation.valid_through"
        side_effects:
          - "cascade hop 1: same INVALIDATED fan-out as the SUSPENDED edge"
          - "increments LabAccreditation.version by 1"
        note: "Expiry is recorded through the same operator endpoint so that it stays reachable from an empty database with only the logical clock to move."

  # ---------------------------------------------------------------------------
  # ComponentPartCertificate — branching on reliance recording
  # ---------------------------------------------------------------------------
  - entity: ComponentPartCertificate
    initial_state: SUBMITTED
    terminal_states: [REJECTED, RELIANCE_VOID]
    transitions:

      - from: SUBMITTED
        to: RELIED_UPON
        trigger: "POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation with reliance_decision RELY"
        actor: CertificationOfficer
        preconditions:
          - "certificate.reliance_state == SUBMITTED"
          - "supplier.reliance_agreement_state == ON_FILE"
          - "the component part's reliance_status == VALID"
          - "ApplicableRule.component_reliance_allowed == true for certificate.rule_id"
          - "certificate.rule_id is a member of the product's required_rule_ids"
        side_effects:
          - "sets ComponentPartCertificate.reliance_documentation_ref and reliance_recorded_by_user_id"
          - "increments Supplier.certificates_issued_count is unchanged; the count already includes SUBMITTED rows"
          - "recomputes Product.risk_weighted_gap_score and Product.compliance_posture"
          - "when the product is in EVIDENCE_RELIANCE and the recomputed gap score is 0, the product transitions EVIDENCE_RELIANCE -> EVIDENCE_COMPLETE"
          - "increments ComponentPartCertificate.version and Product.version by 1 each"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation with reliance_decision REJECT"
        actor: CertificationOfficer
        preconditions:
          - "certificate.reliance_state == SUBMITTED"
        side_effects:
          - "sets ComponentPartCertificate.reliance_documentation_ref and reliance_recorded_by_user_id"
          - "decrements Supplier.certificates_issued_count by 1"
          - "increments ComponentPartCertificate.version and Supplier.version by 1 each"
        note: "Divergent branch: REJECT touches the supplier counter and never the product gap score; RELY touches the product gap score and never the supplier counter."

      - from: RELIED_UPON
        to: RELIANCE_VOID
        trigger: "system event: cascade hop 2 of material_change_resample_cascade, caused by the ComponentPart entering SUPERSEDED"
        actor: system
        preconditions:
          - "certificate.reliance_state == RELIED_UPON"
          - "certificate.component_part_id == the superseded part's id"
        side_effects:
          - "decrements Supplier.certificates_issued_count by 1"
          - "cascade hop 3: caused by this certificate entering RELIANCE_VOID, every ACTIVE SamplingPlan for the part's product transitions ACTIVE -> RESAMPLE_DUE with resample_trigger RELIANCE_VOID"
          - "increments ComponentPartCertificate.version and Supplier.version by 1 each"

  # ---------------------------------------------------------------------------
  # ComponentPart — reliance eligibility axis; head of the material-change cascade
  # ---------------------------------------------------------------------------
  - entity: ComponentPart
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:

      - from: PENDING
        to: VALID
        trigger: "system event: a ComponentPartCertificate of this part enters RELIED_UPON, recorded by POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation with reliance_decision RELY"
        actor: system
        preconditions:
          - "part.reliance_status == PENDING"
          - "product.evidence_path == COMPONENT_RELIANCE"
          - "every rule in Product.required_rule_ids that applies to this part has a RELIED_UPON ComponentPartCertificate on the part"
        side_effects:
          - "increments ComponentPart.version by 1"

      - from: VALID
        to: SUPERSEDED
        trigger: "POST /compliance/material-change-events"
        actor: ComplianceAdministrator
        preconditions:
          - "part.reliance_status == VALID"
          - "the event's subject_type == COMPONENT_PART and component_part_id == part.id"
          - "calculation material_change_resample_decision returns true for the submitted change_kind"
        side_effects:
          - "sets ComponentPart.last_material_change_at to the logical clock"
          - "increments Product.material_change_count by 1"
          - "cascade hop 2: caused by this part entering SUPERSEDED, every ComponentPartCertificate for this part with reliance_state == RELIED_UPON transitions RELIED_UPON -> RELIANCE_VOID"
          - "increments ComponentPart.version and Product.version by 1 each"
        note: "Head of material_change_resample_cascade (depth 4)."

      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /compliance/material-change-events"
        actor: ComplianceAdministrator
        preconditions:
          - "part.reliance_status == PENDING"
          - "the event's subject_type == COMPONENT_PART and component_part_id == part.id"
          - "calculation material_change_resample_decision returns true for the submitted change_kind"
        side_effects:
          - "sets ComponentPart.last_material_change_at to the logical clock"
          - "increments Product.material_change_count by 1"
          - "increments ComponentPart.version and Product.version by 1 each"
        note: "No certificate cascade fires from this edge because a PENDING part can hold no RELIED_UPON certificate."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# -----------------------------------------------------------------------------
concurrency_rules:

  - rule_id: certificate-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /compliance/products/{product_id}/certificates"
    occ_field: "expected_product_version"
    description: |
      Creating a ChildrensProductCertificate against a Product whose version has
      advanced since the client last read it is rejected on the stale version.
      A new draft certificate legitimately supersedes the prior ISSUED certificate
      for the same product (recorded in supersedes_certificate_id), so a writer
      holding an out-of-date view of the product would otherwise pin the wrong
      predecessor and the wrong cited_rule_ids snapshot.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: corrective-action-supersede-stale-case
    parent_entity: NoncomplianceCase
    write_endpoint: "POST /compliance/noncompliance-cases/{case_id}/corrective-actions"
    occ_field: "expected_case_version"
    description: |
      Recording a corrective action plan against a NoncomplianceCase whose version
      has advanced since the client last read it is rejected on the stale version.
      Each recorded plan legitimately replaces the previous one and bumps
      corrective_action_revision, so a writer working from an out-of-date view of the
      case would overwrite a plan it never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: applicable_rule_set_derivation
    trigger: "on POST /compliance/products/{product_id}/submit-for-certification (Product DRAFT -> SCOPED), and on every POST /compliance/products/{product_id}/component-parts while the product's certification_state is in {DRAFT, SCOPED}"
    algorithm: topological
    formula: |
      candidate_mappings = CategoryRuleMapping rows where
          category_id == product.category_id
          AND mapping_state == ACTIVE
          AND effective_from <= logical_clock          # inclusive lower bound
      parts = ComponentPart rows where product_id == product.id     # no status filter: every part row counts
      required = []                                     # ordered result
      for m in candidate_mappings
              sorted by (ApplicableRule(m.rule_id).severity_weight DESC,
                         ApplicableRule(m.rule_id).rule_code ASC):
          include = case m.applicability_condition:
              ALWAYS                -> true
              IF_PAINTED_SURFACE    -> any(p.material_class == PAINTED_COATING for p in parts)
              IF_PLASTICIZED_PART   -> any(p.material_class == PLASTICIZED_PLASTIC for p in parts)
              IF_SMALL_PART_PRESENT -> any(p.small_part_when_detached == true for p in parts)
              IF_ACCESSIBLE_METAL   -> any(p.material_class == ACCESSIBLE_METAL
                                           AND p.accessible_to_child == true for p in parts)
          if include AND m.rule_id not in required:
              required.append(m.rule_id)
      Product.required_rule_ids = required
    input_set: "CategoryRuleMapping rows with mapping_state == ACTIVE and effective_from <= the logical clock, for the product's category only; all ComponentPart rows of the product regardless of reliance_status."
    constants: {}
    precision: "Exact set membership; result order is severity_weight DESC then rule_code ASC. Ties are impossible because rule_code is unique, so no identifier is ever consulted."

  - name: sampling_plan_required_sample_size
    trigger: "on POST /compliance/products/{product_id}/sampling-plans, and again on every SamplingPlan transition into RESAMPLE_DUE"
    algorithm: threshold
    formula: |
      rule_count = length(product.required_rule_ids)
      if plan.plan_type == INITIAL:
          volume_component = ceil(product.projected_annual_units / INITIAL_DIVISOR_UNITS)
          raw = (INITIAL_BASE_SAMPLES + volume_component) * rule_count
      else:                                    # plan_type == PERIODIC
          volume_component = floor(plan.baseline_units_produced / PERIODIC_DIVISOR_UNITS)
          raw = (PERIODIC_BASE_SAMPLES + volume_component) * rule_count
      if ProductCategory(product.category_id).durable_infant_product == true:
          raw = raw * DURABLE_INFANT_MULTIPLIER
      units_authorized = min(MAX_SAMPLE_UNITS,
                             max(ProductCategory(product.category_id).sampling_floor_units, raw))
      units_available  = units_authorized - units_committed
    input_set: "Product.projected_annual_units for the INITIAL variant; SamplingPlan.baseline_units_produced for the PERIODIC variant; Product.required_rule_ids as recomputed at plan creation time."
    constants:
      INITIAL_DIVISOR_UNITS: 2500
      INITIAL_BASE_SAMPLES: 3
      PERIODIC_DIVISOR_UNITS: 5000
      PERIODIC_BASE_SAMPLES: 1
      DURABLE_INFANT_MULTIPLIER: 2
      MAX_SAMPLE_UNITS: 40
    precision: "Integer units. ceil for the forward-looking variant, floor for the chronological variant; no other rounding."
    variants:
      - name: initial_certification_forward_looking
        when: "plan_type == INITIAL — the sample size covers a certification that has not produced anything yet"
        difference: "Divides the manufacturer's projected_annual_units by 2500 and rounds UP (ceil), then adds a base of 3 per rule. Counts volume that has not happened yet."
      - name: periodic_verification_chronological
        when: "plan_type == PERIODIC — the sample size trues up against production that already happened"
        difference: "Divides the actually produced baseline_units_produced by 5000 and rounds DOWN (floor), then adds a base of 1 per rule. For identical volume figures this yields a strictly smaller authorization than the INITIAL variant."

  - name: lab_test_line_fee_cents
    trigger: "on POST /compliance/test-orders, before test_order_invoice_total_cents"
    algorithm: tiered_pricing
    formula: |
      accreditation = the LabAccreditation row with laboratory_id == order.laboratory_id,
                      test_method_code == ApplicableRule(order.rule_id).test_method_code,
                      accreditation_state == ACCREDITED,
                      and valid_from <= logical_clock <= valid_through
                      (validation ERR_LAB_METHOD_NOT_ACCREDITED guarantees exactly one such row)
      independence_multiplier = case Laboratory(order.laboratory_id).independence_class:
          INDEPENDENT            -> 1.00
          FIREWALLED_GOVERNMENT  -> 1.05
          MANUFACTURER_OWNED     -> 1.20
      # PINNED ROUNDING ORDER: round the PER-SAMPLE amount to whole cents FIRST,
      # then multiply by sample_count. The alternative order (multiply the exact
      # per-sample amount by sample_count and round the product) is explicitly NOT used.
      per_sample_cents = round_half_up(
            ApplicableRule(order.rule_id).base_method_fee_cents
            * (1 + accreditation.fee_surcharge_basis_points / 10000)
            * independence_multiplier )
      line_fee_cents = per_sample_cents * order.sample_count
    input_set: "The single ACCREDITED LabAccreditation row covering the logical clock for this laboratory and test method; the order's rule and sample_count."
    constants:
      INDEPENDENCE_MULTIPLIER_INDEPENDENT: 1.00
      INDEPENDENCE_MULTIPLIER_FIREWALLED_GOVERNMENT: 1.05
      INDEPENDENCE_MULTIPLIER_MANUFACTURER_OWNED: 1.20
    precision: "Whole cents, round_half_up, applied once at the per-sample step and never again. Multiplication by sample_count is exact integer arithmetic."

  - name: test_order_invoice_total_cents
    trigger: "on POST /compliance/test-orders, immediately after lab_test_line_fee_cents"
    algorithm: waterfall_allocation
    formula: |
      # The expedite fee is keyed on a tier over the subtotal, and the reliance
      # discount is keyed on a tier over a total that already contains that
      # expedite fee. The dependency LOOKS circular; the evaluation order below
      # is pinned so the value is well defined. Steps run exactly once, in order.
      step 1: subtotal_cents = order.line_fee_cents
      step 2: expedite_rate_bp =
                  0                        when order.expedite_requested == false
                  EXPEDITE_RATE_BP_TIER_1  when subtotal_cents <= EXPEDITE_TIER_1_MAX_CENTS
                  EXPEDITE_RATE_BP_TIER_2  when subtotal_cents <= EXPEDITE_TIER_2_MAX_CENTS
                  EXPEDITE_RATE_BP_TIER_3  otherwise
              expedite_fee_cents = round_half_up(subtotal_cents * expedite_rate_bp / 10000)
      step 3: total_before_discount_cents = subtotal_cents + expedite_fee_cents
      step 4: reliance_discount_bp =
                  0                            when Product(order.product_id).evidence_path != COMPONENT_RELIANCE
                  RELIANCE_DISCOUNT_HIGH_BP    when total_before_discount_cents >= RELIANCE_DISCOUNT_HIGH_THRESHOLD_CENTS
                  RELIANCE_DISCOUNT_BP         when total_before_discount_cents >= RELIANCE_DISCOUNT_THRESHOLD_CENTS
                  0                            otherwise
              reliance_discount_cents = round_half_up(total_before_discount_cents * reliance_discount_bp / 10000)
      step 5: invoice_total_cents = total_before_discount_cents - reliance_discount_cents
    input_set: "The order's own line_fee_cents and expedite_requested flag; the owning Product's evidence_path. No other order participates."
    constants:
      EXPEDITE_TIER_1_MAX_CENTS: 50000
      EXPEDITE_TIER_2_MAX_CENTS: 150000
      EXPEDITE_RATE_BP_TIER_1: 1500
      EXPEDITE_RATE_BP_TIER_2: 1000
      EXPEDITE_RATE_BP_TIER_3: 600
      RELIANCE_DISCOUNT_THRESHOLD_CENTS: 60000
      RELIANCE_DISCOUNT_BP: 800
      RELIANCE_DISCOUNT_HIGH_THRESHOLD_CENTS: 120000
      RELIANCE_DISCOUNT_HIGH_BP: 1200
    precision: "Whole cents, round_half_up, applied independently at step 2 and step 4. Tier comparisons use >= and <= exactly as written."

  - name: product_risk_weighted_gap_score
    trigger: "on Product DRAFT -> SCOPED; on every TestOrder report filing; on every ComponentPartCertificate reliance recording or voiding; on every NoncomplianceCase open or close; on every SamplingPlan transition into or out of RESAMPLE_DUE"
    algorithm: weighted_scoring
    formula: |
      required = product.required_rule_ids
      total_weight = sum(ApplicableRule(r).severity_weight for r in required)
      covered(r) =
          when product.evidence_path == FULL_PRODUCT_TEST:
              exists TestOrder with product_id == product.id AND rule_id == r
                     AND order_state == REPORTED_PASS
          when product.evidence_path == COMPONENT_RELIANCE:
              exists ComponentPartCertificate with rule_id == r
                     AND reliance_state == RELIED_UPON
                     AND ComponentPart(component_part_id).product_id == product.id
      covered_weight   = sum(ApplicableRule(r).severity_weight for r in required if covered(r))
      uncovered_weight = total_weight - covered_weight
      open_case_penalty = OPEN_CASE_PENALTY_POINTS * count(NoncomplianceCase
            where product_id == product.id
              AND case_state IN {OPEN, STOP_DISTRIBUTION_ISSUED, RETEST_ORDERED, RETEST_FAILED})
      resample_penalty  = RESAMPLE_PENALTY_POINTS * count(SamplingPlan
            where product_id == product.id AND plan_state == RESAMPLE_DUE)
      base = 100 when total_weight == 0
             else round_half_up(100 * uncovered_weight / total_weight)
      risk_weighted_gap_score = min(100, max(0, base + open_case_penalty + resample_penalty))
    input_set: "Only the rules in Product.required_rule_ids; only TestOrder rows in REPORTED_PASS and ComponentPartCertificate rows in RELIED_UPON count as coverage; only non-terminal cases and only RESAMPLE_DUE plans contribute penalties."
    constants:
      OPEN_CASE_PENALTY_POINTS: 15
      RESAMPLE_PENALTY_POINTS: 10
    precision: "Integer 0..100. round_half_up on the percentage before penalties are added; the min/max clamp is applied once, after the penalties."

  - name: product_compliance_posture
    trigger: "immediately after every product_risk_weighted_gap_score evaluation, and on Product DRAFT -> SCOPED and CERTIFIED -> ARCHIVED"
    algorithm: threshold
    formula: |
      # Ordered branches; the first matching branch wins.
      1. UNSCOPED   when product.certification_state IN {DRAFT, ARCHIVED}
      2. SUSPENDED  when exists NoncomplianceCase with product_id == product.id
                         AND case_state IN {OPEN, STOP_DISTRIBUTION_ISSUED, RETEST_FAILED, ESCALATED_RECALL}
      3. SUSPENDED  when exists SamplingPlan with product_id == product.id AND plan_state == LAPSED
      4. CLEARED    when product.risk_weighted_gap_score == 0
      5. RESTRICTED otherwise
    input_set: "The product's own certification_state and risk_weighted_gap_score plus its NoncomplianceCase and SamplingPlan children with the status filters named in the branches."
    constants: {}
    precision: "Exact enum. Branch order is normative — a product with both a LAPSED plan and a zero gap score is SUSPENDED, not CLEARED."

  - name: noncompliance_corrective_scope_units
    trigger: "on POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution and on the RETEST_FAILED -> ESCALATED_RECALL transition"
    algorithm: chronological
    formula: |
      failed_order = TestOrder(case.triggering_test_order_id)
      if case.scope_variant == BATCH_SCOPED:
          cutoff = failed_order.window_start
      else:                                   # LOT_TRACEBACK
          last_pass_at = max(o.reported_at) over TestOrder o where
                  o.product_id == case.product_id
                  AND o.rule_id == case.failed_rule_id
                  AND o.order_state == REPORTED_PASS
                  AND o.reported_at < failed_order.reported_at
          cutoff = last_pass_at when at least one such order exists,
                   else Product(case.product_id).created_at
      in_scope = ProductionBatch rows where
                  product_id == case.product_id
                  AND distribution_state != DESTROYED
                  AND produced_on >= cutoff            # inclusive lower bound
      scope_units = sum(b.quantity for b in in_scope)
    input_set: "ProductionBatch rows of the case's product in HELD, RELEASED or STOP_DISTRIBUTION; only DESTROYED batches are excluded, because a destroyed batch can no longer be recovered or corrected."
    constants: {}
    precision: "Integer units. The chronological cutoff comparison is >= (a batch produced exactly at the cutoff instant is in scope). When no prior passing test exists, the fallback baseline is Product.created_at, never an identifier."
    variants:
      - name: batch_scoped_window
        when: "scope_variant == BATCH_SCOPED — the operator asserts the defect is confined to the material sampled by the failing order"
        difference: "Cutoff is the failing order's own window_start, so only batches produced from the sampled window forward are stopped."
      - name: lot_traceback_window
        when: "scope_variant == LOT_TRACEBACK — the operator cannot bound the defect and traces back to the last proof of conformity"
        difference: "Cutoff walks back to the reported_at of the most recent REPORTED_PASS order for the same rule (or Product.created_at when none exists), so every batch produced since the last passing test is stopped. For identical batch data this returns a strictly larger or equal unit count than batch_scoped_window."

  - name: periodic_retest_due_date
    trigger: "on SamplingPlan DRAFT -> ACTIVE, on every RESAMPLE_DUE -> ACTIVE re-entry, and whenever a TestOrder under the plan enters REPORTED_PASS"
    algorithm: threshold
    formula: |
      required = Product(plan.product_id).required_rule_ids
      if required is empty:
          periodic_due_at = null
      else:
          strictest_interval_months = min(ApplicableRule(r).periodic_interval_months for r in required)
          periodic_due_at = plan.last_verified_at plus strictest_interval_months calendar months,
                            with the day-of-month clamped to the last day of the target month
                            and the time-of-day preserved exactly
    input_set: "Every rule in Product.required_rule_ids; the strictest (smallest) interval wins. Baseline is SamplingPlan.last_verified_at, which is activated_at until the first REPORTED_PASS order resets it."
    constants: {}
    precision: "Calendar-month arithmetic on the UTC instant with day clamping; no interval is expressed in days. The periodic review comparison is `logical_clock >= periodic_due_at` — an instant exactly equal to periodic_due_at IS due."

  - name: laboratory_slot_overlap_check
    trigger: "on POST /compliance/test-orders, before any fee calculation"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [window_start, window_end).
      # Adjacency is ALLOWED — an existing order ending exactly when the candidate
      # starts does not overlap. Capacity is AGGREGATE: overlap is only a conflict
      # once concurrency would exceed Laboratory.concurrent_slot_capacity.
      existing = TestOrder rows where laboratory_id == candidate.laboratory_id
                 AND order_state IN {SCHEDULED, IN_TESTING}
      breakpoints = sort ascending of
          { candidate.window_start }
          union { e.window_start for e in existing
                  if candidate.window_start <= e.window_start < candidate.window_end }
      peak_concurrency = max over t in breakpoints of
          1 + count(e in existing where e.window_start <= t AND t < e.window_end)
      reject with ERR_LAB_SLOT_CAPACITY_EXCEEDED when
          peak_concurrency > Laboratory(candidate.laboratory_id).concurrent_slot_capacity
    input_set: "TestOrder rows on the same laboratory in SCHEDULED or IN_TESTING only. CANCELLED, INVALIDATED, REPORTED_PASS and REPORTED_FAIL orders release their window and are excluded."
    constants: {}
    precision: "Integer concurrency count. Interval arithmetic is half-open on both comparisons: e.window_start <= t < e.window_end. The candidate contributes exactly 1 to every breakpoint."

  - name: component_certificate_coverage_overlap_check
    trigger: "on POST /compliance/component-parts/{part_id}/certificates"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics: [coverage_from, coverage_through], both endpoints
      # inclusive, PLUS a mandatory quarantine buffer of COVERAGE_BUFFER_DAYS between
      # consecutive coverage intervals. Capacity is exactly 1 — there is no aggregate
      # allowance. Adjacency is FORBIDDEN, and so is any gap shorter than the buffer.
      existing = ComponentPartCertificate rows where
                 component_part_id == candidate.component_part_id
                 AND rule_id == candidate.rule_id
                 AND reliance_state IN {SUBMITTED, RELIED_UPON}
      collides(e) =
          candidate.coverage_from <= (e.coverage_through plus COVERAGE_BUFFER_DAYS days)
          AND (e.coverage_from minus COVERAGE_BUFFER_DAYS days) <= candidate.coverage_through
      reject with ERR_COMPONENT_COVERAGE_OVERLAP when any e in existing satisfies collides(e)
    input_set: "ComponentPartCertificate rows for the same (component_part_id, rule_id) pair in SUBMITTED or RELIED_UPON only. REJECTED and RELIANCE_VOID rows free their interval and are excluded."
    constants:
      COVERAGE_BUFFER_DAYS: 7
    precision: "Day-granularity buffer arithmetic on UTC instants; both interval endpoints are inclusive, so a candidate starting exactly at an existing coverage_through collides."

  - name: test_result_decision
    trigger: "on POST /compliance/test-orders/{order_id}/report-result"
    algorithm: threshold
    formula: |
      rule = ApplicableRule(order.rule_id)
      if rule.limit_comparator == AT_OR_BELOW:
          result = PASS when measured_value <= rule.limit_value else FAIL
      else:                                  # AT_OR_ABOVE
          result = PASS when measured_value >= rule.limit_value else FAIL
    input_set: "The submitted measured_value and the order's own rule. No aggregation across samples — the laboratory reports one representative measured value per order."
    constants: {}
    precision: "The submitted decimal is compared exactly with no rounding or tolerance. A measured_value exactly equal to limit_value PASSES under both comparators."

  - name: certificate_content_completeness
    trigger: "on POST /compliance/products/{product_id}/certificates and re-evaluated on POST /compliance/certificates/{certificate_id}/issue"
    algorithm: aggregation
    formula: |
      satisfied = count of true among the following seven required-content slots:
        1. certifier_legal_name is non-empty after trimming
        2. certifier_contact_email contains '@'
        3. manufacture_place is non-empty after trimming
        4. manufacture_date_month matches ^[0-9]{4}-(0[1-9]|1[0-2])$
        5. testing_place is non-empty after trimming
        6. cited_rule_ids is non-empty AND equals Product.required_rule_ids as a set
        7. cited_evidence_count >= length(cited_rule_ids)
      content_completeness_pct = floor(100 * satisfied / REQUIRED_CONTENT_SLOTS)
    input_set: "The certificate's own content fields plus the owning product's required_rule_ids snapshot at creation time."
    constants:
      REQUIRED_CONTENT_SLOTS: 7
    precision: "Integer percent, floor. Seven of seven slots yields exactly 100; six of seven yields 85."

  - name: tracking_label_compliance_flag
    trigger: "on POST /compliance/production-batches/{batch_id}/tracking-label and on POST /compliance/products/{product_id}/production-batches"
    algorithm: aggregation
    formula: |
      tracking_label_compliant =
            batch.label_on_product == true
        AND batch.label_on_packaging == true
        AND batch.label_batch_code_printed == true
        AND batch.batch_code matches ^[A-Z0-9]{3,10}-[0-9]{6}$
        AND Product(batch.product_id).manufacture_site_code is non-empty
    input_set: "The batch's own four label fields plus the owning product's manufacture_site_code."
    constants: {}
    precision: "Boolean conjunction; all five conjuncts must hold. Label presence on the product alone or on the packaging alone is not compliant."

  - name: material_change_resample_decision
    trigger: "on POST /compliance/material-change-events"
    algorithm: threshold
    formula: |
      triggers_resample = false when event.change_kind == PACKAGING_ONLY
                          else true
    input_set: "The submitted change_kind only."
    constants: {}
    precision: "Boolean. PACKAGING_ONLY is the single non-triggering kind; all four other kinds trigger resampling."

  - name: retest_round_threshold_decision
    trigger: "on POST /compliance/noncompliance-cases/{case_id}/order-retest"
    algorithm: threshold
    formula: |
      if case.retest_round_count >= MAX_RETEST_ROUNDS:
          target_state = ESCALATED_RECALL
      else:
          target_state = RETEST_ORDERED
    input_set: "NoncomplianceCase.retest_round_count as it stands before this call increments it."
    constants:
      MAX_RETEST_ROUNDS: 3
    precision: "Integer comparison with >=. A case whose retest_round_count is exactly 3 escalates; a case at 2 orders a fourth-round-eligible retest and lands at 3."

  - name: sample_unit_ledger
    trigger: "on every TestOrder creation, cancellation and invalidation"
    algorithm: aggregation
    formula: |
      units_committed(plan) = sum(o.sample_count for TestOrder o where
                                 o.sampling_plan_id == plan.id
                                 AND o.order_state IN {SCHEDULED, IN_TESTING,
                                                       REPORTED_PASS, REPORTED_FAIL})
      units_available(plan) = plan.units_authorized - units_committed(plan)
      INVARIANT sample_units_conserved:
          plan.units_committed + plan.units_available == plan.units_authorized
        must hold identically before a POST /compliance/test-orders and after the
        matching POST /compliance/test-orders/{order_id}/cancel, for every plan.
    input_set: "TestOrder rows of the plan in SCHEDULED, IN_TESTING, REPORTED_PASS or REPORTED_FAIL. CANCELLED and INVALIDATED orders release their units."
    constants: {}
    precision: "Integer sample units; the conserved quantity is units_authorized."

  - name: distribution_unit_ledger
    trigger: "on every ProductionBatch creation and on every distribution_state transition"
    algorithm: aggregation
    formula: |
      total_produced(product) = sum(b.quantity for ProductionBatch b
                                    where b.product_id == product.id)
      INVARIANT distribution_units_conserved:
          product.units_held + product.units_released
        + product.units_stopped + product.units_destroyed == total_produced(product)
        must hold identically before a POST /compliance/production-batches/{batch_id}/release
        and after the matching POST /compliance/production-batches/{batch_id}/rescind-release.
    input_set: "Every ProductionBatch row of the product with no status filter — each batch's quantity sits in exactly one of the four Product bucket fields."
    constants: {}
    precision: "Integer physical product units; the conserved quantity is total_produced."

  - name: laboratory_fee_ledger
    trigger: "on every TestOrder creation (billing) and on every TestOrder transition into CANCELLED or INVALIDATED (crediting)"
    algorithm: aggregation
    formula: |
      outstanding(lab) = sum(o.invoice_total_cents for TestOrder o where
                             o.laboratory_id == lab.id
                             AND o.order_state IN {SCHEDULED, IN_TESTING,
                                                   REPORTED_PASS, REPORTED_FAIL})
      INVARIANT laboratory_fee_conserved:
          lab.billed_fee_cents_total - lab.credited_fee_cents_total == outstanding(lab)
        must hold identically before a POST /compliance/test-orders
        and after the matching POST /compliance/test-orders/{order_id}/cancel.
    input_set: "TestOrder rows of the laboratory in SCHEDULED, IN_TESTING, REPORTED_PASS or REPORTED_FAIL — every order is billed at creation. CANCELLED and INVALIDATED orders were credited back in full and drop out of the sum."
    constants: {}
    precision: "Integer cents; the conserved quantity is the net billed-minus-credited balance. Cancellation credits the exact invoice_total_cents that was billed, so the difference returns to its pre-billing value with zero drift."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first violated rule decides the response)
# -----------------------------------------------------------------------------
validations:

  # --- 1..4 authentication and authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role names one of the six roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's `roles:` list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "When X-User-Role is LaboratoryUser, X-User-ID equals the laboratory_id of the TestOrder named in the path."
    error_id: ERR_LAB_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /compliance/test-orders/{order_id}/start-testing, POST /compliance/test-orders/{order_id}/report-result"

  - priority: 4
    category: auth
    check: "When X-User-Role is SupplierUser, X-User-ID equals ComponentPart.supplier_id of the part named in the path."
    error_id: ERR_SUPPLIER_NOT_PART_OWNER
    http_status: 403
    applies_to: "POST /compliance/component-parts/{part_id}/certificates"

  # --- 5 request shape ---------------------------------------------------------
  - priority: 5
    category: business_constraint
    check: "Request body and query parameters conform to the endpoint's `input:` schema: every required field present, enum values inside the declared set, regex-constrained strings matching, numeric fields inside the declared range, `limit` in 1..100 and `offset` >= 0 on list endpoints."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # --- 6..7 existence ----------------------------------------------------------
  - priority: 6
    category: existence
    check: "Every resource named by a path segment or by a foreign-key field of the request body exists, validated left to right and then in the field order declared by the endpoint's `input:`. Exactly one code per entity, selected by the leftmost missing reference: {rule_id} or body rule_id -> ERR_RULE_NOT_FOUND; {category_id} or body category_id -> ERR_CATEGORY_NOT_FOUND; {mapping_id} -> ERR_MAPPING_NOT_FOUND; {supplier_id} or body supplier_id -> ERR_SUPPLIER_NOT_FOUND; {laboratory_id} or body laboratory_id -> ERR_LABORATORY_NOT_FOUND; {accreditation_id} -> ERR_ACCREDITATION_NOT_FOUND; {product_id} or body product_id -> ERR_PRODUCT_NOT_FOUND; {part_id} or body component_part_id -> ERR_COMPONENT_PART_NOT_FOUND; {part_certificate_id} -> ERR_PART_CERTIFICATE_NOT_FOUND; {plan_id} or body sampling_plan_id -> ERR_SAMPLING_PLAN_NOT_FOUND; {order_id} -> ERR_TEST_ORDER_NOT_FOUND; {certificate_id} or body certificate_id -> ERR_CERTIFICATE_NOT_FOUND; {batch_id} -> ERR_BATCH_NOT_FOUND; {case_id} -> ERR_CASE_NOT_FOUND; {event_id} -> ERR_MATERIAL_CHANGE_EVENT_NOT_FOUND."
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter or a foreign-key field in `input:`"

  - priority: 7
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's `input:` list. Uses the same per-entity NOT_FOUND ids as priority 6."
    error_id: ERR_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /compliance/category-rule-mappings, POST /compliance/laboratories/{laboratory_id}/accreditations, POST /compliance/products, POST /compliance/products/{product_id}/component-parts, POST /compliance/component-parts/{part_id}/certificates, POST /compliance/test-orders, POST /compliance/products/{product_id}/production-batches, POST /compliance/material-change-events"

  # --- 8..15 state preconditions ----------------------------------------------
  - priority: 8
    category: state
    check: "The Product named or referenced by the request has certification_state != ARCHIVED. ARCHIVED is terminal and locks every mutation on the product and on its children."
    error_id: ERR_PRODUCT_ARCHIVED
    http_status: 409
    applies_to: "all POST endpoints that name or reference a Product"

  - priority: 9
    category: state
    check: "The Product is in a certification_state the requested operation allows: DRAFT for submit-for-certification; one of {SCOPED, EVIDENCE_RELIANCE, FULL_TEST_PROGRAM, EVIDENCE_COMPLETE, CERTIFIED, REMEDIATION} for POST /compliance/test-orders; EVIDENCE_COMPLETE for certificate issuance; CERTIFIED for archive."
    error_id: ERR_PRODUCT_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/products/{product_id}/submit-for-certification, POST /compliance/products/{product_id}/archive, POST /compliance/test-orders, POST /compliance/certificates/{certificate_id}/issue"

  - priority: 10
    category: state
    check: "The TestOrder is in the order_state the requested operation requires: SCHEDULED for start-testing, IN_TESTING for report-result, one of {SCHEDULED, IN_TESTING} for cancel."
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/test-orders/{order_id}/start-testing, POST /compliance/test-orders/{order_id}/report-result, POST /compliance/test-orders/{order_id}/cancel"

  - priority: 11
    category: state
    check: "The SamplingPlan is in the plan_state the requested operation requires: DRAFT for activate, one of {ACTIVE, RESAMPLE_DUE} for periodic-review, one of {ACTIVE, RESAMPLE_DUE} to accept a new TestOrder."
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/sampling-plans/{plan_id}/activate, POST /compliance/sampling-plans/{plan_id}/periodic-review, POST /compliance/test-orders"

  - priority: 12
    category: state
    check: "The ChildrensProductCertificate is in the axis state the requested operation requires: issuance_status DRAFT for issue and void, issuance_status ISSUED for furnish, accompaniment_status FURNISHED for recall-accompaniment, and — on ProductionBatch release — the batch's referenced certificate must be ISSUED on the issuance axis AND FURNISHED on the accompaniment axis, both axes at once."
    error_id: ERR_CERTIFICATE_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/certificates/{certificate_id}/issue, POST /compliance/certificates/{certificate_id}/void, POST /compliance/certificates/{certificate_id}/furnish, POST /compliance/certificates/{certificate_id}/recall-accompaniment, POST /compliance/production-batches/{batch_id}/release"

  - priority: 13
    category: state
    check: "The ProductionBatch is in the distribution_state the requested operation requires: HELD for release, RELEASED for rescind-release, one of {HELD, STOP_DISTRIBUTION} for tracking-label edits."
    error_id: ERR_BATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/production-batches/{batch_id}/release, POST /compliance/production-batches/{batch_id}/rescind-release, POST /compliance/production-batches/{batch_id}/tracking-label"

  - priority: 14
    category: state
    check: "The NoncomplianceCase is in the case_state the requested operation requires: OPEN for issue-stop-distribution, one of {STOP_DISTRIBUTION_ISSUED, RETEST_FAILED} for order-retest, one of {RETEST_PASSED, CORRECTIVE_ACTION_APPROVED} for corrective-actions, CORRECTIVE_ACTION_APPROVED for close."
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/noncompliance-cases/{case_id}/issue-stop-distribution, POST /compliance/noncompliance-cases/{case_id}/order-retest, POST /compliance/noncompliance-cases/{case_id}/corrective-actions, POST /compliance/noncompliance-cases/{case_id}/close"

  - priority: 15
    category: state
    check: "The ComponentPartCertificate has reliance_state == SUBMITTED when reliance documentation is recorded."
    error_id: ERR_PART_CERTIFICATE_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation"

  # --- 16..17 optimistic concurrency ------------------------------------------
  - priority: 16
    category: state
    check: "The submitted expected_product_version equals the current Product.version (concurrency rule certificate-create-stale-product)."
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /compliance/products/{product_id}/certificates"

  - priority: 17
    category: state
    check: "The submitted expected_case_version equals the current NoncomplianceCase.version (concurrency rule corrective-action-supersede-stale-case)."
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /compliance/noncompliance-cases/{case_id}/corrective-actions"

  # --- 18..25 safety / regulatory (checked before every other business rule) ---
  - priority: 18
    category: business_safety
    check: "The target Laboratory has operational_state == ACTIVE. A BARRED laboratory may not be assigned new work and may not start testing."
    error_id: ERR_LAB_BARRED
    http_status: 422
    applies_to: "POST /compliance/test-orders, POST /compliance/test-orders/{order_id}/start-testing, POST /compliance/component-parts/{part_id}/certificates"

  - priority: 19
    category: business_safety
    check: "The target Laboratory has influence_attestation_state == CURRENT and influence_attestation_valid_through >= the logical clock — the standing undue-influence prevention attestation must be on file and unexpired."
    error_id: ERR_UNDUE_INFLUENCE_ATTESTATION_MISSING
    http_status: 422
    applies_to: "POST /compliance/test-orders, POST /compliance/test-orders/{order_id}/start-testing"

  - priority: 20
    category: business_safety
    check: "A MANUFACTURER_OWNED Laboratory may not be assigned a retest order. When the request would create a TestOrder with is_retest true, Laboratory.independence_class must be INDEPENDENT or FIREWALLED_GOVERNMENT."
    error_id: ERR_MANUFACTURER_OWNED_LAB_FORBIDDEN
    http_status: 422
    applies_to: "POST /compliance/noncompliance-cases/{case_id}/order-retest"

  - priority: 21
    category: business_safety
    check: "Exactly one LabAccreditation row exists with laboratory_id == the target laboratory, test_method_code == ApplicableRule(rule_id).test_method_code, accreditation_state == ACCREDITED, and valid_from <= logical clock <= valid_through."
    error_id: ERR_LAB_METHOD_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /compliance/test-orders, POST /compliance/component-parts/{part_id}/certificates"

  - priority: 22
    category: business_safety
    check: "When reliance_decision is RELY, the Supplier that owns the component part has reliance_agreement_state == ON_FILE."
    error_id: ERR_RELIANCE_AGREEMENT_MISSING
    http_status: 422
    applies_to: "POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation"

  - priority: 23
    category: business_safety
    check: "The certificate's content_completeness_pct equals 100 — every one of the seven required-content slots of calculation certificate_content_completeness is satisfied."
    error_id: ERR_CERTIFICATE_CONTENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /compliance/certificates/{certificate_id}/issue"

  - priority: 24
    category: business_safety
    check: "The owning Product has compliance_posture == CLEARED."
    error_id: ERR_PRODUCT_POSTURE_NOT_CLEARED
    http_status: 422
    applies_to: "POST /compliance/certificates/{certificate_id}/issue, POST /compliance/production-batches/{batch_id}/release"

  - priority: 25
    category: business_safety
    check: "The ProductionBatch has tracking_label_compliant == true: the tracking label is on the product AND on the packaging AND prints the batch_code, and the batch_code matches the required format."
    error_id: ERR_TRACKING_LABEL_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /compliance/production-batches/{batch_id}/release, POST /compliance/noncompliance-cases/{case_id}/close"

  # --- 26 segregation of duties -----------------------------------------------
  - priority: 26
    category: business_safety
    check: "Segregation of duties: on certificate issuance, X-User-ID differs from TestOrder.ordered_by_user_id for every TestOrder counted as evidence for the certificate's cited_rule_ids; on case closure, X-User-ID differs from NoncomplianceCase.opened_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance/certificates/{certificate_id}/issue, POST /compliance/noncompliance-cases/{case_id}/close"

  # --- 27..31 temporal ---------------------------------------------------------
  - priority: 27
    category: business_temporal
    check: "window_end is strictly after window_start, and window_start >= the logical clock; likewise coverage_through is strictly after coverage_from, and valid_through is strictly after valid_from."
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /compliance/test-orders, POST /compliance/component-parts/{part_id}/certificates, POST /compliance/laboratories/{laboratory_id}/accreditations"

  - priority: 28
    category: business_temporal
    check: "Calculation laboratory_slot_overlap_check returns peak_concurrency <= Laboratory.concurrent_slot_capacity for the candidate half-open window."
    error_id: ERR_LAB_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /compliance/test-orders, POST /compliance/noncompliance-cases/{case_id}/order-retest"

  - priority: 29
    category: business_temporal
    check: "Calculation component_certificate_coverage_overlap_check finds no colliding closed coverage interval, buffer included, for the same (component_part_id, rule_id) pair."
    error_id: ERR_COMPONENT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/component-parts/{part_id}/certificates"

  - priority: 30
    category: business_temporal
    check: "On periodic-review of an ACTIVE plan, the logical clock is >= SamplingPlan.periodic_due_at. An instant exactly equal to periodic_due_at satisfies the check."
    error_id: ERR_PERIODIC_REVIEW_NOT_DUE
    http_status: 409
    applies_to: "POST /compliance/sampling-plans/{plan_id}/periodic-review"

  - priority: 31
    category: business_temporal
    check: "ProductionBatch.produced_on >= the referenced certificate's issued_at when that certificate has issuance_status ISSUED, or >= the certificate's created_at when it is still DRAFT; AND produced_on falls inside the calendar month named by the certificate's manufacture_date_month."
    error_id: ERR_BATCH_OUTSIDE_CERTIFICATE_COVERAGE
    http_status: 422
    applies_to: "POST /compliance/products/{product_id}/production-batches"

  # --- 32..36 referential ------------------------------------------------------
  - priority: 32
    category: business_referential
    check: "The submitted rule_id is a member of Product.required_rule_ids as recomputed by calculation applicable_rule_set_derivation."
    error_id: ERR_RULE_NOT_APPLICABLE_TO_PRODUCT
    http_status: 422
    applies_to: "POST /compliance/test-orders, POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation"

  - priority: 33
    category: business_referential
    check: "When reliance_decision is RELY, ApplicableRule(certificate.rule_id).component_reliance_allowed == true."
    error_id: ERR_COMPONENT_RELIANCE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation"

  - priority: 34
    category: business_referential
    check: "Evidence path and evidence source agree. Reliance documentation with reliance_decision RELY may only be recorded while Product.evidence_path == COMPONENT_RELIANCE. A non-retest TestOrder may not be created for a rule that is ALREADY fully covered by RELIED_UPON ComponentPartCertificate rows on a COMPONENT_RELIANCE product, because that rule's evidence already comes from the supplier; the same product may still order product-level testing for a rule its suppliers have not covered. Retest orders created through the case endpoint are exempt."
    error_id: ERR_EVIDENCE_PATH_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/test-orders, POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation"

  - priority: 35
    category: business_referential
    check: "No CategoryRuleMapping with mapping_state == ACTIVE already exists for the submitted (category_id, rule_id) pair."
    error_id: ERR_MAPPING_DUPLICATE
    http_status: 409
    applies_to: "POST /compliance/category-rule-mappings"

  - priority: 36
    category: business_referential
    check: "When subject_type is COMPONENT_PART, component_part_id is supplied and ComponentPart(component_part_id).product_id equals the submitted product_id; when subject_type is PRODUCT, component_part_id is omitted or null."
    error_id: ERR_PART_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/material-change-events"

  # --- 37..41 constraint -------------------------------------------------------
  - priority: 37
    category: business_constraint
    check: "The Product has at least one ComponentPart row before it may be submitted for certification (empty-collection boundary)."
    error_id: ERR_NO_COMPONENT_PARTS
    http_status: 422
    applies_to: "POST /compliance/products/{product_id}/submit-for-certification"

  - priority: 38
    category: business_constraint
    check: "Calculation applicable_rule_set_derivation returns a non-empty rule set for the product (empty-set boundary: an ACTIVE mapping whose applicability_condition no part satisfies contributes nothing)."
    error_id: ERR_NO_APPLICABLE_RULES
    http_status: 422
    applies_to: "POST /compliance/products/{product_id}/submit-for-certification"

  - priority: 39
    category: business_constraint
    check: "The requested sample_count is <= SamplingPlan.units_available."
    error_id: ERR_SAMPLE_UNITS_EXHAUSTED
    http_status: 422
    applies_to: "POST /compliance/test-orders, POST /compliance/noncompliance-cases/{case_id}/order-retest"

  - priority: 40
    category: business_constraint
    check: "On activation, SamplingPlan.units_authorized >= ProductCategory.sampling_floor_units for the product's category."
    error_id: ERR_SAMPLING_FLOOR_NOT_MET
    http_status: 422
    applies_to: "POST /compliance/sampling-plans/{plan_id}/activate"

  - priority: 41
    category: business_constraint
    check: "The submitted batch_code is unique among ProductionBatch rows with the same product_id."
    error_id: ERR_BATCH_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /compliance/products/{product_id}/production-batches"

  # --- 42 fiscal (last) --------------------------------------------------------
  - priority: 42
    category: business_fiscal
    check: "The sum of invoice_total_cents over TestOrder rows for the product with order_state in {SCHEDULED, IN_TESTING, REPORTED_PASS, REPORTED_FAIL}, plus the candidate order's invoice_total_cents, is <= Product.testing_budget_cents."
    error_id: ERR_PRODUCT_TESTING_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /compliance/test-orders, POST /compliance/noncompliance-cases/{case_id}/order-retest"

  # --- 43 accreditation state (single-endpoint state guard) ---------------------
  - priority: 43
    category: state
    check: "The LabAccreditation being suspended is in accreditation_state ACCREDITED. Both SUSPENDED and EXPIRED are terminal, so a second suspension of the same row is refused."
    error_id: ERR_ACCREDITATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/lab-accreditations/{accreditation_id}/suspend"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table   (every path is under api_prefix /compliance)
# -----------------------------------------------------------------------------
endpoints:

  # --- logical clock (test-driving endpoint) -----------------------------------
  - method: POST
    path: "/compliance/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, coverage-window and due-date rule reads. The startup default is exactly 2026-08-01T00:00:00Z; before the first call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time."
    roles: [ComplianceAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "advances or rewinds the logical clock to the supplied instant"
      - "no entity rows are mutated; state machines only observe the clock when a subsequent request arrives"

  # --- ApplicableRule ---------------------------------------------------------
  - method: POST
    path: "/compliance/applicable-rules"
    description: "Registers a regulatory rule (lead paint, total lead content, phthalates, mechanical hazard or flammability) with its single accreditable test method and compliance limit."
    roles: [ComplianceAdministrator]
    code: 201
    input: [rule_code, hazard_class, test_method_code, limit_value, limit_unit, "limit_comparator?", periodic_interval_months, base_method_fee_cents, "component_reliance_allowed?", severity_weight]
    output: ApplicableRule
    side_effects: []

  - method: GET
    path: "/compliance/applicable-rules/{rule_id}"
    description: "Reads one regulatory rule."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager, LaboratoryUser, SupplierUser]
    code: 200
    input: []
    output: ApplicableRule
    side_effects: []

  - method: GET
    path: "/compliance/applicable-rules"
    description: "Lists regulatory rules with pagination and an optional hazard-class filter."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager, LaboratoryUser, SupplierUser]
    code: 200
    input: ["hazard_class?", "limit?", "offset?"]
    output: ApplicableRule[]
    side_effects: []

  # --- ProductCategory --------------------------------------------------------
  - method: POST
    path: "/compliance/product-categories"
    description: "Registers a juvenile-product category with its durable-infant flag and sampling floor."
    roles: [ComplianceAdministrator]
    code: 201
    input: [category_code, display_name, "durable_infant_product?", intended_age_max_months, sampling_floor_units]
    output: ProductCategory
    side_effects: []

  - method: GET
    path: "/compliance/product-categories/{category_id}"
    description: "Reads one juvenile-product category."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager, LaboratoryUser, SupplierUser]
    code: 200
    input: []
    output: ProductCategory
    side_effects: []

  # --- CategoryRuleMapping ----------------------------------------------------
  - method: POST
    path: "/compliance/category-rule-mappings"
    description: "Maps a regulatory rule onto a product category with the predicate that decides whether the rule is actually required for a given bill of materials."
    roles: [ComplianceAdministrator]
    code: 201
    input: [category_id, rule_id, applicability_condition, effective_from]
    output: CategoryRuleMapping
    side_effects: []

  - method: GET
    path: "/compliance/category-rule-mappings/{mapping_id}"
    description: "Reads one category-to-rule mapping."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer]
    code: 200
    input: []
    output: CategoryRuleMapping
    side_effects: []

  - method: GET
    path: "/compliance/category-rule-mappings"
    description: "Lists category-to-rule mappings, filterable by category or rule."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer]
    code: 200
    input: ["category_id?", "rule_id?", "mapping_state?", "limit?", "offset?"]
    output: CategoryRuleMapping[]
    side_effects: []

  - method: POST
    path: "/compliance/category-rule-mappings/{mapping_id}/retire"
    description: "Retires a category-to-rule mapping so rule identification stops counting it. Products already past DRAFT keep the required_rule_ids snapshot taken at scoping time; the retirement affects future derivations only."
    roles: [ComplianceAdministrator]
    code: 200
    input: []
    output: CategoryRuleMapping
    side_effects:
      - "transitions CategoryRuleMapping.mapping_state ACTIVE -> RETIRED"
      - "increments CategoryRuleMapping.version by 1"
      - "recomputes applicable_rule_set_derivation for every Product of the category whose certification_state is DRAFT, and for no other product"
      - "frees the (category_id, rule_id) pair, so a new ACTIVE mapping for the same pair may be created afterwards"

  # --- Supplier ---------------------------------------------------------------
  - method: POST
    path: "/compliance/suppliers"
    description: "Registers a component part supplier and records whether a reliance agreement is on file."
    roles: [ComplianceAdministrator]
    code: 201
    input: [legal_name, country_code, "reliance_agreement_state?"]
    output: Supplier
    side_effects: []

  - method: GET
    path: "/compliance/suppliers/{supplier_id}"
    description: "Reads one supplier, including its certificates_issued_count."
    roles: [ComplianceAdministrator, CertificationOfficer, SupplierUser]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  # --- Laboratory -------------------------------------------------------------
  - method: POST
    path: "/compliance/laboratories"
    description: "Registers a third-party testing laboratory with its independence class and aggregate concurrent slot capacity."
    roles: [ComplianceAdministrator]
    code: 201
    input: [lab_name, accreditation_body_code, independence_class, concurrent_slot_capacity]
    output: Laboratory
    side_effects: []

  - method: GET
    path: "/compliance/laboratories/{laboratory_id}"
    description: "Reads one laboratory, including its influence attestation state and fee ledger totals."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, LaboratoryUser]
    code: 200
    input: []
    output: Laboratory
    side_effects: []

  - method: POST
    path: "/compliance/laboratories/{laboratory_id}/independence-attestations"
    description: "Records the laboratory's standing undue-influence prevention attestation and its expiry, satisfying the safeguard that gates test-order assignment."
    roles: [ComplianceAdministrator]
    code: 200
    input: [attestation_valid_through]
    output: Laboratory
    side_effects:
      - "sets Laboratory.influence_attestation_state to CURRENT"
      - "sets Laboratory.influence_attestation_valid_through to the submitted instant"
      - "increments Laboratory.version by 1"

  - method: POST
    path: "/compliance/laboratories/{laboratory_id}/operational-state"
    description: "Bars or reinstates a laboratory. A BARRED laboratory may not be assigned new work and may not start testing."
    roles: [ComplianceAdministrator]
    code: 200
    input: [operational_state]
    output: Laboratory
    side_effects:
      - "sets Laboratory.operational_state to the submitted value"
      - "increments Laboratory.version by 1"

  # --- LabAccreditation -------------------------------------------------------
  - method: POST
    path: "/compliance/laboratories/{laboratory_id}/accreditations"
    description: "Records an accreditation scope for one rule's test method with a closed coverage interval and an optional fee surcharge."
    roles: [ComplianceAdministrator]
    code: 201
    input: [rule_id, valid_from, valid_through, "fee_surcharge_basis_points?"]
    output: LabAccreditation
    side_effects:
      - "copies ApplicableRule.test_method_code onto LabAccreditation.test_method_code"

  - method: GET
    path: "/compliance/lab-accreditations/{accreditation_id}"
    description: "Reads one laboratory accreditation record."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, LaboratoryUser]
    code: 200
    input: []
    output: LabAccreditation
    side_effects: []

  - method: GET
    path: "/compliance/lab-accreditations"
    description: "Lists accreditation records, filterable by laboratory, rule and state — the verification channel for 'is this lab accredited for this test method'."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, LaboratoryUser]
    code: 200
    input: ["laboratory_id?", "rule_id?", "accreditation_state?", "limit?", "offset?"]
    output: LabAccreditation[]
    side_effects: []

  - method: POST
    path: "/compliance/lab-accreditations/{accreditation_id}/suspend"
    description: "Suspends or expires an accreditation scope. Head of accreditation_suspension_cascade."
    roles: [ComplianceAdministrator]
    code: 200
    input: [suspension_reason]
    output: LabAccreditation
    side_effects:
      - "sets LabAccreditation.accreditation_state to SUSPENDED, or to EXPIRED when suspension_reason is COVERAGE_ELAPSED and the logical clock is past valid_through"
      - "cascade hop 2: every TestOrder on the same laboratory for the same test_method_code in SCHEDULED or IN_TESTING transitions to INVALIDATED"
      - "cascade hop 3: each invalidated order's SamplingPlan transitions ACTIVE -> RESAMPLE_DUE with resample_trigger RELIANCE_VOID"
      - "adds each invalidated order's invoice_total_cents to Laboratory.credited_fee_cents_total, and returns its sample_count from SamplingPlan.units_committed to SamplingPlan.units_available"
      - "increments LabAccreditation.version by 1"

  # --- Product ----------------------------------------------------------------
  - method: POST
    path: "/compliance/products"
    description: "Registers a children's product in DRAFT with its category, projected annual units and testing budget."
    roles: [ComplianceAdministrator]
    code: 201
    input: [category_id, model_name, manufacture_site_code, projected_annual_units, "testing_budget_cents?"]
    output: Product
    side_effects:
      - "sets Product.certification_state to DRAFT and Product.compliance_posture to UNSCOPED"
      - "sets Product.required_rule_ids to the empty array; rule derivation only runs at submit-for-certification"

  - method: GET
    path: "/compliance/products/{product_id}"
    description: "Reads one product, including required_rule_ids, risk_weighted_gap_score, compliance_posture and the four distribution unit counters."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/compliance/products"
    description: "Lists products, filterable by category, certification state and compliance posture."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager]
    code: 200
    input: ["category_id?", "certification_state?", "compliance_posture?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/compliance/products/{product_id}/compliance-summary"
    description: "Computed read: recomputes applicable_rule_set_derivation, product_risk_weighted_gap_score, product_compliance_posture and both unit ledgers on demand without mutating the product."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager]
    code: 200
    input: []
    output: "{ product_id: uuid, required_rule_ids: uuid[], covered_rule_ids: uuid[], uncovered_rule_ids: uuid[], risk_weighted_gap_score: integer, compliance_posture: enum, open_case_count: integer, resample_due_plan_count: integer, units_held: integer, units_released: integer, units_stopped: integer, units_destroyed: integer, units_total_produced: integer, ledger_balanced: boolean }"
    side_effects: []

  - method: POST
    path: "/compliance/products/{product_id}/submit-for-certification"
    description: "Scopes the product: derives required_rule_ids from the category's rule mappings against the current bill of materials, then forks onto the declared evidence path. Fork point of the Product machine."
    roles: [TestCoordinator]
    code: 200
    input: [evidence_path]
    output: Product
    side_effects:
      - "runs applicable_rule_set_derivation and writes the ordered result to Product.required_rule_ids"
      - "transitions Product.certification_state DRAFT -> SCOPED, then immediately onto EVIDENCE_RELIANCE when evidence_path is COMPONENT_RELIANCE or FULL_TEST_PROGRAM when evidence_path is FULL_PRODUCT_TEST"
      - "sets Product.evidence_path to the submitted value"
      - "on the COMPONENT_RELIANCE branch only: every ComponentPart of the product whose reliance_status is PENDING and which has at least one ComponentPartCertificate in RELIED_UPON transitions to VALID"
      - "on the FULL_PRODUCT_TEST branch only: ComponentPart.reliance_status rows are left at PENDING and no component certificate may be counted as evidence"
      - "recomputes Product.risk_weighted_gap_score and Product.compliance_posture"
      - "increments Product.version by 1"

  - method: POST
    path: "/compliance/products/{product_id}/archive"
    description: "Archives a certified product. Terminal for the Product machine."
    roles: [ComplianceAdministrator]
    code: 200
    input: []
    output: Product
    side_effects:
      - "transitions Product.certification_state CERTIFIED -> ARCHIVED"
      - "increments Product.version by 1"

  # --- ComponentPart ----------------------------------------------------------
  - method: POST
    path: "/compliance/products/{product_id}/component-parts"
    description: "Adds a component part to a product's bill of materials with the material class that drives rule applicability."
    roles: [ComplianceAdministrator]
    code: 201
    input: [supplier_id, part_name, material_class, "accessible_to_child?", "small_part_when_detached?"]
    output: ComponentPart
    side_effects:
      - "sets ComponentPart.reliance_status to PENDING"
      - "increments Product.version by 1"

  - method: GET
    path: "/compliance/component-parts/{part_id}"
    description: "Reads one component part."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, SupplierUser]
    code: 200
    input: []
    output: ComponentPart
    side_effects: []

  - method: GET
    path: "/compliance/component-parts"
    description: "Lists component parts, filterable by product, supplier and reliance status."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, SupplierUser]
    code: 200
    input: ["product_id?", "supplier_id?", "reliance_status?", "limit?", "offset?"]
    output: ComponentPart[]
    side_effects: []

  # --- ComponentPartCertificate ----------------------------------------------
  - method: POST
    path: "/compliance/component-parts/{part_id}/certificates"
    description: "A supplier submits a component part testing certificate for one rule over a closed coverage interval. The calling SupplierUser must own the part."
    roles: [SupplierUser]
    code: 201
    input: [laboratory_id, rule_id, measured_value, coverage_from, coverage_through]
    output: ComponentPartCertificate
    side_effects:
      - "copies ComponentPart.supplier_id onto ComponentPartCertificate.supplier_id"
      - "sets ComponentPartCertificate.reliance_state to SUBMITTED"
      - "increments Supplier.certificates_issued_count by 1"

  - method: GET
    path: "/compliance/component-part-certificates/{part_certificate_id}"
    description: "Reads one component part certificate."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, SupplierUser]
    code: 200
    input: []
    output: ComponentPartCertificate
    side_effects: []

  - method: GET
    path: "/compliance/component-part-certificates"
    description: "Lists component part certificates, filterable by part, supplier, laboratory, rule and reliance state."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, SupplierUser]
    code: 200
    input: ["component_part_id?", "supplier_id?", "laboratory_id?", "rule_id?", "reliance_state?", "limit?", "offset?"]
    output: ComponentPartCertificate[]
    side_effects: []

  - method: POST
    path: "/compliance/component-part-certificates/{part_certificate_id}/reliance-documentation"
    description: "The certification officer records the reliance decision on a supplier certificate, attaching the reliance documentation reference required to lean on component testing."
    roles: [CertificationOfficer]
    code: 200
    input: [reliance_decision, reliance_documentation_ref]
    output: ComponentPartCertificate
    side_effects:
      - "transitions ComponentPartCertificate.reliance_state SUBMITTED -> RELIED_UPON when reliance_decision is RELY, or SUBMITTED -> REJECTED when reliance_decision is REJECT"
      - "on RELY only: stores reliance_documentation_ref and reliance_recorded_by_user_id, and transitions the parent ComponentPart PENDING -> VALID once every rule in Product.required_rule_ids that applies to that part has a RELIED_UPON certificate"
      - "on RELY only: when every rule in Product.required_rule_ids now has a RELIED_UPON certificate on some part of the product, transitions Product.certification_state EVIDENCE_RELIANCE -> EVIDENCE_COMPLETE (join on the reliance branch)"
      - "on REJECT only: leaves ComponentPart.reliance_status at PENDING and leaves reliance_documentation_ref null"
      - "recomputes Product.risk_weighted_gap_score and Product.compliance_posture"
      - "increments ComponentPartCertificate.version by 1"

  # --- SamplingPlan -----------------------------------------------------------
  - method: POST
    path: "/compliance/products/{product_id}/sampling-plans"
    description: "Creates an INITIAL or PERIODIC sampling plan in DRAFT and computes its authorized sample units from the variant selected by plan_type."
    roles: [TestCoordinator]
    code: 201
    input: [plan_type, "baseline_units_produced?", "resample_grace_days?"]
    output: SamplingPlan
    side_effects:
      - "runs sampling_plan_required_sample_size with the variant selected by plan_type and writes the result to SamplingPlan.units_authorized"
      - "sets SamplingPlan.units_committed to 0 and SamplingPlan.units_available to units_authorized"
      - "sets SamplingPlan.plan_state to DRAFT and SamplingPlan.resample_trigger to NONE"

  - method: GET
    path: "/compliance/sampling-plans/{plan_id}"
    description: "Reads one sampling plan, including its unit ledger and periodic_due_at."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer]
    code: 200
    input: []
    output: SamplingPlan
    side_effects: []

  - method: GET
    path: "/compliance/sampling-plans"
    description: "Lists sampling plans, filterable by product, plan type and plan state."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer]
    code: 200
    input: ["product_id?", "plan_type?", "plan_state?", "limit?", "offset?"]
    output: SamplingPlan[]
    side_effects: []

  - method: POST
    path: "/compliance/sampling-plans/{plan_id}/activate"
    description: "Activates a DRAFT plan, or reactivates a RESAMPLE_DUE plan after resampling has been ordered. Cycle edge of the SamplingPlan machine."
    roles: [TestCoordinator]
    code: 200
    input: []
    output: SamplingPlan
    side_effects:
      - "transitions SamplingPlan.plan_state DRAFT -> ACTIVE, or RESAMPLE_DUE -> ACTIVE"
      - "sets SamplingPlan.activated_at and SamplingPlan.last_verified_at to the logical clock instant, and recomputes periodic_due_at"
      - "on the RESAMPLE_DUE -> ACTIVE edge only: resets SamplingPlan.resample_trigger to NONE"
      - "supersedes any other ACTIVE plan of the same plan_type on the same product by transitioning it to SUPERSEDED"
      - "increments SamplingPlan.version by 1"

  - method: POST
    path: "/compliance/sampling-plans/{plan_id}/periodic-review"
    description: "Runs the periodic verification check against periodic_retest_due_date; when due, marks the plan RESAMPLE_DUE, and when the grace period has also elapsed, LAPSED."
    roles: [TestCoordinator]
    code: 200
    input: []
    output: SamplingPlan
    side_effects:
      - "transitions SamplingPlan.plan_state ACTIVE -> RESAMPLE_DUE with resample_trigger PERIODIC_INTERVAL when the logical clock is at or after periodic_due_at"
      - "transitions SamplingPlan.plan_state RESAMPLE_DUE -> LAPSED when the logical clock is at or after periodic_due_at plus resample_grace_days"
      - "on entering RESAMPLE_DUE or LAPSED: recomputes Product.risk_weighted_gap_score and Product.compliance_posture"
      - "increments SamplingPlan.version by 1"

  # --- TestOrder --------------------------------------------------------------
  - method: POST
    path: "/compliance/test-orders"
    description: "Books third-party testing for one rule at one accredited laboratory over the half-open window [window_start, window_end), committing sample units from the plan and pricing the order."
    roles: [TestCoordinator]
    code: 201
    input: [product_id, sampling_plan_id, laboratory_id, rule_id, sample_count, window_start, window_end, "expedite_requested?"]
    output: TestOrder
    side_effects:
      - "sets TestOrder.order_state to SCHEDULED and TestOrder.ordered_by_user_id to the X-User-ID header value"
      - "runs lab_test_line_fee_cents and writes the result to TestOrder.line_fee_cents"
      - "runs test_order_invoice_total_cents and writes the result to TestOrder.invoice_total_cents"
      - "adds sample_count to SamplingPlan.units_committed and subtracts it from SamplingPlan.units_available"
      - "adds invoice_total_cents to Laboratory.billed_fee_cents_total"
      - "sets TestOrder.is_retest to false and TestOrder.retest_case_id to null"

  - method: GET
    path: "/compliance/test-orders/{order_id}"
    description: "Reads one test order, including its priced fee fields and reported result."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, LaboratoryUser]
    code: 200
    input: []
    output: TestOrder
    side_effects: []

  - method: GET
    path: "/compliance/test-orders"
    description: "Lists test orders, filterable by product, sampling plan, laboratory, rule and order state."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, LaboratoryUser]
    code: 200
    input: ["product_id?", "sampling_plan_id?", "laboratory_id?", "rule_id?", "order_state?", "is_retest?", "limit?", "offset?"]
    output: TestOrder[]
    side_effects: []

  - method: POST
    path: "/compliance/test-orders/{order_id}/start-testing"
    description: "The assigned laboratory takes the order into testing. Re-verifies accreditation and the undue-influence attestation at start time."
    roles: [LaboratoryUser]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "transitions TestOrder.order_state SCHEDULED -> IN_TESTING"
      - "increments TestOrder.version by 1"

  - method: POST
    path: "/compliance/test-orders/{order_id}/report-result"
    description: "The laboratory reports the measured value. test_result_decision compares it with the rule's limit at the inclusive boundary and branches the order to REPORTED_PASS or REPORTED_FAIL. Head of failed_test_stop_distribution_cascade."
    roles: [LaboratoryUser]
    code: 200
    input: [measured_value]
    output: TestOrder
    side_effects:
      - "stores TestOrder.measured_value, TestOrder.reported_at (logical clock instant) and TestOrder.reported_by_user_id"
      - "runs test_result_decision and writes PASS or FAIL to TestOrder.result"
      - "on PASS: transitions TestOrder.order_state IN_TESTING -> REPORTED_PASS, sets SamplingPlan.last_verified_at to the logical clock instant and recomputes SamplingPlan.periodic_due_at"
      - "on PASS: when every rule in Product.required_rule_ids now has a REPORTED_PASS order or a RELIED_UPON component certificate, transitions Product.certification_state EVIDENCE_RELIANCE or FULL_TEST_PROGRAM -> EVIDENCE_COMPLETE (join)"
      - "on FAIL: transitions TestOrder.order_state IN_TESTING -> REPORTED_FAIL and opens a NoncomplianceCase in OPEN with triggering_test_order_id set to this order and failed_rule_id set to this order's rule_id"
      - "on FAIL, cascade hop 2: transitions Product.certification_state CERTIFIED or EVIDENCE_COMPLETE -> SUSPENDED and Product.compliance_posture -> SUSPENDED"
      - "on FAIL, cascade hop 3: every ChildrensProductCertificate of the product in issuance_status ISSUED transitions to WITHDRAWN"
      - "on FAIL, cascade hop 4: every ProductionBatch of the product in distribution_state HELD or RELEASED transitions to STOP_DISTRIBUTION, moving its quantity out of units_held or units_released into units_stopped"
      - "on FAIL, when the order was a retest (is_retest true): increments NoncomplianceCase.retest_round_count and transitions that case RETEST_ORDERED -> RETEST_FAILED instead of opening a new case"
      - "increments TestOrder.version by 1"

  - method: POST
    path: "/compliance/test-orders/{order_id}/cancel"
    description: "Cancels a test order that has not yet been reported, returning its committed sample units and crediting its fee."
    roles: [TestCoordinator]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "transitions TestOrder.order_state SCHEDULED -> CANCELLED or IN_TESTING -> CANCELLED"
      - "subtracts sample_count from SamplingPlan.units_committed and adds it back to SamplingPlan.units_available, restoring sample_unit_ledger"
      - "adds invoice_total_cents to Laboratory.credited_fee_cents_total, restoring laboratory_fee_ledger"
      - "increments TestOrder.version by 1"

  # --- ChildrensProductCertificate -------------------------------------------
  - method: POST
    path: "/compliance/products/{product_id}/certificates"
    description: "Drafts a children's product certificate for a product whose evidence is complete. Guards against a stale read of the product with expected_product_version, and supersedes the product's currently ISSUED certificate on issuance."
    roles: [CertificationOfficer]
    code: 201
    input: [expected_product_version, certifier_legal_name, certifier_contact_email, manufacture_place, manufacture_date_month, testing_place]
    output: ChildrensProductCertificate
    side_effects:
      - "rejects with ERR_STALE_PRODUCT_VERSION (412) when expected_product_version does not equal the stored Product.version"
      - "sets ChildrensProductCertificate.issuance_status to DRAFT and accompaniment_status to NOT_FURNISHED"
      - "sets ChildrensProductCertificate.supersedes_certificate_id to the product's current ISSUED certificate id, or null when the product has none"
      - "sets ChildrensProductCertificate.expected_product_version_seen to the submitted expected_product_version"
      - "populates cited_rule_ids from Product.required_rule_ids and cited_evidence_count from the passing orders and relied-upon component certificates that cover them"
      - "runs certificate_content_completeness and writes the result to content_completeness_pct"
      - "increments Product.version by 1"

  - method: GET
    path: "/compliance/certificates/{certificate_id}"
    description: "Reads one children's product certificate, including its two independent status dimensions and content completeness."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager]
    code: 200
    input: []
    output: ChildrensProductCertificate
    side_effects: []

  - method: GET
    path: "/compliance/certificates"
    description: "Lists children's product certificates, filterable by product, superseded predecessor, issuance status and accompaniment status."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager]
    code: 200
    input: ["product_id?", "supersedes_certificate_id?", "issuance_status?", "accompaniment_status?", "limit?", "offset?"]
    output: ChildrensProductCertificate[]
    side_effects: []

  - method: POST
    path: "/compliance/certificates/{certificate_id}/issue"
    description: "Issues a drafted certificate. Requires complete required content and a CLEARED product posture, and certifies the product."
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: ChildrensProductCertificate
    side_effects:
      - "transitions ChildrensProductCertificate.issuance_status DRAFT -> ISSUED"
      - "sets issued_at to the logical clock instant and issued_by_user_id to the X-User-ID header value"
      - "transitions the predecessor named by supersedes_certificate_id from ISSUED -> SUPERSEDED when that field is non-null"
      - "transitions Product.certification_state EVIDENCE_COMPLETE -> CERTIFIED and Product.compliance_posture -> CLEARED"
      - "increments ChildrensProductCertificate.version by 1 and Product.version by 1"

  - method: POST
    path: "/compliance/certificates/{certificate_id}/void"
    description: "Voids a certificate that was never issued. Terminal on the issuance_status dimension."
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: ChildrensProductCertificate
    side_effects:
      - "transitions ChildrensProductCertificate.issuance_status DRAFT -> VOIDED"
      - "increments ChildrensProductCertificate.version by 1"

  - method: POST
    path: "/compliance/certificates/{certificate_id}/furnish"
    description: "Records that the issued certificate now accompanies the product's shipments. Moves only the accompaniment_status dimension; issuance_status is unaffected."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ChildrensProductCertificate
    side_effects:
      - "transitions ChildrensProductCertificate.accompaniment_status NOT_FURNISHED -> FURNISHED"
      - "leaves ChildrensProductCertificate.issuance_status unchanged"
      - "increments ChildrensProductCertificate.version by 1"

  - method: POST
    path: "/compliance/certificates/{certificate_id}/recall-accompaniment"
    description: "Withdraws the certificate from shipments. Terminal on the accompaniment_status dimension and blocks further batch releases."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ChildrensProductCertificate
    side_effects:
      - "transitions ChildrensProductCertificate.accompaniment_status FURNISHED -> RECALLED_FROM_SHIPMENTS"
      - "leaves ChildrensProductCertificate.issuance_status unchanged"
      - "increments ChildrensProductCertificate.version by 1"

  # --- ProductionBatch --------------------------------------------------------
  - method: POST
    path: "/compliance/products/{product_id}/production-batches"
    description: "Records a production batch against an issued certificate, in HELD, with its tracking-label flags."
    roles: [DistributionManager]
    code: 201
    input: [certificate_id, batch_code, produced_on, quantity, "label_on_product?", "label_on_packaging?", "label_batch_code_printed?"]
    output: ProductionBatch
    side_effects:
      - "sets ProductionBatch.distribution_state to HELD and release_rescind_count to 0"
      - "runs tracking_label_compliance_flag and writes the result to ProductionBatch.tracking_label_compliant"
      - "adds quantity to Product.units_held"

  - method: GET
    path: "/compliance/production-batches/{batch_id}"
    description: "Reads one production batch, including its tracking-label compliance flag and distribution state."
    roles: [ComplianceAdministrator, CertificationOfficer, DistributionManager]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []

  - method: GET
    path: "/compliance/production-batches"
    description: "Lists production batches, filterable by product, certificate and distribution state."
    roles: [ComplianceAdministrator, CertificationOfficer, DistributionManager]
    code: 200
    input: ["product_id?", "certificate_id?", "distribution_state?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []

  - method: POST
    path: "/compliance/production-batches/{batch_id}/tracking-label"
    description: "Updates the batch's tracking-label placement flags and recomputes label compliance."
    roles: [DistributionManager]
    code: 200
    input: [label_on_product, label_on_packaging, label_batch_code_printed]
    output: ProductionBatch
    side_effects:
      - "stores the three submitted label flags"
      - "runs tracking_label_compliance_flag and writes the result to ProductionBatch.tracking_label_compliant"
      - "increments ProductionBatch.version by 1"

  - method: POST
    path: "/compliance/production-batches/{batch_id}/release"
    description: "Releases a held batch for distribution. Requires a compliant tracking label and a certificate that is both ISSUED and FURNISHED."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ProductionBatch
    side_effects:
      - "transitions ProductionBatch.distribution_state HELD -> RELEASED"
      - "sets ProductionBatch.released_at to the logical clock instant"
      - "moves quantity from Product.units_held to Product.units_released, preserving distribution_unit_ledger"
      - "increments ProductionBatch.version by 1"

  - method: POST
    path: "/compliance/production-batches/{batch_id}/rescind-release"
    description: "Compensating action: pulls a released batch back to HELD and reverses every unit movement the release performed."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ProductionBatch
    side_effects:
      - "transitions ProductionBatch.distribution_state RELEASED -> HELD"
      - "moves quantity from Product.units_released back to Product.units_held, restoring distribution_unit_ledger to its pre-release values"
      - "clears ProductionBatch.released_at to null and increments release_rescind_count by 1"
      - "increments ProductionBatch.version by 1"

  # --- NoncomplianceCase ------------------------------------------------------
  - method: GET
    path: "/compliance/noncompliance-cases/{case_id}"
    description: "Reads one noncompliance case, including retest round count, scope units and corrective action revision."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager]
    code: 200
    input: []
    output: NoncomplianceCase
    side_effects: []

  - method: GET
    path: "/compliance/noncompliance-cases"
    description: "Lists noncompliance cases, filterable by product, triggering order, failed rule, active retest order and case state."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer, DistributionManager]
    code: 200
    input: ["product_id?", "triggering_test_order_id?", "failed_rule_id?", "active_retest_order_id?", "case_state?", "limit?", "offset?"]
    output: NoncomplianceCase[]
    side_effects: []

  - method: POST
    path: "/compliance/noncompliance-cases/{case_id}/issue-stop-distribution"
    description: "Issues the formal stop-distribution instruction and fixes the corrective scope variant, which decides how scope_units is counted."
    roles: [DistributionManager]
    code: 200
    input: [scope_variant]
    output: NoncomplianceCase
    side_effects:
      - "transitions NoncomplianceCase.case_state OPEN -> STOP_DISTRIBUTION_ISSUED"
      - "sets NoncomplianceCase.scope_variant to the submitted value"
      - "runs noncompliance_corrective_scope_units with the variant selected by scope_variant and writes the result to NoncomplianceCase.scope_units"
      - "increments NoncomplianceCase.version by 1"

  - method: POST
    path: "/compliance/noncompliance-cases/{case_id}/order-retest"
    description: "Orders a retest round for the failed rule. Creates a TestOrder with is_retest true and links it as the case's active retest order. Cycle edge of the NoncomplianceCase machine."
    roles: [TestCoordinator]
    code: 200
    input: [sampling_plan_id, laboratory_id, sample_count, window_start, window_end, "expedite_requested?"]
    output: NoncomplianceCase
    side_effects:
      - "transitions NoncomplianceCase.case_state STOP_DISTRIBUTION_ISSUED -> RETEST_ORDERED, or RETEST_FAILED -> RETEST_ORDERED when retest_round_count is below MAX_RETEST_ROUNDS"
      - "creates a TestOrder in SCHEDULED for the case's failed_rule_id with is_retest true and retest_case_id set to this case, priced by lab_test_line_fee_cents and test_order_invoice_total_cents"
      - "sets NoncomplianceCase.active_retest_order_id to the created order's id"
      - "adds sample_count to SamplingPlan.units_committed and subtracts it from SamplingPlan.units_available"
      - "adds the created order's invoice_total_cents to Laboratory.billed_fee_cents_total"
      - "transitions NoncomplianceCase.case_state RETEST_FAILED -> ESCALATED_RECALL instead, and destroys every STOP_DISTRIBUTION batch of the product, when retest_round_count is at or above MAX_RETEST_ROUNDS"
      - "increments NoncomplianceCase.version by 1"

  - method: POST
    path: "/compliance/noncompliance-cases/{case_id}/corrective-actions"
    description: "Files or replaces the corrective action plan on a case whose retest passed. Guards against a stale read of the case with expected_case_version."
    roles: [CertificationOfficer]
    code: 200
    input: [expected_case_version, corrective_action_ref]
    output: NoncomplianceCase
    side_effects:
      - "rejects with ERR_STALE_CASE_VERSION (412) when expected_case_version does not equal the stored NoncomplianceCase.version"
      - "transitions NoncomplianceCase.case_state RETEST_PASSED -> CORRECTIVE_ACTION_APPROVED, or self-loops on CORRECTIVE_ACTION_APPROVED when a plan is being replaced"
      - "stores corrective_action_ref and increments corrective_action_revision by 1"
      - "increments NoncomplianceCase.version by 1"

  - method: POST
    path: "/compliance/noncompliance-cases/{case_id}/close"
    description: "Closes a case with an approved corrective action, lifting the product out of remediation and returning stopped batches to HELD."
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: NoncomplianceCase
    side_effects:
      - "transitions NoncomplianceCase.case_state CORRECTIVE_ACTION_APPROVED -> CLOSED"
      - "sets NoncomplianceCase.closed_by_user_id to the X-User-ID header value"
      - "transitions every ProductionBatch of the product in STOP_DISTRIBUTION back to HELD, moving its quantity from Product.units_stopped to Product.units_held"
      - "transitions Product.certification_state SUSPENDED -> REMEDIATION and then REMEDIATION -> EVIDENCE_COMPLETE when no other case on the product is open"
      - "recomputes Product.risk_weighted_gap_score and Product.compliance_posture"
      - "increments NoncomplianceCase.version by 1"

  # --- MaterialChangeEvent ----------------------------------------------------
  - method: POST
    path: "/compliance/material-change-events"
    description: "Records an immutable material change event against a product or one of its component parts. Head of material_change_resample_cascade."
    roles: [ComplianceAdministrator]
    code: 201
    input: [product_id, subject_type, change_kind, description, "component_part_id?"]
    output: MaterialChangeEvent
    side_effects:
      - "sets MaterialChangeEvent.occurred_at to the logical clock instant and recorded_by_user_id to the X-User-ID header value"
      - "runs material_change_resample_decision and writes the result to MaterialChangeEvent.triggers_resample"
      - "increments Product.material_change_count by 1"
      - "when triggers_resample is true and subject_type is COMPONENT_PART, cascade hop 2: transitions that ComponentPart.reliance_status VALID -> SUPERSEDED and stamps last_material_change_at"
      - "when triggers_resample is true and subject_type is COMPONENT_PART, cascade hop 3: every ComponentPartCertificate of that part in RELIED_UPON transitions to RELIANCE_VOID"
      - "when triggers_resample is true, cascade hop 4: every ACTIVE SamplingPlan of the product transitions to RESAMPLE_DUE with resample_trigger MATERIAL_CHANGE (RELIANCE_VOID when a relied-upon certificate was voided)"
      - "when triggers_resample is true, cascade hop 5: recomputes Product.risk_weighted_gap_score and sets Product.compliance_posture to RESTRICTED"
      - "when triggers_resample is false (change_kind PACKAGING_ONLY): no ComponentPart, ComponentPartCertificate, SamplingPlan or Product posture row is touched"

  - method: GET
    path: "/compliance/material-change-events/{event_id}"
    description: "Reads one material change event. The row is append-only: it carries id and created_at but no version and no update endpoint."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer]
    code: 200
    input: []
    output: MaterialChangeEvent
    side_effects: []

  - method: GET
    path: "/compliance/material-change-events"
    description: "Lists material change events, newest first by occurred_at descending then created_at descending, filtered by product, part, subject type, change kind or resample outcome."
    roles: [ComplianceAdministrator, TestCoordinator, CertificationOfficer]
    code: 200
    input: ["product_id?", "component_part_id?", "subject_type?", "change_kind?", "triggers_resample?", "limit?", "offset?"]
    output: MaterialChangeEvent[]
    side_effects: []

# -----------------------------------------------------------------------------
# §1.6 Error Catalog
# -----------------------------------------------------------------------------
errors:

  # --- auth / request shape ---------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "The X-User-ID header is absent or empty on any endpoint other than POST /compliance/_clock/set_current_utc."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles."
  - id: ERR_LAB_NOT_ASSIGNED
    http: 403
    condition: "A LaboratoryUser acts on a TestOrder whose laboratory_id is not the laboratory that backs the caller's identity."
  - id: ERR_SUPPLIER_NOT_PART_OWNER
    http: 403
    condition: "A SupplierUser submits or reads a component part certificate for a ComponentPart whose supplier_id is not the supplier that backs the caller's identity."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID that reported a test result also attempts to record reliance documentation, issue the certificate for the same product, or close the noncompliance case that the same result opened."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is absent, a field has the wrong type, an enum value is outside its declared value set, a numeric value is outside its declared range, batch_code or manufacture_date_month fails its regular expression, or limit/offset are outside 1..100 / >= 0."

  # --- existence (one id per entity) ------------------------------------------
  - id: ERR_RULE_NOT_FOUND
    http: 404
    condition: "No ApplicableRule exists with the referenced id, whether the reference arrives in the path or in a request body field."
  - id: ERR_CATEGORY_NOT_FOUND
    http: 404
    condition: "No ProductCategory exists with the referenced id."
  - id: ERR_MAPPING_NOT_FOUND
    http: 404
    condition: "No CategoryRuleMapping exists with the referenced id."
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "No Supplier exists with the referenced id."
  - id: ERR_LABORATORY_NOT_FOUND
    http: 404
    condition: "No Laboratory exists with the referenced id."
  - id: ERR_ACCREDITATION_NOT_FOUND
    http: 404
    condition: "No LabAccreditation exists with the referenced id."
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "No Product exists with the referenced id."
  - id: ERR_COMPONENT_PART_NOT_FOUND
    http: 404
    condition: "No ComponentPart exists with the referenced id, or the referenced part belongs to a different product than the one named in the path."
  - id: ERR_PART_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "No ComponentPartCertificate exists with the referenced id."
  - id: ERR_SAMPLING_PLAN_NOT_FOUND
    http: 404
    condition: "No SamplingPlan exists with the referenced id, or the referenced plan belongs to a different product than the order being booked."
  - id: ERR_TEST_ORDER_NOT_FOUND
    http: 404
    condition: "No TestOrder exists with the referenced id."
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "No ChildrensProductCertificate exists with the referenced id, or the referenced certificate belongs to a different product than the batch being recorded."
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No ProductionBatch exists with the referenced id."
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "No NoncomplianceCase exists with the referenced id."
  - id: ERR_MATERIAL_CHANGE_EVENT_NOT_FOUND
    http: 404
    condition: "No MaterialChangeEvent exists with the referenced id."

  # --- state (one id per state-machined entity) --------------------------------
  - id: ERR_PRODUCT_ARCHIVED
    http: 409
    condition: "Any write that touches a Product whose certification_state is ARCHIVED, or any write to a child row of such a product."
  - id: ERR_PRODUCT_STATE_INVALID
    http: 409
    condition: "The Product's certification_state is not a legal 'from' state for the requested transition: submit-for-certification outside DRAFT, certificate drafting outside EVIDENCE_COMPLETE, archive outside CERTIFIED."
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "The TestOrder's order_state is not a legal 'from' state: start-testing outside SCHEDULED, report-result outside IN_TESTING, cancel outside SCHEDULED or IN_TESTING."
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "The SamplingPlan's plan_state is not a legal 'from' state: activate outside DRAFT or RESAMPLE_DUE, periodic-review outside ACTIVE or RESAMPLE_DUE, booking a test order against a plan that is not ACTIVE."
  - id: ERR_CERTIFICATE_STATE_INVALID
    http: 409
    condition: "The ChildrensProductCertificate is not in a legal 'from' state on the dimension being moved: issue or void outside issuance_status DRAFT, furnish outside accompaniment_status NOT_FURNISHED with issuance_status ISSUED, recall-accompaniment outside accompaniment_status FURNISHED; also raised when a ProductionBatch release references a certificate that does not satisfy both axes at once, i.e. not (issuance_status ISSUED AND accompaniment_status FURNISHED)."
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "The ProductionBatch's distribution_state is not a legal 'from' state: release outside HELD, rescind-release outside RELEASED, tracking-label update on a DESTROYED batch."
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "The NoncomplianceCase's case_state is not a legal 'from' state: issue-stop-distribution outside OPEN, order-retest outside STOP_DISTRIBUTION_ISSUED or RETEST_FAILED, corrective-actions outside RETEST_PASSED or CORRECTIVE_ACTION_APPROVED, close outside CORRECTIVE_ACTION_APPROVED."
  - id: ERR_PART_CERTIFICATE_STATE_INVALID
    http: 409
    condition: "The ComponentPartCertificate's reliance_state is not SUBMITTED when reliance documentation is recorded, or is already RELIANCE_VOID."
  - id: ERR_ACCREDITATION_STATE_INVALID
    http: 409
    condition: "A suspension is requested against a LabAccreditation whose accreditation_state is already SUSPENDED or EXPIRED; both are terminal."

  # --- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version supplied to POST /compliance/products/{product_id}/certificates does not equal the stored Product.version, meaning the certifier drafted from a product snapshot that has since changed."
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version supplied to POST /compliance/noncompliance-cases/{case_id}/corrective-actions does not equal the stored NoncomplianceCase.version, meaning the corrective action was authored against a superseded case snapshot."

  # --- business safety (laboratory integrity, certificate integrity) ----------
  - id: ERR_LAB_BARRED
    http: 422
    condition: "The target Laboratory's operational_state is BARRED when a test order is booked against it, when it starts testing, or when a component part certificate naming it is relied upon."
  - id: ERR_UNDUE_INFLUENCE_ATTESTATION_MISSING
    http: 422
    condition: "The target Laboratory's influence_attestation_state is MISSING or EXPIRED, or influence_attestation_valid_through is at or before the logical clock instant, when work is assigned to it or when it starts testing."
  - id: ERR_MANUFACTURER_OWNED_LAB_FORBIDDEN
    http: 422
    condition: "The target Laboratory's independence_class is MANUFACTURER_OWNED and the work being assigned is third-party certification testing, which may not be performed by a manufacturer-owned laboratory."
  - id: ERR_LAB_METHOD_NOT_ACCREDITED
    http: 422
    condition: "The target Laboratory has no LabAccreditation in ACCREDITED whose rule_id equals the order's rule_id and whose closed interval [valid_from, valid_through] contains the order's window_start."
  - id: ERR_RELIANCE_AGREEMENT_MISSING
    http: 422
    condition: "Reliance is recorded on a component part certificate whose Supplier.reliance_agreement_state is NOT_ON_FILE."
  - id: ERR_CERTIFICATE_CONTENT_INCOMPLETE
    http: 422
    condition: "A certificate is issued while content_completeness_pct is below 100, that is, at least one of the seven required content slots is absent."
  - id: ERR_PRODUCT_POSTURE_NOT_CLEARED
    http: 422
    condition: "A certificate is issued, or a batch is released, while the Product's compliance_posture is UNSCOPED, RESTRICTED or SUSPENDED rather than CLEARED."
  - id: ERR_TRACKING_LABEL_NONCOMPLIANT
    http: 422
    condition: "A ProductionBatch is released while tracking_label_compliant is false, that is, the label is absent from the product or the packaging, or the production batch code is not printed."

  # --- business temporal ------------------------------------------------------
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "window_end is at or before window_start on a test order, or window_start precedes the logical clock, or coverage_through is at or before coverage_from on a component part certificate, or valid_through is at or before valid_from on an accreditation."
  - id: ERR_LAB_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "Booking the candidate order would raise peak_concurrency of half-open windows [window_start, window_end) at the laboratory above Laboratory.concurrent_slot_capacity; windows that merely touch end-to-start do not count as overlapping."
  - id: ERR_COMPONENT_COVERAGE_OVERLAP
    http: 409
    condition: "The candidate component part certificate's closed coverage interval [coverage_from, coverage_through], widened by COVERAGE_BUFFER_DAYS on both sides, intersects the closed coverage interval of an existing SUBMITTED or RELIED_UPON certificate for the same component part and rule."
  - id: ERR_PERIODIC_REVIEW_NOT_DUE
    http: 409
    condition: "A periodic review is run while the logical clock is strictly before SamplingPlan.periodic_due_at."
  - id: ERR_BATCH_OUTSIDE_CERTIFICATE_COVERAGE
    http: 422
    condition: "The batch's produced_on falls outside the calendar month named by the certificate's manufacture_date_month."

  # --- business referential ---------------------------------------------------
  - id: ERR_RULE_NOT_APPLICABLE_TO_PRODUCT
    http: 422
    condition: "The rule_id on a test order or component part certificate is not a member of the product's derived required_rule_ids."
  - id: ERR_COMPONENT_RELIANCE_NOT_ALLOWED
    http: 422
    condition: "Reliance is recorded on a component part certificate whose ApplicableRule.component_reliance_allowed is false, that is, the rule must be tested on the finished product."
  - id: ERR_EVIDENCE_PATH_MISMATCH
    http: 422
    condition: "Reliance documentation is recorded while Product.evidence_path is FULL_PRODUCT_TEST, or a product-level test order is booked for a rule already fully covered on the COMPONENT_RELIANCE path."
  - id: ERR_MAPPING_DUPLICATE
    http: 409
    condition: "A CategoryRuleMapping already exists in ACTIVE for the same (category_id, rule_id) pair."
  - id: ERR_PART_SUBJECT_MISMATCH
    http: 422
    condition: "A material change event declares subject_type COMPONENT_PART without component_part_id, declares subject_type PRODUCT with a component_part_id, or names a component part that does not belong to the named product."

  # --- business constraint / fiscal -------------------------------------------
  - id: ERR_NO_COMPONENT_PARTS
    http: 422
    condition: "A product is submitted for certification while it has no ComponentPart rows, so no rule applicability predicate can be evaluated."
  - id: ERR_NO_APPLICABLE_RULES
    http: 422
    condition: "Rule derivation for the product yields the empty set, so there is nothing to certify against."
  - id: ERR_SAMPLE_UNITS_EXHAUSTED
    http: 422
    condition: "The requested sample_count exceeds SamplingPlan.units_available."
  - id: ERR_SAMPLING_FLOOR_NOT_MET
    http: 422
    condition: "The computed units_authorized for the plan is below ProductCategory.sampling_floor_units, so the plan cannot be activated."
  - id: ERR_BATCH_CODE_DUPLICATE
    http: 409
    condition: "A ProductionBatch already exists with the same batch_code on the same product."
  - id: ERR_PRODUCT_TESTING_BUDGET_EXCEEDED
    http: 402
    condition: "The sum of invoice_total_cents over the product's SCHEDULED, IN_TESTING, REPORTED_PASS and REPORTED_FAIL test orders plus the candidate order's invoice_total_cents exceeds Product.testing_budget_cents."

# -----------------------------------------------------------------------------
# §1.7 RBAC Table
#
# Role model: segregation_of_duties. Every request carries X-User-ID (opaque
# string) and X-Role. Two duty separations are enforced by user id, not merely
# by role: (1) the user id that reported a test result may not later record
# reliance documentation or issue a certificate for the same product; (2) the
# user id that opened a noncompliance case by reporting the failing result may
# not close it. Both raise ERR_SEGREGATION_OF_DUTIES (403).
# -----------------------------------------------------------------------------
roles:

  - name: ComplianceAdministrator
    description: "Owns the regulatory reference data (rules, categories, mappings), the party register (suppliers, laboratories, accreditations), product registration and the immutable material-change log. Cannot book tests, cannot record reliance, cannot issue certificates and cannot move inventory."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/_clock/set_current_utc"
      - "POST /compliance/applicable-rules"
      - "POST /compliance/product-categories"
      - "POST /compliance/category-rule-mappings"
      - "POST /compliance/suppliers"
      - "POST /compliance/laboratories"
      - "POST /compliance/laboratories/{laboratory_id}/independence-attestations"
      - "POST /compliance/laboratories/{laboratory_id}/operational-state"
      - "POST /compliance/laboratories/{laboratory_id}/accreditations"
      - "POST /compliance/lab-accreditations/{accreditation_id}/suspend"
      - "POST /compliance/products"
      - "POST /compliance/products/{product_id}/component-parts"
      - "POST /compliance/products/{product_id}/archive"
      - "POST /compliance/material-change-events"
    shared_operations:
      - "GET /compliance/applicable-rules/{rule_id}"
      - "GET /compliance/applicable-rules"
      - "GET /compliance/product-categories/{category_id}"
      - "GET /compliance/category-rule-mappings/{mapping_id}"
      - "GET /compliance/category-rule-mappings"
      - "GET /compliance/suppliers/{supplier_id}"
      - "GET /compliance/laboratories/{laboratory_id}"
      - "GET /compliance/lab-accreditations/{accreditation_id}"
      - "GET /compliance/lab-accreditations"
      - "GET /compliance/products/{product_id}"
      - "GET /compliance/products"
      - "GET /compliance/products/{product_id}/compliance-summary"
      - "GET /compliance/component-parts/{part_id}"
      - "GET /compliance/component-parts"
      - "GET /compliance/component-part-certificates/{part_certificate_id}"
      - "GET /compliance/component-part-certificates"
      - "GET /compliance/sampling-plans/{plan_id}"
      - "GET /compliance/sampling-plans"
      - "GET /compliance/test-orders/{order_id}"
      - "GET /compliance/test-orders"
      - "GET /compliance/certificates/{certificate_id}"
      - "GET /compliance/certificates"
      - "GET /compliance/production-batches/{batch_id}"
      - "GET /compliance/production-batches"
      - "GET /compliance/noncompliance-cases/{case_id}"
      - "GET /compliance/noncompliance-cases"
      - "GET /compliance/material-change-events/{event_id}"
      - "GET /compliance/material-change-events"

  - name: TestCoordinator
    description: "Scopes products onto an evidence path, builds and maintains sampling plans, books third-party testing and orders retest rounds. Cannot accredit or bar laboratories, cannot report results, cannot issue certificates and cannot release inventory."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/products/{product_id}/submit-for-certification"
      - "POST /compliance/products/{product_id}/sampling-plans"
      - "POST /compliance/sampling-plans/{plan_id}/activate"
      - "POST /compliance/sampling-plans/{plan_id}/periodic-review"
      - "POST /compliance/test-orders"
      - "POST /compliance/test-orders/{order_id}/cancel"
      - "POST /compliance/noncompliance-cases/{case_id}/order-retest"
    shared_operations:
      - "GET /compliance/applicable-rules/{rule_id}"
      - "GET /compliance/applicable-rules"
      - "GET /compliance/product-categories/{category_id}"
      - "GET /compliance/category-rule-mappings/{mapping_id}"
      - "GET /compliance/category-rule-mappings"
      - "GET /compliance/laboratories/{laboratory_id}"
      - "GET /compliance/lab-accreditations/{accreditation_id}"
      - "GET /compliance/lab-accreditations"
      - "GET /compliance/products/{product_id}"
      - "GET /compliance/products"
      - "GET /compliance/products/{product_id}/compliance-summary"
      - "GET /compliance/component-parts/{part_id}"
      - "GET /compliance/component-parts"
      - "GET /compliance/component-part-certificates/{part_certificate_id}"
      - "GET /compliance/component-part-certificates"
      - "GET /compliance/sampling-plans/{plan_id}"
      - "GET /compliance/sampling-plans"
      - "GET /compliance/test-orders/{order_id}"
      - "GET /compliance/test-orders"
      - "GET /compliance/certificates/{certificate_id}"
      - "GET /compliance/certificates"
      - "GET /compliance/noncompliance-cases/{case_id}"
      - "GET /compliance/noncompliance-cases"

  - name: CertificationOfficer
    description: "Decides reliance on supplier component certificates, drafts and issues children's product certificates, files corrective action plans and closes noncompliance cases. Cannot book or report tests and cannot move inventory."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/component-part-certificates/{part_certificate_id}/reliance-documentation"
