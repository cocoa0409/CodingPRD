              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "Unknown Signal", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 150000 }
              as: RightsOpsAnalyst
              captures: { l1: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "Second Unknown", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 50000 }
              as: RightsOpsAnalyst
              captures: { l2: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
              captures: { bst: "$.data.status", up: "$.data.unmatched_play_count" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 100, gross_revenue_cents: 100001 }
              as: RoyaltyAdmin
              captures: { pl: "$.data.id" }
          trigger:
            - call: "POST /royalties/pools/${pl}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { d: "$.data.distributable_cents", b: "$.data.allocation_basis", den: "$.data.denominator_play_count", db: "$.data.denominator_basis", resid: "$.data.rounding_residual_cents", hold: "$.data.holding_cents", matched: "$.data.matched_attributed_cents" }
            - call: "GET /royalties/usage-lines/${l1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { a1: "$.data.attributed_revenue_cents", s1: "$.data.match_status" }
            - call: "GET /royalties/usage-lines/${l2}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { a2: "$.data.attributed_revenue_cents", s2: "$.data.match_status" }
            - call: "POST /royalties/pools/${pl}/finalize"
              payload: {}
              as: RoyaltyAdmin
              captures: { pst: "$.data.status", rp: "$.data.residual_payee_holder_id", resid2: "$.data.rounding_residual_cents", hold2: "$.data.holding_cents" }
            - call: "GET /royalties/periods/${per}"
              payload: {}
              as: RoyaltyAdmin
              captures: { perst: "$.data.status", perhold: "$.data.total_holding_cents" }
          assert:
            - "Both lines are UNMATCHED, so the batch is PARTIALLY_MATCHED with unmatched_play_count 200000."
            - "revenue_share_pool_cents = round_half_up(100001 * 7000 / 10000) = round_half_up(70000.7) = 70001; minimum_pool_cents 50000; cap 150000; statutory_floor_cents = ceil(200000 * 100 / 1000) = 20000; distributable_cents 70001 with allocation_basis REVENUE_SHARE."
            - "denominator_basis ALL_USAGE with denominator_play_count 200000 (the claim window closes 2026-08-29 and the clock is 2026-08-01), so unmatched lines DO receive attribution."
            - "Line attributions are floor(70001 * 150000 / 200000) = floor(52500.75) = 52500 and floor(70001 * 50000 / 200000) = floor(17500.25) = 17500; they sum to 70000, so rounding_residual_cents is exactly 1."
            - "holding_cents is 70000 and matched_attributed_cents is 0."
            - "finalize returns HTTP 200 with status FINALIZED and residual_payee_holder_id null — the empty-candidate fallback, not an error and not an arbitrary payee; rounding_residual_cents is still 1."
            - "The period is DISTRIBUTED with total_holding_cents 70000."

