  - rule_id: resource_temporal_overlap
    instances:
      - name: center_slot_overlap_uses_buffered_half_open_minute_intervals
        grounds:
          - calculations.center_slot_conflict_detection
          - validations.priority_48_ERR_CENTER_SLOT_CONFLICT
          - entities.CollectionCenter.fields.concurrent_collection_capacity
          - entities.CollectionCenter.fields.committed_slot_minutes
          - entities.CollectionBooking.fields.end_at
        distinguishing_aspect: |
          Resource: CollectionCenter. Interval semantics: half-open [start_at, end_at) minute intervals
          widened by a 90-minute turnaround buffer on BOTH sides of every existing booking, counted
          against an aggregate capacity. Two independent workup cases compete for one capacity-1 center:
          an 08:00-13:00 PBSC slot buffers out to [06:30, 14:30), so a 14:00 request collides while a
          14:30 request touching the buffer edge is accepted.
