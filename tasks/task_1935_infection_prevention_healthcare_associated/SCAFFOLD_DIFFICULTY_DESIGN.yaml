      assert:
      - IsolationComplianceAudit.${audit_id}.compliance_pct == 70.0 and outcome == NON_COMPLIANT
      - 'hop 1: IsolationOrder.${iso_id}.compliance_status == NON_COMPLIANT'
      - 'hop 2: exactly 1 CorrectiveActionPlan for unit with source_type == ISOLATION_AUDIT, source_ref_id == ${audit_id}, status == ACTIVE, created_by_user_id == ''system'', due_date == 2026-08-16T09:00:00Z
        (observed_at + 14 days)'
      - 'hop 3: Unit.${unit_id}.surveillance_posture == ELEVATED'
      - Unit version advanced beyond unit_v0 (posture recompute increments version)
  - name: adjudication_cluster_cascade_investigation_then_posture
    grounds:
    - calculations.outbreak_cluster_detection
    - state_machines.InfectionCase.UNDER_REVIEW_to_ADJUDICATED_HAI
    - state_machines.OutbreakInvestigation
    - entities.Unit.fields.surveillance_posture
    distinguishing_aspect: 'Depth-3 cascade from a different trigger (case adjudication, not

      audit): the 3rd adjudicated same-organism CLABSI in the 14-day window

      recomputes the cluster (hop 1: adjudication mutates the case and runs

      detection); crossing threshold 3 system-creates an

      OutbreakInvestigation TRIGGERED (hop 2); that creation recomputes

      Unit.surveillance_posture to ELEVATED (hop 3).

      '
