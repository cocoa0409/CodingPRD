              as: NetworkAdmin
              captures: { pv2: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p2}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv2}" }
              as: NetworkAdmin
              captures: { ag2: $.data.id }
          trigger:
            - call: "POST /fccn/enrollments/${e1}/transfer"
              payload: { receiving_provider_id: "${p2}", transfer_on: "2026-08-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { err_stage1: $.data.error_id }
            - call: "POST /fccn/membership-agreements/${ag2}/execute"
              as: Provider
              as_user_id: "${p2}"
            - call: "POST /fccn/enrollments/${e1}/transfer"
              payload: { receiving_provider_id: "${p2}", transfer_on: "2026-08-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { err_stage2: $.data.error_id }
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p2}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 1, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
