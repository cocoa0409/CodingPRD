  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: team_deploy_blocked_when_agreement_in_amendment_review
        grounds:
          - state_machines.Team.status.FORMING_to_DEPLOYED
          - state_machines.School.agreement_status.ACTIVE_to_AMENDMENT_REVIEW
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Team x School: the Team's FORMING -> DEPLOYED transition
          is gated on the School's agreement_status == ACTIVE; a school parked
          in AMENDMENT_REVIEW blocks deployment until the liaison confirms.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE, school ACTIVE, Team Alpha FORMING with one ACTIVE assignment (min staffing 1 met). School then amended into AMENDMENT_REVIEW."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_school
            - *k_ds_sign
            - *k_agr_sign
            - *k_agr_active
            - *k_team
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - *k_assign
            - call: "POST /corps/schools/${school_id}/amend"
              payload: { expected_school_version: "${school_v}", annual_cost_share_cents: 450000 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { sch_st: $.data.agreement_status }
          trigger:
            - call: "POST /corps/teams/${team_id}/state"
              payload: { to_status: "DEPLOYED" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { dep_err: $.data.error_id }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /corps/teams/${team_id}/state"
              payload: { to_status: "DEPLOYED" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { team_st: $.data.status }
          assert:
            - "${sch_st} == AMENDMENT_REVIEW"
            - "${dep_err} == ERR_AGREEMENT_NOT_ACTIVE (Team transition gated on School state — staffing was sufficient, so only the cross-entity gate can explain the rejection)"
            - "${team_st} == DEPLOYED (after the liaison closes the amendment loop the same transition succeeds)"

