  # ---------------------------------------------------- Distribution snapshots
  - method: POST
    path: "/distribution-snapshots"
    description: "Post one period of store-level distribution (append-only POSTING entry). Drives amortization, the void rate, the AT_RISK threshold and the whole downstream cascade. OCC on Authorization.version."
    roles: [RetailerBuyer]
    code: 201
    input: [authorization_id, expected_authorization_version, period_index, reported_store_count, distributed_store_count, reported_case_volume]
    output: DistributionSnapshot
    side_effects:
      - "step 1 — POSTING entry persisted (immutable); Authorization.periods_reported += 1"
      - "step 2 — Authorization distribution counters recomputed"
      - "step 3 — amortization posted to the linked deal when its state IN {AMORTIZING, RECOVERY_HOLD} (calculations.slotting_amortization); a zero balance moves the deal → RECOVERED and its authorizations → SLOTTING_RECOVERED"
      - "step 4 — void_rate_bps recomputed under the pinned basis (calculations.void_rate); AUTHORIZED⇄AT_RISK evaluated AFTER step 3, so a deal that just reached RECOVERED is never put on RECOVERY_HOLD"
      - "step 5 — linked deal AMORTIZING→RECOVERY_HOLD when an authorization entered AT_RISK with a remaining balance"
      - "step 6 — Principal aggregates, at_risk_authorization_count, liability_ratio_bps and credit_posture re-derived"
      - "increments Authorization.version by 1"

  - method: GET
    path: "/distribution-snapshots/{snapshotId}"
    description: "Read one immutable distribution ledger entry (POSTING or REVERSAL) including its amortized_amount_cents and is_reversed flag."
    roles: [BrokerAdmin, BrokerAccountManager, BrokerAuditManager, RetailerBuyer, PrincipalPortalUser]
    code: 200
    input: []
    output: DistributionSnapshot
    side_effects: []

  - method: GET
    path: "/distribution-snapshots"
    description: "List ledger entries filtered by authorization_id, reverses_snapshot_id or entry_kind, ordered created_at ASC (FK reverse-reachability for Authorization and for the self-referential reversal link)."
    roles: [BrokerAdmin, BrokerAccountManager, BrokerAuditManager, RetailerBuyer, PrincipalPortalUser]
    code: 200
    input: ["authorization_id?", "reverses_snapshot_id?", "entry_kind?", "period_index?", "limit?", "offset?"]
    output: DistributionSnapshot[]
    side_effects: []

  - method: POST
    path: "/distribution-snapshots/{snapshotId}/reverse"
    description: "Append a REVERSAL entry that un-posts the latest live POSTING. Never mutates the reversed entry — the ledger is append-only."
    roles: [RetailerBuyer]
    code: 201
    input: []
    output: DistributionSnapshot
    side_effects:
      - "REVERSAL entry created with reverses_snapshot_id set and amortized_amount_cents = -(reversed entry's amount); the reversed POSTING's is_reversed becomes true"
      - "Authorization.periods_reported -= 1 and counters recomputed from the new latest live POSTING"
      - "Deal recovered_cents / unamortized_balance_cents / periods_posted rolled back; RECOVERED→AMORTIZING and SLOTTING_RECOVERED→SLOTTING_AMORTIZING when the deal had closed"
      - "void_rate_bps recomputed; AT_RISK→AUTHORIZED and RECOVERY_HOLD→AMORTIZING when the rate drops back below the threshold"
      - "Principal aggregates and credit_posture re-derived"
      - "increments Authorization.version by 1"

