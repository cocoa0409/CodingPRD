          A single POST /forms body violates BOTH priority 22 (one cited item belongs to a
          different programme) and priority 35 (len(item_ids) is 2 against form_length 1). The
          scaffold pins referential integrity above the length constraint, so the response must
          be 422 ERR_ITEM_DOMAIN_MISMATCH and never ERR_FORM_LENGTH_MISMATCH; removing only the
          foreign item then exposes ERR_FORM_LENGTH_MISMATCH, proving both rules are live and
          only their order distinguishes the two responses.
        test_recipe:
          setup:
            - "Two ACTIVE programmes: CPX (credential_code CPX, form_length 1, domain_specs [{D1, 100, min_operational_items 1}]) and CPY (credential_code CPY, form_length 1, domain_specs [{D2, 100, min_operational_items 1}])."
