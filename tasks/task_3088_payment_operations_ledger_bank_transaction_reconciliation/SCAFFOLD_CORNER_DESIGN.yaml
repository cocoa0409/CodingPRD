        as: PlatformAdmin
      - call: POST /ledgers
        payload:
          name: Ops Ledger
          currency: USD
        as: PlatformAdmin
        captures:
          c2_ledger: $.data.id
          c2_ledger_v: $.data.version
      - call: POST /legal-entities
        payload:
          legal_name: Northwind Payments
          short_code: NWP-c2
          home_ledger_id: ${c2_ledger}
          entity_type: ORGANISATION
        as: PlatformAdmin
        captures:
          c2_entity: $.data.id
      - call: POST /counterparties
        payload:
          legal_entity_id: ${c2_entity}
          display_name: Delta Supply Co
          external_ref: DS-c2
