    output: TrendSignal
    side_effects:
      - "trend_signal_evaluation computes weighted_complaint_count, units_in_scope, observed_rate_ppm and threshold_ppm for the single declared scope, with NO waterfall"
      - "detection_source MANUAL; a SignalMembership is inserted per contributing complaint"
  - method: GET
    path: /trend-signals
    description: List trend signals with filters.
    roles: [QualityLead, CareSupervisor, RegulatoryOfficer]
    code: 200
    input: ["plant_id?", "production_line_id?", "lot_id?", "scope_level?", "status?", "detection_source?", "limit?", "offset?"]
    output: TrendSignal[]
    side_effects: []
  - method: GET
    path: /trend-signals/{id}
    description: Fetch one trend signal.
    roles: [QualityLead, CareSupervisor, RegulatoryOfficer]
    code: 200
    input: []
    output: TrendSignal
    side_effects: []
  - method: GET
    path: /trend-signals/{id}/memberships
    description: List the complaints that constitute one signal.
    roles: [QualityLead, CareSupervisor, RegulatoryOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: SignalMembership[]
    side_effects: []
  - method: POST
    path: /trend-signals/{id}/open-investigation
