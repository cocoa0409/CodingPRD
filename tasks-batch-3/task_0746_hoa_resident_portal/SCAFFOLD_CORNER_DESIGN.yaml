        distinguishing_aspect: "GET /ballots?homeowner_id=<x> returns only that homeowner's ballots (reverse-reachability for Ballot.homeowner_id)."
        test_recipe:
          setup:
            - "BoardMember BM. Two motions M1, M2. Two voters V1, V2. Each votes on both motions."
            - "Clock inside voting windows."
          setup_api_calls:
