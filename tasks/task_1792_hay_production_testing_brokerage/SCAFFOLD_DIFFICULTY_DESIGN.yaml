  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: deliver_fulfillment_credit_release_cascade
        grounds:
          - state_machines.DeliveryLoad.IN_TRANSIT_to_DELIVERED
          - state_machines.Contract.ACTIVE_to_FULFILLED
          - state_machines.BaleLot.ACTIVE_to_DEPLETED
          - entities.Buyer.fields.credit_used_cents
        distinguishing_aspect: |
          Depth-3 cascade from the deliver trigger: deliver mutates allocations/lot/contract tonnages
          (hop 1); the contract crossing delivered>=committed flips FULFILLED and the lot hitting zero
          flips DEPLETED (hop 2); fulfillment releases the buyer's credit reserve (hop 3). Each hop is
          caused by the previous hop's mutation, not by deliver directly.
        test_recipe:
          setup:
            - "Index OR-WILLAMETTE/ALFALFA @ 20000 (2026-05-01); lane OR-WILLAMETTE->CA-NORTH 420mi (freight 163170)"
            - "Buyer credit_limit 500000; quote PREMIUM 12.0t total 439170 accepted (credit_used 439170); Contract committed 12.0"
