        distinguishing_aspect: "One estimate multiplies four independently-derived factors — the [treatment x functional_class] rate matrix cell (RECONSTRUCTION x ARTERIAL = 13500), the width factor CLAMPED at 1.25 (raw 1.36 for a 60 ft street), the POOR condition penalty 1.05, and a mobilization addend outside the product — so 236,249,941 + 850,000 = 237,099,941; dropping the clamp yields 257,039,936 and dropping the penalty yields 224,999,944."
