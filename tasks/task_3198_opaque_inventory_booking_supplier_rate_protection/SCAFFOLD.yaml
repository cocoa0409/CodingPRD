    side_effects: ["payment_status → REFUNDED, fulfillment_status → SERVICE_FAILED", "supplier_remittance_cents and platform_commission_cents → 0", "RateWindow.rooms_sold -= 1; EXHAUSTED window reopens"]

  - method: POST
    path: "/opaque/bookings/{bookingId}/grant-goodwill"
    description: "Grant a partial goodwill refund on a CONFIRMED booking"
    roles: [CustomerService]
    code: 200
    input: []
    output: Booking
    side_effects: ["payment_status → PARTIALLY_REFUNDED"]

  # --- Complaint cases ---
  - method: POST
    path: "/opaque/complaint-cases"
    description: "Open a complaint case against a booking"
    roles: [Customer, CustomerService]
    code: 201
