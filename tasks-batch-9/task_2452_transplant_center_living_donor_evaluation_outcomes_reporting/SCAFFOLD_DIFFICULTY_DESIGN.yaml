      - GET /donor-candidates?program_id=${prog_id}&overall_status=CHAIN_COMMITTED returns an empty list,
        so the population side of the invariant is 0 and matches the summed committed_donor_count of 0
      - RecipientCandidate.${rec1_id}.listing_status == ACTIVE and RecipientCandidate.${rec2_id}.listing_status
        == ACTIVE (recipients return to the waitlist untouched)
