          assert:
            - "error_id == ERR_INSUFFICIENT_REMAINING_BALANCE, http 402; TerminationCase.${c_od}.expense_paid_cents == 0"

      - name: expense_blocked_when_payout_committed
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAYOUTS_ALREADY_COMMITTED]", "validations[priority=9]"]
        distinguishing_aspect: "Once any participant is ELECTION_ACCEPTED, expense allocations are rejected — payout amounts are already committed and must not be re-based."
        test_recipe:
          setup: ["Case in DISTRIBUTION_IN_PROGRESS; participant 200000 vested 100% with an ACCEPTED rollover election (payout ISSUED, not yet cleared)."]
