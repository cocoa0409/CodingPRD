              captures: { fs_id: $.data.id, floor: $.data.reserve_floor_cents }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201020", address: "1020 Juniper St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p1_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201021", address: "1021 Juniper St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p2_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p1_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 96000, title_search_fee_cents: 0 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk1_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p2_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 1000, title_search_fee_cents: 0 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk2_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk1_id}/board-approval"
              payload: { resolution_no: "R-2026-320" }
              as: BoardClerk
