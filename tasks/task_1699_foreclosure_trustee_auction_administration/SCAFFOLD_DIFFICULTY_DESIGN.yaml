            - { call: "POST /api/notices-of-trustee-sale/${nots_b}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_a}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pa2: $.data.id } }
