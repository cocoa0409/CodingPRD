              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "VOUCHING_ATTESTATION", vendor_code: "vouv1", assurance_weight: 30, acceptance_floor_bps: 6000, far_bps: 100, frr_bps: 700, strong_evidence: false, cost_cents: 60 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_vou_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2, alternative_pathway_enabled: true }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r3c-vouch", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "NO_STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s1_id}/alternative-pathways"
              payload: { pathway_type: "VOUCHING", voucher_reference: "VCH-1" }
