            - "ExaminationRequest.${r3}.status == OUTSOURCED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reassignment_conserves_total_committed_casework_hours
        grounds:
          - calculations.committed_casework_hours_invariant
          - state_machines.Assignment.ACTIVE_to_SUPERSEDED
          - state_machines.ExaminationRequest.ASSIGNED_to_ASSIGNED
          - concurrency_rules[assignment-create-stale-request]
          - calculations.analyst_workload_variants
          - entities.Assignment.fields.superseded_by_assignment_id
        distinguishing_aspect: |
          Reassignment is a paired debit and credit that must net to zero: the outgoing analyst is
          decremented by exactly the SNAPSHOTTED estimated_hours on the superseded Assignment row and
          the incoming analyst is credited the request's estimated_hours, so the sum of
          assigned_casework_hours across all analysts still equals the sum of estimated_hours over
          requests in ER_HOLD_SET. An implementation that credits without debiting, or that debits a
          recomputed rather than snapshotted figure, leaves the invariant at 12.00 instead of 6.00
          while every individual row still looks plausible.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z, so every stamp below is that instant."
            - "Analyst A1 and Analyst A2, both TRACE, competency 4, weekly_capacity_hours 40.00, training_hours_per_week 8.00 -> available_hours 32.00 each, assigned_casework_hours 0.00."
            - "Method M1 VALIDATED, TRACE, standard_hours_per_item 2.00, min_competency_level 3, max_items_per_request 6."
            - "Case C1 (PROPERTY_CRIME) ACCEPTED with one TRACE_MEDIA vault item E1."
            - "Request R1 (item_count 3) -> estimated_hours round_half_up(2.00 * 3, 2) == 6.00."
            - "First assignment to A1 bumps ExaminationRequest.version, so the reassignment must quote the re-read version rather than the creation version."
            - "Hand-executed workload formulas after the reassignment: A1 projected round_half_up(0.00 / 32.00 * 100, 2) == 0.00; A2 projected round_half_up(6.00 / 32.00 * 100, 2) == 18.75."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Marta Villareal", disciplines: ["TRACE"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/analysts"
              payload: { full_name: "Devon Achebe", disciplines: ["TRACE"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a2: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "FTIR Fibre and Paint Comparison", discipline: "TRACE", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 6, is_consumptive: false, accreditation_scope_code: "TR-FTIR-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 5.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "P-2026-1818", submitting_agency: "COUNTY SO", offense_category: "PROPERTY_CRIME", suspect_in_custody: false }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed tape lift with fibres", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 3 }
              as: CaseManager
              captures: { r1: $.data.id, r1_v1: $.data.version }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v1}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg1: $.data.id }
            - call: "GET /lab/examination-requests/${r1}"
              payload: {}
              as: CaseManager
              captures: { r1_v2: $.data.version }
          trigger:
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a2}", expected_examination_request_version: "${r1_v2}", assignment_reason: "WORKLOAD_BALANCE" }
              as: CaseManager
              captures: { asg2: $.data.id }
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: CaseManager
            - call: "GET /lab/analysts/${a2}/workload"
              payload: {}
              as: CaseManager
          assert:
            - "the reassignment returns HTTP 201"
            - "Assignment.${asg1}.status == SUPERSEDED"
            - "Assignment.${asg1}.superseded_by_assignment_id == ${asg2}"
            - "Assignment.${asg1}.closed_at_utc == 2026-08-01T00:00:00Z"
            - "Assignment.${asg1}.estimated_hours == 6.00"
            - "Assignment.${asg2}.status == ACTIVE and Assignment.${asg2}.estimated_hours == 6.00"
            - "Assignment.${asg2}.superseded_by_assignment_id is null"
            - "ExaminationRequest.${r1}.status == ASSIGNED"
            - "ExaminationRequest.${r1}.assigned_analyst_id == ${a2}"
            - "ExaminationRequest.${r1}.estimated_hours == 6.00"
            - "Analyst.${a1}.assigned_casework_hours == 0.00"
            - "Analyst.${a2}.assigned_casework_hours == 6.00"
            - "Analyst.${a1}.assigned_casework_hours + Analyst.${a2}.assigned_casework_hours == 6.00, exactly the sum of estimated_hours over requests in ER_HOLD_SET"
            - "workload of ${a1}: projected_load_hours == 0.00, projected_utilization_pct == 0.00, active_assignment_count == 0"
            - "workload of ${a2}: projected_load_hours == 6.00, projected_utilization_pct == 18.75, active_assignment_count == 1"
            - "count(Assignment where examination_request_id == ${r1}) == 2"

      - name: vendor_engagement_cancel_restores_encumbrance_with_zero_residue
        grounds:
          - state_machines.VendorEngagement.AT_VENDOR_to_CANCELLED
          - endpoints[POST /lab/vendor-engagements/{vendor_engagement_id}/cancel]
          - calculations.vendor_award_pricing
          - calculations.vendor_encumbrance_invariant
          - entities.Vendor.fields.encumbered_cents
          - entities.EvidenceItem.fields.checkout_count
        distinguishing_aspect: |
          A different compensation shape from the reassignment nets: cancel is the exact inverse of the
          award along the fiscal axis only. encumbered_cents must return to its pre-award 0 - not to an
          approximation recomputed from current pricing inputs, and not partially - while spent_cents
          stays 0 because no invoice was ever received, the engagement row still reports its historical
          award_amount_cents of 238050, and the physical axis is only partly reversed: the evidence item
          goes back IN_VAULT but its checkout_count stays at 1 because the shipment genuinely happened.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Vendor V1: [CHEMISTRY], accreditation_expires_at_utc 2027-01-01T00:00:00Z, concurrent_case_capacity 2, unit_price_cents 45000, rush_surcharge_pct 0.15, contract_ceiling_cents 10000000, encumbered_cents 0, spent_cents 0."
            - "Method M1 VALIDATED, CHEMISTRY, max_items_per_request 10."
            - "Case C1 (DRUG_OFFENSE) ACCEPTED with one CHEMICAL vault item E1 at checkout_count 0."
            - "Request R1 (item_count 5) awarded to V1 with rush_flag true over the closed window [2026-08-05T00:00:00Z, 2026-08-15T00:00:00Z]."
            - "Hand-executed pricing: base 45000 * 5 = 225000; rush round_half_up(225000 * 0.15, 0) = 33750; tier_basis 225000 + 33750 = 258750 which sits in the 250000 tier so volume_discount_pct 0.08; discount round_half_up(258750 * 0.08, 0) = 20700; award 258750 - 20700 = 238050."
            - "confirm-shipment then moves the engagement to AT_VENDOR and checks E1 out, so the cancel under test is the AT_VENDOR variant that must reverse two axes at once."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/vendors"
              payload: { name: "Northgate Forensic Labs", accredited_disciplines: ["CHEMISTRY"], accreditation_expires_at_utc: "2027-01-01T00:00:00Z", concurrent_case_capacity: 2, unit_price_cents: 45000, rush_surcharge_pct: 0.15, contract_ceiling_cents: 10000000 }
              as: LabDirector
              captures: { v1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "D-2026-1919", submitting_agency: "STATE PATROL", offense_category: "DRUG_OFFENSE", suspect_in_custody: false }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed bulk powder exhibit", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 5 }
              as: CaseManager
              captures: { r1: $.data.id }
            - call: "POST /lab/examination-requests/${r1}/vendor-engagements"
              payload: { vendor_id: "${v1}", window_start_utc: "2026-08-05T00:00:00Z", window_end_utc: "2026-08-15T00:00:00Z", rush_flag: true }
              as: CaseManager
              captures: { ve1: $.data.id, award: $.data.award_amount_cents }
            - call: "GET /lab/vendors/${v1}"
              payload: {}
              as: CaseManager
            - call: "POST /lab/vendor-engagements/${ve1}/confirm-shipment"
              payload: { shipment_note: "Two sealed transport containers dispatched by courier." }
              as: CaseManager
          trigger:
            - call: "POST /lab/vendor-engagements/${ve1}/cancel"
              payload: { cancellation_reason: "Vendor withdrew capacity before analysis began." }
              as: CaseManager
            - call: "GET /lab/vendors/${v1}"
              payload: {}
              as: CaseManager
            - call: "GET /lab/evidence-items/${e1}"
              payload: {}
              as: EvidenceTechnician
          assert:
            - "${award} == 238050"
            - "the vendor read taken before confirm-shipment shows encumbered_cents == 238050 and spent_cents == 0"
            - "after confirm-shipment: VendorEngagement.${ve1}.status was AT_VENDOR and EvidenceItem.${e1}.checkout_count == 1"
            - "the cancel returns HTTP 200"
            - "VendorEngagement.${ve1}.status == CANCELLED"
            - "VendorEngagement.${ve1}.award_amount_cents == 238050, unchanged by the cancel"
            - "VendorEngagement.${ve1}.rush_surcharge_cents == 33750 and VendorEngagement.${ve1}.discount_amount_cents == 20700"
            - "Vendor.${v1}.encumbered_cents == 0, exactly the pre-award value with no residue"
            - "Vendor.${v1}.spent_cents == 0"
            - "ExaminationRequest.${r1}.status == QUEUED"
            - "ExaminationRequest.${r1}.assigned_analyst_id is null"
            - "EvidenceItem.${e1}.custody_status == IN_VAULT"
            - "EvidenceItem.${e1}.checkout_count == 1, not reset to 0 by the compensation"
            - "Case.${c1}.workflow_status == AWAITING_ASSIGNMENT"
            - "count(VendorEngagement where vendor_id == ${v1} and status == CANCELLED) == 1"
