  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_final_invoice_drives_contract_exhausted_chain
        grounds:
          - state_machines.Cohort.DELIVERED_to_CLOSED
          - calculations.invoice_totals
          - calculations.contract_drawdown
          - state_machines.EnterpriseContract.ACTIVE_to_EXHAUSTED
          - entities.EnterpriseContract.fields.committed_cents
        distinguishing_aspect: |
          Depth-3 chain from a single trigger (close): close(Cohort) computes the FINAL Invoice over ATTENDED seats (L1);
          that FINAL invoice total is then drawn against the sponsoring contract, incrementing committed_cents (L2);
          committed_cents reaching budget_cents itself drives the contract ACTIVE->EXHAUSTED (L3). Each link is caused
          by the previous link, not directly by close.
        test_recipe:
          setup:
            - "Contract budget_cents=115000; PER_SEAT ONSITE cohort delivered with exactly 2 ATTENDED -> FINAL 115000"
          setup_api_calls:
            - call: "POST /training/contracts"
              payload: { client_name: "Chain Co", budget_cents: 115000 }
              as: FinanceManager
              captures: { ctr_id: $.data.id }
            - call: "POST /training/programs"
              payload: { title: "Chain Prog", category: "TECHNICAL", delivery_mode: "ONSITE", ceu_credits: 10 }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
