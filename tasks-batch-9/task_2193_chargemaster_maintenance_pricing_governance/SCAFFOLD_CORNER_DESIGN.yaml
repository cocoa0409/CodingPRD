              captures: { e_cr_w: $.data.error_id }
            - call: "GET /chargemaster/code-update-cycles/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_cycle: $.data.error_id }
            - call: "POST /chargemaster/code-update-cycles/00000000-0000-0000-0000-0000000000ff/entries"
              payload: { action: "ADD", new_code_value: "0001U" }
              as: RevenueIntegrityAnalyst
              captures: { e_cycle_w: $.data.error_id }
            - call: "GET /chargemaster/code-update-entries/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_entry: $.data.error_id }
            - call: "POST /chargemaster/code-update-entries/00000000-0000-0000-0000-0000000000ff/disposition"
              payload: { action: "DEFER", defer_reason: "no target" }
