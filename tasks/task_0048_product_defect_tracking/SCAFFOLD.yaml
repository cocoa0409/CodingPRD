# =============================================================================
# task_0048_product_defect_tracking — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  Product defect tracking system: defect reporting with defect-source classification
  (internal-test/user-feedback/online-monitoring), reproduction steps, environment
  information, attachment upload (screenshot/log/video), and duplicate-defect
  detection; severity rating with severity classification
  (blocker/critical/major/minor/trivial), priority rating, business-impact
  assessment, rating override approval, and severity-distribution analysis;
  assignment and routing with module-owner mapping, assignee workload balancing,
  reassignment workflow, status flow
  (new/assigned/in-progress/fixed/verified/reopened/closed), and SLA-driven
  escalation; fix verification with fix-version association, verification-test
  execution, verifier independence rules, reopen on verification failure, and
  verification record archiving; regression test linkage with related-test-case
  association, regression-test-suite execution trigger, regression-result
  feedback, and impact-scope analysis; SLA time-limit monitoring with
  response-time and resolution-time SLA by severity, SLA pause for
  waiting-on-reporter, SLA breach warning and escalation, and SLA-performance
  reporting; statistics aggregation with defect distribution by
  module/severity/assignee/period, defect density and removal rate, reopen rate,
  and trend analysis; event-driven synchronization with version control, CI/CD,
  and IM systems; audit logging for status changes and severity adjustments.

domain_name: product-defect-tracking
api_prefix: /projects

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - segregation_of_duties

  entity_topology: hybrid
  # Project owns Modules and TeamMembers (tree branch); Defect is a flat peer that
  # references Module + assignee + reporter; SeverityOverride, FixRecord,
  # VerificationRecord, RegressionRun, SLAPause, DefectAttachment, DuplicateLink,
  # and AuditEntry hang off Defect in a star pattern (cross-cutting associations).

  state_machine_shape: cyclic
  # Defect.status has a REOPENED→ASSIGNED back-edge (verification-failure loop);
  # Defect carries a parallel sla_state dimension; SeverityOverride exhibits
  # branching fork (PENDING → {APPROVED, REJECTED}).

  relationship_patterns:
    - one_to_many       # Project→Modules, Project→TeamMembers, Defect→Attachments
    - many_to_many      # DuplicateLink between two Defects (junction entity)
    - cross_aggregate   # Defect references TeamMember (assignee, reporter) and Module across aggregate boundaries

  role_model: segregation_of_duties
  # Verifier must NOT be the same TeamMember as the fix submitter for the same
  # Defect; SeverityOverride approver must not be the override requester.

  consistency_model: immediate
  # All cascades execute atomically within the request that triggered them
  # (e.g., verification fail → defect REOPENED → priority recompute → SLA reset →
  # AuditEntry written in one transaction).

# =============================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: project_key, type: string, source: input, description: "Short project key, e.g. 'PAYMENTS'" }
      - { name: name, type: string, source: input, description: "Human-readable project name" }
      - { name: clock_minute, type: integer, source: system, default: 0, description: "Project-local virtual clock in minutes since project creation; advanced only via POST /_clock/advance" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", constraints: "values produced by /projects/{id}/archive transition" }

  - name: Module
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Parent project id" }
      - { name: module_key, type: string, source: input, description: "Short module key, unique within project" }
      - { name: owner_team_member_id, type: string, source: input, description: "Default assignee for new defects against this module (workload balancing fallback)" }
      - { name: kloc, type: number, source: input, description: "Module size in thousands of lines of code; required > 0; used as denominator in defect_density" }
      - { name: initial_defect_quota, type: integer, source: input, description: "Maximum simultaneous non-terminal defects allowed on this module; required >= 1" }
      - { name: active_defect_count, type: integer, source: computed, default: 0, description: "Count of non-terminal Defect rows where module_id = self.id and status NOT IN {CLOSED}" }
      - { name: quota_remaining, type: integer, source: computed, description: "Read-only invariant: initial_defect_quota - active_defect_count; never below 0 in any committed state" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", constraints: "values produced by /projects/{pid}/modules/{mid}/archive transition" }

  - name: TeamMember
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Parent project id" }
      - { name: display_name, type: string, source: input, description: "Team member display name" }
      - { name: role, type: enum, source: input, description: "DEVELOPER | QA_ENGINEER | TRIAGE_MANAGER | RELEASE_MANAGER", constraints: "Used in RBAC ownership checks" }
      - { name: active_workload, type: integer, source: computed, default: 0, description: "Count of non-terminal Defects assigned to this member; incremented on assign, decremented on reassign or close" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", constraints: "Inactive members may not be assigned new defects" }

  - name: Defect
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "Owning project id" }
      - { name: module_id, type: string, source: input, description: "Module the defect is filed against" }
      - { name: reporter_id, type: string, source: input, description: "TeamMember.id of the reporter" }
      - { name: assignee_id, type: string, source: computed, description: "TeamMember.id; nullable when status=NEW; set on assign/reassign" }
      - { name: title, type: string, source: input, description: "Defect short title" }
      - { name: defect_source, type: enum, source: input, description: "INTERNAL_TEST | USER_FEEDBACK | ONLINE_MONITORING" }
      - { name: severity, type: enum, source: input, description: "BLOCKER | CRITICAL | MAJOR | MINOR | TRIVIAL — initial severity at report time" }
      - { name: effective_severity, type: enum, source: computed, description: "Severity in force after any approved SeverityOverride; equals severity when none approved" }
      - { name: business_impact, type: enum, source: input, default: "UNKNOWN", description: "REVENUE_BLOCKING | CUSTOMER_FACING | INTERNAL | UNKNOWN — required at time of report" }
      - { name: reproduction_steps, type: string, source: input, description: "Free-text reproduction steps" }
      - { name: environment, type: object, source: input, description: "Environment payload: {os, browser, app_version, build_id}; all four sub-keys required" }
      - { name: priority_score, type: number, source: computed, description: "Computed by severity_priority_score calculation; recomputed on report, severity-override approval, reopen, and clock-advance" }
      - { name: status, type: enum, source: system, description: "NEW | ASSIGNED | IN_PROGRESS | FIXED | VERIFIED | REOPENED | CLOSED", constraints: "REOPENED produced only by failed verification transition" }
      - { name: sla_state, type: enum, source: system, default: "RUNNING", description: "RUNNING | PAUSED — parallel dimension to status; pause only allowed while status IN {ASSIGNED, IN_PROGRESS}" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Number of times this defect has transitioned into REOPENED" }
      - { name: total_paused_minutes, type: integer, source: computed, default: 0, description: "Sum of completed SLAPause durations; updated only on resume transition" }
      - { name: report_clock_minute, type: integer, source: system, description: "Project.clock_minute snapshot at the moment this defect was created; immutable for the life of the defect" }
      - { name: first_fixed_at_minute, type: integer, source: computed, description: "Project.clock_minute at which status first became FIXED; populated once on the first IN_PROGRESS → FIXED transition and never overwritten on subsequent reopen→fix cycles; null until first FIXED" }
      - { name: response_due_minute, type: integer, source: computed, description: "Project clock_minute by which first assignment must occur; computed at report time from response_sla_minutes" }
      - { name: resolution_due_minute, type: integer, source: computed, description: "Project clock_minute by which status must reach FIXED; computed at report time from resolution_sla_minutes" }
      - { name: escalation_level, type: integer, source: computed, default: 0, description: "0 | 1 | 2 — bumped by sweep when SLA breach observed, never decreases until close" }
      - { name: canonical_defect_id, type: string, source: computed, description: "Set when this defect is linked as duplicate of another; null when this defect is canonical" }
      - { name: fix_version, type: string, source: computed, description: "Set on submit-fix; copied from FixRecord.fix_version" }
      - { name: final_resolution_minutes, type: integer, source: computed, description: "Wall-time minutes from creation to first FIXED entry, MINUS total_paused_minutes; populated when status first becomes FIXED" }

  - name: DefectAttachment
    parent: Defect
    common_fields: false   # immutable append-only
    fields:
      - { name: defect_id, type: string, source: system, description: "Parent defect id" }
      - { name: attachment_type, type: enum, source: input, description: "SCREENSHOT | LOG | VIDEO" }
      - { name: filename, type: string, source: input, description: "Original filename; required non-empty" }
      - { name: size_bytes, type: integer, source: input, description: "Required > 0; per-type cap enforced (SCREENSHOT <= 5MB, LOG <= 10MB, VIDEO <= 200MB)" }
      - { name: uploaded_by, type: string, source: system, description: "TeamMember.id of uploader" }

  - name: DuplicateLink
    parent: null
    common_fields: false   # immutable junction
    fields:
      - { name: duplicate_defect_id, type: string, source: input, description: "Defect being marked as duplicate (must be in status NEW)" }
      - { name: canonical_defect_id, type: string, source: input, description: "Defect that is the canonical, non-duplicate report (must be non-terminal and not itself a duplicate)" }
      - { name: linked_by, type: string, source: system, description: "TeamMember.id of triage actor who linked" }
      - { name: similarity_score, type: number, source: input, description: "0.0–1.0 similarity heuristic supplied by client; rejected if < 0.5" }

  - name: SeverityOverride
    parent: Defect
    common_fields: true
    fields:
      - { name: defect_id, type: string, source: system, description: "Parent defect id" }
      - { name: requested_severity, type: enum, source: input, description: "BLOCKER | CRITICAL | MAJOR | MINOR | TRIVIAL — proposed new severity" }
      - { name: justification, type: string, source: input, description: "Required free-text business justification" }
      - { name: requested_by, type: string, source: system, description: "TeamMember.id of requester" }
      - { name: approved_by, type: string, source: computed, description: "TeamMember.id of approver; populated only when status=APPROVED" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", constraints: "APPROVED produced by /approve, REJECTED by /reject; both terminal" }

  - name: FixRecord
    parent: Defect
    common_fields: false   # append-only
    fields:
      - { name: defect_id, type: string, source: system, description: "Parent defect id" }
      - { name: fix_version, type: string, source: input, description: "Version string the fix targets, e.g. '2.7.4'" }
      - { name: developer_id, type: string, source: system, description: "TeamMember.id of submitter (same as defect.assignee_id at submit time)" }
      - { name: fix_summary, type: string, source: input, description: "Short description of what was changed" }
      - { name: commit_sha, type: string, source: input, description: "VCS commit hash; supplied by client (validated 7–64 hex chars)" }

  - name: VerificationRecord
    parent: Defect
    common_fields: false   # append-only archive
    fields:
      - { name: defect_id, type: string, source: system, description: "Parent defect id" }
      - { name: fix_record_id, type: string, source: system, description: "Specific FixRecord being verified" }
      - { name: verifier_id, type: string, source: system, description: "TeamMember.id of verifier (must NOT equal FixRecord.developer_id — segregation of duties)" }
      - { name: outcome, type: enum, source: input, description: "PASSED | FAILED" }
      - { name: notes, type: string, source: input, description: "Optional verifier notes" }

  - name: RegressionRun
    parent: null
    common_fields: true
    fields:
      - { name: defect_id, type: string, source: input, description: "Defect whose fix triggered the run" }
      - { name: module_id, type: string, source: computed, description: "Copied from defect.module_id at queue time; pins which module's cooldown buffer applies" }
      - { name: test_suite_key, type: string, source: input, description: "Identifier of the regression test suite" }
      - { name: started_at_minute, type: integer, source: system, description: "Project clock_minute at queue (start) time" }
      - { name: ended_at_minute, type: integer, source: computed, description: "Project clock_minute at completion; null while QUEUED or RUNNING" }
      - { name: result, type: enum, source: computed, description: "PASSED | FAILED — populated by /complete" }
      - { name: impact_scope, type: array, source: input, description: "List of module_ids the regression covered; must include defect.module_id" }
      - { name: status, type: enum, source: system, description: "QUEUED | RUNNING | PASSED | FAILED", constraints: "PASSED/FAILED produced by /regression-runs/{id}/complete" }

  - name: SLAPause
    parent: Defect
    common_fields: false   # append-only interval log
    fields:
      - { name: defect_id, type: string, source: system, description: "Parent defect id" }
      - { name: started_at_minute, type: integer, source: system, description: "Project clock_minute at pause; inclusive" }
      - { name: ended_at_minute, type: integer, source: computed, description: "Project clock_minute at resume; exclusive (half-open [start, end)); null while pause is open" }
      - { name: reason, type: enum, source: input, description: "WAITING_ON_REPORTER | WAITING_ON_THIRD_PARTY" }
      - { name: paused_by, type: string, source: system, description: "TeamMember.id of actor who paused" }

  - name: AuditEntry
    parent: null
    common_fields: false   # append-only log
    fields:
      - { name: defect_id, type: string, source: system, description: "Defect whose state was mutated" }
      - { name: event_type, type: enum, source: system, description: "STATUS_CHANGE | SEVERITY_CHANGE | ASSIGNMENT_CHANGE | SLA_PAUSE | SLA_RESUME | ESCALATION | EXTERNAL_EVENT_SYNC" }
      - { name: actor_id, type: string, source: system, description: "TeamMember.id of acting user, or literal 'system' for sweep/clock events" }
      - { name: from_value, type: string, source: system, description: "Prior value as string (e.g., 'ASSIGNED', 'MAJOR'); null for create events" }
      - { name: to_value, type: string, source: system, description: "New value as string" }
      - { name: at_minute, type: integer, source: system, description: "Project clock_minute at time of event" }
      - { name: external_payload, type: object, source: system, description: "For EXTERNAL_EVENT_SYNC: {system: VCS|CI_CD|IM, raw: {...}}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Project
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /projects/{projectId}/archive"
        actor: TriageManager
        preconditions:
          - "No non-terminal Defect rows where project_id = self.id (i.e., zero Defects with status IN {NEW, ASSIGNED, IN_PROGRESS, FIXED, VERIFIED, REOPENED})"
        side_effects:
          - "All child Modules transition ACTIVE → ARCHIVED in the same transaction"
          - "AuditEntry { event_type: STATUS_CHANGE, defect_id: <null project-scoped>, from_value: ACTIVE, to_value: ARCHIVED } written per affected entity"

  - entity: Module
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /projects/{projectId}/modules/{moduleId}/archive | cascaded from Project ACTIVE → ARCHIVED"
        actor: TriageManager
        preconditions:
          - "Module.active_defect_count == 0 (ERR_MODULE_HAS_ACTIVE_DEFECTS) — checked unless cascaded from project archive (cascade fails entire request if any module has active defects, surfacing the same error against the project endpoint)"
        side_effects:
          - "All FixRecord/VerificationRecord rows for this module's defects remain readable; no defect mutation"

  - entity: Defect
    initial_state: NEW
    terminal_states: [CLOSED]
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "POST /defects/{defectId}/assign  body: {assignee_id}"
        actor: TriageManager
        preconditions:
          - "TeamMember with id=assignee_id exists, is ACTIVE, and project_id matches defect.project_id"
          - "Module.status == ACTIVE (cross-entity: ERR_MODULE_ARCHIVED)"
          - "If body.assignee_id is omitted, server selects assignee per workload-balancing selector (see selector pinned in §1.3 calculations.assignee_selector)"
        side_effects:
          - "Set defect.assignee_id"
          - "Increment TeamMember.active_workload by 1 for the new assignee"
          - "response_due_minute is NOT mutated here — it was set at defect creation (POST /defects) and is only reset by REOPEN or SeverityOverride approval"
          - "Append AuditEntry { event_type: ASSIGNMENT_CHANGE, from_value: null, to_value: assignee_id, at_minute: project.clock_minute }"

      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /defects/{defectId}/reassign  body: {new_assignee_id}"
        actor: TriageManager
        preconditions:
          - "new_assignee_id != current assignee_id (ERR_REASSIGN_SAME_ASSIGNEE)"
          - "new TeamMember is ACTIVE and project_id matches defect.project_id"
        side_effects:
          - "Decrement old assignee's active_workload by 1; increment new assignee's active_workload by 1"
          - "Append AuditEntry { event_type: ASSIGNMENT_CHANGE, from_value: old, to_value: new }"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /defects/{defectId}/start-progress"
        actor: Developer
        preconditions:
          - "X-User-ID == defect.assignee_id (ownership)"
          - "defect.sla_state == RUNNING"
        side_effects:
          - "Append AuditEntry { event_type: STATUS_CHANGE, from_value: ASSIGNED, to_value: IN_PROGRESS }"

      - from: IN_PROGRESS
        to: FIXED
        trigger: "POST /defects/{defectId}/submit-fix  body: {fix_version, fix_summary, commit_sha}"
        actor: Developer
        preconditions:
          - "X-User-ID == defect.assignee_id (ownership)"
          - "Module.status == ACTIVE  (cross-entity: ERR_MODULE_ARCHIVED)"
        side_effects:
          - "Create FixRecord with developer_id = defect.assignee_id"
          - "Set defect.fix_version = FixRecord.fix_version"
          - "If defect.first_fixed_at_minute is null, set defect.first_fixed_at_minute = project.clock_minute (only on the first FIXED entry; subsequent reopen→fix cycles do NOT overwrite)"
          - "Set defect.final_resolution_minutes = project.clock_minute - defect.report_clock_minute - defect.total_paused_minutes (populated only on first FIXED entry)"
          - "Append AuditEntry { event_type: STATUS_CHANGE, from_value: IN_PROGRESS, to_value: FIXED }"

      - from: FIXED
        to: VERIFIED
        trigger: "POST /defects/{defectId}/verify  body: {outcome: PASSED, fix_record_id, notes?}"
        actor: QAEngineer
        preconditions:
          - "X-User-ID != FixRecord.developer_id (segregation of duties: ERR_VERIFIER_NOT_INDEPENDENT)"
          - "fix_record_id references the latest FixRecord for this defect (ERR_FIX_RECORD_STALE)"
        side_effects:
          - "Create VerificationRecord { outcome: PASSED }"
          - "Append AuditEntry { event_type: STATUS_CHANGE, from_value: FIXED, to_value: VERIFIED }"

      - from: FIXED
        to: REOPENED
        trigger: "POST /defects/{defectId}/verify  body: {outcome: FAILED, fix_record_id, notes?}"
        actor: QAEngineer
        preconditions:
          - "X-User-ID != FixRecord.developer_id (ERR_VERIFIER_NOT_INDEPENDENT)"
          - "fix_record_id references the latest FixRecord for this defect (ERR_FIX_RECORD_STALE)"
        side_effects:
          - "Create VerificationRecord { outcome: FAILED }"
          - "Increment defect.reopen_count by 1  (link 1)"
          - "Recompute defect.priority_score via severity_priority_score using the new reopen_count  (link 2 — caused by link 1)"
          - "Recompute defect.response_due_minute = project.clock_minute + effective_response_sla_minutes (where effective_response_sla_minutes is derived per effective_sla_minutes calc, keyed on the freshly-recomputed priority_score from link 2)  (link 3 — caused by link 2; the SLA clock restarts at the current project time, not the original report time)"
          - "Append AuditEntry { event_type: STATUS_CHANGE, from_value: FIXED, to_value: REOPENED }  (link 4)"
          - "Append second AuditEntry { event_type: ESCALATION, from_value: defect.escalation_level, to_value: 0 } — reopen resets escalation_level to 0 (link 5)"

      - from: REOPENED
        to: ASSIGNED
        trigger: "POST /defects/{defectId}/assign  body: {assignee_id}"
        actor: TriageManager
        preconditions:
          - "TeamMember with id=assignee_id exists, is ACTIVE"
          - "assignee_id != FixRecord.developer_id is NOT required — same developer may be reassigned (only verifier independence is enforced; assignment independence is not)"
        side_effects:
          - "If new assignee differs from prior assignee, adjust active_workload counters"
          - "Append AuditEntry { event_type: ASSIGNMENT_CHANGE }"

      - from: VERIFIED
        to: CLOSED
        trigger: "POST /defects/{defectId}/close"
        actor: TriageManager
        preconditions:
          - "If any RegressionRun for this defect exists, every one must be in PASSED status (ERR_REGRESSION_NOT_PASSED). If zero RegressionRun rows exist, defect MAY close without regression (suite is optional)."
        side_effects:
          - "Decrement assignee.active_workload by 1"
          - "Decrement Module.active_defect_count by 1"
          - "Increment Module.quota_remaining by 1  (invariant: initial_defect_quota == quota_remaining + active_defect_count)"
          - "Append AuditEntry { event_type: STATUS_CHANGE, from_value: VERIFIED, to_value: CLOSED }"

  - entity: Defect  # parallel sla_state dimension on the same row
    initial_state: RUNNING
    terminal_states: []
    transitions:
      - from: RUNNING
        to: PAUSED
        trigger: "POST /defects/{defectId}/pause-sla  body: {reason}"
        actor: Developer
        preconditions:
          - "defect.status IN {ASSIGNED, IN_PROGRESS}  (ERR_SLA_PAUSE_INVALID_STATUS)"
          - "X-User-ID == defect.assignee_id"
          - "No SLAPause row for this defect has ended_at_minute = null (i.e., no open pause already exists)"
          - "If the most recently closed SLAPause for this defect exists, project.clock_minute > that row's ended_at_minute (no zero-length adjacency-overlap on the same defect; consecutive pauses must be strictly separated — note SLAPause intervals are half-open [start, end), so ended_at_minute = X allows a new pause starting at X+1 or later)"
        side_effects:
          - "Create new SLAPause { started_at_minute: project.clock_minute, ended_at_minute: null }"
          - "Append AuditEntry { event_type: SLA_PAUSE }"

      - from: PAUSED
        to: RUNNING
        trigger: "POST /defects/{defectId}/resume-sla"
        actor: Developer
        preconditions:
          - "X-User-ID == defect.assignee_id"
          - "An SLAPause row with ended_at_minute = null exists"
        side_effects:
          - "Close that SLAPause: ended_at_minute = project.clock_minute"
          - "Increment defect.total_paused_minutes by (ended_at_minute - started_at_minute)  (compensating invariant: total_paused_minutes + active_running_minutes == project.clock_minute - defect.report_clock_minute)"
          - "Append AuditEntry { event_type: SLA_RESUME }"

  - entity: SeverityOverride
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /severity-overrides/{overrideId}/approve"
        actor: TriageManager
        preconditions:
          - "X-User-ID != SeverityOverride.requested_by (segregation of duties: ERR_OVERRIDE_APPROVER_NOT_INDEPENDENT)"
          - "Parent Defect.status != CLOSED (cross-entity state: ERR_DEFECT_CLOSED)"
        side_effects:
          - "Set defect.effective_severity = SeverityOverride.requested_severity  (link 1)"
          - "Recompute defect.priority_score via severity_priority_score  (link 2 — caused by link 1)"
          - "Recompute defect.response_due_minute and defect.resolution_due_minute using response_sla_minutes/resolution_sla_minutes keyed on the NEW effective_severity (relative to the original report time, NOT the override approval time)  (link 3 — caused by link 1)"
          - "Append AuditEntry { event_type: SEVERITY_CHANGE, from_value: old effective_severity, to_value: new }  (link 4)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /severity-overrides/{overrideId}/reject"
        actor: TriageManager
        preconditions:
          - "X-User-ID != SeverityOverride.requested_by"
        side_effects:
          - "No changes to parent defect"
          - "Append AuditEntry { event_type: SEVERITY_CHANGE, from_value: <existing>, to_value: <existing>, external_payload: {override_id, decision: REJECTED} }"

  - entity: RegressionRun
    initial_state: QUEUED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "system (automatic on /regression-runs/{id}/start)"
        actor: ReleaseManager
        preconditions:
          - "Parent defect.status IN {FIXED, VERIFIED}"
          - "Module-cooldown: among prior RegressionRuns X on the same module_id with status IN {RUNNING, PASSED, FAILED} (i.e., runs that actually started), let X* be the one with the maximum started_at_minute. Require project.clock_minute - X*.started_at_minute >= REGRESSION_COOLDOWN_MINUTES (=10). When no such X* exists (this is the first started run on the module), the check passes. Boundary is INCLUSIVE: equality at exactly REGRESSION_COOLDOWN_MINUTES permits the start (ERR_REGRESSION_COOLDOWN_ACTIVE on failure)"
        side_effects: []

      - from: RUNNING
        to: PASSED
        trigger: "POST /regression-runs/{regressionRunId}/complete  body: {result: PASSED}"
        actor: ReleaseManager
        preconditions: []
        side_effects:
          - "Set ended_at_minute = project.clock_minute"
          - "Emit external event sync: AuditEntry { event_type: EXTERNAL_EVENT_SYNC, external_payload: {system: CI_CD, raw: {run_id, status: PASSED}} }"

      - from: RUNNING
        to: FAILED
        trigger: "POST /regression-runs/{regressionRunId}/complete  body: {result: FAILED}"
        actor: ReleaseManager
        preconditions: []
        side_effects:
          - "Set ended_at_minute = project.clock_minute"
          - "Defect reopens IF status == VERIFIED at the time the regression FAILED  (link 1)"
          - "Reopen cascade: REOPENED transition fires its full side_effects chain (reopen_count++, priority_score recompute, response_due_minute reset, AuditEntry trail)  (link 2 — caused by link 1)"
          - "AuditEntry { event_type: EXTERNAL_EVENT_SYNC, external_payload: {system: CI_CD, raw: {run_id, status: FAILED}} }"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two TriageManagers approve and reject the same SeverityOverride simultaneously"
    guarantee: "Exactly one transition succeeds; the loser sees the override in a terminal state and is rejected"
    error_id: ERR_OVERRIDE_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on SeverityOverride.status"

  - scenario: "Two QAEngineers verify the same FIXED defect simultaneously (one PASSED, one FAILED)"
    guarantee: "Exactly one verification commits; the loser sees the defect in VERIFIED or REOPENED and is rejected"
    error_id: ERR_DEFECT_NOT_FIXED
    http_status: 409
    serialization: "First-writer-wins on Defect.status"

  - scenario: "Two reporters attempt to file the 11th non-terminal defect on a module whose initial_defect_quota=10 and quota_remaining=1"
    guarantee: "Exactly one defect-creation succeeds; the loser is rejected"
    error_id: ERR_MODULE_QUOTA_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Module.active_defect_count increment"

  - scenario: "Two duplicate-link requests target the same duplicate_defect_id against different canonicals simultaneously"
    guarantee: "At most one DuplicateLink is created per duplicate_defect_id; second is rejected"
    error_id: ERR_DEFECT_ALREADY_LINKED
    http_status: 409
    serialization: "First-writer-wins on Defect.canonical_defect_id"

  - scenario: "Pause-SLA and resume-SLA fired simultaneously on the same defect"
    guarantee: "Exactly one operation succeeds based on current sla_state; loser observes the new sla_state and is rejected"
    error_id: ERR_INVALID_SLA_STATE_TRANSITION
    http_status: 409
    serialization: "First-writer-wins on Defect.sla_state"

  - scenario: "Two regression runs start simultaneously on the same module within the cooldown window"
    guarantee: "Exactly one RegressionRun moves to RUNNING; the loser is rejected"
    error_id: ERR_REGRESSION_COOLDOWN_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on Module-scoped cooldown window"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: severity_priority_score
    trigger: "Defect report time; SeverityOverride approval; verification-failure REOPEN; clock-advance recomputes the age component when sweep runs (see escalation_level calc)"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): four inputs with non-linear interaction.
      severity_weight = {
        BLOCKER:  100,
        CRITICAL:  70,
        MAJOR:     40,
        MINOR:     20,
        TRIVIAL:    5
      }[effective_severity]

      impact_weight = {
        REVENUE_BLOCKING: 50,
        CUSTOMER_FACING:  25,
        INTERNAL:          5,
        UNKNOWN:           0
      }[business_impact]

      # Age component (nested conditional on severity tier — non-linear interaction):
      age_minutes = max(0, project.clock_minute - defect.report_clock_minute)
      if effective_severity IN {BLOCKER, CRITICAL}:
        age_factor = min(50, age_minutes // 10)        # 1 point per 10 elapsed minutes, capped at 50
      else:
        age_factor = min(30, age_minutes // 60)        # 1 point per 60 elapsed minutes, capped at 30

      reopen_bonus = reopen_count * 15                  # adds 15 per reopen, unbounded

      score = severity_weight + impact_weight + age_factor + reopen_bonus

      # Single-pass rounding at the END only (calc itself is integer-valued in
      # the above formula; precision clause only matters when defect_density is
      # mixed in elsewhere).
      return score   # integer
    constants:
      SEVERITY_WEIGHT_BLOCKER: 100
      SEVERITY_WEIGHT_CRITICAL: 70
      SEVERITY_WEIGHT_MAJOR: 40
      SEVERITY_WEIGHT_MINOR: 20
      SEVERITY_WEIGHT_TRIVIAL: 5
      IMPACT_WEIGHT_REVENUE_BLOCKING: 50
      IMPACT_WEIGHT_CUSTOMER_FACING: 25
      IMPACT_WEIGHT_INTERNAL: 5
      IMPACT_WEIGHT_UNKNOWN: 0
      AGE_DIVISOR_HIGH: 10        # for BLOCKER/CRITICAL
      AGE_DIVISOR_LOW: 60         # for MAJOR/MINOR/TRIVIAL
      AGE_CAP_HIGH: 50
      AGE_CAP_LOW: 30
      REOPEN_MULTIPLIER: 15
    precision: "integer, no rounding"
    note: "Difficulty mode (a): four inputs (severity, impact, age, reopen_count) interact non-linearly because age_factor's divisor and cap branch on the severity tier. Same numeric inputs with different severities produce wildly different scores."

  - name: provisional_defect_density
    trigger: "GET /statistics/density?mode=provisional&module_id={mid}; also recomputed implicitly when severity_priority_score recomputes (no caching)"
    algorithm: forward_looking
    input_set: "All Defects with project_id matching, module_id matching, AND status IN {NEW, ASSIGNED, IN_PROGRESS, FIXED, VERIFIED, REOPENED}.  Defects in CLOSED are EXCLUDED. Defects linked as duplicates (canonical_defect_id != null) are EXCLUDED."
    formula: |
      # Combinatorial mode (b): nested rounding where order matters.
      # Pinned order: round per-line (per defect's severity-weighted contribution)
      #              ↓ sum
      #              ↓ divide by kloc
      #              ↓ round final to 2 decimal places, round_half_up

      per_defect_weight = {
        BLOCKER:  3.0,
        CRITICAL: 2.0,
        MAJOR:    1.0,
        MINOR:    0.5,
        TRIVIAL:  0.25
      }[d.effective_severity]

      contributions = []
      for d in eligible_defects(module):
        contributions.append(round(per_defect_weight, 1))   # STEP 1: round PER-LINE to 1 decimal
      weighted_sum = sum(contributions)                      # STEP 2: sum
      if module.kloc <= 0:
        raise ERR_INVALID_MODULE_KLOC                        # boundary handled at validation, not here
      density = weighted_sum / module.kloc                   # STEP 3: divide
      return round(density, 2)                               # STEP 4: round final to 2 decimals, round_half_up
    constants:
      DENSITY_WEIGHT_BLOCKER: 3.0
      DENSITY_WEIGHT_CRITICAL: 2.0
      DENSITY_WEIGHT_MAJOR: 1.0
      DENSITY_WEIGHT_MINOR: 0.5
      DENSITY_WEIGHT_TRIVIAL: 0.25
    precision: "Step 1: round per-line to 1 decimal, round_half_up. Step 4: round final to 2 decimals, round_half_up. Order pinned: per-line round FIRST, then sum."

  - name: final_defect_density
    trigger: "GET /statistics/density?mode=final&module_id={mid}&period_start={p}&period_end={e}"
    algorithm: chronological
    input_set: "All Defects with module_id matching AND status == CLOSED AND first_FIXED_at_minute IN [period_start, period_end) (half-open window). Duplicates (canonical_defect_id != null) included only if their canonical is also CLOSED in the window."
    formula: |
      # Same numeric inputs as provisional_defect_density can yield a DIFFERENT
      # number because: (a) input set is the CLOSED window, not the live
      # non-terminal set; (b) effective_severity is read AT closure (post any
      # SeverityOverride approvals applied during the window), so a defect that
      # entered the window as MAJOR and was overridden to BLOCKER contributes
      # 3.0, not 1.0.

      eligible = [d for d in closed_defects(module)
                  if period_start <= d.first_fixed_at_minute < period_end]
      contributions = [round(weight_at_closure(d), 1) for d in eligible]
      weighted_sum = sum(contributions)
      density = weighted_sum / module.kloc
      return round(density, 2)
    precision: "Same as provisional_defect_density"
    note: "Dual-variant Rule 1 instance: provisional_defect_density (forward-looking on open defects) vs final_defect_density (chronological on closed defects in a time window) can yield different numbers for the same module."

  - name: effective_sla_minutes
    trigger: "Computed inline whenever response_due_minute or resolution_due_minute is set"
    algorithm: threshold
    input_set: "Defect's current effective_severity AND its current priority_score tier (boundary check)"
    formula: |
      # Combinatorial mode (c): circular-looking — effective_sla_minutes depends
      # on priority_score's tier, but priority_score includes age_factor which
      # depends on time. We BREAK the circle by pinning the evaluation order:
      #
      # 1. Read effective_severity (already finalized).
      # 2. Read priority_score AS OF the moment this calculation fires
      #    (i.e., do NOT recompute priority_score inside this calc — use the
      #    stored value).
      # 3. Branch:
      #    if priority_score >= 150:  multiplier = 0.5   (urgent track)
      #    elif priority_score >= 80: multiplier = 1.0   (standard track)
      #    else:                       multiplier = 1.5   (relaxed track)
      # 4. base = response_sla_minutes_base[effective_severity]
      # 5. effective_response_sla = ceil(base * multiplier)   # ceil to avoid sub-minute
      # 6. Same for resolution_sla using resolution_sla_minutes_base[effective_severity].

      response_sla_minutes_base = {
        BLOCKER:    30,
        CRITICAL:   60,
        MAJOR:     240,
        MINOR:     480,
        TRIVIAL:  1440
      }
      resolution_sla_minutes_base = {
        BLOCKER:    240,
        CRITICAL:   480,
        MAJOR:     1440,
        MINOR:     4320,
        TRIVIAL:  10080
      }
      multiplier = 0.5 if priority_score >= 150 else (1.0 if priority_score >= 80 else 1.5)
      effective_response = math.ceil(response_sla_minutes_base[effective_severity] * multiplier)
      effective_resolution = math.ceil(resolution_sla_minutes_base[effective_severity] * multiplier)
      return (effective_response, effective_resolution)
    constants:
      RESPONSE_SLA_BLOCKER: 30
      RESPONSE_SLA_CRITICAL: 60
      RESPONSE_SLA_MAJOR: 240
      RESPONSE_SLA_MINOR: 480
      RESPONSE_SLA_TRIVIAL: 1440
      RESOLUTION_SLA_BLOCKER: 240
      RESOLUTION_SLA_CRITICAL: 480
      RESOLUTION_SLA_MAJOR: 1440
      RESOLUTION_SLA_MINOR: 4320
      RESOLUTION_SLA_TRIVIAL: 10080
      MULT_URGENT_THRESHOLD: 150
      MULT_STANDARD_THRESHOLD: 80
    precision: "integer minutes (ceil after multiplication)"
    note: "Rule 2 mode (c): circular-looking dependency. priority_score depends on age, but effective_sla_minutes depends on priority_score's tier. Pinned evaluation order: priority_score is the AS-OF value at this calc's trigger time — do not recompute inside."

  - name: escalation_level
    trigger: "POST /_sweep/sla-escalation (system sweep), and any Defect mutation that recomputes priority_score"
    algorithm: threshold
    input_set: "Per Defect: project.clock_minute, defect.response_due_minute, defect.resolution_due_minute, defect.escalation_level (current), defect.total_paused_minutes, defect.sla_state"
    formula: |
      # Boundary precision: STRICT greater-than on time comparisons.
      if defect.status == CLOSED: return defect.escalation_level   # frozen
      if defect.sla_state == PAUSED: return defect.escalation_level # frozen while paused

      adjusted_now = project.clock_minute - defect.total_paused_minutes
      # Use STRICT > so that adjusted_now == response_due_minute is NOT a breach.

      if adjusted_now > defect.resolution_due_minute:
        new_level = max(defect.escalation_level, 2)
      elif adjusted_now > defect.response_due_minute and defect.status IN {NEW, ASSIGNED}:
        new_level = max(defect.escalation_level, 1)
      else:
        new_level = defect.escalation_level

      if new_level > defect.escalation_level:
        # Side effect: append AuditEntry { event_type: ESCALATION, from_value, to_value }
        # Side effect: emit external event sync to IM system (AuditEntry EXTERNAL_EVENT_SYNC with payload.system = IM)
        defect.escalation_level = new_level
      return new_level
    constants: {}
    precision: "integer; strict >"
    note: "Rule 6 boundary case lives here: adjusted_now > response_due_minute (strict)."

  - name: assignee_selector
    trigger: "POST /defects/{defectId}/assign when body.assignee_id is absent"
    algorithm: weighted_scoring
    input_set: "All TeamMember rows where project_id = defect.project_id AND status = ACTIVE AND role IN {DEVELOPER, QA_ENGINEER}"
    formula: |
      # Eligibility filter:  role IN {DEVELOPER, QA_ENGINEER} AND status == ACTIVE
      # Ranking expression:  primary key: active_workload ASCENDING
      #                      secondary key (tie-break): module ownership match (Module.owner_team_member_id == candidate.id is preferred)
      #                      tertiary key (tie-break): created_at ASCENDING (oldest member wins)
      # Empty candidate set: ERR_NO_ELIGIBLE_ASSIGNEE
      candidates = [m for m in TeamMember.find(project_id=defect.project_id)
                    if m.status == 'ACTIVE' and m.role IN {'DEVELOPER', 'QA_ENGINEER'}]
      if not candidates: raise ERR_NO_ELIGIBLE_ASSIGNEE
      candidates.sort(key=lambda m: (
          m.active_workload,
          0 if m.id == defect.module.owner_team_member_id else 1,
          m.created_at
      ))
      return candidates[0].id
    constants: {}

  - name: reopen_rate
    trigger: "GET /statistics/reopen-rate?module_id={mid}&period_start={p}&period_end={e}"
    algorithm: aggregation
    input_set: "All Defects with module_id matching AND status == CLOSED AND first_fixed_at_minute IN [period_start, period_end)"
    formula: |
      eligible = [d for d in defects if d.module_id == module_id
                  and d.status == 'CLOSED'
                  and period_start <= d.first_fixed_at_minute < period_end]
      if not eligible: return 0.0    # boundary: empty set returns 0.0 (NOT an error)
      reopened_at_least_once = sum(1 for d in eligible if d.reopen_count > 0)
      return round(reopened_at_least_once / len(eligible), 4)
    precision: "4 decimal places, round_half_up"
    note: "Rule 6 boundary case (empty set): empty eligible set returns 0.0, not an error."

  - name: removal_rate
    trigger: "GET /statistics/removal-rate?module_id={mid}&period_start={p}&period_end={e}"
    algorithm: aggregation
    input_set: "All Defects discovered (created_at_minute) in window vs Defects closed in same window."
    formula: |
      discovered = count(d where d.module_id == module_id
                         and period_start <= d.created_at_minute < period_end)
      removed = count(d where d.module_id == module_id
                      and d.status == 'CLOSED'
                      and period_start <= d.first_fixed_at_minute < period_end)
      if discovered == 0: return 0.0
      return round(removed / discovered, 4)
    precision: "4 decimal places"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty on all endpoints"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must have permission for this operation (per §1.7 RBAC matrix)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body entity IDs must resolve to existing rows; validated left-to-right in path"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all
    note: "projectId before moduleId before defectId before fixRecordId, etc."

  - priority: 4
    category: state
    check: "Parent Project must be ACTIVE for any defect/module/team-member creation or state-changing operation"
    error_id: ERR_PROJECT_ARCHIVED
    http_status: 409
    applies_to: "Create/modify on Module, TeamMember, Defect, SeverityOverride, FixRecord, VerificationRecord, RegressionRun, SLAPause, DuplicateLink, DefectAttachment"

  - priority: 5
    category: state
    check: "Target resource must be in the correct status for the requested transition"
    error_id: "varies (ERR_DEFECT_NOT_FIXED, ERR_DEFECT_NOT_ASSIGNED, ERR_OVERRIDE_NOT_PENDING, ERR_REGRESSION_NOT_RUNNING, ERR_INVALID_SLA_STATE_TRANSITION, ERR_DEFECT_CLOSED)"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6
    category: business_safety
    check: "Verifier independence: X-User-ID on /verify must NOT equal the FixRecord.developer_id being verified"
    error_id: ERR_VERIFIER_NOT_INDEPENDENT
    http_status: 403
    applies_to: "POST /defects/{defectId}/verify"
    note: "Rule 5 instance: this safety check fires BEFORE business_fiscal (Module quota) — segregation of duties wins"

  - priority: 7
    category: business_safety
    check: "Severity override approver independence: X-User-ID on /approve|/reject must NOT equal SeverityOverride.requested_by"
    error_id: ERR_OVERRIDE_APPROVER_NOT_INDEPENDENT
    http_status: 403
    applies_to: "POST /severity-overrides/{overrideId}/approve, POST /severity-overrides/{overrideId}/reject"

  - priority: 8
    category: business_referential
    check: "On /assign, the assignee_id (if supplied) must resolve to a TeamMember with project_id matching defect.project_id and status=ACTIVE"
    error_id: ERR_TEAM_MEMBER_NOT_ELIGIBLE
    http_status: 400
    applies_to: "POST /defects/{defectId}/assign, POST /defects/{defectId}/reassign"

  - priority: 9
    category: business_referential
    check: "On defect creation, module_id must reference an ACTIVE module within the same project; reporter_id must reference an ACTIVE TeamMember in the same project"
    error_id: ERR_MODULE_OR_REPORTER_INVALID
    http_status: 400
    applies_to: "POST /defects"

  - priority: 10
    category: business_constraint
    check: "SeverityOverride.requested_severity must differ from the parent defect's current effective_severity"
    error_id: ERR_OVERRIDE_NO_CHANGE
    http_status: 400
    applies_to: "POST /defects/{defectId}/severity-overrides"

  - priority: 11
    category: business_constraint
    check: "DuplicateLink: duplicate_defect_id != canonical_defect_id; canonical_defect_id must not itself have canonical_defect_id set (no chained dup links); duplicate_defect.status must be NEW; canonical_defect.status must be non-terminal"
    error_id: ERR_INVALID_DUPLICATE_LINK
    http_status: 400
    applies_to: "POST /duplicate-links"

  - priority: 12
    category: business_constraint
    check: "DefectAttachment.size_bytes must be > 0 and within type-specific cap (SCREENSHOT<=5MB, LOG<=10MB, VIDEO<=200MB)"
    error_id: ERR_ATTACHMENT_TOO_LARGE
    http_status: 400
    applies_to: "POST /defects/{defectId}/attachments"

  - priority: 13
    category: business_constraint
    check: "Defect.environment object must contain all four keys: os, browser, app_version, build_id (each non-empty)"
    error_id: ERR_INVALID_ENVIRONMENT
    http_status: 400
    applies_to: "POST /defects"

  - priority: 14
    category: business_temporal
    check: "SLAPause adjacency: a new pause may not start at exactly the ended_at_minute of the immediately preceding pause on the same defect (half-open [start,end) semantics, but adjacency at boundary disallowed — strict separation required)"
    error_id: ERR_SLA_PAUSE_ADJACENT
    http_status: 409
    applies_to: "POST /defects/{defectId}/pause-sla"

  - priority: 15
    category: business_temporal
    check: "RegressionRun cooldown: REGRESSION_COOLDOWN_MINUTES = 10. The cooldown compares project.clock_minute against the maximum started_at_minute among prior RegressionRuns on the same module with status IN {RUNNING, PASSED, FAILED}. A start is rejected when project.clock_minute - max(prev.started_at_minute) < 10. Boundary is INCLUSIVE: equality permits the start. Checked at /regression-runs/{id}/start."
    error_id: ERR_REGRESSION_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /regression-runs/{regressionRunId}/start"

  - priority: 16
    category: business_constraint
    check: "Module quota: a new defect on this module is rejected when Module.quota_remaining == 0 (i.e., active_defect_count == initial_defect_quota)"
    error_id: ERR_MODULE_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /defects"

  - priority: 17
    category: business_constraint
    check: "Defect cannot CLOSE while any RegressionRun for this defect has status IN {QUEUED, RUNNING, FAILED}"
    error_id: ERR_REGRESSION_NOT_PASSED
    http_status: 409
    applies_to: "POST /defects/{defectId}/close"

  - priority: 18
    category: business_referential
    check: "On /verify, body.fix_record_id must reference the LATEST FixRecord for this defect (defects accumulate FixRecord rows across reopen cycles; only the latest is valid for verification)"
    error_id: ERR_FIX_RECORD_STALE
    http_status: 409
    applies_to: "POST /defects/{defectId}/verify"

  - priority: 19
    category: business_constraint
    check: "version field on PATCH/PUT/state-transition endpoints must match server version (optimistic concurrency)"
    error_id: ERR_STALE_DATA
    http_status: 409
    applies_to: "All mutating endpoints when body.version is supplied"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create a new Project"
    roles: [TriageManager]
    code: 201
    input: [project_key, name]
    output: Project
    side_effects: ["clock_minute initialized to 0; status=ACTIVE"]

  - method: GET
    path: "/projects"
    description: "List Projects"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/projects/{projectId}"
    description: "Get Project details"
    roles: [Any]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{projectId}/archive"
    description: "Archive a project (cascades to all modules)"
    roles: [TriageManager]
    code: 200
    input: ["version?"]
    output: Project
    side_effects: ["All Modules → ARCHIVED; precondition: zero non-terminal Defects in project"]

  # --- Module ---
  - method: POST
    path: "/projects/{projectId}/modules"
    description: "Create a Module"
    roles: [TriageManager]
    code: 201
    input: [module_key, owner_team_member_id, kloc, initial_defect_quota]
    output: Module
    side_effects: ["active_defect_count=0, quota_remaining=initial_defect_quota"]

  - method: GET
    path: "/projects/{projectId}/modules"
    description: "List Modules in a project"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Module[]"
    side_effects: []

  - method: GET
    path: "/projects/{projectId}/modules/{moduleId}"
    description: "Get Module details"
    roles: [Any]
    code: 200
    input: []
    output: Module
    side_effects: []

  - method: POST
    path: "/projects/{projectId}/modules/{moduleId}/archive"
    description: "Archive a single module"
    roles: [TriageManager]
    code: 200
    input: ["version?"]
    output: Module
    side_effects: []

  # --- TeamMember ---
  - method: POST
    path: "/projects/{projectId}/team-members"
    description: "Create a TeamMember"
    roles: [TriageManager]
    code: 201
    input: [display_name, role]
    output: TeamMember
    side_effects: ["active_workload=0, status=ACTIVE"]

  - method: GET
    path: "/projects/{projectId}/team-members"
    description: "List TeamMembers in a project"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "role?"]
    output: "TeamMember[]"
    side_effects: []

  - method: GET
    path: "/projects/{projectId}/team-members/{teamMemberId}"
    description: "Get TeamMember details"
    roles: [Any]
    code: 200
    input: []
    output: TeamMember
    side_effects: []

  # --- Defect ---
  - method: POST
    path: "/defects"
    description: "Report a new Defect"
    roles: [Developer, QAEngineer, TriageManager]
    code: 201
    input: [project_id, module_id, reporter_id, title, defect_source, severity, business_impact, reproduction_steps, environment]
    output: Defect
    side_effects:
      - "status=NEW, sla_state=RUNNING, escalation_level=0, reopen_count=0, total_paused_minutes=0"
      - "report_clock_minute = project.clock_minute at creation"
      - "first_fixed_at_minute = null"
      - "effective_severity = severity"
      - "Compute priority_score via severity_priority_score"
      - "Compute response_due_minute = report_clock_minute + effective_response_sla_minutes; resolution_due_minute = report_clock_minute + effective_resolution_sla_minutes"
      - "Increment Module.active_defect_count by 1; decrement Module.quota_remaining by 1"
      - "Append AuditEntry { event_type: STATUS_CHANGE, from_value: null, to_value: NEW }"

  - method: GET
    path: "/defects"
    description: "List Defects with filtering"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "project_id?", "module_id?", "assignee_id?", "status?", "severity?"]
    output: "Defect[]"
    side_effects: []

  - method: GET
    path: "/defects/{defectId}"
    description: "Get Defect details"
    roles: [Any]
    code: 200
    input: []
    output: Defect
    side_effects: []

  - method: POST
    path: "/defects/{defectId}/assign"
    description: "Assign a defect to a team member; assignee_id optional (server selects via selector)"
    roles: [TriageManager]
    code: 200
    input: ["assignee_id?", "version?"]
    output: Defect
    side_effects: ["See Defect state machine NEW→ASSIGNED and REOPENED→ASSIGNED transitions"]

  - method: POST
    path: "/defects/{defectId}/reassign"
    description: "Reassign an already-ASSIGNED defect to a different team member"
    roles: [TriageManager]
    code: 200
    input: [new_assignee_id, "version?"]
    output: Defect
    side_effects: ["ASSIGNED→ASSIGNED self-loop; workload counters adjust"]

  - method: POST
    path: "/defects/{defectId}/start-progress"
    description: "Begin work on an assigned defect"
    roles: [Developer]
    code: 200
    input: ["version?"]
    output: Defect
    side_effects: ["status ASSIGNED→IN_PROGRESS"]

  - method: POST
    path: "/defects/{defectId}/submit-fix"
    description: "Submit a fix; creates FixRecord and transitions to FIXED"
    roles: [Developer]
    code: 200
    input: [fix_version, fix_summary, commit_sha, "version?"]
    output: Defect
    side_effects: ["Creates FixRecord; status IN_PROGRESS→FIXED; sets defect.fix_version and final_resolution_minutes"]

  - method: POST
    path: "/defects/{defectId}/verify"
    description: "Verify a fix (PASSED → VERIFIED, FAILED → REOPENED)"
    roles: [QAEngineer]
    code: 200
    input: [outcome, fix_record_id, "notes?", "version?"]
    output: Defect
    side_effects:
      - "Creates VerificationRecord"
      - "On FAILED: reopen cascade (reopen_count++, priority_score recompute, response_due_minute reset, escalation_level reset to 0, AuditEntry trail)"
      - "On PASSED: status FIXED→VERIFIED"

  - method: POST
    path: "/defects/{defectId}/close"
    description: "Close a verified defect"
    roles: [TriageManager]
    code: 200
    input: ["version?"]
    output: Defect
    side_effects: ["status VERIFIED→CLOSED; Module.active_defect_count--; Module.quota_remaining++; assignee.active_workload--"]

  - method: POST
    path: "/defects/{defectId}/pause-sla"
    description: "Pause SLA timer (waiting on reporter/third-party)"
    roles: [Developer]
    code: 200
    input: [reason, "version?"]
    output: Defect
    side_effects: ["Creates SLAPause row; sla_state RUNNING→PAUSED"]

  - method: POST
    path: "/defects/{defectId}/resume-sla"
    description: "Resume SLA timer"
    roles: [Developer]
    code: 200
    input: ["version?"]
    output: Defect
    side_effects: ["Closes open SLAPause; updates total_paused_minutes; sla_state PAUSED→RUNNING"]

  # --- DefectAttachment ---
  - method: POST
    path: "/defects/{defectId}/attachments"
    description: "Upload an attachment to a defect"
    roles: [Developer, QAEngineer, TriageManager]
    code: 201
    input: [attachment_type, filename, size_bytes]
    output: DefectAttachment
    side_effects: []

  - method: GET
    path: "/defects/{defectId}/attachments"
    description: "List attachments for a defect"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "DefectAttachment[]"
    side_effects: []

  # --- DuplicateLink ---
  - method: POST
    path: "/duplicate-links"
    description: "Mark a NEW defect as duplicate of a canonical defect"
    roles: [TriageManager]
    code: 201
    input: [duplicate_defect_id, canonical_defect_id, similarity_score]
    output: DuplicateLink
    side_effects: ["Sets duplicate_defect.canonical_defect_id; duplicate_defect retains its own status (NEW) but cannot transition further"]

  - method: GET
    path: "/duplicate-links"
    description: "List duplicate links (filter by duplicate_defect_id or canonical_defect_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "duplicate_defect_id?", "canonical_defect_id?"]
    output: "DuplicateLink[]"
    side_effects: []

  # --- SeverityOverride ---
  - method: POST
    path: "/defects/{defectId}/severity-overrides"
    description: "Request a severity override for a defect"
    roles: [Developer, QAEngineer, TriageManager]
    code: 201
    input: [requested_severity, justification]
    output: SeverityOverride
    side_effects: ["status=PENDING; requested_by = X-User-ID"]

  - method: POST
    path: "/severity-overrides/{overrideId}/approve"
    description: "Approve a pending severity override"
    roles: [TriageManager]
    code: 200
    input: ["version?"]
    output: SeverityOverride
    side_effects: ["See SeverityOverride PENDING→APPROVED — cascades to defect.effective_severity, priority_score, response_due_minute, resolution_due_minute, AuditEntry"]

  - method: POST
    path: "/severity-overrides/{overrideId}/reject"
    description: "Reject a pending severity override"
    roles: [TriageManager]
    code: 200
    input: ["version?"]
    output: SeverityOverride
    side_effects: ["status PENDING→REJECTED; no defect mutation"]

  - method: GET
    path: "/severity-overrides/{overrideId}"
    description: "Get a severity override"
    roles: [Any]
    code: 200
    input: []
    output: SeverityOverride
    side_effects: []

  # --- FixRecord & VerificationRecord (read-only listing) ---
  - method: GET
    path: "/defects/{defectId}/fix-records"
    description: "List all FixRecords for a defect (one per fix attempt across reopen cycles)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FixRecord[]"
    side_effects: []

  - method: GET
    path: "/defects/{defectId}/verification-records"
    description: "List archived verification attempts for a defect"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "VerificationRecord[]"
    side_effects: []

  # --- RegressionRun ---
  - method: POST
    path: "/defects/{defectId}/regression-runs"
    description: "Queue a regression run for a defect's fix"
    roles: [ReleaseManager]
    code: 201
    input: [test_suite_key, impact_scope]
    output: RegressionRun
    side_effects: ["status=QUEUED; started_at_minute=project.clock_minute; module_id copied from defect"]

  - method: POST
    path: "/regression-runs/{regressionRunId}/start"
    description: "Move a queued run to RUNNING (enforces module cooldown)"
    roles: [ReleaseManager]
    code: 200
    input: ["version?"]
    output: RegressionRun
    side_effects: ["status QUEUED→RUNNING"]

  - method: POST
    path: "/regression-runs/{regressionRunId}/complete"
    description: "Complete a running regression with a PASSED/FAILED result"
    roles: [ReleaseManager]
    code: 200
    input: [result, "version?"]
    output: RegressionRun
    side_effects: ["See RegressionRun RUNNING→PASSED|FAILED transitions; on FAILED with parent defect=VERIFIED, cascades into reopen"]

  - method: GET
    path: "/regression-runs"
    description: "List regression runs (filter by defect_id, module_id, status)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "defect_id?", "module_id?", "status?"]
    output: "RegressionRun[]"
    side_effects: []

  - method: GET
    path: "/regression-runs/{regressionRunId}"
    description: "Get a regression run"
    roles: [Any]
    code: 200
    input: []
    output: RegressionRun
    side_effects: []

  # --- Audit log ---
  - method: GET
    path: "/audit-entries"
    description: "List audit entries (filter by defect_id, event_type, period)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "defect_id?", "event_type?", "from_minute?", "to_minute?"]
    output: "AuditEntry[]"
    side_effects: []

  # --- Statistics ---
  - method: GET
    path: "/statistics/distribution"
    description: "Defect counts grouped by module/severity/assignee/period"
    roles: [Any]
    code: 200
    input: ["project_id", "group_by", "period_start?", "period_end?"]
    output: "DistributionReport (computed read)"
    side_effects: []

  - method: GET
    path: "/statistics/density"
    description: "Defect density per KLOC for a module (mode=provisional|final)"
    roles: [Any]
    code: 200
    input: [module_id, mode, "period_start?", "period_end?"]
    output: "DensityReport (computed read)"
    side_effects: []

  - method: GET
    path: "/statistics/reopen-rate"
    description: "Reopen rate within a window for a module"
    roles: [Any]
    code: 200
    input: [module_id, period_start, period_end]
    output: "ReopenRateReport (computed read)"
    side_effects: []

  - method: GET
    path: "/statistics/removal-rate"
    description: "Removal rate (closed vs discovered in window) for a module"
    roles: [Any]
    code: 200
    input: [module_id, period_start, period_end]
    output: "RemovalRateReport (computed read)"
    side_effects: []

  - method: GET
    path: "/statistics/sla-performance"
    description: "SLA-performance report: counts of breached vs on-time defects, by severity"
    roles: [Any]
    code: 200
    input: ["project_id", "period_start?", "period_end?"]
    output: "SLAPerformanceReport (computed read)"
    side_effects: []

  # --- Test-driving (system) endpoints ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the virtual project clock by N minutes (test driver for time-gated transitions)"
    roles: [TriageManager]
    code: 200
    input: [project_id, minutes]
    output: Project
    side_effects: ["Project.clock_minute += minutes; no automatic sweep fired"]

  - method: POST
    path: "/_sweep/sla-escalation"
    description: "Run the SLA-escalation sweep across all non-terminal defects in a project"
    roles: [TriageManager]
    code: 200
    input: [project_id]
    output: "SweepReport (computed read: list of defects whose escalation_level changed)"
    side_effects: ["Per-defect escalation_level may bump; AuditEntry ESCALATION + EXTERNAL_EVENT_SYNC (system=IM) appended for each change"]

  - method: POST
    path: "/_events/emit"
    description: "Inject an external event from a connected system (VCS / CI_CD / IM) — drives event-driven synchronization"
    roles: [TriageManager, ReleaseManager]
    code: 201
    input: [defect_id, system, raw_payload]
    output: AuditEntry
    side_effects: ["Appends AuditEntry { event_type: EXTERNAL_EVENT_SYNC, external_payload: {system, raw} }; no state mutation on defect itself"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or empty"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role lacks permission for this operation"

  # --- Not found ---
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Project with given projectId does not exist"

  - id: ERR_MODULE_NOT_FOUND
    http: 404
    condition: "Module with given moduleId does not exist"

  - id: ERR_TEAM_MEMBER_NOT_FOUND
    http: 404
    condition: "TeamMember with given id does not exist"

  - id: ERR_DEFECT_NOT_FOUND
    http: 404
    condition: "Defect with given defectId does not exist"

  - id: ERR_FIX_RECORD_NOT_FOUND
    http: 404
    condition: "FixRecord with given fix_record_id does not exist"

  - id: ERR_OVERRIDE_NOT_FOUND
    http: 404
    condition: "SeverityOverride with given overrideId does not exist"

  - id: ERR_REGRESSION_NOT_FOUND
    http: 404
    condition: "RegressionRun with given regressionRunId does not exist"

  # --- Project / Module state ---
  - id: ERR_PROJECT_ARCHIVED
    http: 409
    condition: "Parent project is ARCHIVED — mutating operations rejected"

  - id: ERR_MODULE_ARCHIVED
    http: 409
    condition: "Target module is ARCHIVED — cannot create new defects or transition defects through fix-related states"

  - id: ERR_MODULE_HAS_ACTIVE_DEFECTS
    http: 409
    condition: "Cannot archive module with active_defect_count > 0"

  - id: ERR_MODULE_QUOTA_EXCEEDED
    http: 409
    condition: "Module.quota_remaining == 0; cannot create another non-terminal defect"

  # --- Defect status preconditions ---
  - id: ERR_DEFECT_NOT_NEW
    http: 409
    condition: "Operation requires defect.status == NEW (e.g., duplicate-link)"

  - id: ERR_DEFECT_NOT_ASSIGNED
    http: 409
    condition: "Operation requires defect.status == ASSIGNED (e.g., start-progress)"

  - id: ERR_DEFECT_NOT_IN_PROGRESS
    http: 409
    condition: "Operation requires defect.status == IN_PROGRESS (e.g., submit-fix)"

  - id: ERR_DEFECT_NOT_FIXED
    http: 409
    condition: "Operation requires defect.status == FIXED (e.g., verify)"

  - id: ERR_DEFECT_NOT_VERIFIED
    http: 409
    condition: "Operation requires defect.status == VERIFIED (e.g., close)"

  - id: ERR_DEFECT_CLOSED
    http: 409
    condition: "Defect is in terminal CLOSED state; no further mutations permitted"

  - id: ERR_REASSIGN_SAME_ASSIGNEE
    http: 400
    condition: "Reassignment target equals current assignee_id"

  - id: ERR_REASSIGN_NOT_ASSIGNED
    http: 409
    condition: "Reassign endpoint requires defect.status == ASSIGNED"

  # --- SLA / Pause ---
  - id: ERR_INVALID_SLA_STATE_TRANSITION
    http: 409
    condition: "pause-sla called on PAUSED defect, or resume-sla called on RUNNING defect"

  - id: ERR_SLA_PAUSE_INVALID_STATUS
    http: 409
    condition: "pause-sla called on a defect whose status is not IN {ASSIGNED, IN_PROGRESS}"

  - id: ERR_SLA_PAUSE_ADJACENT
    http: 409
    condition: "New SLAPause would start exactly at ended_at_minute of the immediately preceding closed pause on the same defect"

  # --- Verification / Override independence ---
  - id: ERR_VERIFIER_NOT_INDEPENDENT
    http: 403
    condition: "Verifier X-User-ID equals FixRecord.developer_id"

  - id: ERR_OVERRIDE_APPROVER_NOT_INDEPENDENT
    http: 403
    condition: "Override approver/rejecter X-User-ID equals SeverityOverride.requested_by"

  - id: ERR_FIX_RECORD_STALE
    http: 409
    condition: "fix_record_id supplied to /verify is not the latest FixRecord for the defect"

  - id: ERR_OVERRIDE_NOT_PENDING
    http: 409
    condition: "approve/reject called on a SeverityOverride not in PENDING status"

  - id: ERR_OVERRIDE_NO_CHANGE
    http: 400
    condition: "requested_severity equals defect.effective_severity"

  # --- Regression ---
  - id: ERR_REGRESSION_NOT_RUNNING
    http: 409
    condition: "complete called on a RegressionRun not in RUNNING status"

  - id: ERR_REGRESSION_NOT_QUEUED
    http: 409
    condition: "start called on a RegressionRun not in QUEUED status"

  - id: ERR_REGRESSION_COOLDOWN_ACTIVE
    http: 409
    condition: "Same-module cooldown not yet elapsed for new RegressionRun"

  - id: ERR_REGRESSION_NOT_PASSED
    http: 409
    condition: "Cannot close defect while a regression run is QUEUED, RUNNING, or FAILED"

  - id: ERR_REGRESSION_INVALID_SCOPE
    http: 400
    condition: "impact_scope does not include the defect's module_id"

  # --- Referential / input ---
  - id: ERR_TEAM_MEMBER_NOT_ELIGIBLE
    http: 400
    condition: "Assignee TeamMember is INACTIVE, in a different project, or has incompatible role"

  - id: ERR_MODULE_OR_REPORTER_INVALID
    http: 400
    condition: "module_id or reporter_id on defect creation does not resolve or is not ACTIVE / not in same project"

  - id: ERR_NO_ELIGIBLE_ASSIGNEE
    http: 409
    condition: "Assign without assignee_id but no ACTIVE TeamMember exists with role IN {DEVELOPER, QA_ENGINEER}"

  - id: ERR_INVALID_ENVIRONMENT
    http: 400
    condition: "environment object missing one or more of os/browser/app_version/build_id"

  - id: ERR_INVALID_DUPLICATE_LINK
    http: 400
    condition: "DuplicateLink violates self-link, chained-link, status, or similarity_score constraints"

  - id: ERR_DEFECT_ALREADY_LINKED
    http: 409
    condition: "duplicate_defect_id already has canonical_defect_id set"

  - id: ERR_ATTACHMENT_TOO_LARGE
    http: 400
    condition: "Attachment size_bytes exceeds type-specific cap"

  - id: ERR_INVALID_MODULE_KLOC
    http: 400
    condition: "Module.kloc <= 0 at create, or zero-density requested before any defect exists"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch)"

  # --- Concurrency ---
  - id: ERR_STALE_DATA
    http: 409
    condition: "version mismatch on optimistic concurrency control"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TriageManager
    description: "Triage manager: project/module admin, defect triage and routing, severity-override decisions"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{projectId}/archive"
      - "POST /projects/{projectId}/modules"
      - "POST /projects/{projectId}/modules/{moduleId}/archive"
      - "POST /projects/{projectId}/team-members"
      - "POST /defects/{defectId}/assign"
      - "POST /defects/{defectId}/reassign"
      - "POST /defects/{defectId}/close"
      - "POST /duplicate-links"
      - "POST /severity-overrides/{overrideId}/approve"
      - "POST /severity-overrides/{overrideId}/reject"
      - "POST /_clock/advance"
      - "POST /_sweep/sla-escalation"
    shared_operations:
      - "POST /defects (also Developer, QAEngineer)"
      - "POST /defects/{defectId}/attachments (also Developer, QAEngineer)"
      - "POST /defects/{defectId}/severity-overrides (also Developer, QAEngineer)"
      - "POST /_events/emit (also ReleaseManager)"

  - name: Developer
    description: "Software developer: works on assigned defects and submits fixes"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /defects/{defectId}/start-progress"
      - "POST /defects/{defectId}/submit-fix"
      - "POST /defects/{defectId}/pause-sla"
      - "POST /defects/{defectId}/resume-sla"
    shared_operations:
      - "POST /defects"
      - "POST /defects/{defectId}/attachments"
      - "POST /defects/{defectId}/severity-overrides"

  - name: QAEngineer
    description: "QA engineer: verifies fixes; the only role permitted to call /verify (and never on a fix they themselves authored — verifier independence enforced)"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /defects/{defectId}/verify"
    shared_operations:
      - "POST /defects"
      - "POST /defects/{defectId}/attachments"
      - "POST /defects/{defectId}/severity-overrides"

  - name: ReleaseManager
    description: "Release manager: drives regression runs and acknowledges CI/CD/VCS/IM events"
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /defects/{defectId}/regression-runs"
      - "POST /regression-runs/{regressionRunId}/start"
      - "POST /regression-runs/{regressionRunId}/complete"
    shared_operations:
      - "POST /_events/emit"

  - name: Any
    description: "Pseudo-role for read endpoints — all authenticated roles may invoke"
    identity: "opaque"
    shared_operations:
      - "GET /projects, GET /projects/{projectId}"
      - "GET /projects/{projectId}/modules, GET /projects/{projectId}/modules/{moduleId}"
      - "GET /projects/{projectId}/team-members, GET /projects/{projectId}/team-members/{teamMemberId}"
      - "GET /defects, GET /defects/{defectId}"
      - "GET /defects/{defectId}/attachments"
      - "GET /defects/{defectId}/fix-records"
      - "GET /defects/{defectId}/verification-records"
      - "GET /duplicate-links"
      - "GET /severity-overrides/{overrideId}"
      - "GET /regression-runs, GET /regression-runs/{regressionRunId}"
      - "GET /audit-entries"
      - "GET /statistics/distribution, /statistics/density, /statistics/reopen-rate, /statistics/removal-rate, /statistics/sla-performance"
