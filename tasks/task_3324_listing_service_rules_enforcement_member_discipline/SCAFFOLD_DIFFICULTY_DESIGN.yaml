          setup:
            - "Association A; broker MB; office O; COMP_DISPLAY_ON revision R1 active (ruleset_version becomes 1); listing L ACTIVE (audit citation target)"
            - "DataLicense DL scope IDX, display_ruleset_version 1, allowlist [property_address] — activated while ruleset == 1"
