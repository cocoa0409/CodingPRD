              captures: { park_bm_id: "$.data.id", park_bm_initial_status: "$.data.park_status" }
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_bm_id}", membership_id: "${ms_dev_id}", arrival_date: "2026-09-14", scheduled_departure_date: "2026-09-17" }
