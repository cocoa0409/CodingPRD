            - call: "POST /regional-news-ops/delivery-contractors/${con_riv_id}/routes"
              payload: { print_market_id: "${mkt_riv_id}", route_code: "R9", stop_capacity: 6, per_stop_fee_cents: 1150, dist_per_stop_miles: 3.0, cost_per_copy_ceiling_cents: 600, printed_copies_surcharge_cents: 0, cost_run_date: "2026-09-10" }
              as: DeliveryNetworkManager
