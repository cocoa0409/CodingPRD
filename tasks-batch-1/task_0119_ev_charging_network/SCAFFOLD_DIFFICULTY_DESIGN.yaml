              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: CPOOperator
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:30:00Z" }
              as: CPOOperator
            - call: "POST /api/reservations/${resv_id}/check-in"
