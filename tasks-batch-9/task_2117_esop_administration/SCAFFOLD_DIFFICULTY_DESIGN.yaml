      - name: valuation_approve_gated_by_plan_status_valuation_to_plan
        grounds:
          - state_machines.Valuation.SUBMITTED_to_APPROVED
          - state_machines.EsopPlan.OPEN_to_VALUATION_PENDING
          - validations[priority=8]
          - errors[ERR_PLAN_STATE_INVALID]
        distinguishing_aspect: |
          A different entity pair from AllocationRun-to-Valuation: Valuation depending on
          EsopPlan. The same SUBMITTED valuation is unapprovable while the plan is OPEN and
          becomes approvable the moment close-year moves the plan to VALUATION_PENDING,
