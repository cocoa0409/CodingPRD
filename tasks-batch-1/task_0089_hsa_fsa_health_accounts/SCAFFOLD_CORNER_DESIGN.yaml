        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Disbursing a clean APPROVED claim while X-User-ID equals claim.adjudicated_by (and no state/hold problem exists) returns 403 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["An ACTIVE HEALTH_FSA with one APPROVED claim adjudicated by adj-1; account CLEAR and funded; a DRAFT batch references the claim."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "sd@x.com", full_name: "SD", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 200000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 50000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
          trigger:
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 403; error_id == ERR_SEGREGATION_OF_DUTIES (disburser adj-1 == adjudicator adj-1)"
            - "Claim.${claim_id}.status == APPROVED (unchanged)"

      - name: resource_not_found_on_account_body_fk
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /accounts with a non-existent participant_id returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["A plan year exists; participant id is fabricated."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { participant_id: "00000000-0000-4000-8000-000000000000", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000 }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404; error_id == ERR_RESOURCE_NOT_FOUND"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: missing_auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
