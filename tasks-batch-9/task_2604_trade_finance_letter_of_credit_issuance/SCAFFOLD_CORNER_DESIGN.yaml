      - name: bank_patch_applies_a_partial_update_and_rederives_eligibility
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/banks/{id}
          - calculations.confirming_bank_selection
          - errors.ERR_CONFIRMING_BANK_INELIGIBLE
        distinguishing_aspect: |
          The PATCH names only country_risk_score, so bank_name, swift_bic,
          country_code, credit_rating and confirmation_appetite_cents must all
          survive untouched while eligibility_score is re-derived from 810 to 510.
          The already CONFIRMED credit is NOT unwound - its confirmation_status
          stays CONFIRMED and confirming_line_used_cents stays 10000000 - yet the
          very next confirmation request naming the same bank is refused with 422
          ERR_CONFIRMING_BANK_INELIGIBLE because 65 breaches the risk ceiling of
          60. An implementation that treats PATCH as a full replace nulls the
          untouched fields; one that re-runs eligibility retroactively cancels the
          live confirmation.
