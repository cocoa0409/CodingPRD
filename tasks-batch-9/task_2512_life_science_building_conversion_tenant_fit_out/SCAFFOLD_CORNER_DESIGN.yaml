            - "${e1} == ERR_ASSESSMENT_NOT_FOUND"
            - "${e2} == ERR_SCOPE_ITEM_NOT_FOUND"
            - "${e3} == ERR_PROPOSAL_NOT_FOUND"
            - "${e4} == ERR_RESERVATION_NOT_FOUND"
            - "${e5} == ERR_PERMIT_NOT_FOUND"
            - "${e6} == ERR_AMENITY_NOT_FOUND"
