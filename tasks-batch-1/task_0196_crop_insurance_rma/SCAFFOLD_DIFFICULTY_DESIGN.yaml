  - rule_id: boundary_precision_check
    instances:
      - name: boundary_commission_tier_at_exactly_5000_dollars
        grounds:
          - calculations.agent_commission
          - entities.AgentCommission.fields.commission_rate
          - state_machines.Policy.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Numeric threshold boundary on total_premium_cents: at EXACTLY 500000c the
          0.08 tier applies (tp < 500000 is tier-1 0.10; tp <= 1000000 is tier-2 0.08),
          so the boundary value 500000 selects 0.08 -> commission_cents=40000. Reached
          via POST /policies/{id}/activate. (Inputs tuned so total_premium_cents=500000.)
        test_recipe:
          setup:
            - "YP election engineered so total_premium_cents == 500000 exactly"
            - "aph=200, cov=0.50 -> guar_bu=100, liability=100*4*100=40000c/ac;"
            - "per_acre_premium=round(40000*0.125*1.00)=5000c; one 100-ac share=1 unit -> total=500000c"
            - "Program base_premium_rate=0.125"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-11", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
