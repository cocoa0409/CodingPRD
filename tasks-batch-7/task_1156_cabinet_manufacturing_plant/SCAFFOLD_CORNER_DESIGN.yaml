        claim_type: action_endpoint
        grounds: [entities.Order.fields.route_stop_seq, "endpoints[POST /kcma/delivery-routes/{routeId}/assign-order]"]
        distinguishing_aspect: "route_stop_seq is assigned in accepted-assignment order: first assigned order gets 1, second gets 2 — not by id or creation order games."
        test_recipe:
          setup: ["Dealer L1; finish; two SUBMITTED BOX orders O1 O2 (cube 5.0 each: 24x30x12 qty 1); PLANNED route cap 100"]
          setup_api_calls:
