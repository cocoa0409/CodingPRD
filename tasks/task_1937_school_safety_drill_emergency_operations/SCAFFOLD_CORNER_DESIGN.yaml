  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_returns_412_and_version_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[requirement-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT with the version observed at creation succeeds and bumps version 1 -> 2; replaying the same stale expected_requirement_version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["site with FIRE requirement created (version 1 observed)"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
              captures: { req_id: $.data.id, req_v: $.data.version }
          trigger:
            - call: "PUT /drill-requirements/${req_id}"
              payload: { target_evac_seconds: 240, expected_requirement_version: "${req_v}" }
              as: DistrictSafetyCoordinator
              captures: { req_v2: $.data.version }
            - call: "PUT /drill-requirements/${req_id}"
              payload: { target_evac_seconds: 250, expected_requirement_version: "${req_v}" }
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "first PUT succeeded: version 1 -> 2 and target_evac_seconds == 240"
            - "second PUT with the stale version: http 412 and error_id == ERR_STALE_VERSION"
            - "target_evac_seconds remains 240 after the rejected write"

      - name: overdue_ca_flips_posture_at_day_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.compliance_posture_derivation, entities.CorrectiveAction.fields.is_overdue]
        distinguishing_aspect: "Overdue is strict (> due_date): on the due date itself the action is not overdue and the site stays ON_TRACK; one day later is_overdue flips true and posture degrades to AT_RISK."
        test_recipe:
          setup: ["site with ACTIVE EOP; drill COMPLETED and CLOSED-out review ACCEPTED; one corrective action OPEN with due_date 2026-10-15"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/after-action-reviews"
              payload: { findings_summary: "Findings", overall_rating: MEETS, evacuation_assessment: MET_STANDARD }
              as: SchoolSafetyOfficer
              captures: { aar_id: $.data.id }
            - call: "POST /after-action-reviews/${aar_id}/submit"
              as: SchoolSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /after-action-reviews/${aar_id}/decide"
              payload: { decision: ACCEPT }
              as: Principal
              as_user_id: "principal-1"
            - call: "POST /after-action-reviews/${aar_id}/corrective-actions"
              payload: { description: "Replace gate signage", priority: MEDIUM, due_date: "2026-10-15", assignee_name: "Facilities Lead" }
              as: SchoolSafetyOfficer
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "GET /sites/${site_id}"
              as: SchoolSafetyOfficer
              captures: { posture_on_due: $.data.compliance_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "GET /sites/${site_id}"
              as: SchoolSafetyOfficer
              captures: { posture_after: $.data.compliance_posture }
          assert:
            - "on 2026-10-15: CorrectiveAction.${ca_id}.is_overdue == false and posture_on_due == ON_TRACK"
            - "on 2026-10-16: CorrectiveAction.${ca_id}.is_overdue == true and posture_after == AT_RISK"

      - name: requirement_update_stales_draft_report
        claim_type: derived_field_reconciliation
        grounds: [endpoints, state_machines.ComplianceReport.DRAFT_to_STALE]
        distinguishing_aspect: "Changing the statutory configuration after a snapshot was taken marks the covering DRAFT report STALE; regeneration recomputes against the new requirement."
        test_recipe:
          setup: ["site with FIRE requirement required 2; DRAFT report for the full academic year"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harborview Middle", enrollment_count: 700, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { rep_id: $.data.id }
          trigger:
            - call: "PUT /drill-requirements/${req_id}"
              payload: { required_per_year: 3, expected_requirement_version: "${req_v}" }
              as: DistrictSafetyCoordinator
            - call: "POST /compliance-reports/${rep_id}/regenerate"
              as: DistrictSafetyCoordinator
          assert:
            - "after PUT: ComplianceReport.${rep_id}.status became STALE"
            - "after regenerate: status DRAFT and type_attainments[FIRE].required_count == 3"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds: [complexity_profile, calculations.drill_counter_reconciliation]
        distinguishing_aspect: "The create response itself shows status SCHEDULED, and an immediate GET on the site already reflects drills_scheduled_count == 1 (no read lag)."
        test_recipe:
          setup: ["site with FIRE requirement"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Maplewood K-8", enrollment_count: 850, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "GET /sites/${site_id}"
              as: SchoolSafetyOfficer
              captures: { scheduled_n: $.data.drills_scheduled_count }
          assert:
            - "create response: DrillEvent.${drill_id}.status == SCHEDULED"
            - "immediate GET: scheduled_n == 1"
