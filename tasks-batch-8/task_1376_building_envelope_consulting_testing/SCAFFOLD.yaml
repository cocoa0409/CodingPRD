    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Assembly[]"
    side_effects: []
  - method: GET
    path: "/engagements/{id}/assemblies/{assemblyId}"
    description: "Get an assembly"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: []
    output: Assembly
    side_effects: []

