  - method: GET
    path: "/operations/readiness-summary"
    description: "Computed read: site-level operational readiness — AED readiness counts, credential expiry pipeline, uncovered sessions and rooms out of standard."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor]
    code: 200
    input: [contract_id]
    output: { contract_id: string, aed_ready_count: integer, aed_not_ready_count: integer, credentials_expiring_soon: integer, credentials_expired: integer, staff_suspended_count: integer, sessions_at_risk: integer, rooms_restricted: integer, assets_out_of_service: integer }
    side_effects: []

  # ------------------------------------------------------------ writes: contract
  - method: POST
    path: "/client-contracts"
    description: "Create a client contract in DRAFT with its staffing model, fee structure and participation target."
    roles: [OperatorAdmin]
    code: 201
    input: [client_name, site_code, fee_structure, staffing_model, budgeted_staff_fte, participation_target_pct, term_start_on, term_end_on, "management_fee_cents?", "not_to_exceed_cents?"]
    output: ClientContract
    side_effects: ["status = DRAFT; revision_round = 0; ytd_billed_cents = 0; pending_penalty_cents = 0; uncovered_session_count = 0; eligible_member_count = 0"]

  - method: POST
    path: "/client-contracts/{id}/submit"
    description: "Submit a DRAFT contract for client approval."
    roles: [OperatorAdmin]
    code: 200
    input: []
    output: ClientContract
    side_effects: ["ClientContract DRAFT -> PENDING_CLIENT_APPROVAL"]

  - method: POST
    path: "/client-contracts/{id}/client-decision"
    description: "Client sponsor approves the pending contract or returns it for revision."
    roles: [ClientSponsor]
    code: 200
    input: [decision, "comment?"]
    output: ClientContract
    side_effects:
      - "APPROVE: PENDING_CLIENT_APPROVAL -> ACTIVE; approved_at set; deficiency-free CLOSED rooms open"
      - "RETURN: PENDING_CLIENT_APPROVAL -> DRAFT; revision_round += 1"

  - method: POST
    path: "/client-contracts/{id}/service-status"
    description: "Operator suspends, resumes or terminates service on a contract."
    roles: [OperatorAdmin]
    code: 200
    input: [action, "reason?"]
    output: ClientContract
    side_effects:
      - "SUSPEND: 4-link cascade offerings -> sessions -> assignments -> staff committed minutes; all rooms CLOSED"
      - "RESUME: PAUSED offerings reactivate; rooms reopen or go RESTRICTED by deficiency count"
      - "TERMINATE: same cascade plus members TERMINATED/REVOKED, waivers REVOKED, staff OFFBOARDED; from DRAFT it becomes WITHDRAWN"

  - method: POST
    path: "/client-contracts/{id}/amendments"
    description: "Create a successor DRAFT contract that supersedes this one, carrying forward the site code and optionally switching the fee structure (program evolution based on client goals)."
    roles: [OperatorAdmin]
    code: 201
    input: [fee_structure, staffing_model, budgeted_staff_fte, participation_target_pct, term_start_on, term_end_on, "management_fee_cents?", "not_to_exceed_cents?"]
    output: ClientContract
    side_effects: ["New ClientContract in DRAFT with supersedes_contract_id = {id}; the predecessor is untouched until it is terminated"]

  # --------------------------------------------------------------- writes: staff
  - method: POST
    path: "/staff-members"
    description: "Hire a staff member onto a contract with a cost rate; required_credential_types is derived from role_type by REQUIRED_CREDENTIALS_BY_ROLE."
    roles: [OperatorAdmin, SiteManager]
    code: 201
    input: [contract_id, full_name, role_type, employment_type, hourly_cost_cents]
    output: StaffMember
    side_effects: ["duty_status = ACTIVE_DUTY; readiness_index computed (0 while required credentials are unverified); committed_minutes_current_period = 0"]

  - method: POST
    path: "/staff-members/{id}/drills"
    description: "Record completion of emergency-response / AED drill training for a staff member."
    roles: [OperatorAdmin, SiteManager]
    code: 201
    input: [drill_on, "drill_type?"]
    output: StaffMember
    side_effects: ["last_drill_on = drill_on; readiness_index recomputed by calculations.staff_readiness_index"]

  - method: POST
    path: "/staff-members/{id}/duty-reinstate"
    description: "Return a suspended staff member to active duty once every required credential is current again."
    roles: [OperatorAdmin]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["SUSPENDED_FROM_DUTY -> ACTIVE_DUTY; readiness_index recomputed; previously vacated assignments are NOT restored"]

  - method: POST
    path: "/staff-credentials"
    description: "File a certification for verification."
    roles: [OperatorAdmin, SiteManager]
    code: 201
    input: [staff_member_id, credential_type, issuer, credential_number, expires_on]
    output: StaffCredential
    side_effects: ["status = PENDING_VERIFICATION; renewal_count = 0; readiness_index of the holder recomputed"]

  - method: POST
    path: "/staff-credentials/{id}/verify"
    description: "Accept or reject a pending certification. The holder may never decide their own credential."
    roles: [OperatorAdmin, SiteManager]
    code: 200
    input: [decision, "rejection_reason?"]
    output: StaffCredential
    side_effects:
      - "ACCEPT: PENDING_VERIFICATION -> VERIFIED; verified_at/verified_by_user_id set; holder readiness recomputed; holder may return to ACTIVE_DUTY"
      - "REJECT: PENDING_VERIFICATION -> REJECTED; holder suspended when the type was required"

  - method: POST
    path: "/staff-credentials/{id}/renew"
    description: "Re-file an expired or rejected certification with a new expiry, restarting the verification cycle."
    roles: [OperatorAdmin, SiteManager]
    code: 200
    input: [credential_number, expires_on]
    output: StaffCredential
    side_effects: ["EXPIRED|REJECTED -> PENDING_VERIFICATION; renewal_count += 1; verified_at and rejection_reason cleared"]

  # ------------------------------------------------------------ writes: facility
  - method: POST
    path: "/facility-rooms"
    description: "Register a room at a site."
    roles: [OperatorAdmin, SiteManager]
    code: 201
    input: [contract_id, room_name, room_type, max_occupancy]
    output: FacilityRoom
    side_effects: ["room_state = OPEN; open_deficiency_count = 0"]

  - method: POST
    path: "/facility-rooms/{id}/inspections"
    description: "Record a cleanliness and safety inspection; the score and deficiency count drive the room's posture."
    roles: [SiteManager, ComplianceAuditor]
    code: 201
    input: [inspection_on, cleanliness_score, deficiency_count, "notes?"]
    output: FacilityRoom
    side_effects:
      - "Failing inspection: OPEN -> RESTRICTED and sessions inside the lock window become CANCELLED_FACILITY with their assignments released"
      - "Passing inspection: RESTRICTED -> OPEN and open_deficiency_count = 0"

  - method: POST
    path: "/facility-assets"
    description: "Register equipment or an AED in a room."
    roles: [OperatorAdmin, SiteManager]
    code: 201
    input: [contract_id, room_id, asset_type, asset_tag, "service_interval_days?", "pad_expiry_on?", "battery_expiry_on?", "last_inspection_on?", "last_service_on?"]
    output: FacilityAsset
    side_effects: ["status = IN_SERVICE; readiness_status computed by calculations.aed_readiness_status (NOT_APPLICABLE for non-AED)"]

  - method: POST
    path: "/facility-assets/{id}/service-events"
    description: "Record an AED inspection, preventive service, completed repair, or take the asset out of service."
    roles: [SiteManager, OperatorAdmin]
    code: 201
    input: [event_type, "pad_expiry_on?", "battery_expiry_on?", "note?"]
    output: FacilityAsset
    side_effects:
      - "AED_INSPECTION: last_inspection_on = today; consumable expiries updated when supplied; readiness_status recomputed"
      - "PREVENTIVE_SERVICE: MAINTENANCE_DUE -> IN_SERVICE; last_service_on = today"
      - "TAKE_OUT_OF_SERVICE: -> OUT_OF_SERVICE; out_of_service_since = now; AED readiness -> NOT_READY"
      - "REPAIR_COMPLETE: OUT_OF_SERVICE -> IN_SERVICE; out_of_service_days_current_period accrued; readiness_status recomputed"

  # --------------------------------------------------------- writes: programming
  - method: POST
    path: "/program-offerings"
    description: "Create a program offering (group exercise, personal training or wellness challenge) with a participation target and member-class scope."
    roles: [SiteManager, OperatorAdmin]
    code: 201
    input: [contract_id, lead_staff_id, program_type, title, participation_target, max_participants_per_session, required_credential_type, "eligible_member_classes?"]
    output: ProgramOffering
    side_effects: ["status = DRAFT; eligible_member_classes defaults to [EMPLOYEE]; attainment figures initialised to 0"]

  - method: POST
    path: "/program-offerings/{id}/status-changes"
    description: "Activate, pause, resume or close an offering. Activation enforces lead credential currency, readiness threshold and site AED readiness."
    roles: [SiteManager, OperatorAdmin]
    code: 200
    input: [action, "reason?"]
    output: ProgramOffering
    side_effects:
      - "ACTIVATE: DRAFT -> ACTIVE after the readiness and AED gates"
      - "PAUSE: ACTIVE -> PAUSED and open sessions become CANCELLED_CLIENT with assignments released"
      - "RESUME: PAUSED -> ACTIVE"
      - "CLOSE: -> CLOSED and final_attainment_pct frozen"

  - method: POST
    path: "/program-sessions"
    description: "Schedule a session of an offering in a room."
    roles: [SiteManager, OperatorAdmin]
    code: 201
    input: [offering_id, room_id, scheduled_start_utc, scheduled_end_utc, forecast_attendance, "direct_supply_cost_cents?"]
    output: ProgramSession
    side_effects: ["status = SCHEDULED; scheduled_minutes derived from the interval; room conflict check uses the buffered closed interval"]

  - method: POST
    path: "/program-sessions/{id}/status-changes"
    description: "Start, complete or cancel a session."
    roles: [SiteManager, FitnessStaff, OperatorAdmin]
    code: 200
    input: [action, "cancel_reason?"]
    output: ProgramSession
    side_effects:
      - "START: STAFFED -> IN_PROGRESS after the room and AED gates"
      - "COMPLETE: IN_PROGRESS -> COMPLETED; actual_attendance set; confirmed assignments COMPLETED with labor cost by calculations.session_labor_cost; attainment recomputed"
      - "CANCEL: branch on cancel_reason into CANCELLED_CLIENT / CANCELLED_NO_COVER / CANCELLED_FACILITY with the branch-specific side effects of §1.2"

  - method: POST
    path: "/staff-assignments"
    description: "Assign a staff member to a session as LEAD or SUPPORT; paid minutes are booked at creation."
    roles: [SiteManager, OperatorAdmin]
    code: 201
    input: [session_id, staff_member_id, role_on_session]
    output: StaffAssignment
    side_effects: ["status = ASSIGNED; paid_minutes = scheduled_minutes + LEAD_SETUP_MIN for LEAD; StaffMember.committed_minutes_current_period += paid_minutes; readiness_index recomputed"]

  - method: POST
    path: "/staff-assignments/{id}/confirm"
    description: "Staff member (or their site manager) confirms an assignment; confirming the LEAD staffs the session."
    roles: [FitnessStaff, SiteManager]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["ASSIGNED -> CONFIRMED; confirmed_at set; session SCHEDULED|STAFFING_AT_RISK -> STAFFED when the assignment is LEAD"]

  - method: POST
    path: "/staff-assignments/{id}/release"
    description: "Release an assignment, returning the staff member's committed minutes."
    roles: [SiteManager, OperatorAdmin]
    code: 200
    input: ["reason?"]
    output: StaffAssignment
    side_effects: ["-> RELEASED; committed_minutes_current_period compensated; session -> STAFFING_AT_RISK and offering.coverage_gap_count += 1 when the LEAD is released"]

  # -------------------------------------------------------------- writes: member
  - method: POST
    path: "/members"
    description: "Enrol an employee, dependent or retiree against a contract."
    roles: [ClientSponsor, OperatorAdmin]
    code: 201
    input: [contract_id, member_class, full_name, "employee_number?", "sponsor_member_id?", "health_data_consent?"]
    output: Member
    side_effects: ["eligibility_status = PENDING_VERIFICATION; access_status = NO_BADGE; incentive_points_balance = 0; health_data_consent defaults to false"]

  - method: POST
    path: "/members/{id}/eligibility-decisions"
    description: "Verify, lapse, reinstate or terminate a member's eligibility."
    roles: [ClientSponsor, OperatorAdmin]
    code: 200
    input: [action, "reason?"]
    output: Member
    side_effects:
      - "VERIFY: PENDING_VERIFICATION -> ELIGIBLE; contract.eligible_member_count += 1"
      - "LAPSE: ELIGIBLE -> LAPSED; count decremented; ACTIVE badge revoked; sponsored dependents lapse too"
      - "REINSTATE: LAPSED -> ELIGIBLE; count incremented; badge stays revoked"
      - "TERMINATE: -> TERMINATED; badge revoked; SIGNED waiver REVOKED; dependents terminated"

  - method: POST
    path: "/members/{id}/badge-access"
    description: "Grant or revoke facility badge access (access control integration). Independent of the eligibility dimension."
    roles: [SiteManager, OperatorAdmin]
    code: 200
    input: [action, "badge_number?"]
    output: Member
    side_effects: ["GRANT: NO_BADGE|REVOKED -> ACTIVE after the eligibility and waiver gates", "REVOKE: ACTIVE -> REVOKED"]

  - method: POST
    path: "/members/{id}/waivers"
    description: "Record a signed liability waiver for a member. Supersedes any prior SIGNED waiver, so the member's version must be current."
    roles: [Member, SiteManager, OperatorAdmin]
    code: 201
    input: [waiver_version_code, expires_on, acknowledged_health_disclosure, expected_member_version]
    output: LiabilityWaiver
    side_effects: ["New waiver SIGNED; prior SIGNED waiver -> SUPERSEDED; member.current_waiver_id updated; member.version bumped"]

  - method: POST
    path: "/participation-records"
    description: "Check a member into a session (participation tracking with incentive integration). health_metrics_note may only be supplied for consenting members."
    roles: [FitnessStaff, SiteManager, Member]
    code: 201
    input: [member_id, session_id, "health_metrics_note?"]
    output: ParticipationRecord
    side_effects:
      - "status = COUNTED; recorded_by_role derived from X-Role"
      - "points_awarded / points_capped / streak_bonus_applied by calculations.incentive_points_award; Member.incentive_points_balance += points_awarded"
      - "session.actual_attendance += 1; offering.counted_participation_total += 1; attainment recomputed"

  - method: POST
    path: "/participation-records/{id}/void"
    description: "Void a participation record (mis-scan, wrong member), compensating the incentive balance."
    roles: [SiteManager]
    code: 200
    input: [void_reason]
    output: ParticipationRecord
    side_effects: ["COUNTED -> VOIDED; Member.incentive_points_balance -= points_awarded; attendance and attainment recomputed"]

  # ------------------------------------------------------------ writes: incident
  - method: POST
    path: "/incident-reports"
    description: "File an incident report, optionally naming a member and an involved asset, and whether an AED was deployed."
    roles: [FitnessStaff, SiteManager]
    code: 201
    input: [contract_id, reported_by_staff_id, occurred_at_utc, severity, cause_category, narrative, "member_id?", "asset_id?", "aed_deployed?"]
    output: IncidentReport
    side_effects: ["status = REPORTED; return_count = 0"]

  - method: POST
    path: "/incident-reports/{id}/review"
    description: "Take an incident into review. The filer may not review their own report. A serious equipment incident pulls the asset and its room out of service."
    roles: [SiteManager, ComplianceAuditor]
    code: 200
    input: ["review_note?"]
    output: IncidentReport
    side_effects: ["REPORTED -> UNDER_REVIEW; reviewed_by_user_id set", "3-link cascade for SERIOUS + EQUIPMENT: asset OUT_OF_SERVICE -> room RESTRICTED -> imminent sessions CANCELLED_FACILITY with assignments released"]

  - method: POST
    path: "/incident-reports/{id}/return"
    description: "Return an incident for more information, restarting the review loop."
    roles: [SiteManager, ComplianceAuditor]
    code: 200
    input: [return_note]
    output: IncidentReport
    side_effects: ["UNDER_REVIEW -> REPORTED; return_count += 1; reviewed_by_user_id cleared; cascade effects are not reversed"]

  - method: POST
    path: "/incident-reports/{id}/file-claim"
    description: "File a liability claim on a reviewed incident. Requires a subject member with a waiver on file."
    roles: [ComplianceAuditor]
    code: 200
    input: [claim_reference]
    output: IncidentReport
    side_effects: ["UNDER_REVIEW -> CLAIM_FILED"]

  - method: POST
    path: "/incident-reports/{id}/close"
    description: "Close an incident with or without a claim."
    roles: [ComplianceAuditor]
    code: 200
    input: [closure_note]
    output: IncidentReport
    side_effects: ["UNDER_REVIEW -> CLOSED_NO_CLAIM or CLAIM_FILED -> CLAIM_CLOSED"]

  # ------------------------------------------------------------- writes: billing
  - method: POST
    path: "/monthly-invoices"
    description: "Draft the invoice for a contract period. Pins the fee structure and computes every money component; supersedes any existing DRAFT for the period."
    roles: [OperatorAdmin]
    code: 201
    input: [contract_id, period_month, expected_contract_version]
    output: MonthlyInvoice
    side_effects: ["status = DRAFT; fee_structure_snapshot pinned; calculations.monthly_invoice_amounts run; prior DRAFT for the period -> SUPERSEDED; contract.version bumped"]

  - method: POST
    path: "/monthly-invoices/{id}/issue"
    description: "Issue a drafted invoice to the client."
    roles: [OperatorAdmin]
    code: 200
    input: []
    output: MonthlyInvoice
    side_effects: ["DRAFT -> ISSUED; issued_at set; contract.ytd_billed_cents += net_amount_cents"]

  - method: POST
    path: "/monthly-invoices/{id}/dispute"
    description: "Client disputes an issued invoice, reversing the billed amount from the contract ledger."
    roles: [ClientSponsor]
    code: 200
    input: [dispute_reason]
    output: MonthlyInvoice
    side_effects: ["ISSUED -> DISPUTED; contract.ytd_billed_cents -= net_amount_cents; disputed_at set"]

  - method: POST
    path: "/monthly-invoices/{id}/rebill"
    description: "Recompute a disputed invoice from current period data under the pinned fee structure and return it to DRAFT."
    roles: [OperatorAdmin]
    code: 200
    input: []
    output: MonthlyInvoice
    side_effects: ["DISPUTED -> DRAFT; rebill_count += 1; issued_at cleared; calculations.monthly_invoice_amounts re-run"]

  - method: POST
    path: "/monthly-invoices/{id}/pay"
    description: "Client records payment of an issued invoice."
    roles: [ClientSponsor]
    code: 200
    input: ["payment_reference?"]
    output: MonthlyInvoice
    side_effects: ["ISSUED -> PAID; paid_at set; ytd_billed_cents unchanged"]

  # ---------------------------------------------------------- operations + clock
  - method: POST
    path: "/operations/daily-readiness-run"
    description: |
      Ops-run checkpoint evaluated against the logical clock, in fixed step order:
      (1) credential expiry transitions VERIFIED -> EXPIRING_SOON / EXPIRED and the
      4-link staffing cascade; (2) staff readiness recomputation; (3) waiver expiry
      SIGNED -> EXPIRED with badge revocation; (4) badge revocation for lapsed
      members; (5) asset maintenance-due and AED readiness recomputation;
      (6) offering attainment recomputation; (7) STAFFING_AT_RISK sessions inside
      the lock window become CANCELLED_NO_COVER with penalty accrual.
    roles: [OperatorAdmin]
    code: 200
    input: [contract_id]
    output: { contract_id: string, run_at_utc: string, credentials_expiring_soon: integer, credentials_expired: integer, staff_suspended: integer, assignments_vacated: integer, sessions_at_risk: integer, sessions_cancelled_no_cover: integer, waivers_expired: integer, badges_revoked: integer, assets_maintenance_due: integer, aed_not_ready: integer, penalty_accrued_cents: integer }
    side_effects: ["Every transition listed in the description, in that order; contract.uncovered_session_count and contract.pending_penalty_cents updated"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; all expiry, window and period rules read this clock."
    roles: [OperatorAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["No entity mutation; subsequent requests and every daily-readiness-run evaluate dates against the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-Role header missing, empty, or X-Role not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-Role is valid but not listed in the target endpoint's roles"
  - id: ERR_FORBIDDEN_SCOPE
    http: 403
    condition: "Entity-backed role acting on a resource it does not own (ClientSponsor on another contract, Member on another member, FitnessStaff confirming someone else's assignment)"
  - id: ERR_SELF_VERIFICATION_FORBIDDEN
    http: 403
    condition: "Verifier's X-User-ID equals StaffCredential.staff_member_id"
  - id: ERR_SELF_REVIEW_FORBIDDEN
    http: 403
    condition: "Reviewer's X-User-ID equals IncidentReport.reported_by_staff_id"
  - id: ERR_HEALTH_DATA_FORBIDDEN
    http: 403
    condition: "health_metrics_note supplied for a member whose health_data_consent is false, or read attempted by a role other than ComplianceAuditor / the owning Member"

  # ---- existence ------------------------------------------------------------
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id in path or body does not resolve"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "staff_member_id / lead_staff_id / reported_by_staff_id does not resolve"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "Credential id in path does not resolve"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "room_id in path or body does not resolve"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset_id in path or body does not resolve"
  - id: ERR_OFFERING_NOT_FOUND
    http: 404
    condition: "offering_id in path or body does not resolve"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "session_id in path or body does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Assignment id in path does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id / sponsor_member_id in path or body does not resolve"
  - id: ERR_WAIVER_NOT_FOUND
    http: 404
    condition: "Waiver id in path does not resolve"
  - id: ERR_PARTICIPATION_NOT_FOUND
    http: 404
    condition: "Participation record id in path does not resolve"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "Incident id in path does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "Invoice id in path does not resolve"

  # ---- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, enum out of range, cleanliness_score outside 0–100, participation_target_pct outside 1–100, term_end_on <= term_start_on, scheduled_end_utc <= scheduled_start_utc, pagination limit outside 1–100 or negative offset, malformed timestamp"

  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version != Member.version on POST /members/{id}/waivers"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version != ClientContract.version on POST /monthly-invoices"

  # ---- state ----------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested action has no transition from the entity's current state in §1.2"
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "Action attempted on an entity in a terminal state (TERMINATED/WITHDRAWN contract, CLOSED offering, CANCELLED_*/COMPLETED session, RELEASED/COMPLETED assignment, TERMINATED member, PAID/SUPERSEDED invoice, VOIDED record, CLOSED_NO_CLAIM/CLAIM_CLOSED incident)"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Operation requires ClientContract.status == ACTIVE (offering activation, member verification, room reopening, session scheduling)"
  - id: ERR_CONTRACT_NOT_PENDING
    http: 409
    condition: "client-decision called on a contract that is not PENDING_CLIENT_APPROVAL"
  - id: ERR_OFFERING_NOT_ACTIVE
    http: 409
    condition: "Session scheduling or a resume/pause action attempted on an offering in the wrong status"
  - id: ERR_SESSION_NOT_STAFFED
    http: 409
    condition: "START attempted on a session whose status is not STAFFED (highest-priority failure even when the AED gate would also fail)"
  - id: ERR_SESSION_NOT_IN_PROGRESS
    http: 409
    condition: "Check-in attempted against a session whose status is not IN_PROGRESS"
  - id: ERR_CREDENTIAL_NOT_PENDING
    http: 409
    condition: "verify called on a credential that is not PENDING_VERIFICATION"
  - id: ERR_CREDENTIAL_NOT_RENEWABLE
    http: 409
    condition: "renew called on a credential that is neither EXPIRED nor REJECTED"
  - id: ERR_INCIDENT_NOT_UNDER_REVIEW
    http: 409
    condition: "return, file-claim or close-without-claim called on an incident that is not UNDER_REVIEW"
  - id: ERR_INVOICE_NOT_DRAFT
    http: 409
    condition: "issue called on an invoice that is not DRAFT"
  - id: ERR_INVOICE_NOT_ISSUED
    http: 409
    condition: "dispute or pay called on an invoice that is not ISSUED"
  - id: ERR_INVOICE_NOT_DISPUTED
    http: 409
    condition: "rebill called on an invoice that is not DISPUTED"
  - id: ERR_AMENDMENT_NOT_ALLOWED
    http: 409
    condition: "amendments called on a contract that is not ACTIVE or SUSPENDED"
  - id: ERR_OPEN_SESSIONS
    http: 409
    condition: "CLOSE attempted on an offering that still has SCHEDULED, STAFFED, STAFFING_AT_RISK or IN_PROGRESS sessions"

  # ---- safety / compliance --------------------------------------------------
  - id: ERR_CREDENTIAL_NOT_VERIFIED
    http: 422
    condition: "The staff member does not hold the required credential type in status VERIFIED or EXPIRING_SOON"
  - id: ERR_CREDENTIAL_EXPIRED_ON_FILE
    http: 422
    condition: "ACCEPT decision on a credential whose expires_on is already at or before the logical clock date"
  - id: ERR_REJECTION_REASON_REQUIRED
    http: 422
    condition: "REJECT decision without a non-empty rejection_reason"
  - id: ERR_RENEWAL_DATE_INVALID
    http: 422
    condition: "renew supplies an expires_on at or before the logical clock date"
  - id: ERR_AED_NOT_READY
    http: 422
    condition: "No FacilityAsset of the contract has asset_type == AED and readiness_status == READY (PADS_EXPIRING does not qualify)"
  - id: ERR_ROOM_NOT_OPEN
    http: 422
    condition: "Target FacilityRoom.room_state is RESTRICTED or CLOSED"
  - id: ERR_WAIVER_REQUIRED
    http: 422
    condition: "Member has no LiabilityWaiver in status SIGNED with expires_on >= the logical clock date"
  - id: ERR_STAFF_NOT_ON_DUTY
    http: 422
    condition: "StaffMember.duty_status is SUSPENDED_FROM_DUTY or OFFBOARDED"
  - id: ERR_READINESS_BELOW_THRESHOLD
    http: 422
    condition: "Lead StaffMember.readiness_index < 70 at offering activation"
  - id: ERR_SITE_MANAGER_REQUIRED
    http: 422
    condition: "submit called on a contract with no ACTIVE_DUTY StaffMember whose role_type is SITE_MANAGER"
  - id: ERR_CLAIM_SUBJECT_REQUIRED
    http: 422
    condition: "file-claim on an incident with no member_id, or whose subject member has no waiver on file"

  # ---- referential / structural --------------------------------------------
  - id: ERR_CROSS_CONTRACT_REFERENCE
    http: 422
    condition: "Referenced entities belong to different ClientContracts (room vs offering, staff vs session, member vs session, asset vs room)"
  - id: ERR_SPONSOR_NOT_ELIGIBLE
    http: 422
    condition: "DEPENDENT member has no sponsor, or the sponsor is not an ELIGIBLE EMPLOYEE, or a non-DEPENDENT supplies sponsor_member_id"
  - id: ERR_SITE_CODE_CONFLICT
    http: 409
    condition: "site_code already used by a ClientContract whose status is not WITHDRAWN"
  - id: ERR_ASSET_TAG_CONFLICT
    http: 409
    condition: "asset_tag already used within the same ClientContract"
  - id: ERR_DUPLICATE_LEAD_ASSIGNMENT
    http: 409
    condition: "A second LEAD assignment is created for a session that already has one in status ASSIGNED or CONFIRMED"

  # ---- temporal -------------------------------------------------------------
  - id: ERR_ROOM_TIME_CONFLICT
    http: 409
    condition: "Buffered closed interval of the new session intersects another non-cancelled session in the same room (touching endpoints conflict)"
  - id: ERR_STAFF_TIME_CONFLICT
    http: 409
    condition: "Half-open unbuffered interval of the new assignment intersects another live assignment of the same staff member (adjacency is allowed)"
  - id: ERR_SESSION_OUT_OF_TERM
    http: 422
    condition: "scheduled_start_utc is in the past, or the session falls outside the contract term"
  - id: ERR_SESSION_START_TOO_EARLY
    http: 422
    condition: "START attempted more than SESSION_START_GRACE_MIN minutes before scheduled_start_utc"

  # ---- capacity / eligibility constraints ----------------------------------
  - id: ERR_SESSION_CAPACITY_EXCEEDED
    http: 409
    condition: "Counted participation already equals ProgramOffering.max_participants_per_session"
  - id: ERR_ROOM_OCCUPANCY_EXCEEDED
    http: 422
    condition: "forecast_attendance exceeds FacilityRoom.max_occupancy at scheduling time (business_constraint, evaluated with priority 38 — after the room-state, cross-contract, room-conflict and term checks)"
  - id: ERR_MEMBER_CLASS_NOT_ELIGIBLE
    http: 422
    condition: "Member.member_class is not in ProgramOffering.eligible_member_classes"
  - id: ERR_ACCESS_NOT_ACTIVE
    http: 422
    condition: "Check-in attempted while access_status != ACTIVE or eligibility_status != ELIGIBLE"
  - id: ERR_ELIGIBILITY_NOT_VERIFIED
    http: 422
    condition: "Badge grant attempted while the member's eligibility_status is not ELIGIBLE"
  - id: ERR_DUPLICATE_CHECK_IN
    http: 409
    condition: "A COUNTED ParticipationRecord already exists for the same member and session"

  # ---- fiscal ---------------------------------------------------------------
  - id: ERR_FEE_TERMS_INVALID
    http: 422
    condition: "MANAGEMENT_FEE contract without management_fee_cents or carrying not_to_exceed_cents, or COST_PLUS contract with the mirror-image problem"
  - id: ERR_INVOICE_PERIOD_CONFLICT
    http: 409
    condition: "Another invoice for the same contract and period_month is ISSUED, DISPUTED or PAID"
  - id: ERR_NTE_EXHAUSTED
    http: 422
    condition: "COST_PLUS contract whose not_to_exceed_cents minus ytd_billed_cents leaves no headroom at issue time"
  - id: ERR_OPEN_INVOICES
    http: 409
    condition: "TERMINATE attempted while the contract has an invoice in status DRAFT or DISPUTED"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:

  - name: OperatorAdmin
    description: "Contract fitness center operator's head-office administrator: commercial terms, hiring, billing and the daily readiness run."
    identity: "opaque"
    exclusive_operations:
      - "POST /client-contracts"
      - "POST /client-contracts/{id}/submit"
      - "POST /client-contracts/{id}/service-status"
      - "POST /client-contracts/{id}/amendments"
      - "POST /staff-members/{id}/duty-reinstate"
      - "POST /monthly-invoices"
      - "POST /monthly-invoices/{id}/issue"
      - "POST /monthly-invoices/{id}/rebill"
      - "POST /operations/daily-readiness-run"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /staff-members, POST /staff-credentials, POST /staff-credentials/{id}/verify, POST /staff-credentials/{id}/renew, POST /staff-members/{id}/drills (with SiteManager)"
      - "POST /facility-rooms, POST /facility-assets, POST /facility-assets/{id}/service-events (with SiteManager)"
      - "POST /program-offerings, POST /program-offerings/{id}/status-changes, POST /program-sessions, POST /program-sessions/{id}/status-changes, POST /staff-assignments, POST /staff-assignments/{id}/release (with SiteManager)"
      - "POST /members, POST /members/{id}/eligibility-decisions (with ClientSponsor); POST /members/{id}/badge-access, POST /members/{id}/waivers (with SiteManager / Member)"
      - "Every GET except GET /members/{id}/waivers-scoped member self-reads"

  - name: SiteManager
    description: "On-site manager of the fitness center: programming, staffing, facility standards and participation operations."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /participation-records/{id}/void"
      - "POST /facility-rooms/{id}/inspections (shared only with ComplianceAuditor)"
    shared_operations:
      - "POST /staff-members, POST /staff-credentials, POST /staff-credentials/{id}/verify (never on their own credential), POST /staff-credentials/{id}/renew, POST /staff-members/{id}/drills (with OperatorAdmin)"
      - "POST /facility-rooms, POST /facility-assets, POST /facility-assets/{id}/service-events (with OperatorAdmin)"
      - "POST /program-offerings, POST /program-offerings/{id}/status-changes, POST /program-sessions, POST /program-sessions/{id}/status-changes, POST /staff-assignments, POST /staff-assignments/{id}/confirm, POST /staff-assignments/{id}/release"
      - "POST /members/{id}/badge-access, POST /members/{id}/waivers, POST /participation-records"
      - "POST /incident-reports, POST /incident-reports/{id}/review (never their own report), POST /incident-reports/{id}/return"
      - "Operational GETs across staff, facility, programming, members, participation and incidents"

  - name: FitnessStaff
    description: "Instructors, personal trainers and wellness coordinators working sessions on site."
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "POST /staff-assignments/{id}/confirm (only for their own assignment)"
      - "POST /program-sessions/{id}/status-changes (START / COMPLETE)"
      - "POST /participation-records (checking members in)"
      - "POST /incident-reports"
      - "GET /program-sessions, GET /program-sessions/{id}, GET /staff-assignments, GET /staff-assignments/{id}, GET /participation-records (health_metrics_note always null)"

  - name: ClientSponsor
    description: "Corporate client's benefits sponsor: approves terms, owns member eligibility, disputes and pays invoices, reads utilization."
    identity: "entity_backed:ClientContract"
    exclusive_operations:
      - "POST /client-contracts/{id}/client-decision"
      - "POST /monthly-invoices/{id}/dispute"
      - "POST /monthly-invoices/{id}/pay"
    shared_operations:
      - "POST /members, POST /members/{id}/eligibility-decisions (with OperatorAdmin)"
      - "GET /client-contracts, GET /client-contracts/{id}, GET /client-contracts/{id}/utilization-report (own contract only), GET /facility-rooms, GET /program-offerings, GET /program-offerings/{id}/attainment, GET /program-sessions, GET /members, GET /monthly-invoices"

  - name: Member
    description: "Employee, dependent or retiree using the fitness center."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /members/{id}/waivers (own record only), POST /participation-records (self check-in only)"
      - "GET /members/{id}, GET /members/{id}/waivers, GET /liability-waivers/{id}, GET /participation-records, GET /participation-records/{id} (own records; health_metrics_note visible)"

  - name: ComplianceAuditor
    description: "Independent risk and compliance reviewer: incident adjudication, liability claims, inspection audits and unrestricted health-data access."
    identity: "opaque"
    exclusive_operations:
      - "POST /incident-reports/{id}/file-claim"
      - "POST /incident-reports/{id}/close"
    shared_operations:
      - "POST /facility-rooms/{id}/inspections (with SiteManager)"
      - "POST /incident-reports/{id}/review, POST /incident-reports/{id}/return (with SiteManager)"
      - "Read-only access to every GET, including health_metrics_note projection and GET /client-contracts/{id}/utilization-report for any contract"
